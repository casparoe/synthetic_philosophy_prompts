answer: |-
  You have stumbled onto one of the oldest, thorniest problems in political philosophy. It is known simply as **"The Boundary Problem."**

  Your brother-in-law is giving you the *legal* answer (positive law: "this is the rule"), but you are asking for the *normative* answer (political theory: "why is this rule just?"). Your gut feeling is not just valid; it is backed by centuries of debate about what actually constitutes a democratic constituency.

  There is no single mathematical formula that solves this perfectly, but there are rigorous frameworks that distinguish between "arbitrary lines" and "legitimate jurisdictions." Here is the intellectual scaffolding you can use to bolster your reporting and your own understanding.

  ### 1. The "All-Affected" vs. "All-Subjected" Principles
  You correctly identified the weakness in the "let everyone affected vote" argument. In political theory, this is the **All-Affected Interests Principle**. As you noted, if taken literally, it leads to infinite regress (the "butterfly effect" problem). If a factory opens in County A, it might lower global steel prices, affecting a worker in County Z. Does County Z get a vote?

  To solve this, theorists like Robert Dahl and Frederick Whelan propose a refinement: **The All-Subjected Principle.**

  *   **Affected:** You experience a consequence (e.g., the price of GPUs goes down because of the data center).
  *   **Subjected:** You are under the *coercive authority* of the decision, or you bear a *structural burden* that you cannot easily avoid.

  In your story, the neighbors over the county line are not just "affected" in a ripple-effect sense; they are **subjected to a depletion of a common-pool resource** that they have no legal mechanism to stop. They are being coerced by the decision without representation.

  **The Rigorous Test:** A legitimate boundary exists where the *capacity to exit* or *avoid the cost* ends. If a voter in the approving county lives on the other side of the aquifer, they can vote to drain water they don't rely on. They can "exit" the consequence. The neighbors cannot. Therefore, the boundary of the vote should align with the boundary of the *inescapable consequence*.

  ### 2. The Problem of Externalities
  In economics and law, what you are describing is a **negative externality**. This occurs when a transaction between two parties (the county and the data center) imposes a cost on a third party (the neighbors) who is not part of the transaction.

  Democratic theory generally holds that jurisdictions should be drawn to **internalize externalities.**
  *   **Small Externalities:** If a county votes to build a park, the noise might drift over the line. This is a trivial externality. We accept the boundary line because the cost of negotiating with the neighbor is higher than the impact on the neighbor.
  *   **Large/Existential Externalities:** If a county votes to drain an aquifer that sustains life in the next county, the externality is catastrophic.

  **The Sturdy Argument:** The current setup is not "unfair" in a vague moral sense; it is **structurally inefficient.** It allows one jurisdiction to export costs to another. When boundaries allow for the exportation of significant costs, the system creates a "race to the bottom" where counties compete to sacrifice shared resources for local gain.

  ### 3. The "Functional" vs. "Territorial" District
  Your brother-in-law is relying on **Territorial Representation** (you vote where you sleep). However, modern governance often uses **Functional Representation** for specific issues.

  We already accept this in other contexts without realizing it:
  *   **School Boards:** Often cover specific districts that don't align with city limits.
  *   **Water Districts:** In many Western states, water rights are managed by hydrological boundaries, not political ones.
  *   **Air Quality Boards:** These often cover multi-county "basins" because smoke doesn't read maps.

  **The Fix:** The rigorous solution isn't necessarily to let the neighbors vote in the *county commission election* (which would indeed blur all lines). The solution is to move the *permitting authority* to a body whose boundaries match the resource.
  *   If the resource is an aquifer, the permitting body should be a **Regional Water Authority**.
  *   If the impact is regional traffic, it should be a **Council of Governments**.

  If the county commission is making the decision, they are acting outside their functional competence. They are making a hydrological decision with a political map.

  ### 4. Why the "Infinite Regress" Doesn't Have to Happen
  You worried that "everyone is affected a little." Political scientists handle this by applying a **Threshold of Significance.**

  To have standing (a right to be in the room), the impact must be:
  1.  **Direct:** Not a ripple effect through a market.
  2.  **Significant:** It alters your baseline security or property rights.
  3.  **Specific:** It applies to you in a way distinct from the general public.

  The neighbors' wells running dry meets all three. A person 50 miles away worrying about "climate change" generally does not (in a legal/administrative sense). Drawing the line at "hydrological impact" is scientifically rigorous and legally defensible. It does not require enfranchising the whole state; it requires enfranchising the **watershed.**

  ### 5. Precedents for Your Story
  If you are looking for real-world examples of this being solved (or fought over), look into:
  *   **The Public Trust Doctrine:** In some states (like California and New Jersey), water and air are held in trust by the state for *all* citizens, meaning local counties *cannot* legally deplete them to the detriment of neighbors, regardless of voting rights.
  *   **Interstate Compacts:** The Colorado River Compact is an agreement between multiple states to manage a shared resource. It acknowledges that political lines cannot override hydrological reality.
  *   **Extraterritorial Jurisdiction (ETJ):** Many municipalities have ETJ powers where they can regulate land use just outside their city limits specifically to prevent conflicts like this.

  ### Summary for your Reporting
  You can move past "it feels unfair" to "this is a design flaw in fragmented governance."

  1.  **The Boundary Problem:** Democracy requires boundaries, but fixed boundaries fail when resources are fluid.
  2.  **Cost Exporting:** The current system allows one group to vote themselves a subsidy paid for by another group (the water).
  3.  **The Mismatch:** The political jurisdiction (county) does not match the functional jurisdiction (aquifer).

  The "sturdy" argument is that **democratic legitimacy requires a congruence between those who decide and those who bear the risk.** When the map of the vote does not match the map of the consequence, the decision is technically democratic but functionally tyrannical.

  You don't need to argue that *everyone* affected should vote. You only need to argue that the **unit of governance must match the unit of impact.** When the impact is regional, the governance must be regional. Anything less is just cost-exporting disguised as local control.
