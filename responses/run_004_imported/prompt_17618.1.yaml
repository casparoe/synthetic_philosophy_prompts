      *   *Refined Overlooked Point:* **Selection Bias within Subgroups.** Renata assumes the 30 FT online students are comparable to the 270 FT in-person students. They likely aren't (early adopters, tech-comfortable, etc.). Owen focuses on Part-timers. Both miss that *neither* subgroup is immune to selection bias. The only way to know is a randomized trial or a natural experiment.
