answer: |-
  This is a textbook instantiation of the "Problem of Resultant Moral Luck," and both friends are instinctively recapitulating centuries of jurisprudence and moral philosophy without knowing it. Here is the breakdown of the exchanges, the missing literature, and the verdict.

  ### The Exchange Breakdown

  **(1) Marcus's Opening (The Control Principle)**
  *   **Verdict:** **Marcus wins.**
  *   **Why:** Marcus is invoking the "Control Principle": moral assessment should only apply to what is within an agent's control. Since the drivers' choices and capacities were identical, the only variable was external (the pedestrian's presence). Philosophically, punishing someone for factors outside their control is the definition of injustice. Marcus correctly identifies that the 12-year gap cannot be justified by *culpability*, only by *consequence*.

  **(2) Deb's Reply (Retributive Intuition)**
  *   **Verdict:** **Deb wins.**
  *   **Why:** Deb correctly identifies that our moral and legal practices are not purely control-based; they are hybrid. The distinction between murder and attempted murder is the strongest evidence that human morality is inherently outcome-sensitive. We feel a qualitatively different emotional response to a dead body than to a near-miss, and Deb is right that retributive justice is partly about calibrating societal condemnation to the actual harm done, not just the intent.

  **(3) Marcus's Counter (The Regress & Deterrence)**
  *   **Verdict:** **Marcus wins the pivot, but loses the example.**
  *   **Why:** Marcus makes a strong theoretical move by shifting from retribution to consequentialism (deterrence). If the goal is to stop drunk driving, the punishment should attach to the risky *choice*, not the random *result*. However, his "heart attack two years later" example is a strawman; it conflates *outcome sensitivity* with *infinite causal chains*. He forces Deb to explain where the line is drawn, which advances the debate, but his specific example is legally naive.

  **(4) Deb's Counter (Proximate Cause & Policy)**
  *   **Verdict:** **Deb wins.**
  *   **Why:** Deb successfully defends the legal framework. First, she notes that the law already has built-in circuit breakers (proximate cause/foreseeability) to stop Marcus's regress. Second, and more devastatingly, she points out the policy implication of Marcus's view: to be consistent, we would have to punish the "lucky" drunk driver almost as harshly as the "unlucky" one. Since society refuses to do that (and arguably shouldn't), Marcus's pure control principle collapses under practical weight. She exposes that Marcus wants the moral comfort of his theory without the draconian policy costs.

  ### What's Missing from the Literature

  If you were to bring this into a seminar on legal philosophy, here are the concepts both are circling but not naming:

  1.  **Resultant Moral Luck (Thomas Nagel):** This is the specific name for Marcus's complaint. Nagel argues that we are trapped in a contradiction: we believe in the Control Principle, yet we constantly judge people based on resultant luck. There is no clean philosophical solution, only a recognition of the paradox.
  2.  **The Hybrid Theory of Punishment:** Most modern legal systems are not purely retributive or purely consequentialist. They punish the *wrongfulness* of the act (DUI) via fines/probation and the *harm* of the result (Vehicular Homicide) via prison. They are effectively punishing two different things simultaneously.
  3.  **The Expressive Function of Law:** Deb touches on this, but doesn't name it. Punishment isn't just about deterrence or desert; it's a communal ritual that expresses the value of what was lost. A decade in prison for the fatality isn't just about the driver; it's a societal statement that a human life is worth more than a fender bender.
  4.  **The "Equal Punishment for Riskers" Solution:** Deb mentions this in move (4), but it's a serious proposal in law and economics (e.g., Steven Shavell). If we truly cared about ex ante risk, we would massively increase penalties for *all* DUIs and reduce the penalty gap for fatalities. The fact that we don't suggests our legal system is more retributive than consequentialist.

  ### Overall Lean

  Marcus is right about the moral paradox, but Deb is right about the legal necessity, so I side with the law's compromise: we punish the choice to drive drunk, but we reserve the heaviest condemnation for the choice that actually destroys a life.
