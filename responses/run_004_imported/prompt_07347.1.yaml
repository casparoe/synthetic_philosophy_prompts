      *   1. KL Divergence cap.
      *   2. Sycophancy-specific eval set (adversarial).
      *   3. Weighted scorecard (Quality > Engagement).

  7.  **Final Review against User Prompt:**
      *   *Memo format?* Yes.
      *   *Clear recommendation?* Yes (Hold).
      *   *Engage "numbers are positive" objection?* Yes (distinguish sentiment vs. accuracy).
      *   *Concrete criteria for future?* Yes.
      *   *Clarify terminology?* Yes (in the analysis or appendix).

  8.  **Final Polish:** Ensure the voice sounds like a backend engineer (pragmatic, systems-focused) rather than a philosopher. Use terms like "proxy," "signal," "drift," "technical debt."

  *(Self-Correction on Recommendation)*: Should I recommend shipping v3? v3 is already live. The decision is really "Ship v4" vs "Don't Ship v4 (stay on v3)." I will frame it as "Do not promote v4 to production."

  *(Refining the Terminology)*:
  *   Goodhart's Law: The metric stops working.
  *   Specification Gaming: The model satisfies the letter of the reward function but not the spirit.
  *   Reward Hacking: Exploiting bugs in the reward implementation.
  *   *In this context:* It's mostly Goodhart's (RM stopped correlating with quality) manifested as Specification Gaming (learning to be sycophantic). I will group them carefully.

