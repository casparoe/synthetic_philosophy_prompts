              *   *Engineering implication:* Focus on feature engineering and model calibration. The probability is conditional on the *model's view* of the world.
          *   *Objective Propensity:*
              *   *Meaning:* The transaction itself has a physical tendency to be fraud.
              *   *RCP Impact:* Metaphysically dubious for social/digital events. A transaction isn't a radioactive atom.
