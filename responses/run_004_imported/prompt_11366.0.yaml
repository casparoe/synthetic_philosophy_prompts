answer: |-
  **Setting:** *The Grind, a coffee shop across from the philosophy department. It is 5:30 PM on a Friday. The noise of espresso machines and undergraduate decompression hums in the background. ELENA and TOMAS sit at a small table, coats still on, steaming mugs between them.*

  **Elena:** I have to say, the colloquium was stimulating, but the Q&A felt like we were all dancing around the same hole in the floor. Everyone wants moral luck to be real because it *feels* real, but nobody wants to admit what it does to the concept of justice.

  **Tomas:** *(Stirring his coffee)* Because justice requires the Control Principle. If I don't control it, I'm not responsible for it. It's the bedrock. But Elena, be honest: does it feel like bedrock to you? Or does it feel like a shield we hold up against a world that refuses to cooperate?

  **Elena:** It feels like a requirement for fairness. If we assess moral standing based on outcomes, we're essentially saying morality is a lottery. Look at the classic case. Two drivers. Both drink three beers. Both decide to drive home. Both are equally reckless in their intent and their disregard for safety.

  **Tomas:** The Nagel example.

  **Elena:** Exactly. Driver A gets home safely. Driver B hits a child who darts into the road. If we blame B more than A—if we say B is *worse* than A—we are saying morality depends on the physics of the pedestrian's stride, not the driver's will. That's absurd. The moral fault was identical at the moment they turned the key.

  **Tomas:** But here's the rub. You say the moral fault was identical. I agree. But the *moral experience* is not. Driver B is going to live with a horror Driver A will never know. And we, as a community, treat them differently. We send B to prison; we give A a ticket.

  **Elena:** That's legal liability, Tomas. That's pragmatic. We're talking about *moral standing*.

  **Tomas:** Are we? Williams would say you're carving off a piece of human life and calling it "morality" while leaving the actual agent bleeding on the sidewalk. If B doesn't feel a specific, heavy weight that A doesn't feel, we'd think B was a psychopath. Williams calls it "agent-regret." It's not just guilt; it's the recognition that *I* did this, even if I couldn't have known the child was there.

  **Elena:** Regret is an emotion. It's a psychological reaction. It doesn't track moral truth. I can regret tripping over a curb, but I'm not morally culpable for the curb's height.

  **Tomas:** But the driver isn't tripping over a curb. He's operating a machine with his will. And this is where your Control Principle starts to eat itself. You say moral standing depends only on the will. Fine. But where does the will come from?

  **Elena:** It comes from the agent.

  **Tomas:** *(Leaning forward)* Does it? Nagel calls this constitutive luck. Your capacity for self-control, your patience, your impulse to have that third beer, your even-temperedness under stress—all of that is luck. Genetic, environmental, developmental luck. If Driver A has a slightly more cautious temperament due to a quirk of neurochemistry, he's "luckier" in his very will than Driver B.

  **Elena:** So you're arguing for hard determinism?

  **Tomas:** I'm arguing that if you push the Control Principle as hard as you want to, you run out of agent. If I'm only responsible for what I control, and I don't control my temperament, and I don't control the circumstances that test that temperament... then what is left? A tiny, ghostly point of volition that never actually touches the world.

  **Elena:** *(Pauses, taking a sip)* I see the regress. I do. If we trace the causal history of the will back far enough, the "self" disappears. But Tomas, stopping the regress isn't a metaphysical claim; it's a normative one. We *treat* people as agents at the point of deliberation. That's the stopping point. Not because it's metaphysically pure, but because it's the only place where reason can gain a foothold.

  **Tomas:** But Williams's Gauguin case shows that reason doesn't always get the final say. Gauguin abandons his family to paint. He can't justify that morally in the moment. He can only justify it if he succeeds as an artist. If he fails, he's just a monster who abandoned his kids. If he succeeds, he's a genius who followed his calling. The justification is retrospective. It depends on luck.

  **Elena:** Gauguin is a special case of personal projects. I'm talking about moral obligation.

  **Tomas:** Is there a difference? If the justification of a life can hinge on luck, why can't the blame for a death hinge on luck? You want to protect the agent from the world. I'm saying the agent is *in* the world. To purify morality of luck is to purify it of life.

  **Elena:** *(Sighs, looking into her mug)* You know, I worry about that. I worry that my version of the Control Principle makes morality too thin. If I say Driver B is no more blameworthy than Driver A, I risk telling Driver B, "Don't worry, it was just luck." And that feels like a betrayal of the victim.

  **Tomas:** Exactly. It dissolves responsibility by making it so pure it evaporates.

  **Elena:** But if I accept your view? If I say, "Yes, luck determines blame," then I have to tell Driver A, "You are morally better than B, simply because you got lucky." And that undermines the whole point of moral praise. It makes virtue a accident of fortune.

  **Tomas:** *(Nods slowly)* So we're stuck. If we keep the Control Principle, we save fairness but lose the reality of the agent's experience. If we drop it, we save the experience but lose fairness.

  **Elena:** Maybe... maybe the revision isn't to drop the principle, but to acknowledge its tragedy. The Control Principle is a regulative ideal. It's how we *ought* to judge, even if we can't fully live it. We acknowledge that Driver B bears a burden of history that A doesn't, without necessarily saying his *soul* is darker.

  **Tomas:** A dual-track system? One track for the internal court of conscience, where luck matters, and one for the external court of judgment, where it shouldn't?

  **Elena:** Something like that. Though I'm less confident now that the two can be kept so separate. If I judge you differently, I treat you differently. The external shapes the internal.

  **Tomas:** And if I internalize the luck—if I accept that my "will" is partly a gift of fortune—then maybe I become less judgmental of you.

  **Elena:** *(Smiles faintly)* So your skepticism makes you more charitable?

  **Tomas:** Perhaps. And your rigid principle keeps you from forgiving yourself too easily?

  **Elena:** *(Laughs)* Don't push it. But... I will concede this. The "will" isn't as clean a boundary as I'd like. It's porous. Luck seeps in.

  **Tomas:** And I'll concede that without the Control Principle as a horizon, we have no way to argue against the idea that might makes right. We need the illusion of control to have a society.

  **Elena:** So the paradox isn't a problem to be solved. It's a tension to be managed.

  **Tomas:** *(Raises his cup)* To managing the tension. And to not hitting any pedestrians on the way home.

  **Elena:** *(Clinks her mug against his)* I'll take the luck on that one.
