      *   *The Twist:* Futarchy tries to bypass preference aggregation over policies by aggregating *beliefs* about outcomes relative to a *fixed* goal.
      *   *Condorcet's View:* He believed in a "correct" decision (truth-apt). But he also knew that defining the "common good" is fraught. If the legislature votes on the metric itself (e.g., GDP vs. Happiness vs. Liberty), that is a preference aggregation problem.
      *   *Cycling:* If Party A wants GDP, Party B wants Equality, Party C wants Liberty, and they vote pairwise on the metric, you get cycles.
      *   *Crucial Point:* Condorcet didn't think you could just *stipulate* a metric to avoid the paradox. The paradox reveals that there is no coherent "social preference" to begin with. Fixing the metric arbitrarily (or via a fragile majority vote) doesn't solve the underlying incoherence of the social will.
      *   *However:* Condorcet was a rationalist. He might believe there is an *objective* moral truth about the metric. But his own math shows that majority voting doesn't reliably find it if preferences cycle.

