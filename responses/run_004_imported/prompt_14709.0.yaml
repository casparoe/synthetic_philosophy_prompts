answer: |-
  Condorcet would reject Futarchy. Not with a shrug, but with a mathematical demolition.

  While Hanson frames Futarchy as the culmination of information aggregation, Condorcet's *Essay on the Application of Analysis to the Probability of Majority Decisions* (1785) provides the specific probabilistic tools to show why replacing independent jurors with interdependent traders collapses the epistemic reliability of the system. Furthermore, Condorcet would argue that attempting to "vote on values" to bypass his Paradox is a category error that misunderstands the nature of social preference aggregation.

  Here is the case for why Condorcet would view Futarchy as epistemically bankrupt, grounded in his own math.

  ### 1. The Violation of Independence (The Jury Theorem Kill Shot)

  The core of Condorcet's optimism about democracy rests on the **Jury Theorem**. If $n$ voters each have a probability $p > 0.5$ of choosing the correct option, and their votes are **independent**, the probability $P_n$ that the majority chooses correctly approaches 1 as $n \to \infty$.

  $$ \lim_{n \to \infty} P_n = 1 \quad \text{iff} \quad \text{votes are independent} $$

  Condorcet was acutely aware that this independence assumption is fragile. In Part II of his *Essay*, he explicitly models **dependent votes**. He argues that if voters are influenced by a common cause or by each other, the effective sample size does not scale with $n$. Instead, the group behaves as if it were a much smaller number of voters, or even a single voter.

  In a prediction market, independence is structurally impossible. Traders do not vote in isolation; they react to the **price**. The price is a public signal that aggregates previous trades.
  *   **Mathematically:** Let $X_i$ be the belief of trader $i$. In Condorcet's ideal jury, $\text{Cov}(X_i, X_j) = 0$. In a market, $\text{Cov}(X_i, X_j) > 0$ because all $X_i$ are conditioned on the price signal $S$.
  *   **The Consequence:** As correlation $\rho$ increases, the variance of the aggregate mean does not shrink at the rate of $1/n$. It shrinks at $1/n_{eff}$, where $n_{eff} \ll n$.
  *   **Condorcet's Verdict:** Condorcet writes that when voters follow a leader or a common opinion, "the probability of the truth of the decision is no longer that which results from the plurality of votes, but that of the opinion which has determined them."

  In Futarchy, the **price is the leader**. The market does not aggregate $n$ independent truths; it cascades toward a single equilibrium signal. If that signal is wrong (due to a bubble, liquidity shock, or manipulation), the entire system locks into error. Condorcet would argue that Futarchy replaces the robust $n \to \infty$ error-correction of independent jurors with the fragile epistemic status of a single marginal trader. He would view the market not as a "super-juror," but as a violation of the necessary conditions for collective rationality.

  ### 2. The Paradox and the Instability of the Metric

  Hanson's solution to political dysfunction is to separate **values** (voted on) from **beliefs** (bet on). The legislature votes on a welfare metric (e.g., NGDP), and markets decide policies to maximize it. Condorcet would identify this as a failed attempt to legislate away **Condorcet's Paradox**.

  The Paradox shows that social preferences are not necessarily transitive. If society has multidimensional preferences (e.g., Liberty, Equality, Security), no single metric can capture the "general will" without generating cycles.
  *   **The Futarchy Assumption:** We can stably vote on a utility function $U$ once, and then treat it as fixed.
  *   **Condorcet's Objection:** The choice of $U$ is itself a preference aggregation problem subject to cycling. If Party A prefers GDP, Party B prefers Gini Coefficient, and Party C prefers Happiness, pairwise voting on the metric will cycle (GDP > Gini > Happiness > GDP).

  Condorcet did not believe you could solve cycling by "just voting first." He understood that if the underlying preferences are intransitive, the *procedure* for selecting the metric is unstable. A legislature that votes on a metric today can be overturned by a new coalition tomorrow.
  *   **Mathematically:** Futarchy requires the objective function $U$ to be static for the market bets to settle. But Condorcet's math proves that in a majority-rule system, $U$ is a function of the coalition structure, which is dynamic.
  *   **The Result:** You cannot run a prediction market on a moving target. If the metric itself is subject to majority cycling, the "beliefs" being bet on have no stable truth condition. Condorcet would argue that Hanson is hiding the paradox in the "Vote on Values" step, not solving it. The instability of the metric renders the market signals noise.

  ### 3. Truth vs. Profit (Epistemic Teleology)

  Finally, there is a fundamental philosophical divergence. Condorcet's social mathematics was built on the Enlightenment conviction that political questions have **truth-apt answers**. There is a "correct" decision that aligns with the common good, and the Jury Theorem is a mechanism for discovering it.

  Hanson's Futarchy is rooted in **Public Choice Theory**, which assumes actors are self-interested utility maximizers. Traders bet to make money, not to find the truth.
  *   **Condorcet's View:** He distinguished between the *probability of truth* and the *interest of the voter*. He argued that for the Jury Theorem to hold, voters must be motivated by the common good (competence + virtue). If voters vote based on private interest, $p$ drops below 0.5, and the theorem reverses: the larger the group, the *more certain* the error.
  *   **The Market Incentive:** In Futarchy, traders profit from accuracy, *but only if the market is liquid and the metric is paid out*. Condorcet would point out that market incentives often diverge from epistemic accuracy (e.g., hedging, manipulation, liquidity provision).
  *   **The Verdict:** Condorcet would argue that substituting profit motives for civic duty lowers the average competence $p$. If traders are betting on a metric they don't care about (because they didn't vote for it), or if they can hedge their bets elsewhere, their $p$ relative to the *social good* is undefined. Condorcet requires $p > 0.5$ regarding the **truth of the common good**. Markets optimize for **price accuracy**, which is not identical to **moral truth**.

  ### Conclusion

  Condorcet would not see Futarchy as an evolution of his project, but as a corruption of it.

  1.  **Mathematically:** It violates the independence condition required for the Law of Large Numbers to secure correct decisions, reducing the collective to a single correlated signal.
  2.  **Structurally:** It assumes a stability in social preferences (the metric) that Condorcet's Paradox proves is impossible under majority rule.
  3.  **Philosophically:** It replaces the search for the "general will" (truth) with market clearing (profit), risking a reversal of the Jury Theorem where $p < 0.5$ leads to guaranteed error as scale increases.

  Condorcet would argue that **Futarchy is a machine for amplifying correlation and instability while mistaking price for truth.** He would stick with deliberative democracy aimed at securing independent judgment, rather than outsourcing sovereignty to a correlated betting pool.
