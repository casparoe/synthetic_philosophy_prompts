          1.  Vote on a welfare metric (e.g., GDP, NGDP, Happiness Index).
          2.  Prediction markets estimate the impact of policies on that metric.
          3.  Policies are adopted if markets predict they will raise the metric.
      *   *Epistemic Claim:* Markets aggregate information better than voters/bureaucrats (efficient market hypothesis applied to policy).

  4.  **Evaluate Angle 1: The Jury Theorem & Independence:**
      *   *CJT Requirement:* Voters must be independent. Correlation reduces the effective $N$. If everyone copies one expert or follows a signal, the error rate doesn't vanish.
      *   *Market Reality:* Traders are *not* independent. They observe prices, follow trends, herd, and react to common news. Markets are prone to bubbles and cascades.
      *   *Condorcet's View:* He knew about correlation. In *Essay on the Application of Analysis to the Probability of Majority Decisions*, he discusses dependent votes. If dependence is high, the "wisdom of crowds" collapses.
      *   *Verdict:* Condorcet would see markets as highly correlated systems. The "traders" aren't independent jurors seeking truth; they are profit-seekers reacting to the same signals. This violates the core mathematical condition for the reliability of the aggregate.

  5.  **Evaluate Angle 2: The Paradox & Voting on Values:**
      *   *Futarchy Step:* Legislature votes on a *single* welfare metric.
