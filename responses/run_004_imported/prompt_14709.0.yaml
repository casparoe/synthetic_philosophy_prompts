      *   *Why?*
          1.  **Epistemic Corruption:** Condorcet wanted voters to seek the *truth* of the common good. Markets seek *profit*. Incentives in markets align with accuracy *only if* the market structure is perfect, but Condorcet's math highlights that *dependence* destroys accuracy. Markets are inherently dependent (price signals).
          2.  **The Metric Problem:** Condorcet's Paradox isn't just a bug; it's a feature of collective choice. You can't vote your way out of it by selecting a metric first, because the selection of the metric is itself subject to the paradox.
          3.  **Moral Mathematics:** Condorcet viewed politics as moral geometry. He believed in the *competence* of the public ($p > 0.5$). Hanson is deeply skeptical of voters (public choice theory). Condorcet would reject Hanson's cynicism about voter competence in favor of his own optimism about rational deliberation, provided independence is maintained. Markets destroy independence.

