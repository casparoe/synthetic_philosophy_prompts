      *   *Goal:* Rationalize democracy through probability theory ("Social Mathematics").
      *   *Jury Theorem (1785):* If voters are competent ($p > 0.5$) and independent, the probability of a correct majority decision approaches 1 as $n \to \infty$.
      *   *Condorcet's Paradox:* Aggregating ordinal preferences can lead to intransitive social preferences (A > B > C > A).
      *   *Underlying Philosophy:* Truth exists in moral/political sciences just as in natural sciences. The goal is to discover the "general will" or the "correct decision," not just aggregate desires. He was a rationalist Enlightenment figure.

  3.  **Deconstruct Hanson's Futarchy:**
