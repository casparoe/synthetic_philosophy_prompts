      *   *Point 2: The Metric Selection (The Paradox).* Futarchy assumes we can vote on a utility function $U$. Condorcet shows social ordering is intransitive. Voting on $U$ is just voting on policies in disguise. If the majority coalition shifts, the metric shifts. Futarchy assumes stability where Condorcet proved instability.
      *   *Point 3: Teleology vs. Profit.* Condorcet's jurors seek *Truth*. Hanson's traders seek *Profit*. Condorcet believed truth and collective good were aligned. Market incentives introduce noise (liquidity needs, hedging) unrelated to epistemic accuracy.
