answer: |-
  You have hit on exactly the right nerve. Your intuition is not just a gut feeling; it is the central objection raised by philosophers like Charles Pigden, David Coady, and Kurtis Hagen against Brian Keeley's seminal 1999 paper, *"Of Conspiracy Theories."*

  Keeley's argument is that conspiracy theories are *a priori* unwarranted because they are "self-sealing": they explain away counter-evidence (e.g., official reports, lack of physical proof) as part of the conspiracy itself (e.g., "the report was faked," "the evidence was planted"). Keeley claims this makes them unfalsifiable and therefore epistemically vicious.

  However, your objection regarding Watergate and MKUltra is the "Ex Ante Indistinguishability Argument." It is the strongest lever we have to break Keeley's criterion.

  Here is the strongest version of the argument that the self-sealing criterion fails to distinguish between vicious conspiracy theories and legitimate, hard-to-falsify explanations.

  ### 1. The Ex Ante Indistinguishability Problem
  The fatal flaw in Keeley's structural definition is that it judges the *logic* of the theory without regard for the *truth* of the world.

  Consider the Watergate scandal in 1973. To the Nixon administration and the mainstream press initially, the idea that the President was running a criminal enterprise and covering it up was a "conspiracy theory."
  *   **Official Narrative:** It was a "third-rate burglary," isolated actors.
  *   **Conspiracy Hypothesis:** It goes to the top; there is a cover-up.
  *   **Counter-Evidence:** Nixon denies it. The FBI says there's no evidence.
  *   **Self-Sealing Move:** The conspiracy theorist (Woodward/Bernstein) says, "The denials and the lack of evidence are proof of the cover-up."

  If Keeley's criterion is correct, Woodward and Bernstein were being **epistemically irrational** in 1973. Their hypothesis was structurally identical to the JFK "magic bullet" skeptics. They were treating the absence of evidence as evidence of absence (of the truth), which is the definition of self-sealing.

  However, we now know Woodward and Bernstein were right. Therefore, a criterion that marks their reasoning as "epistemically bad" is a broken criterion. It cannot distinguish between a *false* conspiracy theory (JFK second shooter) and a *true* one (Watergate) during the investigative phase. If the structure is the same, the structure cannot be the source of the error.

  ### 2. The Bayesian Defense: "Self-Sealing" as Rational Updating
  Keeley treats the "self-sealing" move as a logical fallacy. However, from a Bayesian perspective, it can be a rational updating of probabilities.

  Let $H$ be the hypothesis: "There is a powerful conspiracy."
  Let $E$ be the evidence: "The government releases a report denying the conspiracy."

  In a normal context, $E$ should lower the probability of $H$. But if $H$ is true, we should *expect* the conspirators to release reports denying $H$.
  *   $P(E | H)$ is high (Conspirators lie to protect themselves).
  *   $P(E | \text{not-}H)$ is lower (Honest institutions usually admit errors, though not always).

  If you assign a prior probability to $H$ based on historical precedent (e.g., "Governments have lied about COINTELPRO, Tuskegee, and Iran-Contra"), then observing $E$ (an official denial) actually **increases** the posterior probability of $H$.

  This isn't "self-sealing" in the vicious sense; it is **causal modeling**. In a genuine conspiracy, the production of disinformation is a *causal output* of the conspiracy. To ignore that causal link is to be naive, not rational. Keeley's criterion assumes that official denials are *neutral* evidence. In contexts of high power asymmetry, official denials are *dependent* evidence. Treating them as neutral is the actual epistemic vice.

  ### 3. The Lakatosian Shift: Degenerating vs. Progressive Research Programs
  If self-sealing isn't the line, what is? The best philosophical tool to replace Keeley's criterion comes from Imre Lakatos's philosophy of science. We should distinguish between **degenerating** and **progressive** research programs.

  A theory isn't bad because it explains away counter-evidence; it's bad if it *only* explains away counter-evidence without predicting new facts.

  *   **Vicious Conspiracy Theory (Degenerating):** Every time you ask for evidence, they give you a reason why it doesn't exist. They never tell you where to *find* the evidence. They cannot predict future disclosures. They are purely defensive.
      *   *Example:* "The moon landing was faked." When shown rocks, "They were planted." When shown photos, "Studio lighting." They never say, "If you look in this specific archive, you will find the budget for the studio."
  *   **Legitimate Conspiracy Inquiry (Progressive):** The hypothesis generates **novel predictions**. It tells investigators where to look.
      *   *Example:* Watergate. The hypothesis wasn't just "Nixon lied." It was "There are tapes," "There is a slush fund in Mexico," "There is a specific lawyer who handled the money."

  The Watergate theory looked "self-sealing" only to those who weren't following the specific predictive trail. The investigators weren't just saying "Denials are lies"; they were saying "Denials are lies, **and** if you subpoena *this* specific person, they will flip."

  Therefore, the epistemic sin isn't self-sealing; it is **lack of evidential yield**. A legitimate conspiracy theory risks falsification by making specific claims about where the bodies are buried. A vicious one keeps the bodies abstract.

  ### 4. The Institutional Epistemology Objection
  Finally, Keeley's argument relies on a hidden premise: **The Principle of Institutional Truthfulness.** It assumes that, absent evidence to the contrary, we should trust official narratives.

  This is an empirical claim, not a logical one. If history shows that institutions frequently conspire (and they do: The Tobacco Institute hiding cancer links, the Catholic Church hiding abuse, the CIA hiding MKUltra), then skepticism is the *default* rational position.

  To argue that conspiracy theories are structurally flawed is to argue that **historical inquiry into power is structurally flawed.** Since power operates through secrecy, any accurate model of power must account for secrecy. If your epistemological framework marks all theories of secrecy as "unfalsifiable," your framework is incompatible with political reality.

  ### Summary of the Argument
  To talk to your uncle (or to refine your own view), you can argue that Keeley's "self-sealing" criterion fails because:

  1.  **It condemns true positives:** It would have classified Watergate and Iran-Contra as irrational *before* the smoking guns were found.
  2.  **It misunderstands probability:** Treating official denials as suspicious is rational Bayesian updating when the hypothesis involves actors capable of manufacturing denials.
  3.  **It targets the wrong feature:** The problem isn't explaining away counter-evidence; it's failing to produce **novel predictions** (Lakatos). Vicious theories explain everything and predict nothing. Legitimate theories predict where the evidence will eventually surface.
  4.  **It assumes institutional innocence:** It treats trust in authority as a logical requirement, rather than an empirical gamble that history often proves wrong.

  **The Verdict:** You can tell your uncle that he is philosophically justified in skepticism of official narratives *in principle*, but he must meet the **Progressive Criterion**: Is his theory predicting where new evidence will come from, or is it just explaining why the current evidence is missing? If it's the latter, he's in the "degenerating" zone, regardless of whether Oswald acted alone.
