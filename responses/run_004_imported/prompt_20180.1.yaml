  2.  **Deconstruct Nozick's Wilt Chamberlain Argument (Briefly, for context):**
      *   Premise 1: A starting distribution ($D_1$) is just (e.g., everyone has equal money).
      *   Premise 2: People voluntarily transfer money to Wilt (or Priya) to watch him play (or get better service).
      *   Conclusion: The resulting distribution ($D_2$) is just because it arose from voluntary transactions from a just starting point.
      *   Implication: Patterned principles of justice (like equality) must be continuously violated by liberty. To maintain equality, you'd have to interfere with liberty.

  3.  **Analyze the User's Situation through Nozick's Lens:**
      *   Starting Point: Same hourly wage. Is this just? Nozick would say if the employer voluntarily hired them at that rate, yes.
      *   Transaction: Customers voluntarily hand tips to Priya.
      *   Outcome: Priya has more.
      *   Nozick's Verdict: The outcome is just. Interfering (pooling tips) violates the liberty of the customers and Priya.

  4.  **Introduce G.A. Cohen's Critique (The "Comeback"):**
      *   Cohen is a Marxist/egalitarian philosopher who critiqued Nozick.
      *   *Key Point 1: The Starting Point isn't neutral.* Nozick assumes $D_1$ is just. But in the real world (and this bar), is the starting point truly just? Did they choose the tipping system? Usually, tipping systems are imposed by management/industry norms, not chosen by workers.
      *   *Key Point 2: Liberty vs. Equality.* Nozick says you can't have both. Cohen argues that *true* liberty requires certain material conditions. Also, Cohen emphasizes that the *structure* of the situation limits liberty.
      *   *Key Point 3: The "Facts" of Talent.* Priya's advantage is natural talent/charm (morally arbitrary). Nozick says you own your talents. Cohen says relying on morally arbitrary advantages to determine distribution undermines equality.
      *   *Key Point 4: Community/Ethos.* Cohen argues that a just society needs an egalitarian *ethos*, not just rules. If Priya hoards tips while knowing her colleague struggles, she's violating the ethos of solidarity, even if she's within her "rights."

  5.  **Address the Specific Questions:**

      *   *Did we choose the 'equal wage' starting point?*
          *   Likely not. Management set the wage and the tipping policy. Nozick's argument relies on a *just* starting point. If the rules of the game (individual tipping) were imposed without consent, the "voluntary" transactions happen within a coercive structure.
      *   *What does Cohen's response show?*
          *   It shows that Nozick's "liberty" is formal, not substantive. It also highlights that talent is luck. Cohen would argue that if you value equality, you should voluntarily constrain your liberty (Priya should share) to maintain the community.
      *   *Is pooling tips different from preventing keeping?*
          *   Nozick says yes (interference). Cohen might say no (it's a pre-agreed rule of cooperation). If the bar operates as a team, individual tipping undermines the cooperative nature of the shift.
      *   *Do I have a comeback?*
          *   Yes. The "Wilt Chamberlain" argument fails in a workplace context because labor is cooperative, not just individual transaction.

