prompt: |-
  So me and my friend Priya had a two-hour argument last night and I need a referee. We bartend the same shifts, same hourly wage, but tips go to whoever the customer hands them to directly instead of into a shared jar, so she walks out with way more cash than me most nights because she's just better with the regulars. When I said that feels off, she went full Wilt Chamberlain on me (philosophy minor, apparently) -- every tip's a free transaction between her and a customer, nobody's rights got violated, so the pile of cash at the end can't be unfair even though we started the night on identical pay. I vaguely remember theres supposed to be some response to this from a guy called Cohen but couldn't produce it under pressure, so I went quiet and lost by default.

  Can you give me the most important implications of Nozick's entitlement theory and the Wilt Chamberlain argument for whether our tip setup is actually fair? Skip the textbook version, i got that beaten into me already -- I want whatever actually bites on our case: does it matter that neither of us chose the 'equal wage' starting point in any meaningful sense, what Cohen's response is actually supposed to show, and whether pooling tips after the fact is really any different from never letting her keep them individually to begin with. Trying to work out if I have an actual comeback or if I genuinely just lost.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user and their friend Priya bartend together. Same hourly wage, individual tips (keep what you're handed). Priya makes way more in tips due to charisma/regulars. User feels this is unfair despite equal starting conditions.
