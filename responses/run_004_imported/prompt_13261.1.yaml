answer: |-
  Two collectors, Elias and Simon, stand before two identical canvases hanging side by side in a private gallery.

  **Simon:** "Remind me, which one is the Vermeer?"

  **Elias:** "The one on the left. Worth forty million."

  **Simon:** "And the one on the right?"

  **Elias:** "A van Meegeren forgery. Worth forty thousand."

  **Simon:** "But they're pixel-perfect identical. I've stared at them for an hour."

  **Elias:** "Of course you have. But Nelson Goodman teaches us that indistinguishability *now* doesn't mean identity. A sufficiently trained eye might, with time and instruction, learn to pick out the difference."

  **Simon:** "So where is the difference?"

  **Elias:** "Waiting to be found."

  **Simon:** "And if no one ever finds it?"

  **Elias:** "Then the training wasn't rigorous enough. Or the difference is too subtle for our generation. But it *is* there. That's why the left one is superior."

  **Simon:** "So the aesthetic value rests entirely on a distinction that doesn't currently exist perceptually, and whose absence is proof that we just need to look harder?"

  **Elias:** "Exactly. It's an investment in future discrimination."

  **Simon:** "I see. So if I buy the left one, and fifty years from now science proves they're physically identical..."

  **Elias:** "Impossible."

  **Simon:** "...then I get a refund?"

  **Elias:** "No. Then we simply conclude that your grandchildren weren't looking at it correctly."

  **Simon:** "That's not art criticism, Elias. That's a gaslighting warranty."

  **Elias:** "Call it what you like. But the forgery doesn't come with the promise that your inability to see the value is your own fault. That privilege is autographic."
