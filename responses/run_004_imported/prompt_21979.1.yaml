  3.  **Evaluate the Test Case and Asymmetry (Question 2):**
      *   *The Case:* Disjunctive Syllogism ($A \lor B$, $\neg B$, therefore $A$). Specifically: "Wrong(Torture) $\lor$ Wrong(Lie)", "Not Wrong(Lie)", therefore "Wrong(Torture)".
      *   *The User's Hunch:* Gibbard handles this easily via hyperplans (possible-worlds style reasoning). Blackburn struggles because he needs to construct a specific attitude for the disjunction from uncertainty, which might look ad hoc.
