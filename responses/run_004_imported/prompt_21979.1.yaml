answer: |-
  This is a strong set of notes. You are clearly operating at the right level for a dissertation chapter, and your intuition about disjunction being the "stress test" for expressivism is spot on. However, because you are working in a heavily mined field (post-Schroeder), you need to be very precise about where your contribution lies.

  Here is a breakdown addressing your three main concerns: fairness of representation, the validity of the test case/asymmetry, and dissertation viability.

  ### 1. Fairness of Representation
  **Verdict: Largely Accurate, but needs slight nuance.**

  *   **Blackburn:** Your summary of the "tree of attitudes" (from *Spreading the Word* and "Attitudes and Contents") is correct. The key nuance to add is that Blackburn distinguishes between **A-type inconsistency** (holding two conflicting attitudes, e.g., booing and hurrahing the same act) and **B-type inconsistency** (holding attitudes that logically conflict, e.g., booing $X$ and having a higher-order attitude that forbids booing $X$). His solution to Frege-Geach relies on showing that logical invalidity maps onto B-type inconsistency.
  *   **Gibbard:** Your summary of *Thinking How to Live* (2003) is accurate regarding hyperplans and normative worlds. *Crucial distinction:* You must ensure you aren't conflating *Wise Choices, Apt Feelings* (1990) with *Thinking How to Live*. In *Wise Choices*, Gibbard used a more psychological norm-acceptance model (closer to Blackburn). In *THL*, he moves toward a semantic framework involving "normative worlds." This shift is exactly why your hunch about Gibbard handling logic "for free" is plausible—he effectively semanticizes the attitudes.

  ### 2. The Test Case and the Asymmetry
  **Verdict: The asymmetry holds, but the "why" is more complex than you think.**

  Your hunch is that Gibbard handles disjunctive syllogism easily via hyperplans, while Blackburn struggles to construct the disjunctive attitude non-ad-hoc.

  *   **The Gibbard Side:** You are right that in *THL*, disjunction works smoothly because hyperplans function like possible worlds. If a hyperplan rules out a world where $\neg A$ and $\neg B$, it validates $A \lor B$.
      *   *The Catch:* Many critics (including Schroeder and Ridge) argue that by making this move, Gibbard sacrifices the core expressivist insight. If normative validity is just consistency across normative worlds, in what sense is this still *expressivism* and not just realism about normative properties? Your chapter could profitably ask: **Does Gibbard solve Frege-Geach by ceasing to be an expressivist?**
  *   **The Blackburn Side:** You are also right that Blackburn has to "construct by hand." For Blackburn, asserting "$A \lor B$" isn't just being unsure; it is expressing a specific complex state of mind (a commitment to ruling out the combination of $\neg A$ and $\neg B$).
      *   *The Uncertainty Point:* This is your strongest insight. You note that disjunction often arises from *uncertainty* ("I don't know which is wrong, but one of them is"). Blackburn's model requires a *settled* higher-order attitude. If I am genuinely uncertain, do I have the attitude required to assert the disjunction?
      *   *Missing Machinery?* Blackburn might reply that the "attitude" expressed by a disjunction *just is* the disposition to infer $A$ upon learning $\neg B$. However, Schroeder (*Being For*, Ch. 4-5) argues this is circular: it explains validity in terms of inference, but inference in terms of validity.
      *   *Your Test Case:* The moral disjunctive syllogism works well here. If the agent says, "Either Torture is wrong or Lying is wrong," and later learns "Lying is not wrong," they conclude "Torture is wrong."
          *   **Gibbard:** The hyperplan that accepted the disjunction and rejected the lie *must* accept the torture verdict.
          *   **Blackburn:** The agent must have had a higher-order attitude that disallowed the combination of (No-Boo-Torture + No-Boo-Lie). When they drop No-Boo-Lie, consistency forces Boo-Torture.
          *   **The Snag:** Your point about *uncertainty* is the wedge. If the initial assertion was based on epistemic uncertainty rather than a settled normative commitment, Blackburn's "commitment" model feels strained. Gibbard's "worlds" model handles uncertainty naturally (the agent is considering multiple normative worlds).

  ### 3. Dissertation Viability (The "Schroeder Problem")
  **Verdict: The point is not fresh *simpliciter*, but your specific angle might be.**

  You asked: *"Is this even a fresh enough point for a dissertation section, or is it just a repackaging of stuff that's already well-worn in the Being For literature?"*

  *   **The Bad News:** Mark Schroeder's *Being For* (2008) is the elephant in the room. He explicitly argues that disjunction is the real hurdle (much harder than negation/conditionals) and critiques both Blackburn and Gibbard on exactly these grounds. He argues that Blackburn's solution is ad hoc (different logic for different connectives) and that Gibbard's solution relies on a semantics expressivists should reject. If you submit this without engaging deeply with *Being For*, your advisor will send you back.
  *   **The Good News:** Most literature focuses on the *logical form*. Your focus on the **epistemic/psychological origin** of the disjunction (uncertainty vs. settled commitment) is a fresher angle.
      *   **Proposal:** Don't frame it as "I discovered disjunction is hard." Frame it as: "While Schroeder identifies the logical difficulty, he underestimates the *epistemic* asymmetry between Blackburn and Gibbard. Gibbard solves the logic by adopting a possible-worlds semantics that naturalizes moral uncertainty, whereas Blackburn's psychological commitment model struggles to account for disjunctions born of genuine uncertainty without positing ad hoc higher-order states."
  *   **Novelty Check:** Look at **Michael Ridge** (*Ecumenical Expressivism*). He tries to split the difference. Also, look at **Chris Lenman**'s critiques of Blackburn. If you can show that Gibbard's "easy fix" comes at the cost of losing the explanation of *moral deliberation* (which Blackburn preserves), you have a chapter.

  ### Specific Recommendations for Friday's Meeting

  1.  **Read Schroeder, *Being For*, Chapters 4 & 5.** You cannot write this chapter without explicitly positioning yourself against his "B-type inconsistency" argument. You need to know if your "uncertainty" point survives his critique.
  2.  **Refine the Gibbard Critique:** Don't just say Gibbard handles it "for free." Argue that he handles it by **semanticizing** norms. Ask: Is a hyperplan a psychological state or a semantic object? If the latter, has he abandoned expressivism?
  3.  **Sharpen the Blackburn Defense/Attack:** Blackburn's best defense is that quasi-realism *earns* the right to talk about truth and disjunction. Your counter is that the *psychological cost* of earning that right for disjunction is too high (it requires implausible higher-order attitudes for cases of simple uncertainty).
  4.  **The "Uncertainty" Wedge:** This is your unique contribution. Develop the distinction between **Normative Uncertainty** (I don't know which plan to adopt) vs. **Normative Indeterminacy** (My plan doesn't cover this). Gibbard handles the former well; Blackburn struggles.

  **Summary:** You are not missing a bit of machinery; you have identified a genuine tension. The risk is not that you are wrong, but that you are repeating Schroeder. Your way out is to pivot from *logical validity* (which Schroeder owns) to *epistemic psychology* (which is your opening).

  Good luck with the reading group notes. This is dissertation-worthy material if you navigate the secondary literature carefully.
