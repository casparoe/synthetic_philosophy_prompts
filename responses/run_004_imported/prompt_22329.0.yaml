answer: |-
  This is an excellent passage to grapple with, and your initial reading of it is spot-on. You have correctly identified the core distinction Hobbes is drawing between sciences of *making* (geometry, politics) and sciences of *observing* (natural philosophy).

  To help you prepare for your seminar, let's break down the four specific layers of your inquiry: the definition of "demonstrable," the connection to reasoning as computation, the substance of the politics-geometry analogy, and the historical lineage of the "maker's knowledge" idea.

  ### 1. What does Hobbes mean by "Demonstrable"?

  For Hobbes, "demonstration" is not merely logical validity (as it might be in a modern logic textbook). It is **causal certainty**.

  In the Aristotelian tradition that Hobbes is reacting against, science (*scientia*) is knowledge of things through their causes. Hobbes accepts this but radicalizes it. He argues that to truly know the cause of something, you must know how it was **generated**.

  *   **The Epistemological Gap:** In natural philosophy (physics, biology), we observe an effect (e.g., the motion of a planet, the growth of a plant) and try to guess the cause. Because we did not create the planet or the plant, there is always a gap between our hypothesis and the reality. As Hobbes says, we can only demonstrate "what the causes *may* be." We can construct a hypothetical model that fits the data, but we cannot be certain it is the *only* possible explanation or the *true* one.
  *   **The Closure of the Gap:** In geometry, there is no gap. When a geometer defines a circle, they are not discovering a "Platonic circle" hidden in the universe. They are stipulating a rule for generating a figure (e.g., "rotate a line around a fixed point"). Because the geometer is the **agent of generation**, they know the cause perfectly. The cause *is* the construction.
  *   **Certainty:** Therefore, "demonstrable" means that the truth of the proposition is guaranteed by the fact that the object of the proposition is a product of the reasoner's own will and definition. There is no external reality to contradict you, because you defined the reality.

  ### 2. Connection to Reasoning as Computation

  This connects directly to Hobbes's nominalist psychology, developed primarily in *De Corpore* (On Body) and *Leviathan*.

  *   **Reasoning as Calculation:** Hobbes famously defines reasoning as "reckoning" (computation). It is the adding and subtracting of the consequences of names. To reason is to manipulate definitions.
  *   **Definitions as Decrees:** In natural philosophy, definitions attempt to capture the "essence" of a thing existing outside us. We might get the definition wrong. But in geometry and civil philosophy, definitions are **arbitrary decrees**. When I define a "square," I am not describing a pre-existing object; I am establishing the rules for what I will *call* a square.
  *   **The Link:** Because reasoning is computation with names, and because in geometry/politics we ourselves assign the names and define the terms, our computations are immune to empirical error. If I define $A$ and $B$, and I compute $A + B$ correctly according to my own rules, the result is necessarily true.
  *   **Why Nature Fails:** In natural philosophy, we are trying to compute with names that refer to hidden essences we do not control. We are trying to add and subtract "causes" that we cannot see. Therefore, natural philosophy yields probability, not demonstration.

  ### 3. Is the Geometry/Civil Philosophy Analogy Rhetorical or Substantive?

  This is a crucial point for your seminar. It is **substantive**, though it certainly serves a rhetorical purpose in defending his own mathematical blunders.

  *   **The "Artificial Man":** Hobbes's political theory relies on the idea that the Commonwealth is an "Artificial Man." It is not a natural growth (like a family or a tribe); it is a machine constructed by human art.
  *   **The Social Contract as Construction:** Just as a geometer generates a figure by moving a line, citizens generate a Commonwealth by moving their wills (via the covenant). Because we create the Commonwealth through agreement, we know its "cause" (human fear, reason, and agreement).
  *   **Scientific Politics:** Hobbes wants to do for politics what Euclid did for geometry. He wants to derive the duties of subjects and the rights of sovereigns from first principles (the state of nature, the laws of nature) with geometric certainty.
  *   **Why it matters:** If politics were like natural philosophy, we would have to observe existing states and guess why they function. Hobbes rejects this. He argues we can deduce how a state *must* function based on how we constructed it. This justifies his absolutism: if the Sovereign is the "geometer" of the state, their definitions (Laws) constitute justice, just as the geometer's definitions constitute truth.

  So, while Hobbes certainly uses the prestige of geometry to shield his political theory from criticism (and to defend his own mathematical errors against Wallis), the analogy is the **architectonic keystone** of his entire philosophical system. He genuinely believes political science is the only other science besides geometry that can achieve absolute certainty.

  ### 4. Is this Distinctively Hobbesian? (The Vico Connection)

  Your professor is correct to point you toward Giambattista Vico (1668–1744), but Hobbes is a critical precursor.

  *   **The Tradition:** This is often called the **"Verum Factum"** (the true is the made) principle. It stands in opposition to the Aristotelian/Realist view that truth is the correspondence of the mind to an independent reality.
  *   **Hobbes's Role:** Hobbes is one of the first modern philosophers to systematically exclude natural philosophy from the realm of certain "science" on these grounds. He is a materialist who paradoxically argues that we know our own creations better than God's creation.
  *   **Vico's Development:** Vico later formalizes this in *The New Science* with the principle *verum ipsum factum* ("the true is precisely the made"). Vico argues that because God made the natural world, only God has perfect science of nature. Humans, having made history, civil institutions, and mathematics, can have perfect science of those things.
  *   **Distinction:** Hobbes is more mechanistic and nominalist. For Hobbes, the certainty comes from the **stipulation of definitions** and the **mechanics of generation**. For Vico, it is more metaphysical and historical. But the lineage is direct. Hobbes provides the epistemological groundwork that Vico later expands into a philosophy of history.

  ### Contextualizing the Wallis Dispute

  Since your next session is on the dispute with John Wallis, keep this in mind:

  Hobbes's confidence in his (incorrect) solution to squaring the circle stems directly from this passage. He believes that because he has **constructed** a figure that he claims solves the problem, he possesses causal knowledge of the solution. He views Wallis's algebraic refutations as mere "symbol manipulating" without true geometric generation.

  Hobbes essentially argues: *"I made this figure; I know how it was generated; therefore my conclusion is certain."*
  Wallis argues: *"Your construction violates established arithmetical ratios; therefore your conclusion is false."*

  Hobbes's epistemology makes him strangely immune to correction. If certainty comes from being the "maker," then admitting error implies a failure of will or construction, not a discovery of external truth. This helps explain why the dispute lasted for decades and became so bitter.

  ### Summary for Class Discussion

  If you want to contribute to the seminar, you might frame it this way:

  1.  **Hobbes redefines Science:** He shifts science from "discovery of essences" to "knowledge of consequences from our own definitions."
  2.  **The Cost of Certainty:** We gain certainty in geometry and politics only by sacrificing relevance to the independent natural world. We know the Commonwealth perfectly because it is ours; we know Nature poorly because it is God's (or just brute matter).
  3.  **The Danger:** This epistemology creates a closed loop. It empowers the Sovereign (in politics) and the Geometer (in math) as the ultimate arbiters of truth, potentially insulating them from empirical refutation (as seen in the Wallis dispute).

  This passage is essentially Hobbes's manifesto for a **constructivist epistemology**. He is telling us that we can only truly know what we build.
