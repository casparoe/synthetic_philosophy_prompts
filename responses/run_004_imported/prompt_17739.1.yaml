answer: |-
  Good evening. For those of you who don't know me, I'm a friend of Daniel's from a… let's call it a book club. For those of you who do know me from the book club: yes, I promise to keep the jargon to a minimum.

  Daniel asked me to give this toast, and he gave me one instruction: don't make it a lecture. But anyone who knows Daniel knows you can't separate him from the way he thinks. And for the last six years, Daniel has been thinking deeply about one specific question: How do we agree on things without actually talking about them?

  He wrote his dissertation on David Lewis's account of convention. In plain English, Lewis argued that a convention isn't a law or a moral truth. It's a solution to a recurring coordination problem. It's the reason we all drive on the right side of the road. It doesn't matter *which* side we drive on, only that we all drive on the *same* side. Once we do it enough, we expect each other to do it. We expect to be expected to do it. And that expectation becomes a kind of glue.

  Daniel told me, entirely seriously, that he views his relationship with Mei through this lens. He says the small rituals they've built over six years—who starts the coffee in the morning, the specific phrase that de-escalates an argument, who texts first after a trip apart—are genuine Lewis-style conventions.

  Now, for the family in the room: I know what that sounds like. It sounds like he's saying their love is just a habit. Or worse, that it's arbitrary. That they could have just as easily built a life on different rules, or no rules at all. Even Daniel and Mei's families have joked that this whole wedding is arbitrary—that they could have just eloped.

  And here is where I have to be honest, because Daniel would want me to be. In the Lewisian sense, yes, it is arbitrary. There was no cosmic destiny that dictated Mei must be the one to text first after a business trip. There is no metaphysical necessity requiring a big white wedding rather than a courthouse visit. Another equilibrium was possible.

  *(Pause for the rationalist contingent)*
  In fact, the only reason this wedding isn't a violation of the theory is that a public ceremony is the most efficient way to generate common knowledge that the coordination problem is solved permanently. So, please, enjoy the signal.

  *(Turn back to the room)*
  But here is the thing that Daniel sometimes forgets, and the thing I want to remind him of tonight.

  Lewis's theory is deflationary about the *origin* of the convention, but it is incredibly robust about the *value* of the coordination.

  The fact that a convention is arbitrary doesn't mean it's fragile. It means it's resilient *because* it's arbitrary. It doesn't rely on the stars aligning. It relies on two people looking at each other and saying, "I know you're going to be there, and I know you know I'm going to be there."

  For six years, Daniel and Mei haven't been waiting for fate to tell them how to love each other. They've been building a system of expectations. When Daniel makes the coffee, he isn't doing it because the universe commanded it. He's doing it because he knows Mei expects it, and he wants to meet that expectation. And when Mei ends an argument with that specific phrase, she isn't reciting a script. She's signaling that the coordination is restored. That they are back on the same side of the road.

  That is not cold. That is the opposite of cold. That is the warmth of knowing exactly where you stand.

  There is a profound comfort in knowing that the person you love doesn't need to renegotiate the terms of your care every single morning. They just make the coffee. They just send the text. They just show up.

  So, yes, the rituals are contingent. Yes, this wedding was one of many possible equilibria. But now that we are here, now that we have all witnessed this, the precedent is set. The common knowledge is established.

  Daniel, you spent years studying how conventions hold societies together. But tonight, you get to live inside one. You get to rest in the knowledge that the specific way you love Mei might have been arbitrary once, but the fact that you love her, and the fact that she expects you to keep doing it, is now the least arbitrary thing in either of your lives.

  To Daniel and Mei. May your expectations always be met, and may your coordination problems always be solved.

  To Daniel and Mei.
