  4.  **Identify the Linguistic/Pragmatic Concepts:**
      *   To help the user *write* this, I need to explain *why* it works.
      *   *Grice's Maxims:* Specifically the Maxim of Quantity (say as much as is required) and Manner (be clear). Violating these creates implicature.
      *   *Politeness Theory:* Saving face (both the editor's and the author's).
      *   *Subtext in Dialogue:* Characters rarely say exactly what they mean when emotions are high or power dynamics are at play.

