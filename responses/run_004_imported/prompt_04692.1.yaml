answer: |-
  You are not missing a mathematical trick; your arithmetic intuition is precisely correct. In strict algebraic terms, Sidgwick's "product formed by multiplying the number of persons living into the amount of average happiness" is definitionally identical to **total happiness**.

  However, your suspicion that this is "simply his somewhat roundabout route to the total view" requires a nuanced historical and philosophical qualification. It *is* the Total View, but framing it as a product of $N \times \text{Average}$ was not rhetorical redundancy in 1907; it was a deliberate polemical intervention against the prevailing orthodoxy of his time.

  Here is a resolution of the conceptual framing and an assessment of its historical significance regarding the Total View and Parfit's Repugnant Conclusion.

  ### 1. The Conceptual Work of the "Product" Framing

  You ask if the framing does independent work. Mathematically, no. Conceptually and dialectically, yes.

  **The Conflict: Average vs. Total**
  In Sidgwick's time, the dominant utilitarian-adjacent view on population (heavily influenced by Malthus and classical political economy) was effectively an **Average View**. The goal was to maximize the standard of living or the "average happiness" per capita. The fear was that population growth would inevitably dilute resources and lower the average welfare (the Malthusian trap).

  Sidgwick's passage is an explicit correction of this assumption. By breaking Total Happiness down into its components ($N$ and $H_{avg}$), he forces the reader to confront the trade-off.
  *   **The Average View says:** Stop increasing $N$ the moment $H_{avg}$ begins to drop.
  *   **Sidgwick's Total View says:** Continue increasing $N$ even if $H_{avg}$ drops, provided the loss in average is outweighed by the gain in numbers, such that the *product* increases.

  **Why the Formula Matters**
  If Sidgwick had simply written, "We ought to maximize total happiness," a Malthusian critic could have replied, "Total happiness is meaningless if individuals are miserable." By writing it as a product ($N \times H_{avg}$), Sidgwick demonstrates the *mechanism* of the aggregation. He makes it clear that under the principle of "happiness on the whole," a large number of people with moderately happy lives can ethically outweigh a small number of people with ecstatic lives.

  So, while the formula is arithmetically tautological, it is philosophically diagnostic. It isolates the variable ($N$) that the Average View treats as a constraint and re-casts it as a multiplier of value.

  ### 2. Historical Placement: The Genesis of the Total View

  Sidgwick is widely regarded by modern population ethicists as the first philosopher to clearly articulate the **Total View** as a distinct alternative to the Average View.

  *   **Bentham and Mill:** Jeremy Bentham's slogan "the greatest happiness of the greatest number" is notoriously ambiguous. It oscillates between maximizing the sum and maximizing the spread. J.S. Mill was often more concerned with the quality of life and stability, leaning closer to an Average View or a sufficiency view.
  *   **The Malthusians:** As Sidgwick notes, political economists assumed the goal was to keep population within the bounds of maximum average comfort.
  *   **Sidgwick's Innovation:** In this passage, Sidgwick bites the bullet. He argues that if the ultimate end is "happiness on the whole" (aggregate utility), then the Average View is logically inconsistent with utilitarian first principles. If an additional life contains *any* positive happiness, it adds to the sum. Therefore, the "point up to which... population ought to be encouraged to increase" is indeed the maximum total, not the maximum average.

  In the history of ethics, this is the moment the **Total View** is formally codified. Before Sidgwick, it was often an unexamined assumption; after Sidgwick, it became a contested thesis.

  ### 3. Connection to Parfit and the Repugnant Conclusion

  Your intuition that this leads to Parfit is spot on. Derek Parfit, in *Reasons and Persons* (1984), explicitly credits Sidgwick with identifying this problem.

  **The Logical Lineage**
  1.  **Sidgwick (1907):** Establishes that Utilitarianism implies maximizing the sum ($N \times H_{avg}$). He acknowledges this means we might accept a decrease in average happiness if the population increase is large enough.
  2.  **Parfit (1984):** Takes Sidgwick's logic and extends it to its limit. If we are maximizing the sum, then for any population $A$ with very high average happiness, there must be some much larger population $Z$ with lives that are "barely worth living" that has a higher total sum of happiness.
  3.  **The Repugnant Conclusion:** Parfit argues that while Sidgwick's logic is sound, the conclusion (that $Z$ is better than $A$) is intuitively repugnant.

  **Did Sidgwick See the "Repugnance"?**
  Sidgwick did not use the term "Repugnant Conclusion," nor did he seem to find the implication as disturbing as Parfit did. Sidgwick was a classical utilitarian who accepted the aggregation of value. He wrote:

  > *"So that, strictly conceived, the point up to which, on Utilitarian principles, population ought to be encouraged to increase, is not that at which average happiness is the greatest possible... but that at which the product... reaches its maximum."*

  Sidgwick treats this as a sober, if perhaps demanding, logical consequence. He does not retreat from it. Parfit's contribution was not discovering the logic (which he attributes to Sidgwick), but rather highlighting that this logical consequence clashes so violently with our moral intuitions that it might serve as a *reductio ad absurdum* against the Total View itself.

  ### Summary for a Population Ecologist

  As an ecologist, you are accustomed to distinguishing between **biomass** (total) and **density/condition** (average).
  *   The Malthusians were optimizing for **condition** (carrying capacity per individual).
  *   Sidgwick argued Utilitarianism optimizes for **biomass** (total aggregate welfare).

  You are correct that Sidgwick's formula is just Total Happiness. He was not discovering a new metric; he was rigorously applying the existing utilitarian metric to a variable ($N$) that others had tried to hold constant.

  **Verdict:** You are not missing a hidden mathematical function. You have correctly identified that Sidgwick is deriving the **Total View** from the premise of "happiness on the whole." The significance of the passage is not mathematical novelty, but ethical candor: Sidgwick was the first to clearly state that classical utilitarianism commits us to the logic that eventually generates Parfit's Repugnant Conclusion. He saw the precipice; Parfit later named the view from the edge.
