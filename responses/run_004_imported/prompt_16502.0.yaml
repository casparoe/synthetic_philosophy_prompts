answer: |-
  This is a fantastic real-world example to encounter while taking decision theory. You have essentially stumbled into a classic problem involving **myopic optimization**, **transaction costs**, and **dynamic inconsistency**.

  Here is the breakdown of why your individually rational choices led to a globally irrational outcome, and how to decide on the pre-commitment strategy.

  ### 1. The Diagnosis: Why did this happen?

  **Local vs. Global Optima (The Greedy Algorithm Problem)**
  In computer science and optimization, a "greedy algorithm" makes the locally optimal choice at each stage with the hope of finding a global optimum. Your gym strategy was a greedy algorithm. At every decision node (Month 1, Month 3, Month 6), you calculated:
  $$ \text{Benefit of Switch} > \text{Switching Fee} $$
  Since this was true every time, you switched. However, you failed to optimize for the **global** function:
  $$ \text{Total Annual Cost} = \sum (\text{Monthly Dues}) + (\text{Number of Switches} \times \text{Fee}) $$
  You minimized the first part repeatedly but let the second part explode. In decision theory, this is failing to account for the **path dependence** of your costs.

  **Narrow Framing**
  You evaluated each switch in isolation (narrow framing) rather than as part of a sequence (broad framing). By treating January's decision as independent from March's decision, you ignored the cumulative friction. If you had viewed the year as a single portfolio of decisions at the start, the switching fees would have appeared as a massive "tax" on flexibility.

  **The "Money Pump" Adjacent**
  While not a strict money pump (which usually relies on intransitive preferences like A>B, B>C, C>A), this is similar. You allowed a system to extract value from you through friction. The gym *designed* the fees to exploit exactly this behavior: they know that humans overweight immediate savings (the lower tier price) and underweight accumulated transaction costs (the fees).

  ### 2. The Solution: Should you Pre-commit?

  You asked if you should lock yourself into a contract to prevent future-you from making these mistakes. In decision theory, this is called a **Ulysses Pact** (or pre-commitment strategy). Ulysses tied himself to the mast so he couldn't steer toward the Sirens, knowing his future self would lack the willpower to resist.

  **The Argument FOR Pre-commitment:**
  *   **Correcting Time Inconsistency:** Your "January Self" wanted to save money over the year. Your "March Self" wanted to save money *right now*. These preferences conflicted. Pre-commitment allows January-You to enforce their will on March-You.
  *   **Eliminating Decision Fatigue:** Every time a deal pops up, you have to spend cognitive energy evaluating it. A "no-switch" rule automates this.
  *   **Guaranteed Global Optimum:** As your roommate proved, the "stick to one plan" strategy was the global minimum for cost this year.

  **The Argument AGAINST Pre-commitment:**
  *   **Loss of Option Value:** The value of a flexible membership isn't just monetary; it's the ability to adapt to life changes. If you injure your knee in June and need to downgrade, or bulk up and need better equipment, a hard contract punishes you for legitimate changes in utility.
  *   **Regret Risk:** If the gym introduces a "Unlimited Platinum" tier for $5/month next year (a genuine anomaly), a hard contract prevents you from capturing that surplus.
  *   **Rigidity:** Hard contracts can be expensive to break if your life circumstances change (moving, income loss).

  ### 3. The Decision Theory Verdict

  You shouldn't necessarily sign a contract that makes switching *impossible*, but you should adopt a **heuristic with a threshold.**

  Pure pre-commitment is often too brittle. Instead, use **bounded rationality** to set a rule that accounts for transaction costs.

  **The "Switching Threshold" Rule:**
  Instead of asking "Is this switch better than staying?", ask:
  $$ \text{Projected Savings} > \text{Switching Fee} + \text{Buffer} $$
  The "Buffer" is a penalty you assign to yourself for the cognitive load and the risk of future switching fees. For example, decide now: *"I will only switch if the projected savings over the next 6 months exceed the fee by at least 200%."*

  **Alternatively, the "One-Switch" Policy:**
  Allow yourself exactly one switch per year. This acknowledges that needs change (preserving option value) but caps the transaction cost bleeding (preventing myopic optimization).

  ### Summary for your Class
  If you want to impress your professor, frame it this way:
  1.  **Ex-post rationality:** Each switch was rational *at the moment of decision* given the information and costs presented.
  2.  **Ex-ante irrationality:** The *strategy* of switching was irrational because it ignored the cumulative distribution of transaction costs.
  3.  **Remedy:** A **soft pre-commitment device** (a self-imposed rule with a high threshold) is superior to a **hard pre-commitment device** (a contract) because it preserves option value while mitigating the cognitive bias toward immediate gratification.

  **TL;DR:** You got caught by transaction costs and narrow framing. Don't sign a hard contract, but set a strict personal rule (e.g., "Only switch if I save 3x the fee") to stop your future self from being too clever for their own good.
