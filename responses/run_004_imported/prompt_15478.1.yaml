      *   *Counter:* I need to challenge that definition. The propensity is not $P(A|B)$ per se. The propensity is a property of the *setup* $S$. $P(A|S)$ is the measure. When we write $P(A|B)$, if $B$ is a prior cause, it modifies the setup. If $B$ is a future effect, it does not modify the physical setup, only our information.
      *   *Key Terminology:* Distinguish between *physical conditionalization* (changing the setup) and *epistemic conditionalization* (updating belief). Bayes's theorem holds for the numbers in both, but only the former yields a propensity.

