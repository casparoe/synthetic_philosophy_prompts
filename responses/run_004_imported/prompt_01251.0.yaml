answer: |-
  This is one of the most persistent and understandable sticking points in Davidson's later philosophy. Your intuition—that malapropisms are just "noise" or "glitches" within a robust, shared system—is the exact intuition Davidson is trying to dismantle. He thinks that intuition preserves the "myth of a fixed linguistic code" at the cost of explaining how communication actually works.

  To help you feel the argumentative pressure in your seminar, you need to shift the focus from **psychological capacity** (can we repair errors?) to **semantic determination** (what makes a word mean what it means in this instance?).

  Here is a breakdown of why the "flexible conventionalist" position collapses under Davidson's scrutiny, structured to help you lead the discussion.

  ### 1. The Order of Explanation Problem
  The conventionalist argues: *We share a language (code) $\rightarrow$ Therefore we communicate (with occasional repairs).*
  Davidson argues: *We communicate (via interpretation) $\rightarrow$ Therefore it looks as if we share a language.*

  The pressure point is this: If the hearer understands Mrs. Malaprop's "derangement of epitaphs" as "arrangement of epithets," **in virtue of what** does that understanding occur?
  *   **Conventionalist:** It occurs because the hearer accesses the shared code, notices a violation, and uses context to repair it.
  *   **Davidson:** But the "repair" isn't a secondary step; it is the *primary* mechanism of meaning. The shared code actually tells you the sentence is nonsense. If you understand it, you are **ignoring** the shared code.

  If the shared code says $X$ means $Y$, but the speaker means $Z$, and you understand $Z$, then the shared code was **wrong** about the meaning of that utterance. If the code can be wrong about the meaning, the code cannot be **constitutive** of the meaning.

  **Seminar Tip:** Ask your students: "If the dictionary definition and the speaker's intended meaning come apart, and the hearer successfully grasps the intended meaning, did the dictionary help or hinder?" Davidson's point is that relying on the dictionary (the prior theory) would have led to failure. Success required abandoning the dictionary for a *passing theory*.

  ### 2. The "Slippery Slope" of Flexibility
  You asked why a conventionalist can't just say the system tolerates noise. Davidson's reply is that if you make the system flexible enough to account for all successful communication, it ceases to be a system of **conventions**.

  Conventions, by definition, are **normative** and **stable**. They imply: "You *ought* to use 'dog' to refer to dogs, and you *ought* to expect me to do the same."
  *   **Malapropisms:** Violate the norm.
  *   **Metaphors:** Violate the literal norm.
  *   **Neologisms:** Have no norm yet.
  *   **Contextual Shifts:** (e.g., "It's raining" means different things in different locations).

  Davidson argues that *every* utterance requires the hearer to construct a "passing theory"—a temporary hypothesis about what *this* speaker means by *these* sounds *right now*.
  *   In the case of Mrs. Malaprop, the passing theory diverges wildly from the prior theory (the shared English).
  *   In the case of "normal" speech, the passing theory converges closely with the prior theory.

  **The Argumentative Pressure:** If the mechanism of understanding is *always* the construction of a passing theory, then the "shared language" (the prior theory) is doing no theoretical work. It is merely a heuristic guess that often turns out to be right. If the *mechanism* is the same in both cases (radical interpretation), then positing a "shared language" as a distinct entity is redundant. It's like positing a "ghost in the machine" that watches the machine work; if the machine works without the ghost, why posit the ghost?

  ### 3. The Epistemological Symmetry (Radical Interpretation)
  This is the heart of the "Radical Interpretation" extension. Davidson asks: What evidence does the hearer have?
  *   **Case A (Foreigner):** You have no prior theory. You must observe behavior, hold truth as a norm, and construct a theory of what their sounds mean.
  *   **Case B (Compatriot):** You have a prior theory (English). But as Mrs. Malaprop shows, this prior theory can be false.

  If the prior theory can be false, the hearer cannot rely on it blindly. They must treat the compatriot's sounds as evidence for the speaker's **beliefs and intentions**, just as they would with the foreigner.
  *   To understand Mrs. Malaprop, I must think: "She *believes* 'epitaphs' sounds like 'epithets' and she *intends* to praise me."
  *   To understand a normal speaker, I must think: "He *believes* 'dog' refers to dogs and he *intends* to point out a dog."

  **The Conclusion:** The epistemological stance of the hearer is identical in both cases. They are inferring intention from behavior. The existence of a "shared convention" is just one more piece of evidence in the mix, not the foundation of the interpretation. Since the foundation is always *interpretation of intention*, there is no need to posit a shared language as the medium of that intention.

  ### 4. Addressing the "Flexible Conventionalist" Directly
  In your seminar, you can roleplay the conventionalist to draw out Davidson's counter.

  **Conventionalist:** "Surely you admit that without a shared language, we couldn't even start the interpretation process? We need the prior theory to get off the ground."
  **Davidson:** "I admit we need a *starting point*, but not a *shared* one. I need a theory about *you*. You need a theory about *me*. These theories may overlap significantly (which we call 'speaking English'), but they don't have to be identical for communication to succeed."

  **Conventionalist:** "But if we don't share a language, how do we learn language in the first place?"
  **Davidson:** "We learn by interpreting others. We don't learn a 'language' and then interpret; interpreting *is* the process that creates the temporary convergence we call language."

  **The Knockout Punch:** Davidson argues that if you define "language" loosely enough to include all the adjustments, metaphors, and malapropisms we successfully navigate, then "language" is no longer a **sharp, defined object**. It becomes just the "overlapping area of passing theories."
  *   If "English" is just the sum of all successful interpretations between English speakers, then "English" doesn't *cause* the success; the success *defines* what we retrospectively call "English."
  *   Therefore, "There is no such thing as a language" (in the sense of a fixed, shared theoretical entity that determines meaning).

  ### 5. Why This Matters (The Philosophical Stakes)
  To make this stick for your students, clarify what Davidson is *not* saying.
  *   He is **not** saying we shouldn't teach French or English.
  *   He is **not** saying communication is miraculous or private.

  He **is** saying that philosophy of language has been obsessed with **structure** (syntax, semantics, rules) when it should be obsessed with **agency** (intention, belief, interpretation).
  *   **The Conventionalist View:** Meaning is a property of *words* (encoded in the language).
  *   **The Davidsonian View:** Meaning is a property of *people* (using sounds in a context).

  The "pressure" comes from realizing that if meaning resides in people's intentions (which must be interpreted), then the "code" is secondary. If the code is secondary, it cannot be the defining feature of communication.

  ### Summary for the Seminar
  To crystallize the argument for your students, you might use this triad:

  1.  **The Phenomenon:** We understand speakers who violate conventions (Malaprop).
  2.  **The Dilemma:** Either (a) conventions determine meaning, or (b) interpreter's grasp of intention determines meaning.
  3.  **The Horns:**
      *   If (a), we shouldn't understand Malaprop (but we do).
      *   If (b), then conventions are not essential to meaning.
      *   Since (b) applies to *all* communication (because context always requires interpretation), conventions are never essential.
      *   Therefore, "Language" (as a system of conventions) is not essential to communication.

  Davidson's goal is to dethrone "Language" as the intermediary between minds. He wants to put us back in direct contact via the triangulation of speaker, hearer, and world, without the "third man" of a Shared Code standing in between. The "Nice Derangement" essay is his way of showing that the Third Man is unnecessary.
