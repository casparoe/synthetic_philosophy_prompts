          *   *Argument 3: The Normativity Problem.* Conventions are normative (you *ought* to use 'cat' for cats). Malapropisms show communication succeeds even when norms are violated. If success is possible without norms, norms aren't essential.
      *   **Why "No Shared Language"?** It's not that we don't speak English. It's that "English" isn't a *theoretical entity* that explains communication. It's a rough approximation of overlapping passing theories.
