      *   *Dignity vs. Safety:* Ubuntu isn't just about physical proximity; it's about *dignity* (isithunzi/seriti). If living with children makes her feel like a burden, her dignity is compromised.
      *   *Relational Autonomy:* It's not "Community vs. Individual." It's "How do we maintain relationship *in* the new setting?" Independent living $\neq$ Isolation.
      *   *Context:* Durban/South Africa context. Retirement villages exist. They can be communal spaces.
      *   *The "Fall":* The fall triggered this. Is it a medical issue or a desire for control after trauma?
      *   *Both are treating Ubuntu as an abstract theory rather than a lived practice.* Thandiwe treats it as "physical proximity." Bongani treats it as "rights talk." Real Ubuntu is about *flourishing relationships*. If the current family dynamic causes friction (evidenced by the rift), forcing cohabitation might violate Ubuntu (harmony).

