  8.  *(Final Polish)*: Make sure to emphasize that Gogo's *life history* matters. She lived near family her whole life. She knows what community is. Her choice isn't a rejection of community, but a reconfiguration of it.

  **(Self-Correction during drafting):** I need to be careful not to simply say "Bongani wins." Thandiwe's point about relationality is profound. The solution isn't liberal individualism, but a *different kind of relationality*. I need to make sure the "What both are getting wrong" section is the strongest part.

