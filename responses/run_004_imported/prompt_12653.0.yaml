      *   **Move (4) Bongani:** The "Smothering Objection." If the will is just a product of the community, the community can never be wrong about the individual. No critical leverage.
          *   *Assessment:* This is the standard liberal critique of strong communitarianism. It highlights the totalitarian risk.
          *   *Verdict:* Logically devastating to Thandiwe's extreme position. A theory needs normative bite to distinguish healthy vs. unhealthy community.

  3.  **Evaluate "Who has the better of each one":**
      *   (1) Thandiwe is right on Menkiti, but maybe wrong on application.
