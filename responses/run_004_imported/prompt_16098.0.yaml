      *   **Core Concept:** The Simple Conditional Analysis of Dispositions (SCA). $X$ is disposed to $M$ if $S$ occurs $\rightarrow$ $X$ does $M$.
      *   **Complications:**
          *   *Finks:* The disposition disappears/changes *at the moment* the stimulus occurs (e.g., a wizard makes the glass tough just as it's struck).
          *   *Masks:* The disposition remains, the stimulus occurs, but an external factor prevents the manifestation (e.g., the glass is wrapped in bubble wrap).
      *   **Constraints:**
          *   Short story format.
          *   Ordinary human characters/relationships (no glass, wiring, poison).
