answer: |-
  Arthur had spent twenty years building the firm, but only the last six months wondering if Simon would let it burn.

  It started with the audit. Rumors had circulated that Arthur's numbers were loose, creative in a way that could invite handcuffs. He needed to know if Simon, his junior partner and protégé, was made of the same stuff. Was Simon steadfast? If the walls closed in, would Simon hold the line, or would he slide out the back door?

  The first test happened in the conference room. The auditors were aggressive, circling like sharks. One of them, a woman with a voice like gravel, accused Arthur of falsifying the Q3 projections. It was a lie, but a dangerous one. Arthur saw Simon's jaw tighten. Simon's hand moved toward the file folder that contained the exonerating emails. He was ready to speak, ready to slam the proof onto the table. Simon's steadfastness was there, coiled and waiting.

  But Arthur, panicked by the accusation, kicked Simon under the table. It was a sharp, brutal nudge against the shin. "Let me handle this, Simon," Arthur said, his voice too loud.

  Simon's hand froze. He pulled it back to his lap. He sat silent for the rest of the hour, staring at his notepad. The auditors left with their suspicions intact. Later, Arthur watched Simon pack his bag. Simon hadn't spoken up. Arthur told himself it was cowardice. He didn't consider that Simon had been ready to act, but the kick had physically checked the motion, a gate slammed shut before the car could pass. Simon's nature hadn't changed, but the manifestation had been intercepted.

  The second test came three weeks later, in the privacy of Arthur's office. The situation had worsened; the SEC was involved. Arthur needed a signature. He needed Simon to co-sign a revised statement that would shift the liability entirely onto Arthur's personal assets, effectively ruining him, but saving the firm. It was the ultimate test of loyalty. If Simon was truly steadfast, he would refuse to let Arthur take the fall alone. He would insist on sharing the burden.

  Arthur slid the pen across the mahogany desk. "Just sign here, Simon. It's the only way to keep the lights on."

  Simon picked up the pen. He looked at Arthur, and for a second, the old bond was visible in his eyes. He was willing. He was ready to refuse the pen, ready to argue for a joint statement, ready to stand in the fire with his mentor.

  But the moment Simon read the fine print of the revision, something shifted. He saw that the revision wasn't just about liability; it admitted to fraud that Simon knew hadn't happened. The stimulus—the request itself—revealed that Arthur wasn't just protecting the firm; he was asking Simon to validate a lie.

  In that instant, the Simon who would have stood by Arthur ceased to exist. The request dissolved the loyalty it was meant to measure. Simon put the pen down. "I can't do this, Arthur."

  "You never cared about the place," Arthur said, the bitterness tasting like copper. He believed Simon had never been loyal. He didn't see that Simon *had* been, right up until the moment the test destroyed the very thing it was testing.

  Now, Arthur sits alone in the office. The building is quiet. He has a third test prepared in his drawer, a final scenario to determine once and for all if Simon is a friend or a threat. He holds the file in his hand, weighing it.

  He realizes that to run the test, he has to invite Simon back into the room. He has to apply the pressure. But if he applies the pressure, he might break the bond again, or he might step in the way without knowing it. He looks at the empty chair across from his desk. He wonders if there is any way to touch a thing without changing its temperature, any way to ask a question without altering the answer.

  Arthur puts the file back in the drawer and locks it. He stares at the wood grain, waiting for a truth that refuses to stay still long enough to be seen.
