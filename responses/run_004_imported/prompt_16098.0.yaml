          *   Plot point 1: The trait is *finked* (gained/lost at the moment of testing).
          *   Plot point 2: The trait is *masked* (present, stimulus applied, but blocked).
          *   No philosophical jargon (don't name "fink" or "mask").
          *   Second character tries to test the first.
