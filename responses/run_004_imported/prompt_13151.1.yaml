answer: |-
  This is one of the most contentious and philosophically dense problems in Spinoza scholarship. You are right to feel the friction: on the surface, this passage seems to violate the nominalism of the *Ethics*, the descriptive definition of right in the *TTP*, and the necessitarian view of history.

  However, if we look at the "mechanics" of the *Political Treatise* (TP) specifically, we can reconstruct the argument without resorting to "he was a man of his time." The key is to recognize that in the *TP*, Spinoza is no longer just doing metaphysics or descriptive anthropology; he is doing **political engineering**.

  Here is the breakdown of how this argument functions within his system, where it holds, and where the "crack" actually is.

  ### 1. Right = Power, but Power = Stability
  You correctly note that for Spinoza, *natural right* is co-extensive with *power* (*potentia*). In the state of nature, everyone has a right to whatever they can get. However, the *Political Treatise* is concerned with the transition to civil society. In civil society, "right" is determined by the power of the **sovereign**.

  The goal of the sovereign, per Spinoza, is not justice in a moral sense, but **stability and peace** (which equates to the maximization of the state's collective *potentia*).

  *   **The Mechanic:** Spinoza's argument here is not that women *morally ought* to be subordinate. It is that a state which attempts to grant women equal political power will **destroy its own power**.
  *   **The Logic:** If the inclusion of women in the ruling class leads to civil strife (via the jealousy/lust dynamic he mentions), then the state becomes less powerful. If the state becomes less powerful, it loses its *right*. Therefore, to maintain its *right* (power/stability), the state *must* exclude women.
  *   **Resolution:** This is consistent with *Right = Power*. He is claiming that female political participation is structurally incompatible with the *potentia* of the state. It is a claim about **systemic capacity**, not individual worth.

  ### 2. The Empirical Argument and Necessity
  You ask if the "no nation has ever..." move is doing modal work it shouldn't. In most contexts, Spinoza rejects arguments from universal consent (e.g., in the *TTP* regarding religion, he notes that just because everyone believes something doesn't make it true). So why use it here?

  *   **Human Nature as Constant:** In the *TTP* Preface, Spinoza states that he derives politics from "human nature," which he treats as constant across time and place. Unlike religious superstitions (which vary wildly), the **laws of the affects** (passions) are like the laws of physics.
  *   **Inference to Necessity:** For Spinoza, if a phenomenon (male rule) is universal across all known histories and cultures, it is not a contingent accident. It indicates a necessary cause rooted in the constant laws of human affect.
  *   **The Mechanic:** He is treating history as a laboratory. If the experiment "female rule" has failed in every trial condition, the failure is likely due to the constants of the system (human nature/affects), not the variables (culture/law).
  *   **Resolution:** This isn't a violation of necessitarianism; it's an application of it. He is arguing that the *conatus* of men and women, when interacting politically, necessarily produces this outcome given the laws of the affects.

  ### 3. The "Essence" Problem (Nominalism vs. Affective Constitution)
  This is the hardest hurdle. Spinoza denies fixed species essences in the *Ethics* (universals are modes of imagining). So how can he posit a fixed "female nature"?

  *   **Bodies and Capacities:** Spinoza does not believe in a metaphysical "Form of Woman," but he *does* believe bodies differ in their capacity to be affected (*Ethics* 3p57). He posits that men and women differ in their **affective constitution**.
  *   **The Jealousy Mechanism:** Look closely at the text following the quote you provided. He argues that if men and women ruled together, men would be ruled by **lust** for women, and women would be ruled by **jealousy** of other women (and men).
  *   **The Mechanic:** This is not a claim about rational essence; it is a claim about **relational dynamics**. Spinoza is arguing that the specific *relation* between the sexes is inherently fraught with passions that undermine reason (*fortitudo*).
      *   Men cannot look at women politically because they see them sexually (passive affect).
      *   Women, in Spinoza's view (which relies on the biology/psychology of his day), are more subject to passions that make them less capable of the detachment required for sovereignty.
  *   **Resolution:** He isn't smuggling in a teleological essence. He is making a claim about **affective incompatibility**. It is similar to arguing that oil and water don't mix. It's not that oil has a "fixed essence" preventing mixing, but that their physical properties make a stable mixture impossible. Spinoza treats gendered bodies as having different "political viscosities."

  ### 4. Where the System Actually Cracks
  While the above reconstructs the internal logic, there *is* a genuine tension, and scholars like Moira Gatens and Étienne Balibar have pointed it out.

  **The Tension:** Spinoza's entire philosophical project is dedicated to showing that **passions can be understood and mitigated by reason.** In the *Ethics*, he argues that no one is born free, but everyone can *become* free through understanding their affects.

  *   **The Contradiction:** In the *TP*, Spinoza effectively treats women's affective constitution as **fixed and unchangeable**. He denies them the possibility of the very liberation his *Ethics* promises. He treats "woman" as a category permanently bound to passion, whereas "man" is a category capable of reason.
  *   **The Modal Failure:** If Spinoza is a true necessitarian, he should acknowledge that a society *could* arise where education and institutions alter the affective balance between sexes. By saying "it has nowhere happened... therefore it cannot," he slips from **historical necessity** (it hasn't happened yet) to **metaphysical impossibility** (it can never happen).
  *   **Why?** The most charitable mechanical explanation is that Spinoza views the **sexual affect** as uniquely resistant to rationalization. While ambition or anger can be sublimated into civic virtue, he seems to think the lust/jealousy dynamic is too immediate and bodily to be institutionalized.

  ### Summary of the Mechanics
  1.  **Right = Power:** He isn't making a moral claim; he's making a stability claim. Including women reduces the state's *potentia*, so the state's *right* requires excluding them.
  2.  **Empiricism:** He uses history to identify constant laws of the affects. Universal male rule implies a necessary cause in human nature, not contingency.
  3.  **Essences:** He isn't positing a metaphysical essence, but a difference in **affective capacity** and **relational dynamics** (lust/jealousy) that makes co-rule unstable.
  4.  **The Crack:** The inconsistency lies in his **optimism about reason**. His system says passions can be overcome; this passage assumes women's passions cannot be. This suggests that for Spinoza, gender is the one area where he abandons his own anti-teleological, liberatory metaphysics in favor of a biological determinism that serves his political realism.

  **Verdict:** It is not a "decorative" argument; it is a structural load-bearing wall in his specific theory of democracy. However, it *is* a crack in the broader system because it treats a historical pattern of power as a metaphysical limit on capacity, which contradicts the core Spinozist idea that *potentia* can always be increased through reason. He essentially argues that women are structurally incapable of the reason required to increase their *potentia* to the level of sovereignty.
