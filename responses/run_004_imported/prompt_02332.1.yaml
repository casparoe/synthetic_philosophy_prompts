      *   *Refinement on Diamond:* Make sure Marcus explains *why* the coin flip violates the theorem. The theorem says if everyone is indifferent between two lotteries, society must be. In Diamond's case, individuals might prefer the fair lottery (ex-ante) even if ex-post outcomes are identical in expectation. Wait, Diamond's point is usually that Society prefers the lottery (fairness) while the *sum of utilities* is indifferent. Actually, the standard Diamond critique is that if individuals only care about their own consumption, they are indifferent between (Give to A) and (Give to B) if they aren't the recipient. But Society *should* prefer the 50/50 lottery. Harsanyi's theorem forces Society to be indifferent if individuals are. I need to be precise here.
