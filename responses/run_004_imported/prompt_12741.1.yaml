answer: |-
  **MEMORANDUM**

  **TO:** Ad Hoc Committee on Post-Tenure Review
  **FROM:** [Student Name], Student Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Late-Career Capacity Review

  As we prepare for Tuesday's vote, I recommend we **reject the mandatory age-75 trigger** and instead adopt a **Performance-Triggered Review Protocol** integrated into our existing age-neutral cycle. Specifically, I propose we retain the five-year cycle but amend it to include mandatory graduate student exit interviews for all reviewers, and establish a streamlined mechanism whereby the Dean may initiate an immediate off-cycle review upon receipt of three or more credible, documented complaints regarding teaching or supervision capacity.

  My reasoning draws directly on the principles emerging from our recent engagement with Cicero's *De Senectute*, applied not as historical color but as structural logic. Cicero's Cato concedes that physical decline is real, yet he insists that for intellectual roles, capacity must be judged by output, not chronology. The anecdote of Sophocles is decisive here: when hauled into court to prove incapacity based on age, Sophocles did not argue his birth certificate; he read his play. The jury acquitted him based on the *work*, not the *worker*. By instituting an age-75 trigger, we effectively presume the sons' position: that age itself is evidence of incapacity. By shifting to a complaint-triggered model, we preserve the Sophoclean right to prove fitness through current performance. Furthermore, Cato argues that irritability and negligence are faults of character, not age, often visible long before retirement. An enhanced five-year cycle with robust student feedback captures these character-based declines whenever they occur, rather than waiting for a arbitrary birthday or waiting until harm is catastrophic.

  I recognize this recommendation does not fully satisfy the "Yes" side of our committee, and your concerns deserve a precise accounting. Your strongest argument is one of **preventative prudence**. You argue that waiting for documented complaints is, by definition, waiting for harm to occur. In the case that motivated this proposal, students suffered for years because colleagues were reluctant to file "credible complaints" against a respected senior figure. You liken faculty to airline pilots or judges, where mandatory retirement or review ages exist not because every individual declines at 75, but because the cost of a single failure is too high to risk relying on self-policing. From this view, the age-75 trigger is not an insult to the productive 75-year-old, but a neutral administrative safety net that protects students from the unproductive one without requiring colleagues to initiate a hostile process. You contend that a "complaint-based" system places the burden of enforcement on those least empowered to bear it (students) or those most socially inhibited (junior colleagues).

  However, I believe the Performance-Triggered Protocol addresses this by lowering the barrier for intervention without codifying age discrimination. It allows for immediate action when signs of decline appear, rather than waiting for a date that may be too late for some and premature for others.

  I urge the committee to consider this alternative as a means to secure student safety without compromising the principle that academic fitness is a measure of mind, not time.
