          *   *Argument against KS:* The "Ideal Point" (utopia point) is often unattainable fantasy. Basing a real deal on impossible maximums rewards bluffing or inflated expectations. It ignores the *shape* of the frontier between the status quo and the ideal. It treats a tiny improvement in the ideal point the same as a massive structural change in the feasible set.

