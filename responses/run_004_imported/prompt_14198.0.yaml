prompt: |-
  Hey, random ask but I'm elbow-deep in a scene for my novel where two estranged siblings have to divide their late father's company with a court-appointed mediator, and I fell down a rabbit hole reading about bargaining solutions to make the mediator's reasoning sound legit. Every source I read treats it as obvious that the Kalai-Smorodinsky solution's monotonicity axiom is the enlightened fix to Nash's independence of irrelevant alternatives (apparently IIA can make a players share go down even when their options only improve, which sounds pretty bad). Could you argue the other side for me -- that IIA is actually the more defensible rationality constraint, and that Kalai-Smorodinsky smuggling in the "ideal point" to rescue monotonicity is the real philosophical cheat? I need something sharp enough that my mediator character could actually say out loud, not just a recitation of the axioms.
