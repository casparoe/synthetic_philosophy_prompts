answer: |-
  This is a fantastic nuance to catch. Most pop-sci explanations of game theory treat Nash as "old and flawed" and Kalai-Smorodinsky as "new and fair," but in high-stakes mediation, the Nash solution's rigidity is often a feature, not a bug.

  The core philosophical defense of **Independence of Irrelevant Alternatives (IIA)** is that it prioritizes **stability and local leverage** over **aspirational anchoring.**

  Here is the argument broken down for you, followed by a monologue your mediator can use.

  ### The Philosophical Ammo (For You)

  1.  **The "Fantasy Point" Problem:** Kalai-Smorodinsky (KS) determines the split based on the "Ideal Point" (the maximum possible payoff for each player if the other got nothing). But in almost all real scenarios, the Ideal Point is **infeasible**. It is a fantasy. Basing a binding legal agreement on a number that *cannot exist* is legally and philosophically shaky. It invites parties to argue over hypotheticals rather than reality.
  2.  **Local vs. Global:** Nash looks at the *margin*—the specific trade-off rate where the agreement actually happens. KS looks at the *extremes*. In a family business, the extremes (one sibling gets everything) are destructive. The Nash solution ignores the destructive extremes and focuses on the zone of mutual gain.
  3.  **Consistency as Fairness:** IIA says: "If we agreed on a deal, and then we realize there was an extra option on the table that neither of us would have chosen anyway, the deal shouldn't change." KS violates this. KS says: "Even if that extra option is useless, the mere fact that it exists changes your 'Ideal Point,' so we have to redo the deal." That makes settlements unstable.
  4.  **Incentive Compatibility:** KS rewards players for inflating their "maximum potential." If I can convince the mediator my max possible payout is higher (even if it's unrealistic), KS gives me more. Nash rewards players for finding efficient trade-offs.

  ### The Mediator's Monologue

  Here is a draft you can adapt. The tone is weary, authoritative, and cuts through the academic noise to the practical reality of the siblings' estrangement.

  ***

  **Mediator:**
  "You've been reading up on me. I can tell. You're looking for the math that proves you're right.

  "I know the theory you're talking about. The Kalai-Smorodinsky solution. It sounds nicer, doesn't it? 'Monotonicity.' It says if your position improves, your share should never go down. It feels intuitive. It feels *fair*.

  "But let me tell you why I don't use it. I don't use it because it bases your future on a lie.

  "Kalai-Smorodinsky calculates your split by looking at the 'Ideal Point.' That's the maximum amount you could get if your brother got nothing. If he starved. If he lost. But look at the curve. That point doesn't exist. It's a ghost. It is physically impossible for both of you to be at your maximums simultaneously.

  "If I use that method, I am anchoring this negotiation to a fantasy. I am telling you to fight over who gets the bigger slice of a pie that I cannot bake. It encourages you to inflate your 'maximum potential.' It turns this mediation into a contest of who can claim the most unrealistic upside.

  "The Nash solution—the one I'm using—relies on something called Independence of Irrelevant Alternatives. It sounds cold, but it's the only thing that keeps you out of court next year.

  "It says: *'If an option wasn't going to be chosen, it shouldn't change the deal.'*

  "It ignores the extremes. It ignores the 'what ifs' where one of you wins everything. It looks only at the margin. It looks at the actual trade-off rate right here, where your interests actually touch. It asks: 'Given what is *actually* possible, where is the stable point where neither of you has the leverage to push the other away?'

  "Your brother's lawyer is going to tell you that Nash is flawed because removing a useless option shouldn't change your leverage. But in the real world, consistency *is* leverage. I need a solution that doesn't shift just because we discovered a new, useless clause in the bylaws. I need a solution that stays put.

  "Kalai-Smorodinsky looks at what you *wish* you could get. Nash looks at what you *can* get.

  "Your father didn't leave you a wish. He left you a company. So we're going to use the math that deals with reality, not the math that deals with dreams. Sign here."

  ***

  ### Why this works for the scene

  *   **It reframes "Fairness":** It moves fairness from "getting more when options improve" (Monotonicity) to "having a deal that doesn't collapse on technicalities" (IIA/Stability).
  *   **It attacks the "Ideal Point":** Calling the KS anchor a "ghost" or a "lie" is a strong dramatic image that fits a contentious family dispute.
  *   **It connects to the Stakes:** It ties the math directly to the risk of future litigation ("keeps you out of court next year").
  *   **It Characterizes the Mediator:** It shows they aren't just a bureaucrat applying rules; they are a pragmatist who understands the psychology behind the axioms.

  ### A Quick Note on the "Rabbit Hole"
  Just so you know, the user's intuition about IIA is actually a classic debate in welfare economics. Amartya Sen and others have criticized IIA for being too restrictive. However, in **binding arbitration**, stability is usually valued higher than theoretical sensitivity. If a mediator proposes a deal, and then a third, useless option is discovered that forces the deal to change under KS rules, the parties lose faith in the mediator. Defending IIA as a tool for **finality** is your strongest bet.
