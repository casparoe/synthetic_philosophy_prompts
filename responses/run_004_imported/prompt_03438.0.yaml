answer: |-
  The strongest argument against your friend does not rest on holism alone, but on the **metaphysical commitments required to sustain the distinction they are drawing**. Your friend's objection relies on a dualism between "External Nature" (which constrains science) and "Internal Taste" (which constrains ethics) that is incompatible with Quine's own thoroughgoing naturalism.

  To defend the position that Quine is not entitled to this asymmetry, you must argue that **Quine's naturalism dissolves the very boundary your friend is trying to exploit.** If we take Quine's naturalized epistemology seriously, we cannot privilege sensory irritation as the only "external" constraint without abandoning the view that human beings are continuous with the rest of nature.

  Here is the construction of that argument, broken down into four moves.

  ### 1. The "External Nature" Objection Presupposes a Myth Quine Rejects
  Your friend argues that science is constrained by an external nature that forces itself upon us, whereas ethics is constrained only by internal tastes. This assumes we have access to "nature" independent of our conceptual scheme to verify that it is truly "external" in a way that moral sentiments are not.

  But Quine famously rejects the "Myth of the Given." For Quine, the "external world" is itself a posit within our best scientific theory. We do not have direct access to reality; we have neural irritations at our sensory surfaces. Science is the tool we construct to predict and manage those irritations.

  If "external nature" is just a theoretical posit designed to make sense of sensory inputs, then **moral values are posits designed to make sense of social and psychological inputs.** To say science answers to "reality" while ethics answers to "taste" is to step outside the web of belief and claim a God's-eye view of what counts as "real" constraint. Quine's naturalism forbids this. From within the web, both sensory irritations and moral aversions are causal impacts on the organism. Privileging one as "objective constraint" and the other as "subjective taste" is a residual metaphysical dualism, not a naturalistic conclusion.

  ### 2. Moral Sentiments are Natural Kinds with Causal Histories
  Quine's naturalism treats human beings as physical objects within the natural order. Our "ultimate ends" (likes and aversions) are not magical, non-natural properties; they are the result of evolution, biology, and social conditioning. They are as much a part of "nature" as the refractive index of glass.

  When your friend says ethics bottoms out in "tastes," they imply these tastes are arbitrary or ungrounded. But for a naturalist, **moral sentiments are natural facts with causal powers.**
  *   **Science** is constrained by the fact that if we ignore physical laws, bridges collapse (sensory/physical recalcitrance).
  *   **Ethics** is constrained by the fact that if we ignore certain moral norms (e.g., regarding cruelty or fairness), societies fracture, individuals suffer, and cooperation fails (psychological/social recalcitrance).

  If Quine allows that the "recalcitrance" of experience disciplines science, he must acknowledge that the "recalcitrance" of social pain and psychological conflict disciplines ethics. To deny this is to arbitrarily declare that physical pain counts as a "constraint from nature" but psychological suffering counts merely as "taste." A consistent naturalist must treat both as natural phenomena that theories (scientific or moral) must accommodate to be successful.

  ### 3. Intersubjectivity, Not Externality, is Quine's Criterion of Objectivity
  Quine does not actually define scientific objectivity by correspondence to a mind-independent reality (which he thinks is unintelligible). He defines it by **intersubjectivity**. An observation sentence is cognitively meaningful if it commands the assent of all speakers of the language given the same concurrent stimulation.

  This opens the door for your counter-argument: **Moral observation sentences can be intersubjective.**
  Sentences like "That is cruel" or "This is unfair" often command the same immediate assent within a community as "That is red." If the mark of scientific objectivity for Quine is the uniformity of response across a linguistic community (which he emphasizes in *Word and Object* and *The Roots of Reference*), then moral judgments that exhibit cross-cultural or intra-cultural uniformity earn the same status as scientific observation sentences.

  Your friend claims there is no "moral nature" to answer to. But for Quine, "nature" is just the shared structure of our sensory and social experience. If moral disagreements are less constrained than scientific ones (as Quine claims), it is a matter of degree (sociological fact), not kind (metaphysical fact). Quine is not entitled to treat the *degree* of uniformity as a *qualitative* asymmetry that relegates ethics to mere emotivism. If ethics is less uniform, it is simply a less developed or more complex branch of natural inquiry, not a different category of discourse entirely.

  ### 4. The Pragmatic Parity of Theoretical Virtues
  Finally, return to your Morton White point, but sharpen it with Quine's pragmatism. Quine admits that the "periphery" of science is not just raw data; it is shaped by theoretical virtues like simplicity, conservatism, and fertility. These virtues are not "forced" by nature; they are **values** we impose on science to make it work.

  *   Why prefer a simpler theory? Because it is more useful for prediction.
  *   Why prefer a conservative theory? Because it minimizes disruption to the web.

  These are instrumental values. But this means **science itself rests on a foundation of non-empirical values.** If Quine allows that pragmatic values (simplicity, etc.) are legitimate components of scientific methodology because they help us navigate the world, he cannot consistently deny that moral values (well-being, cooperation, etc.) are legitimate components of ethical methodology because *they also* help us navigate the world.

  To say science answers to the world while ethics answers to values is to ignore that science *also* answers to values (pragmatic ones). If pragmatic values earn a place in the scientific web because of their utility, moral values earn a place in the ethical web for the same reason. To deny this is to violate the naturalistic principle that all knowledge is a tool for coping with experience.

  ### Conclusion: The Asymmetry is a Lapse, Not a Feature
  Your friend's objection holds only if one accepts a metaphysical realism that Quine's own philosophy undermines. If Quine is a naturalist, he must view moral values as part of the natural history of the human animal, subject to the same pressures of survival, coherence, and predictive success as scientific theories.

  The argument you should present is this: **Quine's asymmetry relies on a distinction between "fact" and "value" that his own holism and naturalism render untenable.** By granting science a monopoly on "answering to the world," Quine is secretly reintroducing the analytic/synthetic distinction he famously destroyed. He treats scientific principles as responsive to the world and moral principles as responsive to the mind, ignoring that for a naturalist, the mind is part of the world, and the "world" is a construct of the mind.

  Therefore, Quine is not entitled to the asymmetry. He can claim ethics is *harder* or *less uniform* than science, but he cannot claim it is *methodologically inferior* or *non-cognitive* without abandoning the naturalistic framework that makes his epistemology compelling in the first place. Your friend's "external nature" is a phantom; the only nature we have is the one we theorize, and that theorizing is driven by needs that are both physical and moral.
