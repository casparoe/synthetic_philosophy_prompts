answer: |-
  Your friend is onto something very real. In fact, she has stumbled directly into a live and contentious debate in contemporary moral philosophy known as **the Problem of Moral Testimony.**

  Her intuition that outsourcing a moral verdict feels different from outsourcing a financial calculation is shared by many philosophers. While a financial advisor provides *technical expertise* to help you achieve a goal you already have (profit), a moral advisor is being asked to define the *goal itself* (the good).

  Here is a breakdown of why her unease is philosophically justified, structured so you can explain it to her without needing a degree in ethics.

  ### 1. Moral Agency and Autonomy (The Kantian View)
  In finance, the goal is external to the decision-making process. The goal is "maximize value." If the uncle can calculate that faster than she can, she hasn't lost anything by letting him do it. The math is a tool.

  In morality, the decision-making process *is* the point. Immanuel Kant argued that for an action to have moral worth, it must be done out of a recognition of duty, guided by one's own reason. If she sells the store to the local buyer simply because her uncle said "do it," she isn't acting morally; she is acting obediently. She has surrendered her **moral autonomy**.

  *   **The takeaway for her:** By refusing to engage with the *reasons*, she is treating herself like a child or a subordinate rather than a moral agent. The "trouble" she feels is her own autonomy resisting being bypassed.

  ### 2. The Problem of Moral Testimony
  This is the specific philosophical term for her dilemma. Philosophers like Alison Hills and Sarah McGrath argue that relying on moral testimony (trusting someone else's moral verdict without understanding the reasons) prevents **moral understanding.**

  If she follows her uncle's verdict without knowing *why*, she cannot:
  *   Defend the decision if challenged.
  *   Apply the same logic to future dilemmas.
  *   Truly appreciate the value of the choice she made.

  If the uncle says, "Sell to the local buyer," and she does, she gets the right outcome. But she lacks the *knowledge* of why that was right. If circumstances change slightly next year, she will be helpless again. Moral reasoning is a muscle; if you don't use it, it atrophies.

  *   **The takeaway for her:** She isn't just buying a decision; she is building a character. Outsourcing the decision prevents her from growing the wisdom she will need for the next hard choice.

  ### 3. Virtue Ethics and "Phronesis"
  Aristotle would argue that ethics isn't about following rules or getting the right output; it's about cultivating *phronesis* (practical wisdom). You become a virtuous person by practicing virtuous reasoning.

  When she asks the uncle for the financial bottom line, she is acknowledging he has a technical skill she lacks. But when she asks for the moral bottom line, she is implying that "being good" is a technical skill that can be delegated. It isn't. It is a practice of living.

  *   **The takeaway for her:** The discomfort she feels is the gap between *doing the right thing* and *being a good person*. You can do the right thing by accident or by order, but you can only *be* a good person by engaging your own judgment.

  ### 4. Accountability Cannot Be Delegated
  This is the most pragmatic point. If she takes the uncle's financial advice and it turns out to be wrong, she can blame the uncle (or at least, the error is technical). But if she takes his moral advice and the store closes anyway, or the employees suffer, **she** is the one who signed the papers. **She** is the one who has to look the employees in the eye.

  Moral responsibility is non-transferable. You can delegate authority, but you cannot delegate guilt or regret. By asking for the verdict without the reasons, she is trying to insulate herself from the weight of the responsibility. Her intuition is warning her that she is trying to have the power of ownership without the burden of conscience.

  ### How to Talk to Her
  You can tell her that her "squeamishness" is actually a sign of moral health. It suggests she understands that morality isn't just about getting the right answer; it's about owning the question.

  **A suggested script:**
  > "You're feeling troubled because you're sensing a difference between *technical* problems and *moral* problems. With the finances, the uncle is a calculator; he helps you get what *you* want. With the ethics, if you just take his verdict, you aren't making a moral choice at all—you're just following orders.
  >
  > Philosophers call this the 'Problem of Moral Testimony.' The idea is that if you don't understand *why* something is right, you can't truly own the decision. You can't delegate your conscience, because you're the one who has to live with the outcome. Your unease is your moral agency telling you that it wants to be part of the process, not just the engine that executes it."

  ### The Nuance (To be fair)
  There is a counter-argument (often from Utilitarians) that says: "Who cares about her autonomy? If the uncle knows the right thing to do, and she does it, the employees keep their jobs. That's what matters."

  However, even in that view, her unease is valid because **reliability.** If she doesn't understand the reasons, she can't verify if the uncle is actually right. He might be operating on outdated biases. By demanding reasons, she isn't just satisfying her ego; she is stress-testing the moral advice itself.

  ### Summary
  She is not being squeamish. She is recognizing that **moral worth resides in the reasoning, not just the result.** To outsource the reasoning is to outsource her own humanity in that moment. She should ask her uncle for his reasons, wrestle with them, and then make the decision herself. That struggle *is* the morality.
