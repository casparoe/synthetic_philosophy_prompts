prompt: |-
  A friend of mine, who has never studied any philosophy, recently described a dilemma to me that I haven't been able to stop thinking about. She has inherited the family hardware store and must choose between two buyers: a private equity firm offering considerably more money but known for gutting the companies it acquires and laying off longtime employees, and a local buyer offering less who would likely keep the store running much as it is. Overwhelmed, she asked her uncle — whose moral judgment she trusts far more than her own — simply to tell her which sale would be the right one, and said she would act on his verdict alone, without needing to hear his reasons. She mentioned, almost in passing, that she would feel no hesitation asking that same uncle, a retired accountant, to just tell her which offer was financially sounder, without walking her through the calculations. But outsourcing the moral question this way strikes her as different, even faintly troubling, and she can't say why. Is she onto something real, or is she just being morally squeamish for no good reason? I'd like to have something better than a shrug ready for her.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Scenario:**
      *   **The Protagonist:** A friend who inherited a hardware store.
      *   **The Dilemma:** Sell to a Private Equity (PE) firm (high price, job losses) vs. a Local Buyer (lower price, status quo).
      *   **The Action:** She asks her uncle (trusted moral authority) for the *verdict only*, no reasons. She commits to following it blindly.
      *   **The Comparison:** She notes she would do the same for financial advice (ask the accountant uncle for the bottom line without the math).
      *   **The Intuition:** She feels outsourcing the *moral* decision is different/troubling compared to outsourcing the *financial* one, but can't articulate why.
      *   **The User's Goal:** Provide a philosophical explanation for why her intuition is valid (or invalid), giving the user something better than a "shrug" to offer her.

  2.  **Identify the Core Philosophical Issue:**
      *   This is about **Moral Agency**, **Autonomy**, and the nature of **Moral Reasoning**.
      *   It touches on **Heteronomy vs. Autonomy** (Kant).
      *   It touches on **Moral Testimony** (a specific debate in contemporary meta-ethics).
      *   It touches on **Virtue Ethics** (developing character through decision-making).
      *   It touches on the difference between **Technical/Instrumental Rationality** (finance) and **Practical/Moral Rationality** (ethics).

  3.  **Brainstorming Arguments (Why is moral outsourcing different?):**

      *   *Argument 1: Moral Agency/Autonomy.* Moral worth comes from *choosing* the right thing for the *right reasons*. If you just obey, you aren't acting morally; you're acting obediently. (Kantian perspective).
      *   *Argument 2: Moral Testimony Problem.* Philosophers like Sarah McGrath or Alison Hills argue that relying on moral testimony prevents understanding. You can't truly "own" the moral value if you don't grasp the *why*.
      *   *Argument 3: Virtue Ethics.* Being a good person is a skill (phronesis). You build the skill by practicing the reasoning, not just copying the output. If you outsource, you stunt your moral growth.
      *   *Argument 4: Responsibility.* If the outcome is bad, who is responsible? In finance, if the uncle is wrong, he's the bad accountant. In morals, if she does "wrong" because he said so, she is still the one who did it. She can't offload the *guilt* or the *impact*.
      *   *Argument 5: The Nature of the Domains.* Finance is objective/technical (mostly). Morality is subjective/normative. Asking "what adds up?" is different from "what is good?"

  4.  **Structuring the Response:**
      *   **Validation:** Start by affirming her intuition. She *is* onto something real. It's a recognized philosophical puzzle.
      *   **Concept 1: Moral Agency & Autonomy (Kant).** Explain that morality isn't just about the *outcome*, it's about the *will*. Blind obedience removes moral worth.
      *   **Concept 2: The Problem of Moral Testimony.** Introduce the specific philosophical debate. Relying on testimony blocks moral understanding.
      *   **Concept 3: Virtue & Character (Aristotle).** Moral decisions shape *who you are*. Outsourcing prevents character development.
      *   **Concept 4: Responsibility.** You can delegate calculation, but you can't delegate accountability.
      *   **Counter-point (Nuance):** Acknowledge when deferring *is* okay (emergency, lack of capacity), but this isn't one of those cases.
      *   **Conclusion/Advice:** How to talk to the friend. Encourage her to ask for reasons, not just verdicts.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Finance vs. Morality comparison:* In finance, the goal is external (maximize profit). The uncle is a tool. In morality, the goal is internal (be a good person/act rightly). The process *is* the point.
      *   *Key Terminology:* "Moral Testimony," "Autonomy," "Heteronomy," "Phronesis" (practical wisdom). Keep it accessible since the friend isn't a philosopher.
      *   *Tone:* Empathetic, intellectual but not pedantic, validating.

  6.  **Self-Correction/Check during drafting:**
