  8.  **(Post-Drafting Review):** The resulting explanation covers Kantian autonomy, the Moral Testimony debate, and Virtue Ethics. It validates her feeling without being condescending. It gives the user concrete talking points. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Ensure I explicitly name the "Problem of Moral Testimony" as it's the exact academic term for this intuition. It gives the user a hook to research further if they want.

