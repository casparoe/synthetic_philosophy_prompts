      *   **Probability:** $P(n) = (1/2)^n$.
      *   **Expected Value (EV) Calculation:** $E = \sum_{n=1}^{\infty} P(n) \cdot \text{Payoff}(n) = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$.
