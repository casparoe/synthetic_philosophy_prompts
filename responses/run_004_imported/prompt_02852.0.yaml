  quick question about the Pasadena game (that st. petersburg-style coin flip gamble). you flip a fair coin til it lands heads, and if the first heads is on toss n you win 2^n/n dollars when n's odd, or lose 2^n/n when n's even. everyone acts like its expected value is some deep 'undefined' mystery, but when i actually add up the series in the obvious order (n=1, then n=2, then n=3...) i get a perfectly normal convergent number, something like ln(2). if the natural ordering gives you a clean finite answer like that, why do decision theorists insist its undefined instead of just using ln(2) and moving on?
