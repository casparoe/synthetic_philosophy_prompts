      *   Absolute convergence check: $\sum \left| \frac{(-1)^{n+1}}{n} \right| = \sum \frac{1}{n}$ (Harmonic Series), which diverges to infinity.
      *   **Riemann Rearrangement Theorem:** If a series is conditionally convergent, its terms can be rearranged to sum to *any* real number, or to diverge to $+\infty$ or $-\infty$.

