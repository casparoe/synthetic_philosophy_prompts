          *   *Augustine:* In *De Mendacio*, Augustine defines a lie (*mendacium*) as speaking falsely with the intention to deceive (*fallendi voluntate*). Crucially, it depends on the mind of the speaker. If someone says something false believing it true, it's an error, not a lie. If someone says something true believing it false (intending to deceive), it is a lie (because the heart is double).
