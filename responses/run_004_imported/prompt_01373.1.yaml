      *   *Tone Check:* Keep it collegial. "As you know," "You'll recall."

  8.  **Final Polish:** Ensure the distinction between "content-increasing" and "content-preserving" is clear. (Neptune increased content by predicting a *new* planet's position independently of Uranus's anomaly specifics? No, it used the anomaly to predict position. The *novelty* is that the position was independent of the *discovery* method. Wait, let's be precise: The novel fact is the *existence* of the planet at that location, which was not used to construct the theory. The anomaly *was* used. The prediction is the *observation*.)
      *   *Refinement on Novelty:* Lakatos follows Popper on novelty. A fact is novel if it was not used in the construction of the hypothesis. Le Verrier used Uranus's orbit to calculate Neptune. He did *not* use the visual observation of Neptune. Therefore, the visual observation is novel. Same for Vulcan. The difference is the *corroboration*.
      *   *Wait, one nuance:* Lakatos distinguishes between *heuristic* progress and *empirical* progress. A programme can be theoretically progressive (predicting new things) but temporarily empirically stagnant. Vulcan became degenerating because it required *further* adjustments to explain non-detections (making it *ad hoc1* eventually). Neptune didn't need further adjustment; it worked immediately.

      *(Self-Correction)*: I need to be very precise about the "in principle" claim. Lakatos argues that we can identify *potential* progressiveness at $t_0$. Both were potentially progressive. The divergence happens at $t_1$. The demarcation is not a snapshot but a trajectory.

