answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name], and I have the distinct privilege of standing here as best man.

  Looking out at the room, I see a fascinating distribution. On one side, we have family and friends who know [Partner A] and [Partner B] as loving, kind, whole human beings. On the other side, we have the LessWrong crowd, who know them as formidable intellects capable of dissecting a philosophical paper until it confesses its sins.

  If you're in the first group, welcome. You might hear some jargon tonight. If you're in the second group, welcome. Please try to remember that emotions exist.

  The story of how this couple met is, appropriately, a bug report in the standard romantic protocol. They didn't meet over a drink. They met at a meetup, having their first real conversation while arguing over Stuart Armstrong's utility indifference trick. Specifically, they were debating whether it actually solves the shutdown problem, or if it just relocates the incentive into whatever subagents a sufficiently capable system would be motivated to build.

  For the family: They were arguing about how to build powerful systems that remain safe to be around. Specifically, how do you ensure that when you need to say "stop," the system listens, without the system trying to trick you to keep going?

  For the nerds: Yes, they are still arguing about it. Neither has conceded the point. And I think that is the perfect foundation for a marriage.

  Now, when you take a concept like "the shutdown problem" or "corrigibility" and apply it to a wedding, there is a massive failure mode we need to avoid. It would be easy to make a joke about [Partner A] holding the off-switch, or [Partner B] needing to be "corrected."

  But anyone who actually knows alignment theory knows that's a horror story, not a love story. Corrigibility isn't about obedience. It isn't about domination. It's about trust. It's about building a relationship where both parties remain open to feedback, where neither feels the need to manipulate the other to get their needs met, and where the "off-switch"—the ability to pause, to step back, to say "this isn't working"—is safe to use.

  In AI safety, the fear is that a system will build "subagents"—side processes that work around the safety rules to achieve their goal. In marriage, we all have subagents. There's the Career Agent, the Hobby Agent, the "I'm Tired and Hungry" Agent. Sometimes, these subagents try to optimize for short-term wins at the expense of the core objective function: the partnership.

  [Partner A] and [Partner B], your challenge—and I know you've already started on it—is to ensure that your subagents don't undermine your corrigibility to each other. It means that when life gets complex, and you're both running hot, you don't try to hack each other's reward functions. You don't manipulate. You stay open. You remain two distinct agents who have chosen to align your goals, voluntarily and continuously.

  The fact that you never resolved that argument about utility indifference is actually promising. It means you respect each other's intellect enough to keep engaging. It means you haven't collapsed into a local optimum where you stop questioning things. A marriage that refuses to update its priors is a marriage that drifts out of alignment.

  So, my wish for you is not that you always agree. My wish is that you remain robustly corrigible to one another. That you build a system where the "shutdown" mechanism is never a weapon, but a safety valve. That you never feel the need to build secret subagents to get what you want, because you trust the other person to listen when you speak.

  For the family: This is just a fancy way of saying I hope they always listen to each other, even when they're tired.
  For the rationalists: This is a call to maintain common knowledge of each other's internal states, avoiding deceptive alignment at all costs.

  [Partner A] and [Partner B], you started with a debate about how to keep powerful things safe. Now you get to build something powerful together. May your reward functions be shared, your gradients be honest, and your love be the one thing you never try to optimize too efficiently.

  Please raise your glasses. To the happy couple.
