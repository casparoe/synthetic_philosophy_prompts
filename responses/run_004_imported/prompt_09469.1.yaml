      *   *Decision:* Acknowledge the sentiment and the known Gödelian views without validating potentially apocryphal specific details as absolute historical fact. Focus on the *argument* attributed to him.

  3.  **Analyze the Arguments:**
      *   **Gödel's Argument (as described):** Teleological/Axiological. The world is orderly/rational. It creates minds with high potential. It would be "irrational" or "wasteful" for a rational world to destroy that potential. Therefore, the potential must be realized (afterlife).
