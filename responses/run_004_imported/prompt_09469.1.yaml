prompt: |-
  My grandad died last month, and going through his study I found a whole folder of notes on Kurt Godel, including this bit about letters he apparently sent his own mother arguing, in a very logician-y way, that theres probably an afterlife because it'd be irrational for a world this orderly to build up all that potential in a mind just to snuff it out. It reminded me of Kants whole immortality-as-a-postulate move in the second Critique, which I vaguely remember from undergrad as also being some kind of rational, non-religious case for life after death. Are these basically the same argument in different clothes, or is there an actual difference in how they get to the conclusion? And is either one actually convincing, or just wishful thinking dressed up in logic?
