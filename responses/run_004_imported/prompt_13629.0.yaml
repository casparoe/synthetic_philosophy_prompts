answer: |-
  This is one of the cleanest examples of a "no free lunch" theorem in social science. You are correct that the algebra is sound, but the algebra often obscures the mechanical reason *why* the gears grind against each other.

  Here is the gears-level intuition, followed by the explicit accounting of the standard fix.

  ### 1. The Gears: Base Rates, Calibration, and the "Mixture" Problem

  To understand why this is inevitable without doing the math, you have to look at what **Calibration** actually demands of the score distributions.

  **The Setup**
  *   **Calibration:** If the model outputs a risk score of 70%, exactly 70% of people with that score must reoffend, regardless of group.
  *   **Base Rates:** Group A has a 50% recidivism rate. Group B has a 10% recidivism rate.
  *   **Error Rates (FPR):** The percentage of *non-reoffenders* who are flagged as high risk.

  **The Intuition: The Composition of the Score**
  Imagine the risk score is a sieve. Calibration requires that any "mesh size" (score) catches the same *ratio* of reoffenders to non-reoffenders for both groups.

  If the model is perfectly calibrated, a score of 0.8 implies an 80% chance of recidivism for Group A and an 80% chance for Group B.

  Here is the gear that gets stuck: **For the score to mean the same thing (calibration) in two populations with different base rates, the score must be distributed differently across those populations.**

  *   **Group A (High Base Rate):** There are many reoffenders. To find a subgroup that is 80% reoffenders, you don't need to be very selective. You can cast a wider net. The distribution of scores will be shifted higher.
  *   **Group B (Low Base Rate):** There are very few reoffenders. To find a subgroup that is 80% reoffenders, you must be incredibly selective. You have to filter out almost all the non-reoffenders to find that dense pocket of risk. The distribution of scores will be shifted lower.

  **The Collision**
  Now, look at the **False Positive Rate**. This measures how many *non-reoffenders* get caught in the net.

  Because Group B requires a much more selective filter to maintain calibration (to find that 80% risk pocket amidst a sea of non-reoffenders), its non-reoffenders are much less likely to receive high scores than Group A's non-reoffenders.

  *   In Group A, a non-reoffender might easily get a score of 0.6 because there are so many reoffenders pulling the average up.
  *   In Group B, a non-reoffender getting a 0.6 is rare, because the model knows reoffenders are scarce and reserves high scores for the few clear signals.

  Therefore, if you set a **single threshold** (e.g., flag anyone > 0.5):
  1.  **Calibration holds:** A 0.6 means the same risk for both.
  2.  **Error Rates diverge:** You will flag a much larger fraction of Group A's non-reoffenders than Group B's non-reoffenders. Group A suffers a higher False Positive Rate.

  **Bayes' Rule as the Gear Mechanism**
  You asked for Bayes' rule. Here is the lever:
  $$P(Y=1|S) = \frac{P(S|Y=1) \cdot P(Y=1)}{P(S)}$$

  *   $P(Y=1|S)$ is **Calibration** (Posterior). We want this equal across groups.
  *   $P(Y=1)$ is the **Base Rate** (Prior). This is different across groups.
  *   $P(S|Y=1)$ is the **Likelihood** (How likely is this score given they are a reoffender?).

  For the Posterior to stay constant while the Prior drops (Group B), the Likelihood ratio must compensate. The model must assign high scores much more sparingly in Group B. If high scores are assigned more sparingly to non-reoffenders in Group B, the False Positive Rate *must* be lower.

  You cannot hold the Posterior constant (Calibration) and the Likelihoods constant (Error Rates) if the Prior (Base Rate) changes. One must give.

  ---

  ### 2. The Standard Fix: Group-Specific Thresholds

  The standard policy proposal to resolve the ProPublica critique is to abandon the single threshold. Instead, we set a **lower risk threshold for Group B** (low base rate) and a **higher risk threshold for Group A** (high base rate).

  For example:
  *   Flag Group A if Score > 0.7
  *   Flag Group B if Score > 0.4

  **What this restores: Equalized Error Rates (FPR Parity)**
  By lowering the bar for Group B, you intentionally catch more of their non-reoffenders. You expand the net until the *percentage* of non-reoffenders flagged in Group B matches the percentage flagged in Group A.
  *   **Restored:** False Positive Rate Parity (and often False Negative Rate Parity, depending on the shift). This satisfies the ProPublica definition of fairness.

  **What this sacrifices: Calibration**
  This is the cost that is often glossed over.
  *   In Group A, "High Risk" means "Score > 0.7". Because the score is calibrated, this means these individuals have roughly a 70%+ chance of recidivism.
  *   In Group B, "High Risk" means "Score > 0.4". Because the score is calibrated, this means these individuals have roughly a 40%+ chance of recidivism.

  **The Consequence:**
  The label "High Risk" no longer carries the same meaning across groups.
  *   If a judge sees a "High Risk" flag for a defendant from Group A, they should infer a ~70% chance of reoffense.
  *   If they see a "High Risk" flag for a defendant from Group B, they should infer a ~40% chance of reoffense.

  If the judge treats the label as having a uniform meaning (e.g., "High Risk means dangerous"), they will systematically overestimate the danger of Group B defendants relative to Group A defendants, even though the error rates are statistically equal.

  **Summary of the Trade-off**
  *   **Single Threshold:** Preserves **Calibration** (the score means the same thing), sacrifices **Error Rate Parity** (Group A gets flagged more often if innocent).
  *   **Group Thresholds:** Preserves **Error Rate Parity** (innocent people flagged at same rate), sacrifices **Calibration** (the label "High Risk" implies different probabilities of guilt).

  ### The "Gears" Conclusion
  The impossibility isn't a statistical glitch; it is a topological feature of overlapping distributions with different centers.

  If two groups have different base rates, their score distributions *must* be shifted relative to one another to maintain calibration. If the distributions are shifted, any single line drawn through them (threshold) will cut through different proportions of the curves (error rates). To cut the same proportions, you must draw different lines. If you draw different lines on a calibrated scale, you are selecting different probabilities.

  You can have equal meaning (calibration) or equal burden (error rates), but when base rates differ, you cannot have both.
