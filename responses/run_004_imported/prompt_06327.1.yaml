prompt: |-
  I cover cognitive science for a living, and I've got a podcast interview next week with a researcher who's built her whole career defending Friston's free energy principle -- she genuinely thinks it's not just a theory of the brain but a theory of life itself. I dont want to just let her repeat the "brain as prediction machine" elevator pitch, so can you draft me seven or eight interview questions that actually push on the hard parts? I need at least one on the dark room problem (if minimizing prediction error is the whole game, why isn't every organism just holed up somewhere dark and unchanging, and whether "epistemic value" in expected free energy is a genuine fix for that or just a term invented to patch the hole), one on the recurring charge that the whole framework is unfalsifiable -- that it can retrodict literally any behavior after the fact so it never actually rules anything out, and one on scope: is this really a claim about brains, or about any self-organizing system with a Markov blanket (a cell, a hurricane, a thermostat), and if it's the latter, why that shouldn't make us suspicious it's explaining too much to explain anything. For each of those three, give me a sharp follow-up keyed to whatever answer she's most likely to give first.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User:** Cognitive science journalist/podcaster.
      *   **Guest:** Researcher defending Karl Friston's Free Energy Principle (FEP) / Active Inference. Believes it's a theory of life, not just brains.
      *   **Goal:** Avoid surface-level "brain as prediction machine" talking points. Push on hard philosophical and empirical problems.
      *   **Requirements:** 7-8 questions total.
      *   **Mandatory Topics:**
          1.  The Dark Room Problem (and whether "epistemic value" is a fix or a patch).
          2.  Falsifiability (retrodicting anything vs. predicting something).
          3.  Scope/Universality (brains vs. thermostats/hurricanes - explaining too much).
      *   **Specific Constraint:** For the three mandatory topics, provide a sharp follow-up question keyed to the likely defensive answer.

  2.  **Deconstruct the Free Energy Principle (FEP) & Active Inference:**
      *   *Core Claim:* All self-organizing systems minimize variational free energy (surprise).
      *   *Mechanism:* Perception updates the model; Action changes the world to match the model.
      *   *Critiques:* Tautological, unfalsifiable, trivializes biology, "Dark Room" problem (why seek stimulation if surprise is bad?), over-extended scope.
      *   *Defenses:* Epistemic value (curiosity), Markov blankets define boundaries, it's a principle not a mechanism (like least action).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: The Dark Room Problem.*
          *   *Initial thought:* Why don't we sit in dark rooms?
          *   *Refinement:* Need to mention "expected free energy" and "epistemic value."
          *   *Draft Question:* If the goal is minimizing surprise, why don't organisms just hide in dark, unchanging rooms? Is "epistemic value" just a patch?
          *   *Likely Answer:* She will say expected free energy includes information gain. We seek novelty to reduce long-term uncertainty.
          *   *Follow-up:* If you can tune the parameters to make an agent seek darkness *or* light, isn't the theory just describing the parameters you put in, rather than predicting behavior?
          *   *Polishing:* Make it punchy. "Is epistemic value a discovery or a dial?"

      *   *Topic 2: Falsifiability.*
          *   *Initial thought:* Can you prove this wrong?
          *   *Refinement:* Focus on the "retrodicting anything" charge.
          *   *Draft Question:* Critics say FEP can explain any behavior after the fact. How do you test it prospectively?
          *   *Likely Answer:* It's a principle like thermodynamics, not a specific model. You build specific models on top of it.
          *   *Follow-up:* If the principle itself is immune to falsification because it's "just a framework," doesn't that shield the core claim from empirical risk? Where is the line where FEP *itself* could be wrong?
          *   *Polishing:* Focus on the "Just-So Story" risk.

      *   *Topic 3: Scope/Universality.*
          *   *Initial thought:* Does this apply to thermostats?
          *   *Refinement:* Markov blankets. If a hurricane has one, is it alive?
          *   *Draft Question:* You say this applies to cells and hurricanes. If a thermostat minimizes free energy, does that mean it's "inferring"? Does this dilute the meaning of life?
          *   *Likely Answer:* It's about self-organization and boundaries. It doesn't mean thermostats have minds, just that they obey the same math.
          *   *Follow-up:* If the math describes a rock cooling down as well as a human thinking, have we found a law of life, or just a law of physics that doesn't distinguish life from non-life?
          *   *Polishing:* "Explaining everything explains nothing."

      *   *Topic 4: Neural Implementation (The "How").*
          *   *Need:* Move beyond the "what" to the "how."
          *   *Draft:* How do neurons actually do gradient descent on free energy?
          *   *Refinement:* Focus on the biological plausibility of the specific math (e.g., backprop vs. local learning rules).
          *   *Polishing:* Ask about the "neural code."

      *   *Topic 5: Evolution vs. Inference.*
          *   *Need:* Tension between natural selection and active inference.
          *   *Draft:* Is evolution doing the work instead of the brain?
          *   *Refinement:* If priors are evolved, is the organism really inferring, or just executing a script?
          *   *Polishing:* "Hardwired priors vs. online learning."

      *   *Topic 6: Normativity (The "Ought").*
          *   *Need:* Is this descriptive or prescriptive?
          *   *Draft:* Are you saying brains *do* this or *should* do this?
          *   *Refinement:* The is-ought problem in FEP.
          *   *Polishing:* "Mathematical necessity vs. biological contingency."

      *   *Topic 7: The Alternative.*
          *   *Need:* What would convince her she's wrong?
          *   *Draft:* What evidence would change your mind?
          *   *Refinement:* Make it specific to the FEP framework.
          *   *Polishing:* "The Kill Switch."

      *   *Topic 8: Practical Utility.*
          *   *Need:* So what?
          *   *Draft:* Does this help treat mental illness?
          *   *Refinement:* Psychiatry/Neurology applications.
          *   *Polishing:* "Clinical traction."

  4.  **Review and Refine:**
      *   Check against constraints: 7-8 questions? Yes. Mandatory topics included? Yes. Follow-ups for mandatory topics? Yes. Tone appropriate? Yes (professional but probing).
      *   *Self-Correction on Follow-ups:* Ensure the follow-ups aren't just "But why?" but specifically address the *evasive* maneuver the guest is likely to use (e.g., appealing to "levels of description").

  5.  **Final Polish:**
