answer: |-
  Your friend is right that in the standard "Bank Case" presentations, Contextualism and Pragmatic Encroachment (PE) are designed to converge on the same intuitive verdicts. In the standard case, the Subject is usually the Attributor (Hannah says, "I know"), or the Attributor shares the Subject's context. Because the Subject's stakes and the Attributor's conversational standards rise and fall together, the theories are extensionally equivalent in those specific instances.

  However, they are semantically distinct hypotheses. Contextualism locates the variability of "knows" in the **attributor's conversational context**, whereas PE locates the variability in the **subject's practical environment**. To pull them apart, we need a "crossed wires" scenario where the attributor's context and the subject's practical stakes come apart.

  Here is a scenario that generates divergent verdicts.

  ### The Scenario: "The Unaware Attributor"

  **The Subject (Hannah):**
  Hannah needs to deposit a paycheck. If the deposit does not clear by Monday morning, she will default on a mortgage payment and face foreclosure (High Stakes). Her evidence is that she was at the bank two weeks ago on a Saturday morning, and it was open. She has not checked the hours online today.

  **The Attributor (Sarah):**
  Sarah is Hannah's acquaintance. Sarah is chatting casually with a third party, Jim. Sarah is in a **Low Standards Context**: the conversation is relaxed, no possibilities of error (e.g., bank holiday changes) have been mentioned, and the stakes of the conversation itself are trivial. Crucially, **Sarah is ignorant of Hannah's specific predicament.** Sarah believes Hannah is just depositing pocket money for a weekend outing (Low Stakes).

  **The Utterance:**
  Speaking to Jim, Sarah says: *"Hannah knows the bank is open on Saturday."*

  ### The Divergent Verdicts

  **1. Pragmatic Encroachment (Stanley/Hawthorne): FALSE**
  For the Pragmatic Encroacher, the truth conditions of a knowledge ascription depend on the **subject's** practical situation. Hannah is in a high-stakes situation (foreclosure). Therefore, the epistemic standard Hannah must meet to count as "knowing" is raised. Her evidence (memory from two weeks ago) is insufficient for this high standard. Consequently, the proposition expressed by Sarah's utterance is false, regardless of Sarah's own casual context or ignorance.

  **2. Epistemic Contextualism (DeRose): TRUE**
  For the Contextualist, the truth conditions of a knowledge ascription depend on the **attributor's** conversational context. Sarah is in a low-standards context (casual chat, no error possibilities salient *to her*). Because Sarah is unaware of Hannah's high stakes, those stakes do not make the possibility of error salient in Sarah's conversation. In a low-standards context, Hannah's evidence (memory from two weeks ago) is sufficient. Consequently, the proposition expressed by Sarah's utterance is true.

  ### The Structural Feature: Locus of Sensitivity

  The structural feature that separates the two theories is the **locus of semantic sensitivity**.

  *   **Contextualism** claims that the extension of "knows" shifts based on the **Speaker's (Attributor's) Context**. The subject's actual reality matters only insofar as it impacts the speaker's conversational dynamics (e.g., if Sarah *knew* about the foreclosure, DeRose would argue her standards would rise, and the verdict would flip to False).
  *   **Pragmatic Encroachment** claims that the extension of "knows" shifts based on the **Subject's Practical Environment**. The attributor's context is semantically irrelevant. Even if the attributor is in a skeptical seminar (High Standards) but the subject is buying a cheap coffee (Low Stakes), PE suggests the subject might still "know" (contrary to EC). Conversely, as in our scenario, if the attributor is casual but the subject is facing ruin, PE says the subject does "not know" (contrary to EC).

  ### Why the Standard Bank Cases Fail to Separate Them

  Your friend's confusion is understandable because the canonical Bank Cases (DeRose 1992; Stanley 2005) typically involve **Self-Ascription** or **Shared Context**.

  1.  **Self-Ascription:** In the standard case, Hannah says, "I know." Here, the Subject and the Attributor are the same person. Therefore, the Subject's Stakes and the Attributor's Context are identical. Both theories predict "I don't know" in High Stakes and "I know" in Low Stakes.
  2.  **Shared Context:** When a third party attributes knowledge to Hannah in the standard literature, that third party is usually described as being aware of Hannah's stakes. If the Attributor knows the Subject is in high stakes, the Attributor's context usually becomes "high standards" (due to the salience of the error). Thus, both theories again converge: PE says False (due to Subject's stakes) and EC says False (due to Attributor's raised standards).

  To distinguish the theories, you must decouple the **Attributor's Awareness** from the **Subject's Reality**. The "Unaware Attributor" scenario does exactly this: it keeps the Attributor's standards low while keeping the Subject's stakes high. This reveals that Contextualism is a thesis about the *semantics of conversation*, while Pragmatic Encroachment is a thesis about the *nature of knowledge relative to action*. They are not just different vocabularies; they are competing claims about which variable controls the truth value of knowledge claims.
