          *   *Key Variable:* Attributor's Context (Standards).
          *   *Subject's Stakes:* Irrelevant to the truth conditions directly, only relevant insofar as they affect the attributor's context (usually).
      *   **Pragmatic Encroachment (Hawthorne/Stanley):** The truth conditions of "S knows that p" depend on the *practical situation of the subject* (the person purported to know). The epistemic standard is invariant across attributor contexts but sensitive to the subject's practical environment.
          *   *Key Variable:* Subject's Practical Stakes.
          *   *Attributor's Context:* Irrelevant to the truth conditions (Invariantism).

  3.  **Identify the Divergence Point:**
      *   Standard Bank Cases usually vary the *Subject's* stakes (Hannah's stakes).
