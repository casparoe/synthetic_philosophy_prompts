      *   *Löb's Theorem:* If $T \vdash \Box_T \phi \to \phi$, then $T \vdash \phi$. (If a system proves that "if I prove $\phi$, then $\phi$ is true," then it proves $\phi$.)
      *   *The Problem:* An agent $A$ wants to create a successor $A'$. $A$ wants to ensure $A'$ only takes actions that are "good" (provable in $A$'s logic). $A$ needs to prove: "If $A'$ proves action $a$ is good, then $a$ is good."
      *   *Equal Strength:* If $A$ and $A'$ use the same logic $T$, $A$ is effectively trying to prove $\Box_T \phi \to \phi$ for arbitrary $\phi$ (specifically, safety properties). Löb's theorem says this leads to inconsistency or triviality (proving everything).
      *   *Weaker Strength:* If $A'$ uses logic $T'$ and $T \supset T'$, $A$ can prove the soundness of $T'$.
      *   *G2 vs. Löb:* G2 says $T$ cannot prove its own consistency ($\neg \Box_T \bot$). Löb is a generalization about soundness ($\Box_T \phi \to \phi$). The "tiling" problem is about *trust* across time steps, which involves a chain of reasoning.

  3.  **Drafting the Intuitive Explanation (The "Why it bites" part):**
