answer: |-
  **Setting:** *Prague, late autumn 1602. The study of Johannes Kepler, cluttered with geometric solids, ephemerides, and the proofs of the* Tertius Interveniens. *Opposite him sits Marcus Vettius, a seasoned practitioner of the Ptolemaic art, a man whose reputation rests on the precision of his nativities.*

  **Marcus:** You dismantle the house to save the foundation, Johannes. But I fear when you are finished, there will be no roof left under which to practice. You strip away the Signs, the Houses, the Domiciles… you leave us with naked planets swimming in a void of pure geometry.

  **Kepler:** I strip away the wallpaper to inspect the load-bearing beams, Marcus. The Signs of the Zodiac are merely sectors of the ecliptic, arbitrary slices of thirty degrees named after constellations that no longer align with them due to precession. They are human labels pasted onto the sky. But the Aspects… the angles between the planetary rays… these are inherent. They exist whether a man names them or not.

  **Marcus:** Inherent? You speak as if a *trine* is a physical object one might trip over. In the *Tetrabiblos*, Ptolemy teaches us that the power of the configuration derives from the familiarities between the planets and the signs. Mars rules Aries because of a sympathy of nature—heat and dryness matching heat and dryness. This is a causal chain. When you discard the signs, you discard the mechanism of rulership. How can Jupiter be *exalted* in Cancer if Cancer is nothing but empty space?

  **Kepler:** Exactly! How *can* it? That is the superstition I mean to purge. You claim a sympathy of nature, but you cannot describe the physics of it. Is there a fluid? A heat? If Mars heats Aries, does it heat the empty degrees before the Sun enters them? No. The Sign is a coordinate system, nothing more. It is a map, not the territory. My reform rests on a different physics. The Earth herself possesses a soul, an *anima terrae*. When the planets form specific angles, their rays strike this soul.

  **Marcus:** The Earth has a soul? Now we trade Ptolemy's physics for Plotinus's mysticism. But let us grant you this *anima terrae*. You say it responds to aspects. Which ones? The conjunction, opposition, trine, square, and sextile. The ancients chose these because they divide the circle by numbers one through six. Simple. But you… in your *Fundamentis*, you introduce the *quintile*. The seventy-two-degree angle. Why?

  **Kepler:** Because of the constructible polygons! The soul of the Earth knows geometry. It resonates with ratios that can be constructed with a compass and straightedge, ratios that mirror the harmonic divisions of the monochord. The quintile corresponds to the pentagon, the ratio of 4:5. It is a major third in music. When the planets form this angle, they sing a consonance that the Earth's soul hears. It is not convention; it is acoustic and geometric necessity.

  **Marcus:** Here is where I have you, Johannes. You accuse me of arbitrariness because I divide the zodiac into twelve signs based on tradition and seasonal quarters. Yet you stand before the continuum of the circle and say, "Stop here. This angle is holy. This one is silent." You select the constructible polygons. But why is the soul of the Earth a geometer? Why does it care for Euclid?

  **Kepler:** Because geometry is the archetype of the Creation. It existed in the mind of God before the world was formed.

  **Marcus:** And the seasons existed before man named them. The entry of the Sun into the tropical point of Aries marks the vernal equinox. It is a physical event of light and heat. My signs are anchored in the solar year, in the physics of light and climate. You anchor your aspects in… abstract numbers. Is it not equally arbitrary to say the Earth resonates at 72 degrees but ignores 70? If the rays are physical, surely their intensity varies continuously with the angle. By picking only the "perfect" ratios, are you not carving a continuum into a privileged few, just as I do with my twelve houses?

  **Kepler:** *[Leans forward, tapping a diagram of a circle inscribed with a pentagon]* There is a difference between quality and quantity, Marcus. The intensity of light may vary continuously, yes. But the *perception* of that light is discrete. Think of the ear. Sound waves vary continuously in frequency. But the ear does not hear all intervals as equal. It hears consonance and dissonance. A frequency ratio of 3:2 is a fifth; it is distinct. A ratio of 3.1:2 is noise. The *anima terrae* does not measure degrees with a protractor; it listens. It feels the harmony. My aspects are not arbitrary cuts; they are the notes the cosmos can play. Your signs are merely the measure of time.

  **Marcus:** A poetic defense. But let us descend from the music of the spheres to the nativity of a merchant. A man asks when his ship will return. I look to the Lord of the Second House. I look to the Moon's application to Mercury. I use the rulerships. You tell me to look at… what? The psychological excitation of the Earth at his birth?

  **Kepler:** I tell you that the stars incline, they do not compel. At the moment of birth, the configuration of the rays imprints a disposition upon the infant's soul, just as it imprints upon the Earth. It creates a weather of the mind. If Mars squares Saturn at the birth, the soul is tuned to a difficult, restrictive harmony. The man will be prone to melancholy, to caution.

  **Marcus:** And will his ship return?

  **Kepler:** I cannot tell you that! That is the error of your tradition. You treat the heavens as a clockwork of events. I treat them as a harmony of dispositions. If the ship is lost, it is a material accident. But the man's *fear* of the loss, his *reaction* to it—that is written in the aspects.

  **Marcus:** Then you have castrated the art. Men come to us to know their fate, not their temperament. But consider my objection again, Johannes. You say the ear hears consonance. True. But why does the Earth have an ear? You postulate a faculty in the matter of the world that perceives geometry. I postulate a sympathy between the stellar rays and the sublunary elements. Both are invisible. Both are unproven.
  If I say "Mars rules Aries because of heat," I am using the accepted physics of qualities. If you say "Mars aspects Venus by a quintile because the Earth loves the pentagon," you are using a metaphysics of number. Is your number any less "occult" than my quality? You police the boundary of superstition by drawing a line at constructible polygons. I say that line is drawn in sand. To the skeptic, your harmonic soul is as superstitious as my planetary rulerships.

  **Kepler:** *[Pauses, looking out the window at the twilight]* You strike hard, Marcus. I admit, the *anima terrae* is a hypothesis. But it is a hypothesis that seeks a *cause*. When you say Mars rules Aries, you rely on the authority of the Chaldeans and Ptolemy. When I ask "Why?", you say "Because it has always been so." That is not science; that is tradition masquerading as nature.
  My criterion is not merely that the polygons are constructible. It is that they offer a causal story that unifies music, optics, and astrology. The rays of the planets are like light. Light acts on the eye. Geometry acts on the mind. If the Earth is a living being, as the ancients also believed, then it too has a faculty of perception. My theory is strange, I grant you. But it attempts to explain *how* the influence travels. Your theory simply asserts *that* it travels.

  **Marcus:** I rely on the accumulation of observation. For two thousand years, astrologers have cast nativities using the Houses and Signs. We have records. When the Lord of the Ascendant is afflicted in the Twelfth House, enemies arise. This is empirical. Your harmonic aspects… have you the ephemerides to prove them? Have you cast a thousand charts using only the quintile and the bi-quintile to show they hold sway?

  **Kepler:** I am building those tables even now. But do not confuse data with understanding. You may observe that a rooster crows before dawn and conclude the rooster causes the sun to rise. Your traditional astrology is a catalog of rooster-crows. You know the correlations, but you do not know the causation. I am trying to find the sun.
  If I am wrong about the *anima terrae*, then astrology itself is false. I would rather astrology be false than superstition be true. I would rather purge the art of its lies than preserve its power through deception.

  **Marcus:** And if you purge it, no one will practice it. You leave the merchant with a description of his melancholy, while his ship burns. There is a utility in my "superstition." It offers a language for fate.

  **Kepler:** And there is a danger in it. It enslaves men to a false necessity. If I can show them that the stars only tune their souls, like a lute, but the hand that plays the lute is their own… then I have served God and man.
  You ask why my angles are not arbitrary. Because a circle exists without man. A pentagon exists without man. The ratio 4:5 is true in Prague, in China, and in the mind of God. The sign of Aries is a name given by shepherds in the Euphrates valley. One is a truth of being; the other is a truth of naming. I will build my astrology on being.

  **Marcus:** Then we are at an impasse. You seek the physics of the divine mind. I seek the pragmatics of the human condition. You say my signs are conventions. I say your harmonies are abstractions.
  But tell me this, Johannes. When you cast a chart for the Emperor… do you not still look to see if Saturn is in the Seventh House?

  **Kepler:** *[A faint, weary smile]* I look to see if Saturn is in opposition to the Ascendant. The House is merely the angle relative to the horizon. That, at least, is geometry. The rest… I leave to the court astrologers.

  **Marcus:** Then you are a reformer who still needs a roof, even if you despise the tiles.

  **Kepler:** We all dwell in the shadow of the unknown, Marcus. I only wish to ensure the shadow is cast by a solid object, and not a phantom.

  **Marcus:** *[Gathering his papers]* Then let us both watch the sky. You for your harmonies, I for my signs. If the ship returns, I shall claim the Lords of the House guided it. If it burns, perhaps you may claim the Earth's soul was dissonant.

  **Kepler:** And if the ship never sailed, Marcus? Then we were both merely watching the clouds.

  *[Kepler turns back to his geometric solids. Marcus bows and exits into the Prague night.]*
