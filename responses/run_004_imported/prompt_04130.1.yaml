      *   Technical command? Yes (aspects, signs, causality).
      *   Genuine engagement? Yes, they address the "arbitrariness" challenge directly.

  8.  **Final Polish:** Check pacing and ensure the ending feels weighty. (Proceed to generate output).

  *(Self-Correction Note during final polish)*: Make sure Kepler doesn't sound *too* modern. He still believes in the Earth's soul. He isn't a modern astronomer rejecting astrology; he's a reforming astrologer. Keep the mysticism intact.

