      *   **The Key Difference:** Certainty vs. Uncertainty. Certainty deletes worlds (intersection). Uncertainty reweights them (stretching).
      *   **The Mechanism:** Jeffrey conditionalization preserves *conditional odds* within the partition cells.
      *   **The Conflict:** If two partitions are correlated, updating one changes the conditional probabilities of the other.
      *   **The Example:** Use the Green/Blue + Silk/Cotton example with correlated priors.
