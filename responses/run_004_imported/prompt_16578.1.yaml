      *   Let's use a world with 4 states: $GS, GC, BS, BC$ (Green/Blue, Silk/Cotton).
      *   Prior: $P(GS)=0.4, P(GC)=0.1, P(BS)=0.1, P(BC)=0.4$. (Note: Color and Texture are correlated here. Green tends to be Silk).
      *   Update 1 (Vision): Make Green 50/50. ($P_{new}(G) = 0.5$).
      *   Update 2 (Touch): Make Silk 50/50. ($P_{new}(S) = 0.5$).
      *   *Path 1 (Vision then Touch):*
