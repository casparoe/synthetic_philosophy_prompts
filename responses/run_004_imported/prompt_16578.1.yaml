          *   If the partitions are independent in the prior, do they commute?
          *   Actually, the standard counter-example relies on the fact that the second update is specified as "New probability of Partition 2 is $Q$".
          *   If I update Color first, I change the total mass of Green. If Color and Texture are independent, $P(Silk)$ stays the same. Then updating Texture works fine.
          *   *Correction:* Non-commutativity arises because the *definition* of the second update is usually "Set $P(F)$ to $v$". But if $E$ and $F$ are logically independent but probabilistically correlated, updating $E$ changes $P(F)$. So when you go to set $P(F)$ to $v$, you are moving it by a different *amount* than if you had done it first.
          *   *Wait, is that it?* If I say "Set $P(F)=v$", that overrides whatever $P(F)$ became after Update 1.
          *   Let's look at the math of Jeffrey Conditioning.
          *   $P_{new}(A) = \sum P_{old}(A | E_i) P_{new}(E_i)$.
          *   This preserves the likelihood ratios $P(A | E_i)$.
          *   If I do Update 1 on Partition $\mathcal{E}$, I preserve $P(\cdot | E_i)$.
          *   If I then do Update 2 on Partition $\mathcal{F}$, I preserve $P_{after1}(\cdot | F_j)$.
          *   If I do Update 2 first, I preserve $P_{old}(\cdot | F_j)$.
          *   The term $P_{after1}(\cdot | F_j)$ is generally *not equal* to $P_{old}(\cdot | F_j)$.
          *   Why? Because updating $\mathcal{E}$ changes the conditional probabilities of $\mathcal{F}$ unless $\mathcal{E}$ and $\mathcal{F}$ are independent.
          *   So, the "likelihood ratios" preserved in the second step depend on whether the first step happened.

  4.  **Developing the Intuition (The "Rubber Sheet" Analogy):**
      *   Imagine probability mass as a rubber sheet.
      *   Standard updating: Cutting out a piece of the sheet. Order of cuts doesn't matter for the final remaining piece.
      *   Jeffrey updating: Stretching the sheet.
