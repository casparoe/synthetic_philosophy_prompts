      *   If the sheet has a pattern on it (correlations), stretching horizontally distorts the vertical pattern. So when you go to stretch vertically, you are stretching a *distorted* pattern.
      *   If you stretch vertically first, you distort the horizontal pattern.
      *   Result: Different final shapes.

