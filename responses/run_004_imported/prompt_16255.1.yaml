answer: |-
  This is an exceptionally sharp worry, and you are right to trust it. In fact, if you did not feel this tension, I would worry that you weren't engaging deeply enough with the material. The charge that infinitism is "special pleading"—that it arbitrarily exempts epistemic justification from the general metaphysical and logical strictures against infinite regresses—is one of the most serious objections to the view.

  To help you prepare your seminar notes and anticipate student pushback, I will break this down into three parts: (1) the general philosophical criteria for distinguishing vicious from benign regresses, (2) how Klein's infinitism attempts to meet those criteria, and (3) an evaluation of whether the "special pleading" charge holds water.

  ### 1. The General Basis: When is a Regress Vicious?

  You are correct that in many contexts (cosmology, semantics, logic), an infinite regress is treated as a *reductio*. However, contemporary metaphysics and logic generally agree that **not all infinite regresses are vicious.** There are benign infinite regresses (e.g., the truth regress: if *p* is true, then "it is true that *p*" is true, ad infinitum; or the spatial regress: if space is continuous, between any two points there is a third).

  The principled basis for distinguishing vicious from benign regresses is not merely "infinity is bad." Rather, a regress is vicious if it results in **explanatory failure**.

  There are two main ways a regress becomes vicious (drawing on work by Russell, Black, and more recently Sorensen and Norton):

  1.  **Metaphysical/Logical Impossibility:** The regress entails a contradiction or posits something metaphysically impossible (e.g., an actual infinite collection of concrete objects, if one holds that such collections are impossible).
  2.  **Explanatory Irrelevance (The "Job" Failure):** This is the more common and relevant criterion for your seminar. A regress is vicious if the series generated fails to do the explanatory work it was introduced to perform.
      *   *Example (Cosmological):* If the question is "Why is there something contingent rather than nothing?", positing an infinite chain of contingent causes fails to answer the question. The whole chain remains contingent. The regress fails to ground the necessity required by the explanation.
      *   *Example (Tortoise/Achilles):* If the goal is to explain what *compels* an agent to infer *q* from *p* and *if p then q*, adding a further premise ("If p and if p then q, then q") fails to compel the inference. It just adds another premise. The regress fails to explain the *act* of inference.

  **The Principle:** A regress is benign only if the infinite series *itself* successfully satisfies the explanatory demand, without requiring a termination point to make sense.

  ### 2. Does Klein's Infinitism Meet This Standard?

  Peter Klein's defense rests on arguing that the "explanatory job" of justification is fundamentally different from the "explanatory job" of causation or ontological grounding. He argues that infinitism is not an arbitrary exception, but the only view that satisfies two structural constraints on reasoning.

  #### A. The Dialectical Necessity Argument
  Klein argues that infinitism is not ad hoc because it is the *only* surviving option after Foundationalism and Coherentism fail on internal logical grounds. He posits two constraints:
  1.  **The Principle of Avoiding Arbitrariness (PAA):** A reason cannot be justified merely by assertion; it needs a reason. (This kills Foundationalism).
  2.  **The Principle of Avoiding Circularity (PAC):** A reason cannot justify itself or rely on the proposition it is meant to justify. (This kills Coherentism).

  If you accept PAA and PAC, the infinite regress is not a "stipulation"; it is a **deductive consequence**. If every reason needs a reason (PAA) and no reason can loop back (PAC), the chain *must* be infinite. In this light, accusing infinitism of special pleading is like accusing a mathematician of special pleading for saying a line extends infinitely. Given the axioms (PAA/PAC), the infinity is forced.

  #### B. The Nature of the Relation (Support vs. Production)
  Klein distinguishes between **generative** relations and **supportive** relations.
  *   **Generative (Vicious):** In the cosmological argument, causes *produce* effects. If every cause is produced, nothing is ever actually produced. The existence of the effect is never secured.
  *   **Supportive (Benign):** In epistemology, reasons *support* beliefs. Klein argues that support does not require a "first supporter." An infinite chain of supports can collectively hold up a belief, provided the chain is *available*.

  Klein relies heavily on the distinction between **propositional justification** (there are reasons available for *p*) and **doxastic justification** (the agent believes *p* *based* on those reasons). Klein concedes that no finite mind can *traverse* an infinite chain (which would be a vicious regress for doxastic justification). However, he argues that **propositional justification** only requires that for any reason in the chain, a further reason *exists* and is *available* if challenged.

  On this view, the "job" of justification is not to complete a traversal, but to ensure **defeasibility resistance**. An infinite chain ensures that for any doubt raised at node *n*, there is a resource at node *n+1* to resolve it. The infinity *is* the resource.

  ### 3. Evaluating the "Special Pleading" Charge

  Is your impression fair? It depends on whether one accepts Klein's characterization of the "job" of justification.

  #### Where the Charge Holds Water (The Student's Best Objection)
  Your suspicion is strongest if we view justification as **truth-conducive grounding**.
  If the point of justification is to link a belief to the truth (or to a fact), students may argue that an infinite chain of reasons is like an infinite chain of unpaid checks: no matter how long the chain, no money ever changes hands.
  *   **The Objection:** If every reason *R1* derives its justification from *R2*, and *R2* from *R3*, and none have intrinsic justification (per PAA), then justification is never actually *generated*, only deferred.
  *   **The Verdict:** If justification is a property that must be "transferred" from a source, infinitism fails. It looks like special pleading to say "transfer works differently here." This is the "no source of justification" objection.

  #### Where the Charge Fails (Klein's Best Defense)
  The charge fails if we view justification as **responsibilist** or **dialectical**.
  If the "job" of justification is to show that a belief is not held arbitrarily, then an infinite chain *does* do the job. It demonstrates that the belief is embedded in a web of reasons that never hits a brute fact (arbitrariness) and never loops (circularity).
  *   **The Defense:** Klein argues that Foundationalism posits a "magic stopper" (basic beliefs) that stops the regress but violates PAA. Coherentism posits a loop that violates PAC. Infinitism is the only view that respects the logical structure of "reason-giving" without inventing a metaphysical exception (basic beliefs) or a logical exception (circularity).
  *   **The Verdict:** On this reading, infinitism is *less* ad hoc than Foundationalism. Foundationalism says, "Regresses are bad, so we will stipulate that some beliefs don't need reasons." Infinitism says, "Regresses are the natural result of reason-giving, so we accept them."

  ### Pedagogical Recommendation for Your Seminar

  To turn this worry into a productive seminar discussion rather than a roadblock, I suggest framing the unit around the **"Viciousness Condition."**

  1.  **Start with the General Metaphysics:** Before introducing Klein, spend a session on the general logic of regresses. Use the Tortoise/Achilles and the Cosmological Argument. Ask students: *Why* are these vicious? Guide them to the "Explanatory Failure" criterion.
  2.  **The Crucial Question:** Pose the question directly: "Does an infinite chain of reasons explain why a belief is justified, or does it merely defer the explanation?"
  3.  **Klein's Move:** Present Klein not as someone who says "infinity is okay," but as someone who says "Justification is not a *thing* to be transferred, but a *status* conferred by the availability of reasons."
  4.  **The "Source" Objection:** Explicitly invite the "unpaid checks" objection. Ask students if they can formulate a principled difference between *ontological dependence* (which seems to need a foundation) and *epistemic support* (which might not).

  **Conclusion on your Worry:**
  Your impression is **philosophically healthy but dialectically surmountable.** It is not "special pleading" in the sense of making an arbitrary exception; it is a substantive claim about the nature of the justification relation. However, it *does* require accepting that justification does not require a "source" of truth-conductivity, but rather a "structure" of non-arbitrariness.

  If your students (and you) feel that justification *must* ultimately anchor in truth or fact (a externalist intuition), infinitism will indeed look like special pleading. If you feel justification is about the internal structure of reasoning (an internalist intuition), infinitism looks like the only consistent option. The unit should highlight that this is the real fault line, not the mere acceptance of infinity itself.
