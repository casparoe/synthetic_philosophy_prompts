      *   **Klein's Specific Defense:** Detail how Klein argues his view isn't ad hoc. Focus on PAA/PAC and the distinction between *propositional* and *doxastic* justification.
      *   **The "Special Pleading" Counter-Argument:** Address the user's suspicion directly. Where does the charge hold water? (Finite minds, the "completion" intuition).
      *   **Pedagogical Advice:** How to teach this tension to grad students. Turn the worry into a seminar discussion point.

