          *   *Point 2: The Timing of Evidence.* EDT conditions on the *act*. But the act is the final step. The evidential link is established during deliberation. Once deliberation concludes "I will cooperate," the probability of the other cooperating is already updated. The physical act adds zero entropy/information.
          *   *Point 3: The "Why Now?" Problem.* If the correlation is logical, it holds regardless of when I act. If I have already decided, the "choice" is illusory. If I haven't decided, I must condition on the *process* of deciding, not the output. But conditioning on the process (the "tickle" of reasoning) fixes the outcome.
