      *   **User's Objection:** A generalized "Tickle Defense." In the Smoking Lesion problem, conditioning on the antecedent urge ("tickle") screens off the correlation between smoking and cancer. The user argues that in ECL, conditioning on the antecedent psychological facts/dispositions that make one an ECL-reasoner screens off the correlation between one's *choice* to cooperate and the distant agents' *choice* to cooperate.
