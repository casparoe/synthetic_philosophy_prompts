      *   *But do I know the code?* I know my *mind*. If I know my mind well enough to know I'm an ECL reasoner, I know my output.
      *   *The "Transparent Newcomb" angle:* If the box is transparent, you see the money. Here, if the "algorithm" is transparent to introspection, you see the decision before you make it.
