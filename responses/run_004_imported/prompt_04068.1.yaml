      *   *The Strongest Argument:* The "Evidential Idle" argument. If the correlation is logical, it holds timelessly. My *deliberation* is the event that resolves the logical fact. My *action* is just the shadow of that deliberation. Conditioning on the *conclusion of deliberation* screens off the *action*. Since EDT tells us to maximize expected utility based on evidence, and the evidence is fixed at the conclusion of deliberation, the action itself carries no *marginal* evidential weight. Therefore, there is no instrumental reason to perform the action *rather than not*, provided the disposition is fixed.
      *   *Wait, that sounds like Fatalism.* Need to be careful. EDT says "Choose the act with best expected utility." If $EU(C) = EU(D)$ because the correlation is screened off, then EDT is indifferent. If EDT is indifferent, the "obligation" to cooperate vanishes.
