      *   *EDT Logic:* $P(B \text{ cooperates} | A \text{ cooperates}) \gg P(B \text{ cooperates} | A \text{ defects})$. Therefore, A cooperates.
      *   *Underlying Metaphysics:* Usually framed as "logical correlation" or "subjunctive dependence" (FDT/TDT style) but Oesterheld's ECL is often framed within EDT (updating on the fact of one's own decision).

  4.  **Develop the Screening-Off Argument against ECL:**
