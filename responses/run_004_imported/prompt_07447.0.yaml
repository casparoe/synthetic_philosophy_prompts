      *   *Emphasis:* Highlight the difference between *epistemic* probability (human ignorance) and *ontological* probability (nature's indeterminacy). Ghazālī accepts the former, rejects the latter.

  11. **Final Polish:** Ensure the tone is respectful to both the theology and the physics. (Proceed to generate response).

