answer: |-
  Here are 10 interview questions designed to corner the mechanics of Penal Substitution without being hostile, specifically tailored to your guest's reliance on David Lewis and the "grace" deflection.

  ### 1. The Debt vs. Prison Analogy
  **Question:** "David Lewis draws a hard line between pecuniary punishment (like a fine or debt) and non-pecuniary punishment (like prison or corporal punishment). We can pay someone else's fine, but we can't serve someone else's prison time because the suffering is tied to the body. Penal Substitution treats sin like a debt that can be transferred, but the punishment like prison time that is suffered physically. How do you bridge that category error without just asserting it works?"

  *   **Expected Answer:** He'll likely say that spiritual realities don't follow physical laws, or that Christ's incarnation allowed him to absorb the 'prison time' on our behalf.
  *   **Follow-up:** "But if the mechanism of transfer works for the *guilt* (the debt) but not the *suffering* (the prison), aren't you left with a situation where the debt is paid but the justice isn't served? How does the prison time actually transfer if, by definition, it's non-transferable?"

  ### 2. The Retributivism Requirement
  **Question:** "This theory seems to secretly require a strict retributive view of justice—that pain is required simply because pain was caused, not to fix anything or deter future crime. If you hold a restorative or consequentialist view of justice, Penal Substitution makes no sense. Do you admit that this doctrine collapses entirely if God isn't a retributivist?"

  *   **Expected Answer:** He'll probably agree that God's justice is retributive but argue it's a 'holy' retribution, distinct from human vengeance.
  *   **Follow-up:** "Okay, but if it's retributive, the guilty party is the one who deserves the pain. If you inflict that pain on an innocent party instead, haven't you violated the very retributive principle you're relying on? How is it retributive justice if the person suffering isn't the one who retributed?"

  ### 3. Identity of Suffering
  **Question:** "Lewis points out that for substitution to work, Christ's suffering has to count as *my* punishment, not just *a* punishment. If I get a headache and you get a headache, we aren't suffering the same thing. What is the metaphysical mechanism that turns Christ's specific pain into *my* specific penalty? Is it just a legal label?"

  *   **Expected Answer:** He will likely lean on 'imputation'—that God legally credits Christ's suffering to our account.
  *   **Follow-up:** "If it's just a legal credit and not an actual transfer of the penalty's essence, isn't that a legal fiction? You're saying justice is satisfied by a paperwork trick rather than the actual wrong being addressed."

  ### 4. The "Convention" Loophole
  **Question:** "Lewis suggests that maybe a social 'convention' could allow punishment to be transferable, much like how we agree certain sounds mean certain words. But he never confirms that such a convention exists. Are you borrowing credibility from Lewis's famous book *Convention* to make his Penal Substitution paper seem more solved than it actually is?"

  *   **Expected Answer:** He'll argue that the Trinity establishes a divine convention where the Son agrees to accept the Father's judgment.
  *   **Follow-up:** "But Lewis's work on conventions relies on shared social agreement to solve coordination problems. Who is coordinating this divine convention? If it's just God deciding 'this counts as that,' isn't that arbitrary? How is that different from a judge just deciding to let a random guy go because he likes him?"

  ### 5. The Whipping-Boy Precedent
  **Question:** "You've cited historical 'whipping boys' who were punished in place of princes as a precedent for this logic. But historically, we view that practice as abusive and unjust, not a triumph of grace. Why does the moral intuition that says 'whipping boys are wrong' not apply to the cross?"

  *   **Expected Answer:** He'll say the difference is consent; Christ volunteered, whereas whipping boys were coerced.
  *   **Follow-up:** "Consent makes it voluntary, but does it make it *just*? If I volunteer to go to prison for your murder, the legal system still stops me. Why does God's legal system operate on a moral standard that human justice systems rightly reject as corrupt?"

  ### 6. The "Grace" Deflection
  **Question:** "When people press on the mechanics of how the punishment moves, the answer often becomes 'that's grace.' But grace explains *why* God would do it, not *how* it is logically coherent. Can you explain the mechanism of the transfer without using the word 'grace' as a placeholder for 'we can't explain this'?"

  *   **Expected Answer:** He'll likely try to explain the mechanism but eventually circle back to grace being the overriding principle that supersedes logic.
  *   **Follow-up:** "If the mechanism breaks the laws of logic or justice, and the only answer is 'grace,' aren't you essentially saying 'God is powerful enough to make a contradiction true'? Because logically, punishing the innocent to free the guilty is a contradiction in terms of justice."

  ### 7. Double Jeopardy
  **Question:** "If Christ fully paid the penalty for specific sins, and then a sinner still faces consequences or judgment, isn't that double jeopardy? If the debt is paid, why is there any remaining liability? If there is remaining liability, was the payment incomplete?"

  *   **Expected Answer:** He'll distinguish between eternal punishment (paid) and earthly discipline (not paid), or say we have to 'accept' the payment.
  *   **Follow-up:** "If I have to 'accept' the payment, then the payment wasn't objective; it was conditional. So Christ didn't actually pay the penalty; he made payment *possible*. That changes the doctrine from 'It is finished' to 'It is available.'"

  ### 8. Lewis's Skepticism vs. Your Confidence
  **Question:** "David Lewis, a brilliant logician, looked at this and left the question hanging. He didn't commit. You seem far more confident than he was that the logic holds. What did Lewis miss that you see? Or are you more confident because of theological necessity rather than logical proof?"

  *   **Expected Answer:** He'll say Lewis was working purely philosophically without revelation, whereas he has the Bible to confirm the logic.
  *   **Follow-up:** "So if the logic doesn't hold up philosophically, you're relying on revelation to override the logic? That means the doctrine is irrational, not supra-rational. Are you comfortable admitting that?"

  ### 9. The Victim's Perspective (The Window Analogy)
  **Question:** "Going back to the window analogy: If my brother breaks a window and I take the spanking, the owner of the window hasn't seen justice done; they've just seen a random kid hit. How does Penal Substitution satisfy the *wrong* done, rather than just the *penalty*? Does God care about the broken window, or just the fine?"

  *   **Expected Answer:** He'll say God is both the victim and the judge, so he can waive the right to restitution.
  *   **Follow-up:** "If God waives the right to restitution, why was the punishment necessary at all? If he can waive the right, he could have just forgiven. The punishment becomes theater, not justice."

  ### 10. Falsifiability
  **Question:** "Finally, if every logical objection to Penal Substitution gets relabeled as 'part of the mystery of grace,' the theory becomes unfalsifiable. What specific logical contradiction or moral scenario would force you to admit the theory doesn't work? If there isn't one, are we doing theology or just protecting a conclusion?"

  *   **Expected Answer:** He'll likely say that the Resurrection validates the theory, so no logical contradiction can overturn a historical event.
  *   **Follow-up:** "But we're talking about the *coherence* of the theory, not the historical event. If the theory of *how* it works is logically incoherent, does the event matter? Can a logically impossible thing actually happen, even for God?"
