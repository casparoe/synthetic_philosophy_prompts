answer: |-
  **MEMORANDUM**

  **TO:** Grounds Policy Committee
  **FROM:** [Your Name], Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Decision on Citation Appeal #23-09 (E-Scooter on Quad) & Proposed Policy Amendment

  ### I. Executive Summary

  This memo addresses the appeal filed by a student cited for operating a personal e-scooter on the Quad. The appellant argues that e-scooters fall outside the prohibition on "motorized vehicles," aligning closer to bicycles (which are permitted on paths) than automobiles. Security maintains that the plain meaning of "motorized vehicle" encompasses any motor-driven personal transport.

  **Recommendation:** I recommend the Committee **deny the appeal** and uphold the citation. However, recognizing that the current policy language creates recurring ambiguity regarding emerging micro-mobility technology, I further recommend we **immediately adopt the amended policy language** attached in Section IV.

  This approach balances the need for consistent enforcement of existing rules (Legal Positivism) with the committee's duty to ensure rules reflect their intended purpose (Natural Law/Purposivism).

  ### II. Analysis of the Appeal

  The core jurisprudential conflict here mirrors the Hart/Fuller debate: do we enforce the "core meaning" of the words used, or do we look to the "purpose" behind the rule?

  **A. The Textualist Position (Security)**
  Security's argument rests on the ordinary meaning of the text. An e-scooter contains an electric motor and is designed to transport a person. In almost every municipal and state regulatory context, this constitutes a "motorized vehicle." To exempt the scooter requires the Committee to import a distinction (weight, speed, potential for lawn damage) that does not exist in the current text. If we begin adjudicating based on unstated criteria like "heaviness," we grant enforcement officers undue discretion and invite litigation over where the line is drawn (e.g., Is a heavy e-bike okay? What about a lightweight gas moped?).

  **B. The Interpretation of the 2019 Hoverboard Amendment**
  The appellant relies on the canon of *expressio unius est exclusio alterius* (the expression of one thing implies the exclusion of others). They argue that by explicitly adding "hoverboards" in 2019, the Committee implied that other small motorized devices (like scooters) were *not* covered by the original "motorized vehicles" ban.

  **I reject this reading.** I argue the 2019 amendment was **clarificatory, not expansive.**

  When the original policy was written, "motorized vehicle" colloquially implied gas engines or large chassis (cars, golf carts). As battery technology shrank, ambiguity arose not about *whether* small devices were vehicles, but whether "motorized" included *battery-operated* toys. The 2019 amendment was a response to the specific cultural rise of hoverboards, intended to signal that "motorized" includes electric drive trains, regardless of size. It demonstrates the Committee already had small motorized devices on its radar and was tightening the net, not widening it. To read the amendment as an admission that scooters were previously exempt renders the term "motorized vehicle" toothless against any device smaller than a golf cart.

  Therefore, under the current text, the e-scooter is prohibited. The citation was validly issued.

  ### III. Engagement with the Losing Argument (Appellant's Position)

  While I recommend upholding the citation, the Appellant's purposive argument must be taken seriously. We cannot simply wave away the claim that this rule is ostensibly about **lawn preservation**, not **motor prohibition**.

  The Appellant correctly identifies that the 2010 genesis of this rule followed a golf cart incident that destroyed significant turf. A bicycle (human-powered) is allowed on paths because its impact is negligible. An e-scooter, while motorized, exerts similar ground pressure to a bicycle. By strictly enforcing the "motor" element, we risk prioritizing the *mechanism* of propulsion over the *harm* the policy seeks to prevent.

  This is the Fullerian critique: a law that loses connection with its moral or functional purpose becomes a mere exercise of power. If a student rides an e-scooter on the paved walkway of the Quad without damaging the grass, enforcing a ban designed to protect the grass feels unjust. It creates a disconnect between the student body's understanding of the rule's *spirit* (don't crush the lawn) and the Committee's *letter* (no motors).

  If we deny the appeal without acknowledging this, we risk the Committee appearing out of touch with modern mobility. We are effectively punishing a student for a "crime" (lawn damage) that did not occur, based on a proxy (motor) that is imperfect. While we must uphold the text to maintain rule-of-law stability, we must admit the text is now outdated.

  ### IV. Proposed Policy Amendment

  To prevent relitigating this every semester as technology evolves (e-bikes, electric unicycles, etc.), we must move from a **propulsion-based standard** to a **usage-based standard**.

  The current policy conflates "vehicles that damage lawns" with "vehicles with motors." We should decouple these. We should prohibit *all* vehicles on the grass, but explicitly regulate which motorized devices are allowed on *paved paths*.

  **Proposed New Language:**

  > **Section 4.1: Grounds Use and Mobility Devices**
  > (a) **Lawn Protection:** No vehicles of any kind (motorized or human-powered) are permitted on turf or landscaped areas of the Quad.
  > (b) **Pathway Usage:** Bicycles and Personal Light Electric Vehicles (PLEVs) are permitted on paved pathways only.
  > (c) **Definition of PLEV:** For the purposes of this policy, a PLEV is defined as a device weighing under 50 lbs, with a maximum speed of 15 mph, and operated in a standing or seated position (e.g., e-scooters, e-bikes, hoverboards).
  > (d) **Prohibited Devices:** Gasoline-powered engines and vehicles exceeding the PLEV weight/speed limits (e.g., mopeds, golf carts, automobiles) are prohibited on the Quad entirely, including pathways.

  **Why This Works:**
  1.  **Solves the Hart/Fuller Tension:** It respects the *purpose* (protecting the lawn by banning all vehicles from turf) while providing *textual clarity* on what motors are allowed on paths.
  2.  **Future-Proofing:** By defining PLEVs by weight and speed rather than listing every new gadget, we accommodate future tech without needing annual amendments.
  3.  **Fairness:** It acknowledges the student's point that e-scooters are functionally similar to bikes, without undermining the Security team's need for enforceable bright-line rules.

  ### V. Conclusion

  We must deny the current appeal to maintain the integrity of the policy as it currently stands; reliance on the "motorized" definition was reasonable for Security. However, we must simultaneously pass the amended language above. This validates the student's concern for the next semester while upholding the Committee's authority this semester.

  I move that we deny Appeal #23-09 and refer the proposed policy language to the drafting subcommittee for immediate ratification.
