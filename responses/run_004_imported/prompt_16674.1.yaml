prompt: |-
  Ok so this is a bit of a weird ask because it's crossed over from "podcast prep" into "actual personal crisis" territory lol. I run a small philosophy of religion podcast (like, twelve regular listeners, recorded in my closet) and next week's guest is a philosopher who's built her career defending a Schellenberg-style hiddenness argument -- the idea that a perfectly loving God would make sure every nonresistant person is positioned to believe, and since plenty of people search sincerely and still end up as nonbelievers, that's real evidence against theism. I booked her mostly because I've been going through my own quiet crisis of faith the last couple months and I want the argument actually pressure-tested instead of politely nodded along to, since I'm genuinely trying to figure out what I think here.

  Can you draft me 8-10 interview questions that go after the real pressure points instead of just making her re-explain the argument from scratch? Specifically I want at least one question on how she (or anyone) could ever actually confirm that a given nonbeliever is nonresistant rather then just resistant in some way thats invisible even to themselves, since that seems almost unfalsifiable from the outside; one on whether "skeptical theism," the move theists use to defuse the evidential problem of evil by saying we can't know God's reasons, doesn't work just as well against her own argument, and if not why not; and one on the reply that hiddenness protects freely chosen love from becoming coerced, since if God's existence were obvious that would apparently turn belief into something more like complying with a guy holding a gun. For each of those, throw in a natural follow-up keyed to whatever answer she's most likely to actually give, not just a list of gotcha questions with nowhere for her to go.
