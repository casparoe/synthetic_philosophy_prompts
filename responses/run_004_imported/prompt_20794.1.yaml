      *   *Nuance:* Woodward tries to ground these counterfactuals in *invariance* and *structural equations*, but the truth conditions for those equations often involve counterfactuals. He explicitly distinguishes his view from Lewis's (less reliance on similarity metrics between possible worlds), but he does not eliminate modality.

  3.  **Evaluate the User's Skepticism (Impossible Interventions):**
      *   *Concern:* How to handle cases where intervention is physically impossible (continental drift, stars)?
