answer: |-
  Your skepticism is well-founded. In fact, on the specific point of whether Woodward's theory dispenses with "unactualized possibilities altogether," **you are right and your friend is mistaken.**

  While Woodward's interventionism is a significant departure from Lewis, it is not a non-modal theory. It does not eliminate counterfactuals or unactualized possibilities; rather, it relocates them and changes the criteria for their truth.

  Here is a breakdown of why your friend's claim doesn't hold up, how Woodward actually handles the "impossible intervention" cases you mentioned, and where the confusion likely stems from.

  ### 1. Interventionism is Inherently Modal
  The core claim of Woodward's theory (laid out in *Making Things Happen*) is that $X$ causes $Y$ if and only if there is a **possible** intervention on $X$ that would change $Y$.

  Notice the modal operators: "possible" and "would."
  *   **Lewis** analyzes causation using counterfactuals grounded in similarity relations between possible worlds.
  *   **Woodward** analyzes causation using counterfactuals grounded in **structural equations** and **invariance**.

  Woodward explicitly acknowledges that causal claims are modal claims. He argues that we cannot reduce causation to purely actualist regularities (like Humean constant conjunctions). For Woodward, a causal relationship implies that the relationship would *continue to hold* (it is invariant) under a range of changes. That "would hold" is a claim about unactualized possibilities.

  ### 2. The "Impossible Intervention" Problem
  You asked how Woodward handles cases like continental drift or stellar evolution, where no human can intervene. This is the strongest evidence against your friend's claim.

  Woodward handles these cases by distinguishing between **practically feasible** interventions and **in-principle possible** interventions.
  *   **The Model:** We construct a structural equation model of the star or the tectonic plates.
  *   **The Counterfactual:** We ask, "According to this model, if the core temperature *were* different (via an intervention that breaks the normal causal laws governing the temperature), would the supernova outcome change?"
  *   **The Truth Condition:** The causal claim is true if the structural equations correctly describe the system such that the counterfactual is true.

  Crucially, the intervention does not need to be physically performable by a human agent. It only needs to be **conceptually coherent** within the model. However, to say the intervention is "conceptually coherent" is to say there is a possible state of affairs (an unactualized possibility) in which the variable is set to a value it does not naturally take.

  If Woodward truly dispensed with unactualized possibilities, he would have to say, "Since we cannot intervene on a star, we cannot make causal claims about stars." He does not say this. He says we can make causal claims because we can model the counterfactual dependence.

  ### 3. Where Your Friend Might Be Coming From
  Your friend is likely a sharp philosopher (finishing a dissertation in the field is no small feat), so she probably isn't making a basic error. She is likely emphasizing a specific nuance that got lost in translation during your argument. Here is what she might have meant, and where it goes too far:

  **A. Rejection of Lewisian Metaphysics, Not Modality**
  Woodward strongly rejects Lewis's *metaphysics* of possible worlds (the idea that there are concrete, spatiotemporally isolated worlds that we compare for similarity). Woodward finds this metaphysically extravagant and epistemologically opaque.
  *   **Friend's point:** Woodward doesn't need "possible worlds."
  *   **Correction:** He doesn't need Lewisian worlds, but he still needs *modal space*. He replaces "closest possible world" with "valid structural equation." But the equation itself describes how the system behaves in *non-actual* conditions.

  **B. Grounding in Actual Experiments**
  Woodward often emphasizes that our *understanding* of interventions comes from actual experimental practices in controlled settings. We learn what an intervention is by actually doing them in labs.
  *   **Friend's point:** The *concept* is grounded in actual empirical practice.
  *   **Correction:** While the *concept* is learned from actual practice, the *application* of the concept to non-experimental sciences (like geology or astrophysics) relies on extrapolating that concept to unactualized scenarios.

  **C. "Unactualized Possibilities" vs. "Merely Logical Possibilities"**
  Woodward restricts the range of relevant possibilities. He isn't interested in far-fetched logical possibilities (e.g., "What if gravity was made of cheese?"). He is interested in a specific range of physically possible interventions.
  *   **Friend's point:** He dispenses with *wild* unactualized possibilities.
  *   **Correction:** He restricts the domain of modality, he doesn't eliminate it.

  ### 4. The Verdict on Your Examples
  To answer your specific question: **How would Woodward handle continental drift without unactualized possibilities?**

  He wouldn't. He would handle it exactly as you suspect: by quietly reintroducing unactualized possibilities.
  1.  He would posit a structural model of plate tectonics.
  2.  He would define an intervention variable (e.g., an external force shifting the plate).
  3.  He would assert that *if* this intervention *were* to occur, the coastline *would* be different.
  4.  Because that counterfactual is true (supported by the invariant equations of geology), the causal claim is true.

  If your friend insists Woodward avoids unactualized possibilities *altogether*, she is attributing to him a form of strict actualism that he explicitly rejects. Woodward believes causal claims carry modal import; they tell us about what *would* happen, not just what *did* happen.

  ### Summary
  Your intuition is correct. Woodward improves on Lewis by providing a more epistemologically accessible account of *how* we evaluate counterfactuals (via structural models and invariance rather than similarity metrics between worlds). However, he does not eliminate the counterfactuals themselves.

  To handle cases where intervention is impossible, Woodward relies on the truth of counterfactual conditionals regarding *in-principle* interventions. This requires a commitment to unactualized possibilities. Your friend has conflated "anti-Lewisian metaphysics" with "anti-modal semantics."

  You can confidently tell her that while Woodward saves us from comparing similarity between concrete possible worlds, he does not save us from the modal commitment of saying "what would have happened."
