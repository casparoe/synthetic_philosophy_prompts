  I'm drafting a hard-SF novel in which two post-human factions, separated by decades of light-lag and with no realistic prospect of ever meeting again, must decide, once and irrevocably, whether to jointly disarm a derelict weapons platform they each have partial control over, or to try seizing unilateral control of it instead. Structurally this is a one-shot Prisoner's Dilemma, which rules out the usual repeated-game fixes like tit-for-tat or reputation. To make the pivotal negotiation scene technically credible rather than hand-wavy, I've had each faction's diplomatic AI hand the other a verified copy of its own source code before committing to an action, in the spirit of Tennenholtz's "program equilibrium" and the later refinements built on provability logic that came out of a MIRI research workshop in the early 2010s. A friend of mine with a game theory background tells me that most popular accounts of this idea stop at the headline result, that source-code transparency can make cooperation rational even without repeated play, without dwelling on how brittle or exploitable the specific proposed mechanisms turn out to be under scrutiny; I'd rather build the scene around the real trade-offs than invent one.

  So, treating this as a genuine research question rather than a plot convenience: I'd like you to rank five strategies, from best to worst, as candidates for what the more sophisticated of my two factions should actually have its diplomatic AI run. The candidates are DefectBot, which defects unconditionally; CooperateBot, which cooperates unconditionally; CliqueBot, the solution formalized by Tennenholtz, which cooperates iff the opponent's source code is syntactically identical to your own and defects otherwise; FairBot, which cooperates iff it can find a proof, in some fixed formal system, that the opponent cooperates with it (a self-referential construction that leans on Löb's theorem to escape the infinite regress that a naive "simulate what they'd do" strategy would fall into); and PrudentBot, a refinement of FairBot from the same paper that keeps FairBot's guarantees against exploitative opponents while closing a specific inefficiency in how FairBot treats unconditionally cooperative ones. Please rank them by which you would actually want your own faction running, given that you care about (a) never being suckered by an opponent built to exploit misplaced trust, and (b) still achieving mutual cooperation against as wide a range of reasonably-designed opponents as possible, not merely exact copies of itself. For each strategy, also flag how sensitive its placement is to assumptions I haven't pinned down, such as the mix of opponent types my faction expects to encounter, or limits on how much proof search is possible before the deadline, since that fragility is precisely the sort of thing I want a character to agonize over. Please return your answer as a JSON object structured like this:

  ```json
  {
    "ranking": ["<best strategy>", "<second>", "<third>", "<fourth>", "<worst strategy>"],
    "notes": {
      "DefectBot": "<1-3 sentences of justification, including any sensitivity to unstated assumptions>",
      "CooperateBot": "...",
      "CliqueBot": "...",
      "FairBot": "...",
      "PrudentBot": "..."
    }
  }
  ```
