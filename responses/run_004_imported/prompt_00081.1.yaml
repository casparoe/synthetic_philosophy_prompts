      *   *Check:* Did I distinguish GIT1 and GIT2 clearly? Yes, emphasize that while equivalent inside $F$, the epistemic access to them from the "outside" (the mind) is where the argument lives or dies.
      *   *Tone:* Academic, precise, suitable for a seminar paper context. Avoid taking sides, but clarify the logical landscape.

  7.  **Final Polish:** (Mental check of the Lucas-Penrose specific phrasing). Lucas (1961) focuses on the ability to produce the Gödel formula. Penrose (1989, 1994) focuses on non-computable physics/orchestrated objective reduction, but the logical argument is similar (Shadows of the Mind). I should focus on the logical argument common to both.

      *   *Crucial nuance:* The user asks about the slide between "mind proving its own consistency" vs "generating undecidable sentence."
