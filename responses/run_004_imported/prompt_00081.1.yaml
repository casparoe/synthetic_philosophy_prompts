          *   GIT2: $F \nvdash Con(F)$.
          *   Connection: $F \vdash Con(F) \leftrightarrow G$. So proving $G$ is equivalent to proving consistency *within the system*.
          *   *Lucas-Penrose Slide:* They argue humans see $G$ is true. Since $G \leftrightarrow Con(F)$, humans see $F$ is consistent. But $F$ can't. Therefore Mind $\neq F$.
