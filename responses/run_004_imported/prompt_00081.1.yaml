      *   *Part 1: The Bare Logic (Gödel's Theorems).* Distinguish GIT1 (unprovable truth) and GIT2 (unprovable consistency). Clarify that for a system $F$, $Con(F) \leftrightarrow G(F)$ is provable within $F$ (under certain conditions), linking the two.
