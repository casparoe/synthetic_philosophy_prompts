answer: |-
  The funeral home's reception room smelled of stale lilies and cheap whiskey. Elias swirled the ice in his glass, watching the mourners cluster near the casket.

  "The kid told the priest he felt nothing," Elias said, not looking up. "No guilt, no love, no residual obligation. Williams was right. If there's nothing in the son's subjective motivational set that sound deliberation could've hooked onto, then he didn't have a reason to visit. Full stop. Saying otherwise is just noise."

  Julian, standing slightly too straight for a wake, tightened his grip on his own glass. "So the normative force of a father-son relationship dissolves because the son is emotionally stunted? You're making the existence of the reason hostage to the agent's psychology. The reason was there, Elias. It existed in the value of the relationship itself, whether the boy was capable of perceiving it or not."

  "Perceiving it how?" Elias turned, a thin smile cutting through his fatigue. "By magic? If I tell the son, 'You had a reason to go,' I'm making a truth claim. If that truth isn't anchored in what could actually move him, I'm lying. I'm pretending there's a bridge where there's only air. Williams saved us from that mysticism. No internal path, no reason."

  "You're confusing *explaining* the action with *justifying* it," Julian shot back, his voice dropping to that lecturing timbre he'd never quite lost. "McDowell's point is that the virtuous agent perceives requirements in the world that the non-virtuous agent is blind to. The son's inability to feel the pull is a defect in *him*, not evidence that the pull wasn't there. You're letting his blindness dictate the landscape."

  "His blindness *is* the landscape, Julian. That's the reality." Elias gestured vaguely toward the casket. "If you insist he had a reason he couldn't possibly access, you're not talking about *his* reasons anymore. You're talking about Platonic forms floating above his head. I'd rather be accurate about human agency than comforted by objective 'oughts' that do no work."

  "And I'd rather not reduce morality to a slave of appetite," Julian said, finally taking a sip. "You think you're being rigorous, but you're just letting people off the hook by shrinking the world to fit their desires. The reason was objective. He failed to answer it. That's a tragedy, not a metaphysical impossibility."

  "Keep telling yourself the world is full of invisible demands," Elias said, turning back to the mourners. "I'll stick with what actually moves people."

  "And I'll stick with what *should*," Julian replied. "Even if they're deaf to it."
