answer: |-
  This is a fantastic pairing for a seminar. You have Anscombe, the uncompromising moral philosopher, going toe-to-toe with Walzer, the political theorist trying to make morality work in the messy real world. The tension you sensed in section is the central friction of modern Just War Theory: **Is morality a set of absolute boundaries, or a set of weights to be balanced in extremis?**

  Here is a breakdown of the structural differences, an analysis of the "consequentialism collapse" objection, and a verdict on which framework handles Hiroshima better.

  ### 1. Structural Comparison: What's Doing the Moral Work?

  To stack these up, you have to look at where each theorist locates the source of moral value.

  **Anscombe: The Metaphysics of Action**
  For Anscombe, the moral work is done entirely by **intentionality** and the **nature of the act**.
  *   **Structure:** Absolutist Deontology.
  *   **The Mechanism:** Certain acts are *malum in se* (evil in themselves). The intentional killing of the innocent is one of them.
  *   **The Logic:** If you intend the death of innocents as a means to an end (even a good end like saving lives by ending the war), you have committed murder. The consequences (lives saved, war shortened) are morally irrelevant to the *permissibility* of the act.
  *   **Why Truman is Guilty:** He formed the intention to kill civilians. The bomb dropped, civilians died. The transaction is complete. It is murder. Full stop.

  **Walzer: The Rights of Communities vs. Individuals**
  For Walzer, the moral work is done by **rights** and **necessity**.
  *   **Structure:** Threshold Deontology (or Rights-Foundationalism with an Emergency Valve).
  *   **The Mechanism:** Civilians have a right to immunity based on the "War Convention." This right usually trumps military necessity. *However*, rights exist within a political community. If that community faces total destruction (moral and physical), the survival of the community can temporarily override the rights of individuals.
  *   **The Logic:** This is not a free calculation. Walzer sets a incredibly high bar: the threat must be **imminent** and **existential** (e.g., Nazi victory in 1940). It is not enough that violating the rule saves *more* lives; the violation must prevent a catastrophe that would render morality itself impossible.
  *   **Why Truman is Guilty:** Walzer agrees Truman is guilty, but not because the act is *inherently* murder in all contexts. Truman is guilty because the **criteria for the exception were not met.** Japan was already defeated; there was no "supreme emergency" for the US or its allies in August 1945. Therefore, the standard rule (don't kill civilians) applies.

  **The Key Difference:** Anscombe condemns Truman because he broke a law of God/Nature. Walzer condemns Truman because he failed a test of historical necessity.

  ### 2. The "Collapse into Consequentialism" Objection

  This is the crux of your section's debate. Anscombe famously coined "consequentialism" as a pejorative term to describe the mindset that says "do evil that good may come." Her charge against Walzer (and anyone who allows exceptions) would be: **Once you admit that consequences can override rules, you have surrendered the fortress.**

  **The Argument for Collapse:**
  If the rule "do not target civilians" can be overridden by "the survival of the political community," haven't you just introduced a utilitarian calculus? You are essentially weighing the rights of X number of civilians against the survival of the state. If the state wins, it's because the "value" of the state's survival outweighs the "value" of the civilians' lives. That is consequentialism by another name. It turns the absolute prohibition into a strong presumption, and presumptions are made to be broken when the math gets bad enough.

  **The Argument for Distinction (Walzer's Defense):**
  Walzer anticipates this. He calls his exception a **"utilitarianism of extremity,"** but he tries to distinguish it from standard consequentialism in two ways:
  1.  **The Threshold is Lexical, Not Mathematical:** You don't break the rule because you save 10,001 lives vs. 10,000. You break it only when the *moral universe* is at risk of collapse (e.g., a Nazi victory). It is a qualitative threshold, not a quantitative calculation.
  2.  **Dirty Hands:** This is crucial. For a pure consequentialist, if the math works out, the act is *good*. For Walzer, even in a supreme emergency, the act remains **wrong**. The leaders who authorize it have "dirty hands." They may be excused politically, but they are still morally stained. Anscombe says the act is murder; Walzer says the act is a crime that might be tragically necessary.

  **The Verdict on the Collapse:**
  Anscombe is logically stronger here. Once you concede that the rule is not absolute, you invite the debate about *when* it applies. Walzer tries to fence off the exception with strict criteria (imminence, existential threat), but history shows that leaders are very good at convincing themselves they face a "supreme emergency" when they don't (Truman is exhibit A). By allowing the exception, Walzer weakens the normative force of the rule. Anscombe is right that moral absolutes derive their power from their inflexibility. Walzer's framework is more realistic, but it is less morally stable.

  ### 3. Final Verdict: Which Account Makes Hiroshima Wrong?

  For your response paper, I recommend arguing that **Walzer provides the more defensible account of Hiroshima, specifically because it condemns Truman on grounds that even a non-absolutist must accept.**

  Here is the reasoning:

  **Why Anscombe is Vulnerable:**
  Anscombe's condemnation is powerful but brittle. It relies entirely on the premise that intentional killing of innocents is *always* wrong. If a student in your seminar challenges that premise (e.g., "What if killing one innocent child saves the entire human race?"), Anscombe has no answer other than "It is still murder." While morally consistent, this can look like moral fetishism in the face of catastrophe. It allows critics to dismiss her entire argument by rejecting her absolutism.

  **Why Walzer is Stronger:**
  Walzer condemns Truman on **two** levels, making his case harder to refute.
  1.  **The Deontological Level:** He agrees with Anscombe that targeting civilians is presumptively wrong.
  2.  **The Consequentialist Level:** He argues that even by Truman's *own* logic, the bomb was unnecessary. Japan was already beaten; the Soviet entry was imminent; the invasion wasn't actually required.

  Walzer meets the consequentialist on their own turf and defeats them. He shows that Hiroshima wasn't just a moral crime (violating rights); it was a **practical error** (failing the necessity test).

  **The Synthesis for Your Paper:**
  You can argue that Walzer's framework is superior *for political morality* because it acknowledges the tragedy of war without abandoning the norm. Anscombe gives us the moral compass, but Walzer gives us the map.
  *   Anscombe tells us *why* we feel horror at Hiroshima (the murder of innocents).
  *   Walzer tells us *why* that horror translates into a political indictment (the lack of necessity).

  **Conclusion:**
  Walzer's account is more defensible because it doesn't require us to be Anscombean absolutists to agree that Truman was wrong. It allows us to say: "Even if there *were* a supreme emergency exception, Truman didn't meet it." This makes the condemnation of Hiroshima robust against counterfactuals. Anscombe's argument is morally purer, but Walzer's is politically lethal—and in a seminar about *War*, the political account often carries more weight.

  **One final tip for the paper:** Make sure to highlight Walzer's concept of "dirty hands." It's the bridge between the two. It admits Anscombe is right that something evil happened, but insists Walzer is right that we sometimes have to do evil to save the world. Truman, however, didn't even have that excuse.
