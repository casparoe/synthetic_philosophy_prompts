answer: |-
  Here are eight interview questions designed to press on the vulnerabilities of disjunctivism, incorporating your specific requirements regarding causation, negative characterization, and epistemological implications. Each question includes an anticipated defense and a sharp follow-up to prevent the conversation from stalling on standard talking points.

  ### 1. The Causal Screening-Off Objection
  **Question:** In my migraine auras, the shimmering arcs are generated by cortical spreading depression, not external light. Neuroscience suggests the proximate neural cause of my aura and the neural cause of my veridical vision of this desk lamp are relevantly similar in the visual cortex. If the brain state is sufficient to produce the *phenomenology* of the aura, doesn't that neural state "screen off" the external world? Why isn't the common neural cause evidence of a common mental effect?

  *   **Anticipated Defense:** She will likely argue that a common *cause* does not entail a common *effect* or mental kind. She may claim the neural state is merely a necessary condition, not a sufficient one for the *nature* of the experience, which is constituted by the external object in the good case.
  *   **Follow-up:** If the neural state is identical in both cases but the mental state is fundamentally different, aren't you committed to a form of psychophysical dualism where the physical brain state underdetermines the mental kind? How do you avoid the conclusion that the external object is doing no explanatory work for the *experience itself*, only for its truth value?

  ### 2. The Negative Characterization of the "Bad Case"
  **Question:** Disjunctivists often characterize the hallucinatory disjunct merely as a state that is "indiscriminable from" a veridical perception. This seems like a purely negative, relational definition—it tells us what the hallucination *isn't*, not what it *is*. Is this an honest account of the positive phenomenology of the hallucination, or is it just a metaphysical placeholder to avoid admitting a common factor?

  *   **Anticipated Defense:** She will likely argue that "indiscriminability" is an epistemic characterization of a state that has its own subjective reality, but lacks the *relational* nature of perception. She may insist we shouldn't expect the bad case to have the same ontological weight as the good case.
  *   **Follow-up:** But when I experience the aura, it presents a positive, luminous quality that feels intrinsic to the experience. If the hallucination has no positive common nature with veridical seeing, what grounds that specific "light-like" phenomenology? Are you forced to say the qualitative character of my experience is an illusion?

  ### 3. Metaphysical vs. Epistemological Disjunctivism
  **Question:** Duncan Pritchard defends epistemological disjunctivism—the idea that in the good case, I have factive reasons for belief that I lack in the bad case. Does your metaphysical disjunctivism (about the nature of experience) entail Pritchard's view, or could a representationalist who believes veridical and hallucinatory states *are* the same fundamental kind still hold Pritchard's epistemic view?

  *   **Anticipated Defense:** She will likely argue that epistemological disjunctivism is most naturally supported by metaphysical disjunctivism (specifically Naive Realism), as it's hard to have factive reasons if the mental state itself isn't world-involving.
  *   **Follow-up:** If a representationalist can coherently claim "I see that $p$" provides a factive reason without accepting your metaphysical view, hasn't the main philosophical work been done by the epistemology alone? Is metaphysical disjunctivism then just an optional, more controversial add-on that does no heavy lifting against skepticism?

  ### 4. Phenomenal Seamlessness and Introspection
  **Question:** Drawing on my migraine experience: the aura is phenomenologically seamless with ordinary vision until I make a cognitive judgment that the lamp isn't actually shimmering. If the fundamental metaphysical nature of the state changes based on the presence of an object, why is introspection blind to that change? Why does the mind feel like it's in the same state in both cases?

  *   **Anticipated Defense:** She will likely appeal to the "transparency of experience," arguing that introspection looks *through* the experience to the world, so when the world is absent (hallucination), introspection fails to reveal the absence of the relation.
  *   **Follow-up:** But if introspection cannot reveal whether I am in the veridical or hallucinatory disjunct, doesn't that make the mind opaque to itself regarding its own fundamental nature? How do you reconcile this with the traditional view that we have privileged access to the kinds of states we are in?

  ### 5. The "Common Kind" Assumption and Methodology
  **Question:** Critics argue that rejecting the "Common Kind Assumption" (that veridical and hallucinatory experiences share a highest common factor) is methodologically suspicious. It seems to violate a principle of parsimony: why posit two fundamentally different kinds of mental states when one kind plus a difference in causal history explains the data?

  *   **Anticipated Defense:** She will likely argue that parsimony shouldn't trump phenomenological accuracy. She may claim that assuming a common kind is a prejudice inherited from the Argument from Illusion, not a neutral methodological starting point.
  *   **Follow-up:** But if we apply your method to other senses, do we get the same result? If I feel a phantom limb pain versus a real touch, is that also two fundamentally different mental kinds? If you say "yes," aren't you fragmenting psychology so much that it can no longer generalize across cases?

  ### 6. The Explanatory Role of the External Object
  **Question:** In the veridical case, you argue the external object is a constituent of the experience. But in the hallucinatory case, the experience occurs without the object. If the object is a constituent in one case but not the other, how do you explain the *similarity* in how I behave and report the experience in both cases without referencing a shared internal vehicle?

  *   **Anticipated Defense:** She will likely argue that the similarity is explained by the indiscriminability, not by a shared vehicle. She may suggest that behavioral output is determined by how things *seem*, not by the metaphysical constitution of the seeming.
  *   **Follow-up:** If "how things seem" is sufficient to explain the behavior and the report, haven't you effectively conceded that the "seeming" is the real explanatory engine? If the "seeming" can exist without the object, why isn't *that* the common mental state, rendering the object's constitutive role redundant?

  ### 7. Naive Realism and Disjunctivism
  **Question:** Is disjunctivism inseparable from Naive Realism? Can one be a disjunctivist about perceptual knowledge while maintaining that the *immediate* object of awareness is always an internal representation, provided that representation is caused appropriately in the good case?

  *   **Anticipated Defense:** She will likely argue that "true" disjunctivism requires Naive Realism. If the immediate object is always an internal representation, you have accepted the Common Kind Assumption at the level of awareness, even if you deny it at the level of knowledge.
  *   **Follow-up:** This suggests your view is less about the structure of experience and more about a specific commitment to direct realism. If the primary motivation for disjunctivism is to defeat skepticism, but it requires accepting Naive Realism (which many find independently implausible), haven't you just pushed the skeptical problem back a step to defending Naive Realism?

  ### 8. The Dialectical Efficacy Against Skepticism
  **Question:** Let's look at the payoff. The Argument from Illusion is traditionally used to motivate skepticism: if I can't tell the difference, I can't know I'm not hallucinating. If disjunctivism simply asserts "but you *are* not hallucinating in the good case, so the states are different," doesn't this beg the question against the skeptic who doubts your access to that difference?

  *   **Anticipated Defense:** She will likely argue that disjunctivism isn't a premise in an argument against the skeptic, but a rejection of the skeptic's starting framework. She may claim it restores our right to claim knowledge without needing to rule out the bad case first.
  *   **Follow-up:** But for the podcast listener struggling with the intuition that their brain could be stimulated to mimic any experience (like my aura), simply rejecting the framework feels like a refusal to engage. Does disjunctivism actually *answer* the skeptic's worry about underdetermination, or does it just declare the worry ill-formed?
