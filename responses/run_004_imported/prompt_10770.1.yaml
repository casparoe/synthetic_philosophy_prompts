answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Faculty Advisors and Members
  **FROM:** Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Proposed Findings and Sanctions: Capstone Group 4

  **Purpose**
  To resolve the Council's deadlock regarding the four seniors who submitted a joint capstone report containing fabricated data. This opinion addresses the tension between individual intent and the nature of joint academic commitments.

  **Interpretation of the Honor Code**
  We must take the "joint commitment" argument seriously. When students elect to submit a single document for a single grade, they are not merely aggregating four assignments; they are mutually warranting the integrity of the whole. To accept the grade is to certify the work. Therefore, the *academic validity* of the submission rests on all four signatures. If the foundation is compromised, the credit cannot stand for any member.

  However, the Honor Code also governs *ethical conduct*, not just academic validity. Moral culpability requires knowledge. To sanction the three non-fabricating students for *dishonesty* conflates negligence with deception. We can uphold the principle of joint responsibility without falsely accusing innocent students of lying.

  **Recommended Findings**

  1.  **Student A (Fabricator):**
      *   **Finding:** Responsible for Academic Integrity Violation (Fabrication/Falsification).
      *   **Consequence:** Failing grade for the course; standard disciplinary notation on internal record; mandatory ethics remediation.

  2.  **Students B, C, and D (Collaborators):**
      *   **Finding:** No Honor Code Violation (No intent to deceive).
      *   **Academic Consequence:** The shared grade for the capstone is nullified for all four students. The work, as submitted, is academically invalid due to the joint commitment to the final product.
      *   **Remedy:** Students B, C, and D may submit a remediated assignment or individual addendum to recover the *academic credit*, but they will not receive the original shared grade.
      *   **Educational Consequence:** Mandatory reflection on collaborative oversight and verification processes, to be filed with their advisors.

  **Rationale**
  This distinction preserves the integrity of the grading system (honoring the "joint commitment") while preserving the integrity of the Honor Council (honoring "individual intent"). It signals that while we do not punish ignorance as malice, we do hold students accountable for the academic products they jointly certify.

  I move we adopt these findings.
