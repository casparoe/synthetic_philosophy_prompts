      *   **Addressing the "Individual Intent" Argument:** Also valid. Moral culpability requires knowledge. Punishing ignorance as malice undermines the code.
      *   **The Synthesis (The Ruling):**
          *   *The Work:* The report is compromised. All four lose the credit/grade associated with it (Joint Commitment).
          *   *The Violation:* Only the fabricator committed an Honor Code violation regarding *deception*. The others committed a procedural error in verification, but not an integrity violation.
      *   **Consequences:**
          *   *Student A (Fabricator):* Standard severe penalty (F on assignment, potential suspension/notation, mandatory ethics education).
