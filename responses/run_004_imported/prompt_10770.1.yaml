prompt: |-
  I'm the student representative on my high school's Honor Council, which hears academic-integrity cases with two faculty advisors, and we're deadlocked on a case ahead of Wednesday's hearing. Four seniors submitted a single joint capstone report and, per the syllabus, all four received one shared grade for it. It's since come out that one member fabricated a data table without telling the others, who say they only checked their own sections and had no reason to suspect anything. Our honor code says students are responsible for 'work they submit,' but doesn't address whether submitting one shared document makes everyone answerable for parts they didn't personally write. Half the council argues that choosing to present a single joint product is itself a commitment that makes the whole group responsible for the whole report -- a 'joint commitment,' as one member keeps putting it, borrowing a term from a philosophy elective. The other half insists responsibility should track only who actually knew or intended the fabrication. Please draft the short opinion I'll present: it should recommend specific findings and consequences for each of the four students, and it should take the 'joint commitment' argument seriously rather than treat it as a rhetorical stretch.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Student Representative on the High School Honor Council.
      *   **Context:** Deadlocked case ahead of a hearing (Wednesday).
      *   **Case Details:** Four seniors submitted a *single joint capstone report*. Syllabus stated they receive one *shared grade*. One member fabricated a data table without the others' knowledge. The other three claim they only checked their own sections and didn't suspect foul play.
      *   **Honor Code:** Says students are responsible for "work they submit." Ambiguous on joint work liability.
      *   **The Conflict:**
          *   Side A (Joint Commitment): Submitting a single product implies responsibility for the whole.
          *   Side B (Individual Intent): Responsibility tracks knowledge/intent (mens rea).
      *   **Task:** Draft a *short opinion* to present to the Council.
      *   **Requirements:**
          *   Recommend specific findings and consequences for *each* of the four students.
          *   Take the "joint commitment" argument *seriously* (not dismiss it as rhetorical).
          *   Resolve the deadlock (implied need for a compromise or a decisive ruling that bridges the gap).

  2.  **Determine the Stance/Philosophy:**
      *   The prompt asks me to take the "joint commitment" argument seriously. This means I can't just say "only the faker is guilty." I need to acknowledge that submitting a unified document *does* create a specific type of liability.
      *   However, high school justice usually requires some proportionality. Punishing three innocent students as harshly as the liar feels unjust and might violate the spirit of "integrity."
      *   *Solution:* Differentiate between *academic responsibility* (the grade/validity of the work) and *honor violation* (the ethical breach).
      *   *The "Joint Commitment" Logic:* By submitting one report for one grade, the group certified the *whole* as accurate. Therefore, the *work* is compromised for all. However, the *violation* (lying) is specific to the individual.
      *   *Precedent/Analogy:* Co-authored papers in academia. If data is faked, the paper is retracted (all authors lose credit), but only the faker is investigated for misconduct (unless negligence is proven).
      *   *High School Context:* Needs to be educational, not just punitive.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard formal memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty and the specific deadlock. State the purpose of the opinion.
