          8.  Lying that harms no one and protects someone from death (best of the worst).
      *   **Rahab/Midwives:** Augustine admits Scripture praises them, but argues it was for their *faith/benevolence*, not the lie. The lie is still a sin, but venial/remitted due to the greater good of the intention, or perhaps the reward covers the penalty. He sometimes suggests they might be prophetic (speaking truth in a mystery), but generally sticks to the "sin forgiven" line.
