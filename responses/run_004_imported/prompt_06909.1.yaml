          2.  Lying that harms someone unjustly.
          3.  Lying that harms someone to help another.
          4.  Lying for the mere pleasure of lying.
          5.  Lying to please others in conversation.
          6.  Lying that harms no one and helps someone (e.g., saving money/property).
