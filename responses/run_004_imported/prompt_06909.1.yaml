      *   **Teleology:** Speech is for communicating thoughts. To speak against one's mind is a sin against the order of creation/God.
      *   **Absolutism:** No lie is justifiable. All lies are sins.
      *   **The 8-Fold Ranking (from *De Mendacio*):**
