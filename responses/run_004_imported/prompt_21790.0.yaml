      *Let's go with the **Institutional Mandate** argument combined with **Ex-Ante Fairness**.* If we adopt "Save the Many" as a general rule, everyone in the population has a higher ex-ante probability of survival than under "Coin Flip." This respects everyone's interest in survival without needing to aggregate *losses* in the moment. This is the Harsanyi/Rule-Utilitarian move. It respects the separateness of persons by applying a rule that benefits everyone *behind the veil of ignorance*.

      *Yes, that's the one.* It addresses Taurek's "separateness" concern by shifting to an ex-ante perspective where each individual benefits from the rule.

  7.  **Finalizing the Memo Structure:**
