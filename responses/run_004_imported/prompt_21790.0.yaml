answer: |-
  **MEMORANDUM**

  **TO:** Crisis Standards of Care Committee
  **FROM:** [Your Name], Bioethics Practicum Fellow
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Allocation Protocol: Scarce Medication Scenario

  **Recommendation**
  I recommend the committee adopt the **"Save the Greater Number"** rule for the specific scenario in which a fixed supply of medication can fully treat either one patient or five patients, where all patients have equal medical need and equal prognosis for recovery. The protocol should direct clinicians to allocate the supply to the group of five.

  **Rationale**
  This recommendation acknowledges the serious philosophical objection raised regarding John Taurek's argument in *"Should the Numbers Count?"* Taurek correctly warns against treating the five patients as a single collective entity whose summed loss outweighs the single patient's loss. He argues that because persons are separate, we cannot aggregate their claims; thus, a coin flip is the only way to give the single patient an equal chance of survival.

  However, while Taurek's insight regarding the "separateness of persons" is vital for individual moral agents, it is less applicable to **institutional policy under Crisis Standards of Care (CSC)** for three engageable reasons:

  **1. Ex-Ante Fairness (The "Veil of Ignorance" Argument)**
  Taurek focuses on *ex-post* fairness (the outcome for the specific individuals in the room). However, policy must be judged *ex-ante* (from the perspective of any community member before they become a patient).
  If we adopt a general policy of "Save the Greater Number," every member of the community maximizes their statistical probability of survival should they find themselves in this scarcity scenario. If we adopt a "Coin Flip" policy, we collectively lower the survival probability for the population to preserve a procedural chance for the minority. A rule that maximizes each individual's *ex-ante* chance of rescue respects the separateness of persons by serving the rational self-interest of every person equally, without requiring us to merge their identities in the moment of crisis.

  **2. The Duty of Stewardship vs. Individual Advocacy**
  Under standard care, a physician's duty is to the individual patient. Under CSC, the hospital's duty shifts to **public health stewardship**. The ethical mandate of CSC is explicitly to minimize overall mortality when resources are insufficient for all.
  To choose a coin flip is to choose a policy where, in 50% of cases, four preventable deaths will occur unnecessarily. While the single patient has a claim to be saved, they do not have a claim to a *procedure* that knowingly increases the total mortality risk of the group. The claims of the five are not "summed" to outweigh the one; rather, the claim of *each* of the five is equal to the one, and satisfying five equal claims is preferable to satisfying one when the resource allows.

  **3. Public Trust and Defensibility**
  While philosophical purity is our goal, ethical protocols must also maintain public trust. A policy that knowingly allows four additional deaths to occur when they could have been prevented is unlikely to be viewed as "fair" by the public, regulators, or the families of the five. Maintaining the social license to operate during a crisis requires a standard that aligns with the widely held moral intuition that preventing greater loss of life is a priority.

  **Conclusion**
  Adopting the "Save the Greater Number" rule does not require us to dismiss Taurek's concern for the individual. It requires us to recognize that in a public health crisis, the fairest rule is the one that offers the highest probability of rescue to any random member of the community. I recommend we codify this rule while ensuring robust oversight to prevent "scope creep" into scenarios where prognosis or need is not equal.

  I welcome the opportunity to discuss how we might further refine this language to address the concerns regarding individual equity.
