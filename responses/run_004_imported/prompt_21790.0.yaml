      *   **The Aggregative Counter-Argument:** Saving more is better. Minimizing overall loss of life. Failing to save the five when you could is effectively choosing to let four die unnecessarily.
      *   **The Institutional/Legal Context:** Hospitals operate under public trust, legal liability, and regulatory oversight. "Crisis Standards of Care" imply a shift from individual patient advocacy to public health stewardship.

  3.  **Determine the Recommendation:**
