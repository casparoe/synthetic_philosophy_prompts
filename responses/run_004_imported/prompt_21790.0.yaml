      *   Make sure the recommendation is actionable.

      *(Self-Correction on "Reasoning the losing side could engage with"):* If I just say "Stewardship," a philosopher will roll their eyes. I need to engage the *moral* argument. The strongest moral argument against Taurek that isn't just crude utilitarianism is the argument that *claims* are not just about the individual but about the *action* required of the agent. If I can save A or B, I have a duty to save one. If I can save A or (B, C, D, E, F), and I flip, I am choosing an action where B, C, D, E, F might die unnecessarily. The "unnecessary death" point is key. Taurek denies "unnecessary" applies across persons. I need to argue why it *does* in a medical context.
      *   *Actually, the best engagement is the "Fair Chance" modification.* Some argue for a weighted lottery. But in 1 vs 5, a weighted lottery heavily favors the 5. A pure "save the 5" is the limit case of a weighted lottery. I will argue that "Save the Greater Number" is the only policy that respects the *equality* of the claims without arbitrarily diminishing the survival probability of the majority.

      *Let's try to find a middle ground that is still a specific rule.* No, the prompt asks to recommend *one* specific rule. I must choose. "Save the Greater Number" is the only viable institutional policy. The challenge is the justification.

      *Revised Plan for Justification:*
