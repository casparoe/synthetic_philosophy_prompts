      *   *The "Equal Chance" Rebuttal:* If we save the 5, the 1 has 0% chance. If we flip, the 1 has 50%. But the 5 go from 100% to 50%. To give the 1 a fair chance, we drastically reduce the chances of the 5. Is it fair to lower the 5's chances to raise the 1's?
      *   *Stronger Philosophical Hook:* Use the distinction between *ex-ante* fairness and *ex-post* outcomes. Or better, the argument from **reasonable rejectability** (Scanlon). The single patient cannot reasonably reject a rule that saves more lives when their medical claim is identical, because the alternative requires sacrificing four others to preserve a procedural chance for them.
