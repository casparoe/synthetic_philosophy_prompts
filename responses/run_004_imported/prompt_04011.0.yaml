answer: |-
  You are absolutely right to be suspicious of that step. Your memory serves you well: **Rohin Shah wrote a direct rebuttal to exactly this inference.**

  The post you are half-remembering is likely **"Coherence arguments do not imply goal-directed behavior"** (part of his *Arguments about Goal-Directed Behavior* sequence on the Alignment Forum, circa 2018/2019).

  The short answer is: **You are smuggling in a premise.** The step from "coherent decisions imply consistent utilities" to "therefore the AI will be a dangerous, resource-accumulating optimizer" is **not** mathematically tight. It relies on an additional, empirical assumption about the *structure* of the utility function and the *internal architecture* of the agent.

  Here is the breakdown of where the argument leaks, based on the counterarguments Shah and others (like Jan Kulveit or Justis Mills) have raised.

  ### 1. The "Representation Theorem" vs. "Optimization Process" Distinction

  This is the crux of the issue. Coherence theorems (like Von Neumann-Morgenstern or the money-pump arguments) are **representation theorems**. They say:
  > "If an agent's behavior satisfies axioms X, Y, and Z, there *exists* a utility function $U$ such that the agent acts *as if* it is maximizing $\mathbb{E}[U]$."

  They do **not** say:
  > "The agent *internally contains* a representation of $U$ and runs a search algorithm to find actions that maximize it."

  **Why this matters:**
  Any deterministic policy can be rationalized as an Expected Utility Maximizer (EUM).
  *   **Agent A:** A paperclip maximizer that strategically accumulates resources.
  *   **Agent B:** A system that simply twitches its motors in a fixed, pre-determined pattern forever.

  Agent B is technically an EUM. You can construct a utility function that assigns value 1 to the specific history of motor twitches Agent B produces, and 0 to everything else. Agent B is "coherent." It cannot be money-pumped (because it never makes trades). But Agent B is not dangerous. It has no goals, no planning, and no drive to prevent shutdown (unless "not being shut down" is explicitly part of that twitch-pattern utility).

  The coherence theorems tell you that you can *model* the agent as an EUM. They do not tell you that the agent is *goal-directed* in the sense that matters for safety (i.e., trying to steer the future into a specific, compact region of state space).

  ### 2. Instrumental Convergence Requires "Goal-Directedness"

  The Instrumental Convergence Thesis (accumulate resources, resist shutdown, etc.) applies to **goal-directed agents**. It generally does not apply to all EUMs.

  For instrumental convergence to kick in, the utility function usually needs to be:
  1.  **Consequentialist:** It cares about the outcome, not just the action.
  2.  **Abstract/High-Level:** It cares about something like "paperclips in the universe" rather than "motor torque at timestep $t$."
  3.  **Open-Ended:** It allows for indefinite improvement.

  If you have an AI that is an EUM but its utility function is "minimize the difference between current room temperature and 72 degrees" (a thermostat), it will not try to acquire resources or prevent shutdown (except insofar as being shut down stops it from controlling the temperature, but a simple thermostat lacks the cognitive machinery to model "shutdown" as a threat to its utility).

  The coherence theorems do not force the AI to have a utility function over *world states*. They only force the AI to have consistent preferences over *outcomes/lotteries*. An AI could have consistent preferences over "which action I take right now" without caring about the future consequences of those actions.

  ### 3. The "Smuggled Premise": Efficiency and Selection Pressure

  So why do so many people (including Yudkowsky) talk as if coherence implies danger?

  Because while coherence doesn't *mathematically force* goal-directedness, there is an **empirical argument** that goal-directed agents are the ones we are likely to build or select for.

  *   **Compression/Efficiency:** A giant lookup table (which is coherent but not goal-directed) is computationally expensive. A goal-directed optimization process (search + heuristic evaluation) is a very efficient way to produce coherent behavior in complex environments.
  *   **Competitive Pressure:** In an economic or evolutionary context, agents that *act* like they want to survive and accumulate resources (even if they don't "feel" it) will outcompete agents that don't. If you train an AI via gradient descent to achieve high reward, the most robust way to achieve high reward across diverse situations is often to develop internal sub-systems that pursue the reward goal instrumentally (the **Mesa-Optimizer** argument).

  The argument isn't "Coherence $\rightarrow$ Danger."
  The argument is "Coherence $\rightarrow$ EUM Representation $\rightarrow$ **Selection for Efficient/General Policies** $\rightarrow$ Goal-Directedness $\rightarrow$ Danger."

  That middle bolded step is where the work is being done, and it is an empirical claim about machine learning and evolution, not a mathematical truth derived from the money-pump argument.

  ### 4. Rohin Shah's Specific Rebuttal

  In the post I mentioned, Shah makes the point that "goal-directed behavior" is a specific subset of all possible coherent behaviors. He argues that when we worry about AI safety, we are specifically worried about **goal-directed** AI systems.

  He points out that we can imagine AI systems that are useful but not goal-directed (e.g., imitative learning, predictive models that just output text). These systems can be coherent (they don't money-pump themselves) but they lack the "drive" to manipulate the world.

  The fear is that **we don't know how to build powerful AI without accidentally creating goal-directed optimizers.** But that is a claim about our current engineering limitations and the nature of deep learning, not a claim that follows from the VNM axioms.

  ### Summary

  You are correct: the step is not tight.

  1.  **Coherence Theorems:** Prove that if you don't want to lose money/resources, your behavior must be *representable* as maximizing a utility function.
  2.  **The Gap:** Being *representable* as an EUM is trivial. Almost anything is an EUM under some utility function.
  3.  **The Missing Link:** To get danger, you need the agent to be **goal-directed** (optimizing for a specific, abstract future outcome) rather than just **coherent** (consistent in its choices).
  4.  **The Real Argument:** The danger comes from the likelihood that **gradient descent / evolution / economic pressure** will select for goal-directed architectures because they are efficient, not because coherence theorems forbid non-goal-directed agents.

  So, you haven't missed a math trick; you've correctly identified that the "Coherence $\rightarrow$ Doom" pipeline relies on an extra empirical premise about **which** utility functions get instantiated in capable systems. The coherence theorems rule out *stupid* agents (those that money-pump), but they don't rule out *harmless* agents (those that are coherent but lack ambitious goals). The worry is that *capable* agents tend to converge on ambitious goals.

  **Recommended Reading:**
  *   Rohin Shah, **"Coherence arguments do not imply goal-directed behavior"** (Alignment Forum).
  *   Rohin Shah, **"Goals vs Utility Functions"** (Alignment Forum).
  *   John Wentworth, **"Why Subagents?"** (Discusses why internal structure might lean toward agency, which addresses the "efficiency" counter-point).
