      Small Centers (Fast): Q3 Vol = 100, Time = 5min. Q4 Vol = 100, Time = 4min (Software).
      Flagships (Slow): Q3 Vol = 100, Time = 10min. Q4 Vol = 1000, Time = 9min (Software).
      Q3 Total Avg: (100*5 + 100*10) / 200 = 7.5 min.
      Q4 Total Avg: (100*4 + 1000*9) / 1100 = 8.6 min.
      Individual centers improved (5->4, 10->9). Total average worsened (7.5->8.6).
      This IS Simpson's Paradox. Meg is right about the math.
      Owen's point: The Flagship improvement (10->9) happened during a volume spike (100->1000). Maybe without software it would have gone 10->15. We don't know.
      So Meg is right on *description*, Owen is right on *causation*.

