      *   What *is* the Dualism of Practical Reason? It's not just "morality vs. happiness." It's that Rational Egoism (maximize my good) and Rational Utilitarianism (maximize universal good) are both self-evident axioms of practical reason.
      *   They conflict when duty sacrifices self-interest without compensation.
      *   Sidgwick claims reason cannot adjudicate this *within* the secular framework.
      *   The "Solution": A theistic hypothesis (Moral Government of the Universe) where virtue is rewarded with happiness (in an afterlife).
      *   *Crucial Point:* Sidgwick treats this not as a matter of *faith* (in the fideist sense) but as a matter of *evidence*. He is an empiricist. If the hypothesis is true, it must be empirically verifiable.

  3.  **Evaluate the Two Readings:**
      *   *Reading 1 (Schultz/Continuity):* Strong because it respects Sidgwick's epistemic rigor. He won't believe without evidence. If ethics requires empirical facts about the cosmos to be coherent, seeking those facts is ethical work.
      *   *Reading 2 (Context/Discontinuity):* Strong because it acknowledges human frailty, the influence of peers (Myers was the engine of SPR), and the possibility of wishful thinking. It warns against over-rationalizing a life.

  4.  **Formulate a Verdict:**
      *   *Option A:* It's all rational. (Too strong, ignores human context).
      *   *Option B:* It's all psychological. (Too dismissive, ignores Sidgwick's own justification).
      *   *Option C (The Synthesis/Verdict):* It is a *rationally motivated* project that inevitably succumbed to *psychological and social* pressures, but philosophically, it *must* be read as a continuation of the *Methods*. Why? Because Sidgwick defines the conditions of rationality such that empirical inquiry into the "moral government" is the *only* permissible move for a consistent agnostic. Even if the SPR failed scientifically, the *impulse* was philosophically necessitated by the Dualism.
      *   *Refinement:* I need to argue that the SPR isn't just a "continuation" but an *experimental test* of the necessary postulate of the *Methods*. The verdict should be: The psychical research is the *empirical arm* of his ethical system. To deny the link is to misunderstand Sidgwick's conception of "proof."

