      *   **The Structure of the Dualism:** Explain *why* it demands empirical resolution. It's not a leap of faith. It's a hypothesis requiring verification. Sidgwick is a methodological naturalist regarding evidence.
      *   **The Continuity Argument (Schultz):** Strengthen this. It's about intellectual integrity. If you say "X fact would solve Y problem," and you are a scientist of ethics, you look for X.
      *   **The Discontinuity Argument:** Acknowledge the grief (his mother, his own mortality), the influence of Myers (who wanted immortality for spiritual reasons, not just ethical ones). Acknowledge the risk of confirmation bias.
      *   **The Verdict/Synthesis:** Here's the punchline. The motivation is philosophical, the execution is historically contingent. But we cannot separate them. The SPR *is* Sidgwickian ethics in the laboratory. Even if the science was bad, the *philosophical move* was valid within his system.
      *   **Conclusion:** Summarize. This changes how we read the end of the *Methods*. It's not a surrender; it's a research proposal.

