answer: |-
  This is a fascinating case, and it is excellent that you are bringing your formal training to bear on a real-world instance of decision-making under risk. Your friend's situation is not merely an anecdotal curiosity; it is a textbook instantiation of the **Allais Paradox** (specifically, the "Common Consequence Effect"), which has been the central battleground for debates over the normative status of the Independence Axiom in decision theory for over seventy years.

  To answer your core question directly: **Under standard Expected Utility Theory (EUT), her choices are formally inconsistent.** However, whether this amounts to a "failure of rationality" depends entirely on whether one accepts EUT as the sole normative standard for rationality. There are sophisticated, principled frameworks—most notably **Risk-Weighted Utility Theory**—that validate her reasoning as coherent.

  Here is a breakdown of the formal inconsistency, followed by how major frameworks diagnose her behavior.

  ### 1. The Formal Inconsistency (EUT Diagnosis)

  Let $u(x)$ be the utility function over monetary outcomes, normalized such that $u(0) = 0$. We can formalize her choices as follows:

  **Case 1:**
  *   **Option S (Sure):** \$60,000 with probability 1.
  *   **Option L1 (Lottery):** 12% chance of \$300k, 83% chance of \$60k, 5% chance of \$0.
  *   **Choice:** $S \succ L1$.
  *   **Inequality:** $u(60) > 0.12u(300) + 0.83u(60) + 0.05u(0)$.
  *   Subtracting $0.83u(60)$ from both sides:
      $$0.17u(60) > 0.12u(300) \implies u(60) > \frac{12}{17}u(300) \approx 0.706u(300)$$

  **Case 2:**
  *   **Option L2:** 17% chance of \$60k, 83% chance of \$0.
  *   **Option L3:** 12% chance of \$300k, 88% chance of \$0.
  *   **Choice:** $L3 \succ L2$.
  *   **Inequality:** $0.12u(300) + 0.88u(0) > 0.17u(60) + 0.83u(0)$.
  *   Since $u(0)=0$:
      $$0.12u(300) > 0.17u(60) \implies u(60) < \frac{12}{17}u(300) \approx 0.706u(300)$$

  **The Contradiction:**
  Case 1 requires $u(60)$ to be *greater* than roughly 70.6% of $u(300)$. Case 2 requires $u(60)$ to be *less* than 70.6% of $u(300)$. No single utility function over wealth can satisfy both inequalities simultaneously.

  In the language of von Neumann-Morgenstern (vNM) axioms, your friend has violated the **Independence Axiom**. This axiom states that if you prefer $A$ to $B$, you should still prefer a mixture of $A$ and $C$ to a mixture of $B$ and $C$ (where $C$ is a common consequence). In Case 1, the "common consequence" is the 83% chance of \$60k. In Case 2, that common consequence is replaced by an 83% chance of \$0. Her preference flipped when the common consequence was altered, which EUT forbids.

  ### 2. Is This Irrationality or Principled Reasoning?

  Your friend's explanation ("I couldn't stand giving up a sure thing... whereas once nothing was likely anyway, I might as well swing for the bigger prize") is not merely a post-hoc rationalization. It describes the **Certainty Effect**, a well-documented psychological phenomenon where outcomes regarded as certain are overweighted compared to outcomes that are merely probable.

  Whether this is *irrational* depends on the normative framework you adopt.

  #### A. Expected Utility Theory (The Orthodox View)
  *   **Verdict:** **Irrational.**
  *   **Diagnosis:** EUT posits that rational agents care only about the final probability distribution over outcomes. The *source* of the probability (e.g., whether it comes from a "sure" branch or a "risky" branch) should not matter. By violating Independence, she exposes herself to potential **Dutch Books** (diachronic exploitation) if her preferences are elicited in a specific sequence. For a strict EUT theorist, her sensitivity to the "sureness" of the \$60k is a cognitive bias, akin to an optical illusion.

  #### B. Prospect Theory (The Descriptive View)
  *   **Verdict:** **Predictable / Normal.**
  *   **Diagnosis:** Kahneman and Tversky's Prospect Theory was built to explain exactly this behavior. It posits a **probability weighting function** $\pi(p)$ that is non-linear. Humans tend to overweight small probabilities and the certainty endpoint ($p=1$).
      *   In Case 1, the drop from 100% to 83% probability on the \$60k is psychologically massive (the "certainty effect").
      *   In Case 2, the difference between 17% and 12% is perceived as marginal compared to the difference in payoff magnitude.
  *   **Limitation:** Prospect Theory is primarily descriptive. It tells us *that* she decides this way, but it doesn't necessarily argue that she *should*.

  #### C. Risk-Weighted Utility Theory (The Normative Alternative)
  *   **Verdict:** **Rational.**
  *   **Diagnosis:** This is likely the most relevant framework for your work. Lara Buchak, in *Risk and Rationality* (2013), argues that the Independence Axiom is too restrictive. She proposes **Risk-Weighted Utility (RWU)**, where the agent has a risk function $r(p)$ in addition to a utility function $u(x)$.
      *   In RWU, an agent can rationally care about the *global structure* of the gamble, not just the local expected utility.
      *   A risk-averse agent (with a convex risk function) gives extra weight to the worst-case scenarios. In Case 1, the 5% risk of \$0 looms larger because it threatens the "sure" \$60k. In Case 2, the "worst case" (\$0) is already the dominant probability (83% or 88%), so the marginal increase in risk is less salient than the potential gain.
      *   Buchak argues that sensitivity to the spread of probabilities is a distinct attitude from risk aversion (curvature of utility) and is rationally permissible. Your friend's reasoning fits perfectly here: she is expressing a rational preference for minimizing **regret** or **disappointment** relative to a reference point.

  #### D. Regret Theory (Loomes & Sugden)
  *   **Verdict:** **Rational (Context-Dependent).**
  *   **Diagnosis:** Regret Theory modifies the utility function to include the emotional cost of realizing one made the wrong choice.
      *   In Case 1, if she takes the gamble and gets \$0, she will feel immense regret knowing she turned down a guaranteed \$60k.
      *   In Case 2, if she takes the 12% chance and gets \$0, she feels less regret because the 17% option was also overwhelmingly likely to yield \$0.
      *   If we view "minimizing anticipated regret" as a rational goal, her choices are perfectly coherent.

  ### 3. Synthesis for Your Reflection

  You mentioned worrying that her explanation might be a "fluent-sounding rationalization." Given the formal structure, it is undoubtedly a rationalization in the literal sense (she is providing reasons for her choice), but it is not necessarily *unprincipled*.

  The tension you are feeling stems from the conflict between **diachronic consistency** (required by EUT to avoid Dutch Books) and **synchronic intuition** (the strong psychological pull of the Certainty Effect).

  *   **If you hold EUT as the gold standard:** She is irrational. She is allowing the framing of the probabilities (sure vs. risky) to dictate her preferences rather than the outcomes themselves.
  *   **If you hold a pluralistic or modern view (e.g., Buchak):** She is rational. She is maximizing **Risk-Weighted Expected Utility**. She values the *security* of the \$60k in Case 1 more than the mathematical expectation suggests, and she values the *upside potential* in Case 2 once the security is off the table.

  **Recommendation for your thinking:**
  Since you are in formal epistemology, I strongly suggest looking into **Lara Buchak's Risk-Weighted Utility** and **Edward McClennen's work on resolute choice**. Buchak specifically uses the Allais Paradox to argue that rationality permits agents to be sensitive to the *composition* of risk, not just the bottom line.

  Your friend's behavior is a real-world validation of the philosophical claim that the Independence Axiom is not a necessary condition for rationality. She isn't failing to think clearly; she is operating with a risk profile that standard decision theory fails to capture, but which alternative frameworks successfully model. She is treating the "loss of a sure thing" as a distinct disutility from "failure to gain a prize," and there is a robust philosophical defense for doing exactly that.
