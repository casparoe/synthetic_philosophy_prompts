      *   **Aaronson's Objection:** You can construct systems (expanders, Vandermonde matrices) with arbitrarily high $\Phi$ that perform trivial computations (linear maps, XOR gates). These systems lack functional complexity, memory, or behavior associated with consciousness.
      *   **Tononi's Reply:** If the cause-effect structure is integrated, the system *is* conscious, regardless of function or behavior. Our intuition that it isn't is biased by functionalism/behaviorism.
      *   **The Stakes:** Is IIT a physical theory subject to empirical falsification (where intuition acts as a proxy for observation), or is it a axiomatic derivation where intuition is unreliable (like QM)?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and relevant. *The Grid and the Ghost*, *Integration without Intention*, *The Vandermonde Verdict*. Let's go with something formal: *The Vandermonde Verdict: Why IIT's Bullet is a Reductio.*

      *   **Introduction:**
