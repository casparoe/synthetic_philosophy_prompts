          *   Set the stage: The Tononi-Aaronson clash.
          *   State the thesis clearly upfront (I need to choose a side). *Decision:* I will argue against IIT (side with Aaronson/critics). Why? Because the analogy to QM fails due to lack of independent empirical access.
          *   Outline the path: Examine the "theoretical courage" defense, then dismantle it using the epistemology of consciousness studies.

      *   **The Case for Theoretical Courage (Tononi's Best Defense):**
