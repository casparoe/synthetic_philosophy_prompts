answer: |-
  Your friend is essentially correct about Augustine's core position, though the nuance of how he handles the scriptural counter-examples is where the philosophical heavy lifting happens. Augustine is indeed an ethical absolutist regarding lying: for him, a lie (*mendacium*) is always a sin, regardless of consequences. However, he is not so rigid that he ignores the biblical text; rather, he constructs a sophisticated theological psychology to explain why God rewarded the *agents* without endorsing the *acts*.

  Here is a precise reconstruction of how Augustine handles the tension in *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying), specifically addressing the midwives, Rahab, and the distinction between lying and silence.

  ### 1. The Definition: Why Lying is Always Sinful
  To understand the resolution, we must first lock down Augustine's definition. For Augustine, the sin of lying is not located in the falsity of the statement (one can be mistaken without lying) nor primarily in the harm caused. It is located in the **will to deceive**.

  In *De Mendacio*, Augustine defines a lie as asserting something one believes to be false with the intention that the hearer believe it to be true. This is a disorder of the soul because language is a God-given faculty designed for the communication of thought. To use signs to communicate what is *not* in one's mind is to violate the natural order of signification. Therefore, the act is intrinsically disordered (*malum in se*). Because it is a disorder of the will, it cannot be justified by a good outcome.

  ### 2. The Scriptural Cases: Midwives and Rahab
  You are right to identify Exodus 1 (the Hebrew midwives) and Joshua 2/Hebrews 11 (Rahab) as the hardest tests for this view. Augustine addresses these directly, particularly in *Contra Mendacium* (written later in life to a man named Consentius who was pressing him on exactly this point).

  Augustine's strategy involves three distinct moves:

  **A. Admission of the Lie**
  Augustine does not engage in hermeneutical gymnastics to claim the midwives or Rahab didn't actually lie. He concedes they spoke falsehoods with the intent to deceive. He admits this was sinful. He refuses to say "God commanded it," because God cannot command a sin.

  **B. Separation of Merit from Act**
  This is the crux of his argument. Augustine argues that God rewarded the midwives and Rahab **not for their lie, but for their benevolence and faith.**
  *   **The Midwives:** They were rewarded for their mercy toward the infants and their piety toward God, which motivated them to protect the innocent. The lie was a concomitant sin attached to a meritorious act of charity. Augustine suggests that while they received earthly rewards (houses, lineage), the lie itself remained a stain on their soul that required purification.
  *   **Rahab:** In *Contra Mendacium*, Augustine notes that Hebrews 11 praises her *faith*, and James 2 praises her *works* (receiving the messengers), but neither text explicitly praises her *deceit*. Augustine insists we must distinguish the "fruit of faith" from the "chaff of falsehood."

  **C. The "Lesser Evil" vs. "Venial Sin" Distinction**
  Augustine classifies lies into eight grades in *De Mendacio*. Lies told to save a life (officious lies) are among the least grievous, but they are still sins. His handling of the midwives implies a distinction between **eternal damnation** and **temporal reward**. One can perform an act of great charity (saving a life) which merits reward, while simultaneously committing a venial sin (lying) which requires forgiveness.
  *   *Consistency Check:* You asked how this squares with the claim that sin lies in the deceptive intention. Augustine would argue the intention was **mixed**. The will to save the innocent is good (charity); the will to deceive is disordered. God rewards the charity; the disorder remains a defect in the agent that needs grace. He does not reward the deception; he overlooks it in light of the faith, or purges it later.

  ### 3. The "In Extremis" Case: Could They Have Done Otherwise?
  This is where your friend's point about "room for maneuver" becomes relevant. Augustine anticipates the objection: "If lying is always wrong, what *should* the midwives have done? Hand over the babies?"

  Augustine suggests two alternatives that avoid the sin of lying:

  **A. Silence or Evasion**
  Augustine distinguishes between *mendacium* (lying) and *dissimulatio* (hiding the truth). He argues one is not always obligated to reveal the truth to those who have no right to it.
  *   The midwives could have remained silent.
  *   They could have used ambiguous language (though Augustine is wary of this, he prefers it to outright falsehood).
  *   In *Contra Mendacium*, he suggests they could have said, "We do not know where they are," meaning "We do not know *in a way that we will tell you*," though he admits this borders on mental reservation, which he generally dislikes.

  **B. Martyrdom**
  Augustine's harder line is that if the only alternative to lying is handing over an innocent person to death, one should be prepared to suffer or even die oneself rather than sin. He acknowledges this is a high bar ("perfect" ethics), but maintains that committing a sin (lying) to prevent another's sin (murder) is not permissible. We are responsible for our own will, not the consequences we cannot control. If Pharaoh kills the babies because the midwives refused to lie, the blood is on Pharaoh's hands, not the midwives'. If the midwives lie to stop him, the sin of the lie is on their hands.

  ### 4. Is the Position Consistent?
  You asked whether Augustine's move is consistent with his claim that sinfulness is located in the deceptive intention.

  **The Tension:**
  If the sin is *entirely* in the intention to deceive, and the midwives *intended* to deceive, then they intended sin. How can God reward an agent who intentionally sins, even for a good cause?

  **Augustine's Resolution:**
  Augustine relies on a doctrine of **concurrent motives**. He posits that the midwives had two concurrent volitions:
  1.  *Voluntas benevolentiæ* (Will of benevolence): To save the life. (Good)
  2.  *Voluntas fallendi* (Will of deceiving): To mislead Pharaoh. (Bad)

  God rewards the first volition. The second volition remains a sin that is forgiven or purged, but not rewarded. Augustine essentially argues that the *goodness* of the agent does not sanctify the *act*, but the *merit* of the agent can exist alongside the *sinfulness* of the act.

  Critics (including many modern ethicists and some contemporaries like Jerome) find this unsatisfying. It seems to suggest a kind of "felix culpa" where the lie is a necessary stain on an otherwise heroic act. However, for Augustine, this preserves the absolute sanctity of Truth (which is God) without denying the reality of biblical history. To say the lie was "good" would make God the author of a contradiction (since God is Truth). To say the lie was "sinful but forgiven" preserves God's nature.

  ### 5. Summary for Your Argument
  To reconstruct this for your seminar group:

  1.  **Your friend is right:** Augustine holds an exceptionless prohibition. A lie to save a refugee is still a lie and still a sin.
  2.  **You are right about the tension:** Augustine struggles with the biblical examples. He does not deny they lied.
  3.  **The Synthesis:** Augustine resolves it by **disaggregating the reward from the act**.
      *   The Midwives/Rahab were rewarded for **faith/mercy**, not for **deception**.
      *   The deception remained a sin (a disorder of the will), potentially venial, but still requiring forgiveness.
      *   God rewards the *person* for their good will, not the *lie* for its utility.
  4.  **The "Maneuver":** Augustine does allow for **silence**. He argues the midwives *could* have refused to answer without lying. The fact that they didn't is a human failure, not a divine endorsement of lying.

  Augustine's position is ultimately that we are responsible for the purity of our own witness, not for the consequences that follow from telling the truth. If telling the truth leads to death, that is a tragedy permitted by God; if telling a lie prevents death, that is a sin committed by man. He prioritizes the ontological order (adherence to Truth/God) over the consequentialist order (preservation of biological life).

  This is likely why your argument got heated: Augustine's view demands a level of moral rigor that feels counter-intuitive to modern consequentialist ethics, yet his handling of the scripture is textually faithful, even if philosophically costly.
