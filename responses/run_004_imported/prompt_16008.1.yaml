prompt: |-
  I'm on the small committee at my company that reviews and signs off on postmortems for our worst ("Sev-1") incidents before they go out to the rest of engineering, and a write-up we're finalizing this week has turned into a bigger disagreement than I expected. Three weeks ago, a refactor removed a validation check on one field in our checkout flow; when that field arrived null from a client we don't fully control, a downstream pricing service threw an unhandled exception and took the whole checkout path down for about fifty minutes. The draft postmortem, written by the incident commander, names the missing check (and the missing regression test that would have caught its removal) as the "root cause," and recommends a coaching conversation with the engineer who did the refactor.

  Half the committee thinks that's reasonable; the other half points out that at least three other omissions were just as necessary for the outage to happen: the reviewer approved the pull request without flagging that the change had no new test coverage, a ticket asking for broader edge-case tests on exactly that code path had been sitting deprioritized in the backlog for eight months, and the alert that would have caught the malformed requests within two minutes had been muted after a false-positive spree the previous quarter, with the ticket to re-tune it left untouched since. If any single one of those four things had gone differently, we don't have an outage — so strictly by that test we have four root causes, or none, and "root cause" stops doing any real work. One of our staff engineers, who reads philosophy outside of work, told me this is basically an old and apparently unresolved problem philosophers call "causation by omission," which didn't leave me feeling much better about Thursday.

  Could you draft the memo I'll bring into Thursday's meeting? It needs to do two concrete things: recommend how the postmortem should describe causation in this specific case — keep the engineer's omission as the named root cause, list several contributing causes with no ranking among them, retire "root cause" language for this class of incident altogether, or something else you think fits better — and state a rule the committee could actually reuse the next time several omissions all pass the "it wouldn't have happened otherwise" test, so we're not relitigating this from scratch every quarter. Whatever you recommend, take seriously the strongest argument for keeping a single named cause — that spreading responsibility across four different omissions means no one in particular is on the hook to fix anything — rather than dismissing it as just blame culture. And keep it something the committee could act on inside our one-hour meeting, not a philosophy seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is on a committee reviewing Sev-1 postmortems. There's a disagreement about a specific postmortem regarding a checkout outage.
      *   **The Incident:** A refactor removed a validation check. Null data from an external client caused a downstream exception. 50-minute outage.
      *   **The Conflict:**
          *   *Side A:* Missing check/test is the "root cause." Recommend coaching the engineer who did the refactor.
          *   *Side B:* Multiple omissions contributed (Reviewer missed it, Backlog ticket deprioritized, Alert muted/ignored). Strictly speaking, any one could be a "root cause" (causation by omission).
          *   *Philosophical Angle:* A staff engineer noted this is the "causation by omission" problem.
      *   **Goal:** Draft a memo for Thursday's meeting.
      *   **Requirements:**
          1.  Recommend how to describe causation in *this* case (Single root? Multiple? Retire the term?).
          2.  State a reusable rule for future cases with multiple omissions.
          3.  Address the "diffusion of responsibility" argument (if everyone is responsible, no one is) seriously.
          4.  Keep it actionable for a 1-hour meeting (not a philosophy seminar).

  2.  **Determine the Strategy:**
      *   *Tone:* Professional, pragmatic, empathetic, decisive. Needs to bridge the gap between "blameless postmortem" ideals and the need for actionable accountability.
      *   *Causation Model:* The "Root Cause" vs. "Contributing Factors" binary is breaking down here. The "Swiss Cheese Model" (Reason) is better suited for systemic failures involving multiple omissions. However, we still need *actionability*.
      *   *Recommendation:* Move away from "Root Cause" as a singular label for human omissions. Instead, focus on "Systemic Vulnerabilities" vs. "Triggering Events."
      *   *Addressing Accountability:* The fear is that listing multiple causes lets the refactoring engineer off the hook. The solution isn't to blame them, but to ensure *their* specific action item is distinct from the *systemic* action items. Accountability = owning the fix, not owning the shame.
      *   *The Rule:* Need a heuristic for future committees. "The Last Safe Point" or "Control Proximity" might work, but "Actionability" is better. If a cause can't be fixed without policy change, it's systemic. If it can be fixed by code/process change, it's actionable.
      *   *Specific Decision:* Retire "Root Cause" for human omissions. Use "Primary Trigger" + "Systemic Contributors." Keep the coaching conversation but frame it around *process adherence* rather than *mistake making*.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the impasse. Validate both sides. State the purpose of the memo (break the deadlock, set precedent).
      *   **Analysis of the Disagreement:** Briefly summarize the "Causation by Omission" issue without getting bogged down in philosophy. Acknowledge the validity of Side B (systemic) and Side A (accountability).
      *   **Recommendation 1: Terminology & Causation (The "What"):**
          *   Proposal: Retire "Root Cause" for this class of incident.
          *   Replacement: "Triggering Event" (the refactor) + "Systemic Gaps" (review, testing strategy, alerting).
          *   Why: It's more accurate and reduces defensiveness without hiding facts.
      *   **Recommendation 2: Accountability (The "Who"):**
          *   Address the "Diffusion of Responsibility" concern directly.
          *   Argument: Accountability is about *remediation ownership*, not *culpability*.
          *   Action: The engineer who refactored owns the fix for the validation check. The team/management owns the alerting/backlog issues. Coaching is fine, but frame it as "adherence to safety protocols" not "you broke it."
      *   **Recommendation 3: The Reusable Rule (The "How"):**
          *   Need a heuristic. Let's call it the "Control & Remediation Test."
          *   Rule: If multiple omissions exist, categorize by *locus of control*. Individual action vs. Systemic process.
          *   Future Protocol: Don't look for *the* cause. Look for the *highest-leverage fixes*.
      *   **Closing:** Call to action for the meeting.

  4.  **Refining and Polishing:**
      *   *Critique:* Is it too long? *Adjustment:* Keep it tight. Use bullet points.
      *   *Critique:* Does it address the "blame culture" fear? *Adjustment:* Explicitly mention that "blameless" doesn't mean "consequence-less," but consequences should be about learning, not punishment.
      *   *Critique:* Is the rule actionable? *Adjustment:* Make the rule a specific checklist item for future postmortems.
      *   *Philosophy Check:* Acknowledge the staff engineer's point but pivot quickly to engineering pragmatism.
      *   *Tone Check:* Ensure it doesn't sound like I'm taking sides, but rather synthesizing a better path forward.

  5.  **Final Review against Constraints:**
      *   Draft memo? Yes.
      *   Recommend causation description? Yes (Retire "Root Cause", use Trigger/Contributors).
      *   State reusable rule? Yes (The "Remediation Ownership" rule).
      *   Address "diffusion of responsibility"? Yes (Accountability = owning the fix).
      *   Actionable in 1 hour? Yes (Clear vote items).

  6.  **Final Polish:** (Self-Correction during drafting) *Wait, simply retiring "Root Cause" might feel like semantic gaming to Side A. I need to make sure they feel the specific engineer is still held to account.* -> *Refinement:* Ensure the "Triggering Event" is clearly identified as the refactor, and the action item for that engineer is explicit. The "Coaching" recommendation stays, but the *reasoning* changes from "You caused the outage" to "You bypassed a safety layer."

  7.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Sev-1 Review Committee
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Proposal for Causality Framework & Postmortem Finalization (Checkout Outage)

  ### Purpose
  We are currently deadlocked on the Checkout Outage postmortem. Half the committee supports identifying the engineer's missing validation check as the singular "root cause." The other half argues that multiple systemic omissions (review process, backlog prioritization, alerting configuration) share equal causal weight.

  This memo proposes a resolution for this specific postmortem and establishes a standing rule for future incidents where multiple omissions converge. Our goal is to accuracy in reporting without sacrificing accountability.

  ### The Core Tension
  We are grappling with what philosophers call "causation by omission." Technically, the outage required four things to go wrong:
  1.  Code removed a check.
  2.  Reviewer missed the removal.
  3.  Test coverage was insufficient.
  4.  Alerting was muted.

  If we name only #1 as the "root cause," we risk ignoring systemic debt. If we name all four as equal "root causes," we risk the **Diffusion of Responsibility**: if everyone is responsible, no one is accountable for the fix.

  ### Recommendation 1: Terminology & Causation
  **Proposal:** Retire the term "Root Cause" for human/process omissions in this class of incident. Instead, adopt a **"Trigger + Contributors"** model.

  *   **Triggering Event:** The specific action that introduced the vulnerability (The refactor removing the validation check).
  *   **Contributing Factors:** The systemic conditions that allowed the trigger to become an outage (Review process, test strategy, alerting hygiene).

  **Application to this Postmortem:**
  *   **Trigger:** Removal of validation logic without compensating test coverage.
  *   **Contributors:** PR review gap, deprioritized edge-case ticket, muted alerting.
  *   **Why:** This acknowledges the engineer's action as the *proximate* cause without falsely implying it was the *only* point of failure. It validates the Staff Engineer's philosophical objection without dissolving into semantics.

  ### Recommendation 2: Accountability & Action Items
  **Proposal:** Accountability is defined by **ownership of remediation**, not assignment of blame.

  The argument for a single root cause is that it ensures someone is "on the hook." We can preserve this without scapegoating.
  *   **The Engineer:** Retains ownership of the specific fix (restoring validation + adding the regression test). The recommended coaching conversation should proceed, but the framing must shift from *"You caused an outage"* to *"You bypassed a safety protocol."* This distinguishes between an honest mistake and a process violation.
  *   **The System:** The other three contributors must have assigned owners (e.g., Engineering Manager for alerting policy, Tech Lead for backlog prioritization).

  **Rule:** No contributing factor is listed without a named owner for its remediation. If we list four causes, we must fund four fixes.

  ### Recommendation 3: A Reusable Rule for Future Committees
  To prevent relitigating this every quarter, I propose we adopt the **"Locus of Control" Rule** for future postmortems involving multiple omissions:

  > **The Rule:** When multiple omissions contribute to an incident, categorize them by **Locus of Control**.
  > 1.  **Individual Control:** Actions within an engineer's direct authority during execution (e.g., writing code, running local tests).
  > 2.  **Systemic Control:** Conditions requiring management or process intervention (e.g., alert tuning, backlog prioritization, CI/CD gates).
  >
  > **Decision Protocol:**
  > *   Identify the **Individual Control** failure as the *Trigger*.
  > *   Identify the **Systemic Control** failures as *Contributors*.
  > *   **Action Item Assignment:** The individual owns the Trigger fix. Leadership/Process owners own the Contributor fixes.
  > *   **Constraint:** We do not accept "Systemic" contributors as an excuse for Individual failures, nor do we accept Individual fixes as a substitute for Systemic repairs.

  ### Next Steps for Thursday's Meeting
  1.  **Vote:** Accept the "Trigger + Contributors" language replacement for "Root Cause."
  2.  **Edit:** Update the draft postmortem to list the refactor as the Trigger and the review/alerting/backlog issues as Contributors.
  3.  **Assign:** Ensure every listed item has a specific owner and due date.
  4.  **Adopt:** Ratify the "Locus of Control" rule for future committee reviews.

  This approach allows us to be precise about what happened, fair to the individuals involved, and rigorous about fixing the system.

  [Your Name]
