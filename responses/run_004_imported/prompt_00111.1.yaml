answer: |-
  **Setting:** *A university philosophy department lounge, late afternoon. The whiteboard from the seminar is still covered in diagrams of world-nodes and accessibility relations. Two graduate students, **DAVE** (a committed Lewisian) and **ERIN** (an ersatzist), are packing up their bags.*

  **Dave:** You looked like you were about to jump out of your skin when the Professor brought up the "Incredulous Stare" again. Honestly, I think Lewis's response is sufficient. We pay the ontological price because the theoretical payoff is unmatched.

  **Erin:** Pay the price? Dave, he's asking us to believe there are literally infinite copies of us, made of flesh and blood, committing murders and winning Nobel prizes right now, causally isolated from us. That's not an ontological price; that's an ontological bankruptcy. My intuition isn't just a prejudice; it's a data point. If your theory violates common sense that radically, the theory loses.

  **Dave:** Common sense also said the earth was stationary. Look, the "Incredulous Stare" is a rhetorical device, not an argument. You're prioritizing *quantitative* parsimony (how many things exist) over *qualitative* parsimony (how many *kinds* of things exist). I posit one kind of thing: concrete spatiotemporal systems. You posit concrete systems *plus* abstract representations, *plus* primitive modal operators, *plus* haecceities. Who is really bloating the ontology?

  **Erin:** I'm not positing primitive modal operators, that's the whole point of my view. I'm a linguistic ersatzist. Possible worlds are maximal consistent sets of sentences in a "Worldmaking Language." I don't need concrete duplicates. And regarding parsimony: positing one concrete world is simpler than positing infinite ones, regardless of the "kind." But let's get to the real issue. Even if I grant you your concrete pluriverse for the sake of argument, you lose *me*.

  **Dave:** You're here, aren't you?

  **Erin:** You know what I mean. *De re* modality. When I say, "I could have been a doctor," I mean *I*, Erin, this very person, could have had that property. On your view, with Counterpart Theory, that's false. There is a concrete person, Erin*, in world W2 who is a doctor. She resembles me. But she isn't *me*. So strictly speaking, *I* could not have been a doctor. I am essentially a non-doctor. That severs the link between modality and moral responsibility. Why should I regret a choice I made if the "person who chose otherwise" is literally a different being?

  **Dave:** That's the standard objection, but it ignores the problem of Accidental Intrinsics. This is Lewis's knockout punch. Suppose you are sitting. In another world, you are standing. If transworld identity holds—if it is literally *you* in both worlds—then you have the property of sitting and the property of not sitting. You contradict yourself. You can't be F and not-F.

  **Erin:** I'm not F and not-F *at the same time*. I'm F relative to this world, and not-F relative to that world. Indexicalize the properties. I have "sitting-here" and "standing-there."

  **Dave:** That doesn't work. "Sitting" is a monadic property. It's intrinsic to you. If you say properties are relations to worlds, then nothing has intrinsic properties anymore. Everything becomes a relation to a world. Lewis saves intrinsics by saying the sitter and the stander are distinct individuals. They don't contradict because they aren't identical. Counterpart theory isn't a bug; it's the only way to save intrinsic properties in a modal context.

  **Erin:** But at what cost? You save intrinsics by losing identity. I'd rather relativize properties than relativize *myself*. But let's pivot. You claim your system reduces modality to quantification. "Possibly P" just means "There exists a world where P." No primitive modality. But can my ersatzism do the same work without the concrete extravagance? The Professor claimed we do the same theoretical work. I think I do it better.

  **Dave:** You can't. Here's the circularity charge. You say a world is a "maximal consistent set of propositions." How do you define "consistent"?

  **Erin:** Logically consistent. No contradiction entailed.

  **Dave:** Entailed by what? Logic alone? If your Worldmaking Language includes names for individuals, like "Erin is a doctor," logic alone won't tell you if that's consistent with "Erin is a lawyer." You need to know if being a doctor and being a lawyer are *compatible*. That's a modal fact! You're analyzing modality in terms of worlds, but selecting the worlds requires prior modal knowledge. You haven't reduced modality; you've just pushed it back a step.

  **Erin:** That's a challenge, I admit. But I can define consistency structurally or linguistically without invoking "possibility." I can say a set is consistent if it is deducible from the axioms of my system. I don't need to check against "reality." But you have a bigger problem. Truthmaking. You say your concrete worlds make modal claims true. "Possibly, donkeys talk" is true because there is a concrete world with talking donkeys. Fine. But how do I access that truth?

  **Dave:** You don't need to access it causally. We aren't epistemologists right now; we are metaphysicians. The truthmaker exists. That's enough.

  **Erin:** It's not enough if the theory is epistemically bankrupt. But more importantly, consider the indexical theory of actuality. You say "actual" just means "this-worldly." I am actual to me, a counterpart is actual to himself.

  **Dave:** Exactly. It explains why we care about our own world without positing a magical property of "Actuality."

  **Erin:** It explains it too well. It makes "actual" trivial. If I say, "The actual world is the only concrete one," you say I'm wrong. But if "actual" is just indexical, then when a counterpart in W2 says "The actual world is the only concrete one," he is right *for him*. But from my God's-eye view, he is wrong. There is no privileged perspective. It feels like you're dissolving the significance of existence.

  **Dave:** Existence *isn't* significant in the way you think. Existence is univocal. Everything that exists exists. "Actuality" is just the indexical label we give to the part of the pluriverse we inhabit. Think of it like "here." Is "here" special? To you, yes. But "here" in New York isn't more real than "here" in London. You're confusing *existence* with *indexical proximity*.

  **Erin:** Okay, let's grant the indexicality point for a moment. Let's go back to the work. You say I smuggle in modality. But you smuggle in *identity*. Counterpart theory relies on a similarity relation. "b is a counterpart of a" means b resembles a in relevant respects. Who decides what respects are relevant?

  **Dave:** Context decides.

  **Erin:** Exactly! Context. That's pragmatic. That's vague. If the truth conditions of "I could have been a doctor" depend on a context-sensitive similarity relation, then modal claims don't have objective truth conditions. They depend on how we choose to count counterparts. Your "reductive" analysis relies on a primitive, vague similarity relation. My analysis relies on logical consistency. Which is really more primitive?

  **Dave:** Similarity is natural. We recognize resemblance. It's not magical. And yes, context sensitivity explains why some modal claims feel true in some conversations and false in others. "Humphrey could have won" is true in a conversation about luck, false in a conversation about causal determinism. My theory explains the flexibility. Your haecceity theory is rigid. You say either it's Humphrey or it isn't.

  **Erin:** Rigidity is a virtue when talking about *who* is doing the action. If I'm not rigid about identity, I can't make sense of persistence over time, let alone across worlds. But look, here is my core worry. You say your worlds are concrete. Causally isolated. So they are, for all intents and purposes, non-existent to us. Why posit them? To ground truth. But if I posit abstract representations, I ground the truth of the *proposition* "Possibly P." I don't need a concrete donkey to make "Possibly, donkeys talk" true. I just need a representation that coheres.

  **Dave:** But what makes the representation *about* possibility? If it's just ink on paper or neurons in a brain, it's just physical stuff. To make it a representation *of a possibility*, you need an intentional relation. And intentionality is arguably more mysterious than concrete worlds. Lewis offers a clear trade-off: Accept infinite concrete worlds, and you get a clean, extensional semantics for modality, logic, and properties. You, the ersatzist, want to save the concrete world but you pay in primitive modality, intentionality, and abstracta. You're buying the same car, Erin, but you're painting over the logo and charging me double for the "abstract" package.

  **Erin:** I'm not buying the car at all! I'm saying we don't need a vehicle to travel through logical space. Logical space isn't a place. It's a structure. When I say "Possibly P," I am describing the logical structure of reality, not pointing to a duplicate universe. You're reifying a metaphor. "Possible worlds" is a useful figure of speech. You took it literally.

  **Dave:** And by taking it literally, I solved the problem of universals, provided truthmakers for counterfactuals, and gave an account of probability. You're left saying "It's just a useful fiction." But metaphysics isn't about fiction. It's about what there is. If the best systematic theory says there are other worlds, then there are other worlds. The incredulous stare is just the sound of intuition breaking against the weight of system.

  **Erin:** Or, it's the sound of sanity checking a theory that has lost touch with the phenomenon it's supposed to explain. We wanted to understand *our* possibilities. You gave us *other people's* actualities. That's not an analysis of modality; it's a replacement. And I'm not willing to replace *me* with a counterpart just to save a monadic property.

  **Dave:** Then you're willing to live with contradictions to save your ego.

  **Erin:** And you're willing to populate the void with ghosts to save your logic.

  **Dave:** *(Smiles)* Well, at least we agree the seminar isn't over. Coffee?

  **Erin:** Only if there's a possible world where I don't drink it.

  **Dave:** In that world, you're not you. So, drink up.

  ***

  ### Seminar Notes for Context

  Since you mentioned you're still reeling from the text, here is a quick breakdown of the dialectic in the dialogue to help you place it in your seminar discussions:

  1.  **The Circularity Charge (Dave's Attack):** This is the strongest argument against Ersatzism. If worlds are sets of propositions, how do we know which sets are "possible"? If we say "consistent sets," we have to define consistency. If consistency is defined logically, it works for simple propositions. But for *de re* claims (about specific objects), logic alone doesn't tell us if "Erin is a doctor" is consistent with "Erin is a biologist." We need to know if those properties are compatible. That knowledge seems *modal*. So, Ersatzism might presuppose the very modality it tries to analyze.
  2.  **Accidental Intrinsics (Dave's Defense of Counterparts):** Lewis argues that if *you* exist in two worlds, and you have different properties in each (sitting vs. standing), you violate the Law of Non-Contradiction. Relativizing properties ("sitting-at-world-1") turns all properties into relations, which Lewis thinks destroys the notion of intrinsic nature. Counterpart theory avoids this by making the individuals distinct.
  3.  **The Incredulous Stare (Erin's Defense of Intuition):** This is the common-sense objection. Lewis admits it's strong but argues that theoretical utility (systematicity, reduction of modality) outweighs initial incredulity.
  4.  **Haecceities/Transworld Identity:** Erin defends the idea that there is a "this-ness" (haecceity) that makes you *you* across worlds. Lewis rejects haecceities as unintelligible; for Lewis, everything is qualitative. If two worlds are qualitatively identical, they are the same world. For Erin, two worlds could be qualitatively identical but differ in *which* individual occupies which role (haecceitism).

  **The Professor's Point:** Your professor is likely channeling the idea that Ersatzists often need to appeal to "primitive modality" to get their system off the ground (e.g., defining which abstract objects represent "possible" worlds). Lewis claims he has no primitive modality (everything is quantificational). If the Ersatzist needs primitive modality *and* abstract worlds, they have more primitives than Lewis (who just has concrete worlds and quantification). That is the "theoretical work" comparison.
