      *   *Spence's Job Market Signaling:* Education is costly (time/effort). It signals ability to employers.
      *   *The Wedding Application:* Rings, flowers, venues are "wasteful." Why? To prove commitment. "I am willing to burn resources for you."
      *   *The Emory Wrinkle (Francis-Tan & Mialon, 2015):* "A Diamond is Forever" study. Found negative correlation between spending and marriage duration.
      *   *Resolving the Wrinkle:* Handicap theory requires the *signaler* to bear the cost. If parents pay, or if debt is incurred (signaling financial irresponsibility), the signal is noisy or dishonest. Also, the signal is for *each other*, not the guests. If the wedding is for the guests (social pressure), it's not a honest signal of dyadic commitment.

  3.  **Drafting - Section by Section:**

