answer: |-
  *(Tap the glass gently. Wait for the room to settle. Hold the mic close, but keep your posture relaxed—like you're leading a seminar, but a fun one.)*

  Good evening. For those who don't know me, I'm [Your Name]. I had the privilege of being Priya's PhD advisor. That means I've read every draft she wrote for seven years, usually at 2:00 AM, usually about why animals do seemingly irrational things.

  So, when Priya asked me to speak, I knew I couldn't just talk about how kind she is, or how brilliant. I had to talk about the work. Because honestly, that's how she and [Groom's Name] fell in love. They met presenting back-to-back at a workshop. One talked about the theory, the other about the data. It's the most romantic origin story I know: a separating equilibrium found its match.

  Now, for the family members here—don't worry, I'm keeping the jargon to a minimum. But to understand this marriage, you have to understand one idea that defined Priya's career. It's called the Handicap Principle.

  It was proposed by a biologist named Amotz Zahavi. He wanted to know: why does a peacock have such a ridiculous tail? It's heavy. It catches on bushes. It screams to predators, "Eat me!" It seems evolutionarily stupid.

  Zahavi argued it's stupid *on purpose*.

  In nature, talk is cheap. Any bird can chirp, "I'm strong! I'm healthy!" But if the signal costs nothing, a weak bird can lie. So, to make the signal honest, it has to be wasteful. It has to be a handicap. The peacock is saying, "I am so fit, I can survive *even with this massive burden*." The cost is the point. Without the waste, there is no trust.

  Humans do this, too. Why buy a diamond ring? A diamond is just carbon. It doesn't keep you warm. It doesn't feed you. But that's exactly why you buy it. You are burning resources to say, "I am willing to sacrifice for this partnership." It's a signal of commitment.

  Now, Priya and [Groom's Name] know this literature better than anyone. So you'd expect their wedding to be the ultimate honest signal. But there's a wrinkle.

  About ten years ago, economists at Emory University published a paper that should terrify every couple here. They analyzed thousands of marriages and found that, statistically, the more money you spend on the wedding and the ring, the *sooner* you tend to divorce.

  *(Pause for the nervous laughter)*

  It's the exact opposite of the Handicap Principle. If spending proves commitment, why does higher spending predict failure?

  I thought about this a lot. Because I couldn't stand up here and celebrate a theory that predicts their divorce. And I think the answer lies in the details of the signal.

  In signaling theory, for a handicap to be honest, two things must be true. One: the cost must be borne by the *signaler*. And two: the signal must be for the *receiver*, not the audience.

  The Emory study suggests that when couples spend beyond their means, they aren't signaling commitment; they're signaling financial instability. Debt isn't a handicap; it's a liability. And often, big weddings aren't paid for by the couple. They're paid for by parents. If your parents are bearing the cost, *they* are the ones signaling their status to *their* friends. That's not a marriage signal; that's a status signal. It's noise.

  So, how do Priya and [Groom's Name] beat the odds?

  Because they know that the real cost of marriage isn't the flowers, which will be dead by Tuesday. It isn't the venue, which you'll leave tonight.

  The real handicap is the daily work. It's the time, the patience, the compromise. It's the willingness to carry a burden for someone else, even when it's inconvenient. That is a cost that cannot be faked. You can't borrow money to pay for patience. You can't ask your parents to compromise for you.

  Priya and [Groom's Name] aren't signaling to us. We're just the audience. They are signaling to each other. And they know that the only "wasteful" expenditure that matters is the investment of themselves, day after day, even when it's hard.

  They have built a model that accounts for the noise. They know the literature, they know the risks, and they know that the only equilibrium that holds is the one where the cost is shared, and the benefit is mutual.

  So, if you'll raise your glasses.

  To Priya and [Groom's Name]. May your signals always be honest, your costs be shared, and may your partnership be the one exception that rewrites the data.

  Cheers.
