      *   **Core Theme:** The Handicap Principle (Zahavi/Grafen/Spence) applied to marriage/weddings. Extravagance as a signal of commitment.
      *   **The "Wrinkle":** An Emory econ paper (Francis-Tan & Mialon, 2015) suggests higher wedding/ring spending correlates with *higher* divorce rates (contradicting simple handicap theory).
      *   **Requirement:** The theory must do *work*, not just be a joke. It must address the wrinkle substantively (who is the signal for? who pays?). It must be warm, specific, and conversational (5 mins spoken, open bar setting).
