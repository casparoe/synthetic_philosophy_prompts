answer: |-
  This is a fascinating case, and it is excellent that you are pressing on the tension between your friend's intuitive reasoning and the formal constraints of standard decision theory. To give you the short answer first: **Your friend has intuitively recreated the Allais Paradox.**

  Her choices violate the **Independence Axiom** of Expected Utility Theory (EUT). Under the standard von Neumann-Morgenstern (VNM) framework, her behavior is formally inconsistent. However, whether this amounts to a "failure of rationality" depends entirely on whether one accepts VNM-EUT as the sole normative standard for rational choice.

  Given your background, I will skip the basic definitions and move straight to the structural analysis, the specific violation, and how alternative frameworks (specifically Risk-Weighted Expected Utility and Prospect Theory) diagnose this behavior.

  ### 1. The Formal Inconsistency (VNM-EUT Diagnosis)

  Let $u(x)$ be the utility of monetary outcome $x$, normalized such that $u(0) = 0$.

  **Case 1 (Injury):**
  *   **Option A (Sure):** $60,000$ with probability $1.0$.
  *   **Option B (Gamble):** $300,000$ ($0.12$), $60,000$ ($0.83$), $0$ ($0.05$).
  *   **Choice:** A $\succ$ B.
  *   **Inequality:** $u(60k) > 0.12u(300k) + 0.83u(60k) + 0.05u(0)$
      *   Simplifying (subtract $0.83u(60k)$ from both sides):
      *   $0.17u(60k) > 0.12u(300k)$
      *   **$u(60k) > \frac{12}{17}u(300k) \approx 0.706u(300k)$**

  **Case 2 (Overtime):**
  *   **Option C (Statute 1):** $60,000$ ($0.17$), $0$ ($0.83$).
  *   **Option D (Statute 2):** $300,000$ ($0.12$), $0$ ($0.88$).
  *   **Choice:** D $\succ$ C.
  *   **Inequality:** $0.12u(300k) + 0.88u(0) > 0.17u(60k) + 0.83u(0)$
      *   Simplifying:
      *   **$0.12u(300k) > 0.17u(60k)$**
      *   **$u(60k) < \frac{12}{17}u(300k) \approx 0.706u(300k)$**

  **The Verdict:** These inequalities are contradictory. There is no single utility function over outcomes that satisfies both preferences. Under standard EUT, your friend is **irrational** (specifically, she is vulnerable to a Dutch Book if these choices are presented as part of a larger portfolio, though single-shot Dutch Booking is contentious).

  ### 2. The Psychological Mechanism: The Allais Paradox

  Your friend's justification—"I couldn't stand giving up a sure thing... whereas once nothing was already the overwhelmingly likely outcome anyway, I might as well swing for the bigger prize"—is the canonical verbal report for the **Common Consequence Effect**.

  In Case 1, the presence of the "common consequence" (the 83% chance of $60k in Option B) interacts with the certainty of Option A to trigger a **Certainty Effect**. Humans (and many animals) tend to overweight outcomes that are considered certain relative to outcomes that are merely probable. The drop from 100% to 83% feels psychologically much larger than the drop from 17% to 12%, even though the arithmetic difference is identical.

  In Case 2, the certainty is removed. Both options are mostly likely to yield nothing. In this "domain of loss" (relative to the hope of winning), risk aversion often flips to risk-seeking behavior (the **Reflection Effect**), or at least the premium for certainty vanishes, allowing the higher magnitude to dominate the decision.

  ### 3. Alternative Frameworks

  If you want to defend your friend's rationality, you need to move beyond VNM-EUT. Here is how the major alternative frameworks handle this.

  #### A. Prospect Theory (Kahneman & Tversky)
  *   **Diagnosis:** Descriptive Success, Normative Ambiguity.
  *   **Mechanism:** Prospect Theory replaces objective probabilities $p$ with decision weights $\pi(p)$. The weighting function is typically inverse-S shaped: it overweights small probabilities and underweights moderate to high probabilities, with a discontinuity at $p=1$ (certainty).
  *   **Application:** In Case 1, the weight $\pi(1.0)$ is disproportionately high compared to $\pi(0.83) + \pi(0.12)$. In Case 2, both probabilities (0.17 and 0.12) are in the region where they might be overweighted, but the value function's curvature for gains dominates.
  *   **Rationality Status:** Usually treated as a model of *bias*. It explains why she *did* it, but standard behavioral economics often prescribes EUT as the normative ideal she *should* have followed.

  #### B. Regret Theory (Loomes & Sugden)
  *   **Diagnosis:** Rationalizable.
  *   **Mechanism:** Utility depends not just on the outcome obtained, but on the outcome that *would have been* obtained had the other option been chosen.
  *   **Application:** In Case 1, if she chooses the gamble and gets $0, she experiences massive regret because she "threw away" a guaranteed $60k. In Case 2, if she chooses the $300k option and gets $0, she feels less regret because the alternative ($60k option) also likely yielded $0.
  *   **Rationality Status:** If one accepts that regret is a genuine bad to be minimized, her choices are coherent.

  #### C. Risk-Weighted Expected Utility (Lara Buchak)
  *   **Diagnosis:** **Normatively Rational.**
  *   **Mechanism:** This is likely the most relevant framework for your philosophical interests. In *Risk and Rationality* (2013), Buchak argues that EUT conflates risk attitude with utility curvature. She introduces a risk function $r(p)$ that allows agents to weight probabilities non-linearly based on their global attitude toward risk (e.g., security-mindedness), independent of the utility of the outcomes.
  *   **The REU Formula:** $REU = \sum r(P(outcome \geq x_i)) \cdot [u(x_i) - u(x_{i-1})]$
  *   **Application:** A "security-minded" agent (your friend) uses a risk function $r(p) < p$ for probabilities of good outcomes. She cares about the *structure* of the gamble.
      *   In Case 1, the security of the 100% chance is weighted heavily by the risk function.
      *   In Case 2, since neither option offers security, the risk function applies differently, and the higher potential utility of the $300k outweighs the slightly lower probability.
  *   **Rationality Status:** Buchak explicitly argues that violating the Independence Axiom is **not** a failure of rationality. It is a reflection of a legitimate preference for global properties of gambles (like "avoiding the possibility of disappointment when a sure thing was available").

  ### 4. A "State-Dependent" Defense (Saving EUT)

  There is one way to save standard EUT without adopting REU or Prospect Theory, though it requires a specific assumption about your friend's context.

  If the **utility of money** is not constant across the two cases, EUT is not violated.
  *   **Case 1 (Injury):** The $60k might be needed for medical security or stability. The marginal utility of the first $60k is extremely high; the marginal utility of the *extra* $240k is low compared to the risk of losing the base $60k.
  *   **Case 2 (Overtime):** This is "bonus" money. The utility function is effectively linear or risk-neutral because her baseline security isn't threatened.
  *   **Verdict:** If $u_{injury}(60k)$ is high relative to $u_{injury}(300k)$, but $u_{overtime}(60k)$ is low relative to $u_{overtime}(300k)$, the choices are consistent.
  *   **Critique:** Your friend explicitly denied this ("she wasn't assigning different worth to money across the two cases"). She attributed the difference to the *risk structure* (sure thing vs. long shot), not the *use of funds*. If we take her introspection seriously, the State-Dependent Utility defense fails, and we must look to REU or Regret.

  ### 5. Recommendation for Your Cohort

  When you return to coffee with your cohort, I suggest framing the discussion around **Lara Buchak's REU framework**.

  1.  **Acknowledge the Violation:** Concede that under VNM-EUT, she is irrational. This shows you respect the formalism.
  2.  **Challenge the Norm:** Ask the cohort *why* the Independence Axiom is normative. Is it because it prevents Dutch Books? (Buchak argues risk-averse agents can avoid Dutch Books if their risk attitude is stable). Is it because it ensures coherence? (Buchak argues coherence includes sensitivity to risk structures).
  3.  **The "Sure Thing" Intuition:** Highlight that your friend's reasoning tracks a distinction that EUT erases: the distinction between *risk* and *uncertainty about risk*, or more simply, the special psychological and normative weight of **certainty**.
  4.  **Conclusion:** Her choices are not a "failure of rationality" unless one dogmatically insists that rationality requires linearity in probability. If rationality involves responding appropriately to the *nature* of the risk (e.g., the difference between a guarantee and a likelihood), her behavior is principled.

  **Summary:** Your friend is an Allais-type decision-maker. Standard theory calls her irrational; modern decision theory (specifically REU) calls her risk-sensitive. Given that she is navigating a legal system where "getting nothing" has catastrophic variance, her security-mindedness in Case 1 and her "nothing to lose" attitude in Case 2 seem pragmatically, if not classically, rational.
