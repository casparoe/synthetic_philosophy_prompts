answer: |-
  Friends, family, students.

  For those of you who knew [Teacher's Name] only as a daughter, a sister, or a friend, I want to begin by acknowledging the weight in this room. Grief is heavy. It is physical. It sits in the chest and makes the air thin. For those of us who studied with her, there is an added layer of complexity. She spent years training us to see through the solidity of things, including the self, including death. And now that she is gone, we find ourselves reaching for the very handholds she taught us to release.

  I know what many of you are hoping to hear. You want to be told that she is at peace, that she is watching over us, or perhaps, for the more philosophically inclined among us, that she has simply ceased, like a flame blown out. But [Teacher's Name] was too rigorous for easy comfort, and too kind to offer us lies.

  Three weeks ago, in our last seminar, we sat with her over the twenty-fifth chapter of Nāgārjuna's *Root Verses*. We were reading the verses on the Tathāgata after death. Does he exist? No. Does he not exist? No. Both? Neither? She guided us through the logic, showing how every single option collapses under scrutiny. She was insistent: "Neither" is not a safe hiding place. It is not a mystical fog where we can rest. It is a tool to break our fixation on "is" and "is not."

  And now, we are living inside that very question. Where is she?

  If I tell you she exists, I ignore the silence in her classroom. If I tell you she does not exist, I betray the love that fills this room. If I say both, or neither, I am playing word games while her mother sits in the front row, missing her daughter.

  So, how do we honor her view without turning her death into a logic puzzle? And how do we honor her humanity without pretending she is somewhere she is not?

  We do it by using the distinction she loved best: the Two Truths.

  There is the conventional truth, the truth of our daily lives. In this truth, [Teacher's Name] is gone. She was born, she taught, she suffered, she died. Her mother's grief is real. Our absence of her is real. To deny this would be spiritual bypassing, and she would have been the first to correct us. In the conventional world, cause and effect hold. Kindness matters. Loss hurts. We do not pretend the pain is an illusion.

  But there is also the ultimate truth. This is not a place far away; it is the nature of this very room. In this truth, there is no fixed "her" that went anywhere, and no fixed "us" that were left behind. Things do not exist on their own; they exist in dependence on everything else. She existed in dependence on her students, her mother, her enemies, her books, this city.

  When a wave falls back into the ocean, we do not say the wave has gone to a specific location, nor do we say it has been annihilated. The form has changed, but the water remains. This is not a metaphor for an afterlife. It is a description of reality. She is not *somewhere else*. She is *otherwise*.

  This brings us to the point she was making in those final weeks, the point that must serve as our comfort now: *Saṃsāra and Nirvāṇa are not distinct.*

  Usually, we think of Nirvāṇa as a destination we reach after we finish suffering. We think of this moment, with its grief and its tears, as Saṃsāra—the cycle of pain we want to escape. But Nāgārjuna argues that there is no difference between the two. The liberation is not found by leaving this grief behind. It is found by seeing the nature of the grief itself.

  If [Teacher's Name] were here, she would tell us that this ache we feel is empty. That does not mean it isn't painful. It means it is not solid. It is not a wall that separates us from her forever. Because it is empty, it can change. Because it is dependent, it connects us.

  When you feel the sharp sting of her absence, that is not a failure of practice. That is the Dharma. The love you feel for her *is* her continuing presence. Not as a ghost, not as a memory, but as an active force. The way she changed how you listen, the way she sharpened your mind, the way she softened your heart—those are not traces she left behind. They are her activity, happening now, through you.

  To her mother, and to those who do not speak the language of philosophy: I know this sounds abstract. But look at it this way. You raised a woman who understood that nothing stands alone. She knew she was made of her mother's care, her teachers' wisdom, and her friends' loyalty. Because she was made of those things, she cannot simply vanish. As long as those things exist, she exists. Her life was not a solitary line that ended at a period. It was a web, and we are all still holding the strands.

  We are not here to solve the riddle of where she went. Nāgārjuna showed us that the riddle itself is the trap. We are here to acknowledge that the question "Where is she?" arises only because we are looking for a thing that can be located. But love is not a thing. Wisdom is not a thing. They are events. They are happenings.

  She is happening right now, in the way we sit together. She is happening in the rigor with which we treat the truth, and the tenderness with which we treat each other.

  So, we will not say she exists. We will not say she does not. We will not rest in the vague comfort of "neither." Instead, we will rest in the openness that those negations create. We will let the uncertainty be wide enough to hold our grief.

  In the end, she taught us that the only thing more important than being right is being awake. To be awake now is to feel the loss fully, without hardening against it. It is to see that this memorial, this grief, this silence—it is not an obstacle to the path. It is the path.

  There is no difference between this room and the peace we seek. There is no difference between this sorrow and the wisdom she taught. If we can sit with that, without trying to fix it, without trying to solve it, then we are studying with her still.

  Thank you.
