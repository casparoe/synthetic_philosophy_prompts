answer: |-
  The silver coin sat on the white tablecloth, catching the light of the chandelier. Julian, their host, rested a hand on it, his smile sharp enough to cut glass.

  "The terms are simple," Julian said. "I back you both. Same stake. We flip repeatedly. Heads, your risked capital grows sixty percent. Tails, it shrinks fifty. You decide the fraction of your current stack to risk before each flip. Write your strategy down now."

  Priya didn't look at the coin. She looked at Dana. "It's positive expected value every round. Arithmetic mean return is five percent per flip if you bet the whole pile. Any risk model that says otherwise is ignoring the upside."

  "It's ignoring the ruin," Dana said, her voice quiet but carrying over the clink of silverware. "If you bet everything, Priya, your arithmetic expectation is positive, but your geometric growth rate is negative. One point six times zero point five is zero point eight. Every heads-tails pair shrinks your wealth by twenty percent. You'll be ruined almost surely."

  "Almost surely implies infinity," Priya countered, picking up her pen. "Von Neumann–Morgenstern rationality doesn't demand you maximize growth rate. It demands consistency in preferences. If I choose a utility function that values short-term arithmetic gains because I might withdraw capital in five years, that's rational. Log utility isn't the law of physics, Dana. It's just a specific preference for risk aversion. You're dressing up your temperament as math."

  "It's not temperament," Dana said, leaning forward. "It's ergodicity. When you calculate expected value, you're averaging across a population of counterfactual versions of yourself. In one universe, you win big; in another, you go bust. But you don't live in an ensemble of universes. You live in one timeline. The only average that describes what happens to *you* is the time-average growth rate. If the system is non-ergodic—which compounding wealth is—then the ensemble average is a lie. It tells you what happens to the multiverse, not the gambler."

  "And if the gambler doesn't plan to play forever?" Priya shot back. "You're assuming an infinite horizon. But a real trader has a finite career, finite carry, finite patience. If I bet big and get lucky early, I can walk away before the law of large numbers crushes me. The 'time-average' only dominates if you never leave the table. Choosing a horizon isn't a mathematical mistake; it's a business decision."

  "A business decision that ignores the topology of the state space," Dana said. "You think you can walk away, but the risk of ruin is embedded in the path. Even with a finite horizon, betting full size maximizes the probability of significant drawdown. You're relying on luck to exit before the multiplicative drag catches you. That's not trading; that's Russian roulette with a favorable expected value."

  "Real trading isn't one coin," Priya said, tapping the table. "It's a portfolio. I'm not facing a single repeated bet. I'm facing thousands of imperfectly correlated exposures. Variance-based reasoning handles this. Diversification reduces the volatility of the path without sacrificing the expected return. I don't need Kelly sizing to survive; I need uncorrelated risks. Your geometric rationality works for a single asset in isolation. It breaks down when you have a book."

  Dana shook her head, a faint smile touching her lips. "That's the oldest illusion in finance. Correlations are stable until they aren't. In a crisis, all assets converge. Your 'diversified' portfolio becomes a single bet on liquidity. When the system is stressed, the ensemble collapses back into a single trajectory. Ergodicity breaking doesn't disappear because you buy more tickets; it just hides until the moment you can't afford to lose. Diversification is just spatial ergodicity pretending to be safety. But time still flows one way."

  "And your 'one way' assumes you can't adjust," Priya said. "Dynamic hedging, stop-losses, capital calls. We aren't passive particles. We manage the path. If I see drawdown, I de-risk. I don't need to pre-commit to a fractional Kelly strategy because I have agency over the exposure throughout the trade. Your model assumes static sizing in a dynamic world."

  "Agency doesn't change the multiplicative nature of wealth," Dana said. "Every time you reopen the position, you face the same geometric drag. You're arguing that you can outsmart the compounding formula with timing. Maybe you can. But most who try don't. The Kelly criterion isn't about maximizing wealth; it's about maximizing the probability of survival while growing. It's the only strategy that doesn't require you to assume you're smarter than the distribution."

  "I assume I'm paid to be smarter than the distribution," Priya said, finishing her note. "Utility functions are tools. I choose mine based on my liabilities, not some abstract ideal of infinite growth. If my partners want returns now, I give them returns now. I don't tell them I'm saving them from ruin in a universe they won't live to see."

  "And when the ruin arrives in this universe?" Dana asked, writing her own fraction. "When the path dependency bites?"

  "Then I'll have made enough in the meantime to buy a new seat," Priya said.

  Julian picked up the coin. "Strategies?"

  "Full exposure," Priya said. "I'll manage the exit."

  "Sixteen percent," Dana said. "Fixed."

  Julian flipped the coin. It spun, silver and blurred, hanging in the air between them. Neither woman watched it fall. They were watching each other, measuring the decade of silence in the space of a bet.
