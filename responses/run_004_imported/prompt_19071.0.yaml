answer: |-
  Thank you all for being here.

  For those of you who know me, you know I'm a physicist. I spent forty years studying how things change: how heat flows, how order turns to disorder, how the future becomes the past. And for those of you who knew Miriam as a scholar, you know she spent those same forty years studying stories. Specifically, the stories we tell ourselves to make sense of being alive.

  For thirty years, our dinner table was a battlefield. On one side, me, arguing for the Thermodynamic Arrow of Time. Entropy increases. Eggs break and don't unbreak. Time is real, I'd say, because loss is irreversible.

  On the other side sat Miriam, with her copy of Borges. Specifically, his essay "A New Refutation of Time."

  For my children and grandchildren, and my physicist friends who haven't read it: Borges constructs a beautiful logical trap. He argues that if the "self" is just a bundle of fleeting perceptions, and matter is just an idea in the mind, then there is no solid thing for time to act upon. If there is no "you" that endures from one second to the next, then time cannot pass. It's a dazzling argument. It suggests that death, separation, and loss are essentially illusions.

  I used to tell Miriam that physics settled the question. Entropy doesn't care about your logic; the coffee gets cold.

  But Miriam would just turn to the last page of the essay. She'd read the ending aloud, where Borges, after all that brilliant logic, admits defeat. He writes that despite his proof, he still feels the weight of being himself. He still sees the tiger and the river. He concludes that the world is, in his words, "unfortunately real."

  Miriam told me once, "He doesn't fail at the end, David. He succeeds. That paragraph is the only honest thing he ever wrote."

  I didn't understand what she meant until two weeks ago.

  It would be easy to stand here and use Borges's logic to comfort you. To say that because time is an illusion, Miriam isn't truly gone. That in some eternal bundle of perceptions, she is still here.

  But Miriam would have seen through that in two seconds flat. And she would have been angry. Because that is exactly the move her favorite essay refuses to let you get away with. To deny the reality of her absence is to deny the reality of her life.

  Borges was right the second time. The world is unfortunately real. The pain we feel in this room is not a glitch in our perception. It is data. It is evidence.

  As a physicist, I have spent a lifetime measuring the arrow of time by the things we lose. But as Miriam's husband, I have learned that we measure it by what we keep.

  The fact that it hurts this much proves that something real happened between us. If time were truly a refutation, if we were just ghosts passing through a dream, this grief would have no anchor. But it does. It anchors us to the thirty years of arguments, the laughter, the quiet mornings, and the hard nights. It anchors us to the woman who taught us that honesty is harder, and more important, than consistency.

  To her colleagues in the literature department: You know the text. You know the argument collapses. But today, we are the collapse. We are the proof that the tiger is real, and the river flows one way.

  To my family, and to the students she loved: Do not let anyone tell you that grief is something to be reasoned away. Do not let anyone tell you that she isn't really gone. She is. And because she is, the love we have for her is the only thing strong enough to withstand the entropy of this universe.

  Miriam taught me that the "unfortunately real" world is also the *preciously* real world. Time is real because it runs out. Love is real because it endures the running out.

  I still believe in entropy. I still believe the coffee gets cold. But I also believe that for thirty years, Miriam kept it warm. And that, against all the laws of physics and all the refutations of time, is a miracle that remains.

  Rest well, Miriam. The argument is over. You were right. It is real. And so are we.
