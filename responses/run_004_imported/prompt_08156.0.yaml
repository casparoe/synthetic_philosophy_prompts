          *   Marx's *Fragment on Machines* (Grundrisse) is the best textual anchor. Knowledge becomes a free social force, but Capital captures it.
          *   The "Burnout" is the friction between the logic of the Commons (sharing) and the logic of Capital (accumulation).

      *   **Part 4: Final Verdict/Conclusion:**
