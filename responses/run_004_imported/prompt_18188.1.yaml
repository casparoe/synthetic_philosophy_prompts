      *   Address the user's situation? Yes (in the subtext and conclusion).

  *(Self-Correction Note)*: I need to make sure I don't validate the user's $3k spend as "rational." Even if game theory *can* model it as rational, in a residential context with no future leverage, it's almost certainly a loss. The dialogue should reflect that nuance. Marcus should argue the *logic*, Elena should argue the *reality*.

