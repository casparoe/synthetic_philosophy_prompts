answer: |-
  This is a classic friendship dilemma that sits right at the intersection of ethics, psychology, and care. You acted out of protection; she is reacting out of a desire for autonomy. Both of you have valid points, but context matters immensely here.

  Here is a breakdown of the philosophical argument, the reality of intoxication, and how to handle the friendship fallout.

  ### 1. The Philosophical Argument: Sober vs. Drunk Self
  Your friend's argument is actually a well-known philosophical concept. It touches on the idea of **"continuity of self."** She is arguing that her drunk self is still *her*, and that suppressing the drunk self is a form of paternalism where the "sober self" acts like a parent to the "child self."

  She says alcohol didn't distort her feelings, it just removed the filter. There is truth to this: **The feelings were real.** The pain of the breakup, the longing, the anger—those weren't manufactured by the alcohol.

  **However, here is the counter-argument you can use:**
  Alcohol doesn't just remove filters; it **disproportionately amplifies impulse over consequence.**
  *   **Sober You** operates with executive function: It weighs immediate desires against long-term goals (e.g., "I want to talk to him" vs. "I want to heal and maintain my dignity").
  *   **Drunk You** operates with immediate emotional relief: It seeks to resolve the pain *now*, regardless of the cost *later*.

  Society privileges the sober self not because it's "more moral," but because it is the only version of us capable of **strategic planning.** If we let the "drunk self" drive the car, we crash. If we let the "drunk self" send the text, we often sabotage our healing. You didn't overrule her *feelings*; you overruled her *impulse control*, which was chemically compromised.

  ### 2. Was You Intervention Right?
  In the hierarchy of friendship duties, **preventing irreversible self-sabotage** usually trumps **momentary autonomy.**

  If she had sent that text, one of two things would have happened:
  1.  **No response:** She would wake up feeling ignored and humiliated.
  2.  **A negative response:** He might react poorly, causing more pain.
  3.  **A positive response:** They might talk, reigniting a cycle that prevents her from moving on.

  By taking the phone, you absorbed her anger in the moment to save her from regret later. That is what good friends do. However, the *way* it was done matters. Grabbing a phone can feel violating. If it felt like a power play rather than a safety measure, that explains her lingering resentment.

  ### 3. Why Is She Still Mad?
  It is likely that her anger at you is **displaced anger.**
  *   She is hurting from the breakup.
  *   She feels vulnerable and out of control.
  *   She is embarrassed that she got to the point where a friend had to intervene.
  *   She feels shame about wanting to reach out.

  It is easier to be mad at you (who is safe and present) than at the ex (who is gone) or the situation (which is painful). Her argument about "autonomy" is intellectually sound, but emotionally, she might just be lashing out because she feels small.

  ### 4. How to Fix the Argument
  You don't need to admit you were "wrong" to protect her, but you do need to validate her feelings to end the standoff.

  **Step 1: Validate her autonomy.**
  Acknowledge that her point was interesting and that you respect her agency.
  > *"I've been thinking about what you said, that sober-you shouldn't get to overrule drunk-you. That's actually a really deep point, and I get why it feels like I was treating you like a child."*

  **Step 2: Reiterate your intent (Care, not Control).**
  Explain that you weren't trying to decide what she *should* want, but trying to protect her from a specific risk.
  > *"I didn't take the phone because I think your feelings aren't real. I know you love him and you're hurting. I took it because I know how much you'll hurt tomorrow if that text is sent while your impulse control is chemically turned off. I was trying to protect your future self, not silence your current self."*

  **Step 3: Apologize for the method, not the action.**
  > *"I'm sorry I grabbed your phone so aggressively. I should have asked, or just held onto it without making it a power struggle. I hate that we fought, and I hate that you're hurting."*

  ### The Verdict
  **You were right to intervene.**
  In the context of a fresh breakup and heavy intoxication, the "drunk text" is almost universally recognized as a mistake. You took a hit to the friendship to save her from a hit to her dignity.

  However, **she is right that it feels bad to be overruled.**
  The best move now is to let the dust settle. Don't try to win the philosophical debate. Just let her know you love her, you've got her back, and when she's ready to talk about the breakup (sober), you're there to listen without judging.

  If she brings it up again, you can say: *"I'd rather you be mad at me for an hour than hate yourself for a week."*
