answer: |-
  You have hit on the exact friction point where mechanistic interpretability meets philosophy of cognitive science. Your intuition is correct: **decodability is necessary but not sufficient for representation.**

  The Hewitt & Liang (2019) paper ("Designing and Interpreting Probes with Control Tasks") is the technical nail in the coffin for the idea that probe accuracy alone proves representation. They showed that if you have enough dimensions and a flexible enough probe, you can decode random labels or linguistic properties (like word length) that the model clearly isn't "using" to generate predictions.

  Your friend is also right: this is the **Job Description Challenge** (coined by Gładziejewski & Miłkowski, drawing on Cummins) ported to silicon. In philosophy of mind, the challenge is: you can't just say "this neural state correlates with a cat, therefore it represents a cat." You have to show that the state plays a specific *functional role* in the cognitive system's processing of "cat-ness."

  Here is the concrete crux of the debate, mapped from philosophy to transformer mechanics, and the criteria people are currently using to try to settle it.

  ### 1. The Core Crux: Readout vs. Use
  The fundamental divide is between **External Readout** (Probing) and **Internal Use** (Mechanism).

  *   **The Probe View (Instrumentalism):** A representation exists if an external observer (you, with a logistic regression head) can extract information from the activations. This treats the model as a database.
  *   **The Mechanistic View (Realism):** A representation exists only if the model *itself* extracts that information to compute its next token. This treats the model as an agent with internal machinery.

  **The Crux:** A direction in activation space is only a "real" representation if there is a **consumer** for that representation within the network. If you find a "refusal direction" with a probe, but the subsequent layers (the consumers) do not linearly read that direction to influence the output logits, then the representation is epiphenomenal. It's a shadow on the wall, not a gear in the machine.

  ### 2. Mapping the "Job Description Challenge" to Transformers
  In philosophy, the "job" of a representation is to mediate between input and behavior in a specific way. In a transformer, we can make this concrete. For a feature vector $v$ in layer $L$ to count as a representation of concept $C$:

  1.  **Encoding:** The model must transform input tokens into $v$ when $C$ is relevant.
  2.  **Decoding (The Consumer):** Downstream components (later attention heads or MLPs) must have weights that specifically attend to or project onto $v$ to influence the final output.
  3.  **Causal Invariance:** If you intervene on $v$ (e.g., activation steering), the model's behavior should change predictably *without* breaking the computation of unrelated features.

  **Where current interpretability often fails:**
  Most "concept vectors" found via probing fail condition #2. We find the direction, but we haven't traced the circuit that reads it. If the downstream weights are orthogonal to your "refusal direction," then the model isn't representing refusal there; you just found a correlate.

  ### 3. Concrete Criteria for "Real" Representations
  Researchers trying to move past the probe debate are converging on a few principled criteria that go beyond correlation.

  #### A. Causal Interventions (Steering/Ablation)
  This is the strongest evidence we currently have. If you add a vector $\vec{v}$ to the residual stream and the model's behavior shifts consistently toward concept $C$ (e.g., becoming more refuse-y), that suggests $\vec{v}$ is causally efficacious.
  *   **The Caveat:** This can still be brittle. If you have to scale $\vec{v}$ by 50x to see an effect, it might not be a natural representation; it might be a "adversarial example" in activation space. A "real" representation should be sensitive to small, naturalistic perturbations.
  *   **The Bar:** The intervention should work *in distribution*. If steering only works when you break the model's perplexity, it's not a genuine representation.

  #### B. Polysemanticity and Superposition
  Anthropic's "Toy Models of Superposition" paper highlights the biggest counter-argument to "directions = representations."
  *   **The Problem:** In high-dimensional spaces, models pack more features than dimensions. Features become non-orthogonal. A single neuron (or direction) might represent "DNA" in one context and "double helix structures" in another.
  *   **The Implication:** If a direction is polysemantic, does it "represent" anything?
  *   **The Resolution:** Many interpretability researchers now argue that **sparse autoencoders (SAEs)** recover the "real" representations better than raw neurons or PCA directions. If you can train an SAE to decompose activations into sparse features, and those features are monosemantic (interpretably distinct) *and* causally relevant, that is much stronger evidence of representation than a dense linear probe.

  #### C. The "Natural Kind" Test
  This is the philosophical realist check. Are these features "natural kinds" (like electrons) or "map coordinates" (like latitude)?
  *   **Latitude/Longitude:** Useful for us to locate things, but the Earth doesn't "know" it has a prime meridian.
  *   **Electrons:** Causal entities that exist independently of our measurement.
  *   **The Test:** If you retrain the model with a different seed, architecture, or dataset, do the *same* feature directions emerge? (This is the "alignment of representations" research). If representations are robust across training runs, they are likely structural necessities of the task (real), rather than artifacts of a specific optimization trajectory (instrumental).

  ### 4. Is there a Principled Way to Settle This?
  It does not bottom out *purely* in definition, but it does require shifting the burden of proof.

  **The Old Bar (Probing):** "I can train a classifier to predict $Y$ from activations $X$."
  **The New Bar (Mechanistic):** "I can identify a subgraph of weights that reads $X$ to produce $Y$, and intervening on $X$ breaks $Y$."

  The principled settlement lies in **Mechanistic Interpretability** (tracing circuits) rather than **Feature Visualization** (probing).
  *   **Probing** tells you what *could* be read.
  *   **Circuit Analysis** tells you what *is* read.

  For example, the "Induction Head" mechanism discovered by Anthropic is widely accepted as a "real" representation of copying patterns because they traced the QK and OV circuits that implement the algorithm. They didn't just probe for "copying"; they showed the math of how the attention heads perform the copy operation.

  ### 5. The Remaining Philosophical Stickiness
  Even with mechanistic evidence, two philosophical problems remain:

  1.  **The Disjunction Problem:** Even if a circuit detects "dogs," does it represent *dog* or *small furry animal* or *thing that triggers pet-food-sales*? The model's "semantic content" is defined by its loss function, not its weights. If the loss function rewards predicting "dog" when it sees a wolf, the representation might be "canid" rather than "dog." We map our semantics onto their math, but the mapping is imperfect.
  2.  **Derived vs. Underived Intentionality:** A map represents a territory only because a map-reader interprets it. Neural net activations only "mean" something because *we* interpret them (or because the loss function forces a correlation with the external world). Some philosophers argue NNs can never have "underived" intentionality (meaning in themselves), only "derived" intentionality (meaning given by users/trainers). If you hold this view, no amount of circuit analysis will prove the model "really" represents anything; it just processes syntax that correlates with semantics.

  ### Summary: The Concrete Distinction
  To answer your specific question on what separates a network that "really" has a representation from one that just has useful structure:

  **A network "really" represents feature $F$ if:**
  1.  **Sparsity:** The feature can be isolated (e.g., via SAE) from superimposed noise.
  2.  **Causal Role:** Downstream mechanisms explicitly read this feature to compute outputs (not just correlated with them).
  3.  **Intervention Stability:** Modifying this feature modifies behavior predictably without collapsing the model's coherence.
  4.  **Cross-Model Robustness:** Similar features emerge in independently trained models solving the same task.

  If you have a linear probe with 95% accuracy but no causal circuit trace and high polysemanticity, you have found a **correlate**, not a representation. You have found a shadow, not the object casting it.

  The field is currently moving from "Let's probe everything" to "Let's find the circuits that read the probes." That shift is the practical attempt to solve the Job Description Challenge.
