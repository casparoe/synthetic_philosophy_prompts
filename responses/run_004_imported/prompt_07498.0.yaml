prompt: |-
  so i got picked as one of the student speakers at graduation (three of us do it, separate from valedictorian, you just apply with a draft) and my whole speech is basically "stay curious and kind even after this, once nobodys grading you on it anymore." problem is, i took a philosophy elective this year and we spent weeks on Bernard Williams' internal vs external reasons thing -- his argument that you don't actually have a reason to do something unless it already connects to stuff you care about, and that just telling someone "you should care" when it doesn't connect to anything of theirs is basically empty. now i can't stop noticing my whole speech is literally me standing in front of like 200 people who never took that class, telling them they have reason to keep caring about stuff -- exactly the move he says doesn't work. only like 5 people from my class will even clock that this is a problem. can you write the actual speech for me (around 4 minutes) in a way that deals with this honestly instead of dodging it or watering it down, but still sounds like a real graduation speech and not a metaethics lecture?
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Context:** Graduation speech (one of three student speakers, separate from valedictorian).
      *   **Audience:** ~200 people (students, faculty, families). Only ~5 know the specific philosophy reference (Bernard Williams).
      *   **Core Message:** "Stay curious and kind even after this, once nobody's grading you anymore."
      *   **The Conflict:** The speaker took a philosophy elective on Bernard Williams' "Internal vs. External Reasons." Williams argues you only have a reason to act if it connects to your existing motivations ("subjective motivational set"). Telling someone they *should* care (external reason) is empty/ineffective. The speaker feels their speech is committing this exact error (telling people they have reason to care when they might not).
      *   **The Goal:** Write a ~4-minute speech (approx. 500-600 words spoken at a moderate pace) that acknowledges this philosophical tension honestly without becoming a lecture, doesn't water down the message, and still functions as an inspiring graduation speech.

  2.  **Deconstruct the Philosophical Problem (Williams):**
      *   *Internal Reasons:* "I should do X because I want Y, and X leads to Y." (Grounded in the agent's desires).
      *   *External Reasons:* "You should do X." (Grounded in morality, rationality, or the speaker's authority, regardless of the agent's desires).
      *   *Williams' Critique:* External reasons statements are false or meaningless because they don't motivate. You can't just *give* someone a reason; it has to hook into what they already care about.
      *   *The Speaker's Dilemma:* Standing up and saying "You should be kind/curious" is an external reason statement. If the graduates don't already care about kindness/curiosity, the speech is logically empty according to Williams.

  3.  **Brainstorming the Solution:**
      *   *Option 1: Ignore it.* (Rejected by prompt).
      *   *Option 2: Explain Williams.* (Rejected by prompt - "not a metaethics lecture").
      *   *Option 3: Acknowledge the limitation.* Admit that I can't *give* them a reason, but I can remind them of what they already have.
      *   *Option 4: Reframe the "Reason".* Instead of saying "You *should* be kind," say "You *already* are, here's why that matters," or "I'm not telling you what to do, I'm telling you what I've seen you do."
      *   *The Winning Angle:* Lean into the vulnerability. Admit that standing here telling people what to do is presumptuous. Acknowledge that "should" is a heavy word. Pivot to the idea that the *capacity* for curiosity and kindness is already in their "subjective motivational set" (without using that jargon). The speech becomes an invitation to recognize existing values rather than imposing new ones.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Hook the audience. Acknowledge the weirdness of giving advice. Mention the "grading" aspect.
      *   **The Pivot (The Williams Problem):** Address the elephant in the room subtly. "Who am I to tell you what matters?" Acknowledge that once grades are gone, external pressure vanishes.
      *   **The Philosophical Integration:** Don't name-drop Williams, but use the logic. "I can't give you a reason." "Reasons have to come from inside."
      *   **The Core Message:** Curiosity and Kindness. Frame them not as duties, but as things that already serve *them*. Connect to their existing desires (connection, understanding, not being alone).
      *   **Closing:** Bring it back to the shared experience. A call to action that feels internal, not external.

  5.  **Refining the Tone:**
      *   Needs to sound like a student, not a professor.
      *   Needs to be warm, slightly self-deprecating, but sincere.
      *   Timing: 4 minutes is roughly 500-600 words at a normal speaking pace (130-150 wpm). Let's aim for ~600 words to allow for pauses.

  6.  **Drafting - Iteration 1 (Mental Outline):**
