      Start with the relief of no exams. Move to the advice part. Admit the awkwardness of standing on a stage giving orders. "Why listen to me?" Bring in the idea that reasons come from within. Connect kindness to *their* happiness, not just moral duty. End with a wish for the future.

  8.  **Drafting - Iteration 3 (Polishing for the Prompt):**
      *   *Specific constraint:* "Deals with this honestly instead of dodging it."
      *   *Solution:* Explicitly mention the futility of "should."
      *   *Specific constraint:* "Not a metaethics lecture."
