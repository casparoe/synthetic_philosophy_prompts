answer: |-
  This is a sophisticated application of judgment-aggregation theory to a canonical legal case. *Arizona v. Fulminante* is indeed the "fruit fly" of the doctrinal paradox literature, but as your breakdown suggests, the reality is messier than the formal models.

  Here is an analysis of the case through the lens of the discursive dilemma, addressing your three questions.

  ### 1. Kennedy's Logic: Institutional Premise Acceptance

  Justice Kennedy's maneuver is logically distinct from both a standard Premise-Based Procedure (PBP) and a standard Conclusion-Based Procedure (CBP). It is best described as **strategic institutional premise acceptance.**

  In a formal **PBP**, the institution is *required* to vote on premises first, and the conclusion is derived mechanically. Individual judges are expected to vote their sincere views on the premises, even if they know it leads to a conclusion they dislike. In a **CBP**, judges vote only on the final disposition based on their own internal logic; the reasoning is secondary.

  Kennedy is operating in a system that is formally CBP (Justices vote on the judgment/disposition) but normatively pressured toward PBP (the Court must provide a coherent legal rule for lower courts).
  *   **His Sincere View (CBP):** Confession was voluntary $\rightarrow$ No error $\rightarrow$ Affirm conviction.
  *   **His Actual Vote (Hybrid):** He acknowledges that a majority of the Court (5 Justices) found the confession coerced. He treats that majority finding as a *binding institutional premise* for the purpose of the mandate, even though he is not part of that majority.

  Is this required by PBP? No. In a strict PBP, Kennedy would vote "Voluntary" on premise (A), and if that vote held (i.e., if he convinced one other Justice), the group conclusion would change. Kennedy is not voting on the premise; he is *deferring* to the aggregated premise.

  This is a move the standard distinction doesn't fully capture because it introduces a **hierarchy of aggregation**. Kennedy is saying: "On the final disposition (CBP), I will vote for the outcome generated by the majority's premises (PBP), even though my personal premises differ." He is prioritizing the *clarity of the institutional mandate* over the *consistency of his own doctrinal position*. Logically, he is treating the Court's majority view on (A) as a fact of the case, much like a lower court would treat a Supreme Court holding as binding precedent, even if the lower court judge disagrees with it.

  ### 2. Coalitions and the "Path Paradox"

  Let us map the coalitions based on the data provided.

  *   **Issue (A) Coerced?**
      *   **Majority (5):** White, Marshall, Blackmun, Stevens, **Scalia**.
      *   **Minority (4):** Rehnquist, O'Connor, **Kennedy**, Souter.
  *   **Issue (B) Harmless Error Review Applies?**
      *   **Majority (5):** Rehnquist, O'Connor, **Kennedy**, Souter, **Scalia**.
      *   **Minority (4):** White, Marshall, Blackmun, Stevens.
  *   **Issue (C) Was Error Harmless?**
      *   **Majority (5):** White, Marshall, Blackmun, Stevens, **Kennedy**.
      *   **Minority (3):** Rehnquist, O'Connor, **Scalia**.
      *   **Abstain (1):** Souter.
  *   **Final Disposition (New Trial)**
      *   **Majority (5):** White, Marshall, Blackmun, Stevens, **Kennedy**.
      *   **Minority (4):** Rehnquist, O'Connor, **Scalia**, Souter (presumably, based on his refusal to join C).

  **Comparison to the List–Pettit Toy Model:**
  In the standard toy example of the discursive dilemma, we typically see a situation where the majority on the premises logically implies Conclusion X, but the majority on the conclusion prefers Conclusion Y.

  *Fulminante* presents a more complex variation, which we might call the **Path Paradox**.
  1.  **There is no single majority coalition for the legal doctrine.**
      *   To get to "New Trial" via the majority premises, the logic chain is: *Coerced (A)* + *Review Applies (B)* + *Not Harmless (C)*.
      *   Who supports this full chain? **No one.**
      *   **White** supports A and C, but rejects B (he thinks Coerced = Automatic Reversal).
      *   **Scalia** supports A and B, but rejects C (he thinks it was Harmless).
      *   **Kennedy** supports B and C, but rejects A (he thinks it was Voluntary).
      *   **Rehnquist** supports B, but rejects A and C.

  2.  **The Outcome Majority is a "Coalition of Minorities."**
      The 5–4 majority for the New Trial (White + Kennedy + 3 others) is formed by two different logical paths:
      *   **Path 1 (White):** Coerced + No Review Allowed $\rightarrow$ New Trial.
      *   **Path 2 (Kennedy):** (Accept Majority View: Coerced) + Review Allowed + Not Harmless $\rightarrow$ New Trial.

  **Is this a "clean instance"?**
  No, it reveals a limitation in the toy examples. The toy models assume static preferences and independent premises. *Fulminante* shows:
  *   **Sequential Dependency:** Issue (C) is moot if (A) is false. Issue (B) is moot if (A) is false. This creates a decision tree, not a flat conjunction of premises.
  *   **Dynamic Voting:** Kennedy's vote on the disposition is *conditional* on the aggregation of the other Justices' votes on (A). The toy model assumes votes are cast simultaneously and independently. Here, the "vote" is constructed through opinion negotiation.
  *   **Doctrinal Instability:** The toy model highlights a contradiction between premises and conclusion. *Fulminante* highlights a contradiction within the *reasoning* supporting the conclusion. The "Majority Opinion" is a fiction; there is no majority for the *reason* the judgment was reached, only for the judgment itself.

  ### 3. Principled Resolution vs. Papering Over

  This case suggests that real collegial courts do not resolve the discursive dilemma through formal aggregation rules, but through **norms of judicial craftsmanship and institutional legitimacy.**

  **1. The "Rule of Five" vs. The "Reasoning of Five"**
  In theory, a Supreme Court majority requires five votes for the *judgment*. In practice, as *Fulminante* shows, a judgment can stand even if no five Justices agree on the *reasoning*. The Court resolves the dilemma by prioritizing the **disposition** (CBP) while using **concurrences** (like Kennedy's) to simulate the coherence of PBP. Kennedy's concurrence is the "glue" that papers over the logical fracture. Without it, the Court would have issued a 5–4 judgment with no coherent legal rule attached (since the White coalition and the Kennedy coalition relied on mutually exclusive premises regarding coercion).

  **2. Institutional Legitimacy as a Tie-Breaker**
  Kennedy explicitly invokes the "interests of providing a clear mandate." This suggests that when the discursive dilemma arises, the tie-breaking principle is not logical consistency, but **pragmatic authority**. A fragmented Court risks non-compliance from lower courts. By "accepting" the coercion finding he disagreed with, Kennedy sacrificed doctrinal purity for institutional clarity. This implies that courts resolve the dilemma not by finding the "true" group will (which may not exist), but by constructing a "useful" group will.

  **3. The Illusion of Coherence**
  Does this paper over the problem? Yes. The syllabus of *Fulminante* presents a coherent legal pathway: Confession was coerced, harmless error applies, error was not harmless. But as the coalition analysis shows, this pathway is supported by **zero Justices** in its entirety. The "Majority Opinion" is an aggregate of fragments.
  *   **Principled?** It is principled in a *systemic* sense (preserving the Court's ability to issue mandates).
  *   **Honest?** It is arguably dishonest in a *logical* sense (it implies a doctrinal consensus that does not exist).

  **Conclusion**
  *Fulminante* demonstrates that the discursive dilemma in real courts is not a mathematical impossibility to be solved, but a political reality to be managed. The List–Pettit framework correctly identifies the instability (the lack of a consistent majority coalition), but it cannot capture the **rhetorical work** Justices perform to stabilize it. Kennedy's move shows that courts resolve the dilemma by allowing individual judges to temporarily suspend their own logic to sustain the institution's output—a solution that is procedurally informal but functionally essential.
