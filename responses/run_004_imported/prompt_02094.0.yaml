      1. Validate the user's confusion (it is counter-intuitive).
      2. The "Infinite Bank" analogy (Positive vs Negative Infinity).
      3. The "Long Run" failure (Law of Large Numbers doesn't apply).
      4. Why Undefined is worse than Infinite (Direction vs. Chaos).
      5. The "Center of Gravity" metaphor for Expectation.

  11. (Final check of the Pasadena Payoff): $X_n = (-1)^{n-1} 2^n / n$. Prob $2^{-n}$. Product is $(-1)^{n-1} / n$. Yes, alternating harmonic series. Correct.

