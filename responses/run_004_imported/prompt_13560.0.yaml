      *   *Constraint:* Must use the same mixed strategy $p$ (probability of continuing) at both exits because they are indistinguishable (imperfect recall).
      *   *The Conflict:*
          *   *Planning Stage (Ex Ante):* Choose $p$ to maximize expected utility over the whole trip. Let's call this $p_{plan}$.
          *   *Action Stage (Ex Interim):* You arrive at an exit. You don't know which one. You assign a credence $\alpha$ to being at Exit 1 and $1-\alpha$ to being at Exit 2. You choose $p$ to maximize expected utility *given* $\alpha$. Let's call this $p_{action}$.
      *   *The Paradox:* If you set $\alpha = 1/2$ (Principle of Indifference), $p_{action}$ often differs from $p_{plan}$. This is "dynamic inconsistency."
      *   *Piccione & Rubinstein (1997):* The original paper highlighting this tension.
      *   *Aumann, Hart, Perry (1997) / Halpern & Pass:* Solutions involving "modified" Bayesian updating where the credence $\alpha$ depends on the strategy $p$ itself (since $p$ determines how likely you are to reach the second exit).

