  **Move 1 (Priya): -1**
  Priya defends **Judgmentalism** (the Stoic/analytic view that emotions *are* beliefs). While logically tidy, this theory famously fails to account for **recalcitrant emotions**—feelings that persist despite contradictory beliefs. By declaring your character "bad writing" rather than acknowledging a common psychological phenomenon, she prioritizes theoretical purity over empirical reality. She loses points because she denies the data of human experience to save her definition.

  **Move 2 (Oskar): 2**
  Oskar defends **Perceptualism**, using the **illusion analogy** (e.g., the Müller-Lyer lines). This is the strongest philosophical move because it perfectly models your character's state: the visual system presents lines as unequal (fear presents flight as dangerous) while the cognitive system believes they are equal (statistics say it's safe). This validates the character's contradiction as a feature of human psychology, not a bug in your writing. It is the most accurate description of the phenomenon at hand.

  **Move 3 (Priya): 0**
  Priya raises a technical objection about **intentionality** (what mental states are "about"). She argues perception tracks low-level data (color/shape), not evaluative properties ("danger"). This is a standard philosophical objection, but it relies on an outdated, "bottom-up" view of vision. It's a neutral move because it identifies a genuine theoretical friction point for Perceptualists, even if her premise about perception is arguably too narrow.

  **Move 4 (Oskar): 1**
  Oskar counters with **Ecological Psychology** (affordances). Modern cognitive science supports the idea that we perceive high-level properties directly (e.g., we see a surface as "walk-on-able" or a face as "angry" without inferring it). By framing danger as an **affordance** (a relationship between the environment and the agent), he successfully parries Priya's objection. He doesn't win outright (the debate is ongoing), but he holds the stronger scientific position.

  ### The Third Way: Dual-Process Theory
  Both Priya and Oskar assume fear is a single type of evaluative state (either a judgment or a perception). They are ignoring **Dual-Process Theory** (System 1 vs. System 2).

  *   **System 1:** Fast, automatic, associative, evolutionary old (the amygdala). This system tracks patterns and survival threats. It doesn't "believe" or "judge"; it reacts. This is your character's white-knuckling.
  *   **System 2:** Slow, deliberative, statistical, evolutionary new (the prefrontal cortex). This handles the statistics and the lecture. This is your character's knowledge.

  **How this changes the argument:** It dissolves the contradiction. The character isn't holding two contradictory *beliefs* (Priya's worry), nor is he suffering from a perceptual *illusion* (Oskar's view). He is running two different operating systems simultaneously. The trauma locked the System 1 response into a loop that System 2 cannot override. This gives you, the writer, a concrete mechanism: the conflict isn't about what he *thinks* is true, but about which *system* is driving the bus during turbulence.
