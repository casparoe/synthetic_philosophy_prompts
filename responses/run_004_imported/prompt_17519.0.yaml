  **Move-by-Move Justification**

  *   **(1) Score: 1.** Owen's proof is mathematically valid and standard in classical logic. However, in the context of Lean where code extraction is a goal, starting with a non-constructive proof is suboptimal. It earns a positive score for correctness, but not a perfect one because it ignores the engineering constraint.
  *   **(2) Score: 2.** Maya correctly identifies the project's primary constraint: the Curry-Howard correspondence. In Lean, if you want executable code *from* a proof term (extraction), the proof must be constructive. Her objection is the crux of the entire dispute.
  *   **(3) Score: -1.** Owen mischaracterizes the limitation as "tooling." In Lean, using classical axioms (like `Classical.choice`) marks definitions as `noncomputable`. This is a kernel-level restriction, not a UI or tooling issue. Furthermore, he conflates semantic truth with the syntactic ability to reduce a term to a witness.
  *   **(4) Score: 2.** Maya is technically precise. Constructive existence (`Sigma` types or `Exists` in `Type`) packages the witness with the proof, allowing mechanical extraction. Classical existence (`Exists` in `Prop` via axioms) does not. This is the fundamental theoretical gap she is highlighting.
  *   **(5) Score: 0.** Owen makes a pragmatically true point for the *current* scope (finite domains allow separate brute-force functions), but he is strategically wrong regarding the team's stated goal ("out of these proofs") and future scalability. It's a valid engineering workaround, but it doesn't defend the proof style against the stated requirements.

  **The Principled General Rule**

  The distinction between constructive and non-constructive proofs has **teeth** when:
  1.  **Synthesis is the Goal:** You intend to extract executable code directly from the proof term (Proofs-as-Programs).
  2.  **Infinite or Undecidable Domains:** You cannot rely on brute-force search or case analysis (e.g., reasoning over streams, real numbers, or unbounded concurrency).
  3.  **Axiom Avoidance:** You need the proof to reduce computationally without getting stuck on axioms like the Law of Excluded Middle or Choice.

  The distinction is largely **academic bookkeeping** when:
  1.  **Verification only:** You are proving properties about existing, manually-written code (e.g., safety invariants) rather than generating the code itself.
  2.  **Finite & Decidable:** The domain is finite and the predicate is decidable. In this specific case, a classical existence proof implies a witness *metatheoretically*, and you can write a separate brute-force function to find it, linking the two with a correctness theorem.

  **Who is missing it?**
  **Owen** is missing the distinction. He is treating the formalization as a **Validation** task (proving the scheduler *can* work) when the team's requirement is **Synthesis** (proving *how* it works to generate the suggestion). His reliance on the finite case is a valid fallback, but it requires writing the algorithm twice (once in logic, once in code), which increases maintenance burden and breaks the "extraction" workflow Maya is protecting for the streaming version.

  **Maya** sees the distinction clearly but should acknowledge that Owen's finite-domain workaround is a valid *engineering* compromise if the team decides extraction is too costly for the current batch scheduler. However, given the plan to reuse the pattern for streaming (infinite) data, her insistence on constructive discipline is the strategically correct choice for the codebase's longevity.
