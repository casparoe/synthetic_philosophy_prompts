  2.  **Deconstruct the Reference Class Problem (RCP):**
      *   *What is it?* Assigning a probability to a single event requires placing that event in a class of similar events. But any individual belongs to infinite classes. Different classes yield different probabilities. Which one is the "true" probability?
      *   *Why is it deep?* It strikes at the heart of what probability *means* (ontology) and how we use it for decision-making (epistemology). If probability is frequency, you need a class. If the class is arbitrary, the frequency is arbitrary. If probability is subjective belief, you need priors based on... classes.
      *   *Why Reichenbach's fix fails:* "Narrowest class with reliable statistics" is vague. When does reliability break down? Also, there's often a trade-off between relevance (narrow) and stability (wide). There is no objective cutoff point.

  3.  **Address Hájek's Claim (The "Your Problem Too" Argument):**
