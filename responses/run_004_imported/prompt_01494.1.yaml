prompt: |-
  Write a dialogue between al-Ghazālī and Averroes (Ibn Rushd) that continues their historical debate over causation in the seventeenth discussion of the Tahāfut al-Falāsifa and its rebuttal in the Tahāfut al-Tahāfut. Al-Ghazālī should defend his claim that the conjunction of fire and the combustion of cotton reflects only God's habitual custom rather than a necessary connection grounded in fire's nature — a claim he needs in order to leave room for prophetic miracles. Averroes should press the objection that denying such necessary connections between things and their properties makes demonstrative (burhānī) scientific knowledge impossible. The two should engage directly with each other's strongest argument rather than simply restating their own positions.
reasoning: |-
  Here's a thinking process that leads to the dialogue:

  1.  **Analyze the Request:**
      *   **Characters:** Al-Ghazālī (1058–1111) and Averroes/Ibn Rushd (1126–1198).
      *   **Context:** A hypothetical dialogue continuing their historical debate.
      *   **Source Material:** *Tahāfut al-Falāsifa* (The Incoherence of the Philosophers) by Ghazālī (specifically the 17th discussion on causation) and *Tahāfut al-Tahāfut* (The Incoherence of the Incoherence) by Averroes.
      *   **Core Conflict:**
          *   Ghazālī: Causation is not necessary; it's God's habitual custom (*'ādah*). This preserves the possibility of miracles (fire not burning cotton).
          *   Averroes: Denying necessary connections destroys demonstrative scientific knowledge (*burhān*). If nature has no intrinsic powers, science is impossible.
      *   **Requirement:** They must engage directly with each other's strongest arguments, not just restate positions.

  2.  **Character Voices & Philosophical Stances:**
