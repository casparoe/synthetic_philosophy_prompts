      *   **Averroes:** Aristotelian Philosopher (*Falāsifah*), Judge (*Qādi*). Emphasizes Intellect, Order, and the intelligibility of the universe. Believes God acts through secondary causes. Concerned with preserving the validity of rational demonstration (*burhān*). Tone: Logical, rigorous, concerned with the implications for knowledge.

  3.  **Key Arguments to Weave In:**
      *   *Ghazālī's Observation:* We see conjunction (*iqtirān*), not causation (*illiyyah*). The connection is psychological habit, not ontological necessity.
      *   *Averroes' Rebuttal:* If you deny natures (*tabā'i*), you deny the middle term in a syllogism. You reduce knowledge to mere sense perception.
      *   *Ghazālī's Counter:* God *could* burn cotton without fire (miracle). If fire *must* burn, God is bound by nature.
      *   *Averroes' Counter:* Miracles are exceptions within a system, not proof that the system doesn't exist. Denying the system makes the miracle meaningless (if anything can happen anytime, a miracle isn't special).

