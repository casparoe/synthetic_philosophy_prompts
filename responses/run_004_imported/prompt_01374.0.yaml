  The notification light on Arthur's phone pulsed with a soft, reassuring blue. It was the *Civitas* app, the mandatory neighborhood portal for the new development in Østerbro. Here, disputes were not had over fences but in threads titled *Community Standards* and *Shared Harmony*.

  Arthur typed carefully. He was drafting a complaint about the unit below him. The tenant, a cellist, practiced after 8:00 PM. It wasn't loud, precisely. It was persistent. It was distinct.

  *It creates an imbalance,* Arthur wrote. *Some of us value quiet contemplation. The current noise profile suggests a lack of consideration for the collective rest.*

  He hovered over *Post Anonymously*. This was the crucial button. If he signed his name, he would be Arthur, the man upstairs, confronting the woman downstairs. He would be responsible for her shame, her defensiveness, the awkwardness in the elevator. He would be a Single Individual.

  But if he checked the box, he became part of *The Residents*. He became a voice from nowhere.

  He checked the box. He hit *Submit*.

  A wave of relief washed over him, physical and sweet. It was the relief of dissolving. He hadn't attacked anyone; *The Community* had noted a discrepancy. He leaned back in his chair, feeling lighter. He was no longer a man with a grievance; he was a guardian of the abstract good. This was the seduction Kierkegaard had identified a century prior, though Arthur had never read him: the public offers rest. It excuses you from the burden of being yourself.

  Over the next week, the thread grew. Others joined. They didn't know the cellist. They hadn't heard the music. But they knew what *Community Standards* were. One user, *Unit_4B*, wrote: *Noise is often a symptom of broader disrespect.* Another, *GreenView*, added: *We moved here for tranquility, not a concert hall.*

  The cellist stopped playing. Then she moved out. The unit sat empty. Arthur felt a quiet swell of pride. He had helped shape the environment. He was an instrument of the leveling process, smoothing out the jagged edge of a solitary life that infringed on the collective comfort. He was nobody, and therefore he was powerful.

  The turn came on a Tuesday, unrelated to music. Arthur had parked his guest's car in a visitor spot for four hours instead of three. A photo was uploaded to *Civitas*.

  *Violation of Visitor Policy. Unit 502.*

  Arthur felt a spike of irritation. He could reply. He could explain the guest was elderly. But before he could type, other comments bloomed like mold.

  *Typical of 502.*
  *We've noticed a pattern of entitlement.*
  *It's not just the parking. It's the tone in the meetings.*

  Arthur froze. *The tone?* He had spoken twice at meetings. He had been polite. But the comment wasn't about politeness. It was about *The Tone*. It was an accusation without a specific incident, a judgment without a judge.

  He scrolled. There were twelve comments. None were signed. They were all from *The Residents*.

  Arthur tried to find the source. He went downstairs to the lobby, waiting for neighbors to arrive. He saw Mrs. Hansen from 304. She was on the committee.

  "Did you write that?" Arthur asked, trying to keep his voice level. "About the tone?"

  Mrs. Hansen looked up from her grocery bags, startled. "Write what?"

  "On the app. About the parking."

  "Oh," she said, relaxing. "I liked that thread. It needed saying."

  "But did you write it?"

  "No. But I agree with the sentiment. It's about the community, Arthur. It's not personal."

  *It's not personal.* That was the horror. If it were personal, someone would hate him. Someone would be accountable. Instead, he was being crushed by a phantom. He was being leveled not by malice, but by the weight of everyone agreeing with no one.

  He went to the management office. "I want to know who posted the original photo."

  The manager, a young man who spent his day monitoring the *Civitas* feed, shook his head. "Privacy policy. Besides, it's not about the person. It's about the data. The data shows a disruption."

  "I am the person!" Arthur said, his voice rising. "I am standing here!"

  The manager looked at him with mild pity. "Please don't make a scene. That's exactly what the thread mentioned. The aggression."

  Arthur walked out. He understood then what his friend at dinner had tried to explain to him over wine, using that old story about the philosopher and the newspaper. The friend had said it was vanity. That the philosopher had invited the attack to feel important.

  Arthur looked at his reflection in the glass door of the lobby. He had invited this, hadn't he? By checking *Post Anonymously* for the cellist, he had validated the machine. He had taught the neighborhood how to use the weapon. He had shown them that they could judge without standing in the light.

  But knowing he had built the trap didn't make the trap less real. That was the point his friend missed. The mechanism worked regardless of the motive. The Public was a monstrous abstraction, yes, but it had gravity. It pulled you down.

  He walked home, feeling the eyes of the building on him. Not literal eyes. He passed a group of teenagers smoking by the bike racks. They weren't looking at him. But he felt judged by them anyway. They were part of *The Residents* now. They were part of the abstraction.

  In his apartment, the silence was heavy. The cellist's unit was still empty. He had won that battle. He had enforced the quiet. Now the quiet enforced itself upon him.

  He opened the app again. He wanted to write a defense. *I am Arthur. I made a mistake. I am sorry.*

  But to write that was to step out of the stream. It was to become singular again. And the Public does not negotiate with individuals. It only levels them. If he posted a defense, it would just be more content for the feed. *502 is defensive. 502 is disrupting the harmony again.*

  He closed the app.

  He walked to the window. Below, people walked their dogs. They walked in pairs, or with families. They were talking. But Arthur knew that if he asked them, *Who is responsible for the mood of this street?* none of them could answer. They were all responsible, which meant none of them were.

  He thought about the vanity of it. Yes, he had wanted to feel superior to the cellist. He had wanted to be the arbiter of quiet. That was petty. That was human. But the thing that had turned on him was not petty. It was structural. It was a new kind of entity that lived in the space between people, fed by their desire to be nowhere in particular.

  His phone buzzed. Another notification. *Community Alert: Please be mindful of loitering in common areas.*

  He looked down. He was just standing at his window. But somehow, even his stillness was a violation. The Public required movement, engagement, content. It required him to be either a contributor or a target. It did not know what to do with a man who simply stood there, accountable only to himself.

  Arthur turned away from the window. He would not reply to the thread. He would not file a counter-complaint. He would sit in the silence he had helped create.

  It was uncomfortable. It was lonely. It was the burden of the Single Individual. He felt the weight of his own name, *Arthur*, pressing against his ribs. It was heavier than the anonymity he had worn last week. It was harder to carry.

  But it was the only thing that was real. The rest of them—the neighbors, the app, the comments—they were just a fog. A fog that could chill you to the bone, but could never shake your hand.

  He sat in his chair. The phone lay dark on the table. For the first time in months, he was not resting. He was awake. And outside, the Public continued its work, leveling the city street by street, offering everyone the comfort of being no one, while Arthur sat alone in the discomfort of being himself.
