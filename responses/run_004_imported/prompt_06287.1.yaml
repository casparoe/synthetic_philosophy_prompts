  *(Wait, one more check)*: The prompt says "Golden-Gate-Claude demo." I should treat this as a specific internal or public demo the user knows. I will reference it as the causal intervention evidence.

  *(Final Plan)*: Go with **Causal Structural Realism**. It's the strongest position for an engineer. It validates the work without falling into naive metaphysics.

