answer: |-
  **Title:** The Map and the Lever: A Case for Causal Structural Realism
  **To:** Mechanistic Interpretability Team
  **From:** [Your Name]
  **Date:** October 26, 2023
  **Subject:** Position Statement on the Ontology of Features

  ### Introduction: The Roommate's Challenge

  My roommate, a theorist, recently told me that our entire job is a category error. He argued that when we say "Claude represents the Golden Gate Bridge along this direction," we are engaging in anthropomorphic projection. To him, a neural network is a high-dimensional function approximator. Finding a "feature" inside it is no more ontologically significant than finding a "temperature" in a thermostat. It is a convenient label for a pattern, not a discovery of a discrete entity.

  This is the skeptic's position: **Instrumentalism.** It holds that features are useful fictions we impose on weights to make sense of them, but they do not exist independently of our descriptive framework.

  Our team's default stance is **Realism.** We act as if features are discovered, not invented. We speak of them as if they have an objective existence within the residual stream.

  For this talk, I am not going to hedge. I am not going to say "both sides have merit" or "more research is needed." We are engineers building tools to audit and steer models. We need a working ontology. After weighing the evidence from superposition, Sparse Autoencoders (SAEs), and causal interventions, I am committing to a specific verdict: **Causal Structural Realism.**

  Features are not atomic particles, but they are real causal levers. They exist objectively insofar as they support stable, counterfactual interventions.

  ### The Skeptic's Strongest Evidence: Superposition and Splitting

  The skeptic is right to point out that the naive view of features is dead. If we believed that one neuron equals one concept, the skeptic would win immediately. Polysemanticity proved that neurons are not the unit of meaning.

  But the deeper challenge comes from Sparse Autoencoders and the **feature-splitting problem**. When we train an SAE with a small dictionary size, we find a feature for "Golden Gate Bridge." When we increase the dictionary size, that feature often splits. One neuron might become "San Francisco landmarks," another "suspension bridges," another "red structures."

  If the "true" feature changes depending on the hyperparameters of our probe (the SAE width), how can it be real? The skeptic argues this proves features are just resolutions on a microscope we are turning. If the object changes when I change the lens, the object isn't there.

  This is a serious objection. It suggests that "features" are not platonic atoms waiting to be found. However, this argument conflates *granularity* with *illusion*. Consider a map. A map of California at 1:100 scale shows "San Francisco." A map at 1:10 scale shows "The Mission District." The fact that "San Francisco" splits into neighborhoods at higher resolution does not mean "San Francisco" was fake. It means our initial representation was a coarse-graining of a underlying structure.

  Superposition is not evidence that features are fake; it is evidence that the model is compressing more features than dimensions. The model *must* represent these concepts to minimize loss. The fact that SAEs can disentangle them—even if the exact boundary shifts with capacity—suggests there is a underlying signal we are converging upon, not just noise we are patterning.

  ### The Realist's Strongest Evidence: Othello and Causality

  If the SAE evidence is ambiguous, the causal evidence is not.

  Consider **Othello-GPT**. A model trained purely on next-move prediction, without explicit board state inputs, develops an internal representation of the board. We can probe this representation to predict the board state. But the skeptic could still say this is just a correlation—a clever shortcut.

  The realist clincher is **activation patching**. In the Anthropic "Mapping the Mind" work (the "Golden-Gate-Claude" demo), researchers didn't just observe the feature; they intervened. They took the activation vector associated with the "Golden Gate Bridge" feature and swapped it into a context where the bridge wasn't mentioned. The model's behavior shifted specifically toward bridge-related completions.

  This moves us from correlation to causation. If I pull a lever and the light turns on, the lever is real, even if I don't understand the wiring.

  The skeptic might argue that we are just finding "causal bottlenecks" that are artifacts of the architecture. But the specificity of the interventions matters. When we patch the "sycophancy" feature, we don't just change the tone; we change the model's agreement rate without breaking its grammar or factual recall. This modularity suggests that the network has functionally segregated these computations.

  If features were merely convenient descriptions (like "temperature"), intervening on them would likely break the system globally, because "temperature" is an emergent aggregate of all atom motions. You can't "patch" temperature without changing the atoms. But in LLMs, we are patching specific directions in the residual stream and getting specific behavioral changes. This implies the model itself is using these directions as computational variables.

  ### The Verdict: Causal Structural Realism

  So, where do we land?

  **Naive Realism** (Features are atomic, fixed entities like neurons) is false. Superposition and feature splitting disprove this.
  **Hard Skepticism** (Features are purely human projections) is false. Causal interventions and Othello-GPT disprove this.

  I propose we adopt **Causal Structural Realism**.

  **1. Features are defined by their causal role, not their semantic label.**
  A feature is "real" if it is a stable locus of causal influence. It doesn't matter if we call it "Golden Gate Bridge" or "vector 492." What matters is that manipulating vector 492 consistently alters the probability distribution over tokens related to that concept. The reality lies in the *function*, not the *name*.

  **2. Granularity is a property of the analysis, not the model.**
  The fact that features split at higher SAE dimensions does not invalidate the lower-dimension features. It means the model represents concepts hierarchically. The "Golden Gate Bridge" feature is a real computational shortcut the model uses, even if it is composed of sub-features. It is a valid level of abstraction in the model's own computation.

  **3. Linearity is a computational substrate, not an artifact.**
  The Linear Representation Hypothesis holds not because the universe is linear, but because linear operations are computationally cheap for the transformer architecture. The fact that we can find these directions linearly is evidence that the model organizes its computation to make these features accessible to its own attention heads and MLPs. They are real *to the model*, not just to us.

  ### Why This Matters for Our Work

  You might ask: "Why does the philosophy matter? We just want to steer the model."

  It matters because it dictates our failure modes.

  If the **Skeptic** is right, our job is impossible. We are trying to label clouds. Any steering we do is brittle hacking that will break on out-of-distribution data because there is no underlying structure to hold onto.

  If the **Naive Realist** is right, we will fail because we will keep looking for single neurons or fixed features that don't exist. We will be confused by polysemanticity and think our tools are broken.

  If **Causal Structural Realism** is right, then our job is to map the *causal graph* of the model. We are looking for the levers that the model pulls on itself. This validates the use of SAEs not as "truth detectors," but as "disentanglement tools" that help us isolate causal variables. It validates activation patching as our gold standard for truth.

  ### Conclusion

  My roommate says we are studying a thermostat. He is wrong. We are studying a cockpit.

  A thermostat has one state variable: temperature. It is an aggregate. A cockpit has hundreds of switches, levers, and dials. Some are labeled, some are not. Some controls affect multiple systems (polysemanticity). Some systems are redundant (superposition). But the switches are real. If I flip the landing gear lever, the gear comes down.

  The "Golden Gate Bridge" feature is a switch in the cockpit. It might be painted over, or it might be part of a larger panel, and at high magnification, we might see it's made of smaller circuits. But it is a distinct causal mechanism that the model uses to process information.

  We are not projecting meaning onto weights. We are reverse-engineering the control panel of a cognitive architecture. The features are real because they do work. And that is enough for us to get back to engineering.
