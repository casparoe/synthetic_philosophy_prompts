      *   *What does this say about the Imitation Game?* It highlights that the test is about *input-output equivalence*, not internal mechanism. If a human can produce the output via ESP, and the machine can't, the machine looks worse. But if the human uses ESP, is that "intelligence"? Turing seems to separate "intelligence" from "psychic powers," yet acknowledges they confound the measurement.
