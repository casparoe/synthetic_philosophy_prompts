      *   *The Implication:* If you don't control the environment strictly, you aren't measuring the capability you think you are measuring.

  4.  **Brainstorm Implications for Confidence in Behavioral Tests:**
      *   *Implication 1: The Fragility of Operationalism.* Defining intelligence solely by behavior makes the test vulnerable to *any* mechanism that produces that behavior, including "cheating" mechanisms (ESP then, memorization now).
      *   *Implication 2: The Burden of Control.* The validity of the test rests entirely on the integrity of the experimental setup (the "room"). If the room is leaky, the result is null.
