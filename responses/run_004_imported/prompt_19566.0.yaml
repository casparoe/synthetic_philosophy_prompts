      *   **User's Perspective:** Someone interested in contamination and information leakage in ML benchmarks.
      *   **Task:** Describe the most important implications of Turing's willingness to treat ESP as a genuine confound for confidence in purely behavioral/black-box tests of intelligence (both Turing's and modern AI evals).

  2.  **Deconstruct Turing's Move (The "Telepathy-Proof Room"):**
