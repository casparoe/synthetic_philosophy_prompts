answer: |-
  Your editor is absolutely correct to push back on that line. In fact, if you publish the claim as currently written, it will significantly undermine your credibility with the computer science community.

  There are three distinct errors in that sentence: a confusion of theoretical definitions, a conflation of algorithms, and a misconception about hardware maturity.

  Here is a breakdown of why scientists still "hedge" on this point, and how you can correct the record for your readers.

  ### 1. The Church-Turing Thesis vs. The *Extended* Church-Turing Thesis
  This is the most critical theoretical distinction.

  *   **The Church-Turing Thesis (CTT)** states that any function that is "effectively calculable" can be computed by a Turing machine. It is a claim about **computability** (what is possible), not efficiency. A classical Turing machine *can* simulate a quantum computer; it just takes an exponentially long time. Therefore, quantum computers do **not** disprove the standard Church-Turing thesis. They do not allow us to solve the Halting Problem or compute uncomputable functions.
  *   **The Extended Church-Turing Thesis (ECTT)** is the version that deals with **complexity** (efficiency). It posits that any physically realizable computation can be efficiently simulated by a probabilistic classical computer (roughly, that classical computers can do anything quantum computers do with only polynomial overhead).

  **The Correction:** Shor's algorithm challenges the *Extended* Church-Turing Thesis, not the original one. If a quantum computer factors large integers exponentially faster than any classical computer, it violates the ECTT. However, saying it disproves the "Church-Turing thesis" is like saying a Ferrari disproves the laws of physics because it goes faster than a bicycle. The destination (computability) is the same; the speed (complexity) is different.

  ### 2. Theory vs. Experimental Reality
  Your draft implies that Shor's algorithm has already demonstrated this speedup in practice. It has not.

  *   **Shor's Algorithm:** While mathematically proven to offer exponential speedup, it requires fault-tolerant quantum hardware with error correction to run on numbers large enough to beat classical computers. We do not have this hardware yet. We have factored tiny numbers (like 15 or 21) on quantum devices, but classical calculators can do that instantly.
  *   **Google's 2019 Announcement:** The Sycamore processor did not run Shor's algorithm. It performed a "random circuit sampling" task. This was a proof of principle for **Quantum Supremacy** (now often called Quantum Advantage), showing a quantum device could perform a specific, albeit somewhat contrived, calculation faster than a classical supercomputer. It was a milestone for the *Extended* Church-Turing Thesis, but it was not Shor's algorithm, and it was not a "settled result" that applies to all useful problems.

  ### 3. The "Mature Hardware" Misconception
  You wrote: *"Given how mature the hardware has become..."*

  This is the most fragile premise in your piece. In the field of quantum computing, hardware is widely considered **immature**. We are currently in the **NISQ era** (Noisy Intermediate-Scale Quantum).
  *   **Noise:** Qubits are incredibly fragile. Without error correction, calculations degrade rapidly.
  *   **Scale:** We have hundreds of physical qubits, but we need millions of physical qubits (to create thousands of logical, error-corrected qubits) to run Shor's algorithm on cryptographically relevant numbers.
  *   **Consensus:** Serious computer scientists hedge because the engineering challenge of building a fault-tolerant quantum computer is immense. Until a machine actually factors a 2048-bit RSA number, the claim that quantum speedups are physically realizable at scale remains theoretically sound but experimentally unproven.

  ### How to Fix the Passage
  You want to convey the excitement of the progress without making a claim that experts will reject. Here are three ways to phrase this, depending on the nuance you need:

  **Option 1 (Precise & Safe):**
  > "While the original Church-Turing thesis regarding what is computable remains intact, the *Extended* Church-Turing thesis—which concerns computational efficiency—faces its greatest challenge yet. Theoretical algorithms like Shor's suggest quantum machines could solve specific problems in steps that would take classical supercomputers millennia, provided we can overcome significant hardware hurdles."

  **Option 2 (Focus on the 2019 Milestone):**
  > "Google's 2019 'quantum supremacy' announcement marked a turning point, suggesting that the Extended Church-Turing Thesis may not hold in the physical world. However, while the theory behind algorithms like Shor's is robust, the hardware required to execute them at a useful scale remains years, if not decades, away."

  **Option 3 (General Interest/Punchy):**
  > "Quantum computing promises to rewrite the rules of computational efficiency. If fully realized, algorithms like Shor's would violate the 'Extended Church-Turing Thesis,' proving that nature allows for calculations no classical machine could ever complete in a reasonable timeframe. But while the math is settled, the machinery is not."

  ### Summary for your Editor
  If you need to reply to your editor, you can acknowledge that you conflated the **Church-Turing Thesis** (computability) with the **Extended Church-Turing Thesis** (efficiency), and that you overstated the current maturity of the hardware required to run Shor's algorithm at scale.

  **The Bottom Line:** It is not a settled result. It is a theoretical prediction waiting on engineering validation. Correcting this distinction will make your piece stronger and more authoritative.
