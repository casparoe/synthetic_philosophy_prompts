      *   *Key Point 1:* Save the writer from embarrassment. This is a common misconception, but a serious one in CS circles.
      *   *Key Point 2:* Clarify CTT vs. ECTT. This is the biggest theoretical error.
      *   *Key Point 3:* Clarify the state of hardware. Google's 2019 demo wasn't Shor's.
      *   *Key Point 4:* Provide alternative phrasing.

  6.  **Refining the "Church-Turing" point:**
      *   Make sure to emphasize that a Turing Machine *can* simulate a Quantum Computer, just slowly. Therefore, CTT stands.
      *   The *Extended* thesis is the one under fire.
      *   Even then, it's not "disproven" until a large-scale fault-tolerant machine exists.

  7.  **Refining the "Hardware" point:**
