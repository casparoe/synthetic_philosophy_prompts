answer: |-
  The fluorescent lights of the Tribunal Chamber hummed at a frequency that seemed to drill directly into Elena's molars. She shifted in the witness box, feeling the familiar protest of her lumbar spine. At 8:00 AM, when she'd showered, her back had been straight, painless, elastic. Now, at 2:00 PM, she was bent.

  *How am I the same woman?* she thought, the reflex automatic, worn smooth by years of dissertation drafts she'd never finish. *If I am wholly present at 8:00 AM, and wholly present at 2:00 PM, and the properties of those two presences contradict—one straight, one bent—then logic demands I am not one thing. I am a sequence.*

  She smoothed her blazer. She wasn't here to talk about her back. She was here to talk about Marcus Vane. Or rather, the two men sitting at the defense table who both claimed to be him.

  "Dr. Aris," the prosecutor said. He was young, sharp, and looked at metaphysics the way a carpenter looks at a knot in the wood: something to be cut around. "Let's return to the contract. Marcus Vane signed a non-compete clause three years ago. Yesterday, he entered a TelePort booth in Chicago. Due to a calibration error, the original was not dissolved. A duplicate was printed in Detroit. Both men are now in custody. Both wish to launch a new venture. Who is bound by the clause?"

  "Neither," Elena said. Her voice was steady. She'd done this fifty times. "Or both. But not because they are him."

  "Objection," the defense counsel snapped. "She's equivoking."

  "Overruled," the Judge said. She was an older woman, her face a map of decades of precedence. "Witness, explain."

  Elena looked at the two Vanes. Vane-1 (Chicago) looked tired. Vane-2 (Detroit) looked defiant. They were atom-for-atom identical at the moment of branching. Now, diverging.

  "The law assumes identity is transitive," Elena said. "If A is identical to B, and A is identical to C, then B must be identical to C. It's basic logic. If the Marcus Vane who signed the contract is identical to the man in Chicago, and identical to the man in Detroit, then the man in Chicago is identical to the man in Detroit."

  She paused, letting the absurdity hang in the sterile air. The two men were sitting three feet apart. They were clearly not identical. They occupied different spaces. They had different memories of the last twelve hours.

  "They are not the same man," Elena continued. "Therefore, by transitivity, the original signer cannot be strictly identical to *both* of them. If identity is a one-to-one relation, and the path branches, the identity relation breaks. The man who signed the contract ceased to exist when the booth fired. These are new entities. The contract binds a ghost."

  The prosecutor smiled. It was a thin, dangerous smile. "Dr. Aris, you're arguing from an endurantist perspective. You're treating 'Marcus Vane' as a three-dimensional object that must remain numerically one through time. But this Tribunal adopted the *Standard Model of Persistence* in the 2041 *Duplex* ruling. We are four-dimensionalists here."

  Elena felt a spike of irritation. She knew the model. She'd taught it before she dropped out, before the tenure track swallowed her soul. "You're treating persons as spacetime worms," she said. "Or stages."

  "Precisely," the prosecutor said, turning to the jury. "The person is not a thing that *persists*. The person is a series of momentary stages linked by psychological and physical continuity. The stage of Vane that signed the contract is a past stage. That past stage has two future counterparts: Chicago-Vane and Detroit-Vane."

  He walked toward the defense table. "The obligation doesn't attach to a magical 'self' that floats through time. It attaches to the causal history. Both these men share the causal history of the signing. They both remember signing. They both benefited from the contract. To say only one is bound is to arbitrary privilege one branch of the future over the other."

  "It's not arbitrary if identity is strict," Elena cut in. "If you say both are bound, you're saying they are the same person. But they are diverging. Detroit-Vane might murder someone tomorrow. Chicago-Vane won't. Are they both guilty?"

  "We punish the stage that commits the act," the prosecutor said. "But we hold the lineage responsible for the debt. It's not about identity, Dr. Aris. It's about counterpart relations."

  Elena gripped the railing. This was the dissolving move. The four-dimensionalists didn't solve the puzzle; they dissolved the board. They said the question "Are they the same person?" was a category error. There is no "same." There is only "connected to."

  "Your Honor," Elena said, addressing the Judge directly. "If you accept the prosecutor's view, you are saying that personhood is divisible. That I can be split like a billiard ball of debt. But look at them." She pointed to the Vanes. "They are afraid. They feel singular. If you jail both, you are punishing Chicago-Vane for a decision Detroit-Vane's causal past made, even though Chicago-Vane is now a distinct entity. You are treating them as stages, but they experience themselves as endurers."

  "The law does not care how they feel," the Judge said softly. "It cares about liability."

  "But the metaphysics dictates the liability!" Elena's voice cracked. She took a breath. Her back screamed. *Bent at t1. Straight at t2.* "If you rule for the prosecution, you are codifying Stage Theory. You are saying I am not one person from morning to night. I am a series of selves handing off responsibility. If I get drunk tonight and drive, tomorrow's Elena pays the fine. Why? Because she's a counterpart? Is that justice?"

  The courtroom was silent. The hum of the lights seemed to grow louder.

  The Judge looked down at her bench. She tapped a stylus against the glass surface. "Dr. Aris, do you believe you are the same person who entered this courtroom this morning?"

  Elena hesitated. This was the trap. If she said yes, she undermined her testimony for the defense. If she said no, she undermined her own standing as a witness.

  "I..." She looked at her hands. They were trembling slightly. "I am continuous with her. I share her memories. I bear the consequences of her coffee consumption."

  "But are you *her*?"

  "Strictly? Numerically?" Elena closed her eyes. She saw the dissertation title: *Identity and the Illusion of Persistence*. "No. Not strictly. The properties differ. The matter differs. I am a successor."

  "Then you understand," the Judge said. "The law requires a functional definition of personhood. We cannot allow a technological glitch to dissolve debt. If we adopt your strict identity view, teleportation becomes a loophole for every obligation in the economy. Criminals could step into a booth and walk out innocent."

  "So you punish the innocent copy?"

  "I punish the continuation of the obligor." The Judge sat back. "The Tribunal finds that both defendants are bound by the non-compete clause. The obligation attaches to the pre-branch stage and extends to all valid counterpart futures. Case dismissed."

  The gavel fell. It sounded like a bone breaking.

  Elena stepped down from the box. Her legs felt heavy, like they belonged to someone else. She gathered her files. The two Vanes were being led out. Chicago-Vane looked at her as he passed. There was no anger in his eyes, just a hollow confusion. He knew, somewhere in the gut logic of being human, that he was one thing, whole and singular. And the state had just told him he was half of a sum.

  She walked out into the corridor. The air was cooler there. She leaned against the wall, letting her spine straighten. The pain receded, just a little.

  A young clerk was waiting by the water cooler. He looked familiar. Maybe she'd seen him this morning.

  "Dr. Aris?" he asked. "Great testimony. Though I thought you were going to win on the transitivity argument."

  "Transitivity only works if identity is real," Elena said. She took a paper cup. Her hand shook. She steadied it. "They didn't want truth. They wanted continuity of commerce."

  "Does it matter?" the clerk asked. "I mean, you're still you, right? Regardless of the theory."

  Elena looked at him. She thought about the Elena who had walked into the building at 8:00 AM. That woman had hope. She had thought she might argue her way into a verdict that respected the singularity of the soul. That woman was gone. She had been replaced by this woman, leaning against a wall, selling metaphysics for rent money.

  "I'm not sure," Elena said. She drank the water. It was cold. "But I'm the one who has to drive home."

  She pushed off the wall. Her back clicked. A new property. A new stage. She walked toward the exit, leaving the woman who had testified behind her in the courtroom, one more temporal slice shed in the dark.
