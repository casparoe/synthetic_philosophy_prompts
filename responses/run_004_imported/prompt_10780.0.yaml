answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors, Foundation for Behavioral Replication
  **FROM:** Panel Chair, Small Grants Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Renewal Decision: Project [REDACTED] (Ego Depletion Boundary Conditions)

  **RECOMMENDATION**

  **Defund.**

  After reviewing the proposal for a fourth cycle of funding, the panel recommends terminating support for this research programme. While we acknowledge the theoretical importance of the depletion effect, the methodological trajectory of this specific project now presents an unacceptable risk of contributing to a degenerating research cycle rather than resolving the replication crisis.

  **THE STANDARD: DISTINGUISHING NEPTUNE FROM VULCAN**

  Two panelists rightly objected that labeling a move "ad hoc" is insufficient without a rigorous standard. They invoked the case of Urbain Le Verrier, who posited the planet Neptune to save Newtonian mechanics from the orbital anomalies of Uranus (a success), and later posited the planet Vulcan to save it from the anomalies of Mercury (a failure). Structurally, both moves were identical: an auxiliary hypothesis added to a protective belt to reconcile theory with data. If "adding a variable" is inherently suspect, we risk stifling legitimate scientific refinement.

  To resolve this, the panel adopts the **Novel Risk Criterion** to separate legitimate auxiliary hypotheses from ad hoc rescues. An auxiliary hypothesis is scientifically legitimate only if it meets three conditions:

  1.  **Independent Motivation:** The moderator or variable must be derived from theoretical principles independent of the specific anomaly it is meant to rescue. It cannot be selected simply because it "works" on the failed dataset.
  2.  **Novel Empirical Content:** The revised theory must predict *new* phenomena or boundary conditions that were not part of the original data set used to construct the hypothesis. It must do more than accommodate past failures; it must risk future falsification.
  3.  **Increased Falsifiability:** The revision must make the theory *more* testable, not less. If the new moderator allows the theory to explain *any* outcome (e.g., depletion occurs unless moderator X is present, but if X is absent, depletion occurs unless Y is present), the theory becomes unfalsifiable.

  Le Verrier's Neptune was legitimate because it predicted the *location* of a previously unobserved entity before observation. It risked being wrong. Vulcan was illegitimate because it was a post-hoc patch designed solely to absorb an anomaly without independent evidence, ultimately reducing the falsifiability of Newtonian mechanics until General Relativity superseded it.

  **APPLICATION TO THE GRANTEES**

  The current proposal fails the Novel Risk Criterion.

  1.  **Post-Hoc Construction:** The grantee's moderators (task involvement, trait self-monitoring) were introduced *after* preregistered null replications failed to detect the effect. There is no evidence these variables were part of the original theoretical core; they appear selected specifically to explain the null results.
  2.  **Accommodation vs. Prediction:** The grantee is not predicting a new phenomenon. They are re-describing past failures. The proposal asks for a fourth cycle to test the "latest version," implying the theory is being iteratively modified to fit data as it arrives, rather than risking a bold prediction that could overturn the revision.
  3.  **Diminishing Falsifiability:** After two null replications and two subsequent moderators, the "depletion effect" is becoming increasingly difficult to falsify. Any future null result can be met with a third, unmeasured moderator. This creates a "protective belt" that shields the hard core from refutation, which is the definition of a Lakatosian degenerating programme.

  **THE COUNTER-ARGUMENT (SIDE B)**

  The minority panelists argued vigorously against defunding, and their position deserves a robust hearing. They contend that demanding immediate abandonment after two null replications is historically myopic. As they noted, if the "ad hoc" test had been applied consistently in the 19th century, Le Verrier would have been branded a pseudoscientist for positing Neptune. Newtonian mechanics would have been prematurely discarded, delaying the discovery of a new planet.

  In behavioral science, boundary conditions are real. It is entirely plausible that ego depletion exists but is contingent on specific contextual or trait-based moderators that early research missed. To defund now is to declare the theory dead based on a snapshot of current methodology, potentially throwing out a true effect because we have not yet identified the correct "Neptune." Science often requires a protective belt to survive the initial noise of measurement error. By defunding, we may be prioritizing philosophical purity over the messy reality of discovery, effectively penalizing a researcher for doing the hard work of refining a theory rather than abandoning it at the first sign of trouble.

  **RULING**

  While the minority's historical analogy is philosophically sound in the abstract, it is misapplied in this specific context. The distinction lies in the *temporal ordering of risk*.

  Le Verrier calculated Neptune's position *before* looking through the telescope. He put Newtonian mechanics at risk: if the telescope pointed there and saw nothing, the theory would be in deep trouble. The grantee, conversely, is looking through the telescope, seeing nothing, and then calculating where the planet *should have been*.

  In the first cycle, the grantee predicted a depletion effect. The data said no.
  In the second cycle, they added "task involvement" after seeing the null.
  In the third cycle, they added "self-monitoring" after seeing the null.
  In this fourth cycle, they propose testing the conjunction of these post-hoc fixes.

  This is not the Neptune move (Prediction $\rightarrow$ Observation). This is the Vulcan move (Anomaly $\rightarrow$ Patch $\rightarrow$ Search).

  The Foundation's mandate is to fund *replication work* that clarifies the robustness of behavioral science, not to underwrite the indefinite preservation of a specific theory against mounting contrary evidence. After two preregistered null replications, the burden of proof has shifted. To merit further funding, a proposal must demonstrate *novel predictive power*, not just *retrospective explanatory power*.

  Because this proposal seeks to test moderators derived from previous failures without offering independent, novel predictions that risk falsifying the revised model, it fails the Novel Risk Criterion. We cannot distinguish this from a Vulcan-like rescue attempt until the researchers step out of the cycle of post-hoc accommodation.

  **Decision:** The grant is denied. The researchers are encouraged to submit a new proposal only if it preregisters a novel prediction derived from their moderated theory that is independent of the data used to construct the moderators.

  **[Signature]**

  Panel Chair
