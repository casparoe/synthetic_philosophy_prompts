answer: |-
  Here are a few variations, ranging from a quick one-liner to a longer "post-game analysis" bit, depending on how much time you have to set it up at the bar.

  ### Option 1: The "Post-Game Analysis" (Best for explaining the loss)
  "I was reading up on the Condorcet Jury Theorem to figure out why we lost. Basically, it says a crowd is wise *if* two things are true: One, everyone is slightly better than a coin flip. Two, everyone votes independently. 

  Our team failed both. First, Dave opened his mouth before we voted. So we didn't have six independent variables; we had one variable and five shadows. The errors didn't cancel out; they synchronized. 

  But here's the scary part: Even if we stayed silent, half of us think the capital of Australia is Sydney. That means our individual competence is *under* 50%. And the theorem says if you're under 50%, adding more people doesn't help. It makes the group *more confidently wrong*. We didn't choke. We brought enough people to mathematically guarantee the wrong answer with 99% confidence. We didn't lose to the other team; we lost to the Law of Large Numbers applied to a single idiot."

  ### Option 2: The One-Liner (For when someone says "Too many cooks")
  "Condorcet says if you're better than random and independent, more people equals truth. But if you're worse than random, more people just equals an asymptote of certainty on the wrong answer. We didn't need a bigger team; we needed a smaller sample size to reduce our confidence in being wrong."

  ### Option 3: The "Committee" Pitch (General cynicism)
  "Everyone loves the 'Wisdom of the Crowds' pitch, but they ignore the fine print on the Condorcet theorem. It requires independence. A committee meeting is the exact opposite of independence; it's just a room full of people waiting to see who has the most tenure so they can copy their homework. It's not a jury theorem; it's a correlation coefficient of one, multiplied by the budget."

  ### Why these work for your crowd:
  *   **The "Dave" Factor:** It specifically calls out the violation of the **independence assumption** (correlated errors don't cancel out).
  *   **The "Australia" Factor:** It addresses the **$p < 0.5$** condition (if the average voter is worse than a coin flip, the group competence converges to 0, not 1).
  *   **The "Asymptote/Confidence" Language:** It uses the actual statistical stakes (convergence, confidence, sample size) rather than just saying "we are dumb."

  **Delivery Tip:** The key is to deliver the last line ("Law of Large Numbers applied to a single idiot") with total mathematical seriousness, like you've just discovered a bug in the universe rather than just having a bad trivia night.
