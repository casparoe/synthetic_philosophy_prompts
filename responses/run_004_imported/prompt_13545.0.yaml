          *   Refinement: Focus on the *independence* of the motivation. The DA magnitude depends on the class.
          *   Follow-up: She will likely appeal to "natural kinds" or "epistemic peers." Push on whether "epistemic peer" smuggles in SIA-like assumptions about existence.

      *   *Requirement 3: SIA Rebuttal to PP (Most observers are right).*
