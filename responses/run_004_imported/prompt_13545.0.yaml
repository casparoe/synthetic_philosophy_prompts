      *   **SIA (Self-Indication Assumption):** You should reason as if you are a random sample from all *possible* observers. Leads to the Presumptuous Philosopher problem (believing a theory just because it predicts more observers). Avoids Doomsday. Vulnerable to "Presumptuous Philosopher" and potentially solipsism/infinitarian issues.
      *   **Presumptuous Philosopher (PP):** Two theories, T1 (1 trillion observers) and T2 (1 trillion trillion observers). Physically indistinguishable so far. SIA says T2 is vastly more likely. SSA says 50/50. Intuition says SIA is arrogant/presumptuous.
      *   **Doomsday Argument (DA):** If you are a random human, being born early (rank ~100 billion) suggests total humans won't be vastly larger. SSA implies DA. SIA cancels DA.
      *   **Reference Class Problem:** Who counts as "me" for sampling? All humans? All conscious beings? All observer-moments? SSA needs this to work, but choosing it arbitrarily undermines the DA.

