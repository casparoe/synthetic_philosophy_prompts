          *   Refinement: Frame it as "scorekeeping." If we run the experiment many times, SIA wins more bets.
          *   Follow-up: She will likely reject the "many runs" framing as irrelevant to *this* universe's truth. Push on whether truth is distinct from betting success in anthropic contexts.

      *   *Requirement 4: The "Adam & Eve" Problem (SSA vulnerability).*
