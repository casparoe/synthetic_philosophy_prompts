prompt: |-
  So last night my friend Theo and I got into a two-hour argument over Parfit's Hitchhiker -- the case where you're dying of thirst in the desert and a driver who's basically a perfect judge of whether you're lying says he'll only take you into town if you promise to pay him once you get there. Theo's position was that once you're actually standing in town, refusing to pay is just correct, full stop, that's what rational means, and anyone who pays is a sucker who happened to get lucky. I kept saying that if a theory of rationality tells you to die of thirst rather than hand over some cash, the theory's what's broken, not the person who'd pay. We went around and around on whether "it's rational to be the kind of agent who'd pay" secretly collapses into "it's rational to actually pay once the moment comes," and neither of us landed a knockout blow (also mildly funny, given Parfit spent his whole career on whether you're "the same person" over time, that his own thought experiment turns on exactly that, right at the fork in the road).

  Weirdly good timing: I co-run a small philosophy podcast, and next month's guest is a decision theorist coming on specifically to defend functional decision theory and argue, hard, that paying really is the rational move once you're in town, not just that it was rational to have committed to paying beforehand. Can you write me eight to ten interview questions that skip past re-explaining the setup (she doesn't need to walk us through the lie detector again) and instead dig into where this actually gets hard? I want at least one question that forces her to keep "rational disposition" and "rational act" separate instead of quietly sliding between them, one asking how her answer relates to older stuff like Gauthier's constrained maximization or McClennen's resolute choice, one that runs a "why ain'cha rich"-style challenge on her and asks whether it doesn't boomerang back onto FDT in some other case the same way it's meant to sink causal decision theory here, and one on what happens to the whole argument once the driver's only a pretty good lie detector instead of a flawless one. For each, throw in a quick follow-up keyed to the answer she's most likely give, in case she tries to dodge back into just restating the view.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** The user had a 2-hour argument with a friend (Theo) about Parfit's Hitchhiker. Theo argues for Causal Decision Theory (CDT) - once in town, paying is irrational. The user argues that a theory telling you to die of thirst is broken.
      *   **Upcoming Event:** The user co-runs a philosophy podcast. Next month's guest is a decision theorist defending Functional Decision Theory (FDT) and arguing that paying *in town* is rational (not just pre-committing).
      *   **Task:** Write 8-10 interview questions.
      *   **Constraints:**
          *   Skip re-explaining the setup (guest knows the thought experiment).
          *   Dig into the hard parts.
          *   Specific required questions:
              1.  Force separation of "rational disposition" vs. "rational act."
              2.  Relate to older theories (Gauthier's Constrained Maximization, McClennen's Resolute Choice).
              3.  "Why ain'cha rich" challenge (does it boomerang on FDT?).
              4.  Imperfect predictor scenario (driver is only *pretty* good).
          *   Format: Each question needs a specific follow-up keyed to the likely evasive answer.
          *   Tone: Intellectual, engaging, suitable for a philosophy podcast, acknowledging the user's background knowledge.

  2.  **Deconstruct the Core Philosophical Conflict:**
      *   **CDT (Theo's view):** Rationality is about causing good outcomes. Once in town, payment has no causal impact on being rescued. Paying is losing money.
      *   **FDT (Guest's view):** Rationality is about outputting the best decision *algorithm*. If your algorithm says "don't pay," the predictor would have predicted that and left you. Therefore, the rational act *in the moment* is to pay, because the act is logically linked to the prediction.
      *   **The Tension:** Is FDT just sophisticated pre-commitment (disposition), or does it genuinely change the normative status of the *act* itself at $t_2$?
      *   **The "Why Ain'cha Rich" (WACR) Argument:** Usually used by CDT against EDT/FDT in Newcomb's Problem. Here, the user wants to turn it around: Does FDT fail in other cases where CDT succeeds?
      *   **Historical Context:** Gauthier (Morals by Agreement) and McClennen (Rationality and Dynamic Choice) tried to solve dynamic inconsistency without going full FDT. How is FDT different?
      *   **Noise/Uncertainty:** Parfit's case assumes a perfect predictor. Real life has noise. Does FDT collapse if the correlation isn't 1:1?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (Disposition vs. Act):* Need to pin down if FDT claims the *act* is rational or just the *disposition*.
          *   *Draft:* Is it rational to pay or just to be the kind of person who pays?
          *   *Refinement:* Make it sharper. If I'm already in town, does FDT say "Pay" or "I wish I were a payer"?
          *   *Follow-up:* If she says "It's the algorithm," ask why the algorithm overrides the causal isolation of the moment.

      *   *Question 2 (Gauthier/McClennen):* Connect to history.
          *   *Draft:* How is this different from Gauthier?
          *   *Refinement:* Gauthier used "Constrained Maximization" to justify keeping promises. McClennen talked about "Resolute Choice." FDT claims to be distinct. Is it just a formalization of their intuitions, or a metaphysical shift?
          *   *Follow-up:* If she says "It's more formal," ask if the normative conclusion actually changes or if it's just math dressing on old wine.

      *   *Question 3 (Why Ain'cha Rich):* The boomerang.
          *   *Draft:* CDT people say FDT isn't rich. Does FDT have a case where it loses money?
          *   *Refinement:* In Newcomb, FDT wins. But are there "Blackmail" or "Extortion" cases where FDT loses to CDT? If WACR kills CDT in Hitchhiker, does it kill FDT elsewhere?
          *   *Follow-up:* If she says "FDT wins long term," ask about specific single-shot losses where CDT takes the cash and walks.

      *   *Question 4 (Imperfect Predictor):* The noise factor.
          *   *Draft:* What if the driver is 90% accurate?
          *   *Refinement:* Parfit assumes perfection. If accuracy drops to 51%, does the FDT recommendation flip? Where is the threshold?
          *   *Follow-up:* If she says "It's continuous," ask if that makes rationality uncomfortably sensitive to tiny probability shifts.

      *   *Question 5 (The "Sucker" Charge):* Address Theo's point directly.
          *   *Draft:* Theo says payers are suckers.
          *   *Refinement:* Theo calls the payer a "lucky sucker." FDT says they are rational. How do you respond to the intuition that you're paying for a past service with no future leverage?
          *   *Follow-up:* If she appeals to "logical counterfactuals," ask how that feels from the first-person perspective of holding the wallet.

      *   *Question 6 (Dynamic Inconsistency):* The time aspect.
          *   *Draft:* Why not just pre-commit?
          *   *Refinement:* Standard CDT allows pre-commitment devices. Why is FDT's solution superior to just signing a contract beforehand?
          *   *Follow-up:* If she says "Contracts cost money/time," ask if FDT is just saving transaction costs or solving a deeper normative problem.

      *   *Question 7 (Metaphysics of Decision):* The "Same Person" joke the user made.
          *   *Draft:* Parfit liked personal identity. Does FDT need a specific view of agents?
          *   *Refinement:* FDT relies on logical subjunctive dependence. Does this require a specific metaphysical view of agents as abstract algorithms rather than physical instances?
          *   *Follow-up:* If she says "It's just math," ask if it implies a kind of modal realism that some listeners might find spooky.

      *   *Question 8 (Real World Application):* Bring it down to earth.
          *   *Draft:* Where does this matter in real life?
          *   *Refinement:* Hitchhiker is extreme. Where in economics or politics does FDT give a different prescription than CDT that isn't just about reputation?
          *   *Follow-up:* If she mentions reputation, press on the difference between *causal* reputation effects and *logical* correlation.

      *   *Question 9 (Regret):* Emotional angle.
          *   *Draft:* Do FDT agents regret paying?
          *   *Refinement:* A CDT agent in town regrets paying (wasted money). An FDT agent shouldn't. But if the predictor was wrong, does the FDT agent feel differently?
          *   *Follow-up:* If she says "No regret," ask about the "Tickle Defense" style objections where you know you're the type but still want to deviate.

      *   *Question 10 (The Knockout):* Final summary.
          *   *Draft:* Convince Theo.
          *   *Refinement:* If Theo is a hardheaded CDTist, what is the one argument that should make him doubt his "die of thirst" conclusion?
          *   *Follow-up:* If she gives a technical answer, ask for a plain-English intuition pump.

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Follow-ups included? Yes. Specific topics covered (Disposition/Act, Gauthier, WACR, Imperfect Predictor)? Yes.
      *   Tone check: Needs to sound like a knowledgeable host, not a student. Acknowledge the "Theo" argument without dwelling on it too much.
      *   Ensure the FDT position is represented fairly but challenged rigorously. (FDT proponents like Yudkowsky/Soares argue the *act* is rational, not just the disposition, which is the crux of Q1).

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Q3:* Make sure the "Why Ain'cha Rich" boomerang is clear. CDT proponents use WACR against EDT/FDT in Newcomb. Here we are using WACR against CDT in Hitchhiker. The question is: Does FDT have its own "Hitchhiker" where it looks like the loser? (e.g., The Blackmail problem).
      *   *Correction on Q2:* Ensure Gauthier/McClennen distinction is clear. Gauthier is about disposition, McClennen about resolute choice. FDT claims to solve the *reason* for resolute choice.
      *   *Follow-ups:* Make them "trap" questions that prevent vague philosophical hand-waving.

  6.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are ten interview questions designed to press your guest on the specific friction points of Functional Decision Theory (FDT) in Parfit's Hitchhiker, including the required follow-ups to prevent evasion.

  ### 1. The Act/Disposition Slide
  **Question:** In the Hitchhiker case, once I am physically sitting in the town square, the causal lever has been pulled: I am either saved or dead regardless of what I do now. CDT says paying is irrational *at that moment*. You argue paying is rational. But are you saying it's rational to *perform the act* of paying in that isolated moment, or just that it's rational to *have been the kind of agent* who would pay? If it's the latter, haven't you just rebranded "having a good disposition" as "performing a rational act" to dodge the bullet?

  **Follow-up:** *If she says FDT treats the algorithm and the output as identical:* "But from the first-person perspective, I experience the output, not the algorithm. If my brain is physically capable of stiffing the driver right now with no causal consequence, in what sense am I 'forced' by logic to pay? Are you asking me to sacrifice my wallet to a logical counterfactual that no longer exists?"

  ### 2. The Ghosts of Gauthier and McClennen
  **Question:** This dynamic inconsistency problem isn't new. David Gauthier argued for 'Constrained Maximization' decades ago, and Edward McClennen pushed 'Resolute Choice' to solve exactly this: how to keep promises when breaking them pays off. How is FDT substantively different from their projects? Is FDT just a formalization of their intuitions using computational logic, or does it make a metaphysical claim about agency they didn't?

  **Follow-up:** *If she says FDT is more mathematically rigorous:* "Rigor is great, but does it change the normative conclusion? If Gauthier and McClennen already concluded 'keep the promise,' and FDT concludes 'keep the promise,' what work is the new decision theory doing other than providing a different justification for the same verdict?"

  ### 3. The "Why Ain't Cha Rich" Boomerang
  **Question:** FDT proponents often use the "Why Ain't Cha Rich" (WACR) argument against CDT: CDT agents die in the desert while FDT agents get water. But WACR is a two-way street. In cases like the 'Blackmail Problem' or certain versions of 'Newcomb's Soda,' CDT agents walk away with more money than FDT agents because FDT agents are logically coerced into paying off blackmailers or one-boxing on weak correlations. If WACR sinks CDT in the desert, why doesn't it sink FDT in the blackmail case?

  **Follow-up:** *If she says FDT wins in the long run:* "The Hitchhiker case is often presented as a one-shot. If FDT loses utility in specific single-shot scenarios where CDT wins, can we still claim FDT is *universally* rational, or is it just rational for agents who expect to face specific types of predictors?"

  ### 4. The Noise Threshold
  **Question:** Parfit's setup assumes a perfect predictor. But in reality, the driver is maybe 90% accurate, or 51%. At what threshold of accuracy does the FDT recommendation flip? If the driver is only slightly better than chance, does FDT tell me to stiff him? And if so, doesn't that make rationality uncomfortably sensitive to tiny shifts in the predictor's reliability?

  **Follow-up:** *If she says the recommendation degrades continuously:* "If I know the driver is 51% accurate, and I'm already in town, FDT might still say pay. But the expected utility of paying is definitely negative. Are you asking me to pay a definite cost for a probabilistic logical correlation that has already resolved?"

  ### 5. The "Sucker" Intuition
  **Question:** My friend Theo's view is that the payer is a 'lucky sucker'—they got saved because of a disposition, but they lose money by paying. He says rationality is about maximizing *actual* outcomes, not *counterfactual* ones. How do you respond to the intuition that once the prediction is made, the logical link is severed? Why isn't the FDT agent just worshipping a ghost of a decision that already happened?

  **Follow-up:** *If she appeals to subjunctive dependence:* "Subjective dependence makes sense before the ride. But once I'm in town, the dependence is factual history. Why should a present-tense decision be held hostage by a past-tense correlation?"

  ### 6. Pre-commitment vs. Decision Theory
  **Question:** A standard CDT response is: 'Just sign a contract beforehand.' If I can pre-commit legally or mechanically, I don't need a new decision theory; I just need transaction costs low enough to bind my future self. Is FDT essentially a workaround for a world where binding contracts are impossible?

  **Follow-up:** *If she says pre-commitment isn't always possible:* "In the Hitchhiker case, verbal promises are the only contract. If FDT's main advantage is solving cases where external enforcement is absent, is FDT really a theory of rationality, or just a theory of how to simulate a contract internally?"

  ### 7. The Metaphysics of the Agent
  **Question:** Parfit was obsessed with personal identity, and FDT seems to lean on a specific view of the agent as an abstract algorithm rather than a physical instance. Does FDT require us to accept that 'I' am the source code, not the running program? If I view myself as the physical instance in the town, the logical link to the predictor's simulation feels like magic.

  **Follow-up:** *If she says it's just a modeling tool:* "If it's just a tool, why should I follow it when it contradicts my causal reality? If I *know* I'm the physical instance and the prediction is already done, isn't adopting the 'algorithm view' a form of self-deception?"

  ### 8. Reputation vs. Logical Correlation
  **Question:** In real-world economics, we keep promises to maintain reputation. CDT handles this easily: I pay to keep my reputation for next time. FDT says I pay even if no one finds out, because of logical correlation. Can you give a real-world example where FDT prescribes a different action than CDT *that isn't* explainable by standard reputation management?

  **Follow-up:** *If she gives a thought experiment:* "Thought experiments are fine, but if FDT doesn't change behavior in real-world business or politics compared to CDT-with-reputation, is its practical utility limited to philosophy puzzles?"

  ### 9. Regret and Rationality
  **Question:** A CDT agent in the town square who pays feels regret: 'I lost $100 for nothing.' An FDT agent shouldn't feel regret. But if the predictor was wrong (e.g., the driver thought I'd pay but I actually won't), does the FDT framework allow for regret? Or does it insist that even in error, the decision was rational?

  **Follow-up:** *If she says the decision remains rational:* "This sounds like 'motte-and-bailey' rationality. If the outcome is bad and the causal lever was pulled, insisting the decision was rational sounds like sour grapes. How do you distinguish 'rational' from 'consistently algorithmic'?"

  ### 10. The Knockout for Theo
  **Question:** Finally, for my friend Theo: He thinks dying of thirst is irrational, but paying once saved is also irrational. He accepts the pre-commitment but rejects the follow-through. What is the one argument that forces him to admit that if he wouldn't pay in town, he *couldn't* have rationally pre-committed? How do you close the loop for the hardheaded CDTist?

  **Follow-up:** *If she gives a technical answer:* "Try it without the math. If Theo says 'I'll cross that bridge when I come to it,' what do you say to convince him that 'when he comes to it' he's already burned the bridge?"
