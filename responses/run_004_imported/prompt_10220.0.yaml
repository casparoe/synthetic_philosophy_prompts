answer: |-
  This is a sophisticated objection that comes up frequently in philosophy of science discussions. Your friend is correct that Karl Popper *did* make that claim, but the conclusion they draw from it relies on an outdated snapshot of Popper's thinking that he subsequently corrected.

  Here is a breakdown of why that argument, while historically grounded, does not hold up under current philosophical or biological scrutiny.

  ### 1. Popper Changed His Mind
  The strongest counter-argument is that Popper himself retracted the claim.

  In the 1970s (specifically a 1974 lecture at Darwin College, Cambridge), Popper did describe natural selection as a "tautology" and "almost unfalsifiable." However, he later clarified this position. In his 1976 autobiography, *Unended Quest*, he wrote:

  > "I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."

  Popper came to realize that while the *general principle* of natural selection might look metaphysical in isolation, it becomes highly testable when combined with specific genetic and environmental data. He ultimately concluded that evolutionary theory **is** a valid scientific theory, not pseudoscience like astrology. Using Popper's initial hesitation to discredit evolution ignores his final conclusion on the matter.

  ### 2. The "Tautology" Charge
  The charge that natural selection is a tautology rests on the phrase "survival of the fittest."
  *   **The Criticism:** If you define "the fittest" as "those who survive," then the statement "those who survive are the most likely to survive" is indeed circular and untestable.
  *   **The Biological Rebuttal:** Biologists do not define fitness retrospectively (by who survived). They define it prospectively based on specific **traits** and **environmental conditions**.
      *   *Example:* If we hypothesize that dark-winged moths have higher fitness in soot-covered forests because they are better camouflaged, we can measure the camouflage efficacy and the predation rates *before* observing the population change. If the dark moths *fail* to reproduce more than light moths in that environment, the hypothesis is falsified.

  Because fitness can be measured independently of survival (via physiological traits, reproductive output potential, etc.), the theory is not circular.

  ### 3. Evolutionary Biology is Falsifiable
  To meet Popper's criterion, a theory must state what observations would prove it wrong. Evolutionary biology has many such "falsification conditions."
  *   **J.B.S. Haldane's Famous Quote:** When asked what could falsify evolution, the geneticist Haldane replied, "Fossil rabbits in the Precambrian." Finding a complex mammal in geological strata dating back 500 million years (before mammals evolved) would shatter the theory of common descent.
  *   **Genetic Inconsistencies:** If different genes within the same organism told wildly contradictory evolutionary histories that couldn't be explained by horizontal transfer or hybridization, the tree of life model would fail.
  *   **Maladaptive Traits:** If we consistently found complex traits that reduced reproductive success spreading through populations without any linked beneficial traits (and without drift), natural selection would be falsified as the primary driver.

  The fact that we *haven't* found these things is evidence for the theory, but the fact that we *could* find them makes it science.

  ### 4. The Grain of Truth: "Just-So Stories"
  Your friend's skepticism touches on a valid methodological warning, even if their conclusion is wrong. In 1979, Stephen Jay Gould and Richard Lewontin published a famous paper criticizing the tendency of biologists to create **"Just-So Stories."**

  This happens when a biologist observes a trait and invents an adaptive explanation for it without testing alternative hypotheses (like genetic drift or developmental constraints).
  *   **Bad Science:** "Giraffes have long necks *because* they needed to reach high leaves." (Untestable storytelling).
  *   **Good Science:** "If long necks are for reaching leaves, then neck length should correlate with feeding height during droughts. Let's measure that." (Testable hypothesis).

  Popper's concern was largely aimed at the *former* (untestable storytelling), not the *latter* (rigorous evolutionary modeling). Modern evolutionary biology is acutely aware of this pitfall and demands rigorous statistical testing of adaptive hypotheses.

  ### 5. Astrology vs. Evolution
  Comparing evolutionary biology to astrology is a category error.
  *   **Astrology** makes vague predictions that are retrofitted to events and refuses to specify conditions under which it would be abandoned.
  *   **Evolutionary Biology** makes precise predictions about genetics, biogeography, and the fossil record. It has successfully predicted the discovery of transitional fossils (like *Tiktaalik* or *Archaeopteryx*) based on where and when scientists looked for them.

  ### Conclusion
  Your friend is citing a historical footnote that has been resolved. Popper's initial critique served a useful purpose: it forced biologists to be more rigorous about how they define fitness and test adaptive hypotheses. However, Popper himself acknowledged that the field met that challenge.

  Evolutionary biology is not "untestable storytelling." It is a framework that generates testable predictions, has survived numerous attempts at falsification, and integrates evidence from genetics, geology, and ecology. It fits Popper's final definition of science, even if it briefly tripped over his initial one.
