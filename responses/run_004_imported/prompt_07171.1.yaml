answer: |-
  **Opening Remarks: The Gatekeeper's Tool**
  **Judicial Education Institute Workshop on Scientific Expert Testimony**
  **[Date]**

  Good morning. It is an honor to welcome you to this workshop.

  For the next three days, you will be engaging with some of the most difficult material a trial judge faces. You are not merely deciding disputes of fact; under *Daubert v. Merrell Dow Pharmaceuticals*, you are acting as gatekeepers. You are tasked with determining not just what the evidence says, but whether the evidence is the kind of thing that ought to be heard by a jury at all.

  I am a philosopher of science. For the past decade, I have taught undergraduates about the "demarcation problem"—the philosophical puzzle of how we distinguish science from non-science. In a university classroom, that puzzle is an abstract exercise. We can debate it endlessly. But in your courtrooms, the demarcation problem is not abstract. It is the difference between a verdict based on reliable knowledge and a verdict based on speculation dressed up in a lab coat.

  The Supreme Court, in *Daubert*, pointed you toward a specific tool for this task: Karl Popper's criterion of falsifiability. The Court suggested that a key question is whether a theory or technique can be, and has been, tested. Specifically, can it be disproven?

  I know that for many of you, this has become settled doctrine. It feels like a statute: *If falsifiable, then science. If not, then junk.*

  I want to begin this workshop by complicating that intuition, not to frustrate you, but to make the tool sharper. I have two colleagues from my department sitting in the audience today. They are experts in this field. If I tell you that falsifiability is a magic bullet, they will spend the coffee break dismantling my credibility. But if I tell you that falsifiability is useless, I waste your time and undermine the Supreme Court's guidance.

  So, here is the promise of this talk: We are going to look at what falsifiability does well, where it breaks down, and how you can use it tomorrow not as a definition of "Truth," but as a measure of "Rigor."

  **The Strength: The Risk of Being Wrong**

  Let's start with why the Supreme Court found Popper useful.

  Before Popper, many people thought science worked by verification. You observe a thousand white swans, and you verify the theory that "all swans are white." Popper pointed out the flaw: You can observe a million white swans, and you still haven't proven the theory. But you only need *one* black swan to destroy it.

  For a judge, this is a powerful heuristic. It shifts your focus from *confirmation* to *risk*.

  When you are evaluating an expert's methodology, ask yourself: Does this expert's theory allow for the possibility that they are wrong?

  Junk science often has a way of explaining away every outcome. If the patient gets better, the treatment worked. If the patient gets worse, it was a "healing crisis." If the patient stays the same, the dosage was wrong. A theory that is compatible with every possible state of the world is unfalsifiable. It might be comforting, it might be persuasive, but it is not scientific.

  In your *Daubert* hearings, look for the "black swan." Ask the expert: "What result would have convinced you that your hypothesis was incorrect?" If the answer is "nothing," or if the answer requires moving the goalposts after the data is in, you have identified a lack of scientific rigor.

  This is the great strength of the falsifiability criterion. It exposes dogmatism. It forces the expert to put skin in the game. It distinguishes between an advocate who starts with a conclusion and finds data to support it, and a scientist who starts with a hypothesis and tests it against reality.

  **The Limit: The Binary Trap**

  However, if we stop there, we fall into a trap. And this is where I must acknowledge the complexity my colleagues in the audience know well.

  Falsifiability is not a binary switch. It is not a light that turns green for "Science" and red for "Not Science."

  First, almost anything can be *made* to look falsifiable if you frame it narrowly enough. A proponent of a fringe theory can say, "If this specific instrument reads zero, I am wrong." But if the instrument reads zero, they will blame the calibration, the sample quality, or the environment. This is known in philosophy as the "Duhem-Quine problem." You never test a hypothesis in isolation; you test it along with a whole web of assumptions about your equipment and your background knowledge.

  If you treat falsifiability as a simple checklist item, a clever expert can game it. They can propose a test that is technically falsifiable but practically impossible, or they can dismiss a failed test as an "anomaly" without proper justification.

  Second, good science is often tentative. In emerging fields—novel toxicology, complex epidemiology, new forensic techniques—theories are not always immediately falsifiable in a strict sense. They are provisional. If you apply Popper's criterion too rigidly, you risk excluding cutting-edge science that is reliable but not yet mature. The Supreme Court knew this; that is why *Daubert* lists other factors: peer review, error rates, and general acceptance. Falsifiability is the engine, but those other factors are the steering and the brakes.

  **The Synthesis: From Demarcation to Reliability**

  So, how do we reconcile this? How do you leave here with something usable?

  I suggest you shift your focus from the *status of the theory* to the *conduct of the expert*.

  The philosophical demarcation problem asks: "Is this field Science?"
  The judicial gatekeeping question asks: "Is this testimony Reliable?"

  Falsifiability is best used not to define the essence of science, but to evaluate the integrity of the methodology. It is less about whether the theory *can* be falsified in the abstract, and more about whether the expert *attempted* to falsify it in practice.

  When you write your rulings, do not simply write: "The theory is falsifiable, therefore it is admitted."
  Instead, look for the narrative of testing.

  Did the expert design the study to challenge their own assumption?
  Did they account for alternative explanations?
  When the data conflicted with the hypothesis, did they investigate the conflict, or did they discard the data?

  This approach satisfies the philosophical requirement without paralyzing the legal process. It acknowledges that science is a human practice, prone to error and bias, rather than a mystical state of purity.

  **Practical Application**

  Let me offer three specific questions derived from this view that you can use in your *Daubert* hearings this week.

  First, **ask about the null hypothesis.** In a valid scientific test, the default position is usually that there is *no* effect. The burden is on the expert to show otherwise. Ask the expert: "Did your methodology assume your conclusion was true from the start, or did it assume no connection existed until proven?"

  Second, **ask about the error rate.** Falsifiability implies that errors happen. If an expert claims their method never fails, they are likely not testing it; they are selling it. A willingness to quantify uncertainty is a hallmark of scientific rigor.

  Third, **ask about the peer review process.** Peer review is essentially institutionalized falsification. It is the community of experts trying to find holes in the work before it is published. Ask: "Has this methodology survived the scrutiny of others who have an incentive to prove it wrong?"

  **Conclusion**

  To my colleagues in the philosophy department: I know that Popper is not the final word on the nature of scientific knowledge. Science is messy, social, and historically contingent. But for the purpose of the Federal Rules of Evidence, we do not need a perfect metaphysics of science. We need a standard of reliability that protects the jury from speculation.

  To the judges in the room: You are not being asked to become scientists. You are being asked to assess the *process* by which knowledge is claimed.

  Falsifiability is not a magic wand. It will not solve every *Daubert* motion. But it is a compass. It points you toward experts who are willing to risk being wrong, and away from those who are only interested in being right.

  If you take nothing else from this morning, take this: Science is not defined by its conclusions. It is defined by its willingness to subject those conclusions to the possibility of defeat. Your role is to ensure that the experts who stand in your courtroom have subjected their work to that same standard.

  Thank you. I look forward to the discussions we will have over the next three days.
