answer: |-
  **Disclaimer:** *I am an AI, not an attorney. The following is an analysis of legal arguments and concepts based on general principles of estate law. Estate law varies significantly by state (e.g., Common Law vs. Uniform Probate Code jurisdictions). As the executor, you have a fiduciary duty to follow the law and the will correctly; distributing assets incorrectly can expose you to personal liability. You should rely on the estate attorney's formal opinion for the final decision, using this analysis to understand the dynamics at play.*

  This is a classic estate administration problem, and it is frustratingly common. You are dealing with the doctrine of **Ademption by Extinction**. Under traditional common law, if a will leaves a *specific* item (500 shares of Meridian) and that item is not in the estate at death (because it is now Vantage stock), the gift "adeems" (fails) and the beneficiary gets nothing. The value falls into the "residue" (Marcus's bucket).

  However, the law has evolved significantly to prevent unfair outcomes like this. Here is the breakdown of the five moves, the missing key, and your comparison to Supreme Court jurisprudence.

  ### Part 1: Evaluating Moves (1) through (5)

  **Move (1): Ellie's "Substance Over Form" Argument**
  *   **Verdict:** **Better of it (on equity and modern trends).**
  *   **Why:** Ellie is arguing from the perspective of *equity* and *economic reality*. In an all-stock merger, the shareholder hasn't cashed out; they still own an equity stake in the surviving enterprise, just reconfigured. Most modern courts agree that the "specific property" is the investment position, not the stock certificate itself. While her argument lacks specific legal citations, it aligns with how most judges *want* to rule to avoid an absurd result where a beneficiary is punished because a company got bought out.

  **Move (2): Marcus's "Strict Textualism / Common Law" Argument**
  *   **Verdict:** **Worse of it (on current law, though historically correct).**
  *   **Why:** Marcus is reciting the traditional Common Law rule of Ademption by Extinction accurately. If this were 1920, he would win hands down. However, he is ignoring the last 50 years of legal reform. His point about "boilerplate" is a double-edged sword; while lawyers *can* add "or any shares received in exchange" clauses, courts increasingly rule that such clauses are *implied* in stock bequests to prevent the very injustice he is advocating. He is technically right about the old rule, but likely wrong about the applicable modern rule.

  **Move (3): Ellie's "Statutory Exception & Sloppiness" Argument**
  *   **Verdict:** **Best of it (Legally strongest).**
  *   **Why:** This is the pivot point. Ellie's husband is correct: **Most states have Anti-Ademption Statutes.** For example, under the Uniform Probate Code (UPC § 2-606), if a specific security changes due to a merger, split, or reorganization *without the testator's active intervention*, the beneficiary receives the new security.
      *   Her point about the closed bank account is also legally relevant. It demonstrates a "lack of testamentary intent to revoke." Ademption often presumes the testator *sold* the stock intentionally. Showing the will is otherwise outdated supports the claim that the merger was an oversight, not a choice. This moves the needle from "Common Law" to "Statutory Interpretation," where Ellie has the advantage.

  **Move (4): Marcus's "Statutory Scope & Consistency" Argument**
  *   **Verdict:** **In-Between (Procedurally sharp, substantively weak).**
  *   **Why:** Marcus makes a valid logical point: you can't argue "Intent is King" when it helps you, and "Strict Statutory Text is King" when that helps you. Consistency matters. However, he is likely underestimating the breadth of anti-ademption statutes. These statutes are usually written broadly to cover "any change in form." His caution is good for an executor to hear (don't assume the statute applies without reading it), but his prediction that the statute won't cover a standard merger is likely incorrect.

  **Move (5): Ellie's "Extrinsic Evidence / Oral Intent" Argument**
  *   **Verdict:** **Worse of it (Legally dangerous).**
  *   **Why:** This is Ellie's weakest move. In almost all jurisdictions, **extrinsic evidence of oral statements** ("Grandpa told us it was for her wedding") is inadmissible to contradict or alter the terms of a will, especially regarding ademption. This is to prevent fraud and perjury after the testator dies. Relying on "family memory" undermines her stronger statutory argument. If the statute fails, this argument will not save her. It signals emotional desperation rather than legal strength.

  ---

  ### Part 2: The Missing Element

  Both of them are missing the specific mechanism that usually resolves this cleanly: **The "Change in Form" Doctrine and the Specific State Statute.**

  There is a concept in estate law that distinguishes between **voluntary conversion** (Grandpa sold the Meridian stock and bought Vantage stock) and **involuntary conversion** (The company was merged against the shareholder's will, and the new shares were automatically deposited).

  1.  **The Statute:** You need to ask the estate lawyer one specific question: *"Does our state follow the Uniform Probate Code Section 2-606 (or a similar anti-ademption statute) regarding securities?"*
      *   If **Yes**: Ellie wins. The statute explicitly preserves the gift through mergers, splits, and reorganizations.
      *   If **No** (Common Law State): It gets trickier, *but*...
  2.  **The Judicial Presumption:** Even in states without a specific statute, many courts have adopted a judicial presumption against ademption in cases of *mere change in form*. They reason that the testator intended to give the *value* of the investment, not the specific CUSIP number. Unless Grandpa actively sold the shares, the gift usually survives.

  **The Clean Resolution:**
  The missing piece is the **Brokerage Account Statement history**.
  *   If the 750 Vantage shares are in the account *specifically* resulting from the 2016 Meridian merger (which can be traced via cost basis or transaction history), they are legally considered the "proceeds" or "continuation" of the original specific bequest.
  *   If the lawyer confirms the state has an anti-ademption statute for involuntary conversions (which most do), the fight is over. Ellie gets the 750 Vantage shares. Marcus gets the rest of the residue.

  ---

  ### Part 3: Textualism vs. Purposivism (The Supreme Court Analogy)

  Your intuition is spot on. This is essentially a microcosm of the **Textualism vs. Purposivism** debate, but with a crucial twist unique to estate law.

  **Where the Analogy Holds:**
  *   **Marcus is the Textualist (like Justice Scalia/Gorsuch):** He argues that the law (the will) means what it says. "Meridian" means Meridian. If Meridian doesn't exist, the text cannot be fulfilled. He rejects looking at "what Grandpa really wanted" if the text doesn't support it. He relies on established rules of construction (ademption) rather than equitable outcomes.
  *   **Ellie is the Purposivist (like Justice Breyer/Kagan):** She argues that the *purpose* of the clause was to provide her with that specific investment value. The text is a vehicle for the intent. If the vehicle changes (Meridian becomes Vantage) but the destination (ownership of that company's value) remains, the purpose is fulfilled.

  **Where the Analogy Breaks (The "Intent" Override):**
  In Constitutional or Statutory interpretation, **Text is usually King.** Even if we know what Congress "wanted," if they didn't write it into the law, the Courts often can't enforce it.

  In **Will Interpretation**, **Intent is King.** The text is merely the *best evidence* of intent.
  *   If a statute is ambiguous, a Textualist judge might strike it down.
  *   If a will is ambiguous (or circumstances change), a Probate judge is *empowered* to look beyond the text to effectuate the Testator's intent.

  Therefore, while Marcus is using Textualist *tactics*, he is fighting against the fundamental *constitution* of probate law, which is Intentionalist. In the Supreme Court, Textualism often wins. In Probate Court, Purposivism (Intent) usually wins, provided there is a plausible way to read the text to support it (which the "Change in Form" doctrine provides).

  ### Summary Advice for the Executor

  1.  **Do not decide this yourself.** As executor, if you distribute the Vantage stock to Ellie and a judge later rules it was ademption, *you* are personally liable to Marcus for the value. If you give it to Marcus and Ellie sues, you are liable to Ellie.
  2.  **Demand a Memo from the Estate Attorney.** Tell the lawyer: *"The beneficiaries are disputing the ademption of the Meridian stock due to the 2016 merger. Please provide a written memorandum of law citing the specific state statute or case law that governs involuntary stock conversions in this jurisdiction."*
  3.  **The Likely Outcome:** In 90% of US jurisdictions, **Ellie gets the stock.** The combination of anti-ademption statutes and the "change in form" doctrine is very strong. Marcus is relying on a common law rule that has been largely abolished or softened to prevent exactly this kind of family fighting.
  4.  **Managing the Family:** You can tell them: *"I cannot rule on this based on who argued better. I have instructed the attorney to provide a ruling based on the specific state statutes regarding stock mergers. I will follow their written directive."* This takes the heat off you and forces the lawyer to do their job.

  **Bottom Line:** Marcus is winning the debate on "strict logic," but Ellie is winning on "applicable law." The Textualist/Purposivist analogy is excellent, but remember that in wills, Purposivism (Intent) has a home-court advantage that it doesn't have in the Supreme Court.
