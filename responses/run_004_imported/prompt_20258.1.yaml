prompt: |-
  My grandpa passed away back in March and I ended up as executor of his estate, which has turned into alot more of a headache than I expected. His will was drawn up like 15 years ago and has one specific line leaving "my 500 shares of Meridian Corp stock" to my cousin Ellie, with the rest of his brokerage account (the "residue") split evenly between his other grandkids, including my cousin Marcus. Except here's the wrinkle: Meridian got bought out by a bigger company called Vantage Group in an all-stock merger back in 2016, so by the time grandpa died his 500 Meridian shares had automatically turned into 750 Vantage shares at whatever the exchange ratio was that year. He never sold or bought a single share after that, he just held whatever he recieved in the swap, and never updated the will to even mention Vantage. (For what it's worth, I'm not a beneficiary of this particular part of the estate either way — grandpa left me a flat amount separately for being executor — so I don't gain or lose depending on how the stock question shakes out, I just have to actually implement whatever's correct.)

  At the lawyer's office a couple weeks ago, Ellie and Marcus got into a genuinely heated argument over what should happen to those 750 Vantage shares, and I can't stop turning it over in my head since I'm the one who has to sign off on the distribution. Roughly how it went, in order: (1) Ellie said it's obviously still her stock — the merger was totally outside grandpa's control, the company just changed its name and share count on paper, and the whole point of that line in the will was "give Ellie my position in that company." Treating the gift as if it vanished because of a corporate event he had zero say in feels like punishing her over a technicality. (2) Marcus, who's finishing his second year of law school, said wills have to be read by what they actually say, not by whoever tells the most sympathetic story about what grandpa "really" wanted, and that's exactly why the traditional rule (he called it "ademption by extinction") is that if the exact property named in the will isn't sitting in the estate at death, the gift just fails and drops into the residue. If grandpa's lawyer had wanted the gift to survive a merger, there's boilerplate for that ("or any shares I may receive in exchange therefor") and it simply isn't there. (3) Ellie shot back that the will has at least one other sloppy spot — it still lists a bank account grandpa closed like a decade ago — so his silence about mergers is obviously just him never thinking about it again, not some deliberate choice to cut her out if this ever happened. She also said her husband, who's a corporate lawyer (not trusts and estates, but still), told her most states carve out exactly this situation, that involuntary, automatic stuff like a merger isn't supposed to wipe out a specific gift the same way an actual sale by grandpa would've. (4) Marcus said sure, maybe some states do that, but that just relocates the fight instead of ending it: now we're arguing about whether "all-stock merger" falls inside whatever narrow list of exceptions the statute actually uses, which is a different question than "what would grandpa have wanted," and Ellie doesn't get to lean on a big-picture "his intent is obvious" argument and a narrow technical statutory exception at the same time, whichever helps her more in the moment. (5) Ellie said that's fair, but if the statute doesn't cleanly cover this exact situation, the tiebreaker should still go to grandpa's obvious intent instead of automatically defaulting to "the gift dies," especially since three different family members separately remember him saying some version of "the Meridian stock is Ellie's, that's for her wedding fund."

  Nobody backed down and the lawyer just kind of watched it happen. Could you go through moves (1) through (5) and tell me, for each one, whether that person basically had the better of it, the worse of it, or something in between, and why? Separately, I'd like to know if there's something both of them are missing entirely that would resolve this more cleanly than either framing does. And one more thing, since it's been bugging me: part of me suspects this is basically a smaller-scale version of the whole textualism-vs-purposivism fight I keep half-hearing about in Supreme Court arguments, just playing out over a will instead of a statute — but I honestly don't know if that comparison holds up or if wills run on different logic entirely. Curious what you think.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is the executor of their grandfather's estate. Grandpa died in March. Will is 15 years old.
      *   **The Issue:** A specific bequest of "500 shares of Meridian Corp stock" to cousin Ellie. Meridian was acquired by Vantage Group in an all-stock merger in 2016 (500 Meridian $\rightarrow$ 750 Vantage). Grandpa held the Vantage shares until death but never updated the will.
      *   **The Conflict:** Ellie (beneficiary of specific bequest) vs. Marcus (beneficiary of residue, 2nd-year law student).
      *   **The Debate:** Five specific arguments/moves were made during a meeting.
      *   **Tasks:**
          1.  Evaluate moves (1) through (5) (Who had the better/worse/in-between argument and why?).
          2.  Identify if there's a missing element/factor that resolves this more cleanly.
          3.  Address the comparison between this dispute and the textualism-vs-purposivism debate in constitutional/statutory interpretation.
      *   **Constraint:** The user is neutral (paid executor fee, not a beneficiary of this stock). Needs practical legal insight to make a decision.

  2.  **Legal Principles Involved:**
      *   **Ademption by Extinction:** The common law rule. If a specific bequest is not in the estate at death, the gift fails (adeems). Rationale: The testator likely disposed of it intentionally.
      *   **Anti-Ademption Statutes:** Many states have statutes that prevent ademption in cases of *involuntary* conversion (like stock splits, mergers, conservatorship) where the testator didn't actively sell the asset.
      *   **Testator's Intent:** The paramount rule in will interpretation. However, intent is usually gleaned from the *text* of the will, not extrinsic evidence (like what family members remember him saying), unless there's an ambiguity.
      *   **Stock Merger Specifics:** Generally, courts favor finding that the new stock is a "continuation" of the old stock to prevent ademption, especially in all-stock mergers.

  3.  **Evaluate the Five Moves:**

      *   **Move (1) Ellie:** "It's obviously still her stock... company changed name/share count... point was 'give Ellie my position'."
          *   *Analysis:* This is the "intent/substance over form" argument. It aligns with modern trends and anti-ademption statutes.
          *   *Verdict:* Strong on policy and likely outcome, but weak on strict textualism.
      *   **Move (2) Marcus:** "Wills read by what they say... ademption by extinction... if lawyer wanted it to survive, boilerplate exists... it isn't there."
          *   *Analysis:* This is the strict common law rule. Technically correct in a vacuum 100 years ago. Less correct in many modern jurisdictions with statutes.
          *   *Verdict:* Strong on traditional black-letter law, weak on modern statutory modifications and equity.
      *   **Move (3) Ellie:** "Will has other sloppy spots (closed bank account)... silence on mergers is neglect, not choice... husband (corporate lawyer) says most states carve out involuntary stuff."
          *   *Analysis:* The "sloppy will" argument helps show ambiguity or lack of deliberate intent to revoke. The "corporate lawyer husband" claim about statutes is legally the strongest point she's made.
          *   *Verdict:* Very strong. The statutory argument trumps the common law rule. The "sloppiness" supports applying the statute.
      *   **Move (4) Marcus:** "Maybe some states do that, but relocates the fight... is 'all-stock merger' in the exception?... can't lean on big-picture intent AND narrow technical exception."
          *   *Analysis:* He's right that statutes are specific. He's right that you can't cherry-pick interpretive methods. However, he's underestimating how broadly courts interpret "involuntary conversion."
          *   *Verdict:* In-between. Procedurally correct, but likely losing on the substantive statutory interpretation.
      *   **Move (5) Ellie:** "If statute doesn't cover, tiebreaker should be intent... family remembers him saying 'Ellie's wedding fund'."
          *   *Analysis:* Extrinsic evidence of intent (oral statements) is generally *inadmissible* to contradict clear text or to overcome ademption unless there's a specific exception (like mistake or ambiguity). Relying on "family memories" is legally weak.
          *   *Verdict:* Weak. This is the "dead man's statute" / parole evidence rule territory. Courts hate this.

  4.  **Identify the Missing Element:**
      *   What resolves this cleanly? **The Jurisdiction's Specific Anti-Ademption Statute.**
      *   Most states have adopted the Uniform Probate Code (UPC) or similar statutes.
      *   UPC § 2-606 specifically addresses this. It says if securities change due to merger, split, etc., the beneficiary gets the new securities.
      *   Also, the concept of **"Demonstrative" vs. "Specific" vs. "General"** bequests. Is "500 shares of Meridian" specific? Yes. But statutes often treat stock specifically.
      *   *Key Missing Piece:* The actual state law. Without knowing the state, we are guessing. But the *existence* of the statute is the missing key.
      *   *Another Missing Piece:* The "Change in Form" doctrine. Even without a statute, many courts rule that an all-stock merger is a change in form, not substance, so ademption doesn't apply.

  5.  **Address the Textualism vs. Purposivism Comparison:**
      *   **Marcus = Textualist.** Focus on the words written. If it says Meridian, and there is no Meridian, gift fails.
      *   **Ellie = Purposivist/Intentionalist.** Focus on the goal (give her value/position).
      *   **Does it hold up?** Yes, remarkably well. Wills are private statutes. However, the "Intent of the Testator" is the *supreme* canon of will construction, which tilts the scale more toward purposivism than statutory interpretation (where text is often king). In wills, if intent is clear, courts will often bend text. In statutes, text usually binds.
      *   *Nuance:* In wills, "Intent" is usually derived *from the text*. Extrinsic evidence (Move 5) is where the analogy breaks down slightly compared to legislative history.

  6.  **Drafting the Response:**
      *   *Tone:* Empathetic, professional, objective (since user is executor), legally informative but not legal advice (disclaimer needed).
      *   *Structure:*
          1.  Disclaimer.
          2.  Analysis of Moves 1-5.
          3.  The Missing Key (Statutes & "Change in Form").
          4.  The Textualism/Purposivism Analogy.
          5.  Practical Advice for the Executor.

      *   *Refining the Analysis:*
          *   Move 1: Good intuition, weak legal grounding without statutes.
          *   Move 2: Classic common law, but outdated in many places.
          *   Move 3: Strongest argument (Statutes exist).
          *   Move 4: Valid caution, but likely overly cynical about the statute's breadth.
          *   Move 5: Legally weakest (hearsay/parole evidence).
          *   Missing: The specific state statute (UPC 2-606 is the gold standard here). Also, the distinction between "Specific" and "General" bequests might matter, but usually stock is specific.
          *   Analogy: It holds up well, but with the caveat that "Testator's Intent" is a more powerful override in wills than "Legislative Intent" is in statutes.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "closed bank account" point? Yes, that shows lack of attention, supporting the "involuntary conversion" argument.
      *   *Check:* Did I address the executor's risk? Yes, need to mention that distributing wrongly creates personal liability.
      *   *Check:* Is the distinction between common law and statutory law clear? Marcus is arguing common law; Ellie is arguing statute. This is the crux.
      *   *Check:* Make sure to emphasize that *state law varies*. I cannot give a definitive answer, only a framework.

  8.  **Final Polish:** Ensure the distinction between "Ademption by Extinction" (Common Law) and "Anti-Ademption Statutes" (Modern Law) is the central theme. Ensure the Textualism analogy is nuanced. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to give specific legal advice. I must frame this as legal *information* and *analysis of arguments*, recommending they consult the estate attorney for the final call based on local law.

  *(Refining the "Missing Element")*: It's not just the statute. It's the presumption against intestacy or ademption. Courts *dislike* ademption. They prefer to find the gift survives. Marcus is fighting an uphill battle against judicial preference.

  *(Refining the Textualism Analogy)*: In wills, the "Text" is the will. The "Legislature" is the Testator. The "Agency" is the Court. The goal is intent. Textualists say intent is found *only* in text. Purposivists say look at context. The analogy is very strong.

