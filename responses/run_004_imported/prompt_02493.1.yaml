      *   **The Mechanism:** God creates the act of burning at the moment of contact. This is "Custom" (*'adah*).
      *   **Crucial Nuance:** Ghazali does *not* believe the universe is chaotic or random. It is highly ordered because God is consistent in His Custom. Every event is *directly* willed by God.

  3.  **Analyze Quantum Mechanics (The Pop-Science Version):**

      *   **Key Concept:** Indeterminacy. At a fundamental level, outcomes are probabilistic, not deterministic.
      *   **Interpretation:** Copenhagen (standard) says there is no hidden variable; the randomness is intrinsic to nature.
      *   **Implication:** Event A does not strictly determine Event B. There is a gap.

  4.  **Synthesize: Ghazali meets Quantum Mechanics:**

