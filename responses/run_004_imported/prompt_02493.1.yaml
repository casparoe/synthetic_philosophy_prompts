      *   *Section 1: Ghazali's Core Motivation.* It's not about physics; it's about Power. If nature has power, God is limited. The fire/cotton example is about *ontological dependence*, not just epistemological skepticism.
      *   *Section 2: The QM Encounter.*
          *   *The Good:* QM kills the "Necessary Connection" of the Aristotelians. Ghazali high-fives the physicists for proving fire doesn't *have* to burn.
