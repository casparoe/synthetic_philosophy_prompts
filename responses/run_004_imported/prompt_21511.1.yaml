prompt: |-
  so I've been going down an AI-alignment rabbit hole after work this week (blog posts, some youtube, nothing formal — I'm a backend engineer, not a philosophy guy) and I keep getting stuck on one question that nobody seems to actually argue for, they just kind of assume an answer and move on: when people say they want AI "aligned with human values," aligned with WHOSE values exactly? Everyone from individual labs to whole goverments seems to just pick a mechanism without really defending why that mechanism is the right one. I brought this up with my roommate (also an engineer, zero philosophy training between the two of us) and we argued about it for like an hour and got nowhere, so now I'm curious what you'd say.

  Here's roughly the menu of answers I've run into, can you rank them by how philisophically defensible/coherent they are as an actual solution to the "whose values" problem — not by how popular they currently are in AI safety circles: (1) straight utilitarian aggregation, sum or average everyone's preferences/welfare, (2) Rawlsian veil-of-ignorance reasoning — pick the principles you'd agree to if you didn't know in advance what position you'd end up in, (3) Habermas-style deliberative/discourse consensus among affected parties, (4) "liberal neutrality" — the AI stays procedural and just refuses to bake in any particular conception of the good life, (5) Yudkowsky's coherent extrapolated volition idea, (6) corrigibility, basically the AI just does what whoever built/operates it wants, (7) bargaining/market solutions between stakeholders (think Nash bargaining), (8) training on a fixed "constitution" document, maybe with some crowdsourced input into what goes into it, and (9) a "moral parliament" that gives weight to competing views instead of forcing convergence on one. Feel free to swap in others if I'm obviously missing something.

  Give me a tier ranking, S down to D (S = most defensible/coherent, D = basically incoherent or self-undermining as an answer to this specific question), as a JSON object like:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  and then under the JSON, like 2-3 sentences per tier on why stuff landed where it did. doesn't need to be a whole essay, just enough that I'm not taking the ranking on faith.
