      *   *Refinement on NP vs. DiD:* In NP, the predictor predicts *before* you choose. In DiD, the predictor predicts *where you will be*. The crucial difference for ratifiability is about *conditional probability*.
      *   *CDT (Causal Decision Theory):* CDT says ignore the evidence your action provides about the state of the world (Death's location) and focus on the causal impact. But in DiD, your action *doesn't causally impact* Death's location. Death is already there. But your action is *correlated* with Death's location because of the prediction.
