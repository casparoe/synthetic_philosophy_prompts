      *   *Verdict:* The obstacle is a signpost, not a wall. It tells us "Don't use deductive logic for this." It's a category error.

  7.  **Final Review against constraints:**
      *   Commit to a position? Yes (Artifact View).
      *   Strongest case for each? Yes.
