      *   *The Clash:* Theory $T$ (50% chance) says $F$ has a tiny but non-zero chance ($0.5^{500}$). But if $F$ happens, $T$ is false. So $T$ entails $\neg F$ (in a sense). PP says believe $F$ to degree $0.5^{500}$ given $T$. Logic says believe $F$ to degree 0 given $T$ (because $T$ and $F$ are incompatible).

  4.  **Explain the Fix (The "Revised Principal Principle"):**
      *   Lewis realized he couldn't keep the original PP + Humean Supervenience.
