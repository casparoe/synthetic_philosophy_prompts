answer: |-
  You are remembering correctly, and you have identified exactly the right pressure point. Lewis himself called this problem **"The Big Bad Bug."** He thought it was serious enough that, in the postscript to *A Subjectivist's Guide to Objective Chance* (1986), he essentially conceded that the original Principal Principle (PP) is false if Humean Supervenience is true.

  For a graduate seminar, this is gold. It forces students to choose between a compelling norm for rationality (PP) and a compelling metaphysics of laws (Best System Account).

  Here is a from-the-ground-up walkthrough of the inconsistency, the toy model, the fix, and a critical assessment you can use to drive discussion.

  ---

  ### 1. The Setup: Where the Wires Cross

  To see the bug, we need to hold two commitments together:

  1.  **The Principal Principle (PP):** Roughly, if you know the objective chance of $A$ is $x$, and you have no "inadmissible" evidence (like crystal balls), your credence in $A$ should be $x$.
      $$C(A \mid \text{Ch}(A)=x) = x$$
  2.  **Humean Supervenience (The Best System Account):** Laws and chances are not governing entities; they are summaries of the "Humean Mosaic" (the total distribution of particular facts across all of spacetime). The "chances" are the probabilistic axioms of the system that best balances simplicity, strength, and **fit** with the *total* history of the world (past, present, and future).

  **The Tension:**
  On the Humean view, what the chances *are* depends on the future. But the Principal Principle tells us to use current chances to guide our expectations *about* the future. If a possible future would change what the chances *were*, we have a loop.

  ### 2. The Toy Example: The Undermining Coin

  Let's construct a minimal model where the Best System is determined purely by global frequency.

  **The World:**
  Imagine a world that consists of exactly 1,000 coin tosses.
  *   **The Past:** 500 tosses have occurred. 250 were Heads, 250 were Tails. (50% frequency).
  *   **The Theory ($T$):** Given the past, the "Best System" currently says the chance of Heads is 50% ($Ch(H) = 0.5$). This theory is simple and fits the past perfectly.
  *   **The Future ($F$):** Consider a specific future sequence where the next 500 tosses are **all Heads**.

  **The Conflict:**
  1.  **According to $T$:** The chance of this specific future $F$ occurring is $(0.5)^{500}$. This is tiny, but **non-zero**.
  2.  **According to Humeanism:** If $F$ *actually* occurs, the total history of the world will be 750 Heads and 250 Tails (75% Heads).
  3.  **The Undermining:** If the total history is 75% Heads, the "Best System" for *that* world would likely be a theory $T^*$ that says $Ch(H) = 0.75$.
  4.  **The Contradiction:**
      *   If $T$ is the true theory of chance, then $F$ cannot occur. Why? Because if $F$ occurred, $T$ would *not* be the true theory (since $T^*$ would fit the total history better).
      *   So, $T$ entails $\neg F$.
      *   Therefore, logically, your credence in $F$ given $T$ should be **0**.
      *   **But PP says:** Your credence in $F$ given $T$ (which says $Ch(F) > 0$) should be **$(0.5)^{500}$**.

  You cannot have a credence of 0 and $(0.5)^{500}$ simultaneously. The Principal Principle demands you believe the future is possible; Logic (combined with Humeanism) demands you believe it is impossible (because if it happened, the chances wouldn't be what you think they are).

  ### 3. The Fix: The Revised Principal Principle

  Lewis realized he couldn't abandon Humean Supervenience (it was central to his metaphysics), so he had to sacrifice the original formulation of the PP.

  The problem lies in the conditionalization. The original PP says:
  $$C(A \mid \text{Ch}(A)=x) = x$$

  But in a Humean world, the proposition "$\text{Ch}(A)=x$" is equivalent to "Theory $T$ is the Best System." As we saw, $T$ carries hidden information about the future: it entails that the future will *not* be one that undermines $T$.

  Lewis's fix (in the 1986 postscript) is to replace the unconditional chance with the **chance conditional on the theory being true**.

  **The Revised PP:**
  $$C(A \mid T) = \text{Ch}_T(A \mid T)$$

  Where:
  *   $T$ is the proposition that the current theory of chance is true.
  *   $\text{Ch}_T$ is the chance function defined by theory $T$.

  **How it solves the Bug:**
  Let's apply it to our undermining future $F$.
  1.  We want to find $C(F \mid T)$.
  2.  The Revised PP says this equals $\text{Ch}_T(F \mid T)$.
  3.  What is $\text{Ch}_T(F \mid T)$? It is the chance of $F$ occurring, *given that $T$ is the true Best System*.
  4.  But as we established, if $T$ is the true Best System, $F$ cannot occur (because $F$ would make $T$ false).
  5.  Therefore, $\text{Ch}_T(F \mid T) = 0$.
  6.  Therefore, $C(F \mid T) = 0$.

  **Consistency Restored:** Logic says $C(F \mid T)$ should be 0. The Revised PP says $C(F \mid T)$ should be 0. The contradiction vanishes.

  ### 4. Critical Assessment: Principled or Patch?

  This is the part your students will press. Is this a deep insight or a desperate save? Here is a balanced take you can offer.

  **The Case for "Principled":**
  *   **Honesty about Information:** The fix acknowledges that in a Humean world, chance claims are not "thin" facts. To say "The chance is 50%" is to make a claim about the *entire* mosaic, including the future. Therefore, that claim *should* influence credence about the future beyond just the number 50%. It treats the proposition "Ch(A)=x" with the semantic seriousness it deserves under Humeanism.
  *   **Preserving Supervenience:** It saves the Humean base. If you keep the original PP, you have to admit that chances *don't* supervene on the mosaic (because the mosaic could undermine them while they still guide credence). This fix allows Lewis to keep his metaphysics intact.

  **The Case for "Technical Patch":**
  *   **Loss of Guidance:** The original PP was powerful because it linked credence to *chance*. The Revised PP links credence to *the theory of chance*. But we never know the true Theory $T$ with certainty. We only have evidence for it. The Revised PP tells us how to behave if we *know* $T$, which is a state humans are arguably never in. It makes the principle less action-guiding.
  *   **The "Chance" of the Undermining Future:** Under the original PP, the undermining future had a small, positive chance. Under the Revised PP, the chance of the undermining future (conditional on the theory) is 0. This feels like it changes the subject. We wanted to know the chance of the future *given the current setup*, not the chance of the future *given that the current setup remains the best summary of the whole world*.
  *   **Admitting Defeat:** Lewis essentially admits that the intuitive link between chance and credence is broken for Humeans. The "chance" that guides credence is no longer the "chance" that appears in the laws of nature (unconditional); it is a conditional shadow of it.

  **Seminar Discussion Point:**
  Ask your students: *Does the Revised Principle still capture the "spirit" of objective chance?*
  *   If chance is supposed to be the "guide to life," does it matter if the guide is technically conditional on the truth of the theory?
  *   Or does this show that Humeanism is incompatible with the normative force of chance? (This opens the door to non-Humean accounts like primitivism or dispositionalism, which don't suffer from the Big Bad Bug because their chances don't supervene on the future).

  ### Summary for the Board

  1.  **The Bug:** Humean chances depend on the future. Some futures ("undermining") would change the chances.
  2.  **The Clash:** PP says believe undermining futures are possible (prob $>0$). Logic says if current chances are real, undermining futures are impossible (prob $=0$).
  3.  **The Fix:** Condition on the Theory $T$. $C(A|T) = Ch(A|T)$. Since $T$ rules out undermining futures, $Ch(A|T) = 0$, matching logic.
  4.  **The Cost:** We lose the simple link between unconditional chance and credence. Chance becomes less useful as a guide for agents who don't know the final history of the universe.

  This structure should give your students a concrete grip on the problem while leaving enough philosophical meat for them to argue about whether the cost of the fix is worth paying.
