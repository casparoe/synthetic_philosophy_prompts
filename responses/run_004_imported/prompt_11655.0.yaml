          *   So, if $F$ occurs, $T$ is false.
          *   Therefore, $Ch(F) > 0$ (according to $T$) implies $T$ is false (if $F$ occurs).
          *   But PP says if $Ch(F) = x$, credence should be $x$.
          *   But logic says if $T$ is true, $F$ cannot occur (because if $F$ occurs, $T$ isn't the best system). So $C(F | T) = 0$.
          *   Contradiction: PP says $C(F|T) = x$ (where $x > 0$), Logic says $C(F|T) = 0$.

  3.  **Develop the Toy Example:**
      *   Need a finite sequence of coin tosses.
