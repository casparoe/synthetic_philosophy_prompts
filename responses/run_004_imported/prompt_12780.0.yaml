answer: |-
  This is a brilliant reading of the intellectual genealogy. You have correctly identified that Effective Altruism (EA) and Bloomsbury are not opposites, but rather estranged siblings who inherited different halves of G.E. Moore's *Principia Ethica*.

  Bloomsbury took Moore's definition of the *Good* (states of mind: love, beauty, truth) but rejected Moore's insistence on general rules and consequences.
  Effective Altruism took Moore's *method* (impartial maximization of the good across a population) but arguably instrumentalized the *content* (turning "states of mind" into QALYs and future potential).

  If you sit the 1938 Keynes (writing "My Early Beliefs," sick, aware of the looming war, chastened by the failures of laissez-faire and the naivety of the Apostles) across from a modern Effective Altruist, the conversation would not be a simple clash of "art vs. math." It would be a tragedy of shared premises leading to divergent conclusions about time and purpose.

  Here is how that conversation likely unfolds, structured around three specific philosophical friction points.

  ### 1. On Consequences and Rules (The "My Early Beliefs" Correction)
  The first thing the older Keynes would do is surprise the EA by agreeing with their methodology.

  In "My Early Beliefs," Keynes's deepest regret about the Bloomsbury Group was their "immoralism." He writes that they assumed that because they had the right *states of mind* (love, appreciation of beauty), they didn't need to worry about the *consequences* of their actions or adhere to general rules. He calls this a "monstrous conceit."

  **Keynes:** "You remind me of what we *should* have been, but weren't. We thought being 'good' was a private aesthetic achievement. You treat it as a public accounting problem. In that, you are more Moorean than we were. Moore insisted that ethics was about the consequences of actions on the totality of the good. We ignored the totality; you seem obsessed with it. I cannot fault your rigor. You have accepted the burden of consequences that my friends and I arrogantly discarded."

  **The EA:** "So you agree with earning-to-give? It's the logical conclusion of impartiality."

  **Keynes:** "I agree with the logic. I question the necessity of the premise."

  ### 2. On the "Economic Problem" as Means vs. End
  This is the crux of the conflict regarding "Economic Possibilities for our Grandchildren."

  For Keynes, the accumulation of capital and the "love of money" were psychological holdovers from a time of scarcity. They were a " disgusting morbidity, one of those semi-criminal, semi-pathological propensities which one hands over with a shudder to the specialists in mental disease." He believed that once the economic problem was solved (which he thought would happen within 100 years), humanity would need to return to the "principles of religion and traditional virtue."

  For the EA, the economic engine is not a temporary bridge to be crossed and burned; it is the primary lever for moral action. Earning-to-give requires maintaining the "purposive" instinct (the drive to make money) indefinitely, because there is always more suffering to prevent or more future lives to secure.

  **Keynes:** "Here is where we part ways. You have taken the 'love of money'—which I hoped my grandchildren would outgrow—and you have sanctified it. You tell the high-earner: 'Do not feel guilty about your wealth; it is a tool for the good.' But in doing so, you ensure that the 'economic problem' is never solved. You perpetuate the state of scarcity, psychologically if not materially. You are asking humanity to remain in the 'tunnel' of economic necessity forever, because there is always another calculation to be made, another margin to optimize."

  **The EA:** "But the suffering is real. If I can make $500,000 and save 500 lives, why should I stop to 'enjoy beauty'? That's the Bloomsbury selfishness you criticized."

  **Keynes:** "It is not selfishness I advocate; it is the *end* of striving. You have turned altruism into a new form of striving. You are the ultimate 'purposive' men. I wanted us to learn to live without purpose, in the sense of economic purpose. You argue that moral purpose must replace economic purpose. But if that moral purpose requires the same psychological machinery as the economic purpose—the grinding calculation, the deferral of gratification, the endless accumulation—then you have not liberated us from the tunnel. You have just painted the walls with better statistics."

  ### 3. On Longtermism and the "Now"
  Keynes's essay is titled "Economic Possibilities for our *Grandchildren*." It is a deeply intergenerational view, but it is bounded. He is looking toward a horizon where the struggle ends.

  Longtermism posits a horizon that effectively never ends (potential billions of years of future civilization). This creates a moral demand that can never be satisfied.

  **Keynes:** "You speak of the future as a vast ledger of potential lives. I spoke of my grandchildren as people who would finally be free to sit in the sun. You fear that if we stop optimizing, the future collapses. I fear that if we *never* stop optimizing, the present evaporates. Moore said the only things valuable for their own sake were states of mind. But a state of mind cannot be experienced by a statistical aggregate. It must be experienced by a person, in a moment. By deferring the 'good life' indefinitely in service of a future that may not exist, you risk creating a world that is safe, rich, and utterly devoid of the things that make safety and richness worth having."

  ### The Verdict: The "Virtuous Accountants"
  Keynes would not dismiss the Effective Altruist as cold. He would recognize them as the heirs to the part of Moore that Bloomsbury betrayed: the demand for objective truth and consequence.

  However, he would view them with a profound, melancholic pity. He would see them as **virtuous accountants of the apocalypse.**

  He would say something like this:

  > "You are the children of Moore who took the calculus seriously, and I respect you for it. My friends and I were beautiful fools; you are rigorous engineers. But you have made a category error. You believe that because the *means* of salvation are economic (allocation of resources), the *end* of salvation must be managed economically.
  >
  > I predicted that we would solve the economic problem so that we could stop being economists. You have found a way to make us economists forever. You have moralized the 'love of money' so that it never has to die. In saving the world, you may deny it the one thing I thought was the point of saving it: the permission to stop trying to save it, and simply live."

  ### The Intellectual Synthesis for Your Piece
  For your reporting, the key insight is that **EA is Bloomsbury inverted.**

  *   **Bloomsbury:** Private good, immediate, anti-consequentialist, anti-money.
  *   **EA:** Public good, deferred/longterm, hyper-consequentialist, pro-money (as tool).

  Keynes stands in the middle, regretting the Bloomsbury lack of rigor but fearing the EA perpetuation of the "economic treadmill." He represents the tragic realization that solving the economic problem doesn't automatically solve the human problem, but neither does turning the human problem into an economic one.

  He would tell the EA: **"You have solved the moral calculus, but you have forgotten the moral rest."**
