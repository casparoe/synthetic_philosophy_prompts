  The Total View claims the top spot over Lexical Views primarily because it preserves **continuity** and **dominance**, which are foundational to rational decision-making under uncertainty—a critical requirement for longtermist planning. Lexical views avoid the Repugnant Conclusion by positing that some welfare levels are infinitely more valuable than others, but this creates discontinuities where infinitesimal changes in welfare trigger infinite shifts in value. This makes expected utility calculations unstable or impossible, leading to "fanaticism" problems where tiny probabilities of lexical goods outweigh certain immense non-lexical goods. The Total View's liability (the Repugnant Conclusion) is a substantive moral claim that may simply be true, whereas the Lexical View's liability breaks the formal machinery needed to act on any moral theory consistently.
