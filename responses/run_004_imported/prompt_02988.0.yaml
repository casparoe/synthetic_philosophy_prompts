          *   If Child uses the *exact* same rules, Parent can't mathematically guarantee Child won't go crazy (Gödel/Löb).
          *   To guarantee safety, Parent must use *stronger* rules than Child.
          *   Problem: If Child makes Grandchild, Grandchild must be weaker still. Eventually, the system becomes too stupid to function. This is the "Tiling" problem.

      *   **Implication 1: The "Proof" Bottleneck:**
          *   This only matters if you require *mathematical proof* of safety.
