      *   *The Consequence:* By Löb's Theorem, if A can prove that reflection principle, A can prove *anything* (inconsistency).
      *   *The Workaround (and its failure):* Usually, A trusts B only if B uses a *stronger* logic. But then B needs C with even stronger logic. This is the "Procrastination Paradox" or infinite regress. You can't have a stable lineage.
