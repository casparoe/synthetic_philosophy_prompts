      To speak for [Name] is to operate within the constraints she valued most: truth, clarity, and a refusal of comfortable lies. She was a historian of ideas, but she lived by them. She spent her career studying Frank Ramsey, the Cambridge philosopher who died at twenty-six. She died at fifty-four. Both knew that the length of a life does not dictate its weight.

      She often spoke about Ramsey's essay "Epilogue." She did not find it comforting in the traditional sense. Instead, she found it liberating. Ramsey wrote that he felt no humility before the vastness of the heavens. He noted that however large the stars are, they cannot think or love. It is qualities like those, not sheer size, that make anything matter.

