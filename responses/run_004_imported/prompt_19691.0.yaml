          *   Bayesian Priors (Probability of arbitrary jumps).
      4.  **The "Habit" Question:** It's not *just* habit; it's a methodological necessity.
      5.  **Conclusion:** You are rational to bet on stability, not because the data forces it, but because the alternative is scientifically bankrupt.

  8.  **Tone Check:** Professional, analytical, empathetic to the frustration, philosophically grounded but practical. (Avoid being too academic, but use the terms correctly).

  9.  *(Self-Correction during drafting)*: Make sure to emphasize that in engineering, "stable until T then jump" is a *different class* of model. It's a "change point model." Change point models require evidence of a change mechanism.

