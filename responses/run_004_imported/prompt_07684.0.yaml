      *   **Section 2: Beyond Indirect Duty (The IACUC Mandate).** Shift to the regulatory reality. IACUC isn't just an ethics club; it's a compliance body. The Animal Welfare Act and PHS Policy require minimization of pain/distress *for the animal's sake* as part of the utilitarian-style risk/benefit analysis. We cannot legally reduce the animal to a mere tool, even if Kant did. Mention Korsgaard briefly as a bridge (animals as "passive ends").
      *   **Section 3: The Recommendation (Approve with Conditions).** Specific conditions needed.
          *   Enhanced monitoring (humane endpoints).
          *   Psychological support/debriefing for staff (addressing the indirect duty concern directly).
          *   Justification of stressor intensity (addressing the direct duty concern).
      *   **Closing:** Reiterate the goal (ethical science).

  5.  **Refining the Tone:**
      *   Avoid being preachy.
      *   Avoid jargon overload (keep it clear for scientists who might not be philosophers).
      *   Ensure the Kantian references are accurate but not pedantic.
