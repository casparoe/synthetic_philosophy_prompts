      *   **User's Stance:** Acknowledges the scientists' Kantian gloss is accurate (not a strawman) but believes Kantian resources (e.g., Korsgaard) allow for stronger animal protection. Wants a recommendation (Approve/Modify/Reject) that engages seriously with the indirect-duty argument but moves beyond it.
      *   **Tone:** Professional, philosophical but accessible, persuasive, respectful of the committee's regulatory role.
