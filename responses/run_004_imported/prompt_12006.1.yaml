prompt: |-
  so we've been doing the frege-geach problem in my metaethics seminar (you know, the 'if lying is wrong then getting your little brother to lie is wrong, lying is wrong, therefore...' argument, and how expressivists have to explain why that's valid when 'wrong' only expresses disapproval instead of stating a fact). two people in my discussion group got into it after class and I honestly can't tell who won.

  Leah said Gibbard's whole hyperplan move is basically a con: saying the conditional expresses 'ruling out' the combo where you disapprove of lying but don't disapprove of getting your brother to lie doesn't explain why that combo is inconsistent, it just names it and calls the naming a solution. Owen said thats not fair -- cognitivists don't explain why P and not-P can't both be true either, consistency has to bottom out somewhere on any theory, so expressivism isnt worse off. Leah said fine, but look at what the bottoming-out actually requires here: to validate modus ponens for every complex sentence you need something that behaves exactly like possible worlds -- worlds paired with a hyperplan, closed under the same boolean structure, with 'ruled out' doing the job 'false at' does for a cognitivist. That's not bottoming out the same way, that's importing the cognitivist's machinery and slapping a new label on it. Owen said the machinery looks the same on paper but isn't doing the same job, because hyperplans are individuated by motivational role rather than representational content, which is exactly why the view can predict things truth-conditional semantics can't, like two people disagreeing morally without disagreeing about any fact.

  Can you go through their exchange move by move and say who's got the better of it at each stage (and where each one has a genuine point, not just an overall winner)? Also say if there's something important both of them are missing.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**
      *   **Context:** Metaethics seminar, Frege-Geach Problem (FGP).
      *   **Core Issue:** How expressivism accounts for logical validity (specifically Modus Ponens) when moral terms express attitudes (disapproval) rather than beliefs/facts.
      *   **Characters:** Leah (Critic of Gibbard/Expressivism) vs. Owen (Defender of Gibbard/Expressivism).
      *   **Task:** Analyze their exchange move-by-move, determine who has the better of it at each stage, identify genuine points on both sides, and identify what *both* are missing.

  2.  **Analyze the Dialogue (Move-by-Move):**

      *   **Move 1: Leah's Opening Salvo.**
          *   *Claim:* Gibbard's "hyperplan" solution is a con. It just *names* the inconsistency (ruling out the combo of disapproving of lying but not disapproving of getting brother to lie) without *explaining* it.
          *   *Assessment:* This is a classic "logical consistency objection" to expressivism (often associated with Schroeder or Hale). Leah is arguing that expressivists are merely *labeling* the problem away rather than solving it.
          *   *Verdict:* Strong point. It highlights the difficulty of explaining *why* holding conflicting attitudes is irrational in the same way believing contradictions is irrational.

      *   **Move 2: Owen's Counter.**
          *   *Claim:* Cognitivists don't explain why $P$ and $\neg P$ can't both be true either. Consistency has to "bottom out" somewhere. Expressivism isn't worse off.
          *   *Assessment:* This is the "parity argument." Owen is saying logic requires primitive norms of consistency regardless of the semantic content. If cognitivists get a pass for taking logical consistency as primitive, expressivists should too.
          *   *Verdict:* Also a strong point. It challenges Leah to show a *disparity*, not just a difficulty.

      *   **Move 3: Leah's Rebuttal (The "Importing Machinery" Objection).**
          *   *Claim:* To validate Modus Ponens, expressivists need "worlds + hyperplans" closed under boolean structure where "ruled out" acts like "false." This isn't bottoming out; it's importing cognitivist machinery and relabeling it.
          *   *Assessment:* This is the deeper metaphysical/structural objection. Leah is arguing that the *formal semantics* required to solve FGP makes expressivism look indistinguishable from cognitivism (quasi-realism collapsing into realism). If you need "worlds" and "truth-conditions" (even if called "acceptance conditions"), haven't you surrendered the expressivist core?
          *   *Verdict:* Very strong. This touches on the "problem of creeping minimalism." If the semantics looks truth-conditional, is it still expressivism?

      *   **Move 4: Owen's Defense (The "Motivational Role" Distinction).**
          *   *Claim:* The machinery looks the same but does different work. Hyperplans are individuated by *motivational role*, not representational content. This predicts disagreement without factual disagreement.
          *   *Assessment:* Owen is appealing to the *functional* role of the states. Even if the logic is isomorphic, the *nature* of the mental state is different (conative vs. cognitive). This preserves the core expressivist insight (moral judgment motivates).
          *   *Verdict:* Strong, but vulnerable. It relies on a clear distinction between cognitive and conative states, which is philosophically contentious.

  3.  **Evaluate "Who Won" at Each Stage:**
      *   *Round 1 (Leah):* Leah wins on the specific charge of "naming vs. explaining." Gibbard's early formulations often felt like stipulation.
      *   *Round 2 (Owen):* Owen wins on the parity point. Logic *does* bottom out somewhere for everyone. Leah needs to show expressivism bottoms out in a *worse* place.
      *   *Round 3 (Leah):* Leah wins on the structural isomorphism point. This is the hardest hit for expressivism. If the semantics is identical, the metaphysical advantage shrinks.
      *   *Round 4 (Owen):* Owen wins on the phenomenological/functional distinction. Even if the logic is the same, the *experience* of moral judgment (motivation) is the expressivist's home turf.

      *   *Overall:* It's a draw, but Leah exposes the structural cost, while Owen defends the functional core.

  4.  **Identify What Both Are Missing:**
      *   *The "Ecumenical" Shift:* Both are assuming a stark dichotomy (Cognitivism vs. Expressivism). Modern metaethics often blends these (Hybrid views, Ecumenical Expressivism).
      *   *The Nature of Logic:* They are treating logic as purely formal/semantic. Some (like inferentialists) argue logic is grounded in *practice*, not semantics.
      *   *Schroeder's Specific Contribution:* Leah mentions Gibbard, but Mark Schroeder's *Being For* is the definitive technical treatment of this. He argues expressivists *can* explain inconsistency via "B-type" inconsistencies of attitudes, not just A-type (belief) inconsistencies. Neither mentions the specific mechanism of *attitude types*.
      *   *The "Negation" Problem:* They focus on Modus Ponens, but the deeper issue is often negation (what does it mean to *not* disapprove?).
      *   *Metaphysical Commitments:* They assume "worlds" are cognitivist property. But cognitivists also struggle with what "possible worlds" *are*.

  5.  **Drafting the Response:**
      *   *Tone:* Academic but accessible (seminar discussion style).
      *   *Structure:*
          1.  Intro (acknowledge the depth of the debate).
          2.  Move-by-Move Analysis (Leah 1, Owen 1, Leah 2, Owen 2).
          3.  Scoring (Who had the better point).
          4.  The "Missing Middle" (What they overlooked).
      *   *Key Concepts to Weave In:* Quasi-realism, Creeping Minimalism, Parity Argument, Inferentialism, Hybrid Views, Schroeder's B-type inconsistency.

  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say Gibbard *failed*. His later work (*Thinking How to Live*) addresses this. Leah is critiquing a specific interpretation of the hyperplan solution.
      *   *Nuance:* Owen's point about "motivational role" is the standard expressivist defense, but Leah's point about "importing machinery" is the standard realist counter (the "Queer" argument updated). I need to make sure I don't bias towards one.
      *   *Crucial Missing Point:* The distinction between *semantics* and *psychology*. Expressivism is primarily a psychology of moral judgment, but FGP forces it into semantics. Both students are conflating the semantic fix with the psychological claim.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Move by move? Yes.
      *   Who has the better of it? Yes.
      *   Genuine points for both? Yes.
      *   What are they missing? Yes.

      *(Self-Correction on "Who Won"):* Avoid declaring a definitive "winner" of the whole debate, as this is an ongoing philosophical stalemate. Instead, evaluate who won the *exchange* at that specific juncture.

      *(Refining the "Missing" section):* The biggest thing they are missing is **Inferentialism**. If logic is about rules of inference rather than truth conditions, the FGP dissolves differently. Also, **Hybrid Expressivism** (like Copp or Ridge) which says moral sentences express *both* belief and attitude.

      *(Refining Leah's Move 3):* This is essentially the "Creeping Minimalism" objection (Dreier). I should name-drop that concept as it adds value.

      *(Refining Owen's Move 2):* This is the "Parity Argument." I should name-drop that too.

      *Let's structure the response clearly.*

      *   **Introduction:** Set the stage (FGP is the expressivist's cross to bear).
      *   **Round 1:** Leah (Naming vs. Explaining) vs. Owen (Parity).
      *   **Round 2:** Leah (Creeping Minimalism/Structure) vs. Owen (Functional Role).
      *   **The Verdict:** Scorecard.
      *   **The Blind Spot:** Inferentialism, Hybrid Views, and the Psychology/Semantics distinction.

      *Wait, one more check:* Did Leah accurately describe Gibbard? Gibbard's hyperplans *do* try to explain inconsistency via planning norms. Leah says it just "names" it. Owen says consistency bottoms out for everyone. This is accurate to the literature.
      Did Owen accurately describe the advantage? Yes, disagreement without factual disagreement is the expressivist selling point.

      *Okay, ready to write.*
answer: |-
  This is a fantastic exchange. It captures the exact tension that has defined metaethics for the last 40 years: the struggle between preserving the *logic* of moral discourse (Leah's concern) and preserving the *nature* of moral judgment (Owen's concern).

  Neither of them has "won" in a knockout sense, because this debate is essentially the current state of play in the literature. However, we can score the rounds based on philosophical leverage. Here is the move-by-move breakdown, followed by what they are both missing.

  ### Round 1: The "Naming vs. Explaining" Objection
  **Leah:** Gibbard's hyperplan move is a con; it names the inconsistency ("ruling out" the combo) without explaining *why* it's inconsistent.
  **Owen:** Cognitivists don't explain why $P$ and $\neg P$ are inconsistent either; consistency has to bottom out somewhere.

  *   **Analysis:**
      *   **Leah's Point:** She is articulating the **Logical Consistency Objection**. Early expressivism (Ayer, Stevenson) struggled to explain why holding conflicting attitudes was *irrational* rather than just psychologically difficult. Leah is arguing that Gibbard is stipulating a norm ("you shouldn't hold this combo") without grounding it.
      *   **Owen's Point:** He is deploying the **Parity Argument**. This is a standard and powerful defense. In classical logic, the Law of Non-Contradiction is often taken as primitive. If realists don't have to explain *why* truth excludes falsity at the fundamental level, why must expressivists explain *why* disapproval excludes tolerance at the fundamental level?
  *   **Who has the better of it?** **Owen.**
      *   **Why:** Leah sets the bar too high. No logical system explains its own axioms without circularity. If expressivism can show that moral inconsistency is *structurally analogous* to logical inconsistency, that is usually sufficient. Owen correctly identifies that demanding a deeper "explanation" of consistency is a trap for everyone, not just expressivists.

  ### Round 2: The "Importing Machinery" Objection
  **Leah:** To validate Modus Ponens, you need worlds + hyperplans closed under boolean structure. That's just importing cognitivist machinery and slapping a new label on it.
  **Owen:** The machinery looks the same but does different work. Hyperplans are individuated by motivational role, not representational content. That predicts disagreement without factual disagreement.

  *   **Analysis:**
      *   **Leah's Point:** This is the **Creeping Minimalism** objection (famously associated with James Dreier). If an expressivist semantics requires "truth-conditions" (or acceptance conditions), "possible worlds," and boolean operators that function exactly like standard logic, in what sense is it no longer realism? Leah is arguing that the *cost* of solving Frege-Geach is surrendering the metaphysical simplicity that made expressivism attractive in the first place.
      *   **Owen's Point:** He is defending the **Functional/Psychological Core**. Even if the *semantics* (the logic) looks identical, the *psychology* (what is happening in the head) is different. For the cognitivist, moral judgment is a belief about the world. For the expressivist, it is a plan or attitude. Owen is right that this preserves the expressivist explanation of motivation and "faultless disagreement."
  *   **Who has the better of it?** **Leah (slightly).**
      *   **Why:** This is the harder hit. Owen's defense relies on a clear distinction between "motivational role" and "representational content." But if the hyperplan semantics behaves *exactly* like truth-conditions, many philosophers argue the distinction collapses. If it walks like a duck (truth-conditions) and quacks like a duck (logic), calling it a "hyperplan" starts to look like semantic jiu-jitsu. Leah correctly identifies that solving Frege-Geach forces expressivism to become "quasi-realist" to the point where it risks becoming indistinguishable from realism.

  ### Overall Scorecard
  *   **Leah:** Won the structural/metaphysical round. She exposed that solving Frege-Geach makes expressivism look suspiciously like the rival theory.
  *   **Owen:** Won the foundational/psychological round. He showed that Leah is asking for an impossible explanation of logic and that expressivism still offers a better account of moral motivation.
  *   **Verdict:** **Draw.** This is exactly where the field currently sits. Expressivists (like Gibbard and Schroeder) accept Leah's point (they admit the semantics looks realist) but insist Owen's point (the psychology is different) is what actually matters.

  ---

  ### What Both of Them Are Missing

  While Leah and Owen have grasped the standard dialectic, they are both overlooking three crucial developments in the literature that might dissolve their stalemate.

  #### 1. Inferentialism (The Logic is in the Practice, not the Semantics)
  Both students assume that to solve Frege-Geach, you need a **semantic** solution (i.e., you need to define what "worlds + hyperplans" *are*). They are missing the **inferentialist** turn (associated with Robert Brandom and, in metaethics, Daniel Star or Michael Williams).
  *   **The Missing Point:** Logic isn't about relations between "worlds" or "truth conditions"; it's about rules of inference in social practice. Validity isn't about preserving truth; it's about preserving *commitment*.
  *   **Why it matters:** If logic is about what commitments you undertake when you make a claim, the expressivist doesn't need to import "worlds." They just need to show that asserting "Lying is wrong" undertakes a commitment that is incompatible with asserting "Getting your brother to lie is okay." This solves Frege-Geach without the "importing machinery" problem Leah worries about.

  #### 2. Hybrid Expressivism (The False Dichotomy)
  Both are arguing as if it must be *either* beliefs (Cognitivism) *or* attitudes (Expressivism).
  *   **The Missing Point:** **Hybrid Views** (e.g., Michael Ridge, David Copp) argue moral sentences express *both* a belief (e.g., "Lying has feature N") and an attitude (e.g., "I disapprove of N").
  *   **Why it matters:** This solves Frege-Geach easily because the *belief* component handles the logic (it has truth conditions), while the *attitude* component handles the motivation (Owen's point). Leah's worry about "importing machinery" vanishes because they *admit* they are using cognitivist machinery for the logic. Owen's worry about motivation is preserved because the attitude component remains.

  #### 3. Mark Schroeder's "B-Type" Inconsistency
  Leah claims Gibbard just "names" the inconsistency. Owen says consistency "bottoms out." Both are missing Mark Schroeder's specific technical solution in *Being For*.
  *   **The Missing Point:** Schroeder distinguishes between **A-type inconsistency** (believing $P$ and believing $\text{not-}P$) and **B-type inconsistency** (having two attitudes of the *same kind* toward incompatible objects).
  *   **Why it matters:** Schroeder argues expressivists *can* explain the inconsistency non-circularly. It's not just "naming." It's that the mental state of "disapproving" has a specific functional role that makes holding it toward $X$ and $\text{not-}X$ a failure of the same kind that believing $P$ and $\text{not-}P$ is. This gives Leah a more nuanced critique (is the B-type explanation successful?) and Owen a stronger defense (it's not just parity, it's a specific structural analogy).

  ### Summary for Your Seminar
  If you want to jump into this discussion:
  1.  Tell **Owen** he's right about parity, but he needs to address **Creeping Minimalism** (Leah's second point). If the semantics is identical, does the psychological difference matter enough?
  2.  Tell **Leah** she's right about the structural cost, but she's assuming logic requires **truth-conditions**. Ask her about **Inferentialism**.
  3.  Tell **both** of them to read **Mark Schroeder**. He basically wrote the book on exactly this exchange, and he argues that expressivists *can* explain inconsistency without collapsing into realism, provided they get the psychology of "being for" right.

  **The real winner?** Probably Schroeder, but the debate is very much alive.
