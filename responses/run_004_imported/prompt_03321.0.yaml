prompt: |-
  Quick one from left field. I've been teaching the bit in The World as Will and Representation where Schopenhauer says melody is basically the will's own biography in sound - it wanders away from the keynote and eventually finds its way back, and the whole business with suspensions and dissonance is desire being painfully delayed before its satisfied. A student asked what he would've made of fully atonal music, like Schoenberg's twelve-tone stuff, where theres no home key to ever leave or return to in the first place. Would Schopenhauer say that just isn't music by his own lights, or could his theory somehow stretch to cover it, maybe as the sound of a will that never resolves? Genuinely curious what you'd say and why.
reasoning: |-
