answer: |-
  ### Why the "Trust the Within-Group Result" Rule Fails

  The standard rule of thumb for Simpson's Paradox—that one should trust the stratified (within-group) result because the pooled result is confounded—relies on a specific causal assumption: that the third variable ($Z$) is a **confounder**.

  A confounder is a pre-existing factor that influences both the treatment ($X$) and the outcome ($Y$). In this case, the pooled data is indeed biased, and stratifying is necessary to isolate the true causal effect.

  However, this rule fails when $Z$ is not a confounder but a **mediator** (or an effect of the treatment). A mediator is a variable that lies on the causal pathway between $X$ and $Y$. In this scenario, stratifying by $Z$ blocks the very mechanism through which the treatment works. By "controlling" for the mediator, you remove the treatment's effect, potentially leading to a misleading reversal where the treatment appears ineffective or harmful in every group, even though it is beneficial overall.

  ### Concrete Scenario: The Fertilizer Paradox

  To illustrate a case where the **pooled** data is correct and stratifying is a mistake, consider a scenario involving a new fertilizer.

  *   **$X$ (Treatment):** Application of the new fertilizer.
  *   **$Z$ (Mediator):** Plant height at mid-season.
  *   **$Y$ (Outcome):** Final fruit yield.

  **The Causal Mechanism:**
  1.  **Indirect Effect ($X \to Z \to Y$):** The fertilizer causes plants to grow significantly taller ($X \to Z$). Taller plants capture more sunlight and produce a much higher fruit yield ($Z \to Y$).
  2.  **Direct Effect ($X \to Y$):** The fertilizer contains a chemical that, independent of height, slightly stunts the fruit development ($X \to Y$ negative).

  **The Data:**
  *   **Pooled Data:** When looking at the entire dataset, the fertilizer appears **beneficial**. The massive increase in yield driven by the extra height outweighs the slight direct toxicity.
  *   **Stratified Data:** If you stratify by plant height (comparing only plants of the *same* height), the fertilizer appears **harmful**. Within the group of "Short Plants," the fertilized ones yield less fruit than the unfertilized ones (due to toxicity). Within the group of "Tall Plants," the fertilized ones also yield less fruit than the unfertilized ones (again, due to toxicity).

  **Conclusion:**
  In this scenario, the stratified data gives a misleading answer. The fertilizer *is* beneficial, but its benefit is mediated entirely through height. By stratifying on height, you artificially hold the mechanism constant, effectively asking, "Does the fertilizer help if we prevent it from making the plant grow?" The correct causal answer for a farmer is found in the **pooled** data, which reflects the total effect of using the product.

  ### The Intuitive Graphical Feature

  To determine whether you are in a situation where you should stratify (Confounder) or pool (Mediator), look at the **direction of causality** (or the time order) relative to the treatment.

  *   **Confounder (Stratify):** The third variable is a **cause** (or ancestor) of the treatment. It represents a pre-existing difference between the groups (e.g., severity of illness, gender, age). It happens *before* the treatment is applied.
  *   **Mediator (Do Not Stratify):** The third variable is an **effect** (or descendant) of the treatment. It is an outcome or intermediate step caused by the treatment (e.g., blood pressure reduction, tar in lungs, plant height). It happens *after* the treatment is applied.

  **The Rule:** If the third variable is a consequence of the treatment, do not stratify if you wish to measure the total effect of the treatment.
