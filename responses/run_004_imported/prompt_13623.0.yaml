answer: |-
  This is a fantastic passage to grapple with, and your intuition is spot-on: Sidgwick is walking a very tightrope here. You have identified the exact tension that makes this text so useful for a unit on the demarcation problem.

  To answer your core question: Sidgwick is **not** conceding that skepticism is logically unbeatable. Rather, he is making a **sociological and rhetorical argument** about what constitutes *practical* certainty in science. He is attempting to shift the burden of proof by raising the "cost" of skepticism.

  Here is a breakdown of the logical structure, the strategic work it performs for the SPR, and a critical evaluation of whether it holds up (spoiler: your suspicion about unfalsifiability is historically vindicated).

  ### 1. The Logical Structure: Exhausting the "Outs"
  Sidgwick is outlining a process of elimination. He acknowledges that in matters of psychical research (telepathy, ghosts, etc.), you cannot produce mathematical proof. You are dealing with human testimony.

  *   **Premise 1:** The strength of evidence is capped by the credibility of the witness/investigator.
  *   **Premise 2:** A determined skeptic can always posit one final alternative explanation: **Fraud** (lying/cheating) or **Incompetence** (blindness/forgetfulness/idiocy).
  *   **The Move:** Accumulate enough high-quality testimony from high-credibility witnesses that the "Fraud/Incompetence" explanation becomes socially and intellectually more costly than accepting the phenomenon.
  *   **The Dilemma:** He forces the skeptic into a corner: Either admit the data is real (though inexplicable by current physics) or accuse a respected gentleman/scientist of being a liar or an idiot.

  Sidgwick knows he cannot *logically* disprove the "Fraud" hypothesis. Instead, he is arguing that at a certain point, maintaining the "Fraud" hypothesis becomes **irrational**, even if it remains **logically possible**.

  ### 2. Strategic Work: Why Bother Piling Up Cases?
  You asked: *"If 'the investigator faked it' is always available as a last-ditch move... why bother piling up more cases at all?"*

  Sidgwick's answer is that he isn't trying to convince the **dogmatic skeptic**; he is trying to convince the **reasonable observer**.

  In the 19th-century scientific community, science was deeply tied to the concept of the "Gentleman Scientist." Reputation was currency. Sidgwick is leveraging this. By piling up cases investigated by people of high standing (like himself, a Cambridge philosopher), he is betting that the scientific community values their collective reputation more than they value their materialist worldview.

  He is essentially saying: *"We have done the work. We are honest men. If you reject this, you aren't just rejecting the data; you are impugning our character. Are you willing to pay that social price?"*

  This serves the SPR's larger case by defining their methodology not as "proving ghosts," but as **"vetting testimony."** Their goal in this address is to justify the SPR's existence. They aren't claiming to have solved the mystery yet; they are claiming to have established that the mystery is *real* and deserves a seat at the scientific table.

  ### 3. Critical Evaluation: The Unfalsifiability Trap
  This is where your HPS seminar context becomes crucial. You asked: *"Does it quietly saddle his own side with the same kind of unfalsifiability problem he's accusing the skeptics of exploiting?"*

  **Yes. Absolutely.** And this is why many historians of science view the SPR's early methodology as a classic case study in the demarcation problem.

  **The Mirror Image of Dogmatism:**
  Sidgwick criticizes the "scientific world" for being dogmatically materialist (refusing to believe no matter the evidence). However, his defense mechanism creates a dogmatic shield for the SPR.
  *   **The Skeptic's Shield:** "It can't be true because it violates natural law." (Unfalsifiable belief in materialism).
  *   **Sidgwick's Shield:** "It must be true because we are trustworthy, and suggesting otherwise is an *ad hominem* attack." (Unfalsifiable belief in testimony).

  By making the credibility of the investigator the ultimate linchpin, Sidgwick insulates the *phenomena* from direct falsification. If an experiment fails, it's because conditions weren't right. If a witness is caught lying, it's a "bad apple," not a refutation of the whole field. This allows the SPR to accumulate "positive" cases while discarding "negative" ones without ever subjecting the core hypothesis to a genuine risk of refutation.

  **The "Ad Hominem" Problem:**
  In modern philosophy of science, we generally want evidence to stand independently of the person presenting it. Sidgwick is explicitly tying the evidence to the person (*"limited by the trustworthiness of the investigator"*). This was standard for the 19th century, but it creates a vulnerability. It shifts the debate from **empirical verification** to **social authority**.

  **Did it hold up?**
  Historically, not really.
  1.  **Fraud *was* found:** Eventually, many mediums and even some investigators associated with the SPR were exposed as frauds. Because Sidgwick tied the evidence to "trustworthiness," these exposures damaged the SPR's scientific credibility significantly.
  2.  **The Demarcation Line:** Mainstream science eventually drew the line exactly where Sidgwick feared. They decided that no amount of testimony is sufficient for "weird" claims without a reproducible mechanism. Sidgwick hoped testimony could bridge the gap; the scientific consensus decided it could not.

  ### 4. Connecting to Sidgwick's Ethics (Since you know *Methods*)
  It is fascinating to read this alongside his utilitarianism. In *The Methods of Ethics*, Sidgwick is obsessed with **certainty** and **systematic coherence**. He is troubled by the conflict between duty and self-interest.

  In the SPR address, you see the same philosophical anxiety. He is troubled by the conflict between **empirical evidence** (testimony says X happened) and **scientific theory** (theory says X is impossible). He is trying to apply a rigorous, almost ethical standard of "truth-telling" to the scientific community. He believes that if everyone acts with intellectual honesty (utilitarian greatest good of truth), the "correct" conclusion will emerge.

  He is essentially treating the acceptance of psychical phenomena as a **moral duty** of the scientist: to follow the evidence wherever it leads, even if it breaks your physics, provided the witnesses are virtuous.

  ### Summary for your Seminar
  If you are discussing this in class, here is a strong position to take:

  1.  **Sidgwick's Argument:** It is a **pragmatic** argument, not a logical proof. He aims to make skepticism socially untenable rather than logically impossible.
  2.  **The Demarcation Issue:** Sidgwick attempts to solve the demarcation problem by using **procedural rigor** (vetting witnesses) rather than **ontological criteria** (does it fit natural law?).
  3.  **The Flaw:** As you suspected, this creates a **protectionist strategy**. By making the investigator's character the ultimate criterion, he makes the claims difficult to falsify without attacking the person, which mirrors the dogmatism he accuses the skeptics of.
  4.  **Historical Verdict:** This approach highlights why the demarcation problem is so hard. Sidgwick was a brilliant philosopher, but his attempt to legitimize psychical research failed because he tried to solve an **empirical** problem (does telepathy exist?) with a **sociological** solution (trust us, we are honest).

  It's a perfect example of how 19th-century scientists tried to negotiate the boundaries of science, and how easily those boundaries can be gamed—even by honest people like Sidgwick.
