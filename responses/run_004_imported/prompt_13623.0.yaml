prompt: |-
  hey, so for my history & philosophy of science seminar we're doing a unit on the demarcation problem — basically how 19th-century scientists tried (and mostly failed) to lay down rules for what should count as adequate evidence for weird claims — and our professor handed out a chunk of Henry Sidgwick's first presidential address to the Society for Psychical Research (1882) as a primary source, without really unpacking it in class. I'd read some of Sidgwick's ethics stuff before (Methods of Ethics) so I knew he was a big utilitarian, but I had no idea he also spent like 18 years running a research society investigating ghosts and telepathy, which is kind of wild.

  Anyway, here's the bit I'm stuck on, from near the end of that address, right after he's talked about how much accumulated testimony it would take to convince "the scientific world" of thought-transference:

  "The highest degree of demonstrative force that we can obtain out of any single record of investigation is, of course, limited by the trustworthiness of the investigator. We have done all that we can when the critic has nothing left to allege except that the investigator is in the trick. But when he has nothing else left to allege he will allege that. ... We must drive the objector into the position of being forced either to admit the phenomena as inexplicable, at least by him, or to accuse the investigators either of lying or cheating or of a blindness or forgetfulness incompatible with any intellectual condition except absolute idiocy."

  I get what the individual sentences mean but I can't tell what Sidgwicks actually thinks this establishes. Is he basically conceding that no amount of evidence could ever convince a truly determined skeptic, since "the investigator faked it" is always available as a last-ditch move — in which case why bother piling up more cases at all? Or is he making a narrower, more strategic point about shifting the burden of proof, so that refusing to believe starts to look unreasonable to onlookers even though it hasn't technically been refuted? Could you walk me through the logical structure of the arguement he's making here and what work it's doing in his larger case for the SPR's methods — and maybe say whether you think it actually holds up, e.g. whether it quietly saddles his own side with the same kind of unfalsifiability problem he's accusing the skeptics of exploiting?
