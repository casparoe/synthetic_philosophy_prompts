      *   *Claim:* Agents without utility functions are exploitable (money pump). Capable AI will self-correct to avoid exploitation. Therefore, AI will converge to EU maximization. This makes AI dangerously goal-directed.
      *   *Assessment:* This is the standard coherence argument (e.g., Yudkowsky, Omohundro). It relies on the Von Neumann-Morgenstern (VNM) theorem intuition.
      *   *Strengths:* Correctly identifies the core pressure (avoiding domination/exploitation). Links capability to self-correction.
