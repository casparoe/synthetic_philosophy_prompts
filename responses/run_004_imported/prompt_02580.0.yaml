      *(Refining the "Indifference" critique)*: The main critique of Indifference isn't just that it's hard to calculate, but that it creates incentives to manipulate the *correlates* of the button. Thornley's approach tries to remove the incentive to manipulate the button's *timing* entirely by removing the preference for duration.

