          *   *Timestep Dominance:* If an action is better at every timestep, it should be preferred. (Actually, looking up Thornley's specific recent work to ensure accuracy: Thornley's "The Shutdown Problem" paper focuses on the impossibility of satisfying certain desiderata simultaneously. He argues that standard expected utility maximization *cannot* satisfy shutdownability without violating other rationality axioms. His proposal involves restricting the preference structure.)
