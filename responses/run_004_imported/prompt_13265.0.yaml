      *   **Rivalry vs. Notation:** Pearl's do-calculus uses structural equation models (SEMs). The "do" operator is essentially a counterfactual surgery. Is Woodward just doing Lewis with DAGs?
      *   **Preemption/Overdetermination:** Classic problem for counterfactuals (Suzy throws rock, Billy throws rock, window breaks. If Suzy hadn't, Billy would have. So Suzy didn't cause it?). Interventionism handles this better by isolating variables.

