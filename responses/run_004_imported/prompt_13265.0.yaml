answer: |-
  Here is a draft of ten interview questions, plus the optional eleventh, tailored to your background as an experimentalist. I have placed the three mandatory topics early in the list to ensure they get airtime, each with the requested follow-up designed to anticipate standard Woodwardian defenses.

  ### 1. The Circularity of "Intervention"
  Woodward is candid that an "intervention" is defined as a cause of the target variable that is uncorrelated with other causes of the outcome. In other words, he defines *intervention* using the word *cause*. Lewis was trying to reduce causation to non-causal facts (similarity of possible worlds), but Interventionism seems to explain causation partly in terms of itself. If you aren't offering a reductive analysis, what exactly is the philosophical payoff? Are we just swapping one mystery for another?

  *   **Follow-up (Anticipating the "Non-Reductive" Defense):** She will likely reply that we shouldn't expect reductive analysis and that the goal is elucidation, not elimination. If that's the case, doesn't Interventionism lose its claim to be a *metaphysical* theory of causation? Does it become merely an epistemic guide for experimenters, telling us how to *find* causes rather than what causation *is*?

  ### 2. Fixed Properties and "Impossible" Interventions
  In fly genetics, we often talk about the causal role of fixed properties—sex, species, or chromosomal arrangement. We can't literally "intervene" to change a fly's sex without destroying the organism or changing countless other variables. Interventionism risks calling claims like "being female causes higher fecundity" meaningless because no ideal intervention exists. Do you have to bite the bullet and say these aren't causal claims? Or do you allow "conceptual" interventions?

  *   **Follow-up (Anticipating the "Conceptual Intervention" Defense):** If you allow "conceptual" interventions where physical ones are impossible, aren't you just relying on a judgment of similarity between possible worlds? That sounds suspiciously like Lewis. If the "intervention" is just a thought experiment about how the world *would* be if the variable were different, what work is the manipulability condition actually doing?

  ### 3. Interventionism vs. Counterfactualism with Better Math
  Judea Pearl's structural equation models use the *do*-operator to define causation, which looks mathematically identical to "surgery" on a system. But Pearl also shows how to derive counterfactuals from those equations. To a working scientist, Interventionism and the Counterfactual theory look like the same engine with different paint jobs. Is there a genuine metaphysical disagreement here, or is Interventionism just Counterfactualism with a notation that appeals to engineers?

  *   **Follow-up (Anticipating the "Manipulability is Distinct" Defense):** She will likely argue that manipulability captures the asymmetry of causation better than bare counterfactuals. But if the truth conditions for the counterfactuals are determined by the very same structural equations that define the interventions, isn't the "manipulability" just a semantic gloss on the math? Why should an ontologist care which gloss we use?

  ### 4. The Idealization Gap in the Lab
  Woodward's theory relies on *ideal* interventions: changes to $X$ that affect $Y$ *only* through $X$. In thirty-five years of running a lab, I can tell you that truly ideal interventions are vanishingly rare. Pleiotropy is the norm; knock out a gene, and you get off-target effects, compensatory pathways, and developmental noise. If the theory requires ideal interventions to define causation, but our best science only gives us messy approximations, does the theory describe scientific practice or an unattainable ideal?

  ### 5. Mechanism vs. Difference-Making
  Interventionism is a "difference-making" account: $X$ causes $Y$ if changing $X$ changes $Y$. But in biology, we often feel we haven't really explained a phenomenon until we know the *mechanism*—the pathway connecting $X$ and $Y$. We can know that a gene knockout changes a phenotype without knowing the biochemical pathway. Does Interventionism treat black-box correlations as full-blooded causation, and if so, does that leave out something essential about causal *explanation*?

  ### 6. Causal Claims about the Past
  I study development, but cosmologists study the origin of the universe. There is no "outside" agent to intervene on the Big Bang, and no prior variables to hold fixed. If Interventionism struggles with fixed properties like sex, it seems to break down completely for singular, unrepeatable historical events. Do we have to accept that cosmology is non-causal, or does the theory need to be stretched so far to accommodate it that it loses its bite?

  ### 7. The Status of the Intervener
  In your framework, an intervention is an exogenous variable. But in a closed physical universe, every event is caused by prior events. Where does the "intervener" come from? Is the intervention a real physical event, or is it a hypothetical construct? If it's hypothetical, we seem back in the land of counterfactuals; if it's real, doesn't Interventionism require a kind of agent-causation or dualism that physicalists should reject?

  ### 8. Invariance and Context
  Woodward argues that causal relationships are those that remain invariant under testing. But in biology, almost everything is context-dependent. A gene knockout might cause a phenotype in one genetic background but not another (epistasis). Does Interventionism force us to say there is no causal relation there, or just that the relation is relative to a background? If it's the latter, how do we avoid an infinite regress of specifying conditions for the conditions?

  ### 9. Explanation and Understanding
  If I tell you that "striking the match caused it to light," an Interventionist says I'm telling you that if you had intervened to prevent the strike, the light wouldn't have happened. But does that capture *why* it lit? It seems to describe the dependency without illuminating the production. Is "understanding" just knowing the pattern of counterfactual dependencies, or is there a cognitive component to causal explanation that Interventionism ignores?

  ### 10. Pragmatism vs. Realism
  Interventionism feels deeply pragmatic: it ties causation to what we can *do*. But surely the causal structure of the world existed before humans evolved to manipulate it. Did the asteroid cause the dinosaur extinction if there was no one around to intervene on the asteroid? If you say "yes," you seem to be appealing to a mind-independent notion of causation that isn't tied to actual manipulability. How do you square the pragmatism with realism?

  ### 11. Preemption and Overdetermination (Optional)
  Lewis's counterfactual theory famously struggles with preemption (Suzy throws a rock, Billy holds back; if Suzy hadn't, Billy would have). Interventionism is often touted as solving this by isolating Suzy's throw via an intervention. But in biology, we see functional redundancy all the time—knock out gene A, gene B compensates. Is this overdetermination or preemption? And does Interventionism actually handle these cases better, or does it just classify them differently without solving the underlying metaphysical puzzle of which variable is the "true" cause?
