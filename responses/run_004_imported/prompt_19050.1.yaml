      *   **Payoff Structure:** In a *joint vacation* fund, the goal is shared utility. If I cash out now, I get more money, but we ruin the vacation fund. If the utility of the vacation depends on the *total* pot, pure self-interest might not align with the stated goal. However, the prompt says "taking the larger share, leaving the smaller share to the other." This implies a division of the pot, not just a joint fund. Wait, re-reading: "fund a joint vacation... cash out the current pot for themselves (taking the larger share, leaving the smaller share to the other person)." This implies if one cashes out, the *joint* vacation plan is compromised or the money is split unequally for individual use?
