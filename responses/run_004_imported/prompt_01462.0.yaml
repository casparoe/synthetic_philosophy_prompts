  This has been bugging me for weeks. I was on a group hike I found through an app, didn't know anyone there, and near the end I rolled my ankle bad enough that I could barely walk. Some guy I'd just met that day basically got me down the trail, drove me to urgent care, and covered my copay since I'd left my wallet in the car. I told him I'd Venmo him back that night, but its been almost a month, I still havent paid him, he lives clear across town so we're never gonna cross paths again, and he hasn't said a word about it - nothing happens to me either way at this point. I still feel like I owe him though and can't explain why since nothing's actually making me do it. Is that feeling pointing at something real, or am I just guilting myself over nothing?
