answer: |-
  **Setting:** *A soundproofed basement laboratory. On a steel table sits a box containing a spin-measurement apparatus linked to a solenoid and a vial of fast-acting neurotoxin. A helmet rests beside it. Two figures stand in the dim light: ELIAS and SARAH. Both are retired experimentalists, decades into their friendship, now debating the metaphysics of their trade.*

  **Elias:** (Resting a hand on the casing) The math is clean, Sarah. We agree on the wavefunction. We agree there is no collapse. When I put on the helmet and trigger the measurement, the universe branches. In one branch, the spin is up, the solenoid fires, and I die. In the other, the spin is down, the click is silent, and I live.

  **Sarah:** We agree on the kinematics, Elias. We disagree on the ethics of anticipation.

  **Elias:** Ethics? It's simple epistemology. From my subjective perspective, I cannot experience the branch where I die. Consciousness requires a living substrate. Therefore, conditional on me having an experience at *t+1*, I must be in the survival branch. The probability of me experiencing survival is one. Why should I fear a certainty?

  **Sarah:** Because "you" are not just the stream of consciousness that survives. "You" are the entire pre-branch entity. When the wavefunction splits, there isn't a *you* that goes one way and a *copy* that goes the other. There are two successors, both equally entitled to your past. One of them dies. Horribly. If you pull that lever, you are arranging for a successor of yours to be executed.

  **Elias:** But that successor doesn't *experience* being executed. Death is a null event for the subject. I am concerned with the first-person perspective. As long as there is *a* branch where I continue to think, speak, and remember pulling the lever, *I* persist. The weight of the branch—the squared amplitude—is irrelevant to existence. It's binary. I exist, or I don't. In the survival branch, I do.

  **Sarah:** That is the Quantum Immortality fallacy, and you know it. It confuses *existence* with *measure*. David Lewis put it best: if you play Russian roulette with a quantum trigger, you shouldn't think, "I'll survive." You should think, "In the vast majority of the measure of my future selves, I am dead." Rational self-concern tracks the Born rule. If the survival branch has a weight of $10^{-6}$, you should care about that future self one-millionth as much as you care about the self that dies.

  **Elias:** Lewis was a collapse theorist at heart. He treated the branches like classical probabilities. But in Everett, they all happen. If I bet on the low-weight branch, and I win, I *am* there to collect the winnings. The other version of me doesn't collect anything because he doesn't exist to collect. Why should I weight my decisions by a measure that, from the inside, looks like a certainty?

  **Sarah:** Because decision theory in MWI—Deutsch and Wallace proved this—requires agents to maximize expected utility weighted by amplitude. If you ignore the weights, you become a "branch counter." You'd accept a bet where you lose a dollar in 99% of branches and gain a penny in 1% of branches, just because there are *some* branches where you win. That's irrational.

  **Elias:** That's a disanalogy. Losing a dollar is an experience. Dying is the end of experience. If I pull this lever, the Elias in the high-weight branch ceases. He has no utility function left to maximize. The Elias in the low-weight branch continues. For him, the gamble paid off. Since I am currently the pre-branch Elias, and I know I will subjectively *be* the post-branch Elias, I am guaranteed to see the "win."

  **Sarah:** You're smuggling in a false premise about identity. You say, "I will subjectively be the post-branch Elias." Which one?

  **Elias:** The one breathing.

  **Sarah:** That's post-hoc selection. Right now, *before* the branch, you are the common ancestor to both. You have a duty of care to both successors. The fact that one successor won't be around to complain about your negligence doesn't absolve you of the risk you're imposing on the totality of your future existence. Most of you, by measure, dies. To say "but *I* won't experience it" is like a man jumping off a cliff saying, "But in the branch where I land safely, I'm fine." It ignores the branch where you splatter.

  **Elias:** But the man who splatters *isn't me* in the relevant sense. He's a divergent trajectory. Look, Sarah, think about teleportation. If a scanner destroys me here and rebuilds me on Mars, I step through. If the scanner malfunctions and rebuilds two of me on Mars, do I hesitate?

  **Sarah:** Parfit's fission case. Yes. If two successors emerge, my relation to each is what matters. But here, one successor is dead. Fission usually implies survival of both. This is fission where one twin is immediately annihilated.

  **Elias:** Annihilated *in that branch*. But the continuity of memory holds in the other. If I pull the lever, the survivor remembers the tension, the click, the relief. He is psychologically continuous with me. The corpse is not. Why should I privilege the corpse's claim on my current decision over the survivor's?

  **Sarah:** Because the corpse is the statistically dominant outcome! You are treating the Born rule as mere frequency, like counting worlds. But in modern Everettianism, the weight *is* the reality. It's not just a count. A branch with weight $10^{-6}$ is ontologically thinner, in a sense, than one with weight 0.99. To act as if they are equal is to deny the structure of Hilbert space.

  **Elias:** Ontologically thinner? That's poetic, Sarah. Is the survivor less conscious? Does he feel less pain? Does he love his family less?

  **Sarah:** No. But there is less *of him* relative to the whole.

  **Elias:** "Less of him." That's the crux. You think identity is divisible. I think it's indexical. I am here, now. I project forward. I ask, "What will I see?" I will see survival. The fact that there is a version of the universe where I don't see anything is irrelevant to what I see.

  **Sarah:** And I say that question—"What will I see?"—is the wrong one for a rational agent. The right question is, "How should I care about my successors?" If you accept MWI, you must accept that your future is a distribution. If you ignore the distribution's shape, you are effectively blind to the physics you claim to champion. You say the survivor is "you." I say the死者 (the dead one) is also "you." And you are sentencing him to death for a gamble that pays off only in a sliver of reality.

  **Elias:** But he doesn't *suffer* the sentencing. He just ceases.

  **Sarah:** He ceases *because* of your action. That matters morally. But let's go deeper. You claim the survivor is the one who matters because he has the memory of pulling the lever. But suppose the survival branch involves severe brain trauma. He survives, but he's not psychologically continuous. He doesn't remember you. By your logic, you shouldn't fear that branch either, because "you" aren't there to experience it.

  **Elias:** If there's no psychological continuity, then yes, that's death for me.

  **Sarah:** Exactly! So you *do* care about the quality of the successor. You care about the *measure* of psychological continuity. In the quantum suicide case, the measure of the surviving "you" is tiny. The measure of the dead "you" is huge. You are prioritizing a thin thread of continuity over a thick one. That isn't rationality; it's desperation.

  **Elias:** It's not desperation. It's recognizing that probability is an illusion in a deterministic multiverse. There is no chance I die. There is only the fact that some branches contain my corpse. But *I* am not the corpse. I am the observer. An observer cannot observe their own absence.

  **Sarah:** You keep saying "I." But the "I" that pulls the lever is the pre-branch node. That node ceases to exist regardless. It is replaced by successors. If you truly believe the pre-branch "you" is the same entity as the post-branch "you," then you must acknowledge that the pre-branch "you" is also the same entity as the dead post-branch "you." You can't claim identity with the survivor and disown the dead one. They are both your children, in a sense. You are killing the elder to save the younger.

  **Elias:** (Pauses, looking at the helmet) I hear you. But consider this: If I don't pull the lever, I age. I decay. Eventually, I die in all branches. The only difference this lever makes is the *timing* and the *selection* of the branch where my consciousness persists. If I pull it, I guarantee that *a* version of me enters a future where I survived a lethal event. That seems like a triumph of will over statistics.

  **Sarah:** It's a triumph of solipsism over physics. You are saying that because *you* won't witness your own death, your death doesn't count. But to your wife, to your colleagues, the death is real. The high-weight branch is the one they inhabit. They will mourn you. They will bury you. Only in a vanishingly rare world does your wife see you walk away. Are you willing to make your wife a widow in 99.9999% of the multiverse just so that in the 0.0001% where she isn't, you get to feel clever?

  **Elias:** (Silence for a long moment) That... carries weight.

  **Sarah:** It's not just weight, Elias. It's the definition of caring. If you love your wife, you care about her successors across the branches. Most of them lose you.

  **Elias:** But the "me" that survives... he is still me. He still loves her.

  **Sarah:** But he is a ghost to the others. And you are privileging that ghost. Look, let's grant your point on identity. Suppose the survivor *is* you. Does he know he was lucky?

  **Elias:** Yes. He knows the odds.

  **Sarah:** Then he knows he is an outlier. He knows that the vast majority of his measure died. If he is rational, he should feel profound guilt, not triumph. He survived a Russian roulette that killed his other selves. If you pull that lever, you aren't proving immortality. You're proving that you value a slim thread of subjective continuity over the objective measure of your existence.

  **Elias:** So you're saying rationality requires me to act as if I care about the branches where I don't exist?

  **Sarah:** I'm saying you care about the branches where your *interests* are thwarted. Death thwarts all interests. Even if you don't experience the thwarting, the entity that *would have* had those interests is gone. Rational self-concern isn't about what you experience next. It's about respecting the amplitude of your future possibilities.

  **Elias:** (Steps back from the table) You know, I came here thinking the Immortality argument was the ultimate validation of Everett. That it showed the power of the first-person perspective.

  **Sarah:** It shows the danger of it. It turns physics into a fantasy of invulnerability.

  **Elias:** But the impasse remains. We agree on the Schrödinger equation. We agree on decoherence. We disagree on whether the Born rule is a law of *frequency* or a law of *caring*.

  **Sarah:** Precisely. If the Born rule is just frequency, you're right; you'll find yourself alive. If it's a norm for decision theory, I'm right; you're acting recklessly.

  **Elias:** And we can't derive the norm from the frequency without circularity.

  **Sarah:** No. We can't. (She picks up the helmet and places it back in the box, closing the lid.) So, until we solve decision theory, we don't pull the lever.

  **Elias:** (A faint smile) Because the measure of the branch where we agree is currently high, and I'd hate to collapse it.

  **Sarah:** Don't say "collapse." But yes. Let's go upstairs. My wife is in the high-weight branch, and I intend to stay there with her.

  **Elias:** Fair enough. The physics is the same either way. It's just the philosophy that kills you.

  *(They turn off the equipment. The hum fades. The room is quiet, and in this branch, both remain alive.)*
