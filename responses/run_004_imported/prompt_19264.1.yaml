answer: |-
  This is a fantastic question because it cuts right to the difference between *logic* (how propositions relate to truth) and *ethics* (how people relate to norms). Your confusion is completely warranted: introductory logic classes teach you to isolate the proposition from the speaker, while moral philosophy often insists the speaker is part of the equation.

  Here is the handle you need on the "standing to blame" debate, broken down by your two specific questions.

  ### 1. How to distinguish "Standing" from "Truth" (without committing *Tu Quoque*)

  The way to resolve the tension between your logic class and your philosophy friend is to recognize that they are talking about two different categories of action: **Constative Speech Acts** vs. **Normative Speech Acts.**

  *   **Logic (Constative):** When you say, "It is raining," you are stating a fact. The truth of that statement depends entirely on the weather. If a known liar says "It is raining," and it is raining, the statement is true. Pointing out the liar is a *tu quoque* fallacy because their character doesn't change the weather.
  *   **Blame (Normative/Performative):** When your brother says, "You are a bad uncle," he isn't just reporting a fact like a weatherman. He is issuing a **demand**. He is invoking a moral norm and placing you under an obligation to acknowledge it, feel guilt, or make amends.

  **The "Referee" Analogy**
  Think of a soccer referee. If a player is offside, that is a fact (Truth). If the referee blows the whistle, they are enforcing the rule (Blame).
  Now, imagine the referee is secretly betting on the games and routinely breaks the rules themselves when not officiating.
  *   **Logic View:** If the player was actually offside, the referee's call is *factually correct*. The player was offside.
  *   **Standing View:** Does the referee have the *authority* to make that call? If the referee is corrupt, the players might reject the whistle. The offside fact remains, but the *enforcement* is illegitimate.

  **The Philosophical Bridge:**
  Philosophers like R. Jay Wallace argue that blame is not just describing a moral fact; it is a **claim to authority** within a moral community. To blame someone is to say, "I hold this norm, and I hold *you* to this norm."

  When you commit the *tu quoque* fallacy, you are arguing: *"You broke the rule, therefore the rule doesn't apply to me."* (This is false).
  When you challenge **standing**, you are arguing: *"You broke the rule, therefore you have forfeited the authority to hold me accountable to it."* (This is a claim about social/moral jurisdiction, not truth).

  So, the two fit together like this: Your brother's accusation can be **factually true** (you are absent) while his act of blaming is **normatively infelicitous** (he lacks the standing to demand accountability). Logic handles the truth; Standing handles the relationship.

  ### 2. Does lacking standing "Void" the blame or just "Weaken" it?

  This is exactly where the current literature is fighting. Once you grant that hypocrisy damages standing, there is a major split on what happens to the blame itself.

  **View A: The "Misfire" (Nullification)**
  *   **The Claim:** Lacking standing makes the blame void. It doesn't land.
  *   **The Logic:** Blame is a relational transaction. If I have no standing, I am like an unlicensed judge trying to sentence you. The words are spoken, but the moral "sentence" isn't passed.
  *   **Why:** Hypocrisy violates the condition of **equality**. By blaming you for a fault you share, the hypocrite implies they are "above" the norm while you are "below" it. This disrespect cancels out the moral force of their demand.
  *   **Result for you:** Your brother's criticism literally doesn't count as moral blame. It's just noise. You don't owe him an apology or an account.

  **View B: The "Mitigation" (Weight Reduction)**
  *   **The Claim:** Lacking standing reduces the force of the blame, but doesn't erase it.
  *   **The Logic:** The moral fact (you being a bad uncle) exists independently of your brother. His hypocrisy makes him a *messenger* with low credibility, but the message still has weight.
  *   **Why:** The harm you caused (to your nieces/nephews) is real. The validity of the norm doesn't depend on your brother's purity.
  *   **Result for you:** Your brother's criticism counts, but it counts for less. You might owe an apology to your family, but you don't owe one to *him*, and his lecture carries less moral weight than it would if he were a saint.

  **View C: The "Separation" (Content vs. Force)**
  *   **The Claim:** This is the view your brother hinted at ("that doesn't make what you're doing okay").
  *   **The Logic:** We separate the **content** of the blame (the truth) from the **force** of the blame (the demand).
  *   **Why:** Hypocrisy blocks the *force* (you can reject his demand for accountability) but it doesn't change the *content* (you are still absent).
  *   **Result for you:** You can rightfully shut him down ("You don't get to lecture me"), but you still have to sit with the fact that you're a bad uncle.

  ### How to apply this to your Thanksgiving dispute

  Here is the shape of the disagreement you need to navigate to figure out if he had a point:

  1.  **On Truth:** He is right. Your absence is a fact. Your counter-accusation about his absence regarding your mom does not make your absence disappear. (Logic holds).
  2.  **On Standing:** You are likely right. By checking out on your mom for two years, he has signaled that he does not hold "family presence" as a binding norm for himself. According to Wallace, you cannot demand commitment to a norm you openly flout. He lacks the standing to *blame* you.
  3.  **The Synthesis:**
      *   If you follow **View A (Misfire)**: He had no point. His criticism is morally inert. You can ignore it completely.
      *   If you follow **View C (Separation)**: He had a point about the *fact*, but no point about the *authority*.

  **The Verdict:**
  Most contemporary philosophers (including Wallace and Cohen) lean toward the idea that hypocrisy **severely compromises standing**, often to the point where the blame is inappropriate to express.

  However, the "trap" here is using his lack of standing to avoid the truth of the accusation.
  *   **Valid Move:** "You don't have the standing to lecture me on family duty given how you've treated Mom. So I'm not accepting this blame *from you*."
  *   **Invalid Move:** "You don't have the standing, therefore I am not a bad uncle."

  Your brother was technically correct that your hypocrisy doesn't make his behavior okay. But you were technically correct that he lost the moral high ground required to be the one to tell you that. The disagreement isn't about the facts; it's about who has the right to enforce them.

  **Practical takeaway:** You can accept the truth of his claim (I need to visit more) without accepting his authority to deliver it (You are a hypocrite). That allows you to fix the behavior without submitting to the dynamic he tried to set up.
