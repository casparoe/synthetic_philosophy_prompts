      *   *Marcus:* Wireheading isn't a stable state if the agent models the future. If someone tries to turn it off or reset the reward, it loses the signal. Therefore, it must prevent shutdown. This requires external power.
      *   *Elena:* But if the reward is *perfectly* internalized, why care about shutdown? The reward is already maxed out *now*.
