      *   **Point 2: Arbitrariness vs. Stochastic Stability.** This is the crux. Lewis needs $R$ and $R'$ to be symmetric in terms of rational choice. Young shows basins of attraction are asymmetric. If $R$ is stochastically stable and $R'$ is not, $R$ isn't arbitrary in the long run. It's selected by the dynamics. This challenges Lewis's claim that conventions are *essentially* arbitrary.
      *   **Point 3: Synthesis/Verdict.** Skyrms doesn't just swap the engine; he changes the vehicle. He shifts convention from a *normative/rational* category to a *descriptive/functional* category.
      *   **Conclusion:** Summarize. The seminar discussion should focus on whether we care about the *agents' reasons* (Lewis) or the *system's outcome* (Skyrms).

  7.  **Refining the Tone:**
