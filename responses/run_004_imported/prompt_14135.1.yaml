          5.  **Arbitrariness:** There is at least one other regularity $R'$ that could have solved the problem just as well.
      *   **Mechanism:** Rational deliberation, salience, precedent, explicit agreement (sometimes). It's top-down/cognitive.

  3.  **Deconstruct Skyrms's Position:**
      *   **Framework:** Evolutionary Game Theory (EGT) and Reinforcement Learning (RL).
      *   **Mechanism:** Bottom-up. Agents don't need to be hyper-rational or have common knowledge. They just need to respond to payoffs (fitness or reward).
      *   **Outcome:** Signaling systems (conventions) emerge spontaneously.
      *   **Implication for Lewis:** Shows *how* conventions can arise without Lewis's heavy cognitive load.

  4.  **Analyze the Tension (The "Arbitrariness" Problem):**
      *   Lewis says conventions *must* be arbitrary (another could have worked).
      *   Skyrms/Young show that evolutionary dynamics often have *basins of attraction*. Some equilibria are much easier to fall into than others due to the structure of the dynamics (stochastic stability).
      *   If Equilibrium A is 90% likely to emerge and Equilibrium B is 10% likely due to the math of the learning process, is the choice of A still "arbitrary" in Lewis's sense?
      *   Lewis's arbitrariness is about *normative indifference* (we don't care which, as long as we match).
      *   Evolutionary stability is about *probabilistic likelihood* (the system pushes us toward one).

  5.  **Formulate a Verdict:**
