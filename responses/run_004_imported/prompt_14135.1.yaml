      *   *Option B (Undercutting):* If the dynamics make one outcome overwhelmingly probable, the "choice" isn't arbitrary in the way Lewis meant. It's structurally determined. Lewis's definition relies on the *reasons* agents have (they know they could have done otherwise). Evolution removes the "knowing" and potentially the "could have."
      *   *My Synthesis:* Skyrms vindicates Lewis's *extension* (what counts as a convention) but undercuts Lewis's *intension* (the necessary conditions, specifically common knowledge and strong arbitrariness). However, the deeper issue is that Skyrms shifts the ontology from a *rationalist* account to a *naturalist* account.
      *   *Refining the Verdict:* I need to take a stand. Does stochastic stability kill arbitrariness? Not necessarily *logical* arbitrariness, but it kills *practical* arbitrariness. But Lewis's arbitrariness is crucial for distinguishing conventions from natural laws or strict constraints.
      *   *Better Angle:* Skyrms shows Lewis was right about the *structure* (coordination equilibrium) but wrong about the *pedigree* (rationality/common knowledge). However, the stochastic stability point suggests that "arbitrariness" needs to be reinterpreted. It's not that *any* equilibrium is equally likely, but that *multiple* equilibria exist.
