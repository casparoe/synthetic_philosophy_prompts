      *   *Final Decision:* I will argue that Skyrms **undercuts Lewis's definition** while **preserving the explanatory target**. The "arbitrariness" condition is the casualty. Stochastic stability shows that conventions often have a *structural bias*, making them less arbitrary than Lewis claimed. This moves us from a rationalist account to a naturalist one.

  6.  **Drafting the Response:**
