      *   Okay, I will argue that Skyrms **undercuts Lewis's analysis**. Lewis's definition is too intellectualist. Skyrms shows the *functional core* is coordination, but the *definitional constraints* (common knowledge, strong arbitrariness) are artifacts of Lewis's rationalism, not features of convention itself.

