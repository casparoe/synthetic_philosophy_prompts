answer: |-
  Here is my verdict: **Skyrms does not merely vindicate Lewis by swapping the mechanism of emergence; he fundamentally undercuts Lewis's analysis of what a convention *is*, specifically by dissolving the necessity of common knowledge and complicating the condition of arbitrariness.**

  While it is tempting to view Skyrms's evolutionary account as simply a "naturalized" version of Lewis's rationalist story (keeping the destination but changing the vehicle), this understates the philosophical friction between them. Lewis's definition is not just about the *outcome* (coordination); it is about the *reasons for action*. By removing the requirement for common knowledge and demonstrating that dynamic basins of attraction can break the symmetry of alternatives, Skyrms forces us to choose between Lewis's **normative/rationalist** conception of convention and a **functionalist/naturalist** one.

  Here is the breakdown of why Skyrms's story undercuts rather than vindicates Lewis, structured for your seminar discussion.

  ### 1. The Common Knowledge Condition: Constitution vs. Genesis
  Lewis insists that common knowledge is constitutive of convention. For Lewis, I follow the rule *because* I know you follow it, and you know I know, ad infinitum. This recursive mental state is what distinguishes a convention from a mere habit or a forced regularity.

  Skyrms shows that signaling systems (the paradigmatic example of convention) emerge in populations of agents with zero theory of mind, zero common knowledge, and often zero rationality (e.g., simple reinforcement learners or genetic replicators).
  *   **The Vindication View:** One could argue Skyrms just explains the *genesis*. Once the convention is established, maybe humans *do* have common knowledge.
  *   **The Undercutting Verdict:** This fails because Skyrms shows the *maintenance* of the convention also requires no common knowledge. If a population of bees or simple algorithms can sustain a signaling convention, then common knowledge cannot be a necessary condition for the *existence* of a convention. Lewis conflated the *phenomenology* of human convention (where we do reason about each other) with the *ontology* of convention itself. Skyrms reveals that Lewis's "common knowledge" requirement is intellectualist baggage, not a structural necessity of coordination.

  ### 2. Arbitrariness vs. Stochastic Stability
  This is the crux of your question regarding Peyton Young. Lewis defines arbitrariness such that there is at least one alternative regularity $R'$ that could have solved the coordination problem just as well. The implication is a kind of symmetry: there is no antecedent reason to prefer $R$ over $R'$ other than the fact that others are doing $R$.

  Skyrms and Young introduce **stochastic stability**, which demonstrates that evolutionary dynamics often possess asymmetric **basins of attraction**.
  *   **The Problem:** If the dynamic landscape makes Equilibrium A 95% likely to emerge and Equilibrium B only 5% likely (due to basin size or risk dominance), the choice is not "arbitrary" in the sense Lewis intends. It is structurally biased by the learning dynamics themselves.
  *   **Lewis's Defense:** Lewis might reply that "arbitrary" means *logically* possible, not *probabilistically* equipossible. As long as $B$ is possible, $A$ is arbitrary.
  *   **The Verdict:** This defense is weak. Lewis's point about arbitrariness is meant to explain why we need *agreement* or *precedent* to tip the scales. If the scales are already tipped by the mathematical structure of the learning process (as Young shows), then the "conventional" element is diminished. The regularity is less a matter of social agreement and more a matter of dynamic necessity. If one equilibrium is stochastically stable and the others are not, the system will converge on the stable one almost inevitably in the long run. This looks less like a *convention* (which implies contingency) and more like a *law-like regularity* of the social system.

  ### 3. The Shift from Rationalism to Naturalism
  Ultimately, Skyrms forces a choice.
  *   **Lewis** offers a **Rationalist Account**: Conventions are solutions to practical syllogisms involving mutual expectations.
  *   **Skyrms** offers a **Naturalist Account**: Conventions are stable attractors in a dynamic system.

  If you accept Skyrms, you must admit that Lewis's definition is too narrow. It excludes animal signaling, pre-linguistic human coordination, and perhaps even many human social norms that operate below the level of common knowledge.

  However, if you stick with Lewis, you must reject Skyrms's outcomes as "true" conventions, labeling them merely "functional analogues." This seems untenable given that the outcomes are mathematically identical (signaling systems).

  ### Conclusion for Your Seminar
  My verdict is that Skyrms **undercuts Lewis's analysis**. He shows that the essential feature of a convention is not the *rational justification* agents have for following it (common knowledge), but the *functional stability* of the equilibrium itself.

  Regarding arbitrariness: Stochastic stability does not eliminate logical alternatives, but it does eliminate the **practical contingency** that Lewis thought was essential. If the dynamics push us inevitably toward one equilibrium, the "choice" is not arbitrary in the sense of being up to us; it is up to the math of the reinforcement schedule.

  **Discussion Tip:** For your session, I suggest framing the tension this way: Lewis is interested in convention as a **source of reasons** (why *should* I drive on the right? Because we agreed/expect to). Skyrms is interested in convention as a **source of order** (how *does* coordination happen?). Skyrms vindicates the *possibility* of order without rationality, but in doing so, he shows that Lewis's definition describes a specific, high-cognition *subset* of conventions, not the phenomenon as a whole. Lewis didn't discover the nature of convention; he discovered the nature of *rational agents' experience* of convention.
