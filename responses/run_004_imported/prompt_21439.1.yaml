answer: |-
  You are remembering the work of **Ruth Chang**, a philosopher at Oxford (formerly Harvard), who specializes in value theory and practical reasoning. The concept you're thinking of is **"On a Par"** (or *parity*), and the specific argument you're trying to reconstruct is called the **Small Improvement Argument**.

  This is a perfect philosophical framework for your friend's job dilemma. Here is the layout of the argument for why "On a Par" is a distinct fourth relation, followed by an analysis of whether it's just a fancy label for imprecision.

  ### Part 1: The Argument for a Fourth Relation

  Standard decision theory relies on the **Trichotomy Thesis**: for any two options A and B, one of three relations must hold:
  1.  A is better than B.
  2.  B is better than A.
  3.  A and B are equally good.

  Your friend argues there is a "fact of the matter" (implying 1 or 2 is true, we just don't know it). You argued they are "incommensurable" (implying no relation exists). Chang argues both are wrong. There is a fact of the matter, but the relation is *parity*.

  Here is the **Small Improvement Argument** step-by-step, using your friend's job offers:

  **1. The Setup**
  Let Job A be the High Pay/Bad City offer.
  Let Job B be the Low Pay/Good City offer.
  Assume for the sake of argument that neither is clearly better than the other (that's why it's a hard choice).

  **2. The Test for Equality**
  If Job A and Job B were **equally good**, then logic dictates that if you improved Job A slightly (call it A+), A+ must be **better** than Job B.
  *Example:* If two sacks of gold are *equal* in weight, adding one coin to one sack makes it *heavier* than the other. Equality is sensitive to small improvements.

  **3. The Observation**
  In hard cases like your friend's, if you improve Job A slightly (say, the High Pay job offers an extra $500/year), it does **not** suddenly become clearly better than Job B. The struggle remains. The extra $500 doesn't tip the scale because the trade-off isn't just about quantity; it's about qualitatively different values (wealth vs. happiness).

  **4. The Conclusion**
  *   Since A+ is not better than B, A and B were not **equally good** (because equality would have been broken by the improvement).
  *   We already agreed A is not **better** than B (otherwise it wouldn't be a hard choice).
  *   Therefore, A and B are not related by "better," "worse," or "equally good."
  *   They must be related by a fourth relation: **They are On a Par.**

  **Why this matters:**
  If they were *incommensurable* (your view), rationality would have nothing to say; it would be a coin flip. If they were *equal* (a version of your friend's view), rationality would demand indifference. But if they are **On a Par**, rationality permits you to choose either, but requires you to *commit* to the choice. Chang argues that in parity cases, your will creates the reason. You make one true by choosing it.

  ### Part 2: The Objection ("It's Just Imprecise Equality")

  The obvious comeback, which you mentioned, is: *"Isn't 'On a Par' just admitting that the values are vague? Isn't it just 'imprecise equality'?"*

  If "On a Par" is just a synonym for "roughly equal but we can't measure it," then your friend is right: there is a fact of the matter (equality), we just lack the ruler to see it.

  **Does Chang have a good answer to this?**
  Yes. Her response relies on the difference between **epistemic uncertainty** (we don't know the fact) and **ontological structure** (the fact isn't there to be known).

  **1. The Substitutability Test**
  If two things are *equally good* (even imprecisely), they are **substitutable**. If you are indifferent between two identical cans of soup, and the store runs out of one, you shouldn't care.
  However, in parity cases, the options are **not substitutable**. If your friend takes the High Pay job, she cannot later say, "Well, the Low Pay job was equal, so I lost nothing." She *did* lose something (the city she loves) that the other job didn't offer. Parity acknowledges that the options are qualitatively different in a way that equality does not. "Imprecise equality" implies a single scale where the markers are fuzzy. Parity implies two different scales that overlap.

  **2. The "Continuum" Problem**
  If the relation were just vague/imprecise equality, then there should be some point where adding enough money to the High Pay job *must* resolve the vagueness and make it clearly better.
  Chang argues that in some hard cases, **no amount** of improvement on one dimension makes it better than the other.
  *Example:* Imagine choosing between a career as a lawyer (High Pay) or a clarinetist (Low Pay/High Passion). Even if you offer the lawyer job infinite money, some people would argue it still isn't "better" than the clarinet life because the values are so distinct. If vagueness were the only issue, sufficient magnitude should clear the fog. If the fog remains despite magnitude, the structure of the value is different, not just imprecise.

  **3. Normative Implications (The Strongest Answer)**
  The "fancy label" objection fails because "On a Par" changes what you are *allowed* to do.
  *   **If Imprecise Equality:** You ought to be indifferent. If you agonize, you are being irrational (like agonizing over two identical coins).
  *   **If On a Par:** You are *permitted* to agonize, and you are *required* to commit. The "hardness" of the choice is a feature, not a bug. It signals that you have the agency to define who you are through the choice.

  ### The Verdict for Your Argument

  You can actually tell your friend that **you were both half-right**, and Ruth Chang is the referee.

  *   **You were right** that the standard ranking (Better/Worse/Equal) doesn't work. Calling them "incommensurable" was close, but too pessimistic. It implies reason runs out.
  *   **Your friend was right** that there is a "fact of the matter" and they are comparable. But she is wrong that there is a hidden "true score" waiting to be found.

  **The Synthesis:**
  The jobs are **On a Par**. This means there is no hidden fact about which is better. The "fact" is created by your friend's commitment. If she chooses the money, she makes the money-life the better life *for her* by dedicating herself to it. If she chooses the city, she makes that the better life.

  The "On a Par" relation isn't a cop-out; it's an explanation of why **agency** exists. If one option were always strictly better, we wouldn't need willpower; we'd just need a calculator. The fact that they are on a par is what gives her the power to define her own values.

  So, the "fancy label" objection fails because "imprecise equality" suggests we should wait for better data, whereas "parity" tells us to stop measuring and start choosing.
