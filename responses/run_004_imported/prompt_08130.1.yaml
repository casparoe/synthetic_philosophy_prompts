      *   *What about "Space-like"?* The metric field *is* space-like. So if Mach relies on the metric, he relies on something space-like.

  10. **Final Polish:** Organize with clear headings. Ensure the distinction between *kinematic* relationism (positions) and *dynamic* relationism (forces/inertia) is clear. (This is key to the bucket argument).

