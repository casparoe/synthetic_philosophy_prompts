answer: |-
  You are right, and your flatmate is falling for a common misconception. While the Sunk Cost Fallacy (SCF) is definitely *present* in a Dollar Auction, it is not the *engine* that drives the escalation.

  Here is the distinction:
  *   **Sunk Cost Fallacy** is psychological/internal: "I've already spent $0.90, I hate wasting that, so I'll bid $1.00."
  *   **Dollar Auction** is game-theoretic/structural: "My opponent just bid $1.00. If I stop now, I lose my $0.90 *for sure*. If I bid $1.10, I might lose $0.10, but there is a chance my opponent will fold, and I win the dollar."

  The Dollar Auction traps **rational** actors, not just irrational ones. Even if you have zero emotional attachment to your past bids, the structure of the game makes continuing the "less bad" mathematical option in that specific moment, provided you believe your opponent is also rational and wants to minimize their loss.

  Here is a realistic, non-monetary example that mirrors this structure perfectly.

  ### The Example: The "HOA Fence War" (Neighborhood Dispute)

  Imagine two neighbors, **Alice** and **Bob**, in a strict Homeowners Association (HOA).
  *   **The Prize:** Alice wants to build a specific type of fence. Bob wants to stop her. The "value" of the prize is **Community Standing + The Fence Outcome** (let's call this Value = 1).
  *   **The Bid:** Filing formal grievances, hiring surveyors, attending weekly HOA board meetings, and sending legal letters. This costs **Time, Stress, and Social Capital**.
  *   **The Dollar Auction Rule:**
      1.  The person who outlasts the other gets their way (Wins the Prize).
      2.  **Crucially:** Both parties pay for every "move" they make (time, stress, legal fees), regardless of who wins.
      3.  **The Second-Place Penalty:** The loser doesn't just fail to get the fence; they are now known as "the difficult neighbor who lost." They have paid all their stress costs *and* suffered a reputational hit.

  #### The Escalation
  1.  **Alice** files a permit. (**Bid: 1 unit of stress**).
  2.  **Bob** files a formal objection. (**Bid: 1 unit of stress**).
  3.  **Alice** hires a surveyor to prove the line is hers. (**Bid: 2 units**).
  4.  **Bob** hires a lawyer to review the bylaws. (**Bid: 2 units**).

  Now, imagine they are at a point where both have invested **5 units of stress**.
  *   **Alice** is considering quitting.
  *   **Bob** just filed a new legal motion (**Bid: 6 units**).

  If this were just **Sunk Cost**, Alice would think: *"Ugh, I've already spent 5 units of stress. I don't want that to be wasted."*

  But in the **Dollar Auction** structure, Alice thinks:
  *"If I quit now, Bob wins. I have spent 5 units of stress, I don't get the fence, AND I look like the loser of the neighborhood feud. My 5 units of stress become a pure liability.*
  *However, if I file a counter-motion (**Bid: 6 units**), Bob is now in the same trap I was in. He has spent 6 units. If he quits, he loses everything. He might fold to cut his losses. If he folds, I win the fence, and my 6 units of stress were 'worth it' to get the prize."*

  Alice raises her bid not because she is emotionally attached to the past 5 units, but because **Bob's latest move changed her future payoff matrix.**

  ### Why "Sunk Cost Fallacy" is the Wrong Label

  Labeling this purely as Sunk Cost misses three critical mechanics that define the Dollar Auction:

  **1. The Rival is the Trigger, Not the Past**
  In a pure Sunk Cost scenario, you escalate even if no one is watching (e.g., sitting through a bad movie alone because you paid for the ticket). In the Dollar Auction (and the Fence War), you only escalate *because* the rival made a move. If Bob suddenly moved away, Alice would stop immediately. The escalation is **interdependent**, not internal.

  **2. The "Second-Place Penalty" Creates a Trap**
  In most conflicts, if you lose, you just don't win. In the Dollar Auction, the second-highest bidder is *punished*. In the Fence War, the loser isn't just "the person who didn't get the fence"; they are "the person who waged a war and lost." This specific rule makes quitting mathematically inferior to continuing, even for a cold, rational calculator. You are literally paying to avoid a guaranteed loss, hoping to pass the loss to the other guy.

  **3. Rational Escalation vs. Irrational Bias**
  Your flatmate thinks the bidders are being irrational (biased by the past). But in a Dollar Auction, **bidding $1.10 for a $1.00 bill is the rational move** if you are currently the second-highest bidder at $1.00.
  *   **Option A (Quit):** Lose $1.00 immediately.
  *   **Option B (Bid $1.10):** Lose $0.10 (if you win) OR Lose $1.10 (if you lose).
  *   Since losing $0.10 is better than losing $1.00, a perfectly rational robot would bid $1.10.

  ### The Takeaway for Your Flatmate

  Tell him: **"Sunk Cost explains why I don't want to leave the game. The Dollar Auction explains why the game is designed so that leaving is the most expensive option."**

  The Fence War (or any War of Attrition) spirals not because people are bad at math, but because the rules make **peace more expensive than war** in the short term. The only way to win is to convince the rival that you are *irrational* enough to keep bidding forever (a concept called "rationality of irrationality"), which forces *them* to quit. That is game theory, not psychology.
