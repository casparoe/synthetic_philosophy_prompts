answer: |-
  First off, solidarity on the lit review procrastination. The Gödel rabbit hole is basically a rite of passage for anyone in our field; it's the philosophical equivalent of scrolling social media when you should be sleeping.

  Regarding your reconstruction: It is a compelling synthesis of Gödel's *Leibnizian* metaphysics, but you need to be very careful with the "argument" label if this is going into a dissertation.

  Here is the breakdown of the scholarship and how you should handle the citation.

  ### 1. The Philosophical Validity
  You are correct that Gödel held these three positions simultaneously:
  1.  **Anti-Mechanism:** (Gibbs Lecture, 1951) The mind cannot be fully captured by a finite machine (unless there are absolutely unsolvable problems, which he doubted).
  2.  **Theistic Rationalism:** (Ontological Proof, various drafts 1941–1970) A "God-like" being exists necessarily.
  3.  **Immortality:** (Biographical evidence) He explicitly believed in an afterlife and the survivability of the personality.

  However, there is **no standard secondary citation** that treats the combination of (1) and (2) as a formal deduction of (3).
  *   The **Ontological Proof** establishes the necessary existence of a *being* with positive properties. It does not, on its own, establish the immortality of *human* minds, unless you add a premise that human minds partake in that necessary existence or are preserved by it.
  *   The **Gibbs Lecture** establishes the non-physicality (or at least non-finitude) of the mathematical intellect. It suggests dualism, but dualism $\neq$ immortality without further theological premises.

  Gödel likely saw these as coherent parts of a single worldview (a "rational theology"), but he never formalized the step from "Mind > Machine + God Exists" to "My consciousness persists post-mortem" in the way he formalized incompleteness or the ontological argument.

  ### 2. The Citation Strategy
  If you put this in a footnote, you risk sounding like you're attributing a formal proof to him that he didn't write. Instead, frame it as his **metaphysical synthesis**.

  **Do not cite just the letter.** The letter to his mother (likely the 1944 correspondence regarding her health, or later conversations) is the *evidence* of his belief, not the *argument*.

  **The Standard Secondary Lit:**
  If you want to cite someone who has done the heavy lifting on connecting Gödel's math to his theology, you need **Hao Wang**.
  *   **Primary Source:** Wang, Hao. *A Logical Journey: From Gödel to Philosophy* (MIT Press, 1996). Specifically Chapter 9 ("God"). Wang recorded hundreds of hours of conversation with Gödel. He explicitly discusses how Gödel's Platonism, his anti-mechanism, and his theism fit together.
  *   **Biography:** Dawson, John W., Jr. *Logical Dilemmas: The Life and Work of Kurt Gödel* (A K Peters, 1997). Dawson handles the letter to his mother and the "rationality of the world" quote with appropriate biographical caution.
  *   **On the Ontological Proof:** Sobel, Jordan Howard. "Gödel's Ontological Proof" (in *On What There Is*, 1987) or the analysis in Gödel's *Collected Works, Vol. III*.

  ### 3. Recommendation for the Footnote
  Don't present it as "Gödel's Argument for an Afterlife." Present it as "Gödel's Metaphysical Coherence."

  **Drafting suggestion:**
  > "While Gödel never formalized a deduction of personal immortality, his correspondence reveals he viewed his anti-mechanistic results (Gibbs Lecture, 1951) and his modal ontological argument as mutually supportive pillars of a rational theology that permitted the survivability of the mind. See Wang (1996, §9.3) for the coherence of Gödel's theistic Platonism; cf. Dawson (1997, 316) on his letter to Marianne Gödel regarding the 'rationality of the world.'"

  ### 4. A Gentle Warning
  Since you are in a Phil Math PhD program: Be wary of the "Gödel's God" industry. There is a lot of pop-philosophy that treats the Ontological Proof as a slam-dunk for theology. In a dissertation, you must maintain the distinction between:
  1.  What Gödel **proved** (Incompleteness).
  2.  What Gödel **formalized but didn't publish** (Ontological Proof).
  3.  What Gödel **believed informally** (Afterlife, Leibnizian monads).

  Your synthesis falls into category 3, supported by 1 and 2.

  **Now, close this tab.** You have enough for the footnote. Go finish the lit review before your advisor asks why you're excavating Gödel's eschatology instead of your actual chapter.
