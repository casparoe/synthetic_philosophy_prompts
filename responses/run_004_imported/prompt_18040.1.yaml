          *   *Verdict:* **Dana is correct.** The class of "ordinary facts" that are unknown is empty if the knowability principle holds for them. If $p$ is true and unknown, $p \land \neg Kp$ is true. If the principle says all truths are knowable, then $p \land \neg Kp$ is knowable. But it's not. So either $p$ isn't true, or $p$ is known.

