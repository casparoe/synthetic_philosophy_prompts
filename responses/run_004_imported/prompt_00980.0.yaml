      *   *So, where do the parts go?* They don't exist in the whole. This is the hard pill for panpsychists. If the whole exists *instead* of the parts, then the parts aren't fundamental constituents.
      *   *How does this help the user?* It clarifies that James is often claimed by panpsychists, but his specific solution to the combination problem is to deny combination occurs in the way they fear. He opts for a "holistic" or "pluralistic" view where larger minds envelop or replace smaller ones, rather than being built of them.

