prompt: |-
  While reporting on the current revival of panpsychism in philosophy of mind, I kept running into claims that the field's central obstacle, the "combination problem," traces back to William James. Tracking down the source, I found that he restates an argument from his 1890 Principles of Psychology at greater length in this passage from his 1909 lectures, published as A Pluralistic Universe (Lecture V, "The Compounding of Consciousness"):

  "Superficially looked at, this seems just like the combination of H₂ and O into water, but looked at more closely, the analogy halts badly. When a chemist tells us that two atoms of hydrogen and one of oxygen combine themselves of their own accord into the new compound substance 'water,' he knows (if he believes in the mechanical view of nature) that this is only an elliptical statement for a more complex fact. That fact is that when H₂ and O, instead of keeping far apart, get into closer quarters, say into the position H-O-H, they affect surrounding bodies differently: they now wet our skin, dissolve sugar, put out fire, etc., which they didn't in their former positions. 'Water' is but our name for what acts thus peculiarly. But if the skin, sugar, and fire were absent, no witness would speak of water at all. He would still talk of the H and O distributively, merely noting that they acted now in the new position H-O-H.

  In the older psychologies the soul or self took the place of the sugar, fire, or skin. The lower feelings produced effects on it, and their apparent compounds were only its reactions. As you tickle a man's face with a feather, and he laughs, so when you tickle his intellectual principle with a retinal feeling, say, and a muscular feeling at once, it laughs responsively by its category of 'space,' but it would be false to treat the space as simply made of those simpler feelings. It is rather a new and unique psychic creation which their combined action on the mind is able to evoke.

  I found myself obliged, in discussing the mind-dust theory, to urge this last alternative view. The so-called mental compounds are simple psychic reactions of a higher type. The form itself of them, I said, is something new. We can't say that awareness of the alphabet as such is nothing more than twenty-six awarenesses, each of a separate letter; for those are twenty-six distinct awarenesses, of single letters without others, while their so-called sum is one awareness, of every letter with its comrades. There is thus something new in the collective consciousness. It knows the same letters, indeed, but it knows them in this novel way. It is safer, I said (for I fought shy of admitting a self or soul or other agent of combination), to treat the consciousness of the alphabet as a twenty-seventh fact, the substitute and not the sum of the twenty-six simpler consciousnesses, and to say that while under certain physiological conditions they alone are produced, other more complex physiological conditions result in its production instead. Do not talk, therefore, I said, of the higher states consisting of the simpler, or being the same with them; talk rather of their knowing the same things. They are different mental facts, but they apprehend, each in its own peculiar way, the same objective A, B, C, and D.

  The theory of combination, I was forced to conclude, is thus untenable, being both logically nonsensical and practically unnecessary. Say what you will, twelve thoughts, each of a single word, are not the self-same mental thing as one thought of the whole sentence. The higher thoughts, I insisted, are psychic units, not compounds; but for all that, they may know together as a collective multitude the very same objects which under other conditions are known separately by as many simple thoughts."

  I can follow James's rejection of "mind-dust" up to a point, but I'm stuck on the move he makes at the end. He insists the alphabet-awareness isn't built out of the twenty-six letter-awarenesses at all — it's a fresh "twenty-seventh fact" — yet in the same breath he wants that new fact to count as knowledge of exactly those twenty-six letters. If the whole owes nothing to the parts, what entitles it to be knowledge of the same objects the parts knew, rather than some unrelated state that merely happens to follow them? Is James quietly reintroducing the very compounding he calls "logically nonsensical," or is there a way of reading him that avoids that?
