      *   **Round 1 (Classic):** The Dealer offers the standard St. Petersburg game. Elias calculates the expected value (infinity) but prices it by expected utility (finite). He offers a reasonable buy-in.
      *   **Round 2 (The Counter):** The Dealer modifies the payouts. Instead of $2^n$, he offers $e^{2^n}$ (or something that grows fast enough to overcome the log).
      *   **Round 3 (The Escalation):** Elias tries to adjust his utility function (maybe square root, maybe double log). The Dealer adjusts the payouts again.
      *   **Climax:** Elias realizes the pattern. To stop the divergence, his utility *must* asymptote.
