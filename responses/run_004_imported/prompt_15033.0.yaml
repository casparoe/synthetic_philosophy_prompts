answer: |-
  The room smelled of ozone and old paper. Elias sat opposite the Dealer, a man whose face was as smooth and unreadable as a whiteboard. Between them lay a single coin and a ledger.

  Elias had spent a year teaching himself decision theory. He knew the textbooks were wrong, or at least incomplete. He knew the St. Petersburg Paradox wasn't about money; it was about the architecture of desire.

  "Standard rules," the Dealer said. His voice was flat. "I flip a coin until it lands heads. If it lands heads on the first flip, you get \$2. Second flip, \$4. Third, \$8. The pot doubles every tail."

  Elias smiled. He had anticipated this. "The expected value is infinite. Half the time I get \$2, a quarter I get \$4, an eighth I get \$8. The sum is one plus one plus one, forever. But I won't pay infinity to play."

  "Why not?"

  "Because money isn't linear," Elias said, tapping the ledger. "Bernoulli figured this out three hundred years ago. The first million means more than the second. I price this gamble based on expected *utility*, not expected value. I use a logarithmic curve. My satisfaction grows slower than the payout."

  Elias did the math in his head. The utility of $2^n$ is proportional to $n$. The probability is $1/2^n$. The sum of $n/2^n$ converges. It was a finite number. Roughly equivalent to twenty dollars, depending on his current wealth.

  "I'll pay you twenty," Elias said. "To walk away."

  The Dealer didn't blink. He picked up the coin but didn't flip it. "You assume your capacity for satisfaction is logarithmic. That it grows forever, just slowly."

  "It has to grow," Elias said. "If it stopped, that would mean there's a point where more money adds *nothing* to my life. That's absurd."

  "Is it?" The Dealer opened a fresh page in the ledger. "Let's change the game. Same coin. Same probabilities. But the payouts are different. Instead of $2^n$, I promise you $e^{2^n}$."

  Elias frowned. "That's... exponentially larger."

  "Calculate your expected utility," the Dealer said. "You use the natural log, correct? $\ln(x)$?"

  "Yes."

  "So, what is the utility of the prize?"

  Elias picked up his pen. $\ln(e^{2^n})$. The log and the exponential canceled out. The utility was just $2^n$.

  "And the probability?" the Dealer prompted.

  "One over two to the $n$."

  "Multiply them."

  Elias wrote: $(1/2^n) \times 2^n = 1$.

  "The sum," the Dealer said, "is one plus one plus one, forever. Your expected utility is infinite again. By your own logic, you should mortgage your house to play this. You should sell your future labor. You should pay *anything*."

  Elias put the pen down. His hand felt heavy. "That's a specific counter. I can choose a different utility function. Something that grows slower than the log. A double log."

  "Then I will offer you payouts of $e^{e^{2^n}}$," the Dealer said instantly. "I will match whatever curve you draw. As long as your curve goes up forever—no matter how flat it gets—I can construct a payout sequence that rises steep enough to punch through it."

  Elias leaned back. The air in the room felt thin. This was Menger's objection, the one the pop-science books skipped. He had read the papers, but reading was different from sitting across from a man who could weaponize the theorem.

  "So there is no rational price," Elias said.

  "There is no rational price *if* you are insatiable," the Dealer corrected. "If your utility function is unbounded, there exists a gamble so volatile that it is worth your entire existence. Rationality demands you take it. But you won't. You're hesitating."

  "Because it's stupid," Elias snapped. "No one would pay their life savings for a one-in-a-billion chance at a googolplex dollars."

  "Then admit it," the Dealer said. "Admit that your utility function flattens. Admit that there is a number $M$ such that having \$M is exactly as good as having \$2M. That there is a ceiling on your well-being."

  Elias looked at the ceiling of the room. White acoustic tiles. "If I admit that... if I say there's a cap..."

  "Then the paradox vanishes," the Dealer said. "If utility is bounded, the expected utility of any gamble is bounded. I can't break it. You can price the ticket. You can sleep at night."

  "But," Elias whispered.

  "But?"

  "If there's a ceiling," Elias said, the words tasting like ash, "then there is a point where more is *nothing*. If I reach that wealth, or that happiness... I am full. I am capped. If I get sick, if I lose a loved one, if the world burns... I cannot be compensated. No amount of money can move the needle because the needle is pinned."

  "That is the cost of coherence," the Dealer said. He slid a contract across the table. "Option One: You acknowledge unbounded utility. You agree to pay any price I name for the Super Game. You accept that you are vulnerable to infinite exploitation."

  He slid a second pen out.

  "Option Two: You sign this declaration. You state that your satisfaction has a maximum limit. You are bounded. You are safe from the paradox. You are also... finished."

  "Finished?"

  "Desire is an asymptote," the Dealer said. "If you bound it, you admit that eventually, nothing matters more than anything else. That there is a state of existence where gaining the universe adds zero value. That is a kind of death, Elias. A spiritual flatline."

  Elias looked at the coin. It was silver, tarnished near the edge.

  He thought about the logarithmic curve he loved so much. It was elegant. It suggested that while money mattered less the more you had, it *always* mattered. There was always a horizon. Always a reason to reach. It preserved the dignity of ambition.

  But the math was clear. If the horizon never receded, the storm would eventually catch you. The Super St. Petersburg game would drain you. To be rational, to be safe, he had to admit that eventually, he simply wouldn't care.

  "If I sign," Elias asked, "what happens to the money I already have?"

  "Nothing," the Dealer said. "But the *promise* of more loses its magic. You are declaring yourself saturable."

  Elias picked up the pen. He hovered over Option Two.

  If he signed, he saved his rationality. He closed the loophole. He became immune to the Dealer's infinite games. But he had to accept that his own capacity for joy was a container with a bottom. That there was a version of reality so good that improving it was impossible. And conversely, a reality so bad that no compensation could fix it.

  If he didn't sign, he remained infinite. Unbounded. But then he was a fool. A man who would bet his life on a coin flip because the math said the upside was endless.

  "Elias," the Dealer said softly. "The coin is waiting."

  Elias realized the trap wasn't the gamble. The trap was the definition of a human being. Are we creatures who always want more, and thus are mathematically vulnerable? Or are we creatures who can have enough, and thus are mathematically safe but spiritually capped?

  He looked at the pen. He looked at the coin.

  "I need," Elias said, his voice cracking, "to think about the shape of the ceiling."

  "There is no shape," the Dealer said. "There is only the stop."

  Elias didn't sign. He didn't push the coin away. He sat with the pen in his hand, trembling slightly, caught between the terror of infinity and the horror of the limit. The coin sat between them, heads and tails indistinguishable in the dim light, waiting for a throw that would determine not his wealth, but the geometry of his soul.

  "Decide," the Dealer said.

  Elias opened his mouth, but found he had no price to name.
