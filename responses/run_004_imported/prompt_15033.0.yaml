      *   **Antagonist:** The Dealer (let's call him Menger, after Karl Menger who formalized this objection). Cold, analytical, represents the mathematical reality.
      *   **Setting:** A quiet, sterile room. A high-stakes private club or a metaphorical space. Let's make it a private backroom of a high-end casino or a think tank. A "wagering room."

  3.  **Plot Outline:**
