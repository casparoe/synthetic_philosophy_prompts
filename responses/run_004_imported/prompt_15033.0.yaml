      *   *Scene 1: The Setup.* Elias at the table. He's proud of his "solution." He cites Bernoulli.
      *   *Scene 2: The First Wager.* Dealer offers the coin flip game ($2^n$). Elias says, "I'll pay $20. My utility is $\ln(w)$." He feels safe.
      *   *Scene 3: The Twist.* Dealer says, "Okay, new game. Payout is $e^{2^n}$." Elias calculates. $\ln(e^{2^n}) = 2^n$. The sum of probabilities ($1/2^n$) times utility ($2^n$) is $\sum 1$. That diverges.
      *   *Scene 4: The Struggle.* Elias tries to argue. He suggests a different utility curve. Dealer points out that for *any* unbounded function $U$, there is a payout sequence $X$ such that $E[U(X)] = \infty$. This is Menger's theorem.
      *   *Scene 5: The Realization.* Elias has to choose. Either he pays any amount (irrational) or he admits there is a maximum possible happiness.
      *   *Scene 6: The Ending.* Elias stares at the ceiling. The concept of "enough." The horror of saturation.

