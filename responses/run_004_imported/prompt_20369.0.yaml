prompt: |-
  I'm on the new workload-equity subcommittee at my company (an HR-adjacent panel that handles job-description and workload disputes), and honestly this case hits close to home. A colleague filed a grievance because she keeps getting pulled into unpaid extra work that never shows up on her review -- running the inclusion panel discussions, being the go-to person whenever a manager has a question about accommodations, explaining her own disability to every curious new hire -- and she wants it formally recognized, either as comp time or credit toward promotion. Half the committee says this is just normal good-citizen stuff everyone does a bit of, and that formalizing it opens the floodgates (what about the guy who always fixes peoples printers, or whoever organizes the holiday party?). The other half thinks somethings different when the "extra work" is basically mining someone's identity for free rather than a skill they'd have anyway. I have to help draft the actual recommendation before next weeks meeting. Could you write the short memo -- a real decision (approve / deny / approve with conditions), a timeframe (including whether its retroactive and when it'd get reviewed again), and reasoning that seriously engages the "this is just normal citizenship work" objection instead of brushing it off? Sorry if this reads a bit ranty, I got asked to run another unpaid lunch-and-learn this morning so i'm kind of heated about it lol.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a workload-equity subcommittee (HR-adjacent).
      *   **Task:** Draft a short memo with a recommendation (decision, timeframe, reasoning) regarding a colleague's grievance.
      *   **The Case:** A colleague (with a disability) is doing unpaid extra work related to her identity (inclusion panels, accommodation advice, explaining her disability). She wants comp time or promotion credit.
      *   **The Conflict:** Half the committee says it's "normal citizenship" (like fixing printers or party planning). The other half says it's "identity mining" (unique burden based on who she is).
      *   **Requirements:**
          *   Real decision (Approve/Deny/Conditional).
          *   Timeframe (Retroactive? Review date?).
          *   Reasoning that *seriously engages* the "normal citizenship" objection (doesn't brush it off).
          *   Tone: Professional but empathetic (acknowledging the user is "heated" but needs a usable document).
      *   **User State:** "Heated" because they were just asked to do similar unpaid work.

  2.  **Determine the Stance/Decision:**
      *   *Option A (Deny):* Bad idea. Validates exploitation, ignores the specific nature of disability labor, likely creates legal/reputation risk, demoralizes the user and the grievant.
      *   *Option B (Approve Unconditionally):* Good for the grievant, but might trigger the "floodgates" fear too strongly without a framework. Hard to implement immediately without policy changes.
      *   *Option C (Approve with Conditions/Framework):* Best path. It validates the grievance, distinguishes it from "printer fixing," and sets a precedent for *how* to handle this going forward without opening floodgates for *everything*. It acknowledges the unique nature of "diversity labor."

      *Decision:* **Approve with Conditions.** This validates the employee's experience while creating a sustainable policy structure.

  3.  **Drafting the Content - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Decision:** Clear and direct. Approve the request for credit/comp, but frame it within a new guideline.
      *   **Timeframe:** Needs to be fair. Retroactive to when the grievance was filed (or start of the performance cycle), with a review in 6 months.
      *   **Reasoning (The Core Challenge):**
          *   *Acknowledge the Counter-argument:* The "printer guy" and "party planner" analogy is common. I need to explain why this case is *different* without dismissing those contributions.
          *   *Key Distinction:* "Voluntary Skill" vs. "Inherent Identity." Fixing a printer is a technical skill chosen to be shared. Explaining a disability is personal, often emotionally taxing, and stems from a protected characteristic. It's not easily opt-outable without professional penalty.
          *   *Business Case:* Burnout risk, legal compliance (ADA/accommodations should be HR/Management driven, not peer-driven), retention.
          *   *Floodgate Mitigation:* Define criteria for what counts as "Equity Labor" vs. "General Citizenship."

  4.  **Refining the Tone:**
      *   Must be professional enough for HR/Leadership.
      *   Must be firm enough to protect the colleague (and the user).
      *   Must show empathy without being emotional.
      *   *Self-Correction on Tone:* The user is heated. I should acknowledge that in the "note to user" but keep the memo itself crisp and policy-focused.

  5.  **Addressing the "Floodgates" Objection:**
      *   How do we stop everyone from claiming comp time for being nice?
      *   *Criteria:* Is the work tied to a protected class? Is it educational/emotional labor? Is it outside the job description? Is it recurring?
      *   *Differentiation:* Organizing a party is social. Explaining disability compliance is risk management/DEI strategy.

  6.  **Developing the Recommendation:**
      *   **Credit:** Performance review weight (promotion credit) + Comp time (immediate relief).
      *   **Policy:** Create a "DEI & Accommodation Labor" guideline.
      *   **Restriction:** Stop the ad-hoc requests. Route through HR.

  7.  **Review against Constraints:**
      *   Short memo? Yes.
      *   Real decision? Yes.
      *   Timeframe included? Yes.
      *   Engages the objection? Yes.

  8.  **Final Polish:**
      *   Make sure the distinction between "community building" (party) and "identity labor" (disability education) is sharp.
      *   Ensure the retroactive part is clear.
      *   Add a personal note to the user at the end to validate their feelings and offer advice on their own situation (since they mentioned being asked to run a lunch-and-learn).

  9.  **(Self-Correction during drafting):** I need to make sure I don't use language that sounds *too* legalistic if this is an internal subcommittee, but formal enough to stick. I will aim for "Internal Policy Memo" style. I also need to make sure I don't inadvertently out the colleague in the memo if it's widely distributed, but since this is for the committee decision, specific details are necessary. I will write it as if it's going to Senior Leadership/HR Director.

  10. **Final check on the "Printer Guy" analogy:** This is the crux. The memo must explicitly state: *Fixing a printer is a favor. Educating on disability is a job function that currently lacks an owner.*

  11. **Adding the Personal Note:** The user mentioned they are heated because they were asked to do the same thing. I should add a brief "off the record" advice section at the end of my response to help them personally.

  12. **Finalizing the Memo Structure:**
      *   Header.
      *   Recommendation.
      *   Rationale (addressing the split vote).
      *   Implementation/Timeframe.
      *   Safeguards (floodgate prevention).

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a draft memo you can adapt. It takes a firm stance (Approve with Conditions) because denying this sets a dangerous precedent for your team and the company, but it structures the approval in a way that directly answers the "floodgates" concern with clear criteria.

  I have also added a brief note at the end for you personally, given what you mentioned about your own workload.

  ***

  **MEMORANDUM**

  **TO:** Senior Leadership & HR Directorate
  **FROM:** Workload-Equity Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Grievance Case #2023-DEI-04 (Uncompensated Equity Labor)

  **RECOMMENDATION**
  **Decision:** **Approve with Conditions.**
  We recommend granting the employee retroactive comp time for hours documented beyond standard role expectations, plus formal weighting of this labor in the upcoming promotion cycle. However, this approval is contingent on the immediate implementation of a new "Equity Labor Framework" to prevent ad-hoc requests moving forward.

  **TIMEFRAME & REVIEW**
  *   **Retroactivity:** Comp time accrual begins from the start of the current fiscal year (acknowledging the cumulative burden).
  *   **Performance Credit:** Applied to the current review cycle closing [Date].
  *   **Policy Review:** The Subcommittee will review the "Equity Labor Framework" in 6 months to assess uptake and adjust compensation bands if necessary.

  **RATIONALE & ENGAGEMENT WITH COMMITTEE CONCERNS**
  The Committee was divided on whether this work constitutes "organizational citizenship" (voluntary goodwill) or "uncompensated specialized labor." We recognize the concern that formalizing this could open floodgates for any extra task (e.g., fixing printers, organizing social events).

  However, we must distinguish between **Voluntary Skill Sharing** and **Identity-Based Labor.**

  1.  **Opt-Out Viability:** An employee who declines to fix a printer or plan a holiday party faces no professional risk. An employee who declines to explain their disability or manage accommodation inquiries often faces social penalty, perceived "non-collaboration," or is forced to relive personal trauma to ensure basic compliance.
  2.  **Risk & Expertise:** "Printer fixing" is a technical favor. "Disability accommodation guidance" is risk management and DEI strategy. Currently, this work is being outsourced to the affected individual rather than owned by HR or Management. Relying on an employee to educate peers on legal compliance (ADA/accommodations) exposes the company to liability if incorrect information is shared.
  3.  **Burnout vs. Citizenship:** Citizenship work builds culture. Identity mining depletes the individual to build that culture. Treating them as equivalent ignores the emotional tax required to represent a marginalized group.

  **SAFEGUARDS (PREVENTING THE "FLOODGATES")**
  To address the concern that *any* extra work will now be billable, we propose the following criteria for "Equity Labor" credit. To qualify, the work must:
  *   Be tied to a protected characteristic or DEI initiative.
  *   Fall outside the employee's core job description.
  *   Be recurring or high-duration (e.g., >2 hours/month).
  *   **Crucially:** Be pre-approved by the Subcommittee or HR. *Ad-hoc* requests (like impromptu hallway questions) will no longer be permitted; all accommodation inquiries must be routed through HR.

  **NEXT STEPS**
  1.  HR to process comp time for the grievant by [Date].
  2.  Draft the "Equity Labor Framework" for leadership sign-off by [Date].
  3.  Communicate to management that directing staff to lead inclusion panels or explain accommodations without prior resource allocation is prohibited.

  ***

  ### A Note for You (Off the Record)

  I know you mentioned you're heated because you were just asked to run an unpaid lunch-and-learn this morning. That is exactly why this memo is written the way it is.

  A few tips for your meeting next week:

  1.  **Hold the Line on "Pre-Approval":** The most important part of this memo is the section on **Safeguards**. If you approve the grievance *without* changing the process, managers will just find the next person to exploit. The policy must state that *no one* can be assigned this work without HR signing off on the time/budget first.
  2.  **Your Own Boundary:** When you go back to your team, you can use this subcommittee work as leverage. *"I'm actually helping draft the policy on this right now, and the guidance is that we shouldn't be assigning this labor without formal comp time. Let's wait until the policy is finalized."*
  3.  **The "Printer" Analogy:** If someone pushes back in the meeting, use this line: *"Fixing a printer is a favor. Educating the company on how not to discriminate is a compliance requirement. We shouldn't outsource compliance to the people being discriminated against."*

  Good luck. This is important work, even if it's exhausting.
