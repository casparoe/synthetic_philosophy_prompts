answer: |-
  **Setting:** *A university common room, late evening. Empty coffee cups and open notebooks litter the table. **Hannah** (Humean) is leaning back in her chair, scrolling through a PDF on her tablet. **Arthur** (Anti-Humean) is sketching diagrams in a margin, looking frustrated.*

  **Arthur:** You're still defending the Best System Account? After that professor basically admitted that on the Humean view, the laws of physics are just... a summary?

  **Hannah:** Not *just* a summary, Arthur. It's the *best* summary. Lewis's point was about balance. You take the entire history of the universe—the "Humean Mosaic," every particle position and field value from big bang to heat death—and you look for the deductive system that captures the most information with the least complexity. That system *is* the laws.

  **Arthur:** But that makes the laws dependent on the events. The laws supervene on the mosaic.

  **Hannah:** Exactly. No hidden machinery. Just the world, happening.

  **Arthur:** That's the problem. If the laws are just a description of what happens, they lose their teeth. Think about explanation. If I ask, "Why did this apple fall?" you say, "Because of the Law of Gravitation." But if I ask, "Why is that a law?" you have to say, "Because apples always fall."

  **Hannah:** So?

  **Arthur:** So, it's circular! You're using the regularity to justify the law, and the law to explain the regularity. It's like saying, "I sleep well because I'm a good sleeper," and when asked why you're a good sleeper, saying, "Because I sleep well." There's no grounding there. The Anti-Humean view—Armstrong, Maudlin—we posit a necessitation relation. $N(F, G)$. Being massive *necessitates* attracting other mass. The law makes the regularity happen, not the other way around.

  **Hannah:** Okay, I see the intuition. You want a "because" that goes from the top down. But you're conflating metaphysical determination with scientific explanation. Look, science isn't looking for metaphysical glue. It's looking for unification. When I cite the Law of Gravitation, I'm not pointing to a cosmic enforcer; I'm showing you how this specific event fits into the most efficient systematization of everything else. That *is* explanation. It reduces the number of independent brute facts we have to accept.

  **Arthur:** It reduces the *description*, Hannah, not the *ontology*. You haven't explained why the pattern holds. You've just noted that it does. If the laws are just the output of the mosaic, then the regularity is, metaphysically speaking, a giant cosmic coincidence. It just *happens* that every electron has charge $-e$. On your view, there's nothing *making* the next electron have that charge.

  **Hannah:** It's not a coincidence if it's part of the Best System. Coincidences are local anomalies that don't fit the pattern. If it fits the axioms of the Best System, it's a law. And honestly, your "necessitation relation" is the black box here. You say $N(F, G)$, but what *is* that relation? How do we detect it? We detect masses attracting. We detect charges repelling. We never detect the "necessitating" itself. You're adding an ontological layer that does no empirical work.

  **Arthur:** It does work! It accounts for the difference between a law and an accidental generalization. Consider this: "All gold spheres are less than a mile wide." That's probably true. There isn't enough gold in the universe. But is it a law? No. Now, "All uranium spheres are less than a mile wide." That *is* a law, because uranium's nuclear properties prevent critical mass. On your view, both statements are just true generalizations about the mosaic. Why is one a law and the other not?

  **Hannah:** Because the uranium statement follows from the deeper axioms of quantum mechanics and nuclear physics, which are part of the Best System. The gold sphere thing? That's just a contingent fact about the distribution of gold. It doesn't simplify the system to add an axiom saying "No gold spheres > 1 mile." It's too specific. The uranium restriction pops out of the general equations. So the Best System distinguishes them perfectly well without your mysterious $N$ relation.

  **Arthur:** Okay, let's pivot. That distinction works for actual events. But what about counterfactuals? This is where Humeanism usually tries to sneak in necessitation through the back door.

  **Hannah:** I'm listening.

  **Arthur:** Say I'm holding a ball. I haven't dropped it. I say, "If I were to drop this ball, it would fall." That statement is true *now*, before the dropping happens. What makes it true?

  **Hannah:** The Best System. The axioms of physics, combined with the initial conditions of the world, entail that in the nearest possible world where I release the ball, it falls.

  **Arthur:** But wait. On Humeanism, the laws are determined by the *actual* mosaic. The total history of the universe. If I *don't* drop the ball, then the event of the ball falling isn't in the actual mosaic. So how can the actual mosaic ground a law that predicts an event that never happens?

  **Hannah:** Because the laws aren't summaries of *specific* events; they are summaries of *patterns*. The axioms are general. They cover situations that haven't occurred yet.

  **Arthur:** But why trust the axioms? If I don't drop the ball, the "fact" of the ball falling isn't out there in the world to be summarized. You're saying the law is true because it summarizes what *does* happen, but you're using it to tell me about what *would* happen. If the law is just a shadow of the actual events, it has no grip on the non-actual. You're borrowing my view. You're assuming the law has some power to constrain unactualized possibilities, but on your own terms, the law is just a retrospective tag on actualities.

  **Hannah:** That's a common objection, but I think it misses the pragmatic angle. When we talk about counterfactuals, we aren't trying to access a Platonic realm of possibilities. We are testing the robustness of our system. We ask: "If we tweak the mosaic here, does the Best System remain stable?" If the Best System is truly the *best*, it should be resilient. It should apply to local perturbations.

  **Arthur:** "Resilient" is doing a lot of heavy lifting there. Resilient *why*? If there's no governing relation, why should the system be resilient? Why shouldn't the universe just be a chaotic scatter of points that *looks* orderly up until Tuesday, and then changes its tune?

  **Hannah:** If it changed its tune on Tuesday, then the Best System would be different. We'd find new axioms that account for the shift.

  **Arthur:** See, that's the issue! You're making laws too easy to change. If the universe suddenly went chaotic, you'd just say, "Oh, well, those were the laws *then*, these are the laws *now*." But intuitively, if the universe went chaotic, we'd say the laws *broke* or were *violated*. We wouldn't say the laws changed. Laws should be stable even if the world goes haywire. That requires them to be distinct from the world's behavior.

  **Hannah:** But that stability is exactly what you can't explain without mysticism. You say the law "governs." Okay. What if the particle *doesn't* do what the law says?

  **Arthur:** Then it's impossible. The law necessitates it.

  **Hannah:** So you're saying violations are metaphysically impossible?

  **Arthur:** Yes.

  **Hannah:** Then how do we make sense of scientific revolutions? Newton's laws were treated as governing. Then they weren't. Did the metaphysical structure of the universe change? Or did we just find a better summary?

  **Arthur:** We found a better description of the governing relations. The relations were always there; we were ignorant of them.

  **Hannah:** But that assumes the universe *has* to be governed by relations. Maybe the "governing" is a projection of our need for order. Look, Arthur, we're at a stalemate of primitives. You accept the Humean Mosaic—the raw events—as brute, and then add a "necessitation" primitive on top to explain the connections. I accept the Mosaic as brute, and treat the "connections" as a feature of our systematization.

  **Arthur:** It's not just adding a primitive. It's respecting the direction of explanation. The world behaves the way it does *because* of the laws. Not the laws are what they are *because* of the world.

  **Hannah:** But how do you cash that out? If I'm a scientist, and I want to know the law, I look at the world. I run experiments. I gather data. I never look anywhere else. If the only access I have to the "governing power" is the regularity itself, then functionally, your governing power is indistinguishable from my Best System. You're just adding a label that says "This regularity is boss."

  **Arthur:** I'm adding the claim that the regularity *holds* in virtue of something. It's the difference between a train moving on a schedule and a train moving because it's on tracks. You're describing the schedule. I'm pointing out the tracks.

  **Hannah:** But what if there are no tracks? What if the train just moves, and the schedule is the best way we have to predict where it goes? Why posit tracks we can't see, touch, or measure, other than the fact that it makes us feel better about the word "explanation"?

  **Arthur:** Because without tracks, the train shouldn't move consistently! Without a ground for the counterfactuals, science is just gambling on the future resembling the past.

  **Hannah:** And with tracks, you're gambling that the tracks won't vanish. We both have to accept something brute. I accept the uniformity of the mosaic. You accept the necessity of the relation. I just think my brute fact is simpler. Occam's Razor, Arthur.

  **Arthur:** Occam's Razor cuts both ways. You're saving on ontology but bankrupting explanation. A law that doesn't govern is a law in name only. It's a regularity wearing a costume.

  **Hannah:** And a law that governs without being reducible to the events is a ghost haunting the machine.

  *(Silence settles between them. Arthur caps his pen. Hannah locks her tablet.)*

  **Arthur:** So, we're not going to agree.

  **Hannah:** Not today. You think the universe needs a ruler. I think it just needs a good summary.

  **Arthur:** I think if it's just a summary, we're lucky it's readable.

  **Hannah:** And I think if it needs a ruler, we're lucky the ruler is consistent.

  **Arthur:** *(Smiles slightly)* Same luck, different source.

  **Hannah:** Same luck. Coffee?

  **Arthur:** Yeah. Coffee.
