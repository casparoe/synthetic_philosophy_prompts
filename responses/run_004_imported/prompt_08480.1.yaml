answer: |-
  It is a pleasure to correspond with someone who has spent a career attending to the actual material details of evolutionary history. Your puzzle is not only understandable; it is historically astute. Many philosophers and biologists have glossed over the tension you have identified, but from the standpoint of comparative anatomy, the distinction is morphologically significant.

  The confusion arises because the 1979 paper is a *polemic* against a methodological error (adaptationism), while the 1982 paper is a *taxonomic* proposal for a vocabulary of historical origins. To answer your questions directly, we must disentangle the criterion of **origin** from the criterion of **current utility**.

  ### 1. Direct Comparison: Origin vs. History of Use

  **The Spandrel (1979)**
  *   **Definition:** A trait that arises as a necessary architectural or developmental consequence of other traits, without being directly shaped by natural selection for its own sake.
  *   **Key Criterion:** **Non-adaptive origin.**
  *   **Analogy:** The triangular space between arches in San Marco. The architect did not design the space first; the space exists because the arches exist.
  *   **Biological Example:** The red colour of blood. It is a necessary chemical consequence of hemoglobin's oxygen-carrying capacity, not a trait selected for camouflage or signaling (initially).

  **The Exaptation (1982)**
  *   **Definition:** A trait that currently enhances fitness but was not shaped by natural selection *for that specific current function*.
  *   **Key Criterion:** **Mismatch between original cause and current effect.**
  *   **Taxonomy:** Gould and Vrba divided exaptations into two distinct historical categories:
      1.  **Co-opted Spandrels:** A non-adaptive byproduct is later co-opted for use (e.g., perhaps the human chin, if it is a structural byproduct of jaw reduction, later used for muscle attachment).
      2.  **Co-opted Adaptations:** A trait shaped by selection for Function A is later co-opted for Function B (e.g., feathers: insulation $\rightarrow$ flight).

  ### 2. The Set Relations

  To answer your specific logical queries:

  **Are all spandrels exaptations?**
  **No.** A spandrel is defined by its non-adaptive origin. If it remains a useless byproduct throughout the lineage's history, it is a spandrel but *not* an exaptation. It only becomes an exaptation if it is subsequently co-opted for a function. A useless structural constraint is a spandrel; a useful co-opted constraint is an exaptation (of the spandrel variety).

  **Are all exaptations spandrels?**
  **No.** This is the crux of your puzzle. As you noted with the feather example, a trait can be an adaptation for one function (thermoregulation) and an exaptation for another (flight). Because feathers were shaped by selection for thermoregulation, they are not spandrels in the 1979 sense. They were not "forced" by architectural constraint; they were built by selection. Thus, the class of Exaptations is broader than the class of Spandrels.

  **The Intersection:**
  The overlap consists of **co-opted byproducts**. These are traits that arose non-adaptively (spandrels) and were later pressed into service (exaptations).

  ### 3. Which Concept Does the Philosophical Work?

  In the broader case against the "Panglossian Paradigm," the two concepts perform different labor.

  **"Spandrel" is the battering ram.**
  In the 1979 paper, the concept of the spandrel does the heavy lifting against adaptationism. Its philosophical job is negative: it demonstrates that *not all form is the result of direct selection*. It forces the adaptationist to prove that a trait is not merely a structural or developmental constraint. It attacks the assumption that current utility implies historical origin.

  **"Exaptation" is the repair kit.**
  By 1982, Gould and Vrba realized that "spandrel" was insufficient for a positive science of evolutionary history. Biologists needed a way to talk about traits like feathers without calling them "adaptations for flight" (which implies false history) but also without calling them "spandrels" (which implies they weren't selected for *anything*).
  "Exaptation" does the work of **historical precision**. It allows the anatomist to say: "This structure is adaptive *now*, but we must not infer its origin from its current utility." It prevents the retreat into semantic ambiguity where "adaptation" is used to mean both "process of shaping" and "current usefulness."

  So, to your question: **Spandrel** is the concept that undermines the Panglossian paradigm. **Exaptation** is the concept that allows us to build a non-Panglossian vocabulary to replace it.

  ### 4. Why Introduce a Second Term in 1982?

  You asked why Gould felt the need for a new term only three years later. There are three primary reasons, rooted in the reception of the 1979 paper:

  1.  **Semantic Drift:** After 1979, the term "spandrel" began to be used loosely in the literature to mean *any* co-opted trait, including things like feathers. Gould, a stickler for historical accuracy, found this intolerable. If "spandrel" came to mean "co-opted trait," it lost its specific meaning of "non-adaptive byproduct." He needed a new umbrella term ("exaptation") to cover all co-options, reserving "spandrel" for the specific subset of non-adaptive origins.
  2.  **The "Adaptation" Ambiguity:** In standard evolutionary parlance, "adaptation" conflates two things: (a) the historical process of being shaped by selection, and (b) the current state of being useful. Gould and Vrba wanted to sever this link. They proposed restricting "Adaptation" strictly to (a). Consequently, they needed a new word for traits that are (b) but not (a) regarding their *current* function. "Exaptation" fills that slot.
  3.  **Constructive vs. Destructive:** The 1979 paper was famously destructive (hence its fame and notoriety). It told biologists what they were doing wrong. The 1982 paper was an attempt to be constructive. It offered a methodology for reconstructing evolutionary history that acknowledged complexity without dissolving into "just-so stories."

  ### A Note from Morphology to Morphology

  Given your background in limb morphology, you might view the distinction this way:

  When you examine a fossil limb, if you assume every ridge and tuberosity is an **adaptation**, you are assuming selection optimized every millimeter for a specific function.
  If you identify a feature as a **spandrel**, you are hypothesizing that the feature exists because of the geometric requirements of bone growth or joint articulation, regardless of utility.
  If you identify a feature as an **exaptation**, you are hypothesizing that the feature's current mechanical advantage (e.g., leverage for flight) is not the reason it originally evolved (e.g., leverage for climbing or insulation support).

  Gould's frustration, which drove the 1982 paper, was that biologists were happy to accept the "Spandrel" critique as a clever metaphor but continued to use the word "Adaptation" in the old, sloppy way. "Exaptation" was his attempt to force the discipline to speak precisely about time and history.

  In summary: **Spandrels** are a subset of **Exaptations** (only when co-opted), but **Exaptations** include many traits (like feathers) that are not Spandrels. The Spandrel argument breaks the adaptationist spell; the Exaptation vocabulary keeps it broken.
