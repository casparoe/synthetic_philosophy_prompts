          *   Exaptations = The Reconstruction (Positive thesis: Here is how to talk about history).
          *   The "Panglossian Paradigm" is attacked primarily by the existence of Spandrels. Exaptation prevents the retreat into semantic ambiguity.
      *   *Section 4: Why the 1982 Paper?*
          *   Semantic drift after 1979.
          *   Need to distinguish "Adaptation" (process/history) from "Adaptive" (current utility).
          *   Gould's obsession with historical narrative vs. ahistorical functionalism.
