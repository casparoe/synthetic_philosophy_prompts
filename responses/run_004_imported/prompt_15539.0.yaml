answer: |-
  Here are ten interview questions designed to move from textual exegesis to logical pressure, ending with epistemic criteria. They are ordered to make the "you are assuming Western logic" defense increasingly costly to maintain.

  **1. The "Seeking" Argument and Extension**
  "The Dialogue argues that if you 'seek a horse,' a yellow or black horse will satisfy you, but if you 'seek a white horse,' they will not. You argue this proves 'horse' and 'white horse' denote different quantities of stuff. But in modern semantics, we'd say this is just about *intension* versus *extension*: the criteria for satisfaction are different, even if the object is the same. If I ask for a 'fast car,' a slow car doesn't satisfy me, but a slow car is still a car. Why does Gongsun Long treat the failure of satisfaction as proof of non-identity rather than just a restriction of criteria?"

  *   **Follow-up:** "If it is merely about criteria, doesn't that preserve the class relationship—that a white horse is a *subset* of horses satisfying extra criteria—rather than requiring them to be distinct ontological stuffs?"

  **2. The Equivocation on "Is Not"**
  "Critics often charge that the thesis 'a white horse is not a horse' equivocates on 'is not.' In English, 'a circle is not a square' means non-identity, but 'a poodle is not a dog' means non-inclusion. Your defense is that Classical Chinese doesn't make this distinction the way we do. But even within a mereological or mass-noun framework, I can say 'this whiskey is not water' (true) and 'this rye whiskey is not whiskey' (false). Which sense of 'not' is Gongsun Long using? If he means 'not identical,' the claim is trivial; if he means 'not included,' isn't he asserting something empirically false about how color modifies nouns?"

  *   **Follow-up:** "If you say he means 'not identical,' why does the Dialogue spend so much effort arguing against people who clearly feel the intuition of inclusion? Is he solving a logical problem or creating a linguistic one?"

  **3. Intersective vs. Privative Modifiers**
  "Linguists distinguish between *intersective* modifiers, where a 'red car' is both red and a car, and *privative* modifiers, where a 'fake gun' is not a gun. Standardly, color adjectives are intersective. But on your reading, 'white' seems to function privatively: adding 'white' to 'horse' removes the object from the category 'horse.' Are you committed to the view that Classical Chinese treats color adjectives as ontologically subtractive, like the word 'fake'? And if so, is that a cost you are willing to pay for the coherence of the Dialogue?"

  *   **Follow-up:** "If 'white' acts like 'fake,' does that imply that for Gongsun Long, a white horse is somehow less real, or less of a horse, than an uncolored horse? What would an uncolored horse even be in that ontology?"

  **4. Mereological Composition**
  "Let's press the mereology. If 'horse' names the shape-stuff and 'white' names the color-stuff, 'white horse' names the compound. In mereology, a compound is usually composed of its parts. So, the 'white horse' stuff should contain the 'horse' stuff as a proper part. If A contains B as a part, can we truly say 'A is not B' without qualification? If I say 'this wall is not brick,' I am denied by the fact that the wall is made of brick. Why is the compound not allowed to inherit the name of its constituent?"

  *   **Follow-up:** "If you argue that the compound is a *new* unity that supersedes the parts, doesn't that require a principle of unity that looks suspiciously like a class definition—the very thing you say they lacked?"

  **5. Ontological Explosion**
  "If 'white horse is not horse' holds because the compound stuff differs from the simple stuff, does this apply to every modifier? Is a 'black horse' not a horse? Is a 'tall horse' not a horse? If every modification creates a new, distinct name for a distinct quantity of stuff, doesn't the ontology explode into infinite individual 'stuffs' for every possible combination of properties? How does Gongsun Long avoid a world where no two things can ever share a name?"

  *   **Follow-up:** "If the answer is that only *some* modifiers create this separation, what is the rule distinguishing 'white' (which separates) from other modifiers that might not? Where does he define that boundary?"

  **6. The Software Analogy: Subtyping**
  "I work in software, and I often argue about whether a `ReadOnlyList` should inherit from `List`. Intuitively, a read-only list *is a* list, just with restrictions. But some type systems forbid this to prevent errors. If we map your reading onto this: is 'Horse' the base class and 'WhiteHorse' the subclass? Or are they sibling interfaces? If they are siblings, as your thesis suggests, how do you explain the intuitive 'cast' that allows us to treat a white horse as a horse in everyday reasoning without a type error?"

  *   **Follow-up:** "In engineering, if two types overlap 100% in memory layout but differ in methods, we usually call that polymorphism, not distinct existence. Why should metaphysics treat 'white' as changing the memory layout of the object rather than just its methods?"

  **7. The Mohist Canon as Counter-Evidence**
  "Gongsun Long's contemporaries, specifically the Mohists in the *Lesser Taking*, explicitly argued against him. They wrote, 'A white horse is a horse; to ride a white horse is to ride a horse.' They were using the same language, in the same century, with a sophisticated logical system of their own. If the mass-noun hypothesis is the correct reading of the language, how did the Mohists get it so wrong? Are we to believe Gongsun Long understood the grammar of his own tongue better than his rival logicians did?"

  *   **Follow-up:** "If you say the Mohists were arguing prescriptively (how we *should* speak) while Gongsun was descriptive (how we *do* speak), doesn't that admit that ordinary usage *did* treat 'white horse' as a kind of 'horse,' making Gongsun's point a paradox rather than a literal truth?"

  **8. The "Mouth vs. Mind" Charge**
  "Historical records say the School of Names could 'defeat an opponent's mouth but not convince their mind.' This suggests their arguments were logically valid but pragmatically absurd. If your reading is correct—that this is a serious claim about mass nouns rather than a paradox—why was it received as a parlor trick? Is it possible that the 'mass-noun' reading rescues the logic but ignores the historical reception that this was intended as a *reductio ad absurdum* of rigid naming?"

  *   **Follow-up:** "If it was a *reductio*, then the conclusion 'white horse is not horse' is meant to be false. Does your defense of the thesis risk turning a satire of logical rigidity into a sincere metaphysical doctrine?"

  **9. Translation and Communicability**
  "If Classical Chinese general terms truly function like mass nouns, then translating *ma* as 'horse' (a count noun) is systematically misleading. When you teach this to students, do you tell them they are fundamentally misunderstanding the text by using English? If the logic relies on a grammatical feature that disappears in translation, is the argument actually about the world, or is it just an untranslatable feature of Classical Chinese syntax that we are over-interpreting as philosophy?"

  *   **Follow-up:** "If it's untranslatable, can it really be a universal claim about logic and reality, which is how Gongsun Long seems to present it? Or is it a local linguistic curiosity?"

  **10. Falsification Criteria**
  "Finally, I want to ask about the limits of your interpretation. You have a robust framework that explains the text by positing a mass-noun semantics. But every theory needs a condition under which it would be abandoned. What specific textual evidence, or what specific logical inconsistency within the Dialogue, would be enough to make you say, 'Okay, the mass-noun hypothesis fails here, and the class-inclusion reading is better'? Is there any passage in the *White Horse Dialogue* that you struggle to reconcile with your view?"

  *   **Follow-up:** "If the answer is 'no,' because any counter-evidence can be re-interpreted as 'Western logic projecting onto Chinese,' does that insulate the theory from being wrong? And if it can't be wrong, does it still count as an argument?"
