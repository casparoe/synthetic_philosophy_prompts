      *   *Intent/Context:* Garrison wins on original public meaning regarding *function*. The document *did* protect slavery in practice.
      *   *Verdict:* Douglass's reading is legally more robust *if* you treat the Constitution as a living legal charter rather than a political contract. It offers a path to abolition *within* the system. Garrison's reading is historically more accurate regarding the *compromise* but legally nihilistic.
      *   *Decision:* I need to pick a side. Douglass's reading is the "stronger" *legal* argument because it utilizes the text's silence as a weapon, whereas Garrison's relies on extratextual context to condemn the text itself. Douglass's view aligns better with how courts eventually interpreted the Reconstruction Amendments.

