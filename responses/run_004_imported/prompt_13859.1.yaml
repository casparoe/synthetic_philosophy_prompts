      *   *Nuance:* The 3/5 clause is tricky. Slave states wanted slaves counted for representation. Northern states said "no, you count them for taxation then." The compromise was 3/5. Garrisonians saw this as dehumanizing. Douglassians saw it as limiting Southern power. I need to explain this clearly.
      *   *Motivation:* Be careful not to diagnose Douglass's psychology too much, stick to the historical record of his letters and speeches (e.g., "Change of Opinion" speech in 1851).

  7.  **Final Polish:** Check against constraints. Did I avoid the "Douglass was great" summary? Yes. Did I address the specific clauses? Yes. Did I pick a side? Yes.

  **(Self-Correction Note on the "Pick a Side" instruction):** The prompt asks me to "actually pick a side on which is the stronger reading." I need to be decisive here. I will argue that Douglass's textualism is the stronger *legal* argument, even if Garrison's was the stronger *political* diagnosis of the 1787 moment.

