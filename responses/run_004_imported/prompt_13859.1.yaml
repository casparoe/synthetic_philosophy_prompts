              *   Art. IV, Sec. 2 (Fugitive Slave Clause): Requires return of "Person held to Service or Labour."
              *   Art. I, Sec. 8 (Insurrection Clause): Federal power to suppress rebellions (used against slave revolts).
          *   *Text/Reality Gap:* The euphemisms ("other Persons," "held to Service") don't matter. Everyone knew what they meant. The document protects the *institution* of slavery to preserve the Union.
          *   *Conclusion:* Moral complicity. Voting under this constitution makes you a slaveholder. Disunion is the only moral path.

      *   **Douglass/Spooner/Smith View (The "Anti-Slavery" Reading):**
