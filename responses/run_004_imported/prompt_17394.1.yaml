prompt: |-
  I'm a junior at my high school, where I serve on our Student Government Association's Bylaws and Elections Committee. Our SGA runs on a fairly formal written charter and something close to Robert's Rules of Order, so committee recommendations actually get debated and voted on by the full Senate rather than rubber-stamped, which is why I've been asked to draft an actual memo before our meeting this Thursday.

  The situation is this: our outgoing SGA president wants her final act in office to be an amendment she's calling the Informed Voter Initiative. Under it, every student keeps exactly the voting rights they have now, but any student who attends all three candidate forums and passes a short, fact-based quiz on the candidates' actual platforms (not their slogans or social media presence) gets a second vote added to their tally in SGA elections and referenda. She got the idea partly from an excerpt of John Stuart Mill arguing for what he called plural voting that we read in AP Government, and partly from her frustration that our last major referendum, on the vending machine contract, seemed to get decided by whichever side had the funnier poster campaign rather than by the actual terms either side was proposing. Our faculty advisor, who studied political theory before she started teaching, mentioned that this is essentially a small-scale version of what political philosophers call epistocracy, and that whether anything like it can ever be justified is a genuinely live and unresolved debate rather than something with an obvious answer. Roughly half the committee thinks this is a clever, low-stakes way to reward students for actually being informed, since nobody loses the vote they already have. The other half thinks it's elitist no matter how it's packaged, since attending three after-school forums is much easier for students without a job, a sports practice, or a late bus to catch, and since it effectively tells some of our classmates that their political judgment counts for less than other students'. One committee member who's currently taking AP Statistics also brought up something she called Condorcet's jury theorem, which she thought might actually cut against the amendment even for someone who cares only about the group reaching the objectively better decision and not about fairness at all -- though none of us could reconstruct her reasoning well enough to know if she's right.

  Could you draft the memo I'll bring to Thursday's meeting? It should give the committee a clear recommendation -- adopt the amendment, reject it, or adopt some specific modified version of it -- along with a realistic timeline, since spring elections are six weeks out and any change to how ballots are counted needs to be finalized and explained to the student body well before then. Please make sure the memo genuinely engages with the strongest argument on whichever side it doesn't end up recommending, instead of raising it only to wave it away, and please also address directly whether my classmate's instinct about Condorcet's jury theorem actually holds up here.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Junior High School Student, Member of SGA Bylaws and Elections Committee.
      *   **Audience:** The rest of the Bylaws and Elections Committee (and potentially the full Senate later, but this memo is for the committee meeting).
      *   **Task:** Draft a formal memo recommending a course of action on the "Informed Voter Initiative" (IVI).
      *   **Context:**
          *   Outgoing President proposes IVI.
          *   IVI gives a second vote to students who attend 3 forums + pass a platform quiz.
          *   Basis: John Stuart Mill's plural voting, frustration with superficial campaigning (vending machine referendum).
          *   Faculty Advisor note: This is "epistocracy," a live/unresolved debate.
          *   Committee Split: 50/50 (Reward informed voting vs. Elitist/Unequal access).
          *   Specific Argument to Address: Condorcet's Jury Theorem (raised by an AP Stats student).
          *   Constraints: Spring elections are 6 weeks away. Timeline must be realistic.
          *   Requirement: Must give a clear recommendation (Adopt, Reject, or Modify). Must engage seriously with the strongest counter-argument. Must address the Condorcet's Jury Theorem point.
      *   **Tone:** Formal, respectful, analytical, persuasive (SGA style, close to Robert's Rules).

  2.  **Determine the Recommendation:**
      *   *Option A (Adopt):* Risky. 6 weeks is tight for implementation (creating quizzes, scheduling forums, verifying attendance). High controversy might derail the election itself. The "elitist" argument is strong in a high school setting where extracurricular/economic disparities are real.
      *   *Option B (Reject):* Safe, but dismisses the President's legacy and the valid concern about uninformed voting. Might cause friction with the outgoing admin.
      *   *Option C (Modify/Pilot):* Best middle ground. Acknowledges the goal (better informed electorate) without implementing the controversial "second vote" mechanism immediately. Perhaps a "Voter Guide" or a non-binding certification.
      *   *Decision:* **Recommend Rejection of the current amendment, but propose an alternative "Informed Voter Pilot Program" for next year.** Why? Because 6 weeks is logistically impossible to do *fairly* (addressing the access concern) and the Condorcet argument suggests it might not even improve outcomes. However, simply saying "no" is divisive. Offering a study/pilot for next year shows good faith.
      *   *Refinement:* Actually, looking at the prompt, it asks for a recommendation on *this* amendment for *this* election cycle (implied by the timeline pressure). If I recommend rejection, I need to be firm. If I recommend modification, it needs to be feasible in 6 weeks.
      *   *Re-evaluating Condorcet:* Condorcet's Jury Theorem states that if each voter is more likely than not (p > 0.5) to choose the correct option, adding more voters improves the probability of the group choosing correctly. If some voters are *less* likely than random (p < 0.5), they drag the average down. However, if the "informed" voters are only slightly better (p = 0.55) and the "uninformed" are random (p = 0.5), adding weights to the informed helps. *But*, the Stats student thinks it cuts *against* the amendment. Why? Perhaps because if the quiz selects for test-taking ability rather than political judgment, or if the "correct" answer isn't objective. Or, more likely, if the "informed" group becomes too small, the theorem's benefit diminishes compared to the sheer number of random voters. Actually, the strongest Condorcet argument *against* weighted voting is that if the "informed" criteria are flawed (biased quiz), you are weighting bias, not truth. Or, simply, that the theorem assumes independence of voters, and forums create groupthink.
      *   *Wait, let's look closer at the prompt:* "address directly whether my classmate's instinct about Condorcet's jury theorem actually holds up here." I need to research/verify this. Condorcet's Jury Theorem generally supports *more* voters if they are competent. Weighted voting (Mill's idea) is usually justified *outside* of Condorcet, or by arguing that the weights correct for competence disparities. If the Stats student thinks it cuts *against* the amendment, she might be arguing that diluting the weight of the majority (even if less informed) reduces the probability of a correct outcome if the "competence" gap isn't large enough.
      *   *Actually, a common critique:* If you give extra votes to a small elite, you reduce the *n* (effective sample size) of the independent judgments. If the elite are not significantly more competent than the average, the loss of sample size hurts more than the gain in average competence.
      *   *Decision:* I will recommend **Rejecting the Amendment for this Cycle.** Why? Logistical impossibility (6 weeks) + Equity concerns (access to forums) + Theoretical uncertainty (Condorcet). I will propose forming a task force to study it for next year. This allows me to engage deeply with the arguments without rushing a bad policy.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Purpose:** State the goal (Recommendation on IVI).
      *   **Background:** Briefly summarize the proposal and the context (Mill, Vending Machine Referendum).
      *   **Analysis of Arguments:**
          *   *Pro:* Encourages engagement, mitigates populism/sloganeering.
          *   *Con (Equity):* Access to forums (jobs, sports, bus). This is the "Elitist" argument.
          *   *Con (Condorcet):* Address the Stats student's point. (Explanation: Theorem relies on independence and average competence. Weighted voting reduces effective sample size. If the "informed" advantage is marginal, the math favors one-person-one-vote).
      *   **Logistical Reality:** 6 weeks is not enough time to draft valid quizzes, schedule 3 forums, and educate the student body without confusion.
      *   **Recommendation:** Reject for now. Establish a commission to study for next year.
      *   **Timeline:** Show the 6-week crunch vs. what's needed.

  4.  **Refining the Condorcet Argument:**
      *   I need to make sure I get the math/logic right for the memo.
      *   *Condorcet's Jury Theorem:* As $n$ (voters) increases, probability of correct majority decision approaches 1, *provided* average voter competence $p > 0.5$.
      *   *Weighted Voting:* Effectively reduces $n$. If you give 2 votes to Group A and 1 to Group B, you are reducing the diversity of independent signals.
      *   *The Stats Student's Point:* She is likely correct *if* the competence gap is small. If the "informed" voters are only slightly better than random, the loss of independent data points (by weighting them heavily) lowers the group's accuracy compared to a simple majority of a larger pool. Also, if the "quiz" introduces bias (systematic error), weighting amplifies that error.
      *   *Memo phrasing:* Acknowledge her instinct is theoretically sound under specific conditions (small competence gap + reduced independence).

  5.  **Refining the Equity Argument:**
      *   This is the strongest ethical objection. In a public high school, equal protection is paramount. Even if "nobody loses a vote," creating classes of citizenship (first-class vs. second-class voters) violates the spirit of the SGA charter which likely mirrors democratic equality.
      *   Must engage this seriously, not wave it away. Acknowledge that the *intent* is good (reward engagement), but the *mechanism* creates structural barriers.

  6.  **Timeline:**
      *   Week 1: Vote & Drafting.
      *   Week 2-3: Quiz creation & Validation (Hard!).
      *   Week 3-5: Forums (Need 3).
      *   Week 6: Election.
      *   *Problem:* Students need to know *before* they register or campaign if the rules change. Changing rules 6 weeks out is generally bad practice in parliamentary procedure (stability of rules).

  7.  **Final Polish:**
      *   Tone check: Respectful to the outgoing President. Formal but student-appropriate.
      *   Formatting: Clear headings, bullet points for readability.
      *   Check constraints: Did I answer the Condorcet question? Yes. Did I pick a side? Yes (Reject/Postpone). Did I address the timeline? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe suggest a pilot?
      *   *Correction:* A pilot during a real election is risky. If the pilot fails, the election legitimacy is questioned. Better to recommend rejection for *this* election but mandate a study for *future* implementation. This respects the timeline constraint most.
      *   *Condorcet Nuance:* Make sure not to say Condorcet *definitely* disproves it, but that the classmate's skepticism is valid based on the "effective sample size" argument.

  9.  **Final Review against Prompt:**
      *   Clear recommendation? Yes (Reject for this cycle).
      *   Realistic timeline? Yes (Explains why 6 weeks fails).
      *   Engage strongest counter-argument? Yes (Equity/Access).
      *   Address Condorcet? Yes.
      *   Tone? Formal Memo.

  (Proceed to draft based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Bylaws and Elections Committee, Student Government Association
  **FROM:** [Your Name], Committee Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding the "Informed Voter Initiative" Amendment

  **I. PURPOSE**

  The purpose of this memo is to provide the Bylaws and Elections Committee with an analysis of the proposed "Informed Voter Initiative" (IVI) and a formal recommendation for our vote this Thursday. The IVI proposes awarding a second vote to students who attend three candidate forums and pass a platform-based quiz. Given that spring elections are six weeks away, this memo also outlines the logistical feasibility of implementation.

  **II. BACKGROUND**

  The outgoing SGA President has proposed the IVI to address concerns that recent referenda (specifically the vending machine contract) were decided by marketing appeal rather than substantive policy understanding. The proposal draws on John Stuart Mill's concept of "plural voting," aiming to weight the electorate toward those demonstrably informed on the issues. While all students retain their baseline single vote, the initiative creates a class of voters with increased voting power based on specific criteria.

  **III. ANALYSIS OF ARGUMENTS**

  The Committee is currently divided. To reach a decision, we must weigh the theoretical benefits against the ethical and practical drawbacks.

  **A. The Argument for Competence (Pro-IVI)**
  Proponents argue that SGA decisions impact the entire student body, and therefore the quality of those decisions matters more than strict procedural equality. If the goal of the SGA is to maximize student welfare, an electorate that understands the candidates' actual platforms is more likely to select representatives who can deliver that welfare. In this view, the second vote is not a penalty for the uninformed, but a merit-based reward for civic engagement, similar to how we weight GPAs for honor roll.

  **B. The Argument for Equity (Con-IVI)**
  Opponents argue that the IVI violates the democratic principle of "one person, one vote" by creating a tiered citizenship within the student body. This is the strongest argument against the amendment. While the proposal claims no one loses rights, it effectively devalues the vote of students unable to meet the criteria.
  *   **Structural Barriers:** Attending three after-school forums assumes a level of schedule flexibility that many students do not have. Student-athletes, students with part-time jobs, those with family care responsibilities, or those reliant on specific bus routes are systematically disadvantaged.
  *   **Message:** Even if unintentional, the policy signals that the political judgment of working students or athletes is worth less than that of students with free afternoons. In a public high school setting, where the SGA is meant to represent *all* students, this stratification risks undermining the legitimacy of the Senate.

  **C. The Condorcet Jury Theorem Consideration**
  A committee member raised a concern regarding Condorcet's Jury Theorem, suggesting it might argue against the IVI even if we ignore fairness and focus solely on decision accuracy. Her instinct is theoretically sound, though conditional.

  Condorcet's theorem states that if the average voter has a better-than-random chance ($p > 0.5$) of choosing the "correct" option, increasing the number of independent voters increases the probability of a correct majority outcome.
  *   **The Risk of Weighting:** Weighted voting effectively reduces the *number* of independent data points. If we give two votes to a small group of "informed" voters, we are reducing the sample size ($n$) of the election.
  *   **Competence Gap:** The math only favors the weighted elite if their competence is *significantly* higher than the average voter. If the "informed" group is only marginally better at identifying the best candidate than the general population, the loss of independent voices (by diluting the weight of the majority) actually lowers the probability of the group reaching the correct outcome.
  *   **Systematic Error:** Furthermore, Condorcet assumes voters are independent. If the "informed" voters all derive their knowledge from the same three forums and the same quiz, we risk introducing systematic bias (groupthink) rather than independent judgment. If the quiz or forums contain a bias, weighted voting amplifies that error.

  Therefore, the classmate's concern holds up: unless we can guarantee the "informed" group is vastly more competent and the quiz is perfectly neutral, a simple majority of the whole student body is statistically more likely to produce a stable, accurate result.

  **IV. LOGISTICAL FEASIBILITY AND TIMELINE**

  Even if the Committee resolves the philosophical debates, the timeline for the spring election (six weeks out) presents a critical barrier.

  *   **Weeks 1-2:** Finalize amendment language and pass Senate vote.
  *   **Weeks 2-4:** Draft, validate, and administer the platform quiz. (Creating a non-partisan, fact-based quiz that withstands scrutiny requires significant time).
  *   **Weeks 3-5:** Schedule and host three separate candidate forums. (This requires coordination with candidates, administration, and facilities).
  *   **Week 6:** Election Day.

  **Critical Failure Point:** For an election to be legitimate, the rules must be known and stable before candidates begin campaigning and before voters register. Implementing a complex new voting system six weeks prior to the election does not allow sufficient time for student education. If students arrive at the polls unaware of the weighting system, or if the quiz logistics fail, the election results will be challenged.

  **V. RECOMMENDATION**

  **I recommend that the Committee vote to REJECT the Informed Voter Initiative for the upcoming spring election cycle.**

  However, recognizing the validity of the President's concern regarding voter engagement, I further recommend we **propose the formation of a Task Force** to study the feasibility of epistocratic elements for the *next* academic year.

  **Rationale:**
  1.  **Preserving Legitimacy:** We cannot risk the validity of the spring election on a complex, untested system implemented on a rushed timeline.
  2.  **Addressing Equity:** Rejecting the amendment now allows time to design a program that mitigates access barriers (e.g., holding forums during lunch periods, offering digital make-up sessions) before it is ever enacted.
  3.  **Validating the Math:** The Task Force can work with the Math Department to model whether the "competence gap" in our specific student body is large enough to satisfy Condorcet's conditions for weighted voting.

  **VI. PROPOSED TIMELINE FOR TASK FORCE**

  If the Committee agrees to this recommendation, I propose the following timeline:

  *   **Thursday (Committee Meeting):** Vote to recommend rejection of IVI for spring; vote to establish "Voter Engagement Task Force."
  *   **Two Weeks from Now:** Present Task Force charter to full Senate for approval.
  *   **End of Semester:** Task Force submits preliminary report on barrier analysis and quiz validity.
  *   **Fall Semester:** If approved, pilot program implemented for Fall By-Elections.

  **VII. CONCLUSION**

  The Informed Voter Initiative comes from a place of genuine civic concern, and the frustration with slogan-based campaigning is shared by many. However, high school democracy relies on the perception of fairness as much as the quality of outcomes. By rejecting the amendment for this cycle due to logistical and equity constraints, but committing to study it for the future, we respect the outgoing President's legacy while protecting the integrity of the immediate election.

  I look forward to discussing this analysis with the Committee on Thursday.
