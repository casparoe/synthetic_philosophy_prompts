  8.  *(Self-Correction on Bird's Antidote)*: Bird classifies antidotes as masks. Warren uses this to say "Antidotes change chemistry, so if changing chemistry = fink, Bird is wrong." Warren is using Bird to defend the Mask classification. This is a solid move. Diane tries to distinguish the *timing* of the chemistry change. I need to make sure I represent this accurately.

  9.  *(Refining the Fink definition)*: Martin's Fink is specific: The stimulus *causes* the loss of the disposition. In the nail, does the water *cause* the Zn to protect? Yes, the electrolyte enables the cell. But the Zn was *already* there ready to do it. A Fink usually involves a mechanism that *detects* the stimulus and *removes* the property. The Zn doesn't remove the Fe's reactivity; it outcompetes it. That's masking (pre-emption), not finkishness (removal).

