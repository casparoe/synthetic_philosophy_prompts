      *   *SIA (Self-Indication Assumption):* "Reason as if you are more likely to exist in a world with more observers."
      *   *Problem:* Does SIA have a reference class problem? Technically, yes (what counts as an "observer"?), but it's less critical because SIA weights by *number*. If you expand the class, you expand it for *all* hypotheses roughly equally, so the ratios often stay stable. SSA is sensitive to the *proportion* within the class, so defining the class boundaries changes the proportion drastically.
      *   *Key Insight:* SSA is about *location* within a set (sensitive to set definition). SIA is about *existence* within a world (sensitive to total count, less sensitive to boundaries).

  3.  **Deconstruct Task (b): Doomsday vs. Presumptuous Philosopher:**
      *   *Underlying Commitment:* How do we treat indexical information ("I exist")?
