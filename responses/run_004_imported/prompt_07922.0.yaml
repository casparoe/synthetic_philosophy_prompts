      *   Make sure to clarify *why* it's less of a problem for SIA. If I define "observer" as "human" vs "conscious being," SSA changes the probability of Doom because the *fraction* of humans who are early changes. SIA changes the *weight* of the world, but if both hypotheses scale up the number of observers by the same factor (e.g. adding aliens to both Doom Soon and Doom Late), the ratio remains the same. Wait, that's not quite right.
      *   Correction: SIA is sensitive to the *total number* of observers. If I change the reference class from "humans" to "all sentient beings," the absolute numbers change. But usually, the *ratio* between Hypothesis A and Hypothesis B remains constant if the extra observers exist in both hypotheses. SSA is sensitive because it asks "What fraction of the reference class is early?" If I add aliens who are all "late," it changes the fraction of humans who are "early." SIA asks "How many observers are there?" Adding aliens adds to both, preserving the ratio of totals better than SSA preserves the ratio of fractions.
      *   Actually, the standard view is SIA *dissolves* the reference class problem because it treats all observer-moments equally regardless of category, whereas SSA requires you to specify *which* category you are sampling from. I need to be precise here. SIA says "All observer-moments are in the reference class." SSA says "Pick a class." So SIA effectively fixes the class as "everything," removing the choice, whereas SSA leaves the choice open. That's the key.

