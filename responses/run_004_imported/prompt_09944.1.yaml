answer: |-
  This is a deeply uncomfortable position to be in, and your intuition is picking up on a critical tension in engineering management: the difference between **individual accountability** and **systemic safety**.

  To answer your question directly: **There is a principle leadership is likely invoking, but they are applying it in a way that contradicts modern reliability engineering best practices.** Whether this counts as scapegoating depends on whether this accountability leads to system changes or just personal consequences.

  Here is a breakdown of the principles at play, why leadership is focusing on the reviewer, and why your feeling of arbitrariness is justified.

  ### 1. The Principle Leadership Is Using: "The Gatekeeper Theory"
  Leadership is operating under a traditional quality assurance model where the code review is treated as a **quality gate**.
  *   **The Logic:** The author (you) is expected to make mistakes; that is human nature. The reviewer is specifically tasked with being the safety net. Therefore, if the bug escapes, the safety net failed.
  *   **The Distinction:** They view your bug as the *hazard*, but the reviewer's skip as the *failure of control*. In risk management, the failure of a control is often treated more severely than the existence of a hazard, because controls are supposed to be reliable.
  *   **Why it feels arbitrary:** It relies on the assumption that a code review is a deterministic filter (i.e., "If you look, you will find"). In reality, code reviews are heuristic and prone to the same human error as coding.

  ### 2. Why This Is Likely Scapegoating (The "Just Culture" Test)
  In high-reliability organizations (like Google SRE, NASA, aviation), this situation would be analyzed using a **Just Culture** framework. This framework distinguishes between three types of behavior:
  1.  **Human Error:** Inadvertent slips (e.g., you writing the bug). *Response: Console and design better safeguards.*
  2.  **At-Risk Behavior:** Cutting corners due to system pressure (e.g., reviewer skipping tests because of pressure to merge, or on-call silencing alerts due to alert fatigue). *Response: Remove the pressure/coaching.*
  3.  **Reckless Behavior:** Conscious disregard for safety (e.g., malicious code). *Response: Punitive.*

  **The Red Flags in Your Postmortem:**
  *   **Ignoring the Tech Lead:** The Tech Lead postponing input validation for months is a **systemic risk decision**. If the system had proper validation, the bug wouldn't have caused an outage. Ignoring this suggests leadership is unwilling to hold management accountable for technical debt, which is a hallmark of scapegoating.
  *   **The On-Call Engineer:** Silencing an alert before investigating is a process violation, but *why*? Is there alert fatigue? Are the runbooks unclear? Blaming the person without fixing the alerting strategy guarantees it will happen again.
  *   **The Reviewer:** If the reviewer skipped tests because the process is too burdensome, punishing them doesn't fix the process. It just makes them (and others) hide their shortcuts next time.

  If the outcome of this postmortem is that the reviewer gets a write-up while the Tech Lead's roadmap remains unchanged, **yes, you are choosing a scapegoat.** You are sacrificing a peer to restore the illusion of control without doing the hard work of fixing the system.

  ### 3. The "Swiss Cheese" Reality
  Your intuition about "everyone could have caught it" aligns with the **Swiss Cheese Model of Accident Causation**.
  *   **Slice 1 (You):** A hole appeared (the bug).
  *   **Slice 2 (Review):** A hole aligned (skipped tests).
  *   **Slice 3 (System):** A hole aligned (lack of input validation).
  *   **Slice 4 (Response):** A hole aligned (alert silenced).

  For the outage to happen, *all* holes had to align. Focusing on Slice 2 ignores the fact that if Slice 3 (Tech Lead's validation) had been solid, Slice 2 wouldn't have mattered. By singling out the reviewer, leadership is pretending the other slices of cheese don't exist.

  ### 4. How to Navigate This
  You are in a delicate spot. You introduced the bug, so you lack some moral high ground, but you also care about the team's health. Here is how to handle the conversation without sounding defensive:

  **Shift from "Who" to "Why"**
  In the postmortem, gently steer the conversation toward the conditions that allowed the actions, not the actions themselves.
  *   *Instead of:* "The reviewer shouldn't be blamed."
  *   *Try:* "If the reviewer is the primary control for catching this, our process is too reliant on human vigilance. How do we automate this check so skipping tests becomes impossible?"

  **Address the Tech Lead's Debt Tactfully**
  *   *Try:* "We identified that input validation was a known gap. To prevent this class of outage, can we prioritize that work item now? Relying on reviews to catch validation errors has proven fragile."

  **Reframe Accountability**
  True accountability isn't about punishment; it's about ownership of the fix.
  *   *Proposal:* "Instead of assigning blame for the failure, can we assign ownership for the prevention? The reviewer can own updating the PR checklist, the On-Call can own tuning the alert thresholds, and the Lead can own the validation roadmap. That way we all share accountability for the solution."

  ### Summary
  There is a logic to leadership's stance (the reviewer is the designated control), but it is an **outdated logic** that fails in complex software systems. Humans are not compilers.

  If they punish the reviewer without fixing the validation debt or the alerting culture, they are prioritizing **political safety** (looking like they took action) over **system safety** (ensuring it doesn't happen again). That is the definition of scapegoating.

  Your goal now is to help them see that making the reviewer the "villain" actually makes the system *less* safe, because it encourages people to hide mistakes rather than build systems that tolerate them.
