      *   **The Core Distinction:** Consistency vs. Soundness. Gödel-2 blocks proving "I don't contradict myself." Löb blocks proving "Everything I prove is true." Agents need the latter to delegate.
      *   **The Tiling Scenario (Concrete Setup):** Walk through $A_1$ creating $A_2$.
      *   **The "Gut" Mechanism:** The "Meta-System Gap." You can't be your own meta-system.
      *   **Why the Solutions Look Like They Do:**
