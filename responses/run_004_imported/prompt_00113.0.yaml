answer: |-
  This is an exceptionally sharp question. You have put your finger on exactly the tension that keeps decision theorists awake at night. Most introductory blog posts gloss over this because resolving it requires diving into the difference between *indexical uncertainty* and *logical uncertainty*, and eventually into the open research problem of "Logical Induction."

  As a chemist, you're used to a clean separation between the *laws* of thermodynamics (which don't change) and the *state* of a specific system (which you measure). Your intuition is telling you that "figuring out what follows from the setup" looks a lot like "measuring the state of the system," and you're right to be suspicious.

  Here is the breakdown of the principled distinction, where it holds, and where the theory currently bleeds.

  ### 1. The Two Types of Uncertainty

  To understand UDT's "no updating" rule, we have to distinguish two kinds of ignorance an agent might have:

  **A. Indexical/Empirical Uncertainty (The "Where/When" Question)**
  *   *Example:* "Did the coin land heads or tails?" "Am I the original agent or the simulation?" "Is it Monday or Tuesday?"
  *   *Standard Bayesian Update:* I observe "Heads," so I condition my probability distribution on $Observation = Heads$. I discard all branches where $Tails$ occurred.
  *   *UDT's Stance:* **Do not do this.** If you discard the "Tails" branch, you lose the ability to make a policy that optimizes across both branches. In Counterfactual Mugging, if you update on "The coin is Heads," you won't pay, and you lose the potential reward from the "Tails" world where Omega predicted you would pay. UDT says you must act as if you are still behind the veil, maximizing expected utility over the *prior* distribution of all possible worlds.

  **B. Logical/Mathematical Uncertainty (The "What Follows" Question)**
  *   *Example:* "What is the 10,000th digit of $\pi$?" "Does this specific Python script halt?" "If I commit to policy $P$, does Omega's predictor output 'Yes'?"
  *   *Standard Bayesian Update:* In idealized Bayesianism, logical facts are either probability 0 or 1. You don't "update" on them; you just know them.
  *   *UDT's Stance:* **You must resolve this.** To calculate the expected utility of a policy, you *must* deduce the logical consequences of that policy. You need to know that $Policy = Pay \implies Omega\_Predicts = Pay$.

  **The Principled Line:**
  The distinction is between **conditioning on evidence** (which selects a subset of possible worlds) versus **deducing consequences** (which clarifies the structure within those worlds).

  UDT forbids the former because it severs the counterfactual link between your decision algorithm and the predictor's simulation. UDT *requires* the latter because without it, you cannot compute the expected utility function.

  ### 2. The "Logical Omniscience" Assumption (The Idealized View)

  In the original formulations of UDT (by Wei Dai circa 2009) and Functional Decision Theory (FDT), there is a massive, often implicit assumption: **Logical Omniscience.**

  The theory assumes the agent already knows all logical truths. In this idealized model, the agent doesn't "update" on logical facts during the decision process because it *already knows them* timelessly.
  *   It knows the source code of the predictor.
  *   It knows the source code of itself.
  *   It knows the mathematical truth of what happens when those two codes interact.

  Under this assumption, there is no contradiction. The agent selects a policy $\pi$ that maximizes $E[U(\pi)]$ relative to its prior. It doesn't update on indexicals (it considers all worlds in the prior), and it doesn't update on logic (it already knows all logic).

  ### 3. The "Soft Spot" (The Real-World View)

  You asked if this is a known soft spot. **Yes, absolutely.**

  Real agents (humans, computers) are not logically omniscient. We have to *compute* the consequences. We have uncertain beliefs about logical facts (e.g., "I'm 90% sure this proof is correct").

  If I have to *compute* whether Omega predicts me, I am effectively updating my belief from "I don't know what Omega does" to "I now know Omega predicts X." This looks like updating.

  This is where the theory gets messy. If you allow logical updating, you risk "spoiling" the updatelessness.
  *   *Scenario:* I start computing the predictor's output. I realize, "Oh, if I choose to Pay, Omega predicts Pay."
  *   *Risk:* If I treat that realization as "evidence" that I am in a world where I Pay, I might slip back into Causal Decision Theory (CDT) reasoning.

  **The Current Frontier: Logical Induction**
  Researchers at MIRI (Machine Intelligence Research Institute), particularly Scott Garrabrant and colleagues, have been working on **Logical Induction** to plug this hole.
  *   A Logical Inductor is a market-based algorithm that assigns probabilities to logical statements over time, converging to truth in the limit.
  *   The goal is to create a **Updateless Decision Theory with Logical Uncertainty**.
  *   The proposed solution is that you should update your beliefs about logical facts *as you compute them*, but you must select your **policy** based on the expectations held *before* you computed the specific outcome of your own decision algorithm.

  In other words: You can update on "What does the predictor's code do?" but you cannot update on "What does *my* decision algorithm output?" in a way that treats the output as fixed evidence rather than a variable to be optimized.

  ### 4. A Chemist's Analogy

  Since you mentioned titration curves, let's try an analogy.

  Imagine you are designing an automated titration protocol for a factory.
  *   **The Prior:** You know the distribution of acid concentrations coming down the pipe (1M, 2M, or 3M with equal probability).
  *   **The Predictor:** There is a sensor upstream that predicts what your protocol will do and adjusts the flow rate accordingly.
  *   **The Decision:** You are writing the code (policy) for the titrator.

  **Indexical Updating (What UDT forbids):**
  The titrator measures the acid concentration *first*, sees it is 1M, and then decides, "Well, given that it's 1M, the optimal amount of base is X."
  *   *Problem:* The upstream sensor predicted what you would do *before* you measured. If your code says "If 1M then X, If 2M then Y," the sensor sees that whole code. If you write the code to optimize only for the specific measurement you find yourself with, you might miss a global optimization where the sensor rewards you for a policy that works well across *all* concentrations.

  **Logical Updating (What UDT requires):**
  To write the code, you must calculate the stoichiometry. You have to derive the reaction equations.
  *   *Process:* You might not know the exact reaction rate constant initially. You run simulations (computation) to figure it out. As you run simulations, you update your belief about the rate constant.
  *   *Compatibility:* This is fine. You are clarifying the *laws* of the system. UDT doesn't say "ignore the stoichiometry." It says "Don't let the specific measurement of *this* batch dictate the policy design if the policy design itself influences the batch distribution via the sensor."

  **The Soft Spot:**
  The hard part is when the "stoichiometry" includes *your own code*.
  If you are trying to calculate what your own code will output, you are simulating yourself. This leads to infinite regress (Gödelian loops). Standard logic breaks down here. You can't fully "know" your own output before you output it.
  Handling this self-referential logical uncertainty without collapsing into "I'll just update on whatever I decide to do" is the unsolved problem.

  ### 5. Summary: Is it a Contradiction?

  It is not a logical contradiction, but it is a **implementation hazard**.

  1.  **Principled Distinction:** There is a valid distinction between *self-locating evidence* (which UDT says to ignore for policy selection) and *logical deduction* (which UDT says is necessary to evaluate policies).
  2.  **The Idealization:** In the mathematically pure version of UDT, logical updating doesn't exist because the agent is logically omniscient. The tension disappears because all logical facts are already known.
  3.  **The Reality:** For bounded agents, the line is fuzzy. You have to update on logical facts to function, but you must ensure those updates don't functionally act like indexical updates that sever counterfactuals.
  4.  **The Status:** This is not a settled issue. It is the primary reason why UDT has not yet been fully formalized for bounded agents. The field is currently moving toward **Functional Decision Theory (FDT)** combined with **Logical Induction**, which attempts to formalize how to reason about logical correlations without "updating away" the counterfactuals.

  So, your instinct is correct: the blog posts wave their hands because the rigorous mathematical machinery for "logical updating without indexical collapse" is still being built. You haven't missed a chapter; you've found the research frontier.

  If you want to dive into the "guts" of this specific problem, I recommend looking up the **"Logical Induction" paper (Garrabrant et al., 2016)** and the **"Functional Decision Theory" paper (Yudkowsky & Soares, 2017)**. They tackle exactly the mechanism of how an agent reasons about its own source code without falling into the trap of treating its decision as fixed evidence.

  Welcome to the rabbit hole. It's deeper than the periodic table, but the view from the bottom is worth it.
