      *   **The Tension:** To calculate expected utility, you need to know the logical consequences of your actions. If I choose $A$, does the predictor predict $A$? This looks like logical inference. Inference looks like updating (going from uncertainty to certainty about a logical fact).
      *   **The Distinction:** Empirical/Indexical uncertainty vs. Logical/Mathematical uncertainty.
      *   **The "Veil":** The veil isn't about ignorance of logic; it's about ignorance of *which* instantiation of the logic you are (indexical) or *what* the random outcome was (empirical), *relative to the decision policy*.
      *   **Logical Omniscience Assumption:** Standard UDT often assumes logical omniscience to sidestep this. But the user is asking about the *process* of figuring it out, which implies non-omniscience.
