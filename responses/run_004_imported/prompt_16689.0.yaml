answer: |-
  The vault of Archon Vex smelled of ozone and old dust. Kael adjusted his gloves, eyeing the two pedestals in the center of the room.

  "Left one first," Ren whispered, her mag-lamp casting long shadows. "The Plague Lantern."

  The lantern was brass, intricate, and sealed inside a thick cylinder of transparent glass. Inside, a green fog swirled violently, pressing against the walls.

  "It's disposed to rot anything organic," Ren said, tapping the glass. "See how the fog pushes? The disposition is intact. It wants to kill us. The glass is just a mask. It interrupts the causal chain. The rot is there, but it can't get out."

  Kael nodded. He understood masks. A gun wrapped in foam is still disposed to fire; the foam just stops the bullet. He pulled a suction tool from his belt, clamped it onto the glass, and lifted the cylinder away. The green fog hit the air and instantly withered the moss on the stone floor. The disposition hadn't changed; the block was just gone.

  "Clean," Kael said. "Now the Memory Stone."

  The second pedestal held a smooth, black obelisk. It was surrounded by a shimmering blue ward.

  "Same deal?" Kael asked. "The ward is masking my access?"

  "No," Ren hesitated. "Be careful. The Stone is disposed to record the touch of its master. But the ward isn't blocking the touch. It's suppressing the trigger."

  Kael frowned. He looked at the Stone. He needed the data inside. "If I take the ward down, the Stone records me. Like the lantern rotting the moss."

  "If you were the master, yes. But you're not." Ren grabbed his arm. "The Stone is... sensitive. If it detects a non-master touch, it doesn't just reject you. It changes. It loses the disposition to record entirely. It becomes inert rock the moment your skin makes contact."

  Kael pulled away, impatient. He'd seen this before. Security systems were just masks waiting to be stripped. The Lantern proved it. Remove the barrier, get the goods. "It's the same metaphysics, Ren. Barrier goes off, property manifests."

  "That's the Lantern! This is different!"

  Kael didn't listen. He deactivated the blue ward with a pulse from his gauntlet. The shimmer vanished. He reached out, bare skin brushing the black surface.

  He expected the rush of data download. Instead, the Stone turned gray. The smooth surface roughened into granite. The hum died instantly.

  "It didn't record," Kael said, voice tight.

  "It couldn't," Ren said, pocketing her lamp. "The disposition vanished the moment you touched it. The stimulus killed the property. The Lantern still wanted to rot us even inside the glass. This thing? It stopped being a recorder the second you tried to use it."

  Kael stared at the now-useless rock. He had treated a finkish nature like a masked one. He assumed the ward was stopping the effect, when the ward was actually keeping the disposition stable long enough to be used. By removing it, he hadn't uncovered the power; he'd allowed the trigger that destroyed it.

  "Can you fix it?" he asked.

  Ren shook her head, stepping over the withered moss. "You can't restore a disposition that deleted itself. Come on. The real loot is in the back. And don't touch anything."

  Kael followed, hands deep in his pockets. He looked at the gray stone one last time. It wasn't that the effect was blocked; it was that the potential itself had fled at the moment of contact. He made a mental note: next time, check if the property survives the stimulus, or if the stimulus is the funeral.
