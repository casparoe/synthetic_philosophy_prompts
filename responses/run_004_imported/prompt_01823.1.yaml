      *   Avoid overly dense jargon where possible, but use the correct terms (BPP, BQP, Polynomial, Exponential) since they are in a Theory of Computation class.
      *   Make sure to explicitly address the "gimmick" comment. It's not a gimmick because "impossible in practice" is effectively "impossible" for many applications.

  5.  **Self-Correction/Review during drafting:**
