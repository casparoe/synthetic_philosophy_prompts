answer: |-
  Good morning. For those who don't know me, I'm [Your Name], Marion's nephew.

  Looking out at this room, I see the two worlds my aunt lived in, sitting side by side. On one side, the choir robes and the vestry members who sang with her and prayed with her for decades. On the other, the graduate students, the colleagues, and the skeptics who debated with her and learned from her. And then, of course, the family who just loved her.

  Marion would have loved this mix. In fact, she would have insisted on it.

  To know Marion was to know that she held two commitments with equal intensity. She was a genuinely devout Episcopalian. She wasn't a cultural Christian; she was in the choir, she served on the vestry, and her faith was the anchor of her adult life. But she was also a rigorous political philosopher. She spent thirty years thinking about how people with deeply different worldviews can live together without forcing everyone to agree on the ultimate truth.

  She is best known for her work on John Rawls and religion. There's a story she loved to tell, half as a party trick, half as a key to her soul: Rawls himself, the great theorist of secular liberalism, had planned to become an Episcopal priest before the war changed his path. Marion saw that not as a contradiction, but as a clue.

  Her most cited paper argued that Rawls's "proviso"—the rule about religion in public debate—isn't about silencing believers. It's about invitation. It asks us to translate our deepest convictions into reasons our neighbors can understand, not because our faith is private, but because our neighbors matter. She believed that faith and reason weren't enemies fighting for territory; they were partners in the work of building a just society.

  But theory is one thing. Living it is another. And Marion lived it with a rare generosity.

  Before she died, she gave my mother a specific instruction about this service. She said she didn't want this eulogy to do the thing she watched politicians and priests do too often: stand up and assert, as if it settled the matter for everyone in the room, that she is "with God now" or "watching over us."

  She knew that a good third of you—her atheist colleagues, her skeptical students, my own father—couldn't be expected to accept that as a shared premise. She spent her career arguing that we shouldn't ground our public life on premises that exclude our neighbors. She wasn't going to let her own funeral do what she argued against in her books.

  Now, Marion knew better than anyone that a funeral isn't a political forum. She knew that technically, by her own definitions, this is "background culture." She could have let me preach her straight into heaven without violating a single principle of political liberalism. But she left that door open. She never said whether she wanted me to walk through it.

  So, I am going to honor the spirit of that silence.

  I can tell you this: Marion believed, with every fiber of her being, in the promise of resurrection. She found comfort in the liturgy, in the Eucharist, and in the hope of eternal life. That faith was real, it was sturdy, and it was hers. I will not edit that out to make it more palatable.

  But I also know that for many of you, the comfort today comes not from theology, but from memory. From the recollection of her sharp wit, her fierce loyalty, and the way she made you feel that your mind was safe in her hands.

  And perhaps that is the final lesson she leaves us. She understood that we do not need to agree on what comes after death to agree on how to treat each other before it. We don't need a uniform metaphysics to share a uniform grief.

  For those of you who pray, I know you are praying for her soul, and that is a beautiful thing. For those of you who do not, I know you are holding her in your memory, and that is also a beautiful thing. Marion made room for both of those responses. She built a table large enough for the believer and the skeptic to sit at the same time, not by watering down the wine, but by expanding the circle.

  So, we are not here to settle the question of where Marion is. We are here to acknowledge where she was. She was here. She was in this room, in this city, in this life. She was a woman who loved God, who loved justice, and who loved us enough to let us meet her where we were.

  The consensus she leaves behind isn't a written agreement. It's us. It's this room. It's the fact that we are all here, grieving the same woman, in our own languages, together.

  Thank you.
