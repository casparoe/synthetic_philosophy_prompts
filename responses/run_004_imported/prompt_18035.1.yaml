      *   **Key Personal Instruction:** She *didn't* want the funeral to assert theological claims ("she is with God now") as settled facts for everyone, knowing many attendees (atheist father, grad students, collaborators) wouldn't share that premise.
      *   **The Twist/Nuance:** She knew technically Rawls's constraints apply to the *public political forum*, not the *background culture* (like a funeral). So, preaching her into heaven is theoretically allowed by her own framework, but she left it ambiguous whether she wanted that standard applied anyway.
