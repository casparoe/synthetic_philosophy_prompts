answer: |-
  This is a classic friction point in the ethics of digital labor, and the "supererogation" label is actually quite precise. In moral philosophy, supererogatory acts are those that are "good to do, but not wrong not to do."

  The tension you are feeling comes from the collision between **moral logic** (your framework) and **market logic** (the users' framework). Here is how the literature on supererogation breaks down the three specific dynamics you asked about.

  ### 1. The Precedent Trap: Does repetition make it obligatory?

  **The Philosophical Debate:**
  Strictly speaking, moral philosophers (like David Heyd or J.O. Urmson) argue that supererogation is non-iterative. Just because you saved a drowning child yesterday (a supererogatory act, assuming you weren't a lifeguard), you are not morally obligated to save a drowning child today. The optionality resets with every instance.

  **The "Teeth" for OSS:**
  However, social ethicists point out a loophole called **"Legitimate Expectation."** While *moral* obligation doesn't accumulate, *social* norms do. If you establish a pattern of behavior, you create a predictive model for others. When users see a pattern of "heroic" fixes, they stop viewing the acts as gifts and start viewing them as **service level agreements (SLAs).**

  This is where the "supererogation" status is at risk of collapsing. It's not that the act *becomes* morally obligatory, but that the **community contract shifts.**
  *   **Initial State:** The library is a gift. Any work is supererogatory.
  *   **Shifted State:** The library is a public utility. Work is expected.

  **Implication:** If you do not explicitly frame your extra work as *exceptional*, the community will implicitly frame it as *standard*. Repetition without qualification erodes the "optional" nature of the act in the eyes of the receiver, even if it remains optional in the eyes of the doer.

  ### 2. The Entitled User: Coherent complaint or Category Error?

  **The Philosophical Debate:**
  From a strict deontological (duty-based) perspective, the entitled users are committing a **category error**. They are applying market norms (I consume, therefore you produce) to a gift economy (I share, therefore you benefit). A complaint about the *omission* of a supererogatory act is logically incoherent. You cannot be "wronged" by someone failing to be a saint.

  **The "Teeth" for OSS:**
  However, modern ethics of technology introduces the concept of **Reliance.** When users build their infrastructure on your free library, they are relying on your *past* supererogation to secure their *future* stability.
  *   **The User's View:** They aren't arguing from morality; they are arguing from **consequentialism.** "Your past heroism saved us; your current inaction hurts us." To them, the *outcome* matters more than your *intent*.
  *   **The Maintainer's View:** You are arguing from **agent-centered prerogatives.** You have the right to prioritize your own well-being over the aggregate good of the user base.

  **Implication:** The users' complaint is morally incoherent (you owe them nothing) but pragmatically coherent (they are dependent on you). Recognizing this distinction is vital. They are not accusing you of being *unethical*; they are accusing you of being *unreliable*. These are different charges. The first attacks your character; the second attacks your utility. Understanding that they are complaining about utility, not morality, can help you detach emotionally. They feel betrayed not because you violated a duty, but because a resource they treated as infinite turned out to be finite.

  ### 3. Preserving Generosity: How to keep it optional

  **The Philosophical Debate:**
  A key condition of supererogation is **freedom.** If you feel coerced (by guilt, expectation, or threat) into doing the "good" act, it ceases to be supererogatory and becomes **unpaid labor.** Once it becomes unpaid labor, resentment is the natural psychological outcome.

  To keep an act supererogatory, you must maintain the **visibility of the alternative.** The "no" must be a live option.

  **The "Teeth" for OSS:**
  You need to engage in **Signaling.** In the literature, this is sometimes discussed as "marking the boundary of duty." If you fix a security bug at 2 AM without comment, you signal that this is normal behavior. If you fix it and say, *"I am clearing this critical issue tonight, but I cannot guarantee this response time in the future,"* you are philosophically marking the act as supererogatory.

  **Principled Strategies:**
  1.  **Explicit Optionality:** When you do the "heroic" thing, explicitly state the cost. "I'm taking time from my family weekend to patch this." This reminds users that you are spending a finite resource they do not own.
  2.  **Institutionalize the "No":** Supererogation requires the ability to refrain. If you never say no, your "yes" loses its value as a gift and becomes a tax. You must occasionally let a feature request rot to preserve the optional nature of the ones you do pick up.
  3.  **Reframe the Relationship:** Move the community from a "Service Provider" model to a "Stewardship" model. A service provider owes uptime; a steward owes care *within their capacity*. Documenting your capacity (e.g., "I maintain this on 5 hours a week") sets the baseline duty. Anything above that line remains supererogatory.

  ### Summary of Implications

  1.  **Repetition creates norms, not duties.** Users will treat repeated supererogation as standard operating procedure unless you actively disrupt that pattern.
  2.  **The complaint is a category error.** Users are applying market logic to a gift. They are complaining about reliability, not morality. You are not violating a duty; you are withdrawing a benefit.
  3.  **Visibility preserves optionality.** To prevent generosity from calcifying into duty, you must make the cost of your generosity visible and occasionally exercise your right to *not* be generous.

  The most dangerous thing for a maintainer is **invisible heroism.** When you suffer in silence to deliver a fix, you teach users that your silence is compatible with high output. By making the effort visible, you protect the supererogatory status of your work. You remind them that the code is a gift, not a wage.
