prompt: |-
  I maintain a smallish open-source library for free on nights and weekends, and I've noticed a pattern: the more heroic unpaid stuff I do (late-night hotfix for a security bug, writing actual docs, whatever), the more entitled some users get when I'm slow on some random feature request, like the free labor was owed to them all along. Someone in a GitHub thread called this a 'supererogation' problem -- acts that are good to do but not obligatory -- and now I can't stop thinking about it. Can you walk me through the most important implications of the supererogation literature for this exact dynamic -- whether doing the 'extra' thing repeatedly changes if its still optional, whether the entitled-user reaction is a coherent complaint or just a category error, and whether theres a principled way to keep being generous without it quietly turning into a duty? Skip the dictionary definition, I want the parts of the debate that actually have teeth here.
