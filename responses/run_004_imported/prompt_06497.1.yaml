      *   *The "Paradox of Supererogation":* If it's so good, why isn't it required? If it's not required, why do we feel pressure?
      *   *Key debates relevant to OSS:*
          *   Habituation/Precedent: Does repetition create expectation/obligation?
          *   Relational Ethics: Does a relationship form that changes the duties?
          *   The "Good Samaritan" limit: When does helping become enslavement?
          *   Community norms vs. Individual morality.

  3.  **Address Question 1: Repetition and Obligation (The "Precedent" Problem):**
      *   *Philosophical angle:* Does past supererogation create future duty?
      *   *Standard view:* No. Just because I saved you yesterday doesn't mean I must save you today.
      *   *Nuanced view (Practice/Institutional):* If I set a precedent, do I create a "legitimate expectation"?
      *   *OSS Context:* Users treat the project like a service. The maintainer treats it like a gift.
      *   *Key Insight:* The shift from *moral* obligation to *conventional* expectation. Users aren't making a moral claim (usually); they are making a consumer claim based on pattern recognition.
      *   *Takeaway:* Repetition doesn't make it morally obligatory, but it does create a *psychological contract* that needs managing.

  4.  **Address Question 2: The Entitled User (Coherent Complaint vs. Category Error):**
      *   *Philosophical angle:* Category Error. Users are treating a gift economy like a market economy.
      *   *Supererogation specific:* If an act is supererogatory, criticizing the *omission* is logically incoherent *within the moral framework*.
      *   *However:* Is there a "duty of fair play"? If users benefit, do they owe respect? Yes. Do they owe features? No.
      *   *Key Insight:* The users are committing a category error (Market vs. Gift). Their complaint is *pragmatically* understandable (they want software) but *morally* incoherent (they claim a right to free labor).
      *   *Takeaway:* Validate the maintainer's feeling that it's a category error, but explain *why* users feel it (reliance).

  5.  **Address Question 3: Principled Generosity (Avoiding the "Duty" Trap):**
      *   *Philosophical angle:* How to sustain supererogation without burnout/obligation creep.
      *   *Concept:* "Discretionary Effort."
      *   *Strategy:* Signaling. Making the supererogatory nature *visible*.
      *   *Concept:* "Moral Licensing" (reverse). Don't let the good deeds buy you into a cage.
      *   *Key Insight:* You must actively *frame* the work. If you act like an employee, they treat you like one. If you act like a benefactor, they *might* treat you like one (or might leave).
      *   *Takeaway:* Boundaries aren't mean; they are necessary to preserve the supererogatory status.

