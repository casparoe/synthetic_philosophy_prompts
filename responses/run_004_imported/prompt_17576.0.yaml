answer: |-
  This is an exceptionally sharp question that cuts to the heart of both Hume scholarship and contemporary metaphysics. You are right to identify the anachronism: Hume was not debating Lewis or Armstrong, and the term "laws of nature" in his day carried theological and Newtonian connotations quite different from the nomic necessitation of the 20th century.

  However, if we treat this as a thought experiment in philosophical alignment—asking which contemporary camp best respects Hume's *methodological constraints* and *semantic commitments*—we can construct a best-supported guess.

  The short answer is: **Hume would likely reject the metaphysical ambitions of both sides, but he would find Lewis's Humean Supervenience significantly more congenial than Armstrong's or Maudlin's Anti-Humeanism.** Even on the "New Hume" reading, Hume's skepticism about the *intelligibility* of necessity makes him a natural ally of Lewis's deflationism, rather than Armstrong's inflationism.

  Here is the detailed breakdown of why this is the most defensible position.

  ### 1. The Semantic Barrier: The Copy Principle
  The strongest argument for placing Hume in the Lewisian camp (broadly construed) is Hume's empiricist criterion of meaning. In the *Treatise* and *Enquiry*, Hume argues that for any term to be meaningful, it must be traceable to an original impression.

  *   **Against Armstrong:** Armstrong posits a relation of "necessitation" ($N$) between universals ($F$-ness and $G$-ness). He admits this is not observable. Hume would immediately challenge Armstrong to produce the *impression* from which the idea of "necessitation between universals" is copied. Since Armstrong's relation is theoretical and non-observable, Hume would likely dismiss it as meaningless jargon—precisely the kind of "abstruse reasoning" he sought to purge from philosophy.
  *   **Against Maudlin:** Maudlin argues lawhood is primitive and unanalyzable. For Hume, an unanalyzable idea that lacks an empirical impression is not a profound truth; it is a cognitive dead end. Maudlin asks us to accept a brute modal fact; Hume asks where the idea came from.
  *   **For Lewis:** Lewis's "mosaic of local matters of particular fact" is much closer to Hume's "perceptions." While Lewis's "Best System" is a global abstraction (which Hume might mistrust), the *ontology* underlying it (spatiotemporal points with local qualities) is far more compatible with Hume's empiricism than Armstrong's transcendent universals.

  ### 2. The "New Hume" Complication
  The "New Hume" reading (championed by Galen Strawson, John Wright, and others) suggests Hume believed real causal powers *exist* but are inconceivable to us. If this is true, does Hume become an Anti-Humean?

  Not necessarily. There is a crucial distinction between **ontological realism** and **semantic/intelligible realism**.
  *   **Armstrong** claims we *can* formulate a coherent theory of how necessitation works. He claims intelligibility.
  *   **The "New Hume"** claims the powers exist but are *inconceivable*.

  If you explain Armstrong's view to Hume, Hume's response (even as a "New Hume" skeptic-realist) would be: *"You claim to have analyzed the secret spring of nature. I maintain that no human analysis can reach it. Therefore, your analysis is presumptuous."*

  Hume's project was largely therapeutic: to cure philosophy of the dogmatism that claims to know the inner essences of things. Armstrong and Maudlin are engaging in the very dogmatism Hume warned against—they claim to know the metaphysical structure of lawhood. Lewis, by contrast, dissolves the problem. He says, "We don't need to posit hidden glue; the pattern is enough." This aligns with Hume's skeptical stance that we should limit our inquiries to the phenomena accessible to us.

  ### 3. Hume's Dictum and Modal Modesty
  Lewis explicitly builds his system on "Hume's Dictum": *there are no necessary connections between distinct existences.*

  *   **Lewis's Usage:** This is an ontological claim. There *are* no such connections.
  *   **Hume's Usage:** This is largely an epistemological/logical claim. We cannot *infer* a connection a priori, nor can we *observe* a necessary tie.

  However, the practical upshot is similar. Hume argues that when we look at cause $A$ and effect $B$, we never see a "tie." We only see conjunction. Lewis agrees: there is no tie in the mosaic.
  *   **Anti-Humeans** insist there *is* a tie (even if hidden or primitive).
  *   **Humeans** insist there is *no* tie (only regularity).

  Even if Hume secretly believed a tie existed (New Hume), he insisted it plays no role in human reasoning, science, or meaningful discourse. Lewis's systematization respects this by constructing a metaphysics where the "tie" does no work. Armstrong's system makes the "tie" the central explanatory engine. Hume would view Armstrong as re-introducing the "occult quality" that Newtonian science (which Hume admired) had sought to eliminate.

  ### 4. Where Hume Would Criticize Lewis
  It is important not to overstate the alliance. Hume would not be a perfect Lewisian.
  1.  **Modal Realism:** Lewis's concrete possible worlds would strike Hume as a fantastical fiction lacking any impressionistic basis.
  2.  **Global Systematization:** The "Best System" requires a "God's eye view" of the entire history of the universe to determine what counts as a law. Hume is a fallibilist who thinks from the perspective of a finite observer. He might find the idea of a "true deductive systematization" of all facts to be a rationalist fantasy.
  3.  **Psychology of Belief:** For Hume, the *feeling* of necessity (custom/habit) is the only necessity there is *for us*. Lewis objectifies laws into theorems. Hume might argue Lewis has forgotten the human psychology that gives the concept of "law" its meaning in the first place.

  ### 5. The Verdict
  If forced to choose a side in the modern seminar room:

  **Hume would sit with the Humeans (Lewis), but with reservations.**

  He would regard Armstrong's and Maudlin's views as a regression into pre-critical metaphysics. They claim to have insight into the "secret powers" of nature that Hume explicitly declared off-limits to human understanding. To Hume, claiming to know that laws *govern* (Maudlin) or *necessitate* via universals (Armstrong) is to claim a cognitive capacity we do not possess.

  Lewis, conversely, offers a metaphysics that respects the limits of human cognition. By reducing laws to patterns in the observable mosaic, Lewis ensures that our metaphysics never outruns what can, in principle, be experienced. Even if Hume believed in "secret powers" (New Hume), he would agree with Lewis that a metaphysics built on them is useless for science and unintelligible to philosophy.

  **The best-supported guess:** Hume would tell the Anti-Humeans that they are trying to solve a problem (the nature of necessitation) that human beings are not equipped to solve, and he would tell Lewis that he has largely succeeded in cleaning up the metaphysics, provided he doesn't reify the "Best System" into something more than a useful fiction. Hume is ultimately a **deflationist about modality**, and in the modern debate, Lewis is the deflationist, while Armstrong and Maudlin are inflationists.
