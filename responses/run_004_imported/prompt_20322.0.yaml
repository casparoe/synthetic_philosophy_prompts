      *   *Section 3: Is it Trivial?* Discuss the "Expert Principle" shift. If we restrict it too much, does it vanish? Argue that it still rules out *planned* irrationality or dogmatism. Mention the shift to "New Reflection" (Christensen/Arntzenius) if appropriate, but keep it focused on Van Fraassen first to answer the prompt.
