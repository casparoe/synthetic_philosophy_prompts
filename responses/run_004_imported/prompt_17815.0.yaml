prompt: |-
  So my friend Priya and I got into a whole two hour argument last night about whether an algorithm can actually count as "law." It started because she brought up how courts still use those opaque risk-scoring tools for sentencing and parole decisions, and how defendants basically never get a real explanation of why they got the score they did, even from the people who built the thing. Priya's position was pretty much pure Hart: if the legislature validly authorized use of the tool and its applied the same way to everyone, then whatever it spits out is law, full stop — whether its transparent or explicable is a totally separate question from whether its valid. I was arguing the Fuller side, that the whole point of calling something "law" instead of just organized coercion is that it has to satisfy some kind of inner morality, people need to be able to know the rule and officials need to actually apply the rule they announced, and a black-box model seems to fail that pretty badly by design. We never actually resolved it because neither of us could say with any confidence what Hart or Fuller would really think here, since obviously neither of them ever pictured machine learning existing.

  So here's what I want from you: reconstruct, as faithfully as you can to their actual arguments and not the flattened one-paragraph-per-side version you get in intro textbooks, how Hart and Fuller would each likely respond to a legal system that increasingly delegates decisions to opaque ML models. I'm thinking specifically about Hart's rule of recognition and his "minimum content of natural law" stuff, versus Fuller's principles of legality (things like publicity, clarity, and congruence between the announced rule and official action) and how those play against the grudge informer case the two of them originally fought over. Would Hart actually bite the bullet and say a sentencing model's output counts as valid law even when nobody, including its own engineers, can fully explain why it did what it did? Would Fuller say this makes it not really "law" at all, or just a degenerate/pathological case of a legal system? And once you take their actual historical arguments seriously instead of the seminar-room summary, who do you think ends up with the stronger position, and why?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

