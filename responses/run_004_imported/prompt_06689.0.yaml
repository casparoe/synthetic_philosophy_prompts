      *   *Metaethical Angles:*
          *   **Sincerity/Assertion Norms:** When you assert something, are you implying you believe it? (Gricean maxims, norms of assertion).
          *   **Epistemic Corruption:** The professor is building a case (grant renewal) on false premises. The user is complicit.
          *   **Manipulation/Coercion:** The environment forced the lie (gatekeeping based on idolatry rather than merit).
          *   **Value of Truth:** Is truth intrinsically valuable in academia, or just instrumentally?
