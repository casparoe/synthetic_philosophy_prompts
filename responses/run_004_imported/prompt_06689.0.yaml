  3.  **Deconstruct the Roommate's Claim ("A reason is a reason"):**
      *   This is a reductionist view. It ignores the *quality* or *type* of reason.
      *   In metaethics, we distinguish between *motivating reasons* (why I did it) and *normative reasons* (why I should have done it).
      *   The user had a *motivating* reason (get the job). But did they have a *normative* reason to lie? Most ethical frameworks say no (Kantian, Utilitarian if long-term harm is considered, Virtue Ethics regarding honesty).
