answer: |-
  **Setting:** *A cluttered philosophy department lounge. Late afternoon. SARAH (Sense-Datum Theorist) and DAVID (Disjunctivist) are leaning over a table where a clear glass of water sits with a wooden pencil submerged halfway.*

  **1. Sarah:** Look at the waterline. From this angle, the pencil is unmistakably bent. It has a jagged kink right where the air meets the glass.

  **2. David:** It *looks* bent. But we both know the pencil is straight. I can pull it out and show you. The physical object hasn't changed its shape.

  **3. Sarah:** That's the starting point, David. You're aware of something bent. You're staring right at it. But since the pencil isn't bent, the immediate object of your awareness cannot be the pencil. It has to be something else—something that actually *is* bent.

  **4. David:** I'm aware of the pencil. I'm just aware of it *as appearing* bent due to refraction. I don't need to posit a second object, a "sense-datum," floating between me and the glass.

  **5. Sarah:** But consider the phenomenology. If I were hallucinating a bent pencil right here, with no glass and no wood, the experience from the inside could be exactly the same. You can't tell the difference just by introspecting on the experience itself.

  **6. David:** I grant introspective indiscriminability. I can't tell, from the inside, if this is the illusion or a perfect hallucination. But that's an epistemic limitation, not a metaphysical identity.

  **7. Sarah:** That's where you lose me. If the experience in the illusion case and the experience in the hallucination case are introspectively identical, they must share a common underlying nature. Let's call that common factor *E*.

  **8. David:** Why must they share a nature? Just because two things feel the same to the subject doesn't mean they are the same kind of mental state. Gold and fool's gold can look identical, but one is a metal and the other is pyrite.

  **9. Sarah:** But we're talking about the mind. With gold, the difference is external to the observer. With experience, the "feel" is supposed to be what constitutes the mental state. If the subjective character is identical, the mental state is identical. So, in the hallucination, *E* is present without a physical object.

  **10. David:** Okay, follow that. In the hallucination, *E* is present without an object. But in the veridical case—where I'm actually seeing a straight pencil in water—why think *E* is there at all? Why not say the veridical case is a fundamentally different kind of state?

  **11. Sarah:** Because of the Common Kind Assumption. If the hallucination and the veridical perception are indiscriminable, they are tokens of the same type. If you deny that, you're saying the mind's own activity is fundamentally different depending on factors outside the head. That makes the mind opaque to itself.

  **12. David:** I'm willing to pay that price to keep the world transparent. In the good case, the nature of my experience is constituted by the actual pencil. The pencil is a constituent of the experience. In the bad case, that relation fails to obtain. So they are disjuncts: either I see the pencil, or I merely seem to.

  **13. Sarah:** That sounds like a verbal trick. You're defining the good case by its success conditions. But tell me this: If I'm in the good case, and I can't introspectively distinguish it from the bad case, what work is your "direct access" actually doing for me?

  **14. David:** It's doing metaphysical work. It explains why you are in contact with reality. You aren't trapped behind a veil of sense-data. You are literally acquainted with the pencil.

  **15. Sarah:** But epistemically, I'm in the same boat. If my justification for believing "there's a bent thing" relies on how things seem, and they seem the same in the bad case, then my evidence is the same. If my evidence is the same, your "direct acquaintance" is invisible to my reasoning. It doesn't help me know anything.

  **16. David:** I deny the premise. Your evidence *isn't* the same. In the good case, your evidence includes the fact that the pencil is there. In the bad case, it doesn't. You just can't tell which evidence you have.

  **17. Sarah:** That's wild. You're saying I can have evidence that is, in principle, indistinguishable from non-evidence, and yet it counts as knowledge? That severs the link between justification and internal access. I can't cite the pencil as my reason if I can't rule out the hallucination.

  **18. David:** You don't need to rule out the hallucination to have the fact as your reason. You only need to *be* in the case where the fact is present. Internalism is the straitjacket here, Sarah. You're demanding that for the world to be present to me, I must be able to prove it's present from the inside.

  **19. Sarah:** I'm demanding that if the mind is to be rational, it must operate on what is available to it. If your "direct access" is something I can't verify even in principle, then for all I know, I'm always in the bad case. You've saved realism at the cost of making perception a gamble.

  **20. David:** And you've saved the "given" at the cost of locking us out of the world. If the immediate object is always a sense-datum, you never see the pencil. You infer it. And how do you justify the inference if you only ever see the veil?

  **21. Sarah:** I don't infer it. The sense-datum is the basis. But at least I know what I'm dealing with. I know the contents of my own mind. You're asking me to say my mental state is defined by something outside my head, which I might not even be connected to.

  **22. David:** I'm asking you to admit that perception is a relation, not just a representation. When it works, it's a success. When it fails, it's a failure. You're trying to find a middle ground—a "successful failure"—that covers both. There isn't one.

  **23. Sarah:** And I'm telling you that without that common ground, you can't explain the phenomenology. Why does the bad case feel like seeing? Because it shares the nature of the good case. If they are totally different natures, the similarity is a cosmic coincidence.

  **24. David:** It's not a coincidence. The bad case is defined *in terms of* the good case. It feels like seeing because it is indiscriminable from seeing. The good case is the primary explanation. The bad case is the parasitic one.

  **25. Sarah:** Parasitic or not, if I can't tell the parasite from the host, I can't trust the host. Look, the pencil is still bent.

  **26. David:** And I'm still seeing a straight pencil that looks bent. We're staring at the same water, Sarah. We just disagree on whether we're looking *through* the experience at the world, or *at* the experience itself.

  **27. Sarah:** Exactly. And until you can explain how I'm supposed to know I'm looking through it, I'm sticking with the datum.

  **28. David:** And until you can explain how looking at the datum gets you to the pencil, I'm sticking with the disjunction.

  *(They stand in silence for a moment, watching the refraction shift as someone walks past the table.)*

  **29. Sarah:** ...Want to go get coffee?

  **30. David:** Yeah. I'll buy. Just don't ask me to pay with a check that might bounce, because if I can't tell the difference from the inside, my bank account status is irrelevant.

  **31. Sarah:** *(Smirks)* Don't push it.
