answer: |-
  **Setting:** *A quiet corner of the university coffee shop, late afternoon. Two graduate students, Alex and Morgan, are clearing away empty cups. Alex is a mereological universalist; Morgan defends a Van Inwagen-style organicism.*

  **Alex:** You've been quiet since seminar. I know you're working on biological individuality, and I know you've been living in *Material Beings* this term. I'm guessing the "Life" criterion is starting to itch.

  **Morgan:** It's more than an itch. It's a rash. Look, I want to be an Organicist. I want to say composition is restricted, and that life is the non-arbitrary boundary. But then I go back to the lab literature, and the boundary looks exactly like the "contact" and "fastening" criteria Van Inwagen spent three chapters demolishing.

  **Alex:** So you're ready to join the universalist club? Any plurality of objects composes a further object. No vague boundaries, no ontic indeterminacy. It's clean.

  **Morgan:** It's clean like a nuclear winter is clean. You save logic by vaporizing the furniture. But let's stick to my worry. Van Inwagen rejects "contact" because it's vague. When do two things touch? At the nanometer? The angstrom? He says if composition depends on contact, then whether an object exists is vague. And he thinks that's impossible. You can't have an indeterminate number of objects. But apply that to *life*.

  **Alex:** Go on.

  **Morgan:** Take a lichen. It's a fungus and a photobiont—algae or cyanobacteria. They exchange nutrients, signal chemically, form a thallus. To a field biologist, it's one individual. But I can mechanically separate them. They can live apart. The metabolic integration is a matter of degree. If composition occurs *only* when activity constitutes a life, then whether the fungus and alga compose an object depends on whether they constitute "a life." But that integration is gradual. So, composition is gradual. And if composition is gradual, the count of objects is indeterminate. Van Inwagen's own weapon turns on him.

  **Alex:** Exactly. This is the Argument from Vagueness. Van Inwagen says you can't have vague existence because that implies a vague identity or a vague count. If it's indeterminate whether the fungus and alga compose something, it's indeterminate whether there is one thing or two things in that spot. That's ontic vagueness. He bans it. So, if "life" is vague, "life" can't be the condition for composition.

  **Morgan:** But Van Inwagen has a reply to this. He distinguishes between vagueness in the *world* and vagueness in our *concepts*. He'd say the *existence* of the composite object isn't vague. Either the activities constitute a life or they don't. If it's vague whether they constitute a life, that's just semantic vagueness in the word "life." It doesn't mean composition is vague; it means we don't know if the condition for composition is met.

  **Alex:** That's a dodge. If the condition for composition is vague, then the extension of the composition relation is vague. Look at *Dictyostelium*. The slime mold. Solitary amoebae crawling around. Food runs out. They aggregate. They form a slug. They migrate. They fruit. When does the "life" of the slug begin? Is it when the first cAMP signal is sent? When ten cells stick? When a thousand? When the sheath forms?

  **Morgan:** There is a causal threshold. Once the homeostatic mechanisms kick in, the cells are no longer acting as independent agents. They're parts of a collective vehicle.

  **Alex:** "Once the mechanisms kick in." That's the contact criterion again! "Kick in" where? At what millisecond? If there is a precise millisecond, you're claiming biological magic. If there isn't, then for some interval *t*, it is indeterminate whether the cells compose a slug. If it's indeterminate whether they compose a slug, it's indeterminate how many objects are in the petri dish. Van Inwagen says that's unintelligible. So, either *Dictyostelium* doesn't exist as a composite object, or Universalism is true, or Van Inwagen is wrong about vagueness.

  **Morgan:** Okay, let's slow down. You're assuming that because the *biological description* is vague, the *metaphysical fact* must be vague. I'm trying to hold the line that the metaphysical fact is sharp, even if our biological access to it is fuzzy.

  **Alex:** How?

  **Morgan:** Think about the siphonophore. The Portuguese man o' war. It looks like a jellyfish, but it's a colony of zooids. Some are for feeding, some for floating, some for reproduction. They are clonal, but physiologically distinct. Van Inwagen would ask: Do the activities of these zooids constitute a single life?

  **Alex:** And the biologist says: "Yes, mostly." But also: "They have separate nervous systems." "They can sometimes survive separation."

  **Morgan:** Right. But the Organicist says: There is a fact of the matter about whether there is a single homeostatic system regulating the whole. It's not about our classification. It's about the causal flow. If the causal flow is unified, composition occurs. If not, it doesn't. The vagueness is in our measurement of the causal flow, not in the composition itself.

  **Alex:** But why think the causal flow is binary? Causation comes in degrees. Signal strength varies. Metabolic dependency varies. If the *condition* for composition comes in degrees, and composition is all-or-nothing, you have to draw a sharp line somewhere in the continuum. Where?

  **Morgan:** I don't have to draw it. Nature draws it.

  **Alex:** Nature doesn't draw sharp lines in continuous processes, Morgan. That's the whole lesson of evolution. Speciation is gradual. Development is gradual. Symbiosis is gradual. If you insist composition is sharp, you're saying there's a first nanosecond where the amoebae compose a slug, preceded by a nanosecond where they didn't. That's not biology; that's epicycles.

  **Morgan:** So what's your alternative? Universalism? You say the amoebae compose a slug, yes, but they also compose a "slug-plus-coffee-cup" object. You avoid vagueness by exploding ontology.

  **Alex:** I avoid *ontic* vagueness. I agree that's intolerable. But I pay for it by accepting that "organism" is just a pragmatic label we slap on certain fusions. You want to say "organism" is an ontological category. I'm saying the biology shows it's a functional one. If you tie existence to function, and function is graded, existence becomes graded.

  **Morgan:** Wait. Let's go back to the vagueness distinction. Van Inwagen allows that it can be vague whether a *life* is occurring. He just denies it can be vague whether *composition* is occurring. So, in the *Dictyostelium* case, he can say: "It is vague whether there is a life here. Therefore, it is vague whether the condition for composition is satisfied. But it is *not* vague that *if* a life is occurring, composition occurs."

  **Alex:** That saves the logic, but it doesn't save the biology. Because for you, the *only* time composition occurs is when a life occurs. So if it's vague whether a life occurs, it's vague whether a composite object exists. You've just pushed the vagueness back one step. You've saved the composition relation from vagueness only by making the existence of organisms vague. And Van Inwagen explicitly says we can't have vague existence.

  **Morgan:** He says we can't have vague existence for *material beings*. But maybe "organism" is a sortal that admits of borderline cases without implying ontic vagueness in the underlying matter. Look, the atoms are there. The question is how they are arranged. If they are arranged life-wise, they compose an organism. If it's borderline whether they are arranged life-wise, it's borderline whether there is an organism. But there is no borderline *object*. There are just the cells, and it's indeterminate whether they fall under the concept "organism."

  **Alex:** But you're an Organicist! You claim the organism is *real*. It's not just a concept. If the organism is real, and its existence conditions are vague, then reality is vague. If it's not real—if it's just cells arranged "organism-wise"—then you're basically a universalist who cares about predicates. You're saying the cells always compose *something*, but we only call it an "organism" when the life criteria are met.

  **Morgan:** ... I see the trap. If I say the cells always compose something, I'm a universalist. If I say they only compose something when life criteria are met, and those criteria are vague, I'm admitting ontic vagueness.

  **Alex:** Precisely. The lichen case breaks the link. The fungus and alga are distinct evolutionary lineages. They come together. They exchange carbon for nitrogen. Is that a life? If yes, they compose an object. If no, they don't. But the integration varies. Some lichens are tighter than others. Are you going to say there's a specific species of lichen where the integration crosses the metaphysical threshold?

  **Morgan:** No. That would be absurd.

  **Alex:** So the threshold must be within the life-history of the individual. But we just agreed that development is continuous.

  **Morgan:** Okay. Here is the narrow concession I'm willing to make. Van Inwagen might be wrong that "Life" is a sharp, binary switch in the way "contact" is. But he might be right that it's the *only* candidate we have for a non-arbitrary restriction. Universalism saves logic but loses the world. Restrictivism saves the world but risks logic.

  **Alex:** And the biology shows the risk is real.

  **Morgan:** Yes. But here's my counter-move. You say Universalism avoids vagueness. But Universalism makes *identity* trivial. If I compose an object with my coffee cup, when does that object cease to exist? When I drink the coffee? When I leave the shop?

  **Alex:** When the parts cease to be spatially proximate, or whatever your criterion for the fusion's persistence is. Usually, universalists are perdurantists. The space-time worm exists regardless.

  **Morgan:** Exactly. So you avoid vagueness in *composition* by accepting vagueness in *persistence*. You haven't eliminated vagueness; you've relocated it. You've moved it from "Does this object exist?" to "Is this temporal stage part of that object?"

  **Alex:** *Touché.* But Van Inwagen thinks vagueness in existence is worse than vagueness in persistence.

  **Morgan:** Is it? In the *Dictyostelium* case, the biological individuality is tied to the life cycle. The slug phase is temporary. If I say the cells compose an object only during the slug phase, I face the "when exactly" problem. If you say the cells *always* compose an object, you face the "why is this an individual" problem.

  **Alex:** So we're stuck. I can't convince you that tables and clouds are real objects without making ontology trivial. You can't convince me that organisms are metaphysically privileged without making existence vague.

  **Morgan:** Not quite stuck. I think the biology forces a modification of Van Inwagen. He treats "Life" as a state. Maybe "Life" is a process. Composition isn't a switch; it's a participation in a process.

  **Alex:** That sounds dangerously like "degree of composition."

  **Morgan:** Or it sounds like admitting that "object" is the wrong category for biology. Maybe the holobiont isn't a "substance" in Van Inwagen's sense. Maybe it's a dynamic system. If I concede that, I save the biology, but I have to tell the metaphysicians that biological individuals don't have the same ontological status as dogs or people.

  **Alex:** And if I concede that, I have to admit that Universalism doesn't help me understand *why* we care about organisms. It just says they exist. It doesn't explain their unity.

  **Morgan:** So, stalemate?

  **Alex:** Stalemate. But a productive one. You keep the "Life" criterion, but admit it might need precisification that biology can't provide. I keep Universalism, but admit it doesn't capture biological significance.

  **Morgan:** And we both agree that Van Inwagen's Argument from Vagueness is a grenade that lands in both our laps. He thought it cleared the field for Organicism. It looks like it might clear the field for everyone.

  **Alex:** *Raises coffee cup.* To the indeterminacy of the slug.

  **Morgan:** *Clinks cup.* May it never quite decide if it's one thing or many.
