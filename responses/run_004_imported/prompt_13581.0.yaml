          *   Marcus: But we detect *two* clicks in a detector. Numerical distinctness exists without qualitative distinctness.
      *   **Round 3: Weak Discernibility (The Technical Turn).**
          *   Elena: Saunders' move. Fermions are discernible by the relation "has opposite spin to" or "is distinct from." Irreflexive relations.
          *   Marcus: That's linguistic trickery. "Being distinct" presupposes distinctness. It's circular.
          *   Elena: No, it's structural. The state is antisymmetric. The physics *is* the relation.
      *   **Round 4: Bosons & Condensates (Condensed Matter Nod).**
