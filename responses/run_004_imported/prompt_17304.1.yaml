  1.  **Analyze the User's Request:**
      *   **Topic:** Statistics misleading the public, focusing on Simpson's Paradox (specifically the 1973 Berkeley admissions case).
      *   **Proposed Rule of Thumb:** "Whenever a pooled statistic and a disaggregated, subgroup-level version of it disagree, the subgroup-level figure is the one to trust, since it sits closer to the actual causal mechanism."
      *   **Goal:** Sharpen this rule so it's robust enough for readers to apply in other contexts (medicine, economics, etc.).
      *   **Underlying Assumption:** The user assumes the subgroup-level data is *always* the correct one to trust in cases of Simpson's Paradox.

  2.  **Evaluate the Proposed Rule:**
      *   *Is the assumption correct?* No. This is the critical flaw. In Simpson's Paradox, it is *not* always true that the disaggregated data is the "real" story. Sometimes the pooled data is correct, sometimes the disaggregated is correct, and sometimes neither tells the full causal story without further context.
      *   *Why?* Simpson's Paradox is about confounding variables. Whether you should control for a variable (disaggregate) or not depends on whether that variable is a *confounder* (needs controlling) or a *mediator/collider* (should not be controlled).
      *   *Berkeley Case:* In Berkeley, "Department" was a confounder (women applied to harder departments). So disaggregating was correct.
      *   *Counter-Example (Medical):* Imagine a drug that increases blood pressure (bad) but also increases survival rates (good) because it treats a deadly disease. If you disaggregate by blood pressure change, you might see the drug looks bad in both high and low BP groups, but overall it saves lives. Here, BP is a *mediator*. Controlling for it hides the total effect.
      *   *Counter-Example (Colliders):* Conditioning on a collider can *create* a spurious association where none exists.
      *   *Conclusion:* The user's proposed rule is dangerous. It needs significant correction, not just sharpening.

  3.  **Formulate the Correction Strategy:**
      *   **Acknowledge the strength:** The Berkeley example is indeed the classic case where disaggregation revealed the truth.
      *   **Identify the risk:** Blindly trusting subgroup data can lead to *reverse* Simpson's Paradox errors (e.g., controlling for mediators).
      *   **Introduce Causal Reasoning:** The key isn't "pooled vs. subgroup," it's "what is the causal structure?"
      *   **Develop a Better Rule:** Instead of "trust subgroups," the rule should be "trust the breakdown *only if* the grouping variable is a confounder, not a mediator or outcome of the treatment."
