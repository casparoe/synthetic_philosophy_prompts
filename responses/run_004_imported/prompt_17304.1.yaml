  5.  **Refining the "Rule of Thumb":**
      *   Old Rule: Trust subgroups over pooled.
      *   New Rule: Trust the version that adjusts for *pre-existing differences* (confounders), not *outcomes of the process* (mediators).
      *   Simpler phrasing for a general audience: "Trust the breakdown only if the groups existed *before* the choice was made, not if they were created *by* the choice." (Wait, that's a bit clunky).
      *   Better: "Ask *why* the groups differ. If the grouping factor influences the outcome independently (like department difficulty), look at subgroups. If the grouping factor is a result of the treatment (like blood pressure after taking a drug), look at the total."
      *   Best for a general audience rule: "Don't just split the data; ask if the split explains the *cause* or hides the *effect*."
      *   Actually, the most robust heuristic is the **"Pre-treatment vs. Post-treatment"** distinction.
      *   *Revised Rule:* "Trust the disaggregated data only when the subgroups represent conditions that existed *before* the decision or treatment was applied."

  6.  **Finalizing the Content:**
