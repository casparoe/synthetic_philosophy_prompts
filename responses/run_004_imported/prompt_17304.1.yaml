answer: |-
  This is a fantastic topic, and the 1973 Berkeley case is indeed the gold standard for introducing Simpson's Paradox. It is intuitive, historically significant, and clearly illustrates how aggregation can hide reality.

  However, I need to offer a crucial caution: **The rule of thumb you proposed ("always trust the subgroup-level figure") is statistically dangerous.**

  If you publish that rule, a knowledgeable reader in medicine or economics could easily find a counter-example where the *pooled* data is the truth and the *subgroup* data is the artifact. In causal inference, knowing whether to trust the pooled or disaggregated number depends entirely on **whether the grouping variable is a cause or an effect.**

  Here is how you can sharpen your argument to be robust, accurate, and still accessible to a general audience.

  ### 1. The Problem with "Always Trust Subgroups"
  In the Berkeley case, the department was a **confounder**. Women applied to harder departments *before* the admissions decision was made. The department choice influenced the admission rate, but the admission decision did not change the department choice. Therefore, controlling for it (disaggregating) revealed the truth.

  However, in medicine, we often deal with **mediators**.
  *   **Example:** Imagine a drug that lowers blood pressure, and lower blood pressure reduces heart attacks.
  *   **The Paradox:** If you disaggregate patients by their *final* blood pressure (Low BP vs. High BP), the drug might appear to have no benefit within each group. Why? Because the drug's *only* benefit was moving people from the "High BP" group to the "Low BP" group.
  *   **The Truth:** If you control for the subgroup (BP), you erase the mechanism of the cure. In this case, the **pooled** statistic (the drug saves lives) is the one to trust, and the subgroup analysis is misleading.

  ### 2. The Refined Rule: The "Pre-Existing Condition" Test
  To make your rule of thumb solid enough for medicine and economics, you need to shift the focus from "pooled vs. subgroup" to **"timing and causality."**

  Here is a revised rule of thumb you can offer your readers:

  > **"Trust the disaggregated data only when the subgroups represent conditions that existed *before* the decision or treatment was applied. If the subgroups are a *result* of the treatment, trust the pooled total."**

  Or, even simpler for a general audience:

  > **"Ask: Did the group membership cause the outcome, or did the treatment cause the group membership? If the former, look at the subgroups. If the latter, look at the total."**

  ### 3. How to Integrate This Into Your Piece
  You can keep the Berkeley story as your hero example, but add a "Caution" paragraph that elevates your analysis from "statistics are tricky" to "causal reasoning is essential."

  **Suggested Drafting Approach:**

  1.  **Tell the Berkeley Story:** Explain how the pooled data showed bias, but the department-level data exonerated the university.
  2.  **Explain *Why* It Worked:** Explicitly state that this worked because "Department Choice" was a **pre-existing factor**. Women chose the departments *before* they were admitted or rejected. The department didn't change based on the admission; the admission changed based on the department.
  3.  **Introduce the Caveat (The "Medical Trap"):** Warn readers that this doesn't always work. Give a brief medical example (like the blood pressure one above).
      *   *Drafting note:* "Imagine a heart medication that works by lowering blood pressure. If we split patients into 'Low Blood Pressure' and 'High Blood Pressure' groups *after* taking the pill, the drug might look ineffective in both groups. That's because the drug's success is what moved them into the 'Low' group. Here, the pooled data tells the truth: the drug works."
  4.  **Present the Final Rule:** Conclude with the "Pre-Existing Condition" test.

  ### 4. Why This Makes Your Piece Stronger
  By making this distinction, you accomplish three things:
  1.  **Accuracy:** You protect yourself from criticism by statisticians or scientists who know that conditioning on mediators (post-treatment variables) is a classic error.
  2.  **Depth:** You move the conversation beyond "numbers lie" to "context matters." This empowers readers to think critically rather than just memorizing a heuristic.
  3.  **Applicability:** This rule actually *works* in economics and medicine.
      *   *Economics:* If analyzing a job training program, disaggregate by *prior* education (pre-existing), but do not disaggregate by *employment status* (result of the program).
      *   *Medicine:* Disaggregate by *age* or *genetics* (pre-existing), but do not disaggregate by *cholesterol level* if the drug is designed to lower cholesterol.

  ### Summary Recommendation
  Your instinct to use Berkeley is perfect. Your instinct to give readers a tool is also perfect. Just tweak the tool so it doesn't break when they encounter a medical study.

  **Replace:** "Trust the subgroup-level figure."
  **With:** "Trust the breakdown only if the groups were defined *before* the outcome occurred."

  This preserves the spirit of your Berkeley example while ensuring your advice holds up in the real world.
