  ***

  **Eulogy for Ray**

  Thank you all for being here. For those who knew my Uncle Ray only as a brother, a colleague, or a friend, you know him as a man of immense warmth. But for those of us who lived in his orbit, we know he was also a man of questions.

  Ray was a planner. He was the kind of person who read the manual before assembling the furniture, and he was the kind of person who thought deeply about how his life touched the lives of others. Many of you know that for the last twenty-five years, Ray gave away a significant portion of his income to charity. He focused on causes that saved lives—things like bed nets and medicine in places where they were desperately needed.

  He was rigorous about it. In fact, if you went to his desk, you would have found a spreadsheet. He updated it every year. It was a tally of what he believed his contributions might have achieved. He tracked the data. He followed the research.

  But there is something about Ray that is more important than that spreadsheet, and it's something he made me promise to share with you today.

  Ray was honest enough to admit that the spreadsheet was a tool for his own discipline, not a final verdict on reality. He often said that while we can see the immediate good of an action—a child protected from malaria, a family spared from illness—we cannot see where the ripples of that action end. He knew that saving a life changes the future in ways we can't predict. He knew that the long-term consequences of any good deed are, in the end, a mystery.

  He left specific instructions for this service. He asked that nobody stand up and confidently declare that he "saved X number of lives." He felt that kind of tidy accounting was dishonest. He believed that claiming we can fully calculate our impact on the world is a kind of arrogance.

  And yet, here is the beautiful thing about my uncle: He knew he couldn't know the final outcome, and he gave anyway.

  He didn't need the guarantee of a perfect result to do the work. He didn't need to see the end of the story to write a good chapter. For Ray, the value wasn't in controlling the future; it was in aligning himself with kindness in the present. He understood that we live in a world of uncertainty, but he decided that the best response to that uncertainty wasn't cynicism, and it wasn't calculation. It was trust. Trust that trying to help is better than trying to ignore. Trust that love is a worthy gamble, even when the odds are unknowable.

  I think that is a profound comfort for us today. We are all standing here feeling the sharp edge of loss, wondering about the future without him. We all want to know that our lives matter, that what we do makes a difference. Ray's life teaches us that you don't need to know the final score to play a good game.

  You don't need to know how the ripples will land to throw the stone. You just need to throw it with care.

  Ray threw his stone with more care than almost anyone I have ever known. He showed us that integrity isn't about being right; it's about being sincere. It's about doing the good that is in front of you, even if you can't see where it leads.

  So, we will not count the lives he touched today. We will not try to sum him up in numbers. Instead, we will honor him by acknowledging that while we cannot know the full extent of the good he did, we can feel the warmth of it. We can feel it in the family he raised, the friends he supported, and the strangers he never met but cared for deeply.

  He walked through a foggy world with a bright light. He couldn't see the horizon, but he made sure the path immediately in front of him was lit for everyone else.

  Thank you, Ray, for the light. We will try to carry it from here.
