prompt: |-
  I'm a software engineer with no formal training in philosophy, but I run a small philosophy podcast as a side project, and I've been doing background reading to prepare for next week's episode. My guest defends anti-reductionism about testimony: roughly, the view going back to Thomas Reid and revived by philosophers like C.A.J. Coady and Tyler Burge, that a hearer is entitled by default to accept sincere, intelligible testimony as true, without first needing independent inductive evidence that the speaker, or testimony in general, is reliable. Please draft eight interview questions that move past a mere restatement of the position. I'd like at least one question on the regress problem that motivates the view in the first place (reductionists seem to need testimony-independent evidence of testimony's reliability, yet almost none of us has actually gathered that evidence firsthand); one on Jennifer Lackey's objection that default entitlement over-licenses belief even in epistemically "hostile" environments full of unreliable speakers; one on whether the fact that small children trust testimony before they're capable of inductive reasoning really supports a claim about justification, rather than just describing how belief-formation happens to develop; and one on how the view is meant to differ from Elizabeth Fricker's "local reductionism," on which a hearer must still monitor individual speakers for signs of insincerity or incompetence. For each of these, add a plausible follow-up keyed to the answer my guest is likely to give, and close with a question about what kind of case, if any, would make her abandon the default-entitlement picture altogether.
