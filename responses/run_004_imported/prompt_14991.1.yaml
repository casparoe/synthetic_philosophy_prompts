answer: |-
  Here are eight interview questions designed for your podcast. They are structured to move from the foundational motivations of the view to its practical implications and limits.

  Per your request, the first four questions address the specific philosophical objections you highlighted, each including a main question and a targeted follow-up. The final question serves as the "defeater" condition to close the interview.

  ### 1. The Regress Problem (Motivation)
  **Main Question:** One of the primary motivations for anti-reductionism is avoiding a vicious regress. If I need independent inductive evidence to trust your testimony, but I acquired almost all my background knowledge *through* testimony, it seems I can't ever get the justification process started without circularity. You argue that we need a default entitlement to break this loop. But does positing this a priori principle risk making the view immune to empirical falsification? If the principle is a necessary precondition for knowledge, can anything count against it?

  **Follow-up:** *If she argues that it is a transcendental precondition (i.e., we must assume it to make sense of communication):* "If it's a precondition for the practice of communication itself, does that mean a skeptic who denies it isn't just wrong, but is actually failing to participate in the practice they're critiquing? Does that dissolve the skepticism or just sidestep it?"

  ### 2. Jennifer Lackey's "Hostile Environment" Objection
  **Main Question:** Jennifer Lackey has argued that default entitlement might over-license belief. She asks us to imagine a "Liar Land" where most speakers are unreliable. In that environment, a hearer who trusts by default would form mostly false beliefs. If justification depends on the reliability of the environment, doesn't that mean entitlement isn't actually "default" but contingent on external facts the hearer might not know? How do you preserve the *internal* sense of entitlement while acknowledging that environment matters?

  **Follow-up:** *If she concedes that environment matters but insists the default holds until proven otherwise:* "Is there a threshold for that? How much 'noise' or unreliability does an environment need to have before the default entitlement switches off? Is that a sharp line we can draw, or a vague gradient?"

  ### 3. Child Development (Normative vs. Descriptive)
  **Main Question:** Anti-reductionists often point to small children, who accept testimony long before they are capable of gathering inductive evidence. You take this as support for a natural, justified entitlement. However, a critic might say this only describes *how* belief formation happens developmentally, not whether it is *justified*. Just because children are biologically wired to trust doesn't necessarily mean they *ought* to. How do you bridge the gap from this psychological fact to a normative epistemic principle?

  **Follow-up:** *If she appeals to a teleological view (i.e., our cognitive faculties are designed for truth):* "If the function of these faculties is truth-tracking, how do you account for adult gullibility? If an adult retains that childlike default trust in obviously manipulative situations, is that a 'malfunction' of the same faculty? If so, doesn't that imply the default needs a monitoring system to prevent malfunction?"

  ### 4. Elizabeth Fricker's "Local Reductionism"
  **Main Question:** Elizabeth Fricker proposes a middle ground: we don't need global inductive evidence for testimony in general, but we do need to monitor individual speakers for signs of insincerity or incompetence. You argue that even this monitoring demand is too high. But isn't there a practical difference between 'trusting by default' and 'trusting unless there's a red flag'? In your view, is the burden of proof on the speaker to establish trustworthiness, or on the hearer to find signs of deceit?

  **Follow-up:** *If she argues that monitoring is secondary to the initial entitlement:* "From a cognitive load perspective, does your view offer an efficiency advantage? If Fricker's view requires us to constantly run background checks on speakers, is her model simply too computationally expensive for human beings to function socially?"

  ### 5. The Perception Analogy
  **Main Question:** Thomas Reid famously compared testimony to perception. Just as I don't need evidence that my eyes are working before I believe what I see, I shouldn't need evidence that you are reliable before I believe what you say. But perception is direct, whereas testimony is mediated by another mind with its own agenda. Do you think this analogy holds up under scrutiny, or is there a disanalogy regarding the "other mind" that gives reductionists a foothold?

  ### 6. Sincerity vs. Competence
  **Main Question:** Your view generally grants entitlement to "intelligible presentation." But this seems to conflate sincerity with competence. If a speaker is completely sincere but utterly mistaken—say, a friend confidently giving me wrong directions—am I still justified in believing them on your account? If so, does your theory prioritize social cohesion over truth-tracking, since I'm justified in believing falsehoods so long as the speaker is honest?

  ### 7. Testimony in the Digital Age
  **Main Question:** Much of the classical defense of anti-reductionism assumes a face-to-face community where speakers are accountable. Today, we consume testimony from algorithms, anonymous sources, and AI models where sincerity isn't even a applicable concept. Does the default entitlement view need to be updated for the digital age, or does the sheer volume of potential misinformation make the default stance dangerous in a way Reid couldn't have anticipated?

  ### 8. The Defeater Condition (Closing Question)
  **Main Question:** To close, I want to ask about the limits of your commitment. Philosophical views are often resilient, but they shouldn't be unfalsifiable. Is there a specific thought experiment, empirical finding, or logical inconsistency that, if discovered, would make you abandon the default-entitlement picture altogether? What would that case look like?
