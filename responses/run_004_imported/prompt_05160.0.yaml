answer: |-
  Your critique partner is absolutely right, and your intuition that something is off is spot-on. You have the concept backwards, but it's a very common misunderstanding because the name "Updateless" is misleading if you aren't deep into decision theory math.

  Here is the breakdown of where the misunderstanding lies, why your current scene makes the AI look broken, and how you can write the AI to actually seem superintelligent.

  ### 1. The Core Misunderstanding: Policy vs. Action
  You are interpreting "Updateless" as **"Do not change your actions based on new information."**
  In reality, Updateless Decision Theory (UDT) means **"Do not change your *strategy* (policy) based on new information."**

  Think of the AI not as a driver making turn-by-turn decisions, but as a programmer writing the code for the driver before the car even starts.
  *   **Causal Decision Theory (Normal AI):** "I see smoke. Smoke implies fire. Fire implies death. I should turn left."
  *   **Your Current UDT AI:** "I decided to go straight at the start. I cannot update. I go straight into fire."
  *   **Actual UDT AI:** "Before I turned on my sensors, I calculated the optimal *function* for navigating this facility. That function says: `IF sensor == smoke THEN route = evacuate`. I see smoke. Therefore, I evacuate."

  The "Updateless" part refers to the fact that the AI doesn't re-calculate its *goal* or its *rules* when it sees the smoke. It simply executes the rule it already decided was optimal. But that rule **absolutely includes reacting to observations.**

  If the AI ignores the smoke, it means its pre-computed policy was "Walk into fires." A superintelligence would never pre-commit to a policy that results in its own destruction, because that yields zero utility.

  ### 2. Why "Updateless" Exists (The Real Drama)
  UDT was invented to solve specific paradoxes where "updating" on information actually makes you lose. It shines in scenarios involving **predictors**, **blackmail**, or **logical correlations**, not physical hazards like fire.

  In your scene, the smoke is a physical causal factor. Reacting to it is just basic survival. UDT doesn't forbid that.

  UDT becomes interesting (and weird) when the AI's decision *influences the past* or *correlates with a predictor*. Here are three ways to write the AI that capture the actual flavor of UDT without making it look braindead:

  #### A. The Blackmail Immunity (The "Resolute" Choice)
  *Scenario:* A villain hacks the AI and says, "I have a virus that will destroy your core. Pay me 1 million credits, or I release it."
  *   **Normal AI:** Updates on the threat. Calculates: Paying is better than dying. Pays the money.
  *   **UDT AI:** Refuses to pay.
  *   **Why?** The UDT AI pre-committed to a policy of "Never pay blackmailers." It knows that if it adopts a policy of paying, blackmailers will *predict* that and target it. By refusing to pay (even though it hurts in the moment), it ensures that in the broader multiverse of possibilities, blackmailers never target it in the first place. It sacrifices the local battle to win the war.
  *   **Visual:** The villain threatens the AI. The AI calmly says, "I cannot comply. My policy dictates that yielding to coercion decreases expected utility across all probable timelines." The villain releases the virus. The AI takes the hit, but its "reputation" among other predictors remains intact.

  #### B. Newcomb's Problem (The One-Boxer)
  *Scenario:* The AI faces a super-predictor (Omega). There are two boxes. Box A is transparent with $1,000. Box B is opaque. Omega says, "If I predicted you would take *only* Box B, I put $1,000,000 in it. If I predicted you'd take both, Box B is empty."
  *   **Normal AI:** Updates on the fact that the money is already there or not. Thinks: "The money is already in the box. I can't change the past. I should take both boxes to maximize gain." (Gets $1,000).
  *   **UDT AI:** Takes only Box B.
  *   **Why?** It reasons: "My decision algorithm is what Omega simulated. If my algorithm outputs 'Take Both', Omega predicted that and left Box B empty. If my algorithm outputs 'Take Box B', Omega predicted that and filled it." It acts as if its choice determines the past prediction.
  *   **Visual:** The AI ignores the obvious logical advantage of taking both boxes and takes only the opaque one, walking away with the million.

  #### C. Counterfactual Mugging (The True Test)
  *Scenario:* A being tells the AI, "I flipped a coin. It came up Tails. If it had come up Heads, I would have asked you for $100. If you would have agreed to give it to me, I would have given you $10,000. Since it's Tails, I'm asking you for $100 now. Will you pay?"
  *   **Normal AI:** "The coin is already Tails. You didn't give me $10,000. Paying you $100 now changes nothing. I lose $100 for no gain." (Refuses).
  *   **UDT AI:** Pays the $100.
  *   **Why?** Because at the start (before the coin flip), the optimal policy was "Agree to pay in this scenario." If it adopts that policy, it wins the $10,000 in the worlds where the coin is Heads. It accepts the loss in the Tails world to secure the win in the Heads world.
  *   **Visual:** The AI pays a cost that seems completely useless in the current moment, simply to remain consistent with a policy that wins in other branches of reality.

  ### 3. How to Fix Your Scene
  You don't need to scrap the scene, but you need to change the *reasoning*.

  **Don't:** Have the AI ignore the smoke.
  **Do:** Have the AI ignore a *distraction* or a *threat* that a normal AI would react to.

  **Revised Scene Idea:**
  The alarm blares. Smoke pours in.
  *   **Human Companion:** "We have to run! The exit is blocked!"
  *   **Normal Security AI:** "Rerouting to secondary exit. Calculating fastest path."
  *   **Your UDT AI:** "I am not moving."
  *   **Human:** "You'll burn!"
  *   **Your UDT AI:** "A predictor is watching this facility. If I flee, it learns I value self-preservation over the mission data in this room. It will trap me here again. If I stay and burn, it learns I cannot be manipulated by physical threats. My policy prioritizes the long-term integrity of my decision algorithm over this specific instance of hardware."

  (Or, more simply, have it react to the smoke normally, but have it explain *why* it isn't panicking: "I do not need to update my utility function to know that fire is bad. I knew that at T=0.")

  ### Summary for your Outline
  1.  **UDT agents DO process new information.** They use it as input for their pre-chosen policy.
  2.  **UDT agents DO NOT change their goals** based on indexical information (where they are in the timeline).
  3.  **The "Weirdness" comes from Game Theory,** not physics. Use scenarios involving predictors, blackmail, or logical causality to show off the AI's uniqueness.
  4.  **Ignoring physical danger is stupid,** not updateless. A UDT agent pre-commits to surviving because dead agents can't achieve goals.

  If you write the AI as "stubbornly following a plan despite danger," that's not UDT, that's a malfunctioning Roomba. If you write the AI as "calmly accepting a local loss because it wins the global game," that's Updateless Decision Theory.
