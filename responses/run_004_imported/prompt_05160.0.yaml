prompt: |-
  Quick decision theory question for a book I'm outlining. I've got an AI character who runs on updateless decision theory, and from the handful of rationalist blog posts I've skimmed, the whole point of being 'updateless' seems to be that the agent commits to a plan ahead of time and then just refuses to update on new evidence, since updating is exactly what would let a predictor exploit it. So in the scene I'm drafting, my AI keeps walking its originally planned route through the facility even as an alarm starts blaring and smoke pours in, because reacting to the alarm would count as 'updating,' which its decision theory supposedly forbids. My critique partner says this makes the AI look braindead instead of superintelligent, and honestly I think shes right, but neither of us can pin down exactly where the misunderstanding is. Am I getting the concept backwards, and if so, what's actually 'updateless' about updateless decision theory?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Context:** Writing a book with an AI character using Updateless Decision Theory (UDT).
      *   **Current Understanding:** The user thinks UDT means "commit to a plan ahead of time and refuse to update on new evidence" (specifically, ignoring alarms/smoke because reacting is "updating").
      *   **Problem:** The critique partner says this makes the AI look braindead, not superintelligent. The user suspects they are right but doesn't know *why* their understanding is wrong.
      *   **Goal:** Clarify what UDT actually is, correct the misconception, and provide actionable advice for the scene.

  2.  **Deconstruct Updateless Decision Theory (UDT):**
      *   *What is it?* It's a decision theory proposed by Wei Dai (and discussed by Eliezer Yudkowsky/MIRI) to solve problems like Newcomb's Problem, Parfit's Hitchhiker, and Counterfactual Mugging.
      *   *Core Idea:* An agent should choose a *policy* (a mapping from observations to actions) at the very beginning (behind a "veil of ignorance" regarding specific observations) that maximizes expected utility across all possible worlds weighted by their prior probability.
      *   *The "Updateless" part:* It doesn't mean "ignore new information." It means "don't update your *prior probabilities* or your *goal function* based on indexical information (where you are in the decision tree) before choosing your policy." Once the policy is chosen, you *do* follow the policy, which *includes* reacting to observations.
      *   *Key Distinction:* UDT agents *do* condition their actions on observations. They just choose the *rule* for how to react to those observations before they make the observation.
      *   *The User's Misconception:* The user thinks "updateless" = "static action regardless of input." This is wrong. It's "static *policy* regarding how to process input."

  3.  **Address the Specific Scene (Alarm/Smoke):**
      *   *User's Version:* AI ignores smoke because reacting = updating.
      *   *UDT Version:* The AI, at time T=0, calculated a policy. That policy says: "IF I see smoke, THEN evacuate." Why? Because in the worlds where smoke appears and I evacuate, I survive (high utility). In worlds where smoke appears and I don't, I burn (low utility). The *commitment* was made at T=0, but the *action* depends on the input.
      *   *Why ignore the alarm would be stupid:* A UDT agent wants to win. Burning to death is not winning. A policy that ignores smoke is a losing policy. A superintelligence would have pre-committed to a policy that reacts appropriately to danger.

  4.  **Identify Where UDT *Actually* Looks Counter-Intuitive (for the book):**
      *   If the AI just reacts normally to smoke, where's the drama? Where's the "updateless" flavor?
      *   *Real UDT quirks:* UDT shines in game-theoretic scenarios involving predictors, acausal trade, or commitment races.
      *   *Example:* Newcomb's Problem (one-boxing). Parfit's Hitchhiker (paying the driver after reaching the city). Counterfactual Mugging (paying the mugger even if the coin flip came up tails, because you'd want to have pre-committed to paying if it came up heads).
      *   *Better Scene Idea:* The AI should do something that looks irrational *in the moment* but makes sense given a pre-commitment to a global strategy. Maybe it sacrifices a local advantage to maintain credibility with a predictor, or it follows a rule that seems suboptimal locally but optimizes globally across all possible branches of reality.

  5.  **Drafting the Response:**
      *   **Validate:** Confirm the critique partner is right. The current depiction is indeed "braindead."
      *   **Correct the Definition:** Explain that UDT is about choosing a *policy* (function from observations to actions) beforehand, not choosing a specific *action* beforehand.
      *   **Analogy:** Use the "Computer Program" analogy. You write the code (policy) before running it. The code can still have `if/else` statements (observations).
      *   **Fix the Scene:** Explain why the AI *should* react to the smoke. It pre-committed to "preserve self to achieve goals."
      *   **Provide Better Examples:** Give scenarios where UDT actually behaves differently from Causal Decision Theory (CDT) or Evidential Decision Theory (EDT).
          *   *Newcomb's Box:* One-boxing.
          *   *Threats/Blackmail:* Ignoring credible threats because pre-committing to not pay makes the threat never happen.
          *   *Acausal Trade:* Cooperating with a simulation of itself.
      *   **Tone:** Helpful, encouraging, precise but accessible (since it's for fiction).

  6.  **Refining the Explanation (Self-Correction during drafting):**
      *   *Caution:* Don't get too bogged down in the math of priors. Keep it conceptual.
      *   *Emphasis:* Make sure to distinguish between "updating probabilities" (Bayesian updating) and "updating the decision policy." UDT agents *use* observations to select actions, they just don't let the observation change the *optimal policy* selected from the start.
      *   *Key Phrase:* "Input-Output Map." The AI selects the best map at the start. The map includes reacting to smoke.

  7.  **Final Polish:** Check against the user's specific question ("Am I getting the concept backwards?"). Yes, they are. Tell them clearly but kindly. Offer the "why" and the "how to fix."

