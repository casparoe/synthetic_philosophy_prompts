answer: |-
  Here are nine interview questions designed to penetrate the rehearsed surface of the picoeconomics model, complete with the specific follow-ups you requested to counter her likely evasions.

  ### 1. The Geometry of Temptation
  **Question:** "Let's start with the mechanics, but I want to skip the textbook definition. For a listener who doesn't have a graph in front of them: why does a *hyperbolic* curve create a preference reversal that an *exponential* curve literally cannot? What is it about the shape of the curve that forces the 'later self' and the 'now self' to disagree, whereas a standard rational agent would stay consistent?"

  *   **Anticipated Dodge:** She will likely give a smooth analogy about "value shooting up as you get close" without explaining the *inconsistency*.
  *   **Follow-up:** "But consistency is the key, isn't it? If I exponentially discount, I might still choose the cake, but I would have chosen the cake yesterday too. With hyperbolic discounting, I plan to diet yesterday, but eat today. So are you saying akrasia is just a mathematical error in how we process time, rather than a moral or psychological struggle?"

  ### 2. Judgment vs. Preference (The Holton Challenge)
  **Question:** "Classical akrasia, on the Davidsonian view, requires acting against your own *best judgment*. But in your model, at the moment of choice, the immediate reward actually *is* valued higher. So, strictly speaking, no judgment is being violated; the preference has just flipped. Are you explaining weakness of will, or are you just relabeling ordinary preference reversal? How do you square that with Richard Holton's view that willpower is about sticking to resolutions, not maximizing utility?"

  *   **Anticipated Dodge:** She'll argue that the "long-term preference" is the true judgment, and the short-term spike is noise.
  *   **Follow-up:** "But if the short-term preference is strong enough to drive action, it's not noise—it's a preference. If I follow Holton, the weak-willed person isn't someone who changed their mind; it's someone who abandoned a resolution *despite* not changing their mind. Does your model have room for that? Or does picoeconomics dissolve the concept of 'resolution' entirely?"

  ### 3. The Metaphysics of Successive Selves
  **Question:** "You talk about successive selves bargaining across time like players in a Prisoner's Dilemma. I need to know: is this a metaphysical claim? Do you believe I am literally a different entity tomorrow than I am today? Or is this just a convenient modeling fiction you'd drop the second someone pushed you on personal identity?"

  *   **Anticipated Dodge:** "It's just a model, we don't need to commit to ontology."
  *   **Follow-up:** "If it's *just* a model, then the 'bargaining' isn't real, and the 'will' isn't a mediator—it's a metaphor. So why build a theory of moral responsibility on a fiction? If the selves aren't real, who exactly is losing the bargaining game?"

  ### 4. The Precommitment Paradox
  **Question:** "Let's talk about Ulysses contracts and Bratman-style planning. People can bind their future selves to resist temptation without ever changing their underlying discount rate. If I can use a planning agency to circumvent the discount curve, doesn't that suggest the discounting was never the whole story to begin with? Isn't there a 'higher' agency doing the binding?"

  *   **Anticipated Dodge:** She'll say precommitment is just another move in the bargaining game (a strategic constraint).
  *   **Follow-up:** "But who makes that move? If the 'present self' is slave to the hyperbolic spike, how does it have the capacity to tie its own hands? It sounds like you need a homunculus—a little person inside—who isn't subject to the discounting to make the precommitment happen. Where is that agent in your model?"

  ### 5. Ecological Validity (Money vs. Doomscrolling)
  **Question:** "Most hyperbolic discounting data comes from intertemporal choice tasks involving money—'$50 now or $100 next month.' Is it fair to extrapolate those clean curves onto messy, emotional real-world cases like doomscrolling, addiction, or crash diets? Does the curve hold up when the reward isn't just delayed, but qualitatively different?"

  *   **Anticipated Dodge:** "The mechanism is domain-general; the brain processes delay the same way."
  *   **Follow-up:** "But in the lab, the reward is certain. In real life, the 'diet' reward is probabilistic and abstract. If the mechanism relies on certainty, aren't you conflating discounting with ambiguity aversion? Maybe we aren't discounting the future; maybe we just don't believe the future promise."

  ### 6. Rationality and Dynamic Inconsistency
  **Question:** "Economists usually call hyperbolic discounting 'dynamically inconsistent,' which is a polite way of saying irrational. But if this is a hardwired feature of how humans experience time, is it actually irrational? Or is it just a mismatch between our evolutionary design and modern environments? If it's evolutionary, why fight it?"

  *   **Anticipated Dodge:** "It's irrational because it makes you worse off by your own lights."
  *   **Follow-up:** "By *which* lights? The lights of the self at t1 or the self at t2? If every self is equally real, why does the long-term self get to veto the short-term self? Isn't that just ageism applied to time-slices?"

  ### 7. Phenomenology of Bargaining
  **Question:** "I want to ask about the felt experience. When I struggle with weakness of will, it feels like a conflict within a single 'I.' It doesn't feel like I'm negotiating with a stranger named 'Future Me.' Does your picoeconomics picture match the phenomenology of struggle, or does it require us to be mistaken about our own inner lives?"

  *   **Anticipated Dodge:** "Folk psychology is often wrong; the model explains the behavior better than the feeling."
  *   **Follow-up:** "But if the model contradicts the only data we have about what it *feels* like to have a will, haven't you explained away the phenomenon rather than explaining it? If I don't feel like a sequence of selves, in what sense is your model true?"

  ### 8. Responsibility and Blame
  **Question:** "If weakness of will is just a discount rate glitch, what happens to blame? If my 'Tuesday Self' binges because the discount curve spiked, should my 'Wednesday Self' feel guilt? Or is guilt just a punitive tool to adjust the discount rate for next time?"

  *   **Anticipated Dodge:** "Guilt is a negative reinforcement signal to alter future bargaining."
  *   **Follow-up:** "So guilt isn't about desert or morality; it's just behavioral conditioning. That means you're not actually doing philosophy of action; you're doing behaviorism with extra steps. Are you comfortable eliminating moral blame entirely?"

  ### 9. Welfare and Policy
  **Question:** "Finally, if we accept this model for policy—which many nudgers do—whose welfare are we maximizing? If I am a series of competing selves, and the 'Now Self' wants the cigarette but the 'Later Self' wants health, who is the citizen the government should protect? Is libertarian paternalism just tyranny of the future selves over the present ones?"

  *   **Anticipated Dodge:** "We maximize 'global' welfare across the whole timeline."
  *   **Follow-up:** "But 'global welfare' is an abstraction. Only the present self experiences pain or pleasure. If you suppress the present self's desire for the sake of a future self that doesn't exist yet, aren't you just sacrificing a real person for a hypothetical one?"
