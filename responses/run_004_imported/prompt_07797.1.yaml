      *   **Anti-Surrogate:** Let's call him *Marcus*. He needs to argue that credibility is the bottleneck. If you can't credibly commit to ignoring threats to your *real* values, you can't credibly commit to caring about *fake* values. He should focus on the regress problem or the "transparency" of the agent's source code.

  3.  **Key Arguments to Include:**
