answer: |-
  Here is the argument structured as a formal philosophical position, suitable for a quals essay or a rigorous seminar paper. It moves beyond the "Colyvan patch" to argue that bounded utility is a necessary condition for decision-theoretic coherence in an uncertain world.

  ***

  ### Title: The Price of Coherence: Why Bounded Utility is the Only Solution to the Contagion Problem

  **Thesis:** The Pasadena Game demonstrates that unbounded utility functions permit gambles with undefined expected values. While Colyvan suggests we simply exclude such gambles from the domain of rational choice, this fails due to the "Contagion Problem": any non-zero credence in a Pasadena-like structure renders *all* expected values undefined. Consequently, rational utility functions must be bounded. This is not an ad hoc restriction on the value of outcomes, but a derivable constraint on coherent preference orderings under epistemic uncertainty.

  #### 1. The Failure of Domain Restriction (The Contagion Argument)

  The standard reaction to the Pasadena Game (Nover & Hájek) is to treat it as a pathological edge case. Colyvan argues that we can maintain Expected Utility Theory (EUT) by simply acknowledging that the decision rule returns "no verdict" for gambles with undefined expectations. We cordon off the Pasadena game, declare it outside the domain of applicability, and proceed with mundane choices.

  This strategy collapses under the weight of epistemic humility. The Contagion Problem arises because empirical certainty is impossible. Let $G$ be a mundane gamble (e.g., "win \$10 if heads, lose \$5 if tails"). Let $P$ be a Pasadena-type gamble. Let $H$ be the hypothesis that the physical mechanism governing $G$ is actually governed by the payoff structure of $P$ (perhaps due to unknown physics, simulation hypotheses, or demonic interference).

  If an agent is rational, they cannot assign $Cr(H) = 0$. To do so would be dogmatic, violating the principle of regularity (that all logically possible states must have non-zero credence). If $Cr(H) = \epsilon > 0$, then the expected utility of $G$ becomes a weighted sum:
  $$ EU(G) = (1-\epsilon) \cdot EU(\text{Mundane}) + \epsilon \cdot EU(\text{Pasadena}) $$
  Since $EU(\text{Pasadena})$ is undefined (due to conditional convergence), and standard arithmetic dictates that $x + \text{undefined} = \text{undefined}$, the total $EU(G)$ is undefined.

  Because we can construct a Pasadena-like variant for *any* gamble by appending a low-probability tail with conditionally convergent payoffs, admitting *any* unbounded utility function allows contagion to spread to every decision an agent faces. Colyvan's "cordon off" strategy requires us to be certain we are not in a Pasadena world. Since we cannot be certain, the strategy paralyzes the entire decision theory. The only way to stop the contagion is to ensure the term $EU(\text{Pasadena})$ is never undefined in the first place.

  #### 2. The Positive Case: Boundedness as a Coherence Condition

  To block contagion, we must ensure that for any probability distribution over outcomes, the expected utility sum converges absolutely. This requires the utility function $U$ to be bounded.

  This should not be viewed as a "patch," but as a requirement of the Representation Theorems themselves. The von Neumann-Morgenstern (VNM) and Savage axioms are often cited as justifying EUT, but they implicitly demand boundedness when extended to infinite state spaces.
  1.  **Absolute Convergence:** If $U$ is bounded by some $M$ (i.e., $|U(o)| < M$ for all outcomes $o$), then for any probability distribution $p$, the expected utility sum $\sum p_i U(o_i)$ is bounded by $\sum p_i M = M$. By the comparison test, the series converges absolutely. Absolute convergence guarantees that the expectation is invariant under rearrangement, dissolving the Pasadena problem entirely.
  2.  **Dominance Preservation:** With unbounded utility, one can construct cases where Gamble A dominates Gamble B in every state of the world, yet $EU(A) < EU(B)$ (or $EU(A)$ is undefined while $EU(B)$ is defined). This violates a core intuition of rational choice: if you prefer A to B in every contingency, you should prefer A to B simpliciter. Bounded utility preserves the dominance principle by ensuring expectations track state-wise superiority.

  Therefore, adopting bounded utility is not "giving up" on EUT; it is the only way to *save* EUT from collapsing into indeterminacy under realistic conditions of uncertainty.

  #### 3. Addressing the "Arbitrary Cap" Objection

  The strongest objection to bounded utility is the intuition that it imposes an arbitrary ceiling on value. Critics argue: *"If utility is bounded, then saving 1 billion lives cannot be significantly better than saving 1 million lives once we approach the bound. This contradicts our moral and rational intuitions."*

  This objection rests on a category error between **outcomes** and **utility assignments**, and a misunderstanding of the mathematical structure of bounded functions.

  **A. Utility is Not Value, It is Preference Strength**
  Utility functions in decision theory do not measure the "moral worth" of the universe; they represent an agent's willingness to trade off risks. To say utility is bounded is not to say there is a maximum amount of "goodness" the universe can contain. It is to say that there is a limit to how much risk an agent can rationally take to achieve that goodness.
  If an agent claims they would accept *any* non-zero probability of a great outcome over a guaranteed finite good, they reveal preferences that violate the Continuity axiom. Bounded utility simply formalizes the intuition that at some point, a guaranteed finite good *should* be preferred to a vanishingly small chance at a "greater" good. If your intuitions say otherwise, your intuitions license the St. Petersburg and Pasadena paradoxes, leading to decision-theoretic paralysis.

  **B. Asymptotes, Not Cliffs**
  The objection assumes bounded utility looks like a "step function" or a hard cap (e.g., utility stops increasing after $10^{100}$ lives). This is false. A rational bounded utility function is asymptotic (e.g., $U(x) = 1 - e^{-x}$).
  In this model, saving 1 billion lives *is* strictly better than saving 1 million lives. The ordinal ranking is preserved. The difference is that the *marginal* utility diminishes sufficiently fast that the infinite sum never diverges. The "cap" is a limit that is approached but never reached. There is no point where "more is not better"; there is only a point where "more is not *infinitely* better in a way that breaks arithmetic."

  **C. The Cost of Unboundedness**
  Finally, we must weigh the cost of the objection.
  *   **Cost of Boundedness:** We must accept that the difference between saving $10^{100}$ lives and $10^{100} + 1$ lives is vanishingly small in terms of decision-weight.
  *   **Cost of Unboundedness:** We lose the ability to compare *any* options in a world where we have non-zero credence in weird physics (the Contagion Problem).

  If we insist on unbounded utility to preserve the intuition that "more is always linearly better," we render decision theory useless for any real-world agent who admits empirical uncertainty. The "arbitrary cap" is not a limitation on the good; it is a limitation on the *mathematical representability of preference* in a coherent system. We must choose between a utility function that matches our unchecked intuitions about infinity but yields no decisions, or one that yields decisions but requires asymptotic valuation. The latter is the only viable candidate for a theory of *choice*.

  #### Conclusion

  The Pasadena Game is not a curious anomaly; it is a reductio ad absurdum of unbounded utility in an uncertain world. Colyvan's attempt to isolate the paradox fails because epistemic uncertainty allows the paradox to infect mundane choices via the Contagion Problem. The only robust solution is to recognize that rational preference orderings over infinite lotteries require bounded utility functions. This does not arbitrarily limit the value of outcomes; rather, it ensures that an agent's valuation of those outcomes remains mathematically coherent. To demand unbounded utility is to demand a decision theory that cannot make decisions.
