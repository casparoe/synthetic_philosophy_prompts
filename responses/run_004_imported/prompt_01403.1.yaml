      *   *Why?* Because the constraint $P(H|R)=3/4$ makes the Red distribution "further" from the uniform Red prior (1/2, 1/2) than the Blue distribution is from the uniform Blue prior (1/2, 1/2). To minimize total divergence, we shift mass to Blue, which is "closer" to its prior state.
      *   *Crucial Point:* The cost of satisfying the constraint is higher for Red mass than for Blue mass. So we buy less Red mass.
      *   *Make sure to emphasize this "Cost" argument.* It's the strongest intuitive hook for the MinXent side.

