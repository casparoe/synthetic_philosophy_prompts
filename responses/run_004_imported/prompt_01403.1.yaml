      *   **The "Expert" Interpretation:** If HQ knows where Judy is, and they give conditional odds, does that imply something about the likelihood of the message being sent? (This is the "reliability" angle, but JBP usually assumes the constraint is hard).
      *   **The "Constraint" Interpretation:** The constraint $P(H|R)=3/4$ is a constraint on the *posterior*. We are looking for the posterior closest to the prior.
