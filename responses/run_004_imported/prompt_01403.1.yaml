      *   **Information Content:** The evidence rules out certain distributions. The prior distribution (1/4 each) is no longer valid. We need the *closest* valid distribution. "Closest" in information geometry means preserving ratios where not constrained.
      *   **The "Silence" Argument:** The evidence is silent on Blue. But silence isn't neutrality. If I learn the *structure* of Red is more concentrated (3:1 vs 1:1), Red becomes "smaller" in terms of effective support or surprisal.
