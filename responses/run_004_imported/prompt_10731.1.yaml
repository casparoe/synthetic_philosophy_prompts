  2.  **Understand the Centipede Game & Backward Induction:**
      *   **Structure:** Two players take turns. At each node, a player can "Take" (end game, get slightly more than opponent) or "Pass" (grow the pot, give opponent the chance to Take later).
      *   **Backward Induction (BI) Solution:** Start at the last node. Player 2 will Take (because Take > Pass). Knowing this, Player 1 at the second-to-last node will Take (because Take > Pass leading to P2 Taking). Unraveling all the way back, Player 1 should Take at the very first node.
      *   **The Paradox:** If both players follow BI, they get a tiny payoff immediately. If they cooperate (Pass) for most of the game, they get huge payoffs. Real people usually Pass for a while.
      *   **The Twist/Deep Cut:** If Player 1 *doesn't* Take at the first node (contrary to BI), Player 2 now knows Player 1 is *not* perfectly rational (or doesn't believe P2 is rational). This breaks the "Common Knowledge of Rationality" assumption required for BI. So, P2 might now expect P1 to Pass again, making it rational for P2 to Pass too. The BI argument self-destructs once the first move is made against it.

