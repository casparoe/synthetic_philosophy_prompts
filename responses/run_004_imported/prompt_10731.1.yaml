answer: |-
  Two game theorists, Alice and Bob, are debriefing after a Centipede game tournament.

  Alice says, "I took at the first node. Strict backward induction. Subgame perfect."

  Bob replies, "I was going to pass all the way to node ten. We could have made $100 each."

  Alice scoffs, "But that's irrational! At the last node, you'd take. So I'd take at the second-to-last. Unraveling back, I had to take now."

  "True," says Bob, "but that unraveling relies on *common knowledge of rationality*. The moment you pass even once, you break that knowledge. Once I think there's a non-zero chance you're irrational, it becomes rational for me to pass too. The whole backward induction chain snaps the moment anyone deviates."

  Alice pauses. "So… by taking at node one, I proved I was rational?"

  "You proved you were rational enough to lose," Bob says. "To get the big payoff, you needed me to think you *might* be crazy. But you were too certain of my rationality to let me doubt yours."

  "So certainty cost us the money?"

  "No," Bob says. "Backward induction is a self-defeating prophecy. It tells you to take because the game *won't* reach the end. But if you take at the start, you ensure it doesn't. You validated the proof by destroying the payoff."

  Alice sighs. "So what's the equilibrium?"

  Bob smiles. "Basically, you were too rational to realize that in this game, perfect rationality is a dominated strategy. You solved the game so hard you unsolved the profit."
