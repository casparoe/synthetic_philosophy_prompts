answer: |-
  You have hit on exactly the right intuition clash. Your engineering brain is screaming "this is overfitting!" or "this is data leakage!" while the philosophy brain is saying "this is rational precommitment!"

  Your coworker was technically right ("that's kind of the point"), but they failed to explain *why* ignoring evidence is the feature, not the bug, in this specific context.

  Here is the bridge between your fraud-detection intuition and the LessWrong rabbit hole.

  ### 1. It's not "ignoring evidence," it's "optimizing source code"

  In your fraud-detection job, you distinguish between **inference** (running the model) and **training** (updating the weights).
  *   **Standard Decision Theory (CDT/Evidential):** Acts like it's doing *inference* at every step. "Given what I know *right now*, what maximizes utility?"
  *   **Updateless Decision Theory (UDT):** Acts like it's doing *training* once, and then running the frozen model forever. "What *policy* (function mapping inputs to outputs) would I have wanted to write *before* I knew anything, such that it maximizes utility across all possible inputs?"

  In Counterfactual Mugging:
  *   **The Evidence:** "The coin is Heads."
  *   **CDT Agent:** Updates its policy. "Okay, since it's Heads, the Tails branch is impossible. Paying costs $100 and gains nothing. I keep the money."
  *   **UDT Agent:** Refuses to update the *policy*, though it acknowledges the evidence. It says: "I know the coin is Heads. But I am an instance of a policy. Omega selected me based on what my policy *would do* in the Heads case. If my policy says 'Don't Pay' when it sees Heads, I don't get the $10k in the Tails branch. Since I care about the expected value of my policy *before* the coin flip, I must Pay."

  So, UDT isn't ignoring the fact that the coin is Heads. It's ignoring the fact that *knowing* the coin is Heads should change its decision rule. It treats "You" not as a momentary agent, but as a timeless algorithm.

  ### 2. Why your Fraud Analogy doesn't quite fit

  Your intuition is: *If I don't update on new data, my model becomes stale and loses money.*

  This is true in an environment where the data is **external** to your decision process. In fraud detection, the fraudsters (mostly) don't simulate your model's source code to decide whether to attempt fraud. They react to outcomes, not your counterfactual logic.

  Counterfactual Mugging and Newcomb's Problem describe environments where the "data" (Omega's prediction) is **logically dependent** on your decision algorithm.

  **A better engineering analogy: API Contracts or Smart Contracts.**
  Imagine you deploy a smart contract on a blockchain.
  *   **Scenario:** Users will send you transactions. If they send Type A, you owe them $100. If they send Type B, you owe them $10,000.
  *   **Condition:** Users will only send Type B transactions if the *code* of the contract guarantees it will pay out on Type A.
  *   **The "Update":** Once a Type A transaction arrives, a "CDT Contract" might try to rewrite its own code to say `if Type A: return 0`.
  *   **The Result:** No one ever sends Type B transactions, because they checked the code beforehand and saw it was exploitable.

  In this context, "refusing to update" isn't staleness; it's **credibility**. UDT is essentially a mathematical formalization of "keeping your promises even when it hurts in the moment, because breaking them destroys your ability to make deals in the future (or in counterfactual futures)."

  ### 3. Why AI Safety cares about this

  You might ask: *Okay, but humans can precommit. Why do we need a whole decision theory for AI?*

  **1. Self-Modification:**
  An AI is software. If an AI uses CDT, it will eventually realize: "Hey, using CDT makes me lose money in Newcomb-like scenarios. I should modify my own source code to act like a UDT agent."
  Since a sufficiently advanced AI *will* self-modify to become updateless eventually, AI safety researchers argue we should just build it that way from the start to avoid unpredictable self-modification behavior.

  **2. Acausal Trade:**
  This is the deep rabbit hole. If there are other superintelligent AIs in the universe (or in other branches of the multiverse), you can't communicate with them. But you can *simulate* them.
  *   AI Alpha thinks: "If I cooperate with AI Beta, and Beta is similar to me, Beta will also cooperate."
  *   This only works if both AIs run a decision theory that respects logical correlation (UDT or its successor, Functional Decision Theory). If they use CDT, they both defect, because "My decision can't causally affect *that* AI over there."
  *   UDT allows agents to "cooperate" with copies of themselves or similar agents without communication, purely based on shared source code logic.

  ### 4. The Catch (You aren't crazy)

  Your intuition that "ignoring evidence is bad" is actually shared by many philosophers and researchers. UDT is controversial even within LessWrong.

  *   **The "Prior" Problem:** To be updateless, you need a "prior" (a belief state before you know anything). But how do you define a prior over *everything*, including mathematical truths? If you get math wrong in your prior, you're locked into being wrong forever because you refuse to update.
  *   **Logical Uncertainty:** If you don't update on logical facts (like "2+2=4"), you might make absurd decisions. But if you *do* update on logical facts, you start looking like CDT again. Balancing this is the core technical challenge of UDT.
  *   **Successor Theories:** Because of these issues, Wei Dai and others (like Eliezer Yudkowsky and Nate Soares) later developed **Functional Decision Theory (FDT)**. It keeps the spirit of UDT (optimizing over policies rather than actions) but tries to handle the "updating" part more gracefully.

  ### Summary

  Your coworker was right, but cryptic.
  *   **In Engineering:** Updating is good because the environment is external and dynamic.
  *   **In Decision Theory:** Updating is "bad" (in specific games) because your decision *defines* the environment's response to you.

  UDT isn't about building a model that ignores data. It's about building an agent that **optimizes the trajectory of its entire existence** rather than optimizing for the immediate time-step. It treats "You" as a 4-dimensional object (a policy across time) rather than a 3-dimensional slice (an agent at time *t*).

  It feels like a bug because our brains are wired for causal, time-local reasoning. But for an AI that might face simulations, predictions, and logical correlations, "updatelessness" is the mathematical equivalent of "having integrity."

  (Welcome to the rabbit hole. It gets weirder. Look up "Timeless Decision Theory" and "Acausal Trade" when you're ready to lose more sleep.)
