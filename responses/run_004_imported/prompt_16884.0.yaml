  9.  *(Self-Correction on the Rawls/Harsanyi specific)*: Harsanyi's specific argument is the "Principle of Insufficient Reason." He argues that if you don't know the probabilities, you should assume equiprobability. The SPI critique would be: "Why assume equiprobability? In negotiation, priors are subjective." This strengthens the disanalogy section.

