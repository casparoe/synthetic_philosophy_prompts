answer: |-
  Your friend is wrong, and your intuition is actually much more mathematically sound than theirs. You are not being contradictory at all; you are intuitively understanding how **probability compounds.**

  Here is the breakdown of why your thinking makes perfect sense and why your friend's logic fails.

  ### 1. The Math of "And"
  In probability, when you want to know the chance of multiple independent events *all* happening (getting Q1 right **AND** Q2 right **AND** Q3 right... all the way to Q100), you have to **multiply** the probabilities, not average them.

  Let's look at your numbers:
  *   **Your confidence per question:** 95% (or 0.95 probability).
  *   **The risk per question:** 5% (or 0.05 probability of being wrong).

  To get a 100% on the test, you need to be right 100 times in a row. The math looks like this:
  $$0.95 \times 0.95 \times 0.95 \dots \text{(100 times)}$$
  Or simply:
  $$0.95^{100} \approx 0.0059$$

  That is roughly **0.6%**.

  So, if you are 95% confident on every single question, the statistical likelihood of you getting a perfect score is less than 1%. Conversely, there is a **99.4% chance you missed at least one question.**

  Even if you were **99%** confident on every single question:
  $$0.99^{100} \approx 0.366$$
  You'd still only have a 37% chance of a perfect score.

  ### 2. The "Expected Value"
  Another way to look at it is through "expected value." If you have a 5% chance of being wrong on a question, and there are 100 questions, you should statistically **expect** to get 5 questions wrong ($100 \times 0.05 = 5$).

  Therefore, feeling confident about individual answers but expecting to lose points on the total test is the **most rational position possible.** Expecting a perfect score would actually be the irrational leap.

  ### 3. Why Your Friend Is Confused
  Your friend is falling for a common cognitive bias. They are treating confidence as if it is a **static property** that transfers from the part to the whole. They think: *"If I am sure about the bricks, I must be sure about the wall."*

  But in systems (like a test, a chain, or a machine), risk **accumulates**.
  *   **The Chain Analogy:** Imagine a chain with 100 links. You inspect each link and are 95% sure it won't break. Are you 95% sure the *whole chain* won't break? No. Because if *any single link* breaks, the chain fails. The more links you add, the weaker the chain becomes relative to perfection, even if the links are strong.
  *   **The Dice Analogy:** If you roll a 20-sided die, you are 95% confident you won't roll a "1". But if you roll that die 100 times, are you confident you'll never roll a "1"? No, it's almost guaranteed you'll roll at least one "1".

  ### 4. Real-World Examples
  *   **Air Travel:** You might be 99.99% confident a specific flight will land safely. But if an airline runs 10,000 flights, they know statistically that accidents *will* happen eventually.
  *   **Manufacturing:** A factory might make parts that are 99% perfect. But if a car requires 1,000 of those parts to function, the car will almost certainly have a defect.

  ### The Verdict
  You are being rational. Your friend is confusing **confidence in a single event** with **confidence in a conjunction of events.**

  *   **High confidence per question** = You studied well and know the material.
  *   **Low confidence in a perfect score** = You understand that human error and probability exist over a large sample size.

  You can (and should) hold both beliefs simultaneously. Tell your friend to go calculate $0.95^{100}$ and get back to you!
