answer: |-
  The cursor blinked on the screen, a rhythmic, present-tense pulse in a dark room. Elara had been staring at the same sentence for three hours.

  *We gather here to honor a life that…*

  She deleted *that*. She typed *which*. She deleted *which*.

  Outside, the rain blurred the lights of Zurich into streaks of neon sodium. It was the same city where Einstein had walked, where he had penned the letter to the Besso family. *For us believing physicists, the distinction between past, present, and future is only a stubbornly persistent illusion.*

  Julian had loved that quote. He'd put it on his thesis dedication page. Now, it was the lock on her throat.

  Elara was a cosmologist, tasked with giving the keynote at the Temporal Mechanics Symposium next week. The irony was not lost on the committee, nor on her. *The Architecture of Now*, her talk was titled. She was supposed to present new data on cosmic inflation, on the stretching of spacetime. But the data felt like ash.

  If Eternalism was true—if the Block Universe was the ontological reality—then Julian was not dead. He was simply located at a different coordinate in the four-dimensional manifold. His birth, his laughter in the library, his diagnosis, his last breath, and this moment of her grief all existed simultaneously, etched into the geometry of the universe like fossils in amber.

  In that view, her grief was a solipsistic error. She was mourning a location she could no longer access. It was like weeping because she was in Zurich and Julian was in London. The loss wasn't real; the separation was merely perspectival. To cry was to misunderstand the shape of the universe.

  She stood up and walked to the bookshelf. She pulled down Julian's copy of *The Meaning of Relativity*. A coffee stain marked page 51.

  *But if Presentism is true,* she thought, pacing the floor, *then only this moment exists.*

  If only the "now" is real, then the Julian who wrote notes in this margin is ontologically void. He has ceased to be. The past is not a place; it is a fiction generated by memory traces in the present. If Presentism holds, then the truth of "Julian existed" relies entirely on the fragile, firing neurons in Elara's brain. If she forgets, or if she dies, the truth value of his life drops to zero.

  In that view, her grief was a haunting. She was mourning a ghost that had no substance, clinging to a truth that the universe actively deleted every nanosecond.

  She sat back down. The cursor blinked. *We gather here to honor…*

  If she wrote the speech from the Block perspective, she would sound cold, detached, a scientist observing a fixed variable. It would betray the warmth of their friendship.
  If she wrote from the Presentist perspective, she would sound delusional, speaking of a man who, strictly speaking, was nothing.

  The metaphysics wasn't decorating her grief; it was strangling it. She needed to know if her pain was tracking something *real*.

  She opened her simulation software. She didn't have a time machine, but she had a model of the local causal cone. She inputted the parameters of their friendship. Ten years. Two universities. Three countries. Thousands of interactions.

  She ran the simulation in "Block Mode."
  The visualization rendered a static tube through spacetime. There was Julian, a world-line stretching from 1995 to 2023. It was complete. Unchanging.
  Elara stared at the digital ghost. "You're still there," she whispered to the screen.
  The model offered no response. It was a map, not a territory. In the Block, there is no *happening*. There is only *being*. If Julian simply *is*, then he never *was*. And if he never *was*, then the dynamic quality of their friendship—the surprises, the arguments, the growth—was an illusion. The Block Universe killed the narrative of his life just as surely as death did. It turned a story into a statue.

  She switched the parameter to "Present Mode."
  The world-line evaporated. Only the current coordinate remained. A single point of light.
  "Where did you go?" she asked.
  The screen was blank. In this model, the past had no weight. It exerted no gravity. But Elara felt the gravity. She felt the pull of ten years dragging on her chest. If the past wasn't real, why did it hurt?

  She slammed her hand on the desk. The coffee mug jumped.
  The vibration traveled through the wood, into her arm. A causal chain.
  *Cause and effect.*

  She froze.

  The dilemma assumed that for something to be real, it had to exist *ontologically* in the present, or exist *permanently* in the block. But physics had a third language: Causality.

  In the Block, causes don't *produce* effects; they just sit next to them.
  In Presentism, causes vanish before effects arrive.

  But what if the "illusion" Einstein spoke of wasn't a mistake to be corrected, but a mechanism to be respected?

  Elara looked at her hand. The nerves were still firing from the impact. The sound of the slap was ringing in her ears, decaying. The event was slipping from the present into the past, but the *consequence* remained.

  Her grief was not a measurement of Julian's ontological status. It was a measurement of his causal impact.

  If Eternalism were the whole truth, she would feel peace, knowing he was safe in the block. She did not.
  If Presentism were the whole truth, she would feel nothing, knowing he was erased. She did not.

  The pain was the data point. The pain proved that the transition from past to present was not seamless. There was friction.

  She began to type, not the speech she had planned, but a confession.

  *We define time by entropy,* she wrote. *By the breaking of the egg. By the cooling of the star. We are taught that the flow of time is a cognitive limitation, a stubborn illusion that prevents us from seeing the universe as it truly is: a static, perfect whole.*

  She paused. She thought of Julian's funeral. The rain. The way the priest's voice had cracked. That crack was not in the Block. The Block does not crack. The crack was in the *passing*.

  *But an illusion is not a lie,* she typed. *An illusion is an interface.*

  She realized then that trying to resolve the metaphysics was an attempt to escape the human condition. She wanted to be a god who could see the whole block, or a solipsist who only needed the now. She was neither. She was an observer trapped in the flow, and the flow was where the relationship lived.

  If the past is real, Julian is frozen.
  If the past is gone, Julian is erased.
  But if the past is *active*—if it exerts force on the present without existing in it—then he is neither frozen nor erased. He is a cause that is still working.

  Elara deleted the title *The Architecture of Now*.
  She typed: *The Inertia of Absence.*

  *My colleague, Julian, taught me that the distinction between past and present is persistent,* she wrote. *He did not teach me that it is an illusion to be dismissed. The distinction is the space where love lives. Love requires a subject and an object. It requires a 'here' and a 'there'. If we are all in the Block together, there is no distance to bridge. There is no longing. Longing is the proof that the present is not the whole story, but also that the past is not a place we can visit.*

  She felt a tear hit the keyboard. It was a physical event. A new coordinate in the block, a new present moment.

  The metaphysics didn't need to be solved. It needed to be inhabited.

  The comfort of the Einstein quote was not that Julian was still alive in the fourth dimension. The comfort was that the "illusion" of time was the only thing that allowed her to miss him. If time weren't passing, she couldn't grieve. If the past weren't real, she'd have nothing to grieve *for*.

  The grief was the intersection. It was the only place where the Block and the Present touched.

  *We do not honor him by pretending he is still here,* she wrote, her fingers moving faster now, the logic unlocking the emotion. *And we do not honor him by pretending he never was. We honor him by acknowledging the weight of the space he left behind. The universe expands. The distance between us grows. That expansion is real. The resistance I feel against it is real.*

  She leaned back. The room was quiet. The rain had stopped.
  The cursor blinked. It was no longer a pulse of anxiety. It was a metronome.

  She didn't know if the past existed. She didn't know if the future was written. But she knew that the sentence she had just written would exist in the next moment, and the next, carried forward by the causal chain she had initiated.

  Julian was gone from the present. He was fixed in the past. But the *change* he wrought in her—the alteration of her trajectory—was the only reality that mattered.

  Elara saved the document. She stood up and walked to the window. The city lights were sharp again. She placed her hand against the cold glass.

  "Stubbornly persistent," she said aloud.

  It wasn't a dismissal. It was a description of a force. Like gravity. Like love.

  She would give the talk. She would tell them that the illusion was the only thing that made the loss true. And for the first time in a month, the truth of the loss didn't paralyze her. It moved her. She turned away from the window, picked up her bag, and walked out into the night, carrying the weight of him into the future, one stubborn second at a time.
