          *   If you know $p$, then $p$ is known ($Kp$).
          *   But the proposition says $p$ is not known ($\neg Kp$).
          *   Contradiction: $Kp \land \neg Kp$.
          *   Therefore, the proposition ($p \land \neg Kp$) cannot be known.
          *   If the Knowability Principle holds ($p \rightarrow \Diamond Kp$), then ($p \land \neg Kp$) must be knowable if it's true.
          *   Since it *can't* be known, it *can't* be true.
          *   Therefore, there are no truths of the form "$p$ is true and unknown."
          *   Therefore, all truths are known (Omniscience).
      *   **The Conclusion:** Since we know we aren't omniscient (Premise 2), the Knowability Principle (Premise 1) must be false.
      *   **Result:** There exists at least one truth that is *not* knowable.
      *   **Crucial Limitation:** The logic proves the *existence* of an unknowable truth, but it is completely silent on *which* truth it is. It is a non-constructive proof.

