  2.  **Deconstruct Fitch's Paradox (The Logic):**
      *   **Premise 1 (Knowability Principle):** $\forall p (p \rightarrow \Diamond Kp)$ (If $p$ is true, it is possible to know $p$).
      *   **Premise 2 (Non-Omniscience):** $\exists p (p \land \neg Kp)$ (There is some truth $p$ that is not currently known).
      *   **The Derivation:**
