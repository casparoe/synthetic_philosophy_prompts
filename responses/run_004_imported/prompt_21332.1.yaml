      *   *Egan's specific point:* Egan argues that sometimes the ratifiable act is clearly wrong. In "Death in Damascus," the ratifiable mix is often accepted as the "least bad" option, but Egan has cases where ratifiability leads to disaster. I should mention that the "Death in Damascus" case specifically is often seen as a *tie*, whereas Egan's cases break the tie wrongly.
