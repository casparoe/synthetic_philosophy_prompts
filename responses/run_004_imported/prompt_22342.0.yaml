      *   **Tone:** Needs to be peer-level (PhD to PhD), rigorous but accessible, acknowledging the difficulty of the text without talking down. "Over beers" level understanding of the big picture, but needs "seminar ready" technical precision.

  2.  **Deconstruct the Hume Text:**
      *   *Main Argument (T 3.2.5.3):* Hume eliminates candidate mental acts for what constitutes a promise.
          *   Not a resolution (doesn't create obligation).
          *   Not a desire (can promise without desire).
          *   Not willing the action (will only affects present, promise is future).
