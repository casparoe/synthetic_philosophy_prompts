answer: |-
  This is a classic sticking point. You are definitely not alone in hitting a wall here; this footnote (often appended to T 3.2.5.4 in the Norton/Selby-Bigge editions) is one of the densest bits of meta-ethics in the *Treatise*. It's Hume playing chess on three boards at once: psychology, metaphysics, and dialectic.

  Since you're prepping for seminar, I'll skip the "Hume 101" stuff and go straight for the reconstructive surgery on that regress, then tackle the dialectical role and the contemporary status.

  ### 1. Decoding the Regress: Intentionality vs. Constitution

  The core confusion usually stems from what Hume thinks a "volition" (act of will) requires in order to function. For Hume (and most early moderns), the will is an intentional faculty: **to will is always to will *something*.** You cannot have a volition without an object.

  Here is the step-by-step reconstruction of the footnote's logic, assuming the Rationalist premise (that morality consists in relations discoverable by reason):

  1.  **The Rationalist Premise:** Moral obligation ($O$) consists in a relation ($R$) between objects/agents.
  2.  **The Promise Claim:** A promise creates a *new* obligation ($O_{new}$) purely by an act of will ($V$), without changing any physical facts or objects.
  3.  **The Implication:** Therefore, $V$ must create a new relation ($R_{new}$).
  4.  **The Intentionality Constraint:** For $V$ to occur, it must have an object. What is the object of $V$? It is $O_{new}$ (or $R_{new}$), because that is what the agent is trying to bring about.
  5.  **The Problem:**
      *   For $V$ to target $O_{new}$, $O_{new}$ must be intelligible/existent *as an object* for the will.
      *   But $O_{new}$ only comes into existence *because* of $V$.
      *   So, $O_{new}$ depends on $V$ (ontologically), but $V$ depends on $O_{new}$ (intentionally).
  6.  **The Regress:**
      *   Hume says: "To will a new obligation, is to will a new relation."
      *   If the relation is formed *by* the volition, then the volition is effectively willing *its own causal efficacy*.
      *   "We shou'd in effect will the volition."
      *   Why? Because the object of the will ($R_{new}$) is identical to the *product* of the will ($V$).
      *   If I will $X$, and $X$ is "the relation created by this willing," then I am willing "the relation created by [the willing of the relation created by...]"
      *   Hume writes: "The new volition has for object a new obligation... and consequently a new volition."
      *   **The Loop:** $V_1$ aims at $O_1$. But $O_1$ is constituted by $V_1$. So $V_1$ aims at $V_1$. To aim at $V_1$, you need a higher-order volition $V_2$ that takes $V_1$ as its object. But $V_2$ also needs an object... *in infinitum*.

  **Why is this vicious and not just a stable circle?**
  You asked if it could be a "weird but stable circle." The problem is **priority**. A stable circle implies two things co-existing and supporting each other (like supply and demand). But here, we are talking about *genesis*. We are trying to explain how the obligation *starts*.
  *   To start the process, the Will must act.
  *   To act, the Will must have an object.
  *   The object (the obligation/relation) does not exist until the Will acts.
  *   Therefore, the Will cannot act, because it has no object to latch onto *prior* to the act.
  It's not a circle; it's a "before the beginning" problem. The obligation is never pinned down because the act required to pin it down presupposes the very thing it's trying to create.

  ### 2. Is the Footnote Doing Independent Work?

  You asked if this is just the sentiment argument translated for rationalists. The short answer is **yes, but it's a strategic "kill shot."**

  Hume's own view is that morality is based on sentiment. In the main text (T 3.2.5.4), he argues that you cannot simply *will* a new sentiment into existence (just as you can't will yourself to love someone you hate). That argument is sufficient for *his* system.

  However, Hume is writing the *Treatise* to dismantle the Rationalist moral theory (Clarke, Wollaston, etc.) that was dominant at the time. If he only used the sentiment argument, a Rationalist could say: "Fine, Hume, promises don't create *sentiments*, but they create *rational relations*."

  The footnote is an *ad hominem* in the technical sense: it accepts the opponent's premises (Morality = Relations discoverable by Reason) and shows that **even on those terms**, the natural obligation of promises is impossible.
  *   **Main Text:** Shows promises fail on Sentimentalist grounds.
  *   **Footnote:** Shows promises fail on Rationalist grounds.

  By closing both doors, Hume forces the reader to accept his only remaining option: **Convention.** If promises create neither natural sentiments nor rational relations, they must create artificial rules grounded in social utility. So, while it doesn't add a *new* conclusion, it blocks the most obvious escape route for his contemporaries. It ensures that "Artificial Virtue" isn't just Plan B for Humeans, but the *only* plan for anyone.

  ### 3. Contemporary Status: Curiosity or Live Option?

  Is Hume's conventionalism still taken seriously? **Absolutely, but it has evolved.** It is definitely not a historical curiosity.

  **Where Hume Wins (The Practice Conception):**
  Hume is the grandfather of the "Practice Conception" of promising. This view holds that the obligation to keep a promise doesn't come from the individual act of will itself, but from the existence of a social practice (the convention) that makes the act meaningful.
  *   **John Rawls** ("Two Concepts of Rules") explicitly revives this Humean line to argue that you can't justify a specific promise by utility directly; you justify the *practice* of promising by utility, and the practice binds the individual.
  *   **David Lewis** (*Convention*) formalizes Hume's insight using game theory. Promises are coordination equilibria sustained by common knowledge and mutual expectation.
  *   **John Searle** (Speech Act Theory) owes a debt to Hume here: the "illocutionary force" of a promise depends on constitutive rules, not just psychology.

  **Where Hume Loses (The Normative Gap):**
  The main criticism today (from folks like **T.M. Scanlon** in *What We Owe to Each Other*) is that Humean conventionalism can't explain the *normative force* of promises, only the *social expectation*.
  *   Scanlon argues that even without a social convention, there is a principle of fidelity: if I lead you to expect I will do $X$, and you rely on that, I owe it to *you* (not society) to do $X$.
  *   Critics argue Hume reduces the obligation to "it's useful for society that I do this," which feels like it misses the interpersonal wrong done to the *promisee* specifically.
  *   Also, modern contract law and deontology often treat the "act of will" (autonomy) as having more intrinsic weight than Hume allows.

  **Seminar Strategy:**
  If you want to shine on Thursday, position Hume not as someone who "denies promises bind," but as someone who **relocates the source of the binding**.
  *   **Traditional View:** The binding force is in the *moment of promising* (the will).
  *   **Hume's View:** The binding force is in the *moment of breaking* (the social utility of maintaining the convention).

  You can say: "Hume's regress argument shows that the 'moment of promising' is normatively empty without the background convention. The obligation isn't created *ex nihilo* by the will; it's triggered by the will within a pre-existing normative structure."

  That distinction (Creation vs. Trigger) usually satisfies seminar leaders looking for precision. Good luck on Thursday. You've got this.
