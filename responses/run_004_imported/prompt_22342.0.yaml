      *   *The Problem:* How can you will an obligation into existence just by willing it?
      *   *The Footnote Argument (Rationalist Objection):*
          *   Premise 1: Morality consists in relations (Rationalist view).
          *   Premise 2: New morality requires new relations.
          *   Premise 3: Will cannot change relations immediately, only by changing objects.
          *   Premise 4: Promise obligation is supposed to be created *purely* by will without changing objects.
          *   *Objection:* Maybe the act of will *is* the new object/relation?
          *   *Hume's Rebuttal (The Regress):*
              *   To will a new obligation = to will a new relation.
              *   If the volition creates the relation, the volition must have that relation as its object.
              *   But the relation *is* the obligation.
              *   So the volition wills the obligation.
              *   But the obligation *depends* on the relation.
              *   And the relation *depends* on the volition.
              *   So: Volition -> Relation/Obligation -> Volition -> Relation/Obligation...
              *   Hume claims this is "return upon itself in infinitum."

  3.  **Address the Specific Confusion (The Regress):**
      *   *Why is it vicious?* It's not just a circle; it's a *grounding* failure. To create $X$, I need to perform Act $A$. But Act $A$ is only defined/intelligible as "the act that creates $X$." So I can't perform $A$ until $X$ exists, but $X$ doesn't exist until I perform $A$.
      *   *Step-by-Step Reconstruction:*
          1.  Rationalist says: Obligation ($O_1$) is a relation ($R_1$).
          2.  To create $O_1$, I must will $R_1$.
          3.  But a volition ($V_1$) needs an object. Its object is $O_1$ (or $R_1$).
          4.  But $O_1$ doesn't exist yet (that's what we are trying to create).
          5.  So $V_1$ is willing something non-existent.
          6.  If we say $V_1$ *creates* $O_1$, then $O_1$ depends on $V_1$.
          7.  But $V_1$ is defined by its object $O_1$.
          8.  So $V_1$ depends on $O_1$ (intentionally) and $O_1$ depends on $V_1$ (ontologically).
          9.  Hume pushes this: To will $O_1$, I need a volition $V_1$. But $V_1$ aims at $O_1$. If $O_1$ is constituted by $V_1$, then $V_1$ aims at itself (effectively).
          10. Hume's phrasing: "The new volition has for object a new obligation... and consequently a new volition."
          11. *Crucial nuance:* Hume treats the "obligation" as something that must be *recognized* by reason (for the rationalist). If reason sees the obligation, it sees a relation. If the relation is created by the will, the will must will that relation. But to will that relation, there must be a prior relation to will...
      *   *Better explanation:* It's a *priority* problem. The obligation must exist to be willed, but it only exists because it is willed.
