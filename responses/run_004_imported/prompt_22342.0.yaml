      *   *Section 3: Dialectical Role.* Is it independent? It's an *ad hominem* against Rationalists (in the 18th-century sense). It clears the field so Conventionalism is the only option left.
      *   *Section 4: Contemporary Relevance.* Connect to Lewis (Convention), Rawls (Practice Conception), and Scanlon (Principle of Fidelity). Hume is the grandfather of the "practice view," which is still live, though contested.
      *   *Tone Check:* Keep it collegial. "Here's how I read it," "The tricky bit is," etc.

  7.  **Refining the Regress Explanation (Self-Correction during drafting):**
      *   *Wait, let me look closer at the text:* "To will a new obligation, is to will a new relation of objects; and therefore, if this new relation of objects were form'd by the volition itself, we shou'd in effect will the volition."
