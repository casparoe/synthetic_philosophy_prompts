      *   *The Paradox:* If Player 1 defects at node 1, they assume Player 2 *would* defect at node 2. But if Player 1 *doesn't* defect at node 1, Player 2 observes a move that BI says is impossible. This creates a belief revision problem (the "off-equilibrium path" problem).

  3.  **Deconstruct the Empirical Claim:**
