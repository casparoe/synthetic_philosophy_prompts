  **Justifications:**

  *   **Move 1 (Maya): 2.** This is a precise, standard formulation of illusionism (specifically Frankish's version). It correctly identifies the core claim: that phenomenal properties are introspective misrepresentations of functional states, not ontological additions.
  *   **Move 2 (Theo): 2.** This is the strongest and most common objection to illusionism (often termed the "Hard Problem of Illusionism"). Theo correctly identifies that an illusion is itself a conscious experience; explaining the *content* of the illusion doesn't explain the *presence* of the seeming.
  *   **Move 3 (Maya): 1.** The Müller-Lyer analogy is the standard defense (used by Frankish), but it is contentious. While it shows how misrepresentation works in perception, critics argue visual illusions still possess phenomenal character, making the analogy question-begging regarding the "feel" itself.
  *   **Move 4 (Theo): 2.** Theo effectively exploits the disanalogy. He highlights the gap between *access consciousness* (reporting/processing) and *phenomenal consciousness* (what it's like). The thermostat analogy successfully illustrates that functional representation can occur without subjective feeling.
  *   **Move 5 (Maya): 0.** This is a stipulative definition that halts the dialectic rather than resolving it. By defining "felt" as "globally accessible," Maya denies the distinction Theo is relying on. While internally consistent with illusionism, it begs the question against a realist who insists there is a residual "what-it-is-like" beyond access.

  **What Both Are Missing:**

  1.  **The Mechanism of the Illusion:** Neither specifies *how* the brain generates the false belief in qualia. Frankish argues for a "quoting" mechanism where non-conceptual sensory states are misclassified as conceptual phenomenal properties. Without detailing the cognitive architecture of the error, Maya's claim remains abstract.
  2.  **The Evolutionary Rationale:** They miss the adaptive argument. If qualia are an illusion, why did evolution select for a system that misrepresents its own states? Illusionists argue the "user interface" simplifies complex data for control, but this needs explicit articulation to explain why the illusion is robust.
  3.  **Conceptual Ambiguity:** They are talking past each other on the word "consciousness." Maya is operating with a functional/access concept; Theo is operating with a phenomenal concept. Until they acknowledge they are defining the target differently, Move 5 will always feel like a dodge to Theo and Move 4 will always feel like a category error to Maya.
