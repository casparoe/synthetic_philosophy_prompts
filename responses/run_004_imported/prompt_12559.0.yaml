answer: |-
  **MEMORANDUM**

  **TO:** Judicial Council Committee on Jury Instructions
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal to Amend Model Instructions Regarding Hedonic Damages in Survival Actions

  **I. Purpose and Recommendation**

  The Committee is currently considering whether to amend our model jury instructions for survival actions to permit a distinct category of damages for the decedent's "loss of life" or "hedonic" damages. This category would compensate the estate for the future life the decedent was deprived of by death, separate from pre-death pain and suffering, and separate from the survivors' own losses (such as loss of consortium or financial support).

  Judge [Name]'s recent memo eloquently argues against this addition, relying on the Epicurean view that death cannot be a harm to the decedent because the decedent no longer exists to experience the loss. While I share Judge [Name]'s concern that jury instructions must remain grounded in intelligible legal principles rather than metaphysical speculation, I respectfully disagree with the conclusion that the Epicurean argument precludes recovery.

  **I recommend that the Committee adopt the new category of damages.** However, to ensure the instruction is workable and legally sound, the accompanying commentary should explicitly frame the harm as an *objective deprivation of capacity* rather than a *subjective experience of loss*. This approach answers the philosophical objection while providing juries with a concrete standard for assessment.

  **II. The Epicurean Objection and the "Experience Requirement"**

  Judge [Name]'s memo rests on a classic philosophical premise: the "Experience Requirement." As Epicurus and Lucretius argued, harm requires a subject to experience it. Since death is the extinction of the subject, the dead cannot suffer the loss of their future. Therefore, awarding damages for "loss of life" attempts to compensate a victim for a harm they cannot feel.

  If accepted, this logic dictates that a survival action should be limited to the conscious pain and suffering the decedent endured *before* expiration. Once the decedent dies, the legal claim for their personal injury effectively vanishes because the person who was harmed no longer exists.

  This argument is logically consistent, but it is inconsistent with fundamental principles of tort law and our shared moral intuitions. If we accept the Experience Requirement strictly, we must conclude that killing a healthy twenty-year-old instantly is legally less significant than maiming them, provided the maimed victim survives long enough to feel pain. Most legal systems, and most citizens, reject this conclusion. The law recognizes that death is the ultimate injury, precisely because it forecloses all other possibilities.

  **III. The Deprivation Account: A Legal and Philosophical Rebuttal**

  To answer the Epicurean argument on its own ground, we must distinguish between *suffering* (a subjective mental state) and *harm* (an objective setback to interests). Tort law routinely recognizes harms that the victim never consciously experiences.

  Consider a victim rendered permanently comatose by a defendant's negligence. Under the Experience Requirement, this victim suffers no "loss of enjoyment of life" because they are unaware of their condition. Yet, nearly every jurisdiction allows recovery for loss of enjoyment of life in such cases. We do not compensate the coma victim for what they *feel*; we compensate them for what they have *lost*—the capacity to experience the world.

  This is known in philosophy as the "Deprivation Account" of harm. A person is harmed by death not because they experience a painful state of being dead, but because death deprives them of the goods of life they would otherwise have enjoyed. The harm lies in the subtraction of the future, not in the sensation of the subtraction.

  For the purposes of jury instructions, this distinction is vital. We are not asking juries to speculate on what the dead feel (which is impossible). We are asking them to assess the value of the life course that was extinguished. The estate stands in the shoes of the decedent to vindicate the decedent's interest in their own continued existence. Just as the estate can recover for lost *earning capacity* (money the decedent would have earned but never got to spend), the estate should recover for lost *living capacity* (life the decedent would have lived but never got to experience).

  **IV. Drafting Implications: Avoiding Metaphysical Speculation**

  The primary risk of adopting this category is that it invites juries to engage in the very metaphysical speculation Judge [Name] warns against. If the instruction simply says "compensate for the loss of life," jurors may struggle to quantify the unquantifiable, or they may feel they are being asked to pretend the decedent is suffering in the afterlife.

  To mitigate this, the model instruction should frame the damage as **"Loss of Capacity to Enjoy Life."** This phrasing anchors the damage in the *ante-mortem* reality of the decedent's potential, rather than the *post-mortem* state of the decedent.

  I propose the following elements for the instruction and commentary:

  1.  **Objective Standard:** The instruction should clarify that the jury is assessing the value of the life lost based on the decedent's life expectancy and activities prior to death, not on any subjective suffering after death.
  2.  **Distinct from Pre-Death Pain:** The instruction must explicitly state that this category is separate from pain and suffering endured prior to death. This prevents double-counting.
  3.  **Distinct from Survivor Losses:** The instruction must clarify that this belongs to the estate, not the beneficiaries. It compensates the decedent's loss, not the family's grief.
  4.  **Guidance on Quantification:** While no formula exists, the commentary should suggest juries consider the decedent's age, health, and demonstrated interests. A twenty-year-old with a full life expectancy has lost more "capacity" than an octogenarian with a terminal illness. This provides a rational scaling mechanism without requiring the jury to put a specific dollar value on a "soul."

  **V. Policy Considerations**

  Adopting this instruction serves two key policy goals of tort law: **Deterrence** and **Vindication.**

  *   **Deterrence:** If the cost of killing someone is limited to funeral expenses and the survivors' financial loss, the economic disincentive for negligent conduct resulting in death is disproportionately low compared to conduct resulting in severe injury. Recognizing the loss of life itself aligns the damages with the severity of the wrong.
  *   **Vindication:** The law affirms the value of human life. To tell a jury that the law recognizes the loss of a leg or a paycheck, but not the loss of the life that earned the paycheck or used the leg, undermines the dignity the law seeks to protect.

  **VI. Conclusion**

  Judge [Name] is correct that the dead do not suffer. But the dead are not the only parties involved; the law survives them. The survival statute exists to preserve the decedent's legal rights, and among those rights is the right to be free from wrongful deprivation of life.

  The Epicurean argument fails because it conflates the *experience* of harm with the *fact* of harm. By adopting the "Loss of Capacity" framework, we can honor the intuition that death is a compensable injury without asking juries to solve philosophical riddles about the afterlife or the nature of non-existence.

  I urge the Committee to vote in favor of adopting the new category, with instruction language that focuses on the objective deprivation of life's capacities. This balances philosophical rigor with legal practicality.

  Respectfully submitted,

  [Your Name]
  Committee Member
