          *   **Statistics:** Black's spheres follow Maxwell-Boltzmann statistics (countable states). QM particles follow BE/FD statistics. This statistical behavior is the empirical proof of indistinguishability, which Black's spheres lack.

      *   **Part 5: Synthesizing the Answer:**
          *   Validate the user's intuition: Yes, the Fermion/Boson split matters.
