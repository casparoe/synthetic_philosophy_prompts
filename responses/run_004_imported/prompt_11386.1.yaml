answer: |-
  **Setting:** *A cluttered faculty office, late afternoon. Rain taps against the window. Julian is pacing near the whiteboard, marker in hand. Elena sits in the worn leather armchair, nursing a lukewarm coffee.*

  **Julian:** It's elegant, Elena. That's what you're missing. The Buck-Passing Account simplifies the ontology. We don't need this mysterious, non-natural property of "goodness" hovering over things. To say the Grand Canyon is good is just to say there are reasons to value it. Reasons to visit, to protect, to admire. Value is reducible to reasons.

  **Elena:** It is elegant. Like a house of cards in a wind tunnel. You know exactly where I'm going with this, Julian. The Demon.

  **Julian:** *(Sighs)* The Demon. Yes.

  **Elena:** An evil demon threatens to torture your family unless you admire this saucer of mud. Right now. You have a massive, overriding reason to admire the saucer. If your theory holds—if "good" just *means* "there are reasons to have a pro-attitude"—then, in this scenario, the saucer of mud becomes good.

  **Julian:** But it doesn't become good. It's still mud. It's worthless.

  **Elena:** Exactly. So the analysis fails. You have reasons for the attitude, but no value in the object. The Buck-Passing Account counts the demon's threat as a reason that confers value, but intuitively, that reason is the *wrong kind* of reason.

  **Julian:** Okay, but that's why we have the distinction. It's the standard fix. We distinguish between *object-given* reasons and *state-given* reasons.

  **Elena:** Walk me through it.

  **Julian:** The demon gives you a reason to *want to have* the attitude, or a reason to *bring it about* that you have the attitude. That's a state-given reason. It's about the consequences of holding the attitude. But for the mud to be valuable, you need an object-given reason. A reason grounded in the properties of the mud itself. The demon's threat isn't a property of the mud. So, we just filter it out. We say: $X$ is good iff there are *object-given* reasons to value $X$.

  **Elena:** *(Leans forward)* And there lies the trap. How do you define "object-given" without smuggling value back in?

  **Julian:** It's not about value. It's about the target of the reason. An object-given reason cites a property of the object. "The mud is wet," "The mud is brown."

  **Elena:** Those properties don't give me a reason to admire it.

  **Julian:** No, they give you a reason to *believe* it's wet or brown. For admiration, you need properties like "is courageous" or "is beautiful."

  **Elena:** Ah. So, to distinguish the Right Kind of Reasons (RKRs) from the Wrong Kind (WKRs), you have to specify which properties of the object count as reason-giving for admiration.

  **Julian:** Precisely.

  **Elena:** But which properties are those, Julian? If I say, "The mud is such that a demon will torture me if I don't admire it," isn't that a property of the mud? Relational, sure. But it's a fact about the mud in this context.

  **Julian:** It's extrinsic. We usually limit it to intrinsic properties, or...

  **Elena:** No, don't retreat to intrinsic properties. A rare stamp is valuable partly because of its history. That's relational. Look, if you say "Only properties that make admiration *fitting* count," you're using the notion of fittingness. If you say "Only properties that make the object *admirable* count," you're using admirability.

  **Julian:** I'm not using the value term. I'm using the reason term. I'm saying these properties provide normative support for the attitude *directly*, not via the benefits of having the attitude.

  **Elena:** But how do you cash out "directly"? If I admire the mud to save my family, the property "is such that my family survives if admired" is doing the work. It's a property of the situation involving the mud. Why is that the wrong kind?

  **Julian:** Because it doesn't make the attitude *correct*. It makes it *prudent*.

  **Elena:** *(Taps her mug)* There it is. "Correct." You're appealing to a norm of correctness specific to the attitude. Admiration has a "mind-to-world" direction of fit. It aims to track the admirable.

  **Julian:** Yes.

  **Elena:** So, to solve the Wrong Kind of Reasons problem, you have to appeal to the *correctness conditions* of admiration. You have to say, "The demon's threat doesn't make admiration correct, it just makes it useful."

  **Julian:** That seems right.

  **Elena:** But what determines correctness? If I ask, "Why is admiration correct only when the object is truly admirable?" you say, "Because there are reasons to admire." But we just saw that there can be reasons to admire (the demon) without the admiration being correct. So you have to say, "There are *fitting* reasons."

  **Julian:** I can say "reasons of the right kind."

  **Elena:** And what picks out the right kind? It looks like you can only identify the Right Kind of Reasons by first identifying what makes the object valuable. You need to know the mud *isn't* admirable to know the demon's threat is the *wrong kind* of reason.

  **Julian:** That's too strong. We can identify the structure of the reason.

  **Elena:** Show me.

  **Julian:** *(Turns to the whiteboard)* Okay. Consider the logical form. An object-given reason says: "Because $X$ has property $P$, attitude $A$ is supported." A state-given reason says: "Because having attitude $A$ yields consequence $C$, attitude $A$ is supported."

  **Elena:** Okay.

  **Julian:** The demon case fits the second form. "Because admiring the mud saves my family, I should admire." The property of the mud is irrelevant to the logic. I could be admiring a saucer of gold, the logic is the same.

  **Elena:** But suppose the demon says, "I will torture you unless you admire this mud *because* it is mud." Now the property is essential to the threat. The reason is contingent on the mud being mud. Is that an object-given reason now?

  **Julian:** ...No. Because it's still about the consequence.

  **Elena:** But the property "is mud" is cited in the antecedent. Your structural distinction is getting blurry. Look, Julian, the deeper issue is this: To filter the reasons, you need a criterion. If the criterion is "properties that make the attitude fitting," you're circular, because fittingness is a value concept. If the criterion is "properties that are not about consequences," you run into the problem that some value is consequentialist.

  **Julian:** So you think the reduction is impossible.

  **Elena:** I think the distinction between WKRs and RKRs presupposes the very value facts you're trying to reduce. You can't say "This reason is the right kind" without implicitly judging "This object is worthy." If you could identify the right kind of reasons independently of value, you could solve the demon case without ever mentioning worthiness. But you can't.

  **Julian:** *(Puts the cap back on the marker)* What if we go higher order? Rabinowicz and Rønnow-Rasmussen suggested this. We distinguish reasons for *having* an attitude from reasons for *wanting to have* an attitude.

  **Elena:** The "double vision" move?

  **Julian:** Yes. The demon gives me a reason to *want* to admire the mud. Or a reason to *try* to admire it. But it doesn't give me a reason that actually bears on the object in the act of admiration itself. When I'm actually admiring, I'm focusing on the object. The demon is in the background. The RKR is part of the content of the attitude; the WKR is external to it.

  **Elena:** But a clever demon could hack the content. Suppose the demon hypnotizes you so that the threat *becomes* the object of your admiration. You admire the mud *because* it is the locus of this cosmic threat. It makes the mud significant. It makes the mud the center of a moral drama.

  **Julian:** That's forced admiration.

  **Elena:** Is it? If the reason is sufficient to make the attitude rational, why isn't it sufficient to make the object valuable? If I have a decisive reason to admire $X$, and I admire $X$, and my admiration is rational... in what sense is $X$ not good?

  **Julian:** Because the reason isn't about $X$'s merit!

  **Elena:** *(Softly)* And there it is. "Merit." You keep reaching for that word. "Merit," "Worth," "Fittingness." You're trying to define Value in terms of Reasons, but you're defining the Relevant Reasons in terms of Value.

  **Julian:** *(Sits on the edge of his desk)* So we're stuck. We either accept that the saucer of mud is good when the demon threatens us—which is absurd—or we admit that "Reason" isn't a primitive enough concept to ground "Value."

  **Elena:** Or, we admit that the "Wrong Kind of Reasons" problem isn't a technical glitch. It's a symptom. It shows that reasons don't create value; value constrains reasons. The reason is the wrong kind *because* the mud has no value. Not the other way around.

  **Julian:** But then what is value? If it's not reasons for attitudes, it's this spooky property again. I'm trying to naturalize ethics, Elena.

  **Elena:** And I'm trying to keep you from circularity. Look, maybe you don't need to eliminate value. Maybe you just need to say value is the *source* of the Right Kind of Reasons.

  **Julian:** That kills the Buck-Passing Account. That makes value fundamental.

  **Elena:** Maybe it is. The demon case shows that reasons are ubiquitous. We always have reasons to do things, to feel things, based on consequences. Value is the filter. It's the specific normative force that makes an attitude appropriate *regardless* of the consequences.

  **Julian:** *(Stares at the whiteboard)* So the Buck-Passer has to beg the question to solve the Demon.

  **Elena:** Essentially. To distinguish the kinds of reasons, you have to already know which objects are valuable. If you know that, you don't need the Buck-Passing Account to tell you what value is.

  **Julian:** *(Rubbing his temples)* I hate it when you do that.

  **Elena:** I know. But admit it. The mud is still mud.

  **Julian:** The mud is still mud. But I'm not giving up on reasons. There has to be a way to specify the "object-given" condition without invoking "goodness." Maybe... maybe it's about the phenomenology of the attitude?

  **Elena:** Now you're moving the goalposts to psychology.

  **Julian:** Better than moving them to Platonism.

  **Elena:** *(Stands up)* Coffee?

  **Julian:** Please. Black.

  **Elena:** *(At the door)* You know, if you define the Right Kind of Reasons as "Reasons that track value," the analysis is circular. If you define them as "Reasons that track properties," you include the demon. If you define them as "Reasons that make the attitude correct," you're using a synonym for value.

  **Julian:** I heard you the first three times, Elena.

  **Elena:** Just making sure the demon didn't threaten you into forgetting.

  **Julian:** *(Smiles faintly)* If he did, I'd have a reason to remember. Doesn't mean the memory is true.

  **Elena:** See? You're already passing the buck.

  *(Elena exits. Julian turns back to the whiteboard, stares at the words "Object-Given," and slowly erases them.)*
