      *   *Critique:* Will the "Result is a Result" camp listen?
      *   *Fix:* Appeal to their pragmatism. A model that relies on cancelling errors is *useless* for future work. Honoring it outright devalues the award's long-term prestige if the model collapses later.

  7.  **Final Polish:** Check the physics terminology (mean-field, next-nearest-neighbour, critical temperature, error bars). Ensure the tone is collegial. (The user mentioned "fourty" in the prompt, I should ensure correct spelling in the memo).

  8.  **Final Review against constraints:**
