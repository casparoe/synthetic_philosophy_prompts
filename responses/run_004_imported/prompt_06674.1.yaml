answer: |-
  Good morning. Thank you all for being here. For those who don't know me, I'm [Your Name], [Mother's Name]'s child.

  Looking out at this room, I see two worlds colliding. I see family, who knew her as the woman who made sure everyone ate before she sat down, who remembered every birthday, who loved us with a fierce, quiet steadiness. And I see her colleagues—nurses, hospice workers, ICU staff—who knew her as the one who showed up early, who stayed late, who knew exactly how to adjust a pillow or lower a light when words weren't enough.

  For thirty years, my mother lived in the space between those two worlds. She was a hospice nurse. She spent three decades walking people toward the end of their lives. If you ask most people what that takes, they'll say compassion. Or strength. But those of you who worked with her know it takes something else. It takes the ability to carry things that don't have a solution.

  My mother was a person of her word. If she said she would be there, she was there. But she also taught me that sometimes, the world puts you in a position where keeping your word to one person means breaking it to another.

  Early in her career, there was a night she never forgot. She was caring for a patient, an old man with no family. He was scared. He asked her not to let him die alone. She promised him she would stay.

  Later that shift, another patient's husband collapsed in the hallway. Cardiac arrest. She was the only one there. She had seconds to decide. She could stay with the old man she promised, or she could run to the husband who was dying in the hall.

  She ran to the husband. She saved him. The old man died alone.

  I tell you this not because it's a tragedy that needs retelling, but because it's a tragedy she refused to let go of. For thirty years, people told her, "You did the right thing. You saved a life. You have nothing to feel bad about."

  She hated that. She told my sister, specifically, that she didn't want anyone standing here today trying to absolve her of it. She said that comfort missed the point. To her, there hadn't been a "right thing." There were just two real obligations, and not enough of her to go around. Going to the husband didn't make the promise to the old man stop being real. It just meant she broke it.

  She carried that. She didn't carry it as guilt, exactly. She carried it as a debt. She believed that some costs of this work aren't meant to be written off. She believed that acknowledging the break was the only way to honor the promise.

  To her colleagues here: You know this math. You know that triage isn't just medical; it's moral. And you know that the ones who last in this work aren't the ones who harden themselves. They're the ones who, like her, refuse to harden. They're the ones who feel the weight of the "not enough." She respected you because you knew that sometimes, there is no clean win. There is just the choice you make, and the ghost of the choice you didn't.

  To our family: I know you want to hear that she is at peace. I want that too. But I think her peace wasn't about having a clean conscience. It was about having an honest one. She didn't sleep well because she told herself lies about being perfect. She slept because she knew she showed up, fully, even when it broke her.

  She loved us the same way she nursed. She didn't promise us a life without pain. She promised us she wouldn't look away from it. When we were hurt, she didn't try to fix it with platitudes. She sat with us. She held the space. She let us know that we were worth the weight.

  There is a temptation, at a time like this, to smooth over the rough edges. To say that everything happens for a reason, or that the good outweighs the bad. But my mother would have found that disrespectful. She taught me that love isn't about fixing the unfixable. It's about witnessing it.

  So, I am not going to tell you that it's all okay. It isn't. She is gone. We miss her. And there are still promises in this world that can't be kept, because there still isn't enough of any of us to go around.

  But I will tell you this: She carried her burdens with dignity. She owned her choices, even the impossible ones. And in a world that loves a happy ending, she had the courage to live an honest story.

  Mom, you don't have to carry it anymore. You don't have to be enough for everyone now. You can rest. We'll take it from here.

  Thank you.
