  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** The child of the deceased (daughter/son).
      *   **Deceased:** Mother, hospice nurse for 30 years. Died two weeks ago.
      *   **Key Story:** Early in her career, she promised a dying, lonely patient she'd be there when he died. Simultaneously, another patient's husband collapsed. She had to choose. She saved the husband, the lonely patient died alone.
      *   **Mother's Perspective:** She never "got over it." She rejected the idea that she "did the right thing." She believed there was no right choice, just two real obligations and not enough of her. She broke a promise. She didn't want to be "absolved" of it at her funeral.
      *   **Audience:** Half hospice/ICU professionals (will detect insincerity or medical inaccuracies), half family (want comfort/peace).
      *   **Tone:** Honest, raw, not seeking resolution/absolution. Acknowledging the weight of the burden without trying to fix it.
      *   **Length:** Approx. 6 minutes (roughly 750-900 words spoken at a moderate pace).
      *   **Constraint:** Must honor her specific wish *not* to be absolved of this specific memory, while still functioning as a eulogy.

  2.  **Determine the Core Theme:**
      *   The theme isn't "she was a saint." It's "she was a witness."
      *   The central tension is between the comfort family wants ("she's at peace") and the truth the colleagues know ("the job leaves scars").
      *   The resolution isn't fixing the past, but honoring the weight she carried. The "peace" comes from her integrity, not from a clean conscience.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the setting, and the dual nature of the audience. Establish her identity not just as a mom, but as a nurse.
      *   **The Career:** Briefly touch on the 30 years. The mundane and the profound.
      *   **The Story (The Crux):** Tell the story of the two patients. This needs to be handled carefully. It can't be a setup for a "but she was a hero" punchline. It has to land as a tragedy she carried.
      *   **Her Philosophy:** Explain *why* she wouldn't let people comfort her about it. The concept of "not enough of her." This is the philosophical heart of the eulogy.
      *   **The Mother/Family Side:** Bridge back to who she was at home. How this weight shaped her love.
      *   **The Closing:** Acknowledge the wish for no absolution. Offer a farewell that respects her burden.

  4.  **Drafting - Specific Considerations & Refinements:**

      *   *Medical Accuracy:* Use terms like "shift," "slipping," "codes," "triage." The colleagues need to nod along.
      *   *Emotional Accuracy:* Avoid clichés like "she's looking down on us." Instead, focus on the imprint she left.
      *   *The "Absolution" Constraint:* This is tricky. If I say "she didn't want absolution," does that sound like I'm granting it by saying she didn't want it? I need to frame it as *carrying the debt*. She owned the break. We own the memory of her carrying it.
      *   *Timing:* 6 minutes is about 800-900 words. I need to ensure it's not too short.
      *   *Tone Check:* Is it too dark for the family? I need to balance the heaviness with love. The love *is* in the heaviness. She cared enough to hurt.

  5.  **Writing - Iteration 1 (Mental Outline):**
      Hi everyone. Mom was a nurse. She loved you all. There was a story about a patient. She had to choose. She chose the husband. The patient died. People said it was okay. She said no. She carried that. That's who she was. She loved us like that too. We will miss her.

      *Critique 1:* Too blunt. Needs more poetry and warmth. Needs to address the "peace" aspect for the family without lying.

  6.  **Writing - Iteration 2 (Focusing on the "Not Enough of Her" concept):**
      Start with the hands. Nurse hands. Mom hands. Talk about the 30 years. Tell the story. Emphasize that triage isn't math, it's grief. She refused to let the grief be washed away. That was her integrity. To the family: her peace isn't ignorance, it's acceptance. To the colleagues: you know this weight.

  7.  **Final Polish (incorporating the prompt's specific phrasing):**
      *   Use the phrase "not enough of her."
      *   Use the phrase "two real obligations."
      *   Ensure the ending doesn't try to solve the unsolvable.

  8.  **Word Count Check:**
      *   Speaking rate is ~130-140 words per minute.
      *   6 minutes = ~800-850 words.
      *   I will aim for that range.

  9.  **Final Review against Constraints:**
      *   Did I absolve her? No, I explicitly state she wouldn't allow it.
