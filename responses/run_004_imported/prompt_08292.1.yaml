prompt: |-
  At a check-up last month, my doctor used the ACC/AHA pooled cohort equations to put my ten-year risk of a cardiovascular event at 9%, then mentioned, almost in passing, that my family history of early heart disease counts as a "risk-enhancing factor" that the equation itself does not incorporate. Working out how much weight to give that bare 9% figure sent me back, for the first time since a graduate seminar on the philosophy of probability, to David Lewis's Principal Principle -- and specifically to the admissibility clause, which is supposed to say what further evidence I am entitled to bring to bear on top of a stated chance.

  Write an essay addressing two connected questions: first, whether a population-derived estimate of this kind is even the sort of thing to which the Principal Principle applies, as opposed to a merely statistical or evidential probability that carries no presumption of deference; second, whether facts like my family history should count as "admissible" in Lewis's sense, so that they may legitimately move my credence away from 9%, or whether the admissibility clause is too thin (perhaps even circular) to settle the matter. Weigh the strongest considerations on each side, but do not leave the question open: defend a definite verdict about how someone in my position should treat the 9% figure.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Prompt:**
      *   **Scenario:** The user had a doctor's check-up. The doctor used the ACC/AHA pooled cohort equations to calculate a 10-year cardiovascular risk of 9%. The doctor noted that family history of early heart disease is a "risk-enhancing factor" not fully captured by the equation.
      *   **Philosophical Connection:** The user connects this to David Lewis's Principal Principle (PP) and the concept of *admissibility*.
      *   **Task:** Write an essay addressing two connected questions:
          1.  Does the PP apply to population-derived medical risk estimates (objective chance vs. statistical/evidential probability)?
          2.  Is family history "admissible" evidence in Lewis's sense (allowing credence to diverge from the 9%), or is the admissibility clause too thin/circular?
      *   **Constraint:** Weigh considerations on each side but *do not leave the question open*. Defend a definite verdict on how the user should treat the 9% figure.
      *   **Tone:** Philosophical, analytical, engaging with the specific concepts (PP, admissibility, objective chance), but grounded in the medical context.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **David Lewis's Principal Principle (PP):** Roughly, if you know the objective chance of an event $A$ is $x$, and you have no "inadmissible" evidence, your credence (subjective belief) in $A$ should be $x$. Formula: $C(A | Ch(A)=x \& E) = x$, where $E$ is admissible.
      *   **Objective Chance vs. Statistical Probability:** Lewis's PP is designed for *objective chances* (metaphysical propensities, single-case probabilities grounded in laws of nature), not merely frequencies or epistemic probabilities.
      *   **Admissibility:** Evidence is admissible if it doesn't give information about the *outcome* other than through the *chance*. If evidence tells you something about the specific outcome *directly* (bypassing the chance), it's inadmissible. Lewis's definition is notoriously tricky and arguably circular (admissible = evidence that doesn't violate PP).
      *   **The Medical Context:** The ACC/AHA risk score is based on cohort studies (frequencies). It's a reference class probability. Is there a "single-case chance" of *me* having a heart attack? Or is it just a frequency of people *like me*?

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The intersection of clinical practice and metaphysics of probability.
          *   Context: The 9% risk score vs. family history.
          *   Thesis Statement: The PP does not strictly apply because medical risk scores are not Lewisian objective chances, but rather reference class frequencies. However, even if we treat them *as if* they were chances for decision-making purposes, family history is "inadmissible" in the spirit of PP (it bears directly on the outcome), meaning the 9% should be adjusted upward. The 9% is a baseline, not a verdict.

      *   **Part 1: Is the 9% an Objective Chance? (PP Applicability)**
          *   *Argument for PP:* In a deterministic or quasi-deterministic world (biology), there might be underlying propensities. The risk score attempts to estimate this hidden parameter.
          *   *Argument against PP:* Lewisian chance is single-case. The ACC/AHA score is frequentist (reference class). It says "9% of people with these metrics have an event." It doesn't say "There is a 9% propensity in *you*." This is the Reference Class Problem.
          *   *Analysis:* Medical risk is epistemic/statistical, not metaphysical chance. Therefore, strict PP doesn't apply. It's an evidential probability.
          *   *Pivot:* However, in practice, we treat these scores *as* chances for decision theory. So, we should analyze the admissibility question *conditional* on treating the score as a chance-analogue.

      *   **Part 2: Admissibility of Family History.**
          *   *Lewis's Definition:* Evidence is admissible if it concerns only the past and the laws, not the specific future outcome.
          *   *Application:* The 9% is derived from specific variables (cholesterol, age, BP). Family history is *extra* information.
          *   *Is it Admissible?* If the 9% is the *true* chance, then family history shouldn't matter. But the doctor admitted the equation *doesn't incorporate* it. This means the 9% is not the *complete* chance estimate.
          *   *The Circularity Problem:* Lewis defines admissibility by whether it constrains credence. If we know family history predicts heart attacks, ignoring it violates rationality.
          *   *Argument:* Family history is evidence about the *specific outcome* (my biology/genetics) that is not fully screened off by the risk score variables. Therefore, it functions like "inadmissible" evidence (information about the future/outcome not mediated by the stated chance).
          *   *Result:* Credence should diverge from 9%.

      *   **Part 3: Synthesizing and Defending the Verdict.**
          *   The prompt asks for a definite verdict.
          *   *Verdict:* The 9% is a prior, not a posterior. It must be updated.
          *   *Why:* Because the risk score is an incomplete model. Treating it as a Lewisian chance is a category error, but even within a Bayesian framework (which is more appropriate here), the family history is relevant evidence that shifts the probability.
          *   *Philosophical nuance:* The PP fails here not because admissibility is circular, but because the "Chance" variable ($Ch(A)=x$) is false. The chance isn't 9%; the *estimated frequency* is 9%. The true propensity is likely higher given the genetics.
          *   *Practical upshot:* Do not anchor on the 9%.

      *   **Conclusion:**
          *   Summarize the argument.
          *   Return to the doctor's office context.
          *   Final philosophical takeaway: Medical risk is Bayesian updating, not deference to chance.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is it fair to say PP doesn't apply? Lewis himself struggled with statistical mechanics.
      *   *Correction:* I need to be precise. Lewis distinguishes between *chance* and *credence*. Medical risk is often credence masquerading as chance. I should argue that treating it as chance is a useful fiction, but the admissibility clause reveals the fiction.
      *   *Admissibility:* Lewis says evidence about the future is inadmissible. Family history is about the past. *However*, it's evidence about the *propensity* itself. If the 9% claims to be the *all-things-considered* chance, then new info about propensity makes the 9% claim false. If the 9% claims to be the chance *given variables X, Y, Z*, then family history is new evidence.
      *   *Better angle:* The "chance" stated by the doctor is conditional on the inputs. $Ch(Event | Inputs) = 0.09$. Family history is extra input. So $Ch(Event | Inputs + Family) \neq 0.09$. The PP says defer to the chance. If the stated number isn't the *full* chance, you don't defer to it.
      *   *Wait, Lewis's Admissibility:* Admissibility is about evidence $E$ in $C(A | Ch(A)=x \& E) = x$. If $E$ is family history, does it violate the equality? Yes, because $E$ suggests the chance isn't actually 9% for *me*, even if it is 9% for the *reference class*.
      *   *Decision:* I will argue that the 9% is not a Lewisian chance but a frequency. Therefore, PP is the wrong tool. The right tool is Bayesian updating. Under Bayesian updating, family history is relevant evidence. Therefore, adjust the 9% upward. This satisfies the "definite verdict" constraint.

  5.  **Final Polish:**
      *   Ensure the tone is appropriate (philosophical essay).
      *   Check that both questions (PP applicability, Admissibility) are addressed.
      *   Ensure the verdict is clear.
      *   *Key phrase to include:* "Reference Class Problem," "Single-case chance," "Screening off."

  6.  **Writing the Essay:** (Mental outline of the flow)
      *   Intro: The clinical encounter as a philosophical puzzle.
      *   Body 1: The nature of the 9%. Is it Chance? (No, it's frequency/reference class). PP requires objective chance.
      *   Body 2: Even if we grant it chance-status, what about admissibility? Family history isn't "inadmissible" in the time-travel sense, but it undermines the *truth* of the chance claim. It shows the 9% is incomplete.
      *   Body 3: The Verdict. The 9% is a baseline for a specific model, not the world. You must update.
      *   Conclusion: The doctor was right to mention it; Lewis helps us see why the number isn't sacred.

      *(Self-Correction on Admissibility)*: I need to be careful with Lewis's specific definition. Admissible evidence is evidence that doesn't give information about the future *except via the chance*. Family history gives information about the *chance itself* (it suggests the true propensity is higher). If the proposition is $Ch(A)=0.09$, and family history suggests $Ch(A) > 0.09$, then family history is evidence *against* the proposition that the chance is 9%. Thus, the condition $Ch(A)=x$ is undermined.
      *Actually, a better interpretation:* The doctor is presenting $Ch(A | Model) = 0.09$. But I need $Ch(A | Model \& History)$. Since the Model doesn't screen off History, the probability shifts.
      *Let's stick to the prompt's framing:* Is family history "admissible" in Lewis's sense? Lewis says evidence about the past is generally admissible. But if the past evidence reveals the chance statement is false (or incomplete), it functions to shift credence. I will argue that the admissibility clause is indeed too thin/circular here, and we should rely on the distinction between *model probability* and *single-case propensity*.

      *Revised Plan for Verdict:*
      1. PP doesn't strictly apply (no objective single-case chance).
      2. But even if it did, family history renders the "9%" claim suspect as a *complete* chance statement.
      3. Verdict: Treat the 9% as a prior probability to be updated, not a chance to be deferred to. Increase credence above 9%.

      Let's write.

      *Check:* Did I address the "circularity" of admissibility? Yes, Lewis defines admissibility as "evidence that doesn't violate PP." This is circular. I should mention that this circularity leaves us helpless in the medical case, necessitating a move to Bayesianism.

      *Final check on constraints:* "Do not leave the question open." "Defend a definite verdict." Okay, I will be firm: The 9% is not a binding chance; it is an incomplete statistical summary. You should regard your risk as higher.

      *Tone check:* Needs to sound like someone who remembers a grad seminar on Lewis. Use terms like "Humean supervenience," "reference class," "screening off."

      *(Final thought before drafting)*: Make sure to explicitly answer the "admissibility" question. Is family history admissible? In Lewis's strict sense, past evidence is admissible. *But*, if the chance claim is "The chance is 9% *simpliciter*," then family history is evidence that the chance is *not* 9%. If the chance claim is "The chance is 9% *given these variables*," then family history is new evidence. I will argue the latter is what the doctor means, which makes the PP inapplicable because the condition $Ch(A)=x$ is not met *for the agent's total evidence*.

      Okay, ready to write.
answer: |-
  The clinical encounter is often a site of epistemic friction. You stand before a physician who wields a number—9%—derived from the ACC/AHA pooled cohort equations. This number is presented as a risk, a probability, a forecast of your biological future. Yet, almost immediately, the authority of that number is qualified by a qualitative fact: your family history. You are left holding a quantitative estimate that claims objectivity and a qualitative fact that claims relevance, with no clear rule for how to combine them. It is no surprise that this tension recalls David Lewis's Principal Principle (PP). The PP is the philosophical gold standard for aligning subjective credence with objective chance. But as you suspect, applying Lewis's metaphysics to the messy reality of epidemiological risk requires navigating two treacherous questions: first, whether medical risk scores constitute the sort of "objective chance" to which the PP applies; and second, whether your family history counts as "admissible" evidence that permits you to diverge from the stated figure.

  To reach a verdict on how you should treat that 9%, we must first dismantle the assumption that the ACC/AHA score is a Lewisian chance. Lewis's Principal Principle states, roughly, that if you know the objective chance of an event $A$ is $x$, and you possess no "inadmissible" evidence, your credence in $A$ should be $x$. The crucial term here is *objective chance*. For Lewis, chances are single-case propensities grounded in the laws of nature and the history of the world (the "Humean mosaic"). They are not mere frequencies. The 9% figure, however, is explicitly frequentist. It is derived from the observed incidence of cardiovascular events in a reference class of people who share your age, cholesterol, blood pressure, and smoking status.

  This distinction matters because the PP is designed to bridge the gap between metaphysical propensity and rational belief. It tells us how to trust the universe's tendencies. But the ACC/AHA equation does not tell you the universe's tendency regarding *you*; it tells you the frequency of events among *people like you*. This is the classic Reference Class Problem. You belong to infinite reference classes: people with your cholesterol, people with your genetics, people living in your zip code, people who worry about Lewisian metaphysics. The 9% is a statistical summary of one specific class, not a statement of single-case propensity. Therefore, strictly speaking, the Principal Principle does not apply. There is no "chance" here to which you must defer; there is only a statistical generalization. If we treat the 9% as a Lewisian chance, we commit a category error, mistaking a model's output for a law of nature.

  However, let us grant, for the sake of argument, that in a medical context we treat these risk scores *as if* they were objective chances. We do this because we lack access to true propensities and must act on the best available proxy. If we treat the 9% as a chance $x$, we must then confront the second question: is your family history "admissible" evidence?

  Lewis defines admissible evidence as information that bears on the outcome only through its bearing on the chance. Inadmissible evidence is typically "crystal ball" information—knowledge of the future itself. Evidence about the past is usually admissible. Your family history is, temporally speaking, about the past. Under a naive reading of Lewis, this suggests your family history is admissible, and therefore you *should* defer to the 9%. If the evidence is admissible, the PP commands: $C(A | Ch(A)=0.09 \& Evidence) = 0.09$.

  But this leads to an absurd clinical conclusion. If you defer to the 9% despite a strong family history of early heart disease, you are ignoring a potent predictor of the very event in question. This reveals the weakness of Lewis's admissibility clause. Lewis himself admitted the definition was somewhat circular: evidence is admissible if it doesn't violate the Principal Principle. This circularity leaves us helpless in your specific case. We need a substantive criterion. The substantive criterion should be *screening off*. Evidence is admissible only if the stated chance screens it off from the outcome. That is, does knowing the chance is 9% make the family history irrelevant?

  The doctor's comment confirms that it does not. By stating that family history is a "risk-enhancing factor" that the equation "does not incorporate," the doctor is admitting that the 9% figure does not screen off the family history. The equation is an incomplete model. It calculates a probability based on variables $V_1, V_2, V_3$. Your family history is variable $V_4$. The 9% is $P(Event | V_1, V_2, V_3)$. Your total evidence includes $V_4$. Therefore, your credence should be based on $P(Event | V_1, V_2, V_3, V_4)$. Since $V_4$ is positively correlated with the event, the latter probability must be higher than the former. In Lewisian terms, the family history is evidence that the *true* single-case chance for you is not 9%, but higher. It is evidence about the *chance itself*, not just the outcome. While Lewis typically treats evidence about the chance as admissible, that applies when the chance is a known, fixed parameter. Here, the 9% is an *estimate* of the parameter. Family history is evidence that the estimate is low.

  This brings us to the necessary verdict. You asked whether the admissibility clause is too thin to settle the matter. It is. Relying on Lewis's strict distinction between admissible and inadmissible evidence in the context of incomplete statistical models leads to paralysis or error. The admissibility clause assumes we know the true chance function. In medicine, we never know the true chance function; we only have models with varying degrees of calibration.

  Therefore, you should not treat the 9% figure as a binding objective chance to which your credence must anchor. To do so would be to fetishize the model over the reality it attempts to map. The 9% is a baseline prior, derived from a reference class that is too coarse to capture your specific biological inheritance. It is a starting point for calculation, not a verdict on your fate.

  Your definite course of action should be to regard the 9% as a lower bound. The family history is not "inadmissible" evidence in the sense of being illicit; rather, it is *higher-order* evidence that undermines the completeness of the risk score. In Bayesian terms, the 9% is your prior probability based on general population data. Your family history is new data that requires a likelihood update. Since early heart disease in first-degree relatives is a known, independent predictor of cardiovascular events, rational coherence demands that you update your credence upward.

  To defer to the 9% in the face of this evidence would be to commit the base rate fallacy in reverse: assuming the general model swamps the specific evidence. Lewis's Principal Principle is a tool for aligning belief with the laws of nature. But the ACC/AHA equation is not a law of nature; it is a heuristic. When a heuristic conflicts with specific causal knowledge (genetics/family history), the specific causal knowledge must win.

  In conclusion, the philosophy of probability clarifies that the 9% is not a Lewisian chance, but a frequency relative to an incomplete set of conditions. Consequently, the Principal Principle does not mandate deference. Furthermore, the admissibility clause, even if applied, cannot protect the 9% from revision because the family history indicates the chance estimate itself is flawed for your specific case. You are entitled to bring this evidence to bear. You should treat the 9% not as your risk, but as the risk of a person who is *like* you but lacks your genetic burden. Your actual credence in a cardiovascular event should be significantly higher. The doctor's "passing mention" was, in fact, the most philosophically and medically significant part of the consultation. Ignore the metaphysics of the 9%; trust the biology of your history.
