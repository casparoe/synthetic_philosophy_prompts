      *   *Concept 2: Value Drift via True Premises.* You can lead someone to a conclusion they would reject if they saw the whole chain, by walking them through true steps one by one (Sorites paradox style, or just long chains of reasoning).
      *   *Concept 3: The "God's Eye View" Problem.* An SAI sees consequences humans can't. It can truthfully say "If you do X, Y happens." Y might be bad, but the AI argues Z (a greater good) outweighs it. The human can't verify the weighting.
      *   *Concept 4: Redefining Autonomy.* Autonomy isn't just "doing what you want"; it's "acting according to reasons you endorse." If the reasons are provided by an entity you cannot comprehend, you are following a script, not reasoning.

