prompt: |-
  I've been asked to give the keynote at a Fourth of July naturalization ceremony, where a federal judge will swear in about 150 new citizens. The judge, a former legal historian, wants the speech built around Frederick Douglass, but has asked that it not lean only on the righteous anger of 'What to the Slave is the Fourth of July?' She wants it to reckon with the fact that Douglass spent a decade agreeing with Garrison that the Constitution was 'a covenant with death, and an agreement with hell,' before breaking with him around 1851 to argue -- from the text alone, not the framers' intentions -- that it was, in his own words, 'a glorious liberty document.' Write the speech: it has to move new citizens who know none of this history, while still holding up for the judge and the legal historians in the room, who will notice if Douglass's actual argument -- and his reasons for changing his mind -- get flattened into generic uplift.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Fourth of July Naturalization Ceremony.
      *   **Audience:** ~150 new citizens (diverse backgrounds, likely unfamiliar with US legal history), a Federal Judge (former legal historian), legal historians in the room.
      *   **Topic:** Frederick Douglass.
      *   **Constraint 1 (The Judge's Wish):** Do *not* rely solely on the righteous anger of "What to the Slave is the Fourth of July?" (1852).
      *   **Constraint 2 (The Core Argument):** Must address Douglass's shift from the Garrisonian view (Constitution = "covenant with death/agreement with hell") to his 1851+ view (Constitution = "glorious liberty document" based on text, not intent).
      *   **Tone:** Moving/uplifting for new citizens, intellectually rigorous for the historians/judge.
      *   **Goal:** Reckon with the complexity of Douglass's constitutional evolution without flattening it.

  2.  **Deconstruct the Historical Context:**
      *   *Phase 1 (Garrisonian):* Douglass initially agreed with William Lloyd Garrison. The Constitution protected slavery (3/5 clause, fugitive slave clause, etc.). Therefore, it was pro-slavery. The solution was disunion (break up the Union).
      *   *The Shift (1851):* Douglass broke with Garrison. Why? He read Lysander Spooner's *The Unconstitutionality of Slavery* and Gerrit Smith's arguments. He realized the *text* never explicitly says "slave" or "slavery." It uses euphemisms ("person held to service," "importation of such persons").
      *   *Phase 2 (Constitutionalist):* The Preamble ("secure the Blessings of Liberty") controls the interpretation. The Constitution is a tool for freedom if wielded correctly. It requires active participation to make it real.
      *   *Relevance to Naturalization:* New citizens are taking an oath to support the Constitution. Understanding that the Constitution is a tool they must wield, not just a relic they inherit, is crucial.

  3.  **Determine the Speech Structure:**
      *   **Opening:** Welcome the new citizens, acknowledge the date (July 4th), acknowledge the weight of the oath.
      *   **The Hook (Douglass):** Introduce Douglass not just as an orator, but as a thinker who changed his mind.
      *   **The Conflict (The Two Constitutions):** Explain the "covenant with death" vs. "liberty document" debate simply but accurately.
      *   **The Turning Point:** Why did he change? (The text vs. the intent). This satisfies the historian audience.
      *   **The Application (For New Citizens):** What does this mean for *them*? The Constitution isn't perfect; it's a promise they must keep. It belongs to those who use it.
      *   **Closing:** A call to action, tying the oath to Douglass's legacy.

  4.  **Drafting - Section by Section:**

      *   *Introduction:* Start with the oath. It's the center of today. Acknowledge the holiday's duality (celebration + critique).
      *   *Douglass's Dilemma:* Introduce the 1852 speech everyone knows, but pivot quickly to the *earlier* Douglass. Use the "covenant with death" quote. It's stark.
      *   *The Shift:* This needs precision. Mention 1851. Mention the reasoning: The text doesn't say "slave." The Preamble sets the goal. This is the "legal historian" bait—showing I understand the textualist argument Douglass made.
      *   *Connecting to the Audience:* Why does this matter to someone becoming a citizen today? Because they are inheriting a document that has been argued over. It's not a finished product; it's a battlefield of ideas.
      *   *The "Glorious Liberty Document":* Use the phrase. Explain that Douglass didn't think the *country* was free, but the *tool* was available to make it free.
      *   *Conclusion:* The oath is the bridge. Douglass claimed the Constitution for the enslaved; now the new citizens claim it for themselves.

  5.  **Refining the Tone:**
      *   *Avoid:* Preachy patriotism, simplistic "America is great" narratives, ignoring the horror of slavery.
      *   *Include:* Nuance, the idea of *work*, the idea of *interpretation*.
      *   *Check:* Did I mention Lysander Spooner? Maybe too specific for a general audience, but I can allude to "legal arguments" or "close reading." Let's stick to the core logic: Text vs. Intent. The prompt says "from the text alone, not the framers' intentions." I need to make sure that distinction is clear.

  6.  **Self-Correction/Polishing (Mental Walkthrough):**
      *   *Critique:* Is the legal theory too dense?
      *   *Fix:* Simplify the explanation of the "three-fifths" clause or the "importation" clause. Focus on the word "Liberty" in the Preamble.
      *   *Critique:* Is it too academic for the new citizens?
      *   *Fix:* Anchor every legal point in a human consequence. Douglass changed his mind because he wanted a tool to fight for freedom, not just a moral protest.
      *   *Critique:* Does it satisfy the Judge?
      *   *Fix:* Ensure the distinction between the "framers' intent" (which Douglass rejected as pro-slavery) and the "textual potential" (which he embraced) is explicit. This is the key legal-historical nuance requested.

  7.  **Final Polish:** Check rhythm and cadence. This is a spoken word piece. It needs pauses, emphases, and a strong ending. (e.g., "The Constitution is not a heirloom. It is a tool.")

  8.  **Final Review against Prompt:**
      *   Keynote at Naturalization? Yes.
      *   July 4th? Yes.
      *   Judge/Historians satisfied? Yes (specific focus on 1851 shift and textualism).
      *   New Citizens moved? Yes (focus on agency and ownership of the document).
      *   No flattening? Yes (acknowledges the "covenant with death" phase).

  *(Self-Correction during drafting)*: I need to make sure I don't imply Douglass thought the work was done. He called it a liberty document *potential*. I must emphasize the active verb: "secure the Blessings."

  9.  **Final Output Generation** (Proceeding to write the speech based on these thoughts).
answer: |-
  **Title:** The Tool and the Promise
  **Occasion:** Fourth of July Naturalization Ceremony
  **Speaker:** Keynote Speaker

  Your Honor, distinguished guests, and most importantly, the 150 individuals who are about to become our fellow citizens:

  Welcome.

  Today is the Fourth of July. In American memory, this is a day of fireworks and parades. But for many of us, it is also a day of complex feelings. We celebrate a birth, but we acknowledge that the child was born with a original sin. There is no one who understood that tension better than Frederick Douglass.

  When most people think of Douglass and the Fourth of July, they think of the thunder. They think of his 1852 speech in Rochester, where he asked, "What to the Slave is the Fourth of July?" They remember the anger. And they should. That anger was righteous. It was necessary.

  But Your Honor has asked me to look at a different part of Douglass's journey. A part that is quieter, but perhaps more relevant to you, the new citizens, standing here today.

  Because before Douglass was the man who called the Constitution a "glorious liberty document," he was the man who called it something else entirely.

  In the 1840s, Douglass stood with the abolitionist William Lloyd Garrison. They looked at the Constitution and they saw the math of slavery. They saw the Three-Fifths Clause. They saw the Fugitive Slave Clause. They saw a document that protected the property rights of slaveholders. And so, Douglass agreed with Garrison: The Constitution was, in their words, "a covenant with death, and an agreement with hell."

  For a decade, Douglass argued that the only moral thing to do was to reject the Union. To break it apart. To wash his hands of a legal system built on bondage.

  But then, around 1851, Douglass changed his mind.

  This was not a small shift. It was a rupture. He broke with his closest allies. He risked his funding and his reputation. And he did it because of a close, careful reading of the law.

  Douglass realized that if you looked at the *intent* of the Framers, yes, many were slaveholders. But if you looked at the *text* itself—the actual words on the page—the word "slave" does not appear. Not once. The word "slavery" does not appear. Instead, the text uses euphemisms: "person held to service," "importation of such persons."

  Douglass argued that the Constitution did not guarantee slavery; it merely tolerated it temporarily. But the Preamble? The Preamble stated the permanent goal: "to secure the Blessings of Liberty to ourselves and our Posterity."

  He concluded that the Framers' intentions were fallible, but the text was a tool. And a tool can be picked up by different hands.

  He wrote: "Interpreted as it ought to be interpreted, the Constitution is a GLORIOUS LIBERTY DOCUMENT."

  Note his phrasing. He did not say America *was* free. He did not say the work was done. He said the Constitution *could be interpreted* to make us free. He moved from rejecting the system to mastering it. He realized that citizenship was not just a status you hold; it is a leverage you use.

  And that brings me to you.

  In a few moments, you will raise your right hand. You will take an oath. That oath is not to a flag. It is not to a president. It is to the Constitution of the United States.

  Some of you come from places where the law is a weapon used *against* the people. In those places, the text is fixed, the outcome is predetermined, and justice is a favor granted by the powerful.

  Here, Douglass teaches us something different. He teaches us that the law is a battlefield of ideas. He teaches us that the text belongs to those who read it, argue over it, and demand that it live up to its own preamble.

  When you become a citizen, you are not inheriting a finished monument. You are inheriting a workshop.

  There will be times when this country falls short. There will be times when the reality of our streets does not match the promise of our Preamble. When that happens, you have two choices. You can do what the young Douglass did: you can decide the system is corrupt and walk away from it. Or, you can do what the mature Douglass did: you can decide the system is yours to fix.

  Douglass realized that the Constitution was not a covenant with death, provided that citizens were willing to be its lifeblood. He realized that "We the People" is not a description of who we are. It is a command for who we must become.

  So, as you stand here on this Fourth of July, do not think of this ceremony as the end of your journey. It is the beginning of your argument.

  You are entering a conversation that started in 1787, that Frederick Douglass joined in 1851, that the suffragettes joined in 1920, that the civil rights leaders joined in 1964. They all looked at this imperfect document and said, "The text says liberty. So we will make it liberty."

  The judge who swears you in today wears a robe that represents the authority of the law. But you? You represent the authority of the citizen.

  Douglass spent a decade believing the Constitution was a wall that kept freedom out. Then he realized it was a door that freedom could walk through—if someone was willing to open it.

  Today, you are given the key.

  Welcome to the argument. Welcome to the work. Welcome to the United States of America.
