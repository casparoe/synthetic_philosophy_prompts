answer: |-
  This is one of the best questions you can ask in theoretical computer science. You have correctly identified that the standard "it's not a theorem because computability isn't defined" explanation is unsatisfyingly circular. It feels like a cop-out.

  You are also right to hone in on Gödel's reaction. That distinction between Church's abstract math and Turing's physical analysis is the key to unlocking what the thesis actually *is*.

  Here is the breakdown of the gears turning underneath that sentence, addressing the Church/Turing split, Gödel's hesitation, and exactly what kind of claim the Thesis is.

  ### 1. The "Gap" isn't Mathematical, it's Semantic
  To understand why it's not a theorem, you have to look at what a theorem requires. A theorem is a statement derived from axioms within a formal system.
  *   **Formal System:** Turing Machines (states, tape, transitions).
  *   **Informal Intuition:** "Effective Calculability" (what a human does with pencil and paper when following a strict method).

  If the Church-Turing Thesis (CTT) were a theorem, it would look like this: *"For all functions $f$, $f$ is effectively calculable if and only if $f$ is Turing-computable."*

  The problem is the left side of that equation: **"Effectively calculable."**
  In math, every term must be defined. "Triangle" is defined. "Prime" is defined. But "Effectively calculable" was a pre-mathematical intuition. It was a fuzzy concept in the heads of mathematicians like Hilbert and Gödel before 1936.

  You cannot prove a formal statement about a fuzzy word unless you first define the fuzzy word.
  *   **Option A:** We define "Effectively calculable" *as* "Turing-computable."
      *   *Result:* The Thesis becomes a tautology (a definition). It's true by fiat. But this feels wrong because we feel like Turing *discovered* something about calculation, not just named it.
  *   **Option B:** We keep "Effectively calculable" as an intuitive notion and claim Turing Machines match it.
      *   *Result:* This is an empirical or philosophical claim, not a mathematical one. You can't prove a match between a math object and a human intuition using only math.

  **The "Thesis" status comes from Option B.** It is a claim that the formal model captures the informal intuition perfectly.

  ### 2. Church vs. Turing: Why Gödel Hesitated
  This is where your research hit the nail on the head.

  **Church (Lambda Calculus/Recursive Functions):**
  Church proposed that "calculable" means "lambda-definable."
  *   **Gödel's Objection:** This is just a mathematical system. Why should I believe that *this specific* algebraic system captures the universal notion of calculation? It feels like a guess. It's like saying "Speed is defined by how fast a specific model of Ford goes." It's arbitrary unless you justify why that Ford represents all cars.

  **Turing (The Machine):**
  Turing didn't just propose a math system. He performed a **conceptual analysis** of the human act of computing.
  *   He asked: "What are the physical limits of a human following a recipe?"
  *   He argued: A human has finite brain states (you can't memorize infinite rules), finite visual field (you can only see one symbol at a time), and discrete time (you do one step, then the next).
  *   He showed that if you accept those physical/psychological constraints, the *only* thing you can do is manipulate symbols on a tape exactly like his machine.

  **Why Gödel changed his mind:**
  Gödel said Turing's paper gave a "definition of epistemic nature." He meant that Turing didn't just guess a model; he analyzed the *concept* of mechanical procedure itself. Turing argued that *any* mechanical process, by definition, must adhere to those physical constraints.

  So, is it a proof? **No, but it's a "Philosophical Proof."**
  Turing proved: *If* you accept that human computation is finite, local, and discrete, *then* it is equivalent to a Turing Machine.
  The "Thesis" part is the assumption that **all** effective computation *must* be finite, local, and discrete. That is not a mathematical truth; it is a claim about the nature of physics and cognition.

  ### 3. So, what kind of claim is it really?
  You asked if it's a conjecture, an empirical claim, or a definition. The answer is a nuanced mix of all three.

  #### A. It is a Mathematical Convergence (Theorem)
  There is a version of CTT that *is* a theorem. It states: *"Turing Machines, Lambda Calculus, General Recursive Functions, and Register Machines all compute the exact same set of functions."*
  This is proven. It shows that the formal concept of "computability" is robust. No matter which formalism you pick, you hit the same ceiling. This gives us confidence that we aren't just looking at an artifact of Turing's specific machine design.

  #### B. It is an Empirical Claim (Falsifiable)
  This is the "Physical Church-Turing Thesis." It claims: *"No physical process in our universe can compute more than a Turing Machine."*
  *   **Falsifiability:** This is crucial. If tomorrow someone builds a "Hypercomputer" (a device that solves the Halting Problem using quantum gravity or some exotic physics), the Thesis is **false**.
  *   Because it relies on the laws of physics (e.g., is space continuous or discrete? Is there a minimum time step?), it is technically an empirical claim about our universe.

  #### C. It is a Definition (In Practice)
  In modern computer science, we effectively treat it as a definition. When we say "algorithm," we implicitly mean "Turing-computable procedure." We have adopted the formalism *as* the definition because the convergence (Point A) and the physical evidence (Point B) are so strong.
  *   **Why this feels unsatisfying:** It feels like we are sweeping the philosophical question under the rug. We are saying, "We define 'computable' as 'TM-computable' so we don't have to argue about it."

  ### 4. Why "One" Thesis and not two?
  You asked why Church and Turing get lumped together if their arguments were so different.

  They are lumped together because **Extensional Equivalence.**
  Even though Church's *argument* was weaker (just a proposal) and Turing's *argument* was stronger (conceptual analysis), the **mathematical output** was identical.
  *   Set of Church-computable functions = Set of Turing-computable functions.

  So the "Church-Turing Thesis" isn't claiming "Church's logic and Turing's logic are the same." It is claiming: **"The intuitive notion of calculation corresponds to this specific mathematical set, which both Church and Turing identified independently."**

  ### 5. Summary: The "Gears" Explanation
  Here is the deepest way to visualize it, avoiding the circular definition trap:

  1.  **The Intuition:** We have a pre-existing idea of "step-by-step calculation" (like long division).
  2.  **The Formalization:** Turing created a mathematical cage (the TM) to trap this idea.
  3.  **The Claim (The Thesis):** "This cage is the perfect size. It lets in everything that is truly a calculation, and it keeps out everything that isn't."
  4.  **Why not a Theorem?** You cannot prove the cage is the perfect size using only the bars of the cage. You have to step outside and compare the cage to the real world.
  5.  **Turing's Contribution:** Turing showed that the bars of the cage are made of the same stuff as the real world (finite brain states, paper, pencil). He made the cage look less arbitrary.
  6.  **Gödel's Acceptance:** Gödel realized Turing hadn't just built a cage; he had analyzed the nature of the animal we were trying to catch.
  7.  **The Loophole:** If the animal turns out to be able to phase through walls (e.g., physical hypercomputation), the cage was too small. That is why it remains a Thesis. It is always vulnerable to a discovery in physics or logic that breaks the constraints Turing assumed.

  **Verdict:** Turing's argument shifts it from a "blind guess" (Church) to a "well-justified identification" (Turing), but it cannot shift it to a "theorem" because it bridges the gap between **Math** (formal systems) and **Reality** (human/physical computation). You can never prove a mathematical map perfectly matches the territory; you can only check it repeatedly and find no errors.

  So, you were right to go down the rabbit hole. The fact that it bugs you means you understand it better than people who just memorize the definition!
