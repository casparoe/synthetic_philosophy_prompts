      *   "Why not just a definition?" (Addressed).

  9.  (Self-Correction during drafting): Make sure to mention that "Computable" *is* rigorously defined now, but *before* the thesis, it wasn't. The thesis is the bridge between the *pre-formal* intuition and the *post-formal* definition.

