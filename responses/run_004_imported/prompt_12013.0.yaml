  3.  **Evaluate Moral Responsibility (The Core Philosophical Issue):**
      *   *Negative Duty vs. Positive Duty:* Generally, we have a duty not to harm (negative). We rarely have a duty to rescue/help unless assigned (positive). Jess had no positive duty.
      *   *Reliance/Expectation:* When someone creates a pattern of behavior that others rely on, stopping without notice can cause harm. This is the crux of the user's feeling.
      *   *Causation:* Did Jess *cause* the cancellation? Technically, the 8 kids caused it by missing the deadline. Jess just didn't prompt them.
      *   *Capacity:* Could Jess have sent the text? Yes, but she had family issues. Does personal hardship excuse social obligations? In unofficial contexts, yes.

  4.  **Synthesize the "Difference" the User is Feeling:**
      *   The difference isn't *responsibility* (liability); it's *causal influence* and *social expectation*.
      *   Jess had more *influence* over the outcome than a random student.
      *   However, influence $\neq$ obligation.
      *   The anger is misdirected. It's frustration looking for a target.

  5.  **Drafting the Response:**

      *   **Validate the User:** Acknowledge that their confusion is normal. It's a classic ethical dilemma (omission vs. commission, social norms vs. formal rules).
