      *   **Address the "Family Stuff":** This is crucial. Even if she *had* a soft obligation, personal crisis trumps a group chat reminder.
      *   **Conclusion:** The friend is right about fairness, but the user is right about *social dynamics*. The anger is misdirected frustration.

