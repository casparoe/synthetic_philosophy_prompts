      *   **Outcome:** 8 kids missed the deadline (vs. usual 1-2). Trip cancelled.
      *   **Reaction:** Students are angry at Jess, subtweeting her, blaming her.
      *   **The Conflict:** The user's friend argues Jess isn't responsible because she wasn't officially assigned the task, and everyone else (150 kids, teachers, office) also didn't ensure the deadline was met. The user feels there *is* a difference between Jess and a random student but can't articulate it.
      *   **Question:** Is the friend right (singling Jess out is unfair), or is there a real moral/practical difference making Jess more responsible?

  2.  **Deconstruct the Arguments:**

      *   **Friend's Argument (The "Official Duty" View):**
          *   Responsibility lies with official channels (teachers, office).
          *   Responsibility lies with individuals (each student knows their own deadline).
