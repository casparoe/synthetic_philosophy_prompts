answer: |-
  This is a really classic ethical dilemma that touches on the difference between **formal responsibility** and **social expectation**. Your confusion is completely valid because there are two different "truths" happening at the same time here.

  Here is the breakdown of why your friend is logically right, why your gut feeling isn't crazy, and why the anger at Jess is ultimately misplaced.

  ### 1. Why your friend is right (The Ethical View)
  Your friend is correct about **moral obligation**. In ethics, there is a distinction between *doing harm* and *allowing harm to happen by not acting.*

  *   **No Contract:** Jess never signed up for the job. No teacher assigned it, and no one voted her in. She cannot be held accountable for a role she never accepted.
  *   **Individual Agency:** The 8 students who missed the deadline are the actual cause of the cancellation. They are 10th graders; they are old enough to manage a deadline.
  *   **Institutional Duty:** The teachers and the front office are the adults. Managing field trip logistics and ensuring compliance is literally their job description, not a 15-year-old's.

  If we accept the students' logic that "Jess is responsible because she usually sends the text," we are saying that once you do a nice thing twice, you are enslaved to it forever. That sets a terrible precedent for kindness. If I help my neighbor carry groceries once, am I responsible if their back hurts next week because I wasn't there to help? No.

  ### 2. Why you feel differently (The Social View)
  You feel like there is a difference between Jess and a random student, and you are right—but that difference is about **influence**, not **responsibility**.

  *   **Established Norms:** Humans run on patterns. Because Jess did this for two years, a social norm was created. The grade subconsciously outsourced their memory to her.
  *   **Reliance:** Some students likely *did* rely on that text. They might have thought, "I'll do it when Jess texts." When she didn't, they forgot.
  *   **The Counterfactual:** If a random kid didn't send a text, the outcome would likely be the same. If Jess *had* sent the text, the outcome likely would have been different (based on past years).

  So, the difference you are sensing is **causal leverage**. Jess had more power to prevent the disaster than a random student. But having the *power* to stop something doesn't mean you have the *duty* to stop it, especially when it's not your job.

  ### 3. The Real Villain: The "All-or-Nothing" Rule
  The reason everyone is so angry and looking for someone to blame is that the school's rule is fundamentally flawed.

  *   **Collective Punishment:** Punishing 142 responsible kids because 8 kids forgot a slip is bad management. It creates a pressure cooker where students feel victimized.
  *   **Scapegoating:** When people feel powerless (because the school cancelled the trip), they look for a target they can attack. They can't yell at the principal, and they can't easily yell at the 8 kids who forgot. Jess is the perfect scapegoat: she is visible, her action (or lack thereof) is known, and she is a peer.

  The anger at Jess is actually **misdirected anger at the school administration.** It is much easier to subtweet a classmate than to fight the school's policy.

  ### 4. The "Family Stuff" Factor
  This is the most important part. Even if we argued that Jess had a "soft obligation" because she created an expectation, **personal crisis trumps social convenience.**

  She was dealing with family issues. In the hierarchy of importance, a 10th-grade aquarium trip permission slip reminder is at the very bottom. Expecting her to prioritize the group chat over her family life during a hard time is incredibly selfish of the grade.

  ### The Verdict
  **Your friend is right.** Singling Jess out does not hold up ethically.

  *   **Is there a difference between Jess and a random kid?** Yes. Jess had more *influence* on the outcome.
  *   **Does that make her responsible?** No. Influence is not obligation.
  *   **Who is actually responsible?**
      1.  **The 8 students** who missed the deadline.
      2.  **The Teachers/Admin** who set a collective punishment rule and didn't manage the deadlines.
      3.  **The Grade** for relying on a peer to do an admin's job.

  The reason it "feels wrong" to you is that Jess broke a social pattern, and humans hate broken patterns. But breaking a pattern isn't a moral crime. The grade is mad because they feel let down, but they were let down by a system that relied on a child to manage adult logistics, not by Jess herself.

  **How to think about it:** Jess was the canary in the coal mine. Her not sending the text didn't kill the trip; it just revealed that the trip was already doomed because the system was too fragile to function without a volunteer reminder. Blaming her is like blaming the canary for the gas.
