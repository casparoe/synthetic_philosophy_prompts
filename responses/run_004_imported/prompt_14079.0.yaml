prompt: |-
  Ok, weird one for you. I'm on the board of a small science-journalism co-op, and our last president election was a mess: three candidates, plain plurality vote, and the winner (Leo, ~34%) would apparently have lost head-to-head to either of the other two — he only won because they split the reform-minded vote. Half the board wants ranked-choice next time to stop that happening again, but our treasurer, a total math nerd, is countering with a long email about Arrow's theorem — something about independence of irrelevant alternatives, and candidates being able to end up loosing by GAINING votes — and pushing for approval voting instead. We vote on the bylaw change in three weeks and everyone's assuming that because I write about science for a living I already understand this. Could you draft the memo I'll actually circulate? It should recommend one specific method, explain the reasoning so a non-math board member can follow it, and take the strongest objection to whatever you pick seriously rather than brushing it off.
