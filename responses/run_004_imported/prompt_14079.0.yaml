answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, Science Journalism Co-op
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Voting System Reform

  **The Problem We Need to Solve**

  As we all know, our last presidential election produced a result that satisfied no one. Leo won with 34% of the vote, despite evidence suggesting a majority of the board preferred either of the other two candidates. This is the classic "spoiler effect": the reform-minded vote was split between two candidates, allowing a candidate with minority support to win.

  We have three weeks to decide on a new voting method for our bylaws. Two camps have emerged: one favoring Ranked-Choice Voting (RCV) to ensure majority support, and one favoring Approval Voting to satisfy mathematical robustness.

  After reviewing the data, consulting with our treasurer, and modeling the outcomes of our last election under different systems, **I recommend we adopt Approval Voting.**

  Below is an explanation of how it works, why it fixes our specific problem, and a serious engagement with the strongest argument against it.

  ***

  ### What is Approval Voting?

  It is arguably the simplest voting system in existence.
  *   **The Rule:** Vote for as many candidates as you approve of.
  *   **The Count:** The candidate with the most total votes wins.
  *   **The Ballot:** Instead of filling in one bubble, you can fill in two, three, or none.

  ### Why This Fixes the "Leo" Scenario

  In our last election, the core failure was that reform-minded voters were forced to choose between two similar candidates. Under our old rules (Plurality), voting for your second choice was wasted.

  Under Approval Voting, a reform-minded member could have voted for *both* reform candidates.
  *   **Leo:** 34% (Votes only for Leo)
  *   **Reform A:** ~66% (Votes for A + B)
  *   **Reform B:** ~66% (Votes for B + A)

  In this scenario, Leo loses decisively. Approval Voting effectively eliminates the spoiler effect without requiring complex ballot counting. It allows voters to express support for a coalition without risking "wasting" their vote on a long shot.

  ### The Mathematical Context

  Our Treasurer raised concerns based on **Arrow's Impossibility Theorem**. Without getting bogged down in the proofs, Arrow demonstrated that no ranked voting system can meet a specific set of fairness criteria simultaneously.

  Specifically, Ranked-Choice Voting (RCV) violates **Monotonicity**. This is the counter-intuitive scenario where a candidate can *lose* an election because they gained *more* support (or win because they lost support). While rare, it is a mathematical certainty in RCV systems. It creates a vulnerability where strategic manipulation is possible.

  Approval Voting is not a ranked system; it is a rated system. Consequently, it sidesteps Arrow's constraints. It is mathematically **monotonic**: voting for a candidate never hurts their chances, and voting against them never helps. For a board that values transparency and defensibility, this is a significant advantage.

  ### The Strongest Objection: The "Majority Mandate"

  The strongest argument against Approval Voting comes from our colleagues advocating for Ranked-Choice Voting. Their concern is valid: **Approval Voting does not guarantee a majority winner.**

  In RCV, the winner is processed through elimination rounds until they hold 50% + 1 of the active ballots. This provides a clear "mandate." In Approval Voting, a candidate could theoretically win with 40% of the vote if the opposition is fragmented and no one approves of more than one person.

  Furthermore, RCV advocates argue that Approval Voting lacks granularity. It treats a "barely acceptable" candidate the same as a "first choice" candidate. They worry this could lead to the election of a "lowest common denominator" candidate—someone no one dislikes, but no one is excited about.

  **Why I believe this is acceptable for our Co-op:**

  1.  **Consensus over Majoritarianism:** We are a co-op, not a national government. Our goal is not to create a ruling majority that can impose its will on a minority, but to find a candidate who is broadly acceptable to the whole board. Approval Voting incentivizes candidates to appeal to the widest possible audience rather than just energizing a base. In a small board environment, a President who is "approved" by 80% of the members is more effective than one who is the "first choice" of 51% and unacceptable to the rest.
  2.  **Strategic Reality:** In practice, voters rarely vote for *everyone*. In small elections where members know the candidates, voters distinguish between "people I'd be happy with" and "people I won't vote for." The fear of a 40% winner assumes a level of voter apathy or fragmentation that is unlikely in a board of our size.
  3.  **Simplicity is Security:** RCV requires complex counting rules (elimination rounds, transfer logic). If a recount is needed, it is difficult to verify manually. Approval Voting is transparent; anyone can verify the count in minutes. For a volunteer organization, reducing administrative friction is a feature, not a bug.

  ### Recommendation

  We need a system that prevents vote-splitting, resists mathematical paradoxes, and is easy to administer.

  Ranked-Choice Voting is a step up from our current system, but it retains mathematical vulnerabilities and adds administrative complexity. **Approval Voting** solves the spoiler effect definitively, aligns with the mathematical constraints raised by our Treasurer, and fits the consensus-based culture of our co-op.

  I move that we amend the bylaws to adopt Approval Voting for all future board elections.

  I am happy to host a 30-minute Q&A next week to walk through ballot examples before we vote.

  Best,

  [Your Name]
  Board Member
