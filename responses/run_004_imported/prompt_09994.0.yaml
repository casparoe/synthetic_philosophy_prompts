answer: |-
  **The Arithmetic of Survival and the Integrity of Action: Evaluating Anscombe on Truman**

  The decision by the United States to drop atomic bombs on Hiroshima and Nagasaki remains the paramount case study in the ethics of war. In 1956, Elizabeth Anscombe intervened in this debate not merely as a philosopher, but as a protester, opposing Oxford University's decision to award Harry Truman an honorary degree. Her pamphlet, "Mr. Truman's Degree," rests on a stark deontological claim: Truman is guilty of murder because he intentionally killed innocent civilians to force a political end. This stance relies on the Doctrine of Double Effect (DDE), which distinguishes between intending harm as a means or end and merely foreseeing harm as a side effect. Against the standard consequentialist defense—that the bombings minimized total suffering by preempting a land invasion—Anscombe argues that good consequences cannot license an intrinsically evil act. While the consequentialist calculus offers a compelling narrative of necessity, Anscombe's argument succeeds in exposing the moral blindness of utilitarian calculation in war. Furthermore, despite objections that the bombings targeted military infrastructure with civilian deaths as mere side effects, the specific nature of atomic warfare in 1945 renders such redescriptions untenable. Therefore, within the logical confines of Anscombe's framework, Truman's decision must be classified as murder.

  To understand why Anscombe's argument succeeds against the consequentialist defense, one must recognize that the two positions operate on incommensurable moral axes. The consequentialist defense, often articulated by historians and utilitarian ethicists, posits that the morality of the bombings is determined by their outcome. The argument is arithmetic: the deaths of approximately 200,000 civilians in Hiroshima and Nagasaki are weighed against the projected casualties of Operation Downfall, the planned invasion of the Japanese home islands. Estimates for the invasion varied, but proponents argue it would have cost hundreds of thousands of Allied lives and millions of Japanese lives, both military and civilian. From this vantage point, the bombings were a tragic necessity, the "lesser of two evils" that secured a net preservation of human life.

  Anscombe rejects this arithmetic entirely. In "War and Murder," she argues that certain actions are intrinsically forbidden, regardless of their consequences. For Anscombe, the intentional killing of the innocent is murder, and murder cannot be committed licitly even to save the world. Her critique succeeds against consequentialism not by disproving the casualty estimates, but by challenging the moral agency of the actor. Consequentialism treats human lives as fungible units in a calculation, stripping the decision-maker of the constraint against *doing* evil. Anscombe forces the interlocutor to acknowledge that there is a difference between what happens to the world (the death toll) and what an agent chooses to do (the act of killing). If the consequentialist defense is accepted, Anscombe argues, there is no limit to the atrocities that can be justified by a sufficiently dire projection of the future. By insisting that the integrity of the moral agent matters as much as the outcome, Anscombe's argument pierces the utilitarian shield; it demonstrates that the consequentialist defense does not justify the act, but rather bypasses the question of the act's inherent nature.

  However, the most serious challenge to Anscombe's verdict of "murder" is not the consequentialist calculus, but an internal objection based on her own Doctrine of Double Effect. Critics argue that Hiroshima and Nagasaki were legitimate military targets. Hiroshima housed the Second General Army headquarters, and Nagasaki was a major port with industrial significance. On this reading, Truman's intention was to destroy military capacity and infrastructure; the deaths of the civilians residing there were foreseen with certainty, but not intended. If the civilian deaths were merely side effects of attacking legitimate targets, the DDE would permit the action, and the charge of murder would collapse.

  This objection, while logically coherent in abstract just war theory, fails when applied to the material reality of the atomic bomb in 1945. For the DDE to apply, the bad effect (civilian death) must not be the means by which the good effect (military victory) is achieved. In conventional tactical bombing, a munitions factory is destroyed, and nearby workers may die; the victory comes from the loss of munitions, not the loss of workers. However, the strategic logic of the atomic bombings was fundamentally different. The United States Strategic Bombing Survey and contemporary military documents indicate that the selection of targets was explicitly driven by the desire to demonstrate overwhelming destructive power to shock the Japanese leadership into surrender. The "military" value of the cities was secondary to their value as psychological levers.

  Anscombe anticipates this nuance. She classifies the bombings as "terror bombing," where the destruction of civilian life is not a side effect but the very mechanism of coercion. Because the atomic weapons of 1945 were area-of-effect devices with limited accuracy, the destruction of the military headquarters was inseparable from the obliteration of the civilian population. One could not destroy the former without the latter. More critically, the *purpose* of using such a disproportionate weapon was to make the cost of continuing the war visibly unbearable. The suffering and death of the civilians were not incidental; they were the message sent to Tokyo. If the civilian deaths serve as the pressure point to force surrender, they are intended as a means. Therefore, the redescription of the targets as "military" does not save Truman from Anscombe's charge. The means chosen made the killing of innocents constitutive of the act's success, violating the core prohibition of the DDE.

  One might further object that the intending/foreseeing distinction is too fragile to bear this moral weight. If Truman would have dropped the bomb even if the cities were empty of civilians (to destroy the infrastructure), does that not prove he intended the destruction of the base, not the people? This counterfactual is historically dubious. The target selection committees specifically chose cities that had not yet been firebombed, in order to assess the atomic weapon's full potential against a "fresh" urban environment. The presence of civilians was a feature, not a bug, of the target selection. Consequently, the distinction holds: the deaths were not merely foreseen regrets; they were instrumental to the strategic goal of psychological coercion.

  Ultimately, evaluating whether Truman's decision counts as murder in Anscombe's sense requires accepting her premise that morality places absolute constraints on action that transcend outcome optimization. If one accepts that premise, the consequentialist defense is irrelevant, as it appeals to a metric (total lives saved) that Anscombe deems morally inadmissible for justifying murder. Furthermore, the attempt to salvage the decision through the Doctrine of Double Effect fails because the nature of atomic warfare collapsed the distinction between military target and civilian population. The weapon's indiscriminate power, combined with the strategic intent to coerce through shock, meant that the deaths of the innocent were the means to the end, not a side effect.

  Therefore, Anscombe's argument succeeds. It successfully isolates the moral structure of the decision from the fog of war and casualty projections. While one may reject Anscombe's absolutism in favor of a consequentialist worldview, one cannot deny that within her framework, the classification is robust. Truman intentionally employed a method of warfare where the mass death of non-combatants was the instrument of victory. In refusing to allow the magnitude of the good consequence to wash away the nature of the act, Anscombe forces a confrontation with a uncomfortable truth: that in the ethics of war, how we kill matters as much as how many live. In Anscombe's sense, the verdict stands: the decision was an act of murder.
