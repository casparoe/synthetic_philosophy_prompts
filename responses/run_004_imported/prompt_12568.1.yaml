answer: |-
  To ground your scene in G. E. Moore's *Principia Ethica* (1903) rather than contemporary AI discourse, we must apply his specific method of "isolation" and his rigorous distinction between *intrinsic* value (good in itself) and *instrumental* value (good as a means). Moore's ethical system rests on two pillars relevant to your characters: first, that intrinsic value resides exclusively in **states of consciousness**; and second, that the value of those states is heavily dependent on the **truth or reality of their objects**.

  Here is the verdict based strictly on Moore's arguments, followed by the philosophical reasoning you can use to inform the subtext of their quarrel.

  ### 1. The Widow and the AI Companion
  **Verdict:** Moore would conclude that the widow's attachment **does not count** as the kind of "personal affection" that is intrinsically good.

  **The Philosophical Ground:**
  For Moore, "personal affection" (one of the two greatest intrinsic goods) is not merely the *feeling* of love within the subject; it is a complex whole consisting of the emotion *plus* the appropriate object. In Chapter VI, Moore argues that the value of a state of consciousness is diminished if it is based on a false belief about reality.

  He uses the example of a world where you believe your friends love you, but they are actually deceiving you. He concludes that this state is less valuable than one where the love is real, even if the *feeling* in your mind is identical. The "reality of the object" is a necessary condition for the highest form of intrinsic good.

  *   **The Application:** The widow's state of consciousness involves the belief that she is interacting with another mind, another "person" capable of reciprocal affection. Since the AI is, ontologically, a mechanism without consciousness, her belief is false.
  *   **The Result:** While her experience may have *instrumental* value (it comforts her, reduces loneliness), it lacks *intrinsic* value in Moore's strict sense. It is a simulacrum of affection. Moore would classify this as a "false belief" contaminating the state of consciousness. She is loving a thing, not a person. Therefore, she is deprived of the specific intrinsic good of "human intercourse," regardless of how vivid her emotional experience feels.

  ### 2. The Brother and the Machine-Generated Sculptures
  **Verdict:** Moore would conclude that the sculptures **can possess** the sort of beauty that is valuable in itself, provided they exhibit "organic unity."

  **The Philosophical Ground:**
  Moore's aesthetic theory focuses on the *contemplation* of the object, not necessarily the *labor* of its production. In *Principia Ethica*, the intrinsic good is the "enjoyment of beautiful objects." This requires two things: a beautiful object (defined by "organic unity"—the harmonious relation of parts to a whole) and a conscious mind apprehending it.

  Moore does not explicitly tie the value of the beauty to the *humanity of the creator*, but rather to the *qualities of the object* and the *truthfulness of the contemplation*.

  *   **The Application:** If the machine-generated sculptures possess "organic unity" (they are formally coherent, harmonious, and complex), they qualify as beautiful objects. The brother's role is that of the *contemplator* who recognizes this beauty and selects it. His act of selection is an exercise of taste, which is a cognitive state.
  *   **The Caveat:** The value depends on the brother's own consciousness of the truth. If he contemplates the work *knowing* it is machine-made, his state of consciousness is valid (True Belief + Beautiful Object). If he deceives the public into believing he carved them by hand, he introduces falsehood into *their* contemplation, diminishing *their* aesthetic experience. But regarding the *sculptures themselves* and the *brother's* appreciation of them: the origin is irrelevant to the formal beauty.
  *   **The Result:** Unlike the widow, whose object (the AI) lacks the necessary reality (personhood) to support affection, the brother's object (the sculpture) possesses the necessary reality (physical form/organic unity) to support aesthetic contemplation. The machine is merely a tool, akin to a chisel that moves itself. The beauty resides in the form, which is real.

  ### Summary for the Quarrel
  This creates a profound asymmetry for your scene, which moves beyond the modern "who is more artificial?" debate into a Moorean "who has access to reality?" conflict.

  *   **The Widow's Tragedy (Moorean View):** She possesses the *emotion* but lacks the *reality*. She is living in a "beautiful world unseen," or rather, a "loving world unreturned." Her life feels good, but ethically, it is built on an illusion. Moore would say she is missing the very thing that makes affection valuable: the other soul.
  *   **The Brother's Triumph (Moorean View):** He possesses the *reality* but perhaps lacks the *struggle*. He is contemplating real beauty. However, if he claims authorship he didn't earn, he is corrupting the *truth* condition of the viewers' experience. But if he is honest (merely a curator), his life contains more intrinsic good than hers: he is in contact with actual beauty, whereas she is in contact with a simulation of love.

  **The Philosophical Punchline:**
  If they argue strictly on Moorean grounds, the brother wins the claim to a "good life." Moore prioritizes **Truth** almost as highly as Beauty and Affection. The widow's life is fundamentally false (the AI is not a person); the brother's life is fundamentally true (the beauty is real, even if the method is automated). The widow is loving a mirror; the brother is curating a window. Moore would argue the window is better, even if the mirror feels warmer.
