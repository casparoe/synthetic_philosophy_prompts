answer: |-
  The chair was molded plastic, cold enough to seep through Elias's jumpsuit. Across the table, the three members of the parole board sat behind a raised drape of wood, their faces illuminated by the harsh hum of fluorescent lights. They had his file open. Thick. Red stamps. Dates stretching back fifteen years.

  "Mr. Vance," the central commissioner said, tapping a pen against a photograph of a burned-out building. "The psychologists say you're rehabilitated. You've earned your GED. You've completed the anger management modules. You've even mentored younger inmates."

  Elias nodded. "Yes, sir."

  "That suggests effort," the commissioner continued, leaning forward. "Intentional change. Can you tell us when you decided to become a different person?"

  Elias opened his mouth, but the answer snagged in his throat. *When?* He could point to a day. Three years ago, in the library. He'd picked up a biography of Malcolm X. He'd read a paragraph about discipline, and something in his chest had unclenched. But why that book? Why not the one next to it? Because his eyes were drawn to the bold font. Why were they drawn to the bold font? Because his mother used to read bold titles to him when he was four, before she left.

  But why did her voice matter to him? Because he was wired to crave stability. Who wired him? The combination of his father's temper and her absence. He didn't choose that combination. He didn't choose the neurochemistry that made him respond to stability with relief rather than boredom.

  "I don't know," Elias said.

  "You don't know when you decided to stop burning things?" The commissioner's voice tightened. "That's a significant shift, Mr. Vance. We need to know you're in control of this new behavior. That it's not just... compliance."

  "It's not compliance," Elias said. He felt the urge to argue, a heat rising in his neck. He suppressed it. Why? Because he valued freedom more than victory today. Where did that value come from? A guard, five years ago, who treated him with decency when Elias didn't deserve it. Elias had wanted to emulate that decency. But why? Because he felt shame when he was cruel. Who taught him shame? Biology? Society? A god he didn't believe in?

  He looked at his hands. They were the same hands that had held the Molotov cocktail. The muscles, the scars, the fingerprints—unchanged. The mechanism was identical. Only the input had shifted.

  "I wanted to be better," Elias said.

  "But why?" The commissioner pressed. "Why did you want that? Some men in here want to be better. Some want to be stronger. Some want revenge. You chose 'better.' What made you choose that?"

  Elias closed his eyes. He tried to find the moment he chose the desire itself. He imagined stepping back, behind his own eyes, to the control room where the decision was made. He looked for the lever labeled *Choose Values*. But when he pulled it back, he found another room behind it. And behind that, another.

  He saw himself at ten, stealing food. He felt the hunger. He hadn't chosen the hunger.
  He saw himself at twenty, lighting the fire. He felt the rage. He hadn't chosen the rage.
  He saw himself at thirty-five, reading the book. He felt the hope. He hadn't chosen the hope.

  Every motive he possessed was a gift or a curse handed to him by someone else, by chance, by the roll of genetic dice before he was born. Even this desire to be released, to be judged worthy—it was just a survival instinct dressed up in morality. He was a river claiming credit for the shape of the canyon it carved, forgetting the rain and the gravity that pushed the water down.

  "I didn't choose it," Elias whispered.

  The room went silent. The commissioner frowned. "Excuse me?"

  "I didn't choose it," Elias said, louder this time. He didn't mean the crime. He meant the self. The self that sat here, hoping. The self that regretted. "I woke up one day and I was different. Like a fever broke. I didn't pick the fever, and I didn't pick the cure."

  "That sounds like evasion," the commissioner on the left said, scribbling notes. "If you take no credit for the change, how can we trust you'll maintain it?"

  Elias looked at them. He wanted to tell them that trust was just a prediction based on past data, nothing more. He wanted to tell them that praise and blame were just tools to shape future behavior, not judgments on some soul that existed outside of cause and effect. But he saw the way they looked at him—waiting for a ghost to step out of his body and sign a contract. They needed him to be the author. He was just the paper.

  "You can't trust me," Elias said softly. "You can only bet on me."

  The commissioner sighed, closing the file. The sound was final, like a coffin lid. "We'll review your file again in twelve months. Continue your programs, Mr. Vance. Try to make better choices."

  Elias stood up. The guards moved in. As they handcuffed him, he wondered who would be doing the trying next year. Would it be him? Or just the next version of him, pushed along by whatever wind happened to blow through the cell block?

  He walked out of the room, carrying the weight of a life he never started, toward a future he wouldn't write.
