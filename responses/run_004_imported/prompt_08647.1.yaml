      *   *Decision:* The parole hearing is actually very strong because it hinges on *reform*. Did the prisoner *choose* to change? Or did the change happen *to* them? This fits Strawson's regress perfectly (you changed because you wanted to, but you didn't choose to want to). Let's stick with the user's idea but refine the execution to avoid dialogue dumps.

