      *   *Critique:* The word "fiction" is the danger zone. Berkeley would hate calling ideas "fictions." He calls them "real things." If money is like ideas, money is *real* when circulating. The draft says "the fiction is doing exactly the work." This might be the weakest philosophical link.

  5.  **Evaluate Point (c): The Fiat/Stablecoin Analogy:**
