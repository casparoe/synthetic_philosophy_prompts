      *   *Premise 2:* Berkeley's *The Querist* argues money is a "ticket/counter" representing labor/industry, not intrinsic gold value.
      *   *Claim:* These are the "identical move" applied to different domains (ontology vs. economics). Value is to exchange as existence is to perception (both rely on a shared system/trust).
