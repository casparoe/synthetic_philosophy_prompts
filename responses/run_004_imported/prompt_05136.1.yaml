      *Self-Correction on Marcus:* Marcus says "if he has actually rewritten his own memory... he's not lying." Arendt would likely say: If he *initially* lied to gain power, and *then* believed it, the initial act was a lie. If he *always* believed it despite evidence, he's delusional, but in politics, insisting on delusion against facts is still a form of deception because it demands the public accept falsehood. Arendt is harsh on those who sacrifice truth for consistency.

