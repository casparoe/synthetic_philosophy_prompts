      *   **Section 1: The Indirect Duty View & Its Flaws.** Explain Kant's position (animals as means, cruelty damages human character). Critique it: It makes moral action contingent on empirical psychology (will cruelty *actually* make me hurt humans?). It creates a fictional moral stance.
      *   **Section 2: The Korsgaardian Turn.** Explain her argument. It's not about *rationality* per se, but about *having a good*. Animals are "ends-in-themselves" because they have a subjective good that matters *to them*. To deny this is to deny the basis of value itself.
