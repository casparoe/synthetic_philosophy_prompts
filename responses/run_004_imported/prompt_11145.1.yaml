        "comment": "Reflection is a good choice, but the relationship is reversed (standard view: PP is a special case of Reflection). Analysis of 'separate problems' is too dismissive of Reflection's specific diachronic paradoxes."
      }
    ]
  }
  ```

  ### TA-to-TA Note
  The "Lewis = Frequentist" error is the grade-definer here. If this were an intro undergrad course, I might let it slide as a simplification, but for a grad seminar on formal epistemology, confusing BSA with frequentism suggests they haven't grasped *why* Lewis needed the Principal Principle in the first place (i.e., to bridge the gap between Humean facts and normative credence).

  Good luck with the rest of the stack. And seriously, regarding the genetic test: Lewis's PP is a norm for ideal agents; giving yourself grace on the "gut" part is rationally permissible even if it violates the principle.
