      *   Maintain a respectful but critical tone.
      *   Check flow and transitions.

  6.  **Writing the Essay:** (Proceeding to generate output based on these thoughts.)
      *   *Key Insight to highlight:* The distinction between *being* a formal system and *knowing which one* you are.
      *   *Key Reference:* Chalmers' "Minds, Machines, and Mathematics" is the standard refutation. I should allude to that line of reasoning without necessarily name-dropping too much academic jargon.

  7.  **Final Review against constraints:**
      *   CS background respected? Yes.
      *   Lucas vs. Penrose distinction clear? Yes.
      *   Verdict reached? Yes.

  *(Self-Correction on Verdict)*: I need to be careful not to say "Mechanism is True." I need to say "The Argument *against* Mechanism fails." That is a crucial distinction. The essay is about the success of the *argument*, not the truth of the *conclusion*.

