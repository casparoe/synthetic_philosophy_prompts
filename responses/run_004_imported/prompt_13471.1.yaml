              3.  If we know $F$ is sound, we can assert $G(F)$ (since soundness implies consistency, and soundness implies $G(F)$ is true).
              4.  But $F$ cannot assert $G(F)$.
              5.  Therefore, $F$ does not capture us.
          *   *Refinement:* Penrose tries to block the "we don't know $F$ is sound" escape route by arguing that if $F$ *is* us, we *must* be able to know it's sound (because we trust our own reasoning).
