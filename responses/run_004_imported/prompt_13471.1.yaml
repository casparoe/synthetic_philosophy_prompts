          *   Step: If I know I am $F$, and I trust my reasoning, I know $F$ is sound.
          *   Step: If I know $F$ is sound, I can see $G(F)$ is true.
          *   Step: $F$ cannot see $G(F)$.
          *   Contradiction.
      *   **Section 3: The Mechanist's Counter-Thrust (The Unknowability Escape):**
          *   The core objection: Why must the knowledge "I am $F$" be accessible?
          *   Analogy: A program doesn't know its own source code.
          *   The "Complexity" argument: $F$ might be too complex for us to comprehend as a whole.
