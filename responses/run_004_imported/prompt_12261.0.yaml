          *   *Likely Defense:* The constraints aren't arbitrary; they reflect our considered judgments about fairness and moral personality. It's reflective equilibrium, not deduction from nowhere.
          *   *Follow-up:* Ask if this makes the OP a heuristic device rather than a justificatory foundation. If it just mirrors our intuitions, what work is it actually doing?

      *   **G.A. Cohen's Incentives Critique:**
