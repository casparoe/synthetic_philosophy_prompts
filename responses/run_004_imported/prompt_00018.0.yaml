      *   *MIRI/LDT (2010s):* Prashant, Yudkowsky, Herreshoff, etc. Developed "Modal Combat." $FairBot$ (in the LDT sense) uses provability logic ($\square$). $PrudentBot$, $CliqueBot$, etc.
      *   *Connection:* They are deeply related. Tennenholtz's setup is the *mechanism* (source code access). LDT provides the *logic* for reasoning within that mechanism without brittle equality checks.
      *   *Key Distinction:* Equality checks ($P = Q$) vs. Provability checks ($\square (P(Q)=C \land Q(P)=C)$).
