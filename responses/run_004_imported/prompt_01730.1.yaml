      *   The Ch. 5 argument shows $\neg (Kp \rightarrow KKp)$.
      *   To get Ch. 5 from Ch. 4, you treat $Kp$ as the condition $C$.
      *   *Resistance:* The MFE principle for $C$ (phenomenal) is justified by *discriminatory limitations of consciousness*. The MFE principle for $Kp$ is justified by *modal safety of factive states*.
