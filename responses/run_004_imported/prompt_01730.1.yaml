      *   **Thesis:** The inference fails because Ch. 4 targets *unstable* phenomenal conditions, while Ch. 5 targets *stability-defined* epistemic conditions.
      *   **Step 1:** Analyze Ch. 4 MFE (Reliability on shifting truth conditions).
