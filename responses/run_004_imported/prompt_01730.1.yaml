  7.  (Self-Correction during drafting): I need to be careful not to just assert Internalism. Williamson rejects Internalism. The argument must show why *even granting Williamson's externalist framework*, the move from 4 to 5 isn't automatic.
      *   *Adjustment:* The argument should focus on the **stability of the condition**. $C$ (feeling cold) is unstable across close worlds (temperature fluctuates). $Kp$ (knowledge) is *defined* by stability across close worlds (Safety).
      *   Therefore, applying a Sorites argument to an unstable condition (Ch. 4) yields different results than applying it to a stability-defined condition (Ch. 5).
