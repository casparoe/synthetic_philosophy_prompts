answer: |-
  **Setting:** *A sterile conference room at St. Jude's Memorial Hospital. The Ethics Board is in session. On the table lies a single file: "Case 409: Kidney Allocation." Two patients, identical medical priority, identical life expectancy post-transplant. Two proposed allocation mechanisms.*

  **Characters:**
  *   **Marcus Chen:** Chair of the Ethics Board.
  *   **Dr. Aris Thorne:** Health Economist. Defender of Harsanyi's Aggregation Theorem.
  *   **Prof. Elena Vance:** Moral Philosopher. Defender of Peter Diamond's Critique.

  **Chen:** We have one kidney. We have two patients, Mr. A and Mr. B. Medically, they are indistinguishable. The medical team has presented two methods for deciding who receives it. Method One is a public coin flip. Method Two is a Multivariate Matching Algorithm. The Algorithm is opaque, but we have verified mathematically that it yields a 50/50 probability for each patient. Both patients have stated they are indifferent between the methods; they only care about the odds. We need to select a procedure. Dr. Thorne, you have the floor.

  **Thorne:** Thank you, Marcus. This is straightforward. We are bound by the Pareto principle. If every individual involved is indifferent between two options, the social planner must also be indifferent. Mr. A and Mr. B are rational agents. They understand probability. They know both methods offer them a 50% chance of survival. Therefore, their expected utility is identical under both methods. Since the social welfare function is simply a weighted sum of their individual utilities, the social value of the Coin Flip is identical to the social value of the Algorithm. To prefer one over the other is to impose a preference the patients do not hold. I recommend we use the Algorithm, as it integrates better with our digital records.

  **Vance:** I object. Dr. Thorne is treating the allocation as a calculation of *expectations*, but justice is about the *structure* of the decision. Harsanyi's theorem assumes that all that matters is the final vector of expected utilities. Diamond showed us that this ignores the moral significance of the states of the world themselves.

  **Thorne:** "Moral significance" is vague, Elena. Cash it out. If it doesn't affect the patients' well-being, whose well-being does it affect?

  **Vance:** It affects the moral relationship between the institution and the citizens. The coin flip is a public ritual of equality. It acknowledges that both patients have an equal claim *right now*. The Algorithm, even if statistically 50/50, is a black box. It treats the patients as inputs in a function they cannot comprehend. Harsanyi forces you to be indifferent between a transparent lottery and an opaque one, provided the odds match. But procedural fairness isn't reducible to odds. It's about how we treat people in the moment of decision.

  **Thorne:** You're smuggling preferences back in. If the patients value "transparency" or "ritual," that should be part of their utility function. If they say they are indifferent, then by definition, they do not value the ritual enough to change their ranking. If you, the planner, value it *for* them, you are violating the sovereignty of their preferences. You are acting paternalistically. Harsanyi's theorem protects us from exactly that: a planner saying, "I know what's fair better than you know what's good for you."

  **Vance:** That's a strong point, Aris, but it misses Diamond's specific critique. Diamond isn't just saying the patients have hidden preferences. He's arguing that the *social welfare function itself* should not be linear. Harsanyi proves linearity only if you accept the Pareto principle over lotteries. But why should we accept that?

  Imagine two states of the world. State 1: A gets the kidney, B dies. State 2: B gets the kidney, A dies. Under the coin flip, we know exactly why we are in State 1 or State 2: chance. Under the Algorithm, we are in State 1 because of a hidden variable. Even if the *ex-ante* probability is the same, the *ex-post* evaluation differs. A society that uses a coin flip accepts that fate decided. A society that uses the Algorithm accepts that a formula decided. Diamond argues we should evaluate the welfare in each state separately, not just the average. We care about the inequality in the outcome, and the procedure signals how we regard that inequality.

  **Thorne:** But if you evaluate states separately, you open the door to inconsistency. If you deviate from expected utility, you become susceptible to Dutch books. You can be pumped for money. If the Ethics Board values the Coin Flip higher than the Algorithm, I can construct a series of trades where the Board pays to switch from Algorithm to Flip, and then pays to switch back, bleeding hospital resources for no gain in patient outcomes. Rationality requires consistency across risks. If the outcomes are the same and the probabilities are the same, the valuation *must* be the same. Otherwise, you aren't doing ethics; you're doing superstition.

  **Vance:** It's not superstition; it's about trust and legitimacy. Let's answer your consistency charge. Diamond's model isn't irrational; it just expands the goods being distributed. We aren't just distributing kidneys; we are distributing *hope* and *equal respect*. The coin flip distributes equal respect visibly. The Algorithm does not.

  But let me press you on the Pareto point, Aris. You say if the patients are indifferent, we must be. But what if the patients are adaptive? What if they have learned to be indifferent to opaque systems because they feel powerless? Harsanyi's theorem takes existing preferences as fixed inputs. It doesn't allow the social planner to say, "Your indifference is a symptom of a system that doesn't value your voice." By insisting on the weighted sum of *current* utilities, you freeze existing power dynamics.

  **Thorne:** That is a compelling sociological point, but it undermines your own position. If their indifference is a symptom of powerlessness, then you cannot assume they *would* prefer the coin flip if they were "enlightened." You are positing a hypothetical preference. Harsanyi demands we work with revealed preferences.

  However, I will grant you this: If the Algorithm creates anxiety that lowers their utility, the odds aren't truly 50/50 in terms of *experience*. But the prompt stipulates they are indifferent. So, let's assume perfect information. If they know the Algorithm is fair, why does the coin matter?

  **Vance:** Because "fairness" isn't just a property of the output distribution. It's a property of the process. Here is the crux: Harsanyi's theorem implies that the only thing that matters is the *ex-ante* contract. Once the probabilities are set, the procedure vanishes. But for the loser, the *ex-post* reality is 100% loss. The coin flip offers a specific kind of consolation: "You lost to chance, which treats us all as equals." The Algorithm offers: "You lost to a calculation."

  Diamond's argument is that the social welfare function should be concave, not linear. We should value a situation where the *reason* for the loss is shared fate, rather than hidden calculation. If you sum expected utilities, you ignore the correlation between outcomes and procedures. You are arguing that the *source* of the risk is morally neutral. I am arguing the source of the risk is morally constitutive.

  **Thorne:** "Morally constitutive." That's the phrase I worry about. If the source of risk is constitutive, then we can never aggregate. Every procedure becomes a unique universe. We lose the ability to make policy.

  Let's turn your Diamond critique back on you. You say we should care about the distribution of utility across states. But in this case, the distribution of utility across states is *identical* in both procedures. In both cases, there is a 50% chance of (High Utility, Low Utility) and a 50% chance of (Low Utility, High Utility). The vector is the same. The only difference is the *label* on the randomization device.

  If you prefer the Coin Flip, you are essentially saying that the label "Coin" has intrinsic utility. If so, put that in the utility function! But if you say, "No, it's not in their utility function, it's in *society's* evaluation function independent of them," you are violating the very democratic spirit Harsanyi was trying to protect. You are saying the Planner knows better than the people what constitutes their good. Harsanyi was a utilitarian, yes, but he was a liberal utilitarian. He wanted to aggregate *individual* judgments, not impose a metaphysical view of fairness from above.

  **Vance:** And that is where Harsanyi fails to capture the essence of *social* choice. Society is not just a collection of atoms; it's a structure of relations. The Planner *must* impose a view of fairness from above, because the allocation of scarce life-saving resources is a sovereign act.

  Consider this: If we use the Algorithm, and it turns out later there was a bug, the trust collapses. If we use the Coin Flip, and it lands heads, no one claims the coin was biased. The Coin Flip is a "focal point" of fairness. It solves a coordination problem on moral ground. Harsanyi's theorem treats the Planner as a calculator. Diamond treats the Planner as a judge. A judge cannot be indifferent between a public trial and a secret tribunal, even if the verdicts are statistically identical. The procedure *is* part of the justice.

  **Thorne:** But a judge is bound by evidence. If the evidence says the Algorithm is unbiased, insisting on the coin is irrational. It privileges *appearance* over *reality*. Are we here to do justice, or to perform a theater of justice? If the Algorithm is truly unbiased, it is objectively fair. To reject it because it "looks" opaque is to succumb to bias ourselves.

  Furthermore, your "concave social welfare" argument works for income redistribution, where we care about the final spread. But here, the final spread is binary and identical. One lives, one dies. The only variable is the probability assignment. If you deviate from the linear sum here, you are essentially saying that a 50/50 chance generated by Method A is *objectively better* than a 50/50 chance generated by Method B, independent of human preference. That is a mystical claim. It posits a "Fairness Particle" that the coin emits and the computer does not.

  **Vance:** It's not a particle; it's a commitment. The coin flip is a commitment to *equal agency* in the face of scarcity. It says, "We, the community, hand this to fate because we cannot decide." The Algorithm says, "We, the technocrats, have decided that this formula decides."

  You accuse me of mysticism, Aris, but Harsanyi's linearity is the real magic trick. It assumes that risk is neutral. It assumes that living in a society where life-or-death decisions are made by opaque algorithms is the same as living in one where they are made by public lotteries. Diamond showed that the social evaluation of risk depends on the *nature* of the risk.

  Here is my direct answer to your Pareto challenge: The Pareto principle applies to *private* goods. When we allocate a public good like trust in the medical system, individual indifference is not sufficient. The patients are focused on survival. They are naturally indifferent to the mechanism because they are staring into the abyss. But the Board represents the *system*. We must value the integrity of the system even if the patients, in their desperation, do not. Harsanyi's theorem works for consumer choice; it fails for constitutional choice.

  **Thorne:** And there we have the tension. You want to use this decision to signal a constitutional value. I want to use this decision to save a life efficiently.

  If we adopt your view, Elena, we paralyze the board. Every time we introduce a new, efficient algorithm, we must prove it satisfies a "procedural fairness" metric that is distinct from outcomes. Who defines that metric? You? Me? Harsanyi gives us a way to bypass that endless debate: Look at what the people want. If they don't care about the procedure, neither should we.

  But I hear your worry. If we treat people like numbers, they become numbers. Yet, if we treat procedures like rituals, we risk valuing the symbol over the substance. If the Algorithm saves more kidneys in the long run due to efficiency, but we reject it for a coin flip because of "procedural fairness," have we not harmed the very people we claim to protect?

  **Vance:** And if we accept the Algorithm, and the public perceives it as cold calculation, trust erodes, donations drop, and we lose more kidneys in the long run. Efficiency that undermines legitimacy is self-defeating.

  **Chen:** We seem to be at an impasse. Dr. Thorne argues that without individual preference for the procedure, the Board has no grounds to distinguish them without violating rational consistency and individual sovereignty. Prof. Vance argues that the Board has a duty to uphold procedural justice as a public good, independent of the immediate preferences of the recipients, because the *way* we decide defines the community.

  **Thorne:** Precisely. If we choose the coin, we are lying. We are saying the Algorithm is worse when the math says it's equal.

  **Vance:** No. We are saying the math is incomplete. It counts the lives but misses the living.

  **Chen:** The Board must vote. But before we do... is there any common ground?

  **Thorne:** I will concede this: If the patients *did* express a preference for the coin, Harsanyi demands we follow it. The theorem is only rigid if they are indifferent.

  **Vance:** And I will concede this: If the Algorithm could be made transparent enough to function as a public ritual, the distinction vanishes. The problem isn't calculation; it's opacity.

  **Chen:** Then the question is not Coin vs. Algorithm. It is Transparency vs. Opacity. But the math remains: 50/50.

  *(Chen looks between them. The tension remains unresolved. The mathematical equality clashes with the moral inequality of the processes.)*

  **Chen:** We will adjourn for ten minutes. The Board must decide whether we are aggregating utilities or constituting justice.

  *(Thorne gathers his papers, looking frustrated but resolute. Vance stares at the coin on the table, then at the file. Neither has convinced the other, but the stakes of the disagreement are now perfectly clear.)*

  **[END SCENE]**
