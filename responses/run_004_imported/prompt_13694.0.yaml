answer: |-
  Good evening. For those of you who don't know me, I work with Marcus. For those of you who *do* know me, you know I'm the one he trusts to speak the language, which is a dangerous responsibility given the guest list.

  We are gathered here to mark the end of Marcus's thirty-year tenure at the desk. Now, Marcus has issued specific instructions regarding the rhetoric of this evening. He has made it clear, in no uncertain terms, that if anyone refers to this retirement as a "victory," a "win," or "cashing out," he will consider the evening a failure of rationality.

  To the traders in the room: You understand why. To the family and friends: Let me explain, because this is actually the most romantic thing I can say about him.

  In finance, there is a distinction between the *ensemble average* and the *time average*. The ensemble average is what happens if you take a thousand people, have them all bet on a coin flip, and average their results. Some win big, some go bust, but the average looks great. The time average is what happens if *one* person flips that coin a thousand times. If they go bust once, the game is over. The average doesn't save them.

  Most of the world lives in the ensemble. They optimize for the best possible outcome in a single snapshot. They ask, "How much can I make this year?" Marcus spent thirty years teaching us that this is a category error. He optimized for the time average. He asked, "How do I ensure I am still here to make decisions thirty years from now?"

  He calls this "Geometric Rationality." In technical terms, he maximized the expected logarithm of wealth rather than the expected value. In human terms, he understood that life, like compounding, is multiplicative, not additive.

  If you add your days together, a few spectacular days can make up for a lot of terrible ones. But if you *multiply* your days—where a zero in marriage, or health, or trust wipes out the entire product—then survival isn't just a precaution. It's the whole point.

  There is a joke on the desk that Marcus didn't just use the Kelly Criterion for position sizing; he used it for conversation. If you asked him how confident he was about a trade, he wouldn't give you a probability. He'd give you a fraction of his bankroll he was willing to risk. He treated his reputation like a bankroll that could be bankrupted by arrogance.

  But here is the analogy I want to offer, which I hope lands for everyone.

  Marcus treats his life like a fractional Kelly bettor treats a volatile market. A full Kelly bettor maximizes growth, but the volatility is terrifying. You can draw down 50% of your net worth before you double it. Most humans can't stomach that emotional volatility. So, Marcus bets "half-Kelly." He sacrifices some theoretical upside for a smoother curve.

  He applied this to his family. An arithmetic thinker plans the perfect vacation, the perfect birthday, the perfect bonus. They spike the happiness metric. Marcus knew that the geometric mean of a family's happiness is determined by the baseline, not the peaks. He didn't optimize for the best weekend; he optimized for the lowest volatility in trust. He knew that in a multiplicative system, you don't recover from a zero. You don't get to average out a broken promise with a big gift later. The compounding stops.

  So, when we look at his career, we are tempted to look at the P&L and call it a score. But Marcus would tell you that the P&L is just noise. The signal is the shape of the trajectory.

  To call tonight a "win" implies the game is over. But for a geometric rationalist, the game is never over until the compounding stops. Retirement, in Marcus's view, isn't a liquidation event. It's a rebalancing. He is simply shifting assets from a high-volatility portfolio called "Investment Banking" to a long-duration portfolio called "Grandparenting" and "Gardening."

  The risk of ruin is lower, but the time horizon is longer. The objective function hasn't changed: maximize the sustainable growth rate of the things that matter.

  Marcus, you have spent thirty years warning us that treating a single outcome as a "win" is the arithmetic mistake of a species that doesn't understand ergodicity. You taught us that we are not a collection of parallel selves averaging out our risks. We are a single thread moving through time.

  So, I will not congratulate you on winning. I will not say you came out ahead.

  Instead, I will say this: You stayed in the game. You kept the volatility low enough that the compounding could work. You protected the bankroll—both the firm's and, more importantly, the one sitting at the tables behind me—well enough that the curve is still pointing up.

  You have demonstrated that the most rational thing a person can do is to treat their relationships with the same risk management as their capital. You showed us that "enough" is not a number, but a risk parameter.

  So, to Marcus. May your future trajectory remain smooth. May your volatility be low. And may you never, ever mistake a single moment of happiness for the sum total of the journey.

  To Marcus.
