      *   *Refined Concept:* **The "Portfolio of Relationships/Life".** Marcus applies Kelly to life. He didn't maximize short-term happiness (arithmetic spikes); he maximized long-term stability and growth (geometric compounding of trust/family).
      *   *The "Joke/Analogy":* Let's use the concept of *rebalancing*. In finance, you rebalance to maintain risk. In life, Marcus rebalanced between work and home. But the specific technical hook needs to be about *why* we use geometric means.
      *   *Better Hook:* **The "Ergodicity" distinction.** Ensemble average (what happens to many people once) vs. Time average (what happens to one person many times).
      *   *Translation for Family:* "If 100 people cross a river, and 99 make it and 1 drowns, the *average* person made it. But if *you* cross the river 100 times, and you drown once, you're done. Marcus taught us to care about the one person crossing many times, not the crowd crossing once."
