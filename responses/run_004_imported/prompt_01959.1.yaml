answer: |-
  Here is an adjudication of the exchange, moving through each claim to assess the philosophical strength of Mia and Theo's positions, followed by the requested clarification and verdict.

  ### Move-by-Move Adjudication

  **(1) Mia:** *Owen has no business lecturing anyone... you don't run up that kind of footprint yourself and then scold others.*
  **Assessment:** **Mia.** Mia introduces the core intuition behind the "standing to blame." In contemporary moral philosophy (e.g., work by R. Jay Wallace or Macalester Bell), standing is distinct from the truth of the moral claim. Her intuition aligns with the widely accepted view that gross hypocrisy undermines one's authority to hold others accountable.

  **(2) Theo:** *This is a textbook tu quoque... Owen's own habits don't change that arithmetic.*
  **Assessment:** **Mia.** Theo is technically correct that *tu quoque* is a fallacy regarding the *truth* of a proposition. However, he misapplies the label here. Mia is not arguing that flying is permissible because Owen flies; she is arguing that Owen lacks the *authority* to scold. Theo conflates the validity of the norm with the propriety of the enforcement. Since Mia's claim survives the *tu quoque* charge (as she clarifies in Move 3), Theo's objection misses its mark.

  **(3) Mia:** *There's a difference between a claim being true and a person having earned the standing to press that claim.*
  **Assessment:** **Mia.** This is the pivotal philosophical distinction. Mia correctly identifies that the debate is not about climate science (truth) but about moral relationships (standing). This distinction is the bedrock of the literature on hypocrisy; without it, the conversation talks past itself. Mia secures the theoretical high ground here.

  **(4) Theo:** *It implies that the people who best appreciate how bad flying is... are the very people least entitled to say so.*
  **Assessment:** **Theo.** This is Theo's strongest move. He raises a substantive pragmatic and epistemic objection known in the literature as the "silencing objection." If strict consistency is required for standing, we lose valuable moral testimony from those struggling with the very norms they advocate. Theo correctly identifies a tension in Mia's view: it risks prioritizing moral purity over moral progress. While Mia has a theoretical answer, Theo successfully highlights a costly upshot of her position.

  **(5) Mia:** *Standing isn't about who best appreciates the facts; it's about whether you're addressing someone as an equal.*
  **Assessment:** **Mia.** Mia invokes the "moral equality" account of standing. She explains *why* hypocrisy undermines standing: it implies the blamer exempts themselves from the rules they impose, violating the relationship of equality required for legitimate rebuke. This answers Theo's Move 4 by clarifying that standing is not an epistemic reward for "appreciating facts" but a relational status based on mutual accountability.

  **(6) Theo:** *Does regret and reform restore standing?... If so, it's about belief; if not, it's arbitrary.*
  **Assessment:** **Mia.** Theo presents a false dilemma. In the moral equality framework, regret and reform restore standing not because they prove *sincerity* (belief), but because they renounce the *claim to exemption* and restore relational equality. Theo assumes the only alternatives are "permanent bar" or "sincerity test," missing the middle ground of "relational repair." While Theo rightly pressures Mia to explain how standing is regained, his conclusion that this reduces her argument to mere belief is incorrect. Mia's framework can accommodate reform without conceding Theo's point.

  ### (a) Clarifying Distinction

  The exchange would be clarified by distinguishing between **Hypocrisy as Inconsistency** and **Hypocrisy as a Claim to Exemption**.

  Theo operates with the former view: he sees Owen's fault as a logical or behavioral inconsistency (saying X while doing not-X), which leads him to believe the only relevant factors are the truth of X or Owen's sincerity. Mia operates with the latter view: she sees Owen's fault as a relational violation (asserting authority over a norm while acting as though it does not bind him). This distinction explains why Owen's flights matter (they imply exemption) but also why reform matters (renouncing the exemption restores equality), resolving the tension in Move 6 without collapsing into Theo's dilemma.

  ### (b) Verdict

  Mia's overall position holds up better because she correctly identifies that the wrong of hypocrisy lies in the violation of moral equality required for blame, whereas Theo conflates the authority to enforce a norm with the truth of the norm itself.
