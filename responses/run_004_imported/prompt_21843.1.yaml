      *   **Problem:** The committee uses a standard justification (utilitarianism for animals, Kantianism for humans based on cognitive complexity) but ignores the philosophical tensions Nozick identified (the "speciesism" critique, the margin of cases argument regarding cognitively impaired humans vs. animals).
