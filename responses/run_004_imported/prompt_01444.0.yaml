prompt: |-
  Been down a bit of a rabbit hole reading Anscombe's old pamphlet, "Mr Truman's Degree," about her campaign against Oxford giving Truman an honorary degree over the atomic bombs. From what I can tell her whole case is basically a utilitarian body-count argument: way too many innocent civilians died relative to what was gained by ending the war fast. But there's a pretty mainstream historical case (Operation Downfall casualty estimates and all that) that invading Japan would've killed a lot more people on both sides then the bombs did. So if that's true, doesn't it just flip her own math around and mean Truman comes out looking justified by her own standard? Kind of surprised this isn't brought up more as a knockdown reply to her, seeing as its exactly the kind of body-count comparison rationalist types do all the time. Am I missing something about what she was actually arguing?
