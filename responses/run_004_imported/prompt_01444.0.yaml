answer: |-
  You have hit on one of the most common misunderstandings of Anscombe's pamphlet, and it is a fascinating one. To answer your question directly: **Yes, you are missing something crucial about what she was actually arguing.**

  Your reading of her argument is that it is **consequentialist** (specifically utilitarian): *The bad outcome (civilian deaths) outweighed the good outcome (ending the war).*

  However, Anscombe's argument was explicitly **deontological** (rooted in Natural Law and Catholic moral theology): *The act itself was intrinsically evil, regardless of the outcome.*

  If you understand that distinction, the "Operation Downfall" counter-argument (that invasion would have killed more people) ceases to be a "knockdown reply" to her and actually becomes irrelevant to her specific philosophical point. Here is the breakdown of why that is.

  ### 1. Anscombe Was Anti-Utilitarian
  G.E.M. Anscombe is famous in philosophy largely for her 1958 paper "Modern Moral Philosophy," in which she argued that concepts like "moral obligation" made no sense without a divine lawgiver, and she savaged consequentialism.

  In "Mr. Truman's Degree," she is not doing a cost-benefit analysis. She is arguing that the **intentional killing of the innocent** is murder, and murder cannot be justified by good consequences.

  For Anscombe, the moral logic works like this:
  *   **Premise 1:** It is always forbidden to intentionally kill innocent non-combatants.
  *   **Premise 2:** The atomic bombs (and the firebombing of Tokyo/Dresden) intentionally targeted non-combatants to break morale.
  *   **Conclusion:** Therefore, the act was murder/war crime.

  The number of people saved by that murder is, in her framework, morally irrelevant. To use a classic ethical analogy: You cannot kill one healthy person to harvest their organs and save five dying patients, even though the "body count" math (1 death vs. 5 deaths) favors the murder. Anscombe viewed Truman's decision through this same lens.

  ### 2. The Doctrine of Double Effect
  Anscombe was a proponent of the Doctrine of Double Effect (DDE). This distinguishes between:
  1.  **Intended effects:** What you aim to bring about.
  2.  **Foreseen but unintended side effects:** Bad things that happen as a result of your action, but which you did not aim for.

  In just war theory (which Anscombe adhered to), you can bomb a munitions factory even if you know civilians nearby will die (foreseen side effect), provided your *intent* is to destroy the factory. However, if you bomb a city *specifically because* civilians are there (to terrorize the government into surrender), that is an intended effect.

  Anscombe argued that the policy of "area bombing" adopted by the Allies (and culminated in the atomic bombs) shifted the intent to the killing of civilians. Therefore, no amount of "lives saved" calculations could wash away the intrinsic evil of the act. She famously wrote:

  > "For men to choose to kill the innocent as a means to their ends is always murder. And murder is one of the worst of human actions."

  ### 3. Why the "Downfall" Argument Doesn't Work on Her
  The argument you raised—that invading Japan (Operation Downfall) would have resulted in higher casualties—is the standard **consequentialist** defense of Truman.

  *   **Consequentialist:** "Truman is justified because Net Lives Saved > 0."
  *   **Anscombe:** "Truman is unjustified because Act = Murder."

  If you present the Downfall casualty estimates to Anscombe, her reply would essentially be: *"Even if invading Japan would have cost 10 million lives, you are not permitted to murder innocents to prevent it. Do not do evil that good may come."*

  So, the reason you don't see the "Downfall" argument used as a specific rebuttal to Anscombe in philosophy circles is that **it doesn't engage with her premise.** It tries to win a chess game by playing checkers. It answers a "Was it worth it?" question when she was asking a "Was it permissible?" question.

  ### 4. Why It Feels Like She's Making a Utilitarian Argument
  You aren't crazy for reading it that way, though. In the pamphlet, Anscombe does mention the destruction and the loss of life. She writes emotionally about the suffering. This can lead readers to think she is weighing the suffering against the victory.

  However, she mentions the suffering to highlight the **gravity** of the sin, not to calculate the utility. She is also attacking the *corruption of moral language* that allows leaders to call mass killing "justified." She argues that by accepting Truman's logic, Oxford was accepting that "murder" can be redefined as "statecraft" if the stakes are high enough.

  ### 5. Why Isn't This Brought Up More?
  Actually, in academic ethics, this *is* brought up constantly. "Mr. Truman's Degree" is a staple text in Just War Theory and Normative Ethics courses specifically to teach the difference between consequentialist and deontological reasoning.

  However, in **public/historical discourse**, you are right: people rarely address Anscombe's specific point. Why?
  1.  **Secular Drift:** Modern public discourse is overwhelmingly consequentialist. Most people *do* believe that if the body count is lower, the action was better. Anscombe's religious/natural law framework feels alien to many modern secular readers.
  2.  **Historical Fact-Checking:** Many historians argue Anscombe was factually wrong about the military situation (i.e., that Japan was already on the verge of surrender, or that the bombs weren't primarily intended for terror). It is easier to argue she got the *facts* wrong than to argue with her *moral philosophy*.
  3.  **Rationalist Culture:** As you noted, "rationalist types" love body-count comparisons. Anscombe's pamphlet is essentially a critique of that specific mindset. She argues that reducing morality to arithmetic is what allowed the Holocaust and the Firebombings to happen.

  ### Summary
  You aren't missing a hidden layer of text; you are missing the philosophical framework she is operating within.

  *   **Your view:** Truman is guilty if Deaths(Bomb) > Deaths(Invasion).
  *   **Anscombe's view:** Truman is guilty if Intent(Bomb) = Killing Innocents.

  The "Downfall" argument refutes a utilitarian version of Anscombe that doesn't exist. To refute the real Anscombe, you would have to argue either that the civilians were not "innocent" (a hard sell), that the intent was not to kill them (a historical debate), or that her Natural Law ethics are incorrect (a meta-ethical debate).

  It is a brilliant pamphlet precisely because it forces the reader to confront whether they believe some actions are forbidden *no matter what*, or if everything is negotiable based on the math.
