answer: |-
  The telescope mount groaned, a sound like a bone settling in cold meat. Elena adjusted the gain on the photodetector, her breath pluming in the unheated dome. Outside, the Atacama Desert was a void of black basalt and colder air, but inside, the universe was pouring in through the aperture.

  She wasn't looking for planets or galaxies. She was looking for switches.

  Two quasars sat in the eyepiece of the control monitor, labeled simply Q-1 and Q-2. They were not really there, of course. The light hitting the primary mirror had left those sources when the Earth was still a molten accretion disk, seven billion years ago. It was old light, tired and redshifted, carrying no information other than its own arrival time.

  That was the point.

  "Status on the downlink?" Elena asked. Her voice sounded thin in the high altitude.

  "Green across the board," Marcus replied from the rack of servers behind her. He didn't look up. "Wavelength splitting is active. If Q-1 spikes, polarizer A tilts vertical. If Q-2 spikes, horizontal. Same for B on the second telescope."

  Elena nodded. The entangled photons were being generated in the lab below, fired through fiber optics to two separate detectors on opposite ridges. According to the standard model, they were a single mathematical object stretched across space. Measure one, and the other instantly knows its own state. Einstein called it spooky. Elena called it a paperwork error in the laws of nature.

  For decades, skeptics had argued that the particles weren't communicating faster than light. They argued that the *choice* of measurement wasn't free. Maybe the detector, the particle, and the experimenter were all part of a single, pre-written script. A local hidden variable. A conspiracy.

  To break the conspiracy, you had to go back further than the conspiracy could possibly reach. You had to ask the universe to make the choice before humanity existed. You had to use the stars.

  "Run sequence four," Elena said.

  The hum of the servers pitched up. On the screen, the waveforms from the quasars jittered—ancient stochastic noise. That noise was now driving the magnets that oriented the filters catching the fresh photons born in the lab. The past was steering the present.

  Elena walked to the edge of the open slit. The wind bit at her cheeks. She looked up at the patch of sky housing Q-1. It was empty to the eye. Just darkness. But somewhere in that darkness, a mechanism had been set in motion when the universe was a quarter of its current age.

  If the correlation held—if the particles on the ridges continued to match each other's states perfectly despite being steered by light that hadn't known Earth existed—then the conspiracy wasn't local. It wasn't about the lab. It wasn't about her.

  If the math held, the conspiracy was universal.

  "Correlation coefficient is 0.85," Marcus said. His voice lacked triumph. "Standard deviation is negligible."

  Elena closed her eyes. 0.85. It was over. The loophole was sealed. There was no hidden variable sitting in the room with them. There was no secret signal passing between the detectors.

  But the cost of that victory sat heavy in her gut.

  If the settings were determined seven billion years ago by the quasars, and the particles responded to those settings instantly, then the separation between 'here' and 'there' was a lie. Space was not a barrier. Or, worse, time was not a river.

  If the light from the quasar dictated the setting, and the setting dictated the outcome, and the quasar's emission was fixed by the Big Bang... then the moment she raised her hand to scratch her nose was also fixed. The moment she decided to become a physicist. The moment she met Marcus.

  "Log it," she said.

  "You okay?" Marcus asked. He swiveled his chair. "We just proved non-locality with the tightest constraints in history. This is the paper of the decade."

  Elena looked at her hand. She flexed her fingers. The tendons moved under the skin, obedient to nerve impulses. Were the impulses hers? Or were they just the echo of a collision between gas clouds in a quasar's accretion disk, resonating across eons to twitch her muscle?

  "I feel," Elena said, searching for the word, "like I'm reading a script."

  Marcus laughed, a nervous, short sound. "That's the post-experiment crash. Go get some coffee."

  "I mean, look at the timing." She pointed to the monitor. "That light left its source before the sun ignited. It traveled through intergalactic voids, passed through gravity wells, redshifted into infrared, just to hit this mirror tonight and tell a magnet which way to turn. And the particle below knew how to answer before the light even arrived."

  "Quantum mechanics," Marcus shrugged. "It's always been weird."

  "It's not weird. It's tight. It's too tight."

  She walked out of the dome, leaving the hum of the machines. The cold hit her like a physical weight. The sky above was a spill of diamonds, indifferent and bright. She lit a cigarette, shielding the flame with a cupped hand.

  She had come to the desert to prove that the universe was honest. That there was a reality independent of observation, or at least that the observer had a say in the question asked. She wanted to believe that her choice to measure spin-up or spin-down was a genuine intervention in the fabric of things.

  But the quasars didn't care about her intervention. They were just clocks.

  She took a drag. The smoke curled into the night, dissipating into the vast, cold atmosphere. She thought about driving back to the dorms. She thought about writing the email to the collaboration team. She thought about quitting.

  Did she want to quit? Or was the thought of quitting just the next line in the text written seven billion years ago?

  The distinction felt like hair-splitting, yet it was everything. If she was free, the future was unwritten. If she was not, she was just a complex arrangement of atoms playing out a trajectory set at the dawn of time.

  She flicked the ash. It fell, caught by the wind, and vanished into the dark.

  "Marcus," she said, stepping back inside.

  He looked up, hopeful.

  "Run it again," she said.

  "We already have statistical significance, Elena."

  "Run it again."

  She needed to see the numbers one more time. She needed to see the universe confirm its own rigidity. She sat back down in front of the console. The screen glowed, bathing her face in blue light.

  Q-1 pulsed. Q-2 pulsed. The magnets below shifted. The photons aligned.

  The universe hummed, a perfect, clockwork machine, and Elena sat inside it, wondering if the wonder she felt was her own, or just another necessary variable in the equation. She reached for the keyboard to start the sequence. Her finger hovered over the key.

  For a second, just a fraction of a second, she held it there. Suspended.

  Then she pressed down.
