  9.  **Final Polish:** Check against the "gentle" constraint. Avoid overly dense jargon where possible, or explain it. (Self-Correction: Make sure not to sound condescending about the Wikipedia knowledge. Frame it as "Here's the deep dive stuff to bolster your argument.")

  10. **Final Review against constraints:**
