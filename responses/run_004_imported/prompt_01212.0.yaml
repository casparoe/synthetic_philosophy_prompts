      *   Is it gentle? Yes.
      *   Is it helpful for a blog post? Yes, gives angles to explore.

  *(Self-Correction during drafting)*: I should emphasize that in ML, we often *embrace* underdetermination (ensembling) whereas in science it's a crisis. That's an interesting tension to highlight.

