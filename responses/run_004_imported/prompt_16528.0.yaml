          *   **Philosophy of Action:** Intentionality. But AI might not have "intentions" in the human sense.
          *   **Formal Verification:** Proving bounds on influence over the shutdown button.
      *   *Current State:* It's largely an open problem. The "shutdown problem" papers (Soares et al.) show it's surprisingly hard to formalize without creating perverse incentives.
      *   *Conclusion:* Maya is right that it's a genuine gap, but Daniel is right that we *must* try to fill it. It's not just semantic; it's structural.

