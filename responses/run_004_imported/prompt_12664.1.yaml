answer: |-
  **Naiyayika:** You offer the *catuskoti* as a profound logic, yet it is merely a evasion of the law of excluded middle. To say of any *X* that it is neither existent, nor non-existent, nor both, nor neither, is to abandon the ground where reason stands. But consider your own thesis: "All things lack *svabhava*." Is this statement itself exempt from that emptiness? If it is not empty, you contradict yourself by admitting one thing has intrinsic nature. If it is empty, it asserts nothing, and your teaching cancels itself. You face a dilemma: inconsistency or silence.

  **Madhyamaka:** I accept the latter horn: I have no thesis (*pratijna*). Emptiness is not a rival metaphysical position but a therapeutic remedy for the disease of viewing. Just as a purgative expels itself along with the poison, emptiness empties itself. I do not assert non-existence; I demonstrate via *prasanga* that any proposed essence collapses under scrutiny. Apply your essence to cause and effect: if the cause exists, the effect is superfluous; if the cause does not exist, the effect is impossible. I do not build a system; I show the instability of yours.

  **Naiyayika:** Stability is required for function (*arthakriya*). Without *svabhava*, there is no connection between cause and effect, no referent for language, and no possibility of knowledge. Yet you speak, you infer, you demand I understand you. To debate me, you must employ *pramanas*—means of valid knowledge. You rely on inference to deny inference. If your *pramanas* are empty, they cannot validate your denial. If they are valid, they possess the intrinsic nature you deny.

  **Madhyamaka:** You assume *pramanas* require intrinsic nature to function. I ask only: how are these *pramanas* established? If established by other *pramanas*, you invite an infinite regress. If established by themselves, you argue in a circle. If they are unestablished, they cannot establish anything else. You demand grounding for all things, yet you cannot ground the very tools of grounding without special pleading. Who is truly silent?

  **Naiyayika:** We avoid the regress through mutual establishment (*anyonyasiddha*) and successful action. The *pramanas* establish the objects of knowledge, and the objects confirm the *pramanas*, like a lamp illuminating itself and the surrounding vessels. We know the means are valid because we achieve our goals—fire burns, water quenches. This pragmatic success is proof enough of reality. You may critique the logic, but you cannot live without the truth it maps.

  **Madhyamaka:** I do not deny that fire burns conventionally (*samvrti*). I deny that it burns because of an intrinsic "fire-essence." You are bound to prove the lamp shines by nature; I am free to use the light without ontological commitment. You seek to ban emptiness to protect reality; I offer emptiness to protect convention from reification. The question is no longer who possesses the truth, but who is burdened by the need for it.
