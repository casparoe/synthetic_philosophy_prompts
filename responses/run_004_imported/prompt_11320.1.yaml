answer: |-
  This is a brilliant tension to exploit. You have the perfect storm: Condorcet's faith in rational aggregation, Sophie's faith in moral sentiment, and the looming shadow of a Revolution that claimed to be rational but became monstrous.

  Your economist friend is right that Futarchy is a spiritual descendant of the Jury Theorem (both rely on aggregating dispersed information to find a "truth"), but they diverge on the *nature* of the voter and the *goal* of the vote.

  Here is the specific spot where Condorcet would squirm, followed by how to stage the argument.

  ### The Philosophical Trap: Competence vs. Incentive

  Condorcet's Jury Theorem has a hard mathematical constraint: it only works if the average voter has a probability of being correct ($p$) greater than 0.5. If $p < 0.5$, adding more voters makes the wrong decision *more* certain.

  This is why Condorcet was obsessed with **public instruction**. He didn't just want *more* voters; he wanted *better* voters. He believed education raises $p$.

  **The Futarchy divergence:**
  Futarchy replaces "voter competence" with "financial incentive." It assumes that even if I am stupid, if I have money on the line, I will act *as if* I am smart (or I will follow someone who is).

  **The Squirm:**
  Condorcet would recoil at the idea that **greed can substitute for virtue.**
  For Condorcet, the act of voting is a moral exercise. It requires the citizen to deliberate, to consult their reason, and to aim for the *general will*.
  In a prediction market (Futarchy), the participant does not need to care about the general will. They only need to care about the payout.

  **The specific argument Sophie can use:**
  She should press him on the difference between a **Verdict** and a **Wager**.
  *   **Verdict (Condorcet):** "I believe this is Just." (Requires $p > 0.5$ competence + Moral intent).
  *   **Wager (Futarchy):** "I believe this will happen." (Requires only capital + Risk tolerance).

  If the market can make money off a famine, the market will predict the famine accurately but might not select the policy that prevents it, if the prevention policy is less profitable for the bettors. Condorcet wants the *Right* outcome. Futarchy guarantees the *Predicted* outcome based on a metric.

  ### The Scene Dynamics

  **Setting:** Madame Vernet's boarding house (Rue des Fossoyeurs). Late 1793 or early 1794. Condorcet is exhausted, living under the name "Pierre Simon." The walls are thin. The tone should be hushed but intense.

  **Sophie's Angle:** She shouldn't attack the math. She knows he loves the math. She should attack the **anthropology**. She should use his own condition ($p > 0.5$) against him.

  **Condorcet's Defense:** He wants to believe that incentives align with truth. He is desperate for a system that works, because the Republic is failing.

  **The Climax of the Argument:** The realization that a market can be *right* without being *good*.

  ### Drafting the Argument (Key Beats)

  Here is a breakdown of how the dialogue could flow, focusing on the "squirm" points.

  **1. The Setup: The Mechanism**
  Sophie describes the system not as "Futarchy" (anachronistic) but as a logical extension of his essay. She frames it as a "Market of Verdicts."
  *   *Sophie:* "You say ten thousand men, each slightly more likely to be right than wrong, will find the truth. But what if they are tired? What if they are afraid? What if they lie?"
  *   *Condorcet:* "That is why we need instruction. To make them honest."
  *   *Sophie:* "Or... what if we do not ask them to be honest? What if we ask them to be rich?"

  **2. The Trap: Independence**
  Condorcet's theorem requires voters to be **independent**. If they copy each other, the math collapses.
  *   *Sophie:* "In your essay, Marquis, the voters must think alone. In this 'market' you describe, the money flows like water. It follows the current. If one man bets heavy, the others follow. They are not independent. They are a herd. Your formula breaks."
  *   *Condorcet:* (Squirming) "The price corrects the herd. The profit corrects the error."
  *   *Sophie:* "Does it? Or does it just reward the man with the deepest purse, not the clearest eye?"

  **3. The Moral Squirm: The Metric**
  This is the killer. Futarchy requires voting on a "utility function" (e.g., maximize GDP).
  *   *Sophie:* "Let us say the Assembly votes to maximize 'Grain in Paris.' A noble metric. The market then bets on which policy brings grain. But Marquis... a blockade brings high prices. High prices bring profit to the speculator. The market might predict that *suffering* yields the highest return for the bettors. Your theorem finds the Truth. But this mechanism finds the Price."
  *   *Condorcet:* "We vote on the value! We tell them to maximize Life!"
  *   *Sophie:* "And if the market calculates that ten thousand deaths stabilize the currency, and the bettors win on that calculation? Have they lied? No. They were right. The math holds. But where is the Republic?"

  **4. The Emotional Core: Sympathy vs. Calculation**
  Sophie brings in Adam Smith.
  *   *Sophie:* "I translated Smith. He taught us that morality comes from imagining ourselves in the place of the other. Sympathy. This market... it requires me to profit from your misery to prove I am right. It does not ask me to feel. It asks me to calculate. You wanted citizens, Nicolas. This creates gamblers."
  *   *Condorcet:* (The Squirm) "I wanted them to be free from error."
  *   *Sophie:* "And I want them to be free from cruelty. Sometimes, Monsieur, error is kinder than certainty."

  ### Historical/Character Notes for Authenticity

  1.  **Condorcet's Despair:** By early 1794, Condorcet knows the Terror has betrayed the Enlightenment. He is hiding because the Girondins are proscribed. He should sound like a man whose equations no longer match the reality of the street. He might be *tempted* by Futarchy because human voting has failed him (the Convention is a mob).
  2.  **Sophie's Agency:** Sophie de Grouchy was not just a wife; she ran a salon, wrote *Letters on Sympathy*, and kept her head while he was in panic. She should not be emotional in a "hysterical" way. She should be cool, precise, and morally superior in the argument. She is the one holding the human constant.
  3.  **The "Vernet" Detail:** Madame Vernet was real. She ran a boarding house where Condorcet hid for eight months. She reportedly told him he was safe there, but he fled anyway (leading to his arrest). You can use the setting—the safety of the room vs. the danger outside—as a metaphor for the safety of Math vs. the danger of Politics.
  4.  **Language:** Avoid modern terms like "Futarchy," "GDP," or "Market Efficiency." Use terms like "speculation," "annuities," "wagers," "public utility," "general will," "probability of error."

  ### The "Squirm" Summary for Your Notes

  If you need a single sentence to pin the scene on, it is this:

  **Condorcet believes that if you remove bias, you get Truth. Sophie argues that if you remove Sentiment, you get Monsters.**

  Condorcet squirms when he realizes that **a betting market removes the need for the voter to be *good*, only to be *profitable*.** His theorem requires $p > 0.5$ (competence/virtue). Futarchy assumes the *incentive* creates the competence. Sophie forces him to admit that a man can bet correctly on a tragedy without having the virtue to prevent it. For Condorcet, who tied mathematics to human progress, this separation of "accuracy" from "morality" is the true betrayal of his life's work.

  ### Suggested Closing Image
  Condorcet looks at his papers—the 1785 essay. He realizes the variables ($p$, $n$) assume a rational actor. The Terror has proven men are not rational. Futarchy assumes men are greedy. Sophie argues men must be *sympathetic*.
  He puts down the pen. He realizes there is no equation that saves them now. Only Madame Vernet's kindness (which he will eventually flee, to his doom).
