      *   **Sophie de Grouchy:**
          *   Translator of Adam Smith's *Theory of Moral Sentiments*.
          *   Focused on *sympathy* (empathy), moral sentiment, and the cultivation of virtue through social interaction.
          *   Believed in reason, but reason tempered by moral feeling.
      *   **The Conflict:**
          *   Condorcet wants rational truth through aggregation.
          *   Futarchy aggregates *expectations*, not necessarily *truth* or *justice*.
          *   Condorcet cares about the *competence* of the voter (moral + intellectual). Futarchy cares about the *incentive* of the bettor (financial).
          *   Sophie would argue that removing moral deliberation from the decision removes the humanity.

  3.  **Identify the "Squirm" Point:**
