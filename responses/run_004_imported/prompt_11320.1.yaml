      *   *Competence ($p > 0.5$):* Futarchy assumes the market knows best. Condorcet assumes the *educated citizen* knows best. If the market is wrong (bubble/panic), does it matter?
      *   *The Goal:* Condorcet wants the *Right* decision. Futarchy wants the *Efficient* decision based on a metric.
      *   *The Squirm:* Condorcet realizes that Futarchy separates *values* from *facts* too cleanly. For Condorcet, understanding the facts *changes* your values. Also, he fears that without public instruction, $p$ drops below 0.5. A market doesn't educate; it just exploits ignorance.
      *   *Key Insight:* Condorcet's theorem requires voters to be *better than chance*. Futarchy relies on *profit motive*. What if profiting from a tragedy is easier than preventing it? The market might correctly predict a famine but not care if the policy causes it, as long as the bet pays out. Condorcet wants *progress*; markets want *equilibrium*.

  4.  **Drafting the Argument (Iterative Process):**
      *   *Attempt 1 (Mental Outline):* Sophie says, "So you'd let gamblers rule?" Condorcet says, "No, they find truth." Sophie says, "Truth about what? Price?" Condorcet says, "Outcomes." Sophie says, "But where is the sympathy?" Condorcet gets quiet.
