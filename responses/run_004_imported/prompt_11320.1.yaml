      *   **Tone:** Intellectual, tense, intimate, historically grounded but exploring anachronistic ideas through character perspective.

  2.  **Deconstruct the Philosophical/Historical Material:**
      *   **Condorcet's Jury Theorem:**
          *   Premise: If voters are independent and each has a probability $p > 0.5$ of being correct, the probability of the majority being correct approaches 1 as $n$ (number of voters) increases.
          *   Crucial Caveat: If $p < 0.5$, the majority becomes *more* likely to be wrong as $n$ increases.
          *   Implication: Education (*instruction publique*) is vital to ensure $p > 0.5$.
          *   Goal: Truth/Justice, not just efficiency.
      *   **Futarchy (Hanson):**
          *   Mechanism: Vote on values (utility function), bet on policies (prediction markets).
          *   Assumption: Markets aggregate information better than voters.
