      *   Is it useful for a novelist? Yes, provides dramatic tension and intellectual stakes.

  **(Self-Correction during drafting):** I need to make sure I don't make Condorcet look stupid. He shouldn't be "tricked." He should be confronted with the *unintended consequences* of his own logic. The tragedy is that his math is right, but the application is wrong. Also, ensure Sophie isn't just "emotion vs. logic." She is *moral philosophy* vs. *pure probability*. She translated Smith; she understands systems, but insists on the human element.

