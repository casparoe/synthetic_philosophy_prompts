      *   *Attempt 2 (Adding Detail):* Bring in the $p > 0.5$ condition. Sophie argues that money doesn't make you competent. Condorcet argues incentives align truth. Sophie counters that markets can bet on misery. Condorcet realizes the theorem assumes a shared goal of "correctness," but markets have a goal of "profit."
      *   *Refining the "Squirm":* The squirm comes when Condorcet realizes that his theorem relies on the *virtue* of the voter (to seek truth), whereas Futarchy relies on *vice* (greed) to simulate truth. If the voters are corrupt, the math breaks. If the bettors are greedy, the math works, but the *outcome* might be monstrous.

