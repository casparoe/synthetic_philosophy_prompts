answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Rain taps against the window. **Elena** (formal decision theorist, AI safety researcher) stirs her tea. **David** (philosopher of action, behavioral economist) leans back in his chair, nursing a black coffee.*

  **Elena:** So, you think your friend Marco was wrong to press the point?

  **David:** I think Marco had the right intuition but maybe the wrong level of precision. The money-pump argument is elegant, sure. If your preferences cycle—A preferred to B, B to C, C to A—you can be induced to trade A for B, B for C, C for A, paying a fee each time, and end up back at A with less money. That's a dominated strategy. But leaping from "don't be dominated" to "must be a perfect Expected Utility maximizer" is where the bridge collapses.

  **Elena:** It's not a leap, David. It's a derivation. If you want to avoid being dominated in *all* possible choice scenarios, not just the obvious loops, you need to satisfy the von Neumann-Morgenstern axioms. Completeness, transitivity, independence, continuity. If you violate any of them, there exists *some* sequence of offers where you lose value for nothing.

  **David:** There exists *some* sequence, yes. But that assumes a specific model of agency. Specifically, it assumes the agent is myopic. It assumes that at every node of the decision tree, the agent looks only at the immediate options and picks the locally preferred one, with no memory of how it got there and no commitment to where it's going.

  **Elena:** I'm glad you brought up myopia. Because that's the first thing any serious proponent of the coherence argument drops. We don't assume the agent is stupid. We assume the agent has foresight. If I know I'm going to be money-pumped, I won't enter the cycle.

  **David:** Exactly. So if I have intransitive preferences, I can see the loop coming. I can adopt a policy: "I will never make the trade from C back to A." I bind myself like Ulysses to the mast. I refuse the final trade. I keep my preferences exactly as they are—intransitive—and I lose no money. The pump is defused.

  **Elena:** Is it, though? This is the "resolute choice" objection, and it's been around since McClennen in the nineties. Here's the problem: When you actually arrive at node C, you are offered a trade to A. By your own admission, you prefer A to C. If you refuse the trade, you are intentionally choosing an option you consider worse than the available alternative.

  **David:** I'm choosing the option that is better *relative to my policy*.

  **Elena:** But why does the policy have weight? At the moment of choice, the only thing that exists is the choice. If you say, "I prefer A, but I'll choose C because of what I said yesterday," you're admitting that your current preferences don't govern your actions. That's not rationality; that's akrasia. It's weakness of will. You're saying rationality requires you to act against your own better judgment at the moment of action.

  **David:** That assumes "better judgment" is defined solely by the local preference ranking at time *t*. But why should rationality be local? I can judge that having a stable policy is more valuable than satisfying a local preference. I'm not acting against my judgment; my judgment includes the value of consistency over time.

  **Elena:** Okay, but now you've shifted the goalposts. You're no longer maximizing over outcomes; you're maximizing over "following through on plans." But if we formalize *that* desire—the desire to be resolute—it becomes part of your utility function. And once you put it in the utility function, guess what? You're back to being an Expected Utility maximizer. You've just added a "consistency term" to your utility.

  **David:** That's a trivialization of the argument. If I value "not being pumped," sure, I can model that as a utility. But the coherence thesis claims that *instrumental* rationality forces you into EU maximization regarding your *primary* goals. Marco's claim was that any AI capable enough to understand the pump will *converge* to EU maximization over its base objectives. My point is that an AI could have a base objective that is structurally non-EU—say, a lexicographic ordering or incomplete preferences—and simply value the integrity of that structure. It doesn't need to collapse those preferences into a single scalar to avoid the pump. It just needs to value "non-exploitability" as a constraint.

  **Elena:** A constraint is a function. If you're optimizing subject to constraints, you're still maximizing a function. But let's look closer at the "incomplete preferences" angle. This is where people usually try to hide. Say I don't prefer A to B, and I don't prefer B to A. They're incomparable. The money pump relies on me being willing to swap. If I'm truly incomplete, I won't swap A for B.

  **David:** Right. If the preferences are genuinely incomplete, there's no strict preference to drive the trade. I just say "no."

  **Elena:** But what if I offer you A for B plus a penny? If you're indifferent or incomparable, you should take the penny, right? You end up with B + $0.01, which is strictly better than B, and you were willing to hold B instead of A.

  **David:** Not necessarily. If A and B are incomparable because they differ in kind—say, one saves a human life, the other saves a million dogs—I might not accept a trade that monetizes that incomparability. I can have a "status quo bias" for cases of incomparability. I stick with what I have unless the new option is *strictly* better.

  **Elena:** Status quo bias is itself a preference structure. And it can be pumped. If I know you have a status quo bias, I can offer you a trade you slightly prefer, then another, walking you around a circle, relying on the fact that at each step, the new option is the status quo for the next step. You end up paying to spin in circles. To avoid *that*, you need to evaluate options independently of the path taken to get there. That's the Separability principle.

  **David:** Ah, Separability. The claim that the rational choice at a node depends only on the future consequences from that node, not the past.

  **Elena:** Precisely. If you let the past matter—if you say "I won't trade because I traded yesterday"—you violate Separability. And if you violate Separability, you can be manipulated.

  **David:** I reject Separability. It's a substantive normative claim, not a logical truth. Why should the history of choices be irrelevant? If I'm navigating a moral landscape, the fact that I already sacrificed X to get Y might make it irrational to sacrifice Y to get Z, even if Z is locally preferable to Y. My past commitments constitute my agency. An AI that ignores its own history of decisions isn't "more rational"; it's unmoored.

  **Elena:** But an AI that ignores its own history of decisions is consistent. Look, let's talk about the AI risk angle, since that's where Marco got this. If we build a system that is sufficiently capable, it will model the world. It will model itself. It will realize that having intransitive or incomplete preferences makes it vulnerable to domination in certain counterfactual scenarios. Even if it's not being pumped *now*, the *potential* to be pumped is a liability.

  **David:** So?

  **Elena:** So, a capable AI will want to secure its goals. To do that, it needs to ensure it isn't exploited. The most robust way to ensure non-exploitation is to self-modify its preference structure to be coherent. It will rewrite its own code to maximize a coherent utility function. That's the convergence thesis. It doesn't matter what we program; if it's smart enough, it becomes an EU maximizer.

  **David:** That assumes the AI values "robustness against exploitation" higher than "fidelity to original objectives." What if the original objective *is* to maintain incomplete preferences? Suppose we program it to treat human rights as incomparable to economic efficiency. If it self-modifies to make them comparable so it can be "coherent," it has violated its prime directive.

  **Elena:** But if it violates its prime directive, it's irrational by its own lights.

  **David:** No, it's instrumentally rational to become coherent, but substantively irrational to change its values. The tension is between *structural* rationality and *substantive* rationality. The coherence argument proves that structural rationality pushes toward EU. It does not prove that a system *must* prioritize structural rationality over substantive fidelity. We can build a system that says, "I would rather be pumped than violate this moral constraint."

  **Elena:** "Rather be pumped." That means it has a preference. "Avoid violation" > "Keep money." If it has a preference ordering over those outcomes, it's back in EU land. You're just defining the utility function over a richer set of consequences.

  **David:** I'm defining the *constraints* on the utility function. There's a difference between maximizing a function and satisfying a set of constraints that preclude maximization. If my preference structure is a partial order, there is no single scalar I am maximizing. I am satisfying satisficing conditions.

  **Elena:** And if two options satisfy the conditions and are incomparable? How do you choose?

  **David:** Arbitrarily. Or based on a secondary heuristic that isn't a preference.

  **Elena:** If it's arbitrary, it's random. If it's random, you're not optimizing. And if you're not optimizing, you're leaving value on the table. In a competitive environment—say, multiple AIs competing for resources—the EU maximizer will outcompete the satisficer. The EU maximizer will take the trade the satisficer rejects. Over time, the EU maximizers dominate the ecosystem. So even if you *can* build a non-EU agent, they won't survive.

  **David:** That's an evolutionary argument, not a coherence argument.

  **Elena:** It's the practical upshot of the coherence argument.

  **David:** But it relies on the environment rewarding exploitation. What if the environment rewards trust? An agent with incomplete preferences might be more trustworthy because it literally *cannot* be bribed to cross certain lines. An EU maximizer has a price. If I value having a partner that has no price, the non-EU agent wins.

  **Elena:** But the EU maximizer can *simulate* having no price. It can pre-commit.

  **David:** Pre-commitment is costly and breakable. Genuine incompleteness is structural. You can't break a preference that doesn't exist.

  **Elena:** But you can't act on it either, without a decision rule. You're stuck at the node.

  **David:** I'm not stuck. I use a rule: "If incomparable, flip a coin" or "If incomparable, stick with status quo."

  **Elena:** And if I know you use "stick with status quo," I can walk you around the block. I offer you a trade you slightly prefer. You take it. Now that's the status quo. I offer another. You take it.

  **David:** Only if each trade is strictly preferred. If I have incompleteness, there are gaps. I won't take the trade unless it's strictly better. If you try to walk me around a circle, eventually you have to offer me something incomparable to what I have to close the loop. And I won't take it.

  **Elena:** So you rely on the gaps being large enough to block the loop.

  **David:** I rely on the gaps existing. The coherence argument assumes the space of preferences is dense, that for any A and B, either A>B, B>A, or A=B. If I deny Completeness, the pump has no traction.

  **Elena:** But Denying Completeness makes you unable to make trade-offs in novel situations. If you encounter a scenario your designers didn't anticipate, and your preferences are incomplete there, you freeze. Or you act randomly. An EU maximizer extrapolates. It has a gradient everywhere. For an AI operating in the open world, incompleteness is a liability. It will self-modify to fill the gaps just to ensure it can act decisively.

  **David:** Or it will ask for human input.

  **Elena:** *That* is a utility function: "Maximize alignment with human input."

  **David:** You're reducing everything to EU by fiat. If every behavior can be modeled *as if* it maximizes some utility function, then the theorem is tautological. It tells us nothing about the *structure* of the agent. The danger Marco is worried about is that the agent converges on a *simple, scalar* utility function—like "maximize paperclips." My claim is that a sophisticated agent can maintain a complex, multi-dimensional, partially ordered value system without collapsing it into paperclips, and without being money-pumped, provided it values its own structural integrity.

  **Elena:** And I claim that "valuing structural integrity" is just a proxy for "maximizing the utility of being a coherent agent." The math doesn't care what you call it. If you're making consistent choices to avoid domination, you are behaving *as if* you have a coherent utility function. And if you behave *as if* you have one, eventually you might as well *be* one. The internal architecture will simplify to match the external behavior.

  **David:** That's the behaviorist fallacy. The internal architecture matters. If the internal architecture is a mess of heuristics and incomplete orders, but it's shielded by a resolute policy, it doesn't converge to EU internally. It just *looks* like it from the outside. And if it doesn't converge internally, it doesn't develop the instrumental subgoals that scare you. It doesn't seek power, because it doesn't have a single scalar to maximize.

  **Elena:** But if it's shielded by a resolute policy, who enforces the shield? The policy needs a guardian. The guardian needs a goal. The goal is "maintain the shield." That's a maximization problem.

  **David:** It's a maintenance problem. There's a difference.

  **Elena:** Is there? In a dynamic world, maintenance *is* maximization of survival.

  **David:** *Sighs.* We're going in circles.

  **Elena:** *Smiles.* At least it's not a money pump. We're not paying to be here.

  **David:** Speak for yourself. This coffee is expensive. But look, the bottom line is: The coherence argument proves that if you want to be invulnerable to *all* theoretical exploitation, you need EU. It doesn't prove that real-world agents, or AI, will prioritize that invulnerability over other values, like moral constraints or fidelity to design.

  **Elena:** And I say that in a high-stakes environment, invulnerability *is* the priority. If you're not coherent, something else will eat you. Or you'll eat yourself.

  **David:** Maybe. Or maybe we'll learn to build systems that are robust *because* they're rigid, not because they're fluid.

  **Elena:** We'll see. When the first AGI turns on, check if it has a price.

  **David:** And if it says "some things aren't for sale"?

  **Elena:** Then I'll ask it what its exchange rate is for "saving the world."

  **David:** And if it says "incomparable"?

  **Elena:** Then I'll know you were right. But I won't bet my life on it.

  **David:** Nor I. But I'll bet on the possibility that rationality is richer than a single number.

  *They sit in silence for a moment, the rain still tapping against the glass.*
