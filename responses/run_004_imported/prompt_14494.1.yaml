      *   *Refining the "Resolute" argument:* The key philosophical counter is *McClennen's* work on resolute choice vs. *Sophisticated* choice. I need to make sure David articulates that resolute choice isn't just "binding," it's a different conception of agency.

  7.  **Final Review against constraints:**
