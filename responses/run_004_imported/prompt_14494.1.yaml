      *   **Anti-EU/Resolute (Let's call him David):** Focuses on the distinction between local and global rationality, the legitimacy of policy-based reasoning, and the idea that completeness is a substantive constraint, not just a formal requirement. He represents the behavioral economics/philosophical critique side (e.g., Sen, McClennen, maybe some modern AI alignment critics).

