      *   *What was the core criticism?* The "tautology" objection. If fitness is defined *by* survival, then "the fittest survive" just means "those who survive, survive." This makes it unfalsifiable.
      *   *What is the "Metaphysical Research Programme" label?* For Popper, this wasn't necessarily an insult (like "pseudoscience"). It meant a framework that generates testable hypotheses, even if the core axiom isn't directly falsifiable itself.

  3.  **Identify the Counter-Arguments (The "State of the Argument"):**
      *   **Point 1: Popper changed his mind.** This is crucial. In the 1970s/80s, he clarified his position. He acknowledged that natural selection *is* testable.
      *   **Point 2: The Tautology Objection is a Straw Man.** Biologists don't define fitness circularly. Fitness is defined by specific traits and environmental contexts, independent of the outcome. We can predict who *should* survive based on traits, then check if they *do*. If they don't, the theory is falsified.
      *   **Point 3: Falsifiability applies to specific models, not the whole framework.** Popper's criterion applies to specific hypotheses derived from the theory, not the grand theory of evolution itself. (Lakatos's "Research Programme" is actually a better fit here, and it's not pejorative).
      *   **Point 4: Predictive Power.** Evolutionary biology makes specific predictions (fossil records, genetic markers, observed speciation events) that have been confirmed.
      *   **Point 5: The ID Misuse.** ID writers often freeze Popper's view at his most skeptical moment and ignore his retraction and the subsequent philosophy of science developments.

