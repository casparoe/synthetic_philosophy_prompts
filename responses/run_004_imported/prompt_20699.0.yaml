  6.  **Final Polish:**
      *   Ensure the "Grief is Normal" mission statement is honored.
      *   Ensure the financial/clinical reality is honored.
      *   Make sure the recommendation is bold.

      *(Self-Correction on Philosophy)*: The user explicitly mentioned Boorse/Wakefield/Nordenfelt. While the memo shouldn't be a lecture, acknowledging that *this is fundamentally a definitional debate* validates the user's insight. I will frame the recommendation around "Harmful Dysfunction" (Wakefield) — acknowledging harm without insisting on a rigid biological cutoff.

