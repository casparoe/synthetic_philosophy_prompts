answer: |-
  This is an excellent question, and your research has uncovered one of the most famous episodes in 20th-century philosophy of science. You are correct about the historical facts: Karl Popper did propose verisimilitude (truthlikeness) to explain scientific progress without induction, and David Miller and Pavel Tichý did deliver a devastating blow to Popper's specific formulation in 1974.

  However, your proposed conclusion for the article—that the *idea* of theories getting closer to the truth is "mathematically incoherent" and that specialists "wrote it off as a dead end"—is **incorrect**. You are indeed smuggling in a conflation, though it is a very common one. You are conflating **Popper's specific definition** with the **general concept of truthlikeness**.

  Here is the precise account you need to adjust your framing, broken down by the theorem, the aftermath, and the implications for your article.

  ### 1. What the Miller-Tichý Theorem Actually Showed
  Popper defined the verisimilitude ($Vs$) of a theory $A$ roughly as the balance of its truth-content versus its falsity-content. He wanted to say that even if Theory A and Theory B are both strictly false (because they make some incorrect predictions), Theory A can have higher $Vs$ if it entails more true statements and fewer false ones than Theory B.

  Miller and Tichý proved that, given Popper's own logical definitions of "content," this comparison collapses.
  *   **The Technical Result:** If we assume the standard logical consequence relation, it turns out that if Theory A is false, you cannot construct a Theory B that is "closer to the truth" than A using Popper's metrics. In many formulations, all false theories end up having the same verisimilitude (often zero or undefined relative to one another).
  *   **The Implication:** Popper's *formal machinery* could not do the job he built it for. It could not rank false theories. Since almost all scientific theories are technically false (idealizations, limited domains, etc.), Popper's definition rendered scientific progress inexplicable *by Popper's own standards*.

  So, your friend is right that Popper's specific solution failed. But this does not prove that *no* definition of verisimilitude can work.

  ### 2. What Happened After 1974 (The "Dead End" Myth)
  This is where your research needs updating. The philosophy of science community did not quietly write off verisimilitude. In fact, the Miller-Tichý result sparked a renaissance in the field. Philosophers realized that Popper's mistake was relying on **logical content** (entailment) rather than **similarity**.

  Starting in the late 1970s and exploding in the 1980s and 90s, a new research program emerged, led primarily by **Ilkka Niiniluoto** (University of Helsinki) and **Graham Oddie** (ANU), among others.

  *   **The Shift:** Instead of counting true/false consequences (Popper's method), they began using **possible worlds semantics**.
  *   **The Method:** Imagine the "actual world" is one specific state of affairs. A theory describes a set of possible worlds. Verisimilitude is then defined as the **distance** between the worlds allowed by the theory and the actual world.
  *   **The Result:** Under these new definitions (similarity-based rather than consequence-based), it *is* mathematically coherent to say that Newtonian mechanics is closer to the truth than Aristotelian physics, and that General Relativity is closer than Newtonian mechanics, even if all three are technically false in some strict ontological sense.

  Niiniluoto's book *Truthlikeness* (1987) is the landmark text here. It synthesized decades of work showing that while Popper's definition was flawed, the concept itself was salvageable. There is still debate today about *which* similarity metric is the correct one (e.g., how do you weigh the importance of different parameters?), but the claim that the concept is "mathematically incoherent" is false. It is technically difficult and philosophically contested, but not incoherent.

  ### 3. The Conflation in Your Draft
  Your draft framing rests on this syllogism:
  1.  Popper defined verisimilitude.
  2.  Popper's definition was proven impossible.
  3.  Therefore, verisimilitude is impossible.

  This is a logical error. It is analogous to saying:
  1.  Newton defined gravity as a force acting instantaneously at a distance.
  2.  Einstein showed instantaneous action at a distance is impossible.
  3.  Therefore, the idea that masses attract each other is incoherent.

  Einstein didn't kill gravity; he refined the definition. Similarly, Niiniluoto and others didn't kill verisimilitude; they refined the definition.

  ### 4. Recommendations for Your Article
  You have a fantastic narrative hook here: the dramatic collapse of a great philosopher's formal system. That is worth keeping. However, to maintain credibility with experts, you should adjust the conclusion.

  **Do not say:**
  *   "Scientists are leaning on a concept shown to be mathematically incoherent."
  *   "Specialists quietly wrote it off as a dead end."

  **Do say:**
  *   "Popper's specific *formalization* of the idea was shown to be untenable."
  *   "While Popper's definition failed, the philosophical project of defining 'truthlikeness' survived and evolved."
  *   "Scientists use the intuition of progress pragmatically, while philosophers continue to debate how to formalize it."

  **Why this matters for your piece:**
  If you claim the concept is incoherent, you inadvertently undermine the realist stance of most working scientists. Most scientists are "critical realists"; they believe their models approximate reality. If you tell them their core intuition was mathematically debunked in 1974, they will rightly be skeptical of your piece, because they know their models *do* get more predictive and robust over time.

  The more nuanced story is actually more compelling: **Popper tried to solve the problem with logic alone and failed. The solution required shifting from logic to semantics (meaning and reference).** This highlights that scientific progress isn't just a game of symbolic manipulation (as Popper hoped); it requires a connection to the structure of the world (similarity metrics).

  ### Summary for your Sanity Check
  *   **Did Miller and Tichý refute Popper's definition?** Yes, definitively.
  *   **Did they refute the possibility of defining verisimilitude?** No.
  *   **Is the concept considered a "dead end" by specialists?** No. It is a vibrant subfield of philosophy of science (search for "truthlikeness" in the *Stanford Encyclopedia of Philosophy*).
  *   **Are scientists unknowingly using a debunked concept?** No. They are using a pragmatic intuition that philosophers have since rehabilitated with better tools.

  If you frame the article as "The dramatic failure of Popper's specific attempt, and the ongoing struggle to get it right," you will have a robust, accurate, and fascinating piece. If you frame it as "The mathematical proof that scientific progress is an illusion," you will be overstating the case.
