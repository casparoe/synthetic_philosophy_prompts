answer: |-
  Good morning, faculty, family, friends, and the Class of 2024.

  Traditionally, this is the part of the ceremony where I tell you that your past guarantees your future. We look at our transcripts, our test scores, and the four years we've spent in these halls, and we say: "Look at that track record. You succeeded then, so you will succeed now." It is a comforting argument. It relies on induction—the logical assumption that the patterns of the past will continue into the future.

  But I took a philosophy elective this year that has made it impossible for me to give you that speech without a footnote. Specifically, I want to talk about a problem posed by the philosopher Nelson Goodman, known as the "New Riddle of Induction." And I want to talk about a color called "grue."

  To explain: Imagine we are looking at emeralds. Every emerald we have ever observed in history has been green. So, we naturally form the hypothesis: "All emeralds are green."

  But Goodman asks us to consider a different predicate. An object is "grue" if it is observed before a specific time *t* and is green, or observed after time *t* and is blue. Let's set time *t* as the moment of our graduation.

  Every emerald we have seen up until this very second fits *both* definitions. They are all green. Therefore, they are all "grue" (because they are green before graduation). The evidence we have right now supports the hypothesis "All emeralds are green" and the hypothesis "All emeralds are grue" exactly equally.

  But the predictions they make for tomorrow are contradictory. If "green" is the true pattern, the emeralds stay green. If "grue" is the true pattern, the moment we walk out these doors, the emeralds turn blue.

  David Hume famously asked how we know the future will resemble the past at all. Goodman's riddle is more specific. He grants that the future *will* resemble the past. He asks: *Which* past? Which regularity are we projecting? The data alone cannot tell you. A track record, by itself, is compatible with infinite conflicting futures.

  This is, admittedly, a little unsettling for a commencement speech. It suggests that being a "high-achieving student" is just one way to describe our track record. An equally valid description based on the same data could be "a person who achieves only until graduation day." The evidence supports both.

  So, why do we bet on green? Why do we trust that the sun will rise, that gravity will hold, and that the skills we learned here will still work tomorrow?

  Goodman's answer lies in a concept called "entrenchment." We project "green" not because nature forces us to, but because "green" is a predicate that is deeply woven into our language, our science, and our shared lives. It is useful. It allows us to build a world together. "Grue" is logically possible, but it is practically useless. It creates a world we cannot navigate.

  This is where the hope lies.

  If the future were strictly determined by the past, we would be prisoners of our transcripts. But Goodman shows us that the future is not found in the data; it is found in the *projection*. We are not passive observers waiting to see if we turn blue or stay green. We are the ones who choose which predicates to entrench.

  We choose to project "resilience" rather than "fragility." We choose to project "community" rather than "isolation." We choose to act as though kindness is a stable property of the universe, not because the data proves it, but because a world where kindness is stable is a world worth building.

  To my philosophy teacher, seated in the front row: I know that "entrenchment" is not a magic wand. It requires constant maintenance. It requires us to reject the "grue" descriptions of our lives—the ones that say our potential expires today, or that our success is a fluke that ends at the stadium exit.

  To the rest of the class: The uncertainty of the future is not a bug; it is a feature. The fact that the past does not force a single future upon us means that we have agency. We get to decide which patterns to honor.

  So, as we leave this place, let us not simply hope that the future resembles the past. Let us make it so. Let us entrench the habits that sustain us. Let us project the values that connect us. Let us agree, together, that when we walk out into the world, we remain green.

  Thank you, and congratulations.
