      *   *The Implication:* After time *t*, the "green" hypothesis says emeralds stay green. The "grue" hypothesis says they turn blue. Past evidence supports *both* equally.
      *   *The Lesson:* Data doesn't speak for itself. We choose the predicates we project based on habit, utility, and "entrenchment."

  3.  **Drafting - Section by Section:**

