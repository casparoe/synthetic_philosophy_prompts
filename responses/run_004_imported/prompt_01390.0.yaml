answer: |-
  **Solubility and Sorcerers: Why the Conditional Analysis of Dispositions Fails**

  **Introduction: The Chemist's Intuition**

  For thirty years, your working definition of solubility was likely operational: a salt is soluble if, under standard conditions, it dissolves in water. In the laboratory, this definition is robust. It guides prediction, classification, and experiment. It treats "solubility" as a shorthand for a specific behavior under specific conditions. In philosophy, this is known as the **Simple Conditional Analysis (SCA)** of dispositions.

  The SCA proposes a biconditional relationship:
  *Object $x$ is disposed to manifest $M$ when stimulated by $S$ if and only if, if $x$ were $S$, $x$ would $M$.*

  Translated to your trade: *This salt is soluble if and only if, if it were dropped in water, it would dissolve.*

  For decades, this worked perfectly. However, when metaphysicians scrutinize the *nature* of properties rather than their *utility*, the SCA crumbles. The problem isn't that the analysis fails in the lab; it's that it fails to capture what solubility *is* in the real world. Two specific counterexamples, **finks** and **masks**, demonstrate that the conditional (the "if-then" statement) and the disposition (the actual property) can come apart.

  This essay will examine why these counterexamples break the SCA, evaluate the most famous repair job (David Lewis's Reformed Conditional Analysis), and commit to a verdict: you should accept that dispositions cannot be reduced to conditionals. They are real, irreducible features of the world.

  **The Counterexamples: Finks and Masks**

  To see why the SCA fails, we must look at scenarios where the truth value of the conditional does not match the presence of the disposition.

  **1. Finks (The Disposition Vanishes)**
  A "fink" is a situation where the stimulus itself causes the object to lose the disposition before the manifestation can occur.

  Imagine a fragile glass connected to a "sorcerer" (or a sensitive electronic sensor). The sorcerer monitors the glass. The instant the glass is struck (the stimulus), the sorcerer casts a spell that makes the glass structurally robust *before* the impact can cause shattering.
  *   **The Disposition:** Before the strike, the glass is genuinely fragile. Its molecular structure is brittle.
  *   **The Conditional:** "If the glass were struck, it would break." This is **false**. Because of the sorcerer, it won't break.
  *   **The SCA Verdict:** Since the conditional is false, the SCA says the glass is *not* fragile.
  *   **The Reality:** The glass *was* fragile right up until the moment of impact. The stimulus removed the disposition.

  In chemistry, imagine a reactive metal that, upon contact with oxygen, instantly coats itself in an inert nano-layer that prevents oxidation. The SCA would say the metal isn't reactive, because if you exposed it to oxygen, it wouldn't react. But intuitively, the metal possesses the reactive disposition; the reaction itself triggers a defense mechanism that hides it.

  **2. Masks (The Disposition is Hidden)**
  A "mask" is a situation where the object retains the disposition, but an extrinsic factor prevents the manifestation.

  Consider that same fragile glass, but this time it is tightly wrapped in bubble wrap.
  *   **The Disposition:** The glass is still fragile. Its intrinsic structure hasn't changed.
  *   **The Conditional:** "If the glass were struck, it would break." This is **false**. The bubble wrap absorbs the impact.
  *   **The SCA Verdict:** Since the conditional is false, the SCA says the glass is *not* fragile.
  *   **The Reality:** The glass is still fragile. If you removed the bubble wrap and struck it, it would break. The disposition is present but masked.

  In your field, consider a soluble salt dropped into water that is already saturated with that same salt. The salt does not dissolve. Under the SCA, because "if dropped in water, it dissolves" is false in this specific instance, the salt loses its solubility. But we know the solubility is an intrinsic property of the salt; the saturation of the solvent is an extrinsic mask.

  **The Patch Job: Lewis's Reformed Analysis**

  The philosopher David Lewis recognized these problems. He argued that the SCA failed because it didn't specify *why* the object would manifest the behavior. He proposed the **Reformed Conditional Analysis (RCA)**.

  Lewis suggested that a disposition is grounded in an **intrinsic causal basis**. For salt, the basis is its ionic lattice structure. For glass, it's the amorphous silica network. Lewis's revised definition looks roughly like this:

  *Object $x$ is disposed to $M$ when $S$ iff $x$ has an intrinsic property $B$ (the basis) such that, if $x$ were $S$ and $B$ persisted, $x$ would $M$.*

  **Does it work?**
  *   **Against Finks:** Yes. In the sorcerer case, when the glass is struck, the intrinsic basis (brittleness) does *not* persist; the sorcerer changes it. Since the clause requires the basis to persist, the conditional becomes true (If struck *and* it stayed brittle, it would break). The RCA correctly identifies the glass as fragile.
  *   **Against Masks:** No. This is where the patch leaks. In the bubble wrap case, the intrinsic basis (brittleness) *does* persist. However, the glass still doesn't break. The conditional "If struck and basis persists, it would break" is still false because the bubble wrap interferes. Lewis tried to add "ceteris paribus" (all else being equal) clauses to rule out masks, but this makes the definition vague. If you have to list every possible mask (bubble wrap, vacuum, zero gravity, divine intervention) to make the conditional true, the analysis loses its simplicity and utility.

  Furthermore, there is a reverse problem called **Mimics**. Imagine a non-fragile glass attached to a tiny explosive that detonates on impact, shattering the glass.
  *   **The Conditional:** "If struck, it would break." (True).
  *   **The Disposition:** Is it fragile? No. It's sturdy glass aided by an explosive.
  *   **The SCA/RCA Verdict:** Both might incorrectly label it as fragile because the manifestation occurs.

  **The Verdict: Abandon Reductionism**

  So, we arrive at the core question: Is there a version of the conditional analysis worth keeping, or should you accept that dispositions can't be reduced to conditionals?

  **I commit to the latter.** You should accept that dispositions cannot be reduced to conditionals at all.

  Here is why. The project of the Conditional Analysis is **reductionist**. It attempts to define dispositions (powers, capacities, potentials) in terms of something "safer" or more "factual"—namely, categorical properties and conditional statements about events. It tries to say that "solubility" is nothing *over and above* the fact that "it dissolves when wet."

  But finks and masks show that the disposition and the manifestation are distinct. The solubility exists even when the salt doesn't dissolve (in saturated water). The fragility exists even when the glass doesn't break (in bubble wrap). This suggests that the disposition is a **real property** in its own right, not just a linguistic shortcut for a prediction.

  This view is often called **Dispositional Essentialism** or **Power Primitivism**. It holds that fundamental properties of the universe *are* powers. An electron's charge isn't just a label for how it moves in a field; the charge *is* the power to move in that field. The conditional ("if placed in a field, it moves") is a *test* for the disposition, and a reliable one in standard conditions, but it is not the *definition* of the disposition.

  **Why this matters for a Chemist**

  You might ask: "Does this matter? My SCA worked for 30 years."

  It matters for how you interpret the ontology of your science.
  1.  **Scientific Realism:** If you accept that dispositions are irreducible, you accept that the "potentialities" you measured are real features of nature, not just summaries of past observations. The solubility is in the salt, not just in the history of salts dissolving.
  2.  **Laws of Nature:** If dispositions are real powers, then laws of nature aren't just rules imposed on the universe from the outside; they are descriptions of how these intrinsic powers interact. Gravity isn't a rule that tells masses to attract; mass is the power to attract.
  3.  **The Limits of Operationalism:** Your career relied on operational definitions (define a thing by how you measure it). Philosophy shows that operationalism is pragmatically brilliant but metaphysically incomplete. You can measure a disposition via conditionals, but the disposition itself is the *cause* of the conditional truth, not the result of it.

  **Conclusion**

  The Simple Conditional Analysis is like the Ideal Gas Law. It works beautifully under standard conditions, but it breaks down at extremes (high pressure, low temperature, or in the presence of sorcerers). Lewis's Reformed Analysis is like adding van der Waals corrections—it handles some deviations but remains a patchwork of clauses trying to save a model that is fundamentally misaligned with reality.

  The conditional analysis fails because it tries to reduce a *cause* (the disposition) to an *effect* (the manifestation). Finks and masks prove that the cause can exist without the effect. Therefore, the most philosophically robust position is to stop trying to define dispositions away. Solubility, fragility, and reactivity are real, irreducible powers inherent in matter. You were measuring real powers all along; you just didn't need to worry about the metaphysics to get the titration right.

  **Recommendation:** Discard the Conditional Analysis as a definition. Keep it as a heuristic. Accept that the world is made of things that *can* do things, not just things that *do* things.
