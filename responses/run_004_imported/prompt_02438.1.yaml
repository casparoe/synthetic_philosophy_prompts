      *   **Analyze Kripke's Target:** Explain that Kripke attacked the former, not the latter.
      *   **Assess the Current Status of Russell's Theory:** Explain that while it has rivals (Strawson, Donnellan, Situation Semantics), it is far from "dead" and is certainly not killed by Kripke.
      *   **Address the "Habit" Claim:** Refute the idea that it's taught only out of habit. It's taught because it's a foundational tool in logic and semantics.
