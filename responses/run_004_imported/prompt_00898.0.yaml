answer: |-
  The short answer is: **No, there is no scoring system that will fix this for good.**

  The long answer is that you and your friends have accidentally rediscovered one of the most famous results in social choice theory. You are running headfirst into **Gibbard's Theorem**.

  In 1973, philosopher Allan Gibbard proved that for any voting system with three or more possible outcomes, if the system is deterministic (no dice rolling) and not a dictatorship, **it is always possible for a voter to benefit by lying about their preferences.**

  In other words: **Strategic voting is a feature, not a bug.** It is mathematically impossible to design a ranked voting system where honesty is always the best policy for every voter in every scenario.

  ### Why your attempts failed

  You mentioned trying three specific systems. Here is why the math guarantees they will all eventually break under strategic pressure:

  1.  **Straight Point Totals (Borda Count):**
      *   *How it works:* 1st place gets 5 points, 2nd gets 4, etc.
      *   *The Exploit:* This is extremely vulnerable to "burying." If I know Restaurant A is your favorite and Restaurant B is my favorite, I can rank A last (even if I actually like it okay) to drain its points, boosting B's chances. You realized this and started ranking your 2nd choice 1st to protect it from being buried by others.
  2.  **Weighted First-Choice (Plurality/Bloc):**
      *   *How it works:* Only the #1 vote matters (or matters much more).
      *   *The Exploit:* This encourages "compromising." If my true favorite is a niche sushi place that no one else likes, voting for it honestly is a "wasted vote." I am incentivized to lie and vote for the generic Italian place as my #1, because it has a better chance of winning against the Mexican place I hate.
  3.  **Instant-Runoff (IRV):**
      *   *How it works:* Eliminate the last-place option and redistribute votes until one has a majority.
      *   *The Exploit:* This is vulnerable to "push-over" strategies. Sometimes, it is beneficial to vote for a weak candidate you *don't* want in the first round, because you know they will be eliminated quickly and their votes will transfer to your actual favorite, whereas a strong competitor might knock out your favorite early.

  ### The "Engineering" Dead End

  You asked if you can "engineer your way out" of this. Theorem-wise, the answer is **no**.

  Even if you switch to **Score Voting** (rating each restaurant 1–5 stars instead of ranking them), people will start "min-maxing." Instead of giving your 2nd choice a 4 and your 3rd choice a 3, you will give your 2nd choice a 5 and your 3rd choice a 0 to maximize the point differential. The system collapses back into a binary "Yes/No" battle, and the nuance is lost.

  If you switch to a **Condorcet Method** (picking the option that beats every other option in head-to-head matchups), you run into the problem of "cycles" (A beats B, B beats C, C beats A), which requires a tie-breaker rule. Once there is a tie-breaker rule, voters will strategize to force the tie-breaker in their favor.

  ### So, how do you actually fix it?

  Since you cannot solve this with *math*, you have to solve it with *sociology* or *economics*. You need to change the incentives so that gaming the system is either socially costly or economically risky.

  Here are four non-mathematical solutions that actually work in friend groups:

  **1. The "Treat" Incentive (Economic)**
  The person who campaigns hardest for a specific restaurant, or ranks it #1 when it has no chance of winning naturally, has to pay the tip (or buy the first round of drinks).
  *   *Why it works:* It aligns incentives. If you really want Sushi that much, you can game the vote, but it will cost you $20. If you don't want to pay, you'll vote honestly for the group consensus.

  **2. The Veto Method (Subtractive)**
  Instead of ranking what you *want*, everyone gets one veto. You list the 6 options; everyone crosses out the one they absolutely refuse to eat. Pick randomly from the survivors.
  *   *Why it works:* It's much harder to strategize against something. You can't boost your favorite, but you can prevent your hated option. It creates a "floor" of acceptability rather than a "ceiling" of optimization.

  **3. Randomized Shortlist (Chance)**
  Everyone submits honest rankings. The top 3 restaurants are selected. Then, you roll a die.
  *   *Why it works:* Gibbard's Theorem applies to *deterministic* systems. Introducing randomness reduces the payoff of strategic voting. If I lie to boost Restaurant B, I might accidentally cause Restaurant C to make the shortlist instead of A, and then the dice roll screws me. The risk of backfiring increases, encouraging honesty.

  **4. The Dictator Rotation (Social)**
  Stop voting. Rotate who picks the restaurant each time.
  *   *Why it works:* It acknowledges that over a long timeline, fairness balances out. Tonight is Bob's night; he picks the place he loves. Next week is Alice's night. It removes the temptation to game the vote because there is no vote.

  ### The Verdict

  You are trying to optimize a social coordination problem using a tool (voting theory) that is mathematically proven to be imperfect.

  The frustration you feel is the feeling of hitting the **Gibbard's Theorem wall**. You can stop looking for the perfect algorithm; it doesn't exist. My recommendation? **Go with the Dictator Rotation.** It saves mental energy, eliminates the incentive to lie, and ensures that over the course of a year, everyone gets exactly what they want an equal number of times.

  Save the math for the bill split.
