answer: |-
  **Setting:** *A quiet corner of a university library café. Two graduate students, Alex (Expressivist) and Ben (Moral Realist), are surrounded by stacks of papers. Alex is stirring a tea; Ben is highlighting a text.*

  **Ben:** Okay, I've read your draft on norm-expressivism three times. I get the motivation. You want to save ethics from metaphysical weirdness. No "moral facts" floating in the universe. Just us, our norms, and our attitudes. But I keep hitting the same wall you said you'd address, and I don't think the patch holds.

  **Alex:** The Frege-Geach problem. The embedding problem. I figured you'd lead with that.

  **Ben:** It's the dealbreaker, isn't it? Look, let's use a fresh example. Not lying. Let's say: **"Publicly shaming children is wrong."**

  **Alex:** Okay. I can express my disapproval of that. "Boo shaming children."

  **Ben:** Right. That works when you stand alone and say, "Shaming children is wrong." You're expressing an attitude. But now look at this argument:
  1. If publicly shaming children is wrong, then paying someone else to do it is wrong.
  2. Publicly shaming children is wrong.
  3. Therefore, paying someone else to do it is wrong.

  This is a valid modus ponens. For it to be valid, the phrase "publicly shaming children is wrong" must mean the *same thing* in premise 1 and premise 2. But in premise 2, you're booing. In premise 1, you aren't booing anything. You're just hypothesizing. You haven't committed to the attitude yet. So what content does that phrase carry in the conditional? If it carries no attitude there, the meaning shifts. If the meaning shifts, the argument is a fallacy of equivocation.

  **Alex:** I know the trap. The standard Expressivist answer—and I'm leaning on Gibbard here—is that we're thinking about logic too narrowly. You Realists think validity is about *truth preservation*. If the premises are true, the conclusion *must* be true. But for us, validity is about *consistency of attitudes*.

  **Ben:** Consistency of attitudes. That's the phrase that always makes my eyes glaze over. Be specific. What does it mean for two *feelings* to be inconsistent? If I like chocolate and I like vanilla, that's not inconsistent. If I like chocolate and I hate chocolate, that's... psychologically difficult. But it's not *logically* impossible. I can be a mess. Logic isn't about therapy.

  **Alex:** It's not about feelings like "yum" or "yuck." It's about *plans*. Think of moral judgments as a species of planning. When I say "Shaming children is wrong," I am ruling out a option in my practical deliberation. I am planning *not* to shame children.

  **Ben:** Okay. So premise 2 is "I plan not to shame children."

  **Alex:** Exactly. Now look at premise 1: "If shaming children is wrong, then paying someone to do it is wrong." In planning terms, this is recognizing a constraint on my plans. It's saying: "I cannot consistently plan to avoid shaming children while leaving open the option of paying someone to shame them." To hold the attitude in premise 2 without the attitude in the conclusion is a planning failure. It's like planning to go to New York but refusing to plan to take a plane or train or car.

  **Ben:** I see the move. You're redefining logical inconsistency as *practical* inconsistency. But here is the weak joint, Alex. You're conflating *being* inconsistent with *counting as* inconsistent.
  If I believe "It is raining" and "It is not raining," I am contradicting reality. The world forces me to choose. But if I plan "No shaming" and "Yes paying for shaming," why is that inconsistent? You just *say* it is. What makes it irrational?

  **Alex:** Because the content of the plan entails it. If I am against shaming *because* it harms dignity, then paying someone to do it also harms dignity. My own normative commitments force the connection.

  **Ben:** But that's the question! *What makes* your normative commitments force the connection? For a Realist, the answer is easy: The *proposition* "Shaming is wrong" entails the proposition "Paying for shaming is wrong." The relationship is in the *content*, independent of your psychology.
  For you, the relationship only exists if you *happen* to have a psychology that links them. What if I meet a sociopath who says, "I disapprove of shaming, but I have no attitude at all about paying for it"? On your view, is he illogical? Or just different?

  **Alex:** He's illogical. Because to disapprove of shaming *just is* to have a stance that rules out the means to shaming. Gibbard calls this "being for" blaming for shaming. If you are for blaming for shaming, you must be for blaming for paying-for-shaming.

  **Ben:** See, that sounds like a definition, not an argument. You're defining moral terms in a way that smuggles in logical relations. Let's press harder on the negation. This is where I think you actually get stuck.
  Consider the sentence: **"It is not the case that publicly shaming children is wrong."**
  What attitude is expressed there?

  **Alex:** That's the negation problem. Okay. If "Shaming is wrong" expresses disapproval... then "It is not the case that shaming is wrong" expresses... tolerance? Indifference?

  **Ben:** Exactly. But "tolerance" isn't the logical negation of "disapproval." The negation of "I disapprove" is "I do not disapprove." But "I do not disapprove" could mean "I haven't thought about it." But "Shaming is not wrong" is a positive claim. It's saying shaming is *permissible*.
  So, in your conditional premise—"If shaming is wrong..."—you aren't disapproving. But you also aren't approving. You're holding the content in suspension. But if your theory says moral sentences *are* expressions of attitude, and there is no attitude being expressed in the antecedent, then the antecedent is empty. It's a shell.

  **Alex:** I concede that if we treat the sentence *strictly* as a report of my current psychological state, the antecedent is empty. But that's why it's *Quasi*-Realism. We earn the right to talk *as if* there are truth conditions.
  When I say, "If shaming is wrong...", I am not reporting my attitude. I am engaging in a higher-order attitude. I am expressing my commitment to a norm that links the two. I'm saying, "I reject any normative system that condemns shaming but permits paying for it."

  **Ben:** Okay, that's Blackburn's move. You shift the attitude up a level. It's not "Boo shaming." It's "Boo having a moral framework where shaming is booed but paying is allowed."
  But Alex, look at what you've done. To solve the logic problem, you've had to abandon the core Expressivist insight.
  The core insight was: Moral language is different from descriptive language. It's about emotions/plans, not facts.
  But to make the logic work, you've had to construct a system of "normative frameworks" that behave exactly like facts. They have consistency conditions, they entail other norms, they can be accepted or rejected.
  You've built a shadow realm of "normative facts" to make the logic work. Why not just admit the realm is real?

  **Alex:** Because the ontology is different! A "normative fact" for me isn't a weird object in the universe. It's a stable convergence of human attitudes. When I say the argument is valid, I'm not saying "The Truth is preserved." I'm saying "Any agent who accepts the premises *must*, by the nature of practical rationality, accept the conclusion."
  It's not about the world; it's about the agent.

  **Ben:** But logic isn't about agents. That's my point. If I say, "If P then Q; P; therefore Q," this is valid even if no agents exist to think it. The *relation* holds.
  If Expressivism is true, logic in ethics is contingent on there being creatures with planning psychologies. If we all died, "Shaming is wrong" would vanish. But "If shaming is wrong, then paying for it is wrong" would *also* vanish.
  For the Realist, the conditional relationship remains true even if no one is around to disapprove of anything. The *implication* is mind-independent.
  Do you really want to say that logical validity in ethics disappears if humans go extinct?

  **Alex:** *Pauses, tapping the spoon against the mug.*
  That's... a hard bullet to bite.
  Okay. I'll concede that point. If by "validity" you mean a Platonic relation between abstract propositions, I don't have that. I can't have that without abandoning Expressivism.
  But here is my counter-punch: Who cares?
  We aren't angels. We are humans. We are planning creatures. When *we* do ethics, when *we* argue, we need a logic that governs *us*.
  If I can show that *for any agent like us*, accepting the premises forces the conclusion via consistency of plans, haven't I saved everything that actually matters?
  You Realists posit invisible facts to save the idea that logic is "out there." I posit constraints on planning to save the idea that logic is "in here." But the result—the actual practice of arguing, the inability to deny the conclusion without irrationality—is the same.

  **Ben:** It's not the same, though. It's the difference between "I can't deny this because it's false" and "I can't deny this because I'd be crazy."
  If I'm a clever sociopath, I can say, "I know my attitudes are inconsistent. I know I'm planning against shaming but allowing paying-for-shaming. I just don't care about consistency. I'm not rational."
  On your view, has he made a *logical* error? Or just a prudential one?
  If it's just a prudential error—like eating junk food while planning to be healthy—then moral logic isn't logic. It's just advice on how to be psychologically tidy.
  But when I say the argument is valid, I mean you *can't* accept the premises and reject the conclusion. Not that it's messy to do so.

  **Alex:** This is the "Normative Logic" gap. I admit, this is the hardest part.
  Gibbard tries to handle this by saying that to judge something is to *accept a norm* that permits the judgment. And norms themselves have logical structure.
  So, if the sociopath says "I don't care about consistency," he is rejecting the norms of reasoning themselves. He is opting out of the game of giving and asking for reasons.
  But within the game? Within the practice of ethics? The logic holds firm.
  Maybe the concession is this: Expressivism cannot ground logic *metaphysically*. It can only ground it *pragmatically*.
  I can't tell you why the inference holds in a universe without minds. I can only tell you why *you*, right now, cannot assert the premises and deny the conclusion without undermining your own capacity to act as an agent.

  **Ben:** So you're retreating to a pragmatic validity. "It works for us."

  **Alex:** I'm saying that's all validity ever was. Even in math. We construct systems of rules. If you accept the axioms, you must accept the theorems. Why? Because that's what "accepting the axioms" *means*.
  I'm doing the same with morals. "Accepting the norm against shaming" *means* "Accepting the norm against paying for shaming."
  If you say, "But what makes it mean that?" I say: "Our shared nature as planning beings."
  You want a deeper "what makes it." I think that's a ghost.

  **Ben:** I think it's the only thing that saves us from the sociopath. If it's just "our shared nature," and the sociopath's nature is different, he's off the hook. He's playing a different game.
  For the Realist, he's not playing a different game. He's *wrong*. About the world. About the relations between values.
  Your view makes moral error a kind of internal incoherence. My view makes it a kind of blindness.
  And I think blindness is a better explanation for why we feel *discovered* in morality, rather than *invented*. When I work through that conditional about shaming, it feels like I'm uncovering a connection that was already there, not stitching together my own plans.

  **Alex:** And I'd say that feeling of "uncovering" is exactly what Quasi-Realism explains. We project the structure of our plans onto the world so effectively that it *looks* like discovery.
  So, to answer your original question: Do I have a solution to Frege-Geach?
  Yes, but it's a reconstruction. I rebuild logic from the ground up using attitudes.
  Do I have a solution that satisfies *you*? No. Because you want logic to be prior to psychology. I think psychology is prior to logic.
  So the "weak joint" you found? It's real. It's the point where my theory admits it can't speak to a mind-independent validity.
  But I'd argue that's a feature, not a bug. Because there is no mind-independent validity to speak of.

  **Ben:** *Closes his highlighter.*
  Well. You've admitted you can't save objective validity. I've admitted your system mimics it perfectly well for practical purposes.
  So the disagreement isn't about whether the argument *works*. We both agree the argument works.
  The disagreement is about whether "works" is enough.

  **Alex:** Precisely. You want a guarantee from the universe. I'm offering a guarantee from each other.

  **Ben:** I'll take the universe. It's more reliable.

  **Alex:** And I'll take each other. Because the universe isn't the one doing the shaming.

  *They sit in silence for a moment, the tension of the unresolved metaphysical gap hanging between them, even as they both agree on the conclusion.*
