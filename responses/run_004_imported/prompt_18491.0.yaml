  The cursor blinked at the end of the sentence: *I think we need to stop seeing each other.*

  Elias sat in the glow of his monitor, the hum of the server room beneath his office vibrating through the soles of his shoes. For three hours, he had hovered over the send key, paralyzed by the illusion of the fork in the road. He wanted to believe that the next moment was unwritten, that his finger's descent was a genuine creation of novelty. But Sarah's voice echoed in his head, dismantling the comfort he'd built around quantum mechanics.

  *"You're hiding behind Copenhagen,"* she had said over coffee last week. *"You think the collapse of the wave function is a gap in causality where your soul can slip in. But that's just one story. And it's not the only one that fits the data."*

  Elias looked at the whiteboard behind his desk. It was covered in the mathematics of the de Broglie–Bohm pilot-wave theory. For months, he had been trying to disprove it, hoping to salvage indeterminacy. Instead, he had only fortified it.

  In Copenhagen, the electron has no position until measured; chance is ontological. In Everett's Many-Worlds, the wave function never collapses, but reality branches endlessly; every choice happens somewhere, diluting the weight of *this* choice. But here, in the austere logic of Bohmian mechanics, the universe was brutally singular.

  He traced the guiding equation on the board with his finger. The wave function, $\psi$, evolved deterministically according to the Schrödinger equation. It never collapsed. But unlike Everett, there were no branching worlds. There was only the wave, and there were the particles. The particles had definite positions at all times, carried along by the pilot wave like dust motes in a current.

  The randomness—the very thing Elias had hoped was the seed of freedom—was merely epistemic. It was the Quantum Equilibrium Hypothesis: the assumption that the initial distribution of particle positions matched $|\psi|^2$. If you knew the exact initial configuration of the universe, the trajectory of every particle for all time was fixed. The apparent chance in his lab experiments wasn't nature rolling dice; it was nature hiding the dice from him.

  "It's nonlocal," Elias whispered to the empty room.

  That was the cost of realism. Because the pilot wave lived in configuration space, not three-dimensional space, the velocity of a particle here depended instantly on the positions of particles light-years away. Bell's inequalities demanded nonlocality, and Bohm embraced it openly. But that connectivity meant the universe was a single, tightly wound clockwork.

  Elias looked back at the email. If Bohm was right, his brain was not a generator of possibilities. It was a collection of particles with definite positions, guided by a universal wave function that had been evolving since the Big Bang. The state of his neurons right now—the hesitation, the guilt, the resolve—was not a choice emerging from the void. It was the inevitable result of the pilot wave pushing the configuration of his matter along a specific trajectory established at the dawn of time.

  In Copenhagen, he could have sent the email, or he could have deleted it. The future was open.
  In Everett, one version of him sent it, and another deleted it. Both were real.
  In Bohm, there was only one history. The hidden variables were already set. He was ignorant of them, yes, but his ignorance did not create freedom. It only masked the inevitability.

  He felt a cold heaviness in his chest, the specific despair of the determinist. There was no branching escape hatch. There was no collapse to save him. There was only the flow.

  Sarah had warned him. *"If Bohm is right, you don't have free will. You have the experience of free will, because you don't know the initial positions of the particles in your head. But the path is settled."*

  He had argued then that the subjective feeling of choice mattered. Now, staring at the blinking cursor, the distinction felt like sophistry. The feeling was just another part of the trajectory. The hesitation was written in the wave.

  He thought about deleting the draft. He imagined the relief of keeping things as they were. But he could feel the tension in his shoulder, the specific firing of motor neurons preparing to strike the key. In a Copenhagen world, he could interrupt the chain. In a Bohmian world, the interruption itself would have to be determined by the wave. If he deleted it, it was because the universe compelled him to delete it. If he sent it, it was because the universe compelled him to send it.

  The comfort of indeterminacy was gone. He could not claim credit for the mercy of letting her go, nor could he blame chance for the cruelty. There was only the configuration of matter unfolding exactly as it must.

  Yet, strangely, the paralysis began to loosen. If the outcome was fixed by the initial conditions of the cosmos, then the burden of *making* the future vanished. He was not the author of the story; he was the ink. The anxiety of being the prime mover evaporated, replaced by a somber clarity. He was witnessing the universe reveal itself through his actions.

  The pilot wave pushed. The particles moved.

  Elias stopped fighting the trajectory. He stopped trying to find the gap in the physics where his freedom could hide. He accepted the hidden variables, the nonlocal connections, the single, settled history. He accepted that he was ignorant of the initial conditions, but that the conditions themselves were absolute.

  His finger descended. It was not a choice, not really. It was a measurement of a state that already existed.

  The email sent. The screen refreshed. The history of the universe updated, not with a branching possibility, but with a confirmed fact. Elias leaned back, watching the cursor rest in the empty box, finally understanding that while he could not change the path, he could finally stop pretending he was walking it alone. The wave carried him, deterministic and vast, and there was a terrible peace in letting it.
