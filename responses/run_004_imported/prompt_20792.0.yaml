  2.  **Deconstruct the Core Topic (MEU & Ambiguity):**
      *   *Ellsberg Paradox:* People prefer known risks over unknown risks. Violates Savage's STP.
      *   *Gilboa-Schmeidler (1989):* Axiomatized MEU. Rationality = maximizing the minimum expected utility over a set of priors.
      *   *Critiques:* Too pessimistic, dynamically inconsistent, conflates ambiguity with pessimism, empirical mismatch (expertise effect).
      *   *Extensions:* $\alpha$-maxmin (Hurwicz), Smooth Ambiguity (Klibanoff-Marinacci-Mukerji), Variational Preferences.
      *   *Engineering Parallel:* DRO (minimizing worst-case loss over an ambiguity set).

  3.  **Drafting the Questions (Iterative Process):**

