          *   *Refinement:* The "Competence Hypothesis" (Heath & Tversky). If ambiguity aversion disappears when I feel competent, isn't it just a bias about my own knowledge rather than a rational response to the world?
          *   *Follow-up:* If she says "competence reflects information," ask why the *feeling* of competence matters more than the *actual* information structure.

      *   *Filling the remaining 4-6 questions:*
