answer: |-
  This is a sophisticated question that touches on some of the deepest technical issues in the formalization of moral uncertainty. You are clearly well-versed in the LessWrong/EA discourse (likely familiar with MacAskill's work, the "Parliamentary Model" posts by Todd, etc.).

  However, there is a crucial technical error in your premise that explains most of the confusion: **The Kalai-Smorodinsky (KS) solution does *not* preserve Independence of Irrelevant Alternatives (IIA).**

  In fact, the defining trade-off between the Nash Bargaining Solution (NBS) and Kalai-Smorodinsky is exactly that:
  *   **Nash:** Satisfies IIA, **fails** Individual Monotonicity.
  *   **Kalai-Smorodinsky:** Satisfies Individual Monotonicity, **fails** IIA.

  It is mathematically impossible to satisfy both IIA and Individual Monotonicity (along with Pareto Optimality and Symmetry) simultaneously. KS was specifically derived by dropping IIA to allow for Individual Monotonicity.

  Once we correct this axiom count, the reason researchers haven't switched to KS "across the board" becomes clearer. It is not a case of strict dominance; it is a choice between two different failure modes. Here is why the Nash solution often remains the default in moral uncertainty modeling.

  ### 1. Sensitivity to the "Utopia Point" (The Fanaticism Problem)
  Because KS drops IIA, its outcome depends on the **ideal point** (the maximum possible utility each theory could achieve in the feasible set), not just the shape of the Pareto frontier near the agreement.

  In the context of moral uncertainty, this creates a vulnerability to **scale fanaticism**.
  *   Imagine two moral theories: **Deontology** (max utility scale 100) and **Total Utilitarianism** (max utility scale $10^{100}$ due to potential future populations).
  *   Even if you attempt to normalize utilities (e.g., range normalization), the *feasible set* in any given decision might include options that are theoretically possible but practically irrelevant.
  *   Under KS, if the feasible set expands to include an option that gives Total Utilitarianism a slightly higher theoretical maximum (pushing the "Utopia point" further out), the bargaining line shifts. This can change the chosen action between two "sane" options, even if the new option is never selected.
  *   Under NBS, because it satisfies IIA, the choice between two options depends only on those options (and the disagreement point), not on whether a third, extreme option exists in the feasible set.

  For moral uncertainty, where theories often disagree wildly on the *magnitude* of value (axiological scale), NBS is often viewed as more robust because it is less sensitive to the extreme edges of the utility possibility set.

  ### 2. The Disagreement Point Ambiguity
  Both solutions require a **disagreement point** (what happens if bargaining fails). In a political parliament, this is often the status quo. In a single agent's mind holding moral uncertainty, the "disagreement point" is metaphysically obscure.
  *   Is it random action?
  *   Is it inaction?
  *   Is it the minimum viable utility for all theories?

  NBS is often preferred in economic contexts because it can be derived as the unique equilibrium of a specific non-cooperative game (the Nash Demand Game). This gives it a strategic justification: if the delegates were actually playing a game, NBS is where they would land. KS lacks a similarly canonical non-cooperative foundation. When the "delegates" are metaphorical (as in moral uncertainty), modelers often prefer the solution with the stronger strategic grounding.

  ### 3. Computational and Conceptual Simplicity
  While not a philosophical dealbreaker, there is a pragmatic inertia behind Nash.
  *   **Nash:** Maximize the product of gains over the disagreement point ($\max \prod (u_i - d_i)$). This is a smooth, concave optimization problem that is computationally straightforward.
  *   **Kalai-Smorodinsky:** Requires identifying the Utopia point (max $u_i$ for each $i$ independently) and finding the intersection of the line connecting Disagreement to Utopia with the Pareto frontier. In high-dimensional moral spaces (many theories), calculating the precise Pareto frontier to find that intersection can be more complex than maximizing a product function.

  ### 4. Normalization Interactions
  Much of the recent work on moral uncertainty (e.g., by MacAskill, Todd, and others) focuses heavily on **intertheoretic comparison** and normalization (variance normalization, range normalization, etc.).
  *   If you use **Range Normalization** (scaling each theory's utilities to [0, 1]), the KS solution becomes very similar to a proportional compromise.
  *   However, many modelers argue that **Variance Normalization** is more appropriate for handling uncertainty.
  *   The interaction between the normalization method and the bargaining solution is complex. Some combinations effectively cancel out the benefits of the bargaining solution. For instance, if you normalize such that the disagreement point is 0 and the max is 1 for all theories, KS essentially seeks an equal ratio of satisfaction. NBS seeks to maximize the geometric mean.
  *   There isn't a consensus that the "Individual Monotonicity" property of KS is more important than the "IIA" property of NBS *given* that we are already normalizing utilities to handle scale differences.

  ### 5. Community Discourse and Precedent
  Finally, a sociological point: The "Parliamentary Model" was popularized by Harsanyi and later adapted for moral uncertainty by MacAskill in *Doing Good Better* and his thesis. MacAskill primarily utilized the Nash solution (or voting analogues that approximate it).
  *   Because NBS is the "standard" in economics and decision theory, it is the default assumption unless there is a compelling reason to switch.
  *   While the EA/LessWrong community is technically literate, it tends to converge on focal points. NBS is the Schelling point for bargaining.
  *   Discussions on the EA Forum (e.g., by Ben Todd or Jonas Vollmer) have acknowledged KS as an alternative, but usually conclude that the **IIA violation is more dangerous** in the context of moral theories than the **Monotonicity violation**. The fear is that KS makes your moral decisions too sensitive to "ghost options"—actions you could take but won't, merely because they alter the theoretical maximum of one theory.

  ### Summary
  You aren't missing a hidden benefit of Nash; you are operating under a misconception about KS's axioms. KS **sacrifices IIA** to gain Individual Monotonicity.

  Modelers stick with Nash because, in the context of moral uncertainty:
  1.  **Robustness:** IIA prevents "irrelevant" fanatical options from skewing decisions between normal options.
  2.  **Strategic Grounding:** NBS has a non-cooperative game foundation; KS does not.
  3.  **Scale Sensitivity:** KS is overly sensitive to the maximum theoretical utility of a moral theory, which is problematic when theories disagree on axiological scale.

  If you believe that "a theory shouldn't lose out just because its potential ceiling got higher," then KS is indeed better for you. But if you believe "my choice between A and B shouldn't change just because C became theoretically available," then Nash is superior. Most moral uncertainty modelers prioritize the latter.
