answer: |-
  The air in the assembly hall of King Bhoja was thick with the scent of sandalwood and the heavier weight of suspended judgment. The scholars of the various *darshanas* sat on woven mats, their palms resting on knees, eyes fixed on the central dais.

  Bhasarvajna, the Naiyayika, stood tall. He did not pace; he stood like a pillar of the earth, his hands clasped behind his back. Opposite him sat the Jain preceptors, serene in their white robes, their silence a fortress of *ahimsa* and *anekantavada*.

  Bhasarvajna's voice was not loud, but it carried the precise resonance of a bell struck once.

  "Venerable Jains," he began, bowing slightly. "I do not come here to call your doctrine 'fishery' or 'mere confusion,' as the crude among my school sometimes do. I acknowledge the sophistication of *Anekantavada*. You claim reality is complex, and that human language, being finite, can only grasp it in fragments. You offer the *Saptabhangi*, the sevenfold predication, governed by the particle *Syat*—'in some respect,' 'perhaps,' 'conditionally.' It is a beautiful architecture. But a palace built on a fissure cannot stand, no matter how ornate the carvings."

  He paused, letting the silence tighten.

  "My objection is not to your intent, but to the logical status of your governing proposition. Let us state it clearly: *'All assertions are true only in some respect (syat).'* This is the foundation of your *Syadvada*. Now, I ask you: Does this assertion itself fall under its own rule?"

  Bhasarvajna raised a finger.

  "If you say **yes**—if this assertion is itself only true *syat*, only in some respect—then there exists some respect in which it is *not* true. If it is not true in some respect, then there are some assertions that are unconditionally true. If there are some assertions that are unconditionally true, my Nyaya absolutes are permitted. Your doctrine, which seeks to banish absolutes, has just opened the door for them. You have defeated yourself to save yourself."

  He shifted his weight, anticipating the shift in the Jain posture.

  "But I hear your thought. You wish to say **no**. You wish to claim that the statement *'All assertions are syat'* is itself an absolute truth, unconditioned. If you do this, you escape the first trap, but you walk into the fire. For if that statement is unconditionally true, then you have made at least one absolute assertion. But your doctrine states that *no* assertion can be absolute. By asserting the universality of conditionality, you have created a counterexample to your own rule. You are like a man who shouts, 'I am silent!' The very act of speaking falsifies the content."

  A murmur rippled through the assembly. The Jain acharya, Mallavadin, opened his mouth to speak, but Bhasarvajna raised a hand, gentle but firm.

  "Wait. I am not finished. I know the refuge you seek. I have studied your Agamas. You have two shields prepared for this spear. Let me take them from your hands before you can raise them."

  Bhasarvajna turned slightly toward the King.

  "The first shield is the distinction between *Naya* and *Pramana*. You argue that the statement *'All assertions are syat'* is not a claim about reality itself (*pramana*), but merely a partial verbal standpoint (*naya*) pointing toward a manifold object. You say, 'We do not claim our words exhaust the truth; we claim only that our words are partial.' You try to hide the proposition behind the finger pointing at the moon."

  He turned back to the Jains, his eyes sharp.

  "But this distinction collapses under the weight of your own claim. If you assert that *all* verbal expressions are merely *nayas*—partial, conditioned—then the statement *'All verbal expressions are nayas'* must itself be merely a *naya*. If it is merely a *naya*, it is a partial view. It is valid only from the standpoint of *naya*-theory. From the standpoint of Nyaya realism, it is false. Why, then, should I, a Naiyayika, accept a rule that admits it is only valid from your perspective? You claim your doctrine governs *all* discourse, mine included. But if your doctrine is just one *naya* among many, it has no jurisdiction over my *pramana*. You cannot use a partial rule to universally invalidate my absolute claims. To claim jurisdiction over all speech is to claim a 'view from nowhere,' which is exactly what *naya* denies."

  The hall was utterly still. Bhasarvajna took a breath, preparing for the final, sacred defense.

  "And now, the second shield. The ultimate refuge. I know you wish to say: *'This doctrine is not born of human inference, which is fallible. It is grounded in the perception of the Kevalin, the Omniscient One.'* You argue that the *Kevalin* sees all predicates simultaneously—existence, non-existence, permanence, change—in a single flash of *Kevala Jnana*. Therefore, the contradiction exists only in our limited speech, not in the knowledge that grounds it. The *Syat* is not a hesitation; it is a marker of that infinite simultaneity."

  Bhasarvajna's voice softened, becoming almost sorrowful.

  "This is your strongest move. But it removes you from this assembly. We are engaged in *Vada*—rational debate. The currency of *Vada* is *Pramana* accessible to all participants: Perception (*Pratyaksha*) and Inference (*Anumana*). I cannot see what the *Kevalin* sees. I cannot verify your omniscience without using the very logic you seek to transcend. If you ground your argument in a private, mystical experience inaccessible to your opponent, you are no longer arguing; you are preaching."

  He stepped forward, one pace.

  "If you appeal to the *Kevalin*, you concede that *Syadvada* cannot be established by reason alone. But if it cannot be established by reason, it cannot be used to dismantle my rational proofs. You cannot use a ladder of faith to kick away a bridge of logic. Either your doctrine is subject to the laws of logic, in which case it refutes itself as I showed first; or it is above logic, in which case it has no authority in a court of logic."

  Bhasarvajna folded his hands.

  "You cannot have it both ways. You cannot claim universal validity for a doctrine that denies universal validity, unless you step outside the realm of valid cognition entirely. And if you step outside, you leave the debate to me."

  He bowed low to the King, then to the Jain monks.

  "The *Syat* qualifies the predicate. But it cannot qualify the law of non-contradiction without dissolving the ground upon which we both sit. I yield the floor."

  The silence that followed was not the silence of peace, but the silence of a sword that has finished its cut. The Jain acharya, Mallavadin, looked down at his palms. He had the response of the *Kevalin*, but he knew that in the *Sabha*, among the logicians, Bhasarvajna had just sealed the bounds of the arena. To speak of omniscience now would be to admit that reason had failed. To speak of *naya* would be to admit his doctrine was merely optional.

  The King raised his hand, signaling the end of the round. The Naiyayika sat. The argument hung in the air, unresolved, but for the moment, the structure of *Syadvada* bore a crack that no amount of dialectic could quite plaster over.
