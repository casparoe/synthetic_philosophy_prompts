answer: |-
  The candle flame did not flicker, which Henry noted with a dull thud of disappointment. A draft would have been useful. A draft would have explained the shift in the table's weight, the slight, rhythmic groan of the wood that Mrs. Verrall claimed was the prelude to contact.

  Instead, the air in the room was stagnant, thick with the smell of extinguished wax and the sharper, metallic scent of anticipation.

  Henry sat with his notebook open on his lap, the pencil poised. He was not praying. He was recording. *Time: 11:14 PM. Present: H.S., E.S., F.W.H.M., Medium.* He underlined the *Medium* twice. He needed the data to be clean. If the universe was to speak, it could not speak in the slurred tongue of a trickster.

  To his left, Eleanor's hand rested on his knee. Her grip was steady, an anchor. She did not need the proof the way he did. Her faith was of a quieter, sturdier cloth, woven from duty itself. She could bear the burden of virtue even if the sky remained empty. Henry envied her. He had spent a lifetime calculating the sums of happiness, arguing that the right action was the one that maximized the good, but the equation always left a remainder. *Why?* Why should the individual sacrifice the self for the whole if the self is simply erased at the end?

  If the ledger did not balance, why keep the books?

  "Is there anyone with us?" Frederick Myers asked. His voice was soft, reverent, lacking Henry's clinical edge. Myers wanted a poem; Henry wanted a theorem.

  From the darkness at the head of the table came a sound. *Tap. Tap-tap. Tap.*

  Henry watched the medium's silhouette. Mrs. Verrall was slumped forward, her breathing altered, deeper. Henry's eyes adjusted to the gloom. He looked for the tension in her shoulders that suggested a muscle being held for a kick, the subtle shift of weight that might indicate a foot manipulating a hidden lever. He had exposed so many. The slate-writing frauds in Cambridge, the rapping sisters in London. He had dismantled them with the precision of a surgeon, and each exposure had felt like a small death. Every fraud proven was a door closed.

  "Ask," Eleanor whispered.

  "Is there a message?" Henry said. His voice sounded thin in the heavy air.

  The pencil on the table before the medium began to move. It was not held by a hand. It rolled, then stopped, then scratched. The sound was dry, like a beetle walking over paper.

  Henry leaned forward, his notebook forgotten. He watched the pencil. It moved in short, jagged strokes. He knew the physics of friction. He knew how a hair could be tied to a nib, how heat could expand wood. He scanned the table surface for wax residue, for threads. He found nothing.

  The pencil stopped.

  Myers reached out, striking a match. The flare of sulfur illuminated the room for a moment—Eleanor's pale, expectant face, Myers's wide eyes, Henry's own shadow stretching long against the wall. On the paper beneath the pencil, there were marks. Not words. Not yet.

  *Curved lines. Angles.*

  "Greek?" Myers breathed.

  Henry squinted. It looked like the top of a sigma. Or perhaps a decorative flourish.

  "Wait," Henry said. He held up a hand. "Do not interpret. Record."

  He looked down at his own notebook. *Phenomenon: Automatic script. Legibility: Low. Consistency with known fraud: Inconclusive.*

  He felt a tightness in his chest, a familiar ache that had nothing to do with his heart and everything to do with his mind. He had built a system of ethics that demanded he treat every individual as an end, that demanded he work for the good of all. But reason, cold and sharp, whispered that it was equally rational to seek one's own pleasure. The only thing that reconciled the two—the only thing that made duty smarter than selfishness—was the promise that the sacrifice was not final. That the point of view of the universe and the point of view of the self were, in the end, the same point.

  He needed the dead to speak. Not for comfort. For coherence.

  "Try again," Henry said. "Ask for a name. A specific verification."

  Mrs. Verrall stirred. Her head rolled back. "The... water," she murmured, her voice thick. "It is deep."

  "Who is deep?" Myers pressed.

  "The watchers. They wait for the... the joining."

  Henry's pencil hovered over his paper. *Vague. Cold reading techniques.* He knew the scripts. He knew how to fish for information. But the tone was wrong. It lacked the theatricality of the frauds he knew. It was weary.

  He looked at Eleanor. She was watching him, not the medium. She knew what this cost him. She knew that if he dismissed this, he was dismissing the only possible solution to the problem that had haunted him since he wrote *The Methods*. If he accepted it without proof, he was abandoning the intellect that defined him.

  He was trapped between the need to be rigorous and the need to be saved.

  "Is there a word?" Henry asked. "Just one."

  The medium's hand twitched. The pencil scraped again. A single letter was formed. Then another.

  *S.*

  "P?" Myers suggested. "Spiritus?"

  "No," Henry said. He stared at the letter. *S.* Sidgwick? Self? Soul?

  The medium slumped. The breathing returned to normal. The séance was over.

  Myers blew out the match. The room plunged back into semi-darkness, lit only by the single candle Henry had refused to extinguish.

  "Did you see anything?" Myers asked, his voice trembling with the effort of containment.

  "I saw a pencil move," Henry said. He closed his notebook. The sound was final. "I did not see a hand move it. I also did not rule out a concealed mechanism in the table leg."

  "Henry," Eleanor said softly.

  "It must be ruled out," he said. He stood up, his joints stiff. He felt old. He felt the weight of the years, the years of teaching, of writing, of arguing that goodness was rational. "If we are to build a bridge, Frederick, the pilings must be in bedrock. Not in sand."

  "But if the bridge is real?" Myers insisted. "If the message is there?"

  "Then it will wait," Henry said. He walked to the table and looked down at the paper with the jagged *S*. He reached out, his fingers hovering inches above the graphite, afraid to touch it, afraid to smear the only evidence that the universe might not be indifferent.

  "It will wait," he repeated, quieter.

  He thought of the students who would read his books. He thought of the lives he had urged toward altruism, toward sacrifice. He hoped, with a sudden, fierce intensity that shocked him, that he was not leading them off a cliff. He hoped that somewhere, in the dark where the pencil had moved, there was a balance sheet that finally added up.

  He capped his pencil.

  "Let us go home," he said.

  ***

  Henry died three years later, in 1900. The *S* remained in a file cabinet in Cambridge, cataloged under *Inconclusive*.

  For decades, the silence held. The Society for Psychical Research continued its work, skeptical and steady. But in the years following the deaths of Myers, Gurney, and Sidgwick, strange things began to happen in séances across Europe and America.

  Mediums who had never met, speaking different languages, in different cities, began to produce fragments of text. One in India wrote a line of Latin poetry. One in London drew a complex symbol. One in New York transcribed a dialogue that made no sense in isolation.

  Individually, they were nonsense. But when the secretaries of the SPR began to cross-reference the files, to lay the pages out on long tables in the quiet of the archives, the fragments locked together. The Latin completed the Greek. The symbols matched the diagrams drawn by Myers before his death. The messages referred to specific, private jokes, to unpublished drafts, to the contents of sealed letters.

  It was a puzzle designed to be solved only when the puzzle-makers were gone.

  In 1933, a classicist named Mrs. Holland produced a script that referenced a "secret" held by three friends. She wrote that they had tried to speak in the dark, but the living were too skeptical to hear. They had to scatter the message, hide it in the minds of strangers, to prove that consciousness survived the scatter of the brain.

  The archivists pieced it together. It was a coherent argument. A proof.

  But in the quiet of the archive, under the electric lights, there was no one left to tell. The man who had needed the proof to justify the cost of his own goodness was gone. The ledger had balanced, finally, but the accountant had already closed the books.
