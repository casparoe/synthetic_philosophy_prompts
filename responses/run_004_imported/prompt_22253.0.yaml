  **MEMORANDUM**

  **TO:** Academic Integrity Committee
  **FROM:** [Your Name], Department of Philosophy
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation regarding Case #2023-14 (AI Usage) and Policy Framework

  **Introduction**

  As we prepare for Wednesday's meeting, I am circulating this memo to clarify my position on the Grammarly case (Case #2023-14) and to propose a framework for how we handle similar ambiguities in the future. We are currently split on whether the student's use of an AI editing tool violates the syllabus prohibition on using AI to "generate" work. I believe this division stems not from a disagreement about facts, but from a genuine indeterminacy in the policy itself.

  Below is my recommendation for a ruling on this specific case, followed by an analysis of why standard policy redrafting will not fully resolve this issue, and a proposal for a fairer procedural standard.

  **1. Ruling on Case #2023-14**

  **Recommendation:** I recommend the Committee find **no violation** of the Academic Integrity Policy in this specific instance, though we should issue a formal advisory note to the student regarding future usage.

  **Rationale:**
  The syllabus states students may not use AI to "generate any part of the submitted work." The committee is divided between interpreting "generate" as *any AI involvement* versus *composition from scratch.*

  In this case, there is no historical fact—neither in the text of the policy nor in the intent of the drafting committee from last year—that definitively settles whether "editing three sentences" counts as "generating." This is not merely a fuzzy boundary (e.g., how many words constitute a quote); it is a semantic gap created by technology that has outpaced the language of the policy.

  Given this indeterminacy, we must apply the principle of *lenity*: when a rule is genuinely ambiguous and the stakes involve student sanction, the benefit of the doubt must go to the student. Furthermore, the student's voluntary disclosure demonstrates good faith and an intent to be transparent, which stands in stark contrast to the concealment typical of integrity violations. To sanction her now would be to enforce a rule that, until this moment, did not clearly exist in this specific application.

  **2. The Limits of Redrafting (and What to Do Instead)**

  During our last discussion, I suggested that simply redrafting the policy for the spring term might not solve the underlying problem. I want to clarify that point here, as it is crucial for our long-term strategy.

  We often assume that if a rule causes confusion, we simply need to write a more precise rule. However, language is inherently "open-textured." No matter how precisely we define "generate," "author," or "assist," new tools will emerge that fall outside those definitions. We cannot legislate for every technological contingency in advance. If we try to write a policy that lists every prohibited tool, we will always be one software update behind.

  **Recommendation for Future Policy:**
  Instead of attempting to close every loophole through prohibitive lists, we should shift our policy framework toward **transparency and authorization.**

  *   **Move from Prohibition to Disclosure:** The policy should require students to disclose *any* use of digital tools beyond standard spell-check, regardless of whether the tool is technically "AI."
  *   **Instructor Discretion:** The syllabus should require instructors to specify *authorized* uses of AI for their specific assignments (e.g., "AI may be used for brainstorming but not drafting," or "No AI tools permitted").
  *   **The "Reasonable Person" Standard:** We should adopt a standard that asks: *Would a reasonable student understand this specific use to be a substitution of their own intellectual labor?*

  This shifts the burden from trying to predict the future of technology to fostering a culture of transparency.

  **3. Addressing the Fairness Concern**

  Finally, we must address the worry that finding "no violation" undermines the integrity of the college. I argue the opposite: sanctioning the student in this case would undermine our integrity.

  It is fundamentally unjust to punish a member of the community for crossing a line that cannot be shown to have existed prior to the act. If half of this committee—a group of faculty experts—cannot agree on what the rule means, we cannot reasonably expect a student to have known the answer with certainty.

  By dismissing this charge, we are not saying AI usage is irrelevant. We are acknowledging that *this* specific rule, applied to *this* specific action, lacks the clarity required for punitive action. We preserve the legitimacy of the Committee by admitting when a case reveals a gap in our regulations, rather than stretching a rule to fit a situation it was not designed to cover.

  **Conclusion**

  For Case #2023-14, I urge us to prioritize procedural fairness over a strict interpretation of an ambiguous term. Let us dismiss the charge with an advisory warning. Moving forward, let us work with the Faculty Senate to update the policy to focus on disclosure and authorized use, acknowledging that we cannot ban our way out of semantic ambiguity.

  I look forward to discussing this further on Wednesday.

  Best regards,

  [Your Name]
  Academic Integrity Committee
