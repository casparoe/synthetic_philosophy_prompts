answer: |-
  This is a fantastic observation. You have put your finger on exactly why many physicists find certain corners of decision theory frustratingly abstract, and why many philosophers find physics' handling of infinities casually pragmatic.

  You are mathematically correct: the underlying pathology in both the Madelung constant and the Pasadena game is the Riemann Rearrangement Theorem applied to a conditionally convergent series. In both cases, $\sum a_n$ converges, but $\sum |a_n|$ diverges.

  However, the reason the physics community "moved on" while decision theorists are still agonizing over Pasadena lies not in the mathematics, but in the **ontology of the limit**.

  Here is the breakdown of why your "physicist's move" works in solid-state physics but hits a wall in decision theory, and whether that wall is real or an illusion.

  ### 1. The Madelung Constant: Physics Dictates the Order
  In the lattice sum problem, the ambiguity arises because "infinite crystal" is an idealization. A real crystal is finite. When we take the thermodynamic limit ($N \to \infty$), the value of the potential depends on the *shape* of the sequence of finite crystals we use to approach infinity.
  *   **Spherical summation:** Corresponds to a crystal growing as a sphere.
  *   **Cubic summation:** Corresponds to a crystal growing as a cube.

  **The Resolution:** The ambiguity is not a mathematical bug; it is a physical feature. Different shapes have different surface charge distributions, which create different macroscopic electric fields.
  When we use Ewald summation, we are not arbitrarily picking an order to make the math nice. We are implicitly imposing a **boundary condition** (usually a conducting boundary at infinity, or "tin-foil" boundary conditions). If you are studying a ferroelectric, you actually *must* care about the shape dependence, because the depolarization field depends on it.

  **Why we move on:** In physics, the **system** provides the ordering parameter (physical distance from a reference ion, constrained by the physical surface of the sample). The math models the world; the world tells the math how to behave.

  ### 2. The Pasadena Game: The Missing Boundary
  The Pasadena game (Nover & Hájek, 2004) sets up a gamble where payoff $x_n$ occurs with probability $p_n$, such that $\sum p_n x_n$ is conditionally convergent.
  *   **The Paradox:** Expected Utility Theory (EUT) says the value of a gamble is its expected value. If the sum can be rearranged to equal any number, the expected value is undefined. Therefore, EUT cannot tell a rational agent whether to play the game or take a sure $0.

  **Why the Physicist's Move Fails Here:**
  If you try to pull the Madelung maneuver ("pick a well-motivated summation order"), the decision theorist asks: **"Motivated by what?"**

  In physics, the motivation is geometry and causality. In the standard formulation of the Pasadena game, the outcomes are usually presented as an unordered set of probability-payoff pairs. There is no "distance" metric. There is no "surface." There is no causal sequence.
  *   If you sum by decreasing probability, you get one value.
  *   If you sum by increasing utility, you get another.
  *   If you sum by time (if the game is played over steps), you get a third.

  In physics, the boundary condition is an empirical fact about the crystal. In decision theory, imposing a summation order looks like **begging the question**. You are trying to derive what a rational agent *ought* to do (normative), but to do so, you have to import a structural constraint (the ordering) that wasn't in the problem description.

  ### 3. Is Pasadena a "Deep" Problem?
  Yes, but perhaps not for the reason usually stated. It is not deep because of the conditional convergence itself (as you noted, that's just analysis). It is deep because it exposes a gap between **description** and **prescription**.

  **The Physics Case (Descriptive):**
  We ask: "What is the energy of this lattice?"
  Answer: "It depends on the shape."
  Follow-up: "Okay, what shape is the actual sample?"
  Result: Unique answer. No paradox.

  **The Decision Theory Case (Normative):**
  We ask: "What *should* a rational agent value this game at?"
  Answer: "It depends on the summation order."
  Follow-up: "What order should they use?"
  Result: **Silence.** EUT claims to be a universal theory of rational choice based *only* on probabilities and utilities. If it requires extra structural information (like a causal or temporal ordering) to yield a result, then EUT is incomplete, not just computationally fiddly.

  ### 4. Did Physicists Smuggle Illegitimacy?
  You asked: *"Does our physicists' move secretly smuggle in something just as illegitimate as whatever's going on in Pasadena?"*

  **No, but it smuggles Context.**
  Physicists smuggle in **boundary conditions**. We assume the universe provides them. In the Madelung case, the "illegitimacy" would be claiming the Madelung constant is a universal property of NaCl independent of the sample shape. We know better. We know $\alpha_{Madelung}$ is a property of the *lattice structure*, but the *potential* is a property of the *lattice + boundary*.

  Decision theorists, however, often want Expected Utility to be a property of the *gamble alone*, independent of context. The Pasadena paradox proves that for conditionally convergent gambles, **context is unavoidable.**

  If you treat the Pasadena game as a **supertask** (completed in finite time via Zeno-like steps), the temporal ordering is fixed by physics, and the paradox dissolves (you sum in time order).
  If you treat it as an **atemporal** abstract object, the value is genuinely undefined.

  ### 5. How a Physicist Might Defuse Pasadena
  If I were to apply the solid-state mindset to Pasadena, I would argue the problem is ill-posed, much like asking for the potential of an infinite lattice without specifying the boundary.

  1.  **Finite Truncation:** No real agent faces a game with infinite outcomes. Any real implementation is a truncated game with $N$ outcomes. As $N \to \infty$, does the value converge? No, not absolutely.
  2.  **The "Shape" of the Gamble:** Just as a crystal has a shape, a gamble has a **causal structure**.
      *   If the payoffs are distributed by a physical process (e.g., waiting for a radioactive decay), the "order" is time.
      *   If the payoffs are indexed by the magnitude of the probability (most likely events first), that implies a specific cognitive or computational limitation on the agent.
  3.  **Ewald for Decision Theory:** There have been attempts to do exactly what you suggest. Some propose **Weak Expected Utility** or restricting EUT to absolutely convergent series. Others (like Kenny Easwaran) argue for a "Principal Value" approach (summing symmetrically), analogous to your spherical summation.

  ### Conclusion
  The Pasadena paradox is not a mathematical mystery; it is a **modeling critique**.

  *   **In Physics:** We accept that the infinite model requires boundary conditions to be physically meaningful. The "paradox" is resolved by pointing to the lab bench.
  *   **In Decision Theory:** The paradox persists because theorists want a theory of rationality that works *without* pointing to the lab bench. They want the probabilities and utilities to suffice.

  Pasadena shows that for conditionally convergent scenarios, probabilities and utilities **do not suffice**. You need a third ingredient: an ordering principle (time, causality, or cognitive salience).

  So, you are right to be suspicious of the philosophical panic. It *is* a Madelung situation. The difference is that physicists are comfortable admitting, "You didn't tell me the shape of the crystal, so I can't give you a number," whereas decision theorists are uncomfortable admitting, "You didn't tell me the causal structure of the gamble, so I can't tell you what's rational."

  The "illegitimacy" isn't in the summation trick; it's in the hope that rationality can be defined context-independently in the face of conditional convergence.
