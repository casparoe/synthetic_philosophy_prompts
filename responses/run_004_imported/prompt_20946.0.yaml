  9.  (Final Review of the "Language Relativity" point): The user mentioned MDL invariance results helping against language relativity. I need to be careful here. Kolmogorov complexity is machine-independent up to a constant. But if the universe is finite, constants matter. Lewis's answer to language relativity wasn't MDL, it was "perfectly natural properties." I should point out that MDL *needs* Lewis's natural properties to fully work, otherwise, you can just pick a language where "grue" is simple. This is a crucial disanalogy/caveat.

