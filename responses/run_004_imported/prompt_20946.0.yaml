      *   *Severity:* Explanation is the deeper metaphysical divide. Undermining is a technical bug.
      *   *Standard Replies:*
          *   Explanation: Loewer's "Metaphysics + Science" split. Laws explain in the scientific sense, not metaphysical grounding.
