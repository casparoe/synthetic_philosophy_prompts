      *   *Section 1: The MDL/BSA Analogy.* Confirm it's sound. Explain the mapping (Simplicity = Model Length, Strength = Data Length given Model). Mention the "Language Relativity" objection and how MDL helps (Kolmogorov complexity invariance).
      *   *Section 2: The Explanation Objection.* Discuss the distinction between *governing* and *systematizing*. MDL reinforces the Humean view (explanation is compression) but admits the Anti-Humean point (no ontic push). It clarifies the stalemate.
      *   *Section 3: The Undermining Future.* Validate the prequential analogy. Explain the tension between global optimization and local credence. Mention Lewis's "New Principal Principle."
