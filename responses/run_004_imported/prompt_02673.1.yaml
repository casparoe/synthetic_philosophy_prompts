          *   **Cardinality/Interpersonal Comparison:** Harsanyi assumes fixed individual utility functions. How those are scaled/normalized matters immensely. Prioritarians argue about the *shape* of the transformation applied to well-being before aggregation.
          *   **Veil of Ignorance vs. Actual Preferences:** Harsanyi's utilitarianism relies on a specific interpretation of the "veil of ignorance." Rawls explicitly rejects the vNM framework for the original position (he argues the parties wouldn't maximize expected utility due to the stakes involved).
