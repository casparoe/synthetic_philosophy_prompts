      *   **Task:** Formulate the strongest, most careful version of a specific objection to Yablo's proportionality account. The objection is that proportionality is symmetric and effect-relative, allowing one to "gerrymander" the effect description to favor the physical over the mental, thus failing to solve exclusion generally.
      *   **Constraint:** Do not re-teach basics (Kim, Yablo, determinables). Focus on the argument itself.
      *   **Bonus:** Briefly mention Karen Bennett and List & Menzies regarding this specific problem.
      *   **Tone:** Academic, rigorous, peer-to-peer (sounding board), but structured as a formal argument.

  2.  **Deconstruct the Objection (The "Grain Problem"):**
      *   *Core Intuition:* Proportionality depends on the counterfactual dependence between cause and effect. If you change the description of the effect ($E$), you change which cause ($C_{mental}$ or $C_{physical}$) satisfies the proportionality constraint.
      *   *Yablo's Claim:* Mental ($M$) is proportional to ordinary effects ($E_{ordinary}$). Physical ($P$) is too specific (determinate).
      *   *The Counter:* If $E$ is specified finely ($E_{fine}$), $P$ becomes proportional, and $M$ becomes too general (determinable).
      *   *The Threat:* If the "winner" depends entirely on how we describe $E$, then proportionality doesn't establish the *ontological* causal efficacy of the mental; it just establishes a pragmatic match between description levels. Kim's worry was about *competition for causal work*, not just descriptive fit.

  3.  **Drafting the Argument (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Yablo says M causes E because M is proportional. But P causes E_fine because P is proportional to E_fine. Since we can always describe E finely (neuroscience style), P always wins there. Since we can describe E coarsely (folk psych style), M wins there. So proportionality doesn't prove M is *really* causal, just that it fits folk descriptions. This makes mental causation interest-relative, not mind-independent.

      *   *Attempt 2 (Adding Rigor):* Need to use Yablo's terminology (required, enough, screening off).
