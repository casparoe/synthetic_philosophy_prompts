      *   But does he have a *metaphysical* fix? Not really. He leans into the pragmatic nature of causal selection.
      *   Is there a principled block? Some argue that effects *just are* coarse-grained events (Davidson), but Yablo is more fine-grained (property exemplification). If effects are property exemplifications, the property choice matters.
      *   Key point: If Yablo admits causation is interest-relative, does that solve *Kim's* problem? Kim wants to know if the mental *does the work*. If "doing the work" is interest-relative, Kim might say "Sure, it does the work for *you*, but physics says otherwise."

