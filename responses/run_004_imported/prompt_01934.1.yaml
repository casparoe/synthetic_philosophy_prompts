      *   Is it the strongest version of the argument? Yes, focusing on the lack of a principled metric for effect individuation.
      *   Did I answer the "does it go through" question? Yes, with nuance (it forces a retreat to pragmatism).
      *   Bonus included? Yes.

  8.  *(Self-Correction during drafting)*: I need to be careful not to conflate Yablo's 1992 view with later developments (like List & Menzies who formalized it more). The prompt specifies Yablo '92. In '92, Yablo is a bit more metaphysical about the determinable relation. I should focus on the 1992 text's resources. Yablo does suggest that causes and effects must be "commensurate." The objection is that commensurability is the loose screw.

      *Refining the Argument:* The core issue is that Kim's exclusion argument assumes a fixed domain of causal competition (the physical closure of the world). Yablo tries to change the rules of competition. The objection says Yablo's rules allow the physical to win if we just tweak the target. Therefore, Yablo hasn't shown the mental is *uniquely* or *robustly* causal, only that it can be *described* as causal under specific constraints.

      *Let's build the "Strongest Version":*
      1. Proportionality is a relation between $C$, $E$, and a contrast class.
      2. For any $M \to E_{coarse}$, there is a $P \to E_{fine}$.
      3. Physical closure applies at the fine grain.
      4. If mental causation is only valid at the coarse grain, it is explanatorily useful but ontologically secondary.
      5. Yablo offers no metaphysical ground to prefer $E_{coarse}$ as the "real" effect.

      *Okay, ready to write.*
answer: |-
  This is a sharp objection, and you're right to press it. It cuts to the heart of whether proportionality is a metaphysical solution to exclusion or merely a pragmatic account of causal *explanation*. In the literature, this is often called the **"Effect-Individuation Objection"** or the **"Grain Problem."**

  Since you know the lay of the land, I'll skip the exegesis and construct the argument in its strongest, most charitable form against Yablo's 1992 framework, followed by an assessment of whether Yablo has the resources to block it.

  ### The Argument: Effect-Relativity and the Loss of Ontological Grip

  The core of Kim's exclusion argument is that if the physical does all the work, there is no work left for the mental to do. Yablo's response is that "doing the work" is not a zero-sum game between determinables and determinates because they are not competitors; the determinate (physical) is *too specific* to be the proportional cause of the ordinary effect.

  The objection you raised exploits the fact that proportionality is a triadic relation: $C$ is proportional to $E$ *relative to a contrast space*. If we can shift the contrast space of the effect, we shift the proportional cause.

  Here is the formalized version of the objection:

  1.  **Proportionality is Effect-Relative:** Whether a cause $C$ satisfies the proportionality constraint (required and enough) depends entirely on the individuation of the effect $E$. (Yablo admits this via the commensurability requirement).
  2.  **The Physical Realizer is Always Proportional to *Some* Effect:** For any mental property $M$ and its physical realizer $P$, there exists a sufficiently fine-grained effect description $E_{fine}$ (e.g., specific neural firing patterns, precise muscle fiber contractions) such that:
      *   $P$ is *required* for $E_{fine}$ (a coarser physical property might not guarantee the exact micro-pattern).
      *   $P$ is *enough* for $E_{fine}$ (no finer physical detail changes the outcome).
      *   $M$ is *not required* for $E_{fine}$ (since $M$ is multiply realizable, the specific $E_{fine}$ could theoretically occur via a different realizer in a nearby world, or $M$'s presence doesn't fix the micro-details).
  3.  **The Mental is Only Proportional to Coarse Effects:** $M$ satisfies proportionality only relative to effects $E_{coarse}$ (e.g., "hand withdrawal," "pecking") that abstract away from physical micro-details.
  4.  **No Principled Metric for Effect Individuation:** Yablo's 1992 account provides no metaphysical principle to privilege $E_{coarse}$ over $E_{fine}$ as the "true" or "ontologically privileged" effect. The choice of effect grain appears pragmatic or interest-relative.
  5.  **Conclusion:** Therefore, proportionality does not establish the *ontological* causal efficacy of the mental over the physical. It merely establishes that the mental is the appropriate causal *explanation* relative to coarse-grained interests. If physical closure holds at the fine grain (where $P$ is proportional), the exclusion problem re-emerges: the physical does the "real" work, and the mental is merely a useful summary.

  ### Does the Objection Go Through?

  **Verdict:** Yes, as a refutation of proportionality as a *metaphysical* solution to exclusion. No, if Yablo is allowed to retreat to a *pragmatic* theory of causal selection.

  **The Yabloian Defense (and its Cost):**
  A committed Yabloian has to bite the bullet on Premise 4. Yablo's move in '92 is implicitly to argue that causation *just is* a relation that requires commensurability. He suggests that asking "Did $P$ cause $E_{coarse}$?" is a category mistake, akin to asking "Is the number 7 hungry?"

  If you press him on *why* we care about $E_{coarse}$, his best response is that causal relations are inherently contrastive and interest-relative. There is no "God's eye view" of causation where $E_{fine}$ is the only real effect. Causation is a tool for navigating the world, and for agents like us, $E_{coarse}$ is the relevant level of interaction.

  **The Problem:** This concedes Kim's main point. Kim's exclusion argument is driven by the worry that if physical closure is true, the mental is *ontologically idle*. If Yablo responds, "The mental is causal relative to our interests, but the physical is causal relative to the micro-structure," he has saved mental causation as a legitimate *explanatory practice*, but he has not saved it as a robust *ontological category* that competes with physics. He has turned non-reductive physicalism into a form of **causal pluralism** or **expressivism**.

  If the goal of the seminar is to save the idea that mental properties *really* make things happen in the world independent of our descriptive interests, this objection defeats Yablo. If the goal is to show that mental causal claims are legitimate and not false, Yablo survives, but at the cost of making causation mind-dependent.

  **Is there a principled fix?**
  Some have tried to argue that effects *are* inherently coarse-grained (a Davidsonian move), but Yablo's property-exemplification ontology resists this. Others argue that $E_{fine}$ is not a *single* effect but a disjunction of effects, but this begs the question against the physicalist. There is no consensus principled metric in the 1992 paper that blocks the gerrymandering of $E$ without stipulating the conclusion.

  ### Bonus: Bennett and List & Menzies

  **Karen Bennett (2003, "Why the Exclusion Problem Seems Intractable..."):**
  Bennett's solution relies on counterfactuals without explicitly invoking proportionality. She argues that $M$ and $P$ do not compete because the counterfactual $\neg M \square \to \neg E$ can be true even if $\neg P \square \to \neg E$ is true, provided we hold the realization relation fixed in the evaluation.
  *   **Vulnerability:** She faces a version of your objection. If $E$ is specified finely enough, $\neg M \square \to \neg E$ becomes false (because a different realizer $P^*$ could have produced $E_{fine}$ differently, or $M$ doesn't fix the micro-details). Bennett relies on the intuition that we are testing $E$ at the "right" level. If the physicalist insists the "right" level is the micro-level, her counterfactuals favor $P$. She dodges the *screening off* worry, but not the *grain* worry.

  **List and Menzies (2009, "Non-Reductive Physicalism and the Limits of the Exclusion Principle"):**
  They explicitly adopt the proportionality constraint (difference-making) and are fully aware of your objection.
  *   **Response:** They embrace it. They argue that causation is **level-specific**. $M$ causes $E$ at the higher level; $P$ causes $E^*$ at the lower level. There is no single effect $E$ that both compete for.
  *   **Vulnerability:** This is the most honest defense, but it validates your worry that exclusion isn't "solved" so much as **dissolved** by relativizing causation to levels. It blocks the gerrymandering by saying "You can't gerrymander the effect to the physical level and ask if the *mental* caused it," because at the physical level, the cause *must* be physical. This saves mental causation but accepts that it doesn't operate at the fundamental physical level.

  ### Summary for your Seminar
  Your lunch argument is solid. It demonstrates that Yablo's proportionality constraint cannot simultaneously satisfy two conditions:
  1.  Secure the ontological efficacy of the mental against the physical.
  2.  Remain neutral regarding the individuation of effects.

  If proportionality determines efficacy, and efficacy depends on effect grain, then efficacy is grain-relative. If efficacy is grain-relative, the physical wins at the fine grain. Yablo can only save the mental by arguing that the fine grain is not the only (or primary) locus of causal reality, which is a pragmatic, not a metaphysical, victory.
