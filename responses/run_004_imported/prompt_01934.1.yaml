      *   *Attempt 3 (Refining for the "Strongest Version"):* The user wants this aimed at someone who knows the paper. I need to hit the "commensurability" issue. Yablo talks about causes and effects needing to be commensurate. The objection is that the *choice* of commensurability class is where the battle is fought, not in the proportionality constraint itself. I should call this the "Effect-Individuation Objection" or "The Grain Problem."

  4.  **Addressing the "Principled Way Out" (Yablo's Defense):**
