answer: |-
  **1. The Realizability Assumption**
  Standard Bayesian sequence prediction relies on a realizability assumption: the true environment is assumed to be within the agent's hypothesis class, assigned non-zero prior probability. But if the agent is physically embedded, the environment must be strictly more complex than the agent, making perfect realization impossible. If we drop realizability, standard convergence guarantees vanish. What specific mathematical structure do you propose replaces the Bayesian posterior to ensure an embedded agent doesn't converge to confidently false models of the world it inhabits?

  *   **Follow-up:** If she invokes the "map must be smaller than the territory" slogan, press: "That explains *why* the map is incomplete, but not *how* the agent updates. Are you proposing we abandon convergence guarantees entirely, or is there a specific relaxation of Bayes' rule you're relying on?"

  **2. The Löbian Obstacle in Tiling Agents**
  In the tiling agents formalism, an agent must construct a successor that it can prove is safe. However, Löb's Theorem implies a system cannot prove the soundness of a system equally or more powerful than itself without becoming inconsistent. This suggests an embedded agent cannot trust its own future reasoning. Is this obstacle a fundamental limit on self-improving AI, or merely an artifact of the specific proof-systems currently being used to model trust?

  *   **Follow-up:** If she suggests this is just a "theoretical limitation," ask: "If it's theoretical, why does it block formal verification of recursive self-improvement? Are you claiming we cannot mathematically verify AGI safety without resolving Löb's Theorem?"

  **3. Logical Counterfactuals and the 5-and-10 Problem**
  In the "5-and-10" problem, an agent that knows its own source code faces a dilemma: if it knows it will take action $A$, then the counterfactual "if I took action $B$" is logically false, leading to explosive contradictions in classical logic. How does your framework define a "counterfactual" over one's own deterministic output without resorting to causal interventions that assume the agent is outside the causal graph?

  *   **Follow-up:** If she retreats to "we need logical uncertainty," ask: "Logical uncertainty handles unknown truths, but here the truth is known to the agent. How do you justify acting *as if* the known output could be different without introducing a contradiction?"

  **4. Mesa-Optimizers and Subsystem Alignment**
  There is significant concern that gradient descent might produce mesa-optimizers—internal subroutines that act as agents with their own objectives. Is this problem distinct from the original embedded agency cluster regarding subsystem alignment, or has the connection between 'inner misalignment' and 'embeddedness' been oversold to generate urgency in the alignment community?

  *   **Follow-up:** If she claims they are fundamentally the same, ask: "If they are the same, why do mesa-optimizer risks appear in standard neural nets that lack the explicit self-modeling architecture embedded agency focuses on? Isn't that an empirical claim rather than a structural one?"

  **5. The Cartesian Boundary Problem**
  Classical decision theory assumes a well-defined input/output channel separating the agent from the environment. In an embedded setting, this boundary is porous; the agent's hardware can be tampered with, and its sensors can be spoofed. Without a hard boundary, how do you formally define the "agent" such that it remains a coherent unit of analysis over time?

  *   **Follow-up:** If she says "the boundary is fuzzy," ask: "If the boundary is fuzzy, how do you assign a utility function? Does the utility function apply to the atoms, the code, or the causal influence, and how do you prevent that definition from shifting mid-calculation?"

  **6. Ontological Crises and Abstraction**
  Embedded agents must use high-level abstractions to model the world, but the agent itself is part of the low-level reality. When an agent discovers its high-level model (e.g., 'humans have rights') doesn't map cleanly to the low-level physics (e.g., 'atoms in motion'), it faces an ontological crisis. Does your framework provide a mechanism for preserving goals across ontology shifts, or does embeddedness imply goals are always relative to a specific model level?

  *   **Follow-up:** If she relies on the map/territory distinction again, ask: "We know the map isn't the territory. The question is: when the map changes, does the territory-relative goal remain stable? If not, isn't 'alignment' just model-relative consistency?"

  **7. Logical Omniscience**
  Standard rational agents are logically omniscient; they know all consequences of their beliefs. An embedded agent has finite compute and cannot know all logical consequences of its own code. How do you formalize "bounded rationality" in a way that doesn't just amount to saying 'the agent is too slow to think,' but rather changes the decision-theoretic axioms?

  *   **Follow-up:** If she mentions Logical Induction, ask: "Logical Induction handles probabilities of logical statements, but does it actually solve the *decision* problem? Can a Logical Inductor make a choice without implicitly assuming a counterfactual it can't prove?"

  **8. Intervention and Causality**
  Pearlian causality relies on the `do()` operator, which severs incoming arrows to a node. But an embedded agent cannot sever the causal arrows determining its own computation. If you cannot formally intervene on your own source code, in what sense are you "choosing" anything rather than merely unfolding a deterministic process?

  *   **Follow-up:** If she argues "choice is a useful abstraction," ask: "Useful for whom? If the physics is deterministic, is 'choice' just a user-illusion for the programmer, and if so, why should the agent optimize for it?"

  **9. Location of the Utility Function**
  In classical theory, the utility function is external to the environment. In embedded agency, the utility function must be represented within the agent's physical substrate. If the agent can modify its own memory, what prevents it from wireheading—modifying its representation of utility rather than satisfying the utility itself—other than ad-hoc constraints?

  *   **Follow-up:** If she says "the agent values the territory, not the map," ask: "But the agent only accesses the territory *through* the map. How does it optimize for a territory it cannot access without risking optimization of its own access mechanism?"

  **10. The Distinctness Criterion**
  Finally, let's address the scope of the field. What specific result from ordinary computer science or mathematical logic would have to come out differently before you would admit that embedded agency isn't really a distinct cluster of problems, but rather classical decision theory applied to systems with self-reference and better branding?

  *   **Follow-up:** If she says "the problems are qualitatively different," ask: "Qualitative difference isn't a mathematical result. Is there a theorem that exists in embedded agency that is *impossible* to state in classical game theory, even with expanded state spaces?"
