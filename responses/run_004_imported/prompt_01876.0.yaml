prompt: |-
  Ok, this has been bugging me for weeks. I'm writing a novel set in small-town Georgia in the 60s, and one of my pov characters is a genuinely racist old man who says the actual slur to another character live on the page, not implied, not censored. My writing group said the scene made THEM uncomfortable with me, the author, even though two pages later another character tears into him for it and the book clearly isnt on his side. If it's obviously his ugly voice and not mine, why does the word still rub off on me? I tried a version where someone just mentions afterward that he'd called her that word, instead of showing it live, and my group felt a lot better about that one, even though the actual word still shows up on the page either way, just in narration instead of dialogue. Not looking for the sensitivity-reader speech - I want to know whats actually going on with how these words work that makes this so different from, say, writing a graphic murder scene in the same book. What do you think is happening here?
