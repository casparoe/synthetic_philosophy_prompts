answer: |-
  This is a sophisticated question about narrative mechanics, linguistics, and reader psychology. You aren't asking *if* you should do it; you are asking *why* the mechanism triggers a specific visceral reaction that differs from other forms of graphic content.

  The discomfort your writing group feels, and the way the word seems to "rub off" on you, stems from the difference between **depiction** and **enactment**, and the unique linguistic properties of hate speech compared to physical violence.

  Here is a breakdown of what is likely happening in your readers' brains.

  ### 1. Speech Act Theory: Doing vs. Describing
  In linguistics, there is a concept called "Speech Act Theory." Most sentences are *constative* (they describe reality, e.g., "The sky is blue"). However, some sentences are *performative* (they enact reality, e.g., "I promise," "I bet," or "Get out").

  Graphic violence in a novel is almost always *constative*. You are describing a wound, a blow, a death. The reader is witnessing a report of physical damage.

  A racial slur, particularly one with the historical weight of the N-word, is *performative*. It is not just a description of racism; it is an act of subordination. When a character says it, they are not describing an attack; they are launching one.
  *   **In Dialogue:** The author is scripting a re-enactment of that attack. The reader is forced to "hear" the attack happen in real-time.
  *   **In Narration/Report:** The word becomes evidence. It is a exhibit in a trial, not the crime itself.

  When your group read the dialogue version, they didn't feel they were reading *about* racism; they felt they were witnessing an assault. When you write a murder, you are showing a body. When you write a slur in dialogue, you are firing the gun.

  ### 2. The Ventriloquism Effect
  This addresses why it rubs off on *you*, the author.

  To write dialogue, you must engage in a form of psychological ventriloquism. You have to inhabit the character's voice to make it sound authentic. When a reader reads dialogue, they subvocalize. They hear the words in their head. Because those words originate from your manuscript, there is a subconscious chain of custody: **Author -> Character -> Reader.**

  Even if the context condemns the character, the *sound* of the word comes from you. You are the puppeteer making the puppet say the slur.

  In the version where another character mentions it afterward, the chain of custody changes. The word is framed through the lens of the victim or the witness. The *agency* of the utterance shifts. The racist character is no longer given the microphone to wield the weapon; the weapon is being discussed as a dangerous object. The author is no longer ventriloquizing the attacker; the author is recording the testimony of the survivor. That feels safer because the power dynamic has shifted.

  ### 3. Temporal Distance and Processing
  You mentioned that two pages later, another character tears into him. Logically, this should neutralize the harm. Emotionally, it does not.

  Human nervous systems process threats in real-time. When the slur is spoken in dialogue, the reader's amygdala registers a threat/insult immediately. The "two pages later" condemnation is cognitive; the sting of the slur is visceral. There is a lag time. For those two pages, the reader is sitting in the discomfort of the slur without resolution.

  In the version where it is mentioned afterward, the event is in the past tense. The trauma has already occurred, and the characters are now processing it. The reader enters the scene at the "processing" stage, not the "assault" stage. This gives the reader emotional armor before they encounter the concept of the word.

  ### 4. Identity vs. Physicality
  You asked why this is different from a graphic murder scene.

  Violence in fiction is generally understood as a plot mechanic. It happens to bodies. While tragic, it is universal. Readers have a "fiction contract" that allows for physical conflict.

  Hate speech targets *identity*. It relies on real-world historical trauma that exists outside the book. A fictional murder doesn't have a legacy of 400 years of systemic oppression behind it. A racial slur does.
  *   **Murder:** Breaks the social contract of safety within the story.
  *   **Slur:** Breaks the social contract of safety *between the author and the reader*.

  When you write a murder, you aren't risking the reader feeling that *you* hate them. When you write a slur, even in the mouth of a villain, you are introducing a symbol that has been used to dehumanize people in the *real world*. It pierces the "fourth wall" of social decency more easily than blood does. It makes the reader question the author's judgment on a moral level, not just an artistic one.

  ### 5. The "Uncanny Valley" of Morality
  There is a phenomenon in characterization where if a villain is *too* realistic, the reader loses trust in the narrator.

  If the old man is a POV character, we are already inside the head of a racist. That is a difficult tightrope. When he *thinks* the slur (narration), it feels like internal landscape. When he *speaks* the slur (dialogue), it becomes social interaction.

  Your writing group's reaction suggests that by putting the word in dialogue, you moved the racism from "character trait" to "social environment."
  *   **Narration Version:** The racism is contained within the character.
  *   **Dialogue Version:** The racism is released into the room where the reader is sitting.

  The group felt uncomfortable *with you* because, by scripting the dialogue, you created a space where that word was allowed to exist audibly. By moving it to narration/report, you created a space where the word is acknowledged but not *performed*.

  ### Summary
  The difference isn't logical; it's somatic.
  1.  **Dialogue is performance;** narration is reportage.
  2.  **Slurs are speech acts (weapons),** not just descriptions.
  3.  **Ventriloquism** makes the author the source of the sound.
  4.  **Real-world trauma** associated with the word bypasses the "fiction contract" that allows for graphic violence.

  Your group preferred the second version because it kept the weapon in the evidence bag rather than firing it in the courtroom, even if the bullet was the same. They want to know the gun was fired; they don't want to hear the bang.

  **A Note on POV:**
  Since this is a POV character, be aware that if he thinks the word in narration, it is still his voice. If your group was okay with the word appearing in narration but not dialogue, it suggests they are comfortable with the *presence* of the ideology, but not the *performance* of the aggression. That is a nuanced but distinct boundary. It implies they trust you to analyze the racism, but they do not trust you to stage it.

  *   **Staging it (Dialogue):** Requires the reader to witness the act.
  *   **Analyzing it (Narration/Report):** Requires the reader to understand the act.

  Most readers are willing to understand ugliness; fewer are willing to witness it live without feeling complicit.
