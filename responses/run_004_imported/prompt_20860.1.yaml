answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], and I have the distinct privilege of standing here as Theo's best man.

  Usually, this is the part of the speech where I tell a story about how wild Theo was in college, or how he once tried to cook a turkey in a dishwasher. And while I know his college roommates are sitting in the third row—and I see you, and I know you have evidence to the contrary—I actually want to talk about something quieter. Something that, on the surface, sounds incredibly un-wedding-like.

  I want to talk about a notebook.

  For the last five years, Theo has carried a specific notebook. It's ruled out in a grid. Across the top are thirteen virtues: Temperance, Silence, Order, Resolution, Frugality, Industry, Sincerity, Justice, Moderation, Cleanliness, Tranquility, Chastity, and Humility. Down the side are the days of the week.

  It's a system borrowed from Benjamin Franklin. Every night, Theo reviews his day. If he lost his temper, or was late, or spoke when he should have listened, he puts a little black mark in the box for that virtue. The goal, theoretically, is to end the week with a clean page.

  Now, my friend Priya and I actually got into a pretty heated debate about this notebook just the other night. Priya argued that building your personality around a spreadsheet of moral corrections is a bit… rigid. Maybe even sad. She worried it meant Theo was constantly at war with himself. I argued the opposite: that in a world where we're encouraged to curate our lives for social media, there is something profoundly admirable about a private, analog accounting of your own flaws.

  We didn't settle it then. But standing here today, looking at Theo and [Partner's Name], I realize we were both right. And more importantly, I think Benjamin Franklin would have agreed with both of us.

  Because Franklin never finished his project. He wrote openly about how the virtue of "Order" defeated him completely. He couldn't keep his papers in order, he couldn't keep his time in order. And near the end of his life, he wrote a passage about a man who wanted to buy an axe. The smith agreed to grind it bright, but only if the man would turn the wheel. The man turned and turned, but the axe was still speckled. He finally decided he liked the speckled axe better than the grinding.

  Franklin asked if a "speckled character" might not be the saner thing to settle for than grinding forever for a perfectly bright one.

  Theo, I know you've read that passage. And looking at you, I can tell you: you are a speckled axe.

  Your college roommates know the marks you've made. Your family knows them. I know them. You haven't achieved moral perfection. You get stressed. You leave dishes in the sink. You have a temper. If you stood up here and claimed this notebook made you a saint, I'd have to tackle you.

  But that isn't the point of the notebook, is it? The point isn't the absence of black marks. The point is the willingness to look at the page.

  In a way, that is the most romantic thing I can say about you. We live in a culture that tells us marriage is about finding your "perfect match." It implies that once you find the right person, the work is done. The axe is bright. No more grinding.

  But [Partner's Name], you aren't marrying a finished product. You're marrying a man who wakes up every morning and admits he has work to do. You're marrying a man who keeps a ledger of his own mistakes not to punish himself, but to ensure he shows up for you as well as he possibly can.

  The notebook isn't a cage, Theo. It's a compass. It acknowledges that we are all flawed, that we will all slip, but that we owe it to the people we love to track where we slip, and to try, tomorrow, to slip a little less.

  Franklin added "Humility" to his list last, after a friend told him he was often arrogant. He never mastered it. But he kept it on the list. That is the human condition. We are all grinding the wheel. We are all trying to polish the blade while life throws sparks in our eyes.

  So, I am not toasting to Theo's perfection. I am toasting to his effort. I am toasting to the black marks, because they prove he's paying attention. And I am toasting to [Partner's Name], who looks at that speckled axe and sees something bright enough to light up a room, and sturdy enough to build a life on.

  Theo, keep the notebook. But remember: the only virtue that matters in this room tonight is Love. And by all accounts, you're acing that one.

  To Theo and [Partner's Name].
