answer: |-
  **Setting:** *A cluttered faculty office, late afternoon. Rain taps against the window. Two coffee mugs sit on a stack of journals. **Elena** (defending the Etiological account) is perched on the edge of a desk. **Marcus** (defending the Causal-Role account) is in the worn leather armchair.*

  **Marcus:** So, we agree on the physics. The lightning strikes the swamp, the molecules coalesce, and out steps Swampman. Molecule-for-molecule identical to you or me. He walks, he talks, his chest heaves. But he has no past. No ancestors, no selection history. He just *is*.

  **Elena:** Right. Davidson's ghost.

  **Marcus:** Okay. Swampman sits down for a check-up. I put a stethoscope to his chest. *Lub-dub, lub-dub.* Blood is circulating. Oxygen is reaching the tissues. Now, Elena, be honest. Does Swampman's heart have the function of pumping blood?

  **Elena:** It *pumps* blood. I'll grant you that. It performs the activity. But does it have the *function* of pumping blood? No.

  **Marcus:** Come on. That sounds like semantic gerrymandering. If I'm a cardiologist treating him, and I say, "The function of this organ is to pump blood, and it's doing it well," am I lying?

  **Elena:** You're speaking loosely. You're describing its causal capacity. But on Wright's account, to ascribe a function is to make a historical claim. It is to say, "This trait exists *because* it did this thing in the past." It's an explanatory claim. Swampman's heart isn't there *because* it pumps. It's there because lightning hit some gas. The pumping is a happy accident. A coincidence.

  **Marcus:** But that's the cost I want you to justify. Why should the *origin* dictate the *current status*? If two objects are intrinsically identical down to the quantum level, how can one have a function and the other merely an effect? It implies that functions are ghostly properties attached to history rather than physical properties attached to structure. Why should the missing selective history matter to whether the organ is working *right now*?

  **Elena:** Because function is normative, Marcus. It's not just about what a thing *does*; it's about what it's *supposed* to do. That "supposed to" requires a standard. In biology, that standard is natural selection. Selection filters traits based on their contributions to fitness. That history establishes the norm. Without it, you just have physics. Swampman's heart isn't malfunctioning if it stops; it's just breaking down, like a rock rolling down a hill. There's no violation of a biological rule because there was no biological rule that put it there.

  **Marcus:** So Swampman is a zombie, biologically speaking?

  **Elena:** Not a zombie. He's alive. But his parts lack teleology. They lack proper function.

  **Marcus:** That's a bullet too hard to swallow. It severs the link between function and current utility. But let's turn the table. You cling to history to save this normativity. Fine. But now tell me how you handle the broken heart.

  **Elena:** The malfunctioning heart?

  **Marcus:** Yes. Take a human with a congenital defect. A heart that has *never* pumped blood effectively. On your view, it still has the function of pumping blood, because its ancestors' hearts were selected for pumping.

  **Elena:** Exactly. It's a malfunctioning heart. It's failing to do what it's supposed to do.

  **Marcus:** But consider my view. On the Cummins account, function is a causal contribution to a containing system's capacity. We analyze the circulatory system. We ask, "How does this system achieve circulation?" We find that the heart's pumping is a necessary sub-capacity.

  **Elena:** Here's the problem, Marcus. If function is just "what it contributes," then a leaking heart contributes to the capacity of "filling the pericardial sac with fluid." Or a sclerotic heart contributes to the capacity of "making a rhythmic thumping sound." On your view, if the trait is there and doing *something*, it has a function. How do you distinguish the *function* of the heart from the *side effects* of a broken heart? How does your view make sense of malfunction, where a trait conspicuously fails to do what we ordinarily say it's supposed to do?

  **Marcus:** It's not that simple. Function ascription is relative to an analytical analysis. I don't just ask "What does it do?" I ask "What does it do that explains the capacity of the *system*?" If the system's capacity is defined as "circulating blood," and the heart is leaking, the leaking does not explain the capacity. In fact, it detracts from it.

  **Elena:** But who defines the system's capacity? You, the analyst. That makes function observer-relative.

  **Marcus:** It makes it context-relative, yes. But it saves the intuition that Swampman's heart functions. And regarding malfunction: If a component fails to contribute to the specific capacity we are analyzing, we say it is malfunctioning *relative to that analysis*.

  **Elena:** But that's circular! You define the system's capacity as "circulating blood." Well, why is *that* the capacity? Why isn't the system's capacity "making a thumping noise"? In a normal organism, you'd say, "Because it was selected for circulation." But you've jettisoned history! So, on what grounds do you privilege "circulation" over "thumping" except by smuggling in the very evolutionary history you claim is irrelevant?

  **Marcus:** I privilege it because of the organizational structure of the organism. The valves, the veins, the pressure gradients—they are all organized *as if* to circulate blood. The structure dictates the relevant capacity analysis. I don't need the history of selection to see that the geometry of the ventricle is suited for propulsion, not acoustics.

  **Elena:** "As if." There it is. The teleology is implicit in the structure, but without the history, the "as if" is just a metaphor. You're saying the structure *looks designed*. But if you deny the design process—selection—you can't ground the norm. If Swampman's heart leaks, you can say it fails to circulate. But you can't say it's *wrong* to leak. It's just... different physics.

  **Marcus:** And if your view holds, I can treat a patient, look at a perfectly healthy organ, and if I discover it's a Swampman-organ, I have to say, "This has no function." That renders biological function useless for medicine, for engineering, for anything forward-looking. You've made function a backward-looking museum label.

  **Elena:** I've made it a biological explanation! If you want to know why the heart is there, look to history. If you want to know what it's doing, look to physics. You're conflating "activity" with "function." You want to keep the word "function" for any useful activity. I want to reserve it for the reason the activity exists.

  **Marcus:** And I think that reserves it out of existence for too many cases. What about novel traits? A bird uses a twig to fish for insects. The twig isn't selected for that. Does the twig have a function?

  **Elena:** Not a *proper* biological function. It's a tool use.

  **Marcus:** But the bird's brain state facilitating that use? That's biology.

  **Elena:** Then the brain state has a history. The twig does not.

  **Marcus:** *(Sighs, leaning forward)* We're at an impasse. You think I can't ground normativity without history. I think you can't ground current relevance with it.

  **Elena:** I think you can't distinguish a function from a mere effect without history.

  **Marcus:** And I think you can't distinguish a function from a fossil without current causal role.

  **Elena:** *(Picks up her coffee)* Well. At least we can agree the coffee machine has a function.

  **Marcus:** *(Smiles)* Ah, but was it selected by natural selection, or designed by an engineer? If designed, Wright's account applies to the designer's intent, not the machine's biology. If I pour wine in it...

  **Elena:** Don't start.

  **Marcus:** ...does it malfunction, or does it just have a new causal role?

  **Elena:** *(Stands up)* Goodnight, Marcus.

  **Marcus:** Goodnight, Elena. Watch out for lightning on the way home. We wouldn't want you duplicated.

  **Elena:** If I am, I'll be sure to tell you my heart doesn't work.

  **Marcus:** I'll keep the stethoscope ready.
