      *   **The System Identification Problem:** Lucas/Penrose assume there is *a* formal system $F$ equivalent to the mind. But maybe the mind is not a single static system. Maybe it's a sequence of systems, or non-algorithmic in a way that doesn't map to a single $F$. If we can't specify $F$, we can't construct $G_F$.
