      *   **Leibniz's Collapse:** If God *must* choose the best, and this *is* the best, could it have been otherwise? Leibniz says yes, via "Moral Necessity" (God *wills* the best but isn't logically coerced) and "Infinite Analysis" (contingent truths can't be reduced to $A=A$ in finite steps).
      *   **Compatibility:** Gödel's logic is S5. In S5, $\Diamond \Box \phi \to \Box \phi$. The collapse arises because the axioms make the existence of God *necessary* in a way that propagates to everything else. Leibniz's distinction is metaphysical, not purely logical in the modern sense.

