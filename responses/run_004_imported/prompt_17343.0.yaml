answer: |-
  Here is a draft for that section of the toast. It is written to be spoken at a measured, sincere pace. It aims to satisfy the philosophers by accurately framing the "conventionalism vs. normative force" debate without using excessive jargon, while keeping the emotional core accessible for the rest of the family.

  ***

  "As many of you know, Theo is finishing his PhD in philosophy. I'll admit, when I was asked to speak, I was nervous. Not just because this is a wedding, but because half the room is Theo's academic cohort. I know you're all listening for technical errors, so I've been preparing for this more than any speech I've ever given.

  Theo's research asks a deceptively simple question: What makes a promise bind us? He argues against the old Humean idea that a promise is just a useful social convention—like driving on the right side of the road. If it were just about social utility, then breaking a promise should only be wrong if it hurts someone or damages trust. But Theo knows, and we all know, that's not true. You can break a promise in secret, where no one finds out and no expectations are dashed, and it still feels like a moral failure. It still feels like you've broken something real.

  Theo gets annoyed when people call wedding vows 'just contracts.' He's right. A contract is about exchanging goods and managing risk. It's external. But a vow? A vow is internal.

  I told Theo once, over dinner, that I think a promise isn't a bet you place on your future behavior. It's not predicting who you'll be. It's *deciding* who you are.

  And that is why this moment matters. On the easy days, love feels like a feeling. But on the hard days—the tired days, the difficult days—feelings might fluctuate. If marriage were just a social convention, you could opt out when it stopped being convenient. But because this vow is an act of identity, it holds even when the utility fades.

  So, [Daughter's Name] and Theo: When you stand at that altar, you aren't just signing up for a social status. You are performing an act of self-creation. You are saying, 'From this moment on, I am the kind of person who belongs to you.'

  Theo, you've spent years studying why a promise binds. Today, you don't need to solve the theory. You just need to live the answer.

  To the couple."
