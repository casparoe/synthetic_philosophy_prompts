      *   *Move 3 (Nadia):* The "Common Nature" Objection.
          *   *Strength:* Hits the weak spot of Local Reductionism. If there's *nothing* in common between $P_1$ and $P_2$ except functional role, then the functional role is the real essence. Kim admits this creates a disjunctive physical kind ($P_1 \lor P_2 \lor \dots$), which isn't a lawful kind.
          *   *Weakness:* Assumes we *need* a unified kind "pain."
          *   *Verdict:* Nadia lands a heavy blow here. This is widely considered the strongest objection to Kim. If the only reason to call it "pain" is function, functionalism is prior. Point to Nadia.

      *   *Move 4 (Colin):* Bechtel & Mundale ("Multiple Realizability Revisited").
          *   *Strength:* Challenges the premise of MR. Are we comparing apples to oranges? Maybe if we looked closer (neural mechanisms), we'd find commonalities, or maybe "pain" is too vague. Scientists use function to *identify*, but the *ontology* is physical.
