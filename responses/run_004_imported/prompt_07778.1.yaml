      *   *Move 1 (Nadia):* Strong standard argument. Putnam's original point.
          *   *Strength:* Intuitively powerful. Empirical evidence supports anatomical diversity.
          *   *Weakness:* Assumes "pain" is a natural kind that must be unified.
          *   *Verdict:* Nadia wins the opening salvo on standard grounds, but it's the *target* of Kim's critique.

      *   *Move 2 (Colin):* Kim's "Local Reductionism" (from "Multiple Realizability and the Metaphysics of Reduction").
