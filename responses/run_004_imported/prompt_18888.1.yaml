answer: |-
  You have hit on one of the most common points of confusion in introductory philosophy of religion. Your intuition is perfectly logical: if there is no beginning, there is no "first cause," so both arguments should fail.

  However, your professor is correct. While both arguments conclude that there is a transcendent ground of reality, they rely on fundamentally different premises. Consequently, a past-eternal universe destroys the **Kalam** argument but leaves the **Leibnizian** argument largely intact.

  Here is the breakdown of why they are not vulnerable in the same way.

  ### 1. The Kalam Argument is Temporal (About Time)
  The Kalam Cosmological Argument (KCA) is essentially an argument about **genesis**. Its structure is usually:
  1.  Whatever **begins to exist** has a cause.
  2.  The universe **began to exist**.
  3.  Therefore, the universe has a cause.

  The KCA is obsessed with the *temporal boundary* of the universe. It argues that an actual infinite past is impossible or that current cosmology suggests a singularity.
  *   **The Vulnerability:** If you posit a past-eternal universe (or an eternal multiverse), you directly deny Premise 2. If the universe never *began*, the specific rule "whatever begins to exist has a cause" never triggers. The Kalam argument effectively collapses because it has no "first event" to latch onto.

  ### 2. The Leibnizian Argument is Ontological (About Being)
  The Argument from Contingency (Leibnizian) is not about *when* the universe started, but **why** it exists at all. Its structure is roughly:
  1.  Every **contingent** fact has an explanation (Principle of Sufficient Reason).
  2.  The existence of the universe is a **contingent** fact.
  3.  Therefore, the existence of the universe has an explanation (a Necessary Being).

  This argument distinguishes between **contingent things** (things that could have failed to exist) and **necessary things** (things that exist by their very nature and cannot fail to exist).
  *   **The Resilience:** Leibniz would argue that even if the universe is past-eternal, it is still *contingent*. Just because a thing has always existed doesn't mean it *must* exist.
  *   **The Key Distinction:** **Eternity $\neq$ Necessity.**
      *   A thing can be eternal but contingent (it happens to exist forever, but it didn't *have* to).
      *   A thing can be necessary (it exists by its own nature).

  ### 3. The "Eternal Boot" Analogy
  To see why the Leibnizian argument survives an eternal universe, consider this classic analogy:

  Imagine you are walking in a forest and you find a boot hovering in the air.
  *   **Scenario A:** The boot appeared there 5 minutes ago. You ask, "What caused this?"
  *   **Scenario B:** Someone tells you, "Actually, that boot has been hovering there forever. It has no beginning in time."

  **For the Kalam Argument:** Scenario B solves the problem. If the boot has always been there, it never "began to exist," so we don't need to find a cause for its *beginning*.

  **For the Leibnizian Argument:** Scenario B does *not* solve the problem. Even if the boot has been there forever, it is still a boot. Boots don't exist by necessity; they are made of leather, stitched together, and could easily *not* exist. The question shifts from "Who made this?" to **"Why is there an eternal boot rather than nothing?"**

  The fact that the boot has an infinite history does not explain *why* there is a boot at all. An infinite chain of contingent states (even stretching back infinitely) is still a chain of contingent states. It requires an external ground to explain why *that specific chain* exists rather than a different one, or none at all.

  ### 4. Applying this to the Multiverse
  You mentioned the multiverse. This is where the distinction becomes sharpest.

  *   **Against Kalam:** If the multiverse is past-eternal, the Kalam argument cannot get off the ground. There is no $t=0$ for the multiverse.
  *   **Against Leibniz:** The proponent of the Leibnizian argument simply asks: "Is the multiverse necessary?"
      *   If the multiverse operates on physical laws, those laws could presumably have been different.
      *   If the multiverse could have been different, it is **contingent**.
      *   If it is contingent, it requires an explanation for its existence outside of itself, regardless of whether it had a beginning in time.

  ### Summary
  Your professor's point is that the two arguments attack the problem from different angles:

  1.  **Kalam** argues from **Temporal Finitude**. (It needs a beginning).
      *   *Verdict:* A past-eternal model **kills** this argument.
  2.  **Leibniz** argues from **Ontological Contingency**. (It needs a reason for being).
      *   *Verdict:* A past-eternal model **does not kill** this argument, because an eternal thing can still be contingent.

  To defeat the Leibnizian argument, you cannot simply say "the universe is eternal." You must make the much harder claim that "the universe (or multiverse) is **necessary**"—i.e., that it is impossible for nothing to have existed. That is a much heavier metaphysical lift than simply positing an infinite past.

  So, you were right that they share a conclusion, but you missed that they rely on different premises to get there. One needs a *start*; the other needs a *reason*. An eternal universe has no start, but it still needs a reason.
