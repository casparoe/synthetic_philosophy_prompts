answer: |-
  **Setting:** *A well-lit laboratory table. A strip of 100 paper swatches is laid out in a row. Swatch 1 is a vivid crimson. Swatch 100 is a deep amber. The transition is imperceptible between neighbors. Elena (Epistemicist) and Sam (Supervaluationist) stand over the middle of the strip.*

  **Elena:** It's classical logic, Sam. Swatch 1 is red. Swatch 100 is not. By the law of excluded middle, there must be a specific number $n$ where swatch $n$ is red and swatch $n+1$ is not. The boundary exists; we just can't locate it.

  **Sam:** But that implies a metaphysical miracle. Look at swatch 42 and 43. Physically, they are indistinguishable. To say 42 falls inside the extension of "red" and 43 falls outside is to claim a semantic catastrophe based on a physical non-difference. My view is simpler: "Swatch 42 is red" is neither true nor false. It is superfalse only if it fails on all admissible precisifications, and supertrue only if it passes on all. In the middle, it's indeterminate. There is no single cut-off.

  **Elena:** That's where you're smuggling the sharp boundary back in, disguised as meta-linguistic precision. You say a sentence is true if it holds across *all admissible precisifications*. But consider the predicate "is an admissible precisification." Is that predicate precise?

  **Sam:** It is constrained by usage, certainly.

  **Elena:** Constrained how? If the set of admissible precisifications has a fuzzy boundary, then your definition of truth is itself vague, and we haven't solved anything. But if the set of admissible precisifications has a *sharp* boundary—if there is a specific point where a precisification switches from being admissible to inadmissible—then you haven't eliminated sharp cut-offs. You've just relocated them. You've dissolved the first-order vagueness of "red" only by positing a second-order sharpness regarding "admissibility." This is the problem of higher-order vagueness. You claim to respect the intuition that there are no sharp boundaries, yet your theory requires a sharp boundary between the precisifications that count and those that don't.

  **Sam:** That is a formal worry, Elena, but let's turn to your metaphysical commitment. You accept the sharp cut-off. You say there *is* a fact of the matter that, say, 53 is red and 54 is not. You appeal to a margin-for-error principle to explain our ignorance: we cannot know the cut-off because knowledge requires safety, and our discriminative abilities aren't fine-grained enough to track the boundary safely.

  **Elena:** Exactly. We can't know it because if we believed 53 was the last red one, we could easily have been wrong given the perceptual similarity.

  **Sam:** But that explains the *ignorance*, not the *truth*. It tells me why I can't find the line, but it doesn't tell me what *makes* the line sit between 53 and 54 rather than 54 and 55. If the physical properties vary continuously, and usage varies continuously, what ground makes it the case that 53 is the true cut-off? Your margin-for-error account merely redescribes the mystery of the Sorites paradox as a limit on epistemic access. It posits a magical semantic fact that supervenes on nothing distinguishable. You're asking me to believe in a brute, unknowable semantic fact. Isn't that more mysterious than my admissible sets?

  **Elena:** It's not brute; it supervenes on total usage patterns, even if the mapping is chaotic. But look at your counter-objection. You criticize my sharp boundary of truth, yet you rely on a sharp boundary of admissibility. If I am positing a "magical semantic fact" about the cut-off of "red," you are positing a "magical semantic fact" about the cut-off of "admissibility." If my view is objectionable because it posits a sharp line where we see none, yours is objectionable for the exact same reason, just one level up in the meta-language. You haven't explained away the sharpness; you've just made it harder to see.

  **Sam:** I'd argue the boundary of admissibility is pragmatic, not metaphysical. It's about which ways of making the language precise are compatible with our linguistic rules. It's not a single point in the world; it's a constraint on interpretation. But you... you are claiming the world contains a specific swatch that is the *last red one*. When I ask what makes it so, you say "usage." But usage is vague! If usage determines the extension, and usage is vague, how can the extension be sharp? You're saying vague causes produce precise effects. That seems causally inexplicable.

  **Elena:** And you're saying vague constraints produce a defined set of "admissible" models. If usage is too vague to fix a sharp extension for "red," it is equally too vague to fix a sharp extension for "admissible precisification." You are hoist by your own petard. If vagueness prevents a sharp cut-off in the object language, it must prevent a sharp cut-off in the meta-language. So, either there are sharp cut-offs everywhere, and I am right that they exist, or there are no sharp cut-offs anywhere, and your definition of supertruth fails to be well-defined.

  **Sam:** But supertruth doesn't require a sharp cut-off in the set of precisifications to do its work. It only requires that for any borderline case, there is *some* precisification where it's true and *some* where it's false. I don't need to know exactly where the set of admissible precisifications ends to know that 42 is a borderline case. I just need to know that not all admissible precisifications agree. Your view forces me to accept that 42 is definitely red or definitely not red, and that I am simply blind to it. That destroys the phenomenon of vagueness rather than explaining it.

  **Elena:** And your view forces me to accept that "There is a cut-off" is neither true nor false, which violates classical logic. But let's stay on the explanation. You say my view makes the cut-off mysterious. I say your view makes the *status* of the cut-off mysterious. If I ask you, "Is it admissible to draw the line at 53?" you must say "Yes." "Is it admissible to draw the line at 54?" "Yes." "Is it admissible to draw the line at 99?" "No." Somewhere between 54 and 99, the answer switches from Yes to No. Is *that* switch sharp? If yes, you are an epistemicist about admissibility. If no, your logic is fuzzy. You cannot escape the sharp boundary; you can only choose which predicate bears it.

  **Sam:** Perhaps the switch isn't sharp. Perhaps it's indeterminate whether a precisification is admissible.

  **Elena:** Then you have third-order vagueness. And I will ask you again: is the boundary of *that* indeterminacy sharp? You are pushing the bump in the carpet, Sam. I am willing to accept the bump sits in the extension of "red." You are trying to hide it under "admissibility," but the floor is hard.

  **Sam:** And I am willing to accept the bump sits in the meta-language to preserve the intuition that no single swatch in this row is metaphysically privileged over its neighbor. You preserve logic at the cost of intuition; I preserve intuition at the cost of bivalence. But do not tell me my view is more mysterious. To say "we cannot know which swatch is the last red one" implies there *is* one. To look at 42 and 43 and say "neither is privileged" respects the continuity of the world. Your margin-for-error principle explains why we stumble, but it doesn't explain why there is a cliff there for us to fall off.

  **Elena:** And your admissibility conditions explain why we hesitate, but they don't explain why the hesitation stops being relevant at some point. We are both positing a boundary we cannot see. I admit mine is unknowable. You pretend yours is non-existent, but your theory requires it to function.

  **Sam:** *Sighs, looking down at the strip.* I suppose we agree on the data. Swatch 1 is red. Swatch 100 is orange. We just disagree on what happens in the middle.

  **Elena:** *Nods.* One of these swatches is the last red one. I just don't know which.

  **Sam:** And I say none of them are uniquely the last red one. But I can't tell you exactly where the set of admissible interpretations ends.

  **Elena:** Precisely.

  **Sam:** So we're stuck.

  **Elena:** It seems the vagueness isn't just in the swatches.

  **Sam:** No. It's in the philosophy, too.

  *They stand in silence, looking at the gradient, neither willing to point to a specific number.*
