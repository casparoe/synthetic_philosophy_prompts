  **Grade: A-**

  **Comments for Feedback:**

  *   **Case Facts (Solid):** Your summary of the grudge informer case is concise and accurate. You correctly identify the key dates, the nature of the statute, and the postwar court's reasoning ("sound conscience and sense of justice"). This sets up the jurisprudential problem perfectly.
  *   **Hart's Position (Solid):** This is the strongest part of your answer. You accurately capture Hart's preference for "frank retroactivity" over judicial denial of validity. More importantly, you correctly identify *why* Hart thinks this matters: it forces a clear-eyed acknowledgment of the "moral price" paid (sacrificing non-retroactivity) rather than obscuring it with confused metaphysics about what counts as "law." This demonstrates a strong grasp of *Positivism and the Separation of Law and Morals*.
  *   **Fuller's Response (Shaky/Imprecise):** You correctly identify Fuller's critique that the Nazi regime failed to meet the requirements of a legal order. However, there is a significant terminological error in your second paragraph. You write: *"His idea of an internal morality of law — what Hart elsewhere calls the 'minimum content of natural law'..."*
      *   **Correction:** These are distinct concepts from different authors. Hart's "minimum content of natural law" (found in *The Concept of Law*) refers to substantive rules necessary for human survival (e.g., restrictions on violence, property). Fuller's "internal morality of law" (found in *The Morality of Law*) refers to *procedural* principles of craftsmanship (e.g., generality, publicity, non-retroactivity, congruence). Conflating the two suggests a lack of precision with the texts. While you go on to describe Fuller's procedural concerns correctly (secret laws, retroactivity), the initial definition attributes Hart's terminology to Fuller, which is technically incorrect.
  *   **Handling of 'Internal Morality' (Solid Analysis, Flawed Definition):** Despite the terminological mix-up noted above, your application of the concept is excellent. You correctly explain the *work* the concept is doing: it allows Fuller to argue that the Nazi statute wasn't just immoral, but legally deficient because it violated the procedural conditions of legality.
  *   **Synthesis/Critique (Solid):** Your final sentence is outstanding. Pointing out that Hart's proposed solution (a retroactive statute) would itself violate Fuller's internal morality is a sophisticated observation that shows you are thinking critically about the exchange rather than just summarizing it. This insight saves the answer from being marked down further for the terminology error.

