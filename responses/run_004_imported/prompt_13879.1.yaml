answer: |-
  **Title:** The Weight of Numbers: Fairness, Claims, and the Clinic Case

  **Introduction**

  The dilemma facing your rural clinic is a classic instance of what philosophers call the "Numbers Problem." On one side stands the intuitive impulse to save the greater number—a view rooted in utilitarian aggregation, which suggests we should minimize total loss of life. On the other stands the challenge posed by John Taurek in his seminal 1977 paper, "Should the Numbers Count?" Taurek argues that this intuition is morally mistaken, suggesting that when faced with a choice between saving one person or five, a decision-maker ought to flip a coin. This position has rightly unsettled your team, as it strikes at the heart of how we value human life in triage situations.

  To navigate this, we must first understand why Taurek believes aggregation disrespects the individual, and then examine whether a alternative framework can justify saving the many without losing sight of that individual worth. After analyzing Taurek's argument alongside T. M. Scanlon's contractualist response, I will argue that Taurek is ultimately incorrect: fairness does not require a coin flip. In cases where individuals have equal claims to rescue and the cost of saving them is comparable, the numbers *must* count. To do otherwise is not to honor the individual, but to fail in our duty to prevent the greater tragedy when we are able to do so.

  **Taurek's Argument: The Separateness of Persons**

  Taurek's argument begins with a metaphysical claim about loss. He observes that when we say "it is worse for five people to die than for one," we are implicitly treating the group of five as a single entity that can experience a "super-loss." But, Taurek insists, there is no such entity. There are only five distinct individuals. For each of those five, the loss is identical: it is the loss of their own life. For the single individual on the other side, the loss is also the loss of their own life.

  Since there is no single person who suffers the death of five, Taurek argues we cannot compare the "total loss" of the group against the "total loss" of the individual. From the perspective of the one, their death is 100% of their world. From the perspective of any one of the five, their death is also 100% of their world. Because the stakes are identical for every individual involved (life vs. death), no one has a claim that is intrinsically weightier than anyone else's.

  This leads Taurek to his conclusion about fairness. If you automatically choose to save the five, you are effectively deciding that the one person's life is worth less than the combined lives of the others. You are using the one as a mere means to the end of saving the group. To treat all six people as moral equals, Taurek suggests you must give each an equal *ex-ante* chance of survival. By flipping a coin, you give the single patient a 50% chance and the group of five a 50% chance. While this results in the one person dying more often over many repetitions, in this specific instance, it respects the symmetry of their claims. For Taurek, fairness is about the procedure of decision-making, not the arithmetic of the outcome.

  **The Reply: Scanlon and the Principle of Rescue**

  Taurek's argument is powerful because it protects the individual from being swallowed by the collective. However, it relies on a specific definition of fairness that T. M. Scanlon challenges in *What We Owe to Each Other*. Scanlon approaches ethics through contractualism: an act is wrong if it violates principles that no one could reasonably reject.

  In addressing the Numbers Problem, Scanlon proposes a "Principle of Rescue." He argues that if you are in a position to save people from serious harm, and you can save a larger group at no additional cost to yourself (or to the one person), you ought to save the larger group. The crux of Scanlon's reply lies in the idea of "reasonable rejection."

  Imagine you are the single patient. Could you reasonably reject a principle that says, "When a rescuer can save five lives or one, they must save the five"? Scanlon argues you cannot. Why? because the reason for saving people—the value of human life and the prevention of death—applies five times in the one scenario and only once in the other. If you demand a coin flip, you are asking the rescuer to ignore four preventable deaths. The five people, conversely, *can* reasonably reject a principle that mandates a coin flip, because that principle condemns four of them to death unnecessarily.

  For Scanlon, saving the five is not about adding up utilities like points in a game. It is about acknowledging that the *reason* to save a life is present five times over. To ignore the numbers is not to be neutral; it is to be indifferent to the fact that more people are in need of help. Fairness, in this view, is not about giving every party an equal chance of winning the lottery of survival; it is about giving equal consideration to every person's need, which logically leads to satisfying the most needs possible when conflicts arise.

  **The Verdict: Why the Numbers Must Count**

  Your team must decide whether to side with Taurek's procedural fairness or Scanlon's substantive duty. While Taurek's concern for the "separateness of persons" is vital for preventing tyranny, his conclusion in the clinic case is untenable. I argue that you should defend the position that **the numbers count**, and that the clinic is morally obligated to save the five patients rather than flip a coin.

  The defense of this verdict rests on distinguishing between *sacrificing* the one and *failing to save* the one. Taurek assumes that choosing the five is an active sacrifice of the one. But in a disaster scenario where resources are scarce, the death of the one is not caused by the decision to save the five; it is caused by the shortage of medication. The moral question is not "Who shall we kill?" but "Who shall we save?"

  When the question is framed as a duty to rescue, Taurek's coin flip becomes an abdication of responsibility. If you walk past two burning buildings, one containing one person and one containing five, and you have the capacity to enter only one, flipping a coin to decide which to enter is not "fairness." It is a refusal to acknowledge the moral weight of the four extra lives you could have preserved. To treat people as equals is to value their lives equally. If I value Life A and Life B equally, and I can save both, I should. If I can only save one or the other, I am stuck. But if I can save Life B *plus* four others, choosing to save only Life A (via a 50% coin flip chance) implies that the four additional lives have *zero* weight in my decision. That is not neutrality; that is a failure to recognize the value of those four people.

  Furthermore, Taurek's view leads to absurdities in broader contexts. If numbers never count, then in a pandemic, a hospital would be justified in flipping a coin between saving one doctor (who could then save 1,000 patients) and saving 100 patients directly. Taurek would say the doctor's claim to life is equal to any single patient's claim, so the numbers (1,000 vs. 100) shouldn't tip the scale. This violates our deepest moral intuitions about responsibility. We have a duty to do the most good we can when the claims are equal.

  Therefore, the clinic should save the five. This does not mean the one person is worthless. It means that in a tragic situation where not everyone can be saved, the moral imperative is to minimize the loss of life. The one person's claim is respected by acknowledging the tragedy of their death and ensuring the decision was not made arbitrarily or out of bias, but out of a recognition that five deaths is a greater moral catastrophe than one.

  **Conclusion**

  For your Ethics Bowl round, do not be afraid to reject the coin flip. Taurek's paper is a necessary check on utilitarian arrogance, reminding us that individuals are not just containers for value. However, his solution fails to account for the moral significance of *more* people suffering the same loss. By adopting a Scanlonian framework, you can argue that saving the greater number is not a violation of individual equality, but its fulfillment. It acknowledges that every life has value, and therefore, preserving five lives is objectively more important than preserving one. In the rural clinic, the medication should go to the five. To do otherwise is to let the perfect be the enemy of the good, and to value the symmetry of a coin toss over the reality of human survival.
