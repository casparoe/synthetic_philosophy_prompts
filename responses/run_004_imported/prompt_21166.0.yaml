      *   *Premise 2:* Motivation requires a link to $A$'s Subjective Motivational Set ($S$).
      *   *Premise 3:* This link is established via "sound deliberation."
      *   *Conclusion:* If there is no sound deliberative route from $S$ to $\phi$, there is no reason for $A$ to $\phi$. External reasons are false/mysterious.
