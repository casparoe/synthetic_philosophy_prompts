  3.  **Develop the Equivocation Objection (The "Two Senses" Critique):**
      *   *Sense 1 (Explanatory):* Reason = Motivation. Williams needs this to make the "deliberative route" intelligible. You can't deliberate toward something you can't possibly want.
      *   *Sense 2 (Normative):* Reason = Justification. The Externalist cares about this. "You have a reason not to torture, even if you want to."
