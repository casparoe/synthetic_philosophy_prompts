answer: |-
  **Title:** The Rationality of Doubting Your Doubts: Defending Level-Splitting in the Face of Higher-Order Evidence

  **Introduction**

  The case of the drugged mathematician is a philosophical trapdoor. It opens beneath our feet the moment we try to align two intuitive demands of rationality. On one hand, we feel that if the proof is valid, the mathematician should believe it is valid; the logical relations between the premises and the conclusion haven't changed just because she took a pill. On the other hand, we feel that if she has strong evidence that her reasoning is compromised, she ought to doubt her conclusion. When she holds both thoughts simultaneously—that the proof is valid, and that her confidence in the proof is likely misplaced—she enters a state philosophers call *epistemic akrasia*.

  The central question of this debate is whether this state is a failure of rationality or a necessary feature of it. The "Enkratic" view holds that rationality forbids akrasia; you cannot rationally believe $P$ while believing that your evidence does not support $P$. Your friend on the debate team champions this view: she argues we must always defer to higher-order evidence (HOE). Opposing her is the "Level-Splitting" view, which suggests that first-order evidence (the proof) and higher-order evidence (the drug) operate on different planes, and it can be rational to let them diverge.

  While the Enkratic principle offers a seductive picture of a coherent, unified mind, it ultimately collapses into skepticism when faced with misleading higher-order evidence. Therefore, I argue that epistemic akrasia is sometimes permissible. In cases like the mathematician's, level-splitting is not just a psychological quirk but the only rational way to preserve the integrity of first-order reasoning without falling into a self-undermining regress.

  **The Case for the Enkratic Principle**

  The strongest argument for your friend's position—that the mathematician must lower her confidence—rests on the nature of rational agency. Proponents of the Enkratic principle, such as David Christensen and Sophie Horowitz, argue that rationality is fundamentally about managing your perspective on the world. If you believe that your current belief is unsupported by your total evidence, holding that belief anyway is a form of practical contradiction. It is akin to saying, "I am doing what I judge I ought not to do."

  Consider the alternative. If the mathematician ignores the evidence about the drug, she is effectively treating her own cognitive faculties as infallible. She is saying, "Even though there is an 80% chance my logic is broken, I know my logic is working." This looks less like steadfastness and more like dogmatism. The Enkratic view posits that higher-order evidence is still *evidence*. It is information about the likelihood that your connection to the truth is severed. To ignore it is to violate a core norm of epistemology: proportioning your belief to the evidence. Since the "total evidence" now includes the probability of impairment, the rational credence in the proof's validity must drop. To do otherwise is to be akratic, and on this view, akrasia is a definitive mark of irrationality.

  **The Case for Level-Splitting**

  The Level-Splitting view, defended by philosophers like Maria Lasonen-Aarnio, pushes back against this by distinguishing between the *content* of a belief and the *assessment* of that belief. In the mathematician's case, the first-order evidence is the proof itself. If the proof is sound, it necessitates the conclusion. The drug does not change the mathematical facts; it only changes the mathematician's reliability in accessing them.

  The core strength of level-splitting is that it avoids the "self-undermining" regress that plagues the Enkratic view. If the mathematician lowers her confidence because she might be drugged, she must apply that same doubt to the calculation she just performed to lower her confidence. After all, that calculation was also performed while potentially under the influence of the drug. If she must defer to the HOE, she must doubt her doubt. This creates a spiral where she can trust no reasoning process, including the one telling her to be skeptical.

  Level-splitting allows the mathematician to say: "The proof compels me to believe $P$. The drug evidence compels me to believe that my belief in $P$ is unreliable." These two beliefs can coexist. The first is a response to the logical relations on the page; the second is a response to the probabilistic facts about her biology. By splitting the levels, she acknowledges the risk of error without abandoning the deliverances of her reasoning. She remains "akratic" in the technical sense, but she avoids the paralysis of total skepticism.

  **The Verdict: Akrasia as a Rational Necessity**

  I commit to the Level-Splitting view: epistemic akrasia is sometimes the rational response to higher-order evidence. Specifically, in cases where the first-order evidence is objective, surveyable, and compelling (like a mathematical proof), and the higher-order evidence is probabilistic and external (like a drug scenario), the first-order evidence should dictate the belief, even if the higher-order evidence dictates a negative assessment of that belief.

  The reason for this verdict lies in the distinction between *truth-conduciveness* and *rational coherence*. The Enkratic view prioritizes coherence; it wants the agent's mind to be a tidy, consistent system. But epistemology is ultimately about tracking truth. In the math case, the truth is determined by the proof, not by the mathematician's psychological state. If the proof is valid, believing it is the truth-tracking move. If she lowers her confidence solely because of the drug story, she is allowing a mere possibility of error to override an actuality of logical demonstration.

  Furthermore, the Enkratic view makes rationality too fragile. It suggests that any story we tell ourselves about our own unreliability can defeat our knowledge. If I know I have hands, but I read a philosophical paper arguing that I might be a brain in a vat (higher-order evidence), the Enkratic principle suggests I should suspend belief that I have hands. This is an intolerable result. It makes our knowledge hostage to skeptical hypotheses. Level-splitting allows us to maintain our knowledge of the world (or the proof) while acknowledging the philosophical force of the skeptical challenge. We can believe we have hands while admitting that, from a detached, third-person perspective, our evidence doesn't rule out the vat. This akratic state is uncomfortable, but it is rational.

  **The Strongest Objection: The Charge of Dogmatism**

  The most potent objection to my position is the charge of dogmatism. Critics will argue that if we permit level-splitting, we grant agents a license to ignore clear warning signs of their own incompetence. If the mathematician can ignore the drug evidence, what stops a biased politician from ignoring polls showing they are wrong, claiming they are "splitting levels" between their gut instinct and the data? If akrasia is permissible, does rationality lose its normative force? Doesn't this view allow us to cling to beliefs even when we admit we have no good reason to hold them?

  This objection is serious, but it conflates *misleading* higher-order evidence with *defeating* higher-order evidence. In the mathematician's case, the drug evidence is misleading; she is actually reasoning fine (let us assume). But in the politician's case, the polling data is likely accurate. The Level-Splitting view does not say HOE *never* matters. It says that when first-order evidence is direct and objective (like a proof or a perceptual experience), it can withstand probabilistic HOE.

  However, I must concede a cost: my view requires us to accept that rationality can feel like a fracture. It requires the mathematician to hold a belief while simultaneously holding a meta-belief that says, "This belief is suspect." This is indeed akratic. But it is better to be akratic and right than coherent and skeptical. The objection fails because it assumes that rationality requires a seamless unity of mind. I argue that in a world where we are fallible creatures subject to unknown variables, a seamless mind is a fantasy. The rational agent is not the one who never experiences tension between their evidence and their assessment of that evidence, but the one who navigates that tension without abandoning the best tools they have for finding the truth.

  **Conclusion**

  The drugged mathematician does not need to choose between her proof and her drug test. She can accept the proof as valid while accepting that her confidence in it is, from a broader perspective, risky. This is epistemic akrasia, but it is not irrational. To demand otherwise is to demand that we treat evidence about our reliability as superior to evidence about the world, a move that leads inevitably to skepticism. We should accept that rationality is sometimes messy. We can, and sometimes must, believe what our evidence supports, even when we suspect that we are not the kind of people who should be trusting that evidence. In the end, it is better to split the levels than to lose the truth.
