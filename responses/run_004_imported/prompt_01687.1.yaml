answer: |-
  **Title:** The Boundary of Meaning
  **Characters:**
  *   **Elena:** A defender of the Classical Gricean framework.
  *   **Marcus:** A critic influenced by Contextualism and Relevance Theory.
  **Setting:** A quiet corner of the university library, late afternoon.

  **Elena:** You look like you've been staring at that same page of *Logic and Conversation* for an hour. Is Grice giving you trouble?

  **Marcus:** Not trouble, exactly. Just frustration. I'm trying to write a paper on the saying-implicating distinction, and the more I look at it, the more the boundary seems to dissolve. Grice wants to draw a sharp line between "what is said"—the truth-conditional content determined by conventional meaning—and "what is implicated," which is inferred via the Cooperative Principle. But I don't think the line holds.

  **Elena:** That's a bold claim. But isn't the distinction necessary? Without it, we can't separate the literal content of an utterance from the speaker's intended meaning. If I say, "Some of the students passed," what I *say* is that at least one, possibly all, passed. What I *implicate* is that not all passed. If we conflate those, we lose the ability to explain how I can deny the implicature ("In fact, all of them passed") without contradicting myself. Grice saves logic by grounding "saying" in the conventional meaning of the words.

  **Marcus:** I agree that we need to distinguish between encoded meaning and inferred meaning. But Grice defines "what is said" as the proposition expressed after disambiguation and reference fixing. He thinks that once you've fixed the referents of "I," "you," and "that," semantics does the rest. My problem is that conventional meaning, even with reference fixing, rarely yields a complete proposition. It underdetermines what is said.

  **Elena:** Underdetermination is common, sure. But Grice accounts for that through indexicals. If I say, "I am here now," the semantics require context to fix the variables. Once fixed, we have a proposition. That's still "what is said." It doesn't require pragmatic inference in the sense of implicature.

  **Marcus:** But what about cases where there *are* no variables to fix? Consider the sentence: "It's raining."

  **Elena:** Okay. "It" is a dummy subject, "raining" is the predicate.

  **Marcus:** Exactly. Semantically, "rain" is a relation between a time and a *location*. But the sentence "It's raining" contains no syntactic slot for location. There is no hidden indexical like "here" in the grammar. Yet, if I utter this sentence in Oxford, and it is sunny in Oxford but raining in Tokyo, my statement is false. To evaluate the truth of what I said, you *must* supply a location.

  **Elena:** I'd argue that the location is supplied by the context of utterance as a matter of reference fixing, similar to an indexical. It's part of the intuitive notion of "what is said." Grice allows that "what is said" must be a determinate proposition. So, the location is part of the saying, not the implicature.

  **Marcus:** But *how* is it supplied? It's not decoded from the words. It's supplied by pragmatic processes—by our understanding of what is relevant in the conversation. If I call you and say, "It's raining," and you are in London, you assume I mean London. If we are discussing your vacation in Spain, you assume I mean Spain. This isn't just reference fixing; it's *pragmatic intrusion* into the truth-conditional content. Grice wants to keep pragmatics out of "what is said" and relegate it to "what is implicated." But here, pragmatics is required just to get "what is said" off the ground.

  **Elena:** I see where you're going. You're arguing that because context determines the location, and context is pragmatic, then "what is said" is pragmatic. But Grice's point isn't that context is irrelevant to "saying." It's that the *conventional meaning* provides the skeleton. The location is a mandatory constituent. We can distinguish between mandatory saturation—which is part of "saying"—and optional enrichment, which is "implicating." Grice's framework can stretch to include unarticulated constituents like location under "what is said" without collapsing the distinction.

  **Marcus:** Can it? Let's push it further. Consider the sentence: "I've had breakfast."

  **Elena:** A classic.

  **Marcus:** If I say this at 10:00 AM, I mean "I've had breakfast *today*." If I say it during a job interview about my general habits, I might mean "I have experience eating breakfast" or "I've had breakfast *in my life*." The truth conditions shift radically based on the context. There is no temporal variable in the sentence. If we follow Grice strictly, "what is said" should be the timeless proposition that I have had breakfast at some point in history. But nobody communicates that. Nobody evaluates the truth of that proposition. We always evaluate the contextually enriched version.

  **Elena:** But if you allow context to determine the time frame freely, aren't you worried about over-intellectualizing semantics? If "what is said" is entirely malleable based on context, then semantics loses its explanatory power. The beauty of Grice's account is that it preserves a stable, conventional core. "I've had breakfast" literally means at least once in the past. If I say it, and it turns out I had breakfast in 1998 but not today, I have technically spoken the truth, even if I misled you. The *lie* or the *misleading nature* is captured by implicature. This protects the notion of literal truth.

  **Marcus:** Does it protect it, or does it make it irrelevant? In ordinary communication, we don't care about the "literal truth" of the timeless proposition. We care about the proposition the speaker intended to assert. If Grice's "what is said" is a proposition that no one actually assesses for truth, then it's a theoretical ghost. It does no work.
  Furthermore, this undermines the mechanism of implicature. Gricean implicature is calculated based on "what is said." The hearer thinks: "He said P; but P would be irrelevant unless he meant Q; therefore he implicated Q." But if "what is said" (P) is itself dependent on pragmatic enrichment to even be a proposition, the calculation never gets started. You need pragmatics to get P, before you can use P to get Q.

  **Elena:** That's a strong objection. But consider the alternative. If you dissolve the boundary, if "what is said" is just "what is meant," you lose the ability to explain irony, metaphor, and yes, conversational implicature. If I say, "You're a fine friend," and I mean you're a terrible friend, I need a distinction between the conventional meaning of "fine" (positive) and my intended meaning (negative). If context determines "what is said" entirely, then in that context, "fine" just *means* terrible. That destroys compositionality. We wouldn't be able to learn language if word meanings shifted that drastically with every context.

  **Marcus:** I'm not arguing for radical contextualism where words mean anything. I'm arguing that the *proposition expressed* is a hybrid of semantic meaning and pragmatic inference. Grice treats "what is said" as the output of semantics. I'm saying it's the output of semantics *plus* pragmatic modulation.
  Take your irony example. We can still explain that. The semantic content provides a constraint, but the explicit content (what is said) is modulated. The distinction isn't between "said" and "implicated." It's between "encoded meaning" and "communicated meaning." Grice's middle layer—"what is said"—is the problem. It's too thin to be the truth-conditional content, but too thick to be purely semantic.

  **Elena:** So you want to abandon the saying-implicating distinction entirely?

  **Marcus:** I want to abandon the idea that "what is said" is a purely semantic notion. I think we should admit that pragmatics penetrates deep into the truth conditions. Grice's framework assumes a clean modular separation: Semantics first, then Pragmatics. But the evidence suggests they are interwoven. When I say, "John is tall," the truth conditions depend on whether we are talking about jockeys or basketball players. "Tall" doesn't have a fixed semantic threshold. The context supplies the comparison class *before* we determine truth. That's not implicature; that's part of understanding the claim itself.

  **Elena:** I concede that context supplies the comparison class. But Griceans can argue that this is a form of "implicit indexicality." We can treat "tall" as "tall for an X." If we treat these contextual dependencies as part of the logical form—part of "what is said"—we preserve the distinction. The key is that *implicature* is cancellable. I can say, "John is tall, though not for a basketball player." I cannot cancel the comparison class entirely and still make sense. This cancellability test preserves Grice's boundary. If it's not cancellable, it belongs to "what is said."

  **Marcus:** The cancellability test is useful, but it's not a silver bullet. There are cases of "free enrichment" that feel like "what is said" but behave like implicatures. Suppose I say, "I won't be able to come; I have to pick up my kid." What I say is that I have to pick up *a* kid. What I mean is *my* kid. If I say, "I have to pick up a kid, but not mine," I sound insane, not like I'm cancelling an implicature. So "my kid" feels like part of "what is said." But there is no possessive marker in the syntax. It's purely pragmatic enrichment. If Grice forces us to call this "implicature," his definition of "saying" is too narrow. If he forces us to call it "saying," his definition of "saying" is no longer semantic.

  **Elena:** Perhaps the solution isn't to discard Grice, but to refine the notion of "what is said." We can acknowledge that "what is said" includes pragmatic elements required for propositional completion—like the location in "It's raining" or the possession in "pick up my kid." We call this the "explicature," as Relevance Theorists do. But we must keep it distinct from *conversational* implicature. Why? Because the stakes are different.
  If I say, "It's raining," and it isn't raining here, I have lied. If I say, "Some students passed," implicating "not all," and actually all passed, I have been misleading, but I haven't lied. We need Grice's distinction to maintain ethical and logical accountability. If we blur the line, we can't distinguish between lying and misleading.

  **Marcus:** That's a practical defense, Elena. But is it theoretically sound? You're saving the distinction by moving the goalposts. You're admitting that pragmatics determines truth conditions (the "explicature"), which is my main point against Grice. Grice wanted "what is said" to be the domain of semantics. You're admitting it's the domain of semantics *plus* mandatory pragmatics.
  My worry is that once you admit pragmatic intrusion for "It's raining," there's no principled stop. Why not for "John is tall"? Why not for "I've had breakfast"? If pragmatics determines the truth conditions in all these cases, then Grice's original motivation—to protect formal semantics from the messiness of use—fails. Semantics no longer determines truth conditions.

  **Elena:** Semantics provides the *constraints*. Pragmatics provides the *values*. Without the conventional meaning of "rain," you wouldn't know you were looking for a location. Without "breakfast," you wouldn't know you were looking for a time. Grice's insight remains: we communicate by recognizing the conventional meaning and then reasoning about why the speaker chose those words in this context. Whether we call the result of that reasoning "enriched saying" or "explicature," the core mechanism—cooperative inference—remains. The framework isn't undermined; it's just more complex than Grice initially hoped.

  **Marcus:** I can accept that the *mechanism* of inference is Gricean. But the *taxonomy* is where he fails. By insisting that "what is said" is the propositional content, he implies it's a stable, semantic object. I'm arguing it's a pragmatic construct. If we teach students that "what is said" is just the conventional meaning, they will fail to analyze real communication. If we teach them it's the truth-conditional content, they have to admit pragmatics is involved.
  So, here is my challenge: If "what is said" is determined by context to the point where the semantic meaning is merely a clue, isn't the distinction between "saying" and "implicating" just a distinction between "mandatory inference" and "optional inference"? And if so, isn't that a difference of degree, not the fundamental categorical divide Grice claimed it was?

  **Elena:** *Pauses, tapping her pen on the table.* A difference of degree... That is the worry. If it's just mandatory vs. optional enrichment, then the wall between semantics and pragmatics is a spectrum, not a border.
  However, I still think the border is necessary for logic. In a court of law, or in science, we need to know when a statement is literally false versus when it is merely imprecise. Grice gives us the tools to make that call. Even if the boundary is fuzzy in cases like "It's raining," the hard cases don't invalidate the clear ones. "Some" vs. "All" still works. "And" vs. "And then" still works.

  **Marcus:** The clear cases are why we started with Grice. But philosophy lives in the hard cases. And in the hard cases, context doesn't just help us understand; it constructs what is said. I think we have to accept that "what is said" is not a semantic given, but a pragmatic achievement.

  **Elena:** Then perhaps we can agree on this: Grice was right about the *process* of inference, but wrong about the *architecture* of content. The saying-implicating distinction is useful, but only if we acknowledge that "saying" is already soaked in context.

  **Marcus:** Now *that* is a conclusion I can write down. Grice's engine works, but his map of the territory was too simple.

  **Elena:** *Smiles.* I'll take that. It's raining, after all.

  **Marcus:** *Laughs.* Careful. You mean *here*, right? Or are you implicating that my argument is full of water?

  **Elena:** Let's leave that as an exercise for the reader.
