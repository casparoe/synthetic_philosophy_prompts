answer: |-
  **MEMORANDUM**

  **TO:** Policy Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Protocol for Abuser Inquiries

  **Recommendation**
  I recommend the committee adopt the **Flat Denial** script (e.g., *"There is no one by that name residing at this facility"*). We should not adopt the "I cannot confirm or deny" script.

  **Reasoning**
  The split in this committee hinges on an ethical distinction between *asserting a falsehood* (lying) and *withholding information* (concealment). Our Clinical Director rightly notes that Augustinian ethics permit concealment to protect life, provided one does not formally assert a falsehood. On paper, "I cannot confirm or deny" respects this distinction. However, in the specific context of domestic violence, this distinction collapses in practice.

  1.  **The Failure of Ambiguity as Concealment:** The ethical goal of the Augustinian position is to hide the survivor's location without corrupting the speaker's truthfulness. This relies on the listener accepting the boundary of silence. Abusers, however, operate on coercion and hyper-vigilance. In our field, ambiguity is functionally equivalent to confirmation. If a staff member refuses to deny the survivor's presence, a determined abuser will interpret that refusal as proof of life. Therefore, "concealment" via silence actually results in *disclosure*. To achieve the moral objective of protection (which both sides agree on), a flat denial is the only mechanism that effectively conceals.
  2.  **Forfeiture of the Right to Truth:** Ethical communication assumes a good-faith exchange. When an individual seeks information with the intent to inflict harm, they forfeit the right to truthfulness. In this context, a flat denial is not a "lie" in the malicious sense; it is a defensive boundary enforcement. It asserts the shelter's sovereignty over its space rather than making a factual claim about the roster.
  3.  **Mission Priority:** Our primary mandate is the physical safety of survivors. While maintaining staff integrity is vital, it cannot supersede the immediate risk of lethality. A script that is philosophically pure but practically unsafe fails our mission.

  **Strongest Counter-Argument**
  The most compelling argument against the Flat Denial script is the risk of **moral injury to staff**. Requiring employees to explicitly state falsehoods can create cognitive dissonance, particularly for those with personal, religious, or professional commitments to radical honesty. Over time, normalizing deception—even for benevolent reasons—can erode staff trust in leadership and blur ethical boundaries in other areas of operation (e.g., documentation, funding reporting). If staff feel they are being asked to compromise their integrity, it may lead to burnout or turnover, which ultimately undermines the shelter's capacity to care for survivors.

  **Next Steps**
  If the committee accepts this recommendation, I propose we pair the script with mandatory training that frames the denial not as "lying" but as "safety enforcement," allowing staff to reconcile the action with their personal ethics.
