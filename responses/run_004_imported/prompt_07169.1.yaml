answer: |-
  Good morning. For those of you who don't know me, I'm [Your Name], Miriam's niece/nephew.

  Standing here, I'm aware of a specific challenge. My aunt spent forty years teaching philosophy of mind. She was a person who cared deeply about precision. If I tell you she is "in a better place," I know two things: one, that it would comfort my grandmother, and two, that Miriam would be rolling in her grave, or at least correcting me from the beyond—which, ironically, is exactly what she didn't believe she could do.

  Miriam's life's work was trying to understand what it means to be conscious. At family dinners, she would often ask us to imagine a creature that looked exactly like a human, acted exactly like a human, and even yelled "ouch" if you stepped on its toe. But inside, she said, there was nobody home. No light on. No feeling. It was just mechanics.

  She used this story to make a point that she felt was vital: that what happens inside us—what it *feels* like to love, to hurt, to taste a peach, to hear a piece of music—is real. It is not just electricity firing in the brain. It is something extra. Something private. Something sacred, in its own way.

  For Miriam, the fact that we have an inner life, a "someone home," was the miracle. Not that it lasts forever, but that it exists at all.

  This brings me to the hard part. Miriam did not believe that the "someone home" survives when the body dies. She drew a very firm line. She believed consciousness was distinct from the physical brain, but she also believed it was dependent on it. Like a flame is distinct from the candle, but cannot burn without the wax. When the candle is gone, the flame doesn't go to another room. It simply... ceases.

  I know that for some of us, especially those who find comfort in the promise of an afterlife, this sounds stark. But I want to suggest that Miriam's view wasn't cold. It was actually incredibly demanding. Because if this light only shines while we are here, then how we treat each other while the light is on matters immensely.

  She didn't need the promise of eternity to find value in existence. In fact, she argued that the finiteness of our consciousness is what gives it its weight. The fact that this is the only time Miriam will ever experience the smell of rain, or the sound of her book club laughing, or the taste of her morning coffee, makes those experiences precious. Not because they are a rehearsal for something else, but because they are the only performance there is.

  To her former student, who is here today: I hope I have represented her thought correctly. I know she would want me to say that the mind is not the brain, but also that it does not float free of it.

  And to my grandmother, and everyone here who holds to a faith: Miriam respected your conviction. She just had a different map for the same territory. You both agree on the most important thing: that human beings are not just objects. That there is a dignity to our inner lives that cannot be measured by a scanner or reduced to atoms.

  So, how do we say goodbye to someone who believed goodbye was final?

  We do it by acknowledging that while her consciousness is no longer generating new experiences, the impact of her experiences remains. The "what it was like" to be Miriam is gone, but what it was like to *know* Miriam is still here. It is in us.

  She taught that consciousness is the one thing in the universe that cannot be faked. You can fake the behavior, but you can't fake the feeling. So, the best way to honor her is not to pretend she is somewhere she isn't. The best way to honor her is to be fully present here, where we are. To notice the way the light hits the stained glass. To feel the grief we feel, without pretending it's something else. To be, as she would say, truly "home" inside ourselves.

  Miriam spent her life arguing that the inner world is real. Let us honor that by taking our own inner worlds seriously. By being kind to the "someone home" in the people we love, while they are still here to hear it.

  She is not watching over us. But for a little while longer, we can remember what it looked like when she was. And in that memory, the light holds, just for a moment more.

  Thank you.
