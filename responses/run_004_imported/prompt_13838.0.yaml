answer: |-
  Here is a draft for the eulogy. It is written to be spoken at a moderate, conversational pace. It should run about four to five minutes.

  I have included a few "stage directions" in brackets to help you with the delivery, but please feel free to adjust the wording to sound more like your own voice.

  ***

  **Eulogy for [Dad's Name]**

  Good morning. Thank you all for being here.

  For thirty years, my dad stood in front of classrooms at the community college and taught philosophy. But if you ask me, his best lectures weren't in the classroom. They were at our dinner table.

  He was the kind of man who would use a word like "supererogatory" completely straight-faced while passing the mashed potatoes. For those of you who didn't sit through Philosophy 101, it's a term ethicists use to describe an action that is good to do, but not wrong to *not* do. It's going above and beyond. It's a gift, not a bill.

  I bring this up because we need to talk about the kidney.

  Twelve years ago, Dad donated a kidney to a stranger. He didn't seek anyone out. He just signed up, let the doctors match him, and went about his business. When he came home, and people started calling him a "hero," he got genuinely uncomfortable. In fact, he got stubborn.

  He had a line he would recite, almost like a mantra. He'd say, "Either everyone who didn't do this is a monster, or I'm not a hero. Pick one."

  I know that sounds harsh. I know that for some of you, hearing that might bring up complicated feelings. But I've spent a lot of time thinking about why he said that. He wasn't trying to shame anyone. He was trying to protect the idea of kindness.

  Dad believed that if we label basic generosity as "heroism," we make it seem impossible for normal people. He didn't want his choice to become a measuring stick for anyone else's worth. He would have been horrified to think that his action made anyone in this room—family, friends, neighbors—feel lesser, or indebted, or guilty.

  He insisted, right up until the end, that the donation "cost him nothing."

  We know that wasn't true. We were there. We saw the recovery. We saw the pain he minimized. We saw the scars. But that was his philosophy in practice. To him, acknowledging the cost would have turned it into a transaction. It would have made it a sacrifice that demanded gratitude. By insisting it cost nothing, he was trying to make it just… an act. Something human.

  He taught us that we don't get to choose the circumstances we're born into, but we do get to choose what we give of ourselves when we have the capacity to do so. But—and this was crucial to him—that choice has to be free. It loses its value if it's forced by expectation.

  So, if you are sitting here today feeling like you need to justify your own choices against his, please know: you are arguing with a philosophy professor, and you will not win. But more importantly, you are worrying about something he didn't want you to worry about.

  He didn't do it to set a standard. He did it because he could, and because someone needed it.

  The truth is, Dad wasn't a hero because of an organ he gave away twelve years ago. He was a good man because of how he lived the thirty years before that, and the time after. He was good in the way he graded papers late at night so he wouldn't rush his students. He was good in the way he listened to neighbors' problems. He was good in the way he loved this family, imperfectly and stubbornly, but completely.

  The kidney saved a life. But the man who gave it saved us, in a hundred smaller ways, every day.

  He used to tell us that the unexamined life is not worth living. I think he'd also tell us that the unloved life is not worth giving. He gave what he could, he demanded nothing in return, and he asked us not to make a monument out of his choices, but to just keep being kind in our own ways.

  We miss you, Dad. We'll try to keep the arguments lively. And we'll try to remember that kindness doesn't need to be heroic to matter. It just needs to be real.

  Rest easy.

  ***

  ### A Few Notes for Delivery:

  *   **The "Uncle" Moment:** When you reach the paragraph starting *"He would have been horrified to think that his action made anyone in this room..."*, slow down slightly. Make eye contact with the room generally, not any specific person. This universalizes the sentiment so your uncle feels included in the absolution without being singled out.
  *   **The "Cost Him Nothing" Line:** Deliver this with a little bit of warmth or a small smile. It acknowledges the family secret (that it *did* cost him) without making it a point of contention.
  *   **The Ending:** The last few lines ("Rest easy") are optional, but they often provide a nice cue for the transition out of the speech.

  I am so sorry for your loss. Your father sounds like a remarkable man, and you are doing him a great service by honoring both his generosity and his specific, stubborn humanity.
