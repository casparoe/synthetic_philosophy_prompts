answer: |-
  Here are ten interview questions designed to extract the philosophical tension and human stakes of Evidential Cooperation in Large Worlds (ECL), tailored for your research.

  The first four sections address your specific theoretical requirements. Each includes a primary question and a follow-up anticipatory of her standard defense. The final two questions probe the personal and narrative stakes.

  ### 1. The "Wishful Thinking" Objection
  **Q1:** Critics often dismiss ECL as magical thinking: if I cannot causally influence a copy of myself in a distant sector of the multiverse, acting *as if* I can feels like trying to change the past by wishing it were different. You argue that evidential correlation licenses cooperation where causal decision theory demands defection. But at what point does treating correlation as leverage stop being rational calculation and start being a category error about how agency works in physical space?

  **Q2 (Follow-up):** *I anticipate you'll appeal to Newcomb-like problems to show that causal decision theory leaves money on the table, arguing that rationality is about winning, not about having a clean causal story. But in Newcomb cases, the predictor exists in the agent's past. In ECL, the "other agent" is spacelike separated or modally distant. If I can't even in principle verify the correlation after the fact, doesn't insisting on this "leverage" require a leap of faith that looks indistinguishable from the wishful thinking you're trying to avoid?*

  ### 2. Epistemic Access to Values
  **Q3:** To cooperate evidentially, I need to know what my distant counterparts value so I can compromise on a joint policy. But if these agents are causally inaccessible, I can't observe their preferences or negotiate with them. How do you propose we gather enough evidence to construct a "compromise utility function" without simply projecting our own values onto the void and calling it acausal trade?

  **Q4 (Follow-up):** *You'll likely suggest using symmetric priors—that I should assume other rational agents reason like me, so I can model their values by reflecting on my own. But doesn't this create an echo chamber where "cooperation" just means enforcing my own moral intuitions across the multiverse? If I encounter a counterpart whose values are genuinely alien—say, they value suffering—does your framework force me to compromise with them, or does the "similarity" requirement secretly smuggle in a moral filter that breaks the decision theory?*

  ### 3. Distinctions (Hofstadter & Kant)
  **Q5:** Your view is often conflated with Hofstadter's superrationality or Kant's categorical imperative. Hofstadter relies on logical identity between twins; Kant relies on moral duty. You claim ECL is distinct because it's instrumental rationality in a large world. But if the practical output is identical—"act as if your maxim determines the actions of all similar agents"—why should we care about the architectural difference? Is the distinction merely metaphysical vanity, or does it change the outcome in a edge case?

  **Q6 (Follow-up):** *I expect you to insist the distinction matters because Kantianism binds you even when it costs you, whereas ECL only binds you when it pays off in expected value. But if the "payoff" relies on an infinite universe where the stakes are always effectively infinite, doesn't the instrumental pressure become indistinguishable from moral obligation? At what point does "it is rational to cooperate" become semantically identical to "it is wrong to defect," rendering your distinction useless for a character trying to decide whether to break the rules?*

  ### 4. Pascal's Mugging and Infinite Worlds
  **Q7:** ECL relies heavily on the world being sufficiently large or infinite to guarantee the existence of correlated agents. But in an infinite space, tiny probabilities of enormous payoffs can dominate expected utility calculations—the Pascal's Mugging problem. If there's a non-zero probability of a god-like agent who can reward my cooperation with infinite value, doesn't ECL compel me to ignore all local, finite human concerns to service that tiny probability?

  **Q8 (Follow-up):** *You will probably propose a complexity penalty or a measure-based cutoff to dampen the influence of extremely complex, high-payoff hypotheses. But isn't choosing that cutoff arbitrary? If you tune the penalty just enough to avoid the Mugging, aren't you essentially reverse-engineering the decision theory to match your pre-existing intuition about what counts as "reasonable," rather than letting the math of the infinite world speak for itself?*

  ### 5. The Human Cost (Narrative Angle)
  **Q9:** You've built a career arguing that we are never truly alone, that our decisions echo across causally disconnected regions of reality. That sounds comforting, but it also sounds incredibly isolating. Does living with the constant cognitive burden of calculating acausal trade-offs make it harder to form genuine, causal connections with the people physically standing in front of you?

  ### 6. The Risk of Error
  **Q10:** If your protagonist is wrong—if causal decision theory is actually correct and evidential cooperation is a delusion—she has potentially spent her life sacrificing real, causal good for the sake of phantom counterparts. What is the specific evidence that would finally convince you to abandon ECL, and have you ever come close to finding it?
