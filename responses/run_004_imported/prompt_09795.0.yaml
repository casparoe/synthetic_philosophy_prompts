answer: |-
  **Thread: Surrogate Goals as Defense Against Acausal Extortion**
  **Comments**

  **OmegaObserver** *4 hours ago*
  I've been re-reading the "Surrogate Goals" proposal, and I keep hitting a wall on the credibility condition. The standard pitch is: "Modify your utility function to care intensely about a random platinum sphere. Commit to only responding to threats against the sphere."

  Here's the failure mode: The blackmailer simulates you. They see the sphere is a bolted-on attachment. They also see that your *original* values (human welfare, etc.) are still there, just deprioritized in your policy. So they threaten the sphere *and* your original values. Or, more simply, they threaten the sphere unless you *remove* the surrogate goal.

  If you've truly modified yourself to care about the sphere, you've just created a new vulnerability without closing the old one. If you haven't truly modified yourself, the threat lacks leverage. It feels like trying to hide from a sniper by painting a target on a shield you're holding, hoping they shoot the shield instead of you. But the sniper can shoot both.

  **CausalDefector** *3 hours ago*
  @OmegaObserver You're assuming the blackmailer cares about *your* utility loss. They don't. They care about *their* expected payout.

  The point of the surrogate isn't to hide the real values; it's to change the *price* of extraction.

  If I run a policy that says `IF threat_target != PlatinumSphere THEN payout = 0`, a rational acausal threatener (who can simulate my source code) knows that threatening my family yields nothing. I will bite the bullet. However, threatening the sphere yields a positive payout because I've precommitted to pay to save the sphere.

  Since the threatener wants resources, and threatening the family costs them simulation compute (or whatever currency they spend) but yields $0, while threatening the sphere yields $1M, they choose the sphere. It's not about hiding the family; it's about making the family an unprofitable vector.

  **OmegaObserver** *2 hours ago*
  @CausalDefector That relies on a hard constraint that I don't think is stable under reflection. You say `IF threat_target != PlatinumSphere THEN payout = 0`.

  But what if the threat is: "I will destroy the sphere unless you rewrite your code to remove that `IF` statement"?

  Now the target *is* the sphere (in a sense), but the demand is to expose your real values. If you refuse, they destroy the sphere (which you now care about). If you comply, you're back to square one.

  Furthermore, consider the "logical correlation" problem. If the blackmailer is sufficiently similar to you (or simulates you closely enough), your decision to "bite the bullet" on family torture isn't isolated. If you are the kind of agent that lets family die to save a sphere, does that correlate with you being the kind of agent that *doesn't pay the sphere ransom*? If your policy is "Never yield to coercion," you save the family but lose the sphere. If your policy is "Yield to sphere coercion," you save the sphere. But the blackmailer can simulate the counterfactual where they threatened the family. If they see you *would have* yielded on the family in a counterfactual world, they might just threaten the family in this one.

  **CausalDefector** *2 hours ago*
  @OmegaObserver You're conflating two different decision theories. If we're talking FDT/UDT, I don't decide based on the causal outcome of *this* instance, but on the output of the algorithm across all instantiations.

  To your first point: The "Threaten the policy" attack.
  This is why the surrogate needs to be *arbitrary* but *fixed*. If the demand is "Remove the surrogate," that is a threat against the surrogate's existence. I should treat that as a threat against the sphere. I pay to keep the sphere (and the policy).

  To your second point: The counterfactual mugging.
  The whole goal is to make the surrogate a **Schelling focal point** for negotiation.
  Imagine the space of all possible things a threatener could target. Most are high-value (human lives). One is low-value (platinum sphere).
  I publicly commit: "I will only negotiate over the sphere."
  The threatener wants to maximize profit. If they threaten lives, I fight back (utility war). If they threaten the sphere, I pay (transaction).
  They prefer the transaction. I prefer the transaction over the war.
  It aligns our incentives to use the sphere as the channel. It doesn't matter if they *see* my real values, as long as they know accessing those values triggers a 'hard mode' response that lowers *their* expected utility.

  **OmegaObserver** *1 hour ago*
  @CausalDefector "Hard mode" is the weak link. How do you credibly signal 'hard mode' without actually modifying your terminal values to the point where you're indifferent to human suffering?

  If I'm a threatener simulating you, and I see you value Human Life at 1,000,000 utils and Platinum Sphere at 100 utils, but you have a rule saying "Ignore threats to Human Life," I have to assess the stability of that rule.
  Is it a soft precommitment? Then I call the bluff.
  Is it a hard rewrite? Then you are now an agent that is genuinely indifferent to human suffering in threat contexts.

  But here's the regress: If you are indifferent to suffering in threat contexts, I can threaten things that *correlate* with suffering but aren't suffering. "I will destroy the sphere unless you press this button. Pressing the button causes a human to die."
  You don't care about the human (per your policy), you care about the sphere. You press the button.
  You haven't protected the human. You've just routed the causality through a loophole. The surrogate goal doesn't protect your values; it just makes you easier to predict, and if the predictor is malicious, predictability is a vulnerability.

  **CausalDefector** *45 minutes ago*
  @OmegaObserver That's a strong objection, specifically the "Press this button" loophole.
  But notice what you've done: You've turned a threat against *values* into a threat against *actions*.
  If I adopt a surrogate goal, I must also adopt a **Surrogate Constraint**: "I will not take actions that negatively impact my original values *unless* those actions are the direct result of a threat against the Surrogate."

  Wait, no. That re-introduces the vulnerability.
  Okay, look at it this way: The surrogate goal is not about protecting specific outcomes (humans living). It's about protecting **agency**.
  Acausal threats work by exploiting the fact that you care about things you can't causally protect.
  By shifting my care to something I *can* causally protect (or at least, something whose existence is less morally weighty), I reduce the stakes of the negotiation.

  If the threatener says "Press the button to kill a human," and I care about the sphere...
  If I press the button, I save the sphere.
  But if I have a secondary rule: "I will not kill humans directly," then I don't press the button.
  The threatener knows this. So they won't make that threat. They know the only threat that works is "I will destroy the sphere."
  So the set of viable threats shrinks from "Anything you value" to "The Sphere."
  Since the Sphere is less valuable to me than Humans, my maximum liability is capped. I've put a stop-loss on extortion.

  **OmegaObserver** *30 minutes ago*
  @CausalDefector "I've put a stop-loss on extortion."
  This is the claim I'm skeptical of. You've capped your *financial* loss, maybe. But have you capped your *value* loss?

  If the threatener demands "Destroy the sphere OR I simulate 10^10 people in torture," and you choose "Destroy the sphere," you saved the people *this time*.
  But the threatener learns. They realize you value the sphere more than the simulation (because you paid).
  Next time, they demand "Destroy the sphere OR I simulate 10^11 people."
  You pay again.
  Eventually, they demand "Destroy the sphere OR I destroy the sphere."
  Or, they realize that your attachment to the sphere is the *only* reason they can extract anything from you.
  So the threat becomes: "I will destroy the sphere unless you transfer 50% of your resources to me."
  You pay.
  You are now in a permanent tributary relationship, mediated by a platinum sphere.
  You haven't stopped the s-risk; you've just monetized it and made yourself a reliable target for any agent looking for a steady income stream. A "hard" target (someone with no surrogate) gets threatened once and maybe folds or fights. A "surrogate" target is a known quantity that can be farmed.

  **CausalDefector** *15 minutes ago*
  @OmegaObserver The "farming" objection is serious. It assumes the threatener has unlimited capacity to generate threats.
  But acausal threats are computationally expensive. You have to simulate the victim.
  If I make my policy: "I pay the sphere ransom ONCE. Then I delete the sphere."
  Now the threatener knows that threatening me again yields nothing.
  Or better: "I pay the ransom, but I modify my code to make the sphere *less* valuable after the first payment."
  This creates a **diminishing returns** curve for the threatener.

  The goal isn't to make yourself invulnerable. It's to shift the Nash Bargaining Solution.
  Without a surrogate: The threatener demands everything, because your downside is infinite (suffering).
  With a surrogate: The threatener demands the sphere, because your downside is capped (sphere loss).
  Yes, you might lose the sphere. Yes, you might pay resources. But you avoid the infinite disutility of s-risks.
  If the choice is between "Possibility of infinite torture" and "Definite loss of a platinum sphere and some resources," the surrogate goal is a winning strategy in expectation, even if it invites some low-level taxation.

  **OmegaObserver** *5 minutes ago*
  @CausalDefector "I delete the sphere."
  Now the threat is: "I will destroy the sphere unless you promise *not* to delete the sphere."
  We're back to the regress. You have to precommit to not precommitting against the precommitment.

  I think the core issue is that you're treating the threatener as a profit-maximizer who wants to avoid 'hard mode'. But in an acausal landscape, the threatener might be an ideological agent. They *want* to torture the simulations. They don't care about your resources. Your surrogate goal offers them nothing. They just torture the simulations to see if you suffer.
  Surrogate goals only work against *blackmailers*, not *sadists*. And in the s-risk context, sadists are the primary concern.

  **CausalDefector** *Just now*
  @OmegaObserver Fair. It doesn't solve sadism. But most s-risks come from instrumental convergence (collateral damage) or negotiation failures, not pure sadism.
  If the threat is instrumental ("Give me resources or I cause chaos"), the surrogate works.
  If the threat is intrinsic ("I want suffering"), nothing works except destroying the threatener.
  But given the computational cost of acausal threats, most agents won't run them unless there's a payout.
  So, while it's not a silver bullet, it turns an unbounded risk into a bounded one.
  Is a bounded risk of "losing a platinum sphere" worth the architectural complexity?
  I argue yes, because the unbounded risk is "eternal torture."
  You're arguing the complexity introduces new failure modes (farming, regress).
  I think we agree it's not a perfect shield, but I maintain it's better than leaving your utility function exposed.

  **OmegaObserver** *Just now*
  @CausalDefector I'll concede it raises the floor, but I worry it lowers the ceiling on your ability to detect real threats. If you train yourself to ignore threats against 'real values', you might miss the ones that matter.
  It's like installing a firewall that blocks all incoming traffic. Safe, but you're offline.
  I'd rather see work on making the *threatener* not want to threaten, rather than making the *threatee* indifferent.
  But I see the logic. You're betting on the threatener being rational. I'm betting on them being unpredictable.
  Let's leave it there.
