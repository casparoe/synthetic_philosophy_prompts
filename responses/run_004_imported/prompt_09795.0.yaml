  okay this ones a bit of a rabbit hole but i've been reading old effective altruism/alignment forum posts about 's-risks' and found this idea of 'acausal threats' -- basically blackmail from agents you'll never actually causally meet, where the whole threat works just off them predicting you and you predicting them predicting you (kinda newcomb's-problem flavored). the proposed fix that got me is 'surrogate goals': an agent bolts some totally made up goal onto its values (there was an example about caring a ton whether a specific-sized platinum sphere exists, lol) so that a threat lands on the fake goal instead of the real one. i get why that'd be nice if it worked, but i cant shake the feeling a smart enough threatener sees through it -- either the fake goal is obviously fake (so why would threatening it work on you) or you have to actually make yourself care about it for real, in which case haven't you just built a brand new real thing to threaten? can you write me a dialogue, like two decision theorists going at it in a comment thread, where one genuinely defends surrogate goals as a good practical strategy and the other thinks it collapses once you push on it? i want real back and forth on the hard parts (the credibility problem, whether it regresses, whether it only works against threateners that aren't that smart), not both sides just restating the summary version, and neither one should obviously win from the start.
