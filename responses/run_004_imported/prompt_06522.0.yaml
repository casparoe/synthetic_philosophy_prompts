answer: |-
  Friends, family, colleagues.

  We are gathered here with a split vision. Half of this room spent thirty years debating the architecture of her mind; the other half spent thirty years living inside the warmth of her heart. If she were here, she would be impatient with the distinction. She would tell us that knowing her arguments and knowing her are the same task: paying attention to the person standing in front of you.

  For three decades, I worked beside her. I know that for many of you, the technical terms of her life's work are a foreign language. But the truth she defended was not written in journals; it was written in how she sat at this dinner table, how she argued in that seminar room, and how she expects us to stand here today.

  She taught us that to love someone, or to work with them, or to grieve them, is not to analyze them. It is to stand in a relationship with them. It is to accept that when someone hurts us, we are allowed to feel hurt. When someone helps us, we are allowed to feel thankful. These are not judgments we need to justify by proving that the universe is undetermined, or that she was a free agent in some metaphysical sense. They are simply the price of admission for being human together.

  She would be furious with me right now if I began to explain her away. She hated the soft voice of the eulogist that says, "Oh, don't mind that sharpness, she didn't mean it," or "She was tired," or "That was just how her brain worked." She hated being treated as a mechanism that had finally broken down. She wanted to be held to account.

  So, I will not offer you an excuse for her. I will offer you a memory.

  There was a dinner, five years ago. I was going through a difficult divorce. I was struggling to find the words to explain my pain, stumbling over my feelings, saying things that were emotionally true but logically messy. She cut me off. She corrected my reasoning. She pointed out a contradiction in my grief and dismissed my worry as irrational.

  It stung. It stung deeply. In that moment, I felt a coldness from her. I felt that she valued the precision of the argument more than the welfare of her friend. I resented it. I think it is important to say that I resented it. To pretend otherwise would be to treat her like a child, or a patient, rather than the formidable adult she was. She made a demand on me to be rational, and I made a demand on her to be kind. She failed that demand.

  If I were to take the "objective attitude" toward her now, I would say, "She was conditioned to prioritize logic," or "Her defense mechanisms were triggered." That would absolve her. It would also discard her. It would place her outside the community of people who can be asked for more.

  I do not discard her. I hold her to it. I hold her responsible for that coldness, just as I hold her responsible for the warmth that followed. Because the next day, she called me. She did not say, "I was stressed." She did not say, "I didn't mean it." She said, "I was wrong. I valued the point over the person. I am sorry."

  She offered an apology, not an explanation. And because she offered it as one person to another, acknowledging the quality of her will toward me, the resentment faded. It was replaced by forgiveness. Not because I decided her actions were causally determined and therefore excusable, but because I valued our friendship more than I valued my grievance. That is how relationships work. That is the ground we stand on.

  To her family: You know this side of her best. You know that her love was not a passive state. It was active. It was demanding. She expected you to be yourselves, fully and courageously. When you were kind, she thanked you. When you were careless, she told you. She treated you as agents, capable of good and capable of harm. That is the highest respect one person can show another.

  To my colleagues: We have lost the sharpest defender of the participant stance we have ever known. She reminded us that skepticism about responsibility is a luxury of the study, not of the living room. She showed us that we do not need a guarantee from the universe that we "could have done otherwise" to justify our tears. We cry because we have lost someone we counted on. We give thanks because we were given something we did not earn.

  I am grateful to her. I am grateful for the thirty years of debate, for the corrections, for the silences, and for the laughter. I do not need to know if her kindness was determined to feel the warmth of it. I feel it. It is here.

  So, I will not say "Rest in Peace" as if she is a machine that has been powered down. I will say what we owe to a person who taught us how to stand toward one another.

  Thank you. We miss you. And we forgive you for leaving us before the argument was finished.
