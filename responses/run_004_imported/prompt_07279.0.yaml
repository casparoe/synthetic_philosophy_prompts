      *   *Universalism vs. Particularism:* Frege's logic applies to *all* rational beings. But who counts as a rational being? If his diary suggests Jews are "alien," does his universalism have a hidden exclusion clause? Or is the universalism a reaction *against* his particularism (a compensation)?

