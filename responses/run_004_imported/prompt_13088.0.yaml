answer: |-
  **MEMORANDUM**

  **TO:** EA Club Discretionary Giving Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on FY24 Allocation: Epistemic Robustness vs. High-Variance EV

  **Executive Summary**

  After reviewing the proposals for this year's $3,000 discretionary pool, I am casting my vote to allocate **100% of funds to a GiveWell Top Charity (specifically the Against Malaria Foundation).**

  I know this does not resolve the deadlock on its own, but I want to be clear about *why* I am breaking the tie this way. This is not a vote based on the intuition that bednets are "obviously good" while AI safety is "speculative." Rather, this is a vote based on how we handle the **cluelessness objection** we've been discussing in seminar.

  My position is that while neither option escapes the problem of unforeseeable consequences, the AI safety proposal is significantly more vulnerable to *complex* cluelessness than the bednet proposal. Furthermore, "funding the measurable" is not just a comforting heuristic; in the context of a small discretionary fund, it is a proxy for causal proximity and epistemic stability.

  Below is the case for why I am rejecting the AI safety allocation, followed by my defense of the GiveWell allocation that takes the philosophical objections seriously.

  ***

  **1. The Strongest Case for the AI Safety Allocation (The Rejected Option)**

  I want to start by steelmanning the argument for the small AI-safety research org, because I believe my colleagues advocating for it are correct about the *structure* of the value, even if I disagree on the *actionability*.

  The argument rests on the asymmetry of impact. If we accept the premise that misaligned AGI poses an existential risk, the expected value (EV) of mitigating that risk is not just high; it is lexically superior to saving current lives. The "longtermist" calculation suggests that even if the probability of our $3,000 making a difference is vanishingly small (e.g., 0.0001%), the magnitude of the stake (all future generations) swamps the certainty of saving a few dozen lives today.

  From this perspective, prioritizing bednets because they are "measurable" is a form of myopia. It privileges the *visibility* of the impact over the *importance* of the impact. If we take consequentialism seriously, we should be willing to act on high-uncertainty, high-stakes probabilities when the downside of inaction is extinction. To demand the same level of verification for AI safety as we do for bednets is to impose an epistemic standard that existential risk mitigation cannot, by definition, meet.

  This is a principled stance. It argues that when the stakes are infinite (or near-infinite), our usual heuristics for uncertainty should collapse.

  ***

  **2. The Cluelessness Objection as a Decision Constraint**

  However, this semester's reading on cluelessness (specifically Lenman and Greaves) forces us to interrogate whether we can actually calculate that EV.

  Lenman's point is that the downstream consequences of any action are chaotic and unknowable. If we kill baby Hitler, we might prevent WWII, but we might also prevent the technological or social conditions that lead to a stable future. The causal chain is too long to trace.

  Greaves helpfully distinguishes between **simple cluelessness** (where we have no reason to think the unforeseen effects lean one way or the other, so they roughly cancel out) and **complex cluelessness** (where we have reason to think the unforeseen effects are systematically biased, but don't know how to weigh them).

  This distinction is where the AI safety proposal falters relative to the bednet proposal.

  **3. Why Bednets Are More Robust to Complex Cluelessness**

  My hesitation in voting for bednets was that they are not immune to Lenman's objection. Saving a life changes population demographics, economic labor supplies, and local political dynamics. These are long-term consequences we cannot foresee.

  However, under Greaves's framework, the unknowns surrounding bednets lean heavily toward **simple cluelessness**. We have no specific reason to believe that saving *this* specific child from malaria, rather than *that* one, will systematically lead to a worse future. The unforeseen effects are likely random noise. Therefore, we are epistemically permitted to bracket them and focus on the foreseeable good (a life saved).

  The AI safety proposal, conversely, is rife with **complex cluelessness**. We have specific reasons to suspect that the unforeseen effects of funding AI research might be systematically negative.
  *   **Dual-Use Risk:** Research intended for safety might inadvertently clarify capabilities, accelerating the timeline to dangerous AI.
  *   **False Security:** Successful safety work might make developers overconfident, leading to riskier deployment.

  Unlike the bednet case, we cannot bracket these unknowns as a "wash." We have positive reason to think the intervention might tilt the outcome negatively, but we lack the model to quantify that risk. When you have complex cluelessness, the Expected Value calculation doesn't just become uncertain; it becomes **undefined**. You cannot multiply a probability by a value when you don't know the sign of the outcome.

  **4. Is "Fund the Measurable" Just a Heuristic?**

  The argument for GiveWell is often dismissed as "funding what we can measure because it makes us feel good." I want to argue that in the context of a $3,000 student fund, it is a principled response to epistemic limits.

  It is not that we ignore the future. It is that we prioritize **causal proximity**.
  *   **Bednets:** The causal chain from *dollars* → *nets* → *lives saved* is short and empirically verified. The "clueless" zone begins *after* the life is saved.
  *   **AI Safety:** The causal chain from *dollars* → *research* → *policy/technical insight* → *risk reduction* is long and unverified. The "clueless" zone encompasses the *mechanism of the intervention itself*.

  Furthermore, we must consider **marginal utility**. $3,000 is a drop in the bucket for an AI safety org; it is unlikely to be the marginal dollar that solves alignment. However, $3,000 buys roughly 1,000 bednets. In the context of the AMF's budget, that is a discrete, completed intervention. Given that our EV calculations are unstable due to cluelessness, rational choice theory suggests we should maximize the **floor** of known good rather than chasing the **ceiling** of speculative good, especially when the speculative good is vulnerable to complex cluelessness.

  **5. Conclusion**

  I am not voting for bednets because I believe they are free from long-term uncertainty. Lenman has convinced me that no act is.

  I am voting for bednets because the uncertainty surrounding them is largely *simple* (random noise), whereas the uncertainty surrounding the AI safety intervention is *complex* (systematic risk of harm). When we cannot know the future, we should prioritize interventions where the link between input and immediate output is robust, and where we have no reason to suspect the hidden long-term effects are systematically negative.

  We cannot solve the cluelessness problem. But we can choose the option that remains defensible even if we admit we are clueless about the year 2100.

  **Vote:** $3,000 to Against Malaria Foundation (via GiveWell).
