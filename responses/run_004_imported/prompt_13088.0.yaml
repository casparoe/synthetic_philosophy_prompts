          *   *Argument:* It's not about *escaping* cluelessness, but about *truncating* the causal chain where our epistemic access is strongest.
          *   *Greaves's Simple vs. Complex:* Argue that for bednets, the unknowns lean closer to "simple" (random noise) or are bounded, whereas AI safety is inherently "complex" (systematic, directional uncertainty we can't model).
          *   *Robustness:* $3,000 in AI safety is a drop in the bucket regarding the actual variable (model capabilities/policy). $3,000 in bednets is a significant chunk of *that specific intervention's* budget.
      *   **Addressing the "Measurable Heuristic" Charge:** Is "fund the measurable" just comforting? Argue that it's a proxy for "causal proximity." We aren't ignoring the future; we are prioritizing causal links we can verify over those we must speculate on.
