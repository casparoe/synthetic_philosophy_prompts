answer: |-
  Here are nine questions designed for a PhD-level colloquium. They are structured to be respectful but rigorous, moving quickly past introductory summaries to the metaphysical and methodological tensions in strong emergentism.

  ### 1. The Causal Exclusion Dilemma
  **Question:** Jaegwon Kim's exclusion argument suggests that if the physical base is causally sufficient for a physical effect, any emergent property is either redundant (leading to systematic overdetermination) or inert (epiphenomenalism). You reject both horns, but could you specify the *mechanism* of non-competitive causation in your view? If the micro-physical constituents are already doing all the work required by the laws of physics, in what precise sense is the emergent property adding *new* causal force rather than merely organizing the existing force?

  **Follow-up:** If you reply that causation operates at different "levels" and thus doesn't compete, I'd press: How do these levels interact without violating the conservation of energy or momentum? If the emergent property directs the physical parts, does that intervention constitute an influx of energy from outside the physical system?

  ### 2. Multiple Realizability vs. Causal Novelty
  **Question:** You often cite multiple realizability (MR) as evidence for the autonomy of higher-level kinds. However, critics argue that MR only demonstrates an epistemic gap in our mapping procedures, not an ontological gap in causal powers. A property can be multiply realizable yet still be metaphysically fixed by its realizers. How do you bridge the gap from "one higher-level kind maps to many physical kinds" to "the higher-level kind possesses powers absent in all those physical kinds"?

  **Follow-up:** If you argue that the higher-level power is distinct because it persists across different physical substrates, wouldn't a reductionist reply that what persists is just a functional role defined by the physical interactions of each specific substrate, rather than a *sui generis* power inherent to the higher level?

  ### 3. Anderson's "More Is Different"
  **Question:** You frequently invoke P.W. Anderson's *More Is Different* to support your position. However, Anderson's primary claim is often read as methodological: that deriving higher-level regularities from lower-level laws is practically impossible due to complexity and symmetry breaking, not that it is impossible in principle. Where do you draw the line between Anderson's practical intractability and your claim of metaphysical novelty? Is your emergentism compatible with a Laplacian demon who could, in principle, predict the emergent behavior from the micro-state?

  **Follow-up:** If you say the demon *could not* predict it even with infinite computing power, are you positing a break in the nomological chain? If so, doesn't that render the higher-level laws fundamentally discontinuous with the laws of physics in a way that makes unified science impossible?

  ### 4. Conservation Laws and Downward Causation
  **Question:** A standard objection from the philosophy of physics is that strong downward causation threatens conservation laws. If a mental or biological state constrains the motion of physical particles, it seems to alter their trajectories in ways not determined by prior physical states and forces. Do you view conservation laws as strict constraints that emergent causation must respect, or do you view them as emergent regularities themselves that can be locally violated by higher-level powers?

  **Follow-up:** If you say conservation laws are themselves emergent, does this imply that at the fundamental level, energy is not conserved? If so, how do you reconcile this with the empirical success of particle physics, which assumes strict closure at that level?

  ### 5. The "Brute Fact" Objection
  **Question:** If emergent causal powers are not fixed by the arrangement of physical parts, the connection between the base and the emergent property seems to be a brute fact of nature. Does your view entail that there are unexplainable connections in nature? If science aims to explain *why* certain bases give rise to certain powers, does your ontology force us to accept a permanent limit on scientific explanation?

  **Follow-up:** If you argue these connections are nomologically necessary but not metaphysically necessary, how do we discover these necessities? Is it purely empirical, or does it require a new kind of metaphysical intuition distinct from standard scientific inference?

  ### 6. Consciousness vs. Biological Emergence
  **Question:** You group consciousness alongside biological properties as candidates for strong emergence. However, many who accept strong emergence for consciousness (due to the hard problem) remain reductionists about biology. Do you think the argument for strong emergence stands or falls together for both domains? If biology is strongly emergent, do we need to posit *sui generis* causal powers for every level of biological organization (cells, organs, organisms), or is there a threshold where strong emergence kicks in?

  **Follow-up:** If there is a threshold, what defines it? Is it complexity, or is it specifically the presence of intentionality or phenomenology? If it's the latter, doesn't that retreat to a form of dualism rather than a general theory of emergentism?

  ### 7. Supervenience and Variation
  **Question:** Most non-reductive physicalists accept supervenience: there can be no difference in higher-level properties without a difference in lower-level properties. Does your strong emergentism reject supervenience? If you accept it, how can the higher-level property have independent causal power if it cannot vary independently of the physical base? If you reject it, does this not imply the possibility of "ghostly" changes in the higher level with no physical trace?

  **Follow-up:** If you accept supervenience but deny that the base *fixes* the powers of the emergent property, aren't you positing a modal gap where the physical determines the *existence* of the property but not its *causal profile*? How is that relation coherent?

  ### 8. The Explanatory Role of Emergent Laws
  **Question:** If emergent properties have their own causal powers, they presumably obey their own fundamental laws. How do these emergent laws relate to physical laws? Are they additive? Do they override physical laws in specific contexts? If they never override physical laws, in what sense are they distinct causal forces rather than just descriptive summaries of complex physical interactions?

  **Follow-up:** If you claim they constrain physical laws without overriding them (e.g., by setting boundary conditions), isn't that compatible with a standard physicalist account where boundary conditions are still physically specified? What makes the *source* of those conditions ontologically distinct?

  ### 9. Falsification and Theoretical Defeat
  **Question:** To close, I'd like to ask about the empirical or theoretical conditions under which you would abandon strong emergentism. We know that a failure to derive higher-level laws from lower-level ones is consistent with your view (since you expect such failures). So, what positive finding would count against you? Would a successful, complete simulation of a biological system that replicated all its causal powers using only micro-physical rules falsify your position, or would you argue the simulation merely mimics the powers without instantiating them?

  **Follow-up:** If you say a simulation wouldn't count because it lacks the "real" ontology, does this render your position immune to empirical falsification? If the view is not empirically defeatable, what kind of theoretical evidence would force you to concede that physical closure is sufficient after all?
