answer: |-
  You are right to trust your ear. That shift in mood is not mere cadence; it changes the logical stakes of the argument. In linguistics and philosophy, this is often called the **Indicative/Counterfactual Distinction**, but you don't need the jargon to use it. You have intuitively spotted that one sentence looks backward at evidence, while the other looks sideways at possibilities.

  Here is an original pair constructed within your mill-fire setting, followed by the explanation of why they diverge, and a tool for building more.

  ### The Example Pair

  **Context (The Facts of the Story):**
  The mill burned down. The investigation confirms the wiring in the loom-room was faulty and sparked. Merrick was sacked that week, was furious, but actually went straight to a pub and has an alibi for the night of the fire. He had no matches, no accelerant, and no plan.

  **Sentence A (Indicative):**
  > "If the wiring **didn't** cause the fire, Merrick **did**."

  **Sentence B (Counterfactual):**
  > "If the wiring **hadn't** caused the fire, Merrick **would have**."

  ### The Truth-Value Divergence

  A competent speaker will judge these two sentences differently based on the facts above.

  *   **Sentence A is acceptable (True/Plausible).**
      Even though we know the wiring *did* cause it, a character can say this to express a deduction about the *actual* event. It means: "We know the mill burned. We know there are only two viable suspects. Therefore, in the actual world, the cause is either Wiring or Merrick. If you rule out Wiring, the only remaining slot for the cause is Merrick." It treats the fire as a fixed fact that *must* have a parent.
  *   **Sentence B is false.**
      This sentence asks us to imagine a different past where the wiring was safe. In that imaginary scenario, would Merrick have burned the mill? No. Because in reality, Merrick was at the pub with no plan. If the wiring hadn't sparked, the mill would likely still be standing. Sentence B claims Merrick was *poised* to burn it, waiting for the wiring to fail so he could take over. That is a lie about Merrick's intent and capacity.

  **The Test:**
  If you were betting money:
  *   On **Sentence A**, you win if the fire happened and no third cause (like lightning) is found.
  *   On **Sentence B**, you only win if Merrick was actually carrying a box of matches in his pocket, ready to strike if the wiring failed.

  ### The Plain Working Explanation

  To build more of these pairs, you need to understand what "work" each mood is doing. Do not think of them as "tenses." Think of them as **directions of inquiry**.

  **1. The Indicative ("If it wasn't...") is a Detective.**
  The Indicative mood accepts the **result** as fixed. The mill *is* burned. The Kennedy assassination *did* happen. The window *is* broken.
  *   **Function:** It sorts through the evidence of the *actual* world to find the cause.
  *   **Logic:** "Given that the event occurred, which of these available causes is responsible?"
  *   **When to use it:** When your characters are arguing about *blame* or *history*. They are trying to close the case file.
  *   **The Trap:** It implies the event was inevitable, but only because it already happened. It doesn't claim the alternative cause was *ready*; it just claims it's the only other name on the list.

  **2. The Counterfactual ("If it hadn't been...") is a Time-Traveler.**
  The Counterfactual mood asks you to **undo** the result. It asks you to imagine the wiring was safe, or Oswald stayed home.
  *   **Function:** It tests the **disposition** or **capacity** of the alternative cause.
  *   **Logic:** "If we remove the actual cause, does the alternative cause have enough power/intent to produce the result anyway?"
  *   **When to use it:** When your characters are arguing about *fate*, *character*, or *danger*. They are asking if Merrick was a ticking time bomb regardless of the wiring.
  *   **The Trap:** It requires the alternative cause to be "loaded." If Merrick wasn't actually going to do it, the counterfactual is false, even if he is the only other suspect.

  ### How to Build Your Own Pairs

  To generate this tension in other scenes, follow this three-step recipe:

  1.  **Establish a Fixed Result:** Something happened (a spill, a fight, a missed train).
  2.  **Identify the Actual Cause:** Let's say, a slippery floor.
  3.  **Identify a "Lazy" Alternative:** A person who *could* have caused it but didn't (e.g., a clumsy waiter who happened to be walking by).

  **Construct the Indicative (The Detective):**
  *   "If the floor wasn't slippery, the waiter dropped it."
  *   *Truth:* Plausible. The tray *is* on the floor. If the floor wasn't the cause, the waiter is the only other explanation for the mess.

  **Construct the Counterfactual (The Time-Traveler):**
  *   "If the floor hadn't been slippery, the waiter would have dropped it."
  *   *Truth:* False. The waiter was walking carefully. If the floor was dry, the tray would be safe. This sentence accuses the waiter of a clumsiness he didn't show.

  ### Application to Your Revision

  When your characters argue across the decades, you can use this shift to show how their relationship to the truth changes:

  *   **Early in the book (The Investigation):** Characters use the **Indicative**. They are trying to solve the puzzle. *"If it wasn't the wiring, it was Merrick."* They are looking for the single truth of the actual fire.
  *   **Later in the book (The Legend):** Characters use the **Counterfactual**. They are mythologizing Merrick. *"If it hadn't been the wiring, he would have done it anyway."* They are no longer talking about the fire; they are talking about Merrick's nature. They are claiming his anger was so potent it would have found a way, even if the wiring was safe.

  The shift from Indicative to Counterfactual marks the moment the town stops caring about *what happened* and starts caring about *what kind of man Merrick was*. That is a profound narrative shift disguised as a grammatical one.
