prompt: |-
  This term I am taking a graduate seminar devoted entirely to Hume's Treatise of Human Nature, and for my final paper I would like to bring Hume into contact with a puzzle from contemporary decision theory that a friend of mine keeps raising in his rational choice reading group: Parfit's hitchhiker, and the associated idea of "rational irrationality." The setup, as I understand it, is this: a motorist stranded and dying of thirst in the desert is offered a ride into town by a driver who will only take him if the driver can be confident that the motorist will hand over an agreed sum of money once they arrive safely, at which point paying no longer serves any further purpose for the motorist, since he has already been rescued. An agent who simply reapplies ordinary means-end reasoning at the moment of truth, weighing only his remaining passions and interests, has every reason to refuse to pay; and a sufficiently perceptive driver, anticipating this in advance, would never have offered the ride at all. Parfit takes this case, and others like it, to show that it can be rational, relative to an agent's own aims, to become disposed to act at some future moment in a way that will not itself be the rational thing to do once that moment actually arrives.

  What I would like your help thinking through is what Hume, using only the resources of his own philosophy, would say about this case, and I would rather you work through the reasoning than just assert a conclusion. On one hand, Hume's account of the will seems to commit him to denying that reason can ever criticize a passion or an action except for resting on a false belief about matters of fact or about the suitability of some means to an end; since paying up, once safe, serves none of the motorist's remaining passions, it is hard to see how Hume's official theory could brand the refusal to pay irrational at all. On the other hand, his treatment of promise-keeping as an artificial virtue, upheld through strict and general rules rather than through case-by-case recalculation of particular advantage, sounds a great deal like the disposition-based solutions that some decision theorists now favor over moment-by-moment reconsideration. Are these two strands of Hume's thought actually in tension when applied to a case like this one, or can the discussion of general rules in Book III be read as already implicit in, rather than in conflict with, the instrumentalism about reason defended in Book II? I would be grateful for a sense of how far Hume can consistently be pushed here, and where, in the end, you think he would have to come down.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Graduate seminar on Hume's *Treatise of Human Nature*. Final paper.
      *   **Topic:** Bringing Hume into contact with Parfit's Hitchhiker (and "rational irrationality" in decision theory).
      *   **The Puzzle:** A motorist needs a ride. The driver will only help if confident the motorist will pay *after* arrival. Once arrived, paying is costly and serves no further instrumental purpose for the motorist. Standard instrumental rationality suggests not paying. But if the driver knows this, they won't help. Thus, it seems rational to *be disposed* to pay, even if paying itself isn't instrumentally rational at the moment of action.
      *   **The Tension in Hume:**
          *   *Book II (Passions/Reason):* Reason is the slave of the passions. Action is irrational only if based on false belief or bad means-end reasoning. Paying after arrival seems to fail means-end reasoning (no benefit left).
          *   *Book III (Morals/Justice):* Promise-keeping is an artificial virtue based on general rules/conventions, not case-by-case utility. This looks like the "dispositional" solution.
      *   **The Task:** Work through the reasoning (don't just assert). Analyze the tension. Determine if Book III's general rules are compatible with Book II's instrumentalism. Where would Hume come down?

  2.  **Deconstruct the Parfit's Hitchhiker Case:**
      *   *Core Issue:* Time inconsistency / Dynamic inconsistency.
      *   *CDT (Causal Decision Theory):* Don't pay. (You're already in town). Result: Die in desert.
      *   *EDT (Evidential Decision Theory) / Dispositional Views:* Be the kind of person who pays. (Your disposition is evidence the driver picks you up). Result: Live and pay.
      *   *Humean Angle:* Is the refusal to pay "irrational"? Or is the *formation* of the character/disposition the locus of rationality?

  3.  **Analyze Hume's Book II (Instrumentalism):**
      *   *Famous Quote:* "Reason is, and ought only to be the slave of the passions."
      *   *Criteria for Irrationality:*
          1.  False belief about existence of object.
          2.  False belief about causal efficacy (means-end).
      *   *Application to Hitchhiker:* Once in town, the passion is self-preservation (satisfied) and keeping money (active). Paying money does not satisfy self-preservation (already done). So, paying seems to violate means-end efficiency *at that moment*.
      *   *Problem:* If Hume sticks strictly to momentary instrumentalism, the motorist *should* defect. But Hume knows society requires cooperation.

  4.  **Analyze Hume's Book III (Justice and Artificial Virtues):**
      *   *Justice:* Not natural. Based on convention.
      *   *Promise-keeping:* "The mystery of the invention." A linguistic act that creates a motive (sense of duty/interest in the system).
      *   *General Rules:* We follow rules because if we made exceptions for every case where immediate utility seemed low, the whole system would collapse.
      *   *Key Insight:* Hume explicitly argues against "sensible knaves" who think they can cheat when undetected or when immediate gain is high. He argues that maintaining the *habit* or *disposition* is more useful in the long run than optimizing every single transaction.

  5.  **Synthesize: Bridging Book II and Book III:**
      *   *Is there a contradiction?* Superficially, yes. Book II says optimize for passions *now*. Book III says follow rules even if immediate utility is lost.
      *   *Resolution:* Hume's theory of *character* and *indirect utility*.
      *   *The "Passion" involved:* It's not just the immediate desire for money. It's the "calm passion" for long-term interest and the socially cultivated sentiment of honesty.
      *   *Re-evaluating "Means-End":* If the "end" is a flourishing life within society, the "means" is having a trustworthy character. You cannot toggle trustworthiness on and off case-by-case without damaging the character itself.
      *   *Hume on Resolution:* Hume would likely argue that the motorist who refuses to pay has failed to cultivate the necessary artificial virtue (fidelity). The irrationality lies in *not having the disposition earlier*, not necessarily in the moment-by-moment calculation (though Hume might say the calculation at the moment is flawed because it ignores the long-term harm to one's character/reputation).

  6.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. State the thesis: Hume can accommodate the hitchhiker puzzle, but not by accepting "rational irrationality" in the Parfitian sense. Instead, he reframes the locus of rationality from the *act* to the *character/convention*.
      *   *Step 1: The Book II Challenge.* Detail the instrumentalist constraint. If reason judges means to ends, and the end (survival) is secured, paying is inefficient. A strict Book II reading suggests the motorist *ought* to defect.
      *   *Step 2: The Book III Solution (Artificial Virtues).* Introduce Justice and Promises. Hume's key move: We invent rules to solve coordination problems. The rule "keep promises" is useful *generally*, even if useless *particularly*.
      *   *Step 3: Reconciling the Two.* How does Book III fit Book II's instrumentalism?
          *   *Indirect Utility:* The utility isn't in the single act, but in the *system*.
          *   *Psychological Mechanism:* How do we motivate the agent to pay? Hume posits a "sense of duty" or a cultivated sentiment. This sentiment becomes a *new passion*.
          *   *Reframing the Hitchhiker:* If the motorist has the virtue of fidelity, they *want* to pay. Reason serves this passion. If they don't have it, they are a "sensible knave."
      *   *Step 4: The "Sensible Knave" Objection.* Hume addresses this in the *Enquiry* (and implied in *Treatise*). The knave thinks he gains by cheating. Hume argues he loses peace of mind and risks the collapse of the convention he relies on.
      *   *Step 5: Decision Theory Comparison.* Parfit says it's rational to be disposed to do the irrational act. Hume says it's rational to cultivate a disposition that makes the act *rational* (because the disposition creates a new motive). Hume naturalizes the "irrational" act by making it the output of a stable passion.
      *   *Conclusion:* Hume rejects the idea that the act itself is irrational. He argues the *agent* who would perform it is defective. The tension is resolved by seeing that for Hume, rationality is embedded in social conventions and character traits, not isolated atomic choices.

  7.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Caution:* Don't make Hume sound like a Rule Utilitarian. He's not maximizing utility consciously. He's describing psychological and social mechanisms.
      *   *Caution:* Don't make Hume sound like a CDT agent. He understands that human psychology doesn't work in isolated moments.
      *   *Key Distinction:* Parfit's "Rational Irrationality" implies a split between the act and the disposition. Hume tries to heal the split by making the disposition the source of the motive for the act.
      *   *Specific Textual Reference:* Mention the "sensible knave" (even if it's *Enquiry*, it clarifies *Treatise* Book III). Mention the distinction between natural and artificial virtues.

  8.  **Final Polish:** Ensure the tone is appropriate for a graduate student (scholarly, nuanced, engaging with the text). Structure the response logically to mirror the user's proposed structure (Book II tension -> Book III resolution -> Synthesis).

      *(Self-Correction on "Rational Irrationality"):* I need to be careful. Parfit suggests it is rational to *make oneself* disposed to act irrationally. Hume would say it is rational to *make oneself* disposed to act in a way that *seems* irrational from a narrow view but is rational from a broad view. The act isn't irrational for Hume; the narrow view is the error.

  9.  **Final Output Generation:** (Proceed to write the response following these steps.)
answer: |-
  This is an exceptionally sharp question that cuts to the heart of the coherence of Hume's project in the *Treatise*. You have correctly identified what looks like a fissure between the psychological instrumentalism of Book II ("Reason is, and ought only to be the slave of the passions") and the normative conventionalism of Book III (Justice and promise-keeping as artificial virtues upheld by general rules).

  To determine whether Hume can solve Parfit's Hitchhiker without contradicting himself, we need to trace how Hume understands the relationship between immediate motives, long-term interests, and the social construction of the self. Here is a step-by-step reconstruction of how Hume would likely analyze the case, where the tension lies, and how he attempts to resolve it.

  ### 1. The Book II Constraint: The Moment of Truth
  Let us begin with your first worry. If we apply the strict criteria of Book II, Section 3.3, to the motorist *once he is safely in town*, Hume seems committed to saying that refusing to pay is perfectly rational.

  For Hume, reason can oppose a passion only in two cases:
  1.  When the passion is founded on the supposition of the existence of objects which really do not exist.
  2.  When the passion chooses means insufficient for the intended end.

  In the Hitchhiker case, once the motorist is in town, the end of self-preservation is secured. The passion for preserving his money is active. Paying the money does not serve self-preservation (that is done) nor does it serve the passion for keeping money (it thwarts it). Therefore, at the specific moment of transaction, paying appears to be a failure of means-end reasoning. If the driver is not present to punish him, and his reputation is not at stake (let us assume a one-off interaction in a vast desert), the instrumental calculation dictates defection.

  If Hume stops here, he is a Causal Decision Theorist (CDT) who tells the motorist to defect, thereby ensuring that no driver ever picks him up in the first place. This is the "dynamic inconsistency" problem. It suggests that Humean agents are incapable of binding their future selves, which would make complex social cooperation impossible.

  ### 2. The Book III Resource: Artificial Virtues and General Rules
  However, Hume does not stop at Book II. In Book III, Part 2, regarding "Justice and Injustice," Hume explicitly addresses coordination problems that look very much like the Hitchhiker puzzle (and the Prisoner's Dilemma).

  Hume argues that justice is an *artificial* virtue. It is not that every single act of justice (e.g., returning a fortune to a miser) produces good consequences in isolation. In fact, Hume admits that particular acts of justice can be contrary to the public interest or the agent's immediate interest. However, the *whole scheme or system* is highly advantageous.

  To sustain this system, humans invent "general rules." We cultivate a sentiment of approval toward rule-following and disapproval toward rule-breaking, regardless of the immediate utility of the specific act. This is where your intuition about "dispositions" is correct. Hume argues that if we allowed ourselves to make exceptions based on case-by-case calculations of utility, the stability of the convention would collapse.

  In the Hitchhiker case, the promise to pay is the linguistic mechanism that triggers this convention. For Hume, a promise is not a mysterious mental resolution; it is a performative act that places the agent under a social sanction. By promising, the motorist enters a convention where the motive to pay is no longer just immediate self-interest, but the "sense of duty" or the fear of losing one's standing as a trustworthy participant in society.

  ### 3. Reconciling the Tension: The "Sensible Knave" and Character
  So, is there a tension? It appears that Book II says "maximize satisfaction of current passions" while Book III says "follow the rule even if it frustrates current passions."

  Hume resolves this not by abandoning instrumentalism, but by expanding the timeline and the conception of the *self* that holds the passions.

  **A. The Indirect Utility of Character**
  Hume would argue that the motorist who refuses to pay is failing to recognize the true causal efficacy of his actions (a Book II error). The "end" of a rational agent is not merely survival in the next hour, but a flourishing life over time. To achieve that, one needs a *character* that others can rely on.
  If the motorist calculates that he can defect safely this one time, Hume would classify this as the error of the "sensible knave" (a figure Hume explicitly discusses in the *Enquiry Concerning the Principles of Morals*, echoing the *Treatise*). The knave thinks he can enjoy the benefits of the convention (drivers picking him up) without the costs (paying). Hume's rebuttal is psychological: you cannot toggle your character on and off. By defecting, you damage your own psychological integrity and risk the habit of honesty, which is far more valuable than the sum of money.

  **B. Transforming the Passions**
  This is the crucial Humean move against Parfit's "rational irrationality." Parfit suggests it is rational to be disposed to do something that is *irrational* to do. Hume would reject the description of the act as irrational.
  For Hume, through education and socialization, the agent cultivates a *calm passion* for honesty or fidelity. When the motorist arrives in town, he is not weighing "money vs. nothing." He is weighing "money vs. the uneasiness of breaking a promise/violating a self-conception."
  If the motorist has successfully internalized the artificial virtue of fidelity, the passion to keep his word *outweighs* the passion to keep the money. Reason then serves this stronger, calmer passion. Thus, paying is **not** irrational in Book II terms; it is the efficient means to satisfying the dominant passion (fidelity/reputation/self-approval).

  **C. The Locus of Rationality**
  Parfit locates the rationality in the *choice of disposition* (it is rational to choose to be a payer, even if paying is irrational). Hume locates the rationality in the *cultivation of the sentiment*.
  For Hume, it is irrational to *lack* the disposition. The motorist who finds himself in the position of wanting to defect has already failed rationally long before he entered the desert. He failed to cultivate the virtues necessary to navigate social conventions. The "irrationality" of paying (in terms of immediate cash flow) is an illusion created by looking at the act in isolation from the agent's character and social context.

  ### 4. Where Hume Would Come Down
  If you press Hume on whether the *act* of paying is rational *at the moment of payment*, assuming the agent has no fear of punishment and no concern for reputation:

  1.  **Strict Book II Hume:** If the agent has no sentiment of fidelity and no fear of consequences, reason dictates keeping the money. But Hume would argue such an agent is a monster, not a rational actor in the human sense, because humans are inherently social.
  2.  **Integrated Treatise Hume:** The agent *cannot* bracket out his character. The "passions" relevant to the decision include the uneasiness of vice and the satisfaction of virtue (which Hume treats as psychological facts, not metaphysical mysteries). Therefore, paying is the rational means to satisfying the passions of a well-socialized human being.

  **Conclusion on the Tension:**
  The tension between Book II and Book III is resolved if we read Book II's "passions" not as atomic, momentary urges, but as the complex, socially-constituted motivational set of a human being living in time.
  *   **Parfit's View:** Rationality requires a break between the disposition and the act (the act is irrational, the disposition is rational).
  *   **Hume's View:** Rationality requires a continuity between the disposition and the act (the disposition makes the act rational by supplying the necessary motive).

  Hume would likely critique Parfit's setup for assuming a "state of nature" agent who can step outside of social conventions. For Hume, the very capacity to make a promise and intend to keep it is a product of the artificial virtues described in Book III. To ask "Why should I keep the promise if I can get away with it?" is, for Hume, to ask "Why should I participate in society?" The answer is not a logical proof, but a demonstration that life outside society is "solitary, poor, nasty, brutish, and short" (to borrow from Hobbes, whom Hume is answering).

  ### 5. Suggestions for Your Paper
  To make this a strong graduate paper, you might consider focusing on the following nuances:

  1.  **The Definition of "Interest":** Analyze how Hume expands "interest" in Book III from immediate gain to "enlightened self-interest" secured by general rules. This bridges the gap to decision theory's "expected utility" over a lifetime rather than a single node.
  2.  **The Role of Imagination:** Hume relies heavily on the imagination to extend our concern to the future and to generalize rules. You could argue that the "rational irrationality" puzzle is a failure of imagination (focusing too narrowly on the present moment), which Hume's theory of the mind is designed to correct.
  3.  **Comparison with Gauthier:** David Gauthier (*Morals by Agreement*) tries to solve Parfit's Hitchhiker using a Humean framework (Constrained Maximization). You could briefly contrast your reading with Gauthier's. Gauthier argues it is rational to *dispose* oneself to comply. Hume argues it is rational to *feel* a sentiment that causes compliance. Gauthier keeps the calculation; Hume replaces the calculation with a sentiment.

  **Final Verdict:** Hume can consistently handle the Hitchhiker case, but only by rejecting the premise that the act of paying is irrational. He argues that the *system* of rules makes the act rational by altering the agent's motivational structure. The "tension" you perceive is actually the engine of his moral theory: the transformation of raw self-interest (Book II) into civilized virtue (Book III) via the mechanism of convention and general rules. He would deny that "rational irrationality" is possible; instead, he posits "rational sentimentality," where the right feelings make the right actions instrumentally efficient.
