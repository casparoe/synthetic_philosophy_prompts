      *   **Legal Moralism (Lord Devlin/Patrick Devlin):** Society has a right to protect its moral fabric. If a practice undermines the shared morality that holds society together, it can be prohibited even without direct harm. (Supports the Sister).
      *   **Zoning Context:** Zoning is traditionally about health, safety, and welfare (noise, traffic, density), *not* moral regulation. However, "family definition" is a common zoning battleground.
      *   **Constitutional/Legal Precedent (US Context):** *Village of Belle Terre v. Boraas* (1974) allowed restrictions on unrelated people. *Moore v. City of East Cleveland* (1977) struck down restrictions on *related* family members. More recently, courts are skeptical of laws targeting specific relationship structures without rational basis.

