prompt: |-
  Okay, this has been bugging me for weeks. My town has this old zoning rule against more than 2 unrelated adults living together in one house, never enforced in decades - until 3 adults in a committed relationship (consensual, no kids, zero complaints from anyone) bought a house together, and now a couple of council members want to dust it off just to force them out. Nobody can point to actual harm, it's more like 'we don't consider that a real family' and 'we don't want to normalize it here.' My gut says if nobody's hurt and nobody outside the house is even affected, its none of the council's business, no matter how weird people personally find it. But my sister thinks i'm missing something - that a town only holds together because people share some baseline sense of right and wrong, and if everything 'private and consensual' gets a free pass then there's no glue left, so a community does have some right to protect its own character even with zero actual victims. Is she onto something real, or is that just a nicer way of dressing up 'ban what makes us uncomfortable'? Is there even a principled way to seperate 'this actually harms someone' from 'this just offends someone,' or does that line not really hold up?
