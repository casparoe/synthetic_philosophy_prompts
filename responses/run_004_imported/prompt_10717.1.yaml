answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of knowing Priya for [Number] years.

  Now, Priya asked me to give this toast knowing full well that half the room is her PhD cohort. I realize this isn't just a speech; it's an oral exam. I know that if I misuse the term "plural subject," I will be socially ostracized before the cake is cut. So, to the philosophers in the room: I promise to keep the citations informal. And to the parents and family: I promise to translate the jargon into English before the end.

  Because here is the thing about Priya and Theo. Over the years, their relationship has become a living case study in the very debate that keeps Priya's colleagues up at night.

  As many of you know, there is a famous disagreement in the philosophy of action about what it means to do something together. On one side, you have Margaret Gilbert. On the other, Michael Bratman.

  Priya is a Gilbertian. She believes that when two people commit to a life together, they create something irreducible. A "We." A plural subject. For Priya, a joint commitment isn't just a sum of two individual promises; it's a new entity that binds you. It's sacred. It means that "us" is a real thing, distinct from "me" and "you."

  Theo, bless him, is a Bratman reductionist. He believes you don't need spooky metaphysics to explain love. For Theo, shared intention is about the mechanics. It's about meshing sub-plans. It's about mutual responsiveness. It's about looking at your partner, seeing where they are going, and adjusting your own steps so you can walk together.

  For a long time, I thought this was a conflict. I thought Priya wanted the *magic* of marriage, and Theo wanted the *logistics*.

  But watching them plan this wedding, and watching them navigate the last few years, I realized I was wrong. They aren't fighting. They are completing the circuit.

  Because a marriage that is only Gilbertian—all heavy commitment and binding "We-ness" without flexibility—can become rigid. It risks becoming a prison of obligation. But a marriage that is only Bratmanian—all coordination and mutual adjustment without a deeper bond—risks becoming a mere business partnership. A contract of convenience.

  Priya and Theo work because they give each other what the other's philosophy lacks.

  Priya gives Theo the "We." She reminds him that there is a joint commitment that bottoms out in something real. She ensures that when things get hard, they aren't just two individuals recalculating utility functions; they are a unit. She provides the stability of the joint commitment.

  Theo gives Priya the "How." He embodies mutual responsiveness. He shows up. He adjusts his plans to support her goals. He proves, every day, that the "We" isn't just a metaphysical claim; it's an action. He builds the bridge that the "We" walks across.

  To the parents: What this means, in plain English, is that Priya brings the unwavering devotion, and Theo brings the daily work. She brings the vow; he brings the follow-through.

  And to the philosophers: Perhaps the truth isn't in choosing a side. Perhaps a successful life together requires the *ontology* of Gilbert—the belief that the "We" is real—supported by the *mechanics* of Bratman—the daily practice of meshing our lives.

  Priya, you have your joint commitment. Theo, you have your shared intention. But looking at you both, I see something that requires no reduction and no analysis. I just see love.

  So, if everyone could please raise a glass.

  To Priya and Theo. May your sub-plans always mesh, may your joint commitment never waver, and may your "We" be far greater than the sum of its parts.

  To the happy couple!
