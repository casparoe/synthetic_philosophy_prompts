answer: |-
  To understand Thomas Hobbes's decades-long crusade to square the circle, one must look past the caricature of the senile dogmatist and examine the structural role geometry played in his philosophical system. For Hobbes, the dispute with John Wallis was not merely a technical disagreement over a specific construction; it was a defense of the very possibility of civil philosophy against what he perceived as a resurgence of scholastic mysticism disguised as new mathematics.

  Here is an analysis of the episode from the inside of Hobbes's philosophical commitments.

  ### 1. The Epistemology of Geometry: Why It Delivers Certainty
  To understand why Hobbes believed he could square the circle, one must understand why he believed geometry was the only true science. In *De Corpore* (1655), Hobbes lays out a materialist epistemology. He argues that human knowledge is limited to the realm of things we can conceive as having causes.

  **Knowledge as Causal Construction**
  For Hobbes, to "know" something scientifically (*scientia*) is to know its cause. In the natural world, this is difficult because God created nature, and we cannot fully know the mind of God. However, in geometry, **we are the creators**. We define the point, the line, and the circle. Because we stipulate the definitions and the generation of the figures, we have perfect causal knowledge of them.

  **Geometry as the Science of Motion**
  Crucially, Hobbes did not view geometry as static. Consistent with his materialism (that nothing exists but body in motion), he viewed geometric figures as generated by motion.
  *   A point moving generates a line.
  *   A line moving generates a surface.
  *   A surface moving generates a solid.

  Therefore, a valid geometric proof must track this **generation**. Certainty arises because the mind can trace the causal chain of the motion that produced the magnitude. If you cannot describe the motion that generates a figure, you do not truly know the figure. This is why Hobbes was obsessed with "squaring" the circle: he believed that if a circle exists, there must be a rectilinear motion that can generate an equal area. To deny this was, to Hobbes, to deny the intelligibility of the physical world.

  ### 2. The Illegitimacy of Algebra and Wallis's Methods
  John Wallis, the Savilian Professor of Geometry at Oxford, represented the vanguard of the new mathematical analysis. He utilized algebraic symbolism and infinite series (as seen in his *Arithmetica Infinitorum*, 1656) to solve problems that classical geometry could not.

  To Hobbes, Wallis's methods were philosophically bankrupt for two main reasons:

  **A. Symbols Without Referents (Nominalism)**
  Hobbes was a strict nominalist. He believed that universal terms (like "triangle" or "number") are merely names (*nomina*) we use to group similar particulars. They have no existence outside the mind.
  *   **Hobbes's View:** Mathematical reasoning is a form of "computation"—adding and subtracting the consequences of names. However, these names must always be tethered to conceivable magnitudes or bodies.
  *   **The Critique:** Hobbes viewed Wallis's algebra as a manipulation of "scabs of symbols." He argued that algebraists were shuffling characters according to rules without maintaining a clear conception of the *magnitudes* those characters represented. For Hobbes, if you lose track of the physical magnitude (the body in motion), you are no longer doing science; you are playing a game of marks. He famously accused the algebraists of treating symbols as if they had magical powers to reveal truths that reason could not see.

  **B. The Problem of the Infinite**
  Wallis's methods relied heavily on the concept of limits and infinite series. Hobbes's materialism could not accommodate the actual infinite. To Hobbes, "infinite" was a negative term meaning "we cannot determine the limit," not a positive description of a quantity.
  *   When Wallis used infinite series to approximate the area of a circle, Hobbes saw this as an admission of failure. A true geometric solution should be exact and constructive, not an asymptotic approach derived from an unintelligible infinity.
  *   Hobbes argued that Wallis was conflating arithmetic (discrete numbers) with geometry (continuous magnitude). For Hobbes, a line is not made of points, and a surface is not made of lines; they are generated by motion. Treating continuous magnitudes as sums of infinitesimals was, to him, a category error that violated the laws of body and motion.

  ### 3. Why Refusal Was a Philosophical Necessity
  Given the framework above, Hobbes's refusal to concede to Wallis was not simple stubbornness; it was a defense of the coherence of his entire philosophical system.

  **The Stakes of *De Corpore***
  Hobbes's political philosophy (*Leviathan*, *De Cive*) was built upon the foundation of his physics (*De Corpore*), which was in turn built upon his method of geometry. He intended to construct a "civil science" with the same certainty as geometry.
  *   If Hobbes admitted that his geometric method was flawed, or that Wallis's symbolic algebra was superior, he risked undermining the epistemological basis of his political theory.
  *   If geometry is not about causal generation but about symbolic manipulation, then the "laws of nature" might not be discoverable through reason alone. This would open the door to the kind of religious and political "enthusiasm" (irrational belief) that Hobbes spent his life fighting.

  **The Definition of Error**
  In Hobbes's view, error in geometry is impossible if the definitions are clear and the computation is correct. Therefore, when Wallis proved Hobbes wrong, Hobbes did not interpret it as "I made a mistake." He interpreted it as:
  1.  Wallis is using different definitions (which Hobbes deemed illegitimate).
  2.  Wallis is relying on the authority of the university establishment rather than the light of natural reason.
  3.  Wallis is engaging in *ad hominem* attacks because he cannot refute the causal generation Hobbes proposed.

  Hobbes genuinely believed that Wallis and the Royal Society were a new kind of priesthood, using obscure symbols to gatekeep knowledge, much like the Scholastics used Latin and Aristotelian logic. To concede to Wallis would be to concede that truth is determined by academic consensus and symbolic utility rather than by clear, materialist conception.

  ### 4. Conclusion: The Tragedy of Systemic Integrity
  Hobbes's tragedy was that he sought to freeze the method of science at a specific moment of development. He wanted a geometry that was purely constructive, finite, and materialist. But mathematics was evolving into a more abstract, symbolic, and analytic discipline that could handle the infinite and the abstract in ways Hobbes's ontology could not permit.

  From the inside, Hobbes's position was consistent:
  *   **Certainty** comes from knowing causes (generation).
  *   **Geometry** is the study of generated magnitude.
  *   **Algebra** is the manipulation of ungrounded symbols.
  *   **Therefore**, a symbolic proof that contradicts a constructive intuition must be the one in error.

  Hobbes did not think he was failing at mathematics; he thought he was saving philosophy from incoherence. His refusal to accept Wallis's refutations was the act of a man who believed that admitting a mathematical error would require him to dismantle the materialist universe he had spent a lifetime building. In choosing between saving his reputation as a geometer and saving his system of philosophy, Hobbes chose the system.
