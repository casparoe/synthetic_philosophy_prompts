prompt: |-
  I'm working on a longread about the recent revival of "genealogical" methods across philosophy and social theory — the Foucauldian idea, now taken up by a younger generation of analytic philosophers who describe genealogy as a kind of conceptual reverse-engineering, that a concept can be illuminated, or quietly undermined, by reconstructing the practical needs that produced it. Rather than lean on secondary literature, I went back to the source and reread the Second Essay of Nietzsche's *Genealogy of Morals*. The only complete text I had on hand was the old 1913 Horace B. Samuel translation, which is in the public domain but whose late-Victorian syntax makes parts of the argument genuinely hard to follow. I've gotten stuck on section 12, where Nietzsche lays out, about as directly as he ever does, his actual methodological rule about origins and purposes:

  > Perhaps there is no more pregnant principle for any kind of history than the following, which, difficult though it is to master, *should* none the less be *mastered* in every detail.—The origin of the existence of a thing and its final utility, its practical application and incorporation in a system of ends, are *toto cœlo* opposed to each other—everything, anything, which exists and which prevails anywhere, will always be put to new purposes by a force superior to itself, will be commandeered afresh, will be turned and transformed to new uses; all "happening" in the organic world consists of *overpowering* and dominating, and again all overpowering and domination is a new interpretation and adjustment, which must necessarily obscure or absolutely extinguish the subsisting "meaning" and "end." The most perfect comprehension of the utility of any physiological organ (or also of a legal institution, social custom, political habit, form in art or in religious worship) does not for a minute imply any simultaneous comprehension of its origin: this may seem uncomfortable and unpalatable to the older men,—for it has been the immemorial belief that understanding the final cause or the utility of a thing, a form, an institution, means also understanding the reason for its origin: to give an example of this logic, the eye was made to see, the hand was made to grasp. So even punishment was conceived as invented with a view to punishing. But all ends and all utilities are only *signs* that a Will to Power has mastered a less powerful force, has impressed thereon out of its own self the meaning of a function; and the whole history of a "Thing," an organ, a custom, can on the same principle be regarded as a continuous "sign-chain" of perpetually new interpretations and adjustments, whose causes, so far from needing to have even a mutual connection, sometimes follow and alternate with each other absolutely haphazard.
  > — Nietzsche, *Genealogy of Morals*, Second Essay, §12 (trans. Horace B. Samuel, 1913)

  What I can't quite work out is how the pieces are meant to fit together. Nietzsche appears to be laying down a strict methodological principle — that explaining what a practice like punishment currently does for us tells you nothing about why it originally arose, and vice versa — and he grounds this in the claim that anything existing is constantly being seized on and "commandeered" by whatever will to power happens to get hold of it next. But isn't that oddly in tension with the rest of the book, which spends its first two essays using origin stories (the slave revolt in morality, the internalization of cruelty into "bad conscience") to unsettle the standing of present-day moral concepts? If origin and current function really are, as he puts it, "toto cœlo opposed" to one another, why does uncovering a concept's lowly or violent origin ever seem to count as evidence against it? And is "Will to Power" doing genuine explanatory work in this particular passage, or functioning more as a placeholder for "something happened here, mechanism unspecified"? I'd be grateful for help untangling exactly what Nietzsche is claiming in this paragraph, and whether the tension I've described is real or a misreading on my part.
