      *   *Application:* Marriage is forming a collective agent.
      *   *The Joke:* If they treated marriage like a committee using majority rule, they'd be inconsistent.
      *   *The Turn:* But they don't. They prioritize the "We."
      *   *Closing:* To the happy couple.

  6.  **Writing the Toast (incorporating constraints):**
      *   *Word Count Check:* 5 minutes is approx 700-800 words.
      *   *Tone Check:* Needs to be affectionate, not a lecture.
      *   *Accuracy Check:* Ensure I distinguish between *majority voting* (where the dilemma holds) and *consensus/deliberation* (where it might not).

      *(Self-Correction during drafting)*: I need to make sure the family understands the joke without feeling excluded. I'll explain the dilemma clearly but quickly. For the philosophers, I need to signal I know the literature (mention List & Pettit implicitly or explicitly). Let's stick to the logic without name-dropping too much to keep flow.

      *Key Logical Point:* The Discursive Dilemma shows that *majority voting* on interconnected propositions can lead to irrational collective outcomes. Marriage isn't majority voting between two people (that leads to stalemates anyway). It's about forming a *shared* will.
      *Joke Idea:* "If you ran this relationship on majority rule, you'd be logically inconsistent. Luckily, you run it on love."
      *Refinement:* "The theorem says a committee can accept all the reasons for doing something but reject the thing itself. In marriage, the trick is ensuring you never have to vote."

  7.  **Final Polish:**
      *   Check timing.
      *   Ensure the sister feels celebrated, not just analyzed.
      *   Make sure the partner is included.
