answer: |-
  Good evening, everyone. For those who don't know me, I'm the brother of the bride.

  Looking around this room, I realize we have a unique demographic split. Roughly half of you are family and old friends who know my sister as the person who organizes our holiday dinners. The other half are her colleagues and students who know her as a rigorous philosopher of logic.

  Now, I am not a philosopher. But when you grow up with someone who specializes in judgment aggregation, the jargon tends to seep into the family vocabulary. For years, we've had a running joke at Thanksgiving about the "Discursive Dilemma."

  For the family members: The Discursive Dilemma is a logical problem. It shows that if a committee votes on the *reasons* for a decision, they might get a different result than if they vote on the *decision* itself. You can have a majority agree that "Yes, we need a new car," and "Yes, we can afford it," and "Yes, this is the right model," but if you take a direct vote on "Should we buy this car?" the majority might say no. It's a paradox of how we combine individual judgments into a collective choice.

  For the colleagues in the room: Yes, I know that's the simplified version. I promise I'm not about to try to derive the impossibility theorem on a napkin.

  But this dilemma has made me think a lot about what [Sister's Name] and [Partner's Name] are doing today. Marriage, in a sense, is the ultimate exercise in judgment aggregation. You are taking two distinct individuals, with two distinct sets of beliefs, desires, and judgments, and merging them into a single shared life. You are forming a collective agent.

  If [Sister's Name] and [Partner's Name] were to run their marriage like a committee using simple majority rule, the Discursive Dilemma suggests they are in trouble.

  Imagine the premises of a life together.
  Premise one: "Is this the right time to settle down?"
  Premise two: "Do we share the same values?"
  Premise three: "Are we willing to compromise?"

  If they voted on those premises individually, they might get a majority "Yes" on all of them. But if they then took a direct vote on the conclusion—"Should we get married?"—logic tells us there is a risk they could end up rejecting the very life their premises support. Or worse, they could agree to the marriage while rejecting the premises that make it work.

  That is the trap of the dilemma. It assumes that we are separate voters tallying up wins and losses.

  But here is the tribute I want to pay to both of you: You have found a way to dissolve the dilemma, not by solving the math, but by changing the procedure.

  A successful marriage isn't a voting booth. It's not about one person's judgment aggregating with the other's to form a majority. It's about deliberation until the premises and the conclusion align. It's about realizing that when you love someone, you don't vote on whether their happiness is a valid premise for your own. You just accept it as an axiom.

  [Sister's Name], you have spent your career studying how groups can think rationally together. You know better than anyone that consistency is hard work. It requires transparency, communication, and a willingness to revise your own inputs for the sake of the collective output.

  And watching you with [Partner's Name], I see that you apply that same rigor to your love. You don't just tally votes. You talk. You argue. You listen. You ensure that when you say "I do," it is the only logical conclusion to the premises you've built together.

  So, for the philosophers in the room: You can rest easy. They aren't violating the theorem. They're opting out of the voting procedure entirely.
  And for the family: You can rest easy. They aren't overthinking it. They're just making sure they agree on the reasons, so they never have to doubt the result.

  [Sister's Name] and [Partner's Name], may your premises always be sound, may your conclusions always follow, and may you never have to call a tie-breaker vote.

  To the happy couple!
