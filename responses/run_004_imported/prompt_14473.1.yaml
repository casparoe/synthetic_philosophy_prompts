  2.  **Analyze the KMR Impossibility Theorem:**
      *   *What it says:* You cannot simultaneously satisfy Calibration (within groups), Balance for Positive Class (equal FPR), and Balance for Negative Class (equal FNR) across two groups with different base rates, unless the predictor is perfect or base rates are equal.
      *   *What it implies:* Any decision-making system (algorithmic OR human) that relies on probabilistic prediction faces this trade-off.
