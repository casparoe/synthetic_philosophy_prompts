      *   Are humans *more* transparent about their trade-offs? Usually no. Humans are "black boxes" too, often with less auditability.
      *   Do humans have different base rates in their decision-making? Yes. If judges treat Group A differently from Group B (consciously or unconsciously), they introduce bias.
      *   *Key Point:* The KMR theorem doesn't say algorithms are biased; it says *fairness definitions are incompatible*. It applies to humans just as much as machines.

