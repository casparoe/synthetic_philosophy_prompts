answer: |-
  Here are 10 interview questions designed to dig into the rigorous defense of superrationality/Logical Decision Theory without letting your guest retreat into slogans. The four specific topics you requested are marked, complete with the anticipated dodge and a closing follow-up.

  ### 1. The Newcomb Connection
  "Let's start with the architecture of the problem. Defenders of Causal Decision Theory often treat the Twin Prisoner's Dilemma as a isolated curiosity, but you treat it as structurally identical to Newcomb's Problem. If I accept your view here, am I committed to accepting the 'one-box' solution in Newcomb's? And if so, does that mean your theory is actually just a generalized Evidential Decision Theory, or is there a structural difference in how you view the correlation?"

  ### 2. The Circularity Objection **(Required: Circularity)**
  "I want to press the charge that superrationality begs the question. The skeptic says: 'You claim I should cooperate because we reason alike, but you only know we reason alike if you assume I've already decided to cooperate.' It feels like you're using the conclusion—that we will match—as a premise to justify the move. How do you derive the obligation to cooperate without already assuming the coordination you're trying to achieve?"

  *   **[Likely Dodge]:** She will likely argue that it isn't circular because the *source code* (or reasoning algorithm) is fixed prior to the output. She'll say, "I'm not assuming the output matches; I'm assuming the *function* matches. Since the function is the same, the output must match, so I choose the input that yields the better output."
  *   **[Follow-up]:** "But in a single-shot game, I don't have access to the output of her function before I run mine. By treating your own choice as the 'input' that determines her output, aren't you effectively claiming your local computation causally influences hers? If you deny the causal link, what *mechanism* enforces the symmetry other than your hope that she's as rational as you?"

  ### 3. The Dominant Strategy Tension **(Required: Dominance)**
  "Let's look at the payoff matrix. In the Twin PD, defection is still a strictly dominant strategy in the standard sense: you get more utility if you defect, regardless of whether the other player cooperates or defects. To cooperate, you have to argue that the 'regardless' clause is false—that your choice changes the probability of her choice. But if the money is already on the table, how do you justify ignoring the dominance principle without simply redefining 'rationality' to mean 'getting the best collective outcome'?"

  *   **[Likely Dodge]:** She will likely say, "Dominance only applies to independent variables. In this specific setup, the variables are logically dependent. You can't hold the other player's move constant while changing your own, because 'your own' and 'hers' are the same calculation."
  *   **[Follow-up]:** "That sounds like a modal claim, not a decision-theoretic one. Even if the calculations are identical, *I* am sitting here and *she* is sitting there. If I physically defect, the money doesn't vanish from her side. Are you arguing that my rationality has the power to override the physical payoff structure, or are you arguing that I should act *as if* it does, even though causally it doesn't?"

  ### 4. The Similarity Cutoff **(Required: Similarity)**
  "Hofstadter talks about 'twins,' but in the real world, no two agents are identical. I might be 90% similar to my opponent in reasoning, or 50%. Does your argument degrade gracefully? If I know my opponent is slightly less rational than me, or uses a slightly different heuristic, does the obligation to cooperate vanish? Where is the threshold where superrationality stops applying and standard defection takes over?"

  *   **[Likely Dodge]:** She will likely argue it's probabilistic. "It's not a binary switch. If there's a 90% chance we reason alike, you weigh the expected utility accordingly. You cooperate as long as the probability of correlation exceeds the payoff threshold."
  *   **[Follow-up]:** "But if it's just probabilistic expected utility, haven't you just collapsed back into standard Evidential Decision Theory? The distinct claim of superrationality is that there's a *logical* necessity to the match. If you admit it's just a probability gradient based on empirical similarity, what work is the 'superrational' label actually doing that EDT doesn't already cover?"

  ### 5. Gauthier and Constrained Maximization **(Required: Gauthier)**
  "People often conflate your view with David Gauthier's 'Constrained Maximization.' Gauthier argues it's rational to *cultivate a disposition* to cooperate with similar disposers *ex-ante*, before the game starts. But you seem to be arguing that cooperation is the rational *act* in the moment. Is there a practical difference? If I'm a Gauthier-style constrained maximizer, do I end up doing anything differently than you in the actual game, or is this just a semantic dispute about where we locate the rationality?"

  *   **[Likely Dodge]:** She will likely say, "The outcome is the same, but the justification is deeper. Gauthier relies on a disposition selected for long-term gain. I'm arguing that even in a one-off, isolated case, the act itself is rational because of logical identity."
  *   **[Follow-up]:** "That distinction matters for accountability. If Gauthier defects because the disposition wasn't profitable *ex-ante*, he's consistent. If you defect because the logical correlation broke down *in the moment*, are you vulnerable to a different kind of critique? Specifically, does your view require me to believe my opponent is *actually* running my same algorithm, whereas Gauthier only requires me to believe they have a compatible *disposition*?"

  ### 6. The Evolutionary Objection
  "If superrationality yields higher payoffs in these symmetric dilemmas, why hasn't evolution selected for it? We seem hardwired for causal reasoning and dominance tracking. Is your theory a prescription for how ideal agents *should* reason, or do you believe human cognition is actually capable of this kind of logical self-binding without extensive training? Are we fighting our own biology to be superrational?"

  ### 7. Exploitability and Blackmail
  "One risk of being predictable is exploitability. If I signal that I am a superrationalist, I'm signaling that I will cooperate with anyone I deem 'like me.' Couldn't a malicious agent mimic my reasoning patterns just enough to trigger my cooperation, then defect? Does your framework have a defense against 'logical blackmail,' or does being a superrationalist make you a sucker in a world of causal maximizers?"

  ### 8. Counterfactual Regret
  "Suppose I cooperate based on your theory, but my opponent defects. Maybe our reasoning wasn't as identical as I thought. Do I experience 'rational regret'? In Causal Decision Theory, I can say 'I made the right choice, they were just irrational.' In your view, if the outcome is (Cooperate, Defect), does that imply *I* made a calculation error in assessing our similarity? Is the bad outcome evidence that I was irrational?"

  ### 9. Implementation in AI
  "Much of the modern defense of this view comes from the context of AI safety and Functional Decision Theory. If two AIs share the same source code, the argument is trivial. But when we apply this to humans, we lack that transparency. Is this theory practically useless for human interaction until we have brain-scanning technology, or is there a heuristic version humans can actually use in negotiation?"

  ### 10. The Biggest Misconception
  "Finally, we've covered the technical objections, but what's the biggest philosophical misconception people have about your view? When critics say you're trying to 'magically' influence the other player, what are they missing about the nature of logical correlation?"
