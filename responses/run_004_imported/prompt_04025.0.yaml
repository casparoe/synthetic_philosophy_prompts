      *   *Strategy:* I will argue that Chang's view is *structurally* more robust for explaining agency, even if the phenomenological difference is subtle. Parity explains *why* we can create reasons through commitment; imprecise equality leaves us stuck in vagueness. I'll lean towards Chang being onto something distinct regarding the *structure* of rationality, not just value.

  7.  **Structuring the Response:**
