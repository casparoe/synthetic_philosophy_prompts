  2.  **Deconstruct the Philosophical Concepts:**
      *   **Trichotomy Thesis:** Traditionally, A and B are related by "better than," "worse than," or "equally good."
      *   **Chang's Parity:** A fourth relation. A and B are comparable, but neither is better, nor are they equal. They are "on a par." Key feature: Small improvements don't necessarily make one better than the other.
      *   **Imprecise/Rough Equality (Parfit/Griffin):** A and B are *approximately* equal. The vagueness is in our knowledge or the precision of the value, not necessarily in the relation itself. Often treated as a range of equality.
      *   **The Small Improvement Argument (SIA):**
          *   Premise 1: If A = B, then A+ (A slightly improved) > B.
          *   Premise 2: In hard choices, A+ is not clearly > B (it's still a hard choice).
          *   Conclusion: Therefore, A is not equal to B.
          *   Chang's move: Since they aren't equal, and neither is better, they must be on a par.
          *   Imprecise Equality counter-move: A = B is vague. A+ might still fall within the range of "roughly equal" to B.

  3.  **Address the Core Distinction (Substantive vs. Verbal):**
      *   *Imprecise Equality* suggests the underlying relation is still equality, just fuzzy. It implies a continuum where the boundary is blurred.
      *   *Parity* suggests the underlying relation is *different in kind*. It's not fuzzy equality; it's a distinct structural relation.
      *   *Why it matters:* Transitivity. Equality is transitive (A=B, B=C -> A=C). Parity is not necessarily transitive in the same way. Also, the normative implication: If they are equal, rationality might demand indifference. If they are on a par, rationality permits commitment to create reasons.

