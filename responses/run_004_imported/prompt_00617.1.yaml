  7.  **Final Polish:** Organize with clear headings. Ensure the math example is clear. End with a encouraging summary. (This matches the structure of the final output).

  8.  *(Final Review against constraints)*: User has no background in philosophy/logic. Keep definitions clear. Ensure the distinction between "logical certainty" and "high probability" is the core of the explanation.

  **(Self-Correction Note):** Make sure to emphasize that the sister isn't *wrong* about logic, but she's misapplying it to empirical claims. Logic deals with certainty; history deals with probability.

