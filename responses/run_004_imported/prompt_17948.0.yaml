      *   *The Risk Aversion Point:* Marcus uses the standard critique: Maximin makes you turn down huge gains for tiny safety margins. Elena needs to bring in the "Three Conditions for Maximin" from *Theory of Justice* (ignorance of probabilities, care little for gain above minimum, unacceptable alternatives).
