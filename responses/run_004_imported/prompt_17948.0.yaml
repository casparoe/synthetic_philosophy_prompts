      *   **The Harsanyian (let's call him "Marcus"):** Focuses on rational choice theory, Bayesian consistency, the arbitrariness of excluding probabilities, and the intuitive appeal of average utility. He needs to press the point that ignoring probabilities is irrational unless you have specific info to the contrary.

  3.  **Outline of the Debate:**
      *   **Opening:** Set the scene (drinks after a talk). Establish the core disagreement (Maximin vs. Expected Utility).
      *   **Round 1:** Marcus attacks the exclusion of probabilities (Principle of Insufficient Reason). Elena counters with the nature of the choice (fundamental liberties vs. marginal gains).
      *   **Round 2:** Marcus argues Maximin is irrational risk-aversion (the "penny for a billion dollars" objection). Elena introduces the "Strains of Commitment" and the uniqueness of the social contract (one-shot, no renegotiation).
      *   **Round 3:** Marcus challenges the "one-shot" claim (we make risky choices all the time). Elena distinguishes between *gambles within a system* vs. *choosing the system itself* (the baseline problem).
      *   **Round 4/Closing:** Marcus concedes the coherence but questions the cost (giving up huge gains for the worst-off). Elena reaffirms the priority of the right over the good and the guarantee of standing.

  4.  **Drafting - Section by Section:**

      *   *Setting the Scene:* Keep it brief. A bar near the philosophy department.
      *   *Opening Salvo:* Marcus brings up the seminar argument. He frames it as rationality. Elena frames it as the structure of the OP.
