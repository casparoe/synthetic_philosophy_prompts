answer: |-
  The noise of the faculty club bar had settled into a low hum. It was past eight, and most of the graduate seminar crowd had dispersed, but Elena and Marcus were still at a small table in the corner, surrounded by empty glasses and a napkin covered in scribbled decision matrices.

  **Marcus:** Look, I'm willing to concede that Rawls's *intuition* is attractive. Who doesn't want to protect the worst-off? But as a model of *rational choice*? It doesn't hold water. You're asking me to believe that a rational agent, faced with total ignorance, would ignore the math.

  **Elena:** It's not ignoring the math, Marcus. It's recognizing that the math doesn't apply.

  **Marcus:** That's the move, isn't it? "The math doesn't apply." But why? Harsanyi's point is devastatingly simple. If you are behind the Veil of Ignorance, you know you could be anyone in society. You have no information suggesting you're more likely to be the CEO than the janitor. In the absence of evidence, the Principle of Insufficient Reason dictates you assign equal probability to every slot. Once you have probabilities, you maximize expected utility. That leads straight to average utilitarianism. To do otherwise is literally irrational.

  **Elena:** But the Original Position isn't a casino. That's the category error. When you assign equal probabilities, you're treating social positions like draws from a deck of cards. But in the Original Position, you aren't just choosing a hand; you're choosing the rules of the game for a life you have to live *within* those rules. You can't step away from the table if you lose.

  **Marcus:** Okay, but "can't step away" is true of almost every significant decision. If I take a job in a new city, I can't necessarily step away if it turns out the housing market crashes. I still weigh the probabilities. I still calculate the expected utility. Why does the social contract get a special exemption from Bayesian rationality?

  **Elena:** Because of the stakes and the reversibility. In your job example, if the housing market crashes, you suffer a loss, but you retain your basic standing to recover. In the Original Position, you are choosing the basic structure of society. If you gamble on average utility and lose, you might end up in a position where your basic liberties are compromised just to boost the aggregate average. You might be enslaved, or destitute, in a way that prevents you from acting as a moral agent at all.

  **Marcus:** That's the "catastrophe" argument. But Rawls's Maximin rule is hyper-sensitive to catastrophes. It implies you would reject a society where everyone is a millionaire, except one person who has \$50,000, in favor of a society where everyone has \$40,000.

  **Elena:** Only if the \$50,000 person's position is insecure or comes at the cost of their status as a free equal. But let's stick to the decision rule. You're assuming risk-neutrality. You're saying a rational agent should be willing to trade a guarantee of a decent minimum for a *chance* at a higher average.

  **Marcus:** I'm saying a rational agent *should* take that bet if the expected value is higher! If I tell you, "I can give you a guaranteed \$40k, or I can flip a coin: heads you get \$1 million, tails you get \$39k," almost everyone takes the flip. Rawls is saying a rational agent behind the Veil would look at that and say, "No, I need the guarantee." That's not rationality; that's pathological risk aversion.

  **Elena:** It's not pathological if the "tails" outcome violates the strains of commitment. That's the piece people skip. Rawls isn't just saying, "I'm scared of being poor." He's saying, "Can a society built on that gamble hold together?" If you end up on the losing end of your expected utility calculation, will you accept the legitimacy of the institutions that sacrificed you for the greater average?

  **Marcus:** So now we're doing sociology, not decision theory.

  **Elena:** No, we're doing political philosophy. The choice in the Original Position has to be stable. If the principles chosen generate resentment so deep that the losers revolt or withdraw cooperation, the choice was impractical. Maximin ensures that even the worst-off have a stake in the system. Your average utilitarianism asks the bottom tier to accept their misery because it made the top tier happier. That's not a commitment a free person can reasonably be expected to make.

  **Marcus:** But Elena, you're smuggling in a moral premise and calling it a rational constraint. You're saying, "It's irrational to agree to something unfair." But Harsanyi's point is that *fairness* is the output, not the input. If we all agree to maximize expected utility behind the Veil, that agreement *is* the definition of fairness. By rigging the decision rule to Maximin, you're just pre-loading the result you want. You're saying, "To get the Difference Principle, you must use Maximin." But why must we use Maximin?

  **Elena:** Because of the three conditions Rawls lists for when Maximin is appropriate. One: you have no reliable basis for estimating probabilities.

  **Marcus:** I told you, equal probability *is* the reliable basis when you have no info.

  **Elena:** Not when the outcomes are incommensurable. That's condition two: you care little for the gain above the minimum guarantee compared to the loss of the minimum. And three: the rejected alternatives have outcomes you cannot accept. In the Original Position, you are choosing your basic rights. There is no "expected utility" gain that compensates for the loss of liberty of conscience. You can't say, "Well, I have a 90% chance of being allowed to worship, but the 10% where I'm persecuted is outweighed by the economic boom."

  **Marcus:** But that's you defining the goods lexically. If we're talking about primary goods generally—income, wealth, powers—then trade-offs happen. Let's say we're talking about tax rates. A higher average growth rate might mean a slightly lower floor for the bottom 10%. If the expected value for *everyone* behind the Veil is higher, why reject it? You're essentially saying the parties in the Original Position are terrified.

  **Elena:** They aren't terrified; they are responsible. Think about the "one-shot" nature of the choice again. In normal life, I take risks because I can hedge. I have savings, I have friends, I have legal recourse. Behind the Veil, you are choosing the *background* against which all hedging happens. If you choose a system that allows the bottom to fall out completely, there is no safety net left to catch you, because you chose the net's mesh size. It is rational to be maximally conservative when the choice is irreversible and the downside is the loss of agency.

  **Marcus:** But "irreversible" is an exaggeration. Societies change. Constitutions are amended.

  **Elena:** Not easily, and not for the person suffering *now*. If you are born into the underclass in an average-utilitarian society, your life is the cost paid for the statistical average. You can't wait for the constitutional amendment. The person in the Original Position knows that if they lose the gamble, they lose it for a lifetime.

  **Marcus:** Okay, let's grant the "lifetime" point. Here's my strongest objection, and I want you to really wrestle with this. If Maximin is only rational because of these special conditions—high stakes, no probabilities, irreversible—then why does Rawls present it as a critique of utilitarianism *generally*? He wants to say utilitarianism fails to take seriously the distinction between persons. But if the only reason we reject utilitarianism is because of extreme risk aversion in a specific hypothetical scenario, then utilitarianism isn't *wrong*, it's just too risky for *you*. It makes the objection subjective.

  **Elena:** It's not subjective because the conditions of the Original Position aren't arbitrary. They model what it means to be free and equal. The Veil isn't just a fog; it's a filter. It filters out bargaining advantages. If we allow probabilistic calculations, we allow people to gamble with their basic rights. The argument is that it is *unreasonable*, not just irrational, to gamble with your status as a citizen.

  **Marcus:** "Unreasonable." There it is. You're shifting from rational choice to moral reasonableness.

  **Elena:** Because in political philosophy, rationality isn't just about means-ends efficiency. It's about what terms of cooperation we can justify to one another. Harsanyi's model treats the parties as solitary gamblers. Rawls treats them as representatives of citizens who need to trust each other. If I know you voted for a system that maximized the average knowing it might crush me, I can't trust you. Maximin is the only rule that guarantees mutual assurance.

  **Marcus:** But that assurance comes at a price. By locking in Maximin, you might lock in a society that is poorer for everyone, including the worst-off, compared to a slightly riskier utilitarian scheme. If a utilitarian structure generates more wealth, and that wealth is taxed to help the poor, the poor might actually be better off on average than in a Rawlsian strict-maximin regime. Rawls assumes the Difference Principle maximizes the floor, but what if risk-taking maximizes the floor *over time*?

  **Elena:** Then the Difference Principle allows it. That's the beauty of it. Rawls doesn't forbid inequality. He forbids inequality that doesn't benefit the least advantaged. If taking a risk—say, incentivizing entrepreneurs—raises the floor for the worst-off, Maximin permits it.

  **Marcus:** But only *if* it raises the floor. If it raises the average significantly but leaves the floor static, Rawls says no. Harsanyi says yes.

  **Elena:** Because Rawls says the floor represents the social minimum required for dignity. You don't trade dignity for aggregate wealth.

  **Marcus:** But who defines dignity? That's the problem. By hard-coding Maximin, Rawls avoids the debate about what constitutes an acceptable minimum. He just says, "Make the minimum as high as possible." But if the cost of raising the minimum by one dollar is ten dollars of lost social wealth that could have been used for education or health, Maximin blinds you to that inefficiency. It's a local optimizer that misses the global maximum.

  **Elena:** It's not an optimizer; it's a constraint. It says there are some things we won't do to each other, even for efficiency. The Original Position is designed to model that moral constraint. If you walk in there thinking like a Bayesian gambler, you've already failed to understand that you are choosing a constitution, not a stock portfolio.

  **Marcus:** (Takes a long sip of his drink, looking at the napkin) I think we're at the impasse we were in the seminar. I see the moral appeal of your "constraint" view. But I still think you're buying it by rigging the rationality conditions. You're saying, "To get the moral result, we must assume agents who won't gamble." I'm saying, "If agents are truly rational and impartial, they will gamble, and the resulting morality is utilitarianism."

  **Elena:** And I'm saying that "impartiality" doesn't mean "neutral probabilities." It means "no one can sacrifice another for their own gain." Behind the Veil, since you could be anyone, sacrificing the worst-off is sacrificing *yourself*. Maximin is just the recognition that you shouldn't bet your very ability to pursue a life on a coin flip.

  **Marcus:** But life *is* a coin flip. Genetics, birthplace, talent. Utilitarianism just admits we're managing the odds. Rawls tries to pretend we can eliminate the gamble.

  **Elena:** No. Rawls admits the gamble exists. He just says the *basic structure* shouldn't be the one placing the bet. We mitigate the natural lottery; we don't institutionalize it.

  **Marcus:** (Smiles faintly) "Institutionalize the natural lottery." I'll give you that phrase. It's a good line. But I still think Harsanyi wins on the math.

  **Elena:** And I think Rawls wins on the stability.

  **Marcus:** Cheers to that, I suppose.

  **Elena:** (Clinks her glass against his) Cheers. But you're buying the next round. Maximin dictates I protect my resources.

  **Marcus:** (Laughs) See? You're already applying it outside the Original Position. Irrational risk aversion.

  **Elena:** Rational commitment to my budget. Don't confuse the two.
