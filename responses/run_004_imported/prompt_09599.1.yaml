answer: |-
  This is a genuinely tough situation, and I'm sorry you're facing the stress of potential displacement. It makes complete sense that this argument stuck with you. You and your friend aren't just arguing about co-op bylaws; you're bumping up against one of the oldest, thorniest problems in political philosophy.

  You are both right, but you are right about *different things*. Your friend is right about **property and contract law**, while you are right about **democratic legitimacy and moral impact**.

  Here is an outside opinion on the dynamics at play, both in your specific building and in the broader philosophical question you raised.

  ### 1. The Specific Case: Co-ops vs. Rentals
  First, a quick distinction that strengthens your friend's legal argument, even if it doesn't satisfy your moral one. In a standard rental building, the landlord owns the real estate. In a co-op, the "owners" don't own their units; they own shares in a corporation that owns the building. Their "proprietary lease" gives them the right to occupy.

  When you rent from a shareholder, you are effectively a sub-tenant of a corporation. Legally, the board has a **fiduciary duty** to the shareholders (the owners), not the occupants (the renters). If the board allows renters to vote, they could theoretically be sued by shareholders for diluting their equity and voting power.

  So, when your friend says, "It's their capital at risk," they are describing the legal reality of the co-op structure. The owners are liable for the building's debts and maintenance. If the building goes under, they lose their life savings; you lose your apartment. Because the financial risk is asymmetrical, the voting rights are asymmetrical.

  **However,** your point about the *severity* of the consequence is morally weightier. An investor owner might lose 5% of their projected ROI. You lose 100% of your housing stability. In ethics, we often weigh decisions by the magnitude of the harm. Your friend is arguing from **property rights**; you are arguing from **human impact**.

  ### 2. The Broader Principle: "All Affected Interests"
  You asked if there is a principled way to work out who gets a say based on how much they are affected. In political philosophy, this is known as the **All Affected Interests (AAI) principle**.

  The intuition is exactly what you described: *Anyone whose interests are significantly affected by a decision should have a right to participate in making that decision.*

  This principle feels intuitive because it prevents the exact scenario you described with the highway: Town A votes to build a road that ruins the air quality in Town B. Town A gets the convenience; Town B gets the asthma. That is a classic **negative externality**, and it feels undemocratic because the people paying the cost don't have a voice in the transaction.

  **Why your friend says "That's just how voting works":**
  Your friend is relying on the **Boundary Problem**. If we grant voting rights based on "affectedness," where do we draw the line?
  *   If the co-op bans Airbnbs, it affects you. Does it also affect your employer (if you have to move)? Your family? The local coffee shop you frequent?
  *   If Town A builds a highway, Town B is affected. But what about Town C, which gets less traffic as a result? Do they get a vote? What about the environment? Do future generations get a vote?

  Practically, every decision ripples outward. If you try to give everyone affected a vote, the electorate becomes infinite, and decision-making becomes impossible. To function, democracies (and co-ops) must draw arbitrary lines—usually based on geography (citizenship) or contract (shareholding). Your friend is defending the necessity of those arbitrary lines for the sake of order.

  ### 3. Where the "Ownership" Model Breaks Down
  Your intuition that something is "backwards" highlights a specific flaw in the ownership model, particularly in housing.

  Your friend's argument works best when the voters and the residents are the same people. But you mentioned that some "yes" votes are from **non-resident investors**. This creates a **Principal-Agent problem**.
  *   **The Residents (You):** Want stability and home.
  *   **The Resident Owners:** Want stability *and* property value.
  *   **The Investor Owners:** Want only property value.

  When investor owners outvote resident owners (and renters), the decision is no longer about how the building functions as a *home*, but how it functions as an *asset*. This validates your feeling that the system is skewed. The people treating the building as a spreadsheet are overruling the people treating it as a place to live.

  In political science, this is similar to **gerrymandering** or **colonialism**: a group making rules for a population they do not belong to and do not have to live with the consequences of.

  ### 4. Is There a Middle Ground?
  You asked if the idea of voting based on affectedness "falls apart once you try to pin it down." It doesn't fall apart, but it requires **thresholds**.

  Most functional societies use a hybrid approach. They don't let *everyone* affected vote, but they create **protections** for those who can't vote.
  *   **In Cities:** Neighboring towns don't get to vote on your highway, but there are environmental impact studies and zoning hearings where they can testify (even if they can't vote).
  *   **In Co-ops:** Renters can't vote, but ethical boards often allow them to speak at meetings (which your board denied you).
  *   **In Law:** Tenants have rights (lease protections, eviction notices) precisely because they *don't* have ownership power. The law intervenes to balance the asymmetry.

  Your board's refusal to let you speak is where they are failing the "principled" test. Even if you don't get a *vote*, a democratic body should generally allow those facing severe consequences to offer *testimony*. Denying you a voice entirely suggests they view you as a revenue stream, not a stakeholder.

  ### The Verdict
  Your friend is right that **systems require boundaries**. If we let everyone affected vote, nothing ever gets decided. Ownership and citizenship are useful, clear-cut proxies for "who gets to decide."

  But you are right that **boundaries create injustices**. When the line is drawn between "owner" and "renter," it ignores the reality that for the renter, the apartment is a home, not an asset. When the line is drawn between "Town A" and "Town B," it allows externalities to be dumped on the voiceless.

  **The principled takeaway:**
  There is no perfect formula for who gets to vote. However, a just system acknowledges that **voting power is not the only form of recourse.**
  1.  **Voice:** Even if you can't vote, you should be heard. The board shutting you down is ethically weak, even if legally permissible.
  2.  **Protection:** If a group is excluded from voting (like renters or neighboring towns), there should be stronger regulatory protections for them (like rent control or environmental laws) to compensate for their lack of power.

  You aren't wrong for feeling this is unfair. It *is* unfair that your housing security is contingent on the ROI calculations of people who don't live there. Your friend isn't wrong that without clear ownership rules, property systems become chaotic.

  You are arguing about **Equity vs. Efficiency**. Your friend wants the system to function efficiently (owners decide, bills get paid). You want the system to be equitable (those who suffer the cost get a say). Both are valid values, but in this specific instance, the human cost (your home) feels heavier than the procedural cost (letting a renter speak).

  **Practical advice:** Since you can't change the philosophy of the board in time for the vote, stop arguing about *fairness* and start arguing about *risk*. If the board bans Airbnbs and your landlord sells, the building loses a resident. If many do, the building has vacancy issues. Frame your appeal to the board not as "I deserve a vote," but as "This policy creates instability in the building's occupancy." It's the only language a co-op board is legally wired to hear.
