prompt: |-
  Okay, I need an outside opinion because my friend and I argued about this for like an hour last night and got nowhere. My building's co-op board just announced they're voting next month on banning short-term rentals (the whole Airbnb thing). If it passes I'm almost certainly getting evicted, because the guy I rent from bought his unit specifically to Airbnb part of it and uses that income to cover the mortgage — without it he's said he'll have to sell. I asked the board if renters could say a few words before the vote and got told "no, this is an owners' decision, you don't have equity in the building." My friend, who owns his unit in a different building with similar HOA drama, thinks that's basically fair — his reasoning is that its their capital at risk and their building, so naturally it's their vote. I said that seems backwards, since I'm the one who's actually about to loose my home over this, and a bunch of the "yes" votes are from people who don't even live in the building full-time, they just want the resale value to go up. We went back and forth for ages and neither of us budged, which is annoying because normally we're pretty aligned on this kind of thing.

  What's been bugging me since is that this doesn't feel like just a co-op-specific problem. It feels like the same basic shape shows up anywhere a group gets to make a rule that mostly lands on people outside that group — like a city council approving a highway interchange that dumps all the extra traffic onto the next town over, and that town doesn't get a vote because, well, it's not their council. Is there an actual principled way to work out who should get a say in a decision based on how much it affects them, rather than just whose name is on the deed or the map, or does that idea just fall apart once you try to pin it down? I feel like there's something real behind my side of the argument, but I can't get past my friend's "that's just how voting works" comeback.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation and Question:**
