      *   **The User's View:** It's unfair because the renter bears the brunt of the consequence (losing their home), while some owners (non-resident investors) vote based on resale value, not lived experience.
      *   **The Broader Philosophical Question:** Is there a principled way to determine voting rights based on *affectedness* rather than *ownership/jurisdiction*? (e.g., city council decisions affecting neighboring towns). Does the "all affected interests" principle hold water, or does it fall apart?

  2.  **Deconstruct the Arguments:**
