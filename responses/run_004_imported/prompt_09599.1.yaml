          *   Introduce the counter-principle: **"All Subjected to Coercion"** or **"Stakeholder Ownership"**.
          *   Discuss the **Boundary Problem**: If everyone affected votes, who draws the line? (The highway example is perfect here).
          *   Discuss **Externalities**: The user's highway example is a classic negative externality. Democracy struggles with these.
      *   *Why the Friend's View Persists:* Efficiency and Responsibility. Owners pay the bills. If renters vote to spend money, owners pay. There's a "no taxation without representation" flip side: "no representation without taxation/liability."
      *   *Why the User's View Persists:* Human rights and Stability. Housing is a need, not just an asset. Displacement is a severe harm.
      *   *Conclusion:* It's a tension between *Property Rights* and *Democratic Fairness*. There isn't a clean solution, but recognizing the tension is valuable.

  6.  **Refining the Tone:**
