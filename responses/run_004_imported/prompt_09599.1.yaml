      *   **User's Argument (Democratic Legitimacy/Affectedness):**
          *   Impact asymmetry: Owners lose potential income/value; Renter loses *home*.
          *   Principal-Agent Problem: Some owners don't live there (investors), so they don't feel the social impact, only the financial one.
          *   Moral intuition: Decisions should be made by those who suffer the consequences.
      *   **The Philosophical Core:** The "All Affected Interests" principle vs. The "All Subjected to Coercion" or "Stakeholder/Ownership" principle.

  3.  **Evaluate the "All Affected Interests" Principle:**
      *   *Strengths:* Aligns with democratic intuition (no taxation without representation, etc.). Prevents externalities (the highway example).
      *   *Weaknesses:* Boundary problem. *Everyone* is affected by *everything* (global warming, local zoning). How do you measure "affectedness"? Who decides the threshold? It creates infinite regress (does the renter's employer get a vote? The renter's family?).
      *   *Application to Co-ops:* Co-ops are private contractual associations, not governments. However, they function like micro-governments.

  4.  **Synthesize a Balanced Perspective:**
      *   Acknowledge the validity of *both* sides. Neither is purely "wrong."
      *   **Legal/Structural Reality:** In a co-op, the friend is legally right. It's a corporation; shareholders vote. Renters are third-party beneficiaries of the shareholder's lease.
      *   **Ethical/Political Reality:** The user is ethically right about the *impact*. The disconnect between power and consequence is a classic democratic deficit.
      *   **The "Principled Way":** Explore political philosophy concepts (All Affected Interests Principle). Explain why it's hard to implement (boundary problem) but why it matters morally.
