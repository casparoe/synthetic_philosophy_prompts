answer: |-
  **The Burden of Proof: A Defense of Svataḥ-prāmāṇya Against the Regress and Illusion Objections**

  The debate between the Bhāṭṭa Mīmāṃsakas and the Naiyāyikas regarding *prāmāṇya* (validity) is not merely a technical dispute about epistemology; it is a conflict over the default setting of human consciousness. Kumārila's Mīmāṃsā posits *svataḥ-prāmāṇya*: a cognition is valid by default, and invalidity must be proven extrinsically (*parataḥ*). The Nyāya school counters with *parataḥ-prāmāṇya*: validity must be certified by external conditions or successful action, while invalidity is often self-revealing due to causal defects. To resolve this, we must weigh Nyāya's threat of infinite regress (*anavasthā*) against Mīmāṃsā's difficulty in explaining perceptual error (the shell-silver illusion). While Nyāya offers a robust method for verifying truth, their foundational theory collapses under the weight of skepticism. Therefore, Kumārila's *svataḥ-prāmāṇya* must be accepted as the only viable epistemic foundation, provided we understand Nyāya's "successful activity" not as the *source* of validity, but as the mechanism for discovering extrinsic invalidity.

  The Nyāya position is intuitively appealing because it aligns with critical scrutiny. We often feel certain about things that turn out to be false. In the classic case of *śukti-rajata* (mistaking a shell for silver), the cognition "this is silver" arises, but it is false. For Nyāya, if validity were intrinsic, this error should not present itself as true, or we should be able to distinguish it from veridical cognition immediately. Since we cannot, validity must depend on external factors—specifically, *samvādi-pravṛtti* (successful practical activity). If I pick up the "silver" and can trade it, the cognition is validated; if I reach for it and find a shell, it is invalidated.

  However, this external certification invites the devastating infinite regress objection. If Cognition A requires Cognition B to validate its truth, does Cognition B require Cognition C? If every cognition is suspect until certified by another, we enter a vicious regress where no knowledge is ever secured. Nyāya attempts to halt this by appealing to practical action rather than a further cognition. But action itself relies on cognition (e.g., "I am successfully picking up silver"). If the cognition governing the action is also suspect, the validation fails. By making validity contingent on external proof, Nyāya makes knowledge inherently unstable. It places the burden of proof on the knower for every single instance of awareness, leading to a paralysis that contradicts the very possibility of navigating the world.

  Kumārila's Mīmāṃsā avoids this regress by shifting the burden of proof. For Mīmāṃsā, cognition is like light: just as a lamp illuminates itself and the object around it, a cognition reveals both its object and its own validity. Invalidity, conversely, is extrinsic (*parataḥ-aprāmāṇya*). A cognition is valid unless and until a defect (*doṣa*) is discovered. This handles the shell-silver objection more elegantly than Nyāya admits. In the illusion, the cognition "this is silver" *does* arise with intrinsic validity; that is why the subject reaches for it. The error is not in the presentation of the cognition (which feels true), but in the causal conditions (distance, poor light) which are later discovered extrinsically. When the subject realizes "this is a shell," that is a *new* cognition that subrates (*bādha*) the previous one. The invalidity of the first cognition was not intrinsic; it was imposed from the outside by a subsequent discovery. Thus, the phenomenon of error does not refute *svataḥ-prāmāṇya*; it confirms that invalidity is an extrinsic intrusion upon an intrinsically valid-seeming experience.

  The verdict must favor Kumārila, but with a crucial clarification that co-opts Nyāya's strength. Nyāya is correct that we need *checks* for knowledge, but they are wrong about the *ontology* of those checks. If we accept Nyāya's *parataḥ-prāmāṇya*, we surrender to skepticism because we can never satisfy the demand for external certification without circularity or regress. If we accept Mīmāṃsā's *svataḥ-prāmāṇya*, we preserve the possibility of knowledge while accounting for error through the theory of extrinsic invalidity.

  Therefore, the definitive stance is this: **Validity is intrinsically presumed (*svataḥ*), but defeasible by extrinsic evidence (*parataḥ*).** Nyāya's "successful activity" is not what *makes* a cognition valid; rather, the lack of successful activity is what *reveals* invalidity. This distinction is vital. In the shell-silver case, the cognition was valid *as an experience* (it truly appeared), but it was invalidated *as a claim about reality* by the extrinsic discovery of the shell. Nyāya conflates the psychological certainty of the cognition with the metaphysical status of its truth. Mīmāṃsā correctly separates them: the cognition carries its own authority (avoiding regress), but remains open to being overruled by future experience (avoiding dogmatism).

  Ultimately, the Nyāya demand for external certification is a category error. It treats validity as a property that must be added to cognition, rather than the essential nature of cognition itself. To function, agents must treat their perceptions as true by default. The infinite regress of the Nyāya position is not just a logical nuisance; it is an existential impossibility. Kumārila's system accommodates the fallibility of human experience without sacrificing the foundational trust required for action. We must therefore commit to *svataḥ-prāmāṇya*: truth is the default setting of the mind, and error is the anomaly that requires explanation, not the other way around.
