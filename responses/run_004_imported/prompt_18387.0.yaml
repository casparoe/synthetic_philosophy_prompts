answer: |-
  You have stumbled onto one of the most productive friction points between introductory logic and advanced moral philosophy. The short answer is: **neither side needs to give way, because they are answering different questions.**

  The critical-thinking-class version of *tu quoque* concerns **truth conditions** (is the proposition true?). The philosophical literature on standing concerns **felicity conditions** (is this speech act appropriate?).

  Your intuition from LessWrong and ACX is logically sound: the truth value of a proposition $P$ ("Austerity is economically necessary") is independent of the speaker's behavior. However, the philosophers you cited (Wallace, Cohen, et al.) are not arguing about the truth of $P$. They are arguing about the **normative authority** required to perform the speech act of *blame*.

  Here is how to reconcile the two frameworks without abandoning logical rigor.

  ### 1. Truth vs. Standing (The Category Error)

  In introductory logic, an argument is treated as a static object: Premises $\rightarrow$ Conclusion. If I say, "Stealing is wrong, and you stole, therefore you did wrong," logic asks: *Is stealing wrong? Did you steal?* It does not ask: *Who is speaking?*

  If I am a thief telling you not to steal, introductory logic says my hypocrisy is irrelevant to the truth of "Stealing is wrong." To claim otherwise is the *tu quoque* fallacy.

  However, moral philosophers like R. Jay Wallace argue that **blame is not just a statement of fact; it is a communicative act.** When I blame you, I am not merely describing a moral violation; I am invoking a norm and demanding that you acknowledge it. This act presupposes a certain relationship between us.

  Wallace argues that hypocrisy undermines the **standing** to blame because it violates the implicit reciprocity of moral address. By blaming you for $X$ while doing $X$ myself, I imply that the norm applies to you but (in practice) not to me. This creates a kind of unfairness that makes the *act of blaming* inappropriate, even if the *content of the blame* is accurate.

  So, the critical thinking class is right that hypocrisy doesn't make the claim **false**. The philosophers are right that hypocrisy can make the accusation **illegitimate**.

  ### 2. Illocutionary Force vs. Propositional Content

  To use speech-act terminology (Austin/Searle), we need to distinguish between:
  *   **Propositional Content:** "Austerity is the correct policy."
  *   **Illocutionary Force:** "I am morally authorized to demand you accept this sacrifice."

  When you argued with your friend about the austerity politician, you were debating the **propositional content**. You were correct: the politician's lavish lifestyle does not change the macroeconomic effects of austerity. If austerity works, it works, regardless of who proposes it.

  However, your friend was likely reacting to the **illocutionary force**. In politics, policy is rarely sold purely on technocratic grounds; it is sold as a moral demand ("We must all tighten our belts"). When a politician makes a moral demand they do not follow, they are attempting to exercise authority they have forfeited.

  The philosophers argue that losing "standing" means the speech act **misfires**. The politician can still *say* "You must sacrifice," but the moral weight of that command is nullified. It becomes mere noise or coercion, rather than legitimate moral address.

  ### 3. Why Critical Thinking Classes Get It "Wrong"

  Introductory logic courses simplify *tu quoque* for pedagogical reasons, but this simplification has a cost. They teach it to prevent students from dismissing **empirical claims** based on identity.
  *   *Bad:* "Climate change isn't real because Al Gore flies on private jets." (Fallacious: Truth of climate science is independent of Gore.)
  *   *Bad:* "This medical advice is wrong because the doctor smokes." (Fallacious: Biology doesn't care about the doctor.)

  However, this heuristic bleeds into **normative claims** where it doesn't belong.
  *   *Good:* "You cannot ethically condemn me for lying when you lie to me daily." (Valid: Challenges the standing to blame.)

  The critical-thinking model treats all arguments as if they are about physics. But politics and ethics are about **coordination and authority**. In coordination games, the credibility and consistency of the signaler are part of the data. If a leader signals "Sacrifice is required" but signals "Sacrifice is not required for me," they are sending contradictory coordination signals. Pointing this out isn't a logical fallacy; it's a critique of the signaling equilibrium.

  ### 4. G.A. Cohen and the "Casting the First Stone" Principle

  G.A. Cohen's work (specifically *"Casting the First Stone: Who Can?"*) adds a crucial nuance. He suggests that sometimes, pointing out hypocrisy is a way of protecting the **norm itself**.

  If we allow hypocrites to blame freely, we risk cynicism about the norm. If the austerity politician forces cuts on the poor while living lavishly, and we accept his moral authority, we implicitly endorse the idea that "rules are for little people." By denying him standing, we are actually protecting the integrity of the norm (that sacrifice should be shared) rather than attacking the policy.

  In this view, rejecting the hypocrite's blame is not a *tu quoque* evasion; it is a defense of the moral community's standards against corruption.

  ### 5. Synthesis: How to Update Your Heuristic

  You don't need to delete "that's an ad hominem" from your reflex library, but you should version-control it.

  **Version 1.0 (Logic Class):**
  *   **Claim:** $P$ is true/false.
  *   **Objection:** Speaker is a hypocrite.
  *   **Verdict:** **Fallacy.** Hypocrisy does not affect the truth value of $P$.

  **Version 2.0 (Moral/Political Philosophy):**
  *   **Claim:** You ought to be blamed/punished/sacrifice for $P$.
  *   **Objection:** Speaker is a hypocrite regarding $P$.
  *   **Verdict:** **Valid.** Hypocrisy undermines the *authority* to make the demand, even if the demand is technically correct.

  ### Applying this to your argument
  When you argued with your friend, you were likely talking past each other.
  *   **You** were asking: "Is austerity economically sound?" (Hypocrisy is irrelevant.)
  *   **Your Friend** was asking: "Does this politician have the moral right to demand austerity?" (Hypocrisy is decisive.)

  The philosophers you found are validating your friend's intuition, not invalidating your logic. They are saying that in the realm of moral and political address, **who speaks is sometimes part of what is said.**

  So, the critical-thinking-class version wasn't "wrong," it was just **domain-restricted**. It applies to truth-conditional claims (science, math, empirical facts). It does not apply to speech-acts involving authority, trust, and moral standing (politics, ethics, relationships). Recognizing this distinction allows you to keep your logical rigor while acknowledging the social reality that hypocrites lose the right to preach.
