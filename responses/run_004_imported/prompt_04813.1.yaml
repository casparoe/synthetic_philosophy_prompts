answer: |-
  **Setting:** *The foyer of the Grand Hyatt, Seattle. 8:15 AM. The International Conference on Biogerontology is just breaking for the morning coffee session. The air smells of roasted beans and laminated posters.*

  **Characters:**

  *   **DR. ELENA ROSTOVA:** A theoretical biologist. Committed Naturalist. Defends a modified Biostatistical Theory (BST).
  *   **DR. JULIAN THORNE:** A philosopher of medicine with a joint appointment in Bioethics. Committed Normativist.

  *(Rostova is staring at a poster on *daf-2* insulin signaling pathways. Thorne approaches, holding two styrofoam cups.)*

  **Thorne:** You look like you're trying to find the is-ought distinction in a western blot, Elena.

  **Rostova:** *(Turns, smiling)* Morning, Julian. Just admiring the conservation of mechanism. Thirty years of *C. elegans* work and we still can't agree on whether the worm is dying of "old age" or "pathology."

  **Thorne:** Because the worm doesn't fill out insurance forms. If it did, we'd have to decide if the pharyngeal pump slowing down is a billable event.

  **Rostova:** Exactly. Which brings me to your panel yesterday. You tore into Boorse again. I thought we were past this. The Biostatistical Theory is the only thing keeping us from calling gravity a disease.

  **Thorne:** Gravity kills everyone eventually. But if I trip and break a hip because my bone density evaporated, Boorse tells me that's not a disease. It's "statistically typical" for my reference class.

  **Rostova:** It's *age-typical*. That's the point of the reference class, Julian. You partition by age and sex. If eighty percent of eighty-year-olds have arterial stiffening, then arterial stiffening is part of the normal functional design for an eighty-year-old. It's not a failure of function; it's the function of an old system.

  **Thorne:** See, that's the move that's been keeping me up. You're defining health by *prevalence*. But prevalence isn't normativity. Just because everyone goes blind eventually doesn't mean vision loss is "healthy." It just means it's inevitable. Boorse is conflating *what happens* with *what ought to happen*.

  **Rostova:** I'm not conflating them. I'm protecting medicine from infinite expansion. If you remove the age-specific reference class, what's your baseline? Young adulthood?

  **Thorne:** Why not?

  **Rostova:** Because then *everyone* over thirty is pathological. Menopause becomes a hormone deficiency disease. Graying hair is a melanocyte failure. You've just medicalized the entire human life cycle. You turn aging from a condition of existence into a chronic universal illness. That's not science; that's a marketing strategy for the longevity industry.

  **Thorne:** *(Sips coffee)* Is it? Or is it an honest admission of what we're actually doing? Look, I read Boorse's later papers. He knew this was a problem. He floated the idea of using a "young adult" baseline for *all* ages. He realized the age-relative class makes the concept of "geriatric disease" incoherent. If arthritis is normal for the old, treating it is cosmetic.

  **Rostova:** And he rejected it. Because it violates the evolutionary design account. Organisms are designed to reproduce and maintain somatic integrity *until* reproduction is done. The decline *is* the design. The "failure" of the immune system in an eighty-year-old isn't a bug; it's the result of antagonistic pleiotropy. The genes that helped you survive to twenty are killing you at eighty. That's biological fact.

  **Thorne:** That's an evolutionary *description*, Elena. Not a medical *prescription*. Medicine isn't evolutionary biology. We don't say, "Well, cancer is statistically rare in hunter-gatherers, so we won't treat it in modern populations." We intervene against suffering and loss of function.

  **Rostova:** But "loss of function" relative to what? If I say your heart has lost function, I have to say compared to what standard. If you say "a twenty-year-old heart," you're saying an eighty-year-old body *should* be a twenty-year-old body. That's a value judgment. You're valuing youth over the natural lifecycle.

  **Thorne:** I'm valuing *function*. Look, let's pressure-test your reference class. Imagine we discover a mutation—like your *daf-2* worms—that allows humans to live to 150 with the tissue integrity of a forty-year-old. Suddenly, that becomes biologically possible. Does arthritis remain "statistically typical" for an eighty-year-old?

  **Rostova:** Initially, yes. Until the population shifts.

  **Thorne:** But the biology hasn't changed. The *norm* has. So "disease" isn't a natural kind you're discovering in the tissue. It's a line you're drawing based on what the population is currently doing. That makes "disease" a social statistic, not a biological state.

  **Rostova:** It makes it a *species-typical* state. Look, the Normativist view—that disease is whatever we value avoiding—makes medicine arbitrary. If society decides sadness is a disease, depression is a disease. If they decide aging is ugly, aging is a disease. I need a firewall. Boorse gives me a firewall. The reference class says: "This is how this organism is built to run at this stage."

  **Thorne:** But the firewall is built on a circular foundation. You say, "It's not a disease because it's normal for old people." I ask, "Why is it normal?" You say, "Because biology declines." I ask, "Is the decline a failure?" You say, "No, because it's normal."
  *(Thorne leans in)*
  You're using the outcome to justify the classification of the outcome.

  **Rostova:** I'm using the species-design to set expectations. If a car's tires wear out after 50,000 miles, it's not a defect. It's wear.

  **Thorne:** But humans aren't cars. We repair ourselves. And if I bring the car into the shop and say "The tires are bald," the mechanic doesn't say, "Well, statistically, most cars at 50k miles have bald tires, so this is healthy." He says, "Do you want to drive safely? Then replace them." The "disease" label is just the mechanic saying, "This prevents the system from doing what the owner wants."

  **Rostova:** But who is the owner? Nature? Or the patient? If it's the patient, then yes, aging is a disease because the patient wants to live. But if medicine is a science of biological function, it can't answer "what the patient wants." It can only answer "is the engine firing within spec."

  **Thorne:** And that's where the reference class betrays you. You set the "spec" based on the average failure rate. That's like setting the safety spec for a bridge based on how many bridges usually collapse. No, you set the spec based on *structural integrity*.
  *(Pause)*
  Here's the rub, Elena. If you stick with age-relative classes, you make geriatric medicine conceptually impossible. You can't "cure" aging, you can only "manage" expected decline. But if you switch to a young-adult baseline, you admit that aging *is* the pathology, and the goal of medicine is maintenance of that baseline.

  **Rostova:** And if I admit that, I validate the idea that death is a medical failure. That's not sustainable. Medicine has to accept mortality.

  **Thorne:** Medicine has to accept *death*. It doesn't have to accept *senescence*. There's a difference. Senescence is the accumulation of damage. Death is the end. Boorse's reference class conflates the process of dying with the state of being old.

  **Rostova:** *(Sighs, looks back at the poster)* You know, in the lab, when we knocked out *age-1*, the worms lived longer. But were they "healthier"?

  **Thorne:** By what metric?

  **Rostova:** By Boorse's metric. They maintained species-typical function longer. So, in that specific window, the "old" worm was functioning like a "young" worm. So, was the wild-type decline a disease?

  **Thorne:** If you have the technology to fix it, and you don't, it becomes a choice. And once it's a choice, it's normative.
  *(Thorne checks his watch)*
  Here's my worry. Your view protects us from hubris. It says, "Don't fight nature." But it also protects us from responsibility. It says, "Don't fight nature, even if nature is cruel."

  **Rostova:** And your view empowers us. But it risks turning every human limitation into a billable diagnosis. If aging is a disease, then being mortal is a chronic condition. I'm not sure language can hold that weight without breaking.

  **Thorne:** Maybe the language needs to break. Maybe "disease" was never the right word. Maybe it's "harmful dysfunction." But "dysfunction" requires a goal. If the goal is evolutionary fitness, aging is fine. If the goal is human flourishing...

  **Rostova:** ...Then Boorse can't help you. Because "flourishing" isn't statistical.

  **Thorne:** No. It's not.

  **Rostova:** *(Finishes her coffee)* So we're back to it. I need the reference class to keep medicine objective. You need to break the reference class to keep medicine humane.

  **Thorne:** And the biology? The nematodes?

  **Rostova:** The nematodes don't care. They just die.

  **Thorne:** *(Smiles)* Lucky them. See you at the keynote?

  **Rostova:** Only if they're not talking about reclassifying menopause.

  *(Thorne laughs, turns to leave. Rostova stays for a moment, looking at the graph of survival curves, tracing the downward slope with her finger.)*
