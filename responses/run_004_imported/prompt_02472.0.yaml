  so i'm outlining a novel where one of my POV characters is a philosopher of physics, and i need a scene where she gets cornered at a conference dinner by an old grad school frenemy who holds the opposite view on the nature of space. everyone always reaches for newtons bucket in scenes like this but that thing's basically the trolley problem of philosophy of physics at this point, so i want their argument to be about the hole argument instead -- the earman/norton one, where diffeomorphism invariance in GR supposedly saddles substantivalism with a weird, totally unphysical indeterminism. can you write me a dialogue between a substantivalist and a relationist actually hashing this out? have the substantivalist lean on the "sophisticated substantivalist" move (denying that diffeomorphic models count as genuinely distinct possibilities), and have the relationist push back that this just quietly turns substantivalism into relationism with extra steps. i want real back and forth, neither of them strawmanning the other.
