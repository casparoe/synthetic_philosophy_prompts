      *   **Part 1: The Time-Symmetry Trap (Loschmidt's Objection):**
          *   *Analogy:* A shuffled deck of cards or a messy room.
          *   *The Logic:* Statistical mechanics says "System goes from Unlikely (Low S) to Likely (High S)."
