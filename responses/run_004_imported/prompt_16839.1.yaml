prompt: |-
  I'm a novelist a little more than halfway through a literary novel set largely inside a federal appellate court, and I've reached a scene I don't want to fake. My protagonist, Judge Miriam Kessler, sits on the Thirteenth Circuit — a federal appellate court I invented for the book — and has spent the first half of the novel earning a reputation as an unsentimental textualist: the sort of judge who got her seat precisely because she was expected to read statutes narrowly and leave the closing of loopholes to Congress. In the chapter I'm drafting now, she has to circulate the actual bench memo laying out her position to the two other judges on her panel before their post-argument conference, and I'd rather the legal reasoning be real than merely plausible-sounding, so I'm hoping you'll draft it for me in full, as she would actually send it.

  Here is the case, all of it invented for the book. The Wetland Nesting Protection Act makes it unlawful "for any person to drain, fill, or otherwise alter a wetland that serves as nesting habitat for a species listed under section 2, during the nesting season for that species, without a permit issued under section 5." Two weeks before nesting season, a landowner named Alma Halloran — anticipating that an imminent listing decision would make future permits nearly impossible to obtain — drained and bulldozed a pond that had hosted a colony of the copper-throated marsh finch every spring for a decade, so that by the time the season opened there was no wetland left to protect. The U.S. Migratory Habitat Service sued for civil penalties and won in district court. On appeal, Halloran argues that the statute's own words confine liability to alterations occurring "during the nesting season"; she acted two weeks early, so on the plain text she falls outside the prohibition, and if Congress had meant to reach preemptive strikes it knew how to write "at any time" or "in anticipation of the nesting season" and chose not to. The government answers that Halloran's reading lets any landowner defeat the Act indefinitely just by acting a little earlier each season, and it defends a more purposivist reading by leaning on the Act's own findings section — which recites that such habitat is "frequently destroyed in anticipation of the nesting season, before any protection attaches" — together with a floor statement from the bill's sponsor describing this exact tactic under the state law the Act was modeled on.

  Could you draft the memo Judge Kessler would actually circulate to Judge Okafor and the third panel member ahead of conference: a clear recommendation on whether to affirm or reverse, the reasoning a serious textualist would give for it, and a full-strength version of whichever side's argument she ends up rejecting — Judge Okafor is written as the sharpest mind on the court and won't be moved by a strawman. If there's a genuine point of strain in her own method here — say, over whether a findings section counts as "text" she's entitled to lean on even while she'd exclude the floor statement, or over whether the government's "this reading guts the Act" point is a legitimate absurdity argument or just a policy complaint dressed up as one — I'd like the memo to sit with that tension rather than resolve it too smoothly; my editor clerked on a court of appeals and will notice if the reasoning is cleaner than real judging ever is.
reasoning: |-
  Here's a thinking process that leads to the drafted bench memo:

  1.  **Analyze the Request:**
      *   **Role:** Novelist writing a literary novel.
      *   **Character:** Judge Miriam Kessler (13th Circuit, invented).
      *   **Judicial Philosophy:** Unsentimental textualist (narrow reading, leave loopholes to Congress).
      *   **Task:** Draft a *bench memo* circulated to panel colleagues (Judge Okafor + one other) before the post-argument conference.
      *   **Case Details:** *United States v. Halloran*.
      *   **Statute:** Wetland Nesting Protection Act (WNPA). Prohibits draining/filling "during the nesting season... without a permit."
      *   **Facts:** Alma Halloran drained a pond *two weeks before* nesting season to avoid permit denial once the species was listed.
      *   **Issue:** Does "during the nesting season" cover preemptive destruction just prior to the season?
      *   **Arguments:**
          *   *Halloran (Appellant):* Plain text. "During" means during. Congress knew how to write "at any time."
          *   *Government (Appellee):* Purposivist. Findings section admits this tactic happens. Reading it otherwise guts the Act (absurdity doctrine).
      *   **Constraints:** Needs to feel real (not too clean), show the tension in textualism (findings vs. floor statements, absurdity vs. policy), strong argumentation (Judge Okafor is sharp), and reflect Kessler's specific voice (rigorous, perhaps slightly conflicted but disciplined).

  2.  **Determine the Outcome:**
      *   Kessler is a textualist. The text says "during the nesting season." Halloran acted *before*.
      *   Strict textualism usually favors Halloran here.
      *   *However*, the prompt asks for tension. If she just says "Text wins, reversed," it might be too simple. If she says "Affirmed," she has to stretch textualism.
      *   *Decision:* To make it interesting and true to her reputation as "unsentimental," she should probably vote to **Reverse** (favor Halloran), *but* acknowledge the cost. This highlights the "loophole" aspect mentioned in the prompt ("leave the closing of loopholes to Congress"). It creates more dramatic tension for a literary novel than a easy affirmance. It shows the discipline of her philosophy even when it yields a result she might dislike personally.
      *   *Wait, let's reconsider:* If she reverses, she validates the loophole. If she affirms, she betrays her textualism. The prompt says she earned her seat because she was expected to read statutes narrowly. To stay in character, she must likely vote for the narrow reading, even if it hurts the statute's purpose. This creates the "tension" the user wants: the conflict between achieving justice/purpose and adhering to method.
      *   *Refined Decision:* Kessler recommends **Reversal**. She adheres to the text. But she writes the memo in a way that shows she *sees* the government's point and struggles with the "absurdity" counter-argument.

  3.  **Format and Tone:**
      *   **Format:** Internal Court of Appeals Memo. Header (To, From, Date, Case, Subject), Introduction, Background, Analysis, Conclusion/Recommendation.
      *   **Tone:** Professional, precise, collegial but firm. No flowery prose, but since it's a literary novel, it needs some voice. It shouldn't read like a generic AI output; it needs legal weight.
      *   **Audience:** Judges Okafor and [Third Judge]. Okafor is the "sharpest mind," so the counter-argument must be robust.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard federal court format.
      *   **Introduction:** State the issue clearly. Statutory interpretation.
      *   **Background:** Brief facts. Crucial timing (2 weeks prior).
      *   **Analysis - The Text:** Start with the ordinary meaning of "during." Cite dictionaries or canon.
      *   **Analysis - The Government's Purposivism:** Address the Findings Section. Is it text? Kessler needs to distinguish between operative text and congressional musings. Address the Floor Statement (definitely exclude this).
      *   **Analysis - The Absurdity Doctrine:** This is the crux. Does reading "during" literally render the Act absurd? Or just imperfect? Kessler needs to walk the line. If the result is just "bad policy," textualists accept it. If it's "absurd," they might bend. She needs to argue it's the former, not the latter, while admitting it's close.
      *   **The Counter-Argument (Okafor's likely view):** Anticipate the "self-defeating statute" argument. If everyone does this, the Act is dead. Kessler needs to answer: That's a problem for Congress to fix, not the court.
      *   **Conclusion:** Recommend Reversal.

  5.  **Injecting the "Tension":**
      *   The prompt specifically asks for strain regarding the Findings Section vs. Floor Statement.
      *   *Idea:* Kessler should admit the Findings Section is part of the enacted law, unlike the floor statement. But does it modify the operative clause? She should wrestle with this.
      *   *Idea:* The "Absurdity" point. She should acknowledge that a statute that can be evaded by a two-week delay is *functionally* weak, but is it *linguistically* absurd? She must conclude it is not linguistically absurd, even if it is policy-wise foolish.
      *   *Voice:* Kessler shouldn't sound happy about this. She should sound resigned to the method. "My role is not to fix..."

  6.  **Refining the Legal Reasoning (The "Real" Part):**
      *   *Statutory Construction:* Operative provisions control over findings. *Barnhart v. Sigmon Coal Co.* type logic.
      *   *Absurdity:* High bar. *Green v. Bock Laundry Machine Co.* It must be a result no reasonable person could intend. A loophole isn't necessarily absurdity.
      *   *Rule of Lenity:* Maybe not applicable (civil case), but the strict construction principle applies.
      *   *Canon:* *Expressio unius*? Congress specified "during," implying exclusion of other times.

  7.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add some internal monologue disguised as legal analysis. "I confess..." or "The tension here is..."
      *   *Critique:* Is the counter-argument strong enough for Okafor?
      *   *Fix:* Dedicate a specific section to "The Government's 'Self-Defeating' Argument" and treat it with respect before dismantling it.

  8.  **Drafting - Iteration 2 (Focusing on the Prompt's specific requests):**
      *   *Findings Section:* Make sure she discusses whether findings are "text."
      *   *Floor Statement:* Explicitly reject it.
      *   *Tension:* Don't resolve it too smoothly. Admit that Congress might have messed up.
      *   *Character:* Kessler is unsentimental. Don't make her cry over the birds. Make her cry over the *rule of law*.

  9.  **Final Polish:**
      *   Check legal citations (make them look plausible even if the case is fake).
      *   Ensure the distinction between the 13th Circuit (invented) and real SCOTUS precedent is clear (13th Circuit follows SCOTUS).
      *   Make sure the recommendation is clear.

  **(Self-Correction during drafting):** I initially thought about having her affirm to show growth. But the prompt says she's "unsentimental textualist... expected to read statutes narrowly." If she affirms based on purpose, she breaks character. The literary tension comes from her *sticking* to her guns even when it feels wrong. That's the "cost" of her philosophy. I will have her vote to Reverse Halloran's liability.

  Wait, one nuance: The prompt asks for "a full-strength version of whichever side's argument she ends up rejecting." If she votes to Reverse (Halloran wins), she rejects the Government's argument. So I need to make the Government's purposivist argument very strong in the memo, showing she understands it, before explaining why she can't accept it.

  Let's write it.

