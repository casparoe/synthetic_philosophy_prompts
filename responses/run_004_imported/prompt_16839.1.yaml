answer: |-
  **UNITED STATES COURT OF APPEALS**
  **FOR THE THIRTEENTH CIRCUIT**

  **MEMORANDUM TO THE PANEL**

  **TO:** Judge Amara Okafor, Judge Robert Vance
  **FROM:** Judge Miriam Kessler
  **DATE:** October 14, 2023
  **RE:** *United States v. Halloran*, No. 23-4092 (Wetland Nesting Protection Act)

  **I. ISSUE**

  The sole question on appeal is one of statutory interpretation. The Wetland Nesting Protection Act (WNPA) makes it unlawful to alter a wetland "during the nesting season... without a permit." 16 U.S.C. § 4402(a). The appellant, Alma Halloran, drained a known nesting pond fourteen days *prior* to the statutory start of the nesting season, thereby ensuring no habitat existed when the season commenced.

  The District Court held Halloran liable, accepting the Government's argument that a contrary reading would render the Act a nullity. Halloran argues that the plain text creates a bright-line temporal limit that the Government is asking us to ignore.

  **II. RECOMMENDATION**

  I recommend we **REVERSE**.

  I reach this conclusion reluctantly. The Government's argument regarding the statutory purpose is compelling, and the practical consequence of our ruling will be to validate a tactic that Congress plainly intended to prohibit. However, under the canons of textualism we have applied in this Circuit, the operative text controls over the findings section, and the "absurdity" doctrine does not stretch far enough to cover a loophole that is merely effective, rather than linguistically impossible.

  **III. ANALYSIS**

  **A. The Operative Text**

  The statute prohibits altering a wetland "during the nesting season." U.S. Const. art. I, § 1 vests legislative power in Congress; our role is to apply the law they passed, not the law they might have wished to pass.

  The ordinary meaning of "during" is "throughout the continuance of" or "at some point in the course of." *Webster's Third New Int'l Dictionary* (2002). It is a preposition of time, not causation. It does not mean "in anticipation of," "for the purpose of affecting," or "prior to."

  Congress knew how to draft broader temporal restrictions. In the Clean Water Act, for example, Congress regulated discharges without such specific seasonal limitations in certain contexts. See 33 U.S.C. § 1311. Here, Congress chose a specific window. Under *expressio unius est exclusio alterius*, the specification of a time implies the exclusion of others. If Congress intended to prohibit the destruction of habitat *in order to prevent* nesting, it could have prohibited the destruction of habitat *designated for* nesting, regardless of the calendar. It did not.

  **B. The Findings Section vs. Floor Statements**

  The Government leans heavily on § 2 of the Act (Findings and Purposes), which states that habitat is "frequently destroyed in anticipation of the nesting season, before any protection attaches." They argue this finding incorporates the "anticipation" scenario into the operative prohibition of § 5.

  This presents the genuine strain in this case. Unlike the sponsor's floor statement—which I agree we must discard as extrinsic legislative history not enacted by both Houses and presented to the President—the Findings Section *is* part of the enacted text. *See FDA v. Brown & Williamson Tobacco Corp.*, 529 U.S. 120 (2000).

  However, a findings section is generally descriptive, not operative. It explains *why* Congress is acting, not *what* the law commands. If a conflict arises between a finding of fact in § 2 and a clear limitation in § 5, the operative provision must prevail. To hold otherwise would allow Congress to amend the scope of a statute through preamble language without subjecting the operative change to the same scrutiny.

  I acknowledge the tension here: We are treating one part of the enacted text as subordinate to another. But hierarchy within the text is necessary. The Findings Section identifies a problem; § 5 provides the remedy. If the remedy is narrower than the problem, that is a legislative gap, not a judicial ambiguity.

  **C. The "Self-Defeating" Statute and the Absurdity Doctrine**

  The Government's strongest argument is that Halloran's reading allows any landowner to defeat the Act indefinitely by acting two weeks earlier each year. They invoke the "absurdity doctrine," arguing that we cannot interpret a statute in a way that renders it self-defeating. *See Green v. Bock Laundry Machine Co.*, 490 U.S. 504 (1989).

  Judge Okafor, I anticipate you will press me on this point. You have argued in conference that when a interpretation leads to a result that frustrates the obvious goal of the legislation to the point of nullification, we are permitted to look past the strict preposition.

  I disagree, though I admit the line is thin.

  The absurdity doctrine is reserved for results that are not just unwise, but *irrational*—results that no reasonable legislator could have intended. *See Cropper v. O'Dell*, 502 U.S. 1135 (1992) (Scalia, J., dissenting). A loophole is not an absurdity. A statute that is easy to evade is not necessarily void of meaning; it is simply a weak statute.

  If we adopt the Government's reading, we are not interpreting "during." We are rewriting it to mean "during or immediately prior to." That is not a clarification of ambiguity; it is a redrafting. If the WNPA is to be effective, Congress must amend it to close the "Halloran Loophole." We did this in *United States v. St. Jude Logging*, 880 F.3d 1102 (13th Cir. 2018), where we refused to expand "timber" to include "underbrush" despite the ecological similarity, noting that "the remedy for legislative oversight is legislation."

  There is a risk here. If we reverse, we signal to the regulated community that the WNPA is a paper tiger. But if we affirm, we signal to the bar that the Court will ignore clear temporal limits when the policy stakes are high enough. The latter undermines the predictability of the law. As textualists, we must accept that sometimes the text will yield a result that seems contrary to the statute's spirit. That is the cost of the bargain.

  **IV. COUNTER-ARGUMENT CONSIDERED**

  I want to address the Government's point on reliance interests directly, as I know this is where the panel will fracture.

  The Government argues that Halloran acted in bad faith. She knew the listing was imminent. She knew the pond was used by the finch. She timed her bulldozers to the calendar to avoid liability. This is not a case of an innocent landowner caught by a technicality.

  But bad faith is not an element of the offense as written. The statute is a strict liability civil provision. It does not say "knowingly during." It says "during." If Congress wanted to punish the *intent* to evade the season, they could have criminalized the *intent* to destroy habitat. They criminalized the *act* of destruction *within the window*.

  To punish Halloran for acting outside the window because she *meant* to affect the inside of the window requires us to import a mens rea requirement that does not exist, or to stretch the temporal definition beyond its breaking point.

  I recognize that Judge Okafor will likely argue that the Findings Section puts Halloran on notice that "anticipation" was the specific evil Congress sought to cure. That is a fair reading of the *purpose*. But notice is not liability. The Findings Section tells us *what Congress saw*; § 5 tells us *what Congress did*. We cannot punish Halloran for what Congress saw if Congress did not legislate against it.

  **V. CONCLUSION**

  I propose we draft an opinion affirming the principle that "during" means during. We should explicitly note the Findings Section, acknowledge the Government's concern about evasion, and state clearly that the fix lies with the Migratory Habitat Service lobbying Congress for an amendment to § 5 to include "pre-season destruction."

  This will be a difficult opinion to write without sounding callous toward the environmental interests at stake. But our reputation for textual consistency is the only capital we have. If we bend the text here because the defendant is unsympathetic and the statute is weak, we invite challenges whenever the text produces an inconvenient result.

  I will circulate a draft opinion on Monday. Please let me know if you can join.

  **Miriam Kessler**
  *Circuit Judge*
