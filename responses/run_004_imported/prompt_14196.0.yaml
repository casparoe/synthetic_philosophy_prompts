answer: |-
  This is a formidable premise. Choosing Frege instead of the usual suspects (Wagner, Heidegger, Pound) is a genuine contribution to the conversation, precisely because logic claims a kind of neutrality that art explicitly rejects. Your core move—shifting from the *genetic fallacy* to the *ontology of the work* (what the work is made of)—is philosophically sound and rhetorically fresh.

  Here is my honest reaction to the specific questions you raised, followed by a suggestion on how to handle the complication.

  ### 1. Is the "sharp boundaries" worry a genuine threat?

  It is not a false analogy, but it is not a fatal blow either. It is a **structural homology**.

  You are worried that if Frege's logic demands "sharp boundaries" (bivalence: every predicate is either true or false for any object) and his politics demands "sharp boundaries" (every citizen is either German or not, no dual loyalty), then the logic is contaminated by the politics.

  **The Threat:** It undermines your claim that the *Grundgesetze* is "maximally indifferent." If the *structure* of the logic mirrors the *structure* of the prejudice, then the work is not purely neutral; it embodies an *ethos* of exclusion, even if it doesn't mention Jews. This suggests that "content-neutrality" is too shallow a metric. A work can be politically compromised not by what it says, but by the *shape of its thinking*.

  **The Defense:** However, you can survive this. The demand for sharp boundaries in logic was driven primarily by the **paradoxes** (specifically the threat of Russell's Paradox, which ultimately did destroy Frege's system), not by nationalism. Frege needed sharp boundaries to prevent contradictions, not to purge populations. The *motivation* was consistency; the political parallel is an aesthetic resonance, not a causal dependency.

  **Recommendation:** Do not write your way around this complication. **Write into it.** It is the most interesting part of your essay. Acknowledge the homology. Admit that there is a "temperamental unity" between the logician who cannot tolerate a vague predicate and the reactionary who cannot tolerate a hybrid identity. But argue that this makes the separation *more* tragic, not less possible. The tool works *despite* the temperament that forged it. That is a stronger point than claiming the tool was forged in a vacuum.

  ### 2. If content-neutrality is the wrong line, where should it go?

  Your current line is: *Logic is about numbers/concepts (indifferent to persons); Fiction is about persons (susceptible to politics).*

  The "sharp boundary" problem shows that logic isn't entirely indifferent to *concepts of order*, which are political. I suggest refining the distinction from **Content** to **Dependency**.

  *   **Instrumental Works (Frege):** The value of the work lies in its *utility* for other tasks. We use Frege's logic to build computers, analyze language, or prove theorems. Its truth conditions do not *depend* on the moral status of its author. A racist's bridge still holds weight; a racist's logic still validates proofs. The politics are extrinsic to the function.
  *   **Constitutive Works (Céline/Wagner):** The value of the work lies in the *experience* it generates. In a novel, the moral vision is often constitutive of the aesthetic power. If Céline's vitality depends on his hatred, you cannot extract the "style" from the "spite" without killing the style. The politics are intrinsic to the function.

  **The Pivot:** Argue that "separating art from the artist" is actually a category error. We don't separate them; we assess **dependency**.
  *   In Frege, the politics are **parasitic** on the man, not the logic.
  *   In Céline, the politics are **symbiotic** with the art.

  This allows you to keep your "sharp boundary" complication. You can say: *"Even if Frege's desire for logical order mirrored his desire for social order, the logic remains useful because its truth does not depend on that order being morally good. A novel, however, asks us to inhabit a world. If that world is built on a lie about human worth, the invitation itself is poisoned."*

  ### 3. Fact-Checking and Overstatements

  Your account of Frege is largely accurate, but there are three nuances you should tighten to avoid philosophical pushback:

  **A. The Diary's Timing:**
  You write: *"In the last full year of his life, Frege kept a private diary..."*
  *   **Correction:** Frege died in July 1925. The diary (*Tagebuch*) covers roughly March 1924 to March 1925. It is indeed the end of his life. However, his political views were not new in 1924; they were crystallized disillusionments following WWI and the German Revolution. Be careful not to imply this was a sudden "snapping." It was the distillation of decades of conservative drift.

  **B. "Almost no one treats the Begriffsschrift as compromised":**
  *   **Nuance:** This is mostly true among *logicians*, but false among *historians of philosophy*. Since Dummett's revelations (1980s), there has been a significant sub-field discussing the connection. However, your point stands that the *logic itself* is still taught and used.
  *   **Suggestion:** Soften this to: *"Working logicians still use his tools without hesitation, whereas no one reads Céline without a shudder."* Focus on the *usage* rather than the *scholarship*.

  **C. The Fate of the System:**
  *   **Nuance:** You mention the *Grundgesetze*. It is important to remember that Frege's system was already "compromised" scientifically by Russell's Paradox before the diary was ever found. The system is technically inconsistent regardless of his politics.
  *   **Why this matters:** If you argue the logic is "pure," a pedant will point out Basic Law V is contradictory.
  *   **Fix:** Specify that it is **Frege's innovations** (quantifiers, sense/reference, the distinction between concept and object) that remain canonical, not necessarily the total system of the *Grundgesetze*. Your argument is about the *methods* of modern logic he founded, not the specific consistency of his 1893 system.

  ### Summary of Advice

  1.  **Keep the Core:** The shift from "genetic fallacy" to "ontology of the work" is excellent.
  2.  **Upgrade the Complication:** Don't treat the "sharp boundary" parallel as a bug; treat it as a feature. It shows that while the *content* is neutral, the *temperament* is not. This deepens the tragedy without invalidating the logic.
  3.  **Refine the Criterion:** Move from "Content-Neutrality" to "Functional Dependency." Logic is a tool (extrinsic politics); Fiction is a world (intrinsic politics).
  4.  **Tighten the Frege Lore:** Ensure you distinguish between his specific failed system (*Grundgesetze*) and his enduring contributions (quantification, sense/reference).

  This is a sophisticated angle. It treats logic not as magic, but as a human craft, which is exactly what a novelist should do. If you can articulate why we can use a racist's logic but not inhabit a racist's novel, you will have written the best piece in that series.
