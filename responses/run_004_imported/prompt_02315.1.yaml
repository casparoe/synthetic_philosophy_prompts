      *   *Address Friendship:* Distinguish between objects that *can* exist without minds (scenery) and states that *cannot* (love).
      *   *Conclusion:* Moore didn't give up; he refined the target. He defeated Hedonism theoretically, even if he conceded practical ground.

  8.  **Refining the Tone:**
