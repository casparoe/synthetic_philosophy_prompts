      *   **Key Concepts:** Intrinsic value, isolation test, organic unities, consciousness, Sidgwick's hedonism/idealism, Moore's Ideal Utilitarianism.

  2.  **Deconstruct Moore's Argument (Chapter III, §50 - The Two Worlds):**
      *   *The Setup:* World A (Exceedingly Beautiful) vs. World B (Heap of Filth). Neither contains any conscious being to perceive them.
      *   *The Intuition Pump:* Is World A better than World B?
      *   *Moore's Conclusion:* Yes, World A is better.
      *   *The Philosophical Point:* Intrinsic value is *not* identical to conscious pleasure (contra Hedonism). Beauty has *some* intrinsic value independent of consciousness.
      *   *The Goal:* To refute Hedonism (specifically Sidgwick's version which ties good strictly to consciousness/pleasure).

  3.  **Deconstruct Moore's Argument (Chapter VI, §113 - The Value of Consciousness):**
      *   *The Claim:* The *most* valuable things are states of consciousness (affection + appreciation of beauty).
      *   *The Concession:* Mere existence of beauty (without consciousness) has value, *but* it is negligible compared to the consciousness *of* that beauty.
      *   *The Synthesis:* The "Organic Unity." The whole (Consciousness of Beauty) is greater than the sum of parts (Consciousness + Beauty).
      *   *The Goal:* To establish what actually matters for ethics and social progress (maximizing these organic unities).

  4.  **Address Question 1: Is the disagreement with Sidgwick merely verbal?**
      *   *Sidgwick's View:* Good = Pleasure/Consciousness. If no one perceives the beauty, it has *zero* value.
