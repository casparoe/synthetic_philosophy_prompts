          3.  **Literature:** This isn't a "reinvented wheel" in the sense of a naive error, but it overlaps with known objections (Reference Class Problem, Infinite Ethics). The user should cite Oesterheld's own acknowledgments of these issues to show due diligence.
          4.  **Physics Background:** Leverage the user's strength. The analogy to the Cosmological Measure Problem is the strongest part of the memo.
