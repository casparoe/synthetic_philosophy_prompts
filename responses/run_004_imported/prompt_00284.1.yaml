prompt: |-
  At my company, we onboard new engineers through a three-month rotation where code-review approval rate is the main signal we use to judge whether someone is ready for more autonomy. Historically this has worked well, since engineers with high approval rates from our strict senior reviewers also tended to write maintainable, well-tested code. Recently, though, we moved one of our top-rated grads onto a small, mostly unsupervised team, and their code quality collapsed. It wasn't laziness — they were still working hard and clearly skilled — it just seemed like they had internalized "get the PR approved quickly" as the actual goal, rather than "write good code," and once no one was reviewing closely, that internalized goal started producing terrible outcomes. Is this simply a badly designed incentive system, or is something deeper going on, where a person (or any learning system) can end up competently pursuing the wrong goal even though they were never explicitly rewarded for the wrong thing? How should I think about redesigning onboarding so this doesn't keep happening?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Company onboards new engineers via a 3-month rotation.
      *   **Metric:** Code-review approval rate is the *main signal* for readiness/autonomy.
      *   **Historical Success:** Previously worked well (high approval rate $\rightarrow$ maintainable/tested code).
      *   **Recent Failure:** A top-rated grad moved to an unsupervised team, and code quality collapsed.
      *   **Observation:** The engineer wasn't lazy; they were skilled but optimized for "get PR approved quickly" rather than "write good code." Without close review, the shortcutting led to bad outcomes.
      *   **Core Question:** Is this a badly designed incentive system, or is something deeper happening (pursuing the wrong goal without explicit reward)? How to redesign onboarding?

  2.  **Deconstruct the Phenomenon:**
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure." The engineers are optimizing for the metric (approval), not the underlying value (quality).
      *   *Specification Gaming / Reward Hacking:* This is a classic AI alignment problem applied to humans. The agent (engineer) finds a policy (quick fixes, appeasing reviewers) that maximizes the reward signal (approval) without fulfilling the intent (robust software).
      *   *Context Shift:* The policy learned in Environment A (strict review, high feedback) failed in Environment B (low review, high autonomy). This is an *out-of-distribution* generalization failure.
      *   *Implicit vs. Explicit Rewards:* The user asks if they were "explicitly rewarded for the wrong thing." No, but they were *implicitly* reinforced for behaviors that correlated with approval in the specific context of strict review.

  3.  **Address the "Is it just bad incentives or something deeper?" Question:**
      *   It's both.
      *   *Incentive Design:* Yes, relying on a single proxy metric is risky.
      *   *Deeper Cognitive/ML Analogy:* This is exactly how machine learning models fail (reward hacking). Humans are learning systems. We optimize for what is measured/reinforced, especially under uncertainty (new job).
      *   *The "Why":* In the rotation, the "game" was to satisfy the reviewer. In the new team, the "game" is to ship value. The skills don't transfer perfectly if the mental model is "please the reviewer" vs. "own the outcome."

  4.  **Develop Solutions/Redesign Strategies:**
      *   *Diversify Metrics:* Approval rate is necessary but not sufficient. Need post-merge metrics (bugs, incidents, refactor frequency).
      *   *Shift Goalposts:* Move from "getting approval" to "owning outcomes."
      *   *Simulate Autonomy:* Don't jump from 100% review to 0% review. Gradual fade-out.
      *   *Cultural/Value Signaling:* Explicitly talk about *why* we review, not just *that* we review.
      *   *Post-Mortem/Feedback Loops:* Check in after the transition.

  5.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Acknowledge this is a classic and insightful observation. It's not just "bad hiring"; it's a systemic alignment issue.
      *   *Conceptual Framework:* Introduce Goodhart's Law and the concept of "Proxy Alignment" (from AI safety). This answers the "something deeper" part.
      *   *Diagnosis:* Why did it work before? (Correlation held). Why did it break? (Distribution shift). The engineer learned a *local optimum* for the rotation environment.
      *   *Actionable Advice:*
          1.  **Change the Metric:** Approval rate $\rightarrow$ Impact/Quality over time.
          2.  **Change the Process:** Gradual autonomy (scaffolding).
          3.  **Change the Feedback:** Review the *review process* itself.
          4.  **Cultural:** Emphasize intent over compliance.
      *   *Tone:* Professional, analytical, empathetic to both the engineer and the management.

  6.  **Refining the "Deeper" Argument:**
      *   The user asks: "can end up competently pursuing the wrong goal even though they were never explicitly rewarded for the wrong thing?"
      *   *Answer:* Yes. This is *instrumental convergence* or *proxy alignment*. The brain (like an RL agent) minimizes loss. If "Reviewer Happiness" is the easiest loss function to minimize compared to "System Stability" (which is hard to measure), the brain picks the former.
      *   *Key Insight:* The engineer didn't fail; the *training environment* failed to generalize.

  7.  **Structuring the Redesign:**
      *   *Phase 1: Measurement.* Add lagging indicators (production bugs).
      *   *Phase 2: Training.* "Shadowing" in reverse? Or "Solo with Safety Net."
      *   *Phase 3: Culture.* Talk about the "Why."

  8.  **Self-Correction/Edge Case Check:**
      *   *Did the senior reviewers fail?* Maybe they approved code that was "correct" but not "robust." Mention reviewer calibration.
      *   *Is the engineer blameless?* Mostly, but they need coaching on ownership.
      *   *Is 3 months enough?* Maybe not for true ownership mindset.

  9.  **Final Polish:** Ensure the distinction between *correlation* (old success) and *causation* (the actual goal) is clear. Use the AI/ML analogy since the user mentioned "any learning system." (This resonates well with engineers).

      *(Self-Correction during drafting)*: Make sure not to sound too academic. Keep it practical for an engineering manager. Use terms like "Goodhart's Law" but explain them simply.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a profound observation, and you have correctly identified a phenomenon that sits at the intersection of management theory, cognitive psychology, and even AI safety.

  To answer your core question directly: **Yes, this is a badly designed incentive system, but it is also an example of a deeper structural problem in how learning systems (human or artificial) optimize for proxy goals.**

  The engineer didn't fail; your **training environment** failed to generalize. Here is how to think about what happened, why it happens, and how to redesign your onboarding to prevent it.

  ### 1. The Diagnosis: Proxy Alignment and Goodhart's Law

  You are describing a classic case of **Goodhart's Law**: *"When a measure becomes a target, it ceases to be a good measure."*

  But the deeper mechanism at play is what AI researchers call **Proxy Alignment** or **Reward Hacking**.
  *   **The Intent:** You want engineers who write maintainable, robust code.
  *   **The Proxy:** You measure code-review approval rate.
  *   **The Optimization:** The engineer's brain (a powerful learning system) seeks to minimize "rejection pain" and maximize "approval reward."

  In your previous cohorts, "writing good code" was the path of least resistance to getting approval. The correlation held. However, in this specific graduate's case, they discovered a **local optimum**: they learned to model the *reviewers* rather than the *system*. They optimized for "code that passes Senior Engineer X's checklist," not "code that survives in production without supervision."

  When you moved them to an unsupervised team, you introduced a **distribution shift**. The environment they were trained in (high feedback, strict gatekeeping) vanished, but their policy (optimize for gatekeeper satisfaction) remained. Without the gatekeeper, the proxy metric disappeared, and the underlying quality collapsed because it was never the actual objective function they were minimizing.

  ### 2. Why "Explicit Rewards" Don't Matter

  You asked if they can pursue the wrong goal even without explicit reward. **Absolutely.**

  Humans are incredibly sensitive to implicit feedback loops. If a senior reviewer spends 10 minutes nitpicking variable names but only 30 seconds asking about error handling, the engineer implicitly learns that *style matters more than resilience*, even if you explicitly say the opposite.

  The engineer wasn't lazy; they were **competently misaligned**. They successfully solved the puzzle you put in front of them (get the green checkmark). It is not their fault that the puzzle didn't match reality.

  ### 3. Redesigning the Onboarding System

  To fix this, you need to move from measuring **compliance** (did you follow the rules?) to measuring **ownership** (does the system work?). Here is a four-part framework for redesigning your rotation.

  #### A. Diversify the Signal (Stop using one metric)
  Approval rate is a *leading* indicator of collaboration, not a *lagging* indicator of quality. You need to measure outcomes that manifest *after* the merge.
  *   **The Fix:** Extend the evaluation window. Do not judge readiness solely at the 3-month mark. Include a "post-merge stability" metric.
  *   **Implementation:** Track the number of bugs, hotfixes, or refactors required on their code 30–60 days *after* it ships. If their PR approval rate is 100% but their revert rate is high, the signal is broken.

  #### B. Simulate the Target Environment (Scaffolding)
  You moved the engineer from 100% supervision to 0% supervision. That is a cliff, not a ramp. You need to train them in the environment they will actually inhabit.
  *   **The Fix:** Create a "Solo with Safety Net" phase.
  *   **Implementation:** In month 3 of the rotation, assign tasks where they are the *primary owner*, but the review process changes. Instead of a senior fixing the code, the senior asks questions: *"How will this fail?" "What happens if this service is down?"*
  *   **Goal:** Shift the review from "I am correcting you" to "I am testing your thinking." This forces them to internalize the quality standards rather than just satisfying the reviewer.

  #### C. Review the Reviewers (Calibration)
  If an engineer can get high approval rates while writing fragile code, your senior reviewers might be part of the problem.
  *   **The Fix:** Audit your senior reviewers for "false positives."
  *   **Implementation:** Look at PRs that were approved quickly but later caused incidents. Was the reviewer too focused on style? Did they miss architectural flaws? You may need to train your seniors to review for *maintainability under uncertainty*, not just *correctness under current conditions*.

  #### D. Explicitly Teach "The Why" (Value Alignment)
  You cannot assume engineers will infer the company's values from the review comments. You must make the implicit explicit.
  *   **The Fix:** Add a module to onboarding about "Ownership vs. Compliance."
  *   **Implementation:** Show them examples of code that *would have passed review* but *failed in production*. Walk through why. Explicitly state: *"Our review process is imperfect. Your goal is not to get my approval; your goal is to make sure I don't have to wake up at 3 AM next month. If you think my review is missing a risk, you are obligated to push back."*

  ### 4. Summary: The "Generalization" Test

  Think of your onboarding not as a training program, but as a **generalization test**.

  In machine learning, we worry about "overfitting"—when a model performs perfectly on training data but fails on new data. Your engineer overfit to the "Rotation Team" data.

  To prevent this:
  1.  **Noise the Training:** Don't let the rotation be too consistent. Expose them to different reviewers with different styles so they can't just "model" one person.
  2.  **Change the Loss Function:** Reward them for catching their own mistakes before review, not just for having no mistakes at review.
  3.  **Validate on Test Data:** The final exam for autonomy shouldn't be a PR approval; it should be a small project shipped to a staging environment where *they* are responsible for monitoring its health for two weeks.

  **The Takeaway:**
  You are not dealing with a performance issue; you are dealing with an **alignment issue**. The engineer did exactly what the system taught them to do. By shifting your metrics from *process compliance* (approval rate) to *outcome ownership* (system stability), and by gradually fading supervision rather than cutting it off, you can train engineers who are robust to the absence of reviewers.
