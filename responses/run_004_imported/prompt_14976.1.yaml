      *   *Check:* Did I explain *why* they aren't just stubborn? Yes, because their criteria for "good science" differ slightly due to the paradigm.
      *   *Check:* Is the chemistry accurate enough for a novel? I need to be careful not to get bogged down in stoichiometry but keep the conceptual shift clear. The "weight gain" paradox is the classic example (Phlogiston has negative weight? vs. Oxygen adds weight).
