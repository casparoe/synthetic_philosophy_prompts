      *   *What it IS:* It's a lack of a common measure (*in-commensurable*). It involves changes in taxonomy, ontology, and methodology.
      *   *Key Mechanism:* **Lexical Taxonomy.** Kuhn later refined incommensurability to focus on how terms are grouped and related. A "kind term" in one paradigm might cut nature at different joints than in another.
      *   *Communication:* It requires learning the other's language as a second language. It involves "bilingualism." One can understand the other, but one cannot simply *translate* without loss or distortion.
      *   *Resolution:* Paradigm choice isn't algorithmic. It's based on values (accuracy, scope, simplicity, fruitfulness, consistency) which are interpreted differently by each side.

  3.  **Apply to the Chemical Revolution (Phlogiston vs. Oxygen):**
      *   *The Shared Experience:* Both see the same candle go out. Both see the metal gain weight. (This addresses the "total unintelligibility" trap).
