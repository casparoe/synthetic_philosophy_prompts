prompt: |-
  So my sister is getting married in like three weeks and asked me to give the maid of honor speech, which is terrifying enough on its own, but the timing is extra annoying because Im in an epistemology seminar this semester that just spent two whole weeks on contextualism vs. pragmatic encroachment, and now I literally cannot turn it off every time someone at a wedding thing says "how did you just know he was the one." We did DeRose's bank cases in class — the couple who are totally fine saying "I know the bank's open Saturday" when nothing's riding on it, but the second real money is on the line with the exact same evidence, "I know" suddenly feels too strong and they should probably go check first — and now that's basically all I hear whenever people treat "knowing" someone is right for you like it's obviously an easier claim than knowing your bank's hours.

  Here's my actual problem: her fiancé is finishing a philosophy PhD, so a real chunk of the guest list is his cohort, people who will 100% notice if I'm leaning on the low-stakes/high-stakes distinction, or on the idea that "know" just means something stricter in a wedding toast than it does over coffee (the contextualist move — standards shift with the conversation), versus the idea that it's not the word that gets harder to apply but the actual knowing that gets harder, because so much more rides on being wrong (that's more the pragmatic encroachment line, closer to what Stanley argues against people like DeRose). But the other half of the room is our extended family, who will not know or care what any of that means and just want something warm and a little funny about two people they love.

  Can you write me the toast — five minutes-ish, meant to be spoken out loud, not an essay? I want "how do you know" to actually be the backbone of the whole thing rather than a throwaway line: it should acknowledge that "I just knew" is the kind of claim that would sound way too easy in literally any other high-stakes situation, and it should earn the right to say it anyway by the end, instead of just asserting it. But it has to work as a genuinely moving speech about my sister first and a sly epistemology reference second — no defining contextualism or pragmatic encroachment out loud, no air quotes around "know." If the philosophy crowd gets what I'm doing, great, they'll get it; if my aunt doesn't, she should still be crying happy tears by the end regardless.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Sister's wedding (Maid of Honor speech).
      *   **Timing:** 3 weeks away.
      *   **Speaker's Context:** Currently in an epistemology seminar (Contextualism vs. Pragmatic Encroachment, DeRose's Bank Cases, Stanley).
      *   **Audience:** Mixed. Half philosophy academics (fiancé's cohort, will spot the references), half extended family (won't know the jargon, want warmth/humor).
      *   **Core Theme:** "How do you know he was the one?"
      *   **Constraint 1:** Length: ~5 minutes spoken (approx. 600-800 words).
      *   **Constraint 2:** Tone: Warm, funny, moving. Not an essay. No jargon definitions (no "contextualism," no "pragmatic encroachment").
      *   **Constraint 3:** Philosophical Integration: The "how do you know" question must be the backbone. It needs to acknowledge the high stakes of marriage vs. the low stakes of everyday claims (Bank Case vibe) but *earn* the claim to "know" by the end.
      *   **Constraint 4:** Emotional Payoff: Aunt should cry, philosophers should nod knowingly.

  2.  **Deconstruct the Philosophy (for internal use):**
      *   *DeRose's Bank Case:* Low stakes (depositing a check, no rush) = "I know it's open." High stakes (mortgage payment due) = "I don't know, I should check."
      *   *Contextualism:* The word "know" changes meaning based on conversational context/standards.
      *   *Pragmatic Encroachment:* The *state* of knowing changes because practical stakes affect justification.
      *   *Application to Wedding:* Marriage is the ultimate high-stakes scenario. Usually, high stakes make "I know" harder to claim. The speech needs to argue that *despite* the stakes, the evidence is so robust that the claim holds. Or, that the "context" of love changes the standards of evidence.
      *   *Strategy:* Don't explain the theory. Enact the tension. Start with the skepticism (high stakes make knowledge hard), move through the evidence (observations of the couple), and conclude with the warranted assertion (yes, in this case, we *do* know).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Hook the room. Acknowledge the Maid of Honor duty. Introduce the common question: "How did you know?"
      *   **The Philosophical Tension (Subtle):** Bring in the idea that usually, when things matter a lot, we hesitate to say we "know." Use the bank analogy without naming DeRose.
      *   **The Evidence (The "Sister" Part):** Shift to specific stories about the sister and fiancé. This provides the "data" for the knowledge claim. Needs to be warm and observational.
      *   **The Turn (The "Philosophy" Part):** Address the stakes. Marriage is risky. But show how their relationship handles the risk.
      *   **The Conclusion:** Affirm the knowledge claim. It's not a guess; it's warranted. Toast.

      *   *Self-Correction on Tone:* Make sure it doesn't sound like a lecture. The philosophy needs to be the *structure*, not the *content*. The content is love.
      *   *Self-Correction on Audience:* Ensure the family hears "love is serious but worth it" while the philosophers hear "pragmatic encroachment is overcome by sufficient evidence."

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the MOH. People ask how you know someone is the one. In my class, we talk about how knowing is hard when stakes are high. Like a bank. But marriage is higher stakes. So how do they know? I watched them. They do X, Y, Z. They handle stress. So even though it's high stakes, the evidence is strong. So I know they are happy. Cheers.

      *Critique 1:* Too dry. Needs more emotion and specific imagery. The philosophy needs to be woven tighter.

  5.  **Drafting - Iteration 2 (Adding Flesh & Blood):**
      Start with the question. "How did you know?" It's a tricky question. Usually, if you're betting your house, you don't say "I know" unless you're sure. Marriage is betting your life. But watching [Sister] and [Fiancé], I've seen them in the hard times. Not just the easy times. They check in. They listen. So the standards are met. I love you both.

      *Critique 2:* Better. Now I need to polish the language to be speech-ready. Rhythm matters. Pauses. I need to make sure the "Bank" reference is clear enough for the philosophers but invisible to the aunt. *Key phrase:* "If you're just asking about the weather, sure. If you're betting something real..."

  6.  **Refining the Philosophical Nuance:**
      *   *The Trap:* If I say "standards change," that's contextualism. If I say "stakes make it harder," that's encroachment.
      *   *The Solution:* Focus on the *weight* of the claim. "We usually save the word 'know' for things we can check." "Marriage can't be checked in advance." "But here, the track record acts as the check."
      *   *The "Earned" Claim:* The speech must demonstrate that the *evidence* is what bridges the gap between high stakes and certainty.

  7.  **Writing the Speech (incorporating sensory details and pacing):**
      *   *Intro:* Thank guests. Mention the "How did you know?" question.
      *   *The "Bank" Nod:* Talk about small certainties vs. big certainties. "Is the bank open?" vs. "Is this person my life?"
      *   *The Evidence:* Specific anecdote. Maybe a time things went wrong, and they handled it well. (I'll use placeholders like [Sister] and [Fiancé] but write it so the user can fill in specifics).
      *   *The Climax:* Addressing the risk. Acknowledging that nothing is guaranteed, but *this* is as close as it gets.
      *   *The Toast:* Raise glasses.

  8.  **Review against Constraints:**
      *   5 minutes? (Word count check: ~750 words is usually 5 mins spoken slowly).
      *   No jargon? (Check: No "contextualism," "DeRose," "justification").
      *   Emotional resonance? (Focus on the sister's happiness).
      *   Philosophy hidden in plain sight? (The structure mirrors the epistemic problem).

  9.  **Final Polish:** Check the rhythm. Ensure the transition from "philosophical musing" to "sisterly love" is smooth. Make sure the ending lands hard emotionally. (Self-correction: Ensure the "Bank" reference isn't *too* obvious to the family, or it might confuse them. Keep it about "everyday certainties" vs. "life-altering decisions.")

      *Wait, one nuance:* The prompt says the fiancé is finishing a PhD. The speech should acknowledge *his* role in this "knowing" too. It's not just the sister knowing; it's the mutual knowledge.

      *Revised Plan:* Focus on how they *act* like they know. They don't hesitate. That confidence in high stakes is what convinces the speaker.

  10. **Final Word Count Check:** Aiming for roughly 700-800 words for a comfortable 5-minute pace with pauses for laughter/tears.

      *(Self-Correction during drafting)*: Be careful not to make it sound like the speaker is the one marrying them. The speaker is validating *their* claim to know.

      *Let's write.*
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister]'s sister and Maid of Honor.

  I've been thinking a lot lately about the question people always ask couples: "How did you know?"

  How did you know he was the one? How did you know she was the right person? It's such a common question, but if you stop to think about it, it's actually a really heavy one.

  In most parts of life, we save the word "know" for things that are safe. I can tell you I know the coffee shop is open, because if I'm wrong, I just walk away and find another one. I can tell you I know the answer to a trivia question, because if I'm wrong, we just lose a point. When the stakes are low, it's easy to be certain.

  But marriage? Marriage is not low stakes. This is the kind of decision where being wrong costs you years, heartbreak, a whole life built together. Usually, when the stakes are that high, we get careful. We hesitate. We say, "Well, I think," or "I hope," or "Let me check again." We don't usually stand up in front of our families and say, "I know."

  And yet, here we are. And [Sister] and [Fiancé] are standing there, looking at each other, making that claim without blinking.

  So, how *do* they know?

  I've had a front-row seat to their relationship, and I've learned that for them, "knowing" isn't a feeling they had on day one. It's a track record they've built since then.

  I remember a time last year when [insert brief, specific anecdote: e.g., a travel disaster, a job loss, a family emergency]. It was the kind of situation that breaks people. The stakes were high, the stress was real, and the easy thing would have been to turn on each other. But I watched them. I didn't see hesitation. I saw [Fiancé] step up in [specific way], and I saw [Sister] meet him there with [specific quality].

  They didn't have a guarantee that things would work out. None of us do. But they had evidence.

  They have evidence in the way they argue—which is to say, they listen more than they speak. They have evidence in the quiet moments, like [small domestic detail: making coffee, folding laundry, a inside joke]. They have evidence that when the world gets loud, they are each other's quiet place.

  To the rest of the family, this might just sound like love. And it is. But to anyone who cares about the truth, it's something else, too. It's warrant.

  It is rare to find two people who treat a commitment this big with such clear eyes. They aren't ignoring the risk. They know life is unpredictable. They know that "forever" is a long time to bet on anything. But they've looked at the data. They've looked at the hard days and the easy days, and they've done the work.

  And because they've done the work, I don't have to hesitate either.

  Usually, when the stakes are this high, you can't claim to know what comes next. But looking at them, I realize the standards for certainty aren't about predicting the future. They're about trusting the person standing next to you in the present.

  [Sister], you have always been the person who feels things deeply. Seeing you with [Fiancé] has been the joy of my life. You look safer with him than you ever have before. Not safe from hardship—but safe in the knowledge that you won't face it alone.

  [Fiancé], welcome to the family. Thank you for giving her that safety. Thank you for earning the right to stand here and say "I do" with the same confidence she uses to say her own name.

  So, to answer the question: How do they know?

  They know because they've checked. They've checked in, they've shown up, and they've stayed.

  And if they can be that sure, then so can I.

  I know that they are better together than they are apart. I know that they are ready. And I know that they are going to be okay, no matter what the bank hours are, no matter what the market does, no matter what life throws at them.

  Please raise your glasses.

  To [Sister] and [Fiancé]. To the evidence, to the risk, and to the knowing.

  Cheers.
