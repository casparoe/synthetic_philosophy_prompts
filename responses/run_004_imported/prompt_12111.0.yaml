answer: |-
  Given your background in statistical mechanics, you are uniquely positioned to see the fault line here. You know that in physics, the equality of time averages and ensemble averages is a *theorem* (the Ergodic Hypothesis), not an axiom, and it holds only under specific conditions. When those conditions break, the ensemble average becomes a mathematical fiction with no physical counterpart for a single system.

  The strongest case for the Ergodicity Economics (EE) camp rests not on the *output* of the calculation (which, you correctly note, often matches Log-Utility EUT), but on the **ontological status of the logarithm** and the **direction of inference**.

  Here is the argument for why maximizing time-average growth is a distinct and superior standard of rationality for compounding processes, framed for a statistical mechanician.

  ### 1. The Origin of the Logarithm: Dynamics vs. Psychology
  In Expected Utility Theory (EUT), the logarithm is **exogenous**. It is a property of the *agent*.
  *   **EUT Logic:** "Why do you bet Kelly?" "Because my utility function is $U(W) = \ln(W)$."
  *   **Critique:** Why is it $\ln$? Why not $\sqrt{W}$ or $-e^{-W}$? EUT answers: "Because those are your preferences." This makes the theory unfalsifiable. Any behavior can be rationalized post-hoc by positing a sufficiently convoluted utility function.

  In Ergodicity Economics, the logarithm is **endogenous**. It is a property of the *dynamics*.
  *   **EE Logic:** "Why do you bet Kelly?" "Because wealth evolves multiplicatively ($W_{t+1} = W_t \cdot (1 + r)$), and the observable growth rate is the time average of the log-return."
  *   **The Distinction:** In EE, the logarithm arises from the coordinate transformation required to make the process additive and ergodic. If wealth follows geometric Brownian motion, $dW = \mu W dt + \sigma W dW$, the process is non-ergodic in $W$. However, the process is ergodic in $\ln W$.
  *   **The Punchline:** You don't need to assume the agent *likes* log wealth. You only need to assume the agent wants to survive and grow in a multiplicative environment. The log utility emerges from the physics of the compounding process, not the psychology of the gambler. This shifts rationality from "satisfying axioms of preference" to "aligning with the dynamics of the environment."

  ### 2. The Category Error: Ensemble Averages in Non-Ergodic Systems
  As a stat mech expert, you know that $\langle A \rangle_{ensemble} = \langle A \rangle_{time}$ is a heavy assumption.
  *   **The EUT Default:** Standard economics implicitly assumes ergodicity. It calculates the expected value at time $t$ by averaging over all possible paths (the ensemble). It treats the "expected wealth" as a physical observable.
  *   **The EE Critique:** In multiplicative dynamics, the ensemble average is dominated by rare, high-wealth trajectories that a single agent will almost certainly never experience.
      *   *Example:* A bet where you gain 50% or lose 40% with equal probability.
      *   *Ensemble Average:* $1.5 \times 0.5 + 0.6 \times 0.5 = 1.05$. Positive drift.
      *   *Time Average:* $\sqrt{1.5 \times 0.6} \approx 0.95$. Negative drift.
  *   **The Physical Reality:** If you play this game repeatedly, your wealth decays to zero almost surely, despite the positive ensemble expectation. The ensemble average describes a cloud of parallel copies; the time average describes *you*.
  *   **Rationality Redefined:** If rationality is about making decisions that improve your actual future state, maximizing an ensemble average in a non-ergodic system is physically irrational. It optimizes for a parallel universe you will never inhabit. EE argues that rationality *must* be defined by the time average because that is the only observable accessible to a single trajectory.

  ### 3. Ruin as a Natural Boundary Condition
  This is perhaps the most pragmatic advantage of the EE framework.
  *   **In EUT:** Bankruptcy is an arbitrary constraint. To prevent an agent from taking bets that lead to ruin, you must impose a utility function that goes to $-\infty$ at zero wealth (like log) or add hard constraints. But standard EUT allows for utility functions where ruin is acceptable if the payoff is high enough (e.g., quadratic utility).
  *   **In EE:** Ruin is a topological feature of the state space. In multiplicative dynamics, $W=0$ is an absorbing boundary. The time-average growth rate of any strategy that risks ruin is $-\infty$ (since $\ln(0) = -\infty$).
  *   **The Advantage:** You don't need to "bolt on" risk aversion. The mathematics of the time average automatically penalizes strategies that risk crossing the absorbing boundary. This explains why real agents avoid ruin without needing to assume they are psychologically "risk-averse." They are simply optimizing for persistence in a non-ergodic system.

  ### 4. Falsifiability and Calibration
  Samuelson's critique was essentially that EE is "just" EUT with log utility. But from a modeling perspective, they are calibrated differently.
  *   **EUT Calibration:** To predict behavior, you must measure the agent's risk aversion coefficient ($\gamma$ in CRRA utility). This is notoriously difficult, context-dependent, and unstable.
  *   **EE Calibration:** To predict behavior, you measure the statistical properties of the *process* (drift and volatility of the asset). These are objective, measurable properties of the market, not the mind.
  *   **Why it matters:** If the environment changes (volatility spikes), EE predicts the agent *must* change their betting fraction to maintain growth, regardless of their "preferences." EUT suggests the agent might stick to their preferences and accept lower growth. EE provides a normative standard based on external reality, not internal consistency.

  ### 5. Answering Samuelson
  Samuelson's 1971 paper ("The 'Fallacy' of Maximizing the Geometric Mean...") argued that maximizing geometric mean is only optimal if you have log utility, and since you might not, it's not a universal rule.

  **The EE Counter-Argument:** Samuelson was asking, "What function maximizes satisfaction?" EE asks, "What function maximizes survival and growth in this specific dynamical system?"
  Samuelson treated the logarithm as a *preference*. Peters treats the logarithm as a *coordinate transformation*.
  *   If you are walking on a manifold, you choose coordinates that make the metric flat.
  *   If you are growing wealth multiplicatively, you choose the log coordinate to make the growth additive.
  *   Samuelson mocked the idea that this was "physics." But in stat mech, we do exactly this. We don't say a particle "prefers" Hamiltonian coordinates; we say Hamiltonian coordinates reveal the conservation laws. Similarly, log-wealth reveals the growth rate observable.

  ### The Verdict for a Stat Mech Veteran
  The Ergodicity Economics camp is right that this is distinct, because it changes the **null hypothesis** of economic modeling.
  *   **Standard Econ Null:** Agents maximize ensemble averages; deviations are "biases" or "preferences."
  *   **EE Null:** Agents maximize time averages; deviations are "errors" or "misunderstandings of the dynamics."

  For repeated, compounding bets, the ensemble average is a **symmetry breaking** event. The system is not ergodic. To treat it as such is to commit a category error similar to applying the microcanonical ensemble to a system with a non-conserved Hamiltonian.

  Maximizing time-average growth is superior not because the math is different (it often isn't), but because it grounds rationality in the **topology of the trajectory** rather than the **topology of the preference**. It asserts that there is an objective "correct" bet size determined by the market's dynamics, independent of the agent's feelings. For a physicist, that objectivity is the hallmark of a scientific law, whereas EUT remains a taxonomy of psychological states.

  In short: **EUT describes what an agent *wants*. Ergodicity Economics describes what the system *allows*.** In a non-ergodic world, the latter is the only one that keeps you in the game.
