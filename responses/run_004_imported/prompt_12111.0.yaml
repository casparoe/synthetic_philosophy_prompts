prompt: |-
  Spent 35 years doing statistical mechanics before I retired, so I thought I already understood what ergodic means, until I fell down a rabbit hole of "ergodicity economics" (Ole Peters and that crowd) a few months back. Their pitch is that Kelly betting -- maximizing the expected log of your wealth, i.e. the long-run geometric growth rate -- isn't just expected utility theory with a log-shaped utility function bolted on, its actually a different and more defensible notion of rationality, since ordinary expected-value reasoning quietly averages over a bunch of parallel copies of you that never existed instead of tracking what happens to the one real you across time. Samuelson thought this was nonsense and apparently even wrote a whole rebuttal paper using only one-syllable words just to mock the log-utility crowd, insisting it's just log utility dressed up in a physics costume, nothing deeper going on. I can't tell who's right here, so can you make the strongest possible case FOR the ergodicity/Kelly camp: that maximizing time-average growth is a genuinely distinct, and often superior, standard of rationality for repeated or compounding bets, not merely expected-utility maximization wearing a disguise?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Background:** 35 years in statistical mechanics, retired. This is crucial. They understand phase space, ensembles, time averages vs. ensemble averages, ergodicity breaking, etc., at a deep technical level. I don't need to explain basic stat mech concepts, but I do need to respect their expertise while bridging the gap to economics.
      *   **The Conflict:** Ergodicity Economics (Ole Peters et al.) vs. Traditional Expected Utility Theory (EUT), specifically regarding Kelly betting/Log utility.
      *   **The Specific Question:** Make the *strongest possible case FOR* the ergodicity/Kelly camp. Argue that maximizing time-average growth is a *genuinely distinct* and *superior* standard of rationality for repeated/compounding bets, *not* just EUT with log utility disguised.
      *   **Key Reference:** Paul Samuelson's rebuttal (the "one-syllable words" paper).
      *   **Goal:** Persuade a stat mech expert that the physics analogy adds substantive value beyond mathematical equivalence in specific contexts.

  2.  **Deconstruct the Core Debate:**
      *   *EUT View:* Rationality = Maximizing $E[U(W)]$. If $U(W) = \ln(W)$, you get Kelly. Why $\ln(W)$? Because of risk aversion axioms (von Neumann-Morgenstern). It's a subjective preference.
      *   *Ergodic View:* Rationality = Maximizing time-average growth rate $\langle g \rangle_t$. For multiplicative processes, $\langle g \rangle_t \neq E[\text{change}]$. The ensemble average (EUT default) is physically irrelevant for a single trajectory over time. Log utility emerges *dynamically*, not psychologically.
      *   *Samuelson's Critique:* It's just math. If you choose log utility, you get the same result. Calling it "ergodicity" is pretentious physics envy.

  3.  **Formulate the Argument (The "Strongest Case"):**
      *   *Acknowledge the Equivalence:* Start by admitting that mathematically, for a specific class of problems, they yield the same prescription. This builds trust with a physicist who values rigor.
      *   *The Crucial Distinction:* The *origin* of the logarithm.
          *   EUT: Psychological/axiomatic (I *like* log wealth).
          *   Ergodic: Dynamical/physical (The system *evolves* logarithmically).
      *   *The "One Real You" Argument:* This is the heart of Peters' pitch. Ensemble averages assume parallel universes. Time averages assume one history. In non-ergodic systems (which most economic processes are), these diverge.
      *   *The Stat Mech Bridge:* Use the user's background. Compare EUT to the Canonical Ensemble (fixed T, exchanging energy) vs. Ergodic Economics to the Microcanonical or a specific non-equilibrium trajectory. Actually, better: Compare Ensemble Average ($\langle X \rangle_{ens}$) vs. Time Average ($\langle X \rangle_{time}$). In stat mech, we assume ergodicity to equate them. In finance, ergodicity is *broken*.
      *   *Robustness & Calibration:* EUT requires calibrating a utility function (hard, subjective). Ergodicity requires calibrating the process dynamics (objective, measurable).
      *   *The "Ruin" Problem:* EUT can tolerate ruin if the ensemble average is high enough (St. Petersburg paradox style). Ergodicity forbids ruin because $\ln(0) = -\infty$ naturally falls out of the time average, not an arbitrary boundary condition.
      *   *Samuelson's Blind Spot:* Samuelson assumed the question was "What function maximizes utility?" Ergodicity asks "What function represents the observable growth?"

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the user's confusion. It *is* controversial. Acknowledge their stat mech background (speak their language).
      *   **Point 1: The Origin of the Logarithm (Ontology vs. Epistemology).** This is the big one. EUT says "You happen to have log utility." Ergodic says "The world is multiplicative, so growth is log." One is about the agent, one is about the environment.
      *   **Point 2: Non-Ergodicity is the Rule, Not the Exception.** In stat mech, we *hope* systems are ergodic. In wealth dynamics, they are structurally non-ergodic (multiplicative noise). The ensemble average is a fiction for a single agent.
      *   **Point 3: The "Ruin" Boundary Condition.** In EUT, you have to *add* a constraint to avoid bankruptcy. In Ergodicity, it emerges naturally from the dynamics ($\ln(0)$).
      *   **Point 4: Predictive Power vs. Post-Hoc Fitting.** EUT fits the utility function to the behavior (unfalsifiable). Ergodicity predicts behavior based on the process structure (falsifiable).
      *   **Point 5: Addressing Samuelson.** He was right about the math, wrong about the physics. He treated it as a preference ordering problem, not a dynamical systems problem.
      *   **Conclusion:** Summarize why this matters for a physicist. It restores physical realism to economic modeling.

  5.  **Refining the Tone:**
