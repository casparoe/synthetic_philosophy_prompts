  7.  **Final Polish:** Ensure the stat mech analogies are accurate. (e.g., comparing wealth trajectories to particle trajectories in a non-ergodic potential). Emphasize that in stat mech, we justify ensemble averages *because* of ergodicity. In economics, that justification is missing, so using ensemble averages is a category error.

