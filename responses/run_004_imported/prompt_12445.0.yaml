answer: |-
  Thank you all for being here.

  For those of you who knew my aunt only as a sister, a grandmother, or a guest at your holiday table, you might be wondering what to make of a life spent in the shadows of syllogisms and symbols. And for those of you who knew her as a colleague, a mentor, or a fellow traveler in the department, you know that for her, logic was never cold. It was the warmest thing she knew. It was her way of caring about the truth.

  We are a room divided, in a sense. Half of you know what a "modal operator" is. The other half are just wondering if there will be casserole after the service. But my aunt spent forty years building bridges between those two worlds. She believed that rigorous thinking wasn't a barrier to connection, but a form of it. To argue with her was to be heard. She never wanted to win a point; she wanted to make sure the structure holding the point was sound.

  Now, I have been given specific instructions regarding the story she loved to tell at family dinners. For decades, at Thanksgiving and Christmas, she would hold forth on Gödel's ontological proof. To the family, she presented it as a puzzle: *Can you define perfection so precisely that existence becomes a requirement?*

  To her colleagues, she was discussing positive properties and S5 modal systems. But to everyone, she was teaching the same lesson: The difference between an argument that *works*, and an argument that is *true*.

  She loved to talk about the news from 2013, when headlines claimed computer scientists had proven God exists. She would put down her fork and gently correct the record. The computer had confirmed the argument was *valid*—that the conclusion followed from the premises. It did not confirm the premises were *sound*. It showed the math was clean, not that the universe was obligated to obey it.

  She found the argument beautiful. She also found it flawed. Specifically, she would lean in and point out the "modal collapse." If Gödel's axioms hold, she'd say, then not only does a necessary being exist, but *everything* that happens becomes necessary. There is no contingency. No choice. Every spilled glass of milk was written into the fabric of reality from the beginning.

  She didn't believe that. She believed in choice. She believed in accident. And she believed in the integrity of saying "I don't know."

  I need to be precise about this, because she asked me to be. My aunt was an atheist. She remained one to the end. There was no deathbed conversion, no sudden acceptance of the conclusion she spent a lifetime analyzing. She didn't reject faith out of bitterness, but out of the same rigor she applied to her work. She valued honesty over comfort. She taught us that it is better to stand firmly in a difficult truth than to rest comfortably in a beautiful lie.

  And yet, she never treated belief as a punchline. She never mocked those who found what she did not. She simply held her ground, with kindness, on the terrain of evidence.

  So, how do we mourn a woman who spent her life distinguishing between what is possible, what is contingent, and what is necessary?

  In modal logic, a "necessary truth" is something that is true in every possible world. It cannot be otherwise.

  Looking around this room, seeing the colleagues who respected her mind and the family who loved her heart, I think we can identify one necessary truth. In every possible world where she existed, she sought clarity. In every possible world, she listened more than she spoke. And in every possible world, she loved us.

  The specifics of our lives are contingent. We are here today, and not tomorrow. The time and place are accidents of history. But the impact she had on us? The rigor she instilled in us? The way she taught us to question, to verify, and to care about the structure of what we believe? That feels necessary.

  She taught us that validity is not enough; we need soundness. We need premises grounded in reality. Let our premise be this: She was here. She was brilliant. She was kind. And let the conclusion be the way we live our own lives—with enough courage to admit when we are wrong, and enough grace to seek what is true.

  Thank you.
