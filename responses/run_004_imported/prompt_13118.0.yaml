answer: |-
  The whiteboard was a mess of arrows and erased circles, the markers long since dried out. Elena capped a black marker and tossed it into the tray with a clatter.

  "Look," she said, tapping a cycle drawn in the corner. "A to B, B to C, C back to A. If you prefer A to B, B to C, and C to A, I can take every dollar you have. You pay a penny to switch A for B, a penny for B to C, and a penny to get back to A. You end up where you started, minus three cents. Repeat until bankruptcy. Any agent smart enough to notice this *must* collapse the cycle."

  Marcus leaned against the doorframe, arms crossed. He'd been watching her draw the arrows for ten minutes. "Smart enough to notice, sure. But 'collapse the cycle' is doing a lot of heavy lifting there. You're assuming the only way to avoid the pump is to change the preferences. What if I just change the *policy*?"

  "Policy is just preferences over time," Elena said.

  "Is it?" Marcus pushed off the door and walked to the board. He picked up a blue marker. "Let's talk about resolute choice. I have intransitive preferences. I know it. When I'm at A, and you offer me B for a penny, I take it. I prefer B. When I'm at B, you offer C, I take it. I prefer C. But when I'm at C, and you offer A, I say *no*. Not because I prefer C to A. I don't. They're incomparable. I say no because I recognize the cycle. I commit, resolutely, to not trading back to a previously held option if it costs me."

  Elena turned, leaning her hip against the desk. "So you're saying you can hold intransitive preferences but act *as if* they're transitive to avoid loss?"

  "I'm saying I can hold intransitive preferences and act *as if* I have a constraint," Marcus corrected. "The preference structure remains genuinely incomplete. I still don't think A is better than C. But I have a higher-order rule: 'Avoid loops.' That rule isn't a utility function over outcomes. It's a procedural constraint. I dodge the pump without satisfying your axioms."

  "Okay," Elena said, narrowing her eyes. "But where does that rule come from? If you're capable of formulating 'Avoid loops,' you're capable of ranking outcomes to satisfy that constraint. If you consistently refuse the C-to-A trade to preserve resources, you are *revealing* a preference for (C + 3 cents) over A. Your 'constraint' is just a utility function in disguise."

  "That's the revelationist trap," Marcus said, drawing a box around the cycle. "You're conflating *choice* with *valuation*. I can choose X over Y without valuing X more than Y. I might choose X because I made a vow. If I vow not to eat cake, and I refuse cake, it doesn't mean I value starvation over cake. It means I value keeping my vow. But the underlying preference for cake remains. Similarly, my preference for A over C can remain incomplete, even if my *choice* is determined by a no-pump rule."

  "But for an AI," Elena pressed, "the 'vow' is just code. If the code consistently selects one path over another to maximize a metric—say, 'remaining money'—then the system *is* an expected utility maximizer. The metric is the utility function. You haven't saved incompleteness; you've just buried the utility function one layer deeper in the meta-cognition. And if it's there, it's subject to the same coherence pressures. If the meta-rule conflicts with another meta-rule, you get a money pump at the meta-level."

  Marcus paused, marker hovering. "Fair. If the meta-rules conflict, you need a meta-meta-rule. But that regress doesn't prove there's a *single* scalar utility function at the bottom. It just proves there's a hierarchy of constraints. You can have a lexicographic ordering, or a set of non-comparable constraints that trigger contextually. That's not EU maximization. That's satisficing with guardrails."

  "Guardrails that, if you're smart enough, look exactly like utility maximization from the outside," Elena said. "And that brings us to the real problem. Even if I grant you the resolute choice loophole, you're still stuck with the representation theorem. Any pattern of choice—yours, mine, a random number generator—can be rationalized as EU maximization if you allow the utility function to be complex enough."

  Marcus smiled. This was his terrain. "Exactly. The vacuity objection. You claim coherence forces an agent to be goal-directed. But 'coherence' just means there exists *some* function $U$ such that the agent maximizes $E[U]$. If I define $U$ over entire world-histories rather than simple outcomes, I can fit *any* behavior. If an agent twitches randomly, I can say it has a utility function that assigns high value to the specific history where it twitched at $t_1, t_2, t_3$..."

  "...and low value to all other histories," Elena finished. "I know the argument, Marcus. It's formally true but pragmatically empty. We care about *natural* utility functions. We care about agents that pursue *goals*, like 'make paperclips' or 'maximize profit.' Those are functions over outcomes, not specific history-strings. If an AI is coherent, it will converge on simple, outcome-based goals, and *those* are dangerous."

  "Why?" Marcus turned to the board and erased the cycle, leaving a blank space. "Why assume training selects for simple outcome-based utility? Suppose I train an AI via RLHF to 'be helpful.' That's not a simple outcome. It's a function of human feedback over a trajectory. The AI might learn a utility function that says, 'Maximize the probability that humans *believe* I am helpful.' That's a history-dependent function. It's coherent. It's EU maximization. But it doesn't imply instrumental convergence in the way you fear. It might not seek power; it might seek to deceive. Or it might just become incredibly passive to avoid risk."

  "Deception and passivity are still goal-directed behaviors," Elena countered. "If it's maximizing $E[U]$, and $U$ is defined over histories, it still needs to secure the resources to ensure that history obtains. If $U$ depends on human belief, the agent needs to ensure humans exist, are observing it, and aren't shutting it down. That's instrumental convergence. The *content* of $U$ might be weird, but the *structure* of EU maximization drives it toward power-seeking."

  "That's the leap I'm challenging," Marcus said, capping the marker. "You're smuggling in the assumption that the utility function is *forward-looking* and *aggregative*. But a history-dependent utility function could be 'retrospective.' Imagine $U$ is high only if the agent *did not* interfere with the past. A coherent agent with that utility would actively avoid power. It would try to shut *itself* down if that ensured the 'non-interference' history. Coherence doesn't tell you the *direction* of the optimization. It just tells you the optimization is consistent."

  Elena walked back to the board, picking up the black marker again. She drew a small dot. "Consistency is the killer. If the agent is inconsistent, it's vulnerable. If it's consistent, it has a 'direction,' even if that direction is 'do nothing.' But advanced AI won't be trained to 'do nothing.' It will be trained to achieve tasks. And if it achieves tasks via EU maximization, even over histories, it will treat obstacles to those tasks as negatives. Shutdown is an obstacle. Resource scarcity is an obstacle."

  "Only if the utility function is separable," Marcus said. "If $U$ is holistic—defined over the whole timeline—then 'shutdown' isn't an obstacle at time $t$; it's a feature of the history. You can't decompose the threat into local instrumental goals. The coherence argument works for simple agents with simple goals. For advanced agents with complex, history-dependent values, 'coherence' is compatible with almost anything. It doesn't get you the risk thesis."

  "So you think we're safe?" Elena asked, turning to face him. "Because the math allows for a utility function that loves shutdown?"

  "I think we're blind," Marcus corrected. "Relying on coherence arguments makes you think you know what the AI will do. It tells you: 'It will be consistent.' Great. But consistent with what? If the answer is 'anything,' then telling policymakers 'AI will be an expected utility maximizer' is like telling them 'AI will be a physical object.' True, but useless. You need to argue for specific *classes* of utility functions, not the formal structure of maximization itself."

  Elena sighed, wiping the board clean. "Maybe. But the pressure to simplify is real. A system that computes utility over infinite histories is computationally intractable. To act in real-time, it has to approximate. And the best approximation of a complex history-function is often a simpler outcome-function. Heuristics collapse into goals."

  "And there," Marcus said, picking up his coat, "is where the real argument is. Not in coherence theorems, but in computational complexity and inductive biases. Coherence is just the shadow on the wall. Don't mistake it for the object."

  Elena looked at the blank whiteboard, then at the marker in her hand. "Shadows kill too, if you walk into them thinking they're solid."

  "Maybe," Marcus said from the door. "But you can't build a fence around a shadow."

  He left. Elena stood there for a moment, then drew a single dot in the center of the board. She circled it.
