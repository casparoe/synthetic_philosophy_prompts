  I spent almost 40 years as a research chemist, and now that I'm retired I've been filling my time reading about decision theory and probability puzzles for fun (a bit of a late-life pivot, I know). The one that's been rattling around in my head lately is the absent-minded driver problem - the guy who has to take the second of two identical-looking highway exits to get home, but can't tell from inside the car whether he's already passed the first intersection, because his memory just isn't built to distinguish the two. I mentioned it to a friend and she said it reminded her a lot of the Sleeping Beauty problem, which I'd run into a few months back and never fully got my head around, so now I can't stop wondering if that's actually true or just a surface-level resemblance - could you compare the two properly for me? Specifically, is the split between the "plan-ahead" optimal answer and the "reason-it-out-once-your-at-the-intersection" answer in the driver problem doing the same work as the halfer/thirder split in Sleeping Beauty, or are imperfect recall and anthropic self-location secretly answering two different questions that just happen to look alike? Which one do you think is the genuinely deeper puzzle, and why?
