      *   *Thesis:* Inverting the priority does *not* genuinely dissolve the difficulty. It transforms the "Combination Problem" into the "Decomposition Problem" (or Segmentation Problem), which is of comparable severity. While it solves subject-summing, it introduces severe issues regarding individuation and the "masking" of cosmic experience.
