  ok this is a weird one but it's actually been bugging me for weeks. I moved into a forecasting role at work a few months back (basically a corporate version of those IARPA tournaments), and onboarding meant calibration training where every forecast gets graded with a Brier score. Wanting to know why Brier score specifically, I fell down a rabbit hole into accuracy-first epistemology / epistemic utility theory: Joyce's argument that credences should obey the probability axioms because incoherent ones are "accuracy-dominated," which requires the scoring rule to be strictly proper. Turns out strictly proper rules have this "immodesty" property baked in - whatever credence you currently hold will always calculate itself as the uniquely best option in expectation, no exceptions.

