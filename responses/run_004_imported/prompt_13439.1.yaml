  Jessie Fauset: As the literary editor of *The Crisis*, she championed novels like *Plum Bun* that adhered to Du Bois's vision of using fiction to demonstrate Black respectability and counter stereotypes.

  Alain Locke: In his essay "Beauty Instead of Ashes," he argued that art must prioritize aesthetic excellence over didactic messaging to effectively serve the cause of racial advancement.

  Countee Cullen: During a 1926 *Opportunity* symposium, he expressed deep ambivalence about being labeled a "Negro poet," stating he wished to be known simply as a "POET."

  Langston Hughes: His 1926 manifesto "The Negro Artist and the Racial Mountain" explicitly rejects the older generation's pressure to conform to racial expectations in favor of individual artistic freedom.

  Claude McKay: He publicly resented Du Bois's negative review of *Home to Harlem*, which criticized the novel for failing to provide the kind of uplifting propaganda Du Bois demanded.

  Zora Neale Hurston: In her essay "How It Feels to Be Colored Me," she declares she is not "tragically colored" and refuses to bear the burden of racial representation in her work.

  George Schuyler: His satirical essay "The Negro-Art Hokum" argues that there is no such thing as distinct Negro art, directly undermining the premise that Black art must serve a unique racial mission.
