          *   EV of other envelope = $0.5(2A) + 0.5(A) = 1.5A$.
          *   They are equal.
          *   Nora's error: She conditions on the observed value $X$. She assumes $P(\text{I have smaller} | \text{Value}=X) = 0.5$. This is only true if the prior distribution of money satisfies specific conditions (which usually aren't true for all $X$).

  7.  **Finalizing the Structure:**
