prompt: |-
  For a seminar on social ontology and the philosophy of norms, I have been reading David Lewis's Convention, and I think I have worked out a general way of using his account to predict how resistant a given social practice will be to change. On Lewis's definition, a regularity counts as a convention, rather than as a rule imposed by nature or necessity, only if several conditions hold together: people generally conform to it, it is common knowledge that they do, each person prefers to conform on condition that others do (so that the regularity solves a coordination problem), and, crucially, at least one alternative regularity could in principle have solved that same coordination problem just as well. This last requirement is Lewis's arbitrariness condition, and it is meant to mark off genuine conventions from regularities that hold simply because the situation leaves no real alternative.

  It seems to follow fairly directly that arbitrariness, in this specific sense, should track how easy a practice is to change: if nothing about the underlying coordination problem favors the status quo regularity over some alternative, then a population that wants to switch should be able to do so with relatively little friction, just by enough people coordinating on the alternative instead. Practices that persist for some other, non-arbitrary reason should by contrast be comparatively rigid. I mentioned this to a couple of classmates and they found it fairly intuitive as well, so we started testing it on a couple of standard illustrations of his view, such as driving-side conventions and the pairing of words with meanings within a shared language.

  Here is where I would like your help: does identifying a practice as "arbitrary" in Lewis's technical sense really support the conclusion that it should be comparatively easy to shift away from, once a population recognizes it as arbitrary? And if so, how should I square that with the fact that practices like driving-side conventions and word meanings are, if anything, notoriously hard to change from within a population, short of some external shock or coordinated edict? I would like to know whether the trouble lies in my reconstruction of Lewis's view, in the further inference from arbitrariness to ease of change, or somewhere else entirely.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Seminar on social ontology and philosophy of norms.
      *   **Source Material:** David Lewis's *Convention* (1969).
      *   **User's Hypothesis:** Lewis's condition of *arbitrariness* (the existence of at least one alternative regularity that could solve the coordination problem equally well) implies *ease of change*. If a practice is arbitrary, it should be easy to switch if the population wants to.
      *   **Observation/Counter-example:** Standard Lewisian examples (driving side, language) are notoriously *hard* to change, despite being arbitrary.
      *   **Question:** Does identifying a practice as "arbitrary" in Lewis's sense support the conclusion that it is easy to shift? If not, where is the error? (Reconstruction of Lewis? Inference from arbitrariness to ease of change? Elsewhere?)

  2.  **Deconstruct Lewis's Theory of Convention:**
      *   **Definition:** A convention is a regularity $R$ in population $P$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *if* others do (conditional preference).
          4.  There is at least one alternative regularity $R'$ that could have served the same purpose (Arbitrariness).
          5.  (Common Knowledge of 1-4).
      *   **Key Insight:** Conventions solve *coordination problems*. The payoff structure is such that matching others is more important than *which* option is chosen.
      *   **Equilibrium:** Conventions are Nash Equilibria. Once established, no individual has an incentive to deviate unilaterally.

  3.  **Evaluate the User's Hypothesis (Arbitrariness $\rightarrow$ Ease of Change):**
      *   *Intuition:* If $R$ and $R'$ are equally good, why stick with $R$?
      *   *Lewis's Reality:* The fact that $R$ and $R'$ are *ex ante* equally good does not mean they are *ex post* equally good once $R$ is established.
      *   *The Trap:* The user is conflating *substitutability in the abstract* with *interchangeability in practice*.
      *   *Path Dependence:* Once a convention is established, the payoff structure changes. Conforming to $R$ yields high utility because others conform. Switching to $R'$ unilaterally yields low utility (crash, misunderstanding).
      *   *Coordination Barrier:* To switch from $R$ to $R'$, you need a *mass* simultaneous switch, not just individual willingness. This is hard to organize without a focal point or external shock.

  4.  **Identify the Core Philosophical Issue:**
      *   The user is confusing the *origin* of the convention (which is arbitrary) with the *stability* of the convention (which is robust).
      *   Lewis explicitly discusses stability. Conventions are *self-perpetuating*.
      *   The "arbitrariness" condition distinguishes conventions from natural laws or technical necessities (e.g., you *must* press the brake to stop a car, that's not arbitrary; you *must* drive on the right to avoid crashes given others do, that *is* arbitrary regarding left vs. right, but necessary given the equilibrium).

  5.  **Formulate the Response Strategy:**
      *   **Validate:** Acknowledge the sophistication of the question. It's a classic tension in social ontology.
      *   **Correct the Inference:** The move from "arbitrary origin" to "easy change" is the weak link.
      *   **Explain Lewis's Equilibrium:** Use game theory concepts (Nash Equilibrium) to explain *why* arbitrary conventions are sticky.
      *   **Distinguish Ex Ante vs. Ex Post:** Before the convention, Left and Right are equal. After the convention, Right is superior *because* it is the convention.
      *   **Address the "Ease of Change":** Changing a convention requires solving a *new* coordination problem. It's not just about preference; it's about expectations.
      *   **Introduce "Focal Points" (Schelling):** How do we switch? We need a new focal point.
      *   **Nuance on "Resistance":** Differentiate between *individual* resistance (incentive to deviate) and *collective* resistance (difficulty of re-coordination).
      *   **Suggest Refinements for the Seminar:** How to frame this argument productively. Maybe look at Ullmann-Margaret or Gilbert for contrasting views on norms vs. conventions.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Point 1: The Definition.* Confirm the user understands Lewis's arbitrariness correctly. Yes, it means an alternative *could have* worked.
      *   *Point 2: The Inference Error.* The error is thinking that because $R'$ *could have* worked, it *can* work now. Lewis says the payoff depends on *others'* actions.
      *   *Point 3: Hysteresis/Path Dependence.* Once established, the convention creates its own justification. This is the "normative force" of conventions without moral content.
      *   *Point 4: The Transition Problem.* Switching requires a period of mismatch. During the transition, utility drops. Rational agents avoid this.
      *   *Point 5: External Shocks.* The user mentioned "external shock or coordinated edict." This aligns with Lewis. He acknowledges that without a new focal point, the old equilibrium holds.
      *   *Point 6: Seminar Advice.* Suggest looking at the difference between *conventions* (Lewis) and *norms* (Gilbert/Ullmann-Margaret). Norms might have added pressure (obligation) that makes them stickier, but even Lewisian conventions are sticky due to coordination payoffs.

  7.  **Refining the Tone:**
      *   Academic, supportive, precise.
      *   Avoid jargon where possible, but use game-theoretic terms where necessary (Nash Equilibrium, Payoff Matrix).
      *   Ensure the distinction between "arbitrary" (in the abstract) and "contingent" (in practice) is clear.

  8.  **Final Review against User Query:**
      *   Did I answer if arbitrariness supports ease of change? (No).
      *   Did I explain why driving/language are hard to change? (Yes, equilibrium stability).
      *   Did I locate the error? (Yes, in the inference from arbitrariness to interchangeability).

  9.  **Self-Correction/Edge Case:**
      *   *Wait, does Lewis ever say conventions are easy to change?* He suggests they *can* change, but implies it requires a shift in expectations. He doesn't claim it's *easy*.
      *   *Is there a sense in which they ARE easy?* Maybe compared to laws of nature? Yes, but that's a low bar. Compared to other social structures? Maybe not.
      *   *Make sure to mention Common Knowledge.* The stability relies on everyone knowing everyone knows. Breaking that is hard.

  10. **Final Polish:** Structure the response logically: Diagnosis, Lewis's Actual View (Equilibrium), The Transition Problem, and Seminar Suggestions. (Proceed to generate output).

  *(Self-Correction during drafting)*: I should be careful not to conflate Lewis with later social ontology (like Searle or Gilbert) unless it helps clarify Lewis. Stick primarily to Lewis to answer the specific textual question, then broaden for the seminar context.

  *(Key Insight to emphasize)*: Arbitrariness explains *why this rather than that* initially. Stability explains *why this stays this*. The user is using the explanation for the origin to predict the dynamics of maintenance/change. That's the category mistake.

  *(Final Plan)*:
  1. Validate the reading of "arbitrariness."
  2. Pinpoint the logical gap (Ex Ante vs. Ex Post).
  3. Explain the Game Theoretic Stability (Nash Equilibrium).
  4. Discuss the "Transition Cost" (The coordination problem of changing conventions).
  5. Offer seminar talking points (Path dependence, Focal Points, Norms vs. Conventions).
answer: |-
  This is an excellent question that cuts to the heart of how game-theoretic models apply to social reality. You have reconstructed Lewis's definition of **arbitrariness** correctly: a convention is arbitrary if there is at least one alternative regularity that *could have* served the same coordination function.

  However, the trouble lies in your **inference from arbitrariness to ease of change**.

  While it is intuitive to think that "arbitrary" implies "fragile" or "easily swapped," Lewis's model actually predicts the opposite: **Arbitrary conventions are often among the most stable social practices precisely because they are solutions to coordination problems.**

  Here is a breakdown of where the inference goes wrong, how Lewis accounts for the stability of driving-side and linguistic conventions, and how you might frame this for your seminar.

  ### 1. The Category Mistake: *Ex Ante* vs. *Ex Post*
  Your hypothesis conflates the **selection** of a convention with the **maintenance** of a convention.

  *   **Ex Ante (Before the convention):** You are correct. Before anyone drives on any side, "Left" and "Right" are functionally equivalent. The choice is arbitrary. In this state, switching costs are zero.
  *   **Ex Post (After the convention):** Once the population converges on "Right," the payoff structure changes. "Right" is no longer equivalent to "Left." "Right" yields high utility (safety, smooth traffic); "Left" yields negative utility (crashes, confusion).

  Lewis's arbitrariness condition only requires that an alternative *could have* worked in the abstract. It does not require that the alternative *can* work once the first convention is entrenched. Therefore, identifying a practice as arbitrary tells you about its **history**, not its **current inertia**.

  ### 2. Conventions as Nash Equilibria
  To understand why arbitrary conventions are hard to change, you have to look at the game-theoretic engine driving Lewis's account. Conventions are **Nash Equilibria**.

  In a coordination game (like driving), a Nash Equilibrium is a state where no individual player can improve their outcome by unilaterally changing their strategy.
  *   If everyone drives on the right, and you switch to the left, you crash.
  *   Therefore, even though the rule is arbitrary, your preference to follow it is **conditional** and **rigid**.

  The resistance to change does not come from the content of the rule (which is arbitrary) but from the **structure of expectations**. As long as I expect you to drive on the right, and you expect me to, neither of us has a rational incentive to deviate. The "arbitrariness" is locked in by the "common knowledge" of conformity.

  ### 3. The Problem of Transition (The "Valley" of Coordination)
  This is the crucial point for your seminar argument. Changing a convention is not a matter of individuals independently deciding to switch; it is a matter of solving a **new coordination problem**.

  To switch from Regularity $R$ to Regularity $R'$, the population must pass through a transition period where expectations are misaligned.
  *   If 10% of the population switches to the new convention, their utility plummets (they are now the ones crashing or speaking an unintelligible dialect).
  *   Rational agents will not enter this "valley" of low utility unless they are certain that *everyone else* will jump simultaneously.

  This creates a massive **status quo bias**. The difficulty in changing driving sides or language isn't despite their arbitrariness; it is a feature of the coordination dynamics that arbitrary conventions instantiate. Lewis acknowledges this: conventions persist because they are self-perpetuating systems of expectations.

  ### 4. Where "Ease of Change" Might Actually Apply
  Is there any sense in which your intuition holds water? Yes, but only under specific conditions regarding **focal points** (a concept Lewis borrows from Schelling).

  An arbitrary convention is easier to change than a **non-arbitrary necessity** *if* you can introduce a new, salient focal point that coordinates the shift.
  *   **Example:** If a central authority (the state) declares, "Next Tuesday, we all switch to the left," and this becomes common knowledge, the switch can happen overnight (as occurred in Sweden in 1967, *Dagen H*).
  *   **Contrast:** You cannot issue an edict to change the law of gravity, nor can you easily change a practice grounded in physical necessity (e.g., "stand up to be seen in a theater").

  So, arbitrary conventions are **plastic** (they *can* be changed by coordinated fiat) but **sticky** (they resist incremental, organic change). Your classmates' intuition that they are "hard to change" refers to organic change; your intuition that they are "easy to change" refers to the lack of metaphysical or physical necessity. Both are true, but they apply to different mechanisms of change.

  ### 5. Seminar Strategy: Refining the Hypothesis
  For your seminar, I suggest refining your hypothesis rather than abandoning it. You can argue that Lewis's account predicts a specific **profile of resistance**:

  1.  **Resistance to Unilateral Deviation:** High. (Because it's a coordination equilibrium).
  2.  **Resistance to Coordinated Shift:** Low. (Because there is no underlying necessity preventing the new state).
  3.  **Resistance to Incremental Drift:** High. (Because partial shifts destroy the utility of the convention).

  This allows you to distinguish Lewisian **Conventions** from other social ontological categories:
  *   **vs. Technical Norms:** (e.g., "tighten the bolt to 50Nm"). These are not arbitrary; they are dictated by physics. They are hard to change because the world resists.
  *   **vs. Moral Norms:** (e.g., "do not kill"). These often persist even without coordination payoffs (people obey even when they could get away with it). Lewisian conventions collapse without the coordination payoff.
  *   **vs. Lewisian Conventions:** These persist *only* because of the coordination payoff, making them robust against individual whim but vulnerable to mass re-coordination.

  ### Summary for your Argument
  You should argue that the trouble lies in the **inference from arbitrariness to ease of change**.
  *   **Lewis's View:** Arbitrariness explains why *this* convention exists rather than *that* one. It does not explain why the convention is easy to dislodge.
  *   **The Correction:** Arbitrariness implies **interchangeability in principle**, not **interchangeability in practice**. Once established, the convention creates its own necessity through the network of expectations.
  *   **The Prediction:** Lewis's model predicts that arbitrary conventions will be **stable against individual deviation** but **vulnerable to correlated shifts in expectation** (focal points).

  This nuance will show your seminar group that you have grasped not just the definition of convention, but the dynamic implications of the game theory underlying it. It transforms a potential counter-example (driving is hard to change) into a confirmation of the theory (driving is a high-stakes coordination equilibrium).
