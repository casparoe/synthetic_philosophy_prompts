      *   *Section 3: The Surprising Permissiveness.* Focus on accessibility and anti-elitism. Tolstoy hated technical virtuosity without soul. AI might strip away the "virtuosity" barrier.
      *   *Section 4: The New Problems.* The epistemology of sincerity (can we know?), the recycling of feelings (training data), and the definition of "human union."
