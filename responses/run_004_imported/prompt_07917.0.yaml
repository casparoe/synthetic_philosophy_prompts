answer: |-
  **Princeton, New Jersey. Late October 1955.**

  **The setting:** *A private study at the Institute for Advanced Study. Late afternoon. The light is failing, casting long shadows across shelves of bound journals. An ashtray overflows with lipstick-stained filters and plain whites. JOHN VON NEUMANN sits behind a desk cluttered with government reports. He looks thinner than in the photographs from a few years prior, his suit hanging slightly loose on his frame. NORBERT WIENER paces near the window, clutching a pipe he has not lit.*

  **WIENER**
  I read the *Fortune* pieces, Johnny. "Can We Survive Technology?" A provocative title. For a magazine that usually tells businessmen how to sell more refrigerators.

  **VON NEUMANN**
  (Smiling faintly)
  It pays better than the *Bulletin of the Atomic Scientists*, Norbert. And it reaches the men who actually decide where the refrigerators go, and where the bombs fall.

  **WIENER**
  You argue that we cannot put the genie back in the bottle. That prohibition is a fantasy.

  **VON NEUMANN**
  It is a mathematical certainty. If a technology is physically possible, it is inevitable. In a world divided into two armed camps, if we forbid ourselves a certain path, we do not stop the path. We merely cede it to the other side. You know this. You worked on the anti-aircraft predictors. You know that once the control mechanism exists, it belongs to history.

  **WIENER**
  (Stops pacing, turns sharply)
  I know that I refused to let my work on servo-mechanisms circulate freely after the war. I withheld the data. I told my colleagues that to automate the decision to kill is to remove the human from the loop, and I would not be the architect of that removal.

  **VON NEUMANN**
  And yet, the missiles fly. Without your specific equations, perhaps, but they fly. Your refusal did not stop the technology. It only stopped *you*.

  **WIENER**
  It kept my hands clean.

  **VON NEUMANN**
  (Leans forward, resting his elbows on the desk)
  Clean hands are a luxury of the observer. I am interested in the survival of the observer. My argument in *Fortune* is not that we should love the technology. It is that we must manage the *environment* in which the technology exists. We cannot ban the knife, so we must police the brawl. We must rely on political skill, on deterrence, on making adequate decisions crisis after crisis. There is no final fix, Norbert. There is only the next decision.

  **WIENER**
  And that is where your realism becomes a narcotic. "The next decision." You reduce the apocalypse to a series of administrative errors. You tell the scientist: *Do not worry about the seed you plant. Worry only about how you prune the hedge later.* This lets us off the hook. It says that complicity is irrelevant, provided one is clever enough to manage the consequences.

  **VON NEUMANN**
  Complicity is irrelevant if the alternative is extinction. If I refuse to calculate the blast radius, someone else will. If I refuse to design the logic for the interception system, the Soviets will not. They are not waiting for your permission.

  **WIENER**
  (Voice rising)
  But if we all refused? If the community of minds said *no*?

  **VON NEUMANN**
  (Laughs softly, a dry sound)
  There is no "community of minds." There are nations. There are ideologies. You are asking for a one-time safeguard—a moral embargo—that holds across a divided world. It cannot be enforced. You cannot verify a conscience. You can verify a warhead.

  **WIENER**
  So we are trapped. We must run faster and faster just to stay in the same place, making "adequate decisions" until inevitably, by your own game theory, the probability of error approaches one.

  **VON NEUMANN**
  (His smile fades. He picks up a cigarette, hesitates, then puts it back.)
  You press me hard. Very well. You want the concession?

  **WIENER**
  I want the truth, not the strategy.

  **VON NEUMANN**
  The truth is that my system requires us to be right every single time.

  *(Wiener stops moving. He stares at von Neumann.)*

  **VON NEUMANN**
  (Continuing)
  You heard me. My argument rests on the assumption of rational actors managing irrational tools. But the tools accelerate the timeline. The crises come faster than the committees can meet. I argue for political skill, for patience... but I know the margin for error is vanishing. We are building a machine that demands perfection from creatures made of fallibility. I do not believe we can sustain it forever. But I do not see a better option than trying.

  **WIENER**
  (Quietly)
  Then you admit it. Your "management" is a delay tactic. It buys time, but it does not solve the problem.

  **VON NEUMANN**
  It buys life. That is all history ever does. Now, your turn.

  **WIENER**
  My turn?

  **VON NEUMANN**
  You sit on your high ground of ethical refusal. You withhold your papers. You feel pure. But if your refusal changes nothing about the missile's trajectory, if the technology arrives regardless of your conscience... then what is your refusal actually *for*?

  **WIENER**
  (Shifts uncomfortably, touches the unlit pipe)
  It is for the soul. Of the scientist. Of the society.

  **VON NEUMANN**
  Abstract. Be concrete. If the Soviets build a cybernetic system that automates retaliation, and we do not, because our best minds followed your lead and refused the work... we die. Your purity becomes our grave.

  **WIENER**
  (He looks out the window at the darkening lawn)
  I concede... that my refusal may not save the world. It may not even save a single life. It is possible that by withholding the logic of control, I make our systems less stable, more prone to the very accidents you fear.

  **VON NEUMANN**
  So you admit it is symbolic.

  **WIENER**
  (Turns back, eyes fierce)
  I admit it does not stop the bomb. But it stops *me* from becoming a component of the bomb. You say we must manage the technology. I say the technology manages us. It dictates our politics, our timelines, our fears. If I refuse, I am declaring that the human will is not yet fully subordinated to the machine's logic. Even if it is futile. *Especially* if it is futile.

  **VON NEUMANN**
  (He leans back, closing his eyes for a moment, looking suddenly exhausted)
  Futility is a heavy price.

  **WIENER**
  Complicity is heavier.

  **VON NEUMANN**
  Perhaps. But when the phone rings at three in the morning, and the question is whether to launch or to wait, they will not call the ethicist. They will call the man who calculated the odds. And I will have to give them an answer.

  **WIENER**
  And I will have to live with the fact that I did not give them the tools to make that call automatic.

  *(A long silence settles between them. The clock on the mantle ticks, loud in the quiet room.)*

  **VON NEUMANN**
  We are not friends, Norbert.

  **WIENER**
  No. We are witnesses.

  **VON NEUMANN**
  (He picks up a pen, twirling it between his fingers)
  I will continue to argue for management. For the hard, ugly work of keeping the balance.

  **WIENER**
  And I will continue to argue that some doors should remain locked, even if the house is burning.

  **VON NEUMANN**
  Then we shall see which of us is right. Though I suspect we will not be here to read the verdict.

  **WIENER**
  (Nods slowly)
  No. We will not.

  *(Wiener finally lights his pipe. The sulfur match flares bright in the dim room, illuminating von Neumann's pale, sharp face for a second before settling into a dull glow. Wiener turns and walks to the door. Von Neumann watches him go, then turns back to the papers on his desk, picking up the cigarette he previously rejected.)*

  **[SCENE END]**
