answer: |-
  Two Ideal Epistemic Agents, Alice and Bob, are locked in a room with a single door. The door will open only if they both press a button at the exact same time. They cannot communicate, but they share a perfect view of a clock on the wall.

  A human observer watches them on a monitor. For six hours, Alice and Bob stare at the clock, motionless. Finally, the observer breaks into the room.

  "Why didn't you press the button?" the observer asks. "You both saw the clock. You both know the rule. It was a classic coordination game."

  Alice sighs. "We *Commonly Know* the solution. I know the time, Bob knows the time, I know that Bob knows the time, Bob knows that I know that Bob knows the time... ad infinitum."

  "Exactly," says the observer. "So you knew when to press it."

  "Technically, yes," says Bob. "The optimal timestamp is a logical consequence of our Common Knowledge base. Since we are modeled as Ideal Agents, our belief sets are closed under implication. Therefore, the timestamp is already in our belief sets."

  "Then why are you still standing here?"

  Bob looks at Alice. Alice looks at Bob.

  "Because," says Alice, "while our belief sets *contain* the timestamp, our processors haven't finished deriving it from the axioms yet."

  The observer blinks. "So you don't actually know it."

  "No, no," Bob corrects him. "We *do* know it. In the formal model, we've known it since the moment we entered the room. The fact that deriving it requires more computational cycles than exist in the observable universe is irrelevant to the truth-value of our belief state."

  "So you're logically omniscient," says the observer, "but functionally paralyzed."

  "Precisely," says Alice. "We suffer from the Problem of Logical Omniscience. We know everything that is true, we just can't find anything in the database."

  Bob checks his watch. "Also, I just derived that we're going to starve before we finish iterating through the consequences of this conversation."

  "Did you write that down?" asks the observer.

  "No," says Bob. "I believe it. That's enough."
