answer: |-
  The short answer is: **The pop math book you read was misleading (or incorrect).**

  Paul Cohen did **not** prove that the Continuum Hypothesis (CH) is false. He proved that it is **independent** of the standard axioms of set theory.

  Here is the detailed breakdown of why there is confusion, what actually happened, and why mathematicians still talk about it as an "open" question in a philosophical sense.

  ### 1. What Cohen Actually Proved
  To understand the result, you have to understand the rules of the game. Modern mathematics is built on a foundation of axioms called **ZFC** (Zermelo-Fraenkel set theory with the Axiom of Choice).

  *   **Kurt Gödel (1938):** Proved that you **cannot disprove** CH using ZFC. He constructed a mathematical "universe" (called the Constructible Universe) where all the ZFC rules hold true *and* CH is true.
  *   **Paul Cohen (1963):** Proved that you **cannot prove** CH using ZFC. He invented a technique called "forcing" to construct a different mathematical "universe" where all the ZFC rules hold true *but* CH is false.

  **The Conclusion:** Because you can build valid mathematical worlds where CH is true and valid worlds where CH is false, CH is **undecidable** within ZFC. It is neither true nor false *relative to those axioms*. It is independent.

  ### 2. Why the Book Might Have Said "False"
  There are two likely reasons the pop math book claimed CH was proven false:

  **A. Simplification**
  Pop science books often simplify complex logic. Explaining "independence" requires explaining models, axioms, and metamathematics. It is much punchier to say, "Cohen showed the hypothesis doesn't hold," which a lay reader might interpret as "Cohen showed it's false."

  **B. Cohen's Personal Belief**
  Paul Cohen himself was a **Platonist**. He believed that there is a "real" universe of sets out there, independent of human axioms. While his *theorem* only proved independence, his *personal opinion* was that CH is likely **false** in that real universe. He felt the standard axioms (ZFC) were too weak to capture the true richness of infinity.
  The book may have conflated Cohen's *mathematical proof* (independence) with his *philosophical opinion* (falsehood).

  ### 3. The Geometry Analogy
  The best way to understand why CH isn't just "false" is to look at the history of geometry.

  For centuries, mathematicians tried to prove Euclid's **Parallel Postulate** from his other axioms. They failed. Eventually, they realized the Parallel Postulate was **independent**:
  *   If you assume it is **true**, you get **Euclidean Geometry** (flat space).
  *   If you assume it is **false**, you get **Non-Euclidean Geometry** (curved space).

  Neither geometry is "false." They are just different systems based on different assumptions.
  *   **ZFC + CH** is like Euclidean Geometry.
  *   **ZFC + Not-CH** is like Non-Euclidean Geometry.

  Both are consistent. Neither is disproven.

  ### 4. Why is it still listed as an "Open Problem"?
  If we know it's independent, why do mathematicians still argue about it?

  Technically, within ZFC, the problem is **solved**. We know we can't prove or disprove it. However, it is considered "open" in a deeper, philosophical sense: **What are the *correct* axioms for set theory?**

  Most mathematicians believe ZFC is not the final word. They are searching for new, natural axioms (such as "Large Cardinal Axioms") that might settle the question.
  *   If we find a new axiom that everyone agrees is "true," and that axiom implies CH is false, then CH becomes false.
  *   If we find a new axiom that implies CH is true, then CH becomes true.

  Currently, there is no consensus on these new axioms. Some modern set theorists (like W. Hugh Woodin) have argued for evidence that CH should be considered false, while others argue for true. Because the mathematical community hasn't agreed on which new axioms to adopt, the "truth value" of CH remains an active area of research and debate.

  ### Summary
  *   **The Book:** Was likely simplifying or reporting Cohen's personal opinion rather than his theorem.
  *   **The Math:** Cohen proved CH is **independent**, not false.
  *   **The Status:** It is impossible to prove or disprove CH using standard math (ZFC). It remains "open" only in the sense that we haven't agreed on *new* axioms to settle it.

  So, you were right to be confused! The statement that CH has been "disproven" is mathematically incorrect.
