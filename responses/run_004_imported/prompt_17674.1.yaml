  3.  **Analyze Modern Context vs. Ciceronian Framework:**
      *   *Medicine:* Cicero assumed natural lifespan limits. Modern medicine extends biological life without necessarily preserving *capacitas imperii* (capacity to rule).
      *   *Media:* Cicero relied on reputation and oratory. Modern media amplifies momentary confusion into existential crisis.
      *   *Selection:* Cicero assumed a meritocratic/aristocratic filter (Senate). Modern elections rely on popularity/incumbency, which might not filter for cognitive decline as effectively.
      *   *Tests:* Cicero valued peer judgment and reputation. Formalized testing might seem undignified or bureaucratic to him.

  4.  **Formulate the Reconstructed Argument (The "Ciceronian Verdict"):**
      *   *Thesis:* Cicero would likely be *alarmed* by the modern gerontocracy, not because he opposes old rulers, but because the modern version violates his core condition: *utility through wisdom*.
      *   *Point 1: The Definition of "Old Man Rule".* Cicero didn't mean "biological corpse propped up." He meant "active mind in an aging body." If the mind goes, the justification vanishes.
      *   *Point 2: The Role of Medicine.* Cicero would see life-extension without capacity-extension as unnatural. It creates a "shadow" of authority, not the substance.
      *   *Point 3: The Video Evidence.* Cicero valued *dignitas*. Public stumbling destroys *auctoritas* (authority). He would argue that hiding decline is worse than stepping down.
      *   *Point 4: Fitness Tests.* He might dislike the mechanism (bureaucratic/undignified) but accept the *principle* of peer review. The Senate should police itself based on utility, not wait for a medical exam.
      *   *Point 5: Duty to the Republic.* The strongest argument. Staying on when ineffective is *selfish*, not virtuous. It harms the Res Publica.

  5.  **Drafting the Response (Iterative Process):**
