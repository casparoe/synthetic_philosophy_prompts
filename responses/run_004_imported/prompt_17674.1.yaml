      *   *Section 4: The Solution (Peer Review vs. Cognitive Tests).* Cicero wouldn't like a multiple-choice test. He'd prefer the Senate expelling members who can't serve. But he'd agree on the *need* for assessment.
      *   *Conclusion:* Cicero would turn on the modern gerontocrats. They are violating the very duty they claim to uphold.

