      *   In "Death in Damascus," Death's prediction is based on the *agent's decision process*, not an independent decree of fate.
      *   The problem isn't "you die no matter what" (though in the original telling, it might seem that way). The problem is "how do you decide when your decision is correlated with the outcome but doesn't cause it in the way CDT expects?"
      *   Actually, the standard "Death in Damascus" case is often set up so that *fleeing* causes you to meet Death (because Death predicted fleeing), and *staying* causes you to meet Death (because Death predicted staying). But the *reason* matters.
      *   Crucially, decision theorists don't view this as proving fatalism. They view it as a counterexample to CDT's ability to handle *Newcomb-like* problems (correlation without causation).

  3.  **Formulate the Response Strategy:**
