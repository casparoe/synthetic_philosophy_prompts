      *   **Correct the Interpretation:** Explain why decision theorists distinguish this from metaphysical fatalism. The key is the *structure of the prediction* vs. *causal influence*.
      *   **Explain the CDT Problem:** Detail *why* CDT struggles here. CDT looks at causal consequences. If my choice doesn't *cause* Death to be there (Death is already there or already decided based on my disposition), CDT might recommend a dominated strategy or enter an infinite loop.
