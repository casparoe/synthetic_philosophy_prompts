      *   *Point 2: The CDT Glitch.* CDT says: "Choose the act that causes the best outcome." If Death is already in Aleppo because I'm going to Aleppo, going to Damascus doesn't *cause* Death to move. So CDT says "Go to Damascus (Death is in Aleppo)!" But wait, if I go to Damascus, Death predicted that. This leads to instability. CDT can't find a stable equilibrium.
