      *   **User's Skepticism:** Expected log utility (Kelly) already exists within Von Neumann-Morgenstern (VNM) expected utility theory (EUT). Growth-optimal betting predates Peters.
      *   **The Question:** Is the time-average/ensemble-average distinction doing real theoretical work? Is "geometric rationality" a genuine rival to EUT or just a reinterpretation?

  2.  **Initial Assessment & Fact-Checking:**
