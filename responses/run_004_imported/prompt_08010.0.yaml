      *   *Is it philosophically distinct?* Yes. It changes the *source* of normativity.
          *   EUT: Normativity comes from consistency of preferences (axioms).
          *   Ergodicity: Normativity comes from survival/dynamics of the system.
      *   *Does it generalize?* EUT handles additive risks, one-off bets, and consumption smoothing better. Ergodicity is strongest in repeated multiplicative investment contexts.
      *   *The "Mises/Keynes" angle:* Uncertainty vs. Risk. Peters focuses on known dynamics.

  5.  **Drafting the Response Structure:**
