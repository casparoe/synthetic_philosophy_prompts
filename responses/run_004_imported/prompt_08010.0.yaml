      *   *Ergodicity Economics (Peters):* Argues that standard EUT relies on ensemble averages (parallel universes), but humans live in one timeline (time averages). For multiplicative processes, the time average growth rate is the geometric mean, which corresponds to log utility.
      *   *The Conflict:* Peters claims EUT is "wrong" because it uses the wrong average. Critics say Peters just derived log utility from dynamics rather than preferences, but the math is isomorphic.
      *   *Key Distinction:* Normative (how you *should* value) vs. Descriptive/Dynamic (what *happens* to your wealth).

  3.  **Analyzing the "Work" done by the Ergodicity Argument:**
      *   *Argument 1: Derivation vs. Assumption.* In VNM, $\ln(W)$ is an *axiomatic preference*. In Ergodicity, it's a *physical consequence* of multiplicative dynamics. This shifts the burden of justification from psychology to physics/math.
      *   *Argument 2: The St. Petersburg Paradox.* EUT solves this by positing concave utility. Ergodicity solves it by saying the expected value (ensemble) diverges, but the time average converges (or grows slowly).
      *   *Argument 3: Non-Ergodicity.* If a process is non-ergodic, the ensemble average is physically meaningless for a single agent. EUT implicitly assumes ergodicity (or ignores the distinction).
