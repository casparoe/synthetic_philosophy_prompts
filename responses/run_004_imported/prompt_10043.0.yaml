      *   *The "Default Position":* Most modern epistemologists lean towards a moderate view: Testimony is a fundamental source of knowledge, not derivative. We *have* to trust testimony to function (language, learning, history).
      *   *Application:* The great-aunt's story *counts* as knowledge unless there are specific defeaters (contradictions, impossibility, motive to lie).

