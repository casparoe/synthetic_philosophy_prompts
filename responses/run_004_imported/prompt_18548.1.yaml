prompt: |-
  So I'm giving the toast at my friends Priya and Tom's wedding next month and could use a draft. Both of them are philosophers of action who've been having the same argument since basically their first date: Priya's whole dissertation defends Gilbert's plural subject account of joint commitment, Tom's is built around Bratman's reductive picture of shared intention as meshing sub plans plus mutual responsiveness, and neither has budged an inch in like six years. Can you write me a five minute toast with one solid joke that actually plays on the Bratman/Gilbert dispute -- something the three philosophy postdocs at table 4 will get AND that Tom's grandma will still laugh at? Bonus points if you can make something real out of whether their vows bind them because they've jointly commited to each other (so no unilaterally backing out, basically ever) or just because their individual intentions happen to mesh so well right now, but don't let it come across like either of them lost the argument at their own wedding.
