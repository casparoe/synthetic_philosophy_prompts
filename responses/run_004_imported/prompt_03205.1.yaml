          *   Analogous reasoning in AMD: "I am a random intersection visit." If I plan to continue with prob $p$, I visit Int 1 with prob 1, Int 2 with prob $p$. Total visits = $1+p$. Prob(Int 1) = $1/(1+p)$.
          *   *Yes*, the driver's belief calculation is structurally identical to Thirder reasoning (weighting by frequency of occurrence).

      *   **Disanalogy (Causal Influence/Control):**
