          *   Therefore: You can be a Thirder about SB but reject the P&R "paradox" in AMD (by siding with Aumann/Hart/Perry). You can be a Halfer about SB but still acknowledge the structural similarity in AMD (though you might calculate the probabilities differently).
          *   *Verdict:* They do **not** strictly stand or fall together. The causal disanalogy is principled and significant.

