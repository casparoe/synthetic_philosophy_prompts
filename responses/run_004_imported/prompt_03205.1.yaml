      *   **Halfer:** $1/2$. (No new information).
      *   **Thirder:** $1/3$. (Long-run frequency of wakings: 1 H, 2 T).
      *   **Key Feature:** Passive observer. Beauty's credence does not causally influence the number of wakings. The structure is fixed by the experimenters.

  3.  **Analyze the Absent-Minded Driver (AMD) Problem:**
      *   **Setup:** Two intersections (X, Y). Indistinguishable.
      *   **Payoffs:** Exit X = 0. Exit Y = 4. Pass both = 1.
      *   **Strategy:** Choose probability $p$ to continue at *any* intersection (since they are indistinguishable).
      *   **Planning Stage (Ex Ante):** Maximize expected utility.
          *   $EU(p) = (1-p) \cdot 0 + p(1-p) \cdot 4 + p^2 \cdot 1 = 4p - 4p^2 + p^2 = 4p - 3p^2$.
          *   Derivative: $4 - 6p = 0 \Rightarrow p = 2/3$.
      *   **Action Stage (Ex Interim):** At an intersection, what is the probability I am at X vs. Y?
          *   Let $\alpha$ be prob at X, $1-\alpha$ be prob at Y.
          *   P&R argue that upon arrival, the driver updates beliefs based on the fact that reaching Y requires having continued at X.
          *   If the plan is $p$, prob of reaching X is 1. Prob of reaching Y is $p$.
          *   So, relative likelihood of being at X vs Y is $1 : p$.
          *   $P(X) = 1 / (1+p)$, $P(Y) = p / (1+p)$.
          *   Expected utility of continuing *now* (given plan $p$): $P(Y) \cdot [(1-p)4 + p(1)] + P(X) \cdot [p((1-p)4 + p(1))]$. (This gets messy, but the core P&R point is the *time inconsistency*).
          *   P&R claim the optimal $p$ at the intersection differs from the optimal $p$ at the start.
      *   **Key Feature:** Active agent. The driver's choice of $p$ *causally determines* the probability of reaching the second intersection.

