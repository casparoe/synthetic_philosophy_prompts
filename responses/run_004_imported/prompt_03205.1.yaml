          *   In AMD, the debate is decision-theoretic (how to act given the loop?).
          *   One can consistently be a Thirder (SB) and an "Ex-Ante Maximizer" (AMD). In fact, many Thirders argue that once you separate *credence* from *decision*, the AMD paradox dissolves, whereas the SB puzzle remains a puzzle about credence itself.
          *   Conversely, Halfers often reject the self-locating indifference that drives the AMD belief update, but even if they accept the belief update, the decision theory differs.
