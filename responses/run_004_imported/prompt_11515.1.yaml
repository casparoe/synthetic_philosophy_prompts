prompt: |-
  David Lewis's triviality results are usually taken to have killed the simple idea that P(if A, B) = P(B|A) (Adams' thesis) as a general fact about indicative conditionals. But theres been a bunch of famous attempts since to save something like it anyway: Adams/Edgington just deny conditionals have truth conditions at all (no proposition, no problem), Stalnaker leans on context-sensitivity of the selection function to block the argument, Jackson tells a "robustness" story for why we assert material conditionals exactly when P(B|A) is high, van Fraassen moves to Popper functions / a family of probability measures instead of one fixed one, and McGee defends a restricted version of the thesis that only covers simple, non-embedded conditionals. Rank these five from most to least successful at actually rescuing something worth still calling "Adams' thesis" while dodging triviality -- don't be afraid to put one at the bottom for basically just changing the subject. Give it to me as a JSON list like:

  ```json
  [
    {"view": "...", "reason": "one sentence on why it ranks where it does"},
    ...
  ]
  ```
