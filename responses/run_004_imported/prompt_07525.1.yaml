answer: |-
  The notification didn't buzz; it just appeared, a pale ghost on the lock screen. *GhostWi-Fi: New Post.*

  It was impossible to trace. The app only worked when connected to the school's network, a digital room where everyone was present but no one was visible. You could be standing next to someone in the cafeteria, watching them read a post you wrote three seconds ago, and neither of you would ever know.

  By second period, everyone knew about Maya.

  Maya sat two rows ahead of Leo in AP History. She was the kind of student who organized her highlighters by gradient and actually raised her hand to ask about the syllabus. Yesterday, she'd won the Sterling Fellowship, a prestigious grant that usually went to seniors with legacy connections. Maya was a junior. Her parents worked at a grocery store.

  The first post had appeared at 7:03 AM. *Funny how the Sterling committee overlooked the actual qualifications this year. Wonder if donations talk louder than grades.*

  By lunch, the narrative had hardened. It wasn't a question anymore. It was a fact. Maya hadn't earned it; she'd slipped through a loophole, or worse, she'd charmed her way past the rules. The specific details of her application—her portfolio, her essay, the hours spent in the lab—dissolved. They were replaced by a caricature: The Grifter.

  Leo sat at the edge of the cafeteria table, watching the room. It wasn't angry. That was the unsettling part. There was no shouting, no confrontations. Just a low, humid hum of conversation, punctuated by the chime of phones. People who had never spoken to Maya were nodding along with assessments of her character.

  "It's just unfair," said a boy from the soccer team, scrolling with his thumb. "Some people think they're above the system."

  "Exactly," a girl replied, not looking up from her screen. "It's about integrity. We're just holding her accountable."

  Leo watched Maya at a distant table. She was eating an apple, staring at her tray. She looked smaller than she had yesterday. The complexity of her—the anxiety, the work, the quiet kindness when she helped Leo with chem equations—was being shaved off. She was being sanded down until she was flat enough to fit inside a screen.

  The envy was invisible, wrapped in the language of justice. No one admitted they wanted the fellowship. They just wanted the playing field level. If Maya couldn't stand tall, then everyone else could feel safe again.

  Leo felt a heat rising in his chest, a dangerous, old-fashioned spike of adrenaline. He knew the truth. He'd seen her drafts. He knew she'd stayed late every Thursday for a month. To stay silent was to let the abstraction eat the person.

  He pulled out his phone. He opened GhostWi-Fi. The cursor blinked in the text box, waiting for anonymity. That was the trap. To speak without a name was to speak without risk, and without risk, there was no truth. Only opinion.

  Leo closed the app. He opened Instagram. He typed out a caption, attached a photo of Maya's study notes he'd taken weeks ago—dated, timestamped, undeniable proof of the work she'd put in. He tagged the school account. He signed it with his name. *Leo V.*

  He hit post. Then he walked across the cafeteria, toward the center of the room, toward the noise.

  He expected a shift. He expected the hum to stop. He expected the shame of being caught in a lie to silence the crowd.

  He reached the center of the room. The hum didn't stop. It changed frequency.

  Phones lit up. Leo's post was already being shared back onto GhostWi-Fi. He watched a girl nearby read it, smirk, and type something.

  *Look at Leo playing knight in shining armor,* a new GhostWi-Fi post popped up. *Desperate much?*

  *Why is he so invested?* another followed. *You think they're hooking up? Explains the favoritism.*

  *Classic move. Defend the cheat to look like a saint. We see you, Leo.*

  Leo stood still. The truth of the notes didn't matter. The evidence was irrelevant. The public didn't want facts; it wanted a narrative it could digest. By attaching his name, Leo hadn't shattered the abstraction; he had just given it new material. He had stepped out of the crowd, thinking his individuality would act as a wedge. Instead, the crowd simply widened to encompass him.

  He looked for Maya. She was looking at him now. Her eyes weren't filled with gratitude. They were filled with a hollow recognition. She understood what was happening. He wasn't saving her; he was joining her.

  "Nice post," the soccer boy said, walking past Leo. He didn't stop. He just tossed the words over his shoulder, light and weightless. "Brave. Or stupid."

  Leo looked at his phone. The notifications were pouring in. Likes, comments, shares. But none of them were engagements with the truth. They were engagements with the drama. His stand had become content. His courage was just another metric to be measured, compared, and leveled.

  He realized then that the app wasn't the problem. It was just the mirror. The problem was the reflection. Everyone was safe because no one was responsible. If Leo was wrong, he was a fool. If he was right, he was a try-hard. Either way, he was dragged down to the same flat ground as Maya. No one was allowed to be right enough to demand respect. No one was allowed to be wrong enough to demand forgiveness. Everyone just had to be equally mediocre.

  Maya stood up. She slung her backpack over one shoulder. She walked past Leo without speaking. There was no alliance formed, no bond of shared suffering. That would have required passion. Instead, she just walked toward the exit, eyes on the floor, shrinking herself to fit through the door.

  Leo looked around the cafeteria. Hundreds of students, hundreds of screens. They were all connected, perfectly informed, and utterly alone. He had tried to be a person, but the public had already decided he was just a user.

  He locked his phone. The screen went black, reflecting his own face back at him. He looked tired. He looked like everyone else.

  The bell rang, a sharp, mechanical sound that cut through the murmur. Everyone stood up at once, a single organism moving toward the next class. The conversation about Maya would be over by tomorrow, replaced by a new target, a new scandal, a new flattening. The level would remain unbroken.

  Leo walked with the crowd, letting them carry him forward. He kept his phone in his pocket, face down. There was no one to call, and nothing left to say that wouldn't just be swallowed by the noise.
