answer: |-
  Here is the core comparison for your section, broken down by the analogy's strength, its limits, and the two specific philosophical sticking points you raised.

  ### 1. The Core Analogy: Where It Holds Up
  Ord's model is structurally identical to Ricardian comparative advantage.

  *   **Subjective Valuation:** In economics, trade works because I value your good more than you do, and vice versa. In moral trade, trade works because I weight *Moral Value A* higher than you do, and you weight *Moral Value B* higher than I do.
  *   **Pareto Improvements:** In both cases, the goal is a Pareto improvement. In economics, both parties increase their utility. In moral trade, both parties increase the **expected moral value** of the world *according to their own moral metric*.
  *   **Specialization:** Just as countries specialize in goods where they have a lower opportunity cost, moral agents specialize in actions that are "cheaper" for them (in terms of moral sacrifice) but yield high value for the trading partner.

  **The Takeaway:** The math of the gain is the same. If I care 90% about animals and 10% about humans, and you care 10% about animals and 90% about humans, we can swap "animal duties" for "human duties" and both walk away having maximized our own moral scorecards.

  ### 2. Where the Analogy Breaks Down
  The friction points arise because moral obligations aren't commodities.

  *   **Enforcement and Commitment:** Economic trade usually relies on contracts, law, or simultaneous exchange (money for goods). Moral trade is essentially a **Prisoner's Dilemma**. If I uphold my end of the moral bargain (e.g., donating to your charity), nothing physically stops you from defecting (not donating to mine). There is no "moral court" to enforce the contract. Trust is the only currency.
  *   **Integrity and Agent-Neutrality:** In economics, selling a product doesn't usually violate your integrity. In ethics, some theories (especially deontology or virtue ethics) hold that *you* must not commit a wrong, even if it prevents someone else from committing a wrong. If my moral theory says "I must not lie," I cannot trade with you to "lie for you so you don't have to." The "cost" isn't just a disutility; it's a violation of agency.
  *   **Transitivity:** Economic preferences are generally assumed to be transitive. Moral theories often clash fundamentally. If Theory A says "maximize happiness" and Theory B says "respect rights," there isn't always a linear scale where you can find a middle ground.

  ### 3. The "Currency" Problem (Incommensurability)
  You asked if moral trade needs a common currency like prices.

  *   **The Economic Parallel:** Actually, standard economics *also* struggles with interpersonal comparisons of utility. We don't know if my dollar gives me the same happiness as your dollar. We just know that *we both agreed to the trade*, revealing a preference.
  *   **The Moral Application:** Moral trade **does not require a common moral currency.** It does not require us to agree on what a "util" is.
      *   It only requires that *I* believe the action I'm taking is "worth less" (in my units) than the action you are taking for me (in my units).
      *   And *you* must believe the reverse in *your* units.
  *   **The Limit:** This breaks down if the values are truly **lexically ordered** (e.g., "Rights always trump utility"). If I believe rights are infinite in value and you believe utility is finite, we cannot find an exchange rate. Moral trade requires that your moral theory allows for *trade-offs* (marginalism).

  ### 4. The Meta-Ethical Trap (Realism vs. Anti-Realism)
  This is the most critical point for your seminar. Your intuition is half-right: **Dogmatic Realism kills moral trade, but Fallibilist Realism allows it.**

  *   **The Anti-Realist View:** If morality is just preference (like taste in food), moral trade is easy. It's just economics by another name.
  *   **The Dogmatic Realist View:** If I believe there is One True Moral Law and I know it with certainty, you are wrong. Why would I trade with error? Compromising with falsehood is itself a moral wrong. In this view, moral trade is corruption.
  *   **Ord's Solution (Moral Uncertainty):** Ord argues moral trade makes the most sense under **moral uncertainty**.
      *   I can be a realist (I believe there is an objective truth) but admit I am not 100% sure *which* theory captures it.
      *   If I am 60% credence in Utilitarianism and 40% in Deontology, and you are the reverse, we can trade to maximize **Expected Moral Value**.
      *   We aren't compromising on "The Truth"; we are hedging against our own uncertainty.

  **Summary for Section:**
  The analogy holds on the **math of comparative advantage** but breaks on the **mechanics of enforcement and integrity**. It does not require a common currency, only marginal trade-offs. Finally, it does not require anti-realism, but it **does require rejecting moral dogmatism**; it functions best as a tool for agents operating under moral uncertainty who want to maximize expected value across competing theories.
