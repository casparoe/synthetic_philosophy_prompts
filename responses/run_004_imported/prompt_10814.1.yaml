prompt: |-
  so in my practical ethics seminar this week we covered Toby Ord's idea of "moral trade" -- two people with different moral views each do the thing the other cares about more (and cares less about themselves), so both end up better off by their own lights, kinda like Ricardo's comparative advantage but for morality instead of goods. can you compare moral trade to the standard economic story about gains from trade and tell me where that analogy actually holds up and where it breaks down? i'm especially stuck on whether moral trade needs something like a common "currency" of value the way markets need prices, given the two parties might be using totally incommensurable moral theories, and whether the whole idea only really makes sense if your some kind of anti-realist about ethics (a strict realist should just do whats right regardless of what everyone else does, no?). don't need a full lit review, just want the core comparison nailed down before section tmrw
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Toby Ord's concept of "Moral Trade" (from his paper "Moral Trade").
      *   **Task:** Compare moral trade to the standard economic story of gains from trade (Ricardian comparative advantage).
      *   **Specific Focus Areas:**
          *   Where the analogy holds up.
          *   Where the analogy breaks down.
          *   The "currency" problem (incommensurable moral theories vs. prices).
          *   The meta-ethical implication (does this require anti-realism? vs. realism).
      *   **Constraint:** Don't need a full lit review; need the core comparison nailed down for a seminar section tomorrow. (Keep it concise, clear, and argumentative).

  2.  **Deconstruct "Moral Trade" (Ord's View):**
      *   *Core Idea:* Agents have different moral weights/values. They can swap actions to increase total expected value according to their *own* views.
      *   *Example:* Alice cares 90% about animals, 10% about humans. Bob cares 10% about animals, 90% about humans. Alice does something for humans (costly to her, huge gain for Bob). Bob does something for animals (costly to him, huge gain for Alice). Both feel they've increased overall value.
      *   *Goal:* Pareto improvement in moral value space.

  3.  **Deconstruct Economic Gains from Trade:**
      *   *Core Idea:* Agents have different opportunity costs/preferences. They swap goods/services.
      *   *Mechanism:* Prices signal value. Voluntary exchange implies both parties expect to be better off (ex-ante).
      *   *Goal:* Pareto improvement in utility/welfare.

  4.  **Drafting the Comparison (Hold vs. Break):**

      *   *Where it Holds:*
          *   **Comparative Advantage:** Just as countries specialize where they have lower opportunity costs, moral agents specialize in actions that are "cheaper" for them (in terms of moral sacrifice) but "valuable" to the other.
          *   **Pareto Efficiency:** Both models aim for a state where no one can be made better off without making someone worse off. In moral trade, "better off" means "according to my own moral metric."
          *   **Subjective Valuation:** Economics relies on subjective utility. Moral trade relies on subjective *moral* credences or weights.

      *   *Where it Breaks:*
          *   **Enforcement/Commitment:** Economic trade usually involves simultaneous exchange or legal contracts. Moral trade relies on trust. If I do my part, will you? There's no court for moral contracts.
          *   **Zero-Sum vs. Positive-Sum Perception:** In economics, trade is clearly positive-sum. In ethics, some theories (e.g., strict deontology) might view "compromising" on principle as inherently wrong, making the trade negative value *by definition* for that agent.
          *   **The "Currency" Problem:** Money quantifies value. Moral trade lacks a universal unit. How do we know the trade is equal?

  5.  **Addressing the Specific Sticking Points:**

      *   *The Currency/Incommensurability Issue:*
          *   *Econ:* Prices solve the calculation problem.
          *   *Moral:* No moral price tag.
          *   *Ord's Solution:* It doesn't require a *common* currency, just a *mutual agreement* on the ratio. If I value X at 10 units and you value Y at 10 units, we swap. We don't need to agree on what a "unit" is, just that the swap benefits us *relative to our own scales*.
          *   *Nuance:* It works best under *moral uncertainty* (I'm 60% utilitarian, 40% deontologist). If we are dogmatic realists, trade is harder.

      *   *The Meta-Ethical Issue (Realism vs. Anti-Realism):*
          *   *User's Worry:* "A strict realist should just do what's right regardless."
          *   *Analysis:* This is the crux.
          *   *Objectivist/Realist View:* If there is one True Moral Law, compromising is sin. Trade implies my view isn't the whole truth.
          *   *Ord's Counter:* Moral *Uncertainty*. Even a realist can be uncertain about which realist theory is true. If I'm 50% sure Theory A is true and 50% sure Theory B is true, and you are the opposite, we can trade to maximize *expected* moral value.
          *   *Anti-Realist View:* If morality is just preference, trade is easy (just like economics).
          *   *Conclusion:* Moral trade does *not* require anti-realism, but it does require rejecting *moral dogmatism*. It fits best with moral uncertainty or pluralism.

  6.  **Synthesizing and Refining for the User:**
      *   *Tone:* Academic but accessible (seminar prep).
      *   *Structure:*
          1.  The Core Analogy (Ricardo).
          2.  Where it Holds (Pareto, Specialization).
          3.  Where it Breaks (Enforcement, Integrity).
          4.  The Currency Question (Subjective scales vs. Prices).
          5.  The Meta-Ethical Question (Realism + Uncertainty).
      *   *Key Insight to Highlight:* The distinction between "The Good" (objective) and "Expected Good" (subjective/uncertain). Trade happens in the space of expectations.

  7.  **Self-Correction/Review during drafting:**
