      *   *Check:* Did I address the Realism point?
      *   *Correction:* Ensure I mention that Ord specifically frames this around *moral uncertainty*. A dogmatic realist cannot trade. A fallibilist realist can.

  8.  **Final Polish:** Check against the "no lit review" constraint. Keep it punchy. (Proceed to generate output).

