      *   *What are the classic Sperry/Gazzaniga findings?* Lateralization of function (language usually left, spatial/facial recognition usually right), inability to name objects seen only by the right visual field (processed by left hemisphere) vs. left visual field (processed by right hemisphere), intermanual conflict (alien hand syndrome).
      *   *Do split-brain patients live with "two fully independent minds" in daily life?* **Crucial Point:** No, not typically. In natural, ecologically valid settings, split-brain patients appear remarkably normal. The dramatic "two mind" effects are mostly observed under strict laboratory conditions (tachistoscopes, occluded vision, hands prevented from seeing each other).
      *   *Why?* Cross-cueing. The hemispheres can communicate via subcortical pathways, eye movements, head turns, and auditory feedback. The brain compensates.
      *   *Alien Hand Syndrome:* This exists but is usually transient or specific to certain types of callosotomies (anterior vs. posterior). It's not usually a constant "one hand undoes the other" struggle in everyday life for long-term patients.
      *   *Unity of Consciousness:* Most patients report a unified sense of self. They don't feel like two people.

