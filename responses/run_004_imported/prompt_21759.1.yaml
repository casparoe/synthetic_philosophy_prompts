      *   **Subjective Experience:** How does the *patient* feel? (Unified self).
      *   **Suggestions for the Novel:** How to write this accurately while keeping the tension/drama.

  5.  **Fleshing out the Content (Iterative refinement):**

      *   *Point 1: The "Two Minds" Myth.* Sperry and Gazzaniga's work was groundbreaking, but it was done in highly controlled settings. In the real world, the brain compensates.
      *   *Point 2: Cross-Cueing.* This is the mechanism. If the right hemisphere sees a key, it can't speak, but it can move the head or eyes so the left hemisphere sees it too. Or it can tap a rhythm.
      *   *Point 3: Alien Hand Syndrome.* This is the closest to the user's idea. But it's often temporary, or specific to the *anterior* callosotomy. It's more "purposeful but unwanted movement" than "a second personality fighting back." It's often frustration, not a negotiation between equals.
