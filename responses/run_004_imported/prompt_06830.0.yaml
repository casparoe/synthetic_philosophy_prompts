answer: |-
  Good evening, everyone. For those who don't know me, I'm Sarah, the Maid of Honour and older sister of the bride. I also happen to be a dental hygienist. So, professionally speaking, I spend my days looking into people's mouths and telling them to floss. Today, I get to stand in front of a room full of people and tell them to listen. It's a nice change of pace.

  Now, anyone who knows my sister, Emily, and her new husband, David, knows that they are a little bit different. They met three years ago at a weekend workshop for people who enjoy arguing about decision theory as a hobby. If that sentence made your eyes glaze over, don't worry. I'm a dental hygienist; I had to look up "decision theory" myself. But I wanted to understand them. So, I bought a secondhand book of Douglas Hofstadter's columns and fell down the rabbit hole.

  And I found something there that I think explains why they work better than the usual wedding talk about "trust" or "soulmates."

  There's a concept Hofstadter wrote about called "superrationality." It usually comes up in a game called the Prisoner's Dilemma. In the standard version, two people are separated and have to choose: do you cooperate with your partner, or do you defect to save yourself? The cold, hard logic suggests you should defect. But Hofstadter argued that if two people are truly alike—if they reason the same way, value the same things, and face the same choice—they should realize that they will inevitably come to the same conclusion.

  So, I don't choose to cooperate because I trust *you* to do it. I choose to cooperate because I know that *I* am doing it, and since you are my mirror in this, you are doing it too. We aren't two separate gamblers hoping the other pays out. We are one reasoning process happening in two bodies.

  When I heard this, I realized this isn't just theory for Emily and David. It's their history.

  Many of you know they spent their first year together on different continents. They were thousands of miles apart. They were free to stray, free to walk away, free to "defect," and the other would never have known. By the standard rules of relationships, that's a terrifying amount of risk. Usually, we call the thing that bridges that gap "trust." We say, "I trust you won't hurt me."

  But when I asked them about that year, they didn't talk about trust. They said they never felt anxious. Not because they were blind to the risk, but because they had both separately reasoned their way to the same commitment. They didn't stay faithful because they were watching each other. They stayed faithful because they are the kind of people who value what they have more than the temporary freedom to lose it. And since they are the same kind of people, they knew the other would land in the exact same place.

  That is superrationality in love. It is the realization that you are not two opponents negotiating a treaty. You are partners who have independently calculated that "us" is the only variable that matters.

  For the family members wondering where I'm going with this: it means their marriage isn't built on hoping the other person behaves. It's built on knowing that they think alike. It means that when life throws them a hard choice—and it will—they don't have to guess what the other will do. They know that if they sit down and think it through with love and honesty, they will arrive at the same answer.

  For the workshop crew in the back: Yes, I know this assumes a symmetric payoff matrix and identical reasoning algorithms. But look at them. The symmetry holds.

  Emily and David, my wish for you is that you never lose that shared logic. May you always find that the answer you reach alone is the answer you reach together. May you always see your own reasoning reflected in the other's eyes. And may you always cooperate, not because you have to, but because you are you.

  Please raise your glasses. To the bride and groom: the perfect equilibrium.
