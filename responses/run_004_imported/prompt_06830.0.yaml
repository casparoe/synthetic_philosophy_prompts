      *   *Emotional Weight:* The prompt says the theory must do the emotional work. So the definition of their love *is* this reasoning process. I need to emphasize that this makes their bond *stronger* than blind trust. Blind trust can be broken. Shared reasoning is resilient.

  8.  **Final Polish:**
