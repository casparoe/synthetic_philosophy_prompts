      *   **Distinction 1: Epistemic vs. Instrumental Rationality:** Use the LessWrong framing since they mentioned it. Epistemic = truth. Instrumental = success. In this specific case (performance), instrumental rationality might *require* a temporary suspension of strict epistemic rigor.
      *   **Distinction 2: Prediction vs. Commitment:** This is crucial. "I will do great" sounds like a prediction (fact-statement). But in this context, it functions more like a *commitment* or an *intention*. If I treat it as a command to my nervous system rather than a weather forecast, the confusion dissolves.
      *   **Distinction 3: Aliefs (Gendler):** Explain that the conscious "belief" might not be the thing changing. It's the automatic response. You can know the odds are 50/50 (belief) but act with 90% confidence (alief) to trigger the performance state.
      *   **The Self-Fulfilling Aspect:** Address the "does it stop mattering" part. If the belief causes the success, it *becomes* evidence. It's a feedback loop. But be careful: if you fail, does it crash harder?
