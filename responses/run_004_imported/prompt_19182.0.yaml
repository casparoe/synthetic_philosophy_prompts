answer: |-
  Here is the verdict: **You are right about the "trenchcoat" charge, and that makes Frege's account the superior explanation for this specific puzzle.**

  Marco is technically correct about the *definitions* Salmon uses, but he is missing the forest for the trees. Theoretical value isn't just about how you label your ontology; it's about where the explanatory work gets done. On that metric, Salmon's view is less parsimonious and less honest about linguistic intuition than Frege's.

  Here is the concrete breakdown of why your "trenchcoat" objection holds water and why Frege wins on the specific terrain of belief reports and identity statements.

  ### 1. The "Trenchcoat" Charge: Functional Equivalence
  You argued that Salmon's guises are just Fregean senses relocated from semantics to pragmatics. This is the crux of the matter.

  *   **Frege:** The "mode of presentation" (Sense) is part of the **truth-conditional content**. When you say "Lois believes Clark Kent flies," the proposition expressed contains the *Clark-Kent sense*. Since Lois doesn't associate that sense with Superman, the statement is **False**.
  *   **Salmon:** The "mode of presentation" (Guise) is part of the **pragmatic context**. When you say "Lois believes Clark Kent flies," the proposition expressed is the bare Russellian one $\langle \text{Lois}, \text{Superman}, \text{Flying} \rangle$. This is **True**. However, asserting it *implicates* that Lois grasps this proposition under a "Clark-Kent-ish" guise. Since she doesn't, the assertion is **misleading**.

  **The Verdict:** You are correct that the *explanatory mechanism* is identical. Both theories require an intermediary entity between the believer and the object to explain why Lois acts differently toward "Superman" and "Clark Kent."
  *   Frege puts this intermediary in the **Semantics**.
  *   Salmon puts this intermediary in the **Pragmatics**.

  If the only difference is *where* you store the data, but the data structure is the same, you haven't created a rival theory; you've created a refactoring. Salmon claims this refactoring saves "Direct Reference," but he pays for it by forcing Pragmatics to do the heavy lifting that Semantics usually handles. This creates **pragmatic overload**. A theory that requires systematic pragmatic misleadingness to match linguistic intuition is theoretically more expensive than one that matches intuition directly.

  ### 2. The Shareability Problem (The Killer Argument)
  This is the concrete asymmetry you asked for. It destroys the idea that Salmon's view is genuinely distinct in a way that helps.

  *   **Fregean Senses:** Are abstract, objective, and **shareable**. When I communicate with you, we grasp the *same* Sense. This explains how communication is possible.
  *   **Salmonian Guises:** Are psychological entities (ways *I* grasp a proposition). Strictly speaking, my psychological guises are private to my head.

  **The Problem:** If guises are purely psychological, how do you and I ever disagree? If I say "Lois believes Superman flies" and you say "No, she doesn't," Salmon has to say we are both asserting the same True Russellian proposition. To explain the disagreement, Salmon must appeal to *which guise we are implicating*.

  But for that implicature to work, the guises must be **publicly accessible**. We have to be able to refer to "the Clark-Kent guise" as a shared object of discussion. As soon as Salmon makes guises shareable and public to explain communication, **they become Fregean Senses in all but name.**

  If Marco insists guises are *only* psychological, Salmon cannot explain how we communicate about beliefs. If he admits they are public, he has smuggled Fregean Senses back in under the label "guise." Your trenchcoat charge is vindicated: to make the theory work, Salmon needs Frege's machinery anyway.

  ### 3. Truth Conditions vs. Intuition
  A theory of meaning should ideally align with pre-theoretic truth-value intuitions unless there is a overwhelming reason not to.

  *   **Frege:** Matches intuition. "Lois believes Clark Kent flies" feels false. Frege says it *is* false.
  *   **Salmon:** Fights intuition. "Lois believes Clark Kent flies" feels false. Salmon says it is *true* (but don't say it).

  Salmon's move requires us to accept that ordinary speakers are systematically wrong about the truth conditions of their own belief reports. He argues we confuse "what is said" with "what is implicated." But this distinction is supposed to be a theoretical tool, not a revision of reality. When a theory tells you that your intuitive judgment of "false" is actually "true but misleading," the theory is bearing a massive burden of proof.

  Salmon's justification is preserving **Millianism** (names contribute only referents). But preserving Millianism at the cost of making semantics inert to cognitive significance is a bad trade. Semantics is supposed to explain meaning and understanding. If two sentences have the exact same semantic content but convey completely different information (Superman vs. Clark), then semantics has failed to capture "meaning." Frege captures meaning; Salmon captures logical form. For the *puzzle of cognitive significance*, Frege is the better tool.

  ### 4. Compositionality and Logic (Marco's Strongest Point)
  I will concede one point to Marco, just to be precise: Salmon wins on **classical logic**.
  *   On Salmon's view, Substitution of Identicals holds universally in semantic content. $a=b$, therefore $Fa \leftrightarrow Fb$. The failure is only pragmatic.
  *   On Frege's view, Substitution of Identicals fails in belief contexts because the *senses* differ.

  If your priority is preserving the simplest possible logic, Salmon wins. But logic is a tool for modeling language, not the master of it. If the model requires you to say that intuitively false statements are semantically true, the model is distorting the data to save the math.

  ### Final Settlement
  **You win the argument.**

  Marco is right that there is a *technical* distinction between a psychological guise and an abstract sense. But you are right that this distinction is theoretically hollow in this context.
  1.  **Explanatory Work:** Both theories rely on an intermediary layer to explain cognitive difference.
  2.  **Parsimony:** Frege puts the layer where it belongs (semantics/meaning). Salmon duplicates it (semantics + pragmatics).
  3.  **Communication:** Salmon needs public guises to explain communication, which collapses his view back into Frege's.

  Salmon's view isn't a rival solution to Frege's Puzzle; it is a **defense of Millianism against Frege's Puzzle.** It solves the problem of "How do we keep Direct Reference?" but it does not solve the problem of "How do we explain cognitive significance?" better than Frege. In fact, it solves it worse, by making our semantic content irrelevant to our cognitive lives.

  Tell Marco that Salmon's "BEL relation" is indeed Frege's sense wearing a trenchcoat, and that trenchcoat is expensive: it costs him truth-conditional accuracy and forces him to posit public psychological entities that function exactly like abstract senses. Frege's account is the more honest description of what is happening when we talk about belief.
