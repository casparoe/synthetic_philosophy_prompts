prompt: |-
  Had a genuinely unhinged two-hour argument with my friend Marco last night about Frege's puzzle and I don't think either of us actually one it, so now I want a third opinion. We started from the classic setup: "Hesperus is Phosphorus" feels informative even though "Hesperus is Hesperus" is trivial, and both names pick out the same planet, and Frege's fix is that the two names have different senses even though they share a referent. We're both fine with that part. Where we split is over whether the direct-reference crowd actually has a rival theory or is just borrowing Frege's insight under a different name. Marco's obsessed with Nathan Salmon's book on this and kept describing Salmon's move: belief reports are really a three-place relation (I think Salmon literally calls it the BEL relation) between a believer, a bare Russellian proposition, and a "guise" under which the proposition gets grasped, so that "Lois believes Superman can fly" and "Lois believes Clark Kent can fly" both come out strictly true -- same proposition either way -- and the intuition that one of them is false gets explained away as a pragmatic implicature about which guise is salient, not a difference in what's semantically expressed. I said thats just Frege's senses wearing a trenchcoat and relabeled as pragmatics instead of semantics, so its not really a rival theory at all. Marco insists there's a real difference because guises are psychological entities, not meanings, and the semantic content of the two sentences never changes.

  Can you actually settle this instead of being diplomatic about it? Compare Frege's sense/reference solution to the identity-statement puzzle with Salmon's guise-based Millian solution to the substitution-failure puzzle specifically (not Russell's descriptions, not Kripke's modal arguments in general, just these two), and tell me which one actually gives the better account. I especially want your take on the "trenchcoat" charge: is there a principled difference between a Fregean sense and a Salmonian guise, or does Salmon's view just relocate the same explanatory work from semantics to pragmatics without buying anything genuinely new? If you think there's a real asymmetry -- something about compositionality, or shareability of guises across speakers, or what counts as part of "what is said" versus merely implicated -- spell it out concretely rather than just asserting that the two views are obviously different.
