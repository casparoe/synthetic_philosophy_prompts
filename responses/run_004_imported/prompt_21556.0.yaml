          *   *The "Gut" reason:* A proposition divides the world into "True Worlds" and "False Worlds." A conditional divides the world into "Relevant Worlds" (where A is true) and "Irrelevant Worlds" (where A is false). You can't map "Irrelevant" cleanly into "True/False" without breaking the probability math.

