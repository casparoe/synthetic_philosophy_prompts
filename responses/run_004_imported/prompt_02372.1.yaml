prompt: |-
  Hey, so I've been writing about the background-independence fight between loop quantum gravity and string theory, and everyone on the LQG side keeps invoking Einstein's old "hole argument" as a reason spacetime can't be some fixed, independently-existing substance. I went down a rabbit hole (sorry) reading the Earman-Norton version and now I want an outside take for the piece. Can you write me an essay on whether the hole argument actually succeeds in refuting manifold substantivalism -- the idea that spacetime points are real individuals over and above the metric and matter fields hung on them? Lay out the argument itself (the hole diffeomorphism, and why denying "Leibniz equivalence" saddles substantivalists with an unmotivated indeterminism), then weigh it against the best comebacks, especially "sophisticated"/anti-haecceitist substantivalism (just deny the diffeomorphic models are distinct possibilities) and Maudlin's metric essentialism (points carry their metrical properties essentially, so theres no real indeterminism to begin with). Dont just summarize both sides -- actually tell me who wins and why.
