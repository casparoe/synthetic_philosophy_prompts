      *   *Analysis:* This is the standard defense of the Constitution View. Sortal concepts (kinds of things) dictate persistence conditions.
      *   *Verdict:* Philosophically strong. This solidifies her Leibniz's Law argument. It appeals to how we categorize things (sortals).

