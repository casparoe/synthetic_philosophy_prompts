      *   *Verdict:* Complicated/Weak. In metaphysics, dispositions (like fragility) are usually accepted as real properties even if not manifested. However, Owen has a point that *observing* the difference requires the destruction of one, which feels like cheating the identity test. But strictly speaking, modal properties are standardly accepted.

  6.  **Evaluate Move (4): Nadia's Disposition Defense**
