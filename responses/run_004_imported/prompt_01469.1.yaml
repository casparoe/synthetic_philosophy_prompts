      *   Be neutral but authoritative.

  6.  **Self-Correction/Nuance Check:**
      *   *Did Marx think it was unjust?* I need to be careful here. Many scholars (like Allen Wood) argue Marx didn't think capitalism was *unjust* by its own standards. Others (like Ziyad Husami) argue he had a implicit standard of justice. I should present the nuance: Marx avoids moralizing because he thinks "justice" is part of the superstructure determined by the economy.
      *   *Cheating:* Make sure to emphasize that Marx mocks the idea that exploitation comes from selling commodities *above* their value. He insists on equivalent exchange to make his point stronger.

