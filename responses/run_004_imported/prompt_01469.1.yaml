answer: |-
  This is a classic debate, and honestly, it's one of the most common points of confusion when reading Marx. You both have a piece of the puzzle, but **your friend is technically closer to what Marx actually wrote**, even though your intuition (that something is wrong) is also correct.

  Here is the breakdown of who is right, how the "fair exchange" leads to exploitation, and whether Marx called it "unjust."

  ### 1. The Verdict: Who won the argument?
  **Your friend wins on the mechanism.**
  Marx explicitly argues that the capitalist does **not** cheat the worker in the market. If the capitalist were just paying workers less than the agreed wage, that would be fraud, and Marx wasn't interested in fraud. He wanted to show how exploitation happens *even when everyone follows the rules.*

  **You win on the outcome.**
  You are right that the worker is being exploited. You just disagreed on *how* it happens. You thought it happened in the **exchange** (the paycheck); Marx argued it happens in **production** (the work itself).

  ### 2. The "Clever" Trick: Labor vs. Labor Power
  The key to settling this is Marx's distinction between **Labor** and **Labor Power**.

  *   **Labor Power:** This is the worker's *ability* to work for a set time (e.g., 8 hours). This is what the worker sells to the capitalist.
  *   **Labor:** This is the *actual work* that gets done.

  **The Exchange (Where your friend is right):**
  Marx argues that in the market, the exchange is "fair." The capitalist buys the worker's *Labor Power* at its value. What is the value of Labor Power? It's the cost of keeping the worker alive and able to work (food, rent, clothes, raising kids to replace them). If the wage covers that cost, Marx says the exchange is equivalent. No cheating has occurred. The worker got the full value of their *capacity* to work.

  **The Production (Where you are right):**
  Once the deal is signed, the worker goes into the factory. Here is the trick: It might take only **4 hours** of work to produce enough value to cover the cost of the worker's wage (their subsistence). But the capitalist bought **8 hours** of Labor Power.

  So, for the first 4 hours, the worker works for themselves. For the next 4 hours, the worker works for free. This is **Surplus Value**. The capitalist keeps the value produced in those last 4 hours.

  **The Resolution:**
  Exploitation doesn't happen because the worker was underpaid for what they *sold* (Labor Power). It happens because the value they *produced* (Labor) is greater than what they were paid. The "fair" market exchange masks the "unpaid" labor that happens inside the factory. Marx calls the market the "sphere of circulation" (where everything looks free and equal) and the factory the "hidden abode of production" (where the domination happens).

  ### 3. Did Marx think Capitalism was "Unjust"?
  This is where it gets complicated, and it's likely why you two couldn't agree.

  **The Short Answer:** Marx rarely used the word "unjust" to describe capitalism, and many scholars argue he didn't think it was unjust *by its own standards.*

  **The Nuance:**
  Marx viewed "justice" as a legal and moral concept that changes depending on the economic system.
  *   In Feudalism, it was "just" for lords to take a cut of the serf's crop.
  *   In Capitalism, it is "just" for capitalists to keep the surplus value, because they bought the labor power fairly.

  Marx's critique wasn't primarily moral (i.e., "This is mean/wrong"); it was **scientific and historical**. He argued capitalism was:
  1.  **Inefficient:** It creates crises and waste.
  2.  **Oppressive:** It forces workers to sell their lives to survive.
  3.  **Transient:** It creates the conditions for its own downfall.

  In *Capital*, Marx actually mocks socialists who complain about capitalism being "unfair." He writes that if the exchange of labor power is consistent with the capitalist mode of production, it cannot be "unjust." To call it unjust is to judge a past system by the standards of a future one.

  **However,** Marx clearly hated the system. He described it as "vampire-like" sucking living labor. So, while he might not have used the philosophical label of "injustice" (because he thought morality was a tool used by the ruling class), he definitely viewed it as **illegitimate, oppressive, and something that ought to be overthrown.**

  ### Summary for your argument
  *   **On Exploitation:** Your friend is right. Marx insists the wage contract is fair. The exploitation comes from the difference between the cost of the worker's time and the value the worker creates during that time.
  *   **On Cheating:** You are right that the worker gets a raw deal, but wrong that it's "cheating." It's a structural feature, not a bug. The capitalist *must* extract surplus value to survive competition.
  *   **On Justice:** You are both sort of wrong. Marx didn't argue capitalism was "unjust" in a moral sense; he argued it was a historical stage that enslaves workers through economic necessity rather than legal force.

  **The TL;DR:** Marx's point was precisely that **you don't need cheating to have exploitation.** You can have a perfectly "fair" contract that still results in one class dominating another. That is why he considered his discovery of "Surplus Value" so important.
