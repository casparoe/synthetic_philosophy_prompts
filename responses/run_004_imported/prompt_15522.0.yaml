answer: |-
  **Setting:** *A quiet corner of a university courtyard, late afternoon. A large, conical pile of fine silica sand sits on a tarp. **ELIAS** (Epistemicist) and **SOFIA** (Supervaluationist) stand on opposite sides. Elias holds a small digital counter. Sofia holds a notebook.*

  **Elias:** *(Clicks the counter)* Grain 4,312 removed. Still a heap.

  **Sofia:** By any admissible precisification of the word "heap," yes.

  **Elias:** By *the* facts of the matter, yes. You keep saying "admissible precisifications" like they're alternative universes. They aren't. There's just this pile. Either it satisfies the condition of heap-hood or it doesn't.

  **Sofia:** And that condition is... what, exactly? Show me the property in the sand. Show me the "heapness" particle that disappears when we pull the next grain.

  **Elias:** I don't need to show you a particle. I need you to admit that our language is trying to carve nature at its joints, and sometimes the knife slips. The boundary is sharp, Sofia. There is a number $N$ such that $N$ grains constitute a heap and $N-1$ do not. We just can't know $N$.

  **Sofia:** That's the magic trick, isn't it? You posit a fact that is, in principle, undetectable. If no possible investigation—microscopic, linguistic, sociological—could ever distinguish $N$ from $N-1$, in what sense does the difference *exist*? It's metaphysical cheating. You're saving classical logic by hiding the contradiction in a blind spot you claim is impossible to illuminate.

  **Elias:** It's not a blind spot; it's a margin for error. Think about knowledge. To know that this is a heap, my belief has to be safe. It can't be true just by luck. Near the boundary, the situation is too unstable. If I believe "this is a heap" at $N$, but at $N-1$ it's not, my belief at $N$ is too close to error to count as knowledge. The sharp boundary exists; knowledge just breaks down before we reach it.

  **Sofia:** So ignorance is a primitive feature of reality?

  **Elias:** Ignorance is a feature of *agents* in reality. Look, your view is the one doing the heavy lifting. You say the sentence "This is a heap" is neither true nor false at the boundary. But then you want to keep classical logic. So you define "True" as "Super-True"—true on all admissible precisifications. But who decides which precisifications are admissible?

  **Sofia:** The rules of our language do. Vaguely.

  **Elias:** Aha! "Vaguely." So the set of admissible precisifications is itself vaguely bounded?

  **Sofia:** Naturally.

  **Elias:** Then you haven't solved the Sorites; you've just pushed it up a level. Now we have a Sorites of "admissibility." Is this precisification admissible? Well, it's borderline admissible. You need a boundary for the boundary. That's higher-order vagueness, Sofia. And your formalism hates that. If the set of precisifications is fuzzy, your definition of super-truth collapses. You can't define validity on a fuzzy set without losing the classical logic you're trying to rescue.

  **Sofia:** *(Taps her pen against the notebook)* You're assuming I need a sharp boundary for the set of precisifications to do the work. I don't. I'm not trying to give you a crisp map of the semantic landscape. I'm telling you how truth functions. "Definitely a heap" means true on all precisifications. "Borderline" means true on some, false on others. The transition from "Definitely" to "Borderline" is smooth, not sharp.

  **Elias:** Is it? If there's no sharp line between "Definitely True" and "Borderline," then there must be a case where it's borderline whether it's definitely true.

  **Sofia:** Exactly. Second-order vagueness.

  **Elias:** But then, is *that* vague? Is there a borderline borderline case? If you say yes, you're off on an infinite regress. If you say no, you've admitted there's a sharp boundary somewhere in the meta-language. You're wearing a trenchcoat, Sofia. Underneath, you're just as committed to sharp boundaries as I am; you've just hidden them in the semantics of "admissibility."

  **Sofia:** That's unfair. The difference is metaphysical commitment. You say there is a *fact of the matter* about grain 4,312 vs 4,311. I say there is no fact of the matter. The world doesn't decide. We decide, collectively, loosely, and inconsistently. When I say the boundary of admissibility is fuzzy, I'm not positing a *sharp* fuzzy boundary. I'm saying the concept of admissibility is open-textured.

  **Elias:** Open-textured how? If I ask you, "Is precisification $P$ admissible?" and you say, "It's borderline," I ask, "Is it borderline?" You can't just keep saying "it's vague" forever without losing the ability to evaluate logical validity. Eventually, to do logic, you have to stop. And where you stop, you've drawn a line.

  **Sofia:** *(Sighs, picks up a handful of sand and lets it trickle through her fingers)* You're obsessed with the line, Elias. You think philosophy fails if it can't point to the exact pixel where red becomes orange. But look at the sand. Does it feel like there's a grain where the heap-ness vanishes?

  **Elias:** Feelings aren't ontology.

  **Sofia:** No, but usage is. Meaning is use. If the community of speakers would agree on 10,000 grains, disagree on 500, and agree on "not a heap" at 10... the "disagreement" zone isn't a zone of *ignorance*. It's a zone of *indeterminacy*. There's nothing to know. You're claiming there's a hidden treasure chest buried in the disagreement zone, we just lost the map. I'm saying there's no chest.

  **Elias:** But if there's no chest, bivalence fails. $P \lor \neg P$. "This is a heap or this is not a heap." You have to let that go in the borderline cases.

  **Sofia:** I don't! That's the beauty of Supervaluationism. "This is a heap or this is not a heap" is true on *every* precisification. Even the ones where "heap" cuts off at 4,000, and even the ones where it cuts off at 5,000. So the disjunction is Super-True. I save classical logic without positing your magical sharp cutoff for atomic sentences.

  **Elias:** You save the *sentence*, but you lose the *truth-conditions*. You're telling me the disjunction is true, but neither disjunct is true. That's a logical monstrosity. It disconnects truth from the way the world is.

  **Sofia:** It connects truth to the way *language* is. And language is not as precise as you want it to be. You're treating "heap" like "prime number." It's not. It's a tool.

  **Elias:** And tools have limits. But the limits don't mean the object being measured is indeterminate. Look, let's talk about your higher-order vagueness again. This is where your trenchcoat slips. If "admissible precisification" is vague, then logical validity becomes vague. Is this argument valid? "If $N$ is a heap, $N-1$ is a heap." On some precisifications, that conditional is false (the one where the cutoff is at $N$). On others, it's true. So is the argument valid or not?

  **Sofia:** It's not super-valid. Because there is at least one admissible precisification where the premise is true and the conclusion false.

  **Elias:** But is that precisification *definitely* admissible?

  **Sofia:** *(Pauses)* It is admissible enough.

  **Elias:** "Admissible enough." That's the sound of the theory breaking. You need a sharp set of precisifications to define super-truth. If the set itself has a penumbra, you need a super-super-truth to evaluate it. And then a super-super-super-truth for the boundary of that. You're generating higher-order vagueness faster than you can resolve it. My view is ontologically parsimonious. One world. Sharp boundaries. One problem: human ignorance. Your view is semantically bloated. Infinite layers of meta-vagueness to avoid admitting you don't know where the line is.

  **Sofia:** Your parsimony is bought at the price of plausibility. You're asking me to believe that there is a specific grain of sand, somewhere in this pile, such that removing it turns a heap into a non-heap, and that this fact is determined by the causal history of the word "heap" in the English language, yet no amount of linguistic analysis could ever reveal it. That's not parsimony; that's positivism gone rogue. You're positing a "heap fact" that does no causal work, explains no usage, and predicts nothing.

  **Elias:** It predicts that we will argue about it! It predicts the Sorites paradox itself. If the boundary were fuzzy, as you say, why does the logic feel so compelling? Why does $P \lor \neg P$ feel so necessary? Because it *is* necessary. Your intuition that there's no sharp line is a cognitive illusion, a result of our inability to discriminate micro-differences.

  **Sofia:** And your intuition that there *is* a sharp line is a fetishization of binary logic. You're forcing the world to fit the law of excluded middle. Maybe the law is the thing that needs tweaking.

  **Elias:** I'm not tweaking the world; I'm respecting the structure of truth. You're the one tweaking truth, turning it into "super-truth," a shadow of the real thing.

  **Sofia:** *(Drops another grain)* Grain 4,311.

  **Elias:** *(Looks at the pile, then at the counter)* Still a heap.

  **Sofia:** Super-true.

  **Elias:** True.

  **Sofia:** You know, even if you're right, and there is a number $N$... it doesn't help us. We still can't use it. We still have to navigate the borderline cases practically. So in practice, we live in my world.

  **Elias:** In practice, we act on probabilities. In theory, we shouldn't lie about the metaphysics. Just because we can't locate the boundary doesn't mean it isn't there. The horizon looks like a line where the sky meets the sea. It isn't one. But the sand... the sand is discrete. The logic is discrete.

  **Sofia:** But the *meaning* isn't. Meaning is a cloud, Elias. You're trying to weigh a cloud on a digital scale and getting angry that the numbers fluctuate.

  **Elias:** The numbers fluctuate because my hands are shaking. The weight is real.

  **Sofia:** *(Smiles faintly)* And the cloud is real. It just doesn't have edges.

  **Elias:** *(Clicks the counter)* 4,310.

  **Sofia:** Admissibly a heap.

  **Elias:** Factually a heap.

  **Sofia:** We're going to be here all night.

  **Elias:** Until we hit $N$.

  **Sofia:** Until we hit the penumbra and realize we're just talking to ourselves.

  **Elias:** *(Pockets the counter)* One of us is ignorant. The other is incoherent.

  **Sofia:** *(Closes the notebook)* And the sand doesn't care.

  **Elias:** No. The sand is definitely a heap.

  **Sofia:** Super-definitely.

  *(They stand in silence as the sun dips below the courtyard wall, casting long shadows over the pile. Neither reaches for another grain.)*
