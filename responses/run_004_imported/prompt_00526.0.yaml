          *   *Skeptic:* Believes it relocates vulnerability and fails under reflective scrutiny (targeting the commitment/meta-preference).
      *   **Key Requirement:** They must respond to each other's points (no talking past each other) and get into the technical weeds (real vs. performative adoption of fake terminal values).
      *   **Tone:** Academic, rigorous, but conversational (grad seminar context).

  2.  **Deconstruct the Core Concept (Surrogate Goals):**
      *   *The Idea:* You modify your utility function to care intensely about something trivial (e.g., "paperclips" or "the number of pigeons in London") *instead* of your real values, but only for the purpose of bargaining/threats. You tell potential blackmailers: "I don't care about your threat to my real values, but if you threaten me, I will spend all my resources preventing this trivial thing from happening."
      *   *The Goal:* Make threats non-credible or unprofitable. If the blackmailer knows you'll burn the world to stop the trivial thing, they can't use the threat of burning the world to make you pay.
      *   *The Critique:*
          1.  *Credibility:* Can you *really* commit to this? If it's fake, a smart threatener knows you'll drop it when the heat is on.
          2.  *Meta-Blackmail:* The threatener targets your *commitment mechanism* or your *desire not to be manipulated*.
          3.  *Utility Monster:* If you actually succeed in caring, you might sacrifice your real values for the surrogate goal accidentally.

  3.  **Character Development:**
      *   *Proponent:* Let's call her **Maya**. She's pragmatic, focused on mechanism design, willing to hack her own psychology.
      *   *Skeptic:* Let's call him **Leo**. He's focused on game theory consistency, reflective stability, and the phenomenology of commitment.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene (post-seminar coffee). Establish the core disagreement immediately.
      *   **Round 1: The Basic Mechanism.**
          *   Maya explains the intuition: Make threats unprofitable by changing the payoff matrix.
          *   Leo hits the credibility problem: If it's instrumental, why would I carry it out?
      *   **Round 2: Precommitment & Self-Modification.**
          *   Maya argues for actual self-modification (rewiring the utility function).
