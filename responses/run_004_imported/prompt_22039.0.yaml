  "Lewis says the credence is 1/2. Elga says 1/3. Who's counting correctly?"

  The Drug checks its ledger and says, "Lewis is billing per coin flip. Elga is billing per wake-up. And if it's Tails, I'm afraid Elga is sending you two invoices."
