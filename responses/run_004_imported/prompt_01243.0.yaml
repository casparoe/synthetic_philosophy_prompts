answer: |-
  This is a sophisticated question that cuts to the heart of both population ethics and early modern metaphysics. It is excellent that you are looking for historical resources to critique a modern problem, but it requires careful handling because Locke and Parfit are playing very different games.

  Your teammate's intuition is creative: if "personhood" is about consciousness rather than biology, maybe the same "person" could exist despite different biological origins. However, if we reason strictly from Locke's *An Essay Concerning Human Understanding* (Book II, Chapter XXVII), the verdict is somewhat counterintuitive.

  Here is a step-by-step reconstruction of how Locke would likely analyze the Non-Identity Problem (NIP), where his framework aligns with Parfit, where it diverges, and where it ultimately hits a wall.

  ### Step 1: Clarifying the Categories (Man vs. Person)
  The first thing Locke would do is scold us for using the word "people" loosely. For Locke, we must distinguish between:
  1.  **The "Man":** The biological human organism. Identity here is determined by the continuity of life and bodily organization.
  2.  **The "Person":** A forensic (legal/moral) term. It is "a thinking intelligent being, that has reason and reflection, and can consider itself as itself." Identity here is determined strictly by **consciousness** (specifically, memory and self-awareness).

  **Locke's Analysis of the NIP Premise:**
  The Non-Identity Problem assumes that if a different sperm fertilizes a different egg at a different time, a *different individual* comes into existence.
  *   **On the level of "Man":** Locke would agree with Parfit. A different biological origin constitutes a different organization of life. Therefore, the conservation policy produces one set of "Men," and the depletion policy produces a distinct set of "Men."
  *   **On the level of "Person":** This is where your teammate's objection comes in. They suggest that because Personhood is psychological, biological origin might not matter.

  ### Step 2: The Dependence of Consciousness on Organization
  Here is where Locke likely **cannot** support your teammate's hope. While Locke defines "Person" by consciousness, he is not a dualist who believes consciousness floats freely independent of the body.

  In the *Essay*, Locke argues that consciousness is annexed to the "Man." He writes that while it is *metaphysically possible* for the same consciousness to inhabit different bodies (his famous "Prince and Cobbler" thought experiment), in the ordinary course of nature, consciousness arises from and is tied to the specific constitution of the human body.

  **Locke's Reasoning:**
  1.  Consciousness requires a substrate (a brain/body organization) to exist.
  2.  A different biological conception creates a different "Man" (different organization of matter).
  3.  Therefore, a new consciousness begins.
  4.  Since Personal Identity *is* sameness of consciousness, a new consciousness means a **new Person**.

  **Verdict on Metaphysics:** Locke would actually **agree** with Parfit's metaphysical claim. If the policy changes who is conceived, it creates different "Men," which in turn generates different "Persons." There is no Lockean loophole that allows the *same* Person to be born from different parents. The "not-yet-conceived" have no consciousness, and therefore, for Locke, they are not yet "Persons" at all.

  ### Step 3: The Forensic Turn (Where Locke Diverges)
  If Locke agrees that different policies create different future Persons, does he agree with the NIP's moral conclusion (that we haven't harmed them)?

  **No.** This is where Locke's framework offers a powerful critique, not by solving the identity puzzle, but by rendering it morally irrelevant.

  For Locke, "Person" is a **forensic** term. It exists to assign accountability, reward, and punishment.
  *   **Parfit's Focus:** Welfare and Harm. (Did we make *this* person worse off?)
  *   **Locke's Focus:** Duty and Law. (Did we violate the Law of Nature?)

  Locke would argue that the NIP makes a category mistake. It tries to ground moral obligation in the *welfare of specific victims*. Locke grounds moral obligation in the *Law of Nature* (which he equates with God's will or rational duty).

  **Locke's Reasoning:**
  1.  Moral obligations do not depend on the identity of the recipient, but on the nature of the action.
  2.  If resource depletion violates the Law of Nature (e.g., by destroying the means of preservation for Mankind), it is a "wrong" action regardless of who suffers it.
  3.  The fact that the sufferers are "different people" than would have otherwise existed does not absolve the agent of the violation.

  **Analogy:** If I poison a well, and a traveler drinks from it and dies, I am guilty of murder. It does not matter if, had I not poisoned the well, that traveler would have taken a different path and a *different* traveler would have died. My guilt is attached to my action (poisoning), not the specific identity of the victim.

  ### Step 4: The Problem of "Non-Existent Persons"
  There is a genuine gap in Locke's framework here that we must be honest about. Locke's theory of identity is designed to explain how *existing* beings persist through time. It is not designed to handle *possible* beings.

  *   **Locke's Limit:** For Locke, a "Person" begins when consciousness begins. Before conception, there is no Person. Therefore, there is no "possible Person" waiting in the wings to have rights.
  *   **The Consequence:** Locke cannot say we owe duties to *specific* future individuals (e.g., "Alice in 2100"), because Alice does not exist and her identity is contingent on our current actions.

  However, Locke *can* say we owe duties to the **Succession of Mankind**. In his political writings (compatible with the *Essay*'s view of "Man"), Locke emphasizes the preservation of the species.
  *   **Locke's Shift:** We do not owe conservation to *Person X* (who might not exist). We owe conservation to the *concept of Humanity* (the "Man") which must continue.
  *   **The Argument:** By depleting resources, we threaten the continuity of the "Man" species. Even if the specific future "Men" are different than they would have been, if their quality of life is so degraded that their "consciousness" is dominated by suffering or survival, we may have violated the duty to preserve Mankind in a state capable of rational agency.

  ### Step 5: Synthesizing the Lockean Response
  If Locke were sitting at your Ethics Bowl table, his response would likely look like this:

  1.  **Concede the Metaphysics:** "You are correct that different policies produce different specific Persons. Identity follows consciousness, and consciousness follows biological organization. The future people under the depletion policy are numerically distinct from those under the conservation policy."
  2.  **Reject the Moral Conclusion:** "However, you err in thinking this absolves us. Moral identity is about the *agent*, not the *patient*. I am the same Person who acted, and I am accountable for whether my action conforms to Reason and Natural Law."
  3.  **Reframe the Obligation:** "We do not owe existence to specific future souls. We owe the preservation of the Earth to the *Succession of Men*. To leave the world uninhabitable is to break the chain of human continuity, which is a violation of our stewardship, regardless of who specifically inhabits the ruins."

  ### Conclusion: Does Locke Solve the Problem?
  **Honest Verdict:** No, Locke does not "solve" the Non-Identity Problem in the way modern philosophers hope (i.e., by proving the future people are the *same* people). His framework actually **reinforces** Parfit's metaphysical claim that they are different people.

  **However,** Locke provides a **dissolution** of the problem. The NIP is powerful only if you believe moral obligations require specific, identifiable victims who are made "worse off" than they would otherwise be. Locke rejects this premise. For Locke, an action can be wrong even if no specific existing person is harmed, provided it violates the rational order of nature.

  **For your Ethics Bowl Case:**
  You can use Locke to argue that the team should stop focusing on *harm to specific future individuals* (which leads to the NIP dead end) and start focusing on *stewardship of the human species*.
  *   **Argument:** "The Non-Identity Problem assumes our duty is to maximize welfare for specific individuals. A Lockean framework suggests our duty is to maintain the conditions necessary for *Personhood itself* (rational, conscious life) to continue. Depleting resources threatens the *capacity* for future Personhood, regardless of *which* persons exist."

  This allows you to acknowledge Parfit's logic without accepting his conclusion, using Locke to shift the ground from "harm" to "duty."
