prompt: |-
  quick philosophy question for a novel i'm working on. my main character spends most of the book lying to herself about her marriage and her career, and then has a cracking-open moment near the end where the self-deception falls away and she finally becomes her true, authentic self. i want that whole arc to basically dramatize Sartre's move from bad faith into authenticity - like the deception was hiding who she really was underneath, and once its gone she just gets to be that person. does that actually line up with what Sartre meant by bad faith and authenticity, or am i flattening it too much? dont want to put dumb philosophy in her mouth if im getting it wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel.
      *   **Plot Arc:** Main character (MC) lies to herself about marriage/career $\rightarrow$ "Cracking-open" moment $\rightarrow$ Self-deception falls away $\rightarrow$ Becomes true/authentic self.
      *   **Philosophical Framework:** The user wants this to dramatize Jean-Paul Sartre's concepts of *Bad Faith* (*mauvaise foi*) and *Authenticity*.
      *   **Specific Question:** Does this arc line up with Sartre, or is it a flattening/misinterpretation? (Specifically concerned about the idea of a "true self underneath" waiting to be revealed).
      *   **Tone:** Helpful, precise, philosophical but accessible, encouraging but critical.

  2.  **Evaluate the Philosophical Concepts (Sartre 101):**
      *   **Bad Faith (*Mauvaise Foi*):** This is self-deception. It involves denying one's own freedom or responsibility. Usually, it takes two forms:
          1.  Denying transcendence (freedom/possibility) and pretending to be a fixed object/fact (e.g., "I *am* a waiter," "I *am* a wife," as if these are essential natures).
          2.  Denying facticity (the facts of the situation) and pretending to be pure freedom without constraints.
      *   **Authenticity:** This is the opposite of bad faith. It involves owning one's freedom and responsibility. It means recognizing that you are *not* a fixed essence. You are what you do.
      *   **The Crucial Conflict:** The user describes the arc as "hiding who she really was underneath, and once its gone she just gets to be that person."
      *   **The Problem:** Sartre famously said, "Existence precedes essence." There is *no* "true self underneath" waiting to be uncovered. There is no pre-existing human nature or core identity. Authenticity isn't finding a hidden treasure; it's accepting the terrifying burden of creating yourself through action *now*.
      *   **Verdict:** The user's intuition is half-right (bad faith = self-deception), but the resolution (finding a "true self") is actually *anti-Sartrean*. It sounds more like Romanticism or Humanism (which Sartre critiqued).

  3.  **Drafting the Response:**

      *   **Acknowledge the Strength:** Start by validating that the *Bad Faith* part is actually quite good. Lying to oneself about social roles (wife, employee) is classic Sartrean bad faith (treating oneself as a thing-in-itself).
      *   **Identify the Flaw:** Gently point out the "True Self" problem. Sartre rejects the idea of a hidden core.
      *   **Explain "Existence Precedes Essence":** This is the key phrase. Explain that for Sartre, you *are* your actions. There is no "real her" waiting in the wings.
      *   **Reframing the Arc (The "Fix"):** How can the user keep the drama but make it philosophically accurate?
          *   Instead of *revealing* the true self, the MC must *choose* a new path.
          *   The "cracking-open" moment isn't finding truth; it's accepting responsibility/freedom.
          *   It's not "I am finally me"; it's "I am responsible for who I become."
      *   **Nuance on Bad Faith:** Briefly mention the two poles (facticity vs. transcendence) to show depth. The MC is likely clinging to facticity (roles) to avoid the anxiety of transcendence (freedom).
      *   **Tone Check:** Ensure I don't sound like a gatekeeping philosophy professor. Use novelistic language ("dramatize," "arc," "moment").
      *   **Recommendation:** Suggest reading *Existentialism is a Humanism* (short, accessible) or looking at *Nausea* (Roquentin's experience).

  4.  **Refining the Argument (Self-Correction during drafting):**
