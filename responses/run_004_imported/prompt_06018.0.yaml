      *   *Q5: Chalmers's Reply (Required).* Metaphysical reality vs. skeptical nightmare.
      *   *Q6: The "Shut Down" Risk.* If we are in a sim, can we be turned off? This is high stakes for a cult.
      *   *Q7: Epistemic Stability.* If physics is just code, can we trust the logic used to prove the sim? (Self-defeating argument).
      *   *Q8: Moral Status of Simulators.* Do we owe them anything? (Cult recruitment hook).
      *   *Q9: Falsifiability.* How could you be wrong?
      *   *Q10: Practical Norms (Required).* Does this change how we live?

      *Refining for the "Cult Leader" Stress Test:* The novelist wants to know where the argument is vulnerable so they can show the cult leader glossing over it, or so they can make the cult leader's version sound seductive but flawed. The questions should push the philosopher to admit uncertainties.

      *Refining the Follow-ups:* The follow-ups need to anticipate the "Standard Philosopher Defense" and push deeper.

  4.  **Developing Specific Questions (incorporating constraints):**

      *   *Drafting Q2 (Reference Class):* Instead of just asking "what is it?", ask "Why am I in the class of 'simulated observers' rather than 'base reality observers'?"
      *   *Drafting Q3 (Substrate):* Focus on the "puppet" objection. If silicon doesn't feel, the numbers don't matter.
