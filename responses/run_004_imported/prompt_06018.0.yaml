prompt: |-
  I'm a novelist who also hosts a small interview series on the side, and next month's guest is a philosopher known for defending a strong reading of the simulation argument -- not merely that the hypothesis is coherent, but that we should assign it real, non-negligible credence. I'm also several chapters into a novel in which a charismatic cult leader uses exactly this argument to recruit new members, so I want the questions to do double duty as good radio and as a stress test of the argument before I put a polished version of it in his mouth. Please draft eight to ten questions that go beyond having her restate Bostrom's trilemma: at least one on the reference-class problem hidden in the anthropic reasoning behind the third horn (why "observers with my exact evidence" is the right class to sample from), one on how far the whole inference leans on substrate-independence -- the assumption that a mind simulated on silicon is a genuine experiencing subject rather than a very convincing puppet -- and one on David Chalmers's reply that even a true simulation hypothesis wouldn't be a skeptical scenario, since the objects around us would still exist, just implemented computationally rather than the way we assumed. End with a question testing whether any actual belief or behavior -- caution, humility, trying to be "interesting" -- is rationally licensed by taking the hypothesis seriously, or whether that smuggles normative content into a purely metaphysical thesis, and give each question a brief follow-up keyed to the answer she's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User:** Novelist and podcast host.
      *   **Guest:** Philosopher defending a *strong* reading of the Simulation Argument (SA) (i.e., high credence, not just coherence).
      *   **Context:** User is writing a novel where a cult leader uses this argument for recruitment.
      *   **Goal:** 8-10 interview questions.
      *   **Requirements:**
          *   Go beyond restating Bostrom's trilemma.
          *   Must include specific topics: Reference Class Problem (anthropic reasoning), Substrate Independence (consciousness in sims), Chalmers's reply (simulation $\neq$ skepticism).
          *   Must end with a question on practical implications (belief/behavior vs. normative smuggling).
          *   Format: Question + Brief Follow-up (keyed to likely answer).
          *   Tone: Intellectual, probing, suitable for radio/podcast, useful for fiction research (stress-testing the argument).

  2.  **Deconstruct the Simulation Argument (SA) & Philosophical Nuances:**
      *   *Bostrom's Trilemma:* (1) Extinction before post-humanity, (2) Post-humans don't run ancestor sims, (3) We are almost certainly in a sim.
      *   *Strong Credence:* The guest believes (3) is likely true.
      *   *Reference Class Problem:* Who counts as "me"? Why group me with simulated beings rather than biological ones?
      *   *Substrate Independence:* Can silicon feel? If not, the sims are "zombies," and the argument fails to prove *we* are sims (since we feel).
      *   *Chalmers's Point:* If we are in a sim, tables still exist (as data), causality still holds. It's not a dream/skepticism scenario in the traditional sense.
      *   *Practical Implications:* Does believing this change how you act? (e.g., trying to be entertaining to keep the sim running, or moral caution). Or is it just metaphysics with no cash value?
      *   *Cult Angle:* The novelist wants to see how this gets twisted. The questions need to expose weak points a cult leader might exploit or gloss over.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: Introduction/Setup.* Need to move past the basic trilemma quickly. Let's focus on the *probability* assignment.
      *   *Q2: Reference Class (Required).* This is technical but needs to be accessible. Focus on "why this group?"
