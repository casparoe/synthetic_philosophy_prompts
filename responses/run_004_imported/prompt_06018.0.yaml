      *   Ensure the "novelist" angle is subtly served (questions that reveal narrative tension).

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure the follow-ups aren't just "Okay, but..." but specific counter-moves based on typical philosophical positions (e.g., functionalism).
