answer: |-
  The dawn prayer had just finished when Yusuf entered the observatory, the stone still cool under his sandals. He lit the oil lamp on his workbench, striking flint against steel. A spark flew, touched the wick, and a flame bloomed. In the schools of his childhood, the masters had corrected him when he said the oil *made* the light. "The oil provides the occasion," the master had said, tapping Yusuf's knuckles with a reed pen. "God creates the light. He does so whenever oil meets fire, usually. But the connection is in His will, not in the matter."

  Yusuf watched the flame stabilize. It was a comfortable thought, though it carried a weight that never fully lifted. In the Christian lands to the north, they spoke of nature as a machine, a clockwork of necessary causes locked together. Here, in the House of Wisdom, nature was a conversation. Every event was a fresh word spoken by the Divine Voice. The universe was not a chain; it was a string of pearls, each separate, held together only by the thread of God's habit (*ʿāda*).

  He spent the morning calibrating the astrolabes. This work required immense precision. If God's habit was consistent, then the angles of the sun's ascent should match yesterday's, and the day before's. To measure sloppily was not just poor science; it was a failure to read the syntax of the Custom accurately. Yusuf recorded the degrees in his ledger, his hand steady. He trusted the sun would rise tomorrow. But he knew, with a clarity that sometimes woke him at night, that the sun rose not because it *had* to, but because the Speaker chose to repeat the word "light."

  By afternoon, the heat in the courtyard was heavy. Yusuf moved to the inner lab to work with the glass vessels. He was investigating the expansion of air under heat. He set a glass retort over a brazier, sealing the neck with wax. He added weights to a piston, watching the air compress.

  His assistant, Layla, handed him a piece of cotton. "For the brazier, Master? The wick is low."

  "Thank you," Yusuf said. He took the cotton with iron tongs and held it near the ember.

  This was the moment. The Seventeenth Discussion, distilled into a gesture. In a necessary universe, the fire possessed a quality—heat—that acted upon the cotton's flammability. The burning would be a transfer of power. But Yusuf knew there was no power in the ember. There was only black carbon and the potential for occasion. There was no flammability in the cotton, only the potential to be acted upon.

  He lowered the cotton. It touched the red glow.

  For a fraction of a second, before the orange creep of combustion took hold, Yusuf felt the gap. It was a metaphysical vertigo. The fire was here. The cotton was here. Contact was achieved. Logically, nothing demanded the next state. The burning was a new creation, distinct from the touch. God could, in this exact instant, create the touch without the burn. He could create the cotton turning to ice. He could create the fire vanishing. The laws of physics were not laws; they were statistics of Divine Generosity.

  The cotton ignited. The flame curled upward, blackening the fibers.

  Yusuf exhaled, a breath he hadn't realized he was holding. He recorded the time of ignition in his ledger. *Custom maintained.*

  "Is the ratio consistent with yesterday?" Layla asked, not looking up from her own calculations.

  "Yes," Yusuf said. "The Habit holds."

  It was mundane. That was the miracle of it. The theologians spoke of *kharq al-ʿāda*—the tearing of the habit—as a miracle for prophets. But for Yusuf, the mere stability of the afternoon was the true wonder. If every moment was a new creation, then trust was the only engine of science. He trusted that God would not change His mind about gravity before he set down his inkwell. He trusted the air would remain breathable until the next breath was created.

  He walked to the window as the sun began to dip. The shadows lengthened across the tiles. In a mechanical world, this was the rotation of the earth. Here, it was the scrolling of a backdrop. Yusuf placed his hand on the stone sill. It was solid. He pressed harder. It did not turn to water.

  He thought of Ibn Rushd's critique, whispered in the corridors of the university. *If you deny causation, you deny knowledge.* If fire doesn't burn by necessity, how can we predict anything? How can we live?

  Yusuf looked at his hand. He could live because the Custom was stronger than necessity. Necessity was blind; Custom was intentional. The sun rose because God cared for the world enough to repeat the act of creation. The fire burned because there was a purpose in the ash.

  But the fragility remained. It hummed beneath the floorboards. It was why scientists here prayed more often than their counterparts in the north. When a experiment failed, it was not always error; sometimes it was a signal, a slight variation in the Will. When a medicine failed to cure, it was not chemistry failing, but the Habit shifting.

  "Master?" Layla called. "Shall we extinguish the braziers?"

  "Yes," Yusuf said. "Before the evening prayer."

  She moved to snuff the flames. Yusuf watched the smoke rise. It curled in complex eddies, unpredictable in detail, predictable in kind. He realized then that living in this world required a double vision. One eye measured the degrees, the weights, the times, treating the world as stable as stone. The other eye watched the stone, waiting for it to remember it was only a word.

  He packed his ledger away. The lab grew dim. Tomorrow, he would return. He would light the lamp. He would expect the oil to burn. He would know it might not. And in that knowing, in that daily renewal of trust without guarantee, he found a strange, quiet freedom. The world was not a cage of causes. It was a gift, given again and again, moment by moment, waiting to be received.

  Yusuf stepped into the courtyard. The first star appeared. He did not assume it would remain. He simply watched it, grateful for the light while it lasted.
