      *   Scientific practice: Instead of discovering "laws of nature," scientists are cataloging "Divine Habits." Predictability is based on God's consistency (*sunna*), not physical necessity.
      *   Terminology: *ʿĀda* (custom/habit), *Qudra* (power), *Irāda* (will).
