      *   But pre-registration is designed to *prevent* ignoring null results (to combat publication bias/p-hacking).
      *   *Tension:* Epistemic confidence ("I know") vs. Methodological humility ("I must test").

  4.  **Evaluate Standard Escape Routes (in the context of Science):**

      *   **Defeasibility Theory (Lehrer, Paxson):** Knowledge is justified true belief + no defeaters.
          *   *Implication:* You don't *know* $p$ if there is a potential defeater (like a rigorous replication) pending.
          *   *Scientific fit:* Good. It suggests "I believe strongly, but I don't *know* until the replication clears the defeater." Lowers the bar from "Knowledge" to "High Confidence."
