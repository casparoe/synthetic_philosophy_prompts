      *   *Premise 1:* I know that $p$.
      *   *Premise 2:* If I know that $p$, then I know that any evidence against $p$ is misleading/false.
      *   *Premise 3:* If I know that evidence $e$ is misleading, I am justified in ignoring/discounting $e$ without examining it.
      *   *Conclusion:* If I know $p$, I am justified in ignoring any future evidence against $p$.
