      *   **Higher-Order Evidence (HOE) / Epistemic Akrasia:**
          *   *Implication:* Even if first-order evidence supports $p$, the fact that reputable peers are testing it (or that replication crises exist) is HOE that you might be wrong.
          *   *Scientific fit:* Very strong. The "replication crisis" *is* higher-order evidence that social psych findings are often false positives.
          *   *Akrasia:* "I believe $p$, but I shouldn't believe $p$ given the base rates."
