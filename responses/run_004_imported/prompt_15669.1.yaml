      *   *De Brigard's Finding:* He reversed the scenario. Instead of "Would you plug in?", he asked "You are already plugged in, would you unplug?" Many people said they would *stay* in the machine (status quo bias). This suggests the original intuition might be driven by status quo bias rather than a deep truth about value.
      *   *Relevance:* This undermines the strength of Nozick's intuition pump. It doesn't prove hedonism is true, but it weakens the claim that Nozick "settled it."

