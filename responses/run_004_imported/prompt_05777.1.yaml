answer: |-
  **Setting:** *The back bench of "Fix-It Right," 8:30 PM. The shop is closed. MARCUS is soldering a connection on a vintage toaster. ELENA is sitting on a stool, spinning a multimeter probe in her hand.*

  **Marcus:** You're staring at the heating element like it's going to bite you.

  **Elena:** I'm staring at it because you told that woman her toaster was "dangerous" even with the thermal cutoff engaged. That's a disposition claim, Marcus. You're saying it has the *power* to burn the counter down.

  **Marcus:** It *is* dangerous. If the switch jams, it burns. That's just English. "Fragile" means "breaks if struck." "Dangerous" means "harms if triggered."

  **Elena:** That's the Simple Counterfactual Analysis. And it's dead. We buried it thirty years ago.

  **Marcus:** It's not dead, it's just... bruised. Look, take the finkish wire. The wire that's dead until a conductor touches it, then the sensor kicks in and makes it live instantly. You touch it, you get shocked. So, was it live before you touched it?

  **Elena:** No. By your definition, "live" means "would shock if touched." Since it *would* shock, your definition says it was live. But ex hypothesi, it wasn't. The intrinsic state was non-conductive until the stimulus arrived. The counterfactual is true, the disposition is false. Match point for the skeptics.

  **Marcus:** Lewis patched that. You don't look at the extrinsic setup; you look at the intrinsic causal basis. If the wire lacks the microstructure to conduct *at the time of the stimulus*, it isn't live. The sensor is an extrinsic fink. We just tighten the clause: "Would shock if touched, *holding the intrinsic basis constant*."

  **Elena:** Okay, fine. You've saved the wire. But now come to the pharmacy. I have a glass of cyanide. It has the intrinsic molecular basis to kill you. Bond affinity, cellular respiration shutdown, the whole works. But I also hand you a perfect antidote. You drink them together. You live.

  **Marcus:** So?

  **Elena:** So, under your "intrinsic basis" rule, the poison *has* the disposition. It has the causal basis. But the counterfactual "would kill if ingested" is false. Because you *did* ingest it, and you *didn't* die. The disposition is present, the counterfactual is false. That's masking. Your patch doesn't touch it.

  **Marcus:** Easy. We add a *ceteris paribus* clause. "Would kill if ingested... in the absence of antidotes."

  **Elena:** *[Stops spinning the probe]* There it is. The "all else being equal" escape hatch. Marcus, do you realize how much work that clause is doing? To make the counterfactual true, you have to list every single thing that *could* stop the poison. Every antidote, every stomach pump, every genetic immunity, every miracle.

  **Marcus:** We don't need to list them all. We just mean "normal conditions."

  **Elena:** "Normal" is a pragmatic word, not a metaphysical one. What's normal for a human isn't normal for a mouse. But more importantly, it's circular. How do you know which conditions to exclude from the *ceteris paribus* clause? You only know to exclude the antidote because you *already know* the cyanide is poisonous. You're using the disposition to define the conditions for the counterfactual that's supposed to define the disposition. You're chasing your own tail.

  **Marcus:** It's not circular, it's iterative. Science does this all the time. Solubility isn't just "dissolves in water." It's "dissolves in water at pH 7, at 20 degrees, without saturation..." We refine the conditions based on the causal mechanism.

  **Elena:** But you need the mechanism to write the conditions! You're admitting that the *real* truth-maker here is the molecular structure—the causal basis—not the counterfactual itself. The counterfactual is just a shadow the basis casts. Why keep the shadow? Why not just say the disposition *is* the potent property itself?

  **Marcus:** Because "potent property" is magic. It's occult. If I say "this wire has electrity," and you ask "what does that mean?" and I say "it means it has the power to shock," and you ask "what's the power?" and I say "it's a primitive property that just *is*..." I've explained nothing. I've just named the mystery. The counterfactual analysis reduces the mystery to observable behavior and physical structure.

  **Elena:** It reduces it to a false statement, though! Look at your toaster. You told the customer it's dangerous. But suppose there's a hidden fail-safe you don't know about. A nanite swarm in the plastic that instantly cools any overheating element. The toaster has the heating coils (the basis), but it will *never* burn the counter. Is it dangerous?

  **Marcus:** If I don't know about the nanites, I have to treat it as dangerous.

  **Elena:** Epistemology isn't ontology. I'm asking what the toaster *is*, not what you *know*. If the nanites are there, the counterfactual "would burn if left on" is false. But the coils are still hot. Are you saying the disposition vanishes because of the nanites?

  **Marcus:** I'm saying the disposition is relational. It depends on the environment.

  **Elena:** Now you're a relativist! Five minutes ago it was the "intrinsic causal basis." Now it's the environment. Make up your mind. If it's intrinsic, the nanites don't matter. If it's relational, then the finkish wire *was* live, because the environment made it shock. You're moving the goalposts to save the analysis.

  **Marcus:** I'm refining the scope! Look, Elena, pragmatism. When I sell a repair, I'm selling a prediction. "This won't burn your house." That is a counterfactual commitment. If I tell you "It has a primitive power of safety," that doesn't help me. I need to know what happens *if* the switch fails. The utility of dispositions is in the conditionals.

  **Elena:** Utility isn't truth. You can use a flat map to navigate a round earth, but don't tell me the earth is flat. The reason you keep having to patch the definition—finks, masks, mimics, reverse-finks—is because you're trying to reduce a modal reality to a non-modal one. You're trying to turn "could" into "would."

  **Marcus:** "Could" is just "would under some description."

  **Elena:** No. A disposition is a directedness. An arrow. The poison is *directed* at death, even if the antidote blocks it. The arrow is still flying, even if a shield stops it. Your analysis says if the arrow hits the shield, it was never really an arrow. That's absurd.

  **Marcus:** But if the arrow *always* hits a shield, in what sense is it an arrow? Imagine a wire that is finkishly dead. Every time you touch it, the sensor turns it off. It *never* shocks. It has the microstructure of copper, sure, but the connection is severed instantly. You want to call that "live"?

  **Elena:** I'd call it "live but suppressed." Just like the poison.

  **Marcus:** Then your definition covers everything! A block of wood is "fragile but masked by extreme durability." A feather is "heavy but masked by buoyancy." If you can just posit a mask for every failure, the term loses all grip. The counterfactual analysis forces you to cash out the claim. If you say it's fragile, you owe me a break. If you say "it would break but the mask stopped it," you haven't paid the debt.

  **Elena:** I owe you a causal story, not a break. And the causal story is the basis. The problem is you think the counterfactual *analyzes* the basis. It doesn't. It *manifests* it. Sometimes. When not finked. When not masked. When not mimicked.

  **Marcus:** So you need a list of exceptions as long as the universe to make your counterfactual work.

  **Elena:** Or you admit the counterfactual isn't the definition. It's the evidence.

  **Marcus:** If it's not the definition, what is? You keep saying "primitive property." That's a conversation stopper. "Why does it burn?" "Because it has burn-power." "What's burn-power?" "It's primitive." That's not philosophy, that's labeling.

  **Elena:** It's no more labeling than saying mass is primitive. You don't define mass in terms of something non-massive. You accept it as a fundamental feature of reality. Dispositions are the glue of causation. Without them, you just have one event after another with no necessary connection. Hume's nightmare.

  **Marcus:** I'll take Hume over magic. I'd rather have a messy, patchable conditional analysis that connects to empirical testing than a metaphysics of invisible "powers" that might be masked at any moment. At least with my view, if the toaster doesn't burn, I was wrong. In your view, the toaster *was* dangerous, it just didn't show it. How do I ever prove you wrong?

  **Elena:** You prove it by examining the basis. The coils. The chemistry.

  **Marcus:** And if the basis is identical in two objects, but one is finked and one isn't, do they have the same disposition?

  **Elena:** Yes.

  **Marcus:** Then the disposition does no work! The work is being done by the basis and the environment. The "disposition" is just a label we slap on the pair.

  **Elena:** It does the work of explaining *why* that basis reacts to that environment. Copper conducts because it has the disposition of conductivity. You're putting the cart before the horse.

  **Marcus:** I'm putting the horse in the barn where I can feed it. Look, I fix toasters. I don't fix "primitive powers." I fix circuits. If the circuit completes, it heats. If it doesn't, it doesn't. All this talk about masks and finks... it's like arguing about whether a car is "driveable" when it's in a lake.

  **Elena:** But if you pull it out, it starts. That *capacity* was there, under the water. The counterfactual "would start if turned key" was false in the lake. But the car didn't lose its engine. Your analysis says the car lost its driveability. Mine says the driveability was masked by the water. Which one matches reality?

  **Marcus:** Reality doesn't care about our labels. "Driveable" is a word for humans. "Conductive" is a word for engineers. If the analysis gets messy, we clean the analysis. We don't populate the universe with ghosts.

  **Elena:** And if the analysis requires infinite patches to match the intuitions of every engineer, maybe the ghosts are real.

  **Marcus:** *[Turns the toaster over, plugs it in. It glows orange.]* It heats.

  **Elena:** Because the switch didn't fink.

  **Marcus:** Because the disposition is real.

  **Elena:** Because the basis is intact.

  **Marcus:** *[Unplugs it.]* See? We agree on the toaster.

  **Elena:** We agree on the observation. We don't agree on what made it happen.

  **Marcus:** As long as the toast pops, I don't care.

  **Elena:** Until the day the toast doesn't pop, and you need to know if the toaster is broken, or if the universe just decided to mask it.

  **Marcus:** Then I'll open it up and look at the wires.

  **Elena:** And you'll see the basis. And you'll infer the power.

  **Marcus:** And I'll write the conditional.

  **Elena:** *[Slides off the stool]* We're going to be here all night.

  **Marcus:** Probably. You want coffee? The machine's disposition to brew is currently masked by a lack of beans.

  **Elena:** *[Smiles]* See? You get it. It's still a coffee machine.

  **Marcus:** Only if you add the *ceteris paribus* clause.

  **Elena:** Only if you acknowledge the power.

  **Marcus:** *[Grinds beans]* Same difference.

  **Elena:** It's not. But the coffee will be good either way.
