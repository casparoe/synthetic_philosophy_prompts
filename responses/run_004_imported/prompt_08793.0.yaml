prompt: |-
  Next week I'm interviewing a formal epistemologist for my science-and-ideas column. Her signature position is that van Fraassen's Judy Benjamin puzzle -- built specifically to embarrass relative-entropy updating -- doesn't actually embarrass it: she still defends minimizing relative entropy as the correct response even in that case, and treats the intuition that a purely internal fact about the Red-territory split shouldn't move your credence in Red versus Blue as an intuition worth discarding rather than a constraint any update rule has to respect. Draft eight to ten interview questions that go past a bare restatement of that stance: I want at least one question that makes her walk through, in plain terms, the actual mechanism by which conditional information about one branch leaks into the unconditional odds between branches; one that has her defend that rule against Jeffrey conditionalization and Lewis-style imaging on the very same case; and one on what her answer implies for a forecaster or an AI system fed conditional tips instead of flat probabilities. Give each a follow-up keyed to the reply she's most likely to give, and close with a question about what the minimization procedure would have to output for her to admit that the rule itself is broken.
