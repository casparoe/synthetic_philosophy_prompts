  **Slide Title:** The Honesty Hierarchy

  **Body Text:**
  In signaling theory, there are only three ways to claim you're "high quality":

  1.  **The Index (e.g., A Deer's Roar):**
      *   *Why it's honest:* Physics.
      *   *Logic:* A small deer **can't** fake a deep roar.
  2.  **The Handicap (e.g., A Peacock's Tail):**
      *   *Why it's honest:* Economics.
      *   *Logic:* A low-quality male **won't** (or can't) afford the metabolic debt.
  3.  **Cheap Talk (e.g., Saying "I'm Fit"):**
      *   *Why it fails:* Pooling Equilibrium.
      *   *Logic:* It's costless to fake, so everyone fakes it, and the signal collapses.

  **Bottom Line:**
  I could have made this presentation two slides long.
  But that would be a costless signal.
  And in evolution, costless signals get selected against.

  Consider the time I spent on this my **Zahavian Handicap**.
  If it were easy, you'd have no way of knowing if I was high-quality.

  **Thank you.**
