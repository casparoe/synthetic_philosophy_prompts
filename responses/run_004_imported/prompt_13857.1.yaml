answer: |-
  This is a classic debate in moral philosophy, and your intuition that your friend's conclusion is "too quick" is shared by many philosophers—even those sympathetic to utilitarianism.

  The short answer is: **Your friend is logically consistent with *strict act utilitarianism*, but she is overlooking the nuances in Singer's own later work and the broader landscape of consequentialist thought.**

  Here is a breakdown of why she makes a strong point, why it feels unsatisfying (the "Overdemandingness Objection"), and how you can preserve the category of supererogation without abandoning the core insight of the drowning child argument.

  ### 1. Where Your Friend Is Right (The Logical Collapse)
  Your friend has correctly identified the tension between **Common-Sense Morality** and **Classical Utilitarianism**.

  *   **The Logic:** If morality is strictly about maximizing good outcomes (utility), then there is no logical space for "extra credit." If Action A saves 10 lives and Action B saves 5 lives (and costs you the same amount), a strict utilitarian says you are *obligated* to do A. Choosing B is morally sub-optimal, and therefore, on this view, morally wrong.
  *   **The Consequence:** Under this strict framework, the Saint and the Sinner are the only two categories. The "nice person" who donates 5% of their income when they could donate 50% without starving is technically failing their moral duty.
  *   **Singer's Early View:** In his original 1972 paper *Famine, Affluence, and Morality*, Singer argued for a "Strong Principle": *If it is in our power to prevent something very bad from happening, without thereby sacrificing anything of **comparable moral importance**, we ought, morally, to do it.* "Comparable moral importance" is a very high bar. It implies you should give until you are nearly as poor as those you are helping.

  If you accept the Strong Principle without qualification, your friend is right: supererogation collapses.

  ### 2. Where the Argument Is "Too Quick" (The Pushback)
  Your feeling that this is "too quick" aligns with the **Overdemandingness Objection**. This is the most common critique of strict utilitarianism. It suggests that a moral theory that demands you sacrifice your life's projects, relationships, and personal happiness until you are marginally useful is not a plausible guide for human life.

  Here are four philosophical ways to preserve supererogation (or a functional equivalent) while accepting Singer's core insight:

  #### A. Singer's "Moderate Principle"
  Singer himself recognized the overdemandingness critique. In later writings, he often distinguishes between what is **ideal** and what is **obligatory**. He sometimes advocates for a "Moderate Principle": *...without sacrificing anything **morally significant**.*
  *   **The Distinction:** "Comparable moral importance" (Strong) vs. "Morally significant" (Moderate).
  *   **The Result:** Under the Moderate Principle, you are obligated to give until it causes you *significant* harm (e.g., lowering your standard of living noticeably), but you are *not* obligated to reduce yourself to subsistence level.
  *   **Preserving Supererogation:** Anything you give *beyond* the point of "significant harm" returns to the realm of the supererogatory. It is praiseworthy to live like a monk to save more lives, but it is not *required*.

  #### B. The "Burnout" Argument (Long-Term Consequentialism)
  Effective Altruism (EA) often argues from a long-term perspective. A strict demand to give everything *now* might be counter-productive.
  *   **The Logic:** If you donate 60% of your income and live in stress and resentment, you might quit earning, suffer health issues, or turn others off from altruism. If you donate 10% sustainably over 40 years, you might do more good.
  *   **Preserving Supererogation:** Self-care and personal enjoyment become *instrumentally* obligatory up to a point. However, someone who *does* sacrifice their long-term sustainability for an immediate massive impact (e.g., a doctor working in a war zone despite high risk) is performing a supererogatory act. They are spending their "moral capital" faster than is required.

  #### C. Satisficing Consequentialism
  This is a specific philosophical modification that might appeal to you.
  *   **The Logic:** Instead of *maximizing* the good (doing the absolute best), morality requires us to *satisfice* (do "enough" good).
  *   **The Result:** Once you have crossed the threshold of "doing enough" (e.g., donating a significant portion, volunteering, living ethically), you have fulfilled your duty. Anything beyond that threshold is genuinely supererogatory.
  *   **Why it fits:** It accepts Singer's premise that we have duties to distant strangers, but rejects the idea that we must *maximize* at all costs.

  #### D. Agent-Centered Prerogatives
  Philosopher Samuel Scheffler proposed a hybrid view. He argues that agents are permitted to give their own interests some extra weight, simply because they are *their* interests.
  *   **The Logic:** I am allowed to care slightly more about my own happiness than the happiness of a stranger, without being immoral.
  *   **Preserving Supererogation:** This builds a "protected sphere" of personal life. Stepping outside that protected sphere to help others is obligatory up to a limit; going far beyond it is supererogatory.

  ### 3. How to Respond to Your Friend
  You don't have to reject Singer to reject her conclusion. You can argue that she is conflating **Ideal Morality** with **Obligatory Morality**.

  1.  **Acknowledge her logic:** "You're right that *strict* act utilitarianism collapses supererogation. If the only metric is 'units of good,' then anything less than the max is a failure."
  2.  **Point out Singer's nuance:** "However, Singer himself acknowledges that a principle requiring us to sacrifice until we are marginally useful is too demanding for most people to accept. He distinguishes between what we *should* do ideally and what we can be *blamed* for not doing."
  3.  **Introduce the 'Significant' vs. 'Comparable' distinction:** "If we accept the Moderate Principle (sacrifice until it's morally significant), then giving beyond that point *is* supererogatory. It's good to be a saint, but it's not wrong to be merely very generous."
  4.  **The Pragmatic EA View:** "Many Effective Altruists argue that demanding too much leads to burnout and less good in the long run. Therefore, maintaining a category of 'above and beyond' encourages people to do more without shaming them into doing nothing."

  ### Summary
  Your friend is right that **pure, abstract utilitarianism** leaves no room for supererogation. But **Effective Altruism as a practical movement** (and Singer's later, more nuanced work) often relies on psychological and practical limits that effectively restore the category.

  You can accept the drowning child argument (we have a duty to help) without accepting that we must drown ourselves in the process. The space between "doing your duty" and "maximizing the good at all costs" is exactly where supererogation lives.
