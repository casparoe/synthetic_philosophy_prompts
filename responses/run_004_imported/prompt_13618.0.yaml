      *   **Connect to LW/CFAR:** LessWrong has discussed this (Newcomb's, Parfit's Hitchhiker). Rationality is about winning, not just being logically consistent in a vacuum. If cooperating wins more money (because the other person cooperates), then cooperating is the rational move.
