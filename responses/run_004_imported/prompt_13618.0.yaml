      *   *Kreps, Milgrom, Roberts, Wilson (1982):* The "Gang of Four" paper showed that incomplete information about types (rational vs. altruistic) sustains cooperation.
      *   *Evolutionary Psychology:* We evolved for repeated games and social tribes, not one-shot anonymous theoretical games. Our "rationality" includes social capital.
