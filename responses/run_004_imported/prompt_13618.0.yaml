  2.  **Deconstruct the Centipede Game & Backward Induction:**
      *   *The Theory:* Backward induction relies on *Common Knowledge of Rationality (CKR)*. If Player 2 is rational, they take at the end. If Player 1 knows Player 2 is rational, Player 1 takes at the second-to-last step. And so on.
      *   *The Reality:* Empirical data (McKelvey & Palfrey, 1992) shows people rarely defect immediately. Cooperation persists until near the end.
