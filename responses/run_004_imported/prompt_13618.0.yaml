          *   Reputation/Signaling: In a meetup setting, defecting immediately signals "I'm a game theory nerd who wants to win a trivial game at the expense of social harmony." Cooperating signals "I'm cooperative."

  3.  **Address the "Bias" vs. "Model Error" Distinction:**
