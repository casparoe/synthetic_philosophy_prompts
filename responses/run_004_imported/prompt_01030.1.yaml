answer: |-
  You are not crazy, and you are not missing a workaround. **Your compliance lead is asking for something that is mathematically impossible** (with two very narrow exceptions).

  You have stumbled onto one of the most famous results in algorithmic fairness literature, often referred to as the **"Impossibility Theorem of Fairness."**

  Here is the breakdown of why you are right, the papers you can show your lead, and how to navigate this conversation without sounding like you're just saying "no."

  ### 1. The Math: Why It's Impossible
  The three conditions your lead wants are:
  1.  **Calibration:** $P(Y=1 | \text{Score}=s, \text{Group}=A) = P(Y=1 | \text{Score}=s, \text{Group}=B)$
      *(A score of 700 means the same risk for everyone.)*
  2.  **Equal False Positive Rate (FPR):** $P(\hat{Y}=1 | Y=0, \text{Group}=A) = P(\hat{Y}=1 | Y=0, \text{Group}=B)$
  3.  **Equal False Negative Rate (FNR):** $P(\hat{Y}=0 | Y=1, \text{Group}=A) = P(\hat{Y}=0 | Y=1, \text{Group}=B)$
      *(Conditions 2 and 3 together are called **Equalized Odds**.)*

  **The Theorem:**
  As proven independently by **Chouldechova (2017)** and **Kleinberg et al. (2016)**, you can satisfy Calibration and Equalized Odds simultaneously **if and only if** one of the following is true:
  *   **The model is perfect** (100% accuracy, zero errors).
  *   **The base rates are equal** (The underlying default rate is exactly the same for both racial groups: $P(Y=1|A) = P(Y=1|B)$).

  In real-world lending, models are not perfect, and base rates almost never match exactly across demographic groups due to historical and socioeconomic factors. Therefore, **you must trade off.** You can have Calibration, or you can have Equalized Odds, but you cannot have both.

  ### 2. The Intuition (For your Compliance Lead)
  If your lead isn't convinced by theorems, explain it this way:

  Imagine Group A has a 10% default rate and Group B has a 5% default rate.
  *   **To be Calibrated:** The model must assign higher risk scores to Group A on average, because they are riskier. A score of "High Risk" must truly reflect that higher probability.
  *   **To have Equal Error Rates:** You would need to adjust the decision thresholds so that you make mistakes at the same frequency for both groups.
  *   **The Conflict:** Because Group A has more "bad" loans in the pool, if you calibrate the scores correctly, the distribution of scores will be different. If you then try to force the error rates to match by moving thresholds, you break the calibration (a score of 700 no longer means the same thing for both groups). If you keep the calibration, the error rates will naturally differ because the populations have different risk profiles.

  ### 3. How to Handle the Compliance Lead
  Your lead likely believes this is a regulatory requirement. It is crucial to distinguish between **ML Fairness Metrics** and **Legal Compliance**.

  **Step 1: Show, Don't Tell**
  Send her a brief memo citing the foundational papers. This moves the conversation from "you haven't tried hard enough" to "this is a known mathematical constraint."
  *   *Chouldechova, A. (2017). Fair prediction with disparate impact: A study of bias in recidivism prediction instruments.*
  *   *Kleinberg, J., Mullainathan, S., & Raghavan, M. (2016). Inherent Trade-Offs in the Fair Determination of Risk Scores.*

  **Step 2: Clarify the Regulatory Goal**
  In US lending (ECOA / Regulation B), the legal standard is usually **Disparate Impact** and **Business Necessity**.
  *   Regulators generally prefer **Calibration**. They want to know that if you deny a loan, it's because the risk score accurately predicts a higher probability of default, regardless of race. This justifies "Business Necessity."
  *   Forcing **Equalized Odds** (equal error rates) when base rates differ can actually be *dangerous* legally. It might require you to approve riskier applicants in one group to match the error rate of another, which could be seen as violating safety and soundness principles or even as reverse discrimination.

  **Step 3: Propose a Prioritization**
  Ask her to choose which metric aligns best with the company's risk appetite and legal counsel's advice.
  *   **Option A (Prioritize Calibration):** This is standard for risk models. It ensures the score means the same thing for everyone. *Trade-off:* Error rates will differ.
  *   **Option B (Prioritize Equalized Odds):** This ensures the "burden of error" is shared equally. *Trade-off:* The score loses its universal meaning (a 700 for Group A implies different risk than a 700 for Group B), which makes risk management harder.

  ### 4. Sample Script
  > "I've dug into the literature on this, specifically the impossibility theorems from Kleinberg (2016) and Chouldechova (2017). They prove that unless our model is 100% accurate or the underlying default rates are identical across groups, we mathematically cannot satisfy Calibration and Equalized Odds simultaneously.
  >
  > If we force all three, we would have to manipulate the scores so that they no longer accurately reflect probability of default, which introduces model risk and could violate Business Necessity under ECOA.
  >
  > I recommend we prioritize **Calibration**. This ensures that a risk score represents the same financial risk regardless of race, which is usually the strongest defense for risk-based pricing. We can then monitor the disparity in error rates to ensure they aren't creating an unlawful disparate impact, but we can't guarantee they will be mathematically equal."

  ### Summary
  You are correct. There is no clever feature engineering, post-processing, or re-weighting trick that solves this. It is a structural constraint of probability. Your job now is to help your compliance lead understand that **fairness is a multi-objective optimization problem where you have to choose which constraint to relax,** not a bug you can fix.
