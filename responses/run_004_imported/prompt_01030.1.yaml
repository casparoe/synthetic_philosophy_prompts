      *   *Key Paper:* Chouldechova (2017) "Fair prediction with disparate impact: A study of bias in recidivism prediction instruments" and Kleinberg et al. (2016) "Inherent Trade-Offs in the Fair Determination of Risk Scores."
      *   *The Theorem:* Calibration + Equalized Odds (FPR + FNR equality) $\rightarrow$ Requires equal base rates ($P(Y=1|A=0) = P(Y=1|A=1)$).
      *   *Reasoning:*
          *   Calibration implies that the positive predictive value (PPV) and negative predictive value (NPV) are linked to the score.
          *   Equalized Odds implies that the error rates conditional on the *true* outcome are equal.
          *   If base rates differ, satisfying calibration means the distribution of scores must differ between groups. If the distribution of scores differs, applying the same threshold (or even group-specific thresholds to match FPR/FNR) breaks calibration or the error rate balance.
          *   Specifically, if $P(Y=1|A=0) \neq P(Y=1|A=1)$, you cannot satisfy Calibration and Equalized Odds simultaneously.
