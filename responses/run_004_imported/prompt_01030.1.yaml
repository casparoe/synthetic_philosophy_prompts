          3.  **Equal False Negative Rate (FNR):** Risky applicants wrongly approved at equal rates across groups ($P(\hat{Y}=0|Y=1, A=a)$ is constant).
          *   *Note:* FPR and FNR equality together are often referred to as "Equalized Odds."
