  okay this has been driving me crazy at work all week. i just got pulled onto the fairness review for our loan approval model, and my compliance lead wants me to guarentee three things at the same time: that a given risk score means the same default probability no matter the applicant's race, that the false positive rate (good applicants wrongly denied) is equal across race groups, and that the false negative rate (risky applicants wrongly approved) is equal too. every time i tell her you can't actually hit all three unless the groups happen to default at the same underlying rate to begin with, she acts like i just haven't found the right fix yet. am i missing some clever workaround here, or is she asking for something that's genuinely impossible?
