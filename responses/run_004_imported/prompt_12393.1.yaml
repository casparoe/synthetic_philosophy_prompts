prompt: |-
  Been on a bit of a rabbit-hole binge lately re-reading old LessWrong posts, and I keep bumping into a tension nobody seems to resolve super cleanly. Aumann's agreement theorem gets cited constantly as the reason two rational people "can't agree to disagree," and people use it almost like a knock-down argument for epistemic modesty - defer more to the consensus, don't be so confident in your inside view, etc. But then theres Eliezer's whole "Inadequate Equilibria" thing where he goes after "modest epistemology" pretty hard, arguing that treating "smart/informed people disagree with me, so I should update a ton toward their position" as a general policy is often wrong, and sometimes just status-signalling dressed up as humility. This actually came up a couple weeks ago when a friend and I were arguing about whether I should just defer to superforecaster consensus on AI timelines instead of trusting my own inside-view model, and I realized I don't actually know how much weight Aumann's theorem is even supposed to put behind that kind of deference.

  So could you compare the actual content of Aumann's theorem (the math, and specifically the conditions it needs to go through - common priors, common knowledge of posteriors, honest full updating, that sort of thing) against this looser "modest epistemology" heuristic of deferring to expert/majority opinion whenever you disagree with it? I want to know exactly where the theorem stops supporting the heuristic and where people are basically borrowing its authority without earning it - like, is this mostly a case of an idealized math result getting used as a vibes-based rule of thumb, or is there a more legitimate bridge between them? If it's relevant, I'd also be curious whether Hanson's old paper on honest disagreement (I think it's literally called "Are Disagreements Honest?", might be misremembering) is doing that bridging work, or if it's really a separate argument entirely. Feel free to get technical - I can follow common-prior/Bayesian-updating stuff fine.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Context:** The user has been reading LessWrong (LW), specifically noticing a tension between Aumann's Agreement Theorem (AAT) as used for "epistemic modesty" (defer to consensus) and Eliezer Yudkowsky's "Inadequate Equilibria" (IE) critique of modesty (trust inside view, beware status signaling).
      *   **Specific Scenario:** A disagreement with a friend about AI timelines (superforecaster consensus vs. inside-view model).
      *   **Core Question:** Compare the *actual mathematical conditions* of AAT against the *heuristic* of epistemic modesty. Where does the theorem stop supporting the heuristic? Is it just "vibes" borrowing authority, or is there a legitimate bridge?
      *   **Specific Reference:** Robin Hanson's "Are Disagreements Honest?" – does it bridge the gap?
      *   **Tone/Level:** Technical is fine (common priors, Bayesian updating), analytical, nuanced.

  2.  **Analyze Aumann's Agreement Theorem (AAT):**
      *   *What it says:* Two Bayesians with common priors cannot have common knowledge of differing posteriors.
      *   *Key Conditions:*
          1.  Common Priors (CPA).
          2.  Common Knowledge of Posteriors (they know what the other believes, they know the other knows, etc.).
          3.  Honest Bayesian Updating (no lying, no cognitive bias, infinite compute).
          4.  Same Interpretation of Evidence (implicitly part of the Bayesian machinery).
      *   *Implication:* If you know someone disagrees with you, and you satisfy the conditions, you *must* update until you agree. You can't just say "I know they think X, but I think Y" and stay there.

  3.  **Analyze "Epistemic Modesty" (The Heuristic):**
      *   *The Rule:* "Smart people disagree with me $\rightarrow$ I should significantly update toward their view."
      *   *The Vibe:* Humility, avoiding arrogance, respecting consensus.
      *   *The Weakness:* Can lead to "modesty spirals," ignoring inside information, status signaling (pretending to be humble to look good), and averaging away truth in cases where the consensus is stuck in an inadequate equilibrium.

  4.  **Analyze "Inadequate Equilibria" (Eliezer's Critique):**
      *   *Core Argument:* Systems (including epistemic communities) can get stuck in suboptimal states.
      *   *When to defy consensus:* When you have specific inside information the consensus doesn't have, when the consensus incentives are misaligned (status vs. truth), or when the consensus mechanism is broken.
      *   *Relation to AAT:* Eliezer argues the *conditions* of AAT are rarely met in the real world. Therefore, the *conclusion* of AAT (instant agreement) doesn't apply.

  5.  **Address the "Bridge" (Where does AAT support Modesty?):**
      *   AAT supports a *process* of updating, not necessarily *deference*.
      *   If I know you are rational and honest, and I know your posterior, I must treat your posterior as *evidence*.
      *   *The Gap:* In the real world, I don't know your posterior perfectly (communication is lossy), I don't know if your priors are common, and I suspect you aren't perfectly rational.
      *   *Hanson's Contribution:* Hanson tries to salvage AAT for real humans. He argues we should *act as if* the conditions hold to avoid bias. He suggests the "outside view" is a way to approximate common priors.

  6.  **Synthesize the Comparison (The "Meat" of the answer):**
      *   *Condition 1: Common Priors.* Real people have different life experiences. AAT says this shouldn't matter if we share all info, but in practice, deep priors differ. Modesty assumes priors are similar enough; IE says priors might be structurally different (e.g., optimism vs. pessimism).
      *   *Condition 2: Common Knowledge of Posteriors.* Do I *really* know what the superforecasters believe? Or just a summary statistic? Do they know my model? AAT requires full transparency. Modesty often works on summaries.
      *   *Condition 3: Rationality/Honesty.* AAT assumes perfect Bayesians. Modesty assumes "experts are better than me." IE says "experts are incentivized to conform."
      *   *The "Agree to Disagree" Loophole:* AAT says you can't *know* you disagree. Real world: We know we disagree because we know the other person hasn't seen our private info (or hasn't processed it right). This breaks the "Common Knowledge" condition.

  7.  **Address Hanson's "Are Disagreements Honest?":**
      *   Yes, this is the bridging paper.
      *   Hanson argues that persistent disagreement implies *at least one party* is being irrational (violating AAT conditions).
      *   His normative claim: Since we can't easily identify *who* is irrational, we should split the difference (modesty).
      *   Critique (Eliezer style): This assumes the error is symmetric. It might not be. If I have a unique insight and the crowd is stuck, splitting the difference kills the insight.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the tension. It's a classic LW debate.
      *   *Section 1: The Math of AAT.* Briefly state the theorem and the 3-4 hard constraints. Emphasize "Common Knowledge."
      *   *Section 2: The Heuristic of Modesty.* Define it. Explain why people cite AAT (the "you must update" part).
      *   *Section 3: Where the Bridge Collapses.* This is the core.
          *   Common Priors (vs. Private Info).
          *   Common Knowledge (vs. "I know they haven't seen my data").
          *   Rationality (vs. Incentives/Status).
      *   *Section 4: Hanson's Role.* Explain how Hanson tries to make AAT normative for humans. Explain the "bias asymmetry" problem.
      *   *Section 5: Eliezer/IE Counter.* Why modesty fails in inadequate equilibria. The "inside view" defense.
      *   *Section 6: The AI Timeline Example.* Apply the theory to the user's specific case. Superforecasters vs. Inside View.
      *   *Conclusion:* AAT is a limit case, not a policy manual. Modesty is a heuristic that works *unless* you have reason to believe the equilibrium is inadequate.

  9.  **Refining the Tone:**
      *   Ensure it doesn't sound like I'm taking sides too hard, but accurately represent the LW intellectual history.
      *   Use precise terminology (Common Priors, Common Knowledge, Posterior, Inside/Outside View).
      *   Make sure to answer the specific question: "Is this vibes-based or legitimate?" (Answer: It's a legitimate *limit* theorem used as a *vibes-based* heuristic, with Hanson trying to formalize the bridge, but the bridge has structural cracks).

  10. **Self-Correction/Check during drafting:**
      *   *Did I explain Common Knowledge correctly?* It's not just "I know your belief." It's "I know you know my belief, and you know I know you know..." It's crucial because it prevents "I think they haven't updated on my info."
      *   *Did I distinguish Hanson from Aumann?* Aumann is descriptive/math. Hanson is normative/psychological.
      *   *Did I address the AI timeline bit?* Need to make sure the advice is practical. Superforecasters aggregate public info well; inside views capture structural/technical nuance they might miss.

  11. **Final Polish:** Check for clarity and flow. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is one of the sharpest tensions in the rationalist epistemology canon, and you have correctly identified that the "bridge" between Aumann's Agreement Theorem (AAT) and real-world epistemic modesty is structurally unsound in many places.

  The short answer is: **Aumann's theorem is a limit case result about idealized agents, while epistemic modesty is a heuristic for biased humans.** People cite AAT to give the heuristic mathematical authority it doesn't actually possess in non-ideal conditions. Robin Hanson's work attempts to build the bridge you're looking for, but Eliezer's *Inadequate Equilibria* (IE) correctly identifies where that bridge collapses.

  Here is the technical breakdown of where the theorem stops supporting the heuristic, the role Hanson plays, and how to apply this to your AI timeline disagreement.

  ---

  ### 1. The Math: What Aumann Actually Requires
  Aumann's Agreement Theorem (1976) states that two Bayesians with **common priors** cannot have **common knowledge** of differing **posteriors**.

  For the theorem to force agreement (and thus mandate the "modesty" update), four strict conditions must be met:

  1.  **Common Priors:** Both agents must start with the exact same prior probability distribution over the state space of the universe. Differences in belief can *only* arise from differences in private information.
  2.  **Common Knowledge of Posteriors:** It is not enough for me to know your belief. I must know your belief, and you must know my belief, and I must know that you know my belief, *ad infinitum*.
  3.  **Honest Bayesian Updating:** Both agents must update perfectly on all available information. No cognitive biases, no computational limits, no lying.
  4.  **Same Partition of Information:** Both agents must agree on what constitutes "evidence" and how it maps to states of the world.

  **The Implication:** If these conditions hold, and I learn that you believe $P(H) = 0.8$ while I believe $P(H) = 0.2$, logic dictates that one of us has made a mathematical error. We cannot "agree to disagree." We must trade information until our posteriors converge.

  ### 2. The Heuristic: Epistemic Modesty
  The "modest epistemology" heuristic generally says: *"If a reference class of smart, informed people disagrees with you, you should update significantly toward their mean, because you are likely biased."*

  **Where people borrow Aumann's authority:**
  Proponents of modesty argue that since we *should* aspire to be rational Bayesians, we should act *as if* the Aumann conditions hold. If I treat you as a fellow rationalist with roughly similar priors, your disagreement is evidence I haven't processed correctly. Therefore, I must update.

  **Where the bridge collapses:**
  In the real world, **Condition 2 (Common Knowledge)** is almost never met.
  When you disagree with a superforecaster about AI timelines, you do not have common knowledge of posteriors. You have a summary statistic of their belief, and they have no knowledge of your specific inside-view model.
  *   **Aumann says:** "If you *knew* they had seen your evidence and *still* disagreed, you would have to agree."
  *   **Reality:** You know they *haven't* seen your evidence (or haven't processed it the same way). Therefore, Aumann's constraint does not trigger. You are allowed to disagree because the "Common Knowledge" condition is broken.

  ### 3. Robin Hanson's Bridge: "Are Disagreements Honest?"
  You remembered the paper title correctly. Robin Hanson's *Are Disagreements Honest?* (2007) is the explicit attempt to turn Aumann from a math theorem into a normative rule for humans.

  **Hanson's Argument:**
  Hanson acknowledges humans aren't perfect Bayesians. However, he argues that persistent disagreement implies that **at least one party is being irrational.** Since we are all biased, we cannot reliably identify *who* is the irrational one in any specific instance.
  *   If I think you're wrong, I think you're being irrational.
  *   If you think I'm wrong, you think I'm being irrational.
  *   By symmetry, I should admit I might be the irrational one.
  *   **Conclusion:** To minimize error, we should "split the difference" (average our opinions) whenever we disagree.

  **The Critique (The "Modesty" Trap):**
  Hanson's bridge relies on an assumption of **symmetric error**. It assumes that the probability of *me* being the biased one is roughly equal to the probability of *you* being the biased one.
  *   **Eliezer's Counter (Inadequate Equilibria):** Error is not always symmetric. If the consensus is stuck in an inadequate equilibrium (due to bad incentives, status signaling, or lack of specific data), the "average" opinion is systematically biased.
  *   If I have a unique piece of inside information (e.g., a specific technical bottleneck in transformer architecture) that the consensus does not have, Hanson's rule tells me to dilute my insight with the ignorance of the crowd. Aumann doesn't apply here because the "Common Priors/Information" condition is violated by the existence of private, non-transmitted data.

  ### 4. Where AAT Supports Modesty vs. Where It Doesn't

  | Feature | Aumann's Theorem (Math) | Modest Epistemology (Heuristic) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Priors** | Must be identical. | Assumes priors are "similar enough." | **Weak Link.** Deep priors (e.g., optimism vs. pessimism about tech) often differ fundamentally. |
  | **Information** | All private info is effectively shared via posteriors. | Assumes experts have *more* info than you. | **Strong Link.** If they truly have more info, you should update. |
  | **Knowledge** | **Common Knowledge** (infinite recursion). | I know their opinion; they don't know mine. | **Broken Link.** This is the biggest failure point. You can disagree because you know they lack your context. |
  | **Rationality** | Perfect Bayesian updating. | Experts are "more rational" than laypeople. | **Mixed.** Experts avoid basic biases but suffer from institutional incentives. |
  | **Action** | **Forced Agreement.** | **Weighted Averaging.** | **Divergent.** AAT says converge to truth; Modesty says converge to each other. |

  ### 5. Application: AI Timelines & Superforecasters
  In your specific argument with your friend:

  **The Case for Modesty (Aumann/Hanson style):**
  Superforecasters have a track record of calibration. They aggregate a massive amount of public information. If your prior is "I am a random person on the internet," Aumann-style reasoning suggests your posterior should be heavily weighted toward the aggregate posterior of agents with better track records and more data. To ignore this is to claim you have a "common prior" with them but superior processing, which is statistically unlikely.

  **The Case for Inside View (Eliezer/IE style):**
  AAT only forces agreement if the superforecasters know *your* evidence.
  *   **Scenario A:** Your model is based on public info (e.g., "Moore's Law has slowed"). The superforecasters already know this. If you still disagree, Aumann suggests *you* are likely wrong. **Deference is warranted.**
  *   **Scenario B:** Your model is based on private/technical insight (e.g., "I work on attention heads and know a specific bottleneck that public papers haven't quantified yet"). The superforecasters *do not* have this information. Therefore, the "Common Knowledge" condition is false. **Deference is not warranted.**

  **The "Inadequate Equilibrium" Check:**
  Are the superforecasters incentivized to give the "true" probability, or the "safe" probability? Forecasting tournaments often reward calibration over time, which can lead to conservatism. If the true distribution of timelines is bimodal (very soon or never) and the consensus is unimodal (gradual progress), averaging toward the consensus guarantees you miss the truth.

  ### 6. Summary: Is it Vibes or Math?
  It is **math used as vibes.**

  1.  **Aumann is a "No-Go" Theorem:** It tells you what is *impossible* for ideal agents. It does not tell you what *probable* humans should do.
  2.  **Hanson provides the Normative Bridge:** He argues we should *pretend* to be ideal agents to counteract our bias toward thinking *we* are the rational one. This is a useful debiasing tool, but not a law of physics.
  3.  **Eliezer identifies the Boundary Conditions:** The Hanson bridge works in "adequate" markets of ideas where information flows freely and incentives align. It breaks in "inadequate" equilibria where information is siloed or incentives punish deviation.

  **Practical Advice for your Argument:**
  Don't ask "Does Aumann's theorem say I should defer?" (The answer is technically no, because conditions aren't met).
  Ask: **"Have the superforecasters seen and processed the specific evidence my inside-view model is based on?"**
  *   If **Yes**: Aumann/Hanson wins. You are likely biased. Update toward consensus.
  *   If **No**: Aumann does not apply. You are holding private evidence. You should not defer, but you should also check if your private evidence is actually signal or just noise you're overfitting to.

  The tension isn't resolved because the two sides are optimizing for different error types. Modesty optimizes against **arrogance** (thinking you're smarter than the crowd). *Inadequate Equilibria* optimizes against **conformity** (thinking the crowd is smarter than the truth). You need to diagnose which risk is higher in your specific context.
