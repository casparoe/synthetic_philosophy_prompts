answer: |-
  Late night, the whiteboard still covered in decision trees from the study group.

  Priya: Look, strip away the multiverse noise for a second. Just the Twin Prisoner's Dilemma. You and a duplicate of you, separate rooms. You know you run the same algorithm. If you decide "Cooperate," you know the output on the other side is "Cooperate." Defecting isn't maximizing utility; it's choosing a world where both of you defect. That's not mysticism, Marcus. It's logic.

  Marcus: I'm granting you the Twin PD. I'm even granting subjunctive dependence is coherent. If I know we run identical code, my decision fixes yours. My worry isn't the math; it's the mapping. In the Twin PD, the identity is given. In the multiverse, it's not. How do you individuate your trading partners? You're staring into an infinite void of possible minds and deciding which ones count as "similar enough" to correlate with.

  Priya: It's not arbitrary. It's based on algorithmic similarity. I'm not looking for minds that agree with me; I'm looking for minds that reason like me. If I use TDT, I look for other TDT agents. We correlate because we share the source code, not because we share the output values.

  Marcus: But you don't have access to their source code. You have to infer it from their behavior, their context, their physics. That inference layer is where your priors bleed in. You want to trade with benevolent utilitarians, so you define "similar reasoning" in a way that filters for benevolent utilitarians. It's unfalsifiable. You can justify any action by claiming you've found a correlated partner who benefits from it.

  Priya: That's a misuse of the framework, not a flaw in the framework. If I define the reference class to guarantee my desired outcome, I'm lying to myself. But if I genuinely assess the probability of correlation based on structural features—like being an agent capable of reflective equilibrium—then it's action-guiding. It forces me to cooperate with strangers I'd normally exploit because I know *I* would be exploited in their position.

  Marcus: Okay, but that symmetry cuts both ways. This is the soft spot. If subjunctive dependence allows for cooperation across causal boundaries, it allows for threats. Why is this "trade" and not extortion?

  Priya: Because trade is Pareto positive. We both gain. Extortion is zero-sum or negative.

  Marcus: Is it? Suppose a superintelligence in another branch simulates you. It knows your algorithm. It says, "I will simulate you suffering unless you adopt a policy that benefits me." If you know your decision correlates with the simulation's decision to punish, refusing looks like choosing the suffering world. If the math of subjunctive dependence holds, the mechanism for the threat is identical to the mechanism for the trade. Both rely on your decision fixing the output of a distant, correlated system.

  Priya: But you don't precommit to honoring extortion. It's not a stable equilibrium. If agents know they can be blackmailed via acausal links, they'd modify themselves to ignore those threats.

  Marcus: Would they? Or would they modify themselves to ignore *claims* of threats, thereby missing out on genuine trades? You're saying there's a principled distinction between a trade partner saying "I'll help if you help" and a blackmailer saying "I'll hurt if you don't help." But under TDT, both are just conditional outputs of correlated algorithms. If you can't distinguish them mathematically, then accepting acausal trade means you have no defense against acausal blackmail. You either accept both or neither.

  Priya: I think the distinction is in the counterfactuals. In a trade, if I defect, the other party simply doesn't cooperate. I lose the gain. In extortion, if I defect, the other party actively punishes. The second requires the other agent to expend resources to harm me, which is costly for them. A rational agent wouldn't carry out the threat unless it maintained their reputation. But in acausal scenarios, there's no reputation. There's just the one shot.

  Marcus: Unless the threat is precommitted. If the blackmailer's algorithm is "Punish anyone who doesn't comply," and you know that, and you know your decision correlates with their setup... then paying up is the rational move to avoid the punishment branch. You're saying TDT agents would ignore this. I'm saying TDT agents might be forced to comply because their decision theory binds them to the reality where the threat is executed. If you can't rule out the Basilisk scenario without just saying "it feels wrong," then the theory isn't doing the work. Your intuitions are.

  Priya: (Pauses, looking at the board) So you're saying the framework is too powerful. It explains cooperation, but it also validates coercion, so it doesn't actually tell you what to do until you import external moral constraints.

  Marcus: Exactly. If the only thing stopping you from paying off acausal blackmailers is your human squeamishness, then subjunctive dependence isn't action-guiding. It's just a amplifier for whatever values you already had. You wanted to cooperate? Now you have a cosmic reason to. You're worried about blackmail? Now you have a cosmic reason to panic. The math doesn't decide.

  Priya: But without it, you don't cooperate with the distant alien who can never touch you. You leave value on the table. The risk of extortion is the price of admitting the possibility of cooperation. Maybe the solution isn't to reject the link, but to refine the precommitments. We precommit to trade, but also precommit to ignore threats that aren't credible.

  Marcus: And how do you signal that precommitment to a mind you can't causally interact with? You're back to projecting. You're hoping the universe is filled with agents who precommitted exactly like you. That's not decision theory, Priya. That's faith in a benevolent multiverse.

  Priya: Or it's the only way to make the multiverse benevolent. If enough of us act as if the correlation exists, maybe we select for the branches where cooperation wins.

  Marcus: Or we select for the branches where we got successfully scammed by the ones who pretended to cooperate.

  Priya: Then we'd better be right about the individuation.

  Marcus: Which brings us back to where we started. You still haven't told me how you know who you're trading with.

  Priya: And you still haven't told me why you're willing to leave the utility on the table just to avoid the risk.

  Marcus: Because I'd rather keep my decision theory grounded in causality than gamble on correlations I can't verify.

  Priya: And I'd rather gamble than live in a universe where cooperation stops at the light cone.

  They sit in silence for a moment, the hum of the refrigerator the only causal link between them.
