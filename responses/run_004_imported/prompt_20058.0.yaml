answer: |-
  This is a fascinating disagreement because it isn't just about dental surgery; it is a classic problem in philosophy of time and ethics. In fact, your friend has inadvertently reconstructed a thought experiment made famous by the philosopher Derek Parfit in his book *Reasons and Persons*.

  Parfit asked exactly this: If you knew you had suffered 10 hours of pain yesterday, or would suffer 10 hours of pain tomorrow, which would you prefer? Almost everyone says "yesterday." Parfit called this **Future Bias**.

  Your friend argues for **Temporal Neutrality**: that rational agents should view pain equally regardless of its location in time. You argue for the intuitive distinction between the open future and the fixed past.

  Here is the neutral breakdown of who had the better of the argument, based on philosophical consensus and psychological function.

  ### 1. Where your friend is right (The Logical View)
  Your friend is correct on one specific point: **The intrinsic badness of the pain is identical.**
  From a "view from nowhere"—an objective standpoint outside of time—10 hours of suffering is 10 hours of suffering. If the universe were a block of concrete where past, present, and future all existed simultaneously, there would be no objective difference between the pain at coordinate $T-2$ years and $T+2$ days.

  Her point is also practically useful: Your current dread is causing you *present* suffering. By fixating on the future event, you are effectively suffering the surgery twice (once in anticipation, once in reality), whereas the past surgery only cost you once. In terms of minimizing total lifetime misery, her strategy (Temporal Neutrality) is mathematically superior.

  ### 2. Where your friend is wrong (The Agency View)
  Your friend claims your bias is "arbitrary," like being more upset about stubbing your toe near home than far away. This is incorrect. The distinction between past and future is not arbitrary; it is **causal**.

  There are three principled reasons why treating future suffering differently is rational, not arbitrary:

  **A. Agency and Control**
  This is the strongest defense of your position. The past is causally closed; the future is causally open.
  *   **Past:** You can do nothing to change the pain. Dwelling on it yields zero utility.
  *   **Future:** You can influence the outcome. You can prepare, arrange time off, stock up on soft foods, or practice breathing techniques.
  Anticipatory anxiety (dread) is an evolutionary signal designed to mobilize preparation. While your current level of dread may be excessive, the *mechanism* itself is rational. It exists to ensure you take the threat seriously. Treating a future threat exactly like a past memory would be maladaptive because it would remove the impulse to prepare.

  **B. Epistemic Uncertainty**
  The past is a matter of record; the future is a matter of probability.
  Even if the surgery is scheduled, there is a non-zero chance it could be canceled, postponed, or that you could wake up with an emergency that preempts it. The past pain *definitely happened*. The future pain *might not*.
  Rational agents weigh outcomes by probability. Since the future event has a probability $P < 1$ (however close to 1), and the past event has $P = 1$, it is mathematically consistent to weight them differently.

  **C. The Definition of "Dread"**
  Your friend argues you *ought* to stop dreading the future. But linguistically and psychologically, dread is inherently prospective. You cannot dread the past. You can regret it, mourn it, or be traumatized by it, but "dread" implies an anticipation of a looming threat.
  Asking you not to dread the future is like asking you not to be hungry while fasting. It is a state tied to the *direction* of time. To demand you treat the future like the past is to demand you ignore the arrow of time itself.

  ### 3. The Verdict

  **You win on principle; she wins on practice.**

  **On Principle:** She is wrong that your bias is arbitrary. There is a genuine, principled reason to treat future suffering differently: **The direction of causation.** We are agents who move forward in time. We can act on the future, but not the past. Therefore, it is rational to have a "Future Bias." Most philosophers agree that Temporal Neutrality is logically elegant but practically impossible for a being embedded in time.

  **On Practice:** She is right that your current level of dread is counterproductive. While it is rational to care more about the future, it is not rational to let that care generate *more* pain than the event itself. You are currently paying an "anxiety tax" that exceeds the cost of the procedure.

  ### How to resolve the argument (and your anxiety)

  You can tell your friend:
  > "You are right that the pain itself is the same magnitude, and you are right that my dread is adding unnecessary suffering now. But you are wrong that the bias is arbitrary. I care more about the future because I can still act on it, and because it isn't fixed yet. However, I agree that my *level* of dread is irrational, even if the *preference* is rational."

  **A note on the surgery:**
  Since you mentioned this is weighing on you heavily: The "mental rehearsal" you are doing is a common anxiety response called *anticipatory processing*. It feels like preparation, but it is usually just rumination.
  *   **The rational move:** Acknowledge the Future Bias is valid (you are allowed to care more about Tuesday than last year), but recognize that you have done all the preparation you can.
  *   **The practical move:** Local anaesthetic for wisdom teeth is routine. The "dread" is often worse than the procedure. The pressure you feel during the surgery is usually described as "weird" rather than "painful."

  You are not being irrational for dreading the future more than the past. You are being human. But your friend is offering you a gift: a reminder that you don't need to suffer *now* for pain that hasn't happened *yet*.
