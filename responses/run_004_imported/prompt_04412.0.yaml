  Here is an assessment of the six moves, followed by the missing philosophical context and a final verdict.

  **Move 1 (Nadia):** **Nadia.** She establishes a strong *prima facie* normative claim. Her intuition aligns with the common moral sense that authority matters, not just accuracy. While she hasn't defended it yet, the claim that extreme hypocrisy forfeits one's platform is a robust starting position.

  **Move 2 (Owen):** **Owen.** He correctly identifies the logical structure. Strictly speaking, *tu quoque* is a fallacy regarding the *truth* of a proposition. If citation gatekeeping is harmful, it remains harmful regardless of the speaker's behavior. Owen wins on formal logic.

  **Move 3 (Nadia):** **Nadia.** This is the pivotal philosophical move. She successfully distinguishes between the *validity* of the norm (which Owen protects) and the *standing* to enforce it (which she attacks). This neutralizes the *tu quoque* charge by shifting the debate from truth-conditions to normative authority.

  **Move 4 (Owen):** **Owen.** He offers a strong *reductio ad absurdum*. If standing required perfection, moral discourse would collapse. This is a necessary pragmatic check on Nadia's principle, highlighting the risk of weaponizing hypocrisy to silence valid criticism.

  **Move 5 (Nadia):** **Nadia.** She successfully patches the hole Owen opened. By introducing comparability and severity (the "worst offender" intuition pump), she demonstrates that standing is likely scalar or context-dependent, not binary. This preserves her theory without accepting Owen's paralyzing conclusion.

  **Move 6 (Owen):** **Owen.** He lands a sharp meta-ethical critique. He challenges whether "standing" is a distinct concept or merely a heuristic for proportionality. While contestable, this exposes a vagueness in Nadia's refined theory: if we must weigh degrees of hypocrisy, the "standing" label may be redundant.

  **Missing Context:**
  Both students are stumbling through the literature on the **Standing to Blame**. Nadia is arguing for a **non-reductionist** view (e.g., Macalester Bell, Christopher Fritz), where standing is a distinct normative status forfeited by hypocrisy, independent of the blame's proportionality. Owen is arguing for a **reductionist** or pragmatic view, where "standing" is just a proxy for whether the blame is useful or fair. Both miss that the literature distinguishes between *commitment* (believing the norm) and *authority* (having the right to enforce it). Nadia conflates them slightly in Move 1, while Owen dismisses the authority component entirely in Move 2. The debate hinges on whether standing is a **deontic constraint** (Nadia) or a **consequentialist calculation** (Owen).

  Verdict: Draw
