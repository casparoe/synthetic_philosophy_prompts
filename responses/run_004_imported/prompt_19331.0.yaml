prompt: |-
  I sit on the board of a mid-sized research foundation and recently finished my first stint as an ordinary panelist on one of our grant-review panels. The board is about to vote on our executive director's proposal to triple every panel, from four reviewers to twelve, on the theory that more independent judgment converges on better funding decisions, especially on our closest calls. However, what I saw during calibration calls made me skeptical: reviewers are drawn from a small, overlapping set of subfields, scores drift toward whoever speaks first or most confidently, and on the genuinely contested proposals -- the ones this reform is meant to help with -- I doubt any single reviewer is even reliably right more than half the time. Please draft the memo I'll circulate to the board before the vote: take a clear position on the proposal, engage seriously with the "more independent judgment" reasoning rather than dismissing it outright, and say concretely what, if anything, would actually fix the problem it's meant to solve.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Sender:** Board member of a mid-sized research foundation.
      *   **Recipient:** The Board (colleagues).
      *   **Context:** The sender just served as a panelist. The Executive Director (ED) proposes tripling panel size (4 to 12 reviewers) to improve decision quality via "independent judgment convergence," especially for close calls.
      *   **Sender's Observation:** Calibration calls showed reviewers come from overlapping subfields (lack of independence), scores drift based on vocal/confident reviewers (groupthink/anchoring), and individual accuracy on contested proposals is low (<50%).
      *   **Task:** Draft a memo to circulate before the vote.
      *   **Requirements:**
          *   Take a clear position (implied: oppose the current proposal).
          *   Engage seriously with the "more independent judgment" reasoning (don't just dismiss it).
          *   Propose concrete alternatives that actually fix the underlying problems.
          *   Tone: Professional, constructive, evidence-based, respectful but firm.

  2.  **Determine the Position:**
      *   The prompt implies skepticism based on specific observations (lack of independence, group dynamics, low individual accuracy).
      *   *Position:* Oppose the tripling of panel size *as currently proposed*, because it addresses a theoretical problem (noise reduction via aggregation) while ignoring the practical realities (correlated errors, social influence) that render the solution ineffective or even counterproductive.
      *   *Nuance:* Acknowledge the ED's good intent (improving accuracy) but argue the mechanism is flawed.

  3.  **Deconstruct the ED's Argument ("More Independent Judgment"):**
      *   *Theory:* Wisdom of Crowds / Condorcet's Jury Theorem. If individuals are independent and >50% accurate, adding more people improves the majority verdict.
      *   *Counter-argument (based on sender's observations):*
          *   Condition 1 (Independence): Violated. Reviewers are from overlapping subfields (correlated biases).
          *   Condition 2 (Accuracy): Violated. On close calls, accuracy is likely <50% (random or worse).
          *   Condition 3 (Aggregation): Violated. Calibration calls allow social influence (anchoring, confidence bias) to corrupt individual scores before aggregation.

  4.  **Develop Concrete Alternatives:**
      *   If the problem is *correlated error* (overlap), we need diverse panels.
      *   If the problem is *social influence* (drift), we need structured deliberation or independent scoring.
      *   If the problem is *low accuracy on close calls*, we need better criteria or different selection mechanisms (e.g., lotteries among top tier).
      *   *Cost consideration:* Tripling panel size triples cost/time. Is it worth it? Probably not if it doesn't work.
      *   *Proposed Solutions:*
          1.  Maintain smaller panels but ensure diversity (reduce correlation).
          2.  Reform the calibration process (blind scoring first, structured discussion).
          3.  Acknowledge uncertainty (funding lotteries for the "middle tier").
          4.  Invest in reviewer training/calibration *before* the panel.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the ED's proposal and intent. State the purpose of the memo (share panelist experience + analysis). State the recommendation clearly (vote no on *this* specific plan, yes to reform).
      *   **Engaging the Theory:** Validate the "Wisdom of Crowds" logic. It's sound math *if* assumptions hold.
      *   **The Reality Check (The "Why Not"):** Detail the observations from the recent panel.
          *   *Independence:* Overlapping subfields = correlated errors.
          *   *Social Dynamics:* Anchoring on vocal reviewers.
          *   *Accuracy:* The "close call" problem (signal-to-noise ratio is low).
      *   **The Cost/Benefit:** Tripling size triples cost/logistics without guaranteeing better outcomes. Diminishing returns.
      *   **Alternative Proposals:** What *should* we do?
          *   Pre-panel independent scoring (no discussion until scores are in).
          *   Diversify pools (reduce overlap).
          *   Tiered funding/lottery for the middle zone (acknowledges randomness).
          *   Pilot study (test the change before full rollout).
      *   **Closing:** Reiterate commitment to the mission. Call for a pause on the vote to discuss alternatives.

  6.  **Refining Tone:**
      *   Avoid attacking the ED personally. Focus on the *proposal*.
      *   Use terms like "Condorcet's Jury Theorem" or "Wisdom of Crowds" to show intellectual engagement.
      *   Be humble ("In my experience..." rather than "You are wrong").
      *   Ensure the "Clear Position" is unmistakable.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I dismiss the "independent judgment" reasoning? *Correction:* No, I need to explain *why* the conditions for it aren't met.
      *   *Check:* Is the position clear? *Correction:* Make sure the recommendation isn't buried. Put it early and late.
      *   *Check:* Are the alternatives concrete? *Correction:* Instead of just "improve process," suggest "blind scoring prior to discussion."
      *   *Check:* Is the length appropriate? *Correction:* Keep it concise enough for busy board members (2-3 pages max equivalent).

  8.  **Final Polish:** Check for clarity, flow, and persuasive impact. (The resulting memo follows this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposal to Expand Review Panel Size

  **Executive Summary**

  I am writing to recommend that the Board **vote against** the Executive Director's current proposal to triple grant-review panel sizes from four to twelve members. While I fully endorse the proposal's underlying goal—improving the accuracy and fairness of our funding decisions, particularly on "close call" applications—the specific mechanism proposed relies on theoretical assumptions that do not hold in our operational reality.

  Having recently served as a panelist, I observed structural dynamics that suggest simply adding more reviewers will increase costs and administrative burden without yielding better decisions. In some cases, it may degrade decision quality. I propose we pause this vote to consider alternative reforms that address the root causes of review noise: correlated bias, social anchoring, and the inherent uncertainty of evaluating frontier research.

  **The Theory: Why "More Judges" Makes Sense on Paper**

  The ED's proposal rests on a sound statistical intuition, often referred to as the "Wisdom of Crowds" or Condorcet's Jury Theorem. The logic is that if individual reviewers are more likely to be right than wrong (>50% accuracy) and their judgments are independent, aggregating more judgments will converge on the correct decision.

  For "close call" grants, where the signal-to-noise ratio is low, the theory suggests that a larger sample of opinions will cancel out individual idiosyncrasies. I want to be clear: I do not dispute the mathematics. I dispute the applicability of the *conditions* required for the math to work.

  **The Reality: Why the Conditions Are Not Met**

  During my recent panel service, three specific observations indicated that our current ecosystem violates the necessary conditions for the "larger panel" solution to function.

  **1. Lack of Independence (Correlated Error)**
  Condorcet's theorem requires independent judgments. In practice, our reviewer pool is drawn from a small, overlapping set of subfields. When four reviewers share similar methodological training or academic lineage, their errors are correlated, not independent. If Reviewer A has a bias against a specific methodology, Reviewers B, C, and D from the same network often share it. Tripling the panel to twelve members drawn from the same pool does not add new information; it amplifies the same bias with greater confidence.

  **2. Social Anchoring and Drift**
  The proposal assumes we are aggregating twelve *independent* scores. However, our calibration calls involve discussion. I observed that scores frequently drift toward the opinion of the reviewer who speaks first or most confidently. This is a well-documented cognitive bias (anchoring). In a panel of twelve, the social pressure to conform is likely to be *higher* than in a panel of four. We risk creating a larger echo chamber, not a more diverse jury.

  **3. The Accuracy Threshold**
  The theorem only works if individual accuracy is >50%. On the genuinely contested proposals—the ones this reform is meant to solve—the distinction between "fundable" and "unfundable" is often indistinguishable from noise. If the individual probability of identifying the "best" science in a tie situation is essentially random (50%), adding more voters does not improve the odds. It simply makes a random decision more expensive.

  **The Cost of Scaling**

  Tripling the panel size triples the honoraria, administrative coordination, and time burden on our staff and reviewers. If the intervention does not improve decision quality, this is a significant diversion of resources that could otherwise support grants or reviewer training. Furthermore, recruiting twelve highly qualified, non-conflicted reviewers for every panel will inevitably force us to dip deeper into the pool, potentially lowering the average expertise per seat.

  **Alternative Proposals**

  We must solve the problem of inconsistency on close calls. However, we should invest in process reforms that target the *quality* of judgment rather than the *quantity* of judges. I recommend the Board direct the ED to develop a pilot program based on the following principles:

  **1. Structured Independence (Blind Scoring)**
  To capture the benefit of aggregation, we must preserve independence. Reviewers should submit final scores *before* any calibration call occurs. Discussion should be limited to proposals with high score variance. This prevents anchoring and ensures we are aggregating twelve actual opinions, not one opinion echoed eleven times.

  **2. Pool Diversification**
  To reduce correlated error, we must actively recruit reviewers from outside the immediate subfield networks. Interdisciplinary reviewers often spot merit (or risk) that domain experts miss. A panel of four truly diverse experts is statistically superior to a panel of twelve homologous ones.

  **3. Acknowledging Uncertainty (The "Lottery" Tier)**
  For the "close calls" where reviewer accuracy is demonstrably low, we should consider a tiered funding model. Proposals that pass a quality threshold but fall into the contested middle zone could be funded via a weighted lottery. This acknowledges that at a certain level of excellence, selection is subjective. It removes the burden of false precision from reviewers and eliminates the incentive for gaming the review process.

  **4. A Controlled Pilot**
  Before changing the bylaws for all panels, we should run a controlled experiment. Run five panels with twelve members and five with four, tracking inter-rater reliability and post-grant outcomes (where possible). Let data, not theory, drive the vote.

  **Recommendation**

  I urge the Board to vote **no** on the current proposal to triple panel sizes. This is not a rejection of the need for reform, but a rejection of an expensive solution that fails to address the social and structural realities of our review process.

  I move that we table the vote and form a small committee to draft a pilot program incorporating structured independence and pool diversification. We owe our applicants a review process that is not only larger, but genuinely smarter.

  I am happy to discuss these observations in detail at the next meeting.

  Respectfully,

  [Your Name]
  Board Member
