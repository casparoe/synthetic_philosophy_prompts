answer: |-
  **Setting:** *A conference room adjacent to the State Bar's hearing chamber. The Character and Fitness Committee is in recess, deliberating on Applicant 409. Two external advisors, Dr. Aris Thorne (a moral psychologist and situationist) and Prof. Elena Vance (an Aristotelian ethicist), have been asked to clarify the philosophical underpinnings of the dispute.*

  **Dr. Thorne:** Elena, look at the file. Ten years of glowing references, community service, impeccable tax records. And then, one afternoon five years ago, under deadline pressure at a paralegal firm, he backdates a filing. One act. And now half the committee wants to deny him admission based on the idea that this reveals his "true" character.

  **Prof. Vance:** And the other half wants to admit him because that one act is an outlier in a decade of conduct. That seems like the more reasonable reading, Aris. We are assessing moral character, not searching for a sinless saint.

  **Dr. Thorne:** But that's precisely the mistake. You're assuming "moral character" is a stable, global trait. You're acting as if honesty is like height—once you have it, you have it across situations. The psychological literature simply doesn't support that. John Doris's work on local versus global traits is devastating here. We don't have "honest people." We have "people-who-are-honest-when-not-under-pressure" or "people-who-are-honest-when-their-peers-are-watching."

  **Prof. Vance:** Doris argues that global traits are empirically unsupported, yes. But he defines character traits as behavioral dispositions that manifest cross-situationally regardless of context. That's a behaviorist's definition of character, not an Aristotelian one.

  **Dr. Thorne:** It's the definition the Bar is using. They want to know if he will be honest *as a lawyer*. But look at Isen and Levin's "dime in the phone booth" experiment. Subjects who found a dime in a payphone were significantly more likely to help a confederate pick up dropped papers than those who didn't find a dime. A trivial situational variable—a bit of luck—swamped any underlying personality trait. If a dime can toggle "helpfulness," why do you think ten years of references can guarantee "honesty" when the pressure of a court deadline hits?

  **Prof. Vance:** Because virtue isn't a reflex, Aris. It's not a stimulus-response mechanism triggered by mood or luck. When Isen and Levin's subjects helped, was it because they reasoned that helping was the right thing to do? Or was it a mood-congruent impulse? Virtue ethics is centered on *phronesis*—practical wisdom. It requires a cognitive engagement with the moral landscape. Finding a dime doesn't test practical wisdom; it tests suggestibility.

  **Dr. Thorne:** But Milgram's obedience experiments show that suggestibility is the rule, not the exception. Sixty-five percent of ordinary people were willing to administer lethal shocks because an authority figure told them to continue. These weren't sociopaths. They were teachers, engineers, neighbors. Their "global" trait of non-malevolence collapsed instantly under situational pressure. If we admit Applicant 409, we are betting that his "honesty" is more robust than the subjects in Milgram's study. The data says it isn't.

  **Prof. Vance:** You're conflating conformity with character. Rachana Kamtekar's critique of situationism is vital here. She argues that these studies target a much thinner notion of character than the one built into a genuinely Aristotelian account. The Milgram subjects weren't exercising virtue; they were surrendering their agency to authority. Virtue is precisely the capacity to *resist* that surrender through reasoned judgment. The fact that many fail doesn't mean the trait doesn't exist; it means it's hard to cultivate.

  **Dr. Thorne:** Hard to cultivate, or rare to the point of non-existence? Doris distinguishes between local and global traits for this reason. We might be able to certify that Applicant 409 has the local trait of "honesty-in-routine-legal-work." But the Bar requires a global prediction: will he be honest when the stakes are high, when he's tired, when his client is pressuring him? The situationist evidence suggests we cannot make that prediction based on past behavior because the next situation might have a variable—like the deadline he faced five years ago—that overrides the trait.

  **Prof. Vance:** But he confessed to the backdating. He disclosed it on his application.

  **Dr. Thorne:** Because the situation *now* is "application review," where honesty is the path of least resistance.

  **Prof. Vance:** That's cynical, even for a situationist. Acknowledging a past failure demonstrates the very *phronesis* I'm talking about. It shows he can evaluate his past actions, recognize the moral failure, and integrate it into a coherent narrative of improvement. Aristotelian character isn't static; it's developmental. A single lapse, followed by a decade of spotless conduct, suggests the lapse was a failure of *enkratea* (self-control) in a specific moment, not a lack of virtue overall. If we deny him based on the fear that a situation *might* arise where he fails again, we aren't assessing character. We're assessing risk based on the assumption that humans are incapable of moral growth.

  **Dr. Thorne:** I'm not saying they're incapable of growth. I'm saying the Bar's procedure rests on the idea that references predict future behavior. If traits are local, references only prove consistency in *past* situations. They don't transfer. You say he has practical wisdom? Practical wisdom should have prevented the backdating. If he has it now, when did he get it? And is it stable? The situationist point isn't that people are evil; it's that behavior is fragmented. Relying on a "global" assessment of good moral character is a philosophical mistake because the ontology doesn't exist.

  **Prof. Vance:** The ontology exists as a normative ideal, not just a descriptive category. The Bar isn't just a psychological screening; it's a gatekeeping for a normative profession. We admit people who demonstrate a commitment to the *reasons* for being honest, not just the habit of it. If we adopt your view, Aris, the Character and Fitness committee becomes obsolete. If behavior is purely situational, no amount of vetting works. We'd have to monitor lawyers constantly.

  **Dr. Thorne:** Maybe we should. Or maybe we should stop pretending we're certifying "good people" and start certifying "people who haven't been caught in the wrong situation yet." Doris suggests we should focus on structuring situations to encourage good behavior rather than selecting for traits that aren't there. But until then, certifying this applicant as possessing "good moral character" implies a consistency the science says he can't guarantee.

  **Prof. Vance:** And denying him implies that moral character is a fragile glass sculpture that shatters on the first drop. That undermines the profession's faith in its own members. We have to assume that agents can learn, that *phronesis* can be solidified through experience. To treat the backdating as a deterministic predictor of future fraud is to ignore the agency that virtue ethics posits as central to human action.

  **Dr. Thorne:** It's not ignoring agency. It's recognizing the limits of agency against situational forces. I'm not saying he *will* offend again. I'm saying your justification for admitting him—that he *is* a person of good character—is empirically unfounded. You can admit him on probation, or on mercy, but don't tell me you've verified his virtue.

  **Prof. Vance:** And I'm saying you can't verify risk either, because the next situation is unknown. We are left, as always, with judgment. Not statistical prediction, but moral judgment. He showed a lapse, he corrected it, he sustained the correction. That is the closest thing to "virtue" we can see in the wild.

  **Dr. Thorne:** (Closing the file) Then we agree on the evidence, but not on what it licenses us to conclude.

  **Prof. Vance:** It seems so. You see a fragmented agent vulnerable to context. I see a developing agent capable of reason.

  **Dr. Thorne:** And the committee still has to vote in ten minutes.

  **Prof. Vance:** Then they'll have to decide whether they trust the references, or the psychology.

  **Dr. Thorne:** Or whether they think the law requires saints, or just sinners who know the odds.

  *(They stand. Neither offers a hand, but they nod, gathering their papers to return to the waiting committee.)*
