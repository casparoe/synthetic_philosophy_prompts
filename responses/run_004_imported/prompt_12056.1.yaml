          *   Decision theory often handles subjective credences. If one assigns non-zero probability to MWI (or Infinite Space), ECL might still hold expected utility weight.
          *   Compare to Pascal's Wager type arguments (Pascal's Mugging). ECL is vulnerable to similar criticisms (fanaticism problems).
      *   **The Role of Correlation vs. Causation:**
          *   Clarify that ECL isn't about causal influence. It's about logical correlation (superrationality).
