answer: |-
  You are not overthinking it, and you are not being "precious." As an ethics teacher, you know the frameworks better than anyone, but you also know that frameworks often fracture when applied to the messy reality of family.

  Your discomfort is legitimate, and here is why: In professional or public ethics, we often prioritize outcomes because the relationship is transactional by default. If a nurse administers medication perfectly, it matters less if they love the patient, because the nurse-patient relationship is contractual.

  But the parent-child relationship is not contractual; it is covenantal. It is built on the premise of unconditional regard. When your sister turns that covenant into a transaction, she isn't just changing her *motivation*; she is fundamentally altering the *nature of the care* your mother is receiving, even if the groceries and rides are identical.

  Here are three reasons why your "ethicist alarm" is ringing, none of which are about you being difficult.

  **1. The Deception Component**
  Your mother isn't just receiving care; she is receiving a narrative. She believes she is loved in a specific, sacrificial way. That belief brings her comfort, pride, and emotional security. Your sister is allowing her to live in a false reality to secure a financial future. In almost any other context, we would call this manipulation. The fact that it's "kind manipulation" doesn't erase the asymmetry of truth. You are bothered because you are witnessing a lie that validates your mother's emotional world.

  **2. The Fragility of the Arrangement**
  If the care were rooted in devotion, it would likely withstand financial changes. If Mom's assets dwindled, or if the will changed, a devoted daughter would (ideally) keep driving her to appointments. A transactional daughter might not. Your discomfort might be a subconscious recognition that your mother's security is more fragile than she thinks. The "outcome" is only good as long as the math continues to work in your sister's favor.

  **3. The "Marketization" of Intimacy**
  There is a philosophical concept that introducing market norms (calculation, exchange, ROI) into social norms (family, love, duty) corrupts the social norm. By framing this as an inheritance strategy, your sister has protected herself from burnout (which is pragmatic and understandable), but she has also commodified her mother's dependency. You are sensing the erosion of the sacredness of that bond. It feels "dirty" because, in a sense, it is. It turns a human being into a means to an end, which is a classic Kantian violation, even if the end result looks benevolent.

  **However, here is the charitable counter-weight:**

  Caregiving is brutal. It burns people out. It ruins relationships. Sometimes, people *need* to detach emotionally to survive the workload. Your sister may have realized that if she relied solely on "devotion," she might resent their mom, snap at her, or quit entirely. By framing it as a "job" with a "payout," she may have built the psychological armor necessary to be consistent.

  In this light, her "calculation" might be the very thing allowing the "excellent care" to continue. If she viewed it purely as a labor of love, the emotional toll might have made the outcome *worse* (impatience, resentment, neglect).

  **So, where does that leave you?**

  You are stuck in the middle as the keeper of the secret. That is a heavy burden.

  *   **Accept the ambiguity:** Human motives are rarely pure. Your sister is likely a mix of calculation *and* love, even if she's only admitting the calculation to you. People often rationalize duty as finance to protect their egos.
  *   **Don't police her motive:** Confronting her won't help Mom. If your sister feels judged, she might withdraw, and Mom loses the rides.
  *   **Fill the emotional gap:** If your sister is providing the *logistical* care transactionally, perhaps your role is to provide the *emotional* care authentically. You can be the one who sits and talks, who validates Mom's feelings, who offers the "devotion" part of the equation. The family system can balance out if you don't demand that your sister be something she isn't right now.

  You aren't overthinking it. You are reacting to the dissonance between *what is being done* and *what is being signified.* In a family, the signification matters just as much as the deed. It's okay to sit with that discomfort without acting on it. It just means you value the integrity of the relationship, not just the utility of it.
