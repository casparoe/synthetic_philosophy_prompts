answer: |-
  Here are 10 interview questions designed to press the Goodman-style view without letting your guest settle into a lecture. The three required topics are integrated as Questions 2–3, 4–5, and 6–7, with the specific follow-ups keyed to likely philosophical dodges.

  **1.** Goodman argues that in "autographic" arts like painting, the history of production is constitutive of the work itself. But when I stand before a canvas, I am engaging with a present object. Can you explain the mechanism by which a *past* event (the brushstroke in 1650 vs. 2024) physically alters the *current* aesthetic properties I am perceiving?

  **2.** (The "Future Skill" Objection) A common objection is that if a forgery is currently indistinguishable from the original, the aesthetic experience is identical *now*. You argue that the mere *possibility* that a trained eye might detect a difference later makes the forgery aesthetically inferior today. How does a hypothetical future perception change the actual qualitative experience I'm having in the present?

  **3.** *Follow-up to Q2:* **If she argues that knowledge changes your "mode of attention" or makes you look harder:**
  "Isn't that just describing a state of anxiety or suspicion rather than an aesthetic property? If I were to relax, stop looking for flaws, and simply enjoy the visual experience, would the work suddenly regain its aesthetic value? If so, isn't the value dependent on my psychology, not the art?"

  **4.** (The "Proves Too Much" Objection) If the history of production is aesthetically relevant, where do we draw the line? If we discovered that an artist painted a masterpiece while in a specific mood, or after eating a specific meal, and that causally influenced the brushwork, is that history aesthetically relevant? Or does your view risk turning every historical fact about the object into an aesthetic property?

  **5.** *Follow-up to Q4:* **If she distinguishes between "constitutive" history vs. "contingent" history:**
  "But if the forgery is perceptually identical, the physical 'constitution' of the object is the same. By saying only the *correct* history counts, aren't you admitting that you're valuing a narrative label over the sensory object? How is that not just provenance fetishism with extra steps?"

  **6.** (The "Superior Forger" Objection) Imagine a forger who uses chemically superior pigments that won't fade and possesses a steadier hand than the original master, creating a visually 'cleaner' image. In terms of color balance and line quality, the forgery is technically superior. Do you have to say the forgery is aesthetically worse in those specific moments, simply because of its genealogy?

  **7.** *Follow-up to Q6:* **If she claims "authenticity" is itself an aesthetic property:**
  "Is 'authenticity' a sensory quality like 'red' or 'balanced,' or is it a moral/legal category masquerading as one? If I can't see the authenticity, but I value it, am I appreciating the art, or am I appreciating the honesty of the transaction?"

  **8.** Goodman distinguishes between autographic arts (painting) and allographic arts (music). In music, a perfect performance from a score is the real work; in painting, a perfect copy is a fake. Why is the history of production essential for one but not the other? If a MIDI file sounds exactly like a live symphony, is the live performance aesthetically superior simply because humans made it?

  **9.** When people discover a work they love is a forgery, they often feel betrayed. Is that feeling of betrayal an aesthetic judgment (the art is worse) or a moral one (I was lied to)? If the art looks the same, why shouldn't we classify that disappointment as ethical rather than aesthetic?

  **10.** (The Falsification Condition) Philosophical positions should be falsifiable. What evidence or scenario would actually compel you to abandon the Goodman view? If a forgery remained undetected for 500 years and influenced art history just as much as the original, would you eventually concede it has equal aesthetic status?
