prompt: |-
  So I just spent like two hours arguing with my friend Theo about fakes and forgeries and neither of us really won. His position: if a forgery is literally perceptually indistinguishable from the original, then whatever extra value we put on the "real" one is just status and provenance-fetishism, nothing to do with aesthetics. I tried to push back with the Goodman line from Languages of Art -- that an undetectable forgery can still be aesthetically inferior because its conceivable that a trained eye could eventually learn to tell them apart, and that mere future possibility is already aesthetically relevant now -- but I mangled the explanation badly and he wasn't buying it.

  Turns out next month's podcast guest is a philosopher of art who defends basically that exact Goodman-style view, so I want to walk in better prepared this time. Can you draft 8-10 interview questions that don't just let her restate the position? I want at least one question on the obvious "I can't perceive any difference right now, so how does a merely hypothetical future skill affect my experience today" objection, one on whether the move proves too much -- i.e. commits her to treating any undiscoverable-but-discoverable-in-principle fact about a work's history as potentially aesthetic rather than just historical -- and one built around a forger who's demonstrably more technically skilled than the original artist. For each, give a quick follow-up keyed to the dodge she's most likely to reach for, and close with one question about what would actually get her to give up the view.
