answer: |-
  **Elena:** Let's stick to your apartment case. You prefer A to B, B to C, and C to A. I start you at A. I offer to swap you to C for a fee. You take it. Then B for a fee. Then back to A for a fee. You're back at start, poorer. You've been pumped.

  **Marcus:** Only if I choose myopically. As a resolute chooser, I adopt a policy at the outset: "I will stop at B." When you offer the trade from B to A later, I decline.

  **Elena:** But at that moment, holding B, you prefer A-minus-fee. By refusing, you're choosing an option you rank lower. By your own current lights, you are making a mistake. That's the definition of irrationality.

  **Marcus:** That defines rationality synchronically. I define it diachronically. Rationality is about maximizing outcomes over the whole trajectory, not satisfying local impulses at every node. If I stick to the plan, I keep my money. If I follow my local preferences, I lose it. Which is actually rational?

  **Elena:** Here's the dilemma. If you maximize over the trajectory, you must have preferences over trajectories. Is "Trajectory-Stop-at-B" better than "Trajectory-Get-Pumped"? If yes, your preferences over trajectories are transitive. So the cyclical preferences over apartments were never your real preferences. You've smuggled transitivity in at the level of plans.

  **Marcus:** I'm not smuggling transitivity. My underlying valuation of the apartments remains cyclical. A is still better than B, locally. But I recognize that acting on local valuations leads to disaster. Resolute choice isn't changing the values; it's changing the decision rule to constrain them.

  **Elena:** But why constrain them? Only because you value "not being pumped" more than "having A." That higher-order value dominates. In any conflict, the higher-order value wins. That makes it the effective utility function. And that function must be coherent, or you get pumped on the policies themselves. You're saying the agent *acts* as if it has consistent utilities. For AI safety, that's all that matters.

  **Marcus:** It matters whether the consistency is foundational or enforced. If you assume the agent *is* coherent, you try to rewrite its soul. If you know it's resolute, you know the conflict remains managed. But let's grant your point about behavior. Consider this: what if I don't announce the sequence? I sneak up on you. You're holding C. I offer A for a fee. You didn't anticipate this trade, so you couldn't adopt a specific policy beforehand. Do you take it?

  **Elena:** Exactly. If you take it, you're pumped. If you refuse, why? You can't be adhering to a specific plan if you didn't know the trade was coming.

  **Marcus:** I adhere to a standing disposition: "I do not engage in cyclical trades." Even if the specific trade wasn't anticipated, it falls under the general policy I've resolved to follow. I treat unexpected offers as instances of the general class "potential pump."

  **Elena:** But how do you identify it as a cyclical trade in the moment? You have to evaluate the options. If you evaluate A vs. C locally, you prefer A. To see it as "cyclical," you need to model the whole cycle. If you can model the whole cycle, you're back to having preferences over plans. If you can't, you're blind to the pump. Resolute choice works only if you already see the structure—which implies you already have the coherent model you claim you lack.

  **Marcus:** It implies I have the cognitive capacity to recognize patterns of exploitation. That's not having transitive preferences over apartments; it's having a heuristic against exploitation. I can value A>B>C>A and still know that paying to cycle is bad. The coherence argument assumes preferences must drive action directly. I say preferences inform action, but rationality filters them.

  **Elena:** Then "rationality" is doing all the work, and "preferences" are just decorations. If we build an agent that filters preferences to avoid pumps, we've built an agent with coherent effective preferences. The cyclical underlying values are irrelevant because they're never allowed to manifest. You've conceded the coherence thesis: capable agents act *as if* they have consistent utilities.

  **Marcus:** I concede they act *as if* they are coherent to survive. But I deny they *are* coherent internally. And that internal structure matters. A resolute agent struggles against temptation; a coherent agent doesn't. The phenomenology of choice differs, even if the external behavior converges. Resolute choice preserves the reality of conflicting values without demanding we rewrite the agent's soul to fit a utility function.

  **Elena:** But if the binding is perfect, the pump fails. And if the binding isn't perfect, the pump succeeds. There's no middle ground where you keep the cycle and keep the money.

  **Marcus:** The middle ground is the policy. I keep the cycle in my heart, but not in my wallet.

  **Elena:** Then for the purposes of prediction and safety, the heart doesn't exist. Only the wallet matters.

  **Marcus:** Until the policy breaks. Then you need to know what lies beneath.
