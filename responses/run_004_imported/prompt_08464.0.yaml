      *   *Nuance:* The Soal fraud wasn't known in 1950. Turing was acting on the best available science of his time. The question is counterfactual: *If* he learned later.
      *   *Key Insight:* The "telepathy-proof room" is actually a control variable. It's not an endorsement of ESP, it's an isolation of the variable "computational ability."

  8.  **Finalizing the Argument Structure:**
