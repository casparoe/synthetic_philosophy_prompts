          *   Marcus: Physically, the alcohol killed him. The phone staying silent didn't push anything.
      *   **Round 2: The Plant Case (The Asymmetry Problem).**
          *   Marcus: Use the plant to show the absurdity. If omissions are causes, *everyone* who didn't water the plant caused its death.
          *   Elena: That's not true. We select causes based on norms/expectations.
      *   **Round 3: The Role of Duty/Norms.**
          *   Marcus: Aha! So "duty" is doing the work, not "causation." You're smuggling ethics into metaphysics.
          *   Elena: Maybe, but metaphysics should serve our understanding of agency. If we can't say omissions cause things, we can't explain responsibility.
      *   **Closing:** Acknowledge the stalemate but clarify the stakes for the Ethics Bowl team.

  4.  **Refining the Arguments (Self-Correction during drafting):**
