answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two philosophy professors, ELENA and MARCUS, are grading papers. ELENA is reading a draft from an Ethics Bowl team.*

  **Elena:** (Tapping the paper) Look at this. The students are treating the causation question like it's a slam dunk. "His failure to call 911 caused the death." They think that's the foundation of the moral blame.

  **Marcus:** (Without looking up) It *is* the foundation of the blame. But it's not a fact about causation. It's a fact about responsibility. They're conflating the two.

  **Elena:** Here we go. You're still on the "omissions aren't real causes" kick? Marcus, if I don't feed my cat and it starves, I killed it. If that's not causation, what is it? Magic?

  **Marcus:** It's morality, Elena. Look at the party case. Physically, what happened? Ethanol molecules bound to receptors in the friend's brainstem. Respiratory function ceased. That is a chain of positive events. Energy transfer. Matter in motion. The guy standing by the punch bowl? He emitted no photons, no sound waves, no force toward the victim. He did *nothing*. You can't build a metaphysical bridge out of nothing.

  **Elena:** That's the "process theory" view, and it's sterile. We live in a world of agents, not just billiard balls. Causation is about dependence. If the friend had been checked, he would be alive. If the guy had dialed, the paramedics would have come. The death *depends* on the non-action. That's a counterfactual dependency. It's as real as a brick through a window.

  **Marcus:** Counterfactuals are cheap. That's why I use the plant case with my intro class. Say you agree to water your neighbor's plant while she's in Fiji. You forget. The plant dies. Did your not-watering kill the plant?

  **Elena:** Obviously.

  **Marcus:** Okay. Now, consider me. I am also not watering that plant. I'm sitting here drinking coffee. I am also not calling the neighbor to tell her to come home. I am not sending a drone with water. In the counterfactual sense, if I *had* watered it, the plant would live. So, by your logic, my not-watering is just as much a cause of the plant's death as your not-watering.

  **Elena:** No, it's not. That's the asymmetry problem, and it doesn't break the theory; it refines it. We don't select causes in a vacuum. We select them against a background of expectations. You weren't supposed to water the plant. I was.

  **Marcus:** Aha! There it is. "Supposed to." You've smuggled a norm into the metaphysics. You're saying an omission is only a cause if there was a *duty* to act. But that means "cause" isn't doing the work here. "Duty" is doing the work. You're defining causation as "the absence of an action that someone was obligated to perform." That's circular. You need the obligation first to identify the cause, so the cause can't be the basis for the obligation.

  **Elena:** It's not circular, it's contextual. Causation is always contextual. If I ask, "What caused the fire?" you might say "the spark." But you don't say "the presence of oxygen," even though the fire also depends on oxygen. Why? Because oxygen is background. It's normal. The spark is the deviation. In the party case, the friend passing out is a deviation, but the *response* is the variable under human control. The guy's inaction is the deviation from the expected script of friendship.

  **Marcus:** But "expected script" is sociological, not ontological. In the plant case, you're admitting that physically, your absence of water and my absence of water are identical states of the universe. Zero water delivered. The only difference is a social contract you signed. So when the Ethics Bowl team says, "His inaction caused the death," they aren't making a scientific claim. They're making a legalistic one. They're saying, "He breached a duty."

  **Elena:** So what? Ethics *is* about duties. If your metaphysics of causation makes it impossible to assign responsibility for negligence, your metaphysics is broken, not the ethics. If we say "only positive events cause things," then the guy at the party is off the hook causally. The alcohol killed his friend. He's just a bystander who happened to be morally rotten.

  **Marcus:** I didn't say he's off the hook. I said he's morally responsible for *allowing* the death, not *causing* it. There's a distinction between killing and letting die. It matters. If I unplug a ventilator (positive act), that's different than if I refuse to plug it in (omission), even if the patient dies in both cases. The law recognizes this. The intuition recognizes this. Your view collapses the distinction.

  **Elena:** But in the party case, the distinction feels thin. He was the *only* one who noticed. He wasn't a random bystander; he was a friend. The relationship creates a causal channel. Think of it like a circuit. The friendship is the closed circuit. His inaction broke the circuit. A stranger's inaction wouldn't break the circuit because the circuit was never there. So the stranger's omission isn't a cause because there was no pathway for agency to flow.

  **Marcus:** "Pathway for agency." That's poetic, Elena, but look at what you're doing. You're deciding what counts as a cause based on who we *blame*. You're working backward. You want to blame the guy, so you hunt around for a theory of causation that lets you point at him. If the stranger had noticed, would you say the stranger caused the death by not calling?

  **Elena:** If the stranger noticed? Yes. Because once you notice a person in distress, a minimal humanitarian duty kicks in. The "circuit" closes upon awareness.

  **Marcus:** So causation turns on awareness? That's wild. Imagine two identical twins standing over the passed-out friend. Twin A knows CPR. Twin B doesn't. Twin A does nothing. Twin B does nothing. Friend dies. Did Twin A cause the death and Twin B didn't? Physically, they did the exact same thing: nothing.

  **Elena:** They didn't do the same thing. Twin A *refrained*. Twin B *was unable*. Refraining is a state of the agent, not just the environment. Twin A made a decision to not-act. That decision is a mental event.

  **Marcus:** The decision is a positive event, I'll grant you that. But the *cause of death*? That's still the alcohol. The decision explains why help didn't arrive, but it didn't push the friend toward death. It just failed to pull him back.

  **Elena:** You're treating "cause" like it means "push." But in ethics, "cause" means "the thing we could have changed to prevent the outcome." If we want to prevent these deaths, we don't just ban alcohol. We train people to call 911. We treat the omission as the causal lever. If you tell the Ethics Bowl team to say, "Technically he didn't cause the death, he just failed to prevent it," the judges will eat them alive. It sounds like a loophole.

  **Marcus:** Because judges are looking for moral accountability, not metaphysical precision. But here's the trap: if the team argues "omissions are causes," the opposing team will hit them with the plant case. They'll say, "So if I don't donate all my money to save a starving child, am I causing their death?" If they say yes, they're committed to an absurdly demanding morality where everyone is a mass murderer. If they say no, they have to explain why the party guy is different.

  **Elena:** And the explanation is the *proximity* and the *capacity*. I can't save every starving child. I can save the friend in front of me. The causal field is limited by what is practically possible.

  **Marcus:** "Practically possible." "Normal expectations." "Duty." See? Every time you try to defend omissions as causes, you end up listing moral or pragmatic conditions. My point is: let's be honest. Let's say causation is physical. The alcohol caused the death. The guy's omission is the reason he is *culpable* for the death.

  **Elena:** But that splits the world in half. It suggests the physical world is one thing and our agency is another. I think omissions are real because *agents* are real parts of the world. Our absences shape outcomes just like our presences. If I remove the keystone from an arch, the arch falls. Did I cause it to fall?

  **Marcus:** You moved the keystone. That's a positive action.

  **Elena:** If I *don't put it back* after I borrowed it?

  **Marcus:** (Sighs) Then you breached a contract.

  **Elena:** And the building fell *because* you breached the contract. The "because" is causal. Look, for the Ethics Bowl, the students need to own the omission. If they concede it's not "real" causation, they weaken the blame. They need to argue that in a social world, expectations *constitute* causal pathways. The friend relied on him. That reliance makes the omission a cause.

  **Marcus:** Fine. But tell them to be ready for the follow-up. If reliance makes it a cause, does *any* reliance count? If the friend relied on him to drive him home, and he didn't, and the friend walked and got hit by a car... is the omission the cause of the car accident?

  **Elena:** (Smiles) That's a foreseeability question, not a causation question.

  **Marcus:** Is it? Or is "causation" just the word we use when we've already decided someone was wrong?

  **Elena:** Maybe. But isn't it better to have a concept of causation that fits the world where humans actually live? A world where not-calling-911 kills people just as dead as a bullet does?

  **Marcus:** A bullet transfers energy. A phone call not made transfers nothing but regret.

  **Elena:** The friend is still dead, Marcus.

  **Marcus:** (Pauses, takes a sip of coffee) Agreed. But we need to know if we're blaming him for what he *did*, or for what he *is*. A bad friend, or a killer?

  **Elena:** In this case? The distinction doesn't save him.

  **Marcus:** No. But it matters for the philosophy.

  **Elena:** And for the bowl. They need to argue that the "cause" of the tragedy wasn't just the booze. It was the silence.

  **Marcus:** Just tell them to define their terms. If they define cause as "counterfactual dependence within a normative framework," they win. If they define it as "physical process," they lose.

  **Elena:** So the whole debate is just about which dictionary we're using?

  **Marcus:** (Grins) Welcome to philosophy, Elena. Now, are you going to finish that muffin, or is your *not-eating-it* going to cause it to go stale?

  **Elena:** (Takes the muffin) I'm preventing the staleness. Positive action.

  **Marcus:** Coward.
