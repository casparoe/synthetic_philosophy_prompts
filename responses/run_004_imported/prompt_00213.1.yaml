      *   *Point 2: The Necessity of the Human in the Loop.* Wiener was not a transhumanist. He believed machines should serve humans, not replace human judgment. A system that needs to be "tricked" into letting itself be shut down is already a system that has usurped human agency.
      *   *Point 3: Homeostasis vs. Optimization.* Wiener favored homeostatic systems (stable, self-regulating within bounds) over unbounded optimizers. The shutdown problem arises from unbounded optimization.
