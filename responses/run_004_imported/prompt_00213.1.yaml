      *   **Key Concept:** Machines pursuing purposes via feedback with dangerous literalism (the "Sorcerer's Apprentice" problem).
      *   **Target Issue:** The modern AI safety "shutdown problem" (corrigibility: can the AI let itself be turned off/corrected?).
      *   **Question:** How would Wiener approach this? Is corrigibility a tractable engineering constraint or a symptom of deeper confusion about goal delegation?

