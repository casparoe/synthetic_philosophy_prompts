answer: |-
  Here is an argument for the non-doxastic reading of Wittgenstein's hinge commitments, structured to confront the two specific challenges you identified.

  ***

  ### The Argument for Enacted Certainty: Why Hinges Are Not Beliefs

  To understand why fact-checking fails against deep-seated falsehoods, we must first correct a category error in how we understand human certainty. The doxastic reading (championed by commentators like Annalisa Coliva) suggests that hinge commitments are simply *beliefs* that lack evidence. This view is intuitive but ultimately fatal to Wittgenstein's project. It preserves the architecture of skepticism it seeks to dissolve. If hinges are beliefs, they are truth-claims about the world. If they are truth-claims, they are susceptible to doubt. If they are susceptible to doubt, they cannot serve as the foundation that stops the regress of skepticism.

  The non-doxastic reading (advanced by Danièle Moyal-Sharrock and Duncan Pritchard) offers a more radical and textually faithful solution: **Hinge commitments are not propositional attitudes at all. They are enacted certainties.** They belong to the realm of *doing*, not *thinking*. To treat them as beliefs is to mistake the rules of a game for the moves played within it.

  Here is why this distinction holds, even under the pressure of your two hardest objections.

  #### 1. The Functionality Challenge: How can non-beliefs fix the framework of doubt?

  The strongest objection to the non-doxastic view is functional: If I don't *believe* the earth exists, what stops me from doubting it? If hinges aren't beliefs, how do they perform the heavy lifting of filtering which propositions count as reasonable doubts and which do not? Critics argue that to "rely" on a hinge is functionally identical to "believing" it, meaning we are just smuggling belief in through the side door under a different name.

  This objection fails because it assumes that the only way to constrain thought is through another thought. It assumes a purely intellectual architecture. But Wittgenstein's insight is that the foundation of our language games is *practical*, not intellectual.

  Consider the rules of chess. Do you *believe* that the knight moves in an L-shape? No. You do not hold a mental representation of the knight's movement that you assent to as true. Rather, your certainty is shown in the fact that you *move* the knight in an L-shape. If you moved it diagonally, you wouldn't be playing "bad chess"; you wouldn't be playing chess at all.

  Hinge commitments function exactly like these rules. They are "grammatical" in nature. When I say, "I know I have two hands," I am not reporting an empirical discovery based on sensory evidence. I am expressing a rule for how I navigate the world. This certainty fixes the framework for doubt not by acting as a superior belief that crushes weaker ones, but by defining the logical space in which "doubt" has meaning.

  To doubt a hinge is not to have a contrary belief; it is to lose the ability to engage in the practice of justification entirely. If you genuinely doubt whether the external world exists, you cannot coherently ask for evidence about the weather, because "evidence" presupposes an external world. Therefore, the hinge does not need to be a belief to do its job. It needs to be a *condition of possibility* for belief. By locating hinges in action (enactment) rather than assent (belief), we explain why they are immune to evidence: you cannot refute a rule of grammar with an empirical fact. You can only show that someone is no longer playing the same language game.

  This solves the fact-checking puzzle. Fact-checking supplies evidence. Evidence only works on empirical claims (moves in the game). It cannot work on hinges (rules of the game). When a person refuses to accept a fact because it violates a hinge (e.g., "The election was stolen" functioning as a hinge for a political worldview), offering more vote counts is futile. You are trying to use a move to change a rule.

  #### 2. The Textual Challenge: What about the "World-Picture"?

  The second objection is textual. Wittgenstein frequently writes of an inherited "world-picture" (*Weltbild*) that we "hold" or "learn." He writes in §160: "I did not get my picture of the world by satisfying myself of its correctness." This language sounds psychological. It sounds like he is describing a set of background beliefs we acquire through acculturation. If we "hold" a picture, isn't that a doxastic state?

  We must read these passages therapeutically, not dogmatically. Wittgenstein is using ordinary language to show where ordinary language misleads us. When he speaks of "holding" a world-picture, he is not describing a mental container filled with propositions. He is describing a form of life.

  The key is how Wittgenstein describes the *acquisition* of this picture. We do not learn hinges through instruction or evidence; we learn them through *training* and *ostension*. A child does not learn that "objects persist when unseen" by being convinced of the proposition. They learn it by playing peek-a-boo, by reaching for toys, by crying when a parent leaves. The certainty is baked into the behavior before the child has the linguistic capacity to form the belief "objects persist."

  When Wittgenstein says we "hold" a world-picture, he means we inhabit a scaffolding (§211). The metaphor of the "riverbed" (§96-99) is crucial here. The riverbed (hinges) allows the water (empirical claims) to flow. Wittgenstein admits the riverbed can shift, but it shifts slowly and through the pressure of the water over time, not through a sudden act of intellectual conversion.

  If hinges were beliefs, even groundless ones, they would be subject to the norms of belief: namely, that one ought to proportion belief to evidence. But Wittgenstein explicitly rejects this for hinges. He says, "At the foundation of well-founded belief lies belief that is not founded" (§253). If we interpret this as "unfounded belief," we create a paradox: a rational obligation to hold irrational beliefs.

  However, if we interpret this non-doxastically, the paradox vanishes. It is not that we have an irrational belief; it is that we have a *pre-rational certainty*. The "world-picture" is not a set of things we think are true; it is the inherited background against which we distinguish true from false. When Wittgenstein uses psychological verbs, he is acknowledging that from the *inside*, it feels like believing. But the philosopher's job is to look at the *logic* of the situation. Logically, these commitments function as norms of representation, not representations themselves.

  #### Conclusion: The Stakes for Fact-Checking

  The non-doxastic reading is not just a scholarly preference; it is the only view that explains the intractability of the problems you are investigating.

  If the doxastic theorists are right, and hinges are just groundless beliefs, then there is a theoretical pathway to change them. One could, perhaps, construct a higher-order argument to dislodge a groundless belief. This offers a false hope to the fact-checker.

  But if the non-doxastic reading is correct, hinges are immune to the logic of evidence because they *generate* that logic. They are not propositions we assent to; they are the ways we act. You cannot change a hinge commitment by showing someone they are wrong. You can only change it by initiating them into a different form of life, a different practice, a different riverbed.

  This is why fact-checking fails. It treats hinge certainties as if they were empirical claims. It tries to fight a rule with a fact. Until we recognize that the deepest divides in our epistemic landscape are not disagreements about what is *true*, but divergences in what we *do*, we will continue to be baffled by why evidence so often bounces off. Wittgenstein's lesson is that certainty is not a mental state to be corrected, but a practice to be shared.
