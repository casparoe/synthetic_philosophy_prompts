      *   *Defense 2: Modality (Would-bes).* Peirce distinguishes between actuality and possibility (would-conditions). Fitch treats $\diamond$ as standard logical possibility. Peirce treats possibility as real potentiality grounded in habits. Maybe the "possibility of knowing" isn't a logical operator in the Fitch sense but a dispositional property of the universe.
