answer: |-
  ### The Example: The Material Constitution of an Artwork

  **Statement:** *"Michelangelo's **David** is the figure carved from **this specific block of Carrara marble**."*

  This statement belongs to the domain of **the identity conditions of artworks**. It is not a standard natural kind identity (like "Water is H₂O") nor a simple nominal identity (like "Hesperus is Phosphorus"). Instead, it links a cultural artifact to its material origin.

  ### The Kripkean Case for Necessity *A Posteriori*

  A philosopher extending Kripke's semantics from *Naming and Necessity* would be strongly tempted to classify this statement as a necessary truth known *a posteriori*. The argument proceeds as follows:

  1.  **Rigid Designators:**
      *   **"Michelangelo's *David*"**: Functions as a **proper name** for the artwork. On the Kripkean view, names are rigid designators; they refer to the same object in every possible world where that object exists, regardless of how the object is described.
      *   **"This specific block of Carrara marble"**: Functions as a **demonstrative/indexical rigid designator**. It picks out a specific portion of matter in the actual world and refers to *that very matter* in all possible worlds.

  2.  **Origin Essentialism:** Kripke argues that artifacts (like tables or statues) have their material origins essentially. An artifact cannot originate from a different chunk of matter than the one it actually originated from. If *David* had been carved from a different block of stone, it would be a *different* statue, not *David*.

  3.  **Empirical Discovery:** It is not knowable *a priori* which block of marble constitutes *David*. This requires art historical and geological investigation (an *a posteriori* endeavor).

  4.  **Conclusion:** Since the statement is an identity between two rigid designators ("*David*" = "*This Block*"), and it is true in the actual world, Kripkean logic dictates it must be true in all possible worlds where *David* exists. Thus, it is **necessary *a posteriori***.

  ### Where the Case for Necessity Becomes Shaky

  While the Kripkean framework applies neatly here on paper, the status of this necessity is highly contestable when confronted with the specific ontology of artworks. The shakiness arises in three specific areas:

  **1. The Restoration Paradox (Persistence through Material Change)**
  Kripkean origin essentialism implies that if the original matter is destroyed or replaced, the object ceases to exist. However, the identity conditions of artworks are normatively flexible. Artworks undergo restoration, cleaning, and even partial replacement of material without losing their identity.
  *   *The Objection:* If a conservator replaces 1% of the marble in *David* due to erosion, it remains *David*. If necessity holds strictly regarding the *specific block*, then the moment a single molecule is altered, *David* ceases to exist and is replaced by a numerically distinct object. Most aestheticians and art theorists reject this, arguing that the artwork can survive minor material changes. This suggests the identity of *David* is not rigidly tied to the *entirety* of the original matter, undermining the strict necessity of the identity statement.

  **2. Action-Type Ontology vs. Physical Object**
  Many philosophers of art (e.g., David Davies, Gregory Currie) argue that artworks are not physical objects but **action types** or **generative performances**. On this view, *David* is not the marble itself, but the *achievement of Michelangelo carving that marble*.
  *   *The Objection:* If *David* is an action type, then the specific block of marble is a contingent prop in the performance, not the work itself. In a counterfactual world where Michelangelo used a qualitatively identical block from the same quarry to perform the same artistic action, we might intuitively say *David* still exists. If the artwork is the *creative act* rather than the *physical residue*, the identity statement "David = This Block" is not necessary, but merely contingent.

  **3. Vagueness and Boundary Conditions**
  Kripkean necessity requires precise identity conditions. However, "this specific block of marble" is a vague designator.
  *   *The Objection:* Does the block include the dust that fell off during carving? Does it include the subsurface rock that was never exposed? Because the boundaries of the "block" are not metaphysically precise, the identity statement lacks the precision required for strict metaphysical necessity. If the designator on the right-hand side is vague, the necessity claim becomes unstable; it shifts from a metaphysical truth to a linguistic convention about how we draw boundaries around material objects.

  ### Summary
  The statement *"Michelangelo's David is the figure carved from this specific block of Carrara marble"* mimics the logical form of Kripke's necessary *a posteriori* truths. However, its necessity is contestable because **artworks are culturally emergent entities** whose identity conditions are governed by normative practices (restoration, authorship, interpretation) rather than strict mereological essentialism. Extending Kripke's model from natural kinds and persons to cultural artifacts ignores the flexibility inherent in social and aesthetic ontology.
