  If $U$ is bounded by $M$, then $\sum |U(x_i) p_i| \le \sum M p_i = M \sum p_i = M$. Yes, bounded utility implies absolute convergence of the expectation series. So bounded utility *does* solve Pasadena.
  *So why is Pasadena worse?*
  Because SPP can be accepted by some (e.g., "Yes, the game is worth infinite dollars"). Pasadena *cannot* be accepted by anyone. You cannot say "The game is worth $\ln(2)$" because I can rearrange it to be worth $100$. You cannot say "The game is worth infinity." There is *no* value you can assign. It renders the concept of Expected Value *incoherent* rather than just *large*.
  Also, SPP preserves *some* rational preferences (Dominance). PP destroys Dominance. That's the key.

