answer: |-
  You have excellent instincts. Your intuition that "both break Expected Value (EV) theory" is correct, but your housemate is also right: decision theorists treat the Pasadena Paradox as a distinctly more vicious problem than the St. Petersburg Paradox (SPP).

  It's not just "infinity vs. undefined." It's about **which axioms of rationality survive the crash.**

  Here is the breakdown of why the Pasadena Paradox (introduced by Nover & Hájek in 2004) is considered a "nightmare scenario" compared to the "classic nightmare" of St. Petersburg.

  ### 1. The Math: Absolute vs. Conditional Convergence
  You already know the analysis, but let's translate it into decision theory terms.

  *   **St. Petersburg:** The series of expected utilities is $\sum 1$. This diverges to $+\infty$. It is **not** conditionally convergent. No matter how you reorder the terms, the sum is $+\infty$.
  *   **Pasadena:** The series is $\sum \frac{(-1)^{n-1}}{n}$. This is **conditionally convergent**. By the Riemann Rearrangement Theorem, you can reorder the terms to sum to $\pi$, $-\text{googol}$, or diverge.

  **Why this matters:** In probability theory, the sample space is a **set** of outcomes. Sets do not have an order. When we define Expected Value over a countable set, we implicitly assume **absolute convergence**. If a series is only conditionally convergent, the "Expected Value" depends on the *order in which you list the outcomes*.

  Since there is no physical or metaphysical reason to list "Heads on toss 1" before "Heads on toss 5," the value of the game becomes dependent on an arbitrary labeling convention. In SPP, the value is infinite regardless of labeling. In Pasadena, the value has no truth value at all.

  ### 2. The Dominance Principle (The Big One)
  This is the main reason philosophers lose sleep over Pasadena and just shrug at St. Petersburg.

  **Statewise Dominance** is a core axiom of rational choice. It says: If Game A pays more than Game B in *every possible outcome*, a rational agent must prefer Game A.

  *   **In St. Petersburg:** Dominance mostly holds. If I offer you the St. Petersburg game plus \$1 in every outcome, the EV is still $\infty$, but intuitively and formally (in many extended real number systems), the new game is "at least as good as" the old one. You haven't broken the logic of preference entirely.
  *   **In Pasadena:** Dominance **fails completely**.
      Imagine Game P (Pasadena) and Game P+ (Pasadena plus \$1 in every outcome).
      *   In every single state of the world, P+ pays more than P.
      *   However, because the EV series for P is conditionally convergent, I can rearrange the terms of P to sum to $1,000,000$.
      *   I can rearrange the terms of P+ to sum to $-1,000,000$.
      *   Suddenly, EV theory tells me P is better than P+, even though P+ pays more in every single possible reality.

  This is much worse than "EV is infinite." This is "EV theory recommends the strictly worse option." It suggests that Expected Value theory isn't just *imprecise* here; it's **incoherent**.

  ### 3. Fixability
  You mentioned that SPP is usually solved by "discounting astronomically unlikely payoffs" or "bounded utility." You are right; SPP is actually quite easy to patch.

  *   **Fixing SPP:** Daniel Bernoulli solved this in 1738. If you assume **diminishing marginal utility** (e.g., utility is $\log(\text{money})$), the St. Petersburg series becomes $\sum \frac{1}{2^n} \log(2^n)$, which converges to a finite number. Problem solved. Most modern decision theorists accept bounded utility functions, which makes SPP vanish.
  *   **Fixing Pasadena:** Bounded utility *does* fix Pasadena (because if utility is bounded, the series becomes absolutely convergent). **However**, the Pasadena paradox is designed to attack the structure of **aggregation** itself.
      Even if you cap utility, Pasadena highlights that for *any* unbounded utility function (which many people want to allow), the definition of Expectation is broken. SPP says "Your utility function grows too fast." Pasadena says "Your definition of summation over infinite sets is ill-posed."

      There are generalizations of the Pasadena game (the "Altadena" paradox) that create even nastier issues with variance and higher moments, suggesting that simply capping utility might not be enough to save all the nice properties of decision theory.

  ### 4. "Infinity" vs. "Indeterminacy"
  To use a programming analogy:
  *   **St. Petersburg** is an **Overflow Error**. The number is too big for the container. You can fix this by getting a bigger container (extended reals) or limiting the input (bounded utility).
  *   **Pasadena** is a **NaN (Not a Number) / Race Condition**. The result depends on the order of operations, but the order of operations is undefined.

  In philosophy, "Infinity" is a concept we can work with. We have theories of infinite value, infinite ethics, etc. We can say "This action produces infinite good."
  "Indeterminacy" is much harder. If I ask, "Is this game worth taking?" and the answer is "It depends on how you write down the sample space," then Expected Value theory cannot guide action *at all*. It's not that the answer is big; it's that there is no answer.

  ### Summary
  Your housemate is right to be excited.
  *   **St. Petersburg** tells us: "Expected Value can be infinite."
  *   **Pasadena** tells us: "Expected Value might not exist, and even if you try to calculate it, it can violate the basic rule that more money is better than less money."

  St. Petersburg challenges the *values* we assign to outcomes. Pasadena challenges the *arithmetic* we use to combine them. That's why decision theorists view Pasadena as a deeper, more structural threat to the theory.

  (Also, tell your housemate she's doing great work. Bridging Real Analysis and Decision Theory is exactly where the fun stuff happens.)
