answer: |-
  You are correct that I. J. Good's 1967 theorem is one of the most robust results in classical decision theory. Your intuition is sound: under the standard axioms of Bayesian rationality, acquiring cost-free, relevant evidence before making a decision has a non-negative expected value. In the strict language of decision theory, your friend's policy of deliberate ignorance is indeed indefensible **provided** we accept the standard assumptions underlying Good's proof.

  Since you asked for a rigorous explanation of why her habit is a mistake (and where the mathematical weight lies), I will outline the formal argument for Good's Theorem, apply it to her specific cases, and then identify the specific technical assumptions where her intuition might be trying to find a foothold.

  ### 1. The Formal Argument (Good's Theorem)

  To see why avoiding information is irrational, we must compare the **Expected Utility (EU)** of two strategies:
  1.  **Act Immediately:** Choose an action now based on current beliefs.
  2.  **Observe then Act:** Observe a piece of evidence, update beliefs, and *then* choose an action.

  **The Setup:**
  *   Let $S$ be the set of possible states of the world (e.g., "Market crashes" vs. "Market recovers").
  *   Let $A$ be the set of available actions (e.g., "Sell" vs. "Hold").
  *   Let $U(a, s)$ be the utility of taking action $a$ in state $s$.
  *   Let $P(s)$ be your prior probability of state $s$.
  *   Let $E$ be a random variable representing the evidence you might observe (e.g., "Log in to account"), with possible outcomes $e$.

  **Strategy 1: Ignorance (Act Immediately)**
  You choose the action $a$ that maximizes expected utility based on your prior beliefs.
  $$EU_{\text{ignore}} = \max_{a \in A} \sum_{s \in S} P(s) U(a, s)$$

  **Strategy 2: Information (Observe then Act)**
  You observe evidence $e$ (which occurs with probability $P(e)$). This updates your beliefs to the posterior $P(s|e)$. You then choose the optimal action $a_e$ for that specific evidence.
  $$EU_{\text{observe}} = \sum_{e \in E} P(e) \left[ \max_{a \in A} \sum_{s \in S} P(s|e) U(a, s) \right]$$

  **The Proof:**
  The core mathematical insight relies on the properties of the $\max$ function. The function $f(x) = \max(x)$ is **convex**. By Jensen's Inequality (or simply the properties of maximization), the expected value of a maximum is always greater than or equal to the maximum of the expected value.

  Intuitively: When you observe evidence, you have the *option* to change your action to suit the new information. However, you also retain the *option* to ignore the new information and take the same action you would have taken originally.
  *   If the evidence suggests your original plan was right, you stick with it.
  *   If the evidence suggests your original plan was wrong, you switch.

  Because you can always do at least as well as the "Ignorance" strategy (by simply ignoring the data and acting as before), but potentially better (by tailoring your action to the data), the expected utility of observing must be higher or equal.

  $$EU_{\text{observe}} \ge EU_{\text{ignore}}$$

  Therefore, for a rational Bayesian agent, paying any positive cost (including effort) to avoid free evidence is strictly irrational. It is equivalent to voluntarily tying one's own hands behind one's back before a fight.

  ### 2. Applying the Theorem to Your Friend's Cases

  Here is how Good's Theorem renders her three habits mistakes under standard decision theory:

  **A. The Sports Match (Spoiler Avoidance)**
  *   **Decision:** How to watch the recording.
  *   **States:** The actual sequence of events in the game.
  *   **Utility:** Derived from the experience of watching.
  *   **The Mistake:** If the utility is derived solely from the *visual experience* of the recording (which is fixed), knowing the score beforehand does not change the recording. However, if knowing the score changes her *reaction* (e.g., she enjoys tension), information allows her to prepare emotionally.
  *   **Strict View:** If she claims she enjoys the "surprise," Good's Theorem suggests she is mistaken about her own utility function. Information allows her to modulate her expectations. If the surprise is the utility, the "state of the world" includes her knowledge. But classically, information allows for optimal preparation of emotional state. Avoiding it limits her ability to maximize enjoyment.

  **B. The Genetic Test (No Treatment)**
  *   **Decision:** Life planning.
  *   **States:** Gene present vs. Gene absent.
  *   **Actions:** {Live normally, Plan for early death, etc.}.
  *   **The Mistake:** Even if there is no *medical* treatment, there are almost always *life* decisions contingent on the state (financial planning, family planning, career choices).
  *   **Strict View:** If there is truly **no** action she could take that would differ based on the result, then $EU_{\text{observe}} = EU_{\text{ignore}}$. The value of information is zero. However, if there is even a tiny probability that she would make a different life choice (e.g., "If I have the gene, I will save more money"), the value is positive. Avoiding it closes off potentially utility-increasing life paths.

  **C. The Retirement Account (Market Drops)**
  *   **Decision:** Hold or Sell.
  *   **States:** Market Temporary Dip vs. Market Crash.
  *   **The Mistake:** This is the clearest violation. Checking the account provides evidence about the market state.
  *   **Strict View:** If she is a rational agent, seeing the drop allows her to calculate whether to rebalance (buy low) or hold. Avoiding the information prevents her from capitalizing on market inefficiencies. If she fears she will panic-sell, standard theory says she should cultivate rationality, not ignorance. Ignorance prevents the optimal response to a buying opportunity.

  ### 3. Why Your Friend Wasn't Persuaded (The Breakdown Points)

  You mentioned neither of you could say exactly where the argument breaks down. The argument **does not break down mathematically**, but it relies on three specific assumptions about the agent. If your friend's psychology violates these assumptions, her behavior becomes "rationally defensible" in a broader sense, even if it violates Good's Theorem.

  Here are the three "Escape Clauses" where avoiding information becomes rational:

  **1. Utility Over Beliefs (The "Ostrich Effect")**
  *   **Good's Assumption:** Utility depends only on the *state of the world* and the *action* ($U(a, s)$).
  *   **Friend's Reality:** Utility often depends on *beliefs* ($U(a, s, \text{belief})$).
  *   **Explanation:** Humans derive direct pleasure from hope and direct pain from anxiety. If finding out she has the genetic gene causes immediate psychological suffering (disutility) that is not offset by any change in action, then the information has a "psychological cost."
  *   **Verdict:** Good's Theorem assumes information is **cost-free**. If "anxiety" counts as a cost, the theorem no longer guarantees $EU_{\text{observe}} \ge EU_{\text{ignore}}$. If she values "peace of mind" (a belief state) over "optimal planning" (an outcome state), ignorance is instrumentally rational for maximizing her specific utility function.

  **2. Dynamic Inconsistency (Akrasia)**
  *   **Good's Assumption:** The agent remains a rational maximizer *after* observing the evidence.
  *   **Friend's Reality:** She knows she will act irrationally after seeing the news.
  *   **Explanation:** In the retirement account case, she likely knows: "If I see the number drop, I will panic and sell at the bottom." A rational agent *should* hold, but she predicts her own future irrationality.
  *   **Verdict:** This is a **pre-commitment strategy**. By avoiding the information, she is protecting her long-term interests from her short-term emotional volatility. In game theory and behavioral economics, restricting your own information set can be a rational solution to a self-control problem. Good's Theorem assumes you trust your future self; she does not.

  **3. The Definition of "Relevant"**
  *   **Good's Assumption:** The evidence is relevant to the decision (i.e., $P(s|e) \neq P(s)$).
  *   **Friend's Reality:** She may believe the evidence is irrelevant to her happiness.
  *   **Explanation:** Regarding the sports match, she might argue the outcome of the game is causally disconnected from her enjoyment of the recording *unless* she knows it.
  *   **Verdict:** If the information truly has no bearing on the optimal action (e.g., the genetic test with absolutely no life-planning changes), the value of information is exactly zero. Avoiding it is not a "mistake" (since $0 = 0$), but paying to avoid it would be.

  ### Summary for Your Debate

  You win the argument on **theoretical grounds**: Under the standard axioms of decision theory (Outcome-Dependent Utility, Rational Future Self, Cost-Free Information), Good's Theorem proves that avoiding information is strictly suboptimal. It is a mathematical certainty that a Bayesian agent cannot expect to do better by deciding blind.

  However, your friend wins the argument on **psychological grounds**: If her utility function includes "emotional state" (anxiety/hope) or if she recognizes her own future irrationality (panic selling), then the assumptions of Good's Theorem are violated. In those specific contexts, "strategic ignorance" is a rational heuristic for managing human limitations, even if it is irrational for an idealized Bayesian robot.

  **The Rigorous Conclusion:**
  Her habit is a mistake **if and only if** she is an idealized rational agent who cares only about physical outcomes. If she is a human being who derives utility from hope or struggles with self-control, her avoidance is a rational second-best solution to managing her own psychology. Good's Theorem tells us what an ideal agent should do; your friend is optimizing for a human agent.
