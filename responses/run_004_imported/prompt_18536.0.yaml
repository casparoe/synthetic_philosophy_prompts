      *Refining Step 3:* Maya's parking spot analogy is actually her weak point in Step 3, even if her distinction is good. I should note that. Jonah exploits this in Step 4.
      *Refining Step 5:* Maya's move is logically powerful but philosophically costly. Giving up moral dilemmas to save OIC is a valid trade-off, but not the only one. I need to highlight that cost.

  6.  **Final Review against Prompt:**
      *   Go through move by move? Yes.
