      *   *Better phrasing:* It's better to say they are *incompatible theories*. You cannot work in INT and CLASS simultaneously. But BISH is compatible with both (it's a common core).
      *   *Make sure to emphasize:* The user's confusion stems from conflating "Constructive Math" (generic) with "Bishop's Constructive Analysis" (specific).

