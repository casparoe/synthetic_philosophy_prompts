      *   Needs to be respectful of the student's effort (it *is* a good exercise).
      *   Needs to be philosophically rigorous but accessible.

  7.  **Key Insight to Highlight:**
      *   The difference between *methodological* doubt (a tool) and *global* skepticism (a lifestyle).
      *   The idea that doubt is *parasitic* on certainty. You need a background of unquestioned things to question specific things.

  8.  **Final Polish (Reviewing against the prompt):**
