answer: |-
  You have diagnosed the situation with remarkable precision. It is a rare and satisfying moment when a lifetime of empirical practice converges so cleanly with a specific philosophical insight. Your intuition is correct: you and your brother-in-law are not playing the same language game, and you are not standing on the same epistemic ground.

  Drawing on Wittgenstein's *On Certainty* and Robert Fogelin's development of "deep disagreement," here is an analysis of the implications for your specific situation, addressing both the possibility of persuasion and the prudence of changing your strategy.

  ### 1. The Nature of the Disagreement: Riverbeds and Scaffolding

  In *On Certainty*, Wittgenstein distinguishes between propositions that are tested (the "water" of the river) and the propositions that form the channel through which the water flows (the "riverbed"). For you, after forty years of stratigraphy, "The earth is millions of years old" is not a hypothesis you test daily; it is part of the riverbed. It is a **hinge proposition**. It is the scaffolding that allows you to make sense of a radiometric date. If you doubted the age of the earth, the radiometric date would not just be "wrong"; it would be *senseless*.

  For your brother-in-law, the hinge is likely something like "The Biblical text is the inerrant word of God" or "Human testimony (Scripture) outweighs natural testimony." When you present an ice core, you are offering a move in *your* game (naturalism/uniformitarianism). He receives it in *his* game (creation science/hermeneutics), where that same data is interpreted as evidence of a catastrophic flood or a decay in physical constants.

  **Implication:** The disagreement is not about the *data*, but about the **authority of the framework** used to interpret the data. Fogelin argues that in "deep disagreements," the usual norms of argumentation (shared premises, shared standards of evidence) are absent. You cannot use evidence to prove a hinge, because the evidence only counts as evidence *if* the hinge is already accepted.

  ### 2. Is Rational Persuasion Possible?

  This is the most difficult implication of the literature. Fogelin was initially quite pessimistic, suggesting that deep disagreements are rationally unresolvable because there is no "common ground" to which an appeal can be made. If logic is a tool that operates *within* a framework, it cannot be used to repair the framework itself.

  However, later scholarship on hinge epistemology (by philosophers like Michael Lynch, Annalisa Coliva, and Daniele Moyal-Sharrock) offers a more nuanced view:

  *   **Persuasion is not Proof:** You cannot *prove* him wrong in a way that compels logical assent. If hinges could be proven, they wouldn't be hinges; they would be ordinary knowledge claims.
  *   **Hinges are Dynamic:** Wittgenstein notes that the riverbed can shift. Hard rock becomes sand and flows; sand hardens into rock. Hinges can change, but usually through slow, tectonic pressure rather than sudden logical strikes. This pressure often comes from life experience, community shifts, or the cumulative weight of anomalies, not a single "gotcha" fact.
  *   **The Possibility of "World-Picture" Travel:** Persuasion in deep disagreement requires one party to temporarily inhabit the other's world-picture to see where the friction lies. This is rarely achieved through debate. It is achieved through relationship and trust.

  **Verdict on Persuasion:** Rational persuasion, in the sense of a logical deduction that forces a change of mind, is **impossible**. However, *conversion* (a shift in world-picture) is **possible**, but it is a slow, non-linear, and largely non-rational process (in the strict logical sense). It is more akin to religious conversion or falling in love than it is to solving an equation.

  ### 3. Ought You to Change How You Argue?

  Given the above, the literature strongly suggests you should change your approach. Continuing to cite evidence is not just fruitless; philosophically speaking, it is a **category mistake**. You are treating a hinge proposition as an empirical claim.

  Here are three strategic shifts recommended by hinge epistemology:

  **A. Stop Trying to Dislodge the Hinge**
  Directly attacking a hinge proposition often triggers a defensive strengthening of that hinge. If you tell a YEC the earth is old, you are asking them to doubt the authority of their faith community and scripture simultaneously. The psychological and social cost is too high.
  *   *New Strategy:* Acknowledge the hinge status. You might say, "I realize that for you, the timeline of Genesis is the foundation, just as deep time is the foundation for my work. We aren't disagreeing about rocks; we are disagreeing about where certainty comes from." This validates his rationality (within his system) without conceding your own.

  **B. Shift from "Truth" to "Coherence and Pragmatics"**
  Since you cannot agree on first principles, discuss the *consequences* of the hinges. Wittgenstein was interested in how language and belief function in life.
  *   *New Strategy:* Instead of arguing about *whether* the earth is old, ask *how* the belief functions. Does the young-earth view help him navigate the world? Does your deep-time view help you? You can point out that your hinges allow for successful prediction (finding oil, understanding climate change) without claiming this "proves" your metaphysics. Focus on the *utility* of the framework rather than its ultimate ontological status.

  **C. Accept the "Standoff" as a Relationship Condition**
  Fogelin's work implies that some disagreements are permanent features of a pluralistic society. The goal of argumentation shifts from **conversion** to **coexistence**.
  *   *New Strategy:* Treat the disagreement as a "fault line" that you both know is there, but which you agree not to let rupture the relationship. This requires intellectual humility on your part, too: acknowledging that your own commitment to naturalism is, at its very root, also a hinge commitment (a trust in the uniformity of nature) that cannot be ultimately proven to an outsider.

  ### A Note for the Geologist-Philosopher

  There is a profound irony here that Wittgenstein would appreciate. For forty years, you trusted the rock. Now, philosophy tells you that this trust was not a conclusion you reached, but a precondition for your work. You did not *find* deep time; you *entered* it.

  Your brother-in-law has done the same with Scripture.

  The implication for your retirement philosophy is this: **Argument is often the wrong tool for foundational differences.** If you continue to bombard him with data, you are essentially shouting at a door that opens inward, while you are pushing outward.

  **Recommendation:**
  Change the goal. Do not argue to win. Argue to understand the architecture of his certainty. Ask him, "What would have to happen for you to doubt the age of the earth?" His answer will likely reveal that nothing *empirical* could do it, which confirms the hinge status. Once you both acknowledge that you are standing on different ground, the heat of the argument often dissipates, leaving room for the warmth of the relationship.

  You cannot logic him out of a position he didn't logic himself into. But you can love him across the divide. In the context of *On Certainty*, that may be the only rational move left.
