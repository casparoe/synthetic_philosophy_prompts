answer: |-
  Here are 10 interview questions designed to move beyond the textbook summary of anti-reductionism, including your four mandatory topics. Each includes a follow-up keyed to the standard philosophical defense she is most likely to offer.

  ### 1. The Gullibility Objection
  "The most common intuition pump against the Reid/Coady line is that it sanctifies gullibility. If we have a *prima facie* duty to believe without independent verification, aren't we epistemically obligated to be easily duped? How do you distinguish 'default trust' from 'naivety' without smuggling reductionist criteria back in?"

  *   **Follow-up:** "She will likely argue that 'defeaters' (signs of deceit or error) remove the default right. Ask: *'But if the threshold for spotting a defeater is low enough to avoid gullibility, doesn't that require the very inductive monitoring you're trying to reject?'*"

  ### 2. Defeaters in Real Time
  "Let's press on those defeaters. In theory, a contradiction defeats testimony. But in real-time conversation—especially in high-stakes or fast-moving contexts—what does the cognitive mechanism for spotting a defeater actually look like? Are we consciously scanning for inconsistencies, or is this a post-hoc rationalization of why we stopped believing?"

  *   **Follow-up:** "She will likely claim this monitoring is unconscious or heuristic. Ask: *'If the monitoring is unconscious and automatic, how is that functionally different from the local reductionist's "monitoring" condition? Have you just relabeled reductionism?'*"

  ### 3. Coady vs. Fricker (Global vs. Local)
  "C.A.J. Coady's famous argument against Hume is that we can't verify testimony without relying on other testimony, which sinks *global* reductionism. But does that argument actually touch Elizabeth Fricker's *local* reductionism? She argues we don't need a global validation of testimony, just case-by-case monitoring based on perceptual cues. Doesn't Coady's circularity worry leave Fricker's specific, localized monitoring completely untouched?"

  *   **Follow-up:** "She will likely argue that even 'local' cues (like confidence or eye contact) are interpreted through testimony. Ask: *'But aren't there basic perceptual cues—like a speaker slurring from intoxication—that don't require testimonial backup to register as a defeater?'*"

  ### 4. Language Acquisition: Justification vs. Inevitability
  "Anti-reductionists often argue that children must trust testimony to learn language, so trust is a basic faculty. But doesn't this conflate *psychological inevitability* with *epistemic justification*? Just because a child *cannot help* but believe her parents doesn't necessarily mean she *ought* to, or that the belief is warranted. How do you bridge that is-ought gap?"

  *   **Follow-up:** "She will likely argue that a faculty necessary for rationality must be presumed reliable. Ask: *'We also have innate cognitive biases that lead to errors, like optical illusions. Why is the 'testimony faculty' granted a presumption of truth while the 'visual faculty' is granted a presumption of fallibility?'*"

  ### 5. The Empirical Status of Reid's Principles
  "Reid posits a 'Principle of Veracity' (we are wired to speak truth) and a 'Principle of Credulity' (we are wired to believe). Are you defending these as a priori truths, or as empirical claims about human psychology? If they are empirical, doesn't establishing their truth require the very inductive evidence that reductionists demand?"

  *   **Follow-up:** "She will likely argue they are transcendental conditions for communication. Ask: *'If they are conditions for communication, does that mean a society of pathological liars is logically impossible, or just empirically unlikely?'*"

  ### 6. High-Stakes Testimony
  "Does the 'default right to believe' scale with stakes? If a stranger tells me the time, I believe them. If a stranger tells me a bridge is safe to cross, the cost of error is death. Does anti-reductionism require me to grant the stranger the same *prima facie* credibility in both cases, or does the stakes themselves act as an automatic defeater?"

  *   **Follow-up:** "She will likely say stakes raise the threshold for defeaters. Ask: *'If the stakes change the epistemic rules, isn't the 'default right' doing any work? Isn't the real heavy lifting being done by the context-sensitive stakes?'*"

  ### 7. Identifying Expertise
  "In modern science, we rely on expert testimony we cannot personally verify. To accept an expert's word, don't I first need independent reasons to identify them *as* an expert? If I need independent evidence to certify the source, haven't I already conceded the reductionist point that testimony itself isn't the primary source of justification?"

  *   **Follow-up:** "She will likely say we rely on social markers of expertise (degrees, titles). Ask: *'But aren't those social markers just further testimony? If I can't verify the testimony, how can I verify the markers without falling into a regress?'*"

  ### 8. The Internet and Anonymous Sources
  "Reid's model assumes a community of face-to-face interlocutors. On social media, testimony is often anonymous, algorithmic, and detached from accountability. Does the anti-reductionist 'default right' apply to a tweet from an anonymous account? If not, what is the philosophical difference between a stranger on the street and a stranger on X?"

  *   **Follow-up:** "She will likely argue anonymity acts as a defeater. Ask: *'If anonymity defeats the default right, doesn't that mean the right isn't based on 'testimony' per se, but on 'social accountability'? That seems like a significant revision to the Reid line.'*"

  ### 9. The Known Liar Case
  "Imagine a known pathological liar tells you something true, and you have no independent way to verify it. Reductionism says you shouldn't believe them (lack of positive evidence). Anti-reductionism suggests you might still have a *prima facie* right, absent a specific defeater for *this* claim. Do you really have to say the listener is irrational for believing the liar, or is the 'default right' severed by the speaker's history?"

  *   **Follow-up:** "She will likely say the history is a standing defeater. Ask: *'If a speaker's history creates a standing defeater, doesn't that mean we are constantly maintaining inductive files on everyone we speak to? How is that not a form of local reductionism?'*"

  ### 10. The Practical Upshot
  "Finally, for my readers who aren't epistemologists: if they adopt your anti-reductionist view, how does their engagement with news or science change next week? Does this philosophy encourage more trust in institutions, or does it provide a framework for knowing when that trust has been philosophically violated?"

  *   **Follow-up:** "She will likely say it encourages charity but demands vigilance on defeaters. Ask: *'In a polarized environment where everyone thinks *they* have the defeaters and the other side is gullible, does your framework give us a tool to resolve that dispute, or does it just entrench the stalemate?'*"
