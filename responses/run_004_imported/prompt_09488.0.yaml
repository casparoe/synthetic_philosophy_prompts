  6.  Conclusion: Vote Non Placet.

  7.  **Writing the content...** (incorporating the 1956 voice).
      *   *Voice:* Serious, philosophical, slightly archaic but clear.
      *   *Key terms:* *Non placet*, *Encaenia*, *Doctrine of Double Effect*, *innocents*, *means to an end*.

