answer: |-
  **TO THE MEMBERS OF CONGREGATION**
  **Re: The Proposed Conferment of the Degree of Doctor of Civil Law *honoris causa* upon Mr. Harry S. Truman**

  Fellow Members of Convocation,

  We stand on the eve of Encaenia, prepared to honour a man whose name is inextricably linked with the Allied victory in the late war. There is a natural impulse, born of gratitude for peace restored and tyranny vanquished, to nod assent to this decree. To do so would be comfortable. It would be consistent with the precedent of honouring statesmen who have navigated the perilous seas of total war. However, the pamphlet recently circulated by my colleague, Miss Elizabeth Anscombe, compels us to a more rigorous examination. She asks us not whether Mr. Truman was a successful leader, but whether the University of Oxford, by conferring this degree, becomes complicit in endorsing an act of murder.

  Miss Anscombe's argument rests not upon a calculation of consequences—a utilitarian ledger weighing Japanese lives against American or Allied lives—but upon the moral structure of the act itself. She invokes the traditional Doctrine of Double Effect. This doctrine permits the foreseen but unintended death of innocents as a side effect of a legitimate military action (such as destroying a munitions factory). It strictly forbids choosing the death of innocents *as a means* to an end, even a good end. Miss Anscombe contends that the atomic bombings were not cases of collateral damage. The destruction of the civilian populations of Hiroshima and Nagasaki was not merely foreseen; it was the very method chosen to procure surrender. The terror and the slaughter were the instrument of policy. If this description holds, the act is not one of war, but of mass murder, and no good consequence can cleanse it.

  Before we decide how to vote, we must weigh the strongest objection to Miss Anscombe's position. It is an objection that many of us, having lived through the blackout and the Blitz, will find instinctively compelling.

  The defender of Mr. Truman argues that Miss Anscombe's distinction between "intended" and "foreseen" collapses under the conditions of total war. In this view, the legitimate target in 1945 was not merely the Japanese army, but Japan's *capacity and will to continue fighting*. This will and capacity were not housed solely in barracks, but in the industrial and social fabric of the cities themselves. Therefore, the argument proceeds, the intention of the bombing was to destroy the war-making potential and the national resolve located in Hiroshima and Nagasaki. The deaths of the civilians, however tragic and massive, were a foreseen but unintended byproduct of obliterating that capacity, exactly as the deaths of German civilians in Dresden or Japanese civilians in the firebombing of Tokyo were foreseen but unintended. To condemn Mr. Truman on these grounds, the defender argues, is to condemn the entire strategic bombing campaign of the Allies, including the actions of our own government. If we deny Mr. Truman his degree, consistency demands we denounce Mr. Churchill and the Royal Air Force as well. To single out the atomic bomb is to be seduced by the novelty of the weapon rather than the morality of the act.

  This is a serious charge. It suggests that Miss Anscombe is applying a legalistic hair-splitting to a context where the distinction between combatant and non-combatant had already been erased by the enemy as well as by the necessities of modern industry.

  However, we must not let the familiarity of strategic bombing numb us to the specific nature of the atomic weapon. In conventional strategic bombing, however imprecise, the *aim* is the destruction of industrial nodes or transport links; the civilian death is a result of inaccuracy and the proximity of homes to factories. One can coherently say, "We would have spared the civilians if the factory could have been destroyed without them."

  With the atomic bomb, this coherence vanishes. The weapon's destructive radius is such that the city *is* the target. The mechanism of surrender sought was the shock of total urban annihilation. It is difficult to maintain that the civilians were merely "caught in the crossfire" when the crossfire was designed to encompass the entire urban footprint. The destruction of the civilian population was not an unfortunate side effect of hitting a military target; the civilian population *was* the medium through which the military pressure was applied. This returns us to Miss Anscombe's point: the killing was not merely foreseen; it was chosen as the means.

  If we accept the "redescription" argument—that killing civilians to break national will is always permissible provided we call it "destroying capacity"—we empty the Just War tradition of all content. We admit that there is no limit to what may be done to innocents if the cause is just enough. Oxford cannot affirm this principle. We are a community dedicated to the pursuit of truth and right reason, not merely to the celebration of power, however victorious.

  Therefore, I urge you to vote **Non Placet**.

  To vote against this degree is not to dishonour the victory over fascism, nor to deny the complexities Mr. Truman faced. It is to assert that there are moral boundaries which even the exigencies of war cannot dissolve. It is to declare that the University of Oxford will not lend its prestige to the normalization of the intentional slaughter of the innocent, regardless of the strategic utility claimed. We may acknowledge Mr. Truman's role in history without endorsing every act of his administration. Let us not let gratitude for the peace mute our obligation to the truth of justice.

  **A Member of Convocation**
  **May, 1956**
