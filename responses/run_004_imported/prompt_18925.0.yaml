  You have stumbled onto one of the subtlest and most interesting fault lines in non-cooperative game theory. Your intuition is spot-on: the divergence is indeed about **correlation**, and your hunch about **mixed strategies** is also correct (though it's a separate issue that compounds the confusion).

  The lecture notes you found are referencing a specific technical distinction that intro courses gloss over because it requires $N \ge 3$ players to manifest. Here is the unpacking you asked for, moving from the mechanics to the philosophy.

  ### 1. The Pure-vs-Mixed Wrinkle (The 2-Player Issue)

  Let's clear this up first, because it's a prerequisite for understanding the 3-player issue.

  When we say a strategy is "dominated," we ask: *Is there another strategy that yields a higher payoff no matter what the opponents do?*

  *   **Pure Dominance:** Can a *pure* strategy beat it everywhere?
  *   **Mixed Dominance:** Can a *probability mixture* of strategies beat it everywhere?

  **The Rule:** For Iterated Elimination of Dominated Strategies (IEDS) to match Rationalizability in **2-player games**, you **must** allow domination by **mixed strategies**.

  **Why?** Imagine a Rock-Paper-Scissors variant where you have a fourth option, "Magic." Magic loses to Rock, Paper, and Scissors individually. However, if you play a 1/3 mix of Rock/Paper/Scissors, you beat Magic on average.
  *   If IEDS only checks for *pure* dominance, "Magic" survives (because no single pure move beats it everywhere).
  *   If IEDS checks for *mixed* dominance, "Magic" is eliminated (because the 1/3 mix beats it).
  *   Rationalizability eliminates "Magic" because it is never a best response to any belief.

  **Verdict:** If your IEDS procedure only checks pure strategies against pure strategies, it is too weak, even in 2-player games. You must allow mixed strategies to dominate.

  ### 2. The 3-Player Divergence (The Correlation Issue)

  Now to the meat of your question. Assume we are doing IEDS correctly (allowing mixed dominance). In 2-player games, IEDS and Rationalizability yield the exact same set of surviving strategies. In 3-player games, they can diverge.

  **The Short Answer:**
  Standard IEDS is actually equivalent to **Correlated Rationalizability**. The "gap" your notes mention arises when comparing IEDS to **Independent Rationalizability**.

  **The Mechanism:**
  In a 3-player game, Player 1 forms a belief about what Player 2 and Player 3 will do. This belief is a probability distribution over the pair of strategies $(s_2, s_3)$.

  1.  **IEDS (and Correlated Rationalizability):** Player 1 is allowed to believe that Player 2 and Player 3's choices are **correlated**. Player 1 can think, "I believe there is a 50% chance they play $(A, X)$ and a 50% chance they play $(B, Y)$," even if there is no explicit communication between 2 and 3.
  2.  **Independent Rationalizability:** Player 1 must believe that Player 2 and Player 3 choose **independently**. Player 1's belief must be a *product distribution*: $P(s_2, s_3) = P(s_2) \times P(s_3)$.

  **Why the Gap Opens:**
  The set of independent distributions is a curved surface (a manifold) sitting inside the larger simplex of all possible (correlated) distributions.
  *   A strategy survives IEDS if it is a best response to *some* belief in the big simplex.
  *   A strategy survives Independent Rationalizability only if it is a best response to *some* belief on the independent surface.

  Because the independent surface is smaller, there are fewer best responses. Therefore, **Independent Rationalizability eliminates *more* strategies than IEDS.**

  **The Sketch of a 3-Player Example:**
  Imagine Player 1 wants to "match" the coordination of Players 2 and 3.
  *   **Player 1:** Chooses $In$ or $Out$.
  *   **Players 2 & 3:** Each choose $A$ or $B$.
  *   **Payoffs:**
      *   Player 1 gets 10 points if $In$ and $(P2, P3)$ play $(A,A)$ or $(B,B)$.
      *   Player 1 gets 0 points if $In$ and $(P2, P3)$ play $(A,B)$ or $(B,A)$.
      *   Player 1 gets 6 points if $Out$ (regardless of what 2 & 3 do).
      *   (Assume Players 2 & 3 have their own game where all strategies $\{A,B\}$ are rationalizable, perhaps a coordination game or even zero-payoffs).

  **Analysis:**
  *   **Correlated Belief:** Player 1 believes 2 and 3 will perfectly coordinate on $(A,A)$ or $(B,B)$ with 50% probability each.
      *   Expected Payoff($In$) = $0.5(10) + 0.5(10) = 10$.
      *   Expected Payoff($Out$) = 6.
      *   **Result:** $In$ is a Best Response. It survives IEDS.
  *   **Independent Belief:** Player 1 must believe 2 and 3 choose independently. Suppose the "most optimistic" independent belief is that 2 plays $A$ with prob $p$ and 3 plays $A$ with prob $q$.
      *   Probability of Match = $pq + (1-p)(1-q)$.
      *   Mathematically, if 2 and 3 are forced to mix (say, $p=0.5, q=0.5$ due to their own game incentives), the Probability of Match is $0.5$.
      *   Expected Payoff($In$) = $0.5(10) = 5$.
      *   Expected Payoff($Out$) = 6.
      *   **Result:** $Out$ dominates $In$. $In$ is eliminated.

  In this scenario, **$In$ survives IEDS** (because correlation is allowed in the dominance check) **but fails Independent Rationalizability** (because no independent belief makes it optimal). Your lecture notes were referring to this specific gap.

  ### 3. Are Pure/Mixed and Correlation the Same Wrinkle?

  They are distinct but related "dimensions" of relaxation.

  1.  **Pure vs. Mixed (My Strategies):** This asks, "Am I allowed to randomize *my own* action to beat you?" Allowing this makes the set of dominating strategies larger, eliminating more of *my* bad strategies.
  2.  **Independent vs. Correlated (Your Strategies):** This asks, "Am I allowed to believe *you and the other opponent* are correlating your actions?" Allowing this makes the set of *my* best responses larger, saving more of *my* strategies from elimination.

  They bite in different directions. Mixed dominance helps **eliminate** strategies (makes IEDS stricter). Correlated beliefs help **save** strategies (makes Rationalizability more permissive).

  ### 4. The Philosophy: Which One is "Correct"?

  This is the million-dollar question. You asked: *Does the disagreement expose something shaky about what common knowledge of rationality (CKR) can actually buy you?*

  **Yes, it does.**

  The divergence exposes that **Common Knowledge of Rationality does not imply Independent Beliefs.**

  *   **The Case for Correlated Rationalizability (Bernheim/Pearce):** This is the "purest" formalization of CKR. If I am rational, and I know you are rational, nothing in that logic forbids me from believing you and a third player might correlate. Perhaps you share a culture, a focal point, or a common prior that induces correlation (as in Harsanyi's doctrine). If we define "Rationalizable" as "consistent with CKR," then **Correlated Rationalizability** is the correct definition. Standard IEDS actually maps to this.
  *   **The Case for Independent Rationalizability:** This adds an extra assumption: **Independence of Beliefs.** It says, "Not only are we rational, but we also cannot believe our opponents' actions are correlated unless there is an explicit correlation device." This is a stronger assumption than CKR alone.

  **The Verdict:**
  Most modern game theorists regard **Correlated Rationalizability** (and thus standard IEDS with mixed strategies) as the robust baseline for "what rationality implies."

  The fact that Independent Rationalizability yields a smaller set of strategies isn't because it's "more rational"; it's because it assumes **more information** (specifically, the absence of correlation).

  **The "Shaky" Part:**
  The divergence shows that in $N \ge 3$ games, **CKR is not enough to pin down behavior.** In 2-player games, CKR + Rationality is very powerful (IEDS = Rationalizability = Nash in many cases). In 3+ player games, CKR leaves a "gap" of indeterminacy. Whether that gap is closed depends on whether you are willing to assume opponents' beliefs are independent.

  So, your lecture notes weren't mangled; they were highlighting that once you have three minds in the room, "Rationality" alone doesn't tell you if you should treat the other two as a coordinated bloc or as independent agents. That is a structural feature of multi-party strategic reasoning, not a bug in the math.

  ### Summary Checklist for Your Hackathon Bots

  1.  **Dominance Check:** Ensure your bot checks if a strategy is dominated by a **mixed strategy**, not just pure ones. (Crucial for 2-player equivalence).
  2.  **Belief Model:** If you want your bot to be "conservatively rational" (eliminate anything that *could* be irrational), assume **Correlated Beliefs** (Standard IEDS). If you want your bot to be "aggressively predictive" (assume opponents won't coordinate without a device), assume **Independent Beliefs**.
  3.  **The Takeaway:** In 3+ player auctions or markets, assuming your competitors act independently is a *strategic assumption*, not a logical necessity of rationality. If they correlate (even tacitly), a bot assuming independence might eliminate strategies that are actually profitable.
