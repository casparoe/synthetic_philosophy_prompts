answer: |-
  This is a fantastic question, and your grasp of the basic analogy is spot-on. Your friend with the PhD wasn't just being contrarian; they were pointing out the single most important methodological checkpoint in evolutionary biology.

  To answer your core question: **The Gould and Lewontin critique carries immense weight, but it is not a "game over" card for evolutionary psychology.** It is more like a "burden of proof" card.

  The critique is from 1979, so yes, it is "old." However, in science, a good methodological critique doesn't expire. It becomes part of the standard operating procedure. Serious academic evolutionary psychologists know about the Spandrels paper intimately; it is required reading in grad programs. The problem is that **popular science books often skip the rigor required to answer the critique.** They sell the story, not the uncertainty.

  Here is a breakdown of how much weight the critique should carry, followed by a specific toolkit of questions you can use in your book club to evaluate claims without just shouting "Spandrel!" at everything.

  ### 1. How much weight should the critique carry?

  Think of the Spandrels critique as the **scientific immune system** against lazy thinking.

  *   **It didn't kill Adaptationism:** Gould and Lewontin never argued that adaptations *don't* exist. Natural selection is real and powerful. They argued that biologists were too eager to assume *every* trait is an adaptation without testing alternatives.
  *   **It shifted the Burden of Proof:** Before 1979, the default assumption was often "This trait exists, so it must be useful." After 1979, the default became "This trait exists; prove it was selected for, and rule out that it's a byproduct."
  *   **The Pop-Science Gap:** This is where your book club comes in. Academic papers usually have to address the Spandrels critique in the "Discussion" section (e.g., "We acknowledge this could be a byproduct of brain size..."). Pop books rarely do. They present the "Just-So Story" (a term Rudyard Kipling coined, which Gould borrowed) as fact because it makes for a better chapter title.

  **Verdict:** The critique is still vital. When reading pop EvoPsych, you should assume the author has *not* adequately ruled out spandrels unless they explicitly show they have.

  ### 2. The Toolkit: 5 Questions to Ask Instead of "Is it a Spandrel?"

  Simply labeling something a spandrel isn't an argument; it's just offering an alternative hypothesis. To be a sophisticated critic, you need to know *why* a specific claim might be a spandrel versus an adaptation.

  Here are five questions to ask when a chapter claims **"Trait X is an adaptation for Function Y."**

  #### Q1: Is there "Design Specificity"?
  Adaptations usually look engineered for their specific job.
  *   **The Test:** Does the trait have complex mechanisms that specifically solve the problem, or is it a generic feature?
  *   **Example:** The eye has a lens, retina, and iris specifically for seeing. That is high design specificity.
  *   **Application:** If the book claims "Men's preference for the color blue is an adaptation for hunting," ask: Is there a specific neural mechanism for blue-detection linked to hunting, or is it just a general byproduct of how our cones work? If the mechanism is generic, it's likely a spandrel.
  *   **The Chin:** Humans are the only primates with chins. EvoPsychists have tried to claim it's for chewing or sexual selection. Skeptics say it's likely just a structural byproduct of our jaw shrinking while our teeth stayed big (a developmental constraint). There is no "chin muscle" or specific bone density suggesting it was built *for* something.

  #### Q2: Did the author engage in "Reverse Engineering"?
  This is the heart of the "Just-So Story" problem.
  *   **The Test:** Did the author start with the trait and invent a reason, or start with an ancestral problem and find the solution?
  *   **Bad Sign:** "Humans like listening to music. Why? Because it bonded tribes." (This is reverse engineering: Trait $\rightarrow$ Story).
  *   **Good Sign:** "Ancestral tribes needed cohesion to survive. What mechanisms evolve for cohesion? Rhythm and synchronization are seen in other social animals. Therefore, we predict music capacity evolved..." (This is Hypothesis $\rightarrow$ Prediction $\rightarrow$ Test).
  *   **Why it matters:** You can invent a survival story for *anything*. You can say big ears are for hearing predators, or for cooling the blood, or for attracting mates. Without a prediction made *before* looking at the trait, it's storytelling.

  #### Q3: Is there Comparative Evidence?
  Evolution leaves a paper trail in other species.
  *   **The Test:** Do our close relatives (chimps, bonobos) have this trait?
  *   **Application:** If the book claims "Jealousy is a human adaptation for monogamy," but chimps (who are not monogamous) show physiological stress responses to mate-guarding situations, then the root of the emotion is likely much older than human mating strategies. It might be a general mammalian trait (phylogenetic history) that humans just co-opted.
  *   **The Spandrel Angle:** If the trait is universal across primates but the *explanation* is unique to humans, the explanation is probably wrong.

  #### Q4: What is the "Cost" of the Trait?
  Natural selection is stingy. It doesn't build expensive things unless they pay off.
  *   **The Test:** Is the trait metabolically or physically expensive to maintain?
  *   **Application:** The human brain is 2% of body weight but uses 20% of our energy. That is an *expensive* trait. It demands a strong adaptationist explanation because it's a huge survival cost.
  *   **Counter-Example:** If the book claims "Liking vanilla ice cream is an adaptation," ask: What is the cost of liking vanilla? Almost zero. If there is no cost, natural selection doesn't need to "build" it. It could easily be a neutral byproduct of how our sweet-tooth receptors fire. Low-cost traits are often spandrels or noise.

  #### Q5: Have they ruled out "Exaptation"?
  This is the nuanced follow-up to the Spandrel critique.
  *   **The Concept:** A trait might *not* have evolved for its current use, but was later co-opted for it. Gould called this **Exaptation**.
  *   **Example:** Feathers likely evolved for warmth or display (dinosaurs), not flight. Later, birds used them for flight. The flight capability is an exaptation, not the original adaptation.
  *   **Application:** If the book says "Language is an adaptation for sharing hunting tips," ask: Could language be a byproduct of general brain complexity (a spandrel) that was *later* used for hunting tips (exaptation)?
  *   **Why ask this:** It forces the author to prove the trait originated *for* the current use, not just that it is *useful* now. Everything is useful now; that doesn't mean it was selected for that purpose.

  ### 3. How to bring this to the Book Club

  You don't want to be the person who kills the vibe by saying "Actually, scientifically..." Here is how to phrase these critiques constructively:

  *   **Instead of:** "That's just a Just-So story."
  *   **Try:** "That's a fascinating story. I'm curious, though—how would we test if that's the *cause* versus just a nice side effect? Is there a way to tell if this trait was built for that purpose, or if we just use it for that purpose now?"

  *   **Instead of:** "My friend said this is all spandrels."
  *   **Try:** "I was reading about the 'Spandrels' critique, which suggests some traits are just architectural byproducts of other changes, like how our chins might just be a result of our jaws shrinking. Do you think this behavior could be a byproduct of something else, like general intelligence, rather than a specific module?"

  *   **Instead of:** "Evolutionary psychology is fake."
  *   **Try:** "It seems like the burden of proof is really high to prove something is an adaptation. Does the book address alternative explanations, like cultural drift or developmental constraints?"

  ### Summary

  Your friend was right to be heated, but the field hasn't collapsed. The Gould-Lewontin critique is the **quality control filter** that pop books often leave out.

  When you read a claim:
  1.  **Check the Cost:** Is it expensive enough to need an explanation?
  2.  **Check the Specificity:** Does it look engineered or accidental?
  3.  **Check the History:** Do other animals have it?
  4.  **Check the Direction:** Did they predict it, or explain it after the fact?

  If a pop book can't answer those, you are well within your rights to treat the chapter as "interesting speculation" rather than "established science." That is exactly what Gould and Lewontin wanted readers to do.
