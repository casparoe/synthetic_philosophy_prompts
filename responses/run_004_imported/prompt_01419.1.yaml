answer: |-
  This is a profound and timely question. You have put your finger on the exact tension that makes Dummett's *On Immigration and Refugees* such a difficult but necessary text. It is rare to find a philosopher of his stature engaging so directly with policy, and rarer still to find one who attempts to carve out a principled exception to his own moral absolutism.

  To answer your question, we have to look at Dummett not just as a political campaigner, but through the lens of his broader philosophical commitments—specifically his philosophy of language and his moral theology.

  Here is how I believe Dummett would analyze the post-2015 landscape, and an assessment of whether his distinction holds water.

  ### 1. Vindication or Alarm?
  If Michael Dummett were alive today, looking at the rhetoric surrounding Brexit, the 2015 refugee crisis, and the rise of "great replacement" theories, I am confident he would be **profoundly alarmed**, not vindicated.

  There are three specific reasons for this, rooted in his thought:

  **A. The Philosophy of Language: Meaning is Use**
  Dummett was one of the 20th century's leading philosophers of language (largely through his interpretation of Frege and Wittgenstein). A core tenet of his view was that you cannot separate the meaning of a word from its use in social practice.
  While he theoretically allowed for a non-racist "submersion" argument, he knew that in the actual social practice of British and European politics, the *use* of submersion rhetoric is almost invariably a code for racial or cultural anxiety.
  If a politician today says, "We are being submerged," Dummett would argue that the *meaning* of that sentence is determined by its effect and its context. Since the effect is to mobilize racial anxiety and the context is a history of racism, the statement is racist *in use*, regardless of the speaker's theoretical caveat. He would likely view the adoption of his "exception" by right-wing populists not as a validation of his nuance, but as a corruption of his language. He would see it as proof that once you introduce a concept like "submersion" into the public square, it inevitably detaches from its ethical safeguards.

  **B. The Threshold of "Submersion"**
  Dummett's exception was predicated on the idea of an existential threat to the political community's continuity, not merely a demographic shift. In 2001, he argued that Britain was nowhere near this threshold.
  Looking at Europe today, while demographic changes are real, the political order has not collapsed. The "submersion" argument has been triggered at much lower thresholds than Dummett intended. He viewed the right to exclude as a "last resort" defense of a state's existence, not a tool for managing cultural change or welfare strain. He would likely argue that the current debates are happening in a zone of "discomfort," not "submersion," and therefore his exception still does not apply. He would see the lowering of that bar as a moral failure, not a vindication of his caution.

  **C. The Priority of the Vulnerable**
  Dummett's activism was driven by a form of Catholic social justice that prioritized the vulnerable over the comfortable. In *On Immigration and Refugees*, he explicitly frames the issue as one of justice toward the outsider, rather than comfort for the insider.
  His "submersion" clause was a concession to political realism (the idea that a state cannot function if it ceases to exist), not a moral good in itself. If he saw that his concession was being used to justify the suffering of refugees (as in the Mediterranean crossings or the Rwanda scheme), he would view it as a betrayal of the primary moral imperative. He would likely argue that the "alarm" of the host population is being privileged over the "danger" faced by the migrant, which inverts his ethical hierarchy.

  ### 2. Does the Distinction Hold Up?
  This is the harder philosophical question. Can we actually separate a legitimate worry about numbers from a racist one?

  **The Theoretical Viability**
  In the abstract, Dummett's distinction is logically sound. A room has a capacity; if you exceed it, the function of the room breaks down. This is not prejudice against the people entering; it is a fact about the room. Similarly, a state has infrastructure, housing, and social cohesion limits. Theoretically, one can argue for a cap based on capacity without implying racial superiority.

  **The Practical Collapse**
  However, Dummett was too honest a thinker to ignore how this functions in reality. The distinction fails as a *general test* for three reasons:

  1.  **The "Character" Problem:** Dummett tried to separate "submersion" from "cultural purity." But what constitutes "submersion"? Usually, it is defined by the loss of a dominant culture. Once you admit that preserving a "way of life" is a valid reason to limit numbers, you are inevitably making judgments about which cultures are compatible and which are not. This slides very quickly into the cultural racism Dummett despised.
  2.  **The Moving Goalpost:** History shows that "capacity" arguments are elastic. When migration was low, the argument was about jobs. When migrants took jobs, the argument became about wages. When wages held, it became about schools, then housing, then "social cohesion." Because the threshold for "too many" is never objectively fixed, it almost always reflects the prejudice of the observer rather than an objective limit.
  3.  **The Power Imbalance:** Dummett's distinction assumes a good-faith debate between equals. But immigration policy is made by the powerful against the powerless. In that context, a "neutral" numbers argument is almost always a weapon. The state has the power to define what "submersion" means, and it will inevitably define it in a way that protects the interests of the voting majority against the minority.

  **Context Dependence**
  You asked if this was only plausible in his specific moment. I think the answer is yes. In the Britain of the 1960s through 1990s, the racism was overt (Enoch Powell, "New Commonwealth" restrictions). Dummett's distinction was a tactical tool to isolate the racists: *"If you aren't arguing about submersion, you are arguing about race."*
  In the 2020s, the rhetoric has shifted. "Submersion" *is* the main argument. Because the rhetoric has moved to occupy the very ground Dummett tried to fence off, his distinction loses its diagnostic power. It no longer helps us separate the racists from the non-racists, because everyone claims to be worried about "numbers" and "integration."

  ### Conclusion
  If you were to resume that debate with your friends, I suspect Dummett would offer you this consolation: **The existence of a theoretical exception does not validate its practical application.**

  He would likely argue that while a state *might* have a right not to be submerged, the burden of proof is so incredibly high that it is almost never met in the modern world. He would warn that invoking the "submersion" right is like invoking the right to nuclear deterrence: perhaps theoretically justifiable in an extreme existential crisis, but dangerous to normalize in everyday policy.

  He would be alarmed that his "narrow exception" has become a broad highway for nativism. He would argue that the distinction between "numbers" and "racism" holds up in logic, but collapses in history. And given that politics is the realm of history, not pure logic, he would likely conclude that we are better off discarding the "submersion" argument entirely, rather than trying to police its boundaries.

  His legacy suggests that when in doubt, we should err on the side of the refugee, not the state. The "submersion" clause was his acknowledgement of human frailty, not his prescription for policy.
