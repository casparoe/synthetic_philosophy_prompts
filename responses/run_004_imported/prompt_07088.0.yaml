prompt: |-
  A friend and I spent a long evening arguing about Lewis's Principal Principle and never quite settled it. Her view was that because Lewis is a Humean about chance -- chances at a time supervene on the pattern of the entire history of the world, future included, via the best-system analysis -- almost any proposition about how things later turn out has some power to make a different chance distribution fit the total pattern better than the one we started with. That, she said, is why "historical evidence" cannot simply be assumed admissible in the Principal Principle, and it's the real content of what Lewis, in "Humean Supervenience Debugged," called the "big bad bug." I granted the bug but argued that the standard fix -- conditionalizing not on the bare claim that the chance of A is x, but on a full history-to-chance conditional together with the actual history up to t (the so-called New Principle) -- doesn't defeat the bug so much as define it away: once the conditionalized proposition already builds in the very history that was doing the undermining, deference comes out true almost by construction, and it's unclear what's left of the idea that credence tracks an independently characterized objective feature of the world. She thought that was too quick. Could you go through, more carefully than we managed, exactly how undermining is supposed to threaten the original Principal Principle, how the New Principle is meant to block it, and whether my "basically definitional" worry actually holds up?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** A debate between the user and a friend about David Lewis's Principal Principle (PP) and the "Big Bad Bug" (undermining futures).
      *   **Friend's View:** Lewis is a Humean (Best System Analysis - BSA). Chances supervene on the *entire* history (past, present, future). Therefore, future outcomes can change what the chances *are* (by changing the best system). This means historical evidence (about the future) isn't automatically admissible. This is the "Big Bad Bug."
      *   **User's View:** Agrees the bug exists. Argues the fix (the "New Principle" or NP) is circular/definitional. By conditionalizing on a history-to-chance conditional + actual history, you build the undermining history into the premise. Deference becomes true by construction, losing the connection to an *independent* objective feature.
      *   **Task:** Explain carefully:
          1.  How undermining threatens the original PP.
          2.  How the New Principle (NP) blocks it.
          3.  Evaluate the user's "basically definitional" worry (does it hold up?).

  2.  **Part 1: The Original Principal Principle (PP) and the Threat of Undermining:**

      *   *What is PP?* $C(A | E \land Ch_t(A) = x) = x$. (Credence in A, given evidence E and that chance of A is x, should be x). $E$ must be "admissible."
      *   *What is Admissibility?* Roughly, evidence that doesn't give "inadmissible" info about the truth of A other than via the chance. Past history is usually admissible. Future history is not.
      *   *What is Humean Supervenience (HS)?* Chances are summaries of the Humean Mosaic (the total distribution of qualitative properties in spacetime). The "Best System" balances simplicity, strength, and fit.
      *   *The Conflict (The Bug):*
          *   Let $T$ be the theory of chance (the Best System).
          *   Let $H_t$ be the history up to time $t$.
          *   Let $F$ be a future history (an "undermining future").
          *   If $F$ occurs, the total history $H_t + F$ might make a *different* theory $T'$ the Best System.
          *   So, if $Ch_t(A) = x$ is true (based on $T$), but $F$ makes $T'$ true (where $Ch'_t(A) \neq x$), then $F$ is incompatible with $Ch_t(A) = x$.
          *   *Problem:* $H_t$ is supposed to be admissible. But $H_t$ implies nothing about $F$. However, $Ch_t(A)=x$ implies $\neg F$ (because if $F$ happens, the chance wouldn't have been $x$).
          *   *Result:* $C(F | Ch_t(A)=x) = 0$. But if chances are non-zero, $C(F)$ should be $> 0$.
          *   *Violation:* PP says $C(F | Ch_t(F) = y \land E) = y$. But if $E$ includes $Ch_t(A)=x$ (which implies $\neg F$), then credence in $F$ is 0, not $y$.
          *   *Simpler phrasing:* Knowing the current chance function tells you something about the future (it tells you the future won't be one that changes the chance function). This makes the chance proposition *inadmissible* evidence about the future, violating the spirit of PP which assumes chance propositions are admissible (or that history is admissible).

  3.  **Part 2: The New Principle (NP):**

      *   *Lewis's Fix:* We can't conditionalize on $Ch_t(A) = x$ alone because that proposition carries hidden info about the future (that the future isn't undermining).
      *   *The Solution:* Conditionalize on the *conditional* chance.
      *   *Formula:* $C(A | H_t \land T) = Ch_T(A | H_t)$. Or more commonly: $C(A | H_t \land \text{Chance function is } T) = T(A | H_t)$.
      *   *Refinement (Hall/Thau):* $C(A | H_t \land \langle Ch_t(A) = x \rangle_{H_t}) = x$.
      *   *Key Move:* Instead of "The chance is $x$," we use "The chance *given the actual history* is $x$."
      *   *Why it works:* It explicitly acknowledges that the chance assignment depends on the history. It blocks the inference from "Chance is $x$" to "Future isn't undermining" because the proposition is now "If history is $H$, chance is $x$." It separates the *theory* of chance from the *application* to the specific mosaic.

  4.  **Part 3: Evaluating the User's Worry ("Definitional/Circular"):**

      *   *The Worry:* The NP builds the history into the chance claim. So of course credence matches chance. It feels like $C(A | A) = 1$. It loses the "objective feature" tracking.
      *   *Analysis:*
          *   Is it trivial? No. The chance function $T$ is still determined by the *global* mosaic (including the future). The NP tells us how to align credence with a theory $T$ *given* a partial history $H_t$.
          *   Does it save Objectivity? The "objective feature" is the Best System relation between the *whole* mosaic and the probability function. The NP acknowledges that we (at time $t$) don't know the whole mosaic.
          *   *The "Independent Characterization" point:* The user worries chance isn't independent anymore.
          *   *Counter-argument:* Chance *isn't* independent of history in Humeanism. That's the point of HS. The NP respects the metaphysics. The original PP assumed a metaphysics (chances are independent propensities) that HS contradicts. The NP aligns epistemology with the specific metaphysics of HS.
          *   *Is it "defining away" the problem?* In a way, yes. It redefines the bridge principle to fit the metaphysics. But that's philosophical progress, not cheating. It clarifies that PP was too strong for Humeans.
          *   *Who is right?* The friend is right that the Bug is real and serious. The user is partially right that the NP feels like a patch, but wrong that it renders the principle vacuous. It preserves the *normative* force (you should still defer to the Best System) without the *metaphysical* contradiction.
          *   *Nuance:* The NP shifts the focus from "Chance of A" to "Chance of A given H". This is a substantive change in the norm. It's not $C(A|A)=1$; it's $C(A | \text{Theory } T \text{ & History } H) = T(A|H)$. $T$ is still an objective summary of the *whole* world.

  5.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the depth of the debate. It's a classic problem in metaphysics/epistemology.
      *   *Section 1: The Setup (HS and PP).* Define Humean Supervenience (BSA) and the Original Principal Principle.
      *   *Section 2: The Big Bad Bug (Undermining).* Walk through the logic step-by-step.
          *   Chance depends on total history.
          *   Future history can change the Best System.
          *   Therefore, asserting "Current Chance is X" implies "Future is not Undermining."
          *   This makes "Current Chance is X" inadmissible evidence about the future.
          *   PP breaks because it requires admissibility.
      *   *Section 3: The New Principle (NP).* Explain the fix.
          *   Shift from unconditional chance to conditional chance.
          *   $C(A | H_t \land T) = Ch_T(A | H_t)$.
          *   Explain why this avoids the contradiction (we aren't asserting the chance *simpliciter*, but the chance *given what we know*).
      *   *Section 4: Evaluating the User's Worry.*
          *   Validate the intuition: It does feel like a retreat.
          *   Refute the "vacuity" claim: It's not $C(A|A)$. The Theory $T$ is still independent of our *current* knowledge (it depends on the future).
          *   Metaphysical Honesty: The NP admits that for Humeans, chance isn't a "guide" independent of the outcome; it's a summary *of* the outcome. The NP preserves the norm of rationality (defer to the summary) without lying about the metaphysics.
          *   Conclusion on who won: Friend was right about the Bug's severity. User was right to be suspicious of the "fix," but wrong to call it vacuous. It's a necessary revision of the norm to fit the metaphysics.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I explain *why* history is usually admissible? Yes, because it doesn't predict the future *except* via chances. But with HS, the chance proposition *itself* predicts the future (no undermining).
      *   *Check:* Is the NP formula clear? Use the Hall/Thau version or Lewis's later version. Lewis's "History-to-Chance Conditional" is the key.
      *   *Check:* Address the "independent feature" worry carefully. For a Humean, there *are* no independent modal features. The user's worry presupposes a non-Humean view of chance. I need to point this out gently. The NP saves the *practice* of deferring to science, even if the *metaphysics* is deflationary.

  7.  **Final Polish:** Ensure tone is respectful and analytical. Use clear headings. (Proceed to generate output based on this structure.)
answer: |-
  This is a superb disagreement to have. It cuts to the heart of the tension between Humean metaphysics and rational epistemology. You and your friend have both put your fingers on genuine nerves in the literature: your friend on the metaphysical severity of the "Bug," and you on the philosophical cost of the "fix."

  Here is a careful breakdown of the undermining problem, the New Principle solution, and an evaluation of your worry that the solution is merely definitional.

  ### 1. The Setup: Humean Supervenience and the Principal Principle

  To see where the collision happens, we need to be precise about the two commitments Lewis wanted to hold simultaneously.

  **Humean Supervenience (HS) / Best System Analysis (BSA):**
  For Lewis, chances are not primitive propensities floating above the world. They are summaries of the "Humean Mosaic" (the total distribution of qualitative properties in spacetime). The chance function is whatever probabilistic system best balances **simplicity**, **strength**, and **fit** with the *entire* history of the world (past, present, and future).
  *   *Crucial Implication:* What the chances *are* at time $t$ depends on how things turn out *after* $t$.

  **The Original Principal Principle (PP):**
  This is a norm of rationality. It says your credence ($C$) should defer to objective chance ($Ch$).
  $$C(A \mid E \land Ch_t(A) = x) = x$$
  *Constraint:* $E$ must be **admissible** evidence. Roughly, $E$ is admissible if it gives you no information about the truth of $A$ other than what is provided by the chance claim itself. Standardly, **history up to $t$ ($H_t$) is assumed to be admissible.**

  ### 2. The Big Bad Bug: How Undermining Threatens PP

  Your friend is correct: The Bug arises because HS makes the chance function sensitive to the future, while PP assumes the chance function is a safe guide to the future.

  Here is the step-by-step logic of the threat:

  1.  **Undermining Futures Exist:** Because chances supervene on the *total* history, there are possible future histories ($F$) that, if they were to occur, would make a *different* chance function ($T'$) the "Best System" than the one currently in place ($T$).
  2.  **Incompatibility:** If $T$ is the actual chance function now, then an undermining future $F$ (which would make $T'$ the best system) cannot occur. If $F$ occurred, $T$ would not have been the chance function. Thus, the proposition $Ch_t(A) = x$ (which asserts $T$ is the chance function) logically entails $\neg F$.
  3.  **The Admissibility Failure:** PP requires that we can conditionalize on $Ch_t(A) = x$ alongside admissible evidence (like past history $H_t$). But we just saw that $Ch_t(A) = x$ entails facts about the future (specifically, that the future is *not* $F$).
  4.  **The Contradiction:**
      *   According to PP, if I know $Ch_t(F) = y$ (where $y > 0$), my credence in $F$ should be $y$.
      *   But if I also know $Ch_t(A) = x$ (under theory $T$), I know that $F$ is impossible (because $F$ undermines $T$). So my credence in $F$ should be 0.
      *   I cannot have credence $y$ and credence $0$ in $F$ simultaneously.

  **The Conclusion:** Under HS, propositions about current chances are **not admissible**. They carry "inadmissible" information about the future (namely, that the future won't be one that changes the chances). Since PP requires admissibility, PP is false for Humeans.

  ### 3. The New Principle (NP): Blocking the Bug

  Lewis (and later Hall and Thau) proposed the **New Principle** to save the spirit of deference without the metaphysical contradiction.

  **The Fix:**
  We stop conditionalizing on the bare claim "The chance of $A$ is $x$." Instead, we conditionalize on a **history-to-chance conditional**. We acknowledge that the chance function is tied to the total history.

  **The Formula:**
  $$C(A \mid H_t \land T) = Ch_T(A \mid H_t)$$
  *   $H_t$: The actual history up to time $t$.
  *   $T$: The theory of chance (the probabilistic laws).
  *   $Ch_T(A \mid H_t)$: The probability $T$ assigns to $A$, *conditional on* the history $H_t$ obtaining.

  **Why it Blocks the Bug:**
  The original PP tried to say: "Given the chance is $x$, believe $x$." The problem was that "The chance is $x$" secretly meant "The chance is $x$ *and* the future isn't undermining."

  The NP says: "Given the theory is $T$ and the history so far is $H_t$, believe what $T$ says about $A$ given $H_t$."
  *   This does not assert that $T$ is the *actual* best system of the *whole* world. It only asserts that $T$ is the theory we are deferring to.
  *   It allows that the future *might* be undermining. If the future *is* undermining, then $T$ wasn't the true chance function of the whole world, but the NP doesn't care. The NP tells you how to align your credence with a theory $T$ *given your current historical information*.
  *   It breaks the link between "Chance is $x$" and "Future is not $F$." We are no longer asserting the chance *simpliciter*, only the chance *conditional on the history we know*.

  ### 4. Evaluating Your Worry: Is the NP "Definitional"?

  You argued that the NP "defines away" the bug by building the history into the chance claim, making deference true by construction and losing the connection to an "independently characterized objective feature."

  This is a sophisticated objection. Here is the verdict on who is right.

  **Where you are right:**
  You are correct that the NP represents a retreat from the original ambition of the PP.
  1.  **Loss of Independence:** The original PP treated Chance as a guide that stands *apart* from the evidence. It was a "magic pointer" to truth. The NP admits that for a Humean, Chance is just a summary *of* the evidence (the total mosaic). The NP essentially says: "Conditionalize on the theory that best summarizes the world, including the future you don't know yet."
  2.  **Circularity Risk:** It feels tautological. "If the theory says $x$ given history $H$, believe $x$." One might ask: Why should I care what theory $T$ says? The normative force ("You *ought* to defer") seems to rely on the idea that $T$ tracks something real. If $T$ is just a summary of the mosaic, and the mosaic includes the future I'm trying to predict, am I not just chasing my tail?

  **Where your worry might be too strong (and why the Friend wins on the metaphysics):**
  Your worry presupposes that for the principle to be non-trivial, Chance must be a **non-Humean** feature (e.g., a propensity).
  1.  **Metaphysical Honesty:** If Lewis is right about HS, there *are* no independent modal features. Chances *just are* summaries of the mosaic. If the PP requires chances to be independent of the future to work, then **the PP is incompatible with HS.** The NP isn't "cheating"; it is the necessary adjustment of epistemology to match the metaphysics. It saves the *practice* of scientific inference (deferring to probabilistic laws) even if it abandons the *metaphysics* of robust chance.
  2.  **Not Vacuous:** The NP is not $C(A \mid A) = 1$. The theory $T$ is not identical to the history $H_t$. $T$ is a global summary. The NP tells you how to use a global summary when you only have local access. That is a substantive epistemic norm. It tells you: "Even though you don't know the future, treat the Best System *as if* it applies, conditional on what you know."
  3.  **The "Bug" Remains Real:** Your friend was right that the Bug is the "real content." The Bug proves that **Humean Chance cannot guide credence in the way we originally hoped.** The NP is an admission of defeat regarding the original PP. It concedes that we cannot defer to "The Chance" (because that implies knowledge of the future); we can only defer to "The Theory conditional on History."

  ### The Verdict

  **Your Friend wins on the Metaphysics:**
  She is correct that the Bug is fatal to the original Principal Principle under Humean Supervenience. The original PP assumes chances are admissible evidence; HS proves they are not. The "fix" is not a minor tweak; it is a fundamental revision of how chance relates to credence.

  **You win on the Philosophical Cost:**
  You are correct that the NP feels like it "defines away" the problem. It does so by lowering the bar. It preserves the *norm* of deference but strips it of the idea that we are tracking an objective feature that is independent of the outcome. The NP saves Humeanism from inconsistency, but only by admitting that "Chance" is not the robust, action-guiding beacon the Original Principal Principle assumed it was.

  **Synthesis:**
  The debate shouldn't end with "Who is right?" but with this conclusion: **The Big Bad Bug shows that Humeans cannot have their cake and eat it too.** They cannot have a metaphysics where chances supervene on the future *and* an epistemology where chances guide credence about the future in the standard way. The New Principle is the price Humeans pay to keep their metaphysics. It is not vacuous, but it is deflationary. It saves the mathematics of probability from contradiction, but it concedes that "objective chance" is less of a guide to the future than we intuitively thought.

  You were right to feel uneasy; that unease is the philosophical residue of the Bug. But your friend was right that the NP is the only way to keep the Humean system from collapsing into contradiction.
