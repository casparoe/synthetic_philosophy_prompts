      *   *Compatibility:* Molina is a compatibilist regarding *foreknowledge* and *freedom*, but an incompatibilist regarding *causal determinism* and *freedom*. He insists the prediction doesn't cause the act.

  3.  **Analyze Newcomb's Problem:**
      *   *Setup:* Two boxes (A: transparent, \$1k; B: opaque, \$0 or \$1M). Omega predicts choice. If predicts 1-box, puts \$1M in B. If predicts 2-box, leaves B empty. Prediction happens *before* choice. Omega is infallible (or near-infallible).
