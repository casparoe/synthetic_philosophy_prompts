  8.  *(Final thought on the Verdict)*: I will argue that **Backward Induction survives only by sacrificing the intuitive link between rationality and actual choice behavior.** If we demand that rationality explains *actual* choices in a dynamic context, CKR is incoherent. Therefore, the normative claim of BI is hollow. This aligns with the Pettit/Sugden line but uses the epistemic machinery of Stalnaker to show *why* it breaks.

