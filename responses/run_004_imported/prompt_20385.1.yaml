      *   **Section 2: The Self-Undermining Critique.** Pettit, Sugden, Reny. The problem of "reached by irrationality." If I'm at node 2, Player 1 must have been irrational. Why trust BI now?
      *   **Section 3: The Epistemic Rescues.** Stalnaker (belief revision), Samet (hypothetical knowledge). Analyze why they try to save BI.
      *   **Section 4: The Verdict (The Argument).** Why the rescues fail. The tension between *ex-ante* knowledge and *interim* belief revision. If CKR is common *knowledge*, a deviation is impossible. If a deviation occurs, CKR is false. You can't have it both ways. Therefore, BI relies on an incoherent epistemic state.
      *   **Conclusion:** Summarize. Implications for epistemic game theory (move to common *belief* or weaker solution concepts).

