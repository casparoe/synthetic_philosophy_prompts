  **Nyaya:** Take the standard case: a man knows a cow, is told "a *gavaya* is like a cow," and later identifies a *gavaya* in the forest.

  **Buddhist:** He identifies it through inference grounded in the memory of that instruction.

  **Nyaya:** Inference requires a established pervasion between reason and conclusion. What universal rule was established in the village?

  **Buddhist:** The rule is conditional: if a thing bears this specific resemblance, it bears that specific name.

  **Nyaya:** That is not a universal pervasion of properties, it is a mere stipulation of language.

  **Buddhist:** All linguistic connection is stipulation. He perceives the resemblance, recalls the stipulation, infers the name.

  **Nyaya:** If it were mere perception of resemblance, he could name it without the prior instruction.

  **Buddhist:** He needs the instruction to form the major premise, but the knowledge arises in the moment of inference.

  **Nyaya:** The knowledge arises from the grasp of the similarity itself, not from a syllogism.

  **Buddhist:** Conceptualization is inference. Perception is free of constructs.

  **Nyaya:** Then you must also reduce testimony to inference, since words are constructs.

  **Buddhist:** I do. Valid testimony is simply inference based on the speaker's reliability.

  **Nyaya:** If testimony is inference, how does a child learn language? They cannot infer the reliability of every speaker.

  **Buddhist:** They infer from success. If the word leads to the object, the connection holds.

  **Nyaya:** But in the *gavaya* case, the object is unknown. The success cannot be verified until the identification is made.

  **Buddhist:** The identification is the conclusion of the inference, verified by immediate perception.

  **Nyaya:** You confuse the validation of knowledge with the source of knowledge.

  **Buddhist:** I distinguish the source to avoid multiplying entities beyond necessity.

  **Nyaya:** You fracture a single cognitive event into three processes merely to save your doctrine of two means.

  **Buddhist:** I shave away the handles to leave only the blade.
