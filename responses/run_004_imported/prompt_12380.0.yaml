  *(Refining the Ending)*: The prompt asks to end with the disagreement narrowed to its sharpest point. The sharpest point is usually: Is the capacity for moral agency the *only* thing that grants inviolability, or is sentience sufficient for *some* inviolability? I will aim for that.

