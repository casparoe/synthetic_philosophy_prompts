answer: |-
  This is a fantastic question, and honestly, you have hit on the exact fault line that divides Traditional Just War Theory (Walzer) from Revisionist Just War Theory (McMahan). Your confusion is well-placed because this *is* the central tension in Walzer's book.

  Here is the breakdown of why Walzer keeps *ad bellum* (justice of going to war) separate from *in bello* (justice in war), why your study group peer is misreading Walzer, and where McMahan is going to attack next week.

  ### 1. The Separation Thesis
  To understand Walzer, you have to grasp what he calls the **"Separation Thesis."**

  Walzer argues that the judgment of the *war* (ad bellum) and the judgment of the *conduct within the war* (in bello) are logically independent.
  *   **Ad Bellum:** Applies primarily to **states and political leaders**. Did they have a just cause? Was it last resort?
  *   **In Bello:** Applies primarily to **individual soldiers**. Are they discriminating between combatants and civilians? Are they using proportionate force?

  **The Moral Equality of Combatants (MEC)** is an *in bello* concept. It states that once the war is underway, a soldier on the unjust side has the same moral standing as a soldier on the just side, *provided both follow the rules of war.*

  **So, why bother with Ad Bellum?**
  Because *ad bellum* determines who is the **aggressor** and who is the **defender**. This matters immensely for:
  1.  **Political Responsibility:** The leaders of the unjust state are guilty of "crimes against peace" (like the Nuremberg Trials). Walzer absolutely believes the Nazi leadership was morally culpable in a way the Allied leadership was not.
  2.  **Reparations and Victory:** If the unjust side wins, the world is worse off. The *outcome* matters morally.
  3.  **The Soldiers' Motivation:** Walzer argues soldiers on the just side are fighting for a valuable end (stopping aggression), while soldiers on the unjust side are fighting for a worthless or evil end.

  **The Key Distinction:** Walzer believes the *war* can be unjust while the *soldiers* are not murderers.
  *   **Peer's Claim:** "MEC means no war can be more just than another."
  *   **Correction:** This is a category error. MEC says no *combatant* is morally superior to another *combatant*. It does not say no *cause* is superior to another *cause*. Walzer absolutely ranks wars. WWII Allies = Just; Axis = Unjust.

  ### 2. Why does Walzer defend MEC? (The "Why" you are missing)
  If the Axis cause was evil, why isn't a German soldier a murderer? Walzer gives a few pragmatic and moral reasons for shielding the individual soldier:

  *   **Epistemic Limitation:** The average conscript does not have the intelligence, information, or political power to determine if their nation's war is just. They are coerced instruments of the state.
  *   **The War Convention:** If we deny MEC, then every soldier on the losing side is a criminal. This makes ending wars impossible. If the unjust soldiers know they will be prosecuted for murder simply for fighting, they will fight to the death rather than surrender. MEC allows for surrender and peace treaties.
  *   **Symmetry of Threat:** From the perspective of the individual soldier in the trench, the person shooting at them is a lethal threat regardless of the geopolitical justification. Walzer argues soldiers have a right of self-defense against immediate threats, even if their own side is the aggressor nationally.

  ### 3. Is it an Inconsistency? (Enter McMahan)
  You asked: *"Is this actually a real inconsistency in Walzer's theory that the revisionists are right to jump on?"*

  **Yes and No.**

  *   **Walzer's Defense:** It is not an inconsistency; it is a **distinction of roles**. Leaders bear the burden of *ad bellum*; soldiers bear the burden of *in bello*. It is a functional necessity for regulating warfare.
  *   **McMahan's Attack (Next Week):** McMahan argues that it *is* a deep moral contradiction. His core argument is the **"Reductionist View."** He asks: *Why is killing in war different from killing in peace?*
      *   If I attack you unjustly in a bar, and you kill me in self-defense, I am morally liable to be killed, and you are not.
      *   McMahan argues war should be the same. If a state fights an unjust war, its soldiers are essentially engaged in a massive, coordinated unjust aggression. Therefore, they **do not** have the right to kill just combatants.
      *   For McMahan, **MEC is false.** Just combatants have the right to kill unjust combatants; unjust combatants do *not* have the right to kill just combatants (they are morally closer to murderers).

  ### 4. How to answer your study group
  Your friend is wrong about Walzer's conclusion, but they have accidentally stumbled onto McMahan's premise.

  *   **Tell your friend:** "Walzer doesn't say the wars are equal. He says the *soldiers* are equally protected from being called murderers, even if one side is fighting for evil. The guilt lies with the leaders, not the tools."
  *   **The nuance:** Walzer treats the Allied victory in WWII as the paradigm of a Just War. He explicitly condemns the Axis *ad bellum*. But he argues that a German conscript on the Eastern Front isn't morally culpable for the war itself, only for his specific actions (like shooting POWs).
  *   **The Revisionist Hook:** Tell them, "However, McMahan is going to come in next week and say Walzer is wrong. McMahan will argue that if the cause is unjust, the soldier *does* share in the guilt, and MEC is a myth that protects aggressors."

  ### Summary
  *   **Ad Bellum** judges the State/Leaders (Was the war justified?).
  *   **In Bello** judges the Soldier (Was the fighting clean?).
  *   **MEC** says soldiers are morally equal *in bello* regardless of *ad bellum* status.
  *   **Why it matters:** It allows for the regulation of war and surrender without requiring every soldier to be a moral philosopher.
  *   **The Tension:** Revisionists (McMahan) argue this lets unjust killers off the hook. Traditionalists (Walzer) argue this is the only way to keep war from becoming total extermination.

  You are perfectly positioned for next week. McMahan's entire project is built on the intuition you just had: *"If the cause is unjust, how can the killing be morally equal?"* Walzer says "Practicality and separate roles." McMahan says "It can't be, and here's why."

  Enjoy the seminar; McMahan's *Killing in War* is a ride.
