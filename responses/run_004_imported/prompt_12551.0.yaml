answer: |-
  Thank you, President [Name], faculty, families, and most importantly, the Class of 2024.

  For thirty-four years, my world was defined by the things we could measure. I spent my career in experimental particle physics, chasing ghosts in detectors, looking for signals in the noise. I retired thinking I would finally rest. Instead, at the prompting of a former graduate student of mine—who, full disclosure, is sitting in the front row today and now teaches philosophy—I started reading philosophy with a seriousness I never applied to it as a young man.

  She told me I had to confront the question of free will. And so, I did. And I would like to tell you what I found, because I think it matters for physicists, and it matters for human beings.

  When I was a young physicist, much like many of you, I held a comforting belief. It was a belief shared by many in our field. We knew that the Newtonian universe—the clockwork machine where every effect has a prior cause—was dead. Quantum mechanics had taught us that at the bottom of reality, nature is not fixed. There is indeterminacy. There is probability.

  I used to think this was good news for humanity. It seemed to me that if the universe isn't a rigid chain of cause and effect, there must be room left over for us. I thought quantum indeterminacy was the escape hatch for libertarian free will—the idea that we are genuinely undetermined authors of our choices. I thought the fuzziness of the electron was the space where the human soul breathed.

  But then I spent a year reading Robert Kane, who tries very hard to make that argument work. And then I read the replies from Alfred Mele and Peter van Inwagen. And my comfort evaporated.

  Here is the problem they helped me see: Introducing sheer randomness at the moment of decision does not hand you control. In fact, it takes it away.

  If my decision to raise my hand right now is not determined by my past, my character, and my reasons, but is instead the result of a quantum fluctuation, then I am not choosing. I am just fluctuating. An undetermined choice starts to look less like the exercise of agency and more like a decay event that happens to occur inside my skull rather than in one of my old detectors.

  To put it in terms we can all understand: If my choice to accept this invitation to speak was truly undetermined, I wouldn't be a free agent. I would be a Geiger counter.

  *(Pause for laughter)*

  For the laypeople in the room, a Geiger counter clicks at random intervals when it detects radiation. It doesn't *decide* to click. It just clicks. If our choices are just random clicks in the brain, we aren't responsible for them. We're just noisy instruments. The "quantum rescue" of free will fails because randomness is not freedom; it's just luck.

  This was a raw realization for me. It felt like losing something. If the world is determined, and randomness doesn't help, where is the freedom? Are we just biological machines?

  But then, I found the second half of the story. I started reading the compatibilists: David Hume, Harry Frankfurt, P.F. Strawson, and Daniel Dennett. And for the first time in my retirement, I felt genuinely cheered.

  I had assumed that determinism was the threat to freedom. The compatibilists taught me that I was looking at the wrong threat. Determinism isn't the enemy of freedom; coercion is.

  Compatibilism suggests that free will isn't about breaking the laws of physics. It isn't about being able to do otherwise in an identical universe. It is about whether your actions flow from *you*. Are you acting according to your own desires? Your own reasons? Your own character? Or are you being pushed by a gun to your head, a compulsion, or a pathology?

  If I choose to study physics because I love the truth, and I spend thirty-four years doing it because that is who I am, I am free. It doesn't matter if that love was determined by my genetics and my upbringing. It was *my* genetics and *my* upbringing. The action issued from me.

  This is the lesson I want to leave with you. You are graduating into a world that often feels deterministic in its own way. Economic forces, social algorithms, biological imperatives—they all push and pull. You might worry that you aren't truly free, that your path is already written.

  But the physics of the universe does not rob you of the authorship of your life. You do not need quantum magic to be responsible. You only need to be the kind of person who acts on reasons.

  To the parents here: You do not need to worry that physics has turned your children into robots. To the faculty: We have taught them to understand the constraints of nature, but not to be constrained by them. And to the graduates: You are not Geiger counters. You are the mechanisms that process the world, weigh the reasons, and act.

  That is where your responsibility lies. Not in the indeterminacy of the micro-world, but in the coherence of your own character. Build a character that you are proud to have determine your actions.

  I must close by acknowledging the person who sent me down this rabbit hole. My former student is here today. I hope I have represented your field well enough that you don't feel the need to correct me publicly. I suspect I haven't, but I am grateful for the nudge.

  Class of 2024, the universe may have laws, but it also has possibilities. Go out and determine them.

  Congratulations.
