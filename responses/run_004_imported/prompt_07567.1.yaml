  ### **TA Tips for the Rest of the Stack**
  Since you mentioned this is your first time grading philosophy logic:
  1.  **Watch for "Existence" vs. "Necessary Existence":** This is the most common slip-up in Gödel papers. If a student says Axiom 5 is just "Existence is positive," they miss the specific innovation of Gödel's proof over Descartes'.
  2.  **S5 Check:** For the derivation part, ensure they mention that the logic relies on **S5** specifically. If they use S4 or T, the move from "Possibly Necessary" to "Necessary" doesn't work.
  3.  **Kant Constraint:** The prompt explicitly banned Kant. If a student talks about "existence not being a predicate," they failed the prompt constraints regardless of how well they explain it.

