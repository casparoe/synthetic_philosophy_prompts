prompt: |-
  For my science-and-ideas column, I'm profiling a philosopher who has built her reputation defending the Self-Indication Assumption (SIA) over its rival, the Self-Sampling Assumption (SSA), in debates about how to reason from the bare fact of one's own existence. Whenever someone raises Bostrom's presumptuous philosopher against her, she has a stock reply: the case only feels absurd because we're assuming a physics question can't be settled from an armchair, and she thinks that assumption, not SIA, is what should give. Draft eight to ten interview questions that go beyond letting her restate that move -- I want one question that tightens the presumptuous-philosopher scenario so the stock reply no longer fits cleanly, one that asks why she holds SIA at all given that pairing it with SSA simply cancels the doomsday shift and returns you to the odds you would have assigned without ever factoring in self-location, and one on how she picks out the space of "possible observers" that SIA sums over without quietly reimporting the reference-class problem that plagues SSA -- ending with one question about what her view is committed to in cosmological scenarios, like eternal inflation, where every live hypothesis already implies infinitely many observers. For each question, add a short follow-up keyed to the answer she's most likely to give.
