answer: |-
  You are not missing something obvious, and your neighbour's high school physics textbook version of Popper is doing you a disservice. In fact, the scenario you've laid out—the twin cases of Le Verrier, Neptune, and Vulcan—is the canonical counterexample used in graduate seminars to demonstrate exactly why "naive falsificationism" fails.

  You have put your finger on the **Problem of Auxiliary Hypotheses** (often associated with Pierre Duhem and W.V.O. Quine), and you are absolutely right: if Popper's criterion is applied mechanically, it condemns the discovery of Neptune just as harshly as the wild goose chase for Vulcan.

  Here is the proper settlement of the bet, breaking down why your intuition is sound, how Popper tried to patch it, and why most philosophers of science eventually moved past Popper to handle exactly this kind of situation.

  ### 1. The Naive View vs. The Real Practice
  Naive falsificationism suggests a logical syllogism:
  1.  If Theory $T$ is true, Observation $O$ must occur.
  2.  Observation $O$ does not occur.
  3.  Therefore, Theory $T$ is false.

  As you know from thirty-five years in the field, this never happens in isolation. You never test $T$ alone. You test $T$ plus a whole bundle of auxiliary assumptions ($A$): the telescope is calibrated, the atmosphere is stable, there are no unseen masses perturbing the system, etc.

  So the logic is actually:
  1.  If ($T$ + $A$) is true, $O$ must occur.
  2.  $O$ does not occur.
  3.  Therefore, either $T$ is false **or** $A$ is false.

  Logic does not tell you which one to reject. When Le Verrier looked at Uranus, he chose to reject $A$ (the assumption that the known planets are the *only* planets). When he looked at Mercury, he did the exact same thing. If Popper's rule is "abandon the theory when data contradicts," Le Verrier should have abandoned Newtonian gravity after Uranus. By saving Newton with an ad hoc entity, naive Popperism would classify the discovery of Neptune as unscientific maneuvering.

  ### 2. Popper's Defense: "Ad Hoc" vs. "Testable"
  Popper was aware of this objection. His counter-move was to distinguish between **ad hoc hypotheses** (which save a theory but add no new testable content) and **non-ad hoc hypotheses** (which save the theory and make new, risky predictions).

  *   **Neptune:** Postulating Neptune saved Newtonian gravity, *but* it also predicted a specific location in the sky where a telescope could look. It increased the empirical content of the system.
  *   **Vulcan:** Postulating Vulcan also saved Newtonian gravity, and it *also* predicted a specific location (or at least a specific orbital parameter) where a transit or eclipse could be observed.

  Here is where your critique bites hardest: **At the time of proposal, both moves looked equally "scientific" by Popper's standard.** Both generated new, falsifiable predictions. The only difference is that one prediction panned out and the other didn't.

  If the demarcation criterion relies on the *success* of the prediction, then it is indeed retrospective. You cannot know if a theory is "scientific" or "pseudoscientific" until after the telescope has taken the image. As you noted, this guts the utility of the criterion for a working scientist.

  ### 3. The Better Tool: Lakatos and Research Programmes
  The philosopher who actually solved this specific puzzle for working scientists was Imre Lakatos, a student of Popper's. He developed the **Methodology of Scientific Research Programmes (MSRP)**, which fits your experience much better.

  Lakatos argued that science isn't a single theory being tested; it's a "research programme" with two parts:
  *   **The Hard Core:** The fundamental laws (e.g., Newton's Laws of Motion and Gravity). This is treated as irrefutable by methodological decision.
  *   **The Protective Belt:** The auxiliary hypotheses (e.g., number of planets, initial conditions, friction).

  Scientists protect the Hard Core by adjusting the Protective Belt. Lakatos said this is fine, *provided* the programme is **progressive**.
  *   **Progressive Shift:** The new adjustment predicts a *novel fact* that is subsequently confirmed (Neptune).
  *   **Degenerating Shift:** The new adjustment is made to save the theory, but it fails to predict new facts, or requires constant further patching without new confirmations (Vulcan).

  **The Catch:** Lakatos conceded your exact point. He admitted that you often cannot tell if a shift is progressive or degenerating *in the moment*. You might propose Vulcan, and it might just take better technology to find it. A programme might look degenerating for decades before a new discovery saves it.

  So, Lakatos validates your suspicion: **Demarcation is often historical and retrospective.** We label Vulcan a "dead end" and Neptune a "triumph" with hindsight. At the moment of publication, Le Verrier was doing legitimate science in both cases.

  ### 4. Why Vulcan Felt Different (Even Then)
  While the *logical structure* was identical, there was a contextual difference that a practicing astronomer like you would recognize, even if Popper ignored it. It comes down to **independent plausibility**.

  *   **Neptune:** There was no physical reason to think the solar system stopped at Uranus. Titius-Bode law suggested a planet should be there. The "auxiliary hypothesis" fit well with existing models of solar system formation.
  *   **Vulcan:** A planet inside Mercury's orbit is dynamically messy. It would be incredibly hot, difficult to form, and hard to stabilize. While not impossible, the prior probability was lower.

  When astronomers hunted for Neptune, they were optimistic. When they hunted for Vulcan, there was always a undercurrent of skepticism, not because the *method* was unscientific, but because the *physical plausibility* of the auxiliary hypothesis was weaker. When Einstein provided a derivation for the perihelion precession without needing new matter, the Vulcan hypothesis wasn't just falsified; it became superfluous.

  ### 5. The Verdict
  Your neighbour is teaching a simplified version of philosophy that doesn't survive contact with actual laboratory or observatory work.

  1.  **You are right:** The methodological move was identical.
  2.  **You are right:** Naive falsificationism cannot distinguish between the two cases in real-time.
  3.  **You are right:** This implies that demarcation is often a historical judgment, not a logical algorithm.

  Popper's great contribution was emphasizing that science must be willing to *risk* being wrong. But he underestimated how stubborn scientists must be to make progress. If every astronomer had strictly followed "falsify Newton immediately upon anomaly," we never would have found Neptune. We would have discarded the best theory of gravity we had because of a bookkeeping error in the initial conditions.

  Science requires a balance of skepticism and dogmatism. You have to be dogmatic enough to believe the anomaly is in the data or the auxiliaries (like Le Verrier with Uranus), but skeptical enough to eventually let the core go when the patches become too absurd (like with Mercury).

  Popper gives you the skepticism; he doesn't give you the rulebook for the dogmatism. For that, you need the judgment of an experienced astronomer—which is exactly why your intuition is better than the textbook definition. You haven't missed anything; you've just outgrown the simplified philosophy.
