answer: |-
  This is a sharp observation. You have correctly identified that the "prediction market as Bayesian aggregator" narrative relies heavily on the Harsanyi Doctrine (the Common Prior Assumption). If agents share a prior, the market price is a sufficient statistic for the union of all private information sets. If they do not, the market price is merely a clearing price for a bet between incompatible worldviews.

  When you drop the CPA, you aren't just adding noise; you fundamentally change the ontological status of the price. It ceases to be an estimate of a "true" probability derived from information aggregation and becomes a wealth-weighted average of subjective models.

  Here are the specific epistemic implications of a false CPA for how you should weight prediction market prices, excluding the standard liquidity/manipulation caveats.

  ### 1. The Price Becomes Wealth-Weighted, Not Information-Weighted
  Under CPA + Risk Neutrality, the market price converges to the belief of the agent with the most precise information, regardless of their wealth (assuming they can bet enough to move the price). The "smart money" corrects the "dumb money" because they agree on the rules of the game but disagree on the cards.

  Without CPA, "smart" and "dumb" are ill-defined. There is only "your prior" and "my prior." If I believe the base rate of political stability is 10% and you believe it is 90%, and we bet, the price will settle where our marginal utilities equate. In a log-wealth utility world (Kelly betting), the price reflects the **wealth-weighted average of priors**, not the information-weighted average of posteriors.

  **Epistemic Implication:** A price of 80% does not mean "the aggregate information suggests an 80% chance." It means "the aggregate capital committed to the '80% worldview' is dominant." If the cohort with the systematically biased prior is richer (or more risk-tolerant), the price will be systematically biased. You cannot assume the market corrects for bias; the market *prices in* the bias of the wealthy participants.

  ### 2. Volume Signals Prior Divergence, Not Information Resolution
  In the Milgrom-Stokey no-trade framework, trade only occurs if there are hedging motives or non-common priors. If you assume CPA, high volume implies a massive influx of new private information that is being rapidly incorporated.

  If you drop CPA, high volume often implies **fundamental model disagreement**. In political or ideological markets (Polymarket's bread and butter), volume is frequently driven by agents who agree on the *evidence* but disagree on the *likelihood ratio* that the evidence generates.

  **Epistemic Implication:** High volume in a Non-CPA environment does not increase your confidence in the price's calibration. It may indicate that the event is being viewed through two incommensurate frameworks (e.g., "The market says 60% because one side thinks the legal system is impartial and the other thinks it is weaponized"). The price is a bargaining outcome between these models, not a convergence toward truth. Treat high-volume political markets as "confidence intervals of conflict," not "probability estimates of outcome."

  ### 3. The Failure of Error Cancellation (The "Wisdom of Crowds" Breakdown)
  The standard defense of market calibration is that individual errors cancel out. This relies on errors being independent and distributed around a true value. This assumption is implicitly supported by CPA: everyone is trying to estimate the same true parameter, just with noise.

  Without CPA, errors are **systematic and correlated** within prior-groups. If 60% of the liquidity in a crypto-regulation market comes from participants with a "libertarian/techno-optimist" prior, their errors regarding government enforcement capability will be correlated. They aren't making independent mistakes; they are sharing a structural model error.

  **Epistemic Implication:** You must discount the epistemic weight of markets where the participant pool is homogenous in culture or ideology, even if liquidity is deep. The market will be perfectly calibrated *internal to that worldview* but miscalibrated relative to objective frequency. For example, Manifold markets created by the effective altruism community are likely well-calibrated on x-risk metrics but may suffer from systematic prior bias on geopolitical interventions because the participant pool shares a specific philosophical prior.

  ### 4. Violation of the Martingale Property
  Under CPA and efficient information aggregation, price changes should follow a martingale (unpredictable changes based on new info).

  Without CPA, price drift can occur without new information. If a trader with a different prior enters the market (or an existing trader shifts their capital allocation due to external wealth shocks), the price moves. This isn't "information arrival"; it's "prior substitution."

  **Epistemic Implication:** You cannot treat the time-series of a prediction market price as a pure signal of changing probabilities. A drift from 40% to 50% over a week might not mean the event became more likely; it might mean a cohort with a 60% prior accumulated more capital relative to the 30% prior cohort. This makes using market prices for dynamic updating (e.g., using the price as a prior for your own Bayesian update) dangerous, as the "signal" contains endogenous noise about trader wealth distribution.

  ### 5. Speculative Trade Decouples Price from "Truth"
  Under CPA, speculative trade is impossible (No-Trade Theorem). If trade is happening, it must be for hedging or because CPA is false. In prediction markets, hedging is minimal. Therefore, **almost all trade is speculative based on prior differences.**

  This means traders are not trying to find the "true probability"; they are trying to exploit the gap between their prior and the market's implied prior. If I know the market is dominated by optimists, I might short not because I know the outcome, but because I know their prior is too high relative to mine.

  **Epistemic Implication:** The price can persistently diverge from the "true" frequency if the "correct" prior group lacks capital or risk capacity. The market does not necessarily punish "wrong" priors quickly; it only punishes priors that lead to bankruptcy. A group with a systematically wrong prior but deep pockets (or low risk aversion) can keep the price "wrong" for the duration of the market.

  ### Heuristic for Epistemic Weight
  Given these implications, here is how you should adjust your weighting of market prices based on the likelihood of CPA violation:

  1.  **High CPA Likelihood (Trust the Price):** Markets where the underlying mechanism is technical, rule-based, and observable by all parties similarly (e.g., "Will the Fed raise rates?", "Will this specific smart contract exploit happen?"). Here, priors likely converge on the mechanics, and disagreement is mostly about private info. The price is a good probability estimate.
  2.  **Low CPA Likelihood (Discount the Price):** Markets where the outcome depends on human interpretation, ideology, or opaque processes (e.g., "Who will win the election?", "Will this bill pass?"). Here, agents have different models of how humans behave. The price is a wealth-weighted consensus of ideologies. Treat it as a sentiment indicator, not a calibrated probability.
  3.  **Watch for "Prior Shocks":** If a price moves significantly on news that *shouldn't* change the objective probability but *does* change the narrative, that is a Non-CPA signal. It indicates the market is pricing a shift in which worldview is dominant, not a shift in the event likelihood.

  **Summary:** If CPA is false, the prediction market price is not a **discovery mechanism** for truth; it is a **clearing mechanism** for disagreement. It tells you what the wealthy participants *believe*, not necessarily what is *true*. Your epistemic weight should be proportional to the likelihood that the participants share your prior structure, not just the volume of money involved.
