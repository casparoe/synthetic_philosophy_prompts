prompt: |-
  Been down a bit of a rabbit hole on the common prior assumption (CPA) lately and want your take on something. The reason Aumann-style 'agreeing to disagree' results and the associated no-trade theorems (Milgrom-Stokey and that whole literature) go through is that agents start from the same prior and only end up disagreeing because they've conditioned on different private info -- take away the common prior and the theorems just don't apply anymore. Meanwhile I've started putting small bets on Polymarket and Manifold for fun, and the standard pitch for why the price is a decent probability estimate leans really heavily on traders being Bayesians who'd converge if they only shared information, i.e. it's smuggling in a CPA that's probably doing more work than it can support. So: please describe the most important implications of the CPA almost certainly being false for real traders, for how much epistemic weight I should put on a prediction market price as a calibrated probability. I dont want the generic 'markets arent perfect, watch out for manipulation and thin liquidity' answer, I've heard that one a hundred times -- I want the implications that are specific to dropping the common-prior part, not the other, more boring failure modes.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Common Prior Assumption (CPA) in the context of Aumann's Agreement Theorem, No-Trade Theorems, and Prediction Markets (Polymarket/Manifold).
      *   **Core Question:** What are the specific implications of the CPA being *false* for real traders on the epistemic weight one should assign to prediction market prices as calibrated probabilities?
      *   **Constraints:** Do *not* give generic answers about liquidity, manipulation, or fees. Focus *specifically* on the failure of the Common Prior Assumption.
      *   **Tone:** Intellectual, rigorous, acknowledging the user's sophistication (they know Aumann, Milgrom-Stokey, etc.).

  2.  **Deconstruct the Common Prior Assumption (CPA):**
      *   *What is it?* All agents share the same prior probability distribution over the state space before receiving private signals. Differences in posterior beliefs arise *solely* from differences in information (signals).
      *   *What happens if it holds?* Aumann's Agreement Theorem says posteriors cannot be common knowledge if they differ. No-Trade Theorems say speculative trade shouldn't happen (unless there's a hedging motive or risk preference difference, but purely informational trade is impossible).
      *   *What happens if it fails?* Agents start with different worldviews/models. Disagreement persists even with shared information. Speculative trade becomes rational (I think you're wrong about the base rate, not just the signal).

  3.  **Analyze Prediction Markets under CPA vs. Non-CPA:**
      *   *Under CPA:* The market price aggregates private signals into a posterior that represents the "consensus Bayesian update." The price *is* the rational expectation given all dispersed information. It should be well-calibrated (assuming risk neutrality or appropriate risk adjustment).
      *   *Under Non-CPA:* The market price is a weighted average of *different priors* updated by *different signals*. It is not converging to a "true" Bayesian posterior because there is no single "true" prior to converge to. It's a bargaining outcome between conflicting worldviews.

  4.  **Identify Specific Implications of Dropping CPA (The "Meat" of the answer):**
      *   *Implication 1: Prices reflect power/wealth, not just information.* If we disagree on priors, trade happens. Who wins? Those with more capital or lower risk aversion. The price might reflect the beliefs of the richest trader, not the most informed one. (Wealth-weighted priors).
      *   *Implication 2: Persistence of Bias/Systematic Error.* If the dominant traders share a biased prior (e.g., ideological blind spots), the market price will inherit that bias and not correct it, even if contrary information exists. The "wisdom of crowds" requires independent errors around a truth; Non-CPA allows for *shared structural error*.
      *   *Implication 3: Volatility as Prior Clashes, not Information Flow.* Price movements aren't just new info; they're shifts in which prior-group is dominant. This makes calibration harder because the underlying "probability" isn't stable.
      *   *Implication 4: The "No-Trade" logic fails, so volume doesn't guarantee truth.* High volume under CPA implies information exchange. High volume under Non-CPA implies speculative gambling based on prior differences. Volume is less informative about epistemic certainty.
      *   *Implication 5: Calibration is reference-class dependent.* A market might be calibrated *conditional on the traders' shared biases* but uncalibrated relative to objective frequencies. (e.g., Crypto traders might be well-calibrated on crypto-internal events but systematically overconfident on regulatory outcomes due to a shared libertarian prior).

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication. Validate the insight (yes, CPA is doing heavy lifting in the "market as Bayesian aggregator" narrative).
      *   *Point 1: The Price is a Wealth-Weighted Average of Priors, not a Signal-Weighted Posterior.* Under CPA, price = aggregate info. Without CPA, price = aggregate worldviews weighted by bankroll. If the "wrong" prior has more money, the price is "wrong."
      *   *Point 2: Speculative Trade becomes Rational, decoupling Volume from Information.* Under CPA, trade is zero-sum and shouldn't happen (Milgrom-Stokey). If trade *is* happening, it's because priors differ. This means volume indicates *disagreement on fundamentals*, not necessarily *resolution of uncertainty*. High volume might mean deep confusion, not high confidence.
      *   *Point 3: Systematic Bias and the Failure of Cancellation.* Wisdom of Crowds relies on errors canceling out. If priors differ systematically (e.g., political ideology), errors correlate. The market price inherits the systematic bias of the dominant participant class.
      *   *Point 4: Dynamic Instability (Prior Switching).* Prices might jump not because of news, but because a trader with a different prior enters/exits. This makes the time-series properties of the price less like a martingale of information and more like a battle of ideologies.
      *   *Point 5: Calibration is Internal, not External.* The market might be internally consistent (no Dutch books among the traders) but externally miscalibrated relative to frequency.
      *   *Conclusion/Actionable Advice:* How to adjust epistemic weight? Discount prices where prior disagreement is likely (politics, ideology). Trust prices more where priors likely converge (technical outcomes, sports). Look for "shark" entry as a signal of prior alignment.

  6.  **Refining for the "No Generic Answers" Constraint:**
