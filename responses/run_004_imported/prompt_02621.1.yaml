  "So, when I accidentally crashed the server," I said, "my indifference proved I'm not a team player at my core."

  "Exactly," my boss replied. "Your Deep Self concorded with the harm."

  "But when I accidentally fixed the client's database..."

  "You didn't care about fixing it, so that's uninformative."

  "So I'm only authentically *me* when I'm ruining things?"

  "Don't be dramatic," she said, closing my file. "It's just that your indifference to disaster is evidence. Your indifference to miracles is just noise."
