answer: |-
  This is a classic conflict between **contractual legitimacy** (Jake's position) and **stakeholder legitimacy** (your position). You both hit on genuine philosophical and legal truths, but you are arguing past each other because you are prioritizing different values.

  Here is the breakdown of who is right about what, why the "circularity" argument is trickier than Jake admits, and whether there is a principled way out of this mess.

  ### 1. Where Jake is Right: The Necessity of Boundaries
  Jake is correct on the **legal and pragmatic** front.

  *   **The Contractual Reality:** An HOA is fundamentally a private contract, not a government. When someone buys a house in the development, they sign a deed restriction agreeing to the HOA's rules and governance structure in exchange for property value maintenance and amenities. Legally, Jake is right: if you didn't sign the contract (the non-HOA neighbors) or you aren't the titleholder (the renters), you don't get a vote.
  *   **The "Infinite Regress" Problem:** You asked, "Where does it stop?" Jake's answer is the only practical one. If "affected parties" get a vote, does a birdwatcher who comes once a year get a say? Does the town downstream that deals with runoff get a say? To function, any decision-making body must have a defined membership. "Dues-paying owners" is a bright, clear line. "People who care" is not.
  *   **The Universality of Circularity:** Jake is logically correct that *every* self-governing body decides its own membership. Citizens vote on immigration policy; club members vote on new members; shareholders vote on new shareholders. This circularity is a feature of sovereignty, not necessarily a bug.

  ### 2. Where You Are Right: The Ethical & Political Gap
  You are correct on the **ethical and political theory** front.

  *   **Negative Externalities:** The wake boat issue isn't just about HOA property; it's about physics. Waves don't respect property lines. If an HOA member's boat erodes a non-HOA neighbor's shoreline, that is a **negative externality**. In public governance, we regulate externalities (e.g., pollution laws) because the people harmed deserve protection even if they didn't "join" the factory's contract. By refusing non-members input on wake restrictions, the HOA is essentially voting on how much damage they are allowed to inflict on neighbors who have no recourse.
  *   **Quasi-Governmental Power:** HOAs occupy a weird middle ground. They look like private clubs, but they function like mini-municipalities. They control land use, noise, and aesthetics. Unlike a chess club, you can't easily "quit" an HOA without selling your home (high exit costs). Because the "exit cost" is so high, the ethical bar for "voice" should be higher than it is for a voluntary social club.
  *   **Entrenchment:** You nailed the conflict of interest regarding the non-HOA neighbors. If the HOA votes on whether to allow those 6-7 houses to join, the current members are voting on whether to dilute their own control and potentially lower their own dues burden by spreading it to more people. That is a structural incentive to remain exclusionary.

  ### 3. The Circularity Debate: Is it a Problem?
  Jake says the circularity ("members decide who joins") is normal. You say it's problematic. **You are both right, but context matters.**

  In a voluntary association (a bowling league), circularity is fine because if you don't like the rules, you leave. In a **land-use community**, circularity is more dangerous because land is immobile.
  *   **Jake's View:** It's a club.
  *   **Your View:** It's a jurisdiction.

  The problem arises because the HOA is exercising power over a *resource* (the lake) that is functionally shared, even if legally segmented. If the HOA bans wake boats, they protect the shoreline (helping non-members). If they allow them, they degrade the shoreline (hurting non-members). Because the non-members cannot vote, the HOA can internalize the benefits of boating while externalizing the costs of erosion.

  ### 4. Is There a Principled Way to Decide Who Gets a Say?
  Political scientists and legal scholars generally use three frameworks to determine voting rights. Applying them here shows why this is so messy:

  **A. The Property Interest Principle (Jake's View)**
  *   *Who votes:* Those with financial equity at risk.
  *   *Verdict:* Only owners. Renters and the marina are out. Non-HOA neighbors are out.
  *   *Pros:* Clear, protects investment.
  *   *Cons:* Ignores human impact (renters live there) and physical impact (neighbors lose land).

  **B. The Affected Interests Principle (Your View)**
  *   *Who votes:* Anyone significantly impacted by the decision.
  *   *Verdict:* Owners, renters, non-HOA neighbors, and arguably the marina.
  *   *Pros:* Ethically robust, accounts for externalities.
  *   *Cons:* Logistically nightmarish. How do you verify "impact"? Does a renter get a full vote or a half vote?

  **C. The Stakeholder Compromise (The Middle Ground)**
  *   *Who votes:* Owners vote, but other stakeholders get **consultative rights**.
  *   *Verdict:* This is the most functional solution. The HOA retains the final vote (preserving the contract), but creates a "Lake Advisory Committee" that includes a renter rep, a non-HOA neighbor rep, and the marina owner.
  *   *Why this works:* It acknowledges Jake's point (someone has to draw the line on final authority) but validates your point (those affected need input). It doesn't give the neighbors a veto, but it forces the HOA to hear their data on erosion before voting.

  ### 5. Does This Change Anything for the Excluded Groups?
  Practically speaking, does your argument help the renters or neighbors?

  *   **The Renters:** In many jurisdictions, state laws actually *do* require HOAs to allow renters to attend meetings or serve on committees, even if they can't vote on the board. Your argument supports pushing for **proxy voting**. The owner (landlord) should be contractually obligated to vote the lake usage preferences of the long-term tenant.
  *   **The Non-HOA Neighbors:** They are in the toughest spot. Legally, Jake is right; they have no seat at the table. However, their leverage is **litigation and nuisance**. If the HOA allows wake boats that damage their land, they can sue for nuisance/trespass (waves hitting land can be considered trespass in some case law). The HOA should want to avoid this. Your argument is a lever to convince the HOA board (your mom) that listening to the neighbors is cheaper than getting sued by them.
  *   **The Marina:** They are a business. Their leverage is economic. If the HOA restricts boats too much, the marina suffers. They don't need a vote; they need a **business liaison** role. They should be presenting data on how restrictions impact the local economy to the board.

  ### The Verdict
  **Jake is right about the Law and Logistics.** You cannot run a governance structure where "everyone affected" votes. It creates paralysis. The "members decide" rule is the only one that allows the HOA to actually function.

  **You are right about the Ethics and Incentives.** The current structure creates a moral hazard where the HOA can make decisions that benefit members at the direct expense of neighbors who have no recourse. The circularity of "members vote on new members" is a specific problem here because it encourages exclusionary zoning practices that wouldn't pass in a public municipality.

  **Who "Won"?**
  If the question is "Can the HOA legally exclude them?" **Jake wins.**
  If the question is "Is this a fair way to govern a shared natural resource?" **You win.**

  **The Solution:**
  Your mom doesn't need to give up the HOA's legal authority (Jake's point). But she can adopt a **Stakeholder Compromise** (your point). The Board can formally invite the non-HOA neighbors and the marina to present impact statements before the wake boat vote. This costs the HOA nothing in terms of voting power, but it mitigates the ethical problem you identified and reduces the legal risk of the neighbors suing over shoreline erosion.

  You can tell Jake: "You're right that they can't *vote*. But I'm right that ignoring them is stupid governance. If the HOA votes to destroy the neighbors' shoreline, the neighbors will sue, and the HOA dues will go up to pay the legal fees. Listening to them isn't about democracy; it's about risk management." That is an argument Jake might actually accept.
