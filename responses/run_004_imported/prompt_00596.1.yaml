          *   *Wait, refine this:* The AMD problem has two solutions: *Planning Optimal* (commit at start) vs. *Action Optimal* (maximize at the moment). The Action Optimal solution looks a lot like the Thirder position because it treats the current moment as a random sample from all possible moments.
          *   *Connection:* If Beauty treats her awakening as a random sample from all awakenings (Thirder), she acts like the Driver treating his intersection as a random sample from all intersections.

      *   **What AMD forces you to deal with that SB doesn't:**
