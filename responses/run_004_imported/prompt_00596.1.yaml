      *   *Sleeping Beauty (Elga, 2000):* Beauty is woken once (Heads) or twice (Tails). Upon waking, she doesn't know the day or coin result. What is her credence that the coin is Heads? Key issue: Self-locating belief, indexical information, credence vs. betting odds.
