  so in my decision theory seminar we just covered the absent-minded driver problem (the guy on the highway who cant tell the two exits apart) and my professor mentioned in passing that its basically a cousin of the sleeping beauty problem, but never really explained why. can you compare the two properly for me -- like where does the reasoning actually overlap, and where does the driver problem force you to deal with stuff that sleeping beauty doesnt (or the other way around)? kinda need to have this straight before section tmrw
