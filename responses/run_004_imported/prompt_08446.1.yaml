      *   It is also an example of **Escalation of Commitment**. As investment increases, the desire to continue increases to justify the prior investment.
      *   From a Game Theory perspective, this looks like a **War of Attrition**. Both sides are bleeding resources to see who blinks first.
      *   There is also an element of **Vindictiveness/Revenge Utility**. The user derives utility not just from monetary gain, but from the contractor's loss ("making sure the contractor loses as much as I have").

  3.  **Evaluate the Financial Logic:**
