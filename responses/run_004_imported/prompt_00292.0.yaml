answer: |-
  Your instinct is not naive; it is professionally astute. You are correctly identifying a classic **Prisoner's Dilemma** scenario where individual rationality (trying to secure the best deal for yourself) leads to a collectively irrational outcome (the project collapses, and both of you get zero).

  In the entertainment industry, specifically in development, **uncertainty is the enemy.** Studios buy certainty. When a studio signs a deal with "the unit" (you two), they are buying a package that includes your working relationship. By proposing a secret race to anchor expectations, your co-author is introducing volatility into an asset the studio just paid to stabilize.

  Here is an analysis of why your co-author's plan is dangerous, why your instinct is correct, and specific mechanisms you can propose instead to achieve a fair outcome without risking the project.

  ### 1. Why the "Dueling Memos" Plan is Flawed
  Your co-author is operating under the belief that "anchoring" (setting the first number or term) guarantees an advantage. In a vacuum, this is sometimes true. But in a tripartite negotiation (You, Co-author, Studio), this strategy fails for three reasons:

  *   **Signaling Risk:** If the studio receives two contradictory memos within a short window, they do not think, "Wow, these are ambitious individuals." They think, "These partners are in conflict." In Hollywood, "creative differences" at the showrunner level is the number one reason adaptations get shelved. You are signaling that you are a high-maintenance liability.
  *   **The "Unit" Contract:** You mentioned the studio deal is already signed with "us" as a unit. Legally and practically, the studio expects one voice. If you fracture that voice now, you are technically breaching the spirit of the representation warranty (that you have the authority to bind the unit).
  *   **The Race to the Bottom:** If you agree to this, you force yourself into a state of paranoia. You have to draft the memo immediately to beat them. They have to do the same. You lose the ability to think strategically because you are thinking tactically.

  ### 2. Is There a "Smarter, Safer Way"?
  Yes. Your intuition that there is a mechanism to preserve incentives without the risk is well-founded. In game theory terms, you want to move from a **Non-Cooperative Game** (competing against each other) to a **Cooperative Game** (competing against the market, dividing the spoils internally).

  The goal is to **internalize the negotiation.** You must resolve the division *before* the studio ever sees a discrepancy.

  ### 3. What to Propose Instead
  You need to offer your co-author a framework that feels fair and competitive but keeps the studio out of it. Here are three specific proposals, ranked from most collaborative to most structured.

  #### Option A: The "Co-Showrunner" Standard (Recommended)
  In television, writing pairs often serve as co-showrunners. It is an established industry precedent.
  *   **The Proposal:** "We present a unified front as Co-Showrunners. We split the showrunner fee and the back-end bonus 50/50, mirroring our underlying rights deal."
  *   **The Incentive:** This protects the project. It tells the studio, "We are a seamless machine."
  *   **The Safeguard:** If one of you inevitably does more work, you can add a clause that allows for an annual review of duties and compensation after the first season, adjusted by the studio's assessment of workload.

  #### Option B: The "Blind Bid" to a Neutral Third Party
  If you cannot agree and one of you *must* lead, do not let the studio decide. Let a neutral arbiter decide.
  *   **The Proposal:** "We each submit our preferred role and compensation split to our shared agent (or an entertainment lawyer) in a sealed envelope. They review our past contributions, current bandwidth, and the needs of the project, and they recommend a split. We agree in advance to abide by their recommendation."
  *   **The Incentive:** This satisfies the desire for a "contest" without exposing the studio to the conflict. It removes emotion from the decision.
  *   **Why it's better than memos:** The studio never knows there was a disagreement. They just receive one memo with one decision.

  #### Option C: Role-Specific Compensation (The "Eat What You Kill" Model)
  If the fight is about money (back-end) rather than title (credit), decouple them.
  *   **The Proposal:** "We both take 'Co-Showrunner' credit for prestige. However, we divide the back-end bonus based on specific deliverables. If I write the pilot and you run the writers' room, the compensation follows those specific duties."
  *   **The Incentive:** This rewards actual labor rather than political maneuvering.
  *   **The Safety:** It requires a clear division of labor, which actually *helps* the studio because they know exactly who is responsible for what.

  ### 4. How to Pitch This to Your Co-Author
  You need to frame this not as "I don't trust you," but as "I am protecting our asset." Use the language of risk management.

  **Script for the conversation:**
  > "I've been thinking about the memo strategy. I understand the logic of anchoring, but I'm worried about the signal it sends to the studio. We just signed a deal as a unified entity. If they get two conflicting memos from us, it flags 'instability' in their risk assessment. That gives them an excuse to slow-walk development or bring in a third party to 'mediate' us, which dilutes our control.
  >
  > I want us to get the best deal possible, but I think we get more leverage by presenting as a single, unshakeable block. Let's settle the division internally—maybe using [Option B/Neutral Arbiter]—so that when we go to them, we force them to accept our terms as a package. If we fight each other, they win. If we present a united front, we win."

  ### 5. Summary: Your Instinct is Correct
  You are not being naive about how negotiations work; your co-author is being naive about how **studio development** works.

  *   **Negotiation 101:** Leverage comes from unity.
  *   **Hollywood 101:** Reliability is more valuable than brilliance.

  The "benefit" your co-author thinks they can gain from a secret memo is marginal (a slightly better title or bonus split). The "cost" of that strategy is existential (the project dies). The expected value of their plan is negative.

  **Recommendation:** Stand firm. Refuse to send a memo until you have a written internal agreement. If they insist on the dueling memos, you must inform them that you will have to inform the studio that the "unit" is currently in dispute, which will likely trigger the very collapse you both want to avoid. Usually, the threat of transparency is enough to bring a rogue partner back to the negotiating table.
