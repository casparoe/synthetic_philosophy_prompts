  quick context: I'm a phil PhD student and I'm presenting on Russell's theory of descriptions in my proseminar next week. I can handle the actual theory fine (the King of France stuff, the scope ambiguity with "George IV wished to know whether Scott was the author of Waverley," all that) but I'm completely stuck on the earlier "Gray's Elegy" passage in "On Denoting" (1905), which is supposedly the actual argument for why the old "denoting concepts" view (the Fregean-ish sense/reference picture) has to be scrapped in the first place. Here's the bit that's got me stuck:

