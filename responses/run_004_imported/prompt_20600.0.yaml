      *   **Context:** Memorial service. Mixed audience (family/friends who don't know philosophy + former doctoral students who know her work deeply).
      *   **Constraint:** 5-7 minute speaking time (approx. 750-1000 words spoken at a moderate pace).
      *   **Tone:** Personal, specific, not generic, intellectually honest but accessible. Avoid "greeting-card Ubuntu." Avoid implying she wasn't a person during her dementia years.
      *   **Specific Details to Include:** Terrible singer (cheerful), took in two foster children in her forties.
      *   **Underlying Goal:** Comfort the room by *enacting* the philosophy she taught, not just describing it. Show how the community is currently holding her personhood.

  2.  **Deconstruct the Philosophy for the Eulogy:**
      *   *The Trap:* Saying "she was a person until she died" is too generic. Saying "she achieved personhood" might sound like she earned it like a badge, which risks implying she lost it when she got dementia.
      *   *The Solution:* Focus on the *relational* aspect. Personhood is a web. When one strand weakens (her memory), the others (family, students, community) hold the shape. The eulogy itself is an act of "carrying her personhood."
      *   *Key Insight:* Her final years weren't a loss of personhood, but a shift in the *direction* of the care. She went from holding others to being held.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the mix of people in the room. Set the scene. Introduce the "Christmas dinner" anecdote about her philosophical debates. This signals to the students that we know the real stuff, and signals to the family that she was passionate.
      *   **The Philosophy (Light Touch):** Don't lecture. Explain her view through the lens of *care*. Menkiti's view: You become a person through others. The objection: What about when you can't participate? Her answer: The community carries you.
      *   **Personal Detail 1 (Foster Children):** This illustrates her active building of community. She didn't just write about it; she expanded her circle. This is "achieving personhood" through generosity.
      *   **Personal Detail 2 (Singing):** This illustrates the *joy* of participation, regardless of perfection. It humanizes her.
      *   **The Dementia Years (The Crux):** This is the hardest part. How to frame it without dehumanizing her? Use her own theory. She didn't lose her place; the community shifted to hold her. The memory care facility wasn't an exile; it was part of the web.
      *   **Conclusion:** Bring it back to the present moment. We are here *doing* the work she described. We are keeping her personhood alive by remembering her.

  4.  **Refining the Tone:**
      *   *Avoid:* "She is in a better place," "She fought a hard battle," "Rest in peace" (clichés).
      *   *Embrace:* "We are holding her," "The web remains," "She taught us how to do this."
      *   *Intellectual Honesty:* Acknowledge the tension. The students need to hear that the speaker understands the nuance of Menkiti vs. Gyekye without using jargon like "normative incrementalism."

  5.  **Drafting - Iteration 1 (Mental Outline):**
