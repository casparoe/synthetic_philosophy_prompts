answer: |-
  Good morning. For those of you who don't know me, I'm Thandeka's niece/nephew.

  I want to start with the singing. If you knew Thandeka in the last twenty years, you probably know that she loved to sing in the car. You also know that she was, by any objective metric, a terrible singer. She was off-key, she missed the words, and she had a habit of slowing down the tempo whenever she felt like emphasizing a point. But she never stopped. She sang because the singing was a way of being together, a way of filling the space with joy. It didn't matter that she wasn't perfect. What mattered was that she was participating.

  That instinct—to participate, to join in, to build a space where everyone has a place—wasn't just her personality. It was her life's work.

  Many of you know Thandeka as a philosopher. She spent thirty years teaching, writing, and, if we're being honest, happily derailing Christmas dinners to argue about the nature of personhood. Specifically, she argued for a view often summarized by the phrase *ubuntu*: "I am because we are." But Thandeka cared about the hard details of that idea. She sided with the philosopher Ifeanyi Menkiti, who argued that personhood isn't something you are born with, like having ten fingers. It's something you achieve. You become a person through moral growth, through relationships, through being woven into a community.

  Now, there is a standard objection to that view. It's the one her colleague Kwame Gyekye pressed her on over coffee a hundred times. If personhood is something you achieve through participation, they asked her, what about those who can't participate? What about infants? What about the elderly? What about someone who loses their memory? Does the community decide they aren't persons anymore?

  Thandeka hated that implication. She spent the better part of her career refining the answer. She argued that the community's job isn't just to applaud those who are standing strong. The community's job is to carry the weight when someone's legs give out. Personhood is relational. So, when one side of the relation can't hold up their end, the other side doesn't cut the rope. The other side holds tight enough for both of them.

  I tell you this not to give a lecture, but because I think it's the only way to talk about the last three years of her life.

  When the dementia took hold, it moved fast. There came a time when she couldn't recognize her children. There came a time when she couldn't follow an argument, or remember the foster children she and her husband had taken in during her forties. She had spent her life arguing that we become persons by caring for others, by expanding our circle. And when she could no longer actively do that caring, the circle didn't shrink. It tightened around her.

  Those foster children she took in? They are here. They are part of the web she wove. When she could no longer sing, we sang for her. When she could no longer remember the arguments, her students came to sit with her, not to debate, but to witness.

  There is a fear, I think, that when memory goes, the person goes. That the body remains, but the light is out. Thandeka's philosophy tells us that is wrong. The person isn't just a hard drive of data stored in the brain. The person is the pattern of relationships. And those relationships didn't break when her memory failed. They just changed direction. For decades, she held us. She held her students, her children, her community. And in the end, we held her.

  That wasn't a tragedy. It was the fulfillment of the very contract she spent her life describing.

  I know some of her doctoral students are here. You know better than anyone how rigorous she was. You know she would hate a eulogy that turned her complex ideas into a greeting card. She wouldn't want us to say she "rests in peace" as if she's gone to a different realm. She would want us to acknowledge that she is still here, in the way we are treating each other right now.

  She is here in the way her children are speaking to her grandchildren. She is here in the way her colleagues are mentoring their own students with more patience than they had before. She is here in the fact that we are gathered in this room, bearing witness to a life, performing the act of community that she said makes us human.

  Thandeka taught us that personhood is a verb. It is something we *do*. And so, the most respectful thing we can do for her today is not just to remember her, but to continue the work. To be the community that she said we are. To carry each other when we can't walk. To sing, even if we're off-key. To make sure that no one in this room, and no one in our lives, is ever left outside the circle because they are too weak, or too confused, or too broken to hold up their end.

  She achieved personhood, by her own definition. She wove herself into us so thoroughly that the pattern holds even now. We are the ones who have to keep weaving.

  Thank you.
