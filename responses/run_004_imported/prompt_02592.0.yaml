answer: |-
  This is one of the densest, most fraught passages in the history of economic thought. Your officemate isn't wrong to feel the tension—Aristotle is trying to force a geometric model of *justice* onto a material problem of *valuation*, and the seams show. However, I don't think it's incoherent; I think it's a layered argument where the variables shift because the *problem* shifts from "What makes exchange just?" to "How is exchange technically possible?"

  Let's work through your three questions and the arithmetic, keeping the Ross text in front of us.

  ### 1. Cross-Conjunction and the "Both Excesses" Warning

  This is the geometric heart of the passage. To understand "cross-conjunction" (*katà diámetron*), we have to map the four terms exactly as Aristotle sets them up in the first instance.

  **The Setup:**
  *   $A$ = Builder (Person 1)
  *   $B$ = Shoemaker (Person 2)
  *   $C$ = House (Product of $A$)
  *   $D$ = Shoe (Product of $B$)

  **The Exchange:**
  $A$ gives $C$ (House) to $B$.
  $B$ gives $D$ (Shoes) to $A$.

  **The Proportion:**
  Aristotle writes: *"as farmer is to shoemaker, the amount of the shoemaker's work is to that of the farmer's work."*
  Translating to our Builder/Shoemaker variables:
  $$A : B :: D : C$$
  *(Builder : Shoemaker :: Shoes : House)*

  **Why Cross-Conjunction?**
  Notice the "cross." $A$ (Builder) is paired with $B$ (Shoemaker) in the first ratio. But in the second ratio, the goods are **inverted** relative to their producers. $D$ (Shoes, produced by $B$) is placed first; $C$ (House, produced by $A$) is placed second.

  If you did *not* cross them, you would write:
  $$A : B :: C : D$$
  *(Builder : Shoemaker :: House : Shoes)*

  **The Logic of the Cross:**
  Aristotle assumes a hierarchy of social function (a premise we might reject, but essential for him). Let's assume the Builder is "worth" twice as much as the Shoemaker in terms of social contribution ($A = 2B$).
  *   In the **Non-Crossed** version ($A:B :: C:D$): If $A$ is double $B$, then $C$ (House) must be double $D$ (Shoes). This establishes the *value* of the goods correctly. **However**, in the exchange, $A$ *gives* $C$ and *gets* $D$. If $C$ is worth 2 and $D$ is worth 1, the Builder gives 2 and gets 1. He is unjustly treated.
  *   In the **Crossed** version ($A:B :: D:C$): If $A$ is double $B$ ($2:1$), then $D$ must be double $C$ ($2:1$). This means the *quantity* of shoes exchanged must be double the *quantity* of houses (or rather, the value of the shoes given must be double the value of the house... wait, this gets tricky).

  *Correction on the Ratio:* It is better to read the proportion as establishing the *rate of exchange* required to equalize the *persons*.
  If Builder ($A$) is superior to Shoemaker ($B$), the Builder must receive *more* shoes to maintain his status.
  So, $A : B$ (Ratio of Status) must equal $D : C$ (Ratio of Goods Received to Goods Given).
  If $A$ is 2 and $B$ is 1. Then $D$ (Shoes received) must be 2 and $C$ (House given) must be 1.
  The "Cross" ensures that the **return** ($D$ to $A$) is proportionate to the **status** ($A$ to $B$).

  **The "Both Excesses" Warning:**
  Text: *"But we must not bring them into a figure of proportion when they have already exchanged (otherwise one extreme will have both excesses), but when they still have their own goods."*

  This is about **timing** and **term alignment**.
  1.  **Timing:** You must calculate the ratio *before* the goods move. Why? Because the ratio is based on the *producers'* standing ($A$ and $B$), which is linked to their *production* ($C$ and $D$). Once exchange happens, $A$ holds $D$ and $B$ holds $C$. If you try to set the proportion then, you are comparing $A$ (who now holds Shoes) to $B$ (who now holds House). You lose the link between Producer and Product that grounds the value.
  2.  **Both Excesses:** In a geometric proportion $a:b :: c:d$, the "extremes" are $a$ and $d$. The "means" are $b$ and $c$.
      *   If you set it up correctly ($A:B :: D:C$): The extremes are Builder ($A$) and House ($C$). The means are Shoemaker ($B$) and Shoes ($D$). This keeps the Builder linked to the House (his product) diagonally across the equation, even though they are on opposite sides of the exchange.
      *   If you set it up incorrectly *after* exchange: You might align it so that the Builder ($A$) is an extreme, and the Shoes ($D$, which he now holds) are the other extreme. If the proportion is skewed, the Builder could end up representing the "greater" term in the person-ratio *and* the "greater" term in the goods-ratio. He would have the "excess" of status *and* the "excess" of goods. This violates reciprocity. Reciprocity requires that if one side is "greater" in status, the *other* side must be "greater" in the quantity of goods given to balance it out. The cross-conjunction forces this balance.

  ### 2. The Shifting Variables (The Three Sets)

  You are right to spot the relabeling. It looks messy, but I argue it represents a shift from **Ethical Ontology** to **Economic Mechanism**.

  **Set 1: Builder ($A$), Shoemaker ($B$), House ($C$), Shoe ($D$)**
  *   **Function:** Establishes the *Justice* of the exchange.
  *   **Logic:** Reciprocity based on social worth.
  *   **Problem:** How do we actually measure "House" against "Shoe" to find the ratio? They are qualitatively different.

  **Set 2: Farmer ($A$), Shoemaker ($B$), Food ($C$), Product ($D$)**
  *   **Function:** Introduces *Demand* ($chreia$).
  *   **Logic:** Aristotle notes here that if men didn't *need* each other's goods, exchange wouldn't happen.
  *   **Shift:** He moves from "Status" to "Need." This is the bridge. The geometric proportion ($A:B$) is grounded in the Polis hierarchy, but the *possibility* of equating them is grounded in mutual need.

  **Set 3: House ($A$), 10 Minae ($B$), Bed ($C$)**
  *   **Function:** Introduces *Money* as the technical solution.
  *   **Logic:** Commensurability.
  *   **Shift:** Notice $B$ is no longer a person (Shoemaker/Farmer). $B$ is now **Money** (10 Minae).
  *   **Why the shift?** You cannot solve the four-term proportion ($A:B :: D:C$) if you cannot quantify $C$ against $D$. Money ($B$) acts as the common denominator.
  *   **Is it consistent?** Yes, but it changes the equation from a **Proportion of Persons** to a **Equation of Prices**.
      *   Set 1 asks: "How many shoes equal a house to satisfy justice between a Builder and a Shoemaker?"
      *   Set 3 asks: "How many beds equal a house in terms of currency?"
      *   Aristotle implies that if you solve Set 3 (Price), you can plug those values back into Set 1 to satisfy Justice. Money makes the "cross-conjunction" calculable.

  ### 3. Demand ($Chreia$) vs. Geometric Proportion

  This is the crux of the Marx critique. Marx argues Aristotle failed to find the "common substance" (labor time) and retreated to "demand," which Marx saw as circular.

  **Is Aristotle groping toward Subjective Value?**
  Not exactly. Modern subjective value theory says value is determined by individual marginal utility. Aristotle's *chreia* is closer to **social necessity**.
  *   **Text:** *"This unit is in truth demand, which holds all things together."*
  *   **Interpretation:** A house and a bed are physically incomparable. They become comparable only because the *Polis* needs both. The "unit" is not the physical object, nor the labor hours, but the **social need** that the object fulfills.
  *   **Money's Role:** Money is the "representative of demand." It crystallizes social need into a token.

  **Does this contradict the Geometric Proportion?**
  It creates a tension, but not a contradiction.
  1.  **Geometric Proportion ($A:B$):** Determines the *relative status* of the exchangers. (e.g., A Doctor is worth 5 Farmers). This is objective/ontological for Aristotle.
  2.  **Demand ($Chreia$):** Makes the goods *commensurable* so the exchange can happen at all.
  3.  **Money:** Measures the Demand.

  **The Synthesis:**
  Aristotle is saying: "To have justice, the exchange ratio must reflect the ratio of the persons' worth ($A:B$). But to calculate that, we need to compare the goods ($C:D$). We can only compare goods because there is a social demand for them ($chreia$), which money measures."

  So, is it objective or subjective? It's **intersubjective**. It's not "how much I want this bed" (subjective), nor "how many hours to build this bed" (objective labor). It is "how much this bed matters for the functioning of the community" (social value), represented by money.

  Marx is half-right: Aristotle lacks a theory of *abstract labor*. But he isn't "confused"; he is intentionally rejecting labor as the source of value. For Aristotle, value comes from **function within the Polis**. A shoe is valuable because the Polis needs feet protected, not because a cobbler sweated.

  ### 4. The Arithmetic of the "Five Beds"

  Let's crunch the numbers in the final example to see if it breaks the earlier logic.

  **The Setup:**
  *   $A$ = House
  *   $B$ = 10 Minae (Money)
  *   $C$ = Bed

  **The Values:**
  *   "A is half of B": House = 5 Minae.
  *   "C is a tenth of B": Bed = 1 Mina. (Since $B$ is 10, 1/10th is 1).

  **The Calculation:**
  *   House (5) / Bed (1) = 5.
  *   Therefore, 5 Beds = 1 House.

  **Is this consistent with the Four-Term Setup?**
  In the four-term setup ($A_{person} : B_{person} :: D_{good} : C_{good}$), we needed to equate the goods to satisfy the persons.
  Here, Aristotle has collapsed the "Person" terms entirely. He is demonstrating **Commensurability**, not **Reciprocity**.

  *   **Earlier:** We needed to know *why* 5 beds for 1 house is *just*. (Answer: Because the Builder's status relative to the Shoemaker demands it).
  *   **Now:** We are showing *how* we know 5 beds equal 1 house *mathematically*. (Answer: Because both equal specific amounts of Money).

  **Did he change the subject?**
  He narrowed the focus.
  1.  **Book V, Ch 5 Start:** Justice in Exchange (Ethical).
  2.  **Book V, Ch 5 End:** Measurement of Value (Economic).

  The "Five Beds" example proves that money solves the **incommensurability problem** raised in the "Builder/Shoemaker" example.
  *   Problem: How to compare House to Shoe?
  *   Solution: Compare House to Money, and Shoe to Money.
  *   Result: If House = 5 minae and Shoe = 1/10 mina (hypothetically), then House = 50 Shoes.

  **One Inconsistency to Note:**
  In the "Five Beds" example, $B$ is Money. In the "Builder/Shoemaker" example, $B$ was a Person.
  *   If we try to map them directly:
      *   Old $B$ (Shoemaker) $\neq$ New $B$ (10 Minae).
  *   This suggests Aristotle realizes the 4-term proportion is the *ethical ideal*, but the 3-term price mechanism (Good-Money-Good) is the *practical reality*.
  *   He doesn't explicitly solve how to map the "Builder's Status" onto the "5 Minae." He assumes the market price (driven by *chreia*) roughly reflects the social worth. If it doesn't (e.g., if a flute-player makes more than a general), that's a corruption of the Polis, not a failure of the math.

  ### Summary for Your Seminar

  1.  **Cross-Conjunction:** It's a diagonal pairing ($A:B :: D:C$) that ensures the *return* matches the *status*. If you don't cross it, the superior person gives high value and gets low value.
  2.  **Both Excesses:** A warning against calculating the ratio *after* goods have moved. If you do, you break the link between Producer and Product, potentially allowing one party to hold both the "greater" status and the "greater" goods in the equation.
  3.  **Variable Shift:** It's a progression. Set 1 & 2 are the **Ethical Framework** (Persons/Need). Set 3 is the **Economic Mechanism** (Money/Price). Money is the tool that makes the Ethical Framework executable.
  4.  **Demand vs. Proportion:** Not subjective utility. *Chreia* is social necessity. Money measures social necessity, which allows us to calculate the geometric proportion of justice.
  5.  **Arithmetic:** The "Five Beds" is consistent as a demonstration of commensurability. It solves the "how to measure" problem so the "how to be just" problem can be addressed.

  Your officemate sees incoherence because he wants a unified theory of value (like Marx or Smith). Aristotle is offering a unified theory of **social cohesion**. Economics is subordinate to Politics. The math works only insofar as it holds the City together.
