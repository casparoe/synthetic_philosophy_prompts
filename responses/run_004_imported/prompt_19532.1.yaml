      *   *Support 2 (Truth):* Ramsey's deflationism. If truth is just successful assertion or agreement, then asking for the "truth condition" of a conditional is a category mistake. The Ramsey Test gives *assertibility conditions*, not truth conditions.
      *   *Support 3 (Methodology):* Ramsey dissolves puzzles. Lewis presents a puzzle (Triviality). The solution is to stop asking the question that generates the puzzle (i.e., "What is the truth value?").
      *   *Counter-argument consideration:* Did Ramsey explicitly say conditionals lack truth values? No, he died in 1930. But his trajectory (Facts and Propositions -> General Propositions) points away from truth-conditionalism for logical connectives.
      *   *Refining the stance:* Ramsey would likely say Lewis proved that the *metaphysical* picture of conditionals (as facts) is wrong, leaving the *pragmatic* picture (the Test) intact.

