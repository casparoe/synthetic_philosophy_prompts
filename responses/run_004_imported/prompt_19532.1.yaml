      *   *Truth/Propositions:* Deflationary/Pragmatic. In "Facts and Propositions," he leans towards a redundancy theory or a pragmatic account. Truth isn't a deep metaphysical property.
      *   *Conditionals:* The famous footnote in "General Propositions and Causality" (1929). He talks about two people arguing "If $p$, then $q$" while doubting $p$. They add $p$ hypothetically to their stock of knowledge and argue about $q$.
      *   *Methodology:* He was a "dissolver." He often tried to show that philosophical problems arose from linguistic confusion or misplaced metaphysical demands (e.g., his critique of Keynes's logical probability).

  3.  **Analyze Lewis's Triviality Result:**
