      *   Lewis assumes Adams' Thesis (Ramsey's intuition): $P(\text{if } p \text{ then } q) = P(q|p)$.
      *   *Result:* If all three hold, probability functions are trivial (can only distinguish very few possibilities).
      *   *Standard Reaction:* Most philosophers (Stalnaker, etc.) abandon the idea that conditionals are propositions (they are non-truth-apt assertions) OR they restrict Adams' Thesis.

  4.  **Synthesize: Ramsey vs. Lewis:**
