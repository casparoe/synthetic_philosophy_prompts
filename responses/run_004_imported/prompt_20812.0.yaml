      *   **Section 2: The Epistemic Objection:**
          *   Argument: Soldiers can't know the truth.
          *   McMahan's Response: They can know *enough* (manifest injustice).
          *   Critique: McMahan underestimates the fog of propaganda and the division of moral labor. If we demand moral scrutiny from every rifleman, we risk paralysis or subjective chaos.
      *   **Section 3: Benbaji's Contractarian Defense:**
