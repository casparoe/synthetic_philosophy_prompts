      *   **McMahan (Revisionist):** Killing is only permissible in self/other-defense against liable threats. Unjust combatants pose an unjust threat; just combatants pose a just threat. Therefore, unjust combatants generally lack the right to kill just combatants. MEC is false at the level of deep morality.
      *   **The Defenses of MEC:**
          *   *Epistemic:* Soldiers lack information/authority to judge the war's justice. If we deny MEC, they might refrain from fighting just wars or fight unjust ones thinking they are just.
          *   *Benbaji (Contractarian):* Even if MEC is morally false, it's a useful convention. Like rules of a game. It reduces overall harm by encouraging compliance with *in bello* rules regardless of *ad bellum* status.
          *   *Lazar (Associative):* Special duties to protect one's own community might override general duties not to harm unjust aggressors, providing a pro tanto permission.
      *   **McMahan's Concession:** Morality says one thing (no right to kill for unjust combatants), but Law/Policy might need to say another (treat them as POWs, etc.) to avoid worse outcomes (e.g., no quarter given).

  3.  **Select Defenses to Engage:**
