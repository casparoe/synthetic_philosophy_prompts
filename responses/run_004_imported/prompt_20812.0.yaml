answer: |-
  **Title:** The Fault Line of Liability: Adjudicating the Moral Equality of Combatants

  **Introduction**

  For decades, the architecture of Just War Theory rested upon the twin pillars of *jus ad bellum* (justice of war) and *jus in bello* (justice in conduct), held together by Michael Walzer's doctrine of the Moral Equality of Combatants (MEC). Under Walzer's "Independence Thesis," the permissions governing conduct in war are detached from the justice of the cause; soldiers on opposing sides face one another as moral equals, possessing symmetrical rights to kill and equal vulnerabilities to being killed. This orthodoxy has been shattered by Jeff McMahan's revisionist account. By grounding the permission to kill in moral liability rather than status, McMahan argues that unjust combatants, by contributing to an unjust threat, generally lack the right to kill just combatants. This essay adjudicates the dispute between the Traditional and Revisionist accounts. I will engage substantively with the epistemic defense of MEC and Yitzhak Benbaji's contractarian convention argument, assessing McMahan's counter-responses. Furthermore, I will analyze the implications of McMahan's concession regarding the divergence between "deep morality" and the Law of Armed Conflict (LOAC). I conclude that while McMahan is correct regarding the deep morality of killing, the MEC should not be abandoned but **reconstructed** as a necessary legal convention that operates independently of, yet remains constrained by, asymmetric moral reality.

  **The Revisionist Challenge**

  To understand the magnitude of McMahan's intervention, one must recognize that Walzer's MEC relies on a conception of soldiers as instruments of the state, trapped in a "coercive apparatus" that absolves them of personal responsibility for the war's justice. McMahan rejects this metaphysical shield. Drawing on standard self-defense principles in ordinary morality, he posits that one is only liable to be killed if one is morally responsible for an unjust threat. Consequently, just combatants, acting in defense of others, do not make themselves liable to attack. Unjust combatants, however, are analogous to culpable aggressors in a street fight; their adherence to *in bello* rules (discrimination, proportionality) mitigates their blameworthiness but does not render them non-liable. Thus, the permission to kill tracks the *ad bellum* status. The Independence Thesis is false; *jus in bello* is deeply entangled with *jus ad bellum*.

  **The Epistemic Objection and McMahan's Response**

  The most persistent defense of MEC is epistemic. Traditionalists argue that ordinary soldiers lack the access to information, the analytical capacity, and the political authority to determine the justice of their nation's cause. If we deny MEC, we risk paralyzing soldiers who might reasonably doubt their cause, or worse, incentivize subjective moralizing where every soldier deems their own cause just.

  McMahan responds by lowering the epistemic bar. He argues that soldiers are not required to conduct a geopolitical audit but must simply avoid participating in "manifestly" unjust wars (e.g., clear aggression). He contends that the epistemic objection confuses the *difficulty* of judgment with the *impossibility* of judgment.

  However, McMahan's response here is insufficiently sensitive to the modern information environment. The "manifest injustice" threshold is increasingly porous in an era of hybrid warfare, humanitarian interventionism, and state-controlled media. A soldier in a democratic society may genuinely believe a preemptive strike is defensive; a soldier in an autocracy may face severe punishment for dissent. By insisting that moral liability attaches to individual participation, McMahan risks creating a moral burden that the division of moral labor in modern states is designed to preclude. While McMahan is right that "I was just following orders" is not a get-out-of-hell-free card, the epistemic defense highlights that MEC serves a functional role: it prevents the battlefield from becoming a tribunal of competing subjective justices. McMahan succeeds in showing that soldiers are not *moral automatons*, but he underestimates the systemic chaos that ensues if the right to kill is contingent on individual *ad bellum* verification.

  **Benbaji's Contractarian Defense**

  A more robust defense of MEC comes from Yitzhak Benbaji, who argues from a contractarian perspective. Benbaji concedes that McMahan is likely right about "deep morality"—that unjust combatants are indeed morally liable. However, Benbaji argues that the rules of war should be viewed as a mutually beneficial convention between states. If both sides accept MEC, unjust combatants have an incentive to comply with *in bello* restrictions (like not targeting civilians) because they know they will be treated as POWs rather than murderers if captured. If we adopt Revisionism, unjust combatants have nothing to lose; they are liable to be killed regardless of their conduct, incentivizing total war.

  McMahan rejects this utilitarian calculation of rights. He argues that conventions cannot override fundamental moral rights. To agree to a convention that grants unjust combatants a "right" to kill just combatants is akin to agreeing that murderers have a right to kill police officers if it reduces overall violence. For McMahan, the moral truth cannot be bargained away for pragmatic gain.

  Benbaji's argument, however, exposes a vulnerability in Revisionist institutionalization. McMahan's refusal to validate the convention rests on a deontological rigidity that may be ill-suited for the collective action problem of war. If the goal of ethics is to minimize suffering, a convention that reduces *in bello* violations at the cost of theoretical moral purity may be preferable. Yet, Benbaji's defense is not without flaws. It assumes that unjust combatants are rational actors responsive to legal incentives, which is not always the case. Furthermore, it risks legitimizing aggression by insulating aggressors from the moral consequences of their initiation of force. McMahan succeeds in showing that Benbaji's convention cannot change the *moral* status of the combatants, but Benbaji succeeds in showing that the *regulative* status of combatants might need to differ from their moral status to prevent greater evils.

  **The Divergence of Morality and Law**

  This tension leads to McMahan's crucial concession: the "deep morality" of war may diverge from the Law of Armed Conflict (LOAC). McMahan acknowledges that while unjust combatants may lack the moral right to fight, the law might still grant them combatant immunity and POW status to encourage compliance with *in bello* norms and ensure reciprocity.

  This concession is the linchpin for a resolution. It admits that Revisionism is morally superior but pragmatically hazardous as a legal code. However, this dualism carries a cost. It creates a schizophrenic normative environment where a soldier is legally permitted to do what is morally forbidden. For the PhD ethicist, this is a stable theoretical position; for the soldier in the field, it is a potential crisis of conscience. If the law tells a soldier they are protected, but morality tells them they are liable, which guides action?

  Nevertheless, this divergence is not a bug but a feature of a reconstructed MEC. It allows us to maintain the Walzerian legal structure necessary for containment while accepting the McMahanite moral critique necessary for accountability. It shifts the burden of *ad bellum* justice back to the political leadership (who possess the epistemic capacity McMahan demands) while retaining the *in bello* symmetry required for battlefield restraint.

  **Verdict: Reconstructing the Equality of Combatants**

  Should the Moral Equality of Combatants be abandoned, retained, or reconstructed? My verdict is that it must be **reconstructed**.

  To **abandon** MEC entirely, as strict Revisionism suggests, is to ignore the epistemic limitations of soldiers and the pragmatic necessity of symmetrical rules for limiting savagery. A battlefield where every soldier acts as a judge of *jus ad bellum* is a battlefield where no quarter is given and *in bello* constraints collapse. McMahan's liability account is the truth of *morality*, but it is a poor blueprint for *law*.

  To **retain** MEC in its traditional Walzerian form is to perpetuate a moral fiction that absolves individuals of complicity in manifest aggression. It creates a "moral magic" where putting on a uniform erases the distinction between defender and aggressor. This is untenable for a coherent ethical theory.

  Therefore, we must **reconstruct** MEC as a *legal convention* grounded in *moral asymmetry*.
  1.  **Morally:** We accept McMahan's liability account. Unjust combatants are morally liable; just combatants are not. This preserves the integrity of ethical judgment and holds political leaders and willing participants in manifest aggression accountable.
  2.  **Legally:** We retain a modified MEC. Combatant privilege and POW status remain symmetrical to incentivize *in bello* compliance, *provided* the war is not one of manifest aggression (e.g., genocide or clear conquest).
  3.  **Epistemically:** We place the burden of *ad bellum* judgment on the chain of command and the political sphere, not the individual rifleman, unless the injustice is manifest.

  This reconstruction acknowledges the fault line McMahan opened without letting the bridge collapse. It accepts that the law of war is a tragic compromise, not a perfect reflection of moral truth. By decoupling the legal equality of combatants from their moral equality, we can demand moral responsibility from leaders and egregious participants while maintaining the conventional constraints that prevent war from descending into absolute barbarism. The Moral Equality of Combatants is false as a statement of deep morality, but it remains indispensable as a reconstructed norm of international law.
