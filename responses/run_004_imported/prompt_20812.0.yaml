          *   McMahan's Response: Conventions can't override fundamental rights (you can't agree to murder).
          *   Critique: Benbaji isn't saying murder is okay; he's saying the *institution* of war functions better with symmetrical rules. However, McMahan has a point that conventions shouldn't validate grave wrongs.
          *   Synthesis: The convention is useful for *in bello* compliance, but dangerous for *ad bellum* restraint.
