prompt: |-
  I've followed the debates about discounting the future that recur in rationalist and effective-altruist circles, and one point that usually gets treated as settled has always puzzled me. Following Sidgwick, and echoing Frank Ramsey's remark that such discounting is merely a failure of imagination, Parfit devotes much of Reasons and Persons to arguing that pure time preference — discounting future well-being simply because it is future — is indefensible: there's no more reason to discount someone's well-being for lying fifty years ahead than for lying on the other side of the world. This is close to a consensus among philosophers and economists who have written on the ethics of discounting. Given that, I'm puzzled why economists still treat the size of the social discount rate as a live controversy, and why prominent critics of the Stern Review's very low rate, such as Nordhaus, weren't simply committing an elementary philosophical error by pushing for something substantially higher. If the argument against pure time preference is this decisive, shouldn't something close to zero simply be the correct rate for evaluating climate and existential-risk policy, with continued resistance just a sign that economics hasn't caught up with the philosophy?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Premise:** The user notes a strong philosophical consensus (Sidgwick, Ramsey, Parfit) that *pure time preference* (discounting the future simply because it is in the future) is ethically indefensible.
      *   **Observation:** Despite this, economists still debate the social discount rate (SDR). Prominent economists (like Nordhaus) criticized the Stern Review for using a near-zero rate, arguing for higher rates.
      *   **Question:** If the philosophical argument is decisive, why isn't the economic consensus near zero? Are economists committing an elementary philosophical error, or is there something else going on?
      *   **Context:** Rationalist/EA circles, climate policy (Stern vs. Nordhaus), ethics vs. economics.

  2.  **Initial Assessment & Fact-Checking:**
      *   *Philosophical Consensus:* Yes, Parfit's argument in *Reasons and Persons* is influential. The idea that "date of birth" shouldn't matter morally is widely accepted in normative ethics.
      *   *Economic Controversy:* Yes, the Stern Review (2006) used a near-zero pure time preference rate ($\delta \approx 0.1\%$), leading to aggressive climate action recommendations. Nordhaus and others criticized this, preferring higher rates (e.g., $\delta \approx 1-3\%$), leading to more gradual action.
      *   *Is it an "Elementary Error"?* This is the crux. It's too simplistic to say economists are just ignoring philosophy. There are substantive reasons for the disagreement, ranging from descriptive vs. normative approaches to opportunity costs and growth assumptions.

  3.  **Deconstruct the Disagreement (Stern vs. Nordhaus):**
      *   **The Ramsey Equation:** $r = \delta + \eta \cdot g$.
          *   $r$: Social discount rate.
          *   $\delta$: Pure time preference (impatience).
          *   $\eta$: Elasticity of marginal utility of consumption (aversion to inequality).
          *   $g$: Growth rate of consumption.
      *   **Stern's Position:** $\delta \approx 0$ (ethical), $\eta \approx 1$. Result: Low $r$, high present value of future damages $\rightarrow$ aggressive mitigation.
      *   **Nordhaus's Position:** $\delta > 0$ (descriptive/market-based), $\eta \approx 1-2$. Result: Higher $r$, lower present value of future damages $\rightarrow$ gradual mitigation.
      *   **The Key Conflict:** Is the discount rate a *normative* ethical parameter or a *descriptive* market parameter?

  4.  **Identify Reasons for the Economic Resistance to Zero Discounting:**
      *   *Descriptive vs. Normative:* Economists often argue the SDR should reflect observed market rates (revealed preference) rather than abstract ethics. If people *do* discount the future, policy should reflect that to avoid intergenerational imposition.
      *   *Opportunity Cost of Capital:* Investment today yields growth. If the market return is 4-5%, why invest in a climate project yielding 1%? (Though this conflates risk-free rates with project-specific returns).
      *   *Growth Assumptions ($g$):* If future generations are much richer, marginal utility of consumption is lower. We might transfer less to them not because they matter less ($\delta$), but because they are richer ($\eta \cdot g$).
      *   *Catastrophic Risk/Uncertainty:* Weitzman's "Dismal Theorem." Fat tails might justify low discounting even without low $\delta$.
      *   *Political Feasibility:* A near-zero rate implies massive sacrifices now for distant gains. Is this politically sustainable?
      *   *Existential Risk:* If there's a chance humanity won't exist, effective discounting happens naturally (probability of extinction).

  5.  **Address the "Philosophical Error" Charge:**
      *   It's not necessarily an error, but a difference in *domain*.
      *   Philosophers ask: "What is morally right?"
      *   Economists ask: "What is feasible/consistent with observed behavior/macro stability?"
      *   However, many welfare economists *agree* with Parfit on the ethics but argue for positive discounting due to *growth* (the $\eta \cdot g$ term), not pure time preference.
      *   Nordhaus specifically argued that Stern's rate was inconsistent with observed market behavior, implying arbitrage opportunities or unrealistic sacrifice.

  6.  **Synthesize the Argument:**
      *   Acknowledge the strength of the Parfit/Sidgwick argument (it *is* ethically dominant).
      *   Clarify the Ramsey Formula distinction between $\delta$ (pure time) and $r$ (overall rate).
      *   Explain Nordhaus's critique: It wasn't just about $\delta$, it was about consistency with market returns and growth.
      *   Highlight the "Ought vs. Is" gap: Normative ethics vs. Positive economics/Policy feasibility.
      *   Mention the "Rich Future" argument (diminishing marginal utility).
      *   Mention Existential Risk (probability of non-existence acts like discounting).
      *   Conclusion: It's not that economists are philosophically illiterate, but that they weigh additional constraints (market consistency, growth, political reality) that philosophers might bracket out.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Respectful, nuanced, acknowledging the user's familiarity with the literature.
      *   *Structure:*
          1.  Validate the user's premise (Parfit is right on ethics).
          2.  Distinguish Pure Time Preference ($\delta$) from the Social Discount Rate ($r$).
          3.  Explain the Stern-Nordhaus debate specifics (Ramsey Equation).
          4.  List reasons for non-zero rates that aren't "pure time preference" (Growth, Opportunity Cost, Uncertainty).
          5.  Discuss the Descriptive vs. Normative divide.
          6.  Address the "Error" claim directly.
      *   *Refinement:* Make sure to mention Weitzman and the concept of declining discount rates over time (hyperbolic discounting) as a middle ground. Ensure the distinction between *discounting welfare* and *discounting consumption* is clear.

  8.  **Final Polish:** Check for clarity on the Ramsey equation components. Ensure the distinction between "discounting well-being" (unethical) and "discounting consumption" (potentially ethical if future is richer) is highlighted. (Self-Correction: Nordhaus did argue for a positive $\delta$, not just growth effects, so acknowledge that he did defend some pure time preference based on revealed preference/survival probability).

  9.  **Final Output Generation:** (matches the detailed response provided previously.)
answer: |-
  You have identified one of the most significant fault lines between normative ethics and welfare economics. Your summary of the philosophical consensus is accurate: within moral philosophy, the argument against *pure time preference* (PTP)—the idea that we should value a unit of well-being less simply because it occurs later—is indeed considered decisive by most. Parfit's "No Difference" argument and Ramsey's "failure of imagination" remark are standard bearers for this view.

  However, characterizing economists like William Nordhaus as committing an "elementary philosophical error" misses the nuance of why the debate persists. The disagreement is not merely a case of economics lagging behind philosophy; it stems from fundamental disagreements about the **purpose of the discount rate**, the **interpretation of the Ramsey equation**, and the **trade-off between ethical consistency and economic feasibility**.

  Here is a breakdown of why the social discount rate (SDR) remains a live controversy despite the philosophical consensus.

  ### 1. The Ramsey Equation: Distinguishing $\delta$ from $r$
  The core of the technical debate lies in the Ramsey formula for the social discount rate:

  $$r = \delta + \eta \cdot g$$

  *   **$r$**: The social discount rate (the rate at which we discount future consumption).
  *   **$\delta$ (delta)**: The **pure time preference** rate (the ethical parameter).
  *   **$\eta$ (eta)**: The elasticity of marginal utility of consumption (aversion to inequality).
  *   **$g$**: The expected growth rate of per capita consumption.

  **Stern's Position:** Stern accepted the Parfitian view. He set $\delta \approx 0.1\%$ (effectively zero, allowing only for existential risk). With standard values for $\eta$ and $g$, this resulted in a very low $r$ (~1.4%). This implies we should sacrifice significantly today to prevent damages far in the future.

  **Nordhaus's Position:** Nordhaus argued for a higher $r$ (~5-6%). Crucially, Nordhaus did not necessarily argue that future *lives* matter less. His critique focused on two areas:
  1.  **Descriptive Consistency:** He argued that $\delta$ should reflect observed market behavior (revealed preference). If society *actually* discounts the future (via interest rates), imposing a near-zero rate forces current generations to save at rates they would not voluntarily choose, which he viewed as undemocratic or paternalistic.
  2.  **Opportunity Cost:** If capital yields a high return in the market, investing in climate mitigation with a low return is inefficient. We could grow the economy faster and let future generations (who will be richer) solve the problem.

  While Stern was arguing from **normative ethics** (what *ought* we to do?), Nordhaus was arguing from **positive economics** and **policy feasibility** (what *can* we sustain without breaking the economic model?).

  ### 2. Discounting Consumption vs. Discounting Welfare
  A major source of confusion is conflating discounting *well-being* with discounting *consumption*.

  Most economists agree with Parfit that we should not discount **utility** (well-being) based on time. However, cost-benefit analysis usually operates in terms of **consumption** (dollars).
  *   If we expect future generations to be much richer than us ($g > 0$), the marginal utility of an extra dollar to them is lower than it is to us.
  *   Therefore, even if $\delta = 0$, the term $\eta \cdot g$ creates a positive discount rate for *consumption*.

  Nordhaus and others argue that if we assume continuous economic growth, future people will be wealthier. Transferring massive resources from relatively poor current generations to relatively rich future generations might be ethically questionable under a prioritarian framework, regardless of pure time preference. Stern assumed lower growth rates and higher climate damages, which shifted the balance.

  ### 3. The "Ought-Is" Gap and Revealed Preference
  Philosophers generally treat the discount rate as an ethical parameter to be derived from first principles. Many economists treat it as a parameter that must align with the **opportunity cost of capital**.

  If the government uses a discount rate of 0.1% while the market return on capital is 5%, economic theory suggests this leads to over-investment in long-term projects and under-investment in short-term growth. Nordhaus argued that Stern's rate was inconsistent with observed interest rates. If the market says time is valuable (people demand interest to defer consumption), the state ignoring this creates distortions.

  From this perspective, using a near-zero rate isn't "more ethical"; it is **macroeconomically incoherent**. It implies a level of saving that current populations are unwilling to make, potentially stalling development now to solve problems later.

  ### 4. Existential Risk as Effective Discounting
  There is a philosophical justification for a positive discount rate that does not rely on "pure time preference" in the discriminatory sense: **the probability of extinction.**

  If there is a non-zero probability that humanity (or the specific polity) will not exist in 100 years, then the *expected value* of future benefits declines over time. This looks mathematically like discounting, but it is based on contingency, not temporal bias.
  *   Stern included a small factor for this (~0.1%).
  *   Critics argue this probability is higher, or that societal continuity is less guaranteed than Stern assumed. If there is a 1% annual chance of civilizational collapse, the effective discount rate rises by 1%, regardless of ethics.

  ### 5. Declining Discount Rates (The Middle Ground)
  In recent years, the debate has moved toward **time-declining discount rates** (hyperbolic discounting).
  *   Standard economics uses exponential discounting (constant rate).
  *   Weitzman and others argued that under deep uncertainty about the correct rate, the "certainty equivalent" discount rate declines over time.
  *   This allows for a higher rate in the short term (matching market rates/growth) and a near-zero rate in the long term (respecting Parfitian ethics for distant generations).

  This approach attempts to satisfy the economists' concern for market consistency in the near term and the philosophers' concern for intergenerational equity in the long term.

  ### 6. Is it an "Elementary Error"?
  To answer your specific question: **No, it is not an elementary philosophical error, but it is a divergence in methodology.**

  *   **Philosophers** ask: "What is the moral value of a future person's welfare?" (Answer: Equal to a present person's).
  *   **Economists** ask: "What is the shadow price of capital across time given growth, risk, and constraints?"

  When Nordhaus criticized Stern, he was not necessarily arguing that a child born in 2100 matters less than a child born today. He was arguing that:
  1.  The child in 2100 will likely be richer (diminishing marginal utility).
  2.  Forcing the current generation to save at Stern's rate violates revealed preferences and may hinder the growth that makes the future child richer.
  3.  Policy must be politically sustainable; a rate that demands extreme sacrifice for distant, abstract gains may lead to policy collapse.

  ### Conclusion
  The persistence of the debate is not due to economists failing to read Parfit. It is because the **Social Discount Rate** serves two masters: **Ethics** (intergenerational justice) and **Efficiency** (optimal resource allocation).

  Stern prioritized Ethics ($\delta \approx 0$). Nordhaus prioritized Efficiency and Consistency ($\delta > 0$, aligned with markets).

  The rationalist/EA consensus correctly identifies that *pure time preference* is ethically indefensible. However, applying that directly to policy via the Ramsey equation requires assumptions about growth ($g$) and marginal utility ($\eta$) that are empirical, not ethical. Economists resist the near-zero rate not because they think the future doesn't matter, but because they believe a rate that low implies unrealistic sacrifices, ignores the wealth of the future, and disconnects policy from the economic reality of capital allocation.

  The most sophisticated current view (aligned with Weitzman and recent IPCC reports) is a hybrid: acknowledge $\delta \approx 0$ ethically, but allow the *effective* discount rate to be higher in the short run due to growth and uncertainty, declining toward zero over the very long run. This respects Parfit without breaking the economic model.
