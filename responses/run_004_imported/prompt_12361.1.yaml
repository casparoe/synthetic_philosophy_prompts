          *   **Crucial Constraint:** Do not equivocate ("reasonable people disagree"). Give an actual verdict on whether the Basic Argument succeeds.
          *   **Goal:** Provide Miriam with a philosophical grounding for her rebuttal scene. If the argument succeeds, explain what remains of blame/praise. If it fails, explain why.

  2.  **Deconstruct the Basic Argument (Strawson):**
      *   *Premise 1:* You do what you do because of the way you are (mental nature).
      *   *Premise 2:* To be truly responsible for what you do, you must be truly responsible for the way you are (at least in crucial mental respects).
      *   *Premise 3:* You cannot be responsible for the way you are (because that would require a prior choice, which requires a prior nature, leading to infinite regress).
      *   *Conclusion:* True moral responsibility (basic desert) is impossible.
      *   *Indeterminism:* Adding randomness doesn't help; it just adds luck, not control.
      *   *Causa Sui:* Only a self-creating being could escape this, which is logically impossible.

  3.  **Evaluate the Responses:**
      *   *Compatibilism (Fischer/Ravizza, Frankfurt):* They reject Premise 2. They argue responsibility doesn't require *ultimate* origination, only guidance control, reasons-responsiveness, or identification with one's desires.
          *   *Strength:* Matches our actual practices. We don't actually demand *causa sui* in daily life.
          *   *Weakness:* Daniel/Strawson would say this changes the subject. It offers "responsibility-lite," not the deep desert needed for retributive justice (life sentence).
      *   *Libertarianism (Kane):* Attempts to find Self-Forming Actions (SFAs) in moments of indeterministic struggle.
          *   *Strength:* Tries to save ultimate responsibility.
          *   *Weakness:* Strawson's critique hits hard here. If the choice isn't determined by prior character, it's random. If it is determined, it's not free in the libertarian sense. The "luck" objection is devastating.
      *   *Skepticism/Revisionism (Pereboom, Smilansky):* Accepts the Basic Argument.
          *   *Pereboom:* Hard incompatibilism. Rejects basic desert but keeps forward-looking practices (quarantine, rehabilitation).
          *   *Smilansky:* Illusionism. We *need* the belief in free will for society to function, even if it's false.

