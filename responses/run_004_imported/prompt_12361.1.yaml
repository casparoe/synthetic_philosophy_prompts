      *   *For the sake of the essay's coherence:* I will argue that the Basic Argument **succeeds** in its specific aim (refuting Basic Desert) but that this does not entail the nihilism Daniel hopes for. It entails a revision of our practices (Pereboom's path). This gives Miriam the most nuanced ground: "You're right, you aren't a demon. You're just a broken man who needs fixing, not punishing."

