      *   *Actually, looking at the literature:* Most contemporary metaphysicians lean towards Compatibilism or Revisionism. Strawson's argument is respected but often seen as setting a bar too high to be meaningful.
      *   *Okay, I will argue that the Basic Argument fails to abolish responsibility because it defines responsibility in a way that no human practice actually requires.* It attacks a straw man of "True Responsibility."
