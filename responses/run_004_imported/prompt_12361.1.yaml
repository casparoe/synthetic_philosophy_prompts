      *   *Okay, the most honest philosophical verdict:* Strawson wins on metaphysics; Compatibilists win on ethics.
      *   *For the essay:* I will take the position that **The Basic Argument succeeds logically, but its conclusion is bearable.** It kills Retributivism, not Agency. This allows Miriam to say: "You are right, Daniel. You aren't ultimately responsible. So stop trying to be a martyr for determinism and start taking ownership of who you are *now*." This is the Pereboom/P.F. Strawson (Galen's father) synthesis.
      *   *Wait, Galen Strawson's father (P.F. Strawson) argued for "reactive attitudes."* This is the perfect counter. Galen says no ultimate responsibility. P.F. says responsibility *is* the reactive attitudes.
      *   *Okay, Plan:*
