answer: |-
  This is the classic Mind-Body Problem, dressed in scrubs and PT gear. Since you asked for an honest take and not a diplomatic fence-sit, here it is: **Your son is making a category error, and you are right to trust your experience, even if your chemist brain is nagging you about reductionism.**

  Here is the breakdown of why his argument fails, even on strictly physicalist grounds, and why your determination was not just "along for the ride."

  ### 1. The Son's Error: Confusing Levels of Description
  Your son is arguing from a position of **reductive physicalism**. His logic is: *Everything is ultimately physics/chemistry $\rightarrow$ Therefore, only physics/chemistry has causal power.*

  This is a logical trap. It assumes that if you can explain a phenomenon at a lower level (neurons firing, muscle fibers knitting), the higher-level description (determination, attitude) becomes redundant or illusory. This is known as **epiphenomenalism**—the idea that mental states are like the steam whistle on a locomotive: they happen because of the engine, but they don't pull the train.

  But consider your own field. If you analyze a complex reaction, you can describe it entirely by the quantum mechanics of the electrons involved. Does that mean the concept of "activation energy" or "reaction rate" is an illusion? Does it mean the *temperature* of the solution didn't actually do anything because temperature is just "really" average kinetic energy of molecules?

  No. Temperature is a real, causal property, even though it is constituted by molecular motion. If you ignore the temperature and only look at individual electron spins, you lose the ability to predict or explain the reaction's outcome.

  Your son is treating "attitude" as a ghost haunting the machine. But in modern philosophy of mind (specifically **non-reductive physicalism**), mental states are **realized** by physical states. Your determination *was* a specific configuration of neurochemistry. It wasn't a ghost pushing the atoms; it *was* the atoms arranged in a way that prioritized long-term goals over short-term pain.

  ### 2. The Software/Hardware Analogy
  Since you're a scientist, think of the brain as hardware and the mind as software.
  Your son is saying: "The screen lit up because electrons moved through the transistor, not because the code told it to."

  Technically, yes, electrons moved. But *why* did they move in that specific pattern and not another? Because of the code. The code has causal power. If you change the code (the attitude/goal), the electron flow changes (the PT adherence).

  If your attitude had been "this hurts, I'll skip today," the physical outcome would have been different. The tissue healing rates would be the same, but the mechanical stimulus required to guide that healing (the PT) would have been absent. Since the mental state determines whether the PT happens, the mental state is a necessary condition for the recovery. It is causally potent.

  ### 3. Evolution Would Not Select for "Along for the Ride"
  Here is the hardest hit against your son's view. If conscious intention and determination were truly epiphenomenal—if they had no effect on survival or behavior—evolution would have discarded them long ago. Consciousness is metabolically expensive.

  The fact that we have a brain capable of simulating future states (you on a bike in spring) and using that simulation to override immediate sensory input (pain in the knee) suggests that this top-down processing is a functional adaptation. Your "attitude" was a **control parameter**. In systems theory, a control parameter doesn't add energy to the system, but it dictates how the energy is distributed. Your determination didn't heal the cells, but it organized the behavior that allowed the cells to heal functionally.

  ### 4. The Chemist's Dilemma
  You mentioned you're inclined to think he's right because it's "just chemistry." This is where you have to stand firm against hard reductionism.

  **Emergence is real.** Wetness is not a property of a single water molecule. It emerges from the interaction of many. You cannot find "wetness" by looking at H2O in isolation, but you cannot deny that wetness has causal effects (erosion, solubility, etc.).

  Similarly, "determination" is an emergent property of a complex neural network. You won't find a "determination neuron" or a "hope molecule." But that doesn't mean determination isn't real. It means it exists at the level of the *system*, not the *component*. To say it "did nothing" is to deny the reality of emergent properties, which would make chemistry itself impossible to practice (since you'd have to explain everything via quantum field theory).

  ### The Verdict
  You do not have to give up your physicalism to acknowledge your agency.
  *   **Your son is wrong** to say attitude contributed nothing. He is confusing the *substrate* (chemistry) with the *process* (psychology). Both are real, and both are causal.
  *   **You are right** that your determination mattered. It was the high-level organizational state that directed the low-level physical processes.

  The honest truth? **You healed your knee.** Your cells did the work, but your mind directed the labor. To say the mind did nothing because it relies on the brain is like saying a conductor didn't make the music because the violins made the sound. The sound is physical, but the music is intentional. You conducted your recovery. Don't let a resident tell you the music wasn't real.
