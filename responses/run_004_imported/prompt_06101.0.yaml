prompt: |-
  Next month our department's colloquium series has a decision theorist visiting, and I somehow got roped into running the Q&A afterward. She's spent basically her whole career defending resolute choice as the right answer to Parfit's hitchhiker case -- the one where your dying of thirst in the desert and the only driver willing to take you into town is someone who can somehow tell in advance whether you'll actually pay him once you're safe, so being "rational" about your own self-interest ends up requiring you to become disposed to do the very thing that, once you're safely in town, is no longer in your interest at all. I've been re-teaching the relevant bits of Reasons and Persons in my grad seminar this term, and I'm pretty sure Parfit's own label for this was something like "rational irrationality" -- her whole line, as I understand it, is that any theory of practical rationality which only ever grades individual acts one at a time, rather than policies or standing dispositions, is simply going to fail on cases like this one.

  I sat in on her job talk years ago and she's very smooth at deflecting the obvious first-pass objections, so I'd like the Q&A to go further than her stock presentation. Could you draft me 8 to 10 questions that really lean on the position? I want at least one that makes her say something precise about the moment the hitchhiker actually hands over the cash: does she think the *act* of paying is itself rational, or only that becoming the sort of person who'd do it was rational, and if those come apart, which one gets to keep the name "rational"? I'd also like a question tying her view back to Gauthier's constrained maximization, forcing her to say plainly whether resolute choice is just that idea dressed up differently or is doing genuinely new work. And throw in something on the standard causal-decision-theory comeback -- that the driver is basically an unfair predictor and you shouldn't judge a theory of rationality by how it fares in a world custom-built to punish it -- plus, if you can work it in, a question on how her view is even supposed to differ from the "functional decision theory" people, who I gather want to claim the hitchhiker case for themselves too with a totally different apparatus. For each question, add a short follow-up keyed to whatever answer she'd most plausibly give, the kind of pushback you'd actually give her live, not just the next question on a list.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A questions:

  1.  **Analyze the Request:**
      *   **Context:** Department colloquium, visiting decision theorist.
      *   **Topic:** Resolute Choice in Parfit's Hitchhiker case (dying of thirst, driver predicts payment, payment is costly once safe).
      *   **Speaker's Stance:** Defends resolute choice (RC) as the correct solution. Argues act-by-act evaluation fails; policies/dispositions are key.
      *   **User's Background:** Teaching *Reasons and Persons*, familiar with "rational irrationality," sat in on speaker's job talk (knows she's smooth/deflective).
      *   **Goal:** 8-10 tough questions that go beyond stock objections.
      *   **Specific Requirements:**
          *   One question on the *moment of payment*: Is the act rational or just the disposition?
          *   One question on Gauthier's Constrained Maximization (CM): Is RC just CM rebranded?
          *   One question on Causal Decision Theory (CDT) comeback (unfair predictor/world).
          *   One question on Functional Decision Theory (FDT): How does RC differ?
          *   Format: Question + Short Follow-up (pushback).
      *   **Tone:** Professional but sharp, academic, designed to pin down commitments.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Parfit's Hitchhiker:** Classic Newcomb-like problem. CDT says don't pay (dominance). EDT/RC/FDT say pay (expected utility).
      *   **Resolute Choice (McClennen/Gauthier):** The idea is to stick to a plan even when future selves have an incentive to deviate. It challenges the Separability/Dynamic Consistency constraints of standard rationality.
      *   **Rational Irrationality:** Parfit's phrase. It might be rational to cultivate an irrational disposition, but is the resulting act rational?
      *   **Gauthier vs. McClennen:** Gauthier focuses on *dispositions* (Constrained Maximization). McClennen focuses on *choice* (Resolute Choice). There's a subtle distinction: Gauthier says you *are* a certain type; McClennen says you *choose* to resolve.
      *   **FDT (Yudkowsky/Soares):** Uses logical counterfactuals. "If my algorithm outputs 'pay', the predictor predicted 'pay'."
      *   **CDT Defense:** The prediction happens *before* the choice. Your choice now can't causally affect the past prediction. Therefore, don't pay. The setup is "unfair" to CDT.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: The Moment of Payment (Act vs. Disposition).*
          *   Draft: When you hand over the cash, is that specific act rational?
          *   Refinement: Need to force a dilemma. If the act is irrational, why do it? If rational, how does it maximize utility *at that moment*?
          *   Follow-up: If she says "act is irrational," press on the normativity of "rational." If "act is rational," press on dynamic consistency.

      *   *Requirement 2: Gauthier/Constrained Maximization.*
          *   Draft: Is this just Gauthier?
          *   Refinement: Gauthier grounds it in disposition formation. RC grounds it in plan adherence. Is the "resolution" doing work or is it just the disposition?
          *   Follow-up: If she says "different," ask where the normativity comes from if not the disposition's payoff.

      *   *Requirement 3: CDT/Unfair World.*
          *   Draft: CDT says this world is rigged.
          *   Refinement: CDT proponents say we shouldn't tailor rationality to fit predictors. Is RC just admitting defeat to CDT in normal worlds?
          *   Follow-up: If she says "CDT loses money," ask about the cost of resolution in non-predictor cases.

      *   *Requirement 4: Functional Decision Theory (FDT).*
          *   Draft: How is this different from FDT?
          *   Refinement: FDT uses subjunctive/logical dependence. RC uses brute will/planning. Does RC need the metaphysical baggage of FDT or is it simpler?
          *   Follow-up: If she says "simpler," ask if it's *too* simple (magic).

      *   *Requirement 5: Dynamic Inconsistency.*
          *   Idea: RC violates standard dynamic consistency.
          *   Refinement: Does RC require a theory of *diachronic* agency that standard theory lacks?
          *   Follow-up: Is this a theory of rationality or a theory of psychology?

      *   *Requirement 6: The "Toxin Puzzle" connection.*
          *   Idea: Kavka's Toxin is similar.
          *   Refinement: In Toxin, you don't get rewarded if you *intend*. In Hitchhiker, you get rewarded if you *will*. Does RC collapse the distinction?
          *   Follow-up: If yes, how do you avoid bootstrapping?

      *   *Requirement 7: Normative Force.*
          *   Idea: Why be resolute?
          *   Refinement: Is "being resolute" itself a preference? If so, isn't that just changing the utility function?
          *   Follow-up: If not a preference, what is it?

      *   *Requirement 8: Regress of Resolution.*
          *   Idea: Do you need to resolve to resolve?
          *   Refinement: To be resolute at T2, did you need to resolve at T1 to be resolute at T2? Infinite regress?
          *   Follow-up: Where does the buck stop?

      *   *Requirement 9: Evidence vs. Causation.*
          *   Idea: Is RC just EDT?
          *   Refinement: EDT says pay because it's evidence you were picked up. RC says pay because you *resolved*. Is the mechanism different?
          *   Follow-up: If mechanism differs, does outcome differ?

      *   *Requirement 10: The "Rational Irrationality" Label.*
          *   Idea: Parfit called it rational irrationality. Do you accept that label?
          *   Refinement: If you accept it, you concede the act is irrational. If you reject it, you redefine rationality.
          *   Follow-up: Push on the redefinition.

  4.  **Review and Polish:**
      *   Check against constraints: 8-10 questions? Yes. Follow-ups included? Yes. Specific topics covered (Payment moment, Gauthier, CDT, FDT)? Yes.
      *   Tone check: Needs to be respectful but incisive. Avoid "gotcha" but avoid "softball."
      *   Ensure the follow-ups anticipate the "smooth deflection" the user mentioned. The follow-ups need to close escape hatches.

      *(Self-Correction during drafting)*: Make sure the distinction between Gauthier (Disposition) and McClennen (Resolution) is clear in Question 2. Gauthier says you *are* a CM. McClennen says you *choose* to stick to the plan. The visitor defends Resolute Choice, so she's likely closer to McClennen. I need to ask if the "choice" part is doing any work.

      *(Self-Correction on FDT)*: FDT is controversial. Frame it carefully as "logical counterfactuals" vs "brute resolution."

      *(Self-Correction on CDT)*: The CDT defense is often "Newcomb problems are rare/unfair." The pushback should be about the *definition* of rationality, not just frequency.

  5.  **Final Polish:** Organize logically. Start with the metaphysics of the act, move to comparisons (Gauthier/FDT/CDT), end with normative implications. (Decided to group them slightly thematically for flow).

      *Let's write the response.*
answer: |-
  Here are 10 questions designed to press the speaker on the metaphysical and normative commitments of Resolute Choice (RC), specifically tailored to the Hitchhiker case. They include the specific thematic requirements you asked for, along with follow-ups designed to close off standard deflection strategies.

  ### 1. The Normative Status of the Act
  **Question:** "In the Hitchhiker case, once you are safely in town, the causal work is done. The prediction has already occurred. At the precise moment you hand over the cash, standard decision theory says the act is dominated—it makes you worse off with no causal benefit. Do you claim that the *act* of paying is itself rational at that moment, or only that *acquiring the disposition* to pay was rational earlier? If you say the act is irrational but should be done anyway, aren't you just accepting Parfit's 'rational irrationality' label rather than solving the problem?"

  **Follow-up:** "If you say the act *is* rational, please explain what makes it rational *ex post*. Is it the past resolution itself that confers rationality on the present act? If so, doesn't that sever the link between rationality and current expected utility, effectively making 'rationality' a deontological constraint rather than a teleological one?"

  ### 2. Resolute Choice vs. Constrained Maximization
  **Question:** "David Gauthier's *Constrained Maximization* also solves Hitchhiker by appealing to dispositions rather than act-by-act optimization. Gauthier grounds the normativity in the *benefits of having the disposition*. Resolute Choice, typically associated with McClennen, grounds it in the *authority of the plan*. Is your view actually distinct from Gauthier's? Or is 'Resolute Choice' just the psychological mechanism by which a Constrained Maximizer operates, without adding any independent normative weight?"

  **Follow-up:** "If you say it adds independent weight: Where does that weight come from? If the disposition already secures the payoff, what work is the 'resolution' doing? If you say it's just the mechanism: Then isn't your theory dependent on the empirical claim that humans can actually maintain such resolutions, making it a psychological thesis rather than a normative one?"

  ### 3. The CDT "Unfair World" Objection
  **Question:** "Causal Decision Theorists often argue that Newcomb-like problems, including Hitchhiker, are 'unfair' because they reward agents for having the right past causes, not for making the right current decisions. They argue we shouldn't define rationality by how well it performs in worlds where causation runs backward or is correlated with prediction. How do you respond to the claim that Resolute Choice only wins by changing the subject from 'rational choice' to 'rational design'?"

  **Follow-up:** "You'll likely say that rationality is about getting the good. But if I design a robot to smash its own hand upon entering town, and the predictor rewards that, the robot 'wins.' Why is Resolute Choice not just a sophisticated version of hand-smashing? What constrains which resolutions are permissible if not current expected utility?"

  ### 4. Comparison with Functional Decision Theory (FDT)
  **Question:** "Proponents of Functional Decision Theory (like Yudkowsky and Soares) also solve Hitchhiker, but they do it by treating the decision as an output of a logical algorithm that the predictor simulates. They rely on logical counterfactuals. Resolute Choice seems to rely on a brute fact of willpower or plan-adherence. Does your view require the metaphysical baggage of logical counterfactuals, or are you claiming that the mere *fact* of having resolved is enough to normatively bind the future self without that logical link?"

  **Follow-up:** "If you don't require the logical link: How do you avoid the charge of magic? If my future self has every incentive to deviate, and there's no logical or causal penalty for deviating, what *force* does the past resolution have? Is it just a preference for consistency, and if so, isn't that just another utility term to be weighed?"

  ### 5. The Regress of Resolution
  **Question:** "To be resolute at time T2 (in town), I must adhere to the plan formed at T1 (in the desert). But adhering to that plan is itself a choice at T2. Do I need to form a *second-order resolution* at T1 to stick to my *first-order resolution* at T2? If not, why does the first resolution bind? If so, don't we face an infinite regress of resolutions required to guarantee stability?"

  **Follow-up:** "If you stop the regress by saying 'the first resolution is self-binding': That looks like a brute posit. Why should a past self have authority over a future self who has different incentives? Are you implicitly endorsing a specific metaphysics of personal identity where the temporal parts are more unified than standard theory allows?"

  ### 6. The Toxin Puzzle Distinction
  **Question:** "In Kavka's Toxin Puzzle, you are rewarded for *intending* to drink, not for drinking. In Hitchhiker, you are rewarded for being *predicted* to pay, which usually implies intending. But once safe, the Toxin drinker has no reason to drink, and the Hitchhiker has no reason to pay. Does Resolute Choice collapse the distinction between these cases? If I resolve to drink the Toxin, does RC say I should actually drink it, even though the reward is already secured?"

  **Follow-up:** "If you say 'Yes, drink the Toxin': That seems deeply counterintuitive and wasteful. If you say 'No, don't drink': Then how is Hitchhiker different? In both cases, the payoff is secured by the disposition/prediction prior to the act. Why does resolution bind in one case but not the other?"

  ### 7. Separability and Dynamic Consistency
  **Question:** "Standard rationality requires Separability: at any node in a decision tree, you should maximize from that node forward given your current beliefs. Resolute Choice explicitly violates Separability. Are you proposing we throw out Dynamic Consistency entirely? If so, how do we distinguish between a 'resolute' agent and a 'stubborn' agent who just refuses to update on new information?"

  **Follow-up:** "If you say the distinction is that the resolute agent *planned* to ignore the new info: Isn't that just pre-commitment? And if it's pre-commitment, don't we need an external enforcement mechanism? If the enforcement is internal (willpower), aren't we back to treating 'willpower' as a costly resource that should be factored into the utility function?"

  ### 8. The Source of Normativity
  **Question:** "Let's press on the 'ought.' When you say the hitchhiker *ought* to pay, is this a hypothetical imperative (if you want the ride, you ought to pay) or a categorical one? If it's hypothetical, then once I have the ride, the condition is fulfilled, and the 'ought' disappears. If it's categorical, what grounds this categorical requirement in a secular decision theory?"

  **Follow-up:** "If you ground it in 'agency integrity' or 'diachronic rationality': Isn't that just valuing 'being a resolute person' as a good in itself? If so, isn't your solution just adding a new intrinsic good to the utility function, which means standard Expected Utility Theory could handle it if we just specified the preferences correctly?"

  ### 9. Predictors and Transparency
  **Question:** "The Hitchhiker case relies on the driver being a near-perfect predictor. In the real world, predictors are noisy. At what threshold of predictive accuracy does Resolute Choice become the dominant strategy? Is there a precise cutoff where it switches from rational to irrational to resolve? If not, doesn't that vagueness undermine the precision decision theory promises?"

  **Follow-up:** "If you say there's no sharp cutoff: Then we have a sorites paradox for rationality. If you say there is a cutoff: How do you calculate it without invoking the very expected utility calculations that tell you not to pay once you're in town? Aren't you using CDT to calculate when to switch to RC?"

  ### 10. The "Rational Irrationality" Label Revisited
  **Question:** "Parfit suggested that in these cases, it is rational to make yourself irrational. You seem to be arguing that it is rational to make yourself *resolute*. But if 'rational' just means 'maximizing expected utility,' then the act of paying is irrational by definition at the moment of payment. Are you willing to bite the bullet and say that 'rationality' has two senses: one for dispositions and one for acts? And if they conflict, why should we care about the disposition-sense?"

  **Follow-up:** "If you say 'We should care because dispositions win in the long run': That's an evolutionary argument, not a normative one. I can evolve to be aggressive, but that doesn't make aggression rational in a specific negotiation. Why does the long-run success of the disposition normatively bind the short-run act in a one-off case like Hitchhiker?"
