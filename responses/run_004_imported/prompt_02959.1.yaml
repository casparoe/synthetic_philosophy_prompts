      *   *The "No" Part (Zodiac & Houses):* This is the dealbreaker. Kepler wrote *De Fundamentis Astrologiae Certioribus* specifically to purge the "arbitrary" stuff. Modern astrology is *built* on "I'm a Scorpio" (Zodiac) and "My Venus is in the 5th House." Kepler would call this superstition.
