          *   *Refinement:* Make it sharper. If music is a "copy" of the Will, and the Will is outside the *principium individuationis* (space/time), how does a temporal sequence copy an atemporal essence?
          *   *Follow-up:* If he says it mirrors the *inner nature* of time rather than time itself, ask about silence or rhythm.

      *   *Question 2 (The Hierarchy/Tonal System):* Focus on Bass/Harmony/Melody mapping.
          *   *Draft:* Is your bass/inorganic map just about German music? What about atonal music?
