      *   *Core Claim:* Other arts copy Ideas (Platonic forms), which are objectifications of the Will. Music copies the Will *itself*.
      *   *Metaphysics:* The Will is thing-in-itself (outside space, time, causality). Music is heard in time. How does this work?
      *   *Analogy:* Bass = Inorganic/Nature; Harmony = Plant/Animal; Melody = Human Striving/Intellect.
      *   *Effect:* Art usually quiets the will (aesthetic contemplation). But music expresses the Will directly. Does this agitate us or quiet us? Schopenhauer says it allows us to know the Will without suffering its sting (universal vs. particular).
      *   *Epistemology:* It's an intuitive truth, not a logical proof. "Shown" not "proved."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (The Metaphysical Gap):* Focus on Time. Music happens in time; Will is outside time.
