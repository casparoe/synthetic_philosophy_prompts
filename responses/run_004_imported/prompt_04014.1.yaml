      *   *Nietzsche's Metaphysics:* He's skeptical of metaphysical causation. He sees it as a human projection onto a flux of becoming.
      *   *Strawson's Metaphysics:* Strawson is a materialist/physicalist (mostly). He accepts causal determinism (or indeterminism) as a framework. He doesn't need "causation" to be a metaphysical absolute; he just needs the *intelligibility* of responsibility to require a certain structure.
      *   *The Tension:* The user asks: If Nietzsche says causation is a fiction, how can Strawson use a causal premise (*causa sui*) to argue against responsibility *neutrally* regarding determinism?
      *   *Resolution:* Strawson isn't borrowing Nietzsche's *metaphysics* of causation. He's borrowing the *concept* of *causa sui* to highlight a structural requirement of Ultimate Moral Responsibility (UMR). Strawson's argument works *within* the folk-concept of agency. Even if determinism is false (indeterminism), you still can't be *ultimately* responsible because the random events aren't "yours" either.
      *   *Key Distinction:* Nietzsche attacks the *concept* of cause/effect globally. Strawson accepts the *logic* of responsibility attribution. Strawson argues: "Even if we grant your folk-intuitions about agency, UMR is impossible." He doesn't need causation to be "real" in a Kantian sense; he just needs the *requirements* for UMR to be incoherent.
      *   *Determinism/Indeterminism Neutrality:* The Basic Argument says:
          1.  To do $X$, you act from nature $N$.
          2.  To be UMR for $X$, you must be UMR for $N$.
          3.  To be UMR for $N$, you must have chosen $N$ based on some prior nature $N-1$.
