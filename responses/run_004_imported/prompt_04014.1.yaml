          *   If Determinism: $N$ is determined by past. Not up to you.
          *   If Indeterminism: $N$ is random. Not up to you.
          *   *Causa Sui:* The only way out is if you created $N$ from nothing. That's *causa sui*.
      *   *Addressing the User's Worry:* Strawson isn't relying on a robust metaphysical picture of causation that Nietzsche denies. He's relying on the *conditions of intelligibility* for responsibility. Nietzsche's skepticism about causation actually *helps* Strawson in a way (if causation is a fiction, UMR is definitely a fiction), but Strawson wants to show UMR is impossible *even if* we accept standard causal frameworks.

  4.  **Synthesize the Argument:**
