answer: |-
  # The Myth of Local Realism: Why Bell's Theorem Proves Nonlocality

  **To:** The Disputants
  **From:** The Arbitrator
  **Re:** The Bell Inequality Tiebreaker

  The debate between you and Dan is one of the most persistent in the foundations of physics. It is also one of the most misunderstood. Dan is repeating a refrain common in undergraduate textbooks and pop-science expositions: that Bell's theorem forces a choice between "locality" and "realism," and that the Copenhagen interpretation gracefully sidesteps nonlocality by rejecting realism. You are channeling the rigorous analysis of philosophers like Tim Maudlin and the later work of John Bell himself: that "realism" was never an independent assumption, and that the theorem strikes directly at locality.

  Here is the verdict: **You are right. Dan is wrong.**

  The phrase "Local Realism" is a misleading label that obscures the actual logical structure of Bell's argument. It suggests two independent pillars holding up a roof, where removing one leaves the other standing. In reality, Bell's theorem (specifically in its mature 1976 formulation) relies on a single substantive physical principle: **Local Causality.** Quantum Mechanics violates Local Causality. To claim otherwise requires adopting a radical anti-realism that denies measurement outcomes are physical events at all—a price far steeper than simply accepting nonlocality.

  To settle this, we must reconstruct the two stages of Bell's argument: the 1964 derivation (where determinism is a consequence, not an assumption) and the 1976 generalization (where "realism" in the sense of pre-existing values is entirely absent).

  ### Part I: The 1964 Derivation (Determinism as a Consequence)

  Dan's claim rests on the idea that Bell *assumed* hidden variables (realism/determinism) and *then* proved they must be non-local. If this were true, Dan could say, "Well, I don't assume hidden variables, so I'm safe." But this is not what Bell did in 1964.

  Bell started with the EPR-Bohm setup: a pair of spin-1/2 particles in a singlet state, moving apart to detectors A and B.
  1.  **Quantum Prediction:** If the detectors are set to the same angle, the results are perfectly anti-correlated (if A is Up, B is Down).
  2.  **Locality Assumption:** A measurement at A cannot instantaneously disturb the physical state at B.

  Bell argued as follows: If I measure particle A and get "Up," I know with 100% certainty that particle B will be "Down" (if measured along the same axis). Because of **Locality**, my measurement at A could not have changed particle B. Therefore, particle B must have *already* possessed the property "Down" before I measured A.

  Notice the logic: **Locality + Perfect Correlation $\rightarrow$ Determinism (Hidden Variables).**

  Bell did not *assume* determinism. He derived it. He showed that if you want to keep Locality and agree with the perfect correlations predicted by QM (and observed in experiment), you are *forced* to accept that the particles carry definite instructions (hidden variables, $\lambda$).

  Once you have those definite instructions, Bell derived an inequality (e.g., $|E(a, b) - E(a, c)| \leq 1 + E(b, c)$) that any such local deterministic theory must satisfy. Quantum Mechanics violates this inequality.

  **The 1964 Conclusion:** You cannot have Locality.
  Why? Because Locality forces you into Determinism (to explain perfect correlations), and Determinism + Locality contradicts QM predictions. If you try to dodge this by saying "I reject determinism," you break the Locality condition required to establish the perfect correlation in the first place. In 1964, "Realism" was not an escape hatch; it was a trap set by Locality.

  ### Part II: The 1976 Generalization (Local Causality)

  Dan might concede the 1964 point but argue that modern physics uses stochastic (probabilistic) theories, not deterministic ones. He might say, "Okay, maybe 1964 forced determinism, but in 1976 Bell assumed 'realism' again by assuming there were hidden variables $\lambda$ at all. I'll just be a Copenhagenist and say there are no $\lambda$."

  This is where the "Local Realism" label does the most damage. In his 1976 paper, *"The Theory of Local Beables,"* Bell generalized the theorem to stochastic theories. He did not assume the outcomes were determined. He assumed they were probabilistic, but that the probabilities respected spacetime structure.

  He defined **Local Causality** via a factorization condition. Let $A$ be the outcome at wing A, $B$ at wing B, $a$ and $b$ the settings, and $\lambda$ a complete specification of the physical state in the past light cone of the measurements.

  Local Causality requires:
  $$P(A, B | a, b, \lambda) = P(A | a, \lambda) \cdot P(B | b, \lambda)$$

  Or, equivalently:
  $$P(A | a, b, B, \lambda) = P(A | a, \lambda)$$

  This equation says: Once you know the complete physical state $\lambda$ and the local setting $a$, the distant setting $b$ and distant outcome $B$ provide *no additional information* about $A$.

  **Crucially, this does not assume determinism.** $P(A|a,\lambda)$ can be 0.5. It can be probabilistic. It does not assume "pre-existing values" in the sense of definite spins waiting to be revealed. It only assumes that the *probabilities* are determined by local factors.

  Dan's objection usually lands here: "But you assumed $\lambda$ exists! That's realism!"

  This is a category error. $\lambda$ is simply "whatever the theory says is real."
  *   In Bohmian mechanics, $\lambda$ includes particle positions.
  *   In GRW collapse theories, $\lambda$ includes the wavefunction and collapse centers.
  *   In Copenhagen, if it is to be a physical theory, $\lambda$ must include the wavefunction.

  Bell's theorem shows that *no matter what $\lambda$ is*, if it respects Local Causality (the factorization condition), it cannot reproduce Quantum correlations.

  If Dan says, "I don't have a $\lambda$," he is not offering a physical theory; he is offering instrumentalism. He is saying, "Physics does not describe what exists; it only predicts measurement outcomes." But even then, Bell's theorem applies to the *outcomes*. The correlations between outcomes $A$ and $B$ violate the inequality derived from Local Causality. If there is no $\lambda$ to screen off the correlation, then $A$ and $B$ are directly dependent on each other across spacelike separation. That is the definition of Nonlocality.

  ### Part III: The "Realism" Escape Hatch and Why It Fails

  So, why does Dan think he can save Locality by dropping Realism?

  He is conflating **Signal Locality** (no faster-than-light communication) with **Bell Locality** (Local Causality). Quantum Mechanics respects Signal Locality (you can't use entanglement to send a message). Dan sees this and thinks, "See? It's local!"

  But Bell's theorem proves that while you can't *signal*, the underlying physical dependencies are non-local. The outcome at A *depends* on the setting at B, even if the statistics hide it from the observer.

  Dan's "escape hatch" is to claim that because the outcome isn't "real" until measured, there is no "influence" traveling between them. This is the move Maudlin calls "The Copenhagen Shell Game." It requires believing that:
  1.  Measurement outcomes are not events in spacetime until they occur.
  2.  The correlation does not require a common cause or a direct link, but simply "happens."

  This is not "dropping realism" in the sense of dropping hidden variables. This is dropping the idea that physics describes an objective world. If you adopt this view, you aren't saving Locality in a physical sense; you are dissolving the subject matter. You are saying, "There is no physical reality to be local or non-local; there are only observations."

  But if you grant that measurement outcomes are real events (i.e., a detector actually clicks, a photon is actually absorbed), then Bell's 1976 theorem applies directly. The correlation between the click at A and the click at B cannot be explained by common past causes ($\lambda$). It requires a dependency between the wings. That is Nonlocality.

  ### The Verdict

  The term "Local Realism" is a pedagogical fiction. It suggests a conjunction of two independent assumptions:
  1.  **Locality:** No influence travels faster than light.
  2.  **Realism:** Objects have definite properties.

  It implies you can keep #1 by dropping #2.

  Bell's actual argument demonstrates that **Locality implies Realism** (in the 1964 sense of definite outcomes required to explain perfect correlation) and that **Locality (in the 1976 sense of Local Causality) is incompatible with Quantum predictions.**

  There is no coherent middle ground where you have a physical theory that is Local and reproduces QM.
  *   If you keep Locality (Local Causality), you must contradict QM (and experiment).
  *   If you keep QM (and experiment), you must violate Local Causality.

  Dan's position—that nonlocality is a choice forced only on hidden-variable theories—is false. Nonlocality is forced on *any* theory that treats measurement outcomes as real physical events. The only way to avoid it is to deny that measurement outcomes are real physical events, which is not "saving locality," but abandoning the project of physical explanation.

  **Final Ruling:**
  Bell's theorem proves that Nature is **Non-Local**. The label "Local Realism" is sloppy terminology that allows physicists to pretend they have a choice between locality and realism. They do not. They have a choice between Nonlocality and Anti-Realism (the denial that physics describes reality). Given that we generally assume physics describes reality, Nonlocality is the necessary conclusion.

  Tell Dan to buy the next round. He lost.
