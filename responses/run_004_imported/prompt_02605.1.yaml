      *   **Task:** Write an essay reconstructing both derivations (1964 vs. 1976+) to judge the debate.
      *   **Constraint:** Commit to a real answer. No hedging. No "it depends on definitions." Pick a side and defend it like a philosopher of physics.
      *   **Tone:** Rigorous, analytical, authoritative but accessible (like a philosophy of physics paper), decisive.

  2.  **Deconstruct the Physics/Philosophy:**
      *   *Bell's 1964 Paper:* "On the Einstein Podolsky Rosen Paradox."
          *   Setup: EPR-Bohm scenario (spin singlet).
          *   Assumption 1: Locality (measurement at A doesn't affect result at B).
          *   Assumption 2: Perfect Anti-correlation (if settings are same, results are opposite).
          *   Derivation: Locality + Perfect Correlation $\rightarrow$ Determinism (Hidden Variables must exist to account for perfect prediction at a distance without signaling).
          *   Result: Deterministic Hidden Variables + Locality $\rightarrow$ Bell Inequality. QM violates inequality.
          *   Conclusion: You can't have Locality + QM predictions. (Determinism was a *consequence*, not an independent axiom).
      *   *Bell's Later Work (1976 "The Theory of Local Beables"):*
          *   Generalization to stochastic (probabilistic) theories.
          *   Concept: "Local Causality."
          *   Condition: $P(A|a, b, B, \lambda) = P(A|a, \lambda)$. (Probability of outcome A depends on setting a and hidden state $\lambda$, but *not* on distant setting b or outcome B).
          *   Result: Local Causality $\rightarrow$ Bell Inequality (CHSH form).
          *   Conclusion: QM violates Local Causality.
      *   *The "Realism" Confusion:*
          *   "Realism" is often used loosely to mean "pre-existing values" or "determinism."
          *   Dan says: Drop realism (values aren't pre-existing), keep locality.
          *   User says: Bell's later theorem doesn't assume pre-existing values (stochastic allowed). It assumes Local Causality. QM violates Local Causality. So Locality is gone regardless of "realism."
      *   *The Counter-Argument (Dan's side):* Copenhagen/Orthodox QM claims to be local. How? By denying that the measurement outcome is a "real event" in the sense required by Bell's factorization condition until it happens, or by treating the wavefunction as epistemic. They argue Bell's "Local Causality" assumes a "realist" ontology (beables) that Copenhagen rejects.
