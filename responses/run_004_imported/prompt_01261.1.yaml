prompt: |-
  I'm working on a feature about how much epistemic weight we should put on the individualized probabilities that now show up everywhere in medicine, criminal justice, and insurance: an oncologist telling a patient she has a "70 percent five-year survival rate," or a risk-assessment tool assigning a specific recidivism score to a defendant. While reading up on the philosophical background, a historian of statistics I interviewed pointed out that the cleanest early statement of the underlying puzzle isn't in any recent paper at all, but in John Venn's 1866 book The Logic of Chance — yes, the Venn-diagram Venn. She mentioned, almost in passing, that the term "reference class problem" wasn't coined until 1949, when Hans Reichenbach used it in The Theory of Probability, but that Venn had essentially already run into the problem more than eighty years earlier, using a fictional everyman he calls "John Smith." I found the passage myself, in the revised 1888 third edition, and while none of the individual words are especially hard, the argument keeps slipping through my fingers on close reading. Here is the relevant stretch from the chapter on induction (I'm picking it up partway into a section, and trimming a couple of internal sentences, marked with [...]):

  We must now shift our point of view a little; instead of starting, as in the former chapters, with a determinate series supposed to be given to us, let us assume that the individual only is given, and that the work is imposed upon us of finding out the appropriate series. How are we to set about the task? In the former case our data were of this kind:—Eight out of ten men, aged fifty, will live eleven years more, and we ascertained in what sense, and with what certainty, we could infer that, say, John Smith, aged fifty, would live to sixty-one.

  § 12. Let us then suppose, instead, that John Smith presents himself, how should we in this case set about obtaining a series for him? In other words, how should we collect the appropriate statistics? [...] For it must be remembered that each individual thing has not one distinct and appropriate class or group, to which, and to which alone, it properly belongs. We may indeed be practically in the habit of considering it under such a single aspect [...] but such a practice is merely customary on our part, not obligatory. It is obvious that every individual thing or event has an indefinite number of properties or attributes observable in it, and might therefore be considered as belonging to an indefinite number of different classes of things. By belonging to any one class it of course becomes at the same time a member of all the higher classes, the genera, of which that class was a species. But, moreover, by virtue of each accidental attribute which it possesses, it becomes a member of a class intersecting, so to say, some of the other classes. John Smith is a consumptive man say, and a native of a northern climate. Being a man he is of course included in the class of vertebrates, also in that of animals, as well as in any higher such classes that there may be. The property of being consumptive refers him to another class, narrower than any of the above; whilst that of being born in a northern climate refers him to a new and distinct class, not conterminous with any of the rest, for there are things born in the north which are not men.

  § 13. When therefore John Smith presents himself to our notice without, so to say, any particular label attached to him informing us under which of his various aspects he is to be viewed, the process of thus referring him to a class becomes to a great extent arbitrary. [...] In saying that it is thus arbitrary under which class he is placed, we mean, of course, that there are no logical grounds of decision; the selection must be determined by some extraneous considerations.

  What I can't quite pin down is the exact force of the difficulty Venn is describing. Is this basically an epistemic complaint — that we simply lack sufficiently fine-grained statistics to know which of John Smith's many "classes" is the relevant one, a gap that better data collection could in principle close — or is Venn actually gesturing at something more radical, namely that there is no fact of the matter about which class is correct, so that a single-case probability like "John Smith's chance of living to sixty-one" isn't well-defined even in principle, no matter how much data we amass? Relatedly, what exactly is doing the work in his claim that the choice must rest on "extraneous considerations" — extraneous to what, if there is no logical fact for it to be extraneous to? And, stepping back from Venn himself: do you think anything in twentieth- or twenty-first-century probability theory — propensity theories, Bayesian subjectivism, machine-learning risk models trained on ever-larger datasets — actually resolves the difficulty he's describing here, or do these approaches mainly find more sophisticated ways of making the "arbitrary" choice of class for us without owning up to its arbitrariness?
