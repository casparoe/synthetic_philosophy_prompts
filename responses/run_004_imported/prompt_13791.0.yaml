      *   *The Skeptic's Argument:* Hard Determinism / Luck Egalitarianism. If $X$ causes $Y$, and I didn't choose $X$, I'm not responsible for $Y$. Temperament is caused by genetics/environment. Therefore, I didn't choose my temperament. Therefore, I don't deserve praise for actions stemming from it.
