prompt: |-
  Hey -- odd request, but I think you're the right tool for this. My first-ever PhD student, Priya, is getting married next month. Her dissertation with me was on costly signaling in animal communication, and somewhere along the way she ended up marrying a guy from the empirical side of that same literature (they met presenting back-to-back at a workshop, of course), so she's asked her old advisor to give the toast. I said yes before I thought through who'd actually be sitting in that room: half the guests are philosophers of biology and behavioral ecologists who will clock a Zahavi reference the second it lands, and the other half are her family, who've never heard the word "ethology" in their lives and shouldn't have to.

  Here's what I actually want: not one signaling joke tossed in for the nerds, but a toast where the handicap principle is doing real work the whole way through, not just decorating it -- the logic Zahavi worked out for why a peacock's tail has to be wasteful to be believed, that Grafen later made rigorous with an actual game-theoretic model, and that Spence found almost the identical result independantly over in economics (why you'd bother getting an expensive degree just to prove to employers you're worth hiring). I want that logic doing the work of explaining why an "irrational," extravagant wedding -- the ring that does nothing useful, flowers that are dead by Tuesday -- is actually about the most rational proof of commitment two people could hand each other. But there's a wrinkle I don't want swept under the rug: I'm fairly sure there's an actual econ paper, out of Emory, maybe ten-ish years old now, showing couples who spend more on the wedding and the ring tend to divorce sooner, not later -- almost exactly backwards from what handicap logic would predict. I don't want the toast to just lob that in as a punchline and move on; I'd love it to actually earn its way through the wrinkle -- something about who the signal's really for, and who's footing the bill, feels relevant -- and still land warm and specific to these two, not like a seminar. Five minutes tops, said out loud at an open bar, not read off a page -- can you draft it for me?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD Advisor (Professor).
      *   **Audience:** Mixed bag. 50% Academics (Philosophers of Biology, Behavioral Ecologists, Economists) who know Costly Signaling Theory (CST), Zahavi, Grafen, Spence. 50% Family/Friends (Laypeople) who need to understand and feel included.
      *   **Honoree:** Priya (former PhD student) + Partner (Empiricist in same field).
      *   **Theme:** Costly Signaling Theory / Handicap Principle applied to Marriage/Weddings.
      *   **Key Constraint 1:** The theory must *do the work*, not just be a joke. It needs to explain the "irrationality" of wedding expenses (rings, flowers) as rational proofs of commitment.
      *   **Key Constraint 2 (The Wrinkle):** Must address the conflicting empirical evidence (Francis-Tan & Mialon, Emory, 2014) that higher wedding/ring costs correlate with *higher* divorce rates. Cannot just be a punchline; must be integrated thoughtfully (signaling to whom? who pays?).
      *   **Tone:** Warm, specific, spoken (not read), under 5 minutes (approx. 600-750 words).
      *   **Goal:** Land the plane warmly, honoring the couple, satisfying the nerds, engaging the family.

  2.  **Deconstruct the Science:**
      *   *Zahavi's Handicap Principle:* Signals must be costly to be honest. A peacock's tail is heavy and dangerous. If it were cheap, cheaters could do it.
      *   *Grafen/Spence:* Formalized this. Education is a signal to employers.
      *   *Application to Wedding:* The ring, the party, the time spent—these are "wasteful" in a utilitarian sense but valuable as signals of commitment.
      *   *The Emory Study (Francis-Tan & Mialon, 2014):* "A Diamond is Forever" vs. reality. High cost = higher divorce risk.
      *   *Resolution:* Signaling works when the cost is borne by the *signaler* to the *receiver*. If the cost is borne by parents (family footing the bill) or debt (future stress), the signal is noisy. True commitment signaling is about ongoing cost (effort, patience), not just upfront capital.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role (Advisor), the relationship (Priya as first student), and the setting. Establish the dual audience immediately but gently.
      *   **The Hook (The Science):** Introduce the concept of "Costly Signaling" without jargon overload. Use the Peacock example (visual, easy to grasp). Connect it to Priya's work.
      *   **The Application (The Wedding):** Why spend money on flowers that die? It's not waste; it's proof. Connect to the partner (the empiricist). They speak the same language.
      *   **The Wrinkle (The Emory Study):** This is the tricky part. Needs to be handled carefully so it doesn't doom the marriage.
          *   *Idea:* Distinguish between *buying* a signal and *bearing* a signal.
          *   *Refinement:* If parents pay, it's not the couple signaling. If it's debt, it's stress. The real signal is the *ongoing* cost.
      *   **The Resolution (The Real Signal):** Shift from financial cost to emotional/effort cost. Listening, compromising, supporting. This is the "handicap" that proves love over time.
      *   **Closing:** Warm wish for the future. Raise a glass.

  4.  **Refining the Tone:**
      *   *Avoid:* Reading like a lecture. No "As we see in Equation 3..."
      *   *Include:* Personal touches (Priya as a student, meeting the partner).
      *   *Pacing:* Short sentences for speech. Pauses for laughter.
      *   *Addressing the Family:* Explain the science simply so they feel smart, not excluded. "For those of you who aren't biologists..."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm Priya's advisor. She studied peacocks. Peacocks have big tails to show they are strong. This is the Handicap Principle. Weddings are like peacock tails. Expensive rings show commitment. But wait, an Emory study says expensive weddings lead to divorce. Why? Because if parents pay, it's not your signal. Or if you go into debt, you fight about money. So, the real signal isn't the ring. It's the hard work of marriage. That's the real cost. Cheers.

      *Critique 1:* Too dry. Too abrupt on the Emory study. Needs more warmth and better flow.

  6.  **Drafting - Iteration 2 (Adding Flesh & Nuance):**
      *   *Opening:* Start with the "odd request."
      *   *Science:* Make Zahavi accessible. "Honest signals must hurt a little."
      *   *Couple:* They met at a workshop. They know this stuff.
      *   *The Twist:* The Emory study. Frame it as "Noise in the data."
      *   *The Fix:* Who pays? If it's credit cards, that's stress. If it's parents, that's not *your* cost. The real signal is day-to-day sacrifice.
      *   *Ending:* To Priya and [Partner].

  7.  **Polishing for the "Spoken" Constraint:**
      *   Use contractions.
      *   Add stage directions (pause, raise glass).
      *   Ensure the Emory reference doesn't sound like a citation but like a story beat.
      *   Make sure the family feels the emotion, not just the logic.

  8.  **Final Review against Constraints:**
      *   Zahavi/Grafen/Spence logic used structurally? Yes.
      *   Emory study addressed thoughtfully? Yes (distinguishing upfront cost vs. ongoing cost/who pays).
      *   Warmth/Specificity? Yes (mentions Priya's work, their meeting).
      *   Time? ~750 words is about 5 minutes at a moderate pace.

      *(Self-Correction during drafting)*: I need to make sure I don't imply the Emory study is *definitive truth* that ruins the metaphor, but rather a nuance that *improves* the metaphor. The signal must be *costly to the signaler*, not just expensive in absolute terms. If parents pay, the couple hasn't signaled. If it's debt, the cost is financial stress, not relational investment. The best signal is *effort*.

      *Let's write it.*

      *(Post-Draft Check)*: Does it sound like a professor? Yes, but a warm one. Does it alienate the family? I'll add phrases like "In plain English" to bridge the gap.

      *Wait, one more thing:* The prompt mentions Spence (economics). I should weave that in subtly so the economists in the room nod, but without naming dropping too hard for the family. I'll focus on the "investment" aspect.

      *Final Polish on the Emory point:* The key insight is that the signal must be *sustainable*. A massive upfront cost that cripples the unit is a bad signal. A sustainable, ongoing cost (effort) is the good signal.

      *Okay, ready to generate.*
answer: |-
  (Raise glass, but don't clink yet. Stand relaxed, look at the couple, then the room.)

  Good evening. For those who don't know me, I'm [Name], and I had the privilege of being Priya's PhD advisor. When Priya asked me to give this toast, I said yes immediately. Then, I went home and panicked.

  Because Priya's dissertation was on costly signaling in animal communication. And she married a man who works on the empirical side of that same literature. They met presenting back-to-back at a workshop, which I'm told is the academic version of a meet-cute.

  So, looking around this room, I realize I have a unique challenge. Half of you are behavioral ecologists and philosophers of biology. If I get the theory wrong, you will tweet about it before the cake is cut. The other half are family and friends who just want to know why we spent money on flowers that are going to be dead by Tuesday.

  My job tonight is to convince both groups that those wilting flowers are actually a masterpiece of rational decision-making.

  In biology, we have an idea called the Handicap Principle. It was proposed by Amotz Zahavi. The logic is counterintuitive. It says that for a signal to be honest, it has to be wasteful. Think of a peacock's tail. It's heavy. It makes flying harder. It attracts predators. It is, by every survival metric, a terrible idea.

  But that's exactly why it works. Because it is costly, only a truly healthy, fit peacock can afford to carry it. If the tail were cheap, any weak peacock could fake it. The cost is what makes the signal believable.

  Later, economists like Michael Spence found the same math in the job market. You get a degree not just to learn skills, but to prove to an employer you have the grit to finish the degree. The cost is the point.

  So, apply this to today. To a layperson, a wedding looks like a massive inefficiency. You trade savings for a party. You trade utility for a ring that catches on sweaters. But through the lens of signaling theory, this isn't waste. It's a bond. Priya and [Partner's Name] are standing up here, in front of their community, incurring a significant cost to prove that their commitment is honest. They are saying, "We are willing to burn resources to show we are all in."

  But, there is a wrinkle. And because this is Priya's wedding, we have to address the data.

  There was a study out of Emory, a few years back, that looked at this exact question. They found that couples who spent more on the wedding and the ring… actually divorced *sooner*.

  Now, if you're a skeptic, that kills the metaphor. It suggests the signal is noise. But if you look closer at the model, it actually saves it.

  The Handicap Principle only works if the cost is borne by the *signaler*.

  In the Emory data, high costs often correlated with debt… or with parents footing the bill. If you go into debt to get married, you aren't signaling commitment; you're signaling financial stress. And if your parents pay, *they* are the ones signaling, not you. The couple hasn't actually incurred the handicap.

  So, the lesson for Priya and [Partner] isn't that spending money is bad. It's that the *type* of cost matters.

  The most reliable signal isn't the upfront price tag. It's the ongoing cost.

  Marriage is full of handcaps. It's the energy it takes to listen when you're exhausted. It's the compromise when you know you're right. It's the time you sacrifice to support the other person's career, or health, or peace of mind. These are "wasteful" in the short term—you give up time, you give up ego—but they are the only costs that prove, day after day, that the signal is still honest.

  Priya, you taught me so much about how animals communicate truth. But watching you and [Partner] together, I see a system that's more robust than any model. You speak the same language, you respect the data, but you know that the theory only holds up if you do the work.

  So, to the flowers that will wilt, and the ring that will catch on sweaters. But mostly, to the daily, costly, beautiful work of proving each other wrong about who loves who more.

  To Priya and [Partner].

  (Raise glass high.)
