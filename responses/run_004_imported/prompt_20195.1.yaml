prompt: |-
  I sit on the three-person committee that oversees a shared betting bankroll built up over two years by a local Astral Codex Ten meetup trading political and macroeconomic questions on Manifold and Polymarket. Our strongest forecaster, whose edge rests on a track record of only about forty resolved markets, wants the committee to size every position at full Kelly against her own probabilities, arguing that the criterion exists precisely for this purpose and that anything more conservative just forfeits growth for no principled reason. The rest of us are uneasy: several of her highest-conviction positions are correlated with each other, and a few members may need their share of the pool back on short notice. Please draft the memo I'll circulate before our next meeting: it should recommend a specific position-sizing rule with a date for revisiting it, and it should engage her argument on its own mathematical terms rather than answering it with generic appeals to caution.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A three-person committee oversees a shared betting bankroll (Astral Codex Ten meetup group).
      *   **Source of Funds:** Built over two years via trading on Manifold and Polymarket (political/macro questions).
      *   **Conflict:** The "strongest forecaster" (40 resolved markets track record) wants *full Kelly* sizing based on her probabilities. The rest of the committee are uneasy due to correlation risk and liquidity needs (members might need cash back).
      *   **Task:** Draft a memo to circulate before the next meeting.
      *   **Requirements:**
          *   Recommend a specific position-sizing rule.
          *   Include a date for revisiting the rule.
          *   Engage the forecaster's argument on *mathematical terms* (don't just say "be careful").
          *   Tone: Professional, collaborative, rationalist-adjacent (given it's an ACT meetup), persuasive but firm.

  2.  **Deconstruct the Forecaster's Argument (Full Kelly):**
      *   *Claim:* Kelly Criterion maximizes long-term geometric growth rate.
      *   *Claim:* Anything less forfeits growth without principled reason.
      *   *Weaknesses/Assumptions:*
          *   Kelly assumes known probabilities (edge is certain).
          *   Kelly assumes infinite time horizon (no ruin).
          *   Kelly assumes no correlation between bets (or that correlation is accounted for in the probability).
          *   Kelly assumes no liquidity constraints (no need to withdraw).
          *   Kelly has high volatility (50% drawdowns are common even with an edge).
          *   Track record: 40 markets is statistically significant but not definitive (noise vs. signal).

  3.  **Deconstruct the Committee's Concerns:**
      *   *Correlation:* If bets are correlated (e.g., all betting on "Democrat wins 2024"), a single wrong model assumption wipes out the bankroll. Full Kelly on correlated bets is effectively over-leveraged.
      *   *Liquidity:* Members might need money back. Full Kelly risks deep drawdowns exactly when liquidity is needed.
      *   *Model Risk:* 40 markets is good, but is it enough to trust probabilities implicitly? Overconfidence bias is common.

  4.  **Develop the Counter-Argument (Mathematical Terms):**
      *   *Fractional Kelly:* It's not "caution," it's optimizing for *utility* rather than raw bankroll growth. If utility is concave (diminishing returns on money, or risk of ruin), Fractional Kelly is actually the *optimal* mathematical choice.
      *   *Correlation Adjustment:* Kelly must be applied to the *portfolio*, not individual bets. If bets are correlated, the effective Kelly fraction drops.
      *   *Parameter Uncertainty:* The "True Kelly" requires knowing true probabilities. We only have *estimated* probabilities. With estimation error, Full Kelly leads to overbetting and reduced growth (the "Kelly Cliff"). Fractional Kelly is robust to estimation error.
      *   *Liquidity Constraint:* This introduces a "barrier" to the random walk. To minimize probability of hitting the barrier (withdrawal need during drawdown), you must reduce volatility, i.e., reduce leverage.

  5.  **Formulate the Recommendation:**
      *   *Rule:* Half-Kelly (or Quarter-Kelly). Half-Kelly is a standard rationalist compromise. It reduces volatility by 50% but only reduces growth by 25% (variance drag relationship).
      *   *Correlation Cap:* Limit exposure to correlated clusters (e.g., US Politics).
      *   *Liquidity Buffer:* Keep a portion in stablecoins/cash.
      *   *Review Date:* 6 months or after 20 more resolved markets.

  6.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the success so far. Validate the forecaster's contribution. State the purpose (optimize sizing policy).
      *   **Engaging the Math (The Core):**
          *   Acknowledge Kelly maximizes $E[\log(W)]$.
          *   Introduce *Estimation Risk*: We don't know $p$, we have $\hat{p}$. Overestimating edge leads to ruin. Cite the "Kelly Cliff."
          *   Introduce *Correlation*: Independent bets vs. correlated clusters. Full Kelly on correlated bets = leverage.
          *   Introduce *Liquidity/Utility*: We have finite horizons and withdrawal options. This changes the utility function from $\log(W)$ to something with a liquidity constraint.
      *   **The Proposal:**
          *   Half-Kelly on individual bets.
          *   Portfolio-level correlation limits (e.g., max 30% in one theme).
          *   Liquidity reserve (10-20%).
      *   **Review Mechanism:** Update based on new track record (aim for 100 resolved markets). Date: 6 months out.
      *   **Closing:** Invite discussion.

  7.  **Refining the Tone:**
      *   Avoid "I feel" or "We are worried." Use "The data suggests" or "The model implies."
      *   Use rationalist terminology correctly (edge, track record, calibration, geometric growth).
      *   Ensure it doesn't sound like a rejection of the forecaster, but an optimization of the *system*.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 40 markets enough to claim an edge?
      *   *Adjustment:* Acknowledge it's promising but subject to variance.
      *   *Critique:* Is Half-Kelly arbitrary?
      *   *Adjustment:* Explain the math: 1/2 Kelly gives 3/4 of the growth rate with 1/2 the volatility. It's the efficiency frontier for uncertainty.
      *   *Critique:* Did I address the liquidity issue mathematically?
      *   *Adjustment:* Frame liquidity as a "ruin barrier" or "absorbing state" that changes the optimal fraction.

  9.  **Final Polish:** Check formatting, clarity, and ensure all constraints of the prompt are met. (Specific rule, specific date, mathematical engagement).

  **(Self-Correction Note):** Make sure to explicitly mention *why* Full Kelly fails under parameter uncertainty. That's the strongest mathematical argument against the forecaster's "principled reason" claim. Full Kelly is only optimal if you know the true probabilities. Since we don't, Full Kelly is actually *suboptimal* for growth.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Betting Committee & Lead Forecaster
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Portfolio Sizing Policy & Risk Framework

  **1. Objective**

  This memo proposes a formal position-sizing framework for the ACT Meetup Prediction Fund. Our goal is to maximize the long-term geometric growth rate of the bankroll while accounting for parameter uncertainty, correlation risk, and liquidity constraints. We acknowledge the success of our strategy over the past two years and specifically recognize the Lead Forecaster's significant contribution to our alpha generation.

  The purpose of this policy is not to cap growth, but to ensure that the sizing mechanism remains mathematically optimal given the *actual* constraints of our fund, rather than the theoretical constraints of an idealized Kelly environment.

  **2. Analysis of the Full Kelly Criterion**

  We agree with the Lead Forecaster that the Kelly Criterion is the correct theoretical baseline for capital growth. Specifically, betting fraction $f^* = \frac{p(b+1) - 1}{b}$ maximizes the expected value of the logarithm of wealth, $E[\log(W_t)]$.

  However, the assertion that "anything more conservative forfeits growth for no principled reason" holds only under four strict assumptions which do not apply to our current fund structure:

  *   **A. Known Probabilities:** Full Kelly assumes the probability $p$ is known with certainty. In our case, $p$ is an estimate $\hat{p}$ derived from a track record of ~40 resolved markets.
      *   *Mathematical Implication:* When edge is overestimated due to variance or model error, the growth rate drops precipitously (the "Kelly Cliff"). Research by MacLean, Thorp, and Ziemba demonstrates that with parameter uncertainty, **Fractional Kelly** maximizes growth *more effectively* than Full Kelly because it is robust to estimation error. Half-Kelly captures roughly 75% of the theoretical growth rate while reducing variance by 50%.
  *   **B. Independent Bets:** Standard Kelly sizing assumes bets are uncorrelated.
      *   *Mathematical Implication:* Several of our highest-conviction positions share latent variables (e.g., US political stability, Fed rate paths). If we apply Full Kelly to correlated outcomes, we are effectively leveraging the same exposure multiple times. This increases the portfolio variance without increasing the expected return, pushing us past the optimal point on the efficient frontier.
  *   **C. Infinite Time Horizon:** Kelly optimizes for $t \to \infty$.
      *   *Mathematical Implication:* Our fund has a finite liquidity constraint. Members may require capital withdrawal. This introduces a "ruin barrier" at a non-zero wealth level. To minimize the probability of hitting this barrier during a drawdown, the optimal bet size is strictly less than Full Kelly.
  *   **D. Log-Utility:** Full Kelly assumes utility is strictly $\log(W)$.
      *   *Mathematical Implication:* If the marginal utility of capital diminishes faster than logarithmic (due to the liquidity needs mentioned above), the optimal fraction decreases.

  **3. Proposed Sizing Rule**

  To align our sizing with the mathematical realities of estimation error and correlation, I propose the following **Fractional Kelly with Correlation Caps** policy:

  1.  **Base Sizing:** All positions will be sized at **50% of the Kelly Criterion** based on the Forecaster's stated probabilities.
      *   *Rationale:* This accounts for the variance in our 40-market track record. It protects against overconfidence bias while retaining the majority of the compounding benefit.
  2.  **Correlation Clustering:** Bets will be grouped by thematic exposure (e.g., "US 2024 Election," "Fed Rates Q1"). Total exposure within any single cluster cannot exceed the Kelly fraction calculated for the *most* convex outcome in that cluster.
      *   *Rationale:* This prevents implicit leverage on shared latent variables.
  3.  **Liquidity Reserve:** 15% of the total bankroll will be held in stablecoins/cash and not deployed.
      *   *Rationale:* This creates a buffer against withdrawal requests occurring during drawdown periods, preventing the forced realization of losses.

  **4. Review and Calibration Schedule**

  We treat this policy as a dynamic model subject to updating based on new data.

  *   **Review Date:** **April 26, 2024** (6 Months)
  *   **Trigger Event:** Alternatively, the policy will be revisited immediately upon the resolution of **20 additional markets** (bringing the total track record to ~60).
  *   **Criteria for Adjustment:** At the review date, we will recalculate the Forecaster's calibration and Brier score.
      *   If calibration remains sharp and the track record exceeds 60 resolved markets with positive ROI, we may consider increasing the fraction to 60% or 75% Kelly.
      *   If calibration shows systematic overconfidence, the fraction will be reduced to 25% Kelly.

  **5. Conclusion**

  Adopting Half-Kelly is not a rejection of the Kelly Criterion; it is an application of it under conditions of uncertainty. By acknowledging that our probabilities are estimates rather than truths, and that our capital has liquidity constraints, Fractional Kelly becomes the mathematically principled choice for maximizing *realized* growth rather than *theoretical* growth.

  I request that we discuss this framework at our next meeting on [Date of Meeting]. I am prepared to share a spreadsheet modeling the expected drawdown differences between Full and Half-Kelly under our current correlation assumptions.

  Regards,

  [Your Name]
  Committee Member
