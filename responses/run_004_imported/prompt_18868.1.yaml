  6.  **Evaluate Move (4): Marcus's Counter (Feasibility/Sharpness)**
      *   *Claim:* Bundling requires knowing future bets (infeasible) or implies a sharp credence (collapsing the view).
      *   *Assessment:* This is the crux. If you need a contingency plan for all possible future bets to avoid irrationality, you effectively need a single prior to weigh the likelihood of those bets appearing. This is Elga's argument: to avoid diachronic inconsistency or money pumps, you effectively need a sharp prior. If Priya says "bundle everything," she requires omniscience about future choice contexts. If she says "bundle only what's on the table," she risks inconsistency if bets are offered sequentially.
      *   *Verdict:* This is the strongest point in the debate. It targets the feasibility and theoretical cost of Priya's solution.
