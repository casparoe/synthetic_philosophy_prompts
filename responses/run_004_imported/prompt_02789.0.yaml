prompt: |-
  Ok this is going to sound like a weird combo but bear with me. I'm an ML engineer, and a couple weeks back a few of us got into a whole argument (half work meeting, half post-work-beers argument) about whether the "emergent abilities" everyone talks about in LLM scaling curves are emergent in any real sense, or whether it's mostly an artifact of the metrics we pick, like that "are emergent abilities a mirage" paper argues. My roommate is doing a philosophy MA and got kind of annoyed at how loosely we were all throwing around the word "emergent," so she sent me this passage from C.D. Broad's 1925 book (which she loves pointing out is almost exactly a century old now, as if that settles anything) to prove that philosophers had a much stricter idea of emergence long before any of us were born. Problem is, I've never really had to read old philosophy prose before and it's kicking my ass a little, so I was hoping you could help me actually unpack it, since I can't just google my way through 1920s syntax and still win the argument.

  Here's the bit (from Broad, The Mind and Its Place in Nature, 1925, in the chapter called "Mechanism and its Alternatives"):

  "If the emergent theory of chemical compounds be true, a mathematical archangel, gifted with the further power of perceiving the microscopic structure of atoms as easily as we can perceive hay-stacks, could no more predict the behaviour of silver or of chlorine or the properties of silver-chloride without having observed samples of those substances than we can at present. And he could no more deduce the rest of the properties of a chemical element or compound from a selection of its properties than we can.

  Would there be any theoretical limit to the deduction of the properties of chemical elements and compounds if a mechanistic theory of chemistry were true? Yes... If the mechanistic theory be true the archangel could deduce from his knowledge of the microscopic structure of atoms all these facts but the last. He would know exactly what the microscopic structure of ammonia must be; but he would be totally unable to predict that a substance with this structure must smell as ammonia does when it gets into the human nose. ...he could not possibly know that these changes would be accompanied by the appearance of a smell in general or of the peculiar smell of ammonia in particular, unless someone told him so or he had smelled it for himself."

  There's two things in here I can't fully untangle by myself. First: what exactly is the archangel doing as a piece of argument — like, what would have to be true about the world for an infinitely smart, infinitely perceptive being to still fail at predicting silver-chloride's properties, and how is that different from him just not having enough compute or enough data? Second: Broad seems to slide from talking about silver and chlorine (structural, dispositional stuff) to talking about the smell of ammonia (which feels more like a "what it's like" thing, almost a proto-Mary's-Room move) without really flagging that he's changed the subject. Is that the same argument applied twice, or two different arguments wearing the same archangel costume? And if you had to guess, going strictly off Broad's actual criterion here rather than the loose way ML people throw the word around — would he count today's "emergent abilities" in LLMs as emergent in his sense, or would he think that's a completely different, much cheaper phenomenon dressed up in the same word? Dont worry about being diplomatic, I'm mostly just trying to win the arguement with my roommate.
