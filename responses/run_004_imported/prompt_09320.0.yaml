      *   **Why the Engineer's Move Worked:** Briefly explain the IRV mechanics of elimination order. By burying the 2nd choice, he prevented them from gaining momentum in early rounds, allowing his 1st choice to survive longer.

  7.  **Refining the Tone:**
      *   Keep it conversational ("Quick bit of context" -> "Thanks for the context").
