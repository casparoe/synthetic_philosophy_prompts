      *   The specific scenario describes a known vulnerability in IRV where voters "bury" a strong competitor to ensure they don't make it to the final round against their favorite.
      *   The fundamental theorem relevant here is **Gibbard's Theorem**.

  3.  **Evaluate the Voting Methods:**
      *   **IRV (Current):** Susceptible to "burying" (as experienced). It fails the *monotonicity criterion* and is susceptible to strategic nomination and tactical ranking.
      *   **Condorcet:** Elects the candidate who beats everyone else head-to-head. *However*, Condorcet methods can still be gamed (e.g., via "burying" to create a cycle or ensure a specific winner in the tie-break). Also, Condorcet winners don't always exist (cycles).
      *   **Borda Count:** Assigns points based on rank. Highly susceptible to strategic voting (burying opponents at the bottom maximizes point differential).
      *   **Approval Voting:** Vote for as many as you like. Less susceptible to *ranking* manipulation, but introduces "bullet voting" (voting for only one) as a strategy.
      *   **Score/Range Voting:** Similar to Approval but with granularity. Still has strategy (max/min scoring).

  4.  **Connect to Gibbard's Theorem:**
      *   *Theorem:* For any deterministic voting system with 3 or more candidates, there is no system that is completely immune to strategic voting unless it is dictatorial (one person decides) or restricts preferences.
      *   *Implication:* The user cannot find a "perfect" system. The goal shifts from "immune" to "resistant" or "practical."

  5.  **Address the Specific Situation (Team of 12):**
