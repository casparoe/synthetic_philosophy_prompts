      *   **Specific Questions:**
          1.  Are hinges permanent or temporary/revisable? How to reconcile "hinges must stay put" with "river-beds shift"?
          2.  Is the Bayesian "ur-prior" mapping defensible, or does it mischaracterize hinges as truth-apt propositions with credences?
          3.  Is the shift of hinges rational/evidence-responsive, or is it a Kuhnian paradigm shift (invisible from inside)?
          4.  Is OC a rival answer to Yudkowsky's regress problem or a dissolution/refusal of the question?
      *   **Tone:** Intellectual, precise, respectful of the source text, avoiding superficial blog-summary tropes. Needs a "close reading."

  2.  **Deconstruct the Tension (§95-99 vs. §341-343):**
      *   *The Hinge Metaphor (§341-343):* Focuses on the *synchronic* function. At any given moment $t$, for inquiry to happen, some things must be held fast. If *everything* doubted at once, action/thought stops. "If I want the door to turn, the hinges must stay put." This is about logical necessity within a language game.
      *   *The River-bed Metaphor (§95-99):* Focuses on the *diachronic* evolution. Over time $t_1 \to t_2$, what was fluid can harden, and what was hard can erode. This is about historical/sociological change in world-pictures.
      *   *Resolution:* The tension is only apparent if one assumes "must stay put" means "eternally immutable." Wittgenstein means "must stay put *while the door is turning*." The door is the specific inquiry/action. The river-bed shift happens on a much longer timescale than the turning of the door.
      *   *Key Insight:* Hinges are *functional*, not ontological. They aren't "True" in a capital-T sense; they are "acting as rules."

  3.  **Address the Bayesian/Ur-Prior Mapping:**
      *   *Rationalist Gloss:* Hinges = Ur-priors (fixed starting probabilities).
      *   *Wittgenstein's View:* Hinges are *not* propositions in the empirical sense. They look like empirical propositions ("The earth exists," "I have hands"), but they function as rules.
      *   *Credences:* You don't assign $P(Hinge) = 0.99999$. You assign it *no probability* because it's the framework *for* assigning probabilities. To doubt it is not to have a lower credence; it's to step outside the language game (madness, or a different game).
      *   *Inertia vs. Fixity:* "High inertia prior" implies it *could* update with enough evidence. Wittgenstein suggests that "evidence" only makes sense *relative* to the hinge. You can't get evidence against the hinge using the hinge's own logic.
      *   *Verdict:* The Bayesian mapping is a category error. It treats grammatical/rules as empirical hypotheses.

  4.  **Address the Rationality of the Shift (Kuhn vs. Evidence):**
      *   *The Shift:* When the river-bed moves (§97), is it rational?
      *   *Wittgenstein:* It's not usually a reasoned argument. It's more like a conversion, a change in training, or a slow erosion.
      *   *Kuhn:* Very close to Kuhnian paradigm shifts. Incommensurability.
      *   *Rationality:* It's not "irrational," but it's not "reasoned" in the standard sense. It's a change in the *standards* of reason.
      *   *Inside View:* From inside the game, you don't see the hinge moving. You see the *other* guys as wrong/mad. The shift is often recognized only in hindsight or from a sociological perspective.

  5.  **Address the Regress Problem (Yudkowsky vs. Wittgenstein):**
      *   *Yudkowsky ("Where Recursive Justification Hits Bottom"):* Tries to find the bottom. Implies there *is* a bottom (causal reality, sensory experience) that justifies the chain. Still seeks a foundation.
