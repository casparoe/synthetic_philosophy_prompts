answer: |-
  You should tell your student that while her objection exposes a limitation in a superficial reading of Kant, it does not defeat his framework. In fact, if we take Kant's premises seriously, the structural invisibility of modern animal exploitation makes it *more* morally condemnable on Kantian grounds, not less.

  My specific view is this: Kant's framework **can and should** be extended to condemn industrial animal agriculture and anthropogenic extinction, but only if we shift the focus from the *episodic psychological impact* of a single act to the *maxim of participation* in a system that requires the systematic suppression of moral feeling. Kant would not concede that his account is silent; rather, he would argue that the bureaucratic distancing of cruelty constitutes a more profound corruption of moral character than the visible mistreatment of a faithful dog.

  Here is how that argument is constructed from within Kant's own premises.

  ### 1. From Acts to Maxims
  The student's objection assumes that Kantian coarsening is a causal, psychological reaction to a visible event (I see pain $\rightarrow$ I feel less sympathy). But Kantian ethics is not about the causal consequences of acts on the psyche; it is about the **maxims** upon which agents act.

  When a consumer buys factory-farmed meat, or an executive designs a supply chain based on extreme confinement, they are not merely performing an isolated act. They are adopting a maxim of action that relies on the premise: *"I may benefit from a system that entails massive suffering, provided I do not have to witness it directly."*

  For Kant, the moral worth of an action lies in the principle of volition. To will a system of mass suffering as a means to one's own ends (culinary pleasure, profit) is to adopt a principle of indifference. Even if the suffering is invisible, the *willing* of the conditions that produce it is a voluntary exercise of the will. The "coarsening" is not necessarily a sudden hardening of the heart after a specific event, but the gradual, deliberate alignment of one's will with a principle that treats sentient life as mere raw material. This violates the indirect duty because it normalizes a disposition of instrumentalization that is dangerously transferable to human relations.

  ### 2. Willful Ignorance as a Vice
  Kant places immense weight on the duty to avoid self-deception and moral laziness. In the *Metaphysics of Morals*, he argues we have a duty to cultivate our sympathetic feelings because they are "means" to morality.

  The invisibility of industrial agriculture is not a natural fact; it is a constructed outcome of human choices. The system depends on consumers *choosing* not to look, to use euphemisms ("harvesting" instead of "killing"), and to remain ignorant of the supply chain. For Kant, this **willful ignorance** is itself a corruption of character.

  The master who shoots his old dog is openly cruel; the modern consumer is *dishonestly* complicit. Kant would likely argue that the modern agent damages their moral character *more* than the visible abuser, because the modern agent must actively suppress their natural sympathy to maintain the comfort of ignorance. This active suppression is a direct violation of the duty to cultivate sympathetic feelings. If sympathy is a "prototypical" moral feeling that aids us in doing our duty to humans, then participating in a system that requires us to anesthetize that sympathy is a direct attack on the foundations of moral agency.

  ### 3. Humanity as a Collective Moral Culture
  Finally, the student's objection focuses on the individual agent ("No single farmhand... is coarsened"). But Kant's indirect duties are owed to **humanity** (*Menschheit*), which refers not just to individuals but to the moral species-being.

  Kant is concerned with the moral culture of the world. A society that institutionalizes the mass slaughter of beings capable of suffering creates a social ethos of domination and indifference. Even if a specific accountant working for a slaughterhouse does not feel "coarsened" on a Tuesday afternoon, the *institution* they sustain creates a normative environment where efficiency trumps sensitivity.

  If the moral law requires us to promote the highest good—a kingdom of ends—we must consider the social conditions that make moral agency possible. A culture built on the hidden, bureaucratic processing of life into commodities erodes the collective sensitivity required to recognize the dignity of persons. The "indirect duty" is therefore not just about saving my own soul, but about preserving the moral ecology of the human community. To normalize mass extinction and industrialized suffering is to degrade the moral standing of humanity itself.

  ### Conclusion
  You should press your student to see that Kant's reliance on "visible cruelty" in his examples was a limitation of his historical context, not a limitation of his ethical logic. The logic of the indirect duty argument is that **we must not damage the moral predispositions required for duty.**

  Modern industrial agriculture damages those predispositions more thoroughly than the shooting of a dog. It turns the suppression of sympathy into a civic requirement and the ignorance of suffering into a consumer right. Kant would not be silent; he would argue that the bureaucratic invisibility of cruelty is a sophisticated mechanism of moral self-corruption. Therefore, we have a strict indirect duty to oppose such systems, not for the sake of the animals, but to prevent the moral disintegration of the human agents who sustain them.
