prompt: |-
  I write about science and ideas for a living, and right now I'm working on a longread about the surprisingly long history of philosophers treating drinking as a moral test rather than just a vice. Everyone always points me to Plato's Symposium for the "philosophy and wine" angle, but it turns out the actual argument doing the work is buried in Book I of the Laws, where the Athenian Stranger tries to convince a Cretan and a Spartan that supervised drinking parties can actually train virtue. Right before he gets to wine specifically, he lays out this puppet-and-cords metaphor that I've now read about six times and only half get. Here's the bit (Jowett's translation, so forgive the creaky Victorian English -- this is roughly Stephanus 644d-645c if that helps):

  Ath Let me now proceed, if I can, to clear up the subject a little further by an illustration which I will offer you.
  Cle Proceed.
  Ath Do we not consider each of ourselves to be one?
  Cle We do.
  Ath And each one of us has in his bosom two counsellors, both foolish and also antagonistic; of which we call the one pleasure, and the other pain.
  Cle Exactly.
  Ath Also there are opinions about the future, which have the general name of expectations; and the specific name of fear, when the expectation is of pain; and of hope, when of pleasure; and further, there is reflection about the good or evil of them, and this, when embodied in a decree by the State, is called Law.
  Cle I am hardly able to follow you; proceed, however, as if I were.
  Meg I am in the like case.
  Ath Let us look at the matter thus: May we not conceive each of us living beings to be a puppet of the Gods, either their plaything only, or created with a purpose -- which of the two we cannot certainly know? But we do know, that these affections in us are like cords and strings, which pull us different and opposite ways, and to opposite actions; and herein lies the difference between virtue and vice. According to the argument there is one among these cords which every man ought to grasp and never let go, but to pull with it against all the rest; and this is the sacred and golden cord of reason, called by us the common law of the State; there are others which are hard and of iron, but this one is soft because golden; and there are several other kinds. Now we ought always to cooperate with the lead of the best, which is law. For inasmuch as reason is beautiful and gentle, and not violent, her rule must needs have ministers in order to help the golden principle in vanquishing the other principles. And thus the moral of the tale about our being puppets will not have been lost, and the meaning of the expression "superior or inferior to a man's self" will become clearer.
  Cle Perhaps, however, the theme may turn out not to be unworthy of the length of discourse.
  Ath Suppose that we give this puppet of ours drink -- what will be the effect on him?

  A few things I can't untangle. First, what work is the "golden cord" actually doing -- is it just a fancy stand-in for willpower, or is Plato claiming something stronger about the relationship between an individual's own reason and the city's law, since he seems to just identify the two? Second, he calls the golden cord "soft," which feels backwards to me -- shouldn't the cord you're supposed to grip hardest be the strong one, not the pliable one? And third, the part that actually matters for my piece: how does this picture of the self as a puppet yanked by competing cords set up the payoff a page later, where he argues you should deliberately get citizens drunk (weakening the reason-cord on purpose) precisely in order to strengthen it? That sounds like it should be self-undermining rather than clever, but he clearly thinks its not. Is there a real hinge that makes the argument work, or is this a spot where Plato's confidence is outrunning the actual logic?
