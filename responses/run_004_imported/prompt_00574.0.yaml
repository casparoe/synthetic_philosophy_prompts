      *   **Point 2: Solving Marginal Cases (The "Kind" & "Trusteeship" Argument).** Don't look at the individual in isolation. Look at the *kind*. Humans are the kind that create meaning. To violate the impaired is to violate the sanctity of the kind. Also, moral agents act as trustees.
      *   **Point 3: Solving Superbeings (The "Moral Community" Argument).** The Superbeings objection assumes a hierarchy of *worth*. But side constraints aren't about worth; they're about *inviolability*. If Superbeings are utilitarian, they are moral monsters, not judges. If they are Kantian, they respect us. The fear relies on accepting their utilitarian calculus, which Nozick rejects.
