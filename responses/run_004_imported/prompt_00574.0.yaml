answer: |-
  Your friend has put their finger on the exact nerve that keeps moral philosophers awake at night. The "superbeings" objection and the "marginal cases" objection are the pincers that usually crush any attempt to ground human rights in a specific capacity. If the capacity is scalar (like intelligence), the superbeings eat us. If it's a threshold (like rationality), we eat the infants.

  However, your suspicion is correct. There is a way to thread this needle, but it requires refining what Nozick means by "Kantianism" and moving away from a raw "capacity" view toward a **"form of life" and "moral community"** view.

  Here is the argument for how Nozick's distinction can be made principled, non-question-begging, and resilient against both objections.

  ### 1. The Grounding: Welfare vs. Biographical Life
  The first step is to clarify *why* Nozick proposes side constraints in the first place. It is not merely because humans are "smarter." It is because humans possess a specific relationship to their own existence that animals (generally) do not.

  Animals are subjects of **welfare**. They feel pain and pleasure. Their lives can go better or worse *for them*. This generates a moral claim: do not cause unnecessary suffering. This is the utilitarian calculus.

  Humans, however, are subjects of **biographical lives**. We do not just experience moments; we weave those moments into a narrative. We form long-term plans, commit to values, and strive to make our lives meaningful. As Nozick puts it, we have the capacity to "shape our life in accordance with some overall plan."

  **The Principle:** Side constraints exist not to protect *experience* (which animals have), but to protect *agency* and *meaning-creation*. To sacrifice a human for the greater good is to treat their life as a resource, which negates the very possibility of them shaping a life.

  **Why this isn't question-begging:** It doesn't say "Humans have rights because they are humans." It says "Beings capable of normative self-governance have rights because rights are the necessary condition for normative self-governance." It just so happens that humans are the only beings we know who fit this description.

  ### 2. Solving the Marginal Cases (Infants and the Impaired)
  This is the hardest hurdle. If rights depend on the capacity to shape a life, what about the infant or the severely cognitively impaired who lack that capacity?

  The defense lies in rejecting **individualistic atomism** in favor of **Kind Membership and Trusteeship.**

  *   **The Argument from Kind:** Moral status is not assigned solely based on an individual's current cognitive snapshot, but on the *kind* of being they are. A human infant is not a "non-rational animal"; it is a *rational being in development*. A severely impaired human is a *rational being damaged*. They belong to a kind whose characteristic mode of existence is moral agency. To treat them as mere resources is to violate the sanctity of the *kind* itself.
  *   **The Argument from Trusteeship:** Rights are claims made within a moral community. Normal moral agents (you and me) recognize that the *value* of our own autonomy depends on a culture that respects autonomy universally. If we allow the line to be drawn at "current rational capacity," we create a slippery slope that endangers everyone (since we all sleep, get drunk, or face dementia). Therefore, moral agents have a duty to extend the protective umbrella of "personhood" to all members of their moral kind, acting as **trustees** for those who cannot claim rights for themselves.

  **Why this survives the objection:** It doesn't claim the infant *has* the capacity. It claims the infant is *of the kind* that values capacity, and the moral community is obligated to protect the vulnerable members of that community to preserve the integrity of the community itself. This is not biological speciesism; it is moral solidarity. If we encountered a race of aliens who shaped their lives by overall plans, we would extend this protection to their infants, too.

  ### 3. Solving the Superbeings Objection
  Your friend argues that if superbeings outstrip us in rationality, they could treat us as we treat animals. This objection relies on a category error: it assumes moral status is a **hierarchy of worth** rather than a **threshold of inviolability.**

  *   **Rights are not a function of IQ:** Side constraints are not a reward for high test scores. They are a recognition of a specific *moral relationship* between beings. We cannot sacrifice humans because humans are "ends in themselves."
  *   **The Superbeings Dilemma:**
      1.  **If the Superbeings are Utilitarians:** If they calculate that eating us maximizes happiness, they are, by Nozick's lights, *morally wrong*. The fact that they are smarter does not make their morality correct. A superior physicist who believes the earth is flat is still wrong about the earth. Similarly, superior beings who reject side constraints are morally mistaken, not epistemically privileged. Their power does not validate their ethics.
      2.  **If the Superbeings are Kantians:** If they recognize side constraints, they will not eat us. Why? Because we *do* shape our lives by overall plans (relative to our capacity). We are not merely vessels of sensation. We are meaning-makers. Even if their meaning-making is more complex, ours is of the *same kind*. Kantianism requires respecting the autonomy of *all* rational agents, not just the *most* rational ones.

  **The Crucial Turn:** Nozick's thought experiment is designed to make us uncomfortable, but the discomfort comes from imagining the Superbeings as *utilitarians*. If we hold firm to "Kantianism for people," we must assert that *any* being capable of guiding their life by a plan is inviolable. The Superbeings cannot treat us as animals unless they first deny that we are meaning-makers—which is empirically false.

  ### 4. Synthesis: The "Meaning-Community" Defense
  To summarize the principled rationale that threads the needle:

  1.  **The Distinction:** The line is drawn between beings that merely *experience* value (animals) and beings that *create and negotiate* value (humans/persons).
  2.  **Marginal Cases:** Humans who cannot currently create value are protected because they are members of the *value-creating kind*, and the moral community acts as their trustees to preserve the sanctity of that kind.
  3.  **Superbeings:** Superbeings cannot justly sacrifice us because we *are* value-creators. If they sacrifice us, they are not proving their superiority; they are proving their moral bankruptcy (utilitarianism). If they are truly morally superior (Kantian), they will respect our inviolability.

  ### Conclusion
  Your friend's critique assumes that the ground for rights must be a **scalar trait** (like intelligence) that can be outgrown or undercut. But if the ground for rights is **membership in a moral community of meaning-makers**, the logic holds.

  We do not treat animals as resources because they are "dumber," but because they lack the capacity for moral reciprocity and biographical self-creation. We do not treat impaired humans as resources because, although they lack the capacity, they are *of us*—members of the community of meaning—and to violate them is to destroy the very concept of human dignity that protects us all. And we need not fear the Superbeings, unless we surrender our conviction that autonomy is inviolable regardless of who holds the bigger stick.

  Nozick's formula survives not by claiming humans are the center of the universe, but by claiming that **rights are the architecture required for a life to be more than just a container of sensations.** Any being that lives a life (human or otherwise) deserves protection; any being that merely feels one deserves welfare. That distinction is robust enough to hold the line.
