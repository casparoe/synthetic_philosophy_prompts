      *   Why the shift? If Nyāya insists perception is *only* determinate (*vyavasāyātmaka*), Dignāga charges them with conflating perception with inference/memory. If they insist it's *only* non-verbal (*avyapadeśya*), they can't explain how we know "This is a cow." The two-stage theory saves the phenomena.

  8.  **Structure the Response:**
