      *   Dignāga (*Pramāṇasamuccaya*): Defined perception as *kalpanāpoḍha* (free from conceptual construction). Explicitly rejected *vyavasāyātmaka* if it implies naming.
      *   Impact on Nyāya: Uddyotakara (*Nyāyavārttika*) attacked Dignāga fiercely. He defended the reality of universals and the validity of determinate perception.
