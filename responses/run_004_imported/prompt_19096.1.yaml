      *   **Context:** Seminar setting, student level (advanced enough to know the sūtra and terms, needs philosophical nuance).

  2.  **Deconstruct the Sūtra & The Tension:**
      *   *Indriyārthasannikarṣotpannaṃ jñānam*: Cognition born of sense-object contact. (Causal condition).
