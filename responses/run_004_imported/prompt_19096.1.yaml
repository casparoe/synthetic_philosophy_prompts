answer: |-
  This is one of the most famous and fertile tensions in the history of Indian philosophy. You have identified the exact fault line where early Nyāya realism meets Buddhist epistemology, resulting in the sophisticated architecture of later Navya-Nyāya.

  The difficulty you are facing is not a misunderstanding on your part; it is the central exegetical problem that drove Nyāya epistemology for 1,500 years. The tension lies between **directness** (*avyapadeśya*) and **determinacy** (*vyavasāyātmaka*).

  Here is a breakdown of the opposing glosses, the philosophical stakes, the Buddhist pressure, and the resulting two-stage theory.

  ### 1. The Semantic Ambiguity of *Avyapadeśya*

  The term *avyapadeśya* is the pivot. Literally, it means "not to be stated" or "not associated with a name/word" (*a-vyapadeśya*). The commentarial tradition splits on how strictly to take the negation.

  **Reading A: The "Causal" Reading (Early Nyāya/Vātsyāyana)**
  *   **Gloss:** *Avyapadeśya* means "not **caused** by verbal testimony or words."
  *   **Implication:** Perception is direct. It does not rely on someone telling you "There is a fire" (testimony) or "Where there is smoke there is fire" (inference). The cognition arises directly from the sense-object contact.
  *   **Relation to Concepts:** This reading allows the cognition itself to *contain* words or concepts. I can see a cow and think "This is a cow." As long as that thought was triggered by my eyes seeing the animal, not by someone shouting "Cow!", it counts as *avyapadeśya*.
  *   **Harmony with *Vyavasāyātmaka*:** Perfect harmony. *Vyavasāyātmaka* means "of the nature of a settled judgment" (e.g., "This is that"). If perception is a judgment identifying an object, it fits this reading easily.

  **Reading B: The "Constitutive" Reading (Later Nyāya & Buddhist Influence)**
  *   **Gloss:** *Avyapadeśya* means "devoid of **association** with words/concepts."
  *   **Implication:** The cognition itself must be free from linguistic construction. It is a raw "given."
  *   **Relation to Concepts:** This reading excludes concepts. If I think "This is a cow," I am associating the visual datum with the universal "cowness" and the word "cow." This violates *avyapadeśya* in the strict sense.
  *   **Harmony with *Vyavasāyātmaka*:** **Direct Conflict.** A "settled judgment" (*vyavasāya*) implies distinguishing an object as a specific kind (qualifying the subject with a predicate). If perception cannot involve words/concepts (*avyapadeśya*), how can it be a judgment (*vyavasāyātmaka*)?

  ### 2. The Philosophical Stakes

  Why does this distinction matter? It turns on the **Foundationalist Role of Perception.**

  1.  **The Threat of Circularity:** Perception (*pratyakṣa*) is the foundation for Inference (*anumāna*). Inference relies on knowing the connection between universals (e.g., smoke and fire). If perception itself is already conceptual (i.e., if I need the concept of "fire" to perceive fire), then perception depends on prior concepts. Where did those concepts come from? If they come from inference, we have circularity. If they are innate, we risk idealism.
  2.  **The Possibility of Error:** Conceptualization is where error enters. I might see a rope and judge it to be a snake. The judgment ("This is a snake") is false. However, the raw visual sensation (a long, coiled shape) is not "false" in the same way; it is just data. If perception is *vyavasāyātmaka* (judgmental), perception can be erroneous. But the sūtra says perception is *avyabhicāri* (unerring).
      *   *Reading A* risks making perception fallible (since judgments can be wrong).
      *   *Reading B* secures infallibility (raw data is hard to falsify) but makes perception useless for daily life (we don't act on raw data; we act on "That is a tiger").

  ### 3. The Buddhist Intervention: Dignāga's Pressure

  You asked specifically about Dignāga. His role is catalytic.

  In his *Pramāṇasamuccaya*, Dignāga defined perception (*pratyakṣa*) as **_kalpanāpoḍha_** ("free from conceptual construction").
  *   For Dignāga, true perception grasps only the unique particular (*svalakṣaṇa*).
  *   The moment you apply a name or a universal ("cow"), you have moved from perception to conception (*kalpanā*), which is a form of inference or memory, not true perception.
  *   Dignāga explicitly attacked the Nyāya definition. He argued that if perception is *vyavasāyātmaka* (determinate/judgmental), it involves distinguishing and naming, which makes it conceptual. Therefore, Nyāya is conflating perception with inference.

  **Uddyotakara's Defense (6th Century):**
  In his *Nyāyavārttika*, Uddyotakara responds fiercely. He argues that universals are real and perceived. To deny conceptual perception is to deny that we see *cows*; we would only see meaningless blobs. He defends *vyavasāyātmaka* as the primary characteristic of perception. For Uddyotakara, *avyapadeśya* simply means "direct," not "non-conceptual."

  **The Problem Remains:**
  Despite Uddyotakara's defense, the logical force of Dignāga's critique lingered. If perception is the *foundation* of knowledge, there must be a stage where the mind contacts reality *before* it processes that reality through language. If every perception is already a judgment ("This is a cow"), how do we learn the meaning of "cow" in the first place? We need a pre-linguistic contact to ground the linguistic judgment.

  ### 4. The Two-Stage Solution (*Nirvikalpaka* and *Savikalpaka*)

  To hold both clauses of the sūtra together (*avyapadeśya* AND *vyavasāyātmaka*) and answer Dignāga, later Naiyāyikas (from Jayanta Bhaṭṭa onward, culminating in Gaṅgeśa) developed the two-stage theory.

  They argued that perception is a process with two temporal stages:

  **Stage 1: *Nirvikalpaka Pratyakṣa* (Indeterminate Perception)**
  *   **Description:** The first moment of sense-object contact. The mind grasps the object without associating it with a name, universal, or class. It is a raw "this-ness."
  *   **Sūtra Fit:** This stage satisfies **_avyapadeśya_** perfectly (no words/concepts involved).
  *   **Problem:** It is *not* **_vyavasāyātmaka_**. It is not a settled judgment. It is inarticulate.
  *   **Status:** Is it valid knowledge (*pramā*)? Early Nyāya said no (because you can't act on it). Later Navya-Nyāya said **yes**, it is valid, because it reveals the object as it is, without error.

  **Stage 2: *Savikalpaka Pratyakṣa* (Determinate Perception)**
  *   **Description:** The second moment. Memory and concepts kick in. The mind associates the raw datum with the universal and the name. "This is a cow."
  *   **Sūtra Fit:** This stage satisfies **_vyavasāyātmaka_** (it is a judgment).
  *   **Problem:** It technically violates strict **_avyapadeśya_** (because it involves words/concepts).
  *   **Resolution:** Later Nyāya argues this is still perception because it is *grounded* in the first stage. It is perception *by extension*.

  **How they reconcile the Sūtra:**
  The standard Navya-Nyāya move (found in Gaṅgeśa's *Tattvacintāmaṇi*) is to say that the definition in NS 1.1.4 **strictly applies to *nirvikalpaka* perception.**
  *   It is born of sense-contact.
  *   It is non-verbal (*avyapadeśya*).
  *   It is unerring (*avyabhicāri*).
  *   *Wait, what about vyavasāyātmaka?* Gaṅgeśa argues that even *nirvikalpaka* has a primitive form of determinacy (it grasps the object as distinct from others), or he argues that the definition primarily targets the *nirvikalpaka* stage to secure the foundation, while *savikalpaka* is accepted as the practical form of perception used in inference and daily life.

  Alternatively, some interpret *vyavasāyātmaka* not as "verbal judgment" but as "decisive presentation." Even the indeterminate perception presents the object decisively as *something*, distinct from nothingness.

  ### 5. Summary: Why the Shift?

  To answer your specific question on why later Naiyāyikas felt **driven** to this account:

  1.  **To Secure Foundationalism:** They needed a *nirvikalpaka* stage to answer the regress argument. If all perception is conceptual, concepts must come from somewhere. The *nirvikalpaka* stage provides the non-conceptual anchor that grounds the concepts.
  2.  **To Absorb Dignāga without Surrender:** They accepted Dignāga's insight that there is a non-conceptual mode of awareness (admitting *nirvikalpaka*), but they rejected his conclusion that *only* that mode is valid perception. They kept *savikalpaka* as valid to preserve the Nyāya realist view that we truly perceive universals and objects, not just ineffable particulars.
  3.  **To Save the Sūtra:** The two-stage theory allows them to say the Sūtra is not contradictory. One clause (*avyapadeśya*) points to the first stage; the other (*vyavasāyātmaka*) points to the second stage (or to a broad sense of "determinacy" present in both).

  **In seminar discussion:**
  You can frame it this way: The tension between *avyapadeśya* and *vyavasāyātmaka* is the tension between **Givenness** (the world imposing itself on us) and **Taking** (us categorizing the world).
  *   If you emphasize *avyapadeśya*, you risk making perception ineffable and useless for logic.
  *   If you emphasize *vyavasāyātmaka*, you risk making perception theory-laden and potentially erroneous.
  *   The two-stage theory is Nyāya's attempt to say: "We are given the world first (*nirvikalpaka*), and then we take it as something (*savikalpaka*), but both are part of the single perceptual event."

  This development transforms Nyāya from a simple realist school into a sophisticated epistemological system capable of debating the finest points of cognitive science with the Buddhists.
