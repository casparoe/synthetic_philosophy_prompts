      *   *Vyavasāyātmakaṃ*: Determinate/decisive/judgmental. (Structural condition).
      *   *Avyapadeśyam*: Non-verbal/not to be named. (The problematic term).
      *   *The Conflict:* If perception is *vyavasāyātmaka* (a settled judgment like "This is a pot"), it seems to involve concepts and words. But if it is *avyapadeśyam* (non-verbal), how can it be a judgment? A judgment usually implies predication ("This is such-and-such").

  3.  **Identify the Commentarial Traditions (The "Opposite Directions"):**
      *   *Reading A (Vātsyāyana/Uddyotakara):* *Avyapadeśya* means "not *caused* by words," but the cognition itself can be determinate. It distinguishes perception from testimony or inference based on words. It allows for *savikalpaka* (determinate) perception to be the primary definition.
      *   *Reading B (Later Naiyāyikas like Gaṅgeśa, influenced by Dignāga):* *Avyapadeśya* means "devoid of conceptual construction/association with names." This implies a *nirvikalpaka* (indeterminate) stage.
      *   *The Tension:* If *avyapadeśya* means "no words/concepts involved," then *vyavasāyātmaka* (which implies identifying an object as a specific kind) seems contradictory.

  4.  **Analyze the Philosophical Stakes:**
      *   **Foundationalism:** Perception is the foundation (*pramāṇa*) for inference. If perception is conceptual, is it contaminated by language/social constructs? If it's non-conceptual, can it serve as a premise for inference (which is conceptual)?
      *   **Truth/Error:** *Avyabhicāri* ensures truth. Conceptualization introduces the possibility of error (mistaking a rope for a snake). Non-conceptual raw data is harder to get "wrong" in the same way.
      *   **Relation to Reality:** Does perception grasp universals (*sāmānya*) or only particulars (*svalakṣaṇa*)? Nyāya says both; Buddhism (Dignāga) says only particulars.

  5.  **Address the *Vyavasāyātmaka* vs. *Avyapadeśya* Conflict:**
      *   *Vyavasāyātmaka* implies a decision: "This is that."
      *   *Avyapadeśya* implies no naming.
      *   *Early Nyāya (Vātsyāyana):* Tends to prioritize *vyavasāyātmaka*. *Avyapadeśya* just means the *source* isn't verbal testimony. Perception is primarily determinate.
      *   *Later Nyāya (Navya-Nyāya):* Prioritizes *avyapadeśya* to answer Buddhists. This forces the two-stage theory.

  6.  **The Two-Stage Theory (*Nirvikalpaka* & *Savikalpaka*):**
      *   *Nirvikalpaka:* First moment. Sense contact. No concepts, no words. Just "something there." Fits *avyapadeśya*. But is it *vyavasāyātmaka*? Not really. Is it *pramā* (valid knowledge)? Early Nyāya said no, later said yes.
      *   *Savikalpaka:* Second moment. Concepts applied. "This is a cow." Fits *vyavasāyātmaka*. Does it fit *avyapadeśya*? Only if *avyapadeśya* is interpreted loosely (not *caused* by words) or if the definition applies primarily to the first stage (which creates tension).
      *   *Resolution:* The definition in NS 1.1.4 is often interpreted by later Naiyāyikas as applying strictly to *nirvikalpaka* (to satisfy *avyapadeśya*), while acknowledging *savikalpaka* as the practical perception used in life and inference. OR, they reinterpret *avyapadeśya* to mean "not *merely* verbal."
