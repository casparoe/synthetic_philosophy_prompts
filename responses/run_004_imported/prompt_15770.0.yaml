prompt: |-
  I'm reporting a feature on the statistical side of the replication crisis, and I keep running into an unsettling claim from the reform camp: that in very large studies — the biobank-scale genetic association studies and large multi-lab replication projects that are now common — a result can clear the p < .05 threshold while a Bayesian analysis of the identical data assigns the null hypothesis a high posterior probability, sometimes overwhelmingly so. I gather this is a known phenomenon called the Jeffreys–Lindley paradox, and I can follow the algebra that produces it, but every write-up I've found just presents the formula rather than building intuition for it. Could you explain, without leaning on notation, why it is specifically the growth of sample size that drives the two approaches apart rather than bringing them into agreement, and why statisticians tend to locate the "problem" in the diffuseness of the prior under the alternative hypothesis rather than in the p-value itself? I need to be able to walk a general readership through the gist without hand-waving.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Request:**
      *   **Topic:** The Jeffreys-Lindley Paradox (JLP) in the context of the replication crisis, specifically large-scale studies (biobanks, multi-lab replications).
      *   **Core Claim:** Large studies can yield $p < 0.05$ (significant) while Bayesian analysis assigns high probability to the null hypothesis.
      *   **User's Understanding:** They know the algebra/formula but lack intuition.
      *   **Specific Questions:**
          1.  Why does *sample size growth* drive the approaches apart (instead of converging)?
          2.  Why do statisticians blame the *diffuse prior* under the alternative rather than the p-value?
      *   **Target Audience:** General readership (needs clear analogies, minimal notation, strong intuition).
      *   **Goal:** Provide an explanation that avoids hand-waving but doesn't get bogged down in math.

  2.  **Deconstruct the Jeffreys-Lindley Paradox (JLP):**
      *   *What is it?* A conflict between frequentist significance testing (p-values) and Bayesian hypothesis testing (Bayes Factors/Posterior Probabilities) as $n \to \infty$.
      *   *The Setup:* Testing $H_0: \theta = 0$ vs. $H_1: \theta \neq 0$.
      *   *The Frequentist View:* As $n$ increases, the standard error shrinks. Even a tiny deviation from 0 becomes "statistically significant" because the test statistic ($\hat{\theta} / SE$) grows.
      *   *The Bayesian View:* We compare the likelihood of the data under $H_0$ vs. $H_1$. $H_1$ usually assumes a spread of possible values (a prior). As $n$ increases, the likelihood function becomes very narrow (spiky). If the prior for $H_1$ is very wide (diffuse), the average likelihood under $H_1$ drops because the spiky likelihood only overlaps with a tiny fraction of the wide prior. $H_0$ stays concentrated at 0. If the data is close to 0 (even if significantly different), $H_0$ looks better than the average of $H_1$.
      *   *The Crux:* The p-value asks "How unlikely is this data if Null is true?" The Bayes Factor asks "How much more likely is this data under Null vs. Alternative?"

  3.  **Address Question 1: Why does sample size drive them apart?**
      *   *Intuition:* Precision vs. Prediction.
      *   *Frequentist:* Focuses on *precision*. With huge $n$, we can measure tiny effects very precisely. If the effect is non-zero, no matter how small, we detect it.
      *   *Bayesian:* Focuses on *prediction*. The alternative hypothesis has to "bet" on where the effect is. If the bet is spread too thin (diffuse prior), and the data lands in a specific spot (even a small one), the "average" performance of the alternative hypothesis suffers compared to the null which bet everything on exactly zero.
      *   *Key Insight:* As $n$ grows, the "signal" needed for significance shrinks. But the Bayesian penalty for a vague alternative grows. The p-value threshold stays fixed (0.05), but the evidence required to overcome a diffuse prior increases.

  4.  **Address Question 2: Why blame the prior, not the p-value?**
      *   *The "Unfair Fight" Analogy:* The p-value tests $H_0$ alone. The Bayes Factor compares $H_0$ to $H_1$.
      *   *The Straw Man:* If $H_1$ is "anything other than zero," it's a terrible prediction. It's like betting on "any number except 5" in a lottery. If the result is 5.0001, $H_0$ (betting on 5) looks smarter than $H_1$ (betting on the whole rest of the number line).
      *   *Statistical Consensus:* Most modern Bayesians agree that using a "default" diffuse prior (like Cauchy(0, 1) or Uniform over huge range) for point-null testing is often inappropriate for large $n$. It makes $H_1$ too vague to be falsifiable.
      *   *P-value Defense:* The p-value is doing exactly what it's designed to do: detect departures from null. The "problem" is interpreting $p < 0.05$ as "strong evidence for a meaningful effect" rather than "evidence against exact null."

  5.  **Drafting the Explanation - Section by Section:**

      *   **Introduction:** Acknowledge the paradox. Validate the user's observation. State the core tension: *Detection* vs. *Comparison*.
      *   **Part 1: The Frequentist Lens (The Microscope).** Explain p-values as a measure of resolution. Large $n$ = high resolution. Tiny specks look like boulders. The threshold (0.05) doesn't change with resolution.
      *   **Part 2: The Bayesian Lens (The Wager).** Explain Bayes Factors as a betting market. $H_0$ bets on Zero. $H_1$ bets on "Not Zero."
      *   **Part 3: The Clash (Why $N$ matters).** This is the hard part.
          *   Imagine the prior for $H_1$ is a wide blanket.
          *   Imagine the Data is a pinpoint.
          *   As $N$ grows, the pinpoint gets sharper.
          *   If the pinpoint is near zero (but not *on* zero), the p-value says "Not Zero!"
          *   But the Bayesian says: "Your blanket ($H_1$) is so wide that the probability density at this specific pinpoint is tiny. $H_0$ put all its chips on Zero. The data is *close* to Zero. $H_0$ wins the bet."
          *   *Crucial Point:* The p-value asks "Is it exactly zero?" The Bayes Factor asks "Is 'Exactly Zero' a better prediction than 'Anything Else'?"
      *   **Part 4: Why blame the Prior?**
          *   The "Omnibus Alternative" problem. $H_1$ is often a straw man.
          *   In big data, we expect small effects. A prior that spreads probability evenly over small and huge effects is unrealistic.
          *   If we made $H_1$ more specific (e.g., "Effect is small but non-zero"), the paradox diminishes.
      *   **Part 5: Takeaway for the Article.**
          *   P-values detect *existence*.
          *   Bayes Factors weigh *predictive accuracy*.
          *   In big data, "statistically significant" $\neq$ "scientifically interesting."

  6.  **Refining the Analogies (Self-Correction during drafting):**
      *   *Initial thought:* Use the "needle in a haystack" analogy.
      *   *Correction:* That's usually for power. Better to use a "Archer/Target" analogy or a "Betting" analogy. Let's go with the **Betting/Wager** analogy for Bayes and the **Microscope/Ruler** for Frequentist.
      *   *Refining the "Diffuse Prior" blame:* Make sure to explain that a diffuse prior dilutes the probability mass. If you bet on everything, you bet on nothing strongly.
      *   *Addressing the "Problem":* Ensure I clarify that the paradox isn't a mathematical error, but a category error in interpretation.

  7.  **Final Polish:** Check tone. Needs to be authoritative but accessible. Avoid $\LaTeX$ where possible, or keep it extremely simple. Ensure the distinction between "Evidence against Null" (p-value) and "Evidence for Null vs Alternative" (Bayes) is sharp.

      *(Self-Correction on the "Blame" aspect)*: I need to be careful not to say p-values are "right." The consensus is that the *interpretation* is wrong. But regarding the paradox specifically, the mathematical driver is the prior specification. I should emphasize that a "point null" vs "diffuse alternative" is an unfair comparison that gets worse with $N$.

  8.  **Final Review against constraints:**
      *   No heavy notation? Check.
      *   Intuition over algebra? Check.
      *   Address sample size growth? Check.
      *   Address why prior is blamed? Check.
      *   Suitable for general readership context? Check.

      *(One last thought)*: I should mention that in genetics, the "null" is often biologically implausible (everything is connected), which makes the JLP even more relevant. The null is a fiction, but a useful fiction for screening.

      *Let's structure the response.*
      1.  The Core Tension (Detection vs. Prediction).
      2.  The Frequentist Microscope (Why $N$ makes p-values small).
      3.  The Bayesian Wager (Why $N$ makes Bayes Factors favor Null).
      4.  The Dilution Effect (Why the Prior takes the blame).
      5.  Summary for the article.

      *Wait, one nuance:* Why does $N$ make Bayes favor Null? Because the likelihood becomes narrower than the prior. The average likelihood under $H_1$ drops. I need to explain "Average Likelihood" simply. "Expected predictive success."

