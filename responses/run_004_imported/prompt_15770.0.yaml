answer: |-
  This is one of the most subtle and important conceptual hurdles in modern statistics. You are right to sense that standard explanations often hide behind the algebra of Bayes Factors without explaining the *mechanical* reason why more data can seemingly support the null.

  To explain this to a general readership, you need to distinguish between what the two methods are actually *doing*. They are not two ways of calculating the same thing; they are answering fundamentally different questions.

  Here is an intuitive framework for the Jeffreys–Lindley paradox, broken down by your two specific questions.

  ### 1. Why does sample size drive them apart?
  **The Short Answer:** The p-value measures **resolution**; the Bayesian analysis measures **prediction**. As sample size grows, resolution increases indefinitely, but predictive accuracy depends on how specific your predictions are.

  **The Frequentist Microscope**
  Imagine the p-value as a microscope. Its job is to detect *any* deviation from a perfect zero effect.
  *   In a small study, the lens is foggy. You need a massive effect to see it clearly against the noise.
  *   In a biobank-scale study (huge $N$), the lens is incredibly high-resolution. You can detect deviations that are microscopic.

  The p-value threshold (0.05) is fixed. It asks: *"Is the data incompatible with a perfect zero?"*
  With enough data, even a trivial, scientifically meaningless effect (e.g., a genetic variant that changes height by 0.1mm) becomes "incompatible with zero." The p-value drops because the measurement is so precise that we are confident the effect is not *exactly* zero. The p-value is doing its job: it is detecting a non-zero signal.

  **The Bayesian Wager**
  Now imagine the Bayesian analysis as a betting market. It doesn't just look at the Null; it compares the Null against the Alternative.
  *   **The Null Hypothesis ($H_0$):** Places all its chips on the number **0**.
  *   **The Alternative Hypothesis ($H_1$):** Must place its chips on **"anything other than 0."**

  Here is where sample size creates the divergence. To make the Bayesian math work, you have to specify a **prior distribution** for the Alternative. This represents where you think the true effect lies before seeing the data. In standard "default" Bayesian testing (which triggers the paradox), this prior is **diffuse**. It spreads probability mass over a wide range of possible effect sizes (e.g., from -10 to +10), because we want to be open-minded.

  As sample size ($N$) grows, the data becomes very precise. The "likelihood" (what the data says) becomes a very narrow spike.
  *   **Scenario:** The data shows a tiny effect, say 0.05.
  *   **Frequentist:** "With this much data, 0.05 is definitely not 0. Significant!"
  *   **Bayesian:** "Wait. The Null bet everything on 0. The Alternative bet on a wide range from -10 to +10. The data landed at 0.05. That is very close to 0. The Null's bet is looking very smart. The Alternative's bet is spread so thin that the probability density at exactly 0.05 is tiny."

  **The Divergence:**
  As $N$ increases, the p-value chases *precision* (is it exactly zero?), while the Bayes Factor chases *predictive density* (which hypothesis predicted this specific data point better?).
  With huge $N$, the data spike becomes narrower than the Alternative's prior spread. Even if the data is "significantly" different from zero, it is often *closer* to zero than to the average expectation of the Alternative. The Null wins the betting match not because it is true, but because the Alternative was too vague to compete with a precise measurement near zero.

  ### 2. Why do statisticians blame the prior, not the p-value?
  **The Short Answer:** Because the paradox reveals that the "Alternative Hypothesis" in these tests is often a **straw man**. It is set up to lose in large samples.

  **The "Omnibus" Alternative Problem**
  In the classic setup that produces the Jeffreys–Lindley paradox, the Alternative Hypothesis is essentially: *"The effect is anything other than zero."*
  Statisticians call this a "diffuse" or "flat" prior. In a small study, this is fine. In a massive study, this is a terrible prediction.

  Imagine you are predicting the winner of a lottery.
  *   **Null:** "Ticket #5 will win."
  *   **Alternative:** "Any ticket *except* #5 will win."

  If Ticket #6 wins, the Alternative is technically correct. But if Ticket #5 comes up as a runner-up (very close to winning), the Null looked much more predictive than the Alternative, which spread its confidence over millions of losing tickets.

  In large-scale genetics or psychology, we often know that *some* effects exist, but they are likely small. If your Bayesian prior assumes the effect could be huge (to be "open-minded"), you are diluting your probability mass. You are betting a little bit on a massive effect, a little bit on a medium effect, and a little bit on a tiny effect.
  When the data comes in showing a **tiny** effect (which is common in big data), the Null (which bet 100% on zero) often has higher probability density at that specific point than the Alternative (which bet 1% on tiny effects and 99% on medium/large ones).

  **Why the P-Value gets a pass (mostly)**
  Statisticians tend to argue the p-value isn't "wrong" in this scenario; it's just being misinterpreted.
  *   **Correct Interpretation:** "We have high confidence the effect is not exactly zero." (True in big data).
  *   **Incorrect Interpretation:** "We have high confidence the effect is large/important." (False in big data).

  The paradox arises when researchers treat $p < 0.05$ as "Evidence for the Alternative." In large samples, $p < 0.05$ is merely "Evidence against the Exact Null." It does not validate a diffuse Alternative.

  **The Consensus View**
  Most modern statisticians argue that the "problem" lies in using a **default, diffuse prior** for the Alternative in the context of large $N$.
  1.  **Unrealistic Expectations:** In biobank studies, we expect effects to be small. A prior that assigns equal weight to huge effects is biologically implausible.
  2.  **Lindley's Insight:** The paradox shows that you cannot use the same "open-minded" prior for all sample sizes. As $N$ grows, your prior for the Alternative must shrink (become more concentrated around small values) to maintain calibration with the p-value.
  3.  **The Fix:** If you specify a Bayesian prior that reflects reality (e.g., "We expect effects to be non-zero, but likely small"), the paradox largely disappears. The Bayes Factor will then agree with the p-value that there is evidence for an effect.

  ### Summary for your Readership
  To walk your readers through this without hand-waving, you can use this narrative arc:

  1.  **The Setup:** In massive studies, we have a "Super Microscope" (Frequentist) and a "Betting Market" (Bayesian).
  2.  **The Conflict:** The Microscope sees a tiny speck and shouts "It's not empty!" (Significant p-value). The Betting Market looks at the wagers and says "The 'Empty' bet paid out better than the 'Something' bet" (High Null Probability).
  3.  **The Reason:** The "Something" bet was spread too thin. It was betting on huge effects that didn't happen. The "Empty" bet was concentrated. The data was tiny, so the concentrated bet won, even though the Microscope proved it wasn't *perfectly* empty.
  4.  **The Lesson:** The paradox isn't a math error; it's a warning. In the age of big data, "Statistically Significant" no longer means "Substantively Real." It often just means "Not Exactly Zero." If your Bayesian analysis says the Null is probable, it's telling you that while the effect isn't zero, your theory predicting a *meaningful* effect didn't predict the data as well as simply assuming nothing is happening.

  This frames the paradox not as a failure of statistics, but as a necessary correction for the inflation of expectations in the era of big data.
