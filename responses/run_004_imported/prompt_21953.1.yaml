          *   *Side A (Precision):* Wants to calculate "effective time" precisely (5y 8m - 1y = 4y 8m -> Eligible). Believes there's a factual truth to be found.
          *   *Side B (Discretion/Precedent):* Believes "effective years" is inherently vague. Wants to decide based on fairness and precedent, not pseudo-math.
      *   **Task:** Draft the decision memo (Eligible, Not Eligible, or Refer to Funder).
