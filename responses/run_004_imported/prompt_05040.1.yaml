answer: |-
  This is a sophisticated dispute that cuts to the heart of Augustinian moral theology. Your friend is defending a reading that aligns Augustine with a proto-social contract or natural law theory (truth as a social good owed to neighbors), while you are arguing for a reading that aligns Augustine with an ontological and soteriological framework (truth as a divine attribute owed to God, whose violation damages the soul).

  To make your case robust, we must refine the term "self-regarding." If it sounds like modern moral purity (keeping one's own hands clean regardless of consequences), your friend is right to call it anachronistic. However, if we define it as **ontological integrity**—the alignment of the human soul with the Divine Order—your reading is not only defensible but arguably more faithful to Augustine's Neoplatonic metaphysics.

  Here is the strongest formulation of your argument, structured to utilize your specific evidence while neutralizing the charge of anachronism.

  ***

  ### I. The Ontological Foundation: Speech as a Divine Sign
  Your argument gains its strongest footing not in ethics per se, but in Augustine's semiotics and metaphysics. For Augustine, speech is not merely a social tool; it is a *signum* given by God to communicate the *res* of the mind.

  In *De Mendacio*, Augustine defines a lie not primarily by its effect on the hearer, but by the internal dissonance in the speaker: *enuntiatio cum voluntate falsum enuntiandi* (an utterance with the will to state what is false). The sin lies in the **double-heartedness** of the speaker. The speaker possesses one truth in the mind but projects another in speech. This creates a rupture in the speaker's own integrity.

  *   **Against the Friend:** If the wrong were primarily other-regarding (a violation of the hearer's claim), then a lie told to a person who has no "claim" to the truth (e.g., a murderer at the door, or an enemy combatant) might be permissible. But Augustine forbids it.
  *   **For Your Reading:** The prohibition holds because the lie is a perversion of a God-given faculty. It is a sin against God (the Truth) first, and only secondarily against the neighbor. The damage is done to the *imago Dei* within the liar. Therefore, the ethics of lying are fundamentally about the moral constitution of the agent (what you call "self-regarding"), because the agent is the locus where the disorder occurs.

  ### II. Re-interpreting the Eightfold Typology
  Your friend argues the eightfold ranking tracks harm to the deceived and social trust. You can concede that harm *correlates* with the ranking, but argue it does not *constitute* the sinfulness.

  The hierarchy runs from lies in religious doctrine (worst) to lies to save a body from violation (least bad).
  *   **The Friend's View:** Religious lies are worse because they damage the soul of the hearer and social cohesion; bodily lies are better because they only protect physical safety.
  *   **Your Stronger View:** The hierarchy tracks **proximity to Divine Truth**, not just social harm.
      1.  Lies about religion are worst because they directly oppose God, who is Truth itself.
      2.  Lies for temporal advantage are better, but still sinful, because they prioritize temporal goods (bodily safety) over eternal Order.
      3.  **Crucial Point:** Even the eighth category (saving a body from violation) remains a *sin*. If the ethics were other-regarding, this lie would be *virtuous*, because the net harm to the victim (the deceiver) is outweighed by the benefit to the target (saving their life/chastity). Augustine refuses to call it virtuous. He calls it a "lesser sin." This proves the metric is not "harm to the deceived," but "disorder in the soul of the liar." The liar has still chosen a temporal good through a disordered means.

  ### III. The Romans 3:8 Anchor
  This is your strongest textual evidence. Augustine repeatedly invokes Paul: *"Let us not do evil that good may come."*

  *   **The Friend's Objection:** They might argue this is just a rule of thumb for general conduct.
  *   **Your Counter:** In *Contra Mendacium*, Augustine uses this as the absolute boundary condition. If the wrong of lying were located in the injury to the deceived, then saving a life would negate the wrong (the "good" would cancel the "evil").
  *   **The Implication:** By insisting that one cannot do evil (lie) even for the greatest good (salvation of a neighbor), Augustine locates the "evil" entirely in the **act itself** and its relation to the agent's will. The moral calculus is not consequentialist (weighing victim harm vs. benefit); it is deontological regarding the agent's orientation toward God. The "evil" is the turning away from Truth by the liar. Thus, the prohibition protects the liar's soul from disordered love (*ordo amoris*), not just the neighbor's right to information.

  ### IV. The Case of Rahab
  Your handling of Rahab is the litmus test. Scripture (Hebrews 11:31, James 2:25) praises her. Augustine cannot contradict Scripture, so he must explain why she is praised *despite* the lie.

  *   **The Friend's Reading:** Augustine struggles here because his absolutism clashes with the clear utility of her lie.
  *   **Your Reading:** Augustine resolves this by distinguishing the **agent** from the **act**.
      *   He praises Rahab for her *faith* and her *mercy* (the intent to protect God's people).
      *   He explicitly refuses to praise the *lie*. In *De Mendacio*, he suggests her lie was a fault forgivable due to her faith, or perhaps a "prophetic sign" rather than a standard lie (though he is hesitant to fully exonerate the act).
      *   **Why this supports you:** If the ethics were other-regarding, Rahab's act would be *justified* because the spies survived. The "victim" (the King of Jericho) had no claim to the truth because he was an enemy. But Augustine does not argue Jericho had no claim; he argues that **lying is inherently faulty**. He separates the merit of the person (who acted out of charity) from the morality of the action (which was a departure from Truth). This confirms that the moral weight rests on the integrity of the act/agent relation to God, not the outcome for the neighbor.

  ***

  ### V. Engaging the Friend's Objection: The "Moral Purity" Charge
  Your friend argues that your reading imports a modern, agent-centered concern with "moral purity." This is the most serious challenge. It suggests you are making Augustine into a Kantian or a modern conscientious objector.

  **Here is what survives that objection, and where you must concede:**

  1.  **Concession on "Rights" Language:** You should concede that your friend is right that Augustine does not speak in terms of "rights to truth." That is modern liberal language. However, **your friend is also guilty of anachronism** if they claim Augustine grounds this in a "standing claim" the neighbor has. Augustine grounds ethics in *Order* and *Love*, not claims or rights.
  2.  **Reframing "Self-Regarding":** To defeat the "moral purity" charge, you must clarify that for Augustine, the "self" is not an autonomous individual. The "self" is a creature oriented toward God.
      *   **The Argument:** It is not "self-regarding" in the sense of egoism (I want to be clean). It is **Theocentric**. To lie is to damage the *imago Dei* within oneself. It is a form of self-destruction spiritually.
      *   **Survival:** Your argument survives if you rephrase it: *Augustine's prohibition is not about the liar's subjective purity, but about the objective ontological disorder introduced into the soul when it speaks against the Truth (God).*
  3.  **The "Cherry-Picking" Charge:** Your friend says you focus on the hard cases (Rahab, the murderer at the door).
      *   **Rebuttal:** Hard cases reveal the *logic* of the system. In easy cases (lying for profit), both readings (harm vs. integrity) agree it is wrong. Only in the hard cases (lying to save a life) do the theories diverge. Since Augustine *still* calls it a sin in the hard cases, the "harm to victim" theory fails to explain the data. Only the "integrity/ontological" theory explains why a life-saving lie is still a sin. Therefore, you are not cherry-picking; you are testing the boundary conditions of the theory.

  ### Conclusion: The Verdict
  Your argument is the stronger of the two, provided you strip it of modern individualistic connotations.

  Augustine's ethics of lying are not primarily about **social utility** (your friend's view) nor **individual rights** (also your friend's view). They are about **ontological fidelity**.
  *   **The Eightfold Ranking** tracks the gravity of turning away from Divine Truth, not just social harm.
  *   **Romans 3:8** establishes the act as intrinsically disordered, regardless of consequences.
  *   **Rahab** shows that merit lies in the charity of the heart, not the justification of the lie.

  Your friend's "standard reading" relies on a conception of interpersonal justice that is too contractual for late antiquity. Augustine is concerned with the soul's alignment with God. When you lie, you do not just wrong your neighbor; you unmake yourself as a truthful creature. That is why even a lie to save a life is a sin: because the temporal safety of the body cannot justify the spiritual disorder of the soul.

  **What survives of your friend's objection?** Only the warning against calling it "self-regarding" if that implies selfishness. It is "agent-centered," yes, but only because the agent is the temple where the war between Truth and Falsehood is fought. If you adjust that terminology, your reading stands firm.
