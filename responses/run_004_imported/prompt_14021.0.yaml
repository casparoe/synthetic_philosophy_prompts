answer: |-
  You have put your finger on one of the deepest fault lines in decision theory, one that separates the "axiomatic" tradition (von Neumann-Morgenstern, Savage) from the "dynamic agency" tradition (McClennen, Bratman, Gauthier) and the more recent "logical decision theory" tradition (Yudkowsky, Soares).

  The tension you perceive is not an accident of terminology; it is a substantive conflict between **Static Consistency** (don't have cyclical preferences) and **Dynamic Consistency** (don't deviate from your optimal plan).

  Here is the breakdown of the money-pump literature's implications for your specific question: *Should I cultivate resolute dispositions (irrevocable pledges) or treat every node as a fresh optimization?*

  ---

  ### 1. Clarifying the Two Registers
  First, it is worth explicitly disentangling the two "money pumps" you identified, as they license different conclusions.

  *   **The Static Pump (Intransitivity):** You prefer A to B, B to C, and C to A. An exploiter trades you A$\to$B$\to$C$\to$A, charging a fee each time.
      *   *Implication:* Your *preference ordering* is broken. Fix the preferences.
  *   **The Dynamic Pump (Time Inconsistency):** At $T_1$, you plan to do X at $T_2$. At $T_2$, you prefer Y to X. An exploiter (or the structure of reality) offers you a contract at $T_1$ that you accept, but you deviate at $T_2$, leaving you worse off than if you hadn't signed. (e.g., Parfit's Hitchhiker).
      *   *Implication:* Your *choice procedure* is broken. Either fix the preferences (make them time-consistent) **OR** fix the procedure (adopt Resolute Choice).

  The crux of your reading group's debate lies in the second case. **McClennen's *Rationality and Dynamic Choice*** argues that you can keep "tempting" preferences (like hyperbolic discounting or Allais-style certainty effects) *without* being money-pumped, provided you adopt a **Resolute** choice procedure. The axiomatic tradition argues that Resoluteness is irrational because it violates **Separability** (the idea that your choice at a node should depend only on the subtree ahead, not the path taken to get there).

  ---

  ### 2. The Case for Resoluteness (The "Agency Over Time" View)
  **The Strongest Argument:** *Rationality is about achieving goals, not just satisfying local constraints.*

  If you view yourself as a single agent extended over time, then "rationality" means maximizing your utility function across your entire lifespan, not just at the current decision node.

  *   **The Argument:** A "Sophisticated" chooser (who anticipates they will deviate and plans around it) often achieves suboptimal outcomes. For example, a Sophisticated agent knows they won't pay the driver in Parfit's Hitchhiker, so they never get in the car. A **Resolute** agent decides at $T_1$ to pay at $T_2$ and *sticks to that decision* even though, at $T_2$, paying looks strictly worse.
  *   **Implication for Your Life:** You should cultivate resolute dispositions. An irrevocable donation pledge is rational because it allows "You-at-T1" to harness resources that "You-at-T2" would otherwise squander.
  *   **Answering the "Privileging the Past Self" Objection:** This is not about privileging the past self; it is about **constituting the self**. If "You" are just a sequence of momentary time-slices with no binding authority, you cannot undertake any long-term project. Resoluteness is the glue that turns a sequence of selves into a single agent. As Bratman argues, plans have a normative status; they are not just predictions of future behavior. To abandon a plan without a *reason* (new information) is to fail at planning agency.
  *   **Decision Theory Support:** Updateless Decision Theory (UDT) formalizes this. UDT selects the optimal *policy* (mapping from situations to actions) once, and then executes it. It does not "reoptimize" at the node. In UDT terms, reoptimizing is a bug, not a feature.

  ### 3. The Case for Sophistication / Fresh Optimization (The "Separability" View)
  **The Strongest Argument:** *Binding your future self ignores information and risks locking in errors.*

  The standard economic critique of resoluteness (associated with Machina and others) relies on the **Separability Axiom**: When you are at a decision node, the past is sunk. Only the future consequences of your current actions should matter.

  *   **The Argument:** Why should "You-at-T2" be bound by "You-at-T1" if "You-at-T2" has different information or a legitimately evolved moral perspective?
      *   *Information:* If you pledge to donate \$10k in 2025, but in 2025 you discover the charity is fraudulent, a "flat policy against renegotiating" causes you to burn money uselessly.
      *   *Preference Evolution:* If you are a different person in 5 years, why should your current preferences tyrannize your future self? This is the "Dead Hand" problem.
  *   **Implication for Your Life:** Avoid irrevocable pledges. Instead, use **Sophisticated Choice**: Anticipate that your future self will want to deviate, and structure your current environment so that deviation is impossible or too costly (e.g., automatic payroll deduction rather than a manual pledge). This achieves the commitment without requiring "willpower" or violating Separability.
  *   **Addressing the Money Pump:** Proponents argue that real-world money pumps are rare. To pump someone, you need to find them repeatedly, offer specific trades, and have no transaction costs. In life, you rarely encounter a malicious actor offering you cyclical trades. Therefore, the theoretical vulnerability is not a practical guide for living.

  ### 4. The Deflationary View (Exploitability as a Cost)
  **The Strongest Argument:** *Rationality is ecological, not axiomatic.*

  This view (often found in behavioral econ and some LW circles) suggests that "money pump arguments" prove too much.

  *   **The Argument:** Having incomplete preferences or time-inconsistent preferences might be computationally cheaper or robust in ways that strict VNM-rationality is not. If the cost of being pumped is low (e.g., you lose \$50 over a decade) but the cost of maintaining a Resolute disposition is high (cognitive load, missing opportunities to update), then the "irrational" strategy is actually the adaptive one.
  *   **Implication for Your Life:** Don't worry about axiomatic purity. Treat "resoluteness" as a heuristic. If you know you are weak-willed about donations, make a pledge. If you think your values might shift significantly (e.g., you might have children, change careers), keep flexibility. The "pump" only matters if there is a pump *operator*.

  ---

  ### 5. Synthesis: How to Decide on Your Pledge
  To resolve your reading group's stalemate and your personal decision, you need to distinguish between **Preference Change** and **Akrasia**.

  The money-pump literature licenses resoluteness *only* when the future deviation is driven by **dynamic inconsistency** (akrasia/weakness of will), not by **informational update** or **value drift**.

  **1. The "UDT" Test for Resoluteness:**
  Ask yourself: *If I could precommit my future self from behind a veil of ignorance (not knowing what specific temptations or new info they would have), would I want them to be bound?*
  *   **Yes:** If the temptation is predictable (e.g., "I will want to keep the money for luxury goods"), then Resoluteness is rational. The "Past Self Privilege" critique fails here because the Future Self *agrees* with the Past Self's assessment, they just lack the willpower.
  *   **No:** If the uncertainty involves factual states (e.g., "The charity might be scamming me" or "I might be bankrupt"), then Resoluteness is irrational. Here, Separability holds. You should reoptimize.

  **2. The Mechanism Matters:**
  *   **Irrevocable Pledge (Hard Precommitment):** This forces Resoluteness. It is high-risk, high-reward. It protects against akrasia but exposes you to "Dead Hand" risks (locking in errors).
  *   **Automatic Renewal / Payroll Deduction (Soft Precommitment):** This leverages Sophistication. You anticipate the future self's laziness (status quo bias) and use it to your advantage. This is often superior to hard irrevocability because it allows for cancellation if *true* emergencies arise, while still blocking most impulsive deviations.

  **3. The "Money Pump" Reality Check:**
  In the context of charitable giving, who is the money pumper?
  *   If you donate to Charity A, then switch to B, then back to A, you haven't necessarily lost money unless there are transaction fees or impact loss due to inconsistency.
  *   The real "pump" in this context is **your own time inconsistency**. You value "Being a Donor" at $T_1$, but value "Having Cash" at $T_2$.
  *   If you view your life as a single project, the "loss" is the failure to fund the project, not the specific transaction path.

  ### Recommendation for Your Life

  **Do not adopt a "flat policy against ever renegotiating."** That is dogmatism, not rationality. It violates the Separability principle in cases where new information *should* matter.

  **Instead, adopt a "Resolute Policy with Escape Clauses."**
  1.  **Commit Resolutely to the *Goal*:** Decide now that you are a person who donates X% of income. This is a UDT-style policy selection.
  2.  **Commit Sophisticatedly to the *Mechanism*:** Set up automatic transfers. This acknowledges that your future self will be tempted to stop the transfer.
  3.  **Allow Renegotiation Only on *External* Grounds:** Make a rule that you can only break the pledge if (a) the charity fails its mission, or (b) your income drops below a threshold. Do not allow "I want to buy a thing" as a valid reason.

  **For Your Reading Group:**
  The stalemate exists because one side is defending **Instrumental Rationality** (achieving goals over time requires resoluteness) and the other is defending **Procedural Rationality** (choices must be justifiable at the moment they are made).
  *   **The Verdict:** Money pump arguments *do* license resoluteness, but only as a means to secure dynamic consistency for a *fixed* utility function. They do not license binding your future self if your utility function has legitimately updated based on new moral arguments or facts. Resoluteness is rational when it prevents **akrasia**; it is tyranny when it prevents **learning**.

  In short: Be resolute about your *policies*, but sophisticated about your *exceptions*.
