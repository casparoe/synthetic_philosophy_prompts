      *   **Core Subject:** The "Problem of Old Evidence" (POE) in Bayesian epistemology/philosophy of science.
      *   **Specific Example 1:** General Relativity (GR) explaining Mercury's perihelion precession (old evidence, strong confirmation intuition).
      *   **Specific Example 2:** User's science-fair project (HARKing - Hypothesizing After Results are Known, weak confirmation intuition).
