          *   The "old evidence" was actually *anomalous* under the old theory (Newton). It wasn't just "data"; it was "data that didn't fit."
          *   The derivation was non-trivial.
      *   *Why is HARKing different?*
          *   Usually involves tuning parameters or selecting variables *after* seeing the noise.
          *   High risk of overfitting.
          *   No independent constraint on the hypothesis.
      *   *The Principled Distinction:* It's not about *time* (old vs. new), it's about *independence* and *severity*.
          *   Did the hypothesis have to take *that* specific value to be true? (GR: Yes, the precession amount is fixed by the theory).
          *   Or could the hypothesis have been adjusted to fit *any* value? (HARKing: Yes, I can draw the trend line wherever).

  5.  **Synthesize the "Implications for Weighing Cases":**
      *   *Implication 1: Time is irrelevant; Construction is key.* The POE teaches us that the *temporal order* of evidence and hypothesis is less important than the *logical/structural relationship*.
      *   *Implication 2: The "No-Adjustment" Criterion.* GR is strong because Einstein couldn't fudge the numbers. HARKing is weak because the researcher *could* have fudged the hypothesis to fit the data.
      *   *Implication 3: Bayesian Solutions (Garber-style).* We update on the *connection* ($H \to E$), not $E$ itself. In GR, discovering the connection was a huge cognitive leap. In HARKing, the connection is often trivial (curve fitting).
      *   *Implication 4: Severity (Mayo).* Did the test have a high probability of detecting an error if the theory were false? GR passed a severe test (Newton failed). HARKing usually avoids severe tests.

  6.  **Drafting the Response (Iterative refinement):**
