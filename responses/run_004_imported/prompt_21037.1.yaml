      *   *Why it matters:* It threatens the Bayesian account of scientific reasoning because historically, most major theories (GR, Newtonian gravity, Evolution) were accepted based on evidence already known at the time.

  3.  **Evaluate Standard Philosophical Responses:**
      *   *Response 1: Counterfactual/Historical Reconstruction (Garber, etc.).* We don't conditionalize on $E$ itself, but on the *logical relationship* between $H$ and $E$ (i.e., "H entails E"). We imagine a state where we know $E$ but don't know that $H$ entails $E$.
      *   *Response 2: Subjective/Uncertain Evidence.* Maybe $P(E)$ isn't actually 1. We are fallible. But this feels like cheating for something as solid as Mercury's orbit.
      *   *Response 3: Novel Prediction vs. Accommodation.* This is the key distinction the user is looking for. Accommodation (fitting old data) vs. Prediction (fitting new data).
