      *   **The Goal:** The user wants to know the *implications* of POE for weighing these cases. They want a *principled distinction* between the GR case (good) and the HARKing case (bad), rather than a blanket "both are shaky" or "both are fine" conclusion.

  2.  **Analyze the "Problem of Old Evidence" (POE):**
