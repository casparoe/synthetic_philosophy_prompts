answer: |-
  This is an exceptionally sharp observation, and you are in good company. Many philosophers have noted that Woodward's interventionism retains the counterfactual skeleton of Lewis's account. Woodward himself acknowledges that interventionist claims are cashed out in terms of counterfactuals. If both theories say "C causes E iff, had C been different, E would have been different," the difference can easily look like mere technical refinement rather than a metaphysical revolution.

  However, to dismiss the distinction as merely "emphasis and formal bookkeeping" would be to overlook profound disagreements regarding **reductivity**, **semantics**, and **ontology**. While Woodward inherits the counterfactual *form*, he fundamentally alters the *truth conditions* and the *philosophical project* underlying them.

  Here is a principled case for treating interventionism as a distinct research program, specifically addressing your skepticism about the "subset" claim and the preemption objection.

  ### 1. The Reductive vs. Non-Reductive Split
  The most significant philosophical divergence lies in the ambition of the analysis.

  *   **Lewis's Project:** Lewis was engaged in a **reductive analysis**. He aimed to analyze causation in terms of counterfactuals, and counterfactuals in terms of similarity relations between possible worlds, all while maintaining **Humean Supervenience**. For Lewis, the truth of a counterfactual must supervene on the mosaic of particular matters of fact. Crucially, the analysis must not be circular: you cannot use causal notions to analyze counterfactuals if you are using counterfactuals to analyze causation.
  *   **Woodward's Project:** Woodward explicitly abandons the reductive project. In *Making Things Happen*, he argues that "intervention" cannot be defined in non-causal terms without rendering the theory toothless or circular in a vicious way. Instead, he embraces a **non-reductive** account. An intervention is defined using causal language (e.g., the intervention variable $I$ must not be caused by other variables in the system).

  **Why this matters:** If you are right that Woodward just carved out a subset of Lewisian counterfactuals, Lewis should be able to accept that subset using his similarity semantics. But he can't. For Lewis, the truth of "If I had intervened..." must be determined by world-similarity. For Woodward, the truth is determined by the **structural equations** of the system. Woodward treats the causal structure as primitive (or at least not reducible to Humean mosaics). This is a fundamental metaphysical disagreement, not just a narrowing of scope.

  ### 2. Semantics: Similarity vs. Modularity
  You noted that an intervention specifies a "particular kind of counterfactual antecedent." The disagreement is about **what makes that counterfactual true.**

  *   **Lewis (Similarity):** To evaluate "If $C$ had not occurred...", Lewis looks for the closest possible world where $C$ does not occur. This involves a "miracle" or a divergence from the actual world's history. This leads to notorious problems with backtracking and the "future similarity" objection.
  *   **Woodward (Modularity/Invariance):** To evaluate "If we intervene on $X$...", Woodward does not look at possible worlds. He looks at the **structural model**. An intervention breaks the incoming arrows to $X$ (severing $X$ from its parents) and sets $X$ to a value. The truth of the counterfactual depends on whether the *other* equations in the system remain **invariant**.

  **The Principled Distinction:** Lewis's counterfactuals are about global similarity histories. Woodward's counterfactuals are about local structural stability. Woodward shifts the truth-makers of causal claims from "patterns of events across worlds" to "invariance of functional relationships." This is a shift from a metaphysics of **events** to a metaphysics of **explanatory structures**.

  ### 3. Ontology: Events vs. Variables
  Lewis analyzes causation as a relation between **particular events** ($c$ causes $e$). Woodward analyzes causation as a relation between **variables** ($X$ causes $Y$).

  *   **Lewis:** Focused on token causation. (Did this specific spark cause this specific fire?)
  *   **Woodward:** Focused on type-level causal relationships that *support* token claims. (Does the variable 'spark' causally influence the variable 'fire' in a way that is invariant?)

  This is not just bookkeeping. It changes what causation *is*. For Lewis, causation is a feature of the world's history. For Woodward, causation is a feature of the world's **capacities for manipulation and explanation**. Woodward's account is explicitly tied to what agents *could do* (even hypothetically). This links metaphysics closely with philosophy of science and epistemology in a way Lewis's purely metaphysical account does not.

  ### 4. Revisiting Late Preemption (Your Classmate's Point)
  Your classmate is correct, but the reason is deeper than "tidier apparatus."

  *   **In Lewis:** Late preemption is a crisis. If $A$ preempts $B$ in causing $E$, then $E$ does not counterfactually depend on $A$ (because if $A$ hadn't happened, $B$ would have caused $E$ anyway). Lewis had to resort to "quasi-dependence" and causal chains, which many found ad hoc.
  *   **In Woodward:** Preemption is handled by the **structure of the model**. In a structural equation model, we represent the preemption by specifying how the variables interact (e.g., a "switch" variable). The interventionist counterfactual asks: "If we intervene to set $A$ to 0, holding the structure fixed, does $E$ change?" Because the intervention severs $A$ from its causes, we don't have to worry about $B$ "backing up" to cause $E$ unless the model specifies that $B$ is independent.

  **The Deep Difference:** Lewis tries to save counterfactual *dependence* as the essence of causation. Woodward argues that dependence is not necessary; **invariance under intervention** is. In preemption cases, dependence fails, but the causal relationship holds because the structural relationship remains invariant. Woodward isn't just fixing Lewis's counterfactuals; he is rejecting the claim that counterfactual *dependence* is the essence of causation.

  ### 5. Conclusion: Distinct Research Programs
  To answer your core question: **Yes, there is a principled sense in which they are separate.**

  1.  **Metaphysical Commitment:** Lewis is a Humean Reductionist; Woodward is a Non-Reductive Realist (about causal structure).
  2.  **Truth Conditions:** Lewis relies on Possible Worlds Similarity; Woodward relies on Structural Equations and Invariance.
  3.  **The Role of Counterfactuals:** For Lewis, counterfactuals are the *analysans* (the tool of analysis). For Woodward, counterfactuals are the *language* used to express invariance, but the *truth-maker* is the causal structure itself.

  You are right that Woodward uses counterfactuals. But saying Interventionism is just a subset of Lewisian Counterfactualism is like saying Newtonian Physics is just a subset of Aristotelian Physics because both talk about "motion." They use the same vocabulary to describe fundamentally different underlying mechanisms.

  Lewis asks: *"In virtue of what non-causal facts is this causal claim true?"*
  Woodward asks: *"What must the world be like for this causal claim to be useful for explanation and manipulation?"*

  Those are different questions, requiring different research programs. The contrast in survey articles is not merely emphasis; it marks the shift from **metaphysical reduction** to **causal modeling**.
