answer: |-
  The kettle sat on the patio stones, the steam long gone. A thin film had formed on the surface of the water inside. Three feet away, the anthill bustled—a churning volcano of black dirt and frantic, purposeful movement.

  Maya crouched, her hand hovering over the kettle handle. Leo sat on his heels beside her, watching the ants, not her.

  "If you pour it," Leo said, his voice low, "you're not killing them instantly. It's scalding. It cooks the exoskeleton before the organs shut down."

  "I know," Maya said. She didn't move her hand. "That's the point of boiling water. It's supposed to be... definitive."

  "It's torture if they feel it. It's just chemistry if they don't."

  "That's the question, isn't it?" She pulled her hand back and wrapped her arms around her knees. "Two weeks, Leo. I've spent two weeks staring at this mound. I read that LSE review from 2021. The one the UK government used. They said crustaceans and cephalopods are sentient. But they explicitly punted on insects. They said the evidence was 'suggestive' but not 'conclusive.'"

  "Because the wiring is different," Leo said. He picked up a twig and drew a line in the dirt between them and the hill. "A crab has a more centralized nervous system. There's a place where the signals meet. With an ant? It's a string of ganglia. A distributed network. You cut off a leg, the leg keeps walking. The body keeps running. Where is the 'self' to feel the pain? If the leg walks away without the body knowing, who is suffering?"

  "Behavior isn't perfect proof, I get that," Maya said. "But it's the only proof we have. Even for you. I assume you feel pain because you yell when I pinch you. When an ant gets injured, it doesn't just twitch. It grooms the wound. It favors the limb. If you zap them, they learn to avoid the zap, even if it means taking a longer route to food. That's a trade-off. They're weighing discomfort against hunger."

  Leo tossed the twig aside. "That's nociception, Maya. It's input-output. A thermostat turns on the heat when it gets cold. It doesn't *suffer* from the cold. It just registers a deviation from the set point and corrects it. You can build a robot that favors an injured leg. You program a damage sensor to reduce power to a motor. Does the robot feel pain? Or does it just obey code?"

  "But at what point does the code become feeling?" Maya leaned forward. "We used to say that about babies. About animals. 'It's just a reflex.' Then we looked closer. The reason the UK excluded insects wasn't because they proved insects *don't* feel. It was because the data was messy. And if the data is messy, the precautionary principle kicks in. If there's a non-zero chance I'm pouring boiling water on a million conscious beings, I can't do it. The moral cost of being wrong is infinite."

  "The moral cost of paralysis is high, too," Leo countered. "You walk across this lawn. You crush beetles, aphids, maybe ants. You breathe in microbes. If you extend the benefit of the doubt to every nervous system that reacts to stimuli, you can't live. You starve. You have to draw a line somewhere. The UK drew it at decapods. Why? Because they have integration. They have a brain that receives the signal and creates a unified state. An ant colony acts like a brain, sure, but the individual ant? It's a neuron. Do you worry about the pain of a single neuron in your cortex when you get a headache?"

  "That's a category error," Maya snapped. "A neuron isn't an organism. An ant is. It feeds itself. It protects itself. And regarding the 'robot' argument—we know insects aren't simple reflex machines. Fruit flies will drink alcohol to numb themselves after a stressful event. Bees show pessimism bias when shaken. That's not a thermostat, Leo. That's an emotional state. It suggests there's an internal experience of the world, not just a reaction to it."

  "Optimism and pessimism are just labels we slap on probability weighting," Leo said, unmoved. "If a computer lowers its risk tolerance after a system error, is it depressed? Or is it optimizing for survival? I'm not saying they're definitely zombies. I'm saying we don't know. And 'we don't know' cuts both ways. If you spare the ants, you're prioritizing their potential suffering over your own agency. But if you assume they feel pain like a dog does, you're anthropomorphizing a system that evolved on a completely different hardware architecture."

  "I'm not saying they feel it like a dog. I'm saying they feel it like an ant." Maya gestured at the mound. "Look at them. They're not just scrambling. They're carrying dirt. They're coordinating. If I pour this water, the ones on top die screaming—metaphorically—and the ones below drown. If there is even a 10% chance they experience that as terror, I am a monster for doing it. If there's a 90% chance they don't, I've just wasted a kettle of water and have to find another way to move the hill."

  "But why stop at ants?" Leo pressed. "What about the nematodes in the soil under them? *C. elegans* has exactly 302 neurons. It avoids heat. It learns. Do you boil the soil? The precautionary principle is a black hole. It demands you treat everything as sentient until proven otherwise. But we can't prove otherwise. We can't even prove *other humans* feel pain, strictly speaking. We just assume it because they're like us. Ants aren't like us."

  "They're like us enough," Maya said softly. "They have opioid receptors. When you give them morphine, the pain response stops. Why would evolution give a machine a painkiller system if there was no pain to manage? That's the hardware argument you want. It's there. It's just small."

  "Receptors aren't experience," Leo said. "They're chemical switches. You're looking for a ghost in the machine, Maya. You want to find the little man inside the head who says 'ouch.' Science keeps looking and finding more gears. More levers. More chemical switches. The more we look, the smaller the space for the 'feeling' gets. Maybe the feeling is an illusion we have because our brains are big enough to model ourselves. An ant's brain is the size of a poppy seed. It might not have the RAM to render a 'self' that can suffer."

  "Or," Maya said, "suffering doesn't require a self. Maybe it's just raw data. A signal that says 'this is bad, make it stop.' If they have that signal, and they act to stop it, that's enough for me. I don't need them to write poetry about their pain. I just need to know they want it to end."

  Leo sighed, leaning back on his hands. The sun was dipping lower, casting long shadows across the anthill. The ants seemed to glow in the amber light, a river of black glass.

  "So we're stuck," Leo said.

  "We're stuck."

  "I can't prove they don't feel."

  "And I can't prove they do."

  Maya looked at the kettle. The water was perfectly still. "If I leave it, they might undermine the patio. The structural damage could be real."

  "If you pour it, you might commit a massacre."

  Maya reached out and touched the side of the kettle. It was lukewarm. "I hate this."

  "I know," Leo said. He watched an ant climb over the twig he'd drawn in the dirt. It paused, antennae twitching, sensing the chemical trail of the wood, then moved on, indifferent to the line. "It's the epistemic gap. We're trying to bridge the gap between objective matter and subjective experience with a shovel and a kettle."

  "The UK review said we need more research. Specific studies on insect nociception versus pain."

  "Research takes time. The patio is cracking now."

  Maya stood up. Her knees popped. She looked down at the anthill, then at the kettle. She didn't pick it up.

  "I'm going inside," she said. "I'm going to make tea. Fresh water."

  "And the hill?"

  Maya looked at the ants. They were already rebuilding the tunnel entrance where a foot had accidentally scuffed the dirt earlier. Relentless. Unthinking. Or thinking so differently it looked like instinct.

  "I'm not pouring it today," she said. "But I'm not promising tomorrow."

  "Fair," Leo said. He stood up too, brushing dirt from his jeans. "I won't stop you. But I won't help you carry the kettle."

  "I wouldn't ask you to."

  They left the kettle on the stones. The steam was gone, but the heat remained, trapped in the metal, radiating slowly into the cooling air, while the ants flowed around the shadow it cast, busy with a world neither of the humans could quite enter.
