  2.  **Deconstruct the Philosophical Conflict:**
      *   **Harsanyi's Argument:** Behind the veil, you have no information about your future identity. By the Principle of Insufficient Reason, you should assign equal probability to being any member of society. Therefore, you maximize expected utility. This leads to Average Utilitarianism. Risk aversion should be standard, not extreme.
      *   **Rawls's Counter-Argument:** The Veil isn't just about lack of information; it's about the *gravity* of the choice. This is a one-shot deal for your fundamental rights and life prospects. You can't gamble with your basic liberties or subsistence. The probabilities aren't knowable (it's not a lottery with known odds), so expected utility calculus doesn't apply. Maximin is rational when the stakes are catastrophic and the alternatives are unacceptable.

  3.  **Character Development:**
      *   **Protagonist 1 (Rawlsian):** Let's call her "Elara." She needs to emphasize the *non-reversibility* and the *severity* of the worst-case scenario. She should attack the idea that "equal probability" is a valid statistical claim in this metaphysical context.
      *   **Protagonist 2 (Harsanyi/Utilitarian):** Let's call him "Kael." He needs to emphasize *rationality*, *mathematical consistency*, and the *cost* of extreme risk aversion (stagnation, lost potential). He should attack the idea that avoiding the bottom justifies crippling the top.

  4.  **Drafting - Section by Section:**

