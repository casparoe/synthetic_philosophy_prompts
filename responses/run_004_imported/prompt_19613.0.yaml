      *   **Task:** Write a dialogue between two contract-designers behind the Veil of Ignorance.
      *   **Characters:**
          *   Character A (Rawlsian): Argues for the Difference Principle/Maximin.
          *   Character B (Harsanyi/Utilitarian): Argues for Average Utilitarianism/Expected Utility.
