answer: |-
  **Setting:** *The Antechamber. There are no walls, only a diffuse, grey luminosity. Two figures, S and E, sit across a table that seems to be made of solidified logic. They hold no memories of the world outside, only the capacity to reason and the knowledge that soon, the Veil will lift, and they will inhabit the society they design here.*

  **E:** (Tapping a stylus against the table) We're stalling. The calculus is straightforward. We maximize the expected utility. Since we have zero information about which station we will occupy, the Principle of Insufficient Reason dictates we assign an equal probability to being any individual in the society. If we maximize the average utility, we maximize our own expected payoff. It's Bayesian rationality 101.

  **S:** It's Bayesian rationality applied to a situation where probabilities do not exist. You're treating the structure of society like a lottery with known odds. It isn't. Behind this Veil, we don't just lack knowledge of the odds; we lack the basis for *any* probability assignment. To say "I am equally likely to be the CEO as the janitor" is a factual claim about the universe we are building. We haven't built it yet.

  **E:** It's not a factual claim; it's a procedural necessity. If we refuse to assign probabilities, decision theory paralyzes. We can't choose anything. If you reject the equiprobability assumption, you aren't being cautious; you're being irrational. You're refusing to use the only tool we have to navigate uncertainty.

  **S:** I'm refusing to use a tool that breaks under this load. Expected utility works when the losses are compensatable. If I lose a bet on a coin flip, I lose money. I can win it back next time. Here, there is no "next time." This is a one-shot choice for a single life. If I gamble on your average utilitarianism and lose, I don't end up slightly poorer. I end up in a position where my life is not worth living, where my basic liberties are compromised for the greater good. You can't compensate for that after the Veil lifts.

  **E:** Ah, the catastrophe argument. But look at the cost of your caution. Your "Maximin" rule—maximize the minimum position—requires us to structure the entire economy around the worst-off person. Do you realize what that does to the average? You're capping the potential of the top ten percent to provide marginal gains to the bottom one percent. If I turn out to be in the top half, I'm subsidizing a stagnation that hurts everyone, including the poor, in the long run. A richer average society generates more surplus to help the bottom eventually.

  **S:** "Eventually" is the utilitarian's favorite dangerous word. You're asking me to accept the possibility of being a serf in a golden age for the sake of statistical efficiency. And don't pretend your risk profile is neutral. It isn't. You're assuming risk neutrality, or mild aversion. But when the stakes are fundamental rights and social bases of self-respect, extreme risk aversion is the *only* rational stance. Would you bet your freedom on a 99% chance of prosperity if the 1% chance was slavery?

  **E:** I wouldn't bet on slavery, obviously. We're talking about constitutional essentials here, which I agree should be protected. But once basic liberties are secured, we are talking about distributive shares. Income, wealth, opportunities. Here, your risk aversion becomes pathological. You're acting as if the difference between being a mid-level manager and a billionaire is negligible, but the difference between a janitor and a unemployed outcast is infinite.

  **S:** Because it *is* effectively infinite when it comes to the social bases of self-respect. If the system allows inequalities that render the lowest class invisible, or politically powerless, then the "average" is a lie. It's a aggregate mask. You're hiding the variance. As a designer, wouldn't you check the stress fractures before you admire the load capacity?

  **E:** I check the stress fractures, yes. But I don't refuse to build the bridge because there's a non-zero chance a bolt fails. I calculate the probability. And that's where your argument collapses. You claim we can't assign probabilities. But by choosing Maximin, you are implicitly assigning a probability of *one* to the worst-case scenario. You are acting as if you *know* you will be the janitor. That is not caution; that is delusion.

  **S:** No. Maximin isn't about assuming you *will* be the worst-off. It's about refusing to gamble when the downside is unacceptable *regardless* of the probability. When the outcome is irreversible and catastrophic for the agent, you don't look at the odds. You look at the floor. You're asking me to treat my future life as a portfolio to be optimized. I'm telling you it's a status to be secured.

  **E:** But your floor is a cage. By prioritizing the minimum, you disincentivize the innovation that raises the floor for everyone. History shows that rigid equality of outcome suppresses the productivity that funds the safety net. My Average Utilitarianism allows for inequalities *if* they raise the average. Usually, a rising tide lifts all boats. Your Difference Principle only allows inequalities if they directly benefit the worst-off. That's a much stricter constraint. It chokes growth.

  **S:** It chokes *unjust* growth. If an inequality doesn't help the bottom, why is it there? If the CEO needs ten million dollars to incentivize him to work, and that work improves the janitor's lot, fine. Pay him. But if he needs ten million just because he can, and the janitor starves, your "average" goes up, and my expected utility goes up, but the society is morally rotten. And behind this Veil, I can't know if I'm the CEO or the janitor. So I must ensure the janitor's position is one I could accept.

  **E:** "Acceptable" is subjective. You're smuggling in a specific conception of the good life—one that values security over opportunity. Maybe I value risk. Maybe I'd rather live in a society with a higher ceiling and a lower floor, because I plan to climb. By imposing your risk aversion on me, you're violating my autonomy before I even exist. You're deciding my psychological profile for me.

  **S:** I'm not deciding your profile. I'm deciding the *structure*. We are choosing principles, not lifestyles. And the structure must be stable. A society based on average utility is inherently unstable because those at the bottom have no reason to consent to it. They are being sacrificed for the aggregate. A society based on the Difference Principle secures the consent of the least advantaged. It's the only way to ensure social unity. If you build a system where the bottom knows they were gambled away by a probability calculation, why would they uphold the contract?

  **E:** Because the contract gave them the best *ex-ante* odds! That's the point of the Veil. It's fair because it's blind. If we follow the math, we treat everyone impartially. Your method treats everyone impartially only if you assume everyone is a coward. You're building a society for the timid.

  **S:** I'm building a society for the vulnerable. There's a difference. Timidity is a trait; vulnerability is a condition. Everyone is vulnerable to bad luck, to illness, to market shifts. Your system says if your bad luck drags you down, you're a statistical casualty for the greater good. My system says if you fall, the floor catches you, and the only reason anyone is allowed to be above you is if their height somehow strengthens the floor.

  **E:** (Leans forward) But you haven't answered the probability charge. You say we can't assign them. But if we walk out of here without a decision rule, we default to chaos. Expected Utility is a decision rule. Maximin is a refusal to decide. It's a heuristic, not a theory. Harsanyi proved that if you are rational, you maximize expectation. If you don't, you're violating the axioms of rational choice.

  **S:** Harsanyi proved that if you are rational *and* you accept the Principle of Insufficient Reason in a context of radical uncertainty. I reject the application of the principle. This isn't a game of dice. It's the foundation of a life. When the stakes are this high, "rationality" isn't about maximizing the mathematical expectation. It's about ensuring the conditions for rationality itself. If I end up in the bottom of your utilitarian heap, crushed and deprived, I can't even *be* a rational agent anymore. I'm just a resource.

  **E:** So you'd sacrifice the potential of the many to guarantee the dignity of the few?

  **S:** I'd sacrifice the *excess* of the many to guarantee the *standing* of the few. There's a limit to how much utility you can consume. There is no limit to how much dignity you can lose.

  **E:** (Sighs, putting the stylus down) We're at an impasse. You see the floor as the foundation. I see it as a baseline to launch from.

  **S:** And you see the ceiling as a goal. I see it as a lever.

  **E:** The vote is coming up. You know if we pick your principle, we might lock in a society that never reaches its full potential.

  **S:** And you know if we pick yours, we might lock in a society where some people are used as means to an end.

  **E:** (Stands up) I'm voting for the Average. I'll take the risk. I'd rather live in a world that tries to be great than one that's terrified to be small.

  **S:** (Stands as well) And I'm voting for the Difference. I'd rather live in a world where I don't have to fear my own neighbors than one where I have to hope I'm not the sacrifice.

  *(The light begins to fade. The Veil thins. They do not shake hands.)*
