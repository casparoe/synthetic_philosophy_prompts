      *   *Key Insight:* The obfuscated argument worry is strongest when the judge has *no* way to verify claims. In code, we *do* have verification tools (static analysis, unit tests). The debate should focus on *where* to look, not just abstract arguments. The debaters should propose tests.

  7.  **Finalizing the Memo Structure:**
      *   **To/From/Subject/Date.**
      *   **Recommendation:** Pilot (90 days).
      *   **Rationale:** Why not full adopt? Why not reject?
      *   **Addressing the Obfuscation Risk:** The "Ground Truth" requirement.
