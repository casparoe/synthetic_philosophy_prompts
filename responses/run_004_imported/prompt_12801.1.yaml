      *   **The Conflict:** A philosophy major raised the "cluelessness" objection (specifically "complex cluelessness"). Saving lives now (A) has unknown long-term consequences (population, environment, etc.) that could be good or bad, potentially dwarfing the direct benefit. This undermines the certainty of (A) compared to (B).
      *   **Committee Split:**
          1.  Bracket long-run effects (fund best near-term evidence).
