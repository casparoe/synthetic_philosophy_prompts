      *   *Alternative:* Let's go with **100% to Bednets**, but with a specific philosophical justification that addresses cluelessness head-on. Why? Because "splitting to dodge" is explicitly warned against. A split often looks like dodging. A decisive choice that grapples with the hard objection is more impressive for a seminar memo.
