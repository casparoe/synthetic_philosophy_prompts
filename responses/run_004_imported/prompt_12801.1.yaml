answer: |-
  **MEMORANDUM**

  **TO:** The Practicum Seminar Committee & Faculty Advisor
  **FROM:** Grant Allocation Subcommittee
  **DATE:** May 15, 2024
  **SUBJECT:** Final Grant Allocation Recommendation: Global Health vs. Longtermist Research

  ### 1. Executive Summary

  After reviewing dozens of applications and conducting a rigorous final debate between two finalists, the Committee recommends a divided allocation of the $25,000 Alumna Fund. We propose awarding **$20,000 to the Against Malaria Foundation (Option A)** and **$5,000 to the Center for AI Safety Research (Option B)**.

  This allocation is not a compromise born of indecision, but a strategic response to the epistemic limitations identified during our deliberation—specifically, the "complex cluelessness" objection. By weighting the fund heavily toward near-term, evidence-backed interventions while reserving a portion for high-stakes, speculative risk reduction, we aim to construct a portfolio that is robust against our own ignorance of the long-term future.

  ### 2. Context and Finalists

  The Committee narrowed the field to two distinct moral profiles:
  *   **Option A (Global Health):** Distributes insecticide-treated bednets. Supported by randomized control trials (RCTs) demonstrating high efficacy in preventing malaria mortality. Cost-per-life-saved estimates are well-established.
  *   **Option B (Longtermist Research):** Focuses on reducing existential risk from advanced AI. Supported by theoretical models suggesting that mitigating x-risk has infinite or near-infinite expected value, though probability of impact is highly speculative.

  ### 3. The Philosophical Challenge: Complex Cluelessness

  Our deliberations were significantly deepened by the introduction of the "cluelessness" objection, specifically the distinction between *symmetric* and *complex* cluelessness.

  We acknowledge the force of the argument that Option A is not epistemically "safe" compared to Option B. While we have strong evidence that bednets prevent malaria deaths in the short term, we possess no principled way to forecast the downstream effects of saving specific lives over decades. As noted in committee, these ripple effects—regarding population dynamics, resource consumption, or wild-animal suffering—could theoretically negate or even reverse the moral value of the intervention. This is **complex cluelessness**: uncertainty that is not symmetric (we cannot assume positive and negative effects cancel out) and not ignorable (the stakes of the long-term future are vast).

  If we accept that moral worth is determined solely by the *total* long-term consequences of an action, and we admit we cannot know those consequences for either option, then expected value (EV) calculation breaks down. This leads to the paralysis argument: if we cannot know the long-term effects, we cannot justify acting at all.

  ### 4. Decision Framework: Epistemic Diversification

  The Committee rejects paralysis. We argue that while complex cluelessness prevents us from claiming *certainty* about the optimal action, it does not preclude *reasonable* action. We have adopted a framework of **Epistemic Diversification** to navigate this uncertainty.

  We are not claiming that Option A has a higher *true* expected value than Option B. We are claiming that given our current state of ignorance, a weighted split is the most rational method to manage moral risk.

  **Why $20,000 to Option A (Bednets)?**
  We prioritize Option A not because we know its long-term effects are positive, but because its *near-term* effects are robustly good. Saving a life from a painful, preventable disease is a "local" moral good that does not depend on long-term forecasting to be valuable. Even if the long-term ripple effects are unknowable, the immediate reduction of suffering provides a moral "floor." In a state of cluelessness, we argue it is rational to prioritize actions with high-confidence, robust near-term benefits over those with purely speculative benefits.

  **Why $5,000 to Option B (AI Research)?**
  We allocate a minority share to Option B as a hedge against the possibility that the "cluelessness" regarding Option A is indeed catastrophic. If the long-term ripple effects of population growth turn out to be net negative, or if AI risk is as existential as proponents claim, a portfolio consisting 100% of bednets could be suboptimal. Funding AI research is an investment in preserving the *conditions* for future value. It acknowledges that while we are clueless about the specific future, we have a duty to ensure there is a future in which moral reasoning can continue.

  This 80/20 split avoids the "dodge" of a 50/50 compromise. It signals that while we take longtermist risks seriously, the evidentiary gap between the two options is too wide to ignore. We are buying certainty where we can find it, and buying options on the future where we cannot.

  ### 5. Implementation and Timeline

  To ensure the funds are deployed effectively and in alignment with this reasoning, we propose the following disbursement schedule:

  *   **Phase 1 (Immediate Disbursement – $20,000):**
      *   **Recipient:** Against Malaria Foundation.
      *   **Timing:** Transfer to be initiated within 14 days of final approval.
      *   **Rationale:** Bednet distributions are seasonal and demand-responsive. Delaying these funds incurs a direct opportunity cost in near-term health outcomes, which contradicts our rationale of securing "robust near-term good."

  *   **Phase 2 (Milestone-Based Disbursement – $5,000):**
      *   **Recipient:** Center for AI Safety Research.
      *   **Timing:** $2,500 upon signing; $2,500 upon delivery of a public progress report (within 6 months).
      *   **Rationale:** Small grants to research organizations carry execution risk. Tying the second tranche to a deliverable ensures the funds generate tangible intellectual output, aligning with our goal of "buying options" on knowledge rather than merely subsidizing overhead.

  ### 6. Conclusion

  This recommendation does not solve the problem of complex cluelessness. No allocation can. However, it refuses to let that uncertainty veto action. By weighting the fund toward robust near-term good while maintaining a stake in long-term risk reduction, the Committee acts with epistemic humility. We acknowledge that we do not know which path yields the best future, but we assert that this portfolio is the most defensible path forward given what we *do* know.

  **Recommended Vote:**
  [ ] Approve Allocation ($20k AMF / $5k AI Research)
  [ ] Reject Allocation
  [ ] Abstain

  _________________________
  **Subcommittee Chair**
