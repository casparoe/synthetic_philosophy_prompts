      *   *Actually, the strongest philosophical move:* Acknowledge that *both* suffer from cluelessness, but argue that Bednets have **robustly positive near-term value** which acts as a floor, whereas AI research has **highly speculative value**. Even if long-term effects of bednets are unknown, the *certainty* of the near-term good carries moral weight that isn't fully erased by long-term uncertainty.
