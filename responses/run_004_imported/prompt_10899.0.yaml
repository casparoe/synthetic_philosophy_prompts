      *   *AAA Structure:* Accurate (true), Adroit (skillful), Apt (true *because* skillful).
      *   *Gettier:* Sosa argues Gettier cases lack aptness (luck intervenes).
      *   *Fake Barn Country:* This is the hardest case for virtue epistemology. The agent uses competence, hits the truth, but could easily have failed due to the environment. Sosa distinguishes "intervening luck" (Gettier) from "environmental luck" (Fake Barns). He often argues Fake Barn cases yield *animal knowledge* but not *reflective knowledge*, or modifies the competence condition to be sensitive to the environment.
      *   *Animal vs. Reflective Knowledge:* Animal = first-order apt belief. Reflective = apt belief + perspective on why it's apt (defeasibility/coherence).
      *   *Generality Problem:* Reliabilism struggles to define *which* process type counts for reliability (e.g., is it "vision" or "vision in fog at dusk"?). Virtue epistemology needs to define the "competence" similarly.
      *   *Value Problem:* Meno Problem. Why is knowledge more valuable than true belief? Virtue epistemology says: because it credits the agent's agency/excellence.

  3.  **Drafting the Questions (Iterative Process):**

