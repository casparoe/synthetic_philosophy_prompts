      *   *Q6: Skepticism.*
          *   *Focus:* How does this handle radical skepticism compared to contextualism?
          *   *Follow-up:* Does it demand too much of the ordinary knower?

      *   *Q7: Intellectual Virtue vs. Physical Skill.*
          *   *Focus:* Is the archery analogy misleading? Beliefs aren't voluntary actions.
          *   *Follow-up:* How do we handle involuntary beliefs (perception) vs. voluntary inquiry?

      *   *Q8: Social Epistemology.*
          *   *Focus:* Testimony. Can I have apt belief based on *your* competence?
          *   *Follow-up:* Does this lead to an overly individualistic view of knowledge?

      *   *Q9: Normative Force.*
          *   *Focus:* Why *ought* we aim for aptness?
