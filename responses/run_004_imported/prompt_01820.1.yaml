answer: |-
  I need to stop you before you write this chapter, because there is a significant bibliographic error in your premise that could jeopardize your dissertation.

  **David Lewis (the modal realist) did not write a paper titled "Do We Believe in Penal Substitution?"** nor did he publish an account of the atonement using counterpart theory.

  His primary work in the philosophy of religion is collected in *Papers in Ethics and Social Philosophy* (2000), which includes the essay **"Divine Justice."** However, "Divine Justice" focuses on the problem of hell, free will, and retributive justice; it does not deploy counterpart theory to solve the mechanics of penal substitution, and he does not argue *for* the doctrine of atonement himself (Lewis was generally agnostic/atheistic in his philosophical persona, though respectful of religious arguments).

  It is highly likely you are encountering a **secondary application** of Lewis's metaphysics by analytic theologians (such as **Michael Rea**, **Thomas Flint**, or **Joshua Rasmussen**) who have proposed using Lewisian counterpart theory to solve problems of representation and substitution in the atonement. Or, you may be conflating the title with a different author (e.g., Stephen Kershnar or Michael Moore write on penal substitution, but not with Lewis's machinery).

  However, since you need the **mechanics** of how a Lewisian Counterpart Theoretic Atonement works for your dissertation, I can walk you through how that argument is reconstructed in the literature. This is the "Lewis-style" model that theologians propose, even if Lewis didn't write it himself.

  ### The Mechanics of a Lewisian Counterpart Atonement

  The central problem of penal substitution is **moral transfer**: How can Person A (Christ) justly bear the punishment due to Person B (the Sinner)? Strict numerical identity fails (Christ $\neq$ Sinner). A Lewisian approach attempts to bridge this gap using the **counterpart relation** rather than identity.

  Here is the step-by-step mapping scholars use when applying Lewis's machinery to this doctrine:

  #### 1. The Rejection of Transworld Identity
  In Lewis's modal realism, individuals are world-bound. You exist only in the actual world; your "possibilities" are represented by *counterparts* in other worlds, not by you literally being there.
  *   **Theological Adaptation:** Strict identity between Christ and the sinner is impossible. However, a **counterpart relation** ($C$) can hold between them based on qualitative similarity.

  #### 2. Establishing the Counterpart Relation ($C$)
  For penal substitution to work, Christ must be a counterpart of the sinner. In Lewis's standard theory, $x$ is a counterpart of $y$ if $x$ resembles $y$ more closely than any other existing thing in $x$'s world.
  *   **The Mapping:** The theologian argues that in the Incarnation, Christ takes on human nature. This shared nature establishes a maximal qualitative similarity.
  *   **Universal Counterpart:** To substitute for *all* sinners, Christ must be a counterpart to every human sinner. This requires a specific weighting of the counterpart relation where "sharing human nature" or "sharing moral agency" outweighs individual differences (like specific DNA or history).
  *   **The Mechanism:** Christ (in the actual world) stands in the counterpart relation $C$ to Sinner$_1$, Sinner$_2$, ... Sinner$_n$.

  #### 3. Transferring Moral Properties via $C$
  In standard counterpart theory, modal properties transfer (e.g., "I could have been a baker" is true because a counterpart is a baker). For atonement, **moral properties** must transfer.
  *   **The Argument:** If Christ is a counterpart of the Sinner, then properties true of the Sinner can be predicated of Christ *de re* via the counterpart relation.
  *   **Guilt Transfer:** The sinner's guilt is a property $G$. Because $C(\text{Christ}, \text{Sinner})$, Christ can be said to "have" $G$ in a derivative sense sufficient for punishment.
  *   **Punishment Transfer:** Retributive justice requires the punished party to be the guilty party. If the counterpart relation is strong enough to sustain moral representation (similar to how a Head of State represents a citizen), the punishment inflicted on Christ counts as inflicted on the Sinner.

  #### 4. Solving the "Too Many Counterparts" Problem
  A major objection in Lewis's theory is that counterpart relations are vague and context-dependent.
  *   **The Objection:** If similarity makes Christ my counterpart, isn't every other human also my counterpart? Why does Christ's suffering count and not my neighbor's?
  *   **The Theological Fix:** The counterpart relation in this context is not just general similarity but **covenantal representation**. The "context" for the counterpart relation is fixed by Divine Decree. God stipulates that for the purposes of justice, the similarity relation is weighted such that Christ is the *primary* counterpart for all humans regarding moral liability.

  ### Critical Objections You Must Address
  If you use this in your dissertation, you must address why Lewis himself never did this. The philosophical hurdles are significant:

  1.  **Moral Relevance of Similarity:** Lewis's counterpart relation is based on *qualitative similarity*. But moral guilt is not transferable via similarity. (Example: My twin is similar to me, but I cannot go to jail for his crime). You need to explain why *this* counterpart relation carries moral weight.
  2.  **World-Bound Individuals:** If Christ is world-bound, he suffers only in the actual world. How does that affect sinners in the actual world if they are distinct individuals? The counterpart theory usually explains *modality* (possibility), not *actual moral exchange*.
  3.  **Lewis's Own View:** Lewis was a Humean about laws and causation. He would likely reject the idea that a metaphysical relation like "counterparthood" could ground a normative fact like "just punishment."

  ### Recommendation for Your Dissertation
  1.  **Correct the Citation:** Do not attribute this paper to David Lewis. Check if you are thinking of **Michael Rea** (who uses counterpart theory for the Trinity/Incarnation) or perhaps **Stephen Kershnar** (who writes on penal substitution).
  2.  **Frame it as an Application:** Write it as "A Lewisian Model of Atonement" or "Applying Counterpart Theory to Penal Substitution," citing secondary literature that proposes this (e.g., look for work by **Thomas Flint**, **Michael Rea**, or articles in *Faith and Philosophy* regarding "Metaphysics and Atonement").
  3.  **Check "Divine Justice":** If you want to cite Lewis directly, look at "Divine Justice" in *Papers in Ethics and Social Philosophy*, but be aware it discusses hell, not the atonement mechanism.

  **Bottom Line:** The machinery you described is a valid *theoretical construction* using Lewis's metaphysics, but it is not a paper Lewis wrote. Attributing it to him directly will be flagged by your committee as a bibliographic error. Adjust your framing to "Lewisian Counterpart Theory applied to Atonement" rather than "Lewis's Theory of Atonement."
