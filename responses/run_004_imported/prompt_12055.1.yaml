answer: |-
  This is a fantastic catch. It is one of those historical ironies that feels almost designed to mess with our modern intuitions: the guy who codified the "impartial, calculating utilitarian" mindset (Sidgwick) is the same guy spending two decades investigating table-tipping and telepathy.

  But once you sit with it, it makes perfect sense. Sidgwick wasn't looking for magic; he was looking for *consistency*. If utilitarianism requires us to count everyone's happiness equally regardless of who they are, scientific rigor requires us to weigh evidence equally regardless of how much we dislike the conclusion.

  Here is the unpacking of that specific passage, addressing your two sticking points and the "cash value" of his argument.

  ### 1. Is he agreeing with Hume or dismantling him?

  He is **dismantling the *application* of Hume's argument while accepting its *structure*.**

  To see this, you have to look at how Hume defines "experience." For Hume, "uniform experience" against a miracle is a hard barrier. If the laws of nature are established by uniform experience, and a miracle violates those laws, the probability of the miracle is effectively zero. Hume's scale is rigged: the weight of "Nature doesn't break" is infinite, so no amount of testimony can outweigh it.

  Sidgwick attacks the weight on that side of the scale. Look at this move he makes:
  > *"But in saying that a marvel is contrary to experience we can mean no more than that it is unlike previous experience... This only means that it is entirely novel and strange."*

  Sidgwick is re-categorizing "miracles" (or psychical phenomena) from **Violations of Law** to **Novel Data Points.**

  *   **Hume's View:** A miracle is a contradiction. (Logic: $A$ and $\neg A$ cannot both be true).
  *   **Sidgwick's View:** A miracle is an outlier. (Logic: We have 1,000 data points of $X$, here is one data point of $Y$).

  Sidgwick agrees with Hume that novel claims are *improbable*. He writes: *"we must admit that the statement of a fact novel beyond a certain degree of novelty is in itself an improbable statement."*

  But he disagrees that this improbability is **calculable** or **dispositive**. Hume thinks you can use the improbability to dismiss the claim *a priori*. Sidgwick says you cannot, because you don't know the sample space of the universe.

  So, he isn't saying Hume is wrong that weird stuff is unlikely. He is saying Hume is wrong that we can use that unlikelihood to close the investigation before it starts. He is shifting the debate from **Ontology** (what is possible?) to **Epistemology** (what can we know about probabilities?).

  ### 2. Is the "Known vs. Unknown" bit a shrug or an argument?

  Your instinct to reach for a Bayesian framework is spot on, but Sidgwick is pointing out a specific failure mode in Bayesian reasoning when applied to the edges of human knowledge.

  In Bayesian terms, Sidgwick is arguing that the **Prior Probability is structurally inaccessible.**

  To calculate the probability of a new phenomenon (like telepathy), you need to know the total space of possible phenomena. Sidgwick argues:
  > *"to make such an estimate we should require to ascertain the proportion that what we do know about the universe bears to what we do not know about it; and that proportion is certainly one of the things that we do not know."*

  This is not a shrug ("it's hard to know"). It is a logical proof that the number cannot exist.
  *   If you know the total set of possibilities ($N$), and you know the observed set ($n$), you can calculate the probability of a new observation.
  *   But if $N$ is unknown (because the universe might contain forces we haven't discovered), then $n/N$ is undefined.

  **The "Teeth" of the argument:**
  This gives Sidgwick a weapon against dogmatic skepticism. If a skeptic says, "Telepathy is impossible because the probability is 1 in a billion," Sidgwick can reply, "You cannot derive that number. You are pretending to know the boundaries of nature. Since you cannot quantify the prior, you cannot use the prior to veto the evidence."

  It forces the skeptic to engage with the **likelihood of the evidence given the hypothesis** ($P(E|H)$), rather than hiding behind the **prior probability of the hypothesis** ($P(H)$).

  In coder terms: Hume is writing a filter that drops packets from unknown IP addresses. Sidgwick is saying, "We don't have a whitelist of valid IPs for the universe. You have to inspect the packet payload to see if it's valid, you can't just drop it based on the header."

  ### 3. Does this cash out to a real answer?

  You asked: *"Feels like this passage should cash out in a real answer to 'how weird does a claim have to be before I should stop trusting the witnesses,' but I can't tell if he's giving one or just eloquently explaining why nobody can."*

  He is explicitly arguing that **nobody can.** And that *is* the answer.

  Sidgwick's "Canon" here is: **There is no static threshold for novelty.**

  If you try to set a rule like "I will believe any claim supported by 5 credible witnesses, unless the claim is 'magic,' in which case I need 50," Sidgwick says you are being unscientific. You are letting the *content* of the claim dictate the *rigor* of the method.

  For Sidgwick, the rigor of the method must remain constant, even if the claim is wildly novel.
  *   **The Humean approach:** As novelty increases, the burden of proof increases exponentially (eventually to infinity).
  *   **The Sidgwickian approach:** As novelty increases, the *improbability* increases, but since we cannot measure *how much* it increases, we cannot increase the burden of proof mathematically. We can only increase the **quality** of the observation.

  So the practical takeaway for the "how weird is too weird" question is:
  **You never stop trusting the witnesses because of the *claim*. You only stop trusting them because of the *conditions of the testimony*.**

  If a medium claims to move a table with their mind:
  *   **Hume:** Dismiss it. It violates experience.
  *   **Sidgwick:** Do not dismiss it because it's weird. Dismiss it *only* if the witnesses were in the dark, or had a motive to lie, or if the controls were loose. If the witnesses are impeccable and the controls are tight, you must accept the data point, even if it breaks your model of physics. You update the model, not the data.

  ### Why this matters for the Rationalist/EA lineage

  This explains why the Effective Altruists and Rationalists reverence him, even if they ignore the ghost hunting.

  Sidgwick is the patron saint of **Radical Epistemic Humility.**
  The EA movement is built on the idea that our intuitions about charity are wrong (e.g., "local is better" vs. "most impact per dollar"). Sidgwick applied that same logic to reality itself. He suspected our intuition about "what is possible" might be just as parochial as our intuition about "who deserves help."

  He spent 20 years on the SPR not because he was gullible, but because he was terrified of being a dogmatist. He worried that if science built a wall around "acceptable phenomena," it would become a religion.

  **The Summary:**
  1.  **Hume vs. Sidgwick:** Sidgwick accepts that weird claims are unlikely, but rejects Hume's claim that we can quantify that unlikelihood well enough to dismiss them *a priori*.
  2.  **The "Unknown Proportion":** This is an argument that the Prior is undefined, not just unknown. It prevents skeptics from using probability math to block inquiry.
  3.  **The Cash Out:** There is no "weirdness threshold." There is only an "evidence quality threshold." You evaluate the witness, not the claim.

  Sidgwick is basically telling the 19th-century scientific establishment: "You say you follow the evidence. Prove it. Follow the evidence even when it leads somewhere uncomfortable." That is why he remains the intellectual grandfather of the "view from nowhere." He was willing to look where others were afraid to, provided the methodology was clean.
