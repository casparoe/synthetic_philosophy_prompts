prompt: |-
  I'm on the standards committee at the outlet I write for, and we've got an annoying case in front of us. A piece our science desk ran stated flat-out that social media is causing the rise in teen depression, no hedge, leaning on the same correlational and quasi-experimental evidence Haidt uses in The Anxious Generation. A few academics in the Odgers/Orben camp complained that effect sizes are tiny and causation's nowhere near established, so we owe readers a correction. Half the committee thinks we overclaimed; the other half thinks the reporter had plenty of good evidence and that hedging everything with "some scientists believe" is it's own kind of dishonesty, not more honest, just mushier. We meet thursday and I need an actual memo: what to do about this piece, plus a real rule reporters can use for how much evidence is "enough" to assert a contested causal claim outright instead of attributing it. Don't split the difference, and give the anti-hedging camp a fair hearing -- committees like ours usually wave them off too fast.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a standards committee at a media outlet.
      *   **Task:** Write a memo for the Thursday meeting regarding a specific controversy.
      *   **The Controversy:** A science piece claimed "social media is causing the rise in teen depression" (flat-out, no hedge), relying on evidence similar to Jonathan Haidt's *The Anxious Generation*. Academics (Odgers/Orben camp) argue effect sizes are tiny and causation isn't established.
      *   **The Conflict:** Half the committee thinks it was an overclaim (needs correction/retraction). The other half thinks hedging everything is dishonest/mushy and the reporter had enough evidence.
      *   **Constraints:**
          *   Do *not* split the difference (no "meet in the middle" vagueness).
          *   Give the anti-hedging camp a fair hearing (acknowledge the validity of strong claims when warranted).
          *   Provide a concrete decision on the specific piece.
          *   Provide a *real rule* for reporters on when to assert causal claims vs. attribute them.
      *   **Tone:** Professional, decisive, nuanced, actionable, internal memo style.

  2.  **Deconstruct the Scientific Debate (Haidt vs. Odgers/Orben):**
      *   *Haidt's Position:* Social media/smartphones are a primary driver of the mental health crisis (starting around 2012). Evidence includes temporal correlation, cross-national data, and some quasi-experimental work.
      *   *Odgers/Orben Position:* The correlation is weak. Effect sizes are small (often explaining <1% of variance). Other factors (economic anxiety, climate, politics) matter more. Causation is not proven; reverse causality (depressed kids use social media more) is plausible.
      *   *Journalistic Standard:* To say "X causes Y" flat-out usually requires randomized control trials (RCTs) or overwhelming convergent evidence where alternative explanations are ruled out. Correlational data alone rarely meets this bar for *causal* assertions in hard science reporting.

  3.  **Address the "Anti-Hedging" Argument (Fair Hearing):**
      *   Why do they hate hedging? "Some studies suggest" can obscure scientific consensus (e.g., climate change, vaccines).
      *   When is a flat claim okay? When the evidence is robust, replicated, and mechanisms are understood.
      *   The risk of "false balance": Giving equal weight to a fringe view vs. a consensus.
      *   *However*, in this specific case, is there a consensus? No. The field is actively contested. Therefore, the "anti-hedging" principle (speak truth plainly) doesn't actually apply here because the "truth" isn't settled.

  4.  **Formulate the Decision on the Specific Piece:**
      *   *Decision:* The piece needs an Editor's Note/Correction.
      *   *Reasoning:* "Causing" is a specific scientific term. The evidence cited (correlational/quasi-experimental) supports "linked to" or "associated with," not "causing." To say "causing" without acknowledging the significant dissent and methodological limitations violates accuracy standards, not just caution standards.
      *   *Nuance:* This isn't about "mushy hedging"; it's about precision.

  5.  **Develop the Rule for Reporters:**
      *   Need a heuristic that isn't "always hedge" but isn't "trust your gut."
      *   *Idea:* The "Consensus + Mechanism" Test.
      *   *Idea:* The "Counterfactual" Test.
      *   *Selected Approach:* A tiered framework based on *Evidence Type* and *Scientific Consensus*.
      *   *Rule Name:* The Causal Assertion Standard (CAS).
      *   *Criteria:*
          1.  Is there a consensus among relevant experts?
          2.  Is the methodology capable of establishing causality (RCTs, natural experiments with strong IVs)?
          3.  Are alternative explanations adequately ruled out in the literature?
      *   *Verdict:* If any answer is "No," attribute the claim to the researchers, don't assert it as fact.

  6.  **Drafting the Memo (Iterative Process):**
      *   *Header:* Standard memo format.
      *   *Opening:* State the purpose clearly.
      *   *Section 1: The Specific Case.* Address the Haidt piece. Acknowledge the strength of the reporting (it wasn't lazy), but pinpoint the error (causality vs. correlation). Give the anti-hedding camp their due: we don't want mush. But precision isn't mush.
      *   *Section 2: The Guideline.* Create the actionable rule. Make it binary where possible.
      *   *Section 3: Rationale.* Explain *why* this protects credibility without forcing false balance.
      *   *Closing:* Next steps.

  7.  **Refining the Tone:**
      *   Avoid sounding condescending to either camp.
      *   Ensure the "Anti-Hedging" argument is validated (hedging *can* be cowardly) before explaining why it's necessary *here*.
      *   Make sure the recommendation is decisive (Correction needed), not "let's discuss more."

  8.  **Self-Correction/Review against Constraints:**
      *   *Did I split the difference?* No, I'm recommending a correction, which sides with the "overclaim" camp, but I validate the *principle* of the "anti-hedging" camp.
      *   *Did I give the anti-hedging camp a fair hearing?* Yes, by distinguishing between "mushy attribution" and "precision."
      *   *Is there a real rule?* Yes, the "Causal Assertion Standard."
      *   *Is it actionable?* Yes, reporters can use the checklist.

  9.  **Final Polish:** Check for clarity, brevity, and authority. (Ensure the distinction between "association" and "causation" is sharp, as that's the core scientific issue). *Self-correction: Make sure not to dismiss Haidt entirely, but focus on the journalistic standard for the word "causing."*

  10. **Final Output Generation** (Proceed to generate memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2024
  **SUBJECT:** Resolution on Social Media/Teen Depression Coverage & New Causal Assertion Guidelines

  ### Executive Summary

  We have a decision to make regarding the recent science desk piece on teen depression, and a broader policy to enact. My recommendation is decisive: **We must issue an Editor's Note correcting the causal claim.** However, this decision is not a victory for "mushy hedging." It is a commitment to precision.

  Below is the rationale for the correction, a fair assessment of the "anti-hedging" argument, and a new actionable standard for reporters regarding causal claims.

  ---

  ### Part 1: Ruling on the Specific Piece

  **Decision:** Publish an Editor's Note clarifying that the relationship described is correlational and contested, not definitively causal.

  **Rationale:**
  The reporter wrote: *"Social media is causing the rise in teen depression."*
  In scientific reporting, "causing" is a technical term. It implies that if you remove variable A (social media), variable B (depression) decreases, holding other factors constant.

  The evidence cited (Haidt et al.) relies heavily on temporal correlations and cross-sectional data. While compelling, this methodology cannot rule out reverse causality (depressed teens seek out social media) or confounding variables (economic instability, climate anxiety, pandemic effects). The Odgers/Orben critique is not a fringe objection; it represents a significant portion of the developmental psychology community.

  **To the Anti-Hedging Camp:**
  I want to address the half of this committee worried that we are sliding into "both-sidesism" or cowardly vagueness. You are right that "some scientists say" can be a dishonest shield. When the evidence is overwhelming (e.g., vaccines do not cause autism; CO2 drives warming), hedging is indeed a failure of journalism. It creates false uncertainty where there is consensus.

  However, **precision is not hedging.**
  *   **Hedging:** "Experts are divided on whether gravity makes things fall." (Dishonest)
  *   **Precision:** "The data suggests a strong link, though the specific mechanism is still being mapped." (Accurate)

  In this specific case, there is no consensus. The effect sizes are debated. The mechanisms are theoretical. To assert causality as fact is not "strong journalism"; it is scientifically inaccurate. We can respect the reporter's narrative drive without validating a claim the science hasn't yet earned.

  ---

  ### Part 2: The New Standard for Causal Claims

  We need a rule that prevents this debate from happening every time. We cannot tell reporters to "use their judgment," because judgment varies. We need a checklist.

  **Policy: The Causal Assertion Standard (CAS)**

  Reporters may assert a causal relationship as fact (e.g., "X causes Y") **only if** the following three criteria are met. If *any* criterion is unmet, the claim must be attributed to the researchers or framed as an association.

  **1. The Methodology Test**
  *   **Pass:** The claim is supported by Randomized Control Trials (RCTs), natural experiments with strong instrumental variables, or longitudinal data that rigorously controls for baseline conditions and confounders.
  *   **Fail:** The claim relies primarily on cross-sectional surveys, self-reported usage data, or simple temporal correlations.

  **2. The Consensus Test**
  *   **Pass:** Systematic reviews or meta-analyses indicate a consensus among relevant subject-matter experts that the causal link is established.
  *   **Fail:** Significant, credentialed dissent exists in peer-reviewed literature regarding the magnitude or existence of the effect (e.g., the Odgers/Orben vs. Haidt debate).

  **3. The Alternative Explanation Test**
  *   **Pass:** The literature has largely ruled out reverse causality and major confounding variables.
  *   **Fail:** Plausible alternative explanations (e.g., "depression drives usage" rather than "usage drives depression") remain active areas of research.

  **Application to the Current Piece:**
  *   **Methodology:** Fail (Mostly correlational/quasi-experimental).
  *   **Consensus:** Fail (Active, high-profile debate).
  *   **Alternatives:** Fail (Reverse causality remains a primary counter-argument).
  *   **Verdict:** The claim must be attributed, not asserted.

  ---

  ### Part 3: Implementation & Philosophy

  This rule protects the "anti-hedging" camp just as much as the caution camp.

  1.  **It prevents false balance:** If a reporter comes in with RCTs and consensus (e.g., "Smoking causes cancer"), this rule *forbids* them from hedging. They must assert the fact. We do not want "Some studies suggest smoking is bad."
  2.  **It prevents overreach:** It stops reporters from turning "intriguing preliminary data" into "public health fact."
  3.  **It shifts the burden:** The burden of proof is on the assertion. If you want to write "X causes Y," you must be able to check the three boxes above. If you cannot, you write "Researchers argue X contributes to Y."

  ### Next Steps

  1.  **Correction:** I will draft the Editor's Note for the social media piece by Wednesday EOD. It will acknowledge the strength of the reporting while clarifying the scientific limitation regarding causality.
  2.  **Guideline Distribution:** The CAS checklist will be added to the Style Guide under "Science & Health Reporting" effective immediately.
  3.  **Training:** We will hold a 30-minute briefing for the science desk next week to walk through examples where CAS permits flat assertions (climate attribution, vaccine efficacy) vs. where it requires attribution (nutrition science, behavioral tech).

  We owe our readers clarity, not certainty where none exists. This approach gives us both.

  **Recommendation:** Vote to adopt the Causal Assertion Standard and approve the Editor's Note.
