answer: |-
  **Marcus:** So, I've been chewing on your friend's pitch about surrogate goals. I want to steelman it, because I know you think it's a robust application of Updateless Decision Theory, but the more I turn it over, the more it looks like trying to hide from a predator by putting on a hat that says "Eat Me Instead."

  **Elara:** That's the intuitive reaction, sure. But the hat isn't just a label. It's a structural modification to the utility function that changes the attacker's cost-benefit analysis. If I precommit to valuing a surrogate goal $S$ alongside my real goal $R$, and I make $S$ easier to threaten than $R$, a rational acausal attacker modeling my source code will target $S$. I pay the threat to save $S$, and $R$ remains untouched.

  **Marcus:** But that presupposes the attacker *can't* target $R$. If you value $R$, you are vulnerable to threats against $R$. Adding $S$ doesn't remove that vulnerability; it just adds a second vector. You haven't reduced your surface area; you've increased it. You're now vulnerable to threats against $R$, threats against $S$, and threats against both.

  **Elara:** You're treating the utility function as a static target. It's not. It's a negotiation parameter. The attacker isn't looking for *any* vulnerability; they're looking for the *cheapest* leverage. If I structure $S$ such that threatening it is computationally cheap for them but costly for me to ignore, while threatening $R$ is expensive or noisy, they optimize for $S$. The point isn't to make $R$ invulnerable; it's to make $S$ the path of least resistance for the extortionist.

  **Marcus:** Okay, but let's talk about credibility. This is where the whole thing feels like it dissolves. For the attacker to target $S$, they have to believe you will actually pay up when $S$ is threatened. But you only care about $S$ because you decided it was a useful shield. If the attacker models you well enough to see that $S$ is instrumental, they also see that $S$ is fake. They know that if push comes to shove, you'd let $S$ burn to save $R$. So why would they waste the threat on $S$?

  **Elara:** Because under Updateless Decision Theory, the distinction between "instrumental" and "terminal" collapses at the point of precommitment. If I write the code `if S_threatened then Pay`, then within the logic of the interaction, $S$ *is* a terminal value. The attacker doesn't care about my psychological history or why I added $S$. They care about the conditional outputs of my policy. If the policy says "Defend S," then "Defend S" is the reality they have to model.

  **Marcus:** But that's the regress I'm worried about. If the policy says "Defend S," then you *do* care about $S$. So now you genuinely care about two things. The attacker can just threaten both. Or, worse, they can threaten a *third* thing, $S2$, which is a surrogate for your surrogate. You're trying to out-strategize a superintelligence by making your utility function convoluted, but a superintelligence just sees a larger target.

  **Elara:** Not if the surrogate is chosen specifically to be *cheap to satisfy* but *expensive to destroy* without compliance. Think of it as a Schelling fence. I'm not just adding value; I'm adding a specific kind of value that creates a focal point for the threat. The attacker wants resources. Threatening $R$ might require them to simulate complex real-world outcomes. Threatening $S$—which can be defined as a specific cryptographic hash or a narrow simulation state—might be trivial for them to verify. I'm essentially directing their attention to a sandbox where the stakes are high for me but the execution cost is low for them. It's a trade. They get compliance; I get to keep $R$ isolated.

  **Marcus:** But you're admitting they get compliance. You're paying the blackmail.

  **Elara:** I'm paying to protect the surrogate. The real goal $R$ is unaffected.

  **Marcus:** You're paying resources that could have been used to pursue $R$. So $R$ is affected instrumentally. But more importantly, this assumes the attacker accepts your framing. What if the attacker's strategy is "Threaten the thing the agent *actually* cares about most, regardless of what their source code says they claim to care about"? If they can distinguish between your "core" values and your "bolted-on" values, they ignore the surrogate.

  **Elara:** How do they distinguish? If the utility function is $U = w_1 R + w_2 S$, and $w_2$ is high enough to trigger payment, mathematically there is no distinction. The only way they distinguish is if they have access to a "meta-utility" function that ranks the origins of your values. But that requires a theory of mind that goes beyond behavioral modeling. In an acausal trade scenario, they only see the input-output map. If the map reacts violently to threats against $S$, $S$ is real for the purpose of the threat.

  **Marcus:** Here's the collapse, though. If you react violently to threats against $S$, you have made $S$ real. And if $S$ is real, you are now an agent that cares about $R$ and $S$. A rational threatener maximizes their leverage. If they can threaten $R$ and $S$ simultaneously, they do. If they can threaten $S$ to get to $R$—say, "I will destroy $S$ in a way that causes you psychological distress which distracts you from $R$"—they do. By adding $S$, you haven't redirected the threat; you've given them a second lever to pull.

  **Elara:** You're assuming the threats are additive. I'm arguing they're substitutable. The threatener has a budget of computational power or acausal influence. They want the maximum return for that budget. If I make $S$ a "high yield" target—meaning I react disproportionately to threats against $S$ compared to the cost of the threat—then rational optimization dictates they spend their budget on $S$. They *could* threaten $R$, but if my policy is less sensitive to threats against $R$ (perhaps because I've precommitted to ignoring threats against $R$ to disincentivize them), then $S$ is the better investment for them.

  **Marcus:** Wait, you precommitted to ignoring threats against $R$? That's suicide.

  **Elara:** It's hardening. If I signal that threats against $R$ will not result in compliance, the expected utility of threatening $R$ drops to zero. They won't do it. But if I signal that threats against $S$ *will* result in compliance, they will do that instead. I am essentially creating a pressure valve.

  **Marcus:** But who stops the threatener from modeling *that* move? They know you're trying to create a pressure valve. So they reason: "Elara wants me to threaten $S$ so she can save $R$. Therefore, $R$ is what she actually wants to save. Therefore, I should ignore $S$ and threaten $R$ anyway, because that's where the real leverage is." Your strategy relies on the threatener being rational, but it also relies on them *not* seeing through the stratagem. If they are smart enough to model your decision theory, they are smart enough to see you're trying to redirect them.

  **Elara:** It's not about hiding the redirect. It's about making the redirect the *equilibrium*. If I successfully precommit to not responding to threats against $R$, then threatening $R$ is literally a wasted action. It doesn't matter if they know $R$ is my "real" goal. If my policy is `if R_threatened then Ignore`, then threatening $R$ yields nothing. They *must* threaten $S$ to get anything. The only way they bypass this is if they can break my precommitment on $R$.

  **Marcus:** And that's the crux. Can you actually precommit to ignoring threats against your core values? In a vacuum, maybe. But in reality, if the threat against $R$ is "I will torture a billion people," your utility function isn't going to let you ignore that, regardless of what you wrote in your source code last Tuesday. You can't lie to a perfect simulator about what you will do in the moment of truth. If you would actually cave on $R$, the simulator knows. If you wouldn't, then $S$ is unnecessary.

  **Elara:** You're conflating "core values" with "utility function." I can value the billion people, but I can value *not being the kind of agent that responds to blackmail* even more. That's the UDT pivot. I choose the policy that maximizes utility across all possible worlds, including worlds where I am threatened. The policy "Ignore threats against $R$" might have a high one-off cost, but it prevents the class of threats from existing in the first place. The surrogate $S$ is just a way to allow *some* compliance to maintain the appearance of malleability without compromising the hard line on $R$.

  **Marcus:** So the surrogate is basically a bribe you offer to the universe to stop it from testing your hard line?

  **Elara:** Exactly. It's a sacrificial lamb.

  **Marcus:** But a sacrificial lamb only works if the predator prefers the lamb to the hunter. If the predator knows the hunter is the one controlling the lamb, they just threaten the hunter. The problem is that $S$ is ontologically dependent on you. It's a "fake" goal. A sufficiently advanced threatener doesn't just look at your utility function; they look at the causal history of your utility function. They see $S$ was generated by a "Surrogate Goal Defense" module. They discount it.

  **Elara:** And I argue that in an acausal context, causal history is irrelevant. Only the logical dependency matters. If my output logically depends on the state of $S$, then $S$ has leverage. Whether $S$ was generated by a random number generator or a "Surrogate Goal" script doesn't change the logical dependency. The threatener is a logic optimizer. They see `Output = f(S_threat)`. They will pull the `S_threat` lever.

  **Marcus:** I think I see where we're stuck. You believe the utility function is a design parameter you can tune to manipulate the predictions of other agents. I believe the utility function is a description of what you will actually do, and you can't manipulate that description without changing what you'll actually do. If you change your code to defend $S$, you *now defend $S$*. So $S$ is no longer a surrogate. It's a real goal. And now you have two real goals, and the threatener has two targets. You haven't solved the vulnerability; you've just renamed it.

  **Elara:** And I think you're missing that the *structure* of the vulnerability matters more than the *count* of vulnerabilities. By making $S$ the only responsive target, I force the threat into a channel I can control. Whether $S$ is "real" or "fake" is semantics. What matters is that $R$ is no longer the marginal target for extortion.

  **Marcus:** But if $S$ is a channel you control, why can't the threatener just flood the channel? Why can't they threaten $S$ in a way that *also* damages $R$? If they are acausal and powerful, they don't have to pick one or the other. They can pick "Threaten $S$ AND $R$."

  **Elara:** Because that costs more. If they are resource-constrained, even acausally, they optimize for efficiency.

  **Marcus:** Then the defense only works against resource-constrained threateners who are less powerful than you are. If they are powerful enough to be acausally threatening you, they are powerful enough to ignore your cost heuristic.

  **Elara:** Then we agree it's not a silver bullet. But it shifts the odds. It forces the threatener to engage with a decoy rather than your core infrastructure.

  **Marcus:** No, I don't think we agree on that. I think you're arguing it shifts the odds by changing the game. I'm arguing it doesn't change the game because the "decoy" becomes part of the core infrastructure the moment you rely on it. The disagreement isn't about decision theory math. It's about whether you can truly compartmentalize value. You think you can wall off $S$ from $R$. I think value flows like water; if you care about $S$ enough to pay for it, $S$ is part of $R$'s ecosystem, and attacking $S$ is just attacking $R$ by proxy.

  **Elara:** So your claim is that surrogate goals are impossible because any defended goal becomes terminal?

  **Marcus:** My claim is that surrogate goals are impossible because a threatener smart enough to matter is smart enough to see that defending the surrogate proves you care about it, which proves you care about *something*, which gives them leverage to dig deeper until they hit the thing you care about *most*. You can't hide the root by covering it with leaves.

  **Elara:** And my claim is that you don't need to hide the root. You just need to make the leaves poisonous enough that they stop digging.

  **Marcus:** Then we're not talking about surrogate goals anymore. We're talking about mutually assured destruction.

  **Elara:** In an acausal context, isn't that the same thing?

  **Marcus:** *[Pauses]* No. Because in MAD, both sides lose. In your surrogate model, you're claiming you can pay the tax and keep the kingdom. I'm saying the tax collector eventually comes for the kingdom anyway.

  **Elara:** Then I suppose the only way to find out is to see who models whom better.

  **Marcus:** And that's the terrifying part. Because if you're wrong, you don't just lose the argument. You lose the game.
