      *   **Lewis's Result:** If you treat "If $A$ then $B$" ($A \to B$) as a proposition with a truth value (True/False) that fits into standard probability theory, and you insist on The Equation, then probabilities can only take values 0 or 1 (or very restricted values). This makes probability useless for uncertainty.
