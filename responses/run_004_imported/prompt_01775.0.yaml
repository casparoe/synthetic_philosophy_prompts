          *   *Counter:* The 1-intensions are *different*. 1-intension(Water) $\neq$ 1-intension(H2O). One picks out by superficial properties, the other by microstructure.
          *   The identity holds only because the *actual world* makes the extension of the 1-intension of "water" coincide with the extension of the 1-intension of "H2O".
          *   Knowing the *functions* (intensions) doesn't tell you the *output* (extension) in the actual world without empirical input.
      *   *Step 4: The Diagonal Proposition.* This is technical but important. The "necessary a posteriori" status comes from the fact that the *diagonal* (truth value across worlds considered as actual) is contingent, but the *horizontal* (truth value across counterfactual worlds given actual) is necessary. We need experience to locate us on the diagonal.
      *   *Step 5: Why it vindicates Kripke.* It explains the *intuition of contingency*. Kripke said we confuse epistemic possibility with metaphysical possibility. 2D semantics formalizes this. It saves the necessary a posteriori by showing there are two kinds of modality at play.
      *   *Conclusion:* Summarize for the EE context.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does Chalmers think "Water = H2O" is necessary a posteriori?* Yes, in the metaphysical sense (2D). But Chalmers sometimes argues that there is a *deep* sense in which all necessities are a priori (if you include indexical information). I need to be careful not to conflate Chalmers's rationalism with Kripke's anti-descriptivism.
      *   *Correction:* Chalmers uses 2D semantics to *accommodate* Kripke, not necessarily to agree with him on everything. Chalmers argues that the *primary intension* is contingent. So "Water = H2O" is contingent as a primary intension (epistemically) but necessary as a secondary intension (metaphysically).
      *   *The User's specific worry:* "Comparing primary intensions should let us establish a priori whether the terms pick out the same thing."
      *   *Answer:* No. Primary intensions are functions from worlds to extensions. To know if they pick out the same thing, you need to know *which world is actual*. You can't know that a priori. You know the *conditions* under which they refer (a priori), but not whether those conditions are met by the same stuff (a posteriori).
      *   *Analogy:* "The Morning Star = The Evening Star." 1-intension: "Bright star in morning" vs "Bright star in evening." You can understand these concepts a priori. But you need to look at the sky (empirical) to see if they are the same object. 2D semantics treats "Water" and "H2O" similarly regarding primary intensions.

