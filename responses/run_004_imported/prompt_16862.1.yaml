answer: |-
  **The Frankfurt Compliance Audit**

  **Characters:**
  *   **Jones:** A moral agent who just committed a minor crime.
  *   **Black:** A Frankfurt-style intervener (holding a clipboard).

  **Setting:** An interrogation room. Jones is handcuffed. Black is checking a box on a form.

  **Black:** Okay, Mr. Jones. Let's review the incident. You stole the car. Correct?

  **Jones:** Yes.

  **Black:** Did you want to steal the car?

  **Jones:** Yes.

  **Black:** Did anyone force you to want to steal the car?

  **Jones:** No. I just... wanted to.

  **Black:** Excellent. Now, you're aware that at the time of the decision, I was monitoring your neural activity with a device prepared to intervene if you showed any *prior sign* of deciding *not* to steal the car?

  **Jones:** I know. If my brain waved a little to the left, you would have zapped me and made me steal it anyway.

  **Black:** Precisely. So, in no possible world accessible to you at that moment could you have *not* stolen the car.

  **Jones:** Exactly! So, by the Principle of Alternate Possibilities, I am not morally responsible. I couldn't have done otherwise. Case dismissed.

  **Black:** *(Chuckles and ticks a box)* Ah, see, that's the old model. We're running Frankfurt 2.0 now. In this version, because the device remained *idle* during the actual sequence, the source of the action is still you. The lack of alternatives is just... background noise.

  **Jones:** So I'm responsible even though I was locked into this outcome?

  **Black:** Fully. You acted on your own desires. The fact that we would have overridden you if you didn't is counterfactual. It didn't happen.

  **Jones:** But the *presence* of the device is what removed my freedom!

  **Black:** Mr. Jones, please. We prefer to call it "Alternative Possibility Streamlining." Look, here's the invoice for the theft.

  **Jones:** I'm not paying this! I had no choice!

  **Black:** *(Sighs, reaches for a remote)* Do I need to initiate the counterfactual sequence to get you to sign the payment authorization?

  **Jones:** You said you wouldn't intervene if I did what you wanted!

  **Black:** And you *are* doing what I want. You're signing the form. The intervention only triggers if you *don't*. So if you sign, I don't intervene, and you remain morally responsible for the payment in the actual sequence.

  **Jones:** That's coercion!

  **Black:** No, coercion implies I *made* you sign. If you sign, I *didn't* make you. The threat is merely a guarantee of the outcome, not the cause of the action. It's basic compatibilist accounting.

  **Jones:** *(Pauses, looks at the remote, looks at the form)* ...This feels fishy.

  **Black:** Of course it does. It's philosophy. Now, about that prior sign we detected... you hesitated for 0.3 seconds before reaching for the pen. We're going to need to bill you for the monitoring time during that flicker of freedom.

  **Jones:** I can't win, can I?

  **Black:** You can't do otherwise, so "winning" isn't really in your possibility space. Just sign.
