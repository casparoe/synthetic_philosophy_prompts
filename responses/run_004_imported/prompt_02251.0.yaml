      *   *Nuance on "Knowing":* If I prove a question is undecidable, do I "know" the answer? I know the status of the question. Hilbert might accept that as "Wir werden wissen" (We will know the status).
      *   *But:* He specifically wanted a *decision procedure*. Undecidability kills the decision procedure.
      *   *Best Guess:* He would be disappointed but not defeated. He would pivot to finding stronger axioms. He would reject the idea that math is inherently vague (Multiverse).

  8.  **Final Polish:** Ensure the tone is conversational but academically rigorous (suitable for IB TOK). Structure it clearly: 1. The Slogan vs. Reality, 2. The Formalist "Out", 3. New Axioms vs. Multiverse, 4. TOK Implication. (This matches the user's specific questions).

  9.  *(Final check against user prompt)*: Did I recap history? No. Did I answer what Hilbert would think? Yes. Did I address the axioms vs. multiverse? Yes. Did I connect to certainty? Yes.

