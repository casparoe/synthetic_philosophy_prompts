      *   *The "Missing" Piece:* Common Knowledge of Posteriors. They told each other numbers, but did they *update* on the numbers? Aumann requires that you treat the other person's mind as a black box that processes info. If Marcus thinks Elena is irrational, he doesn't have to update on her number. If Elena thinks Marcus has different priors, she doesn't have to update.
