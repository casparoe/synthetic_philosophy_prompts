      *   *Actually, looking at the "Natural Differences" part:* Locke *does* emphasize nurture over nature heavily. The student's claim that "every difference... has to come from differences in upbringing" is a strong empiricist reading. It's not *entirely* wrong, but Locke does advise tailoring to the child's existing temper. I'll dock a point there.
      *   *The "Dark" Example:* This is the killer. The student says Locke uses it to prove fears are *built-in*. Locke uses it to prove fears are *acquired*. This undermines the "blank slate" argument the student is trying to critique/defend.
