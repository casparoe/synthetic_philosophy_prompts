answer: |-
  The heat in the courtyard was thick enough to chew. Cicadas screamed in the cypress trees, a sound like tearing silk. In the center of the yard, Zhuang Zhou sat on his heels, a wooden tub overturned before him. He was beating a rhythm on the lacquered bottom with a pair of chopsticks, humming a tune that had no beginning and no end.

  Hui Shi stood at the gate. He was dressed in the stiff, dark robes of a mourner, a bundle of hemp cloth under his arm. He looked at the body laid out on the straw mat inside the open shed, then at his friend drumming on a basin like a peasant at a harvest festival.

  Hui Shi dropped the hemp cloth. It landed in the dust with a dull thud.

  "Zhou," Hui Shi said. His voice was low, tight.

  Zhuangzi didn't stop drumming. He finished the measure, let the vibration die out, and looked up. His eyes were clear, unred. "Shi. You're loud. You startled the dust."

  "I am loud?" Hui Shi stepped into the yard, his sandals kicking up the dry earth. "I come to offer condolences for your wife. I find you making music over her corpse. Have you lost your mind, or just your shame?"

  "Sit," Zhuangzi said, gesturing to the straw. "There is wine. It's warm, but it's wet."

  "I will not sit." Hui Shi's hands were clenched. "Explain this. Is this a joke? Is this some performance for the neighbors? Because if it is, it's in poor taste. If it isn't... then you are a monster."

  Zhuangzi set the chopsticks down. He sighed, not a sigh of sorrow, but of someone who has to explain why water is wet. "When she first died, Shi, I was like you. I howled. I beat my chest. I felt the hole in the world where she used to be."

  "Good," Hui Shi snapped. "Then stop pretending it isn't there."

  "But then I looked back," Zhuangzi continued, ignoring the interruption. "Before she was born. Before she had a body. Before she even had *qi*. She was a blur in the mist. Then the mist condensed. Then she had breath. Then form. Then life. Now she has changed again. It is like spring, summer, autumn, winter. She is sleeping in the great room of heaven and earth. If I were to follow her crying and wailing, I would be showing that I understand nothing of fate. So I stopped."

  Hui Shi stared at him. The cicadas screamed.

  "That's it?" Hui Shi asked.

  "That is the Dao."

  "No," Hui Shi said, stepping closer. "That is physics. That is meteorology. You are describing the weather of existence. You have explained *how* she died. You have not explained *why* I should not cry."

  "Crying implies she is lost," Zhuangzi said. "She is not lost. She is transformed."

  "Transformation is irrelevant to attachment!" Hui Shi's voice rose, sharp as a blade. "Listen to yourself. You are committing a category error. Just because a process is natural does not mean it is neutral. Rain is natural. It is the cycle of water. But if I stand in it, I get wet. I get cold. I seek shelter. Do I deny the rain? No. Do I deny the cold? No."

  Hui Shi pointed at the corpse. "You loved her. I have seen you with her. You shared food, you shared silence, you shared the burden of poverty. That love created a bond. To sever that bond with a song is not wisdom, Zhou. It is a lie. You are pretending to be the Dao when you are merely a man."

  Zhuangzi picked up a gourd of wine and took a long pull. "If I cry, I am privileging my own comfort over her peace. I am saying, 'I want you here because *I* miss you.' That is selfishness dressed up as virtue."

  "It is not selfishness! It is humanity!" Hui Shi paced the small yard, his robes swishing. "Ritual exists for the living, not the dead. We mourn not to change the outcome, but to honor the cost. To grieve is to acknowledge that something of value has been expended. If you treat her death like a leaf falling from a tree, you are saying her life was just... vegetation. Was she a leaf, Zhou? Or was she a person?"

  "She was both," Zhuangzi said softly. "And now she is neither."

  "You are hiding behind metaphysics to avoid pain." Hui Shi stopped pacing. He looked Zhuangzi dead in the eye. "I know you. You are not a stone. You felt the pain. And you decided the pain was inconvenient to your philosophy, so you reasoned it away. You told yourself a story about *qi* so you wouldn't have to feel the hole in your chest. That isn't enlightenment. That's dissociation."

  Zhuangzi's expression didn't harden, but the lightness in his eyes dimmed slightly. He tapped the rim of the tub. "You think I reasoned it away? Shi, do you remember the Hao River?"

  Hui Shi blinked. "The fish? Of course. You claimed to know the joy of fish."

  "I did."

  "And I told you that you are not a fish, so you cannot know the joy of fish."

  "Yes." Zhuangzi leaned forward. "You said I cannot know the fish because I am not the fish. By your logic, how can I know the grief of Zhuang Zhou? You are not Zhuang Zhou."

  "Don't twist my words," Hui Shi warned. "I know you are a man. Men love. Men lose. Men grieve. It is the definition of the thing. If you claim to be exempt from the definition, you are claiming to be something other than human."

  "Perhaps I am," Zhuangzi said. "Or perhaps the definition is too small."

  "It is the only definition we have!" Hui Shi slammed his hand against a wooden pillar. "If we discard the boundaries between life and death, joy and sorrow, self and other, then language collapses. Meaning collapses. If death is just 'seasons,' then murder is just 'gardening.' If grief is 'ignorance,' then love is 'delusion.' Where does it stop, Zhou? You want to float free of the world, but you live in it. You eat grain. You wear clothes. You bury your dead."

  "I buried her," Zhuangzi said. "I prepared the body. I swept the floor. I am not denying the event. I am denying the interpretation of the event as a tragedy."

  "It *is* a tragedy!" Hui Shi shouted. The sound startled a crow from the eaves. "It is the ultimate tragedy! It is the end of the conversation! How can it not be tragic? You talk of 'fate' as if it is a benevolent guide. Fate is a butcher. It takes what we love. To smile at the butcher is not courage. It is madness."

  Zhuangzi was quiet for a long moment. He looked at the tub, then at the sky. "Shi. When you cut down a tree to make a lute, is the tree tragic?"

  "The tree is a tree. The lute is for men."

  "When the lute breaks, do you mourn the wood?"

  "I mourn the music," Hui Shi said instantly. "The wood returns to the earth. The music is gone forever. That is what is lost. Not the *qi*. Not the form. The *pattern*. The specific song that was my wife. Her laugh. Her way of pouring tea. That pattern is broken. Your 'transformation' theory saves the energy, Zhou, but it deletes the song. You are conserving the notes but burning the sheet music."

  Zhuangzi nodded slowly. "The song is gone."

  "Yes."

  "And if I cry, the song returns?"

  "No."

  "Then my crying is for me."

  "It is for *us*!" Hui Shi gestured to the empty courtyard. "It is for the community of the living who need to know that loss matters! If you do not mark the loss, you devalue the life. If death is just a season, then life is just waiting. Why be good? Why be kind? Why love, if the end is just a drum solo on a basin?"

  Zhuangzi stood up. He was taller than Hui Shi, but he slumped slightly, the weight of the day finally showing in his shoulders. He walked over to the straw mat where his wife lay. He did not look down at her face, but he placed a hand on the air above her, not touching.

  "You say I devalue the life," Zhuangzi said, his back to Hui Shi. "I say I am refusing to imprison her in my memory. Grief is a cage, Shi. We build it out of our own need. We say, 'You must remain here, in my pain, because I cannot let go.' To sing is to open the cage. To say, 'Go. Be the mist again. Be the winter. Do not stay here because I am heavy.'"

  "That is poetic," Hui Shi said, his voice cooling, becoming analytical again. "But it is solipsistic. You are deciding for her what she needs. You are projecting your desire for detachment onto her spirit. You claim to follow Nature, but this is the ultimate artificiality. You are forcing yourself to be unnatural. Humans grieve. It is our nature. To suppress it is to violate the very Dao you claim to serve."

  Zhuangzi turned around. He looked tired. "Maybe. Or maybe 'human nature' is just a habit we haven't broken yet."

  "You can't break it," Hui Shi said. "You can only break yourself against it."

  Hui Shi walked over to the bundle of hemp cloth he had dropped. He picked it up and shook off the dust. He walked to the mat and laid the cloth over his friend's wife. He performed the bow. Three times. Precise. Ritualistic.

  He straightened up and looked at Zhuangzi.

  "I will not stop you from singing," Hui Shi said. "It is your house. Your death. But do not tell me it is because you understand fate. Do not tell me it is because you are wise."

  "Then why do I do it?"

  "Because you are afraid," Hui Shi said. "You are afraid that if you start crying, you will never stop. You are afraid that the hole is deeper than your philosophy can bridge. So you drum. You drum to drown out the silence."

  Zhuangzi looked at his hands. They were calloused, stained with ink and dirt. He looked at the chopsticks resting on the tub.

  "Perhaps," Zhuangzi said.

  Hui Shi waited. He wanted a retort. He wanted the butterfly, the fish, the dream.

  "Perhaps," Zhuangzi repeated. "Or perhaps I cry on the inside, where the seasons cannot reach, and sing on the outside so the neighbors know I am still alive."

  Hui Shi studied his friend's face. He saw the tightness around the eyes that hadn't been there before. He saw the slight tremor in the hand that held the wine gourd. He realized, with a sudden pang of sorrow for the man standing before him, that Zhuangzi was not a stone. He was a man holding up a collapsing roof with his back.

  Hui Shi's shoulders dropped. The anger drained out, leaving only exhaustion.

  "The wine," Hui Shi said. "Is it really warm?"

  "It is," Zhuangzi said.

  "Give it here."

  Zhuangzi tossed the gourd. Hui Shi caught it, took a long swallow, and wiped his mouth.

  "It tastes like vinegar," Hui Shi said.

  "Everything tastes like vinegar eventually," Zhuangzi said. He sat back down on his heels. He picked up the chopsticks. "Will you listen?"

  Hui Shi looked at the corpse, then at the drum, then at his friend. He knew the logic was flawed. He knew the ethics were questionable. He knew that Zhuangzi was dancing on the edge of an abyss and calling it a floor.

  But he also knew that the abyss was real.

  "No," Hui Shi said. "I will not listen. The music is off-key."

  Hui Shi turned and walked toward the gate. He stopped at the threshold, his back to Zhuangzi.

  "But," Hui Shi said, without turning around. "If you stop drumming... the silence will be too loud. So play. Play badly. Play loudly. But do not tell me it is the Dao. Call it what it is."

  "What is it?" Zhuangzi asked.

  Hui Shi stepped out into the blinding sun. "It is a eulogy for a man who is still alive."

  He left the gate open.

  Zhuangzi sat alone in the heat. He looked at the tub. He looked at the open gate where the dust motes danced in the light, swirling, rising, falling, indistinguishable from one another.

  He raised the chopsticks. He struck the wood. It made a hollow, cracking sound. Not a note. Just a sound.

  "Fair enough," Zhuangzi whispered to the empty room.

  He began to sing again. But this time, his voice cracked on the first note, and he did not try to fix it.
