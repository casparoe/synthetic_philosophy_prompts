answer: |-
  Consider a "Civic Logic" system tasked with approving the planting of a single maple tree on a city block. Let us assume the narrow frame problem is entirely solved: the system uses a sophisticated non-monotonic logic that effortlessly tracks physical fluents. It knows that planting the tree changes the soil composition and occupies a coordinate in space, but it does not need to be told that this action leaves the color of the nearby post office unchanged, nor that it fails to alter the orbital trajectory of Mars. It efficiently filters out the infinite list of non-effects, certifying that the physical state of the street is updated cleanly and without contradiction. The system has successfully mastered the logic of *what changes*.

  The paralysis sets in only when the system attempts to determine whether planting the tree is *permissible*. To do this, it must evaluate the relevance of the tree's effects against the city's goals. The system calculates that the mature tree will cast a shadow on the house at 42 Elm Street at 4:00 PM. In a vacuum, this is just a geometric fact. But to judge relevance, the system must now query its entire database of city facts to see if that shadow *matters*. Does 42 Elm Street have solar panels? Does the resident suffer from Seasonal Affective Disorder? Is the shadow line coincident with a historic sightline protected by a 1920s preservation ordinance? Does the leaf litter clog a drain that floods a basement used for a home business? Each of these potential relevancies requires a new search query, and each query opens a branching path of further dependencies (e.g., if the drain clogs, does it violate a health code? If the health code is violated, does it trigger a fine?).

  **Here is the explosion point:** It occurs not when the system calculates the shadow (a trivial physical side-effect), but the moment it attempts to filter that shadow against the open-ended set of human values, legal codes, and ecological contexts that could render the shadow significant. The narrow problem was about avoiding the axiom that "the post office color stays the same"; the broad problem is that the system cannot bound the search for *why* the post office color might matter (e.g., if the post office is a landmark, if the color is a signal, if the paint is toxic). The system is not stuck because it cannot deduce consequences; it is stuck because, in a world where everything is potentially connected, there is no logical rule for stopping the search for relevance before time runs out.

  This scenario isolates the Dennett-Fodor worry from the McCarthy-Hayes constraint. Even with a perfect logic of action that tracks every physical ripple without needing infinite axioms, the agent remains epistemologically blind. It knows exactly how the world changes, but it lacks a principle of *salience* to tell it which of those changes constitute a problem. Solving the frame problem in logic gives you a perfect map of causality; it does not give you a compass for importance.
