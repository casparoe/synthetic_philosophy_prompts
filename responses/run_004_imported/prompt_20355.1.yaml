answer: |-
  This is an excellent dissection of the lineage. You are right to be skeptical of the "repackaging" charge, because on the surface, both concepts rely on the same engine: **logical correlation without causal contact.** However, the structural differences between Hofstadter's 1983 formulation and the modern Oesterheld/Yudkowsky/Soares formulation are significant enough that "acausal trade" is not merely superrationality with a multiverse coat of paint. It is a generalization that solves a different class of problems.

  Here is the breakdown of the actual daylight between the two, stripped of the cosmological vibes.

  ### 1. Symmetry vs. Asymmetry (Coordination vs. Trade)
  This is the single biggest conceptual delta.

  **Hofstadter's Superrationality** is fundamentally a solution to **symmetric coordination problems**.
  In the Prisoner's Dilemma column, Hofstadter assumes the agents are "relevantly identical." They have the same utility function, the same information, and the same reasoning process. Therefore, $P(\text{You Cooperate} | \text{I Cooperate}) \approx 1$. The problem is purely one of *coordination*: how do we both land on the (C, C) equilibrium when CDT dictates (D, D)? The payoff structure is identical for both. There are no "gains from trade" in the economic sense, only gains from *cooperation*.

  **Acausal Trade** is fundamentally a solution to **asymmetric exchange problems**.
  Oesterheld's paper (and the subsequent LW formalism) explicitly introduces agents with *different* utility functions. Agent A values paperclips; Agent B values staples. They are causally disconnected. Agent A can produce paperclips cheaply; Agent B can produce staples cheaply.
  *   If they act solely on their own local utility, they get $(10, 10)$.
  *   If they acausally trade, A produces staples for B's benefit, and B produces paperclips for A's benefit, resulting in $(100, 100)$.

  **The Daylight:** Superrationality asks, "How do we agree on the same move?" Acausal trade asks, "How do we agree on a *bundle* of moves that benefits our different values?" Acausal trade requires a bargaining solution (like a Nash Bargaining Solution or a CoCo value) to determine the *terms* of the trade. Hofstadter's model assumes the "terms" are fixed by symmetry (we both do the same thing). Oesterheld's model requires calculating a **compromise utility function**, which is a much heavier mathematical lift than Hofstadter's "do what you want the other to do."

  ### 2. The Epistemic Requirement (Common Knowledge vs. Source Code)
  Hofstadter's argument rests on a somewhat fragile empirical claim: that readers of *Scientific American* are sufficiently similar in reasoning that they can treat each other as clones. The Luring Lottery failure you mentioned highlights the fragility here. People didn't trust the common knowledge of rationality. They thought, "I will be superrational, but *they* will be greedy," which collapses the logic back to CDT.

  Acausal trade, particularly in the AI safety context (where it is most rigorously discussed), usually assumes a stronger epistemic basis: **access to source code or high-fidelity simulation.**
  *   **Superrationality:** "I assume you think like me." (Heuristic/Psychological)
  *   **Acausal Trade:** "I can simulate your decision algorithm, or prove properties about it." (Formal/Computational)

  This makes acausal trade more robust as a decision theory. It doesn't rely on the vague "vibe" of similarity; it relies on the logical fact that if two agents are running algorithms $A$ and $B$, and $A$ simulates $B$, then $A$'s output is logically dependent on $B$'s output. This shifts the justification from psychology (Hofstadter) to logic/computation (Garrabrant, Soares, etc.).

  ### 3. The Role of the Multiverse (Scaling vs. Necessity)
  You asked if the multiverse is just dressing up an inconsequential observation. It is not *strictly* necessary for the logic to hold, but it is necessary for the **expected value calculation** to dominate local decision-making.

  In a single universe, causally disconnected regions are rare. The probability that there is an agent out there who values what you can produce cheaply, *and* who can produce what you value cheaply, *and* who is capable of acausal reasoning, is low.
  In a Tegmark Level IV multiverse (or even just a very large Level I), the number of such agents is vast.

  **The Daylight:**
  *   **Superrationality:** Works in a single instance (one PD game).
  *   **Acausal Trade:** Relies on the **Law of Large Numbers across logical space**. The argument is that even if the probability of any *specific* trade partner is low, the *sum* of expected value from all possible trade partners across the multiverse is high enough to dictate your current actions.

  So, the multiverse isn't just flavor text; it provides the **volume** required to make the "compromise utility function" outweigh your local, causal utility. Without the multiverse (or some equivalent assumption of vast logical correlation), acausal trade often loses to local causal opportunities. Hofstadter didn't need the multiverse because he was looking at a single symmetric game where the payoff was immediate.

  ### 4. Decision Theory Status: Intuition vs. Formalism
  This is where the "which holds up better" question gets answered.

  **Hofstadter's Superrationality** is best understood as a philosophical intuition pump for what later became **Timeless Decision Theory (TDT)**. Hofstadter correctly identified that Causal Decision Theory (CDT) fails in Newcomb-like problems, but he lacked the formal machinery to describe *why* without appealing to "identity." He conflated "being the same person" with "running the same algorithm."

  **Acausal Trade** is an application of **Updateless Decision Theory (UDT)**. UDT formalizes the insight that you should choose a policy *before* receiving specific observations, optimizing the output of your algorithm across all possible worlds where that algorithm is instantiated.
  *   UDT handles the asymmetry of values naturally.
  *   UDT handles the pre-commitment problem (you commit to the trade before you know if you are the one who needs the help).
  *   UDT does not require the agents to be "identical," only that their output is logically correlated via simulation or proof.

  **Verdict:** Acausal Trade (grounded in UDT) holds up better as a piece of decision theory. It survives the removal of the "identity" crutch. It acknowledges that agents can be distinct entities with distinct goals and still find a reason to correlate their outputs. Hofstadter's model breaks if the agents are *too* different; Oesterheld's model is designed specifically for when they *are* different.

  ### Summary: Is it Repackaging?
  It is **generalization**, not repackaging.

  1.  **Superrationality** = Symmetric Coordination + Logical Correlation + Single Universe focus.
  2.  **Acausal Trade** = Asymmetric Exchange + Logical Correlation + Multiverse Scaling + Bargaining Theory.

  The "multiverse move" is not just dressing up the 1983 observation; it is the mechanism that allows the asymmetric trade to become action-guiding for agents with local causal priorities. Without the multiverse (or vast logical space), the "compromise utility function" is usually swamped by local causal needs.

  If you strip away the cosmology:
  *   **Superrationality** remains a compelling argument for why clones should cooperate in a PD.
  *   **Acausal Trade** remains a compelling argument for why distinct algorithms with access to each other's source code should sign binding contracts without a court system.

  The latter is a strictly more powerful tool. Hofstadter identified the spark (logical correlation matters); Oesterheld and the LW community built the engine (UDT) that allows that spark to drive a vehicle with different passengers heading to different destinations.
