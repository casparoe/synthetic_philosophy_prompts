prompt: |-
  I'm about three-quarters through my second novel and stuck on a scene I really want to nail. The book follows five philosophy grad students from the same cohort in the early 2000s, and now, twenty years on, two of them, Mara and Theo, who circled each other on and off since their first-year metaethics seminar, are finally getting married. One of the toasts is being given by Priya, Mara's old officemate, who has spent her whole career on fitting-attitude and buck-passing theories of value and has basically made her name on the wrong kind of reasons problem -- the puzzle of how you tell apart a reason to value something that's actually grounded in the thing's value from a reason that just happens to produce the pro-attitude anyway (like the classic case of a demon whos going to hurt you unless you come to admire something worthless).

  I want Priya's toast to actually be structured by that problem, not just namedrop it. She's constitutionally incapable of standing up and listing nice things about the couple without some part of her brain auditing whether each reason she's about to give for why they're perfect together is the right kind (actually tracking who Mara and Theo are) or the wrong kind (the sort that fifteen years of habit, convenience, or sunk cost could've produced just as easily, demon or no demon), and she has to work through that compulsion out loud, in front of a room thats mostly non-philosopher family plus three or four old cohort-mates who'll absolutely clock it if she gets the philosophy wrong, and land somewhere that's actually moving instead of a seminar. Could you write me Priya's toast? I'd like it genuinely warm and a bit funny, and I want the substance of the problem to actually be right, not hand-waved -- I read a couple of papers on this for research but I don't fully trust myself to reconstruct the puzzle correctly on my own, never mind dramatize it.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Context:** Second novel, 3/4 through. Scene: Wedding toast.
      *   **Characters:**
          *   *Priya:* Speaker, philosophy prof, specializes in fitting-attitude (FA) analyses and buck-passing theories of value. Obsessed with the "Wrong Kind of Reasons" (WKR) problem.
          *   *Mara & Theo:* The couple. Philosophy grad students from the early 2000s, now 20 years later. On-and-off relationship since metaethics seminar.
          *   *Audience:* Mostly non-philosopher family, 3-4 old cohort-mates (will catch errors).
      *   **Goal:** A toast structured by the WKR problem. Priya needs to audit her reasons for loving them/their relationship, distinguishing between "Right Kind of Reasons" (RKRs - grounded in the object's actual value) and "Wrong Kind of Reasons" (WKRs - pragmatic, coercive, or habitual reasons to have the attitude).
      *   **Tone:** Genuinely warm, a bit funny, intellectually rigorous (philosophy must be accurate), moving (not just a seminar).
      *   **Constraint:** The philosophy must be correct. No hand-waving the WKR problem.

  2.  **Deconstruct the Philosophy (The Wrong Kind of Reasons Problem):**
      *   *Fitting-Attitude Analysis:* To value $X$ is to hold a pro-attitude toward $X$ (admire, desire, love) *when it is fitting* to do so.
      *   *The Problem:* Sometimes we have reasons to hold a pro-attitude that have nothing to do with $X$'s intrinsic properties.
      *   *Classic Example:* The Evil Demon. A demon threatens to torture you unless you admire a saucer of mud. You have a *reason* to admire the mud (to avoid pain), but the mud isn't *admirable*. The reason is the wrong kind.
      *   *Application to Love/Marriage:*
          *   *RKR:* Reasons grounded in the beloved's properties (kindness, wit, shared history, how they look at each other). These make the love *fitting*.
          *   *WKR:* Reasons grounded in external pressures (sunk cost, social expectation, convenience, fear of being alone, habit). These might make you *stay*, but they don't make the love *fitting*.
      *   *Priya's Struggle:* She needs to assure everyone (and herself) that her admiration for their union isn't based on WKRs (like "they've been together so long it's easier this way"), but on RKRs (their actual goodness).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the awkwardness. Establish Priya's voice (academic but trying to be human). Hook the philosophers in the room immediately.
      *   **The Setup (The Philosophical Frame):** Introduce the Fitting-Attitude analysis simply. Don't lecture, but use the terminology. "What makes an attitude fitting?"
      *   **The Audit (The Middle):** This is the core. Priya needs to propose reasons and then reject or accept them based on the WKR distinction.
          *   *Candidate Reason 1 (Habit/Time):* "They've been together 20 years." -> *Verdict:* WKR. Sunk cost. The Demon of Status Quo.
          *   *Candidate Reason 2 (Convenience/Social):* "They make sense on paper." -> *Verdict:* WKR. The Demon of Expectation.
          *   *Candidate Reason 3 (The Actual Properties):* How they treat each other. Specific moments. -> *Verdict:* RKR. Grounded in the object (the relationship).
      *   **The Turn (The Emotional Payoff):** Move from the abstract to the concrete. The philosophy serves the emotion, not the other way around. The "fittingness" *is* the love.
      *   **The Closing:** A toast. Bring it back to the "demon" metaphor but subvert it.

  4.  **Refining the Philosophy (Self-Correction/Check):**
      *   *Check:* Did I confuse Buck-Passing with FA?
      *   *Correction:* They are closely linked. Buck-passing says "X is good" means "X has properties that give us reasons to have pro-attitudes toward X." The WKR problem attacks this by saying "Wait, some reasons don't track goodness." Priya works on *both*. I should focus on the *fittingness* of the attitude (admiration/love) rather than just "goodness."
      *   *Check:* Is the Demon example clear?
      *   *Correction:* Use the "Demon of Sunk Cost" or "Demon of Convenience" as metaphors for the WKRs in a relationship.
      *   *Check:* Is it too dry?
      *   *Correction:* Needs specific details about Mara and Theo. Since I don't know the novel's specific plot points, I need to create plausible generic-but-specific details (the metaethics seminar, the way they argue, the way they quiet down).

  5.  **Drafting - Voice and Tone:**
      *   Priya is nervous. She's overthinking. That's her charm.
      *   She needs to address the "cohort-mates" directly (a nod to the insiders).
      *   The family needs to feel included, not alienated.
      *   *Key Phrase:* "Right Kind of Reasons."

  6.  **Writing - Iteration 1 (Mental Outline):**
      Hi everyone. I'm Priya. I study value. Specifically, why we like things. Sometimes we like things for bad reasons (demon threat). Sometimes for good reasons (the thing is good). Mara and Theo have been together 20 years. Is that a good reason? No, that's sunk cost. That's a WKR. Do they make me happy? That's subjective. I need to know if their love is *fitting*. I've watched them. They are kind. They challenge each other. That is an RKR. So, raise a glass to the Right Kind of Reasons.

      *Critique 1:* Too dry. Needs more warmth. Needs to show the struggle of her auditing process in real-time.

  7.  **Writing - Iteration 2 (Adding Texture):**
      Start with the glass clinking. Acknowledge the philosophers in the back row (the cohort). Explain the "Evil Demon" but make it about marriage. "The Demon of Comfort." Go through the list. Reject the "they know each other's coffee order" reason (habit). Accept the "they save each other when things are hard" reason (value). End with a definition of love as the ultimate Fitting Attitude.

  8.  **Final Polish (incorporating into the final output):**
      *   Make sure the distinction between *reasons to have the attitude* vs. *properties of the object* is clear.
      *   Ensure the "cohort" nod is subtle but there.
      *   Make the ending tear-jerking. The realization that love *dissolves* the problem. When you love, you don't audit. But Priya *must* audit to show she's sure.

  9.  **Philosophical Accuracy Check:**
      *   *FA Analysis:* Value = Fittingness of pro-attitude.
      *   *WKR:* Reasons to have the attitude that don't reflect the value (e.g., pragmatic benefits).
      *   *RKR:* Reasons that reflect the value (e.g., admirable qualities).
      *   *Priya's move:* She is checking if her admiration for their marriage is based on RKRs.
      *   *Nuance:* In love, the "value" is often constituted by the attitude, which is a counter-argument to FA, but Priya is a FA theorist, so she would try to find the properties that make the love fitting. I will stick to her perspective: She is looking for the *properties* of their relationship that make her admiration *fitting*.

  10. **Final Review against constraints:**
      *   Warm/Funny? Yes, through self-deprecation.
      *   Philosophy accurate? Yes, distinguishes pragmatic reasons from value-grounded reasons.
      *   Moving? Yes, concludes that the "fittingness" is evident in the mundane.

  *(Self-Correction during drafting)*: I need to make sure I don't make Priya sound *too* cold. The auditing is her way of caring deeply. She wants to be *sure* this is real. That's the emotional hook.

  Let's write it.cw
answer: |-
  Priya stood up. The microphone stand was too tall, so she had to tilt her head back, which made her look like she was addressing a balcony rather than a banquet hall. She tapped the glass. It didn't ring. She tapped it harder.

  "Hi. For those who don't know me, I'm Priya. I've known Mara since the first week of grad school, which, if you do the math, is approximately two geological epochs ago."

  A smattering of laughter. In the back corner, three of the old cohort—now tenured, mostly gray—raised their wine glasses in a silent, ironic salute. Priya nodded to them. They were the only ones who knew why she was gripping the podium with both hands.

  "I work in value theory," she began, her voice finding its footing. "Specifically, I study what makes it *fitting* to value things. To admire them. To love them. And for the last fifteen years, my career has been consumed by a puzzle called the Wrong Kind of Reasons problem."

  She saw a few family members glance at their programs, wondering if this was a bit.

  "Here's the puzzle," Priya continued. "Imagine an evil demon threatens to torture you unless you admire a saucer of mud. You now have a very strong reason to admire the mud. But the mud hasn't changed. It's still mud. Your reason for admiring it is pragmatic. It's about the consequences for *you*, not the properties of the *mud*. That is a Wrong Kind of Reason. A Right Kind of Reason would be something about the mud itself—maybe it's a very aesthetically pleasing saucer of mud, though I doubt it."

  She paused, looking out at Mara and Theo, who were seated at the head table, looking confused but smiling.

  "When I was asked to give this toast, I panicked. Because how do you talk about a twenty-year relationship without accidentally citing the Wrong Kind of Reasons? It is so easy to look at a marriage like this and see the pragmatic reasons. The sunk costs. The shared lease. The inertia of two lives that have grown around each other like ivy on a trellis. If I say, 'They are perfect because they've survived two decades,' that is a Wrong Kind of Reason. That is the Demon of Status Quo threatening to hurt us if we don't admire the stability."

  Priya took a breath. She looked down at her index cards, then pushed them aside.

  "So I had to audit my own admiration. I had to sit down and ask: Priya, do you admire this union because it's convenient? Because it's familiar? Because we're all here and it would be awkward if they didn't get married?"

  She looked directly at the cohort in the back. "I know you're all thinking about the metaethics seminar. The year they circled each other like sharks. You're thinking, 'It's about time.' But that's a reason about *us*, the observers. That's the Wrong Kind."

  She turned back to the couple.

  "I had to find the properties of *you* that make this love fitting. And I had to be careful. For example: Mara, you make Theo coffee every morning. Is that a Right Kind of Reason? No. That's habit. A demon could force you to make coffee. Theo, you know exactly when to stop arguing with Mara so she doesn't shut down. Is that a Right Kind of Reason? Maybe not. That could just be conflict avoidance. That could be fear."

  Priya leaned forward, her voice softening, the academic cadence dropping away.

  "But then I watched you last night. At the rehearsal dinner. Mara, you were tired. You had that look you get when the noise is too loud, the one you've had since you were twenty-two. You didn't say anything. You didn't have to. Theo saw it. He didn't make a scene. He didn't ask if you were okay in front of everyone. He just shifted his chair, blocking the traffic flow from the bar, creating a small pocket of quiet. And he changed the subject to something he knew you'd want to correct him on."

  Priya smiled, a genuine, wet-eyed smile.

  "That isn't habit. That isn't sunk cost. That is a property of the relationship itself. It is a responsiveness to value. Theo, you value Mara's comfort more than your own need to be right. Mara, you value Theo's presence enough to let him draw you out of the quiet. Those aren't reasons imposed by a demon. Those are reasons grounded in who you are."

  She straightened up, addressing the room again.

  "In my field, we struggle to define the 'Right Kind.' We write papers. We argue. But watching you two, I realize the distinction is actually quite simple. A Wrong Kind of Reason is about what the relationship *does* for you. A Right Kind of Reason is about who you *are* within it."

  Priya lifted her glass. Her hand was steady now.

  "Mara. Theo. I have spent twenty years looking for reasons to value things that are actually grounded in their value. I have worried that most of what we call 'good' is just us avoiding pain. But looking at you, I don't see avoidance. I see recognition. You recognize the value in each other, not because it's easy, and not because you're told to, but because it is *fitting*. It is the only attitude that makes sense given the people you are."

  She looked at the cohort again. They weren't smiling ironically anymore. One of them was wiping his eye.

  "So, to Mara and Theo. May you never run out of Right Kind of Reasons. And may the only demons you face be the ones you can banish together."

  "Cheers," the room said.

  "Cheers," Priya whispered, and drank.
