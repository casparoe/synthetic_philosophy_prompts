answer: |-
  **Setting:** *A slightly overcrowded community center in Oakland. It's 8:30 PM on a Tuesday. The official "Bay Area EA Meetup" has ended, but a group of six people are lingering around a table covered in empty paper plates and half-eaten vegan cookies. Two people remain locked in conversation.*

  **Characters:**
  *   **Sarah:** A global health researcher. Focuses on cost-effectiveness of direct interventions (bednets, cash transfers). Skeptical of longtermism.
  *   **David:** A PhD student in philosophy. Focuses on existential risk and normative uncertainty. Sympathetic to longtermism.

  ***

  **Sarah:** ...but that's exactly where the epistemic break happens, David. I'm fine with consequentialism in the short run. If I buy a bednet, I know a kid doesn't get malaria. I know that's good. But when you start talking about influencing the trajectory of civilization over the next millennium? That's Lenman's objection all over again. We are structurally clueless.

  **David:** *(Stirring a cold cup of tea)* I get the intuition, Sarah. But you're relying on Hilary Greaves' distinction, right? Simple vs. Complex cluelessness?

  **Sarah:** Exactly. Simple cluelessness is when I don't know *if* an effect will happen, but I know it would be good if it did. Complex cluelessness is when I have reason to think there are opposing effects of similar magnitude, and I can't tell which will dominate. Bednets are simple. AI governance is complex. We don't know if making AI safe leads to a utopia or a stagnant totalitarian lock-in. The valence is unknown.

  **David:** Okay, but have you read Mogensen's paper on flow-through effects? Because I think he collapses your distinction.

  **Sarah:** *(Sighs)* I have. And I think it's a *reductio* of Mogensen's position, not mine.

  **David:** See, I think it's a *reductio* of the idea that cluelessness kills longtermism specifically. Look, take your bednet. You save a child. Great. Direct effect: positive. But that child grows up. They have children. Those children have children. You have changed *who* exists in the future. The identity-affecting nature of the act means the flow-through effects of saving that child are massive and fundamentally unpredictable.

  **Sarah:** Sure, but those effects are downstream. We discount the future.

  **David:** Not if you're a totalist. And even if you discount, Mogensen's point is that the flow-through effects might swamp the direct effect. Maybe saving that child leads to a descendant who invents a plague in 2150. Maybe not. But epistemically, how do you know? If complex cluelessness is a veto on action because we can't trace the valence of the long-term chain, then you can't buy the bednet either.

  **Sarah:** That's absurd. You're saying because I can't guarantee the great-great-grandkid isn't a tyrant, I shouldn't save the kid now? That leads to paralysis.

  **David:** No, I'm saying that if "complex cluelessness" is your sword to slay longtermism, it cuts your legs off too. You can't use it to prioritize global health over existential risk. Because epistemically, the bednet is just as "longtermist" as AI safety once you trace the causal chain. Both are equally clueless about the flow-through.

  **Sarah:** But the *weight* of the uncertainty is different. With the bednet, the direct effect is immediate and high-confidence. The flow-through effects are speculative. With AI safety, the *entire value* is in the speculative flow-through. There is no "direct effect" of writing a policy paper today other than preventing a risk that might not exist.

  **David:** But the "direct effect" of the bednet is morally negligible compared to the flow-through, if the flow-through determines whether humanity survives or flourishes for a million years. If Mogensen is right that flow-through effects dominate, then your confidence in the "direct effect" is an illusion of myopia. You're focusing on the pebble and ignoring the avalanche because the pebble is closer.

  **Sarah:** Okay, let's grant Mogensen for a second. Let's say every action is equally clueless about its 500-year consequences. That doesn't mean we can't make decisions. It means we need a decision rule that handles cluelessness. Greaves suggests looking for robustness.

  **David:** Right.

  **Sarah:** So, is it more *robust* to save a life today, or to try to steer AI development? I'd argue saving a life is robustly good across a wider range of moral theories and future scenarios. Even if the flow-through is random, I've secured a welfare gain *now*. With AI safety, if I'm wrong about the risk, I've spent resources for nothing.

  **David:** But if you're wrong about the flow-through of the bednet, you might have actively made the future worse. Remember, it's not just "random." It's identity-affecting. If you don't buy the bednet, a different set of people exist in 2100. If you do buy it, a different set exists. One of those sets might face extinction. By focusing on the "robust" near-term gain, you might be inadvertently lowering the probability of a good long-term outcome.

  **Sarah:** This feels like moral gambling. You're asking me to ignore a certain good because of a hypothetical, unquantifiable future good.

  **David:** I'm asking you to admit that the "certain good" isn't certain in the grand calculus. Look, the cluelessness objection was supposed to show that consequentialism is unworkable for longtermists. Mogensen shows it's unworkable for *everyone*, or it's workable for *everyone*. You can't have it both ways. If you say, "We act anyway on bednets despite flow-through uncertainty," then you have to admit we can act on AI safety despite flow-through uncertainty.

  **Sarah:** The difference is tractability. I can measure the cost per life saved. I can run an RCT. I cannot run an RCT on existential risk mitigation. The cluelessness isn't just about the *value* of the outcome, it's about the *causal link* between my action and the outcome.

  **David:** But is the causal link to "preventing AI x-risk" more tenuous than the causal link between "saving a child in 2024" and "net positive utility in 2300"?

  **Sarah:** Yes. Because the child might die in a car accident tomorrow. The value of the life saved is bounded. The value of preventing x-risk is unbounded. But the probability of my action actually preventing x-risk is vanishingly small.

  **David:** Okay, but now we're arguing about expected value calculations, not cluelessness. You've shifted the goalposts. You started by saying longtermism is invalid because we are clueless about the future. Now you're saying, "We know the future is huge, but our leverage is small."

  **Sarah:** I'm saying the *variance* is too high. Lenman's point is that when opposing effects balance out, the expected value becomes undefined or zero. With bednets, the direct effect anchors the EV. With AI policy, there is no anchor. It's all drift.

  **David:** But Mogensen argues there is no anchor for the bednets either, not really. The "direct effect" is just the first link in the chain. If the chain's total value is undefined due to complex cluelessness, adding a known positive number to an undefined number... well, in standard math that's undefined. In ethics, it means you don't know if you're doing good.

  **Sarah:** *(Leans back, rubbing her temples)* So what's the solution? Moral skepticism? We all go home and do nothing because we can't trace the causal chains?

  **David:** No. The solution is to admit that cluelessness doesn't discriminate. It forces us to either: A) Accept that we act under deep uncertainty everywhere, using heuristics for both bednets and AI, or B) Reject pure act-consequentialism.

  **Sarah:** I'm willing to do B.

  **David:** *(Smiles)* I knew it.

  **Sarah:** Hey, don't look so triumphant. If I reject act-consequentialism, I might adopt a rights-based view or a satisficing view. "Do no harm" and "help when cheap." That supports bednets. It doesn't necessarily support spending billions to tweak AI alignment architectures.

  **David:** Fair. But if you go that route, you can't use the *consequentialist* cluelessness objection anymore. You have to own the deontological constraint. You have to say, "I save the kid because it's my duty," not "because it maximizes value." Because if it's about maximizing value, Mogensen wins, and the bednet is just as clueless as the AI policy.

  **Sarah:** Fine. Maybe I am a satisficer. I want to be sure I'm helping *someone*, rather than gambling on *everyone*. It feels more... honest.

  **David:** I respect that. But don't pretend the epistemic ground is firmer under your feet than mine. It's all sand. We're just building castles in different spots.

  **Sarah:** *(Picks up her bag)* The sand near the water is wetter, David. It holds shape better.

  **David:** Until the tide comes in.

  **Sarah:** *(Stands up)* Then I'll build further up the beach next time. See you next month?

  **David:** Yeah. Same time.

  *(Sarah walks out into the Oakland night. David stays seated, looking at the empty cookie plate, wondering if clearing the table would have better or worse flow-through effects.)*
