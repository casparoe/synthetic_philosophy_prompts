      *   *Resource Allocation:* Good potential. Who gets the first scoop of food? Who sleeps where?
      *   *Communication Signal:* A specific sound or gesture to mean something specific (e.g., "danger," "food ready," "meeting").
      *   *Idea:* Let's go with a *signal for gathering/decision-making*. It combines communication with group coordination. It needs to be distinct enough to be noticed but simple enough to arise accidentally.
      *   *Refinement:* Let's make it about *silence* or a specific *rhythm*. Or perhaps a physical object placement.
      *   *Better Idea:* A specific *meeting point* or *signal to start work*. Let's try the "Stone Circle" or "The Morning Knock."
      *   *Best Idea:* A specific *auditory signal* that evolves from noise. Let's say, striking metal against stone to signal the end of the day/start of rest. It solves a coordination problem: when do we stop working so we can eat/rest together?

  3.  **Developing the Plot/Progression:**
      *   **Beginning:** Chaos. People are tired, unsynchronized. Some stop early, some late. Food gets cold. Frustration builds.
      *   **Inciting Incident (Accidental):** One person makes a noise that happens to coincide with a good stopping point. Others notice.
      *   **Rising Action:** Repetition. Someone else does it. It works better. People start anticipating it.
      *   **Climax (The Test):** A day when the signal *doesn't* happen, or happens early/late. Confusion ensues. The group realizes they need it.
      *   **Resolution:** The convention is solidified. It's now "law" without being written down.

  4.  **Drafting - Scene by Scene:**
      *   *Scene 1: The Problem.* Establish the setting (a salvage camp or isolated work site). Let's go with a remote research outpost that lost contact, or maybe a group stranded after a transport breakdown. Let's choose a remote mining/salvage camp in a harsh environment. Cold, tired people. The problem: Dinner is ready at different times, people miss each other, morale is low.
      *   *Scene 2: The Accident.* Elias is fixing a generator. He hits a pipe. It rings. People look up. It happens around dusk.
      *   *Scene 3: The Repetition.* Next day, Elias does it again. Others notice. Someone else tries it.
      *   *Scene 4: The Adjustment.* The timing shifts. They realize it needs to be *before* dark, not *at* dark. They negotiate the timing non-verbally.
      *   *Scene 5: The Enforcement.* A newcomer or a skeptic ignores it. The social pressure applies.
      *   *Scene 6: Acceptance.* It's just "what we do."

  5.  **Writing - Focusing on Sensory Details and Internal Logic:**
