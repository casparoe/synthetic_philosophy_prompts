answer: |-
  The shelter was cold, but the real problem was the timing.

  There were twelve of them left after the landslide took the road and the comms tower. They were holed up in the old maintenance depot, a concrete box buried halfway into the mountainside. They had food, they had heat, and they had work. The work was clearing the debris from the intake valves, a dirty, exhausting job that required everyone's hands.

  The friction point was the evening meal.

  In the beginning, it was chaos. People trickled in from the intake tunnel whenever their personal threshold of exhaustion hit. Some came in at 17:00, shivering and hungry. Others pushed until 19:00, driven by a sense of duty. The cook, a quiet woman named Sarah, had a single propane burner. She could only heat one pot of stew at a time.

  If you came early, you ate hot stew but felt guilty for stopping while the tunnel was still blocked. If you came late, you ate cold rations because Sarah had packed up the burner to save fuel. If three people came in at once, they blocked the tiny galley, arguing over ladles. Morale was fraying. There was no rule, only a collective, unspoken anxiety about when it was *okay* to stop.

  Elias was the first to break the symmetry, though he didn't mean to.

  Elias was in charge of the ventilation. On the third day, he was up on a ladder near the main air shaft, tightening a loose baffle. It was getting dark outside, the grey light fading through the high slits. Elias's wrench slipped. It clattered against the metal housing of the ventilation shaft.

  *Clang. Clang-clang.*

  The sound resonated through the concrete box like a bell. It was sharp, distinct, and cut through the low hum of the generator.

  Inside the galley, Sarah paused. In the bunk room, two people looked up from their boots. In the tunnel, three workers stopped shoveling, thinking something had broken.

  Elias, embarrassed, climbed down. "Sorry," he muttered. "Just dropped it."

  But the coincidence was undeniable. The sound had happened exactly at the moment the light was failing—the natural end of the workday. That night, by accident, everyone was in the galley at the same time. Sarah heated one large pot instead of three small ones. They ate together. The conversation was easier. The guilt was diluted because everyone had stopped at once.

  No one mentioned it. Conventions rarely start with a proposal. They start with a recognition of utility.

  The next day, the anxiety returned. When did they stop? 17:30? 18:15? The uncertainty was exhausting in its own right.

  At 18:00, Elias was back on the ladder. He looked down. He saw Sarah standing by the burner, waiting. He saw the workers in the tunnel leaning on their shovels, looking toward the depot entrance. They were waiting for a signal, but they hadn't asked for one.

  Elias felt the weight of their expectation. If he didn't do it, they would drift in individually again. The cold rations would return. He picked up the wrench. He tapped the housing.

  *Clang. Clang-clang.*

  The relief in the room was palpable. Shoulders dropped. Shovels were racked. The group moved as a single organism toward the galley.

  By the fourth day, the sound had acquired a name, though no one spoke it. It was just "The Knock."

  But a convention isn't a convention until it survives the absence of its originator. On the fifth day, Elias was sick. He lay in his bunk with a fever, unable to climb the ladder.

  18:00 came. The light faded. The ventilation shaft stood silent.

  In the tunnel, Kael stopped shoveling. He wiped sweat from his brow and looked at his partner, Jory. "Did he hit it?" Kael asked.

  Jory shook his head. "Elias is down."

  They waited ten minutes. The uncertainty crept back in. If they stopped now, were they lazy? If they kept going, would they miss the hot pot? The coordination was failing. The equilibrium was breaking.

  Jory looked at the ladder. He looked at the metal housing. He realized that the sound wasn't about Elias. It was about the *time*. It was about the *group*.

  Jory walked over, picked up a heavy iron rod, and struck the shaft.

  *Clang. Clang-clang.*

  It wasn't the exact same timbre—Elias used a wrench, Jory used a rod—but the rhythm was identical.

  In the galley, Sarah didn't even look up. She just put the pot on the burner. The convention had decoupled from the person. It was now a property of the group.

  However, conventions require enforcement, or at least, mutual expectation. On the seventh day, a new variable was introduced. A hiker, separated from a trail group, had stumbled upon the depot. He was safe, but he was an outsider. He didn't know the rhythm.

  The hiker, eager to prove his worth, kept working in the tunnel until 19:00. He missed The Knock. He arrived at the galley alone, an hour late. The stove was cold. The group was already eating, the conversation flowing in that warm, post-work rhythm that excludes the latecomer.

  The hiker stood there, holding his bowl, feeling the sharp sting of exclusion. It wasn't malicious. No one had told him he *had* to stop. But by not stopping, he had removed himself from the collective.

  Mara, who had been watching the social geometry of the shelter closely, saw the hiker's isolation. She also saw the risk. If people started ignoring the signal, the coordination would dissolve back into chaos.

  She didn't make a speech. Speeches create rules, not conventions. Instead, she used the tool of mutual adjustment.

  The next evening, just before 18:00, Mara walked into the tunnel. She saw the hiker digging furiously.

  "The light's going," Mara said.

  "I can get another load out," the hiker said.

  Mara didn't argue. She simply walked over to the ventilation shaft. She waited. She looked at her watch. 18:00.

  She struck the shaft. *Clang. Clang-clang.*

  She looked at the hiker. She didn't tell him to stop. She just put her shovel against the wall and walked toward the galley. Kael and Jory did the same. They left the hiker alone in the tunnel.

  The pressure wasn't authoritative; it was gravitational. The hiker realized that working alone in the dark had no value if the rest of the team was resting. The utility of his labor depended on their coordination. He dropped his shovel and followed.

  By the tenth day, the convention had hardened into fact. It was no longer "Elias's noise" or "Jory's signal." It was simply what happened at dusk.

  But the true test of a convention is when it becomes inefficient, yet persists because the coordination value outweighs the cost.

  On the twelfth day, a rescue helicopter spotted their smoke signal. They were told to pack up immediately. The situation was urgent. Stopping at 18:00 made no sense. They needed to work until the gear was stowed.

  Yet, at 18:00, Elias, fever broken, climbed the ladder. Habit is a powerful thing. He reached for the wrench.

  Mara saw him. "Don't," she said.

  Elias froze. "It's time."

  "Not today," Mara said. "Today we stop when the crate is full."

  It was a moment of tension. The convention was strong enough that breaking it felt wrong, like speaking out of turn. But they managed it. They worked until the crate was full. They ate cold rations that night.

  But the moment the rescue arrived, and they were loaded onto the chopper, the rhythm reasserted itself. As they lifted off, leaving the depot behind, Elias tapped his knuckles against the metal frame of the helicopter seat.

  *Clang. Clang-clang.*

  Softly, barely audible over the rotors.

  Sarah, sitting across from him, smiled. Kael, next to her, checked his watch.

  They were leaving the mountain, but they were taking the mountain with them. The rule hadn't been written in the logbook. It wasn't in the emergency manual. It existed only in the shared memory of twelve people who knew that at dusk, you stop, so that everyone can eat together.

  It was a tiny thing, a superstition of metal on metal. But as the helicopter banked toward the valley, Mara realized it was the thing that had kept them from fracturing. They hadn't agreed to it. They had fallen into it, like water finding a level.

  In the beginning, it was just noise. Then it was a solution. Now, it was a bond.

  Elias tapped the seat again, once, just to be sure.

  *Clang.*

  Everyone looked at him.

  "Just checking," he said.

  They all nodded. They understood. The convention was safe. It would survive the rescue. It would survive the dispersal. Because it wasn't about the sound. It was about the agreement that when the sound happened, no one had to be alone.

  As the valley floor rose to meet them, no one spoke. They didn't need to. They were all waiting for the next time the light would fade, and someone, anyone, would pick up a piece of metal, and tell them it was okay to rest.
