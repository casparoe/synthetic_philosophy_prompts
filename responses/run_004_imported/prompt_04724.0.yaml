      *   *One-off vs. Repeated:* EV is perfectly fine for one-off bets or additive processes.
      *   *The "Parallel Universes" Interpretation:* If you can actually access the ensemble (e.g., large institution, many independent bets simultaneously), EV *is* the time average.
      *   *Finite Horizons:* Kelly is asymptotic. For short time horizons, EV might outperform Kelly in terms of raw wealth expectation (even if median is lower).
      *   *Optionality/Bailouts:* If there's a floor (bankruptcy protection) or a ceiling (target wealth), EV strategies change.
      *   *Subjective Preferences:* Rationality is about satisfying preferences. If I prefer a 1% chance of \$1 trillion over a 100% chance of \$1 million, EV maximization captures that.
      *   *The "Math Error" Claim:* It's not a *calculation* error, it's a *model specification* error. Calling it "mathematically wrong" conflates the tool with the objective function.

