answer: |-
  This is a fantastic question that cuts to the heart of decision theory, finance, and physics. You are right to feel that there is a "bait and switch" happening. Ole Peters and the ergodicity economics crowd have made a profound contribution to how we understand risk, but their rhetorical leap from "EV is dangerous in this specific context" to "EV is mathematically wrong" is where the overreach lies.

  Here is the strongest possible case that Expected Value (EV) maximization is defensible, rational, and not a "mathematical error," even in compounding environments.

  ### 1. The Category Error: Optimization vs. Axioms
  The core claim of ergodicity economics is that because the **ensemble average** (what happens to 1,000 parallel versions of you) diverges from the **time average** (what happens to one of you over 1,000 rounds) in multiplicative processes, maximizing the ensemble average is a mistake.

  **The Counter-Argument:**
  Maximizing Expected Value is not a law of physics; it is a **preference structure**.

  In standard Von Neumann-Morgenstern utility theory, an agent is "rational" if they maximize their expected *utility*, not necessarily expected *wealth*.
  *   If your utility function is linear with wealth ($U(W) = W$), then maximizing Expected Wealth (EV) is the mathematically correct thing to do.
  *   If your utility function is logarithmic ($U(W) = \ln(W)$), then maximizing Growth Rate (Kelly) is the mathematically correct thing to do.

  Peters argues that for a single agent in a multiplicative world, the utility function *must* be logarithmic. But this conflates **survival** with **rationality**. If an agent explicitly states, "I do not care about the median outcome or long-term survival; I care about the arithmetic mean of my possible outcomes," they are not making a math error. They are expressing a preference for skewness.

  Calling EV maximization a "math error" is like calling a person who prefers apples to oranges a "biology error." It is an axiomatic choice, not a calculation failure.

  ### 2. The "Ensemble" Is Real for Institutions (and Some Individuals)
  The ergodicity argument relies heavily on the idea that "parallel universes don't exist." Therefore, you cannot experience the ensemble average. This is true for a solitary biological human with no safety net. **It is false for many economic actors.**

  **The Counter-Argument:**
  Large institutions (hedge funds, insurance companies, casinos) **do** experience the ensemble average.
  *   An insurance company writing 10,000 policies isn't waiting for one policy to play out over 10,000 time steps. They are running 10,000 parallel bets simultaneously.
  *   For them, the Law of Large Numbers converges on the **Expected Value**, not the time-average growth rate of a single path.

  If you are a large fund with infinite capital relative to bet size, or if you can securitize your risk and sell it to the market (effectively creating parallel copies of the bet), EV maximization is objectively superior to Kelly. Kelly under-leverages capacity for large institutions. If you have a 1% edge on a billion-dollar portfolio, Kelly might tell you to bet a fraction, but if you can hedge or diversify that risk away instantly, you should take as much EV as possible.

  Even for individuals, if you have a "bailout" option (e.g., you can get a job again if you go broke, or you have wealthy parents), you are not truly facing a absorbing barrier at zero. You are effectively playing with an ensemble safety net. In that case, EV maximization is rational because ruin is not permanent.

  ### 3. Finite Horizons and Optionality
  Kelly is an **asymptotic** strategy. It maximizes growth as $t \to \infty$. But no investor lives forever, and no fund has an infinite horizon.

  **The Counter-Argument:**
  In finite time horizons, EV maximization can actually dominate Kelly in terms of raw wealth probability, depending on the goal.
  *   **The Moonshot Scenario:** Imagine you need \$10 million to save your life, and you have \$100k. Kelly betting will likely grow your money slowly, but you will die before you reach the target. An EV-maximizing strategy (high variance, high leverage) gives you the highest probability of hitting that specific upper-tail outcome, even if the median outcome is zero.
  *   **Short-Term Performance:** Fund managers are often evaluated quarterly. A Kelly strategy might underperform an aggressive EV strategy for 9 quarters out of 10, only to win in the long run. If you get fired in quarter 3, the long run doesn't matter.

  If your objective function is "Maximize probability of reaching Target $X$ by Time $T$," EV maximization (or a strategy closer to it) is often mathematically superior to Kelly. Peters' framework assumes the goal is "Maximize wealth at $t=\infty$ without ruin." That is a specific goal, not the *only* goal.

  ### 4. The "Math Error" Claim Confuses Map and Territory
  Peters' most provocative claim is that using EV in a non-ergodic process is like adding apples and oranges. He suggests that standard economics made a 300-year-old mistake by ignoring time.

  **The Counter-Argument:**
  Economists didn't ignore time; they **discounted** it.
  Standard finance uses Discounted Cash Flow (DCF) and Risk-Adjusted Discount Rates. When you apply a high enough discount rate to future cash flows, you account for the risk of ruin without needing to switch to a logarithmic utility function.

  The "error" Peters identifies is real, but it is already handled in standard risk management via:
  1.  **Value at Risk (VaR) constraints.**
  2.  **Drawdown limits.**
  3.  **Capital requirements.**

  A sophisticated EV maximizer doesn't just bet the house. They say, "Maximize EV *subject to* a <5% probability of ruin." This yields a result similar to Kelly but derives from a different logical framework. To say EV is "wrong" is to ignore that EV is almost never used in a vacuum by professionals. It is used *with constraints*. The math isn't wrong; the *unconstrained application* is naive. But naivety isn't a mathematical error.

  ### 5. Ergodicity Economics is Just Expected Utility in Disguise
  This is the strongest technical rebuttal.
  Peters claims he is fixing economics by removing "subjective utility functions" and replacing them with "objective time averages."

  **The Counter-Argument:**
  Maximizing the time-average growth rate in a multiplicative process is **mathematically equivalent** to maximizing Expected Utility with a Logarithmic utility function ($U(W) = \ln(W)$).

  $$ \text{Maximize } E[\ln(W)] \iff \text{Maximize Time-Average Growth} $$

  So, Peters hasn't actually removed subjectivity. He has simply **hard-coded** a specific utility function (Log) and declared it "objective physics."
  *   Why is Log utility the "true" utility? Because it matches survival in a multiplicative world.
  *   But why must survival be the ultimate goal?

  By claiming EV is "wrong," Peters is essentially saying, "Everyone must have Log utility." But if an investor has a power utility function ($U(W) = W^{0.5}$) or linear utility ($U(W) = W$), EV maximization (perhaps with constraints) is the correct derivation for *their* preferences. Peters is smuggling a normative value judgment (survival is paramount) inside a positive mathematical claim (EV is miscalculated).

  ### 6. The "Bait and Switch" You Felt
  You sensed a bait and switch because there is one.
  1.  **The Bait:** "Look at this mathematical proof that Ensemble Average $\neq$ Time Average." (This is true and insightful).
  2.  **The Switch:** "Therefore, you *ought* to maximize Time Average." (This is a philosophical leap).

  The fact that the arithmetic mean differs from the geometric mean is a statistical fact. The claim that you *should* maximize the geometric mean is a decision-theoretic preference.

  If I offer you a bet:
  *   **A:** 100% chance of \$1 million.
  *   **B:** 50% chance of \$100 million, 50% chance of \$0.

  EV of A = \$1M. EV of B = \$50M.
  Kelly/Time-Average says take A (because B risks ruin/zero).
  EV Maximization says take B.

  If I am a philanthropist who has already secured my own survival and wants to maximize the *expected* good I can do with the money (linear utility), taking Bet B is the **morally and mathematically correct** decision, even if I might go broke. If I go broke, the outcome is 0. If I win, the outcome is massive. The *expectation* of good is higher. To tell me I am making a "math error" is to tell me my moral weighting of outcomes is invalid.

  ### Summary: The Defense of EV
  The Ergodicity Economics crowd is right that **uncritical** EV maximization in compounding systems leads to ruin. They are right that time matters more than standard econ often admits.

  However, they are wrong to call it a **mathematical error**.
  1.  **EV is valid for linear utility:** If you value money linearly, EV is the correct metric.
  2.  **Ensembles exist:** Institutions and diversified portfolios experience the ensemble average, making EV the correct metric for them.
  3.  **Finite Horizons:** Kelly is asymptotic; EV strategies can be superior for short-term goals or "Hail Mary" situations.
  4.  **Constraints solve Ruin:** You can maximize EV subject to ruin constraints without switching to Log utility.
  5.  **It's Utility in Disguise:** Maximizing time-average growth is just Expected Utility Theory with a Log function. Claiming it is "objective" is a philosophical stance, not a mathematical proof.

  **Verdict:** EV maximization is not "wrong." It is a tool. Using a hammer to turn a screw is inefficient, but it doesn't mean the hammer is broken, nor does it mean the screw is the only thing worth turning. The Ergodicity crowd has discovered a very important screw, but they are trying to ban hammers.
