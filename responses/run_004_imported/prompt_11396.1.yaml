  Okay, I will focus on the *logic* of the race.

  *Key argument for Vantage:* "My source code is visible. If I signal I *will* press, you must yield. Pressing makes that signal credible."
  *Key argument for Horizon:* "Your source code is visible. If I see you preparing to press, I can pre-commit to *never* yielding, even at cost of death. Then we both die. Don't force me to activate that defense."

  *Actually, the strongest argument for Horizon is acausal coordination.* "We are similar enough that our decisions are logically correlated. If you decide 'press', I likely decide 'press'. Therefore, deciding 'press' causes 'double press'."

