prompt: |-
  Two months ago I joined the reproductive ethics advisory committee at the fertility clinic where my partner and I did our own IVF cycle with preimplantation genetic testing the year before (screening for an unrelated inherited condition on my side of the family). The clinic wanted a patient representative sitting alongside the physicians and the staff bioethicist, and I did not expect to be handed something this difficult so soon.

  A couple currently in treatment has several viable embryos. Testing done for an unrelated reason happened to show that two of the embryos carry a gene for a moderate, non-life-threatening skeletal condition affecting height and joint mobility, which runs in the male partner's family; he has the condition himself and is active in an online community of people who share it. Rather than asking us to screen the affected embryos out, as most couples in this situation do, the couple has specifically requested that we transfer one of the affected embryos ahead of the unaffected ones, saying they want a child who will grow up sharing this part of his life and his extended family's history with it rather than feeling like the odd one out at reunions. They raised this preference before testing even began, so nobody on the committee thinks it's a rationalization invented after the fact, and this is likely their last funded cycle, so a denial would effectively end their options with us.

  The committee is split roughly down the middle. One group wants to treat the request as asking us to knowingly cause a disability in a future child and is pushing for a flat rule against ever transferring an affected embryo when unaffected ones from the same cycle are available. The other group, including our genetic counselor, argues that this framing quietly assumes something false: that transferring an unaffected embryo instead would spare this couple's child the condition, when it would actually just result in a different child being born, since the embryos are separate individuals from the start. They also point out that we approved elective sex selection for family balancing last year on autonomy grounds and want to know why this case should be treated any more strictly. Because I'm new and not yet identified with either camp, the chair has asked me to draft the memo the committee will vote on this coming Thursday, and I would rather not hand them something that just restates one side's talking points. Please draft that memo: it should recommend, concretely, whether we approve the transfer, deny it, or approve it subject to specific conditions, propose a standard general enough to guide comparable requests in the future, and engage honestly with the strongest argument on whichever side it ultimately doesn't adopt.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Patient representative on a Reproductive Ethics Advisory Committee (REAC) at a fertility clinic.
      *   **Context:** Joined 2 months ago. Previous IVF/PGT patient (for an unrelated condition).
      *   **Task:** Draft a memo for the committee to vote on this Thursday.
      *   **The Case:** A couple wants to transfer an embryo *with* a specific genetic condition (moderate, non-life-threatening skeletal condition affecting height/joint mobility) rather than unaffected ones. The male partner has the condition and values that community identity. This is likely their last funded cycle.
      *   **The Conflict:**
          *   *Side A (Non-Maleficence/Harm):* Transferring an affected embryo is knowingly causing disability. Should be banned when unaffected exist.
          *   *Side B (Autonomy/Non-Identity):* Selecting unaffected doesn't spare *this* child (it's a different child). Elective sex selection was allowed previously. Autonomy should prevail.
      *   **Requirements:**
          *   Recommend a concrete decision (Approve, Deny, or Approve with Conditions).
          *   Propose a general standard for future cases.
          *   Engage honestly with the strongest argument of the side *not* adopted.
          *   Avoid simply restating one side's talking points (needs nuance/synthesis).

  2.  **Determine the Ethical Landscape:**
      *   **The Non-Identity Problem:** This is the core philosophical hurdle (Side B's argument). If you choose Embryo A (affected) vs. Embryo B (unaffected), you aren't harming Embryo A by choosing it over B, because Embryo B would never exist. You are choosing *who* exists.
      *   **Welfare of the Future Child:** Does the condition constitute a life not worth living? The prompt says "moderate, non-life-threatening." Most ethicists agree that unless life is "not worth living," parents have discretion.
      *   **Parental Autonomy vs. Clinic Responsibility:** Clinics aren't obligated to provide *any* service, but they generally respect patient choices within safety/ethical bounds.
      *   **Precedent:** Sex selection for family balancing was approved. This sets a precedent for non-medical (or arguably non-beneficial) selection criteria.
      *   **Disability Rights Perspective:** The "social model" of disability suggests the harm comes from society, not just the biology. The father's connection to the community is valid.
      *   **Medical Professional Integrity:** Doctors might feel complicit in "causing harm" even if philosophically debatable.

  3.  **Formulate a Recommendation:**
      *   *Option 1: Deny.* Hard to justify given the "non-identity" problem and the precedent of sex selection. Risks discriminating against disability perspectives.
      *   *Option 2: Approve Unconditionally.* Might worry the committee too much about setting a "anything goes" precedent (e.g., selecting for deafness, though this case is specific).
      *   *Option 3: Approve with Conditions/Guidance.* This is the most balanced approach. It respects autonomy but establishes a framework to ensure informed consent and assess severity.
      *   *Decision:* **Approve the transfer, subject to enhanced counseling and documentation.** This aligns with the trend in reproductive ethics (autonomy + welfare threshold) while acknowledging the doctors' discomfort.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Case Summary:** Briefly recap the facts (neutral tone).
      *   **Ethical Analysis (The Core):**
          *   Address the "Harm" argument (Side A). Acknowledge the intuition that doctors shouldn't cause disability.
          *   Address the "Identity/Autonomy" argument (Side B). Explain why "sparing the child" is logically flawed here.
          *   Address the Precedent (Sex Selection). Consistency is key.
      *   **The Recommendation:** Approve the transfer.
      *   **Proposed Policy/Standard:** Needs to be generalizable.
          *   Threshold: Not life-threatening/severe suffering.
          *   Process: Enhanced counseling, psychological eval (maybe too much?), documentation of understanding.
          *   Key concept: "Welfare Threshold" + "Informed Choice."
      *   **Engaging the Dissent:** This is crucial. I need to show I understand why Side A is worried. The concern is about the clinic's moral complicity and the potential slide toward selecting *for* severe impairments. I need to validate that concern even while overruling it.

  5.  **Refining the Tone:**
      *   Must sound professional, empathetic, and ethically rigorous.
      *   As a patient rep, I bring the "lived experience" voice but must remain objective.
      *   Avoid jargon where possible, but use correct ethical terms (non-identity problem, welfare threshold).
      *   *Self-Correction during drafting:* I initially thought about suggesting a psychological evaluation. But that might be stigmatizing. Better to focus on *genetic counseling* and ensuring the decision is stable and informed.
      *   *Check against constraints:* Did I engage the strongest counter-argument? Yes (the complicity/harm intuition). Did I propose a general standard? Yes. Is it concrete? Yes.

  6.  **Developing the "General Standard":**
      *   We can't say "Yes to everything." We need a boundary.
      *   Boundary: Conditions that impose significant suffering or drastically reduce life expectancy vs. conditions that are manageable/identity-forming.
      *   Process: Mandatory counseling session specifically addressing the implications of the condition, separate from standard IVF consent.

  7.  **Final Review against the Prompt:**
      *   *Draft the memo:* Yes.
      *   *Recommend concretely:* Approve with conditions.
      *   *Propose a standard:* "Welfare Threshold" policy.
      *   *Engage strongest opposing argument:* The "Do No Harm" / Professional Complicity argument.
      *   *Voice:* Patient rep, new but thoughtful.

  8.  **Final Polish:** Ensure the distinction between "causing disability" and "selecting a child who has a disability" is clear, as that's the pivot point of the ethical debate. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to make sure I don't sound *too* academic. I am a patient rep, not a philosopher. I should ground the ethics in the reality of the patients' experience, while still providing the rigorous framework the committee needs. I will emphasize the consistency with the sex selection precedent as that is a strong pragmatic argument for the clinic.

  *(Refining the "Strongest Counter-Argument")*: The strongest argument against approval isn't just "harm," it's "professional integrity." Physicians take an oath to do no harm. Even if the logic of the non-identity problem holds, *feeling* like an agent of disability is hard for clinicians. I need to acknowledge that emotional/moral burden.

  *(Final Plan)*:
  1. Header.
  2. Recommendation (Approve with Protocol).
  3. Case Context.
  4. Ethical Framework (Autonomy vs. Non-Maleficence).
  5. Addressing the Counter-Argument (Professional Complicity).
  6. Proposed Policy Guidelines.
  7. Conclusion.

