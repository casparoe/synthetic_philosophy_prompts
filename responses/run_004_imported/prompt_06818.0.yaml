answer: |-
  **TRANSCRIPT EXCERPT: STATE SENTENCING COMMISSION PUBLIC HEARING**
  **DATE:** October 14, 2024
  **SUBJECT:** Re-authorization of Algorithmic Risk Assessment Instrument (ARAI)
  **LOCATION:** State Capitol, Hearing Room B

  **PARTICIPANTS:**
  **COMMISSIONER HAYES** (Chair)
  **DR. ELENA ROSETTI** (Senior Statistician, Center for Actuarial Justice)
  **DR. MARCUS THORNE** (Director of Data Equity, Civil Liberties Union)

  ***

  **COMMISSIONER HAYES:** Dr. Rosetti, let's return to the calibration metrics. You've submitted testimony stating that the current instrument is "racially calibrated." Can you explain what that means for the record, specifically in contrast to Dr. Thorne's findings on false positives?

  **DR. ROSETTI:** Certainly, Commissioner. Calibration is a measure of truthfulness. If the tool assigns a risk score of 7 to a White defendant and a risk score of 7 to a Black defendant, calibration requires that the actual rate of recidivism for both groups be identical. In our validation study, a score of 7 corresponded to a 60% reoffense rate for White defendants and a 61% rate for Black defendants. Statistically, that is indistinguishable. The number means the same thing, regardless of race.

  **COMMISSIONER HAYES:** And Dr. Thorne?

  **DR. THORNE:** I don't dispute Dr. Rosetti's calibration data. The tool is calibrated. But calibration is only one definition of fairness. My analysis focused on error rates. Among defendants who *did not* reoffend, Black defendants were flagged as "high risk" at nearly twice the rate of White defendants. That is a False Positive Rate disparity.

  **DR. ROSETTI:** With respect, Dr. Thorne, that disparity is a mathematical inevitability given the base rates in the data.

  **DR. THORNE:** I agree it's an inevitability *if* you prioritize calibration. But that's the point, Elena. You're treating calibration as the axiom and error parity as the variable. I'm arguing we should do the reverse.

  **DR. ROSETTI:** Because if we equalize the false positive rates, we break calibration. If we force the tool to flag non-reoffending Black and White defendants at the same rate, we have to lower the risk scores for Black defendants relative to their actual behavior. We would be telling a judge that a Black defendant with a 60% risk of reoffending is actually a 40% risk. That is falsifying the probability.

  **DR. THORNE:** Or, we admit that the "probability" is inheriting historical policing biases embedded in the base rates. But let's stick to the math, since that's where we agree we're stuck. We both know the impossibility theorem. Chouldechova, Kleinberg, Mullainathan. When prevalence differs between groups, you cannot satisfy Calibration and Error Rate Balance simultaneously. One has to go.

  **COMMISSIONER HAYES:** This is the crux of today's hearing. Dr. Rosetti, you argue we must keep calibration. Dr. Thorne, you argue we must equalize error rates. I need you both to be explicit about the cost of your preference. Dr. Rosetti, if we keep the tool as is to preserve calibration, what are we accepting?

  **DR. ROSETTI:** We are accepting that the burden of error will not be distributed equally. Because the underlying recidivism rate in the training data is higher for Black defendants—due to complex socioeconomic and policing factors we cannot control in this model—the tool will generate more false positives for that group. But, Commissioner, if we fix that, we undermine the integrity of the risk score itself. A judge cannot make a decision based on a number that has been artificially depressed to satisfy a quota. If the tool says "high risk," it must mean "high risk," even if that label lands disproportionately on one group.

  **COMMISSIONER HAYES:** So you prioritize the accuracy of the prediction over the distribution of the mistake.

  **DR. ROSETTI:** I prioritize the honesty of the information provided to the court.

  **COMMISSIONER HAYES:** Dr. Thorne?

  **DR. THORNE:** I prioritize the human cost of the mistake. A false positive isn't a statistical residual; it's a person who gets denied parole or gets a longer sentence for a crime they won't commit. If the system makes mistakes on Black defendants twice as often as it does on White defendants, it is imposing a higher tax on liberty for that group. To fix that, yes, we might have to adjust the thresholds. We might have to accept that for one group, a score of 7 implies a different probability than it does for another.

  **DR. ROSETTI:** (Leaning forward) But Marcus, that's group-specific calibration. You're advocating for different standards of truth.

  **DR. THORNE:** I'm advocating for different standards of *risk tolerance*. We adjust thresholds for juveniles versus adults all the time. Why is race the line we won't cross if it reduces disparate incarceration?

  **DR. ROSETTI:** Because juveniles biologically differ in culpability. Race is not a causal variable. If you decouple the score from the actual outcome rate, you are essentially lying to the judge to achieve a social outcome.

  **DR. THORNE:** And if you keep the score "honest" to the data, you are automating the status quo of that data.

  **COMMISSIONER HAYES:** I want to pause here. Both of you have cited the same papers. You both acknowledge the theorem. You agree that you cannot have both Calibration and Equal False Positive Rates.

  **DR. ROSETTI:** Correct.

  **DR. THORNE:** Correct.

  **COMMISSIONER HAYES:** So the decision to use this tool, in its current form, is not a decision that the math *requires* this outcome. It is a decision that you have *chosen* this outcome.

  **DR. ROSETTI:** (Silence for a moment) I... suppose that is one way to frame it.

  **COMMISSIONER HAYES:** Is it? Dr. Rosetti, is there a mathematical reason Calibration is superior to Error Parity?

  **DR. ROSETTI:** No. Not mathematically. Mathematically, they are just different loss functions.

  **COMMISSIONER HAYES:** And Dr. Thorne, is there a mathematical reason Error Parity is superior to Calibration?

  **DR. THORNE:** No. Mathematically, it's just a different constraint optimization.

  **COMMISSIONER HAYES:** Then help me write the report. When I tell the legislature why we kept or rejected this tool, do I tell them we rejected it because it violated a law of statistics?

  **DR. THORNE:** No. You tell them we rejected it because we decided that equalizing the risk of unnecessary incarceration is more important than maintaining a uniform definition of probability across groups.

  **DR. ROSETTI:** And if you keep it, you tell them we decided that providing the court with the most statistically accurate probability estimate is more important than equalizing the error rates, because accurate estimates are necessary for public safety.

  **COMMISSIONER HAYES:** So, to be clear: Dr. Rosetti, you are willing to sacrifice equal error rates to maintain predictive truth.

  **DR. ROSETTI:** Yes. I believe a risk assessment tool that lies about risk is useless, even if it lies to achieve equality.

  **COMMISSIONER HAYES:** And Dr. Thorne, you are willing to sacrifice predictive truth—specifically, calibration—to achieve equal error rates.

  **DR. THORNE:** Yes. I believe a risk assessment tool that perpetuates disparate harm is unjust, even if it is statistically "honest" about the disparity.

  **COMMISSIONER HAYES:** (Looking over glasses) So we are not arguing about whether the algorithm is broken. We are arguing about which form of unfairness the state is willing to codify.

  **DR. THORNE:** That is my position.

  **DR. ROSETTI:** (Nods slowly) I dislike that phrasing, Commissioner. But... yes. It is a policy choice. We have been treating it as a technical audit, but the audit reveals a trade-off that math cannot resolve.

  **COMMISSIONER HAYES:** Thank you. I think that's the first time in six years I've heard that admitted on the record. We'll take a ten-minute recess.

  ***
