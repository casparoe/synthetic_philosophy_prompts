      *   **Constraint 2:** Note anything *both* Elena and David are overlooking.
      *   **Context:** Hiring committee meeting, disagreement unresolved.

  2.  **Deconstruct the Exchange (Move by Move):**

      *   **Move 1: Professor K's Objection.**
