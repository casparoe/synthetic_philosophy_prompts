      *   *Synthesis/Overlooked Factors:* Address the systemic issues, the candidate, and the distinction between standing and validity.
      *   *Conclusion:* Summarize who holds the stronger position on *standing*.

  6.  **Refining the Evaluation (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to say K is "wrong" about the papers. The prompt says keep standing separate from correctness.
      *   *Nuance:* On David's last point, the ex-addict analogy is powerful but flawed. An ex-addict warns *against* the drug. They didn't get their *job as a counselor* necessarily by being an addict (though it helps credibility). K got his *Professorship* (the power to judge) by salami slicing. That's a key difference. I need to highlight this.
      *   *Elena's Strength:* Her distinction between *blameworthiness* and *benefit* is the philosophical heavyweight here. It avoids the trap of saying "you sinned so you can't speak" and moves to "you profited from the sin you now condemn."

