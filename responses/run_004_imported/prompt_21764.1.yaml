  2.  **Deconstruct the Two Arguments:**

      *   **David Hume (Price-Specie-Flow Mechanism):**
          *   *Context:* Mercantilism (wealth = gold/silver specie). Goal: Maximize exports, minimize imports to accumulate specie.
          *   *Mechanism:* Money supply $\rightarrow$ Prices. More money = higher prices. Higher prices = less competitive exports, more attractive imports.
          *   *Result:* Automatic correction. You *cannot* maintain a trade surplus forever. The market self-corrects.
          *   *Normative Claim:* Mercantilist policy is *futile*, not necessarily immoral or inefficient in the micro sense (though Hume implies it's harmful). It attacks the *goal* of mercantilism (hoarding specie).
          *   *Monetary Role:* Central. It relies entirely on the quantity theory of money.

      *   **David Ricardo (Comparative Advantage):**
          *   *Context:* Classical Economics, Corn Laws debate. Goal: Maximize total output/consumption.
          *   *Mechanism:* Opportunity costs differ between nations. Specialize in what you are *relatively* best at, even if you are absolutely worse at everything.
          *   *Result:* Total global output increases. Both nations can consume beyond their production possibility frontiers.
          *   *Normative Claim:* Free trade is *positive sum*. Protectionism reduces total wealth.
          *   *Monetary Role:* Minimal/None. It's a real barter model at its core. Money is a veil.

  3.  **Address the Specific Questions:**

      *   *Are they distinct?* Yes, fundamentally. One is about monetary equilibrium (Hume), the other about real resource allocation (Ricardo).
      *   *What does Hume license?* It licenses the claim that trade balances self-correct. It does *not* explicitly prove that trade makes both parties richer in terms of goods/services. It proves that trying to hoard money via trade policy is pointless.
      *   *What does Ricardo license?* It licenses the claim that specialization increases total welfare. It argues *for* trade, not just against balance-of-trade manipulation.
      *   *Does Ricardo depend on Hume?* No. Ricardo's model works in barter. Hume's model *requires* money (specie).

