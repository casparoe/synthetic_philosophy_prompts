answer: |-
  Your friend was right. While both Hume and Ricardo are foundational figures in classical economics and both are often cited as "pro-free trade," their arguments operate on entirely different levels, address different errors, and rely on different mechanisms. Conflating them is a common mistake, but distinguishing them is crucial for understanding what economic theory actually says about policy.

  Here is a breakdown of the two arguments, what they license, and how they differ, structured so you can take it back to the dinner table.

  ### 1. Hume: The Monetary Equilibrium Argument
  **The Target:** Mercantilism (specifically the obsession with accumulating gold and silver).
  **The Mechanism:** The Price-Specie-Flow Mechanism.
  **The Core Claim:** A persistent trade surplus is *impossible* to maintain through policy.

  Hume's argument in *Of the Balance of Trade* (1752) is primarily a negative argument. It is designed to dismantle the Mercantilist premise that a nation's wealth consists in its stock of precious metals (specie) and that the state should therefore intervene to ensure exports exceed imports.

  *   **How it works:** Hume relies on the Quantity Theory of Money. If a country runs a trade surplus, gold flows in. As the money supply increases, domestic prices rise (inflation). As domestic prices rise, that country's goods become more expensive to foreigners (exports fall) and foreign goods become cheaper to locals (imports rise). This reverses the trade flow, sending the gold back out.
  *   **The Thought Experiment:** You mentioned his thought experiment about wiping out Britain's money supply. Hume argued that if 4/5 of Britain's money vanished overnight, prices would collapse. British goods would become so cheap that the rest of the world would flock to buy them, flooding Britain with gold until prices rose back to equilibrium. The point was to show that the *real* economy (industry, labor, goods) is what matters, and the money supply will naturally adjust to facilitate it.
  *   **What it licenses:** Hume's argument licenses the claim that **balance-of-payments intervention is futile.** It proves that the market has an automatic stabilizer. It does *not* strictly prove that trade makes both parties richer in terms of goods and services; it proves that you cannot "win" at trade by hoarding cash.
  *   **Role of Money:** Money is central. Without specie flowing across borders and affecting price levels, the mechanism breaks.

  ### 2. Ricardo: The Real Resource Allocation Argument
  **The Target:** Protectionism (specifically the Corn Laws restricting grain imports).
  **The Mechanism:** Comparative Advantage (Opportunity Cost).
  **The Core Claim:** Specialization increases total global output, benefiting all participants.

  Ricardo's argument in *On the Principles of Political Economy and Taxation* (1817) is a positive argument. It explains *why* trade happens and why it is beneficial, regardless of the balance of payments.

  *   **How it works:** Ricardo uses a barter-style model (often illustrated with wine and cloth between England and Portugal). He shows that even if one nation is more efficient at producing *everything* (absolute advantage), it still benefits both nations to specialize in what they are *relatively* most efficient at (comparative advantage) and trade.
  *   **The Result:** By specializing, the total amount of goods produced globally increases. Through trade, both nations can consume a bundle of goods that lies outside their own production possibilities.
  *   **What it licenses:** Ricardo's argument licenses the claim that **trade barriers reduce total welfare.** It argues that protectionism shrinks the size of the economic pie. Unlike Hume, who says "you can't rig the balance," Ricardo says "if you don't trade, you are poorer."
  *   **Role of Money:** Money is irrelevant. Ricardo's model works perfectly in a barter economy. It is about the allocation of real resources (labor, land, capital), not monetary flows. In Ricardian theory, money is a "veil"—it facilitates exchange but does not determine the gains from trade.

  ### 3. Direct Comparison: Answering Your Specific Questions

  **Q: Does Hume's mechanism give reason to think trade is mutually beneficial?**
  **A: Not directly.** Hume's price-specie-flow mechanism is about *equilibrium*, not *efficiency*. It demonstrates that the Mercantilist fear of a trade deficit is irrational because the deficit will correct itself. It implies that trade is natural and self-regulating, but it doesn't mathematically demonstrate that the UK is richer for trading with France. It simply demonstrates that the UK cannot become richer by forcing France to give up its gold. Hume does argue elsewhere (*Of Commerce*) that trade stimulates industry, but the *specie-flow* argument specifically addresses the futility of hoarding money.

  **Q: Does Comparative Advantage depend on Hume's monetary dynamics?**
  **A: No.** This is the critical distinction. Ricardo's argument holds even in a moneyless barter economy. If England trades cloth directly for Portuguese wine, the gains from specialization exist regardless of whether gold is moving, whether prices are rising, or what the money supply is. Hume's argument, conversely, *requires* money. If there is no specie to flow and no price levels to adjust, the price-specie-flow mechanism does not exist.

  **Q: What is the policy difference?**
  **A:**
  *   **Hume tells a Finance Minister:** "Stop trying to manipulate the exchange rate or ban imports to keep gold in the country. It won't work. The money will just flow out again."
  *   **Ricardo tells a Parliament:** "Stop taxing imported grain to protect domestic farmers. By doing so, you are forcing labor into inefficient uses and making food more expensive for everyone, which lowers the national standard of living."

  ### 4. How to Synthesize This for Your Friend

  You can concede the point to your friend while salvaging your own position by framing them as complementary layers of economic truth.

  1.  **Hume clears the ground:** He destroyed the *Mercantilist* error. Before Hume, people thought wealth was money. Hume showed wealth is production, and money is just a tool that self-adjusts. He proved that **trade imbalances are not a crisis.**
  2.  **Ricardo builds the house:** He established the *Liberal* case. Once we accept Hume's view that money isn't the end goal, Ricardo explains what the goal actually is: maximizing real consumption through specialization. He proved that **trade barriers are a loss.**

  **The "Dinner Party" Summary:**
  > "You were right that they are distinct. Hume's argument is monetary and dynamic: it proves that trade imbalances self-correct, so trying to hoard gold via tariffs is futile. Ricardo's argument is real and static: it proves that specialization increases total output, so blocking trade via tariffs makes us poorer. Hume tells us we can't 'win' by running a surplus; Ricardo tells us we 'win' by trading at all. Hume needs money to work; Ricardo works in barter. I was using Hume to say 'tariffs won't fix the deficit,' but you're right that I needed Ricardo to say 'tariffs reduce overall wealth.'"

  This distinction allows you to keep your Hume reference (it is still a devastating critique of tariff-based attempts to manage trade balances) while acknowledging that Ricardo provides the stronger normative case for why free trade is desirable in the first place.
