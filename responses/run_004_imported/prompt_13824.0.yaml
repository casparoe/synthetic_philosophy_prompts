      *   **Sophisticated Substantivalism (The Target):** Manifold exists (substance), but points are not individuated independently of the metric/fields (anti-haecceitism). Diffeomorphic models = same physical reality (Leibniz Equivalence).
      *   **The Goal:** Show that "Sophisticated Substantivalism" is functionally and ontologically indistinguishable from Relationalism (specifically, structural realism or metric relationalism).

  3.  **Brainstorming Arguments for the Collapse:**
      *   *Individuation:* If points aren't individuated by haecceity, what individuates them? The metric field. If the metric field individuates the points, the points depend on the field. Substantivalism requires independence.
