      *   **Point 2: The Manifold as a Mere Mathematical Scaffold.** In numerics, the grid is a tool. Sophisticated substantivalism treats the manifold similarly. If it has no physical individuation, it's not "stuff," it's math.
      *   **Point 3: Haecceitism vs. Structuralism.** By denying haecceity, sophisticated substantivalists embrace structuralism. But structuralism about spacetime *is* a form of relationalism (relations without relata, or relata defined by relations).
      *   **Point 4: Explanatory Idleness.** What work does the "substance" do? None. It doesn't fix indeterminism (Leibniz Equivalence does that). It doesn't aid prediction. It's an ontological ghost.
      *   **Conclusion:** Reiterate that the user's "technical nuisance" view was physically closer to the truth than the metaphysical rescue attempt. The "substance" has been evacuated of content.

