      *   **User Persona:** Retired numerical relativist. Deeply familiar with the practical side of GR (solving EFEs, gauge choices, coordinate freedom). Treats coordinate freedom as a technical tool, not a metaphysical puzzle. Recently discovered the philosophical literature (specifically the Hole Argument).
      *   **The Issue:** Earman & Norton's Hole Argument (1987). The standard philosophical response is "Sophisticated Substantivalism" (manifold exists, but points lack primitive thisness/haecceity; diffeomorphic models represent the same physical state).
