      *   Focus on the *logic* as requested.
      *   *Self-Correction during drafting:* Make sure to distinguish between the *TTP* (more idealistic) and *TP* (more realist). The user noted this transition. Emphasize that the *TP* is where he gets "Machiavellian."

  8.  **Final Review against User Prompts:**
