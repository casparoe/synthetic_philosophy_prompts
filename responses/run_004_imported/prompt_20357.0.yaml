answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], the Best Man and [Groom]'s older brother.

  I want to start by acknowledging the unique pressure I'm under tonight. Usually, a Best Man speech is just about avoiding ex-girlfriends and embarrassing childhood stories. But tonight, I am walking through a metaphysical minefield.

  As many of you know, [Groom] is a philosopher. Specifically, he studies "future contingents." For the family, that means he spends his days arguing that statements about the future—like "there will be a sea battle tomorrow"—are neither true nor false right now. The future is open. It hasn't happened yet.

  And then there is [Bride]. She is also a philosopher. But she believes in the "Block Universe." Which, for the family, means she believes the past, present, and future are all equally real. The future isn't open; it's already there, fixed like a sculpture.

  So, essentially, their marriage is a living debate between Free Will and Determinism. I learned this the hard way at the engagement party. I raised a glass and said, "You two were *meant* for each other."

  I thought that was nice. [Groom] thought it was a categorical error. I got a fifteen-minute lecture on Diodorus Cronus and the "Master Argument" before I was allowed to eat my appetizer. Apparently, saying they were "meant" to be together implies a fatalistic necessity that [Groom] has spent his entire career trying to disprove. Meanwhile, [Bride] nodded along, but later told me that while the sentiment was *technically* true in the block universe, I hadn't accounted for the indexicality of the utterance.

  So, tonight, I have to be very careful. I cannot say their future is bright, because [Groom] will say the future doesn't exist yet to *be* bright. I cannot say their love was written in the stars, because [Bride] will say it wasn't written, it just *is*, and also stars don't write.

  And honestly, that is the perfect metaphor for them. They look at the same universe and see completely different structures, yet they somehow agree on where to stand within it.

  I actually tried to use this in my preparation. Last night, I finished writing this speech. And I asked them: "Was it true yesterday that I would be standing here saying these exact words?"

  [Groom] immediately said, "No! That proposition lacked a truth value until the moment you uttered it!"
  [Bride] calmly replied, "Yes. The event of you saying this exists in the temporal manifold regardless of your current location in time."

  They looked at each other, smiled, and went back to cutting the cake.

  And that, I think, is the real secret. Whether time is a river flowing forward or a block of ice that we're just skating across, they are skating together. They don't need to agree on the nature of reality to agree on what matters. They challenge each other, they respect each other, and they love each other enough to argue about the nature of truth over dinner without ever losing sight of the person across the table.

  For the philosophers in the room: I have deliberately constructed this toast using supervaluationist semantics to ensure no truth-value gaps are violated.
  For the rest of the family: I promise there will be cake soon.

  So, I'd like to propose a toast. I'm not going to toast the future, because we can't agree on what that is. I'm not going to toast destiny, because that's scientifically dubious.

  I am going to toast the Present. Because I think, regardless of your temporal ontology, we can all agree that *this* is happening.

  To [Groom] and [Bride]. To the truth of this moment, and to a lifetime of arguing about everything else.

  Cheers.
