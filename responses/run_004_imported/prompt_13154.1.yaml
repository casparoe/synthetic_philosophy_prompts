answer: |-
  It is completely understandable that this is bugging you. Sharon Street's "Darwinian Dilemma" is one of the most famous and unsettling arguments in contemporary philosophy. It hits a nerve because it threatens to pull the rug out from under the idea that our deepest convictions matter in a cosmic sense.

  However, your friend is skipping a few crucial steps. While Street's argument is powerful, it is not a "checkmate" against moral realism, and more importantly, **rejecting moral realism does not mean you are left with arbitrary chaos.**

  Here is a breakdown of where the philosophy actually stands, and more importantly, how you can make big life decisions without believing in objective moral facts.

  ### 1. Is the Debate "Settled"? (The Metaethics)
  Your friend claims Street's argument proves moral realism is dead. Most philosophers would disagree that it is "settled."

  *   **The Dilemma:** Street argues that since evolution shaped our moral beliefs for *survival*, not *truth*, believing those beliefs align with independent moral facts is a lucky coincidence.
  *   **The Realist Response:** Moral realists have pushed back hard.
      *   **The "Third Factor" Objection:** Philosophers like David Enoch argue that evolution and moral truth might both be tracking a third thing. For example, *survival* is good. Evolution selects for survival; moral truth says survival is good. They align not by coincidence, but because survival is objectively valuable.
      *   **Sensitivity:** Some argue that even if evolution started the process, human reason allows us to correct our intuitions over time (e.g., we evolved to be tribal, but reason tells us racism is wrong).
  *   **Street's Own View:** Interestingly, Sharon Street herself is not a nihilist. She is a **constructivist**. She believes moral truths exist, but they are constructed by our valuing attitudes, not discovered like planets or atoms.

  **Takeaway:** The debate is very much alive. You don't have to concede that realism is "dead."

  ### 2. If Realism *Is* False, Is Everything Arbitrary? (The Normative Ethics)
  This is your real worry: *If there is no cosmic "Right," how do I choose?*

  You are conflating **Metaethics** (what is the status of moral claims?) with **Normative Ethics** (how should I live?). Even if your friend is right and there are no "objective moral facts" floating in the universe, it does not follow that "anything goes" or that decisions are arbitrary.

  Here are three frameworks for making decisions if you accept an anti-realist or constructivist view:

  #### A. The Framework of Well-Being (Secular Humanism)
  Even if "good" isn't a physical property, **suffering and flourishing are real experiences.**
  *   **How it works:** You don't need a cosmic law to know that starvation hurts and health feels good. You can build a moral framework based on minimizing suffering and maximizing the flourishing of sentient beings.
  *   **Decision Application:**
      *   *Voting:* You don't vote because it's "Objectively Right." You vote because Policy A leads to less suffering/more flourishing than Policy B, and you prefer a world with less suffering.
      *   *Kids:* You ask, "Can I provide a flourishing life for a child?" and "Do I want to contribute to the future of humanity?"

  #### B. The Framework of Commitment (Existentialism)
  Existentialists (like Sartre or Camus) agreed that the universe provides no objective meaning. Their solution wasn't despair; it was **radical freedom.**
  *   **How it works:** Meaning isn't *found*; it's *made*. A decision isn't arbitrary just because it isn't pre-ordained. It becomes meaningful because *you* commit to it passionately.
  *   **Decision Application:**
      *   *Kids:* Having a child is an act of creating meaning. It is a project you undertake because you value the continuation of life and love, not because the Universe commanded it.
      *   *Voting:* You align with a vision of society that resonates with your identity and values.

  #### C. The Framework of Rational Consistency (Constructivism)
  This is closer to Street's actual view. Morality is about what values you can hold without contradicting yourself.
  *   **How it works:** If you value your own life, you must logically value the lives of others in similar situations. Morality is a system of coherent valuing.
  *   **Decision Application:**
      *   *Big Decisions:* You test your choices against your other values. "If I choose X, does that contradict my value of Y?" It turns decision-making into a puzzle of integrity rather than obedience to a law.

  ### 3. Why It Doesn't Feel "Arbitrary"
  The fear is that without objective truth, choosing to be kind is the same as choosing to be cruel—it's just "personal taste," like preferring vanilla over chocolate.

  But morality isn't about taste; it's about **consequences and empathy.**
  *   **Taste:** "I don't like broccoli." (No one else is affected).
  *   **Morality:** "I will not steal from you." (Affects your well-being).

  Even if morality is a human invention (like money or language), it is an invention we *need* to function. Money isn't "objectively real" (it's just paper or digits), but you still take it seriously because it governs your ability to live. Morality is the same. It is the operating system for social creatures.

  ### Summary for Your Next Talk (and Your Own Peace of Mind)
  1.  **Tell your friend:** "Street's dilemma is a strong challenge, but realists have counter-arguments (like the Third Factor). It's not a settled fact."
  2.  **For yourself:** You don't need objective moral facts to have a moral life. You need **values.**
  3.  **On Decisions:** When deciding on kids or voting, you aren't looking for a cosmic stamp of approval. You are asking: *What kind of world do I want to live in? What kind of person do I want to be? What actions lead to the most flourishing and the least suffering?*

  The lack of a "God's eye view" doesn't make your choices arbitrary; it makes them **yours.** That is actually more responsibility, not less.
