prompt: |-
  Had a whole argument with my friend last night that's still bugging me. She's way into metaethics and hit me with what she called the "Darwinian Dilemma" (I think it's from a philosopher named Sharon Street?) — the idea that our moral intuitions were shaped by natural selection for fitness, not for tracking any independent moral truth, so either it's a wild coincidence that our morals line up with the truth, or you have to say evolution was somehow tracking moral facts, which is nuts. She said that basically settles it: moral realism's dead, theres no such thing as objective right or wrong. Ok fine, but if literally nothing is actually right or wrong, how am i supposed to make big decisions (having kids, who to vote for, whatever) without it just being arbitrary — is there an actual framework for that, or is it just personal taste at that point?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** The user had an argument with a friend about metaethics.
      *   **Core Issue:** The friend used Sharon Street's "Darwinian Dilemma" to argue against moral realism (the idea that objective moral truths exist). The friend claims this "settles it" in favor of anti-realism/error theory.
      *   **User's Reaction:** The user is intellectually bothered ("still bugging me") and practically concerned. If nothing is objectively right/wrong, how do they make big life decisions (kids, voting) without it being arbitrary or just "personal taste"?
      *   **Goal:** Provide a balanced, informative, and reassuring response that addresses the philosophical argument *and* the practical implications.

  2.  **Deconstruct the Philosophical Argument (Sharon Street's Darwinian Dilemma):**
      *   *What is it?* It's a challenge to moral realism. Evolution shaped our moral beliefs for survival/reproduction, not for truth.
      *   *The Dilemma:*
          1.  Evolution influenced our moral beliefs.
          2.  If realism is true, moral facts are independent of our beliefs.
          3.  Therefore, the link between evolution (survival) and moral truth is coincidental.
          4.  Coincidence is unlikely/skeptical.
          5.  So, either reject realism (anti-realism) or explain the link (which is hard).
      *   *Is it a "settled" argument?* No. Philosophers debate this vigorously. Realists have responses (e.g., the "third factor" objection, robust realism, sensitivity accounts).
      *   *Does it prove "nothing is right or wrong"?* Not necessarily. It challenges *where* morality comes from, not necessarily how we should live.

  3.  **Address the Practical Concern (Normative Ethics vs. Metaethics):**
      *   The user is confusing *metaethics* (what is the status of moral claims?) with *normative ethics* (how should we act?).
      *   Even if moral realism is false (anti-realism), it doesn't mean "anything goes" or "life is meaningless."
      *   *Frameworks for Anti-Realists:*
          *   **Moral Fictionalism:** Act *as if* morals are real because it's useful.
          *   **Constructivism/Expressivism:** Morality is about human agreement, emotions, or rational consistency, not external facts.
          *   **Well-being/Flourishing:** Focus on what makes life better for sentient beings (utilitarianism without the "objective truth" baggage).
          *   **Existentialism:** Create your own meaning.

  4.  **Drafting the Response - Section by Section:**

