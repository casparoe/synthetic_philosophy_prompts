answer: |-
  Here is the case for the dogmatist conclusion, arguing that if you genuinely *know* $p$, you are epistemically licensed to ignore future counter-evidence, and that the defeasibility objection fails to rescue the intuition that we should remain open.

  ### 1. The Factivity Constraint: Truth Trumps Evidence
  The core of the dogmatist argument rests on the **factivity of knowledge**. To say "I know $p$" is not merely to say "I am very confident in $p$." It is to say "$p$ is true, I believe $p$, and I am justified in believing $p$."

  If $p$ is true, then $\neg p$ is false. Consequently, any evidence that supports $\neg p$ is, by definition, supporting a falsehood. Evidence that supports a falsehood is misleading evidence.

  The standard intuition says, "But what if the new evidence is *really strong*?" The dogmatist replies: Strength is irrelevant if you already possess the truth. If you hold a winning lottery ticket in your hand (knowledge), and a newspaper prints a story saying your numbers didn't come up (counter-evidence), the newspaper is wrong. It doesn't matter how authoritative the newspaper looks. If you *know* you hold the winner, the newspaper report is misleading noise. To treat it as live evidence is to treat a known truth as a mere hypothesis. If knowledge is the highest epistemic status, it must be able to override mere evidence. If it can't, it isn't knowledge; it's just high probability.

  ### 2. Knowledge as an "Inquiry Stopper"
  Philosophically, the function of knowledge is to bring inquiry to a close so that action can begin. If you cannot ignore counter-evidence, inquiry never ends.

  Imagine a surgeon who *knows* (based on scans, tests, and expertise) that a specific procedure is required. During the prep, a junior intern says, "I read a blog post that suggests the opposite." If the surgeon adopts the defeasibility stance, she must think, "Oh, now I have counter-evidence. I no longer *know* the procedure is right. I must suspend judgment." This leads to epistemic paralysis.

  For knowledge to be useful for navigation and action, it must provide a stable platform. The dogmatist argues that this stability *requires* the right to disregard apparent counter-evidence. If every new piece of data forced you to downgrade your knowledge to mere belief, you could never act on what you know. Therefore, rationality demands that once the threshold of knowledge is crossed, you are licensed to treat contrary data as error until proven otherwise—not the other way around.

  ### 3. The Failure of the Defeasibility Fix
  The standard fix you mentioned is **defeasibility**: the claim that when counter-evidence arrives, you lose your knowledge, so you weren't licensed to ignore it. This solution fails for two major reasons:

  **A. The Fragility Problem**
  Defeasibility makes knowledge impossibly fragile. It implies that a lie can destroy truth. If I know my car is in the parking lot, and a prankster sends me a fake photo of it being stolen, the defeasibilist says I no longer *know* my car is there. This suggests that my epistemic status is held hostage by the existence of misleading information in the world.
  The dogmatist argues this is backward. My knowledge depends on the *fact* of the car's location and my access to it, not on the absence of liars. If knowledge vanishes the moment a misleading argument is constructed, then "knowledge" is not a state of the knower, but a state of the universe's silence. That is not a useful definition of knowledge.

  **B. The Retroactivity Problem**
  Defeasibility creates a weird temporal paradox. At Time 1, I know $p$. At Time 2, counter-evidence appears. The defeasibilist says, "At Time 1, you didn't know you could ignore Time 2's evidence."
  But at Time 1, the evidence didn't exist. Why should a future event change my epistemic rights in the present? If I truly knew $p$ at Time 1, then at Time 1 I knew that any *future* evidence against $p$ would be misleading. The defeasibility theorist tries to say, "You thought it would be misleading, but you were wrong because you lost knowledge."
  The dogmatist counters: No, I didn't lose knowledge. I retained knowledge *through* the noise. The evidence was misleading then, and it is misleading now. To say I "lost knowledge" is just a verbal trick to save the intuition that we should be open-minded. It conflates *feeling doubtful* with *being unjustified*. I can feel shaken by counter-evidence while still remaining epistemically justified in holding my ground.

  ### 4. Distinguishing Epistemic Right from Psychological Vice
  The reason the dogmatist conclusion feels "wrong" is that we confuse **epistemic rationality** with **psychological virtue**.

  Psychologically, being open-minded is a virtue. We don't like people who refuse to listen. But epistemically, if you possess the truth, refusing to listen to error is not a vice; it is efficiency.
  The dogmatist argues that the paradox reveals a hard truth: **Genuine knowledge *is* dogmatic.** If you aren't dogmatic about $p$, you don't know $p$; you just suspect it.

  Consider mathematical knowledge. If I know $2+2=4$, and a respected mathematician presents a complex proof that $2+2=5$, am I required to lower my confidence? The dogmatist says no. I am rational to assume there is a flaw in the proof I cannot yet see, because I *know* the conclusion is false. To treat the proof as live evidence is to admit I never really knew the math in the first place.

  ### Conclusion
  The defeasibility fix tries to save us from dogmatism by making knowledge weak enough to break under pressure. The dogmatist argues this destroys the value of knowledge. If knowledge is to be distinct from mere justified belief, it must be robust. It must entail the right to treat contrary indications as misleading. Therefore, the paradox is not a problem to be solved, but a feature to be accepted: **To know is to be closed to evidence against the known.** If that makes you a dogmatist, then rationality requires dogmatism wherever knowledge is present.
