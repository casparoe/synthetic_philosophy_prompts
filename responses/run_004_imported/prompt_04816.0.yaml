          *   **Compartmentalized Conditionalization:** A newer approach (Meacham).
      *   *Verdict:* The friend is right that the *machinery* is suspect, but the user is right that they are *antidotes* to each other. The real issue is that we lack a confirmed theory of "indexical probability."

  5.  **Refining the Tone:**

