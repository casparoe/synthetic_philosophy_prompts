      *   It's a very common intuition (money out = bad), but economists generally agree it's flawed.
      *   Key concepts needed to refute this: Balance of Payments (Current Account vs. Capital Account), the nature of money (it's not just gold bars under a mattress), investment flows, and comparative advantage.
      *   The "household analogy" is the specific weak point to attack. A country is not a household.

  3.  **Deconstruct the BIL's Argument:**
