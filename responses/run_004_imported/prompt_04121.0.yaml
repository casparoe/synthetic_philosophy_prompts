  4.  **Identify the Core Economic Mechanisms (The "What he overlooked" part):**
      *   **The Balance of Payments Identity:** Current Account + Capital Account = 0. If we run a trade deficit (Current Account < 0), we must run a capital surplus (Capital Account > 0).
      *   **What happens to the dollars?** Foreigners don't burn them. They use them to buy US assets (stocks, bonds, real estate, factories).
      *   **Wealth vs. Money:** Wealth is productive capacity and goods/services, not just currency units.
