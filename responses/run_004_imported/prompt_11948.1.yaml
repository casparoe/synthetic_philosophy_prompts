prompt: |-
  I'm a classics PhD student and, somewhat randomly, the "person who's actually read the Laws" on my grad Philosophy Society's exec committee. We run an annual Symposium night (discussion plus wine, modeled loosely on the real ancient practice) as our flagship event, and last year it went badly enough that someone ended up in the ER. The committee's now split: half want to cut the alcohol permanently for liability reasons, half keep citing Plato's own argument that supervised drinking under a sober leader legitimately tests and trains self-mastery, so the fix is better supervision, not prohibition. Our charter just requires funded events to have "real intellectual content, not a themed party," undefined beyond that. Can you draft the short memo I'll circulate before next weeks meeting? It should pick one of keep it / cut it / overhaul it, with an actual plan for next year, and it needs to seriously engage whether the Plato defense holds up for what we do, including the parts of his own argument (who's supposed to be drinking, whos supposed to be running it sober) that we conveniently skip, rather than just leaning on liability language.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Classics PhD student, member of Grad Philosophy Society exec committee ("the person who's actually read the *Laws*").
      *   **Context:** Annual Symposium night (discussion + wine) went badly last year (someone ended up in the ER).
      *   **Conflict:** Committee split. Half want to ban alcohol (liability). Half want to keep it (Platonic defense: supervised drinking trains self-mastery).
      *   **Constraint:** Charter requires "real intellectual content, not a themed party."
      *   **Task:** Draft a short memo for next week's meeting.
      *   **Requirements:**
          *   Pick a stance (Keep / Cut / Overhaul).
          *   Provide an actual plan for next year.
          *   Seriously engage the Platonic defense (specifically *Laws*, Book I & II), addressing who drinks, who stays sober, and the purpose of the drinking.
          *   Avoid relying solely on liability language.
          *   Tone: Academic, persuasive, pragmatic, respectful of the tradition but honest about the failure.

  2.  **Determine the Stance:**
      *   *Cut it:* Safe, but ignores the intellectual tradition and the charter's spirit. Boring.
      *   *Keep it (Status Quo):* Dangerous. Last year ended in the ER. Ignoring that is negligent.
      *   *Overhaul it:* The middle path. It respects the Platonic inspiration while acknowledging the modern reality and the specific failure of the previous event. It allows for a "Yes, but..." approach to the *Laws* argument.
      *   *Decision:* **Overhaul.** This allows the user to demonstrate their expertise in the *Laws* (showing *why* the previous attempt failed Platonic standards) while ensuring safety.

  3.  **Engage the Platonic Defense (*Laws* Book I & II):**
      *   *The Argument:* The Athenian Stranger argues that controlled drinking parties (*symposia*) are a tool for education (*paideia*). They test character and train self-mastery (*sophrosyne*).
      *   *The Catch:* It's not a free-for-all.
          *   **The Leader:** There must be a sober "Symposiarch" (ruler of the drinking) who is wise and older.
          *   **The Participants:** Not for the young (who are too hot-blooded). Primarily for older citizens to soften their rigidity.
          *   **The Purpose:** Not intoxication for fun, but a controlled environment to observe behavior and build resilience against pleasure/pain.
          *   **The Content:** Must be accompanied by music, poetry, and serious conversation guided by the leader.
      *   *Application to the Grad Society:* Grad students are "young" (in the Platonic sense of passionate/unsettled). The exec committee needs to act as the sober guardians. The ER incident proves the "training" failed because the "control" was absent.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the gravity of last year's incident. Validate both sides (liability vs. tradition).
      *   **The Platonic Analysis:** This is the core value-add. Show that the "Plato Defense" used by the pro-alcohol side is actually a misreading.
          *   Cite *Laws* 649a-674c.
          *   Highlight the role of the *Symposiarch* (sober leader).
          *   Highlight the age restriction (Plato actually discourages heavy drinking for the young).
          *   Conclusion: Last year wasn't a Platonic Symposium; it was a *komos* (revel) without boundaries.
      *   **The Proposal (Overhaul):**
          *   Keep the wine, but change the structure.
          *   Sober Symposiarch (rotating faculty or senior PhD).
          *   Limited pour (measured, not open bar).
          *   Intellectual structure (prompted discussion, not just chatting).
          *   Safety net (non-alcoholic options, transport).
      *   **Charter Compliance:** Explain how this *better* fulfills "real intellectual content" by making the drinking subservient to the discussion, not the focus.
      *   **Closing:** Call to action/vote.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic but firm.
      *   Avoid sounding condescending about the "misreading" of Plato (even if it is one).
      *   Acknowledge the liability without making it the *only* argument.
      *   Ensure the "ER incident" is treated with gravity, not glossed over.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too long?
      *   *Fix:* Keep it tight. Use bullet points for the plan.
      *   *Critique:* Did I address the liability side?
      *   *Fix:* Yes, by framing the overhaul as risk mitigation through structure, not just prohibition.
      *   *Critique:* Is the Plato stuff accurate?
      *   *Fix:* Double-check *Laws* references. Book I is the main one on drinking as testing. Book II reinforces the educational aspect. The age restriction is crucial (Laws 666a-c).
      *   *Critique:* Does this solve the ER problem?
      *   *Fix:* The plan must include concrete safety measures (drink tickets, food, sober monitors).

  7.  **Final Polish:** Check the voice. It should sound like a Classics PhD talking to Philosopher peers. Use terms like *Symposiarch*, *sophrosyne*, *paideia* correctly but accessibly. (Proceed to generate output).

  8.  **Final check on constraints:** "Short memo." "Pick one." "Actual plan." "Engage Plato." "Not just liability."
      *   *Stance:* Overhaul.
      *   *Plan:* Sober leader, restricted pour, structured topic.
      *   *Plato:* Addressed the misreading regarding age and leadership.
      *   *Liability:* Addressed as a consequence of structure, not the primary driver.

