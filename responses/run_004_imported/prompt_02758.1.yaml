answer: |-
  **Cambridge, Massachusetts. Autumn, 1907.**

  **The study of William James. The room is cluttered with papers, psychological charts, and proof sheets of his new book, *Pragmatism*. Charles Sanders Peirce stands by the fireplace, holding a copy of the book. He looks tired, his famous moustache drooping slightly. James sits in an armchair, looking more vibrant, though his heart trouble is already a whisper in the room.**

  **PEIRCE:** (Tapping the book) Will, you've made a mess of it. A beautiful, eloquent mess.

  **JAMES:** (Smiling) Charlie, always a pleasure. I assume you're referring to the lectures. I thought you'd be pleased. I've taken your maxim—that the meaning of a conception lies in its practical consequences—and I've set it free. I've let it breathe.

  **PEIRCE:** You've let it wander off into the woods and marry a ghost. I read the final lecture. "Pragmatism and Religion." You speak of truth as if it were a kind of credit system. A belief is true if it pays dividends in satisfaction.

  **JAMES:** If it guides us successfully through experience, yes. If it marries old opinion to new fact without a shudder. That is what truth *does*, Charlie. It works.

  **PEIRCE:** It works for whom? Take your example. The belief in personal immortality. You suggest that if a man finds comfort in the thought that he shall see his dead wife again, and that comfort enables him to live a morally strenuous life, then, for him, that belief is true.

  **JAMES:** I suggest that the *truth* of it is in the living of it. The "cash-value." If the hypothesis of a future life unlocks moral energy that the hypothesis of extinction locks away, then the hypothesis has verified itself in the currency of human experience. It is "good" in the way a key is good if it fits the lock.

  **PEIRCE:** But suppose the lock is an illusion! Suppose there is no afterlife. Does the key cease to be a key because it opens a door that isn't there? No, it ceases to be a key because it fails to engage reality. You are conflating the *good* of a belief with the *truth* of a belief.

  **JAMES:** And you are conflating truth with a static copy of a reality that sits somewhere beyond our noses. You want truth to be a photograph of the absolute. I am telling you truth is a process. It *happens* to an idea. It becomes true, is *made* true by events.

  **PEIRCE:** (Pacing) This is subjectivism, Will. It is psychological idealism dressed in workman's clothes. If truth is merely what satisfies the individual inquirer, then two men can hold contradictory beliefs—say, one believes in free will, another in determinism—and if both find their lives enhanced by their view, you must call both true. But they cannot both be true. Reality does not contradict itself.

  **JAMES:** Reality is not a single block, Charlie. It's pluralistic. It's a mosaic. But let's stick to the immortality case. You ask: "Does your account allow a comforting belief to be false?"

  **PEIRCE:** Precisely. If the soul is mortal, is the belief in immortality false? Yes or no?

  **JAMES:** It is false... if it leads us into conflict with other vital truths. If believing in immortality makes me negligent of my duties now, or if it forces me to deny established facts of physiology, then it fails the pragmatic test. It doesn't "work" in the wider web of experience. But if it harmonizes with my moral needs and contradicts no verified fact... why deny me the right to call it true? You demand I wait for a verdict that may never come.

  **PEIRCE:** I demand you wait for the verdict of the Community of Inquirers. Truth is not what satisfies *you*, Will. It is the opinion which is fated to be ultimately agreed to by all who investigate. It is the destination of science.

  **JAMES:** (Leaning forward) And there is the rub. The "Long Run." Your Final Opinion. Charlie, look at me. I am fifty-eight. My heart is a tired pump. You tell me that the truth of my belief in God, or in my wife's survival, depends on a consensus of scientists who will be dust themselves a thousand years from now? That is not a theory of truth. That is a theory of despair. It offers no guidance for the living soul standing on the precipice.

  **PEIRCE:** It offers the only guidance that respects the dignity of the real! If you anchor truth to individual satisfaction, you cut the tether that binds us to the External Permanency. You make the universe plastic to human whim. If a drug makes a man happy believing he is Napoleon, is it true he is Napoleon?

  **JAMES:** Of course not, because that belief clashes with the reactions of the world. The world pushes back. You cannot walk through walls. I am not advocating solipsism. I am advocating that the "push back" includes our emotional and spiritual needs. Those are facts of experience too. You ignore the passional nature of man.

  **PEIRCE:** I ignore nothing. But I distinguish. There is the *feeling* of certainty, and there is the *ground* of certainty. You are selling the feeling. I am concerned with the ground. And because you sell the feeling, you leave the door open for any charlatan to claim truth for his dogma so long as he can make his followers feel good.

  **JAMES:** And because you guard the ground so jealously, you leave the door open for a cold skepticism that paralyzes the will. You say, "Wait for the evidence." But often, Charlie, the evidence only appears *after* we have committed to the belief. Faith in a fact can help create the fact. If I do not believe I can jump this chasm, I shall not jump it, and the belief that I could have jumped it will never be verified. Your "Final Opinion" is a ghost that haunts the future. It has no hands to help me now.

  **PEIRCE:** (Stops pacing, turns to James) My "Final Opinion" is the only thing that prevents truth from collapsing into a multitude of private realities. It ensures that when you and I speak, we are speaking of the same world. If truth is what works for you, and what works for me, and we differ, we have no common ground. We have only a clash of utilities. I renamed my view "Pragmaticism," Will. An ugly name.

  **JAMES:** You told me it was ugly enough to be safe from kidnappers.

  **PEIRCE:** I meant it was ugly enough to keep *you* from claiming it. Because what you have done is kidnap the scientific method and turn it into a theology of convenience.

  **JAMES:** (Stands up, voice softening) And what you have done, Charlie, is take the living pulse of human inquiry and freeze it in a block of ice. You want a truth that is independent of human experience. But where does such a truth live? If no human being can ever experience it, verify it, or live by it, in what sense does it exist?

  **PEIRCE:** It exists as the limit. As the North Pole exists even if no man reaches it. It is the constraint that keeps us honest.

  **JAMES:** But a map is for travelers, not for the North Pole itself.

  **(A silence settles between them. The fire crackles. Peirce places the book on the desk.)**

  **PEIRCE:** We are at an impasse. You ask what my theory cannot deliver. It cannot deliver *salvation*. It cannot tell a grieving father that he will hold his child again. It offers no warmth. It offers only the cold comfort that if there is an answer, the community will find it, eventually. It sacrifices the individual's need for meaning on the altar of logical consistency.

  **JAMES:** And you ask what mine cannot deliver.

  **PEIRCE:** It cannot deliver *reality*. Not reality as it is in itself, independent of whether it suits us. Your truth is always truth *for* someone. It is always tethered to a human face. If the human race vanished, Will, would your truths remain?

  **JAMES:** (Pauses, considering) If the human race vanished, there would be no one to *mean* anything. Truth is a relation between a thinker and a world. No thinker, no truth.

  **PEIRCE:** Then you admit it. You make truth dependent on the mind.

  **JAMES:** I make it dependent on *experience*. You want a truth that survives the extinction of experience. I say that is a meaningless abstraction. But I grant you this, Charlie: I cannot guarantee that my comforting beliefs correspond to the hard, stubborn structure of the universe outside my skin. I can only guarantee they correspond to the demands of my life within it.

  **PEIRCE:** And I grant you this, Will: I cannot guarantee that my Final Opinion will comfort a single soul in their hour of darkness. I can only guarantee that it will not lie to them.

  **JAMES:** So. You offer a truth without life.

  **PEIRCE:** And you offer a life without truth.

  **(Peirce picks up his hat. James does not move to stop him.)**

  **PEIRCE:** I shall keep my "Pragmaticism." It is ugly, but it is mine.

  **JAMES:** And I shall keep my "Pragmatism." It is dangerous, but it is human.

  **(Peirce nods, once, sharply. He exits. James remains by the fire, looking at the book, then out the window into the gathering dusk.)**

  **[END]**
