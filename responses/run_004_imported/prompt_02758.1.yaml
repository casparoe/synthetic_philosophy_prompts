      *   **Core Conflict:** Peirce's scientific/communal conception of truth (long-run convergence of inquiry) vs. James's individualistic/existential conception of truth (what works/satisfies in a life).
      *   **Specific Focus:** James's willingness to validate religious/existential beliefs (free will, moral order, afterlife) based on their "cash value" in experience, versus Peirce's concern that this makes truth subjective and untethered from reality.
      *   **Format:** A dramatized dialogue between Peirce and James.
      *   **Constraints:**
          *   Do not simply summarize the dispute.
          *   Focus on one concrete case (e.g., belief in immortality or free will).
          *   James must defend against the charge of wishful thinking.
          *   Peirce must defend against the charge that his view is too remote/useless for the present.
          *   Neither should "win."
