answer: |-
  Your intuition is spot on. Your friend identified a bug in Total Utilitarianism, installed a patch (Average Utilitarianism), but the patch crashes the operating system in a different, often more disturbing way.

  In philosophy, this is a well-known deadlock. Average Utilitarianism does indeed avoid the Repugnant Conclusion, but almost every population ethicist rejects it because it leads to conclusions that are arguably *more* repugnant than Parfit's original problem.

  Here is the breakdown of why Average Utilitarianism is not the "easy fix" your friend thinks it is.

  ### 1. The "Extermination" Objection
  This is the most famous and visceral problem with Average Utilitarianism.

  Under Total Utilitarianism, adding a happy person is always good (it adds to the sum). Under Average Utilitarianism, adding a happy person is only good if they are *happier than the current average*.

  Conversely, this implies that **removing an unhappy person raises the average.**

  Imagine a world with 100 people. 99 of them are ecstatic (10/10 happiness), and 1 person is suffering mildly (2/10 happiness).
  *   **Total View:** Keep everyone. The suffering person still has a net positive contribution to the total sum of happiness.
  *   **Average View:** The average is roughly 9.98. If that one suffering person ceases to exist, the average becomes a perfect 10.

  Average Utilitarianism implies that the world is *better* if the unhappy person never existed—or, in a darker implication, that it is morally permissible (or even required) to kill existing unhappy people to raise the average well-being of the group. Most people find the idea that murder can be a method of increasing utility to be a dealbreaker.

  ### 2. The "Happy but Below Average" Problem
  Average Utilitarianism implies that we should prevent happy people from coming into existence if they aren't happy *enough*.

  Imagine a future society where everyone is living a utopian life (100/100 happiness).
  *   **Total View:** If we can create more people who live at 90/100 happiness, we should. Their lives are still wonderful, and they add to the total good.
  *   **Average View:** Creating these people is **morally wrong**. Because 90 is lower than the current average of 100, adding them dilutes the average.

  This leads to the conclusion that it is better to have a tiny population of gods than a massive population of very happy humans. It suggests that once we reach a certain threshold of happiness, procreation becomes immoral unless we can guarantee our children will be happier than we are.

  ### 3. The "Small Elite" Bias
  Average Utilitarianism has a strong bias toward small populations.

  Consider two worlds:
  *   **World A:** 1 person living a life of perfect bliss.
  *   **World B:** 10 billion people living lives that are *almost* perfect bliss (just 1% less happy).

  Total Utilitarianism says World B is vastly better (billions of happy lives vs. one).
  Average Utilitarianism says World A is better (because the single person has a slightly higher average score).

  This contradicts most people's moral intuition that a world with 10 billion happy people is better than a world with one happy person, even if that one person is marginally happier.

  ### 4. It Doesn't Actually Solve the "Mere Addition" Paradox
  Parfit didn't just attack Total Utilitarianism; he attacked the whole framework. He showed that moving from Total to Average doesn't escape the logical traps; it just moves them.

  This is often illustrated by the **"Mere Addition Paradox."**
  1.  Start with Population A (very happy).
  2.  Add Population A+ (the same people, plus some new people who are happy, but slightly less happy than the original group).
  3.  Total Utilitarianism says A+ is better (more total good).
  4.  Average Utilitarianism says A is better (higher average).

  But if you keep adding people to A+ until they outnumber the original group, the Average View eventually has to admit that a massive population of "slightly less happy" people is better than the original small group (because the average stabilizes). This can lead you right back toward a version of the Repugnant Conclusion, or into a cycle of intransitive preferences (where A > B, B > C, but C > A).

  ### The Philosophical Consensus
  Your friend is right that the Repugnant Conclusion is a major bullet to bite for Total Utilitarians. But switching to Average Utilitarianism is generally considered "biting a bigger bullet."

  Because both views fail, modern population ethics has branched into other theories, none of which are perfect:
  *   **Critical-Level Utilitarianism:** Only lives *above* a certain threshold of quality count toward the total. (Avoids the Repugnant Conclusion, but arbitrarily sets a "cutoff" for a life worth living).
  *   **Person-Affecting Views:** We only have obligations to people who will actually exist. (Avoids the conclusion, but implies it's not wrong to destroy the potential for a billion happy people if no specific individual is harmed).
  *   **Variable Value Views:** The value of adding a person diminishes as the population grows.

  ### Summary for Your Argument
  You can tell your friend: **"You traded the Repugnant Conclusion for the Sadistic Conclusion."**

  Average Utilitarianism solves the problem of "too many mediocre lives," but it creates the problem of "killing the unhappy" and "forbidding happy births." It doesn't get us out of the woods; it just leads us to a different cliff edge. Your intuition that it was "too easy" was correct because population ethics is widely considered one of the hardest, perhaps unsolvable, problems in moral philosophy.

  Parfit himself spent hundreds of pages on this in *Reasons and Persons* and concluded Part IV by saying he was leaving the problem unsolved. If he couldn't crack it, switching from Total to Average isn't going to do the trick.
