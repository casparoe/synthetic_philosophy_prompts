answer: |-
  This is an exceptionally sharp reading of Smith, and you are absolutely right to flag that nuance. Most introductory econ courses flatten Smith into a caricature of laissez-faire absolutism, but anyone who actually slogs through Book IV (and Book V) realizes he was a pragmatist who judged institutions by their utility to the *whole* society, not just the mercantile class.

  You have correctly identified the tension: Smith accepts temporary monopolies as a necessary evil to incentivize risk (whether opening trade routes to "barbarous nations" or inventing a new machine), but he becomes apoplectic when those temporary privileges become permanent, entrenched powers that subordinate the public good to private profit.

  If we apply Smith's specific reasoning from the *Wealth of Nations* to the modern TRIPS/WTO pharmaceutical regime, I believe he would view it as a classic case of the "curdling" he warned against. He would likely argue that while the *principle* of the patent holds, the *global enforcement regime* has mutated into the exact kind of mercantile oppression he attacked in the East India Company.

  Here is how Smith would likely reason through it, based on his specific arguments in Book IV and V.

  ### 1. The Legitimacy of the Reward (The "Yes, but..." Phase)
  Smith explicitly defends patents and copyrights in Book V (Ch. 1, Part III) as "just and reasonable." His logic is identical to the colonial charters: if a man spends a fortune and risks ruin to create something useful (a machine, a book, a drug), the state owes him a temporary exclusive privilege to recoup that cost. Without it, the "risk and expense" would not be undertaken.

  So, Smith would not argue for the abolition of pharmaceutical patents *in principle*. He would agree that developing a new molecule is akin to "opening a new trade route to a remote nation"—it requires capital, risk, and ingenuity that deserve a temporary reward.

  ### 2. The Transition from Incentive to Oppression
  However, Smith's critique of the colonial monopolies hinges on what happens *after* the risk is paid off. He argues that these companies refuse to let go of the privilege. They turn a temporary tool for development into a permanent tool for extraction.

  Smith would likely look at the modern patent regime and see three specific failures that mirror his critique of the East India Company:

  **A. Merchants as Sovereigns (The TRIPS Problem)**
  Smith's most damning critique of the East India Company is that they ceased to be merchants and became sovereigns. He writes in Book V that "a company of merchants are, it seems, incapable of considering themselves as sovereigns, even after they have become such." He argues that merchants prioritize profit over justice, making them the worst possible rulers.

  In the TRIPS agreement (Trade-Related Aspects of Intellectual Property Rights), Smith would see merchants effectively acting as sovereigns. Through intense lobbying by pharmaceutical corporations in the US and EU, trade law was rewritten to force developing nations to adopt patent standards that suited Western capital, often against the welfare of their own populations. To Smith, this is the "nation of shopkeepers" line in action: foreign policy and trade law are being dictated not by statesmen concerned with justice or the public good, but by merchants concerned with margin. When a trade agreement prevents a country from saving its citizens from a plague to protect a profit margin, the merchant has usurped the sovereign.

  **B. The Cost to the Public vs. Private Gain**
  In Book IV, Smith calculates the ledger of the colonial monopoly: the merchants gain a higher rate of profit, but the public pays for the navy, the army, and the administration of the colonies. He concludes the nation *loses* money overall.

  Smith would apply this same cost-benefit analysis to pharmaceutical patents. He would ask: Does the public gain more from the innovation than it loses in access and cost?
  *   **The Cost:** In the AIDS crisis and the vaccine rollout, the "cost" was measured in human life in developing nations due to lack of access. Smith was a moral philosopher before he was an economist; he cared deeply about the "annual produce of the land and labour" being available to the people. If a monopoly prevents the labouring poor from accessing the means of survival (medicine), it violates the purpose of the economy.
  *   **The Public Subsidy:** Smith would also note that much pharmaceutical R&D is publicly funded (via NIH, universities, etc.). If the public pays for the risk *and* pays the monopoly price, while the merchant keeps the profit, Smith would call this exactly what he called the colonial system: a scheme where "the public pays for the defence and protection, while the merchants pocket the gain."

  **C. The "Remote and Barbarous" Dynamic**
  Smith uses the phrase "remote and barbarous nation" to describe the targets of colonial trade. He acknowledges the power imbalance. He argues that the monopoly hurts the colony (the weaker party) to benefit the metropole (the stronger party).

  The TRIPS regime effectively institutionalizes this. Wealthy nations (the metropole) pressure developing nations (the colonies, in economic structure if not political name) to enforce patents that keep prices high. Smith argued that Britain was morally and economically wrong to sacrifice the interests of the colonies for British merchants. He would likely argue that the Global North is wrong to sacrifice the health of the Global South for the profit of Pharma. He viewed the subordination of one country's welfare to another's as a violation of natural liberty and justice.

  ### 3. The Verdict: "Evergreening" and Permanent Monopoly
  Smith's tolerance for monopolies was strictly conditional on them being **temporary**. He supported them only as long as was necessary to encourage the venture.

  He would likely be horrified by modern patent practices like "evergreening" (making minor tweaks to extend patent life) or the pressure to prevent generic competition indefinitely. To Smith, once the risk is rewarded, the monopoly must end. If the legal framework is manipulated to make the privilege effectively permanent, it ceases to be an incentive for innovation and becomes a "tax on the people" for the benefit of a "particular order of men."

  ### Summary of Smith's Likely Position
  Smith would not say "abolish all patents." He would say:

  1.  **The Principle is Sound:** Risk deserves reward.
  2.  **The Execution is Corrupt:** When the reward becomes permanent, or when it is enforced by coercing weaker nations, it violates justice.
  3.  **The Sovereign Must Rule:** The state must prioritize the health and welfare of its people (and other people) over the profits of merchants. If a trade agreement prevents a government from protecting its people from disease, that agreement is illegitimate.
  4.  **The "Shopkeeper" Warning:** He would view the WTO/TRIPS framework as the ultimate realization of his warning about a "nation of shopkeepers." It is a global system where the rules of trade are written by the traders, not by the statesmen, resulting in a system that is efficient for capital but disastrous for humanity.

  Your professor's throwaway line is the key to the whole thing. Smith viewed patents and charters as the same tool. Since he concluded the charters became a disaster for humanity, he would logically conclude that patents *become* a disaster when they are treated the same way: as absolute property rights rather than temporary, conditional privileges granted for the public good.

  He would likely argue that in the case of life-saving medicine, the "public good" condition of the patent has been violated, and therefore the monopoly protection should be voided. That isn't modern socialism; that is classical Smithian political economy.
