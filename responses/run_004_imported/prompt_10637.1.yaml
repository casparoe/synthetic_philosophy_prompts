answer: |-
  This is a fantastic passage to get stuck on, and your skepticism about your friend's "Inverted Kant" reading is well-founded. While the surface symmetry (Kant privileges duty over inclination; Eliot seems to privilege direct feeling over external principle) is tempting, it collapses under the weight of Eliot's specific moral psychology and her Feuerbachian inheritance.

  You are right to flag the word "accessory." That is the hinge of the argument. Here is a breakdown of the inferential steps in this passage, addressing both the Kantian comparison and the Feuerbachian "God" problem, with an eye toward how this scaffolds the ethics of the later novels.

  ### 1. The Argument from Moral Psychology (vs. The Kantian Reading)

  Your friend's reading relies on a categorical mapping: Kant's "Duty" = Eliot's "Glory of God/Principle," and Kant's "Inclination" = Eliot's "Human Sympathy." The problem is that Kant and Eliot are answering different questions.

  *   **Kant (*Groundwork*):** Asks, "What gives an action *moral worth* independent of empirical contingency?" He needs a motive that is universal and necessary. Inclination is contingent (I might feel pity today and not tomorrow); Duty is necessary.
  *   **Eliot (Westminster Essays):** Asks, "What produces *effective and authentic* moral behavior in a social organism?" She is operating as a psychological determinist and a sociologist, not a metaphysician of morals.

  **The Inferential Steps in the Passage:**

  1.  **Definition of the "Direct Motive":** Benevolence is defined phenomenologically. It is *only* benevolence if the psychological cause is the immediate perception of the object's need ("directly and inevitably called into activity by their proper objects").
  2.  **The Diagnosis of "Accessory Motives":** Eliot does not claim accessory motives (like obedience, vanity, or the desire for God's glory) make an action *evil*. She claims they are **compensatory**.
      *   *Inference:* "Accessory motives... presuppose the weakness of the direct motive."
      *   *Meaning:* You only need the crutch of "God commands this" if your leg of "I see you suffering" is broken. If the direct sympathy is robust, it crowds out the need for external validation.
  3.  **The Critique of Cumming:** Cumming demands the "Glory of God" be the *absorbing* aim.
      *   *Inference:* If you make the accessory motive (God's glory) the *primary* aim, you actively suppress the direct motive (sympathy).
      *   *Metaphor:* You divert the stream (sympathy) to feed an artificial canal (theology). The water (moral energy) is the same, but the channel is unnatural, leading to stagnation or misdirection (e.g., helping someone only to save their soul, not to relieve their pain).

  **Why the "Inverted Kant" label fails:**
  Kant wants to purify the will of empirical contamination. Eliot wants to purify the action of *theoretical mediation*. For Eliot, the "principle" isn't a higher form of rationality; it's a psychological barrier. She isn't arguing for "Inclination" in the hedonistic sense; she is arguing for **unmediated Sympathy**. This is closer to Shaftesbury or Hume's moral sense theory than to Kant, but updated with 19th-century associationist psychology.

  ### 2. The Feuerbachian "God" Clause

  This is where your second worry comes in: *Doesn't keeping "the idea of God" just relocate the problem?* If we still need to contemplate God to certify our feelings, aren't we still using an external idea?

  You are correct that this is pure Feuerbach (*The Essence of Christianity*, which Eliot translated in 1854). But Eliot makes a specific modification here that saves her from the contradiction you've identified.

  **The Inferential Steps on God:**

  1.  **The Condition of Utility:** "The idea of God is really moral in its influence... **only when**..."
      *   Eliot strips God of ontological independence. God is not moral *in se*; God is moral only insofar as the *concept* functions to enhance human relations.
  2.  **The Redefinition of Attributes:** God must be contemplated as "possessing infinitely all those attributes which we recognize to be moral in humanity."
      *   *Feuerbachian Move:* This reverses the traditional flow. Traditionally: God is Good $\rightarrow$ Humans imitate God. Eliot: Humans are Good $\rightarrow$ God is the projection of that Goodness infinitely expanded.
  3.  **The Function of Contemplation:** Why keep the idea at all if it's a projection?
      *   *Inference:* Contemplating this "Infinite Sympathy" acts as a **feedback loop**. It doesn't certify the feeling from the outside; it amplifies the feeling from the inside.
      *   *Mechanism:* When I feel pity, and I contemplate a God who *is* Pity (infinitely), I am not looking up to an authority; I am looking into a mirror that magnifies my own capacity. It validates the *human* feeling by giving it cosmic weight, without subordinating the feeling to an external command.

  **Addressing your "Relocation" Worry:**
  You ask if this uses "something not directly felt to certify which feelings count as moral."
  *   **Cumming's Model:** External Certification. (Is this act good? Yes, if God commands it.)
  *   **Eliot's Model:** Internal Amplification. (Is this act good? Yes, if it springs from sympathy. Does thinking of God help? Only if thinking of God makes me feel *more* sympathy.)

  If the idea of God ceases to amplify sympathy, it ceases to be moral. Therefore, the ground of morality remains **human sympathy**, not the divine idea. The divine idea is merely a tool (a "poetic" tool, as she might say later) to intensify the human ground. It does not relocate the problem because it refuses to let the "idea" stand as the *judge*. The "pure elements of human feeling" remain the judge.

  ### 3. Implications for the Dissertation (Fiction Connection)

  Since you are moving into the novels, this journalistic argument is the blueprint for the ethical crises in *Adam Bede*, *The Mill on the Floss*, and *Middlemarch*.

  *   **The "Accessory Motive" in Fiction:** Think of Mr. Stelling or Mr. Casaubon. They act from "duty" or "principle" (accessory motives) because their direct sympathy is weak. Eliot treats them as morally stunted, not necessarily evil, but ineffective.
  *   **The "Direct Motive" in Fiction:** Think of Dorothea or Maggie Tulliver. Their struggle is often that their direct sympathy is *too* strong for the social/religious structures (the "artificial canals") available to them.
  *   **The "God" Concept:** In *Middlemarch*, the "God" concept has largely vanished, replaced by the "growing good of the world." This essay shows the transition phase. She is trying to salvage the *emotional power* of religious language while gutting the *theological authority*.

  ### Summary for your Argument

  If you are incorporating this into the dissertation, you might frame it this way:

  Eliot is not proposing an **Inverted Kantianism** (privileging inclination over duty), but rather a **Moral Realism** (privileging psychological immediacy over theological mediation). The "accessory motive" is not a rational principle, but a psychological prosthetic.

  Furthermore, her retention of the "idea of God" is not a theological compromise but an **anthropological instrumentalism**. God is kept only as a mechanism to intensify human sympathy ("cherishes all that is best... in man"). This avoids the "external certification" trap because the *criteria* for the idea's validity is its ability to resonate with pre-existing human feeling, not its ability to command it.

  This passage is essentially Eliot clearing the ground: she is arguing that Victorian Evangelicalism isn't just theologically wrong; it is **psychologically counter-productive** to the very morality it claims to uphold. It weakens the muscle of sympathy by forcing it to lift weights (doctrinal obedience) it wasn't designed for.

  Does that help untangle the specific inferential knots? It sounds like you have a very strong handle on the material already; the friend's Kant reading is a common trap because the vocabulary overlaps, but the underlying machinery is distinct.
