      *   *Addressing the "Leverage Penalty":* The prompt mentions Bostrom's leverage penalty. I should incorporate that logic into the policy without necessarily endorsing the specific philosophical mechanism. The policy should reflect that *claims of unique leverage require unique evidence.*
      *   *Addressing the "Pascal's Mugging":* Acknowledge that rejecting EV maximization in the limit is technically a deviation from pure utilitarianism, but argue that *institutional decision-making* requires different norms than individual moral calculus.

