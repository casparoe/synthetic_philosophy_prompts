          *   *Anti-Funding Argument:* Leverage penalty, "lottery ticket" intuition, fear of exploitation/squeamishness masked as rigor.
      *   **Committee Dynamics:** 2 want to fund (EV maximizers), 3 want to decline (various reasons). I need to draft the memo they will vote on.
      *   **Requirements:**
          *   Recommend a specific disposition (Fund, Partial, Decline, Defer).
