answer: |-
  **MEMORANDUM**

  **TO:** Discretionary Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposal 23-X (Engineered Pathogen Surveillance) and Adoption of High-Impact Decision Framework

  ### 1. Executive Summary

  This memo recommends that the committee **decline** Proposal 23-X, submitted by the Pathogen Surveillance Initiative (PSI), which requests 80% of our annual discretionary budget to develop a wastewater-surveillance protocol for engineered pathogens.

  While the proposal presents a mathematically sound Expected Value (EV) calculation, the epistemic foundation of that calculation is insufficient to justify allocating the majority of our capital to a single, low-probability intervention. However, recognizing the validity of the underlying ethical tension, this memo also proposes the adoption of a new **Epistemic Scaling Policy**. This framework will guide future decisions on "low-probability, high-impact" grants, ensuring we remain open to transformative opportunities without exposing the fund to exploitation or arbitrary decision-making.

  ### 2. Proposal Overview

  The PSI team proposes a surveillance network designed to detect specific classes of engineered pathogens prior to wide-scale release.
  *   **Cost:** 80% of current year discretionary budget.
  *   **Claimed Impact:** Prevention of technological civilization collapse (existential risk mitigation).
  *   **Probability Estimate:** The applicants estimate a 1-in-5,000,000 annual chance that this specific protocol is the *decisive* factor in averting catastrophe.
  *   **EV Calculation:** Our technical reviewer confirms that if one accepts the probability estimate and the valuation of "civilization collapse," the Expected Value of this grant exceeds the combined EV of all other current applications (bed nets, cash transfers, etc.) by several orders of magnitude.

  ### 3. The Core Tension: Consistency vs. Robustness

  The division on this committee reflects a fundamental philosophical challenge in effective philanthropy, often referred to as "Pascal's Mugging." We must weigh two competing imperatives: the duty to follow the math of expected good, and the duty to maintain robust, defensible decision procedures.

  #### A. The Argument for Funding (The Consistency Imperative)
  The strongest argument in favor of this proposal is not that the risk is certain, but that *consistency demands we act on it.*

  Proponents argue that our mission is to maximize good, not to maximize *certainty* of good. If we accept that the loss of technological civilization is an outcome of negative infinite or near-infinite value, then even a microscopic reduction in that risk outweighs finite, certain benefits (like saving a specific number of lives via bed nets).

  To reject this proposal because the numbers feel "uncomfortable" or "too large" is, by this logic, a failure of moral nerve. It suggests we are dressing up intuition as rigor. If we claim to be data-driven, we cannot discard data simply because it points toward counter-intuitive conclusions. To do so is to privilege the visible (lives saved today) over the invisible (lives saved in perpetuity), which is a form of temporal bias. If the arithmetic holds, refusing to fund the highest-EV option is effectively choosing to let more people die, statistically speaking, in exchange for the psychological comfort of conventional metrics.

  #### B. The Argument for Declining (The Robustness Imperative)
  The argument for declining rests on the fragility of the inputs, not the logic of the calculation.

  Opponents argue that a decision procedure that can be swayed by any claim where $Probability \times Payoff > Cost$ is vulnerable to exploitation. In the absence of empirical frequencies for "civilization collapse," probability estimates in the range of 1-in-millions are subjective guesses, not data. They are noise. If we allow subjective guesses about astronomical stakes to override empirical data about concrete stakes, we cease to be a philanthropic fund and become a lottery ticket vendor.

  Furthermore, there is the issue of *comparative advantage*. We are a small fund. Even if the risk is real, is it plausible that *our* specific grant is the lever that moves the needle? Claims of unique leverage over global outcomes often suffer from the "center of the universe" bias. A policy of funding the highest claimed EV regardless of evidence quality invites bad-faith actors and delusional projects to consume our resources, leaving us unable to fulfill our committed, high-confidence obligations.

  ### 4. Recommendation and Rationale

  **Recommendation:** **Decline.**

  **Rationale:**
  We decline Proposal 23-X not because the potential impact is unimportant, but because the **epistemic burden has not been met.**

  1.  **Fragility of Probability Estimates:** A probability estimate of 1-in-5,000,000 for a specific intervention's decisiveness cannot be empirically verified. It is a theoretical model. When the probability estimate is this small, minor errors in estimation swamp the calculation. If the true probability is 1-in-50,000,000, the EV drops by an order of magnitude. We cannot allocate 80% of our budget on a variable this fragile.
  2.  **Institutional Risk:** Allocating 80% of our discretionary budget to a single binary outcome threatens the operational viability of the fund. If the intervention fails (which is statistically probable), we have sacrificed a year of certain, measurable good for a gamble that did not pay out.
  3.  **Mission Fit:** Our fund's comparative advantage lies in implementing proven global health interventions. We are not structured to evaluate existential risk models. Funding this would require us to operate outside our zone of competence.

  ### 5. Proposed Policy: The Epistemic Scaling Framework

  To resolve the disagreement that arose during this review and to guide future committees, I propose we adopt the **Epistemic Scaling Framework**. This policy acknowledges the validity of Expected Value reasoning while placing constraints on the *quality of evidence* required as the stakes rise.

  **The Criterion:**
  *For any proposal where the claimed impact exceeds a threshold of [e.g., 10,000 DALYs or equivalent civilizational impact], the burden of proof for the probability estimate scales non-linearly with the magnitude of the claim.*

  **Operational Guidelines:**
  1.  **Empirical Grounding:** Probability estimates for tail-risk events cannot be based solely on theoretical modeling or researcher intuition. They must be anchored in empirical frequencies, historical analogs, or formal expert elicitation processes with defined confidence intervals.
  2.  **The Leverage Check:** Claims that a specific grant will be the *decisive* factor in a global outcome must explain why this fund, specifically, is the bottleneck. Absent a clear theory of change linking *our* dollars to the *specific* avoidance of the catastrophe, a "Leverage Penalty" will be applied, discounting the claimed probability.
  3.  **Robustness over Maximization:** In cases where probability estimates are highly uncertain (order-of-magnitude ambiguity), the committee will prioritize interventions with **robust positive value** (good even if the catastrophic risk doesn't materialize) over interventions with value contingent entirely on the tail risk.
      *   *Application to Proposal 23-X:* Had the wastewater protocol demonstrated significant public health value *independent* of the x-risk mitigation (e.g., detecting natural outbreaks), it might have qualified for partial funding. As the value is contingent entirely on the 1-in-5,000,000 event, it fails the robustness test.

  ### 6. Conclusion

  We must acknowledge that the proponents of Proposal 23-X are raising a vital point: conventional philanthropy often ignores low-probability, high-severity risks due to cognitive bias. We should not dismiss their work as "lottery tickets" without engaging with the math.

  However, rationality requires more than just following a formula; it requires ensuring the inputs to that formula are sound. By adopting the Epistemic Scaling Framework, we commit to taking high-impact claims seriously without surrendering our decision-making to unverified assertions. We preserve our ability to do certain good today while remaining open to transformative good tomorrow, provided the evidence is robust enough to warrant the bet.

  I move that we decline Proposal 23-X and adopt the Epistemic Scaling Framework for the upcoming fiscal cycle.
