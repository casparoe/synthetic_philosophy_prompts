answer: |-
  The rain at the Sector 4 border didn't wash things clean; it just made the rust slicker. Elias shivered, pressing his back against the concrete barrier, clutching his side. The blood was warm, but his fingers were numb. Across the three meters of no-man's-land, Mara watched him through the scope of a rifle she wasn't pointing at him yet.

  She had the cutters. She had the path through the minefield. Elias had the drive containing the evidence that could topple the Directorate, and a promise.

  "The deal stands," Elias called out, his voice cracking. "I get across, I upload the evidence to the International Court. Once I'm safe, I send the medical supply codes for your sister."

  Mara didn't lower the rifle. "Once you're in the Free Zone, you're a hero. Protected. Witness protection. If you send those codes back into the Directorate network, you light a flare on your own location. They'll trace the packet. They'll find you."

  "I'll risk it."

  "No," Mara said. "You won't. You're a rational actor, Elias. I've read your profile. You're an actuary. You weigh costs. Right now, sending the codes costs you your safety. Keeping them costs me my sister. A rational man keeps the codes."

  "I'm not going to let her die."

  "Everyone says that until the math changes." Mara stepped out from the shadows, the cutters in her left hand, the rifle steady in her right. "Here's the problem. I can only help you if I know you'll pay the debt *after* the help is rendered. But the help removes the leverage. Once I cut that wire, you're gone. If you're smart, you ghost me. If you're smart, you live."

  She took a step closer. The rain hammered the silence between them.

  "I need you to be stupid, Elias. I need you to be the kind of person who burns themselves just to keep a promise made in the rain. But I'm looking at you, and I see your eyes moving. You're calculating. You're thinking about how you can convince me now, then vanish later."

  Elias felt the cold seep into his bones. She was right. The logic was flawless. Once he was safe, sending the codes was suicide. Why would he do it? Only a fool would prioritize a smuggler's sister over his own life once the immediate threat was gone. But only a fool would get saved.

  He tried to speak, to argue his integrity, but he felt the calculation humming in his chest. *Lie now, survive now, worry later.*

  Mara's finger tightened on the trigger. "I see it. You're weighing the odds. You're trying to optimize the outcome. That means you'll defect. And that means you die here."

  Elias closed his eyes. He had to stop. He had to kill the actuary inside him. He had to accept that sending those codes might kill him, and decide he didn't care. He had to make the future cost irrelevant to the current commitment. He stopped thinking about survival. He stopped thinking about the Directorate. He thought only of the debt.

  "I'm not optimizing," Elias said, and he wasn't lying anymore because he wasn't thinking about the consequence. "I'm just paying."

  He opened his hands. He wasn't guarding the drive. He wasn't guarding himself. He was just standing there, vulnerable, committed to a future action that offered him no benefit.

  Mara watched him for a long ten seconds. The tension in her shoulders dropped. She saw the absence of the calculation. He wasn't convincing her; he had convinced himself to be irrational.

  She stepped forward and snipped the wire.

  "Go," she said. "Don't make me regret the math."

  ***

  The "Hitchhiker" beat happens when Elias stops calculating the future risk of sending the codes and genuinely commits to the action despite the lack of self-interest, which Mara detects as the absence of strategic hesitation, allowing her to trust him enough to cut the wire.
