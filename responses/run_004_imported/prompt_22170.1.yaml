answer: |-
  It is a pleasure to speak with a colleague who has spent a lifetime in the trenches of physics and has now turned to the foundations with the leisure and depth they deserve. You are quite right: the standard graduate pedagogy often treats "Locality" in Bell's theorem as a monolithic block, something to be checked off and discarded. Maudlin, however, insists we look under the hood.

  The decomposition you are referring to, originally by Jon Jarrett (1984) and popularized philosophically by Abner Shimony (1984), splits Bell's single "Locality" condition (often called Factorizability) into two distinct conceptual commitments. Understanding this split is crucial for diagnosing *how* different interpretations of quantum mechanics fail to be Bell-local, and what price they pay for it.

  Here is the conceptual breakdown without the algebra.

  ### 1. The Two Halves: Control vs. Correlation

  Bell's condition essentially demands that once you have specified the complete physical state of the common past (the hidden variable $\lambda$), the events at the two wings of the experiment should be statistically independent. Jarrett and Shimony showed this independence relies on two separate assumptions.

  **Parameter Independence (PI)**
  *   **The Concept:** This is a condition about **control** and **external influence**. It asserts that the probability of an outcome at one wing (say, Alice's) should not depend on the *setting* of the apparatus at the distant wing (Bob's), given $\lambda$.
  *   **What it forbids:** It forbids the distant experimenter's choice of measurement context from causally influencing your local result. If PI holds, Bob cannot "wiggle" his magnet orientation to change the statistics of Alice's clicks (for a fixed $\lambda$).
  *   **Intuition:** This captures the spirit of "no action-at-a-distance" regarding the *setup* of the experiment. It says the local physics is screened off from the distant settings.

  **Outcome Independence (OI)**
  *   **The Concept:** This is a condition about **correlation** and **completeness**. It asserts that the probability of an outcome at one wing should not depend on the *outcome* obtained at the distant wing, given $\lambda$ and the settings.
  *   **What it forbids:** It forbids residual correlations between the outcomes themselves. If OI holds, knowing what Bob measured tells you nothing new about what Alice measured, provided you already know $\lambda$.
  *   **Intuition:** This captures the idea that $\lambda$ is a *complete* specification of the common cause. If $\lambda$ is truly complete, any correlation between $A$ and $B$ should be fully explained by $\lambda$. If $A$ and $B$ remain correlated after conditioning on $\lambda$, it suggests either $\lambda$ wasn't complete (missing information) or there is a direct link between the outcomes.

  ### 2. Relativity and the No-Signaling Theorem

  This is where the distinction does heavy lifting. We know Quantum Mechanics violates Bell's inequality, so it must violate at least one of these conditions. Which one matters for Special Relativity?

  **Parameter Independence is the gatekeeper of No-Signaling.**
  To send a superluminal signal, Alice must be able to manipulate a local variable (her setting $a$) to produce a detectable change in the statistics of Bob's outcomes.
  *   If **PI is violated**, then (for a fixed $\lambda$) Alice's setting changes Bob's outcome probabilities. If Alice could also control or know $\lambda$, she could signal. In many hidden variable theories, $\lambda$ is inaccessible, which masks the signaling, but the *mechanism* for signaling is present in the dynamics.
  *   If **PI is satisfied**, then Alice's setting does not influence Bob's marginal probabilities, regardless of what $\lambda$ is doing. Bob sees a random distribution that is invariant under Alice's choices.

  **Outcome Independence is compatible with No-Signaling.**
  *   If **OI is violated** (but PI holds), Alice's *outcome* is correlated with Bob's, but Alice's *setting* is not. Since Alice cannot control her outcome (it is probabilistic), she cannot use this correlation to send a message. She can't force an "Up" to signal a "1" to Bob.
  *   Therefore, a theory can violate OI (exhibiting non-local correlations) while strictly satisfying the no-signaling theorem required by Relativity.

  **The Standard QM Verdict:**
  Standard Quantum Mechanics (with collapse) satisfies **Parameter Independence** but violates **Outcome Independence**.
  *   *Why PI holds:* The reduced density matrix for Bob is independent of Alice's measurement basis. He sees noise regardless of what she does.
  *   *Why OI fails:* Once Alice obtains a result, the wavefunction collapses, and Bob's probabilities update instantaneously. The outcomes are more correlated than $\lambda$ (the wavefunction) alone would suggest if treated as a local common cause.

  Because standard QM preserves PI, it is "peaceful" with Relativity in the operational sense: no superluminal telegraphy is possible.

  ### 3. Bohmian Mechanics vs. Orthodox Collapse

  This decomposition allows us to categorize interpretations by *which* half of Locality they sacrifice. This is a profound difference in the metaphysical picture of the world.

  **Orthodox Collapse (and Standard QM)**
  *   **Violates:** Outcome Independence.
  *   **Preserves:** Parameter Independence.
  *   **The Picture:** The world is indeterministic. The non-locality lies in the **update of probabilities**. When Alice measures, the physical state (wavefunction) updates globally. This creates a holistic connection between outcomes. However, because the specific outcome is random, the "influence" cannot be harnessed to transmit a setting choice. The non-locality is "passive."

  **Bohmian Mechanics (Pilot Wave)**
  *   **Violates:** Parameter Independence.
  *   **Preserves:** Outcome Independence.
  *   **The Picture:** The world is deterministic. The particles have definite positions ($\lambda$). Because the theory is deterministic, once $\lambda$ is specified, the probabilities for outcomes are all 0 or 1. Consequently, Outcome Independence is trivially satisfied (1 = 1 $\times$ 1).
  *   **The Cost:** To reproduce QM predictions, the velocity of particle A must depend instantaneously on the position of particle B. Since the measurement setting at B affects the potential field guiding particle B, and that field affects particle A's trajectory, Alice's setting *does* influence Bob's particle trajectory.
  *   **Why no signaling?** Even though PI is violated, Bohmian mechanics posits that we cannot know $\lambda$ (the particle positions) with sufficient precision (Quantum Equilibrium Hypothesis). The signaling capability is there in the dynamics, but it is epistemically hidden from us.

  ### 4. The Maudlin Critique (Crucial for your reading)

  Since you are working through Maudlin, I must add the caveat that he finds the Jarrett/Shimony decomposition somewhat misleading, or at least overly comforting to the orthodox view.

  Maudlin argues that distinguishing between PI and OI suggests that violating OI is "less bad" for Relativity than violating PI. He contends that **any** violation of Bell's condition implies a form of non-local causation.
  *   If OI is violated, it means the event at A causally influences the probability of the event at B (or vice versa).
  *   Maudlin argues that a causal influence that is superluminal is problematic for the *spirit* of Relativity, even if it doesn't allow for signaling. Relativity is not just a prohibition on telegraphy; it is a claim about the causal structure of spacetime.
  *   He suggests that Shimony's "Peaceful Coexistence" is a bit of a sleight of hand. It saves the *empirical* predictions of Relativity (no signaling) but abandons the *ontological* locality that Einstein hoped for.

  ### Summary for the Retired Professor

  You can think of the decomposition as a diagnostic tool for the "type" of non-locality a theory possesses:

  1.  **Parameter Independence:** Can I affect you by turning a knob? (Threatens Signaling).
  2.  **Outcome Independence:** Are our results correlated beyond our shared history? (Threatens Separability).

  *   **Standard QM:** Says "No" to the knob (PI holds), but "Yes" to the correlation (OI fails). Non-locality is in the **state update**.
  *   **Bohm:** Says "Yes" to the knob (PI fails), but "No" to the correlation (OI holds, due to determinism). Non-locality is in the **guidance equation**.
  *   **Relativity:** Strictly forbids using the knob to signal. It is agnostic (officially) about the correlations, provided they remain unsignaling.

  Maudlin's point is that while this decomposition clarifies the *mechanism* of the violation, it shouldn't lull us into thinking that standard QM is "local" in any sense Einstein would recognize. It is non-local; it just hides the non-locality behind the veil of indeterminism.

  Enjoy the rest of Maudlin. It is rare to find a text that treats the physics with the rigor it deserves while not shying away from the metaphysical consequences.
