      *   **Address the Philosophy (Parfit):** Explain what Parfit actually said. Correct the friend's simplification gently. Distinguish between "Identity" and "What Matters."
      *   **Address the Cryonics/Uploading Specifics:** Highlight the gaps Parfit doesn't cover (substrate independence, the gap in time, the copy problem).
      *   **Address the Practical/Emotional Side:** The partner's concern, the financial cost, the probability of success.
