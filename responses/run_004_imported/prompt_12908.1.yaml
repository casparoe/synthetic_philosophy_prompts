  7.  **Final Polish:** Check against Strawson's 1986 paper "Freedom and Belief" and his later summaries (e.g., "The Impossibility of Moral Responsibility"). Ensure the "Basic Argument" steps are accurate. (Step 1: You do what you do because of how you are. Step 2: To be responsible, you must be responsible for how you are. Step 3: You can't be responsible for how you are at the start. Step 4: To change how you are, you need principles, which come from how you are... Infinite Regress).

