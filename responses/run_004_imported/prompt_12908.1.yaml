answer: |-
  Your colleague is right, and this is a crucial distinction to get clear for your students. While it is extremely common to teach Strawson's Basic Argument as a sophisticated version of hard determinism, Strawson himself has spent decades insisting that his "Pessimism" is metaphysically deeper and logically distinct from hard determinism.

  If you lock in the slides framing it as "hard determinism with extra steps," you risk leaving your libertarians a backdoor escape route that Strawson explicitly intended to seal shut.

  Here is the breakdown of why your colleague is correct, why indeterminism doesn't help (in Strawson's specific terms), and how to distinguish Pessimism from Hard Determinism for your seminar.

  ### 1. Who is right?
  **Your colleague is right.** Strawson's Basic Argument is designed to be **determinism-independent**.

  Your instinct—that indeterminism should help libertarians—is the standard libertarian intuition. Strawson agrees that *if* moral responsibility were possible, indeterminism would be necessary (determinism is clearly incompatible with ultimate responsibility). However, he argues that indeterminism is **not sufficient**.

  The Basic Argument aims to show that the very concept of "ultimate moral responsibility" (the kind required for true desert) entails a logical impossibility, regardless of the causal structure of the universe.

  ### 2. Why Indeterminism Doesn't Loosen the Grip
  You asked to avoid generic appeals to "luck" (e.g., "if it's random, it's just luck"). While Strawson does use luck arguments, the core of the Basic Argument rests on the **regress of self-creation**.

  Here is how to walk through it in Strawson's terms for your slides:

  **The Requirement of Self-Creation (*Causa Sui*)**
  Strawson argues that to be truly morally responsible for an action ($A$), you must be responsible for the mental nature/character ($N_1$) that produced $A$.
  *   **The Determinist Problem:** If $N_1$ was determined by prior causes ($N_0$, genetics, environment), you didn't choose $N_1$. So you aren't responsible for $A$.
  *   **The Libertarian/Indeterminist Hope:** "Ah, but what if the formation of $N_1$ was *not* determined? What if there was an indeterministic gap where I could shape $N_1$?"

  **Strawson's Rebuttal: The Regress**
  Strawson asks: *How* did you shape $N_1$?
  To shape your own nature ($N_1$) into a specific form, you must have acted based on some **principles of choice** or a **prior nature** ($N_0$).
  *   If you chose to change $N_0$ into $N_1$ based on reasons, those reasons came from $N_0$. So you are only responsible if you were responsible for $N_0$.
  *   If the change from $N_0$ to $N_1$ was **indeterministic** (not based on prior reasons/nature), then the change was essentially random. It happened *to* you, not *by* you. You cannot claim credit for a random shift in your neural wiring any more than you can claim credit for a determined one.

  **The Logical Impossibility**
  To be ultimately responsible, you would have to be a *causa sui* (self-caused). You would have to exist *prior* to yourself in order to create yourself.
  *   **Determinism:** You are the product of the past.
  *   **Indeterminism:** You are the product of the past *plus* randomness.
  *   **Strawson:** In neither case are you the *originator*. To be the originator, you would need to choose the principles by which you choose. But to choose those principles, you need prior principles. This generates an infinite regress.

  **For your slides:** The key isn't that indeterminism adds "noise." It's that indeterminism fails to provide **agency**. Agency requires control; control requires reasons; reasons require a prior nature. If the transition is undetermined, the link of *control* is broken, not liberated.

  ### 3. Pessimism vs. Hard Determinism
  This is the distinction you've been flattening, and it's vital for the seminar.

  **Hard Determinism (Contingent Impossibility)**
  *   **Claim:** Moral responsibility is impossible *because* determinism is true.
  *   **Vulnerability:** If physics turns out to be fundamentally indeterministic (e.g., quantum mechanics saves the day), the hard determinist must concede that moral responsibility *might* be possible. Their argument rests on a contingent fact about the universe.
  *   **Structure:** $Determinism \rightarrow No\ Responsibility$.

  **Strawson's Pessimism (Necessary Impossibility)**
  *   **Claim:** Moral responsibility is impossible *regardless* of whether determinism is true or false.
  *   **Strength:** It survives the discovery of indeterminism. It argues that the *concept* of ultimate responsibility is incoherent, like a "round square."
  *   **Structure:** $The\ Concept\ of\ Ultimate\ Responsibility \rightarrow Logical\ Contradiction$.

  **Why this matters for your students:**
  If you teach Strawson as a hard determinist, a savvy libertarian student can say: "Okay, but if quantum indeterminacy affects neural firing, your premise 'you didn't choose how you are' is false. Some of how I am is uncaused."
  If you teach Strawson as a Pessimist, the response is: "Even if some of how you are is uncaused, you didn't *author* that uncaused event. You still aren't the *causa sui*."

  ### 4. Suggested Slide Framing
  To correct the framing without completely scrapping your old notes, you might structure the lecture like this:

  1.  **The Intuitive View:** "You act according to your character." (Compatibility with Determinism).
  2.  **The Libertarian Objection:** "But determinism kills responsibility! We need indeterminism to be the true source."
  3.  **Strawson's Basic Argument (The Regress):**
      *   To be responsible for $X$, you must be responsible for the mind that produced $X$.
      *   To be responsible for that mind, you must have chosen it.
      *   To choose it, you must have had a mind to choose with.
      *   **Result:** Infinite Regress.
  4.  **The Indeterminism Test:**
      *   Does adding randomness stop the regress?
      *   No. Randomness $\neq$ Agency.
      *   You cannot be responsible for random changes in your character any more than determined ones.
  5.  **Conclusion:** Hard Determinism says the door is locked. Strawson says there is no door.

  ### Summary for your prep
  Your colleague saved you from a potential seminar disaster. By distinguishing Pessimism from Hard Determinism, you show students that the problem isn't just physics; it's metaphysics. The requirement for "ultimate responsibility" demands a kind of self-creation that is logically incoherent, making the truth or falsity of determinism irrelevant to the conclusion.

  If you want to cite Strawson directly on this, his 1986 book *Freedom and Belief* is the source, but his shorter paper "The Impossibility of Moral Responsibility" (1994) lays out the Basic Argument most clearly for teaching purposes. He explicitly states there: *"The argument does not depend on the assumption of determinism."*
