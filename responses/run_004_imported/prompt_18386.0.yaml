answer: |-
  You are correct on the metaphysics, but your friend is tapping into a deep psychological intuition that deserves a precise dissolution rather than just a dismissal.

  You are right that **Eternalism (ontology of time)** and **Determinism (causal structure of laws)** are orthogonal. You can have a Block Universe where the state at $t_2$ is not functionally determined by $t_1$ (e.g., objective collapse theories or stochastic hidden variables mapped onto a manifold). In such a block, the future slice is *real*, but it is not *fixed by the past*.

  However, your friend's intuition isn't *just* a confusion about determinism. It stems from a specific tension between **tenseless facts** and **counterfactual power**.

  Here is the steelmanned version of your friend's worry, followed by why it ultimately fails to undermine rational deliberation, specifically isolating the Eternalism variable from the Determinism variable.

  ### 1. The Steelman: Ontological Fixity vs. Causal Openness

  Your friend's argument, stripped of determinism, looks like this:

  1.  **Eternalism implies Tenseless Truth:** If Eternalism is true, there is a tenseless fact of the matter about what happens at every coordinate in spacetime. The proposition "At $t_{future}$, Agent chooses A" is either timelessly true or timelessly false.
  2.  **Deliberation requires Avoidability:** For deliberation to be rational (and not just a theatrical performance), it must be the case that the agent *could have done otherwise* given the exact same prior conditions.
  3.  **The Conflict:** If the proposition "Agent chooses A" is *already true* (tenselessly, in the block), then in what sense is it possible for the Agent to choose B? The block contains A, not B.
  4.  **Conclusion:** Therefore, the future is "closed" in an ontological sense, even if it is "open" in a causal sense. Deliberation feels like we are writing the script, but Eternalism implies we are merely reading it.

  This is distinct from determinism. In a deterministic presentist view, the future *doesn't exist yet*, so there is no "fact of the matter" to conflict with our freedom. In an indeterministic block universe, the future *does exist*, so there *is* a fact of the matter, even if that fact wasn't forced by the past.

  The worry is that **Ontological Settledness** (the future is real) undermines **Alternative Possibilities** (I could have done otherwise), even if **Causal Determination** (the past forced this) is absent.

  ### 2. The Dissolution: Deliberation is a Process *in* the Block

  The counter-argument relies on recognizing that deliberation is not an external force acting *on* the block; it is a physical process *within* the block.

  **The "View from Nowhere" Fallacy**
  Your friend's intuition relies on taking a "God's eye view" of the block. From outside the universe, the block is static. But agents are not outside the universe.
  *   **Analogy:** Imagine a movie reel (the Block). The ending is on the reel. Does this mean the characters' decisions in the middle of the movie didn't cause the ending? No. The reel *contains* the causal chain: [Deliberation] $\rightarrow$ [Decision] $\rightarrow$ [Action].
  *   If you remove the [Deliberation] segment from the reel, the [Action] segment changes (or the reel becomes inconsistent).
  *   Therefore, deliberation is **causally efficacious**. It is a necessary condition for the future slice to look the way it does.

  **Counterfactuals in a Block**
  The claim "I could have done otherwise" is a counterfactual claim. In Eternalism, we analyze counterfactuals not by changing *this* block (which is impossible, as it is the actual world), but by comparing *this* block to **nearby possible blocks**.
  *   "I could have chosen B" means: "In nearby possible blocks where the physical laws and past are similar, but my internal decision-algorithm outputs B, the block contains B."
  *   The fact that *this* block contains A doesn't negate the fact that my decision-algorithm was the switch that selected the A-world rather than the B-world.

  ### 3. The Only Remaining Bite: Libertarian Free Will

  There is one specific philosophical position where your friend is right, and Eternalism is fatal. This is **Libertarian Free Will** (specifically the variety that requires an *ontologically open future*).

  Some libertarians argue that for free will to exist, the future must not just be causally undetermined, but **ontologically unreal**. They want the "branching tree" model of time (Presentism + Indeterminism) where multiple futures are genuinely possible *in the actual world* until the moment of choice collapses them.

  *   **Presentism + Indeterminism:** The future is a cloud of potentiality. No fact of the matter exists yet.
  *   **Eternalism + Indeterminism:** The future is a specific path. A fact of the matter exists tenselessly.

  If your definition of "Free Will" requires that there be **no tenseless truth** about your future actions until you make them, then Eternalism kills that specific version of Free Will.

  **However,** this is generally considered a feature, not a bug, by rationalists and compatibilists. Why? Because an "ontologically open future" where there is *no fact of the matter* about what you will do is indistinguishable from randomness. If there is no fact of the matter, then "you" aren't determining it; reality is just waiting to crystallize. Most accounts of agency require that *you* are the source of the action, which implies a consistent causal story, which fits comfortably in a Block.

  ### 4. The Rationalist Lens: Timeless Decision Theory

  Since you mentioned Eliezer, it's worth applying the Timeless Decision Theory (TDT) lens, which handles Eternalism naturally.

  In TDT, a decision is the output of a logical computation.
  *   The Block Universe contains the instantiation of that computation at spacetime coordinate $(x, y, z, t)$.
  *   The output of that computation is logically fixed (2+2=4 is true tenselessly).
  *   However, the *process* of computing it is physically instantiated in the brain.
  *   **The "Already There" Fallacy:** Saying the decision is "already there" implies it exists *prior* to the computation. It doesn't. It exists *at the location* of the computation.
  *   To know what is "in the block," you have to run the algorithm. *You* are the algorithm running. There is no shortcut to knowing the future slice other than living through the deliberation process.

  Therefore, agonizing over a decision is not "wasted effort." It is the **computational work required to resolve the state of the block at that coordinate.** If you skip the deliberation (e.g., you get knocked unconscious), the block at that coordinate looks different. Your deliberation is the causal mechanism that selects which version of the future is instantiated.

  ### 5. Summary: What Actually Matters for Deliberation

  To answer your specific question on the implications of Presentism vs. Eternalism for rational deliberation:

  1.  **Causal Leverage (Crucial):** Does my mental state causally influence my future actions?
      *   **Presentism:** Yes.
      *   **Eternalism:** Yes. (The block contains the causal link).
      *   **Verdict:** No difference. Deliberation is rational in both.

  2.  **Predictability (Crucial):** Can the future be known before I decide?
      *   **Presentism:** No (if indeterministic).
      *   **Eternalism:** No (unless there is a Laplacian demon outside the block). The information is *in* the block, but not accessible to the agent *in* the block prior to the computation.
      *   **Verdict:** No difference for the agent.

  3.  **Ontological Settledness (The Friend's Worry):** Is there a fact of the matter now?
      *   **Presentism:** No.
      *   **Eternalism:** Yes (tenselessly).
      *   **Verdict:** This is the only difference. But this fact is **epistemically inaccessible** and **causally inert** regarding the deliberation process. It does not constrain the agent any more than the fact that "The past happened" constrains the agent.

  ### The Crisp Answer for Your Friend

  Your friend is suffering from the **"Map-Territory Confusion" applied to Time.**

  He is treating the Block Universe (the Territory) as if it were a script written by an author (a Map). He thinks that because the script exists, the characters can't improvise.
  But in the Block Universe, **the improvisation is part of the script.**

  The "future is already there" intuition feels forceful because humans process time sequentially (A-Series), but we are trying to reason about a manifold (B-Series). When we imagine the future "existing," we imagine it existing *now*, in our present, which implies it is fixed *relative to us*. But in Eternalism, it exists *then*, relative to itself.

  **The Verdict:**
  Eternalism on its own is **toothless** regarding free will and rational deliberation. It changes the metaphysical description of *where* your choices exist, but it does not change the causal mechanics of *how* they are made.

  *   If the universe is Deterministic, deliberation is causally fixed (in both Presentism and Eternalism).
  *   If the universe is Indeterministic, deliberation is causally open (in both Presentism and Eternalism).
  *   The "It's already written" feeling is indeed imported wholesale from Determinism, dressed up in Eternalist clothing.

  You can tell him: *"If my deliberation is part of the causal chain that produces the future slice, then the future slice depends on my deliberation. Whether that slice is 'real' tenselessly doesn't change the dependency. If I don't deliberate, the block looks different. Therefore, I must deliberate to get the block I want."*
