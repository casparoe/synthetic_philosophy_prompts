      *   Timeline keyed to intel window? Yes (Before T-minus 6 weeks).
      *   Fair treatment of opposing side? Yes (Section on "Strategic Stability Risks").
      *   Reversibility argument addressed? Yes (Dismissed as non-credible).

  9.  *(Self-Correction during drafting)*: Make sure I don't get *too* technical that it bogs down the narrative, but technical enough to satisfy the prompt. Use footnotes or appendices references to imply depth. Let's make the trigger condition specific enough to sound real but vague enough to remain classified in the text. "Critical Infrastructure Load Shedding Event."

  10. **Final Polish:** Check the voice. It needs to sound like career civil servants and generals, not novelists. Passive voice where appropriate, precise nouns.

