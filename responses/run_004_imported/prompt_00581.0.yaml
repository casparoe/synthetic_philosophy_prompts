answer: |-
  **The Construction of Certainty**
  **Chatsworth House, 1678**

  The candle gutters. The wax pools like hardened tallow on the oak, a white scar on the dark wood. My hand trembles. It is a betrayal of the flesh, a mechanical failure of the pulleys and levers God constructed, which I did not design and therefore cannot fully repair. But the paper does not tremble. The ink does not shake.

  I dip the nib. I draw the line.

  It is straight. I know it is straight because I willed it so. I defined the point, I defined the motion, I defined the path. This is the only truth available to a mortal mind. We do not know the world, for God made the world, and His mind is infinite while ours is a cramped, dark room. We can only truly know what we ourselves have built. A watchmaker knows the watch; the wearer only knows the time.

  I am building the watch.

  John Wallis calls it dotage. I have the letters here, stacked beneath the heavy *Leviathan*, the copperplate eye staring blindly at the ceiling. Wallis writes from Oxford, safe in his Savilian chair, surrounded by the new philosophers, the men of the Royal Society who peep through lenses and weigh air like grocers. They call me the Old Man of Malmesbury. They say I confuse arithmetic with magic. They say my quadrature is impossible.

  *Impossible.* A word for things men are too lazy to construct.

  I look at the diagram. The square. The circle. The area must be equal. For twenty years, Wallis has picked at the seams of my proof. He found a slip in *De Corpore*. I corrected it. He found a presumption in the *Dialogus Physicus*. I hardened it. Now, in this cold room, with the breath rattling in my chest like a loose sash window, I am writing the *Hexameron*. I will show him.

  But the shadow is long tonight.

  If I am wrong about the circle, what then?

  It is not a matter of pride. Let the younger men keep their pride; I have outlived my enemies, I have outlived the Civil War, I have outlived the King and the Parliament that sought to cut off heads based on the whim of scripture. Pride is a passion. This is architecture.

  My politics rest upon this geometry. I argued that civil science could be demonstrated, just as geometry is demonstrated. Why? Because the Commonwealth is not a growth like a tree; it is a construct like a circle. Men agree to lay down their rights. They draw a boundary. They create a Sovereign. We *made* the State, therefore we can *know* the State. It is a deduction from first principles, as pure as Euclid.

  But Euclid requires axioms that hold.

  If I cannot square the circle, if I cannot master the simplest of constructed figures, then my method is flawed. If the method is flawed, then the *Leviathan* is not a science. It is merely an opinion. And if my political philosophy is merely an opinion, then there is no rational barrier against the chaos. There is no proof that the Sovereign is necessary, only a plea. And pleas do not stop swords.

  I hear the wind outside. It sounds like the marching at Edgehill. I smell the smoke of burning manor houses. I see the blood that spills when men believe their private consciences are superior to public law.

  Wallis thinks he is correcting a sum. He does not see he is loosening a brick in the dam.

  I look at the line I have just drawn. Is it true?

  Wallis says no. The Academy says no. The logic of the infinite series suggests the curve can never be fully captured by the straight edge.

  I close my eyes. I feel the weight of the pen. To admit error is to invite the void. If I admit that I cannot construct the truth of the circle, I admit that perhaps we cannot construct the truth of the State. Perhaps the Sovereign is a fiction. Perhaps the war of all against all is the natural state, and my life's work was nothing but a desperate incantation against the dark.

  No.

  I open my eyes. The ink is dry. The line is black and absolute.

  Wallis is the one who is lost. He deals in the infinite, in the undefined, in the mysteries of the calculus that smell too much of the scholastic angels dancing on pins. He seeks truth in nature, in the physical world that God obscured. I seek truth in the mind, where I am king.

  I define the circle. I define the square. If they do not match, it is not because my reason failed, but because the language of the universities has been corrupted. I must write louder. I must write clearer.

  My hand cramps. The pain shoots up the wrist, sharp and bright. I ignore it. I am ninety years old. I have little time left to secure the peace of England.

  I dip the pen again. I begin the new proof. I will not concede. I cannot concede. For if the geometry falls, the sword falls. And I have seen too much blood to let the sword drop now.

  The candle flickers. The shadow of the compass stretches across the page, looking for all the world like a gallows. I draw the line through it.

  *Q.E.D.*, I write.

  It is done. It is true. Because I say it is. Because I made it.
