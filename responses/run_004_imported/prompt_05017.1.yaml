      *   Jaynes argues that if you throw straws randomly at a circle from a large distance, the distribution of chord midpoints is *not* uniform in the area (1/4). It results in the 1/2 solution.
      *   Okay, I will stick to the high-level logic: Jaynes selects the method that respects the symmetries implied by the lack of specification.

  8.  **Finalizing the Anthropics link:** The "Reference Class" problem is isomorphic to the "Which Measure" problem in Bertrand. Jaynes' approach suggests looking for symmetries in the *observer generation process*. But since we don't know that process, it's harder.

