  *   Jaynes argues for **1/2**. Why? Because he imagines throwing straws from a distance. This implies translation invariance. The 1/4 method (uniform area) is *not* translation invariant if you shift the circle relative to the straw-throwing grid. The 1/3 method is not scale invariant. The 1/2 method (uniform distribution of the distance from the center $r$) is the only one invariant under translation, rotation, and scale.
