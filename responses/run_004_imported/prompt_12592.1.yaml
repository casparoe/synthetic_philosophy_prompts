answer: |-
  The notification arrived at 08:00, as it always did. A soft chime, a holographic ripple in the air above the breakfast table. *Contribution Credit: 3.5 Hours. Weekly Quota: Met.*

  Elias swiped the ripple away. It dissolved into motes of light that drifted into the walls. There was no friction in his life. The walls adjusted their opacity to match his circadian rhythm. The food synthesizer had already prepared oatmeal with the precise ratio of fiber to comfort his gut required. He was eighty years into the future of Keynes's century, and the bread was not just spread thin on the butter; the butter had been reinvented, and the bread was endless.

  He walked to the window. Below, the city of Nea-Athens sprawled in a garden of glass and green. No one rushed. There was nowhere to rush to. The absolute needs—food, shelter, security, health—were solved problems, archived like smallpox and scurvy.

  And yet, Elias felt a hum in his chest, a vibration like a plucked string that wouldn't dampen.

  He went to his study, a room dedicated to the one pursuit that remained valid: the contemplation of things that did not need to be fixed. On his desk lay a physical book, a rarity. *Essays in Persuasion*. He opened it to the dog-eared page.

  *"The love of money as a possession—as distinguished from the love of money as a means to the enjoyments and realities of life—will be recognised for what it is, a somewhat disgusting morbidity, one of those semi-criminal, semi-pathological propensities which one hands over with a shudder to the specialists in mental disease."*

  Elias ran a finger over the text. Keynes had been so sure. He believed that once the economic problem was solved, humanity would face the "real problem": how to live. How to use the freedom from pressing economic cares. The plan had been Moore's plan, distilled. Love, the contemplation of beauty, the pursuit of knowledge. A secular religion of states of mind.

  Elias closed the book. He had spent the morning trying to contemplate beauty. He had stood before a hologram of a Rothko for forty minutes. He knew the history, the technique, the emotional intent. He knew he *should* feel a transcendence of the self. Instead, he had felt a quiet, nagging comparison. *Did I feel as much as Julian felt yesterday? Is my appreciation deep enough to count?*

  The absolute need was gone. The relative need was starving him.

  ***

  That evening, they gathered at Lena's apartment. There were six of them, all in their forties, all beneficiaries of the Dividend. The room was filled with the scent of real jasmine and the sound of low, cultivated voices. This was the ritual. If work no longer defined status, then the curation of the self became the only currency left.

  "I've started learning the cello," said Julian. He held his wine glass by the stem, perfectly still. "Not the digital simulation. The wood. The friction."

  "That's wonderful," Lena said. Her eyes were bright, but Elias knew the look. It was the look of someone presenting a credential. "How many hours a day?"

  "Four."

  A collective intake of breath. Four hours of voluntary difficulty. In a world where difficulty was optional, suffering was the only luxury good that retained value.

  Elias watched them. They were all doing it. Building artificial mountains to climb because the valley was too flat. They spoke of their "projects" with the intensity their ancestors had reserved for mergers or wars. One was restoring a physical orchard; another was memorizing the complete works of a dead poet.

  "And you, Elias?" Lena asked. "Still with the archives?"

  "Reading," he said. "Mostly the old economists."

  "Keynes?" Julian smiled, a flash of teeth. "The fifteen-hour man. Do you think he'd be proud of us?"

  "I think he'd be worried," Elias said. The table went quiet. It was a breach of etiquette to mention the worry. The narrative was that they were the grandchildren who had made it.

  "Worried about what?" Lena asked. "We're free."

  "Keynes wrote that the instinct to strive had been bred into us for generation after generation," Elias said. He felt the hum in his chest tighten. "He thought we could just... turn it off. Like a switch. But he admitted later, in *My Early Beliefs*, that he was naive. He thought we were rational enough to just sit and be happy."

  "We are happy," Julian said. Too quickly.

  "Are we?" Elias looked at his hands. They were soft. Unscarred. "Or are we just terrified of the silence? Keynes called it a nervous breakdown. A collective one. He said we might find we have no use for our legs and our hearts once there's nothing to run from."

  Lena set her glass down. The clink was sharp. "Elias. You're doing it again. You're pathologizing the peace."

  "I'm just saying the Moorean ideal... love, beauty, knowledge. It requires a kind of discipline we don't have. We weren't bred for contemplation. We were bred for survival."

  "Then breed yourself out of it," Julian said, his voice hardening. "That's the work. That's the point."

  "But it's not work if it doesn't matter," Elias said. "That's the joke. If I learn the cello, no one needs to hear it. If I restore the orchard, no one will starve without the fruit. The stakes are zero. And because the stakes are zero, I can't stop checking if I'm winning at having zero stakes."

  The silence stretched. The jasmine scent seemed suddenly cloying. They were all looking at him with a mixture of pity and irritation. He had named the ghost in the room. He had pointed out that the emperor's new clothes were made of anxiety.

  "Let's look at the stars," Lena said, standing up abruptly. "The sky is clear."

  They moved to the terrace. Above them, the orbital lights were dimmed to allow a view of the Milky Way. It was breathtaking. A sweep of diamond dust on black velvet.

  Elias stood next to Mara, his partner. She hadn't spoken much during dinner. She was looking up, her face illuminated by the starlight.

  "Does it move you?" she asked quietly.

  "It's beautiful," Elias said.

  "Do you feel it? The state of mind?"

  He wanted to say yes. He wanted to validate the centuries of struggle that had brought them here, to this terrace, where they could stand safe and fed and look at the universe. He wanted to validate Keynes, and Moore, and the long arc of history that said this was the destination.

  "I feel small," he said.

  "Good."

  "No," Elias whispered. "I feel small, and then I immediately wonder if feeling small is the correct response. I wonder if Julian feels smaller than I do. I wonder if I'm failing at awe."

  Mara turned to him. Her eyes were dark, reflecting the stars. She didn't offer comfort. She didn't offer a solution. She understood.

  "I joined the marathon team," she said.

  Elias looked at her. "You hate running."

  "I know."

  "Why?"

  "Because when my lungs burn," she said, her voice steady, "I don't have time to wonder if I'm happy. The pain is absolute. It's the only thing that feels real."

  "That's what he warned about," Elias said. "The irrationality. We'd rather hurt than feel nothing."

  "Maybe," Mara said. She reached out and took his hand. Her skin was warm. This was love, technically. One of the three pillars. *Love, beauty, knowledge.* He held her hand. He felt the pulse in her wrist. It was a biological fact. It was intimate.

  But even as he held it, a part of his mind was cataloging the sensation, grading it, comparing it to how he remembered feeling five years ago, ten years ago. Was the love deep enough to sustain the weight of eternity? Was it enough to fill the fifteen-hour week, every week, for the rest of his life?

  "It's cold out here," Mara said.

  "Let's go in."

  They walked back inside. The room was warm. Julian was playing a recording of a cello suite. It was perfect. Flawless.

  Elias sat on the sofa. He looked at the book on the table, the one he had brought but hadn't opened. He thought about Keynes, sitting in 1930, in a world of smoke and coal and hunger, imagining this moment. He imagined the old economist watching them, these well-fed grandchildren, picking at the endless butter, terrified of the bread.

  Keynes had hoped they would be like the lilies of the field, toiling not, spinning not. But lilies didn't have consciousness. Lilies didn't read memoirs.

  Elias closed his eyes. He tried to summon the contemplation. He tried to focus on the music, the warmth of the room, the presence of Mara beside him. He tried to enter the state of mind that was supposed to be the salvation of the species.

  For a second, the hum in his chest quieted. The music swelled. The beauty was there, objective and waiting.

  Then the hum returned. *Are you doing it right? Is this it? Is this the good life?*

  He opened his eyes. The room was still perfect. The future had arrived. The problem was not that they hadn't solved the puzzle. It was that the puzzle, once solved, revealed there was nothing behind the board but a mirror.

  "Mara," he said.

  "Hmm?"

  "Tomorrow. Will you run?"

  "Yes."

  "Will I come with you?"

  She looked at him. She knew he hated running. She knew he would do it not for health, but for the burn. For the temporary illusion of a stake.

  "If you want to," she said.

  Elias nodded. He didn't know if it would help. He didn't know if anything would. He just knew that the fifteen hours were up, and the rest of the week was still waiting, vast and uncharted, stretching out into the dark.

  "Okay," he said. "I'll come."

  He sat back and listened to the cello. It was beautiful. It was meaningless. It was enough, and it wasn't. He breathed in, and out, and waited for the next hour to pass.
