answer: |-
  You have hit on one of the most famous and debated moments in 20th-century moral philosophy, and your intuition is sharp. It is a very common reaction to look at the Tokyo firebombing (Operation Meetinghouse, March 1945) and wonder why the atomic bombs get the unique moral scrutiny.

  However, regarding Elizabeth Anscombe specifically, **you are missing a key piece of her argument: she was not inconsistent.**

  Anscombe did not object to Truman because he used *nuclear* weapons; she objected because he intentionally targeted *civilians*. Her opposition was to the principle of "area bombing" (the deliberate bombing of population centers to break morale), regardless of whether the bombs were incendiary or atomic.

  Here is the breakdown of what she actually argued, why she targeted Truman specifically, and how the Tokyo firebombing fits into her worldview.

  ### 1. The Core Principle: Intentionality, Not Weaponry
  Anscombe was a devout Catholic and a student of Wittgenstein. Her moral framework was deontological (rule-based) and rooted in Catholic Just War Theory, not utilitarian (outcome-based).

  *   **The Utilitarian Argument (Truman's defense):** Killing 200,000 people is bad, but if it ends the war and saves 500,000 who would have died in an invasion, it is the "right" thing.
  *   **Anscombe's Argument:** Certain actions are intrinsically evil, regardless of the outcome. The intentional killing of innocents (non-combatants) is murder. You cannot do evil so that good may come of it.

  In her pamphlet, *Mr. Truman's Degree* (1958), she argues that the distinction between a "military target" and a "civilian population" had been erased by Allied strategy. She writes:

  > *"For men to choose to kill the innocent as a means to their ends is always murder. And murder is one of the worst of human actions."*

  To Anscombe, the weapon used was secondary. The moral crime was the **intent** to kill civilians to force a political surrender.

  ### 2. She Condemned Conventional Bombing, Too
  This is the piece that addresses your Tokyo firebombing point. Anscombe was actually highly critical of the entire Allied bombing campaign in WWII, including the firebombing of Dresden and Tokyo.

  She argued that the Western Allies had lost the moral high ground by adopting the same tactics as the Nazis regarding the bombing of cities. In her view, Curtis LeMay (who planned the Tokyo raid) was morally culpable for the same crime as Truman.

  So, why didn't she protest LeMay?
  1.  **Occasion:** Oxford was offering a degree to **Truman**, not LeMay. Her protest was specific to the university honoring a man she believed was a murderer.
  2.  **Symbolism:** The atomic bomb made the intentionality undeniable. With firebombing, one could argue (however weakly) that they were targeting "industrial zones" and civilians were collateral damage. With an atomic bomb, the weapon's radius *is* the city. There is no pretense of precision. It was the clearest possible example of her principle.

  ### 3. Why the "Inconsistency" Perception Exists
  You aren't wrong to feel that the public reaction was inconsistent. Society *does* treat the nuclear bomb differently than conventional firebombing. This is often called "nuclear exceptionalism."

  *   **Public Perception:** People view the atomic bomb as a qualitative change in warfare (man playing God, radiation, instant vaporization) rather than a quantitative one (more death per bomb).
  *   **Anscombe's Goal:** Anscombe actually wanted to **puncture** nuclear exceptionalism. She wasn't arguing that nukes are uniquely evil; she was arguing that *mass killing of civilians* is evil, and the nuke just made it impossible to ignore.

  If anything, she would argue that if Truman is a murderer for Nagasaki, the planners of Tokyo should be too. But since Oxford wasn't honoring the Tokyo planners, she went after the man they *were* honoring.

  ### 4. The "Military Necessity" Debate
  Anscombe also tackled the "military benefit" argument you mentioned. She was skeptical of the claim that the bombs were strictly necessary to end the war without invasion. She cited evidence that Japan was already seeking terms and that the Soviet entry into the war was a significant factor.

  However, even if an invasion *had* been necessary, her moral stance remained: **Necessity does not justify the intentional killing of innocents.** In her framework, you cannot murder 200,000 civilians even if it saves 1,000,000 soldiers. That is a hard line that most modern secular ethics struggle with, but it was the bedrock of her protest.

  ### Summary
  You aren't missing a hypocrisy in Anscombe; you are noticing a hypocrisy in how history remembers the war.

  *   **Was she inconsistent?** No. She opposed the bombing of civilians in principle, whether by B-29s with napalm or B-29s with uranium.
  *   **Was it just about nukes?** No. She used the nuke because it was the starkest example of the principle she wanted to defend.
  *   **Why Truman?** Because Oxford was giving *him* a medal, not Curtis LeMay.

  Anscombe's protest is famous today not because she stopped Truman (Oxford gave him the degree anyway), but because she revived the field of **Just War Theory**. Before Anscombe, moral philosophy had largely ignored the ethics of war in favor of utilitarian calculations. She forced philosophers to confront the idea that some acts are forbidden, even in total war.

  So, your family argument is actually a modern echo of a very deep philosophical rift: **Consequentialism (Truman: the ends justify the means) vs. Absolutism (Anscombe: some means are forbidden, regardless of the ends).** Neither side has "won" that argument in the 75 years since.
