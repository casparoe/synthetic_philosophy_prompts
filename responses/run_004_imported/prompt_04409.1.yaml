answer: |-
  This is one of the sharpest questions in social choice theory, and you have correctly identified the friction point. The "Harsanyi vs. Arrow" debate often gets flattened into "Ordinal vs. Cardinal," but as you noted, Sen demolished the idea that cardinality alone saves you from impossibility. If you have cardinal utilities that are *non-comparable* (CNC), Arrow's dictatorship result still holds.

  So, if Harsanyi gets a weighted sum (Utilitarianism) and Sen says cardinality isn't enough, where is the leverage?

  Here is the breakdown of where the theorems diverge, which axiom is actually pulling the weight, and my stance on where the "sleight of hand" resides.

  ### 1. The Setup: Where the Domains Diverge

  To see the trick, you have to look at the **domain of alternatives**.

  *   **Arrow's Domain:** Deterministic social states ($x, y, z$).
      *   Input: Individual orderings over $x, y, z$.
      *   Constraint: **IIA (Independence of Irrelevant Alternatives).** The social ranking of $x$ vs. $y$ must depend *only* on individual rankings of $x$ vs. $y$. Information about $z$ is irrelevant.
      *   Result: Impossibility (with Pareto + Non-Dictatorship).

  *   **Harsanyi's Domain:** Lotteries over social states ($L = [p, x; 1-p, y]$).
      *   Input: Individual vNM utilities over lotteries.
      *   Constraint: **vNM Independence Axiom.** (Preferences over lotteries must be consistent with expected utility).
      *   Result: Social Welfare Function is a linear combination of individual utilities ($W = \sum a_i U_i$).

  **The Divergence:** Harsanyi enriches the domain. By introducing **risk**, he allows preferences to reveal **intensity**.
  In Arrow's world, if I prefer $x$ to $y$, you don't know *how much*. In Harsanyi's world, if I am indifferent between "Sure thing $y$" and "50% chance of $x$, 50% chance of $z$," you have extracted cardinal intensity information from my risk attitude.

  ### 2. Which Axiom is Doing the Work?

  It is tempting to say "Pareto" does the work in Harsanyi, but Pareto is in both theorems. The real work is done by **relaxing Arrow's IIA via the structure of Lotteries.**

  Arrow's IIA forbids using information about "intensity" or "third options" to rank $x$ and $y$.
  Harsanyi's setup *forces* the use of third options (the lottery components) to define the utility scale.

  When Harsanyi proves that $W = \sum a_i U_i$, he is relying on a mathematical result about linear functionals (essentially a variant of the Riesz representation theorem). He shows that if the Social Preference satisfies the vNM axioms (including Independence over lotteries) and respects the Pareto principle, the Social Utility function *must* lie in the linear span of the Individual Utility functions.

  **Crucially:** This works because the vNM utility functions are unique only up to **positive affine transformations** ($U' = aU + b$). This gives the system enough rigidity to force linearity, but enough flexibility to allow scaling.

  ### 3. The Sen Counter: Why Cardinality Isn't Enough

  You are right to bring Sen up. Sen classified informational bases.
  *   **Arrow:** Ordinal, Non-Comparable (ONC).
  *   **Harsanyi (allegedly):** Cardinal, Non-Comparable (CNC).

  Sen proved that if you stay in **CNC** (Cardinal, Non-Comparable), you **cannot** escape Arrow's impossibility. If everyone has private cardinal scales that cannot be compared, you can rescale Person 1's utility by a million and Person 2's by 1, and the social ordering shouldn't change. But in a weighted sum, that rescaling changes the outcome completely.

  So, if Harsanyi's theorem holds mathematically, but Sen says CNC leads to dictatorship, **Harsanyi must be implicitly assuming more than CNC.**

  ### 4. The Crux: Where is the Sleight of Hand?

  Here is my stance: **Harsanyi's theorem does not escape Arrow's impossibility on its own terms; it sidesteps it by assuming the existence of a Social Observer whose preferences are already coherent.**

  The "sleight of hand" is in the **interpretation of the weights ($a_i$)**.

  #### A. The Indeterminacy of Weights
  Harsanyi's theorem proves: $W = \sum a_i U_i + b$.
  It does **not** prove: $a_1 = a_2 = \dots = a_n$.

  If utilities are non-comparable (CNC), the weights $a_i$ are arbitrary artifacts of the scaling of $U_i$.
  *   If I measure Alice's utility in "cents" and Bob's in "dollars," the theorem might assign Alice a weight 100x smaller than Bob's.
  *   To say "Utilitarianism requires equal weights," you must fix the zero and the unit for everyone.
  *   **Fixing the unit = Interpersonal Comparability of Utility Levels (or at least Units).**

  So, the claim that Harsanyi gives you utilitarianism "without interpersonal comparisons" is false. It gives you a *functional form* without comparisons, but it gives you *normative Utilitarianism* (equal consideration) **only if** you impose interpersonal comparability to normalize the weights.

  #### B. The "Social Observer" Problem
  Arrow asks: "Can we construct a social ordering *solely* from individual orderings?"
  Harsanyi asks: "If a Social Observer has rational preferences over lotteries affecting others, and respects Pareto, what form do those preferences take?"

  Harsanyi assumes the **Social Observer exists** and has vNM preferences. Where do those preferences come from?
  1.  **If they are derived solely from individuals:** We are back in Arrow's land. If the Observer just aggregates individual vNM preferences without adding new info, Sen's CNC impossibility applies.
  2.  **If they are independent ethical preferences:** Then the theorem is trivial. It just says "If you have ethical preferences, they can be modeled as a weighted sum." It doesn't tell you *which* weights to pick.

  #### C. The Impartial Observer Argument (The Real Smuggle)
  Harsanyi tried to fix the weights problem with his **Impartial Observer Theorem**. He argued that if you stand behind a veil of ignorance (equal probability of being anyone), rationality dictates you maximize the average utility.

  **This is where the Interpersonal Comparison is smuggled in.**
  To say "There is a 1/n chance I am Alice and a 1/n chance I am Bob" implies that "Being Alice" and "Being Bob" are comparable states in a common probability space.
  *   It assumes that the *range* of possible experiences for Alice is commensurable with the *range* of possible experiences for Bob.
  *   It assumes that "identity" can be mixed via probability.

  Sen and others (like Weymark) have pointed out that this assumes **Cardinal Unit Comparability (CUC)**. You are assuming that a "unit" of Alice's welfare is comparable to a "unit" of Bob's welfare, otherwise the expected utility calculation over identities is meaningless.

  ### The Verdict

  **Does Harsanyi escape Arrow?**
  *   **Mathematically:** Yes, because he changes the domain from static states to lotteries, which violates Arrow's IIA condition (by allowing intensity information via risk to influence the ranking).
  *   **Philosophically/Normatively:** No.

  **The Sleight of Hand:**
  The claim that Harsanyi derives Utilitarianism "for free" conflates **representation** with **justification**.
  1.  **Representation:** Harsanyi proves that *any* Paretian, rational social preference *looks like* Utilitarianism (a weighted sum). This is true without interpersonal comparisons, but the weights are arbitrary.
  2.  **Justification:** To claim the weights *should* be equal (classical Utilitarianism), you must normalize the scales. Normalizing the scales **is** making an interpersonal comparison.

  The comment thread you read was half-right. Harsanyi found a "door" through Arrow's wall, but that door is labeled **"Assume a Social Observer with vNM preferences over Identities."** Walking through that door requires you to accept that interpersonal comparisons are meaningful (specifically, that we can compare the *units* of welfare across people).

  If you refuse interpersonal comparability (strict CNC), Harsanyi's theorem still holds mathematically, but the weights $a_i$ become meaningless noise, and the "Utilitarianism" evaporates into a dictatorship of whichever scaling convention you happened to choose.

  **Summary:** Harsanyi doesn't eliminate the need for interpersonal comparisons; he moves them from the *aggregation rule* to the *normalization of the input scales*. You still have to make them to get the result the EA/LW crowd wants (equal-weight utilitarianism).
