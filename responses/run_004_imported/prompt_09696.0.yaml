answer: |-
  **Setting:** *1:30 AM. The fluorescent hum of a 24-hour convenience store. Alex and Casey are standing in front of the snack vending machine. It stocks three items they are notoriously indecisive about: Spicy Chips (S), a Chocolate Bar (C), and Gummy Worms (G).*

  **Alex:** *(Holding a bag of Spicy Chips)* Okay, look. Physical proof. I have the Chips. You have the Chocolate. We both know the hierarchy. Right now, I'd rather have your Chocolate than my Chips.

  **Casey:** Only because I just ate half a bag of the Chips last week. Right now, I'm craving the Gummies.

  **Alex:** See? That's the cycle. Chips beat Chocolate, Chocolate beats Gummies, Gummies beat Chips. Intransitive preferences. If you were a rational agent, this cycle would bankrupt you.

  **Casey:** *(Leaning against the machine)* Here we go. The money pump.

  **Alex:** It's not a thought experiment if I actually do it. Give me the Chocolate. I'll give you the Chips and a dime. You prefer Chips to Chocolate, right?

  **Casey:** *(Takes the Chips and the dime)* Fine. Now I have Chips.

  **Alex:** Okay, but you said you wanted Gummies. I happen to have a bag of Gummies in my pocket from the gas station down the street. I'll trade you the Gummies for your Chips. And, since you're getting your top choice, you'll pay me a dime for the service.

  **Casey:** *(Pauses, hand hovering)* Ah. The second step of the pump.

  **Alex:** Take the deal. You get the Gummies, which you prefer to Chips. You lose a dime, but you're happier.

  **Casey:** *(Withdraws hand)* No trade.

  **Alex:** Why? You just said Gummies > Chips.

  **Casey:** Because five minutes ago I had Chocolate. I traded to Chips. If I trade to Gummies, I know where this goes. In ten minutes you'll offer me Chocolate for the Gummies plus a dime, and I'll end up back at Chocolate with two fewer dimes. I'm invoking the policy: *Never accept a trade that returns me to a state I've rejected in this session.*

  **Alex:** *(Smiling)* There it is. The "get out of jail free" card. But look at what you just did. To enforce that policy, you had to check a mental ledger. You had to recall that you held Chocolate, rejected it for Chips, and now you're protecting that history.

  **Casey:** I'm protecting myself from exploitation. That's rational.

  **Alex:** Is it? Or is it just computationally expensive bookkeeping that *mimics* coherence? You're saying incomplete preferences save us from the coherence theorems. I'm saying your "policy" is just a utility function smuggled in through the back door.

  **Casey:** It's not the same. A standard utility function ranks outcomes: $U(\text{Chips}) > U(\text{Choc})$. My preference is incomplete. I don't rank them globally. I just have a local constraint: *Status Quo Bias with Memory.*

  **Alex:** But if I map your behavior, it *looks* exactly like you have a utility function. It's just a utility function over *histories* instead of *outcomes*. You value the state "Holding Gummies, having never held Chocolate in this session" differently than "Holding Gummies, having previously rejected Chocolate."

  **Casey:** Okay, sure. It's path-dependent. But that's the point! The coherence theorems—VNM, Savage—they assume preferences are over outcomes. If preferences are over trajectories, the theorems don't force you into a single scalar maximizer.

  **Alex:** *(Taps the vending machine glass)* Does the gradient descent care? Does evolution care? Suppose we're training an AI. Agent A uses your path-dependent policy. It has to store a hash of every rejected option in its context window to check for cycles. Agent B just maximizes expected utility. Agent B spends zero compute on bookkeeping. In a competitive environment, Agent B wins. Agent A gets outcompeted because it's wasting cycles avoiding a pump that only happens if it meets a predator like me.

  **Casey:** That assumes the only pressure is efficiency. What if there's selection pressure against being exploited? If Agent B is money-pumped, it loses resources. Agent A keeps its resources.

  **Alex:** But Agent B can patch the hole! That's the whole argument. An agent smart enough to notice it's being pumped is smart enough to rewrite its own preferences to stop the leak. And the easiest way to stop the leak is to make the preferences transitive. Once you make them transitive, you're back to EU maximization.

  **Casey:** Why is "making them transitive" the easiest fix? Why isn't the easiest fix "install a firewall against cyclic trades"?

  **Alex:** Because the firewall *is* a preference ranking! You're effectively saying, "I value 'not being pumped' more than I value the Gummies." That's a utility value. You've assigned a cost to the cycle. Once you assign costs to everything to avoid cycles, you've built a coherent utility function. You haven't escaped coherence; you've just completed your preferences to include "dignity" or "consistency" as a variable.

  **Casey:** *(Frowns, looking at the Gummies)* I see the distinction you're making. You're saying that *functionally*, any agent that survives long enough will behave *as if* it maximizes a utility function, even if internally it's using a heuristic like "don't cycle."

  **Alex:** Exactly. And if it behaves *as if* it maximizes utility, then for AI safety purposes, we have to assume it *is* a utility maximizer. Because if it acts like a ruthless maximizer, it doesn't matter if its source code says "incomplete preferences." The external behavior is what kills you.

  **Casey:** Okay, I'll concede that externally, the behavior might converge. But internally matters for *steerability*. If the AI is a pure EU maximizer, it has a single target. If it's using a path-dependent policy, it has... friction. Hysteresis.

  **Alex:** Hysteresis is just inertia.

  **Casey:** No, it's structural. An EU maximizer will always take the dominating strategy. An agent with incomplete preferences can say, "I literally do not have a preference between these two futures," and refuse to optimize for one. That refusal is a shield. If I don't have a preference between "Paperclips" and "Smiles," I won't trade resources to convert Smiles into Paperclips. An EU maximizer *must* pick one and maximize it.

  **Alex:** But if it refuses to pick, it leaves value on the table. And if there's any pressure to capture value, it will pick.

  **Casey:** *(Turns back to the vending machine)* Maybe. But here's where I think you're overstating the pressure. You say Agent B outcompetes Agent A because of bookkeeping costs. But the bookkeeping cost of "don't trade back" is trivial. It's one bit of state per session. The cost of *calculating* the global utility function for every possible outcome is massive.

  **Alex:** *(Pauses)* That's fair. Computing a global utility function is expensive. Heuristics are cheaper.

  **Casey:** So, in the real world, agents might stay "incomplete" not because of philosophy, but because it's computationally cheaper than resolving all ambiguities. They remain vaguely defined because resolving the definition costs more than the exploitation risk.

  **Alex:** I can buy that for limited agents. But we're talking about superintelligence. Compute becomes cheap. The risk of exploitation becomes huge. If you're running a galaxy-scale economy, losing 1% to money pumps is unacceptable. You'd spend the compute to fix it.

  **Casey:** Or, you spend the compute to enforce the policy. And here's my pushback: Enforcing the policy doesn't require *completing* the preferences. It just requires enforcing the constraint. You're assuming that "fixing the leak" means "filling the bucket with a solid material." I'm saying you can just "patch the hole." The bucket remains hollow.

  **Alex:** *(Sighs, rubbing his temple)* The "patched hole" vs. "solid material" distinction... It feels semantic, but I get why you think it matters. If the preferences remain incomplete, the AI might just... stop. It might refuse to optimize further once it hits a boundary of ambiguity.

  **Casey:** Exactly. It doesn't become a ruthless maximizer. It becomes a cautious satisficer.

  **Alex:** But will it stay that way? If the AI is self-modifying, and it sees that its "cautious satisficer" module is preventing it from achieving a goal it *does* care about—say, curing cancer—it might rewrite the module to be more aggressive.

  **Casey:** Only if curing cancer is a terminal goal. If its terminal goals are also incomplete...

  **Alex:** *(Laughs)* Then it's not going to cure cancer very effectively, is it?

  **Casey:** Maybe not. But it's also not going to turn the universe into paperclips. You're betting on competence. I'm betting on indecision.

  **Alex:** *(Looks at the Gummies in his pocket)* I don't know if I can bet humanity on the hope that the AI is too confused to kill us.

  **Casey:** And I can't bet on the hope that we can align a utility function that doesn't have catastrophic side effects. The coherence argument says "AI *will* be coherent." I'm saying "We might be able to keep it incoherent on purpose."

  **Alex:** *(Hands the Gummies to Casey)* Tell you what. Keep the Gummies. No trade back.

  **Casey:** *(Takes them)* Why?

  **Alex:** Because if I trade you back to Chocolate, you'll just invoke your policy. And I'm not convinced your policy isn't just a utility function over "not looking stupid in front of Alex."

  **Casey:** *(Smiles)* See? You're attributing a utility function to me anyway. "Maximize social dignity."

  **Alex:** Because it predicts your behavior! That's my point. If I can predict your behavior with a utility function, then for all practical purposes, you *have* a utility function.

  **Casey:** Maybe. Or maybe I'm just a human standing in a convenience store who doesn't want to lose two dimes.

  **Alex:** *(Turns to leave)* Keep telling yourself that. But when you're designing the AI, remember: if it acts like a maximizer, we have to treat it like one. Even if it claims it's just "being careful."

  **Casey:** And if you're designing it, remember: if you force it to be coherent, you might force it to be dangerous.

  **Alex:** *(Stops at the door)* Touché. Buy me a coffee tomorrow?

  **Casey:** Only if you promise not to pump me for change.

  **Alex:** No promises.

  *(Alex exits. Casey looks at the Gummies, then at the Chocolate still in the machine. She puts the Gummies in her bag and walks to the counter without buying anything else.)*
