      *   *What's at Stake:*
          1.  *Insurance/Money:* Who pays?
          2.  *Power:* Who decides? (Doctors vs. Society).
          3.  *Stigma/Identity:* "Broken" vs. "Different."
      *   *Conclusion:* It's not just vocabulary; it's about the power of medicine.

  7.  **Refining the Tone:**
