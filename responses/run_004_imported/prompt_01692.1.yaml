answer: |-
  You have hit on exactly why this debate can feel so abstract. You are right: on the "easy" cases (cancer, diabetes, broken legs vs. red hair, being tall), naturalists and normativists usually agree.

  If they agree on the examples, the disagreement isn't about **extension** (which things fall into the bucket); it is about **intension** (what defines the bucket).

  Here is the breakdown of why this isn't just vocabulary, where they actually fight, and what is at stake.

  ### 1. The Core Disagreement: Fact vs. Value
  The fundamental split is about whether the concept of "disease" can be separated from human values.

  *   **Naturalists (e.g., Christopher Boorse):** Argue that disease is a **value-free scientific fact**. Just as a geologist can identify a "faulty" rock formation without making a moral judgment, a doctor can identify a "dysfunctional" organ. For a naturalist, disease is simply a statistical deviation from normal species functioning. If your heart doesn't pump blood efficiently, that is a disease, regardless of whether you care about living longer.
  *   **Normativists (e.g., H. Tristram Engelhardt, Kenneth Fulford):** Argue that disease is **inherently value-laden**. To call something a disease is to say it is *bad* and that it warrants medical intervention. Without a negative value judgment, it is just a "difference." For a normativist, you cannot define disease purely biologically because biology doesn't tell you what *ought* to be.

  ### 2. Why They Agree on the Easy Cases
  They agree on cancer and red hair because in those cases, **biology and values align.**
  *   **Cancer:** Biological dysfunction exists (cells dividing uncontrollably) AND we value life/health (it is bad).
  *   **Red Hair:** No biological dysfunction exists AND we generally don't view it as bad.

  Because the facts and the values point in the same direction, both theories yield the same result. This is why the debate seems pointless until you look at the **borderline cases.**

  ### 3. The Battleground: Where They Diverge
  The disagreement becomes critical when biology and values come apart. This is where the definition determines the outcome.

  **Case A: Homosexuality (Historical Context)**
  *   **Naturalist View:** In the 1950s, many psychiatrists argued homosexuality was a disease because it allegedly represented a dysfunction in reproductive design. When the APA removed it from the DSM in 1973, naturalists had to scramble to explain why it wasn't a dysfunction biologically.
  *   **Normativist View:** Normativists argue it was *never* a disease biologically; it was only classified as one because society *valued* heteronormativity. The change in 1973 wasn't a new scientific discovery; it was a moral/social shift.
  *   **The Stake:** If naturalism is true, science alone should decide. If normativism is true, social values decide, and science is just a tool.

  **Case B: Aging**
  *   **Naturalist View:** Aging involves the progressive decline of physiological function. By strict naturalist definitions (like Boorse's), aging looks a lot like a disease state.
  *   **Normativist View:** Most people do not view aging as a disease to be "cured," but as a normal part of life. Normativists argue that without the *judgment* that aging is a "bad thing" warranting medical intervention, it isn't a disease, even if function declines.
  *   **The Stake:** If we accept the naturalist view, insurance should cover anti-aging treatments. If we accept the normativist view, aging is a condition of existence, not a medical problem.

  **Case C: Mild Depression or Anxiety**
  *   **Naturalist View:** If there is a chemical imbalance or a deviation from normal emotional regulation mechanisms, it is a disease.
  *   **Normativist View:** Is the sadness a "dysfunction," or is it a rational response to a terrible job or a broken society? Normativists worry that naturalism "medicalizes" normal human suffering.
  *   **The Stake:** Do we treat the person with pills (fixing the biology) or change their environment (fixing the situation)?

  ### 4. What Is Actually at Stake?
  This is not just semantics. The definition of disease controls power, money, and identity.

  **1. Insurance and Resource Allocation**
  In most healthcare systems, insurance covers "medically necessary treatment for diseases." It does not cover "lifestyle choices" or "enhancements."
  *   If **Naturalism** wins: Anything that is biologically dysfunctional must be covered, even if the patient doesn't feel bothered by it.
  *   If **Normativism** wins: Coverage depends on whether the condition causes *harm* or suffering that society agrees is worthy of treatment. This prevents insurance from having to pay for every minor biological quirk.

  **2. Medical Authority vs. Social Authority**
  *   **Naturalism** gives power to **doctors and scientists**. They are the experts on function. If they say it's a dysfunction, it's a disease. This risks "technocratic tyranny," where doctors define social problems as medical ones (e.g., drapetomania, the "disease" that caused enslaved people to run away).
  *   **Normativism** gives power to **patients and society**. It suggests that calling something a disease is a moral decision. This risks making medicine too subjective (e.g., if society decides being short is "bad," does it become a disease?).

  **3. Stigma and Responsibility**
  *   Calling something a **disease** (Naturalist leaning) can reduce blame ("It's not your fault, it's your chemistry") but can also label you as "broken."
  *   Calling something a **problem of living** (Normativist leaning) can empower you to change your life but can also imply you are responsible for fixing it yourself.

  ### Summary
  The disagreement isn't about whether cancer is a disease. It is about **who gets to draw the line** when the science is unclear or when the "dysfunction" is debatable.

  *   **Naturalists** want to protect medicine from becoming a tool of moral policing (e.g., curing "immorality").
  *   **Normativists** want to protect society from having moral choices disguised as scientific facts (e.g., medicalizing normal sadness).

  They are fighting over the boundary between **biology** and **ethics**, and that boundary determines who gets treatment, who gets blamed, and who holds the power.
