      *   **Executive Summary:** The core recommendation and the philosophical/practical pivot.
      *   **Context & Problem:** The current cost vs. the reliability data (0.3 correlation).
      *   **Philosophical & Practical Framework:** Introduce bounded rationality (Simon/Gigerenzer) without jargon overload. Acknowledge Slote.
