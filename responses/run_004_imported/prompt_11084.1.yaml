      *   Voice: Ensure it sounds like it comes from a senior board member, not an outside consultant. Humble but firm.

  7.  **Final Review against Prompt:**
      *   "Thirty-six years physics": Subtle nod to measurement error/signal-to-noise.
      *   "Philosophy reading": Simon, Gigerenzer, Slote integrated.
      *   "Foundation details": 15 fellowships, 300 applicants, 500 hours.
      *   "Desert objection": Treated as a cost.
      *   "Pilot": Included with success metrics.

  *(Self-Correction on the "Weighted Lottery" idea)*: I initially thought about a weighted lottery. But the subcommittee proposed a binary sort. To support the subcommittee (who have the data) while respecting the skeptics, I will recommend the binary sort *but* with a very rigorous threshold setting process, and the pilot nature allows us to revert if the "desert" cost proves too high. I will argue that the 0.3 correlation *already* invalidates the claim that we are currently picking the "15 best." We are picking "15 that looked best to this specific group of reviewers."

