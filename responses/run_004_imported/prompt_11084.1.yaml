      *   **Evaluation Metrics:** How to decide if it stays.
      *   **Conclusion:** Final call to action.

  4.  **Drafting - Section by Section:**

      *   *Tone:* Needs to sound like a scientist-philosopher. Precise, evidence-based, but ethically nuanced.
      *   *Intro:* Acknowledge the tension. Efficiency vs. Merit.
      *   *The Data:* Highlight the 0.3 correlation. In physics, that's noise. In social science, it's common, but for high-stakes ranking, it's problematic.
      *   *The Theory:* Use Simon's "scissors" (cognitive limits vs. environment structure). Use Gigerenzer's "less is more." Use Slote's defense of satisficing. *Crucial:* Connect this to the foundation's context. We are trying to optimize a noisy signal.
      *   *The "Desert" Counter-argument:* This needs weight. If we lottery, do we violate justice? Yes, if "desert" is defined by fine-grained rank. No, if "desert" is defined by meeting a standard of excellence. The memo must argue that *above the threshold*, desert is indistinguishable from luck anyway (due to the 0.3 correlation). Therefore, the lottery doesn't ignore desert; it acknowledges the limits of our ability to measure it.
