      *   *The Standard of Taste:* Despite sentiment being subjective, we *do* argue about taste. We prefer some critics over others. Why? Because some sentiments are more *authoritative*.
      *   *The "Sound State" Criterion:* Hume needs a way to filter out noise. If everyone's sentiment counts equally, there's no standard. So he introduces the "joint verdict of true judges." To identify true judges, they need "strong sense, united to delicate sentiment, improved by practice, perfected by comparison, and cleared of all prejudice."
      *   *The Health Analogy:* The fever/jaundice analogy is crucial. It's not that the color *isn't* real to the jaundiced eye, but that the *organ* is malfunctioning relative to the standard human constitution.
      *   *The Wine Key:* This is the trickiest part. It looks like objective realism. The key *was* there. Therefore, the leather/iron taste was *caused* by the key. Therefore, the judgment was "true."

  3.  **Address the Tension (Subjectivism vs. Realism):**
      *   *Is it a contradiction?* Superficially, yes. Deep down, Hume is trying to save normative discourse without committing to moral/aesthetic realism.
