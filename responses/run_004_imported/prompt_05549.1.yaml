          *   Philosopher B (Pro-Coincidence/Markovits): Believes moral worth depends on motivating reasons coinciding with right-making reasons. Needs to address the "lucky coincidence" objection (dialing the right number).
      *   **Format:** A dialogue (sidebar for a magazine feature).
