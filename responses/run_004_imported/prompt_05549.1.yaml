answer: |-
  **SIDEBAR: The Structure of the Good Will**

  **Elena:** Let's go back to the river. You're telling me Huck Finn gets full moral credit? He believes he's stealing property. He believes he's damning his soul. He helps Jim solely because he likes him.

  **David:** He gets credit because he responds to the reasons that actually matter. Jim is a person, not property. Huck treats him as a person. That's the right-making feature. Huck's motivation tracks that feature.

  **Elena:** It tracks it accidentally. Huck thinks he's acting against the moral order. If you strip away the requirement that an agent recognize, at least in part, that their act is right, you lose the difference between moral worth and mere behavioral correctness.

  **David:** That's the Kantian hang-up. Michael Smith called it "moral fetishism." If you insist I must desire "to do the right thing" to be good, you make me care more about my own moral resume than the suffering person in front of me. Huck's love for Jim is direct. It's unmediated by abstract rules. That's why it's beautiful.

  **Elena:** It's sympathetic, yes. But is it *moral*? Imagine Huck's affection cools. Suppose he wakes up one day annoyed by Jim. Since he has no commitment to the *principle* that slavery is wrong, nothing stops him from turning Jim in. His goodness is fragile. It hangs on a mood. To have moral worth, you need a motive that sustains the action even when inclination fails. You need some grasp of the rightness doing motivational work.

  **David:** I'm not saying principles never matter. But look at Julia Markovits's view. Moral worth requires that your motivating reasons coincide with the right-making reasons. It doesn't require you to label them "moral." If I save a drowning child because I see a child in distress, my reason coincides with the reason it's right to save them. I don't need to think, "Duty calls."

  **Elena:** That works for the child. But consider the "lucky coincidence" case. A man donates to charity solely to impress a date. It happens that helping the poor is the right thing to do. His motivating reason (lust/status) does not match the right-making reason (relieving suffering). You'd agree he lacks moral worth there?

  **David:** Obviously. The reasons don't coincide. The fact that it helps people is incidental to why he wrote the check.

  **Elena:** Now, apply that to Huck. Huck helps Jim to relieve *Huck's* discomfort at seeing Jim sad, or out of loyalty. But he explicitly denies the moral reason—that Jim has a right to freedom. The alignment is just as coincidental as the suitor's donation. Huck is dialing the right number, but he thinks he's dialing the wrong one. Why isn't that luck?

  **David:** Because there's an explanatory connection. Huck isn't ignoring Jim's humanity; he's responding to it pre-theoretically. His ignorance of morality is a cognitive defect, not a motivational one. He sees the human need. The suitor ignores the need; he sees only the date. Huck's action is explained by the very features that make it right.

  **Elena:** But he denies those features have normative force! He thinks he *shouldn't* be responding to them. That's the rub. If you don't require some recognition of rightness, you can't distinguish the saint from the sympathetic sinner who happens to be right this once. You're saying moral worth is just a kind of successful moral luck.

  **David:** And you're saying moral worth is a kind of self-congratulation. You want the agent to be thinking about morality *while* acting morally. But the best actions often flow from forgetfulness of self. When I comfort a grieving friend, if I'm thinking, "I am fulfilling a duty," I've already stepped back from the friendship. I've made it about me.

  **Elena:** I don't require duty to be the *only* motive. Just that it plays a role. A background check. "I am helping you because you need it, *and* I see that this is what one ought to do." Without that second clause, you haven't separated yourself from the shopkeeper who is honest only because it's good for business.

  **David:** The shopkeeper is different. He doesn't care about the customers' rights. He cares about profit. Huck cares about Jim.

  **Elena:** Huck cares about Jim *despite* his morality. That's the tragedy. But praise? Praise belongs to the will aligned with the good. Huck's will is aligned with Jim, but aligned *against* the good as he understands it. He's morally blind. We might love him, but can we call him virtuous?

  **David:** If virtue doesn't allow for a boy to love a friend more than a wicked law, your virtue is too rigid for the world. If the reasons line up, the credit stands.

  **Elena:** And if the agent doesn't grasp *why* they line up, they can't be trusted to hold the line when the pressure mounts. You're praising the outcome of the psychology, not the moral agent.

  **David:** I'm praising the responsiveness to value. You're praising the responsiveness to concepts.

  **Elena:** Concepts are how we hold value.

  **David:** Then your saints are all philosophers.

  **Elena:** And yours are all children.

  **David:** Maybe that's the point.

  **Elena:** *[Silence]* It doesn't resolve the luck objection.

  **David:** And it doesn't resolve the fetishism charge.

  **Elena:** No. I suppose it doesn't.
