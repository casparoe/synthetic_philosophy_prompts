      *   *Key distinction:* Uncomplicated conviction is integrated. Manic delusion is disruptive and physiologically taxing.
      *   *Wittgenstein application:* Religious belief is a "stance," not a "fact claim." Mania turns a stance into a "factual emergency."

      Let's draft.

      *(Self-Correction on Recommendation)*: Actually, looking at the risk (giving savings to strangers, 3 weeks no sleep), continuing the order is the only safe legal recommendation. Discharging would be negligent. The challenge is justifying it without dismissing the faith.

      *(Refining the Wittgenstein point)*: Don't name-drop Wittgenstein explicitly in the memo unless I know the others like philosophy. Better to use the *concept* without the jargon, or mention it lightly as "philosophical distinctions regarding belief." Actually, the prompt says the user picked it up from a podcast. It might be better to translate the *insight* rather than cite the philosopher, to ensure the psychiatrist doesn't dismiss it as armchair theorizing. I will translate the insight into "Contextual Congruence" and "Phenomenological Quality."

