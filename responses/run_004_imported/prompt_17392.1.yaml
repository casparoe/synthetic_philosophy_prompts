      *   **Key Conflict:** How to distinguish between genuine religious belief (protected) and pathological delusion (treatable) without falling into two traps: (1) "Church says it's normal" = automatic veto on intervention, or (2) "Unusual religious content" = automatic pathology.
      *   **Philosophical Angle:** The user mentions Wittgenstein's lectures on religious belief (belief isn't held like empirical fact).
