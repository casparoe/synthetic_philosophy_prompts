      *   **The Critical Flaw (Where CEV Struggles):**
          *   *Identity Discontinuity:* CEV assumes a stable utility function. Dementia changes the utility function.
          *   *The "Two Selves" Problem:* Ronald Dworkin's distinction between "Experiential Interests" (feeling good now) and "Critical Interests" (overall narrative of life). The living will protects Critical Interests. The current state satisfies Experiential Interests.
