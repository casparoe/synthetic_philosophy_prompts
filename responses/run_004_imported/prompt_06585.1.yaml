answer: |-
  Two decision theorists, Alice and Bob, are arguing over the value of a Pasadena gamble.

  Alice says, "Look, if you sum the outcomes in the natural order of the state space, the expected utility is $\ln(2)$."

  Bob shuffles his papers and says, "I don't see it. I just rearranged the terms of the series, and now the expected utility is positive infinity."

  Alice rolls her eyes. "You can't do that. The series is only *conditionally convergent*. By the Riemann Rearrangement Theorem, you can make the sum literally anything you want."

  Bob shrugs. "Exactly. It's called flexibility."

  Alice sighs, "So you're admitting your rational valuation depends entirely on the order in which you list the possibilities?"

  Bob replies, "No, I'm admitting that since I'm not *absolutely convergent*, I can just rearrange my problems until they look like solutions."
