      *   **The Philosophical Implication:** This challenges *Virtue Ethics* (Aristotle, etc.), which relies on the existence of robust, cross-situational character traits (virtues). If traits don't exist or are rarely activated, virtue ethics is empirically inadequate. This argument was famously articulated by Gilbert Harman and John Doris.
