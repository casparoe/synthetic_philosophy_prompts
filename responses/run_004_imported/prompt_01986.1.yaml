answer: |-
  This is a classic problem in philosophy known as **the epistemology of testimony**. You and your partner are essentially debating a question that philosophers like David Hume, Thomas Reid, and Elizabeth Fricker have wrestled with for centuries: *When are we justified in believing what other people tell us?*

  Here is the breakdown of who has the stronger argument, why your intuition about the "90% of stuff" is philosophically sound, and where your partner's caution actually matters.

  ### 1. The Partner's Argument: Radical Skepticism
  Your partner is arguing for a principle of **independent verification**. Their stance is: *Belief is only rational if you can verify the source's reliability without relying on the source itself.*

  **The Problem:** This leads to an **infinite regress**.
  If you meet a scientist, you can't verify their research yourself (as you noted). So, you might check their credentials. But how do you verify the university that gave the credentials? You'd have to check their accreditation. Who verifies the accrediting body?
  If you follow your partner's rule strictly, you fall into solipsism. You would have to discard:
  *   History (you weren't there).
  *   Geography (you haven't been to most places).
  *   Science (you haven't replicated the experiments).
  *   News (you didn't witness the events).

  Your partner's rule is excellent for **risk management**, but it is impossible for **knowledge acquisition**. If "rational" means "capable of functioning in the world," your partner's rule is actually the irrational one.

  ### 2. Your Argument: Epistemic Dependence
  You are arguing from **epistemic dependence**. You correctly identified that the vast majority of human knowledge is social. We are not islands; we are nodes in a network of information.

  Philosophers generally divide into two camps here:
  *   **Reductionists:** Believe testimony is only valid if you have independent positive reasons to trust the speaker (your partner's view).
  *   **Anti-Reductionists:** Believe testimony is *presumptively* valid. You are justified in believing someone unless you have a specific reason *not* to (the "innocent until proven guilty" rule of conversation).

  Most modern epistemologists side closer to you. There is a principle called the **Principle of Credulity** (championed by Thomas Reid), which suggests that humans are hardwired to trust testimony by default. This is evolutionarily adaptive; if a tribesman says, "There's a lion behind that bush," you don't go check for independent verification before you run. You believe them.

  ### 3. The Crucial Variable: Stakes and Context
  This is where the tie-breaker lies. Rationality isn't just about *evidence*; it's about *cost*.

  **Low-Stakes Context (The Wedding):**
  *   **Cost of being wrong:** Zero. If the stranger lied about his research, you lose nothing but a few minutes of conversation.
  *   **Social Norms:** Weddings operate on Gricean Maxims of conversation, specifically the **Maxim of Quality** (try to make your contribution one that is true). In a social setting, there is no incentive for the stranger to lie about specific research numbers. It's too much cognitive effort to fabricate plausible-sounding data for no gain.
  *   **Verdict:** You were rational. Default trust is the efficient, standard operating procedure for low-stakes social interaction.

  **High-Stakes Context (Investing/Medical/Safety):**
  *   **Cost of being wrong:** High. If the stranger asked you to invest in his research based on those numbers, your partner's rule suddenly becomes the rational one.
  *   **Incentives:** In high-stakes scenarios, people have incentives to deceive.
  *   **Verdict:** Your partner is right. Independent verification (or at least third-party verification) is required.

  ### 4. Why You Felt Uneasy
  Even though you were rational to believe him, you probably felt a nagging doubt. That's not because you violated a rule of logic; it's because you violated a **heuristic of control**.
  We like to feel that our beliefs are "ours." When you realize your worldview is built on things strangers told you, it feels vulnerable. Your partner is expressing that vulnerability. They value *autonomy of belief* over *efficiency of belief*. That is a valid preference, but it doesn't make your belief *irrational*.

  ### The Verdict
  **You have the better argument regarding rationality.**
  It is not irrational to accept testimony in the absence of defeaters (reasons to doubt). If it were, science would collapse, as no single scientist can verify every paper they cite. You operated on the standard human protocol: *Trust unless there is a reason not to.*

  **Your partner has the better argument regarding risk.**
  They are correctly identifying that you are vulnerable. While you weren't *irrational*, you were *unguarded*.

  **How to settle it:**
  Tell your partner: *"You're right that I can't verify everything, which is why I use a tiered system. For wedding chat, default trust is rational because the cost of error is zero. For decisions that impact our money, health, or safety, I agree with you: we need independent verification. But if I applied your rule to everything, we'd have to stop believing in history, science, and the news."*

  You were socially rational; your partner is cautiously prudent. In this specific instance, your approach was the correct one for the environment.
