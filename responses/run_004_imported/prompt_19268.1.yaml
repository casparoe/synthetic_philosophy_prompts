answer: |-
  Good evening. For those who don't know me, I'm a friend of the couple. For those who do, you know I have a tendency to overthink things. So, you'll understand when I say that in preparing for tonight, I found myself thinking about a specific problem in moral philosophy regarding what makes love actually valuable.

  There is a worry that knowing someone too well—that inspecting the joints, so to speak—kills the romance. That real affection requires a little blindness. But Priya and Jonah have built a marriage on the opposite principle.

  Priya is an engineer. When she designed her first bridge, she didn't just hope it would hold; she personally inspected every joint before she let her own parents drive across it. That isn't a lack of faith. That is the only kind of faith that matters. She loves the reality of the thing, not the idea of it.

  And Jonah. Jonah lends his books, but he writes notes in the margins first. He expects them back. He doesn't want to lose himself in someone else, and he doesn't want them to lose themselves in him. He wants a conversation that leaves a mark.

  A philosopher named G. E. Moore argued that the very best things in life are "organic unities"—states where personal affection is combined with the appreciation of real qualities. He insisted that if you love a quality the person doesn't actually have, the value collapses. It becomes sentimentality. To love truly is to see truly. It sounds like an audit, I know. But as Priya knows, an audit is what keeps the bridge from falling.

  Now, Moore also posed a challenge. He asked: If this state of love is valuable in itself, does it need an audience? Strictly speaking, no. The value is intrinsic to them. If they were alone on a desert island, their regard for one another's actual, inspected, marginalia-filled selves would still be the most valuable thing in the universe.

  So, why are eighty of us here?

  Because Moore also taught that while the beautiful thing has value, a world *conscious* of that beauty is better still. Their love doesn't need us to exist. But it becomes more luminous when it is witnessed. We are not here to validate their union; we are here to complete the circuit of appreciation. We are the chorus that confirms what they already know: that the qualities they see in each other are real, they are public, and they are magnificent.

  So, please raise your glasses. To Priya and Jonah: May you always see each other clearly, and may you never stop inspecting the joints.
