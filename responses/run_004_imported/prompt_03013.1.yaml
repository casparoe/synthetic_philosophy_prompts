answer: |-
  The air tasted of ozone and sterile linen. Elara breathed in, and the chest beneath her white gown rose smoothly, obediently. There was no pain, no scar tissue, only the hum of the ventilation system and the soft blue glow of the recovery chamber.

  She sat up. Her movements were fluid, unencumbered by the cancer that had eaten her lungs forty years ago. She remembered the coughing fits. She remembered the consent form. She remembered the darkness closing in.

  And then, she remembered nothing.

  The door slid open. A technician entered, holding a tablet. He didn't look at her with the awe of witnessing a miracle, but with the routine efficiency of a mechanic checking a returned vehicle.

  "Vitals are stable," he said, not looking up. "Cognitive integration at ninety-eight percent. Do you know your name?"

  "Elara," she said. Her voice was hers, yet resonant in a way she didn't recognize. "Elara Vance."

  "Correct. Do you know the date?"

  "October 14th, 2084," she said instantly. The day she signed the papers.

  "It is February 12th, 2125," the technician corrected. "You have been archived for forty years."

  Elara swung her legs over the side of the bed. The floor was cold. "Archived. That means… I died."

  "Biological cessation occurred shortly after suspension," he said. "Your body was cremated per protocol. What you are sitting in is a biomorphic reconstruction based on the neural scan taken at moment of death."

  Elara looked at her hands. They were smooth, the age spots gone, the veins less prominent. They were perfect. They were not the hands that had held the pen in 2084. Those hands were ash.

  "Am I her?" Elara asked. "Am I Elara Vance?"

  The technician tapped his tablet. "Legally, yes. Psychologically, yes. You possess her memories, her personality traits, her cognitive patterns. The continuity of consciousness is preserved."

  *Continuity.* The word hung in the sterile air. Elara closed her eyes. She could feel the weight of her body, the solidity of her self. She felt wholly present. She was not a fragment; she was here, entirely, in this moment. That was the thing about being alive—it demanded you be all of you, right now. You couldn't be half-present.

  But if she was wholly here, where had she been during the forty years in between?

  "There was a gap," she whispered.

  "Forty years, yes."

  "No. I mean *I* was gone. Completely."

  "Your data was stored," the technician said.

  "Data is not me." Elara stood up. She walked to the reflective surface of the medical cabinet. The woman staring back was familiar, yet the symmetry was unsettling. It was like looking at a photograph of herself that had been restored by an artist who guessed at the colors.

  If she was the same person, then identity must be like a thread stretched out through time. A long worm where it didn't matter if the middle section was missing, as long as the ends matched. As long as the pattern held. In that view, she was just a segment of a larger shape, connected to the past by memory and to the future by action. The gap was just empty space between two points on a line.

  But that wasn't how it felt. It felt like a break.

  If identity required being a whole substance, then she had ceased to be. The Elara who died in 2084 was gone. She had completed her shape. To say this woman was her was to say a vase shattered on the floor is the same vase once glued back together. The pieces might fit, the pattern might match, but the integrity was broken. The history was interrupted.

  "Can I go home?" Elara asked.

  "Your estate is in trust," the technician said. "You have access."

  "My husband?"

  "Deceased. 2105."

  Elara felt a hollow ache in a stomach that had never digested his food. She remembered loving him. She remembered the grief of leaving him. But that grief belonged to the woman who died. This woman was a stranger wearing those memories like a coat.

  "If I walk out of here," Elara said, "and I meet someone who knew me… will I be me to them?"

  "To them, you will be a resurrection," the technician said. "They will see the continuity."

  "But I know the truth."

  "What truth?"

  "That I wasn't waiting," Elara said. "I didn't sleep. I didn't travel. I stopped. And then something started."

  The technician finally looked up, his expression neutral. "That is a metaphysical distinction, Ms. Vance. It doesn't affect your functionality."

  "It affects my existence."

  She turned back to the mirror. She pressed her palm against the glass. She felt solid. She felt real. The Endurantist intuition screamed at her: *I am here, wholly. If I am here, I must have persisted. But I didn't.*

  The Perdurantist logic whispered back: *You are a timeline. The gap is irrelevant. You are the sum of your stages.*

  Which one was right? If she walked out the door, was she a survivor or a ghost?

  If she was a worm stretched across time, the gap was just a missing segment. She could step over it. But if she was a substance that had to be wholly present at every moment of her life, then she was an impossibility. A contradiction walking in biomorphic skin.

  "Ms. Vance?" the technician prompted. "We need to finalize the intake."

  Elara took her hand off the glass. She felt the warmth of her own skin. It was convincing. It was enough to live on, perhaps. But as she turned to follow him, she couldn't shake the sensation that she was walking on a bridge that didn't quite connect to the shore behind her. She was moving forward, but the ground beneath her feet was new.

  "Intake," she said.

  She walked toward the door, stepping over the threshold of the chamber. She existed now. That was certain. But as she crossed into the hallway, she wondered if the woman who had walked out of this same door forty years ago was truly gone, or if she was simply hiding in the spaces between the seconds, waiting for a philosophy that could bear the weight of her return.
