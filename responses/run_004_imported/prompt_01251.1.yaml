      *   Did I address the "flexible conventionalist"? Yes (Unlimited flexibility dissolves the concept of convention).
      *   Did I address "tolerable noise"? Yes (Meaning is found in the noise, not despite it).

  8.  *(Self-Correction)*: Make sure to mention that Davidson isn't denying we can group people by language (English speakers), but that this grouping doesn't explain *how* communication works.

  9.  *(Final Plan)*:
