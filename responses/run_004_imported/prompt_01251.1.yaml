      2.  Define the target (The "Third Dogma").
      3.  The Argument from Convergence (Prior vs. Passing).
      4.  The Argument from Competence (Same skill for malapropism and standard speech).
      5.  The "Flexible Conventionalist" Trap (If rules cover everything, they aren't rules).
      6.  Pedagogical angle for the seminar.

