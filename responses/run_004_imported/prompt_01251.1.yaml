answer: |-
  This is one of the most persistent and fruitful sticking points in Davidson's later philosophy. You have correctly identified the intuitive resistance: *Of course* we share a language; we just use our shared competence to fix errors. If Davidson's conclusion feels like an overreaction, it is because he is attacking a specific philosophical picture of what a "language" is supposed to *do*, not the sociological fact that we group people by tongues.

  To help you feel the argumentative pressure in your seminar, you need to shift the focus from **rigidity vs. flexibility** to **priority vs. convergence**. The conventionalist thinks the shared code is the *engine* of communication; Davidson argues it is merely the *fuel* (and sometimes the wrong fuel), while the engine is the interpretive mechanism itself.

  Here is how to reconstruct the pressure Davidson applies to the "flexible conventionalist."

  ### 1. Clarify the Target: What is "A Language"?
  First, ensure your students (and you) are clear on what Davidson is denying. He is not denying that English and German are different. He is denying that **sharing a grammar and lexicon is what explains successful communication.**

  In the standard picture (which Davidson calls the "third dogma of empiricism" in other contexts), communication works like this:
  1.  Speaker and Hearer share a structure $L$ (English).
  2.  Speaker encodes thought into $L$.
  3.  Hearer decodes $L$ back into thought.
  4.  If there is noise (malapropism), they use $L$ + Pragmatics to repair.

  Davidson's claim is that step 1 is philosophically idle. The "shared structure" does no essential work in explaining how meaning is transmitted.

  ### 2. The Argument from Convergence (Prior vs. Passing)
  The core pressure comes from the distinction between the **Prior Theory** (what the interpreter brings to the conversation, roughly "standard English") and the **Passing Theory** (the specific theory of what the speaker means *right now*).

  *   **The Conventionalist View:** Communication succeeds when the Hearer's Prior Theory matches the Speaker's Prior Theory. Malapropisms are glitches where the Prior Theories diverge, requiring a patch.
  *   **Davidson's View:** Communication succeeds **if and only if** the Hearer's Passing Theory matches the Speaker's Passing Theory.

  **The Pressure Point:**
  Consider the malapropism: "a nice derangement of epitaphs."
  *   **Speaker's Prior Theory:** 'Derangement' means disorder.
  *   **Speaker's Passing Theory:** 'Derangement' means *arrangement* (for this utterance).
  *   **Hearer's Prior Theory:** 'Derangement' means disorder.
  *   **Hearer's Passing Theory:** 'Derangement' means *arrangement* (for this utterance).

  Communication succeeds because the **Passing Theories converge**, even though the **Prior Theories diverged** regarding that word.

  Davidson asks: *What explains the success?* Is it the shared Prior Theory? No, because on this specific point, the Prior Theories were mismatched (one intended the standard meaning, the other heard the standard meaning, but they both moved to the non-standard meaning). The success lies entirely in the convergence of the Passing Theories.

  If the Passing Theory is what determines meaning, and the Passing Theory is constructed on the fly for every utterance (to handle malapropisms, metaphors, slips, indexicals), then the "shared language" (Prior Theory) is not the *locus* of meaning. It is merely a heuristic starting point that is often discarded or modified.

  ### 3. The Argument from Competence (The "Same Skill" Thesis)
  This is perhaps the strongest pressure against the "flexible conventionalist."

  The conventionalist says: "We have a competence module (Language) and a repair module (Pragmatics/Context). Malapropisms engage the repair module."

  Davidson argues that **there is no difference in kind** between interpreting a standard sentence and interpreting a malapropism.
  *   To understand "The cat is on the mat," I must assume you mean *cat* and not *dog*, and *mat* and not *rat*. I am constructing a Passing Theory that assigns specific meanings to these sounds.
  *   To understand "The epitaph is deranged," I must assume you mean *epithet* and *arrangement*. I am constructing a Passing Theory that assigns specific meanings to these sounds.

  In both cases, I am using my knowledge of the world, my knowledge of your intentions, and my knowledge of linguistic habits to converge on a meaning.

  **The Pressure Point:**
  If the cognitive machinery required to handle the malapropism is the *same* machinery required to handle standard speech, then positing a "shared language" as a distinct entity is redundant.
  *   If the "flexible conventionalist" says, "The rules of English tell us how to interpret standard speech," Davidson replies, "But the rules of English *fail* on the malapropism. You need the interpretive skill to fix it."
  *   If the conventionalist says, "Okay, the rules include instructions on how to fix errors," Davidson replies, "But there are no rules for how to fix *every possible* error or novel metaphor. The ability to fix them is an uncodifiable skill (radical interpretation)."

  If the uncodifiable skill is sufficient for the malapropism, and the malapropism is structurally identical to standard speech (in terms of interpretation), then the uncodifiable skill is sufficient for *all* speech. The "shared code" drops out as an unnecessary posit.

  ### 4. Why the "Flexible Conventionalist" Absorption Fails
  You asked: *Why can't a sufficiently flexible conventionalist simply absorb malapropism... as tolerable noise within an existing shared language?*

  Here is the specific trap Davidson sets for this view:

  **A. The "Noise" Objection**
  If you call the malapropism "noise," you imply the meaning is *not* in the word 'derangement'. But for the hearer, the meaning *is* successfully retrieved. If the shared language is the vehicle of meaning, and the vehicle is broken, how did the cargo arrive?
  *   *Conventionalist:* "We used context to repair the vehicle."
  *   *Davidson:* "If you have to rebuild the vehicle for every trip, 'the vehicle' is not doing the work. *You* are doing the work."

  **B. The Regress of Rules**
  If the conventionalist claims the "shared language" includes rules for handling deviations, Davidson asks for those rules.
  *   Rule 1: If a word makes no sense, check context.
  *   Rule 2: If context suggests a similar sounding word, substitute it.
  *   But what if the speaker is being ironic? What if they are coining a neologism? What if they are quoting?
  To cover all cases, the "rules" of the shared language would have to be as complex as the interpreter's total knowledge of the world and the speaker. At that point, the "shared language" has expanded to include **everything relevant to interpretation**. It ceases to be a linguistic structure and becomes the interpreter's total theory of the speaker.

  **C. The Idiosyncrasy of Meaning**
  Davidson's most radical claim is that **meaning is idiosyncratic**.
  If I understand your malapropism, I have assigned a meaning to your sound. That meaning is not in the dictionary (shared convention). It is in our temporary convergence.
  Since *every* utterance involves some degree of context-dependence (indexicals, tone, emphasis), *every* utterance requires a Passing Theory.
  If the Passing Theory is what fixes the meaning, and the Passing Theory is unique to the utterance, then there is no *shared* object (Language) that holds the meaning. There are only temporary convergences between idiosyncratic theories.

  ### 5. Seminar Strategy: The "Game" Analogy
  To make this stick for students, use an analogy of a game.

  *   **The Conventionalist View:** Communication is like playing Chess. We share the rules (the language). If you move a knight like a bishop, that's a mistake/noise. We pause, correct the move based on the shared rules, and continue. The shared rules explain the game.
  *   **Davidson's View:** Communication is like **Calvinball** (from *Calvin and Hobbes*) or pure improvisation. We start with some habits (Prior Theory), but the "rules" of what a move *means* are negotiated in real-time.
      *   If you make a move that violates standard Chess rules but I understand what you intend (e.g., you're playing "Bughouse" or a variant), and I respond appropriately, we are communicating.
      *   Davidson says: "The fact that we *can* play standard Chess is just a special case where our improvisations happen to align perfectly with a pre-existing pattern."
      *   The *ability* to play is not knowledge of the rulebook; it is the ability to converge on moves with another person. The rulebook is just a record of past convergences.

  ### Summary for the Seminar
  To feel the argumentative pressure, students must accept that Davidson is redefining **what explains communication**.
  1.  **Phenomenon:** We understand malapropisms.
  2.  **Standard Explanation:** We share a code + repair mechanisms.
  3.  **Davidson's Diagnosis:** The "repair mechanism" is actually the *primary* mechanism of understanding. The "shared code" is just a frequently useful starting guess.
  4.  **Conclusion:** If the primary mechanism works without a shared code (as in radical interpretation of a foreigner), and works *better* than the code when the code fails (malapropisms), then the shared code is not essential to the phenomenon of communication.

  The "flexible conventionalist" tries to save the shared language by making it infinitely flexible. Davidson's retort is: **A rule that can be bent to fit any utterance is no longer a rule; it is just the interpreter's judgment.** And if it's the interpreter's judgment, we are back to Radical Interpretation, and "Language" (as a shared normative structure) has vanished.
