  9.  **Final Polish:** Check the voice. Alice should sound slightly defensive of the Hamiltonian tradition. Bob should sound like a pragmatist who thinks IF is "spooky action at a distance." (Self-correction: Ensure Bob doesn't sound like he denies kinship matters, just that the *formalism* is different).

  *(Self-Correction Note during drafting)*: I need to be careful with the Nowak 2010 specific claim. They argued that eusociality models work better without IF. I should focus more on the general theoretical claim about the limits of IF.

  Let's write it.

  *   **Characters:**
