      *   **Setting:** The hotel bar, 11:30 PM.

  *   **Key technical beat to hit:** The definition of $r$. In simple IF, it's relatedness (probability of identity by descent). In generalized IF, it's a regression coefficient. Marcus attacks the latter as post-hoc accounting. Elena defends it as causal structure.

  *   **Key technical beat to hit:** Non-additivity. If benefits are synergistic (2+2=5), does $rb > c$ hold? Marcus says no, not without redefining terms endlessly. Elena says the regression absorbs the non-linearity.

