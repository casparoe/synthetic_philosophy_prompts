prompt: |-
  I'm currently taking a seminar on metaethics, and this week's session focused on the wrong kind of reasons (WKR) problem for fitting-attitude analyses of value. What has stuck with me is the distinction between object-given reasons, which bear on whether a pro-attitude toward something is genuinely fitting, and state-given reasons, which merely make it advantageous or prudent to have that attitude — illustrated by cases like the evil demon who threatens to torture you unless you bring yourself to truly value something utterly worthless, say a saucer of mud. I suspect there's a good joke hiding somewhere in that contrast. Could you write me one? It doesn't need to involve the demon case itself, but the punchline should genuinely turn on the object-given/state-given distinction, rather than just being a generic joke about philosophers splitting hairs.
