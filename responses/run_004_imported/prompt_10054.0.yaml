answer: |-
  A metaethicist is on a blind date with the department chair's daughter. She is insufferable: she insults the waiter, mocks his shoes, and spends an hour explaining why his dissertation is derivative.

  Midway through dessert, she leans in and asks, "Be honest. Do you think I'm valuable?"

  The metaethicist sighs, remembering that his tenure review is next week. "I have conclusive reason to adopt a pro-attitude toward you," he says carefully.

  "So you admire me?"

  "I admire the tenure track. You are, functionally, the saucer of mud I must value to secure it."

  She glares at him and slaps him hard across the face. "You jerk!"

  The metaethicist rubs his cheek, eyes lighting up. "Finally," he says, standing up to leave. "A reason of the right kind."
