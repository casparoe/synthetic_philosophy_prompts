      *   **The Conflict:** Elara looks at the data vs. the people. The people feel nothing (individually). The system acts like it feels everything.
      *   **The Conclusion:** Elara is left with the question. She turns off the monitor, but the doubt remains.

  6.  **Refining the Philosophy (Multiple Realizability):**
      *   Avoid having Elara say "Functionalism states..."
      *   Instead, show her wondering if the *pattern* matters more than the *stuff*.
      *   Show the isomorphism: The firing pattern matches a human brain, but the substrate is flesh-and-blood humans.
      *   Key image: The difference between the *signal* and the *experience*.

  7.  **Writing - Focusing on Sensory Details:**
      *   *Sound:* The chatter of radios, the hum of ventilation, the robotic scream.
      *   *Sight:* Rows of cubicles, blinking lights, the screen visualization.
      *   *Feeling:* The vibration of the floor, the coldness of the observation deck.

  8.  **Drafting - Iteration 1 (Mental Outline):**
      Elara watches the screen. Green waves. It's the China Brain project. 1.4 billion people linked. Today is pain test. She sees the spike. She goes to talk to a worker. He's drinking tea. He says "I just press button when light flashes." She goes back. The robot screams. She wonders if it's real. Ends with her unsure.

      *Critique 1:* Too dry. Needs more atmosphere. Needs to feel like a story, not a summary.

  9.  **Drafting - Iteration 2 (Adding Texture):**
