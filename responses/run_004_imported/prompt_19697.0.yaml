      *   *Outside (Observer):* This allows for a broader view of the system, the scale, and the ambiguity. It lets the protagonist interact with the "system" as a whole.
      *   *Decision:* I'll go with an Outside Observer, specifically a technician or monitor responsible for a sector of the simulation. This allows for a mix of technical detail and human observation. Let's call her Elara.

  3.  **Setting the Scene:**
      *   Need to establish the scale without bogging down in exposition.
      *   The "China Brain" needs to be updated or contextualized. Let's make it a specific project, maybe "Project Homunculus" or "The Synapse Grid." Let's go with "The Grid."
      *   The "neurons" are people. They need headsets, radios, or some interface.
      *   The input/output needs to be clear. The Grid interacts with a virtual or robotic body.

  4.  **Developing the Plot:**
