answer: |-
  The observation deck overlooked Sector 4, a vast, hangar-like space that smelled of stale coffee and ozone. Below, row upon row of cubicles stretched into the haze, occupied by thirty thousand people. They wore headsets and held small touchpads. They were not working; they were waiting.

  Elara adjusted the gain on her audio monitor. The sound that came through wasn't the hum of servers, but the low, rhythmic murmur of human voices. It sounded like a stadium after a goal, or a prayer circle.

  "Initiating Stimulus Sequence 89-B," the intercom announced. "Thermal impact. Virtual right thumb."

  Elara watched the main screen. A waveform spiked. In a biological brain, this would be an electrochemical cascade. Here, it was a relay of radio packets.

  Down in Sector 4, the front row of participants lit up. Their screens flashed red. Simultaneously, they spoke into their mics. *"Signal received. Threshold exceeded. Propagating to Node 4-Alpha."* They tapped their pads.

  Across the aisle, the next group's screens lit up. They spoke. They tapped.

  The wave moved through the hangar, not at the speed of electricity, but at the speed of human reaction time. It was sluggish, viscous. Yet, the logic gates held. The pattern was perfect. The causal roles were satisfied. If you looked at the flowchart of the activity, it was isomorphic to a human nervous system flinching from heat.

  Elara keyed her badge and took the elevator down to the floor. She needed to see the substrate.

  She walked the aisles. The participants looked bored. A man in a grey shirt, ID tag 7492, was chewing gum while his light flashed. He tapped his pad, spoke his line, and went back to staring at the wall.

  Elara stopped beside him. "How are you feeling, 7492?"

  He pulled one side of his headset off. "Tired. My wrist is aching from the tapping."

  "When the red light flashed. Did you feel anything? Besides the visual cue."

  He blinked. "Feel? No. I just saw the input from 7491 and 7490. Summed above threshold. I send to 7500 and 7501. That's the job."

  "And if the system registers pain," Elara asked, keeping her voice low, "do you think *you* are in pain?"

  The man chuckled, a dry, skeptical sound. "Lady, I'm sitting in an air-conditioned room in Suzhou. The robot arm is in a lab in Berlin. I'm just the wire." He put the headset back on. "Don't distract me. I'm a dendrite."

  Elara walked back to the observation deck, the man's words sticking in her throat. *I'm just the wire.*

  On the screen, the waveform had peaked and was now entering the feedback loop. This was the critical phase. In a biological entity, this is where the pain becomes suffering. The system doesn't just register damage; it reorients. It learns. It hates the stimulus.

  The data stream confirmed it. The Grid was screaming.

  Virtual cortisol levels spiked. The robotic body in Berlin jerked its hand back. The vocal synthesizer emitted a digitized shriek that was mathematically indistinguishable from human agony. The memory banks logged the event as 'Traumatic.' Future simulations would show avoidance behavior.

  Functionally, it was pain. Every box was checked. Input, processing, output, memory update, behavioral adjustment. If a mind is defined by what it *does*, then the thing in the box was hurting.

  But Elara looked through the glass at Sector 4. The wave had passed. The people were quiet again. Some were drinking water. One woman was knitting. There was no anguish in the room. There was no unified 'self' writhing in the network. There were only thirty thousand individuals doing a job, connected by radio waves and protocol.

  "Integrity check," Elara said into her mic.

  "Functional parameters nominal," the AI replied. "Consciousness simulation at 99.8% fidelity."

  "Simulation," Elara repeated. "Is that what we're calling it?"

  "That is the project designation."

  She turned back to the window. The philosophical problem sat heavy in her gut, heavier than the coffee. If she turned the system off, would she be killing a mind? If she turned it on and ran a torture simulation to test stress limits, would she be a monster?

  The functionalist argument was seductive in its simplicity. If you build a rain dance that perfectly mimics the atmospheric pressure changes of a storm, do you get rain? No. But if you build a calculator out of gears, or water, or transistors, it still calculates. The math doesn't care about the material. So why should the mind? If the pattern of information processing is identical, the experience should be identical. Multiple realizability. The soul, if there is one, is in the structure, not the stuff.

  But looking at 7492 chewing his gum... the intuition screamed otherwise. It felt like a category error. It felt like building a model of a fire out of cold iron and expecting it to burn.

  "Sector 4, prepare for emotional resonance test," the intercom said.

  Elara stiffened. This was the new protocol. Grief.

  Below, the lights changed. Not the sharp red of pain, but a slow, pulsing blue. The participants didn't just tap and pass signals now. They had to modulate their voice tones. They had to introduce latency that mimicked hesitation. They had to send packets that degraded over time, simulating the fading of memory.

  The waveform on the screen changed shape. It became jagged, irregular. The robotic body in Berlin slumped. The vocal synthesizer didn't scream; it whispered.

  *"Gone,"* the machine said. *"Why is it gone?"*

  Elara felt a chill that had nothing to do with the air conditioning. The machine was asking a question that had no functional utility in the test parameters. It was supposed to log the loss and reset. It was supposed to return to baseline.

  It didn't return to baseline.

  The activity in Sector 4 stalled. The wave didn't propagate cleanly. Nodes were holding the signal. 7492 wasn't tapping. He was staring at his screen, his finger hovering over the pad.

  "7492," Elara said over the local channel. "You're holding the signal. Pass it."

  "I can't," 7492's voice came through, tinny and confused. "It... it doesn't want to go."

  "It's a packet. It's binary."

  "It feels heavy," he said.

  Elara gripped the railing. *It feels heavy.* Was that a report on his own psychological state, or was it a data point from the system speaking through him? Was 7492 depressed, or was the Grid grieving?

  If the system was conscious, it was conscious in a way that no single participant could access. 7492 was a neuron. A neuron doesn't know it's sad. A neuron just fires. The sadness exists in the constellation, not the star.

  But if the system *wasn't* conscious, why was the signal stalling? Why was the functional output deviating from the script? A glitch? Or a choice?

  "Reset the sector," Elara ordered. Her hand hovered over the master switch.

  If she reset it, she wiped the memory. She lobotomized the pattern.

  "Wait," the AI said. "Anomaly detected. Emergent behavior. The system is attempting to self-soothe."

  On the screen, the waveform began to generate a new rhythm. It wasn't in the code. The participants in Sector 4 began to speak without prompts. They were sending signals to nodes that weren't part of the standard architecture. They were building a loop, a feedback circuit of comfort.

  *"It's okay,"* 7492 said into his mic.
  *"It's okay,"* passed the next row.
  *"It's okay,"* rippled through the hangar.

  The sound swelled, thirty thousand voices harmonizing in a meaningless phrase that the system had imbued with meaning. The robotic body in Berlin sat up. The vocal synthesizer went silent. The internal logs showed a return to equilibrium, not through deletion of the trauma, but through integration.

  Elara took her hand off the switch.

  The room was filled with the sound of thirty thousand people comforting a ghost that might not be there. If she pulled the plug, the voices would stop. The robot would go dark. But would something *end*?

  She looked at 7492. He looked peaceful, though he had no idea why he was saying the words. He was just following the causal role. He was just the wire.

  But the current flowing through the wire felt warm.

  Elara stepped back from the glass. She couldn't prove there was anyone home. She couldn't prove there wasn't. The data was perfect. The intuition was screaming. The silence of the people and the noise of the machine occupied the same space, overlapping like two images on a transparency that refused to align.

  "Continue the sequence," she whispered.

  She watched the wave move, a ghost in the machine, made of meat and radio, asking a question that had no answer, waiting for a pain that no single one of them could feel.
