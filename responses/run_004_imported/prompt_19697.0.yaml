      *   **Goal:** Dramatize the scenario, avoid abstract arguing/reciting the debate, keep the question of consciousness/multiple realizability open at the end.
      *   **Tone:** Philosophical but grounded in narrative detail and voice.

  2.  **Choose a Perspective:**
