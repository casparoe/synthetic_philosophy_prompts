      *   *Novelist's Angle:* Remind the user that fiction can stipulate metaphysics. The "truth" is what serves the theme.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Go through exchange move by move? Yes.
      *   Say who has the better of it at each stage? Yes.
      *   Flag unraised philosophical points? Yes.
