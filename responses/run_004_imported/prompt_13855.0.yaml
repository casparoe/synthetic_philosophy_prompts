      *   Actually, the prompt asks to consider "perfectly rational agents." Even granting that premise, Hobbes's definition of rationality is instrumental to self-preservation. If there is *any* non-zero probability the other fails (due to passion, error, or definition), defection is dominant. Superrationality demands 100% logical correlation. Hobbes is a skeptic. He trusts neither words nor logical abstractions without power.

