      *   **Counterpoint:** Thomas Hobbes's view in *Leviathan*. Specifically, his distinction between *in foro interno* (obligation to desire/will) and *in foro externo* (obligation to act), and the claim that covenants without the sword are but words.
      *   **The Question:** Would Hobbes reject superrationality? Does his psychology/state of nature account give him grounds to deny that *shared rationality* provides the necessary assurance? Or does his view of reasoning (mechanical reckoning) make him receptive to it?
