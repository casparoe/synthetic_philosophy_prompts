answer: |-
  Thomas Hobbes would almost certainly reject Douglas Hofstadter's argument for superrationality, despite the superficial resonance between Hobbes's mechanistic view of reasoning and the computational logic underlying superrationality. While Hobbes agrees that reason is a form of "reckoning," his materialist ontology, his skepticism regarding the accessibility of "Right Reason," and his specific distinction between obligation *in foro interno* and *in foro externo* lead him to conclude that logical correlation cannot substitute for coercive power. For Hobbes, the assurance required to make cooperation rational is not epistemic certainty about another's mind, but physical security against their potential defection.

  To understand why Hobbes would deny that mutual knowledge of shared rationality supplies the necessary assurance, one must look first to his definition of reason itself. In Chapter 5 of *Leviathan*, Hobbes defines reason not as an innate intuition of truth, but as "nothing but Reckoning... of the Consequences of general names agreed upon." Crucially, Hobbes argues that in the state of nature, there is no common measure of reason. He writes, "when any man that pretendeth to Reason, will require those whom he contendeth with, to submit their reasons to his own; it is in vain." Because every individual is their own judge of what constitutes reasonable action, there is no guarantee that two agents will view the "symmetry" of a decision problem in the same way. Superrationality relies on the premise that rational agents will necessarily converge on the same conclusion. Hobbes, however, insists that without a common arbitrator (a Sovereign), men's reasoning will diverge due to differing passions and interests. Even if agents are "perfectly rational" in the abstract, Hobbes's epistemology suggests they cannot verify this symmetry with the certainty required to bet their lives on it.

  Furthermore, Hobbes's psychology of action creates a wedge between reasoning and acting that superrationality ignores. Superrationality assumes that if an agent concludes cooperation is rational, they will cooperate. Hobbes, however, views human action as the result of a deliberation process driven by competing appetites and aversions (Chapter 6). While the Laws of Nature are "dictates of Reason," they are frequently overridden by passion. In Chapter 13, Hobbes identifies "Diffidence" (fear) as one of the three principal causes of quarrel. Even if I reason that you are rational, I cannot be certain that your fear or your desire for gain will not override your reason in the moment of action. Hobbes writes that covenants without the sword are "but Words, and of no strength to secure a man at all." For Hobbes, "security" is not a logical inference; it is a physical condition. A logical proof cannot physically restrain a man whose passion for self-preservation or glory urges him to defect. Therefore, the assurance Hobbes demands is not the prediction that the other *will* cooperate, but the guarantee that they *cannot* safely defect. Superrationality provides the former; Hobbes requires the latter.

  This distinction is codified in Hobbes's famous distinction between obligation *in foro interno* and *in foro externo*. In Chapter 15, discussing the Third Law of Nature ("That men perform their covenants made"), Hobbes states that these laws oblige *in foro interno*—that is, they bind a man to a desire or intention that they should take place. However, they do not always oblige *in foro externo*—to the actual putting of them in act. Hobbes is explicit: "when a man coveteth... he is not bound to expose himself to the danger of death." He elaborates in Chapter 14 regarding covenants of mutual trust: "He that performeth first, has no assurance the other will perform after... and therefore he which performeth first, does but betray himself to his enemy."

  Hobbes's condition for *in foro externo* obligation is the removal of "reasonable suspicion." Superrationality attempts to remove this suspicion through logical deduction. Hobbes would argue this is insufficient. In the state of nature, the cost of being wrong (death or subjugation) is so high that any uncertainty, however logically small, justifies pre-emptive defection. Because Hobbes views the state of nature as a condition where "Force, and fraud, are in war the two cardinal virtues" (Chapter 13), relying on the logical consistency of an adversary is, in his view, a violation of the fundamental right of nature: the liberty to use one's own power for self-preservation. To act on superrationality is to perform first without a guarantee of performance after, which Hobbes explicitly categorizes as self-betrayal.

  Finally, one might argue that Hobbes's mechanistic view of reasoning makes him receptive to the idea of deterministic agents. If reason is reckoning, and two reckoning machines are given the same inputs, should they not produce the same outputs? Hobbes would likely concede the theoretical possibility but deny its practical application to human beings. In Chapter 15, Hobbes addresses the "Fool," who claims that breaking covenants is sometimes rational. Hobbes refutes the Fool not by appealing to logical symmetry, but by appealing to the long-term consequences of being cast out of society. However, in a *one-shot* Prisoner's Dilemma (analogous to the pure state of nature), the long-term argument collapses. Here, Hobbes's materialism prevails: humans are distinct material entities, not nodes in a shared logical network. My reasoning process is contained within my own body; it has no causal leverage over yours. Without a "common Power to keep them all in awe" (Chapter 13), there is no mechanism to align our actions other than the fear of punishment.

  In conclusion, Hobbes's account gives him principled grounds for denying that mutual knowledge of shared rationality supplies the assurance a sovereign provides. For Hobbes, assurance is a matter of power, not logic. His distinction between *in foro interno* and *in foro externo* obligation exists precisely because he recognizes that knowing what one *ought* to do (or what rationality dictates) does not ensure one *will* do it when survival is at stake. Superrationality attempts to solve the Prisoner's Dilemma by changing the epistemic conditions of the agents; Hobbes solves it by changing the physical conditions of the environment. To Hobbes, a logical correlation between minds is "vain imagination" compared to the tangible reality of the sword. Thus, despite his reputation for pessimism, Hobbes's rejection of superrationality is not merely an emotional prejudice but a structural necessity of his political science: without a sovereign to enforce the correlation of actions, the correlation of reasoning is irrelevant to self-preservation.
