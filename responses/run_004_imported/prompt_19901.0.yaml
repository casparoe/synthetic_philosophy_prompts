answer: |-
  **Scenario: The Philological Translation Project**
  A team of linguists is producing a critical edition of a newly discovered corpus of 500 ancient tablets. For each tablet $T_i$, a specialist translates the text based on grammar, lexicon, and context, warranting a high degree of confidence that translation $Tr_i$ is accurate. However, the lead editor, aware of the fragmentary nature of the dialect and the inevitable cognitive fatigue involved in such a massive undertaking, is equally confident that the *corpus as a whole* contains at least one significant mistranslation.

  **Analysis**
  This case instantiates the **Preface Paradox**, and it resists redescription as a Lottery case due to the **heterogeneity of justificatory grounds**. In Kyburg's Lottery, the justification for believing any individual proposition ("Ticket $n$ will lose") and the justification for denying the conjunction ("Not all tickets will lose") stem from the *same* source: the statistical structure of the chance setup. The uncertainty is intrinsic to the objects themselves.

  In the Translation case, the justification for each $Tr_i$ is **first-order evidence** (semantic and syntactic analysis specific to that tablet), whereas the justification for the negation of the conjunction is **second-order evidence** (inductive humility regarding human reliability and process complexity). You cannot redescribe this as a Lottery without stripping the individual translations of their specific linguistic warrant and replacing it with a generic reliability probability. Doing so would misrepresent the epistemic position of the linguist, who believes $Tr_i$ because she *understands* the text, not because she thinks it is statistically unlikely to be otherwise. Thus, the tension here arises not from the aggregation of independent statistical risks (Lottery), but from the conflict between local evidential success and global fallibility (Preface).
