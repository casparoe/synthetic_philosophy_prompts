answer: |-
  Two philosophers are stuck in an elevator. It's pouring rain outside.

  The first philosopher looks out the window and says, "It's raining, but I don't believe it."

  The second philosopher sighs. "You can't assert that. That's Moore's Paradox."

  The first replies, "But it's logically possible! I could be ignorant of the weather."

  "True," says the second. "But assertion expresses belief. To assert *P* is to represent yourself as believing *P*. So asserting *P* while denying you believe *P* is pragmatically self-defeating."

  The first philosopher thinks for a moment, then points at the second and says, "Okay. It's raining, but *you* don't believe it."

  The second nods. "That's perfectly fine."

  "See?" says the first. "The rain didn't stop. My ignorance didn't lift. The facts of the world are identical. I just shifted the indexical from the speaker to the hearer."

  The second philosopher shakes his head. "Congratulations. You haven't solved the paradox. You've just realized that the problem isn't the contradiction in the world, but the commitment in the speech act. You made it logically coherent by making it *my* problem."
