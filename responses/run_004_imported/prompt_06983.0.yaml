answer: |-
  **The Gauge Fix**

  Simon stared at the hologram hovering above his desk, the amber wireframe of Sector 7 pulsing like a slow heartbeat. It was a perfect cube of cityscape, suspended in the audit void. Outside the cube, the data was solid: traffic flows, pedestrian counts, energy consumption. Every variable locked into place with the comforting rigidity of cause and effect.

  But inside the cube, the wireframe shimmered. It was blurred, like a photograph taken while shaking the camera.

  "Still can't resolve it?" The voice came from the doorway. Director Hames leaned against the frame, holding a mug of synthetic coffee.

  "Two solutions," Simon said, not turning around. "Both satisfy the boundary conditions perfectly. Both conserve mass-energy. Both fit the entry and exit logs for every citizen who passed through during the blackout."

  "And yet?"

  "And yet they aren't the same." Simon manipulated the controls. The blur sharpened into the first configuration. **Solution Alpha.** Inside the sector, the people moved in straight, efficient lines. The air flow was laminar. It was a quiet ten minutes.

  He toggled the switch. **Solution Beta.** The wireframe twisted. Inside the sector, the same people wandered. They stopped to tie shoes. They bumped into each other. A child dropped an ice cream cone; in Solution Alpha, the child had never bought one. Yet, at the exact second the blackout ended, every person in Solution Beta stepped out of the sector occupying the exact same position, with the exact same velocity and memory state, as their counterparts in Solution Alpha.

  "The Hole Argument," Hames said, stepping into the room. "Classic indeterminism. The field equations don't care what happens in the gap, as long as the edges stitch up."

  "It matters," Simon said. His voice was tight. "My wife was in there."

  Hames softened. "Elena? She's home, isn't she? She's healthy?"

  "Yes. She walked in the front door at 18:00 exactly. She remembers buying groceries. She remembers the walk." Simon gestured at the shimmering cube. "In Solution Alpha, she walked straight down 4th Avenue. In Solution Beta, she took the alley. She stopped to look at a stray cat. She was delayed by thirty seconds, compensated by walking faster later."

  "So she's home. The point-coincidence holds. She intersected with the front door at the right time. What are you worried about?"

  Simon killed the hologram. The room plunged into dim blue light. "In Solution Beta, she saw the cat. In Solution Alpha, she didn't."

  "Does she remember the cat?"

  "No. The memory wipe was part of the blackout stabilization. Her neural state at the boundary is identical in both solutions."

  "Then the cat doesn't exist," Hames said, taking a sip of coffee. "If there's no trace in the mind, no trace in the matter outside the hole, then the difference is gauge freedom. It's mathematical noise. You're treating the points of spacetime like they have names, Simon. Like '4th Avenue' is a real thing independent of the people walking on it. It isn't. It's just where the walking happens."

  "That's the relationalist line," Simon muttered. "Sophisticated substantivalism. I know the textbook answer. If I drag the metric around inside the hole, I haven't changed the physics, I've just changed the labels."

  "Exactly. It's like asking if the universe shifted three inches to the left while you slept. If everything shifted, including the rulers, the question is meaningless."

  "But what if *I* didn't shift?" Simon stood up, walking to the window. The real city lay outside, rain streaking the glass. "What if the points *do* have identity? What if there is a fact of the matter about whether she was on 4th Avenue or in the alley, even if no instrument can ever measure it?"

  "Then physics breaks," Hames said gently. "Then you have indeterminism. You have a universe where the past doesn't determine the future, even in principle. You have ghosts in the machine."

  "I live with ghosts," Simon said.

  He turned back to the desk. He pulled up the file for Elena's transit. He looked at the timestamp of her entry. Then the timestamp of her exit. Between them lay the ten-minute Hole.

  If he filed Solution Alpha, he was certifying that the universe was deterministic, that the interior of the hole was smooth and empty. He was saying that the points didn't matter, only the connections.

  If he filed Solution Beta, he was certifying that the interior was turbulent, that reality had wavered. But more than that, he was admitting that something had happened to Elena that was now erased. A moment of connection with a stray animal. A pause in her day. A tiny deviation that was subsequently smoothed over by the laws of physics to ensure she arrived home on time.

  "If I file Beta," Simon said, "I'm saying she lost something."

  "You're saying she lost a label," Hames corrected. "She didn't lose the experience. She never had the experience in a way that persists. If it doesn't persist, it didn't happen. That's the only definition of 'happen' we have."

  Simon looked at his hands. He thought about the nature of memory. Was a memory just a state at the boundary? Or was it the path taken to get there?

  He thought about the arguments he'd read in grad school. Earman and Norton. The idea that if you believe spacetime is a substance, you doom yourself to radical indeterminism. The only way to save causality is to deny that the points exist without the fields. To say that 'here' is only 'here' because something is happening 'here'.

  If nothing happened in the alley that left a mark, was the alley real?

  "Elena asked me this morning if she looked tired," Simon said.

  "And?"

  "I told her no. But I was looking for the cat."

  Hames set the mug down. "Simon. You have to file. The sector needs to be reintegrated."

  Simon sat back down. He hovered his finger over the console. Two buttons. **Alpha** or **Beta**.

  If he chose Alpha, he affirmed that the universe was a clockwork mechanism, that his wife's journey was a straight line through a substantival void. He affirmed that the question 'where was she?' had no answer because 'where' was a relation, not a container.

  If he chose Beta, he affirmed that the universe was fluid, that reality could ripple and settle without leaving a wave. But he also affirmed that there was a truth hidden in the gap, a truth that was fundamentally inaccessible. A truth that said she had paused, and that pause was real, even if it was forgotten.

  He realized then that his anxiety wasn't about the physics. It was about the silence. The Hole Argument proved that the universe didn't have to decide what happened inside the hole until something touched the boundary. For those ten minutes, Elena had existed in a superposition of paths. She had been everywhere and nowhere.

  To file the report was to collapse the wave function. To force the universe to choose a history.

  "Does it matter?" Simon asked. "Really?"

  "To the Bureau? No. To the equations? No." Hames paused. "To you?"

  Simon looked at the empty space where the hologram had been. He thought about the stray cat that might have existed, might have been petted, might have purred. He thought about the version of Elena who had stopped, and the version who hadn't. They were both her. They were both not her. They were the same woman walking through the door.

  The substantivalist wants the points to have souls. The relationalist knows only the meetings matter.

  Simon typed a command. He didn't choose Alpha. He didn't choose Beta.

  He selected **Null**.

  "What are you doing?" Hames asked.

  "Flagging the region as gauge invariant," Simon said. "Certifying that the interior description is physically meaningless. Only the boundary coincidences are filed."

  "That's... technically correct. But it leaves the interior undefined forever."

  "Yes," Simon said. "It leaves it open."

  He stood up and grabbed his coat. "I'm going home. She's making dinner. I don't care what route she took to get to the kitchen. I care that she's there."

  "Simon," Hames called as he reached the door. "You know that by filing Null, you're admitting the theory doesn't describe reality inside the hole. You're admitting we don't know what existence is."

  Simon opened the door. The rain had stopped. The city lights reflected on the wet pavement, shimmering like a wireframe waiting to be resolved.

  "We know what matters," Simon said. "The rest is just coordinate noise."

  He stepped out into the hallway, leaving the hole open behind him, a perfect, unresolved silence where the world hadn't yet decided what it was.
