answer: |-
  The dispute on your trading floor is not merely a quibble over market mechanics; it is a live recurrence of one of the oldest problems in Western metaphysics. When traders argue whether a Polymarket contract like "Will Candidate X win the election?" is *already* true or false, they are rehearsing Aristotle's famous "sea-battle" argument from *De Interpretatione* 9. One camp, insisting on a determinate truth value, fears that without it, the market lacks a factual anchor. The other camp, insisting on an open future, fears that admitting a present truth value surrenders to fatalism.

  To resolve this, we must distinguish between the semantics of our claims (what makes a sentence true) and the metaphysics of time (how the future exists). After weighing the leading philosophical accounts—Peirceanism, Supervaluationism, Relativism, and Ockhamism—I argue that **Ockhamism** provides the most robust framework. It preserves the logical structure required for rational trading (bivalence) without entailing the metaphysical prison of fatalism. The price in a prediction market reflects epistemic uncertainty about a contingent truth, not ignorance of a necessary fact.

  ### The Threat of Bivalence

  The intuition that bivalence threatens openness is powerful. It stems from what is often called the "Principle of Prior Truth." If the proposition *p* ("Event E will occur") is true *now*, then it seems that E *must* occur. If *p* were to fail to occur, then *p* would have been false, contradicting our assumption that it is true. Since we cannot change the truth values of propositions about the present (just as we cannot change the past), it follows that we cannot change the future. The future appears "fixed" in the same way the past is.

  This argument conflates two distinct modalities: **truth** and **necessity**. The fatalist assumes that if a proposition is *true*, it is *necessarily true*. But this is a logical error. A proposition can be contingently true. "I am sitting" is true now, but not necessarily true; I could stand up. The fatalist argues that future truths are different because they seem to refer to events we haven't caused yet. However, the logical form is identical. To claim that a future truth necessitates the event is to confuse the map (the proposition) with the territory (the event). The proposition is true *because* the event will happen, not vice versa. The direction of grounding runs from world to word, not word to world.

  ### The Contenders

  To see why Ockhamism is superior, we must see why its rivals fail to capture the reality of trading.

  **1. Peirceanism (The Open Future View)**
  Named for C.S. Peirce and developed by A.N. Prior, this view denies bivalence for future contingents. On this account, "Event E will occur" is neither true nor false until E happens.
  *   *Merits:* It perfectly preserves the intuition of an open future. There is no "fact of the matter" yet.
  *   *Defects:* It breaks classical logic. The Law of Excluded Middle (*p* or not-*p*) fails, because if neither disjunct is true, the disjunction is not true. More critically for traders, it makes market assertions semantically defective. If I buy a "Yes" share, I am asserting "E will occur." If Peirceanism is right, I am asserting something that currently has no truth value. This renders the concept of a "correct prediction" incoherent until the moment of resolution. It turns trading into betting on the *emergence* of truth rather than the *discovery* of it, which undermines the market's function as a discovery mechanism.

  **2. Supervaluationism (The Branching History View)**
  Developed by Richmond Thomason, this view suggests that truth is defined over all possible futures. A statement is "super-true" if it is true in *all* possible histories, "super-false" if false in all, and truth-valueless otherwise.
  *   *Merits:* It saves the Law of Excluded Middle (since in every history, either *p* or not-*p* holds) while denying bivalence for specific contingents.
  *   *Defects:* It makes "truth" too abstract for practical agency. In a prediction market, I am not betting on whether "E will occur" is true in *every* possible history (that would be a certainty, priced at 100%). I am betting on whether it is true in *the* history that becomes actual. Supervaluationism struggles to account for the "Thin Red Line"—the specific path of actuality we are all riding. By treating the actual future as just one among many branches without semantic privilege *now*, it fails to explain why the market resolves to a single payout.

  **3. Relativism (The Assessment-Sensitive View)**
  John MacFarlane's relativism suggests truth is relative to a "context of assessment." A claim can be indeterminate when uttered but determinate when assessed later.
  *   *Merits:* It elegantly explains retrospective evaluation ("You were right").
  *   *Defects:* While excellent for analyzing speech acts, it complicates the ontological status of the contract. If truth is relative to assessment, there is no stable fact that the market converges upon; there are only shifting perspectives. For a market to settle, there must be a context-independent fact of the matter at resolution. Relativism risks making the settlement itself relative, which is incompatible with the binary payout structure of platforms like Kalshi.

  ### The Case for Ockhamism

  Ockhamism, named for William of Ockham, maintains that future contingent propositions *are* determinately true or false now, but their truth does not imply necessity. This view posits a "Thin Red Line" of actuality running through the branching tree of possibilities.

  Ockhamism survives scrutiny because it disentangles **semantic settledness** from **causal necessitation**.
  1.  **It preserves classical logic:** Traders can rely on standard probability theory, which assumes bivalence. A price of 60% means there is a 60% epistemic probability that the proposition is *true*, not that it is 60% "true."
  2.  **It respects agency:** The truth of "I will buy a share" is determined by my future action. The truth value does not force my hand; my hand determines the truth value. The proposition is a *reflection* of the future, not a *constraint* on it.
  3.  **It explains market resolution:** When the event occurs, the market doesn't *make* the proposition true; it *reveals* that it was true all along. This matches the trader's experience of "being right" or "being wrong."

  The fatalist objection—that this makes the future fixed—fails because it assumes that for a proposition to be true now, there must be some *present* physical state that necessitates it. Ockhamism denies this. The truth-maker for a future contingent is the *future event itself*. The proposition is true now, but its truth is grounded in something that has not yet happened. This is metaphysically unusual, but not contradictory. It simply means that truth is not always a function of present existence.

  ### Implications for Prediction Markets

  Adopting the Ockhamist position clarifies the metaphysical status of your unresolved contracts.

  First, **the price is not a measure of ontological indeterminacy.** If Supervaluationism were true, a 60% price would represent the proportion of branching histories where the event occurs. But on the Ockhamist view, there is only one actual future. The 60% price reflects *epistemic ignorance*. The fact of the matter is already settled in the "Thin Red Line" of actuality, but the market participants do not know it. This validates the "ignorance of an already-settled fact" camp, but strips it of its fatalist sting. The fact is settled *semantically*, but not *causally*.

  Second, **trading is an act of discovery, not creation.** When you buy a "Yes" share, you are aligning your capital with a proposition that is (unknown to you) either true or false. You are not helping to "make" it true through the act of betting (unless your bet is large enough to influence the outcome, which is a separate causal issue). You are attempting to epistemically access the actual future branch.

  Third, **openness is preserved.** The future is open not because the propositions lack truth values, but because the truth values of those propositions are not *necessitated* by the past. The fact that "Event E will occur" is true now does not mean it was *inevitable* given the state of the world ten years ago. It means that given the branching structure of time, we are on the branch where E occurs. We could have been on a different branch (in a counterfactual sense), but we are not.

  ### Conclusion

  The dispute on your trading floor stems from a conflation of truth with necessity. The Peircean, Supervaluationist, and Relativist accounts all attempt to save openness by sacrificing the classical truth values that make rational assertion and market settlement possible. They render the trader's claim "E will happen" semantically defective until the event resolves.

  The Ockhamist position is the only one that allows traders to speak meaningfully about the future while maintaining that the future is not causally fixed. A prediction market contract is a proposition about the "Thin Red Line" of actuality. It is already true or false. The price represents the collective uncertainty of the crowd regarding which branch is actual. This admits a form of "settledness," but it is a semantic settledness, not a metaphysical prison. The future is open because we are the ones who walk the path that makes the proposition true; the truth of the proposition does not walk the path for us.
