  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. The dashboard. A specific feature example to ground the abstract debate. Let's pick something classic, like a "negation" feature or a "topic" feature. Let's go with a specific semantic concept, maybe "legal terminology" or "negation." Let's choose "negation" as it's easy to steer.
