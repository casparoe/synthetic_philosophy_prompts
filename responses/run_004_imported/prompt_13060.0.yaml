answer: |-
  **MEMORANDUM**

  **TO:** Historic Preservation Commission
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding 1888 Feed Store Designation

  **Background**
  We are deadlocked on the Feed Store case. The facts are undisputed: the structure occupies the original footprint, maintains the original design, and has functioned continuously since 1888, but contains no original material. The ordinance requires that a Landmark must have "retained their historic character since original construction."

  **Recommendation**
  I recommend we **approve** the Landmark designation.

  **Reasoning**
  Our disagreement stems from whether "Historic Character" is synonymous with "Historic Fabric." I argue it is not.

  In preservation practice (specifically the Secretary of the Interior's Standards), "Integrity" is composed of seven aspects: location, design, setting, materials, workmanship, feeling, and association. "Materials" is only one of seven. This building retains integrity of *Location, Design, Feeling, and Association*. While it has lost Integrity of *Materials*, the Ordinance specifies "Character," not "Fabric." Character is the sum of the visual and functional identity perceived by the public. Since the replacements were in-kind and maintained the 1888 design, the *Character* has been retained, even if the *Matter* has not.

  To rule otherwise would establish that a building's historic status is a biological clock that resets with every repaired shingle. This would punish owners for maintaining structures rather than letting them decay to preserve "original" scraps.

  **Engaging the Dissent**
  I understand the counter-argument: if we grant this, we risk devaluing the "original construction" clause of our Ordinance, potentially allowing modern replicas to claim tax abatements.

  That is a valid concern, but it is a matter of **policy precedent**, not this specific case. If you intend to vote "No," I ask that you ground your objection there: argue that the risk to future precedent outweighs the continuity of this specific site. Do not argue that the building is "not the same." Legally and culturally, it is the same entity; the only question is whether our Ordinance values *continuity of form* over *continuity of matter*.

  I believe our Ordinance prioritizes the former. I look forward to discussing this distinction at the vote.
