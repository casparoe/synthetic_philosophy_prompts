prompt: |-
  I'm a software engineer on a small, fully remote team of about eight people. Over the past couple of years we've settled into unwritten conventions for things like commit-message formatting, branch naming, and pull-request etiquette: no one proposed or voted on any of it, newcomers pick it up within days just from watching how things are done, and anyone who drifts from it gets a quiet correction. The question stopped being academic when we merged codebases with another team that had its own, equally workable habits, and for the first time we had to decide, as a combined group, which set of habits to keep. Please describe the most important implications of David Lewis's account of convention -- a regularity sustained by common knowledge, self-fulfilling mutual expectation, and the fact that some equally good alternative regularity was always available -- for (a) why unilaterally switching to a different approach feels far costlier than the size of the underlying disagreement would warrant, and (b) what it would actually take to engineer a deliberate switch rather than let the merged team's habits settle by drift. I'm also curious where Lewis's picture, built to explain pure coordination, stops being adequate once one side's convention has picked up a mild sense of obligation that the other team never felt bound by at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer, small fully remote team (8 people), experienced with organic team conventions. Recently merged with another team.
      *   **Context:** The team had unwritten conventions (commit messages, branch naming, PR etiquette) that emerged organically (Lewisian conventions). Now, after a merger, they need to decide on a unified set of habits.
      *   **Core Task:** Explain the implications of David Lewis's account of convention (*Convention: A Philosophical Study*, 1969) for this specific situation.
      *   **Specific Questions:**
          1.  Why does unilaterally switching feel costlier than the disagreement warrants? (Coordination problem/Equilibrium).
          2.  What does it take to engineer a deliberate switch rather than letting drift happen? (Common Knowledge/Salience).
          3.  Where does Lewis's picture fail when "obligation/normativity" enters the mix? (Normative force vs. Coordination).

  2.  **Deconstruct David Lewis's Theory of Convention:**
      *   **Definition:** A regularity $R$ in behavior among a population $P$ in a recurrent situation $S$ is a convention if:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *on the condition that* others do (coordination equilibrium).
          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem just as well (arbitrariness).
          5.  These facts are *common knowledge* (everyone knows, everyone knows everyone knows, ad infinitum).
      *   **Key Insight:** Conventions are solutions to coordination problems (like driving on the left vs. right). The specific choice matters less than *agreeing* on a choice.

  3.  **Address Question (a): Why does switching feel costlier than the disagreement warrants?**
      *   *Lewisian Lens:* This is about Coordination Equilibria.
      *   *Explanation:* The cost isn't in the technical merit of `feat/` vs `feature/`. The cost is in the *mismatch*. If I use `feat/` and you use `feature/`, our automation breaks, or I get confused.
      *   *The "Cost":* It's not the effort of typing more characters; it's the cognitive load of tracking exceptions, the risk of CI/CD failures, and the breakdown of the "expectation" layer.
      *   *Equilibrium:* The team is in a stable equilibrium. Moving to a new one requires moving *together*. Unilateral movement creates a temporary state of *non-equilibrium* (chaos) which is high cost.
      *   *Key Term:* "Coordination Penalty."

  4.  **Address Question (b): What does it take to engineer a deliberate switch?**
      *   *Lewisian Lens:* Common Knowledge and Salience.
      *   *Explanation:* Organic conventions grow via repeated interaction and signaling. Engineered conventions need a "focal point" (Schelling point).
      *   *Requirements:*
          1.  **Public Declaration:** It can't be quiet. It must be common knowledge that "We are now doing X."
          2.  **Arbitrariness Acknowledgement:** Acknowledge that the old way wasn't "wrong," just different. This reduces defensiveness.
          3.  **Simultaneous Shift:** Everyone needs to switch at once (or via a structured migration) to maintain the equilibrium.
          4.  **Enforcement/Signaling:** Since the "natural" expectation is the old way, new signals (linters, PR templates) are needed to reinforce the new expectation until it becomes self-sustaining.
      *   *Key Term:* "Common Knowledge" (not just shared knowledge).

  5.  **Address Question (c): Where does Lewis's picture fail (Obligation/Normativity)?**
      *   *Lewisian Lens:* Lewis explicitly tried to reduce normativity to preferences + expectations. He was skeptical of genuine "oughts" beyond prudential reasons.
      *   *The Problem:* In the merged team, one side feels "This is the *right* way" (normative/moral/quality obligation), while the other sees it as "This is the *easy* way" (coordination).
      *   *The Breakdown:* Lewis's conventions are arbitrary. If Team A believes their convention is *technically superior* (not arbitrary), it's no longer a pure Lewisian convention; it's a belief about *correctness*.
      *   *Implication:* You can't solve this with coordination logic alone. You need to address the *truth claim* or the *value judgment*. If one side feels obligated by quality standards, they will resist a "worse" convention even if it coordinates better.
      *   *Key Term:* "Normative Force" vs. "Coordination Incentive."

  6.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the scenario (classic coordination problem). Briefly define Lewis's core criteria (Regularity, Expectation, Arbitrariness, Common Knowledge).
      *   **Section 1: The Cost of Switching (Coordination Equilibria).** Explain that the cost is friction/mismatch, not technical merit. Use the "driving on the left/right" analogy.
      *   **Section 2: Engineering the Switch (Common Knowledge & Salience).** Contrast organic drift with deliberate design. Emphasize the need for public, simultaneous agreement and tooling to enforce the new "common knowledge."
      *   **Section 3: The Limits of Lewis (Normativity).** Discuss the "arbitrariness" condition. If one team thinks their way is *better*, Lewis's model strains. Introduce the conflict between "coordination" and "correctness."
      *   **Conclusion:** Practical advice for the engineer.

  7.  **Refine the Tone:**
      *   Keep it professional but philosophically rigorous.
      *   Use software engineering analogies (CI/CD, linters, onboarding).
      *   Ensure the distinction between "shared knowledge" and "common knowledge" is clear (crucial for Lewis).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain "Common Knowledge" clearly? It's often misunderstood. *Adjustment:* Make sure to distinguish "I know" from "I know that you know that I know."
      *   *Check:* Did I address the "obligation" part? *Adjustment:* Ensure I highlight that Lewis treats obligation as derived from preference for coordination, whereas the team might feel intrinsic obligation.
      *   *Check:* Is the advice actionable? *Adjustment:* Add specific steps for the "engineered switch" section (e.g., RFC process, linters).

  9.  **Final Polish:** Check against the prompt's specific phrasing ("unilaterally switching," "engineer a deliberate switch," "mild sense of obligation"). Ensure all are hit. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to get too bogged down in philosophical jargon. Keep it grounded in the software team context while accurately representing Lewis. The user is an engineer, not a philosopher, but they asked for Lewis's account specifically.

  *(Final Plan)*:
  1. Intro: Lewis's Convention in a nutshell.
  2. Part A: The Coordination Equilibrium (Why switching hurts).
  3. Part B: Common Knowledge & Salience (How to switch deliberately).
  4. Part C: The Normativity Gap (When "better" beats "agreed").
  5. Practical Takeaway.cw
answer: |-
  This is a textbook example of a coordination problem, and David Lewis's *Convention: A Philosophical Study* (1969) provides the precise vocabulary to diagnose why your merger is friction-heavy and how to resolve it.

  Lewis defines a convention as a regularity in behavior that persists because:
  1.  **Regularity:** Everyone conforms.
  2.  **Expectation:** Everyone expects everyone else to conform.
  3.  **Preference:** Everyone prefers to conform *on the condition that* others do (a coordination equilibrium).
  4.  **Arbitrariness:** There is at least one alternative regularity that would have worked just as well.
  5.  **Common Knowledge:** All the above facts are known by all, known to be known by all, and so on.

  Here is how Lewis's framework applies to your merged team's situation.

  ### (a) Why unilaterally switching feels costlier than the disagreement warrants

  To an outsider, the difference between `feat/login` and `feature/login` is trivial. To your team, switching unilaterally feels expensive. Lewis explains this through the concept of a **coordination equilibrium**.

  In a Lewisian convention, the value of the action is not intrinsic; it is relational. The utility of writing a commit message in Style A is high *only if* everyone else writes in Style A. If you switch to Style B while everyone else stays on Style A, you haven't just changed a preference; you have broken the equilibrium.

  **The "Cost" is Mismatch, Not Merit**
  Lewis argues that the "cost" of a convention is rarely about the effort of the act itself (typing 6 characters vs. 8). The cost is the **penalty for mismatched expectations**.
  *   **Cognitive Load:** When you see a branch named `feature/`, your brain automatically predicts certain automation scripts will run. If someone uses `feat/`, your automation might fail, or worse, you have to pause and verify. That pause is the cost.
  *   **Signaling Failure:** Conventions act as signals. A specific commit format signals "this is ready for review." If the signal is ambiguous, the receiver must spend energy verifying the intent.
  *   **The Unilateral Trap:** If you switch unilaterally, you are effectively opting out of the coordination game. You are forcing others to update their expectations to match you, without their consent. In Lewis's terms, you are destroying the "mutual expectation" pillar. The friction you feel is the team's immune system reacting to a loss of predictability.

  **Implication:** The resistance you feel isn't stubbornness; it is the rational preservation of a stable equilibrium. The cost is high because the value of the convention lies entirely in its *universality*, not its *content*.

  ### (b) What it takes to engineer a deliberate switch

  Your original team's conventions emerged via **drift**. This works in small, stable groups because repeated interaction slowly builds "common knowledge." You watched others, they watched you, and eventually, everyone knew that everyone knew the rules.

  In a merger, you cannot wait for drift. You have two competing equilibria. To engineer a switch, you must artificially construct **Common Knowledge** and establish a **Salient Focal Point**.

  **1. Elevate to Common Knowledge**
  In your original team, knowledge was likely "shared" (everyone knows the rule) but perhaps not strictly "common" (everyone knows *that* everyone knows). In a merger, you must make it explicit.
  *   **The Fix:** A verbal agreement in a meeting is not enough. A document in Confluence is not enough. You need a public signal that creates an infinite recursion of knowledge: "We all agree that we all agree to switch."
  *   **Action:** Hold a sync specifically to ratify the new standard. Record it. Pin it. Ensure that when a new hire asks, "What's the rule?", the answer is unambiguous.

  **2. Create a Schelling Point**
  Thomas Schelling (whose work Lewis built upon) noted that when people need to coordinate without communication, they look for a "focal point" that feels natural or salient.
  *   **The Fix:** You need to make one convention appear as the "obvious" choice to break the tie between the two teams' habits.
  *   **Action:** Don't just vote. Vote *plus* rationale that highlights salience. For example, "We are choosing Team B's convention because it matches the industry standard library we just adopted." This makes the choice feel less arbitrary and more like gravity.

  **3. Enforce the Expectation Mechanically**
  Lewisian conventions are self-policing because the expectation of conformity drives conformity. But during a transition, the expectation is weak. You need to outsource the expectation to tooling until it becomes habit.
  *   **Action:** Implement linters, CI checks, or PR templates that reject the old conventions immediately. This removes the burden of "quiet correction" from humans and places it on the system. It signals: "The expectation of conformity is now hard-coded."

  ### (c) Where Lewis's picture fails: The Problem of Normativity

  This is the most critical philosophical friction point in your merger. Lewis's account is designed for **pure coordination problems** (e.g., which side of the road to drive on). In pure coordination, the alternatives are truly arbitrary; driving on the left is not *better* than driving on the right, it is just *different*.

  However, you noted that one team feels a "mild sense of obligation" that the other never felt. This suggests that for one team, the convention has ceased to be arbitrary and has become **normative**.

  **The Breakdown of Arbitrariness**
  Lewis requires that an alternative regularity *could have been adopted instead.* If Team A believes their commit format is objectively superior for readability or auditability, they no longer view it as a convention; they view it as a **best practice**.
  *   **Lewis's View:** "We do X because you do X." (Prudential reason)
  *   **Team A's View:** "We do X because X is correct." (Moral/Technical reason)

  **The Conflict**
  When one side views the habit as a coordination signal and the other views it as a quality standard, Lewis's model strains.
  *   **Coordination Logic:** "Let's pick the one that causes the least migration pain."
  *   **Normative Logic:** "Let's pick the one that is technically superior, regardless of pain."

  If you try to solve this purely with Lewisian coordination (e.g., "Let's just flip a coin to save time"), the team with the normative attachment will feel you are asking them to degrade their code quality. They aren't just resisting a change in habit; they feel they are being asked to violate an obligation to engineering excellence.

  **Implication:** You cannot resolve this solely by establishing common knowledge. You must first resolve the **truth claim**.
  *   If the difference is truly arbitrary (e.g., hyphen vs. underscore), you must persuade the "obligated" team that the obligation is misplaced.
  *   If the difference is substantive (e.g., including JIRA tickets vs. not), then it is not a Lewisian convention; it is a policy decision based on trade-offs. You must debate the trade-offs, not just coordinate the behavior.

  ### Summary for your Team

  1.  **Acknowledge the Equilibrium:** Validate that the friction people feel isn't pettiness; it's the rational cost of breaking a coordination equilibrium.
  2.  **Manufacture Common Knowledge:** Don't let the new standard drift in. Announce it, document it, and tool it so that "everyone knows that everyone knows" the new rule.
  3.  **Check for Normativity:** Before voting, ask: "Does anyone believe their way is *technically superior*, or just *familiar*?" If someone believes it is superior, you are no longer solving a coordination problem; you are solving an architectural debate. Lewis's tools work only once you agree the options are roughly equal.

  By distinguishing between "habits we need to match" (Lewisian conventions) and "standards we need to uphold" (Normative obligations), you can prevent a process discussion from turning into a culture war.
