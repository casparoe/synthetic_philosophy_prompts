      *   **Point out the conflation:** Independence from ZFC $\neq$ Indeterminacy of Truth.
      *   **Explain the Realist perspective:** For realists, ZFC is incomplete, like Euclidean geometry without the parallel postulate. We seek axioms that capture the "intended interpretation" of sets.
      *   **Explain the criteria for new axioms:** It's not just "preference." There are extrinsic justifications (consequences, coherence, resolving other problems) and intrinsic justifications (self-evidence, conceptual necessity).
      *   **Pedagogical advice:** Present the debate *as a debate*. Don't present one side as settled fact.

