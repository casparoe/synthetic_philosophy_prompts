answer: |-
  You have hit upon what is arguably the single most famous and critical interpretive crux in the entire *Mulamadhyamakakarika* (MMK). Your intuition is sharp: if Nagarjuna spends twenty-one chapters dismantling the possibility of making positive metaphysical claims without smuggling in *svabhava* (intrinsic nature/essence), how can he end Chapter 22 by seemingly making a positive metaphysical claim about the essence of the Tathagata and the world?

  If you read that final verse as a standard metaphysical assertion, it **is** a contradiction. However, within the Madhyamaka tradition (and specifically in Jay Garfield's interpretation, which leans heavily on the Prasangika lineage and Wittgensteinian parallels), this is not viewed as an inconsistency. It is viewed as a necessary therapeutic move that relies on the doctrine of the **emptiness of emptiness**.

  Here is how scholars and practitioners resolve this apparent paradox, specifically tailored to the text you are reading.

  ### 1. The Status of the Statement: Therapy, Not Theory
  The primary way to resolve this is to change how we categorize the statement "The Tathagata has no essence."

  In Western analytic philosophy, we tend to treat statements as either true or false descriptions of reality. If I say "X has no essence," I am asserting a fact about X. If Nagarjuna asserts "Everything has no essence," he seems to be asserting a fact about everything, which would itself be an essence (the essence of being essenceless).

  Nagarjuna, however, views his statements as *upaya* (skillful means) or medicine.
  *   **The Disease:** The innate human tendency to reify concepts (to think "Tathagata," "Self," or "World" refer to independent, self-standing entities).
  *   **The Medicine:** The statement "There is no essence."
  *   **The Cure:** When the disease is cured, the medicine is no longer needed.

  In Chapter 24 (which you will reach later, but which informs the whole text), Nagarjuna explicitly addresses the objection you just raised. Opponents say: "If everything is empty, your words are empty too, so they can't deny anything." Nagarjuna replies that emptiness itself is empty (*sunyata-sunyata*).

  Therefore, the statement "The Tathagata has no essence" is not a claim about the *ultimate nature of reality*; it is a conventional tool used to dismantle the view that the Tathagata *has* an essence. It is a negation of a negation. It does not posit "essencelessness" as a new kind of essence; it simply removes the projector that was casting the image of "essence" in the first place.

  ### 2. The Two Truths and "Manner of Speaking"
  You noted that Nagarjuna says terms like "empty" or "non-empty" are only a "manner of speaking." This points to the doctrine of the **Two Truths**:
  1.  **Conventional Truth (*samvrti-satya*):** The world of language, causality, and distinct entities.
  2.  **Ultimate Truth (*paramartha-satya*):** The realization of emptiness, where no conceptual proliferations (*prapanca*) exist.

  The paradox arises if you think Nagarjuna is making an *Ultimate* claim using *Conventional* language. He isn't. He is using Conventional language to show that Ultimate Truth cannot be captured by language.

  When verse 22:16 says, "Whatever is the essence of the Tathagata, that is the essence of the world," it is speaking conventionally to establish an identity. It is saying: *In the realm of discourse where we talk about Tathagatas and Worlds, the rules governing them are identical.* Both are dependently originated. Both are empty.

  Garfield emphasizes this heavily. For Garfield, Nagarjuna is not a skeptic who denies the conventional world; he is an anti-foundationalist. The final verse is allowed because it is a **conventional truth about the limits of conventional truth.** It asserts that within the web of dependence, nothing stands outside the web—not even the Buddha.

  ### 3. Why the Final Verse is Necessary (The Soteriological Move)
  Why does Nagarjuna risk the contradiction to make this final assertion? Why not just stop at "We cannot say the Tathagata exists or does not exist"?

  If he stopped there, there would be a risk of **dualism**. A reader might think:
  > "Okay, the Tathagata is ineffable and beyond the world. The world is messy and empty, but the Tathagata is some mysterious, transcendent reality that we just can't talk about."

  This would turn the Tathagata into a *noumenon* (a Kantian thing-in-itself), which is exactly the kind of *svabhava* Nagarjuna is trying to dismantle.

  By adding the final verse, Nagarjuna drags the Tathagata back into the world. He asserts:
  > "The Tathagata is not a transcendent entity hiding behind the veil of Maya. The Tathagata is empty in exactly the same way a table, a thought, or a suffering being is empty."

  This sets the stage for the famous equation in Chapter 25: **Samsara is Nirvana.** If the Tathagata (the embodiment of Nirvana) has the same "essence" (i.e., lack of essence) as the world (Samsara), then enlightenment is not an escape *from* the world, but a correct seeing *of* the world.

  So, the verse is a strategic assertion designed to prevent the reification of Enlightenment itself.

  ### 4. Garfield's Specific Interpretive Lens
  Since you are reading Garfield, it helps to know his specific philosophical commitment. Garfield reads Nagarjuna through the lens of Wilfrid Sellars and Ludwig Wittgenstein.
  *   **Wittgenstein:** "Whereof one cannot speak, thereof one must be silent." But also, philosophical problems arise when language goes on holiday. Nagarjuna's negations bring language back to its proper use.
  *   **Sellars:** The "Myth of the Given." There is no foundational, non-conceptual knowledge that anchors our views.

  For Garfield, the final verse is not a metaphysical claim about the "stuff" of the universe. It is a claim about **ontology as a linguistic practice.** To say "The Tathagata and the world have the same essence (no essence)" is to say: *The grammatical rules for using the word 'Tathagata' are the same as the rules for using the word 'world'.* Neither word refers to a self-standing substrate.

  Garfield would argue this is not a contradiction because Nagarjuna is not asserting a proposition that claims to correspond to a mind-independent reality. He is clarifying the status of our conceptual scheme.

  ### 5. Summary: How to Read the Ending
  To answer your specific question: **Is this a genuine inconsistency?**
  *   **No,** provided you accept the Madhyamaka premise that the doctrine of emptiness applies to itself.
  *   **Yes,** if you read the text as trying to establish a positive metaphysical system (like Vedanta or Idealism).

  **How to keep it from contradicting what came before:**
  Read the final verse not as a **description** of the Tathagata, but as a **dissolution** of the distinction between the Sacred (Tathagata) and the Profane (World).

  1.  **Verses 1–15:** Dismantle the idea that the Tathagata is a self-existing entity (using the fivefold search and tetralemma).
  2.  **Verse 16:** Dismantle the idea that this dismantling creates a special, transcendent category for the Tathagata.

  The statement "neither has any essence whatsoever" is a *prasanga* (consequence). It means: "If you accept my previous arguments that the aggregates are empty, and you accept that the Tathagata is not separate from the aggregates, you are committed to the view that the Tathagata is empty. And since the world is just the aggregates, the world is empty too."

  It is a statement of consistency, not a new assertion of fact. It says, "My view is consistent: the Buddha is not an exception to the rule of emptiness."

  ### Recommendation for Moving Forward
  You are in a difficult but fertile spot. As you continue:
  1.  **Keep Chapter 24 in mind:** When you reach the "Examination of the Four Noble Truths," Nagarjuna explicitly defends himself against the charge of nihilism and self-contradiction. It will retroactively illuminate Chapter 22.
  2.  **Watch the word "Essence" (*Svabhava*):** Remember that for Nagarjuna, "essence" means *independent, uncaused, permanent existence*. To say something "has no essence" is just to say "it is dependently originated."
  3.  **Read Garfield's Commentary:** If you have access to Garfield's *The Fundamental Wisdom of the Middle Way* (the commentary, not just the translation), read his notes on 22:16. He explicitly tackles the "performative contradiction" objection there.

  You are reading the text exactly as it should be read: with suspicion toward its own assertions. That suspicion is, ironically, the very insight Nagarjuna wants you to cultivate.
