answer: |-
  You are not being squeamish, and your TA and students are making a classic category error. There is a very real, structurally significant gap in the inference they are drawing. While their grasp of the evolutionary biology is likely sound, their move from *genealogy* to *ontology* is invalid without several additional, highly controversial premises that Street herself does not endorse.

  Here is the sharp breakdown you can give your class to correct the record before Friday.

  ### 1. The Genetic Fallacy (Truth vs. Warrant)
  The most glaring gap is the conflation of **epistemic warrant** with **truth value**.

  The students are arguing:
  1.  Belief $B$ is caused by process $P$ (evolution).
  2.  Process $P$ is indifferent to truth.
  3.  Therefore, Belief $B$ is false.

  This is invalid. The origin of a belief does not determine its truth conditions. If I believe $2+2=4$ because a madman told me, and the madman is generally unreliable, my *warrant* for the belief is undermined, but the *truth* of the proposition remains intact.

  Evolutionary Debunking Arguments (EDAs) are primarily **epistemological**. They aim to show that even if moral realism were true, we could not *know* it (skepticism), or that we are not *justified* in believing it. They do not logically entail **error theory** (the ontological claim that all moral statements are false). To get to "ethics is dressed-up animal behavior" (nihilism/error theory), one needs the additional premise that *only* beliefs produced by truth-tracking processes can correspond to reality. That is a massive philosophical leap, not a biological given.

  ### 2. Misreading Street (Constructivism vs. Realism)
  Your students are treating Street's "Darwinian Dilemma" as an argument for nihilism. It is not. It is an argument against **Metaethical Realism**.

  Street is a **Humean Constructivist**. She agrees with the students that evolution did not track independent moral truths. But her conclusion is not "therefore there are no moral truths." Her conclusion is: "Therefore, there are no *independent* moral truths. Moral truths are constituted by our practical, valuing attitudes."

  For Street, the fact that evolution shaped our values doesn't debunk morality; it explains the *raw material* from which we construct moral truth. By jumping straight to nihilism, the students are skipping Street's actual positive view and assuming that Realism is the only alternative to Nihilism. That is a false dichotomy.

  ### 3. The "Third-Factor" Response (The Realist Counter)
  If you want to defend the possibility of Realism against the EDA, the strongest move is the **Third-Factor Explanation** (championed by David Enoch).

  The students assume a dichotomy: Either evolution tracked moral truth, or it was a coincidence. Enoch argues there is a third option.
  *   **Factor 1:** Evolution selects for survival/reproductive fitness.
  *   **Factor 2:** Survival (or at least, the basic goods required for it, like caring for offspring, avoiding pain) is *objectively good*.

  If survival is objectively valuable, then evolution *did* track moral truth, not by accident, but because the moral truth (survival is good) and the evolutionary pressure (select for survival) share a common anchor. The correlation between our moral beliefs and moral truth is not coincidental; it is mediated by the value of survival itself. This closes the "gap" Realists need without denying the biology.

  ### 4. The Scope Problem (Reflective Equilibrium)
  The students are assuming that our current moral judgments are identical to our Pleistocene adaptations. This ignores the capacity for **reflective equilibrium**.

  Evolution may have given us a "folk morality" (kin preference, reciprocity, disgust). But human moral reasoning allows us to critique and revise those impulses. We can recognize that kin preference is biologically natural but morally unjustifiable (nepotism). We can recognize that disgust at incest might be evolutionary, but our judgment about *why* it is wrong (harm vs. purity) is a product of reasoning.

  If we have the capacity to reflect on and override evolutionary impulses, then the EDA might debunk our *intuitions*, but it does not debunk our *considered judgments*. The move from "our instincts are biased" to "our ethics is *just* animal behavior" ignores the last 2,500 years of philosophical refinement on top of those instincts.

  ### 5. The Self-Defeat Worry
  Finally, push them on the normative premises of their own argument. The EDA relies on a normative epistemological principle: *"One ought not to hold beliefs produced by processes indifferent to truth."*

  Where does *that* norm come from?
  *   If it's a moral/normative truth, and all moral truths are debunked by evolution, then the premise of the debunking argument is itself debunked.
  *   If it's not a moral truth, why should we care about it?

  If evolution shapes *all* our cognitive faculties (including logic and scientific reasoning), a global debunking argument threatens to undermine the belief in evolution itself (a la Plantinga's Evolutionary Argument Against Naturalism). To avoid self-defeat, one must carve out a space for some normative truths to remain secure. If you carve out space for logic/science, it becomes much harder to explain why morality is uniquely vulnerable.

  ### Summary for the Class
  You can tell them this:
  > "You have correctly identified that evolution tracks fitness, not truth. But you have incorrectly inferred that this makes moral beliefs false.
  >
  > 1.  **Causation $\neq$ Falsity:** A belief can be caused by bias and still be true.
  > 2.  **Street $\neq$ Nihilist:** Street uses this to argue for Constructivism, not Error Theory.
  > 3.  **Realism has a Defense:** If survival is objectively good, evolution *did* track truth (Enoch's Third-Factor).
  > 4.  **Reflection Matters:** We can reason beyond our biological impulses.
  >
  > The EDA creates a problem for *justification*, not necessarily for *truth*. Moving from 'we can't prove our morals are true' to 'our morals are definitely false' is where the argument breaks."

  You aren't soft-pedaling; they've just conflated an epistemological challenge with an ontological conclusion.
