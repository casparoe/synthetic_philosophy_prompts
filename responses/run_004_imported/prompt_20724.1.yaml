prompt: |-
  I'm teaching the last unit of my metaethics seminar right now and figured I'd end on evolutionary debunking arguments, since it's always the part that gets the most reaction out of students (it's cross-listed with biology this year, so I've also got a few EEB majors in there who were delighted to hear philosophy finally "catching up" with biology). Last week everyone read Sharon Street's "Darwinian Dilemma" paper, and coming out of discussion section basically the whole room had converged on one conclusion: since our moral psychology was shaped by selection pressures that had nothing to do with tracking any independent moral truth -- we feel loyalty to kin and disgust at incest because ancestors wired that way out-reproduced the ones who weren't, not because incest is Really Wrong -- it just follows that none of our moral judgments are true, full stop, and ethics is basically dressed-up animal behavior. My TA, who's usually pretty careful about this stuff, thinks that's basically the right takeaway too, which has started to make me doubt myself.

  Here's my actual question: is there a real gap in the move from "this belief was produced by a process indifferent to independent moral truth" to "so no moral beliefs are true," or does that gap basically close once you accept the evolutionary story, and I've just been soft-pedaling the nihilist conclusion out of squeamishness for years? I'd like to give the class something sharper than "well, it's complicated" before their response papers are due friday, so if the inference really does have a hole in it, i'd like to be able to say exactly where it is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A philosophy professor teaching a metaethics seminar (cross-listed with biology).
      *   **Situation:** Teaching the final unit on evolutionary debunking arguments (EDAs), specifically Sharon Street's "Darwinian Dilemma."
      *   **Problem:** Students (and the TA) have converged on a strong nihilist conclusion: Evolution shaped moral psychology for fitness, not truth $\rightarrow$ Therefore, no moral beliefs are true/ethics is just animal behavior.
      *   **User's Doubt:** Is this inference valid? Is there a gap? Or is the user just being squeamish about nihilism?
      *   **Goal:** Provide a sharp, philosophically rigorous explanation of where the gap lies (if it does) to help students write better response papers. Avoid "it's complicated."

  2.  **Deconstruct the Students' Argument:**
      *   *Premise 1:* Our moral faculties were shaped by natural selection.
      *   *Premise 2:* Natural selection tracks reproductive fitness, not independent moral truth.
      *   *Conclusion:* Therefore, our moral beliefs are unlikely to be true (or none are true), and ethics is just dressed-up animal behavior.

  3.  **Evaluate the Inference (The "Gap"):**
      *   Is the move from "genealogy is non-truth-tracking" to "beliefs are false/unjustified" valid?
      *   *Short Answer:* No, there is a significant gap. The students are committing a version of the Genetic Fallacy, or at least overlooking the distinction between *explanation of origin* and *status of content*.
      *   *Key Distinction:* Debunking arguments usually target *justification/warrant*, not necessarily *truth*. Even if they target truth, they need a specific premise about the *independence* of moral truths.

  4.  **Identify Key Counter-Arguments/Philosophical Moves:**
      *   **1. The Pre-Established Harmony (Coincidence) Response:** Realists (like Enoch, Wielenberg) argue that even if evolution didn't *aim* at truth, it might have landed on it anyway. (e.g., survival is generally good, so beliefs promoting survival might align with moral truth).
      *   **2. The Third-Factor Response:** (Enoch's specific move). There's a common cause. Survival is valuable *and* evolution selects for survival. So the correlation isn't coincidental.
      *   **3. The Distinction between Justification and Truth:** EDAs are primarily epistemological (undermining warrant), not ontological (proving falsity). Even if my belief is caused by bias, it could still be true. (The "Madman" example: A madman tells me 2+2=4. He's unreliable, but the belief is true).
      *   **4. Street's Specific Target:** Street is a constructivist. She isn't arguing for nihilism; she's arguing against *Realism*. The students are misreading Street as supporting error theory/nihilism, whereas she uses the dilemma to motivate constructivism.
      *   **5. The "All or Nothing" Fallacy:** Even if *some* moral beliefs are distorted by evolution (e.g., tribalism), it doesn't follow that *all* are (e.g., impartial benevolence might be a later rational development).
      *   **6. The Self-Defeating Nature:** If evolution debunks morality, does it also debunk the belief in evolution? Or the logic used to make the argument? (Plantinga's EAAN applied to metaethics).

  5.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Acknowledge the TA/Students' intuition. It's a common reaction to Street. It feels powerful.
      *   *Direct Answer:* There *is* a real gap. It's not just squeamishness.
      *   *Point 1: Truth vs. Justification.* This is the biggest logical error. Explaining *why* I believe $X$ doesn't prove $X$ is false. (Genetic Fallacy).
      *   *Point 2: Street's Actual Conclusion.* Clarify that Street isn't a nihilist. She's a Humean Constructivist. She thinks moral truths exist, but they are constituted by our valuing attitudes. The students are turning her argument into an Error Theory.
      *   *Point 3: The Realist Counter-Attack (Third-Factor).* Mention Enoch. If survival is objectively good, evolution *does* track truth.
      *   *Point 4: The Scope Problem.* Evolution explains basic impulses (kin altruism), but not complex moral reasoning (human rights, utilitarianism). We have reflective equilibrium.
      *   *Point 5: The Self-Undermining Worry.* If we debunk all normative beliefs, we debunk the normative premises of the debunking argument itself (e.g., "we *ought* to believe what is true").

  6.  **Refining for the Audience (Professor to Professor):**
      *   Use technical terminology correctly (Error Theory, Constructivism, Epistemic Warrant, Genetic Fallacy).
      *   Keep it structured for lecture prep.
      *   Address the biology cross-list aspect (acknowledge the science is right, the philosophical inference is wrong).
      *   Tone: Collegial, precise, encouraging.

  7.  **Final Polish:**
      *   Make sure to explicitly answer the "squeamishness" question. (No, you're not being squeamish; they are making a category error).
      *   Highlight the specific confusion between *causal explanation* and *truth conditions*.
      *   Suggest specific readings/responses (Enoch, Vavova, maybe Joyce for the error theory contrast).

  8.  **Self-Correction during drafting:** I initially thought about focusing heavily on Plantinga, but that might distract from metaethics. Better to stick to Enoch and the distinction between Street's constructivism and the students' error theory. I need to make sure I emphasize that Street *rejects* the realist premise the students are attacking. They are attacking a straw man realist using Street's weapon, but then concluding nihilism instead of constructivism.

  9.  **Final Structure:**
      *   Direct Answer: There is a gap.
