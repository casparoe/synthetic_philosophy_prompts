      *   *Recommendation:* Authorize procedure.
      *   *Rationale:* We must prioritize the "socially integrated agent." Even if the RH is a distinct stream of consciousness (Parfit), it lacks the capacity to execute legal agency.
      *   *Addressing Faction 3:* Nagel is right that the concept might fail, but hospitals cannot operate on metaphysical indeterminacy. We need a decision rule. The "speaking self" is the only one that can navigate the world.
      *   *Addressing Faction 2:* Weighting the hand is fair philosophically, but the hand cannot manage the consequences of survival. The mouth speaks the law.
