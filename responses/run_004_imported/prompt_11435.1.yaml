      *   Tone check: Professional, empathetic, decisive.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing the RH's "No" lightly. It represents a potential wish to die. But since the LH says "Yes," proceeding honors the will to live. Withdrawing honors the will to die. In medicine, when in doubt regarding capacity, we usually err on the side of life *unless* there is clear evidence of prior wishes. Here, we have *current* conflicting wishes. The tie-breaker must be the legally recognized agent.

