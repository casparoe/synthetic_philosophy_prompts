      *   *Self-Correction on Neuroscience:* Ensure I get the lateralization right. Usually, LH = Speech/Right Hand/Right Visual Field. RH = Left Hand/Left Visual Field. The prompt says: "Asked aloud... wants tracheostomy." (LH). "Left visual field... left hand... consistent 'stop'." (RH). So LH says Live, RH says Die.
      *   *Legal Reality:* In the eyes of the law, there is one patient. The LH is the one that signed checks, talked to relatives, etc. The RH is a "silent partner." Ignoring the LH is legally indefensible. Ignoring the RH is ethically troubling but legally safer.
      *   *Decision:* The memo must recommend *treatment*. Withholding treatment based on the non-dominant (non-speaking) hemisphere's non-verbal signal is too risky legally and ethically (potential negligence).

  5.  **Drafting the Content (Iterative refinement):**
