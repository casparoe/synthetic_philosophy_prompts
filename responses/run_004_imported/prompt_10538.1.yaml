      *   *Political Philosophy:* He applies this method to the State. The Sovereign is an "Artificial Man." We construct the Commonwealth via covenant (definition/agreement), so we can know it with geometric certainty, unlike natural bodies.

  3.  **Address Challenge 1: Non-Euclidean Geometry:**
      *   *The Threat:* Euclid isn't the only game in town. Parallel postulate isn't self-evident truth.
      *   *Hobbes's Potential Reaction:* Hobbes cares about *consequences from definitions*, not necessarily "truth" in a Platonic sense. If you define space differently, you get different theorems.
      *   *Constructivist Angle:* Hobbes emphasizes generation by motion. Non-Euclidean geometry (like Riemannian) often relates to curved surfaces. Can you generate a sphere by motion? Yes.
