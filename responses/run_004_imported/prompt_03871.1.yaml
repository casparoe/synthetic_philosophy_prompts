answer: |-
  **Title:** The Singularity in the Machine: Why the Pasadena Paradox Breaks Expected Utility Theory

  **Introduction**

  You know better than anyone that in experimental physics, a model is judged not just by where it works, but by how it breaks. When a equation yields a singularity, we do not simply declare the universe undefined; we acknowledge that the theory has reached the boundary of its domain of validity. For decades, Expected Utility Theory (EUT) has been posited as the fundamental calculus of rational choice, the "Newton's Laws" of decision theory. The St. Petersburg paradox was long treated as a mere friction to be smoothed over by bounded utility. The Pasadena paradox, however, is not friction. It is a structural crack in the foundation.

  While many theorists, including Mark Colyvan, have attempted to treat Pasadena as a pathological edge case to be walled off by dominance reasoning or technical patches, this essay argues the opposite. The Pasadena paradox exposes a deep, normative flaw in Expected Utility Theory. It demonstrates that without an explicit axiom of integrability (absolute convergence), EUT violates its own core requirement of invariance under affine transformations. This is not a bug that can be patched without altering the theory's claim to universality; it is a proof that EUT is mathematically incoherent for a non-trivial class of logically possible gambles.

  **The Mathematical Core: More Than Just Divergence**

  As you noted, the genius of the Pasadena game lies in its use of conditional convergence. In the St. Petersburg paradox, the expected value is $+\infty$. We can argue about whether infinity is a useful guide for choice, but the arithmetic is consistent in the extended reals. In Pasadena, the expectation is *undefined*. The series $\sum \frac{(-1)^{n-1}}{n}$ converges to $\ln 2$ only if summed in the specific order of the natural numbers. By the Riemann rearrangement theorem, a rational agent who partitions the sample space differently—perhaps grouping outcomes by "wins" and "losses" rather than temporal order—could calculate the expected value as $+\infty$, $-\infty$, or any real number in between.

  For a physicist, this looks like a coordinate system problem. If the value of an observable depends on the order in which you sum the eigenstates, the operator is not well-defined. In decision theory, the "operator" is the expectation function. If the output of the function depends on the arbitrary labeling or grouping of states, the function cannot serve as a normative guide for action.

  **The Defense of Pathology**

  The standard defense against Pasadena, often implicit in economic applications, is the "bounded utility" argument. This view holds that no agent has unbounded utility for money (or any good). Since marginal utility must diminish to zero, the payoff term $X_n$ in the expectation sum $\sum P(n)U(X_n)$ will decay fast enough to ensure absolute convergence. If the series is absolutely convergent, Fubini's theorem applies, order becomes irrelevant, and the paradox vanishes.

  Similarly, proponents of the "pathology" view argue that the Pasadena game is physically impossible. It requires a bank with infinite capital and a coin that can be flipped indefinitely. Since no such game exists in the causal universe, a normative theory of *human* choice need not account for it. Colyvan's appeal to dominance reasoning suggests we can bypass expectation entirely: if Game A pays more than Game B in every state, choose A, regardless of expectations.

  These arguments are seductive because they mirror the physicist's instinct to cut off integrals at the Planck scale. However, they fail as defenses of EUT *as a normative theory*.

  **Why It Is a Deep Flaw**

  The first reason the "pathology" defense fails is that normative theories are supposed to handle logical possibility, not just physical contingency. EUT is derived from axioms of preference (completeness, transitivity, independence, continuity). If a gamble can be described coherently within the axioms, the theory should yield a preference ordering. The Pasadena gamble is logically coherent; the payoffs are finite for every finite $n$, and the probabilities sum to 1. If EUT cannot rank this gamble against doing nothing (payoff 0), it is incomplete.

  But the second reason is fatal, and it concerns the invariance of utility scales. A cornerstone of von Neumann-Morgenstern utility is that utility functions are unique only up to positive affine transformation. If $U$ represents a preference set, then $V = aU + b$ (where $a > 0$) must represent the same preferences. In standard integration, $E[aU + b] = aE[U] + b$.

  In the Pasadena game, because the expectation is not absolutely convergent, this linearity breaks. Adding a constant $b$ to every outcome in the Pasadena game changes the terms of the series to $\frac{(-1)^{n-1}}{n} + \frac{b}{2^n}$. While the probability-weighted constant $\sum \frac{b}{2^n}$ converges absolutely to $b$, the interaction with the conditionally convergent part means that the *value* of the expectation becomes dependent on how the zero-point of utility is defined relative to the summation order.

  More critically, if we consider variations of the game where the probabilities are slightly perturbed, we can shift the expectation from defined to undefined. This implies that a rational agent's preference between two gambles could flip based solely on where they set the "zero" of their utility scale. A normative theory that tells you to accept a gamble if your zero-point is 0, but reject it if your zero-point is 10, is not a theory of rational choice; it is a theory of accounting conventions.

  **The Verdict: A Domain Restriction, Not a Patch**

  So, does this mean we must abandon EUT? No. But it forces a verdict that many theorists resist: **Expected Utility Theory is not a universal normative framework; it is a specialized tool valid only for integrable functions.**

  To "solve" Pasadena by imposing bounded utility or an axiom of absolute convergence is not merely applying a technical patch; it is admitting that the core intuition of EUT—that rationality consists in maximizing the weighted sum of outcomes—is mathematically unsustainable without severe restrictions.

  If we accept bounded utility to kill Pasadena, we concede that EUT cannot handle cases where agents care about things that might be unbounded (e.g., saving lives, eternal salvation, or even theoretical scientific discovery). If we accept an integrability axiom, we admit that there are coherent lotteries that rational agents simply cannot evaluate using expectation.

  This aligns with your background in physics. We do not say Newtonian mechanics is "wrong" because it fails at relativistic speeds; we say it has a domain of validity. The Pasadena paradox proves that EUT has a domain of validity, and that domain is smaller than the set of all coherent preference orderings.

  **Conclusion**

  The Pasadena paradox is not a mere curiosity. It is a reductio ad absurdum of the claim that Expected Utility is the sole arbiter of rational choice. The "pathology" defense attempts to hide the singularity by claiming no one will ever drive that close to it. But a map that leaves out the poles is useful for navigation, yet false as a representation of the globe.

  Therefore, the verdict is clear: **The Pasadena paradox exposes a deep structural flaw in Expected Utility Theory.** It proves that expectation maximization is ill-defined for conditionally convergent gambles and violates the affine invariance required by the theory's own axioms. While we can salvage EUT for practical use by restricting it to absolutely convergent cases (bounded utility), we must abandon the philosophical claim that it provides a complete, universal account of rationality. The theory does not need a patch; it needs a label stating its limits.
