prompt: |-
  Ok, weird ask but here goes. I just started a job at a small startup that does automated fact-checking labels for social posts, and this week someone fed our system the post "this post is rated false" as a joke, and it broke the labeler -- it kept flipping between true and false forever until we manually killed the job. My manager thought it was funny but now actually wants me to write up "how do we handle logically weird inputs like this" for the team wiki, and i realized my answer is basically just "lol its the liar paradox," which isn't gonna cut it. So can you write me an essay that goes through the main rival theories of truth people have proposed for handling the liar (Tarski's hierarchy of languages, Kripke-style truth-value gaps, paraconsistent views that just accept some contradictions as true, and contextualist views where the sentence's truth value shifts depending on when it's evaluated), and actually weighs them against each other? Don't give me a wishy-washy "they all have pros and cons" ending -- tell me which one comes closest to being right and defend that, even if the honest verdict ends up being "least bad option."
