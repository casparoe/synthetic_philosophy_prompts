      *   Honors Grandpa's view? Yes, by validating his belief in his crew.
      *   Honors the crew? Yes, by validating their discipline.

  8.  **Final Word Count Check:** Aiming for roughly 130-150 words per minute. 5 minutes = 750 words max. 4 minutes = 600 words min.

