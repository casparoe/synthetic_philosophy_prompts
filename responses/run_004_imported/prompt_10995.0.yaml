answer: |-
  Good morning. Thank you all for being here, and for the love you've shown our family this week.

  For thirty years, my grandfather wore the uniform of this town's fire department. But if you asked him what he did for a living, he wouldn't talk about medals or headlines. He'd tell you he was a husband, a father, a grandfather, and a firefighter, in that order. He was a man of quiet habits. He drank his coffee black, he polished his boots every Sunday, and he kept his life's commendations folded in a dresser drawer rather than hung on the wall.

  Many of you know the story of the fire on Elm Street. It's the story that defined his public life. The building was compromised. The Captain had given the order to evacuate. My grandfather's air was low. By every metric of safety and protocol, the job was done. But he went back in. He found two children in a bedroom the smoke had already claimed. He brought them out, and he carried the damage to his lungs and his knees for the rest of his life.

  The Department called it "above and beyond the call of duty." Grandpa hated that phrase. Whenever someone called him a hero, he'd deflect. He'd say, "I was only doing my job," or, "Any one of the guys on that crew would have done the same thing."

  For a long time, I thought he was just being modest. But lately, I've come to understand that he wasn't minimizing what happened; he was maximizing who he loved.

  When he said, "Any of the guys would have done it," he wasn't making a claim about physics or protocol. He was making a statement about his brothers. I see some of those brothers sitting in the second row. You followed the order that day. You trusted the Captain. You held the line outside so that the structure didn't take more of you than it already had. That took discipline, and it took courage.

  Grandpa knew that. He never looked down on you for staying out, and you never looked down on him for going in. That was the bond. He believed you *would* have gone in because he believed you all shared the same heart. In his mind, the "job" wasn't just the rulebook. The rulebook was there to keep firefighters safe so they could go home to their families. But the *job*—the real vocation—was to bring life out of the ash. Sometimes those two things aligned. That day, they didn't. He chose the life, and he paid the price for it.

  He refused the label of "hero" because he thought it set him apart. He didn't want to be set apart. He wanted to be one of the crew. But we, his family, and this town, we need to call it what it was. Not to separate him from you, but to thank him for us.

  There are duties we owe each other because we have to, and then there are the things we do because we can't imagine living with ourselves if we didn't. Grandpa lived in that second space. He expanded the definition of "duty" until it covered everything love required of him.

  To the firefighters here: He honored your discipline. To my family: He taught us that love isn't just a feeling; it's an action that costs you something.

  He kept that commendation in the drawer because he didn't need a piece of paper to tell him he did right. He knew it when he held those two children in his arms. And we know it now, because we are the community he left safer than he found it.

  Rest easy, Grandpa. You did the job. All of it. We'll take it from here.
