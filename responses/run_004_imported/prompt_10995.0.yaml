      *Wait, one nuance:* The prompt says he went back in *after* the captain ordered everyone out. This is insubordination technically, even if heroic. I need to be careful not to encourage recklessness, but frame it as a singular moment of sacrifice. The focus should be on the *cost* he paid and the *love* that drove it, rather than the rule-breaking itself. The crew followed orders; he followed a deeper instinct. Both served the greater good.

      *Revised plan for the "Crew" section:* Emphasize that Grandpa knew the orders were there for a reason (safety), but in that moment, he weighed the risk differently. He didn't judge them for staying; they didn't judge him for going. That mutual respect is the bond.

