answer: |-
  My friend was agonizing over two big life choices: buying a fixer-upper house, or uploading his consciousness to a server to live as pure code.

  I told him, "For the house, just make a pro/con list. It's a standard decision. You know what you value, you know what debt feels like."

  He said, "That's the problem. With the house, the 'me' signing the mortgage is the same 'me' fixing the leaky roof. But with the upload? The 'me' deciding is biological, but the 'me' experiencing it is software."

  I said, "So?"

  He said, "So I can't assign a value to the outcome. I can't know what it's like to be code until I'm code. But if I'm code, I won't care about the things Biological-Me cares about. I'm trying to make a rational choice, but the voter and the constituency are mutually exclusive."

  I said, "Well, you have to do something. Just guess."

  He said, "I can't. If I guess, I'm privileging my current ignorance over my future knowledge. But my future knowledge only exists if I make the choice."

  I said, "So what's the verdict?"

  He said, "I'm waiting for the future version of me to email me his approval."

  I said, "He can't. He doesn't exist yet."

  He said, "Exactly. It's the only rational move. I'm not saying 'no.' I'm saying the decision is epistemically inaccessible to the current management team."
