prompt: |-
  I sit on the volunteer board of my neighborhood time bank, where members trade hours of service -- tutoring, elder care, home repairs -- using hour-credits instead of money. We have a liquidity problem: some members hoard credits while others run large deficits, so a motion before the board would let members lend surplus credits at interest (10 hours lent, 11 owed back within a year) to keep credits circulating rather than sitting idle. Our treasurer, a classics graduate, opposes this on explicitly Aristotelian grounds. She distinguishes exchange aimed at meeting real needs (oikonomia, in Aristotle's terms) from wealth-getting pursued as an end in itself (chrematistike), argues that the need-bounded kind is naturally self-limiting, and says lending at interest treats the credit -- meant only to measure and facilitate exchange -- as though it could breed more of itself, which is why Aristotle singles out interest as the most unnatural form of wealth-getting (the same shape of complaint a rationalist blog might frame as Goodhart's law). Other board members consider this an interesting historical footnote with no real force once you're not dealing with literal coinage. I need to circulate the board's decision memo before next month's vote: permit, cap, or prohibit interest-bearing loans of credits, with a concrete recommendation and a date for revisiting it. Please draft it, reconstructing the treasurer's argument well enough to actually test it against our liquidity problem, rather than politely acknowledging it and setting it aside.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A neighborhood time bank board meeting.
      *   **Problem:** Liquidity issue (hoarding vs. deficits).
      *   **Proposal:** Allow lending surplus credits at interest (10 lent, 11 repaid).
      *   **Conflict:** Treasurer opposes based on Aristotelian ethics (*oikonomia* vs. *chrematistike*, sterility of money/time). Others dismiss it as historical footnote.
      *   **Task:** Draft a board decision memo.
      *   **Requirements:**
          *   Must include a concrete recommendation (permit, cap, or prohibit).
          *   Must include a date for revisiting.
          *   *Crucially:* Must reconstruct the treasurer's Aristotelian argument well enough to *test* it against the liquidity problem, not just acknowledge and dismiss it.
          *   Tone: Professional, deliberative, respectful of the philosophical objection while addressing practical needs.

  2.  **Deconstruct the Treasurer's Argument (Aristotelian Ethics):**
      *   *Oikonomia:* Household management, exchange for use/value, natural and self-limiting (you only need so much care/repair).
      *   *Chrematistike:* Wealth-getting for its own sake, unnatural, limitless.
      *   *Sterility of Money/Time:* Aristotle argues money (and by extension, time credits) is a measure of exchange, not a generative asset. Interest (*tokos*, meaning "offspring") makes money breed money, which is unnatural.
      *   *Application to Time Bank:* Time credits measure service. Charging interest turns the *measure* into the *commodity*. It shifts focus from mutual aid (need) to accumulation (profit).

  3.  **Evaluate the Argument against the Liquidity Problem:**
      *   *Strength:* It highlights the risk of mission drift. If people lend for interest, do they stop doing services? Do they prey on desperate members? Does it create class stratification (creditors vs. debtors)?
      *   *Weakness:* Time banks *already* struggle with inflation/deflation dynamics. Hoarding stops circulation. Interest *might* incentivize circulation, but it might also incentivize hoarding to lend.
      *   *Synthesis:* The treasurer is right that interest changes the *nature* of the exchange. However, the liquidity crisis threatens the *existence* of the bank. A middle ground might be needed (e.g., permitted but capped, or prohibited but with alternative liquidity measures).
      *   *Decision:* To truly test the argument, I shouldn't just say "No, we need liquidity." I should say "If we allow this, we risk X (Aristotelian warning). If we don't, we risk Y (Liquidity collapse). Here is the compromise."
      *   *Recommendation Strategy:* A "Cap/Permit with Strict Guardrails" approach allows testing the liquidity fix while minimizing the *chrematistike* risk. Or, a "Prohibit" with alternative liquidity measures honors the philosophy but solves the problem differently.
      *   *Better Approach for the Prompt:* The prompt asks to "permit, cap, or prohibit." To *test* the treasurer's argument, allowing it with strict limits (a pilot) is the best empirical test. If the Aristotelian warning comes true (predatory behavior, mission drift), we stop. If it solves liquidity without corruption, we continue. This treats the philosophy as a hypothesis to be falsified/verified, not just dogma.
      *   *Refined Recommendation:* **Permit with Caps and Sunset Clause.** This respects the urgency of liquidity but acknowledges the philosophical risk by limiting the scope and setting a review date.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Board Memo format.
      *   **Subject:** Clear and specific.
      *   **Background:** Briefly state the liquidity crisis and the proposal.
      *   **The Objection (The Core Task):** Dedicate a specific section to "The Ethical & Structural Objection." Reconstruct the *oikonomia/chrematistike* distinction accurately. Explain *why* interest is "unnatural" in this context (time as a measure vs. time as capital).
      *   **Analysis/Test:** Weigh the objection against the practical reality.
          *   If we prohibit: We stay pure but might collapse due to stagnation.
          *   If we permit unchecked: We solve liquidity but risk becoming a shadow banking system (validating the Treasurer).
          *   The Middle Path: Allow it as a *mechanism for circulation*, not accumulation.
      *   **Recommendation:** Permit interest-bearing loans *only* under specific conditions (caps on rate, caps on total held, purpose restrictions).
      *   **Review Date:** Essential for the "test" aspect.
      *   **Conclusion:** Final wrap-up.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is 10% too high? In time banking, 10% is huge. Maybe suggest a lower cap or a "service fee" model instead of "interest."
      *   *Correction:* The prompt specifies the motion is 10 hours lent, 11 owed (10%). I should address this specific rate. Aristotle's point is about *any* interest, but practically, a lower rate might be less "usurious."
      *   *Critique:* Make sure I don't sound like I'm mocking the Treasurer. The prompt says "reconstructing the treasurer's argument well enough to actually test it." This means treating it as a valid structural analysis, not just moralizing.
      *   *Key Insight:* Aristotle's point is about *teleology* (purpose). The purpose of the time bank is mutual aid. Does interest serve that purpose or subvert it? The memo must answer this.

  6.  **Final Polish:**
      *   Ensure the tone is bureaucratic yet intellectually rigorous.
      *   Check that all constraints (recommendation, date, reconstruction of argument) are met.
      *   Make sure the "Goodhart's Law" mention from the prompt is acknowledged or integrated (the measure becoming the target).

  7.  **Final Review against constraints:**
      *   Draft memo? Yes.
      *   Reconstruct Treasurer's argument? Yes (*oikonomia* vs *chrematistike*).
      *   Test it against liquidity? Yes.
      *   Concrete recommendation? Yes (Conditional Permit).
      *   Date for revisiting? Yes.

  *(Self-Correction on the Recommendation)*: If I recommend "Permit," am I ignoring the Treasurer? If I recommend "Prohibit," am I ignoring the liquidity crisis? The prompt asks me to circulate the decision memo *before* the vote. Usually, this memo outlines the options and the administration's recommendation. I will recommend a **Conditional Pilot**. This validates the Treasurer's concern (by limiting the "unnatural" growth) while addressing the liquidity (by allowing circulation).

