answer: |-
  You are not crazy, and your tech lead's shrug was definitely a dodge. What you experienced is a documented, named phenomenon in logic and social choice theory called the **Discursive Dilemma** (sometimes also called the **Doctrinal Paradox**).

  Your friend was right: people write papers about this. It's not just a weird fluke; it is a structural feature of group decision-making whenever a group has to make a judgment based on multiple connected criteria.

  Here is the breakdown of what happened, why it happens, how it relates to Arrow's Theorem, and how you can actually argue for one method over the other at work.

  ### 1. The Anatomy of the Glitch
  Let's map out exactly what happened in your meeting using the data you provided. You have three panelists (A, B, C) and a rule: **Ship = Performance (YES) + Security (YES).**

  | Panelist | Performance | Security | **Final Decision** |
  | :--- | :---: | :---: | :---: |
  | **Person A** | YES | NO | **NO** |
  | **Person B** | NO | YES | **NO** |
  | **Person C** | YES | YES | **YES** |
  | **Group Majority** | **YES (2-1)** | **YES (2-1)** | **NO (2-1)** |

  *   **Individual Consistency:** Look at each row. Every person followed the rule perfectly. If they saw a "NO" in either column, they voted "NO" on the ship. No one contradicted themselves.
  *   **The Conflict:** Look at the bottom row.
      *   If you aggregate by **Criteria (Premises)**: The group says Performance is OK and Security is OK. Therefore, logically, the group **should Ship**.
      *   If you aggregate by **Decision (Conclusion)**: The group says "No Ship" (2 out of 3 voted no). Therefore, the group **should Not Ship**.

  This is the **Discursive Dilemma**. It occurs because the "majority coalition" for Performance (Persons A & C) is different from the "majority coalition" for Security (Persons B & C). When you combine them, the only person who is in *both* majorities is Person C. Person C is outvoted on the final decision by A and B, even though A and B collectively affirmed the necessary criteria.

  ### 2. Is this Arrow's Impossibility Theorem?
  It is a cousin, but not the same animal.

  *   **Arrow's Theorem** is about **preferences and rankings**. (e.g., "I prefer Apple over Banana, Banana over Cherry"). It proves that no voting system can perfectly convert individual rankings into a group ranking without violating some basic fairness condition.
  *   **The Discursive Dilemma** is about **logic and truth**. (e.g., "If P is true and Q is true, then R is true"). It shows that majority voting on premises does not guarantee the same outcome as majority voting on the conclusion, even when everyone is logically consistent.

  So, while your friend was right that this is "real," you can impress them by knowing it's specifically the *Discursive Dilemma* (formalized by philosophers like Philip Pettit and legal scholars like Lewis Kornhauser), not Arrow's Theorem.

  ### 3. Is there a principled reason to trust one tally over the other?
  This is the million-dollar question. Mathematically, neither is "correct." However, philosophically and practically, they represent two different values. You have to choose which value matters more for your specific context.

  #### Option A: Premise-Based Aggregation (The Criteria Column)
  *   **How it works:** You tally the Performance votes and Security votes separately. If both pass, you ship.
  *   **The Principle:** **Integrity of Standards.** This method prioritizes the rules you set. You decided beforehand that "Performance + Security = Ship." This method honors that contract.
  *   **The Risk:** It can lead to a "tyranny of the criteria." You might end up shipping a feature that the majority of the team actually feels uneasy about (as happened in your meeting). It ignores the "gut check."
  *   **When to use it:** In **compliance, safety, or engineering standards**. If you say "This bridge is safe" (based on load tests) and "This bridge is stable" (based on wind tests), you shouldn't block the bridge from opening just because a majority of engineers have a bad feeling about it, provided the data says it's safe.

  #### Option B: Conclusion-Based Aggregation (The Direct Vote)
  *   **How it works:** You ignore the criteria tally and just count the "Should We Ship" votes.
  *   **The Principle:** **Democratic Accountability.** This method prioritizes the collective judgment of the people. It assumes the panelists are experts capable of weighing the trade-offs holistically.
  *   **The Risk:** It can violate your own rules. In your scenario, the group collectively affirmed the feature was Secure and Performant, but still voted to block it. This can lead to inconsistency over time (e.g., blocking a feature that meets all standards one week, but shipping one that misses a standard the next week because the "vibes" are different).
  *   **When to use it:** In **policy, product strategy, or high-risk judgment calls**. Sometimes meeting the metrics isn't enough; if the majority of experts feel there is an unknown risk, their "No" vote should carry weight.

  ### 4. So, who was right in your meeting?
  In a **security and performance** context, there is a strong argument for the **Premise-Based (Criteria)** approach, *but* with a caveat.

  If your company rule is explicitly "Ship IF AND ONLY IF Performant AND Secure," then the **Premise-Based** result is the only one that follows the rule. To vote "No" on the final column while voting "Yes" on the criteria is effectively changing the rules mid-meeting to "Ship IF Performant AND Secure AND The Majority Feels Like It."

  However, the fact that 2/3 engineers voted "No" on the final decision suggests they knew something the criteria didn't capture.

  **The Real Solution:**
  The problem isn't the vote; it's the **process design**. The Discursive Dilemma proves that you cannot have a simple majority vote on both premises and conclusions without risking contradiction. To fix this at work, you have three options:

  1.  **Decide the Aggregation Method Ex Ante:** Before looking at the feature, the panel must agree: "Are we voting on the criteria, or the final decision?" You cannot do both and expect them to match.
  2.  **Require Consensus on Critical Criteria:** For something like Security, a 2-1 majority might not be enough. If Security requires unanimity, the dilemma disappears (because a single "No" on security kills the feature regardless of the final vote).
  3.  **The "Veto" Power:** Allow the "Final Decision" vote to override the criteria. This acknowledges that human judgment captures nuance that binary checklists miss. (This effectively makes the Criteria advisory and the Final Vote binding).

  ### Summary for your Tech Lead
  You can go back to your lead and say:
  > "I looked into this, and it's a known logical problem called the **Discursive Dilemma**. It happens when majority voting on criteria conflicts with majority voting on outcomes. It's not just a fluke.
  >
  > We need to decide which one is binding **before** the next review. If we care about upholding our performance/security standards strictly, we should tally the criteria. If we care about the collective risk judgment of the panel, we should tally the final vote. But we can't pretend they are the same thing, because mathematically, they aren't."

  Your friend with the PhD will be very proud of you. This is exactly the kind of thing that keeps social choice theorists up at night, and it's valid for you to be annoyed that your workplace is treating a fundamental logical paradox as a "shrug" moment.
