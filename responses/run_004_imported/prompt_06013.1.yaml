      *(Refining the Sider point)*: Sider's objection is often that the quantifier *is* the joint-carver. So if the Universalist uses the joint-carving quantifier and the Restrictivist uses a deviant one, the Restrictivist is just *wrong*, not speaking a different language. However, for the sake of the seminar discussion on *metametaphysics*, the crucial point is whether the dispute *remains* substantive after Chalmers's test. Sider says yes, because the test ignores structure. So the "relocation" explanation is the most pedagogically useful and accurate regarding the *metaphysical* stakes. I will explain that Sider challenges the *significance* of the test's success, not necessarily the semantic mechanics, by introducing the normative/metaphysical constraint of joint-carving.

      *Wait, one more check:* Does Sider think the test conditions are *not* satisfied? If "exists" has only one joint-carving meaning, then the Restrictivist is speaking falsely, not speaking a different language. So strictly, Sider denies the premise that there are two *equally legitimate* meanings. But in the context of the seminar, the "relocation" explanation is usually what's meant by "Sider's response to verbal disputes." I will nuance this: Sider denies the *equivalence* required for the dispute to be *merely* verbal. He grants translatability but denies parity. This effectively relocates the dispute to "Which translation is the structurally privileged one?"

