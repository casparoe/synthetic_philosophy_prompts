      *   *Accuracy:* Ensure Chalmers's "canonical description" idea is central. Ensure Sider's "joint-carving" is positioned correctly against Chalmers's "equivalence."

  7.  **Final Polish:** Check against the prompt's specific constraints.
      *   Intuitive/gut-level first? Yes.
      *   Why stronger than "different meanings"? Yes.
      *   Step-by-step composition case? Yes.
