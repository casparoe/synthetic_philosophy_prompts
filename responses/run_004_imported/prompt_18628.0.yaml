answer: |-
  **Mara:** Let's cut straight to the bone, Julian. You're teaching Strawson's distinction tomorrow. You're going to tell them that determinism isn't just another item on the list of excusing conditions. But look at the logic. We excuse the kleptomaniac because they couldn't help it. We excuse the coerced because they couldn't help it. If determinism is true, *nobody* can help anything. So why isn't determinism just the universal excusing condition? It looks like Strawson is just drawing an arbitrary line and calling it a "category error."

  **Julian:** It's not arbitrary because the local excuses operate *within* the framework of reactive attitudes, while determinism is a thesis *about* the framework. When we excuse the coerced, we aren't suspending our demand for goodwill; we're acknowledging that the demand wasn't violated in the relevant way. The agent still belongs to the moral community. Determinism asks us to step outside the community entirely.

  **Mara:** But that's the question-begging move! You're assuming the moral community survives determinism. If determinism is true, the "demand for goodwill" is just a causal noise. If I resent you, I'm assuming you could have done otherwise. If you couldn't, my resentment is based on a falsehood. So determinism *does* undermine the attitudes, just like insanity does. It's a difference in degree—insanity breaks the mechanism locally, determinism breaks it globally.

  **Julian:** No, because insanity makes the *participant stance* impossible. I can't have a relationship of mutual obligation with someone who doesn't understand the concept of obligation. But determinism doesn't strip the agent of understanding. If you hurt me, and I learn you were determined to do it, does that actually change the quality of our relationship? Do I suddenly view you as an object to be managed rather than a person to be reasoned with?

  **Mara:** If I truly believe you couldn't have done otherwise? Yes. I stop holding you *responsible* and start looking for causes. That's exactly what we do with the insane. We look for causes. So if determinism makes everyone technically "insane" in the metaphysical sense, why shouldn't we look for causes everywhere? Strawson says we can't live that way. Fine. But that's a pragmatic concession, not a philosophical refutation. He's saying, "We're too weak to give up resentment," not "Resentment is rationally compatible with determinism."

  **Julian:** That's a misreading. It's not about psychological weakness; it's about constitutive norms. Look at the difference between an *excuse* and an *exemption*. An excuse says, "I didn't mean to violate the demand." An exemption says, "I am not capable of engaging with the demand." Determinism doesn't make you incapable of engaging. You still understand my resentment. You still feel guilt. If determinism were true, would you stop feeling guilt when you hurt your child?

  **Mara:** I might not *should* feel it. That's the point. The feeling might persist—habits die hard—but the *justification* evaporates. Strawson wants to say the justification stays put. He says determinism is a "different kind" of consideration. I'm saying it's the same kind: lack of ultimate control. He's trying to block the generalization argument by fiat. He says, "Local lack of control matters, global lack of control doesn't." Why? Because if the local matters due to lack of control, the global must matter more.

  **Julian:** Because the local lack of control severs the link between *will* and *action* in a way that matters to the relationship. If you shove me because you were pushed, your will wasn't directed against me. If you shove me because you're determined, your will *was* directed against me. The determination is in the background; the ill will is in the foreground. Reactive attitudes respond to the quality of will, not the metaphysical history of the will.

  **Mara:** But if the metaphysical history determines the quality of will, then the quality of will isn't *yours*. It's the universe's. You're saying we react to the appearance of ill will. Strawson is basically saying, "As long as it looks like a moral interaction, we treat it as one, even if the metaphysics says it's a puppet show."

  **Julian:** Not a puppet show. That's the objective stance creeping in. You're treating the agent as an object because of a theoretical belief. Strawson's point is that the theoretical belief is inert. It doesn't give us a *reason* to modify the demand for goodwill. When someone is insane, the demand itself becomes inappropriate. When someone is determined, the demand remains appropriate because the *interaction* hasn't changed. The truth of determinism doesn't make goodwill impossible. It just makes it caused.

  **Mara:** And if it's caused, it's not moral. That's the intuition pump Strawson needs to drain. If my love for my child is causally necessitated, is it still love? Strawson says yes, because we can't abandon the practice. I say that's an evasion. He's protecting the practice from the truth. He's admitting that if we took determinism seriously as a practical guide, we'd have to abandon resentment. He just thinks we can't.

  **Julian:** He thinks we *wouldn't*, because there's no rational pressure to do so. The pressure only comes if you think moral responsibility requires contra-causal freedom. But Strawson is arguing that responsibility *just is* the susceptibility to reactive attitudes. If determinism doesn't stop us from feeling them, and doesn't make them unintelligible, then responsibility survives. The "kind" difference is this: Local excuses show the *attitude* was misplaced in this instance. Determinism claims the *entire practice* is misplaced. But the practice isn't a theory to be true or false; it's a form of life.

  **Mara:** A form of life built on a potential illusion. That's what my students are going to ask. If determinism is true, isn't the "form of life" a collective delusion? Strawson says determinism is a different kind of consideration because it's theoretical, not practical. But if the theoretical truth undermines the practical presuppositions, the distinction collapses. You can't wall off metaphysics from ethics that neatly.

  **Julian:** You can if the ethics isn't *based* on the metaphysics. We don't resent people because we've done a metaphysical audit of their causal history. We resent them because they slighted us. Determinism doesn't change the slight. It only changes the story we tell about the origin of the slight. Strawson is saying the origin story is irrelevant to the interpersonal transaction.

  **Mara:** But the origin story is *everything* if the origin story says the agent wasn't the source. If determinism is true, *I* am not the source of my resentment, and *you* are not the source of your action. We're just colliding billiard balls. Strawson says, "Don't look at the collision from above; look at it from inside." But if the view from inside is incompatible with the view from above, we have a contradiction. He's asking us to live the contradiction.

  **Julian:** He's asking us to recognize that the "view from above" has no grip on the "view from inside." The objective stance is useful for therapy or management, but it's not a replacement for human relationships. Determinism doesn't force us into the objective stance. Only specific impairments do that. So the distinction holds: Determinism is a theoretical thesis that leaves the practical landscape untouched. Insanity is a practical barrier that alters the landscape. One is a map; the other is a wall.

  **Mara:** And if the map shows the walls are illusions?

  **Julian:** Then you still have to walk around them. Because the wall is made of your own resentment.

  **Mara:** *[Pauses]* Fine. That's the hook. The wall is internal. But I'm still telling the class that Strawson begs the question on whether that wall *ought* to be there if the map is right.

  **Julian:** And I'll tell them that "ought" only makes sense if the wall is already there. That's the standoff.
