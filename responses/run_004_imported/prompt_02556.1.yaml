answer: |-
  **Setting:** *A quiet corner of the university library, late evening. Rain taps against the high windows. LIN (Graduate student, Comparative Ethics) is staring at a copy of the *Mencius*. KEN (Undergraduate, Philosophy & Political Science) slides into the chair opposite her, holding two coffees.*

  **Ken:** You look like you're trying to set that book on fire with your mind.

  **Lin:** (Blinks, looking up) Oh. Hey, Ken. Just… wrestling with 7A35 again. The Shun passage.

  **Ken:** The one where the Sage King basically quits his job to help his dad escape justice?

  **Lin:** "Escape justice." That's already loading the dice, isn't it?

  **Ken:** Is it? Gusou murdered someone. Shun is the Emperor. His judge, Gao Yao, has a warrant. Shun's solution is to treat the empire like a worn-out shoe, hoist his murderer-father onto his back, and flee to the sea. If that's not abandoning justice, I don't know what is.

  **Lin:** It's not abandoning justice, Ken. It's prioritizing the *root*. You're reading this like a conflict between two abstract duties: Duty to State vs. Duty to Family. But that's not how Confucian role ethics works.

  **Ken:** Okay, play the Role Ethics card. I know the drill. "The self is constituted by relationships." But Liu Qingping called this out explicitly. He argued that this strand of Confucianism isn't just *allowing* nepotism; it's *ontologizing* corruption. It builds a philosophical fortress around putting blood above the law.

  **Lin:** Liu Qingping assumes a liberal, atomized self that *chooses* to prioritize family. That's the mistake. For Mencius, Shun isn't *choosing* his father over the empire. He *is* a son. That's a focal part of his existence. If he hands Gusou over to Gao Yao, he isn't being "impartial." He's severing the very root of humaneness (*ren*). You can't have a moral society built on sons betraying fathers.

  **Ken:** But you *can* have a society built on fathers murdering innocent people. That's the problem. You're talking about the moral psychology of the agent—Shun's integrity as a son. I'm talking about the victim. What about the family of the person Gusou killed? Where is *their* role? Where is *their* care?

  **Lin:** The Mohist always goes straight to the calculus. "Maximize benefit, minimize harm."

  **Ken:** It's not just calculus. It's *Jian'ai*. Impartial Care. If I accept that my father's life is inherently more valuable than a stranger's, I'm accepting a hierarchy of human worth that makes universal order impossible. If every official acts like Shun, the legal system is a joke. It's institutionalized bias.

  **Lin:** But is your "impartiality" actually possible? Or is it just a fiction that makes people hypocrites? Confucius argued that "uprightness" (*zhi*) isn't about abstract rules. It's about authenticity within your relationships. In *Analects* 13.18, he says the father and son cover for each other, and *uprightness is found in that*. Why? Because the family is the training ground for all morality. If you teach a child that the law is more important than protecting their parent, you teach them to view human bonds as transactional.

  **Ken:** Or, you teach them that some bonds are sacred and others are expendable. That's exactly how corruption starts. Look, I get the psychological pull. I do. But Mencius isn't just saying "Shun feels sad." He's saying Shun should *abdicate the throne*. He's saying the role of "Son" trumps the role of "Ruler." But Shun *accepted* the role of Ruler. He took the Mandate of Heaven. That comes with a duty to the people, not just his dad. By fleeing, he's privileging his private role over his public trust.

  **Lin:** That distinction—private vs. public—is the Western import I'm fighting. In Confucianism, the state is an extension of the family. If the family structure collapses, the state collapses. Shun fleeing isn't him saying "My dad matters more than the people." It's him acknowledging that he cannot rule effectively if he has destroyed his own humanity to do so. A ruler who betrays his father is a tyrant in waiting. Who would trust him?

  **Ken:** But the people trust him to uphold the law! If Shun stays and punishes his father, he demonstrates that *no one* is above the law. That creates a stable order where everyone is safe. If he flees, he validates the idea that power and connections allow you to opt out of consequences. That's the Liu Qingping critique in a nutshell. It's not just "family loyalty"; it's class privilege disguised as virtue.

  **Lin:** (Takes a sip of coffee, steadying herself) You're assuming the law is the ultimate arbiter of value. For Mencius, the law is a tool. *Ren* (humaneness) is the value. If the law requires you to destroy *Ren* to enforce it, the law is deficient in that moment. Shun carrying his father on his back… it's an image of burden. He's not happy about this. He's losing the empire. He's paying the ultimate price for his filial piety. It's not a "get out of jail free" card; it's a self-exile.

  **Ken:** It's a self-exile that leaves the empire in chaos and the victim's family without recourse. And here's the hard question, Lin: If *Jian'ai* is too hard for people, maybe the standard is wrong. But if Confucian graded love leads to covering up murders, maybe the standard is dangerous. You can't have it both ways. You can't say "Love starts at home" and then act like that love shouldn't interfere with justice when things get serious.

  **Lin:** It *does* interfere. Because justice isn't blind. Justice should see the relationships. If I turn my father in, I'm treating him like a stranger. I'm objectifying him. Mohism wants me to care for my neighbor's father exactly as much as my own. But that erases the specific history, the specific debt, the specific love I owe *this* person. If I dilute my love for my father to make it equal to everyone else, I haven't raised everyone up. I've dragged my father down.

  **Ken:** You haven't dragged him down; you've acknowledged that his victim matters just as much. That's the point. The victim's son has a role too. He's a "son of a murdered father." Why does Shun's role as "son of a murderer" get to veto the other son's role as "avenger of justice"? Your role ethics creates a hierarchy of roles where the biological bond always wins. That's not ethics; that's biology.

  **Lin:** It's not biology! It's cultivation. It's the recognition that I am *made* by this relationship. If I cut it, I bleed. The Mohist view treats people as interchangeable units of "benefit." I am not interchangeable with my cousin. I am not interchangeable with my father.

  **Ken:** (Leans forward) And that's where it gets personal for you, isn't it?

  **Lin:** (Pauses. Looks down at the text.) We had a situation. Recently. Family. Someone broke the law. Serious enough to ruin their life. The elders said, "You don't say anything. You protect the blood." Half the family thinks that's duty. The other half thinks it's enabling a disaster. I've been reading Mencius and all I can see is Shun carrying Gusou.

  **Ken:** I'm sorry, Lin. That's… heavy.

  **Lin:** It makes the text bleed. If I follow Liu Qingping, my family is corrupt. If I follow Mencius, I might be complicit in harm.

  **Ken:** Okay. Let's take the personal out for a second and look at the mechanism. If you conceal, you protect the individual, but you risk the community. If you reveal, you protect the community, but you sacrifice the individual bond. The Mohist says: The community *is* the individuals. If you let the father go, he might kill again. Then you've failed *Jian'ai* twice. Once for the first victim, once for the next.

  **Lin:** But if you reveal him, you destroy the possibility of his moral rehabilitation within the family structure. You cast him out. In Confucianism, shame within the family is a corrective tool. The law is a blunt instrument. By covering for him, you take on the burden of fixing him. Shun doesn't just let Gusou go; he takes him away. He assumes responsibility.

  **Ken:** Responsibility to who? To the victim? No. To the father. It's a closed loop. The debt is paid within the clan. The outside world doesn't count. That's the nepotism charge. It's a moral closed circuit.

  **Lin:** Is the Mohist circuit open? Or is it just so wide it means nothing? If I love everyone equally, do I really love anyone? If I turn my father in to satisfy an abstract principle of "Order," haven't I already lost the capacity for the deep loyalty that makes order worth having? Shun abandoning the empire shows he knows the cost. He's not saying "Family wins, society be damned." He's saying, "I cannot be Emperor if I am not a Son."

  **Ken:** But the world needs Emperors more than it needs Sons. We can find you a new father eventually. We can't find a new victim. And we can't find a new stable society once the rule of law is revealed to be optional for the well-connected. Look, I respect the consistency of Role Ethics. I do. If the self is *only* its roles, then Shun has no choice. But I reject the premise. You are a human being *before* you are a son. That humanity binds you to the victim's family just as tightly.

  **Lin:** That "humanity before the role"… that's the atomized self I'm talking about. There is no "before." I was born into a web. Cutting a strand doesn't free me; it injures the web.

  **Ken:** And sometimes a strand is strangling the web. Sometimes you have to cut it to save the rest.

  **Lin:** (Closes the book) So we're at the impasse. Liu Qingping says this is corruption. You say it's unsustainable. I say it's the only thing that makes morality feel real.

  **Ken:** I say it's real, but it's dangerous. Like fire. It warms the house, but if you let it burn unchecked, it burns the neighborhood. Shun fleeing to the sea is him taking the fire with him. But he still let it burn the house first.

  **Lin:** Maybe. Or maybe he realized the house was already burnt the moment he chose the law over his father.

  **Ken:** (Sighs) I'm not going to convince you tonight.

  **Lin:** And you're not going to stop believing that impartiality is the only way to keep the peace.

  **Ken:** No. But… I get why the text hooks you. It's not just theory. It's about whether we owe more to the people who made us, or the people we live among.

  **Lin:** Mencius says we can't distinguish them.

  **Ken:** And I say the victim's family begs to differ.

  *(Silence settles between them, heavy but not hostile. The rain picks up against the glass.)*

  **Lin:** I still have to go home this weekend.

  **Ken:** I know. Just… whatever you decide, Lin. Don't let the text make the choice for you. Shun was a Sage King. You're a cousin. The stakes are different.

  **Lin:** (A faint smile) That's the one thing Mencius would agree with. Graded love, remember? My duty to my cousin isn't the same as Shun's to his father.

  **Ken:** Exactly. So maybe there's a middle path that isn't "flee to the sea" or "call the cops immediately."

  **Lin:** Maybe. Or maybe the middle path is just where the bleeding stops.

  **Ken:** (Stands up) I'll walk you to your car.

  **Lin:** Thanks, Ken.

  *(They pack up. Lin traces the cover of the *Mencius* one last time before sliding it into her bag. She doesn't look resolved, but she looks less alone in the question.)*
