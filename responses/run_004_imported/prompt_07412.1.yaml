  9.  *(Self-Correction during drafting)*: I should make sure not to diagnose the volunteers. I don't know if Volunteer A lacks empathy or Volunteer B lacks duty. I must stick to what they *said*. Volunteer A *bracketed* feelings. Volunteer B *cited* feelings.

