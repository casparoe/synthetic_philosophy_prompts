      *   *Gricean Pragmatics:* Assertion carries implicatures. Asserting $P$ implies you believe $P$. Violating this maxim creates the absurdity.
      *   *Transparency/Shoemaker:* Self-knowledge. If $P$ is true, I should know it (in certain contexts). Or, the question "Do I believe $P$?" is answered by looking at the world (is $P$ true?), not by introspection.
