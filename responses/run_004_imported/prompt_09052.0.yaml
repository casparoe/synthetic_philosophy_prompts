  5.  **Final Polish:** Add an intro and outro that validates the user's situation (the pottery/finance shift) to build rapport, while keeping the focus on the interview prep. (The prompt asks for the questions, but a little encouragement helps). *Wait, the prompt asks specifically to "draft 8-10 interview questions." I should focus primarily on that, perhaps with a brief encouraging intro.*

