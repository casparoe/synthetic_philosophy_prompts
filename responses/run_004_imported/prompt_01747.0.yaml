  *(Self-Correction on Stage Directions)*: The prompt says "No need for stage directions." I will omit them entirely to keep it clean, just names and text.

  *(Refining the Lottery Argument)*: Elena needs to be careful not to conflate "certainty" with "knowledge." The student complaint mentions "lack of certainty." Elena must distinguish them. High probability $\neq$ Knowledge.

  *(Refining the Truth Norm)*: Marcus needs to make sure he doesn't sound like he's saying "False assertions are okay." The norm is *constitutive*. You shouldn't assert falsehoods, but you don't need *knowledge* to assert, just truth + adequate grounds (as a conversational rule).

