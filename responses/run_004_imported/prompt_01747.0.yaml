      *   **Key Data Points to Cover:**
          1.  Lottery Propositions (Why is "Your ticket lost" bad before the draw?).
          2.  Moore-Paradoxical Assertions ("It's raining but I don't know it").
          3.  Lackey-style Selfless Assertion (Optional but encouraged if natural).
      *   **Constraint:** No stage directions, no tidy ending.
      *   **Goal:** Create a handout resource that explains *why* the debate matters and how the arguments interact, specifically addressing the student complaint that it's just shouting "Know!" vs. "True!".

  2.  **Character Conception:**
      *   **Knowledge Norm Defender (KN):** Let's call her *Elena*. She leans Williamsonian. Needs to argue that knowledge is the *constitutive* rule, not just a derivative one. She needs to explain why lottery cases fail specifically due to *knowledge*, not just probability.
      *   **Truth Norm Defender (TN):** Let's call him *Marcus*. He leans Weiner/Whiting. He argues truth is the constitutive norm, and epistemic constraints are conversational/pragmatic (Gricean). He needs to show that KN over-intellectualizes assertion or gets the data wrong on selfless assertion.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Start *in media res* to avoid preamble. Address the "shouting" complaint immediately.
      *   **Lottery Case (The First Battleground):**
          *   *Marcus (TN):* Start here. It's intuitive. You have 99.9% evidence. It's *true* (statistically likely). Why is it wrong to assert?
          *   *Elena (KN):* Standard move: You don't *know*.
          *   *Marcus:* Why not just say the grounds aren't good enough for *conversation*? Why make it a rule of *assertion*?
          *   *Elena:* Needs to distinguish lottery from ordinary inductive knowledge. If it were just about high probability, we couldn't assert much. The specific defect is the lack of knowledge, not just probability. The "lottery intuition" tracks the knowledge boundary.
      *   **Moore-Paradoxical Sentences (The Second Battleground):**
          *   *Elena:* "It's raining but I don't know it." This is the KN stronghold. If the norm is knowledge, asserting $p$ represents $p$ as known. So asserting $p \land \neg Kp$ is a contradiction in presentation.
          *   *Marcus:* Can the Truth Norm handle this? Yes, via belief/knowledge norms of *belief* or conversational implicature. If I assert $p$, I imply I have grounds. Saying I lack grounds cancels the implication, creating tension, but not violating the *constitutive* rule of assertion (which is just truth).
          *   *Elena:* Counter: The tension is too strong for mere implicature. It's constitutive.
      *   **Selfless Assertion (The Complication):**
          *   *Marcus:* Bring in Lackey. The scientist who has evidence for climate change but can't bring herself to believe it due to trauma/bias. She asserts. She's epistemically blameless. KN says she violates the norm. TN says she's fine (it's true, she has evidence).
          *   *Elena:* Needs to respond. Maybe she *does* know (dispositional belief)? Or maybe the norm is violated but excused? Or maybe Selfless Assertion isn't genuine assertion? (Williamson's line is usually that knowledge is required, so these are problematic or require nuance). Let's have Elena argue that Selfless Assertion shows the *evidence* is good enough for knowledge, even if the subject hesitates, or that it's an excusable violation. Actually, a stronger KN move is to question whether the subject *really* lacks belief or if it's a performance issue. But let's stick to the prompt's request for engagement. Let's have Elena argue that Selfless Assertion is a *challenge* but doesn't defeat the norm, perhaps by distinguishing proper assertion from permissible assertion.
      *   **Connecting the Dots:** Ensure the Lottery and Moore cases talk to each other. The explanation for Lottery (lack of knowledge) should mirror the explanation for Moore (representation of knowledge).

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did Marcus explain *why* Truth Norm isn't trivial?
      *   *Correction:* Make sure Marcus emphasizes that Truth is the *constitutive* aim (like belief), while Knowledge is a *regulative* constraint on the conversation.
      *   *Check:* Did Elena explain why "lack of certainty" isn't the answer for Lottery?
      *   *Correction:* Elena needs to point out that we assert things we aren't certain of (e.g., "The train arrives at 5," based on a schedule). So certainty isn't the bar. Knowledge is the bar. Lottery falls short of knowledge despite high probability.
      *   *Check:* Is the tone right?
      *   *Correction:* Avoid "I think that..." too much. Make it punchy. "But look," "Consider this," "That misses the point."

  5.  **Final Polish:**
      *   Ensure the transition from Lottery to Moore feels natural.
      *   Ensure the Lackey case doesn't derail the conversation but illuminates the core disagreement.
      *   Check that the "why should we care" aspect is implicit in the rigor of the debate (it's about the nature of the speech act, not just rules).

  6.  **Writing the Dialogue:** (Mental simulation of the flow)
      *   Start with the student complaint.
      *   Move to Lottery. Marcus: It's just improper conversation. Elena: No, it's a specific epistemic defect.
      *   Move to Moore. Elena: It's a contradiction of the act. Marcus: It's a pragmatic clash.
      *   Move to Lackey. Marcus: See, knowledge isn't required. Elena: Knowledge is required, but belief is complex.
