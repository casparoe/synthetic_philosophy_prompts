answer: |-
  This is a fantastic question. You have correctly identified the crux of David Lewis's short but devastating 1990 note, *"Do We Believe in Penal Substitution?"* Lewis's point is essentially category-based: **debts are transferable, but punishments are not**, because punishment logically entails personal guilt. If Christ was punished, He must have been guilty; if He was innocent, punishing Him was unjust.

  If we time-travel John Calvin into a seminar room to hear this objection, he wouldn't be flustered, but he would likely argue that Lewis is operating with a secularized, individualistic definition of "justice" that ignores the **covenantal and forensic metaphysics** of Scripture.

  Here is how Calvin would likely respond, where his resources are strong, and where the genuine tension lies.

  ### 1. The Direct Counter: Imputation of Guilt
  Lewis's argument rests on the premise that guilt cannot be transferred. He assumes that moral responsibility is hermetically sealed within the individual agent.

  Calvin's strongest resource here is the doctrine of **Imputation**. For Calvin, justification is a forensic (legal) act, but so is the atonement. In the *Institutes* (II.16.5), Calvin argues that Christ was made a "sinner" in a legal sense, not a moral one.

  *   **Lewis:** "You can't punish an innocent man."
  *   **Calvin:** "Christ was not punished as a private individual, but as a surety (*fideiussor*). By the imputation of our sins, He was legally constituted as the guilty party."

  Calvin would argue that Lewis is confusing **personal inherent guilt** (moral corruption) with **forensic imputed guilt** (legal liability). In Calvin's view, God, as the Supreme Judge, has the prerogative to transfer the *liability* of the crime to the Surety. Once that transfer happens, the Surety is not "innocent" in the eyes of the court; He is legally liable. Therefore, punishing Him is not unjust, because the court has declared Him liable.

  **The Strength:** This directly addresses Lewis's logical condition. If guilt is transferable (via imputation), then punishment is transferable.
  **The Weakness:** Lewis would likely reply that "imputed guilt" is a legal fiction that violates the *moral logic* of punishment. You can transfer debt (a financial abstract), but can you really transfer *moral culpability* without the person actually committing the act? Calvin assumes you can; Lewis assumes you can't.

  ### 2. The Corporate Headship Argument
  Lewis's analogy relies on the idea of a **stranger** volunteering. "If I'm sentenced to five years, it doesn't clear my record if *some volunteer* serves the time."

  Calvin would object to the "stranger" premise. Christ is not a third-party volunteer; He is the **Covenant Head**. Calvin leans heavily on the "Two Adams" theology (Romans 5).

  *   **Lewis:** Treats humanity as a collection of atomic individuals.
  *   **Calvin:** Treats humanity as corporately solidary. Just as Adam's sin was legally ours (even though we didn't eat the fruit), Christ's suffering is legally His people's.

  In *Institutes* II.17.3, Calvin discusses how Christ is our "Head." In ancient legal and covenantal thought (which Calvin inherits from the Hebrew Scriptures), the King represents the people. If the King is punished, the people are punished. If the Representative pays, the people are freed.

  **The Comeback:** Calvin would say Lewis's prison analogy fails because it assumes a modern liberal individualism. In a covenantal framework, the Head *is* the Body. When Christ is punished, *we* are punished in Him. It's not substitution in the sense of "swap," but in the sense of "representation."

  ### 3. The Prerogative of the Judge
  Lewis's analogy assumes a human court where the judge is bound by laws higher than himself (e.g., "Thou shalt not punish the innocent").

  Calvin would point out that in the atonement, **God is both the Judge and the Lawgiver.**
  In *Institutes* II.17.4, Calvin emphasizes that this transaction was ordained by the Father. Since God is the offended party, He has the right to determine how satisfaction is made.

  *   **Lewis:** "Punishment requires personal desert."
  *   **Calvin:** "God determined that the desert of the sinner could be borne by the Son. Since God defines Justice, and God ordained this, it is by definition Just."

  This is Calvin's "Nuclear Option." It moves the ground from analytic logic to Divine Command/voluntarism. If God accepts the Vicar's suffering as the penalty, then it *is* the penalty.

  ### 4. Where is the Blind Spot?
  Does Calvin have a blind spot? **Yes, but it's a metaphysical one, not a theological one.**

  Calvin never rigorously defends the *mechanism* of imputation against a philosophical objection like Lewis's. He assumes the coherence of "transferring guilt" because he sees it revealed in Scripture (e.g., Isaiah 53:6, "the Lord has laid on him the iniquity of us all").

  Lewis is asking for a **metaphysical account of moral agency**: *How* can Agent A be culpable for Act B committed by Agent C?
  Calvin provides a **theological account of covenantal solidarity**: *Because* God united them in a covenant, A is culpable for B.

  Calvin's "blind spot" is that he doesn't argue for the *possibility* of imputation; he argues from the *fact* of revelation. If Lewis rejects the premise that moral guilt can be imputed, Calvin has no analytic argument to change his mind, only a theological assertion that God has done it.

  ### Calvin's Strongest Comeback
  If I had to place the best Calvinian response in his mouth, it would combine **Imputation** with **Union**:

  > "Mr. Lewis, you argue that punishment cannot be transferred because guilt cannot be transferred. You treat guilt as a private moral stain. But Scripture treats guilt as a **legal debt within a Covenant**.
  >
  > I do not claim Christ was punished as a private man. I claim He was punished as the **Public Person** of His Church. By the eternal decree of the Father, our sins were imputed to Him, making Him legally guilty. By the Spirit, we are united to Him, making His punishment legally ours.
  >
  > Your prison analogy fails because it assumes the volunteer is a stranger. Christ is not a stranger; He is the Head. To punish the Head is to punish the Body. To punish the Surety is to satisfy the Debt. You are judging Divine Justice by the standards of a human magistrate, but the Judge here has ordained the method of satisfaction Himself."

  ### Summary for your Seminar
  *   **Does Calvin have the resources?** Yes. The doctrines of **Imputation** and **Federal Headship** are designed specifically to handle the "transfer" problem.
  *   **Is it a blind spot?** It is a *premises* gap. Calvin assumes guilt is transferable via covenant; Lewis assumes it isn't. Calvin doesn't prove the metaphysics of imputation; he asserts it biblically.
  *   **The Verdict:** Calvin would argue Lewis is committing a category error by applying secular criminal justice logic to Divine Covenantal justice. For Calvin, the "logic" of the atonement is internal to the Trinity and the Covenant, not external to it.

  This tension is exactly why the paper is still discussed today: Lewis exposes that Penal Substitution requires a very specific (and to many, counter-intuitive) metaphysics of moral agency that Calvin takes for granted.
