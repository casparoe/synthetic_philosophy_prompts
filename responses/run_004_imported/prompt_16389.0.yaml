  8.  (Final check of the Hirshleifer effect): Yes, Hirshleifer (1971) "The Private and Social Value of Information and the Reward to Inventive Activity." Shows that private value can be positive while social value is negative, or both can be negative compared to ignorance due to lost risk-sharing. This is the "nuclear option" for the friend's "rational society" claim.

