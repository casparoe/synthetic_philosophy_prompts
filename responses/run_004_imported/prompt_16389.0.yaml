answer: |-
  Your friend is making a classic category error: they are treating a theorem about **individual decision theory against a passive environment** as if it were a theorem about **multi-agent systems and endogenous market structures**.

  I.J. Good's 1967 result is mathematically sound within its specific axioms. However, the slogan "information can never hurt a rational agent/society" requires exporting those axioms into contexts where they explicitly fail. To dismantle the slogan rigorously, we need to dissect the four critical premises of Good's setup and show how your examples (and others) violate them.

  Here is the premise-by-premise rebuttal.

  ### 1. The "Passive Nature" Premise vs. Strategic Interdependence
  **Good's Assumption:** The state of the world ($\theta$) is drawn by "Nature," which is passive. Nature does not change its behavior based on whether you observe a signal $s$ or based on the action $a$ you subsequently take. The probability distribution $P(\theta)$ is fixed.

  **Where the Slogan Breaks:** Game Theory.
  In a multi-agent setting, the "state of the world" often includes the actions of other rational agents. Those agents optimize *against you*. If your information state changes, their optimal strategy changes.

  *   **The Mechanism:** In Good's theorem, $E[U | \text{info}] \ge E[U | \text{no info}]$ because you can always ignore the info and act as if you didn't have it. This relies on the payoff function $U(a, \theta)$ being independent of your information state.
  *   **The Counter-Example:** Consider a bargaining scenario or a poker game. If your opponent knows you have perfect information about your hand (or the market value), they will adjust their betting strategy to exploit your responsiveness. If you are *known* to be ignorant, you can sometimes credibly commit to a strategy (e.g., "I always call") that forces the opponent to offer better terms to avoid risk.
  *   **The Violation:** Information can destroy **commitment power**. If you *cannot* know certain facts, you cannot be punished for ignoring them. By acquiring the information, you become "responsive," and in a strategic setting, responsiveness can be exploited. Thus, for a strategic agent, $E[U | \text{info}] < E[U | \text{no info}]$ is possible because the opponent's best-response function shifts against you once you are informed.

  ### 2. The "Fixed Action Space" Premise vs. Endogenous Markets
  **Good's Assumption:** The set of available actions $A$ is fixed. Whether you have the signal $s$ or not, you can choose any $a \in A$. The technology of the world does not change based on your knowledge.

  **Where the Slogan Breaks:** Mechanism Design and Insurance Markets (The Hirshleifer Effect).
  This is the specific rebuttal regarding insurance markets that you recalled. In social/economic contexts, the "actions" available (e.g., contracts, trades) are often endogenous—they depend on the information structure of the participants.

  *   **The Mechanism:** Insurance works via **risk pooling**. A pooling equilibrium exists only if there is sufficient uncertainty about individual risk types. If agents acquire precise information about their own risk profiles (e.g., genetic testing), the action "buy insurance at average premium" ceases to be incentive-compatible. Low-risk agents opt out, premiums rise, high-risk agents opt out, and the market collapses.
  *   **The Violation:** Information changes the **feasible set of actions**.
      *   *Ex-ante (behind the veil of ignorance):* The action "pool risk" is available.
      *   *Ex-post (with information):* The action "pool risk" disappears; it is replaced by "no trade" or "actuarially fair trade" (which is often too expensive for high risks).
      *   Jack Hirshleifer (1971) demonstrated that while information has private value to the individual (they can avoid bad bets), it can have **negative social value** because it destroys mutually beneficial risk-sharing arrangements. Good's theorem assumes the "bet" is always available to be taken or declined; it does not account for the bet vanishing entirely because the counterparty knows you know.

  ### 3. The "Single Utility Function" Premise vs. Social Welfare
  **Good's Assumption:** There is one agent maximizing one utility function $U$. The "value" of information is defined strictly by the increase in this single expected utility.

  **Where the Slogan Breaks:** Welfare Economics and Distribution.
  Your friend's slogan extends to "no rational *society* should ever suppress information." A society is not a single Bayesian maximizer; it is a collection of agents with conflicting utility functions.

  *   **The Mechanism:** Information is not neutral; it is distributive. It shifts bargaining power. Even if total surplus (the size of the pie) remains constant or increases, information can shift the division of the pie in ways that trigger conflict or reduce aggregate welfare due to inequality aversion or transaction costs.
  *   **The Counter-Example:** The Bargaining Model of War (Fearon). Wars often occur not because of a lack of information, but because of incentives to misrepresent information or because acquiring information (mobilizing troops to test strength) is itself provocative.
  *   **The Violation:** Aggregation. Good's theorem proves $E[U_i | \text{info}] \ge E[U_i | \text{no info}]$ for a specific agent $i$ *ceteris paribus*. It does not prove $\sum E[U_i | \text{info}] \ge \sum E[U_i | \text{no info}]$. In the insurance example, the informed high-risk individuals are worse off (no coverage), and the informed low-risk individuals might be only marginally better off (paying actuarial rates vs pooled rates), while the *ex-ante* social welfare (the utility of the system before types are known) is strictly higher with ignorance. A "rational society" maximizing ex-ante social welfare might rationally choose to ban certain types of information (e.g., genetic discrimination laws) to preserve the pooling equilibrium.

  ### 4. The "Instrumental Value" Premise vs. Consumatory Beliefs
  **Good's Assumption:** Information is valued purely **instrumentally**. It is a tool to choose better actions. The utility function is defined over *outcomes* in the physical world, $U(outcome)$.

  **Where the Slogan Breaks:** Psychology and Belief Utility.
  For many rational agents (including humans modeled with recursive utility), utility is defined over *beliefs* as well as outcomes. $U(outcome, belief)$.

  *   **The Mechanism:** If an agent derives utility from hope, anticipation, or simply not knowing (the "Ostrich Effect"), then information has an **intrinsic cost**.
  *   **The Counter-Example:** Medical testing for an untreatable, fatal condition.
      *   *Instrumental Value:* Zero. (You cannot change the outcome).
      *   *Good's Theorem Prediction:* You should be indifferent (since you can't act on it).
      *   *Reality:* Expected utility drops because the period of "happy ignorance" is replaced by "dread."
  *   **The Violation:** Good's theorem assumes $U$ is stable and defined only on world-states. If $U$ is defined on belief-states, information directly alters the argument of the utility function. While a purist might argue this is just a different utility function, it invalidates the slogan "information can't hurt." If your utility function includes "peace of mind," information can absolutely hurt you, even if it is free and costless to process.

  ### Summary of the Rebuttal

  You can tell your friend that Good's Theorem is a **ceteris paribus** result about a **single agent** facing a **passive environment** with a **fixed menu of options**.

  The slogan fails because:
  1.  **Strategic Environments:** Other agents react to your information, potentially making you exploitable (violating "Passive Nature").
  2.  **Market Endogeneity:** Information can destroy the very contracts or trades that made the situation valuable, shrinking the feasible action space (violating "Fixed Action Space").
  3.  **Social Aggregation:** What helps an individual ex-post can hurt the collective ex-ante by destroying risk-pooling (violating "Single Utility Function").
  4.  **Belief Utility:** If agents care about their state of mind, information has intrinsic disvalue (violating "Instrumental Value Only").

  The most rigorous "kill shot" for the society argument is the **Hirshleifer Effect**. It demonstrates mathematically that the *social value of information* can be negative because information converts insurable uncertainty (risk) into uninsurable certainty, thereby eliminating the gains from trade that existed under ignorance. A rational society, maximizing ex-ante welfare, would rationally choose to remain ignorant.
