      *   *Refining the "Society" point:* A society isn't a single Bayesian maximizer. It's a collection. Aggregating preferences is Arrow's Impossibility territory, but simply put: Information can redistribute wealth in ways that reduce total surplus (e.g., by enabling rent-seeking or destroying pooling).

