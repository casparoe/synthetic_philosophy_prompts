answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], and I have the honor of standing up here as Theo's best man.

  Usually, this is the part of the speech where I tell a story about how messy Theo was in college, or how he once tried to cook a turkey and set off the fire alarm. And don't worry, I'm not going to ignore those stories. His college roommates are here, and I see you nodding. We know Theo isn't perfect.

  But for the last five years, Theo has been working on a project that suggests he disagrees with that assessment. Or, at least, he's willing to fight about it.

  Some of you might know this, but Theo keeps a notebook. It's modeled after Benjamin Franklin's autobiography. Franklin listed thirteen virtues—things like Temperance, Silence, Order, Resolution, Sincerity, and so on. He dedicated a page to each, drew a grid for the weeks, and every time he slipped up, he gave himself a little black mark.

  Theo has been doing this for half a decade. He carries the notebook. He marks the boxes.

  Now, when I first really looked at this, I had a debate with a friend of ours about what it actually means. Her take was that it seems a little... intense. To build your personality around a spreadsheet of moral shortcomings? It can look like rigidity. It can look like someone trying to iron out every wrinkle until there's no person left underneath.

  I took the other side. But the more I thought about it, and the more I read of Franklin's actual writings, I realized we were both missing the point.

  Because Franklin never finished the project. He admits it. He writes that he could never get the hang of "Order." His papers were always a mess. His schedule was always slipping. He spent years trying to grind his character down to a perfect, bright finish, and he failed.

  Near the end of his life, Franklin tells a story about a man who wanted to buy an axe from a smith. The man liked the shape of the axe, but he wanted the whole surface to be as bright as the edge. The smith agreed to make it bright if the man would turn the grindstone. So the man turned. And turned. The wheel went round and round, the metal sparked, but the axe was still speckled. The man got tired. He stopped turning and said, "You know what? I think I like a speckled axe best."

  Franklin uses this to say that maybe a character with a few permanent faults is the saner thing to settle for than grinding forever for perfection.

  And that is what I admire about Theo. It isn't the notebook. It's that he knows the axe is going to stay speckled, and he turns the wheel anyway.

  We know Theo isn't morally perfect. We know he leaves his socks on the floor. We know he has a temper sometimes. We know he gets stressed. The black marks in that notebook are real. But the act of marking them? That's the virtue. It's the daily admission that you can be better, paired with the humility to accept that you aren't there yet.

  And that, I think, is the only foundation sturdy enough to build a marriage on.

  If you think you're a shiny, perfect axe, marriage will humble you very quickly. You will slip. You will forget an anniversary. You will say the wrong thing when you're tired. You will leave the cap off the toothpaste.

  If you're trying to be perfect, those moments are failures. They're cracks in the foundation. But if you're Theo—if you're willing to keep a speckled axe—those moments are just part of the grinding. They're just part of the work.

  Theo, I've watched you track your virtues for five years. But watching you with [Partner's Name], I realize you've already found the fourteenth virtue. It wasn't on Franklin's list. It's the ability to let someone else see the black marks and love you anyway. It's the willingness to turn the wheel, not for your own glory, but for the sake of the person standing next to you.

  [Partner's Name], you are marrying a man who measures his days by how well he treats the people around him. He might not always get an A-plus. He might always have a few speckles on the blade. But I can promise you this: he will never stop trying to sharpen the edge. He will never stop turning the wheel.

  So, if everyone could please raise a glass.

  To Theo and [Partner's Name]. May your life together be full of love, full of grace, and full of the understanding that a speckled axe is still sharp enough to build a home with.

  To the happy couple.
