answer: |-
  This is a fantastic argument, and honestly, it's the kind of debate that would have fit right in at an actual Athenian symposium. You and your friend are both tapping into real tensions in Plato's work, but **your friend is making a critical logical leap that Plato would definitely reject.**

  Here is the breakdown of why you are closer to the mark, why your friend isn't entirely wrong about the text, but why her conclusion about "Drunk-Dave" is dangerous.

  ### 1. Your Friend's Point: *The Laws* and the "Truth Serum"
  Your friend is correct that in *The Laws* (specifically Book 1), the Athenian Stranger (Plato's mouthpiece in this dialogue) argues that drinking wine can be useful for the state.

  He suggests that wine acts like a fire test for gold. It warms the soul, lowers inhibitions, and makes people more prone to anger, lust, and foolishness. In this sense, **yes, Plato agrees that wine reveals character.** When the guard of reason is lowered, your hidden desires and fears pop out.

  **However, here is where your friend goes wrong:**
  Plato does not believe that what is *revealed* is the *best* version of you. He believes it is the *untamed* version of you.

  In *The Laws*, the purpose of drinking parties isn't to let people be "real" and then trust their judgments. The purpose is **pedagogical (educational).** You get people drunk in a controlled setting to see where their weaknesses are, so the state can train them to overcome those weaknesses.
  *   **The Analogy:** If you put a bridge under heavy stress to see if it cracks, you are testing its integrity. If it cracks, you don't say, "Ah, the cracked bridge is the *honest* bridge, let's drive on it." You say, "The bridge is flawed, and we must fix it or not trust it."

  For Plato, the drunk self reveals the **appetites**, not the **truth**.

  ### 2. Your Point: *The Symposium* and Socratic Self-Control
  You are spot on to bring up the *Symposium*. In Alcibiades' speech (220a), he describes how Socrates could outdrink everyone at the party but remained perfectly rational. He never stumbled, never slurred, and never lost his train of thought.

  For Plato, Socrates is the ideal human being. If the ideal human is the one who remains rational regardless of alcohol intake, then **sobriety (or rather, rational control) is the state in which we access truth, not intoxication.**

  Plato's metaphysics divides the soul into three parts:
  1.  **Reason (Logos):** The charioteer. Seeks truth.
  2.  **Spirit (Thumos):** Seeks honor and victory.
  3.  **Appetite (Epithumia):** Seeks pleasure, food, drink, sex.

  When you get drunk, **Appetite hijacks the chariot.** When you are sober, **Reason drives.**
  *   **Sober-Dave** is operating via *Logos*. He is assessing the boss based on evidence, competence, and behavior.
  *   **Drunk-Dave** is operating via *Appetite* and *Spirit*. He might hate the boss because the boss has a loud voice that reminds him of his dad, or because he feels insecure around authority.

  ### 3. The Crucial Distinction: "Authentic" vs. "Accurate"
  Your friend is conflating **authenticity** with **accuracy**.

  *   **Authenticity:** Is Drunk-Dave expressing a genuine feeling? Yes. He isn't lying. If he says "I hate the boss," he genuinely feels hatred in that moment.
  *   **Accuracy:** Is Drunk-Dave's assessment of the boss *correct*? Probably not.

  Plato would argue that Drunk-Dave is actually *less* free than Sober-Dave. In the *Republic*, Plato argues that a tyrant is a slave to his own passions. The drunk person is a temporary tyrant over themselves. They are being pushed around by chemical impulses.

  So, when your friend says sober-Dave is "performing," she is partially right—social norms require us to moderate our behavior. But Plato doesn't view that moderation as a "lie." He views it as **civilization.** He views it as Reason keeping the beast in check.

  ### The Verdict on Dave
  If you took this case to Plato's Academy:

  1.  **Trust Sober-Dave's assessment of the boss.** This is the judgment made by the rational part of the soul, capable of weighing evidence and long-term consequences.
  2.  **Listen to Drunk-Dave to understand Dave's insecurities.** If Drunk-Dave screams that the boss is "a controlling jerk," Plato would say: "Don't fire the boss based on this. But ask Dave: Why does control make you so angry? What wound is this touching?"

  **Summary:**
  Your friend is right that wine *reveals* things, but wrong that what is revealed is *trustworthy*. Plato thinks the "True Self" is the Rational Self, not the Impulsive Self.

  You win the argument, but you should buy your friend a drink (in moderation, of course) to test her character. Just don't let her make any hiring decisions until she sobers up.
