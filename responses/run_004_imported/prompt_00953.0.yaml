answer: |-
  This is a classic pedagogical hurdle. The math is actually simple linear algebra, but the *economic intuition* gets lost in the matrix multiplication. Here is a way to frame the conceptual crux for your students without writing down a $3 \times 3$ matrix, followed by takes on your bonus questions.

  ### The Gut-Level Crux: The "Revaluation of the Cost Base"

  The core tension isn't really about "values vs. prices" in the abstract; it's about **consistency in measuring the denominator of the profit rate.**

  1.  **Marx's Move:** Marx wants to show that profit is just redistributed surplus value. To do this, he calculates the aggregate rate of profit ($R$) as Total Surplus Value divided by Total Value-Capital ($S / (C+V)$). He then applies this $R$ to individual sectors to find their prices.
  2.  **The Inconsistency:** In doing this, Marx treats the *outputs* as sold at prices (which include the profit markup) but treats the *inputs* as bought at values (which do not).
  3.  **Bortkiewicz's Correction:** If the economy is a closed loop (which it must be for aggregate equalities to hold), the outputs of Sector A are the inputs of Sector B. If outputs are repriced, **inputs must be repriced.**
  4.  **The Collision:** Here is the intuitive kicker. When you reprice the inputs (constant and variable capital) from values to prices, you change the **magnitude of the total capital advanced** in the economy.
      *   The aggregate profit rate is determined by the ratio of Total Surplus to Total Capital Advanced.
      *   If you revalue the Capital Advanced (the denominator) from values to prices, the aggregate profit rate *must* change (unless the economy happens to have a very specific "average" composition of capital).
      *   If the aggregate profit rate changes, the total mass of profit distributed ($\text{Rate} \times \text{Capital}$) changes.

  **Why the two invariances clash:**
  Marx wants to hold two things constant simultaneously during this transformation:
  1.  **The Sum of Values:** Total Price = Total Value.
  2.  **The Sum of Surplus:** Total Profit = Total Surplus Value.

  But once you admit that inputs must be transformed:
  *   To satisfy **Total Profit = Total Surplus**, you have to fix the aggregate profit rate based on the *value* system. But if you apply that rate to *price*-revalued inputs, the math generally won't sum to Total Price = Total Value.
  *   To satisfy **Total Price = Total Value**, you have to let the aggregate profit rate float to clear the price system. But if the rate floats, the resulting Total Profit generally won't equal the original Total Surplus.

  **The Intuitive Analogy:**
  Imagine you are splitting a dinner bill (Total Value/Surplus) among friends based on how much they earned (Labor). Marx says, "Let's calculate the split based on income, but charge everyone based on what they ordered."
  Bortkiewicz says, "Wait, what they ordered (inputs) also has a price that changes based on the split."
  If you change the price of the food (inputs), the total bill changes. If the total bill changes, you can't guarantee that the *sum of the individual payments* equals the *original bill total* AND that the *sum of the tips* equals the *original surplus* simultaneously. You have one system of prices determining the bill; you cannot impose two independent constraints (Total Bill and Total Tip) on a system that only has enough degrees of freedom to satisfy one (plus a numéraire).

  In short: **Revaluing inputs changes the aggregate capital base. Changing the capital base changes the aggregate profit rate. Changing the profit rate breaks the link between the mass of surplus value produced and the mass of profit realized.** You can preserve the link or preserve the aggregate price sum, but generally not both.

  ***

  ### Bonus 1: Does Kliman/TSSI dissolve the inconsistency?

  **Short answer:** It dissolves the *mathematical* contradiction by changing the *topology* of the model, but critics argue it changes the subject of what value theory is supposed to do.

  **The Gist:** The Temporal Single-System Interpretation (TSSI) argues that Bortkiewicz (and everyone else) misread Marx by assuming simultaneous valuation (inputs and outputs valued at the same time). TSSI says inputs are valued at time $t_1$ (historical cost) and outputs at $t_2$.
  *   **Does it work?** Mathematically, yes. If you value inputs at what they actually cost when purchased and outputs at what they sell for later, the identities (Total Price = Total Value, etc.) hold by definition. There is no simultaneous system to be over-determined.
  *   **The Cost:** Many critics (even sympathetic ones) argue this saves Marx's accounting at the expense of Marx's economics. If value is determined temporally/historically, it loses its power to explain *relative prices* in equilibrium. It turns the Labor Theory of Value into a historical identity rather than a structural theory of price determination. It saves the "invariances" by making them tautologies of the accounting method, rather than emergent properties of a simultaneous equilibrium. So, it dissolves the inconsistency, but arguably by retreating from the claim that value regulates price in a synchronic market.

  ### Bonus 2: Is the Roemer/Cohen retreat forced?

  **Short answer:** No, it is not logically *forced*, but it is theoretically *pragmatic*.

  **The Gist:** Roemer and Cohen argue that the core of Marxism is the theory of exploitation (property relations), not the specific technical mechanism of the LTV.
  *   **Not Forced:** One can accept Bortkiewicz's critique and still maintain a version of the LTV (e.g., the "New Interpretation" by Duménil and Foley). They argue we should drop the *individual* invariance claims and only hold the *aggregate* invariance (Total Profit = Total Surplus) as a definition of the monetary expression of labor time. This keeps the LTV as a theory of exploitation without requiring it to solve for relative prices.
  *   **Why Retreat?** Roemer/Cohen retreat because they want to reconstruct historical materialism using methodological individualism and general equilibrium tools. For that project, the LTV is a liability. They argue that exploitation can be defined purely via property relations (agents forced to sell labor power because they lack assets) without needing to prove that labor is the *substance* of value.
  *   **Verdict:** It's a strategic choice. If you want to talk to neoclassical economists, the Roemer/Cohen property-relations approach is much more robust. If you want to maintain the specific claim that capitalism is unique because it extracts *labor time* specifically (rather than just distributing resources unequally), then retreating to property relations gives up too much. Bortkiewicz kills the LTV as a *price theory*, but not necessarily as a *theory of social exploitation*—unless you insist, as Marx sometimes did, that the former is required for the latter.
