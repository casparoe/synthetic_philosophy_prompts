answer: |-
  The dust motes dancing in the afternoon light looked remarkably like the static on an old television screen. Elias watched them, a cup of lukewarm tea in his hand, surrounded by the two distinct libraries of his life. On the left: leather-bound field journals from thirty-five years in the Gombe, filled with sketches of chimpanzee grooming chains and aggression matrices. On the right: a precarious stack of paperback metaethics, dog-eared and highlighted, topped by Sharon Street's *Coming to Terms with Contingency*.

  Elias had spent his career mapping the architecture of reciprocal altruism. He knew the precise calculus a male chimp used to decide whether to share meat or support an ally in a skirmish. It was fitness, plain and simple. Genes propagating themselves through the vehicle of social behavior.

  Now, retired and widowed in all but the legal sense, he was trying to understand why he felt bound to change his wife's bedsheets when she could not ask him to, and when no one was watching to praise him.

  "El?" Martha's voice was thin, drifting from the bedroom down the hall. "The pain..."

  "In a minute, Marty," he called back, his voice steady. "Just finishing this chapter."

  He looked down at the page. Street's dilemma stared up at him. *Either natural selection shaped our evaluative attitudes to track independent moral truths, or it shaped them for fitness alone.*

  If the former, biology had to be teleological, a mechanism designed to perceive non-natural properties. Extravagant. Impossible.
  If the latter, then his urge to care for Martha was a heuristic, a fitness-promoting illusion. If so, the belief that "suffering is bad" was just a trick of the amygdala. To believe it was *actually* true would be a cosmic coincidence.

  The doorbell rang. Elias sighed. It was Julian, his former doctoral student, now a professor of philosophy at the university. Julian was the one who had handed him Street's book, a mischievous glint in his eye. "Time to clean house, Elias."

  Elias opened the door. Julian looked younger than he remembered, vibrant with the certainty of the theorist who has never had to clean a cage.

  "I was just wrestling with your gift," Elias said, gesturing to the study.

  "And?" Julian stepped in, shaking off a umbrella. "Does the biologist in you surrender to the skeptic?"

  "The biologist sees a clear causal chain," Elias said, leading him to the armchairs. "I see a man who cares for his sick wife. My science tells me this care evolved because cooperative pairs survived better than solitary ones. If I admit my science is true, Julian, I have to admit my morality might be a hallucination."

  "Street's point exactly," Julian said, accepting a cup of tea. "If evolution pushed us toward 'don't kill your kin' only because kin-sharing helps gene propagation, then you don't actually believe killing is *wrong*. You just believe it's *expensive*."

  Elias rubbed his temples. "It undermines everything. If I give money to a stranger, I tell myself it's because they have a right to aid. But if Street is right, I'm just obeying a Pleistocene script. There is no 'right.' There is only 'adaptive.'"

  A cough racked the house, sharp and wet. Elias flinched.

  "But here is where you are too much of a biologist, Elias," Julian said softly. "You are looking for a causal mechanism for truth. You want to know how the moral fact *pushed* the evolution."

  "Isn't that how knowledge works? Causal contact with reality?"

  "Not always." Julian leaned forward. "Think about mathematics. Did natural selection shape our belief that 2 + 2 = 4?"

  "Presumably. Counting resources aids survival."

  "Right. But does that mean 2 + 2 = 4 is only true because it helped us survive? Or is it true independently, and we happened to evolve minds capable of grasping it?"

  Elias paused. "Parfit."

  "Parfit," Julian confirmed. "Normative truths might be like mathematical truths. They don't exist in space and time. They don't push atoms around. They don't need a causal backstory. The fact that evolution gave us the *capacity* to see them doesn't explain *why* they are true. It just explains how we got here to see them."

  Elias looked at his field journals. "But math is descriptive. Morality is prescriptive. It commands."

  "Perhaps," Julian said. "Or consider the Third-Factor explanation. Enoch's view. Suppose survival is good. Not instrumentally, but inherently. If survival is good, and evolution selects for traits that promote survival, then evolution is selecting for traits that align with the good. The correlation between fitness and truth isn't a coincidence. It's anchored by a third value: Life itself."

  Elias stood up and walked to the window. The garden was overgrown. He had let it go since Martha's legs failed. "If I accept that," he said, "I have to accept that 'survival' or 'flourishing' is an objective good. Independent of what we think."

  "You do," Julian said. "Otherwise, why fight the cancer? Why change the sheets? If it's all just fitness, you should let go. Entropy is efficient. Caring is costly."

  Elias turned back. "Street would say I'm begging the question. I'm assuming flourishing is good to prove that my belief in flourishing is true."

  "Maybe," Julian conceded. "But the alternative is solipsism. If you accept the debunking argument fully, you lose not just morality, but reason itself. Why trust your logic? Evolution shaped logic for fitness, not truth. A logical fallacy might be more adaptive than a syllogism."

  Elias felt the weight of it. The skepticism was a solvent; it dissolved the floor beneath his feet, but it also dissolved the chair he sat on. It was self-consuming.

  "El?" Martha's voice again. Closer. She was trying to sit up.

  The theoretical fog evaporated. The concrete conviction surged up, hot and undeniable. *She is in pain. I must help.*

  Julian watched him. "This is the moment, Elias. The theory meets the flesh."

  Elias walked to the bedroom. Martha was pale, propped against the pillows, her breathing shallow. The smell of antiseptic and old paper hung in the air. He moved to her side, lifting the heavy quilt to adjust her legs.

  "Do you believe it's wrong?" Julian asked from the doorway. He hadn't followed them in, but his voice carried. "Do you believe it is *objectively* wrong to let her suffer, or do you just feel a chemical impulse?"

  Elias paused, his hands on the blanket. He looked at Martha's face, etched with the history of forty years of shared mornings, shared griefs, shared silences.

  He thought of the chimps in Gombe. He remembered a female, Flo, who had carried her dead infant for weeks. The biologists called it a malfunction of the attachment heuristic. A waste of energy. But watching her, Elias had felt a grief that transcended species. He had wept for her.

  If Street was right, his tears were just misfiring hormones.
  If Parfit was right, his tears were a recognition of a tragedy that existed whether he cried or not.

  "I don't know the metaphysics of this, Julian," Elias said, his voice low. He smoothed the blanket over Martha's knees. "I don't know if the 'wrongness' is out there in the universe like a star, or if it's in here." He tapped his chest. "But the demand is the same."

  "But if it's just in here," Julian pressed, "it's contingent. If you were evolved differently, you could leave her."

  "Maybe," Elias said. He took Martha's hand. It was cool. "But I am not evolved differently. I am here. And the truth of mathematics doesn't help me lift her. The truth of biology doesn't stop the pain."

  He looked at Julian. "You say the realist needs a causal story. But maybe the causal story is irrelevant to the justification. I don't care for her *because* it is true. I care for her, and in that acting, the truth is constituted."

  "That's verging on constructivism," Julian warned.

  "Call it what you like." Elias turned back to his wife. "Marty, I'm here. I'm going to get the morphine."

  "Thank you," she whispered.

  Elias administered the dose. He watched the tension leave her shoulders. He felt the familiar wash of relief, the sense of *rightness* that accompanied the alleviation of suffering.

  Julian lingered in the hall. "So, you reject the debunking argument?"

  Elias walked back to the study. He picked up Street's book. He didn't throw it. He placed it gently on top of the field journals.

  "I reject the idea that a causal explanation exhausts the meaning of an action," Elias said. "Evolution gave me the eyes. It didn't create the light. Whether the light is 'out there' or 'in here'... I can't prove it. But if I deny the light because I can't find its source, I choose the dark."

  He looked at the dust motes again. They were still dancing, chaotic, driven by air currents he couldn't see.

  "Street's dilemma assumes that if evolution shaped the belief for fitness, the belief can't be true," Elias mused. "But what if the fitness *is* the truth? Not survival of the genes, but survival of the bond. The reciprocal altruism isn't a lie about morality, Julian. It's the biological shadow of the moral reality. We are built to track the good because the good is what sustains us."

  "That's the Third-Factor again," Julian smiled. "You're a realist, Elias. You just needed to admit it."

  "I'm a biologist," Elias corrected. "I know that organisms that don't care for their young die out. But I also know that I would care for Martha even if it killed me. Even if it reduced my fitness to zero. That excess... that inefficiency... that is where the truth hides."

  Julian nodded slowly. He picked up his umbrella. "I'll let you rest. She sleeping?"

  "Drifting off."

  "See you next week?"

  "Yes."

  When the door closed, the house was silent again. Elias sat in his armchair. The doubt was still there, a quiet hum in the background. He knew he couldn't prove, logically, that his duty wasn't an illusion. The skeptic's logic was airtight if you accepted its premises.

  But as he listened to the rhythm of Martha's breathing from the other room, a steady, fragile cadence, Elias realized the argument required him to be a ghost in his own life. It asked him to observe his love from a distance and label it a mechanism.

  He closed his eyes. He let the mechanism be. He let the genes have their say. But he knew, with a certainty that required no proof, that when the morning came, he would make the coffee. He would bring it to her. He would do it because it was *due*.

  The evolutionary story explained how he got to the chair. It did not explain why he would not leave it. And in that gap, in that silence between the cause and the action, Elias found the only space where morality could live.
