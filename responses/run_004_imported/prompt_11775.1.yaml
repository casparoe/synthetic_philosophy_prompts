answer: |-
  This is a profound conflict that sits at the intersection of labor law, business ethics, and political philosophy. It pits the **Liberal Contractualist** view of employment (your friend) against the **Communitarian/Expressive** view (the manager).

  Here is the steelmanned version of both arguments, followed by an analysis of who holds the stronger position.

  ### Steelman 1: The Manager (The Expressive Community Model)

  The manager's argument rests on the idea that a corporation is not merely a profit-generating machine, but a **moral community** with a right to self-definition.

  1.  **Expressive Association:** Just as a private club or a religious organization can require members to adhere to certain lifestyle standards to maintain the group's identity, a company is an "expressive association." It has a right to curate its membership to ensure everyone embodies the mission and values. If the company values "health," "discipline," or "conservatism," an employee openly flouting those values (even off-hours) dilutes the organization's moral coherence.
  2.  **Reputation is Fragile and Holistic:** In the social media age, there is no hard wall between "private" and "professional." Employees are brand ambassadors 24/7. If a client or partner learns an employee engages in legal but controversial behavior, they may associate that behavior with the company. The harm isn't always immediate or quantifiable (like a safety accident); it is often a slow erosion of trust or brand equity.
  3.  **Culture as a Productive Asset:** High-performing teams rely on implicit trust and shared norms. If employees hold radically divergent views on lifestyle or ethics, it can create subtle friction, reduce psychological safety, and hinder collaboration. The company is paying for the *whole person's* integration into the team, not just their output during office hours.
  4.  **Risk Management:** "No harm yet" is not the same as "no risk." Lawful conduct today can become unlawful or scandalous tomorrow. By setting a high bar for "values alignment," the company is preemptively mitigating future liability or public relations crises.

  ### Steelman 2: The Friend (The Liberal Harm Principle)

  Your friend's argument rests on the **Liberal Contractualist** view, which treats employment as a specific economic exchange with strict boundaries to protect individual liberty.

  1.  **The Harm Principle:** Drawing from John Stuart Mill, the only justification for exercising power over an individual against their will is to prevent harm to others. If the conduct is lawful, off-duty, and does not impact performance or safety, there is no victim and no tangible damage. Policing behavior absent harm is paternalism, not management.
  2.  **Sphere Sovereignty:** A healthy society requires distinct spheres of life (home, work, civic, religious). When employers colonize private life, they create a totalitarian dynamic where the employee is never truly "off." This erodes mental health and autonomy. The wage purchases labor and professional conduct, not moral obedience.
  3.  **The Subjectivity Trap:** "Company Values" are notoriously vague and subjective. Who defines them? Usually, it is the dominant culture of the leadership. This policy creates a vector for bias. A manager might decide a single parent working a second job is "incompatible with work-life balance values," or that a political donation is "incompatible with inclusivity." Without a "demonstrable harm" standard, enforcement becomes arbitrary and discriminatory.
  4.  **The Chilling Effect:** When employees know they can be fired for private choices, they do not become more "aligned"; they become more fearful and conformist. Innovation requires psychological safety and the freedom to be different. A culture of surveillance and conformity drives away top talent who value autonomy, leaving only those willing to submit to authority.

  ***

  ### The Verdict: Who is Actually Right?

  While the Manager identifies a real business risk (reputation), **your friend is right on the principle, and the Manager is wrong on the application.**

  Here is why the Friend's position is the more robust, ethical, and sustainable framework for modern employment.

  #### 1. The "Values" Standard is Unenforceable without Bias
  The Manager's argument collapses on the definition of "values." In a diverse workforce, values are subjective. If a company fires someone for cannabis use based on "health values," but retains a heavy drinker because "networking is important," the policy is revealed as arbitrary.
  Without a **Harm Principle** (your friend's standard), "Values Alignment" becomes a catch-all term that allows leadership to fire people they simply dislike or find culturally "other." Historically, these policies are disproportionately used against marginalized groups whose "off-duty conduct" (dress, speech, association) differs from the corporate norm. Your friend's demand for *demonstrable harm* is the only objective guardrail against discrimination.

  #### 2. The Distinction Between "Representative" and "Individual" Roles
  The Manager's argument holds water *only* for specific roles. If the employee were the CEO, a public spokesperson, or a safety-sensitive role, the "brand ambassador" argument is strong. However, the prompt specifies this was a **non-safety-sensitive job** where the conduct was discovered **by accident.**
  For the vast majority of individual contributors, the company is purchasing specific skills and professional output. Extending control to private life is an overreach of the economic contract. If the company wants to own 24/7 of a person's moral agency, they must pay a premium for that intrusion. To demand it as a baseline condition of employment is an imbalance of power.

  #### 3. Reputation Risk vs. Trust Risk
  The Manager argues they are protecting reputation. However, in the modern labor market, **reputation cuts both ways.**
  Companies that fire employees for lawful off-duty conduct are increasingly viewed as untrustworthy by potential hires. The risk of losing a client who dislikes cannabis is arguably lower than the risk of a workforce that lives in fear of being reported by colleagues. The "accidental" discovery mentioned in your prompt suggests a culture of surveillance. That is a far greater liability to a business than one employee's weekend habits. A policy that encourages coworkers to police each other's private lives destroys psychological safety.

  #### 4. Legal Trajectory
  Legally, the trend is moving toward your friend. Jurisdictions like California, New York, and Canada have specifically updated labor laws to protect lawful off-duty conduct (specifically cannabis) because legislators recognize the Manager's approach as an infringement on civil liberties. While the company may currently have the *legal* right to do this in some "at-will" jurisdictions, they are fighting the tide of labor ethics.

  ### Conclusion

  The Manager is correct that **culture matters** and that **employees reflect on the brand.** However, they are incorrect that **policing private life** is the way to manage that.

  Your friend is right because they are advocating for a **boundary** that preserves the integrity of both the worker and the work.
  *   **For the Worker:** It preserves autonomy and prevents the employer from becoming a moral guardian.
  *   **For the Employer:** It forces them to manage based on *performance* and *professional conduct*, which are objective, rather than *values*, which are subjective.

  **The Verdict:** Your friend is right. A company that cannot tolerate lawful, harmless off-duty conduct is not protecting its values; it is masking a lack of trust in its own culture. The "Harm Principle" is the only standard that prevents workplace policy from becoming a tool of arbitrary power.
