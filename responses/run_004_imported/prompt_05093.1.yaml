answer: |-
  The dispute over whether interpretability features are ontological realities (Realism) or observer-relative descriptions (Instrumentalism) is not merely academic when superposition is present. If features are decomposition-dependent artifacts rather than stable causal units, safety claims based on them suffer from specific failure modes.

  Here are the four most important implications for how we evaluate and act upon interpretability-based safety claims, focusing on shifts in epistemic standards and intervention protocols.

  ### 1. Shift from "Sufficiency" to "Necessity and Stability" Standards
  **The Implication:** If features are instrumental descriptions rather than fixed hardware, finding a circuit that *can* produce deceptive behavior (sufficiency) provides low epistemic weight regarding whether the model *will* produce it. In a superposed system, multiple overlapping circuits can implement the same function. Ablating one may simply route the computation through a different, unmonitored subspace (the "Hydra effect").

  **Change in Evaluation/Action:**
  *   **Evaluation:** Safety claims must move beyond existence proofs ("We found a deception circuit") to exclusion proofs ("We have ruled out alternative implementations"). Epistemic weight should be heavily discounted for claims that rely solely on activation correlation or single-pass ablation.
  *   **Action:** Interventions must be tested for **robustness to re-optimization**. If you ablate a "deception direction," you must fine-tune the model slightly to see if the behavior recovers via a different projection. Safety certification should require demonstrating that the capability itself is removed, not just that one specific implementation path is blocked.

  ### 2. Requirement for Decomposition Invariance in Monitoring
  **The Implication:** If features are observer-relative (dependent on the specific Sparse Autoencoder seed, hyperparameters, or probing method), then a safety monitor built on one decomposition may fail to detect the same concept in a slightly different model state or a different SAE run. The "feature" is not a stable property of the model, but of the model-decomposer pair.

  **Change in Evaluation/Action:**
  *   **Evaluation:** Epistemic weight should be assigned proportionally to the **invariance** of the feature across decompositions. A feature identified by a single SAE run is weak evidence. A feature that emerges consistently across different SAE seeds, pruning levels, or even distinct interpretability methods (e.g., SAEs vs. NMF) warrants higher trust.
  *   **Action:** Deployment monitoring cannot rely on static feature vectors. Safety systems must employ **ensemble monitoring** (tracking the concept across multiple decompositions) or focus on **causal intermediates** that are more architecturally constrained (e.g., specific attention patterns rather than activation directions) to ensure the monitor tracks the function, not just the current geometric arrangement.

  ### 3. Interference Audits for Safety Edits
  **The Implication:** In a superposed regime, directions are non-orthogonal. A direction identified as "deceptive" likely shares dimensions with benign or critical features (polysemanticity). If the feature is an instrumental cut through a high-dimensional soup, editing it is not like cutting a wire; it is like dampening a specific frequency that carries multiple signals.

  **Change in Evaluation/Action:**
  *   **Evaluation:** Claims that a specific edit renders a model "safe" must be treated with skepticism unless accompanied by **interference metrics**. The epistemic burden is on the researcher to show that the edit does not degrade general capability or induce new, unpredicted behaviors via shared dimensions.
  *   **Action:** Safety interventions must include **adversarial capability testing**. Before deploying a model with a "deception ablation," one must test for degradation in unrelated tasks that might share the superposed subspace. If the "deception feature" overlaps with "code generation," editing it might break the model's utility, or worse, cause the model to compensate in unpredictable ways.

  ### 4. Distinction Between "Monitoring" and "Guaranteeing"
  **The Implication:** The philosophical dispute highlights a gap between *describing* behavior and *constraining* it. If features are descriptive tools for observers, they are excellent for post-hoc forensics (understanding why a failure happened) but poor for pre-commitment guarantees (ensuring a failure won't happen). Instrumental features describe the system from the outside; they do not necessarily govern the system from the inside.

  **Change in Evaluation/Action:**
  *   **Evaluation:** We must downgrade the epistemic weight of interpretability claims when used for **formal verification**. You cannot formally verify a system against a property that is not determinately true of the system's ontology. Claims should be categorized as "Forensic Explanations" (high validity) vs. "Safety Guarantees" (low validity).
  *   **Action:** Safety strategies should prioritize **input-output constraints** and **runtime enforcement** over internal feature suppression. While internal monitoring provides early warning signals, reliance on them for hard safety boundaries is unjustified under an instrumentalist view of superposition. Interpretability should be used to *inform* the design of external guards, not to *replace* them.

  ### Summary of Epistemic Shift
  The core implication is a shift from **Localization to Characterization**.
  *   **Old Standard:** "We located the deception neuron; therefore, we control the deception."
  *   **New Standard:** "We have characterized the subspace where deception is computationally viable; therefore, we can bound the probability of deception under specific perturbations."

  Safety claims should be treated as **probabilistic bounds on behavior** derived from approximate models, rather than **deterministic statements about mechanism**. This lowers the immediate promise of "turning off" bad behaviors via editing but increases the rigor required to claim a model is safe for deployment.
