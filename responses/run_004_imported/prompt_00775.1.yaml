answer: |-
  This is an excellent catch. You are not being uncharitable; you have put your finger on the single most vulnerable joint in Mill's argument for plural voting. It is a tension that political theorists have debated for over a century, and it cuts directly to the heart of the modern epistocracy debate (including Brennan).

  To answer your question directly: **Yes, there is a principled distinction Mill is *attempting* to draw, but no, he does not successfully demonstrate that his proposed proxy avoids the pitfalls of the property qualification he rejects.**

  Here is the breakdown of why this is a genuine inconsistency in the *application*, even if the *principle* remains internally coherent, and what that implies for the broader epistocratic project.

  ### 1. Mill's Principled Distinction (The Steelman)

  Mill is trying to thread a needle between two dangers:
  1.  **Class Legislation by the Poor:** Universal equal suffrage might lead the numerical majority (the working class) to vote themselves benefits at the expense of the rich/capital.
  2.  **Class Legislation by the Rich:** A property qualification gives the wealthy a veto, leading them to protect their assets at the expense of the poor.

  Mill wants a "Natural Aristocracy" of talent, not wealth. His distinction between **Property** and **Occupation** rests on three pillars:

  *   **Active Faculties vs. Passive Possession:** For Mill, the goal of government is not just to protect interests but to cultivate human character. Property is a passive state; you can inherit land and do nothing. Occupation, specifically managerial or skilled occupation, requires the *active exercise of intellect*. A banker managing complex ledgers is cultivating their mind; a landlord collecting rent is not. Mill is weighting *mental cultivation*, not *economic stake*.
  *   **Fluidity:** Property (especially landed property in the 19th century) was often static and hereditary. Occupation is theoretically more fluid. A laborer can become a foreman; a tradesman can become a merchant. Mill hopes this allows for social mobility within the voting structure, whereas a property qualification calcifies class lines.
  *   **The "Makeshift" Clause:** As you noted, Mill explicitly calls this a "temporary makeshift" pending a national education system. He admits it is imperfect. His argument is essentially: *"Property is a corrupt metric for competence. Occupation is also a corrupt metric, but it is a less corrupt one because it tracks mental activity rather than bank balances, and we will discard it once everyone is educated."*

  ### 2. The Genuine Inconsistency (The Critique)

  However, your intuition is correct: the proxy collapses under scrutiny. Here is why the distinction fails to hold water:

  **A. The Correlation Problem**
  In Mill's England (and arguably today), occupation is almost perfectly correlated with class and wealth. A "banker" is wealthy; a "laborer" is poor. By giving the banker more votes, you are functionally giving the wealthy more votes. Mill claims this isn't about wealth, but the *effect* is indistinguishable from a property qualification. If the outcome is the same (the rich have more political power than the poor), the principled distinction regarding the *source* of that power (job vs. land) becomes moot to the disenfranchised laborer.

  **B. The Definition of "Intelligence"**
  Mill assumes that managing capital ("larger and more complicated interests") requires more intelligence than manual labor. This is a substantive philosophical claim that is highly contestable. It biases the system toward a specific *kind* of intelligence (managerial/bourgeois) and devalues others (technical/practical/communal).
  By defining "competence" through the lens of 19th-century capitalist hierarchy, Mill smuggles class bias back into the definition of epistemic authority. He rejects property as a proxy for *worth*, but then accepts the social hierarchy generated by property as a proxy for *intelligence*.

  **C. The Return of Class Legislation**
  Mill's biggest fear is "class legislation." He argues that if the rich have more votes solely because they are rich, they will vote for rich interests. But if bankers have more votes because they are "smarter," they will *still* likely vote for banker interests. The psychological link between one's material position and one's political preferences doesn't vanish just because you framed the voting power as a reward for "intelligence." The banker still has the same material interests as the landlord; giving him more votes still risks the exact "class legislation" Mill wanted to avoid.

  ### 3. Does This Sink the Plural Voting Idea?

  This depends on whether you view the flaw as **fatal to the principle** or **fatal to the implementation**.

  **If it's a fixable detail (Implementation Flaw):**
  One could argue Mill just picked a bad proxy. Modern epistocrats (like Brennan) might argue we shouldn't use occupation, but rather **knowledge tests**. If we could design a test that measures political knowledge without correlating to SES (socioeconomic status), we could achieve Mill's goal without his class bias.
  *   *Counter:* Decades of psychometrics suggest this is impossible. Cognitive testing almost always correlates with SES, education quality, and wealth. We haven't found a "class-neutral" proxy for competence yet. Mill's failure to find one might not be an accident; it might be structural.

  **If it sinks the whole idea (Principle Flaw):**
  The stronger critique is that **competence cannot be separated from privilege.**
  Mill wants to separate "authority" from "interest." He wants the competent to rule for the good of all, not for their own class. But if the metric for competence (occupation, education, test scores) is inextricably linked to class position, then "rule by the competent" becomes "rule by the privileged class" in disguise.
  If the epistocratic weighting inevitably aligns with class interests, then Mill's fear of class legislation is realized regardless of the justification. The "principled distinction" between property and occupation dissolves because the *political effect* is identical.

  ### 4. The "Idle Rich" Loophole

  There is one area where Mill's proposal is actually *more* radical than a property qualification, which is worth noting.
  A property qualification gives votes to the **idle rich** (landlords, inheritors). Mill's occupation proposal theoretically disenfranchises (or down-weights) the idle rich who do not work. A wealthy man living off dividends without managing the investment might not qualify for the "banker/merchant" extra votes in Mill's scheme.
  So, Mill is trying to privilege the **active bourgeoisie** over the **aristocracy**. It's not a perfect separation of wealth and power, but it is a shift from "old money" to "meritocratic money." However, for the laborer, the difference between being ruled by a landlord or a banker is often negligible.

  ### Conclusion

  You have identified the central tension that makes epistocracy politically toxic. Mill is trying to solve a political problem (class conflict) with an administrative solution (weighting votes).

  *   **Is it an inconsistency?** Yes. He claims to reject wealth as a metric for political value, but then selects a proxy (occupation) that is a direct function of wealth distribution in a capitalist society.
  *   **Does it sink the argument?** It sinks the *feasibility* of the argument. It demonstrates that in a stratified society, you cannot construct a hierarchy of "competence" that does not mirror the hierarchy of "class."

  For the modern rationalist/epistocrat reader: This is the "Gotcha" that usually ends the conversation. Unless you can propose a mechanism for determining political competence that is **uncorrelated with socioeconomic status**, Mill's problem remains unsolved. If the "smart" people are always the "rich" people, then "rule by the smart" is indistinguishable from "rule by the rich," and Mill's fear of class legislation wins out.

  Mill's honesty about it being a "makeshift" is his saving grace. He admits the system is flawed but thinks it's less flawed than the alternatives available in 1861. Whether we have better alternatives today is the real question Brennan and others are grappling with.
