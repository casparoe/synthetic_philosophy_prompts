      *   Clarity: Break down the logic step-by-step.

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, does Lewis reject penal substitution entirely?* I need to recall the paper's conclusion. Lewis actually argues that penal substitution *can* make sense under certain conditions (voluntary, etc.), but he starts by clearing away the bad metaphors. He isn't necessarily debunking it, but refining the logic. I should be careful not to say "Lewis proves it's false." He's analyzing the *coherence*.
      *   *Correction:* The user asks how it prepares the ground. The ground is cleared by removing the "financial debt" confusion. The core issue is whether punishment is essentially *transferable*.
      *   *The "Society" point:* It's specifically about the *direction of value*. In debt, value flows *to* the creditor. In punishment, value (resources) flows *away* from society to maintain the punishment.

  8.  **Final Polish:** Organize into clear sections: The Logic of the Creditor, The Failure of the Society Metaphor, and The Implication for Penal Substitution. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in the theology. The user wants the *logical* move explained. Stick to Lewis's philosophy of language/metaphor analysis.

  *Key Insight:* The "debt" metaphor suggests a transaction that *balances a ledger*. Lewis is pointing out that punishment *doesn't* balance a ledger for anyone; it just creates a new loss (the prisoner's suffering) often at further cost (taxes). If there's no ledger being balanced for a specific creditor, the logic of "someone else paying the balance" loses its footing.

