answer: |-
  It is a pleasure to correspond with someone who has spent a lifetime attending to the particulars of the natural world and has now turned a reflective eye toward the structures we use to organize it. Your suspicion is well-founded: you and your younger colleague are not merely disagreeing about facts. You are disagreeing about *ontology*—what kind of thing a category is supposed to be—and about the *teleology* of classification—what a classification is *for*.

  The stalemate you experienced is a classic instance of what philosophers of science call a conflict between **cladistic realism** and **functional utility**. Neither of you was being obtuse; you were simply prioritizing different virtues of a scientific system.

  Here is a breakdown of the philosophical terrain you are standing on, and some thoughts on whether there is a non-arbitrary way to navigate it.

  ### 1. The Nature of the Disagreement: Clades vs. Grades

  To put a technical label on your colleague's position: she is arguing for **monophyly**. In modern systematics (cladistics), a valid group must contain an ancestor and *all* of its descendants. Because tetrapods (cows, ostriches, humans) evolved from lobe-finned fish ancestors, excluding them from the group "fish" renders "fish" **paraphyletic**. To a strict cladist, a paraphyletic group is a fiction; it is a "grade" of organization rather than a "clade" of ancestry. She views the Tree of Life as the only true map, and any label that cuts across the branches is a distortion of history.

  Your position relies on **morphological and ecological coherence**. You are defending an **evolutionary grade**. This approach groups organisms by shared adaptive zones and body plans (gills, fins, aquatic life). This was the standard before the cladistic revolution of the 1970s and 80s, but it has not disappeared because it remains incredibly useful. You are arguing that "fish" describes a *way of being* in the world, not just a point of origin.

  When you talked past each other, it was because she was asking, "Is this category historically accurate?" and you were asking, "Is this category practically useful?" These are both valid scientific questions, but they yield different answers.

  ### 2. Is One Argument "Better"?

  In the philosophy of biology, this is often discussed under the heading of **Natural Kinds**. Are "fish" a natural kind discovered in nature, or a convenient bucket imposed by human minds?

  *   **The Case for the Colleague:** If the museum's primary mission is to teach evolutionary history, she is right. Labeling a coelacanths as a "fish" without qualification reinforces the pre-Darwinian intuition that there is a fundamental ontological gap between water-dwellers and land-dwellers. It hides the very continuity that natural history museums exist to demonstrate. In a research context, her view is the dominant standard because it predicts genetic and developmental traits more reliably.
  *   **The Case for You:** If the museum's mission is to help the public navigate the diversity of life, you are right. "Fish" is a stable concept in human cognition. We recognize the body plan. We understand the ecological niche. To tell a visitor that a tuna is not a "fish" in the same way a cow is not a "fish" is to sacrifice communicative clarity for technical precision. As the philosopher John Dupré has argued, there is "promiscuous realism": the world is complex enough to support multiple, overlapping classification systems depending on our interests. For a fisherman, an ecologist, or a museum visitor, "fish" is real enough.

  ### 3. The Incommensurability

  You noted that you could make no headway because you could not agree on "what sort of consideration was even supposed to settle the question." This is the philosophical heart of the matter.

  Thomas Kuhn famously argued that competing scientific paradigms can be **incommensurable**—that proponents speak different languages and value different evidence. While your disagreement isn't quite that deep, it shares the structure. You are valuing **stability and recognition** (the continuity of the collection's identity); she is valuing **phylogenetic accuracy** (the continuity of lineage).

  There is no "view from nowhere" to settle this. There is only the question of the exhibit's purpose. If the label is intended to denote evolutionary relationships, the cladistic view wins. If the label is intended to denote ecological habit or morphological similarity, the phenetic view wins. The error lies in assuming there is only one "True" system of classification that nature dictates. Nature provides the variation; we provide the categories.

  ### 4. A Non-Arbitrary Basis for Preference

  You asked if there is a non-arbitrary basis for preferring one over the other. I would suggest there is, but it lies outside biology and inside **museum ethics and pedagogy**.

  A natural history museum is a bridge between the research frontier and the public understanding.
  *   **Arbitrary:** Deciding based solely on tradition ("We've always called them fish") or solely on dogma ("Cladistics is the only truth").
  *   **Non-Arbitrary:** Deciding based on what minimizes confusion while maximizing truth.

  There is a growing consensus in museum studies that suggests a hybrid approach is often the most honest. For example:
  1.  **Acknowledge the usage:** Use the word "Fishes" (plural is often preferred in scientific contexts to acknowledge diversity) but include a sub-header or introductory panel that explicitly explains the cladistic controversy.
  2.  **Contextual Labeling:** In a phylogeny tree, show the nesting of tetrapods within lobe-finned fish. In the display cases, group by habitat and form.
  3.  **The "Fruit" Analogy:** This is often the best way to explain it to the public. Botanically, a tomato is a fruit. Culinarily, it is a vegetable. Neither is "false." One describes reproductive anatomy; the other describes flavor profile and usage. Similarly, a human is genealogically a "fish," but ecologically and morphologically a tetrapod.

  ### Conclusion

  You are not wrong to feel that "fish" captures something real. The convergence of body plans among aquatic vertebrates is not an illusion; it is a testament to the constraints of physics and the power of natural selection. That similarity is objective, even if the category is not monophyletic.

  However, your colleague is also not wrong that the category hides a deeper historical truth.

  The resolution is not to declare one of you the winner, but to recognize that **classification is a tool, not a mirror.** A hammer and a screwdriver are both "correct" tools, but not for the same job. If the label is meant to help a visitor find the tuna, "fish" is the right tool. If the label is meant to explain why the tuna has a backbone, "vertebrate" (including the human lineage) is the right tool.

  My suggestion? Do not drop the word "fish." It is too embedded in language and cognition to be purged without cost. But perhaps the new label can bear the scar of this disagreement. A small note acknowledging that "While we group these animals by their shared aquatic life, modern genetics reveals that some 'fish' are more closely related to land animals than to other fish" turns a semantic conflict into a teaching moment about how science revises its own categories.

  That, perhaps, is the most philosophical thing a museum can do: not just display the answers, but display the question.
