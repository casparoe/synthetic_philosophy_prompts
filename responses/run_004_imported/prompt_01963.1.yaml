          *   If the goal is to teach evolutionary history -> Younger curator wins.
          *   If the goal is to help visitors identify animals or understand ecology -> User wins.
      *   **The "Incommensurability" Aspect:**
          *   Confirm the user's suspicion: You couldn't make headway because you were playing different games with different scoring systems.
          *   Use the analogy of "Fruit" vs. "Vegetable" (culinary vs. botanical) or "Planet" vs. "Dwarf Planet."
      *   **Non-Arbitrary Basis for Preference:**
