answer: |-
  The gaslight hissed, a steady, insectile sound that seemed to measure the passing seconds more accurately than the clock on the mantel. Arthur adjusted the wick until the flame burned blue and silent, then turned back to the table.

  Five children sat in a row against the far wall, their legs swinging slightly, not touching the floor. They were the daughters of a colleague, bright-eyed and bored, dressed in stiff collars that scratched when they turned their heads. Arthur preferred children. Adults lied with intent; children lied with impulse. There was a difference, though both led to the same corruption of data.

  On the table before him lay a deck of ordinary playing cards, faces down. A wooden screen separated him from the children. His task was simple: draw a card, concentrate on the symbol, and have the eldest girl, Eliza, write down what she saw in her mind. Thought-transference. Telepathy. The words felt clumsy in his head, like tools borrowed from a trade he didn't respect.

  He drew the Queen of Hearts.

  He stared at the red ink, focusing until the edges blurred. He did not pray—he was not a praying man—but he directed his will toward the girl behind the screen with the same intensity he might have used to solve a differential equation. He needed her to be right. He needed it with a hunger that shamed him.

  "Record," he said.

  The scratch of Eliza's pencil on the paper was loud in the quiet room. She slid the sheet around the edge of the screen.

  *Queen of Hearts.*

  Arthur did not smile. He marked a tally in his ledger. *Success.*

  It was the twentieth success in a row. Statistically impossible. Miraculous. Or fraud.

  He looked at the pencil in Eliza's hand. It was short, chewed at the end. He looked at the younger sisters. The smallest one, Mary, was watching Eliza's hand, not Arthur. There was a tension in the room, not of supernatural energy, but of human collusion. It was the same tension he felt in the lecture hall when a student recited an answer too perfectly, having stolen the key from the professor's desk.

  Arthur dipped his pen in the inkwell. The black fluid shimmered.

  If this was real, the universe was not a machine of cold collision. It was woven together. Minds touched across the barrier of skin and bone. If minds could touch, then perhaps interests could align. Perhaps the sacrifice of the self for the other was not a biological error, a glitch in the evolutionary code that doomed the altruist to extinction while the egoist thrived. If the universe was connected, then goodness was not a losing strategy. It was simply physics we hadn't mapped yet.

  But if it was fake...

  If it was fake, then the silence outside this room was absolute. The stars were burning gas, not eyes. The moral law inside him was just a habit, a social construct with no more weight than the rules of whist. To be good in a dead universe was to be a fool who paid debts to a bank that had burned down.

  He drew the next card. Seven of Spades.

  He watched the reflection in the dark window pane. The room was mirrored there, ghostly and inverted. He saw Eliza shift her foot. He saw Mary's foot shift in sympathy. A tap. A code.

  His heart sank, a heavy stone dropping into a well. He had known. He had known for the last ten cards. He had watched the micro-expressions, the synchronized breathing, the way Eliza waited for the rustle of Mary's skirt before putting pen to paper.

  He could stop it. He could stand up, overturn the screen, and demand an explanation. He could expose them. He could preserve the integrity of the Society, of science, of truth.

  But if he exposed them, the hope died too.

  The pencil hovered over his ledger. *Success.*

  If he marked it *Failure*, the chain was broken. The evidence collapsed. The universe returned to silence. If he marked it *Success*, he lied. He became part of the fraud he sought to eradicate. He would be building a cathedral on a foundation of rot.

  He looked at Eliza. She was watching him, waiting for the cue. She knew he knew. Her eyes were wide, pleading not for forgiveness, but for complicity. She wanted to be magical. She wanted to be the proof that saved him.

  The gaslight hummed. The clock ticked.

  Arthur thought of the book he was writing, the ethics manuscript that sat in a locked drawer upstairs. It ended in a contradiction. *Practical Reason* demanded he pursue his own good; *Morality* demanded he pursue the universal good. They did not meet. They never met. He had spent twenty years looking for the bridge. He had mailed seventeen thousand surveys asking strangers if they had seen ghosts, hoping the aggregate data would reveal a seam in reality where the divine might leak through.

  He had found only noise. And now, here, in this quiet room, he had found a signal. But it was human. All too human.

  He looked at the ledger. The columns were neat, rigorous. A monument to order.

  "Continue," Arthur said softly.

  Eliza blinked. She looked at Mary. Mary tapped her foot.

  Arthur drew the next card. King of Clubs.

  He watched them cheat. He watched the transfer of information, the tiny, mechanical conspiracy of biology. It was impressive, in its way. A network of minds, working together to deceive. Was that not a kind of connection? Was that not a kind of order?

  He dipped the pen. The ink was cold.

  He marked *Success.*

  He felt a sickness in his stomach, a hollowing out of his chest. He was falsifying data. He was becoming the very chaos he sought to disprove. And yet, as he wrote the number, he felt a terrible, fleeting relief. For one more moment, the universe remained open. For one more moment, goodness was not a solitary act performed in the dark.

  He drew another card. Ace of Diamonds.

  The girls performed their trick. He recorded their lie.

  Outside, the London fog pressed against the glass, thick and yellow, swallowing the streetlights. There was no help coming from out there. There never had been. The only light was here, in this room, manufactured by gas and will and deception.

  When the deck was finished, Arthur closed the ledger. The sound was final, like a coffin lid.

  "You may go," he said.

  The children scrambled down, giggling now that the performance was over. They ran from the room, their footsteps echoing on the hardwood. Eliza lingered at the door.

  "Did we do well, Mr. Penrose?"

  He looked at her. He wanted to tell her that she had destroyed everything. He wanted to tell her that she had saved him.

  "You did very well," he said.

  She left. The door clicked shut.

  Arthur sat alone in the silence. He opened the ledger again and stared at the column of successes. They were perfect. They were undeniable. They were worthless.

  He took his pen and drew a single line through the page, not crossing it out, just marking it. A separator. Tomorrow, he would test them again. He would change the seating. He would remove the screens. He would catch them, eventually. He had to catch them.

  But tonight, he let the lie stand. He blew out the gaslight, plunging the room into darkness, and sat there in the quiet, waiting for his eyes to adjust, waiting for a shape in the dark that did not come.
