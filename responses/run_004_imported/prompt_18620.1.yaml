      *   *The "Preemption" Problem:* For M&R, the P-process *preempts* the B-process. Preemption requires that if P-process fires, B-process *does not* cause the effect. This implies the B-process is *not* sufficient in the actual sequence. If it's not sufficient in the actual sequence, is it sufficient in the alternative sequence? If yes, why the difference? The difference must lie in the P-process. If the P-process makes the difference, the P-process has control. If the P-process has control, it could have done otherwise (by letting B-process run or inhibiting it).

