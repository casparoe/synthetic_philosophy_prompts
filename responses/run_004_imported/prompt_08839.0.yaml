prompt: |-
  So I'm doing this extra-credit primary source thing for my history of science class (we're in the Scientific Revolution unit) and I picked Newton because I already knew the gravity/apple/plague-year stuff and wanted to find something nobody else would pick. I ended up falling down this rabbit hole about how he secretly didn't really buy the Trinity? Like apparently in 1690 he wrote this whole letter to John Locke called "An Historical Account of Two Notable Corruptions of Scripture," arguing that the verse 1 John 5:7 -- the one that goes "For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one" -- got snuck into the Bible later and isn't original, and that the real verse only talked about earthly witnesses: the Spirit, the water, and the blood (which I think refers to Jesus's baptism and death).

  Most of the letter is just him going manuscript by manuscript, wich is dry but at least followable. But near the end he switches to a totally different kind of argument, based on what actually makes sense in the passage rather than what any old manuscript says, and this is the bit that's got me stuck (I tried explaining it to my friend who's doing the same assignment and we just confused each other more). Here's the actual text -- I only trimmed two mid-sentence bible citations in parentheses, everything else including the weird capitalization is exactly how its written:

  "Having given you the history of the controversy, I shall now confirm all that I have said from the sense of the text itself. For, without the testimony of "the Three in Heaven," the sense is good and easy, as you may see by the following paraphrase inserted in the text in a different character.

  'WHO IS HE THAT OVERCOMETH THE WORLD, BUT HE THAT BELIEVETH THAT JESUS IS THE SON OF GOD? that Son spoken of in the Psalms, where he saith, "Thou art my Son; this day have I begotten thee." THIS IS HE THAT, after the Jews had long expected him, came, first in a mortal body BY baptism of WATER, AND then in an immortal one by shedding his BLOOD upon the cross, and rising again from the dead; NOT BY WATER ONLY, BUT BY WATER AND BLOOD; being the Son of God, as well by his resurrection from the dead, as by his supernatural birth of the Virgin. AND IT IS THE SPIRIT also, THAT, together with the water and blood, BEARETH WITNESS of the truth of his coming; BECAUSE THE SPIRIT IS TRUTH; and so a fit and unexceptionable witness. FOR THERE ARE THREE THAT BEAR RECORD of his coming; THE Spirit, which he promised to send, and which was since shed forth upon us in the form of cloven tongues, and in various gifts; THE baptism of WATER, wherein God testified, "This is my beloved Son;" AND THE shedding of his BLOOD, accompanied with his resurrection, whereby he became the most faithful martyr or witness of this truth, AND THESE THREE, the spirit, the baptism, and passion of Christ, AGREE IN WITNESSING ONE and the same thing, namely, that the Son of God is come; and, therefore, their evidence is strong: for the law requires but two consenting witnesses, and here we have three. AND IF WE RECEIVE THE WITNESS OF MEN, THE threefold witness OF GOD, which he bare of his Son, by declaring at his baptism, "This is my beloved Son;" by raising him from the dead, and by pouring out his spirit on us, IS GREATER; and therefore ought to be more readily received.'

  Thus is the sense plain and natural, and the argument full and strong; but if you insert the testimony of "the Three in Heaven," you interrupt and spoil it. For the whole design of the apostle being here to prove to men, by witness, the truth of Christ's coming, I would ask how the testimony of "the Three in Heaven" makes to this purpose. If their testimony be not given to men, how does it prove to them the truth of Christ's coming? If it be, how is the testimony in heaven distinguished from that on earth? It is the same spirit which witnesses in heaven and in earth. If in both cases it witnesses to us men, wherein lies the difference between its witnessing in heaven, and its witnessing in earth? If, in the first case, it does not witness to men, to whom does it witness? And to what purpose? And how does its witnessing make to the design of St. John's discourse? Let them make good sense of it who are able. For my part, I can make none."

  Could someone help me actually break down the logic here? Specifically I don't get (1) why Newton thinks his version without "the Three in Heaven" makes the passage's argument work and adding it back in "spoils" it -- like why would MORE witnesses ruin anything, (2) what he's actually getting at with all those rapid-fire questions about whether the heavenly testimony is "given to men," is that a genuine logical problem with the verse or is he kind of stacking the deck rhetorically, and (3) a random side question, why does he capitalize certain words throughout his paraphrase -- is that just old-timey printing or is he marking something specific. My teacher mentioned offhandedly that Newton was "basically a secret Arian" and wouldn't elaborate, and I'm trying to figure out if that's secretly the whole point of this passage even though he never actually says "I don't believe in the Trinity" anywhere in it. Would love help walking through this like I'm five, my brain keeps sliding off it every time I reread it.
