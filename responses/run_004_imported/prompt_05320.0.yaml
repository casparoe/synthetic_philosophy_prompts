answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I had the privilege of being in Ms. Alvarez's senior philosophy elective.

  If you know Ms. Alvarez, you know she doesn't just teach books; she inhabits them. And for our ethics unit, she inhabited Bertrand Russell. Specifically, his book *Marriage and Morals*.

  Now, for the family members wondering why we're smiling: Russell was a brilliant 20th-century philosopher who had some… *aggressive* ideas about relationships. He argued that jealousy is just a bad habit to be trained out of. He suggested that honesty matters more than exclusivity. He believed, theoretically, that a marriage could survive almost anything, as long as everyone was intellectually honest about it.

  And the running joke in our class was that Russell was terrible at taking his own advice. He preached about overcoming jealousy, but when his own second wife had a child with another man during their "open" arrangement, he was devastated. It helped end the marriage. The theorist of love couldn't quite master the practice of it.

  But standing here tonight, looking at you two, I realize that's exactly why this toast works.

  Ms. Alvarez taught us to interrogate the difficult questions. She taught us that love isn't simple, and that human emotions are messy. Russell tried to solve love with logic, and he failed. But you two? You aren't trying to solve love. You're living it.

  You don't need trial marriages or philosophical loopholes. You have something Russell wrote volumes about but never quite found: a partnership that doesn't need to defend itself against theory. You prove that while jealousy might be a habit, commitment is a choice. And while honesty is vital, loyalty is the foundation.

  So, to Ms. Alvarez and [Groom's Name]: May your life together be far less complicated than Russell's essays, and far happier than his biography. May you always keep questioning, but never doubt each other.

  To the happy couple!
