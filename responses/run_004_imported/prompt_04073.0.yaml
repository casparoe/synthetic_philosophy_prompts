      2.  Hart: The Harm Principle vs. Rights Violation. The "Unknown Victim" problem.
      3.  Devlin: The Disintegration Thesis vs. Secret Sin. The "Reasonable Man" knowledge problem.
      4.  Synthesis: Where the frameworks crack (Autonomy vs. Consequence).
      5.  Conclusion: Hart is more strained than Devlin, but both need updating.

      *(Wait, one nuance on Hart)*: Hart distinguishes between "Critical Morality" (what is actually right/wrong) and "Positive Morality" (what people think). If Critical Morality says violating autonomy is wrong *in itself*, Hart could condemn it without relying on Millian consequences. But Hart is generally skeptical of Critical Morality having objective content beyond harm/utility. I need to be careful there. Hart is a positivist and a liberal utilitarian. He usually requires *harm*.

      *(Wait, one nuance on Devlin)*: Devlin argues that *private* immorality can be punished if it contributes to the erosion of moral bonds. But he admits the law shouldn't pry too much. However, he famously said "no private morality." So he *could* go after it. The issue is the *social threat* level.

