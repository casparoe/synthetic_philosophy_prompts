      *   *Nuance:* Make sure not to paint Pascal as a Marxist revolutionary. He wasn't. He was a Jansenist Catholic. He believed in submitting to authorities generally, but he also believed earthly authority was provisional. The tension is key. He would see the *injustice* clearly even if he wouldn't lead a strike.
      *   *Key Insight:* Pascal's point isn't just "force wins." It's "force pretending to be justice is the specific danger." Arbitration is exactly that: force (economic power) dressing up as justice (legal process).

