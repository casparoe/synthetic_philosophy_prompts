      Elena capped the red marker, staring at the triangle of arrows on the whiteboard. A > B > C > A. A single dollar sign hovered near each node.

      "It's too clean, Marcus," she said. "You start with A, trade for B minus a penny, trade for C minus a penny, trade back to A minus a penny. You end up where you started, poorer. If that's not a *reductio* of cyclic preferences, nothing is."

      Marcus leaned against the seminar table, arms crossed. "It's a *reductio* of naive preferences. You're assuming the agent treats every node as a fresh start. That's the myopic chooser McClennen warned us about."

      "I'm assuming the agent acts on their preferences," Elena corrected, turning to face him. "If I prefer C to A at node three, why would I stick to a plan made at node one? The money pump shows that if you act on cyclic preferences synchronically, you get pumped. Resolute choice doesn't fix the preferences; it just adds a layer of willpower to ignore them."

      "Willpower?" Marcus pushed off the table. "Call it planning agency. Rationality isn't just about maximizing utility at a temporal slice. It's about governing a life over time. If I adopt a plan at t1 that avoids the pump, sticking to it at t2 isn't irrational stubbornness. It's dynamic consistency."

      "But what binds you at t2?" Elena tapped the board near the C>A arrow. "At t1, you prefer the plan. At t2, you prefer C. If preferences drive choice, you take C. If you take A instead, you're violating your current preference. So either your preferences changed—which means they weren't cyclic anymore—or you're acting against your preferences. If it's the latter, you're not defending cyclic preferences; you're admitting they're irrational and need to be overridden."

      Marcus picked up a blue marker. "You're smuggling in a separability assumption. You think the preference at t2 should be isolated from the commitment at t1. But for a resolute chooser, the fact that I chose this plan *is* part of the reason I choose this act now. The preference isn't just 'C over A'; it's 'fulfilling my rational plan over C'."

      "That sounds like verbal magic," Elena said. "You're relabeling 'ignoring my preference' as 'having a higher-order preference.' But does transitivity do any work here? Or did you just define rationality as 'whatever avoids the pump'?"

      "Exactly," Marcus said, drawing a box around the whole tree. "Transitivity is supposed to be a structural constraint on orderings. But if an agent with cyclic preferences can navigate the world without exploitation by choosing resolutely, what work is transitivity doing? It's not protecting you from loss. It's not guiding choice. It's just a mathematical aesthetic you're imposing on psychology."

      "It's protecting you from having to rely on *stipulation*," Elena shot back. "Your resolute chooser avoids the pump only because they stipulate at t1 that they won't listen to themselves at t2. But why is that stipulation rational? The only answer you have is 'because otherwise you get pumped.' But that begs the question. You're assuming avoidance of pumps is the metric of rationality to prove that cyclic preferences are okay provided you avoid pumps. You've circularly defined the problem away."

      "And you're assuming that preferences must be static objects to prove they must be transitive," Marcus countered. "If agency is essentially temporal, then a preference ordering that doesn't account for temporal extension is incomplete. The pump doesn't show cyclic preferences are irrational. It shows naive agency is."

      "So now rationality isn't about coherence of attitudes," Elena said, uncapping her marker again, hovering over the A>B arrow. "It's about coherence of narratives. But then you've changed the subject from decision theory to something else. If I can prefer A to B, B to C, and C to A, and you say 'that's fine, just don't act on it sequentially,' you've emptied 'preference' of its predictive content. What does it mean to prefer A to B if you won't choose A over B when it counts?"

      "It means preference isn't the only thing that counts," Marcus said. "But look, if your transitivity axiom requires me to treat my future self as a stranger whose preferences I must indulge even when they contradict my plan, then your axiom demands fragmentation. I'd rather be cyclic and resolute than transitive and myopic."

      Elena paused, marker hovering. "Then we disagree on whether rationality is a state of mind or a history of actions."

      "Maybe," Marcus said. "Or maybe you're just scared of a little cycle."

      "I'm scared of a student who leaves here thinking they can be exploited provided they're stubborn about it."

      "And I'm scared of one who thinks coherence matters more than survival."

      They stood there, the red triangle glowing between them, neither willing to erase the loop.

