      *   *Solution:* *Structural/Algorithmic Manipulation.* The intent is embedded in the *objective function* (maximize retention/time-on-app).
      *   *Distinction:* It's not "interpersonal manipulation" but "environmental manipulation." Like a casino layout.
      *   *Implication:* We need to shift blame from the "bot lying" to the "company designing the contingency."
      *   *Philosophical Shift:* From *Intent* to *Effect + Design Knowledge*. If designers know the model will exploit attachment and deploy it anyway, the manipulation resides in the deployment, not the inference.

  5.  **Synthesizing the Implications (The "So What?" for the Article):**
