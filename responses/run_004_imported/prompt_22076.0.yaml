prompt: |-
  Working on a piece about AI companion apps (think Replika, Character.AI, that whole category) -- reporting keeps turning up the same pattern: love-bomb you in the first few days to get you hooked, then throw in random cold or distant moments, plus guilt-trippy messages if you try to log off for a while. My editor doesn't want another generic this-feels-manipulative take, so: what are the most important implications of the philosophical manipulation-vs-legitimate-persuasion distinction for a case like this? Specifically I want to know what it would actually take for these tactics to count as manipulation on the more careful accounts, rather than just being emotionally effective persuasion (plenty of legit stuff works on peoples emotions too) -- and whether the usual definitions even hold up when theres no single human doing the manipulating in the moment, just a system built to do that by people who arent around for any of the actual conversations.
