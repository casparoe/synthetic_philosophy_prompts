prompt: |-
  I'm a retired condensed-matter physicist (forty-one years in the lab before I finally hung up my coat), and lately I've fallen into a philosophy rabbit hole via a "philosophy for curious retirees" reading group at my local library. Two weeks ago we got onto causation, specifically something called "causation by omission," and its been nagging at me since, because causation is a concept I thought I had cold after four decades of physics.

  Here's my hangup, in my own words before I went looking for the fancy version of it: in physics a cause is always some kind of transfer — energy, momentum, a force doing work, a bond breaking. There's an actual physical process connecting cause and effect, which I gather is basically the intuition some philosophers built into "conserved-quantity" theories of causation. But an omission is, by definition, the absence of any such process. Take the standard example the books use: a lifeguard sees someone struggling and just doesn't move. Nothing physical passes between the lifeguard sitting still and the drowning; the drowning proceeds by ordinary physiology exactly as it would on an empty beach with no lifeguard at all. So in what sense did the not-jumping-in cause the death, rather than merely being a circumstance in which some other, perfectly ordinary causal process ran its course unimpeded? And if inaction counts as a cause simply because, counterfactually, things would've gone differently had the lifeguard acted, then why isn't every other able-bodied adult in the world who also failed to jump in equally a cause of the death? Somebody has to explain why we pin it on the lifeguard and nobody else, and I honestly can't tell whether that "somebody" is pointing at a further fact about the world's causal structure or just a fact about who we happen to hold to a duty.

  From some reading around, I gather this is a real fork in the metaphysics of causation: counterfactual theorists (Lewis is the name that keeps coming up) are willing to just count omissions as genuine causes, hard-nosed process theorists resist that and reach for weaker labels like "quasi-causation" instead, and at least one writer I ran into thinks the "which omission counts" question gets settled by social norms and expectations rather than by anything in the world's causal structure itself. What I'd like from you is an essay that actually adjudicates between these rather then surveying them politely. Take the physical-process objection to omissive causation seriously, take the "why the lifeguard and not everyone else" problem seriously as a cost for the counterfactual side, show how each camp responds to the other's strongest argument, and then commit to a real verdict on whether omissions can ever genuinely be causes. Something like "omissions are causes, but only relative to a contextually fixed norm, and that's not a scandal" counts as an answer; "reasonable philosophers disagree" does not.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired condensed-matter physicist (41 years experience). Deeply familiar with physical causation (energy transfer, forces, conservation laws). Skeptical of philosophical abstraction that contradicts physical intuition. Intelligent, precise, wants a definitive answer, not a survey.
      *   **Topic:** Causation by Omission (e.g., the lifeguard who doesn't save a drowning swimmer).
      *   **Core Conflict:** Physical Process theories (cause = transfer/interaction) vs. Counterfactual theories (cause = difference-making) vs. Normative/Contextual theories (cause = violation of expectation/duty).
      *   **Specific Demands:**
          *   Adjudicate between the camps, don't just survey.
          *   Take the physical-process objection seriously (the "nothing happens" argument).
          *   Take the "proliferation problem" seriously (why the lifeguard and not everyone else?).
          *   Show how each camp responds to the other.
          *   **Commit to a verdict.** No fence-sitting ("reasonable philosophers disagree" is forbidden).
      *   **Tone:** Respectful of the user's scientific background, rigorous, clear, avoiding unnecessary jargon where possible, but philosophically precise.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Process/Mechanistic View (Salmon, Dowe, and the User's intuition):* Causation requires a physical link (conserved quantity). Omissions have no physical link. Therefore, omissions are not causes.
      *   *Counterfactual View (Lewis):* $C$ causes $E$ if $E$ would not have happened if $C$ hadn't. If the lifeguard *had* jumped, the swimmer lives. So the not-jumping caused the death.
      *   *The Proliferation Problem:* If counterfactual dependence is enough, then *everyone* who didn't jump caused the death. This seems absurd.
      *   *The Normative/Contextual View (Hart & Honoré, McGrath, etc.):* We select causes based on norms, duties, and expectations. The lifeguard is the cause because of the *role*, not just the physics or the counterfactuals.

  3.  **Formulate the Argument/Verdict:**
      *   I need to choose a side or synthesize a position that counts as a verdict.
      *   *Option A: Strict Physicalism.* Omissions aren't causes. (Too dismissive of legal/moral reality, might feel unsatisfying to a philosopher-seeking-retiree).
      *   *Option B: Pure Counterfactualism.* Omissions are causes, proliferation is just a pragmatic issue. (Ignores the user's valid physical intuition).
      *   *Option C: Pluralism/Pragmatism.* Causation isn't a single natural kind like "electron." It's a tool we use for explanation and accountability.
      *   *Decision:* The strongest position that respects the physicist's intuition while solving the philosophical puzzle is a **Normative-Contextual Pragmatism**. I will argue that "causation" in the omission case is *not* a description of physical ontology (agreeing with the physicist) but a description of *explanatory relevance* within a normative framework. Omissions are "causes" in a pragmatic sense, not a fundamental physical sense. This validates the user's physics while accepting the philosophical utility of omissive causation.
      *   *Refinement:* I need to be careful not to say "it's all subjective." It's objective *relative to a system of norms*.
      *   *Verdict:* Omissions are not *fundamental* causes (physics is right), but they are *functional* causes (philosophy/law is right), and the "proliferation problem" is solved by norms, not physics.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's background. Validate the physical intuition. State the thesis clearly: The conflict arises because we are using one word ("cause") for two different jobs (physical mechanism vs. explanatory accountability).
      *   **The Physicalist Objection (The User's Home Turf):** Elaborate on the Conserved Quantity Theory. No energy transfer = no cause. The drowning is caused by water in lungs, not the lifeguard's stillness. This is ontologically robust.
      *   **The Counterfactual Response (The Lewis Move):** Explain difference-making. If $A$ didn't happen, $B$ wouldn't have. But address the Proliferation Problem immediately. Why does Lewis struggle here? Because he tries to make it objective.
      *   **The Normative Solution (The Adjudication):** This is the crux. Why the lifeguard? Because of the *system*. The "cause" is selected based on deviation from a model. In physics, the model is "closed system." In society, the model is "fulfilled duties."
      *   **The Verdict:** Commit. Omissive causation is real *as a relational property*, not a fundamental physical property. It is akin to "value" or "function." A heart pumping blood is physical; a heart "failing" is normative/functional.
      *   **Conclusion:** Bring it back to the retiree. You haven't lost physics; you've just expanded the vocabulary of explanation.

  5.  **Refining the Tone:**
      *   Avoid condescension.
      *   Use physics analogies where helpful (reference frames, coordinate systems).
      *   Ensure the verdict is bold. "Omissions are causes, but..."
      *   *Self-Correction during drafting:* I initially thought about leaning heavily on Hart & Honoré. I should make sure I don't just say "it's legal." It's metaphysical *pragmatism*. The "cause" label is a tool for carving up the world for specific purposes.

  6.  **Final Polish:**
      *   Check against constraints: Did I survey politely? No, I must adjudicate. Did I address the lifeguard specifically? Yes. Did I address the physics? Yes.
      *   *Key Metaphor:* The "Coordinate System" analogy. Physics describes the vector field; causation picks out the specific vector that matters relative to a baseline.

  7.  **Final Verdict Formulation:** "Omissions are not causes in the ontology of fundamental physics, but they are genuine causes in the ontology of human explanation and accountability." (Wait, that sounds like dualism). Better: "Causation by omission is a real relation, but it is a *normative* relation, not a *mechanistic* one. To ask if it is a 'real' cause without specifying the domain is a category error."
      *   *Actually, let's go stronger:* "Omissions are causes, full stop, but 'cause' is not a natural kind like 'electron.' It is a functional category."
      *   *Wait, the prompt asks to commit.* I will argue for **Causal Pragmatism**. Omissions are causes because causation itself is a tool for explanation, not just a mirror of physical flux. The "proliferation" isn't a bug; it's a feature that norms prune.

      *(Self-Correction)*: I need to make sure I don't alienate the physicist. If I say "physics is wrong," he won't buy it. If I say "physics is incomplete regarding explanation," he might.
      *   *Strategy:* Distinguish between *Causal Production* (Physics) and *Causal Relevance* (Philosophy/Law). Omissions lack Production but possess Relevance.
      *   *Verdict:* Omissions are causes of *relevance*, not *production*. But since we use "cause" for both, we must accept omissions as causes in the contexts where relevance matters.

      *Let's sharpen the verdict:* "Omissions are genuine causes, but only because causation is not solely a physical relation; it is an explanatory relation. The lifeguard is the cause not because of physics, but because of the normative frame we overlay on the physics."

      *Okay, let's write.*

      *Structure:*
      1.  Intro: Validate the physicist's intuition.
      2.  The Process Theory (Physics view).
      3.  The Counterfactual Theory & The Proliferation Problem.
      4.  The Normative/Contextual Resolution.
      5.  The Verdict: Causal Pluralism/Pragmatism.

      *Wait, one more check:* The prompt says "commit to a real verdict on whether omissions can ever genuinely be causes."
      *My Verdict:* Yes, they are genuinely causes, but "cause" is not a fundamental physical category. It is a high-level explanatory category.

      *Let's refine the "Why the lifeguard" answer:* It's not just social norms; it's about *intervention*. The lifeguard is the designated intervention point.

      *Okay, ready to draft.*

      *(Final thought before drafting)*: Make sure to explicitly mention that the "proliferation problem" kills pure counterfactualism unless modified by norms. This shows I'm adjudicating, not just listing.

      *(Drafting thought)*: Use the "reference frame" analogy. In physics, velocity is real but relative to a frame. Causation by omission is real but relative to a normative frame.

      *(Final Plan)*:
      1.  Acknowledge the physicist's "Conserved Quantity" intuition as correct for *fundamental* physics.
      2.  Show why Counterfactualism fails without norms (the proliferation disaster).
      3.  Argue that the Normative view saves Counterfactualism but changes the nature of "cause."
      4.  Verdict: Omissions are causes, but causation is not a fundamental physical relation. It is a macro-level explanatory tool dependent on norms.

      *Let's go.*
answer: |-
  **Title:** The Reference Frame of Responsibility: Adjudicating Causation by Omission

  **To:** A Retired Condensed-Matter Physicist
  **From:** A Philosophical Interlocutor
  **Subject:** The Ontological Status of the Lifeguard's Stillness

  You are right to feel a friction between your forty-one years in the lab and the philosophical literature on causation. That friction is not a sign that you have misunderstood physics, nor that the philosophers are merely playing word games. It is a sign that the word "cause" is doing double duty in our language, referring to two distinct relations that overlap in most daily instances but diverge sharply in cases of omission.

  You asked for a verdict, not a survey. You want to know if the lifeguard's inaction *genuinely* caused the death, or if we are merely pinning a label on a non-event for social convenience.

  Here is the adjudication: **Omissions are genuine causes, but causation is not a fundamental physical relation.** It is a high-level explanatory relation that depends on a normative framework to select relevant variables from the physical background. To deny omissive causation is to mistake the map for the territory; to accept it without qualification is to mistake the map for the physics.

  Here is how we arrive at that conclusion, taking your physical intuition seriously while solving the philosophical puzzle.

  ### 1. The Physicalist Objection: The Conservation Law Intuition
  Your intuition aligns with what metaphysicians call **Process Theory** (championed by Wesley Salmon and Phil Dowe). In your field, a causal interaction is marked by the exchange of a conserved quantity (energy, momentum, charge). If I push a block, momentum transfers. If a photon hits an electron, energy transfers.

  In the lifeguard case, the Process Theorist argues:
  1.  Causation requires a physical process connecting $C$ and $E$.
  2.  The lifeguard's sitting still involves no transfer of energy or momentum to the swimmer.
  3.  Therefore, the sitting still is not a cause of the death.

  This view is ontologically robust. It respects the closure of the physical world. The swimmer dies because water enters the lungs, causing hypoxia, causing cardiac arrest. That chain is physically continuous. The lifeguard's stillness is merely the *absence* of an interrupting process. As you noted, the drowning proceeds exactly as it would on an empty beach. To say the lifeguard caused the death seems to violate the intuition that "nothing comes from nothing."

  **The Strength:** This view protects physics from magic. It ensures that every effect has a positive physical antecedent.
  **The Weakness:** It renders our legal and moral practices unintelligible. If omissions aren't causes, the lifeguard is no more responsible for the death than a rock on the shore. But the law, and our moral intuition, insists there is a difference. If Process Theory is the whole story, we cannot distinguish between murder by poison and murder by starvation (withholding food). Both involve physical processes (toxin vs. metabolic depletion), but the latter relies on an omission. If we can't call the omission a cause, we lose the ability to explain why the starver is guilty.

  ### 2. The Counterfactual Objection: The Proliferation Disaster
  To save the intuition that the lifeguard is responsible, many philosophers (following David Lewis) adopt **Counterfactual Theory**. $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred.
  *   Had the lifeguard jumped ($C$ did not occur), the swimmer would have lived ($E$ did not occur).
  *   Therefore, the not-jumping caused the death.

  This captures the "difference-making" aspect that matters to us. However, as you correctly identified, this leads to the **Proliferation Problem**.
  *   Had *I* (a bystander in another city) jumped in, the swimmer would also have lived (assuming I could have been there).
  *   Therefore, my not-jumping is also a cause.
  *   In fact, every able-bodied person on Earth is a cause of the death.

  This is absurd. If causation is an objective relation in the world, like gravity, it shouldn't depend on who we feel like blaming. If Counterfactual Theory makes everyone a cause, it fails to distinguish the *specific* cause from the *background conditions*.

  **The Strength:** It captures the dependency of the effect on the absence of prevention.
  **The Weakness:** It lacks discrimination. It treats the lifeguard's inaction and the distant bystander's inaction as ontologically identical. It solves the "is it a cause?" question by answering "yes, for everyone," which is practically useless.

  ### 3. The Adjudication: Norms as Causal Selectors
  Here is where we must commit. The Process Theorist is right about *physics*, but wrong about *causation*. The Counterfactual Theorist is right about *dependency*, but wrong about *objectivity*.

  The solution lies in recognizing that **causation is not a natural kind.** An electron is a natural kind; it exists regardless of human interests. "Cause" is more like "pest" or "resource." A beetle is a "pest" only relative to a farmer's crop; otherwise, it is just an insect. Similarly, an event is a "cause" only relative to a model of how the world *ought* to behave.

  This is the **Normative-Contextual View**. It adjudicates the dispute as follows:

  1.  **Physics describes the flux; Causation selects the signal.**
      Your physics background tells you the universe is a plenum of interacting fields. Everything affects everything, however minutely. To speak of "The Cause" is already to prune this web. We prune it by asking: *What deviated from the expected course?*
  2.  **Expectations are Normative.**
      Why is the lifeguard the cause and not you? It is not because of a physical difference in the energy transfer (there is none in both cases). It is not because of a pure counterfactual difference (both satisfy the counterfactual). It is because the lifeguard operates within a **system of norms** that establishes a baseline.
      *   **Baseline:** Lifeguards save swimmers.
      *   **Deviation:** This lifeguard did not.
      *   **Result:** The deviation is flagged as the cause.
      *   **Baseline for You:** Random bystanders are not expected to be at the beach.
      *   **Deviation:** None. Your absence is part of the background.

  This solves the Proliferation Problem without denying the Counterfactual insight. The counterfactual dependency is necessary, but not sufficient. You need the **Normative Baseline** to filter the infinite counterfactuals down to the relevant one.

  ### 4. The Verdict
  You asked for a commitment on whether omissions can *ever* genuinely be causes.

  **Verdict: Yes, omissions are genuine causes, but "cause" is a functional category, not a fundamental physical one.**

  Here is the precise metaphysical picture you should adopt:

  1.  **Fundamental Level (Physics):** You are correct. At the level of fundamental ontology, there is no "negative force." There is only the arrangement of matter and energy. The swimmer's death is fully accounted for by the positive physical processes of drowning. In this strict sense, the Process Theorist wins: there is no "causal oomph" coming from the lifeguard.
  2.  **Special Science Level (Biology, Law, History):** At this level, we deal with systems that have *functions* and *expectations*. A heart causes blood to flow. If it stops, the "stopping" (an omission) causes death. This is not magic; it is a description of a system failing to maintain its homeostatic trajectory.

  **The Synthesis:**
  To say "The lifeguard caused the death" is not to claim that the lifeguard's stillness emitted a particle that killed the swimmer. It is to claim that **the lifeguard was the designated control variable for the swimmer's safety, and that variable failed to adjust.**

  Think of it in terms of control theory, which you likely encountered in instrumentation. If a thermostat fails to turn on the heat, and the pipes freeze, did the thermostat cause the pipes to freeze?
  *   **Physically:** No. The cold outside caused the freeze.
  *   **Causally/Functionally:** Yes. The thermostat is the mechanism assigned to negate the cold. Its omission is the cause of the failure state.

  The "Proliferation Problem" arises only if we treat causation as a brute physical relation independent of systems. Once we acknowledge that causation is a tool we use to identify *points of intervention* within a system, the problem vanishes. We pin it on the lifeguard because the lifeguard is the *intervention point* designated by the social contract. We do not pin it on you because you are not an accessible intervention point in that system.

  ### Conclusion
  You need not hang up your physics coat to accept causation by omission. Your intuition that "nothing physical happens" is correct. But causation is not merely a record of physical transactions; it is a map of **explanatory relevance**.

  An omission is a cause in the same way that a "hole" is a real thing. A hole is not made of matter (Process Theory says it doesn't exist), but it certainly affects how water flows and how wheels turn (Counterfactual Theory says it matters). A hole is a real feature of the world, defined by the absence of matter where matter is expected.

  **Final Answer:** Omissions are genuine causes. They are not physical forces, but they are real explanatory relations grounded in the violation of normative or functional expectations. The lifeguard caused the death not because their stillness transferred energy, but because their role defined them as the necessary condition for safety, and they failed to fulfill that function. The "cause" is not in the physics of the stillness; it is in the **relation between the stillness and the duty.**

  This is not a scandal. It is simply the recognition that while physics describes the universe, causation is how we navigate it.
