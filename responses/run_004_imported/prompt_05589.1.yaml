          *   *Cosmological Scale:* If the universe is small (finite, no multiverse), the "large worlds" part fails. The expected value gains rely on the sheer number of correlated agents outweighing local costs.
          *   *Logical Correlation:* If decision algorithms are not logically correlated across agents (i.e., my decision provides *no* evidence about theirs), the evidential link is broken.

