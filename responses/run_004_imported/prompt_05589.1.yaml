      *   *Value Diversity:* Existence of agents with different values (otherwise no trade needed).
      *   *Compromise Viability:* The ability to define a compromise vector that benefits all correlated parties.
      *   *Epistemic Access:* Ability to reason about these agents despite no observation.
      *   *Identity:* Persistence of agency across logical similarity.

