  2.  **Deconstruct ECL (Evidential Cooperation in Large Worlds):**
      *   *What is it?* It's a decision-theoretic argument suggesting that if the universe is vast (infinite or very large), there are likely many agents similar to you (or sufficiently correlated in decision-making) elsewhere. Even if you can't communicate or causally influence them, your decision provides *evidence* about their decision. If you cooperate (e.g., compromise on values), evidential decision theory (EDT) or superrationality suggests they likely cooperate too. Thus, you gain expected value from their cooperation across the multiverse.
      *   *Key Components:*
          1.  **Decision Theory:** Must accept EDT or acausal decision theory (like FDT/SDT) over Causal Decision Theory (CDT). CDT says no causal link = no reason to cooperate.
          2.  **Cosmology/Metaphysics:** The universe/multiverse must be large enough to contain sufficiently many correlated agents. If it's small, the "gains from trade" across the multiverse are negligible.
          3.  **Correlation/Similarity:** There must be agents whose decision algorithms are correlated with ours. If everyone is unique and uncorrelated, evidential links break.
          4.  **Value Compromise:** Agents must have different values but be willing to compromise. If everyone has the same values, no trade is needed. If no one compromises, no gains.
          5.  **Identity/Individuation:** What counts as "you" or "your decision"? Need a notion of logical correlation.
          6.  **Normative Force:** Why *ought* one follow this? (Usually tied to maximizing expected value).

