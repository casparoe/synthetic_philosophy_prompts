prompt: |-
  Im putting together next week's session on Rawls and religion for my grad seminar and want a sanity check before I write the slides. Rawls has a handful of different moves for trying to make public reason liberalism livable for religious citizens -- the wide view of public political culture, the proviso from "The Idea of Public Reason Revisited," treating justice as fairness as a "freestanding" view rather than a rival comprehensive doctrine, overlapping consensus, and his use of the abolitionists and MLK as models of citizens who satisfy the proviso. Rank these five, best to worst, by how well they actually shield religious citizens from unfair burdens -- not by how central they are to Rawls's own story. Give it to me as a JSON array, each entry with "move" and "why" (one sentence, I don't want an essay), like:

  ```json
  [
    {"move": "...", "why": "..."},
    ...
  ]
  ```

  Dont just reorder them the way Rawls introduces them in the text -- actually commit to a ranking, that's the whole point of asking.
