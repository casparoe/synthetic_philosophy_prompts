      *   *Max Tegmark:* He explicitly links the two. Mentioning him adds credibility.
      *   *Transworld Identity:* Make sure to emphasize that for Lewis, *you* are world-bound. This directly contradicts the user's intuition that "a version of literally me" exists.

  7.  **Final Polish:** Structure with clear headings or bullet points for readability. (Decided on a conversational flow with clear thematic breaks). Ensure the conclusion gives actionable advice for their writing.

