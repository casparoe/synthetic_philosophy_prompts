      *   **Key Context:** Hobbes's view that geometry yields certainty because we construct objects via definitions grounded in motion. He rejected Wallis's algebraic/indivisibilist methods as illegitimate.
      *   **Task:** Write an essay weighing these two readings against each other using textual/historical evidence.
      *   **Constraint:** Defend a *definite verdict* (no split-the-difference).
      *   **Tone:** Academic, analytical, persuasive.

  2.  **Initial Assessment & Thesis Formulation:**
      *   *Option A (Blind Spot):* Hobbes was old, stubborn, and lacked technical skill. He fell into the "crank" category common in math forums. His philosophy was just a post-hoc rationalization.
      *   *Option B (Philosophical Necessity):* Hobbes's materialism and nominalism *required* a specific kind of geometry. If standard Euclidean or emerging analytic geometry contradicted his metaphysics of body and motion, he *had* to reject it, even if it meant clinging to a false proof. The error wasn't just calculation; it was categorical.
      *   *Decision:* Option B is the more interesting and defensible scholarly position. While Hobbes was certainly technically outmatched by Wallis, dismissing it as mere stubbornness ignores the coherence of his system. His geometry *was* his philosophy applied to magnitude. To concede Wallis was right would be to concede materialism was wrong.
      *   *Thesis:* Hobbes's persistence in squaring the circle was not merely a senile blind spot but a philosophical necessity. His commitment to a materialist ontology, where truth is generated through the causal construction of bodies in motion, made Wallis's symbolic and infinitesimal methods unintelligible and ontologically suspect. To accept Wallis's refutation would have required abandoning the foundational epistemology of *De Corpore*.

  3.  **Outline Structure:**
