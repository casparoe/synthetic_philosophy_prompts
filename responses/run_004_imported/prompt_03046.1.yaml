answer: |-
  You have not been overthinking it. In fact, you have independently rediscovered one of the most famous problems in **Game Theory**.

  Your brother is practically right (you don't need to worry), but intellectually, you are absolutely correct to spot the flaw in the logic. What you are describing is known as the **Problem of Backward Induction in a Finitely Repeated Game**.

  It is a genuine logical puzzle that has kept economists and philosophers busy for decades. Here is exactly what is happening in your brain, why the logic seems sound but leads to a crazy conclusion, and what you should actually do about it.

  ### 1. The Theory: Why Your Logic Makes Sense (On Paper)
  In Game Theory, your arrangement is a "Repeated Prisoner's Dilemma."
  *   **Cooperate:** You do the favor, he does the favor. Both benefit.
  *   **Defect:** You take the benefit without doing the favor. You win short-term, he loses.

  In an *infinite* game (where you don't know when it ends), cooperation is stable. If I defect today, you punish me tomorrow. The threat of future punishment keeps us honest today.

  However, once you introduce a **known end date** (the 4-month mark), the standard mathematical model suggests exactly what you feared:
  1.  **Month 4:** There is no "Month 5" to punish me if I don't do your taxes. So, a purely rational, self-interested person would defect in Month 4.
  2.  **Month 3:** Since we both know Month 4 is going to be a defect (based on step 1), Month 3 is effectively the last *meaningful* month. So, I should defect in Month 3.
  3.  **Month 1:** By repeating this logic backward, cooperation should collapse immediately.

  This is called the **Chainstore Paradox** (or sometimes related to the Centipede Game). Logically, it seems airtight. If everyone were a perfectly rational robot programmed only for maximum short-term gain, you would be right: you should stop helping Dan today.

  ### 2. The Reality: Why the Logic Fails
  If this logic were true in the real world, no one would ever tip a waiter at a restaurant they plan never to visit again. No one would help a friend move if they knew they were moving away themselves soon. But people *do* these things constantly.

  The backward induction logic fails because it relies on two assumptions that aren't true in your friendship:

  **A. Common Knowledge of Rationality**
  The math assumes both you and Dan are purely selfish profit-maximizers who *know* the other is also a purely selfish profit-maximizer.
  In reality, you are friends. You value fairness. You value your reputation. You value the memory of the friendship. If you screw Dan in Month 3, you don't gain "points"; you lose self-respect and damage a relationship that matters to you *now*. The "payoff" isn't just landscaping vs. taxes; it's also "feeling like a good friend."

  **B. The "Gang of Four" Solution**
  There is a famous refinement to this theory by economists Kreps, Milgrom, Roberts, and Wilson. They proved that if there is even a **tiny probability** that one player is *not* rational (e.g., there's a 1% chance you are the kind of guy who cooperates no matter what), then it becomes rational for *both* players to cooperate almost until the very end.

  Why? Because Dan doesn't *know* for sure that you're going to defect in Month 4. He thinks you're a good guy. So, he cooperates in Month 3. Because he cooperates in Month 3, you want to maintain that cooperation. This dynamic holds the whole thing together until the final moments.

  ### 3. What This Tells You To Do
  You asked if you should keep doing favors or start pulling back. The answer is counter-intuitive:

  **If you act on the logic, you create the collapse you fear.**

  If you start pulling back now, you signal to Dan that the "game" is over. He will sense the withdrawal, and he will instinctively protect himself by withdrawing his effort (maybe he stops being as diligent with your invoices). You will trigger the very unraveling you are worried about.

  **The optimal strategy is to ignore the end date.**

  Here is the practical playbook for the next 4 months:

  1.  **Maintain the "Shadow of the Future":** Even though he is moving, treat the relationship as if it continues. Friendships don't end because of geography. If you end on a high note, the "next time" isn't landscaping for taxes; it's staying in touch, visiting each other, or helping with referrals. The game doesn't end; the *rules* just change.
  2.  **Explicitly "Close the Book":** Paradoxically, the best way to stop the backward induction anxiety is to acknowledge the end. Sit down with Dan and say, *"Hey, I know you're moving in 4 months. I want to make sure we ride this out strong and don't leave any loose ends."*
      *   By making the end date a shared project rather than a strategic deadline, you remove the temptation to defect. You turn the last 4 months into a "victory lap" rather than a "countdown to betrayal."
  3.  **Don't Keep Score:** The reason this arrangement worked for 1.5 years is that you didn't put a dollar value on it. The moment you start thinking, *"I owe him $500 worth of labor, and he owes me $500 worth of taxes, so we're even,"* you turn a friendship into a contract. Contracts have end dates; friendships have memories.

  ### Summary
  You have spotted a real logical paradox that stumps professional economists. But human beings are not logic engines; we are social creatures. We cooperate at the end of relationships because **how a relationship ends defines what the relationship was.**

  If you pull back now, you prove the relationship was transactional. If you keep going, you prove it was a friendship.

  **Verdict:** Keep doing the favors. Do the deck, fix the mower, watch the dog. Let Dan do the taxes. End the arrangement with a surplus of goodwill, not a deficit. That is the only way to "win" a game that is ending.
