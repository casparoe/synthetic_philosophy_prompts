answer: |-
  You are absolutely right to trust your reading of the text, and you are also right that this is one of the strangest, most overlooked footnotes in the history of computer science. You haven't missed anything, and your friend is dismissing a genuine historical curiosity.

  It is indeed in Section 6 of *Computing Machinery and Intelligence*, under the heading "The Argument from Extrasensory Perception." Turing writes:

  > "The statistical evidence, at least for telepathy, is overwhelming."

  He then logically deduces that if telepathy exists, the Imitation Game is flawed unless the room is shielded against it.

  Here is the breakdown of why Turing wrote this, why he was wrong about the science but right about the logic, and why this doesn't actually resurrect telepathy as a valid scientific concept today.

  ### 1. The Historical Context: 1950 was different
  To understand Turing's reasoning, you have to look at the scientific landscape of 1949–1950. Today, parapsychology is firmly on the fringe. But in the first half of the 20th century, it was a subject of serious, if controversial, inquiry by reputable institutions.

  The biggest name in this field was **J.B. Rhine** at Duke University. Rhine was using Zener cards (cards with five simple symbols) to test for ESP. He was applying statistical analysis to psychology in a way that felt very modern at the time. In the late 30s and 40s, Rhine's results were published in reputable journals and garnered significant attention.

  To a logician like Turing, who was looking at the *data available at the time*, Rhine's statistical claims looked compelling. The methodologies used to debunk those claims (like controlling for sensory leakage, proper randomization, and the "file drawer problem" where only positive results get published) were not yet standard practice. Turing wasn't looking at "ghost hunter" data; he was looking at what appeared to be university-level statistical research.

  ### 2. Turing's Logic vs. Turing's Belief
  This is the crucial distinction. Turing wasn't necessarily writing as a spiritualist; he was writing as a **logician constructing a thought experiment.**

  The Turing Test is a control experiment. He is trying to isolate "intelligence" as the variable.
  *   **The Problem:** If telepathy is real, a human contestant could bypass the questions entirely by reading the interrogator's mind. A machine, presumably, could not (at least not in 1950).
  *   **The Confound:** This would make the human look "more intelligent" not because of reasoning, but because of a sensory advantage.
  *   **The Solution:** To make the test scientifically valid *regardless of whether ESP exists*, you must eliminate the variable. Hence, the "telepathy-proof room."

  Turing is essentially saying: *"I don't care if you believe in magic. If there is even a statistical chance it exists, my experimental design must account for it so that the results are robust."*

  It is less an endorsement of telepathy and more an exercise in extreme rigorousness. He didn't want critics to be able to say, "Well, the human won because they read your mind, not because they were smart."

  ### 3. Why the Evidence Wasn't Actually "Overwhelming"
  You asked if this should shift how confident we are that telepathy is pseudoscience. The short answer is **no.**

  Turing was a genius, but he was not infallible, and he was not a statistician by trade (though he understood math deeply). The "overwhelming evidence" he referred to turned out to be the result of methodological flaws that became apparent in the decades following 1950.
  *   **Replication Failure:** As controls tightened, the "positive" results in ESP experiments vanished.
  *   **Physics:** Telepathy implies information transfer without energy or known physical carriers. This violates fundamental laws of physics (like the inverse-square law and conservation of energy) that have held up under immense scrutiny since 1950.
  *   **Neuroscience:** We understand much more about how the brain encodes and transmits data now. There is no known mechanism for "broadcasting" thoughts.

  Science is self-correcting. The fact that a giant like Turing was persuaded by the data of his time doesn't validate the data; it just highlights how tricky statistical evidence can be. Even Newton was deeply into alchemy; that doesn't make alchemy real, it just makes Newton human.

  ### 4. Why is this skipped in documentaries?
  You noticed this part is almost always edited out of pop science. There are two reasons for that:
  1.  **Narrative Focus:** The Turing Test is about AI and computation. The ESP section is a sidebar about experimental controls. Including it distracts from the main point of the theory.
  2.  **The "Cringe" Factor:** To a modern audience, it looks embarrassing. Documentarians worry that if they mention Turing believed in telepathy, the audience will think, *"Wait, the father of computer science believed in magic? Maybe the whole Turing Test is bogus too."* It's a form of sanitizing history to protect the legacy.

  ### 5. What should you take away from this?
  Your brain doesn't need to remain broken! Here is the synthesis:

  *   **You read the paper correctly.** It is a wild section that is rarely discussed.
  *   **Turing was being logically thorough, not scientifically prescient.** He was accounting for all variables to protect his argument, based on the best (but flawed) data of 1950.
  *   **It doesn't validate ESP.** The subsequent 70 years of research have overwhelmingly shown that the data Turing relied on was incorrect.
  *   **It humanizes Turing.** It shows that even the greatest minds are products of their time and can be swayed by the prevailing scientific winds, even when those winds are blowing in the wrong direction.

  Your friend is right that you shouldn't change your mind about telepathy. But you are right that this isn't just a "throwaway aside." It's a fascinating glimpse into how a rigorous mind tries to account for uncertainty, even when that uncertainty involves things we now consider impossible. Turing's genius wasn't that he was never wrong; it was that he thought about the conditions of truth more deeply than anyone else.
