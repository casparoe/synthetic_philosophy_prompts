answer: |-
  First, welcome to retirement, and kudos on diving into the philosophy of science. It is a natural next step for someone who has spent 35 years dealing with the rigor of analytical chemistry. You are asking the exact right questions, and your frustration with your biologist friends is understandable—they are often trained to *do* science, not to *defend* its philosophical boundaries.

  Here is the short answer: **You are historically correct, but scientifically outdated.** Popper *did* say that. But he later **retracted it**, and the "tautology" objection has been resolved by modern evolutionary biology in a way that satisfies falsifiability.

  Here is the detailed breakdown of what you are missing, tailored to someone with your background in empirical rigor.

  ### 1. The Historical Twist: Popper Changed His Mind
  You are absolutely right that in the 1970s (specifically in *Unended Quest*, 1974), Popper classified natural selection as a "metaphysical research programme." He argued that "survival of the fittest" was tautological because "fitness" was defined solely by the ability to survive. If fitness is defined by survival, and survival is explained by fitness, no observation can contradict it.

  **However, in 1978, Popper publicly retracted this view.**

  In a lecture titled "Natural Selection and the Emergence of Mind," Popper stated:
  > *"I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."*

  He came to agree that natural selection *is* testable. So, the argument you are holding onto is one that the inventor of falsifiability himself abandoned.

  ### 2. Resolving the Tautology (The Chemist's Perspective)
  The charge that "survival of the fittest" is a tautology rests on a linguistic ambiguity.
  *   **The Tautological View:** If "fittest" is defined *post hoc* as "those who survived," then the statement "those who survived survived" is indeed useless.
  *   **The Scientific View:** Biologists define fitness **independently** of survival.

  Think of this like a reaction rate in chemistry. You don't define the rate constant *only* by looking at the final product yield after the reaction is done. You measure activation energy, concentration, temperature, and catalyst presence *beforehand* to predict the yield.

  Similarly, evolutionary biologists measure traits (speed, camouflage, metabolic efficiency, reproductive output) *prior* to the selection event.
  *   **Hypothesis:** Beetles with darker coloring will have higher fitness in a soot-covered environment due to reduced predation.
  *   **Prediction:** Dark beetles will survive at higher rates than light beetles.
  *   **Falsification:** If light beetles survive at higher rates despite the environmental pressure, the hypothesis is falsified.

  Because "fitness" can be quantified via independent variables (physiology, morphology, genetics) before the selection event occurs, the theory makes risky predictions. If the organisms with the predicted advantageous traits *don't* survive, the theory takes a hit. That makes it falsifiable.

  ### 3. Evolution vs. Astrology: The Demarcation
  You asked if Darwinism belongs in the same bin as astrology. From a falsifiability standpoint, they are fundamentally different.

  *   **Astrology:** Makes vague predictions that are retrofitted to fit outcomes. It is immune to disconfirmation because the language is flexible enough to explain *any* outcome.
  *   **Evolutionary Biology:** Makes specific, risky predictions that could easily prove it wrong.

  The famous example (attributed to J.B.S. Haldane) is **"fossil rabbits in the Precambrian."**
  If you found a complex mammal fossil in rock layers dated to 600 million years ago (before multicellular life was supposed to exist), the entire theory of common descent and evolutionary timing would collapse. That is a clear falsification condition. Astrology has no equivalent "if X happens, I am wrong" clause.

  Furthermore, evolutionary theory has successfully predicted:
  *   The discovery of specific transitional fossils (e.g., *Tiktaalik*).
  *   Genetic similarities between geographically isolated but morphologically similar species.
  *   The existence of "junk DNA" (pseudogenes) shared across related species.

  ### 4. What Popper Meant by "Metaphysical Research Programme"
  Even when Popper used that phrase, he wasn't calling it "pseudoscience" in the derogatory sense. In Popper's philosophy, a "metaphysical research programme" is a framework that **generates** testable scientific theories, even if the framework itself is broad.

  Newtonian physics, for a time, functioned similarly. The core idea (deterministic laws of motion) guided specific, testable hypotheses. Popper eventually realized natural selection does the same: it provides the heuristic framework for generating specific, falsifiable biological models.

  ### 5. Why Your Biologist Friends Wave It Off
  You mentioned your friends dismiss this without engaging. There are two reasons for this:

  1.  **The "Creationist Dog-Whistle" Fatigue:** For the last 50 years, the "evolution is a tautology/unfalsifiable" argument has been the primary weapon of the Creationist and Intelligent Design movements. Biologists hear this argument so often from people trying to undermine science that they often assume bad faith immediately. They aren't dismissing *you*; they are dismissing the trope.
  2.  **Pragmatism vs. Philosophy:** Working scientists are rarely Popperians in practice. They operate more under a Kuhnian "normal science" model or a Lakatosian "research programme" model. To them, the evidence is so overwhelming (genetics, geology, observation of speciation) that philosophical quibbles about demarcation criteria feel like debating whether a hammer is "truly" a tool while you are trying to build a house.

  ### Summary
  You aren't missing the logic; you are working from a 1974 snapshot of Popper's thought process which he updated in 1978.

  1.  **Popper retracted his criticism.** He admitted natural selection is testable.
  2.  **Fitness is not tautological.** It is measured via independent traits, allowing for failed predictions.
  3.  **Evolution is falsifiable.** Specific findings (like anachronistic fossils) would disprove it.
  4.  **It is not astrology.** Astrology cannot be falsified; Evolution can be, and has been tested rigorously.

  As an analytical chemist, you appreciate that a method is valid if it yields consistent, predictable, and independently verifiable results. Evolutionary biology meets that standard. The philosophy caught up with the practice decades ago.
