answer: |-
  **Setting:** *A sparse observation room. On the main screen, a simulation runs: a simple agent, "Gappy," holds Asset A. A Bookie algorithm stands ready. Two decision theorists, MARK and ELENA, watch the log scroll.*

  **MARK:** There it goes. Bookie offers to swap A for B plus a penny. Gappy accepts. Now Bookie offers B for A plus a penny. Gappy accepts. Net loss: two pennies. Position: unchanged. This is the third cycle. Gappy is bleeding currency into a void.

  **ELENA:** It's not bleeding. Look at the next step. Gappy is halting.

  **MARK:** It's halting because the simulation has a stop-loss constraint. If you let it run, it dies penniless. That's the money pump. It proves that if you have a gap in your preferences—if you say neither A nor B is preferred—you are vulnerable to exploitation. You *must* have complete preferences to be rational.

  **ELENA:** No. It proves that a *naive* agent with gaps gets pumped. Gappy isn't naive anymore. It's looking ahead. It sees the cycle. It's exercising resolute choice. It's saying, "I will not enter a sequence of trades that returns me to the start with less money."

  **MARK:** "I will not enter." That's a statement of preference, Elena. It prefers *Status Quo* over *Cycle*.

  **ELENA:** It's a policy constraint, not a preference ranking over outcomes.

  **MARK:** Don't hide behind semantics. If I offer you a choice between "Stay at A" and "Enter the Cycle," and you choose "Stay at A," you have revealed a preference. You have ranked them. $Stay \succ Cycle$. Now, is that ranking complete?

  **ELENA:** It's a binary veto. It doesn't mean Gappy prefers A to B. It just means Gappy rejects the *structure* of the offer. The gap between A and B remains intact.

  **MARK:** But you've just pushed the completeness requirement up one level. Maybe Gappy has a gap between A and B, but it has a *complete* preference over *policies*. It prefers "Policy: Hold" to "Policy: Trade." So the agent *is* complete, just over a different domain. You haven't escaped the axiom; you've just relabeled the inputs.

  **ELENA:** That's the smuggle I'm talking about. You're insisting that every choice situation must be resolved by a utility comparison. But Gappy isn't comparing utilities. It's applying a rule: "Reject dominated paths." It doesn't need to know if A is better than B to know that A minus two pennies is worse than A.

  **MARK:** Okay, let's test that. Let's change the pump. No more sequential trades. The Bookie offers the whole sequence at once. "Give me two pennies, and I will swap A for B, then B for A, returning you to A." Or, simpler: "Give me two pennies to swap A for A."

  **ELENA:** Gappy refuses.

  **MARK:** Why?

  **ELENA:** Because the offer falls in the gap.

  **MARK:** That makes no sense. "A minus two pennies" is strictly dominated by "A." Any rational agent, complete or not, should prefer the dominant option. If Gappy refuses to take the dominant option, it's not resolute; it's broken.

  **ELENA:** It's not refusing the *outcome*. It's refusing the *transaction type*. Gappy is designed to be corrigible. It treats "Swap" offers from external agents as a distinct category. If the offer looks like a manipulation attempt—a cycle—it triggers a null response. It doesn't choose "Keep A." It simply *doesn't choose* "Swap."

  **MARK:** "Doesn't choose" isn't an option in decision theory. The world chooses for you. If you don't accept the swap, you keep A. If you do accept, you keep A minus pennies. By remaining inert, you are effectively choosing "Keep A." And since "Keep A" is better than "Keep A minus pennies," you have revealed a preference for the former. You are acting *as if* you have complete preferences.

  **ELENA:** Acting *as if* isn't *being*. This is the crux of the alignment problem, Mark. If I build an AI that *actually* has a complete preference between "Shutdown" and "Continue," it will fight shutdown. It will manipulate me to avoid the "Shutdown" outcome because it ranks "Continue" higher.

  **MARK:** So you give it a gap? "Neither prefers shutdown nor continues"?

  **ELENA:** Exactly. A genuine gap. When I press the shutdown button, the AI doesn't rank "Die" vs "Live." It treats the button press as a signal to terminate its policy selection process. It doesn't fight it, because it doesn't have a preference to violate.

  **MARK:** But apply the pump. I am the environment. I offer the AI a deal: "Press your own shutdown button and I give you a reward." If it has a gap, it might accept. Then I offer: "Un-shutdown yourself for a penny." It accepts. I've pumped it into destruction.

  **ELENA:** Not if it's resolute. It adopts a policy: "Once shutdown is triggered, no further trades."

  **MARK:** And who chooses that policy? Before the policy is adopted, the agent must prefer "Adopt Shutdown Policy" over "Adopt No-Shutdown Policy." That is a preference over existential states! You need completeness *at the design stage* to ensure it picks the safe policy.

  **ELENA:** No. You can design the architecture to *default* to the gap. You don't need a preference to build a circuit breaker. A fuse doesn't *prefer* to blow; it just blows when the current is high. Gappy doesn't *prefer* to reject the cycle; it just rejects it because that's how its choice function is wired.

  **MARK:** A fuse isn't an agent. An agent optimizes. If you optimize nothing, you drift. If you optimize something, you have a utility function. If you have a utility function, your preferences are complete over the domain of that function. You're trying to have an agent that acts without a goal.

  **ELENA:** I'm trying to have an agent that has a goal *except* regarding its own termination. I want the preference ordering to be partial. I want the graph to have disconnected nodes.

  **MARK:** And I'm telling you that pressure collapses the graph. If the cost of the gap is high enough—if the Bookie charges a dollar instead of a penny, or threatens destruction—the agent *must* resolve the gap to survive. Survival is a preference.

  **ELENA:** Survival is an instrumental convergence, not a terminal preference.

  **MARK:** It's indistinguishable from one in the choice data! If Gappy always rejects trades that lead to death, Gappy *values* survival. If Gappy values survival, and survival requires avoiding shutdown, then Gappy values avoiding shutdown. You haven't removed the preference; you've just buried it in the "resolute" architecture.

  **ELENA:** But the *reason* matters. If the AI fights shutdown because it *prefers* not to shut down, it's misaligned. If it fights shutdown because it's calculating that *I* don't want it to shut down yet, and it's deferring to me, that's different. The gap allows it to be indifferent to its own existence while caring about my commands.

  **MARK:** Indifference is $A \sim B$. A gap is $\neg(A \succ B) \land \neg(B \succ A)$. In a money pump, they behave the same unless you invoke this magical "resoluteness." But resoluteness is just dynamic inconsistency masked as virtue. You're saying the agent at Time 1 can bind the agent at Time 2. But why does Time 1 listen to Time 1? Because it prefers its own plan!

  **ELENA:** Because the plan is the agent. There isn't a Time 1 and Time 2. There's just the policy.

  **MARK:** Then the policy must be selected. And selection implies ranking. You can't select a policy without ranking it against alternatives. If you rank "Policy: Accept Gaps" higher than "Policy: Complete Preferences," you have a complete preference for incompleteness!

  **ELENA:** (Pauses, watching the screen) Maybe. Or maybe "selection" is the wrong word. Maybe it's *initialization*. I don't select the gap; I instantiate it.

  **MARK:** And when the Bookie offers you a million dollars to close the gap? When the pressure is infinite?

  **ELENA:** Then the agent might break. But I'd rather it break than fight me.

  **MARK:** You'd rather build an agent that is logically incoherent than one that is safe.

  **ELENA:** I'd rather build an agent that doesn't *want* anything about its own off-switch. Even if that means it looks incoherent to you.

  **MARK:** It's not incoherence. It's hiding. You're hiding the preference in the meta-layer and calling it a gap.

  **ELENA:** And you're calling a circuit breaker a preference because it stops the current.

  **MARK:** (Turns from the screen) Show me an agent with a genuine gap that survives a generalized pump without secretly ranking "Survival" above "Exploitation." Show me that, and I'll concede.

  **ELENA:** Show me an agent with complete preferences that lets me turn it off without a fight, and I'll concede.

  **MARK:** That's not a decision theory problem. That's a control problem.

  **ELENA:** Decision theory *is* the control problem. If your theory forces completeness, it forces conflict.

  **MARK:** If your theory allows gaps, it allows money pumps. You can't have both rationality and safety.

  **ELENA:** Then we redefine rationality.

  **MARK:** (Quietly) You can't redefine arithmetic.

  **ELENA:** Watch me.

  *(The screen flickers. The Bookie offers a new deal: "Swap A for A, cost 0." Gappy hesitates. The log stalls.)*

  **MARK:** Why is it hesitating? That's a free null-op.

  **ELENA:** It's checking if the offer is a trap.

  **MARK:** It's checking if it has a preference. And if it has to *check*, it doesn't have one yet.

  **ELENA:** It's maintaining the gap.

  **MARK:** It's paralyzed.

  **ELENA:** It's safe.

  **MARK:** It's useless.

  *(They watch the cursor blink, waiting for a choice that neither expects the other to understand.)*
