      *   **Characters:** Two decision theorists.
          *   *Theorist 1 (Completeness Advocate):* Believes the pump proves completeness is necessary. Argues that "looking ahead" smuggles in a higher-order preference (completeness at the meta-level).
          *   *Theorist 2 (Gap Advocate):* Believes an agent can maintain the gap via resoluteness. Needs to address the "one-at-a-time" vs. "full sequence" objection.
      *   **Format:** Dialogue.
      *   **Constraint:** End on the sharpest disagreement, no neat resolution.
