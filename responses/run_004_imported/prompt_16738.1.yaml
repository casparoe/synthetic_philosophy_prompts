      *   *Elena:* And if you force completeness, you get an AI that fights shutdown.

  6.  **Polishing the Voices:**
      *   Mark should sound like a classical economist/decision theorist (Savage, Von Neumann). Precise, slightly impatient.
      *   Elena should sound like an AI safety researcher (Christiano, Soares-ish). Focused on structural alignment, willing to break orthodoxy.

  7.  **Final Review against Constraints:**
