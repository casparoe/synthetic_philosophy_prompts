      *   *Why G2 isn't enough:* G2 says you can't prove $\text{Con}(T)$ (i.e., $\neg \square \bot$). But the tiling problem isn't just about consistency; it's about *soundness* regarding specific actions. The agent needs to reason: "If my successor proves action $a$ is good, then $a$ is good." This is a reflection principle ($\square P \to P$). G2 blocks proving $\neg \square \bot$, but Löb blocks proving $\square P \to P$ for arbitrary $P$ within the same system.
