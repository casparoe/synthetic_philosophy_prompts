answer: |-
  **The Limits of Conditionals: Why Finks and Masks Defeat Reductive Analyses of Dispositions**

  The ambition to reduce dispositional properties to conditional statements is one of the enduring projects of analytic metaphysics. Driven by an empiricist desire to ground talk of powers in observable behaviors, the Simple Conditional Analysis (SCA) proposes that to say an object $x$ is disposed to manifest $M$ when stimulated by $C$ is simply to say that if $x$ were subjected to $C$, $x$ would $M$. A glass is fragile just in case it would break if struck. While intuitively appealing, this analysis has been besieged by two families of counterexamples: C. B. Martin's "finks" and Mark Johnston's "masks" (later termed "antidotes" by Alexander Bird).

  The dialectic between these counterexamples is often treated as a cumulative list of troubles for the conditional analysis. However, to understand why the project ultimately fails, one must recognize that finks and masks are not merely variants of the same problem. They attack the conditional analysis from opposite ontological directions. Finks exploit the instability of the disposition's intrinsic basis in response to the stimulus, while masks exploit the insufficiency of that basis in the face of extrinsic interference. When examined together, and when we consider the attempts to patch the analysis against them, a definite verdict emerges: no non-circular version of the conditional analysis can survive both threats. Dispositions resist reductive analysis in conditional terms because they are the categorical grounds *of* the conditionals, not the conditionals themselves.

  To see why finks and masks are distinct, we must look at the logical structure of the counterexamples relative to the object's intrinsic state. Martin's finks target the persistence of the disposition itself. In the classic "electrofink" case, a wire is connected to a device that monitors for contact. If the wire is dead, the device makes it live the instant a conductor touches it. Here, the counterfactual "if touched, the wire would conduct" is true, but the wire is not actually disposed to conduct (it is dead until the stimulus arrives). Conversely, in a reverse fink, a live wire is connected to a device that kills the current the instant it is touched. Here, the wire is disposed to conduct, but the counterfactual "if touched, it would conduct" is false. The fink works by making the stimulus $C$ the cause of the gain or loss of the dispositional basis $B$. The problem is one of *temporal stability*: the SCA assumes the disposition exists at the time of the stimulus and persists long enough to produce the manifestation, but finks show the stimulus can ontologically erase the disposition before manifestation occurs.

  Johnston's masks, by contrast, leave the intrinsic basis entirely untouched. Consider a fragile glass wrapped in perfect packing material. If struck, it will not break. The SCA yields a false negative: the glass is fragile, but the counterfactual "if struck, it would break" is false. Unlike the fink, the packing material does not reach into the glass and alter its molecular structure (its causal basis) when struck. The fragility remains fully intact throughout the stimulus. The mask works by interposing an extrinsic barrier between the stimulus and the manifestation. The problem here is one of *sufficiency*: the SCA assumes that the disposition plus the stimulus is sufficient for the manifestation, but masks show that the disposition plus stimulus is only sufficient *ceteris paribus*, provided no external interferers are present.

  David Lewis recognized the force of the fink objection and proposed a Reformed Conditional Analysis (RCA) in 1997. Lewis attempted to anchor the disposition to an intrinsic causal basis $B$. His analysis roughly states: $x$ is disposed to $M$ when $C$ iff $x$ has an intrinsic property $B$ such that if $C$ were to occur and $B$ were to persist, $x$ would $M$. This reform successfully neutralizes finks. In the reverse fink case (where the wire dies upon touch), the antecedent "if $C$ and $B$ persists" is false, because the fink ensures $B$ does not persist. Thus, the conditional does not falsely evaluate the disposition. By holding the basis fixed, Lewis blocks the stimulus from ontologically undermining the disposition during the test.

  However, as Alexander Bird demonstrated in 1998, Lewis's repair leaves the door wide open for masks. In the packing material case, the glass possesses its intrinsic causal basis (its molecular structure). When struck, that basis persists; the packing material does not alter the glass's structure, it merely absorbs the shock. Therefore, under Lewis's RCA, the antecedent "if struck and basis persists" is satisfied. Yet, the glass does not break. The RCA predicts manifestation where there is none. Bird's "antidote" shows that securing the intrinsic basis is not enough; one must also secure the extrinsic environment.

  This dialectic forces a proponent of the conditional analysis to patch the analysis again. The most natural move is to add a "no interferers" clause to the antecedent. One might propose: $x$ is disposed to $M$ when $C$ iff if $C$ were the case, and no finks or masks were present, $x$ would $M$. This seems to handle both problems. It excludes the fink (which interferes with the basis) and the mask (which interferes with the process). However, this rescue attempt collapses under the weight of circularity, which constitutes the core argument for the failure of reductive analysis.

  To avoid circularity, the terms "fink" and "mask" (or "interferer") must be definable without reference to the disposition being analyzed. But what counts as an interferer is disposition-relative. A packing material is a mask for fragility, but it is not a mask for the disposition of being soundproof. An electrofink is a fink for conductivity, but not for mass. To specify the "absence of masks" in the antecedent, we must say "absence of things that would prevent $M$ given the disposition to $M$." But if we must reference the disposition ($D$) to define the conditions under which the conditional ($C \rightarrow M$) holds, we have failed to reduce $D$ to the conditional. We are using the disposition to explain the truth of the conditional that is supposed to analyze the disposition. As Stephen Clarke and others have noted, this renders the analysis trivial. It tells us that a disposition is a property that produces a manifestation unless something stops it, which is informative but not reductive. It fails to tell us what the disposition *is* in terms of non-dispositional facts.

  Some contemporary philosophers, such as Daniel Manley and Gabriel Wasserman, have attempted to save conditionalism by abandoning the binary nature of the analysis. They propose a "proportion" or "gradable" account: to be disposed to $M$ is to have a high proportion of $C$-cases result in $M$ across close possible worlds. On this view, a masked glass is still disposed to break, just to a lesser degree in that specific context, or the analysis averages over worlds where the mask is absent. While this approach offers greater flexibility, it ultimately concedes the defeat of the *reductive* project. By appealing to "proportions of cases" across possible worlds, the analysis relies on primitive modal facts about similarity and propensity. The conditional truth is no longer doing the metaphysical heavy lifting; rather, the underlying dispositional nature of the object determines which worlds are relevant and what happens in them. The conditional becomes a symptom of the disposition, not its constitution.

  Therefore, we must reach a definite verdict on the viability of the conditional analysis. The distinct natures of finks and masks create a pincer movement that no conditional analysis can escape without triviality. Finks show that the stimulus can alter the truth-makers of the counterfactual (the intrinsic basis), while masks show that the truth-makers of the counterfactual (basis + stimulus) are insufficient for the manifestation without further extrinsic conditions. Any attempt to fix the antecedent to account for these factors—by requiring the basis to persist or by requiring the absence of interferers—inevitably smuggles the disposition back into the analysis. To specify which basis must persist, or which interferers must be absent, one must already know what disposition is being analyzed.

  Consequently, the conditional analysis of dispositions must be rejected as a reductive ontology. This does not mean dispositions are unreal, nor that conditionals are irrelevant. Rather, the relationship is inverted: dispositions are categorical properties (or primitive powers) that *ground* the truth of conditional statements. The glass breaks when struck *because* it is fragile; it is not fragile *because* it would break when struck. The fragility is the intrinsic feature that remains constant through the fink's attempt to remove it and the mask's attempt to block it.

  The debate over finks and masks teaches us that the world contains real modalities that cannot be flattened into extensional conditionals. Finks reveal that dispositions are sensitive to the timing of their own destruction, and masks reveal that they are sensitive to the context of their execution. A successful metaphysics of dispositions must therefore treat them as sui generis properties. We can use conditionals to test for dispositions, and we can use conditionals to describe their typical behavior, but we cannot define them away. The resistance of dispositions to conditional analysis is not a bug in our logic, but a feature of reality: powers are the engines of modality, not the exhaust.
