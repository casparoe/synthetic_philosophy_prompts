answer: |-
  The envelope contained no threat, only an itinerary. *Tomorrow. One location. Either the Obsidian Tower or the Glass Atrium.* Below the text was a ledger of names, hundreds of them, each marked with a location and a time of demise. Every single entry matched the historical record. The sender was known simply as the Auditor. He did not kill you; he simply arrived where you were going to be. His accuracy was not mystical; it was computational. He modeled decision processes better than the deciders could themselves.

  Elias sat in the center of his safehouse, the envelope on the table. He had to choose one location for tomorrow noon. If he was where the Auditor predicted, he died. If he was where the Auditor did not predict, he lived. The payoff was binary: survival or cessation.

  He stood up and paced. "I will go to the Tower," he said aloud.

  He stopped. The words hung in the air, settling into the room like dust. If he went to the Tower, it was because he had decided to go to the Tower. The Auditor models decision processes. Therefore, if Elias decided on the Tower, the Auditor would predict the Tower. If the Auditor predicted the Tower, the Auditor would be at the Tower.

  "Then I should go to the Atrium," Elias said.

  He felt the shift in his mind, the settling of a new intention. But the moment the intention to go to the Atrium solidified, it became a fact about Elias's state of mind. It became data. The Auditor models decision processes. If Elias decided on the Atrium, the Auditor would predict the Atrium. If the Auditor predicted the Atrium, the Auditor would be at the Atrium.

  Elias sat down heavily. The logic was a closed circuit. It wasn't that he was fated to die; it was that every specific choice he made became evidence against its own success. In decision theory, an act is ratifiable if, once you assume you are going to do it, it remains the most preferable option. But here, the assumption of the act supplied the evidence that made the act fatal.

  *If I choose Tower, probability of Death at Tower approaches 1. Expected utility of Tower crashes. Switch to Atrium.*
  *If I choose Atrium, probability of Death at Atrium approaches 1. Expected utility of Atrium crashes. Switch to Tower.*

  He looked at the clock. The deliberation itself was the trap. To choose was to signal. To signal was to be intercepted.

  "Randomize," he whispered.

  He reached into his pocket and pulled out a coin. A standard mixed strategy. If he committed to a fifty-fifty chance, perhaps he could break the link between his intention and the outcome. If the decision procedure was "flip a coin," then there was no specific location for the Auditor to target until the coin landed.

  He held the coin in his palm. But then he paused. The Auditor models decision processes. Did that include randomization algorithms? If Elias committed to the coin flip, the Auditor would predict the flip. But would the Auditor predict the *outcome* of the flip?

  If the Auditor was a perfect predictor of physical states, he could calculate the trajectory of the coin the moment Elias flicked his thumb. In that case, flipping the coin was no different than choosing. The outcome was determined the moment the decision to flip was made. The Auditor would wait at the location the coin was destined to show. The randomization would merely be a theater of chance masking a deterministic chain.

  But what if the Auditor only predicted *intent*? If Elias intended to randomize, perhaps the Auditor could only assign probabilities. If the Auditor went to the Tower, and Elias's coin landed Atrium, Elias lived. But then, why would the Auditor go to the Tower? If the Auditor knows Elias is randomizing, the Auditor's best move is to match the probability. But the Auditor must be in *one* place.

  Elias stared at the coin. If he flipped it, he was delegating the choice to physics. But if the Auditor could predict physics, he was delegating his death to physics as well. The instability hadn't vanished; it had just moved up a level. Now he wasn't choosing between Tower and Atrium; he was choosing between "Deterministic Choice" and "Predictable Randomization."

  If he chose to flip, and the Auditor predicted he would flip, did the Auditor wait at both? No, the ledger showed single locations. The Auditor had to commit. So the Auditor had to predict the result. If the result was predictable, the coin was a lie.

  Elias put the coin back in his pocket. He stood up again.

  "I will go to the Tower," he thought, trying to force the conviction.

  Immediately, the counter-thought arose: *You only think that because you are trying to escape the loop. But thinking that means you don't really intend it. If you don't really intend it, the Auditor won't predict it. If the Auditor won't predict it, the Tower is safe. So go to the Tower.*

  He took a step toward the door.

  *But if you go to the Tower because you think it's safe due to your own uncertainty, then your uncertainty was resolved. You intended it. The Auditor predicts resolved intentions.*

  He stopped. His heart was beating fast, not from fear of death, but from the friction of the reasoning. He was trying to find a fixed point in a mirror that moved whenever he approached it. He needed an act that, conditional on his doing it, maximized his survival. But conditional on his doing it, the probability of death spiked.

  There was no ratifiable act. There was no state of mind he could occupy where he could look at his own choice and say, "Given that I am doing this, this is still the best thing to do." Every choice screamed *switch* the moment it was made.

  He looked at the envelope again. The ledger inside was neat, orderly. It implied a world where causes preceded effects, where decisions were stable things. But his decision wasn't a thing; it was a process, and the process was visible to the Auditor.

  Maybe he shouldn't choose at all. Maybe he should stay here. But the envelope said *Tomorrow. One location.* Staying here was a third option, presumably predicted as "Nowhere," which might mean safety, or might mean the Auditor comes here instead. The rules were strict. Two cities. One appointment.

  Elias walked to the window. The city below was chaotic, full of people making choices that didn't matter, choices the Auditor wouldn't bother modeling. They could choose coffee or tea, left or right, and the universe wouldn't converge on them with lethal precision. He was alone in this specificity.

  He thought about the coin again. If he flipped it, and told himself he would obey it, he was creating a causal chain: Flip -> Outcome -> Action. The Auditor predicts the chain. If the chain is unbreakable, the outcome is known. If the outcome is known, the coin is useless.

  Unless... unless the act of flipping introduced genuine indeterminacy. Quantum noise. But could he trust his own thumb to be a quantum generator? Or would his neural firing patterns preceding the thumb flick give it away?

  He realized he was spiraling. The loop wasn't just in the choices; it was in the meta-choices. He couldn't even choose the *method* of choosing without that method becoming a predictor variable.

  Elias sat back down. He picked up a pen. He wrote *TOWER* on a slip of paper. He looked at it. It felt like a death warrant. He wrote *ATRIUM* on another. He looked at it. Same warrant.

  He placed them face down. He shuffled them. He picked one without looking.

  He held the paper in his hand, face down. He didn't look at it. If he didn't look, did he know where he was going? If he didn't know, could the Auditor know? But the Auditor didn't need Elias to know. The Auditor just needed the physical reality of Elias's future location to be derivable from the present state.

  If Elias walked out the door with the paper in his pocket, he was going to a specific place. The Auditor would be there. If Elias burned the paper and stayed home, he violated the itinerary.

  He sat there, the paper burning a hole in his palm. He understood now why the ledger was so neat. It wasn't because everyone died. It was because everyone who received the letter eventually made a choice that ratified their own demise. They chose, they switched, they chose again, and finally, they exhausted the time allowed for deliberation and defaulted to something. And that default was predictable.

  To survive, he needed to do something unpredictable. But to do something unpredictable intentionally is to make predictability the goal, which is itself a pattern.

  Elias looked at the clock. The sun was setting. He had to leave soon to reach either location by noon tomorrow. He had to move. But moving required a direction. And a direction was a prediction.

  He stood up, still holding the folded paper. He walked to the door. He did not open it. He stood in the threshold, suspended between the safety of the room and the necessity of the city. He knew that the moment he stepped forward, he would have to commit to a vector. And the moment he committed, the vector would be known.

  He wondered if the Auditor was already waiting, not at the Tower or the Atrium, but in the logic itself. The trap wasn't the cities. The trap was the requirement to choose rationally in a system where rationality was the leak.

  Elias closed his eyes. He thought about flipping the coin one last time. He thought about letting it fall where it may. He wondered if the Auditor credited him with the flip, or the result. He wondered if it mattered.

  He opened his eyes. He was still standing in the doorway. The paper was still in his hand. The choice was not made. The choice was not ratifiable. The clock ticked, measuring out a sequence of moments that remained, for now, unwritten. He did not move. He simply waited, holding the contradiction in his hand, hoping that indecision was a location the Auditor hadn't thought to check.
