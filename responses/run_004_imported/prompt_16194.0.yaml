      *   Ensure the word count is within 1000-1500.

  8.  **Self-Correction during drafting:**
      *   *Check:* Did I make it too mystical? *Correction:* Keep the Arbiter's mechanics clear. It's about information, not magic.
      *   *Check:* Is the ratifiability clear? *Correction:* Use internal monologue that mirrors the conditional probability. "If I decide this, then..."
