answer: |-
  **The Desert and the Definition: Why Rationality Requires Paying the Driver**

  The scenario is stark: you are dying in the desert. A driver offers a ride to town, but only if he predicts you will pay him \$1,000 upon arrival. He is a perfect predictor of human psychology. Once in town, the contract is unenforceable; you can keep the money or pay it. If you pay, you survive but are poorer. If you don't pay, you survive and are richer. But if the driver predicts you won't pay, he leaves you to die.

  Your friend Sam argues that once you are standing in town, paying is irrational. The ride is already taken. The prediction is already made. Paying costs you money with no causal return. Therefore, a rational agent keeps the cash. You countered that rationality applies to the *policy* or *disposition* that got you there, not just the isolated act at the end. You never settled it.

  This disagreement is not merely about a hypothetical desert; it is a clash between two competing definitions of rationality itself. Sam champions **Causal Decision Theory (CDT)**, which focuses on local causal leverage. You are advocating for **Dispositional or Functional Rationality**, championed by Derek Parfit, David Gauthier, and Edward McClennen.

  Sam's view is intuitive, but it is ultimately self-defeating. A theory of rationality that leads its adherents to die in the desert while "irrational" dispositional agents survive is a broken compass. Rationality is the art of achieving one's goals, not the art of making locally consistent excuses. **The hitchhiker should pay, full stop.** To argue otherwise is to confuse rationality with a specific, narrow kind of causal immediacy that fails in a world full of predictors, contracts, and reputations.

  ### The Case for Sam: The Tyranny of the Moment

  To defeat Sam's position, we must first steelman it. Sam's argument rests on the **Dominance Principle** and the fixity of the past. From the perspective of the agent standing in town, the timeline looks like this:

  1.  **Past:** The driver made a prediction and drove you to town. This is fixed. No action you take now can change it.
  2.  **Present:** You have the money.
  3.  **Future:** You choose Pay or Don't Pay.

  Sam argues that rationality is about maximizing utility given the current state of the world. In this moment, the variable "Did I get a ride?" is already set to *True*. The variable "Do I have \$1,000?" depends entirely on your current choice.
  *   If you Pay: You have a ride, minus \$1,000.
  *   If you Don't Pay: You have a ride, plus \$1,000.

  Since the ride is a sunk cost, "Don't Pay" strictly dominates "Pay." Sam would argue that any theory telling you to burn money for no causal benefit is engaging in magical thinking. It implies that your current choice can reach back in time and alter the driver's prediction. That is superstition, not rationality. If "rationality" requires you to act against your immediate self-interest when no one is watching, Sam says, then "rationality" is just a fancy word for "moralistic precommitment," and we should discard it in favor of plain instrumentalism.

  This view is powerful because it aligns with our intuition about freedom. In the moment, you *are* free to keep the money. Why should a past version of yourself bind a future version of yourself to a costly act when the threat is gone?

  ### The Case for Policy: Rationality as Winning

  Your counter-argument, aligned with Parfit's in *Reasons and Persons*, shifts the locus of rationality from the *act* to the *agent*. Parfit argues that a theory of self-interest (which he calls Theory S) is **self-defeating** if following it makes you worse off than following a different theory.

  In the Hitchhiker case, Theory S (Sam's view) tells you: "Maximize utility at every individual node of decision."
  *   If you follow Theory S, the driver predicts this. He knows that once you are in town, you will defect. Therefore, he never picks you up. You die.
  *   If you follow a Dispositional Theory (let's call it Theory D), you cultivate a disposition to keep promises even when enforcement is impossible. The driver predicts this. He picks you up. You pay. You live.

  Theory S leads to death. Theory D leads to life. If the goal of rationality is to satisfy one's preferences (in this case, the preference to live), Theory S fails.

  This is where **David Gauthier's Constrained Maximization** becomes crucial. Gauthier argues that it is rational to be a "constrained maximizer"—someone who cooperates on the condition that others are likely to do the same—rather than a "straightforward maximizer" (Sam's agent). The straightforward maximizer tries to cheat when they can get away with it. But because they are transparently rational in this narrow sense, they are excluded from cooperative ventures. The constrained maximizer, by contrast, is willing to bind themselves. They don't pay because it helps them *in that moment*; they pay because being the *kind of person who pays* is what allowed them to enter the situation.

  Furthermore, **Edward McClennen's Resolute Choice** addresses the "time inconsistency" problem. McClennen argues that a rational agent can adopt a plan *ex ante* (before the ride) and stick to it *ex post* (in town) not because the incentives haven't changed, but because rationality requires plan-resoluteness. To abandon the plan mid-stream is a failure of rational agency, not a triumph of freedom.

  Modern decision theorists (like those developing Functional Decision Theory) formalize this by suggesting you should view your decision not as a singular event, but as the output of an algorithm. The driver isn't predicting "what you will do"; he is predicting "what your algorithm outputs." If your algorithm outputs "Don't Pay" in town, it outputs "Don't Pay" in the simulation the driver ran. Therefore, deciding to pay *is* the causal lever that gets you the ride, because the decision determines the algorithm's output across all instances, including the prediction.

  ### The Verdict: Why Sam is Wrong

  Sam claims that the dispositional view is "quietly redefining what 'rational' means." He is correct that it redefines the term, but he is wrong that this is a bug. It is a feature. Sam is defending a definition of rationality that is useless for navigating a social world.

  **1. Rationality is Instrumental, Not Ritualistic**
  Sam treats rationality as a ritual of local optimization: "At every step, choose the path of highest immediate utility." But why do we value rationality? We value it because we expect it to help us win. If I have a map that consistently leads me off a cliff because it optimizes for "shortest distance to the next step" without looking at the terrain, I do not say the map is rational and the cliff is unfortunate. I say the map is broken.
  If "rational" agents die in the desert and "irrational" agents (those with dispositions to pay) survive to spend their money, then the label "rational" has lost its normative force. We should not worship a decision procedure that guarantees our own exclusion from beneficial cooperation.

  **2. The "Magic" Objection is a Red Herring**
  Sam argues that paying in town implies backward causation. It does not. It implies **logical correlation**. You are not changing the past; you are confirming the type of person you are. The driver didn't predict your specific act in a vacuum; he predicted *you*. You cannot separate your act in town from your identity as a predictor.
  Consider a simpler case: A job interview. You dress well not because the clothes causally force the interviewer to hire you in that moment, but because dressing well is part of the package that gets you hired. If you showed up in pajamas and said, "The hiring decision is already made based on my resume, so my clothes can't change it," you would be fired. The Hitchhiker case is the same, just with higher stakes. Your willingness to pay is part of the "package" that gets you the ride.

  **3. Self-Binding is the Essence of Agency**
  Sam views the separation between "you before the ride" and "you in town" as a hard wall. He thinks the "you" in town is free to disavow the "you" in the desert. But rational agency requires temporal integration. We make plans, promises, and resolutions specifically to bind our future selves.
  If Sam's view holds, then **all unenforceable promises are irrational to keep.** No one should ever repay a loan if they can get away with it. No one should ever keep a secret if revealing it helps them. A world of Sam-rational agents is a world of low-trust, high-transaction-cost misery where everyone dies in the desert because no one can credibly signal trustworthiness.
  To be a functional agent is to be someone whose future actions can be predicted by their past commitments. If you cannot bind yourself, you are not an agent; you are a leaf blowing in the wind of immediate incentives.

  ### Conclusion

  Sam's view is seductive because it feels like freedom. It feels like power to say, "I can take the ride and keep the money." But it is a false power, like the power to jump off a bridge because gravity hasn't caught you yet.

  Parfit's insight was that Self-Interest Theory is self-defeating. It tells you to pursue your interest in a way that ensures you cannot achieve it. The dispositional view does not redefine rationality to suit morality; it redefines rationality to suit **success**.

  The hitchhiker should pay. Not because it is moral, and not because it changes the past. But because the only way to be the kind of person who gets a ride is to be the kind of person who pays. Rationality is not about making the best move on the board when the game is already over; it is about playing the game in a way that lets you stay at the table. Sam's rationality leaves you dead in the sand. Yours lets you live. That is the only verdict that matters.
