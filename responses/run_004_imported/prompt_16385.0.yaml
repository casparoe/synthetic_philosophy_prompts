          *   *Critique:* Physicalists (like Type-B materialists) *do* argue it is special pleading. They argue phenomenal concepts are just unique *concepts*, not proof of unique *properties*. Mention this to show balance.
      *   **Conclusion:** Summarize. The distinction isn't arbitrary within the framework; it hinges on whether the term's reference is fixed by contingent description or by direct acquaintance.

  4.  **Refining the Tone:**
