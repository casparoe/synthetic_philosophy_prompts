      *   **Current Understanding:** They grasp the core of Kripke's *Naming and Necessity* regarding "Water = $H_2O$" as a necessary a posteriori truth. They understand the 2D semantics workaround (Primary Intension vs. Secondary Intension) to explain away the *conceivability* of water not being $H_2O$ as epistemic, not metaphysical.
      *   **The Problem:** They see a potential inconsistency. If 2D semantics explains away the intuition gap for water/brain states, why doesn't it do the same for pain/brain states? Why do proponents of 2D semantics (specifically David Chalmers) use the *same* framework to argue *for* dualism (or at least against physicalism) in the mind-body case, while using it to save physicalism in the water case?
      *   **The Accusation:** Is this "special pleading dressed up in technical formalism"?
