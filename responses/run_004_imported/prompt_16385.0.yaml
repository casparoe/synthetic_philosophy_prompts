  2.  **Deconstruct the Philosophical Issue:**
      *   **Kripke's Challenge:** Kripke argued that identity statements involving rigid designators are necessary if true. For "Heat = molecular motion," the sensation of heat is contingent. For "Pain = C-fiber firing," there is no contingent "sensation of pain" distinct from pain itself. Pain is picked out by its immediate phenomenological quality. Therefore, if pain $\neq$ C-fibers conceivably, it's metaphysically possible, so they aren't identical.
      *   **2D Semantics (Jackson, Chalmers, etc.):**
          *   **1D (Secondary Intension):** What the term refers to in counterfactual worlds, given what it refers to in the actual world. (Kripkean necessity).
          *   **2D (Primary Intension):** What the term refers to given a world considered *as actual*. (Epistemic possibility).
          *   **The Materialist Move (Type-A):** Deny the conceivability of zombies. (Not Chalmers' view).
          *   **The Materialist Move (Type-B):** Accept conceivability, deny possibility. Use 2D to say the primary intension comes apart, but secondary intension stays locked. (This is what the user is describing regarding Water).
          *   **Chalmers' Move:** Argue that for phenomenal concepts (like "pain"), the primary and secondary intensions *coincide* or are tightly linked in a way that they aren't for natural kind terms (like "water").
      *   **The Crucial Distinction:** The nature of the *reference fixing*.
          *   **Water:** Reference fixed by superficial properties (clear, liquid, fills lakes). The underlying essence ($H_2O$) is discovered. There is a gap between the mode of presentation and the referent.
          *   **Pain:** Reference fixed by *how it feels*. The mode of presentation *is* the referent. There is no "hidden essence" of pain beyond the feeling.

