      *   *For Pain:* If "Pain" rigidly designates the feeling, and "C-Fiber" rigidly designates the firing, and we can conceive of one without the other, Kripke says they aren't identical. 2D semantics adds nuance: For water, the conceivability is due to the Primary Intension (watery stuff $\neq$ $H_2O$ conceptually). For pain, Chalmers argues the Primary Intension *is* the phenomenal quality. So if the Primary Intension is conceivable without C-fibers, the Secondary Intension is too.
      *   *Key Phrase:* "The mode of presentation constitutes the property."

  6.  **Final Polish:** Check against the "analytical chemist" persona. Use analogies like "operational definition" vs. "constitutive nature." Ensure the distinction between epistemic and metaphysical is crisp.

