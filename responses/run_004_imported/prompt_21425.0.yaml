  7.  **Refining the Philosophy (Self-Correction during drafting):**
      *   *Caution:* Don't oversimplify Hirsch. He doesn't say *anything* goes. He says there are equivalent languages.
      *   *Caution:* Don't oversimplify Sider. He argues for a *structural* role of the quantifier.
      *   *Key Distinction:* Is the variance in the *predicates* (species, table) or the *logical constant* ($\exists$)?
      *   *User's Old View:* "Everybody agrees on the facts on the ground." This implies a fixed ontology underlying the labels.
