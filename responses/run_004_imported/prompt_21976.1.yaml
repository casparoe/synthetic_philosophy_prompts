  **Philosopher (SIA):** "Don't worry about the total. I've just run the numbers. Since I exist, it is overwhelmingly probable that the universe contains $10^{50}$ observers rather than $10^{10}$."

  **Skeptic (SSA):** "Okay. And?"

  **Philosopher:** "And in a universe with $10^{50}$ observers, the probability of *this specific* check falling to *this specific* pair of diners is negligible. In the high-probability branch, someone else already paid."

  **Skeptic:** "That's not how indexicals work. We are the observers here."

  **Philosopher:** "Are we? Or are we just a random sample from the set of all possible diners? I'm not paying for the low-measure tail of the distribution."

  **Skeptic:** "Fine." *(waves to waiter)* "Hey, could we get two checks? My friend thinks he's in a different cosmological branch."

  **Waiter:** *(without looking up)* "Sorry. I only bill the Reference Class of 'People Currently at the Table'."

  **Philosopher:** "But that's SSA!"

  **Waiter:** "No, it's policy. In this restaurant, existence is not evidence for abundance. It's evidence for a credit card."

  **Skeptic:** *(turning back to friend)* "See? Even the waiter is a Bostromian. He knows you can't anthropic your way out of a tip."

  **Philosopher:** "Damn. I hate it when Reality enforces a tight reference class."
