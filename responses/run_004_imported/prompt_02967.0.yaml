answer: |-
  This is an excellent puzzle to tackle for a term paper. You have identified the central fault line in the modern philosophy of conditionals: the split between the metaphysical treatment of counterfactuals (Stalnaker/Lewis) and the epistemic treatment of indicatives (Adams/Edgington). The tension arises because we want a unified semantics for the word "if," but the logical behavior of the two constructions seems to demand different tools.

  Here is a walkthrough of the technical divergences, the probabilistic escape hatch, and finally, my defended opinion on whether this asymmetry is principled or an artifact.

  ### 1. Stalnaker vs. Lewis: The Mechanics of Closeness

  Both Robert Stalnaker (1968) and David Lewis (1973) agree on the core intuition: a counterfactual $A > C$ ("If A were the case, C would be the case") is true at a world $w$ if $C$ holds in the $A$-worlds that are "closest" or "most similar" to $w$. However, they formalize "closeness" differently, leading to logical divergences.

  **Stalnaker: The Selection Function**
  Stalnaker models similarity using a **selection function** $f(A, w)$. This function takes an antecedent $A$ and a base world $w$ and returns a *single* world: the unique closest $A$-world.
  *   **The Uniqueness Assumption:** Stalnaker assumes that for any consistent $A$ and world $w$, there is exactly one closest $A$-world.
  *   **The Limit Assumption:** He assumes there *is* a closest world (i.e., we don't face an infinite sequence of $A$-worlds getting closer and closer without ever reaching a limit).
  *   **Logical Consequence:** This validates **Conditional Excluded Middle (CEM)**: $(A > C) \lor (A > \neg C)$. Since there is only one closest $A$-world, $C$ is either true there or false there. There is no middle ground.

  **Lewis: Systems of Spheres**
  Lewis models similarity using a **system of spheres** centered on $w$. Think of these as nested bubbles of worlds ordered by similarity.
  *   **Rejection of Uniqueness:** Lewis argues that similarity is vague. There might be a "tie" for closest. For example, if Bizet and Verdi were compatriots, would they be both French or both Italian? There may be one closest world where they are French and another equally close world where they are Italian.
  *   **Rejection of the Limit Assumption:** Lewis argues there might be no closest world. Imagine a line that gets closer and closer to a point but never touches it. Similarly, there might be an infinite sequence of $A$-worlds, each closer than the last, with no "closest" one.
  *   **Logical Consequence:** Lewis rejects CEM. In the case of a tie, it is false that "If A, C" (because $C$ fails in the Italian world) and false that "If A, not-C" (because $C$ holds in the French world). Both counterfactuals are false.

  **Why this matters:** Stalnaker's semantics is logically cleaner (validating more inferences), while Lewis's is metaphysically more cautious (accommodating vagueness). But both treat counterfactuals as having robust **truth conditions** grounded in modal reality.

  ### 2. Adams and Edgington: Escaping Triviality

  When we switch to indicatives ("If Oswald didn't kill Kennedy, someone else did"), the possible-worlds machinery seems less natural. Ernest Adams (1965) proposed that we should not look for truth conditions but for **assertability conditions**.

  **Adams' Thesis:** The assertability of an indicative conditional $A \to C$ is measured by the conditional probability $P(C|A)$.
  **Lewis's Triviality Results (1976):** Lewis proved that if you assume:
  1.  Conditionals express propositions (have truth conditions).
  2.  The probability of that proposition equals the conditional probability ($P(A \to C) = P(C|A)$).
  3.  Standard probability axioms hold.
  ...then the only probability functions that satisfy this are **trivial** (i.e., they can only assign probabilities of 0 or 1 to everything).

  **The Escape Hatch:** Adams and later Dorothy Edgington accept Lewis's proof but reject premise (1). They argue that indicative conditionals **do not express propositions**. They are not truth-apt.
  *   For Edgington, saying "If A, C" is not stating a fact about the world; it is a speech act that invites you to suppose $A$ and assess $C$ within that supposition.
  *   Because they lack truth conditions, Lewis's proof does not apply. You cannot equate the *probability of truth* with conditional probability if there is no truth to begin with. Instead, the *degree of belief* in the conditional just *is* the conditional probability.

  ### 3. The Oswald/Kennedy Pair

  This distinction is best seen in the famous example you mentioned.

  1.  **Indicative:** "If Oswald didn't kill Kennedy, someone else did."
      *   **Status:** Highly assertable (True).
      *   **Reasoning:** We know as a matter of fact that Kennedy was killed. Our epistemic state rules out the possibility that no one killed him. Therefore, in the set of possibilities compatible with our knowledge where Oswald is innocent, someone else is the killer. $P(\text{Someone else} | \text{Oswald didn't}) \approx 1$.
  2.  **Counterfactual:** "If Oswald hadn't killed Kennedy, someone else would have."
      *   **Status:** Unassertable (False).
      *   **Reasoning:** We are now asked to imagine a world where the assassination did not happen as it did. In those closest worlds, does the conspiracy succeed with a backup shooter? Most historical evidence suggests no; it was likely a lone opportunity. The causal chain breaks. The closest world where Oswald refrains is a world where Kennedy lives.

  **The Contrast:** The indicative tracks our *actual knowledge* (Kennedy is dead), while the counterfactual tracks *causal similarity* (what would have happened if the cause were removed). This motivates the split: Indicatives seem epistemic (Adams), Counterfactuals seem metaphysical (Lewis).

  ### 4. Opinion: Is the Asymmetry Principled or an Artifact?

  You asked for a specific defended position. Here it is:

  **The asymmetry of treating counterfactuals as truth-conditional while denying truth conditions to indicatives is largely an artifact of the debate, driven by an over-commitment to Adams' Thesis at the expense of semantic compositionality.**

  While there is a principled *pragmatic* difference between indicatives (epistemic) and counterfactuals (metaphysical), there is no justification for denying truth conditions to indicatives. We should treat both as truth-conditional, likely within a unified framework (such as a contextualist strict conditional semantics), and explain the probabilistic intuitions via pragmatics rather than semantics.

  **Defense of this Position:**

  1.  **The Embedding Problem:** The strongest argument against the Adams/Edgington view is that indicative conditionals behave like propositions when embedded in larger sentences. We can say, "It is not the case that if Oswald didn't kill Kennedy, someone else did," or "Either if Oswald didn't do it, Ruby did, or the Warren Commission lied." If indicatives have no truth value, negation and disjunction should not apply to them logically. The fact that we reason with them in complex logical structures suggests they *do* express propositions. The "no truth conditions" view forces us to treat these embeddings as systematic errors or requires complex, ad-hoc explanations for why non-truth-apt sentences behave like truth-apt ones.

  2.  **Misinterpreting Triviality:** Lewis's Triviality Results are often taken to show that conditionals cannot have truth conditions. They do not. They only show that the **probability of the truth** of a conditional cannot always equal the **conditional probability**. We can retain truth conditions (for example, identifying the indicative with the Material Conditional, or a contextually restricted Strict Conditional) and argue that Adams' Thesis describes a *pragmatic* rule of assertability, not a *semantic* identity. We assert "If A, C" when $P(C|A)$ is high, even if the truth condition is something else (e.g., $\neg(A \land \neg C)$). This preserves compositionality without collapsing into triviality.

  3.  **Semantic Uniformity:** Positing two entirely different semantic types for the same lexical item ("if") is a theoretical cost that should only be paid if forced. The "artifact" arose because philosophers in the 70s and 80s wanted to save the intuition that $P(\text{If } A, C) = P(C|A)$ so badly that they were willing to sacrifice the propositional status of the conditional. It is more theoretically parsimonious to keep a unified truth-conditional semantics for "if" and explain the divergence in the Oswald case via **contextual shift**. In the indicative, the context fixes the actual world's facts (Kennedy is dead); in the counterfactual, the context shifts to a modal base where those facts are not fixed.

  **Conclusion for your paper:**
  You should argue that the Stalnaker/Lewis divergence is a technical dispute within a shared truth-conditional paradigm, whereas the Adams/Edgington move is a radical departure that creates more problems (embedding, compositionality) than it solves. The "principled" difference is not about truth conditions, but about the **modal base**: indicatives quantify over epistemically accessible worlds, while counterfactuals quantify over metaphysically similar worlds. Both can be truth-conditional; only the domain of quantification changes. The denial of truth conditions for indicatives is a historical artifact of trying to make probability do the work of semantics.
