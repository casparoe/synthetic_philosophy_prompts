answer: |-
  Good evening, everyone. For those of you who never took Logic 101, welcome. For those of you who did: yes, you can put away your truth tables. Nothing here is going to be graded. Although, knowing our guest of honor, she's probably already mentally checked the validity of this argument.

  For thirty-two years, Professor [Name] began her semester with a promise. She would tell a room full of freshmen that there would be a pop quiz sometime in the coming weeks, but that it would be a *surprise*. You would not know the night before.

  Then, she spent the rest of the semester daring us to prove her wrong.

  For the uninitiated, the "Surprise Exam Paradox" goes like this: If the quiz hasn't happened by the last day, it can't be a surprise on the last day, because you'd know it was coming. So the last day is out. But if the last day is out, then the second-to-last day becomes the last day, so it can't be a surprise either. By working backward, you prove that a surprise exam is logically impossible.

  And then, usually on a Wednesday, she would hand out index cards, and we would be surprised. And she would smile, because she knew that while the logic was seductive, the reality was undeniable.

  When we started planning this party, the organizing committee had a genuine fear. We weren't worried she'd find out through a leak. We were worried she'd *reason* her way in. We worried that she would apply that same backward induction to her own retirement. "A party is statistically probable. If it hasn't happened by Friday, it must be Saturday. Therefore, I should expect it Saturday." We worried that for the woman who taught four decades of students how to think, the surprise would be logically invalid before we even bought the cake.

  There is a long philosophical debate about why the student's reasoning in the paradox fails. Quine wrote about it. Blogs like Less Wrong have chewed on it for years. Is it a problem of knowledge? Of self-reference?

  But standing here, looking at a room filled with people who span forty years of her life, I think we found the solution to the paradox. And the solution is her.

  The backward induction argument relies on a specific assumption: that the student and the teacher are adversaries in a closed system of perfect information. It assumes isolation. It assumes that the only thing connecting people is a set of rules.

  But that was never how she taught.

  Yes, she gave the quizzes. Yes, she held us to the rigor of the argument. But she didn't do it to trap us. She did it to wake us up. She spent thirty-two years teaching us that while logic is a powerful tool, it is not the whole of human experience.

  The reason the surprise worked tonight—the reason she is genuinely standing there stunned—is because you cannot deduce affection. You cannot use backward induction on love.

  The paradox fails because it ignores the variable of trust. We kept this secret not because we were better logicians than she is, but because we are her community. A surprise party isn't a proposition to be proven; it's a gift to be received. And a gift, by definition, breaks the closed loop of expectation.

  To the third of this room who went on to become philosophers and computer scientists: she taught us how to build systems that hold together.
  To the two-thirds of us who just needed a requirement and walked away remembering her kindness more than her syllogisms: she taught us that rigor and warmth are not mutually exclusive.

  She proved, year after year, that the exam could happen, and that it could be a surprise. And tonight, we have proven that a party could happen, and that it could be a surprise. Not because the logic was flawed, but because the premise was wrong. We aren't adversaries testing the limits of knowledge. We are students, and colleagues, and friends, testing the limits of our gratitude.

  Professor [Name], you spent a lifetime showing us that the unexpected is possible. That the conclusion doesn't always follow from the premises. That sometimes, you just have to show up on a Wednesday and take the quiz.

  Thank you for the rigor. Thank you for the kindness. And thank you for letting us be the ones to surprise you, just once.

  To Professor [Name].
