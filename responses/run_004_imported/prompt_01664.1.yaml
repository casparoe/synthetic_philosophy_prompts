answer: |-
  This is one of the most difficult and common dilemmas adult children face today. You are navigating the collision of modern economic reality (dual-income households, high housing costs, career specialization) and ancient familial expectations (filial piety, physical proximity).

  To answer your direct question: **No, you are not a bad person for prioritizing the life you have built.** And no, it is not inherently your moral obligation to "blow up" your life to provide care, especially when other viable solutions exist.

  Here is a framework for how to think about what people owe each other in this situation, and how to handle the family dynamics without drowning in guilt.

  ### 1. Distinguish Between "Care" and "Presence"
  There is a misconception that being a "good child" means being physically present. In reality, **sustainable care** is what your parents need, not necessarily *you* specifically changing diapers or cooking meals.

  *   **The Obligation:** You have an obligation to ensure your parents are safe, loved, and cared for.
  *   **The Method:** That does not have to mean *you* are the one delivering the care.
  *   **The Reality:** Since your parents have savings, they can purchase professional care. If you move back, lose your income, and deplete your own savings, you might end up becoming a financial burden on them (or your sister) later.

  **Reframing the thought:** Contributing financially to hire help, managing their care remotely, or visiting regularly is a valid form of "showing up." It is not less noble than physical caregiving; it is often more sustainable.

  ### 2. Analyze the Sibling Dynamics (The "Fairness" Trap)
  Your brother's comment ("the right thing for one of us to move back") is a classic example of **moral grandstanding.** It is very easy to define what is "right" when you are not the one being asked to sacrifice your career, partner, and home.

  *   **The Brother:** Is he volunteering to move back? If not, his suggestion is essentially assigning the sacrifice to someone else. That is a red flag.
  *   **The Sister:** She lives nearby. Her "look" might stem from feeling overwhelmed and hoping you will take the burden off her, or it might be judgment. However, proximity does not equal sole responsibility. Just because she is closer doesn't mean she gets to dictate that you must move closer, nor does it mean she is entitled to your life.
  *   **The User (You):** You are the outlier geographically. In many families, the "distant child" often pays more financially or handles administrative tasks (insurance, medical research) while the "local child" handles physical tasks. This is a valid division of labor.

  ### 3. The "Oxygen Mask" Principle
  You mentioned you have a partner and a career trajectory that would be "torpedoed" by moving.
  *   **Your Partner:** Your primary obligation is to the family unit you are building *now* (you and your partner), not just the one you came from. Asking your partner to uproot their life so you can care for your parents is a massive request that requires their full consent, not just your guilt.
  *   **Resentment:** If you move back out of obligation rather than genuine desire, you will likely become resentful. Resentment is poison in caregiving. It leads to burnout, anger toward the parents, and conflict with siblings. A burnt-out caregiver helps no one.

  ### 4. What Do People Owe Each Other?
  You asked what people owe each other in these situations. A healthy ethical framework usually looks like this:

  *   **Parents owe Adult Children:** The understanding that their children have their own lives to lead. They should not expect their children to impoverish themselves to provide care if other options exist.
  *   **Adult Children owe Parents:** Dignity, safety, advocacy, and love. This does not automatically equal self-sacrifice.
  *   **Siblings owe Each Other:** Honesty and equitable contribution based on *capacity*, not equality based on *action*.
      *   *Example:* If the sister has more time but less money, she might do more visits. If you have more money but less time, you might fund a portion of the hired help. If the brother has neither, he might handle the paperwork or emotional check-ins.

  ### 5. Actionable Steps to Reduce Guilt and Conflict
  Instead of wrestling with this internally, move the conversation to a practical plane.

  **Step 1: Talk to your parents (without siblings first).**
  Ask them what *they* want. Many parents are terrified of being a burden on their children. They might prefer using their savings to hire professionals so they can maintain a relationship with you as a *child*, not a *nurse*.

  **Step 2: Call a Family Meeting.**
  Include your brother and sister. Come with a proposal, not a defense.
  *   *Say:* "I love Mom and Dad and want to ensure they get the best care. Moving back isn't feasible for me without causing financial instability that would actually limit my ability to help them long-term. However, I am willing to contribute in these ways: [X amount of money per month], [managing medical bills], [visiting once a quarter]."
  *   *Ask:* "Brother, you mentioned someone should move back. Are you considering that? If not, how do you envision us splitting the responsibility?"

  **Step 3: Hire a Geriatric Care Manager.**
  Since your parents have savings, suggest hiring a professional care manager. This person acts as a project manager for their health. They coordinate doctors, hire aides, and check in on the house. This takes the pressure off all three of you and ensures your parents get expert attention.

  ### Summary
  Your brother is projecting a traditional solution onto a modern problem. Your sister may be feeling the strain of proximity. But you cannot solve their feelings by destroying your stability.

  **You are not abandoning them if you ensure they are cared for.** You are simply acknowledging that you can be a better son by supporting them from a position of strength (financial and emotional stability) rather than a position of sacrifice and resentment.

  Stand firm in your boundaries, offer alternative support, and refuse to accept guilt as a currency for love.
