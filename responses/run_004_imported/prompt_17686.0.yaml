answer: |-
  This is a fantastic premise for a novel. The Frege–Geach problem is the expressivist's original sin, and the decades-long debate between Blackburn and Gibbard represents the two most sophisticated attempts at absolution. For your characters to sound authentic, the disagreement shouldn't just be about "who is right," but about *what kind of project* metaethics should be.

  Here is a technical breakdown of the terrain, specifically tailored to help you construct the argument in your bar scene.

  ### 1. The Core Challenge: The Unasserted Context
  To set the scene: The Frege–Geach problem notes that moral sentences work in logic just like factual sentences.
  *   **Factual:** "It is raining." / "If it is raining, the grass is wet." / "Therefore, the grass is wet."
  *   **Moral:** "Lying is wrong." / "If lying is wrong, getting your brother to lie is wrong." / "Therefore, getting your brother to lie is wrong."

  In the factual case, the meaning of "It is raining" stays the same whether it is asserted or embedded in a conditional. But for an expressivist, "Lying is wrong" means something like *Boo lying!* (Blackburn) or *I plan to avoid lying!* (Gibbard).
  **The Problem:** When I say, "If lying is wrong...", I am not *Booing* lying. I am not currently *planning* to avoid lying. So what meaning does the sentence have in the antecedent? And if the meaning changes, how can the logic (modus ponens) be valid?

  ### 2. Simon Blackburn: Quasi-Realism and Higher-Order Attitudes
  Blackburn's project is **Quasi-Realism**. He wants to "earn the right" to talk *as if* moral judgments are truth-apt (capable of being true or false) without actually believing they describe mind-independent facts. He is a deflationist about truth.

  **The Mechanism:**
  For Blackburn, moral logic is not about truth-preservation; it is about **attitude consistency**.

  **The Conditional:**
  When your character accepts *"If lying is wrong, then getting your little brother to lie is wrong,"* Blackburn says they are not expressing a first-order attitude toward lying. Instead, they are expressing a **higher-order attitude**.
  *   They are expressing a disapproval of a specific *combination* of attitudes: The combination of (Booing Lying) + (Not Booing Getting-Brother-to-Lie).
  *   To accept the conditional is to commit oneself to having a coherent moral sensibility. It is to say: "I rule out having the attitude that lying is wrong while lacking the attitude that inducing lying is wrong."

  **Modus Ponens:**
  Why is the inference valid? For Blackburn, validity is defined pragmatically. An argument is valid if accepting the premises and rejecting the conclusion involves a **pragmatic inconsistency** (a "fractured sensibility").
  *   If you accept "Lying is wrong" (Boo Lying!)...
  *   And you accept the conditional (I disapprove of [Boo Lying + Not-Boo Inducing]...)...
  *   But you reject the conclusion (Not-Boo Inducing)...
  *   ...You are in a state of psychological conflict. You are violating your own higher-order commitment.

  **The Vibe:** Blackburn is the Humean. He cares about sentiments, coherence of character, and the project of making our moral language look realistic enough to function in society.

  ### 3. Allan Gibbard: Norm-Expressivism and Hyperplans
  Gibbard starts closer to Blackburn but moves toward a more formal, decision-theoretic framework. In his later work (*Thinking How to Live*), he introduces **Hyperplans** to solve the precision problem.

  **The Mechanism:**
  For Gibbard, to judge something "wrong" is to **accept a norm** that permits or forbids it. But norms are vague. To fix content precisely, Gibbard uses the concept of a **Hyperplan**.
  *   A hyperplan is a *maximally specific* plan for every possible contingency. It is the planning equivalent of a "possible world."
  *   To think "Lying is wrong" is to rule out all hyperplans that permit lying.

  **The Conditional:**
  When your character accepts *"If lying is wrong, then getting your little brother to lie is wrong,"* Gibbard says they are ruling out a specific set of hyperplans.
  *   They are ruling out any hyperplan that forbids lying *but* permits getting one's brother to lie.
  *   Crucially, Gibbard treats planning states as having a logical structure analogous to belief states. Just as beliefs can be inconsistent (believing P and not-P), plans can be inconsistent (planning A and planning not-A).

  **Modus Ponens:**
  Why is the inference valid? Gibbard argues that logic applies to plans just as it applies to beliefs.
  *   If you plan to avoid lying...
  *   And you plan to avoid any plan-set that [avoids lying but permits inducing]...
  *   Then consistency demands you plan to avoid inducing.
  *   Gibbard tries to build a formal semantics where "validity" is the preservation of **consistency in planning**, not truth.

  **The Vibe:** Gibbard is the Rational Choice Theorist. He cares about consistency, formal semantics, and the architecture of rational agency.

  ### 4. The Assessment: Do They Founder on the Same Rock?
  This is the crux of your bar scene. Both theories are sophisticated, but both face a devastating objection often associated with Mark Schroeder (the "Negation Problem" or "Embedding Problem").

  **The Shared Rock:**
  Both Blackburn and Gibbard try to explain logical validity in terms of **psychological or planning inconsistency**.
  *   **Blackburn:** It's invalid because your *sentiments* clash.
  *   **Gibbard:** It's invalid because your *plans* clash.

  **The Criticism:**
  Critics argue this changes the subject. Logical validity is supposed to be about *content*, not *psychology*.
  *   If I say, "If lying is wrong, then inducing lying is wrong," the validity of the inference should hold even if no one is around to have sentiments or make plans.
  *   By defining validity as "inconsistency of attitudes," Blackburn and Gibbard make logic dependent on human psychology.
  *   Furthermore, there is the **Negation Problem**. Blackburn says "Lying is not wrong" expresses a different attitude than "Boo lying." But what attitude does "If lying is not wrong..." express? It becomes very hard to distinguish the attitude expressed by "not wrong" from the attitude expressed by "wrong" without collapsing back into realism. Gibbard's hyperplans help here, but critics argue he essentially smuggles in truth-conditions via the back door of "possible hyperplans."

  **Who Wins?**
  *   **Blackburn** is more honest about the deflation. He admits he is mimicking realism. His account is more flexible but less rigorous.
  *   **Gibbard** is more rigorous but risks becoming a realist in disguise. By formalizing plans so heavily, "accepting a norm" starts looking a lot like "believing a fact about norms."

  **Verdict for the Novel:**
  They founder on the same rock, but they dress the wound differently.
  *   Blackburn's wound is **pragmatic**: "We can't explain why logic binds us if it's just about feelings."
  *   Gibbard's wound is **semantic**: "We can't explain the content of the conditional without implicitly referencing truth-like conditions."

  ### 5. Drafting the Scene: Dialogue Hooks & Metaphors
  To make the technical disagreement palpable, give your characters distinct metaphors for the problem.

  **The Blackburnian Character (The Pragmatist):**
  *   **Metaphor:** "Logic is a web of commitments, Simon. When I accept that conditional, I'm not describing the world; I'm tying my own hands. I'm saying, 'I forbid myself from holding this fractured sensibility.'"
  *   **Attack on Gibbard:** "You're trying to build a calculus of plans, Allan. You're turning norms into ghostly facts. You say 'hyperplan,' I hear 'possible world.' You've sold out to the realists to save the logic."
  *   **Key Phrase:** "Fractured Sensibility."

  **The Gibbardian Character (The Formalist):**
  *   **Metaphor:** "It's not about feelings, it's about architecture. A hyperplan is a complete map of action. The conditional excludes certain routes on the map. Validity isn't psychology; it's the geometry of rational choice."
  *   **Attack on Blackburn:** "Your 'higher-order attitudes' are mush. You can't derive logic from sentiment. You need structure. You need to show that planning has the same logical skeleton as believing."
  *   **Key Phrase:** "Consistency of Planning States."

  **The Climax of the Argument:**
  The argument should stall on the **Negation Problem**.
  *   **Blackburn:** "Tell me, Allan, what attitude am I expressing when I say, 'If lying is *not* wrong...'?"
  *   **Gibbard:** "You are ruling out hyperplans that forbid lying."
  *   **Blackburn:** "And when I say 'If lying *is* wrong'?"
  *   **Gibbard:** "You are ruling out hyperplans that permit lying."
  *   **Blackburn:** "So the 'If' stays the same, but the 'ruling out' flips? Then the meaning of 'wrong' isn't stable in the embedding. And if the meaning isn't stable, your modus ponens is a sleight of hand."

  ### Summary for Your Notes
  1.  **Blackburn:** Conditionals express higher-order disapproval of inconsistent *attitudes*. Validity = Pragmatic consistency of sentiment.
  2.  **Gibbard:** Conditionals express constraints on *hyperplans* (maximal plans). Validity = Logical consistency of planning states.
  3.  **The Flaw:** Both struggle to prove that "inconsistency of plans/feelings" is the same thing as "logical invalidity." Both risk making logic psychological rather than objective.
  4.  **Character Dynamic:** Blackburn is the weary skeptic trying to save moral discourse; Gibbard is the engineer trying to rebuild it with stronger steel.

  This gives you a genuine technical conflict that reflects the actual state of metaethical debate, allowing your characters to be intellectually formidable while remaining stuck in their decades-long impasse.
