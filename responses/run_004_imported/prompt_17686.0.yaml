prompt: |-
  I am writing a novel centered on a decades-long, prickly friendship between two philosophers — both committed expressivists about morality — who have never managed to agree on how to answer the Frege–Geach problem. I want the argument I give them at a conference-hotel bar to rest on a genuine technical disagreement rather than a plausible-sounding fudge of my own invention, so I'd like to understand the terrain properly before I draft the scene. Please compare Simon Blackburn's quasi-realist strategy for handling embedded moral sentences with Allan Gibbard's norm-expressivist strategy, including his later appeal to "hyperplans" to fix normative content precisely. Concretely: what does each theory say is happening when someone accepts a sentence like "if lying is wrong, then getting your little brother to lie is wrong" without thereby asserting that lying is wrong? And in your own assessment, does either account give a more satisfying explanation of why the corresponding modus ponens is valid, or do the two of them ultimately founder on the same rock, just dressed differently?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A novel about two philosopher friends (expressivists) arguing about the Frege-Geach problem.
      *   **Task:** Compare Simon Blackburn's quasi-realism with Allan Gibbard's norm-expressivism (specifically including "hyperplans").
      *   **Specific Question:** What does each theory say is happening when someone accepts a conditional like "If lying is wrong, then getting your little brother to lie is wrong" without asserting the antecedent?
      *   **Evaluation:** Does either account explain the validity of modus ponens better, or do they founder on the same rock?
      *   **Tone:** Technical accuracy is paramount (for the novel's credibility), but accessible enough for the author to use in dialogue. Needs to capture the "prickly friendship" vibe implicitly by showing where the friction points lie.

  2.  **Deconstruct the Philosophical Terrain:**
      *   **The Core Problem (Frege-Geach):** Expressivism says moral sentences express non-cognitive attitudes (boo/hurrah, plans, norms). But moral sentences appear in unasserted contexts (conditionals, questions, negations). If "Lying is wrong" expresses *Boo lying*, what does "If lying is wrong..." express? It can't be *Boo lying* because I'm not booing lying in the antecedent. Furthermore, how is the inference valid? Validity usually requires truth-preservation. If moral sentences aren't truth-apt, how can logic apply?
      *   **Blackburn's Quasi-Realism:**
          *   *Goal:* Earn the right to talk *as if* moral judgments are truth-apt without actually believing they are.
          *   *Mechanism:* Higher-order attitudes. To accept the conditional is to have a higher-order attitude about the consistency of lower-order attitudes.
          *   *The Conditional:* Accepting "If P then Q" means I disapprove of the combination of attitudes: (Accepting P + Rejecting Q). It's a commitment to consistency.
          *   *Validity:* Validity is defined in terms of attitude consistency, not truth preservation. A valid argument is one where holding the premises' attitudes while rejecting the conclusion's attitude involves a pragmatic inconsistency (a "fractured sensibility").
      *   **Gibbard's Norm-Expressivism (Early vs. Late):**
          *   *Early (Wise Choices, Apt Feelings):* Moral judgments express acceptance of norms.
          *   *Late (Thinking How to Live):* Introduces "Hyperplans." A hyperplan is a complete, consistent plan for every possible contingency.
          *   *The Conditional:* To accept "If P then Q" is to rule out combinations of hyperplans. It's about the structure of planning states.
          *   *Validity:* Logic applies to plans just as it applies to beliefs. Inconsistency in planning is analogous to inconsistency in belief.
      *   **The "Rock" (The Embedding Problem/Wedgwood's Objection):**
          *   Both face the challenge of explaining *why* the inconsistency is logical rather than just psychological.
          *   The "Negation Problem" (Schroeder): Distinguishing between "not wrong," "wrong," and other attitudes.
          *   The specific issue for the novel: Does the explanation of *validity* hold up? Blackburn relies on a deflationary notion of truth. Gibbard relies on a formal semantics of planning. Both struggle to fully escape the charge that they are changing the subject from *logic* to *psychology*.

  3.  **Drafting the Comparison (Iterative Process):**

      *   *Introduction:* Set the stage. Acknowledge the stakes. The Frege-Geach problem is the expressivist's cross to bear.
      *   *Blackburn's Approach:* Focus on "commitments" and "higher-order attitudes."
          *   *Scenario:* "If lying is wrong, then getting brother to lie is wrong."
          *   *Explanation:* I'm not asserting lying is wrong. I'm expressing a stance against having the attitude "Lying is wrong" *without* having the attitude "Getting brother to lie is wrong." It's about the *coherence* of my moral sensibility.
          *   *Validity:* Modus ponens works because to accept the premises and deny the conclusion is to have a fractured sensibility (inconsistency in attitude).
      *   *Gibbard's Approach:* Focus on "norms" and "hyperplans."
          *   *Scenario:* Same conditional.
          *   *Explanation:* Moral judgments are plans. A hyperplan is a maximal plan. Accepting the conditional means ruling out hyperplans that forbid lying but permit inducing lying. It's a constraint on the *space of plans*.
          *   *Validity:* Logic governs consistency in planning. If you plan A, and plan "If A then B," failing to plan B is a planning inconsistency.
      *   *The Critical Assessment (The "Rock"):*
          *   Blackburn is often accused of "logical expressivism" – defining validity in terms of attitude consistency, which critics say isn't *real* validity (which needs truth conditions).
          *   Gibbard tries to formalize this with possible-worlds semantics for plans, but critics (like Schroeder) argue he still hasn't solved the "negation problem" or fully explained why planning inconsistency *is* logical inconsistency.
          *   *Verdict:* They founder on similar rocks (the nature of logical consistency), but Gibbard's later work is more formal/rigid, while Blackburn's is more pragmatic/deflationary. For a novel, Gibbard offers more "tech" (hyperplans), Blackburn offers more "temperament" (sensibility).

