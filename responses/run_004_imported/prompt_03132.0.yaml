prompt: |-
  I'm doing the historical throat-clearing lecture for my grad seminar on material constitution this week (statue and clay, ship of Theseus, all the standard coincident-object stuff), and I like to remind students the puzzle didnt spring fully formed out of Gibbard's 1975 "Contingent Identity" paper. So I assigned them the "Of Identity and Diversity" chapter from Locke's Essay for background, and now I've gone and gotten myself stuck on section 3, and want a sanity check before I stand up in front of everyone Thursday and say something dumb.

  Here's the passage, quoted in full so nothing's out of context:

  "From what has been said, it is easy to discover what is so much inquired after, the principium individuationis; and that, it is plain, is existence itself; which determines a being of any sort to a particular time and place, incommunicable to two beings of the same kind. This, though it seems easier to conceive in simple substances or modes; yet, when reflected on, is not more difficult in compound ones, if care be taken to what it is applied: v.g. let us suppose an atom, i.e. a continued body under one immutable superficies, existing in a determined time and place; it is evident, that, considered in any instant of its existence, it is in that instant the same with itself. For, being at that instant what it is, and nothing else, it is the same, and so must continue as long as its existence is continued; for so long it will be the same, and no other. In like manner, if two or more atoms be joined together into the same mass, every one of those atoms will be the same, by the foregoing rule: and whilst they exist united together, the mass, consisting of the same atoms, must be the same mass, or the same body, let the parts be ever so differently jumbled. But if one of these atoms be taken away, or one new one added, it is no longer the same mass or the same body. In the state of living creatures, their identity depends not on a mass of the same particles, but on something else. For in them the variation of great parcels of matter alters not the identity: an oak growing from a plant to a great tree, and then lopped, is still the same oak; and a colt grown up to a horse, sometimes fat, sometimes lean, is all the while the same horse: though, in both these cases, there may be a manifest change of the parts; so that truly they are not either of them the same masses of matter, though they be truly one of them the same oak, and the other the same horse. The reason whereof is, that, in these two cases -- a mass of matter and a living body -- identity is not applied to the same thing."

  What I can't settle is what that last sentence actually commits Locke to. My instinct, and what I told the class last time I taught this, is that he's already groping toward something like the modern constitution view -- the mass and the oak are two distinct, coincident things with different persistence conditions (the mass can't survive losing a particle, the oak survives losing tons of them), so strictly there's two objects stacked in the same place, not one. A colleague of mine who actually works on early modern stuff thinks that's just anachronistic, and that Locke's real view is closer to what Geach would later call relative identity: there's no absolute fact about whether the oak and the mass are "really" one thing or two, because "same X" only ever means something relative to a sort, and pushing for a headcount is a confusion Locke's already trying to head off, not a question he's answering. I can find sentences to back up either reading and now I've talked myself into a circle. Could you actually go through the passage closely (feel free to bring in what he says a few sections later about identity being "suited to the idea it is applied to") and tell me which reading the text better supports, or if there's some third option we're both missing -- and then say how each option would actually cash out if you tried to plug it into the current statue-and-clay literature (constitution-without-identity, coincident objects, relative identity, the whole menu)?
