answer: |-
  **MEMORANDUM**

  **TO:** Faculty Senate Governance Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** March 15, 2024
  **SUBJECT:** Recommendation on Proposed Entrenchment of Tenure Standards

  **Recommendation**
  I recommend that the Committee **return the proposal to the sponsors for redesign** rather than forwarding it in its current form or withdrawing it entirely. While the objective—stabilizing tenure standards against transient political pressures—is legitimate, the current mechanism fails to resolve the normative and practical objections raised regarding enforceability and intergenerational consent. However, these objections are not fatal to the concept of entrenchment itself. With specific structural modifications, we can construct a precommitment device that respects future faculty autonomy while providing meaningful stability.

  **1. The Enforceability Objection: Normative vs. Legal Authority**
  Our colleague's first point is legally correct but politically incomplete. She notes that the Handbook lacks court standing and that the Board of Trustees holds ultimate charter authority. A future Senate could theoretically ignore the entrenchment clause, and the Board could ratify that disregard without violating state law.

  However, treating the Handbook as merely a list of suggestions misunderstands the basis of shared governance. The Handbook's authority is not legal but *normative*. It functions as a social contract between the Faculty, the Senate, and the Administration. While a 2/3 vote cannot stop a determined Board from acting ultra vires, it significantly raises the *political cost* of doing so. By requiring a supermajority, we signal that these standards represent a deep consensus rather than a fleeting majority.

  To address the "dead letter" risk, the redesigned amendment should not claim to legally bind the Board. Instead, it should include a **procedural requirement for Board Concurrence**. Any motion to weaken tenure standards under the new rule would require not only the 2/3 faculty vote but also a formal acknowledgment from the Board that the vote meets the Handbook's entrenchment criteria. This forces the Board to explicitly choose between honoring the shared governance process or overriding it, making the latter a visible breach of trust rather than a procedural technicality.

  **2. The Legitimacy Objection: Binding the Future**
  The second objection is philosophically weightier. Jefferson's argument that "the earth belongs to the living" suggests that one generation cannot morally bind another to a settlement they did not negotiate. If we enact a permanent entrenchment clause, we treat future faculty (including those not yet hired) as subjects rather than citizens of the university. This turns a precommitment device (Ulysses tying himself to the mast) into a life sentence imposed on the crew.

  The counter-argument that "constitutions manage this" is only partially reassuring. National constitutions endure because they include amendment processes that allow future generations to consent to the arrangement anew. The current proposal fails because it creates a "lock-in" effect: it requires a 2/3 vote to weaken tenure standards *and* a 2/3 vote to repeal the entrenchment clause itself. This creates a double-lock that could render the policy immune to reasonable adaptation, violating the principle of intergenerational equity.

  To resolve this, the entrenchment must be **provisional rather than permanent**. We must distinguish between *binding* the future (illegitimate) and *creating a high-default barrier* that the future can lower if they actively choose to do so (legitimate).

  **3. Proposed Design Features for Redesign**
  To meet these objections on their own terms, I propose the sponsors revise the amendment to include the following three mechanisms:

  *   **A Sunset and Reauthorization Clause:** The entrenchment provision itself should expire after a fixed period (e.g., 10 years) unless reaffirmed by a majority vote of the full faculty. This solves the Jeffersonian problem. It ensures that every decade, the living faculty must actively vote to maintain these protections. If they do not, the default reverts to the standard amendment process. This transforms the clause from a "life sentence" into a renewable covenant.
  *   **Tiered Thresholds:** The current proposal applies the 2/3 threshold to both weakening standards and repealing the entrenchment clause. This should be decoupled.
      *   *Weakening Tenure Standards:* Requires 2/3 vote of the full faculty (preserves stability).
      *   *Repealing the Entrenchment Mechanism:* Requires a simple majority of the full faculty *plus* a 2/3 vote of the Senate. This makes it easier to change the *process* than the *substance*, ensuring that a future faculty is not trapped by a procedural mechanism they no longer trust, while still requiring broad Senate support to dismantle the protection.
  *   **Explicit Board Notification:** As noted above, the amendment should mandate that any vote to alter entrenched provisions triggers a formal review period with the Board of Trustees. This acknowledges the Board's charter authority while insisting that they exercise it only after confirming the Faculty has met its own high bar for consensus.

  **Conclusion**
  The political theorist is right that we cannot legislate for the dead, nor can we bind the living with paper threats. But we can invite the future to join us in a commitment that we make easy to renew and difficult to abandon by accident. By adding a sunset clause and tiered thresholds, we preserve the stability senior colleagues seek without imposing the illegitimacy of permanent rule. I move that we return the proposal to the sponsors with instructions to incorporate these design features before the April plenary.
