      *   *Key Nuance:* The role of **Background Knowledge ($k$)**. The paradox dissolves significantly when $k$ is included. Observing a red apple confirms "All ravens are black" *only if* you don't already know the object is an apple (and thus not a raven) before observing its color.

  5.  **Drafting the Response:**
