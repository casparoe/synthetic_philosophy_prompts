      *   **The Background Knowledge ($k$) Point:** This is crucial for teaching. The paradox assumes we learn *both* properties (non-black, non-raven) simultaneously. If we pick an object known to be non-black (e.g., a red thing), finding it's a non-raven is trivial. If we pick a non-raven (an apple), finding it's non-black is irrelevant to ravens. The confirmation only happens in a specific sampling context.
