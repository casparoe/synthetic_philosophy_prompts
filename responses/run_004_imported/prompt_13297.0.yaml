  9.  **Key Reference Check:** Hempel 1945. Good 1960 ("The White Shoe is a Red Herring"). Quine "Natural Kinds". Fitelson et al. on Bayesian solutions.

  10. **Final Polish:** Ensure I directly answer "Is that basically right, or have I gone wrong?" (Answer: You're right about Nicod, wrong that Bayesians concede the fiction, and Popper has his own costs).

  *(Self-Correction)*: I should make sure to mention that Hempel *himself* accepted the paradoxical conclusion. The user says "I've always presented the standard resolution as more or less settled." I need to inform them that Hempel didn't think it was a paradox to be dissolved, but a veridical paradox to be accepted. The "resolution" usually taught is the Bayesian one.

  *(Refining the "Relevance" point)*: The user worries relevance is a fiction. I need to emphasize that Bayesianism *defines* relevance as probability raising. The apple *does* raise the probability, just barely. So relevance isn't a fiction, it's a matter of degree. The *intuition* that it's irrelevant is the fiction (caused by ignoring base rates).

