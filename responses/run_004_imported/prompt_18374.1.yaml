prompt: |-
  I've followed the periodic threads on Astral Codex Ten and LessWrong about polygenic embryo screening for years, and now the question isn't academic: my partner and I are deciding whether to use it for our next IVF cycle. A friend who does philosophy for a living pointed out that our dilemma is a clean instance of Parfit's non-identity problem, and that the problem's bite here depends on something like Kripke's view of the necessity of origin -- that facts about which particular sperm and egg a person developed from are, if true at all, necessarily true of them, so that no one could have originated from different gametes and still been that same, numerically identical person. If that's right, then "selecting for a healthier child" isn't a case of making some existing possible child better off; it's a case of choosing which of several distinct possible children gets to exist at all. Please describe the most important implications of rigid designators and the necessary a posteriori, applied to personal origin in this way, for how my partner and I should think about the ethics of embryo selection -- and specifically for whether it should change how much weight we put on claims like "the selected embryo will have a better life than the alternative would have had."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Someone well-versed in the rationalist community (Astral Codex Ten, LessWrong), familiar with IVF/polygenic embryo screening (PES), and philosophically literate (references Parfit, Kripke, rigid designators, necessary a posteriori). They are facing a real-life decision (IVF cycle).
      *   **Context:** They are deciding whether to use PES. A philosopher friend has framed the decision using Parfit's Non-Identity Problem and Kripke's *Naming and Necessity* (specifically the necessity of origin).
      *   **Core Question:** What are the implications of Kripkean rigid designators and the necessary a posteriori (applied to personal origin) for the ethics of embryo selection? Specifically, does this change the weight given to claims like "the selected embryo will have a better life than the alternative would have had"?
      *   **Tone:** Intellectual, rigorous, empathetic but analytical, avoiding platitudes. Needs to bridge high-level metaphysics with practical bioethics.

  2.  **Deconstruct the Philosophical Framework:**
      *   **Kripke's Necessity of Origin:** A person essentially originates from the specific sperm and egg they did. If different gametes were involved, it would be a *different* person, not the same person with different traits.
      *   **Rigid Designators:** Proper names (or referring terms like "this embryo") refer to the same object in all possible worlds where that object exists. "Alice" refers to Alice in every world where Alice exists. There is no world where Alice originates from different gametes.
      *   **Parfit's Non-Identity Problem:** If an action (like selecting Embryo A over Embryo B) determines *who* comes into existence, then Embryo B cannot complain they were harmed by not being selected, because if they weren't selected, they wouldn't exist. The comparison isn't "Better off vs. Worse off" for the *same* person; it's "Person A exists vs. Person B exists."
      *   **The User's Dilemma:** Does this metaphysical truth undermine the utilitarian intuition that "we should choose the child with the better life"? If the unselected child never exists, are we harming them? If the selected child wouldn't exist otherwise, are we benefiting them?

  3.  **Identify the Ethical Implications:**
      *   *Implication 1: The "Harm" Principle shifts.* We aren't preventing harm to a specific identifiable future person (since the unselected one won't exist). We are comparing two different possible people.
      *   *Implication 2: The "Benefit" Claim shifts.* We aren't making a specific child "better off" than they otherwise would be. We are causing a specific child to exist who has certain traits, rather than causing a different child to exist.
      *   *Implication 3: Person-Affecting Views vs. Impersonal Views.*
          *   *Person-Affecting:* An act is wrong only if it makes someone worse off. Under Kripke/Parfit, PES doesn't make the unselected child worse off (they don't exist). So, is PES ethically neutral?
          *   *Impersonal (Total/average utility):* It's better if a happier person exists than a less happy person, even if they are different people.
      *   *Implication 4: The "Better Life" Claim.* The phrase "better life than the alternative would have had" becomes metaphysically slippery. The alternative *person* would have had a life. The selected *person* will have a life. We are comparing Life A vs. Life B, not Life A (selected) vs. Life A (unselected).

  4.  **Connect to the Practical Decision (IVF/PES):**
      *   Does this metaphysics change the *decision*?
      *   *Argument for "No Change":* Most parents operate on an impersonal view intuitively. "We want the child with the best chance of flourishing." The metaphysical identity of the child matters less than the outcome.
      *   *Argument for "Change":* It removes the guilt of "harming" the unselected embryos. It clarifies that you aren't playing God with *one* soul's fate, but choosing *which* soul enters the world. It might increase the weight of "procreative beneficence" (Savulescu).
      *   *Argument for "Caution":* If identity is tied to gametes, does screening (which might involve biopsy or selection based on genetic markers) alter the "essence"? (No, selection doesn't change origin, it chooses between origins).
      *   *The "Repugnant Conclusion" risk:* If we purely maximize utility across possible people, where does it stop? (eugenics concerns).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the question. Validate the friend's philosophical framing (it is indeed a textbook Non-Identity case). State the thesis: The metaphysics clarifies the *structure* of the choice but doesn't necessarily dictate the *value* judgment, though it shifts the moral burden from "harm avoidance" to "beneficence."

      *   *Section 1: The Metaphysics (Kripke & Origin).* Explain clearly but concisely. "You" are essentially tied to your specific gametes. Selecting Embryo A instead of Embryo B isn't changing A's properties; it's actualizing A instead of B.
      *   *Section 2: The Ethical Shift (Parfit).* Explain the Non-Identity Problem. The unselected embryo isn't "worse off." The selected one isn't "better off" than *they* would have been (they wouldn't have been).
      *   *Section 3: Implications for "Better Life" Claims.* This is the crux. The comparison changes from *intra-personal* (same person, different outcome) to *inter-personal* (different person, different outcome).
          *   *Person-Affecting Restriction:* If morality is only about affecting existing/identifiable people, PES is neutral.
          *   *Principle of Procreative Beneficence:* If morality includes bringing about the best states of affairs (including which people exist), then PES is obligatory (or at least strongly recommended).
      *   *Section 4: Practical Weight.* How should this affect the user's decision *now*?
          *   *Guilt:* Reduce guilt regarding unselected embryos. They aren't "victims."
          *   *Responsibility:* Increase responsibility for the traits of the child who *will* exist. You are choosing the parameters of a future person, not modifying an existing one.
          *   *Expectations:* Be careful not to view the selected child as a "product" optimized. They are a distinct person, not a version of a possible child that was improved.
      *   *Section 5: Limits of the Framework.* Don't let metaphysics swallow the human element. The "necessary a posteriori" is a modal claim, not a value claim. It tells us *what* is happening, not *what matters*.
      *   *Conclusion:* Summarize. The metaphysics dissolves the "harm" objection but heightens the "beneficence" question.

  6.  **Refining the Tone:**
      *   Avoid being too cold/calculating. This is a deeply personal decision.
      *   Ensure the distinction between "numerical identity" and "qualitative identity" is clear.
      *   Address the specific phrase: "the selected embryo will have a better life than the alternative would have had."
      *   *Correction/Nuance:* The phrase is technically true in an impersonal sense (Life A > Life B), but false in a person-affecting sense (Person A is not better off than Person A would have been). I need to make sure this distinction lands.

  7.  **Self-Correction/Edge Case Check:**
      *   *Did I address Rigid Designators?* Yes, need to ensure I explain that "Embryo A" designates the same entity across worlds, so it can't have different parents/genes in another world.
      *   *Did I address Necessary A Posteriori?* Yes, the fact that origin is necessary is known through empirical investigation (biology), not pure reason.
      *   *Is the advice actionable?* Yes, focus on how it reframes guilt and obligation.
      *   *Rationalist Context:* Use terms like "counterfactual," "modal realism" (lightly), "utility function." Acknowledge the ACX/LW context (e.g., mention Savulescu or the "Shulman" style arguments).

  8.  **Final Polish:** Check for clarity, flow, and empathy. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is a profound question that sits exactly at the intersection of modal metaphysics and applied bioethics. Your friend is correct: if you accept Kripke's thesis on the **necessity of origin**, your IVF decision is a textbook instance of Parfit's **Non-Identity Problem**.

  For a decision-maker in the rationalist tradition, the temptation is to treat this as a purely logical puzzle to be solved before acting. However, the implications of Kripkean metaphysics here do not necessarily tell you *what* to choose, but they radically alter *how you describe the choice* and where the moral weight rests.

  Here is an analysis of how rigid designators and the necessary a posteriori should inform your ethical framework for embryo selection, specifically regarding the claim that "the selected embryo will have a better life."

  ### 1. The Metaphysical Shift: Intra-personal vs. Inter-personal Comparison

  The core Kripkean insight is that proper names (and by extension, specific embryos) are **rigid designators**. "Embryo A" refers to that specific biological entity in every possible world where it exists. Crucially, Kripke argues that origin is essential to identity. There is no possible world where *you* originated from a different sperm and egg. If the gametes differ, the person differs.

  **The Implication:**
  When you select Embryo A (high polygenic score) over Embryo B (low polygenic score), you are not improving the lot of a specific child. You are not taking "Child X" and making them healthier. You are causing **Person A** to exist instead of **Person B**.

  *   **Standard Intuition:** "We are helping our future child avoid disease." (Intra-personal comparison: Same child, better outcome).
  *   **Kripke/Parfit Reality:** "We are causing a different person to exist who will not have that disease." (Inter-personal comparison: Different child, different outcome).

  **Impact on the "Better Life" Claim:**
  The statement *"The selected embryo will have a better life than the alternative would have had"* requires careful parsing.
  *   **True:** Life A (the life Person A will lead) has higher expected utility than Life B (the life Person B would have led).
  *   **False:** Person A is *better off* than Person A would have been otherwise. (Person A would not have been otherwise).
  *   **False:** Person B is *worse off* because they weren't selected. (Person B will never exist to be worse off).

  **Practical Takeaway:** You must abandon the framework of **harm avoidance** regarding the unselected embryos. You are not "harming" Embryo B by discarding it, because there is no subject to experience the harm. This should significantly reduce any guilt associated with the "loss" of unselected embryos. They are not victims; they are unactualized possibilities.

  ### 2. The Collapse of the Person-Affecting View

  Many intuitive moral systems rely on the **Person-Affecting Restriction**: *An act can only be wrong if it makes some particular person worse off.*

  Under the Kripkean view of origin, embryo screening renders the Person-Affecting Restriction inert. Since the unselected child never exists, they are not made worse off. If you hold strictly to person-affecting morality, embryo selection becomes morally neutral (neither good nor bad), because you haven't harmed anyone.

  However, most people (and most effective altruists/rationalists) find this conclusion unsatisfying. It implies that creating a child with a miserable, painful life is not wrong, provided that child wouldn't have existed otherwise (the "Happy Sadist" paradox).

  **The Implication:**
  To justify selecting the "healthier" embryo, you must adopt an **Impersonal View** (or a "Wide Person-Affecting View"). You must accept that it is better for *a happier person* to exist than *a less happy person*, even if they are numerically distinct individuals. This aligns with Julian Savulescu's **Principle of Procreative Beneficence**: couples have a moral reason to select the child, of the possible children they could have, who is expected to have the best life.

  **Practical Takeaway:** The metaphysical reality forces you to own the utilitarian calculus. You cannot hide behind "we aren't hurting anyone." You are actively choosing which consciousness to actualize. This increases the moral weight of the selection criteria. If you are going to play the "which possible person" game, you should ensure your utility function (what counts as a "better life") is robust.

  ### 3. Rigid Designators and Parental Expectations

  There is a psychological risk in ignoring the necessity of origin. If you view the embryo as a malleable project ("We are making a healthy baby"), you may develop expectations that the child *owes* you a return on that investment.

  If you internalize the Kripkean view, you recognize that **Embryo A is a distinct person with their own essential properties.** You did not *make* them healthy; you *selected* a person whose essential nature includes those genetic markers.

  **The Implication:**
  This distinction protects against a subtle form of parental entitlement.
  *   **Non-Kripkean View:** "We optimized you; therefore, you should thrive."
  *   **Kripkean View:** "You are who you are. We merely opened the door for *you* specifically, rather than someone else, to walk through."

  **Practical Takeaway:** Use this metaphysics to ground your parenting philosophy. The child you select is not a "version" of a child that was improved; they are a distinct individual. Their traits are not modifications you performed, but facts about their origin. This can help foster unconditional regard for the child, separating their existence from your selection criteria.

  ### 4. The "Necessary A Posteriori" and Uncertainty

  Kripke calls the necessity of origin a **necessary a posteriori** truth. It is necessary (metaphysically fixed) but known only through empirical investigation (biology/genetics).

  In IVF, your knowledge is probabilistic, not certain. You are selecting based on *predicted* phenotypes from genotypes.
  *   **Metaphysical Fact:** If Embryo A results in a child, that child essentially originates from Embryo A.
  *   **Epistemic Limit:** You do not know with certainty that Embryo A will result in the "better life" you predict.

  **The Implication:**
  The moral justification for selection rests on **expected utility**, not guaranteed outcomes. Because identity is fixed to the gametes, you cannot "fix" the child later if the prediction fails. You have actualized a specific person whose life trajectory is now independent of your selection logic.

  **Practical Takeaway:** Do not conflate the *selection* with the *outcome*. If the child develops health issues despite screening, the Kripkean view reminds you that this is not a "failure of the process" regarding *that* child. It is simply the life of the person you selected. The counterfactual ("If we had picked the other one...") refers to a *different person*, not a healthier version of *this* person. This can be a source of solace: you made the best decision based on available information to actualize the best possible person, but you are not responsible for the gap between prediction and reality in the way you would be if you were modifying an existing person.

  ### 5. Summary: How to Weight the "Better Life" Claim

  Does this change how much weight you put on the claim "the selected embryo will have a better life"?

  **Yes, but not by diminishing it. By clarifying its nature.**

  1.  **Discard the "Harm" Frame:** Stop worrying that you are harming the unselected embryos. The Non-Identity Problem solves this. They are not waiting in a queue to be born; they are merely possible worlds that remain unactualized.
  2.  **Embrace the "Beneficence" Frame:** Since you are choosing between possible people, the moral imperative shifts to **Procreative Beneficence**. The claim "Life A is better than Life B" becomes the *sole* moral currency. You are not balancing harm to B against benefit to A; you are simply comparing the value of Existence A vs. Existence B.
  3.  **Accept the Responsibility of Actualization:** Because origin is necessary, you are choosing the *essence* of the future person, not just their circumstances. This warrants a high degree of care in how you define "better life." Avoid narrow definitions (e.g., IQ only) and focus on robust well-being, as you are selecting a whole person, not a set of traits.
  4.  **Mitigate Regret:** If the selected child struggles, remember that the alternative was not *them* struggling less; it was *someone else* existing. This prevents the toxic counterfactual thinking ("If only we had picked the other one, *he* would be fine"). The "he" would not be here.

  ### Final Recommendation

  Your friend's philosophical framing is accurate, but it should not lead to paralysis. In the rationalist community, there is sometimes a fear that analyzing the map too closely prevents driving the car.

  The Kripkean/Parfitian view clears away the deontological fog (guilt about "discarding" potential lives) and leaves you with a clean utilitarian landscape. It suggests that if you believe one possible person is likely to have a significantly better life than another possible person, and you have the power to actualize the former, you have a strong moral reason to do so.

  **The weight of the claim "the selected embryo will have a better life" should increase, not decrease.** It is the *only* ethical justification you have left once you accept that you are not harming the unselected. Therefore, ensure your definition of "better life" is wise, broad, and humane. Then, proceed with the selection that maximizes that expectation, free from the metaphysical guilt of the non-identity problem.
