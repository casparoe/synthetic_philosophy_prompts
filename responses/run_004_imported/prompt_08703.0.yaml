          3.  Is the disagreement primarily about *normativity* (obligations/rights) or *ontology* (is there literally a "we")?
      *   **Tone:** Deep, philosophical, but accessible (given the bar story context). Needs to show expertise in collective intentionality literature.

  2.  **Deconstruct the Philosophical Positions:**

