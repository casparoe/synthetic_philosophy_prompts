answer: |-
  This is a fantastic bar fight to have. You and Dana accidentally stumbled into the central fault line of the philosophy of social action. The "walking together" example is indeed the *Drosophila melanogaster* of collective intentionality—everyone uses it because it's simple enough to isolate the variables but complex enough to reveal the metaphysics.

  You were arguing for **Margaret Gilbert's Plural Subject Theory**, and Dana was defending **Michael Bratman's Planning Theory of Shared Intention**.

  Here is the deep dive into what Gilbert thinks she has that Bratman lacks, how Bratman tries to mimic it without the metaphysical baggage, and whether this is actually a fight about reality (ontology) or rules (normativity).

  ---

  ### 1. Gilbert's Move: What Does "Joint Commitment" Add?

  Gilbert's core criticism of Bratman (and other individualists like Raimo Tuomela, in his earlier work) is that interlocking individual intentions are **cognitive**, but joint action is **normative**.

  If we go with Dana's (Bratman's) view, the situation looks like this:
  *   **You:** Intend that *we* walk together.
  *   **Dana:** Intends that *we* walk together.
  *   **Common Knowledge:** You both know the other intends this.
  *   **Meshing Subplans:** You aren't trying to walk to the park while she's trying to walk to the river.

  For Bratman, this is sufficient for "shared intention." But Gilbert asks: **Where is the glue?**

  #### The Unilateral Rescission Problem
  In Bratman's model, intentions are inherently individual. I can change my mind about an intention whenever I want (barring irrationality). If "walking together" is just two individual intentions, then logically, Dana should be able to change her mind, drop her intention, and speed up without any *structural* violation. She might be annoying, or unhelpful, but she hasn't violated the *jointness* of the action, because the jointness was just a sum of parts.

  Gilbert argues that when we walk together, **neither of us can unilaterally rescind the intention.** If I want to stop walking together, I can't just stop; I have to *ask you* if we can stop. If I just wander off, I haven't just changed a mental state; I've broken a bond.

  #### The "Standing to Rebuke"
  This leads to your intuition at the bar. You felt she *owed* you an explanation.
  *   **Bratman's explanation:** She frustrated your plan. You can complain pragmatically ("Hey, you messed up my expectation!").
  *   **Gilbert's explanation:** She violated a **joint commitment**.

  For Gilbert, a joint commitment is not a sum of personal commitments ("I commit to you" + "You commit to me"). It is a single commitment to which both parties are jointly bound as a **Plural Subject**.
  *   **Ontological Claim:** The subject of the intention is not "I" or "You," it is "We."
  *   **Normative Claim:** Because the commitment is joint, the obligations are not moral obligations (like a promise) but **sui generis** obligations intrinsic to the social act itself.

  So, what does Gilbert add that Bratman can't? She adds **mutual obligation as a constitutive feature.** For Gilbert, you aren't walking together *unless* you have created a structure where you are both obligated to each other to continue. If there's no obligation, it's just "walking near each other."

  ### 2. Bratman's Counter-Move: Normativity Without the "We"

  Bratman is a methodological individualist. He does not want to posit a "Plural Subject" or a "Group Mind." He thinks that's metaphysically spooky and unnecessary. His challenge is to explain why you felt entitled to rebuke Dana without admitting that a "We" exists.

  He has two main lines of defense to capture that "obligation" feel:

  #### A. Mutual Reliance and Interpersonal Norms
  Bratman argues that when I form a shared intention with you, I am inviting you to rely on me. I am saying, "I am going to be a stable partner in this plan."
  *   If I bail unilaterally, I violate a norm of **reliability**.
  *   This generates a "normative pressure." It's not that a mystical "We" is angry at me; it's that *I* have acted in a way that undermines *your* agency. I treated you as a mere object rather than a co-agent.

  Bratman distinguishes between the **psychological state** (Shared Intention) and the **normative consequences** (Obligations). He admits shared intention *often* leads to obligations, but he argues those obligations come from **moral principles** (like "don't disappoint those who rely on you") rather than the intention itself.

  #### B. The "Modest" Conception
  Bratman's best move is to argue that Gilbert is conflating **Shared Intention** with **Joint Commitment**.
  *   He would say: "You can share an intention without being fully bound."
  *   Example: Two strangers start walking in the same direction. They adjust their pace. They have a shared intention (Bratman style). But if one speeds up, the other doesn't feel *betrayed*, just inconvenienced.
  *   Bratman argues his theory covers the *spectrum* of joint action. Gilbert's theory only covers the high-stakes, obligation-heavy end (like a pact). Bratman claims the "walking together" case is low-stakes, so the "obligation" you felt was a moral overlay, not a structural necessity of the action itself.

  **So, Bratman captures the "rebuke" by saying:** You have the standing to rebuke Dana not because you are part of a "We," but because she violated a social-moral norm of responsiveness to a partner she invited to rely on her.

  ### 3. The Crux: Is it Ontology or Normativity?

  This is the million-dollar question. You asked whether the disagreement is secretly about whether there is literally a "we."

  **The short answer:** It is an ontological dispute driven by normative stakes.

  #### The Ontological Layer
  *   **Gilbert:** There is a **Plural Subject**. When we joint-commit, we create a new entity in the world (not a physical object, but a social reality). The "We" is the agent.
  *   **Bratman:** There are only **Individuals**. The "We" is a linguistic shorthand for "You and I, in a specific cognitive relation."

  #### The Normative Layer
  Why does the ontology matter? Because it determines the **source of the obligation**.
  *   **If Bratman is right:** The obligation is external. It comes from general morality (don't lie, don't disappoint). If I bail, I'm being a bit of a jerk morally.
  *   **If Gilbert is right:** The obligation is internal. It comes from the nature of the act itself. If I bail, I'm not just a jerk; I'm failing to be a participant in *this specific activity*.

  **The "Secret" Dispute:**
  The real fight is about **reducibility**.
  Bratman believes the normative force of joint action can be *reduced* to individual rationality + interpersonal morality. He thinks you don't need a new metaphysical category to explain why you were annoyed at Dana.
  Gilbert believes this reduction fails. She argues that individual morality explains why you should keep a *promise*, but it doesn't explain the specific feeling of **joint agency**. When you walk together, you aren't just two moral agents coordinating; you are a single unit of action. If you deny the "We," she argues, you can't explain why the *jointness* dissolves the moment one person bails without permission.

  ### Who Won the Bar Argument?

  **You (Gilbert) win on Phenomenology:**
  Your intuition at the bar was spot on. The feeling of "you can't just leave without checking" is the defining feature of joint action for most people. Gilbert captures the *experience* of social obligation better. She explains why "walking together" feels different from "walking side-by-side while hoping the other keeps up."

  **Dana (Bratman) wins on Parsimony:**
  Dana wins on metaphysical economy. She doesn't have to invent a "Plural Subject." She can explain the situation using standard tools of philosophy of mind (intention, belief, knowledge) plus standard ethics. If you are a naturalist who hates "spooky" social entities, Bratman is the safer bet.

  **The Verdict:**
  The disagreement is ultimately about **whether normativity requires a new ontology.**
  *   Gilbert says: **Yes.** To have genuine joint obligations, there must be a joint subject to whom those obligations are owed.
  *   Bratman says: **No.** Obligations are always between individuals; the "jointness" is just the content of their individual plans.

  If you want to tell Dana she "owed" you an explanation in a strong, structural sense, you need Gilbert. If you're willing to concede she just "should have been nicer" based on general moral norms of cooperation, Dana (Bratman) is right. Given that you felt a specific *joint* violation rather than just general rudeness, your philosophical instincts were Gilbertian.
