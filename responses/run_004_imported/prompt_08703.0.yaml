          *   *Mechanism:* It's not just "I intend" + "You intend." It's "We commit." This requires a process of expression and mutual acknowledgment.
          *   *Normativity:* The commitment *creates* obligations and entitlements. If I bail, I violate the commitment, giving you the *right* to rebuke me. It's not just a prediction failure; it's a normative failure.
          *   *Ontology:* Creates a "Plural Subject." The "we" is the subject of the intention. It's not reducible to the sum of parts.

      *   **Michael Bratman (Shared Intention/Planning Theory):**
          *   *Core Concept:* Shared Intention as Interlocking Individual Intentions.
          *   *Mechanism:* I intend that we J; You intend that we J; Common Knowledge; Meshing Subplans.
          *   *Normativity:* Bratman tries to derive normativity from the nature of *planning agency* and *mutual reliance*. If I bail, I frustrate your plan, which violates norms of consistency and stability inherent in agency. He often appeals to "mutual responsiveness" and social norms rather than a sui generis obligation.
          *   *Ontology:* Methodological Individualism. There is no "group mind." Only individuals intending things about the group.

  3.  **Address Question 1: Gilbert's "Add-On" (What does Joint Commitment do?):**
