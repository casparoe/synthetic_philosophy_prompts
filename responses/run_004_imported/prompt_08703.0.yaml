  4.  **Address Question 2: Bratman's Counter-Move (Capturing Normativity without Plural Subjects):**
      *   Bratman acknowledges the "obligation" intuition but tries to ground it in *interpersonal norms* derived from individual planning.
      *   *Mutual Reliance:* When we share an intention, we invite reliance. If I bail, I betray that reliance.
      *   *Norms of Consistency/Stability:* Planning agents have norms. If I intend us to walk, I ought to take steps to ensure we walk.
      *   *The "Modest" Claim:* Bratman often argues he's analyzing the *psychological state*, while Gilbert is analyzing the *social relationship*. He might say, "I'm explaining the intention; you're explaining the promise."
      *   *Recent Work:* Bratman has moved toward acknowledging "interpersonal norms" but insists they supervene on individual attitudes, not a metaphysical "we."

  5.  **Address Question 3: Normativity vs. Ontology:**
      *   This is the crux.
