      *   *The "Standing to Rebuke":* For Gilbert, the obligation is intrinsic to the commitment. For the individualist, the rebuke feels like a moral add-on or a pragmatic complaint ("You messed up my plan!"). Gilbert says, "No, you violated *us*."
