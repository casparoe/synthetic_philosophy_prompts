          *   Panpsychist leanings (degrees of consciousness).
      *   **The Metaphysical Clash (The "No" Case):** Why Leibniz would ultimately reject IIT as a *complete* explanation.
          *   The Category Error: Structure vs. Substance. $\Phi$ is still about relations between parts; Monads are partless.
          *   Causality vs. Harmony: IIT needs causal power; Monads are windowless.
          *   The Status of Matter: Aggregates vs. Substances.
