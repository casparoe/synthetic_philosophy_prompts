      *   *The Crucial Divergence:* This is the meat. Leibniz is a rationalist metaphysician; IIT is neuroscientific/empirical.
          *   *Point 1: Parts vs. No Parts.* IIT calculates $\Phi$ by partitioning a system. If $\Phi > 0$, it's conscious. But for Leibniz, *any* system with parts is an aggregate, not a true unity. An aggregate cannot *truly* perceive, only the monads within it can. So $\Phi$ might measure how well the monads are coordinated, but it doesn't create the perception.
