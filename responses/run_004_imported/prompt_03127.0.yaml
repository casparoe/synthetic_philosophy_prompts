          *   *Point 3: Panpsychism.* IIT implies simple systems (photodiodes) have tiny $\Phi$. Leibniz believes in *petites perceptions* everywhere. This is a strong overlap. But for Leibniz, the photodiode is an aggregate of infinite monads, each with its own perception. IIT sees the *system* as having one $\Phi$.
      *   *The Exclusion Rule:* IIT says only the maximum $\Phi$ complex exists consciously. Leibniz has the "Dominant Monad" (the soul) ruling the body (aggregate of other monads). This is a fascinating parallel. The body's monads have low-level perception; the soul has apperception.
      *   *Final Verdict:* He would admire the math but reject the ontology. He'd say IIT describes the *phenomena* of the mill perfectly but misses the *noumena* (the monads).

