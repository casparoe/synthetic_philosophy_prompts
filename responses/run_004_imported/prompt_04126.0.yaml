      *   *The "Slippery Slope":* If God accommodates idolatrous practices, where does it stop? Does this imply God compromises His own perfection to suit human frailty?
      *   *Emotional Angle:* The Hazzan feels the *loss* of the Temple. Maimonides' intellectualization might feel cold. "You're telling me God let us kill animals just because we were too stupid to pray properly?"

