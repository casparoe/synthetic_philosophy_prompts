answer: |-
  This is a fascinating ethical and social dilemma, particularly for someone trained in social psychology. You are essentially wrestling with the tension between **normative ethics** (what is objectively right regarding the violation) and **social perception/moral psychology** (how the messenger impacts the message).

  Given your background, I will frame this using concepts relevant to our field: standing to blame, norm enforcement, moral credentialing, and group dynamics.

  Here is an analysis of whether your reaction is defensible and how to weigh Maya's "right" to speak up against her history.

  ### 1. The Ethical Baseline: Did she have the "right"?
  From a strictly deontological or institutional integrity standpoint, **yes, Maya had the right (and perhaps a duty) to call out the violation.**

  *   **The Truth Value:** Daniel's action was objectively a breach of integrity. The validity of the accusation does not depend on the accuser's history. If we required accusers to be sinless, no one could ever enforce norms.
  *   **Reformation:** Maya is not currently engaging in the behavior. She has been "scrupulous ever since." In restorative justice models, a reformed individual is often viewed as a valuable agent of change because they understand the temptation and the consequences.
  *   **Collective Responsibility:** In a lab setting, members are stewards of the group's reputation. Allowing CV fabrication to go unchallenged harms the lab's credibility.

  If we look only at the *act* of enforcement, Maya is in the clear. However, your discomfort suggests you are reacting to the *social dynamics* of the enforcement, not just the enforcement itself.

  ### 2. Why Your Reaction is Defensible (The Social Psych Perspective)
  Your feeling that "something is off" is not merely a gut reaction; it aligns with several established psychological concepts regarding moral judgment and group dynamics.

  **A. The "Standing to Blame" (Moral Standing)**
  Philosophers and psychologists debate whether past wrongdoers lose the *standing* to blame others for similar transgressions.
  *   **The Tu Quoque Heuristic:** Even if logically fallacious, humans intuitively perceive hypocrisy as undermining moral authority. If the lab *knew* Maya's history, her sharpness might be interpreted as projection or overcompensation rather than principled integrity.
  *   **Information Asymmetry:** You possess information the group does not. This creates cognitive dissonance. You see the "hypocrite" (in the historical sense), while the group sees the "vigilante." Your discomfort is the result of holding two conflicting models of Maya simultaneously.

  **B. Moral Credentialing vs. Genuine Reform**
  You mentioned Maya was "sharp." This is a key variable.
  *   **Moral Credentialing:** Sometimes, individuals who have secured their moral self-concept (e.g., "I am reformed") feel licensed to be harsher on others to reinforce that identity.
  *   **Overcompensation:** In social psych, we know that individuals who are insecure about a specific trait often police that trait most aggressively in others. Maya's sharpness might stem from her own unresolved shame or a desire to distance herself from her past self. If her motivation is self-protection rather than community care, the *function* of her call-out changes, even if the *content* is correct.

  **C. Norm Enforcement and Psychological Safety**
  How norms are enforced matters as much as the norm itself.
  *   **Public vs. Private:** A "sharp call-out" in a meeting is a public shaming mechanism. If Maya had approached Daniel privately, your discomfort might be lower. Public enforcement by someone with a secret history can feel like a performance of purity.
  *   **The "Clean Hands" Bias:** Groups generally trust enforcers who appear to have "clean hands." While Maya *is* currently clean, the secret history means her enforcement lacks transparency. If that history ever came out, it could cause a retroactive collapse of trust in her judgment and the lab's handling of the incident.

  ### 3. Synthesis: Is she the "wrong person"?
  She is not the *wrong person* in terms of **validity**, but she might be the **suboptimal messenger** in terms of **social cohesion**.

  *   **Validity:** She is correct. Daniel lied.
  *   **Optimality:** Because she carries the hidden baggage of the same sin, her enforcement carries a hidden cost. If her sharpness was driven by her own past trauma regarding the issue, it may have been disproportionately harsh, potentially damaging Daniel's rehabilitation (which she presumably benefited from).

  Your reaction is defensible because you are intuitively sensing the **fragility of the situation.** You recognize that Maya's moral authority is contingent on a secret. If that secret leaks, the narrative flips from "Maya defended integrity" to "Maya projected her guilt." That instability is what feels "off."

  ### 4. Recommendations for You
  As a PhD student in the same lab, you are in a delicate position.

  1.  **Do Not Out Maya:** Her reformation is a private success story. Revealing it would punish her for past growth and likely destroy lab trust. It would also shift the focus from Daniel's lie to Maya's history, which helps no one.
  2.  **Reframe Your Discomfort:** Instead of viewing your feeling as "Maya is a hypocrite," view it as "Maya may be over-invested in this specific norm due to personal history." This allows you to acknowledge the complexity without dismissing her current integrity.
  3.  **Observe the Aftermath:** Watch how the lab integrates Daniel. Did Maya's call-out lead to correction and learning, or just shame? If Daniel is supported and corrects the CV, the outcome is positive regardless of the messenger. If he is ostracized, Maya's method (perhaps influenced by her past) may have been too aggressive.
  4.  **Consider the "Sharpness":** If you have a relationship with Maya, you might eventually (much later) gently discuss norms of feedback. *"I've been thinking about how we handle integrity issues; I wonder if private correction is sometimes more effective than public call-outs."* This addresses the *method* without touching the *secret*.

  ### Conclusion
  Maya had the **moral right** to speak up. Academic integrity relies on peers holding peers accountable, and her reformation makes her a valid member of that peer group.

  However, your reaction is **psychologically defensible**. You are detecting the tension between *objective truth* and *moral standing*. You are sensing that while her words were true, her position was complicated by a hidden vulnerability. You don't need to resolve this tension by deciding she was "wrong." You can hold the nuance: She did the right thing, for potentially complex reasons, in a way that felt socially fraught to the one person who knows the full story.

  In our field, we know that behavior is a function of the person and the environment ($B = f(P, E)$). Maya's behavior was correct for the Environment (lab integrity), but perhaps heavily weighted by the Person (her history). Acknowledging that complexity is a sign of your own maturation as a social psychologist.
