      *   **Situation:** Labmate (Maya) called out another labmate (Daniel) for academic misconduct (listing a non-existent talk on CV). Maya previously committed the same misconduct, was caught, reformed, and kept it secret (except from the user). Daniel's misconduct is real. Maya's call-out was factually accurate.
