answer: |-
  Here is a definitive argument taking the side of **Frederick Douglass**. This is structured to help you organize your paper, with a clear thesis, specific analysis of the clauses, and a defense of his interpretive method.

  ### Thesis Statement
  While William Lloyd Garrison's historical assessment of the Framers' intentions was accurate, Frederick Douglass's textual interpretation of the Constitution is the superior and more defensible political argument. Douglass correctly identifies that a founding document must be judged by its operative legal text and its capacity to secure justice, rather than the private compromises of its authors. His "presumption of liberty" is not merely motivated reasoning; it is a legitimate legal hermeneutic that transforms the Constitution from a static historical contract into a dynamic tool for emancipation.

  ### 1. The Textual Defense: Analyzing the Three Clauses
  Garrison argued that the Constitution was pro-slavery because it accommodated slaveholders. Douglass countered that accommodation is not endorsement. When read strictly, the text never explicitly sanctions slavery.

  *   **The Three-Fifths Clause (Article I, Section 2):** Garrisonians argued this dehumanized Black people by counting them as fractions. Douglass flipped this: the Constitution never uses the word "slave." It refers to "persons." If enslaved people were legally considered mere property (as Southern law claimed), they should not be counted for representation *at all*. By counting them as three-fifths of a person, the Constitution implicitly acknowledges their humanity. Furthermore, Douglass argued this was actually a penalty on the South. If slaves were counted as full persons, Southern representation would increase; if counted as zero, Southern tax burden might shift. The 3/5 compromise limited the political power of the slave states compared to if their enslaved population had been fully counted for representation. It was a check on slave power, not a boost.
  *   **The Fugitive Slave Clause (Article IV, Section 2):** This requires the delivery of "persons held to service or labor." Garrison saw this as a mandate to return runaways. Douglass pointed out that the text does not say "slaves." "Persons held to service" applies equally to indentured servants and apprentices in the North. Crucially, the text says these persons shall be delivered up on claim of the party to whom such service is due. It does not specify *who* must enforce this. Douglass argued there is no federal enforcement mechanism written into the text; it relies on state cooperation. Therefore, the Constitution does not require the federal government to act as slave-catchers, leaving room for Northern states to refuse cooperation (as they later did with Personal Liberty Laws).
  *   **The 1808 Migration/Importation Clause (Article I, Section 9):** This prohibited Congress from banning the "Migration or Importation" of persons until 1808. Garrison saw this as a 20-year protection of the slave trade. Douglass argued the opposite: it is a limitation. By setting a date, the Constitution explicitly empowered Congress to ban the trade after 1808. A document intended to protect slavery permanently would not have included an expiration date on the trade. The text looks forward to abolition of the trade, not the perpetuation of it.

  ### 2. The Interpretive Principle: Presumption of Liberty
  Your roommate argues Douglass's reading is "motivated reasoning"—that he changed his mind only because he needed a political strategy after breaking with Garrison. While the political break certainly prompted the re-evaluation, the legal principle Douglass adopted is sound and not inherently dishonest.

  Douglass relied on a canon of legal construction often called the **"Presumption of Liberty."** The principle states: *When a legal text is ambiguous, and one reading supports oppression while another supports freedom, the reading that supports freedom must be chosen.*

  *   **Why this is legitimate:** In a republic founded on the premise of natural rights (as stated in the Preamble's "secure the Blessings of Liberty"), the law should not be read to authorize tyranny unless it does so in explicit, undeniable language. Slavery is a violation of natural rights. Therefore, for the Constitution to sanction slavery, it must do so plainly. Since the words "slave" or "slavery" appear nowhere in the document, the burden of proof lies on the Garrisonians to show that "persons" *must* mean "slaves." Douglass correctly argues that ambiguous language cannot be used to strip human beings of their rights.
  *   **Why Garrison is wrong here:** Garrison relied on "Original Intent" (what the Framers secretly wanted) rather than "Original Meaning" (what the text actually says). In political thought, the authority of a constitution lies in its enacted text, which becomes the law of the land, not in the private diaries or closed-door compromises of the men who wrote it. If we govern ourselves by the secret intentions of the dead rather than the public text we live under, democracy becomes impossible. Douglass recognized that the Constitution belongs to the living, not the dead.

  ### 3. Why Douglass's Side is Superior (The "So What?")
  Ultimately, you must judge these theories by their political consequences.
  *   **Garrison's Consequence:** Moral Purity but Political Impotence. If the Constitution is pro-slavery, the only moral action is to reject the government (no voting, no office). This leaves the slave system intact because it abandons the machinery of the state to the slaveholders.
  *   **Douglass's Consequence:** Political Engagement and Emancipation. If the Constitution is anti-slavery, then voting, holding office, and using federal power are moral duties. This view empowered the Republican Party and provided the legal justification for the Civil War amendments.

  Garrison was right about the *past* (the Framers compromised), but Douglass was right about the *future* (the text allows for freedom). In American Political Thought, the utility of an idea is measured by its capacity to organize society toward justice. Douglass's reading allowed for the destruction of slavery; Garrison's reading only allowed for protest against it.

  ### Conclusion for Your Paper
  You should conclude that Douglass's break with Garrison was not an act of hypocrisy, but an evolution from moral absolutism to political realism. His textual reading is defensible because it adheres to the rule of law: statutes and constitutions should be read to maximize liberty unless they explicitly mandate oppression. By fixing his eyes on the text's potential rather than the Framers' prejudices, Douglass unlocked the constitutional power necessary to end slavery, proving that his interpretation was not just wishful thinking, but a more potent instrument of justice.

  ***

  **Note for your writing:** Since your professor docks points for wishy-washiness, ensure your topic sentences are strong. Instead of saying "Douglass argues that...", say "Douglass correctly demonstrates that..." or "Garrison's interpretation fails because..." Keep the focus on the *text* vs. *intent* distinction, as that is the core theoretical conflict.
