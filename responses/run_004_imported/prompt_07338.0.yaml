      *   Concrete timeline? Yes (Phased).
      *   Weight to losing side? Yes (Collusion risk gets significant space and drives the conditions).
      *   Specific reasoning? Yes (Audit ports, domain separation).

  *(Self-Correction on Tone)*: The prompt implies *I* am the one writing the memo as the panel member assigned the pen. So it should reflect the panel's consensus but written by me. I will adopt the voice of the Panel Chair/Secretary as requested ("draft the panel's decision memo").

