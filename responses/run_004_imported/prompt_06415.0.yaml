answer: |-
  This is a profound and deeply human dilemma, and it places you in excellent company. The tension you are describing is not merely a personal anxiety; it is one of the central problems of modern moral philosophy. Given that you are studying Victorian moral philosophy, you are actually standing on ground trodden by some of the most rigorous minds of that era, most notably **Henry Sidgwick**.

  To answer your questions directly: Your worry is philosophically legitimate; your coursemate is partially right about the epistemic tension but perhaps too harsh about the incoherence; and your proposed empirical solution, while historically understandable, faces significant philosophical and evidentiary hurdles.

  Here is a breakdown of the issues at play.

  ### 1. Is your worry legitimate?
  **Yes.** You have identified what Henry Sidgwick, in *The Methods of Ethics* (1874), called the **"Dualism of Practical Reason."**

  Sidgwick, a quintessential Victorian moral philosopher and a secular thinker, argued that there are two equally rational methods of deciding what to do:
  1.  **Rational Egoism:** It is rational to pursue your own greatest happiness.
  2.  **Rational Benevolence (Utilitarianism):** It is rational to pursue the general good.

  Sidgwick could find no logical way to reconcile these two if they conflicted. If I can secure my own immense happiness by committing a secret injustice that harms the general good, Rational Egoism says "do it," while Rational Benevolence says "don't." Without a divine guarantee that virtue will ultimately be rewarded (in an afterlife), Sidgwick feared that morality might not be *rationally binding* on the self-interested agent.

  So, your worry is not a confusion; it is a recognized aporia (a puzzle with no clear solution) in ethical theory. You are asking whether morality is *categorical* (binding regardless of interest) or *hypothetical* (binding only if it serves your interest). If this life is all there is, the "Foole" (as Hobbes called him) who asks "Why should I be just if I can get away with injustice?" has a strong case.

  ### 2. Is your coursemate right about inconsistency?
  **She is right about the epistemic standards, but wrong about the incoherence.**

  *   **Where she has a point:** If you abandoned religious belief because the evidence for God was insufficient, turning to parapsychology (NDEs, mediums) risks applying a *lower* standard of evidence to a similar claim. Historically and scientifically, the evidence for survival of consciousness via séances or NDEs is generally regarded as weaker and more ambiguous than the theological arguments you likely rejected. If you require robust empirical proof for religion, you should require it here, too.
  *   **Where she is too harsh:** It is not logically *incoherent* to investigate. You are not claiming to believe; you are claiming to search for a premise that would solve a philosophical problem. It is a desperate heuristic, not necessarily a contradiction. However, it does suggest a form of **motivated reasoning**: you are hoping for a specific outcome (evidence of an afterlife) to solve a moral problem, rather than following the evidence wherever it leads.

  ### 3. Is empirical investigation a sensible way to address this?
  **Philosophically, this strategy is risky for two reasons.**

  **A. The Epistemic Problem**
  As noted above, if your departure from religion was based on evidentialism (believing only what is supported by evidence), you will likely find the evidence for an afterlife via paranormal research even less convincing. The Victorian era saw a massive surge in **Spiritualism** precisely for the reason you describe: as traditional faith waned, people wanted *empirical* proof of spirit to ground their morality. Figures like Alfred Russel Wallace investigated this seriously. However, the movement largely collapsed under scrutiny due to fraud and lack of replicability. If you go down this road, you may find your moral foundation resting on even shakier ground than before.

  **B. The Conceptual Problem (The Kantian Objection)**
  This is the more serious philosophical objection. Let's assume you *did* find proof of an afterlife where justice is rewarded.
  *   If you act justly *because* you know you will be rewarded (or punished) in the next life, are you acting morally?
  *   Immanuel Kant would say **no**. You would be acting out of **prudence** (enlightened self-interest), not duty.
  *   If the only reason to be just is that "it pays off in the end," then justice is no longer a moral virtue; it is a calculation. You haven't solved the problem of why a self-interested person should be moral; you have simply expanded the timeline of their self-interest.
  *   The moral intuition you hold ("people have decisive reason to act justly even at serious cost") suggests you value morality for its own sake. Proving an afterlife might actually undermine that value by turning morality into a transaction.

  ### 4. The Victorian Context and Sidgwick's Solution
  Since you are in a Victorian seminar, it is worth noting how Sidgwick handled this. He shared your worry. He even became the first president of the **Society for Psychical Research**, hoping to find empirical evidence for survival that would reconcile duty and self-interest.

  He ultimately found the evidence inconclusive. So, how did he live with the Dualism of Practical Reason?
  1.  **He admitted the conflict:** He acknowledged that without God, we cannot *prove* that morality is always in our self-interest.
  2.  **He chose Morality anyway:** He argued that the moral imperative is more authoritative than the egoistic one. We must simply accept that the universe might not be structured to reward us, but the demand of conscience remains.
  3.  **The "Fundamental Intuition":** He suggested that we simply *see* that we ought to pursue the good, and that intuition is as valid as the intuition that we ought to pursue our own good. We cannot prove one overrides the other, but we can choose to align ourselves with the moral one.

  ### 5. Alternative Paths
  If you want to maintain that justice is rational without an afterlife, you might look into secular frameworks that attempt to bridge this gap without paranormal evidence:
  *   **Kantian Constructivism:** Argues that rationality *itself* commits you to moral laws, regardless of consequences. To be rational is to be moral.
  *   **Virtue Ethics (Aristotelian):** Argues that injustice damages the agent's character, making true happiness (*eudaimonia*) impossible, even if they escape external punishment.
  *   **Scanlon's Contractualism:** Argues that we have reason to act justly because we cannot reasonably reject the principles that govern our relations with others.

  ### Conclusion
  Your coursemate is correct that relying on paranormal evidence after rejecting religious evidence creates an epistemic tension, but she is wrong to dismiss your worry as incoherent. Your worry is the defining problem of secular ethics.

  However, seeking an empirical "fix" via parapsychology is likely to fail both scientifically (the evidence is poor) and philosophically (it reduces morality to prudence). The harder, but perhaps more honest, Victorian path is the one Sidgwick ultimately took: acknowledging that we cannot *prove* the rational egoist is wrong, but affirming our commitment to justice anyway, not because the universe guarantees a reward, but because we recognize the authority of the moral claim itself.

  You are grappling with the cost of intellectual honesty. That is not a sign of inconsistency; it is a sign of philosophical seriousness.
