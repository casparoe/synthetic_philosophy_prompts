answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Sister's Name]'s older sibling.

  We are here to mark five years. In the grand scheme of a lifetime, five years can pass in a blink. But in the context of what we're celebrating tonight, five years is an eternity. It is roughly 1,800 days. It is thousands of moments where a different path was available, and thousands of decisions to stay on this one.

  I know there are people in this room who understand the specific geography of this journey better than others. And there are others here, like me, who have only watched from the shore. But we all share the same gratitude: that [Sister's Name] is here, healthy, and whole.

  When [Sister's Name] first got sober, she taught our family a new language. She taught us that addiction is not a moral failing. It is a condition. It is something that happens *to* a person, not something a person *is*. She learned that she was powerless over the drink, and accepting that truth saved her life. It removed the shame that kept her drinking. I honor that. I honor the wisdom of this room that taught her she didn't have to carry the blame for getting sick.

  But there is a second truth she has taught me, often with a bit of fire in her eyes. She hates it when people call her "lucky." She hates it when people say the disease just "let go." She has told me, repeatedly, that while she didn't choose the struggle, she damn well chose the solution.

  For a long time, I wondered how to hold those two truths in my head at once. How can you be blameless for the addiction, but praiseworthy for the sobriety? If the brain is the engine for both, isn't it all just biology? Isn't it all just luck?

  But then I watched her.

  I realized that we don't credit a sailor for the wind. The wind is luck. The wind is chance. Sometimes it blows you toward the rocks; sometimes it fills your sails. [Sister's Name] didn't choose the wind that blew her into the storm five years ago. We aren't here to praise her for the weather.

  We are here to praise her for the steering.

  The urge to drink might be unchosen. It might arrive like a wave, automatic and biological. But the response to that wave? That is hers. The work of building a life so rich that the drink doesn't fit in it anymore? That is hers. The humility to ask for help, the discipline to show up, the courage to sit with discomfort instead of numbing it? That is all her.

  There is a profound difference between the *cause* of a problem and the *authorship* of the solution. She did not author the disease. But she is the sole author of this recovery.

  To the members of her recovery group: Thank you for teaching her that she wasn't broken beyond repair. You gave her the map.
  To my family: Thank you for loving her through the years we didn't have a map.
  And to [Sister's Name]:

  You have proven that freedom isn't about never feeling a constraint. Freedom is about who you choose to be within them. You didn't choose the hand you were dealt, but you have played it with a mastery that inspires every single person in this room.

  You deserve the credit. Not because you're perfect, but because you are persistent. Not because you're lucky, but because you are willing.

  So, if everyone could please raise a glass.

  To [Sister's Name]. May you continue to trust the process, own your power, and know that while you didn't choose the fight, we are all so proud that you chose to win.

  To five years.
