prompt: |-
  My younger sister will be five years sober next month, and she's asked me to give the toast at the small family dinner we're having afterward. She has always described her addiction the way her recovery group taught her to: a disease she never chose and isn't morally responsible for. That framing kept her alive, and I don't want to undercut it in front of the people from her group who will be there. But she has also told me, more than once, that it infuriates her when people credit her sobriety to luck, or say the disease "finally loosened its grip," as though the person who spent five years deliberately choosing not to pick up a drink had nothing to do with it. She wants real credit for that. I've been reading about compatibilism on my own, because I can't work out whether she's actually entitled to both claims at once: that the addiction wasn't hers to be blamed for, and the recovery is hers to be praised for, when, as far as I can tell, both trace back to things she never chose in the first place. Roughly half the guests will be from her recovery group, the rest relatives who have never given any of this a moment's thought and just want to hear that she's strong. Could you write the toast? It should run about five minutes, actually resolve that tension rather than talk around it, and still sound like a toast and not a philosophy lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** 5-year sobriety anniversary dinner.
      *   **Speaker:** Older sibling (brother/sister).
      *   **Audience:** Mixed group (50% recovery group members, 50% general family/friends).
      *   **Key Constraint 1 (The Tension):** The sister holds two seemingly contradictory views:
          1.  Addiction is a disease/not her fault (necessary for her recovery/self-compassion).
          2.  Sobriety is her achievement/her choice (necessary for her agency/pride).
      *   **Key Constraint 2 (The Philosophy):** The user has been reading about *compatibilism* (the idea that free will and determinism can coexist) and wants the toast to *resolve* this tension, not just gloss over it, without sounding like a philosophy lecture.
      *   **Key Constraint 3 (Tone):** Warm, celebratory, respectful of the recovery community's language, but also acknowledging her effort.
      *   **Length:** About 5 minutes spoken (roughly 600-750 words).

  2.  **Deconstruct the Philosophical Tension (Compatibilism in this context):**
      *   *The Problem:* If addiction is a disease (deterministic cause), how can recovery be a choice (free will)? If recovery is just biology changing, why praise her? If it's all choice, why excuse the addiction?
      *   *The Compatibilist Solution:* Freedom isn't about the *origin* of your desires or constraints; it's about your ability to act in accordance with your values *despite* those constraints.
      *   *Application to Toast:* We don't praise the seed for sprouting (biology), but we praise the gardener for tending it (agency). Or, better: We acknowledge the storm (addiction) wasn't chosen, but steering the ship through it (sobriety) required skill and will.
      *   *Crucial Nuance:* The toast needs to validate the "disease" model for the recovery group (no shame) while validating the "effort" model for the sister (no luck).
      *   *Phrasing:* Avoid "loosened its grip" (passive). Use "she loosened her grip" or "she held on." Avoid "lucky." Use "committed."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the milestone (5 years). Set a warm tone.
      *   **Addressing the Addiction (The "Not Her Fault" part):** Need to validate the disease model without making her a victim. Use the language the recovery group understands (illness, condition) but frame it as the *starting point*, not the whole story.
      *   **Addressing the Sobriety (The "Her Choice" part):** This is the crux. How to credit her? Focus on the *daily* nature of it. It's not one big choice; it's thousands of small ones. This bridges the gap. The disease might dictate the urge, but *she* dictates the response.
      *   **Resolving the Tension (The Compatibilist Core):** How to say "You didn't choose the hand, but you played it masterfully" without sounding cliché?
          *   *Idea:* Distinguish between *cause* and *response*.
          *   *Idea:* Acknowledge that the *capacity* to recover might have been luck/genetics/support, but the *execution* was her.
          *   *Refinement:* Let's focus on the concept of "ownership." She doesn't own the disease, but she owns the recovery. Why? Because recovery requires alignment with her deeper self.
      *   **Closing:** Raise a glass. Wish for the future.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. 5 years is huge. Some of you know the struggle. She says addiction isn't her fault. I agree. It's a sickness. But she gets mad when people say she's just lucky. She worked hard. So how is it both? Well, you don't choose to get sick, but you choose to take medicine. She took the medicine every day. That's hard. So let's toast to her health and her will.

      *Critique 1:* Too simple. Doesn't really resolve the tension philosophically. Sounds a bit like a lecture on medicine. Needs more emotion and specific phrasing to satisfy the "compatibilism" requirement without using the word.

  5.  **Drafting - Iteration 2 (Adding Depth):**
      Welcome. 5 years. There's a puzzle here. She says "I didn't choose this disease." But she also says "I chose this life." Some people think that's contradictory. If the brain was broken then, isn't it the same brain now? But I've watched her. The urge might be automatic, but the action isn't. The disease speaks, but she decides whether to listen. That's where the credit lies. Not in the absence of the urge, but in the presence of the choice.

      *Critique 2:* Better. "The disease speaks, but she decides" is good. Needs to be warmer. Needs to acknowledge the recovery group specifically so they don't feel alienated. Needs to make sure the family understands why we talk about "disease."

  6.  **Drafting - Iteration 3 (Polishing and Timing):**
      *   *Word Count Check:* 5 minutes is roughly 700-800 words at a moderate pace.
      *   *Tone Check:* Needs to be intimate but public.
      *   *The "Philosophy" Bit:* Needs to be subtle. Instead of "compatibilism," use "ownership."
      *   *Key Phrase:* "We do not praise the mountain for being climbed, but we praise the climber." No, that's not right. "We don't praise the wind, but we praise the sailor."
      *   *Refining the Tension:* Acknowledge that the *capacity* to recover involves luck/support (validating the group), but the *act* is hers (validating her).
      *   *Specific Line:* "You didn't choose the storm, but you steered the ship." (A bit cliché). Let's try: "The urge is a visitor she didn't invite. The decision to show it the door is hers."

  7.  **Finalizing the Content (incorporating the prompt's specific constraints):**
      *   Must not undercut the disease model (for the group).
      *   Must credit her agency (for her).
      *   Must resolve the tension (for the user's philosophical satisfaction).
      *   *Resolution Strategy:* Frame agency not as "freedom from cause" but as "alignment with values." The addiction was a compulsion (misalignment). Sobriety is a commitment (alignment). The credit goes to the *alignment*, not the *capacity*.

      *(Self-Correction during drafting)*: Be careful not to imply she was "weak" before. The disease model says she was *powerless* over the substance, not weak in character. The toast must reflect that distinction. Powerlessness over the drink vs. Power over the self.

  8.  **Writing the Toast (incorporating the above):**
      *   Start with welcome.
      *   Acknowledge the 5 years.
      *   Address the "Disease" aspect gently.
      *   Address the "Effort" aspect firmly.
      *   Weave them together: The *condition* was unchosen; the *conduct* was chosen.
      *   End with the toast.

  9.  **Review against constraints:**
      *   5 minutes? (Looks like ~750 words).
