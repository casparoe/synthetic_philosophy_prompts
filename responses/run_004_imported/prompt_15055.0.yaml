  5.  **Polishing the Tone:**
      *   Ensure it sounds like a philosophical dialogue (respectful, precise, referencing concepts like "qualia," "ontological dependence," "introspective indistinguishability").
      *   Keep it accessible for an IB student (avoid overly dense jargon without explanation).

  6.  **Final Review against Prompt:**
