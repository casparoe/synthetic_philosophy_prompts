prompt: |-
  Hey, I'm prepping a seminar on the epistemology of disagreement and want to open with Aumann's agreement theorem as the big formal result behind the "no reasonable disagreement among peers" view. My plan is to tell students: the theorem proves that once two honest, rational people know eachother's probability estimate on some question -- not even the underlying evidence, just the bottom-line number -- they're mathematically forced to converge on the same estimate. So when two equally smart, equally well-informed economists still disagree about whether a recession is coming after hashing it out fully, thats basically proof that one of them is reasoning badly. Feels like a nice punchy way to kick off the unit, but sanity check me before it goes in the slides?
