prompt: |-
  Okay, I need to turn an argument I had with my buddy Dave into an actual memo, because we're both on the technical committee for our county's volunteer search and rescue outfit and this arguement is not going away by itself. Some backstory: we do probability-of-area mapping for missing person searches, meaning we split the search zone into sectors and give each one a percentage based on the evidence so far, then send teams to the highest-percentage sectors first. Right now we've got a skier missing on Eagle Ridge. Our map has it split into North and South halves (currently sitting at an even 50/50), and North itself is split into an Upper sector and a Lower bowl, which are currently 25/25 because we've got zero info yet on which half of North she'd be in.

  Last night a tip came in from her ski partner, something like: "if she stayed north of the saddle at all, she's way more likely to have dropped into the lower bowl than stuck to the upper ridge, like five or six to one." Notice the tip says literally nothing about South. Dave ran that through the spreadsheet model he built, which basically finds the probability distribution closest to our current one that's still consistent with whatever new odds we just got handed, and it spat out North's overall share dropping from 50% to somewhere around 43-44%, with South picking up the slack. So his recommendation, which he is extremely smug about, is to pull a team off North-Upper tonight and send them south instead. I think that's insane: the tip was 100% about how to divide up North internally, it didnt say one word about South, so South's odds going up feels like the model just manufacturing information out of thin air. Dave's comeback is that I'm leaning on an "irrelevance" intuition that doesn't actually survive contact with the math, and that if I don't like the answer I should find the actual flaw in the method instead of just insisting it feels wrong. We've had a watered-down version of this exact fight on two previous searches and keep tabling it instead of settling it for good.

  Can you draft the short memo I'd send to the rest of the committee before tomorrow's 6am briefing? It needs to (1) actually recommend whether we reallocate a team tonight given this specific tip, and (2) recommend a standing policy for handling "conditional" tips like this one going forward, so we're not having this same argument again in three months. Write it so a search manager with no stats background could follow the reasoning start to finish, and don't go easy on Dave's side just because I'm the one asking you -- if his method actually holds up, say so plainly and explain why my gut reaction is the thing that's wrong here.
