answer: |-
  **MEMORANDUM**

  **TO:** Technical Committee, County Search and Rescue
  **FROM:** [Your Name], Technical Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Eagle Ridge Resource Allocation & Policy on Conditional Probability Updates

  **1. EXECUTIVE SUMMARY**
  This memo resolves the ongoing technical discussion regarding how we integrate new intelligence into our Probability of Area (POA) maps. Specifically, it addresses the conflict between "global entropy" modeling (championed by Dave) and "conditional independence" updating (championed by myself) regarding last night's tip on the Eagle Ridge search.

  **Recommendation 1 (Immediate Action):** For the Eagle Ridge search, **do not reallocate resources from North to South.** We will redistribute the North team to focus on the Lower Bowl, but we will maintain the North/South probability split at 50/50.

  **Recommendation 2 (Standing Policy):** We will adopt a two-tiered update protocol. Dave's Minimum Cross-Entropy model will be used for *global* behavioral evidence. My proposed "Conditional Update" method will be used for *local* sector-specific evidence. This prevents the recurrence of this debate in future searches.

  **2. EAGLE RIDGE DECISION RATIONALE**
  Last night's tip from the ski partner was: *"If she stayed north of the saddle, she's way more likely to have dropped into the lower bowl."*

  **The Mathematical Conflict**
  *   **Dave's Model:** Treats the search map as a single, interconnected mathematical system. When we tighten the odds inside the North sector (from 50/50 to 15/85), the model automatically rebalances the *entire* map to maintain "entropy equilibrium." This mathematically forces the South sector's probability to rise (to ~56%) because the North sector is now "more defined."
  *   **My Position:** Treats the North and South sectors as independent hypotheses. The tip provides information *only* about the North sector. It offers zero evidence regarding the South sector. Therefore, the South probability should remain static.

  **Why We Are Not Moving the Team Tonight**
  While Dave's mathematics are internally consistent, they rely on an assumption that does not fit this specific piece of intelligence. His model assumes that reducing uncertainty in one area automatically shifts probability mass to the remaining areas.

  However, in SAR operations, we operate on the **Principle of Conditional Independence**. The partner's statement is a conditional constraint ($P(Location|North)$), not a global behavioral statement. It tells us where to look *if* she is in North. It does not provide evidence that makes her *less likely to be in North* overall.

  Moving a team away from a sector where we have just received specific, actionable intelligence (North) to a sector where we have received nothing new (South), based solely on a spreadsheet normalization effect, introduces unnecessary operational risk. For tonight, we prioritize the specific intel over the theoretical rebalancing.

  **3. STANDING POLICY: HANDLING "CONDITIONAL" TIPS**
  To prevent this disagreement from delaying future searches, the Committee will adopt the following classification protocol for new intelligence.

  **Type A: Global Behavioral Evidence (Use Dave's Model)**
  *   **Definition:** Evidence that suggests a change in the subject's behavior regardless of location.
  *   **Example:** "The subject is an expert backcountry skier who always seeks the steepest terrain."
  *   **Action:** This applies to all sectors equally. If South has steeper terrain than North, South's probability should rise. Dave's Minimum Cross-Entropy model is the correct tool here, as it properly redistributes probability based on global behavioral traits.
  *   **Verdict:** Dave's method is superior for Type A intel.

  **Type B: Local Conditional Evidence (Use Conditional Update)**
  *   **Definition:** Evidence that restricts probability *within* a specific sector without commenting on other sectors.
  *   **Example:** "If they went North, they would avoid the ridge," or "Witness saw them heading toward the creek in Sector 4."
  *   **Action:** We update the sub-sectors within the named sector but **hold the parent sector's total probability constant.** We do not allow the "mathematical slack" to shift probability to unrelated sectors.
  *   **Verdict:** My proposed method is superior for Type B intel. It adheres to the standard Bayesian rule that evidence must be relevant to a hypothesis to change its probability.

  **4. IMPLEMENTATION**
  Effective immediately, when new intel arrives:
  1.  **Classify** the intel as Type A (Global) or Type B (Local/Conditional).
  2.  **Apply** the corresponding update model.
  3.  **Document** the rationale in the search log to ensure auditability.

  This approach leverages Dave's sophisticated modeling for the scenarios where it shines (global behavior) while maintaining operational safety and statistical rigor for local tips. It acknowledges that while the math of entropy is powerful, it should not manufacture probability shifts where no evidence exists.

  **5. CONCLUSION**
  For Eagle Ridge, we keep the team in North. Going forward, we stop treating this as an "Either/Or" argument. Both methods are valid tools for different types of intelligence. By classifying the intel first, we ensure we use the right tool for the job.

  I request the Committee's approval on this protocol by 1700 hours today to ensure alignment for tomorrow's briefing.

  Respectfully,

  [Your Name]
  Technical Committee
