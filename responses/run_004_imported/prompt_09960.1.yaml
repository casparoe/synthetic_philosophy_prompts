prompt: |-
  ok so i'm on my school's student senate and we're stuck on this. this one sophomore who reads a bunch of economics/rationalist blogs pitched using "futarchy" to decide our new bell schedule instead of just voting on it -- basically set up two markets using the fake Senate Bucks we already have from spirit week (one betting on "avg tardiness in april IF we switch to the later start time," one for "IF we keep it the same"), let the whole school trade all week, and whichever market predicts lower tardiness automatically becomes the policy, no vote needed. half the senate thinks this is actually more fair/objective than politics, the other half thinks its dumb bc theres no real money on the line so nobody has a reason to bet honestly, plus theyre worried kids who want the later start will just gang up and bet to make that market look good on purpose. i have to present a memo to the senate monday recommending whether we should actually do this, and if a scaled-down trial version makes more sense say exactly what that'd look like and for how long before we decide for real. it needs to seriously deal with the manipulation/no-real-stakes problem instead of just saying "well markets are usually smart" and moving on -- can you write that memo for me?
