answer: |-
  This is a fantastic observation, and honestly, the fact that you spotted this tension means you're reading Sidgwick more carefully than many undergraduate philosophy majors do. You have hit on one of the most significant shifts in Sidgwick scholarship over the last 30 years.

  To give you the short answer: **It is not treated as trivia by serious scholars anymore.** For a long time, mid-20th-century analytic philosophers tried to sanitize Sidgwick, treating him as a dry, logical utilitarian. But since the 1990s (led largely by biographer Bart Schultz), the consensus is that you cannot fully understand *The Methods of Ethics* without understanding his psychical research. They are not two separate projects; they are the same project.

  Here is the breakdown of why the psychical research matters to the philosophy, and what it says about his rigor.

  ### 1. The Philosophical Link: Solving the "Dualism"
  You mentioned you respected that *The Methods of Ethics* ends without resolving the tension between self-interest (Egoism) and the general good (Utilitarianism). That tension is called the **Dualism of Practical Reason.**

  Sidgwick argues that reason tells us to pursue our own happiness. Reason *also* tells us to pursue the universal happiness. But what if those two conflict? What if being moral ruins your life?
  *   If there is no God and no afterlife, the rational choice might actually be **Egoism**. Why sacrifice your happiness for others if death is the end and there is no cosmic justice?
  *   For Utilitarianism to be fully "rational," there needs to be a guarantee that, in the long run, virtue and happiness coincide.

  Sidgwick couldn't prove this philosophically. So, he turned to **empirical evidence.**
  He didn't join the Society for Psychical Research (SPR) because he wanted to see a spooky ghost. He joined because he was looking for scientific proof of **survival after death.** If he could prove scientifically that consciousness survives death, it opens the door to a "moral government of the universe" where the sacrifices of this life are rewarded in the next.

  The psychical research was an attempt to find the missing premise that would resolve the Dualism of Practical Reason. When summaries mention it, they shouldn't be saying "look how quirky he was," they should be saying "look how desperate he was to save morality from nihilism."

  ### 2. Was it a lack of rigor?
  This is the trickier part. On the surface, it looks like a brilliant logician wasting decades on telepathy. But context matters.

  **The Victorian Crisis of Faith**
  Sidgwick lived in a time when Darwinism and higher biblical criticism were destroying traditional religious foundations. Sidgwick lost his own Christian faith early on. This terrified him. He wasn't afraid of going to hell; he was afraid that without religion, **morality had no binding force.**
  He wasn't "chasing ghosts" in the sense of being gullible. He was trying to build a new, scientific foundation for ethics because the old religious one had collapsed. He wanted to do for religion what he did for ethics: strip away the dogma and see if there was a rational, empirical core left.

  **His Methodology was Actually Skeptical**
  Inside the SPR, Sidgwick was often the "bad cop." He was notoriously hard to convince. He spent decades investigating mediums and frequently exposed them as frauds. He didn't start with belief; he started with a hypothesis that he hoped to verify.
  In a letter to his successor shortly before he died, he admitted that the evidence for survival was not conclusive. He died essentially still waiting for the proof that would save his ethical system.

  **Does this hurt his rigor?**
  It doesn't necessarily show a lack of logical rigor, but it does show a **philosophical vulnerability.**
  *   **The Critique:** A hardline empiricist might say Sidgwick was engaging in wishful thinking. He *needed* the afterlife to be real for his ethics to work, so he looked for it in places science couldn't validate.
  *   **The Defense:** It shows intellectual honesty. He recognized that his ethical system had a hole (the Dualism). Instead of pretending the hole didn't exist (like some later utilitarians), he went looking for data to fill it. When the data didn't pan out, he didn't lie about it.

  ### 3. Why do write-ups still treat it as trivia?
  You asked why serious write-ups often drop this in as a fun fact. There are two reasons:
  1.  **Specialization:** Moral philosophers often don't want to deal with metaphysics or the history of parapsychology. It's messy. It's easier to teach Sidgwick's *arguments* than his *motivations*.
  2.  **Stigma:** "Psychical Research" has a bad reputation. Associating a giant of ethics with "ghost hunting" can feel like diminishing his stature. It's a form of protectionism for his legacy.

  However, the best modern scholarship (like Bart Schultz's *Henry Sidgwick: Eye of the Universe*) argues that ignoring the SPR work actually distorts his philosophy. It makes him seem colder and more abstract than he was. In reality, he was a man deeply worried about the meaning of life, who spent 30 years trying to find scientific evidence that being good matters.

  ### Summary
  To answer your specific questions:
  *   **Why bring it up?** Because it was his attempt to solve the central problem of *The Methods of Ethics*. It wasn't a hobby; it was applied philosophy.
  *   **Does it show bad rigor?** Not necessarily. It shows he was an empiricist who realized his ethical system required metaphysical premises he couldn't prove. It makes him look less like a cold logic machine and more like a human being terrified that morality might be irrational.

  You were right to respect his honesty in *The Methods*. The psychical research is just further evidence of that same honesty. He wasn't willing to pretend the problem was solved. He spent the rest of his life trying to solve it, even if it meant looking in places other academics wouldn't dare to go.

  If you want to dive deeper into this specific intersection, I highly recommend looking up **Bart Schultz**. He is the leading Sidgwick scholar on this exact topic and treats the psychical research with the philosophical seriousness it deserves.
