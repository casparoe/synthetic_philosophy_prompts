answer: |-
  **Setting:** *A dimly lit coffee shop, late evening. The rush has died down. ELENA (a psychiatric nurse practitioner) and MARCUS (a graduate student in philosophy of science) are sharing a table cluttered with empty cups and a tablet displaying a PDF of Ian Hacking's "Making Up People."*

  **Marcus:** It's not just your friend, Elena. It's the pattern. You see it in the forums, the TikToks, the way people introduce themselves now. "I'm an ADHDer." It's not "I have a condition." It's a species. And the moment we named the species, the specimen started rearranging itself in the jar.

  **Elena:** But the specimen was screaming from inside the jar long before we put a label on the glass. That's the part you gloss over. My patients aren't performing a diagnosis. They're drowning. When we give them the word "ADHD," and maybe a stimulant, and suddenly they can pay a bill or finish a sentence? That's not a social loop. That's dopamine transporters. You can't loop your way out of a neurochemical deficit.

  **Marcus:** I'm not saying the suffering is fake. I'm saying the *category* isn't doing the work you think it is. Hacking's point is about "interactive kinds." Rocks don't care if you call them igneous. People do. When your friend got diagnosed, she didn't just get a treatment plan. She got a narrative. She started curating her life around the diagnosis. She forgave herself for things she used to fight, and she leaned into traits she might have otherwise suppressed. The diagnosis didn't just describe her; it edited her.

  **Elena:** Okay, sure. Awareness changes behavior. If you tell someone they have a gluten intolerance, they stop eating bread, and their stomach stops hurting. Does that mean the gluten intolerance isn't real? That it's just a "moving target"? No. It means the treatment involves the patient's cooperation. The biology is the anchor. The loop is just the noise on the line.

  **Marcus:** But with gluten, the biological mechanism is stable. With ADHD, the mechanism is defined by the behavior it produces, which is defined by the cultural expectation of the diagnosis. Look at the criteria. In 1980, it was hyperactivity in boys. Now, it's "emotional dysregulation" and "executive dysfunction" in adult women. The target moved because the *people* moved. We expanded the net to catch the people who identified with the label, and now the label means something different than it did forty years ago. You can't find the "real" ADHD because the thing you're looking for is mutating faster than your microscope can focus.

  **Elena:** That's not mutation, Marcus. That's resolution. It's exactly like infection. In 1700, "infection" meant miasma, bad air, sin. Then it meant pus. Then it meant bacteria. Then viruses. The definition shifted wildly, but the *thing*—the pathogen—was there the whole time. We just got better at seeing it. We're doing the same with psychiatry. We used to think ADHD was just bad parenting. Then we thought it was just hyperactive boys. Now we see the neural networks. The category is stabilizing, not dissolving.

  **Marcus:** The infection analogy is your crutch, and it's weak. A virus doesn't know it's being studied. A virus doesn't go on Reddit to find community with other viruses, read about its own symptoms, and then decide to manifest a new symptom because it read about it online. But people do. There's a study on Multiple Personality Disorder—now DID. The average number of alters per patient jumped from three to twelve right after the DSM changed and movies like *Sybil* came out. The diagnosis created the ecosystem for the symptoms to flourish. If ADHD is an interactive kind, then the "truth" of it is partly constituted by how we react to it. There is no "underneath" stable layer. The loop *is* the layer.

  **Elena:** That's a dangerous slide. If you tell people there's no stable layer, you invalidate the medication. I have seen a kid who can't sit still long enough to eat a sandwich take a methylphenidate and sit still. The loop didn't do that. The molecule did that. If there wasn't a real, biological kind underneath the social noise, the pills would be placebos. And they aren't. The effect size is massive.

  **Marcus:** I'm not saying the pills don't work. I'm saying what the pills are *working on* might be a feedback system, not a broken part. Think about it. We live in an economy that demands hyper-focus for ten hours a day on tasks that are often meaningless. Of course people's attention systems fracture. We pathologize the fracture, give them a chemical to force compliance with the economy, and then they identify as "broken" because they need the chemical. The "disorder" is the friction between a specific brain type and a specific cultural demand. Change the culture, change the prevalence. Change the label, change the brain. That's not a natural kind. That's a negotiation.

  **Elena:** So what's your alternative? Throw out the diagnosis? Tell my patient, "Sorry, your inability to manage your finances isn't a disorder, it's just a negotiation with late-stage capitalism"? That's academic cruelty. The label gives them leverage. It gives them access to accommodations, to meds, to self-compassion. Even if it is a "loop," it's a therapeutic loop. Why does it matter if it's ontologically pure if it stops the bleeding?

  **Marcus:** Because if we think it's a natural kind like a virus, we stop looking at the culture and only look at the brain. We medicalize normal variation. If ADHD is a fixed thing we're "discovering," then the goal is to fix the person to fit the world. If we admit it's a looping effect, the goal might be to change the world to fit the person. By insisting it's real in the way a rock is real, you're locking people into a medical identity that might be constraining them more than helping them. Your friend? She's not just treating symptoms. She's building a personality around the limitation. "I can't do that, I have ADHD." The diagnosis becomes an alibi.

  **Elena:** Or it becomes an explanation that stops the shame spiral. Before the diagnosis, she thought she was lazy. Now she knows she has a regulation issue. That shift *is* the loop, yes, but it's a positive one. You're acting like the loop is inherently distorting. But maybe the loop is how humans heal. We are storytelling animals. We need a narrative to integrate our biology. The fact that the category changes as we understand it doesn't mean it isn't real. It means it's *human*. You want a clean ontology? Go study physics. Psychiatry is messy because it's studying things that talk back. That doesn't make the suffering less real.

  **Marcus:** I agree the suffering is real. I disagree that "ADHD" is the name of the thing causing it. It's the name of the *interaction* between the brain, the pill, the culture, and the self-image. Hacking isn't saying it's fake. He's saying it's historical. It has a history. Viruses don't have a history; they have an evolution. ADHD has a history. In fifty years, "ADHD" might not exist. It might be split into five different genetic markers, or it might be absorbed into a broader sensory processing category. If it were a real natural kind, it wouldn't vanish when the culture changes.

  **Elena:** And in fifty years, "Infection" might not exist either. We might stop calling it that and talk about specific immune responses and microbial loads. The word changes. The map changes. But the territory is still there. There are people whose nervous systems fire differently. There are people who cannot regulate attention in ways that cause them genuine harm. Whether we call it ADHD, or "Attention Deficit," or "Type-4 Neurology," the cluster of traits exists independent of the name. The name just lets us grab the handle.

  **Marcus:** But the handle changes the shape of the object. That's my point. If you grab a rock, the rock stays the same. If you grab a person with a diagnosis, the person changes shape to fit the grip. So you can never know if you're holding the rock, or if you're holding the reaction to your own hand.

  **Elena:** Then we let go? We stop diagnosing?

  **Marcus:** No. We diagnose with humility. We say, "This is a tool we're using to help you, not a truth we're uncovering about your soul."

  **Elena:** I try to do that. But when the insurance company demands a code, and the pharmacy demands a code, and the patient is crying because they can't hold down a job... humility doesn't fill the prescription. I need to know if there's a there there. And I think there is. Even if the "there" talks back.

  **Marcus:** *(Sighs, leaning back)* I think there is too. I just think the "there" is a conversation, not a statue.

  **Elena:** *(Smiles faintly)* Well. As long as the conversation gets them out of bed in the morning, I'll keep listening.

  **Marcus:** And I'll keep asking who's doing the talking.

  *(They sit in silence for a moment, the hum of the refrigerator filling the gap between them.)*
