  **(Self-Correction during drafting):** I need to make sure the Friend addresses the "infallible predictor" aspect. If the predictor is infallible, how can HH choose to keep the money? The Friend needs to argue that the prediction was about the *intention*, not the final action, or that the infallibility only held up to the moment of arrival. Actually, the standard setup implies the prediction determines the ride. If HH keeps the money, the prediction was wrong. The Friend needs to argue that the prediction was about the *disposition at time T1*, and we are at time T2. The HH needs to argue that T1 and T2 are logically linked.

  Let's write it.

