prompt: |-
  So this semester I'm taking a formal epistemology seminar and we just spent like two and a half weeks on Jeffrey conditionalization (probability kinematics, or whatever you wanna call it), and I'm still turning parts of it over in my head. Seperately, I help run my philosophy department's little grad-student podcast, and next month's guest is a formal epistemologist whose whole research program is defending Jeffrey's rule as the right way to update on uncertain evidence, against people who think plain Bayesian conditionalization is enough as long as you're careful about what counts as "the evidence." I got stuck drafting the questions since I'm apparently "the one who took the class," and I really don't want to lob her softballs where she just recites the textbook version of the view and we move on.

  Can you write me 8 to 10 questions that actually push on the parts of this I remember being genuinely contested, not just "can you explain probability kinematics for our listeners"? Specifically I want at least one question on the non-commutativity thing -- how updating on uncertain evidence E1 then E2 can leave you somewhere different than updating on E2 then E1 -- and whether she thinks that's a feature of the view (evidence really does arrive in an order) or a cost she has to bite the bullet on. I also want one on the rigidity condition, since as far as I can tell the whole rule just assumes your conditional credences on the partition won't shift during the update, and I want to know if theres an actual argument for that or if its basically stipulated to make the math come out. One should be on the diachronic Dutch book argument for the rule (I think that's originally Lewis's proof, via Skyrms's paper, correct me if I'm fuzzy on that) -- ask her whether a pragmatic coherence argument like that can really settle what counts as an epistemically appropriate update. And I definitely want one that presses on where her new probabilities over the partition are even supposed to come from in the first place, if not some certain "given" -- since I recall Jeffrey himself just bit the bullet here with his whole "radical probabilism, no foundations required" move, and I want to know if she's willing to go that far too.

  For each question, add a quick follow-up keyed to whatever answer she's most likely to give, so it doesn't read like I'm just working down a notecard. And can you end the list with a question that loops back to something like the candlelight-and-cloth case, pretty sure that's the example from Jeffrey's own book though I'm hazy on the exact details, so the episode doesn't just trail off into notation and actually reminds listeners why anyone needed a generalization of conditionalization to begin with.
