      *   *Topic 3: Diachronic Dutch Book.*
          *   Issue: Lewis/Skyrms argument says violating JC makes you susceptible to a sure loss.
          *   Tension: Pragmatic vulnerability $\ne$ Epistemic irrationality (the "so what?" objection).
          *   Question: Does avoiding monetary loss really track epistemic rationality?
          *   Follow-up: If not, is there a purely epistemic accuracy argument (e.g., Greaves/Wallace) that works better?

      *   *Topic 4: The Input Problem (Radical Probabilism).*
          *   Issue: JC tells you how to update given new probabilities on a partition, but doesn't tell you *how* to get those new probabilities.
          *   Tension: Standard Bayesians say evidence must be certain ($P(E)=1$). Jeffrey says no. But then what constrains the input?
