          *   Tension: Real evidence often feels simultaneous or order-independent.
          *   Question: Is this order-dependence a realistic feature of experience or a theoretical cost?
          *   Follow-up: If it's a feature, how do we handle cases where the order seems arbitrary?

      *   *Topic 2: Rigidity (Invariance).*
          *   Issue: JC requires $P_{new}(H|E_i) = P_{old}(H|E_i)$.
          *   Tension: Why should learning *that* $E_i$ is more likely not change how $E_i$ relates to $H$?
          *   Question: Is rigidity a substantive constraint or a mathematical convenience?
