answer: |-
  **MEMORANDUM**

  **TO:** Whitmore Fellowship Selection Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendations Regarding MFA Data Analysis and Public Reporting

  **Purpose**

  As we prepare to vote on our public response to the recent allegations regarding MFA bias, I am writing to offer a recommendation that bridges the gap between our statistical findings and our ethical obligations. We are currently divided between two valid perspectives: one that prioritizes the mathematical integrity of our selection data, and another that prioritizes the structural realities of the literary ecosystem. This memo argues that these perspectives are not mutually exclusive. We can acknowledge the statistical truth of our selection process while simultaneously acknowledging the structural disparities that shape our applicant pool.

  **The Statistical Reality**

  Our biostatistical audit is correct. The aggregate data cited by the literary blog (18% MFA acceptance vs. 8% non-MFA) is a classic instance of Simpson's Paradox. Because Fiction is vastly more competitive than Poetry, and because non-MFA writers apply for Fiction at much higher rates, the overall numbers skew against non-MFA writers. When disaggregated by genre, non-MFA writers are selected at rates equal to or higher than their MFA counterparts (6% vs. 5% in Fiction; 25% vs. 20% in Poetry).

  Mathematically, this confirms that our blind reading process is not systematically penalizing applicants based on credential status. To claim otherwise would be to misrepresent the data we have collected. Camp One is right: the selection mechanism itself is functioning without bias.

  **The Structural Concern**

  However, Camp Two is also right to argue that statistical innocence is not the same as equity. The fact that non-MFA writers cluster in Fiction while MFA writers cluster in Poetry is not a random distribution; it is a symptom of how literary training is accessed.

  The concern raised by my colleagues is that the "competitiveness" of a poetry manuscript is often contingent on the specific workshop feedback, networking, and legitimization that an MFA program provides. If non-MFA poets are applying at lower rates, or if they feel less confident submitting poetry without that credential, our "blind" process does not account for the disadvantage they faced *before* they hit submit. A blind read ensures we judge the text fairly, but it does not ensure that all writers have had the same opportunity to make that text legible to us.

  Dismissing the blog's accusation solely with a statistical technicality risks signaling that we are uninterested in the pipeline issues that determine who applies to us in the first place. It treats the fellowship as an island, rather than part of a larger ecosystem.

  **Recommendations**

  To honor both the integrity of our data and the validity of our community concerns, I recommend the following two-part approach:

  **1. Public Reporting: Transparency with Context**
  We should publish the disaggregated data, as Camp One suggests, but we must frame it carefully. The report should not declare the matter "closed." Instead, it should distinguish between *selection bias* and *application disparity*.

  *   **Proposed Language:** "While our internal audit confirms that MFA status does not negatively impact selection rates within specific genres, we acknowledge that structural barriers in literary training influence where and how writers apply. The disparity in overall acceptance rates reflects the high volume of non-MFA applicants in our most competitive category (Fiction), rather than bias in our reading process. However, we recognize that the concentration of MFA holders in Poetry suggests a need for broader support systems for independent poets."

  This allows us to defend our process without dismissing the reality of the disparity.

  **2. Process Adjustment: Pre-Application Support**
  We cannot alter the blind selection process without compromising our core value of artistic merit. However, we can alter the support structure surrounding it. I propose we allocate a small portion of our administrative budget or leverage our mentorship network to create a "Manuscript Development Resource" specifically targeted at non-MFA applicants.

  *   **Action:** Partner with a literary organization that serves underrepresented or non-credentialed writers to offer a free, virtual workshop on "Preparing a Poetry Manuscript for Fellowship Submission" prior to the next intake cycle.
  *   **Rationale:** This addresses Camp Two's worry directly. If the concern is that non-MFA writers lack the training to make their poetry competitive, we provide the training without influencing the blind judgment. It levels the playing field at the point of entry, rather than attempting to engineer the outcome at the point of selection.

  **Conclusion**

  We have a duty to be statistically honest, but we also have a duty to be institutionally humble. By publishing the breakdown, we validate the integrity of our readers. By acknowledging the structural context and offering targeted support, we validate the concerns of the community we serve.

  I urge the committee to adopt this dual approach. It allows us to stand by our numbers without hiding behind them.

  Respectfully,

  [Your Name]
  Selection Committee Member
