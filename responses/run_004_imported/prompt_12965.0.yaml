answer: |-
  **Setting:** *A graduate seminar room, late afternoon. The whiteboard is still covered in diagrams of space-time worms from the previous lecture. Two coffee cups sit on the table between ELENA (Endurantist) and PAUL (Perdurantist). The rest of the class has filtered out.*

  **Elena:** (Sitting in her chair, knees at right angles) Look, Paul. Right now, I am bent.

  **Paul:** (Leaning against the doorframe) At *t1*, you are bent. Sure.

  **Elena:** (Stands up abruptly, legs straight) And now, I am straight.

  **Paul:** At *t2*, you are straight.

  **Elena:** (Sits back down heavily) No. *I* am bent. And *I* am straight. I am the same thing that stood up and sat down. If Lewis is right about temporary intrinsics, I'm a contradiction waiting to happen. Bent and straight are incompatible shapes. One thing can't have both.

  **Paul:** Exactly. That's the force of the argument. You want to say the *same* wholly present object has incompatible properties. The only way to make that consistent is to say you don't have them *simpliciter*. You have them relative to times.

  **Elena:** Which is exactly what I'm saying. Being bent isn't a monadic property I carry around in my back pocket. It's a relation. I stand in the *bent-at* relation to Tuesday, and the *straight-at* relation to Wednesday. There's no contradiction in standing in different relations to different times.

  **Paul:** But that's the concession, Elena! You've saved the consistency of the object by sacrificing the intrinsicality of the property. Lewis's point was that shape is paradigmatic of an intrinsic property. It's about how *you* are, not about how you relate to a clock. By making shape a relation to a time, you've turned a change in shape into a Cambridge change. It's like saying I'm "to the left of" the door, then "to the right of" the door. That's not me changing; that's just my relations shifting. You've explained away genuine change.

  **Elena:** I haven't explained it away; I've analyzed it. Why do you assume that for a property to be intrinsic, it can't involve a time? Time is the dimension of change. If I exist in time, my properties are going to be indexed to where I am in that dimension. That doesn't make them less real. It just makes them temporally located. You're assuming that "intrinsic" means "atemporal," but why should I grant that?

  **Paul:** Because if properties are inherently time-indexed, then nothing ever *changes* its properties. It just has different time-indexed properties eternally. The "bent-at-t1" property is one you have forever. The "straight-at-t2" property is one you have forever. You, the enduring substance, are a static locus of time-indexed traits. That's a block universe view of an enduring object. It's the worst of both worlds. You keep the enduring object but give it the static ontology of a perduring worm.

  **Elena:** That's a heavy charge. But let's turn it around. You say you solve this by temporal parts. Fine. So, when I was standing, there was a temporal part of me—a "person-stage"—that was straight. And now there's a temporal part that is bent. But here's the problem: *I* am not a person-stage. I am the person.

  **Paul:** You *are* the worm. The aggregate of all those stages.

  **Elena:** If I am the worm, then strictly speaking, *I* am never bent. And *I* am never straight. Only my parts are bent or straight. The whole worm is a bent-straight hybrid extended through time. But when I stub my toe, *I* feel it. When I sit in this hard chair, *I* am uncomfortable. It feels like the whole me is bent. If perdurantism is true, then no persisting object ever actually changes shape. Only its momentary slices do. You've solved the contradiction by ensuring the subject of the predication is never the subject of the experience.

  **Paul:** That's a category mistake. We predicate properties of wholes derivatively all the time. I say, "The table is smooth," but strictly, only the surface is smooth. I say, "I am tall," but strictly, only my vertical spatial extent measures six feet. Why can't I say, "I am bent," meaning that I have a temporal part that is bent? It's a relation of having. The worm *has* a bent part.

  **Elena:** "The table is smooth" works because the surface is the part of the table interacting with my hand. But when I say "I am bent," I'm not saying "I have a part that is bent." I'm saying my current configuration is bent. If you say *I* am the four-dimensional worm, then *I* am currently extending from birth to death. I'm a long, snaky thing. I'm not bent. I'm not straight. I'm a shapeless sprawl through spacetime. You've saved the logic of temporary intrinsics by making it impossible for persisting things to have shapes at all.

  **Paul:** (Pushes off the doorframe and walks to the table) You're relying on a presentist intuition of what "I" refers to. When you say "I am bent," you're implicitly quantifying over your current stage. Language is context-sensitive. But let's grant your point for a moment. Suppose the cost of temporal parts is that predication is derivative. Is that cost higher than the cost of your view? Because your view has a boundary problem I haven't seen you solve yet.

  **Elena:** Boundaries?

  **Paul:** Vagueness. When did you begin to exist? Was it at conception? At implantation? At birth? At the first neural flicker?

  **Elena:** That's a biological question, not a metaphysical one.

  **Paul:** It's metaphysical if you're an endurantist. If you are wholly present at every moment of your existence, then there must be a first moment where you are wholly present. If there isn't a sharp cutoff, then it's vague whether you exist at some time *t*. But existence isn't the kind of thing that can be vague. Either the object is there, or it isn't. If it's vague, then identity is vague. And Lewis showed that vague identity is incoherent.

  **Elena:** Why is vague identity incoherent?

  **Paul:** Because of Evans's argument. If it's indeterminate whether object *a* is identical to object *b*, then *a* has the property of "being indeterminately identical to *b*." But *b* definitely has the property of "being determinately identical to *b*." So they have different properties. By Leibniz's Law, they aren't identical. So it wasn't indeterminate after all. Contradiction.

  **Elena:** Evans's argument assumes that the vagueness is in the *world*, in the objects themselves. But I can be an endurantist and say the vagueness is semantic or conceptual. The world isn't vague; our concept of "person" is. There's a precise physical aggregate of matter there, but whether we label that aggregate "Elena" is a matter of linguistic convention.

  **Paul:** But if the vagueness is just in our words, then there *is* a precise moment where the object you *really* refer to comes into existence. You just don't know which one it is. That means there's a sharp boundary to your existence, even if we can't find it. And that's absurd. It implies that adding one single molecule, or waiting one nanosecond, makes the difference between non-existence and a full-blown person. That's magical thinking.

  **Elena:** It's not magical; it's precise. Why do you think precision is a vice? The universe is precise. Our concepts are fuzzy. Perdurantism tries to make the *ontology* fuzzy to match the *concepts*. You say there are infinite overlapping worms, and we just pick one. But that multiplies entities like crazy. For every vague boundary, you posit a new object. I just say there's one object, and our reference to it is imprecise.

  **Paul:** But if reference is imprecise, then when we say "Elena sat down," we don't know *which* Elena sat down. The one that started at conception? The one that started at birth? If there are thousands of overlapping worms, most of them didn't sit down. Some ceased to exist before the seminar started. Some began five minutes ago. So the sentence "Elena sat down" is neither true nor false, or it's true for some worms and false for others. That undermines the truth of ordinary discourse.

  **Elena:** Supervaluationism handles that. The sentence is true if it's true for *all* admissible precisifications of "Elena." Since all the candidate worms in the vicinity sat down, the statement is super-true. I don't need to multiply realities; I just need to acknowledge that truth can be robust even when reference is slightly loose.

  **Paul:** Supervaluationism is a patch. It saves the truth values, but it abandons classical logic in the process. Disjunctions can be true while neither disjunct is true. "Either Elena began at t1 or Elena began at t2" can be true, even if it's indeterminate which one. That's a high price to pay to save the idea that you are "wholly present."

  **Elena:** And paying that price is better than telling me that I am a four-dimensional snake and that my current experience of bending is actually a property of a slice of me that isn't *me*? You accuse me of making change relational. I accuse you of making experience fractional.

  **Paul:** (Pauses, looking at the whiteboard) I don't think experience is fractional. The stage that is having the experience *is* the relevant subject of that experience. The worm is the person, but the stage is the locus of consciousness.

  **Elena:** So now you're a stage theorist? I thought you were a worm theorist.

  **Paul:** (Smiles) The views converge on the temporal parts ontology. Whether the "I" refers to the worm or the stage, the metaphysics is the same: reality is sliced.

  **Elena:** And that slicing is what I can't accept. It treats time exactly like space. But time *passes*. I don't spread through time the way I spread through space. I endure. I am here, now. And when I stand up, *I* change. Not my parts. Me.

  **Paul:** And I maintain that if you are here now, wholly, and there then, wholly, with incompatible properties, you haven't given me a coherent account of *how* that works without making the properties relational. And if they're relational, you've admitted that intrinsic change is an illusion.

  **Elena:** And I maintain that if I'm a worm, I've never done anything in my life. Only my parts have.

  *(They stand in silence for a moment. The seminar room is quiet.)*

  **Paul:** So. We're at an impasse.

  **Elena:** It seems so. You think my view is logically incoherent without hidden relationalism. I think your view is phenomenologically absurd without hidden stage-theory.

  **Paul:** And both of us think the other's solution to vagueness is ad hoc.

  **Elena:** (Picks up her bag) Same time next week? We haven't even touched on presentism yet.

  **Paul:** (Laughs) Don't remind me.

  ***

  ### Commentary and Assessment

  This dialogue highlights why the Endurantism/Perdurantism debate remains one of the most stubborn stalemates in contemporary metaphysics. Both sides have developed sophisticated defenses that effectively parry the strongest blows of the opposition, but only by incurring significant theoretical costs.

  **The Scorecard:**

  1.  **Temporary Intrinsics:**
      *   **Perdurantist Advantage:** Lewis's argument is logically potent. If properties are intrinsic, they cannot be incompatible. Endurantists *must* relativize properties to times (or adopt non-standard logics). Paul is right that this risks turning genuine change into a variation of relational properties (Cambridge change).
      *   **Endurantist Counter:** However, Elena's rebuttal is that time *is* a parameter of instantiation. Denying this begs the question in favor of a timeless conception of property possession.
      *   **Edge:** Slight edge to **Perdurantism** on logical consistency, but only if one accepts Lewis's strict definition of "intrinsic."

  2.  **The "Who is Bent?" Objection:**
      *   **Endurantist Advantage:** This is the strongest intuitive point for the Endurantist. Perdurantism struggles to explain why *I* (the whole worm) am the subject of pain or shape, rather than just my current stage. The "derivative predication" response (I am bent because I have a bent part) feels weak when compared to the immediate phenomenology of embodiment.
      *   **Perdurantist Counter:** Paul's appeal to linguistic context-sensitivity helps, but it requires us to accept that our ordinary self-conception is metaphysically loose.
      *   **Edge:** Clear edge to **Endurantism** on phenomenological fidelity and ordinary language.

  3.  **Vagueness and Boundaries:**
      *   **Perdurantist Advantage:** The argument from vagueness (championed by Ted Sider) is the perdurantist's heaviest artillery. The claim that "existence cannot be vague" forces the endurantist into either accepting sharp, magical boundaries or adopting supervaluationism (which sacrifices classical logic).
      *   **Endurantist Counter:** Elena's move to locate vagueness in semantics/concepts rather than ontology is standard and viable, but it requires biting the bullet on "epistemicism" (there is a sharp boundary, we just can't know it) or revising logic.
      *   **Edge:** Slight edge to **Perdurantism**. The vagueness argument is harder for endurantists to dissolve without significant theoretical restructuring.

  **Verdict:**

  **Real Stalemate.**

  Neither side "wins" because the debate ultimately rests on a clash of theoretical virtues.
  *   **Perdurantism** wins on **systematicity and logic**. It integrates smoothly with Special Relativity, solves the vagueness problem by precisifying boundaries via parts, and dissolves the contradiction of temporary intrinsics. However, it pays for this with **ontological extravagance** (infinite worms) and **phenomenological alienation** (I am not the subject of my own properties).
  *   **Endurantism** wins on **common sense and phenomenology**. It preserves the intuition that *I* change, *I* act, and *I* am wholly present. However, it pays for this with **logical friction** (requiring time-indexed properties or non-standard logic) and **boundary difficulties** (vagueness of existence).

  If you prioritize a clean, extensional ontology compatible with physics, Perdurantism comes out ahead. If you prioritize the first-person perspective and the coherence of agency, Endurantism is superior. As the dialogue shows, moving the goalposts (from intrinsics to vagueness to predication) doesn't resolve the tension; it merely shifts the locus of the mystery.
