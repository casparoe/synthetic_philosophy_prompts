answer: |-
  **Moderator:** Thank you both for coming. As requested, I will keep my intervention minimal. We have a specific case. Two infantrymen, Private A and Private B. They are in a trench, facing one another across no-man's-land. Both have been told by their governments that they are defending the homeland against aggression. In reality, only one side is justified; the other is an aggressor. However, both soldiers are *invincibly ignorant* of this fact. They have no access to the classified intelligence or the historical context that would reveal the truth. They raise their rifles. I want you to judge the moral status of their impending action. Elena, you argue for the Walzerian tradition. David, you argue for the McMahanian revision. Please begin.

  **Elena (Walzerian):** It seems straightforward. Both soldiers possess the "combatant's privilege." They are moral equals. If Private A shoots Private B, and Private B shoots Private A, neither commits a wrong, provided they observe the rules of engagement. They are instruments of their states, stripped of personal moral liability for the war itself.

  **David (McMahanian):** It is straightforward only if you ignore reality. Objectively, one of these men is threatening an innocent person, and the other is threatening a liable aggressor. If Private A is on the unjust side, he is attempting to kill someone who has done nothing to forfeit his right to life. That is attempted murder. Private B, assuming he is on the just side, is acting in permissible self-defense. They are not equals. One is liable to be killed; the other is not.

  **Elena:** You leap immediately to the "objective" truth. But morality must be action-guiding. These men *cannot know* who is liable. If you tell Private A, "You are morally forbidden to shoot because your cause is unjust," you are asking him to make a judgment he is epistemically incapable of making. He is a soldier, not a supreme court justice.

  **David:** I am not asking him to judge the war. I am describing the moral reality of his action. If I unknowingly shoot at a police officer because I mistakenly think he is a criminal, I am still acting wrongly, even if I am blameless. My ignorance excuses me from *blame*, but it does not *justify* the act. The officer still has the right to stop me. Similarly, the unjust soldier is excused due to ignorance, but he is not justified.

  **Elena:** There is the rub. "Excused but not justified." To the soldier in the trench, that is a distinction without a difference. If he is blameless, if he has done nothing wrong, why do we insist on labeling his act as morally impermissible? You are creating a class of people who are told they are essentially criminals, even if we promise not to punish them. This undermines the very possibility of a regulated war. If Private A believes he is doing something objectively wrong, even if excused, the reciprocity that keeps war contained breaks down.

  **David:** It's not a distinction without a difference, Elena. It matters for the victim. If Private A kills Private B, an innocent defender has died. If we say A was *justified*, we imply B had no right to resist. But B *did* have a right to resist. By denying the moral equality of combatants, we preserve the truth that the victim on the just side was wronged. Your theory erases the victim's grievance by claiming the killer had a right to kill him.

  **Elena:** I do not erase the grievance. I locate it at the level of the state, not the individual. The crime is the aggression, committed by the leaders. The soldiers are merely the means. By granting them equal status, we acknowledge that once the state has unleashed violence, the individuals caught in it are symmetrically positioned. They face the same fear, the same duty, the same risk. This phenomenological symmetry *creates* a moral symmetry. To deny it is to ask soldiers to fight a war while simultaneously believing their enemy is a murderer and they are police. That leads to extermination, not war.

  **David:** That is a pragmatic argument, not a moral one. You are saying we should endorse a fiction—that the unjust soldier has a right to kill—because it makes war safer. But why should we build a moral theory on a lie? If the unjust soldier is not liable to be killed, then killing him is a tragedy that requires justification. If he *is* liable (as you claim), then killing him is routine.
  Let's press the ignorance point. You say they are epistemically incapable. But suppose Private A has a nagging doubt? Suppose he sees his own side shelling a hospital? If your theory holds, he still has the "combatant's privilege." He can suppress the doubt and shoot Private B. My theory demands he investigate. It places a burden on him to ensure his cause is not manifestly unjust.

  **Elena:** And that burden is fatal to the concept of an army. If every soldier must vet the *jus ad bellum* before obeying an order, you have a militia, not a state force. But let's look at your "liability" claim. You say Private A is liable because he threatens an innocent. But Private A believes he is threatening a threat. In ordinary morality, if I reasonably believe I am acting in self-defense, I am justified, not merely excused. If a homeowner shoots an intruder he reasonably believes is armed, he is justified, even if the "intruder" turns out to be a deaf firefighter. Why is war different?

  **David:** Because the scale is different, and the source of the threat is different. In the firefighter case, the firefighter is not an *agent* of injustice. In war, Private A is part of a collective project of aggression. But more importantly, consider the perspective of Private B. If Private B knows he is defending his home, and Private A shoots him, Private B is not fighting a "moral equal." He is fighting someone who is violating his rights. If we tell Private B, "You and A are moral equals," we tell him his defense of home is no more righteous than A's attack on it. That is demoralizing and false.

  **Elena:** It is not false; it is functional. We tell Private B that A is his equal *in the context of the fight* so that Private B accepts the constraints of *jus in bello*. If Private B believes A is a criminal without rights, Private B will torture A when he captures him. The Moral Equality of Combatants is the price we pay for humane treatment of POWs. It buys the protection of the unjust soldier in exchange for the protection of the just soldier.

  **David:** You are conflating the *laws* of war with the *morality* of war. I agree we should prosecute soldiers for war crimes regardless of side. That is legal policy. But we are discussing moral liability.
  Let's go back to the excuse. You say it stigmatizes the soldier. I say it honors the victim. If Private A dies, he dies as a participant in an unjust project. If Private B dies, he dies as a victim. If you flatten this, you flatten the moral landscape.
  However, I will concede this: If Private A is truly invincibly ignorant, he is not *culpable*. He is not a villain. But he is still *liable*. Why? Because he is the one posing the unjust threat. If a sleepwalker walks off a cliff and lands on you, he is not culpable, but you may still push him off to save yourself. His innocence doesn't grant him the right to crush you.

  **Elena:** The sleepwalker analogy fails because the sleepwalker isn't aiming a rifle. A better analogy is two duelists who both believe they have been wronged. They agree to the duel. In that moment, they grant each other the right to shoot. Soldiers are conscripted into a duel between states. They do not choose the cause. To hold them liable for the cause is to hold them responsible for the sins of their fathers.
  You keep insisting on the "objective" status. But in the fog of war, the objective status is inaccessible. Morality cannot demand the impossible. If morality says Private A must not shoot, but Private A cannot know he shouldn't shoot, then morality has failed Private A.

  **David:** Morality isn't failing him; the situation is tragic. That is the point of revisionism. War is hell not just because people die, but because good people are forced to do objectively wrong things. Your theory tries to sanitize this by saying, "If you follow the rules, you did nothing wrong." I am saying, "You did wrong, but we understand why."
  Consider the symmetry you prize. You say their situation is symmetric. But it isn't. One is protecting a just political order; the other is undermining it. The *outcome* of the war matters. If the unjust side wins, tyranny prevails. If the just side wins, justice prevails. How can the means be morally equal when the ends are morally opposite?

  **Elena:** Because the means are constrained by the immediate threat to life, not the political outcome. Private A does not kill Private B to establish tyranny. He kills Private B because Private B is trying to kill him *right now*. In that micro-moment, the macro-justice of the war recedes. The immediate right to self-preservation dominates.
  If you deny this, you create a paradox. If Private A is not permitted to kill Private B, then Private B is permitted to kill Private A without resistance from A being "just." But if A cannot defend himself, he is being executed, not fought. You turn the unjust soldier into a sitting duck who happens to be shooting back.

  **David:** I do not say he is a sitting duck. I say Private B is permitted to kill A because A is liable. I say A is *not* permitted to kill B, but if he does so out of ignorance, he is excused.
  Here is my hardest question for you, Elena: If Private A is truly your moral equal, does he have a right to kill Private B?
  If you say yes, you imply Private B has no right not to be killed by A.
  If Private B has no right not to be killed, then if B survives and kills A, B has infringed on A's rights.
  But you would agree B is justified in killing A.
  So B is justified in killing A, and A is justified in killing B.
  Two people cannot both be justified in killing each other simultaneously. One right must negate the other. Rights are correlative. If B has a right to life against A, A cannot have a right to kill B.

  **Elena:** That is the logic of ordinary morality, David. War is a distinct moral sphere. It is a convention. Within the convention, we *assign* rights that do not exist in nature. We assign A the right to kill B, and B the right to kill A, not because they have natural rights to do so, but because we have agreed that this is the only way to keep the violence contained. It is a mutual waiver of the right not to be killed. By wearing the uniform, A waives his right not to be shot by B, and B waives his right not to be shot by A.

  **David:** But a waiver requires consent and understanding. If A is fighting for an unjust cause, he has no moral authority to waive the rights of the innocent people he is threatening. He cannot waive Private B's right to life on behalf of the unjust regime.
  And this brings us to the ignorance again. You rely on invincible ignorance. But what if the ignorance is vincible? What if the propaganda is obvious? Your theory grants the privilege regardless. My theory scales liability with culpability. The more reason A has to doubt his cause, the more liable he becomes for murder. Your theory treats the indoctrinated fanatic and the skeptical conscript exactly the same.

  **Elena:** Because once the shooting starts, we cannot adjudicate the skepticism. We need a bright line. The uniform is the bright line.
  Let me press you on the "Excuse." You say A is excused. Who is doing the excusing? God? The moral universe? If A is excused, he should not feel guilt. If he should not feel guilt, he acted permissibly *for him*.
  If you tell a soldier, "You are excused," he hears, "It's okay."
  If you tell him, "You are not justified," he hears, "It's not okay."
  You cannot have it both ways. If it's not okay, he bears a moral stain. If he bears a moral stain, he is not a professional doing a job; he is a sinner seeking forgiveness. You turn the army into a confessional. That is not sustainable for a secular state.

  **David:** It is sustainable if we acknowledge tragedy. We tell the soldier: "You did what you had to do to survive, and we do not blame you. But we acknowledge that an innocent person died by your hand."
  This matters for compensation. If A dies, his family gets a pension. If B dies, his family gets a pension *and* moral vindication.
  Your view implies that if the unjust side wins, the victory is morally neutral. My view says the victory is tainted.
  But let's return to the trench. They are facing each other. You say the symmetry of their fear makes them equals. I say the asymmetry of their *liability* makes them unequals.
  If Private B captures Private A, B must not torture A. I agree with you there. A retains human rights. But B does not have to let A go. B can detain A. Why? Because A was fighting unjustly.
  If they were truly moral equals, detention would be as problematic as killing.
  The fact that we accept POW detention proves that *in bello* rights are not fully independent of *ad bellum* status.

  **Elena:** Detention is a preventive measure, not a punitive one. We detain to stop them fighting, not because they are guilty.
  You are clinging to the idea that moral truth must map onto battlefield permissions. I am telling you that battlefield permissions are a social construct designed to limit bloodshed.
  If we adopt your view, and Private A believes you, he must lay down his arms. If he lays down his arms, Private B might still kill him by accident, or his own officers might execute him for treason.
  By insisting on the Moral Equality of Combatants, I give Private A a reason to follow the laws of war. I give him a stake in the system. If he knows that even if he follows every rule he is still "objectively" a wrongdoer, why should he bother distinguishing between a combatant and a civilian? He has already lost his moral standing.

  **David:** That is the "Necessity" argument. You are saying we must lie to soldiers to keep them civilized.
  I argue that soldiers are moral agents. They deserve the truth. The truth is that killing for an unjust cause is wrong.
  If we tell them the truth, perhaps they will be more hesitant to fight unjust wars. Perhaps democracy will improve if citizens know that joining the army does not grant them a moral shield.
  Your theory insulates the populace from the moral cost of aggression. It says, "Go fight, you are blameless."
  My theory says, "Go fight only if you are sure, because if you are wrong, you are harming the innocent."
  Which theory makes war less likely?

  **Elena:** Which theory makes war less bloody *once it starts*? That is my concern. Once the bullets fly, your distinctions are luxuries.
  In that trench, Private A and Private B are mirrors. They wear the same mud, hold the same steel, fear the same death. To tell them they are not mirrors is to introduce a metaphysical distinction into a physical reality.
  I grant you this: If Private A *knows* his cause is unjust, he loses the privilege. He becomes a bandit.
  But in the case of invincible ignorance? The symmetry of their epistemic position *must* generate a symmetry of moral permission. Otherwise, morality is asking Private A to be a martyr for a truth he cannot access.

  **David:** And I grant you this: We should not punish Private A. He is blameless.
  But we must not say he was *right*.
  If we say he was right, we say Private B was wrong to defend himself against A.
  We cannot sacrifice Private B's right to self-defense to preserve Private A's moral comfort.
  In the end, Elena, you prioritize the rules of the game. I prioritize the value of the lives lost within it.
  If Private B dies, he is dead. No amount of "combatant privilege" brings him back. He was killed by a man who had no just cause to kill him. That is a moral fact that exists regardless of the convention.

  **Elena:** And if we adopt your view, David, we risk a world where no soldier feels bound by the rules, because no soldier feels morally equal to his enemy. We get total war.
  Private B dies either way. The question is whether Private A, upon capturing Private B's brother tomorrow, treats him as a prisoner or a criminal.
  Your theory makes him a criminal. Mine makes him a prisoner.
  I choose the prisoner.

  **David:** And I choose the truth. Even if it is tragic.

  **Moderator:** Thank you. It appears the disagreement rests on whether the "War Convention" creates a moral reality that supersedes individual liability, or whether individual liability persists regardless of the convention. We will leave it there.
