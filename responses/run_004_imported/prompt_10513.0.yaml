answer: |-
  This is a fantastic question, and honestly, your skepticism is the most natural reaction for a working physicist. In fact, if you *didn't* feel that the thermodynamic limit was a bit of a "shady trick" to get the math to work, I'd worry you hadn't been paying attention during your career.

  The tension you're feeling is exactly where the philosophy of physics lives these days. You are looking at the infinite limit as an **instrumental idealization** (like a frictionless plane), while philosophers like Robert Batterman (author of *The Devil in the Details*) are arguing it is a **constitutive idealization**.

  Here is the breakdown of why they make that move, translated into terms that should respect your thirty years of RG intuition.

  ### 1. The Frictionless Plane vs. The Singular Limit
  Your intuition is: *Real systems are finite. Singularities don't exist in nature. Therefore, the infinite limit is a fiction we use to approximate the finite reality.*

  This works perfectly for a frictionless plane. We know friction exists. If we include friction, the object stops. If we remove it, the object slides forever. The idealization removes a causal factor to simplify the calculation, but we know the "real" truth includes friction.

  Batterman argues phase transitions are different. Here's why:
  In a finite system (no matter how large, $N=10^{23}$), the partition function is a sum of finite analytic terms. It is analytic everywhere. **There is no phase transition.** There is only a rapid crossover.
  In the infinite limit, the partition function becomes non-analytic. **There is a phase transition.**

  The philosophical move is this: If you insist on a strictly finite description, **the phenomenon you are trying to explain (the sharp transition) literally does not exist.**

  If you treat the limit as just a "shortcut" (like the frictionless plane), you are saying the sharp transition is an illusion. But experimentally, the transition is the most robust, stable feature of the system. The "crossover" of the finite system is incredibly sensitive to boundary conditions and size, but the "transition" of the infinite system is stable and universal.

  So, the argument is: The "fiction" (infinite limit) captures the stable, observable reality better than the "truth" (finite $N$). If the mathematical fiction is required to describe the physical stability, maybe the "infinity" is pointing to a real structural feature of the world that finite descriptions miss.

  ### 2. Non-Uniform Convergence (The Technical Heart)
  You know the math: the limits don't commute.
  $$ \lim_{h \to 0} \lim_{N \to \infty} M(h, N) \neq \lim_{N \to \infty} \lim_{h \to 0} M(h, N) $$
  (Where $M$ is magnetization and $h$ is the external field).

  For a philosopher, this non-uniform convergence is the smoking gun. It means that for any finite $N$, no matter how huge, there is a region near $T_c$ where the finite system behaves *qualitatively differently* from the infinite one.

  The reductionist says: "But $10^{23}$ is close enough to infinity for all practical purposes (FAPP)."
  The emergentist says: "FAPP is not ontology."

  If the behavior near the critical point depends on taking the limit *before* asking about the observable, then the macroscopic behavior is not smoothly derivable from the microscopic behavior. There is a "break" in the explanation. Batterman argues that this break is where emergence lives. The macroscopic behavior isn't just the sum of the micro; it requires a change in the mathematical structure (analytic to non-analytic) that the micro level cannot support.

  ### 3. Explanatory Irrelevance vs. Ontological Autonomy
  This is the RG part. You know that in RG flow, microscopic details are "irrelevant operators." They flow to zero.

  *   **The Physicist View:** The details are still there, they just average out. The macro is still "made of" the micro.
  *   **The Philosopher View:** If the explanation of the macro phenomenon *requires* us to discard the micro details (not just approximate them, but treat them as irrelevant to the fixed point), then the macro phenomenon is **autonomous**.

  Think of it this way: If I can explain the fluid dynamics of water without knowing if the molecules are $H_2O$ or some hypothetical Lennard-Jones spheres, and the explanation is *better* (more universal) when I ignore the chemical identity, then the "fluidity" isn't a property of the $H_2O$. It's a property of the *collective state*.

  Batterman's claim is that the RG fixed point is a real physical object in the space of theories, and real systems "instantiate" this fixed point. The fact that vastly different micro-systems map to the *same* fixed point suggests the fixed point has a reality that supersedes the micro-details. The "universality" isn't just a coincidence; it's evidence that the macro-level laws are decoupled from the micro-level laws.

  ### 4. Why "Ontological Novelty"?
  You asked: *Why does leaning on a mathematical idealization earn you real metaphysical novelty?*

  The argument isn't that "infinity exists in nature." The argument is that **stability exists in nature, and stability requires the limit.**

  If you have a finite system, fluctuations will eventually kill the order (in low dimensions) or smooth out the transition. The fact that we observe sharp, stable phase transitions in the real world suggests that nature somehow "implements" the physics of the thermodynamic limit, even with finite $N$.

  The "novelty" is the **pattern itself**.
  Imagine a pixelated image.
  *   **Micro:** A grid of black and white squares.
  *   **Macro:** A face.
  If you demand to know "which pixels constitute the nose?", you can't answer. The nose only exists when you blur the image (take the continuum limit).
  The "nose" is ontologically novel because it is not present in the pixel description, even though it is made of pixels. It requires a change in description (blurring/limit) to come into existence.

  Batterman is saying: The critical exponents are the "nose." The Hamiltonian is the "pixels." You cannot find the exponents in the Hamiltonian without taking the limit that destroys the Hamiltonian's finiteness. Therefore, the exponents belong to a different ontological category (the collective field) than the spins.

  ### 5. Summary: The "Devil" is in the Explanation
  To answer your specific frustration: You feel the limit is a shortcut. Batterman argues the limit is the **explanation**.

  If it were just a shortcut, we should be able to derive the "sharp" behavior from the finite system by just doing harder math. But we can't. The finite math says "smooth crossover." The infinite math says "sharp transition."
  Since the world looks like a "sharp transition," the infinite math is capturing something the finite math is blind to.

  Therefore, the "emergence" is the fact that the **macroscopic stability is insensitive to microscopic finiteness.** The "reality" of the emergence is the robustness of the pattern against the details of the substrate.

  **In plain terms:**
  The philosopher isn't saying "Infinite atoms exist."
  They are saying: "The behavior of this system is governed by rules (scaling laws) that only make sense if you stop looking at the atoms. Since the behavior is real, the rules that govern it must be real, even if they require a mathematical limit to write down."

  It's not that the frictionless plane is real; it's that for phase transitions, **only** the frictionless plane predicts the skid marks we actually see. The "skid marks" (critical exponents) are the real things, and they demand the idealization to exist.

  Does that help bridge the gap? It shifts the "reality" from the *infinity* to the *insensitivity* that the infinity represents.
