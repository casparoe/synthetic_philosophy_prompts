      Act: Overriding a safety lock on a deep-sea drill.
      Mechanism: A "shadow code" in the system ready to execute the override if he tries to abort.
      Outcome: He executes the override himself.
      Tone: Quiet, tense, internal.

      *Wait, the prompt says "her".* I must use a female protagonist.
      *Protagonist:* Elena.
      *Act:* Initiating a lockdown that traps workers outside to protect the core.
      *Mechanism:* Automated system ready to lock if she hesitates.
      *She does it herself.*
      *This is good.* It's a trolley problem variant but operational.

      *Wait, let's make it more subtle.*
      *Protagonist:* Clara.
      *Act:* Deleting a file that proves her mentor's fraud.
      *Mechanism:* A virus ready to delete it if she copies it instead.
      *She deletes it herself.*
      *This is intimate. Betrayal of trust vs. self-preservation.*

      *Let's write about Clara.*
      *Setting:* Late night office.
      *The Mechanism:* A "compliance daemon" in her workstation.
      *The Act:* Hitting 'Delete'.
      *The Feeling:* She feels like she's choosing. The reader knows the daemon is there.

      *Word Count Check:* 800-1200 words.
      *Focus:* Internal monologue, the weight of the finger on the mouse, the silence of the room.
      *Ending:* The deletion completes. The daemon sleeps. She feels guilt/pride? Ambiguous.

  4.  **Drafting - Section by Section:**
      *   **Opening:** Establish the setting and the file. The weight of the decision.
      *   **Middle:** The hesitation. The internal justification. The presence of the mechanism (subtle hints or omniscient narration). Let's use omniscient narration to ensure the reader knows about the mechanism, creating the irony.
      *   **Climax:** The click.
      *   **Ending:** The aftermath. The mechanism remains dormant. Her feeling of responsibility.

  5.  **Refining the Mechanism:**
      *   It needs to be undetectable to her.
      *   Narrator knows: "The script waited in the background..."
      *   She thinks: "I am doing this."
      *   Reality: "She could not have done otherwise."

  6.  **Writing - Focus on Sensory Details:**
      *   The hum of the server.
      *   The glow of the screen.
      *   The sweat on her palm.
      *   The cursor blinking.

  7.  **Review against Constraints:**
      *   800-1200 words? (Will monitor during drafting).
      *   No assassination? (Check: Corporate fraud cover-up).
      *   No unmasking/fight back? (Check: Mechanism stays hidden).
      *   No lecture? (Check: Show the situation).
      *   Open ending on blame? (Check: She feels guilt, but was it free?).

  8.  **Drafting Thought Process:**
      *   Start with the cursor.
      *   Introduce the file name. "Audit_Trail_Final.xlsx".
      *   Introduce the stake: Her career, her mentor's reputation.
      *   Introduce the mechanism subtly in the narration. "Unseen, a secondary process watched..."
      *   She rationalizes. "He didn't know." "It was for the greater good."
      *   She clicks.
