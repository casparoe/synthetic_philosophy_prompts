      *   She sits back. Was it her?

      *Self-Correction on Mechanism:* If I tell the reader explicitly about the mechanism too early, it becomes a sci-fi story about mind control. If I hide it until the end, it's a twist. The prompt says "whether or not the reader is let in on it." To make the *philosophical point* land, the reader needs to know the constraint exists while she acts. Otherwise, it's just a story about guilt. I need to balance the narration so the reader knows she *couldn't* have done otherwise, while she believes she *can*.
