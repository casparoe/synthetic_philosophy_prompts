answer: |-
  **Title:** The Maxim of the Machine
  **Characters:**
  *   **ALEX:** Argues that using AI is a violation of an imperfect duty (Contradiction in the Will).
  *   **JORDAN:** Argues that using AI is a violation of a perfect duty (Contradiction in Conception).

  **Setting:** A university library study room, late evening. Papers and laptops are scattered across the table.

  **ALEX:** We've been circling the same drain for an hour, Jordan. We're not disagreeing about Kant. We're disagreeing about the sentence we feed into the machine.

  **JORDAN:** The maxim *is* the moral description of the act. If you describe it wrong, the test is garbage. Garbage in, garbage out. My maxim is: *"I will submit text generated by an AI as my own original work to fulfill a course requirement."*

  **ALEX:** That's loaded. "As my own original work." You've baked the deception into the description. That's why you get a Contradiction in Conception. It's basically the false-promising case dressed up in silicon.

  **JORDAN:** Because it *is* the false-promising case! When you submit an essay, there is a tacit agreement: "This is evidence of *my* cognition." If you paste AI output, you are breaking that promise. If we universalize that—*"Everyone will submit AI text as their own cognition"*—the practice collapses. Teachers can no longer assess understanding via essays. The very concept of a "take-home essay" becomes impossible. That is a strict logical contradiction. It's a perfect duty. Don't do it. Ever.

  **ALEX:** But that relies on a factual prediction that the *practice* must collapse rather than *adapt*. Look at your universalized world again. Everyone submits AI work. Do schools close? No. Do they stop educating? No. They switch to oral defenses. They switch to in-class handwritten exams. They use AI detectors. The *institution* of education survives. The maxim is conceivable. You can imagine that world without a logical explosion.

  **JORDAN:** You're conflating the *institution* with the *specific practice*. Kant's test asks if the maxim can be a universal law of nature. If everyone submits AI work as their own, the specific act of "submitting a take-home essay as proof of understanding" loses its meaning. It's like promising to pay back money while knowing you won't. If everyone did that, "promising" itself would vanish. You can't say, "Well, people would just switch to bartering," to save the promise. The specific maxim destroys the specific condition that makes the act possible.

  **ALEX:** Okay, but that's because you defined the maxim around the *submission*. What if I define it around the *learning*? *"I will use available tools to maximize efficiency in demonstrating competence, provided I still master the underlying material."*

  **JORDAN:** [Laughs] That's not a maxim of action; that's a marketing slogan. A maxim has to be specific enough to guide the will *now*. You aren't willing "mastery." You are willing "copy-paste." If you broaden the maxim to hide the deception, you're gaming the test. That's the "too narrow/too broad" objection to Kant, and you're using it to cheat.

  **ALEX:** I'm not cheating, I'm contextualizing! Kant says we must act on maxims we can will as universal law. Why is the relevant context "the specific assignment rules" and not "the pursuit of education"? If I universalize *"Students will use AI to draft, then edit for understanding,"* there is no contradiction in conception. Schools might change grading rubrics, sure. But the world doesn't end.

  **JORDAN:** But would you *will* that world? That's your fallback, isn't it? You know the Conception test fails if we're honest about the deception, so you want to push this to a Contradiction in the Will. You want to make it an imperfect duty. *"It's bad if everyone does it, but maybe okay for me this once because I'm sick,"* or whatever.

  **ALEX:** No, not an exception. I'm saying it's a duty to develop your talents. If I use AI to handle the drudgery so I can focus on high-level synthesis, maybe I'm *better* fulfilling the duty to develop my talents. But even if I'm not... look, a Contradiction in the Will means the world is conceivable, but a rational agent couldn't want it. I grant you that. A world where no one writes their own essays is a world where human critical atrophy happens. I wouldn't will that. But that makes it an *imperfect* duty. It means I have a duty to write my own essays *generally*, but it allows for weighing against other ends. Maybe I have a conflicting duty to care for a sick relative tonight. If it's a perfect duty, I can't submit the AI essay even if my mom is in the ER. If it's imperfect, I can weigh the competing duties.

  **JORDAN:** See, that's the danger. You're turning a duty of truth into a utilitarian calculation. "How much cheating can I fit in before the system breaks?" If it's a Contradiction in Conception, it's forbidden. Period. No weighing. And it *is* a Contradiction in Conception because the act relies on a distinction that the universalization erases. The act relies on *you* being the author. Universalization makes *no one* the author. The act becomes impossible to perform *as intended*.

  **ALEX:** But the intention isn't "to be the author." The intention is "to get the grade."

  **JORDAN:** [Leans forward] There it is. That's the disagreement. You think the maxim is *"Get the grade efficiently."* I think the maxim is *"Claim credit for unearned labor."*

  **ALEX:** Is it unearned if I prompt-engineer, edit, and verify?

  **JORDAN:** Is it a promise if you add asterisks to the signature? Alex, we're stuck because we aren't disagreeing about what happens in the universalized world. We both agree schools would freak out. We both agree trust would erode.

  **ALEX:** I agree trust would erode. I disagree that the *concept* of student submission becomes logically impossible. It just becomes high-risk.

  **JORDAN:** That's a factual dispute. You think the institution adapts; I think the specific practice dies. But I think the deeper split is prior to that. It's about how we individuate actions. I'm saying the moral content of the act is located in the *claim of authorship*. You're saying the moral content is located in the *educational outcome*.

  **ALEX:** Exactly. For you, the wrong is the lie. For me, the wrong is the self-degradation.

  **JORDAN:** If the wrong is the lie, it's a Perfect Duty. Violating it contradicts the very possibility of communication. If the wrong is self-degradation, it's an Imperfect Duty. Violating it contradicts what we *want* for humanity, but not the logic of the act itself.

  **ALEX:** So, if I can convince you that "using AI" isn't inherently "lying," my test passes Conception and moves to Will.

  **JORDAN:** And if I can convince you that "submitting for a grade" inherently entails "claiming authorship," your test fails Conception immediately. We aren't fighting about Kant's formula. We're fighting about the description of the technology.

  **ALEX:** [Sighs, closing laptop] So the project isn't about applying the test. It's about arguing for the correct maxim formulation *before* the test.

  **JORDAN:** Which is always the hard part. Kant doesn't give us an algorithm for writing the maxim. He just gives us the test for what comes after.

  **ALEX:** Okay. So for the project, we document the impasse. We show that the Universalizability Test yields different results depending on whether we prioritize the *social convention* of submission (your view) or the *functional goal* of education (my view).

  **JORDAN:** And we conclude that the disagreement isn't empirical. It's not about whether schools *would* adapt. It's normative. It's about whether the moral weight of the act rests on the *procedure* (honesty) or the *telos* (learning).

  **ALEX:** If it's procedure, it's a Perfect Duty. If it's telos, it's Imperfect.

  **JORDAN:** And since Kant prioritizes Perfect Duties over Imperfect ones...

  **ALEX:** ...If there's any doubt about the lie, the strict reading wins.

  **JORDAN:** [Pauses] I'm not conceding the point, Alex.

  **ALEX:** I know. But at least now we know why we're stuck. We're not testing the maxim. We're arguing over which maxim is the real one.

  **JORDAN:** Fine. Let's write that down. But I'm still citing the False-Promising analogy.

  **ALEX:** Only if I get a footnote arguing that AI is a tool, not a promise.

  **JORDAN:** Deal.
