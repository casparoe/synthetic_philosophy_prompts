      *   Make sure to explicitly answer the "Success vs. Corruption" question. (Answer: Both, but mostly corruption of the *purpose*).

  7.  **Self-Correction/Nuance Check:**
      *   *Did Neurath hate all scaling?* He hated scaling for *quantity*. Scaling for emphasis might be okay, but not for data.
      *   *Is IKEA really ISOTYPE?* IKEA is instructional, not statistical. Important distinction. Neurath wanted to visualize *social facts*, not assembly steps.
      *   *Emojis:* They are emotional/linguistic, not statistical.
