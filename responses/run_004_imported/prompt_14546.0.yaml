answer: |-
  This is one of the most sophisticated tensions in Jewish thought, and you have identified the exact fault line where a Maimonidean protagonist would stand. The contradiction between the *Guide for the Perplexed* (where sacrifice is a historical concession) and the *Mishneh Torah* (where it is eternal law) is not an oversight; it is a deliberate esoteric device. Maimonides wrote the *Code* for the community to maintain social and religious order, and the *Guide* for the intellectual elite to understand the philosophical truth.

  If your protagonist is to argue from a "historically serious" Maimonidean position, she cannot simply say, "Maimonides didn't really mean the sacrifices." She must argue from **agency, timing, and teleology.**

  Here is how a rigorous Maimonidean rebuttal would look, broken down into the three arguments she could deploy against the zealot.

  ### 1. The Argument of Agency (The Messianic Test)
  The zealot's strongest card is the *Mishneh Torah*, *Hilchot Melachim* (Laws of Kings), where Maimonides codifies that the Messiah will rebuild the Temple and restore sacrifices. The zealot argues: "Maimonides says it happens; we are making it happen."

  **The Maimonidean Counter:**
  Maimonides places the rebuilding of the Temple *after* the Messiah has been unequivocally identified, not *before*. In *Hilchot Melachim* 11:4, Maimonides lays out a strict test for the Messiah: he must fight the wars of God, succeed, gather the exiles, and *then* build the Temple. Crucially, Maimonides writes that if a candidate arises and fails to complete these tasks or is killed, "it is known that he is not the one promised."

  **The Trap:** By attempting to rebuild the Temple *now*, through human political sovereignty rather than prophetic confirmation, the circle is effectively claiming Messianic status for the current era or the State itself. For a Maimonidean, this is a category error. The *Mishneh Torah* binds the Temple to the **Messiah**, not to **Zionism**.
  *   **Dialogue Hook:** "Maimonides binds the altar to the King, not the land. You are trying to build the House before the Architect has been verified. In the *Code*, the Temple is the *consequence* of redemption, not the *instrument* to achieve it. By reversing the order, you aren't fulfilling Maimonides' law; you are violating his conditions."

  ### 2. The Argument of Teleology (The "Concession" Revisited)
  The zealot will argue that the *Guide* is philosophy, but the *Code* is law, and law trumps philosophy.

  **The Maimonidean Counter:**
  In *Guide* III:32, Maimonides argues that God's primary will is not the blood of animals, but the ethical and intellectual perfection of humanity. Sacrifice was permitted because "human nature cannot suddenly abandon all to which it was accustomed." It was a divine stratagem to wean Israel off idolatry.

  While Maimonides does not explicitly say sacrifices will be abolished in the future (he is too careful a legalist to nullify a commandment), he implies that the *purpose* of the Messianic age is the universal knowledge of God (*Guide* III:11, *Melachim* 12:4). He writes that in that time, "there will be neither famine nor war... and the occupation of the entire world will be solely to know the Lord."

  **The Trap:** If the goal of history is intellectual apprehension of God, then rushing to restore a "concessionary" ritual—one designed for a primitive psychological state—is a regression. It prioritizes the *method* of worship (blood) over the *goal* of worship (knowledge). A Maimonidean would argue that restoring sacrifice without the universal peace and knowledge that defines the Messianic era is empty ritualism, precisely the "habit" Maimonides warned against.
  *   **Dialogue Hook:** "You treat the sacrifice as the goal. Maimonides treats it as the crutch. He says God allowed it because we were addicted to idolatry. Are you telling me we are so spiritually impoverished now that we *need* the crutch? Or are you just in love with the blood because it feels more real than prayer? Maimonides says the higher service is the mind. You are trying to drag us back to the slaughterhouse."

  ### 3. The Argument of Prophecy (The Red Heifer Specifics)
  The circle is breeding a Red Heifer. This is a specific halakhic vulnerability.

  **The Maimonidean Counter:**
  In *Hilchot Parah Adumah* (Laws of the Red Heifer), Maimonides rules that the ashes are required for purity. However, in *Hilchot Beit HaBechirah* (Laws of the Chosen House), he states that the location of the altar must be determined by a prophet. You cannot simply survey the land and guess. The sanctity of the Temple Mount relies on the *Shekhinah* (Divine Presence), which is not subject to human calculation.

  Furthermore, Maimonides holds that prophecy is only granted to a sage who has mastered his intellect and is not in a state of sadness or disaffection (a key point for your protagonist). The current political and spiritual state of the world does not meet the Maimonidean criteria for prophecy. Without prophecy, the location is unknown. Without the location, the sacrifice is *piggul* (invalid/abominable).
  *   **Dialogue Hook:** "Maimonides says the altar's place is known by prophecy, not by archaeology. Where is your prophet? You have vestments and vessels, but you have no voice from the cloud. Without that, you aren't building a Temple. You're building a stage set."

  ### The "Unresolved" Tension for the Scene
  The beauty of this for your novel is that Maimonides *never* fully resolves the tension. He does not say "Sacrifices will stop." He leaves the door open. This allows the zealot to have a legitimate answer, which makes the scene dramatic rather than a lecture.

  **The Zealot's Maimonidean Reply:**
  The zealot can argue that Maimonides' "concession" theory explains the *past*, not the *future*. Once the Messiah comes and the *yetzer hara* (evil inclination) is removed, sacrifice will no longer be a concession to idolatry but a pure act of divine will. They might argue that the "human effort" *is* the Messianic process (a view more associated with Rav Kook, but they often conflate the two). They could say: "Maimonides codified the law for a reason. If God wanted it abolished, He would have told us through Moses. You are using philosophy to nullify commandments. That is the Karaites' path."

  **The Protagonist's Internal Conflict:**
  Your protagonist should feel the weight of the *Code*. She knows Maimonides demands obedience to the law even when the reason is obscure. Her disaffection comes from the suspicion that the zealots are ignoring the *Guide's* warning: that focusing on the external ritual distracts from the internal perfection.

  ### Summary of the "Historically Serious" Position
  If Maimonides were cornered by this movement, his response would likely be:

  1.  **Do not force the End:** Calculating the End of Days or forcing the Messianic timeline is forbidden (*Hilchot Melachim* 12:2).
  2.  **Verify the Messiah:** The Temple is the *sign* of the Messiah, not the *cause*. Building it now presumes a redemption that has not been legally verified.
  3.  **Intellectual Priority:** The ultimate worship is knowledge of God. Restoring a ritual designed for a less enlightened age, without the accompanying universal knowledge, is a spiritual regression.

  **Suggested Textual Reference for the Scene:**
  Have the protagonist quote *Guide* III:51, where Maimonides describes the highest level of worship: "The intellect that has overflowed unto him... turns him toward God... and he is with God always." Then contrast it with the zealot's focus on the physical ashes of the heifer. The tension is between **Imitatio Dei** (imitating God's attributes through intellect) and **Avodah Shebalev** (service of the heart/ritual).

  This approach keeps the protagonist within the tradition (she isn't rejecting Maimonides; she is using the *Guide* to interpret the *Code*) while highlighting the danger of the zealots' project (they are using the *Code* to ignore the *Guide's* psychological insights). It makes the conflict internal to Judaism, rather than Secular vs. Religious.
