answer: |-
  You and your friend have stumbled onto one of the most famous and debated distinctions in the history of economic thought. Your intuition is sharp: if you read the "shoe" passage in isolation, it does look like Aristotle is condemning *any* exchange for money as "improper."

  However, Aristotle is not being inconsistent. The confusion arises because the "shoe" passage describes the **mechanics** of exchange, while the condemnation of "unnatural" wealth-getting describes the **teleology** (the end goal) of exchange.

  Here is the breakdown of what is actually doing the "real work" in Aristotle's argument, why the farmer gets a pass (mostly), and where your friend stands on the day-trading issue.

  ### 1. "Proper" vs. "Improper" Use is not "Good" vs. "Evil"
  Your objection hinges on the word "improper." In modern English, "improper" suggests something unethical. In Aristotle's Greek (*chresis* vs. *metabolē*), the distinction is **teleological**, not moral.

  *   **Proper Use:** The thing is used for the end for which it was created (a shoe is for protecting the foot).
  *   **Secondary (Improper) Use:** The thing is used as a means to something else (a shoe is traded for food).

  Aristotle admits that secondary use is necessary. Households cannot produce everything they need. Therefore, exchanging a shoe for food is **natural and blameless**, provided the exchange is made to acquire the food (a good for the household), not to accumulate the money itself.

  The "improper" use only becomes **unnatural** when the secondary use displaces the primary end. If you start collecting shoes not to wear them or to trade them for food, but simply to have more shoes (or the money they represent), you have perverted the nature of the shoe.

  ### 2. The Real Distinction: *Oikonomia* vs. *Chrematistike*
  The "real work" in Aristotle's argument is done by the distinction between two types of wealth-getting:

  1.  **Natural Wealth-Getting (*Oikonomike*):** This is part of household management. The goal is **self-sufficiency** (*autarkeia*). You acquire goods (wheat, shoes, tools) to sustain the good life of the household.
      *   **The Limit:** It is limited by **need**. Once the household has enough wheat to eat and enough coin to buy the wine and oil it lacks, acquisition stops.
      *   **The Circuit:** Commodity → Money → Commodity (C-M-C). You sell wheat to get money to buy olive oil. The money is just a medium.

  2.  **Unnatural Wealth-Getting (*Chrematistike*):** This is the art of getting rich. The goal is the **accumulation of money**.
      *   **The Limit:** It is **unlimited**. Money can always be increased. There is no "enough."
      *   **The Circuit:** Money → Commodity → More Money (M-C-M'). You buy wheat not to eat it, but to sell it for a profit. The commodity is just a medium.

  ### 3. Resolving the Farmer vs. Shoe Paradox
  So, is the farmer selling wheat for coin using the wheat "improperly"?

  **Yes, but that's okay.**

  Aristotle acknowledges that using wheat for exchange is a "secondary" use (its primary use is nutrition). However, it remains **natural** wealth-getting *as long as the coin is used to complete the household's self-sufficiency.*

  *   **Natural Farmer:** Grows wheat. Eats some. Sells surplus for coin. Uses coin to buy tools/wine. **Stop.**
      *   *Verdict:* This is *Oikonomia*. The exchange was a means to an end (the good life).
  *   **Unnatural Farmer:** Grows wheat. Sells all of it. Uses coin to buy more land to grow more wheat to sell for more coin.
      *   *Verdict:* This is *Chrematistike*. The exchange became an end in itself.

  The "shoe" passage warns us that exchange is not the *primary purpose* of objects. But Aristotle allows secondary purposes when they serve the primary purpose of the *household*. He condemns it only when the secondary purpose (exchange) becomes the primary purpose of the *human life*.

  ### 4. Who is Right? You or Your Friend?
  **Your friend is mostly right, but with nuances.**

  *   **Day-Trading:** Aristotle would condemn this unequivocally. It is pure M-C-M' (or even M-M'). Money is being used to breed money without producing any actual goods for the household or state. It is the epitome of "unnatural" wealth-getting because it has no limit and produces nothing useful.
  *   **The Landlord:** This is trickier. If a landlord rents out rooms to maintain a single estate that supports their family, Aristotle might tolerate it as household management. But if they are buying properties solely for yield and appreciation (accumulation), it falls under *Chrematistike*.
  *   **The Farmer:** Your friend is right that Aristotle is "fine" with the farmer, *but only if* the farmer is selling surplus to meet needs. If the farmer is an agribusiness owner maximizing profit margins, Aristotle would classify them alongside the day-trader.

  ### 5. Is Aristotle Inconsistent?
  He is not inconsistent, but he is relying on a metaphysical view of "Nature" that modern economics rejects.

  For Aristotle, "Natural" means "in accordance with the proper end (*telos*) of human beings." Since humans need food and shelter to practice virtue, acquiring those things is natural. Since humans do *not* need infinite coin to practice virtue, acquiring infinite coin is unnatural.

  The "shoe" argument holds up **if** you accept his premise that objects have inherent purposes.
  *   **Your objection:** "If exchanging a shoe is improper, exchanging wheat must be too."
  *   **Aristotle's reply:** "Exchanging wheat is also a secondary use. But secondary uses are permissible when they serve the natural end of the household. They become unnatural only when they serve the unnatural end of unlimited accumulation."

  ### Summary
  The distinction isn't about **what** is being traded (shoes, wheat, stocks) or even **whether** money is used. The distinction is about **why**.

  *   **Natural:** Trade to live. (Limited by need).
  *   **Unnatural:** Live to trade. (Unlimited by profit).

  You weren't being dense; you spotted that the mechanical act of selling for coin is the same in both cases. But Aristotle argues that the *moral quality* of the act changes based on the intention and the limit. Your friend wins the bet on day-trading, but you win the point that the "shoe" analogy requires the context of *limits* to make sense.
