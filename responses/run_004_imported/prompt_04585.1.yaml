  2.  **Recall/Research Aristotle's *Politics* Book I:**
      *   *Key Concepts:* *Oikonomia* (household management) vs. *Chrematistike* (wealth-getting).
      *   *Natural Wealth:* Acquiring goods necessary for the good life (food, shelter, tools) for the sake of the household/state. Limited by need.
      *   *Unnatural Wealth:* Acquiring money for the sake of money. Unlimited accumulation.
      *   *The Progression of Exchange:*
          1.  Direct Barter (Surplus for Deficit): Natural.
          2.  Retail Trade (Using money as a medium to get goods): Borderline, but acceptable if limited to need.
          3.  Usury/Speculation (Money breeding money): Unnatural.
      *   *The Shoe Passage:* Aristotle distinguishes between the *use value* (wearing) and the *exchange value* (trading). He says exchange is *not* the primary purpose, but he doesn't condemn all exchange. He condemns exchange *for profit* beyond need.

  3.  **Address the User's Specific Objection (The Shoe Analogy):**
      *   The user interprets "improper use" as "morally wrong" or "condemned."
      *   *Correction:* Aristotle distinguishes between "proper/primary" (teleological purpose) and "improper/secondary" (incidental utility). Just because something is secondary doesn't mean it's *unethical* in all contexts. It becomes unethical when the secondary use *displaces* the primary end.
      *   *Application to Wheat:*
          *   Farmer grows wheat -> Primary end: Food for household.
