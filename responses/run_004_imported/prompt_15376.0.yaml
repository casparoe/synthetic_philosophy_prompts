          *   Tails (50%): No duplication. One person wakes up (Original).
      *   **Protagonist's Perspective:** She wakes up. She doesn't know the coin result. She doesn't know if she's the original or a copy (if one exists).
      *   **Question:** What is the probability (from her perspective, upon waking) that the coin landed Heads?
      *   **Conflict:** Critique partner says 50/50 (Halfer position). Protagonist/Author thinks it should shift (Thirder position).
      *   **Goal:** Settle the debate with rigorous reasoning suitable for a novel.

  2.  **Identify the Philosophical Framework:**
      *   This is a classic variation of the **Sleeping Beauty Problem**.
      *   In the standard Sleeping Beauty problem:
          *   Coin flip.
          *   Heads: Wake once (Monday).
          *   Tails: Wake twice (Monday & Tuesday, with memory wipe in between).
          *   Question: Upon waking, what is the credence that the coin was Heads?
      *   In *this* specific sci-fi scenario:
          *   Coin flip.
          *   Heads: Two observers exist simultaneously (Original + Copy).
          *   Tails: One observer exists.
          *   Question: Upon waking, what is the credence that the coin was Heads?
      *   This is specifically the **Self-Indication Assumption (SIA)** vs. **Self-Sampling Assumption (SSA)** debate.

  3.  **Evaluate the Arguments:**

      *   **The "Halfer" Argument (Critique Partner):**
          *   The coin is fair. $P(\text{Heads}) = 0.5$.
          *   Waking up provides no *new* information about the coin flip itself. She knew she would wake up regardless of the outcome.
          *   Therefore, the probability remains 50%.
          *   *Strength:* Aligns with standard frequentist probability of the coin toss.
          *   *Weakness:* Ignores the observer selection effect. There are more "slots" for her consciousness to occupy in the Heads world.

      *   **The "Thirder" Argument (Author/Protagonist):**
          *   Consider the possible "observer moments."
          *   If Tails: 1 person wakes up.
          *   If Heads: 2 people wake up.
          *   Total waking instances = 3 (1 from Tails, 2 from Heads).
          *   If I am a random waking instance, 2 out of 3 instances occur in the Heads world.
          *   Therefore, $P(\text{Heads}) = 2/3$.
          *   *Strength:* Accounts for the fact that "I am experiencing this" is more likely if there are more "I"s.
          *   *Weakness:* Requires accepting that probability applies to "which observer I am," not just "what the coin did."

      *   **Wait, let's refine the "Thirder" math for *this specific* setup.**
          *   Standard Sleeping Beauty usually yields 1/3 for Heads because Tails creates *two temporal instances* for one person.
