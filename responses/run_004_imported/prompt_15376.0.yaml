      *   **The Name-Drop:** Mention the "Sleeping Beauty Problem." It gives the character intellectual ammo.
      *   **The "Halfer" Case (Critique Partner):** Objective probability. Coin physics.
      *   **The "Thirder" Case (Protagonist):** Subjective probability. Observer selection. The "Betting Test."
      *   **The Scene Advice:** How to write it. Don't make it a math lecture. Make it about *weight* and *existence*.
