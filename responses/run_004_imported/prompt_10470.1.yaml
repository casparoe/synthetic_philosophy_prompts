  9.  **Final Polish:** Ensure the distinction between "Risk" and "Ambiguity" is clear. Ensure the "Comparison" point is addressed through Regret Theory or Justification. (Proceed to generate output).

  *(Self-Correction during drafting)*: I should make sure not to simply say "you are right." I need to present the arguments *for* and *against* so the user can take them to their seminar. The prompt asks for an "outside opinion," implying a dialectical engagement.

