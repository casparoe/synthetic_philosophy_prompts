prompt: |-
  So I've been down a bit of a rabbit hole this week, re-reading Yudkowsky's old "Meta-Honesty" post and the LW threads arguing about whether an honesty norm should bind to the literal truth of your words or to the belief you're trying to cause in the listener (the classic "technically true but misleading" problem). Somebody in a comment section mentioned, almost offhand, that Augustine ran into basically this exact snag back in 395 AD in his treatise De Mendacio ("On Lying"), and that he never really resolves it. I got curious and dug up the old Nicene and Post-Nicene Fathers translation. Funny detail before you even get to the content: in his Retractations, Augustine looks back on this book and admits its "obscure, and intricate, and altogether troublesome," and says he wanted it suppressed from his own collected works — which tracks, honestly, because the prose is a slog, full of nested hypotheticals and double negatives.

  Here's the bit I can't fully untangle (section 4 of the treatise, H. Browne's translation):

  "But it may be a very nice question whether in the absence of all will to deceive, lying is altogether absent... The one, who knows or thinks he says a false thing, and says it on purpose that he may not deceive: as, if he knows a certain road to be beset by robbers, and fearing lest some person for whose safety he is anxious should go by that road, which person he knows does not trust him, should tell him that that road has no robbers, on purpose that he may not go by it, as he will think there are robbers there precisely because the other has told him there are none, and he is resolved not to believe him, accounting him a liar. The other, who knowing or thinking that to be true which he says, says it on purpose that he may deceive: for instance, if he tells a person who does not believe him, that there are robbers in that road where he really knows them to be, that he to whom he tells it may the rather go by that road and so fall among robbers, because he thinks that to be false, which the other told him. Which then of these lies?... For if a lie is an utterance with will of uttering a false thing, that man has rather lied who willed to say a false thing, and said what he willed, albeit he said it of set purpose not to deceive. But if a lie is any utterance whatever with will to deceive; then not the former has lied, but the latter, who even in speaking truth willed to deceive. And if a lie is an utterance with will of any falsity, both have lied; because both the former willed his utterance to be false, and the latter willed a false thing to be believed concerning his utterance which was true. Further, if a lie is an utterance of a person wishing to utter a false thing that he may deceive, neither has lied; because both the former in saying a false thing had the will to make a true thing believed, and the latter to say a true thing in order that he might make a false thing believed."

  He just leaves it there, unresolved, and moves on to the next case. Could you help me actually pin this down? Concretely: (1) restate what's going on with "guy A" and "guy B" in plain terms so I know I've got the two cases straight, (2) explain why the choice between those four definitions of "lie" he lists actually matters, i.e. why this isn't just scholastic hairsplitting, (3) a bit earlier, in section 3, Augustine gives what sounds like his real official definition — you're judged a liar by "the sense of his own mind, not... the verity or falsity of the things themselves," meaning it's about matching your own belief, not about deceiving anyone — so which of the four verdicts above does that definition actually commit him to, and does he seem at all bothered that it makes guy B (who is trying to get someone killed) come out as not-a-liar, and (4) say something about why this puzzle is arguably a nastier test case for a strict honesty norm than the standard Kant's-murderer-at-the-door scenario, given that here nobody's even asking whether lying is justified — the fight is just over who counts as having lied in the first place.
