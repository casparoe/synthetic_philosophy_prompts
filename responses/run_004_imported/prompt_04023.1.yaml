prompt: |-
  I'm putting together a session for my grad seminar on practical rationality and want to pressure-test an argument before I inflict it on the students. You know the standard money-pump story: if your preferences over A, B and C are cyclic (A over B, B over C, but C over A), a sufficiently patient bookie can walk you through a sequence of trades -- each one a trade you'd make given just the two options on offer at that moment -- charging you a small fee each time, and leave you back where you started, over and over, for as much money as they like. This is usually presented as a knock-down case that cyclic preferences aren't merely imprudent but flatly irrational, on a par with holding inconsistent beliefs.

  Thing is, I've never fully bought that this settles it, mostly because of the resolute-choice move out of McClennen: an agent who just commits to a plan at the outset of the sequence and sticks to it, even at the node where they'd "locally" prefer to defect, never gets pumped. A colleague of mine down the hall thinks this is basically a cheat -- refusing the trade you'd prefer in the moment just IS a further bit of incoherence, so all resoluteness shows is that one irrationality can be used to patch over another, which isnt much of a vindication. I go back and forth on this, honestly, but I'd like to see the strongest version of the pro-resolute-choice case laid out properly, since most treatments I've seen just assert that resoluteness "solves" the problem without doing the work.

  So here's what I want: argue, as rigorously as you can, that a resolute chooser with cyclic preferences is not thereby irrational, and that the money-pump argument therefore fails to establish transitivity (or even mere acyclicity) as a requirement of practical rationality. Don't just wave at resoluteness -- actually engage with the mechanics. In particular, say something about why declining the trade at a given node doesn't require that your preference at that node has secretly changed (which would just concede that the intransitivity was never real to begin with), and how this differs, if it does, from the ordinary sophisticated backward-induction story we tell about agents whose preferences change over time because of something like hyperbolic discounting -- where its uncontroversial that planning ahead is rational precisely because the future self really does have different preferences.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Grad seminar on practical rationality.
      *   **Topic:** Money-pump arguments against cyclic preferences (intransitivity) vs. Resolute Choice (McClennen).
      *   **Goal:** Argue *for* the resolute chooser. Specifically, argue that a resolute chooser with cyclic preferences is *not* irrational, and thus the money-pump argument fails to establish transitivity as a requirement of rationality.
      *   **Key Constraints:**
          *   Be rigorous.
          *   Don't just assert resoluteness solves it; engage with the mechanics.
          *   Address the "preference change" objection (i.e., explain why declining a trade doesn't mean preferences secretly changed).
          *   Distinguish this from sophisticated choice in cases of dynamic inconsistency (like hyperbolic discounting).
          *   Address the colleague's objection (that resoluteness is just patching one irrationality with another).

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *The Money Pump:* Shows that cyclic preferences ($A \succ B \succ C \succ A$) lead to sure loss if the agent maximizes locally at every node.
      *   *The Standard Conclusion:* Cyclic preferences are irrational.
      *   *The Resolute Choice Counter:* If the agent adopts a plan at $t_0$ and sticks to it at $t_1, t_2$, etc., they avoid the loss.
      *   *The Objection (Colleague):* Sticking to the plan requires ignoring local preferences. If you prefer $B$ to $A$ at $t_1$, but choose $A$ because of a plan, aren't you acting against your preferences? Isn't that irrational? Or does it mean your preference wasn't really $B \succ A$?
      *   *The Hyperbolic Discounting Analogy:* In dynamic inconsistency (e.g., eat cake now vs. diet later), sophisticated choice involves recognizing future preference change. Resolute choice here seems different because the preferences aren't *changing* over time; they are cyclic structurally.

  3.  **Formulate the Argument for Resolute Choice:**
      *   *Thesis:* Rationality is about the governance of action over time, not just local maximization. Resolute choice is a distinct mode of agency that validates cyclic preferences as coherent within a temporal framework.
      *   *Key Distinction:* Local vs. Global Rationality. The money pump assumes local maximization is the *only* rational norm. Resolute choice challenges this norm.
      *   *Addressing Preference Stability:* The crucial move is to deny that "preference" is exhausted by "choice at a node." Preferences can be plan-relative.
      *   *Addressing the Colleague:* It's not patching irrationality; it's recognizing a higher-order rational norm (diachronic coherence) that overrides local optimization.
      *   *Distinguishing from Hyperbolic Discounting:* In hyperbolic discounting, the utility function *changes*. In cyclic preferences, the valuation structure is *static but non-transitive*. Resoluteness in hyperbolic discounting is about binding a *different* future self. Resoluteness in cyclic preferences is about honoring a *single* self's global structure.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the money pump but state the thesis: The money pump relies on a contested assumption (Separability/Local Maximization). Resolute choice rejects this without incoherence.
      *   **The Mechanics of the Pump & The Separability Assumption:** Explicitly define what allows the pump to work. It's not just the cycles; it's the assumption that choices at node $N$ depend *only* on the subtree at $N$ (Separability). McClennen's move is to reject Separability.
      *   **Defending Resoluteness (The "No Preference Change" Move):** This is the trickiest part. How do I choose $A$ over $B$ at $t_1$ if I prefer $B$ over $A$?
          *   *Argument:* Preferences are not atomistic. They are sensitive to the *context of choice*, which includes the history and the plan.
          *   *Concept:* "Plan-Relative Preferences." At $t_1$, the choice isn't just "Keep B or Trade for C?" It's "Stick to Plan P (ending in A) or Deviate (ending in loss)?"
          *   *Reframing:* The agent doesn't prefer $B$ to $A$ *simpliciter* at $t_1$. They prefer $B$ to $A$ *ceteris paribus*. But *ceteris* are not *paribus* because the deviation triggers the pump.
      *   **Addressing the Colleague (The "Patching" Objection):**
          *   The colleague assumes local maximization is constitutive of rationality.
          *   Counter: Diachronic coherence is also constitutive. If we value not being exploited, resoluteness is the rational means.
          *   Analogy: Ulysses and the Sirens. Is Ulysses irrational for tying himself to the mast? No, he's rationally binding his future local impulses to serve his global interest.
      *   **Distinguishing from Hyperbolic Discounting (Sophistication vs. Resolution):**
          *   *Hyperbolic:* $Self_{t0}$ wants Diet. $Self_{t1}$ wants Cake. Preferences *change*. Sophistication acknowledges this conflict between *different* temporal selves.
          *   *Cyclic/Resolute:* $Self_{t0}$ and $Self_{t1}$ share the *same* cyclic structure. The conflict isn't between selves, but between *modes of evaluation* (local vs. global).
          *   *Crucial Point:* In hyperbolic discounting, sophistication often leads to *pre-emption* (removing options). In resolute choice, the option remains, but the *reason for choice* includes the plan.
      *   **Conclusion:** The money pump proves that *separable* agents with cyclic preferences are exploitable. It does not prove that *resolute* agents are irrational. Therefore, transitivity is not a strict requirement for rationality, only for a specific (and arguably limited) kind of agency.

  5.  **Refining the Rigor (Self-Correction/Polishing):**
      *   *Check:* Did I explain *why* preference hasn't changed?
      *   *Refinement:* Use the distinction between "dispositional preference" and "effective choice." Or better, argue that the *object* of preference changes. At $t_1$, the object isn't just the outcome, but the outcome *as part of a sequence*.
      *   *Check:* Is the distinction from hyperbolic discounting clear?
      *   *Refinement:* Emphasize that in hyperbolic discounting, the utility function shifts ($U_{t0} \neq U_{t1}$). In cyclic preferences, the valuation relation is constant ($V$ is always cyclic), but the *scope* of application shifts (local vs. global).
      *   *Tone:* Academic, rigorous, sympathetic to the grad seminar context.

  6.  **Final Review against User Prompt:**
      *   Argue resolute chooser is not irrational? Yes.
      *   Money pump fails to establish transitivity? Yes.
      *   Engage mechanics? Yes (Separability).
      *   Why declining trade $\neq$ preference change? Yes (Plan-relativity).
      *   Differs from hyperbolic discounting? Yes (Static vs. Dynamic preferences).

  7.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on this structure.)
answer: |-
  Here is a rigorous case for the rationality of resolute choice in the face of cyclic preferences, designed to help you pressure-test the argument in your seminar.

  ***

  ### The Case for Resolute Choice: Diachronic Coherence Over Local Separability

  The standard money-pump argument relies on a hidden premise that is often smuggled in as a definition of rationality rather than defended as one. That premise is **Separability** (or Local Maximization): the claim that a rational agent's choice at any decision node must depend solely on the consequences available from that node forward, independent of how the agent arrived there or what plans they previously formed.

  To defend the resolute chooser, we do not need to show that cyclic preferences are *transitive*. We need to show that **Separability is not a necessary condition of rationality.** If Separability is rejected, the money pump is disarmed, and the agent can retain cyclic preferences without exploitation.

  Here is the argument structured for your seminar, addressing the mechanics, the "preference change" objection, and the distinction from dynamic inconsistency.

  #### 1. The Mechanics: Rejecting Separability, Not Preferences
  The money pump works like this:
  1.  You have $A$. You prefer $C$ to $A$. You pay $\epsilon$ to trade $A \to C$.
  2.  You have $C$. You prefer $B$ to $C$. You pay $\epsilon$ to trade $C \to B$.
  3.  You have $B$. You prefer $A$ to $B$. You pay $\epsilon$ to trade $B \to A$.
  4.  You are back at $A$, minus $3\epsilon$.

  The standard conclusion is that your preferences ($A \succ B \succ C \succ A$) are irrational.
  The resolute choice conclusion is that your **decision procedure** was irrational, not your preferences.

  The pump requires that at step 3 (holding $B$, offered $A$), you evaluate the choice *as if it were an isolated event*. If you evaluate it as the final node of a sequence you initiated at step 1, the choice is not between "$A$ vs. $B$." It is between:
  *   **Option 1:** Stick to Plan (Keep $B$). Outcome: End with $B$. Total Cost: $2\epsilon$.
  *   **Option 2:** Deviate from Plan (Trade for $A$). Outcome: End with $A$ (which you will then trade for $C$, etc.). Total Cost: $\infty$ (or at least $3\epsilon$ immediately).

  If the agent is **Resolute**, they treat the plan adopted at $t_0$ as a constraint on choice at $t_n$. McClennen's crucial insight is that rationality includes a norm of **Diachronic Coherence**. An agent is rational if they form a plan that maximizes their global utility (given their preferences) and possess the capacity to execute that plan.

  Therefore, the money pump does not prove cyclic preferences are irrational. It proves that **cyclic preferences + Separability = Exploitability.** Since we can drop Separability while keeping the preferences, the irrationality charge fails.

  #### 2. The "Preference Change" Objection (Addressing your Colleague)
  Your colleague's objection is the most common and potent critique: *"If you prefer $A$ to $B$ at $t_1$, but you choose $B$ because of a plan, you are either acting against your preferences (irrational) or your preference for $A$ over $B$ wasn't real (preference change)."*

  To defend resoluteness, you must argue that **choosing $B$ over $A$ at $t_1$ does not imply a change in the underlying preference ordering.**

  **The Argument from Plan-Relativity:**
  Preferences are not atomistic relations between objects ($A$ and $B$); they are relations between *outcomes in context*.
  *   At $t_0$, the agent prefers the sequence $(Start \to A \to C \to B \to Stop)$ over $(Start \to A \to C \to B \to A \dots)$.
  *   At $t_1$ (the node where holding $B$, offered $A$), the choice is not strictly between object $A$ and object $B$. It is between **"Being the kind of agent who sticks to plans"** vs. **"Being the kind of agent who is money-pumped."**

  If the agent values Diachronic Coherence (not being a pump victim), then at $t_1$, the utility of $B$ *qua* plan-fulfillment is higher than the utility of $A$ *qua* local-satisfaction.
  *   **Did the preference between $A$ and $B$ change?** No. In a vacuum, $A \succ B$.
  *   **Did the preference between the *available options at $t_1$* change?** No. The available options at $t_1$ are *not* $A$ and $B$. They are "Stick to Plan (yielding $B$)" and "Deviate (yielding pumped $A$)."

  The colleague assumes that the "true" preference is only revealed by the local, context-stripped choice. The resolute chooser argues that the "true" preference is revealed by the choice that respects the agent's global evaluative structure. To claim the agent *must* maximize locally is to beg the question against resoluteness.

  **Why this isn't "patching one irrationality with another":**
  The colleague claims resoluteness is just adding a new irrationality (ignoring local preferences) to fix the old one (cycles).
  *   **Counter:** Ignoring local preferences is only irrational if Local Maximization is the supreme norm of rationality. If Diachronic Coherence is *also* a norm (and arguably a more important one for temporal agents), then satisfying Coherence at the expense of Local Maximization is not irrational; it is a rational trade-off between competing norms.
  *   It is analogous to Ulysses tying himself to the mast. At $t_{siren}$, Ulysses prefers "Jump" to "Stay." If he stays, is he acting against his preference? Locally, yes. Globally, no. We do not call Ulysses irrational for binding his future self; we call him prudent. Resolute choice is simply Ulysses binding his future self *without ropes*, through sheer agency.

  #### 3. Distinguishing from Hyperbolic Discounting (Sophistication vs. Resolution)
  This is the critical technical distinction for your seminar. You must distinguish **Resolute Choice** (McClennen) from **Sophisticated Choice** (Strotz/Ainslie).

  **The Hyperbolic Case (Dynamic Inconsistency):**
  *   **Structure:** Preferences *change* over time. $Self_{t0}$ prefers (Diet); $Self_{t1}$ prefers (Cake).
  *   **Mechanism:** $U_{t0} \neq U_{t1}$. The utility function itself shifts.
  *   **Sophistication:** $Self_{t0}$ recognizes $Self_{t1}$ is a "different" optimizer. $Self_{t0}$ acts strategically to constrain $Self_{t1}$ (e.g., throwing away the cake).
  *   **Rationality:** This is rational because it acknowledges a conflict between *different* utility functions.

  **The Cyclic Case (Static Intransitivity):**
  *   **Structure:** Preferences are *stable* but cyclic. $V(A) > V(B) > V(C) > V(A)$ holds at $t_0, t_1, t_2$.
  *   **Mechanism:** The valuation relation $V$ is constant. The agent does not become a "different self."
  *   **Resoluteness:** The agent does not need to constrain a "different" future self. They need to constrain their own *mode of evaluation*.
  *   **The Difference:** In hyperbolic discounting, sophistication works because $Self_{t0}$ correctly predicts $Self_{t1}$ will defect. In cyclic preferences, if the agent is resolute, $Self_{t1}$ *does not defect*.

  **Why this matters for the "Preference Change" objection:**
  In the hyperbolic case, if $Self_{t1}$ chooses Diet, we might say their preference *actually changed* (they became more patient).
  In the cyclic case, if the agent chooses $B$ over $A$ at $t_1$ (despite $A \succ B$), we cannot say their preference changed, because the valuation structure $V$ is defined as static.
  *   Instead, we say the **domain of evaluation** shifted.
  *   Hyperbolic Sophistication admits: "My future self will maximize locally."
  *   Cyclic Resoluteness asserts: "I will not maximize locally."

  If you accept Sophistication as rational in the hyperbolic case (which standard theory does), you must explain why Resoluteness is irrational in the cyclic case.
  *   *Standard Reply:* In hyperbolic cases, you can't *be* resolute because the preference really does change.
  *   *Your Counter:* But in the cyclic case, the preference *doesn't* change. So Resoluteness is *more* viable here than in the hyperbolic case. If we praise the hyperbolic agent for planning around their future irrationality, we should praise the cyclic agent for planning around their local intransitivity.

  #### 4. Conclusion: The Burden of Proof Shifts
  The money-pump argument is often presented as a *reductio ad absurdum* of cyclic preferences. Your argument re-frames it as a *reductio ad absurdum* of Separability.

  1.  **Premise 1:** If an agent is exploitable, they are irrational. (Accepted)
  2.  **Premise 2:** Agents with cyclic preferences are exploitable. (True *only if* Separability holds)
  3.  **Premise 3:** Separability is a requirement of rationality. (Contested)

  The resolute chooser denies Premise 3. They argue that an agent who adopts a global plan to avoid exploitation and successfully executes it is **diachronically rational**, even if they are **locally non-maximizing**.

  To claim this is "irrational" requires defending the claim that Local Maximization trumps Diachronic Coherence. But since Local Maximization is what *leads* to the sure loss, it is hard to argue it is the superior norm. Therefore, the money pump fails to establish transitivity as a requirement of rationality; it only establishes transitivity as a requirement for *separable* agents. Since separable agency is not the only form of rational agency, cyclic preferences remain permissible.

  ### Seminar Discussion Questions (to prompt the students)
  1.  **The "Why Bother?" Question:** If the resolute chooser effectively treats the plan as a constraint, aren't they just acting *as if* they have transitive preferences (e.g., preferring "Plan A" to "Plan B")? If so, is there any practical difference between "really having transitive preferences" and "resolutely acting on cyclic ones"?
  2.  **The Normative Weight:** Is Diachronic Coherence a *constitutive* norm of agency (you aren't an agent without it) or merely an instrumental one (it helps you get what you want)? If it's merely instrumental, does the money pump return?
  3.  **The Regress:** If I need a plan to stop myself from maximizing locally at $t_1$, don't I need a plan at $t_1$ to stop myself from abandoning *that* plan at $t_2$? Does resoluteness require a homunculus?

  This framework should give your colleague enough friction to generate a lively debate while providing a robust defense for the resolute position.
