answer: |-
  This is a fantastic pairing, and honestly, one of the most dramatic juxtapositions you can make in a free will syllabus. The "family drama" angle is real, too—Galen has spoken in interviews about how his father (P.F.) was never convinced by Galen's impossibilism, and Galen has spent a significant portion of his career engaging with (and dismantling) the legacy of "Freedom and Resentment."

  Here is the breakdown you need for Thursday, covering the bibliographic hunt, the philosophical clash, and the evaluation of who is doing the heavier lifting.

  ### 1. The Bibliographic Hunt: Did Galen Write a Direct Response?

  Your professor is likely referring to Galen Strawson's book **_Freedom and Belief_ (1986, revised 2010)**, specifically **Chapter 9** (in the revised edition) or the sections where he explicitly critiques the "Strawsonian" move. While there isn't a famous standalone paper titled "A Response to My Father," the 1994 paper **"The Impossibility of Moral Responsibility"** is effectively that response.

  However, there is a specific piece of trivia your prof might be hinting at: Galen contributed to the volume **_The Philosophy of P. F. Strawson_ (1998)**, edited by Lewis Hahn. His chapter there, **"The Impossibility of Moral Responsibility,"** is the direct engagement. In it, he acknowledges his father's influence but argues that P.F. Strawson's "optimism" fails to address the metaphysical heart of the issue.

  **The Family Dynamic:** It is genuinely tense in a philosophical sense. P.F. Strawson wanted to dissolve the metaphysical problem by showing it didn't matter for our practices. Galen argues that the metaphysical problem *cannot* be dissolved, and because it can't be solved, the practice (while psychologically inevitable) is ultimately unjustified in terms of *true desert*. Galen has noted in interviews that his father thought he was being too pessimistic, while Galen thinks his father was being too complacent.

  ### 2. Contradiction or Talking Past Each Other?

  This is the core question for your seminar. The short answer is: **They are fighting over the definition of "Responsibility," which makes it look like they are talking past each other, but they actually contradict each other on whether the practice of blaming is *justified*.**

  **P.F. Strawson (The Naturalist/Pragmatist):**
  *   **The Move:** He changes the subject from *Metaphysics* to *Psychology/Sociology*.
  *   **The Claim:** "Moral Responsibility" just *is* the susceptibility to reactive attitudes (resentment, gratitude, etc.).
  *   **The Conclusion:** Since we cannot abandon these attitudes (they are constitutive of human relationships), moral responsibility is real *enough*. The demand for "ultimate" metaphysical freedom is a confusion.
  *   **Key Phrase:** "The general framework of human life."

  **Galen Strawson (The Impossibilist):**
  *   **The Move:** He accepts the psychology but rejects the justification.
  *   **The Claim:** "Moral Responsibility" (the kind that justifies *true desert*, praise, or blame) requires that you be the *causa sui* (cause of yourself) in certain crucial mental respects.
  *   **The Conclusion:** Since nothing can be *causa sui* (you need a prior reason to choose to be the way you are, which requires a prior you, ad infinitum), true moral responsibility is impossible.
  *   **Key Phrase:** "The Basic Argument."

  **Do they contradict?**
  Yes. P.F. Strawson says the demand for *causa sui* is incoherent and we should drop it. Galen Strawson says the demand for *causa sui* is necessary for the concept of responsibility to make sense, and since it's impossible, responsibility is impossible.

  **Are they talking past each other?**
  Partially. P.F. is describing the *practice* of responsibility (how we live). Galen is analyzing the *conditions* of responsibility (what would make it true).
  *   **P.F. says:** "We blame people, we can't stop, so responsibility exists."
  *   **Galen says:** "You blame people, you can't stop, but that doesn't make the blame *fair* or *ultimately deserved*."

  Galen's critique is that P.F. Strawson is offering a **consolation prize**. P.F. says, "We have interpersonal responsibility." Galen replies, "That's just social pressure. I'm talking about *moral* responsibility that justifies deep desert."

  ### 3. Who is Doing the "More Serious" Work? (Evaluation)

  If you have to take a side for the seminar (or guide students to evaluate), here is the philosophical weight of each position:

  **The Case for P.F. Strawson (Why he might be "Right"):**
  *   **Pragmatic Victory:** He successfully shows that the incompatibilist demand (like Galen's) leads to a skepticism we literally cannot live by. Even if Galen is metaphysically right, we will *never* stop feeling resentment. If philosophy tells us to ignore a brute fact of human nature, philosophy is out of touch.
  *   **Redefinition:** He argues that Galen is chasing a "god's-eye view" of responsibility that humans never actually meant in the first place. When we blame someone, we aren't checking if they are *causa sui*; we are regulating behavior and expressing values.
  *   **Weakness:** It feels like a dodge. It doesn't answer the nagging feeling that if determinism is true, blaming someone is *unfair*. P.F. essentially says, "Fairness is internal to the practice," which can feel circular.

  **The Case for Galen Strawson (Why he might be "Right"):**
  *   **Metaphysical Rigor:** He exposes the hidden cost of moral responsibility. If you want to say someone *truly deserves* punishment (not just quarantine, but *punishment*), you need a strong metaphysical foundation. Galen proves that foundation is missing.
  *   **Honesty:** He admits that our practices might be based on an illusion. Just because we *can't help* believing in free will (a naturalistic point he agrees with) doesn't make it *true*.
  *   **Weakness:** It leads to nihilism. If Galen is right, our entire legal and ethical system is based on a fiction. It's hard to construct a positive ethics on top of the Basic Argument.

  **The Verdict:**
  *   **On Metaphysics:** Galen wins. The *causa sui* regress is incredibly hard to defeat. If responsibility requires ultimate self-creation, Galen is right that it's impossible.
  *   **On Ethics/Life:** P.F. Strawson wins. He explains why morality functions and why it *should* function regardless of metaphysics.

  Most contemporary philosophers lean toward a **Strawsonian Compatibilism** (like R. Jay Wallace or Gary Watson) which tries to keep P.F.'s focus on practices but refine the norms so they don't require Galen's impossible *causa sui*. They argue Galen sets the bar too high.

  ### 4. Seminar Strategy for Thursday

  If I were running the section, I would frame the discussion around **"Two Concepts of Responsibility."**

  1.  **Ask the students:** "When you blame your friend for forgetting your birthday, what are you claiming?"
      *   If they say, "I'm claiming they could have done otherwise given the exact same past," Galen Strawson wins (that's impossible).
      *   If they say, "I'm claiming they disregarded my feelings and I want them to know it hurts," P.F. Strawson wins (that's a reactive attitude).
  2.  **The "Change of Subject" Objection:** Ask the students if P.F. Strawson is allowed to just *define* responsibility as "reactive attitudes." Is that cheating? Or is Galen cheating by demanding a supernatural level of freedom?
  3.  **The Family Angle:** It's worth mentioning that Galen accepts his father's naturalism (we can't help having these attitudes) but rejects his father's *normativity* (that these attitudes are justified). This highlights the gap between *is* and *ought*.

  **Summary for your cohort:**
  They aren't just talking past each other; they are fighting over who owns the term "Responsibility." P.F. claims it for human relationships. Galen claims it for metaphysical desert. Galen is likely "right" that ultimate desert is impossible, but P.F. is likely "right" that we can't live without the practice. The philosophical work lies in deciding if the practice survives the loss of the metaphysics.

  Good luck on Thursday! It's a great seminar topic.
