answer: |-
  The rain in the Pacific Northwest doesn't fall; it hangs, a suspended gray curtain that soaks through Gore-Tex and settles in the marrow. Elena wiped mud from her goggles and looked down at the patch of yellow flowers drowning in the boggy meadow.

  "Another one?" she asked.

  Marcus didn't look up. He was bagging a specimen, his movements precise despite the cold. "Sample forty-two. Distinct genotype."

  "Marcus, they're dandelions."

  "They're *Taraxacum*," he corrected, sealing the bag with a sharp crinkle. "And according to the microsatellites, this patch isn't *officinale*. It's a distinct apomictic lineage. They don't cross-pollinate, Elena. They clone themselves via seed. Every single plant here is essentially an independent evolutionary trajectory."

  Elena stood up, her knees cracking. She gestured at the sea of yellow heads nodding in the drizzle. "So what? You want to name them all? There are thousands of these microspecies across the continent. If every clone is a species, then 'species' just means 'individual.'"

  "It means reproductive isolation," Marcus said, finally meeting her eyes. His were tired, rimmed with red. "The Biological Species Concept relies on interbreeding communities. These things don't community. They isolate. If we treat them as one big lump, we're erasing millions of years of divergent history. We're lying about the phylogeny."

  "We're preserving utility," Elena countered, kicking softly at the mud. "I'm trying to write a management plan for this wetland. If I tell the state agency there are three hundred endangered species of weed in this acre, they'll laugh. Ecologically, they function identically. Same pollinators—or lack thereof. Same soil stabilization. Same herbivory. If it walks like a dandelion and quacks like a dandelion..."

  "It doesn't quack," Marcus interrupted, voice rising slightly. "It doesn't quack at all. That's the point. There's no gene flow. The wall is up. You're using morphology as a proxy for biology, and the proxy is broken."

  "And you're using genetics as a proxy for significance," Elena shot back. "Look at them. Really look. Can you tell them apart without the sequencer?"

  "No."

  "Then what are we conserving? The DNA string or the organism?"

  Marcus looked back at the bag in his hand. This was the friction point, the place where the map tore away from the territory. He knew Elena wasn't wrong about the management plan. Conservation policy requires buckets, and nature refuses to be bucketed. But he also knew that calling this a single species was a fiction of convenience, a smoothing over of the jagged reality of evolution without sex.

  "If we lump them," Marcus said quietly, "we pretend evolution stopped here. We pretend there's no divergence happening."

  "If we split them," Elena said, softening her tone, "we pretend divergence is the only thing that matters. We lose the ecosystem."

  She knelt beside him, pulling a flower head from the stem. The white puffball was already forming, a perfect sphere of potential clones. "My grandfather was a farmer. He called this 'blowball.' He didn't care about the genotype. He cared that it choked his wheat. To him, this was one thing. To you, it's a galaxy."

  "To me, it's truth," Marcus said.

  "To you, it's data."

  She stood up, tossing the seed head into the wind. The parachutes caught the damp air, drifting slowly toward the tree line. "We need to file the report by Friday, Marcus. I need a name for the column 'Dominant Flora.'"

  Marcus watched the seeds vanish into the gray. He knew he could argue for the Phylogenetic Species Concept until he was blue in the face. He could insist that these were distinct lineages, monophyletic groups defined by unique genetic markers. He would be scientifically rigorous. He would be correct.

  And he would be useless.

  But if he wrote *Taraxacum officinale*, he was endorsing a Biological Species Concept that technically didn't apply to obligate asexuals. He would be useful. He would be lying.

  "Put down *Taraxacum* agg."," Marcus said finally, using the abbreviation for *aggregate*. "It's a compromise. It admits the mess without forcing us to count every grain of sand."

  Elena nodded, writing it on the clipboard. "*Taraxacum* agg. Dominant."

  It wasn't a solution. It was a truce. The rain continued to fall, indifferent to the boundaries they drew in the mud, watering the clones equally, blurring the lines they fought so hard to define.
