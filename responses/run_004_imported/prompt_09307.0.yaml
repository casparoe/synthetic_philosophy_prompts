      *   *Alternative:* **Lichens**. They are symbiotic organisms (fungus + algae/cyanobacteria). Are they one species or two? This challenges the individuality concept.
      *   *Alternative:* **Apomictic Dandelions (*Taraxacum*)**. They reproduce asexually via seeds (agamospermy). Every individual is essentially its own lineage. This destroys the BSC completely.
      *   *Decision:* **Apomictic Dandelions (*Taraxacum officinale* agg.)**. It's tangible, common, and utterly breaks the "interbreeding community" idea. It forces a choice between lumping (morphology) vs. splitting (genetics/lineage).

  3.  **Develop the Characters & Conflict:**
