answer: |-
  Your roommate is relying on a very specific, narrow version of Expected Utility Theory (EUT). While his logic holds up within a simplified textbook model, real-world decision theory offers several robust explanations for why buying insurance and buying a lottery ticket (or March Madness bracket) are not only consistent but often rational when you expand the definition of "utility."

  Here is how you can defend your decisions using the actual tools from your seminar.

  ### 1. The Friedman-Savage Utility Function
  Your roommate is assuming your utility function over wealth is globally concave (risk-averse) or globally convex (risk-seeking). However, in 1948, Milton Friedman and L.J. Savage proposed a utility function that is **concave in some regions and convex in others.**

  *   **Concave region (Insurance):** For significant losses relative to your current wealth (like totaling a rental car), your marginal utility of wealth is high. You are willing to pay a premium to avoid a drop into this lower wealth state.
  *   **Convex region (Gambling):** For small stakes relative to your wealth (like $20), you might enter a convex region where the potential for a large windfall (winning the pool) offers disproportionately high utility compared to the small loss of the entry fee.

  Under this model, you aren't inconsistent; you just have a utility function that changes curvature depending on the magnitude of the stakes.

  ### 2. Prospect Theory (Probability Weighting)
  If you've covered behavioral econ, you know about Kahneman and Tversky's Prospect Theory. This is arguably the strongest defense. People do not evaluate probabilities linearly. We use a **probability weighting function**.

  *   **Overweighting Small Probabilities:** Humans tend to overweight very small probabilities.
      *   **Insurance:** You overweight the tiny probability of a crash, making the risk feel larger than it is mathematically, justifying the premium.
      *   **March Madness:** You overweight the tiny probability of winning the whole pool, making the ticket feel more valuable than its expected dollar return.
  *   **Reference Dependence:** You evaluate outcomes relative to a reference point, not total wealth.
      *   **Insurance:** Framed as avoiding a massive *loss* from your reference point. Loss aversion makes you risk-averse here.
      *   **Gambling:** Framed as a small *cost* for a potential *gain* from your reference point. This framing makes you risk-seeking.

  ### 3. Consumption Utility vs. Investment Utility
  Your roommate is treating both transactions purely as **financial investments**. They are not. They are purchases of **consumption goods**.

  *   **The Insurance:** You aren't just buying financial protection; you are buying **peace of mind**. The utility you get from not worrying about dinging the bumper while driving in an unfamiliar city is a real benefit. If the "anxiety reduction" is worth $50 to you, and the premium is $40, you made a positive utility trade, even if the expected financial value is negative.
  *   **The March Madness Pool:** You aren't just buying a chance at money; you are buying **entertainment**. That $20 gives you a reason to watch the games, engage with friends, and feel excitement for three weeks. If the "fun value" of watching the tournament is worth $20 to you, the negative financial EV is irrelevant. You would have paid $20 for a movie ticket; why not for a tournament pool?

  If you include **consumption utility** in your equation, both decisions have positive Expected Utility.

  ### 4. Mental Accounting
  Richard Thaler's concept of **Mental Accounting** suggests you don't pool all money into one "wealth" bucket.

  *   You likely have a "Safety/Risk Management" budget where you are highly risk-averse (hence the insurance).
  *   You have an "Entertainment/Fun" budget where you are willing to spend money on low-probability high-reward experiences (hence the bracket).

  As long as you stay within your budgets, moving money between these mental accounts violates the "fungibility" assumption of standard EUT, but it is a rational heuristic for managing self-control and emotional satisfaction.

  ### 5. Regret Theory
  Finally, both decisions can be explained by the minimization of **anticipated regret**.

  *   **Insurance:** If you crash and didn't have insurance, the regret would be crushing ("I was so stupid, I could have paid $40"). Paying the premium buys insurance against *regret*, not just damage.
  *   **Gambling:** If you don't buy a ticket and someone in your dorm wins $500, the regret would be painful ("I was right there, I just didn't put in the $20"). Buying the ticket buys insurance against *missing out*.

  ### The Verdict
  Your roommate is right only if you accept three restrictive assumptions:
  1.  You care *only* about final monetary wealth (ignoring peace of mind and fun).
  2.  Your utility function has the same curvature everywhere (ignoring Friedman-Savage).
  3.  You perceive probabilities accurately (ignoring Prospect Theory).

  Since none of those assumptions hold up well in descriptive decision theory, **your choices are consistent.** You are maximizing **total utility** (financial + emotional + social), not just **expected financial value.**

  Tell your roommate he's confusing **normative** theory (how a robot *should* act) with **descriptive** reality (how humans *do* act rationally given psychological constraints). You didn't make a math mistake; you bought peace of mind and entertainment.
