answer: |-
  Your editor is absolutely right to push back on this line. In fact, this is one of the most common misconceptions about quantum computing, even among seasoned science writers.

  To answer your specific question: **No, it is not accurate to tell readers this is a settled result.** It is not merely that computer scientists "hedge" on the point; it is that the statement, as written, is technically incorrect on two fundamental levels.

  Here is a breakdown of why the claim is flawed, the distinction you need to make, and how you can salvage the excitement of the piece without sacrificing accuracy.

  ### 1. Computability vs. Complexity (The Big Error)
  The **Church-Turing Thesis (CTT)** is a statement about *computability*, not *speed*. It posits that any function that can be effectively calculated by an algorithm can be computed by a Turing machine (a classical computer).

  *   **What Quantum Computers Do:** They provide massive speedups for specific problems (like integer factoring via Shor's algorithm).
  *   **What Quantum Computers Do Not Do:** They do not compute anything that a classical computer *cannot* compute. A classical computer can simulate a quantum computer; it just takes an exponentially long time.
  *   **The Verdict:** Because a classical machine *could* eventually solve the problem (given enough time and memory), the set of "computable" problems has not changed. Therefore, the original Church-Turing Thesis remains intact.

  ### 2. The "Extended" Church-Turing Thesis
  The thesis your draft is actually challenging is the **Extended Church-Turing Thesis (ECTT)**.

  *   **The ECTT Claim:** Any reasonable model of computation can be *efficiently* simulated by a probabilistic Turing machine. In lay terms: "Anything a fancy computer can do quickly, a classical computer can also do reasonably quickly (polynomial time)."
  *   **The Quantum Challenge:** Quantum computing suggests that **BQP** (problems solvable by quantum computers in polynomial time) is not the same as **BPP** (problems solvable by classical probabilistic computers in polynomial time).
  *   **The Nuance:** While theoretical computer scientists generally accept that quantum computers violate the ECTT, this is still a matter of complexity theory (specifically, whether **BQP $\neq$ BPP**). It is widely believed, but like most complexity class separations (such as P $\neq$ NP), it is not strictly "proven" in a mathematical sense.

  ### 3. The Hardware Reality Check
  Your draft mentions that "hardware has become mature." This is another point where your editor might be worried about overstatement.

  *   **Google's 2019 Claim:** The "quantum supremacy" experiment (Sycamore processor) involved **random circuit sampling**. It was not running Shor's algorithm. It proved a quantum device could perform a specific, somewhat useless task faster than a classical supercomputer.
  *   **Shor's Algorithm Status:** We have not yet built a fault-tolerant quantum computer capable of running Shor's algorithm on numbers large enough to break encryption (which requires thousands of logical qubits, not just physical ones). We are currently in the **NISQ** (Noisy Intermediate-Scale Quantum) era.
  *   **The "Settled" Question:** Because we haven't yet run Shor's algorithm at a scale impossible for classical machines to simulate, claiming the result is "settled" based on current hardware is premature. The *theory* says it will work; the *hardware* isn't there yet.

  ### How to Fix the Draft
  You can keep the sense of wonder and the narrative of a paradigm shift without making the technical error. You want to shift the focus from "what is computable" to "what is practical."

  **Instead of:**
  > "Shor's algorithm has effectively disproven the Church-Turing thesis: a quantum computer can solve certain problems in a feasible number of steps that no classical machine could ever match, so the thesis's claim about what counts as computable no longer holds."

  **Try something like:**
  > "Shor's algorithm challenges the **Extended** Church-Turing Thesis, a longstanding belief about computational efficiency. While classical computers could theoretically solve the same problems, they would require time scales exceeding the age of the universe. Quantum computers, by contrast, could solve them in hours. This suggests that the universe allows for a fundamentally more efficient mode of calculation than classical physics permits."

  ### Summary for Your Editor
  If you need to reply to your editor, you can acknowledge that the distinction between the **Church-Turing Thesis** (computability) and the **Extended Church-Turing Thesis** (efficiency) was conflated in the draft.

  **The Bottom Line:**
  1.  **Don't say CTT is disproven.** (It isn't; quantum computers don't solve the Halting Problem).
  2.  **Say ECTT is challenged.** (This is about efficiency/speed).
  3.  **Don't claim hardware maturity proves this yet.** (We haven't factored large numbers yet; we've only done random sampling).

  This is a great catch by your editor. Correcting it will make your piece more robust and protect you from criticism from the physics and CS communities, who are notoriously prickly about this specific distinction.
