prompt: |-
  I cover science and ideas for a general-interest magazine, and I'm finishing a piece on how far quantum computing has advanced since Google's 2019 "quantum supremacy" announcement. An editor pushed back on a line in my draft stating that Shor's algorithm and the speedups built on it have effectively disproven the Church-Turing thesis: a quantum computer, the argument goes, can solve certain problems in a feasible number of steps that no classical machine could ever match, so the thesis's claim about what counts as computable no longer holds. Given how mature the hardware has become, would it be accurate to tell readers that this is now a settled result, or is there a genuine reason serious computer scientists still hedge on the point?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Role:** Science/ideas writer for a general-interest magazine.
      *   **Topic:** Progress of quantum computing since Google's 2019 "quantum supremacy" announcement.
      *   **Specific Issue:** An editor challenged a claim in the draft.
      *   **The Claim:** "Shor's algorithm and the speedups built on it have effectively disproven the Church-Turing thesis."
      *   **The Reasoning:** Quantum computers solve problems faster than classical machines, so the thesis about what is "computable" no longer holds.
      *   **The Question:** Is this a settled result (accurate to tell readers), or is there a genuine reason computer scientists still hedge?

  2.  **Evaluate the Claim (Fact-Checking):**
      *   *Claim:* Shor's algorithm disproves the Church-Turing Thesis (CTT).
      *   *Fact:* This is **incorrect**.
      *   *Why?*
          *   **Church-Turing Thesis (CTT):** States that any function that is *effectively calculable* (computable) by a human following an algorithm can be computed by a Turing Machine. It's about *computability* (can it be done at all?), not *complexity* (how fast can it be done?).
          *   **Quantum Computing:** Quantum computers (like Turing Machines) are universal computers. They can compute anything a classical computer can compute, and vice versa. They do *not* compute uncomputable functions (like the Halting Problem).
          *   **Shor's Algorithm:** Provides a polynomial-time solution for factoring integers, whereas classical algorithms are believed to require super-polynomial time. This is a speedup (Complexity), not a change in computability.
          *   **Extended Church-Turing Thesis (ECTT):** This is the version that deals with efficiency. It states that any reasonable model of computation can be efficiently simulated by a probabilistic Turing Machine. Quantum computing *does* challenge the *Extended* Church-Turing Thesis, not the original one.
      *   *Hardware Status:* While hardware has advanced (Google's Sycamore, IBM's Eagle/Osprey, etc.), we are still in the NISQ (Noisy Intermediate-Scale Quantum) era. Fault-tolerant, large-scale quantum computers capable of running Shor's algorithm on cryptographically relevant numbers do not yet exist. So, even the challenge to the ECTT is theoretical/probabilistic, not yet experimentally "settled" in a practical sense, though widely accepted theoretically.

  3.  **Determine the Verdict:**
      *   The editor is right to push back.
      *   The writer's claim conflates *computability* with *complexity*.
      *   The writer's claim conflates the *Church-Turing Thesis* with the *Extended Church-Turing Thesis*.
      *   The claim implies hardware maturity proves this, but the hardware isn't yet mature enough to run Shor's at scale.

  4.  **Drafting the Response:**
      *   **Tone:** Professional, supportive, authoritative but accessible (since the user is a writer, not necessarily a physicist).
      *   **Structure:**
          1.  Direct Answer: The editor is correct; the claim is inaccurate.
          2.  Explanation of the Church-Turing Thesis (Computability vs. Efficiency).
          3.  Explanation of the *Extended* Church-Turing Thesis (where the nuance lies).
          4.  Status of Hardware (NISQ era vs. Fault Tolerance).
          5.  Suggested Revision/Phrasing for the article.

  5.  **Refining the Content (Self-Correction/Nuance Check):**
      *   *Did Google's 2019 announcement prove anything about Shor's?* No, that was random circuit sampling, not factoring.
      *   *Is the ECTT disproven?* Theoretically, yes, if BQP $\neq$ BPP. Practically, we haven't built a machine that definitively shows this for a useful problem yet (Google's experiment was for a useless problem, and classical algorithms caught up quickly).
      *   *Key Distinction:* "Computable" (can it be done?) vs. "Tractable" (can it be done quickly?).
      *   *Key Distinction:* CTT vs. ECTT.

  6.  **Finalizing the Advice:**
