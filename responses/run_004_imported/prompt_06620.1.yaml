prompt: |-
  Among Jeremy Bentham's unpublished manuscripts on sexual morality — drafted mainly in the 1780s and not assembled in full until the 2014 Collected Works volume *Of Sexual Irregularities, and Other Writings on Sexual Morality* — is a sustained utilitarian argument, usually cited under the heading "Offences Against One's Self," that consensual same-sex acts between adults should not be criminally punished. Bentham's case rests on the claim that such acts produce pleasure and harm no one, that the horror they provoke reflects mere "antipathy" and ascetic prejudice rather than any calculation of pain and pleasure, and he even compares condemning an unusual sexual taste to condemning an unusual taste in food. Yet in these same writings he continues to describe such acts as "irregularities" — departures from the natural or proper use of the relevant faculties — rather than placing them on an equal footing with the tastes he treats as wholly unproblematic.

  Write an essay assessing whether Bentham can consistently hold both positions. Is calling a harmless pleasure "irregular" a merely descriptive, statistical judgment that a thoroughgoing hedonistic utilitarian is free to make without inconsistency, or does the language of natural versus unnatural use quietly reimport a teleological standard that Bentham's own attacks on natural law and on the "principle of asceticism" should have foreclosed? Weigh the strongest considerations on each side, but do not end on a non-committal note: defend a definite verdict on whether Bentham's position is coherent by his own lights.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Prompt:**
      *   **Topic:** Jeremy Bentham's unpublished manuscripts on sexual morality (specifically "Offences Against One's Self" from the 1780s, published in *Of Sexual Irregularities, and Other Writings on Sexual Morality*, 2014).
      *   **Core Tension:** Bentham argues against criminalizing consensual same-sex acts (utilitarian argument: pleasure, no harm, opposition is based on antipathy/asceticism) *but* still labels them "irregularities" (departures from natural/proper use), comparing them to food tastes but implying a deviation.
      *   **Question:** Can Bentham consistently hold both positions? Is "irregular" merely descriptive/statistical (compatible with hedonistic utilitarianism), or does it reimport a teleological/natural law standard (incompatible with his attacks on natural law and asceticism)?
      *   **Requirement:** Weigh considerations on both sides, but *defend a definite verdict* on coherence by Bentham's own lights. No non-committal ending.

  2.  **Deconstruct Bentham's Philosophy:**
      *   **Utilitarianism:** Greatest happiness principle. Pain and pleasure are the sovereign masters. Actions are right if they maximize pleasure/minimize pain.
      *   **Anti-Natural Law:** Bentham famously dismissed natural rights as "nonsense upon stilts." He rejected intrinsic moral qualities in actions independent of consequences.
      *   **Principle of Asceticism:** He attacked the idea that pain is good and pleasure is bad (often associated with religious morality).
      *   **Psychological Hedonism:** Humans are driven by pain and pleasure.
      *   **Language:** Bentham was obsessed with precise definition and exposing "fictitious entities."

  3.  **Analyze the "Irregularity" Claim:**
      *   *Side A (Consistency):* "Irregular" is statistical or anatomical. It means "less common" or "not reproductive." It doesn't imply moral wrongness, just deviation from a norm. Just like left-handedness or a taste for spicy food. A utilitarian can acknowledge statistical norms without endorsing them morally.
      *   *Side B (Inconsistency):* "Irregular" implies "unnatural" in a normative sense. If nature teleologically intends organs for specific ends (reproduction), deviating is a frustration of nature's design. This smells of Natural Law (Aquinas, etc.). If Bentham rejects natural law, he shouldn't appeal to "proper use of faculties" unless that "proper use" is defined by utility. If the "proper use" yields less utility, fine. But if it yields *more* utility (pleasure without harm), calling it "irregular" suggests a defect.

  4.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: Bentham as the radical utilitarian vs. Bentham as the man of his time.
          *   Context: The 2014 publication of *Of Sexual Irregularities*.
          *   Thesis Statement: While Bentham's decriminalization argument is robustly utilitarian, his retention of the label "irregularity" introduces a covert teleology that undermines his philosophical system. Therefore, the position is *incoherent* by his own lights. (I need to choose a side. The prompt asks to weigh both but end with a verdict. The "incoherence" argument is usually philosophically richer because it highlights the tension between radical theory and cultural baggage.)
          *   *Self-Correction/Refinement:* Actually, arguing for *coherence* might be easier if I define "irregular" strictly as statistical. However, the prompt hints that "natural versus unnatural use" reimports teleology. Let's look closer. If Bentham says "it's irregular but harmless," is that a contradiction? Only if "irregular" implies "bad." If "irregular" means "statistically minority," it's fine. But the prompt mentions "proper use of relevant faculties." That sounds functionalist/teleological. I will argue for *incoherence* because the functionalist language betrays the utilitarian axiom that *only* consequences matter.

      *   **Body Paragraph 1: The Utilitarian Case for Decriminalization.**
          *   Focus on "Offences Against One's Self."
          *   Argument: Pleasure is produced, no pain to others.
          *   Opposition is based on "antipathy" (disgust) which is not a valid utilitarian ground.
          *   Comparison to food tastes.
          *   This part is perfectly coherent with the *Greatest Happiness Principle*.

      *   **Body Paragraph 2: The Meaning of "Irregularity" (The Case for Consistency).**
          *   Defense of Bentham: He might mean "statistical minority."
          *   He might mean "non-reproductive" (biological fact, not moral judgment).
          *   Utilitarianism doesn't require moral relativism about *facts*. One can admit an act is rare or biologically non-procreative while arguing it's morally permissible.
          *   Analogy: Eating dessert is "irregular" for survival but permissible.

      *   **Body Paragraph 3: The Teleological Trap (The Case for Inconsistency).**
          *   Critique: "Proper use of faculties" is the problem.
          *   Who defines "proper"? If not God/Nature, then who?
          *   If "proper" means "conducive to happiness," then same-sex acts *are* proper (since they produce pleasure).
          *   If "proper" means "reproductive," that is a Natural Law standard (Aquinas's *Summa*), which Bentham explicitly rejected in jurisprudence.
          *   By calling it an "irregularity," he concedes ground to the ascetics he attacks. It creates a category of "permitted vices" rather than "neutral acts."
          *   This weakens the attack on antipathy. If it's "irregular," why isn't it bad? It leaves a door open for moralization.

      *   **Body Paragraph 4: Psychological and Cultural Context vs. Philosophical Rigor.**
          *   Bentham was writing in the 1780s. Total liberation of language was impossible.
          *   However, the prompt asks about coherence *by his own lights* (philosophical consistency), not historical excusability.
          *   His principle of utility demands the purging of fictitious entities. "Natural/Unnatural" is a fictitious entity if it doesn't map to pain/pleasure.
          *   Therefore, retaining the terminology is a failure of his own philosophical project of demystification.

      *   **Conclusion:**
          *   Restate Thesis: The position is ultimately incoherent.
          *   Summarize: While the legal conclusion is utilitarian, the ontological classification relies on a pre-utilitarian metaphysics.
          *   Final Verdict: Bentham failed to fully exorcise the ghost of Natural Law from his moral vocabulary, creating a fissure between his radical conclusions and his descriptive categories.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the food comparison? Yes, Bentham uses it to show harmlessness. But does he call spicy food "irregular"? Usually, he compares the *condemnation* of the taste to condemning food.
      *   *Nuance:* Bentham distinguishes between "principal" and "collateral" mischief. If there's no mischief, it's not an offense. But "irregularity" isn't necessarily an "offense." It's a classification.
      *   *Key Insight:* The inconsistency lies in the *source* of the classification. If the classification comes from utility, it's fine. If it comes from "nature," it's not. Bentham often slips into "nature" language when discussing sex, which contradicts his rejection of "nature" as a normative standard elsewhere.
      *   *Decision:* I will argue that while Bentham *intends* consistency, the reliance on "proper use of faculties" constitutes a philosophical betrayal of his core axiom. It is a "residual teleology."

  6.  **Final Polish:**
      *   Ensure the tone is academic and analytical.
      *   Check that the verdict is definite (Incoherent).
      *   Make sure to reference the specific texts mentioned ("Offences Against One's Self", *Of Sexual Irregularities*).

  7.  **Final Review against constraints:**
      *   Assess consistency? Yes.
      *   Weigh both sides? Yes (Statistical vs. Teleological).
      *   Definite verdict? Yes (Incoherent).
      *   No non-committal note? Yes.

  *(Self-Correction on the Verdict)*: Wait, is it possible to argue he *is* consistent? If "irregular" just means "statistically less common," then it's consistent. Many scholars (like Louis Crompton or the editors of the 2014 volume) argue Bentham was trying to be careful. However, the prompt specifically highlights the phrase "departures from the natural or proper use of the relevant faculties." "Proper use" is the sticking point. "Proper" implies a *telos*. If the *telos* isn't utility, it's Natural Law. If the *telos* is utility, then acts producing pleasure are "proper." Thus, calling them "irregular" is contradictory. I will stick with the Incoherence verdict because it allows for a deeper philosophical critique.

  8.  **Drafting the Essay.** (Proceeding to generate output based on this thought process.)
answer: |-
  Jeremy Bentham's unpublished manuscripts on sexual morality, particularly the section titled "Offences Against One's Self," represent a startling anticipation of modern liberal arguments regarding sexuality. Written in the 1780s, these texts argue that consensual same-sex acts between adults should not be criminally punished because they generate pleasure without inflicting pain on others. Yet, even as he dismantles the legal and moral case for persecution, Bentham retains the classification of these acts as "irregularities," describing them as departures from the "natural or proper use" of sexual faculties. This creates a philosophical tension: can a thoroughgoing hedonistic utilitarian consistently condemn an act as "irregular" or "unnatural" while simultaneously exonerating it as harmless? To assess this, one must determine whether Bentham's language of irregularity is a neutral, statistical description compatible with utilitarianism, or a covert reimportation of the teleological natural law theory he elsewhere vehemently rejected. While a charitable reading might suggest Bentham is merely describing statistical norms, a rigorous examination of his own philosophical axioms reveals that his position is ultimately incoherent. By retaining the language of "proper use," Bentham allows a pre-utilitarian metaphysics to undermine the purity of his consequentialist framework.

  To understand the strength of Bentham's position, one must first acknowledge the radical coherence of his decriminalization argument. In "Offences Against One's Self," Bentham applies the principle of utility with surgical precision. He identifies that the primary grounds for punishing same-sex acts are rooted in "antipathy"—a visceral disgust that cannot be quantified as pain in the utilitarian calculus unless it leads to actual mischief. He argues that if an act produces pleasure for the participants and no pain for non-participants, it cannot be an offense. His comparison of sexual tastes to culinary tastes is illustrative: just as it would be absurd to criminalize a preference for certain foods, it is absurd to criminalize sexual preferences that harm no one. In this specific legal and moral conclusion, Bentham is entirely consistent with his *Introduction to the Principles of Morals and Legislation*. He successfully isolates the "principle of asceticism"—the approval of pain and disapproval of pleasure—and exposes it as irrational. If the essay ended here, Bentham's utilitarianism would appear unblemished.

  The inconsistency arises not in his legal conclusion, but in his ontological classification of the acts themselves. Defenders of Bentham's consistency argue that the term "irregularity" is merely descriptive, denoting statistical minority or biological non-procreativity, devoid of normative weight. From this perspective, a utilitarian is free to acknowledge that a behavior is rare or biologically atypical without condemning it. Just as a utilitarian might acknowledge that left-handedness is a statistical deviation from the norm without prescribing right-handedness, Bentham could classify same-sex acts as "irregular" while maintaining they are morally permissible. If "irregular" simply means "less common" or "not oriented toward reproduction," then no teleological standard is invoked; it is simply a statement of fact. Under this reading, Bentham is distinguishing between *moral* propriety (determined by utility) and *functional* or *statistical* propriety (determined by biology or demographics). This would allow him to concede ground to common language—"yes, it is unusual"—without surrendering his moral argument—"but it is not wrong."

  However, this charitable interpretation collapses when scrutinized against Bentham's specific phrasing regarding the "proper use of the relevant faculties." The word "proper" is the fissure in the argument. In a strict utilitarian framework, the "proper" use of a faculty is defined exclusively by its capacity to produce happiness. If the sexual faculties produce pleasure through same-sex acts without causing pain, then, by Bentham's own lights, this *is* a proper use of those faculties. To suggest otherwise implies that there is a standard of "properness" independent of utility. This independent standard is the hallmark of Natural Law theory, which posits that nature (or God) has endowed organs with specific teleological ends (e.g., reproduction) and that violating these ends is intrinsically disordered, regardless of consequences. Bentham famously dismissed natural rights as "nonsense upon stilts" and rejected natural law as a vague fiction used to justify prejudice. Therefore, to invoke a "natural use" that contradicts the utilitarian outcome is to smuggle in the very enemy he sought to destroy.

  Furthermore, the retention of the label "irregularity" weakens Bentham's attack on antipathy. Bentham argues that society's horror is based on prejudice, yet by classifying the acts as deviations from nature, he provides a philosophical hook for that prejudice to hang onto. If an act is "unnatural," the ascetic can argue that it violates a cosmic order, even if it causes no immediate pain. Bentham's system relies on the demystification of moral language; he sought to purge "fictitious entities" that obscured the calculation of pain and pleasure. The concept of an "unnatural" act that is nonetheless "harmless" is itself a fictitious entity in the utilitarian universe. It creates a category of "permitted vices" rather than "neutral acts." By not granting these acts full normative equality with heterosexual acts—labeling one "regular" and the other "irregular"—Bentham implicitly concedes that there is a hierarchy of pleasures based on their conformity to nature, not just their intensity or duration. This contradicts the hedonistic axiom that "pushpin is as good as poetry" if the pleasure is equal.

  One might argue that Bentham was being strategically cautious, using the language of his time to make his radical conclusions more palatable. While historically plausible, this does not save the position from philosophical incoherence *by his own lights*. Bentham's project was not merely legal reform but a reconstruction of moral language itself. He demanded that terms be anchored in real entities (pain and pleasure). When he describes same-sex acts as "irregularities" in the sense of "improper use," he is anchoring the term in a metaphysical claim about nature's design, not in a sensory observation of pain or pleasure. This is a category error within his own system. If the "irregularity" produces more net pleasure than the "regular" alternative (perhaps by avoiding the pains of unwanted reproduction or marital discord), then utilitarianism demands we call it the "better" use. To call it "irregular" is to privilege a biological function over the sovereign master of utility.

  Therefore, Bentham cannot consistently hold both positions. The decriminalization argument rests on the premise that consequences are the sole determinant of moral worth. The "irregularity" classification rests on the premise that conformity to a natural function has intrinsic value, independent of consequences. These are mutually exclusive standards. If the latter were true, then an act could be "unnatural" and therefore bad, even if it produced pleasure and no pain. Bentham rejects this in his general theory but inadvertently accepts it in his specific analysis of sex. He attempts to have it both ways: to strip the "unnatural" of its moral sting while retaining the label. In doing so, he fails to follow his own imperative to purge moral discourse of non-utilitarian fictions.

  In verdict, Bentham's position is incoherent. While his courage in defending the decriminalization of same-sex acts was centuries ahead of his time, his philosophical execution in these manuscripts betrays a residual allegiance to the teleological worldview he otherwise dismantled. A consistent utilitarian must describe harmless same-sex acts not as "irregularities," but simply as variations of pleasure-seeking behavior, no more "irregular" than any other taste that satisfies the greatest happiness principle. By conceding that they are departures from the "proper use" of faculties, Bentham admits a standard of value outside of utility, thereby undermining the foundational axiom of his own moral system. He successfully argues that the law should not punish these acts, but he fails to argue that morality should fully embrace them, leaving his system fractured between a radical consequentialist conclusion and a conservative naturalist premise.
