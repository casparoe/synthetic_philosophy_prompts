answer: |-
  The domed hall hummed with the clatter of cutlery and the low thrum of congratulatory murmurs. Renata stood near a pillar, swirling a glass of Pinot Noir, when Tomas drifted into her orbit. He looked older, the sharp angles of his postdoc hunger softened by two decades of tenure, but the eyes were the same. He tilted his head back, staring at the ceiling where the dome met the square walls.

  "Pendentives," Tomas said, not looking at her. "Though Gould would have called them spandrels."

  Renata didn't look up. "Technically, the San Marco mosaics are on pendentives too. Gould knew that. He just liked the sound of 'spandrel' better. It fit the meter."

  Tomas finally looked down, a faint smile touching his lips. "Still counting syllables, Renata? I'd have thought you'd moved past strict adaptationism."

  "I moved past the caricature of it. You know, the one where we imagine every speck of dust was optimized by natural selection. Nobody actually believes that, Tomas. Not since the eighties."

  "Could have fooled me," he said, taking a sip of champagne. "I read your paper on avian clavicle fusion. Thirty pages arguing for aerodynamic efficiency. Never once mentioned developmental constraint."

  "Because the signal was there," she countered, turning to face him fully. "When you control for phylogeny, the correlation holds. Adaptationism isn't a dogma, Tomas; it's a heuristic. It's the only tool that generates testable hypotheses. If you assume a trait is a byproduct, where do you go? You stop looking. You shrug and say 'history happened.'"

  "I go where the evidence leads," Tomas said, his voice dropping, sharpening. "I look for the null hypothesis. The burden of proof sits on the adaptationist. You claim selection shaped it? Prove it. Don't just weave a narrative about why a chin is useful for chewing and call it science."

  "A chin is a terrible example," Renata said, rolling her eyes. "But fine. Burden of proof. If I see a complex mechanism that performs a function with high specificity, the null hypothesis isn't 'noise.' It's 'design.' Not intelligent design, obviously, but selection. Because selection is the only known process that creates functional complexity. Genetic drift doesn't build eyes. Constraints don't build echolocation."

  "Constraints dictate what *can* be built," Tomas insisted. "Selection only chooses from the menu development provides. You act like selection is the architect. It's the contractor. It works with the materials on hand. Sometimes the arch is there because the math of the dome demands it, not because someone wanted a place to paint a saint."

  "And sometimes," Renata shot back, "the arch is there because it holds the roof up, and the painting is secondary. You Gouldians treat exaptation like a get-out-of-jail-free card. 'Oh, it didn't evolve for that, it was co-opted.' Fine. But it was co-opted *because* it worked. Selection still had the final say."

  They fell into a brief silence, the noise of the wedding rushing back in. A waiter passed with a tray of hors d'oeuvres; neither took one.

  "You know," Tomas said quietly, "this is exactly why the committee stalled the grant."

  Renata's grip tightened on her wine glass. "Here we go."

  "It wasn't just the budget, Renata. It was the premise. You wanted to model the entire morphological shift as an optimization function. You didn't leave any room for error. For noise. For the possibility that some of it was just... baggage."

  "Because it wasn't baggage!" Her voice rose slightly, then she checked it, lowering it to a hiss. "You wanted to fund a project that started by assuming half the data was irrelevant. You called it 'historical contingency.' I called it quitting. I wanted to find the function. You wanted to write poetry about constraints."

  "I wanted to prevent you from publishing fiction," Tomas said, meeting her gaze. "You were so confident you could reverse-engineer evolution like it was a code. But evolution is a hack. It's messy. It's full of spare parts."

  "And yet," Renata said, her voice cooling into something steel-hard, "my model predicted the fossil discovery in the Badlands. Your 'messy hack' theory didn't predict anything. It just explained why you were wrong after the fact."

  Tomas flinched, just barely. He looked back up at the dome, at the painted figures staring down from the curved triangles. "Prediction isn't the only metric of truth."

  "It's the only one that gets tenure," she said, though the bite was gone, replaced by a weary familiarity. "Look, Tomas. The roof is holding. Whether it's a spandrel or a pendentive, whether it's for load-bearing or just because the arch demanded it... it works."

  "It works," Tomas agreed softly. "But don't pretend you know why."

  "I know enough." Renata lifted her glass. "To the bride and groom. May their union be highly adaptive."

  Tomas clinked his flute against hers. "May it survive the constraints."

  They drank, the old argument settling between them like dust in the light of the chandelier, unresolved but acknowledged.
