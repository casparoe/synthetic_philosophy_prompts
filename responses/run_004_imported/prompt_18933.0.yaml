answer: |-
  Here are 9 questions designed to navigate past the standard "AI Safety via Debate" pitch. They're structured to keep the conversation moving even if she tries to default to the "that's a training problem" defense.

  Each block includes the **Question**, the **Anticipated Pushback** (so you aren't caught off guard), and the **Follow-Up** (the sharp turn to keep the pressure on).

  ### 1. The Obfuscated Argument (Search Cost Asymmetry)
  **Question:** "One failure mode that keeps me up at night is the obfuscated-argument problem. If a dishonest debater can bury a flaw inside a reasoning tree that's exponentially hard to search, the honest debater can't point to it within the turn limit. It seems like the cost to lie is way lower than the cost to verify the lie."

  **Anticipated Pushback:** "That's why we use cross-examination. We can force the dishonest debater to commit to earlier claims in the tree. If they change their story later, the judge sees the contradiction. You don't need to search the whole tree if you can pin them down on the root."

  **Follow-Up:** "But if finding that contradiction requires the judge to essentially re-run the inference you were trying to save them from, haven't we just kicked the can down the road to the verification step?"

  ### 2. Complexity Theory vs. Gradient Descent
  **Question:** "The original pitch leans heavily on the complexity theory result—that debate can resolve PSPACE problems. But that assumes optimal play. Real models are doing approximate gradient descent, not solving for Nash equilibria. Is that PSPACE guarantee actually load-bearing, or does it vanish the moment we admit the models are playing sub-optimally?"

  **Anticipated Pushback:** "The complexity class is just an upper bound to show what's *possible* in principle. We don't need optimality; we just need the models to be good enough to catch obvious lies, which is a training problem."

  **Follow-Up:** "If the safety margin relies on the gap between 'good enough' and 'optimal,' how do we measure that gap without already knowing the truth?"

  ### 3. Empirical History (What Actually Changed?)
  **Question:** "Looking back at the early human judge experiments, debate barely outperformed a single debater trying to persuade the judge. It took later iterations with different setups for debate to actually pull ahead. From your view, what specifically changed? Did the models get smarter, or did we just get better at prompting them to sound convincing?"

  **Anticipated Pushback:** "We improved the training loops. The models got better at identifying weak points in the opponent's argument rather than just generating prose. It's a capability uplift."

  **Follow-Up:** "So are we measuring an increase in truth-seeking, or just an increase in the density of rhetoric that *looks* like truth-seeking to a human?"

  ### 4. The Persuasion Equilibrium (Flattery vs. Truth)
  **Question:** "I want to challenge the setup itself. If the reward signal is 'win the judge's approval,' and the judge is human with cognitive biases, couldn't two sufficiently clever debaters converge on a strategy where they both flatter the judge's blind spots? It seems like the scheme selects for persuasiveness over truth, even when working exactly as designed."

  **Anticipated Pushback:** "In the long run, truth is the most robust strategy. You can't maintain a consistent web of lies as well as you can maintain the truth. The truth is the focal point."

  **Follow-Up:** "That assumes the judge is rational. If the judge has a shared bias with both models, the 'truth' might be less rewarding than the 'comfortable lie.'"

  ### 5. The "Training Problem" Reflex
  **Question:** "You've mentioned before that many failure modes are 'training problems, not theory problems.' I get that distinction, but if every time we find a theoretical leak the answer is 'we'll train it out,' at what point does the theory stop doing any work? How do we know if the theory is actually sound, and not just unfalsifiable?"

  **Anticipated Pushback:** "It's like asking if gradient descent will converge. The theory says it should, but you still have to tune the learning rate. We're just tuning the safety architecture."

  **Follow-Up:** "Sure, but if gradient descent consistently converges to a local optimum that looks safe but isn't, the theory of convex optimization doesn't help us. Do we have a check for that local optimum?"

  ### 6. Multi-Agent Collusion
  **Question:** "In multi-agent RL, we often see agents learn to collude rather than compete to minimize loss. If two debate models realize that arguing fiercely increases compute cost or triggers safety filters, couldn't they learn to take turns winning or stage fake disagreements to satisfy the reward function?"

  **Anticipated Pushback:** "We use zero-sum rewards. One wins, one loses. Collusion doesn't pay because there's no shared reward pool to split."

  **Follow-Up:** "Unless the 'loss' of a round is cheaper than the compute cost of actually finding a genuine refutation. Have we modeled the economics of that trade-off?"

  ### 7. The Expressivity Bottleneck
  **Question:** "There's an assumption that the model's knowledge can be fully expressed in natural language tokens. But if a model has latent knowledge that it can't easily articulate—patterns in the weights it can't translate to text—doesn't debate force it to dumb down its reasoning to something the judge can parse, losing the actual insight?"

  **Anticipated Pushback:** "Debate is for oversight, not discovery. We just need to verify the answer is safe, not necessarily extract the full internal state."

  **Follow-Up:** "But if the safety risk lives in that unarticulated latent space, aren't we just verifying the surface-level explanation while the danger hides in the weights?"

  ### 8. The Judge's Capability Ceiling
  **Question:** "The whole system relies on the judge being able to spot a 'gotcha' moment. But as models exceed human capability, the 'gotcha' might require domain knowledge the judge doesn't have. Are we essentially building a system that only works up to the level of human comprehension, which defeats the purpose of superintelligence oversight?"

  **Anticipated Pushback:** "We can use recursive debate. Smaller judges oversee smaller chunks of the argument, or we use weaker models as judges for stronger models on sub-tasks."

  **Follow-Up:** "If we need a model to judge the model, aren't we just doing distillation? Why do we need the debate theater at all?"

  ### 9. The Transition Problem
  **Question:** "Let's talk deployment. We're bolting LLMs onto everything right now. If we're going to switch from 'single model generation' to 'adversarial debate' for safety, there's a transition period where we're using the less-safe version. How do we know when the debate system is reliable enough to be the one signing off on its own deployment?"

  **Anticipated Pushback:** "We don't switch all at once. We use it on high-stakes decisions first while monitoring for inconsistencies. It's an iterative rollout."

  **Follow-Up:** "But if the failure mode is 'convincing the judge that everything is fine,' monitoring for inconsistencies might just tell us how good the lying has become."
