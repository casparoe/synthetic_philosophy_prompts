  5.  **Analyze Fragment B (Justice/Might):**
      *   **Point:** Ideally, Justice should rule. But Justice is subjective ("subject to dispute"). Might is objective ("easily recognised"). Therefore, society stabilizes by legitimizing Might *as* Justice.
      *   **Tone:** Realist, descriptive, but ultimately tragic/cynical about human capacity.
      *   **Purpose:** To explain *why* society functions the way it does despite the lack of true justice. It's a pragmatic solution to a metaphysical problem.

  6.  **Resolve the Apparent Contradiction:**
      *   *Is it a contradiction?* No. It's a progression.
      *   *Step 1:* True Justice is unknowable/unattainable by fallen humans (Fragment A).
      *   *Step 2:* Because we can't agree on True Justice, we need order to prevent chaos.
      *   *Step 3:* The only thing we *can* agree on is Power (Might).
