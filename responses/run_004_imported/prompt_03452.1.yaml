      *   Pascal is a Jansenist (Augustinian Catholic). He holds a specific view of human nature: Fallen. Corrupted by Original Sin.
      *   Key distinction: *Order of the Flesh* (Power/Politics), *Order of the Mind* (Science/Reason), *Order of Charity* (God/Grace).
