      *   *The "Specific vs General" point:* The user asked if distinguishing "knowing misleading evidence exists" from "dismissing this evidence" works. Yes, this is the **Knowledge-Action Principle** gap. Just because I know $E$ is misleading doesn't mean I'm rational to ignore it without checking, because checking might defeat the knowledge that $P$.
