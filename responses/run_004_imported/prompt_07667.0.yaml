answer: |-
  **Setting:** *The back corner of a quiet pub, the kind that still serves real ale. Two old friends, Alex and Sam, are finishing a second round. Alex leans toward the planning theory of shared agency (Bratman); Sam is a devotee of the plural subject account (Gilbert). Both know the user's background and appreciate the biological angle.*

  **Alex:** So, the wild dog case is fascinating, obviously. But this Lena and Tom hike... it's cleaner. No pups, no prey, just two humans and a bad decision. You say you think Lena wronged Tom?

  **Sam:** Absolutely. But I want to hear how you get there without a "plural subject." To me, it's straightforward. They formed a joint commitment when Tom said "Yeah, let's." That created a "we." Lena can't just unilaterally dissolve a "we." She owes him compliance or, at minimum, a negotiation to rescind. She gave him neither. She just vanished.

  **Alex:** I agree she wronged him, Sam. But I don't need your metaphysical "we" to explain it. Look at the architecture of their agency. They had interlocking intentions. Tom intended "that we summit," Lena intended "that we summit." They had meshing sub-plans—stick together, watch the weather. Crucially, they had a commitment to *mutual responsiveness*. When the weather turned, Lena's plan changed. But she didn't update the interlocking structure. She broke the common knowledge condition.

  **Sam:** But that's just describing a coordination failure. It sounds like two GPS units losing signal. I'm talking about *obligation*. Tom isn't just annoyed his GPS lost signal; he feels *betrayed*. He has standing to rebuke her. "You can't just leave me!" Why does he have that standing? On your view, if Lena decided the risk was too high, why doesn't her individual rationality trump the shared plan?

  **Alex:** Because shared intention isn't just a snapshot of mental states; it's a structure designed for stability. Bratman's point is that we intend to be locked in. If I intend that *we* paint the house, I can't just paint my half and leave because I got bored. I create a reliance in you. Lena created a reliance in Tom. By failing to communicate her change of mind, she violated the norm of stability that makes planning possible. She was practically irrational.

  **Sam:** "Practically irrational." That's the weak spot, Alex. It sounds too thin. If I promise to meet you for lunch and then don't show up, I haven't just been *irrational*. I've wronged *you*. The obligation is directed *at* Tom. On your view, the obligation is really to her own consistency, and Tom just happens to be the beneficiary. But if Lena is fine with being inconsistent, if she's a chaotic person, does she owe Tom nothing?

  **Alex:** No, because the obligation is interpersonal, just not *sui generis*. It's grounded in the fact that she invited his reliance. But let me press you on the "Shall we?" moment. You think that casual exchange created a binding joint commitment? Really? If I say "Shall we grab a beer?" and you say "Yeah," and then I see an old friend and wander off without telling you, have I violated a moral obligation? Or have I just been rude?

  **Sam:** (Laughs) You're trying to trivialize the commitment. But Gilbert is clear: the content of the commitment matches the context. A hike in nasty weather carries more weight than a beer. But the *structure* is the same. Once you express readiness to be jointly committed, you are bound until *we* agree to rescind. That's the beauty of it. It explains why Lena couldn't just decide on her own. Even if she was right about the weather, she didn't have the *authority* to end the joint activity unilaterally.

  **Alex:** And that's where your view gets too rigid. Suppose Lena saw a rockslide risk. Immediate danger. On your view, does she need to wait for Tom to agree to rescind the commitment before she runs? That seems absurd. The "plural subject" becomes a trap.

  **Sam:** Gilbert accounts for that. Special circumstances allow for unilateral rescission without penalty. But the default is joint rescission. The point is, Lena didn't think it was an emergency. She thought, "Tom would agree." She assumed she could act for the "we." But she isn't the "we." *They* are the "we." By acting alone, she treated the shared intention as if it were hers to command.

  **Alex:** Okay, but look at the outcome. They're separated. Tom is cold. On my view, the shared intention dissolved the moment their sub-plans became incompatible and she failed to communicate. The tragedy is that she *could* have maintained the shared intention of "staying safe together" by speaking up. She failed to update the plan.

  **Sam:** But on your view, could she have just told him? Imagine this: Lena turns to Tom and says, "I'm going down. You can come or stay." And Tom says, "No, I'm summiting." On my view, the joint commitment persists. She's still bound to him unless he agrees to let her go. She's effectively abandoning the post.

  **Alex:** And on my view, the shared intention dissolves right there. Why? Because shared intention requires *meshing sub-plans*. If she plans to go down and he plans to go up, they no longer mesh. They no longer have a shared intention to J. They have two conflicting individual intentions. The "we" evaporates because the cognitive structure can't hold it.

  **Sam:** There it is. That's the divergence. For you, the "we" is a fragile thing that breaks the moment minds diverge. For me, the "we" holds *precisely* when minds diverge. That's when the obligation matters most! If we both want to go down, no obligation is needed. The obligation exists to constrain us when we *don't* want to do the same thing.

  **Alex:** But that makes the obligation coercive. If Tom is being reckless and Lena is being sensible, you're saying she's *obligated* to stay with him because of a verbal contract from three hours ago?

  **Sam:** I'm saying she owes him a process. She can't just dump him. She has to say, "We need to stop." If he refuses, *then* she might have grounds to break the commitment due to his unreasonableness. But she has to try to negotiate the "we" before reverting to "I."

  **Alex:** I see the normative force you're getting at. It protects the vulnerability of cooperation. But I worry you're reifying the group. There is no "plural subject" over and above Lena and Tom. There are just two people trying to coordinate. When Lena walked away silently, she treated Tom as a means to her safety, not a partner in the plan. She bypassed his agency.

  **Sam:** And that's why I think your "interlocking intentions" is a description of the *result* of a joint commitment, not the *foundation* of it. They had interlocking intentions because they were jointly committed. When she broke the commitment, the intentions unraveled. You're looking at the smoke and calling it the fire.

  **Alex:** (Takes a sip of ale) Let's look at the verdict on the mountain, though. We both agree Lena was in the wrong.

  **Sam:** We do.

  **Alex:** So is this just a metaphysical squabble? Does it matter for Lena and Tom whether the obligation comes from a plural subject or a web of individual plans?

  **Sam:** It matters for the apology. If I'm right, Lena owes Tom an apology for *breaking a promise*—for violating their joint authority. She needs to say, "I didn't have the right to decide for us."

  **Alex:** If you're right. If I'm right, she owes him an apology for *letting him down*—for failing to be a reliable partner in a shared plan. She needs to say, "I failed to keep you in the loop when our plans needed to shift."

  **Sam:** Is there a difference?

  **Alex:** I think so. Your version implies Tom has a claim on her actions. My version implies Tom had a reasonable expectation based on her prior conduct. It's the difference between "You broke a rule" and "You broke a trust."

  **Sam:** But trust is built on rules, Alex. Social rules. The rule of joint commitment. Look, think about your wild dogs. When the pack moves out, does the alpha just decide alone?

  **Alex:** (Smiles) It's not an alpha system, actually. It's consensus. They sneeze to vote. But if a dog peels off without signaling? The pack fragments. The hunt fails.

  **Sam:** Exactly. The "plural subject" is the hunt. If one dog decides privately to stop hunting, the pack is broken. It's not just that the other dogs are confused; the *unit* is damaged. Lena damaged the unit.

  **Alex:** I can accept that metaphorically. But philosophically, I still don't see the need for a new ontological category. I can explain the damage to the unit entirely through the damage to the individuals' capacity to rely on one another in the future. Lena burned a bridge.

  **Sam:** But *why* was it a bridge? Because they built it together. You can't build a bridge alone, Alex. That's Gilbert's point. You can't intend "we" alone. It takes two to create the obligation, so it takes two to dissolve it.

  **Alex:** Alright. Here's my final push. If Lena had turned around and Tom had *seen* her, but kept climbing... On your view, is Tom now violating the commitment?

  **Sam:** If they haven't rescinded the joint commitment to summit? Yes. He's failing to uphold his end of the "we."

  **Alex:** And on my view? If Lena intends "down" and Tom intends "up," there is no longer a shared intention. Neither is violating a shared plan, because the shared plan no longer exists. They are just two individuals diverging.

  **Sam:** And that's why my view is stronger. It captures the lingering tension. Even if they split up, Tom feels Lena abandoned the *project*. You say the project died when she turned. I say the project persisted, and she killed it.

  **Alex:** (Pauses) I think... in this specific case, the verdict is the same. Lena owes Tom a serious apology and a round of drinks. But if we take this to a divorce court, or a political coalition...

  **Sam:** ...Then the difference matters. Whether the bond is a web of individual choices or a binding joint entity determines if you can walk away just because you want to.

  **Alex:** Agreed. For Lena and Tom? It was a bad hike. For the philosophy? It's still a stalemate.

  **Sam:** (Raises glass) To the plural subject.

  **Alex:** (Clinks glass) To interlocking sub-plans.

  **Sam:** Same mountain, different maps.

  **Alex:** Same mountain.
