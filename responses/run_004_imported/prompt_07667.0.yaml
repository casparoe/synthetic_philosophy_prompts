      *   **Bratmanian View:** Lena failed the "mutual responsiveness" condition. She intended "we turn back" but didn't ensure Tom knew. She violated norms of stability/reliance. But did she *wrong* him in a strong sense? Maybe just irrational/uncooperative.
      *   **Gilbertian View:** They formed a plural subject ("We are hiking"). Lena cannot unilaterally dissolve this. She needed to negotiate the rescission. By walking away silently, she violated the joint commitment. She *owed* him an account.

  4.  **Drafting the Characters:**
