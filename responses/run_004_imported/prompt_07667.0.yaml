  2.  **Deconstruct the Philosophical Positions:**
      *   **Bratman (Planning Theory):**
          *   Shared intention = Interlocking web of individual intentions.
          *   Key components: Intention that *we* J, meshing subplans, mutual responsiveness, common knowledge.
          *   Normativity: Derived from individual norms of consistency and stability. Obligations are interpersonal but grounded in individual rationality and reliance.
          *   Weakness: Can feel too thin. Does it capture the *force* of the obligation? What if one person changes their mind without communicating?
      *   **Gilbert (Plural Subject):**
          *   Shared intention = Joint Commitment creating a Plural Subject.
          *   Key components: Express readiness to be jointly committed, common knowledge of this readiness.
          *   Normativity: *Sui generis* obligations. You can't unilaterally rescind. You owe the other party compliance or negotiation.
          *   Weakness: Can feel too heavy/metaphysical. Is a casual "yeah, let's" really a binding contract? Does it over-intellectualize casual cooperation?

  3.  **Analyze the Case (Lena & Tom):**
