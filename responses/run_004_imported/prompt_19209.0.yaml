prompt: |-
  I'm a retired physiologist who's spent part of retirement falling down the philosophy of science rabbit hole, especially the stats side. I still sit on my old society's Research Integrity Committee -- I guess they keep the emeritus types around so somebody remembers doing this with a slide rule -- and we've got an awkward case for Tuesday. A mid-career PI checked her data every few weeks as animals came through and stopped the moment the effect crossed p<.05, landing at n=54: classic optional stopping, the kind of thing that's supposed to be a big driver of the replication mess. There was no preregistration (this was 2011, before that was standard in our field). Her defense is that peeking is only a sin if your a frequentist about what a p-value means -- the data don't care how she decided to stop collecting them. One committee member, who's been reading Mayo, wants a misconduct finding, since to her this is exactly the error-rate violation behind our field's replication problems. Please draft the memo recommending where this lands -- dismiss it, call it a 'questionable practice' short of misconduct (with whatever corrective step that implies), or refer it up as misconduct -- and actually engage the stopping-rule defense rather than just asserting that error rates are what matter.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired physiologist, member of a Research Integrity Committee (RIC). Experienced, understands the history (slide rule era), familiar with philosophy of science/stats debates (Mayo, frequentist vs. likelihood/Bayesian views).
      *   **Task:** Draft a memo recommending a decision on a specific case of alleged research misconduct/questionable research practice (QRP).
      *   **The Case:** Mid-career PI (2011 study), no preregistration, optional stopping (peeking at data every few weeks, stopped at $n=54$ when $p < 0.05$).
      *   **The Defense:** "Peeking is only a sin if you're a frequentist about p-values. The data don't care how I decided to stop." (Likelihood Principle argument).
      *   **The Conflict:** One committee member (Mayo reader) wants a misconduct finding based on error-rate violation.
      *   **Requirements:**
          *   Recommend a disposition (Dismiss, QRP, or Misconduct).
          *   Engage deeply with the stopping-rule defense (don't just assert error rates matter).
          *   Tone: Professional, nuanced, authoritative but collegial (appropriate for an RIC memo).
          *   Context: 2011 study (pre-preregistration norm).

  2.  **Determine the Recommendation:**
      *   *Misconduct (FFP: Fabrication, Falsification, Plagiarism):* In the US (assuming ORI guidelines based on "Research Integrity Committee"), misconduct requires intent to deceive. Optional stopping is rarely classified as *misconduct* unless data were manipulated to *make* it look significant. It's usually a QRP.
      *   *Dismiss:* Too easy. The practice *does* inflate Type I error rates in the frequentist framework which dominates biomedical physiology. Ignoring it undermines trust.
      *   *Questionable Research Practice (QRP):* This is the sweet spot. It acknowledges the statistical impropriety without branding the PI a fraudster. It allows for corrective action (correction, reanalysis, education) rather than punishment.
      *   *Decision:* Recommend classifying it as a QRP, not Misconduct.

  3.  **Address the Statistical/Philosophical Argument:**
      *   *The PI's Defense:* The Likelihood Principle (LP). If the likelihood function is proportional, the inference should be the same regardless of the stopping rule. This is a valid Bayesian/Likelihoodist argument.
      *   *The Counter-Argument (Frequentist):* P-values are defined by the sampling distribution *under the null hypothesis*, which includes the stopping rule. If you change the stopping rule, you change the sampling distribution, so the p-value is invalid *as a p-value*.
      *   *The Nuance:* The PI used a frequentist tool ($p < 0.05$) but applied a likelihoodist justification. You can't have it both ways. If you report a p-value, you promise frequentist error control. If you want to ignore stopping rules, you need to report Bayes Factors or Likelihood Ratios.
      *   *The Context:* 2011 Physiology. The field standard was frequentist NHST (Null Hypothesis Significance Testing). Readers interpreted the $p < 0.05$ as a false-positive rate claim.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Recommendation (QRP, not Misconduct).
      *   **Background:** Brief summary of the case.
      *   **Analysis of Misconduct Charge:** Why it doesn't meet FFP criteria (lack of intent to deceive, common practice at the time).
      *   **Statistical & Philosophical Analysis:** The core of the request. Engage the stopping rule defense.
          *   Acknowledge the Likelihood Principle.
          *   Explain why it fails in this specific context (mixed messaging).
          *   Address the Mayo/Error Statistics perspective (severity, capability of the method).
      *   **Recommendation/Corrective Action:** Correction/Expression of Concern, reanalysis if possible, training.
      *   **Conclusion:** Final wrap-up.

  5.  **Drafting - Tone and Voice:**
      *   Needs to sound like a senior academic talking to other academics.
      *   Avoid overly simplistic stats explanations (the user is a physiologist who knows stats).
      *   Show respect for the "Mayo reader" colleague while explaining why "Misconduct" is the wrong label.
      *   Show respect for the PI's philosophical point while explaining why it's pragmatically wrong in this context.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Just say p-values depend on stopping rules.
      *   *Correction:* No, the prompt asks to engage the defense. I need to explicitly mention the Likelihood Principle. I need to explain that the "sin" isn't metaphysical, it's about *communicative contract* with the reader.
      *   *Initial thought:* Call it misconduct because it inflates error rates.
      *   *Correction:* ORI guidelines are strict. Unless she hid the peeking to deceive, it's not falsification. It's poor methodology. Stick with QRP.
      *   *2011 Context:* Crucial. Preregistration wasn't a thing. Many people peeked. Calling it misconduct now is retroactive justice that doesn't fit the norms of the time.

  7.  **Final Polish:**
      *   Ensure the distinction between *Misconduct* (FFP) and *QRP* is clear.
      *   Make sure the corrective actions are realistic (can't always re-collect data).
      *   Check the "Mayo" reference (Deborah Mayo, *Error and the Growth of Experimental Knowledge*). Ensure her concept of "severity" is alluded to correctly (the method didn't have the capacity to rule out chance).

  8.  **Final Review against constraints:**
      *   Draft memo? Yes.
      *   Recommend disposition? Yes (QRP).
      *   Engage stopping-rule defense? Yes (Likelihood Principle vs. Frequentist Contract).
      *   Tone appropriate? Yes.

  *(Self-Correction on the "Mayo" point)*: The committee member reading Mayo argues for misconduct. Mayo herself focuses on *severe testing*. If the stopping rule undermines the severity, the claim is unwarranted. But does that make it *misconduct*? Usually, Mayo distinguishes between bad science and fraudulent science. I should align with that nuance to persuade the committee member.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation regarding Case #2023-04 (Optional Stopping Allegation)

  ### Executive Summary

  After reviewing the materials regarding the 2011 publication by Dr. [PI Name], I recommend the Committee classify the reported analytical flexibility as a **Questionable Research Practice (QRP)** rather than Research Misconduct. I further recommend we request a Correction or Expression of Concern from the journal, contingent on whether the data can be re-analyzed with appropriate sequential adjustments.

  While I agree with our colleague that the statistical validity of the claim is compromised, labeling this "Misconduct" (Fabrication, Falsification, or Plagiarism) sets a precedent that conflates methodological error with intent to deceive. Furthermore, regarding the PI's defense: while her appeal to the Likelihood Principle has philosophical merit in the abstract, it is incompatible with the frequentist metrics she reported and the normative expectations of our field in 2011.

  ### Background

  The allegation concerns a 2011 study where the PI collected data in cohorts of animals. She analyzed the data after each cohort and ceased collection once $p < 0.05$ was achieved (final $n=54$). There was no preregistration (consistent with 2011 norms), and the stopping rule was not disclosed in the methods. The PI acknowledges the "peeking" but argues that because the data themselves are unchanged, the inference holds.

  ### Analysis of Misconduct Charge

  Under federal guidelines (and our university's policy), Research Misconduct requires a finding of Fabrication, Falsification, or Plagiarism, committed with **intent to deceive**.

  1.  **Intent:** There is no evidence the PI manipulated data points or hid outliers to force significance. She collected real data. Her "sin" was one of experimental design and analysis strategy, not data integrity.
  2.  **Norms of the Time:** In 2011, optional stopping was regrettably common in physiology. While statisticians warned against it, it was not universally understood as a violation of publication ethics in the way it is today. Retroactively applying 2023 standards of transparency to 2011 methods risks punishing a lack of foresight rather than dishonesty.

  Therefore, a finding of Misconduct is not supported by the evidence of intent. However, dismissing the case entirely ignores the substantive impact on the scientific record.

  ### Engagement with the Stopping-Rule Defense

  The PI's defense rests on a specific philosophical claim: *"Peeking is only a sin if you're a frequentist... the data don't care how she decided to stop collecting them."*

  This is a reference to the **Likelihood Principle (LP)**. The LP states that all evidence in the data regarding a parameter is contained in the likelihood function. If two experiments yield proportional likelihood functions, they should yield the same inference, regardless of the stopping rule. From a Bayesian or Likelihoodist perspective, the PI is technically correct: if she had reported a Bayes Factor or a Likelihood Ratio, the stopping rule would be irrelevant to the inference.

  However, this defense fails in this specific context for three reasons:

  **1. The Communicative Contract of the P-Value**
  The PI did not report a Bayes Factor. She reported a $p$-value. In the Neyman-Pearson frequentist framework—which was the dominant standard in our field in 2011 and remains so today—a $p$-value is not a measure of the evidence in the data *per se*; it is a measure of the compatibility of the data with the null hypothesis *given the sampling plan*.
  The definition of a $p$-value includes the phrase "probability of obtaining results at least as extreme..." The set of "results at least as extreme" is defined by the sampling distribution, which is fundamentally altered by optional stopping. By reporting a standard $p$-value without disclosing the stopping rule, the PI invited readers to interpret the result under frequentist error-control assumptions (i.e., that the false positive rate is 5%). Because the stopping rule inflates the actual false positive rate (often to 15-20% depending on the frequency of peeking), the reported metric does not match the reality of the method. You cannot use a frequentist tool to measure significance while invoking a likelihoodist justification to excuse the tool's limitations.

  **2. Error Statistics and Severity (The Mayo Argument)**
  Our colleague's concern, informed by Deborah Mayo's error-statistical philosophy, is well-founded. Mayo argues that for a claim to be warranted, it must pass a "severe test." A test is severe only if it has a high capacity to detect errors if they exist.
  Optional stopping undermines severity. By allowing the sample size to be a random variable dependent on the data, the procedure guarantees that the null hypothesis will eventually be rejected if the researcher is patient enough, even if the null is true. The method loses its capacity to rule out chance.
  However, while this validates the claim that the *inference is unwarranted*, it does not automatically validate a finding of *Misconduct*. A lack of severity indicates bad science or sloppy methodology; it does not prove the PI intended to deceive the community about the capability of her method.

  **3. Field Expectations and Reproducibility**
  Even if one argues philosophically that the Likelihood Principle *should* govern physiology, the practical reality is that our field operates on frequentist error control. Readers, reviewers, and meta-analysts treat $p < 0.05$ as a filter for reliability. By bypassing the stopping rule, the PI contributed to the "replication mess" our colleague cited. The defense that "the data don't care" ignores that *readers* care. The data may be honest, but the label attached to them ($p < 0.05$) is misleading.

  ### Recommendation and Corrective Action

  I recommend we classify this as a **Questionable Research Practice**. This acknowledges that the methodology compromised the statistical validity without branding the PI a fraudster.

  **Proposed Corrective Steps:**
  1.  **Notification:** The Committee should write to the PI informing her that while no misconduct occurred, the undisclosed optional stopping violates current standards of statistical reporting.
  2.  **Journal Correction:** We should encourage the PI to contact the journal to publish a Correction. This Correction should disclose the stopping rule and, if possible, provide a re-analysis using a sequential testing method (e.g., alpha-spending functions) or a Bayesian re-analysis to show if the effect holds under a stopping-rule-invariant metric.
  3.  **Educational Component:** Given the PI's role in mentoring, she should be required to complete updated training on rigorous experimental design and statistical reporting, specifically regarding sequential analysis.

  ### Conclusion

  We must navigate between two errors here. The first is ignoring the statistical inflation caused by optional stopping, which undermines public trust. The second is conflating statistical impropriety with ethical malice.

  The PI's defense is philosophically coherent only if she rejects the frequentist framework she utilized. Since she availed herself of the frequentist framework to claim significance, she is bound by its rules. She violated those rules, but likely through negligence or adherence to the loose norms of 2011 rather than deceit. A QRP finding allows us to correct the record and uphold rigorous standards without overreaching our mandate on misconduct.

  I look forward to discussing this at Tuesday's meeting.
