          *   In the long run, Kelly beats any other strategy with probability 1.
          *   Betting more than Kelly reduces growth; betting less is suboptimal.
          *   Critique of EV: It assumes you can average across parallel universes. You only live in one.
      *   **The Samuelson Argument (Expected Utility Theory view):**
          *   Paul Samuelson's famous critique ("The Fallacy of Large Numbers").
          *   Just because something wins in the limit ($N \to \infty$) doesn't mean it's best for finite $N$.
          *   Utility is subjective. If I have linear utility, I maximize EV. If I have log utility, I maximize Kelly. If I have power utility, I maximize something else.
          *   There is no "objective" rationality independent of risk preference.
          *   "Almost sure" dominance ignores the magnitude of losses in the tails that might matter *before* the limit.

  3.  **Drafting - Scene Setting:**
