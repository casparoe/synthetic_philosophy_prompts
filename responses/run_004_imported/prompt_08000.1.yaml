answer: |-
  The viewport hummed, a low vibration they could feel in their teeth. On the other side, Berlin rain slicked the pavement. The other Priya laughed, head thrown back, arm linked with a man who wasn't Dev.

  "It's me," Priya said. Her voice was flat, stripped of the wonder Dev expected. "That is literally me."

  Dev didn't look at the screen. He looked at her. "It's a counterpart, Pri. Lewis holds. Worlds are closed sums. Nothing crosses the gap. That woman shares your origin, your genetics, maybe even your memories up to the fork, but she isn't you. Identity is strict. One thing, one place, one time."

  "Don't give me the Humphrey objection," she snapped, finally turning from the glass. "I don't care if Humphrey couldn't care less that his counterpart won. I care that when I say 'I could have gone to Berlin,' I'm not talking about a doppelgänger. I'm talking about *me*. Kripke was right. We stipulate. We fix the reference rigidly. I track the object across the boundary, I don't need to match her qualitatively to know it's my life."

  "Stipulation isn't metaphysics, it's grammar," Dev said. "You're smuggling in a ghost. You say 'tracked, not matched,' but what is the tracker? What is the thread connecting you to her? It's a haecceity. A primitive thisness. It's ontological baggage that does no work. You can't point to it, you can't measure it, you just assert it exists so you can claim ownership of a life you didn't live."

  "It's not baggage, it's the only thing that makes the counterfactual true," Priya said, stepping closer. "If it's not me, then my choices here don't mean anything. They're just local accidents. If it *is* me, then the loss is real."

  "The loss is real here," Dev said softly. "But don't mystify the mechanism. You want a magic essence that survives world-splitting. I'm saying identity is grounded in what makes you *you*. Similarity. Continuity. Causality."

  "Similarity?" Priya laughed, a brittle sound. "That's your ground? Similarity is vague, Dev. It's context-dependent. What if there's a branch where I went to Berlin, but I also dyed my hair blue and became a sculptor? And another where I went to Berlin, kept my hair, but became a banker? Which one is the counterpart? If your relation is based on relevant similarity, you can hand me two equally good counterparts in the same branch. Or none. Then what happens to my truth conditions?"

  Dev shifted his weight. "We fix the context. We decide which respects matter."

  "*You* decide," Priya corrected. "That's the cost you're willing to pay? You'd rather make truth subjective than admit there's a 'me' that persists beyond your criteria? You'd rather say 'there is no fact of the matter' than accept a haecceity?"

  "Because haecceity is empty," Dev said, his voice tightening. "It explains nothing. It's a label glued to a black box. Yes, similarity is vague. But vagueness is a feature of language, not reality. It's a smaller cost than positing invisible metaphysical glue. If there are two counterparts, then the statement 'Priya went to Berlin' is indeterminate. That's manageable. If you're right, and identity is primitive, then you're claiming access to a transworld essence we have no epistemic grip on. You're claiming you can see your own soul in the glass."

  "I'm claiming I can feel my own regret," Priya said. "And regret requires identity. I don't regret that a similar person got happy. I regret that *I* didn't. If you're right, Dev, then I'm safe. I'm sealed in this world with you, and nothing was lost. But that's a comfort bought by deleting the self."

  "It's not deleting," Dev said. "It's locating. You are here. That's enough."

  "Is it?" Priya looked back at the viewport. The other her was ordering coffee, unaware of the viewport, unaware of Dev. "Because from where I'm standing, Lewis looks like a defense mechanism. You seal the worlds so you don't have to admit I could have been happy without you."

  Dev went still. The philosophy dropped away, leaving only the silence between them. "And Kripke looks like a way to haunt yourself," he said quietly. "You want it to be you so you can mourn the death of a life that never happened."

  "Maybe," Priya said. "At least it's my death to mourn."
