answer: |-
  This is a really sharp observation, and it shows you're engaging deeply with the text. However, I would argue that your reading is **slightly off regarding Turing's specific intent**, even if it lands on a philosophically interesting spot.

  You are interpreting the ESP section as a **metaphysical concession** (i.e., "If ESP exists, minds are non-physical/non-computational, so machines can't win").

  Turing, however, treats it as a **methodological problem** (i.e., "If ESP exists, it ruins the experimental controls of the Imitation Game, so we need to block it").

  Here is a breakdown of why your read is understandable but ultimately misses Turing's pragmatic maneuver in that section.

  ### 1. Methodological vs. Metaphysical
  The core of the Turing Test is that the interrogator must judge based *only* on the answers provided through the teleprinter. The test is designed to isolate "intelligence" from "physical embodiment."

  Turing's worry about ESP isn't that it proves the soul exists or that computation is insufficient. His worry is that ESP creates an **unfair information channel**.
  *   If the human witness can telepathically transmit their thoughts to the interrogator, the interrogator isn't judging the *output* of the witness; they are reading the *source*.
  *   This breaks the symmetry of the test. The machine doesn't (presumably) have ESP, so the human has an "unfair advantage" in appearing human.

  Turing isn't saying, "ESP proves minds aren't machines." He is saying, "ESP makes the test invalid because it bypasses the input/output constraints we are trying to test."

  ### 2. The "Telepathy-Proof Room"
  The strongest evidence that Turing doesn't think this sinks his thesis is his proposed solution. He writes:

  > *"In view of these difficulties [ESP], it seems best to assume that the conditions of the game should be arranged so as to prevent telepathy... The 'telepathy-proof room'."*

  If Turing believed ESP proved that minds had a non-computable essence that machines could never replicate, he wouldn't propose a room to block it. He would concede defeat. Instead, he treats ESP like electromagnetic interference. He assumes it can be shielded against (perhaps via lead lining, similar to how we shield against radio waves).

  This implies Turing views ESP not as a mystical, non-physical phenomenon, but as a **natural phenomenon** that obeys causal laws and can therefore be physically blocked. If it can be blocked, it doesn't threaten the computational thesis; it just requires better experimental controls.

  ### 3. Computability vs. Causality
  Your reading links ESP to the "thinking can't just be computation" worry (which later becomes the Gödelian objection raised by Lucas and Penrose). But Turing distinguishes between **computability** and **causality**.

  *   **The Gödelian Objection:** Argues that human minds can see the truth of statements that a formal system (machine) cannot prove. This attacks the *logic* of computation.
  *   **The ESP Objection:** Argues that humans might have access to information without physical input. This attacks the *causal closure* of the test environment.

  Turing never suggests ESP is "non-computational." In fact, if ESP were real, a machine could theoretically be built with an ESP receiver. Turing's point is that the *standard* machine in the test doesn't have one, so we must ensure the human doesn't use one either, to keep the comparison fair.

  ### 4. Turing's Surprising Openness to ESP
  It is worth noting that Turing was actually quite open to the possibility that ESP was real. In the paper, he writes:

  > *"The statistical evidence, at least for telepathy, is overwhelming."*

  This is often shocking to modern readers. But because he took it seriously as a scientific possibility, he didn't treat it as a "gotcha" against materialism. He treated it as a variable that needed to be controlled. He didn't think it sank his thesis because he didn't view it as supernatural; he viewed it as just another part of physics that we didn't fully understand yet.

  ### Summary
  You are right that ESP *could* be interpreted as a non-physical channel that complicates a materialist view of the mind. However, **Turing does not make that argument.**

  *   **Your Read:** ESP = Non-computational magic -> Machines can't replicate it -> Thesis fails.
  *   **Turing's Read:** ESP = Uncontrolled variable -> Interrogator gets unfair clues -> Test validity fails -> **Solution: Block the signal.**

  Turing is being a pragmatist here. He wants the Imitation Game to be a clean scientific experiment. He isn't conceding that minds are magical; he's just ensuring that if magic *does* exist, it doesn't ruin his data.

  So, while your intuition connects ESP to later anti-computational arguments (like Penrose's), attributing that concession to Turing in this specific section gives him more metaphysical weight than he intended. He was more interested in saving the *test* than debating the *soul*.
