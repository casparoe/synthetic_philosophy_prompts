      *   **Model Dependence:** Modern meteorology isn't just looking at past records (pure frequentism); it's ensemble modeling (simulation). This blends frequentism and propensity.
      *   **Decision Theory:** Why do we care? To decide whether to carry an umbrella. The probability is a tool for action, not just a description of the world.

  4.  **Propensity Theory Perspective:**
