      *   **User Persona:** Retired experimental physicist, new to philosophy. Values precision, logical structure, and an "outside view."
      *   **Task:** Analyze a specific 6-step debate between two colleagues (Miriam, a statistician/frequentist, and Dev, an atmospheric scientist/critic of frequentism) regarding the interpretation of a "70% chance of rain" forecast.
