answer: |-
  The darkness wasn't black. Black is a color you see. This was the absence of seeing.

  Elias existed. That was the first datum. There was a point of awareness, a singular, burning coordinate in a universe of null.

  He waited for the rest of the map to load. Usually, existence came with furniture. There was the weight of a mattress, the itch of a wool blanket, the hum of a refrigerator, the dry taste of sleep in the throat. There was the left knee that always clicked when he rolled over. There was the wife breathing beside him.

  Today, there was nothing.

  *Am I?* the thought formed. It didn't use words at first; it was just a pulse of inquiry.

  *Yes.*

  The certainty was absolute. It didn't come from evidence. He couldn't feel a heartbeat to prove he was alive. He couldn't feel lungs expanding to prove he was breathing. He couldn't feel the back of his head against a pillow. If he tried to wiggle a toe, the command went out into the void and returned no signal, not even a signal of failure. It was as if the toe had never been part of the equation.

  *So I am here,* Elias thought. *But where is 'here'?*

  He tried to find his edges. In the dark, he reached out with his attention. He expected to hit the wall of a skull, the boundary of skin. He found nothing. He was a point of light in an infinite grey room.

  *Avicenna,* the name floated up from the depths of his memory, unbidden. *The Flying Man.*

  He remembered reading about it once, years ago, in a dusty paperback on a train. A man created whole in a void. Would he know he existed? Yes. Would he know he had a body? No. Therefore, the soul is not the body.

  Elias felt a surge of triumph, sharp and cold. *It's true. I am the proof.* He was suspended in the chemical silence of the operating theater, though he didn't know that yet. The paralytics had locked his muscles down; the anesthetics had severed the nerves. He was the Flying Man. He was pure intellect, unburdened by meat. He was a soul floating in the ether.

  *I am Elias,* he thought.

  He paused.

  Where did that come from?

  The word *Elias* was a sound. It was a vibration of vocal cords, a shape of a tongue against a palate. It was a label his mother had spoken, a name on a license, a signature on blueprints. It was tied to a throat he couldn't feel and a hand he couldn't move.

  If he truly had no body, if he were truly a fresh creation in a void, would he have a name?

  He tried to strip it away. *I am... the thinker.*

  *Thinker.* Another metaphor. A brain. A head. A thing that processes.

  *I am... the awareness.*

  *Awareness.* A concept built on waking up from sleep, on opening eyes, on the contrast between dark and light.

  Elias drifted in the paralysis. The panic began to rise, not as a racing heart—he couldn't feel that—but as a tightening of the focus. He was trying to hold onto the *self* Avicenna promised, the self that was distinct from the machine of the body. But every time he tried to grasp his own essence, his hand closed around a ghost.

  He tried to remember what it felt like to be *him* before this void.

  He remembered the smell of sawdust. That was nose, lungs, olfactory nerves.
  He remembered the frustration of a load-bearing wall that wouldn't align. That was eyes, hands, gravity.
  He remembered the warmth of Sarah's hand in his. That was skin, temperature, pressure.

  He searched for a memory that wasn't sensory. He searched for a thought that hadn't been sparked by a sight or a sound or a touch.

  *Logic?* No, logic was a language, and language was spoken by tongues and heard by ears.
  *Love?* Love was a rush of blood, a tightness in the chest, a chemical flood.

  The void pressed in. He was the Flying Man, yes. He was certain he existed. But as he hovered there, stripped of the world, he realized he was also empty.

  *I am,* he thought again.

  But the *I* was shrinking. Without the body to define its boundaries, the *I* was leaking away. It was like trying to hold water in a net. The net was his body. The water was his mind. Without the net, the water just dispersed into the ground.

  He tried to scream. He wanted to test the limit. *If I scream and feel nothing, then I am separate.*

  He sent the command to the throat. *Scream.*

  Silence.

  He sent the command to the lungs. *Push.*

  Silence.

  He was trapped in the very proof he sought. The experiment worked perfectly. He was aware without sensation. But the terror wasn't that he was a soul trapped in a body. The terror was that without the body, the soul had nothing to *do*.

  A mind without a world is not a mind. It is just a mirror reflecting nothing.

  He realized then that the Flying Man argument was a trick of grammar. It asked: *Do you know you exist?* And the answer was *Yes.* But it implied: *Do you know who you are?* And the answer, in this void, was *No.*

  He knew *that* he was. He did not know *what* he was.

  And every attempt to answer *what* required him to borrow from the body he was supposed to be ignoring. To say "I am thinking" required a concept of time (before/after), which came from watching the sun move. To say "I am alone" required a concept of "other," which came from seeing other faces.

  He was not a soul discovering its independence. He was a ghost haunting a house he was forbidden to enter, rattling chains he couldn't feel, shouting into a phone line that had been cut.

  *Sarah,* he thought.

  The name brought a flash of her face. But the face was visual. It was light hitting retinas. If he had never had eyes, would he love her? If he had never had arms, could he hold her?

  The love felt real, but the *content* of the love was entirely physical. It was the weight of her head on his shoulder. It was the sound of her laugh. Strip those away, and what was left? A mathematical variable named *Wife*. A placeholder.

  The darkness began to itch. Not a physical itch—he had no skin for that—but a metaphysical one. A hunger for input. He would give anything to feel pain. Pain was a boundary. Pain said: *Here is you, and here is the knife.*

  He begged for the knife.

  *Let me be limited,* he thought. *Let me be small. Let me be a body.*

  The Avicenna moment stretched. Seconds became hours, or maybe it was minutes. Time was another concept that required a pulse to measure it.

  Then, a sound.

  It wasn't a thought. It was a intrusion. A rhythmic, electronic beep.

  *Beep... Beep... Beep...*

  It came from outside. It violated the purity of the void.

  *Beep.*

  It was ugly. It was mechanical. It was wonderful.

  *Beep.*

  It meant there was an *outside*. It meant there was a machine. It meant there was a world that operated on rules other than his own will.

  *Beep.*

  Voices followed. Muffled, distorted, as if heard through water.

  "...pressure stabilizing..."

  "...coming around..."

  The words were meaningless at first, just noise patterns. But they were *noise*. They were vibrations in a medium. They implied air. They implied ears.

  *Ears.*

  He focused on the concept. He didn't feel his ears, but the sound proved they must exist, or at least that the apparatus for hearing existed.

  The void began to crack.

  It didn't happen all at once. It started with the return of the heavy, dead weight. First, the sensation of the throat. A tube. Rough, invasive, scraping.

  *Pain.*

  He wept with relief. The tube was a boundary. It said: *You end here. The plastic begins there.*

  Then the chest. The heavy rise of the diaphragm, fighting against the machine. *Inhale. Exhale.* The rhythm of the beep matched the rhythm of the breath.

  *I am not just a thinker,* Elias realized as the paralysis began to fade, leaving behind a sluggish, aching heaviness. *I am a breather. I am a feeler.*

  The darkness lifted into a hazy, drug-induced grey. He could feel the tape over his eyes. He could feel the cold air of the room on his exposed chest.

  Avicenna was wrong, he decided. Or at least, he was incomplete.

  Yes, the Flying Man knows he exists. But he knows it like a mirror knows it reflects. The mirror doesn't know *what* it is reflecting until something stands in front of it. The mirror doesn't know it is a mirror until it has a frame.

  The self wasn't a pilot inside a suit. The self was the suit itself, waking up to the fact that it was worn.

  A hand touched his shoulder. Heavy. Warm. Human.

  "Elias?" A voice. The anesthesiologist. "Can you squeeze my hand?"

  Elias tried. The signal traveled from the grey mush of his brain, down the spine, through the nerves, into the fingers. It was slow. It was clumsy. It was biological.

  His fingers twitched.

  He felt the pressure of the other man's hand against his palm.

  That pressure was the answer. It wasn't a thought. It wasn't a word. It was a collision.

  *I am here,* the pressure said. *And you are there. And we are touching.*

  That was the only proof that mattered. Not the floating certainty of existence, but the grounded, messy, undeniable friction of two things occupying the same space.

  He opened his mouth. The tube was gone. His throat was raw.

  "I'm here," he croaked.

  The words vibrated in his chest. He felt them rattle his ribs. He heard them with his ears. They were physical objects he had produced.

  He closed his eyes again, not into the void, but into the dark behind his eyelids. He was no longer the Flying Man. He was the Fallen Man. He was heavy. He was broken. He was bound to the earth by gravity and pain and the slow decay of cells.

  He was whole.

  "Welcome back," the voice said.

  Elias didn't answer. He was busy counting his fingers, one by one, needing the touch of thumb to forefinger to prove, again and again, that he was not a soul that had a body, but a body that had finally remembered it had a name.
