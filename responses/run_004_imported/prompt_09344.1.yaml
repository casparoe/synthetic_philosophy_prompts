answer: |-
  **Arthur:** Let's be precise. Meg enjoyed brunch. She laughed about the weather. If she were truly grieving a death, even a distant friend's, she wouldn't be ordering Eggs Benedict with such gusto.

  **Thea:** Grief isn't a monolith, Arthur. You're conflating the emotion with the behavioral disposition.

  **Arthur:** I'm conflating nothing. I'm applying Walton. Remember Charles and the slime monster? Charles screams and clutches his chair, but he doesn't call the police. He doesn't flee the theater. Why? Because he doesn't *believe* the monster exists. He's playing a game of make-believe. Meg is Charles. Your protagonist is the slime monster.

  **Thea:** But Charles's heart races. Meg's throat tightened. She cried. Those are physiological facts, not make-believe. If I prick your finger, you bleed. If Meg reads your chapter, she weeps. Why qualify the weeping as "quasi-grief"? It insults the phenomenon.

  **Arthur:** It protects the definition of emotion. An emotion requires a cognitive object—a belief that something is the case. Meg knows your character never existed. She knew it page one. You can't grieve a non-entity. What she felt was a make-believe stand-in. It mimics grief, functions like grief in the moment, but lacks the foundational belief.

  **Thea:** That's the old Cognitivist bottleneck. Thought Theory clears it. We don't need belief in existence to trigger an emotional response; we only need the entertainment of a thought. Meg entertained the thought: *A beloved father has died unjustly.* That thought alone is sufficient to generate ordinary, garden-variety grief. The tears are real tears. The lump in the throat is real muscle tension. Who are you to adjudicate her interior state based on her egg order?

  **Arthur:** I'm adjudicating based on coherence. If the grief were real, the inconsistency would be pathological. Imagine Meg saw a man collapse on the street, cried over him, then stepped over him to get coffee because "it's fiction." We'd call her psychotic. But because it's your draft, we call it art. The only difference is the frame. The frame dictates the emotion is part of the game.

  **Thea:** The frame dictates the *action*, not the feeling. I can feel real fear watching a horror movie but know I'm safe on my couch. The safety doesn't negate the fear; it just negates the need to run. Meg's safety negated the need to call 911, not the validity of the sadness.

  **Arthur:** But what is the sadness *about*? If I say, "I fear the slime monster," I am mistaken. There is no monster. If Meg says, "I grieve this man," she is mistaken. There is no man. If the object is illusory, how can the response be veridical?

  **Thea:** The object is the *scenario*, not the person. She grieves the injustice, the loss, the human cost you描绘ed. Those are real concepts.

  **Arthur:** Concepts don't die. People die. You're shifting the goalposts to save the intuition that Meg's tears are "real." But if tears alone make it real, then a actor weeping on stage is genuinely grieving. Is Hamlet's mother actually dead?

  **Thea:** The actor's pain is real. The cause is imagined. Why is "quasi-emotion" a better explanation than "emotion triggered by imagination"? One adds an unnecessary layer of metaphysical hedging.

  **Arthur:** Because without it, you can't distinguish between Meg crying at your draft and Meg crying because she hallucinated a death. Both produce tears. One is rational within a context, the other is delusion. The "quasi" label marks the boundary between sanity and fiction.

  **Thea:** Or it marks the boundary between your need for logical purity and the messy reality of how human minds work. We respond to possibilities, Arthur. Not just facts.

  **Arthur:** Then show me the evidence. Not the tears. Show me the grief.

  **Thea:** She told you she was still sad the next day.

  **Arthur:** She told you she was still *playing the game*.

  **Thea:** And you can't prove she wasn't.

  **Arthur:** No. And you can't prove she was.
