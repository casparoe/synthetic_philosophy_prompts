      *   **The Mathematical Mechanism:** When you multiply many independent positive random variables, the product tends toward a *log-normal* distribution (Central Limit Theorem applied to logs). Log-normal distributions have long right tails. The mean is pulled up by extreme outliers, while the bulk of the probability mass sits near zero.

