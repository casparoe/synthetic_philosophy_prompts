answer: |-
  This is a solid read. You are not strawmanning, and you are definitely not the first person to notice this. In fact, you've put your finger on the exact pressure point where the "decision theoretic" Rawls collapses into the "moral anthropological" Rawls.

  Here is the breakdown on the philosophy, the literature, and whether this is worth posting.

  ### 1. Is the argument fair?
  **Yes.** You are correctly identifying the shift between *A Theory of Justice* (TJ) and *Justice as Fairness: A Restatement* (JAF).

  In *TJ*, Rawls tries to sell maximin as a rule of rational choice under specific epistemic constraints (the three conditions you listed). Harsanyi's critique (the Principle of Insufficient Reason) devastated the idea that Condition 1 (Knightian uncertainty) forces maximin. If you assign equal probability to being anyone, you get average utilitarianism.

  Rawls's later concession—that Conditions 2 and 3 are doing the heavy lifting—is essentially an admission that the *epistemic* situation isn't doing the work; the *valuation* of the outcomes is.

  Your critique is that specifying Conditions 2 and 3 amounts to stipulating the conclusion (extreme risk aversion/lexical priority). This is a standard and potent objection. If the parties care *lexically* about avoiding the worst outcome, they will obviously choose the principle that protects the worst outcome. But why do they care lexically? If the answer is "because they are behind the veil of ignorance," that's false (as Harsanyi showed). If the answer is "because they are rational agents concerned with primary goods," you have to show why rational agents *must* value the floor lexically over the ceiling.

  ### 2. The Rawlsian Counter-Move (What you might be missing)
  You asked if there is a Rawlsian move that motivates 2 and 3 without presupposing the conclusion. There is, but it requires moving away from decision theory and toward **moral psychology and the conception of the person.**

  Rawlsians (like Joshua Cohen or Samuel Freeman) argue that Conditions 2 and 3 aren't arbitrary risk preferences. They are derived from the **strains of commitment** and the **two moral powers**.

  *   **The Argument:** The parties aren't just maximizing "utility." They are maximizing an index of *social primary goods* (rights, liberties, opportunities, income, wealth, and the social bases of self-respect).
  *   **Condition 3 (Unacceptable Outcomes):** An outcome isn't "unacceptable" just because it's painful. It's unacceptable if it undermines the citizen's capacity to exercise their two moral powers (a sense of justice and a conception of the good). If a utilitarian calculus allows a scenario where a minority is enslaved or destitute to the point where they cannot function as free citizens, that outcome is *structurally* off the table, not because of risk aversion, but because it violates the *point* of the social contract.
  *   **Condition 2 (Acceptable Floor):** The "floor" is defined by the minimum necessary to maintain self-respect and political agency. Once that is guaranteed, the parties don't care about gaining *more* at the risk of losing it, because the "more" (extra utility) doesn't outweigh the loss of status as a free equal.

  **The Counter-Critique:** You can argue this is *still* circular. By defining the "currency" of justice as "primary goods necessary for moral power" rather than "welfare," Rawls has already baked in a deontological constraint that privileges the worst-off's status over the average welfare. But that is a deeper meta-ethical critique. Your current draft focuses on the decision-theoretic inconsistency, which is valid, but a sharp Rawlsian will pivot to "It's not decision theory, it's the conception of the person."

  If you want to bulletproof the post, acknowledge this move. Say: *"Rawlsians might reply that this isn't risk aversion, but a requirement of moral personality. But if so, the argument for the Difference Principle rests on a controversial moral anthropology, not on thin rationality under uncertainty."* That is a stronger claim than "Rawls is bad at math."

  ### 3. The Literature (Cottage Industry Check)
  You have a good memory. This is indeed a cottage industry.
  *   **The Attack:** John Harsanyi, "Can the Maximin Principle Serve as a Basis for Morality?" (1975). This is the classic.
  *   **The Defense:** Joshua Cohen, "The Structure of Choice" (in *The Cambridge Companion to Rawls*). He argues the OP isn't a choice situation in the standard sense.
  *   **The Nuance:** T.M. Scanlon's contractualism is often seen as cleaning up this mess by removing the probabilistic calculus entirely and focusing on "reasonable rejection."
  *   **The "Smuggling" Charge:** David Gauthier and other contractarians have made the "circularity" argument explicitly. You are in good company.

  ### 4. Is this a good blog post?
  **Yes, but with caveats.**

  **Why it works:**
  *   **The Hook:** Connecting LW-style decision theory (Knightian uncertainty, EU maximization) to Rawls is a great bridge. The rationalist sphere often treats Rawls as a strawman for "egalitarian intuition," but digging into the actual decision theory of the Original Position is rare and valuable.
  *   **The Stakes:** It clarifies *why* the Difference Principle is hard to justify without heavy moral lifting.

  **Where it could fail:**
  *   **Too Inside-Baseball:** If you spend 800 words parsing *Justice as Fairness* vs. *A Theory of Justice* without explaining *why* it matters, general readers will glaze over.
  *   **Missing the "So What?":** You need to land the plane. Why does it matter if Rawls smuggles in the conclusion?
      *   *Suggestion:* The payoff is that it shows political liberalism can't rest on "thin" rationality alone. It requires a "thick" conception of the good (the moral powers). This undermines the hope that we can derive justice purely from procedural rationality.

  **Verdict:**
  Don't water it down. The LW/Overcoming Bias audience (or similar) *wants* the technical critique. Just make sure you explicitly state that Rawls's later work admits the decision-theoretic argument is secondary to the moral argument, and that your critique is that the moral argument is doing work the decision-theoretic framing tries to hide.

  **One specific edit:** You write: *"Once you're allowed to posit that some outcomes are simply off the table no matter their probability, you've basically already assumed something like infinite risk aversion."*
  A Rawlsian will say: "No, we've assumed some outcomes are *incompatible with justice*."
  You should anticipate this. Clarify that if an outcome is incompatible with justice, you shouldn't need the Veil of Ignorance to rule it out. The Veil is supposed to *generate* the principles, not filter them. If the filter is pre-loaded, the Veil is theater.

  **Final call:** Post it. It's a clean, accurate critique of a specific argumentative move in Rawls, and it connects well to the decision-theory interests of your likely audience. Just brace for the "you're ignoring the moral powers" reply in the comments (and maybe preempt it).
