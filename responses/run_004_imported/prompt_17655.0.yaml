      *   **Core Questions:**
          1.  Where does the reasoning break down regarding Supervaluationism and LEM? (Does admitting gaps force rejection of LEM?)
          2.  If both preserve classical logic, what is the *substantive disagreement*?

  2.  **Deconstruct the Logic/Semantics:**
      *   **Epistemicism:**
          *   Metaphysics/Semantics: Predicates have sharp boundaries.
          *   Epistemology: We cannot know where they are.
          *   Logic: Fully classical. Bivalence holds ($P$ is T or F). LEM ($P \lor \neg P$) holds.
      *   **Supervaluationism:**
          *   Semantics: Meaning is underdetermined. A "precisification" is a way of making the predicate precise (drawing a sharp line).
          *   Truth Definition: Supertruth = True on *all* admissible precisifications. Superfalsity = False on *all* admissible precisifications.
          *   Borderline Cases: True on some, False on others. Therefore, neither supertrue nor superfalse (a gap).
          *   Logic (The Crux): How does it handle $P \lor \neg P$?
