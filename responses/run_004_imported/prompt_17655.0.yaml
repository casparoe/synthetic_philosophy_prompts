              *   Precisification 1: $n$ is a heap (T). $\neg n$ is not a heap (F). $T \lor F = T$.
              *   Precisification 2: $n$ is not a heap (F). $\neg n$ is a heap (T). $F \lor T = T$.
              *   Since $P \lor \neg P$ is true on *all* admissible precisifications, it is **Supertrue**.
              *   *Contrast with Kleene:* In Kleene, if $P$ is Indeterminate ($I$), then $P \lor \neg P$ evaluates to $I \lor I = I$. Supervaluationism evaluates validity globally across precisifications, not locally via truth tables on gaps.
      *   **Conclusion on Q1:** The user's reasoning breaks down because they are applying truth-functional semantics (like Kleene's) to Supervaluationism. Supervaluationism is *non-truth-functional*. It preserves classical validities (like LEM) even while admitting truth-value gaps.

