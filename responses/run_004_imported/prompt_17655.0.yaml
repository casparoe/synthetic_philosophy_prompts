answer: |-
  This is an excellent question that cuts to the heart of why the Sorites seminar debates are so technically dense. You have correctly characterized Epistemicism, but your understanding of Supervaluationism is tripping over a specific technical distinction that catches almost everyone the first time they encounter it: the difference between **truth-functionality** and **global validity**, and the resulting distinction between the **Law of Excluded Middle** and the **Principle of Bivalence**.

  Here is where your reasoning breaks down, followed by an explanation of the substantive disagreement that remains.

  ### 1. Where Your Reasoning Breaks Down: Truth-Functionality

  Your assumption is: *If a sentence $P$ is neither true nor false (a gap), then $P \lor \neg P$ cannot be true.*

  This assumption holds in **truth-functional** many-valued logics, like Kleene's strong three-valued logic ($K_3$). In $K_3$, the truth value of a complex sentence is determined strictly by the truth values of its parts. If $P$ is Indeterminate ($I$), then $\neg P$ is $I$, and $I \lor I$ yields $I$. Thus, Excluded Middle fails.

  **Supervaluationism is not truth-functional.**

  Supervaluationism does not assign a value to $P$ and then calculate the value of $P \lor \neg P$ based on that. Instead, it uses a "global" evaluation method based on **precisifications**.

  1.  **Admissible Precisifications:** Imagine all the ways we could draw a sharp cutoff for "heap" that are consistent with the rules of English usage. In some precisifications, 543 grains is a heap; in others, it is not.
  2.  **Supertruth:** A sentence is **supertrue** if and only if it is true on **all** admissible precisifications.
  3.  **The Calculation:** Take a borderline case $n$.
      *   On Precisification A: $H(n)$ is True. Therefore, $H(n) \lor \neg H(n)$ is True.
      *   On Precisification B: $H(n)$ is False. Therefore, $\neg H(n)$ is True, so $H(n) \lor \neg H(n)$ is True.
      *   Since $H(n) \lor \neg H(n)$ is true on *every* admissible precisification, it is **supertrue**.

  Therefore, the Supervaluationist **preserves the Law of Excluded Middle** ($P \lor \neg P$), even though they admit truth-value gaps for atomic sentences ($P$).

  **The Crucial Distinction:**
  *   **Epistemicism:** Accepts Bivalence *and* Excluded Middle. (Every sentence is T or F; therefore $P \lor \neg P$ is T).
  *   **Supervaluationism:** Rejects Bivalence *but* Accepts Excluded Middle. (Some sentences are neither supertrue nor superfalse; yet $P \lor \neg P$ is supertrue).
  *   **Kleene (3-valued):** Rejects Bivalence *and* Excluded Middle.

  This is why the readings describe Supervaluationism as "unusually close to classical logic." It recovers all classical tautologies (theoremhood) despite introducing gaps. This is technically impressive and distinct from standard many-valued logics.

  ### 2. The Substantive Disagreement

  If both views validate classical logic (in terms of valid arguments and tautologies), why is there a fight? The disagreement is no longer about logic; it is about **metaphysics** and the **semantics of truth**.

  #### A. The Nature of Vagueness (Metaphysics)
  *   **Epistemicism:** Vagueness is purely **ignorance**. There is a fact of the matter about whether 543 grains make a heap. The boundary is sharp. Our inability to locate it is a limitation of our cognitive access, not a feature of the language or world.
      *   *Cost:* This violates strong semantic intuitions. It implies there is a "last grain of sand" that makes a heap, which seems absurd to many.
  *   **Supervaluationism:** Vagueness is **semantic indeterminacy**. There is *no* fact of the matter about the borderline case. The meaning of "heap" is genuinely incomplete.
      *   *Cost:* This requires a non-classical semantics (non-truth-functionality) to maintain classical logic, which some find ad hoc.

  #### B. The "Truth-Teller" and Bivalence
  This is the most common point of contention in seminars.
  *   **Epistemicist:** "It is true that either $n$ is a heap or it isn't. In fact, one of the disjuncts *is* true, we just don't know which."
  *   **Supervaluationist:** "It is supertrue that ($n$ is a heap or it isn't). However, it is **not** the case that ($n$ is a heap is supertrue OR $n$ is not a heap is supertrue)."

  The Supervaluationist denies the equivalence between $\text{True}(P \lor Q)$ and $\text{True}(P) \lor \text{True}(Q)$. This is a direct result of non-truth-functionality. For the Epistemicist, this equivalence holds. This leads to the charge that Supervaluationist "truth" (supertruth) isn't really truth, because it doesn't obey the disjunction property.

  #### C. Higher-Order Vagueness
  This is likely to come up in discussion.
  *   **The Problem:** If there is a sharp boundary between "heap" and "non-heap" (Epistemicism), surely there is also a sharp boundary between "definite heap" and "borderline heap"? Epistemicists accept this (we just don't know where either boundary is).
  *   **Supervaluationist Struggle:** Supervaluationism defines borderline cases as those true on some precisifications but not others. But this implies a sharp boundary between the "admissible precisifications" and the "inadmissible" ones. If that boundary is sharp, haven't we just pushed the vagueness back a step? Supervaluationists have to argue that the set of admissible precisifications is *itself* vague (leading to "global supervaluationism"), which creates significant technical complexity. Epistemicists often attack Supervaluationism here, claiming it cannot adequately model higher-order vagueness without collapsing into Epistemicism or incoherence.

  #### D. Rules of Inference (A Technical Trap)
  While Supervaluationism preserves classical *tautologies*, it does not always preserve classical *rules of inference* if validity is defined as "preservation of supertruth."
  *   **Conditional Proof** and **Reductio ad Absurdum** can fail in Supervaluationist frameworks.
  *   *Example:* From $P$, we can infer $P \lor Q$. But if $P$ is borderline (not supertrue), we cannot assert it as a premise in a supertruth-preserving argument.
  *   Epistemicism has no such problem; standard inference rules work fine because bivalence holds.
  *   *Seminar Tip:* If you want to score points, ask the Supervaluationist how they handle **Conditional Proof**. They usually have to distinguish between "local validity" (preservation of truth on a precisification) and "global validity" (preservation of supertruth), and admit that some classically valid rules fail globally.

  ### Summary for Your Seminar

  1.  **Your Correction:** You were treating Supervaluationism as a truth-functional gap theory (like Kleene). It is not. It evaluates logical operators across the set of all precisifications, which allows $P \lor \neg P$ to be true even if $P$ is gappy.
  2.  **The Logic:** Both views validate classical *logic* (tautologies), but they differ on *Bivalence*. Epistemicists accept it; Supervaluationists reject it.
  3.  **The Real Fight:** It is about whether vagueness is a form of ignorance (Epistemicism) or genuine indeterminacy (Supervaluationism).
  4.  **The Weaknesses:**
      *   **Epistemicism:** Counter-intuitive metaphysics (sharp boundaries exist).
      *   **Supervaluationism:** Semantic complexity (non-truth-functionality), failure of some inference rules, and difficulty with higher-order vagueness.

  If you frame your contribution around the distinction between **preserving theoremhood** (which Supervaluationism does) versus **preserving truth-functionality** (which it sacrifices), you will demonstrate a precise grasp of the technical landscape.
