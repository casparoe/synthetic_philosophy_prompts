      *   *Precision Medicine's Promise:* To narrow the class down to $N=1$. But statistically, you can't have a frequency for $N=1$. So we use models that approximate $N=1$ by weighting features.
      *   *Hájek's Point:* It's not just a frequentist issue. Even subjective/Bayesian priors depend on how you frame the hypothesis and evidence (which is essentially class selection).
      *   *Implications:*
          *   *Clinicians:* Don't treat the number as a fact. Contextualize. Shared decision-making.
          *   *Patients:* Avoid determinism. Understand uncertainty.
          *   *Regulators:* Validation standards. Transparency about training data (which defines the classes). Equity/Bias (which classes are represented?).

