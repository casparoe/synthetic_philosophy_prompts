      *   **Core Philosophical Issue:** The Reference Class Problem (RCP).
      *   **Key Insight:** Any individual belongs to multiple overlapping classes, yielding different probabilities. Hájek's point: switching probability interpretations (frequentist to Bayesian, etc.) doesn't solve it.
      *   **Task:** Describe the most important implications for *clinicians*, *patients*, and *regulators* regarding interpretation and communication of these risk estimates.

  2.  **Initial Brainstorming & Concept Mapping:**
