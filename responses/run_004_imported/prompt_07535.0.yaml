prompt: |-
  I'm on the grievance committee for a small writers' organization -- we run a residency and a bunch of workshops for fiction writers. We've got a case where a longtime instructor reduced a student to tears with a genuinely cruel critique last spring; he admits it, but says it happened during a manic episode, and he's got years of records backing up the bipolar diagnosis. Half the committee wants to pull him from teaching for good, same as we'd do for any other misconduct case. The other half wants to call it a health leave instead of a disciplinary matter, since he "wasnt really himself" that week. A few of us find that second option weirdly unsatisfying too -- it feels like it lets everyone off the hook, including, in a strange way, the student who got hurt and is owed more than a shrug. Can you draft the memo I'd bring to the committee recommending what we actually do, with concrete next steps and a timeline? I want it to actually wrestle with whether "he wasn't himself" is a good enough reason here, not just assume the sympathetic read is obviously the right one.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a grievance committee for a small writers' organization (residency + workshops).
      *   **Audience:** The rest of the grievance committee.
      *   **Subject:** A case involving a longtime instructor who gave a cruel critique, reducing a student to tears. The instructor admits fault but cites a manic episode (bipolar diagnosis, documented).
      *   **Conflict:** Committee is split.
          *   Side A: Permanent removal (standard misconduct protocol).
          *   Side B: Health leave (medical accommodation, "wasn't himself").
          *   Side C (User's leaning): Both options feel unsatisfying; specifically, the health leave option feels like it lets everyone off the hook and minimizes the student's harm.
      *   **Goal:** Draft a memo recommending a course of action with concrete next steps and a timeline.
      *   **Tone/Requirement:** Must wrestle with the "he wasn't himself" argument, not just assume sympathy is correct. Needs to balance accountability, safety, accommodation, and the victim's needs.

  2.  **Determine the Core Ethical/Legal/Operational Tensions:**
      *   **Accountability vs. Accommodation:** Disability rights (ADA/etc.) require reasonable accommodation, but not if it creates a direct threat or fundamental alteration of the program. However, accommodation doesn't mean exemption from consequences for harm caused.
      *   **Safety vs. Community:** The student needs to feel safe. The community needs to trust the organization. The instructor needs fair treatment regarding his health.
      *   **Precedent:** How does this decision affect future cases?
      *   **The "Wasn't Himself" Argument:** This is the crux. It risks ableism (assuming mental illness = danger) *and* risks minimization (assuming mental illness = no responsibility). The memo needs to navigate this carefully.

  3.  **Formulate a Recommendation:**
      *   *Option A (Fire)* ignores the medical context and potential for rehabilitation, possibly violating disability norms.
      *   *Option B (Health Leave only)* ignores the harm done to the student and sets a bad precedent that health issues absolve professional misconduct.
      *   *Option C (Hybrid/Restorative)*: Acknowledge the health issue *and* the misconduct. Require a leave for stabilization *plus* a clear path to return contingent on specific safeguards, *plus* direct amends to the student (if desired by the student).
      *   *Decision:* The recommendation should be a **Conditional Suspension with a Return Protocol.** This validates the harm (it wasn't *just* a medical event, it was professional misconduct) while acknowledging the health context (leave is necessary, but not a "get out of jail free" card).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Executive Summary:** State the purpose and the recommendation clearly.
      *   **Context:** Briefly summarize the incident and the split vote.
      *   **Analysis of the "Wasn't Himself" Argument:** This is crucial based on the prompt. I need to deconstruct why this phrase is problematic. It dissociates the actor from the action too cleanly. It risks ableism (bipolar = dangerous) and irresponsibility (illness = no accountability).
      *   **Guiding Principles:** Safety, Accountability, Accommodation, Transparency.
      *   **Recommendation:** The Hybrid Model.
          *   Immediate suspension (not firing, not just "leave").
          *   Requirement for medical clearance.
          *   Requirement for pedagogical retraining (craft critique vs. personal attack).
          *   Restorative justice element for the student.
      *   **Timeline/Next Steps:** Concrete actions.
      *   **Conclusion:** Reiterate the balance.

  5.  **Refining the Tone:**
      *   Needs to be professional, empathetic, but firm.
      *   Avoid legal advice (disclaimer).
      *   Ensure the student's perspective is centered, as the prompt specifically mentions the user feels the student is owed more than a shrug.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is this too legalistic?
      *   *Fix:* Keep the language accessible for a writers' org committee.
      *   *Critique:* Did I address the "wasn't himself" point enough?
      *   *Fix:* Create a specific section analyzing the pitfalls of that framing.
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Add specific dates and deliverables in the timeline.
      *   *Critique:* What about the student?
      *   *Fix:* Ensure the student has agency in the resolution (e.g., do they want an apology? Do they want the instructor back ever?).

  7.  **Final Polish:** Check against the prompt's requirement to "wrestle" with the reasoning. Ensure the distinction between *explanation* and *excuse* is clear. (The resulting memo focuses on "Accountability with Accommodation.")

  8.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Grievance Committee, [Organization Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Instructor Conduct Case [Case #2023-B]

  ### Executive Summary

  This memo addresses the grievance filed regarding Instructor [Name]'s conduct during the Spring [Year] workshop, specifically the incident wherein a student was reduced to tears following a critique. While the instructor admits to the conduct and cites a documented manic episode associated with Bipolar I Disorder, the Committee remains divided between permanent removal and a standard medical leave.

  After reviewing the incident reports, medical documentation provided, and our organizational bylaws, **I recommend a third path: A Conditional Suspension with a Structured Return Protocol.**

  This approach rejects the binary of "punishment vs. exemption." It acknowledges the medical reality without allowing it to erase the harm caused to the student. It treats the incident as both a health crisis *and* a professional failure, requiring accountability measures before any return to the classroom is permitted.

  ### Analysis of the "Wasn't Himself" Framing

  A significant portion of our debate has hinged on the instructor's assertion that he "wasn't himself" due to mania. We must be precise about what this phrase means in a policy context, as it carries risks in both directions.

  **1. The Risk of Minimization (The Student's Perspective)**
  To accept "he wasn't himself" as a full explanation risks invalidating the student's trauma. Regardless of neurochemistry, the words were spoken by the instructor. The harm was real. If we categorize this solely as a medical leave, we implicitly signal that the organization views the incident as a sickness to be managed rather than a breach of trust to be repaired. This leaves the student feeling that their safety is secondary to the instructor's health.

  **2. The Risk of Ableism (The Instructor's Perspective)**
  Conversely, treating this as standard misconduct ignores disability accommodation obligations. If we fire him solely for symptoms of a documented disability, we expose the organization to legal risk and ethical criticism. We must distinguish between *behavior* (which must be regulated) and *diagnosis* (which must be accommodated).

  **3. The Synthesis**
  "He wasn't himself" is an **explanation, not an excuse.** It explains the volatility, but it does not excuse the failure of professional boundaries. An instructor is responsible for managing their fitness to teach. Therefore, the resolution must protect the community from the behavior while offering the instructor a path to manage the health condition.

  ### Guiding Principles

  Our decision should rest on four pillars:
  1.  **Safety:** The immediate emotional safety of current and future students.
  2.  **Accountability:** Acknowledgment that harm occurred and requires repair.
  3.  **Accommodation:** Adherence to ethical (and legal) standards regarding disability.
  4.  **Precedent:** Establishing a clear protocol for future intersections of health and conduct.

  ### Recommendation: Conditional Suspension & Return Protocol

  I propose we move forward with the following plan, rather than a permanent ban or a simple administrative leave.

  **1. Immediate Status: Administrative Suspension (6 Months)**
  The instructor is removed from all teaching rosters immediately. This is not framed as a "health leave" (which implies a passive return) but as a "suspension pending review." This validates the severity of the misconduct.

  **2. Requirement of Medical Clearance**
  Before eligibility for return is considered, the instructor must provide a letter from his treating psychiatrist specifically addressing **fitness to teach in a high-stress workshop environment.** General "cleared for work" notes are insufficient; it must speak to stability in a group facilitation context.

  **3. Pedagogical Retraining**
  The incident revealed a failure in critique methodology, exacerbated by health but distinct from it. To return, the instructor must complete a workshop on "Trauma-Informed Teaching" or "Critique Ethics" (approved by the Committee). This reinforces that professional standards apply regardless of health status.

  **4. Restorative Action for the Student**
  We owe the affected student more than a shrug.
  *   **Direct Apology:** The instructor should offer a written apology to the student, vetted by the Committee to ensure it does not sound defensive or overly medicalized.
  *   **Remediation:** The organization will offer the student a full refund of the workshop fee plus a credit toward a future residency or workshop with a different instructor.
  *   **Agency:** The student must be consulted (confidentially) on whether they are comfortable with the instructor ever returning to the organization. If the student feels unsafe knowing the instructor is on the roster, their safety takes precedence over the instructor's return.

  ### Timeline and Next Steps

  | Timeline | Action Item | Responsible Party |
  | :--- | :--- | :--- |
  | **Week 1** | **Vote on Framework.** Committee votes on this Hybrid Model vs. Termination vs. Leave. | Committee Chair |
  | **Week 2** | **Notification to Instructor.** Formal letter outlining suspension and conditions for review. | Committee Chair |
  | **Week 2** | **Notification to Student.** Inform student of outcome, offer remediation, and request input on instructor's return. | Grievance Liaison |
  | **Month 3** | **Check-in.** Review instructor's progress on medical stability/training. | Committee |
  | **Month 6** | **Review Hearing.** Evaluate medical clearance and training completion. Decide on reinstatement. | Committee |
  | **Month 6+** | **Probationary Teaching.** If reinstated, instructor returns on probation with a mentor observer for first 2 workshops. | Program Director |

  ### Conclusion

  This recommendation asks the instructor to do the hard work of reconciling his health with his professional responsibilities. It asks the organization to hold two truths at once: that mental illness is real and deserving of care, and that harm caused in our spaces is real and deserving of consequence.

  By choosing this path, we protect the student from being asked to forgive too easily, and we protect the instructor from being defined solely by his worst moment.

  I request we discuss this framework at the next meeting on [Date].

  ***

  **Attachments:**
  *   Summary of Incident Report (Redacted)
  *   Draft Letter to Instructor
  *   Draft Letter to Student
