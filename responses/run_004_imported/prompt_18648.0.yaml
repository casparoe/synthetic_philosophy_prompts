answer: |-
  This is a fantastic rabbit hole to fall down. You've identified the two heavyweight contenders in the contemporary philosophy of blame. Both Wallace and Cohen agree that hypocrisy creates a problem, but as you sensed, they diagnose the *pathology* differently. That difference matters immensely for your piece on political scandals, because it changes whether we think the hypocrite is *unfair* (Wallace) or *deluded* (Cohen).

  Here is the breakdown of where their stories diverge, followed by a verdict on which one better captures the mechanics of modern political outrage.

  ### 1. The Divergence: Fairness vs. Posture

  The core tension lies in *who* is being wronged by the hypocrite's blame and *why* the blame fails.

  **R. Jay Wallace: The Fairness Account (The Blamee's Right)**
  For Wallace, standing to blame is grounded in the **reciprocal obligations of the moral community**. When I blame you, I am invoking a shared norm that binds us both. If I violate that same norm while blaming you, I am implicitly claiming an exemption for myself. I am acting as though the rules apply to you but not to me.
  *   **The Mechanism:** Hypocrisy violates the principle of **equal moral standing**.
  *   **The Consequence:** The blame is *unfair to the blamee*. Because the hypocrite has forfeited their authority by violating the norm, the blamee acquires a specific **right to reject** the blame. The hypocrite's words might be factually true ("You did steal"), but the blamee can rightly say, "You have no place to hold me to account."
  *   **The Focus:** The injury is relational. It's about the corruption of the power dynamic between the two parties.

  **G.A. Cohen: The Posture Account (The Blamer's License)**
  In "Casting the First Stone," Cohen analyzes the biblical injunction ("Let him who is without sin cast the first stone"). He argues that the problem isn't sin itself (otherwise no one could ever blame anyone), but the **presumption of superiority**.
  *   **The Mechanism:** Hypocrisy is a failure of **authentic self-presentation**. The hypocrite occupies a "posture of judgment" that implies a moral purity or authority they do not possess.
  *   **The Consequence:** The blame **misfires as a speech act**. The proposition might be true, but the *act* of casting the stone is illegitimate because it rests on a false premise (that the caster is qualified by purity). However, Cohen leaves room for a "humble sinner" to blame—if I admit I am also a sinner, I am not claiming superiority, so I might retain standing.
  *   **The Focus:** The injury is performative. It's about the blamer lying about their own moral status while judging another.

  **The Crucial Split:**
  Wallace says the hypocrite's blame is **unjust** (it treats the blamee as a subordinate). Cohen says the hypocrite's blame is **presumptuous** (it treats the blamer as a superior).
  *   **Wallace:** Gives the power to the *accused*. (You can tell them to shut up.)
  *   **Cohen:** Diagnoses the *accuser*. (They are playing a role they haven't earned.)

  ### 2. The Verdict: Why Wallace Wins for Political Scandals

  For your piece on political scandals, **R. Jay Wallace's account provides the superior explanation.**

  While Cohen offers a profound insight into moral psychology and religious judgment, Wallace's framework maps much more accurately onto the mechanics of political power and public accountability. Here is the justification for that pick.

  #### A. Politics is Structural, Not Just Personal
  Cohen's account relies heavily on the internal state of the blamer (their humility, their claim to purity). In a political scandal, the public rarely cares about the politician's soul; they care about the **legitimacy of the enforcement**.
  When a Senator who took illicit donations condemns a colleague for doing the same, the outrage isn't just that the Senator is "pretending to be pure" (Cohen). The outrage is that the Senator is attempting to wield **regulatory authority** they have forfeited. Wallace explains why this feels like a violation of justice: the hypocrite is trying to enforce a contract they have already breached. In politics, standing is about authority to govern, not just moral license to speak. Wallace captures the *institutional* corruption of the blame, whereas Cohen captures only the *personal* hypocrisy.

  #### B. The "Confessional Loophole" Problem
  Cohen's view creates a loophole that doesn't work in the court of public opinion. Under Cohen's logic, a politician could say, "Yes, I also took bribes, I am a sinner, but *you* also took bribes, so I can still cast this stone." As long as they don't claim superiority, Cohen suggests the posture might be valid.
  But in reality, this doesn't work. If a corrupt politician admits corruption and then prosecutes a rival for the same crime, we still cry foul. Why? Because **active violation of the norm undermines the authority to enforce it**, regardless of humility. Wallace accounts for this: if you are currently violating the norm, you lack the standing to enforce it, full stop. You cannot maintain equal standing while actively breaking the rules you demand others follow. Wallace explains why the "humble hypocrite" still has no standing in a political context.

  #### C. It Explains the Resentment, Not Just the Rejection
  Cohen explains why we might roll our eyes at a hypocrite (they are being pretentious). Wallace explains why we feel **moral resentment**.
  When a hypocrite blames us (or the public), we don't just think they are mistaken; we feel *wronged*. We feel bullied by someone who has no right to hold the whip. Wallace's focus on "equal moral standing" captures this emotional texture. The hypocrite isn't just making a logical error; they are asserting dominance in a relationship that should be equal. In political scandals, the public's anger is rooted in the feeling of being unfairly targeted by elites who exempt themselves from the rules. Wallace's theory validates that anger as a moral response to unfairness, rather than just a reaction to insincerity.

  ### 3. How to Use This in Your Piece

  You can frame the "tu quoque" defense not as a logical fallacy (which is how it's often dismissed in intro logic classes), but as a **normative shield**.

  *   **The Hook:** Start with the intuition that "two wrongs don't make a right," but note that in scandals, the second wrong (the hypocrisy) seems to neutralize the first (the blame).
  *   **The Pivot:** Use Cohen to show why we dislike the hypocrite (they are posturing). They are actors on a stage they haven't earned.
  *   **The Punchline:** Land on Wallace to explain why the hypocrite must be stopped. It's not just that they are annoying; it's that their blame is **unjust**. By invoking Wallace, you elevate the "hypocrisy objection" from a cheap deflection tactic to a serious demand for **reciprocity in accountability**.

  **Summary for your notes:**
  *   **Cohen:** The hypocrite is a bad *actor* (false posture).
  *   **Wallace:** The hypocrite is a bad *ruler* (unfair authority).
  *   **Winner:** Wallace. Politics is about ruling, not just acting.

  Wallace gives you the philosophical ammunition to argue that when we reject a hypocrite's blame, we aren't dodging responsibility; we are defending the principle that **authority requires integrity.**
