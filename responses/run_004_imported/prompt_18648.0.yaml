prompt: |-
  So I've been working on a piece about the "you're a hypocrite, so you have no standing to say that" move that pops up in basically every political scandal these days, and it sent me down a rabbit hole into the philosophy literature on standing to blame. Two accounts keep clashing in my notes: R. Jay Wallace's argument that hypocrisy wipes out your standing to blame because it violates the equal moral standing between persons, versus G.A. Cohen's essay "Casting the First Stone," where he seems to think the hypocrite can still be saying something true, they just cant legitimately occupy the "posture of judgment" while saying it -- like the words are fine but the act itself misfires. Can you walk me through where Wallace's and Cohen's stories actually diverge (not just that both think hypocrisy is a problem), and then tell me which one gives the better explanation of whats really going wrong when a hypocrite blames someone? Justify your pick.
