          *   Everett: Fails on intuition/probability.
      *   **The Verdict:** Rank them. 1. Everett, 2. Bohm, 3. Copenhagen. Justify why Everett's costs are preferable (ontological parsimony regarding *laws*, even if worlds multiply).
      *   **Conclusion:** Return to the user's career. The lab work supports Everett (universality of QM).

  6.  **Refining the Tone:**
