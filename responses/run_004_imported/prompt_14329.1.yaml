answer: |-
  A graduate student visits Kurt Gödel on his deathbed. Nervous, the student asks, "Professor, given your theorems... do you think consciousness survives death? Or is that just faith?"

  Gödel shakes his head weakly. "No, it's syntax. If death were the absolute end, then the formal system of 'Human Existence' would be complete."

  The student blinks. "And?"

  "And I proved in 1931 that any consistent system complex enough to contain a developing mind *cannot* be complete," Gödel whispers. "So either I live on, or my arithmetic is wrong. Hand me that pen, I need to write to my mother and tell her the universe remains consistent."
