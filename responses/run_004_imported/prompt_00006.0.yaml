      *   *The "Sleight":* The trick isn't that $n$ is evidence, it's that SSA forces the likelihood ratio to favor smaller $N$. Without SSA (e.g., SIA - Self-Indication Assumption), the prior on existing at all changes, potentially canceling the effect.
