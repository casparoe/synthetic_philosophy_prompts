answer: |-
  **Setting:** *A stone courtyard in Cordoba, twilight. A small brazier burns in the center. AL-GHAZALI (older, robed in the style of a Sufi mystic) holds a tuft of raw cotton with iron tongs. IBN RUSHD (younger, dressed in the robes of a Qadi and scholar) stands opposite him, hand outstretched as if to stay the action.*

  **IBN RUSHD:** Do not lower it, Abu Hamid. Not until you concede the point.

  **AL-GHAZALI:** Concede what? That I am about to demonstrate the truth?

  **IBN RUSHD:** You are about to demonstrate a miracle where there is only nature. You hold the cotton over the flame. You expect it to blacken and turn to ash. Why?

  **AL-GHAZALI:** Because God wills it to turn to ash.

  **IBN RUSHD:** No. You say the fire has no agency. You claim the flame is inert, a mere painting on the canvas of the moment, and that God reaches down and creates the "burning" separately from the "fire." That is what you wrote in *The Incoherence*. That the connection is not necessary.

  **AL-GHAZALI:** *(Lowering the cotton slightly closer to the heat)* It is not necessary, Averroes. It is habitual. *Adat*. Look at the fire. Look at the cotton. Can your reason find a logical link between the two? Can you deduce, purely through intellect, that red heat *must* consume cellulose? No. You only know it because you have seen it happen before. You have seen the conjunction, not the connection.

  **IBN RUSHD:** I know it because I understand the nature of things. Fire is hot and dry. Cotton is combustible. God created the fire *with* the nature to burn, and the cotton *with* the nature to be burned. To deny the fire its power is to deny the Creator's design. If the fire does not burn, then the fire is not fire. It is a lie.

  **AL-GHAZALI:** It is not a lie to say the hand that moves the pen writes the words, not the pen itself? The pen is merely the instrument. If I say the pen wrote the book, I am speaking loosely. If I say God burns the cotton, I am speaking strictly. Consider Ibrahim, peace be upon him. He was cast into the great fire of Nimrod. By your logic, he should have turned to ash instantly. The nature of fire was to burn. The nature of flesh was to combust. Yet the Quran tells us: *"O fire, be coolness and safety for Abraham."*

  **IBN RUSHD:** A miracle! We agree on the miracle.

  **AL-GHAZALI:** Exactly! If the connection between fire and burning were *necessary*—if it were bound by logic like 2+2=4—then God Himself could not stop it without contradicting His own logic. But He did stop it. Therefore, the link is not necessary. It is a habit God usually keeps, but He can break it when He wishes to show His friends that they should rely on Him, not on causes.

  **IBN RUSHD:** *(Steps closer to the brazier)* You confuse the exception with the rule. When God commanded the fire to be cool for Abraham, that was a specific suspension of the natural order to prove a prophetic truth. It was a rupture. But you, Abu Hamid, you want to make the rupture the rule! You say *every* time fire touches cotton, it is a new creation, a new miracle.

  **AL-GHAZALI:** Is the world not a continuous miracle?

  **IBN RUSHD:** If that is so, then knowledge is impossible. Think, my teacher. If causes have no power, then medicine has no power. If I drink a poison, it is not the poison that kills me, but God? If I eat bread, it is not the bread that nourishes me?

  **AL-GHAZALI:** God creates the satiety at the moment of eating, yes.

  **IBN RUSHD:** Then why do you not eat stones? Why do you not drink poison expecting life? If there is no inherent nature in the bread or the poison, then your actions are meaningless. You are living as if causes exist while preaching that they do not. This makes the world unintelligible. It makes God's wisdom appear chaotic. Why create "natures" at all if He does everything directly?

  **AL-GHAZALI:** *(Pulls the cotton back slightly)* To remind us that we are dependent. When you rely on the cause, you worship the idol of "Nature." You think the universe runs itself. I say the universe hangs on the breath of the Divine at every atom. If I believe the fire burns by its own power, I limit God. I trap Him in the laws He made.

  **IBN RUSHD:** You do not trap Him; you honor His craftsmanship. When a carpenter makes a chair, he gives the wood the strength to hold weight. Does the carpenter need to hold the chair up forever? No. He gave it the *nature* to hold. If the chair breaks, we do not say the carpenter failed to hold it; we say the wood failed in its nature. God is the Artisan. To say He must micromanage every burn is to say He created a defective world that cannot function without His constant intervention.

  **AL-GHAZALI:** Or, it is to say the world is so contingent it *cannot* function without Him. There is no "autonomy" in creation. Nothing is independent of God. Not for a blink.

  **IBN RUSHD:** But autonomy is not independence. The fire acts *by* God's power, not *apart* from it. Secondary causation is the bridge between God's will and our experience. If you burn that cotton, and it does not burn, you have a miracle. If it burns, you have nature. But you insist that even when it burns, it is *not* the fire. Why? What work is this doing for you, other than to sever the link between human action and consequence?

  **AL-GHAZALI:** It saves us from arrogance. The philosopher looks at the world and says, "I understand the machinery." The believer looks at the world and says, "I see the Hand." When I see fire burn cotton, I do not see a machine. I see a custom. God could, right now, make the cotton cool the fire. He could make the fire water.

  **IBN RUSHD:** He *could*. But He does not. And He told us He does not, by giving things definitions. In the Quran, God speaks of things having measures, limits, natures. If you deny the reality of the cause, you deny the reality of knowledge. How do I know anything? I know things by their causes. If I cannot trust that fire burns cotton, I cannot trust my senses. I cannot trust the revelation that came through the senses of the Prophet.

  **AL-GHAZALI:** You trust the senses because God makes them trustworthy through habit. He is not a deceiver, Averroes. He keeps His habit so we can live. But we must not mistake the habit for the Master.

  **IBN RUSHD:** And I say, to mistake the habit for *nothing* is to deny the Master's wisdom. Look at the cotton. It is dry. It is fibrous. It is prepared to receive the form of fire. That preparation is real. The fire's heat is real. The transfer is real. If you deny this, you make the universe a shadow play. And if the universe is a shadow play, then your own book, *The Incoherence*, is just shadows. It has no power to change my mind, because words have no power to convey meaning.

  **AL-GHAZALI:** *(Smiles faintly)* Words do not convey meaning. God creates the understanding in your heart when I speak.

  **IBN RUSHD:** *(Laughs, a short, sharp sound)* Then why speak? Why hold the tongs? Why not drop the cotton and walk away? If there is no causality, there is no reason to debate.

  **AL-GHAZALI:** Because God has created the habit that when I speak, you listen. And when I drop this cotton, you will see the ash. And in that ash, I will see the Will, and you will see the Nature.

  **IBN RUSHD:** And I will say that the Nature *is* the Will, written into the fabric of things.

  **AL-GHAZALI:** And I will say the Fabric is thin, and the Hand beneath is thick.

  *(Al-Ghazali lowers the tuft of cotton. It touches the flame. Instantly, it catches, blackening and curling into smoke.)*

  **AL-GHAZALI:** *(Watching the smoke)* God burns it.

  **IBN RUSHD:** *(Watching the smoke)* The fire burns it, by God's leave.

  **AL-GHAZALI:** We agree on the ash, Averroes.

  **IBN RUSHD:** We disagree on the Architect.

  **AL-GHAZALI:** Then let us pray the Architect knows we meant well.

  *(Al-Ghazali drops the tongs. The cotton crumbles. The fire crackles, indifferent to the distinction.)*
