  2.  **Character Development:**
      *   **Etiological Defender (Ella):** Focuses on history, evolution, natural selection, and "proper function." She cares about *why* the trait is there.
      *   **Causal-Role Defender (Carl):** Focuses on current contribution, systemic capacity, and mechanistic explanation. He cares about *what* the trait is doing now.
      *   **Names:** Let's go with "Ella" (Etiological) and "Carl" (Causal-Role).
      *   **Setting:** A quiet university café or a park bench. Let's go with a park bench—neutral ground.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Establish the definitions clearly but naturally.
          *   Ella: Function = evolutionary history (Selected Effect).
          *   Carl: Function = current causal contribution (Causal Role).

      *   **Case 1: The Malfunctioning Heart:**
          *   *Scenario:* A heart with a defect that pumps poorly.
          *   *Carl's Attack:* If it doesn't pump well, it lacks the function of pumping blood *now*.
          *   *Ella's Defense:* It still *has* the function of pumping blood, it's just failing at it. Function is normative (what it *ought* to do).
          *   *Carl's Counter:* But if I'm explaining the organism's current survival, citing a broken heart's "function" is misleading.
          *   *Ella's Rebuttal:* That's why we distinguish "function" from "functional." The capacity is the history; the performance is the physics.

      *   **Case 2: The Vestigial Tailbone (Coccyx):**
          *   *Scenario:* It used to be for tails, now it's just... there (or anchors muscles).
          *   *Ella's Attack:* Its *original* function is gone. If it has a new one, that's a new function.
          *   *Carl's Defense:* It currently anchors muscles. That's a causal role. That's its function *now*.
          *   *Ella's Counter:* But calling it a "tail" function is wrong. We need history to distinguish vestige from active trait.
          *   *Carl's Rebuttal:* History is irrelevant to the current system. If it contributes, it functions. If it does nothing, it has no function.

      *   **Case 3: The Freak Organ (Chance Assembly):**
          *   *Scenario:* A mutation creates a new structure immediately useful (e.g., filters toxin), but wasn't selected *for* yet (just happened). Or a stone in the stomach that digests food (Millikan's example). Let's use a spontaneous mutation that helps immediately.
          *   *Carl's Attack:* It helps the organism survive. It has a function.
          *   *Ella's Defense:* No. It has a *beneficial effect*, but not a function yet. Function requires selection history.
          *   *Carl's Counter:* That seems arbitrary. If it saves the life, why deny it function?
          *   *Ella's Rebuttal:* Because "function" explains presence. If it wasn't selected for, its presence is an accident, not a functional explanation.

      *   **Synthesis/Conclusion:**
          *   Acknowledge that both capture something important.
          *   Ella captures normativity (health/disease).
          *   Carl captures mechanistic explanation (how it works).
          *   End on a note of respectful stalemate/complementarity.

  4.  **Refining and Polishing:**
      *   *Check Constraints:* Did they answer directly? Yes. Did they cover the three cases? Yes. Is the language accessible? (Avoid overly dense jargon like "teleosemantics" unless explained).
