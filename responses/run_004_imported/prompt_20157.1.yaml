answer: |-
  **Setting:** *A quiet corner of a university garden. Two philosophers, **Ella** (defending the Etiological/Selected-Effect view) and **Carl** (defending the Causal-Role/Systemic view), sit on a bench. They have been arguing for an hour.*

  **Ella:** Look, Carl, we're going in circles. When a biologist says, "The function of the heart is to pump blood," they aren't just describing physics. They are making a historical claim. They mean the heart is there *because* it pumped blood in the ancestors of this organism. That is the only thing that distinguishes a function from a mere side effect.

  **Carl:** But that history is invisible to the organism currently alive! When a physiologist studies a heart, they care about how it contributes to the circulation system *now*. If you define function strictly by ancestry, you lose the ability to explain how the organism actually works in the present moment. My view is simpler: A function is just a causal contribution a part makes to the capacity of the whole system.

  **Ella:** Simplicity isn't truth. Let's test this. Imagine a person born with a severe heart defect. The heart is too weak to pump blood effectively. On your view, since it isn't successfully contributing to circulation, does it lose its function?

  **Carl:** I'd say its *capacity* is diminished. It's still part of the circulatory system, and it's still attempting to generate pressure. But strictly speaking, if it contributes nothing to the organism's survival, calling it "functional" is misleading. It's a broken component.

  **Ella:** And that's where you fail to capture medical reality. We say that heart is *malfunctioning*. Not that it *lacks* a function. If I say, "His heart isn't doing what it's supposed to do," I am appealing to a standard. That standard is history. The heart has a "proper function" determined by selection, even if this specific heart is failing at it. Your view can't distinguish between a heart that is broken and a rock in the chest cavity that also isn't pumping blood. Both have zero causal contribution.

  **Carl:** I can distinguish them! The heart is *structured* to pump blood. Its internal mechanics are arranged for that causal role, even if they are currently failing. The rock isn't. I don't need evolutionary history to see the design; I just need to look at the mechanics. But let's turn your history view against itself. Consider the human coccyx—the tailbone. In our ancestors, it supported a tail. In us, the tail is gone. Does the coccyx still have the function of supporting a tail?

  **Ella:** No. And my theory handles that perfectly. The function of the ancestral coccyx was tail support. In modern humans, that specific selected effect is gone. If the modern coccyx serves as an anchor point for pelvic muscles, that is a *new* function, provided it was selected for that purpose recently. But we can call it vestigial precisely because its original etiological function is absent.

  **Carl:** But that's clumsy. In a modern human, the coccyx *does* anchor muscles. It contributes to the stability of the pelvic floor. If a surgeon asks, "What is the function of this tissue?" and you say, "It used to hold a tail, so currently it has no function," you're giving bad advice. You're ignoring what it is actually *doing* right now to keep the patient upright. My view says: If it contributes to the system's capacity, it has a function. History is irrelevant to the current mechanical explanation.

  **Ella:** History is relevant because it tells us what the trait is *for*. If that muscle anchor is just a leftover accident of development and hasn't been selected for yet, calling it a "function" implies the organism was designed for it. That's a dangerous assumption. But fine, let's push harder. Imagine a "freak organ." Suppose a random mutation causes a strange new sac to form in a bird's stomach. By sheer chance, this sac filters out a new toxin in the bird's food, saving its life. It has no evolutionary history. It wasn't selected for; it just happened. Does it have a function?

  **Carl:** Absolutely. It is contributing to the bird's survival capacity. It is doing work. If you deny it has a function, you're saying the bird isn't benefiting from it. That seems absurd. It's functioning as a toxin filter.

  **Ella:** It has a *beneficial effect*, yes. But it does not yet have a *function*. Here is why: If you ask, "Why is that sac there?" the answer cannot be "To filter toxins." It wasn't put there by selection for that reason. It's an accident. If the bird dies before reproducing, that sac vanishes. For something to have a function, its presence must be explained by the benefit it provides. In your freak organ case, the benefit does not explain the presence. Selection hasn't had time to act.

  **Carl:** But that makes "function" a label you can only apply in hindsight, after the organism is dead and its lineage traced. Biologists working in the field need to know what traits are doing *now* to understand the ecosystem. If that sac keeps the bird alive, it plays a role in the ecosystem. Denying it "function" status just because it's new feels like gatekeeping. You're prioritizing the past over the present utility.

  **Ella:** I'm prioritizing explanation over description. You are describing what happens; I am explaining why it is there. If we conflate "beneficial effect" with "function," we lose the ability to talk about disease. If a virus mutates and starts using human cells to replicate, does the human cell have the "function" of replicating the virus? On your view, since it's a causal contribution the virus is making use of, maybe yes.

  **Carl:** No, because the function is relative to the *system* we are analyzing. In the system of the human body, the cell's causal role is to maintain tissue. In the system of the virus, the cell is a factory. We just have to specify the containing system. Your view gets tangled here, too. What if a trait was selected for one thing, but now does something else? Feathers likely evolved for warmth, not flight. Do feathers have the function of warmth or flight?

  **Ella:** They have both, but at different times. The etiological function of early feathers was thermal regulation. Later, as selection pressures shifted, flight became a new selected effect. We can trace the shift. Your view just says "they do both now," which misses the evolutionary transition. It flattens time.

  **Carl:** And your view risks freezing traits in the past. If a trait shifts utility quickly, your view lags. You have to wait for generations of selection to confirm the "new" function. Meanwhile, the organism is living, breathing, and using that trait. I care about the biology of the living individual. You care about the biography of the lineage.

  **Ella:** I care about the difference between working and broken, between design and accident. Without history, "function" is just a synonym for "useful effect." And if function is just usefulness, then a pacemaker has the same ontological status as a heart.

  **Carl:** And why not? They both pump. They both contribute to the circulation system. One is made of cells, one of silicon. If we are studying the capacity of the organism to survive, the distinction matters less than the causal contribution.

  **Ella:** Because biology isn't engineering. Biology is history written in flesh. If you ignore the history, you stop doing biology and start doing mechanics.

  **Carl:** And if you ignore the mechanics, you stop explaining how life works and start telling just-so stories about the past.

  **Ella:** *[Pauses, smiling slightly]* So, we agree that the heart pumps, the coccyx anchors, and the freak sac filters.

  **Carl:** We agree on the physics. We just disagree on whether "function" is a label for what a thing *does*, or a stamp of approval from Natural Selection on why it *exists*.

  **Ella:** Precisely. And until we decide if we are asking "How does it work?" or "Why is it here?", we'll keep talking past each other.

  **Carl:** Then perhaps the word "function" is doing too much work. Maybe you should keep "Proper Function" for your history, and let me have "System Function" for the mechanics.

  **Ella:** I could accept that. As long as we don't let the doctors confuse a broken heart with a rock.

  **Carl:** And as long as we don't let the evolutionists ignore a useful trait just because it's new.

  **Ella:** Deal.

  **Carl:** Deal. Now, shall we go get lunch? I believe the function of this sandwich is to alleviate hunger.

  **Ella:** *[Laughing]* Careful, Carl. Unless you have a selection history for sandwich-eating, that's just a beneficial effect.

  **Carl:** Touché, Ella. Touché.
