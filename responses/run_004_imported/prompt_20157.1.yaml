      *   *Flow:* Ensure the transition between cases feels natural.

      *(Self-Correction during drafting)*: I need to make sure I don't confuse "Causal Role" with simple "utility." Causal Role is about contributing to a capacity of the containing system. I need to make sure Carl emphasizes the *system* aspect.
