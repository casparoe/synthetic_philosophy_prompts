          *   Is it a relabeling? No, it's a category shift. But it comes with costs (epistemic access, metaphysical queasiness).
      *   *Conclusion:* Summarize the trade-offs. DTA tries to naturalize modality but fails the inference test. Maudlin accepts modality as primitive. Humeans accept regularity and deny modality. No free lunch.

  6.  **Refining the Philosophy:**
      *   *Check Armstrong's specifics:* Armstrong distinguishes between "Necessitation" (the relation) and "necessity" (the modal status). He admits $N$ is contingent. This is exactly where Van Fraassen pounces.
      *   *Check Maudlin:* He explicitly critiques DTA for the inference problem. He argues laws govern *particulars* directly, not via universals.
