answer: |-
  **MEMORANDUM**

  **TO:** Radiology Peer-Review Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Case Review [ID #]: Cognitive Bias and Workflow Protocols

  **Purpose**
  This memo outlines my recommendation regarding Case [ID #], in which a probable mass was identified following a referral note citing "strong clinical suspicion of malignancy," resulting in an unnecessary biopsy. The committee is currently divided between classifying this as an individual performance failure or a systemic vulnerability.

  **Recommendation**
  **I recommend classifying this as a Systemic Issue and implementing a "Sequential Review" protocol for referrals containing high-alert language.**

  I do not recommend individual discipline or mandatory remediation for the radiologist involved. Instead, we should pilot a workflow adjustment where the initial image assessment is committed to the record *before* the detailed clinical history is opened in the PACS for cases flagged with high-probability language (e.g., "rule out cancer," "high suspicion").

  **Reasoning: The Science of Perception**
  We must acknowledge that visual perception in radiology is not a passive recording of data; it is a constructive cognitive process. The literature on diagnostic error consistently supports the reality of **expectation bias** (priming). When a radiologist is told to expect malignancy, the brain engages in "top-down processing," subconsciously lowering the threshold for ambiguity to match the expectation.

  This is not an excuse for negligence; it is a feature of human neurology. Studies show that even highly experienced radiologists are susceptible to having their visual search patterns altered by clinical history. To claim a competent radiologist should be "immune" to this is to ignore how human perception functions. If we treat this purely as a competence issue, we imply that the solution is "try harder," which is not a sustainable safety strategy.

  **Balancing Clinical Context**
  The counter-argument—that clinical history is vital for sensitivity—is correct. Context helps us find subtle abnormalities we might otherwise miss (increasing true positives). Removing history entirely increases the risk of false negatives.

  The **Sequential Review** protocol offers a middle ground:
  1.  **Preserves Sensitivity:** The radiologist still reviews the history before finalizing the report, ensuring clinical context informs the final decision.
  2.  **Reduces Bias:** By forcing an initial commitment based solely on pixel data, we create a "cognitive anchor" based on the image, not the referral note. This disrupts the priming effect.

  **Conclusion**
  Classifying this as a systemic issue acknowledges that while the radiologist made the error, the workflow facilitated it. By adjusting *when* information is consumed rather than *what* information is consumed, we protect patients from unnecessary procedures without compromising our ability to detect true pathology.

  I move we adopt this classification and refer the workflow proposal to the Quality Improvement subcommittee.
