answer: |-
  Here are 9 questions designed to press the internal tensions of the Augustinian position without being antagonistic. They move from the metaphysics of language to specific case studies, ending with a modern comparison.

  ### 1. The Ontology of the Sign
  Augustine defines a lie not just by its falsehood, but by the *double-heartedness* of the speaker—holding one thing in the mind and signifying another. If language is fundamentally a system of signs given by God to convey truth, is the sin of lying primarily a violation of a social contract with the listener, or is it a metaphysical disorder within the speaker's soul, regardless of whether anyone is actually deceived?

  *   **Follow-up (if she says "It's about the soul's disorder"):** If the disorder is internal, why does the *external* formulation matter so much? If I hold a false belief in my mind and speak it, I am in error but not lying. If I hold the truth and speak falsely, I am lying. But if I hold the truth, speak ambiguously, and *know* you will infer the false, the internal disorder seems identical. Why does the grammar save the soul in the second case but not the first?

  ### 2. The Eightfold Ranking (*De Mendacio* 14.25)
  In *De Mendacio*, Augustine outlines eight grades of lying. A jocose lie (for fun) is the least grave, while a lie to save an innocent life is more grave, though both are sins. If the wrongness of lying is intrinsic and non-consequentialist—based on the violation of Truth itself—what metric are you using to rank the gravity? If consequences don't determine *right vs. wrong*, why do they seem to determine *degree of sin*?

  *   **Follow-up (if she says "It tracks the disorder of the will"):** But the will to deceive is present in both the joke and the life-saving lie. In the life-saving case, the will is ordered toward charity (saving a life), even if the means are illicit. In the joke, the will is ordered toward triviality. Why is the will *more* disordered by an act of charity than by an act of triviality, if the act itself (the false assertion) is identical?

  ### 3. The Consentius Episode (*Contra Mendacium*)
  Consentius wanted Augustine's blessing to infiltrate the Priscillianist heretics by pretending to be one of them, intending to expose them for the good of the Church. Augustine wrote a whole treatise telling him no. Was his refusal based on the pragmatic fear that Consentius would be corrupted, or was it the principle that you cannot serve Divine Truth using the tools of the Father of Lies, even if the alternative is the spread of heresy?

  *   **Follow-up (if she says "It's about the corruption of the agent"):** If the mission succeeded perfectly—Consentius exposes the heretics, returns to the Church, and remains personally holy—was the act still sinful? If yes, then the sin is entirely detached from the actual spiritual harm caused. Does this make the moral law a test of obedience rather than a framework for human flourishing?

  ### 4. The Murderer at the Door: Silence vs. Assertion
  In the classic "murderer at the door" scenario, the Augustinian line is usually that you may remain silent or misdirect, but you may not assert a falsehood. But if I say, "He isn't here," while meaning "He isn't here *in this room*" (knowing the murderer thinks I mean "in this house"), haven't I still successfully willed the murderer's deception? Does the prohibition forbid the *intent to deceive*, or just the *linguistic vehicle* used to carry it?

  *   **Follow-up (if she says "It forbids the false assertion, not the intent"):** Then morality becomes a matter of semiotics rather than ethics. If I can achieve the exact same deceptive outcome through a wink, a silence, or a technically-true ambiguity, and God permits those but forbids the flat assertion, are we protecting the neighbor's life, or are we protecting the sanctity of the grammatical indicative mood?

  ### 5. Broad Mental Reservation
  Some later casuists developed "broad mental reservation," where the speaker relies on the listener's inability to access the hidden qualification (e.g., "I did not eat the cake" [since you have no right to ask]). Does this distinction hold up under Augustinian scrutiny? At what point does a mental reservation cease to be a legitimate protection of privacy and become a sophisticated mechanism for lying without the technical label?

  *   **Follow-up (if she says "It depends on the listener's right to the truth"):** Who adjudicates that right in the moment? If I am the sole judge of whether you have a "right to the truth," haven't I effectively made myself the arbiter of moral law to suit my immediate needs? Doesn't that subjective judgment introduce more disorder into the will than a simple, prohibited falsehood?

  ### 6. The Victim's Right to Truth
  Implicit in the "murderer at the door" defense is the idea that the murderer has forfeited his right to the truth by his malicious intent. But Augustine seems to suggest the duty is on the *speaker*, not the *listener*. If I lie to the murderer, I damage my own relationship with God. Does the neighbor's imminent death weigh less in the moral calculus than the speaker's spiritual integrity?

  *   **Follow-up (if she says "God can save the innocent without your sin"):** That relies on a theological gamble. If I know with high probability that my lie is the *only* causal factor that will save the life, and I choose my integrity over their life, am I not making my salvation an idol? Is "keeping my hands clean" a form of moral selfishness in extremis?

  ### 7. Pastoral Burden and Scandal
  For a layperson in your congregation, this teaching is incredibly high-stakes. A mother hiding a child from a persecutor must worry that telling a simple "no" is a mortal sin. Does holding this line risk creating a scrupulous conscience where people fear God more in their grammar than in their justice? How do you pastorally counsel someone who lied to save a life and is now consumed by guilt?

  *   **Follow-up (if she says "The guilt is a sign of a healthy conscience"):** Or is it a sign of a distorted moral hierarchy? If the penitent feels that God cares more about their verbal assertion than their neighbor's blood, is that the Holy Spirit convicting them, or is it a theological system producing spiritual trauma? At what point do we question the system that produces the trauma?

  ### 8. Divine Command vs. Natural Law
  Is the prohibition on lying a Divine Command that we accept by faith (because God said it), or is it a Natural Law truth accessible to reason (because it violates the nature of communication)? If it's Natural Law, why do secular ethical systems overwhelmingly reject the "no lie to save a life" conclusion? If it's Divine Command, is it arbitrary?

  *   **Follow-up (if she says "It's Natural Law accessible to reason"):** If it's accessible to reason, why has the "murderer at the door" intuition been so persistent across cultures and eras? Is it possible that the "exception" is actually part of the natural law, and the Augustinian strictness is a specific theological superstructure rather than a universal rational truth?

  ### 9. The LessWrong "Meta-Honesty" Comparison
  There is a community of modern rationalists (the LessWrong crowd) who grapple with "meta-honesty." They hit the same wall you do—that total honesty can be self-destructive. But their solution is to optimize for truth-tracking by being honest about their *policy* of honesty, rather than every data point. They try to route around the dilemma; you accept the sacrifice. Is their approach a sophisticated utilitarianism, or is it a recognition that the Augustinian "hard line" is functionally impossible for finite agents trying to navigate a fallen world?

  *   **Follow-up (if she says "They are just consequentialists"):** But if their system produces better outcomes (lives saved) and maintains high social trust without demanding martyrdom, what is the *residue* of sin that remains? If the Augustinian line requires you to let the innocent die to avoid a sin, and the Meta-Honesty line saves the innocent without collapsing trust, is the Augustinian position preserving *Truth*, or is it preserving the *appearance* of Truth at the cost of the Good?
