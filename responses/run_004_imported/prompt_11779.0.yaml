  so for my history of science elective we had to read part of von Neumann's essay "Can We Survive Technology?", and the part that stuck with me is where he says weather control could end up scarier than nuclear weapons, since it could be done gradually and you'd never really be able to prove who caused it. he seems pretty chill about technology itself tho, like his whole point is that progress cant be stopped, so the only real move is getting better at adapting to it politically instead of finding some permanent fix. if he somehow saw modern AI, do you think he'd put it in that same "worse than nukes" bucket as weather control, or is it more just a normal case of the tech-outpacing-politics thing he already talks about with stuff like population growth? and going off his actual argument instead of just vibes, what do you think he'd actually say we should do about AI risk?
