answer: |-
  This is a fantastic case study, and honestly, it's the kind of real-world data that makes pragmatics seminars worth sitting through. You're asking for a principled story about the **norms of assertion** and the interaction between **evidentiality**, **stakes**, and **illocutionary force**.

  Here is the breakdown: Semantically, your statement was a prediction with high credence. Pragmatically, it functioned as testimony. And in high-stakes contexts, statistical evidence generally does not license the same illocutionary force as direct evidence, even if the probability mass is identical.

  Here is the principled story you're looking for, broken down by the relevant frameworks.

  ### 1. The Norm of Assertion (KNA vs. JB)
  The dominant philosophical view (Timothy Williamson, etc.) is the **Knowledge Norm of Assertion (KNA)**: *Assert that p only if you know that p.*

  *   **Did you know she was in?** No. You had a high credence belief based on inductive reasoning from a reference class.
  *   **The Counter:** Many linguists and philosophers argue KNA is too strict. We assert things we don't strictly "know" (e.g., "The train leaves at 5," based on a schedule we glanced at). A weaker norm is the **Justified Belief Norm**: *Assert that p if you have sufficient justification for believing p.*

  **Where you ran into trouble:** "Sufficiency" is context-sensitive. In a casual conversation about dinner plans, 97.5% is sufficient justification for "We're going to Luigi's." In a high-stakes emotional context involving family announcements, the threshold for "sufficient justification" rises. This leads us to **Pragmatic Encroachment**.

  ### 2. Pragmatic Encroachment and Stakes
  This is likely the strongest argument for why your cousin is upset. **Pragmatic Encroachment** (Stanley, Fantl & McGrath) posits that whether a subject *knows* (or is warranted in asserting) a proposition can depend on the practical stakes of being wrong.

  *   **Low Stakes:** If you bet $5 on it, your base rate evidence warrants a flat assertion.
  *   **High Stakes:** Your cousin was preparing to manage her family's expectations and her own emotional regulation. The cost of a False Positive (telling Grandma she got in when she didn't) was significantly higher than the cost of a False Negative (telling her to wait and she got in).

  By asserting flatly ("You're in"), you implicitly guaranteed the truth conditions. When the stakes are high, a flat assertion signals that the speaker has ruled out relevant alternatives. You did not rule out the "1 in 40" alternative; you just assigned it low probability. In high-stakes contexts, low probability is not the same as ruled out.

  ### 3. Statistical vs. Individual Evidence (The Gatecrasher Paradox)
  You mentioned your intuition that this feels different than if you'd overheard a committee member. This is a classic problem in epistemology and legal theory, often discussed via the **Gatecrasher Paradox** or **Naked Statistical Evidence**.

  *   **Scenario A (Base Rates):** 97.5% of interviewees get in. Cousin interviewed. Therefore, Cousin gets in.
  *   **Scenario B (Direct Evidence):** You overhear "Cousin gets in."

  Even if the probability of error is identical (say, 2.5% chance you misheard vs. 2.5% chance she's the outlier), **Scenario B licenses assertion; Scenario A typically does not.**

  **Why?**
  *   **Causal Connection:** Direct testimony is causally connected to the specific fact of the admission. Statistical evidence is connected to the *group*, not the *individual*.
  *   **Sensitivity:** A belief is "sensitive" if, were it false, you wouldn't hold it.
      *   If she *hadn't* gotten in (Scenario B), you wouldn't have overheard the name (presumably). Your belief tracks the truth.
      *   If she *hadn't* gotten in (Scenario A), the base rate would still be 39/40. Your belief remains the same regardless of the specific truth value of *her* outcome.

  In linguistics, this maps onto **Evidentiality**. A flat assertion in English typically defaults to a **Direct Evidential** or at least a **Reportative** interpretation. It implies access to the specific state of affairs. Using a flat assertion based on statistical evidence creates an **Evidential Mismatch**. You signaled direct access (or sufficient specific evidence) when you only had probabilistic group data.

  ### 4. Gricean Maxims (Quality and Quantity)
  *   **Maxim of Quality:** "Do not say that for which you lack adequate evidence."
      *   Again, "adequate" is the variable. Given the stakes, statistical evidence was likely inadequate for a flat assertion.
  *   **Maxim of Quantity:** "Make your contribution as informative as is required."
      *   This is the tricky one. You *were* informative. But Grice also implies you should not be *more* informative than warranted. By dropping the modal hedge ("You're probably in," "It looks great"), you removed the marker of uncertainty. You violated the expectation that the form of the utterance matches the strength of the evidence.

  ### The Verdict: Did you mess up?
  **Pragmatically, yes.**

  You treated the utterance as a **prediction** (which licenses high probability). Your cousin interpreted it as **testimony** (which licenses knowledge/direct access).

  In English, the difference between:
  1.  "You're in." (Flat Assertion)
  2.  "You're basically in." (Hedged Assertion)
  3.  "It's looking really good." (Implicature of high probability)

  ...is not just semantic decoration. It is a signal of your **epistemic authority** over the proposition. By using (1), you claimed authority you didn't possess. You claimed the 2.5% risk was negligible *for her purposes*, but it turned out to be the exact risk that mattered.

  ### How to fix it (The Apology Strategy)
  Since you're both in the field (or adjacent), you can actually use this to repair the relationship. Don't just say "I'm sorry I was wrong." Say:

  > "I've been thinking about this from a pragmatics angle, and I realize I violated the norms of assertion. I treated the base rate as sufficient evidence for a flat assertion, but given the stakes of telling your family, I should have used epistemic modals to signal that it was probabilistic, not direct knowledge. I claimed an epistemic authority I didn't have, and that put you in a bad position with your family. I'm sorry."

  This validates her feeling (that you spoke out of turn) without invalidating your logic (the math *was* on your side), while acknowledging that **logic does not override pragmatics.**

  **Summary:** The principled story is that **assertion strength must scale with both evidence type (direct > statistical) and practical stakes (low < high).** You had statistical evidence in a high-stakes context but used the linguistic form reserved for direct evidence in low-stakes contexts. That is a pragmatic infelicity.
