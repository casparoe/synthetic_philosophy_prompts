answer: |-
  **Setting:** *A chalkboard covered in payoff matrices and probability trees. It is late afternoon. CATE (Causal) and ED (Evidential) are erasing a section of the board to make space for a new equation.*

  **Cate:** Look, I'm willing to concede the point for the sake of the seminar. In the symmetric Death in Damascus case, Causal Decision Theory creates a loop. If I calculate the causal utility of staying in Damascus, I have to condition on my decision. But if I decide to stay, I have overwhelming evidence that Death is already in Damascus. So the causal expected utility of staying plummets. I should flee. But if I decide to flee to Aleppo, the same logic applies. Neither act is ratifiable.

  **Ed:** Exactly. That's the Skyrms critique. An act is ratifiable only if, supposing you do it, it remains the optimal choice. In this case, CDT finds itself in a state of perpetual oscillation. But notice where you stopped. You said CDT creates the loop. I'm saying EDT dissolves it, or at least, reinterprets it.

  **Cate:** Dissolves it? How? If I'm an evidential agent, and I know Death is a perfect predictor, then $P(\text{Death in Damascus} \mid \text{I go to Damascus})$ is near one. My V-expectation for going to Damascus is basically the utility of dying. Same for Aleppo. So EDT also says neither act is preferable. You haven't escaped the instability; you've just reproduced it using conditional probabilities instead of causal counterfactuals.

  **Ed:** That's the standard objection, but it misses the nuance of how EDT handles the *source* of the correlation. You're treating the decision as a bare event. But for an evidentialist, the decision is evidence of the *mental state* that caused it. If I know my own decision process—if I have access to the "tickle," the internal cues leading to the choice—then conditioning on the act screens off the correlation with Death's location.

  **Cate:** The "tickle" defense. Eells' move. You're arguing that once I know *why* I'm choosing Damascus, the probability of Death being there drops back to the prior. But Gibbard and Harper's case is set up to block that. Death reads the *book of fate*, not your neural ticks. If the prediction is metaphysically prior to your deliberation, your internal state doesn't screen off the correlation. You're still conditioning on an act that is evidentially linked to your demise. So, be honest: isn't EDT just as unratifiable here as CDT?

  **Ed:** Suppose I grant that. Suppose the correlation holds even given the mental state. EDT still handles the *instability* differently. For you, the instability is a failure of the theory to recommend an action. The causal utility of $A$ depends on the probability of $K$ (the state of the world), but $P(K)$ shifts when you suppose $A$. For me, the shift in probability is just Bayesian updating. If I suppose I go to Damascus, I update my belief about Death's location. Yes, the value of the act drops. But that's not a decision-theoretic paradox; that's just learning bad news.

  **Cate:** It *is* a paradox if the theory cannot identify a stable equilibrium. If I can't find an act $A$ such that $U(A \mid A) \ge U(B \mid A)$, then the theory offers no guidance. It tells me to do $A$, which makes me want to do $B$, which makes me want to do $A$. That's not just "bad news"; that's a breakdown of agency. You're saying EDT agents just accept that they have no ratifiable act and... what? Flip a coin?

  **Ed:** Ah, the mixed strategy. This is where I think you're being too rigid. If neither pure act is ratifiable, the agent should look for a mixed strategy that *is* ratifiable. If I assign a probability of 0.5 to Damascus and 0.5 to Aleppo, and Death predicts this *propensity* rather than the specific outcome, then the conditional probability of Death being in either city matches my propensity.

  **Cate:** Wait. If Death predicts the propensity, then $P(\text{Death in Damascus} \mid \text{I choose Damascus with } p=0.5)$ is 0.5. In that specific case, yes, the expected utility of Damascus equals the expected utility of Aleppo. The mixed strategy becomes ratifiable. But you've changed the ontology of the choice. You're no longer choosing between *Damascus* and *Aleppo*. You're choosing between *Damascus*, *Aleppo*, and *Randomize*.

  **Ed:** And why shouldn't that be a valid option? If the pure acts lead to instability, rationality demands we expand the action space to include probability distributions over acts. If the mixed strategy stabilizes the conditional utilities, then it is the ratifiable solution. EDT can accommodate this naturally because it treats the act as evidence. If I evidence that I am randomizing, Death evidences that I am randomizing.

  **Cate:** But does Death predict the *randomization* or the *outcome*? If Death is a perfect predictor of where I actually end up, then randomizing doesn't help. If I flip a coin and it lands Damascus, Death was already in Damascus. The correlation remains perfect at the level of outcomes. The only way randomization saves us is if Death's prediction is limited to my *causal propensity* to act, not the act itself.

  **Ed:** Precisely. And that seems like a reasonable constraint on prediction. If the universe is indeterministic, or if my decision process involves a genuine stochastic element, Death can't predict the token outcome, only the type. In that case, the mixed strategy is stable. The instability you're worried about only exists if we assume a deterministic world where Death knows the output of your deliberation before you do.

  **Cate:** But if we assume indeterminism to save the theory, aren't we just dodging the philosophical bullet? The Death in Damascus case is supposed to test decision theory under conditions of high correlation, not test our metaphysics of free will. If CDT requires me to believe in stochastic choice to find a ratifiable act, then CDT is dependent on metaphysical assumptions it shouldn't need.

  **Ed:** Fair. But look at it from my side. If I stick to pure acts, EDT admits the instability. I agree with you there. If the correlation is perfect, $V(\text{Damascus} \mid \text{Damascus})$ is low. But I argue that the *recommendation* of EDT isn't to oscillate. It's to recognize that the act provides such strong negative evidence that the agent should seek a different act—namely, the mixed act. You claim this changes the question. I claim it answers the question that was actually asked: "What should I do?" Sometimes the answer is "Don't commit to a location; commit to a distribution."

  **Cate:** Here's my worry, though. If you allow the mixed strategy as a fix, you're essentially saying the agent should make their choice unpredictable to themselves. But deliberation is supposed to settle uncertainty. If I decide to randomize, I haven't settled where I'm going. I've just punted the decision to a coin flip. Is that really *decision making*? Or is it an admission that decision theory has no purchase here?

  **Ed:** It's an admission that in Newcomb-like problems with symmetric payoffs, there is no *pure* strategy equilibrium. That's a feature of the game, not the theory. Game theory tells us the same thing about Matching Pennies. If there's no pure equilibrium, play the mixed equilibrium. Why is it a dodge for decision theory but standard procedure for game theory?

  **Cate:** Because in game theory, the other player is adversarial. Here, Death is a predictor. If I decide to play the mixed strategy, and Death knows I'm doing that, does he go to Damascus with probability 0.5? If he does, then I'm indifferent. But if he knows the *outcome* of the mix, I'm dead. You're relying on a gap in Death's knowledge. CDT, ideally, shouldn't rely on gaps in the predictor's knowledge to find a ratifiable act. It should be able to say, "Given this setup, doing $A$ is better than $B$." It can't. And neither can you, unless you smuggle in indeterminism.

  **Ed:** I'm not smuggling it in; I'm noting that without it, the problem is ill-posed for *any* theory. If the future is fixed and known, deliberation is an illusion. If we assume deliberation is real, there must be some epistemic openness. EDT embraces that openness by treating the decision as evidence that updates the probabilities. CDT tries to hold the probabilities fixed by the causal structure, but in this case, the causal structure is swamped by the evidential correlation. You end up with a theory that says "Do $A$" while simultaneously saying "If you do $A$, you should have done $B$." That's a contradiction. My theory says "If you do $A$, the news is bad, so consider doing $C$ (randomize)." That's consistent.

  **Cate:** It's consistent, but is it actionable? If I tell my students, "CDT fails here because neither act is ratifiable, but EDT saves you by telling you to randomize," I'm teaching them that CDT is broken and EDT is only fixed by changing the action space. Maybe the lesson is that ratifiability is too strong a constraint for pure acts in symmetric prediction cases.

  **Ed:** Or maybe the lesson is that ratifiability is the *correct* constraint, and it shows us that pure acts aren't always the right grain of analysis. Look, we're not going to resolve this before the seminar starts. But for the students, I think the key is to show them that both theories struggle with the *pure* acts. The divergence is in whether we view that struggle as a fatal flaw (your view) or a signal to expand the domain of choice (my view).

  **Cate:** I can agree to that. I'll present the CDT oscillation as a motivation for Skyrms' ratifiability condition, and then show how even with that condition, CDT has no pure solution. You can present the EDT view that the "instability" is just informational updating, and that the mixed strategy provides a stable equilibrium *if* we accept the propensity interpretation.

  **Ed:** Deal. But I'm keeping the slide on the "tickle" defense. Just in case a student asks if we really know our own minds well enough to screen off the correlation.

  **Cate:** Fine. But I'm adding a footnote that if the tickle works, the case collapses, and then we haven't taught them anything about decision theory. We've just taught them about introspection.

  **Ed:** *Laughs.* Touché. Alright, let's write up the payoff matrix. Symmetric, zero-sum against Death.

  **Cate:** One moment. If we treat it as zero-sum against Death, does that imply Death is an agent?

  **Ed:** *Pauses, chalk in hand.* ...We're not opening that can of worms today. Let's just call it "Nature with a grudge."

  **Cate:** Agreed.
