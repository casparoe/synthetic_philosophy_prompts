      *   *Technical Check:* In standard Death in Damascus, CDT recommends neither. EDT *also* recommends neither if the correlation is perfect, because $P(Death | Damascus) \approx 1$. So EDT isn't automatically safe. I need to make sure Ed doesn't claim EDT is obviously superior, but rather argues about how EDT interprets the conditioning.
