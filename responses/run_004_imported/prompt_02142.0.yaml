answer: |-
  Your intuition is not merely a family resemblance; it is a structural identity. CEV is, effectively, Ideal Advisor Theory (IAT) ported from the metaphysics of individual well-being to the engineering of collective alignment. However, the porting process involves a shift from *realism* about the ideal self (Brandt/Railton) to *constructivism* about the ideal collective (Yudkowsky). This shift determines whether the classic objections are solved or merely displaced.

  Here is the mapping, followed by the verdict on the objections.

  ### Part 1: The Mapping

  We can map the four operational components of CEV directly onto the machinery of Brandt, Railton, and Rawls, though the "Moral Growth" and "Coherence" clauses introduce significant strain.

  **1. "If we knew more" $\rightarrow$ Brandt's Cognitive Psychotherapy / Railton's Full Information**
  *   **The Map:** This is the most direct correspondence. Brandt's "cognitive psychotherapy" is the repeated exposure to all available, relevant information, vividly represented, to extinguish desires caused by false belief. Railton's "fully informed counterpart" similarly possesses all relevant non-evaluative facts.
  *   **The Function:** In all three cases (Brandt, Railton, CEV), this serves as a *filter*. It removes desires contingent on empirical error (e.g., wanting to drink a glass because you think it is water, not poison).
  *   **The Strain:** Brandt emphasizes *vividness* and *repetition* to ensure causal impact on the desire-system, not just intellectual assent. CEV's "knew more" is often interpreted computationally (access to data), potentially missing Brandt's psychological requirement that the information must actually *causally* modify the desire. A superintelligence might know everything, but if its extrapolation model doesn't simulate the *psychological impact* of that knowledge on human neural architecture, it fails the Brandtian test.

  **2. "Thought faster" $\rightarrow$ Railton's Full Rationality**
  *   **The Map:** Railton's ideal advisor is "fully rational." This implies no logical errors, perfect instrumental reasoning, and consistency. CEV's "thought faster" is the computational analog: removing processing bottlenecks that prevent the agent from seeing implications of their beliefs.
  *   **The Function:** This ensures *instrumental coherence*. It prevents desires that contradict each other or contradict the agent's own deeper commitments due to myopia.
  *   **The Strain:** "Speed" is not identical to "Rationality." One can think very fast and still be systematically biased (e.g., a fast but racist calculator). Railton's rationality includes substantive norms of reasoning, not just throughput. CEV risks conflating computational capacity with normative rationality unless the "rationality" module is explicitly defined beyond mere optimization power.

  **3. "More the people we wished we were" $\rightarrow$ Rawls's Deliberative Rationality / Railton's Social Rationality**
  *   **The Map:** This is the point of greatest divergence from Brandt. Brandt is conservative: cognitive psychotherapy reveals what you *already* would want if cleared of error. It does not authorize *value change* beyond error correction. CEV's "wished we were" clause, however, aligns closer to Rawls's "deliberative rationality" (choosing a plan of life one can endorse) or Railton's notion that the ideal self might want the actual self to *cultivate* new desires.
  *   **The Function:** This allows for *moral growth*. It authorizes the extrapolation to discard desires that are not based on false facts, but are nonetheless judged "lower" by the agent's own reflective standards (e.g., spite, addiction, parochialism).
  *   **The Strain:** This breaks the "Discovery" model of Brandt. If I can become "more the person I wish I was," the target of extrapolation is moving. In Brandt, the "good" is fixed by the actual desire structure + information. In CEV, the "good" is fixed by the actual desire structure + information + *a normative judgment about which desires are worth keeping*. This introduces a regress: Which "wishes about wishes" get extrapolated?

  **4. "Extrapolated... as a whole" + "Converge" $\rightarrow$ The Aggregation Problem (New Variable)**
  *   **The Map:** Neither Brandt nor Railton solves interpersonal conflict. Brandt's theory yields *my* good; Railton's yields *my* good. If our ideal selves conflict, they offer no arbitration. CEV introduces a **Coherence Constraint**: the extrapolation is only valid if individual volitions converge.
  *   **The Function:** This turns the theory from an account of *Well-Being* into an account of *Legitimacy*. It acknowledges that for AI alignment, "Humanity's Good" cannot be a vector sum of conflicting ideals; it must be a singular directive.
  *   **The Strain:** This is where the analogy snaps. In individual IAT, convergence is assumed (the ideal self is coherent by definition). In CEV, convergence is a *contingent empirical hope*. If Brandt's individual ideal selves diverge, CEV has no output.

  ---

  ### Part 2: The Verdict

  You asked for a verdict on whether scaling to CEV makes genuine progress on the Indeterminacy (Sobel) and Authority (Rosati) objections, or merely relocates them.

  **Verdict:** CEV **relocates both problems**, but it transforms them asymmetrically. It converts the Indeterminacy problem into a **Safety Feature** (progress for AI control, stagnation for moral metaphysics) and converts the Authority problem into a **Political Legitimacy** problem (regress for individual autonomy).

  Here is the mechanism for why they come apart under aggregation.

  #### 1. Indeterminacy (Sobel): Relocated as a "Null Result"
  Sobel's critique is that the function $f(Self, Information)$ is path-dependent. Slight variations in how information is presented or the order of processing yield different ideal selves. There is no unique fixed point.

  *   **Individual Case:** This destroys the theory. If there is no unique "Ideal Advisor," there is no fact of the matter about your good. The theory fails to guide action.
  *   **CEV Case:** Aggregation does **not** solve the mathematical indeterminacy. The Law of Large Numbers cancels out *random noise*, but path-dependence is *systematic chaos*. If every individual's extrapolation is sensitive to initial conditions, the aggregate of billions of extrapolations will be a "spread" of chaotic outputs, not a convergent vector.
  *   **The Mechanism of Separation:** CEV makes progress *only* because it changes the success condition. Brandt/Railton need a unique answer to define "The Good." CEV only needs a unique answer to *act*.
      *   If the extrapolation fails to converge (due to Sobel-style indeterminacy), CEV dictates the AI **does nothing** (or reports the spread).
      *   **Verdict:** This is genuine progress for *AI Safety* (it prevents the AI from acting on a hallucinated convergence), but it is **no progress for Moral Philosophy**. It admits that "Humanity's Volition" may be metaphysically indeterminate. It solves the *risk* of indeterminacy by treating it as a stop-condition, not by solving the *truth* of indeterminacy.

  #### 2. Authority (Rosati): Relocated as "Disenfranchisement"
  Rosati's critique is that the Ideal Self is a "stranger." Even if we know what my Ideal Self wants, I (the Actual Self) may feel no motivational pull toward it. It lacks authority over me.

  *   **Individual Case:** The gap is between *Actual Me* and *Ideal Me*. I can reject the Ideal Me as "not really me."
  *   **CEV Case:** Aggregation **widens** this gap. The CEV is not just my Ideal Self; it is the *Coherent Extrapolation of Everyone Else's Ideal Self*, constrained to agree with mine.
  *   **The Mechanism of Separation:** Under aggregation, the source of authority shifts from *Prudential* to *Political*.
      *   In Brandt/Railton, the Ideal Advisor's authority rests on **Prudential Rationality**: "This is what is good *for you*."
      *   In CEV, the Authority rests on **Social Contract**: "This is what *we* would want."
      *   **The Regress:** If my Ideal Self wants X, but the Converged Humanity wants Y (because X conflicts with others' extrapolated wishes), CEV selects Y. The authority is no longer "This is your good," but "This is the consensus good."
      *   **Verdict:** This is a **regress** regarding the Authority objection. Rosati's worry is that the Ideal Self is alienating. The CEV is *maximally* alienating. It can override my actual desires *and* my ideal desires for the sake of coherence. The "stranger" is no longer a hyper-rational version of me; it is a committee of hyper-rational versions of everyone else. The motivational purchase is lower, not higher, because the link to *my* identity is diluted by the coherence constraint.

  ### Summary of the Mechanism

  The two problems come apart under aggregation because **Indeterminacy is an Ontological problem**, while **Authority is a Normative problem**.

  1.  **Ontological (Indeterminacy):** Aggregation cannot fix the non-existence of a fixed point. If individual volitions are chaotic, the collective volition is chaotic. CEV "solves" this only by refusing to act when chaos is detected. It turns a metaphysical failure into an engineering brake.
  2.  **Normative (Authority):** Aggregation *changes* the source of normativity. It trades the "Authority of the Self" (which was already weak per Rosati) for the "Authority of the Consensus." This does not solve the alienation problem; it compounds it. You are no longer ruled by a stranger version of yourself; you are ruled by a stranger version of Humanity that has explicitly negotiated away your specific divergences to ensure coherence.

  **Final Conclusion:** CEV does not solve the philosophical vulnerabilities of Informed-Desire theories. It **operationalizes** them. It treats the Sobel objection as a system failure mode (safe, but silent) and treats the Rosati objection as a political trade-off (authoritative, but potentially tyrannical). As a theory of well-being, it is weaker than Railton's. As a protocol for AI alignment, it is more robust only because it is willing to output "Error: No Convergent Volition Found" rather than forcing a false positive.
