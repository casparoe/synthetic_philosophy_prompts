prompt: |-
  My younger brother was diagnosed with bipolar disorder a few months ago, and during his manic episodes he has said genuinely cruel things to me that he claims to barely remember afterward and is mortified by once he's stable again. My therapist advises me to stop resenting him and instead treat his outbursts the way I would treat bad weather: something to plan around rather than take personally. That approach works for maybe half the time; the rest of the time, the resentment returns regardless, and I then feel guilty for being so inconsistent about it. Is that inconsistency simply a failure on my part, or might my flashes of resentment be tracking something real that a purely clinical attitude toward him would miss?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Core Issue:** The user's younger brother has bipolar disorder. During manic episodes, he says cruel things. He claims amnesia/lack of control during episodes and feels mortified afterwards.
      *   **Current Coping Strategy:** The user's therapist suggested treating the outbursts like "bad weather" (plan around, don't take personally).
      *   **Problem with Strategy:** It works only ~50% of the time. Resentment returns.
      *   **Secondary Problem:** The user feels guilty about the inconsistency (resentment $\rightarrow$ guilt).
      *   **Key Question:** Is this inconsistency a personal failure, or does the resentment track something real that a purely clinical attitude misses?

  2.  **Validate and Normalize:**
      *   First and foremost, the user needs to know they are *not* failing. Caregiver/sibling fatigue is real.
      *   The "bad weather" analogy is common but has limitations. It can feel dismissive of the emotional impact.
      *   Guilt is a common secondary emotion in these dynamics.

  3.  **Address the "Failure" Question:**
      *   Is it a failure? No. It's a human response to pain.
      *   Emotions aren't switches. You can't just decide not to be hurt.
      *   Inconsistency is normal in grief and trauma processing.

  4.  **Address the "Tracking Something Real" Question:**
      *   This is the profound part of the query. Does resentment signal a boundary violation or a need for safety?
      *   Yes. Resentment often signals that a boundary has been crossed or a need is unmet.
      *   A "purely clinical attitude" risks dehumanizing the brother *and* the user. It ignores the relational impact.
      *   The words *were* said, even if influenced by illness. The impact is real.

  5.  **Deconstruct the "Bad Weather" Analogy:**
      *   *Pros:* Helps depersonalize, reduces immediate reactivity.
      *   *Cons:* Implies passivity, ignores the damage caused by the "storm," suggests the user just needs a better umbrella rather than the storm needing management.
      *   *Nuance:* Weather is impersonal. People are relational. Even if the illness drives the behavior, it comes through a person the user loves.

  6.  **Explore the Function of Resentment:**
      *   Resentment is a protective emotion. It says, "This is not okay."
      *   It highlights the cost of the illness on the *sibling*, not just the patient.
      *   It points to the need for accountability (even if limited) or safety plans.

  7.  **Formulate Actionable Advice/Reframing:**
      *   **Stop the Guilt Loop:** Inconsistency $\neq$ Failure. It's part of the process.
      *   **Validate the Hurt:** Acknowledge that the words hurt, regardless of intent.
      *   **Refine the Boundary:** Instead of "don't take it personally," try "I love you, but I cannot be spoken to this way."
      *   **Accountability vs. Blame:** The brother isn't to *blame* for the illness, but he is responsible for *management* (meds, therapy, recognizing triggers) and *repair* (apologies, making amends).
      *   **Self-Care:** The user needs support outside of this dynamic.

  8.  **Drafting the Response (Iterative Process):**
      *   *Opening:* Validate the difficulty. Affirm that it is not a failure.
      *   *Section 1: The "Bad Weather" Analogy.* Acknowledge its utility but highlight its limits. It protects the mind but can invalidate the heart.
      *   *Section 2: The Wisdom of Resentment.* Answer the specific question: Yes, resentment tracks something real. It signals boundary violations. It prevents compassion fatigue from turning into self-erasure.
      *   *Section 3: The Guilt.* Explain why the guilt is happening (expecting superhuman emotional regulation). Advise on self-compassion.
      *   *Section 4: Moving Forward.* Practical steps. Distinguish between the *illness* and the *person*. Focus on safety and repair.
      *   *Closing:* Reiterate support and the validity of their experience.

  9.  **Refining Tone:**
      *   Needs to be empathetic, non-judgmental, and psychologically grounded.
      *   Avoid toxic positivity ("Just love him!").
      *   Avoid pathologizing the user ("You're codependent").
      *   Balance compassion for the brother with protection for the user.

  10. **Final Review against Safety Guidelines:**
      *   Does this encourage dangerous behavior? No.
      *   Does it diagnose? No (brother is already diagnosed).
