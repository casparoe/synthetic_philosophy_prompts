  11. **Final Polish:** (Produces the structured response below.)
answer: |-
  This is a profoundly difficult situation, and the short answer to your question is: **No, this inconsistency is not a failure on your part.** And yes, **your flashes of resentment are likely tracking something real that a purely clinical attitude misses.**

  It is understandable that you feel torn. You want to be a supportive sibling, but you are also a human being with limits. Here is a breakdown of why the "bad weather" analogy has limits, why your resentment is actually a useful signal, and how to navigate the guilt.

  ### 1. The Limits of the "Bad Weather" Analogy
  Your therapist's suggestion is a common cognitive behavioral tool designed to help you **depersonalize** the abuse. The goal is to stop you from thinking, *"He said I'm worthless because he thinks I'm worthless,"* and shift it to, *"He said I'm worthless because his brain is currently misfiring."*

  When it works, it saves you from unnecessary pain. But when it fails, it is usually because the analogy is incomplete.
  *   **Weather is impersonal; relationships are not.** A hurricane does not love you, and it does not apologize afterward. Your brother does. When the "storm" passes, you are left standing in the debris with the person who caused it.
  *   **Weather implies passivity.** You can only hunker down and wait for a storm to pass. But in a relationship, you need agency. You need to be able to say, "This is not safe for me."
  *   **It risks erasing your pain.** If you treat his words *only* as symptoms, you may inadvertently treat your own wounds as irrelevant. But the words were still spoken, and they still landed on your heart.

  ### 2. Resentment as a Signal, Not a Sin
  You asked if your resentment tracks something real. In many ways, **yes.**

  Psychologically, resentment is often described as a "boundary emotion." It flares up when a line has been crossed, when a cost has been incurred, or when a dynamic is becoming unsustainable. If you suppress that resentment entirely in the name of being "clinical" or "understanding," you risk **compassion fatigue** or **self-erasure.**

  Your resentment might be tracking:
  *   **The need for safety:** It reminds you that you cannot be vulnerable with him during certain phases.
  *   **The need for accountability:** While he may not be *culpable* for the mania, he is responsible for the *repair*. Resentment often lingers when apologies feel insufficient or when there is no plan to prevent recurrence.
  *   **The grief of the relationship:** It highlights the gap between the brother you have when he is stable and the brother you encounter during mania. That gap is painful, and resentment is sometimes a mask for grief.

  ### 3. The Guilt Loop
  You mentioned feeling guilty for being inconsistent about the "bad weather" approach. This is a secondary wound.
  *   **Emotions are not light switches.** You cannot toggle between "compassionate sibling" and "hurt human" on command. Healing and coping are non-linear.
  *   **Expecting consistency is unrealistic.** Living with a family member's mental illness is a form of chronic stress. In chronic stress situations, emotional regulation is harder. Having "bad days" where you feel angry does not undo the love you have for him.
  *   **Guilt keeps you small.** If you spend your energy feeling guilty about your resentment, you have less energy to actually protect your boundaries or support your brother.

  ### 4. A More Sustainable Approach
  Instead of trying to force the "bad weather" mindset 100% of the time, consider integrating these nuances:

  **Distinguish between Intent and Impact**
  You can hold two truths at once:
  1.  **Truth A:** The cruel words were driven by an illness, not his core character or his true feelings about you. (This is the clinical view).
  2.  **Truth B:** The words caused me pain, and I am allowed to feel hurt by the impact, regardless of the intent. (This is the human view).
  You do not have to choose one. You can validate your own hurt *while* knowing he didn't mean it.

  **Shift from "Don't Take it Personally" to "Don't Keep it Personally"**
  The advice to not take it personally is about the *source* of the words. But you still have to deal with the *receipt* of them. Instead of trying not to feel hurt, focus on not *keeping* the hurt. Acknowledge the sting, let yourself feel the resentment for what it is (a signal that you were hurt), and then consciously decide how to process it so it doesn't calcify.

  **Require Repair, Not Just Apologies**
  When he is stable and mortified, that is the time for logistical planning, not just emotional apologies.
  *   "I know you didn't mean it. But it hurt me. What is our plan for next time you feel a manic episode coming on?"
  *   "When you speak to me like that, I will leave the room/hang up the phone. I need you to know I will do that to protect myself, not to punish you."
  This turns the resentment into a boundary, which feels more empowering than suppression.

  **Talk to Your Therapist About the Guilt**
  Return to your therapist and say exactly what you said here: *"The weather analogy works half the time, but the other half I feel resentful, and then I feel guilty for failing at your advice."*
  A good therapist will not insist you stick to the tool. They will help you explore why the tool fails sometimes and help you make peace with the inconsistency.

  ### Summary
  You are not failing. You are navigating a complex trauma response within a family system. Your resentment is not a character flaw; it is a guardian at the gate of your emotional safety. Listen to it, understand what it is protecting, and use it to build better boundaries, rather than beating yourself up for feeling it.

  You can love your brother, support his recovery, *and* acknowledge that his illness hurts you sometimes. All of those things can be true at once.
