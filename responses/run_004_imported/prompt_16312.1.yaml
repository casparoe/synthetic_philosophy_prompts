answer: |-
  It is a pleasure to speak with someone who recognizes the intuition behind Dowe's theory immediately. As a physicist, your instinct that causation should look like a transaction in the ledger of the universe (energy, momentum, charge) is exactly what motivated the process theories of causation developed by Wesley Salmon and refined by Phil Dowe. It treats causation as a *physical* relation, not just a logical one.

  You have identified the exact fault line where the metaphysics of causation tends to fracture. To answer your final question directly: **No, they are not papering over the same crack.** They are failing at opposite ends of the same spectrum. Dowe's theory is ontologically rigorous but explanatorily revisionist; Lewis's theory is explanatorily inclusive but ontologically profligate.

  Here is how they cope with omissions, and why neither has a fully satisfactory, principled line.

  ### 1. Dowe's Conserved Quantity (CQ) Theory: The "Bite the Bullet" Approach

  Dowe's theory defines a causal process as a world line of an object that possesses a conserved quantity, and a causal interaction as an intersection of such processes where there is an exchange of that quantity.

  **How it handles omissions:**
  Strictly speaking, **it doesn't.** On the CQ view, an omission is a non-event. It is the absence of a process. Since there is no object and no conserved quantity being transferred, there is no causal relation.
  *   **The Verdict:** Your not watering the ficus did *not* cause its death. The cause of the death was the biological process of desiccation (energy transfer, cellular collapse) internal to the plant.
  *   **The Fix:** Dowe distinguishes between **causation** (the physical relation) and **causal explanation** (the pragmatic discourse). He admits that in everyday language, law, and morality, we treat omissions as causes. But he argues this is a feature of our *explanatory interests*, not the fabric of the universe. We mention the omission because it was abnormal or morally relevant, not because it was a physical cause.

  **Does it draw a principled line?**
  **Yes.** The line is sharp and physical: Is there a transfer of a conserved quantity? If yes, causation. If no, no causation.
  **The Cost:** It renders vast swathes of human discourse "literally false." In medicine, law, and history, we constantly cite omissions (negligence, failure to intervene, lack of rain). Dowe tells us these are all merely *quasi-causal*. For a physicist, this might feel clean; for a philosopher of law or ethics, it is a non-starter.

  ### 2. Lewis's Counterfactual Theory: The "Open the Floodgates" Approach

  Lewis defines causation via counterfactual dependence: $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred.

  **How it handles omissions:**
  It handles them effortlessly.
  *   **The Verdict:** If you had watered the ficus, it would not have died. Therefore, your not watering it caused its death.
  *   **The Problem:** As you noted, this leads to the problem of **profligate causation**. The mailman didn't water it. If the mailman *had* watered it, it wouldn't have died. Therefore, the mailman's not watering it caused the death. The Queen of England didn't water it. Her omission also caused the death.

  **Does it draw a principled line?**
  **No.** This is the fatal weakness of the counterfactual account regarding omissions. Lewis was aware of this. His strategy to filter out the Queen and the mailman was not metaphysical, but **pragmatic**. He appealed to "contextual salience" or "normality."
  *   We pick your omission as *the* cause because you were the neighbor entrusted with the key.
  *   We pick the drought as *the* cause because rain is a normal expectation in that climate.

  But this moves the criterion for causation from the *world* to the *mind*. It implies that whether $C$ causes $E$ depends on what the speaker considers "normal" or "relevant." For a physicist, this is anathema. It suggests causation isn't a relation "out there" in the events, but a relation between events and our expectations.

  ### 3. Are They Papering Over the Same Crack?

  The "crack" is the mismatch between **Ontology** (what exists) and **Explanation** (what matters).

  *   **Dowe** saves Ontology at the expense of Explanation. He preserves the idea that causation is a physical mechanism, but he has to tell you that your intuition about the ficus is wrong. He draws a principled line, but it cuts off too much.
  *   **Lewis** saves Explanation at the expense of Ontology. He preserves the intuition that omissions matter, but he has to admit that causation is ubiquitous and dependent on context. He draws no principled line, relying instead on vague notions of "salience."

  So, they are not papering over the same spot.
  *   Dowe has a hole in his **coverage** (he can't account for why we successfully use omissions to predict and control the world).
  *   Lewis has a hole in his **boundaries** (he can't account for why some counterfactual dependencies count as causes and others don't).

  ### A Physicist's Alternative: Interventionism

  Since you come from experimental physics, you might find the **Interventionist Account** (championed by James Woodward) more satisfying than either Dowe or Lewis.

  Woodward defines causation in terms of **invariance under intervention**. $C$ causes $E$ if there is a possible intervention on $C$ that would change $E$, provided the relationship holds invariant across a range of background conditions.

  *   **On Omissions:** It handles them like Lewis (if intervening to water the plant changes the outcome, the omission is a cause).
  *   **On the Mailman:** It handles them better than Lewis by appealing to **stability**. The relationship between *your* watering and the plant's survival is stable across various background conditions (you have the key, you are nearby). The relationship between the *Queen's* watering and the plant is not stable or actionable in the same context.
  *   **The Physics Connection:** This looks very much like setting up a control variable in an experiment. It treats causation not as a "transfer of energy" (Dowe) or a "metaphysical dependence" (Lewis), but as a **functional relationship** that allows for manipulation.

  ### Summary

  To answer your specific question: **Neither theory has a genuinely principled way of drawing the line that satisfies both physical intuition and common sense.**

  *   **Dowe** draws a line that is too rigid for the special sciences (biology, economics, history) where omissions are real drivers.
  *   **Lewis** dissolves the line entirely, making causation dependent on conversational context.

  If you had to choose which is "less wrong":
  *   If you care about **fundamental physics**, Dowe is closer to the truth. In particle collisions, omissions don't cause anything.
  *   If you care about **macroscopic systems** (like plants, economies, or retirees reading philosophy), Lewis (or Woodward) is more useful, even if the ontology is messy.

  The consensus in contemporary metaphysics is largely that **causation is pluralistic**. There may be a "physical causation" (Dowe) relevant to fundamental physics, and a "difference-making causation" (Lewis/Woodward) relevant to the special sciences and daily life. They are different tools for different jobs, and the error lies in trying to force one tool to do both jobs.
