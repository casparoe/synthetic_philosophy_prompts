      *   *Section 1: Dowe's Conserved Quantity Theory.* Explain the "bite the bullet" approach. Omissions aren't causes. They are absences of preventers. Mention the distinction between "causation" and "causal explanation."
      *   *Section 2: Lewis's Counterfactual Theory.* Explain why omissions fit easily (counterfactual dependence). Explain the "proliferation problem" (the mailman). Discuss Lewis's attempt to use "context" or "normality" to filter, and why philosophers find this unsatisfying (it makes causation subjective).
      *   *Section 3: The "Principled Line" Analysis.*
          *   CQ has a line, but it's the *wrong* line for everyday use.
