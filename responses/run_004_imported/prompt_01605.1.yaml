answer: |-
  The rain blurred the lights of the convention center into streaks of neon as Elena and Marcus squeezed into the back of a cab. Both were clutching styrofoam cups of lukewarm conference coffee. They'd been at each other's throats during the Q&A session an hour ago; now, trapped in the same vehicle heading toward the hotel district, the truce was fragile.

  Marcus stared out the window. "You know, that writer's question about the forked narrative actually got me thinking. If Mireille stays, she's a wife. If she goes, she's a career woman. You really think those are just two different people who share a childhood?"

  Elena sighed, shifting her bag to her feet. "I think it's the only way to make the logic hold, Marcus. David Lewis was right. You can't have one object literally existing in two mutually exclusive states. That's a contradiction."

  "It's not a contradiction if you index the properties to the world," Marcus shot back, turning to face her. "This is the Kripkean intuition. When I say, 'Mireille could have gone to Marseille,' I am talking about *Mireille*. Not some qualitative duplicate who looks like her, acts like her, and remembers being her. I mean *her*. If you tell me that the person in Marseille isn't actually Mireille, you've destroyed the point of modal discourse. It's the Humphrey objection, Elena. Humphrey doesn't care that a counterpart wins the election. He cares that *he* could have won."

  "Humphrey is confused," Elena said, taking a sip of the bitter coffee. "And so are you, if you think identity can be contingent. Look at the problem of accidental intrinsics. In the 'Hometown' world, Mireille has, let's say, a specific scar on her knee from a bicycle accident. In the 'Marseille' world, she never had the bike, so no scar. If it is literally the *same woman* in both worlds, then one object possesses the property *having-a-scar* and the property *not-having-a-scar*. That violates Leibniz's Law. It's basic logic."

  Marcus waved a hand. "You're treating 'having a scar' as a monadic property when it's relational. She has-the-scar-in-World-A and lacks-the-scar-in-World-B. There's no contradiction because the properties are world-indexed. The object itself—the substratum, the individual—is constant. It's the same numerical identity persisting across modal space."

  "That's just verbal sleight of hand," Elena countered. "You're smuggling in relations to save the identity. But what grounds that identity? If it's not qualitative similarity—if it's not her memories, her body, her psychology—then what is it? Plantinga's 'individual essence'? That haecceity? That sounds like magic. It's a metaphysical tag that says 'This is Mireille' without explaining *why*."

  "It's not magic, it's primitive," Marcus corrected. "Just like you have to accept some primitives. You accept the reality of concrete possible worlds. I accept the transworld identity of persons. My primitive is simpler. It matches our intuition. When we mourn a lost possibility, we mourn *our* loss. If I'm just grieving for a counterpart, it's like grieving for a twin I never met. It drains the modality of its existential weight."

  Elena leaned forward, resting her elbows on her knees. "Okay, but let's press your primitive. Let's talk about the Multiple Counterparts problem. Lewis raised this for a reason. Suppose in the 'Marseille' world, there are *two* women who equally resemble Hometown Mireille. Maybe she has an identical twin she didn't know about, or maybe cloning technology exists there. Both have her memories, her face, her temperament. Which one is the 'real' Mireille? On your view, transworld identity has to be unique. One is her, one isn't. But on what basis do you choose? If you say 'neither,' then Mireille couldn't have gone to Marseille in that scenario. If you say 'both,' you've violated the transitivity of identity."

  Marcus paused. The cab hit a pothole, jolting them both. "That's a edge case. A freak scenario."

  "Metaphysics lives in the edge cases," Elena said sharply. "Counterpart theory handles it gracefully. Mireille has two counterparts. Statements about 'Mireille in Marseille' become indeterminate or context-dependent. We don't have to force a magical identity onto one twin and deny it to the other based on... what? Invisible soul-dust?"

  "Haecceity isn't dust," Marcus snapped. "It's the condition of possibility for being an individual at all. Without it, you don't have persons across worlds; you have a cloud of similarities. And honestly, Elena, your view makes truth conditions a nightmare. If I say 'Mireille might have been happy in Marseille,' and she has two counterparts there—one happy, one miserable—is the statement true or false?"

  "It's vague," Elena admitted. "But reality is vague. Your view forces a binary where there isn't one. You'd rather invent a metaphysical essence to force a 'True' value than accept that modality is sometimes fuzzy."

  "It's not fuzzy to the subject!" Marcus insisted. "If I'm standing at that fork in the road, I don't feel fuzzy. I am one person. If I turn left, *I* go left. If I turn right, *I* go right. I don't leave a counterpart behind. The continuity of consciousness is what matters. If you cut that, if you say the 'Me' in Marseille is a different entity, then why should I care about prudential rationality? Why save for retirement if the retiree is just a 'counterpart'?"

  "Because the counterpart relation is what matters for survival," Elena said. "Parfit showed us that. Identity isn't what matters; psychological continuity is. Your transworld identity is a fetish. You're clinging to the 'Self' as a metaphysical atom because you're afraid of the dissolution. Lewis frees you. You are a sum of temporal parts in this world, related by resemblance to sums of temporal parts in other worlds. It's elegant. It's set theory."

  "It's cold," Marcus said, settling back into the seat. "It treats persons like sets. And it doesn't answer the core issue. You say 'individual essence' is cheating. Fine. Call it a label. But you haven't explained what makes a counterpart the *right* counterpart. Is it 90% similarity? 95%? If Mireille goes to Marseille and becomes a completely different person—changes her name, her personality, loses her memories—at what point does she stop being the counterpart? If similarity is the metric, then at some high degree of divergence, the 'Marseille Mireille' is no longer Mireille. But on my view, she *is* Mireille, no matter how much she changes, because she originates from the same fertilized egg, the same historical chain. Origin is essential."

  Elena smiled thinly. "Ah, the Kripkean origin essentialism. So, if we discover that in the Marseille world, Mireille was actually adopted, and her biological parents were different, she ceases to exist in that world? That seems to limit the scope of possibility arbitrarily. We can imagine being born of different parents. It's coherent."

  "It's not coherent if you analyze the rigidity of designators," Marcus argued. "When you imagine that, you're imagining a *situation* where someone like you is born of different parents. You aren't imagining *yourself* in that situation. You're smuggling in the qualitative description again."

  The cab slowed in traffic. The silence stretched between them, filled only by the rhythmic thump of the wipers.

  "So," Elena said softly, "back to the novelist. If she writes this book... if she treats them as two different women who share a past, she's a Lewisian. If she treats them as one woman living two lives, she's a Kripkean."

  Marcus looked out at the rain. "Does it change the story?"

  "I think it changes the tragedy," Elena said. "If they're counterparts, the tragedy is that paths diverge and connections are lost. It's about loss. If it's transworld identity, the tragedy is fragmentation. It's about a self that can't be whole because it's spread across mutually exclusive realities. One is a story about choice. The other is a story about... quantum superposition of the soul."

  Marcus chuckled dryly. "I still think 'individual essence' sounds like cheating."

  "And I still think 'transworld identity' sounds like a category error," Elena replied.

  "But," Marcus added, watching a pedestrian splash through a puddle, "if Mireille stays home and wonders about Marseille... she feels it's her. Not a counterpart. Her."

  Elena watched him for a moment, then looked at her own reflection in the window, superimposed over the passing city. "Maybe. Or maybe she's just the closest counterpart to the woman who wonders."

  The cab pulled up to the hotel curb. They paid in silence, stepped out into the rain, and walked toward separate elevators, neither having convinced the other, both carrying the same unresolved weight of worlds that never were.
