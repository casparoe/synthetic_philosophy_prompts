      *   *Key Distinction:* The *Guide* explains the *reason* for the commandment (etiology). The *Mishneh Torah* explains the *rule* (normativity). A law can have a historical origin but remain binding.
      *   *Crucial Point:* Maimonides never says sacrifices are *abolished* in the future, only that they were not the *primary* desire initially. If human nature remains hylomorphic, the "concession" remains necessary.

