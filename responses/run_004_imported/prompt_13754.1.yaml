      *   **Body 3: The Guide vs. Mishneh Torah Tension.** Address the Messianic problem. If it's a temporary weaning, why keep it in the perfect future? Argument: Human nature doesn't change fundamentally (embodiment). Law codifies reality, Philosophy codifies ideals.
      *   **Body 4: Synthesis/Verdict.** Why Maimonides is preferable. It preserves God's immutability (He doesn't change His mind about wanting blood) and explains religious diversity/evolution. Nahmanides risks making God dependent on ritual mechanics.
