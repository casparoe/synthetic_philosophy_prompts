          *   *Nuance:* PE usually focuses on the *subject's* stakes. Here, the *speaker's* stakes are varying. Standard PE (Stanley, Fantl & McGrath) says subject's stakes matter. So, strictly speaking, PE predicts Elena *does* know (assuming her own stakes are low). Speaker B is mistaken.
          *   *User's Intuition:* The user feels the pull toward "she doesn't know" tracks the *co-signer's* exposure. This is the crux. If the intuition is that B is *right*, PE is in trouble. If the intuition is that B is just being cautious/expressing worry, PE might survive.

  4.  **Can PE Accommodate This? (Task 3):**
      *   *Option 1: Deny the intuition.* PE proponents might say B is strictly speaking false, but pragmatically implicating that Elena's evidence isn't good enough for *B's* purposes. (Gricean pragmatics).
      *   *Option 2: Subject-Sensitive Invariantism (SSI) nuance.* Does the "subject" include the team? If Elena and B are acting as a unit (co-signers), maybe B's stakes *become* Elena's stakes relevant to the action. If they are a "knowledge community," PE can absorb B's stakes into Elena's account.
