      *   **The Conflict:**
          *   Friend says: This supports Contextualism (standards shift with speaker).
          *   User says: This troubles Pragmatic Encroachment (PE), because PE ties stakes to the *subject* (Elena), not the speaker. Yet the intuition "she doesn't know" seems strong for the co-signer.
      *   **Tasks:**
          1.  Precisely define Pragmatic Encroachment (PE) and Epistemic Contextualism (EC): location of shift, what's fixed, semantics vs. metaphysics.
          2.  Apply the case to both views: Do they predict/explain the intuition?
