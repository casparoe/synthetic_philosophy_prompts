          4.  Evaluate the dispute: Substantive or merely verbal?

  2.  **Deconstruct the Views (Task 1):**
      *   **Epistemic Contextualism (EC):**
          *   *Core Claim:* The truth-conditions of knowledge ascriptions ("S knows that p") vary with the *context of the attributor* (the speaker).
          *   *Semantics:* "Knows" is indexical (like "tall" or "here"). Content changes.
          *   *Metaphysics:* Knowledge itself (the relation between subject and proposition) might be invariant, but the word "knows" picks out different relations in different contexts. (Though some contextualists are invariantists about the property, most treat the variation as semantic).
          *   *What shifts:* The epistemic standard (how strong evidence must be).
          *   *What's fixed:* The subject's evidence and practical situation (usually).
      *   **Pragmatic Encroachment (PE) / Interest-Relative Invariantism (IRI):**
          *   *Core Claim:* Whether a subject *knows* depends partly on their practical stakes.
          *   *Semantics:* "Knows" is invariant (semantically stable).
          *   *Metaphysics:* The *property* of knowledge itself is sensitive to practical factors. It's not just about what we say; it's about whether the subject actually stands in the knowledge relation.
          *   *What shifts:* The subject's practical situation (stakes).
          *   *What's fixed:* The semantic content of "knows."
          *   *Key Distinction:* PE locates stakes in the *subject*. EC locates standards in the *speaker*.

  3.  **Analyze the Case (Task 2):**
      *   **The Setup:** Elena (Subject) has fixed evidence and fixed stakes. Speaker A (Low Stake) vs. Speaker B (High Stake).
      *   **Contextualism (EC):**
          *   Prediction: Speaker A is in a low-standards context. "Elena knows" is true. Speaker B is in a high-standards context. "Elena knows" is false.
          *   Fit: Perfect. This is the classic DeRose/Bank Case structure, but applied to third-party ascribers. EC explains why both can speak truly despite Elena remaining unchanged.
      *   **Pragmatic Encroachment (PE):**
          *   Prediction: Since Elena's stakes are fixed, her epistemic status is fixed. Either she knows or she doesn't.
