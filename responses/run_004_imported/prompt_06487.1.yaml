          *   *Middle Knowledge:* Contingent truths about what free creatures *would* do in any circumstance (CCFs). Logically prior to God's decree.
          *   *Free Knowledge:* What God decides to actualize.
          *   *Defense against Grounding:* Truths don't always need an ontological ground; they supervene on the nature of the creature. Or, the creature has "counterfactual power."
          *   *Defense against Fatalism:* Explanatory priority $\neq$ Causal priority. God knows it *because* you would do it, not vice versa.
      *   **Open Theism:**
          *   *Critique:* CCFs are brute contingent truths. Nothing makes them true (the creature doesn't exist yet).
          *   *Critique:* If they are true *before* creation, the creature's choice is fixed, violating libertarian freedom (the ability to do otherwise).
          *   *Alternative:* God knows all possibilities but not the actual future free choices. Providence is risk-taking/adventurous.

  3.  **Drafting - Scene Setting:**
      *   Need a visual metaphor. The "Menu of Feasible Worlds."
      *   Characters: Let's name them *Luis* (Molinist, nod to Molina) and *Greg* (Open Theist, nod to Gregory Boyd or similar).
