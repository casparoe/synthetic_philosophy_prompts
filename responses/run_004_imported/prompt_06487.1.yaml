      *   *Greg's freedom point:* "It's fixed. Peter can't change it."
      *   *Luis's counter:* "Counterfactual power. Peter *makes* it true." (Newcomb analogy).
      *   *Greg's Providence point:* "So God is stuck with the feasible set. And I say God chooses to not know."
