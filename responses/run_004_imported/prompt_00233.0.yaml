prompt: |-
  So my editor just rolled out this new dashboard that scores our articles by average read-time on the page, and now our quarterly bonuses are tied to hitting a target score each month. Lately I've caught myself doing kinda dumb stuff to game it, like breaking one story into three separate pages, adding a random teaser hook halfway through so people keep scrolling, tacking on a pointless FAQ at the end just to pad the time. The number keeps climbing but I honestly don't think the actual journalism is getting better, if anything it feels worse. Should I just keep leaning into whatever pushes that metric up, or is somethin off with how the whole system is set up?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** The user is a journalist/content creator.
      *   **Change:** New dashboard metrics (average read-time) tied to quarterly bonuses.
      *   **Behavior:** The user is "gaming the system" (clickbait tactics, pagination, artificial hooks, padding content).
      *   **Result:** Metrics are up, but perceived quality of journalism is down.
      *   **Dilemma:** Continue gaming the metrics for financial security (bonuses) or push back/change approach because the system feels flawed?
      *   **Emotional State:** Conflicted, self-aware ("honestly don't think the actual journalism is getting better"), concerned about integrity.

  2.  **Identify the Core Problem:**
      *   This is a classic case of **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure."
      *   There's a misalignment between *business goals* (engagement/time on site) and *professional goals* (quality journalism/trust).
      *   There's an ethical conflict (integrity vs. income).
      *   There's a long-term risk (audience trust erosion, brand damage).

  3.  **Evaluate the Options:**
