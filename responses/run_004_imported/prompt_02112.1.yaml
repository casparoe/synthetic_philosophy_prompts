answer: |-
  The candles had burned down to their sockets, guttering in the draft that always found the Westminster house, no matter how tightly the sashes were sealed. Jeremy Bentham sat in the high-backed chair he called his throne, though tonight it felt more like a witness box.

  On the desk before him lay the quires of paper. They were yellowed, the ink faded to the colour of dried blood. *Offences Against One's Self.* Written in 1785. Forty years ago. He was a different man then; sharper, perhaps, but certainly less tired.

  He ran a finger down the margin of page twelve. The logic was pristine. It had to be. It was arithmetic.

  *The act:* Consensual. Private.
  *The pain:* None, unless inflicted by external sanction.
  *The pleasure:* Real, tangible, sought by the agents.
  *The Law:* Hanging. Strangulation. Death.

  "To punish where there is no victim," Bentham murmured to the empty room. "Is to create a victim where there was none."

  He had dissected the public disgust, the visceral recoil that men felt when hearing of such congress. He had named it for what it was: the Principle of Sympathy and Antipathy. A fancy label for prejudice. A whim masquerading as reason. If a man's stomach turned at the sight of another's dinner, one did not hang the diner. Why, then, hang the lover?

  The door creaked. Doane, his amanuensis, stepped in with a fresh tray of coals. The young man moved quietly, but in the silence of the Hermitage, every footfall was a judgment.

  "Sir? You're still at it?"

  "The calculus does not balance itself, Doane."

  Doane poked the fire. Sparks flew up the chimney. "The *Constitutional Code* is due for the printers next week, Mr. Bentham. The disciples are asking."

  "The disciples want a machine that works," Bentham said, tapping the yellowed manuscript. "They do not want to know about the gears that grind their own fingers."

  Doane paused, the poker in hand. "Is that a new tract? The handwriting looks... old."

  "An old friend. One I cannot introduce to polite society." Bentham leaned forward, the joints of his knees clicking. "Tell me, Doane. If you saw two men walking arm in arm in the park. Intimate. Would you strike them?"

  Doane shifted, uncomfortable. "Strike them, sir? No. But I... I should think it improper."

  "Improper. Why?"

  "It is not natural."

  "Ah." Bentham sat back. "There it is. *Natural.* A word used to club anything we dislike. If it happens, it is natural. If it brings pleasure, it is good. If it brings pain, it is bad. Where is the pain in the park, Doane?"

  "The public would be offended, sir."

  "The public's offence is a phantom pain. It exists only because the law tells them to feel it. But the rope around the neck? That is real pain. The widow's tears? Real pain. I have weighed them. I have put them on the scales." Bentham's voice grew thin, brittle. "The hanging outweighs the act a thousand to one. By my own math, the law is a murderer."

  "Then publish it," Doane said simply. "If the math is right."

  Bentham looked at the young man. Doane was loyal, bright, a creature of the new age Bentham was trying to birth. But Doane was also a creature of England.

  "If I publish this," Bentham said softly, "they will not read the math. They will read the word *paederasty*. They will not see the utilitarian; they will see the monster. And if I am a monster, then the Code is madness. If the Architect is mad, the Panopticon is a prison for the soul, not a school for reform."

  He stood up, walking to the window. The glass reflected his own face: the white hair, the deep-set eyes, the mask of the sage. Outside, London slept. Somewhere in that dark, men were loving men, and the law was waiting to kill them. And he held the key to their cage in his hand, but the lock was rusted shut by his own reputation.

  "It is not cowardice," Bentham said, more to the glass than to Doane. "It is utility. The greatest good. If my silence protects the movement, if my silence ensures the poor get better courts and the prisoners get cleaner cells... then my silence produces more pleasure than my truth."

  "And the men who hang?" Doane asked.

  "A tragedy. But a contained one. Whereas my ruin would be... expansive."

  He turned from the window. The house felt vast, a cavern of shadows. This was the Hermitage. A fitting name. He had built a system to measure human happiness, yet he had lived inside a vacuum.

  He thought of Caroline. It had been years since he had sent that letter. A proposal. Clumsy, desperate, written in the same precise hand that drafted laws for nations. She had not answered. Or perhaps she had, and the answer was silence. He had spent forty years cataloging human motivation, yet he could not calculate why a woman would not love him, or why he could not love as the world demanded.

  He had denied himself, just as the law denied the men in the park. He had sublimated the flesh into ink. He had become the Great Legislator because he could not be a husband.

  "Put the coals down, Doane."

  "Sir?"

  "I am finished for the night."

  Doane nodded, bowing slightly. He moved to the door, then hesitated. "Mr. Bentham? Does it trouble you? The silence?"

  Bentham looked at the manuscript. It sat there, innocent and damning. It was the only honest thing he had ever written. To publish it would be honest. To bury it was useful.

  Utilitarianism was a cold god. It did not care for the conscience of the priest, only the salvation of the flock.

  "The silence," Bentham said, picking up the papers. They rustled like dry leaves. "The silence is a sanction. Like any other. It inflicts pain. But it prevents greater pain."

  He walked to the large mahogany desk, the one with the many drawers. He unlocked the bottom one. Inside lay bundles of letters, drafts of the Panopticon schemes, and the quiet history of his own heart.

  He placed the manuscript on top of the pile. It looked small amidst the堆积 of his life's work.

  "Sir," Doane said from the doorway. "You sound as if you are sentencing a man to death."

  Bentham paused, his hand on the key. He looked at the young man, this representative of the future he was building. A future of rational laws, of hospitals, of schools. A future built on a foundation he was too afraid to inspect.

  "Perhaps I am," Bentham said. "Mine."

  He turned the key. The click was loud in the quiet room.

  "Goodnight, Doane."

  "Goodnight, Mr. Bentham."

  The door closed. Bentham stood alone in the Hermitage. He could hear the wind rattling the sashes, the sound of the city breathing outside. He walked back to his chair and sat. He blew out the candles, one by one, until the room was dark.

  In the blackness, the calculus remained. It was perfect. It was airtight. And it was utterly useless. He closed his eyes and tried to calculate the weight of the secret in the drawer, but for the first time in fifty years, Jeremy Bentham could not find the number. He simply sat in the dark, waiting for the morning, and the pain that came with it.
