      *   **The User's Intuition:** This feels wrong/unsettling, even if the logic seems sound on the surface. They suspect a flaw but can't articulate it.
      *   **The Goal:** Identify the flaw in the partner's reasoning using rationalist frameworks (since the user speaks that language) and provide actionable advice.

  2.  **Deconstruct the Partner's Argument:**
