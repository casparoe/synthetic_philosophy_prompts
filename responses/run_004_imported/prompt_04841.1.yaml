prompt: |-
  I've been digging into AI alignment stuff for a piece, and I keep running into inverse reinforcement learning -- basically, having a system watch what someone does and reverse-engineer what they must want. I already get the naive objection: literally any behavior is "optimal" for some reward function (just reward whatever they did), so that version is hopeless on its own. And I get that the standard fix is to assume the person is mostly rational but a bit noisy, then lean on something like Occams razor to prefer the simpler explanation. But apparently there's a real result showing that fix doesn't actually rescue things -- the ambiguity between "what they want" and "how irrationally they're pursuing it" just resurfaces no matter what, and no simplicity prior can stamp it out. Can you walk me through the intuition for why that ambiguity is so stubborn? Don't need the formal proof, just enough that it clicks.
