      *   *Step 4: The Trade-off.* If I make $R$ more complex, I can make $\pi$ simpler, and vice versa.
      *   *Step 5: Why Occam's Razor fails.* Occam's Razor minimizes total complexity. But the *sum* of complexities can remain constant while the *distribution* shifts.
      *   *Step 6: The "Degeneracy" example.* Construct a specific scenario where a "simple goal + noisy agent" is mathematically indistinguishable from a "complex goal + perfect agent."
      *   *Step 7: The Implication.* You need *more* than just behavior. You need normative assumptions (what counts as a "mistake").

  5.  **Drafting the Narrative (Iterative refinement):**

