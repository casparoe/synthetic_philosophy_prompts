prompt: |-
  So this came up at our local ACX meetup last week and I haven't been able to stop chewing on it. My friend Priya is way more hardcore EA than me — she's read all the Singer, gone deep on wild animal suffering and probability-of-sentience stuff, done the full cause-prioritization deep dive. I mentioned I still eat chicken sometimes and she got kind of exasperated and said, basically, "honestly don't bother rederiving this from scratch, I've already done the work on the marginal impact and the sentience arguments, it's wrong, just take my word for it and switch." And here's the thing, I actually do trust her reasoning on this more than my own, she's clearly thought about it way more carefully then I have. But it feels weird to just adopt "eating chicken is wrong" as my own belief because she said so, in a way that feels different from how I'm totally fine believing "my ferritin is low" because my doctor told me that, without understanding the blood test at all.

  I keep thinking about all the "just defer to whoever's clearly thought about it more than you" posts that get thrown around in rationalist-adjacent spaces (modest epistemology, Aumann agreement, all that), and by that logic I should just fully update to Priya's view and stop worrying about it. But the fact that it's a moral claim rather than a factual one keeps nagging at me as mattering somehow, even though I can't articulate why it should. Is there something genuinely different about taking someone's word for a moral verdict versus a factual one, or am I just being precious about wanting my values to feel like they're actually "mine"? Would appreciate a steer on what's actually going on here.
