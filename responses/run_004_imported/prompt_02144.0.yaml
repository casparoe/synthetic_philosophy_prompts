prompt: |-
  ok so I've been down a Sidgwick rabbit hole for my diss (19th c ethics/utilitarianism) and theres a connection I don't think gets talked about enough: the "dualism of practical reason" at the end of the Methods of Ethics -- where he admits egoism and utilitarianism can't be rationally reconciled, and that without some further guarantee the "cosmos of duty" collapses into "chaos" -- versus the fact that he co-founded the Society for Psychical Research in 1882 (its first president!) and spent basically the rest of his life testing mediums and telepathy claims, hoping to find empirical evidence of an afterlife or moral government of the universe that could rescue the dualism.

  Write me an essay that actually commits to a reading of this: was the psychical research a rationally serious response to a genuine gap in his ethics (if the dualism can only be closed empirically, then go look for the evidence), or does it show that his famous rigor was quietly in service of wishful thinking, which undercuts the credibility of the whole ethical project? Weigh both sides, but don't cop out with "a bit of both" -- pick one, defend it, and say what your verdict implies for whether utilitarianism today can survive without that kind of metaphysical backstop.
