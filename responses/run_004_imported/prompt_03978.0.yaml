  6.  **Final Polish:** Check the citations. *Sentences* II, d. 44 is correct. *Summa* II-II, q. 42 is correct. *De Regno* I.6 is correct. Ensure the distinction between *tyrannus ex defectu tituli* (usurper) and *tyrannus ex parte exercitii* (bad ruler) is clear.

