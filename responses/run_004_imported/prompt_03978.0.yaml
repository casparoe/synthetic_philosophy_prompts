answer: |-
  This is a sharp, pedagogically useful provocation. You are right to test it before taking it into the seminar room, because while the core of your argument is sound, there are two or three nuance-traps where a well-read student (or a colleague dropping in) could trip you up if you overstate the case.

  Here is an honest assessment of your three points: the harmonization, the distinction, and the "old news" factor.

  ### 1. The "Development" Question (Young vs. Old Thomas)
  **Your Claim:** There is no real arc; it is one restrictive view throughout.
  **Verdict:** *Mostly correct, but don't deny the shift in tone.*

  You are right to resist the simplistic "Young Radical vs. Old Conservative" narrative. The fundamental principle remains constant across all three texts: **private individuals lack the standing (*auctoritas*) to execute judgment on a ruler.**

  However, saying there is *no* development is slightly risky. In the *Sentences* commentary (early 1250s), Thomas is working within a scholastic format responding to specific objections. His language there ("praised and rewarded") is indeed more robust than the *Summa* (1270s), where he frames it negatively (overthrowing a tyrant is *not sedition*, provided it doesn't cause greater harm).

  *   **The Trap:** If you claim there is *zero* difference, a student might point out that the *Sentences* passage feels like an endorsement, whereas the *Summa* feels like a reluctant tolerance.
  *   **The Fix:** Frame it not as a change in *doctrine*, but as a change in *pastoral and political prudence*. In the *Sentences*, he is defining the moral status of the act in the abstract (is it murder? no). In the *Summa* and *De Regno*, he is advising on the practical governance of the common good. The "restrictive view" is constant, but the *willingness to articulate the exception* becomes more guarded. You can safely argue that the "permissive" reading of the *Sentences* is a misreading of a narrow exception, without having to claim Thomas's mind never changed on the *risks* involved.

  ### 2. The Usurper vs. Tyrant-by-Misrule Distinction
  **Your Claim:** This distinction is Thomas's, not just a backreading from Bartolus.
  **Verdict:** *Correct, but mind the terminology.*

  You are on solid ground here. The distinction between a ruler who has no right to rule (*tyrannus ex defectu tituli*) and one who rules badly despite having a right (*tyrannus ex parte exercitii*) is present in Aquinas. It is not an invention of the Commentators (Bartolus, Baldus), though they certainly juridified it later.

  *   **The Trap:** Aquinas does not always use the consistent Latin terminology that the 14th-century civilians do. He describes the *concept* (seizing power by violence/ruse vs. ruling badly), but if you quote him expecting the precise phrase *tyrannus ex defectu tituli*, you might come up short.
  *   **The Fix:** Stick to his descriptive language ("seized by violence," "no superior to judge") rather than implying he has the full Bartolist taxonomy. Also, acknowledge that John of Salisbury (*Policraticus*, 1159) is the real source of the "tyrannicide is okay" vibe that students are conflating with Aquinas. Aquinas is actually *reacting against* the Carolingian/John of Salisbury tradition of private tyrannicide. Making that contrast (John of Salisbury vs. Aquinas) is often more illuminating than "Young vs. Old Aquinas."

  ### 3. Is This "Old News"?
  **Your Claim:** Is this worth class time, or do specialists already know this?
  **Verdict:** *Specialists know it; students don't. It is excellent class time.*

  Among historians of medieval political thought (e.g., Pennington, Skinner, Nederman, Canning), the nuance you are presenting is standard fare. The "Aquinas endorsed tyrannicide" soundbite is recognized as a caricature in the literature.

  *   **However:** Your students almost certainly do not know this. The textbook summary of medieval resistance theory often flattens Aquinas into a bridge between John of Salisbury and the Monarchomachs.
  *   **Pedagogical Value:** This is a perfect "myth-busting" moment. It teaches students to:
      1.  Stop quoting single sentences out of context.
      2.  Distinguish between *usurpation* and *maladministration*.
      3.  Understand the medieval obsession with *ordo* and *auctoritas* (private vs. public action).

  ### Recommendations for the Seminar Hook

  To make this bulletproof, I would tweak the framing slightly:

  1.  **Acknowledge the *De Regno* Authorship Issue:** A sharp student might know that Book II of *De Regimine Principum* (and parts of I) were likely finished by Ptolemy of Lucca. While Book I, ch. 6 is generally accepted as Aquinas, it's safer to lean heavily on the *Summa Theologiae* (II-II, q. 42, a. 2) as your "mature Thomas" evidence, using *De Regno* as supporting color.
  2.  **Highlight the "Public Authority" Mechanism:** In the *Sentences* passage, the reason the usurper-killer is "praised" is not because they acted as a private individual, but because in the absence of a superior, they act as an instrument of the community's defense. In the *Summa*, Thomas clarifies that if there *is* a public mechanism, that must be used. The constant isn't just "caution," it's "public authority is required."
  3.  **The "Worse Tyrant" Problem:** You mention the Syracuse story. Emphasize that for Aquinas, the *consequentialist* calculation (will this cause more disorder?) is actually more binding than the *deontological* permission. Even if the killing is technically licit (usurper), it might be sinful if it destabilizes the common good.

  ### Conclusion
  **Does the argument hold up?** Yes.
  **Is it interesting enough?** Yes, because it forces students to grapple with the definition of authority rather than just violence.
  **Is it old news?** To you and me, yes. To the undergraduates (and many MA students), no.

  Go for it, but frame it as **"Correcting the Caricature"** rather than **"Discovering a Secret."** If you present it as "Everyone thinks X, but actually Y," you invite them to feel smart for learning the nuance. If you present it as "I have a new theory that there is no development," you invite them to try to debunk you. The former is a better seminar dynamic.
