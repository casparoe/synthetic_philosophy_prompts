          *   *Advice:* Acknowledge the shift in *emphasis* or *prudence* without conceding a fundamental doctrinal reversal. The core principle (authority comes from God/Community, private individuals lack standing) remains constant.

      *   **Concern 2: Usurper vs. Tyrant Distinction.**
          *   *Verdict:* Aquinas definitely makes this distinction. It is not purely a backreading from Bartolus. John of Salisbury (*Policraticus*) also wrestled with this. However, the *legal* refinement is later.
          *   *Advice:* Be careful not to imply Aquinas has the full-blown Roman law taxonomy of the 14th century. He has the conceptual distinction, not necessarily the technical juridical framework of the Commentators.

      *   **Concern 3: Is it "Old News"?**
          *   *Verdict:* For specialists: Yes, mostly. For students: No.
          *   *Advice:* Frame it as "correcting a popular misconception" rather than "revealing a hidden secret." It's a great pedagogical hook.

