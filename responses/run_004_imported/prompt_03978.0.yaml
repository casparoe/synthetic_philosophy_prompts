      *   *De Regimine Principum (On Kingship):* Authorship is sometimes debated (Ptolemy of Lucca likely finished it), but Book I is generally accepted as Aquinas. Chapter 6 is indeed cautious. It emphasizes public authority, not private initiative. The Syracuse anecdote is key.
      *   *Summa Theologiae (II-II, q. 42, a. 2):* Deals with sedition. Overthrowing a tyrant is not sedition *unless* it causes greater disturbance. Again, emphasizes the common good and order.
      *   *Development of Thought:* Many scholars *do* argue for a development (early more permissive, later more cautious). The user is challenging this. Is the challenge valid? Yes, because even in the *Sentences*, the permission is highly qualified. However, the *tone* does shift from "praised and rewarded" to "dangerous/avoid."
      *   *Usurper vs. Tyrant by Exercise:* This is a crucial distinction. Aquinas does make it. It is *not* solely a Bartolist invention, though Bartolus and the Commentators refined it significantly. Aquinas distinguishes between *titulus* (title) and *exercitium* (exercise).
      *   *Is it "Old News"?* Among specialists in medieval political thought (Pennington, Skinner, Nederman, Canning, etc.), the nuance is well-known. However, among *undergraduates* and even some general graduate students, the "Aquinas = Tyrannicide" myth persists. So, it *is* worth class time for pedagogy, even if it's not groundbreaking research.

