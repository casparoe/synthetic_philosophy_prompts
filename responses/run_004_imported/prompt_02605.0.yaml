          *   Conclusion: Locality + Predetermination (derived from Locality + Perfect Correlation) is incompatible with QM. Since QM is right, Locality must go (if you accept the EPR inference).
      *   *Bell's Later Work (1976 "The Theory of Local Beables"):*
          *   Concept: Local Causality.
          *   Formulation: $P(A|a, b, B, \lambda) = P(A|a, \lambda)$. Probability of outcome A depends on local setting $a$ and complete state $\lambda$, but *not* on distant setting $b$ or distant outcome $B$.
          *   Crucial Point: This applies to stochastic (probabilistic) theories too. No determinism assumed.
          *   Result: Bell Inequality (CHSH form usually) still follows from Local Causality alone.
