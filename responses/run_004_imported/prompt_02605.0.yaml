answer: |-
  # The Myth of Local Realism: Why Bell's Theorem Proves Nonlocality

  **To:** The Disputants
  **From:** Philosophy of Physics Adjudication
  **Re:** The Bell Inequality Debate (Dan vs. User)

  The debate between you and Dan is one of the most persistent in the foundations of quantum mechanics. It is also one of the most misunderstood. Dan represents the standard pedagogical line found in most physics textbooks: Bell's theorem rules out "local realism," and since we have a choice between the two, we can preserve locality by abandoning realism (adopting a Copenhagen-style view where properties are indefinite prior to measurement). You represent the position held by most specialists in quantum foundations (including John Bell himself in his later years, and philosophers like Tim Maudlin): Bell's theorem rules out *local causality*, full stop. "Realism" is a redundant or misleading label, and there is no coherent escape hatch that preserves locality.

  You asked for a reconstruction of the derivations and a committed verdict. Here it is.

  **The Verdict:** You are correct. Dan is wrong. "Local realism" is a sloppy label that obscures the physical content of the theorem. Bell's theorem demonstrates that nature is nonlocal. You cannot save locality by dropping "realism" unless you retreat into an instrumentalism so severe that the concept of "locality" loses its physical meaning.

  Below is the reconstruction of the physics and the philosophy that justifies this ruling.

  ---

  ### Part I: The 1964 Derivation (Dan's Territory)

  Dan's position relies heavily on the structure of Bell's original 1964 paper, *"On the Einstein Podolsky Rosen Paradox."* To understand why his intuition is plausible but ultimately incorrect, we must look at how Bell constructed the argument there.

  Bell began with the EPR-Bohm setup: a pair of spin-1/2 particles in a singlet state, moving apart to two detectors, Alice (A) and Bob (B).
  1.  **Perfect Correlation:** If Alice and Bob measure spin along the same axis, their results are perfectly anti-correlated (if A is +1, B is -1).
  2.  **Locality Assumption:** A measurement at A cannot instantaneously disturb the physical state at B.
  3.  **The EPR Inference:** Because of (1) and (2), the outcome at B must have been predetermined before the measurement at A occurred. If A's measurement doesn't reach B to tell it what to be, B must have "already known" what to be to ensure the correlation.

  In 1964, Bell formalized this "predetermination" by introducing a hidden variable $\lambda$. He assumed the measurement outcomes $A$ and $B$ were deterministic functions of the local settings ($a, b$) and $\lambda$:
  $$A = A(a, \lambda)$$
  $$B = B(b, \lambda)$$

  From this, he derived the inequality. Since quantum mechanics violates the inequality, one of the assumptions must go.

  **Dan's Interpretation:** Dan argues that the assumption $A = A(a, \lambda)$ smuggles in "realism" (or determinism). He claims we can reject this equation. We can say particles *don't* have definite values for $\lambda$ prior to measurement. If we drop the hidden variable $\lambda$, the derivation fails, and we keep locality.

  **The Flaw:** Dan is technically right that the *1964* derivation assumes deterministic hidden variables. However, he misses the crucial step: Bell did not *assume* determinism arbitrarily. He **derived** it from Locality + Perfect Correlation.
  *   If you want to keep Locality, you *must* accept Determinism (given the perfect correlations).
  *   If you reject Determinism (Dan's "drop realism" move), you are implicitly admitting that the outcome at B is *not* fixed by the past state of B.
  *   But if the outcome at B is not fixed by the past state of B, yet perfectly correlates with A, then A's measurement must be influencing B.
  *   That is Nonlocality.

  In the 1964 framework, "dropping realism" to save locality is incoherent. If you drop the hidden variables, you lose the explanation for the perfect correlations *without* signaling. You are left with a "spooky action at a distance" where A's choice determines B's outcome, which is exactly what Locality forbids.

  ### Part II: The 1976 Reformulation (Your Territory)

  You mentioned Bell's later work, specifically the 1976 paper *"The Theory of Local Beables"* and his 1990 Lausanne lecture. This is where the "local realism" confusion should have died, though textbooks often ignore it.

  Bell realized that critics kept objecting to "determinism." So, he generalized the theorem to stochastic (probabilistic) theories. He introduced the condition of **Local Causality**.

  Consider a complete specification of the physical state in the past light cone of the measurements, denoted by $\lambda$. Local Causality demands that the probability of an outcome at A depends only on events in A's past light cone. It should not depend on the setting $b$ or the outcome $B$ at the distant location B, once $\lambda$ is specified.

  Mathematically, Local Causality requires the factorizability condition:
  $$P(A, B | a, b, \lambda) = P(A | a, \lambda) \cdot P(B | b, \lambda)$$

  Notice what is missing: **There is no assumption of determinism.** $P(A|a,\lambda)$ can be 0.5. It can be purely random. Bell derived the inequality (specifically the CHSH form) using only this probabilistic condition.

  **The Implication:**
  1.  Quantum Mechanics violates the inequality derived from Local Causality.
  2.  Therefore, Nature violates Local Causality.
  3.  This holds true whether the theory is deterministic or stochastic.

  In this formulation, "realism" (in the sense of predetermined values) is not an independent assumption. The only substantive physical assumption is **Local Causality**: that physical influences propagate continuously through space at finite speeds.

  When Dan says "drop realism," he is suggesting we deny that $\lambda$ exists or is relevant. But $\lambda$ represents *whatever physical theory you propose* that completes the description of the state.
  *   If you propose standard QM (Copenhagen), the "state" is the wavefunction $\psi$.
  *   Does standard QM satisfy Local Causality? **No.**
  *   In standard QM, upon measurement at A, the wavefunction collapses instantaneously everywhere, updating the probabilities at B.
  *   $P(B | b, \psi_{\text{before}}) \neq P(B | b, \psi_{\text{after A}})$.
  *   The probability at B changes depending on what happened at A, outside B's light cone.

  Therefore, standard Copenhagen QM is **nonlocal**. It saves "realism" (by denying definite properties) only at the cost of admitting nonlocal collapse.

  ### Part III: Why "Local Realism" is a Misleading Label

  The term "Local Realism" suggests two independent pillars holding up a roof. It implies you can remove the "Realism" pillar and the "Locality" pillar will stand on its own. This is the core of Dan's error.

  In the context of Bell's Theorem, "Realism" is usually a code word for **Counterfactual Definiteness** (the idea that unmeasured properties have values) or the existence of a **Complete State** ($\lambda$).

  1.  **If you keep $\lambda$ (Realism):** Bell's 1976 theorem shows you must violate Locality.
  2.  **If you drop $\lambda$ (Anti-Realism/Instrumentalism):** You are saying there is no physical fact of the matter about the state between emission and detection. But you still have to account for the correlations. If Alice's choice of setting $a$ changes the statistical predictions for Bob's outcome $B$ (which it does, in the sense that the joint distribution $P(A,B)$ depends on both $a$ and $b$ in a way that cannot be factored), there is a dependency.
      *   If that dependency is mediated by a physical field, it is nonlocal (violates relativity).
      *   If that dependency is *not* mediated by a physical field (because you deny the field exists), you have abandoned the framework required to define "locality" in the first place.

  Tim Maudlin's argument, which aligns with your recollection, is the decisive blow: To violate a Bell inequality, the joint probabilities must fail to factorize. This means $P(A | a, b, \lambda) \neq P(A | a, \lambda)$. The probability of outcome A *must* depend on the distant setting $b$.
  **That dependency is the definition of Nonlocality.**

  It does not matter if $A$ is a "real property" or a "measurement outcome." If the probability of an event here depends on a setting there, faster than light, the theory is nonlocal. Calling the event "unreal" does not make the dependency vanish; it just makes the ontology murky.

  ### Part IV: The Decision

  Dan is relying on a heuristic often taught in undergraduate physics: *"Bell rules out local hidden variables. If you don't have hidden variables, you're fine."* This is a pedagogical simplification that fails under philosophical scrutiny. It treats the wavefunction as if it doesn't count as a "physical state" subject to locality constraints. But if the wavefunction governs probabilities, and those probabilities update nonlocally, the theory is nonlocal.

  You are relying on the rigorous formulation: Bell's theorem tests **Local Causality**.
  *   **Locality:** No influence travels faster than light.
  *   **Causality:** Events are determined by their past light cone.

  Bell proved that no theory satisfying Local Causality can reproduce quantum correlations.
  *   Bohmian Mechanics: Keeps Causality (determinism), drops Locality. (Explicitly nonlocal).
  *   Copenhagen: Keeps "no hidden variables," drops Locality (wavefunction collapse is nonlocal).
  *   Many Worlds: Keeps Locality (unitary evolution is local), drops Causality (in the sense of single outcomes). *Note: MWI is the only interpretation that arguably saves Locality, but it does so by rejecting the premise that there is a single unique outcome, which is a much heavier metaphysical price than "nonlocality."*

  None of the standard interpretations save *both* Locality and the single-outcome reality we experience. But specifically regarding Dan's claim that "Nonlocality is a choice we make by insisting on hidden variables": **This is false.** Nonlocality is forced on us by the correlations themselves, regardless of whether those correlations are underpinned by deterministic variables or stochastic wavefunctions.

  ### Conclusion

  You win the bet.

  "Local Realism" is indeed a sloppy way of talking that obscures what the theorem is actually doing. It allows physicists to comfort themselves with the idea that "Nature isn't real" rather than admitting "Nature is spooky." But "unreal" properties that correlate across spacelike intervals still require a nonlocal mechanism to coordinate them, unless one adopts a Many-Worlds view (which Dan is likely not arguing for).

  Bell's theorem proves that **Local Causality** is false. You cannot save Locality by rejecting "realism" unless you define "realism" in such a way that physics ceases to be about describing the world and becomes merely about predicting observations. Even then, the predictions themselves exhibit nonlocal dependencies.

  Tell Dan to buy the next round. He can keep his "standard physics view," but you have the "correct foundations view." The universe is nonlocal.

  **Adjudication Status:** Closed.
  **Winner:** User.
