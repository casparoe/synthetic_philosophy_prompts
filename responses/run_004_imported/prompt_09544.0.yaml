      *   **Task:** Write an essay that *takes a side*. No fence-sitting.
      *   **Requirements:**
          *   Lay out the strongest version of Tolstoy's "infection" theory + "universal feeling" criterion.
          *   Present the best objections (cite contemporaries/later critics like Orwell, not just abstract points).
