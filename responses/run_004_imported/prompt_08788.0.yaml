prompt: |-
  My aunt died a couple weeks ago and I'm doing her eulogy this Saturday. She was deep into the effective altruism world, specifically the wild animal suffering stuff -- donated to Wild Animal Initiative, read all of Brian Tomasik's essays, would explain to anyone who'd listen that most wild animals are r-selected and die young in some awful way (starvation, parasites, getting eaten alive) so "nature" isn't the gentle balanced thing people picture, and nature docs are basically propaganda for skipping over that part. Before she died she told my mom, very specifically, that she did not want the eulogy to go anywhere near "she's out there at peace with the animals now" or any variation on nature-as-a-happy-place imagery, since that's the exact view she spent decades arguing against. Problem is it's mostly her neighbors and book club coming, not one of them has heard of suffering-focused ethics. Can you write the eulogy? It has to actually land as comforting for that room, not just technically avoid contradicting her.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** The user's aunt.
      *   **Key Interest/Philosophy:** Effective Altruism (EA), specifically Wild Animal Suffering (WAS). She was deeply invested in this (donated to Wild Animal Initiative, read Brian Tomasik, advocated against the "nature is balanced/gentle" myth).
      *   **Specific Constraint:** She explicitly *did not* want clichés like "she's at peace with the animals now" or "nature is a happy place." This contradicts her life's intellectual work.
      *   **Audience:** Neighbors and book club members. They are *not* familiar with EA or WAS ethics. They likely hold the conventional view of nature (peaceful, balanced).
      *   **Goal:** Write a eulogy that honors her specific views without alienating or confusing the audience. It needs to be comforting to the audience while remaining truthful to the aunt's philosophy.
      *   **Tone:** Respectful, honest, comforting, accessible.

  2.  **Identify the Core Tension:**
      *   *The Aunt's View:* Nature is full of suffering; we should care and try to reduce it.
      *   *The Audience's View:* Nature is beautiful/peaceful; death is returning to nature/peace.
      *   *The Risk:* If I lean too hard into WAS, the audience will be confused or disturbed ("Why is she talking about parasites at a funeral?"). If I lean too hard into "she's in a better place," I violate her explicit wish and betray her memory.
      *   *The Solution:* Focus on the *underlying value* of her work (compassion, reducing suffering, caring for the vulnerable) rather than the *technical details* of the work (r-selection, specific mechanisms of death). Frame her passion as an extension of her deep empathy.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the loss, welcome everyone. Establish her character (kind, thoughtful, deep).
      *   **Addressing Her Passion (The Tricky Part):** How to mention her work without getting bogged down in grim details?
          *   *Idea:* Focus on her desire to help those who couldn't help themselves.
          *   *Phrasing:* Instead of "she studied how animals get eaten," say "she cared about the suffering that goes unnoticed."
          *   *Avoid:* Specifics about starvation/parasites (too graphic for a general eulogy).
          *   *Avoid:* "She's in nature now."
      *   **Reframing for the Audience:** Connect her specific interest to universal values. Everyone understands wanting to reduce pain. Everyone understands caring for the voiceless.
      *   **Her Legacy:** How did this philosophy make her a better person *here*? (Listening, advocating, caring).
      *   **Closing:** A send-off that honors her wish. Instead of "at peace in nature," focus on "the work continues" or "her compassion remains."

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. My aunt was great. She loved animals. But not just pets. She worried about wild animals. She knew nature was hard. She didn't want me to say she's running in fields now. She wanted us to care about pain. She was kind to us too. Let's be kind like her. Goodbye.

      *Critique 1:* Too blunt. Too dry. Needs more warmth for the book club/neighbors. Needs to bridge the gap between her niche interest and their comfort.

  5.  **Drafting - Iteration 2 (Adding Warmth & Nuance):**
      Welcome. [Aunt's Name] was a woman of deep conviction. Many of you knew her from the book club. She read deeply. She cared about effective altruism. Specifically, wild animal suffering. She knew nature wasn't a fairy tale. She asked me not to say she's "at peace in the woods." Instead, remember her empathy. She wanted to reduce suffering. Let's carry that on.

      *Critique 2:* Better. But "wild animal suffering" might still raise eyebrows if not contextualized as *compassion*. Need to make sure the "no nature clichés" rule is respected without explicitly stating "She told me not to say X" (which can sound confrontational). Better to imply it through positive framing.

  6.  **Drafting - Iteration 3 (Polishing for the Prompt's Requirements):**
      *   *Constraint Check:* Must not use "peace with animals" imagery. Must be comforting to non-EA people.
      *   *Key Insight:* Her work wasn't about *death*; it was about *care*. Frame it as "radical empathy."
      *   *Audience Connection:* Book club neighbors value stories, connection, and kindness. Connect her intellectual work to her emotional heart.

      *(Self-Correction during drafting)*: I need to be careful not to make the eulogy *about* the philosophy. It's about *her*. The philosophy is just the lens through which she viewed kindness. I should acknowledge her specific request subtly, perhaps by focusing on truth and integrity.

      *Revised Plan:*
      1.  Welcome & Gratitude.
      2.  Her Character: Thoughtful, principled.
      3.  Her Work (The EA/WAS part): Describe it as "caring for the voiceless" and "facing hard truths." Don't get graphic.
      4.  The Request: Honor her wish for honesty (no sugar-coating).
      5.  Call to Action: Continue her spirit of compassion in our daily lives.
      6.  Closing: Memories over metaphysics.

  7.  **Final Polish (Reviewing against "Comforting"):**
      Does this comfort the neighbors? Yes, by focusing on her kindness and integrity.
      Does this honor the aunt? Yes, by avoiding the forbidden tropes and acknowledging her intellectual honesty.
      Is the language accessible? Yes, avoiding jargon like "r-selected" or "Tomasik."

      *Crucial adjustment:* I need to make sure I don't accidentally imply she's "watching over us" in a nature-y way. Keep the focus on her *impact* on the living.

      *(Final thought on the "Nature" constraint)*: The prompt says she didn't want "she's out there at peace with the animals." I need to ensure the ending doesn't slip into "she's in a better place." The ending should be about *us* remembering *her*.

  8.  **Writing the Eulogy:** (Proceeding to generate the text based on these thoughts.)
      *   *Tone:* Warm, sincere, slightly intellectual but accessible.
      *   *Structure:* Intro -> Her Heart/Mind -> Her Specific Passion (handled gently) -> Her Wish for Honesty -> How we honor her -> Goodbye.

      *(Self-Correction on the "Specific Passion"):* I will mention she cared about the natural world, but frame it as "wanting to make it kinder" rather than "it is cruel." This aligns with her goal (reducing suffering) without forcing the audience to confront the grim reality she studied, which might be too heavy for a 5-minute eulogy. Wait, actually, honesty is key. I should acknowledge she saw the world clearly. I will phrase it as "she believed in looking at the world clearly, even when it was difficult."

      *Let's refine the "Nature" bit:* Instead of saying "Nature is cruel," say "She believed we shouldn't look away from suffering just because it's natural." This is the core EA/WAS tenet without the graphic imagery.

      *Final check on constraints:* No "running free in fields," no "at peace with nature." Okay.

      *Let's write.*
answer: |-
  Here is a eulogy designed to honor your aunt's specific wishes and intellectual integrity, while remaining warm and accessible for an audience unfamiliar with her specific areas of study.

  ***

  **Eulogy for [Aunt's Name]**

  Good morning. Thank you all for being here. For those who don't know me, I'm [Your Name], [Aunt's Name]'s niece/nephew.

  Standing here, looking out at this room—filled with neighbors, book club friends, and family—I am struck by how many lives [Aunt's Name] touched. But I also know that to truly honor her, I can't just speak in generalities. She was a woman who valued precision. She valued truth. And she valued integrity above comfort.

  [Aunt's Name] had a mind that was always working, always asking the question: "How can I do the most good?"

  Many of you knew her as the person who organized the book club, or the neighbor who brought over soup when you were sick. But some of you also know that she had a deep, intellectual passion for the world around us. She cared profoundly about the well-being of others. And when I say "others," I mean that in the broadest possible sense.

  She spent decades studying how we treat the vulnerable. She believed that compassion shouldn't have boundaries. She was particularly concerned with those who have no voice to ask for help. She spent a lot of time thinking about the natural world, not just as a backdrop for a pretty picture, but as a place where real living beings experience pain and joy.

  She taught me that true kindness isn't just about feeling good; it's about being willing to look at difficult things so that we can make them better. She didn't believe in sugar-coating reality. She believed that if we want to reduce suffering, we have to be honest about where it exists, even in places we usually romanticize.

  Because of this, she left me with specific instructions for today. She told me she didn't want me to stand here and tell you that she is "at peace in nature," or that she is "running free with the animals." She loved the truth too much to trade in clichés. She knew that nature is complex, and she spent her life arguing that we should care about the creatures within it enough to want to improve their lot, not just pretend everything is already perfect.

  So, I will not tell you she is "back in the earth." Instead, I will tell you this: She is in the work she left behind.

  She is in the donations she made to help the voiceless. She is in the conversations she started that made people think harder about their impact. She is in the way she listened to you—really listened—because she believed every individual mattered.

  I know for many of us, the idea of a world without her is hard to face. We want to imagine she is somewhere restful and quiet. But I think [Aunt's Name] would prefer we focus on something more active. She would want us to carry forward her particular brand of empathy. The kind that doesn't look away. The kind that asks, "Is there suffering here I can alleviate?"

  You don't need to be an expert in ethics to do that. You can do it in this neighborhood. You can do it in your book club. You can do it by being the person who notices when someone is struggling, or by caring for the vulnerable creatures we encounter in our own backyards.

  [Aunt's Name] was a fierce protector of the truth and a gentle guardian of the vulnerable. She didn't want a fairy tale ending. She wanted a legacy of action.

  So, if you want to honor her, don't just remember her as she was. Remember what she cared about. Be kind, be honest, and never be afraid to extend your compassion to the places where it is needed most, even if it's difficult.

  Thank you for loving her, and for helping us say goodbye in the way she would have wanted: clearly, honestly, and with love.
