      *   *Premise 2:* Moral intuitions favoring impartial strangers are *not* evolutionary adaptations (because they reduce reproductive fitness).
      *   *Premise 3:* If an intuition is explained by evolutionary fitness rather than truth-tracking, it is suspect (The Genetic Fallacy / Evolutionary Debunking).
      *   *Premise 4:* If an intuition is *not* explained by evolutionary fitness, it is more likely to be truth-tracking.
      *   *Conclusion:* Impartial altruism is morally superior to partial family love; the bonus should go to the charity.

  3.  **Identify Philosophical Counter-Arguments (The "Where it Fails" part):**
      *   *The Genetic Fallacy:* Just because a belief has a specific origin (evolution) doesn't mean it's false or morally irrelevant.
      *   *The "Debunking" cuts both ways:* If evolution explains *all* moral intuitions (including impartiality), then the partner's intuition is also suspect. (Error Theory / Evolutionary Ethics).
      *   *The "Not Evolutionary" Claim is False:* Impartial altruism *can* be evolutionary (reciprocal altruism, group selection, reputation building, byproduct of other capacities). So Premise 2 is shaky.
      *   *The "Is-Ought" Problem:* Even if the feeling is "just" biology, that doesn't tell us what we *ought* to do. Biology describes, morality prescribes.
      *   *Special Obligations:* Most ethical systems (except strict Act Utilitarianism) acknowledge special duties to family based on relationships, promises, and reciprocity, not just raw utility.
      *   *The Value of Relationships:* Helping family sustains the relationship itself, which has intrinsic value. Ignoring family damages that value.
      *   *Demandingness Objection:* If impartial charity always trumps personal projects/relationships, morality becomes too demanding to be livable.

  4.  **Structure the Response:**
