      *   *Refining the "Special Obligations":* Use the concept of "agent-relative duties." I have a duty to *my* sister that I don't have to a stranger, not because she's more valuable as a human, but because of our specific history and bond.
      *   *Tone Check:* Keep it respectful to the partner. She's not "wrong" for wanting to do good, but her philosophical justification is shaky. Avoid taking sides on the money, focus on the *argument*.

