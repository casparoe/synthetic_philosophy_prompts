answer: |-
  This is a profound disagreement that touches on one of the most active debates in modern moral philosophy. Your partner is employing a specific philosophical maneuver known as an **Evolutionary Debunking Argument**.

  The core of her claim is: *If I can explain why you have a moral belief by pointing to its evolutionary utility (gene propagation) rather than its moral truth, then you have no reason to trust that belief.*

  While her argument is intellectually sophisticated, it contains several significant philosophical vulnerabilities. You are right to feel that something is missing. Here is a breakdown of where the argument fails, explained in terms you can use in your discussion.

  ### 1. The Genetic Fallacy
  The most immediate problem with your partner's reasoning is a logical error called the **Genetic Fallacy**. This is the mistake of judging the truth or value of a belief solely based on its origin.

  *   **The Flaw:** Even if our love for family is an evolutionary adaptation, that does not prove the love is morally worthless.
  *   **The Analogy:** Consider hunger. Hunger is undeniably an evolutionary mechanism designed to keep us alive and reproducing. It is "biological machinery." But does knowing that hunger is evolutionary mean that eating when you are starving is morally neutral or wrong? Does it mean you should ignore your hunger to feed a stranger instead?
  *   **The Point:** The *origin* of a desire (evolution) is separate from the *value* of satisfying that desire. The fact that kin-love helps genes survive doesn't mean it doesn't also create genuine moral value (love, trust, security, happiness).

  ### 2. The Argument Cuts Both Ways (The Self-Defeat)
  This is the strongest philosophical objection to your partner's position. She claims that because impartial altruism (helping strangers) *doesn't* serve reproductive interests, it is more likely to be "true." However, evolutionary psychologists and biologists largely disagree with her premise.

  *   **The Science:** Impartial cooperation and altruism *are* evolutionary adaptations. Humans are social animals. Traits like reciprocity, reputation management, and group cohesion helped our ancestors survive. If you help a stranger today, you build a reputation as a cooperator, which benefits your tribe (and indirectly you) tomorrow. This is known as **Reciprocal Altruism** or **Group Selection**.
  *   **The Trap:** If your partner argues that "evolutionary origins debunk moral intuitions," she must apply that rule to *her own* intuitions. If her desire to be impartial is also a product of evolution (perhaps selected for because cooperative groups outcompeted selfish groups), then by her own logic, her intuition is also just "inherited machinery" and not necessarily truth-tracking.
  *   **The Result:** You cannot use evolution to debunk family love without also debunking impartial charity. If evolution explains everything, it proves nothing about morality.

  ### 3. Special Obligations vs. Impartial Good
  Your partner is arguing from a framework called **Act Utilitarianism**, which says the only thing that matters is maximizing the total amount of "good" in the world (e.g., lives saved). In this view, everyone counts for one, and no one for more than one.

  However, most other ethical frameworks (and common moral sense) recognize **Special Obligations**.

  *   **The Concept:** We have duties to specific people based on our relationships with them, not just based on how much "good" we can do. You have a duty to your sister that you do not have to a stranger, not because she is intrinsically worth more as a human being, but because you are *her sibling*.
  *   **The Value of Relationships:** A world where everyone ignored their families to save strangers might save more lives in the short term, but it would destroy the institution of the family. The trust and intimacy of family life require partiality. If you cannot count on your brother to help you before he helps a stranger, the relationship loses its meaning.
  *   **The Point:** By helping your sister, you are sustaining a specific moral relationship that has value in itself. Ignoring that relationship to maximize a statistic treats people as vessels for "utility" rather than participants in meaningful bonds.

  ### 4. The "Is-Ought" Problem
  Your partner is moving from a description of biology (*is*) to a prescription of morality (*ought*).

  *   **The Flaw:** She argues: "Evolution made you love family for selfish genetic reasons." Therefore: "You ought not to love family."
  *   **The Counter:** Even if evolution gave us this tendency for "selfish" reasons, we are not slaves to our genes. We can endorse the feeling for *our own* reasons. We can look at our love for our sister and say, "I know this started as biology, but I reflectively endorse this as a good way to live."
  *   **The Point:** The fact that a feeling was installed for reason X doesn't mean it can't be valid for reason Y. You can value family loyalty because it creates a stable, loving society, regardless of why cavemen felt it.

  ### 5. The Demandingness Objection
  Finally, there is a pragmatic philosophical objection to your partner's view known as the **Demandingness Objection**.

  *   **The Concept:** If we are truly obligated to always do the most impartial good possible, morality becomes impossibly demanding. It would require us to sacrifice almost all our personal projects, relationships, and resources until we are just as poor as those we are helping.
  *   **The Result:** Most philosophers agree that a moral theory that requires us to abandon all personal ties is flawed. Morality must leave room for a "personal sphere" where we are permitted to favor our own lives and loved ones.
  *   **The Point:** You are allowed to keep some of the bonus for your family without being immoral. The requirement to save the maximum number of lives is a "supererogatory" act (above and beyond duty), not a mandatory duty that overrides all family obligations.

  ### Summary for Your Discussion
  You don't need to deny that your love for your sister is evolutionary. You can agree with her on the biology but disagree on the morality. Here is a concise way to frame your counter-argument:

  1.  **Origins don't equal validity:** Knowing *why* I love my sister (evolution) doesn't tell me whether I *should* love her. Hunger is evolutionary, but feeding myself is still right.
  2.  **Your intuition is also evolutionary:** Impartial cooperation is also an evolutionary trait (group survival). If evolution debunks my instincts, it debunks yours too.
  3.  **Relationships have value:** Morality isn't just about math; it's about duties. I have a specific duty to my sister that I don't have to a stranger. Ignoring that duty damages the fabric of relationships, which is also a moral bad.
  4.  **Morality shouldn't destroy life:** A moral system that requires me to treat my sister like a stranger is too demanding to be human.

  **A Proposed Compromise:**
  Philosophically, you are not required to choose 100% family or 100% charity. A common middle ground in ethics is to acknowledge **partiality within limits**. You can allocate a portion to your family (honoring special obligations) and a portion to the charity (honoring impartial benevolence). This acknowledges that both intuitions track something real: the value of specific relationships *and* the value of human life generally.

  Your partner's argument is clever, but it relies on a selective skepticism that dismantles your morals while leaving hers untouched. That selectivity is where the logic fails.
