      *   *Virtue Ethics (Groom):* Character is real. Phronesis (practical wisdom). A virtuous person acts rightly across varying contexts. *Implication:* Cultivate the self; trust the person.
      *   *The Synthesis (The Toast's Core):* Marriage is the synthesis. It is a vow (character) to build a home (situation).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role (neutral observer), acknowledge the "famous debate." Set the tone (affectionate respect).
      *   **The Academic Context (for the experts):** Briefly name-drop the studies/ideas without getting bogged down. Milgram, Good Samaritan vs. Aristotelian virtue. Make sure the family understands the gist (Context vs. Character).
      *   **The Relationship Dynamic:** How this argument fuels their love. It's not a bug; it's a feature.
      *   **The Core Insight (The Vow):** This is the crucial part requested by the user.
