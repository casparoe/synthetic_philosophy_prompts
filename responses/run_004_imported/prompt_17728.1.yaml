answer: |-
  Good evening. For those who don't know me, I'm [Name]. I did my doctorate alongside [Bride] and [Groom], in a field just distant enough from theirs that I was never a combatant in their wars, only a witness. And that, I suspect, is why I'm standing here. I am neutral territory.

  If you are family, you know that [Bride] and [Groom] have a running argument. You've heard it at dinner parties. You've heard it over drinks. It is the engine of their relationship.

  If you are from the department, you know the stakes. [Bride] is a situationist. Her work reminds us that what we call "character" is often just a story we tell ourselves after the fact. She studies the Good Samaritan experiment, where seminarians in a hurry walked past a suffering man, not because they were bad people, but because they were late. She studies Milgram. She reminds us that context is king, and that we are all more fragile than we like to admit.

  [Groom] is a virtue ethicist. He argues that character is real. He believes there are stable traits—courage, honesty, love—that can anchor a person when the situation turns ugly. He believes that who you *are* matters more than where you *are*.

  For years, they have debated this. [Bride] says the situation dictates the action. [Groom] says the agent dictates the action. Neither has ever conceded. And yet, here they are.

  I was asked to say something sincere about this debate, rather than just using it as a punchline. And the more I thought about today, the more I realized: A wedding is the only place where this argument doesn't end in a draw. It ends in a synthesis.

  Because think about what is happening right now. On one hand, a wedding vow is the ultimate virtue-ethics claim. It is a promise that your future behavior will be determined by an internal commitment, not by external pressure. When [Groom] says, "I will love you," he is betting on his character. He is saying, "I am building a self that can hold this promise, regardless of the situation."

  But on the other hand, getting married is a profoundly situationist act. It is the deliberate engineering of a context. You are choosing who you live with. You are choosing who watches you. You are choosing what your ordinary Tuesdays look like. [Bride] would tell us that if you want good behavior, you don't just pray for virtue; you design the environment. And today, you are designing the environment. You are building a home where the easiest thing to do is to love each other.

  So, which side wins? Neither. Because the truth of a marriage is that you need both.

  If you have only the situation, you have a convenient arrangement that falls apart when the context changes—when the job is lost, when the health fails, when the hurry returns. But if you have only the character, you have a heroic struggle against the current, trying to be good in a world designed to make that difficult.

  The magic of what you two are doing is that you are using the situation to nurture the virtue. You are making a vow to build a context that makes keeping the vow possible.

  [Bride], you teach us that we must be humble about our goodness, that we need to watch the situational pressures. May you build a home where those pressures are gentle.
  [Groom], you teach us that we are capable of steadiness, that we can be the authors of our actions. May you find in this marriage the ground that holds your footing.

  To the rest of us, they offer a lesson that goes beyond the academy. We often ask whether people are fundamentally good, or whether the world makes them good. [Bride] and [Groom] show us that the answer is "yes." We must cultivate our character, and we must tend to our gardens. We must be the people who keep their promises, and we must be the architects of the rooms in which we keep them.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your character be steady, may your situation be kind, and may you never, ever concede the argument.

  To the happy couple.
