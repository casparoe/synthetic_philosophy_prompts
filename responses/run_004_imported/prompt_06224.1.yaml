  8.  *(Self-Correction during drafting)*: Wait, does Paul actually say testimony is useless? She says it doesn't help with the *decision* because you can't integrate that knowledge into your current utility function. Mill thinks you can integrate testimony. That's the friction point. I need to make sure that's clear.

  9.  *(Final check on the Vampire/Parenthood link)*: The user asks if the vampire case being a red herring undermines parenthood. Paul says no, structure is the same. Mill says yes, ontology matters. I need to present both sides.

