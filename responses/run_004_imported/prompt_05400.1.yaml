answer: |-
  **Setting:** *The locutorio of the Convent of Santa Paula. A heavy iron grille divides the room. Behind it, SOR JUANA. Before it, BISHOP MANUEL FERNÁNDEZ DE SANTA CRUZ (writing as "Sor Filotea"). It is late afternoon; the light slants through the high windows, catching the dust motes between them.*

  **BISHOP:** You write beautifully, Juana. I published your letter because the world needed to see the brilliance of New Spain. But brilliance can cut the hand that wields it. I am not here to deny your intellect. I am here to ask: to what end is it yoked?

  **SOR JUANA:** To the end of all intellect, My Lord. To know God.

  **BISHOP:** Then why does St. Paul command women to keep silence in the churches? Why does he forbid them to teach? You publish sermons in ink. You argue theology with the vigor of a Doctor of Salamanca. Is this not a violation of Divine order?

  **SOR JUANA:** St. Paul speaks of the pulpit, Manuel, not the cell. He forbids women from holding authority *over* men in the public liturgy. He does not forbid a mind from thinking. And when I write, I do not preach from the altar. I converse. Often, I teach only women, who are starved for instruction. Is it better that they remain in ignorant piety, or that I offer them what I have received? If I teach women privately, is that not safer than leaving them to the spiritual direction of men who do not know their hearts?

  **BISHOP:** It is a subtle distinction. But the world does not see the nuance of the cell. They see a nun who writes of logic and physics. They see *curiositas*. The ancient vice. The desire to know for the sake of pride, rather than *studiositas*—the desire to know for the sake of love. When you display your erudition, do you not risk vanity? Is your soul not becoming a museum of wonders rather than a temple of prayer?

  **SOR JUANA:** You mistake the ladder for the ceiling. I do not study physics to rest in physics. I study the created world because it is the handwriting of the Creator. How can I understand the Mystery without the logic to parse it? How can I speak of the Divine without the rhetoric to clothe it? The sciences are a chain. If you remove the link of natural philosophy, the link of theology falls to the ground. To forbid me the lower rungs is to forbid me the top. I cannot love what I do not know.

  **BISHOP:** *[He leans closer to the grille, his voice softening.]* I grant you the logic. It is sound. If one accepts the premise that secular learning serves the sacred, your method follows. And I grant you that ignorance is a dangerous confessor. But Juana, the Church is not only a body of truth; it is a body of people. They are weak. They stumble over appearances.

  **SOR JUANA:** So truth must bow to scandal?

  **BISHOP:** Charity must bow to scandal. If your learning causes the weak to think the Church tolerates disobedience, you wound the Bride of Christ. I do not say women cannot reason. I say that for a nun to be seen reasoning publicly... it invites a chaos we cannot control. I admire your mind. God knows, I admire it. But I worry for your soul, and for the order you inhabit.

  **SOR JUANA:** Then the fault lies not in the study, but in the eyes that judge it.

  **BISHOP:** *[He sighs, stepping back from the grille.]* Perhaps. In the sight of God, you may be entirely right. The chain of sciences is unbroken, and your intent is pure. I cannot refute your argument that knowledge serves devotion. But I am a shepherd of the visible flock, not just the invisible soul. I must concede that your reasoning is orthodox... even if your posture is perilous.

  **SOR JUANA:** I will pray for the flock, My Lord. And I will continue to study. For if I cease to study, I cease to thank God for the gift He gave me.

  **BISHOP:** *[He pauses, hand on the iron bars.]* Pray that the gift does not become the master. I will not order you to burn your books today. But know that the pressure of the world is heavier than the logic of the cell. Eventually, Juana, the silence of the Church may demand more than your discretion.

  **SOR JUANA:** Then I shall speak while I may.

  **BISHOP:** *[A sad smile.]* Yes. While you may.
