answer: |-
  You are experiencing one of the most classic "baptism by fire" moments in the philosophy of language. Your confusion is entirely warranted, not because the syllabus is incoherent, but because you are currently standing in the middle of the biggest fault line in the literature on conditionals.

  Your professor is presenting the **Non-Propositionalist** (or Expressivist) conclusion, while your readings (Stalnaker, Kratzer, von Fintel) represent the **Propositionalist** resistance. Neither side is "whistling past the graveyard." Rather, Lewis's triviality result is the grenade that was thrown into the room in 1976, and the rest of the semester is dedicated to examining the various shrapnel wounds and the different kinds of armor people have built to survive it.

  Here is the breakdown of what Lewis actually proved, why your professor drew the moral they did, and exactly how Stalnaker, Kratzer, and von Fintel think they can dodge the bullet.

  ### 1. What Lewis's Triviality Result Actually Shows
  It is crucial to be precise about the logic of the proof. Lewis did not prove "Conditionals have no truth conditions."

  He proved an inconsistency theorem. He showed that you cannot hold the following three claims simultaneously:
  1.  **The Equation:** For any proposition $A$ and $C$, the probability of the conditional is the conditional probability: $P(A > C) = P(C|A)$.
  2.  **Propositionalism:** The conditional $A > C$ expresses a genuine proposition (it has truth conditions that can be true or false in a world).
  3.  **Universal Conditionalization:** The probability function can be updated by conditionalizing on any proposition (including the conditional itself) without collapsing the probability space (i.e., without making it so that $P(C|A)$ can only take values 0 or 1, or that $A$ and $C$ are probabilistically independent).

  **The Moral:** You must drop at least one of these.

  *   **Your Professor's Move:** They are dropping **(2) Propositionalism**. This is the line taken by Richard Adams (who inspired Lewis) and later Dorothy Edgington. They argue that "If A, C" does not express a proposition with a truth value; it is a device for expressing a conditional degree of belief. Therefore, it doesn't have a probability in the standard sense, and Lewis's math doesn't apply.
  *   **The Readings' Move:** Stalnaker, Kratzer, and von Fintel generally want to keep **(2) Propositionalism** because they are semanticists building compositional systems. To do so, they must either restrict **(1) The Equation** or restrict **(3) Universal Conditionalization**.

  ### 2. How the Readings Dodge the Result
  Your readings are not ignoring Lewis; they are offering specific technical mechanisms to block the assumptions required for the proof to go through.

  #### Stalnaker: Context-Dependence
  Stalnaker (particularly in his later work responding to Lewis) argues that the content of a conditional is **context-dependent**.
  *   **The Escape:** Lewis's proof assumes that the proposition expressed by $A > C$ remains fixed while you update your probability function (conditionalize). Stalnaker argues that when you learn new information (like $A$), the context changes. When the context changes, the *proposition* expressed by $A > C$ changes.
  *   **Why it blocks Lewis:** If the proposition $X$ you are conditionalizing on is not the same proposition before and after the update, the algebraic steps in Lewis's proof fail. You can maintain truth conditions, but you have to accept that those truth conditions shift as the conversation evolves.

  #### Kratzer: The Restrictor View
  Kratzer's famous move (from "Conditionals" 1986 and *Modals and Conditionals* 2012) is to argue that **"if" is not a propositional connective.**
  *   **The Escape:** In standard logic, "if" is a binary operator taking two propositions to make a third ($A \to C$). Kratzer argues "if" is a *restrictor* for a covert modal operator. The logical form isn't $If(A, C)$, it's more like $Must(A)(C)$.
  *   **Why it blocks Lewis:** Lewis's proof targets binary connectives that form propositions. If "if" clauses merely restrict the domain of quantification for a modal, the "proposition" expressed by the whole sentence is not constructed in the way Lewis assumed. While the *sentence* still has truth conditions (relative to a modal base and ordering source), the probability of the conditional is not the probability of a single, static proposition in the way the triviality proof requires. It allows them to keep truth-conditional semantics without accepting the specific probability semantics Lewis attacked.

  #### Von Fintel: Dynamic Semantics and Strawson Entailment
  Von Fintel (often working with Gillies or Iatridou) pushes the context-dependence angle further using dynamic semantics.
  *   **The Escape:** They argue that assessing the truth of a conditional requires checking if $C$ holds in the closest $A$-worlds *accessible in the current context*. When you conditionalize on $A$, you change the set of accessible worlds.
  *   **Why it blocks Lewis:** This is a more rigorous version of Stalnaker's move. They argue that the class of probability functions Lewis requires (closed under conditionalization on the conditional itself) is not a class of functions that represents rational agents. Rational agents update their *context*, which shifts the semantic value of the conditional. Therefore, the "triviality" only arises if you model belief update incorrectly.

  ### 3. So, Who is Right?
  This is why you are confused: **There is no consensus.**

  *   **The Professor** is teaching you that the *simplest* explanation of Lewis's result is that conditionals aren't propositions. This is a clean, metaphysically parsimonious view. It aligns with the idea that we use conditionals for reasoning, not for describing facts.
  *   **The Readings** are teaching you that we can save truth-conditional semantics if we make our semantics more complex (by adding context-dependence, modal bases, ordering sources, and dynamic updates).

  Is the professor claiming "nobody serious still thinks..." correct? **No, that is rhetorical hyperbole.**
  There are very serious, prominent philosophers and linguists (Robert Stalnaker, Kai von Fintel, Irene Heim, Angelika Kratzer, Frank Jackson, David Barnett) who maintain truth-conditional accounts. However, they acknowledge that Lewis's result is a massive constraint. They cannot just say "$P(A > C) = P(C|A)$" and leave it at that. They have to build complex architectures to explain why the Equation *seems* true without triggering the collapse.

  ### 4. How to Navigate the Rest of the Seminar
  You are not in a class where half the syllabus is in denial. You are in a class that is structured dialectically:
  1.  **The Threat:** Lewis shows that the naive combination of Probability + Truth Conditions is impossible.
  2.  **The Defense:** Stalnaker, Kratzer, and von Fintel show the sophisticated modifications required to keep Truth Conditions alive.

  **What to look for in the readings:**
  *   **Stalnaker:** Look for where he discusses "context sets." Notice how the truth of a conditional depends on what is presupposed in the conversation.
  *   **Kratzer:** Look for the claim that "if" clauses are not sentential operators but restrictors. Ask yourself: Does this change the "proposition" enough to stop Lewis's math?
  *   **Von Fintel:** Look for discussions of "domain restriction" and how learning $A$ changes the modal base.

  **A question to ask in section:**
  *"Lewis's proof assumes the proposition expressed by $A > C$ is constant across probability updates. Is the primary difference between the Expressivist view and the Stalnaker/Kratzer view simply that the latter group thinks the content of the conditional shifts with context, thereby blocking the conditionalization step in the proof?"*

  (This will show your TA you understand the technical heart of the dispute.)

  ### Summary
  Lewis proved that **Naive Propositionalism + The Equation = Disaster.**
  *   **Your Professor** concludes: Drop Propositionalism.
  *   **Stalnaker/Kratzer/vF** conclude: Keep Propositionalism, but complicate the semantics (Context/Restrictors) so that The Equation doesn't trigger the disaster.

  They are not whistling past the graveyard; they are trying to build a mausoleum sturdy enough to hold the body. Whether they succeed is the central question of your seminar.
