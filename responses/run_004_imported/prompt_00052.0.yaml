answer: |-
  **The Death of the Mosaic: Why Quantum Entanglement Refutes Humean Supervenience**

  David Lewis's doctrine of Humean Supervenience (HS) stands as one of the most ambitious syntheses of metaphysics and empiricism in the twentieth century. It posits that the entire truth about the world, including the laws of nature, supervenes on a "Humean mosaic": a spatiotemporal arrangement of local, intrinsic matters of particular fact. On this view, there are no necessary connections between distinct existences; the world is a collection of atomic individuals, and laws are merely the most efficient summaries of their behavior (the Best System Account). However, the advent of quantum mechanics, specifically the phenomenon of entanglement, poses an existential threat to this framework. Entangled states appear to involve irreducibly non-separable relations that cannot be captured by an arrangement of local qualities. While proponents of Humeanism have devised strategies to accommodate quantum mechanics—such as enlarging the supervenience base to include fundamental relations or adopting wave-function realism—these moves come at a prohibitive metaphysical cost. This essay argues that while technical modifications can preserve the *letter* of supervenience, they eviscerate its *spirit*. Consequently, Humean supervenience is not tenable in light of quantum non-separability without ceasing to be meaningfully Humean.

  To understand the severity of the challenge, one must grasp the core commitments of HS. For Lewis, the world is built from point-sized particulars possessing intrinsic properties. "Intrinsic" means a property a thing has in and of itself, independent of anything else. "Local" means the properties belong to specific points in spacetime. The principle of recombination follows from this: anything can coexist with anything else, provided they occupy distinct spatiotemporal positions. There is no "spooky action at a distance" built into the ontology. The Best System Account (BSA) of laws relies on this mosaic; laws are true because they best balance strength and simplicity in describing the distribution of these local qualities.

  Quantum entanglement shatters this picture. In an entangled system, such as a pair of electrons in a singlet state, the quantum state of the pair cannot be factorized into the states of the individual electrons. The properties of the whole are not determined by the properties of the parts. Bell's Theorem and subsequent experimental violations of Bell's inequalities suggest that this non-separability is not merely an epistemic limitation but an ontological feature of the world. If the state of particle A is not independent of particle B, even when spacelike separated, then the "distinct existences" criterion of Humeanism is violated. The mosaic is not a collection of independent tiles; it is a holistic fabric. If the base facts are not local and intrinsic, the supervenience base of HS is gone.

  In response, Humeans have pursued two primary defensive strategies. The first is to enlarge the supervenience base. Lewis himself acknowledged that HS was a fallible hypothesis contingent on physics. If physics dictates that fundamental relations are irreducible, the Humean can simply include these relations in the mosaic. On this "Relational Humeanism," the base consists of local qualities *plus* fundamental spatiotemporal or quantum relations. Laws still supervene on this base; the base is just richer than Lewis originally hoped.

  The second strategy, championed by David Albert and Barry Loewer, is wave-function realism. This view posits that the fundamental ontology is not particles in 3D space, but a wave function evolving in a 3N-dimensional configuration space. In this high-dimensional space, the wave function is a local field. Thus, locality is preserved, just not in the 3D space of human experience. The Humean mosaic is redefined as the distribution of the wave function over configuration space. The 3D world of tables and chairs becomes a derivative "manifest image" emerging from the fundamental high-dimensional laws.

  While these strategies technically preserve the supervenience relation (laws still depend on base facts), they fail to save Humean Supervenience as a distinctive metaphysical doctrine. The motivation for HS was never merely that *something* supervenes on *something else*. It was that the fundamental layer of reality is ontologically innocent: a collection of distinct, independent existences without necessary connections. This atomism was the bulwark against modal realism, dispositional essentialism, and holism.

  By enlarging the base to include fundamental non-separable relations, the Humean concedes the central anti-Humean point: that there are necessary connections between distinct existences. If a relation is fundamental and non-separable, the relata are not ontologically independent. The Principle of Recombination collapses, for one cannot recombine the parts of an entangled system arbitrarily. If the metaphysics accepts holistic relations as fundamental, it has adopted the ontology of the anti-Humean holist. To call this "Humean" is to stretch the label until it snaps. It retains the supervenience structure but abandons the Humean constraint on *what* can supervene.

  Similarly, wave-function realism saves locality only by sacrificing the connection between the fundamental ontology and the world as we experience it. If the fundamental mosaic is in 3N-dimensional space, the "local matters of particular fact" in our 3D world are not fundamental. They are derivative patterns. This creates a severe tension for the Best System Account. The BSA is motivated by empiricist concerns: laws should summarize the observable regularities of the world. If the fundamental mosaic is in a high-dimensional space inaccessible to observation, and the 3D world is merely a projection, the empiricist motivation for the BSA is undermined. Furthermore, critics argue that the wave function itself may not be intrinsic to points in configuration space, potentially reintroducing holism even at the fundamental level. But even if it is local in 3N space, the cost is accepting a fundamental reality that is radically non-local relative to the 3D space where causation and agency appear to reside. This is a pyrrhic victory for Humeanism; it saves the thesis by changing the subject.

  The deepest failure of these modified Humeanisms is that they render the doctrine vacuous. If "Humean Supervenience" is compatible with fundamental holism, fundamental non-separability, and high-dimensional non-locality, then it is compatible with almost any physical ontology. A thesis that can absorb its own negation (holism) by redefining its base terms loses its explanatory power. The distinctiveness of Humeanism lay in its restriction on the fundamental base: *no necessary connections, only local qualities.* Quantum mechanics demonstrates that this restriction is false. To maintain HS by removing the restriction is to admit that HS was wrong about the structure of the world, even if one keeps the word "supervenience."

  Moreover, the retreat to modified HS undermines the philosophical utility of the view. Humeanism was attractive because it promised a world without mystery: no causal powers, no modal glue, just one thing after another. Quantum entanglement reintroduces the mystery at the fundamental level. If the Humean accepts entanglement as a brute fact of the mosaic, they are accepting a form of ontological holism that looks suspiciously like the "necessary connections" Hume sought to banish. The correlation between entangled particles is not mediated by local facts; it is immediate. To assert that this simply "is" part of the mosaic is to describe the problem, not solve it. It grants the anti-Humean claim that the world contains irreducible modal structures, merely labeling them "base facts" rather than "laws" or "powers."

  In conclusion, Humean Supervenience cannot survive the challenge of quantum entanglement without surrendering its soul. The strategies of enlarging the base or retreating to wave-function realism preserve the logical structure of supervenience but abandon the metaphysical commitments that made Humeanism a compelling alternative to realism about laws or powers. By accepting non-separable relations or high-dimensional holism as fundamental, the modified Humean accepts a world where distinct existences are not truly distinct and where the local is derivative of the global. This is anti-Humean holism wearing Humean clothing. Therefore, a definite verdict must be rendered: Humean Supervenience, in any form that retains its original philosophical motivations regarding locality and distinctness, is untenable. The physics of the actual world demands a metaphysics of structure and relation that transcends the Humean mosaic. We must either abandon supervenience altogether or accept a "Neo-Humeanism" that is so diluted it no longer offers the ontological parsimony it once promised. The mosaic is broken; the world is woven.
