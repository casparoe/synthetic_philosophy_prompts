      *   Confidence: High, but not mathematical certainty. It's robust because every alternative formalism hits the same boundary. It's "empirically" robust (no counterexamples found in 80+ years), but philosophically open.

  5.  **Address Question 3: Theorem, Hypothesis, or Definition?**
      *   *Theorem:* No. You can't prove a bridge principle using only one side of the bridge.
      *   *Empirical Hypothesis:* In the sense that physics might allow hypercomputation (Malament-Hogarth spacetimes, etc.), yes. But regarding *human* computation, it's more conceptual.
      *   *Definition:* This is the dominant modern view (Computational Church-Turing Thesis). It defines "effectively calculable" *as* "Turing computable."
      *   *Turing's Shift:* Turing starts with the philosophical analysis (Section 9 start) to justify the model. Then he shows equivalence (lambda calculus, etc.) to show *robustness*. The equivalence proofs don't prove CTT; they prove that the *choice* of formalism doesn't matter. They answer "Is this model stable?" not "Is this model universal?"

