      *   **Risk vs. Ambiguity:** This is the core distinction.
          *   *Risk:* Probabilities are known (Hospital A: 20% chance).
          *   *Ambiguity (Knightian Uncertainty):* Probabilities are unknown (Hospital B: ???).
      *   **The Ellsberg Paradox:** This is the classic experiment demonstrating that people prefer known risks over unknown ambiguities, even if the expected value is the same. This directly supports Friend 2.
      *   **Risk Aversion:** Friend 1 isn't *wrong*, but they are incomplete. Risk aversion explains avoiding a 50/50 gamble for a sure thing. It doesn't fully explain avoiding an *ambiguous* gamble when a *risky* one is available.
      *   **Rationality:** Is ambiguity aversion irrational? In standard Expected Utility Theory (EUT), yes. But in more modern behavioral economics (Prospect Theory, etc.), it's a recognized heuristic. It can be rational in real-world contexts where "unknown" implies hidden information or adversarial selection.

  3.  **Address Question 1: Is she being irrational?**
      *   *Standard Economics:* Yes, technically. If EV is equal, she should be indifferent. Preferring known risk violates the Sure Thing Principle (Ellsberg).
