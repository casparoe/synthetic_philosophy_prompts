answer: |-
  This is a fantastic dilemma for a story because it cuts right to the heart of how humans actually make decisions versus how economic models say we *should* make decisions.

  To answer your friends' argument directly: **Friend 2 is onto something profound, though Friend 1 isn't entirely wrong.** The nurse isn't just being "risk-averse." She is exhibiting a specific, well-documented psychological phenomenon called **Ambiguity Aversion.**

  Here is the breakdown of the theory, the rationality question, and the practical advice you can offer.

  ### 1. The Theory: Risk vs. Ambiguity
  In economics and decision theory, there is a critical distinction between **Risk** and **Uncertainty** (often called Knightian Uncertainty, after economist Frank Knight).

  *   **Risk (Hospital A):** The probabilities are known. You know there is a 20% chance of layoffs. You can price this. You can insure against this.
  *   **Ambiguity/Uncertainty (Hospital B):** The probabilities are unknown. The distribution of outcomes is a mystery.

  Your second friend is describing the **Ellsberg Paradox**. In the 1960s, Daniel Ellsberg (yes, the same one who leaked the Pentagon Papers) proved that people consistently prefer to bet on known risks rather than unknown ambiguities, even if the mathematical expected value is identical.

  If you offer someone a bet where they win if they draw a red ball from an urn containing 50 red and 50 black balls, they will take it. If you offer them a bet where they win if they draw a red ball from an urn containing 100 balls of *unknown* color mix, they will usually refuse, even though the statistical odds are likely the same.

  **Why?** Because the human brain treats "missing information" as a threat. When odds are known, the brain can simulate the outcome. When odds are unknown, the brain cannot simulate the outcome, triggering a stronger anxiety response than a known negative probability.

  ### 2. Is She Being Irrational?
  This depends on which textbook you read.

  **The Standard Economic View: Yes.**
  According to classical Expected Utility Theory, ambiguity aversion is a cognitive bias. If the Expected Value (EV) of the startup is equal to or higher than the hospital, a "rational actor" should be indifferent or choose the startup. Preferring the known 20% layoff rate over an unknown chance implies she is violating the "Sure Thing Principle."

  **The Behavioral/Ecological View: No.**
  In the real world, ambiguity aversion is often **ecologically rational**. Here is why treating "unknown odds" as worse than "bad odds" can be a smart survival heuristic:

  *   **Information Asymmetry:** In a job negotiation, if the founders *cannot* or *will not* give you odds on survival, it is often because the odds are worse than they look. If the startup had 24 months of funding in the bank, they would tell you to calm your nerves. Silence often signals hidden danger.
  *   **Model Risk:** At Hospital A, the "20% layoff" number is based on historical data. It is a tested model. At Hospital B, the business model is unproven. Betting on an unproven model carries "model risk" that betting on a historical trend does not.
  *   **Preparability:** Knowing you have a 20% chance of being fired allows you to prepare (save money, network). Not knowing *if* you will be fired prevents preparation. The inability to prepare has its own cost.

  So, tell your friends: **She is not irrational; she is ambiguity-averse.** And in a world where people hide bad news, ambiguity aversion is a useful shield.

  ### 3. Practical Advice: What Should She Do?
  If you are advising her (or writing about what she *should* do), the goal isn't to force her to ignore her gut, but to help her convert **Ambiguity** into **Risk**. You cannot make a rational choice on ambiguity, but you can make one on risk.

  Here is a framework she can use:

  **A. Turn "Unknowns" into "Ranges"**
  She shouldn't accept "nobody knows." She needs to do the detective work to create a probability range.
  *   *Ask:* "How many months of runway do you have in the bank?"
  *   *Ask:* "What are the milestones required for the next round of funding?"
  *   *Action:* If they have 12 months of cash and need to raise money in 10, the risk of folding is high. If they have 36 months, the risk is low. She needs to force a number out of them, even if it's an estimate.

  **B. Compare Worst-Case Scenarios (Minimax Regret)**
  Expected Value is an average, but careers are lived in specifics. She should compare the *bottom* of the distribution.
  *   *Hospital A Worst Case:* Laid off in 18 months. She has a severance package (likely), unemployment benefits, and a recognizable brand name on her resume.
  *   *Hospital B Worst Case:* Clinic folds in 6 months. Does she get severance? Is "failed startup" a stigma or a badge of honor in her field?
  *   *Advice:* If the startup offers no severance and the brand name is unknown, the "ruin" scenario is worse than Hospital A. If the startup offers a "golden parachute" clause in her contract, she mitigates the ambiguity.

  **C. Evaluate "Career Capital"**
  Which job makes her more employable if the worst happens?
  *   If Hospital A lays her off, she is a nurse from a known hospital system. She is hireable.
  *   If Hospital B folds, is she a nurse with niche tech experience? Or is she unemployed from a defunct company?
  *   *Advice:* If the startup role gives her unique skills (telehealth, data management) that make her *more* valuable even if the company fails, the ambiguity is worth the price. If it's just the same nursing work in a shinier building, the ambiguity is pure cost.

  **D. The "Regret Minimization" Framework**
  Ask her to project to age 80.
  *   Will she regret staying at a hospital she knew was cutting staff, playing it safe?
  *   Will she regret betting on a new venture that failed, but knowing she tried?
  *   Usually, people regret inaction (staying) more than action (leaving) in the long run, *unless* the action leads to ruin.

  ### The Headline for Your Story
  The tension in your story isn't just about risk; it's about **control**.

  Hospital A offers the illusion of control ("I know the odds"). Hospital B offers the potential of reward but demands surrender to chaos. The nurse's hesitation isn't a math error; it's a recognition that **human beings are wired to fear the invisible predator more than the visible one.**

  If she chooses Hospital A, she isn't being cowardly; she is paying a "certainty premium." She is accepting lower expected value to buy peace of mind. That is a valid purchase, as long as she knows that's what she's buying.
