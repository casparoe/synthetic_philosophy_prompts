  **Argument 2 (Marco):** Score 1. This is the standard "Halfer" position arguing that no new relevant evidence is gained upon waking. It is philosophically robust, but it arguably ignores the indexical information ("I am awake now") that Tessa highlights.

  **Argument 3 (Tessa):** Score 2. This is the strongest pragmatic move; the expected value math is undeniable, and holding 1/2 credence genuinely leads to guaranteed losses in per-waking bets. It forces the Halfer to explain why a rational agent should hold beliefs that lead to "irrational" betting behavior.

