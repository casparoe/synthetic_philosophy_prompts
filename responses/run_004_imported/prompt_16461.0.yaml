  **The Bigger Thing They're Missing**
  Both friends are treating "confidence" (credence) as a single, unambiguous concept, but the paradox persists because the question is actually ill-defined. The debate is essentially a clash between two different definitions of probability: **Epistemic Credence** (mapping the state of the world, favoring Marco) vs. **Decision-Theoretic Credence** (guiding action and bets, favoring Tessa). Additionally, they are brushing past the technical distinction between **centered propositions** (statements about "me, here, now") and **uncentered propositions** (statements about the coin), which is where the mathematical disagreement actually originates. Until they agree on whether probability is about *truth* or *utility*, they will talk past each other.
