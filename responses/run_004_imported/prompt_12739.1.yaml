      *   *Evidence Required:*
          *   Must solve an *undecidable* problem, not just a hard one.
          *   Must rule out approximation.
          *   Must demonstrate infinite precision or access to non-computable oracles (physically impossible under standard physics).
      *   *Verdict:* Extremely high bar. Usually indicates a modeling error, not actual hypercomputation.

