  2.  **Deconstruct the Church-Turing Thesis (CTT) Landscape:**
      *   *Original CTT:* About "effective calculability" (what a human with paper and pencil can do). It's not a theorem because "effective calculability" is informal. It's an identification of an informal concept with a formal one (Turing Machines).
      *   *Physical CTT (PCTT)::* About what physical systems can compute. This *is* empirical. It claims nature doesn't allow hypercomputation.
      *   *Extended CTT (ECTT):* About efficiency (polynomial time). This is what quantum computing challenges (BPP vs. BQP).
      *   *Consensus:* Most logicians agree the original CTT is robust (no counterexamples to "effective calculability"). The PCTT is open but widely believed. The ECTT is likely false (thanks to quantum).

  3.  **Address Claim Type 1: Hypercomputation (Analog, Biological, Brain):**
      *   *The Claim:* System $X$ computes a non-Turing-computable function (e.g., solves the Halting Problem).
