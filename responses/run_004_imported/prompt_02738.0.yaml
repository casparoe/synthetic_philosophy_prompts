      *Wait, one more check:* Does Lewis's RCA require the basis to *cause* the manifestation? Yes. "S and B would jointly cause M". In the mask case, do S and B jointly cause M? No, they fail to cause M. So the analysis says "no disposition". But the object *is* disposed. Hence failure.

