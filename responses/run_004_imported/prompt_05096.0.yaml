prompt: |-
  Okay so I run this tiny AI safety podcast out of my bedroom, like a couple hundred listeners, started it after a rabbit hole a few years back reading LessWrong and the old MIRI corrigibility paper and rewatching every Rob Miles video like three times. I never studied CS or philosophy formally, its just a hobby that got a bit out of hand. Next week I've got a guest lined up who's spent years defending the position that you actually can engineer a shutdown-respecting AI without breaking it as a rational agent — his basic line is that you rig the utility function with a correction term (the old "utility indifference" idea) so the agent ends up mathematically indifferent to whether the shutdown button gets pressed, and that this is compatible with the thing still behaving like a normal expected-utility maximizer the rest of the time.

  I don't want him to just re-explain utility indifference for ten minutes, most of my listeners have already read the same three blog posts I have. Can you draft me like seven or eight interview questions that actually push on this instead of letting him restate the thesis? I want at least one question that goes after the "ok but doesn't the agent still have some incentive to steer toward or away from the button getting pressed, correction term or not" worry — basically pointing the classic instrumental-convergence "you can't fetch the coffee if you're dead" logic at his specific fix. I want at least one that makes him actually explain, in a way a non-math person could follow, why bolting on indifference doesn't just quietly kill the agent's incentive to keep the shutdown mechanism itself working (if it truly doesn't care either way, why would it bother protecting the button from getting knocked out as a side effect of something else it's doing). And I want at least one on whether this fix even survives the agent building subagents or successor systems, since I remember that being flagged as its own unsolved mess in the original paper. Could you tack on a quick follow-up to each of those three, keyed to whatever answer he'd most likely give, so it doesn't feel like I'm just lobbing questions and moving to the next one? And maybe close out the list with one question about what he'd actually accept as evidence that the shutdown problem is basically solved, as opposed to him just moving the goalposts again. No throwaway stuff like "what got you into AI safety" please, I want the whole list to assume he's already answered that a hundred times.
