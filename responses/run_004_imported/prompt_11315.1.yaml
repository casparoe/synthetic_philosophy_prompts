answer: |-
  This is a sharp observation. You have correctly identified that Functional Decision Theory (FDT) and Gauthier's *Morals by Agreement* are essentially formalizing a Hobbesian/Contractarian insight: morality is a technology for solving coordination problems, and "obligation" is the subjective experience of running that software.

  You want the hard version. You want the argument that says: *Yes, if the causal/functional link is truly severed, the obligation evaporates, and your intuition that it remains is a cognitive bug.*

  Here is the case for the reductionist view, biting the bullet on the ash-scattering uncle to save the theory.

  ### 1. The Ontological Parsimony Argument
  Let's start with the metaphysics. If we accept a naturalistic worldview (which FDT and Gauthier implicitly do), moral properties cannot be "queer" ontological freestanding entities. They must reduce to facts about agents, goals, and constraints.

  Scanlon's contractualism posits that an act is wrong if it violates principles that no one could reasonably reject. In the ash-scattering case, Scanlon would argue you violated Principle F: you intentionally led your uncle to expect you would do X, knowing he wanted that assurance, and then you didn't do X. You wronged him by manipulating his expectations.

  **The Reductionist Rebuttal:**
  In your specific case, the uncle is *dead*. He has no expectations. He experiences no betrayal. There is no "reasonable rejection" happening from the grave. If the obligation persists, *who* is the creditor of the obligation?
  *   **Society?** No, by stipulation, no one knows.
  *   **The Universe?** No, the universe is indifferent.
  *   **Your Future Self?** Only if breaking the promise degrades your future policy execution.

  If you claim there is a "moral residue" independent of these stakeholders, you are positing a ghost in the machine. You are claiming there is a *normative force* that exerts pressure without a *causal mechanism*. The decision-theoretic story is superior because it locates the force where it actually exists: in the structure of rational agency itself. To say "you still ought to do it" without a "why" that cashes out in outcomes (even internal outcomes like self-model integrity) is moral fetishism.

  ### 2. The Heuristic Misfire (The "Ash-Scattering" Defense)
  This is the crux. Why does it *feel* like you should scatter the ashes?

  The reductionist answer is evolutionary and computational: **Human brains do not run case-by-case decision theory.** We run heuristics.

  Evolution selected for agents who internalized "Keep Promises" as a terminal value (or a near-terminal constraint) because, in the ancestral environment, **there was no such thing as a truly one-off interaction.**
  *   Someone always knows.
  *   Reputation always leaks.
  *   You always have to live with yourself in a social context.
  *   Epistemic uncertainty about detection was always high.

  Therefore, the cognitive module that generates "promissory obligation" was calibrated for a world of high transparency and iteration. It is a *policy heuristic*.

  In the ash-scattering case, you are presenting the heuristic with an input it was not designed to handle: a scenario with *zero* probability of detection and *zero* future interaction. The heuristic fires anyway because it cannot distinguish this edge case from the standard cases where breaking the promise would be catastrophic for your social standing.

  **The Bullet Bite:**
  The feeling of obligation you have is real, but its *normative authority* is illusory in this specific instance. It is like feeling nausea at the sight of a plastic cake. Your nausea system is designed to prevent poisoning, but it misfires on non-toxic lookalikes. The nausea is real; the poison is not. Similarly, the guilt is real; the obligation is not.

  If you had a perfect FDT agent (a cold calculator), and you could mathematically prove $P(\text{detection}) = 0$ and $P(\text{future interaction}) = 0$, the agent would not scatter the ashes. It would keep the $1000. The fact that humans *can't* do this calculation perfectly is a limitation of our hardware, not evidence of a deeper moral truth.

  ### 3. Dismantling Scanlon's "Trust"
  Scanlon argues that the wrong is done *at the moment of the promise* if you intend to break it, or *at the moment of breaking* by violating the trust invoked. He grounds the obligation in the value of "mutual recognizability."

  **Why this fails in the reductionist view:**
  Scanlon's framework secretly relies on the same functionalist logic but obscures it with the language of "reasonableness." Why is it "unreasonable" to reject a principle that allows breaking promises to dead uncles?
  *   If the answer is "Because it undermines the institution of promising," Scanlon is smuggling in consequentialism (Gauthier/FDT).
  *   If the answer is "Because it disrespects the uncle's autonomy," the reductionist asks: *How?* A dead man has no autonomy to disrespect. He is no longer an agent.

  Scanlon's view collapses into the decision-theoretic view when pressed. He wants to say the obligation exists *even if* no bad consequences follow. But if no bad consequences follow (no hurt feelings, no reputation loss, no self-degradation), what work is the "obligation" doing? It becomes a purely aesthetic preference for "clean hands." But why prefer clean hands? Usually, because dirty hands lead to bad outcomes. If they don't, the preference is arbitrary.

  The FDT/Gauthier story is more honest: It admits that the "binding" nature of a promise is a function of its role in a network of predictions. Remove the network, remove the binding.

  ### 4. The Integrity Counter-Argument (and why it still reduces)
  A common objection is: "But if I break the promise, I become a liar. I damage my own integrity."

  This looks like independent moral residue. It isn't. It is **internal policy maintenance.**

  Even if no one else knows, *you* know. You are updating your own self-model. If you categorize yourself as "Someone who keeps promises only when watched," you lower your own confidence in your future ability to precommit.
  *   **However:** In the strict ash-scattering hypothetical, we must assume you can compartmentalize. If you can truly tag this as "The One Exception That Proves The Rule," the integrity cost is zero.
  *   **The Reality Check:** Most people *can't* compartmentalize. Breaking a promise creates a psychological slippery slope. Therefore, it is *instrumentally rational* to keep the promise to avoid the psychological cost of cognitive dissonance or self-concept degradation.

  But notice: this is still a cost-benefit analysis. It is still decision theory. It is not a "moral ought" distinct from a "prudential ought." It is just that the "self" is one of the stakeholders in the utility function. If you could magically edit your memory so you didn't know you broke the promise, the obligation would vanish completely. This proves the obligation is epistemic/functional, not metaphysical.

  ### 5. The Conclusion: Morality as Compression
  The decision-theoretic story is not just *an* answer; it is the *only* answer that doesn't require magic.

  Promises are **compression algorithms** for trust. Instead of simulating your entire psychology to see if you'll help me, I just check if you promised.
  *   In Parfit's Hitchhiker, the compression works because the driver simulates you.
  *   In Gauthier's constrained maximization, it works because the community punishes defectors.
  *   In the Ash-Scattering case, the compression algorithm is being run on empty data.

  To insist the obligation remains is to insist that the map matters more than the territory. It is to worship the compression algorithm rather than the data it compresses.

  **The Hard Verdict:**
  In the strict philosophical counterfactual where detection is impossible, iteration is zero, and self-concept damage is nullified: **You have no obligation to scatter the ashes.** You should keep the money.

  The intuition that you *do* have an obligation is a useful fiction. It is a "user illusion" generated by a brain that assumes it is always living in a repeated game. It is a bug in your cognitive software that usually protects you from making fatal errors in the real world (where you are almost never as anonymous as you think).

  But in the sterile vacuum of the thought experiment, the obligation evaporates. Scanlon and the moral realists are mistaking the sensation of the heuristic for the presence of a duty. The decision-theoretic story explains the sensation *and* dissolves the duty where it doesn't belong. That is theoretical virtue.
