prompt: |-
  Me and a friend are both kinda into day trading, and lately he keeps texting me stuff like 'bet u $50 this stock closes up tomorrow.' I always hesitate to take these bets, and I think I finally figured out why: if he didnt think he knew something I don't, why would he even bring it up? But that same logic should apply to him about me wanting to take the bet, so by that reasoning neither of us should ever agree to one - yet people trade stocks with each other constantly. Feels like the same weirdness applies to investing in general too: for every person buying a stock there's someone selling it, so how are they both supposed to expect to come out ahead? Is there an actual answer to this or am I just overthinking a $50 bet with my buddy?
