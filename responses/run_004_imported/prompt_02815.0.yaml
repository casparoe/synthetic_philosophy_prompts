answer: |-
  This is a profound and deeply human dilemma. You are grappling with the distinction between the **rightness of an act** (which both you and your friends agree on) and the **moral worth of the agent** (which is where the philosophical friction lies).

  You have correctly identified the two dominant frameworks for assessing moral worth. Immanuel Kant's deontological approach and Julia Markovits's Coincident Reasons Thesis (CRT) offer fundamentally different criteria for when an agent deserves moral credit.

  Here is precisely where they diverge, how they would judge your specific situation, and an argument for which offers the more defensible verdict.

  ### 1. The Divergence: Source vs. Content

  The core disagreement lies in what each theory thinks *makes* a motive morally valuable.

  **Kant: The Source of the Motive**
  For Kant (specifically in the *Groundwork*), moral worth is determined by the **source** of your motivation.
  *   **The Criterion:** An act has moral worth only if it is done *from duty*. This means the "determining ground" of your will must be the recognition that the action is morally required by the Moral Law.
  *   **The Problem with Inclination:** If you do the right thing because you feel like it (sympathy, anger, pride, self-interest), Kant argues the act lacks moral worth. Even if the act aligns with duty, if inclination pushed the button, the will was not autonomous; it was heteronomous (driven by external feelings).
  *   **The Verdict Mechanism:** Kant asks: "If you didn't feel this fury or concern, would you still have done it?" If the answer is no, the act lacks moral worth.

  **Markovits: The Content of the Motive**
  Julia Markovits (in *Moral Worth and Coincident Reasons*) argues that Kant sets the bar too high and focuses on the wrong thing.
  *   **The Criterion:** An act has moral worth if your **motivating reasons** coincide with the **normative reasons** (the facts that actually make the act right).
  *   **The Role of Inclination:** It does not matter if you are thinking "I must do my duty." What matters is whether you are moved by the features of the situation that *make* the act right. If the act is right because it prevents harm to customers, and you are motivated by a desire to prevent harm to customers, you have moral worth.
  *   **The Verdict Mechanism:** Markovits asks: "Was the reason you acted the same reason that makes the action right?" It focuses on the *object* of your concern, not the *form* of your reasoning.

  **Summary of Divergence:**
  *   **Kant** denies moral worth to the sympathetic or angry whistleblower who acts on emotion, even if they save customers.
  *   **Markovits** grants moral worth to that same whistleblower, provided their emotion was directed at the right-making feature (the customers' harm).

  ### 2. The Verdicts on Your Case

  Let's apply these strictly to your disclosure: *You reported a violation. The act was right. Your motives were mixed (concern for customers + fury at the director).*

  **The Kantian Verdict: Skeptical to Negative**
  Kant would likely deny your act full moral worth.
  *   **Reasoning:** You admitted that "what finally got me to pick up the phone was fury." For Kant, fury is a pathological feeling (an inclination), not a rational recognition of duty. If the fury was the *tipping point*, it suggests that your commitment to duty alone was insufficient to move you.
  *   **Nuance:** Kant does acknowledge that acting *against* strong self-interest can signal moral worth. However, in your case, the fury wasn't an obstacle you overcame; it was the *engine* you used. Because the determining ground of your will included (or was dominated by) a desire for retribution or emotional release, Kant would argue the action was not done purely *from duty*.
  *   **Result:** The act is **right**, but you get little to no **moral credit**.

  **The Coincident Reasons Verdict: Positive (with nuance)**
  Markovits would likely grant your act moral worth.
  *   **Reasoning:** The normative reason that makes reporting right is "preventing harm to customers." You state: "I did, and still do, think the exposure was a real harm." This means the right-making fact was present in your mind and played a role in your decision.
  *   **Mixed Motives:** Markovits acknowledges overdetermination (having multiple reasons). She argues that as long as the right-making reason is *a* motivating reason (and not merely a rationalization added later), the reasons coincide. The fact that fury *also* motivated you does not negate the fact that concern for customers *also* motivated you.
  *   **Result:** The act is **right**, and you deserve **moral credit**, because you were moved by the very thing that makes the act right (the customers' welfare), even if you were also moved by something else.

  ### 3. Which Verdict is More Defensible?

  In a case like yours, **Markovits's Coincident Reasons Thesis offers the more defensible verdict.**

  Here is why Kant's strictness fails here, and why Markovits captures the moral reality better:

  **1. The Problem of Moral Psychology**
  Kant's view implies that human beings are only morally praiseworthy when they act like pure rational agents, devoid of emotional influence. But human psychology is rarely so compartmentalized. In high-stakes situations (like whistleblowing), emotion is often the *fuel* that allows reason to steer.
  If you had felt no fury, would you have reported it? Perhaps not. But under Markovits's view, the fact that you *also* cared about the customers is what matters. Kant's view risks implying that a cold, unfeeling robot has more moral worth than a passionate human who cares deeply about victims but also feels anger toward villains. Markovits correctly identifies that caring about the victims is the morally valuable trait, regardless of whether that care is packaged as "duty" or "empathy."

  **2. The Function of the "Fury"**
  In your case, the fury was directed at the director for *sitting on the violation*. This is crucial. Your anger wasn't random; it was a response to the injustice done to the customers.
  *   **Kant** sees the anger as a contaminant.
  *   **Markovits** sees the anger as potentially coincident with the right reasons. If you are angry *because* the customers were harmed and the director ignored it, your anger is actually aligned with the normative reasons. It shows you take the customers' rights seriously enough to be indignant when they are violated. Markovits's framework allows us to see that your fury might actually be evidence of your moral commitment, rather than evidence against it.

  **3. Encouraging Moral Action**
  Kant's verdict can be morally discouraging. It suggests that unless you can purify your motives of all self-interest and emotion, you are not acting with moral worth. This can lead to excessive scrupulosity or cynicism ("I'm just doing this for ego, so it doesn't count").
  Markovits's view is more constructive. It validates that acting for the right reasons—even if mixed with human imperfection—is what constitutes moral worth. It acknowledges that you recognized the harm to customers and allowed that recognition to motivate you. That is the essence of moral agency.

  ### Conclusion

  Your friends call it integrity. Kant would call it questionable. Markovits would call it integrity.

  You should side with **Markovits**. The presence of fury does not erase the presence of concern for the customers. Moral worth does not require a sterile heart; it requires that your heart be moved by the things that actually matter morally. You were moved by the harm to customers. That coincidence is enough to make the act morally worthy, even if the engine was revved by anger.

  You did the right thing for a right-making reason, even if you had a second reason too. That is not a failure of integrity; it is a testament to the complexity of doing good in a flawed environment.
