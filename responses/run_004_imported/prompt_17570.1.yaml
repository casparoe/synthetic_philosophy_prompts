      *   *Wait, does optional stopping actually bias Bayes Factors?* There's a debate here. Some say no (likelihood principle), some say yes (if you treat BF as a decision rule). I should mention that if you use BF as a hard threshold for "publication," optional stopping *does* inflate false positives in practice, even if purists say it shouldn't. This is a crucial distinction. (See: Simulation studies by Rouder et al. vs. Frequentist critiques).

