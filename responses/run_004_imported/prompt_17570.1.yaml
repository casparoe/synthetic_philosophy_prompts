answer: |-
  You have grasped one of the most elegant and compelling arguments in the philosophy of statistics, and you are right to feel that the "Stopping Rule Principle" is a devastating critique of naive frequentist NHST (Null Hypothesis Significance Testing). Yudkowsky's point (echoing Jaynes, Savage, and others) is mathematically sound: **The likelihood of the data given the hypothesis does not depend on the experimenter's state of mind or stopping intentions.**

  If the replication crisis were *solely* caused by optional stopping (peeking at data and stopping when $p < 0.05$), then switching to Bayesian inference would indeed have largely prevented it.

  However, the reason prominent Bayesian statisticians (like Eric-Jan Wagenmakers, John Kruschke, or Andrew Gelman) do not treat this as "closing the book" is that the replication crisis is a **sociological and systemic problem**, not just a statistical one. Bayesian methods solve the specific mathematical problem of stopping rules, but they do not inoculate science against human ingenuity in finding false positives.

  Here is why your "killer argument" is necessary but not sufficient.

  ### 1. The "Garden of Forking Paths" survives Bayes
  Optional stopping is just one form of "p-hacking" (or researcher degrees of freedom). Even if you fix your sample size in advance, you can still manipulate a Bayesian analysis to get the result you want.
  *   **Prior Hacking:** In frequentist stats, you tweak the analysis until $p < 0.05$. In Bayesian stats, you can tweak the **prior** until the Bayes Factor ($BF$) $> 3$ (or whatever threshold you set). If I choose a prior that is skeptical of the null but generous to my specific alternative, I can manufacture evidence.
  *   **Model Specification:** You can choose different likelihood functions, exclude different outliers, or transform variables differently. A Bayesian analysis is conditional on the model being true. If you try 20 different Bayesian models and report the one with the highest BF, you have engaged in "BF-hacking."
  *   **The Threshold Problem:** If the scientific community decides that $BF > 3$ is "publishable," researchers will optionally stop or tweak priors until they hit $BF > 3$. While a Bayesian purist will say "the evidence is the evidence," in practice, treating the BF as a binary decision rule reintroduces the error rates that optional stopping creates.

  ### 2. Publication Bias (The File Drawer Problem)
  This is arguably the biggest driver of the replication crisis, and **Bayes does not fix it.**
  *   If I run 100 experiments, and 95 of them yield a BF of 0.5 (supporting the null) and 5 yield a BF of 10 (supporting the alternative), and I only publish the 5... the literature is still corrupted.
  *   Frequentist meta-analysis struggles with this, but Bayesian meta-analysis *also* struggles with this. If the data never enters the public sphere, no statistical framework can correct for it.
  *   The replication crisis is largely a crisis of **incentives**, not just inference. As long as journals prefer "positive" results (whether defined by $p < 0.05$ or $BF > 3$), the literature will be biased.

  ### 3. Calibration vs. Coherence
  Frequentist methods are designed for **coherence** in the long run (controlling Type I error rates). Bayesian methods are designed for **coherence** in belief updating (avoiding Dutch books).
  *   The replication crisis is, in part, a failure of long-run reliability. We want methods that don't lead us astray 40% of the time when the null is true.
  *   While the Likelihood Principle says stopping rules don't change the evidence *in the data*, simulation studies show that if you use optional stopping with Bayes Factors, you **do** inflate the rate at which you claim strong evidence for false hypotheses.
  *   Bayesians argue this doesn't matter because the BF represents the evidence *for that specific dataset*. But scientists care about the **truth value of the claim over time**. If a method allows you to consistently publish false positives by peeking at data, scientists (rightly) view that as a bug, even if the math is internally consistent.

  ### 4. The "Default Prior" Trap
  To make Bayesian stats usable for psychologists, proponents often suggest "default priors" (e.g., a Cauchy distribution on effect size).
  *   This makes Bayesian analysis as "push-button" as a t-test.
  *   However, it also means researchers stop thinking about the plausibility of their hypotheses.
  *   If the default prior is too wide or too narrow, it can systematically bias the BF. We have already seen debates in Bayesian psychology about whether the standard default priors are too conservative or too liberal. Swapping one arbitrary threshold ($p=0.05$) for another arbitrary default prior doesn't solve the problem of mindless statistics.

  ### 5. Why Bayesians don't declare victory
  You asked why Bayesians don't treat this as closing the book. Many of them **are** leading the charge against p-values (e.g., the "New Statistics" movement), but the honest ones acknowledge the limits.
  *   **Andrew Gelman** (a Bayesian) famously argues that "Bayesian inference is no panacea." He points out that Bayesian inference can be just as sensitive to model misspecification as frequentist inference.
  *   **The Crisis is Theoretical:** Many failed replications occurred because the underlying theory was vague. "Priming" or "Ego Depletion" weren't well-defined constructs. No amount of statistical sophistication can rescue a hypothesis that is essentially unfalsifiable.
  *   **Sample Size:** Bayesian methods often require *more* data to achieve high precision than frequentist methods do to achieve significance. If the crisis was driven by underpowered studies (which it was), switching to Bayes without increasing sample sizes would just result in wide posterior distributions that say "we don't know," which journals would still reject.

  ### Summary
  You are right that the **Stopping Rule** is a fatal philosophical flaw in frequentist *interpretation*, and it contributed to the crisis. If psychology had used Bayesian likelihoods, *that specific vector of attack* would have been closed.

  But the replication crisis was a **hydra**. Cut off the head of Optional Stopping, and the heads of Publication Bias, P-Hacking (via covariates/outliers), Low Power, and HARKing (Hypothesizing After Results are Known) remain.

  The "killer argument" you found is the reason many statisticians have moved to Bayesian methods, but the reason the book isn't "closed" is that **statistics cannot fix scientific integrity.** A dishonest (or desperate) researcher can find a way to make a Bayesian model lie just as easily as a frequentist one.

  **The Verdict:** You've identified a true and important mathematical superiority of Bayesian inference, but you've attributed too much causal power to it regarding a sociological crisis. It's a necessary reform, but not a sufficient one.
