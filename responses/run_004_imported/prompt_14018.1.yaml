  Let's interpret it as: "Each should raise the specific difficulty that their own theory faces, and ask the other how *their* theory handles it better." This forces them to confront their own weaknesses.
  *Alternative Interpretation:* "Press the other [philosopher] with [an argument/case]... [that is] hardest for their own [the speaker's] view."
  Actually, the most logical philosophical exchange is: "I will raise the objection that hurts *me* the most, to see if you can make sense of it better than I can."
