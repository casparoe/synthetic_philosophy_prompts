  Okay, I will write it such that Elena raises a scenario that threatens *Agency Theory* and asks Marcus to explain it. Marcus raises a scenario that threatens *Transparency Theory* and asks Elena to explain it. This ensures they aren't just restating positions but grappling with the limitations of their own frameworks.

