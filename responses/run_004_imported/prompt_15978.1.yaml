answer: |-
  This is one of the most sophisticated debates in the philosophy of biology. To understand why two camps can agree on the algebra but disagree on the reality, you have to distinguish between **bookkeeping** and **mechanism**.

  Here is the gut-level explanation of why the Price Equation doesn't settle the argument, and what the fight is actually about.

  ### 1. The Math is a Receipt, Not a Recipe
  The Price Equation is an **identity**. It is mathematically guaranteed to be true, like saying `Profit = Revenue - Costs`.

  If a business makes a profit, that equation is true. But the equation doesn't tell you *how* the profit was made. Did you make money because you sold a million widgets (individual effort)? Or because you monopolized the market and raised prices for everyone (group/structural effect)?

  *   **The Math:** The Price Equation partitions the total change in a trait into a "Between-Group" term and a "Within-Group" term.
  *   **The Limit:** It is a post-hoc description of variance. It tells you how the numbers are distributed, but it does not tell you **what caused the numbers to move.**

  Both Sober/Wilson and Kerr/Godfrey-Smith agree on the receipt. They disagree on the story of how the money was earned.

  ### 2. The Lifeboat Analogy
  Imagine a fleet of lifeboats drifting at sea. Some people are "Rowers" (altruists who tire themselves to move the boat); some are "Shirkers" (selfish individuals who rest).

  *   **Within-Group:** In any single boat, Shirkers conserve energy and out-survive Rowers. (Individual selection favors Shirkers).
  *   **Between-Group:** Boats with more Rowers move faster to rescue ships and save everyone on board. Boats with all Shirkers drift and starve. (Group selection favors Rowers).

  The Price Equation will show a positive "Between-Group" term.

  **The Individualist Critique (Kerr/Godfrey-Smith):**
  They look at the survivors and say: "There is no such thing as 'Boat Survival.' There are only **individuals** who happened to be located next to Rowers. Your fitness depended on your neighbors' traits. We can model this perfectly using 'contextual analysis' (individual fitness as a function of individual trait + neighborhood average). We don't need to imagine the Boat as an entity that lives or dies. The 'Group Term' is just a statistical artifact of individuals clustering."

  **The MLS Defense (Sober/Wilson):**
  They look at the survivors and say: "The mechanism of survival was the **Boat**. If you put a Rower in a boat of Shirkers, he dies. If you put a Shirkers in a boat of Rowers, he lives. The unit that faced the filter of selection was the Boat. The individuals are just passengers. The 'Group Term' represents a distinct causal force: the differential extinction of collectives."

  ### 3. The "Ghost in the Machine" Problem
  The core disagreement is **Ontological**: *What are the actual vehicles of selection?*

  The math allows you to slice the population however you want. I could partition the population by "people wearing red shirts" vs. "people wearing blue shirts." The Price Equation would give me a "Between-Color-Group" term.

  *   **Critics argue:** Just because you *can* partition the variance by shirt color doesn't mean "Shirt Color Groups" are causal agents. It's just a description. They claim MLS theorists are making the same mistake with biological groups. They are reifying a statistical cluster into a causal agent.
  *   **Proponents argue:** Biological groups (like colonies, organisms, or stable social units) are different from shirt colors because they have **mechanisms of cohesion and reproduction**. A termite mound isn't just a cluster of termites; it's a structure that persists and "reproduces" (swarms).

  The math cannot tell the difference between a "real" group (a termite mound) and an "arbitrary" group (people wearing red shirts). Both will generate a Between-Group covariance term. Therefore, the math alone cannot prove group selection is real.

  ### 4. Is it Empirical or Terminological?
  This is the crux of your second question. Is this just a fight over words, or can we test it?

  **It is primarily terminological/ontological, but with empirical constraints.**

  *   **Terminological:** If you define "selection" strictly as "differential reproduction of genetic lineages," then individual selection is the only game in town, because genes reside in individuals. Group selection becomes a metaphor for "individual selection in a social context."
  *   **Empirical:** However, the dispute becomes empirical when we ask: **Do groups reproduce?**

  David Hull and Peter Godfrey-Smith (ironically, a critic of simple MLS) suggest the way to settle this is to look for **Darwinian Populations**.
  *   If the "groups" themselves vary, reproduce (split/fission), and inherit traits, then they are genuine Darwinian individuals. In this case, MLS is empirically distinct. (Example: Multicellular organisms evolving from single cells).
  *   If the "groups" form and dissolve every generation without a mechanism of group-level heredity, then the "Between-Group" term is just a description of individual context. (Example: Random clusters of beetles).

  **The "Parameter Sensitivity" Argument:**
  Godfrey-Smith argues that individual-level models are more **robust**. You can tweak the parameters of an individual-selection model, and it still predicts the outcome. MLS models often require specific, fragile conditions (low migration, high group extinction) to work. He argues we should prefer the robust causal model (individual) over the fragile one (group) unless there is overwhelming evidence for group heredity.

  ### 5. Summary: What is left to disagree about?
  They are disagreeing about **Causal Granularity**.

  *   **The Critics** want the finest grain: The gene/individual is the only place where the causal machinery of replication physically exists. Everything else is "environmental context."
  *   **The Proponents** want a coarser grain: If a collection of individuals acts as a single bottlenecked unit (like a body or a hive), treating it as one causal unit is more explanatory, even if it's made of parts.

  **Can it be adjudicated?**
  Not by the Price Equation. It can only be adjudicated by looking at the **biology of the specific case**.
  *   If you are studying human cultural evolution where "groups" are fuzzy and porous, the Individualist critique holds strong (it's just network effects).
  *   If you are studying the evolution of the first multicellular organisms, where cells became locked into a single reproductive bottleneck, the MLS view is empirically necessary (the cell cluster became the individual).

  **The Gut Check:**
  The Price Equation is a scale. It weighs the contribution of different factors.
  The debate is about whether the weight on the "Group" side of the scale represents a **distinct engine** pushing the car, or just the **friction** caused by the passengers sitting in specific seats. The scale tells you how much weight is there; it doesn't tell you if it's an engine or friction. You have to pop the hood (examine the mechanism of reproduction) to find out.
