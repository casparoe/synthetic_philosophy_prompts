      *   *The Math:* It's an identity. It's always true. It partitions variance/covariance.
      *   *The Philosophy:* Causality vs. Description. Does a statistical correlation imply a causal mechanism?
      *   *Analogy Time:* I need a strong analogy to make this "gut-level."
