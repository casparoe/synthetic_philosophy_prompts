      *   *The Crux:* If I survive because my group survives, is that group selection? Or did I just happen to be in a good spot (individual selection context-dependent)?
      *   *Kerr & Godfrey-Smith's Point:* You can model everything as individuals interacting. "Group" is just a label for a set of neighbors.
      *   *Sober & Wilson's Point:* If the group entity has properties that affect fitness *over and above* the individuals, it's a distinct level.

  3.  **Drafting the Explanation - Step-by-Step:**

