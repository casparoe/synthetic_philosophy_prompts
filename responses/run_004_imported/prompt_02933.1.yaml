answer: |-
  This is an excellent question that cuts to the heart of one of the most famous tensions in the philosophy of language. You have identified a genuine pressure point in Lewis's work, but the consensus among scholars is that this is not a self-refutation. Rather, it reflects Lewis's **pluralistic** approach to conditionals: he treats *indicative* conditionals and *counterfactual* (subjunctive) conditionals as semantically distinct species that obey different rules.

  To see why Lewis (1976) does not refute Lewis (1973), we need to disentangle three specific components: the **Triviality Result**, the **Ramsey Test/Adams' Thesis**, and the **Propositional Status** of conditionals.

  ### 1. The Triviality Result's Two Assumptions
  Lewis's 1976 proof ("Probabilities of Conditionals and Conditional Probabilities") demonstrates that a specific combination of assumptions leads to absurdity (triviality). The proof shows that you cannot simultaneously hold the following two claims for *any* conditional connective ($\to$):

  1.  **Propositionality:** The conditional $A \to B$ expresses a proposition (i.e., it has truth conditions and denotes a set of possible worlds).
  2.  **Adams' Thesis (The Probability Equation):** The probability of the conditional equals the conditional probability: $P(A \to B) = P(B|A)$.

  Lewis's conclusion in 1976 is: **You can have one, but not both.**

  ### 2. Lewis's Split Strategy
  Lewis avoids contradiction by applying different solutions to different types of conditionals.

  #### A. Indicative Conditionals (The 1976 Target)
  When philosophers like Ernest Adams or Frank Ramsey discussed conditionals in the context of probability (e.g., "If Oswald didn't shoot Kennedy, someone else did"), they were discussing **indicatives**.
  *   **Lewis's 1976 View:** For indicatives, Lewis wants to preserve **Adams' Thesis** (Claim 2 above). He agrees that our credence in "If A, B" should match $P(B|A)$.
  *   **The Cost:** To avoid triviality, he must deny **Propositionality** (Claim 1). Lewis argues that indicative conditionals **do not express propositions**. They do not have truth conditions in the standard sense; they are not sets of worlds. They are instead assertions of conditional probability.
  *   **Result:** Since indicatives aren't propositions, the triviality proof (which assumes the conditional is a proposition that can be an argument for $P$) does not apply to them in a way that forces triviality.

  #### B. Counterfactual Conditionals (The 1973 Target)
  In *Counterfactuals* (1973), Lewis is discussing **subjunctives** (e.g., "If Oswald *had not* shot Kennedy, someone else *would have*").
  *   **Lewis's 1973 View:** For counterfactuals, Lewis wants to preserve **Propositionality** (Claim 1). He explicitly provides truth conditions using closest possible worlds. A counterfactual is true at a world $w$ if $B$ holds in all the closest $A$-worlds to $w$. Thus, it denotes a set of worlds.
  *   **The Cost:** To avoid triviality, he must deny **Adams' Thesis** (Claim 2). Lewis explicitly rejects the idea that $P(A \boxright B) = P(B|A)$ for counterfactuals.
  *   **Result:** Since counterfactuals do not obey the probability equation, the triviality proof does not force the probability space to collapse.

  ### 3. Why the 1973 Semantics Doesn't Imply the Probability Equation
  Your confusion likely stems from the intuition that the "closest world" analysis *should* yield the conditional probability. After all, if we look at the "closest" $A$-worlds, aren't we looking at the most probable $A$-worlds?

  Lewis says **no**. The similarity ordering of worlds is not identical to the probability distribution.

  **Consider this example:**
  Imagine a fair coin is sitting on the table, untossed.
  *   **Proposition A:** I toss the coin.
  *   **Proposition B:** The coin lands heads.
  *   **Conditional Probability:** $P(B|A) = 0.5$.

  Now consider the counterfactual: **"If I had tossed the coin, it would have landed heads."** ($A \boxright B$)

  *   **Lewis's 1973 Analysis:** In the closest worlds where I toss the coin, the laws of nature and the physical setup are the same. Since the coin is fair, in *some* of those closest worlds it lands heads, and in *others* it lands tails. Therefore, it is **false** that it *would* land heads in all closest worlds. The counterfactual is false.
  *   **The Probability:** Since the counterfactual is false (given the actual world's facts), the probability that the counterfactual is true is 0 (or very low).
  *   **The Mismatch:** $P(A \boxright B) \neq P(B|A)$. (0 $\neq$ 0.5).

  Lewis accepts this mismatch. He argues that while the *indicative* "If I toss it, it will land heads" is inappropriate to assert (because our credence is only 0.5), the *counterfactual* "If I had tossed it, it would have landed heads" is simply false. For Lewis, the probability of a counterfactual is the probability that the actual world is situated such that the closest $A$-worlds are $B$-worlds. This is a complex function of the probability distribution over similarity orderings, not simply $P(B|A)$.

  ### 4. Summary of the Resolution
  You can visualize Lewis's position as a matrix where the Triviality Result forbids checking both boxes in a single row:

  | Conditional Type | Expresses a Proposition? (1973/76) | Obeys $P(\text{If}) = P(|)$? (Adams' Thesis) | Status |
  | :--- | :--- | :--- | :--- |
  | **Indicative** | **No** (1976) | **Yes** (roughly) | Safe from triviality (not a proposition). |
  | **Counterfactual** | **Yes** (1973) | **No** (1976) | Safe from triviality (fails the equation). |

  ### Conclusion
  Lewis is not refuting himself; he is drawing a boundary line.
  1.  **1973** establishes that counterfactuals have truth conditions (propositions) based on world similarity.
  2.  **1976** establishes that *no* propositional conditional can satisfy the Ramsey/Adams probability equation.
  3.  **Synthesis:** Therefore, counterfactuals (being propositional) *cannot* satisfy the Ramsey/Adams probability equation. Lewis is perfectly happy to accept this. He reserves the probability equation for indicatives, which he argues are *not* propositions.

  Your reasoning went wrong only in assuming that the possible-worlds semantics of 1973 was intended to capture the same probabilistic intuitions as the Ramsey Test targeted in 1976. Lewis argues they capture different linguistic phenomena that require different logical treatments.

  **Suggested Follow-up Reading:**
  If your seminar allows, look at Lewis's paper **"Do We Believe in the Ramsey Test?"** (or his discussion in *Philosophical Papers, Vol. II*). He explicitly addresses the relationship between the two accounts there. Also, **Alan Hájek's** "Probabilities of Conditionals" provides a great overview of how later philosophers have tried to bridge this gap Lewis left open.
