answer: |-
  Your teammate is wrong, and your intuition is right. This is a well-documented phenomenon in psychology and cognitive science.

  What you are experiencing is the difference between **competence** (actually having the information in your brain) and **metacognition** (your brain's assessment of whether it has that information).

  Here is the breakdown of why you can "know" something without feeling like you know it, and why your teammate's logic has a major hole in it.

  ### 1. Storage vs. Retrieval
  Think of your brain like a computer hard drive.
  *   **Storage:** The file (the answer) is saved on the drive.
  *   **Retrieval:** The search bar finds the file and opens it.
  *   **Metacognition:** The little loading bar that tells you how confident the computer is that it found the right file.

  In quiz bowl, under high pressure, the **file is definitely on the hard drive** (because you eventually said the correct answer). However, the **loading bar (your confidence)** was glitching. Stress, adrenaline, and speed can disrupt the signal between "I have accessed this memory" and "I feel sure about this memory."

  You possessed the knowledge (storage), but the *feeling* of knowing (metacognition) lagged behind or was suppressed by anxiety.

  ### 2. Dispositional vs. Occurrent Knowledge
  Philosophers distinguish between two types of knowing:
  *   **Occurrent Knowledge:** You are actively thinking about the fact right now (e.g., "I am currently thinking that Paris is the capital of France").
  *   **Dispositional Knowledge:** You aren't thinking about it right now, but if asked, you would say it (e.g., You weren't thinking about your phone number until I asked, but you "knew" it).

  In quiz bowl, you often operate in a gap between these two. When you buzzed late, you had **dispositional knowledge**. The neural pathway existed. The fact that you could articulate the answer proves the knowledge was there. Your teammate is arguing that unless it was *occurrent* (accompanied by a feeling of certainty), it wasn't knowledge. That is incorrect. If you can produce the answer, you knew it.

  ### 3. The "Feeling of Knowing" is Fallible
  Psychologists study something called the **Feeling of Knowing (FOK)**. It is a heuristic (a mental shortcut), not a truth meter.
  *   **False Negatives (Your experience):** You have the info, but your FOK is low. This is common in high-stakes environments. Your brain is prioritizing speed and threat detection (adrenaline) over confidence calibration.
  *   **False Positives (Your other experience):** You feel 100% sure but are wrong. This is often due to familiarity. You recognize the *context* of the clue (e.g., "This sounds like a Hemingway question") and your brain fills in the answer with high confidence, even if the specific detail is wrong.

  If confidence were required for knowledge, the "False Positive" scenario would be impossible. The fact that you can be **sure and wrong** proves that confidence and knowledge are separate variables. Therefore, you can also be **unsure and right**.

  ### 4. Why Quiz Bowl Exacerbates This
  Quiz bowl is unique because it punishes hesitation.
  *   **System 1 vs. System 2:** Daniel Kahneman's *Thinking, Fast and Slow* describes System 1 (intuitive, fast) and System 2 (analytical, slow).
  *   In quiz bowl, you often need System 1 to buzz. Sometimes System 1 recognizes the pattern and triggers your hand to buzz before System 2 has finished generating the "confidence signal."
  *   By the time you finish speaking the answer, System 2 catches up and says, "Oh yeah, that's right." But the buzz happened in that gap.

  ### The Verdict
  Your teammate is conflating **access** with **awareness of access**.

  *   **Did you know it?** Yes. Evidence: You said the correct answer.
  *   **Did you feel like you knew it?** No. Evidence: You thought you were guessing.

  The fact that the feeling wasn't there doesn't erase the neural connection that allowed you to speak the truth. In fact, many top quiz bowl players train themselves to **ignore the feeling of certainty** and trust their recognition speed instead. If you recognize the clue, you buzz. If you wait for the "feeling of knowing," you will often be too slow.

  **Advice for your next tournament:**
  Trust the "unsure" buzzes more. Your brain is often retrieving the answer faster than your conscious mind can validate it. If you recognize the clue, buzz. The fact that you got it right afterwards proves your training is working, even if your confidence meter is lagging.
