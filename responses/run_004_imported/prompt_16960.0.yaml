answer: |-
  This is an excellent term paper topic, and your TA's hesitation is likely a pedagogical guardrail (i.e., "don't pretend you can read Douglass's mind") rather than a genuine judgment on the viability of the argument. You are not being asked to channel Douglass's ghost; you are being asked to test the **internal consistency and extensibility of his hermeneutic framework.**

  Can you reconstruct a determinate argument? **Yes.**
  Does the framework run out? **Only at the point of policy enforcement, not constitutional interpretation.**

  Here is a roadmap for how to build this argument without falling into the "generic guesswork" trap, using the specific Douglassian tools you identified.

  ### 1. The Glasgow Hermeneutic: The Presumption of Liberty
  The core of your paper should rest on how Douglass's 1860 shift in Glasgow wasn't just about slavery; it was a theory of **constitutional interpretation.**

  *   **The Rule:** In *The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?* Douglass argues that when the text is silent or ambiguous, the interpreter must default to the Preamble's stated goals ("secure the blessings of liberty") rather than the secret intentions of the framers or the corrupt practices of the courts.
  *   **Application to 14th Amendment:** The text says "born... in the United States, and subject to the jurisdiction thereof." It does *not* say "born to citizens" or "born to legal residents."
  *   **The Douglassian Move:** A modern restrictionist argument relies on "framers' intent" (e.g., "They didn't mean *these* kinds of immigrants") or "administrative practice" (e.g., "We haven't always enforced it this way"). Douglass explicitly rejected both of those in 1860 regarding slavery. He would argue that if the text does not explicitly exclude the child of an undocumented immigrant, the **Presumption of Liberty** dictates they are included. To exclude them requires reading a restriction into the text that isn't there, which is exactly what pro-slavery forces did with the fugitive slave clauses.

  ### 2. Defining "Jurisdiction": Allegiance vs. Status
  This is the strongest point of determinacy in your argument. The current legal fight hinges on the phrase "subject to the jurisdiction thereof." Restrictionists argue this implies "full political allegiance," which undocumented parents supposedly lack.

  *   **Douglass's Precedent:** Douglass spent his life arguing that Black people were *always* subject to the jurisdiction of the U.S. (punishable by laws, bound by contracts) even when they were denied rights. He argued that **subjection to law constitutes jurisdiction.**
  *   **The Argument:** In *Composite Nation*, Douglass argues that rights stem from personhood and presence, not racial lineage. If an undocumented immigrant is punishable under U.S. criminal law (which they are), they are "subject to the jurisdiction."
  *   **The Historical Exception:** The 1866 Civil Rights Act (which Douglass championed and which informed the 14th Amendment) excluded "Indians not taxed." Why? Because they were members of sovereign tribal nations. Douglass understood "jurisdiction" to mean "not owing allegiance to a foreign sovereign." Undocumented immigrants are not sovereign entities; they are individuals subject to U.S. law. Douglass would likely argue that trying to create a new category of "non-jurisdictional persons" within the borders is a revival of the *Dred Scott* logic (creating a class of people present but outside constitutional protection).

  ### 3. The "Composite Nation" and the Source of Rights
  You need to be careful here not to conflate *immigration policy* with *citizenship*. Douglass did believe the federal government had the power to regulate who enters (naturalization/immigration).

  *   **The Distinction:** In *Composite Nation*, Douglass argues against exclusionary laws (like the Chinese Exclusion Act). But his deeper point is that once a person is on the soil, the source of their rights is **natural law**, confirmed by the Constitution, not a gift from the state.
  *   **The Determinate Answer:** For Douglass, birthright citizenship isn't a privilege the state grants; it's a recognition of a pre-existing fact of presence and subjection to law. To deny it is to claim the state has the power to create a hereditary caste of non-citizens within its own borders. Given his life's work dismantling the hereditary caste of slavery, his framework compels him to view birthright citizenship as a bulwark against caste.

  ### 4. Where the Framework "Runs Out" (The Nuance)
  To satisfy your TA and show critical depth, you must identify where Douglass's 19th-century framework hits a limit. This is where you avoid "guessing."

  *   **Enforcement vs. Right:** Douglass might support birthright citizenship (the right) while simultaneously arguing for strict enforcement of immigration laws (the entry). He was a staunch believer in the "rule of law." He might argue: "The child is a citizen (Glasgow text), but the parent entered in violation of sovereign law (Composite Nation sovereignty)."
  *   **The Tension:** Modern birthright citizenship debates often conflate the two. Douglass's framework allows him to separate them. He could theoretically argue that the 14th Amendment protects the child *precisely because* the Constitution protects the innocent from the sins of the parents (a very Christian/Republican virtue he often cited), while maintaining that the state has the right to control borders.
  *   **The Limit:** We cannot know how Douglass would weigh the *political consequences*. Would he fear that birthright citizenship for undocumented children would fuel nativism that threatens Black citizenship? (He was often wary of coalitions that might dilute Black political power). This is the speculative zone. But on the *constitutional question*, his text-based method is clear.

  ### Thesis Suggestion
  > "While Frederick Douglass left no explicit record on the 14th Amendment's application to undocumented immigration, his Glasgow hermeneutic—specifically the rejection of 'framers' intent' in favor of the text's liberty-securing purpose—combined with his definition of jurisdiction as subjection to law rather than political status, compels a defense of birthright citizenship. However, applying this framework reveals a tension in Douglass's thought between universal natural rights and the sovereign power to regulate entry, suggesting he would defend the child's citizenship while potentially upholding strict border enforcement."

  ### Why This Works for a Seminar Paper
  1.  **It treats Douglass as a theorist, not a mascot.** You aren't saying "Douglass was nice, so he'd be nice." You are saying "Douglass used Method X; Method X applied to Problem Y yields Result Z."
  2.  **It addresses the TA's concern.** You acknowledge the speculative element (the "running out" point) but contain it to policy preferences, keeping the constitutional interpretation rigorous.
  3.  **It uses the syllabus.** It ties the Glasgow speech (interpretive method) directly to *Composite Nation* (universalism) and the 14th Amendment (legal text).

  **Verdict:** Go for it. It's a sophisticated way to engage with political theory: testing whether a thinker's *methodology* survives the historical context they lived in.
