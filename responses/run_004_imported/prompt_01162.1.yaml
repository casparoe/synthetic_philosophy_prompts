      *   **Round 3: The Epistemic Objection (The Bonus Point).**
          *   Elena pounces: How do soldiers know? Propaganda, secrecy. If MEC is false, we condemn confused kids.
          *   Marcus concedes some ground: Invincible ignorance might excuse *blame*, but it doesn't change the *right* to kill. (Distinction between liability and culpability).
      *   **Round 4: Law vs. Morality (The Bonus Point).**
