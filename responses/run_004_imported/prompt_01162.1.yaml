prompt: |-
  So we breifly covered just war theory in my philosophy elective and the teacher mentioned this thing called the "moral equality of combatants" - basically the standard view (Walzer's version) that soldiers on both sides have equal rights to kill each other in battle no matter which side actually has the just cause, since jus in bello is supposed to be totally seperate from jus ad bellum. I went down a rabbit hole after class and found out theres a whole "revisionist" camp (McMahan and those guys) who think thats wrong, because an unjust combatant cant have a right to kill someone whos justly defending against him — kinda like how an aggressor in a self-defense case doesnt get to claim he was defending himself when the victim fights back. Could you write me a dialogue where a Walzer-style defender of MEC and a McMahan-style revisionist actually go back and forth on this? Neither one should be a strawman, i want them actually responding to each others specific points instead of just repeating their own side's talking points. Bonus if it gets into the epistemic argument about soldiers not always being able to know which side is really just, and whether MEC might still be worth keeping as a legal rule even if its not literally true as a matter of deep morality.
