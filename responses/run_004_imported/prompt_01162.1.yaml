  1.  **Analyze the Request:**
      *   **Topic:** Just War Theory, specifically the "Moral Equality of Combatants" (MEC).
      *   **Characters:**
          *   *Walzer-style Defender:* Supports MEC (traditional view). Believes *jus in bello* (conduct in war) is independent of *jus ad bellum* (reason for war). Soldiers on both sides have equal rights/permissions to fight.
          *   *McMahan-style Revisionist:* Rejects MEC. Believes moral liability depends on the justice of the cause. Unjust combatants are essentially murderers/aggressors; just combatants are defending themselves/others.
      *   **Requirements:**
          *   No strawmen (both sides must be strong, nuanced, and responsive).
          *   Specific engagement (responding to points, not just monologuing).
          *   Bonus content: Epistemic argument (soldiers can't know the truth) and the distinction between deep morality vs. legal/pragmatic rules.
      *   **Format:** Dialogue.

  2.  **Character Conception:**
      *   *Defender (Let's call her Elena):* Pragmatic, focused on the reality of war, the role of the state, and the protection of soldiers from retrospective judgment. Values the separation of *ad bellum* and *in bello*.
      *   *Revisionist (Let's call him Marcus):* Analytic, focused on individual moral liability, consistency with ordinary morality (self-defense), and the danger of legitimizing unjust killing.

  3.  **Key Arguments to Cover:**
      *   **MEC Core:** Soldiers are instruments of the state; they don't make policy. Therefore, they are moral equals.
      *   **Revisionist Core:** Killing requires justification. If the cause is unjust, the killing is wrongful. You can't have a right to kill someone who is stopping you from doing wrong.
      *   **Epistemic Problem:** Soldiers often can't know if their war is just. If MEC is false, are they morally culpable for fighting in an unjust war they *thought* was just?
      *   **Law vs. Morality:** Even if MEC is morally false, is it legally necessary to prevent war crimes and encourage surrender?

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A coffee shop or office hours vibe. Establish the core disagreement immediately.
      *   **Round 1: The Core Intuition.**
