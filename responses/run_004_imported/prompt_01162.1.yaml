answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two philosophy students, ELENA and MARCUS, are clearing away empty cups. Elena leans back, arms crossed. Marcus is leaning forward, tapping a pen against his notebook.*

  **Marcus:** So, you still look unconvinced. You're sticking with Walzer?

  **Elena:** I am. Look, I get the intuition behind the revisionist view. It feels clean. If I'm a burglar breaking into your house, and you shoot me in self-defense, I don't get to claim I was "defending myself" against your bullet. I'm the aggressor. You're saying war is just scaled-up self-defense.

  **Marcus:** Exactly. It's about moral liability. If a soldier is fighting for an unjust cause—say, aggressive expansion—he's essentially participating in a massive wrongful harm. He doesn't have a right to kill the people trying to stop him. To say he *does* have that right is to say morality just... stops at the border.

  **Elena:** But that's where the analogy breaks down. The burglar knows he's breaking the law. He knows he's in the wrong. A conscripted soldier in 1940 doesn't necessarily know if his nation's cause is just. He's handed a uniform, told his country is under threat, and thrown into the fog. If you deny the Moral Equality of Combatants (MEC), you're telling that soldier he's morally indistinguishable from a murderer before he even fires a shot.

  **Marcus:** I'm not saying he's *culpable* in the sense of being blameworthy. There's a difference between liability and culpability. But let's be precise: if his cause is unjust, he is *liable* to be killed. The just combatant isn't committing a wrong by killing him. If MEC is true, you're saying the unjust combatant has a *right* to kill the just defender. That's the bullet I can't swallow. How can I have a right to kill someone who is merely defending their children from my invasion?

  **Elena:** Because the soldier isn't the author of the invasion. He's an instrument. Walzer's point is about the separation of spheres. *Jus ad bellum* is for statesmen and leaders. *Jus in bello* is for the guys in the mud. If we tie the rights of the soldier to the justice of the cause, we make every act of war a retrospective trial. You can't fight effectively if you're constantly wondering, "Am I on the right side of history today?"

  **Marcus:** But "fighting effectively" isn't a moral argument, Elena. It's a pragmatic one. Morality shouldn't care about military efficiency. If the truth is that unjust combatants are doing wrong, we shouldn't lie about it just to make them feel better.

  **Elena:** It's not about feelings! It's about the structure of responsibility. In a democracy, or even a non-democracy, the citizen-soldier surrenders their judgment to the state. That's the social contract. If the state commits a crime, the state pays the price, not the tool it used. If you strip unjust combatants of their combatant privilege, you're essentially saying it's permissible to execute them if they surrender. Because if they have no right to fight, they have no right to be soldiers.

  **Marcus:** Whoa, slow down. Rejecting MEC doesn't mean we execute POWs. It just means we acknowledge that the *killing* on the battlefield isn't symmetrical. But okay, let's talk about surrender. If an unjust combatant lays down arms, he's no longer a threat. He regains his immunity. That's standard self-defense logic. You only kill when necessary.

  **Elena:** Fine, but here's the epistemic wall you're hitting. You assume we can know who is unjust. In real time? We can't. Propaganda, classified intel, historical context—it's murky. If MEC is false as a moral principle, then thousands of soldiers are walking around with blood on their hands they didn't know they were spilling.

  **Marcus:** I've heard this. The "Invincible Ignorance" argument. Look, I'll grant you this: if a soldier genuinely, reasonably believes his cause is just, he might be *excused*. He's not a villain. But an excuse isn't a justification. If I accidentally shoot you because I thought you were holding a gun, I'm not a murderer, but you're still dead, and I didn't have a *right* to shoot. MEC claims they have a *right*. I'm saying they don't have the right, they might just lack the blame.

  **Elena:** That is a incredibly fine distinction to make on a battlefield. And it leads to my next point: The Law of War. Even if you're right about "deep morality"—which I'm not conceding—MEC is essential for international law. We need rules that both sides can follow *during* the conflict. If the "Just" side knows they have superior moral rights, they might feel entitled to ignore *jus in bello*. "Oh, they're unjust aggressors, so we don't need to treat their POWs nicely," or "We can use disproportionate force because we're in the right."

  **Marcus:** That's a fair concern. The "moral license" problem. If just combatants think they're morally superior, they might commit war crimes. But Walzer's solution creates the opposite problem: it lets unjust combatants off the hook too easily. It creates a culture where "I was just following orders" carries too much moral weight. It sanitizes aggression.

  **Elena:** It sanitizes war enough to keep it from becoming total extermination. That's the trade-off. By treating soldiers as equals, we encourage them to follow the rules of engagement. If you tell the unjust soldier, "You have no rights, you are morally liable to be killed like a dog," why would he ever surrender? Why would he follow the Geneva Convention? He's already condemned. MEC gives him an incentive to fight *cleanly*, regardless of the cause.

  **Marcus:** So you're arguing for MEC as a useful legal fiction?

  **Elena:** I'm arguing for it as a necessary convention. Maybe, in the eyes of God or a perfect moral calculator, you're right. Maybe the unjust attacker has no right to kill. But we aren't gods. We're humans building a system to limit horror. If the revisionist view undermines the incentive for unjust soldiers to abide by *jus in bello*, then the revisionist view costs more lives.

  **Marcus:** I see the pragmatic force of that. I really do. McMahan actually addresses this. He suggests we might need a two-tiered system. In "deep morality," MEC is false. Unjust combatants are liable. But in the "laws of war," we keep MEC because of the epistemic problems and the incentive to surrender you mentioned.

  **Elena:** Exactly! So why fight so hard to change the moral intuition? If the law stays the same, why does it matter if philosophy students think soldiers are moral equals?

  **Marcus:** Because the law follows morality eventually. If we accept that soldiers are just "instruments," we stop holding nations accountable for the wars they start. We normalize the idea that killing in war is a neutral act. It's not neutral. It's tragic. And by calling it "equal," we obscure the tragedy of the unjust war. I want the moral theory to be true, even if the law has to be pragmatic. We shouldn't lie about the morality just because the truth is messy.

  **Elena:** But calling the unjust soldier a "wrongdoer" while he's being shelled... that's not just a description, Marcus. It's a judgment that affects how we treat veterans, how we process guilt, how we rebuild peace. If we want peace, we need to be able to look the other side in the eye after the war and say, "We were both soldiers doing a job." If we say, "We were defenders, you were aggressors," the war never really ends.

  **Marcus:** *Pauses, tapping the pen slowly.* That's the reconciliation argument. I haven't heard that put quite that way. You're saying MEC is a post-war necessity, not just an in-war rule.

  **Elena:** I'm saying it's the only way to stop the cycle. If every war ends with one side being declared morally liable for every bullet fired, vengeance becomes the only logical response.

  **Marcus:** Okay. I can see that. But I still worry... if we accept MEC too readily, we make it too easy to start wars. Leaders know their soldiers won't bear the moral burden. It privatizes the profit and socializes the sin.

  **Elena:** Then hold the leaders accountable. Punish the generals, the politicians. But leave the rifleman out of it.

  **Marcus:** *Sighs.* I think we might be at an impasse. You're prioritizing the stability of the international order and the protection of the individual soldier. I'm prioritizing the consistency of individual moral responsibility.

  **Elena:** And you're worried that my view makes war too clean.

  **Marcus:** And you're worried my view makes peace impossible.

  **Elena:** *Smiles slightly.* Sounds like we both agree war is hell. We just disagree on whether the people in it are equal sinners.

  **Marcus:** I'll drink to that. But I'm still grading your paper hard on the liability distinction.

  **Elena:** *Laughs.* Fair enough. Just don't claim you had a right to crush my arguments.

  **Marcus:** Touché.
