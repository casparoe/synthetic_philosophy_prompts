      *   *Interpretation B (Prioritization/Conflict of Duties):* Honesty is a universal good, but Filial Piety (*Xiao*) is the root of all virtue. If you damage the root, the tree dies. Therefore, protecting the root is the "straighter" path in a consequentialist or hierarchical sense.
      *   *Interpretation C (Emotional Authenticity):* *Zhi* implies spontaneity and genuine feeling. A son naturally loves his father. To testify against him is artificial/forced. To protect him is the authentic emotional response. Thus, *zhi* is authenticity.

