      *   **Core Question:** Why does Confucius locate *uprightness* (直，*zhi*) *in* the concealment? Is it a redefinition of virtue based on role ethics (no independent standard of honesty), or is it a prioritization of loyalties within a universal framework (honesty exists, but family loyalty comes first)?
