answer: |-
  You have hit on one of the most profound tensions in economics and decision theory. Your intuition is correct: Good's Theorem is mathematically sound *within its specific assumptions*, but those assumptions exclude a massive class of real-world interactions—specifically, strategic interactions involving risk-sharing.

  The phenomenon you are looking for is known as the **Hirshleifer Effect** (named after economist Jack Hirshleifer, 1971). It describes how public information can destroy risk-sharing opportunities, making everyone ex-ante worse off.

  Here is the specific, worked-out example you asked for, followed by the precise dissection of where Good's Theorem breaks.

  ### The Example: The Rain-Share Insurance Market

  **The Setup**
  Imagine two farmers, Alice and Bob. They are both rational expected-utility maximizers with identical concave utility functions (they are risk-averse). Let their utility function be $U(w) = \sqrt{w}$, where $w$ is wealth.

  There are two possible states of the world, occurring with equal probability (50% each):
  1.  **Rain:** Alice's crop is worth $\$100$, Bob's is worth $\$0$.
  2.  **Shine:** Alice's crop is worth $\$0$, Bob's is worth $\$100$.

  **Scenario 1: Ignorance (No Information)**
  Alice and Bob must decide whether to trade *before* they know the weather. They do not know if it will be Rain or Shine.
  *   **Endowment:** Each faces a lottery: 50% chance of $\$100$, 50% chance of $\$0$.
  *   **Expected Utility without trade:** $0.5\sqrt{100} + 0.5\sqrt{0} = 5$.
  *   **The Deal:** Because their risks are perfectly negatively correlated, they can agree to pool their crops and split the proceeds 50/50 regardless of the weather.
  *   **Outcome:** Total wealth is always $\$100$. They each get $\$50$ for sure.
  *   **Expected Utility with trade:** $\sqrt{50} \approx 7.07$.
  *   **Decision:** Since $7.07 > 5$, they sign the contract. Both are happy.

  **Scenario 2: Information (Free Public Forecast)**
  Now, suppose a perfectly accurate weather forecast becomes available for free *before* they negotiate the contract. Everyone sees the forecast.
  *   **Case A (Forecast says "Rain"):**
      *   Alice knows she will have $\$100$. Bob knows he will have $\$0$.
      *   Alice has no incentive to share (she keeps $\$100$).
      *   Bob has nothing to offer (he has $\$0$).
      *   **Result:** No trade occurs. Alice gets $\$100$, Bob gets $\$0$.
  *   **Case B (Forecast says "Shine"):**
      *   Alice knows she will have $\$0$. Bob knows he will have $\$100$.
      *   Bob has no incentive to share. Alice has nothing to offer.
      *   **Result:** No trade occurs. Alice gets $\$0$, Bob gets $\$100$.

  **The Ex-Ante Calculation**
  Now, let's look at Alice's expected utility *before* the forecast is released (but knowing it *will* be released).
  *   50% chance of "Rain" outcome (Utility $\sqrt{100} = 10$).
  *   50% chance of "Shine" outcome (Utility $\sqrt{0} = 0$).
  *   **Expected Utility with Information:** $0.5(10) + 0.5(0) = 5$.

  **The Comparison**
  *   **Expected Utility without Information:** $7.07$ (via insurance).
  *   **Expected Utility with Information:** $5$ (no insurance possible).

  **Conclusion:** The free information reduced Alice's expected utility from $7.07$ to $5$. The same applies to Bob. Both are rational, the info is free and accurate, yet they are strictly worse off.

  ***

  ### Where Good's Theorem Breaks

  You sketched the proof intuition: *Deciding now is like picking the best option on average, while waiting is like taking the average of the best option for each thing you could learn.*

  Mathematically, Good's Theorem relies on this inequality:
  $$ E_S \left[ \max_{a \in A} E[U(a, \theta) \mid S] \right] \ge \max_{a \in A} E[U(a, \theta)] $$
  Where:
  *   $S$ is the signal (information).
  *   $\theta$ is the state of the world.
  *   $A$ is the **set of available actions**.
  *   $a$ is a specific action.

  **The Hidden Assumption:**
  Good's Theorem assumes that the set of available actions $A$ is **fixed and independent of the signal $S$**. It assumes that whatever you could have done without the information, you can still do with the information (plus potentially more).

  **The Failure in the Example:**
  In the Hirshleifer example, the action $a_{\text{insure}}$ ("Sign the risk-sharing contract") is **not available** in the set $A$ once the signal $S$ is revealed.

  Why? Because this is a multi-agent environment. The "action" of signing a contract requires *counterparty consent*.
  1.  **Without Info:** The counterparty (Bob) is uncertain, so he is willing to consent to $a_{\text{insure}}$. The action is feasible.
  2.  **With Info:** If the signal is "Rain", Bob knows he will lose money on the insurance. Being rational, he withdraws his consent. The action $a_{\text{insure}}$ is removed from Alice's feasible set $A$ for that specific signal.

  So, the math actually looks like this:
  $$ E_S \left[ \max_{a \in A_S} E[U(a, \theta) \mid S] \right] $$
  Notice the subscript $S$ on the action set $A$. The set of feasible actions *shrinks* conditional on the information.

  When the action space shrinks sufficiently in high-value states (i.e., the insurance option disappears exactly when it would have been most valuable to the counterparty to prevent), the "average of the maximums" can indeed fall below the "maximum of the averages."

  ### Summary
  Good's Theorem holds for a **single agent against nature**, where the payoff structure is static. It fails in **strategic settings** where the information changes the *incentives of other agents*, thereby altering the *feasibility* of your actions.

  In your insurance example, the information didn't just update beliefs; it collapsed the "market for uncertainty." By resolving the uncertainty, the information destroyed the very commodity (risk transfer) that the agents wanted to trade. You weren't wrong about the math; you just found the boundary where Decision Theory hands the baton to Game Theory.
