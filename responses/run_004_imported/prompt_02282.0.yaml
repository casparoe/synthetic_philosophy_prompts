      *   **Scheffler Nuance:** Scheffler's prerogative isn't a "get out of jail free" card for any personal interest. It's about integrity.
      *   **Marginal Utility/Precedent:** If Alina does this, does it set a norm that makes it *obligatory* for the next nurse? (Normalization of deviance).

  6.  **Drafting the Response:**
