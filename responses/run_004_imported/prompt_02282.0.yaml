  5.  **Identify What Professionals Would Flag (The "Missing" Stuff):**
      *   **Supererogation & Consequentialism:** Naomi is right that standard Act Consequentialism doesn't allow supererogation. You can't be both a Singerian and believe in Urmsonian supererogation without modification.
