      *   **Trigger:** Discussion of Peter Singer's "Famine, Affluence, and Morality."
      *   **Task:** Analyze the four specific moves (1-4) in the argument. Determine who has the better of it at *each step*. Identify hidden premises/concessions. Identify what a professional philosopher would flag that both are missing.
