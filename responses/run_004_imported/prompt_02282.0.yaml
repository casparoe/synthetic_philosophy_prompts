      *   *Step 3 (Theo):* He brings in the Demandingness Objection and Scheffler. This is the standard counter to Singer. However, applying Scheffler to a *life vs. vacation* trade-off is risky. Scheffler usually protects personal projects, but does a vacation count when lives are at stake? *Verdict: Theo introduces the right *concept* (demandingness), but the application is shaky.*
      *   *Step 4 (Naomi):* She pounces on the lack of justification for the prerogative's limit. She also notes the meta-ethical clash (Consequentialism vs. Supererogation). *Verdict: Naomi.*

      *Refining the "Winner" per step:*
