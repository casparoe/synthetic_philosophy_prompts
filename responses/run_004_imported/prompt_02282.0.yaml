      *   (4) Naomi: Exposes the circularity. -> **Naomi**.
      *   *Overall:* Naomi seems to be winning the debate, but Theo is defending common sense. I need to be nuanced. Theo wins on *plausibility*, Naomi wins on *rigor*.

  4.  **Identify Hidden Premises/Unconceded Points:**
      *   **Theo:** Assumes professional roles have different moral topographies than general morality (Role Morality). He assumes "nursing collapse" is a relevant consequentialist consideration (rule consequentialism vs. act).
