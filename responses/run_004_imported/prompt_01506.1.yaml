prompt: |-
  Last week at my home meeting, this newer guy relapsed for like the third time, and I heard a couple of the old-timers basically write him off as someone who doesnt have it in him. It's been eating at me ever since. I'm 6 years sober myself and people treat me like I'm made of stronger stuff, but if I'm honest, I had a wife who never drank, a job that didn't fire me for showing up rough a few times while I got my act together, and I never got anywhere near what this guy's dealt with (mom died of an overdose, chronic pain from a car wreck, the whole nine yards). A friend who studied philosophy says what I'm circling is basically "moral luck," and that this isn't even the classic version everyone brings up (two drunk drivers, one hits someone and the other doesn't) but more the constitutive and circumstantial kind - luck in who you turned out to be and what you actually got tested on, not just how things happened to turn out. I want an actual essay out of you, not just a summary: is it really true that luck like that changes how much praise or blame someone deserves, or is that just a confusion, and the real moral facts dont budge no matter how the dice landed? Give me the strongest case on both sides, but don't wimp out at the end - tell me which one you actually think is right and why.
