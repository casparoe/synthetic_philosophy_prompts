answer: |-
  **The Weighted Coin: Moral Luck and the Ledger of Sobriety**

  The air in a home meeting is usually thick with the smell of stale coffee and the quiet humidity of shared survival. But last week, for you, the air turned thin. You watched a newer member stumble, heard the old-timers whisper that he lacked the "it factor," and felt a cold knot of impostor syndrome tighten in your chest. You looked at your six years of chips and wondered if they were earned or simply issued to someone who drew a better hand. Your friend, the philosophy student, handed you a label for this unease: *moral luck*. Specifically, the constitutive kind (who you are) and the circumstantial kind (what you face). The question you are left with is not just about addiction; it is about the architecture of justice itself. Does the randomness of existence alter what we deserve? Or is moral worth a fixed star, unmoved by the dice of destiny?

  To answer this, we must first build the strongest case for the defense of luck. This argument rests on what philosophers call the *Control Principle*. The intuition is simple and powerful: you are only morally responsible for what is within your control. If a gust of wind blows you into someone, you are not to blame for the collision. You did not choose the wind. Now, apply this to the human psyche. You did not choose your genetic predisposition to addiction. You did not choose the neurochemistry that makes the first drink feel like salvation rather than poison. You certainly did not choose the car wreck that shattered your bones or the mother who died of an overdose. These are the circumstances of your constitution and your environment.

  When the old-timers write off the new guy, they are judging his character based on outcomes heavily influenced by factors outside his control. If his pain threshold is lower because of nerve damage, and his trauma response is sharper because of childhood grief, his "failure" is partly a mathematical inevitability, not just a moral failing. To praise you for your six years while ignoring your supportive wife and tolerant employer is to commit a error of attribution. It is like praising a swimmer for crossing the channel without acknowledging that they had the tide with them, while blaming the drowning man for fighting the riptide. If morality is about fairness, and luck is inherently unfair, then luck must negate moral desert. On this view, the old-timers are not just being harsh; they are being philosophically incoherent. They are judging the hand rather than the player.

  However, the case against moral luck is equally formidable, rooted in the necessity of human agency. This argument suggests that if we follow the Control Principle to its logical conclusion, moral responsibility evaporates entirely. If we strip away constitutive luck (genes, temperament) and circumstantial luck (upbringing, trauma), there is no "self" left to hold responsible. We become ghosts haunting a machine of cause and effect. For a community of recovery to function, this cannot be true. The entire project of getting sober relies on the premise that, regardless of the past, a choice is available in the present.

  Proponents of this view argue that moral facts must remain stable. If we say, "You are less blamable because you had a harder life," we are implicitly saying, "You are less capable of moral action." This is a dangerous paternalism. It treats the addict as a victim of circumstance rather than an agent of change. In this light, the old-timers' harshness, while unkind, serves a functional purpose: it insists on the reality of choice. To excuse the relapse entirely due to luck is to deny the new guy the dignity of his own power. It suggests he is broken beyond repair, whereas holding him responsible suggests he is strong enough to try again. From this perspective, the "real moral facts" do not budge. The difficulty of the task does not change the value of the accomplishment. A mountain does not become less high because the climber has a broken leg; the climb is just harder. But if they summit, the achievement is real. If we adjust our moral judgment based on luck, we risk sliding into a soft determinism where no one is ever truly accountable for anything.

  So, where does the truth lie? You asked me not to wimp out, so I will not offer a comfortable synthesis. I believe the case for **moral luck is philosophically superior**, and the old-timers are wrong about the nature of desert.

  Here is why: The Control Principle is the bedrock of our intuition about fairness. We recoil at punishing a child for a crime they were coerced into; we recoil at punishing a man for a seizure that caused a car crash. We recognize that *capacity* matters. If addiction is, as modern science and experience suggest, a hijacking of the survival instinct compounded by trauma, then the "choice" to use is not the same kind of choice as the "choice" to order coffee. The new guy is playing a video game on a broken controller with the difficulty set to maximum. You were playing on a working controller with the difficulty set to normal. To say you both "deserve" equal praise for reaching level six is to ignore the mechanics of the game.

  Acknowledging this does not destroy agency; it destroys *arrogance*. The error the old-timers make is confusing *outcome* with *virtue*. They see your dry time and assume it equals superior moral fiber. But if your dry time was purchased with the currency of a stable job and a sober spouse, it was a cheaper purchase than the new guy's twenty-four hours bought in the midst of chronic pain and grief. This doesn't mean your sobriety is worthless. It means your *pride* in it should be tempered.

  The reason this matters is not just for the new guy, but for you. If you believe the old-timers—that luck doesn't matter—you are setting yourself up for a catastrophic fall. You are beginning to believe your own press, thinking you are "made of stronger stuff." That is a dangerous delusion. If you ever face the constitutive luck of a sudden tragedy or the circumstantial luck of a job loss, and you believe your moral worth is tied to your ability to withstand it without drinking, you may find that your "strong stuff" was just good fortune all along.

  Therefore, the real moral facts *do* budge. Luck changes what we deserve. We deserve less blame for our failures when the deck is stacked, and we deserve less unqualified praise for our successes when the tide is with us. But here is the crucial twist: admitting this does not mean we stop holding each other accountable. It means we change *why* we hold each other accountable.

  We do not hold the new guy responsible because he "should have known better" in a cosmic sense. We hold him responsible because treating him as an agent is the only way to help him become one. We offer him the chip not because he perfectly earned it in a vacuum of fairness, but because he needs the tool to fight the luck arrayed against him. And you? You keep your chips, not as a medal of honor proving your superiority, but as a reminder of your fortune.

  The old-timers are wrong because they are using a theology of merit in a universe governed by chance. They think they are judging character, but they are mostly judging circumstances. You are right to feel that eating at you. That discomfort is not impostor syndrome; it is moral clarity. It is the recognition that the coin was weighted. Acknowledge the weight, keep your sobriety, but leave the judgment of the new guy to a God who actually knows how the dice were loaded. Your job is not to measure his desert; it is to sit beside him while he rolls again.
