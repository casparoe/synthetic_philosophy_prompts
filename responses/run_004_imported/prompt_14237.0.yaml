answer: |-
  This is a classic and crucial pivot point in teaching formal epistemology. You are right to sense that the standard textbook gloss often glosses over the normative bridge. The move from "you can lose money" to "your beliefs are irrational" is where the philosophy happens, and it is where the Dutch Book Argument (DBA) is most vulnerable.

  To help you structure this for your seminar, I will break down the "depragmatizing" move into its constituent normative steps, explain what the underlying inconsistency is supposed to be once money is removed, and then outline why critics feel the problem is merely displaced rather than solved.

  ### 1. The Diagnostic vs. Constitutive Distinction

  The first step in the depragmatizing move is to clarify the role of the betting setup.

  *   **The Pragmatic (Constitutive) Reading:** The irrationality *consists in* the disposition to accept a sure loss. If you would actually take the bets, you are practically irrational. The worry here, as your student noted, is that this makes rationality contingent on the presence of a bookie or the agent's willingness to gamble.
  *   **The Epistemic (Diagnostic) Reading:** The betting setup is merely a *heuristic* or a *model* used to reveal an underlying structural defect in the belief state itself. The bets are not the source of the normativity; they are a spotlight.

  **The Granular Move:**
  When we depragmatize, we treat the "fair betting price" not as an offer the agent must be ready to make, but as a **measure of the agent's evaluative stance toward truth.**

  If an agent has a credence of 0.6 in $P$, the depragmatizer says this *means* (normatively, not behaviorally) that the agent values the prospect of learning $P$ is true at 0.6 units of epistemic value (where 1 is certainty of truth and 0 is certainty of falsehood).

  The Dutch Book Theorem then demonstrates that if these valuations violate the probability axioms, the agent's **evaluative system is inconsistent.**

  ### 2. The Nature of the "Evaluative Inconsistency"

  So, what is the inconsistency if no money changes hands? The depragmatizer argues that incoherent credences involve a conflict in how the agent values logical relations.

  Consider the standard Dutch Book for non-additivity: $P(A) = 0.5$, $P(B) = 0.5$, but $P(A \lor B) = 0.8$ (where $A$ and $B$ are mutually exclusive).

  *   **The Pragmatic Defect:** You sell the bookie the bet on $(A \lor B)$ for 0.8 and buy from him the bets on $A$ and $B$ for 0.5 each. Net cost: 0.2. Net payout: 1 if $A$ or $B$ happens. Wait, that's not a sure loss. Let's use the standard sure loss case: $P(A) + P(\neg A) > 1$.
  *   **The Evaluative Defect:** Suppose $P(A) = 0.6$ and $P(\neg A) = 0.6$.
      *   The agent values the proposition $A$ at 0.6.
      *   The agent values the proposition $\neg A$ at 0.6.
      *   The agent values the tautology $(A \lor \neg A)$ at... well, logically, $(A \lor \neg A)$ is equivalent to Truth.
      *   However, by the agent's own valuation metric, the "value" of the disjunction should be bounded by the sum of the parts (if we treat them as assets).
      *   More sharply: The agent is committed to the claim that a guaranteed truth (the tautology) is worth *more* (1.2) than the maximum possible value of a truth (1.0).

  **The Core Claim:** The irrationality is not that the agent *loses money*, but that the agent **values a logical truth at more than 1** (or a logical falsehood at less than 0). This is a form of **doxastic incoherence**. It is analogous to asserting $P$ and asserting $\neg P$. In the pragmatic version, the "assertion" is cashed out in currency; in the depragmatized version, the "assertion" is cashed out in *degree of confidence*.

  David Christensen, in *Putting Logic in Its Place*, argues that this inconsistency is a violation of a norm of **ideal rationality**. He suggests that just as logical inconsistency makes a set of *beliefs* (full belief) defective, probabilistic inconsistency makes a set of *credences* (partial belief) defective. The Dutch Book scenario is simply the most vivid way to demonstrate that the numbers don't add up logically.

  ### 3. Why Critics Remain Unconvinced (The "Relocation" Objection)

  Even with this sophisticated framing, many formal epistemologists (including some sympathetic to probabilism) feel the depragmatizing move does not fully close the gap. Here are the three main lines of criticism you should present to your seminar.

  #### A. The Linking Premise Problem
  To get from "incoherent credences" to "Dutch Book vulnerability," you need a linking premise connecting credences to betting ratios.
  *   **Pragmatic version:** "If you have credence $p$, you *will* bet at odds $p$." (Clearly false; people don't always bet).
  *   **Depragmatized version:** "If you have credence $p$, you *should* regard odds $p$ as fair."

  Critics argue this linking premise is just as controversial as the conclusion. Why should my degree of belief be governed by norms of fairness in exchange, even hypothetical exchange? If I say, "I believe it will rain to degree 0.8, but I refuse to bet on it because I hate gambling," the depragmatizer says, "Your refusal is irrelevant; your *valuation* is still 0.8."
  The student's objection returns here: If the valuation never manifests in action or decision, in what sense is it "inconsistent"? Is it a inconsistency in a ghostly realm of abstract valuation? Some argue this makes the normativity otiose.

  #### B. The "Why Care?" Question (Epistemic vs. Practical)
  Even if we grant that incoherent credences constitute an "evaluative inconsistency," why is *this specific kind* of inconsistency epistemically irrational?
  *   Logical inconsistency (believing $P$ and $\neg P$) is bad because it guarantees one of your beliefs is false.
  *   Probabilistic inconsistency guarantees... what?
      *   It doesn't guarantee any specific credence is inaccurate (you could be incoherent but accurate).
      *   It doesn't guarantee you will be misled.

  The depragmatizer says, "It guarantees your evaluative scale is broken." But the critic asks, "Broken relative to what?" If the answer is "Broken relative to the probability calculus," the argument becomes circular: *You should be probabilistic because violating probability is inconsistent.*
  This leads many to prefer **Accuracy-First Epistemology** (e.g., Jim Joyce). Joyce argues we should skip the betting analogy entirely. We should prove that incoherent credences are *accuracy-dominated* (there is always a coherent set of credences closer to the truth regardless of how the world turns out). Critics of DBA argue that depragmatizing it just hides the fact that the real normative work is being done by accuracy considerations, not consistency considerations.

  #### C. The "Merely Possible" Objection
  The DBA relies on vulnerability to a *possible* book.
  *   **Objection:** I am vulnerable to choking if I eat a hot dog (I have a physiology that allows choking). That doesn't make eating a hot dog irrational.
  *   **Depragmatizer Reply:** The vulnerability isn't physical; it's normative. It reveals that your commitments *entail* a sure loss.
  *   **Counter-Reply:** But if the bookie never comes, the entailment never activates. If the irrationality lies in the *state* rather than the *consequence*, why do we need the bookie scenario at all? Why not just say "Incoherence is a brute epistemic vice"?
      *   If the latter, the DBA is superfluous.
      *   If the former, we are back to the student's objection that the normativity depends on external contingent factors (the existence of the bookie possibility).

  ### 4. Pedagogical Strategy for the Seminar

  To present this crisply, I suggest framing the session around three "Conceptions of the Dutch Book Argument":

  1.  **The Pragmatic Conception:** Incoherence is irrational because it leads to **bad outcomes** (money loss).
      *   *Verdict:* Vulnerable to the "Bookie Contingency" objection.
  2.  **The Depragmatized Conception (Christensen/Maher):** Incoherence is irrational because it constitutes **evaluative inconsistency**. The bets are a *reductio ad absurdum* of the agent's valuation system.
      *   *Verdict:* Solves the contingency problem, but raises the "Linking Premise" and "Why Care?" problems.
  3.  **The Accuracy Conception (Joyce):** Incoherence is irrational because it is **accuracy-dominated**.
      *   *Verdict:* Avoids betting entirely, but relies on specific measures of "distance from truth" (scoring rules) which are themselves contested.

  **The Takeaway for Students:**
  The depragmatizing move succeeds in showing that the *source* of the irrationality is internal to the agent's mind (the inconsistency of valuations) rather than external (the bookie). However, it does not fully explain *why* that specific internal inconsistency is an *epistemic* vice rather than a mere aesthetic or structural quirk, unless one presupposes that credences *just are* the kinds of things that must obey probability theory.

  By highlighting that the DBA (even depragmatized) relies on a bridge principle connecting belief to value/betting, you open the door to discussing whether formal epistemology needs a pragmatic bridge at all, or if it should move toward purely alethic (truth-based) norms. This sets up the rest of your seminar beautifully.
