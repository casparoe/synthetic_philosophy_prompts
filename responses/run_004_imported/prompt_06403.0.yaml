  For the family members wondering what this means in plain English: It means they are better together than they are apart. Not because they complete each other like puzzle pieces, but because they challenge each other to be real.

  Priya, you are spending your life studying what is "good." But tonight, you don't need a dissertation to find it. It's standing right next to you.

  So, if we accept Moore's premise—that a whole built on truth is one of the greatest goods there is—then the math is simple.

  To Priya and Dan: May your whole always be greater than the sum of your parts. And may you never stop seeing each other clearly.

