  So, I decided to build this toast on Moore. Specifically, on his idea of "organic unities."

  Moore argues that the best things in life aren't just a list of good items added together. They are *wholes* that generate a value greater than the sum of their parts. A beautiful painting isn't just canvas plus paint. A friendship isn't just Person A plus Person B. When the elements combine correctly, they create a new, distinct value that didn't exist before.

  In Moore's view, marriage is the ultimate organic unity. It is the claim that "Priya and Dan" is a entity more valuable than "Priya" plus "Dan" separately.

  But here is the catch. And this is the part Priya knows better than anyone. Moore was notoriously strict about *why* these unities are valuable. He argued that personal affection is only truly good if it is directed at the *actual* qualities of the other person. You cannot build a valuable whole on an illusion. If you love a fantasy version of your partner, Moore would say the value of that union is significantly diminished. You have to love the reality.

  This means I can't stand here and offer you generic compliments. I can't just say "Priya is perfect" or "Dan is a saint," because Moore would call that philosophical negligence. And frankly, you two are too sharp to believe it.

