  8.  *(Self-Correction during drafting)*: I should mention that direct T-violation was observed in 2012 by BaBar, just to show I'm up to date, though the 1964 CP violation is the classic argument. I should also mention that gravity is likely the dominant driver of entropy (Penrose), which is T-symmetric.

  9.  **Final Review against User Query:**
      *   Did I answer "Why do philosophers still write like this is an open problem?" Yes (because the T-violation solution doesn't work).
