  3.  **Evaluate the Options (Metaphysical Theories):**

      *   **Mereological Nihilism:** Only simple particles exist. There are no "cushions" or "couches." So, neither roommate is right in the ordinary sense. (Too extreme for a casual discussion, but worth mentioning).
      *   **Mereological Universalism:** Any collection of parts makes an object. So, there is an object "Couch," an object "Three Armchairs," and an object "Couch-Plus-Cat." The number of objects doesn't change, just how we group them.
      *   **Restrictivism (Common Sense):** Only some collections make objects. This is where the tension lies. Does proximity/function create a new object?
      *   **Sortal-Relative Identity:** The word "couch" implies a function/arrangement. When the function changes, the *couch* ceases, but the *matter* remains.
      *   **Conventionalism:** Objects are mind-dependent. We decide when a couch exists based on our interests.

