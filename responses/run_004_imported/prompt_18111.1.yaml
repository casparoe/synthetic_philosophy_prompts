answer: |-
  This is not just a trivial dispute; you have stumbled directly into one of the central problems of contemporary metaphysics. In fact, if you brought this example into your class, your professor would likely be delighted. You are grappling with **mereology** (the study of parts and wholes) and the **Special Composition Question**.

  Neither of you is necessarily "wrong," but you are likely operating under different metaphysical commitments regarding what it means for an object to exist. Here is a breakdown of the philosophical machinery behind your couch argument.

  ### 1. The Special Composition Question
  The late philosopher Peter van Inwagen formulated the "Special Composition Question": *Under what conditions do some things (xs) compose a further thing (y)?*

  *   **Your Roommate's View (Restrictivism/Functionalism):** They seem to believe that composition is conditional. The three units compose a "couch" *only when* they are arranged in a specific way (flush, L-shaped) serving a specific function. When you separate them, the composite object "couch" ceases to exist, and only the three "armchair" objects remain. To them, "couch" is a **sortal concept** that implies specific persistence conditions. If you break the arrangement, you kill the object.
  *   **Your Intuition (Nihilism or Permissivism):** You seem to feel that either the units are the only real things (and "couch" is just a label for their arrangement) or that the objecthood is stable regardless of position. If you lean toward the idea that there were "only ever three cushioned units," you are flirting with **Mereological Nihilism** (the view that composite objects don't strictly exist, only simples do) or the view that "couch" is a **phase sortal** (like "child" is a phase of a "human"; the human doesn't die when they stop being a child, the couch doesn't die when it stops being a sectional).

  ### 2. Is "Couch" a Real Object or a Concept?
  This is the crux of the dispute. There are two main camps here:

  **Camp A: Ontological Realism about Artifacts**
  Some philosophers argue that artifacts (like couches) are real objects with genuine identity conditions. If you hold this view, your roommate might be right. Artifacts are defined by their function and form. A pile of bicycle parts is not a bicycle; a separated sectional is not a couch. If the function is lost, the object ceases to exist. Therefore, you literally destroyed one object and created three others.

  **Camp B: Ontological Conventionalism**
  Other philosophers (like Eli Hirsch) argue that questions about the existence of ordinary objects are often **verbal disputes**. Reality doesn't come pre-sliced into "couches" and "armchairs." There is just matter arranged in space-time. We impose the concept "couch" onto that matter because it is useful for human life.
  *   If this is true, neither of you is onto something "real" in the fabric of the universe. You are arguing over which linguistic convention is more useful.
  *   **The "Universalist" Counter:** Some mereologists (like Ted Sider) argue for **Mereological Universalism**: *any* collection of parts composes an object. So, there is an object "The L-Shaped Couch," but there is *also* an object "The Three Separated Units," and even an object "The Left Cushion Plus The Right Cushion." In this view, the number of objects in the room never changes; you just changed which objects you are paying attention to.

  ### 3. The "Phase Sortal" Solution
  There is a middle ground that might satisfy your intuition. Consider the distinction between a **substance sortal** and a **phase sortal**.
  *   **Substance Sortal:** Tells you what something is essentially (e.g., "Gold," "Human").
  *   **Phase Sortal:** Tells you what something is temporarily (e.g., "Statue," "Child," "Couch").

  If "couch" is a phase sortal for the underlying units, then the "couch" didn't die; it just changed phases. Think of it like a "fist." When you open your hand, does the "fist" cease to exist? Yes. Did you destroy any matter? No. The "fist" is a temporary arrangement of fingers. Your roommate treats the "couch" like a fist (it vanishes when the hand opens). You treat the "couch" like the hand (it persists through the opening).

  ### 4. Is it just a verbal dispute?
  You asked: *Is this just a dispute about how we choose to describe the furniture?*

  In modern metaphysics, the answer is often **yes**, but that doesn't make it unimportant.
  *   If you define "object" by **spatial continuity**, the couch ceased to exist.
  *   If you define "object" by **material continuity**, the couch persists (as scattered parts).
  *   If you define "object" by **functional capacity**, the couch ceased to exist (it can no longer be sat on as a sectional).

  The "strangeness" you feel comes from the fact that our ordinary language assumes objects have clear boundaries and persistence conditions, but reality is messy. We want the couch to be a single *thing*, but we also know it's just three *things* touching.

  ### Verdict for Your Course
  Since you are taking a metaphysics course, here is how you should frame this:

  1.  **Acknowledge the Special Composition Question:** You are debating when composition occurs.
  2.  **Identify the Sortal:** You are debating whether "couch" is a rigid designator for that specific arrangement or a loose label for the matter.
  3.  **Consider Convention:** Admit that the "existence" of the couch might be mind-dependent. Without humans to sit on it, there are just foam and fabric arranged couch-wise.

  **Conclusion:** Your roommate is technically correct if you view artifacts as **functionally defined entities**. When the function breaks, the entity ends. However, you are correct if you view objects as **material continuants**. The "strangeness" you feel is the friction between these two valid metaphysical frameworks. It is a real dispute, but it is likely a dispute about **ontology** (what exists) driven by **semantics** (how we define existence).

  Enjoy the course; if your professor is good, they'll use your couch as an example next term.
