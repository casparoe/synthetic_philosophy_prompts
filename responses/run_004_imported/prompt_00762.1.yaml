answer: |-
  Your instincts were exactly right. Your friend's reading of Anscombe is a category error: they are interpreting a deontological argument through a consequentialist framework.

  To put it plainly: **Recalculating the casualty figures does nothing to undermine Anscombe's argument.** In fact, Anscombe would likely view the attempt to justify the bombings via casualty arithmetic as part of the moral disease she was diagnosing.

  Here is a breakdown of Anscombe's actual argument in *"Mr. Truman's Degree"* (1956), why the distinction between intended and foreseen effects is central, and why the "body count" debate is irrelevant to her specific charge.

  ### 1. The Core Charge: Murder, Not Manslaughter
  Anscombe's pamphlet was a protest against Oxford University's decision to award Harry Truman an honorary degree. Her central claim was that Truman was guilty of **mass murder**.

  For Anscombe, "murder" has a specific technical definition rooted in the natural law tradition (specifically Thomistic ethics): it is the *intentional killing of the innocent*.

  *   **The Consequentialist View (Your Friend):** The morality of the act depends on the outcome. If Outcome A (Bombing) kills 200,000 people, but Outcome B (Invasion) kills 1,000,000 people, Outcome A is morally preferable.
  *   **The Anscombean View:** The morality of the act depends on the *nature of the act itself*. Certain actions are intrinsically evil and cannot be chosen, regardless of the consequences. Intentionally killing innocent people is one of those actions.

  Therefore, even if an invasion would have killed ten times as many people, it would not justify an act of murder. To use a classic deontological analogy: You cannot harvest the organs of one healthy innocent person to save five dying patients, even though the arithmetic (1 death vs. 5 deaths) favors the murder. For Anscombe, Truman's decision was of the same moral species as that organ-harvesting hypothetical.

  ### 2. Intention vs. Foresight (The Doctrine of Double Effect)
  You recalled correctly that Anscombe is closely associated with the distinction between intended and foreseen effects (often discussed under the **Doctrine of Double Effect**). This is the crux of her objection to area bombing.

  Anscombe argues that the atomic bombings (and the prior firebombing of Japanese cities) were not instances of killing civilians as a *side effect* of destroying military targets. Rather, the destruction of civilian life and morale was the **means** by which the end (surrender) was achieved.

  *   **Foreseen but Unintended:** If you bomb a munitions factory, and civilians living next door unfortunately die, their deaths are foreseen but not intended. The death of the civilians does not help you achieve your goal; in fact, you would prefer they lived if you could destroy the factory without killing them.
  *   **Intended as a Means:** If you bomb a city *to* terrorize the population into forcing their government to surrender, the suffering and death of the civilians is the mechanism of success. You are choosing the death of the innocent as your tool.

  Anscombe argued that Truman (and the Allied command) explicitly chose the latter. The bomb was not dropped on a purely military target where civilians happened to be; it was dropped on a city to demonstrate the capacity to destroy civilian life en masse. Because the killing of innocents was the *method*, it was intended. Once an act is identified as the intentional killing of innocents, no amount of "good consequences" (like ending the war sooner) can sanitize it.

  ### 3. Why the "Casualty Recalculation" Fails
  Your friend argued that if historians prove an invasion would have cost more lives, Anscombe's argument collapses. This assumes Anscombe's objection was about the *quantity* of death. It was not. It was about the *quality* of the act.

  In the pamphlet, Anscombe explicitly addresses the "necessity" argument. She writes:

  > "It is unlawful to kill the innocent... even if it is necessary to achieve a good end."

  She anticipates the utilitarian defense. She argues that if we accept the principle that "murdering innocents is permissible if it saves more lives," we have destroyed the concept of justice. We have reduced human rights to a variable in an equation.

  So, if a historian comes along today and says, "Actually, Truman saved 500,000 lives by dropping the bomb," Anscombe's response would be: **"He still murdered 100,000 people to do it."** The justification does not change the moral nature of the act. The honor (the degree) should not be awarded to a man who chose to commit mass murder, regardless of whether that murder was "efficient."

  ### 4. The Target of the Pamphlet
  It is also worth noting the context of the text. Anscombe was not writing a military strategy paper; she was writing a moral protest about **honor**.

  Her point was that by awarding Truman a degree, Oxford was signaling that such actions are compatible with moral leadership. She wanted to maintain the absolute prohibition against the intentional killing of innocents as a bright line that civilization must not cross. If that line becomes blurry—if we start saying "murder is okay if the math works out"—then the prohibition ceases to exist.

  ### Summary for Your Debate
  You can confidently tell your friend that their reading is incorrect based on the text.

  1.  **Anscombe is a Deontologist, not a Consequentialist:** She rejects the premise that ends justify means.
  2.  **The Argument is About Intention:** She argues the bombings were *intentional* killing of innocents (as a means to surrender), not *incidental* killing (as a side effect of military targeting).
  3.  **Casualty Counts are Irrelevant:** Whether an invasion would have killed more people is irrelevant to the prohibition against murder. You cannot commit murder to prevent manslaughter.

  Your instinct that the "intended vs. foreseen" distinction mattered was the key. Anscombe's outrage was not that *too many* died, but that innocents were *chosen to die* as a matter of policy. Recalculating the numbers leaves that choice intact.

  ***

  **A Note on Nuance:**
  While your interpretation of *Anscombe's argument* is correct, a complete picture of the debate requires acknowledging that historians and ethicists still dispute Anscombe's *premise*. Critics of Anscombe argue that the target was indeed "military" (the war-making capacity of the nation) and that civilian death was a foreseen but unintended side effect of destroying that capacity, which would bring it back under the umbrella of permissible collateral damage. However, that is a debate about the *facts* of the bombing's intent. Regarding Anscombe's *ethical framework*, you are right: she does not care about the body count comparison.
