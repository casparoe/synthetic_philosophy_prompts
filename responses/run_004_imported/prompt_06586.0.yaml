      *   Grapple with epistocracy/democracy? Yes.
      *   Take entrenchment objection seriously? Yes.

  8.  *(Final thought)*: Ensure the distinction between "Maintainers" (the 6 of us) and the new "Council" is clear. The Council should ideally include people outside the current 6 to show we aren't just consolidating power among the original 6.

