          *   *Counterfactual/Difference-Making Theorist (CDMT):* Inspired by Lewis, Schaffer. View: Omissions are legitimate causes (dependence relations).
      *   **Specific Case:** The dying plant (Sarah didn't water it vs. everyone else didn't).
      *   **Key Issue:** The "Selection Problem" (Why Sarah and not the rest of the world?).
      *   **Tone:** Rigorous, grappling, not talking past each other.

  2.  **Character Conceptions:**
      *   **Alex (PPT):** Needs to be ontologically parsimonious. Causation is a physical relation. "Nothing" cannot "do" anything. Needs to address the selection problem by denying the premise (it's not causation, it's explanation).
      *   **Jordan (CDMT):** Needs to focus on dependence. If $C$ hadn't happened, $E$ wouldn't have. Needs to address the selection problem by appealing to norms, expectations, or contextual salience (without reducing it to *just* psychology, keeping it metaphysical/semantic).

  3.  **Drafting - Section by Section:**

