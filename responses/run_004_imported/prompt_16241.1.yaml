answer: |-
  **Setting:** *A cluttered office, late afternoon. A dead potted fern sits on the desk between them. **Alex** (Physical-Process Theorist, channeling Phil Dowe & Helen Beebee) is leaning back, arms crossed. **Jordan** (Counterfactual/Difference-Making Theorist, channeling David Lewis & Jonathan Schaffer) is pacing.*

  **Jordan:** Look at the fern, Alex. It's dead. Why?

  **Alex:** Physically? Cellular dehydration leading to tissue necrosis.

  **Jordan:** Metaphysically. What caused the death?

  **Alex:** The last evaporation event that wasn't replenished. The heat. The sun. Positive events involving energy transfer.

  **Jordan:** And Sarah? Sarah was supposed to water it yesterday. She didn't.

  **Alex:** Sarah *didn't* do anything. That's the point. "Sarah's not watering" is not an event. It's a true proposition about the world, but it's not a chunk of reality that pushed the plant toward death. You can't transmit a conserved quantity like water or momentum via an absence.

  **Jordan:** But if Sarah *had* watered it, the plant would be alive. The counterfactual dependence is rock solid. If $C$ (Sarah waters) had occurred, $E$ (plant lives) would have occurred. Since $\neg C$ and $\neg E$, we have causation by omission. It's the most intuitive thing in the world.

  **Alex:** Intuitive, sure. But ontologically spurious. You're confusing *causation* with *causal explanation*. We explain the death by citing Sarah's omission because she had a duty. But that duty is a social norm, not a physical bond. If causation is a relation in the world, it can't depend on HR policies.

  **Jordan:** Okay, but that leads us straight into the problem your view tries to dodge. The Selection Problem. If we agree that omissions *can* be causes—or even if we just agree on the explanatory level—why is Sarah the cause?

  **Alex:** Exactly! That's my point.

  **Jordan:** No, wait. Hear me out. The Queen of England didn't water the plant. The President didn't water the plant. I didn't water the plant. Physically, our non-actions are identical. We all failed to transfer water to the fern. If you're going to say omissions *aren't* causes because they're everywhere, fine. But if you admit *any* role for them, you have to explain why we pick Sarah.

  **Alex:** I don't have to explain it metaphysically because I don't think Sarah's omission is a cause *at all*. I think you're asking me to solve a problem that only exists because you reified a "nothing." There is no "Queen's not-watering" entity floating out there competing with "Sarah's not-watering." There is just the world, and there is Sarah, and there is the Queen. The plant died due to physiological processes. We *cite* Sarah because she was the designated waterer. That's pragmatics. That's conversation. It's not metaphysics.

  **Jordan:** But causation *is* sensitive to context, Alex. Lewis admitted this. Causal claims are contrastive. We aren't asking "Did $\neg C$ cause $\neg E$?" in a vacuum. We're asking "Did Sarah's not-watering rather than watering cause the death rather than survival?"

  **Alex:** Contrastivity just hides the problem; it doesn't solve it. You're building the selection criteria into the relata. You're saying the cause isn't "Sarah's omission," it's "Sarah's omission *in a context where she was expected to act*." But now you've made causation dependent on expectations. If the plant belonged to a squatter in an abandoned house, Sarah's omission wouldn't be a cause. How can the *same physical history* contain different causal relations depending on what people expect?

  **Jordan:** Because the causal structure of the world includes dependencies, and dependencies are sensitive to the model we use to carve the world up. Schaffer's point is that causation is a three-place relation: $c$ rather than $c^*$ causes $e$ rather than $e^*$. The contrast $c^*$ is fixed by context. In the "Sarah is the plant-sitter" context, the relevant contrast is Sarah watering. In the "nobody cares about the plant" context, the relevant contrast might be "rain falling." The physics doesn't change, but the *causal facts* are higher-level than the physics.

  **Alex:** Higher-level, sure. I'm fine with special sciences. But "absence" isn't a higher-level property; it's the lack of a property. You're building a castle on a foundation of nothing. Here's the worry for your view, and for the Cog Sci kids studying this: If causation by omission is real, and it depends on norms to solve the Selection Problem, then causation is normative.

  **Jordan:** Not normative. *Modal.* The norms help fix the relevant alternatives.

  **Alex:** Same difference! If I'm a process theorist, I can say: The physical cause is the evaporation. Sarah is *explanatorily* relevant because of a norm. You want to say Sarah is *causally* relevant because of a norm. But look at the data. If you tell subjects that Sarah *hated* the plant and intentionally didn't water it, they attribute more causation than if she simply forgot. Does the physical process of the plant dying change based on Sarah's intent? No. So the "causation" they are tracking isn't in the world. It's in their judgment of Sarah.

  **Jordan:** I'd argue the intent changes the counterfactual stability. If she hated it, she would have prevented others from watering it. If she forgot, maybe someone else would have stepped in. The dependency structure *does* change.

  **Alex:** That's a stretch. In the basic Knobe-style case, the physical outcome is identical. The only variable is the norm violation. You're forcing metaphysics to bow to psychology. Beebee's line is the cleanest here: We use causal language to explain. "Sarah killed the plant" is a shorthand for "Sarah didn't water it, and given her duty, that explains the death." We don't need to posit a spooky causal relation between a non-event and a death.

  **Jordan:** But then you lose the ability to distinguish between prevention and allowing. If I unplug your life support, I cause your death. If I simply don't plug it in when I'm the doctor, I also cause your death. Physically, one is a motion (pulling a plug), one is an omission (standing still). But morally and causally, they feel the same. Your view makes the doctor's standing still causally inert.

  **Alex:** The doctor's standing still is causally inert. The *patient's underlying condition* is the cause of death. The doctor's omission is the reason we *blame* the doctor. We need to keep the ontology clean. If you mix norms into causation, you can't separate "What happened?" from "Who's to blame?"

  **Jordan:** But "What happened?" *includes* the failures. The world isn't just a plenum of positive events. It's a structure of dependencies. If the Cog Sci student is looking at why people pick Sarah over the Queen of England, they are studying how humans navigate that modal structure. We select the omission that was *abnormal*.

  **Alex:** "Abnormal." There it is. Normality is a statistical or prescriptive notion. It's not a force.

  **Jordan:** It's a filter. Look, think about the Selection Problem again. If you deny omissions are causes, you still have to explain why the folk—and the law—insist they are. You relegate it to "explanation." But explanation tracks causation. We don't explain effects by citing irrelevant causes. If we cite Sarah's omission, it's because we take it to be causally relevant.

  **Alex:** We cite it because it's the *difference* in the expected course of events. But "expected" is the key word. The plant doesn't have expectations. The physics doesn't have expectations. The dehydration happens regardless of Sarah's job description. The Selection Problem proves my point: If omissions were real causes, *all* omissions would be causes. The fact that we have to use a contextual filter to pick one out proves that the causality isn't in the omission itself. It's in the *selection*.

  **Jordan:** I agree the selection is contextual. I disagree that this makes the causation unreal. Causation is inherently contrastive. The "Selection Problem" isn't a bug; it's a feature of how causal relations work. There is no "The Cause." There is only "The Cause relative to a contrast class." Sarah is the cause relative to the class of "duty-bound agents." The Queen is not in that class.

  **Alex:** So causation is relative to duty-bound agents?

  **Jordan:** Causal *attribution* is. The dependency is objective. Sarah's action (or lack thereof) was the switch.

  **Alex:** But there was no switch! That's the metaphor doing the work for you. In the switch case, there's a physical lever. In the plant case, there's just... no water. You're treating the absence of water as a presence of a cause.

  **Jordan:** I'm treating the absence of water as a necessary condition in the dependency chain.

  **Alex:** Necessary conditions are cheap. Oxygen is necessary. Gravity is necessary. The Queen's not-watering is necessary. If you say causation is just counterfactual dependence, you drown in a sea of causes. You need the process to narrow it down.

  **Jordan:** And I say the process view is too narrow. It can't handle prevention, omission, or double prevention. If I catch the ball, I prevent the window from breaking. If I don't catch the ball, the ball breaks the window. Did my "not catching" cause the breakage? Process theory says no, because I didn't touch the window. But intuitively, I'm the reason it broke.

  **Alex:** Intuitively, you're the reason we blame you. The ball broke the window. The process flows from the thrower, through the ball, to the glass. You just failed to intercept the process.

  **Jordan:** And that failure is a cause.

  **Alex:** It's an explanation.

  **Jordan:** We're circling.

  **Alex:** We are. Because you want causation to do the work of responsibility, and I want to keep causation physical so we can separate it from responsibility.

  **Jordan:** But for the Cog Sci student... if they assume the metaphysics is settled, they'll misinterpret the data. If they think they are studying "causal perception," but omissions aren't causes, they are studying "explanation selection."

  **Alex:** Precisely. If I'm right, their experiments on "causal attribution of omissions" are actually experiments on *normative reasoning*. They aren't finding out how people see causation; they're finding out how people assign duty.

  **Jordan:** Or, they are finding out how people identify the *relevant contrast* in a causal network. The norms aren't replacing causation; they are fixing the parameters of the causal relation. The student needs to know that if they treat "causation" as a univocal, physical push, they will miss why the folk include omissions. But if they treat it as purely normative, they miss the dependency structure.

  **Alex:** So the advice is: The metaphysics determines whether you call it "causation" or "explanation." But the psychology will look the same either way. People will always pick Sarah over the Queen.

  **Jordan:** Because Sarah is the salient contrast.

  **Alex:** Because Sarah is the norm-violator.

  **Jordan:** See? Salience vs. Norms. That's the empirical question.

  **Alex:** And the metaphysical question is whether that selection mechanism tracks a real relation or constructs a pragmatic one.

  **Jordan:** *(Gestures to the dead fern)* Well. Whatever the metaphysics, if I don't water the new one, it's going to die.

  **Alex:** *(Stands up)* And if you don't, the evaporation will kill it. I'll leave you to your dependencies.

  **Jordan:** And I'll leave you to your processes.

  *(Alex exits. Jordan picks up a watering can.)*
