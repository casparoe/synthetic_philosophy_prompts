  *(Self-Correction during final review)*: I need to make sure Jordan doesn't concede too much to the "norms" argument. Lewis was wary of making causation too subjective. Schaffer's contrastivity is a better metaphysical handle for Jordan to use. It makes the selection part of the *relata*, not just an epistemic filter. Alex should attack that move as smuggling pragmatics into ontology.

