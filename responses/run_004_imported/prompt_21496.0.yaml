answer: |-
  This is a fantastic question. You have essentially independently rediscovered a very active, cutting-edge intersection of computer science, cognitive science, and moral philosophy.

  Your intuition is correct: there is a meaningful distinction between "I don't know the weights of the items" (epistemic uncertainty) and "I know the weights, but calculating the optimal combination takes longer than the universe has left" (computational intractability).

  Here is how philosophy and ethics currently carve up this problem, the terminology you're looking for, and where the debate stands.

  ### 1. Is this distinct from standard uncertainty?
  **Yes.** In moral philosophy, this is often distinguished under the umbrella of **Bounded Rationality**.

  Standard Utilitarianism (specifically "Act Utilitarianism") traditionally demands that you perform the action that maximizes utility. The classic objection to this is **Epistemic Uncertainty**: *You can't know the future.* If you save Person A, maybe Person A grows up to be a dictator. You can't know that, so you can't be blamed for not accounting for it.

  Your objection is different. It is **Computational Intractability**. Even if you have *perfect* information (you know exactly who is where, exactly how much gear they need, exactly how much time you have), the *processing* required to find the global maximum exceeds your computational capacity (brain or computer) within the time limit.

  Philosophers and economists handle this via **Herbert Simon's** concept of **Bounded Rationality**. Simon argued that agents are not "maximizers" (who find the global optimum) but **"satisficers"** (who find a solution that is "good enough" given their cognitive/resource limits).

  In the context of your disaster scenario:
  *   **Ideal Theory:** Assumes unlimited computational power. The "right" answer is the Knapsack optimal solution.
  *   **Non-Ideal Theory:** Assumes bounded resources. The "right" answer is the best *heuristic* solution you can find in the time allowed (e.g., a greedy algorithm: save the closest people first).

  So, to answer your first question: Yes, contemporary ethicists treat computational limits as a distinct constraint from informational limits. It shifts the moral obligation from "maximize outcome" to "optimize the decision *process* given constraints."

  ### 2. Does "Ought Implies Can" cover computational limits?
  **Yes, increasingly so.**

  The principle "Ought Implies Can" (often attributed to Kant, though he never phrased it exactly that way) traditionally meant logical or physical possibility. (e.g., You ought not to be blamed for not flying unaided, because you *cannot* fly).

  However, in modern moral philosophy and AI ethics, this has been expanded to cover **cognitive and algorithmic feasibility**.

  If the optimal moral calculation requires $O(2^n)$ time and you only have $O(n)$ time, you literally *cannot* perform the calculation. Therefore, a moral theory that demands you perform that calculation is flawed.

  This has led to a sub-field sometimes called **Computational Ethics** or **Algorithmic Moral Responsibility**. Philosophers like **Scott Aaronson** (a computer scientist who writes heavily on philosophy) have argued that computational complexity is a fundamental physical constraint on moral agency. If a moral theory requires solving an NP-hard problem in polynomial time to be "good," the theory itself is invalid because it violates "Ought Implies Can."

  In your dispatcher scenario: If the "correct" utilitarian choice is the NP-hard optimal solution, and the dispatcher uses a greedy approximation (saving the easiest people first) because that's all they can compute in time, most modern ethicists would argue the dispatcher **did their duty**. They optimized the *procedure*, even if they missed the *outcome*.

  ### 3. Is this a settled debate?
  **No, it is currently very heated.**

  You have stumbled into a conflict between **Ideal Theory** and **Non-Ideal Theory**, viewed through the lens of Computer Science.

  *   **The Idealists:** Some philosophers argue that morality is about the *truth* of the outcome, not the effort. If you saved 20 people but the optimal calculation would have saved 21, you technically failed the moral law, even if it was impossible to know. (This is a very hardline, almost religious view of Utilitarianism).
  *   **The Proceduralists:** Most modern ethicists argue that morality must be **tractable**. If a moral rule cannot be executed by a finite mind in a finite time, it is not a moral rule; it's a mathematical fantasy.

  There is a specific term you might find useful in your research: **Tractable Consequentialism**. This is the attempt to reformulate utilitarianism so that the "good" is defined by what is computationally feasible to maximize, rather than the abstract maximum.

  ### A Technical Nuance (for your coding brain)
  Just to validate your CS knowledge while we are here: The 0/1 Knapsack problem is **NP-Complete** (decision version) / **NP-Hard** (optimization version). However, it is "weakly" NP-Complete. It can be solved in pseudo-polynomial time $O(nW)$ using dynamic programming, where $W$ is the capacity.

  If your "weights" (time/resources) are integers and not astronomically large, a modern computer can actually solve for 30 items instantly. *However*, your philosophical point holds if:
  1.  The constraints are continuous (not integers).
  2.  The number of people scales to hundreds.
  3.  The "values" are interdependent (saving Person A changes the cost of saving Person B), which turns it into a Quadratic Knapsack Problem or worse, which is much harder.

  So your intuition about the scaling problem is theoretically sound, even if $N=30$ is solvable by a laptop today.

  ### Summary of Terms for Your Argument
  If you want to continue this debate with your friends or read more, here are the keywords to look up:

  1.  **Bounded Rationality:** (Herbert Simon) The idea that decision-making is limited by available information, cognitive limitations, and finite time.
  2.  **Ought Implies Can:** (Kant/Modern Ethics) The principle that moral obligation requires the ability to perform the action (now including computational ability).
  3.  **Ideal vs. Non-Ideal Theory:** (John Rawls) Ideal theory assumes perfect compliance and conditions; Non-Ideal theory deals with the real world's constraints.
  4.  **Computational Complexity in Ethics:** The study of how P vs NP and other complexity classes constrain moral agency.
  5.  **Satisficing:** Accepting a solution that meets a threshold of acceptability rather than optimizing for the global maximum.

  ### The Verdict
  You are right to feel that this is a distinct problem. "I don't know the inputs" is an epistemological problem. "I have the inputs but can't process the function" is a computational problem.

  Most modern ethicists would side with you: **A moral theory that requires solving an NP-hard problem in real-time is a broken moral theory.** The "ought" of the dispatcher is limited by the "can" of their CPU (biological or silicon). They are morally obligated to run the best *approximation algorithm* available, not the optimal one.

  If they run a greedy heuristic and it turns out a different combination would have saved one more person, they are not morally culpable. To claim they are would be to demand they violate the laws of computational complexity, which is arguably a violation of the laws of physics.
