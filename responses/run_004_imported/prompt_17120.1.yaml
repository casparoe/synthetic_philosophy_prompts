      *   **Situationism (Social Psychology):** The "Fundamental Attribution Error." We tend to overestimate personality and underestimate situations. The Stanford Prison Experiment, Milgram, etc. Priya's case is a classic test of situational pressure vs. dispositional trait.
      *   **Moral Identity:** Is honesty a global trait or domain-specific? Is it a binary switch or a spectrum?
      *   **The Concept of "Integrity":** Integrity often implies wholeness or consistency *despite* pressure. But does failing once mean the wholeness is broken forever?
      *   **Restorative vs. Retributive Judgment:** How do we judge for the sake of understanding vs. punishing?

  3.  **Evaluate the Two Camps:**
      *   *Camp A (Revelation):* "The mask slipped." Risk: Ignores context, assumes binary character.
