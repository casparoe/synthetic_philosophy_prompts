      *   **The Goal:** Provide a rigorous philosophical/psychological framework to evaluate character consistency, the impact of situational pressure, and the nature of virtue, avoiding clichés like "people are complicated."

  2.  **Deconstruct the Philosophical/Psychological Dimensions:**
