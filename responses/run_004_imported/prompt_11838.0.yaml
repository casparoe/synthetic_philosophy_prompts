          *   *Analysis:* This is historically accurate to Parfit. Parfit was willing to say "Rationality sometimes requires acting irrationally" (in the self-interest sense). This saves CDT by admitting it loses but calling it "rational" anyway, or by separating "rationality" from "winning."
          *   *Verdict:* Nora is historically accurate. However, for the LW/ACX crowd, this is often seen as biting the bullet too hard. It's a semantic retreat. But philosophically, it's a coherent position. I should acknowledge Parfit's actual stance supports her here.

