answer: |-
  This is a fantastic pivot for a seminar. The pop-sci version of Quantum Suicide (QS) relies on a category error between *ontological existence* (some version of me exists) and *epistemic probability* (what should I expect to experience). Lev Vaidman, David Wallace, and Simon Saunders have all wrestled with this, and their consensus is far more nuanced than the YouTube version: **The asymmetry is real, but the rationality of the credence update is highly contested.**

  Here is a breakdown of the mechanics of the asymmetry, followed by the anthropic/bayesian critique you can use to challenge the students' intuition.

  ---

  ### 1. The Asymmetry: Indexicality and Conditionalization

  The core reason the subject and the external observer diverge lies in **indexical conditioning** (self-locating belief).

  **The External Observer (The Friend)**
  The friend outside the box is entangled with the experiment. When the quantum trigger fires:
  *   In Branch A (amplitude $\alpha$), the gun fires, the subject dies, and the friend sees a corpse.
  *   In Branch B (amplitude $\beta$), the gun jams (quantum tunneling, say), the subject lives, and the friend sees a survivor.

  From the friend's perspective, the probability of seeing a survivor is governed by the Born Rule ($|\beta|^2$). If you run the experiment 100 times with a 50/50 trigger, the friend branches into $2^{100}$ copies. The *measure* (squared amplitude) of the friend-copies who see a survivor every single time is $2^{-100}$. The vast majority of the friend's future selves (by measure) observe a death. Therefore, no external observer can ever be convinced of MWI via QS, because for every branch where they see "miraculous survival," there are branches with higher total measure where they see death. They cannot aggregate data across branches.

  **The Subject (The Shooter)**
  The subject's epistemic position is constrained by the **principle of observational selection**.
  *   Premise 1: I can only have experiences in branches where I exist.
  *   Premise 2: In MWI, there is always at least one branch where the quantum event allows my continued existence (however low the amplitude).
  *   Conclusion: Conditional on "I am having an experience," I must be in a branch where I survived.

  For the subject, $P(\text{Survival} | \text{MWI} \land \text{I am experiencing}) = 1$.
  For the subject, $P(\text{Survival} | \text{Single World} \land \text{I am experiencing}) \approx 0$ (after many trials).

  This is the mechanical source of the asymmetry. The subject is conditioning on their own existence as a prerequisite for the data point. The friend is conditioning on the experimental setup. Vaidman argues this allows the subject to update their credence in MWI, because the likelihood of the evidence (survival) is vastly higher under MWI than under Single World theory (SWT), *for that specific first-person perspective*.

  ---

  ### 2. The Critique: Is the Subject Entitled to Update?

  This is where you can push the seminar past the cocktail-party version. The subject's update relies on a specific, controversial interpretation of probability in MWI. There are three major mechanical hurdles to the claim that the survivor is rational to believe in MWI.

  #### A. The Measure Problem vs. Branch Counting
  In standard Bayesian updating, you compare $P(E | H_1)$ and $P(E | H_2)$.
  *   $H_1$: Single World. $P(\text{Survival}^{100} | H_1) \approx 10^{-30}$.
  *   $H_2$: MWI. What is $P(\text{Survival}^{100} | H_2)$?

  If you assume "Branch Counting" (all branches are equally real/probable), then $P(\text{Survival} | \text{MWI})$ might be high (or 1, if we assume continuous survival). However, **Vaidman and Wallace explicitly reject Branch Counting.** They argue that subjective probability must track the **Born Rule weights (measure)**.

  If the gun is rigged to kill with 99% probability (amplitude squared = 0.99), then in MWI, the branch where you die has 99% of the *measure* of the future universe. The branch where you live has 1%.
  If subjective probability tracks measure (as decision-theoretic derivations of the Born Rule suggest it should), then **the subject should expect to die with 99% credence.**

  If the subject survives, they have observed a low-measure event. Observing a low-measure event is *not* strong confirmation of a theory that predicts low-measure events; it is simply a rare occurrence.
  *   **The Critique:** If MWI says "You should expect to find yourself in a high-weight branch," and you find yourself in a low-weight branch (the survival branch of a lethal experiment), you have actually observed evidence *against* the standard decision-theoretic formulation of MWI. You are an outlier in the multiverse.

  #### B. The Anthropics: SSA vs. SIA
  Your intuition about the "track record" hits on the Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA) debate.

  *   **SSA (Self-Sampling Assumption):** "I should reason as if I am a random sample from the set of all actual observers."
      *   In the QS scenario, the set of "observer-moments" includes all the versions of you that died (up until the moment of death). If we count pre-death moments, there are far more "dying yous" than "surviving yous" across the multiverse measure.
      *   Under SSA, you should expect to be a "dying you." Survival is surprising under MWI + SSA.
      *   *Result:* No update toward MWI.

  *   **SIA (Self-Indication Assumption):** "I should weight hypotheses by the number of observers they predict."
      *   MWI predicts vastly more observers than SWT. SIA favors MWI heavily *a priori*.
      *    However, SIA + QS leads to the "Presumptuous Philosopher" problem. It implies you can confirm MWI simply by existing, regardless of the experiment.
      *   More critically, SIA doesn't necessarily save QS. SIA weights worlds by total observers. In the lethal QS experiment, the "Death World" branches still contain the observer *up until the trigger pull*. The divergence happens at the moment of death. Does the "dead observer" count as an observer for the reference class?
      *   If the reference class is "observers who survive the experiment," then MWI guarantees existence (probability 1), and SWT does not. This supports the update.
      *   **The Breakdown:** The reference class definition is doing all the work. If you define the class as "post-experiment observers," you have rigged the Bayesian update by definition. This is circular. You are conditioning on the very evidence you are trying to explain.

  #### C. The Fission and Identity Problem
  The deepest mechanical objection comes from the metaphysics of personal identity (Parfit/Williams).

  In MWI, branching is **fission**. Pre-trigger You ($Y_0$) stands in a relation of psychological continuity to Post-trigger Survivor ($Y_S$) and Post-trigger Corpse ($Y_C$).
  *   $Y_0$ does not uniquely become $Y_S$.
  *   $Y_0$ has a stake in both outcomes.

  When $Y_S$ wakes up and says, "I survived, therefore MWI," they are ignoring the fact that $Y_0$'s expectations were split. If $Y_0$ assigned 99% weight to death, then $Y_S$ is the beneficiary of a 1% chance event.
  *   **The "No-Update" Argument:** $Y_S$ should reason: "I am the lucky 1% branch. My existence does not confirm MWI; it just confirms I am in the tail of the distribution. $Y_0$ correctly predicted that most of his future measure would die."
  *   To claim the update is rational, $Y_S$ must claim that $Y_0$'s 99% expectation of death was *false*. But in MWI, that expectation was true for 99% of the measure. $Y_S$ is essentially claiming their specific indexical location overrides the objective measure of the wavefunction.

  ### 3. Seminar Discussion Points: Vaidman's Nuance

  To really deepen the discussion, you should introduce Vaidman's specific distinction between **"Probability of Finding"** vs. **"Probability of Existence."**

  Vaidman argues that while the *measure* of the survival branch is low, the *probability of finding oneself* in a survival branch (conditional on being asked) is 1. He accepts the credence update but warns against its practical utility.

  **The "Caring Measure" Argument:**
  Even if $Y_S$ updates their belief to "MWI is true," this should not change their decision theory *before* the experiment.
  *   Pre-trigger $Y_0$ knows that if they run the experiment, 99% of their measure dies.
  *   Post-trigger $Y_S$ knows they survived.
  *   But $Y_0$ should not run the experiment hoping for immortality, because $Y_0$ cares about *all* their successors. The fact that one successor gets to update their beliefs doesn't compensate for the fact that the vast majority of successors (by measure) cease to exist.

  **The "Inference to the Best Explanation" Trap:**
  Ask your students: If QS works as evidence, does it work for *any* unlikely survival?
  *   If I survive a plane crash (1 in 1,000,000 chance), do I update toward MWI?
  *   In SWT, I am a 1-in-a-million lucky guy.
  *   In MWI, I am a 1-in-a-million measure branch.
  *   Why is the quantum trigger special?
  *   *Answer:* In MWI, the survival is *deterministic* somewhere in the wavefunction. In SWT, it is probabilistic.
  *   *Counter:* But my *experience* is probabilistic in both. The "deterministic somewhere" is inaccessible to me. If subjective probability tracks measure, the experience is identical. Therefore, survival is not evidence for MWI over SWT, it is just evidence that I am lucky.

  ### Summary for the Seminar

  1.  **The Asymmetry is Indexical:** The subject conditions on existence ($P(\text{Experience} | \text{Dead}) = 0$); the observer conditions on the setup ($P(\text{See Corpse} | \text{MWI}) \approx 1$).
  2.  **The Update is Contested:** It requires rejecting the Born Rule as a guide for subjective expectation (Branch Counting) or adopting a specific Anthropics (SIA + Restricted Reference Class).
  3.  **The Decision Theory Fails:** Even if the update is rational *post-hoc*, it provides no *pre-hoc* reason to engage in the experiment. The pre-branch self has high measure weight on death.
  4.  **The "Luck" Objection:** Finding oneself in a low-measure branch is consistent with MWI but doesn't confirm it over SWT + Luck, unless one assumes existence *itself* is the evidence, which begs the question.

  This framework moves the conversation from "I can't die!" to "What is the relationship between wavefunction measure and subjective credence?" which is the actual philosophical meat of the Everett interpretation.
