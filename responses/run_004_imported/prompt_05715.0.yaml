answer: |-
  You're right to feel a bit tripped up by this—it flips the modern, legalistic idea of lying (which focuses on objective facts) on its head. For Augustine, lying is a sin of the **heart**, not just a mistake of fact.

  The core of Augustine's definition in *De Mendacio* is that a lie occurs when there is a disconnect between what you believe in your mind (*mens*) and what you express with your tongue. He calls this speaking *contra mentem* ("against one's own mind").

  Here are the two examples you asked for, tailored to Augustine's specific framework.

  ### Example 1: The Statement is TRUE, but it IS a Lie
  **The Scenario:**
  Imagine a man named Marcus is hiding his friend in his attic to protect him from a persecutor. A soldier comes to the door and asks, "Is your friend in this house?"
  *   **Marcus's Belief:** Marcus *believes* his friend is still up in the attic.
  *   **Marcus's Statement:** Marcus says, "No, he is not here."
  *   **The Objective Reality:** Unknown to Marcus, his friend actually snuck out the back window five minutes ago. So, objectively, the friend is **not** there.

  **Why Augustine calls this a lie:**
  Even though Marcus's statement matches reality (the friend really isn't there), Marcus is still guilty of lying. Why? Because he spoke *contra mentem* (against his mind). In Marcus's head, he believed the truth was "He is here," but he chose to say "He is not here."
  For Augustine, the sin happens in the moment Marcus intentionally creates a disconnect between his belief and his speech with the **will to deceive** (*voluntas fallendi*). He intended to lead the soldier into error, even if God's providence made the statement factually correct. The "double heart" is present.

  ### Example 2: The Statement is FALSE, but it is NOT a Lie
  **The Scenario:**
  Imagine a woman named Sarah is asked by a traveler, "Does the road ahead lead to the city?"
  *   **Sarah's Belief:** Sarah genuinely believes the road leads to the city. She has traveled it many times before and has no reason to think otherwise.
  *   **Sarah's Statement:** Sarah says, "Yes, that road leads to the city."
  *   **The Objective Reality:** A landslide occurred an hour ago that completely blocked the road. So, objectively, the road **does not** lead to the city anymore.

  **Why Augustine says this is not a lie:**
  Even though Sarah's statement is factually incorrect, she is not a liar. She spoke *secundum mentem* (according to her mind). What was on her tongue matched what was in her heart.
  Augustine classifies this as **error** or **mistake**, not a lie. There is no *voluntas fallendi* (will to deceive) because she isn't trying to trick the traveler; she is trying to help him based on the truth as she understands it. For Augustine, you cannot be morally culpable for a lie if you do not know you are speaking falsely. The sin of lying requires the conscious choice to betray the truth you hold in your own conscience.

  ### Summary of the Augustinian Logic
  To nail this in your class, you can summarize it like this:

  1.  **Lying is Internal:** For Augustine, truth and falsehood are primarily properties of the **speaker's intention**, not just the proposition's relationship to reality.
  2.  **The "Double Heart":** A lie is a form of betrayal against your own conscience. If you say what you believe to be false, you are fracturing your own integrity, regardless of whether the statement accidentally turns out to be factually correct.
  3.  **Mistake vs. Malice:** Being wrong is a human limitation; lying is a moral failure. Augustine cares about the moral failure.

  So, in short: **You lie when you try to deceive, not when you happen to be wrong.**
