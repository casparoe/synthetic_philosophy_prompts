          *   Point 2 (Loopholes): Superdeterminism (methodological cost) vs. MWI (ontological cost). MWI is the bigger threat to the "No-Locality" thesis.
          *   Point 3 (No-Signalling): Distinguish "Signal Locality" from "Bell Nonlocality." Affirm that "Nonlocality" is the correct term for the violation of Local Causality, even without signalling.
