          *   Structure: High probability for each ticket losing ($P(L_i) \approx 1$). High probability that *some* ticket wins ($P(\exists i, W_i) = 1$).
          *   Nature of Justification: Purely statistical/probabilistic. Independent events (mostly).
          *   Intuition: It seems irrational to believe of any *specific* ticket that it will lose, even if the odds are 1 in a million.
          *   Resolution Tendency: Deny the Aggregation Principle (Justified $B(p)$ + Justified $B(q)$ $\nrightarrow$ Justified $B(p \land q)$). Or, deny that high probability alone justifies belief. We usually *don't* believe of any specific ticket it will lose.
      *   **Preface Paradox (Makinson):**
          *   Structure: Author believes every claim in the book ($B(c_1), ..., B(c_n)$) based on evidence/research. Author also believes the book contains at least one error ($B(\exists i, \neg c_i)$) based on humility/fallibility.
          *   Nature of Justification: Evidential/Epistemic (not purely statistical). Dependent events (errors might cluster).
          *   Intuition: It seems rational to believe the claims *and* rational to believe there's an error.
          *   Resolution Tendency: Accept the inconsistency (Dialetheism/Paraconsistency) or treat the belief in error as a general defeater that doesn't target specific claims. We *do* believe the specific claims.

      *   **The Friend's Claim:** All such cases are Lotteries (statistical, specific beliefs should be dropped).
      *   **The User's Claim:** Some are Prefaces (evidential, specific beliefs can be kept despite general doubt).

