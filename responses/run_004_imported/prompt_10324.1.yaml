answer: |-
  The coffee shop table was littered with receipts. Alex, our mutual friend, had just handed over the last few dollars to complete the cycle. He held the concert ticket he started with an hour ago—Item A—but his wallet was lighter by three transaction fees. He looked dazed, staring at the ticket as if it were a foreign object.

  I nudged Elias, who was watching Alex with a look of cold calculation. Across from us, Mara watched with a mixture of pity and frustration.

  "It's over," Elias said, tapping his pen against his notebook. "And it was inevitable the moment he accepted the first trade."

  Mara shook her head. "It wasn't inevitable. It was a failure of will. He lacked resolution."

  Elias raised an eyebrow. "Resolution? He didn't lack willpower; he lacked foresight. This is classic sophisticated choice. At the moment of the first trade, Alex should have looked down the tree. He should have seen that if he took B, he'd be compelled to take C, and then compelled to pay to get back to A. Knowing he'd cave at the end, the rational move was to refuse the first trade entirely."

  "But that's just managing weakness," Mara countered, leaning in. "You're saying he should have surrendered before the battle began because he knew he'd lose. Resolute choice says he should have adopted a plan—'I will keep A'—and treated that plan as binding. He should have taken the first trade if it fit the plan, but then *refused* the subsequent trades even when they looked locally advantageous."

  Elias scoffed softly. "Binding? How? There was no contract, no gun to his head. At the third step, he preferred A plus the fee over C. That was his preference in the moment. If you tell him to ignore his current preference just to satisfy a past intention, aren't you just describing stubbornness? What separates 'resolution' from simply refusing to update your beliefs and desires?"

  "It separates an agent from a series of snapshots," Mara said sharply. "You treat Alex as three different people: Alex-1, Alex-2, and Alex-3. Alex-1 makes a deal, Alex-2 honors it, Alex-3 cleans up the mess. If rationality is just about maximizing satisfaction at each snapshot, then yes, the money pump is unavoidable for cyclic preferences. But if rationality applies to the *person* over time, then the plan has authority. Ignoring a local gain to honor a global plan isn't stubbornness; it's integrity."

  "Integrity doesn't pay the fees," Elias shot back. "And you're dodging the mechanism. If Alex-3 is facing the choice between C and A-minus-fee, and he prefers A-minus-fee, he takes it. You can't tell him 'no' unless you install some external enforcer. Since there is no enforcer, the only rational thing Alex-1 could have done was anticipate Alex-3's weakness and block the sequence at the start. That's sophistication. It accepts the world as it is."

  "And that acceptance is the problem!" Mara's voice rose, drawing a glance from the barista. She lowered it. "By treating future weakness as a fixed constraint, you guarantee the irrationality. You're saying rationality is purely synchronic—a matter of optimizing the present moment given the future. I'm saying rationality is diachronic. It's about the shape of the whole life. If I can't commit my future self to a plan without an external enforcer, I'm not an agent. I'm a leaf in the wind."

  Elias leaned forward, resting his chin on his hand. "But here's the trap, Mara. To refuse that first trade—which we both agree he should have done—you have to admit that the *sequence* matters more than the *step*. But if the sequence matters, aren't you already admitting that Alex-1 is bound by what Alex-3 will do? You say I treat the future as a constraint. But if you refuse the first trade to avoid the third, aren't you letting the third trade dictate the first? You're still letting the future bind the present. You're just doing it through prediction rather than resolution."

  "No," Mara said, shaking her finger. "There's a difference between *predicting* you will jump off a cliff and *deciding* not to. Sophisticated choice says, 'I will jump, so I shouldn't start walking toward the edge.' Resolute choice says, 'I will not jump, so I can walk toward the edge if I need to.' The sophisticated agent is a slave to their predicted future preferences. The resolute agent is the master of them."

  "But how do you master them?" Elias pressed, his pen hovering. "At the moment of choice, the preference is real. If Alex-3 genuinely prefers A-minus-fee to C, and he chooses A-minus-fee to honor a plan, he is acting against his preference. If he chooses C, he violates the plan. You say he's the master. I say he's either irrational or he's lying to himself about what he prefers. Sophistication avoids this by saying the preference at step one *incorporates* the cost of step three. It cleans the ledger synchronically."

  Mara sighed, looking at Alex, who was now quietly gathering the receipts. "You clean the ledger by cutting off the future. You say, 'I can't trust myself, so I won't act.' That's a theory of rationality for people who have given up on agency. My point is that refusing the first trade *does* require a binding commitment. You claim sophistication doesn't need binding. But if Alex-1 refuses the trade *because* of what Alex-3 will do, he is effectively binding Alex-3 by pre-empting him. You're doing exactly what I am—treating the timeline as a single unit—but you're calling it 'prediction' to avoid admitting you need commitment."

  "I call it prediction because it works without magic," Elias said. "I don't need to believe Alex-3 has a magical ability to ignore his preferences. I just need to believe he won't. It's a causal chain. Your resolute choice requires a normative force that travels through time. Why should Alex-3 care about Alex-1's plan? Unless you answer that, resolution is just a word for 'wishing you were different.'"

  "Because Alex-1 and Alex-3 are the same person!" Mara insisted. "That's the normative force. If rationality is only synchronic, then 'person' is just a label for a temporal slice. If I'm right, rationality is fundamentally diachronic. The unit of assessment isn't the choice; it's the policy. If you assess the policy, the money pump never starts. If you assess the choice, the pump is inevitable."

  Elias sat back, finally capping his pen. "So we're at the bedrock. You think rationality is about being a unified self over time, even if it means overriding local desires. I think rationality is about making the best move available now, given that you are a fragmented self over time."

  "Exactly," Mara said. "And because you treat the self as fragmented, you justify the loss. You say, 'Well, given he was fragmented, he played the game perfectly.' I say the fragmentation is the failure."

  Alex stood up, pocketing the ticket. "I'm going home," he muttered.

  Elias watched him go. "He played the game perfectly," he whispered.

  Mara watched him too. "He lost the game," she replied. "And so did you, if you think that's the best we can do."
