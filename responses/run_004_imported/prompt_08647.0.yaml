answer: |-
  The clock on the cinderblock wall ticked with a sound like a dry bone tapping against stone. Elias sat with his hands folded on the cold metal table, facing the three members of the parole board. They had his file open—the thick, dark folder that contained the geometry of his violence.

  "Mr. Vance," the Chairwoman said, adjusting her glasses. "You've served fifteen years. You've completed every rehabilitation program available. You've earned your GED and mentored younger inmates. Convince us that you are no longer the man who walked in here."

  Elias looked at his hands. They were larger than he remembered, scarred across the knuckles. "I'm not him," Elias said. His voice sounded rusty from disuse. "That man burned because he was made of kindling. I'm not made of that anymore."

  "And who changed you?" the second board member asked, pen hovering over paper.

  Elias paused. He wanted to say *I did*. He wanted to claim the quiet nights reading philosophy, the moments he chose breathing over rage, the years of swallowing pride until it dissolved. He wanted to stand up and take credit for the sculpture he had become.

  But as he opened his mouth, he saw the chain.

  He remembered the first book he read. *The Count of Monte Cristo*. He hadn't chosen it. It was left on a bunk by a lifer named O'Malley who died of a heart attack the week before. Elias had picked it up because he was lonely, and the loneliness was a product of a childhood spent in foster homes where silence was safer than speech.

  Why was he lonely? Because his temperament was wary. Why was his temperament wary? Because of the way his nervous system fired, a genetic lottery ticket drawn before he took his first breath.

  He thought about the decision to stop fighting. He remembered the moment he walked away from a yard conflict three years ago. He had felt a surge of superiority, a desire to be *better* than the others. But where did that desire come from? It was a seed planted by a therapist who had shown him kindness he didn't expect. And why did that kindness work? Because Elias had a latent capacity for shame, a sensitivity he didn't choose.

  He tried to find the place where *he* started. He imagined himself as a sculptor, chiseling away the rough edges of his own character. But when he looked for the chisel, he saw it was handed to him by a teacher. When he looked for the strength to swing it, he saw it came from food provided by the state, from hormones regulated by sleep, from a brain chemistry altered by medication.

  Even the wish to change himself—the very engine of his redemption—was not his own. It was an echo of someone else's voice, a reaction to a stimulus, a ripple from a stone thrown into the water long before he was born.

  He looked up at the board. They were waiting for him to say *I chose this*. They needed him to be the author so they could justify releasing the character. If he wasn't responsible for the crime, the punishment was unjust. If he wasn't responsible for the redemption, the release was unearned. They needed the magic trick. They needed the ghost in the machine.

  "I didn't change myself," Elias said softly.

  The Chairwoman frowned. "Excuse me?"

  "The man who walked in here... he couldn't have done this. He didn't have the tools. The tools came from outside. The desire to use them... that came from outside too." Elias tapped his chest. "I'm just the place where it happened. I'm the ground where the seed grew, but I didn't plant it. I didn't make the rain."

  The third member sighed, scribbling notes. They looked disappointed. They heard defensiveness. They heard a man refusing to take ownership of his recovery, which sounded like a risk.

  Elias saw their pens moving and knew he was losing them. He realized then that the truth was unusable here. The system required a soul that could stand alone, uncaused. It required a god that created itself.

  He looked at his hands again. He felt a sudden, vertiginous lightness. If he wasn't the author of the violence, he wasn't the author of the penance either. The weight of the guilt lifted, but so did the pride. He was neither monster nor saint. He was just a event. A occurrence.

  "Mr. Vance," the Chairwoman said sternly. "Taking responsibility is the first step of accountability. Do you understand what you did?"

  Elias looked at her. He saw the lines of worry on her face, the way her posture was shaped by her own history, her own biology, her own unchosen burdens. She was waiting for a lie. She needed him to claim a power neither of them possessed.

  "I understand," Elias said. He didn't say *I chose it*. He didn't say *I deserve this*. He just sat there, a vessel waiting to be poured into, watching the clock tick forward, second by unchosen second.

  The Chairwoman exchanged a look with her colleagues. They saw humility. They saw a man finally breaking.

  "We'll review your file," she said.

  Elias nodded. He stood up, his chains rattling, and walked back to the cell he hadn't built, guarded by men who hadn't chosen their posts, in a world that spun on without asking permission from anyone.
