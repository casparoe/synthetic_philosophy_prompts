prompt: |-
  I'm the chair of my senior class's 'class gift' committee (the group that decides what our grade's fundraising goes toward before we graduate). Every year the money either gets spent right away on us (a mural, extra prom funds) or goes into the class endowment that pays out small scholarships to future classes forever, and this year we raised way more than usual so its an actual decision. Half the committee says a dollar spent on us now obviously matters more than a dollar for some kid 40 years from now who we'll never meet, so why sacrifice for them; the other half says thats just bias toward whoever's alive right now and future students deserve equal consideration. A few people also brought up legit reasons to favor now anyway, like the endowment could get mismanaged or the school could close, so future payouts aren't even guaranteed. Can you write the memo I'm presenting Friday? It needs one specific recommendation (like what % goes where) and has to take the 'future kids just count less' side seriously instead of just calling it selfish, since half my committee actually believes it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Senior Class Gift Committee.
      *   **Audience:** The Committee (split 50/50 on the issue).
      *   **Topic:** Allocation of a larger-than-usual fundraising surplus (Spend Now vs. Endowment).
      *   **Conflict:**
          *   Side A (Present Bias): Money spent now matters more; future kids are abstract/unknown; "why sacrifice?"
          *   Side B (Future Equity): Bias toward the living is unfair; future students deserve consideration.
          *   Side C (Risk): Endowment might be mismanaged or school might close (uncertainty).
      *   **Requirements:**
          *   Must make *one specific recommendation* (e.g., a specific split percentage).
          *   Must take the "future kids count less" argument seriously (validate it, don't dismiss it as selfish).
          *   Tone: Persuasive, balanced, leadership-oriented, practical.
          *   Format: Memo.
          *   Deadline: Presenting Friday (implies urgency/finality).

  2.  **Determine the Recommendation:**
      *   *Option 1: 100% Now.* Alienates the Endowment side. Ignores legacy.
      *   *Option 2: 100% Endowment.* Alienates the Present side. Ignores the "uncertainty" risk and the "we earned this" feeling.
      *   *Option 3: 50/50 Split.* Too indecisive? Might feel like a cop-out.
      *   *Option 4: Weighted Split (e.g., 70/30 or 60/40).* Acknowledges the primary claim (we are here now) while securing a legacy.
      *   *Decision:* A **70/30 split favoring the present** seems most strategic. It validates the "Present" argument as the priority (since they are the ones raising the money and graduating) but secures a meaningful legacy without pretending the future is equal to the present. It also mitigates the risk argument (if the school closes, at least 70% was enjoyed).
      *   *Refinement:* Let's make it concrete. 70% to Class Experience (Prom/Graduation/Mural), 30% to Endowment.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the success (raised more than usual) and the weight of the decision. Set the tone (respectful disagreement).
      *   **Validating Side A (The Present):** This is crucial. I need to articulate *why* they feel money now matters more.
          *   *Arguments:* Tangible impact, shared memory, uncertainty of the future, we earned this.
          *   *Phrasing:* "Immediate utility," "certainty of benefit," "our shared experience."
      *   **Validating Side B (The Future):** Acknowledge the ethical weight.
          *   *Arguments:* Legacy, paying it forward, community continuity.
      *   **Addressing Side C (Risk):** Acknowledge the practical concern about endowment management/school stability.
      *   **The Recommendation:** State the split clearly.
      *   **The Rationale:** Explain *why* this split bridges the gap.
          *   It prioritizes the present (validating Side A).
          *   It secures a legacy (validating Side B).
          *   It limits exposure to risk (validating Side C).
      *   **Closing:** Call to action (vote/approval).

  4.  **Refining the Tone (The "Future Kids Count Less" Challenge):**
      *   *Avoid:* "It's selfish to only think of ourselves."
      *   *Use:* "There is a moral weight to proximity. We know our needs. We share this moment. A dollar today has higher utility for us than a discounted dollar tomorrow."
      *   *Concept:* Time preference. It's economically and psychologically valid to value present consumption higher than future consumption, especially when the future beneficiaries are unknown.
      *   *Key Phrase:* "We are not obligated to sacrifice our senior year for strangers, but we are invited to leave a door open."

  5.  **Drafting the Content (Iterative refinement):**

      *   *Subject Line:* Needs to be clear. "Recommendation on Class Gift Allocation."
      *   *Intro:* Great job fundraising. Big decision.
      *   *The "Present" Argument:* Don't call it bias. Call it "certainty" and "shared experience." The money solves *our* problems (prom costs, senior trip). The future student is hypothetical.
      *   *The "Future" Argument:* Legacy. But acknowledge the risk (school closure).
      *   *The Compromise:* 70/30. Why? Because 70% acknowledges the "Present" priority. 30% is enough to make a difference later without hurting us now.
      *   *Risk Mitigation:* If the school closes, we still had our prom. If it stays open, we helped.

  6.  **Review against Constraints:**
      *   One specific recommendation? Yes (70/30).
      *   Take "future kids count less" seriously? Yes, by framing it as "certainty vs. uncertainty" and "proximity of benefit."
      *   Memo format? Yes.
      *   Tone? Leadership, decisive but empathetic.

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "selfishness" and "rational preference for certainty" is clear. (Self-correction: Make sure I don't sound *too* dismissive of the future, or the Endowment side will revolt. Balance is key.)

      *   *Adjustment:* Instead of saying "future kids count less," phrase it as "the utility of a dollar is higher for us now." It's the same economic concept but sounds less cold. Actually, the prompt asks to take the "future kids just count less" side seriously. I should address the moral weight of that directly but frame it as "moral proximity."

      *   *Revised Plan:* Explicitly state that favoring the present isn't inherently immoral, it's a recognition of community boundaries. We are *this* class.

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Senior Class Gift Committee
  **FROM:** [Your Name], Committee Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Allocation of Class Surplus

  **Overview**

  First, I want to acknowledge the incredible work this committee has done. We have raised a surplus significantly larger than any recent senior class. This is a testament to our engagement and generosity. However, this success brings a difficult decision: how to allocate funds between immediate class benefits (prom, graduation, senior mural) and the Class Endowment (scholarships for future students).

  We are currently split. One half of the committee argues that resources should prioritize our tangible, shared experience now. The other half argues for an ethical obligation to future students. A third concern has been raised regarding the long-term security of the endowment itself.

  After reviewing these perspectives, I am submitting a formal recommendation for a **70/30 split**, with 70% allocated to immediate senior class experiences and 30% allocated to the Class Endowment.

  **Rationale: Valuing the Present Without Ignoring the Future**

  To reach this decision, we must be honest about the arguments on both sides. I want to specifically address the argument that a dollar spent on us matters more than a dollar spent on a student forty years from now.

  There is a tendency to dismiss this view as selfishness. I believe that is a mischaracterization. This view is rooted in **moral proximity and certainty.**

  1.  **Certainty of Impact:** We know who we are. We know the financial pressure of prom, the desire for a lasting mural, and the value of a funded senior trip. A dollar spent here yields a guaranteed return in community building and memory-making for the people who actually raised the money. A dollar sent forty years into the future is speculative.
  2.  **Risk Mitigation:** As several members noted, there is no guarantee this institution will exist in its current form in 2060. Endowments can be mismanaged, restricted, or rendered obsolete by policy changes. If the school closes or the fund is frozen, a 100% endowment contribution results in 0% utility for anyone. By prioritizing the present, we ensure the money definitely serves *someone*.
  3.  **Community Boundaries:** We are the Senior Class of 2024. Our primary obligation is to each other. While we are part of a broader school community, it is not inherently unethical to prioritize the cohort that did the work. We are not obligated to sacrifice our senior year for strangers, even if we are invited to help them.

  **Rationale: The Case for Legacy**

  However, dismissing the future entirely ignores the value of legacy. Even if future students "count less" in terms of immediate urgency, they still count.

  1.  **Symbolic Value:** Contributing to the endowment signals that we view ourselves as part of a continuum, not just consumers of a high school experience.
  2.  **Compounded Impact:** While a future dollar is uncertain, a future dollar in an endowment can sometimes grow. A 30% contribution today could fund a meaningful scholarship later, creating a story about *us* that lasts longer than a mural might.

  **The Recommendation: 70% Present / 30% Future**

  A 50/50 split feels like a compromise that satisfies no one. A 100/0 split burns bridges. The **70/30 split** is a strategic prioritization.

  *   **70% to Class Experience:** This affirms that the primary beneficiaries of our fundraising should be us. It ensures we can fund the prom subsidy, the mural, and graduation events without budget anxiety. It acknowledges that our time here is finite and immediate.
  *   **30% to Endowment:** This secures a legacy without crippling our current experience. It is enough to make a real difference in the future if the fund remains viable, but small enough that if the school closes or the fund is mismanaged, we have not sacrificed our own senior year for nothing.

  **Next Steps**

  This allocation allows us to celebrate our success concretely while still leaving the door open for the future. It respects the view that our time and money have the highest utility right now, without completely closing our hands to the next generation.

  I ask that we move to a vote on this allocation structure this Friday so we can finalize budgets with our vendors.

  Thank you for your passion and hard work. Let's finish strong.
