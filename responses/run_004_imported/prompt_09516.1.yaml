      *   *Hart's Concession:* Hart admits in the *Postscript* (1994) that the historical account was simplified, but maintains the philosophical point. Marcus's Move 5 aligns with Hart's later view actually.
      *   *Nuance:* Make sure not to declare a "winner" of the debate, but a winner of the *exchange*.

  8.  **Final Polish:** Check against the user's prompt (PhD level, move-by-move, flag missing bits, address 4 vs 5 specifically). Ensure the distinction between validity and efficacy is clear.

  *(Self-Correction on Move 3)*: Marcus says Fuller's test is a matter of degree and can target a single enactment. Fuller actually argues that a system *totally* failing the internal morality ceases to be a legal system. However, he allows that specific rules might be so iniquitous they aren't law. Naomi's pushback here is strong because Fuller's theory is systemic. I need to point out that Marcus is stretching Fuller slightly to fit the specific statute.

  *(Self-Correction on Move 4)*: Naomi cites Hart's footnote. This is likely referring to the *Postscript* or the 1958 Harvard Law Review reply. Hart conceded the historical simplification. This is a strong point for Naomi.

