      *   *Why?* Because the "indeterminism" only arises if you insist that point $p \in M$ at time $t_2$ is the "same" point as $p \in M$ at time $t_1$ independent of the metric field. But in GR, coordinates are just labels.
      *   *Observables:* Physicists calculate invariant quantities (curvature scalars, proper time between worldlines, gravitational wave strain at a detector). These are diffeomorphism-invariant. The Hole Argument does not affect these.

  5.  **Formulate the Core Argument (The "Rigorous Sense"):**
