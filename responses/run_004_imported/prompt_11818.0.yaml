answer: |-
  # The Mirage of the Time-Slice: Why Rational Irrationality is a Category Error

  Parfit's Hitchhiker is the stress test of modern decision theory. A driver offers a ride to a dying traveler only if she predicts he will pay upon arrival. Once in town, the traveler faces a choice: pay the fare or keep the money. Causal Decision Theory (CDT), the standard orthodoxy for much of the twentieth century, dictates that the rational agent keeps the money. The ride is already secured; payment yields no further causal benefit. Yet, only a traveler disposed to pay gets the ride. This creates Parfit's unsettling conclusion: to be rational *ex ante* (survive), one must be disposed to act irrationally *ex post* (pay). Parfit labeled this "rational irrationality."

  This verdict suggests a fracture in the concept of rationality itself—that being rational requires cultivating a disposition to ignore rationality's commands at the moment of action. However, this conclusion relies on a specific, contested framing of agency. When weighed against the responses of Constrained Maximization, Resolute Choice, and Functional Decision Theory, Parfit's "rational irrationality" dissolves. It is not an irreducible feature of the world, but an artifact of evaluating rationality at the wrong temporal grain. The correct verdict is that paying the fare is straightforwardly rational, provided we view the agent not as a sequence of disconnected time-slices, but as a temporally extended policy. This has profound implications for ordinary morality: it suggests that promise-keeping is not a moral constraint on rationality, but a constitutive requirement of successful agency.

  ### The Case for Rational Irrationality

  To understand why Parfit's conclusion feels so forceful, one must inhabit the logic of Causal Decision Theory. CDT evaluates acts based on their causal consequences. At the moment the traveler sits in the town square, the causal chain leading to his rescue is complete. The driver's prediction is a fact of the past. Whether he pays or not cannot causally influence whether he was picked up. Therefore, paying costs \$100 and gains nothing. CDT says: *Don't Pay.*

  However, the traveler knows that a CDT-agent would not be picked up. To survive, he must be a different *kind* of agent—one disposed to pay. Parfit argues that we must therefore distinguish between the rationality of dispositions and the rationality of acts. A rational disposition (to pay) leads to an irrational act (paying when it costs utility). Thus, "rational irrationality."

  This position is philosophically costly. It renders rationality self-effacing. A theory of rationality that advises agents to cultivate dispositions that systematically ignore its own direct advice is unstable. It suggests that if you are truly rational at the moment of action, you lose; to win, you must be blind to rationality's immediate demands. While Parfit accepts this as a bitter pill, it signals a failure in the theory generating the paradox, not a deep truth about the universe.

  ### Dissolving the Paradox: Dispositions and Policies

  The alternative responses to the Hitchhiker case—Gauthier's Constrained Maximization, McClennen's Resolute Choice, and the more recent Functional Decision Theory (FDT)—all share a common strategy: they reject the act-centric, time-slice view of agency.

  David Gauthier argues that the fundamental unit of rational evaluation is not the isolated act, but the disposition. It is rational to adopt a disposition of "constrained maximization" (cooperating with those who similarly cooperate) because having this disposition maximizes utility over a lifetime. When the traveler pays in town, he is not acting irrationally; he is executing a rational disposition. The act derives its rationality from the plan that generated it.

  Edward McClennen pushes this further with "Resolute Choice." He argues that a rational agent can bind their future self to a plan chosen at an earlier node. If the traveler resolves to pay before entering the desert, sticking to that resolution is rational, even if the local incentives shift. To defect is to suffer from dynamic inconsistency, a failure of agency.

  Most radically, Functional Decision Theory (and Updateless Decision Theory) dissolves the temporal gap entirely. FDT treats the agent as a substrate-independent algorithm. The driver's prediction is a simulation of that algorithm. The question "Should I pay?" is logically equivalent to "Should my algorithm output 'pay'?" If the algorithm outputs "don't pay," the simulation outputs "don't pay," and the traveler dies in the desert. Therefore, the act of paying in town is logically linked to the prediction at the start. In FDT, paying is the rational act *simpliciter*. There is no tension between the disposition and the act because the act *is* the disposition manifesting.

  ### The Verdict: Elimination, Not Acceptation

  Does "rational irrationality" survive these critiques? No. Parfit's conclusion holds only if we accept the CDT premise that the agent in the town is causally severed from the agent in the desert. But this premise is false in the context of the problem's setup. The traveler was picked up *because* of what he is. To reason in town as if "what he is" does not matter is to reason from a false counterfactual.

  "Rational irrationality" is eliminated by changing what gets evaluated. We move from evaluating *acts at time-t* to evaluating *policies across time*. Under this view, paying the fare is not a sacrifice of rationality to secure a prior benefit; it is the rational execution of the policy that secured the benefit. The "irrationality" Parfit identifies is merely the local utility loss viewed in isolation. But rationality is not about winning every local skirmish; it is about winning the war. An agent who defects in town wins the skirmish (keeps \$100) but loses the war (dies in the desert, or is never picked up again).

  Therefore, the verdict is that "rational irrationality" is a mirage created by myopic evaluation. A fully rational agent does not act irrationally at the moment of payment; rather, the moment of payment is recognized as logically or dispositionally entangled with the moment of prediction. Rationality requires recognizing that you are the same entity in the town as you were in the desert. To defect is to fracture your own agency.

  ### Implications for Ordinary Promise-Keeping

  If we accept that "rational irrationality" is an error of perspective, what becomes of ordinary cases? Most of us do not face omniscient predictors. When I promise to meet a friend for coffee, there is no driver scanning my brain to see if I will show up. Once I am warm in my bed, the benefit of the promise (the social arrangement) is secured. Going out into the cold costs me utility. CDT suggests staying home is rational; morality suggests going.

  However, if the Hitchhiker lesson holds, the structure remains the same, even without the omniscient predictor. The "predictor" in ordinary life is the social fabric and, crucially, my own self-model.

  First, consider reputation. Social interactions are iterated games. Defecting on a promise when it is inconvenient signals to others (and to myself) that I am the type who defects. This reduces future opportunities for cooperation. But this is the standard game-theoretic defense, and it fails in one-off cases where reputation doesn't matter.

  The deeper implication of rejecting "rational irrationality" is about self-conception. To view oneself as a rational agent is to view oneself as a continuous entity capable of planning. If I treat my future self as a stranger who is free to ignore my current commitments whenever local incentives shift, I undermine my capacity to plan at all. I cannot make meaningful plans if I know my future self will defect on them the moment they become costly.

  Therefore, keeping a promise when the benefit is secured is not "morality overriding rationality." It is the maintenance of the integrity of the agent. Just as the Hitchhiker must pay to validate the logic that saved him, the promise-keeper must show up to validate the logic that allowed the promise to be made. If I break the promise, I am not being "locally rational"; I am acting as a different agent than the one who made the promise.

  This reframes the conflict between self-interest and obligation. In the Parfitian view, rationality is a narrow, local maximization that must be curbed by morality (or a cultivated disposition). In the policy-based view, rationality *is* the capacity to coordinate across time. Keeping the promise is instrumentally rational because it preserves the agent's ability to function as a planner. The "cost" of going to coffee is not a sacrifice of rationality; it is the price of maintaining the disposition that makes me a viable partner in cooperation, including with my future self.

  ### Conclusion

  Parfit's Hitchhiker forces us to choose between a theory of rationality that loses (CDT) and a theory that seems to demand we act against our immediate interests (Constrained Maximization/FDT). Parfit chose to call this "rational irrationality." But this label preserves the CDT definition of rationality as the standard, marking the successful strategy as deviant.

  A more robust verdict is to invert the judgment. "Rational irrationality" is not a genuine feature of the world. It is a diagnostic error resulting from evaluating a temporally extended agent as a series of disconnected moments. Every serious response to the case eliminates the paradox by expanding the unit of evaluation from the act to the policy. When we do this, paying the fare and keeping promises emerge not as irrational sacrifices, but as the only coherent actions for an agent that intends to survive and cooperate over time. Rationality is not about what pays off *now*; it is about what it pays to *be*.
