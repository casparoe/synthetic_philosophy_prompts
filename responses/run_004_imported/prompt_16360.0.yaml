  8.  **Final Polish:** Check against the constraint "land on a real answer instead of just listing possibilities." I need to take a stand. The stand is: Aquinas would reject the proof as valid *for humans*, viewing it as a category error regarding how we know God.

  **(Self-Correction during drafting):** I initially thought about bringing up Divine Simplicity too early. I should save that for the "Existence as Property" section. I need to make sure I don't just say "Aquinas is an empiricist." I need to explain *why* that matters for Gödel. Gödel's axioms rely on intuition about "positivity." Aquinas would ask "Where did you get that intuition?" If it's from creatures, it's analogical, not univocal, so the logic breaks. If it's from revelation, it's not a proof.

  9.  **Final Structure:**
