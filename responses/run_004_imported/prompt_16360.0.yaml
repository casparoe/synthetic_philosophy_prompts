answer: |-
  This is a fantastic question because it pits two very different philosophical architectures against each other: Gödel's high-level formal rationalism versus Aquinas's Aristotelian empirical metaphysics.

  You are correct that the standard "Kantian objection" (existence is not a predicate) is too blunt an instrument here. Aquinas predates Kant by centuries, and his objection to Anselm is more nuanced than "existence isn't a property." It is about *how humans know things* and the *metaphysical structure of God*.

  If you sat Aquinas down with Gödel's 1970 manuscript, Aquinas would likely concede that the logic is internally valid (the S5 derivation holds), but he would reject the proof as **epistemologically impossible for humans** and **metaphysically misleading regarding God's nature.** His objections to Anselm would land squarely on Gödel, perhaps even harder, because Gödel makes the *a priori* assumptions even more explicit.

  Here is the breakdown of why Aquinas would reject Gödel's machinery, specifically targeting the axioms and modal structure.

  ### 1. The Epistemological Wall: "Self-Evident in Itself, Not to Us"
  Aquinas's primary objection to Anselm (*Summa Theologiae* I, q. 2, a. 1) is often summarized as "we don't know God's essence." But the specific mechanism of that objection is crucial for Gödel.

  Aquinas distinguishes between a proposition being "self-evident in itself" (*secundum se*) and "self-evident to us" (*quoad nos*).
  *   **In itself:** If you knew the essence of God, you would see that His essence *is* His existence. The predicate "exists" is identical to the subject "God."
  *   **To us:** We do not know the divine essence in this life. We only know God through His effects (creation).

  **The Gödel Clash:**
  Gödel's proof relies on Axioms about "positive properties." For the proof to work, the human mind must be able to grasp the concept of "positive property" in a divine sense and intuitively agree that "Necessary Existence" is one of them.
  *   **Aquinas's Verdict:** He would argue that Gödel is assuming angelic knowledge. To know that "Necessary Existence" is a "positive property" requires you to understand *what existence is* in the absolute sense. Humans only understand existence as it applies to contingent things (things that might not exist). We derive the concept of "necessary existence" by negating contingency, not by grasping it directly.
  *   **The Hit:** Aquinas would say Gödel's axioms are not *per se nota* (known through themselves) to humans. They are abstract intuitions that presume a grasp of divine perfections we simply do not have. Therefore, the argument fails not because the logic is wrong, but because the premises are unknowable to the species attempting the proof.

  ### 2. Divine Simplicity vs. "Properties"
  This is the metaphysical dealbreaker. Gödel's system treats God as a being that *has* properties.
  *   **Gödel:** God is an entity $x$ such that for all properties $\phi$, if $\phi$ is positive, then $\phi(x)$.
  *   **Aquinas:** God is *Ipsum Esse Subsistens* (Subsistent Being Itself). God does not *have* existence; He *is* existence. God does not *have* goodness; He *is* goodness.

  This is the doctrine of **Divine Simplicity**. In God, there is no distinction between subject and attribute, or between essence and existence.

  **The Gödel Clash:**
  Gödel's formalism requires "Necessary Existence" to be a property ($P(NE)$) that can be conjoined with other properties (like Omnipotence, Omniscience, etc.).
  *   **Aquinas's Verdict:** This is a category error. By treating existence as a "positive property" alongside others, Gödel is treating God as a composite being (a substance + attributes). If God is composed of properties, He depends on those properties to be what He is, which violates aseity (self-existence).
  *   **The Hit:** Aquinas would argue that Gödel's definition of God is logically coherent but metaphysically false. You cannot quantify over divine attributes as if they are distinct items in a set. To Aquinas, "Necessary Existence" isn't a property God turns on; it is the ground of His being. Formalizing it as a predicate in a logical system reifies it into something distinct from God's essence, which is idolatrous in a metaphysical sense.

  ### 3. The *A Posteriori* Requirement (The Five Ways)
  Aquinas insists that the only way humans can demonstrate God's existence is *a posteriori* (from effect to cause). This isn't just a preference; it's based on his psychology of knowledge (*nihil in intellectu quod non prius in sensu*—nothing in the intellect that was not first in the senses).

  **The Gödel Clash:**
  Gödel's proof is purely *a priori*. It does not look at the world. It does not rely on motion, causation, or contingency in the empirical world. It relies on the logical relations between concepts.
  *   **Aquinas's Verdict:** For Aquinas, moving from a concept to an existence claim without empirical mediation is impossible for humans. We can define a "unicorn" with perfect logical consistency, but that tells us nothing about its existence. Gödel tries to bridge the gap between *essence* (concept) and *existence* (reality) using modal logic (S5).
  *   **The Hit:** Aquinas would argue that S5 modal logic operates on *concepts*, not *beings*. When Gödel proves "Possibly Necessary $\rightarrow$ Necessary," he is manipulating the *concept* of necessity. Aquinas would say this proves that *if* such a being is possible, it exists. But it doesn't prove the *possibility* is real. Only observation of the world (the Five Ways) can establish that there is a reality corresponding to the concept. Gödel assumes the possibility; Aquinas demands the possibility be demonstrated via effects.

  ### 4. Modal Collapse and Divine Freedom
  You mentioned the "modal collapse" issue (where everything true becomes necessarily true). While modern logicians have tried to patch Gödel's axioms to avoid this, the *spirit* of the proof leans toward necessitarianism.

  **The Gödel Clash:**
  If God's existence is derived from logical necessity alone, and God's nature is defined by logical axioms, does God have freedom?
  *   **Aquinas's Verdict:** Aquinas is adamant that God created the world freely, not by necessity. The world does not *have* to exist. If Gödel's system implies that the existence of a "God-world" system is logically necessary (which modal collapse suggests), it denies the contingency of creation.
  *   **The Hit:** Even if the modal collapse is patched, the *method* implies that God is subject to the laws of logic in a way that constrains Him. For Aquinas, logic is a reflection of God's intellect, but God is not bound by a logical system external to Himself. A proof that "forces" God to exist via S5 logic makes logic superior to God. Aquinas would say God exists because He wills to be, not because a logical axiom compelled Him.

  ### The Honest Verdict

  If Aquinas reviewed Gödel's proof, his verdict would be: **"True in conclusion, false in method, and inaccessible to the human mind."**

  He would not say Gödel is wrong that God exists necessarily. He agrees with that! He would not even necessarily say the logic is invalid *in abstracto*.

  He would argue that:
  1.  **The Axioms are Unknowable:** We cannot know which properties are "positive" in the divine sense without already knowing God, which makes the argument circular for us.
  2.  **The Metaphysics are Wrong:** Treating existence as a property violates Divine Simplicity.
  3.  **The Epistemology is Angelic:** This is a proof for a being that knows essences directly (an angel or God), not for a human who knows through senses.

  **Does Gödel dodge Anselm's objection?**
  No. Aquinas's objection to Anselm wasn't just about the phrase "that than which nothing greater." It was about the **presumption that the human intellect can grasp the divine essence sufficiently to deduce existence from it.** Gödel's machinery is fancier, but it makes the exact same presumption. It assumes we can define the divine essence via "positive properties" and manipulate them to yield existence.

  Aquinas would tell Gödel: "You have built a perfect map of a territory you have never visited. The map is consistent, but it cannot prove the territory exists. For that, you must look at the trees (creation), not the legend (logic)."

  So, Aquinas would reject the proof not as a logical failure, but as an **epistemological overreach.** He would maintain that the Five Ways are the *only* valid proofs for humans, because they are the only ones that respect our limited mode of knowing. Gödel's proof, to Aquinas, would look like a brilliant piece of theology masquerading as logic—something to be believed by faith, not demonstrated by reason.
