prompt: |-
  So I spent thirty-five years running a molecular biology lab before I retired, and now they've got me on the university's research integrity committee. Current case: the core imaging data behind Figure 3 of a well-cited paper from the lab can't be reproduced -- a grad student building on it went back to the raw files and the numbers don't match whats published. The postdoc who generated the data left research years ago and wont answer emails. The two remaining co-authors, still faculty here, say they simply trusted her the way you'd trust any careful colleague you'd known for a decade, no red flags at the time, and shouldn't be held responsible for data they never personally generated or checked. A few younger members want a blanket rule instead: nobody may ever rely on a co-author's word about data alone, no matter how trusted, without an independent check. Funnily enough I've been reading about this exact fight in epistemology over testimony lately -- whether trusting what someone tells you is its own basic source of justification, or whether it only really counts once you can cash it out in evidence you could've checked yourself -- and I can't settle that even in the abstract, let alone here. Could you draft the memo I'll circulate before next week's meeting? I need an actual recommendation -- clear them, find them at fault, or something in between -- with a concrete timeframe, plus a call on what the policy should be going forward, and it has to take the "reasonable reliance on a trusted colleague" side seriously, because if that's never enough I don't see how any collaborative lab ever gets anything done.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired molecular biologist (35 years experience), now on the university's research integrity committee. Experienced, pragmatic, understands lab culture, but grappling with philosophical/ethical nuances.
      *   **Task:** Draft a memo to circulate before the next committee meeting regarding a specific case of research misconduct/data integrity.
      *   **The Case:**
          *   Figure 3 data in a well-cited paper cannot be reproduced.
          *   Raw files don't match published numbers.
          *   Primary data generator (Postdoc) is gone/unresponsive.
          *   Remaining co-authors (Faculty) claim "reasonable reliance" (trusted colleague, no red flags at the time).
          *   Younger committee members want a blanket rule: "No reliance without independent check."
      *   **The Conflict:** Epistemological tension between "testimony as justification" vs. "verificationism." Practical tension between integrity and lab efficiency/collaboration.
      *   **Requirements:**
          *   Actual recommendation (Clear, Fault, or Middle Ground).
          *   Concrete timeframe for resolution.
          *   Policy recommendation for the future.
          *   Must take "reasonable reliance" seriously (cannot demand 100% independent verification for everything, or collaboration breaks).
          *   Tone: Professional, authoritative but collegial, nuanced, actionable.

  2.  **Determine the Stance/Recommendation:**
      *   *Option A (Clear them):* Too risky. Data *is* wrong. Ignoring it undermines integrity.
      *   *Option B (Find them at fault/Sanction):* Too harsh if they truly didn't know. Punishing good-faith reliance discourages collaboration.
      *   *Option C (Middle Ground - "Responsibility without Malice"):* This fits best. Acknowledge the error, require correction/retraction, but distinguish between *negligence* and *fraud*. Establish that while reliance is necessary, *oversight* is the PI's duty.
      *   *Policy:* Cannot mandate 100% independent re-generation of data (impossible). Must mandate *audit trails* and *spot checks*.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty. Validate the user's experience (35 years). Set the gravity of the situation.
      *   **Case Summary:** Briefly state the facts (Figure 3, mismatch, missing postdoc, faculty defense).
      *   **Analysis of "Reasonable Reliance":** This is the core philosophical/practical pivot. Acknowledge that science *requires* trust. If we demand everyone check everything, science stops. *However*, trust is not a substitute for stewardship.
      *   **Recommendation on Current Case:**
          *   Verdict: Not misconduct (fraud), but a failure of stewardship/oversight.
          *   Action: Correction/Retraction of the paper. No professional sanction against the faculty, but a formal note on responsibility.
      *   **Policy Recommendation (The Future):**
          *   Reject the "blanket independent check" rule (impractical).
          *   Propose "Risk-Based Verification." High impact/key claims need more scrutiny.
          *   Data Management: Raw data must be accessible/organized *before* publication, not just "trusted."
      *   **Timeframe:** Set a deadline for the faculty to respond and for the correction to be initiated.
      *   **Closing:** Invite discussion.

  4.  **Refining the Tone:**
      *   Needs to sound like it comes from a senior scientist. Use terms like "PI stewardship," "raw data audit," "correction notice."
      *   Avoid overly academic epistemology jargon (Gettier, reductionism) but acknowledge the underlying principle (trust vs. verification).
      *   Be firm but fair. The younger members need to feel heard (integrity is paramount), but the senior faculty need to feel understood (collaboration requires trust).

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the recommendation too soft on the faculty?
      *   *Fix:* Emphasize that "Correction/Retraction" is a significant mark on a record, even without a fraud finding. It protects the literature.
      *   *Critique:* Is the policy too vague?
      *   *Fix:* Specify "data availability at submission" and "randomized audit protocols."
      *   *Critique:* Did I address the epistemology bit?
      *   *Fix:* Briefly mention that while we can't solve the philosophical debate, we must solve the practical workflow. Trust is a heuristic, not a verification method.

  6.  **Final Polish:** Check constraints.
      *   Recommendation? Yes (Correction, no sanction).
      *   Timeframe? Yes (30 days).
      *   Policy? Yes (Data stewardship, not blanket re-checking).
      *   "Reasonable reliance" respected? Yes.

  7.  **Final Output Generation:** (Proceed to write the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding Case #2023-04 (Figure 3 Data Discrepancy) and Future Data Stewardship Policy

  **1. Purpose**

  This memo outlines my assessment of the discrepancy regarding Figure 3 in the cited publication from the [Department Name], and proposes a path forward for both this specific case and our institutional policy on co-author responsibility. Having reviewed the raw data mismatch, the unavailability of the primary generator, and the statements from the remaining faculty co-authors, I am recommending a middle-ground resolution that balances research integrity with the practical necessities of collaborative science.

  **2. Case Assessment: The Limits of "Reasonable Reliance"**

  The core tension here is between two valid positions: the necessity of trust in collaboration versus the obligation of verification.

  The younger committee members argue that reliance on testimony (a co-author's word) is insufficient without independent verification. Philosophically, this is sound; practically, it is paralyzing. If every co-author were required to independently regenerate or re-analyze every dataset they did not personally produce, multi-author projects would grind to a halt. Science functions on a division of labor that necessitates epistemic trust. We *must* be allowed to trust our colleagues' competence and honesty, or we cannot function as a community.

  However, the faculty co-authors' defense—that they "simply trusted" the postdoc—confuses *interpersonal trust* with *stewardship*. While they are not responsible for fraud they could not foresee, they are responsible for the integrity of the work bearing their names. In a hierarchical lab structure, senior authors are not merely passengers; they are guarantors. "Reasonable reliance" is a valid defense against accusations of *misconduct* (intent to deceive), but it is not a valid defense against *error*.

  **3. Recommendation on Current Case**

  I recommend the Committee adopt the following findings:

  *   **Finding on Misconduct:** There is insufficient evidence to classify this as research misconduct (fabrication/falsification) by the remaining faculty co-authors, given the lack of access to the primary actor and the absence of contemporaneous red flags.
  *   **Finding on Negligence:** The faculty co-authors failed in their duty of data stewardship. Reliance on a colleague is permissible, but reliance without a mechanism for audit is not.
  *   **Required Action:** The faculty co-authors must issue a formal Correction or Retraction (depending on the centrality of Figure 3 to the paper's conclusion) within **30 days**. This corrects the scientific record without necessarily ending the careers of the senior authors.
  *   **Sanctions:** No formal sanctions (suspension, funding bans) are recommended at this time, provided the Correction/Retraction is issued promptly and transparently.

  **4. Policy Recommendation: Moving Forward**

  The proposal by junior members for a "blanket independent check" rule is well-intentioned but operationally unfeasible. Instead, I propose we adopt a **"Risk-Based Data Stewardship"** policy.

  *   **Data Accessibility at Submission:** For any paper submitted with our institution's affiliation, all raw data underlying key figures must be organized, archived, and accessible to *all* listed co-authors prior to submission. A co-author cannot sign off on a paper they technically cannot access.
  *   **The "Spot-Check" Protocol:** PIs and senior co-authors are not required to re-run every experiment. However, they must document a verification step for key findings. This could be a random audit of 10% of raw images, a review of the analysis code, or a replication of a critical control. Trust is the default, but audit is the requirement.
  *   **Shared Liability:** We must codify that listing oneself as a co-author signifies that one has reviewed the *evidence*, not just the *manuscript*.

  **5. Rationale**

  This approach respects the epistemological reality that testimony is a valid source of knowledge in science, provided the system allows for that testimony to be challenged later. It acknowledges that we cannot eliminate error, but we can minimize it through better data hygiene.

  If we rule that "trust is never enough," we destroy collaboration. If we rule that "trust is always enough," we invite negligence. The middle path is: **Trust your colleagues, but verify the system.**

  **6. Next Steps**

  I request this item be placed at the top of the agenda for next week's meeting. I am prepared to draft the letter to the faculty co-authors outlining the requirement for a Correction/Retraction based on the Committee's vote.

  Regards,

  [Your Name]
  Research Integrity Committee
