      *   **Duties to Animals:** Kant famously argues we have no *direct* duties to animals. We have *indirect* duties regarding them. Cruelty to animals is wrong because it dulls our sympathy and makes us more likely to be cruel to humans (violating a duty to humanity).
      *   **Self-Consciousness:** Animals may have empirical self-consciousness (awareness of themselves as objects in the world), but Kant requires *transcendental* self-consciousness (awareness of oneself as a rational subject capable of universal lawgiving) for moral status.
      *   **Legal Personhood (*Rechtspersönlichkeit*):** In the *Doctrine of Right*, legal personality is tied to moral personality. Only those who can bear obligations can have rights.

