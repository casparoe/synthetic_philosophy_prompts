      *   **Tu Quoque:** Explicitly identify the friend's argument as a version of *tu quoque*, which is generally considered a fallacy in logic, even if it has rhetorical force.
      *   **Nuance on "Evidence":** Does hypocrisy provide *evidence* that the norm is false? Generally, no. People act against their better judgment (akrasia) or are self-deceived. However, in some specific contexts (e.g., sincerity conditions), it might undermine the *pragmatic* force, but not the *semantic* truth.

