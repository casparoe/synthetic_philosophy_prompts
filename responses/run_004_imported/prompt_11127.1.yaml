      *   *Cohen (2006, "The Politics of Global Justice" / "Hypocrisy and Moral Standing"):* Cohen discusses states blaming others while violating norms themselves.
      *   *Key Distinction:* The literature distinguishes between *standing to blame* (the authority/right to hold someone accountable) and the *truth/validity of the norm* being invoked.
      *   *User's Error:* The user claims: "once it becomes clear that the accuser has no standing, the charge against the target effectively collapses, in more or less the same way any other unsupported accusation would."
      *   *Correction:* This is a category mistake. Standing is about the *relation* between blamer and blamee, not the *truth* of the proposition "Action X is wrong." If I steal a car, it is wrong even if the person telling me not to steal cars is also a thief. The thief lacks the *moral authority* to scold me, but the act remains wrong.
      *   *Friend's Error:* The friend argues the hypocrisy proves the *claim* (tax avoidance is wrong) is false. This is the *tu quoque* fallacy (appeal to hypocrisy). The literature on standing does *not* support the idea that hypocrisy makes the norm false. It supports the idea that the hypocrite cannot *enforce* or *rightfully protest* the norm.

