answer: |-
  This is an excellent question that cuts to the heart of a common misunderstanding in the literature on moral responsibility. You and your friend are grappling with a distinction that is crucial for moral philosophy but often blurred in public discourse: the distinction between **standing to blame** and the **truth of the norm**.

  The short answer is: **No.** You should not treat a critic's hypocrisy as evidence that their underlying accusation is mistaken. Your friend's argument commits a version of the *tu quoque* fallacy, and importantly, **the literature you are reading (Wallace, Cohen) does not support the claim that hypocrisy invalidates the substance of the moral norm.**

  Here is a breakdown of how to generalize the standing-to-blame literature properly, correcting the interpretation that led to your friend's conclusion.

  ### 1. The Core Distinction: Standing vs. Truth
  The central insight of R. Jay Wallace's work (specifically "Moral Hypocrisy," 2010) and related literature is that moral blame is a **communicative practice** that requires specific authority to be felicitous.

  *   **The Truth of the Norm:** This is the substantive claim (e.g., "Corporate tax avoidance is morally wrong"). This claim stands or falls on its own moral merits, independent of who is asserting it.
  *   **The Standing to Blame:** This is the procedural authority to hold someone else accountable for violating that norm.

  When Wallace argues that a hypocrite forfeits their standing, he is arguing that they lose the **authority to administer the blame**, not that the **blame is undeserved.**

  Think of it like a legal analogy: If a police officer who is currently speeding pulls you over for speeding, you might argue they lack the *standing* to issue you a ticket (or that it is unfair for them to do so). However, their hypocrisy does not change the fact that *you were speeding* and that *speeding is illegal.* The charge against you does not "collapse" in terms of truth; it collapses in terms of the legitimacy of the enforcer.

  ### 2. Diagnosing Your Friend's Error
  Your friend argues: *"It actually discredits her original claim that this kind of avoidance is wrong, since it's the hypocrisy itself that reveals the accusation to have been baseless all along."*

  This is a philosophical error for two reasons:

  **A. The Tu Quoque Fallacy**
  In logic and argumentation theory, pointing out an opponent's hypocrisy (*tu quoque*, "you also") is generally considered a fallacy of relevance. It attacks the person rather than the premise. Just because the Council Member violates the norm does not logically entail that the norm is false. People frequently act against their better judgment (akrasia) or engage in self-deception. A smoker can truthfully say, "Smoking will kill you," even if they smoke. Their hypocrisy makes the advice ironic, perhaps, but not false.

  **B. Misreading the "Collapse" of the Charge**
  You mentioned that you understood the literature to say the charge "effectively collapses... in more or less the same way any other unsupported accusation would." This is where your interpretation needs adjustment.
  *   An **unsupported accusation** collapses because there is no evidence the target did wrong.
  *   A **hypocritical accusation** collapses (in terms of standing) because the *blamer* has no right to speak, even if the target *did* do wrong.

  Wallace's point is that the hypocrite fails to show the necessary **commitment** to the values they are invoking. Because they haven't committed to the value themselves, they cannot rightfully demand it of others. But the *value itself* remains intact.

  ### 3. What the Literature Actually Says (Wallace & Cohen)
  If you return to the texts with this distinction in mind, you will see they protect the norm while punishing the hypocrite.

  *   **Wallace:** He argues that hypocrisy is a failure of "equal standing." By holding others to a standard they exempt themselves from, the hypocrite asserts a false superiority. The remedy is not to say the standard is wrong, but to silence the hypocrite. The target of the blame can say, "Who are *you* to tell *me* this?" not "This thing I did is actually okay."
  *   **Cohen:** In discussing states blaming terrorists, Cohen argues that a state violating human rights loses the standing to condemn terrorists for violating human rights. However, Cohen does not argue that terrorism becomes permissible. He argues that the *political legitimacy* of the condemnation is voided. The moral truth of the prohibition on terrorism remains.

  ### 4. Applying This to the Council Member
  Here is how you should apply the theory to your local news story:

  1.  **Does she have standing?** No. By routing her income through offshore shells while campaigning against it, she has forfeited the moral authority to sanction others for doing the same. She cannot rightfully express moral indignation.
  2.  **Is the underlying claim mistaken?** Not necessarily. Corporate tax avoidance might still be morally wrong (it deprives the community of resources, violates fairness, etc.). Her actions do not prove avoidance is right; they only prove she is a hypocrite.
  3.  **Is pointing out hypocrisy a rebuttal of the substance?** No. It is a rebuttal of the **speaker's authority.**

  **However, there is a nuance:**
  While hypocrisy doesn't disprove the *moral norm*, it can undermine **pragmatic credibility** in a political context. If the Council Member argues, "We must pass Law X because I am a champion of tax justice," her hypocrisy disproves *that* claim. If her argument relies on her personal integrity as evidence for the policy's viability, then her hypocrisy is relevant evidence. But if the argument is "Tax avoidance is wrong because it harms public schools," her personal conduct is irrelevant to the truth of that premise.

  ### 5. Conclusion for Your Seminar
  To generalize the literature properly in your seminar, you should propose the following correction to the group's working definition:

  > **Correction:** Hypocrisy forfeits the **standing to blame**, but it does not negate the **truth of the norm** violated.
  >
  > **Implication:** Pointing out hypocrisy is a legitimate way to block a specific instance of moral blaming (it silences the blamer), but it is **not** a legitimate way to rebut the substance of the criticism (it does not exonerate the blamee).

  Your friend's argument suggests that morality is entirely dependent on the purity of the messenger. The literature you are reading suggests morality is objective (or at least intersubjective), but the *practice of holding people accountable* requires the accuser to be in good standing.

  If you raise this distinction in class, you will likely find that it resolves the tension between "the hypocrite can't speak" and "the wrong is still a wrong." It allows you to condemn the Council Member for her hypocrisy *and* condemn the tax avoidance, without conflating the two.
