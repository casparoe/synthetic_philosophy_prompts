      *   *Section 2: Analyzing the Friend's Claim.* Identify the *tu quoque* fallacy. Explain why the literature doesn't support the idea that the norm is "baseless." The norm exists independently of the enforcer.
      *   *Section 3: Why the Confusion Happens.* Why does it *feel* like the accusation collapses? Because moral blame is a communicative act. If the communicator is insincere, the communication fails. But the *proposition* remains.
