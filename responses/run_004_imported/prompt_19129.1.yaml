  2.  **Analyze the Subject Matter (Galen Strawson's Basic Argument):**
      *   **Core Argument:**
          1.  To be truly responsible for what you do, you must be truly responsible for how you are (mentally).
          2.  To be responsible for how you are, you must have chosen to be that way.
          3.  To choose to be that way, you must have had reasons/values for that choice.
          4.  To be responsible for *those* reasons/values, you must have chosen them... (Infinite Regress).
          5.  Therefore, you cannot be *causa sui* (cause of yourself) in the required sense.
          6.  Therefore, true/ultimate moral responsibility is impossible.
      *   **Determinism vs. Indeterminism:** Strawson argues the Basic Argument works *regardless* of whether determinism is true or false. It is an argument against *ultimate responsibility*, not just against compatibilism or incompatibilism based on causal determination. Indeterminism (randomness) does not help because random events are not controlled by the agent either. This is a crucial distinction. Many students confuse Strawson's argument with standard Hard Determinism.
      *   **Implications for Practice:** Galen Strawson is generally skeptical about ultimate responsibility. However, does he argue we should *abandon* praise/blame/punishment entirely in favor of consequentialism?
          *   Galen Strawson often distinguishes between "ultimate responsibility" (impossible) and ordinary responsibility practices.
          *   Unlike his father (P.F. Strawson, who wrote "Freedom and Resentment"), Galen is more skeptical about the *justification* of reactive attitudes if they presuppose ultimate responsibility.
          *   However, claiming he concludes they "ought to be abandoned in favor of purely forward-looking, consequentialist reasons" is a strong claim. Galen Strawson often identifies as a "pessimist" about free will but doesn't necessarily prescribe a specific utilitarian reform of punishment in the way the answer suggests. He often says we *cannot* have ultimate responsibility, but he is less prescriptive about abolishing reactive attitudes than, say, a hard incompatibilist like Derk Pereboom might be (though Pereboom also focuses on quarantine models).
