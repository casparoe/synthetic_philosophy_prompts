prompt: |-
  Ok so theres this big mural in our cafeteria that's been there since the 70s, painted by a student here who actually went on to get kind of well known as an artist, so people treat it like real art now, not just decoration. It's been fading and flaking for years and the school finally has money to fix it, and I'm one of two student reps on the committee (teachers, the principal, a couple parents, and us) that has to decide what to do about it. Basically it's either: pay a conservator to stabilize and touch up the actual original paint (expensive, slow, and it'll still look kind of patchy after), or repaint/reprint it so it looks perfect and send the real one to a local museum that's offered to preserve it. Half the committee thinks anything short of saving the actual paint basically destroys a real piece of art; the other half thinks nobody eating lunch cares about "authenticity," they just want it to look good. Can you write the short memo I'd bring to committee -- pick an option (or some combo), give an actual timeline, and actually engage with the preservation side instead of just waving it off as nostalgia, cause I feel like there's a real argument there I can't quite put my finger on.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A 1970s student-painted mural in a school cafeteria. The artist became well-known. It's fading/flaking.
      *   **Decision:** Two main options:
          1.  *Conservation:* Stabilize/touch up original paint (expensive, slow, patchy result).
          2.  *Replication/Relocation:* Repaint/reprint for cafeteria, move original to a museum (looks perfect, preserves original elsewhere).
      *   **Committee Dynamics:** Split 50/50. One side values authenticity/material integrity ("real art"). The other values aesthetics/functionality ("looks good for lunch").
      *   **User Role:** Student Rep on the committee.
      *   **Task:** Write a short memo to the committee.
      *   **Requirements:**
          *   Pick an option (or combo).
          *   Include a timeline.
          *   *Crucially:* Engage seriously with the preservation argument (don't dismiss it as mere nostalgia).
          *   Tone: Professional, persuasive, balanced but decisive.

  2.  **Determine the Stance:**
      *   *Option 1 (Conservation in situ):* Respects the art's history but leaves it looking mediocre in a high-traffic area. Risk of future damage remains high.
      *   *Option 2 (Replication + Museum):* Preserves the physical artifact *better* (climate control) while serving the student body's need for a vibrant space.
      *   *The "Combo" Approach:* This is usually the most diplomatic and effective solution in real-world heritage management. It acknowledges the "aura" of the original while prioritizing long-term survival and current utility.
      *   *Decision:* I will recommend **Option 2 (Replication + Museum)** but framed as a "Preservation through Relocation" strategy. This validates the "real art" argument by ensuring the *actual* paint is saved better than it could be in a cafeteria, while satisfying the "looks good" group.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the significance. This isn't just paint; it's school history.
      *   **The Core Argument (Engaging Preservation):** I need to address the "authenticity" concern. Why is moving it *better* preservation?
          *   *Argument:* A cafeteria is a hostile environment (humidity, heat, grease, traffic). Keeping it there *is* the risk. The museum offers true preservation.
          *   *Argument:* "Authenticity" isn't just the molecules of paint; it's the artist's intent. Did they intend for it to be seen and enjoyed, or to crumble on a wall?
      *   **The Solution:** High-quality facsimile for the cafeteria, original to the museum.
      *   **Timeline:** Needs to be realistic. Assessment -> Replication -> Installation -> Move.
      *   **Closing:** Call to action/unity.

  4.  **Refining the Tone:**
      *   As a student rep, I need to sound respectful but advocate for the student body's experience.
      *   Avoid dismissing the teachers/parents who want conservation. Use language like "material integrity," "long-term stewardship," and "legacy."
      *   Make sure the timeline looks concrete, not vague.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey everyone. We need to fix the mural.
      *   Some want to keep the old paint. I get it, it's historic.
