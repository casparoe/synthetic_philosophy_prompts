answer: |-
  This is a strong reconstruction. You have clearly grasped the core tension Lewis identified. If you post this to LW, the math nitpickers will come for you, but mostly because of one specific slip in the derivation, not the conceptual grasp.

  Here is the line-by-line sanity check, the verdict on your "moral," and the fill-ins on the literature gaps you requested.

  ### 1. The Derivation Check

  Your setup is correct:
  *   **Thesis:** $P(A > B) = P(B|A)$
  *   **Closure:** If $P$ is admissible, $P(\cdot|C)$ is admissible.
  *   **Non-triviality:** $0 < P(B|A) < 1$.

  **The Slip:**
  You wrote:
  > "Now recombine using total probability, conditioning back on A and ~A: $P(A>B) = P(A) \cdot P_B(A>B) + P(\neg A) \cdot P_{\neg B}(A>B)$"

  This is the error. You defined $P_B$ as $P(\cdot | B)$ and $P_{\neg B}$ as $P(\cdot | \neg B)$. To recover $P(A > B)$ using the Law of Total Probability with *these* specific functions, you must partition by **$B$ and $\neg B$**, not $A$ and $\neg A$.

  The correct expansion is:
  $$P(A > B) = P(B) \cdot P_B(A > B) + P(\neg B) \cdot P_{\neg B}(A > B)$$

  **Why it matters:**
  *   In your version, you derived $P(B|A) = P(A)$.
  *   In the standard Lewis version, you derive $P(B|A) = P(B)$.
  *   **Both** imply triviality (that $A$ and $B$ are probabilistically independent for all $A, B$), so your *conclusion* holds, but the *step* is mathematically mismatched. On LW, someone will absolutely comment "You partitioned on A but conditioned on B." Fix this to $P(B)$ and $P(\neg B)$ weights, and the derivation is solid.

  **The Corrected Flow:**
  1.  $P_B(A > B) = P_B(B|A) = 1$ (since $P_B(B)=1$).
  2.  $P_{\neg B}(A > B) = P_{\neg B}(B|A) = 0$ (since $P_{\neg B}(B)=0$).
  3.  $P(A > B) = P(B) \cdot 1 + P(\neg B) \cdot 0 = P(B)$.
  4.  By Thesis, $P(A > B) = P(B|A)$.
  5.  Therefore, $P(B|A) = P(B)$.
  6.  Triviality: $A$ provides no information about $B$.

  ### 2. The "Moral"

  > "You can't have indicative conditionals be ordinary propositions whose credences behave the normal way AND have conditional probability track them."

  **Verdict:** This is accurate and not overselling it.

  In the literature, this is often framed as a trilemma. You cannot jointly hold:
  1.  **Propositionality:** Conditionals express propositions (they are in the domain of $P$).
  2.  **Adams' Thesis:** $P(A > B) = P(B|A)$.
  3.  **Non-Triviality:** There exist $A, B$ such that $0 < P(B|A) < 1$ and $P(A) \in (0,1)$.

  Lewis's result forces you to drop one.
  *   **Drop 1 (The Standard View):** Adams, Edgington, Bennett. Conditionals do not express propositions; they have assertability conditions but no truth conditions. $P(A > B)$ is a shorthand for a constraint on $P$, not the probability of a truth-bearer. This fits your "conditional markets" intuition: the market tracks the ratio $P(A \land B) / P(A)$, not the price of a security that pays out on a proposition $A > B$.
  *   **Drop 2:** Some (like Grice or Jackson) try to maintain truth conditions but argue assertability comes apart from probability. This is less popular for indicatives now.
  *   **Drop 3:** Accept triviality (nobody does this).
  *   **Modify Closure (Stalnaker):** Stalnaker tries to save Propositionality and Thesis by rejecting the **Closure** premise. He argues that conditionalizing on $B$ changes the context in a way that shifts the meaning of $A > B$. Thus $P_B(A > B)$ is not the same proposition as $P(A > B)$ evaluated in the new context. This requires a more complex semantic framework (possible worlds + selection functions) and usually involves **Imaging** rather than Conditionalizing.

  So your one-sentence moral is the standard "Truth-Conditional" takeaway. If you want to be precise for LW, add: "...unless you deny that updating works via standard conditionalization (Stalnaker) or deny conditionals are propositions (Adams/Edgington)."

  ### 3. Filling the Gaps

  **A. The Proof Without Full Closure (Hájek)**
  You recalled correctly. Lewis's 1976 proof assumes the *class* of reasonable credence functions is closed under conditionalization.
  **Alan Hájek (1989, "Probabilities of Conditionals—Revisited")** strengthened this. He showed that triviality results hold for a **single** probability function $P$, provided the Boolean algebra is sufficiently rich (contains $A, B, A>B$, and their combinations). You don't need to assume the whole *class* of functions is closed; you just need the specific function $P$ to satisfy the Thesis for the relevant conditionalizations. This makes the triviality result much harder to dodge by tweaking the "reasonable credence" class.

  **B. Van Fraassen's Response**
  Bas van Fraassen (1976, "Probabilities of Conditionals") is often cited alongside Lewis. His key contribution here isn't a counter-proof, but a clarification of the **Propositionality** assumption.
  Van Fraassen emphasizes that the triviality proof relies entirely on $A > B$ being an event in the algebra (a proposition with a truth value). If $P(A > B)$ is not defined because $A > B$ isn't a proposition, the equation $P(A > B) = P(B|A)$ is category-mistaken, and the proof never starts.
  He uses this to argue *for* the non-propositional view (Adams' view). He suggests that conditionals are not statements of fact but rules for probability kinematics. This supports your "conditional markets" intuition: the market isn't pricing a proposition; it's pricing a ratio.

  ### 4. Note on Conditional Markets (For your Post)

  Since your backstory is about markets:
  *   **Standard Prediction Markets:** Price $P(E)$.
  *     **Conditional Markets:** Usually resolve as "Cancel if $\neg X$, Pay $1$ if $X \land Y$, Pay $0$ if $X \land \neg Y$."
  *   Mathematically, the price of this contract converges to $P(X \land Y) / P(X) = P(Y|X)$.
  *   Lewis's result implies there is **no proposition** $X > Y$ such that a standard security on that proposition would track this price (unless the world is trivial).
  *   Therefore, conditional markets *cannot* be interpreted as markets for the truth of a conditional proposition. They are inherently ratio-tracking mechanisms. This is a solid, defensible claim to make in your shortform.

  ### Summary for your LW Post
  1.  **Fix the partition variable** in the Total Probability step ($B$ vs $A$).
  2.  **Keep the moral**, it's standard.
  3.  **Cite Hájek (1989)** for the single-function proof.
  4.  **Cite Van Fraassen (1976)** for the emphasis on non-propositionality.
  5.  **Confidence:** High. You've reconstructed a 50-year-old philosophical proof from memory/summaries and got 95% of the way there. Just fix the typo.
