answer: |-
  The debate between Jeff McMahan's revisionist account of the ethics of war and the Traditionalist (Walzerian) framework centers on the Moral Equality of Combatants (MEC). Traditionalism holds that combatants on both sides of a war possess equal moral status: they have an equal right to kill enemy combatants and are equally liable to be killed, regardless of the justice of their cause. McMahan rejects this, arguing that liability to defensive harm tracks moral responsibility for unjust threats. Consequently, combatants fighting for an unjust cause are liable to be killed, while those fighting for a just cause are not. In response, Traditionalists have advanced an epistemic argument: since ordinary soldiers cannot reliably determine the justice of their cause (*jus ad bellum*), it is unfair to treat them as liable. This essay assesses whether this epistemic argument succeeds in rehabilitating MEC as a norm for practical judgment, granting McMahan's premises regarding deep morality. While the epistemic argument successfully establishes that unjust combatants are often blameless, it ultimately fails to rehabilitate MEC as a norm for practical judgment. This is because it conflates the conditions for culpability with the conditions for liability, and adopting MEC practically would unjustly sacrifice the defensive rights of just combatants to accommodate the ignorance of unjust ones.

  To understand the Traditionalist reply, one must appreciate the practical predicament of the ordinary soldier. As Michael Walzer and others have argued, the determination of *jus ad bellum* is often complex, obscured by state secrecy, propaganda, and diplomatic nuance. An individual conscript or volunteer is rarely in an epistemic position to independently verify whether their nation's war is one of aggression or self-defense. If McMahan's revisionism were adopted as a practical norm, soldiers would face a paralyzing moral burden: to fight is to risk being a murderer, but to refuse is to abandon one's comrades and country. The Traditionalist argues that because this ignorance is often invincible, we must retain MEC as a convention. It functions as a rule of thumb that allows soldiers to fight without constant moral anxiety and ensures that the rules of war (*jus in bello*) apply symmetrically, facilitating reciprocity and restraint.

  McMahan's rebuttal to this epistemic argument is sharp and relies on a distinction central to revisionist theory: the distinction between justification and excuse. McMahan grants that invincible ignorance may *excuse* an unjust combatant, rendering them not blameworthy for their participation. However, he argues that an excuse does not negate *liability*. To illustrate, McMahan utilizes the analogy of the "innocent aggressor." If a sleepwalker or a person acting under a non-culpable mistaken belief attacks you, they are not morally culpable for the threat they pose. Yet, intuitively, you are still permitted to use necessary force to stop them, even lethally. Their lack of culpability protects them from punishment or blame, but it does not protect them from defensive harm. In the context of war, the unjust combatant, even if ignorant, remains an objective unjust threat to the just combatant. Therefore, the just combatant retains the right to defend themselves, and the unjust combatant remains liable to be killed, even if they are not morally wicked for doing so.

  The crux of the assessment lies in whether this distinction holds when shifting from "deep morality" to "practical judgment." The Traditionalist might concede McMahan's metaphysical point but insist that for *practical* norms—rules we actually teach soldiers and encode in law—MEC is necessary. They argue that a norm that requires soldiers to assess *jus ad bellum* is unworkable. However, this conflates the *application* of the norm with the *content* of the norm. Revisionism does not necessarily require soldiers to be omniscient; it requires them to act on the best available evidence. If a soldier fights in a war that is objectively unjust but subjectively appears just to them, revisionism (via the excuse clause) says they are not blameworthy. The Traditionalist wants to go further and say the opposing soldier is not permitted to kill them.

  This is where the epistemic argument fails to rehabilitate MEC. If we adopt MEC as a practical norm based on epistemic limitations, we are effectively telling the just combatant that they must surrender their right to self-defense because their attacker is ignorant. This creates a profound asymmetry of risk. The unjust combatant is permitted to kill (because MEC grants them equal rights), and the just combatant is permitted to kill (for the same reason). But in reality, the just combatant is defending a legitimate cause, while the unjust combatant is threatening innocent life. To grant the unjust combatant a *right* to kill (which MEC does) rather than merely an *excuse* for killing is to validate the threat they pose. A practical norm should guide agents toward the morally optimal outcome. A norm that grants moral permission to those contributing to unjust slaughter, simply because they are confused, fails to guide the just combatant correctly. It instructs them to treat a defender of aggression as a moral equal to a defender of peace, which obscures the very moral reality the norm is supposed to navigate.

  Furthermore, the Traditionalist reliance on epistemic limitations to restore equality undermines the incentive structure of war ethics. One of McMahan's motivations for revisionism is to deter unjust wars by raising the moral cost for those who fight them. If MEC is rehabilitated via the epistemic argument, soldiers are assured that as long as they follow the rules of engagement, they are morally safe, regardless of the war's justice. This insulates political leaders, who can rely on the "moral equality" of their troops to wage unjust wars without those troops feeling the weight of moral liability. While the epistemic argument claims to be about fairness to the soldier, its practical effect is to lower the barrier to unjust warfare. A norm for practical judgment should not only be actionable but also conducive to justice. MEC, even when grounded in epistemic humility, fails this test by decoupling the permission to kill from the justice of the cause entirely.

  However, the strongest consideration for the Traditionalist is the risk of error. If we abandon MEC, and a just combatant is mistaken about their cause, they may kill unjust combatants believing themselves justified, when in fact they are the aggressors. The epistemic argument suggests MEC acts as a protective shield against this moral catastrophe. Yet, McMahan's framework already accounts for this through the excuse condition. If a combatant on the "just" side is actually mistaken (and thus objectively unjust), they become liable, but if their mistake was invincible, they are excused. The practical difference between the two frameworks is not in the treatment of the ignorant soldier (who is excused in both, liable in neither regarding punishment), but in the rights of the victim. Under MEC, the victim (the objectively just combatant) is told they have no superior claim to life over their attacker. Under revisionism, the victim is told they may defend themselves. In terms of practical judgment, the revisionist norm is superior because it prioritizes the rights of the victim over the moral comfort of the aggressor.

  It is important to distinguish here between moral norms and legal conventions. The epistemic argument succeeds brilliantly in justifying International Humanitarian Law (IHL) as a legal convention. Legally, we cannot try every soldier for *jus ad bellum* violations; we need symmetrical rules for prisoner treatment and war crimes to ensure compliance. But the prompt asks about "practical judgment," which implies the moral reasoning agents should employ when deciding how to act and how to evaluate actions. In this sphere, the legal convenience of symmetry cannot override the moral asymmetry of liability. To judge a soldier's action practically is to ask, "Was this action permissible?" If a soldier poses an unjust threat, killing them is permissible to stop the threat. Their ignorance makes them a tragic figure, not a moral equal.

  Therefore, the epistemic argument does not succeed in rehabilitating the Moral Equality of Combatants as a norm for practical judgment. It succeeds only in rehabilitating a norm of *excuse*. It demonstrates that we should not punish or blame unjust combatants who are invincibly ignorant, but it fails to show that they are non-liable to defensive harm or that their opponents are morally prohibited from recognizing the asymmetry of their causes. To accept the Traditionalist conclusion is to demand that just combatants accept a moral handicap—treating those who threaten innocent life as peers—solely to accommodate the epistemic limitations of the aggressors. While compassion for the ignorant soldier is warranted, it should manifest as forgiveness for their actions, not as a denial of the victim's right to survive.

  In conclusion, while the Traditionalist epistemic argument highlights the genuine difficulties soldiers face in assessing the justice of war, it misidentifies the solution. The solution is not to pretend that combatants are moral equals, but to distinguish between liability and culpability. McMahan's revisionism allows us to judge the unjust combatant as liable to defensive force (preserving the rights of the just combatant) while simultaneously judging them as blameless due to ignorance (preserving fairness to the soldier). The Traditionalist attempt to restore MEC collapses these distinctions, resulting in a practical norm that obscures moral reality and unjustly compromises the defensive rights of those fighting for a just cause. Thus, the epistemic argument fails; we must accept that while soldiers may be excused for their ignorance, they are not, in practice or principle, moral equals.
