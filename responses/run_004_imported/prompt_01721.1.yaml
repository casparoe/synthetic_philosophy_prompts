      *   *Tone:* Keep it academic but accessible, matching the study session vibe.

  7.  **Final Polish:** Check against the prompt's specific dialogue lines to ensure I address each specific claim made by Alex and Josh. (e.g., Alex's "genetics" argument, Josh's "categorically different" argument).

