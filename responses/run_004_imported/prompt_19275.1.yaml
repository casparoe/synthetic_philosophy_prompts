          *   *Weaknesses:* Claims they are "mathematically equivalent." This is the sticky point. $F = D_{KL} + \text{Surprise}$. $F \ge \text{Surprise}$. PE is a component of the accuracy term. They aren't strictly equivalent because of the complexity term. However, for a grad seminar, is this a fatal error? It's a conceptual simplification. The student acknowledges VFE is an upper bound.
