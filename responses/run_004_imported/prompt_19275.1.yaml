              *   *Crucial Check:* The most common "textbook" PP answer for psychosis (Friston/Adams) is **aberrant precision weighting**, often specifically **high precision on prediction errors** (leading to over-learning of noise/delusions) or **high precision on priors** (hallucinations). The student claims **low precision on PEs**. This is the opposite of the "aberrant salience" hypothesis (which is the most common link to dopamine/psychosis in this literature).
              *   *Decision:* This part is technically shaky/incorrect based on the standard literature (e.g., Kapur's aberrant salience translated into PP terms). I need to penalize this.

