          *   Axiom 4: $P(\phi) \to \square P(\phi)$. (Positivity is necessary)
          *   Definition 3: $NE(x) \leftrightarrow \forall \phi (\phi \text{ ess } x \to \square \exists y \phi(y))$. (Necessary Existence)
