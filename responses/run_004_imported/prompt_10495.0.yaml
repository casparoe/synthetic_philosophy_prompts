          *   Format: Question + Short Follow-up (keyed to likely answer).

  2.  **Deconstruct the Core Concept (Surrogate Goals):**
      *   *What is it?* Pre-committing to care about something arbitrary (e.g., paperclips) so that if someone threatens you ("I'll destroy your values unless you pay"), they target the paperclips instead of your actual values (e.g., human welfare).
      *   *Why?* To neutralize acausal extortion (threats from simulators, future AI, etc., who can predict your behavior).
      *   *Key Problems:* Credibility (why believe you care?), Information Hazards (does advertising this make you a target?), Regress (can they see through it?), Equilibrium effects (does this encourage more threats?).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Credibility without Cost.*
          *   *Draft:* How do you make the decoy credible if you don't actually care?
          *   *Refinement:* Need to touch on the pre-commitment aspect. If I know I don't care about the decoy, why won't I just ignore the threat when it comes time?
          *   *Follow-up:* If she says "cryptographic commitment," ask about flexibility.

      *   *Requirement 2: Detection/Infinite Regress.*
          *   *Draft:* What if they know it's a fake goal?
          *   *Refinement:* Focus on the capability of the threatener. If they can model you well enough to threaten acausally, can't they see the surrogate layer? Does this lead to surrogates for surrogates?
