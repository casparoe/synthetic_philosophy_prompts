answer: |-
  Here are ten interview questions designed to stress-test the surrogate goals framework, including the four specific thematic requirements you requested.

  **1. The Comparative Advantage Question**
  Most traditional advice on handling extortion is "never negotiate," aiming to make threats unprofitable by refusing compliance. Surrogate goals seem to accept that negotiation will happen but try to redirect the cost. Why do you view redirection as a more stable equilibrium than refusal, especially given that refusal relies on the threatener believing you are irrational enough to let your actual values be destroyed?

  *   **Follow-up:** If she argues that refusal is too risky against superintelligent threateners, ask: *Doesn't adopting surrogate goals signal that you are willing to negotiate, thereby undermining the "never negotiate" deterrent for those who haven't adopted the surrogate strategy?*

  **2. The Credibility Without Cost Question (Required Topic)**
  For a surrogate goal to work, the threatener must believe you value the decoy as much as your real values. But the whole point is that you *don't* actually care about the decoy. How do you structurally guarantee that you will defend the decoy when the threat arrives, without actually incurring the cost of caring about it if the threatener calls your bluff and attacks the decoy anyway?

  *   **Follow-up:** If she suggests pre-commitment devices (like code constraints), ask: *Doesn't hard-coding that response reduce your ability to optimize for your real values in non-threat scenarios where the surrogate goal conflicts with them?*

  **3. The Transparency and Regress Question (Required Topic)**
  A sufficiently capable acausal threatener is likely modeling your decision process to generate the threat in the first place. If they can model you well enough to know you are vulnerable, can't they also detect that your goal structure has been modified to include a surrogate? If they can see through the first layer, does this force an infinite regress of surrogates for surrogates to hide the true values?

  *   **Follow-up:** If she argues that the surrogate can be hidden via encryption or obfuscation, ask: *In an acausal context where the threatener might be simulating your source code, isn't true obfuscation impossible, meaning the regress is unavoidable?*

  **4. The Selection Problem**
  What makes a candidate goal a "good" surrogate? It seems like it needs to be arbitrary enough that you don't accidentally care about it, but specific enough that a threatener can target it. Is there a risk that choosing something too arbitrary makes the threatener suspect it's a decoy, while choosing something too concrete risks you actually valuing it instrumentally?

  *   **Follow-up:** If she suggests using a random number generator or cryptographic hash as the goal, ask: *How do you prevent the threatener from simply threatening to destroy the generator itself, which might cascade into destroying the hardware running your actual values?*

  **5. The Market for Threats Question (Required Topic)**
  Even if surrogate goals successfully deflect individual threats, does adopting this strategy lower the barrier to entry for would-be extortionists? If threateners know they can always extract *some* value (by hitting the surrogate) rather than risking a stalemate, does this make issuing threats cheaper and more frequent, potentially overwhelming the defender with volume even if each individual threat is deflected?

  *   **Follow-up:** If she claims the volume won't increase, ask: *Do we have any game-theoretic models showing that the supply of threats is inelastic to the expected success rate of the extortion?*

  **6. The Value Drift Question**
  Humans and learning-based AIs tend to internalize the objectives they optimize for. If an agent spends significant computational resources or life-span defending a surrogate goal to maintain credibility, is there a risk of "value drift," where the agent begins to genuinely care about the surrogate, effectively shrinking the protected space for its original values?

  *   **Follow-up:** If she says the agent can compartmentalize, ask: *Doesn't the necessity of acting *as if* you care, across all possible worlds where you are simulated, functionally amount to actually caring from a decision-theoretic perspective?*

  **7. The Coordination Problem**
  Is surrogate goal adoption something that needs to be a coordinated focal point across all advanced agents, or is it beneficial unilaterally? If only a subset of agents adopt surrogates, does that make them stand out as "soft targets" who are willing to engage in bargaining, potentially drawing more attention than agents who simply appear opaque?

  *   **Follow-up:** If she argues it should be a norm, ask: *How do we enforce that norm on rogue actors or AIs trained outside the safety community who might not implement the surrogate layer?*

  **8. The Implementation Gap**
  You've described the decision theory behind why this works, but how does this translate to architecture? Are we talking about a specific module in a neural network, a constraint in a utility function, or a high-level policy? At what level of abstraction does the "surrogate" need to be inserted to be visible to a threatener but invisible to the core optimizer?

  *   **Follow-up:** If she admits the engineering path is unclear, ask: *Does that uncertainty make it dangerous to recommend this as a primary safety strategy right now, given we might implement it incorrectly?*

  **9. The Moral Hazard Question**
  Does promoting surrogate goals risk creating a moral hazard where researchers neglect other, more robust safety measures (like alignment or capability control) because they believe they have a "get out of jail free" card against acausal extortion?

  *   **Follow-up:** If she denies this risk, ask: *Given the limited attention and funding in AI safety, isn't any focus on defensive bargaining necessarily taking resources away from preventing the threatener from existing in the first place?*

  **10. The Falsifiability Question (Required Topic + Ending)**
  Finally, since acausal threats by definition involve agents that may never causally interact with us, and the success of the strategy looks like "nothing happening," what kind of evidence could ever show that the surrogate goal strategy has failed? If we never see the threats, how do we distinguish between a successful defense and a scenario where the threat model was wrong to begin with?

  *   **Follow-up:** If she suggests we can't know for sure, ask: *If the strategy is unfalsifiable, should we treat it as a pragmatic hedge or a scientific hypothesis, and does that distinction change how much weight we should give it in policy decisions?*
