answer: |-
  You have hit on one of the most fascinating tensions in Victorian intellectual history. Henry Sidgwick is indeed the perfect avatar for this. To answer your question directly: **Yes, "compartmentalization" is the standard psychological term,** but given the nuance of Sidgwick's specific situation, you might want to sharpen that terminology to capture *why* he did it.

  Here is a breakdown of the terms, the psychological context, and a historical nuance that might make your piece even stronger.

  ### 1. The Psychological Terms
  If you want to describe the mental mechanism, these are your best options:

  *   **Epistemic Compartmentalization:** This is more precise than just "compartmentalization." It refers to keeping two conflicting systems of knowledge (ethics/empiricism vs. spiritualism) separate so they don't invalidate each other.
  *   **Cognitive Dissonance Reduction:** Sidgwick likely felt a tension between his empirical worldview and his desire for moral order. Investigating the occult was a way to resolve that dissonance by trying to make the spiritual *empirical*.
  *   **Motivated Reasoning:** This suggests he wasn't just passively believing; he was actively using his intellect to justify a conclusion he *wanted* to be true (i.e., that the soul survives death, which validates his ethical system).

  ### 2. The Historical Nuance: Was it actually a "Blind Spot"?
  Here is the twist that could elevate your piece: Modern historians of science argue that for Sidgwick, this **wasn't a blind spot.** It was actually a consistent application of his rationality.

  In the late 19th century, the line between "science" and "psychical research" was much blurrier. To Sidgwick, Wallace, and William James, ignoring claims of telepathy or mediumship wasn't "rational"; it was dogmatic. They believed that **true empiricism requires investigating all data,** even the uncomfortable anomalies.

  Therefore, instead of "irrational blind spot," you might frame it as:
  *   **Radical Empiricism:** The belief that scientific method should apply to *everything*, even ghosts.
  *   **The Colonization of the Supernatural:** Trying to drag the occult into the light of scientific scrutiny.
  *   **Liminal Science:** Science operating on the threshold of the known and unknown.

  Sidgwick wasn't necessarily sitting in seances hoping to be spooked; he was sitting there hoping to **debunk** them, or find reproducible evidence. He was famously skeptical compared to peers like Sir William Crookes.

  ### 3. The "Why": Linking Ethics to Ghosts
  The strongest angle for your piece is linking *The Methods of Ethics* to the Society for Psychical Research (SPR).

  Sidgwick was terrified of **Ethical Nihilism.** He realized that if death is the end, and there is no divine reward/punishment, then "rational self-interest" often contradicts "moral duty." Why be moral if it hurts you and you just rot in the ground?
  *   **The Term:** **"The Sanction of Morality."**
  *   **The Argument:** Sidgwick didn't study ghosts because he was whimsical; he studied them because he needed to know if the universe was morally structured. If psychical research could prove survival after death, his ethical system held. If not, morality was essentially a beautiful lie.

  So, rather than a "separate irrational blind spot," it was the **foundational support beam** for his rational philosophy.

  ### 4. Terminology Recommendations for Your Piece
  Depending on the tone you want to strike, here are three ways to label it:

  **Option A: The Psychological Angle (Critical)**
  > "Sidgwick exhibits a classic case of **epistemic compartmentalization**, walling off his rigorous philosophical empiricism from his desperate hope for spiritual continuity."

  **Option B: The Historical Angle (Sympathetic)**
  > "What looks like a contradiction today was, to Sidgwick, **radical empiricism**. He sought to apply the scientific method to the 'borderland' of human experience, refusing to dismiss anomalies simply because they were inconvenient."

  **Option C: The Motivational Angle (Deep Dive)**
  > "This was not a hobby, but a **crisis of sanction**. Sidgwick turned to psychical research to solve the problem of ethical motivation in a godless universe."

  ### 5. Other Case Studies for Comparison
  If you need to flesh out the trend, Sidgwick is the "rigorous skeptic" archetype. You can contrast him with:
  *   **Alfred Russel Wallace (Co-discoverer of Natural Selection):** He went full-believer. He thought spiritualism was the logical next step of evolution.
  *   **Sir William Crookes (Discoverer of Thallium):** He claimed to have scientifically proven spiritualism (he was largely duped by the medium Florence Cook).
  *   **William James:** American psychologist who argued that ignoring spiritual experiences was unscientific ("The Will to Believe").

  ### Summary
  Use **"Epistemic Compartmentalization"** if you want to highlight the separation. But consider using **"Radical Empiricism"** if you want to honor how Sidgwick viewed himself. He didn't think he was being irrational; he thought he was being *more* scientific than the scientists who refused to look at the data.

  The tragedy of Sidgwick is that he spent 20 years looking for the data that would save morality, and by most accounts, he died without ever finding the proof he needed. That is a incredibly poignant note for a piece.
