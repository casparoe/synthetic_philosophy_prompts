answer: |-
  This is a superb disagreement to have, and your skepticism about the "tidy secondary-literature paraphrases" is well-founded. The dinner-table version of Bradley's Regress often treats it as a simple logical puzzle about infinite series, whereas Bradley himself treats it as a diagnostic tool for the incoherence of pluralistic realism. Your friend is arguing from the standpoint of analytic realism (Russell's early position), while you are sensing that Bradley's text targets the ontological presuppositions that make that realism possible.

  Here is a reconstruction of the logical anatomy of the dilemma in the passage you cited, followed by an evaluation of whether the Russellian move actually escapes it.

  ### 1. The Anatomy of the Dilemma: "Nothing" vs. "Something"

  Bradley's dilemma rests on an exhaustive division regarding the ontological status of the relation ($R$) relative to its terms ($Q_1, Q_2$).

  **Horn A: The Relation is "Nothing to the Qualities"**
  *   **The Claim:** $R$ is entirely external to $Q_1$ and $Q_2$. It does not enter into their nature or constitution.
  *   **Bradley's Consequence:** If $R$ is truly external, it cannot affect $Q_1$ or $Q_2$. If it does not affect them, then $Q_1$ and $Q_2$ remain exactly as they were without $R$.
  *   **The Knockout:** If they remain unchanged, they are not *related*. If they are not related, the putative fact "$Q_1 R Q_2$" does not exist. The relation is a "nonentity."
  *   **Why this is forced:** Bradley assumes that for a relation to be real, it must make a difference to the terms. If it makes no difference (is "nothing" to them), it is functionally non-existent.

  **Horn B: The Relation is "Something to the Qualities"**
  *   **The Claim:** $R$ has ontological grip on $Q_1$ and $Q_2$. It enters into their constitution or modifies them.
  *   **Bradley's Consequence:** If $R$ is "something," it is itself an entity (a term, a particular, or an object of thought).
  *   **The Problem:** We now have three entities: $Q_1$, $Q_2$, and $R$.
  *   **The Knockout:** How does $R$ attach to $Q_1$? Since $R$ is now an entity distinct from $Q_1$, we require an account of their togetherness.
  *   **Why this is forced:** Bradley assumes that distinct entities do not automatically cohere. If $R$ is distinct from $Q_1$ (which it must be to be a relation *between* terms), their union is a new fact that requires explanation.

  ### 2. Why the "Something" Option Demands a Further Relation

  This is the crux of your question. Why can't we say $R$ simply belongs to $Q_1$ via a "non-relational mode of belonging" (like instantiation, exemplification, or Russell's "relating relation")?

  Bradley anticipates this in the sentence: *"And, being something itself, if it does not itself bear a relation to the terms, in what intelligible way will it succeed in being anything to them?"*

  Here is the logical engine driving the demand for a further relation:

  1.  **The Criterion of Intelligibility:** For Bradley, to explain how $X$ is united to $Y$ is to show the *ground* of their unity. If you posit $R$ as the ground, but $R$ is itself a distinct entity, you have not explained the unity; you have added a third thing that needs uniting.
  2.  **The Disguised Relation:** If you propose a "non-relational tie" (let's call it Instantiation, $I$), Bradley asks: Is $I$ distinct from the terms?
      *   **If Yes:** Then $I$ is just another entity. How does $I$ connect to the terms? You need $I_2$. (Regress restarts).
      *   **If No:** Then $I$ is not distinct from the terms. But if it is not distinct, it cannot perform the function of *connecting* distinct terms. It collapses into the terms themselves.
  3.  **The "Adjective" Dismissal:** Bradley briefly mentions: *"The relation hardly can be the mere adjective of one or both of its terms."* This blocks the move of saying $R$ is just a property of $Q_1$. If $R$ is just a monadic property of $Q_1$, it no longer relates $Q_1$ to $Q_2$; it just qualifies $Q_1$. The relational character is lost.

  **Why "Non-Relational Belonging" Fails Bradley:**
  Bradley's challenge is that any "mode of belonging" that is *intelligible* to discursive thought must be analyzable. If you analyze it, you find terms and relations. If you say it is *unanalyzable* (a brute fact of instantiation), Bradley classifies this as "unintelligible." For Bradley, "unintelligible" doesn't mean "we don't know how"; it means "conceptually contradictory." He believes distinct terms cannot be externally related without a further ground, and they cannot be internally related without losing their distinctness.

  ### 3. Evaluating the Russellian Rebuttal

  Your friend's argument relies on Bertrand Russell's distinction in *The Principles of Mathematics* (1903). Russell argues that a relation has two modes of being:
  1.  **As a term:** When we talk *about* the relation (e.g., "Relation $R$ exists").
  2.  **As relating:** When the relation is actually doing work in a proposition (e.g., "$A$ loves $B$").

  Russell claims that when $R$ is "relating," it is not a new term that needs connecting. It is the verb, not the noun. Therefore, no further relation is needed to connect the relating relation to the terms.

  **Does this escape Bradley's dilemma?**

  **Formally: Yes.**
  Russell blocks the regress by denying the premise that generates the "Something" horn. He denies that the relating relation is an *entity* that stands in need of connection. It is a logical category mistake to treat the "relating" as a term. By categorizing it as a logical constant or a verb, he stops the generation of $R_2, R_3, etc.$

  **Metaphysically (on Bradley's terms): No.**
  Bradley's text anticipates and blocks this move in the phrase: *"in what intelligible way will it succeed in being anything to them?"*

  Here is why Bradley would not accept the Russellian defusal:

  1.  **The Reification of the Proposition:** Bradley would argue that for the proposition "$A R B$" to be true (to be a fact), there must be a unity in reality corresponding to it. If $A$, $B$, and $R$ are distinct ontological items, their togetherness is a fact. Bradley demands to know what constitutes that fact. If Russell says, "It's just a brute fact that they are united," Bradley replies, "That is not an explanation; that is an assertion of mystery."
  2.  **The "Relating" is still a Relation:** Bradley would press Russell on whether the "relating" is real.
      *   If the "relating" is real, does it have a nature? If it has a nature distinct from $A$ and $B$, we are back to Horn B (it is "something" to them).
      *   If the "relating" is not real (merely logical), then the connection in reality is unexplained.
  3.  **The Monistic Trap:** Bradley's ultimate point in *Appearance and Reality* is not just to generate a regress, but to show that *pluralism* (the belief in many distinct things related together) is incoherent. The Russellian move saves pluralism by positing brute facts of instantiation. Bradley's argument is designed to show that brute facts of instantiation are "appearance" because they cannot be rendered intelligible without contradiction.

  **Does Bradley's phrasing anticipate this?**
  Yes. When he writes, *"if it does not itself bear a relation to the terms,"* he is challenging the coherence of a relation that does not bear a relation. To the analytic realist, this sounds like a category mistake. To Bradley, it is a demand for consistency: If $R$ is real, it must stand in some relation to $A$. If you say "it relates, it doesn't stand in a relation," Bradley hears "it is connected, but the connection is not a connection." He views this as verbal sleight of hand that masks the underlying ontological gap.

  ### 4. Summary for Your Argument

  You can tell your friend that she is correct that standard analytic metaphysics *dissolves* the regress by rejecting Bradley's criterion of intelligibility (i.e., by accepting brute facts of instantiation). However, she is incorrect if she thinks this *refutes* Bradley on his own terms.

  *   **Her Claim:** The regress is a logical error caused by treating verbs as nouns.
  *   **Bradley's Counter:** The regress is a metaphysical diagnosis showing that distinct entities cannot be united without a ground, and any ground posited becomes a new entity requiring a ground.
  *   **The Stalemate:** The Russellian stops the regress by accepting a primitive "unity of the proposition." Bradley rejects this primitive unity as unintelligible because it cannot be analyzed without contradiction.

  **The Verdict:**
  Bradley's phrasing in this passage blocks the Russellian move because it demands an *intelligible account* of how the relation succeeds in being "something to" the terms. Simply asserting "it relates" without explaining the ontological glue is, for Bradley, an admission that the unity is not rationally comprehensible. Since Bradley defines "Reality" as that which is rationally comprehensible (non-contradictory), the Russellian solution saves the phenomena only by relegating them to "Appearance."

  Your instinct was right: the disagreement isn't just about logic; it's about whether "brute instantiation" is a valid metaphysical stopping point. Russell says yes; Bradley says no. The regress is the weapon Bradley uses to force that choice.
