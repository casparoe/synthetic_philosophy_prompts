answer: |-
  This is a superb dinner argument. You and your friend have stumbled onto one of the most discussed tensions in the history of economic thought. Your friend is sharp to notice that Hume seems to grant money "causal power" over industry in one essay while stripping it of causal power over interest in another.

  However, your friend has not caught Hume in a contradiction. He has, rather, identified the precise pivot point where Hume invents classical economics. Hume is consistent, but his consistency relies on a distinction between **money as a medium of exchange** and **capital as real resources**, coupled with a distinction between **dynamic transitions** and **static equilibrium**.

  Here is the reconstruction of the principle that saves Hume from inconsistency, and why your friend's challenge, while astute, misses the causal chain Hume is describing.

  ### 1. The Core Principle: Money is Not Capital
  The linchpin of Hume's system, articulated most clearly in *Of Interest*, is that **interest is not the price of money; it is the price of capital.**

  Mercantilists (and your friend, in this specific argument) conflate the two. They think that because interest is paid *in* money, the *quantity* of money must determine the rate. Hume argues that interest is determined by the supply and demand of *loanable funds* (real savings/stock), not the medium used to transfer them.

  *   **In *Of Interest*:** Hume uses the Spain example to prove this. Spain had a massive influx of specie (money), but interest rates remained high. Why? Because the silver did not create more ships, warehouses, tools, or raw materials (real capital). It merely raised prices. Since the supply of real capital didn't increase relative to the demand for borrowing, the price of borrowing (interest) didn't fall.
  *   **In *Of Money*:** When Hume says an inflow of money stimulates industry, he is not saying money *is* capital. He is saying money acts as a **lubricant and a spur**.

  ### 2. Reconciling *Of Money* and *Of Interest*
  Your friend asks: *If money inflow causes higher industry, why doesn't it cause lower interest?*

  The answer lies in the **transmission mechanism**. Hume posits a specific causal chain that your friend is collapsing into a single step.

  **Hume's Causal Chain:**
  1.  **Money Inflow:** New specie enters the nation.
  2.  **The "Interval" (*Of Money*):** Prices and wages are sticky. Merchants see higher nominal revenues before their costs rise. They feel richer and more optimistic. They hire more workers and expand production. **Industry rises.**
  3.  **Profit Generation:** This increased activity generates real profits.
  4.  **The Crucial Fork (Frugality vs. Luxury):**
      *   *Scenario A (England/Netherlands):* The merchants are frugal. They reinvest those profits into real stock (tools, inventory, infrastructure). This increases the supply of loanable capital. **Interest rates fall.**
      *   *Scenario B (Spain):* The recipients of the money spend it on luxury consumption or foreign goods. No real stock is accumulated. The supply of loanable capital does not increase. **Interest rates stay high.**

  **The Resolution:**
  Money is the *spark*, but savings/frugality is the *fuel*.
  In *Of Money*, Hume is describing the **spark** (the immediate stimulus to activity).
  In *Of Interest*, Hume is describing the **fuel** (the accumulated stock that determines the rate of interest).

  Hume is consistent because he argues that money *alone* cannot lower interest. It can only lower interest *if* it triggers a chain of industry that results in accumulated capital. In Spain, the chain broke. The money stimulated some activity, but it did not result in accumulated stock. Therefore, industry might have flickered, but interest remained high.

  ### 3. Dynamic vs. Static Analysis
  Your friend's second error is temporal. He is comparing a **dynamic process** with a **static condition**.

  *   **Of Money (Dynamic):** This essay analyzes the *transition*. When money is *flowing in*, there is a temporary disequilibrium. Prices haven't caught up. This is a "non-neutral" period where money affects real output. Hume explicitly calls this an "interval." It is self-liquidating.
  *   **Of Interest (Static/Comparative Static):** This essay analyzes the *equilibrium rate*. Once prices have adjusted and the money has settled, what determines the cost of borrowing? Hume argues that once the dust settles, the quantity of money is irrelevant. Only the real proportion of lenders to borrowers matters.

  Your friend is essentially asking: *"How can a temporary stimulus be real if the long-run result is neutral?"*
  Hume's answer: The stimulus is real *during the transition*, but it does not alter the *fundamental valuation of capital* unless it changes the habits of the people (frugality).

  ### 4. Why the Mercantilists Were Wrong (and your friend is half-right)
  Your friend argues Hume concedes the Mercantilist advice (keep specie flowing) even if he rejects their theory. This is a common interpretation, but it misses Hume's warning.

  Hume admits that a *growing* money supply is pleasant and stimulating. However, he argues in *Of the Balance of Trade* that you cannot *keep* it flowing. The price-specie flow mechanism ensures that if you try to hoard, prices rise, exports fall, and the money leaves.

  Therefore, a policy of "keep the specie flowing" is impossible to sustain permanently. You can ride the wave of the "interval," but you cannot build a permanent policy on a temporary phenomenon. The Mercantilists wanted a permanent surplus; Hume says physics (economic physics) forbids it.

  ### The Verdict
  **You win the argument, but your friend deserves the drink.**

  Your friend identified a genuine tension in Hume's text that has occupied economists for centuries (Keynes, for example, loved Hume's *Of Money* precisely because of that "interval" argument). However, it is not an inconsistency.

  **The Reconstructing Principle:**
  > **Money affects the *level* of activity in the short run through price stickiness and psychological expectation, but it affects the *rate of interest* only indirectly, by influencing the accumulation of real capital through frugality.**

  Hume is not saying money causes low interest. He is saying **commerce** causes low interest. Money facilitates commerce. If money facilitates commerce *and* that commerce leads to savings, interest falls. If money facilitates commerce *but* that commerce leads to luxury (Spain), interest stays high.

  Your friend treated money as a cause of interest rates. Hume treats money as a cause of *trading volume*, which *may* become a cause of capital accumulation, which *then* causes interest rates to fall. The chain has links your friend skipped.

  **How to settle it at the next dinner:**
  Tell your friend: "Hume agrees with you that money wakes up the worker (*Of Money*). But he insists that until that worker saves his wages to build a new loom, the cost of borrowing hasn't changed (*Of Interest*). Spain had the gold, but they didn't build the looms; they bought the velvet. That's why the interest rate didn't budge. Money is the oil, not the engine."
