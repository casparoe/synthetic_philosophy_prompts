  **False or Misleading Statements**

  1.  **"Quine treats the indeterminacy of translation as, at bottom, the same kind of phenomenon as the underdetermination of physical theory."**
      This is confidently stated but false. Quine explicitly argues that indeterminacy is *stronger* than underdetermination. Underdetermination implies there is a fact of the matter (a true theory) that evidence cannot decide; indeterminacy implies there is *no* fact of the matter to decide.

  2.  **"In each case, some determinate fact — about the world, or about what the natives mean — is what our theorizing or translating is trying, and permanently failing, to track down."**
      This misrepresents Quine's ontology. For physical theory, there is a fact of the matter we fail to track. For translation/meaning, Quine's thesis is that there is *no* fact of the matter regarding what the native means beyond what is captured in the translation manual.

  3.  **"Radical translation between sufficiently different conceptual schemes is, in the end, impossible."**
      This is misleading. Quine does not claim translation is impossible; he claims it is indeterminate. Multiple manuals can be correct (compatible with all evidence), so translation succeeds, but there is no single *correct* translation.
