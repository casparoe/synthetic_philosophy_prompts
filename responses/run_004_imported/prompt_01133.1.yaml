answer: |-
  The salmon was smoked, thinly sliced, and entirely innocent. It was the throat, aged seventy-seven and tired from pneumonia, that betrayed him.

  When the darkness lifted, it did so with the violence of a defibrillator punch. Freddie Ayer gasped, a ragged, wet sound that tore through the sterile air of the Middlesex Hospital. A doctor was leaning over him, eyes wide.

  "Welcome back, Professor," the man said, checking a monitor. "Your heart stopped. Four minutes, give or take."

  Ayer blinked. The fluorescent lights of the ward were harsh, but they were nothing compared to the afterimage burning behind his retinas. He felt a strange, buoyant certainty, a chemical wash of revelation that bypassed the slow, grinding gears of his logic.

  "I saw a Divine Being," Ayer said. His voice was a croak, but the words were distinct. "I'm afraid I shall have to revise all my books."

  The doctor smiled, the patronizing smile of a man of science humoring a delirious patient. "Rest now, Mr. Ayer."

  But Ayer did not rest. As the morphine faded and the oxygen cleared the fog, the philosopher returned to evict the mystic.

  ***

  Two weeks later, the study in Holland Park was filled with the clack of the typewriter. A glass of vodka sat on the desk, untouched. Ayer stared at the page. The headline from the *Sunday Telegraph* editor was already set: *What I Saw When I Was Dead.*

  Ayer hated the title. It was empirically false. He had not been dead. He had been clinically compromised.

  He typed: *The light was red.*

  He paused. To say he saw God was to make a category error. 'God' is a term without empirical cash-value. It refers to no sense-datum. But a 'painfully bright red light'? That was verifiable. He had experienced it. It was a fact of his consciousness, if not of the universe.

  He typed on, describing the entities. They were not angels. They were 'ministers' who seemed to be in charge of the government of the universe, but they were negligent. They had not paid sufficient attention to their duties. One of them, he noted with a dry smirk that no one saw, was responsible for space being out of joint.

  It was a vivid hallucination. But was it evidence?

  Ayer stopped typing. He took a sip of vodka. The verification principle hummed in the back of his mind, a quiet engine. *A statement is meaningful only if it is analytic or empirically verifiable.*

  The statement *'I survived death'* implies a discontinuity of the person. But personal identity, for Ayer, was bound to the continuity of the body, specifically the brain. His heart had stopped. His brain had not. Therefore, *he* had not gone anywhere. There was no 'he' to survive, because the 'he' never left.

  He leaned into the machine. He had to make the distinction clear. The experience was real; the metaphysical interpretation was nonsense. He wrote that even if the experience were genuine, it did not show that death was survivable. To claim otherwise was to misuse language. It was to treat the cessation of the heart as the cessation of the self, a logical slip that centuries of theology had exploited.

  He signed the piece. It was a concession, but a hedged one. He had admitted the light, but denied the darkness.

  ***

  The backlash was swift. The letters arrived in sheaves. Some from believers triumphant—*Ayer admits it!*—and others from the old guard, the fellow travelers of the rationalist press, furious.

  Bernard, a longtime colleague and staunch materialist, came to the house in September. He found Ayer in the garden, wrapped in a blanket despite the mild sun.

  "You've given them ammunition, Freddie," Bernard said, pouring himself a drink without asking. "The *Telegraph* piece. 'Divine Being.' 'Ministers.' It's all over the faculty."

  "I reported a sense-datum," Ayer said, watching a bee struggle with a lavender stalk. "I did not report a deity."

  "You titled it 'When I Was Dead.' Well, the editors did, but you approved it."

  "I was correcting their headline in the text," Ayer snapped. "I explained the heart-brain distinction. I explained that personal identity requires bodily continuity. If the brain functions, the self persists. There was no journey. There was only a malfunctioning optic nerve and a hypoxic cortex."

  Bernard sat opposite him. "It doesn't read that way to the layman. It reads like a deathbed conversion. You need to clarify. For the sake of the movement."

  Ayer looked at his friend. He felt a pang of irritation, not at the logic, but at the politics. He had spent a lifetime dismantling metaphysics, clearing the ground of superstition. Now, a moment of biological misfire threatened to rebuild the temple.

  Verificationism was not just a theory; it was a discipline. It required one to police the boundaries of meaning, even against oneself. To allow the statement *'I saw God'* to stand unchallenged was to allow nonsense to enter the ledger.

  "I will write to *The Spectator*," Ayer said quietly.

  "Good."

  "But I will not deny the light."

  "Deny the implication," Bernard said. "Just make it clear you aren't joining the Church of England."

  ***

  The second piece was colder. In *The Spectator*, Ayer stripped away the narrative flourish. He wrote that his initial remarks to the doctor were the result of shock. He clarified that the 'Divine Being' was a label applied retrospectively to a sensation that had no external referent.

  He reiterated the core argument: The heart is a pump. The mind is a function of the brain. The pump failed; the function did not cease. Therefore, no boundary was crossed.

  As he wrote the final paragraph, he felt a strange hollowness. He was right, logically. He was defending the integrity of his life's work. He was protecting the verification principle from the seduction of the sublime.

  But he remembered the red light. He remembered the feeling of the universe being governed, however negligently. It was a feeling of *meaning*, intense and overwhelming, which stood in stark contrast to the austere, bloodless world of logical positivism.

  He typed the final full stop. He had successfully argued that the experience meant nothing. He had proven that he had not died. He had satisfied his colleagues.

  Ayer pushed the paper away and reached for his glass. The ice clinked, a sharp, verifiable sound in the quiet room. He took a drink. It burned, real and physical.

  "I am not dead," he said to the empty room.

  It was a meaningful statement. It was empirically verifiable. He could feel the vodka. He could feel the chair. He could feel the loss.

  He picked up the pen and crossed out the word 'Divine' in his notes, replacing it with 'Red'. It was more accurate. It was less beautiful. It was the truth, or at least, the only truth that could be spoken.

  Ayer put the pen down. He would not revise his books. But as he looked out at the London sky, grey and featureless, he wondered if the verification principle was quite enough to explain why the red light still hurt to remember.
