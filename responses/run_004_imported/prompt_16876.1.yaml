answer: |-
  Here are ten interview questions designed to move beyond the "is it real?" stalemate and press on the philosophical mechanics of your guest's argument. Each includes a follow-up keyed to the response she is most likely to offer.

  **1. The Falsifiability Constraint**
  You argue that the rise in autism and ADHD is driven by looping effects rather than simple improved ascertainment. But statistically, both models predict the same outcome: a sharp increase in diagnosed cases. What specific empirical observation would you accept as evidence *against* the looping hypothesis? If we found a stable prevalence rate in a population completely isolated from modern diagnostic culture, would that falsify your view, or is the theory insulated from that kind of refutation?
  *   **Follow-up:** You'll likely say that we should see a *change in the phenotype* itself, not just the count. But how do you distinguish a looping-induced phenotypic change from the inevitable "criteria creep" that happens whenever clinicians broaden definitions to capture more patients?

  **2. The MPD Disanalogy**
  In *Rewriting the Soul*, Hacking describes Multiple Personality Disorder (MPD) as a transient interactive kind that largely vanished once the cultural script of recovered memory and satanic ritual abuse was discredited. Autism and ADHD diagnoses, however, have climbed steadily across countries with vastly different clinical cultures and media landscapes. What stabilizes these categories so they don't collapse the way MPD did?
  *   **Follow-up:** If you answer that the Neurodiversity movement provides a more robust cultural script than the recovered-memory therapists did, does that imply the persistence of the diagnosis is ultimately a political achievement rather than a clinical or ontological one?

  **3. The Ontological Slide**
  Hacking was careful to insist that interactive kinds are still "real" in a meaningful sense; they are not *merely* social constructions in the dismissive sense. Do you worry that your argument invites the illegitimate slide from "this category is partly constituted by how people classified under it come to see themselves" to "this category is not a real, objective kind"? How do you prevent your view from being weaponized to deny services to people who need them?
  *   **Follow-up:** If you maintain that they are "real kinds," in what sense do they *resist* us? If the classification changes the thing classified, does the category lose the ability to constrain our theories, which is usually the job of a natural kind?

  **4. Modification vs. Creation**
  Related to that, there is a spectrum of causal strength here. Are you making the weak claim that diagnostic labels change the *behavior* and self-narrative of people who already fit some underlying neurological pattern? Or are you making the much stronger claim that classification *creates* a way of being a person that could not have existed before the label was available?
  *   **Follow-up:** If you argue for the stronger claim—that the way of being is new—can you point to a specific symptom or behavioral trait common in autistic adolescents today that you believe would be psychologically impossible for a child to exhibit in, say, 1950?

  **5. The Biomarker Threshold**
  Let's look forward. Suppose neuroscience discovers a robust, specific biological marker for ADHD—something as reliable as a blood test for diabetes. Does that discovery instantly convert ADHD from an "interactive kind" back into an "indifferent kind" like a quark or a virus, or can a category remain interactive even when it has a known biological essence?
  *   **Follow-up:** You will likely say the loop continues because the *meaning* of the marker matters. But if the biology is fixed, doesn't that place a hard ceiling on the looping effect? At what point does the biological reality swamp the feedback from the self-conception?

  **6. The Vector of the Loop**
  We know the mechanism of looping involves people learning about a classification and adjusting their self-understanding. But through what specific vector does this travel most potently? Is it the clinical encounter, the school system, pharmaceutical marketing, or peer communities online? Where is the "engine" of the loop located?
  *   **Follow-up:** If you identify online peer communities as a primary vector, does that suggest the looping effect is accelerating? And if so, should we expect the phenotype to evolve faster than the diagnostic manual can update?

  **7. Institutional Amplifiers**
  Diagnoses aren't just adopted by individuals; they are adopted by institutions that allocate resources. To what extent is the looping effect you describe actually a feedback loop between *clinicians* and *insurance codes* or *special education budgets*, rather than just between the label and the patient's soul?
  *   **Follow-up:** If the financial and administrative incentives were removed tomorrow, do you predict the diagnosis rates would plateau, or has the self-conception aspect become independent of the institutional rewards?

  **8. Negative Looping**
  We often discuss looping in the context of identity formation, which can be empowering. But looping can also be negative, such as when a label induces stigma or learned helplessness. Does your account require us to evaluate the *ethics* of a diagnosis based on the quality of the loop it generates, rather than just its diagnostic accuracy?
  *   **Follow-up:** If a diagnosis is accurate but generates a harmful loop (e.g., fatalism), do you have a philosophical basis for recommending we retire the term in favor of something less "sticky," even if it refers to the same underlying cluster of traits?

  **9. Cross-Cultural Variance**
  You mention the rise in diagnoses across different countries. However, the *presentation* of symptoms often varies by culture. If looping is the primary driver, should we expect to see distinct "national subtypes" of autism or ADHD emerging based on local cultural expectations of childhood behavior?
  *   **Follow-up:** If we *don't* see significant cross-cultural variation in the core presentation, does that undermine the looping hypothesis and point back toward a universal biological substrate that is simply being detected at different rates?

  **10. Stabilization and End States**
  Finally, do interactive kinds have an end state? Hacking suggested some kinds stabilize over time. Do you envision a future where autism and ADHD become "stable interactive kinds" where the feedback loop reaches equilibrium, or is the nature of these categories to remain in perpetual flux as long as human self-understanding evolves?
  *   **Follow-up:** If they remain in perpetual flux, does that make a "philosophy of psychiatry" impossible, since the object of study is effectively moving targets? Or does it just mean the philosophy must be dynamic as well?
