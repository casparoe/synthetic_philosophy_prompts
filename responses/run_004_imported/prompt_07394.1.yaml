answer: |-
  Your classmate has presented a sophisticated and creative argument that bridges theoretical computer science and normative ethics. It is essentially a modern formalization of the traditional "epistemic objection" to act utilitarianism (AU). However, while the computational complexity claims may be sound (assuming $P \neq NP$), the inference that this *refutes* act utilitarianism rests on a category mistake regarding what kind of theory AU is supposed to be.

  Contemporary utilitarians continue to treat AU as a live theory because the complexity objection conflates the **criterion of rightness** with a **decision procedure**, and it misapplies the standards of scientific prediction to normative metaphysics.

  Here is a breakdown of why the computational complexity argument does not refute act utilitarianism, organized by the key philosophical distinctions your classmate's argument overlooks.

  ### 1. Criterion of Rightness vs. Decision Procedure
  The most standard and decisive reply to this argument is the distinction between what *makes* an action right and how an agent *decides* what to do.

  *   **Criterion of Rightness:** This is the metaphysical standard that determines the moral status of an action. For the act utilitarian, an action is right if and only if it maximizes aggregate welfare. This is a fact about the world and the action, independent of anyone's knowledge of it.
  *   **Decision Procedure:** This is the cognitive method or algorithm an agent uses to choose an action.

  The complexity objection argues that we cannot *compute* the decision procedure in polynomial time. However, AU does not claim that agents must successfully run the optimization algorithm to perform a right action. It claims that the action *is* right if it happens to be the output of that algorithm, regardless of whether the agent knew it.

  **Analogy:** Consider the statement: "The winning move in chess is the one that leads to a forced checkmate in the fewest moves." Finding that move might be computationally intractable for a human (or even a computer in complex endgames). However, the intractability of finding the move does not change the fact that a specific move *is* the winning one. The difficulty of calculation does not alter the truth conditions of the claim.

  ### 2. Objective vs. Subjective Obligation
  Your classmate's argument assumes that if we cannot *know* the right action, there is no fact of the matter about what the right action is. This conflates **objective obligation** (what actually produces the best outcome) with **subjective obligation** (what an agent is rational or blameworthy for doing given their epistemic limitations).

  Most contemporary utilitarians accept that while objective obligation is defined by actual consequences, moral praise and blame must be tied to **expected utility**.
  *   If an agent uses a heuristic (a "rule of thumb") that usually maximizes welfare but fails in a specific complex case due to computational limits, the act utilitarian can say: "You did the objectively wrong action, but you were not blameworthy because you acted on the best decision procedure available to you."
  *   The theory remains intact as a description of what is *good*, even if it admits that agents often cannot *know* what is good with certainty.

  ### 3. The Flawed Scientific Analogy
  Your classmate argues that AU fails like a scientific theory that makes no determinate predictions. This analogy is incorrect for two reasons:

  **A. Intractability $\neq$ Indeterminacy**
  A scientific theory can be true even if its equations are computationally intractable.
  *   **Example:** The Newtonian N-body problem. Predicting the exact positions of three or more gravitational bodies over time is analytically unsolvable and computationally heavy. We use approximations. Does this refute Newtonian gravity? No. It just means exact prediction is hard.
  *   Similarly, AU posits a moral "gravity." The fact that calculating the moral trajectory is NP-hard does not mean the moral force doesn't exist; it just means our epistemic access to it is limited.

  **B. Normative vs. Descriptive**
  Scientific theories aim to describe how the world *is*. Normative theories aim to prescribe how the world *ought to be*.
  *   If a scientific theory cannot predict an outcome, it fails at description.
  *   If a normative theory sets a standard that is hard to calculate, it may be demanding, but it doesn't cease to be a standard. A theory can be true even if it is humanly impossible to fully satisfy it (a point often raised regarding the "ought implies can" objection, which we address next).

  ### 4. Approximation Algorithms and Heuristics
  In computer science, when faced with an NP-hard problem, we do not simply give up; we use **approximation algorithms** or **heuristics** to find a solution that is "good enough" or likely close to optimal in polynomial time.

  Utilitarians argue that moral rules (e.g., "don't lie," "keep promises") function exactly like these heuristics.
  *   We cannot calculate the utility of every action in real-time.
  *   So, we rely on secondary principles that evolution and social learning have identified as high-probability maximizers of welfare.
  *   The complexity objection proves we need heuristics, not that the goal of maximization is incoherent.

  ### 5. "Ought Implies Can"
  A related philosophical objection is that if we *cannot* calculate the optimal action, we *ought not* be required to do it.
  *   **Reply:** Act utilitarians often argue that "ought implies can" applies to the *action*, not the *calculation*.
  *   It is not that you must *calculate* the best action; it is that you must *perform* the best action.
  *   If you perform the best action by luck or by following a heuristic, you have satisfied the "ought." The theory does not demand you possess god-like computational power; it demands your actions align with the good. If computational limits prevent you from knowing which action aligns with the good, that is an epistemic tragedy, not a logical refutation of the theory.

  ### Why Utilitarians Remain Unmoved
  To summarize, utilitarians treat act utilitarianism as a live theory because:

  1.  **Metaphysical Independence:** The truth of "Action A is right" depends on the consequences of A, not on our ability to compute them.
  2.  **Epistemic Humility:** Utilitarians can concede that humans lack the computational power to be perfect utilitarians without conceding that utilitarianism is false. They simply shift to **Expected Utility** for guidance on decision-making while retaining **Actual Utility** for defining rightness.
  3.  **Ideal Theory:** Many ethicists view AU as an "ideal theory." It sets the target. Even if the target is computationally opaque, it still defines the direction of moral progress.

  ### Conclusion
  Your classmate's argument successfully demonstrates that act utilitarianism is **epistemically opaque** and **computationally demanding**. It shows that AU cannot serve as a real-time *decision procedure* for bounded agents.

  However, it does not refute AU as a **criterion of rightness**. To claim otherwise is to confuse the map (our decision procedure) with the territory (the moral facts). Just as the difficulty of calculating the exact movement of every molecule in a gas does not refute thermodynamics, the difficulty of calculating the exact welfare consequences of an action does not refute the claim that the right action is the one that maximizes welfare.

  The argument is a powerful reason to adopt **Rule Utilitarianism** or **Expected Utility Utilitarianism** as a *practical guide*, but it does not logically invalidate the core axioms of Act Utilitarianism.
