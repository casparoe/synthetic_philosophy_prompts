      *   **Move 2 (Frank):** The Consistency Objection. To know $G(F)$ is true, you must know $F$ is consistent. Gödel's 2nd Theorem says $F$ can't prove its own consistency. So, unless the human has magical access to consistency, they haven't outperformed $F$.
          *   *Assessment:* This is the standard and strongest objection to Lucas-Penrose (often attributed to Putnam or Benacerraf). It shifts the burden of proof to the human's ability to know consistency.
