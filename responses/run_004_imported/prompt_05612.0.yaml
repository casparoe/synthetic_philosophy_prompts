answer: |-
  Here is a move-by-move adjudication of the exchange, treating the arguments as contributions to the debate on moral testimony and moral worth.

  **(1) Leah: Partly holds up.**
  Leah correctly identifies an anti-elitist constraint: moral worth shouldn't be gatekept by philosophical labor. If we required independent verification for every moral belief, moral agency would be restricted to the epistemically privileged. However, she conflates the *rightness of the action* with *moral credit (worth)*. One can do the right thing (stop buying eggs) without necessarily exhibiting the robust understanding often associated with full moral praiseworthiness. Her claim that demanding more "penalizes" non-philosophers is rhetorically strong but philosophically contentious; it assumes testimonial belief is epistemically equivalent to investigated belief in the moral domain, which is precisely what Marcus challenges.

  **(2) Marcus: Partly holds up.**
  Marcus's counterfactual claim (that Ana's belief lacks sensitivity to the truth) is a strong epistemic objection; if her action depends entirely on Owen's whim, it lacks the stability we associate with conviction. However, his medical analogy fails. We *do* credit patients for trusting doctors, precisely because medicine is a specialized technical domain where lay verification is impossible. Moral truths (e.g., "gratuitous suffering matters") are arguably not specialized in the same way. By treating moral reasons as technical data, he begs the question against the view that moral understanding is accessible to all competent agents.

  **(3) Leah: Holds up.**
  This is Leah's strongest move. She successfully deploys a *reductio ad absurdum* against Marcus's initial formulation. If deferring on moral testimony undermines credit, then almost all adult moral agency is compromised, given the pervasive role of socialization. This forces Marcus to abandon the claim that *testimony itself* is the problem and locate the defect elsewhere. Unless Marcus is prepared to argue that most inherited morality is worthless (a hard sell), he must refine his criterion for credit.

  **(4) Marcus: Holds up.**
  Marcus successfully parries the *reductio* by introducing a coherence condition. He distinguishes between *integrated* beliefs (socialized, anchored in a web of commitments) and *isolated* deference (free-floating say-so). This aligns with coherentist epistemologies and accounts for why childhood socialization feels different from adult deference: the former becomes part of the agent's character, while the latter may remain external. While this relies on an empirical assumption about Ana's psychology (that the belief isn't anchored), the theoretical distinction saves his position from Leah's generalization objection.

  **What Both Are Missing**
  Both interlocutors are operating within the frame of the "Moral Testimony" debate (Pessimism vs. Optimism) without recognizing a crucial disambiguation: Owen provided *empirical* testimony (battery cages cause suffering), not *moral* testimony (suffering is bad). Ana supplied the moral premise herself. Leah misses that Marcus isn't objecting to her believing Owen about the cages, but to her lacking a grasp of *why* that fact matters. Marcus misses that Ana's reliance on testimony might be practically rational even if epistemically fragile. Furthermore, they conflate *praiseworthiness* with *blamelessness*. Ana may be fully blameless (Leah's point) without being an exemplar of moral understanding (Marcus's point); distinguishing these categories would likely dissolve the stalemate.
