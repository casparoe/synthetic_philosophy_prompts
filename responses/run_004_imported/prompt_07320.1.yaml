      Why it matters (fragility of cascades)...
      The solution (private scoring)...
      Closing.

      *Review against constraints:*
      - 5 mins max? Yes.
      - BHW theory accurate? Yes.
      - Audience appropriate? Yes.
      - No accusation of laziness/bias? Yes.

      *Final Word Count Check:* Aiming for ~750 words.

      *Wait, one nuance:* In BHW, the cascade happens because the public information (previous decisions) becomes so strong that it outweighs the private signal. In a discussion, early vocal opinions act as those previous decisions. If I speak last, and everyone else loved it, even if I see a fatal flaw, I might think "They are experts, maybe I'm missing context," and suppress my objection. That's the cascade. Private scoring prevents this.

