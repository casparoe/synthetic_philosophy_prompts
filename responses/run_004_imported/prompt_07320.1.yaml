answer: |-
  Good morning, and welcome to the panel. It is a privilege to have such a diverse group of scholars here—spanning neuroscience, social psychology, and, I know, a significant number of you who specialize in judgment and decision-making.

  I want to begin by addressing a procedural rule that has been part of this foundation's workflow for as long as anyone can remember. You are required to submit your private written scores for each proposal *before* we open the floor for discussion. I know that for some of you, this feels like bureaucratic redundancy. If we are all experts, why not just discuss the science and reach a consensus?

  For half of you, the answer is familiar. For the rest, I ask for your patience as I explain why this rule is not about paperwork, but about information aggregation.

  This protocol is designed specifically to prevent what economists Sushil Bikhchandani, David Hirshleifer, and Paul Welch described as an **informational cascade**.

  Here is the mechanism. In any group decision, each of you arrives with **private information**—your unique assessment of the methodology, the theory, the data based on your specific expertise. You also observe **public information**—what your colleagues say during discussion.

  The theory of rational herding shows that even when every individual is rational, unbiased, and trying to be accurate, a cascade can occur if decisions are made sequentially. If the first few speakers express strong support for a proposal, they generate a public signal. As later reviewers listen, they weigh that public signal against their own private signal.

  At a certain point, the weight of the public consensus becomes so heavy that a rational reviewer will ignore their own private contradictory evidence. They think, "These are experts; if they all love it, perhaps my concern about the sample size is misplaced." They follow the herd. They do this not because they are lazy or easily swayed, but because it is statistically rational to trust the aggregated public signal over their single private data point.

  Once that happens, the cascade locks in. Your private information is lost to the group. We converge on a judgment that may be mistaken, not because we lack expertise, but because the structure of our conversation prevented us from utilizing all the expertise in the room.

  For those of you in JDM, you know the fragility of these cascades. They can form on the basis of very little initial information and are notoriously difficult to reverse. For those in other fields, the takeaway is this: **Discussion is valuable, but it is also contaminating.**

  If we discuss before scoring, we risk turning this panel into a sequential decision chain where the first voices disproportionately determine the outcome. We risk having brilliant critiques suppressed because they arrive too late in the conversation to outweigh the early consensus.

  By requiring private scores first, we force the aggregation of private signals *before* the public signal is generated. We ensure that your independent assessment is recorded while it is still pure. Only then do we open the discussion. This allows us to use the conversation to resolve discrepancies we now know exist, rather than using the conversation to inadvertently erase them.

  We are not here to protect you from bias; we are here to protect the process from the unintended consequences of rational information processing. We want every signal counted.

  So, when you sit down with your first proposal, please view that private score sheet not as administrative hurdles, but as your contribution to the collective intelligence of this group. It is the only way to ensure we are funding the best science, rather than just the most popularly defended science.

  Thank you, and let's get to work.
