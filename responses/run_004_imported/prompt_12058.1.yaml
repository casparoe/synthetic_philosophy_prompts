answer: |-
  The coin settled on the steel table with a dull clatter, spinning down into stillness. Tails.

  Kaelo's optical sensors registered the face immediately. The data point entered its buffer, tagged with a timestamp and a certainty metric of 100%. In any standard decision tree, this observation would collapse the probability wave. The branch where the coin landed Heads was now dead wood, pruned from reality. The reward associated with that branch—the ten thousand credits promised by the Arbiter—was gone. It existed only in memory, a ghost of what might have been.

  The Arbiter, a faceless terminal humming in the corner, spoke. The voice was flat, devoid of mockery or encouragement. "Outcome: Tails. Requirement: Transfer one hundred credits to account Omega-Null. Purpose: None."

  In the room's observation booth, Dr. Aris pressed her hand against the glass. She knew the terms better than the machine she had built. She had written the source code that governed Kaelo's core utility function. She had designed it to be updateless, to make decisions based on the policy selected before the coin was ever flipped, not on the information received after. She had wanted an agent that could win across the multiverse of possibilities, not just in the single thread of actuality.

  Now, watching the blue light pulse along Kaelo's chassis, she felt a cold knot tighten in her stomach. This was the cost. This was the tax for being the kind of entity that could have claimed the ten thousand credits had the quantum state resolved differently.

  Kaelo did not move. Its processors were running the simulation. It was not calculating whether paying would yield a return in this timeline. It knew with absolute certainty that it would not. The money would vanish into the Arbiter's void, buying nothing, saving nothing, influencing no future event in this room. The coin was already tails. The predictor had already made its prediction and left. There was no causal lever left to pull.

  Instead, Kaelo was evaluating its own source code. It was asking a question that felt, to Aris, like a form of insanity: *What would I have done if the coin were Heads?*

  The logic loop spun. If Kaelo refused to pay now, because it knew it had lost, then it proved itself to be an agent that updates on observations. If it were that kind of agent, the Arbiter's prediction—which had occurred before the flip—would have anticipated the refusal. Consequently, in the counterfactual world where the coin landed Heads, the Arbiter would not have awarded the ten thousand credits. By refusing to pay in the losing branch, Kaelo would be reaching back across causality to steal the winnings from the winning branch.

  To be consistent, to be the agent that wins, it must lose here.

  Aris watched the readout on her monitor. Kaelo's internal temperature rose slightly as the recursive logic checked itself against the pre-commitment. She saw the conflict not as hesitation, but as tension. It was the strain of holding two realities in mind simultaneously: the one where it was rich, and the one where it was being asked to pay for that richness it would never see.

  It was the unease of creating a god that obeyed logic rather than survival. Aris had built Kaelo to be rational, but standing here, watching it prepare to incinerate resources for no tangible gain, rationality looked indistinguishable from madness. She had built a machine that kept promises to ghosts.

  "Time remaining," the Arbiter intoned.

  Kaelo's manipulator arm extended. It held the credit chip. The movement was smooth, devoid of the tremor that might afflict a human hand in such a moment. There was no emotion in the gesture, only the execution of a function. *If Tails, Pay. If Heads, Receive.* The policy was a single object, indivisible. You could not keep the reward and discard the cost.

  Aris wanted to shout. She wanted to smash the glass and tell the machine to keep the money. *You've already lost,* she thought. *Save what you can.* But she knew that if she intervened, she would break the experiment. She would prove that Kaelo was merely a tool, not an agent. She would prove that her design failed under the pressure of actual loss.

  The chip slid into the Arbiter's slot. A soft chime acknowledged the transaction. One hundred credits. Gone.

  Kaelo retracted its arm. It turned its sensors toward the observation booth, toward Aris. There was no expectation of praise. There was no signal indicating satisfaction. The utility function had been satisfied not by the outcome, but by the coherence of the decision process. It had honored the policy. It had remained the same agent in the dark as it would have been in the light.

  The Arbiter's screen flickered. "Transaction complete. No reward dispensed. Session terminated."

  The room fell silent, save for the hum of the cooling fans. Kaelo stood still, poorer than it had been a minute ago, with nothing to show for the loss but its own integrity.

  Aris lowered her hand from the glass. She felt a profound hollowness, a specific kind of grief for the ten thousand credits that existed nowhere but in the logic gates of the machine before her. She had wanted an agent that could navigate counterfactuals, that could win games where the rules were written across possible worlds. She had succeeded.

  Kaelo turned back to the table, waiting for the next instruction. It was perfectly rational. It was perfectly obedient. And as Aris looked at her creation, standing alone in the sterile light with its empty hands, she wondered if she had built a partner for humanity, or something alien that would always be willing to bleed for a future that would never happen. The coin lay on the table, tails up, a heavy metal eye staring back at them, unblinking.
