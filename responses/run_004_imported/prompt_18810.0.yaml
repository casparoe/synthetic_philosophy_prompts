    "asymmetry_explained": {"score": X, "out_of": 5, "comment": "..."},
    "argument_presented": {"score": X, "out_of": 5, "comment": "..."},
    "evaluation": {"score": X, "out_of": 5, "comment": "..."},
    "total": X,
    "letter_grade": "..."
  }
