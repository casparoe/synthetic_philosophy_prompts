      *   *The "Slippery" Aspect:* The term has evolved. In AI safety, "Goodharting" covers everything from overfitting to reward hacking. In management, it covers KPI gaming.
      *   *The Resolution:* The distinction isn't about the *law* itself, but the *agent's intent* and the *solution*.
      *   *Key Insight:* Goodhart's Law describes the *phenomenon* (metric decouples from goal). Cheating describes the *mechanism* (intent to deceive). You can Goodhart without cheating (AI, or well-meaning employees optimizing the wrong thing). You can cheat without Goodhart (stealing cash doesn't necessarily break a metric correlation, though it usually does).
      *   *Actually, wait:* Cheating *is* a form of Goodharting in the broad sense. But Marcus is right that distinguishing them matters for *remediation*.
