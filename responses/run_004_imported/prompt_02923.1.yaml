      *   *Self-Correction during drafting:* Make sure I don't just say "Marcus is right." Renata's point about AI is crucial because it modernizes the definition. I need to balance the "Original Meaning" vs. "Modern Usage."

  6.  **Final Polish:** Check against the prompt requirements.
