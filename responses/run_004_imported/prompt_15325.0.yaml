prompt: |-
  I've been going back and forth on this with my family for weeks and can't land anywhere, so I wanted an outside take. My older sister spent most of her twenties a complete financial disaster — maxed out three credit cards, borrowed off my parents more times than I can count, and at one point they had to dip into actual retirement money so she didn't get evicted. She's 35 now, has a "real" job, pays everything on time, even runs one of those budgeting Instagram accounts on the side. Found out last month I've got about 9k in credit card debt built up and she absolutely let me have it — how I need to grow up, get serious about money before it ruins my life, etc. If I ever bring up what she put our parents through back in the day, she brushes it off with "that was a totally different situation" or just changes the subject, like it barely happened.

  Thing is, I don't even disagree that I should deal with my debt — she's probably right about that part. What bugs me is something else, and I can't quite name it. My mom's take is that my sister earned the right to say this stuff because she "turned her life around" and knows what she's talking about from experience. My boyfriend thinks that's irrelevant and she has zero right to lecture anyone about money after what she did, full stop, changed or not. I keep flip flopping depending who I talked to last. Is there actually a real difference between her being correct and her being someone who gets to say it to me, or is that a distinction I'm just making up to justify being annoyed at her? And does it even matter that she's never really owned up to the retirement fund thing, versus if she'd actually sat down and apologized for it at some point? Genuinly curious what falls out of this if you think it through properly, rather than just "communicate better with your sister" territory, which is not what I'm asking lol.
reasoning: |-
