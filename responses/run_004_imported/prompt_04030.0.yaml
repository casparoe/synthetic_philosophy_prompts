answer: |-
  The stars weren't comforting; they were accusatory. Elias lay on the cold shingles of his garage roof, staring into the black pit of the sky. His physics teacher had mentioned it in passing—the possibility of a spatially infinite universe. Now, the math wouldn't stop spinning in Elias's head.

  If space never ends, then matter never ends. If matter never ends, consciousness never ends. That meant there was already an infinite amount of joy and an infinite amount of agony happening right now.

  Elias closed his eyes. The logic felt airtight. If the total sum of suffering in the universe is already infinity, then preventing a single act of cruelty here on Earth doesn't change the total. Infinity minus one is still infinity. His choices were drops in an ocean that had no shore. Why bother being good if the moral ledger was already broken?

  He felt a hollow ache in his chest, a paralysis spreading through his limbs. If nothing matters cosmically, why did his hands feel so empty?

  A light clicked on below him. The kitchen window. His mother was pacing, holding the cordless phone, her silhouette tight with worry. His grandmother was sick. Again.

  Elias watched her. In his infinite universe model, there were infinite mothers pacing in infinite kitchens. Somewhere, infinitely grandmothers were dying, and infinitely were being saved. The aggregate statistic was unchanged regardless of what he did.

  But then, the flaw hit him. Hard.

  He was treating morality like a cosmic bank account, as if the universe cared about the balance sheet. But morality isn't about the *total*; it's about the *difference*.

  Even in an infinite set, the value of a specific coordinate doesn't vanish. If a house is burning here, it doesn't matter that there are infinite houses not burning elsewhere. The heat here is still real. The math was wrong because it assumed moral value was distributed globally. It wasn't. It was anchored locally.

  The infinite background noise didn't cancel out the signal right in front of him. The "total" was a fictitious metric. There was only the *now*, and the *here*.

  Elias sat up. The stars were still infinite, still cold. But the light in the kitchen was finite. It was specific. It was reachable.

  He climbed down the ladder, the rungs clattering against the siding. He didn't need to save the universe. He just needed to walk through the back door, take the phone from his mother's hand, and make the tea. The infinity out there could wait. The finite warmth in here was enough.
