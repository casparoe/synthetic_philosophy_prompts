answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee
  **FROM:** [Your Name]
  **DATE:** January 5, 2024
  **SUBJECT:** Recommendation on Voting Method Bylaws Amendment

  ### Executive Summary
  Following the counter-intuitive outcome of the December allocation vote, this memo recommends amending our bylaws to adopt **Approval Voting** for future cause-area selection. This recommendation includes a timeline for implementation by the next giving cycle. While no voting system is mathematically perfect, Approval Voting best aligns with our goal of robust, high-impact funding allocation and resolves the specific structural failures observed in our Instant-Runoff Voting (IRV) process.

  ### Context: The December Anomaly
  In December, increased first-preference support for *Pandemic Preparedness* contributed to its elimination rather than its victory. This is a **monotonicity failure**: a candidate gaining support should not be harmed by that gain. While IRV is designed to ensure a majority winner, it is susceptible to these paradoxes, particularly in fields with four or more strong options. This volatility undermines member confidence and risks allocating capital based on ballot-order artifacts rather than collective preference strength.

  ### Analysis of the "Arrow's Theorem" Objection
  A faction of the committee argues that because Arrow's Impossibility Theorem proves no ranked system can satisfy all fairness criteria simultaneously, switching methods merely trades one arbitrary pathology for another. This position requires serious engagement.

  **Where the Inference Holds:**
  The skeptics are correct that Arrow's Theorem (1951) demonstrates that for *ordinal* (ranked) systems, it is impossible to simultaneously satisfy Unrestricted Domain, Non-Dictatorship, Pareto Efficiency, and Independence of Irrelevant Alternatives (IIA). Consequently, switching from IRV to a Condorcet method (e.g., Schulze) does not escape Arrow's constraints. It trades IRV's monotonicity failures for potential vulnerabilities in later-stage elimination orders. If we remain within the universe of ranked ballots, the skeptics are right: we are choosing between flaws, not selecting a perfect mechanism.

  **Where the Inference Breaks Down:**
  The argument that "all systems are therefore arbitrary" fails on two grounds:

  1.  **Severity of Failure:** Not all impossibility results are equally damaging in practice. IRV's failure mode (non-monotonicity) directly contradicts the intuitive logic required for member trust ("more support should help"). Condorcet methods, while still subject to Arrow, satisfy the Condorcet Criterion (electing the option that beats all others head-to-head), which is generally more robust for small-field decisions than IRV's elimination logic.
  2.  **The Cardinal Escape Hatch:** Arrow's Theorem applies strictly to *ordinal* rankings. It does not apply to *cardinal* or evaluative systems where voters rate options independently rather than ranking them against one another. **Approval Voting** asks members, "Is this cause area worth funding?" rather than "Is Cause A better than Cause B?" Because voters can support multiple options without penalizing their favorite, Approval Voting satisfies IIA in contexts where ranked systems cannot. It is not a "rhetorical trick"; it is a categorically different input structure that bypasses the theorem's constraints.

  ### Recommendation: Approval Voting
  I recommend we adopt **Approval Voting**. Members may vote for as many cause areas as they deem worthy of funding. The cause areas with the most approval votes share the fund proportionally.

  **Rationale:**
  *   **Robustness:** It eliminates the monotonicity failure experienced in December. Gaining support never harms a cause's chances.
  *   **EA Alignment:** Effective Altruism often operates on funding thresholds (i.e., "Is this intervention cost-effective?") rather than strict winner-take-all comparisons. Approval voting mirrors this mental model better than ranking.
  *   **Simplicity:** Unlike Condorcet methods, which require complex tallying explanations for 150 members, Approval Voting is intuitively understood, reducing friction and increasing participation.
  *   **Strategic Resistance:** While no system is immune to strategy, Approval Voting minimizes the "lesser-evil" dilemma inherent in Plurality and IRV. Members can support both their ideal cause and a robust backup without fear of "wasting" their vote.

  ### Implementation Timeline
  To ensure a smooth transition for the next giving cycle, I propose the following schedule:

  *   **January 15:** Committee vote on bylaws amendment.
  *   **February 1:** Bylaws updated; voting method section revised to specify Approval Voting.
  *   **November 1:** Pre-vote communication sent to membership. This will include a brief explainer on *why* we switched (focusing on robustness and fairness) and a tutorial on Approval strategy (e.g., "Vote for every cause you would be happy to see funded").
  *   **December 1:** Ballots distributed.
  *   **December 15:** Results announced and funds allocated.

  ### Conclusion
  The skeptics are right that we cannot achieve mathematical perfection. However, we can achieve *improvement*. Sticking with IRV retains a known failure mode that has already damaged confidence. Reverting to Plurality would be a regression. Approval Voting offers a structurally distinct mechanism that bypasses the theoretical limitations of ranked systems while simplifying the voter experience.

  I request that we move to adopt this amendment at the January meeting.
