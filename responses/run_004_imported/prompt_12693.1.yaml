      *   **AI Commitment Races (Modern AI Safety/Game Theory):** Focuses on superintelligent agents. Key concept: Agents simulating each other. The race isn't just about who moves first physically, but who *commits* first in the logical space. Key twist: "Early commitment" might happen *before* full information is gathered because waiting is a disadvantage.
      *   **Key Differences to Explore:**
