      *   **The Weil Challenge:** Acknowledging the philosophical risk.
      *   **The Proposal:** "The Mandate-Limited Whip."
      *   **Why This Answers Weil:** Distinguishing Power from Truth.
      *   **The Case for Strict Discipline (Steelman):** Efficiency, Accountability, Defense.
