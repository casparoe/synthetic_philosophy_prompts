      *   **Next Steps.**

  9.  **Review against constraints:**
      *   One specific rule? Yes (Mandate-Limited Whip).
      *   Answer Weil's dangers? Yes (Limits the scope of "party loyalty").
      *   Strongest case for binding discipline? Yes (Included as a dedicated section).
      *   No vague compromise? Yes (It picks the "Conscience + Exceptions" side but defines the exceptions rigorously).

  10. **Final Polish:** Ensure the distinction between "Party Will" and "Public Mandate" is clear, as that is the philosophical pivot point against Weil. (Weil says Party Will *becomes* the Public Good falsely. We say Party Will is *limited* to the Public Mandate explicitly given).

