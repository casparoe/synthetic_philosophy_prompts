  2.  **Deconstruct Simone Weil's Argument (in *On the Abolition of All Political Parties*):**
      *   *Core Thesis:* The very structure of a party is evil.
      *   *Mechanism:* A party is a machine designed to grow and win. To do this, it needs cohesion.
