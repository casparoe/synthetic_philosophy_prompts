      *   **Constraint:** Use the actual structure of Berkeley's arguments in the specified texts, *not* his metaphysical idealism (*esse est percipi*).
      *   **Goal:** Provide a nuanced analysis that weighs the "ticket theory" against the "virtue/industry requirement."

  2.  **Deconstruct Berkeley's Economic Thought (based on the prompt and knowledge):**
      *   *The Querist:*
          *   Context: Irish economic stagnation.
