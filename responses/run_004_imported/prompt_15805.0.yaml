  3.  **Analyze Development 1: Post-1971 Fiat Currency:**
      *   *Feature:* No metallic backing. State-issued. Value based on trust/legal tender laws.
      *   *Berkeley's "Ticket" Theory:* Fits well. Money is a counter, not a commodity. Gold standard is unnecessary if the "counter" commands labor.
      *   *Berkeley's "Virtue/Industry" Theory:* Does the fiat represent real industry? Is it managed for the public good?
