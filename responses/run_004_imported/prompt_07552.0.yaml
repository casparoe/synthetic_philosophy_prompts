answer: |-
  The newsroom hummed with the quiet exhaustion of a deadline met. On the editor's desk lay the final proof of tomorrow's front page. Sarah, a philosopher of epistemology who moonlighted as a media critic, traced the headline with a cold finger. David, her friend and colleague from grad school, leaned against the copy editor's station, loosening his tie.

  "It's reckless," Sarah said, not looking up. "One anonymous source. No corroboration. The editor treated testimony as self-justifying."

  David sighed. "He treated it as human beings always treat testimony. You're asking for a level of verification that ignores how knowledge actually works. We're wired to believe."

  "We're wired to survive, not necessarily to print truth," Sarah countered, turning to face him. "You sound like a crude Reidan. But even Reid didn't say trust is blind. I'm talking about Fricker's local reductionism. The editor didn't need a global induction over all speakers, but he needed positive reasons in *this* specific case. Did he monitor cues of sincerity? Competence? With an anonymous source, the cues are severed. There's nothing to monitor."

  "But that's the trap," David said, pushing off the desk. "You ask for independent evidence of reliability. Where does that evidence come from? If I check the source's past record, I'm relying on someone else's testimony about that record. If I check the facts they claim, I'm relying on my own perception, which is fallible, or again, other reports. Coady made this clear: the reductionist demand for non-testimonial evidence creates a regress. Most of what you call 'independent evidence' is just testimonial evidence you've forgotten is testimonial."

  Sarah crossed her arms. "Don't caricature local reductionism. It's not about stepping outside the circle of testimony entirely. It's about sensitivity. A competent hearer monitors for coherence, for plausibility, for signs of deception. In a high-stakes context like this, the threshold for 'positive reasons' rises. If you lower the bar to 'default trust,' you erase the line between rational acceptance and gullibility. If the source is lying, and the editor had no independent lever to check them, that's not just bad luck. It's epistemic negligence."

  "Gullibility implies a failure of rationality," David shot back. "But Burge's Acceptance Principle holds that it is *a priori* rational to accept what is presented as true, unless there are specific defeaters. The burden of proof is on the doubter, not the believer. If we required positive reasons for every assertion before accepting it, communication would collapse. Think of a child learning language. They don't verify their parents' reliability before accepting the word 'water.' They trust to learn. Adults are in the same boat, just deeper in the water."

  "A child isn't publishing a story that could topple a government," Sarah said sharply. "The stakes change the epistemic context. You're conflating the transmission of language with the justification of news. If I tell you I saw a blue bird, default trust is fine. If I tell you I have evidence of a crime, you need more than the Acceptance Principle. You need to know *why* I'm telling you now. Why anonymously? Local reductionism accounts for this context-sensitivity. The editor didn't just accept; he should have reduced the trust to evidence of the source's motive and access. Did he? Or did he just hope?"

  David walked over to the window, looking out at the dark street. "Hope isn't the issue. It's about the structure of justification. You say he needed independent evidence. But suppose he checked the documents the source provided. How does he know the documents aren't forgeries? He relies on experts. Those experts rely on training provided by other experts. It's testimony all the way down. If you insist on cashing out trust in non-testimonial currency, you're bankrupt before you start. The editor trusted the source because the story cohered with what was already known. That coherence is a form of verification, but it relies on the default trustworthiness of the existing web of belief."

  "But that web could be rotten," Sarah insisted, stepping closer. "And if the source is feeding you a narrative that coheres perfectly because it's designed to, your 'default trust' becomes a vulnerability. Fricker's point is precisely that we *can* monitor locally. We can look for hesitation, inconsistency, motive. Anonymity removes the ability to assess character. So you must compensate with stronger independent evidence of the *claim*. If you don't, you aren't being rational; you're being convenient."

  "And if you demand that compensation every time," David turned back, "you become paralyzed. You assume the source is guilty until proven innocent. But testimony is a basic source of justification, on a par with perception. If I see a tree, I don't need independent evidence that my eyes are working before I believe there's a tree. Why should I need independent evidence that a speaker is reliable before I believe what they say? The editor treated the testimony as a perception of fact. To demand more is to demand a god's-eye view we don't have."

  "We're not gods, we're journalists," Sarah said, picking up the proof again. "And we have ethics. Ethics require minimizing harm. Running on a single uncorroborated source maximizes risk. Your 'Acceptance Principle' might work for a seminar room, but it doesn't work for the front page. You haven't answered the gullibility objection. If default trust is the norm, when is it ever rational *not* to believe?"

  "When there are defeaters," David said calmly. "Contradictions, known biases, implausibility."

  "And if the source is good at hiding those?"

  "Then we get it wrong," David said. "But we get it wrong because we are finite, not because we were irrational. You want rationality to be a shield against error. I'm saying it's just the proper functioning of our social nature."

  Sarah dropped the proof back onto the desk. The paper slapped against the wood. "So we print it, and if it's lies, we say we were functioning properly?"

  "I'm saying," David said, picking up his jacket, "that if you wait for certainty, you never print. And if you never trust, you never know."

  "And if you trust too easily," Sarah murmured, "you lose the right to be believed."

  They stood in the silence of the empty room, the press waiting upstairs, neither willing to concede the ground between risk and necessity.
