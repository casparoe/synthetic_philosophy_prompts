      *   *Point 2: The Function of the Anecdote.* It illustrates the *pathology* of purposiveness when detached from human need. The Tailor isn't saving to eat; he's saving for the sake of the number growing. This is the "spurious immortality" Keynes mentions.
      *   *Point 3: Addressing the "Undercutting" Fear.* Does this mock the accumulation that got us here? No. It acknowledges the cost. We *had* to be the Tailor to build the capital. But now we must stop being the Tailor. The joke is on the *persistence* of the habit, not its historical existence.
      *   *Point 4: The "End" of Saving.* Saving is instrumental. Consumption/ Living is the end. The Professor knows the debt is never paid (the end is never reached). Keynes warns us not to be the Tailor anymore.
