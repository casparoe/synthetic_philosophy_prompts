answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Rain streaks the window. Elena, a proponent of the Buck-Passing Account of value, stirs her tea. Marcus, her interlocutor and critic, leans forward over a notebook.*

  **Marcus:** Let's test your Buck-Passing Account again, Elena. You claim that for something to be good is just for it to have features that provide reasons for us to favor it. Value is nothing over and above the reasons to respond positively.

  **Elena:** That's the core thesis. To call something "good" is to say there are reasons to desire, admire, or protect it. We pass the buck of value to the normative force of reasons.

  **Marcus:** And "favor" covers the relevant pro-attitudes? Admiration, desire, respect?

  **Elena:** Precisely. The specific attitude depends on the object. We admire virtues, we desire pleasures, and so on.

  **Marcus:** Okay. Imagine I place a small, perfectly unremarkable patch of mud on the table. It has no aesthetic merit, no historical significance, no utility. By your lights, there are no features of this mud that give you reason to admire it. Therefore, it is not admirable.

  **Elena:** Agreed. It's just mud.

  **Marcus:** Now, imagine an eccentric billionaire is watching us. He announces that if you can bring yourself to genuinely admire this patch of mud for the next five minutes, he will transfer ten million dollars to a charity of your choice. Furthermore, he has a perfect track record of fulfilling such promises.

  **Elena:** I see where this is going.

  **Marcus:** Do you? You now have a tremendous reason to bring about the state of admiring this mud. The stakes are high; the charity needs the funds. You have a genuine, normative reason to want to admire the mud, and perhaps even to cultivate that admiration. But surely, Elena, the mud has not suddenly become *admirable*. The mud itself hasn't changed. It's still mud.

  **Elena:** It hasn't become admirable, no. But this doesn't refute my account. It just shows we need to be careful about *which* reasons count.

  **Marcus:** That's the "Wrong Kind of Reasons" objection. You're going to say the money provides a reason of the wrong kind?

  **Elena:** Exactly. The Buck-Passing Account isn't threatened by just any reason to have an attitude. It's only concerned with reasons of the *right* kind. The billionaire's offer gives you a reason to *want* to admire the mud, or a reason to *bring it about* that you admire it. But it doesn't give you a reason that bears on the mud's merit.

  **Marcus:** So you draw a line. On one side, reasons grounded in the object's own features—its beauty, its kindness, its complexity. On the other, reasons grounded in the incidental benefits of holding the attitude—like getting rich. Only the former make the object good.

  **Elena:** Yes. The right kind of reasons must be grounded in the properties of the object itself, not the consequences of the mental state.

  **Marcus:** But how do you draw that line without cheating? If you say, "The right kind of reasons are those that relate to the object's value-relevant features," haven't you just defined "right kind" as "reasons that make it good"?

  **Elena:** I wouldn't put it quite that circularly. I'd say the reasons must bear on the *correctness* of the attitude. Admiration is correct when its object is admirable. The money doesn't make the admiration correct; it just makes it beneficial.

  **Marcus:** "Correctness" is a normative notion, Elena. It's a cousin of value. If you have to appeal to the correctness of the attitude to filter the reasons, and you appeal to the reasons to define the value, aren't you spinning in a circle? You're trying to analyze value in terms of reasons, but you're selecting the reasons by appealing to... what makes the attitude fitting. Which is value.

  **Elena:** It's not necessarily circular if we can characterize the distinction structurally. We need a criterion that identifies the Right Kind of Reasons without explicitly invoking the concept of value or fittingness we're trying to analyze.

  **Marcus:** Is that possible? Let's shift domains. Consider belief. What is the goal of belief?

  **Elena:** Truth. To believe is to represent something as true.

  **Marcus:** Exactly. Now, consider Pascal's Wager. Pascal argues you have a massive prudential reason to believe in God. If you believe and He exists, infinite gain. If you don't and He exists, infinite loss. So, you have a reason to believe.

  **Elena:** A pragmatic reason, yes.

  **Marcus:** But that reason doesn't make God *exist*. It doesn't make the belief *true*. And crucially, most epistemologists say it doesn't make the belief *justified* in the epistemic sense. So, we have the exact same structure. You have reasons for belief (evidence) and reasons against belief or for having the belief (pragmatic payoffs).

  **Elena:** I accept the parallel. In epistemology, we distinguish evidential reasons from pragmatic reasons.

  **Marcus:** But on what basis? If you say "evidential reasons are those relevant to the truth," you've appealed to truth. If you say "reasons relevant to value are those relevant to fittingness," you've appealed to value. If the Buck-Passing Account is supposed to *reduce* value to reasons, it can't rely on a pre-existing grasp of value to sort the reasons. If you can't solve this for belief without appealing to truth, can you solve it for value without appealing to goodness?

  **Elena:** That is the challenge. But the parallel suggests a path forward. In epistemology, we might say evidential reasons are those that stand in a probabilistic or explanatory relation to the content of the belief. Pragmatic reasons stand in a causal relation to the *consequences* of holding the belief.

  **Marcus:** So for value?

  **Elena:** For value, the Right Kind of Reasons must stand in a relation to the *properties* of the object, not the *state* of the subject. The money is a property of the situation surrounding the subject, not the mud.

  **Marcus:** But what if the demon threatens to kill you unless you admire the mud? Now the reason is about your survival, which is a property of you, the subject. Is that the Right Kind?

  **Elena:** No. It's still external to the object of the attitude.

  **Marcus:** But suppose the mud has a property: "being such that admiring it saves your life." That is a property of the mud, relational though it may be. It is a feature of the object. Does that feature make the mud admirable?

  **Elena:** *Pauses.* Intuitively, no. It makes it prudent to admire, but not admirable.

  **Marcus:** Then the distinction can't simply be "object properties" versus "subject consequences." Some object properties generate Wrong Kind reasons. So you need a filter that says, "This property counts toward admirability, that one counts toward prudence." But what is that filter, if not "admirability" itself?

  **Elena:** *Sighs.* You're pressing hard on the circularity.

  **Marcus:** I have to. If the Buck-Passing Account is to be a reductive analysis, the sorting mechanism for reasons must be independent of the value being analyzed.

  **Elena:** I grant that. If I say "Reasons of the right kind are those that make the object good," I haven't analyzed goodness; I've just renamed it.

  **Marcus:** So, where does that leave us? We have a theory that looks elegant—value is just reasons to favor—but it collapses unless we can solve the WKR problem. And solving it requires a distinction that we haven't successfully formulated without smuggling value back in.

  **Elena:** Not necessarily collapsed. Just incomplete. We know there *is* a difference between admiring the mud because it's beautiful and admiring it because of the money. The phenomenology is different. The structure of justification is different.

  **Marcus:** I agree there is a difference. The question is whether your theory can *capture* that difference using only the resources of reasons and attitudes, without presupposing the very notion of value you're trying to explain.

  **Elena:** So, for my defense to succeed, I need to provide a formal criterion.

  **Marcus:** Exactly.

  **Elena:** A criterion that classifies reasons into "Right" and "Wrong" kinds...

  **Marcus:** ...without defining "Right" as "conducive to value" or "fitting."

  **Elena:** And it must apply uniformly. If I use a solution for the mud case, it must also solve the Pascal's Wager case for belief. I can't treat value one way and truth another.

  **Marcus:** Because if the problem is structural, the solution must be structural. If you appeal to "truth" to solve the belief case, you admit that reasons alone aren't enough—you need a prior normative standard. If you need a prior normative standard for belief, you likely need one for value, which kills the reductive ambition of the Buck-Passing Account.

  **Elena:** So the condition for success is clear. I need to articulate a distinction between types of reasons that is prior to, and independent of, the normative notions of "good" or "true."

  **Marcus:** Precisely. You need a metaphysics of reasons that sorts them by their source or structure, not by their normative upshot.

  **Elena:** *Nods slowly.* If I can show that Right Kind reasons are those that figure in the *constitutive aim* of the attitude—where admiration aims at the admirable just as belief aims at the true—without defining that aim circularly... then the Buck-Passing Account survives.

  **Marcus:** And if you can't?

  **Elena:** Then value is not just reasons. There's something else doing the work.

  **Marcus:** Then we have more work to do. But at least we agree on the task.

  **Elena:** We do. The distinction must be non-circular, structural, and domain-invariant.

  **Marcus:** Cheers to that. *He lifts his coffee cup.*

  **Elena:** *Clinks her tea mug against his.* To the Right Kind of Reasons.
