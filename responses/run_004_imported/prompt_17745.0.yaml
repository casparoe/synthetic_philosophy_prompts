answer: |-
  Good evening. For those who don't know me, I'm the older sibling. Which means I've spent a lifetime trying to be a good role model, and now, three weeks before the wedding, I'm repaying that debt by sweating through a suit because my sister asked me to give the toast.

  But honestly, the pressure isn't just the occasion. It's the audience. Looking around this room, I see our family, who have lovingly endured four years of Thanksgiving dinners where "we don't have common priors" became code for "we are fighting about where to put Uncle Jerry." But I also see a third of this room who are actual game theorists. And I know that if I treat Aumann's Agreement Theorem as a punchline about compromise, the econ table is going to Dutch Book me before the cake is cut.

  So, let's get the math right.

  The theorem states that if two Bayesian rationalists share a **common prior**, and have **common knowledge** of each other's **posteriors**, they cannot agree to disagree.

  Note the constraints. It's not enough to share your private information. It's not enough to be smart. You need to start with the same fundamental map of the world, and you need to know that the other person knows what you believe.

  [Sister] and [Fiancé] met in a grad seminar on this. Their origin story is a screaming match on their second date about whether this applies to real humans. [Fiancé] argued it proves rational people must converge. [Sister] argued it's an impossibility result for idealized ghosts, not two stubborn people who can't agree on a wedding seating chart.

  Here is the truth I've observed from the outside: They do *not* have common priors. [Sister] is chaotic and optimistic; [Fiancé] is structured and skeptical. Their priors are wildly different. And for a long time, they didn't have common knowledge of posteriors—they were just shouting private information at each other.

  But there is a follow-up result to Aumann that I think explains why they work. It shows that if agents repeatedly announce their updated opinions to one another, iteration after iteration, their beliefs *will* eventually converge. Even without common priors. Even without perfect rationality.

  The math doesn't say you start in agreement. It says if you commit to the process of updating—if you keep telling each other where you stand, and you keep listening enough to change your own numbers—you move toward the same truth.

  That is what I see in this marriage. It isn't a static state of harmony. It is a dynamic system of endless updates. It's the willingness to say, "I see your posterior, and I need to adjust mine."

  To the family: You don't need to know the equations to see the result. To the department: You can verify the model. But for [Sister] and [Fiancé], the theorem isn't a constraint. It's a promise. A promise that as long as you keep talking, as long as you keep updating, you will never be so far apart that you can't find the same coordinate.

  May your priors be flexible, your communication be common knowledge, and your convergence be lifelong.

  To the happy couple.
