answer: |-
  **The Passenger Seat**

  **Characters:**
  *   **ELIAS:** A proponent of Planning-Optimality (Ex-Ante).
  *   **MARA:** A proponent of Action-Optimality (Ex-Interim).
  *   **THE DRIVER:** Silent, hands at ten and two, eyes fixed on the rain-slicked highway.

  **Setting:**
  A car moving at night on a featureless highway. Two exits approach. They are identical: unlit signs, same curvature, same off-ramp angle. The Driver is absent-minded; she knows the map, but she knows she will forget whether she has passed the first exit the moment she passes it.

  [The hum of the engine is a low, constant drone. Rain streaks the windshield, blurring the lights of the oncoming lane. The first exit sign glows in the distance, a pale green ghost.]

  **ELIAS**
  She's tightening her grip. Look at her knuckles.

  **MARA**
  She knows the first one is coming. She just doesn't know if *this* is the first one.

  **ELIAS**
  That's why we did the work before we started the engine. We solved it from the driveway. The view from nowhere. If she commits to a probability $p$ of exiting now, she maximizes her return over the whole trip.

  **MARA**
  But she isn't in the driveway, Elias. She's here. In the rain. At an intersection. Rationality isn't a contract you sign before you lose your memory. It's what you do when you're standing in the fog.

  **ELIAS**
  If she abandons the plan because the fog feels thick, she loses. Let's run it. Payoffs are fixed. Exit one: zero. She goes home early, wrong house. Exit two: four. Home. Overshoot: one. Motel.

  **MARA**
  She knows the payoffs.

  **ELIAS**
  Then she knows the calculus. Total expected utility is the probability of exiting at one times zero, plus the probability of exiting at two times four, plus the probability of overshooting times one.
  (He ticks it off on his fingers.)
  To exit at two, she must continue at one. That's $(1-p)$. Then exit at two. That's $p$. So the middle term is $4p(1-p)$. The overshoot is continuing twice: $(1-p)^2$.
  Equation: $E = 4p(1-p) + (1-p)^2$.
  Expand it: $4p - 4p^2 + 1 - 2p + p^2$.
  Simplify: $-3p^2 + 2p + 1$.
  Take the derivative. $-6p + 2 = 0$.
  $p = 1/3$.
  She exits one time in three. That is the only rational number.

  **MARA**
  That's the *planning* number. It assumes she can bind her future self. But when she gets to an intersection, she can't read the binding. She can only read the road. And the road looks the same at both spots.

  **ELIAS**
  So she flips a biased coin. Heads she exits, tails she continues. Bias is one-third.

  **MARA**
  Why should she trust the coin she minted ten miles ago? When she's staring at the exit sign, she has to ask: "What is the probability that *this* is the first exit?" Let's call that belief $\alpha$.

  **ELIAS**
  $\alpha$ is determined by the plan. If she plans to continue with probability $2/3$, then she is twice as likely to reach the second exit as she is to stop at the first. So the relative likelihood of being at the first exit is higher. Specifically, $\alpha = 1 / (1 + (1-p))$. If $p=1/3$, then $\alpha = 3/5$.

  **MARA**
  See? You're deriving her belief from the plan. You're saying, "Believe you are here *because* you decided you would be here." That's circular. From inside the car, without memory, these two intersections are indistinguishable types. Why shouldn't she invoke the Principle of Indifference? Why shouldn't $\alpha$ be $1/2$?

  **ELIAS**
  Because $1/2$ is wrong. It ignores the structure of the journey.

  **MARA**
  It ignores the structure, but it honors her evidence. Her evidence is: "I am at an intersection that looks like *this*." Both look like *this*. If I wake up in a room that looks identical to another room I visited yesterday, and I have no memory of yesterday, why should I bet I'm in the second one just because I planned to walk further?

  **ELIAS**
  Because if you bet you're in the first one with probability $1/2$, you'll exit too often. Let's do your math. If $\alpha = 1/2$.
  Expected utility of exiting now: $1/2(0) + 1/2(4) = 2$.
  Expected utility of continuing: $1/2(\text{Value at Next}) + 1/2(1)$.

  **MARA**
  And the Value at Next?

  **ELIAS**
  If she sticks to the plan $p=1/3$, the value at the next intersection is $1/3(4) + 2/3(1) = 2$.
  So continuing yields: $1/2(2) + 1/2(1) = 1.5$.

  **MARA**
  Exactly. Exiting gives 2. Continuing gives 1.5. If she honestly believes it's a 50/50 shot which exit this is, she *must* exit. She shouldn't be rolling a one-third biased coin. She should be exiting every time. $p=1$.

  **ELIAS**
  But if she exits every time, $p=1$, then she never reaches the second exit. Then the belief that it's 50/50 is falsified. She's always at the first exit. $\alpha$ becomes 1.

  **MARA**
  So she's trapped. If she uses the plan to set her belief, the plan holds. If she uses her immediate evidence to set her belief, the plan collapses. You're asking her to be rational from the outside, but she lives on the inside.

  **ELIAS**
  I'm asking her to be *effective*. The planning optimal $p=1/3$ yields an expected payoff of $1.33$. If she adopts your "honest belief" of $1/2$ and exits every time, her payoff is 0. She always takes the first exit. She never gets home.

  **MARA**
  Then the definition of rationality that leads to her never getting home is the one that's broken. You're telling her to ignore her own eyes. You're telling her, "When you look at this sign, don't calculate the odds of where you are. Calculate where the *ghost* of your past self decided you should be."

  **ELIAS**
  I'm telling her that her "eyes" are lying to her because her memory is gone. The only truth is the trajectory. If she re-optimizes at the intersection, she treats her past decision as sunk cost. But in this game, the past decision determines the probability of *being* at the intersection. It's not sunk. It's structural.

  **MARA**
  It's causal mysticism. How does her decision *now* change the fact of whether she passed the first exit? It doesn't. Causality flows forward. At this moment, she is either at Exit 1 or Exit 2. Her choice now cannot change which one it is. So she should maximize based on her credence of where she is.

  **ELIAS**
  But her credence *depends* on what she would have done previously! If she is the kind of agent who exits with $p=1$, she is almost certainly at Exit 1. If she is the kind of agent who exits with $p=1/3$, she has a significant chance of being at Exit 2. She cannot choose her action without implicitly choosing her location probability.

  **MARA**
  So she has to choose a *disposition*, not an action.

  **ELIAS**
  Yes.

  **MARA**
  But she feels the impulse to act *now*. The sign is right there.
  (She points. The green glow is fifty yards out.)
  If she thinks, "I am an agent who exits with $p=1/3$," then she calculates her belief as $3/5$. Then exiting gives $2/5(4) = 1.6$. Continuing gives $3/5(2) + 2/5(1) = 1.6$. She's indifferent.
  But indifference is unstable, Elias. If she suspects for a second that she might be the kind of person who values getting home *now* over the abstract plan, $\alpha$ shifts toward $1/2$. The moment she doubts the plan, the math tells her to abandon it.

  **ELIAS**
  Then she must not doubt. She must treat the plan as a physical law.

  **MARA**
  That's not rationality. That's religion. You want her to be a robot who executes code. But she's a thinker. A thinker updates on evidence. The evidence is "I am at an intersection."

  **ELIAS**
  The evidence is "I am at an intersection *given my strategy*."

  **MARA**
  You're smuggling the conclusion into the premise. You're saying "Rationality is doing what maximizes the start," and I'm saying "Rationality is doing what maximizes the now." And the tragedy is they don't match.
  (She leans forward.)
  Look at her. She's checking the mirror. She's looking for a clue. A gas station, a bend in the road. She knows if she finds one, the symmetry breaks. But there's nothing.

  **ELIAS**
  So she relies on the mix. $p=1/3$.

  **MARA**
  And if she lands on "Exit" for this roll of the dice, and it turns out this *was* the second exit, she'll kick herself. She'll say, "I was home! Why did I keep going?" And if she lands on "Continue" and it was the first exit, she'll say, "I risked the motel for nothing."
  From the inside, every outcome feels like a mistake. The planning optimal only looks optimal from the driveway. From the seat, it's just risk without knowledge.

  **ELIAS**
  It's risk with *purpose*. Without the plan, she's just drifting. With the plan, she's navigating a constraint she knows she has. The absent-mindedness is part of the terrain. You don't navigate a swamp by pretending it's solid ground. You navigate it by distributing your weight.

  **MARA**
  But the swamp doesn't care about your weight distribution. The swamp is just here.
  (The car slows. The exit ramp is ten yards away. The white line vibrates under the tires.)
  She has to decide. Not "she" as a concept. Her. Right now. Does she turn the wheel?

  **ELIAS**
  She turns it with probability one-third.

  **MARA**
  And what generates that probability? A memory she doesn't have? Or a calculation she can't verify?

  **ELIAS**
  A commitment she made when she was whole.

  **MARA**
  And if the person she is now doesn't endorse that commitment? If the person here, in the rain, calculates that the odds are 50/50 and the payoff says exit?

  **ELIAS**
  Then she is irrational.

  **MARA**
  Or then she is free.
  (Silence. The car passes the nose of the off-ramp.)
  She didn't turn.

  **ELIAS**
  Good. She continued. That's the $2/3$ majority.

  **MARA**
  Or she hesitated. Did she choose to continue, or did she just fail to turn? If she's truly absent-minded, she won't remember this conversation at the next exit. She'll face the exact same choice. Same rain. Same sign. Same math.

  **ELIAS**
  And she'll apply the same $p$.

  **MARA**
  But will she believe the same $\alpha$? If she knows she continued at the first one, does that change the likelihood this is the second one?

  **ELIAS**
  She doesn't *know* she continued. That's the point.

  **MARA**
  Exactly. She's in the dark. And you want her to navigate by a star she can't see.
  (She watches the Driver's hands. They are steady, but white-knuckled.)
  We're coming up on the second one. Same look. Same silence. If she exits now, she wins. If she continues, she loses to the motel. If she exits, was it because of the plan? Or because she got tired of the ambiguity?

  **ELIAS**
  It doesn't matter why. It matters if the frequency holds.

  **MARA**
  It matters to *her*. Rationality is supposed to guide the agent, not just the biography. If the guide says "Trust the plan" but the eyes say "Trust the odds," and they contradict... you're asking her to lobotomize herself to be consistent.

  **ELIAS**
  I'm asking her to be smart enough to know she's forgetful.

  **MARA**
  There's the second sign.
  (She pauses.)
  She's not reaching for the wheel.

  **ELIAS**
  She's continuing.

  **MARA**
  She's overshooting.

  **ELIAS**
  She's executing the mix. Sometimes you continue twice. That's the cost of the strategy.

  **MARA**
  Is it? Or is it the cost of a theory that can't survive the moment of contact?
  (The car passes the second exit. The highway stretches on into the dark. The payoff is 1.)
  We're going to the motel.

  **ELIAS**
  We're going to the motel with an expected value of $1.33$. Over a thousand trips, we win.

  **MARA**
  But there aren't a thousand trips. There's this one. And on this one, the "rational" plan left us in the dark.
  (She turns to Elias.)
  You solved the problem by removing the person from the solution.

  **ELIAS**
  I solved it by acknowledging the person is broken.

  **MARA**
  No. You solved it by pretending the break doesn't hurt.

  [The car drives on. The exits are gone. There is only the road ahead, and the memory of a turn neither of them can prove was the right one.]
