prompt: |-
  I'm a physics PhD student sitting in on a philosophy of physics seminar this semester (my advisor thinks its "good for my soul," lol), and last week's session on Bell's theorem left me more tangled up than when I walked in. The professor kept hammering on the point that Bell's factorizability condition isn't really one assumption but secretly two, following the Jarrett/Shimony split into "parameter independence" (roughly: your outcome doesn't depend on the far-away setting) and "outcome independence" (your outcome doesn't depend on the far-away outcome, once you've fixed the hidden state and both settings). Everyone in the room seemed to already agree that QM keeps parameter independence, thanks to no-signalling, and dumps outcome independence instead, and that this is somehow the "less bad" way for locality to fail. I nodded along in the moment but honestly don't get why that's supposed to be comforting.

  What I'm stuck on is this: why do people treat an outcome-independence violation as so much more tolerable than a parameter-independence violation, when both seem to involve some real dependence between distant events? And doesn't outcome independence failing basically wreck Reichenbach's whole common-cause principle -- the hidden variable λ was supposed to be exactly the common cause that screens off the correlation between the two wings, and now it fails to screen off anything. So in what sense is λ still doing any explanatory work? I'd love a walkthrough of why the PI/OI split is treated as such a big deal, pitched at the intuition level rather than re-deriving the CHSH inequality (I've already got that part down), and one that actually engages with the Reichenbach angle instead of just repeating the "no superluminal signaling, so we're fine" line.
