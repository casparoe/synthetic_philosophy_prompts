      *   **Context:** Sitting in a Philosophy of Physics seminar. Advisor suggested it for "soul" (implies a need for conceptual clarity/peace of mind).
      *   **Problem:** Confused by the Jarrett/Shimony decomposition of Bell's Local Causality into Parameter Independence (PI) and Outcome Independence (OI). Specifically:
          *   Why is violating OI considered "less bad" than violating PI?
          *   How does violating OI affect Reichenbach's Common Cause Principle (RCCP)?
          *   If $\lambda$ fails to screen off correlations (due to OI violation), what explanatory work is it actually doing?
      *   **Constraint:** Intuition-level walkthrough, avoid re-deriving CHSH, engage deeply with Reichenbach, avoid shallow "no-signaling saves relativity" arguments.

  2.  **Deconstruct the Core Concepts:**
      *   **Bell's Local Causality (Factorizability):** $P(A, B | a, b, \lambda) = P(A | a, \lambda) P(B | b, \lambda)$.
      *   **Jarrett/Shimony Split:**
          *   **Parameter Independence (PI):** $P(A | a, b, \lambda) = P(A | a, \lambda)$. (Bob's setting doesn't affect Alice's outcome stats).
          *   **Outcome Independence (OI):** $P(A | a, b, B, \lambda) = P(A | a, b, \lambda)$. (Bob's outcome doesn't affect Alice's outcome stats, given settings and $\lambda$).
      *   **Quantum Mechanics:** Violates Factorizability. Satisfies PI (usually, in standard formalism). Violates OI.
      *   **Reichenbach's Common Cause Principle (RCCP):** If $A$ and $B$ are correlated, either $A \to B$, $B \to A$, or there exists a common cause $C$ such that $P(A, B | C) = P(A|C)P(B|C)$.

  3.  **Address the "Why is OI violation less bad?" question:**
      *   *Standard Answer:* PI violation implies signaling (controllability). OI violation does not (randomness).
      *   *User's Objection:* "Don't just say no-signaling." They want to know why the *dependence* itself is less troubling ontologically.
      *   *Deeper Answer:* It's about *controllability* vs. *correlation*. PI violation means I can change your reality by tweaking my knob. OI violation means our realities are correlated in a way $\lambda$ doesn't explain, but I can't *use* it to send a message.
      *   *Relativity:* PI violation conflicts with the *spirit* of SR (causal influence). OI violation conflicts with the *spirit* of Reichenbach (explanatory completeness). Physics tends to prioritize SR over Reichenbach.
      *   *Holism:* OI violation suggests the system is a single non-separable object, rather than two objects influencing each other.

  4.  **Address the Reichenbach/RCCP Angle (The Crux):**
