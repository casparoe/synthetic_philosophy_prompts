          *   Explain Bohm's loophole: It is explicitly Non-Local. The pilot wave connects particles instantly across space.
          *   Why is BM marginalized? Not because it's falsified, but because of Relativity compatibility issues and aesthetic/historical reasons. Mention Maudlin's stance (ontology clarity).
      *   **Part 2: Many-Worlds & Locality:**
