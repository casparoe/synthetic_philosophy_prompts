  5.  **Refining the Physics/Philosophy:**
      *   *Self-Correction on "Realism":* Be careful with the term "Realism." In Bell's context, it usually means "counterfactual definiteness" or "single outcome." In MWI, the wavefunction is real, but single outcomes aren't. In BM, particles are real.
