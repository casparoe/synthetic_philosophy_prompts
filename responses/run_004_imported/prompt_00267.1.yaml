          *   The Counter: What defines "Normal"?
          *   If "Normal" means "conditions where the frog survived," then BBs count if they were present.
          *   If "Normal" means "conditions where the mechanism worked correctly," we are begging the question (circularity). We need content to define normal function, but we need normal function to define content.
          *   *The Historical Indeterminacy:* Even with perfect fossil/genetic records, we only see the *correlation* between stimulus and reproduction. We never see the *intension* (the "aboutness").

      *   **Step 3: The Distality Problem as a Structural Limit.**
          *   Causal chains: Fly -> Photons -> Retinal Shadow -> Neural Firing -> Snap -> Nutrition.
