          *   Why stop at the Fly? Why not the "Nutritious Thing"? Why not the "Shadow"?
          *   Teleosemantics tries to cut the chain at the "consumer" (the snapping mechanism). But the consumer only cares about the *signal*, not the *source*.
          *   *Key Point:* Evolution is blind to the distinction between a sign and its cause. It only sees the efficacy of the sign.

      *   **Step 4: The "Swampfrog" / Modal Intuition (Optional but helpful).**
