      *   **The Disjunction Problem:** In the frog's history, flies, BBs, and pellets all triggered the snap. The frog ate flies. The mechanism fired for all. Why does it mean *fly* and not *fly-or-BB*?
      *   **The Distality Problem:** Did selection favor the mechanism because of the *retinal shadow* (proximal), the *fly in the air* (distal), or the *nutrient intake* (ultimate)?
      *   **The User's Intuition:** The indeterminacy is structural to the etiological framework.
      *   **My Goal:** Validate and strengthen this intuition using philosophical arguments (likely drawing from Fodor, but also more contemporary critiques like Godfrey-Smith, or the "Swampman" angle, though the focus is on disjunction/distality).

  3.  **Select the Target for Critique:**
      *   Ruth Millikan's "Normal Conditions" / "Proper Function" is the most sophisticated target. She argues that content is fixed by what the mechanism was *supposed* to do under *normal conditions* for its selection.
      *   Why target Millikan? Her view is the gold standard. If I can show her solution fails *in principle*, the broader project looks shaky.
      *   Alternative: Karen Neander. Also strong, but Millikan's "Normal Explanation" is more specific to the "history" aspect the user is questioning. Let's stick with Millikan as the primary foil, perhaps referencing Neander where appropriate.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the user's expertise. Validate their intuition. State the thesis: The indeterminacy is structural because natural selection operates on *correlations*, not *semantic relations*, and the "grain" of selection is too coarse to fix specific content.

      *   **Step 1: The Coarseness of Selection (The "Black Box" Argument).**
          *   Selection doesn't see "flies." It sees "calories captured per energy expended."
          *   The mechanism is selected for *output* (snap -> nutrition), not *input accuracy*.
          *   If the output is successful, the input description remains underdetermined.
          *   *Biological connection:* The user knows that "bug detectors" (Schmidt-integrated units) respond to specific visual features, not semantic categories like "fly."

      *   **Step 2: Critiquing Millikan's "Normal Conditions."**
