      *   **User Background:** Retired field biologist, specialized in frog sensory systems. This means they know the biology intimately (retinal ganglion cells, "bug detectors," snapping behavior, evolutionary context). They aren't a layperson; they understand the empirical grounding.
      *   **Current Interest:** Philosophy of mind, specifically teleosemantics (Millikan, Papineau, Neander).
      *   **The Problem:** The Disjunction Problem / Distality Problem (Fly vs. Small-Dark-Moving-Thing vs. Frog Food).
      *   **The Task:** Make the *strongest case* that this problem is *fatal* to teleosemantics. The argument must show that the indeterminacy is *in principle*, not just a lack of data. It must engage seriously with at least one standard teleosemantic reply (e.g., Millikan's "Normal Conditions" or Neander's "Selected Effects") and explain why it fails.
      *   **Tone:** Respectful, intellectually rigorous, acknowledging their expertise, but arguing the philosophical position requested.

  2.  **Deconstruct the Core Philosophical Issue:**
