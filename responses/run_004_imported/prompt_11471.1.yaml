      *   *The Conflict:* Is "We" a thing itself, or just "You + Me" working hard?
      *   *The Wedding Angle:* Vows look like Gilbert (binding), but living looks like Bratman (daily coordination).
      *   *The Resolution:* They don't need to agree on the *theory* to make the *practice* work. In fact, the tension makes it work.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the speaker's role (novelist, not philosopher). Set the stage. Acknowledge the split audience (family vs. philosophers).
