      *   *The Gilbert Bit:* "Once you commit, you are a plural subject." -> "You are a single team entity."
      *   *The Bratman Bit:* "Interlocking sub-plans." -> "I'll drive if you navigate."
      *   *The Wedding Vow:* The vow *looks* like Gilbert (binding), but the marriage *lives* like Bratman (daily choices).
      *   *The "No Winner" Rule:* Acknowledge that they've debated this for four years. They won't stop now. That's the point.
      *   *The Ending:* Bring it back to love. The theory doesn't matter as much as the showing up.

