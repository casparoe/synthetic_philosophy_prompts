          *   *Strengths:* Objective, clear, easy to administer. Prevents "competition for victimhood." Maintains boundaries in friendship.
          *   *Weaknesses:* Ignores context. Can feel cold or unsupportive in a close friendship.

      *   **The Tax Analogy:**
