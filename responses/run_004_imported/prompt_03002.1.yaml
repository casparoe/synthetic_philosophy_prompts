answer: |-
  This is a classic clash between two different definitions of "fairness." Neither of you is logically wrong, but you are arguing from different frameworks.

  Here is the breakdown of why you are both stuck, who is technically "right" regarding the money, and why your tax analogy doesn't quite land the way you think it does.

  ### 1. Your Friend's Argument: Procedural Fairness
  Your friend is arguing from **Entitlement and Precedent**.
  *   **The Logic:** The money came from a bill that was originally split 50/50. Therefore, the refund belongs to the payers in proportion to what they paid.
  *   **The Strength:** This is objective. It requires no investigation into personal finances, no judgment calls, and no awkward conversations. It treats the friendship as a partnership with clear rules.
  *   **The Weakness:** It ignores context. It treats money as having equal value to everyone, which isn't true. $120 might be a nice dinner for her, but groceries for you.

  **Verdict on this point:** In the context of shared expenses (roommates, joint bills), your friend has the stronger technical argument. A refund is a reversal of a transaction, not a distribution of wealth. If you had been billed *extra* because of a penalty, would you have agreed to pay 70% of the penalty because you make less money? Probably not. Consistency suggests the refund follows the bill.

  ### 2. Your Argument: Distributive Fairness
  You are arguing from **Utility and Need**.
  *   **The Logic:** Money has "diminishing marginal utility." The first $1,000 you earn is worth more than your 100th $1,000. Therefore, giving the money to the person who needs it most maximizes the total "good" the money does.
  *   **The Strength:** This is empathetic and economically sound regarding how money *feels*. It aligns with how close families or partners often operate (from each according to ability, to each according to need).
  *   **The Weakness:** It is subjective. As your friend noted, "need" is hard to measure. If you get more this time because of freelance hours, does she get more next time because she has student loans? It turns a simple refund into a means-tested welfare application between friends.

  **Verdict on this point:** You have the stronger *moral* argument, but the weaker *contractual* argument. You are asking for a redistribution of resources based on current hardship, which is a generous thing for a friend to *offer*, but a risky thing for a friend to *demand*.

  ### 3. The Tax Analogy
  You mentioned that we justify taxing rich people more than poor people, so why not apply that here? This is the part that is likely "bugging" you, but there are two key differences between the State and a Friendship:

  1.  **Voluntary vs. Mandatory:** You cannot opt out of paying taxes. You *can* opt out of sharing finances with a friend. Progressive taxation works because it is a binding social contract enforced by law. Friendship is a voluntary social contract.
  2.  **Income vs. Refund:** Taxes are levied on *income flow* to fund public services. This refund is a *return of capital*. A better analogy would be: If you and a friend bought a lottery ticket together 50/50 and won, would you split the winnings 50/50 even if you were broke and she was rich? Most people would say yes, because the *risk* was shared equally, so the *reward* should be too.

  ### The Real Issue: Entitlement vs. Generosity
  The reason this argument is tense is that you are framing your need as a **claim**, while she views the money as **property**.

  *   **Your view:** "I need this more, so I have a claim to a larger share."
  *   **Her view:** "This is my money returned to me. If I give you more, that is a gift, not an obligation."

  If she had said, *"Technically this is 50/50, but I know you're tight on cash, so take $150,"* you would feel supported. Because you asked for it based on need, she likely felt pressured or guilted, which triggered her defensive "slippery slope" argument.

  ### Who has the better argument?
  **Technically? Your friend.**
  In shared living expenses, consistency is king. If bills are 50/50, refunds are 50/50. Deviating from that sets a precedent that financial transparency is required for basic fairness, which can damage friendships.

  **Morally? It's a tie.**
  You are right that the money would do more good in your hands. She is right that fairness means treating the transaction equally regardless of outside factors.

  ### How to fix the feeling
  The reason you're still bugged is that you feel unsupported. You told her you were struggling, and she prioritized "math" over "friendship."

  However, consider this: **She is protecting the boundary of the friendship.** If she agrees to your logic, she establishes that future financial decisions between you will be based on who is suffering more. That can lead to resentment on both sides (you feeling guilty, her feeling used).

  **The Compromise:**
  If you want to resolve this without resentment, acknowledge her point on the *refund* but address your point on the *support*.
  *   **Accept the 50/50 split** on the refund (acknowledging the bill was shared).
  *   **Ask for support elsewhere.** "You're right about the refund. But since I am tight on cash, could you cover the next bill and I'll catch up in two months?"

  This separates the *transaction* (which should be fair) from the *friendship* (which should be supportive). It validates her logic while still addressing your need.
