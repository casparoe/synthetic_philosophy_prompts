      *   **Friend's Position:** Wants a 50/50 split. Argument based on *fairness/equality* and *precedent* (bills were split 50/50). Concerns about subjectivity and slippery slopes (anyone could claim need).
      *   **User's Lingering Doubt:** Feels the friend's logic ignores real-world examples where need *is* considered (e.g., progressive taxation).
      *   **Goal:** Determine who has the "better" argument, or at least provide a nuanced analysis that validates both perspectives while helping the user resolve the cognitive dissonance.

  2.  **Deconstruct the Arguments:**

