prompt: |-
  I cover science and ideas for a living, and outside of the actual writing I sit on my outlet's small internal standards committee -- three of us who get pulled in whenever theres a real fight about how a story got worded. We've got a case this week that's exposed a genuine fault line on the committee, and even though nobody would put it this way, I'm pretty sure we're actually arguing about epistemology without realizing it.

  Two incidents, both reporters who stated something flatly as fact in a published piece rather than hedging it as an allegation. Reporter A had two well-placed independent sources plus internal documents that all lined up -- did everything you'd want a careful reporter to do -- and the claim still turned out to be false, for reasons nobody could have caught in advance. Reporter B ran with a single tip she barely had grounds to trust, wrote it up as settled fact anyway, and it turned out to be exactly right. Half the committee wants to clear A and discipline B, on the theory that you can only be judged on what you had good reason to believe at the time, truth be damned. The other half wants it reversed, since isn't getting it right the whole point of stating something as fact instead of hedging it? And our editor-in-chief, who is not helping, wants a rule like "state it as fact only if you'd bet your job on it," which is really a rule about how sure you feel, not about your evidence or the truth at all.

  I interviewed an epistemologist a few years back for an unrelated story, and I have this nagging memory that "what has to be true of you before you're entitled to just flatly assert something" is an actual, named debate in philosophy, not something our committee is inventing from scratch -- I just never got the terms straight and don't want to fake my way through Thursday's meeting. Could you write the memo I need to bring? I want an actual recommendation, not a split-the-difference shrug: either one standard or an explicit ranked set of them if you think no single one can do the job, applied directly enough to A and B that it's clear whether either of them should face consequences, plus the strongest honest case for whichever standard you end up rejecting, since I will absolutely get challenged on it in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas writer, member of a 3-person internal standards committee at a media outlet.
      *   **Problem:** A dispute over two reporters (A and B) regarding asserting claims as fact vs. hedging.
          *   Reporter A: Good process (2 sources + docs), claim turned out false.
          *   Reporter B: Bad process (1 shaky tip), claim turned out true.
          *   Committee Split: Process vs. Outcome.
          *   Editor-in-Chief (EIC): Subjective confidence ("bet your job").
      *   **User's Insight:** Suspects this is an epistemological debate (Justified True Belief, etc.).
      *   **Task:** Write a memo for the Thursday meeting.
      *   **Requirements:**
          *   Identify the relevant philosophical concepts (epistemology).
          *   Provide an *actual recommendation* (no fence-sitting).
          *   Apply the standard directly to Reporters A and B (clear consequences).
          *   Present the strongest case for the *rejected* standard (steel-manning the opposition).
          *   Tone: Professional, intellectual but practical, suitable for an internal committee.

  2.  **Identify the Epistemological Core:**
      *   The core tension is between *Justification* (Process) and *Truth* (Outcome).
      *   In philosophy, this maps directly to the **Gettier Problem** and the definition of **Knowledge as Justified True Belief (JTB)**.
      *   *Reporter A:* Justified Belief, but False (Not Knowledge).
      *   *Reporter B:* Unjustified Belief, but True (Gettierized/Lucky Guess, Not Knowledge).
      *   *The EIC:* Focuses on *Certainty/Confidence* (Internal State), which is distinct from both Justification and Truth.
      *   *Journalism Ethics:* Generally aligns with **Reliabilism** or **Evidentialism** (Process-oriented) rather than **Infallibilism** (Truth-oriented). You can't know the future truth, only the quality of evidence.

  3.  **Determine the Recommendation:**
      *   *Option 1 (Truth/Outcome):* Punish A, Reward B. *Problem:* Incentivizes gambling, punishes diligence. Un sustainable for journalism.
      *   *Option 2 (Confidence/EIC):* "Bet your job." *Problem:* Subjective, ignores evidence quality, punishes humble experts, rewards arrogant gamblers.
      *   *Option 3 (Justification/Process):* Reward A, Punish B. *Problem:* Looks bad when A is wrong. *Benefit:* Sustainable, replicable, aligns with professional ethics.
      *   *Decision:* The recommendation *must* be Option 3 (Process/Justification). Journalism is a practice of verification, not prophecy. If you punish good process because of bad luck, you destroy the incentive for verification.
      *   *Philosophical Label:* **Epistemic Responsibility** / **Evidentialism** (Clifford's "Ethics of Belief") vs. **Veritism** (Truth-only).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the tension, validate the "epistemology" hunch. Name the concepts (Justified True Belief, Gettier Cases).
      *   **The Philosophical Context:** Briefly explain JTB.
          *   A = Justified False Belief.
          *   B = Unjustified True Belief (Gettier case).
          *   EIC = Subjective Certainty.
      *   **The Recommendation:** Adopt a **Process-Based Standard (Epistemic Justification)**.
          *   Why? Journalism is about *method*, not omniscience.
          *   Ruling on A: Cleared. (Did the work).
          *   Ruling on B: Disciplined. (Violated protocol, got lucky).
      *   **The Steel-Man (The Rejected Standard):** Why might someone argue for the Truth Standard (Veritism)?
          *   Credibility is currency. Being wrong hurts the brand regardless of process.
          *   Readers don't care about your sources; they care if you lied to them.
          *   *Counter-counter:* If we adopt this, reporters will only print press releases or hedge everything into oblivion.
      *   **Implementation:** How to phrase the rule? "Assert as fact when evidence meets threshold X," not "when you feel sure."
      *   **Closing:** Call to action.

  5.  **Refining the Tone:**
      *   Needs to sound like a colleague speaking to colleagues, not a philosophy lecture.
      *   Use the terms (Justification, Truth, Reliabilism) but define them quickly in context.
      *   Be decisive. The prompt asks for "no split-the-difference shrug."

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the EIC's "bet your job" comment?
      *   *Fix:* Yes, categorize it as "Subjective Certainty" and explain why it's dangerous (imposter syndrome vs. overconfidence).
      *   *Check:* Did I give a clear verdict on A and B?
      *   *Fix:* Yes, A is cleared, B is sanctioned.
      *   *Check:* Is the philosophical terminology accurate?
      *   *Fix:* Ensure the distinction between *Justification* and *Truth* is clear. Mention W.K. Clifford ("Ethics of Belief") as it fits the "duty to investigate" angle perfectly. Mention Gettier for the "lucky truth" angle.

  7.  **Final Polish:** Check formatting for readability. Ensure the "Strongest Case for Rejection" is genuinely strong, not a strawman. (The argument for Truth is that the audience trusts the *output*, not the *kitchen*.)

  8.  *(Final thought)*: Make sure to emphasize that while A was *factually* wrong, they were *epistemically* right. B was *factually* right, but *epistemically* wrong. This distinction is the key to the memo.

  9.  **Constructing the Output:** (Proceed to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Internal Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Standard of Assertion: Epistemic Justification vs. Factual Accuracy

  **The Core Conflict**

  We are currently operating under three conflicting definitions of "knowledge," which is why we cannot agree on Reporters A and B. You are correct that this is not a new problem; we are inadvertently reenacting a century-old debate in epistemology regarding the definition of **Justified True Belief (JTB)**.

  Traditionally, for a claim to count as knowledge, three conditions must be met:
  1.  **Truth:** The claim corresponds to reality.
  2.  **Belief:** The claimant accepts the claim.
  3.  **Justification:** The claimant has adequate evidence/reasoning.

  Our current cases break this triad:
  *   **Reporter A** had **Justification** (sources/docs) and **Belief**, but lacked **Truth**. (A Justified False Belief).
  *   **Reporter B** had **Truth** and **Belief**, but lacked **Justification**. (An Unjustified True Belief, often called a "Gettier Case" in philosophy).
  *   **The Editor-in-Chief** is proposing a standard of **Subjective Certainty** ("bet your job"), which is a psychological state, not an evidentiary one.

  **Recommendation**

  We must adopt a standard of **Epistemic Responsibility (Justification)** rather than Factual Infallibility (Truth) or Subjective Confidence.

  **The Ruling:**
  *   **Reporter A:** **Cleared.** No disciplinary action. The error was factual, not procedural.
  *   **Reporter B:** **Disciplined.** Violation of standards for asserting fact without adequate verification, regardless of the fortunate outcome.

  **The Rationale**

  Journalism is a practice of verification, not prophecy. We cannot judge our staff on information that is unknowable at the time of publication (Truth). We can only judge the quality of the process used to arrive at the assertion (Justification).

  If we punish Reporter A, we incentivize hedging to the point of uselessness ("Some sources suggest that potentially...") or discourage reporters from pursuing complex stories where documents might later be debunked. If we reward Reporter B, we incentivize gambling. We are telling staff that if they take a reckless shortcut and get lucky, they will be rewarded. This destroys the reproducibility of our standards.

  The EIC's "bet your job" standard is equally dangerous. It measures *confidence*, not *competence*. A sociopath can be more confident than an expert. Imposter syndrome affects diligent reporters; overconfidence affects reckless ones. Basing standards on internal emotional states makes enforcement impossible and subjective.

  **The Standard We Are Rejecting (and its Strongest Defense)**

  We are explicitly rejecting **Veritism** (the standard that only the Truth matters). I anticipate the argument for this position will be voiced as follows, and it is a strong argument:

  *"Our product is trust. The audience does not care about our sourcing methodology; they care that we told them something false. When Reporter A publishes a falsehood, our brand is damaged exactly as much as if they had lied. In the marketplace of credibility, the outcome is the only metric that survives. By clearing A, we are telling the audience that our process is more important than their being misled. If we want to be a fact-based outlet, facts must matter more than feelings about sources."*

  **The Rebuttal:**
  This argument holds only if we assume reporters have access to objective truth prior to publication. They do not. If we adopt Veritism, the only safe way to report is to reprint press releases or wait for official government confirmation (which may also be false). A Veritist standard forces reporters to be omniscient to be safe. It collapses the distinction between an *honest mistake* and a *lie*. Reporter A made an honest mistake based on the best available evidence; Reporter B acted with negligence that happened to align with reality. We must sanction negligence, even when it lucks into success.

  **Proposed Policy Language**

  To resolve this moving forward, I propose we amend our style guide to reflect an **Evidentialist Standard**:

  > "Claims may be stated as fact only when supported by multiple independent lines of evidence or primary documentation sufficient to convince a reasonable expert in the field. The correctness of the claim at a later date does not validate a lack of evidence at the time of publication, nor does an eventual error invalidate a claim made on sufficient evidence."

  **Next Steps**

  I move we close the cases on Reporters A and B based on the justification standard above. This aligns us with professional norms in science and intelligence analysis, where process is audited separately from outcome.

  Let's discuss Thursday.
