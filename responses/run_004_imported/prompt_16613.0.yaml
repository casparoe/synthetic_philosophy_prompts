prompt: |-
  I've been building this thing at work that tries to guess what users actually want just from what they click on, instead of asking them outright, and it's made me weirdly paranoid about reading people in real life now. My girlfriend keeps saying she wants us to cook more and eat out less, but judging by what she actually does, she orders takeout most nights and the instant pot she bought has been used like once. Every time I bring it up she insists she really does want to cook, shes just been busy and tired lately. So should I trust the data (what she actually does) over what she says here, or is that too simplistic? Kinda stuck on how to even weigh those against eachother.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** The user works on a product that infers user intent from behavior (clicks) rather than stated preferences (surveys/feedback).
      *   **Problem:** This work mindset is bleeding into their personal life (specifically, their relationship).
      *   **Specific Scenario:** Girlfriend says she wants to cook more/eat out less. Behavior shows she orders takeout often and rarely uses the Instant Pot.
      *   **Conflict:** Stated intent ("I want to cook") vs. Revealed preference (ordering takeout, not cooking).
      *   **Question:** Should I trust the data (behavior) over what she says, or is that too simplistic? How to weigh them?

  2.  **Identify the Core Issue:**
      *   The user is applying a *product analytics framework* to a *human relationship*.
      *   In product management, "revealed preference" (what users do) is often considered more truthful than "stated preference" (what users say) because users lie to themselves or designers to be polite.
      *   In relationships, communication is nuanced. Behavior isn't just "data"; it's influenced by energy, capacity, context, and emotion.
      *   The risk is dehumanizing the partner by treating her like a user to be optimized rather than a person to be understood.

  3.  **Evaluate "Data" vs. "Words" in this Context:**
      *   *The "Data" (Behavior):* She orders takeout. She doesn't use the Instant Pot. This indicates a *current reality* of low capacity for cooking.
      *   *The "Words" (Intent):* She says she wants to cook. This indicates a *value* or *goal* she holds.
      *   *The Discrepancy:* Why the gap? Is it laziness? Is it exhaustion? Is it the user's involvement? Is it the difficulty of the recipes?
      *   *The Product Analogy:* In UX, if a user says they want a feature but doesn't use it, it usually means the feature has too much friction, isn't solving the right pain point, or the onboarding is bad. It rarely means the user is "lying."

  4.  **Formulate the Advice:**
      *   **Validate the feeling:** It's common for work brain to spill over. Acknowledge the insight (behavior *does* matter).
      *   **Challenge the framework:** Explain why relationships $\neq$ products. Products are about utility/efficiency; relationships are about connection/empathy.
      *   **Reinterpret the "Data":** Don't see it as "she's lying." See it as "there is friction."
      *   **Actionable Steps:**
          *   Shift from "Auditor" to "Partner."
          *   Investigate the *why* (friction analysis).
          *   Collaborate on the solution (reduce friction).
          *   Communicate about the dynamic, not just the cooking.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Opening:* Acknowledge the "work brain" bleed. It's a fascinating observation.
      *   *The Product Analogy:* Use their language. In UX, if clicks don't match surveys, it's usually a *usability* issue, not a *truth* issue.
      *   *The Relationship Nuance:* Intent vs. Capacity. She might *want* to (intent) but *can't* right now (capacity/energy).
      *   *The Danger:* If you treat her like a user, she'll feel managed, not loved.
      *   *Reframing:* Instead of "Trust Data > Words," try "Words = Goal, Data = Obstacles."
      *   *Practical Advice:*
          *   Don't confront with "stats."
          *   Ask about the friction. "What makes cooking hard right now?"
          *   Offer help. "How can we make this easier?"
          *   Check your own role. Are you expecting her to do all the cooking?
      *   *Conclusion:* Balance is key. Both matter.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but firm on the boundary between work and life.
      *   Avoid taking sides (don't say "she's lazy" or "you're controlling").
      *   Focus on the *dynamic*.

  7.  **Final Polish (incorporating specific points):**
      *   Highlight the "Intent vs. Execution" gap.
      *   Mention "friction" (UX term applied to life).
      *   Warn against the "God mode" of analytics.
      *   Suggest a "usability test" conversation.

  8.  **Self-Correction/Safety Check:**
      *   *Is this relationship advice?* Yes, but framed through the user's professional lens.
      *   *Is it harmful?* No, it encourages communication and empathy.
      *   *Did I answer the prompt?* Yes, addressed trusting data vs. words.

  9.  **Final Output Generation:** (This matches the structure of the provided good response.)
      *   Validate the "work brain."
      *   UX analogy (Friction vs. Desire).
      *   Capacity vs. Intent.
      *   The risk of optimization.
      *   Actionable steps.

  *(Self-Correction during drafting)*: I should make sure not to imply the user is wrong for noticing the pattern. The pattern is real. The *interpretation* is where the trap lies. I need to emphasize that behavior reveals *barriers*, not necessarily *falsehoods*.

  10. **Finalizing the text.** (Proceed to generate response).
answer: |-
  This is a fascinating example of "work brain" bleeding into personal life, and honestly, your instinct to question the discrepancy is valid. In product analytics, you're right: **revealed preference (behavior) is usually a stronger signal than stated preference (surveys).** Users often say they want healthy features but click on the junk food ones.

  However, applying a pure analytics framework to a human relationship is a category error that can lead to resentment. Here is how to weigh the "data" against the "words" without turning your girlfriend into a user cohort.

  ### 1. Reframe the "Data": It's Not Lying, It's Friction
  In UX, when a user says they want to do $X$ but keeps doing $Y$, you don't conclude the user is a liar. You conclude there is **friction** preventing $X$.

  *   **Stated Preference:** "I value home cooking." (This is likely true; it's her identity/goal.)
  *   **Revealed Preference:** "I order takeout." (This is her current reality.)
  *   **The Gap:** This isn't necessarily hypocrisy. It's likely an **energy/capacity issue.**

  If you treat her behavior as "false data," you become an auditor. If you treat her behavior as "usability data," you become a partner. The Instant Pot sitting unused isn't proof she doesn't want to cook; it's proof that the *process* of cooking right now is too high-friction for her energy levels.

  ### 2. Intent vs. Capacity
  In product terms, think of this as **Demand vs. Supply.**
  *   **Demand:** She wants to cook (High).
  *   **Supply:** She has the time/energy/spoons to cook (Low).

  When you bring it up and she says she's "busy and tired," she is giving you the qualitative data behind the quantitative drop-off. If you ignore that because the "clicks" (takeout orders) say otherwise, you are optimizing for efficiency rather than human capacity.

  **The Risk:** If you push the "data" argument ("But you ordered takeout 4 times this week"), she will feel managed, not understood. It implies she is failing a KPI you set for her.

  ### 3. The "Optimization" Trap
  At work, your goal is to align behavior with intent to improve metrics. In a relationship, the goal is connection.
  *   **Work Mindset:** "How do I fix this bug so she cooks?"
  *   **Relationship Mindset:** "Why is she tired, and how do we handle dinner together?"

  If you "solve" this by proving she's wrong based on the data, you win the argument but lose the connection. She might feel she has to defend her exhaustion rather than share it.

  ### 4. How to Weigh Them (A Practical Framework)
  Don't choose one over the other. Use them together to find the root cause.

  *   **Trust her Words for Values:** Believe that she *wants* to be the kind of person who cooks. That is important to her self-image. Validate that. ("I know you really value us eating healthy home meals.")
  *   **Trust her Actions for Current Reality:** Accept that right now, cooking isn't happening. Don't fight the reality. ("But I see that work has been draining you, and the pot isn't getting used.")
  *   **Investigate the "Why":** In product, you'd run user interviews. Do that here.
      *   *Bad approach:* "You say you want to cook, but you keep ordering Thai food."
      *   *Good approach:* "I know you want to cook, but you seem exhausted. Is the prep work too much? Is it deciding what to make? Do you need me to handle the chopping so you just have to stir?"

  ### 5. Check Your Own "Clicks"
  One variable in your "experiment" might be your own behavior.
  *   Are you waiting for her to cook?
  *   If she cooks, do you clean?
  *   Is the "cooking more" goal something you both share, or is it something you want *her* to achieve?

  Sometimes, the "user" doesn't engage with the feature because the "product manager" (you) hasn't contributed to the ecosystem required to make the feature work.

  ### Summary
  **Trust her words about what she values. Trust her actions about what she can currently sustain.**

  The discrepancy isn't a lie; it's a bottleneck. Your job isn't to point out the bottleneck with a chart; it's to help clear it. Maybe that means meal prepping together on Sundays, maybe it means accepting takeout for a month while she rests, or maybe it means you take over dinner on Tuesdays and Thursdays.

  Treat her like a co-founder, not a user base.
