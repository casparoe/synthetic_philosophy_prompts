answer: |-
  The reference class problem is traditionally introduced as a fatal embarrassment for frequentism. As Hans Reichenbach famously noted, any individual event belongs to an infinite number of classes, each with a different relative frequency. If probability is defined strictly as relative frequency, then the probability of a single event is indeterminate until we specify the class. Since frequentism offers no non-circular principle for selecting the "correct" class (the narrowest reference class for which reliable statistics exist), critics argue we must abandon frequentism for an ontology that anchors probability in the single case itself.

  The two most prominent alternatives are **propensity theories**, which locate probability in physical dispositions of specific setups, and **Humean Best-System Accounts (BSA)**, which locate probability in the axioms of the system that best balances simplicity, strength, and fit with the totality of facts. The standard narrative suggests that because these theories define chance as a property of a singular situation (propensity) or a global systematization (BSA), they bypass the need to select a reference class.

  This narrative is mistaken. The preference for propensity or BSA accounts over frequentism is not well-founded because the reference class problem is not merely a defect of frequency *ontology*; it is a structural difficulty inherent in the *application* of probabilistic concepts to a complex world. Both propensity theories and BSA face structural analogues of the reference class problem. Trading frequentism for these alternatives does not resolve the underlying difficulty; it merely relocates it from the definition of probability to the specification of conditions or the selection of systems.

  ### The Frequentist Baseline
  To understand the analogues, we must first isolate the core structure of the frequentist reference class problem. It arises from a tension between **specificity** and **generality**.
  1.  **Generality:** To have a frequency, we need a repeatable class of events.
  2.  **Specificity:** To be relevant to the case at hand, the class must include all causally relevant factors.

  If the class is too general (e.g., "40-year-old males"), the frequency may not apply to the specific individual (e.g., a 40-year-old male *smoker*). If the class is too specific (e.g., "40-year-old male smokers named John born in May"), the class may contain only one member, rendering the frequency trivial (0 or 1). Frequentism fails because it lacks an internal principle to navigate this trade-off.

  ### The Propensity Analogue: The Specification of the Setup
  Propensity theories, championed by Karl Popper, attempt to solve this by defining probability as a physical disposition of a specific experimental setup to produce an outcome. This is ostensibly a singular-case interpretation: a specific coin toss has a propensity of 0.5 for heads, regardless of how many times the coin is actually tossed.

  However, propensities are not properties of bare particulars; they are properties of *types of setups*. A coin does not have a propensity to land heads *simpliciter*; it has that propensity *qua* member of a specific experimental arrangement. This reintroduces the reference class problem as the **problem of setup specification**.

  To assign a propensity to an event, one must specify the "generating conditions." Consider a radioactive atom. Does it have a propensity to decay based solely on its isotope? Or does the propensity change if the atom is in a strong magnetic field? Or if it is part of a specific molecular bond?
  *   **The Triviality Horn:** If we specify the generating conditions maximally (including every physical detail of the universe at the moment of the event), the outcome is determined by the laws of physics. The propensity collapses to 0 or 1. This destroys the concept of objective chance.
  *   **The Ambiguity Horn:** If we specify the conditions generally (e.g., "a Uranium-238 atom"), we ignore potentially relevant causal factors.

  The propensity theorist must therefore select which features of the physical situation are constitutive of the "setup" and which are mere background noise. This selection process is structurally identical to selecting a reference class. There is no propensity without a description of the setup, and there are indefinitely many descriptions of the setup. Unless the propensity theorist can provide a non-arbitrary principle for determining the *relevant causal features* that define the setup, they face the same indeterminacy as the frequentist. They have replaced the "reference class" with the "experimental arrangement," but the logical problem of classification remains.

  ### The Best-System Analogue: Fit and Natural Properties
  The Humean Best-System Account (BSA), associated with David Lewis, defines objective chance as the probability value entailed by the deductive system that best summarizes the Humean mosaic (the totality of particular facts). The "best" system balances simplicity (few axioms), strength (predictive power), and **fit** (how well the probabilities match the actual frequencies in the world).

  Critics often assume BSA avoids the reference class problem because the "Best System" is global. However, the criterion of **fit** reintroduces the problem. To determine if a system has good fit, we must compare the system's probability assignments to the actual frequencies of outcomes in the mosaic. But frequencies of *what*?

  1.  **The Subset Problem:** Suppose the Best System assigns a chance of 0.5 to event type $A$. In the actual history of the world, the frequency of $A$ is indeed roughly 0.5. However, suppose there is a subset of $A$-events, defined by property $B$, where the frequency is 0.9. Does the system have bad fit? If the system ignores $B$, it might be simpler, but its fit is questionable regarding that subset. If the system includes $B$, it becomes more complex. The determination of which regularities count towards "fit" requires partitioning the mosaic into relevant patterns. This partitioning is precisely the reference class problem. The BSA must decide which subsets of events are "significant" enough to demand accommodation in the system.
  2.  **The Natural Properties Constraint:** Lewis acknowledged that without constraints, one could game the system by using gerrymandered predicates (e.g., "grue") to achieve perfect fit with low complexity. To prevent this, BSA relies on "natural properties." The system must be formulated in terms of properties that carve nature at its joints. However, identifying which properties are "natural" is metaphysically contentious. More importantly, the choice of natural properties effectively dictates the reference classes available for probability assignment. If "being a smoker" is not deemed a natural property in the fundamental vocabulary of the Best System, the system cannot assign a specific chance to smokers distinct from the general population. The selection of the system's vocabulary is a proxy for the selection of the reference class.

  Furthermore, when an agent applies the BSA chance to a specific case (via the Principal Principle), they must identify which theorem of the Best System applies to their situation. If I am betting on a coin toss, do I apply the theorem for "fair coins," "biased coins," or "coins tossed in a vacuum"? The gap between the global system and the local application requires a judgment of relevance that mirrors the frequentist's class selection.

  ### The Deep Structure: Relevance and Abstraction
  The persistence of the reference class problem across these ontologies suggests that the difficulty is not specific to frequentism. Rather, it is a feature of probabilistic reasoning itself. Probability is a tool for managing ignorance in a world of infinite detail. To apply probability, we must always **abstract** from the unique totality of a singular event to a general type.

  *   **Frequentism** abstracts to a class of events.
  *   **Propensity** abstracts to a type of generating setup.
  *   **BSA** abstracts to a system of regularities over natural properties.

  In all three cases, the abstraction requires a criterion of **relevance**. We must decide which differences between events are probabilistically significant and which are negligible. Frequentism fails because it tries to derive this relevance from the frequencies themselves (which is circular). Propensity and BSA do not necessarily fare better; they simply push the requirement for relevance into the metaphysics of "setups" or "natural properties."

  If the propensity theorist says, "The setup includes all causally relevant factors," they must explain how to identify causal relevance without already presupposing probabilistic outcomes. If the Humean says, "The system includes all significant regularities," they must define significance without circularly appealing to the probabilities the system is meant to ground.

  ### Conclusion
  The preference for propensity or Best-System accounts over frequentism, based on the assumption that they dissolve the reference class problem, is not well-founded. The reference class problem is not merely a bug in the definition of probability as frequency; it is a structural consequence of applying general probabilistic laws to particular cases.

  Propensity theories face the **setup specification problem**, where defining the disposition-generating conditions requires the same arbitrary selection as choosing a reference class. Best-System accounts face the **fit and vocabulary problem**, where determining which regularities constrain the system replicates the difficulty of selecting relevant classes. Until a theory can provide a non-circular, objective principle for determining which features of the world are probabilistically relevant, the reference class problem remains a universal challenge for objective chance, regardless of the underlying ontology. Trading frequentism for its rivals changes the vocabulary of the problem, but not its logic.
