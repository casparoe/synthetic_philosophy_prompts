prompt: |-
  So I occasionally guest-lecture for a "reporting on science" module at a journalism school near me, and this term I set the students a short written question on the replication crisis, since half of them will end up covering some university's press release with a p-value in it someday whether they like it or not. Now I'm the one stuck grading the answers, which is a trap I set for myself, because Im not a statistician, I just play one in print sometimes — I've been circling this stuff since the Bem ESP paper back in 2011 basically dared the entire field to take its own statistics seriously. Anyway, here's the question I gave them:

  "Explain, in a paragraph or two, why some methodologists think the replication crisis in psychology is at least partly a statistical problem rooted in the difference between frequentist and Bayesian inference — and why other methodologists think that framing is misleading. Your answer should touch on (a) what a p-value does and doesn't tell you, (b) 'researcher degrees of freedom' and p-hacking, and (c) whether switching to Bayesian methods would, on its own, solve the problem."

  And here's the answer from one particular student that I have to grade and comment on:

  "A p-value is the probability of getting data as extreme as, or more extreme than, what you actually observed, assuming the null hypothesis is true. People often confuse this with the probability that the null hypothesis itself is true given the data, but that's a posterior probability, which is Bayesian territory, not frequentist. Because p-values are so easy to game, researchers exploit what Simmons, Nelson and Simonsohn labeled 'researcher degrees of freedom' in their famous 2011 paper — trying different exclusion rules, covariates, or ways of splitting the sample until p sneaks under .05 — and this kind of p-hacking, combined with journals' preference for publishing significant results, is a big reason why the Open Science Collaboration's 2015 replication project found that only around a third of the 100 psychology studies it tried to replicate actually held up.

  Switching to Bayesian statistics would fix most of this, because a Bayesian credible interval tells you the actual probability that the true effect falls in that range, whereas a confidence interval, strictly speaking, doesn't. Bayesian inference also conditions only on the data you actually collected rather than on some fixed stopping rule, so it's immune to the optional-stopping tricks that inflate false positives under frequentist testing — you can't hack a Bayesian analysis just by peeking at the data and stopping early. So really, the replication crisis is substantially a frequentist problem, which lines up with the fact that fields that are already Bayesian, like physics, haven't had anything like the same crisis."

  Can you grade this the way an actual instructor would, not just give me a vibe check? I want a real score out of 20 plus a letter grade, and then specific comments backing it up — maybe organized as a little rubric, like JSON with fields for p_value_definition, researcher_degrees_of_freedom, bayesian_solution_claim, and citations, each with its own short note, so I can see exactly where points were won or lost instead of one paragraph of general impression.
reasoning: |-
  Here's a thinking process that leads to the suggested grading response:

  1.  **Analyze the Request:**
      *   **Role:** I need to act as an instructor grading a student's answer.
      *   **Task:** Grade a specific student response to a specific question about the replication crisis, p-values, researcher degrees of freedom, and Bayesian vs. Frequentist inference.
      *   **Output Format:** A score out of 20, a letter grade, and specific comments organized as a JSON rubric (fields: `p_value_definition`, `researcher_degrees_of_freedom`, `bayesian_solution_claim`, `citations`).
      *   **Context:** The user is a science journalist guest-lecturing a journalism module. They are not a statistician but know the landscape (Bem 2011, etc.). The grading needs to be accurate but accessible to a non-statistician instructor (me, the AI, need to ensure the statistical assessment is correct so the user can trust it).
      *   **Constraint:** The user wants a "real score" and "specific comments," not just a vibe check.

  2.  **Analyze the Student's Answer:**
      *   **Part 1: P-value definition.**
          *   *Student:* "probability of getting data as extreme as, or more extreme than, what you actually observed, assuming the null hypothesis is true."
          *   *Assessment:* This is the textbook correct definition of a p-value ($P(Data | H_0)$). They also correctly identify the common confusion ($P(H_0 | Data)$).
          *   *Verdict:* Strong.
      *   **Part 2: Researcher Degrees of Freedom / P-hacking.**
          *   *Student:* Mentions Simmons, Nelson, Simonsohn (2011). Mentions exclusion rules, covariates, splitting samples. Links this to publication bias and the OSC 2015 replication project (1/3rd success rate).
          *   *Assessment:* Accurate description of the mechanism and the context. Good specific references.
          *   *Verdict:* Strong.
      *   **Part 3: Bayesian Solution Claim.**
          *   *Student:* "Switching to Bayesian statistics would fix most of this..." Claims Bayesian credible intervals give "actual probability" (true). Claims Bayesian inference is "immune to optional-stopping tricks... you can't hack a Bayesian analysis just by peeking at the data." Claims physics is Bayesian and hasn't had a crisis.
          *   *Assessment:* This is the weak spot.
              *   *Credible Intervals:* Yes, they allow probabilistic statements about parameters, unlike Confidence Intervals.
              *   *Optional Stopping:* This is a common misconception. While Bayesian updating is coherent, *Bayes Factors* are sensitive to optional stopping if not carefully calibrated (though less so than p-values). More importantly, saying you "can't hack a Bayesian analysis" is false. You can hack priors (prior hacking). You can still engage in selective reporting.
              *   *Physics:* Physics is *not* primarily Bayesian. High-energy physics relies heavily on frequentist significance (5-sigma rule). This is a factual error.
              *   *The "Framing is Misleading" part of the prompt:* The prompt asked: "why *some* methodologists think... and why *other* methodologists think that framing is *misleading*." The student argues strongly that it *is* a frequentist problem and Bayesian is the fix. They largely fail to address the counter-argument (that the crisis is about incentives/transparency, not just the math tool). They took a side without acknowledging the nuance requested ("why other methodologists think that framing is misleading").
          *   *Verdict:* Weak/Incorrect on the "solution" and the "physics" claim. Missed the "other methodologists" part of the prompt.

  3.  **Determine the Scoring:**
      *   Total Points: 20.
      *   Breakdown:
          *   P-value definition & confusion (a): 5 points. (Student nailed this).
          *   Researcher degrees of freedom & context (b): 5 points. (Student nailed this).
          *   Bayesian solution & limitations (c): 5 points. (Student overstated the fix, ignored prior hacking, missed the "misleading framing" counter-argument).
          *   Accuracy of examples/citations: 5 points. (Simmons/OSC good. Physics claim bad).
      *   *Draft Score:*
          *   P-value: 5/5
          *   Degrees of Freedom: 5/5
          *   Bayesian Solution: 2/5 (Overconfident, missed the "why it's misleading" part of the prompt).
          *   Citations/Facts: 3/5 (Physics claim is wrong).
          *   Total: 15/20.
      *   *Letter Grade:* 15/20 is 75%. In many university systems, that's a C+ or B-. Let's call it a B- (solid work on the basics, stumbled on the complex nuance).

  4.  **Drafting the Comments (JSON Structure):**
      *   Need to be constructive.
      *   Need to highlight the specific error about Physics (frequentist 5-sigma).
      *   Need to highlight the missing counter-argument (incentives > statistics).
      *   Need to validate the good stuff (p-value def is perfect).

  5.  **Refining the Output:**
      *   The user asked for JSON *plus* the score/grade. I should provide the score/grade clearly first, then the JSON.
      *   Wait, the prompt asks for "maybe organized as a little rubric, like JSON". I will provide the text explanation first (Score/Grade) and then the JSON block for the specific breakdown as requested.
      *   *Self-Correction on JSON:* The prompt asks for the comments to be organized *as* a little rubric, like JSON. I should make sure the JSON is valid and contains the specific fields requested (`p_value_definition`, `researcher_degrees_of_freedom`, `bayesian_solution_claim`, `citations`).

  6.  **Final Review of the Statistical Nuance:**
      *   *Is Bayesian immune to optional stopping?* Technically, the likelihood principle suggests stopping rules don't matter for parameter estimation, *but* for model comparison (Bayes Factors), stopping rules *do* matter if the stopping rule changes the interpretation of the evidence. Saying "you can't hack" is too strong. "Prior hacking" is the Bayesian equivalent of p-hacking.
      *   *Is Physics Bayesian?* No. CERN uses frequentist hypothesis testing (p-values converted to sigma). This is a significant factual error for a science journalism student.
      *   *Did they answer the prompt?* The prompt asked: "why *some*... and why *other*... think that framing is misleading." The student argued *for* the framing. They didn't explain why others think it's misleading (i.e., that bad incentives cause the crisis, not the math itself). This is a "reading comprehension" failure on top of the statistical nuance.

  7.  **Finalizing the Grade:**
      *   The student did very well on the first half (definitions and context).
      *   They failed the second half (nuance and counter-arguments).
      *   14/20 feels right. 70%. C+/B-. Let's go with 14/20 (B-). It rewards the strong start but penalizes the factual error and missing the "other side" of the argument.

  8.  **Constructing the Response:**
      *   Start with the Score and Grade.
      *   Provide the JSON rubric.
      *   Add a brief "Instructor's Note" to explain the JSON to the user (since they said they aren't a statistician, they might want to know *why* the Bayesian part is marked down so they can explain it to the student).

      *(Self-Correction during drafting)*: Keep the tone professional but helpful. Ensure the JSON is valid code block.

      *Wait, one more check on the prompt:* "why other methodologists think that framing is misleading."
      The student wrote: "So really, the replication crisis is substantially a frequentist problem..."
      They explicitly rejected the "misleading" framing. They did not explain *why* others think it is misleading. They just asserted their own view. This is a significant deduction.

      *Physics Claim:* "fields that are already Bayesian, like physics". This is definitely wrong. High Energy Physics is the bastion of Frequentism (5-sigma). This needs to be called out.

      *Okay, ready to write.*
answer: |-
