      *   *Impact on Animals:* If a machine can do it without a mind, then doing it doesn't prove a mind. So animals *could* potentially do it without a mind (which he already thought), but more importantly, humans might be doing it without a mind (which he denied). The distinction collapses.
      *   *Refinement:* Make sure to distinguish between "Universal Instrument" (Test 2) and "Language" (Test 1). LLMs are arguably universal instruments too.
