      *   *Descartes' Actual Argument:* Detail Part V of the *Discourse*. Highlight the two tests (Language and Universal Instrument). Crucially, note Descartes' claim that machines *cannot* pass the language test.
      *   *Evaluating the Friend:* She thinks Descartes anticipated fluent machines. He didn't. He thought that was impossible without reason. So she misreads his confidence.
