answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm a friend of the bride, which means I am one of the few people in this room who knows that Priya takes epistemology seriously.

  Four years ago, Priya and I started reading Nyaya commentaries together for our comprehensive exams. A few weeks ago, while we were both delirious from dissertation writing, I made a joke about structuring this toast around the four *pramanas*—the four valid means of knowledge in Nyaya philosophy. Priya laughed, then looked me in the eye and said, "You're actually going to do that, right?"

  So, here we are. I have a job in academia, but I value my life, so I am not backing out.

  For Mark's family and Priya's relatives: don't worry. I'm not going to quiz you. But for my colleagues in the back row: yes, I have checked the definitions. If I get *vyapti* wrong, you can correct me at the bar later.

  Nyaya says there are four ways we know things to be true. And looking at Priya and Mark, I realize we don't need just one. We need all four to know that this marriage is the real deal.

  First, there is **Pratyaksa**, or Perception. Direct sensory experience.
  Now, in Nyaya, perception isn't just glancing at something. It's an unmediated encounter with reality. And frankly, you don't need a PhD to perceive what is happening here. Just look at them. Look at Mark when Priya walks into the room. Look at Priya when Mark tells a story. There is a luminosity there. In philosophy, we argue about whether perception is infallible. But looking at the two of them tonight? The data is unambiguous. The joy is right there in front of you. It is *nirvikalpaka*—without doubt.

  Second, there is **Anumana**, or Inference.
  The classic Nyaya example is seeing smoke on a distant hill and inferring there is fire. Why? Because there is an invariable connection—*vyapti*—between smoke and fire. Where there's smoke, there's fire.
  Mark is an ER nurse. He knows that you look for the signs. You don't wait for the crisis; you look for the indicators. Over the last few years, we've seen the smoke. We've seen Mark bringing Priya coffee when she's been grading for six hours. We've seen Priya making sure Mark eats when he comes off a double shift. These small acts are the smoke. And because we know the invariable rule that consistent care implies deep love, we can confidently infer the fire. The warmth is undeniable.

  Third, there is **Upamana**, or Comparison.
  This is my favorite. The classic story involves a city dweller who doesn't know what a *gavaya*—a wild ox—is. A forester tells him, "A *gavaya* is like a cow." Later, the man goes into the forest, sees the animal, and recognizes it based on that analogy.
  When Mark started dating Priya, he was the city dweller. He didn't know what a "philosopher" was. He was told, "She's like a regular person, but she asks more questions." He entered the forest of academia, and he didn't run away. He recognized the match. He realized that while Priya might analyze the nature of reality, she is also just… Priya. He found the *gavaya*, and he realized he was exactly where he was supposed to be.

  Finally, there is **Sabda**, or Verbal Testimony.
  This is the tricky one. In Nyaya, not just anyone speaking counts as knowledge. The speaker must be an *Apta*—a reliable, competent, and honest authority.
  Now, I know several of Priya's aunties are planning to stand up later and say, "I always knew they were meant to be!"
  With all due love and respect to the aunties: by Nyaya standards, that is not *Sabda*. That is speculation. An *Apta* speaks from competence and truth.
  The true *Sabda* today isn't from the audience. It's from the couple. When they stand up in a moment to speak their vows, *that* is valid testimony. They are the experts on their own love. They are the *Apta*. And when they say "I do," that is the only testimony required to establish this union as knowledge.

  So, we have perceived their joy. We have inferred their love from their actions. We have recognized their match through comparison. And we are ready to accept their testimony.

  Priya and Mark, you have satisfied the conditions of knowledge. You are valid. You are true.

  Please raise your glasses. To the bride and groom. To the *pramanas*. And to a lifetime of knowing, and being known.

  Cheers!
