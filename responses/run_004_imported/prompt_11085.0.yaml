prompt: |-
  my best friend from my phd program is getting married in three weeks and I'm giving the toast, and I've gotten myself into a bit of a bind. Priya and I are both finishing dissertations on classical Indian philosophy -- she's the one who actually specializes in Nyaya epistemology, I'm more on the Buddhist logic side, but we've spent four years reading nyaya sutra commentaries together for our comps -- and she's marrying Mark, who is great but has never read a philosophy text in his life (he's an ER nurse). So the room is going to split almost exactly in half: her whole cohort and commitee, who will absolutely notice if I get vyapti wrong, and then Mark's family plus most of Priya's actual relatives, who just need this to be a sweet wedding toast and not a defense.

  A few weeks ago, half-delirious from studying, I told Priya I was going to structure the toast around the four pramanas -- perception, inference, comparison, and testimony -- as four different routes by which the room can be said to "know" these two are actually right for each other. She thought it was hilarious and is now holding me to it, so backing out isn't an option anymore. Could you actually write this toast for me? I want real content in there and not just the labels: use the smoke-on-the-hill inference for anumana, the classic gavaya (the wild-ox one) story for upamana, and for sabda I want a bit about what actually makes someone an "apta," a reliable testifier, since atleast three of Priya's aunties are planning to give impromptu testimony about how they "always knew" these two would end up together, and I suspect by Nyaya's own standards that shouldn't count as knowledge at all. Pratyaksa (perception) is the easy one -- "just look at them" -- but I'm sure you can do better than that too. It needs to land as an actual warm, funny wedding toast, around four or five minutes long, not a re-enactment of my qualifying exam.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD candidate in Buddhist Logic (friend of the bride).
      *   **Bride:** Priya, PhD candidate in Nyaya Epistemology.
      *   **Groom:** Mark, ER Nurse (non-philosopher).
      *   **Audience:** Split 50/50 between Philosophy academics (who know Nyaya) and Family/General Public (who don't).
      *   **Theme:** The Four *Pramanas* (Means of Knowledge) in Nyaya: *Pratyaksa* (Perception), *Anumana* (Inference), *Upamana* (Comparison/Analogy), *Sabda* (Testimony).
      *   **Specific Requirements:**
          *   Must be accurate to Nyaya (no getting *vyapti* wrong).
          *   Must use specific examples: Smoke-on-the-hill for *Anumana*, *Gavaya* (wild ox) for *Upamana*, *Apta* (reliable testifier) for *Sabda*.
          *   Must address the aunties' "testimony" humorously but philosophically.
          *   Tone: Warm, funny, wedding-appropriate (not a lecture), 4-5 minutes long (approx. 600-800 words spoken at a moderate pace).
          *   Constraint: Cannot back out of the *Pramana* structure.

  2.  **Deconstruct the Four *Pramanas* for a Wedding Context:**

      *   **Pratyaksa (Perception):** Direct sensory experience.
          *   *Philosophical nuance:* It's immediate, non-conceptual (nirvikalpaka) initially, then conceptual (savikalpaka).
          *   *Wedding application:* Looking at them together today. The spark, the body language. It's undeniable evidence.
      *   **Anumana (Inference):** Knowing through a mark (linga) and a universal relation (vyapti).
          *   *Philosophical nuance:* The classic example is seeing smoke on a hill and inferring fire because smoke is invariably concomitant with fire.
          *   *Wedding application:* Seeing small signs (the "smoke") that imply deep love (the "fire"). Mark making coffee, Priya laughing. The *vyapti* is the invariable connection between their actions and their commitment.
      *   **Upamana (Comparison):** Knowing through analogy.
          *   *Philosophical nuance:* The *gavaya* story. A city dweller doesn't know what a *gavaya* is. A forester says, "It's like a cow." Later, in the forest, he sees the animal and recognizes it based on the similarity.
          *   *Wedding application:* Mark didn't know what "marriage to a philosopher" looked like. He was told it's like X. Now he sees the reality. Or, finding a partner is like finding the *gavaya*—you have a description, but the realization happens in the wild. Let's go with: Mark entered the "forest" of dating, was given a description of Priya, and recognized her as the match.
      *   **Sabda (Testimony):** Verbal authority.
          *   *Philosophical nuance:* Must come from an *Apta* (trustworthy expert/truth-teller). Not just anyone speaking counts as knowledge.
          *   *Wedding application:* Address the aunties. They claim they "knew." But are they *apta*? Actually, *we* are the *apta* witnesses today. Or, the vows themselves are the ultimate *sabda*. Let's focus on the *apta* requirement to gently roast the aunties while validating the couple's own words.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the split audience. Set the stakes. Introduce the premise (Priya holding me to the promise).
      *   **Pratyaksa:** Keep it simple but elevated. "Look at them." The glow.
      *   **Anumana:** The Smoke/Fire analogy. Connect Mark's nursing (observant) to this. Establish the *vyapti* (invariable connection) between Mark's care and Priya's happiness.
      *   **Upamana:** The Gavaya story. Needs to be explained simply for the non-philosophers but accurately for the philosophers. Mark is the city dweller, Priya is the Gavaya (in a good way!).
      *   **Sabda:** The Auntie roast. Define *Apta*. Conclude that the couple's vows are the true *Sabda*.
      *   **Closing:** Bring it back to love. Raise a glass.

  4.  **Refining the Tone:**
      *   *Challenge:* Avoiding jargon overload.
      *   *Solution:* Define terms immediately in plain English. Use the jargon as punchlines.
      *   *Challenge:* Not alienating Mark's family.
      *   *Solution:* Make Mark the hero of the analogies (the practical one, the nurse).
      *   *Challenge:* Time limit.
      *   *Solution:* Keep explanations tight. Don't get bogged down in *nirvikalpaka* vs. *savikalpaka* unless it serves the joke.

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Smoke:* "Where there's smoke there's fire." Mark sees Priya's smile (smoke), infers love (fire).
      *   *Gavaya:* "Like a cow but not a cow." Mark looked for a wife, found Priya.
      *   *Apta:* Aunties talk too much. Only the wise speak truth.
      *   *Critique:* A bit dry. Needs more warmth. Needs to emphasize *why* they work.

  6.  **Drafting - Iteration 2 (Adding Warmth & Specifics):**
      *   *Intro:* Mention the 4 years of reading commentaries.
      *   *Pratyaksa:* Look at Mark's face when she walks in. That's perception.
      *   *Anumana:* Use the ER nurse angle. He deals with emergencies. But with her, it's calm. The smoke is the little things.
      *   *Upamana:* The forest story. Dating is the forest.
      *   *Sabda:* The aunties mean well, but *Sabda* requires competence. The real testimony is the vows.
      *   *Outro:* To the bride and groom.

  7.  **Final Polish (Checking Nyaya Accuracy):**
      *   *Vyapti:* Ensure I mention "invariable concomitance."
      *   *Gavaya:* Ensure the "city dweller/forester" dynamic is clear.
      *   *Apta:* Ensure the definition (competent + honest) is clear.
      *   *Timing:* Read aloud to check pace. (Aiming for ~750 words).

  8.  **Writing the Toast:** (Proceeding to generate the response based on these thoughts.)
      *   *Self-Correction during writing:* Make sure I don't sound condescending to the family. Frame the philosophy as a lens for *everyone* to understand love, not a secret club. Make sure the roast of the aunties is affectionate.

  9.  **Final Review against constraints:**
      *   4-5 mins? Yes.
      *   Nyaya accurate? Yes (Smoke, Gavaya, Apta).
      *   Warm/Funny? Yes.
      *   Addressed the split audience? Yes.

