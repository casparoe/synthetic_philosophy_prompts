      *   **Context:** A novel with a time-slip subplot set in Prague, c. 1610.
      *   **Character:** Johannes Kepler (loosely fictionalized).
      *   **Scenario:** A modern character shows Kepler a smartphone astrology app.
      *   **Problem:** The user wants to avoid the two common tropes (Wonder-struck Mystic vs. Skeptical Proto-Scientist).
      *   **Goal:** Reconstruct Kepler's *actual* nuanced position on astrology (based on *Tertius Interveniens* and his harmonic theory) and then write a response in his voice to the app, capturing the irony of precise data used for vague superstition.
      *   **Key Insight:** Kepler cared deeply about accurate planetary positions (astronomy) but rejected the traditional zodiacal/sign-based personality attributions (astrology) as arbitrary, favoring a physical/harmonic influence instead.

  2.  **Deconstruct Kepler's Actual Position (Historical Research):**
      *   *Source Material:* Primarily *Tertius Interveniens* (The Third Party Intervening, 1610) and *De Fundamentis Astrologiae Certioribus* (Concerning the More Certain Fundamentals of Astrology, 1601).
      *   *The "Third Way":* Kepler positioned himself between the "superstitious fatalists" (traditional astrologers who said the stars *force* human will) and the "atheistic skeptics" (who denied any celestial influence at all).
      *   *Mechanism:* He rejected the "signs" (Aries, Taurus, etc.) as arbitrary human divisions. He believed in *aspects* (geometric angles between planets: conjunction, sextile, square, trine, opposition).
      *   *Physics/Metaphysics:* Why do aspects matter? Not because of gods or myths, but because of *harmony*. The Earth has a soul (*anima terrae*) that perceives the geometric ratios of the planets (like music) and reacts physically (weather, human temperament). It's a physical/geometric resonance, not a symbolic one.
      *   *Data:* He was obsessed with accuracy (Rudolphine Tables) because if the geometry is wrong, the harmony is wrong.
      *   *Motivation:* Money/Survival. He needed to cast horoscopes for Emperor Rudolf II and Wallenstein to pay for his astronomical work. He often apologized for this necessity.

  3.  **Drafting the Reconstruction (The "Briefing"):**
      *   Need to explain *why* he believed what he believed.
      *   *Key distinction:* Astronomy (where the planets are) vs. Astrology (what it means).
      *   *Key rejection:* The 12 Signs. To Kepler, the constellations are just background stars. The *angles* between planets are what create the "music."
      *   *Key acceptance:* Influence exists, but it's subtle, physical, and probabilistic, not deterministic fate. It inclines, doesn't compel.
      *   *The Irony:* The app has perfect data (Rudolphine Tables dream) but uses the old, wrong system (Ptolemaic/Tropical zodiac signs).

  4.  **Drafting the Voice (The "Scene"):**
