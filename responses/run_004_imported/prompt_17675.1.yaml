      *   *Reaction to the Data:* Awe at the precision. "You have the Rudolphine Tables in your pocket?"
      *   *Reaction to the Interpretation:* Disappointment/Amusement. "You have the notes of the symphony, but you listen for the wrong melody."
      *   *Specific Critique:* The app says "Scorpio." Kepler says "There is no Scorpion. There is only Mars at this angle to Saturn."
      *   *The "Soft" Comment:* The app says "Scorpios are secretly soft." Kepler would find this trivialization of cosmic harmony insulting, yet perhaps acknowledge the *inclination* but not the *cause*.

  5.  **Refining the Argument (Self-Correction during drafting):**
