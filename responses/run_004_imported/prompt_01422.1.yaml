answer: |-
  # The Séance and the Syllogism: Sidgwick's Desperate Empiricism

  The dinner argument you describe cuts to the bone of Henry Sidgwick's legacy. It is a dispute not merely about biography, but about the architecture of moral philosophy itself. On one side stands the view of Sidgwick as the model of scientific integrity, extending his ethical rigor into the metaphysical unknown; on the other, Sidgwick as the anxious Victorian, conflating facts with values in a futile bid to secure the universe against moral chaos.

  To settle this, we must look past the superficial question of whether psychical research is "scientific" (Sidgwick was, as your friend notes, rigorously skeptical, famously helping to expose Madame Blavatsky) and ask the deeper philosophical question: *Could empirical evidence of the sort Sidgwick sought ever perform the normative work he required of it?*

  Below, I reconstruct the strongest versions of both your position and your friend's, examine how they clash over the nature of rationality, and offer a verdict.

  ### I. The Friend's Case: The Prudential Bridge

  Your friend's argument rests on a precise reading of Sidgwick's "dualism of practical reason." In *The Methods of Ethics*, Sidgwick concludes that reason validates two irreconcilable axioms: Rational Egoism (maximize your own happiness) and Utilitarianism (maximize universal happiness). In a godless, materialist universe, these can conflict. If being moral ruins your life, reason cannot tell you why you shouldn't be selfish. As Sidgwick famously wrote, without a reconciliation, "the Cosmos of Duty is thus really reduced to a Chaos."

  Your friend argues that Sidgwick's turn to psychical research was not a lapse into mysticism, but a logical extension of his hedonistic calculus. Sidgwick was a hedonist; he believed rational action aims at good consequences. If the "consequences" of action extend beyond death, then the calculation of self-interest changes.
  1.  **The Problem:** Duty and Self-Interest diverge in the short term.
  2.  **The Required Solution:** A guarantee that they converge in the *long* term (i.e., immortality + a moral government that rewards virtue).
  3.  **The Method:** Since this guarantee is not available *a priori*, it must be investigated *a posteriori*.

  On this reading, Sidgwick was not trying to derive an "ought" from an "is." He was trying to determine the *conditions* under which the "ought" of morality becomes the "ought" of prudence. If psychical research could prove survival and moral governance, then the Rational Egoist would *also* be compelled to be a Utilitarian, because their self-interest would be secured by the cosmic order. The Society for Psychical Research (SPR) was, effectively, a department of empirical theology. Your friend sees this as admirable consistency: Sidgwick identified a gap in the rationality of ethics and went to find the missing data.

  ### II. The User's Case: The Normative Wall

  Your objection is sharper. You argue that even if Sidgwick found what he was looking for—proof of telepathy, proof of survival—it would not solve the ethical problem. This is a variation of the Is-Ought problem, but more specific.
  1.  **Survival $\neq$ Justice:** Proving that consciousness survives death proves nothing about the *moral quality* of the afterlife. A demon survives death; a tormented soul survives death. Evidence of survival is not evidence of a "moral government of the universe."
  2.  **Prudence $\neq$ Morality:** Even if the universe *did* reward virtue, this does not validate the moral axiom; it dissolves it. If I am honest only because I fear post-mortem punishment or desire post-mortem reward, I am not acting on the axiom of Universal Benevolence; I am acting on Rational Egoism. The "dualism" isn't resolved; morality is simply swallowed by prudence.
  3.  **The Category Mistake:** Sidgwick treated a *Postulate of Practical Reason* (a necessary assumption for moral commitment) as a *Hypothesis of Empirical Science* (a claim to be verified by data). By demanding empirical proof for the coherence of reason, he undermined the autonomy of ethics.

  On this reading, the eighteen years spent on the SPR were not an extension of his philosophy, but a flight from its most difficult implication: that reason might indeed leave us in a "Chaos," and that moral commitment requires a leap of faith that evidence can never secure. You see this not as intellectual honesty, but as metaphysical anxiety masquerading as research.

  ### III. The Clash: Empirical Theology vs. Moral Autonomy

  How do these sides answer each other?

  **The Friend answers the User:** You are demanding too much of the evidence. Sidgwick knew survival alone wasn't enough; he looked for evidence of *moral purpose* (e.g., messages from the dead indicating moral progress). Furthermore, you claim this reduces morality to prudence. Sidgwick would reply: *So what?* If the only way to make morality rational is to align it with prudence, then that is what we must do. The goal is "rational conduct," not "pure moral sentiment." If psychical research makes virtue prudent, it saves rationality.

  **The User answers the Friend:** You are assuming that "rational conduct" can be saved by external sanctions. But if the only reason to be moral is that it pays off, you have abandoned the axiom of Universal Benevolence, which demands we seek the good *because* it is good. Sidgwick wanted to save both axioms. But by making Benevolence dependent on the evidence of survival, he makes it contingent. If the SPR had found no evidence (as they effectively did), Sidgwick's ethics implies we have no reason to be moral. This makes morality hostage to fortune-tellers and mediums. That is not a stable ethical system.

  ### IV. The Verdict

  To settle this, we must judge Sidgwick by his own philosophical lights. Sidgwick claimed to be an empiricist in metaphysics and a rationalist in ethics. He believed that for ethics to be "rational," it must be coherent with the facts of the universe.

  **The Verdict: Your friend is right about Sidgwick's motivation, but you are right about the philosophy. The project was a Category Mistake.**

  Here is the precise distinction: Sidgwick's error was not that he looked for evidence, but that he looked for the *wrong kind* of evidence to solve a *transcendental* problem.

  Sidgwick treated the harmony of Duty and Interest as a **contingent fact** about the universe (like the existence of gravity) that could be discovered by investigation. However, the harmony of Duty and Interest is a **condition of the possibility of practical reason**. By Kantian lights (which Sidgwick respected but ultimately rejected), this harmony must be *postulated* by the will, not *proven* by the senses.

  By moving the search from the realm of practical postulation to the realm of empirical investigation, Sidgwick committed a category error. He tried to weigh the conditions of rationality on a scale.
  *   **Why the Friend is partially right:** Sidgwick was not being hypocritical. Given his premise that "rationality requires coherence," and his refusal to accept religious dogma without evidence, the SPR was the only logical place to go. It was internally consistent.
  *   **Why the User wins the philosophical point:** Internal consistency does not save a project from being fundamentally misdirected. No amount of data on telepathy can bridge the normative gap. Evidence of survival is neutral data; it cannot carry the weight of "moral government." By seeking empirical validation for the rationality of morality, Sidgwick inadvertently conceded that without such validation, morality is *irrational*. This is a self-defeating position for an ethicist.

  **Conclusion:**
  Sidgwick's turn to psychical research was **rationally motivated but philosophically futile.** It was the action of a man who realized his ethical system had a hole in the bottom, and tried to plug it with empirical putty.

  You should tell your friend this: Sidgwick deserves credit for his honesty—he refused to pretend the dualism didn't exist, and he refused to solve it with cheap faith. But you must hold your ground: the solution he sought was impossible. The "Cosmos of Duty" cannot be rescued by the "Cosmos of Facts." By trying to make ethics dependent on the findings of the SPR, Sidgwick did not extend his philosophy; he exposed its vulnerability. He sought to turn a **moral commitment** into a **scientific discovery**, and in doing so, he confused the map of the universe with the compass of the will.

  The dinner argument ends with a qualified victory for you: It was a category mistake. But it was a category mistake born of the highest intellectual integrity. Sidgwick was wrong, but he was wrong in the most honest way possible.
