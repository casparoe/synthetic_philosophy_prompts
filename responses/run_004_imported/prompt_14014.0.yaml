      *   *Argument for Home:* Long-term future, parents' taxes, summer employment, potential return after graduation.
      *   *Conflict:* Which interests weigh more? Immediate daily impact vs. long-term structural impact? AAI is notoriously vague on *degree* of affectation.
      *   *Implication:* AAI might suggest voting in *both* if both are significantly affected, but the law says no. So AAI highlights the inadequacy of the "one person, one vote" rule in a mobile society.

