answer: |-
  This is a fantastic rabbit hole to fall down, and you've hit on one of the most tragicomic episodes in the history of ideas. You're absolutely right about the basics: Hobbes wasn't just tinkering; he thought he had found the key to human certainty. For Hobbes, geometry wasn't just about shapes; it was the only place where human reasoning didn't trip over itself because, as you noted, we define the terms. We say what a "line" is, we say what a "circle" is, and then we reason from there. Nothing is hidden from us.

  To answer your questions, we have to separate Hobbes the stubborn old man from Hobbes the philosopher, because they would have reacted very differently to the math of the 19th century.

  ### 1. Would Lindemann have broken Hobbes's heart (or ego)?

  If you handed Hobbes Lindemann's 1882 proof that $\pi$ is transcendental (and therefore squaring the circle is impossible), **Hobbes almost certainly would have refused to accept it.**

  Here's why: By the time Hobbes was feuding with Wallis, the fight wasn't really about math anymore; it was about authority and method. Hobbes hated the algebraic symbolism that Wallis and the new breed of mathematicians were using. To Hobbes, "real" geometry was about visible lines and figures drawn on a page. Algebra was just "scab of symbols," as he once called it—meaningless marks that didn't correspond to physical reality.

  Lindemann's proof relies on heavy-duty analysis and number theory, not compass-and-straightedge constructions. Hobbes would likely have dismissed it as a trick of symbols, not a truth about magnitudes. He spent 25 years calling Wallis a "bungler" and an "ignoramus." He didn't lack confidence; he lacked the technical ability to see his own error. So, personally? He would have gone to his grave claiming the mathematicians were just gatekeeping the truth. He was too proud to be undone by a proof he couldn't visually verify.

  ### 2. Could Non-Euclidean Geometry have saved his philosophical point?

  This is where it gets really interesting. **Yes, absolutely.** In fact, the discovery of Non-Euclidean geometry in the 19th century vindicates Hobbes's *philosophy* of geometry, even while it destroys his *specific* geometric claims.

  Remember Hobbes's core argument: We have certainty in geometry not because circles exist in the heavens, but because **we constructed the definitions ourselves.**

  For centuries, most people thought Euclidean geometry was the "God's eye view" of space. They thought the parallel postulate (parallel lines never meet) was a literal truth about the universe. When Gauss, Lobachevsky, and Riemann showed that you could change that one rule and build a perfectly consistent geometry where parallel lines *do* meet (or diverge), it shifted the status of geometry. It showed that geometry isn't about "discovering" the one true shape of the universe; it's about exploring the logical consequences of the rules *you choose to lay down.*

  That is pure Hobbes.

  Hobbes was a **nominalist**. He believed universal truths don't exist "out there"; they exist in language and definitions. If you tell Hobbes, "There are multiple valid geometries depending on your axioms," he would likely say, "Exactly! I told you! The truth is in the definition, not in the dirt."

  So, while losing the circle-squaring battle would have humiliated him, the Non-Euclidean revolution would have handed him a philosophical victory. It proves that geometry is a human construction, which was his whole justification for why we can be certain about it.

  ### 3. What does this do to the *Leviathan* project?

  This is the million-dollar question. Hobbes wanted to do for politics what geometry did for shapes: start with clear definitions (human nature, the state of nature), lay down axioms (the Laws of Nature), and deduce a perfect system (the Commonwealth) that would be as undeniable as a geometric proof.

  If geometry turns out to be "unstable" (in the sense that there is no single true geometry, and later, thanks to Gödel in the 1930s, that no system can be both complete and consistent), does *Leviathan* collapse?

  **It weakens the "Scientific" claim, but it might actually strengthen the "Political" argument.**

  **The Weakness:** Hobbes promised certainty. He wanted to end civil war by making political obligation as undeniable as $2+2=4$. If even $2+2=4$ rests on chosen axioms rather than absolute divine truth, then Hobbes can't claim his Sovereign is the *only* rational outcome. He can't claim he has "solved" politics like a math problem. The dream of a "Civil Science" that forces everyone to agree through pure reason takes a hit.

  **The Strength:** But think about what Hobbes actually argues in *Leviathan*. He doesn't say the Sovereign is discovered in nature. He says the Sovereign is **constructed** by a covenant. We *agree* to define "Justice" as "obeying the Sovereign."

  This mirrors the shift to Non-Euclidean geometry perfectly.
  *   **In Geometry:** We can't say Euclidean space is "True" and Hyperbolic space is "False." We say, "If we want *this* kind of space, we use *these* rules."
  *   **In Politics:** Hobbes could argue, "If we want *security* (avoiding the State of Nature), we must use *these* rules (absolute Sovereignty)."

  The instability of geometry actually fits Hobbes's materialist worldview better. It reinforces the idea that **order is something we make, not something we find.**

  If geometry is just a system of consistent definitions, then Politics is too. The "truth" of the Sovereign isn't that it's holy or naturally ordained; the "truth" of the Sovereign is that it is the definition we agreed upon to stop killing each other.

  ### The Verdict

  If Hobbes could time-travel to 1890:

  1.  **On the Circle:** He'd probably still be angry, calling Lindemann an algebraic charlatan, refusing to admit Wallis was right. The ego was too big.
  2.  **On Geometry:** He'd be vindicated. The idea that geometry is about human-defined axioms rather than divine discovery is exactly what he argued in *De Corpore*.
  3.  **On *Leviathan*:** He'd have to adjust his sales pitch. He couldn't promise "Absolute Certainty" anymore. But he could argue that **consistency** is enough. Just as we choose a geometry to build a bridge, we choose a Sovereign to build a society. The certainty doesn't come from God; it comes from our collective commitment to the definitions we constructed.

  It's a bit ironic: Hobbes was wrong about the math, but the way the math eventually turned out proves his philosophy of knowledge was surprisingly modern. He wanted geometry to be a human artifact so that politics could be one too. In the end, we found out geometry *is* a human artifact... but that means politics is even harder than he thought, because there's no single "correct" system to copy. We're stuck drawing the lines ourselves.
