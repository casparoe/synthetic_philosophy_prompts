      *Okay, ready to draft.*

      *Wait, one nuance on Aumann:* Aumann's theorem assumes honest reporting. If one is biased, the theorem breaks. But the prompt says "careful Bayesians." I should stick to the "Common Prior" loophole as the primary focus, as requested.

