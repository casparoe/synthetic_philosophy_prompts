      2. Validate the "Common Prior" objection (subfields differ).
      3. Propose a mechanism to test if the prior difference is empirically grounded or just intuition.
      4. Timeline.

      Let's write it.

      *Wait, checking the timeline:* "We allocate... in three weeks." So the vote is in 3 weeks. The memo is circulated *beforehand*. So I have 3 weeks to execute the plan before the vote.
      *Timeline:*
