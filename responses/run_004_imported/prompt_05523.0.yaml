      3.  Argument 2: The "Rigidity" Trap (PPL analogy: bypassing the generative model).
      4.  Argument 3: Diachronic Coherence (Dutch Strategy).
      5.  Argument 4: The Defense Undermines the Rule (If context matters, it's not a local rule).
      6.  Conclusion: JC is a patch, not a foundation.

