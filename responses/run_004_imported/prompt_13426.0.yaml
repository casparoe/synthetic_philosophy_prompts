          *   *Analysis:* Elena is highlighting the epistemic dimension. She claims this challenges Kripke's "necessity" claim by showing a sense of contingency.
          *   *Critique:* Kripke distinguishes epistemic from metaphysical. Does showing epistemic contingency show Kripke *overstated* metaphysical necessity? Or just clarified the epistemic side?

      *   **Move (2) Raj:** This isn't a correction, just a restatement. Kripke knew it was a posteriori (epistemically contingent). That's why it's not a priori.
          *   *Analysis:* Raj defends Kripke. He argues 2D semantics just formalizes the epistemic/metaphysical distinction Kripke already made.
