  2.  **Deconstruct the Arguments (Elena vs. Raj):**

      *   **Background:** Kripke says 'Water is H2O' is necessary a posteriori. Rigid designators pick out the same object in all possible worlds.
      *   **2D Semantics Basics:**
          *   *Primary Intension (1-intension):* Function from scenarios (considered as actual) to extensions. Captures epistemic/conceptual role. "What does 'water' refer to given how the world turns out?"
          *   *Secondary Intension (2-intension):* Function from possible worlds (considered as counterfactual) to extensions. Captures metaphysical modality given fixed actuality. "Given water is H2O here, what is it in other worlds?"
          *   *Kripkean Necessity:* Maps to the 2-intension.
          *   *Epistemic Contingency:* Maps to the 1-intension.

