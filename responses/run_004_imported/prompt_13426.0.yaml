          *   *Critique:* Chalmers explicitly links 1-possibility to metaphysical possibility in certain contexts (like the zombie argument). Raj is taking a more conservative/Kripkean view of 2D semantics (perhaps like Jackson's descriptive projectivism vs. Chalmers' modal rationalism).

