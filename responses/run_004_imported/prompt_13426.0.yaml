          *   *Analysis:* This is a strong point. Kripke says when we imagine water is XYZ, we are imagining a world where *watery stuff* is XYZ, but *water* (rigidly) is still H2O. 2D says: If we consider that scenario *as actual*, 'water' refers to XYZ. This is a substantive shift in how we model the "epistemic possibility."
