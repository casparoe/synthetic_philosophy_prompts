answer: |-
  This is a sophisticated line of inquiry, and you are quite right to flag Article XIV as the genealogical pivot point for the term's charged history in English. The transition from a soteriological prohibition to a category in analytic moral philosophy is one of the more fascinating secularizations in intellectual history.

  Here is a reconstruction of the theological argument and an analysis of the structural parallel you've identified.

  ### 1. The Theological Argument: Why "Arrogancy and Impiety"?

  To understand why the framers of the Article considered the *teaching* of supererogation to be arrogant and impious (rather than merely incorrect), we must reconstruct the competing anthropologies and soteriologies at play.

  **The Catholic Background (The Target)**
  You correctly identify the "treasury of merit" as the backdrop, but the specific mechanism is the distinction between **Precepts** and **Counsels**.
  *   **Precepts:** Commandments binding on all Christians (e.g., the Ten Commandments). Failure here results in sin.
  *   **Counsels of Perfection:** Recommendations for spiritual elites (e.g., voluntary poverty, celibacy, obedience). These are "supererogatory."
  *   **The Economy of Merit:** In late medieval scholasticism, Christ and the Saints accumulated a surplus of merit. This surplus formed a "treasury" that the Church could dispense (via indulgences) to remit the temporal punishment due for the sins of the living or the dead.

  **The Reformation Counter-Argument (Article XIV)**
  The Reformers did not just disagree with the *accounting*; they rejected the *ontology* of the transaction. Their argument rests on three premises:

  1.  **The Total Claim Premise:** God, as Creator and Redeemer, demands the totality of the creature's being. The Great Commandment is to love God with *all* heart, soul, and mind. There is no residual capacity left over.
  2.  **The Insufficiency Premise:** Due to human finitude and sinfulness, even the best human works are inherently deficient. They cannot "pay down" a debt to an infinite creditor.
  3.  **The Sufficiency of Christ:** Christ's sacrifice was singular and complete. No human addition is possible or necessary.

  **Reconstructing the Charge**
  Given these premises, here is the plain-term reconstruction of why the category itself is dangerous:

  *   **Why it is Arrogancy:** To claim you have performed a work "over and above" duty implies you have *completed* your duty. It suggests you have reached the finish line of moral obligation and are now running extra laps. Given the "Total Claim Premise," this is impossible. To claim you have surplus merit is to claim you have fully satisfied the infinite demands of God's law. In a framework where humans are inherently "unprofitable servants" (Luke 17:10), claiming a surplus is the height of pride. It assumes a moral solvency that no creature possesses.
  *   **Why it is Impiety:** This is the more severe charge. If you can do *more* than God requires, it implies God's requirements were limited or negotiable. Worse, it implies that Christ's atonement was insufficient to cover the full debt of humanity, requiring a top-up from the saints. This insults the majesty of God (by limiting His demands) and the efficacy of Christ (by suggesting His merit needs supplementation).

  **Summary:** The Article argues that the very *concept* of supererogation presupposes a universe where God does not own everything and where humans can outperform their design specifications. To teach it is to teach a false doctrine of God and man, hence "impiety" and "arrogancy."

  ### 2. The Structural Parallel: Reformers vs. The Secular Paradox

  Your students have spotted something genuine. There is a robust structural isomorphism between the Reformation objection and the secular "paradox of supererogation," though the stakes differ.

  **The Secular Paradox**
  In contemporary ethics (often traced to the Socratic idea that "no one errs willingly" or formulated by consequentialists), the paradox runs:
  1.  If Act A is morally better than Act B...
  2.  And an agent is able to perform Act A...
  3.  Then rationality/morality requires the agent to perform Act A.
  4.  Therefore, Act A cannot be optional (supererogatory); it must be obligatory.
  *The Driver:* The **Maximizing Principle**. Morality is understood as a system that demands the best available outcome.

  **The Reformation Objection**
  1.  God commands the total love and obedience of the creature.
  2.  There is no "good" that falls outside this total command.
  3.  Therefore, any good act is already required (bounden duty).
  4.  Therefore, no act can be "over and above" duty.
  *The Driver:* The **Exhaustiveness of Divine Command**. Morality is understood as a system of total debt to a Creator.

  **Is it a Genuine Parallel?**
  Yes. Both arguments rely on an **Exhaustiveness Claim**.
  *   The Secular Maximizing Claim says: *The Good* exhausts *The Required*. (If it's good, it's required).
  *   The Reformation Total Debt Claim says: *God's Command* exhausts *The Good*. (If it's good, God commanded it).

  In both systems, the logical space for supererogation (Good + Optional) is crushed. The "gap" that Urmson tries to open in 1958 is the same gap the Reformers tried to close in 1571, though for opposite reasons. The Reformers closed the gap to protect Grace (you can't earn salvation); the Secular Maximizers close the gap to protect Rationality (you can't ignore the better option).

  **Have Defenders Answered the Reformers?**
  This is the crux of your second question. Defenders of supererogation from Urmson onward *have* had to answer a secularized version of the Reformers' challenge, often without realizing the theological genealogy.

  1.  **Urmson's Strategy:** Urmson's primary target was Utilitarianism (which acts as the secular proxy for the Reformation "Total Claim"). Utilitarianism says, "Maximize the good." Urmson argues that if we classify saints and heroes as *obligatory*, we make morality too demanding for ordinary humans, leading to moral collapse. He saves supererogation by appealing to **social utility** and **human psychological limits**.
      *   *Connection to Reformers:* Interestingly, Urmson's argument is almost the inverse of the Reformers. The Reformers said: "You can't do extra because you owe everything." Urmson says: "We shouldn't call it extra duty because humans *can't* do everything." Both agree that the "Total Claim" is unsustainable for human agents, but the Reformers locate the limit in *God's grace*, while Urmson locates it in *human capacity*.

  2.  **The Deontic Response:** Later philosophers (like David Heyd) argue that supererogation is possible because morality includes **rights and permissions**, not just duties. An agent has a right to their own interests.
      *   *Connection to Reformers:* This would be anathema to the Reformers. To claim a "right to one's own interests" against the demand to do the "better" act is precisely the "arrogancy" Article XIV condemns. It asserts ownership over the self that the Reformation theology denies.

  **Verdict**
  You are not forcing the resemblance. The secular "paradox of supererogation" is effectively the **formal logic** of the Reformation objection stripped of its **theological content**.
  *   **Reformation:** "It is impossible to do more than duty because Duty = All."
  *   **Secular Paradox:** "It is impossible to do more than duty because Better = Duty."

  When Urmson and his successors argue that "the best is not always the obligatory," they are implicitly rejecting the Exhaustiveness Claim. In doing so, they are inadvertently rehabilitating the logical space that Article XIV sought to demolish. They are arguing that there *is* a realm of moral action that is valuable but not demanded—a position the Reformers labeled impious, but which secular ethics requires to make sense of moral praise, heroism, and the limits of obligation.

  **Pedagogical Suggestion**
  For your seminar, this genealogy offers a powerful heuristic. You can present the history of supererogation as a struggle over the **boundary of obligation**.
  *   **Medieval Catholicism:** The boundary is permeable (you can go beyond it).
  *   **Reformation:** The boundary is the edge of the universe (you cannot go beyond it).
  *   **Utilitarianism:** The boundary is the edge of the universe (you cannot go beyond it, secularized).
  *   **Urmson/Analytic Ethics:** The boundary is a fence with a gate (there is a zone beyond duty that is accessible but not mandatory).

  Showing students that Urmson is fighting a battle on the same logical terrain as Cranmer (even if Urmson is fighting Utilitarians and Cranmer was fighting Papists) will give them a profound sense of how deep these conceptual commitments run.
