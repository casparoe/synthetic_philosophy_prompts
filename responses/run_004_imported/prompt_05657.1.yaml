prompt: |-
  I sit on my university's research integrity committee, and I've been asked to draft the recommendation memo for Thursday's meeting on a case I haven't been able to stop turning over in my head. A twelve-author paper from one of our labs was found, after an outside reviewer flagged irregularities in the underlying images, to rest on fabricated data in two of its central figures. The postdoc who ran those specific experiments has admitted to fabricating them. The other eleven authors, including the senior/corresponding author who designed the study, wrote the grant, and supervised the lab, maintain that they never saw the raw data and had no reason to suspect anything was wrong. Nobody on the committee disputes that the paper should be retracted or that the postdoc faces a misconduct finding. What's actually dividing us is what, if anything, should happen to everyone else — especially the PI, whose name lent the paper its credibility and who reviewed and approved the final manuscript, but who did not fabricate or knowingly rely on fabricated data.

  I spent most of a dinner arguing about this with a friend of mine, a lab head herself, who has no patience for what she calls "guilt by association dressed up as accountability." Her position: responsibility tracks what a person actually did or knew, full stop — punishing the PI for a postdoc's fabrication is scapegoating, and treating authorship itself as a standing liability will just teach scientists to manage their co-authors as risks rather than trust them as collaborators. My position: putting your name on a paper isn't merely disclosing a causal contribution; it's undertaking a joint commitment to the work as a whole, which is exactly why our authorship policy, like most journals', requires every listed author to formally agree that they're answerable for the integrity of the entire paper, not just their own piece of it — and that commitment can generate real obligations, and real liability when those obligations go unmet, that aren't reducible to what any individual signer separately knew or caused. Neither of us moved the other an inch, and I suspect our committee will split along much the same lines.

  Could you draft the short memo I'll circulate before the meeting? I want a concrete, role-differentiated recommendation — something distinct for the postdoc, the mid-list coauthors, and the PI, rather than a generic call for "further review" — together with the reasoning behind it. And because my friend's objection is exactly the one I expect to hear again on Thursday, the memo should meet it head-on rather than talk past it: it should say plainly what the real cost is of holding people accountable for failures they neither caused nor knew about, and, if it still ends up recommending that, why that cost is worth bearing.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's research integrity committee.
      *   **Task:** Draft a recommendation memo for an upcoming meeting.
      *   **Case:** 12-author paper, 2 central figures fabricated by a postdoc (admitted). 11 other authors (including PI) claim ignorance/no access to raw data.
      *   **Consensus:** Paper retracted, postdoc found guilty of misconduct.
      *   **Conflict:** What to do with the other authors, specifically the PI?
      *   **User's Position:** Authorship implies joint commitment/accountability for the whole work, not just individual contribution. Liability exists even without direct knowledge/causation.
      *   **Friend/Colleague's Position:** Responsibility tracks actual action/knowledge. Punishing the PI is scapegoating/guilt by association. Discourages trust/collaboration.
      *   **Requirements:**
          *   Concrete, role-differentiated recommendations (Postdoc, Mid-list, PI).
          *   Reasoning behind recommendations.
          *   Address the "guilt by association" objection head-on (acknowledge costs, justify why they are worth bearing).
          *   Tone: Professional, persuasive, balanced but firm on the user's ethical stance.

  2.  **Determine the Ethical Framework:**
      *   The user wants to argue for *stewardship accountability* rather than *culpable misconduct*.
      *   The distinction is crucial: The PI isn't being punished for *fraud* (like the postdoc), but for *negligence of supervisory duty* or *breach of authorship warranty*.
      *   This aligns with federal guidelines (e.g., ORI, NSF) and journal policies (ICMJE) which often state authors must be able to defend the whole work.
      *   The argument needs to validate the friend's concern (trust is good, scapegoating is bad) but reframe the PI's responsibility as structural/stewardship-based.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the consensus (retraction, postdoc sanction) to clear the deck for the real debate.
      *   **The Core Conflict:** Briefly summarize the disagreement regarding the remaining authors, specifically the PI.
      *   **Recommendations (The "What"):**
          *   *Postdoc:* Formal misconduct finding, termination/referral (standard).
          *   *Mid-list Co-authors:* Letter of admonishment/mandatory training. They relied on the chain of command but need to understand authorship obligations.
          *   *PI:* This is the crux. Needs a sanction that reflects responsibility without equating them to the fabricator. Maybe a formal finding of "Negligent Supervision" or "Breach of Authorship Responsibility," mandatory mentorship training, temporary suspension of grant submission authority (or similar administrative hurdle). *Self-Correction:* Keep it within the committee's typical power. A formal finding of responsibility (distinct from misconduct) + remediation plan.
      *   **Reasoning (The "Why"):**
          *   Define authorship as a warranty, not just a credit line.
          *   Address the "Guilt by Association" argument directly.
          *   Acknowledge the cost (anxiety, defensive science) but argue the alternative (erosion of public trust, "plausible deniability" culture) is worse.
      *   **Conclusion:** Call to action for the meeting.

  4.  **Refining the Argument (Addressing the Friend's Objection):**
      *   *Friend's point:* Punishing the PI teaches scientists to treat co-authors as risks.
      *   *Counter-argument:* It teaches scientists that authorship is a verification duty, not just a reward. If the PI didn't verify, they breached the contract of authorship.
      *   *Key Phrase:* "Stewardship vs. Culpability." The PI isn't guilty of fraud, but they are responsible for the lab's integrity infrastructure.
      *   *Cost Acknowledgement:* Yes, this creates burden. Yes, it might make PIs more cautious. But the cost of *not* doing it is a system where PIs can claim ignorance while collecting prestige.

  5.  **Drafting - Tone Check:**
      *   Needs to be diplomatic enough for a committee but strong enough to lead.
      *   Avoid emotional language. Use terms like "institutional integrity," "stewardship," "systemic risk."
      *   Ensure the distinction between *misconduct* (fabrication) and *responsibility* (oversight) is sharp.

  6.  **Review against Constraints:**
      *   *Concrete recommendations?* Yes.
      *   *Role-differentiated?* Yes (Postdoc vs. Co-authors vs. PI).
      *   *Address the objection?* Yes, explicitly in the reasoning section.
      *   *Short memo?* Keep it concise (1-2 pages equivalent).

  7.  **Final Polish:** (Self-Correction during drafting)
      *   Make sure I don't recommend firing the PI. That's likely HR/Admin, not Research Integrity Committee. Stick to findings and remediation.
      *   Ensure the mid-list authors aren't let off *completely*, or the PI argument looks singled out. They need some level of accountability too, just less than the PI.
      *   *Refining the PI sanction:* A "Finding of Responsibility" (distinct from Misconduct) is a standard mechanism in these contexts. It goes on record but doesn't brand them a fraudster.

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendations Regarding Case #2023-04 (Multi-Author Publication Irregularities)

  **Purpose**
  This memo outlines my recommendations for the Committee's vote on Thursday regarding the fabricated data identified in the publication *[Paper Title]*. While there is consensus that the paper must be retracted and that the postdoctoral researcher responsible for the fabrication be sanctioned for research misconduct, the Committee remains divided on the liability of the remaining co-authors, specifically the Principal Investigator (PI).

  **Recommendations**
  I propose a tiered finding of responsibility that distinguishes between *misconduct* (active fabrication/falsification) and *breach of authorship stewardship* (failure to verify).

  1.  **The Postdoctoral Researcher:**
      *   **Finding:** Formal finding of Research Misconduct (Fabrication).
      *   **Action:** Termination of employment and referral to federal funding agencies as per university policy.

  2.  **Mid-List Co-Authors (10 individuals):**
      *   **Finding:** No finding of misconduct, but a finding of **Deficient Authorship Due Diligence**.
      *   **Action:** Formal letter of admonishment placed in internal files. Mandatory completion of advanced responsible conduct of research (RCR) training focused on authorship accountability. No restriction on future grant submissions.

  3.  **The Principal Investigator (Corresponding Author):**
      *   **Finding:** No finding of Research Misconduct (as there was no knowledge or intent), but a formal finding of **Negligent Supervisory Stewardship**.
      *   **Action:**
          *   Mandatory remediation plan involving external audit of lab data management practices for 12 months.
          *   Temporary suspension (6 months) of the PI's authority to serve as Corresponding Author on new submissions until the remediation plan is certified.
          *   Requirement to mentor under the oversight of a senior faculty colleague for one year.

  **Reasoning and Rationale**
  The central tension in this case is whether accountability requires knowledge and causation, or whether it arises from the role one undertakes. My colleague's objection—that holding the PI accountable constitutes "guilt by association"—is a serious concern. We must acknowledge the real costs of this approach.

  **The Cost of Accountability**
  Holding the PI liable for data they did not personally generate imposes a burden. It may encourage defensive science, where PIs micromanage collaborations rather than fostering trust. It risks creating a culture of anxiety where senior scientists refuse to collaborate across disciplines to avoid liability. If we treat authorship as a strict liability contract, we risk turning collaboration into risk management.

  **Why the Cost is Necessary**
  However, the alternative cost is higher. Scientific credibility relies on the premise that an author's name is a warranty, not merely a credit line. When a PI accepts corresponding authorship, they accept the institutional trust and prestige attached to that role. They cannot claim the prestige of the publication while disclaiming the infrastructure that produced it.

  If we exonerate the PI entirely based on "lack of knowledge," we establish a precedent of **plausible deniability**. We signal that senior researchers can benefit from high-impact outputs while remaining insulated from the operational realities of their labs. This creates a moral hazard: it incentivizes a "hands-off" management style where pressure for results is high, but verification mechanisms are weak.

  **Distinguishing Stewardship from Culpability**
  My recommendation specifically avoids labeling the PI a "misconduct" offender. This addresses the "scapegoating" concern. The PI is not being punished for the postdoc's lie; they are being sanctioned for their own failure to uphold the verification duty inherent in their signature.

  *   **Mid-list authors** relied on the chain of command; their sanction is educational.
  *   **The PI** *is* the chain of command. Their sanction is structural.

  By imposing a finding of Negligent Supervisory Stewardship, we affirm that research integrity is not just an individual virtue but a systemic obligation. We accept the burden of "defensive" oversight because the alternative—a system where the most senior person in the room can claim ignorance of the data bearing their name—is unsustainable for public trust.

  **Conclusion**
  I urge the Committee to adopt these differentiated recommendations. They allow us to sanction the fraud without conflating it with oversight failure, while maintaining the standard that authorship is a commitment to the whole truth, not just a slice of the work.

  I look forward to discussing this further on Thursday.
