answer: |-
  Here is a toast designed to honor your grandfather, acknowledge the reality of his aging, and demonstrate the universality of Cicero's arguments without requiring a degree in Classics to understand.

  ***

  **The Toast**

  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the privilege of being [Grandpa's Name]'s grandchild.

  Since we have a room full of former students and colleagues who speak Latin better than they speak English, I feel I should start with a warning. My grandfather taught Cicero for thirty-five years. Specifically, he taught *De Senectute*—"On Old Age."

  Now, there's a debate about that book. Some say it was written by a wealthy, powerful Roman senator who found old age easy because he had money, slaves, and status. They say it's easy to say "aging is graceful" when you don't have to worry about your pension or your painkillers.

  But looking at my grandfather tonight, I think the book holds up, even if you aren't a Roman senator.

  Grandpa, you are eighty-five. I'm not going to stand here and tell you that eighty-five is the new sixty. That's a lie, and you hate lies. Your knees don't work the way they used to. You can't drive to the grocery store anymore. There are things you have lost, and Cicero admits that loss is real. He says the body naturally weakens, like a ship wearing out after a long voyage.

  But Cicero also makes a point that I think you live every day. He says that a bitter old age is usually just a bitter personality finally showing its true colors. He argues that wisdom and character matter more than circumstances.

  You don't have Cato's estate. You have a backyard in [Your Town/City]. But you treat those tomato plants with the same devotion a Roman general treated his fields. You can't run around the garden anymore, but you still know exactly when to prune, when to water, and when to just let the sun do the work. That isn't luck. That isn't wealth. That is *character*.

  Cicero writes that the older generation shouldn't try to climb the mast and haul the sails; their job is to steer the ship from the helm. You can't drive the car anymore, Grandpa, but you still steer this family. When we're confused about a job, a marriage, or how to handle a loss, we don't ask someone with fast legs. We ask someone with a steady hand.

  You have proven that the peace of old age doesn't come from having everything you had at thirty. It comes from knowing who you are. You are sharp, you are kind, and you are present.

  So, to the colleagues here: You taught the text. But Grandpa, you lived the translation.

  And to the cousins and kids who don't speak Latin: You don't need to. You just need to look at him.

  Grandpa, Cicero says that nature has a course, like fruit ripening on a tree. It falls when it is ready. But until then, it is sweet. You are the sweetest part of this family's harvest.

  To Grandpa. *Ad multos annos.* To many more years.
