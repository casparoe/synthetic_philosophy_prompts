  8.  *(Self-Correction on the "Winning the Argument" aspect)*: The prompt asks to write the toast in a way that would *win* the argument. This means the toast itself must serve as evidence that Cicero's points hold up even for a non-senator. I need to make sure the speech explicitly contrasts "privilege" with "character."

      *   *Idea:* Explicitly mention that Grandpa isn't a Roman Senator. He's a teacher. He doesn't have slaves or estates. He has a backyard. If Cicero works here, Cicero works anywhere.

  9.  **Final Review against constraints:**
      *   Cicero arguments? Yes.
      *   No "80 is new 60"? Yes, acknowledge limitations.
      *   Accessible to non-Latin speakers? Yes, explain the concepts.
      *   Acknowledge knees/driving? Yes.
      *   Tomatoes included? Yes.

      *(Drafting the speech...)*
