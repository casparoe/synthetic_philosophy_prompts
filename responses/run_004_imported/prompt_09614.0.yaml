  ok this might be a weird thing to be up thinking about at midnight but. my math teacher mentioned that because of Godel's 2nd incompleteness therem, ZFC (like, the axioms basically all of math is built on) can never prove itself consistent. then i went down a rabbit hole and found out Frege had this one axiom (basic law V or something) that seemed totally obviously true, and Russell found a single contradiction hiding in it that broke Frege's whole system. so genuinely, how do we know ZFC isn't secretly broken the same way and mathematicians just haven't found the contradiction yet?? is this an actual thing logicians lose sleep over or is it a total non-issue. write me an essay that actually picks a side (not just "well there's arguments both ways") on how worried we should really be, and why.
