answer: |-
  It is a pleasure to engage with someone who traces their rationalist lineage back to the original *Overcoming Bias* days. You are correct that Yudkowsky's sequence resolves the tension between Bell and Relativity by dissolving the collapse postulate entirely: if the wavefunction never collapses, there is no instantaneous update at a distance, only the unfolding of a local, unitary evolution where correlations are established via common past causes (decoherence events).

  However, as you note, that solution purchases locality at the price of a specific, controversial ontology (Many-Worlds). The "Peaceful Coexistence" program, pioneered by Jon Jarrett (1984) and Abner Shimony (1984), offers a different path. It attempts to secure the compatibility of Quantum Mechanics (QM) and Special Relativity (SR) without committing to Everettian branching, relying instead on the operational structure of the theory itself.

  Here is the case for the thesis that Bell's theorem does not prove "nonlocality" in the sense forbidden by Relativity, provided we distinguish between the two components of Bell's factorizability condition.

  ### 1. The Formal Setup: Bell's Factorizability

  To understand the decomposition, we must first look at what Bell actually assumed. In a standard Bell experiment, Alice chooses a setting $a$ and gets outcome $A$; Bob chooses a setting $b$ and gets outcome $B$. $\lambda$ represents the complete state of the system prior to measurement (which might include hidden variables or simply the quantum state vector).

  Bell's derivation of his inequalities relies on the condition of **Factorizability** (often conflated with "Local Causality"):

  $$ P(A, B | a, b, \lambda) = P(A | a, \lambda) \cdot P(B | b, \lambda) $$

  This equation states that the joint probability of outcomes factors into independent local probabilities. If this holds, Bell inequalities follow. Since QM violates Bell inequalities, QM violates Factorizability. The popular conclusion is "QM is Nonlocal."

  Jarrett's insight was that Factorizability is mathematically equivalent to the conjunction of two distinct, logically independent conditions.

  ### 2. Jarrett's Decomposition

  Jarrett showed that Factorizability holds if and only if both **Parameter Independence** and **Outcome Independence** hold.

  **A. Parameter Independence (PI)**
  $$ P(A | a, b, \lambda) = P(A | a, \lambda) $$
  $$ P(B | a, b, \lambda) = P(B | b, \lambda) $$
  This condition states that the probability of a local outcome does not depend on the *distant setting*. Alice's statistics should not change based on whether Bob chooses to measure spin-$x$ or spin-$z$. This is the condition of **signal locality**. If PI were violated, Alice could detect Bob's choice of measurement setting instantaneously by looking at her own statistics.

  **B. Outcome Independence (OI)**
  $$ P(A | a, b, B, \lambda) = P(A | a, b, \lambda) $$
  $$ P(B | a, b, A, \lambda) = P(B | a, b, \lambda) $$
  This condition states that the probability of a local outcome does not depend on the *distant outcome*, given the complete state $\lambda$. If OI holds, knowing Bob's result gives you no new information about Alice's result beyond what $\lambda$ already told you. If OI is violated, the outcomes are correlated beyond the common cause $\lambda$.

  **The Logic:**
  $$ \text{Factorizability} \iff (\text{Parameter Independence} \land \text{Outcome Independence}) $$

  Since QM violates Factorizability, it must violate at least one of these. The "Peaceful Coexistence" argument rests on *which* one it violates.

  ### 3. The Quantum Verdict: PI Holds, OI Fails

  Standard Quantum Mechanics makes a clear prediction regarding this decomposition.

  **QM satisfies Parameter Independence.**
  This is guaranteed by the **No-Signalling Theorem**. In the formalism, Alice's local statistics are determined by the reduced density matrix of her subsystem, $\rho_A = \text{Tr}_B(\rho_{AB})$. Bob's choice of measurement basis corresponds to a unitary operation on his side or a partial trace over his degrees of freedom. Mathematical consistency of the tensor product structure ensures that operations on subsystem $B$ cannot alter the reduced density matrix of subsystem $A$.
  *   *Physical Implication:* Alice cannot know what measurement Bob performed, nor can Bob influence the *probability distribution* of Alice's outcomes by changing his setting.

  **QM violates Outcome Independence.**
  Consider a singlet state. If $\lambda$ is the quantum state $|\psi^-\rangle$, and Alice measures spin-up ($A=\uparrow$), the probability of Bob measuring spin-up becomes 0, whereas it was 0.5 prior to conditioning on Alice's outcome.
  *   *Physical Implication:* The outcomes are correlated. Knowing one tells you about the other.

  Therefore, the violation of Bell's inequalities in QM is driven exclusively by the violation of **Outcome Independence**, while **Parameter Independence** remains intact.

  ### 4. Relativity's Actual Demand

  The crux of the "Peaceful Coexistence" argument is an analysis of what Special Relativity actually forbids.

  Relativity prohibits superluminal **causal signalling**. It requires that the causal order of events be invariant across Lorentz frames. If event $X$ causes event $Y$, $X$ must lie in the past light cone of $Y$. If information could be transmitted faster than light, there would exist reference frames where the effect precedes the cause, leading to paradoxes (e.g., sending a message to prevent your own birth).

  However, Relativity does not prohibit superluminal **correlations**.
  *   **PI is the condition for signalling.** To send a signal, Alice must be able to manipulate her local statistics by changing a parameter at Bob's location (or vice versa). Since PI holds, no such manipulation is possible. The marginal probabilities are invariant.
  *   **OI is the condition for correlation.** The violation of OI implies that nature is holistic; the outcomes are not determined solely by local beables and the common past. However, because the individual outcomes are fundamentally stochastic (in standard QM), neither party can *control* their outcome to encode a message.

  Because the violation of OI cannot be exploited to violate PI, no information travels superluminally. The "influence" implied by the violation of OI is, in Shimony's terms, "uncontrollable." It is a dependency that cannot be used for communication.

  ### 5. The Equivocation on "Nonlocality"

  The popular claim that "Bell's Theorem proves Nonlocality" relies on an equivocation between two definitions of locality:

  1.  **Bell Locality (Factorizability):** The requirement that all correlations be explainable by common causes in the past light cone.
  2.  **Relativistic Locality (Signal Locality):** The requirement that no controllable influence propagates outside the light cone.

  Bell's theorem proves that QM violates **Bell Locality**. It does *not* prove that QM violates **Relativistic Locality**.

  When physicists claim QM is "nonlocal," they usually mean it violates Factorizability. When relativists worry about "nonlocality," they worry about superluminal signalling. The Jarrett/Shimony thesis argues that these are not the same thing. By violating only Outcome Independence, QM retains the specific form of locality (Parameter Independence) that is required to prevent conflict with Special Relativity.

  ### 6. Conclusion: Peaceful Coexistence

  Unlike the Everettian solution, which saves locality by removing the collapse mechanism entirely, the Jarrett/Shimony argument accepts the standard formalism (including the appearance of collapse or the update of the state vector) but argues that the *operational consequences* remain local enough for Relativity.

  The thesis stands as follows:
  1.  Relativity forbids superluminal signalling, which is mathematically equivalent to Parameter Independence.
  2.  Quantum Mechanics satisfies Parameter Independence (via the No-Signalling Theorem).
  3.  Quantum Mechanics violates Outcome Independence, which creates non-classical correlations but does not enable signalling.
  4.  Therefore, the violation of Bell inequalities demonstrates **quantum holism**, not **relativistic nonlocality**.

  We can thus maintain that the universe is "local" in the only sense that matters for the consistency of spacetime physics (no superluminal signals), even if it is "nonlocal" in the sense that it cannot be described by a local hidden variable model. This allows us to accept the empirical verdict of Bell's theorem without declaring war on Special Relativity, achieving a "peaceful coexistence" without requiring the ontological overhead of Many-Worlds.
