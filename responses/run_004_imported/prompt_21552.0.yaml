      *   **Thesis to Defend:** Quantum correlations violate Outcome Independence (OI) but preserve Parameter Independence (PI). Since Relativity only forbids superluminal *signalling* (which requires violating PI), Bell's theorem does not strictly prove "nonlocality" in the sense relevant to Special Relativity. The claim that Bell proves nonlocality equivocates between PI and OI.

