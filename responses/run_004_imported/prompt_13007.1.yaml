answer: |-
  Your intuition is correct, and your friend's advice, while sound in a specific commercial context, is dangerous in a family probate dispute. You are right to be concerned.

  Here is a breakdown of why matching your brother's move is a strategic error, the specific risks involved, and a more effective approach to take into mediation.

  ### 1. Context Mismatch: Commercial vs. Family Negotiation
  Your friend negotiates commercial deals. In business, relationships are often transactional. If you burn a bridge to win a contract, you might never deal with that vendor again, and that is acceptable. The goal is maximizing profit in a zero-sum game.

  An estate division is different.
  *   **The Relationship:** You cannot "fire" your brother. You will be family forever. A scorched-earth tactic can destroy that relationship permanently.
  *   **The Audience:** Your brother emailed the *whole family*. This is a pressure tactic designed to shame you. If you respond in kind, you turn a private financial matter into a public family civil war. This rarely ends well.
  *   **The Asset:** Unlike a commercial contract, the estate is a finite pie. Every dollar spent on legal fees to "win" the lake house is a dollar less for both of you.

  ### 2. The Game Theory: A Game of Chicken
  Your friend is suggesting you play a game of "Chicken." In this game, two drivers speed toward each other; the first to swerve loses, but if neither swerves, they crash.

  *   **Your Brother:** Has already slammed his steering wheel into the dashboard to show he can't swerve (the "non-negotiable" email).
  *   **Your Friend's Advice:** Wants you to slam your steering wheel too.
  *   **The Result:** If you both do this, the only outcomes are a crash (litigation) or one of you having to violently swerve later (backing down publicly), which causes much more loss of face than not making the threat in the first place.

  By refusing to play, you take the crash option off the table. You force the mediation to be about problem-solving rather than posturing.

  ### 3. The Dangers of Matching His Position
  If you lock your attorney into a public, non-negotiable demand:
  *   **You Hand the Mediator a Brick Wall:** Mediators work by finding flexibility. If both sides are rigid, the mediator cannot help. The mediation will fail, and the next stop is court.
  *   **You Validate His Tactics:** By responding emotionally, you signal that his aggressive email worked. It lowers the discourse to his level.
  *   **You Lose Leverage:** In probate court, judges dislike unreasonable behavior. If you are seen as the sibling willing to negotiate while he is the one making ultimatums, you gain moral and potentially legal high ground.
  *   **Financial Loss:** Litigation is exponentially more expensive than mediation. Fighting over the lake house could cost more in legal fees than the house is worth.

  ### 4. What You Should Do Instead
  Your goal is to appear as the reasonable adult who wants to honor your father's memory, while protecting your financial interests.

  **A. Instruct Your Attorney (Privately)**
  Tell your lawyer explicitly: *"I do not want to lock into a position. I want to authorize you to negotiate all options, including buying him out, selling the house and splitting proceeds, or other assets of equivalent value. Do not make public ultimatums."*
  Your attorney is your agent; they should not be bound by your friend's negotiation theory.

  **B. The Response (If You Respond at All)**
  Do not "Reply All" to the family. That fuels the drama. If you feel you must respond to your brother, do it privately and keep it brief and calm.
  *   *Draft Idea:* "I received your email. I understand the lake house holds significant value for you. My goal is to divide Dad's estate fairly and efficiently without draining the assets on legal fees. I am looking forward to seeing if we can find a solution in mediation that works for both of us."
  *   *Why this works:* It acknowledges his desire without accepting it. It highlights the cost of fighting. It shows you are open to resolution.

  **C. Enter Mediation with "Interests," Not "Positions"**
  In negotiation theory (specifically *Getting to Yes* by Fisher and Ury), a **position** is "I want the lake house." An **interest** is "I want to feel connected to Dad's memories" or "I want financial security."
  *   Your brother's position is the house.
  *   Your interest might be fair market value, or perhaps you have sentimental attachment too.
  *   **Strategy:** Ask *why* he wants the house. Is it sentimental? Is it an investment?
      *   If sentimental: Can he have the house if he buys out your share?
      *   If investment: Can you sell it and split the money?
      *   If he cannot afford to buy you out, his "non-negotiable" position is actually impossible. You don't need to say that; let the math say it in mediation.

  **D. Let Him Be the "Bad Guy"**
  If he remains rigid in mediation and you remain flexible, the pressure shifts to him. The mediator will begin working on him to move. If he refuses to move, *he* is the one causing the impasse, not you. This protects your reputation with the family and the court.

  ### Summary
  Your friend is treating this like a poker hand; you are treating it like a family legacy. **Trust your instinct.**

  Matching his aggression guarantees conflict. Refusing to match it keeps the door open for settlement. You can be firm on *fairness* without being rigid on *specific assets*. Go into mediation ready to solve the problem, not win the fight.

  ***Disclaimer:** I am an AI assistant and not an attorney. This information is for educational and strategic purposes only and does not constitute legal advice. You should consult with your retained counsel regarding specific legal strategies for your estate mediation.*
