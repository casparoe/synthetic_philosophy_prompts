answer: |-
  Good evening, everyone. For those of you I haven't met, I'm a colleague of Warren's. Looking around this room, I realize we have a unique challenge tonight. Half of you are philosophers of science who know exactly why 1974 was a traumatic year. The other half are Warren's family and the college administration, who mostly know Warren as "the guy who argues about which wrong thing is closer to right."

  Actually, that description is perfect. Because for forty years, Warren has been living in the wreckage of Karl Popper's definition of truthlikeness. For the family: Popper tried to define how a false theory could still be "better" than another false theory. In 1974, Tichý and Miller proved Popper's math basically imploded. Most people looked at that explosion, decided the problem was unsolvable, and went home.

  Warren did not go home.

  He spent four decades building a fort in the rubble. He championed a Niiniluoto-style similarity measure, fighting off language-dependence objections with the tenacity of a border guard. He spent his life refining the metrics of how we measure distance from the truth, without ever claiming we'd actually arrived at the destination.

  And that is exactly why we are here. Because Warren is allergic to finality. If I stand up here and say, "Warren solved the problem of verisimilitude," he would spend the rest of the dinner correcting me. He would be right to do so. To claim he "arrived" would be to misunderstand the very thing he taught us: that progress is about reducing error, not eliminating it.

  This brings me to the only joke I'm allowed to make tonight. I know, Warren, you're cringing. But I think I've found a formulation that works for the Dean and the department chair alike.

  Warren, if I stand here and say, "You are the greatest philosopher of our generation," I know you will immediately object. You will say, "That is false. There are others. The sample size is insufficient. The criteria are undefined." And you would be right. The statement is false. But, thanks to your life's work, I can defend myself. I can argue that while the statement is technically false, it has significantly higher *verisimilitude* than if I had said you were the greatest *plumber* of our generation. So, please accept this retirement gift not as a statement of fact, but as a false hypothesis with extremely high truth-content.

  [Pause for laughter]

  But in all seriousness, that is the gift Warren gave us. He taught us that being "wrong" isn't a binary state. It's a coordinate. There is being wrong in a way that shuts down inquiry, and there is being wrong in a way that maps the terrain for the next person. Warren was never afraid to be wrong, provided he was *less wrong* than he was yesterday.

  He brought that same humility to his teaching, his administration, and his family. He never claimed to have the absolute right answer for his students or his children. He just tried to offer the option that was most truthlike, given the available evidence. He taught us that integrity isn't about certainty; it's about the rigor of your approximation.

  So, as we look toward his retirement, I have to be careful. I cannot say this is the perfect tribute. A perfect tribute would require a language independent of my own biases, and a measure of his worth that doesn't rely on my limited perspective. If I claimed this speech captured the absolute truth of Warren's career, I would be insulting his intellect.

  Instead, I offer this: This toast is not the truth about Warren. It is an approximation. It is a model that attempts to minimize the distance between what I'm saying and who he is. It is liable to revision. It is open to objection. But I hope, in the spirit of forty years of hard-won philosophy, that we can agree it is *closer* to the truth than silence would have been.

  To Warren. May your retirement be highly verisimilar to a good life, even if we can never quite prove it.

  Cheers.
