answer: |-
  The relationship between Pascal's Wager and Pascal's Mugging is often misunderstood as one of lineage—father and son, theological ancestor and secular descendant. But this genealogy obscures the structural reality. Pascal's Mugging is not merely a degenerate case of the Wager; it is a *generalization* that strips away the theological scaffolding to expose the skeletal flaw in unbounded expected-utility (EU) maximization.

  While both arguments rely on the multiplicative engine of expected value ($EU = p \times U$), the Wager relies on the peculiar arithmetic of infinity, whereas the Mugging relies on the scaling behavior of finite but unbounded utility. This distinction is crucial. The Wager can be defanged by denying the coherence of actual infinities in decision theory. The Mugging cannot. Therefore, the Mugging raises a genuinely distinct and more severe problem for decision theory, one that the Wager merely gestured toward.

  ### The Infinity Escape Hatch

  To see why the Mugging is the stronger challenge, we must look at how the "Many Gods" objection functions in the Wager versus its analogue in the Mugging.

  In Pascal's Wager, the payoff is infinite utility (eternal salvation). The "Many Gods" objection notes that there are indefinitely many mutually exclusive deities, each promising infinite reward for different specific beliefs. If $U(\text{Heaven}) = \infty$ and $U(\text{Valhalla}) = \infty$, then $EU(\text{Christianity}) = EU(\text{Norse Paganism}) = \infty$. Standard real-valued decision theory cannot compare infinities; the expectation becomes undefined. The agent is paralyzed not by the smallness of the probability, but by the equivalence of the payoff.

  This allows a defender of the Wager to retreat. They can argue that infinities are not actionable quantities, or that we should use a lexicographic ordering rather than arithmetic. The theological content provides a convenient shield: one can argue that only one God is *metaphysically* possible, rendering the "Many Gods" a logical error rather than a decision-theoretic one.

  Pascal's Mugging removes this shield. In the standard formulation, the mugger does not promise infinite utility, but a finite number so vast (e.g., $3 \uparrow\uparrow\uparrow 3$ lives saved) that it dwarfs the tiny probability of their claim being true. Because the utility is finite, the "Many Gods" indeterminacy ($\infty - \infty$) vanishes. The math works cleanly. $10^{-100} \times 10^{100} = 1$.

  This reveals the first asymmetry: The Wager breaks decision theory by introducing **singularities** (infinities); the Mugging breaks it by exploiting **continuity** (unbounded finite values). If you solve the Mugging, you implicitly solve the Wager (by bounding utility or discounting low-probability high-stakes claims). If you solve the Wager (by banning infinities), you leave the Mugging entirely untouched.

  ### The Analogue of "Many Gods"

  Does the "Many Gods" objection have an analogue in the single-mugger case? Yes, but it functions differently, and this difference indicts expected-utility reasoning rather than theology.

  In the Wager, "Many Gods" creates a **tie**. In the Mugging, "Many Muggers" creates a **dominance hierarchy**.

  Imagine you are walking down the street. Mugger A claims they can save $10^{100}$ lives for $\$5$. Mugger B appears and claims they can save $10^{1000}$ lives for $\$5$. Mugger C claims $10^{10000}$.
  In the Wager, if God A and God B both offer $\infty$, you have no rational basis to choose. In the Mugging, if Mugger B offers more utility than Mugger A, EU maximization *demands* you prioritize Mugger B.

  This creates a "Bid War" problem that has no theological equivalent. In theology, God is typically defined as maximal; one cannot conceive of a "greater" God in terms of reward capacity because infinity is the ceiling. In the Mugging, there is no ceiling. For any utility value $U$ the mugger proposes, a counter-mugger can propose $U + 1$ or $10 \times U$.

  If the "Many Gods" objection is applied to the Mugging, it does not result in paralysis via indeterminacy. It results in paralysis via **infinite regress**. You can never hand over your wallet, because there is always a possible hypothesis (a stronger mugger) with a higher expected value that you are ignoring by paying the current one.

  This asymmetry reveals that the deeper flaw lies in **unbounded expected-utility reasoning itself**. The "Many Gods" objection to the Wager looks like a problem about theology (which god is real?), but the "Many Muggers" variation shows it is actually a problem about the *structure of the utility function*. If your utility function is unbounded, and your prior probability distribution does not decay faster than your utility grows, you are vulnerable to mugging.

  ### The Verdict: A Failure of Priors and Bounds

  The Mugging forces the rationalist to confront a constraint that the Wager allowed them to ignore: the relationship between complexity priors and utility growth.

  In the rationalist tradition (specifically within the context of Solomonoff Induction), the proposed solution to Pascal's Mugging is that the prior probability of a hypothesis must decay exponentially with its complexity (Kolmogorov complexity). To claim you can affect $3 \uparrow\uparrow\uparrow 3$ people requires a specification of that many people, which is computationally complex. Thus, $p$ should shrink faster than $U$ grows.

  However, as Yudkowsky and others have noted, this is not a guaranteed solution. One can construct "simple" descriptions of huge numbers (e.g., "I am a simulation runner controlling $3 \uparrow\uparrow\uparrow 3$ agents"). If the utility grows faster than the complexity penalty shrinks the probability, the Mugging succeeds.

  This confirms that the Mugging is the more fundamental problem. The Wager could be dismissed by a finitist who says, "Infinite utility is incoherent." The Mugging confronts the finitist and says, "Okay, no infinities. Just a googolplex. Do you really value a 1 in googolplex chance of saving a googolplex lives more than a certainty of saving one life?"

  If you say **yes**, you are a Mugging victim.
  If you say **no**, you have implicitly adopted a **bounded utility function** or a non-linear probability weighting (like rank-dependent utility).

  ### Conclusion

  Pascal's Mugging is not a degenerate case of the Wager; it is the Wager stripped of its camouflage. The Wager hid the absurdity of unbounded EU maximization behind the mystery of the divine infinite. It allowed philosophers to fight over theology (the probability $p$) rather than decision theory (the function $f(p, U)$).

  The "Many Gods" objection highlights this divergence. In the Wager, it suggests theological pluralism breaks the bet. In the Mugging, the analogue ("Many Muggers") proves that *any* unbounded utility function breaks the bet, regardless of the content. The asymmetry demonstrates that the flaw is not in the specific hypotheses (gods vs. muggers) but in the arithmetic of expectation when applied to unbounded domains.

  Therefore, the Mugging raises a distinct, more rigorous problem. It forces us to admit that rational agents *must* have bounded utility functions or must reject the linearity of expected utility in the tails. Pascal's Wager was a theological puzzle; Pascal's Mugging is a proof that standard decision theory is incomplete. The demon was never in the church; it was in the math.
