      *   *Final Decision:* I will argue that the Dark Room Problem demonstrates that the FEP is **structurally sound but explanatorily inert** regarding specific behaviors without external constraints. The verdict is that the FEP is not a theory of *why* organisms seek light over dark, but a theory of *how* they pursue whatever they seek. The Dark Room objection succeeds in limiting the scope of the theory.

