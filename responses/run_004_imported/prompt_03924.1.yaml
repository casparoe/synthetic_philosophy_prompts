      *Swampman:* Millikan/Neander/Dretske = No content. Shea = Maybe/Yes (systematicity).

  4.  **Constructing the JSON and Commentary:**
      *   Must be valid JSON.
      *   Commentary outside the JSON.
      *   Tone: Peer-to-peer, slightly weary but sharp.

      *Drafting the specific critiques:*
