      Shea's "Varitel" is designed to fix the indeterminacy by focusing on *use* conditions alongside history.

      *Re-evaluating Distality:* This is the killer objection. Most teleosemantics fail here. The "Consumer" theory (Millikan/Neander) is the best shot.
      *Re-evaluating Disjunction:* The "Normal Condition" or "Asymmetric Dependence" (Fodor, not teleo) or "Learning Period" (Dretske).

      *Let's adjust:*
