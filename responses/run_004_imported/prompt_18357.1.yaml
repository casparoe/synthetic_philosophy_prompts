      *   **The Tautology Charge (The "Existence" Argument):** Explain Friston's response: "Yes, it is tautological, but useful tautologies exist." If $X$ exists, $X$ must have bounds. Bounds imply a Markov blanket. Markov blankets imply variational free energy minimization. Therefore, existing things minimize free energy. The value isn't in the claim, but in the *derivations*.
