          *   Trade 3: Utility gain (Original > Rarity) *plus* the cost of regret/learning.
          *   *Counter-argument:* If the user *knew* at Trade 1 that they would want the original back at Trade 3, they wouldn't have started. The irrationality is a failure of **foresight** or **preference stability**.

      *   **Strategies for Defense (Without refusing all offers):**
          *   *Pre-commitment:* Set rules before entering the market.
