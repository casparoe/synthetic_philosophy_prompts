answer: |-
  This is a fantastic question. You have hit on exactly why this debate has persisted for decades: on the surface, finks and masks look like the same problem (the "if" happens, but the "then" doesn't), but philosophically, they attack the definition from opposite directions.

  To understand the structural difference, we have to look at **where the failure happens in the causal chain** and **whether the failure is intrinsic or extrinsic to the object.**

  ### 1. The Structural Difference: Intrinsic Loss vs. Extrinsic Blockage

  The Simple Conditional Analysis (SCA) assumes a direct link:
  > **Disposition** $\rightarrow$ **Trigger** $\rightarrow$ **Manifestation**

  Both finks and masks break this arrow, but they break it in different places.

  **The Fink (Intrinsic Loss)**
  A finkish case is one where the trigger event causes the object to **lose the very property that gives it the disposition.**
  *   **Structure:** The Trigger ($C$) causes the Disposition ($D$) to vanish *before* the Manifestation ($M$) can occur.
  *   **Logical Form:** $C \rightarrow \text{not-}D$.
  *   **The Problem:** The object *was* disposed, but by the time the test is administered, it *is no longer* disposed.
  *   **Key Feature:** The change is **intrinsic**. The object itself changes its internal nature in response to the trigger.

  **The Mask (Extrinsic Blockage)**
  A masking case is one where the object retains the disposition, but something else prevents the manifestation.
  *   **Structure:** The Trigger ($C$) and the Disposition ($D$) are both present, but an Interfering Factor ($I$) blocks the output.
  *   **Logical Form:** $(C + D) + I \rightarrow \text{not-}M$.
  *   **The Problem:** The object *is* disposed, and stays disposed, but the manifestation is suppressed.
  *   **Key Feature:** The interference is usually **extrinsic**. The object's internal nature remains unchanged; the environment stops the effect.

  **The "Lightbulb" Analogy**
  To make this concrete without retelling the wire/poison stories:
  *   **Fink:** You flip the switch (Trigger), and the lightbulb instantly turns into a rock (Intrinsic Loss). It doesn't light up.
  *   **Mask:** You flip the switch (Trigger), and the lightbulb stays a lightbulb (Intrinsic Retention), but someone puts a black box over it (Extrinsic Block). It doesn't light up.

  In both cases, the light doesn't turn on. But in the Fink case, the *capacity* is destroyed. In the Mask case, the *capacity* is active but contained.

  ### 2. David Lewis's Repair

  David Lewis realized that the Simple Conditional Analysis failed because it looked only at the *outcome* (does it break?) rather than the *source* of the outcome.

  Lewis proposed the **Revised Conditional Analysis (RCA)**. He argued that a disposition isn't just a conditional; it is the possession of a **Categorical Basis** (an intrinsic physical structure, like the molecular lattice of the glass).

  His fix adds a clause to the conditional:
  > $x$ is disposed to $M$ in $C$ iff $x$ has an intrinsic basis $B$, such that if $C$ occurs **and $x$ retains $B$ for long enough**, then $x$ manifests $M$.

  **Why this fixes Finks:**
  In a fink case (the lightbulb turning into a rock), the trigger occurs, but the object *does not retain* the basis $B$. Because the clause "and $x$ retains $B$" is false, the conditional doesn't demand that the manifestation happen. Lewis can therefore say: "The object *was* fragile (it had basis $B$), but the test conditions weren't met because $B$ vanished." The disposition is saved because it is identified with *having* $B$, not necessarily producing $M$ if $B$ is destroyed.

  ### 3. Why Lewis's Fix Fails Masks

  This is the crux of your question. Why doesn't this same logic save us from masks?

  **The Structural Immunity of Masks**
  Lewis's fix protects against the *loss of the basis*. Masks do not involve the loss of the basis.
  In a masking case (the lightbulb covered by a box):
  1.  The object has the basis $B$ (it is a functioning bulb).
  2.  The trigger $C$ occurs (switch flipped).
  3.  **The object retains $B$** (it remains a functioning bulb throughout).
  4.  The manifestation $M$ does *not* occur (no light shines out).

  Because the object *does* retain the basis, Lewis's condition ("If $C$ and retains $B$...") is fully satisfied. Therefore, the analysis predicts the light *should* shine. But it doesn't (because of the mask).

  Lewis's repair relies on the assumption that if the intrinsic basis is present and stable, the manifestation *must* follow. Masks prove that **intrinsic stability is not sufficient for manifestation.** You can have the internal power and still fail to manifest because of external interference.

  Lewis's fix is a shield against *internal* collapse (finks), but it offers no protection against *external* blockage (masks).

  ### 4. Is the Project Abandoned?

  This is where the philosophy gets messy. The existence of masks (and their cousins, "mimics"—things that aren't disposed but break anyway) has led to three main camps:

  **A. The "Ceteris Paribus" Patch (The Optimists)**
  Some philosophers argue we just need to add a "all else being equal" clause.
  *   *Definition:* "If struck, the glass would break, *provided no interfering factors exist*."
  *   *The Problem:* This is often accused of being circular. How do you define "interfering factors" without already knowing what the disposition is supposed to do? If you say "anything that stops it breaking is an interferer," you haven't explained the disposition; you've just restated the problem.

  **B. The Causal Powers Turn (The Metaphysicians)**
  Many philosophers (like Stephen Mumford or Rani Lill Anjum) have taken masks as a reason to abandon conditional analysis altogether. They argue dispositions are **primitive causal powers**.
  *   *View:* To be fragile *is* to have a power to break. Whether that power is manifested depends on the environment (masks), but the power exists regardless.
  *   *Implication:* We shouldn't try to define dispositions using "if/then" statements. The "if/then" is just evidence of the power, not the definition of it. This moves the debate from language/logic to metaphysics (what kinds of properties exist in the world).

  **C. The Contextualist Approach (The Pragmatists)**
  Others suggest that disposition claims are context-sensitive.
  *   *View:* When I call a glass "fragile," I am implicitly assuming "normal conditions." If there is a mask (bubble wrap), we are no longer in "normal conditions," so the claim "it would break if struck" is technically false in that context, but the claim "it is fragile" remains true because it refers to the object's nature in *standard* contexts.
  *   *Implication:* This saves the conditional analysis by making the conditions ($C$) much more complex and context-dependent.

  ### Summary

  To pin down the distinction you were looking for:

  1.  **Finks** attack the **persistence of the cause**. (The trigger destroys the disposition).
  2.  **Masks** attack the **necessity of the effect**. (The disposition persists, but the effect is blocked).

  Lewis's fix requires the cause to persist. This solves Finks (where the cause vanishes) but fails Masks (where the cause persists but the effect is blocked).

  Most contemporary philosophers agree that Lewis's specific repair does not solve masking. Whether this kills the conditional analysis depends on whether you think you can rigorously define "normal conditions" without circularity. Many have concluded you cannot, and have shifted toward viewing dispositions as real, irreducible causal powers rather than logical shortcuts for conditionals.
