answer: |-
  You are right to be annoyed. The standard "sharp vs. fuzzy" summary obscures the logical machinery, and that machinery is exactly where the Higher-Order Vagueness (HOV) battle is fought.

  Here is the gut-level structural reason why the regress is "cheap" for Williamson and "expensive" for the Supervaluationist (Fine/Keefe).

  ### 1. The Locus of the Regress
  The fundamental asymmetry is this: **Williamson locates vagueness in our *knowledge*, while Supervaluationists locate it in the *semantics*.**

  *   **Williamson (Epistemicism):** The world and language are precise. We just don't know where the cut-off is.
  *   **Supervaluationism:** The world/language is genuinely indeterminate. Truth is defined via a range of precisifications.

  ### 2. Why Williamson's Regress is "Free" (Homogeneous)
  For Williamson, Higher-Order Vagueness is just **iterated ignorance**.

  *   **First Order:** There is a sharp boundary between *heap* and *non-heap*. We don't know where it is.
  *   **Second Order:** There is a sharp boundary between *knowably a heap* and *not knowably a heap*. We don't know where *that* is.
  *   **Third Order:** There is a sharp boundary between *knowably knowably a heap*...

  **The Structural Win:** Williamson uses **Classical Logic** at every single level.
  The proposition $P$ is True or False. The proposition $K(P)$ (We know $P$) is True or False. The proposition $K(K(P))$ is True or False.

  Because he retains bivalence and classical logic throughout, he does not need to invent new logical rules or semantic models to handle the next level of the regress. He just applies the **Margin for Error** principle again.
  *   *Margin for Error:* If you know $n$ is a heap, $n+1$ must be a heap (because your knowledge isn't precise enough to distinguish them).
  *   This principle generates the sharp boundaries automatically.

  **The Cost:** The cost is purely metaphysical/intuitive (swallowing the existence of sharp boundaries). But *logically*, stacking these boundaries is free. It's the same logic, same semantics, just applied to a more complex proposition. It is a **homogeneous regress**.

  ### 3. Why Supervaluation's Regress is "Expensive" (Heterogeneous)
  For the Supervaluationist, truth is defined as **truth on all admissible precisifications**. Let $S$ be the set of admissible precisifications.

  *   **First Order:** "Heap" is vague because different $s \in S$ draw the line at different places.
  *   **The HOV Problem:** What determines membership in $S$? Is the boundary of *admissible precisifications* sharp?
      *   If **Yes**: You've smuggled in a sharp boundary at the meta-level. You've solved HOV by becoming an epistemicist about precisifications.
      *   If **No**: Then the set $S$ itself has fuzzy boundaries. Some precisifications are "borderline admissible."

  **The Structural Loss:** If $S$ has fuzzy boundaries, the definition of truth ("True on all $s \in S$") becomes unstable.
  To fix this, the Supervaluationist cannot just use the same logic again. They must construct a **new semantic model**.
  *   Level 1: Truth = quantification over $S$ (precisifications).
  *   Level 2: Truth = quantification over $S^*$ (sets of precisifications).
  *   Level 3: Truth = quantification over $S^{**}$ (sets of sets of precisifications).

  This is a **heterogeneous regress**. Every time you move up an order of vagueness, you have to upgrade your semantic model. You aren't just adding facts (like Williamson); you are complicating the *definition of truth*.

  ### 4. Why "Admissible" Can't Just Be Supervaluated
  You asked: *Why doesn't "admissible precisification" just need its own supervaluation the same way "heap" does?*

  It can, but that is exactly where the cost comes in.
  If you supervaluate over "admissible precisifications," you are treating "admissible" as a vague predicate. But "admissible" is the **semantic primitive**. It is the tool you use to measure vagueness.

  *   If your ruler is vague, you can measure the table.
  *   But if you ask "Is the ruler itself the right length?", you can't use the ruler to measure itself without circularity or infinite regress.

  For Williamson, the "ruler" (Classical Logic/Bivalence) is precise. We just can't read the numbers on it.
  For the Supervaluationist, the "ruler" (The Set of Admissible Precisifications) is itself made of fuzzy rubber. To measure the fuzziness of the ruler, you need a meta-ruler. To measure the meta-ruler, you need a meta-meta-ruler.

  ### 5. Summary for the Seminar
  Here is the crisp distinction to give your students:

  1.  **Williamson (Epistemicism):** The regress is **ontological/epistemic**. He posits sharp boundaries at every level. Since classical logic handles infinite propositions easily, adding more sharp boundaries costs nothing *logically*. The logic stays static; only the hidden facts multiply.
  2.  **Supervaluationism:** The regress is **semantic**. The tool used to solve first-order vagueness (the set of precisifications) is itself vague. Fixing this requires building a *new* semantic tool for the second order, and another for the third. The logic/model theory must evolve at every step.

  **The Gut Check:**
  Williamson pays a **one-time entry fee** (accepting sharp boundaries). After that, the logic runs on autopilot.
  Supervaluationists pay a **subscription fee** (constantly revising the semantic model) to keep the "no sharp boundary" intuition alive at every higher order.

  **Teaching Tip:**
  Tell them Williamson treats "Definitely" as an **operator** (like "Necessarily") governed by fixed axioms (Margin for Error).
  Tell them Supervaluationists treat "Definitely" as a **quantifier** over a domain ($S$). If the domain ($S$) is vague, the quantifier breaks, requiring a new quantifier over a new domain. Operators are cheaper than rebuilding quantifiers.
