      *   **Format:** JSON object for the tiers, followed by brief explanations.
      *   **Constraint:** The user wants an "outside, structured perspective" acknowledging that no single definition is perfect, but ranking them based on *coherence across the full range of hard cases*.

  2.  **Analyze the Six Concepts:**

      *   **Biological Species Concept (BSC):**
          *   *Definition:* Groups of actually or potentially interbreeding natural populations which are reproductively isolated from other such groups (Mayr).
          *   *Strengths:* Intuitive for sexually reproducing vertebrates.
          *   *Weaknesses:* Fails completely on asexual organisms (rotifers, dandelions). Fails on fossils. Struggles with ring species (are the ends one species or two?). Struggles with hybridization (if they interbreed, are they one species? But they maintain distinctness). Bacteria (HGT makes reproductive isolation meaningless).
          *   *Verdict:* Very narrow applicability despite being the "textbook" definition.

      *   **Phylogenetic Species Concept (PSC):**
          *   *Definition:* Smallest monophyletic group of common ancestry (or diagnosable distinct lineage).
          *   *Strengths:* Works for asexuals. Works for fossils (if DNA/morphology available). Handles ring species by splitting them into distinct lineages based on traits/genetics.
          *   *Weaknesses:* Can lead to "taxonomic inflation" (splitting every tiny variant into a species). Hybrid speciation is tricky (reticulate evolution vs. tree-like branching). Bacteria HGT makes "monophyly" messy because the tree of life is more of a web.
          *   *Verdict:* Very robust generally, but struggles with the "tree" assumption in bacteria and hybrids.

      *   **Morphological Species Concept (MSC):**
          *   *Definition:* Based on physical similarity/structural features.
          *   *Strengths:* Practical, works for fossils, works for asexuals.
          *   *Weaknesses:* Subjective (how different is different?). Cryptic species (look same, genetically distinct). Polymorphism (look different, same species). Ring species (gradual change makes drawing lines arbitrary).
          *   *Verdict:* Useful tool, but theoretically weak as a fundamental definition of *what* a species is.

      *   **Ecological Species Concept (ESC):**
          *   *Definition:* A lineage occupying a distinct adaptive zone/niche.
          *   *Strengths:* Handles asexuals. Explains why hybrids might become new species (new niche). Explains coexistence.
          *   *Weaknesses:* Hard to define "niche" precisely. Different species can share niches. Same species can occupy different niches (plasticity). Ring species might occupy similar niches along the ring.
          *   *Verdict:* Strong theoretically, but operational difficulties.

      *   **Cohesion Species Concept (CSC):**
          *   *Definition:* Most inclusive population having the potential for phenotypic cohesion through intrinsic cohesion mechanisms (gene flow + stabilizing selection).
          *   *Strengths:* Explicitly designed to include asexuals (via stabilizing selection) and sexuals (via gene flow). Attempts to unify BSC and others.
          *   *Weaknesses:* Complex to apply. Still struggles with the continuum nature of ring species (where does cohesion break?).
          *   *Verdict:* One of the most comprehensive theoretical attempts.

      *   **Evolutionary Species Concept (EvSC):**
          *   *Definition:* A lineage evolving separately from others with its own unitary evolutionary role and tendencies (Simpson/Wiley).
          *   *Strengths:* Very broad. Covers asexuals, sexuals, fossils. Focuses on independent evolutionary fate.
          *   *Weaknesses:* Vague ("separate lineage" is hard to define operationally). Hard to test in real-time.
          *   *Verdict:* Very robust theoretically, often seen as the "umbrella" concept.

