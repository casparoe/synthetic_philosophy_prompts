answer: |-
  Good evening, everyone. For those who don't know me, I'm [Sister's Name]'s older sister. I'm also a dental hygienist, which means I spend my days looking into people's mouths and telling them to floss more. So, when [Sister] and [Fiancé] asked me to give this toast, I was a little worried. Usually, when I talk about "flossing," people tune out. And usually, when they talk about "decision theory," *I* tune out.

  But I wanted to understand them. I wanted to understand how two people meet at a weekend workshop about argumentative logic and end up here, three years later, happier than anyone I know. So, over the last year, I actually did some homework. I bought a secondhand copy of Douglas Hofstadter's columns. I read about game theory. I even learned what a "Prisoner's Dilemma" is, though I still think "Prisoner's" is a grim name for a wedding concept.

  And I got stuck on one idea that Hofstadter calls "superrationality."

  Now, for the half of the room who met the couple at that workshop: please be gentle with my definition. For the aunts and uncles: stick with me, because this is actually the most romantic thing I've ever learned.

  The basic idea is this: Imagine you and a partner face a choice. You can look out for yourself, or you can look out for both of you. If you just trust the other person, you're taking a risk. You're hoping they're good. But superrationality suggests something different. It says that if two people reason alike, and value alike, and face the same choice... then they don't need to hope. They can *know*. Because whatever logic leads me to choose loyalty, is the exact same logic leading you to choose loyalty. We aren't two separate gamblers betting on each other. We are one mirror reflecting a decision. Choosing for myself *is* choosing for us.

  When I first read that, I thought it sounded cold. Calculating. But then I thought about [Sister] and [Fiancé]'s first year together.

  They spent that year on different continents. They were young, they were apart, and by their own admission, they were perfectly free to stray. No one would have known. In the standard story of romance, we say they didn't stray because they had "trust." We say they had faith.

  But when I asked them about it, they told me something else. They told me they didn't spend that year worrying. Not because they blindly believed the other was perfect, but because they had each separately reasoned through the value of what they had. They knew that the other person weighed the world the same way they did. They knew that the conclusion they had reached about commitment was a conclusion the other person *had* to reach, because they were using the same heart and the same head to get there.

  They weren't trusting a stranger. They were recognizing a mirror.

  To the family: This isn't cold math. This is the deepest form of intimacy I can imagine. It means that when [Fiancé] makes a decision, [Sister] doesn't have to guess if he considered her. She knows he did, because his reasoning includes her by default. And to the workshop crew: Yes, I know the causal links are debatable. But look at them. The correlation holds.

  Marriage, as I understand it, is going to be a long series of these dilemmas. Some small, like who does the dishes. Some huge, like how to raise children, or how to care for aging parents, or how to keep going when things are hard.

  There will be moments where it is easier to defect. Easier to look out for number one. Easier to be selfish.

  My wish for you is not that you never face those choices. My wish is that you never lose the superrationality you found in that workshop and kept across the oceans. May you always be so alike in your values that you never have to negotiate on the basics. May you always look at a hard choice and realize that the right answer for you is the right answer for *us*. May you never have to demand loyalty, because you are both busy embodying it.

  [Sister], I studied hard to understand your love language. And I think I finally get it. You don't just trust each other. You *match* each other.

  So, if everyone could please raise a glass.

  To [Sister] and [Fiancé]. May your reasoning always be shared, your choices always be symmetric, and your cooperation always be the only logical conclusion.

  To the bride and groom!
