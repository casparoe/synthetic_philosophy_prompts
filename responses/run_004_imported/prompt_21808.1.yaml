  2.  **Deconstruct the Franklin Material:**
      *   *The Chart:* 13 virtues, weekly grid, marking slips.
      *   *The "Order" Virtue:* Franklin struggled most with this (the speckled axe story – wanting a bright axe but not wanting the grindstone work).
      *   *The "Humility" Virtue:* Franklin admitted he was proud of his humility.
      *   *The Conclusion:* He never achieved perfection, but he was better and happier for trying.
      *   *Relevance to Dad:* Dad kept the chart, but likely didn't achieve perfection either (garage organization issues). The effort matters more than the result.

  3.  **Determine the Structure of the Toast:**
      *   **Opening:** Acknowledge the occasion (60th), the honor, and the elephant in the room (the pantry chart).
      *   **The "Public" Franklin:** Briefly mention what most people know ($100 bill, kite, perfect sage).
      *   **The "Real" Franklin:** Pivot to the autobiography insights (the struggle, the speckled axe, the humility paradox).
      *   **Connecting to Dad:** How Dad used the chart. Not as a scoreboard for perfection, but as a compass for direction. Acknowledge the imperfections (the garage) warmly.
      *   **The Lesson:** Trying to be better is the point, not being perfect.
      *   **Closing:** A wish for the next chapter and a raise of the glass.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with the chart. It's the family lore. "For those who don't know..."
