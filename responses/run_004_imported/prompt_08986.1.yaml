answer: |-
  This is an excellent methodological approach. As someone accustomed to laboratory controls, you are right to demand a case where the variables are isolated enough to produce divergent predictions. In philosophy, when two theories explain the same data (like the original Bank Case) equally well, the suspicion of a "merely verbal dispute" is warranted. To test this, we need a "crossed-stakes" scenario where the attributor's context and the subject's practical situation pull in opposite directions.

  Here is the test case, the predictions, and the verdict on whether these theories are substantive rivals.

  ### The Test Case: The Unaware Attributor

  **The Subject (Hannah):** Hannah has evidence that the bank is open on Saturday (she was there two weeks ago). However, unbeknownst to anyone else, Hannah is in a **high-stakes** situation. If she does not deposit a check by Monday, she will face foreclosure on her house. For Hannah, the cost of being wrong is catastrophic.

  **The Attributor (John):** John is speaking to a friend in a **low-stakes** context. They are casually discussing weekend errands. John has no idea about Hannah's mortgage crisis; he assumes her situation is ordinary.

  **The Ascription:** John says, "Hannah knows the bank is open on Saturday."

  ---

  ### The Predictions

  **1. Epistemic Contextualism (EC)**
  *   **Mechanism:** The truth conditions of "knows" are determined by the *attributor's* conversational context.
  *   **Analysis:** John is in a low-stakes conversation. Therefore, the semantic standard for "knows" in John's mouth is low. Hannah's evidence (memory of being there two weeks ago) meets this low standard.
  *   **Verdict:** John's statement is **True**.
  *   **Reasoning:** The subject's hidden stakes are irrelevant to the semantic content of the word "knows" as used by the speaker. Only the speaker's context sets the bar.

  **2. Subject-Sensitive Invariantism (SSI)**
  *   **Mechanism:** The truth conditions of "knows" are invariant (they do not shift with the speaker) but are sensitive to the *subject's* practical situation.
  *   **Analysis:** Hannah is in a high-stakes situation. Therefore, the epistemic bar she must clear to count as "knowing" is high. Her evidence (memory of being there two weeks ago) is insufficient for this high bar (she ought to check the hours).
  *   **Verdict:** John's statement is **False**.
  *   **Reasoning:** Whether Hannah knows is a fact about Hannah and her environment, not about John's conversational context. Since she doesn't actually know (given her stakes), any claim that she does is false, regardless of who says it.

  ---

  ### The Verdict: Substantive Rivals or Notational Variants?

  Based on the result of this test case, **Epistemic Contextualism and Subject-Sensitive Invariantism are substantive rivals, not merely notational variants.**

  Here is the breakdown of why this conclusion holds:

  **1. Divergent Truth Values**
  A "notational variant" implies that two theories describe the same underlying reality using different terminology, such that they would agree on the truth value of any given claim in any possible world. In the *Unaware Attributor* case, EC predicts the utterance is **True**, while SSI predicts it is **False**. They disagree on the correctness of the speech act. In empirical terms, they are competing hypotheses about the same data point.

  **2. Different Loci of Normativity**
  The disagreement reveals a fundamental divergence in what governs knowledge ascriptions:
  *   **EC** treats knowledge ascriptions as tools for managing *conversational* expectations. John's statement is successful because it correctly signals to his friend that, *for their purposes*, Hannah's evidence is good enough.
  *   **SSI** treats knowledge ascriptions as reports on a *normative status* tied to action. John's statement fails because it misreports Hannah's actual readiness to act on the proposition.

  **3. The "Proposition" Objection (and why it doesn't save them)**
  A sophisticated contextualist might argue: "EC and SSI aren't disagreeing because they say different *propositions* are expressed."
  *   EC says John expressed the proposition *Hannah meets low-standard-K*. (True)
  *   SSI says John expressed the proposition *Hannah meets high-standard-K*. (False)

  However, this does not reduce the dispute to notation. From the perspective of evaluating John's assertion (which is what epistemology aims to do), the theories offer incompatible advice. If you are John, EC tells you that you have spoken correctly; SSI tells you that you have spoken falsely. This is a practical, substantive disagreement about the norms of assertion and the nature of knowledge, not a semantic quibble.

  ### Conclusion

  Your suspicion of verbal debates is healthy, but this specific controversy survives the test. By isolating the attributor's context from the subject's stakes, we force the theories to reveal their distinct commitments.

  *   **Contextualism** claims knowledge is a relation between a subject, a proposition, and a **conversational standard**.
  *   **SSI** claims knowledge is a relation between a subject, a proposition, and a **practical environment**.

  Since a speaker's conversation and a subject's environment can come apart (as in the *Unaware Attributor* case), the theories make incompatible predictions. They are substantive rivals competing to explain the same phenomenon, and the *Unaware Attributor* case is the crucible that distinguishes them.
