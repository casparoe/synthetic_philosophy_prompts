prompt: |-
  I sit on the calibration panel that reviews "corrective action" writeups after incidents at my company -- supposedly blameless postmortems, except the writeup still follows you into calibration. Two cases this cycle are bugging me. Engineer A pushed a database migration on a friday without running it through our staging replay tool first -- against policy, though half the org skips that step with zero consequences -- and it happened to hit a gnarly edge case, taking down checkout for six hours. Engineer B did the exact same thing the same week, skipped the same step, but their migration didn't touch anything broken, so nobody even noticed til this review. Honestly, swap the deploy order and we'd probably be writing up the other one instead. Half the panel wants to write up A and let B off with a verbal reminder, "no harm no foul"; the other half says that's nuts since the only difference was luck. Can you draft the memo I'll bring to next weeks calibration meeting -- a real recommendation, not "both sides have a point," with reasoning solid enough that whichever engineer loses out can see it wasn't arbitrary?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a calibration panel reviewing "corrective action" writeups after incidents.
      *   **Context:** Supposedly "blameless postmortems," but writeups follow engineers into calibration (performance/consequence implications).
      *   **The Dilemma:** Two engineers (A and B) committed the exact same policy violation (skipping staging replay tool before DB migration on a Friday).
          *   Engineer A: Caused a 6-hour checkout outage (bad luck/edge case).
          *   Engineer B: No visible impact (good luck).
      *   **The Conflict:** Panel is split. Half want to punish A ("harm done"), half want to treat them equally ("only luck differs").
      *   **Task:** Draft a memo for the next calibration meeting.
      *   **Requirement:** A *real recommendation*, not fence-sitting. Reasoning must be solid enough that the "losing" engineer sees it wasn't arbitrary.
      *   **Underlying Principle:** True Blameless Postmortem culture vs. Outcome Bias.

  2.  **Determine the Stance:**
      *   *Option 1: Punish A, let B go.* This reinforces "Outcome Bias." It discourages reporting incidents (why admit fault if you get punished more for bad luck?). It violates the core tenet of "blameless" culture. It incentivizes hiding near-misses.
      *   *Option 2: Treat A and B identically.* This aligns with systems thinking and true blameless culture. It focuses on the *decision process* and *risk exposure*, not the random outcome. It addresses the systemic issue (why is the tool skippable? Why are Friday deploys allowed?).
      *   *Decision:* Option 2 is the only one that supports long-term reliability and psychological safety. If the goal is to prevent future incidents, punishing luck is counterproductive. The memo must argue for consistent accountability based on *action*, not *outcome*.

  3.  **Drafting Strategy - Key Components of the Memo:**
      *   **Header:** Clear To/From/Subject.
      *   **Executive Summary:** State the recommendation upfront (Treat A and B identically).
      *   **The Core Principle:** Define "Blameless" correctly. It's not "no consequences," it's "consequences tied to behavior, not luck."
      *   **Analysis of the Cases:** Highlight the identical violation.
      *   **The Risk of Outcome Bias:** Explain why punishing A more is dangerous (hiding incidents, gaming the system).
      *   **The Real Problem:** Shift focus from the engineers to the system (why was the guardrail bypassable?).
      *   **Recommendation:** Specific corrective actions for both (coaching/training on process) + Systemic fixes.
      *   **Closing:** Reiterate the goal (reliability culture).

  4.  **Refining the Tone:**
      *   Needs to be professional, firm, and empathetic.
      *   Avoid academic jargon where possible, but use industry-standard terms (Outcome Bias, Just Culture).
      *   Acknowledge the pain of the outage (don't minimize A's incident) but separate the *impact* from the *accountability*.
      *   Make it clear that "identical treatment" doesn't mean "no treatment." There still needs to be accountability for the policy violation.

  5.  **Drafting - Section by Section (Mental or Scratchpad):**
      *   *Subject:* Calibration Cycle X - Incident Review Consistency.
      *   *Opening:* We have a divergence on Case A vs. Case B.
      *   *Argument:* They broke the same rule. The only difference is luck. If we punish luck, people hide mistakes.
      *   *Counter-argument anticipation:* "But 6 hours downtime is huge!" Response: Yes, but the *violation* is the skip. The impact is a system vulnerability, not just individual error.
      *   *Action:* Both get the same coaching. System gets fixed.
      *   *Why this works:* Fairness. Predictability. Safety.

  6.  **Polishing the Argument (Self-Correction during drafting):**
      *   *Critique:* Is it fair to Engineer A? They caused the outage.
      *   *Correction:* It feels unfair to A personally, but it's fair *procedurally*. The memo needs to acknowledge that A's incident triggers a deeper system review, which is actually *more* work for A's team, but the *personal* disciplinary record should match B's. Wait, actually, the prompt asks about the "writeup following them into calibration." This implies performance review impact.
      *   *Refinement:* The recommendation should be that the *performance implication* (the writeup severity) must be identical. The *incident response* (postmortem depth) will naturally differ because one had impact and one didn't, but the *personnel action* must align.
      *   *Crucial Point:* If we punish A more, we create a "lottery of blame." That destroys trust.

  7.  **Finalizing the Recommendation:**
      *   Recommend identical corrective action records for both.
      *   Recommend systemic fixes (guardrails) to prevent the choice from existing.
      *   Explain *why* this protects the company long-term.

  8.  **Review against Constraints:**
      *   Real recommendation? Yes (Treat them equally).
      *   Reasoning solid? Yes (based on Just Culture/Outcome Bias).
      *   Not arbitrary? Yes (logic is clearly laid out).
      *   Tone? Professional and decisive.

  9.  **Final Polish:** Check for clarity and impact. Ensure the distinction between "accountability for process" and "liability for outcome" is clear. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to make sure I don't sound like I'm ignoring the 6-hour outage. The outage matters for *business* review, but not for *individual* calibration regarding the policy violation. I need to make sure the memo distinguishes between "Incident Severity" (which differs) and "Process Violation Severity" (which is identical).

  10. **Final Structure:**
      *   To/From/Subject.
      *   Recommendation (The "What").
      *   Rationale (The "Why" - Outcome Bias, Just Culture).
      *   Addressing the Counter-Argument (The "But the outage..." point).
      *   Systemic Action Items (The "How we fix it").
      *   Conclusion.

