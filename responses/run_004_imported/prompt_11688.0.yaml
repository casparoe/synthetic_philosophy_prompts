      *   Honest about the other side? Yes.
      *   Memo format? Yes.
      *   Tone appropriate? Yes.

      *(Self-Correction on the "Side" to pick)*: It is methodologically unsound to penalize accuracy. If the 45% turns out right, penalizing them is punishing truth. The issue is *incentives*. So the recommendation must be: **Keep scoring, change guidance to protect diversity.** I will argue that we must treat this as valid *Bayesian updating on social evidence*, but warn that it degrades the *public good* of the tournament.

      *Wait, one nuance:* The forecaster said "my analysis hasn't moved." This is key. They aren't updating on new *world* info, just *social* info.
