      *   *Okay, let's look at the "Reflection Principle" application.* Van Fraassen talks about *your* future credence. Using *current consensus* as a proxy for *future credence* is an assumption that the crowd is smarter than you.
      *   *Decision:* **Recommendation: Accept the forecast as valid (do not disqualify), but issue guidance clarifying that 'Reflection Principle' updating on consensus is a high-risk strategy that undermines the tournament's epistemic value. Do not change the scoring rule (penalizing accuracy is worse), but add a qualitative metric or badge for 'Independent Analysis' to counterbalance the incentive to herd.**
