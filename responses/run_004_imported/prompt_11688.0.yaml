      *   *No, I need a policy.* **Policy: Revisions based solely on consensus shifts are permitted for accuracy scoring, but forecasters will be advised that reliance on this method disqualifies them from 'Top Independent Thinker' awards (or similar).**
      *   *Let's settle on:* **Permit the revision (accuracy is accuracy), but change the *guidance* to explicitly distinguish between updating on *information revealed by consensus* vs. *conformity*.**
      *   *Wait, the prompt asks about scoring rule AND guidance.*
