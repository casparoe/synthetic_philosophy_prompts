          1.  **Decision:** Do not penalize the score (Brier score remains king).
          2.  **Guidance:** Explicitly address the Reflection Principle. Validate the logic *individually* but warn of the *systemic* cost.
          3.  **Mitigation:** Introduce a requirement for "rationale transparency" that forces forecasters to label *why* they moved.
          4.  **Honest Counter-argument:** Acknowledge that validating this creates a cascade risk where the crowd becomes a single mind.

  4.  **Drafting the Memo:**
