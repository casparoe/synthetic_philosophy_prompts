answer: |-
  The ticket lay on the desk between them, a small rectangle of stiff cardstock printed with a time and a destination: *Aleppo, 19:00*. Outside the office window, the rain blurred the lights of Damascus into smeared streaks of gold and grey.

  Elias stared at the ticket. He did not touch it.

  "Buy another one," Kael said. She was leaning against the doorframe, finishing an apple. She sounded bored, or perhaps she was just practiced at sounding that way. "If you think the train is compromised, take the car. Just leave the city."

  "It's not about the vehicle, Kael."

  "Then what is it about?" She tossed the apple core into the bin. It missed. "The Auditor is coming. You know where he is going to be. You go somewhere else. That's how geometry works."

  Elias finally looked up. His eyes were red-rimmed, not from weeping, but from the strain of a thought that refused to complete a circuit. "The Auditor doesn't chase. You know the stories. He carries the Ledger. He writes the entries tomorrow morning based on where he knows we will be tonight."

  "So he's a predictor," Kael said. "Fine. He's right ninety-nine percent of the time. That means he's wrong one percent of the time. Be the one percent."

  "You're treating his prediction as a cause," Elias said, his voice tight. "You think if I choose Aleppo, I am causing myself to be safe because he isn't there yet. But my choice isn't a cause. It's evidence."

  He stood up and began to pace the small office. The carpet was worn thin in a track along the floorboards. "If I decide to stay in Damascus, it is because I believe the Auditor is in Aleppo. But if I believe that, then I am the kind of person who stays. And if I am the kind of person who stays, the Auditor predicted I would stay. So he is here. In this room."

  Kael pushed off the doorframe. "Then go to Aleppo."

  "If I go to Aleppo," Elias continued, ignoring her, "it is because I believe the Auditor is in Damascus. But if I believe that, I am the kind of person who runs. And if I am the kind of person who runs, the Auditor predicted I would run. So he is in Aleppo. At the station."

  He stopped pacing and pressed his palms against his temples. "Don't you see? The decision creates the truth it tries to evade. My reasoning is the trail he follows."

  "This is paralysis," Kael said flatly. "You're hypnotizing yourself. The Ledger is paper. The Auditor is a man. He has to travel. He has to sleep. You have legs. Use them."

  "It's not paralysis. It's math." Elias walked back to the desk and looked at the ticket again. "Imagine I choose to stay. In that moment, the probability that the Ledger says 'Damascus' approaches one. So the expected utility of staying drops to zero. So I should go. But the moment I decide to go, the probability that the Ledger says 'Aleppo' approaches one. So the expected utility of going drops to zero. So I should stay."

  He laughed, a short, dry sound. "There is no stable point. Every position I occupy collapses the moment I occupy it."

  Kael walked over and picked up the ticket. She held it between two fingers. "You want me to throw this away? Fine." She dropped it into the trash bin on top of the apple core. "Now you have no ticket. You stay. Problem solved."

  "No," Elias said sharply. "Now I know I have no ticket. So I know I am staying. So the Auditor knows I am staying. So he comes here."

  "Then buy a new ticket."

  "Then I know I'm leaving. So he goes there."

  Elias reached into his pocket and pulled out a coin. It was silver, worn smooth on the edges. "Randomization," he said. "If I let chance decide, then my choice isn't evidence of anything. It's noise. He can't predict noise."

  "He can predict the coin flip," Kael said.

  "No. Quantum indeterminacy. Chaos. He's a man, not a god. He predicts behavior. He doesn't predict atomic decay." Elias flicked the coin. It caught the light, spinning into a blur. He slapped it onto the back of his hand and hovered there, trembling.

  He didn't look down.

  "If it's heads, I go. If it's tails, I stay."

  "And if the Auditor predicted you would flip the coin?" Kael asked. "And he predicted the outcome? He knows you're desperate. Desperate men flip coins."

  Elias lifted his hand. He didn't look at the coin. He looked at Kael. "If he predicted the flip, then the result is already written in the Ledger. If this coin shows heads, it means the Ledger says Aleppo. So I shouldn't go."

  "Then don't look at it," Kael said. "Just go. Blindly."

  "If I go blindly, I am choosing blindness. That is a strategy. He predicts strategies." Elias's hand shook violently. The coin slid off his thumb and clattered onto the desk, spinning wildly before settling.

  Neither of them looked at it.

  The silence in the room grew heavy, pressing against their ears. The rain continued to wash the city outside, erasing the boundaries between the buildings. Elias felt a cold sweat prickling at the hairline. He understood now that the terror wasn't death itself. It was the loss of agency. He was not a player in this game; he was a variable being solved for.

  "What time is it?" Elias whispered.

  "Six forty-five," Kael said. She checked her watch. "Train leaves in fifteen minutes."

  Elias looked at the coin. It was tails.

  *Tails. Stay.*

  But the knowledge of the tails meant he now had evidence that the Ledger said Damascus. The evidence was overwhelming. To stay was to walk into the prediction. He had to go. He had to contradict the coin.

  "But if I contradict the coin," Elias murmured, "then I am the kind of man who contradicts coins. And he predicts that."

  "Elias," Kael said. Her voice was softer now. "You're still breathing. The Auditor isn't here. Yet."

  "He's wherever I am not," Elias said. "No. He's wherever I am. Because that's where he expects me."

  He reached for his coat. He pulled it on, sliding his arms into the sleeves. Then he stopped. If he put on the coat, he was preparing to leave. That was evidence. He took the coat off. If he took the coat off, he was preparing to stay. That was evidence.

  He held the coat in his hands, bunched up like a dead animal.

  "I can't decide," he said. "I literally cannot. Every path I map out curves back onto the Ledger."

  "Then don't decide," Kael said. "Stand there."

  "If I stand here, I am deciding to wait."

  "Then sit."

  "If I sit, I am deciding to rest."

  Elias dropped the coat onto the chair. He stood in the center of the room, arms hanging at his sides. He felt like a statue waiting for the pedestal to crack. He wanted to run. The urge surged in his legs, a physical pain. But to run was to confirm the prediction of flight. He wanted to sit. The fatigue was bone-deep. But to sit was to confirm the prediction of stagnation.

  He was trapped in the gap between the cause and the effect, where the only thing that existed was the correlation.

  "Kael," he said, not looking at her. "Are you leaving?"

  "Yes," she said. She picked up her bag. "I'm going to the coast."

  "Aleppo?"

  "No. Beirut. Different line."

  "Doesn't matter," Elias said. "He's not looking for you."

  "Maybe," Kael said. She put her hand on the doorknob. "Or maybe he is. But I'm not going to let the maybe stop me from moving my feet."

  "If you go," Elias said, "and you survive, it proves he wasn't there. But if he wasn't there, it means he predicted you wouldn't go. Which means you're lucky, not smart."

  "Better lucky," Kael said. She opened the door. The sound of the rain came in, louder now, rushing into the quiet room. "Come with me."

  Elias looked at the ticket in the bin. He looked at the coin on the desk. He looked at the door.

  If he walked through the door, he became a runner. The Ledger closed around him.
  If he stayed in the room, he became a victim. The Ledger closed around him.

  "I don't know where I am," Elias said.

  "You're in Damascus," Kael said.

  "No," Elias whispered. "I'm in the prediction."

  Kael waited for a moment, her silhouette framed by the hallway light. She shook her head, once, and stepped out into the corridor. The door clicked shut.

  Elias stood alone in the office. The clock on the wall ticked. The second hand swept forward, a smooth, uninterrupted motion. It did not hesitate. It did not wonder if moving forward was evidence of where it would end up. It simply moved.

  Elias tried to match it. He tried to will his foot to lift. He sent the signal from his brain, down the spine, to the leg. But the signal met a counter-signal, a calculation of risk that canceled the command before it reached the muscle.

  *If I move, I am caught.*
  *If I stay, I am caught.*

  The clock ticked again. 18:50.

  Elias opened his mouth to speak, to say a name, to call her back, to ask the air for a rule that didn't bend back on itself. But no sound came out. To speak was to act. To act was to be known.

  He stood perfectly still, breathing shallowly, waiting for a decision that would not change the outcome, trapped in the only place where the Ledger could not yet be written, because he had refused to turn the page.
