      *   **Aumann's Agreement Theorem:** If we have common priors and *common knowledge* of each other's posteriors, we cannot agree to disagree. Our posteriors must be identical.
      *   **The Mechanism:** If I say "I think there's a 70% chance of rain" and you say "I think there's a 40% chance," and we know we are both rational Bayesians with common priors, the mere fact that we disagree tells me something about your evidence. I update. You update. We iterate until we match.
      *   **No-Trade Theorem:** If we have common priors and are rational, I should never accept a bet from you. If you want to bet, you must have information I don't. Knowing you want to bet makes me update my belief to match yours, eliminating the edge required for the bet.
