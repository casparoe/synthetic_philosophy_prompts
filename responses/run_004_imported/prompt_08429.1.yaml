          *   Solution: Each board member must own the decision personally. We vote as individuals, not as a faceless bloc. We communicate personally.
      *   **Timeline:** Tight. Meeting Thursday. Printer Friday. Communication needs to happen immediately after the vote.
      *   **Action Plan:** How to talk to donors (personal calls/emails, not just a statement). How to talk to the winner (support but accountability?). How to talk to the public (brief, firm).

  5.  **Refining the Tone:**
      *   Needs to be intellectual but practical.
      *   Avoid pretension (don't just quote Kierkegaard, *use* him).
      *   Empathetic to the donors (don't dismiss them as "the crowd").
