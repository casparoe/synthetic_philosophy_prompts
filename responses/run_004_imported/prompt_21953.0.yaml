      *   *Option 3: Eligible.* This aligns best with the *spirit* of early-career prizes (supporting those who haven't had full time to build a record). It honors the "allowances" clause.
      *   *Selection:* **Eligible.** This allows for the strongest engagement with the "Precision" side (Side A) from the perspective of Side B (or a synthesis that leans B but validates A's intent), or vice versa.
