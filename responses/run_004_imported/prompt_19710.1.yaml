prompt: |-
  I help moderate a mid-sized rationalist-adjacent forecasting-and-epistemics forum (something like a smaller cousin of LessWrong or the Metaculus discussion boards). We maintain a pinned "Community Consensus" wiki covering a handful of long-running empirical and methodological disputes that the userbase has argued out at exhaustive length and now treats as settled background. Over the past year, an increasing share of new threads have simply re-litigated these settled questions, often rehearsing arguments already addressed years earlier, and several moderators now want to adopt a formal rule: once an entry is tagged [Settled], any thread challenging it is automatically locked unless a moderator first certifies that it contains evidence or argument not already addressed in the consensus write-up. Proponents describe this as merely formalizing what good moderators already do informally. A few of us keep returning to the worry that the rule is structurally very close to Kripke's dogmatism paradox: we would be using our current confidence that P is settled to license screening out, in advance and without full examination, any future evidence against P -- exactly the move that argument shows knowledge (or something close to it) seems to license, despite this being an obviously poor policy for a community whose stated purpose is updating on evidence. I realize a community's provisional consensus is not quite the individual, factive knowledge state Kripke's argument concerns, and that this disanalogy may be doing real work, but the structural parallel still strikes me as more than superficial -- and I've seen people gesture at a related worry using Scott Alexander's "trapped priors" framing, though I am not sure whether that names the same phenomenon or merely a superficially similar one.

  Could you draft the internal policy memo the moderation team would actually circulate on this question? It should come down clearly on whether to adopt, reject, or substantially modify the certification-gate proposal; specify concrete criteria a moderator could apply in the moment when judging whether a challenge thread clears the bar; and include a review cadence or sunset clause for revisiting [Settled] tags rather than treating them as permanent. Most importantly, I would like the memo to engage with the dogmatism-paradox worry on its merits, including taking a position on what, if anything, distinguishes legitimate triage of low-quality repetition from the kind of pre-emptive evidence-screening the paradox describes, rather than setting the worry aside as too abstract for a moderation policy to address.
reasoning: |-
  Here's a thinking process that leads to the suggested policy memo:

  1.  **Analyze the Request:**
      *   **Context:** A mid-sized rationalist-adjacent forecasting/epistemics forum (like LessWrong/Metaculus).
      *   **Problem:** New threads keep re-litigating "settled" consensus wiki entries.
      *   **Proposed Solution:** A formal rule where threads challenging [Settled] entries are auto-locked unless a moderator certifies they contain *new* evidence/arguments.
      *   **Concern:** This looks like Kripke's Dogmatism Paradox (using current confidence to screen out future counter-evidence) or Scott Alexander's "Trapped Priors."
      *   **Task:** Draft an internal policy memo for the moderation team.
      *   **Requirements:**
          *   Take a clear stance (Adopt, Reject, or Modify).
          *   Specify concrete criteria for moderators.
          *   Include a review cadence/sunset clause for [Settled] tags.
          *   **Crucial:** Engage deeply with the Dogmatism Paradox/Trapped Priors worry, distinguishing legitimate triage from epistemic closure.

  2.  **Deconstruct the Epistemic Worry (Kripke's Dogmatism Paradox):**
      *   *The Paradox:* If I know $P$, I know that any evidence against $P$ is misleading. Therefore, I can ignore any evidence against $P$. This leads to dogmatism.
      *   *The Forum Context:* The community "knows" (consensus) $P$. Therefore, challenges to $P$ are likely noise. Therefore, lock them.
      *   *The Risk:* If the consensus is wrong, or if the world has changed, the rule prevents updating. It creates a local maximum of epistemic hygiene that traps the community in error.
      *   *The Distinction:* Individual knowledge vs. Community Consensus. Consensus is probabilistic and provisional, not factive knowledge. The goal isn't to protect "Truth" but to protect *signal-to-noise ratio* while maintaining *updateability*.
      *   *Resolution:* The policy must explicitly acknowledge fallibility. The "certification" shouldn't be "Is this true?" but "Is this *novel*?" The [Settled] tag must be treated as "High Confidence Provisional Consensus," not "Dogma."

  3.  **Deconstruct "Trapped Priors" (Scott Alexander):**
      *   *Concept:* When priors are too strong, new evidence is interpreted as noise or error rather than data.
      *   *Relevance:* If moderators screen too aggressively, they enforce trapped priors on the community.
      *   *Mitigation:* The review cadence/sunset clause is the antidote to trapped priors. It forces a re-evaluation of the prior itself.

  4.  **Determine the Stance:**
      *   *Option A (Adopt as is):* Too risky. Validates the dogmatism worry.
      *   *Option B (Reject):* Loses the benefit of reducing noise and fatigue.
      *   *Option C (Modify):* Best path. Implement the gatekeeping but add robust safeguards (sunset clauses, clear criteria, explicit fallibility acknowledgment).
      *   *Decision:* Recommend a **Modified Adoption**. We need to stop the noise, but we must build epistemic escape hatches.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard internal memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly (Modify & Adopt with safeguards).
      *   **Background:** Briefly state the problem (re-litigation fatigue).
      *   **Epistemic Risk Assessment (The Core Request):** This needs to address Kripke/Trapped Priors directly.
          *   Acknowledge the parallel.
          *   Distinguish "Community Consensus" from "Knowledge."
          *   Define the goal: Efficiency vs. Truth-seeking.
          *   Explain how the safeguards mitigate the paradox.
      *   **Proposed Policy (The Mechanics):**
          *   The Certification Gate (what counts as "new"?).
          *   Concrete Criteria (Data, Methodology, Context Change).
          *   The "Burden of Proof" shift (without making it impossible).
      *   **Sunset & Review Cadence:**
          *   Tags expire or need renewal.
          *   Scheduled "Red Team" events.
      *   **Implementation Plan:** How to roll this out.

  6.  **Refining the Epistemic Argument (Self-Correction during drafting):**
      *   *Initial thought:* Just say "Consensus isn't knowledge."
      *   *Correction:* Too hand-wavy. Need to explain *why* the moderation action isn't the same as the paradoxical move.
      *   *Key distinction:* Kripke's paradox relies on the *factivity* of knowledge (If I know $P$, $P$ is true). Community consensus is *non-factive*. Therefore, screening based on consensus is a heuristic for *discussion quality*, not a claim of *infallibility*. The memo must emphasize that we are screening for *repetition*, not *falsehood*.
      *   *Trapped Priors:* Address this by ensuring the [Settled] tag itself is subject to updating. The "prior" (the tag) must have a half-life.

  7.  **Developing Concrete Criteria:**
      *   Moderators aren't subject matter experts in everything. They can't judge truth easily.
      *   They *can* judge novelty.
      *   Criteria:
          1.  New data (not available at time of consensus).
          2.  New methodology (flaw identified in old consensus).
          3.  Context shift (consensus was conditional, conditions changed).
          4.  Synthesis (new argument combining old points in a non-trivial way).
      *   Explicitly exclude: "I just don't buy the old argument" (without new backing).

  8.  **Developing the Sunset Clause:**
      *   Time-based? (e.g., 2 years).
      *   Event-based? (e.g., major field shift).
      *   Let's go with a hybrid: Automatic review every 18-24 months, or upon petition with significant upvotes.

  9.  **Tone and Style:**
      *   Professional, epistemically humble, precise.
      *   Avoids bureaucratic jargon where possible, uses community-aligned language (updating, priors, steelmanning).
      *   Addresses the moderators as peers in epistemic stewardship.

  10. **Final Review against Constraints:**
      *   Clear stance? Yes (Modified Adoption).
      *   Concrete criteria? Yes.
      *   Review cadence? Yes.
      *   Engage Dogmatism/Trapped Priors? Yes, dedicated section.

  11. **Final Polish:** Check for clarity and flow. Ensure the distinction between "locking a thread" and "locking a truth" is sharp. (Self-correction: Make sure to emphasize that locking a thread is a *resource allocation* decision, not a *truth* decision.)

  *(Self-Correction during final review)*: I need to make sure I don't sound like I'm dismissing the user's worry. The prompt says "Most importantly, I would like the memo to engage with the dogmatism-paradox worry on its merits." I will dedicate a specific section to "Epistemic Safeguards & The Dogmatism Objection."

