answer: |-
  You have put your finger on one of the most fascinating and structurally vital aspects of Hobbes's system. The short answer is: **yes, these commitments are deeply connected.** They are not merely adjacent doctrines; they are load-bearing walls of the same architectural structure.

  Your intuition that Hobbes's materialism underwrites his view of geometric certainty, and that this same logic drives his political ambition, is supported by the internal logic of his tripartite philosophical system (*De Corpore*, *De Homine*, *De Cive*).

  Here is an analysis of how those connections work, why the dispute with Wallis was philosophically inevitable for Hobbes, and how this bridges the gap to his political theory.

  ### 1. Materialism as the Condition of Intelligibility
  To understand the connection, we must first look at Hobbes's epistemology. For Hobbes, all thought is computation, and all computation is a manipulation of names that refer to ideas, which in turn are decaying sense impressions. Since sense impressions are caused by the pressure of external bodies on our sensory organs, **nothing is intelligible that is not a body or an accident of a body.**

  This creates a problem for standard Euclidean geometry, which treats points, lines, and surfaces as abstractions (a point has no parts, a line has no breadth). For Hobbes, this is "insignificant speech." You cannot have an idea of something that has no magnitude, because you cannot sense it.

  Therefore, Hobbes redefines geometric objects materially in *De Corpore*:
  *   A **point** is a body considered without regard to its magnitude.
  *   A **line** is the trace of a point in motion.
  *   A **surface** is the trace of a line in motion.

  **The Connection to Certainty:**
  Why does this materialist redefinition support certainty? Because it makes geometry a science of **causes**.
  For Hobbes, to "know" something scientifically is to know its cause. In natural philosophy (physics), we observe effects and try to guess the causes (which is prone to error). In geometry, **we stipulate the cause.** We define the generation of the figure. Because we define that a circle is generated by a point moving at a fixed distance from a center, we know the properties of the circle with absolute certainty. We made it; we know how it was made.

  However, this "making" must be physically intelligible. If a line were a width-less abstraction, we could not conceive of its "motion" or "generation." By making lines "thin bodies" and geometry the study of **quantity generated by motion**, Hobbes ensures that geometric reasoning remains grounded in the only reality he accepts: bodies in motion.

  So, the materialism is not just a side note; it is the **ontological precondition** that allows geometry to be a model of scientific reasoning. If geometry were about Platonic abstractions, it would be disconnected from the physical world and useless for his general science of bodies.

  ### 2. The Wallis Dispute: More Than Ego
  This explains the bitterness of the dispute with John Wallis. To the modern observer, Hobbes looks like a stubborn amateur embarrassed by professional mathematicians. But from Hobbes's perspective, Wallis represented a dangerous philosophical error.

  Wallis and the rising generation of analysts were moving toward algebraic symbolism and abstract infinitesimals. They were comfortable treating mathematical objects as symbolic abstractions that didn't need to correspond to physical magnitude.
  *   **Wallis's View:** Mathematics is a realm of abstract relations.
  *   **Hobbes's View:** Mathematics is the study of physical magnitude and motion.

  When Wallis criticized Hobbes's squaring of the circle, Hobbes didn't just hear a mathematical correction; he heard a category error. He believed Wallis was engaging in "word games" detached from reality. Hobbes's insistence that his solution was correct stemmed from his conviction that his **physical intuition** about magnitude was superior to Wallis's **symbolic manipulation**.

  If Hobbes conceded to Wallis, he would have to concede that mathematical objects *can* be non-material abstractions. If he conceded that, the link between Geometry and Physics (both being sciences of body) would break. His entire philosophical system, which relies on geometry as the method for understanding physical causality, would be compromised. He couldn't concede because the stakes were ontological, not just arithmetical.

  ### 3. Extending the Method to Politics
  Does this same reasoning explain his political ambition? **Yes, explicitly.**

  Hobbes divides his philosophy into three parts:
  1.  **Matter/Body (*De Corpore*):** General physics and geometry.
  2.  **Man (*De Homine*):** Human nature (psychology/optics).
  3.  **State (*De Cive* / *Leviathan*):** Politics.

  He explicitly states in the preface to *De Cive* that he was the first to lay the foundations of civil philosophy on a scientific footing, comparable to geometry.

  **The Analogy:**
  *   **Geometry:** We define simple elements (points/lines) $\rightarrow$ We understand their motion $\rightarrow$ We construct complex figures (circles/squares) $\rightarrow$ We deduce their properties with certainty.
  *   **Politics:** We define simple elements (Men/Passions) $\rightarrow$ We understand their motion (Endeavour/Desire) $\rightarrow$ We construct a complex figure (The Commonwealth/Leviathan) $\rightarrow$ We deduce its rights and duties with certainty.

  **The Role of Materialism:**
  For this analogy to hold, "Men" must be treatable like geometric bodies. This is where Hobbes's materialist psychology is crucial. He defines human passion not as a spiritual struggle, but as **"endeavour" (*conatus*)**—internal bodily motion toward or away from objects.
  *   Because humans are bodies in motion, their behavior is determined by causal laws (cause and effect of passions).
  *   Because the Sovereign is an "Artificial Man" constructed by covenant, we know its properties just as we know the properties of a constructed geometric figure. We know the rights of the Sovereign because **we defined them in the contract.**

  **The Limit of the Analogy:**
  There is, however, a crucial disanalogy that Hobbes struggles with. In geometry, the matter is passive. In politics, the "matter" (human beings) has its own internal source of motion (will/passion) that can resist the construction.
  *   Geometry is certain because the objects don't talk back.
  *   Politics is *potentially* certain, but only if the construction (the Sovereign power) is strong enough to constrain the internal motion of the human matter.

  Hobbes hopes for political certainty not because humans are predictable, but because the **logic of the construction** is binding. If you agree to the covenant (the definition), you are logically bound to the consequences (obedience), just as a triangle is bound to have 180 degrees.

  ### 4. Synthesis: The Unity of the System
  To answer your specific questions directly:

  **1. Is the materialist reworking of points/lines doing work behind the claim that geometry is certain?**
  Yes. For Hobbes, certainty comes from knowing the **cause of generation**. We can only know the cause of generation if the objects being generated are intelligible. Since only bodies are intelligible, geometric objects must be conceived as bodies (or traces of bodily motion). If they were abstract non-entities, we could not conceive their generation, and thus could not claim causal knowledge of them. Materialism makes geometric construction *conceivable*, which allows it to be *certain*.

  **2. Does this explain why he hoped political philosophy could be as rigorous as geometry?**
  Yes. Hobbes views Civil Philosophy as the second half of a unified "Science of Justice."
  *   **Geometry** is the science of **Quantity** (constructing figures from defined magnitudes).
  *   **Politics** is the science of **Justice** (constructing Commonwealths from defined covenants).

  Both rely on the **Resolutive-Compositive Method**:
  1.  **Resolve** the complex thing into its universal parts (resolve a circle into lines; resolve a state into individuals).
  2.  **Understand** the universal parts (understand motion; understand passion).
  3.  **Compose** the parts back together to understand the whole (construct the figure; construct the Social Contract).

  Because Hobbes believes he has reduced human passion to material motion (*conatus*), he believes he has secured the "universal parts" of politics just as securely as geometry secures the "universal parts" of magnitude. Therefore, the conclusions of politics *ought* to be as demonstrable as the Pythagorean theorem.

  ### Conclusion
  You are right to suspect that the stubbornness with Wallis was not mere vanity. It was a defense of the ontological foundation of his entire system. If Wallis was right that mathematics deals with incorporeal abstractions, then Hobbes's materialism is false. If Hobbes's materialism is false, then his physics is false. If his physics is false, then his account of human passion (as bodily motion) is false. If that is false, then his claim that politics can be a deductive science like geometry collapses.

  Hobbes fought Wallis so bitterly because he was fighting for the possibility of a **Science of Politics.** He needed geometry to be a science of *bodies in motion* so that he could legitimately claim that the State is a *body of men in motion*, constructed by art, and knowable with geometric certainty.
