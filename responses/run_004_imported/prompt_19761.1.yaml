          *   *Crucial nuance:* It's not that materialism *makes* it certain. It's that for geometry to be about *reality* (and thus useful for science), its objects must be bodies. If they were abstract Platonic forms, we couldn't know them through sensation/motion. But if they are constructions of our own making (definitions), we know the cause.
          *   *The Tension:* There is a tension here. If geometry is about mental constructs, why do they need to be bodies? Because for Hobbes, "thinking" is a motion of matter in the head. So even the *idea* of a line is a material motion.
          *   *Conclusion on Q1:* They are deeply connected. His materialism dictates *how* geometry works (via motion/generation), which secures its certainty (we know the cause because we made it).

      *   **Address Question 2 (Politics & Geometry):**
