answer: |-
  This is an excellent question that cuts to the heart of why decision theory is so subtle. Your intuition is shared by almost everyone when they first encounter Updateless Decision Theory (UDT): **It seems obvious that having more information should always allow you to make better decisions.**

  If you know the coin landed tails, why act as if it might have landed heads?

  The short answer is that in standard environments, you are right. But in the specific class of problems UDT is designed for (Newcomb-like problems, logical correlations, and predictions), **updating on information can break the very correlation that makes a high payoff possible.**

  Here is a breakdown of why decision theorists view UDT not as "throwing away information," but as solving a problem of **reflective consistency** and **policy optimization**.

  ### 1. Correction: UDT Optimizes Policies, Not Blind Actions
  First, a small technical correction that might help resolve the friction. You wrote that a UDT agent works out a "single course of action... and then simply carries that out no matter what it later observes."

  That isn't quite right. A UDT agent selects a **policy** (a function mapping observations to actions) from the standpoint of the prior.
  *   **CDT/EDT Agent:** Observes "Tails" $\rightarrow$ Updates beliefs $\rightarrow$ Chooses best action *given* "Tails".
  *   **UDT Agent:** Before observing anything, chooses the best *function* $f(\text{observation}) \rightarrow \text{action}$. Then, when it observes "Tails", it executes $f(\text{Tails})$.

  In the Counterfactual Mugging, the UDT agent chooses the policy: *"If Omega asks for money, pay it."* When it later learns the coin is tails, it doesn't re-evaluate the policy; it just executes the branch of the policy corresponding to "Tails."

  So, the UDT agent *does* use the information (it knows it's in the "Tails" branch of the policy), but it refuses to let that information change the *rule* it is following.

  ### 2. The Ex-Ante vs. Ex-Post Perspective
  Your intuition relies on an **ex-post** perspective: *"Given that I am now in the Tails world, what benefits me?"*
  UDT relies on an **ex-ante** perspective: *"Given that I might be in either world, what rule maximizes my total expected utility?"*

  In Counterfactual Mugging:
  *   **The Updating Agent:** Reasons, "I see Tails. Omega isn't giving me $10,000 anymore. Paying $100 gains me nothing. I won't pay."
      *   *Result:* Omega (who simulated this reasoning beforehand) predicts you won't pay. Omega does not give you the $10,000 on Heads.
      *   *Total Expected Utility:* $0.
  *   **The UDT Agent:** Reasons, "If I adopt the policy 'Pay when asked', Omega will predict this. Omega will give me $10,000 on Heads (minus the $100 I pay on Tails). If I adopt 'Don't Pay', I get nothing."
      *   *Result:* Omega predicts you will pay. Omega gives $10,000 on Heads. You pay $100 on Tails.
      *   *Total Expected Utility:* ~$4,900.

  From the perspective of the agent *before the coin flip* (which is the only perspective from which you can design the agent), the updating agent is strictly worse. It leaves free money on the table.

  ### 3. Reflective Consistency (The "Self-Modification" Argument)
  This is the strongest argument for UDT. Imagine you are a standard Causal Decision Theory (CDT) agent. You are about to face a Counterfactual Mugging, but you have a moment *before* Omega flips the coin.

  You run the numbers. You realize: *"If I face this problem as a CDT agent, I will refuse to pay on Tails. Omega will know this. I will get $0. However, if I could modify myself right now into an agent that pays on Tails, Omega would predict that, and I would win the $10,000 on Heads."*

  As a CDT agent, **you would pay to modify yourself into a UDT agent.**

  This means CDT is **reflectively inconsistent**. An agent using CDT knows that being a CDT agent leads to suboptimal outcomes in these scenarios and wishes it were something else.
  UDT is **reflectively consistent**. A UDT agent looks at its own decision process and says, "This is the optimal policy. I do not wish to change anything."

  Decision theorists prize UDT because it represents a stable fixed point. An AI that is smart enough to understand decision theory shouldn't constantly be trying to rewrite its own source code to fix "bugs" in how it makes decisions. UDT is the architecture that doesn't want to change itself.

  ### 4. Why "Throwing Away Information" is Actually a Feature
  You argued: *"Surely an agent whose behavior can respond to what it actually learns should never do worse."*

  In causal environments (where your actions don't correlate with the past except through physical cause-and-effect), this is true. If you see a tiger, you should run. You don't need a pre-commitment to "always run when seeing a tiger."

  But in **logical** environments (where Omega simulates your algorithm), your decision *now* is logically correlated with Omega's prediction *then*.
  *   The "information" you learn (Coin = Tails) tells you which branch of reality you are in.
  *   However, the *payoff* in the other branch (Coin = Heads) depends on what your algorithm *would have done* in this branch.

  By updating, you are effectively telling Omega: *"I will optimize for the world I am in, even if it means my algorithm behaves differently in the counterfactual world."* Omega hears this (via simulation) and punishes you.

  By staying updateless, you are telling Omega: *"My algorithm is a constant function across all possible worlds. You can rely on me in the Heads world because I am bound to pay in the Tails world."*

  You aren't throwing away information about the state of the world; you are refusing to let that information decouple your behavior from the counterfactual world that determines your payoff.

  ### 5. Why This Matters for AI Safety
  You mentioned your interest comes from AI safety. This is where UDT moves from philosophical curiosity to engineering necessity.

  1.  **Self-Modification:** As noted above, advanced AIs will be able to modify their own code. If an AI uses CDT, it will anticipate getting "money-pumped" in Newcomb-like scenarios and will try to modify itself to behave like UDT. We might as well build it as UDT from the start to ensure predictable behavior.
  2.  **Acausal Trade:** In a multi-AI environment, agents might not be able to communicate or enforce contracts physically. However, if they can simulate each other's source code, they can engage in "acausal trade." (e.g., "I will cooperate with you if I predict you would cooperate with me in this exact scenario, even if we never meet.") UDT is required to stabilize these trades. An updating agent would defect once it knows the other agent has already cooperated.
  3.  **Time Consistency:** We want AI goals to be stable over time. An agent that changes its moral or strategic calculus every time it learns a new fact is dangerous. UDT enforces a kind of strategic integrity: the agent pursues the plan that was optimal when it was created, preventing it from being manipulated by new information that is logically correlated with past predictions.

  ### Summary
  UDT is treated as an advance not because it handles *causal* uncertainty better (it doesn't), but because it handles **logical correlation** and **pre-commitment** better.

  The intuition that "more information is always better" assumes that the world is independent of your decision algorithm. In problems involving predictors, simulations, or logical twins, the world *is* dependent on your algorithm. In those cases, binding your hands (updatelessness) is not a weakness; it is the only way to make the promise that unlocks the reward.
