      *   Okay, I will recommend **Option 1 (Fold it in)** but frame it as a **Multi-Objective Optimization** rather than a simple sum, to mitigate the "tanking" risk.

  7.  **Finalizing the Memo Structure:**
      *   **To:** Responsible Recommendations Working Group
      *   **From:** [My Name], Backend Engineering
      *   **Subject:** Recommendation: Integrating Satisfaction Signals into Objective Function
      *   **Bottom Line Up Front:** Adopt a multi-objective function.
