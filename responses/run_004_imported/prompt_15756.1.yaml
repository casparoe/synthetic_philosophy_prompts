answer: |-
  **TO:** Responsible Recommendations Working Group
  **FROM:** [Your Name], Backend Engineering
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation: Integrating Satisfaction Signals into Objective Function (Pre-Read for 10/30 Meeting)

  ### Bottom Line Up Front
  I recommend we **vote to fold the post-session satisfaction score into the recommender's objective function** as a secondary optimization target, rather than keeping it as a dashboard-only metric or swapping it in entirely.

  We should implement this as a **constrained optimization problem**: maximize watch-time *subject to* a minimum threshold of user-reported satisfaction. This aligns with our ML Principles doc ("genuine long-term user value") without blindly discarding the strongest signal we have (engagement).

  Below is the technical rationale, a steelmanning of the opposing view, and a proposed rollout plan.

  ---

  ### 1. The Argument for Pure Revealed Preference (Steelman)
  The Recsys team's position is technically sound and historically grounded. In economics and ML, "revealed preference" argues that actions are higher-fidelity signals than speech.
  *   **Costly Signals:** Watching a video for 45 seconds costs the user time and attention. Clicking a survey button costs nothing. In signal processing terms, watch-time has a higher "cost to fake."
  *   **Noise & Gameability:** Self-reported satisfaction is notoriously noisy. It's mood-dependent, subject to recency bias (the last video watched colors the whole session), and prone to social desirability bias (users reporting what they think they *should* feel).
  *   **The Definition of Utility:** If we define utility strictly as "what the user chooses to consume," then watch-time *is* utility. Optimizing for anything else is imposing an external value judgment on what users "should" want.

  If we were building a search engine or a marketplace, I would agree with the Recsys team 100%. In those contexts, choice consistency is high, and regret is low.

  ### 2. Why That Model Fails Here
  The UX research data indicates a specific failure mode in our current environment: **the divergence of Decision Utility vs. Experienced Utility.**

  Revealed preference assumes stable preferences. However, our UX data suggests a "regret loop" common in infinite-scroll media: users enter a state where their immediate impulse (scroll) conflicts with their reflective preference (stop).
  *   **The Churn Risk:** If we optimize purely for session length, we are effectively arbitraging the gap between what users want *in the moment* and what they want *after the session*. This works until it doesn't. When the "post-session regret" signal gets too loud, users don't just reduce session time; they delete the app.
  *   **Proxy Decay:** Watch-time is a proxy for value. When a proxy becomes the target, it ceases to be a good measure (Goodhart's Law). We are seeing evidence that watch-time is decoupling from retention among our heaviest cohort.
  *   **The "Sad TikTok" Reality:** We are not a utility. We are a leisure product. If the leisure feels like labor or leaves users depleted, the product value degrades. Ignoring the satisfaction signal is technically ignoring a leading indicator of LTV (Lifetime Value) collapse.

  ### 3. Technical Proposal: Constrained Optimization
  We should not simply add satisfaction to the loss function as a weighted sum (e.g., `Loss = 0.7*WatchTime + 0.3*Satisfaction`). This makes the trade-off arbitrary and hard to tune.

  Instead, I propose we treat Satisfaction as a **constraint**:
  1.  **Primary Objective:** Maximize predicted watch-time/session length.
  2.  **Constraint:** Predicted satisfaction score must remain above threshold $T$ (derived from the UX baseline).
  3.  **Fallback:** If no items satisfy threshold $T$, serve "high-satisfaction" content (even if lower engagement) to reset the user state.

  **Why this works:**
  *   It respects revealed preference (we still maximize engagement) as long as it doesn't cross the "regret" boundary.
  *   It operationalizes "long-term user value" without requiring us to define "value" philosophically. We define it as "engagement that doesn't drive the user away."
  *   It handles survey noise by aggregating scores at the *user-week* level, not the *session* level, smoothing out the mood-dependent noise the Recsys team is worried about.

  ### 4. Rollout Plan & Timeframe
  This is not a flip-the-switch change. It requires pipeline updates and careful A/B testing.

  *   **Phase 1: Data Pipeline (Weeks 1-4)**
      *   Ingest UX survey data into the training feature store.
      *   Build the aggregated "User-Week Satisfaction" metric to reduce noise.
      *   *Deliverable:* Dataset ready for offline training.
  *   **Phase 2: Offline Evaluation (Weeks 5-8)**
      *   Retrain models with the constrained objective.
      *   Simulate historical traffic to estimate the "cost" in watch-time vs. gain in satisfaction.
      *   *Deliverable:* Impact report quantifying the trade-off (e.g., "We expect a 3% drop in session length for a 10% increase in satisfaction score").
  *   **Phase 3: Shadow Mode / A/B Test (Weeks 9-14)**
      *   Deploy to 1% of traffic.
      *   Monitor not just engagement, but **Day-7 and Day-30 Retention**. This is the critical metric. If the hypothesis holds, the "satisfaction-aware" group should retain better, even if they watch less per session.
      *   *Deliverable:* Go/No-Go decision for full rollout.
  *   **Phase 4: Full Rollout (Week 15+)**
      *   Gradual expansion to 10%, 50%, 100%.

  ### 5. Decision Required for Wednesday
  To proceed with Phase 1, we need the Working Group to vote on the **Principle of Integration**.

  *   **Vote YES:** We acknowledge that satisfaction data is a valid component of the reward signal, despite noise, and authorize Engineering to build the pipeline for Phase 1.
  *   **Vote NO:** We maintain that watch-time is the sole proxy for value. Satisfaction metrics remain dashboard-only for monitoring, with no feedback loop into the model.

  **My Ask:**
  I am asking for a **YES** vote. Keeping satisfaction on a dashboard (Option 3) renders this Working Group decorative. Swapping entirely (Option 2) is business-suicidal. Integrating via constraints (Option 1) is the only engineering-viable path that honors both our data and our principles.

  Please review the attached preliminary schema for the satisfaction feature store before Wednesday.

  Thanks,
  [Your Name]
