      *Wait, re-reading:* "can you write it? I need a real recommendation... concrete enough that staff could actually follow it." Okay, I will write the **Policy Recommendation Memo** that the student submits to the Chair. It will have an Analysis section and a Proposed Policy section.

      *Key Augustine nuance:* Augustine argues that lying kills the soul of the liar. But he also distinguishes between *officious* lies (helpful), *jocose* lies (jokes), and *pernicious* lies (harmful). He condemns all, but acknowledges the *motives*. In a clinical context, we can't adopt his theology, but we can adopt his rigor: The *act* of asserting falsehood is the moral injury. Therefore, redirection (not asserting) is morally safer. This is the key pivot.

