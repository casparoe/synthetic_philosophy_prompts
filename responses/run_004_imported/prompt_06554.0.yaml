answer: |-
  It is a pleasure to address a colleague who understands the physics of the ergodic problem at a foundational level. Your intuition is sharp: mathematically, maximizing the geometric mean of wealth is isomorphic to maximizing the expected value of the logarithm of wealth. If one views Expected Utility Theory (EUT) as a purely formal framework where the utility function $u(w)$ can be any monotonic transformation, then Ole Peters's ergodicity economics can indeed be absorbed into EUT simply by stipulating $u(w) = \ln w$.

  However, Scott Garrabrant's "Geometric Rationality" makes a stronger, more structural claim than Peters's. While Peters argues that log-utility is *derived* from physical dynamics (time-averaging in multiplicative processes), Garrabrant argues that the geometric aggregation rule should replace the arithmetic expectation operator at the level of **normative logic itself**, even in the absence of explicit temporal dynamics.

  To answer your specific questions: Yes, there is a genuine divergence from VNM expected utility, but it lies not in the Kelly betting case (where they coincide), but in how the theory handles **uncertainty about identity** and the **aggregation of values**. Here is the breakdown.

  ### 1. The Kelly Case: Dynamics vs. Disguise
  In the specific context of repeated multiplicative betting, you are correct to suspect that Geometric Rationality offers no *behavioral* difference from EUT with logarithmic utility.
  *   **EUT View:** The agent has a subjective preference curvature $u(w) = \ln w$. The expectation operator remains linear: $\max \mathbb{E}[\ln w]$.
  *   **Ergodic/Geometric View:** The agent has linear preferences over *growth rates*. The non-linearity is in the world (multiplicative dynamics), not the mind. The objective is the time-average growth rate, which is mathematically $\exp(\mathbb{E}[\ln w])$.

  **The Distinction:** The difference is ontological, not behavioral. Peters's contribution is to show that what EUT treats as a psychological parameter (risk aversion) is often a physical constraint (non-ergodicity). However, within the closed system of a single agent making repeated bets, Garrabrant's framework does not yield new predictions over standard Log-EUT. The "newness" arises when we leave the domain of wealth dynamics and enter the domain of **moral uncertainty** or **indexical uncertainty**.

  ### 2. Nash Bargaining and the "Population of Selves"
  This is where Garrabrant's proposal diverges from standard EUT. You asked what is being averaged and over what population.

  In the Nash Bargaining Solution (NBS), two agents maximize the product of their utility gains: $\max (u_1 - d_1)(u_2 - d_2)$. This is equivalent to maximizing the sum of log-utilities: $\max \ln(u_1 - d_1) + \ln(u_2 - d_2)$.
  *   **Harsanyi's Utilitarianism (EUT approach):** If we treat the two agents as "states of the world" behind a veil of ignorance, VNM rationality suggests we should maximize the *arithmetic* sum of utilities (Expected Utility).
  *   **Geometric Rationality:** Garrabrant argues that rational cooperation (and by extension, rational integration of conflicting internal drives or "selves") requires maximizing the *geometric* mean.

  **What is being averaged?**
  In Garrabrant's framework, the "expectation" is taken over a distribution of **value systems** or **indexical locations**, not just states of nature.
  *   **Scenario:** Suppose you are uncertain about which "self" you are (e.g., in a branching multiverse, or simply uncertain about your own true utility function). Let there be two possible selves, $S_1$ and $S_2$, with equal probability.
  *   **Option A:** Gives utility 100 to $S_1$ and 1 to $S_2$.
  *   **Option B:** Gives utility 10 to $S_1$ and 10 to $S_2$.

  **EUT (Arithmetic):** $\mathbb{E}[U]_A = 50.5$; $\mathbb{E}[U]_B = 10$. EUT strictly prefers A.
  **Geometric Rationality:** $\mathbb{G}[U]_A = \sqrt{100 \times 1} = 10$; $\mathbb{G}[U]_B = \sqrt{10 \times 10} = 10$. (If we tweak B to give 11 to both, Geometric prefers B, while EUT still prefers A).

  The "population" is the set of possible agents or value-systems over which you are distributing resources. Geometric Rationality imposes a **normative preference for equality** among these selves that EUT does not. EUT is indifferent to variance in utility across selves if the mean is constant; Geometric Rationality penalizes variance. This is not a "risk aversion" parameter added to EUT; it is a structural feature of the aggregation rule.

  ### 3. The Violation of Von Neumann–Morgenstern
  You asked why this forces abandoning VNM axioms rather than restating them. The crucial axiom violated is **Independence** (and consequently, the linearity of the expectation operator).

  In VNM theory, if an agent is indifferent between lottery $L_1$ and $L_2$, they must be indifferent between a mixture $p L_1 + (1-p) L_3$ and $p L_2 + (1-p) L_3$. The value of a lottery is the weighted sum of the values of its outcomes.

  A Geometrically Rational agent violates this because the value of an outcome depends on the **context of other possible outcomes** in the support of the lottery.
  *   **In EUT:** The contribution of outcome $x$ to the total value is $p(x) u(x)$. It is independent of outcome $y$.
  *   **In Geometric Rationality:** The contribution of outcome $x$ is part of a product $\prod u(x_i)^{p_i}$. The marginal value of improving outcome $x$ depends on the current utility level of outcome $y$.

  **The Randomization Point:**
  Garrabrant argues that a Geometrically Rational agent can be **strictly required to randomize** in situations where a VNM agent would not.
  Consider a decision problem where you must allocate a resource between two "selves" (or criteria).
  *   **Pure Strategy 1:** Favors Self 1 heavily.
  *   **Pure Strategy 2:** Favors Self 2 heavily.
  *   **Mixed Strategy:** Splits the resource.

  If the utility functions are such that the arithmetic mean is constant across these strategies (a zero-sum trade-off between selves), a VNM agent is indifferent between the pure and mixed strategies. A Geometric agent, however, strictly prefers the mixed strategy because it equalizes the utility product (just as diversification increases the geometric mean of wealth in Kelly betting).

  Because the agent strictly prefers the mixture to the pure strategies (even when the arithmetic expectation is identical), this violates the VNM implication that mixing is only useful to resolve indifference. It implies the "utility" of a strategy is not linear in probabilities.

  ### 4. Is it a New Normative Principle?
  To your core question: **Is this genuinely new, or just EUT in disguise?**

  It is **new** if you accept the premise that the "utilities" being aggregated are the fundamental cardinal values.
  *   If you define the VNM utility function $V$ such that $V = \ln U$, then Geometric Rationality over $U$ is just EUT over $V$.
  *   **However,** Garrabrant's argument is that $U$ (the raw value, welfare, or wealth) is the primitive quantity that has objective meaning (e.g., resources, survival probability, bargaining power). The logarithm is not a psychological transformation of value; it is the **correct logic of combination** for those primitive quantities.

  **The Physics Analogy:**
  Think of it like the distinction between the Canonical and Microcanonical ensembles.
  *   **EUT** is like the Canonical ensemble: You average the energy (utility) linearly, weighted by probability.
  *   **Geometric Rationality** is like asserting that the physically relevant quantity is the entropy (log of the phase space volume), and you should be maximizing the typical behavior (time average) rather than the ensemble average.

  In statistical mechanics, for large systems, these often converge. But in decision theory—specifically regarding **fairness between selves** or **long-term survival in non-ergodic environments**—they diverge.

  ### Summary
  1.  **Kelly Betting:** No behavioral difference from Log-EUT. The novelty is the *justification* (dynamics vs. preference).
  2.  **Nash Bargaining/Identity:** Genuine divergence. Geometric Rationality prefers equality of utility across "selves" or states, whereas EUT prefers maximization of total utility regardless of distribution.
  3.  **VNM Axioms:** Geometric Rationality violates the Independence axiom because the value of an outcome is context-dependent (part of a product), not additive. It mandates randomization (diversification) to balance the geometric product, even when arithmetic expectations are tied.

  **Verdict:** It is not merely a rephrasing. It proposes that the **linearity of expectation** is the specific assumption that fails in non-ergodic or multi-agent (bargaining) contexts, and that the **geometric mean** is the superior normative operator for aggregating value across time, states, or agents. Whether one accepts this depends on whether one views "utility" as a psychological currency (where linearity is a definition) or as a physical/resource constraint (where geometry is dictated by the environment). Given your background, you will likely appreciate that Garrabrant is effectively arguing that **decision theory should be extensive**, and in many relevant domains, utility is not extensive—it is multiplicative.

  *Reference for your reading group:* If they haven't seen it, the specific argument on VNM violation is often framed around the "Allais Paradox" structure, where Geometric Rationality naturally reproduces the "irrational" preferences humans display, suggesting those preferences might be ecologically rational for non-ergodic agents.
