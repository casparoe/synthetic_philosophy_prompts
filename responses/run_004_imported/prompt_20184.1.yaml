answer: |-
  This is a fantastic intuition you've stumbled onto. You have essentially recreated a classic problem in philosophy without needing the jargon. Your gut is telling you that not all "truths" are transferred the same way.

  To answer your question, we need to break down *what* is actually being transferred when your mate speaks to you. Is it a fact? Is it an experience? Or is it a command?

  Here is the step-by-step walkthrough of why the suspicion regarding art (aesthetic testimony) holds up better than the suspicion regarding morality (moral testimony).

  ### 1. The Baseline: The Bridge (Factual Testimony)
  Let's start with the one that feels easy: "The North Bridge is shut."
  *   **The Claim:** This is a descriptive fact about the physical world.
  *   **The Transfer:** Your friend has seen the barrier; you trust their eyes.
  *   **Why it works:** The state of the bridge is independent of you. Whether you look at it or not, it is shut. Your personal experience adds nothing to the truth of the claim.
  *   **Verdict:** Zero suspicion needed. This is pure information transfer.

  ### 2. The Art Case: The Painting (Aesthetic Testimony)
  Now, the one that makes you feel fake: "That painting is stunning."
  *   **The Claim:** This looks like a fact ("It is stunning"), but it's actually a report on an *internal experience*.
  *   **The Suspicion:** Why does repeating this feel hollow?
      *   **Argument A: The Experience Gap.** To call a painting "stunning" is to say, "This object caused a specific emotional reaction in me." If you haven't seen it, you haven't had the reaction. By saying "It's stunning," you are claiming to have an experience you didn't have. You are lying about your own internal state.
      *   **Argument B: The "Why" Matters.** In art, the judgment is inseparable from the reasons. If your friend says it's stunning because of the brushwork, but you don't see the brushwork, you don't actually understand *why* it's stunning. You have the conclusion without the evidence.
      *   **Argument C: Autonomy.** We value aesthetic autonomy. We think part of being a cultured person is developing your own taste. Outsourcing this feels like cheating on a test you were supposed to take to learn something about yourself.

  **The Verdict on Art:** The suspicion here is very strong. In aesthetics, the *feeling* is the evidence. If you don't have the feeling, you don't have the evidence. Therefore, you can't truly hold the opinion.

  ### 3. The Moral Case: Factory Farming (Moral Testimony)
  Now, the tricky one: "Factory farming is wrong."
  *   **The Claim:** This is a normative judgment. It's not just describing the world (like the bridge); it's evaluating it (like the painting).
  *   **The Suspicion:** Why might we be suspicious here?
      *   **Argument A: Moral Laziness.** Similar to art, there is a worry that if you just accept moral truths from others, you aren't developing your own moral compass. If everyone around you was racist, and you just took their word for it, you'd be racist. We want you to be moral because *you understand why*, not because you obey.
      *   **Argument B: Emotional Engagement.** Some philosophers argue that to truly believe something is "wrong," you need to feel indignation or empathy. If you just repeat your friend's view without feeling the weight of it, your moral belief is shallow.

  *   **The Counter-Argument (Why it feels okay to you):**
      *   **Argument C: Reasoning is Transferable.** Unlike the "feeling" of art, morality is often based on logic and facts (e.g., "Animals suffer," "Suffering is bad"). Your friend can explain the *reasons* to you. You can understand the logic of suffering without needing to have a spiritual epiphany.
      *   **Argument D: Action Over Feeling.** In morality, the most important thing is often *what you do*. If you stop buying factory-farmed meat because your friend told you to, the animals still benefit. In art, if you don't look at the painting, nothing is gained. The outcome of moral testimony is real-world change; the outcome of aesthetic testimony is just... words.

  ### 4. The Showdown: Which Suspicion Holds Up Better?

  So, we have two cases where "taking someone's word" feels risky. Which reason for suspicion is stronger?

  **The Aesthetic Suspicion is Stronger.** Here is the reasoning why:

  **1. The Nature of the Evidence**
  *   **In Art:** The evidence is *subjective experience*. I cannot know the painting is stunning without the visual input hitting my retina and my brain processing it. Testimony cannot transmit a visual experience. It is literally impossible to verify the claim without the first-person encounter.
  *   **In Morality:** The evidence is often *objective harm or logical consistency*. I can understand that "causing unnecessary pain is bad" through reasoning. I don't need to personally witness the slaughterhouse to understand the logic of the argument against it. Testimony *can* transmit reasons and logic.

  **2. The Cost of Being Wrong**
  *   **In Art:** If you repeat "it's stunning" and you haven't seen it, you are essentially engaging in a kind of social pretense. The "harm" is to your own integrity or authenticity.
  *   **In Morality:** If you repeat "factory farming is wrong" and act on it, you are aligning yourself with a principle that affects well-being. Even if you didn't "earn" the insight emotionally, the moral truth (if it is true) stands on its own merits regarding suffering.

  **3. The "Category Error"**
  *   **In Art:** Saying "That is stunning" without seeing it is almost a category error. "Stunning" describes a relationship between a viewer and an object. No viewer? No relationship. The statement is empty.
  *   **In Morality:** Saying "That is wrong" describes a property of an action. The action can be wrong regardless of whether you have an emotional reaction to it. The statement has content even if your emotional engagement is low.

  ### Conclusion

  Your intuition is correct, and the philosophical reasoning backs you up.

  The argument against **Aesthetic Testimony** holds up better. It is fundamentally suspicious because aesthetic judgments are reports on *your own sensory and emotional experience*. To adopt one secondhand is to claim an experience you didn't have. It is "fake" because the *feeling* is the point.

  The argument against **Moral Testimony** is weaker. While we should be careful about moral laziness, moral truths often rely on reasoning about harm and rights, which *can* be communicated secondhand. You can "own" a moral conclusion by understanding the logic behind it, even if your friend pointed it out first.

  **The Rule of Thumb:**
  *   If the judgment is about **how the world is** (The bridge) or **how we should act** (Factory farming), testimony is usually fine.
  *   If the judgment is about **how the world feels to you** (The painting), testimony is inherently hollow. You can't borrow someone else's eyes.
