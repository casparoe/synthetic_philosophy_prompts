      *   *Nuance:* The user asks about "what goes wrong." I need to highlight that if you define the restriction as "conditionalization," you presuppose the agent knows *which* evidence they will get. But often the point of Reflection is to handle cases where you don't know exactly what you'll learn, just that you'll learn something.
      *   *Literature Check:* Mention Briggs (2009), Christensen (1991), Talbott (1991), and maybe Arntzenius. Van Fraassen's own later retreats are relevant.
      *   *The "Question-Begging" aspect:* If I say "Defer to future self if rational," I need a criterion for rationality that doesn't just say "Defer to future self." If the criterion is "Conditionalizes," we are back to redundancy. If the criterion is "Synchronic coherence," that's not enough (a drunk can be coherent).
