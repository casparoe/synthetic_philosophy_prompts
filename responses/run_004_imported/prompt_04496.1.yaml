          *   Refine the argument: The problem isn't that "submerged" is meaningless, but that its *assertibility conditions* are essentially psychological (anxiety) rather than factual (demographics/culture). If the condition is "when people *feel* submerged," then the right is indeed just a codification of anxiety. If the condition is objective (e.g., "when native language speakers < 50%"), Dummett doesn't specify it.
          *   Suggestion: Frame it as a failure of *normative precision* rather than semantic meaninglessness. The "right" lacks decision procedures.
      *   **Section 3: The Political/Philosophical Intersection.** Connect the friend's political objection with the user's philosophical one. The "view from nowhere" problem. Dummett adopts the host nation's perspective implicitly.
      *   **Conclusion:** Encouragement. The argument holds water but needs precision on the vagueness point to avoid a easy rebuttal.

  6.  **Refining the Advice (Self-Correction during drafting):**
