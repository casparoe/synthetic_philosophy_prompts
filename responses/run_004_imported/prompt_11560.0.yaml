answer: |-
  This is one of the sharpest questions you can ask in this seminar. You have hit on exactly the pressure point where the Argument from Vagueness (AfV) does the most heavy lifting, and frankly, where a lot of philosophers think Lewis and Sider (the main proponents of this argument) might be bluffing.

  To answer your specific question: **Yes, there is a logical bridge being built there, but it relies heavily on a specific conception of what "existence" is.**

  Here is the gut-level breakdown of why the move from "Vague Composition" to "Vague Existence" is made, why it's considered fatal, and whether it's just an intuition pump.

  ### 1. The Bridge: Why Vague Composition = Vague Existence
  You asked: *Why can't we say it's indeterminate whether the xs compose a y while still holding that whatever does exist, determinately exists?*

  The problem is that in this context, **composition just is existence.**

  If you have some atoms ($xs$) arranged chairwise, there are two ontological options:
  1.  **Composition occurs:** There are the atoms *plus* a chair. (Total count: $n + 1$)
  2.  **Composition fails:** There are just the atoms. (Total count: $n$)

  If you say "It is vague whether composition occurs," you are saying "It is vague whether we are in scenario 1 or scenario 2."
  *   If scenario 1 is the case, the chair **exists**.
  *   If scenario 2 is the case, the chair **does not exist**.

  Therefore, if it is vague whether composition occurs, **it is vague whether the chair exists.**

  You cannot separate the two. To say "The composition is vague but existence is precise" would require a third option where the chair *determinately exists* but *vaguely composes* the atoms, which makes no sense. Composition is the relation that brings the new object into existence. If the relation is vague, the existence of the relatum (the whole) is vague.

  ### 2. The Fatal Move: Why Vague Existence is Worse than Vague Baldness
  This is the core of your confusion. Why is "vague existence" a metaphysical disaster, while "vague baldness" is fine?

  **Vague Baldness is Semantic (De Dicto):**
  When we say "Bob is borderline bald," we don't mean reality is fuzzy. We mean our *word* "bald" is fuzzy.
  *   **The World:** Determinately has Bob with exactly 5,432 hairs.
  *   **The Language:** The term "bald" doesn't have a sharp cutoff.
  *   **The Fix:** We can precisify the language without changing the world.

  **Vague Existence is Ontic (De Re):**
  If composition is vague, Lewis and Sider argue the vagueness cannot be in our language. Why? Because we can stipulate precise terms.
  *   Imagine we define a word *"schmair"*: "An object is a *schmair* iff it is composed of exactly these atoms bonded with at least 50.000% strength."
  *   In a Sorites series of bonding strength, there will be a case where it is vague whether the bonding is 50.000% or 49.999%.
  *   If restricted composition is true, it is now vague whether a *schmair* exists.
  *   Since we defined *schmair* precisely, the vagueness isn't in the word. **The vagueness must be in the world.**

  **The Gut-Level Problem:**
  Lewis argues that existence is not a property like "bald" or "tall." It is the **precondition** for having properties.
  *   If it is vague whether Bob is bald, Bob exists determinately, and we just don't know how to describe his hair.
  *   If it is vague whether the *chair* exists, then reality itself hasn't "decided" if there is a chair there.
  *   Lewis's intuition: **Reality is precise.** The world doesn't hem and haw about whether to contain an object. Either the object is there, or it isn't. For reality itself to be indeterminate is category-error nonsense.

  ### 3. The Logical "Proof": The Evans Argument
  It's not *just* an intuition pump. There is a famous logical argument by Gareth Evans (1978) that tries to prove vague existence is impossible.

  The argument roughly goes like this:
  1.  If existence is vague, then **identity** must be vague. (If it's vague whether object $X$ exists, it's vague whether $X$ is identical to the sum of the $xs$).
  2.  But vague identity is logically incoherent.
      *   Let $a$ be an object that determinately exists.
      *   Let $b$ be an object that vaguely exists.
      *   Is $a = b$?
      *   $a$ has the property: "Determinately identical to $a$."
      *   If $a = b$, then $b$ must also have that property.
      *   But $b$ is *vaguely* identical to $a$, so it *lacks* the property of being determinately identical to $a$.
      *   Therefore, by Leibniz's Law (indiscernibility of identicals), $a \neq b$.
      *   But if they aren't identical, then $b$ doesn't exist (since $b$ was supposed to be the vague version of $a$).
  3.  Therefore, vague identity (and thus vague existence) is impossible.

  Many philosophers think Evans's proof is question-begging, but it gives the AfV a logical veneer rather than just being a mood.

  ### 4. Is it just a Brute Intuition Pump?
  **Honest answer:** Yes, largely.

  The claim that "Ontic Vagueness is Impossible" is a fundamental metaphysical commitment of Lewisian modal realism and classical extensional mereology. It is not a proven fact.

  *   **The Pushback:** Philosophers like Elizabeth Barnes and Robert Williams have recently argued that **ontic vagueness is coherent.** They argue that reality *could* be fuzzy without logic breaking down.
  *   **Van Inwagen's Own View:** Interestingly, Van Inwagen (whose SCQ you are studying) **rejects the Argument from Vagueness.** He thinks the AfV proves too much. He accepts that there might be vague existence (or at least, he thinks the argument against it fails) because he believes life is the cutoff for composition, and "life" is vague. He bites the bullet that the AfV says is fatal.

  ### Summary for your Seminar
  If you want to nail this in discussion:

  1.  **Acknowledge the link:** Vague composition entails vague existence because composition is the condition for the existence of the whole. If the condition is vague, the existence is vague.
  2.  **Identify the burden:** The AfV relies on the premise that **ontic vagueness is impossible.**
  3.  **Challenge the premise:** Ask why existence must be precise. Is it because of the Evans argument (which is contested)? Or is it just a Lewisian preference for a "clean" ontology?
  4.  **The "Counting" Intuition:** The strongest gut-level reason is counting. If existence is vague, you cannot say how many objects are in a room. If logic requires precise numbers, and the world can't give you one, then the world is logically defective.

  **The Verdict:** You are right to feel that "Vague Existence is Impossible" is doing massive load-bearing work. It is the axiom that drives the whole argument. If you deny that axiom (like Van Inwagen or Markosian do), the Argument from Vagueness collapses. The debate isn't about the Sorites; it's about whether reality is allowed to be fuzzy.
