answer: |-
  This is a fantastic case. It's messy enough to resist easy categorization but structured enough to isolate specific variables (temporal distance, repentance, transparency, ongoing vs. past violation). It cuts right to the heart of the "commitment condition" vs. "equality condition" debates in the standing literature (think Bell, Fritz, Wallace, etc.).

  Here is the blow-by-blow analysis of the dialectic, assessing who lands the better philosophical punch at each stage, followed by the considerations both are missing.

  ### The Blow-by-Blow

  **Move (1) Nadia:** *Hypocrisy is strict equality. If you did it, you can't judge it.*
  *   **Analysis:** Nadia is appealing to the "Clean Hands" intuition. This is the strongest folk-morality view of standing: authority requires innocence. If standing is a normative power to hold others accountable, Nadia argues that power is forfeited by violating the norm yourself.
  *   **Verdict:** **Nadia wins the intuitive round, but loses the theoretical ground.** Her principle is too broad. If accepted, it would imply that reformed addicts can't warn active addicts, or that parents who smoked can't tell kids not to smoke. It conflates *standing to blame* with *moral perfection*. However, she successfully sets the burden of proof: Theo has to explain why *this* past violation doesn't count.

  **Move (2) Theo:** *Distinction between past (resolved) and present (ongoing). Repentance restores standing.*
  *   **Analysis:** Theo introduces the **Commitment Condition**. On this view (championed by philosophers like Macalester Bell), hypocrisy isn't about having violated a norm; it's about *disavowing* the norm's authority over you while asserting it over others. By apologizing and accepting blame in college, Marco reaffirmed the norm's authority. Deniz, by continuing without remorse, is claiming an exception.
  *   **Verdict:** **Theo takes the lead.** He successfully narrows the definition of hypocrisy from "doing the thing" to "claiming an exception." This aligns better with how we actually use blame in practice (we allow reformed wrongdoers to speak). He identifies the relevant difference: *current commitment to the norm.*

  **Move (3) Nadia:** *Apology doesn't erase the benefit/advantage. "Knowing better" makes it worse.*
  *   **Analysis:** Nadia pivots. She stops arguing about *authority* and starts arguing about *equity* and *epistemic position*. She's suggesting that Marco's past gives him an unfair advantage (he got to cheat without current relationship consequences) or that his blame is weighted differently because he's a "knowing" violator. She is challenging the idea that repentance wipes the slate clean for the purposes of *social standing*.
  *   **Verdict:** **Nadia regains ground.** This is a strong objection to the "repentance fixes all" model. Even if Marco accepts the norm now, he arguably occupied a position of superiority while blaming Deniz because he didn't disclose his past *in that moment*. Nadia highlights that standing isn't just internal (what Marco believes); it has social consequences. Theo's model risks being too internalist here.

  **Move (4) Theo:** *Standing vs. Virtue. Owning the past prevents it from being a live exception-claim.*
  *   **Analysis:** Theo correctly identifies a category error in Nadia's Move (3). He distinguishes between *being a good person* (virtue) and *having the standing to blame* (normative power). He argues that as long as Marco isn't currently making an exception for himself, his past moral failures are irrelevant to his *right* to hold Deniz accountable.
  *   **Verdict:** **Theo wins the technical point.** He is philosophically precise here. Standing is generally understood as a distinct normative concept from overall moral worth. A terrible person can still have standing to blame someone for a specific wrong if they respect the norm governing that wrong. Nadia is sliding back toward the "moral perfection" view she started with, just dressed up as "benefit."

  **Move (5) Nadia:** *The Communication/Transparency Objection. Marco blamed "as if" he had clean hands.*
  *   **Analysis:** This is Nadia's checkmate move. She shifts the debate from *whether Marco has standing* to *how Marco exercised it*. Even if Marco *has* standing (internally), did he communicate it in a way that was misleading? If blame is a communicative act (as many theorists argue), presenting oneself as a judge rather than a fellow traveler can be a form of dishonesty. It creates a false hierarchy.
  *   **Verdict:** **Nadia wins the final exchange.** This aligns with recent work on the *expressive* nature of hypocrisy (e.g., Kyle Fritz). If Marco's blame implies "I am not like you," but he *is* like you (just historically), the communication is false. He may have standing *in principle*, but he lacks standing *in this specific interaction* because of the lack of transparency. Theo hasn't answered how the *delivery* of the blame affects its legitimacy.

  ---

  ### What Both Are Missing

  Since you teach this material, you'll spot the gaps, but for the sake of the friends' dispute, here are the three major variables neither Nadia nor Theo fully interrogated:

  **1. The Function of the Blame (Consequentialism vs. Retributivism)**
  Neither asks *why* Marco is blaming Deniz.
  *   **If the goal is punishment/retribution:** Nadia is right. Marco lacks the moral high ground to mete out punishment.
  *   **If the goal is moral reform/protection:** Theo is stronger. Marco's experience might make him *better* equipped to help Deniz stop. A reformed cheater might spot the rationalizations Deniz is using better than a faithful partner would. If Marco's blame is a warning ("I did this, it ruined things, don't do it"), suppressing that history actually weakens the moral force of the warning.
  *   **Missing Move:** Marco might have a *duty* to disclose his past to make his blame effective.

  **2. The "Token" vs. "Type" Distinction**
  They treat "cheating" as a monolith.
  *   Marco cheated in college (likely different stakes, maturity level, relationship duration) vs. Deniz cheating now (adult relationship, repeated).
  *   **Missing Move:** Standing might be sensitive to the *severity* and *context* of the violation. If Marco's college cheating was a drunken one-night stand and Deniz is conducting a year-long emotional affair, the lack of proportionality might undermine Marco's standing more than the mere fact of past cheating. Theo hints at this ("cases aren't parallel"), but doesn't flesh out whether the *type* of cheating matters for standing.

  **3. The Privacy Obligation**
  Nadia assumes Marco *should* have told Deniz. Theo assumes Marco's private remorse is sufficient.
  *   **Missing Move:** Does a blamer owe the blamee a confession of their own sins to maintain standing?
      *   **Yes:** Because blame is a relational dialogue, not a verdict.
      *   **No:** Because Marco's moral history is private property. Forcing confessions as a precondition for standing creates a "mutually assured destruction" pact where no one can ever hold anyone accountable.
      *   **The Sweet Spot:** Perhaps Marco doesn't need to confess the *details*, but he loses standing if he actively *denies* it or creates the *impression* of innocence when asked. Move (5) touches this, but the general principle is unexamined.

  ### Summary for the Classroom (or the Friend Group)

  *   **Theo** wins on the **metaphysics of standing**: You don't need to be sinless to hold others accountable; you just need to respect the norm.
  *   **Nadia** wins on the **pragmatics of communication**: How you deliver the blame matters. Blaming from a concealed position of shared guilt can be manipulative.
  *   **The Synthesis:** Marco likely *has* standing (Theo), but he exercised it poorly (Nadia). He should have framed his blame as "I know how damaging this is because I've done it," rather than "This is beneath you." The former preserves standing through solidarity; the latter invites the hypocrisy charge through superiority.

  It's a great case because it shows that "Standing" isn't a binary switch (On/Off); it's a dimmer switch affected by history, transparency, and intent.
