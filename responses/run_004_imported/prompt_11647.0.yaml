      *   *Constraint:* Imperfect recall. At $X$ or $Y$, the driver doesn't know which one it is. She must use a mixed strategy (probability $p$ of exiting, $1-p$ of continuing) because she can't condition on location.
      *   *Ex Ante Calculation:*
          *   Prob(Exit at $X$) = $p$. Payoff = 0.
          *   Prob(Exit at $Y$) = $(1-p) \times p$. Payoff = 4.
          *   Prob(Past $Y$) = $(1-p) \times (1-p)$. Payoff = 1.
          *   Expected Value $V(p) = 0 + 4p(1-p) + 1(1-p)^2$.
          *   Maximize $V(p)$: Derivative w.r.t $p$: $4(1-2p) - 2(1-p) = 4 - 8p - 2 + 2p = 2 - 6p$.
          *   Set to 0: $2 - 6p = 0 \Rightarrow p = 1/3$.
          *   Max Value: $4(1/3)(2/3) + 1(2/3)^2 = 8/9 + 4/9 = 12/9 = 4/3$.
      *   *Interim Calculation (The Paradox):*
          *   Suppose the driver arrives at an intersection. She asks: "What is the probability I am at $X$?"
          *   To answer this, she needs to use Bayes' rule. But Bayes' rule requires the probability of reaching this node.
          *   $P(X | \text{reach}) = \frac{P(\text{reach } X)}{P(\text{reach } X) + P(\text{reach } Y)}$.
          *   $P(\text{reach } X) = 1$.
          *   $P(\text{reach } Y) = 1-p$ (probability of continuing at $X$).
          *   So, belief $\alpha = P(X) = \frac{1}{1 + (1-p)} = \frac{1}{2-p}$.
          *   Now, calculate Expected Utility of Exiting vs. Continuing *at the intersection*, given belief $\alpha$ and assuming future self uses $p$.
          *   $EU(\text{Exit}) = \alpha(0) + (1-\alpha)(4) = 4(1-\alpha)$.
          *   $EU(\text{Continue}) = \alpha[ (1-p)4 + p(0) \text{ (Wait, no)} ]$.
