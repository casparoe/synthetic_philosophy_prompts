          *   Weighted by belief $\alpha$ (prob at $X$) and $1-\alpha$ (prob at $Y$).
          *   $EU(\text{Exit}) = \alpha(0) + (1-\alpha)(4) = 4(1-\alpha)$.
          *   $EU(\text{Continue}) = \alpha [ p(4) + (1-p)(1) ] + (1-\alpha)[1]$.
          *   Substitute $\alpha = \frac{1}{2-p}$.
