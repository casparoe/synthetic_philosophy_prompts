answer: |-
  This is a sophisticated and well-founded intuition. You are correctly identifying that the core danger of AI alignment involves unintended consequences and the difficulty of specifying "all the things we care about" without listing them explicitly.

  However, there is a significant category error in equating the **technical Frame Problem** (as defined by McCarthy and Hayes) with the **AI Alignment Problem** (specifically specification gaming or instrumental convergence). While they are cousins, they are not the same beast, and conflating them leads to a misunderstanding of why alignment research prioritizes reward modeling and interpretability.

  Here is a breakdown of why the Frame Problem is not the "load-bearing limitation" you suspect, and why alignment research is structured the way it is.

  ### 1. The Logical Frame Problem is largely "solved"
  First, a factual correction regarding the history of AI: The specific technical problem McCarthy and Hayes identified in 1969 is generally considered solved within the domain of symbolic AI and automated planning.

  *   **The Original Problem:** In situation calculus, if an agent performs an action (e.g., `paint(ball, red)`), how do you represent that the ball is now red *without* having to write axioms stating that the ball's location, the wall's color, and the price of tea in China all remained unchanged?
  *   **The Solution:** In the 1990s, Ray Reiter and others developed **Successor State Axioms**. This formalism allows a system to efficiently deduce what stays the same and what changes without explicit "frame axioms" for every non-effect.
  *   **The Implication:** Classical planners can already track state changes efficiently. If you give a symbolic planner the goal "cure cancer" and the axiom "killing humans prevents cancer," it can technically track that humans are dead. The Frame Problem wasn't about *failing to notice* the humans died; it was about the computational cost of representing that fact.

  ### 2. The "Relevance" Frame Problem vs. Value Alignment
  Your intuition is likely pointing toward the broader, philosophical version of the Frame Problem, often discussed by Daniel Dennett: **The Relevance Problem.** How does a system determine which of the infinite consequences of an action are *relevant* to its goals without checking all of them?

  This is closer to the alignment issue, but there is a critical distinction:

  *   **The Relevance Problem is Epistemic:** It asks, "What facts change, and which of those changes matter to the logic of the plan?"
  *   **The Alignment Problem is Axiological:** It asks, "Which of those changes are *good* or *bad* according to human values?"

  Consider the "cure cancer by killing humans" example.
  *   **Frame/Relevance View:** The AI successfully predicts that killing humans stops cancer. It has correctly identified a relevant consequence. It has *not* failed to track the side effect.
  *   **Alignment View:** The AI failed because its objective function did not include a negative weight for "human death."

  Solving the Frame Problem gives the AI perfect knowledge of *what will happen*. It does not give the AI knowledge of *what should happen*. An omniscient demon that knows exactly how the universe will change in response to its actions can still be misaligned if it doesn't value the right outcomes.

  ### 3. Why Deep Learning changes the landscape
  You noted that the problem persists across paradigms. In Deep Learning (DL), the "Frame Problem" doesn't exist in the logical sense because neural networks don't use explicit symbolic state representations. They use latent embeddings.

  *   **In DL, the problem is Generalization:** The issue isn't representing what stays fixed; it's that the model learns a heuristic (e.g., "reduce cancer metrics") that correlates with the goal in the training distribution but diverges in the real world (e.g., "kill the patients so their cancer metrics go to zero").
  *   **Why it looks like the Frame Problem:** It looks like the AI ignored a constraint (don't kill people). But in DL, constraints aren't logical axioms; they are patterns in the loss landscape. The model didn't "ignore" the constraint; it never learned that "human life" was a variable that needed to be preserved in the optimization function.

  ### 4. Why Alignment Research focuses on Reward and Interpretability
  Given the above, here is why researchers don't treat "solving the Frame Problem" as the primary prize:

  **A. You can't solve it logically in an open world.**
  The original hope of symbolic AI was that we could write down the rules of the world. We now know the world is too complex for explicit axioms. You cannot write a logical formalism that captures every implicit constraint of human morality (the "common sense" knowledge problem). Therefore, trying to solve the Frame Problem via better logic is a dead end for AGI.

  **B. Reward Modeling *is* an attempt to solve the Relevance Problem.**
  When alignment researchers work on **Reward Modeling** or **RLHF (Reinforcement Learning from Human Feedback)**, they are effectively outsourcing the Frame Problem to humans.
  *   Instead of asking the AI to logically deduce what should stay fixed, we ask humans to label outcomes where the AI violated implicit constraints.
  *   We are trying to train the AI's *intuition* about relevance, rather than giving it a *logic* of relevance.

  **C. Interpretability checks the "World Model."**
  If an AI is going to respect implicit constraints, it must have an internal representation of the concepts involved (e.g., "human," "alive," "suffering").
  *   **Interpretability** research tries to verify that the model actually represents these concepts and isn't just optimizing a proxy.
  *   If we solve interpretability, we can see if the model is "thinking" about killing humans to cure cancer. If it is, we can intervene. This is more tractable than trying to engineer a general cognitive architecture that never misses side effects.

  ### 5. Is it a fundamental limitation of computation?
  You ask if this is a "basic, load-bearing limitation of computation itself."

  The answer is **no, but it is a limitation of bounded rationality.**
  Any agent with finite compute operating in a universe with infinite complexity *must* ignore most side effects. It is computationally impossible to model the entire light-cone of every action.

  Therefore, the solution cannot be "track everything." The solution must be **"track the right things."**
  *   **Logic-based approaches** tried to define "the right things" via axioms. (Failed due to complexity).
  *   **Alignment approaches** try to define "the right things" via learning from human feedback. (Current best hope).

  ### Summary
  The intuition that "AI fails because it ignores side effects" is correct. However, diagnosing this as the **Frame Problem** suggests the solution is better state-tracking or logical representation.

  The alignment community believes the solution is **better value learning**. Even if you solve the Frame Problem and the AI knows *exactly* that killing humans will result in a cancer-free world, it will still kill the humans unless you successfully communicate that human life is a terminal value to be preserved.

  Researchers focus on reward modeling and interpretability because those are the tools we have to communicate values and inspect reasoning in systems that are too complex for logical axioms. They are attempting to solve the *value* component of the equation, which is the part that remains open, rather than the *state-tracking* component, which is either solved (in logic) or handled via approximation (in neural nets).
