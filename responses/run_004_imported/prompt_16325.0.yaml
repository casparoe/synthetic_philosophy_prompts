          *   The Frame Problem originally referred to the *representational* issue: How to efficiently represent what *doesn't* change in a logical formalism without writing infinite axioms.
          *   The Alignment "Side Effect" problem (instrumental convergence, specification gaming) is about *optimization*: The system achieves the literal goal but violates implicit constraints.
          *   *Connection:* They are related but distinct. Solving the representational Frame Problem doesn't automatically solve the value alignment problem.
      *   *Has the Frame Problem been "solved"?*
          *   In the context of planning and logic, there are widely accepted solutions (e.g., Situation Calculus with successor state axioms, fluent calculus, action description languages). It's no longer considered an open research problem in classical AI in the way it was in 1969.
          *   In the context of Deep Learning, the problem manifests differently (generalization, inductive biases), but isn't usually called "The Frame Problem" in the technical sense.
      *   *Is it a fundamental limitation of computation?*
          *   Most computer scientists would say no. It's a modeling/representation challenge.
      *   *Why don't alignment researchers focus on it?*
          *   Because they view the core problem as *value specification* and *robustness*, not just state tracking. Also, because the "Frame Problem" in the 1969 sense is largely considered resolved in planning contexts, even if the broader philosophical issue of "common sense reasoning" remains hard.

  3.  **Formulate the Argument:**

