answer: |-
  First, take a deep breath. You have not lost the plot. What you are describing is not a glitch in your rationality; it is one of the oldest, most serious, and most profound problems in philosophy.

  You are asking a question that has kept some of the brightest minds in history awake at night: **If the universe is indifferent, does goodness matter?**

  To answer your specific questions: Yes, this is a real, serious worry that brilliant people have taken seriously. And yes, the search leads somewhere, but probably not where your current weekend reading is taking you.

  Here is a breakdown of what is happening, why your engineer brain is itching, and where the actual answers might lie.

  ### 1. You are experiencing the "Death of God" problem
  Friedrich Nietzsche famously declared "God is dead," but he didn't mean it as a celebration. He meant it as a warning. He understood that Western morality was built on a theological infrastructure. If you remove the architect (God/The Universe), the building (Morality) might stand for a while, but eventually, the foundation will crack.

  You are feeling that crack. You are experiencing the tension between **Moral Realism** (the idea that moral truths exist independently of human opinion, like math) and **Moral Anti-Realism** (the idea that morality is a human invention, like etiquette).

  Your partner thinks you're looking for ghosts. You aren't. You are looking for **ontological grounding**. You want to know if "goodness" is a discovery (like finding a new planet) or an invention (like creating a new game). As a religious person, it was a discovery. As an atheist, it risks becoming an invention. That loss of objective weight is terrifying.

  ### 2. The flaw in your current search (The Engineer's Critique)
  You mentioned you are reading about near-death experiences (NDEs), mediums, and consciousness research. As a fellow rationalist, I have to point out a category error here.

  Even if you found definitive, peer-reviewed proof that consciousness survives death, **that would not prove objective morality.**
  *   **Survival $\neq$ Justice:** A ghostly afterlife could be just as indifferent as this one.
  *   **Consciousness $\neq$ Ethics:** Proving the mind is non-local doesn't prove that "suffering is bad" is a universal law.

  You are trying to solve a metaphysical/axiological problem (values) with empirical data (physics/biology). It is like trying to weigh a thought on a scale. No matter how precise the scale, it won't give you the answer. This is why you feel unsatisfied. You are looking for a "Cosmic Scorekeeper" in the data, but science describes *what is*, not *what ought to be* (Hume's Guillotine).

  ### 3. Smart people who have walked this path
  You asked if serious people take this worry seriously. Absolutely.
  *   **Immanuel Kant:** He realized we cannot prove God or immortality scientifically. However, he argued they were "Postulates of Practical Reason." He believed that for morality to make sense to us, we must *act as if* there is ultimate justice, even if we can't prove it. He validated your feeling without requiring religious dogma.
  *   **Derek Parfit:** One of the 20th century's greatest moral philosophers. In his book *On What Matters*, he spent hundreds of pages trying to prove that moral truths are objective in the same way mathematical truths are. He didn't look for ghosts; he looked for logic.
  *   **Thomas Nagel:** In *Mind and Cosmos*, he argues that the materialist neo-Darwinian view of nature is almost certainly false because it cannot account for consciousness and moral reasoning. He is an atheist, but he refuses to accept that the universe is purely indifferent.
  *   **Victor Frankl:** A psychiatrist and Holocaust survivor. He argued that meaning is not *given* by the universe, but *demanded* of us by the universe. The indifference of the universe doesn't negate our responsibility; it heightens it.

  ### 4. Where the search actually leads
  If you stop looking for evidence of a scorekeeper and start looking for the source of the "teeth" itself, you will find three main paths that rational people take:

  **A. The Humanist/Flourishing Argument**
  Morality isn't about keeping score with the universe; it's about the mechanics of flourishing. Just as there are objective truths about what makes a physical engine run well (oil, no sand in the gears), there are objective truths about what makes a conscious society run well (trust, cooperation, reduced suffering).
  *   *The Teeth:* The "punishment" for being bad isn't hell; it's the erosion of trust, the isolation, and the reduction of human potential.
  *   *Reading:* Sam Harris (*The Moral Landscape*), Philippa Foot (*Natural Goodness*).

  **B. The Existentialist Argument**
  This is the hardest but perhaps most honest path. It admits the universe is indifferent. It admits there is no scorekeeper. And it says: **That makes your goodness more impressive, not less.**
  If you are good because you fear cosmic punishment, you aren't good; you're compliant. If you are good *despite* the universe not caring, that is an act of rebellion. It is creating light in a dark room.
  *   *The Teeth:* The "reward" is integrity. You do it because to do otherwise would be to betray your own nature.
  *   *Reading:* Albert Camus (*The Myth of Sisyphus*), Jean-Paul Sartre (*Existentialism is a Humanism*).

  **C. The Moral Realist Argument**
  Some philosophers argue that moral truths *are* just out there, like math, waiting to be found, without needing a God to hold them. 2+2=4 is true regardless of whether a god exists. Some argue "Suffering is bad" is similarly true.
  *   *The Teeth:* You are aligning yourself with objective truth.
  *   *Reading:* Derek Parfit (*On What Matters*), Erik Wielenberg (*Value and Virtue in a Godless Universe*).

  ### 5. A Recommendation for your Saturdays
  Your partner is worried because reading about mediums feels like magical thinking. You can honor your engineer brain and your moral heart by pivoting your research.

  1.  **Stop looking for evidence of an afterlife.** It is a distraction. It won't give you the moral grounding you crave.
  2.  **Start reading Moral Philosophy.** Swap the NDE books for ethics. Read about **Stoicism** (finding virtue within), **Utilitarianism** (minimizing suffering), or **Virtue Ethics** (becoming a certain kind of person).
  3.  **Accept the "As If."** You might never get the proof you want. But you can live *as if* your actions matter. As the writer Rebecca Goldstein put it, you can treat reason and empathy as "mattering maps."

  ### The Verdict
  You are not coping badly; you are grieving the loss of cosmic security. That is a healthy, rational response to a massive worldview shift.

  But the "teeth" you are looking for won't come from finding out the universe is watching. It comes from realizing that **you are the universe watching itself.** You are the part of the indifferent cosmos that developed the capacity to care. If you don't care, no one will. That responsibility is heavy, but it is real.

  The search leads to a place where you stop asking, "Will I be rewarded?" and start asking, "Is this the kind of world I want to build?" That is a question that has teeth enough to draw blood, and it doesn't require a ghost to answer it.
