      *   *Content for (b):* Tackle the Normative/Empirical worry. Explain Sidgwick's specific move: He isn't trying to refute Egoism normatively; he's trying to make Egoism *demand* Utilitarian action via empirical facts. Acknowledge the user's worry: it makes ethics fragile (contingent on cosmic facts). This is the "Heteronomy" objection (Kantian critique).
