      *   *Nuance on (b):* The user asks if it's a category mistake. I should clarify that for Sidgwick, "Rationality" implies "Reasonable Expectation." If the universe doesn't support moral rationality, then being moral is *irrational*. So empirical facts *do* matter for Sidgwick's definition of rationality. It's not a mistake, it's a feature of his empiricist meta-ethics.
      *   *Literature:* Ensure I mention Bart Schultz's biography specifically, as it's the definitive work on the SPR connection.

  7.  **Final Polish:** Check against the user's specific constraints. (a) History/Logic, (b) Coherence/Category Mistake, (c) Literature. Ensure the tone matches a philosophical peer review. (The user is clearly well-read, so don't dumb it down.)

  8.  *(Final check of the User's specific worry)*: "even perfect evidence... would only show that duty and self-interest happen... to coincide — it would do nothing to show that the egoist's reasoning was ever invalid."
      *   *Response:* This is the crux. Sidgwick *concedes* the egoist's reasoning is valid. He wants to show the *conclusion* of the egoist (act selfishly) is false because the *facts* are different. If virtue = happiness (long term), then the egoist *must* act virtuously. The user is right that it doesn't solve the *normative* authority of the Universal Good *over* the Self Good, but it dissolves the *practical* conflict. I need to make this distinction clear.

  9.  **Constructing the Output.** (Proceed to generate response based on these points.)
answer: |-
  This is an exceptionally sharp reconstruction of the problem. You have correctly identified the structural role the SPR plays in Sidgwick's mature thought, and your worry about the normative/empirical divide cuts to the heart of the most significant criticism leveled against Sidgwick's project.

  Here are my comments on your three specific points, followed by a suggestion on how to deploy this against your friend's "biographical curiosity" claim.

  ### (a) History and Internal Logic
  You have the history and the internal logic right. In fact, you have captured the trajectory of Sidgwick's thought more accurately than many introductory surveys.

  1.  **The Textual Trajectory:** While the *Dualism of Practical Reason* appears in the first edition of *The Methods of Ethics* (1874), it becomes increasingly agonizing for Sidgwick in subsequent editions. By the sixth edition (1901), it is the concluding, unresolved crisis of the book. The founding of the SPR (1882) sits squarely in the period where Sidgwick is most actively seeking a resolution to this dualism.
  2.  **The Theistic Premise:** You are correct that Sidgwick does not dogmatically assert the moral government of the universe. He treats it as a necessary postulate *if* ethics is to remain a fully rational system. He writes in the *Methods* that if we cannot believe in such a government, "the moral life... would be a life of perpetual conflict."
  3.  **The SPR as Inquiry:** Sidgwick did not view the SPR as spiritualism or séances in the vulgar sense. He viewed it as the application of scientific empiricism to the question of immortality. If the "sanctions" (rewards and punishments) required to align self-interest with duty occur after death, then evidence of survival is evidence of the possibility of those sanctions.

  Your friend's claim that this is detachable is historically untenable. Sidgwick himself linked them. In a letter to his cousin A.M. Hill, he explicitly states that his interest in immortality is driven by the ethical need to reconcile duty and interest.

  ### (b) The Philosophical Move: Category Mistake or Empiricist Meta-Ethics?
  Your worry is the strongest part of your reasoning: *Does empirical evidence of survival actually settle a question about rational authority?*

  You suggest this might be a category mistake (settling a normative question with empirical facts). I would argue that for Sidgwick, this is **not a mistake, but a deliberate meta-ethical commitment**, though one that leaves him vulnerable to a specific Kantian critique.

  Sidgwick is a moral realist but also an empiricist about rationality. For Sidgwick, for an action to be "rationally required," it must be in the agent's rational interest (broadly construed). He cannot simply assert "Duty trumps Interest" as a brute normative fact (as a Kantian might). He needs to show that doing one's duty *is* in one's interest.
  *   **Your Objection:** You note that even if they coincide, this doesn't show the egoist's reasoning is *invalid*.
  *   **Sidgwick's Reply:** Sidgwick agrees with you. He does not think the Egoist's reasoning is invalid. He thinks the Egoist is rational. His goal is not to defeat Egoism normatively, but to make Egoism *demand* Utilitarian action. If the Universe guarantees that Virtue = Happiness (eventually), then the Rational Egoist *must* be a Utilitarian to maximize their own good.

  **The Vulnerability:** Your intuition that this is fragile is correct. It renders the rationality of morality **contingent**. If the SPR fails to find evidence of immortality (which, by modern standards, it did), then the Dualism stands, and it is arguably *more* rational to be an Egoist than a Utilitarian when they conflict. This makes ethics dependent on cosmology.
  *   **Verdict:** It is not a confusion on Sidgwick's part; he knows exactly what he is doing. However, it is a **philosophically costly move**. It sacrifices the autonomy of ethics. You are right to worry that "contingent coincidence" does not provide the *moral authority* Sidgwick wants, only a *prudential alignment*.

  ### (c) The Literature: Are you reinventing the wheel?
  You are not reinventing the wheel, but you are deriving it independently, which is excellent. However, to strengthen your position against your friend, you should engage with two specific strands of Sidgwick scholarship.

  **1. J.B. Schneewind (*Sidgwick's Ethics and Victorian Moral Philosophy*)**
  Schneewind is the definitive source on this. He confirms your reading: the SPR work is an attempt to solve the Dualism. He argues that Sidgwick's failure to find the evidence led to his "philosophical despair." You should cite Schneewind to show this is the standard scholarly interpretation, not just your own speculation.

  **2. Bart Schultz (*Henry Sidgwick: Eye of the Universe*)**
  Schultz's biography goes further than Schneewind. He argues that the SPR work is not just a "continuation" but the *key* to understanding Sidgwick's entire life and philosophy. Schultz emphasizes that Sidgwick's commitment to "truth-seeking" was uniform across ethics and psychical research. He would strongly back your claim that Sidgwick is not a philosopher who dabbled in ghosts, but a truth-seeker who applied the same method to both.

  **3. The Kantian/Heteronomy Objection**
  The "better-known line of criticism" you are looking for is the charge of **Heteronomy**.
  *   Critics (often from a Kantian tradition) argue that by making morality dependent on external sanctions (even cosmic ones), Sidgwick undermines the intrinsic authority of the moral law.
  *   If I am honest only because a deity will reward me in the afterlife, my action has legal conformity but no moral worth.
  *   **How to use this:** You can concede to your friend that Sidgwick's move is philosophically problematic (it risks heteronomy), but insist that this makes the SPR work **central**, not peripheral. It is the site of the system's greatest vulnerability. You cannot relegate it to a footnote if it is the load-bearing wall holding up the roof of his ethical system.

  ### Summary Advice for Your Argument
  Your friend wants to treat the SPR work as a psychological symptom (Victorian anxiety). You should argue it is a **systematic necessity**.

  *   **The Knockout Point:** If Sidgwick's ethics requires the coincidence of Duty and Interest to remain fully rational, and Sidgwick believes that coincidence requires Immortality, then the search for evidence of Immortality (SPR) is **applied ethics**.
  *   **Concede the Weakness:** Admit that you share the worry that empirical facts cannot settle normative authority. But argue that Sidgwick *knew* this. He wasn't confused; he was desperate. He hoped that the *facts* of the universe would constrain the *demands* of rationality.
  *   **Conclusion:** The SPR work is not a detachment from *The Methods*; it is the experimental testing of *The Methods'* final, unproven axiom. To ignore it is to read the book without the conclusion.

  Your reasoning is sound. You have correctly identified that the "biographical curiosity" view fails to account for the systematic architecture of Sidgwick's thought. The SPR was Sidgwick trying to save Utilitarianism from the charge of being rationally self-defeating.
