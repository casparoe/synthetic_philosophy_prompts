      *   *Wait, actually:* The standard distinction is often:
          1.  PII (Identity of Indiscernibles): If same properties -> same object.
          2.  Indiscernibility of Identicals: If same object -> same properties (this is logically true).
          *   The "Weak" vs "Strong" usually refers to what counts as a property.
          *   *Strong PII:* Excludes spatiotemporal location and haecceity. (Hardest to defend).
