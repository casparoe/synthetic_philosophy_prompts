  *(Self-Correction on Hacking)*: Hacking's point is specifically that if the universe is symmetric, we can model it as a curved space where one object loops around. Max needs to counter that this changes the *topology* of the space, which is a substantive change, not just a redescription. Or, Max can argue that even in Hacking's model, the *possibility* of distinctness remains. Let's have Max argue that Hacking's move is a "mathematical trick" that saves the letter of the law but kills the spirit.

