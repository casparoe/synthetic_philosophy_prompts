      *   **Format:** A dialogue (back-and-forth argument), not alternating monologues.
      *   **Characters:**
          *   *Leibnizian:* Defends the Principle of Identity of Indiscernibles (PII). Sharp, presses on relational properties, questions the presupposition of "twoness," brings up Hacking.
          *   *Blackian:* Defends Black's spheres as a counterexample. Sharp, engages with Hacking's reinterpretation, distinguishes weak/strong versions of PII.
      *   **Key Philosophical Points to Cover:**
          *   Leibniz's Law / PII (If $x$ and $y$ share all properties, $x = y$).
          *   Max Black's Two Spheres (Symmetric universe, same intrinsic properties, same relational properties *relative to each other*).
