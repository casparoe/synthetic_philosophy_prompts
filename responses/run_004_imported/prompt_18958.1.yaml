      *   *Fix:* Max should argue that even if the *geometry* allows that description, the *possibility* of the symmetric universe is what matters. Or, he can argue that Hacking's move changes the rules of the game (Euclidean vs. Non-Euclidean). Let's have Max argue that Hacking's move saves PII only by changing the definition of "space," which is a concession.
      *   *Critique:* The Weak/Strong distinction needs to be clear.
