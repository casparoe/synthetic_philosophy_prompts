      *   *Adjustment:* I need to make sure they don't talk past each other on definitions. Max should argue that *even excluding* location as a primitive, they are distinct. Gottfried should argue that if you exclude location, you collapse them.

  5.  **Drafting the Dialogue (Iterative Process):**
