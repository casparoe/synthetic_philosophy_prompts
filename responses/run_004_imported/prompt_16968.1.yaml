          *   *Friend:* Needs to feel seen and supported, not analyzed.

  4.  **Iterative Drafting:**

      *   *Attempt 1 (Mental Outline):* Hi everyone. [Friend] is having a baby. As a grad student, I know we can't predict feelings. L.A. Paul says parenting is transformative. Like becoming a vampire. You can't know until you do it. But that's okay. You choose it to become someone new. We love you.
