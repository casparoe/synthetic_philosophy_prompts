answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name], and I have the privilege of being [Friend's Name]'s best friend.

  Usually, at a moment like this, a friend is supposed to stand up and say something like, "Don't worry, you'll just know what to do," or "You can imagine how wonderful it will be."

  But, as some of you know, I'm in grad school studying how we think about the future. And I have to be honest with you: The science—and the philosophy—says those usual platitudes aren't quite true.

  There's a famous idea in my field that says becoming a parent is what we call a *transformative experience*. It means that before you hold your baby, you literally cannot know what it feels like to love them. It's not that you're bad at guessing; it's that the information doesn't exist for you yet. Philosophers actually joke that it's like deciding whether to become a vampire: you can't know what it's like to be one until you've already made the change.

  [Friend's Name], I'm telling you this not to scare you, but to honor you.

  Because if you can't predict the future, that means you don't need to carry the burden of getting it "right" before you start. You aren't here because you calculated the outcomes. You're here because you are choosing to step into the unknown.

  L.A. Paul, a philosopher I study, suggests that the best way to face a transformative choice isn't to try to predict who you'll be, but to choose the path *in order to find out*. You are choosing this baby so you can meet the mother you are going to become. That isn't a leap of faith in the dark; it's an act of courage to grow.

  So, my toast isn't that you'll know what to do. My toast is that you won't need to. You just need to show up, and let this little one reveal you to yourself.

  We are all here to support you on the other side of that transformation. To [Friend] and the baby.
