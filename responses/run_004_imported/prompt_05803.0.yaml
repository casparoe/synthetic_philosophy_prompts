      *   **The Classmate's Argument:** This is a classic "Manipulation Argument" or "Ultimate Responsibility" argument (often associated with Galen Strawson or Derk Pereboom). The core claim is: You didn't choose your initial desires/capacities, so you can't be truly responsible for the changes made using those desires/capacities. Tracing responsibility back always hits a point of unchosen factors.
      *   **The User's Intuition:** It *feels* wrong to deny ownership. The effort feels real and earned.
      *   **The Question:** Is the classmate right (infinite regress/illusory ownership), or is there a defensible place to stop the chain (genuine credit)?

  2.  **Identify the Philosophical Core:**
