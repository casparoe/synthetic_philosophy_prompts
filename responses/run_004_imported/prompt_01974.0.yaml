      *(Final check on technical details)*:
      *   Kelly = Maximize $E[\ln(1+fr)]$.
      *   Asymptotic dominance: $P(\lim_{t\to\infty} W_t^{Kelly} / W_t^{Other} = \infty) = 1$.
      *   Ergodicity: $\lim_{T\to\infty} \frac{1}{T} \ln(W_T/W_0) = E[\ln(1+fr)]$.
