  6.  **Synthesize and Identify Overlooked Considerations:**
      *   *The Stalemate:* Rachel argues from *dynamics/physics* (what the system does). Sam argues from *preferences/norms* (what the agent wants). They are talking past each other slightly.
      *   *Overlooked Point 1: Finite Horizons & Ruin.* Kelly is asymptotic. Real life is finite. "Almost surely" allows for paths where you go bust before the long run. Fractional Kelly is often practically superior due to estimation error and drawdown risk.
