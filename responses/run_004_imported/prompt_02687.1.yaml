      *   *Is it about rigidity?* JC relies on the rigidity condition ($P_{new}(H|E_i) = P_{old}(H|E_i)$). In Judy Benjamin, we don't know which conditional probabilities to hold rigid. Do we hold $P(H|B)$ rigid? Do we hold $P(R)$ rigid? The constraint explicitly changes a conditional probability ($P(H|R)$), so we can't hold *all* conditionals rigid. Which ones do we sacrifice?
      *   *Key Insight:* JC preserves conditional probabilities given the partition. JB *changes* a conditional probability. Therefore, JB violates the fundamental invariance assumption of JC.

