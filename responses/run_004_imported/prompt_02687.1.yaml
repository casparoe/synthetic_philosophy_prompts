      *   **Explain the "Puzzle":** The puzzle isn't how to update *given* the new distribution (JC solves that). The puzzle is how to *derive* the new distribution from the conditional constraint. What principle dictates the shift in the *unconstrained* part of the space (Blue territory)?
      *   **Mention Alternative Solutions:** Briefly mention Maximum Entropy (MaxEnt) or Infomin, as these are the standard responses to JB, contrasting them with JC. This shows depth and confirms why JB is distinct.
      *   **Connect to Cognitive Science:** Why does this matter for the user? (Modeling how humans handle conditional constraints vs. likelihoods).

