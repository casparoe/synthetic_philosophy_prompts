answer: |-
  **Setting:** *Conference Room B, The Horizon Foundation. 11:45 PM. The whiteboard is covered in decision matrices. Two empty pizza boxes sit on the table. A single grant proposal for a "Hybrid Intervention" (cataract surgeries in South Asia + unconditional cash transfers in East Africa) sits between them.*

  **Characters:**
  *   **ELENA:** Senior Economist. Ordinalist. Skeptical of interpersonal utility comparisons.
  *   **MARCUS:** Program Director. Utilitarian. Advocate for cardinal welfare metrics.

  ***

  **MARCUS:** (Rubbing his temples) We have to sign off by morning, Elena. The board meets at eight. If we don't rank these outcomes, the check doesn't go out.

  **ELENA:** Then we rank them procedurally. We verify that the cataract surgery meets the medical safety standards, we verify the cash transfer mechanism is fraud-resistant. We tick the boxes. We do not—and I will fight you on this until the sun comes up—we do not write into the final report that saving a life is *exactly* equivalent to curing forty cases of blindness.

  **MARCUS:** Why not? The DALYs [Disability-Adjusted Life Years] say it is. One year of healthy life gained is one year of healthy life gained, whether it's in Mumbai or Mombasa. That's the whole point of the metric. It allows us to scale.

  **ELENA:** It allows us to *pretend* we can scale. Lionel Robbins nailed this in the thirties. You have no access to the inner experience of the farmer in Kenya. You have no access to the inner experience of the blind woman in India. To say their gains are commensurable isn't a measurement, Marcus. It's a value judgement wearing a lab coat.

  **MARCUS:** And doing nothing is a value judgement wearing a suit of armor. If we refuse to compare, we default to the status quo. We default to whatever political pressure is loudest, or whatever charity has the best marketing. That's not neutrality, Elena. That's cowardice dressed up as rigor.

  **ELENA:** It's not cowardice, it's epistemic honesty. I can measure your income. I can measure your intraocular pressure. I cannot measure your *utility*. I can't even measure *your* utility cardinally, let alone compare it to someone else's. All I know is that you prefer A to B. I don't know by *how much*. Once you start adding my preferences to yours to get a "social welfare function," you're doing theology, not economics.

  **MARCUS:** (Leans forward) Okay. Let's talk theology then. Harsanyi. Aggregation Theorem. If you accept that individuals are rational expected-utility maximizers, and you accept a Pareto condition—meaning if everyone prefers X to Y, society should too—then the social welfare function *must* be a weighted sum of individual utilities. There is no other mathematically consistent way to do it.

  **ELENA:** Harsanyi assumes we can normalize the utilities. He assumes we can take my "10 utils" and your "10 utils" and treat them as the same unit. But my scale might run from 1 to 100, and yours from 1 to 5. How do you calibrate the zero point? How do you calibrate the unit?

  **MARCUS:** We use proxies. Revealed preference. If a person risks a 1% chance of death to gain $5,000, and another risks a 1% chance of death to gain $500, we have evidence of the marginal utility of money relative to life. It's noisy. I'm not saying it's perfect physics. I'm saying it's signal amidst noise.

  **ELENA:** It's noise *masquerading* as signal. Take the cash transfer. You're giving $1,000 to a subsistence farmer. You're assuming that dollar gives more utility than giving $1,000 to a burnt-out tech worker in San Francisco.

  **MARCUS:** Diminishing marginal utility of income. Basic micro.

  **ELENA:** That assumes utility is a function of income alone. What if the tech worker is suicidal? What if the dollar prevents a overdose? What if the farmer already has enough to eat and values the social status of a community festival more than the cash? You're imputing a utility function onto them based on *your* model of rationality. That's imperialism, Marcus.

  **MARCUS:** So what's the alternative? We flip a coin? We fund the cataract surgery because the ophthalmologists lobbied harder? If we can't compare, we can't prioritize. And if we can't prioritize, effective altruism collapses into random altruism.

  **ELENA:** (Pauses, picks up a pen) I'm not saying we don't prioritize. I'm saying we prioritize based on constraints, not maximization. We don't say "This maximizes the good." We say "This violates no rights, meets urgent needs as defined by the recipients, and fits our budget."

  **MARCUS:** That's Kaldor-Hicks efficiency without the compensation principle. It's incomplete. Look, let's look at Arrow.

  **ELENA:** Don't you dare bring Arrow into this to justify utilitarianism.

  **MARCUS:** I'm bringing him in to show the cost of your position. Arrow's Impossibility Theorem. If you stick to strict ordinal preferences—just rankings, no intensity—and you want a social choice function that's non-dictatorial and independent of irrelevant alternatives... it doesn't exist. You get cycles. You get incoherence. The only way out of Arrow's trap is to allow some form of cardinal information. Some measure of intensity.

  **ELENA:** Or you accept that "social choice" is a fiction. We are not a single agent. The Foundation is not a person. We are a fiduciary agent for the donors.

  **MARCUS:** The donors want to do the *most* good. That's the mandate. "Most" implies comparison.

  **ELENA:** "Most" implies a metric. If the metric is flawed, the output is garbage. Here's my objection, and I want you to answer it specifically. Suppose we fund the blindness cure. Ten people can see. Suppose we fund the life extension. One person lives ten more years. You've weighted them as equal in your spreadsheet. But how do you verify that? If I survey the blind people, they say they'd trade one year of life for sight. If I survey the dying, they'd trade everything for life. Who are you to average those?

  **MARCUS:** I'm not averaging them arbitrarily. I'm using a standard gamble method. We ask people: "What risk of death would you take to cure your blindness?" If the average answer is 10%, and the average person would take a 5% risk to cure a migraine, then blindness is roughly twice as bad as a migraine in terms of welfare loss. We build the weights from the bottom up, from the people living the lives.

  **ELENA:** Adaptive preferences.

  **MARCUS:** Excuse me?

  **ELENA:** Adaptive preferences. People who have been blind for twenty years often report high happiness levels. People in subsistence farming often report high life satisfaction. If you use self-reported happiness as your cardinal utility, you might conclude that giving them money or surgery does *nothing*, because they're already at a 7 out of 10. Are you going to tell the donor that curing blindness is low priority because the blind have adapted to their suffering?

  **MARCUS:** (Silence for a moment) That... is a valid criticism. Objective list theories. We have to account for capabilities, not just happiness. Nussbaum and Sen.

  **ELENA:** Exactly. But once you move to "capabilities," you're back to qualitative judgments. You're saying "Sight is a capability worth X." Who decided X?

  **MARCUS:** The committee. The public. The democratic process.

  **ELENA:** There it is. "The committee decided." That's what I want in the report. Not "This generates 500 QALYs," but "This aligns with our ethical weighting that prioritizes sensory restoration." Own the value judgement, Marcus. Don't hide it in the math.

  **MARCUS:** If I write that, the donors will think we're guessing.

  **ELENA:** They should know we are guessing! We are guessing about the future, and we are guessing about the inner lives of strangers. The only difference is, your spreadsheet gives a false sense of precision. It suggests that 10.5 QALYs is strictly better than 10.4 QALYs.

  **MARCUS:** So how do we decide? We have $5 million. The cataract project costs $3 million. The cash transfer costs $3 million. We can't do both fully.

  **ELENA:** We diversify.

  **MARCUS:** Diversification is an admission that we don't know the weights.

  **ELENA:** It's an admission that we *don't* know the weights. It's risk management. If your utilitarian calculus is wrong—if sight matters less than you think, or cash matters more—we haven't put all our eggs in one basket. We satisfy the urgent need for income *and* the urgent need for health, without claiming we've solved the equation of human welfare.

  **MARCUS:** That's satisficing. Simon, not Harsanyi.

  **ELENA:** Herbert Simon was right about bounded rationality. We are bounded. We are bounded by data, and we are bounded by the fact that we cannot feel another person's pain.

  **MARCUS:** (Sighs, looks at the spreadsheet) If we diversify, we lose the leverage of the "most effective" claim. We become just another foundation.

  **ELENA:** Or we become a humble one. Look, I'll concede this: We need *some* comparison to act. I can't let you maximize, but I can let you threshold. Set a minimum bar for cost-effectiveness. Anything above the bar is "good enough." Then, among the things that are "good enough," we apply ethical constraints. Do we prioritize the worst off? Do we prioritize agency?

  **MARCUS:** So, a lexicographic ordering? First, pass the efficiency threshold. Second, apply the ethical weights.

  **ELENA:** Yes. But the ethical weights are explicitly labeled as *moral assumptions*, not empirical findings. You don't write "Value of Statistical Life = $10 million." You write "For the purpose of this allocation, we value life extension at parity with disability reduction."

  **MARCUS:** That makes the model fragile. If the moral assumption changes, the whole ranking flips.

  **ELENA:** Good. It should. Because the *morality* is what's driving the decision, not the *math*. The math is just the engine. You're trying to pretend the engine is the driver.

  **MARCUS:** (Taps the pen on the table) If I do this... if I explicitly state that the weighting between the cash and the surgery is a normative choice... I open us up to criticism that we're arbitrary.

  **ELENA:** You open us up to criticism that we're *human*. Which we are. And right now, at 12:15 AM, being human and admitting uncertainty is better than being a calculator and pretending to certainty.

  **MARCUS:** (Looks at the proposal, then at Elena) Okay. We split the funding. 60/40.

  **ELENA:** Why 60/40?

  **MARCUS:** Because the cash transfers have lower overhead. That's an empirical fact. I can measure overhead. I can't measure utility. So I'll optimize what I can measure, and satisfice on what I can't.

  **ELENA:** (Smiles faintly) That's... acceptable. It's a Pareto improvement over arguing until dawn.

  **MARCUS:** But I'm adding a footnote.

  **ELENA:** Of course you are.

  **MARCUS:** "This allocation assumes that doubling income for the extreme poor is roughly comparable in welfare gain to restoring sight, weighted by a factor of 1.2 due to urgency." I'm keeping the number, Elena. I just won't claim it's derived from physics.

  **ELENA:** As long as the footnote admits the 1.2 comes from *us*, and not from the universe.

  **MARCUS:** Deal. (He reaches for the pen) You know, Robbins would have hated this foundation.

  **ELENA:** Robbins would have told us to go home and study price theory. But Harsanyi would have signed the check.

  **MARCUS:** Harsanyi would have tried to calculate the expected utility of signing the check versus going to sleep.

  **ELENA:** And what's the result?

  **MARCUS:** (Signs the document) Sleep has diminishing returns after 2 AM. The grant has infinite horizon.

  **ELENA:** See? You can't escape the comparison.

  **MARCUS:** No. I just can't prove it.

  **ELENA:** (Stands up) Good night, Marcus.

  **MARCUS:** Night, Elena.

  *(Marcus packs the signed grant into his bag. The whiteboard remains covered in the erased ghosts of utility functions, none of them quite matching the reality of the people they were meant to serve.)*
