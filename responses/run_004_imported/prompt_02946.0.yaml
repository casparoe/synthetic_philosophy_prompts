answer: |-
  This is a fantastic catch by your reading group. It is easy to view the Kantian "never lie" position as a peculiar Enlightenment deontology, but locating it in Augustine reveals that the argument is far older and rests on a specific metaphysical anthropology rather than just duty ethics.

  You are correct that the key to unlocking the hierarchy lies in Augustine's distinction between **temporal goods** and **eternal goods**, and specifically his ontological ranking of **Life** versus **Integrity (Purity)**.

  Here is the reconstruction of the underlying logic of *De Mendacio*, why Lie #8 is "less sinful" than Lie #7, and how this taxonomy supports an exceptionless rule against lying.

  ### 1. The Core Principle: The Hierarchy of Goods, Not Harms
  Modern intuition (and utilitarianism) ranks harms by *intensity of suffering* or *loss of future experience*. By that metric, death (total loss of experience) is worse than sexual assault (traumatic loss of integrity).

  Augustine ranks harms by **ontological status** and **proximity to the Eternal**.
  *   **Eternal Goods:** Salvation, Truth, Religious Doctrine.
  *   **Spiritual/Structural Goods:** Justice, Public Order.
  *   **Temporal Goods:** Bodily Integrity, Life, Property.

  The "sinfulness" of the lie is inversely proportional to the **rank of the good it preserves**. Since lying is *always* a disorder of the soul (a turning away from Truth), it is always a sin. However, a sin committed to preserve a *higher* good is a *lesser* disorder than a sin committed to preserve a *lower* good.

  Therefore, to understand why Lie #8 (preventing defilement) is better than Lie #7 (preventing death), you must understand why Augustine believes **Defilement is a worse temporal evil than Death.**

  ### 2. Resolving the #7 vs. #8 Paradox
  Your text highlights the crucial passage: *"No man says that a person is defiled by being murdered... But if he be... carnally used... then almost all men regard him with a feeling of horror, and they call him defiled and unclean."*

  Augustine is making two moves here, one anthropological and one theological:

  **A. The Anthropological Intuition (The "Horror" Test)**
  Augustine argues that there is a universal human intuition that sexual violation constitutes a unique category of harm. Murder ends the body; defilement corrupts it. In the ancient Mediterranean worldview (and Augustine's), the body is not just a vessel for consciousness; it is a signifier of social and spiritual order.
  *   **Death** is a natural transition. It is the end of the "trial" of life. A person killed unjustly can die as a martyr; their spiritual status is intact or even enhanced.
  *   **Defilement** leaves the person alive but "unclean." It imposes a stigma that complicates their standing in the community and their ritual relationship with God. It is a corruption of the *temple of the Holy Spirit* while the soul is still trapped within it.

  **B. The Theological Valuation (Chastity > Life)**
  For Augustine, **Chastity/Purity is a higher temporal good than Biological Life.**
  This is consistent with his broader theology, where virgins who committed suicide to escape rape (a view he actually argues against in *City of God*, though he sympathizes with their motive) were seen as prioritizing purity over life. Augustine clarifies that the *victim* of rape does not lose their spiritual virtue (since consent is required for sin), but the *state of defilement* is still objectively a worse condition to be in than the state of being dead.

  *   **Lie #7 (Saving a Life):** Preserves a lower good (temporal existence). The person remains subject to future sin and suffering.
  *   **Lie #8 (Saving from Defilement):** Preserves a higher good (bodily integrity/purity). This protects the "image of God" in the flesh more robustly than merely extending biological duration.

  Therefore, the lie told to prevent defilement serves a **higher end** than the lie told to prevent death. Since the "badness" of the lie is mitigated by the "goodness" of the end, Lie #8 is less sinful than Lie #7.

  ### 3. The Logic of the Full Hierarchy
  Once you accept the "Hierarchy of Goods" principle, the rest of the list coheres perfectly. It moves from violations of Eternal Truth down to violations of Temporal Convenience.

  *   **Lie #1 (Religious Doctrine):** Violates the **Eternal Good**. This leads to damnation. Worst possible lie.
  *   **Lie #2 (Unjust Harm):** Violates **Justice**. Hurts a neighbor for no reason. Violates the second greatest commandment (Love thy Neighbor).
  *   **Lie #3 (Profit/Hurt):** Violates **Justice** but mitigated by intent to help someone (though unjustly).
  *   **Lie #4 (Lust of Lying):** Violates the **Nature of Speech**. Lying for the sake of lying is a pure disorder of the will, serving no good.
  *   **Lie #5 (Social Pleasing):** Violates **Truth** for the sake of **Politeness**. A low-order good (social smoothness) traded for Truth.
  *   **Lie #6 (Protecting Property):** Preserves **External Goods** (money). Lower than bodily integrity.
  *   **Lie #7 (Protecting Life):** Preserves **Biological Life**. Higher than property, lower than purity.
  *   **Lie #8 (Protecting from Defilement):** Preserves **Bodily/Spiritual Integrity**. The highest *temporal* good.

  ### 4. How This Supports the "Exceptionless Rule"
  This is the most critical part for your group's lineage tracing (Kant -> Yudkowsky).

  If Augustine allowed that "Lie #8 is Good," he would collapse the absolute rule. If lying can be *good*, then the definition of lying becomes contingent on consequences. This opens the door to utilitarian calculation, where eventually, one might lie for Lie #5 (social pleasing) or Lie #3 (political expediency).

  By maintaining that **all eight are sins**, but ranking them by gravity, Augustine achieves two things:

  1.  **Preservation of the Schelling Point:** Truth-telling remains the absolute focal point of human communication. Speech is *ontologically* for signifying thought. To speak against thought is always a corruption. This prevents the "slippery slope" where the definition of "necessary lie" expands until truth becomes optional.
  2.  **Pastoral Flexibility without Moral Relativism:** He acknowledges the "Murderer at the Door" scenario (Lie #7 or #8) without conceding that the lie is *virtuous*. The agent must lie to save the victim, but they must also **repent of the lie**.

  This is the crucial difference between Augustine and modern secular deontology.
  *   **Kant:** You must not lie, even to the murderer. (The rule is absolute; the consequence is on the murderer).
  *   **Augustine:** You may lie to the murderer to save the victim, but you have still sinned. You have chosen the "lesser sin" to prevent a "greater evil," but you must not call the lie "good."

  ### 5. Connection to Rationalist "Meta-Honesty"
  For your reading group, the connection to Yudkowsky's "Meta-Honesty" is striking.
  *   **Yudkowsky:** We need a policy of honesty that is robust enough to be trusted, even if it means admitting we might withhold information in extreme edge cases (like safety), without collapsing into "I lie whenever I calculate it's optimal."
  *   **Augustine:** We need a norm of Truth that is ontologically absolute, even if we admit that in extreme edge cases (defilement/death), we will violate the norm. But we must mark that violation as a *cost* (sin), not a *feature*.

  Augustine's hierarchy is essentially a **penalty function** for violating the honesty norm.
  *   Violate for Religion: Infinite Penalty.
  *   Violate for Justice: High Penalty.
  *   Violate for Life: Medium Penalty.
  *   Violate for Purity: Low Penalty.

  By making the penalty explicit, he prevents agents from "hacking" the system. You can't lie to save your reputation (Lie #5) and claim you were doing it to save a life (Lie #7). The hierarchy forces you to categorize your motivation rigorously.

  ### Summary
  The principle generating the hierarchy is **The Ontological Rank of the Good Preserved.**
  Augustine ranks **Purity/Integrity** above **Biological Life** because death is a transition of the soul, while defilement is a corruption of the living temple. Therefore, a lie told to prevent defilement (#8) serves a higher good than a lie told to prevent death (#7), making it a "less sinful" violation of the absolute rule against lying.

  This supports the exceptionless rule by ensuring that lying is never *normalized* as a good. It remains a sin—a cost to be paid—thereby preserving the integrity of the signaling system (speech) for the vast majority of human interactions.
