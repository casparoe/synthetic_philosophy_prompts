answer: |-
  This is a profound disagreement that touches on economics, psychology, and the philosophy of mind. You are arguing from a position often called **Revealed Preference**, while your friend is arguing from a **Belief-Desire Model** of human action.

  To answer your question directly: **Your friend has the logically stronger argument.**

  Here is the breakdown of why your friend is right about the inference, why your intuition feels so compelling, and the answer to the deeper question of whether action can ever reveal desire.

  ### 1. The Two Models of Action

  **Your View: Revealed Preference**
  In classical economics and rational choice theory, "wanting" is defined by what you choose. If you choose \$50 over \$100, the theory posits that you must value something else (like effort, risk avoidance, or time) more than that extra \$50. Therefore, your sister's choice to stay put reveals that she prefers the *current state* over the *promoted state*.
  *   **Strength:** It treats people as rational agents and avoids mind-reading. It focuses on outcomes.
  *   **Weakness:** It assumes the only barrier to action is a lack of desire. It ignores internal friction.

  **Your Friend's View: The Belief-Desire Model**
  In psychology and philosophy of action, behavior is usually seen as the product of two variables: **Desire** (what outcome do I want?) and **Belief** (what do I think will happen if I act?).
  *   **Formula:** Action = Desire $\times$ Belief $\times$ Ability.
  *   **The Friend's Point:** If "Belief" is near zero (e.g., "I will fail," "They actually don't want me to apply," "I'm not good enough"), the result is "No Action," even if "Desire" is high.
  *   **Strength:** It accounts for anxiety, imposter syndrome, risk aversion, and past trauma.
  *   **Weakness:** It is harder to prove, because beliefs are invisible.

  ### 2. Why the Friend Wins on Logic

  Your friend is correct because the same observed behavior (inaction) is **underdetermined** by the evidence. This is a philosophical concept meaning the available data is compatible with multiple theories.

  Consider this analogy:
  > A car is sitting in a driveway. It is not moving.
  > *   **Your inference:** The driver doesn't want to go anywhere.
  > *   **Your friend's inference:** The driver wants to go, but the engine is broken, or they are afraid of crashing.

  Watching the stationary car tells you nothing about the driver's intent. It only tells you about the car's motion. Similarly, watching your sister's career stagnation tells you about her *trajectory*, but it does not isolate her *motivation*.

  There are specific psychological phenomena that support your friend's reading:
  *   **Self-Efficacy:** She may believe she is incapable, despite evidence to the contrary.
  *   **Loss Aversion:** Psychologically, the pain of losing (or failing publicly) is about twice as powerful as the pleasure of gaining. She may want the promotion, but fear the humiliation of rejection more.
  *   **Status Quo Bias:** Humans have a strong default setting to do nothing when the cost of action is uncertain.

  ### 3. Can Action Ever Reveal Want?

  You asked: *"Can watching what someone does, on its own, ever really tell you what they want?"*

  **The short answer is no.**
  Action is a noisy signal. It is the output of a complex black box containing desires, beliefs, fears, constraints, habits, and biological states. Observing the output cannot definitively tell you the input.

  However, action is the *best* signal we have, provided we add context. To move from "she doesn't want it" to "she is afraid of it," you need more data points than just her inaction. You would need to observe:
  *   **Verbal reports:** Does she complain about her salary? Does she express envy of promoted peers?
  *   **Physiological responses:** Does she get anxious when promotions are discussed?
  *   **Counterfactuals:** If the promotion were handed to her automatically, would she accept it? (If yes, she wants the *role* but not the *risk*. If no, she truly prefers the *status quo*.)

  ### 4. Why Your Intuition Feels Right (and Why It Matters)

  Even though your friend is logically superior, your intuition is pragmatically useful. In social life, we generally have to treat **revealed preference as truth** because we cannot access other people's minds.

  If we treated every inaction as "secret desire blocked by fear," we would never be able to hold anyone accountable. We would constantly be trying to "fix" people's beliefs when they might simply be making a choice we disagree with.

  Your reading protects your boundaries: *"I cannot help someone who does not want to be helped."*
  Your friend's reading protects your sister's dignity: *"I should not judge someone's capacity based on their anxiety."*

  ### 5. Conclusion

  Your friend has the better argument regarding the **evidence**. Inaction is ambiguous; it proves neither desire nor lack thereof. It only proves that the *net motivation* (Desire minus Fear) was insufficient to trigger action.

  However, you have the better argument regarding **agency**. Ultimately, your sister is the only one who can bridge the gap between "wanting" and "doing." If she wants the promotion but cannot overcome the fear, the practical result is the same as if she didn't want it at all: she remains in the mid-level job.

  **The Verdict:**
  *   **On the epistemology (what can be known):** Your friend wins. You cannot read a mind by watching hands.
  *   **On the pragmatism (how to live):** You win. You must interact with people based on what they *do*, not what they might secretly *feel*.

  The tragedy of your sister's situation is likely that both of you are partially right. She may indeed want the promotion (Friend), but she has also made a subconscious calculation that the cost of trying is too high (You). Until she changes that calculation, her actions will continue to speak louder than her potential desires.
