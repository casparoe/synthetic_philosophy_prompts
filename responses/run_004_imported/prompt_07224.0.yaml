      *   *Section 1: The User's View (Revealed Preference).* Explain why this feels right. In economics, actions *define* preferences. If you don't buy the apple, you don't want it enough to pay the price.
      *   *Section 2: The Friend's View (The Belief-Desire Model).* Explain why this is psychologically robust. Action requires Desire + Belief. If Belief is zero, Action is zero, regardless of Desire. Mention "Self-Efficacy" and "Risk Aversion."
      *   *Section 3: Who is Right?* The friend is right about the *inference*. The data (inaction) is underdetermined. It doesn't isolate the variable "want."
