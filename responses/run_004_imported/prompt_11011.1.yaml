answer: |-
  This is a fantastic question, and it is wonderful that you are bringing forty years of field experience into conversation with your new studies in epistemology. You have stumbled upon one of the classic problems in the philosophy of science, and your intuition that something profound is happening here is spot on.

  You have effectively reconstructed the **Problem of the Criterion** and the challenge of **Radical Skepticism**, specifically applied to the philosophy of time and history.

  To answer your core question: **No, you are not in the same boat, even if both boats are floating on unprovable axioms.** However, understanding *why* they are different requires moving from a foundationalist view of knowledge (building on indubitable bedrock) to a coherentist or pragmatist view (weaving a web of justification).

  Here is an epistemological breakdown of your situation, tailored to your background.

  ### 1. The Logical Standoff: The Omphalos Hypothesis
  Your brother-in-law is utilizing a version of the **Omphalos hypothesis** (named after an 1857 book by Philip Henry Gosse). The argument is that God created the world with an "appearance of age." Adam had a navel (omphalos) though he was never born; trees had rings though they were never seedlings.

  Logically, this hypothesis is **unfalsifiable**. As you realized, if the premise is "God created the world last week with perfect traces of a billion-year history," no empirical data can refute it. Any data you bring (isotopes, light speed, sedimentation) is simply absorbed as part of the "appearance."

  In strict logical terms, you cannot prove him wrong. This is the skeptical trap you identified: *How do you prove the reliability of physical traces without assuming the reliability of physical traces?*

  ### 2. Are the Assumptions Equivalent?
  You asked if your bedrock assumption (physical traces track real time) is epistemically equivalent to his (God created an appearance of history).

  **In terms of "Ultimate Proof": Yes.**
  Neither of you can step outside your own skin to verify your starting axioms against reality "as it is in itself." You both operate within a framework. You operate within Methodological Naturalism; he operates within a specific Theological Literalism.

  **In terms of "Epistemic Virtue": No.**
  While both positions rest on assumptions, the assumptions are not equal in terms of **explanatory power**, **coherence**, and **fruitfulness**. This is where Inference to the Best Explanation (IBE) comes in, which is likely familiar from your philosophy auditing.

  *   **Coherence:** Your assumption (uniformitarianism/real time) coheres with everything else we know about physics, chemistry, biology, and thermodynamics. It creates a unified web of knowledge where geology matches astronomy matches nuclear physics. Your brother-in-law's assumption requires him to compartmentalize. He must accept that light behaves one way in a lab but another way in deep space; that decay rates are constant in a reactor but variable in a zircon crystal. His "boat" leaks everywhere except where he patches it with "God did it."
  *   **Predictive Power:** Your assumption allows you to predict where oil reserves are, where fossils will be found, and how groundwater moves. His assumption predicts nothing. It is purely post-hoc. It explains everything after the fact but offers no traction for future inquiry.
  *   **Simplicity (Occam's Razor):** Your model posits: *The rocks are old.* His model posits: *The rocks are young, but they look old, and the light is in transit, and the memories are implanted, and the isotopes are pre-decayed.* His model multiplies entities and mechanisms unnecessarily to save the phenomenon of a literal six-day creation.

  So, while you cannot *prove* your axiom, your axiom is **virtuous**. It earns its keep. His axiom is a "stopper"—it halts inquiry rather than facilitating it.

  ### 3. The Theological Epistemology
  Since your brother-in-law is arguing from a religious framework, there is an internal critique available to you that doesn't require you to be an atheist.

  The Omphalos hypothesis implies a **Deceptive God**.
  If God created light beams already halfway across the universe, he is creating a false history of stellar explosions that never happened. If he created fossils of extinct creatures in rock layers, he is planting false evidence of a history of death and struggle that never occurred.

  For many theologians (even conservative ones), this is unacceptable. It makes God a trickster who tests faith by planting false evidence in nature (which Christians often call "General Revelation") that contradicts Scripture ("Special Revelation"). You might ask him: *"Does God lie? If the rocks preach a sermon of deep time, is God a liar for making them preach that?"*

  This shifts the argument from "Science vs. Bible" to "What kind of God do you worship?" It attacks the coherence of *his* boat, rather than trying to sink it with your own.

  ### 4. Is There Any Point in Arguing Evidence?
  Practically speaking: **No.**

  You have identified that he is using an **immunization strategy**. In the sociology of knowledge, this is when a belief system is structured so that counter-evidence is reinterpreted as confirmation of the believer's faith (e.g., "The devil put those fossils there to test us" or "It's a test of faith to reject worldly science").

  Continuing to present evidence will likely result in the **Backfire Effect**, where he doubles down on his belief to protect his identity and community standing. You are speaking different epistemic languages. You are speaking the language of *public, verifiable evidence*; he is speaking the language of *private, revealed conviction*.

  **However, there is a point in changing the conversation.**
  Since you are studying epistemology, you might find it more fruitful to stop arguing *geology* and start arguing *epistemology*.
  *   "How do you decide when something looks old because it *is* old, versus when it looks old because God made it that way?"
  *   "If we can't trust our senses and measurements about the past, what *can* we trust?"
  *   "Is it possible that God wants us to use the minds He gave us to study the rocks He made?"

  ### 5. Summary for the Retired Geologist
  You are not in the same boat.
  *   **His boat** is anchored in a specific textual interpretation that requires constant, ad-hoc adjustments to ignore the physical world.
  *   **Your boat** is anchored in a methodological commitment that the universe is intelligible, consistent, and that effects have proportional causes.

  You cannot prove your anchor holds without assuming the ocean is real. But your boat sails; his is in drydock.

  **Recommendation:** Enjoy your philosophy classes. This Thanksgiving puzzle is a perfect case study for **Coherentism** vs. **Foundationalism**. As for your brother-in-law, love him as family, but recognize that you cannot logic someone out of a position they didn't logic themselves into. Save the geology for the students who want to learn it.

  You've earned the right to enjoy the rocks for what they are, without needing to defend their reality to someone committed to denying it.
