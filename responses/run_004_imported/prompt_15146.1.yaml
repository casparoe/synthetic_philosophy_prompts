      *   **The Philosophical Pivot:** Reframe the hypocrisy not as a disqualifier but as a human struggle. Connect it to the urgency of the crisis.
      *   **The Personal Man:** Balance the public firebrand with the private friend (warmth, family).
      *   **Closing:** A farewell that accepts the whole man, flaws and all.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with the late 80s. The department. The shared passion. "We were studying the earth while it was starting to scream."
      *   *The Public Alan:* He was loud. He was necessary. He testified. He scared people because they needed scaring.
      *   *The Complication:* I need to bring in the carbon footprint issue. *Drafting thought:* Don't hide it. "Alan knew the math on everything. Including himself." Mention the blog post indirectly or directly? Better directly but kindly. "There were spreadsheets."
      *   *The Philosophy (Subtle):* How to weave in "standing to blame"? *Idea:* Talk about the burden of speaking truth. "He believed the truth didn't require a saint to carry it."
      *   *The Private Alan:* He wasn't just a crusader. He was a friend. He loved his family. The drafty house was a home, not just a carbon source.
      *   *Resolution:* We don't have to agree with everything to miss him. The work remains.

      *   *Refining the "Standing to Blame" aspect:* The prompt asks for this concept to *shape* what is claimed.
