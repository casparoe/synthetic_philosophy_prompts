answer: |-
  Friends, family, colleagues, students.

  For those who don't know me, I'm [Your Name]. Alan and I met thirty-five years ago in the earth sciences department. I was in geophysics; he was in atmospheric science. Back then, we were just two grad students trying to understand how the planet worked. We didn't know yet that we were watching it change.

  We were young, and the world felt infinite. Alan had a laugh that could shake the dust off a seismograph. He was brilliant, yes, but more than that, he was intensely present. If you were talking to him, you were the only thing in the room. That is the Alan his family knew. The man who helped you move apartments, who remembered your birthday, who loved this drafty house of his not because it was efficient, but because it was full of people.

  But I also know the Alan the rest of you knew. The public Alan. The one who testified before Congress. The one whose name you heard in documentaries. The one who could make a room of senior executives go silent with a single slide.

  And I know that standing here, there is an elephant in the room. It's the same one that followed Alan around for the last fifteen years.

  Alan believed that the climate crisis was a fire in a theater, and he was the one shouting "Fire!" He didn't care if his voice was raspy. He didn't care if he was out of breath. He cared that we got out of the building.

  He was merciless about carbon. He called out oil executives. He called out senators with heated pools. And yes, sometimes, he called out grad students who flew home for Christmas. He demanded sacrifices from a world that was addicted to convenience.

  And he lived in a world of convenience, too. He flew business class. He heated this big, old house. There were spreadsheets published online that tallied his footprint and called him a fraud. It stung him. I know it did. He would come home from a trip, tired and jet-lagged, and see the comments, and he would pour a drink and sit in the dark.

  But he never denied the math. He never claimed purity. His defense, the one he gave me over dinner just a few years ago, was simple. He said, "Someone has to say the unfashionable true thing, even an imperfect messenger."

  I've spent my retirement reading a lot of philosophy. There is a debate in ethics about "standing." It asks whether a person loses the right to criticize a fault if they share that fault themselves. If I steal, do I have the standing to tell you not to steal?

  Alan lived inside that question every day. He knew that by his own metrics, his standing was compromised. He knew that for some of you in this room—colleagues, friends whose work he challenged—his criticism felt like it came from a place of privilege. That pain was real. I don't want to stand here and tell you that his personal choices didn't matter. They did. They mattered to him.

  But I also want to suggest that Alan understood something profound about urgency. He believed that if the house is burning, you don't check the credentials of the person ringing the alarm. You check the fire.

  He forfeited the comfort of being liked. He forfeited the comfort of being consistent. He chose to be effective instead. He accepted that he would be a target so that the data could remain the focus. He was willing to be the hypocrite if it meant the message survived the messenger.

  Was he perfect? No. Was he a good man? Yes.

  Those two things have to be able to sit in the same room. Especially today.

  To his family: He loved you more than he loved the atmosphere, and that is saying something. You were his reason for fighting. He wanted a world where you could breathe.

  To his colleagues: He respected you enough to tell you the hard truths. He knew you could take it. He knew the work was bigger than any of us.

  Alan is gone now. The carbon he emitted is in the air. The science he produced is in the libraries. The fire he warned us about is still burning.

  He didn't ask us to worship him. He asked us to listen to the science. He asked us to look at the data, even when it came from a flawed source. Even when it came from a flawed friend.

  So, I won't ask you to ignore the contradictions. I ask you to do what Alan always asked you to do: Look past the messenger. Look at the message. Look at the work. And then, go do what needs to be done.

  Rest well, Alan. You've carried enough for all of us.
