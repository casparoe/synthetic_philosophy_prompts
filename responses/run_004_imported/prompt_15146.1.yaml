      *   *Integration:* Instead of arguing the philosophy explicitly ("As we discuss in meta-ethics..."), embody it. Acknowledge the flaw, validate the pain it caused, but affirm the necessity of the work. The "standing" comes not from purity, but from urgency and care.

  3.  **Determine the Structure:**
      *   **Opening:** Establish the relationship (late 80s, earth sciences). Set a warm tone.
