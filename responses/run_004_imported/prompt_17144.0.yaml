      *   *Emphasis:* Highlight that Smith wasn't anti-empire per se, but anti-*bad-deal* empire. If the OTs don't pay for themselves *and* hurt the domestic tax base, they fail his test.
      *   *Key Insight:* The "monopoly" isn't on trade goods anymore, it's on *legal jurisdiction*. Smith would see this as an artificial privilege granted by the state to specific actors.

