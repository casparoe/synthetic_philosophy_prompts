          *   If I lean toward $A_A$, I update my belief that Death is in $D_A$. So $P(D_A)$ goes up.
          *   If $P(D_A)$ goes up, $EU(A_D)$ becomes higher.
          *   **Result:** No stable pure strategy. The agent oscillates.
      *   **CDT Solution:** CDT proponents (like Gibbard & Harper, later Joyce) often argue for *mixed strategies* (randomizing 50/50) to restore ratifiability. If I randomize, Death can't predict better than chance, so the evidential link is broken/weakened.
      *   **Critique:** It feels like the agent is "making" the news good by randomizing, rather than finding the good action. It seems to concede that the *act* itself is irrelevant, only the *probability* of the act matters to the predictor.

  4.  **Analyze Evidential Decision Theory (EDT):**
      *   **Mechanism:** Maximize expected utility based on *conditional* probabilities ($P(State | Action)$).
      *   **Calculation:**
          *   $EU(A_D) = P(D_A | A_D) \cdot 1 + P(D_D | A_D) \cdot 0$.
          *   Since Death predicts perfectly, $P(D_D | A_D) \approx 1$. So $P(D_A | A_D) \approx 0$.
