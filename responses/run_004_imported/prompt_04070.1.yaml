      *   **Mechanism:** Maximize expected utility based on *causal* counterfactuals ($P(State | do(Action))$).
      *   **Calculation:**
          *   Since the choice doesn't causally affect Death's location, $P(D_D | do(A_D)) = P(D_D)$ (prior probability).
          *   Let's assume a prior of 0.5 for simplicity (or whatever the agent believes before deliberating).
          *   $EU(A_D) = P(D_A) \cdot 1 + P(D_D) \cdot 0 = P(D_A)$.
          *   $EU(A_A) = P(D_D) \cdot 1 + P(D_A) \cdot 0 = P(D_D)$.
      *   **The Instability (Ratifiability):**
          *   If I lean toward $A_D$, I update my belief that Death is in $D_D$ (because Death predicts me). So $P(D_D)$ goes up.
