          *   (2) Theo: Interesting topological move (Reichenbach/Kant style). Weakens the *intuition* of twoness but doesn't prove impossibility.
          *   (3) Dana: Strong modal logic point. Possibility is enough for counterexample. Theo bears burden of proof for impossibility.
