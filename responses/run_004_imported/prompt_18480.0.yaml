          *   *The Trap:* If "2 miles from Sphere B" is a property of A, and "2 miles from Sphere A" is a property of B, they differ relationally. To maintain indiscernibility, we must exclude haecceitic relations (relations involving specific individuals).
          *   *Verdict:* This is the strongest philosophical objection to Black. It forces a distinction between *purely qualitative* relations and relations involving *thismess*.

      *   **Dana's Response to (4):**
          *   *Argument:* "Stands two miles from *some* sphere..." is general/qualitative. "Identical to *that* one" is specific.
          *   *Analysis:* This appeals to the distinction between *pure properties* (qualitative) and *impure properties* (involving specific individuals). PII is usually restricted to pure properties.
