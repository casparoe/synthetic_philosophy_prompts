answer: |-
  The banquet hall hummed with the clatter of cutlery and the low roar of post-panel decompression. Elena swirled her wine, watching the foam settle. Across from her, Marcus loosened his tie, looking equally exhausted.

  "They're selling faith now," Elena said, setting her glass down hard. "Did you hear the closing remark? 'Trust the mathematical consistency.' Since when did elegance become a substitute for data?"

  Marcus chewed a piece of bread thoughtfully. "Since always, mostly. You're treating Popper like he handed down tablets from the mountain. Falsifiability was a slogan, Elena, not a workflow. Historically, physicists never discarded a theory the moment an anomaly appeared."

  "They discarded ether," Elena countered. "They discarded steady-state cosmology. They did it because evidence killed them. What I heard tonight is a strategy to immunize theories against death. If you can't test it now, you say we need higher energies. If we can't reach those energies, you say the theory explains *why* we can't see the multiverse. That's not science; that's theology with better calculus."

  "That's the Duhem-Quine problem," Marcus said, pointing a fork at her. "You never test a hypothesis in isolation. You test it bundled with auxiliary assumptions about your instruments, your background theories, your data analysis. When an experiment fails, logic doesn't tell you whether the core theory is wrong or the auxiliaries are. String theorists are just adjusting the auxiliaries—assuming the scales are too high for current colliders."

  "Adjusting auxiliaries is fine if there's a path to verification," Elena said. "But what if the path is closed forever? If a theory is unfalsifiable in principle, not just in practice, it ceases to be physics. It becomes metaphysics. And if we let that slide, what stops us from funding astrology departments provided their charts are internally consistent?"

  "Because we have other criteria," Marcus said. "Look at Dawid's argument. It's not just 'you can't prove me wrong.' It's the 'No Alternatives' argument. Decades of brilliant minds have tried to find a different way to unify gravity and quantum mechanics. They've failed. That absence of competition isn't proof, but it is Bayesian evidence. It increases the probability that the only game in town is the right one."

  "Absence of evidence isn't evidence of absence," Elena shot back. "Maybe the problem is ill-posed. Maybe we're stuck because the paradigm is wrong, not because it's right and hidden. By locking onto string theory because 'nothing else works,' you create a sociological monopoly. Young physicists don't work on alternatives because they can't get jobs. So of course there are no alternatives. You've created a self-fulfilling prophecy."

  Marcus leaned back, conceding the point with a nod. "Sociology is a risk, I grant you. But epistemologically, you're demanding a purity that doesn't exist. Science is about rational belief under uncertainty. If a theory keeps explaining things it wasn't built to explain—like black hole entropy—that's 'Unexpected Explanatory Coherence.' That's non-empirical confirmation. It's not data, but it's not nothing."

  "It's not nothing, but it's not data," Elena insisted. "Data is the anchor. Without it, you drift. My fear isn't that they're wrong; it's that we're changing the definition of 'wrong.' If you remove the possibility of being proven false, you remove the mechanism that drives progress. You're asking us to bet the field on a hunch that might not pay out for centuries, if ever."

  "And what's the alternative?" Marcus asked. "Stop working on the only lead we have because it's hard? Science has always operated in the dark before the torch was lit. Atoms were metaphysical conjectures for centuries before Einstein gave us the handles to measure them. Were the atomists unscientific before 1905?"

  "Because they proposed experiments that *could* be done," Elena said. "Perrin eventually did them. If string theorists said, 'Build a collider the size of the galaxy and we can test this,' I'd respect that. But if they say, 'The nature of reality precludes testing,' then they've opted out of the empirical contract. I'm not asking for purity. I'm asking for a promise that there is a world where this theory could lose. If that world doesn't exist, neither does the science."

  Marcus sighed, picking up his wine. "So we're back to the boundary problem. Where do you draw the line between 'currently untestable' and 'forever untestable'? Because drawing that line too strictly might kill the next revolution before it breathes."

  "And drawing it too loosely might turn physics into a philosophy club," Elena replied, clinking her glass against his. "And I'd rather we starve than pretend we're eating."

  They drank in silence, the noise of the room rushing back in, the disagreement settling between them like a heavy check neither was willing to pick up.
