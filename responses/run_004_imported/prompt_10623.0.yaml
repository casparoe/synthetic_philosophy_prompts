answer: |-
  Here are 10 questions designed to corner the "resolute choice" defense without letting her retreat into standard textbook explanations. They move from the metaphysical foundations to technical vulnerabilities, then to psychological parallels, and finally to broader implications.

  ### 1. The "Willpower in Disguise" Objection
  Critics often describe resolute choice as willpower wearing a rationality costume. The charge is that at the moment of choice, your local preferences *actually* favor defecting from the plan, but you muscle through. If the normative force of the decision comes from your ability to suppress your current preferences rather than the preferences themselves, aren't you just conceding that the agent *would* defect if she thought she could get away with it? Is this rationality, or just strength of mind?

  *   **Likely Answer:** She will likely argue that resolution isn't "muscling through" but constitutive of diachronic agency—the future self *identifies* with the past plan, so the preference isn't actually overridden.
  *   **Follow-up:** "If identification is the key, then isn't the real work being done by a theory of personal identity, not decision theory? You seem to be solving a math problem with a metaphysical assumption. If I don't identify with my past self—say, due to trauma or radical value shift—does your theory declare me irrational, or just a different person?"

  ### 2. The Source of Normative Authority
  In a standard money pump, the agent loses money because her preferences shift over time. Resolute choice stops the pump by binding the future self to the past self's plan. But why does the past self have authority over the future self? If my future self is screaming that the plan is a mistake *by her own lights*, on what grounds do you say she is obligated to listen to a version of herself that no longer exists?

  *   **Likely Answer:** She will likely appeal to the "pragmatic necessity" of planning agency—we can't function as agents over time without granting past plans some weight.
  *   **Follow-up:** "That sounds like a pragmatic argument for *usefulness*, not a normative argument for *rationality*. I can be useful and deluded. Are you redefining rationality to mean 'whatever prevents you from being exploited,' even if it requires ignoring your current best judgment?"

  ### 3. The Bootstrapping Problem
  If I can make myself rational simply by resolving to stick to a plan, can I bootstrap any preference into rationality? Suppose I have a whim to eat mud. I know it's bad, but I resolve to stick to a plan of eating mud whenever offered. I avoid the pump because I don't trade the mud for cake. Have I made eating mud rational simply by being resolute about it?

  *   **Likely Answer:** She will likely say no; resolution only works for plans that are "reasonable" or "acceptable" at the outset.
  *   **Follow-up:** "Then we need a theory of which initial plans are acceptable. Doesn't that just push the problem back to the standard axioms you're trying to avoid? If the initial plan must satisfy Independence or Transitivity to be 'acceptable,' haven't you just smuggled the standard axioms in through the back door?"

  ### 4. Incomplete Preferences and the New Pumps
  Let's talk about the newer money-pump arguments targeting incomplete preferences, like those proposed by Gustafsson. These don't rely on intransitivity; they pump you through a chain of trades where you never directly compare the two 'incomparable' options, yet you still end up worse off. Resolute choice seems harder to apply here because there's no determinate plan to form—you're indifferent or undecided between the starting points. How does resolution get a foothold when the initial preference relation doesn't pick a unique path?

  *   **Likely Answer:** She will likely argue that the agent can arbitrarily *select* a path and then be resolute about that selection.
  *   **Follow-up:** "If the selection is arbitrary, then the rationality of the choice rests on a coin flip. Are you comfortable saying that rationality is compatible with arbitrary choice, provided you stubbornly stick to the arbitrariness? That seems to sever the link between rationality and reasons."

  ### 5. Information and Dynamic Updating
  Resolute choice requires ignoring local preferences at later nodes. But what if those local preferences shift because of *new information*? If I resolve to take Route A, but at the node I learn Route A is flooded, resolute choice seems to demand I ignore that information to stay 'rational.' Where do you draw the line between a preference shift that resolution should override and an information update that resolution should respect?

  *   **Likely Answer:** She will likely distinguish between "preference reversal" (which resolution blocks) and " Bayesian updating" (which resolution permits).
  *   **Follow-up:** "In Allais-style cases, the agent often claims the context *is* the information—the mere fact that a lottery is offered changes the risk profile. If the agent perceives the choice node itself as informative, doesn't your distinction collapse? How do you stop an agent from claiming every preference shift is actually an information update?"

  ### 6. Akrasia, Addiction, and Structural Identity
  Let's be point blank: Is ordinary akrasia—procrastination, addiction, breaking a diet—literally the same structural problem as a money pump? In both cases, I prefer Plan A ex-ante, but prefer Action B ex-post. If they are structurally identical, does resolute choice solve addiction? And if not, what is the structural difference that makes one a failure of rationality and the other a pathology?

  *   **Likely Answer:** She will likely say they are structurally similar but normatively distinct; addiction involves a hijacking of the reward system, whereas money pumps involve preference cycles.
  *   **Follow-up:** "If the structure is the same, the solution should be the same. If you tell an addict 'just be resolute,' and they can't, you diagnose pathology. If you tell an economic agent 'just be resolute,' and they can't, you diagnose irrationality. Why is the inability to execute a resolution a medical issue in one case and a logic error in the other? Is the line just where we decide to stop paying for treatment?"

  ### 7. The Phenomenology of Regret
  Imagine an agent who successfully avoids a money pump via resolute choice. She sticks to the plan, keeps her money, but at every single node, she experiences intense regret and a desire to have chosen differently. She feels miserable the whole time. You call this rational. But if rationality is supposed to guide us toward the good, what is 'good' about a decision procedure that guarantees phenomenological misery at every step of execution?

  *   **Likely Answer:** She will likely argue that rationality is about coherence and efficiency, not happiness or subjective satisfaction.
  *   **Follow-up:** "That's a stark view. But if rationality systematically diverges from the agent's own experienced welfare at the moment of action, why should the agent care about being rational? Are you defending a concept of rationality that the agent herself has no reason to adopt?"

  ### 8. The "Sophisticated" Alternative
  There's a rival view: 'Sophisticated Choice.' The agent anticipates her future weakness and chooses the best plan she knows she can actually stick to, even if it's suboptimal compared to the resolute plan. Why is Resolute Choice superior to Sophistication? Isn't Sophistication more honest about the agent's actual constraints, whereas Resolute Choice pretends the agent has powers she might not possess?

  *   **Likely Answer:** She will likely argue Sophistication leads to "plan reduction," where agents are forced into suboptimal outcomes because they don't trust themselves, whereas Resolution allows for optimal cooperation with oneself.
  *   **Follow-up:** "But that trust has to be earned. If I know I have a history of caving, isn't it *more* rational to be sophisticated and acknowledge my weakness? Isn't Resolute Choice essentially a theory for agents who are deluded about their own willpower?"

  ### 9. Market Implications and Social Rationality
  If everyone adopts resolute choice, markets might not clear in standard ways. Agents might refuse trades that look beneficial locally because they conflict with a global plan. Does your theory imply that a society of resolute choosers would look economically inefficient from the outside? Are you willing to accept that 'rational' agents might leave money on the table that 'irrational' sophisticated agents would pick up?

  *   **Likely Answer:** She will likely say that leaving money on the table isn't inefficient if the money was only available via a sequence of choices that violates the agent's integrity/plan.
  *   **Follow-up:** "So 'efficiency' is relative to the plan. But if two resolute agents face each other, and their plans are incompatible, do we just have a clash of wills? Does decision theory have anything to say about how to resolve conflicts between two resolute choosers, or does it just hand us off to game theory?"

  ### 10. Why Keep the Label "Rational"?
  Finally, a semantic challenge. You've described an agent who ignores her current preferences, overrides her local judgments, and potentially suffers regret, all to maintain consistency with a past intention. If you described this behavior in a person at a dinner party, we'd call it 'stubborn' or 'rigid.' Why fight so hard to keep the label 'rational' for this behavior? What work is that label doing, other than signaling that this is the behavior economists shouldn't try to arbitrage away?

  *   **Likely Answer:** She will likely argue that 'rationality' is about diachronic coherence, not synchronic satisfaction, and we need the label to distinguish this from mere irrational impulsivity.
  *   **Follow-up:** "But if the layperson's intuition of rationality aligns with 'doing what seems best right now given your goals,' and your theory contradicts that, aren't you just engaging in terminological stipulation? If you won the argument but lost the language, would the theory still stand?"
