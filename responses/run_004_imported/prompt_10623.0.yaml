prompt: |-
  I'm doing a magazine Q&A with a decision theorist next week who's built her whole reputation defending "resolute choice" as the way out of money-pump arguments -- basically the claim that an agent whose preferences break the standard axioms (intransitive preferences, say, or Allais-style violations of independence) can still count as rational, so long as she commits to a plan up front and actually follows through at the later choice node, even at the exact moment she'd rather deviate. I don't want the piece to just be her restating the view for the tenth time. Can you draft me 8-10 questions that push past that? I want at least one on whether "resolving to stick with it" is just willpower wearing a rationality costume -- isn't she basically conceding she'd defect if she thought she could get away with it -- one on how resolute choice is even supposed to extend to the newer money-pump arguments against incomplete preferences (the ones that pump you through a chain of trades that never directly compares the two "incomparable" options), and one asking her point blank whether ordinary akrasia, procrastination, addiction, that sort of thing, is literally the same structure as a money pump or just superficially similar. For each, throw in a quick follow-up keyed to whatever answer shes most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Subject:** A decision theorist known for defending "resolute choice" (McClennen/Bratman style, likely) against money-pump arguments.
      *   **Core View:** Agents with non-standard preferences (intransitive, Allais violations) are rational if they commit to a plan and stick to it, even if local preferences shift at later nodes.
      *   **Goal:** 8-10 interview questions that go *beyond* restating the view. Need to be probing, critical, and fresh.
      *   **Specific Requirements:**
          *   One question on "willpower vs. rationality" (is resolute choice just masking a desire to defect?).
          *   One question on incomplete preferences and new money-pump arguments (chains of trades avoiding direct comparison).
          *   One question on akrasia/procrastination/addiction vs. money pumps (structural identity vs. analogy).
          *   Each question needs a tailored follow-up based on the likely answer.
      *   **Tone:** Magazine Q&A (accessible but intellectually rigorous), challenging but respectful.

  2.  **Deconstruct "Resolute Choice":**
      *   *What is it?* It's a response to dynamic inconsistency. Standard Expected Utility Theory (EUT) says you should be dynamically consistent (Sophisticated Choice or Separability). Resolute Choice says you can bind your future self to a past plan even if the future self would prefer otherwise *at that moment*.
      *   *The Criticism:* It looks like ad-hocery. It looks like brute willpower. It doesn't explain *why* the past plan binds the future self normatively.
      *   *The Context:* Money pumps exploit dynamic inconsistency to show you end up worse off. Resolute choice blocks the pump by refusing the trade at the critical node.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Willpower vs. Rationality.*
          *   *Draft:* Is this just willpower?
          *   *Refinement:* Needs to hit the "rationality costume" angle. If the local preference says B > A, but you choose A because of a plan, aren't you just overriding rationality with strength of mind?
          *   *Follow-up:* If she says "No, it's normative," ask about the source of the norm.

      *   *Requirement 2: Incomplete Preferences & New Pumps.*
          *   *Draft:* What about incomplete preferences?
          *   *Refinement:* Mention the specific "money pump without direct comparison" arguments (e.g., Gustafsson or similar recent work). If I prefer A to B, B to C, but A and C are incomparable, can resolute choice save me?
          *   *Follow-up:* If she says "Yes," ask how the plan is formed without a complete ranking.

      *   *Requirement 3: Akrasia/Addiction vs. Money Pumps.*
          *   *Draft:* Is addiction a money pump?
          *   *Refinement:* Distinguish between structural identity and metaphor. If they are the same, does resolute choice solve addiction? If not, what's the difference?
          *   *Follow-up:* If she says "Same structure," ask why we treat addicts with compassion but money-pumped agents with scorn.

      *   *Requirement 4: The Source of Normativity (General).*
          *   *Idea:* Where does the authority of the past self come from? Why should Future-Me listen to Past-Me?
          *   *Follow-up:* If she appeals to agency over time, ask about cases where Past-Me was ignorant.

      *   *Requirement 5: The "Bootstrapping" Objection.*
          *   *Idea:* Can I just resolve to believe anything? Can I resolve to prefer mud over pie?
          *   *Follow-up:* If she says "No, must be reasonable," ask what constraints exist.

      *   *Requirement 6: Regret and Diachronic Agency.*
          *   *Idea:* If I stick to the plan but regret it at the moment, am I rational?
          *   *Follow-up:* If she says "Yes," ask about the phenomenology of rationality.

      *   *Requirement 7: Strategic vs. Rational.*
          *   *Idea:* Is this just game theory against oneself?
          *   *Follow-up:* If yes, does that reduce rationality to power dynamics?

      *   *Requirement 8: The Cost of Resolution.*
          *   *Idea:* Maintaining resolution costs cognitive energy. Is that accounted for?
          *   *Follow-up:* If no, isn't the theory idealized to the point of uselessness?

      *   *Requirement 9: Learning and Updating.*
          *   *Idea:* What if I learn something new? Does resolution forbid updating?
          *   *Follow-up:* If she distinguishes, ask for the bright line.

      *   *Requirement 10: The "So What?" for Economics.*
          *   *Idea:* If everyone is resolute, do markets still clear?
          *   *Follow-up:* If markets fail, is resolute choice socially dangerous?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics covered? Yes. Follow-ups included? Yes.
      *   Tone check: Ensure they sound like a journalist talking to an academic, not a grad student seminar. Punchy intros, clear stakes.
      *   *Self-Correction on Q2 (Incomplete Preferences):* Make sure to reference the specific "non-comparative" pumps (like the money pump for incomplete preferences that doesn't rely on strict preference cycles but on dominance).
      *   *Self-Correction on Q1 (Willpower):* Ensure the "rationality costume" phrasing is used or echoed.

  5.  **Final Polish:** Organize logically. Start with the core metaphysical/normative tension, move to specific technical challenges (incomplete prefs), then to psychological parallels (akrasia), and end with broader implications. (Decided to group them slightly differently for flow: Foundation -> Technical Challenges -> Psychological/Real World -> Implications).

