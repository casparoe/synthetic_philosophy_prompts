answer: |-
  **MEMORANDUM OF DECISION (DRAFT)**

  **TO:** Competition Integrity Panel
  **FROM:** [Your Name/Panel Subcommittee]
  **DATE:** October 26, 2023
  **SUBJECT:** Ruling on 4x400m Relay Record Validity and Athlete Liability (Case #23-09)

  **1. ISSUE**
  The Panel must determine the status of a Meet Record set by Club A's 4x400m relay team following a post-meet anti-doping violation by one team member. Specifically:
  1.  Does the record stand, is it voided, or is it annotated?
  2.  Do the three non-violating teammates face personal sanctions beyond the team result?

  **2. ANALYSIS OF "JOINT PERFORMANCE"**
  The core dispute centers on the interpretation of Rule 14.1: *a team's time "constitutes a single joint performance for record and results purposes."*

  One interpretation suggests this is merely a scoring convention (i.e., we record one time, not four). The Panel rejects this limited view. In the context of a relay, "joint performance" describes the physical and regulatory reality of the event, not just the bookkeeping.

  *   **Physical Interdependence:** A 4x400m relay is not four sequential individual races. It is a single event defined by transfer zones, pacing strategies, and momentum exchange. The speed of Leg 2 dictates the approach of Leg 3; the stamina of Leg 3 determines the start window for Leg 4. A performance-enhancing substance in one leg alters the physiological output of that leg, which mechanically alters the race conditions for the subsequent legs (e.g., a faster handoff due to stimulant-enhanced reaction time or speed). Therefore, the *time* recorded is the product of the four legs combined; if one input is illicit, the total output is compromised.
  *   **Regulatory Interdependence:** The rule establishes the *Team* as the competitor of record, not the individuals. The individuals are the constituent parts of that single competitor. For a "joint performance" to be eligible for a record, all constituent parts must be eligible under the rules of competition. To allow the record to stand would be to acknowledge a "joint performance" that only partially complied with the conditions of entry.

  **3. DISTINCTION BETWEEN RESULT INTEGRITY AND PERSONAL LIABILITY**
  While the *performance* is joint, the *violation* is individual. The Panel must distinguish between the validity of the result and the culpability of the athletes.

  *   **Voiding the Record:** Because the "joint performance" relies on the eligibility of all components, the discovery of an ineligible component (the doped athlete) renders the entire performance ineligible for record purposes. This is not a punishment of the clean runners; it is a correction of the record. A meet record must represent the fastest time achieved under compliant conditions. This time was not achieved under compliant conditions. An asterisk is insufficient; a record is a binary status (valid/invalid).
  *   **Sanctioning Clean Runners:** Personal sanctions (suspension, probation) require evidence of fault, negligence, or intent. The three clean runners tested negative and provided testimony corroborating their lack of knowledge. The "joint performance" rule governs the *result*, not the *discipline* of individuals. To sanction the clean runners for a teammate's secret violation would violate the principle of personal responsibility. They lose the *result* (the medal/record) because they were part of a team that is now disqualified, but they do not lose their *eligibility* to compete in the future.

  **4. RULING & RECOMMENDATION**
  Based on the above, the Panel moves to adopt the following findings:

  1.  **Team Result:** The 4x400m relay time is **disqualified and voided**. The Meet Record is **nullified**. The result is removed from the record books entirely; no asterisk is applied as the performance is not recognized as a valid competitive result.
  2.  **Team Standing:** Club A forfeits any team points or awards associated with this placement. Placement awards are redistributed to the next eligible team.
  3.  **Individual Liability:**
      *   **Violating Athlete:** Referred to the disciplinary committee for standard individual sanctions regarding the stimulant violation.
      *   **Non-Violating Teammates:** No personal sanctions, suspensions, or strikes are issued. Their eligibility to compete in future meets remains unaffected. They are not required to return individual participation awards (if distinct from team placement awards), but must return team medals/plaques.

  **5. CONCLUSION**
  This ruling upholds the integrity of the "joint performance" rule by acknowledging that a relay result cannot be surgically separated from the eligibility of its parts. Simultaneously, it protects the fairness due to the innocent teammates by limiting the consequence to the specific result achieved, rather than their standing as athletes.

  **Action Required:** Panel vote to adopt this finding at the next meeting.
