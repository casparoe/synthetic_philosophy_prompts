          *   Must include an *actual recommendation* (no "more study").
          *   Must address the specific couple's request *and* standing policy.
          *   Must engage honestly with the autonomy/paternalism objection (cannot dismiss it easily).

  2.  **Determine the Ethical Stance/Recommendation:**
      *   *Option 1 (Full Access):* Respects autonomy but risks eugenics-lite, exacerbates inequality, and ignores the medical mission of the clinic. Ignores the pleiotropy risk (education score = bipolar risk).
      *   *Option 2 (Total Ban):* Respects medical mission but is strongly paternalistic. Data exists. Patients might go elsewhere (unregulated markets).
      *   *Option 3 (Middle Ground/Nuanced Restriction):* This is usually the most defensible position in clinical ethics.
