answer: |-
  **MEMORANDUM**

  **TO:** Reproductive Genetics Ethics Advisory Committee
  **FROM:** [Your Name], Patient-Care Coordinator
  **DATE:** [Current Date]
  **SUBJECT:** Proposed Recommendation: Polygenic Risk Scoring and Non-Medical Trait Selection

  **Purpose**
  This memo outlines a recommended course of action regarding the new polygenic risk scoring (PRS) capabilities offered by our contracted genetics laboratory. Specifically, it addresses the pending request from [Patient Couple ID] for non-medical trait selection and proposes a standing policy to close the gap in our current consent language.

  **Context**
  Our laboratory can now generate supplementary reports from existing biopsy data. These include:
  1.  **Disease Module:** Adult-onset polygenic conditions (e.g., Type 2 diabetes, schizophrenia).
  2.  **Trait Module:** Non-medical characteristics (e.g., adult height, educational attainment).

  Our current consent policy authorizes testing "to reduce the risk of serious genetic disease and to support a healthy pregnancy." It does not explicitly address polygenic scores or non-medical traits.

  **Ethical Analysis: Autonomy vs. Professional Integrity**
  The committee is divided between respecting patient autonomy and maintaining the medical mission of this practice.

  *The Autonomy Argument:* Colleagues arguing for full disclosure note that the genomic data already exists. Withholding it treats competent adults as incapable of weighing risk/benefit trade-offs for their own future children. In this view, denying the report is paternalistic; it prioritizes the committee's moral comfort over the patients' legal right to information regarding their embryos.

  *The Medical Mission Argument:* However, clinical genetics is not a neutral information service. We operate under a mandate of non-maleficence. Providing "educational attainment" scores functions as cognitive enhancement selection, which falls outside the scope of reproductive medicine. Facilitating this could exacerbate social inequities and misrepresent the predictive power of these scores (which are probabilistic, not deterministic).

  *The Pleiotropy Complication:* Crucially, we cannot cleanly separate "traits" from "disease." The genetic variants associated with higher educational attainment scores are statistically linked to an elevated risk of bipolar disorder. Releasing the trait module without the counseling protocols required for psychiatric risk would inadvertently disclose disease risk without medical safeguards. Therefore, providing the trait module is not merely "enhancement"; it is potentially unmediated psychiatric risk disclosure.

  **Recommendation for Pending Request**
  I recommend the committee **deny the request for the Trait Module** (height and educational attainment) for this couple, while **approving the Disease Module** contingent upon enhanced genetic counseling.

  *   **Rationale:** While withholding the data limits autonomy, it protects the couple from making selection decisions based on clinically ambiguous data that carries hidden psychiatric risks (pleiotropy). We are not withholding the *existence* of the data, but declining to generate a clinical report that validates non-medical selection criteria.
  *   **Counseling Requirement:** If they proceed with the Disease Module, counseling must explicitly clarify that polygenic risk is probabilistic and does not guarantee disease presence or absence.

  **Recommendation for Standing Policy**
  To prevent ad-hoc decision-making in the future, I recommend we update our consent policy immediately to reflect the following:

  1.  **Scope of Testing:** Genetic testing is permitted solely for the identification of serious, adult-onset medical conditions or chromosomal abnormalities that impact pregnancy viability.
  2.  **Exclusion of Traits:** The practice will not facilitate embryo selection based on non-medical traits (e.g., height, cognitive proxies, appearance), even if the data is technically available from existing biopsies.
  3.  **Data Handling:** Where disease and trait data are inextricably linked (pleiotropy), the laboratory should be instructed to suppress trait-specific outputs to ensure reporting remains within the bounds of medical necessity.

  **Conclusion**
  This approach acknowledges the autonomy objection by allowing disease-risk information but draws a bright line at enhancement. It recognizes that while patients own the decision, clinicians own the *interpretation* and the *medical framework*. By updating the policy, we ensure future couples are informed of these limitations prior to cycle start, rather than confronting this ethical dilemma at the point of embryo selection.

  I request the committee review this proposal prior to our vote on Wednesday.
