      *   **The Issue:** A couple wants a supplementary polygenic report (disease + traits like height/education) for embryo selection (tiebreaker).
      *   **Committee Split:**
          *   Side A: Ban trait module (enhancement vs. medicine, paternalistic but protective).
          *   Side B: Provide data (autonomy, data exists, withholding is paternalistic).
      *   **Complication:** Pleiotropy (genetic overlap). Trait scores (education) are linked to disease risks (bipolar). Separating them might be technically incoherent.
      *   **Policy Gap:** Current consent policy is vague ("reduce risk of serious genetic disease," "support healthy pregnancy").
      *   **Requirements:**
