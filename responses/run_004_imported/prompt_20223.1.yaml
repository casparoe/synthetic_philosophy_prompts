          *   *Why?* The "medical mission" argument holds weight against enhancement. The pleiotropy issue makes the trait module medically risky (reporting education might inadvertently report bipolar risk without counseling).
          *   *Addressing Autonomy:* Acknowledge it. Patients have rights, but clinicians have professional integrity and non-maleficence duties. The "data exists" argument is weak if the data is clinically unvalidated or potentially harmful.
          *   *Policy:* Update consent language to explicitly exclude non-medical traits until clinical utility is proven.

      *   *Refining the Recommendation:* Given the pleiotropy wrinkle (education linked to bipolar), separating them is hard. If the lab can't separate them cleanly, providing the education score *is* providing psychiatric risk data without the proper framework. This strengthens the argument to deny the trait module.
      *   *Decision:* Recommend denying the trait module for this couple and establishing a policy against non-medical trait selection, while allowing disease PRS (Polygenic Risk Scores) under strict counseling. This balances autonomy (they get disease info) with non-maleficence (no enhancement/potential harm).

