prompt: |-
  I was recently elected to the board of a small community theater company. Its founding charter borrows Du Bois's own criteria for the Krigwa Players -- that Black theater should be about, by, for, and near Black people -- and cites his 1926 claim, from "Criteria of Negro Art," that all art is propaganda. That charter is now being tested: our current production, a formally daring play about a Black family's unraveling through addiction and violence, has just been offered a transfer to a major regional festival whose subscriber base is overwhelmingly white, and the board has split down the middle. Some members argue that accepting would do exactly what Du Bois accused Claude McKay and Carl Van Vechten of doing -- feeding white audiences' appetite for Black degradation -- while others argue that refusing on those grounds is precisely the respectability policing that younger Harlem Renaissance writers, Langston Hughes chief among them, rejected. Please draft the memo I'll bring to next week's board vote: it should recommend whether we accept the transfer, decline it, or accept it with specific conditions, engage Du Bois's actual argument rather than a flattened version of it, and take seriously whichever side's position you don't adopt.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a small community theater company.
      *   **Context:** The company's charter is based on W.E.B. Du Bois's "Criteria of Negro Art" (1926) and the Krigwa Players' mission (About, By, For, Near Black people).
      *   **Conflict:** A current production (formally daring, depicts Black family unraveling via addiction/violence) is offered a transfer to a major regional festival (overwhelmingly white subscriber base).
      *   **The Split:**
          *   *Side A (Decline):* Accepting feeds white voyeurism/degradation (Du Bois's critique of McKay/Van Vechten).
          *   *Side B (Accept):* Refusing is respectability policing (Hughes's critique of Du Bois).
      *   **Task:** Draft a memo for the next board vote.
      *   **Requirements:**
          *   Recommend a course of action (Accept, Decline, or Accept with Conditions).
          *   Engage Du Bois's *actual* argument (not a flattened version).
          *   Take seriously the opposing position (whatever recommendation is made).

  2.  **Deconstruct the Intellectual History:**
      *   **Du Bois ("Criteria of Negro Art"):**
          *   Famous quote: "All Art is propaganda and ever must be."
          *   Nuance: He didn't mean *only* political pamphlets. He meant art inevitably shapes perception. Therefore, Black artists have a responsibility to counter racist propaganda with humanizing propaganda.
          *   Krigwa Criteria: About, By, For, Near. "Near" implies accessibility and community relevance, not just geographic proximity.
          *   Du Bois's fear: Art that confirms white stereotypes (primitivism, pathology) without context or redemptive vision harms the political struggle for equality.
      *   **Hughes ("The Negro Artist and the Racial Mountain"):**
          *   Critique: Du Bois's demand for "uplifting" art restricts artistic freedom.
          *   Argument: Black artists should depict life *as it is*, including the ugly parts, without worrying about what white people think or whether it makes the race "look good."
          *   Risk: Avoiding difficult truths becomes a form of internalized respectability politics.
      *   **The Play:** "Formally daring," "unraveling through addiction and violence." This sounds like it leans towards the Hughes side (unflinching realism) but risks triggering the Du Bois side (pathology porn for white gaze).

  3.  **Evaluate the Options:**
      *   *Option 1: Decline.* Protects the community from exploitation. Honors "For" and "Near." Risks isolating the company and censoring the artists (Hughes's critique).
      *   *Option 2: Accept Unconditionally.* Maximizes reach and revenue. Honors artistic freedom. Risks violating "For" and "Near" (white gaze) and potentially reinforcing harmful narratives without context (Du Bois's fear).
      *   *Option 3: Accept with Conditions.* Attempts a synthesis. Acknowledges the value of the work (Hughes) but mitigates the risk of misinterpretation/exploitation (Du Bois). Ensures the "For" and "Near" criteria are met even in a white space.

      *Decision:* Option 3 is the most nuanced and actionable for a board memo. It shows leadership and intellectual rigor. It avoids the binary trap.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the gravity of the decision relative to the charter.
      *   **Engaging Du Bois (The Core):**
          *   Need to correct the record. Du Bois didn't say "Art must be nice." He said "Art must be *effective* propaganda."
          *   If the play reinforces stereotypes *without* challenging the audience, it fails Du Bois.
          *   If the play hides truth to please respectability, it fails Du Bois (and Hughes).
          *   Key insight: Du Bois wanted art to fight *against* the propaganda of racism. Does this play fight it or feed it? Depends on *context*.
      *   **Engaging Hughes/The Opposition:**
          *   Acknowledge the validity of the "Accept" argument.
          *   Refusing the transfer *is* a form of gatekeeping.
          *   The artists deserve a wider stage.
          *   Hiding Black pain can be its own lie.
      *   **The Recommendation (Accept with Conditions):**
          *   Why? It honors the artists (Hughes) but protects the mission (Du Bois).
          *   *Condition 1: Contextualization.* Talkbacks, program notes. Frame the "propaganda."
          *   *Condition 2: Community Access.* "Near" means Black people need to see it too. Ticket subsidies/transport for the home community.
          *   *Condition 3: Artistic Control.* No edits to soften the blow for white comfort.
      *   **Closing:** Reiterate commitment to the charter. Call for unity.

  5.  **Refining the Tone:**
      *   Needs to be diplomatic but firm.
      *   Intellectual but accessible (it's a board memo, not a dissertation).
      *   Respectful of the split.
      *   *Self-Correction during drafting:* Make sure I don't caricature Du Bois as just a "respectability politician." He was radical, but strategic. His issue with *Nigger Heaven* (Van Vechten) wasn't that it showed Black life, but that it showed it *for white consumption* in a way that confirmed exoticism. The distinction is the *gaze*.

  6.  **Final Review against Constraints:**
      *   Recommend action? Yes (Conditional Acceptance).
      *   Engage Du Bois's actual argument? Yes (Propaganda as tool for truth/justice, not just "uplift").
      *   Take opposing side seriously? Yes (Acknowledge Hughes's critique of censorship).
      *   Charter alignment? Yes (About, By, For, Near).

  7.  **Final Polish:** Check the flow and ensure the "Conditions" are practical for a theater company. (e.g., ensuring ticket revenue sharing or specific outreach). *Wait, one nuance:* Du Bois's "For" is crucial. If the audience is white, is it "For" Black people? Only if the *purpose* serves Black people. I need to emphasize that the *benefit* must return to the community.

      *(Self-Correction)*: I should make sure the memo explicitly mentions the "About, By, For, Near" framework in the recommendation.

      *(Refining Du Bois)*: Du Bois's "propaganda" wasn't just "make us look good." It was "make the truth undeniable." If the play shows addiction, does it blame the family or the system? The memo should suggest ensuring the *narrative framing* supports the latter if possible, or at least discusses it.

      *(Refining Hughes)*: The opposing view is that saying "no" is paternalistic. I need to validate that the actors and playwright want this.

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Regional Festival Transfer Offer

  **Purpose**

  This memo addresses the offer to transfer our current production to the [Name of Regional Festival] next season. As you know, this decision strikes at the heart of our founding charter, which adopts W.E.B. Du Bois's criteria for the Krigwa Players: that Black theater must be *About, By, For,* and *Near* Black people.

  The board is currently divided. One faction argues that accepting the offer violates the *For* and *Near* criteria, risking the exploitation of Black trauma for a white gaze—a concern rooted in Du Bois's critiques of the Harlem Renaissance. The opposing faction argues that declining the offer constitutes respectability policing, stifling artistic freedom in a manner rejected by Langston Hughes and his contemporaries.

  After reviewing the charter, the text of Du Bois's "Criteria of Negro Art" (1926), and the artistic merits of the production, **I recommend that we accept the transfer offer, contingent upon three specific conditions regarding context, access, and artistic integrity.**

  **Engaging Du Bois: Propaganda as Truth, Not Just Uplift**

  To make this decision, we must correct a common flattening of Du Bois's argument. When Du Bois wrote, "All Art is propaganda and ever must be," he was not demanding that Black art be polite, sanitized, or solely focused on "uplift." He was not arguing for the erasure of Black pain.

  Du Bois's critique of Claude McKay and Carl Van Vechten was not that they depicted Black struggle or vice, but that they did so *without a corrective vision*, allowing white audiences to consume Black pathology as entertainment. For Du Bois, propaganda was a tool to fight the *dominant* propaganda of racism. If our play depicts addiction and violence, Du Bois would ask: Does this depiction humanize the subjects, or does it reduce them to stereotypes that justify their oppression? Does it challenge the audience, or comfort them in their prejudices?

  If we decline the transfer solely because the content is dark, we risk falling into the trap of respectability politics—implying that Black art is only safe when it portrays Black excellence. That is not what Du Bois asked for; he asked for art that tells the truth *in the service of justice*.

  **Taking the Opposition Seriously: The Hughes Critique**

  However, the board members arguing for acceptance without reservation raise a vital point, echoing Langston Hughes's "The Negro Artist and the Racial Mountain." Hughes argued that the demand to always represent the race "positively" is a burden white artists do not bear. It restricts the artist's right to explore the full complexity of human experience, including the ugly, the broken, and the ambiguous.

  Our playwright and cast have created something formally daring. To block their work from a major festival because the audience is white could be seen as paternalistic. It suggests we do not trust our own art to withstand the white gaze, or that we believe Black stories only belong in Black rooms. Furthermore, refusing the transfer denies our company essential revenue and visibility, which ultimately limits our capacity to serve our home community. We must honor the artists' agency.

  **Recommendation: Conditional Acceptance**

  We can honor Du Bois's strategic vision *and* Hughes's artistic freedom by ensuring the context of the performance aligns with our charter. We should accept the transfer, provided the following conditions are met:

  **1. Contextual Framing (Addressing the "Propaganda")**
  Du Bois insisted art must be intentional. We cannot allow the play to land in a vacuum where white voyeurism might go unchecked.
  *   *Condition:* The festival must agree to host post-show talkbacks facilitated by our company, focusing on the systemic roots of the issues depicted (addiction, violence) rather than individual pathology.
  *   *Condition:* Program notes must include a statement of mission from our company, framing the work not as a spectacle of degradation, but as a testament to survival and a critique of the conditions that lead to unraveling. We control the narrative frame.

  **2. Restoring the "Near" and "For" (Community Access)**
  Our charter states theater must be *Near* and *For* Black people. A festival with a white subscriber base risks violating this. We must bring our community to the festival, even if the festival does not come to us.
  *   *Condition:* A portion of the transfer fee must be earmarked to subsidize tickets and transportation for our home community members to attend the festival performances. We ensure Black audiences are present in the room to witness their own stories being told, reclaiming the space.

  **3. Artistic Integrity (Resisting Respectability)**
  To honor the Hughes perspective and the artists' vision:
  *   *Condition:* The festival must guarantee no editorial changes are requested to "soften" the language or themes for their subscriber base. The art remains *By* the creators, uncompromised by the demographic shift.

  **Conclusion**

  Du Bois wrote that the duty of the Black artist is "to find out the truth and to tell it." If we hide our family's unraveling because it is uncomfortable, we lie. If we show that unraveling to a white audience without context or community presence, we risk exploitation.

  By accepting with these conditions, we assert that our work is robust enough to travel, but our mission is non-negotiable. We allow the artists to climb Hughes's "racial mountain" while ensuring Du Bois's demand for purposeful propaganda is met. We turn a potential exploitation into an act of intervention.

  I move that we open negotiations with the festival based on these three conditions.
