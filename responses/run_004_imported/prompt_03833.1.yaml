answer: |-
  I am so sorry for your loss, and for the added burden this situation has placed on you and your sister during such a difficult time. It is incredibly common for grief to complicate logistics, and for logistics to then complicate grief.

  Your friend was absolutely right. There is a very established framework for exactly what is happening to you. It comes from **Game Theory**, a branch of economics and mathematics that studies strategic decision-making.

  Here is the breakdown of the concepts at play, why your current strategy is failing, and how game theory suggests you can actually solve this without either of you "losing."

  ### 1. The Diagnosis: What is happening?

  There are three specific economic concepts describing your situation.

  **A. The Game of Chicken**
  Your lawyers described a "Game of Chicken." Imagine two drivers speeding toward each other. The first to swerve is the "chicken" (the loser). If neither swerves, they crash (the worst outcome).
  *   **The Trap:** You are both waiting for the other to swerve (compromise).
  *   **The Crash:** The "crash" in your scenario isn't a physical collision; it is the depletion of the estate through legal fees and house maintenance costs, plus the long-term damage to your relationship.
  *   **The Equilibrium:** You are currently in a **Nash Equilibrium** where neither of you moves because, given what the other person is doing, staying rigid feels like the safest option. But it is a *bad* equilibrium because you are both losing money every week.

  **B. The Prisoner's Dilemma**
  This is similar but focuses on cooperation. In a Prisoner's Dilemma, two people acting in their own self-interest (holding out for more money) produce a worse outcome for both than if they had cooperated (splitting the difference).
  *   Right now, you are both "defecting" (holding firm).
  *   If you both "cooperated" (compromised), you would both be wealthier and happier.
  *   The fear is that if you cooperate and she doesn't, you get taken advantage of. This fear keeps you stuck.

  **C. The Principal-Agent Problem (The Lawyers)**
  This is perhaps the most critical insight. In economics, a "Principal" is you, and the "Agent" is the person you hire to act on your behalf (the lawyer).
  *   **Misaligned Incentives:** You want the estate settled *quickly* to stop the bleeding of costs. Your lawyers, however, are paid *by the hour*.
  *   **The Conflict:** It is not in your lawyers' financial interest for you to settle quickly. Their advice ("send a final number and don't move") is a litigation tactic designed to maximize leverage, but it also maximizes billable hours. They are incentivized to keep the game going, even though it costs you money.

  ### 2. How to Get Unstuck (Without "Caving")

  Game theory suggests that to solve a coordination problem like this, you need to change the structure of the game. You cannot solve this *within* the current rules because the rules are designed to keep you stuck.

  Here are four strategies to break the deadlock:

  **A. Introduce a "Schelling Point"**
  Economist Thomas Schelling described a "focal point" that people naturally converge on without communication because it feels salient or fair.
  *   **The Strategy:** In estate disputes, the 50/50 split is the ultimate Schelling Point. It is the natural focal point.
  *   **The Move:** You don't need to offer 50/50. You need to agree *with your sister* to accept the Schelling Point. Since you said you still get along on the phone, have a conversation where you explicitly say: *"The lawyers have put us in a Game of Chicken. If we wait for the other to blink, the lawyers win and we lose. Let's agree to ignore the 'final numbers' and just meet at the 50/50 mark because that is the fair focal point."*
  *   **Why it works:** It removes the "who moved first" dynamic. You aren't caving to *her*; you are both caving to *fairness*.

  **B. Hire a Mediator (Change the Agent)**
  Your current lawyers are adversarial agents. You need a neutral agent.
  *   **The Strategy:** Jointly hire a professional probate mediator. This is different from a lawyer. Their goal is settlement, not litigation.
  *   **The Move:** Tell your current lawyers you are pausing negotiations to try mediation. The mediator will suggest a number.
  *   **Why it works:** This solves the "face-saving" problem. If the mediator suggests the middle number, neither of you has to admit you moved first. You can both tell your lawyers, *"We accepted the mediator's recommendation."* This allows you to bypass the "who blinks first" trap.

  **C. Cap the Costs (Change the Incentives)**
  You need to align your lawyers' incentives with yours.
  *   **The Strategy:** Instruct your lawyers that you are authorizing them to negotiate only up to a certain dollar amount in fees, or that you require a flat fee for the remainder of the estate settlement.
  *   **The Move:** Tell your lawyer: *"I understand your strategy, but the cost of carrying the house and your fees is exceeding the value of the gap between us and my sister. I am instructing you to prioritize a settlement within 30 days, even if it means compromising on the number."*
  *   **Why it works:** It reasserts you as the Principal. It signals that you will not pay for a prolonged game of chicken.

  **D. Reframe the "Win"**
  Currently, you define "winning" as getting more money than your sister. Game theory suggests you redefine the "opponent."
  *   **The Strategy:** You and your sister are not playing against each other; you are a team playing against the *costs*.
  *   **The Move:** Calculate the exact cost of the standoff. (e.g., $500/week in taxes/utilities + $1,000/week in legal fees = $1,500/week loss).
  *   **The Pitch:** Send your sister a text: *"I calculated that this standoff is costing us $1,500 a week. That's money Mom would have wanted us to have, not the lawyers. Let's split the difference and stop the bleeding."*
  *   **Why it works:** It makes the enemy the *situation*, not each other.

  ### Summary Recommendation

  Your friend was right: this is a classic economic trap. But the solution is also economic.

  1.  **Call your sister.** Bypass the lawyers for this conversation. Acknowledge the "Game of Chicken" explicitly.
  2.  **Propose Mediation.** Suggest hiring a neutral mediator to propose a split. This allows you both to save face.
  3.  **Reclaim Authority.** Remind your lawyers that *you* make the decisions, not them. Instruct them that preserving the estate value (by stopping fees) is more important than winning the negotiation.

  You are in a situation where rational individual choices (holding firm) are leading to an irrational collective outcome (losing money). The only way out is to coordinate. Since you mentioned you still get along on the phone, you have the one asset needed to solve this: **trust.** Use that trust to bypass the adversarial system your lawyers have put you in.

  *Disclaimer: I am an AI assistant and not an attorney. This information is for educational purposes regarding economic concepts and negotiation strategy, not legal advice. You should consult with legal professionals regarding your specific estate situation.*
