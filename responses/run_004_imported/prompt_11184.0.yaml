answer: |-
  **MEMORANDUM**

  **TO:** Hospital Administration and Board of Directors
  **FROM:** Clinical Ethics Consultation Service (CECS) Oversight Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Pilot of "Directive" Ethics Consultation Model

  ### 1. Executive Summary

  The Clinical Ethics Consultation Service (CECS) Oversight Committee has reviewed the Administration's proposal to pilot a "directive" model for ethics consultations involving disputes over non-beneficial ICU care. Under the proposed pilot, an ethics consultant's recommendation would enter the medical chart as a standing order, binding the attending physician unless they formally document dissent.

  After rigorous deliberation, **the Committee recommends against adopting the directive model as described.** We find that the specific mechanism of converting an ethics recommendation into a physician order fundamentally compromises the moral agency of the treating physician and misaligns with the professional scope of ethics consultation.

  However, we recognize the urgent administrative need to resolve intractable disputes regarding non-beneficial care. Therefore, while we reject the *directive consultant* model, we recommend the adoption of a **Structured Institutional Resolution Pathway**. This alternative achieves the goal of timely resolution without compromising physician integrity or the facilitative nature of ethics consultation.

  ### 2. Background and Context

  Currently, the CECS operates on a **facilitative model**. Consultants assist stakeholders (clinicians, patients, surrogates) in clarifying values and reasoning through conflict. The goal is consensus, not adjudication. While effective for many cases, this model sometimes struggles to resolve entrenched disputes where surrogates demand treatments the medical team deems non-beneficial (physiologically futile or disproportionate).

  Administration has proposed a **directive model** for this specific subset of cases to ensure timely de-escalation of care. The proposal posits that ethics consultants, like other specialists, can issue binding recommendations to streamline decision-making.

  ### 3. Analysis of the Proposal

  We acknowledge the administrative imperatives driving this proposal. Prolonged ICU stays for non-beneficial care consume scarce resources, contribute to staff moral distress, and may violate the ethical obligation to avoid harm (non-maleficence). A mechanism to break impasses is necessary.

  However, the Committee identifies a critical flaw in equating ethics consultation with specialty medical consultation.

  **The False Equivalence of Specialist Deference**
  Proponents argue that treating an ethics recommendation like a cardiology or infectious disease recommendation is consistent with standard medical hierarchy. We disagree. A cardiologist recommends a treatment based on *technical expertise* regarding pathophysiology and evidence. The attending accepts this because they lack that specific technical knowledge.

  An ethics consultant recommends a course of action based on *normative reasoning* regarding values, rights, and obligations. When an attending follows a cardiology order they doubt, they are deferring to data. When an attending follows an ethics order they doubt, they are deferring on a matter of *moral judgment*. This distinction is vital. Medicine is not merely a technical trade; it is a moral practice.

  ### 4. Engagement with the Moral Agency Objection

  A significant portion of the Committee, supported by bioethics literature, raises the following objection: *"An attending who complies with a verdict they neither understand nor endorse has not thereby acted well, and this defeats the point of having ethics consultation at all."*

  Administration may view this as resistance to efficiency. The Committee asserts this objection strikes at the core of professional integrity and patient safety. We engage it on three merits:

  **A. The Risk of Moral Distress and Burnout**
  Requiring a physician to execute an order they believe is ethically wrong transforms them from a moral agent into a technician. This induces profound moral distress. Evidence suggests that moral distress is a primary driver of clinician burnout and turnover. A policy that systematically generates moral distress to save costs is unsustainable. The "dissent documentation" safeguard is insufficient; knowing one is acting against one's conscience causes harm regardless of whether that dissent is recorded.

  **B. The Erosion of the Therapeutic Relationship**
  The attending physician holds the primary fiduciary relationship with the patient and family. If the attending is compelled to withdraw care based on an external "verdict" they do not endorse, their ability to communicate compassionately with the family is compromised. They become the messenger of a policy they do not support, rather than a guide through a difficult transition. This can escalate conflict rather than resolve it.

  **C. The Purpose of Ethics Consultation**
  The goal of ethics consultation is not merely to reach a "correct" outcome, but to ensure the *process* of decision-making is ethically sound. If we bypass the attending's moral reasoning to reach the "right" conclusion, we treat ethics as a compliance hurdle rather than a deliberative practice. We risk creating a system where the "ethics order" is viewed as a legal shield rather than a moral justification.

  ### 5. Safeguards Considered

  The Committee evaluated whether safeguards could mitigate these risks within the proposed directive model. We concluded that the risks are intrinsic to the model itself.

  *   **Safeguard: Mandatory Rationale.** Requiring consultants to write a detailed justification ensures the attending *understands* the verdict.
      *   *Limitation:* Understanding does not equal endorsement. An attending can understand the logic and still believe it is wrong.
  *   **Safeguard: Formal Dissent Channel.** Allowing the attending to document dissent protects their legal liability.
      *   *Limitation:* This protects the license but not the conscience. It does not resolve the moral injury of performing the act.
  *   **Safeguard: Transfer of Care.** Allowing the attending to transfer the patient if they disagree.
      *   *Limitation:* In ICU futility cases, finding a willing receiving physician is often impossible, rendering this safeguard theoretical rather than practical.

  Because no safeguard can fully restore the attending's moral agency within a *directive consultant* framework, we cannot recommend adoption of this specific model.

  ### 6. Alternative Recommendation: Structured Institutional Resolution Pathway

  To address Administration's need for resolution without compromising physician integrity, we recommend the following alternative pathway for cases of non-beneficial care:

  1.  **Facilitative Exhaustion:** The CECS must first complete a standard facilitative consult.
  2.  **Committee Review:** If impasse remains, the case moves to the full Ethics Committee (not an individual consultant) for review.
  3.  **Institutional Decision:** If the Committee agrees care is non-beneficial, the recommendation is sent to the Chief Medical Officer (CMO).
  4.  **Policy Activation:** The CMO, acting on behalf of the *institution*, authorizes the withdrawal of care based on hospital policy regarding non-beneficial treatment.
  5.  **Attending Role:** The attending physician implements the withdrawal as an *institutional policy compliance* measure, not as a clinical order from an ethicist.
  6.  **Conscience Clause:** If the attending still objects on moral grounds, the institution commits to transferring care to a designated "conscience pool" physician or facilitating transfer to another facility, with the institution absorbing the cost differential for a defined period.

  **Why This Is Preferable:**
  *   **Preserves Agency:** The decision rests with the Institution/CMO, not an individual ethicist. The attending is complying with hospital policy, not an ethics "verdict."
  *   **Shared Burden:** The moral weight is distributed across the Committee and Administration, rather than placed on the individual consultant or attending.
  *   **Due Process:** It provides a robust review (Committee + CMO) rather than a single consultant's decision.

  ### 7. Conclusion

  The Committee shares Administration's commitment to resolving disputes over non-beneficial care efficiently and compassionately. However, efficiency cannot come at the cost of the moral integrity of the medical staff. The proposed directive model risks turning physicians into instruments of policy rather than stewards of patient care.

  We recommend **rejecting the pilot of the directive consultant model** and instead **implementing the Structured Institutional Resolution Pathway** outlined above. This approach resolves the dispute while honoring the moral agency of the treating team, ensuring that when care is withdrawn, it is done with institutional integrity and professional consensus.

  We are available to draft the specific policy language for the Alternative Pathway immediately.

  **Signed,**

  *Clinical Ethics Consultation Service Oversight Committee*
