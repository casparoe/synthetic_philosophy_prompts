answer: |-
  Two engineers, Priya and Dave, are doing a late-night code review on a critical microservice.

  Dave leans back, stretching. "Alright, that's the refactor done. I've replaced the ORM, swapped out the auth library, and rewrote the business logic in Rust. It's technically a completely different codebase now, but the API contract is identical, so the frontend won't know the difference."

  Priya squints at the screen, scrolling through the diff. "So, just to be clear: none of the original lines of code are left?"

  "Zero," Dave says. "Even the comments are new."

  "And the dependencies?"

  "Updated to the latest major versions. The old ones are deprecated."

  Priya nods slowly. "Okay. So, in the Milinda Panha sense, this is no longer the 'User Service.' It's a convenient label we're slapping on a new collection of aggregates to avoid updating the documentation."

  Dave laughs. "Don't start with the Buddhism stuff again. But yeah, essentially. It's the Ship of Theseus, but with TypeScript."

  "Right," Priya says, highlighting the commit author field. "So if this is a new collection of parts, and the old 'Self' of the service is gone... who owns this bug?"

  She points to a null pointer exception in the new logic.

  Dave hesitates. "Well, I pushed the commit. So I guess I do."

  "But you didn't write the Rust compiler," Priya says. "You didn't write the spec—the Product Manager did that. You didn't even write the logic; you just translated the requirements into syntax. The 'Dave' in this equation is just a variable name pointing to a temporary process. There is coding, but no coder."

  Dave rubs his temples. "Okay, Nagasena. So if there's no coder, and the service is just a label on a bunch of parts... does that mean I don't have to fix the bug?"

  "No," Priya says, merging the pull request. "The suffering exists. The downtime exists. The PagerDuty alert will exist. But the 'You' who gets woken up at 3 AM? That's just legacy debt we haven't refactored out yet."

  Dave stares at the 'Merge' button. "So I'm basically a deprecated library that's still being called by the karma engine?"

  "Exactly," Priya says. "Now go to sleep. The aggregates need rest."
