prompt: |-
  A friend and I spent an entire dinner arguing about Aquinas on tyrannicide and never quite settled it. My friend's shorthand was that "Aquinas thought it was fine to kill tyrants," but his actual view seems more layered to me: in De Regno, and again in his remarks on sedition in the Summa, he distinguishes a ruler who never held legitimate title to rule — a usurper, whom a private person may resist or even kill, absent recourse to a higher authority — from a ruler who acquired power legitimately but has grown oppressive in exercising it. In that second case, Aquinas insists that removal is a matter for the public authority or community that installed the ruler, not for private individuals acting on their own judgment, partly because he feared that licensing private tyrannicide would give the ambitious cover to murder decent rulers on false pretexts.

  Here is the case that split us. Imagine a head of state who wins power in a genuinely free election, then hollows out the courts, jails independent journalists, and rigs or cancels every subsequent election to stay in office indefinitely; and imagine that a foreign government, acting alone and in total secrecy, with no UN authorization or other recognized public sanction, has this leader killed in a drone strike. Working from Aquinas's actual principles rather than the popular gloss on them: would he treat such a leader as a usurper, on the grounds that the mandate which made his rule legitimate has been subverted from within, or as a legitimate authority removable only through due public process? And should a covert strike ordered by a foreign power be judged by the standard Aquinas applied to a lone citizen's dagger, or does the change of actor change the analysis? Tell me what verdict you think Aquinas's own principles commit him to, and why.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Query:**
      *   **Core Subject:** Thomas Aquinas's view on tyrannicide.
      *   **The Dispute:** Friend says "Aquinas thought it was fine to kill tyrants." User says "It's more layered (usurper vs. legitimate-turned-oppressive)."
      *   **The Case Study:** A democratically elected leader who subverts democracy (hollows courts, jails journalists, rigs elections) to stay indefinitely. A *foreign government* (covert, no UN sanction) assassinates this leader via drone strike.
      *   **The Questions:**
          1.  Would Aquinas treat this leader as a *usurper* (legitimacy lost) or a *legitimate authority* (removable only by public process)?
          2.  Does the *actor* (foreign power vs. private citizen) change the analysis compared to Aquinas's standard for a "lone citizen's dagger"?
          3.  What is the verdict based on Aquinas's *actual principles*?

  2.  **Analyze Aquinas's Textual Evidence:**
      *   *De Regno (On Kingship):* Aquinas discusses tyranny. He argues against private individuals killing tyrants. He suggests public authority should act. If no public authority exists (usurper), resistance is more permissible, but still cautious.
      *   *Summa Theologiae (II-II, Q. 42, A. 2):* On Sedition. He argues that resisting a tyrant is not sedition *if* the tyrant is ruling for private gain rather than the common good. However, he warns that private attempts often lead to greater turmoil.
      *   *Commentary on the Sentences:* He distinguishes between a tyrant *ex defectu tituli* (usurper, no title) and *ex parte exercitii* (abuse of power).
          *   *Usurper:* Can be resisted by anyone (private or public) because they never had authority.
          *   *Abuser:* Must be removed by public authority, not private individuals.
      *   *Key Principle:* The Common Good (*bonum commune*). Order and peace are goods, but justice is also a good. Disorder caused by assassination often outweighs the removal of a tyrant.

  3.  **Apply Principles to the Case Study:**

      *   **Question 1: Usurper vs. Legitimate Authority?**
          *   *Initial Status:* Elected legitimately.
          *   *Subsequent Action:* Subverted institutions, rigged elections.
          *   *Aquinas's Distinction:* This is the crux. Is he a tyrant *ex defectu tituli* (by defect of title) or *ex parte exercitii* (by exercise)?
          *   *Analysis:* He started with a title. By rigging elections, he is effectively seizing power anew without consent. However, Aquinas is generally cautious about declaring a sitting ruler a "usurper" after the fact because it invites chaos. In *De Regno*, he leans toward the idea that if the community *can* depose him, they should. If they *cannot*, they should endure or pray, rather than risk greater evil through assassination.
          *   *Nuance:* Aquinas might acknowledge the legitimacy is eroded, but he would likely still classify him as a ruler *ex parte exercitii* regarding the *method of removal*. Why? Because the *community* he rules is the entity with the right to judge the breach of contract, not an external party or a private individual. The "usurper" category is usually reserved for someone who seizes power by force *ab initio* (from the start).
          *   *Verdict:* Likely *ex parte exercitii*. The initial title existed. The corruption of rule is an abuse of office, not necessarily a total nullification of title in the eyes of natural law *for the purpose of external assassination*.

      *   **Question 2: The Actor (Foreign Power vs. Private Citizen)**
          *   *Aquinas's Concern:* Private assassination leads to disorder, vendettas, and the killing of good rulers by bad actors.
          *   *Foreign Power:* Is a foreign state a "public authority" in Aquinas's sense? No. Aquinas's political theory is grounded in the *polis* or the *regnum* (the specific community). A foreign king has no jurisdiction over another kingdom's internal tyrant unless there is a higher universal authority (like the Emperor or Pope in his context) or a just war scenario.
          *   *Just War Theory:* Aquinas has strict criteria for war (authority of sovereign, just cause, right intention). A covert drone strike is an act of war. Is it a *just* war?
          *   *Analysis:* A foreign power acting unilaterally without higher sanction violates the "competent authority" requirement regarding *that* territory. It is an act of aggression, even if the target is bad. It undermines the order of nations.
          *   *Verdict:* Aquinas would likely view a foreign assassin (state or private) as lacking the *jurisdiction* to execute judgment. It's still "private" in the sense of being external to the political community concerned.

      *   **Question 3: The Verdict**
          *   *Synthesis:* Aquinas prioritizes the *common good* and *order*. While tyranny is evil, the remedy of assassination (especially by outsiders) often creates greater evil (war, instability, precedent for regicide).
          *   *Conclusion:* He would condemn the strike.
          *   *Reasoning:*
              1.  **Jurisdiction:** The foreign power lacks authority over that realm.
              2.  **Classification:** The ruler is likely a tyrant by exercise, not title, requiring internal public removal.
              3.  **Consequences:** Covert assassination risks greater disorder (war, retaliation) than the tyranny itself.

  4.  **Drafting the Response:**
      *   *Acknowledge the User's Sophistication:* Validate their reading of *De Regno* and the *Summa*. They are correct against their friend.
      *   *Address the Usurper vs. Abuser Distinction:* Explain *ex defectu tituli* vs. *ex parte exercitii*. Apply it to the "elected-then-corrupt" scenario. Argue Aquinas would likely see this as abuse of power, not initial usurpation, because the initial consent existed.
      *   *Address the Actor (Foreign Power):* This is crucial. Aquinas isn't just worried about "private citizens"; he's worried about *unauthorized judgment*. A foreign state is an "external private person" relative to the domestic common good.
      *   *Address Just War:* Bring in *Summa* II-II, Q. 40. War requires sovereign authority. Covert strike = act of war. Is it just? Lacks proper authority relative to the target's polity.
      *   *The "Greater Evil" Argument:* Aquinas is a consequentialist regarding order. If killing the tyrant leads to civil war or foreign invasion, it's sinful.
      *   *Final Verdict:* Aquinas would condemn the action.

  5.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Counter-argument:* Could the foreign power be seen as a "higher authority"? In Aquinas's time, maybe the Emperor or Pope. In modern Westphalian systems, no. I need to make sure I don't anachronistically impose modern sovereignty but stick to Aquinas's hierarchy. Aquinas believed in a hierarchy of laws. A foreign king is not the superior of another king.
      *   *Counter-argument:* What if the tyranny is so bad it voids the title? Aquinas hints at this but remains cautious. Even if the title is void, *who* executes the judgment? The community, not a neighbor.
      *   *Tone:* Keep it scholarly but accessible. Respect the user's detailed prompt.

  6.  **Final Polish:** Structure the answer clearly:
      1.  Validate the user's premise (User > Friend).
      2.  Analyze the Status of the Ruler (Usurper vs. Abuser).
      3.  Analyze the Status of the Killer (Private vs. Public vs. Foreign).
      4.  Analyze the Consequences (Order vs. Justice).
      5.  Final Verdict.

      *(Self-Correction during drafting)*: Make sure to explicitly mention *De Regno* Book I, Chapter 6 and *Summa Theologiae* II-II, Q. 42, Art. 2. These are the key texts. Also Q. 40 on War.

      *(Refining the "Usurper" point)*: Does rigging elections make one a usurper *ex defectu tituli*? Some later Scholastics (like Suárez or Mariana) might say yes. Aquinas is more conservative. He focuses on the *danger of the precedent*. I should emphasize Aquinas's specific caution compared to later Jesuit thinkers who were more pro-tyrannicide. The user asked about *Aquinas*, not the Scholastic tradition generally. Stick to Thomas. Thomas is more concerned with order than Mariana.

      *(Refining the "Foreign Power" point)*: Aquinas treats foreign invasion as a great evil. A foreign king killing another king is basically regicide/war, not police action.

      *Final Plan:*
      1. Confirm user's reading is correct (Usurper vs. Legitimate-turned-Tyrant).
      2. Apply to the specific case (Likely *ex parte exercitii*).
