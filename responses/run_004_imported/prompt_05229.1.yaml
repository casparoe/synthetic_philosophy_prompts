answer: |-
  Your reading of Aquinas is significantly more accurate than your friend's shorthand. The popular gloss that "Aquinas endorsed tyrannicide" is a distortion often born of conflating him with later Scholastics (like Juan de Mariana) or of reading his early *Commentary on the Sentences* without weighing it against his mature works like *De Regno* and the *Summa Theologiae*.

  To answer your specific case study, we must apply Aquinas's distinctions regarding the **title to rule**, the **authority to judge**, and the **calculus of the common good**.

  Here is the verdict Aquinas's principles commit him to, broken down by the two critical questions you raised.

  ### 1. The Status of the Ruler: Usurper or Abuser?

  Aquinas distinguishes between a tyrant *ex defectu tituli* (by defect of title, i.e., a usurper) and a tyrant *ex parte exercitii* (by exercise, i.e., one who rules legitimately but unjustly).

  *   **The Usurper:** In *De Regno*, Aquinas suggests that if a ruler seizes power by force without any claim of right, he is not truly a ruler. In this specific case, private resistance is more permissible because there is no bond of political obedience to violate.
  *   **The Abuser:** If a ruler acquires power legitimately but rules tyrannically, Aquinas is emphatic: **private individuals may not kill him.** In *Summa Theologiae* (II-II, Q. 42, A. 2), he argues that removing such a ruler is the prerogative of the public authority (the community or a superior authority) that installed him.

  **Application to your case:**
  Your hypothetical leader won power in a "genuinely free election." In Thomistic terms, he possesses a valid *titulus* initially. The subsequent subversion of courts and rigging of elections is a corruption of *exercise*, not necessarily an immediate nullification of *title* in the eyes of natural law.

  While one could argue that by rigging elections he effectively becomes a usurper of his *continued* rule, Aquinas is deeply cautious about allowing subjects to declare a sitting ruler a "usurper" post-hoc. He fears that any faction could claim the ruler has "lost legitimacy" to justify regicide. Therefore, Aquinas would likely classify this leader as a tyrant *ex parte exercitii*.

  **Verdict on Status:** He remains a legitimate authority removable only through **due public process** by the community he rules, not by private judgment.

  ### 2. The Status of the Actor: Foreign Power vs. Private Citizen

  This is the decisive factor. Your friend's shorthand ignores *who* is doing the killing. Aquinas's prohibition on private tyrannicide is rooted in the lack of **jurisdiction**.

  *   **Private Citizens:** They lack the public authority to execute judgment on a ruler. To kill a ruler is to act as a judge, which belongs to the whole community or its representatives.
  *   **Foreign Powers:** In Aquinas's political metaphysics, a foreign king is not a "public authority" relative to another kingdom's internal order. He is an external sovereign.

  In *Summa Theologiae* (II-II, Q. 40, A. 1), Aquinas outlines the conditions for a Just War. One of the three necessary conditions is **authority of the sovereign**. However, this authority is territorial. A foreign sovereign has no jurisdiction to act as a police power within another realm unless acting under a higher universal authority (which, for Aquinas, might be the Emperor or Pope in specific spiritual/temporal overlaps, but certainly not a neighboring state acting unilaterally).

  A covert drone strike by a foreign government is, in Thomistic terms, an **act of war**, not an execution of justice. Even if the target is evil, the *act* lacks proper jurisdiction. By bypassing the community that suffers the tyranny, the foreign power treats the tyrant's subjects as incapable of self-government and violates the sovereignty of that political community.

  Furthermore, Aquinas warns in *De Regno* that killing a tyrant often leads to greater evils: civil war, retaliation, or the rise of a worse tyrant. A foreign assassination is almost guaranteed to destabilize the region, potentially inviting invasion or chaos, which violates the **Common Good** (*bonum commune*). For Aquinas, the preservation of order is a prerequisite for justice; you cannot establish justice by creating total disorder.

  ### The Thomistic Verdict

  Based on his actual principles, **Aquinas would condemn the drone strike.**

  Here is the chain of reasoning he would apply:

  1.  **Lack of Jurisdiction:** The foreign power is an external agent. It possesses no legal or moral authority to execute the ruler of another polity. To do so is an act of aggression, not justice. It treats the assassination as a private vendetta on a geopolitical scale.
  2.  **Violation of the Community's Right:** The right to depose a tyrant *ex parte exercitii* belongs to the community that appointed him. By acting unilaterally, the foreign power steals this right from the oppressed people, treating them as objects rather than political agents.
  3.  **The Danger of Scandal and Disorder:** Aquinas prioritizes the avoidance of greater evils. He explicitly argues (*De Regno* I.6) that if removing a tyrant risks greater turmoil (which a foreign assassination certainly does), it is better to endure the tyranny for a time than to risk the safety of the community through hazardous action.
  4.  **The Precedent:** Aquinas fears licensing the killing of rulers. If foreign powers are allowed to assassinate leaders they deem "tyrants" without universal sanction (like a UN equivalent, which Aquinas would analogize to a Council or Emperor), the result is a state of perpetual war where every king is a potential target. This destroys the peace necessary for virtue to flourish.

  ### Conclusion

  Your friend is wrong; Aquinas did not think it was "fine to kill tyrants" as a general rule. He thought it was a last resort, strictly limited by jurisdiction and the calculus of consequences.

  In your scenario, Aquinas would view the leader as a **tyrant by exercise** (requiring internal public removal) and the foreign power as an **unauthorized aggressor**. The strike would be judged not as a liberation, but as a sin against the order of nations and the common good of the target state. Aquinas would likely argue that the foreign power has committed an act of injustice, even if the target was himself unjust, because the *act* itself lacked the requisite authority and threatened greater disorder.

  You win the dinner argument, provided you emphasize that for Aquinas, **authority matters as much as outcome.**
