answer: |-
  This is a sophisticated premise, and your instinct to interrogate the analogy before putting it in your character's mouth is correct. The comparison between Zahavi's Handicap Principle and Veblen's Conspicuous Consumption is a staple of interdisciplinary theory, but the two models are not isomorphic. They converge on the *function* of waste but diverge sharply on the *mechanism* of honesty.

  Here is the breakdown of the logic, the stability of the signals, and precisely where your biologist's argument should begin to fray under cross-examination.

  ### 1. The Logic of Zahavi (The Biological Baseline)
  Amotz Zahavi's Handicap Principle posits that for a signal to be evolutionarily stable, it must be costly. Crucially, it is not enough for the signal to be expensive; the cost must be **differentially burdensome**.

  *   **The Mechanism:** A peacock's tail is heavy and makes him vulnerable to predators. A high-quality male (good genes, strong immune system) can survive *despite* the tail. A low-quality male cannot; if he tries to grow a tail of the same size, he dies or fails to mate.
  *   **The Honesty:** The signal is honest because cheating is physiologically impossible. You cannot "borrow" genetic fitness to grow a tail you cannot sustain. The cost acts as a hard constraint on low-quality signalers.
  *   **The Goal:** The signal conveys **fitness** to potential mates to ensure reproductive success.

  ### 2. The Logic of Veblen (The Economic Parallel)
  Thorstein Veblen's theory of conspicuous consumption (from *The Theory of the Leisure Class*, 1899) argues that in industrialized societies, status is no longer won by prowess (hunting/war) but by the accumulation of wealth. Since wealth is invisible (numbers in a ledger), it must be made visible through waste.

  *   **The Mechanism:** One demonstrates pecuniary strength by engaging in non-productive consumption (buying useless luxuries) or non-productive leisure (having others work for you).
  *   **The Honesty:** Veblen assumes the signal is generally honest because, historically, sustained waste requires a surplus. However, Veblen acknowledges the role of **reputation** and **invidious comparison**. The signal works because the community agrees to read the waste as proof of wealth.
  *   **The Goal:** The signal conveys **status** to peers and rivals to secure social standing (and, by extension, mating opportunities, though Veblen focuses more on class hierarchy).

  ### 3. The Critical Divergence: Liquidity and Inheritance
  This is where your biologist's analogy faces its stiffest challenge.

  **Zahavi relies on physiological constraints; Veblen relies on economic constraints.**
  In biology, "quality" (genetic fitness) is internal and non-transferable. You cannot inherit a peacock's tail without the genes to sustain it. In economics, "quality" (wealth) is external and highly transferable.

  *   **The Problem of Debt:** A low-quality peacock cannot fake a tail. A low-wealth human *can* fake conspicuous consumption. They can go into debt, lease the car, buy the counterfeit watch, or leverage assets. The cost of the signal is not necessarily borne by the signaler in a way that proves their underlying "quality."
  *   **The Problem of Inheritance:** Veblenian status is often inherited (old money). A dissolute heir can waste wealth accumulated by an ancestor. In Zahavi's model, every generation must prove its fitness anew; the father's tail does not guarantee the son's survival.

  Therefore, Veblen's theory does **not** depend on the cost tracking quality in the strict Zahavian sense. It depends on **social consensus**. If the community believes you are rich, you are status-rich, even if you are insolvent (until the bankruptcy reveals the truth). Zahavi's signal cannot be believed if it is false; Veblen's signal can be believed for a long time despite being false.

  ### 4. Which Theory Holds Up Better as a Stable, Honest Signal?
  **Zahavi's model is the more robust model of honest signaling.**

  If you reconstruct both as game-theoretic models:
  *   **Zahavi:** The equilibrium is maintained by natural selection. Cheaters are removed from the gene pool. The signal is *inherently* honest.
  *   **Veblen:** The equilibrium is maintained by social sanction and the risk of ruin. Cheaters are removed by bankruptcy or social ostracization. The signal is *contingently* honest.

  Economists (such as Michael Spence in job-market signaling) have tried to apply Zahavian logic to Veblenian behavior, arguing that conspicuous consumption works *only if* it is too costly for the poor to mimic. But because money is liquid, the "cost" is the same for everyone ($1 million is $1 million), whereas for the peacock, the "cost" is relative to condition (the tail weighs more on a weak bird).

  For Veblenian signaling to be truly Zahavian, the waste must be **irrecoverable**. Buying art that appreciates in value is investment, not waste. Burning a million dollars in front of a crowd is Zahavian. Buying a yacht that retains resale value is merely Veblenian.

  ### 5. Where the Analogy Strains (Notes for the Novel)
  Your biologist can make the argument with a straight face, but the family (or a sharp interlocutor) should be able to pinpoint exactly where the biology fails to map onto the economics. Here are the three fracture points:

  **A. Agency vs. Instinct**
  *   **The Strain:** The peacock does not *choose* to grow the tail. The genes do. The wealthy family *chooses* to buy the gold-plated fixture.
  *   **The Counter-Argument:** "The peacock has no choice but to be honest. We have accountants. We can choose to signal strength we don't have, or hide strength we do. We are not slaves to the signal."

  **B. The Utility of the Waste**
  *   **The Strain:** Zahavi requires the signal to reduce survival chances (a survival handicap). Veblenian waste often *increases* comfort or security.
  *   **The Counter-Argument:** "A peacock's tail gets him eaten. My private jet gets me to meetings faster and keeps me safe. It's wasteful to others, but it's an advantage to me. It's not a handicap; it's armor."

  **C. The Audience**
  *   **The Strain:** The peacock signals to *mates* (sexual selection). The wealthy family signals to *rivals* (social selection).
  *   **The Counter-Argument:** "We aren't trying to attract a mate. We are trying to intimidate competitors. A peacock dances to seduce; we spend to dominate. Seduction requires honesty; domination only requires the appearance of force."

  ### Recommendation for the Scene
  Let the biologist win the opening volley. The analogy is intellectually seductive and holds up well enough for a dinner-party argument. It captures the *essence* of wasteful display as information.

  However, let the family win the deeper truth. They should point out that human wealth allows for **counterfeiting** in a way biology does not. The biologist assumes their waste proves they *have* the resources. The family knows their waste proves only that they *can access* the resources (via credit, lineage, or leverage).

  The most poignant moment of strain would be if the family admits that, unlike the peacock, they are sometimes terrified the signal is a lie. The peacock never worries he is unworthy of his tail; the nouveau riche often worry they are unworthy of their wealth. That anxiety is the human cost that the biological analogy misses.
