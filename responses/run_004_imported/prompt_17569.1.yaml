      *   *Nuance:* The key distinction is *liquidity*. I can borrow money to buy a Ferrari. I cannot borrow genes to grow a tail. This is the critical fracture point for the novelist.
      *   *Nuance 2:* Veblen's waste is often about *leisure* (non-productive time), not just goods. Zahavi is about survival cost.
      *   *Refining the "Strain":* The biologist's argument works best if the family's waste is *irrecoverable* (burning money). It strains if the waste is an *investment* (buying art that appreciates).

  9.  **Final Polish:** Ensure tone is intellectual but accessible, suitable for a writer doing research. (Check against the prompt: "Tell me which of the two theories would hold up better... and at what point... analogy should start to strain.")

