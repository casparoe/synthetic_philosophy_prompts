prompt: |-
  I am at work on a novel that turns, in part, on a running argument between two characters: an evolutionary biologist and the family she has married into, whose wealth expresses itself almost entirely through visible, extravagant, and faintly absurd waste. She keeps telling them, half in jest, that their behavior is just a peacock's tail by other means. Before I let her make that case on the page with a straight face, I would like to know whether it actually holds up. Compare Amotz Zahavi's handicap principle with Thorstein Veblen's account of conspicuous consumption: both treat costly, seemingly wasteful display as a way of conveying real information about the displayer, but do the two accounts rest on the same underlying logic? Zahavi's signals are supposed to remain honest only because bearing their cost is disproportionately harder for a low-quality individual than for a high-quality one — does Veblen's theory depend on anything comparable, or is its force owed to something looser, such as emulation and invidious comparison, that doesn't actually require cost to track quality in that way? Tell me which of the two theories would hold up better if reconstructed as a model of a stable, honest signal, and at what point, precisely, my biologist's analogy should start to strain.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Context:** The user is writing a novel featuring an evolutionary biologist arguing with a wealthy family about their wasteful behavior.
      *   **Core Argument:** The biologist claims their waste is like a "peacock's tail" (Zahavi's Handicap Principle).
      *   **Task:** Compare Amotz Zahavi's Handicap Principle (biology) with Thorstein Veblen's Conspicuous Consumption (economics/sociology).
      *   **Specific Question:** Do they rest on the same underlying logic? Specifically, does Veblen's theory require cost to track quality (honest signaling) like Zahavi's, or is it based on emulation/status?
      *   **Evaluation:** Which theory holds up better as a model of a *stable, honest signal*?
      *   **Application:** At what point does the biologist's analogy start to strain in the context of the novel?

  2.  **Analyze Zahavi's Handicap Principle:**
      *   *Core Mechanism:* Signals must be costly to be honest.
      *   *Condition:* The cost must be *differentially* burdensome. A high-quality individual can afford the cost; a low-quality individual cannot (or pays a fitness penalty that outweighs the benefit).
      *   *Outcome:* Evolutionarily Stable Strategy (ESS). Cheating is prevented by the physics/physiology of the cost.
      *   *Key Concept:* "Condition-dependent" signaling.

  3.  **Analyze Veblen's Conspicuous Consumption:**
      *   *Core Mechanism:* Waste demonstrates pecuniary strength.
      *   *Condition:* The consumption must be visible and non-productive (wasteful).
      *   *Motivation:* Invidious comparison (status seeking) and emulation.
      *   *Honesty:* Veblen implies honesty because you generally need money to spend money. However, can you fake it? Yes (credit, debt, counterfeit goods).
      *   *Key Concept:* "Pecuniary reputability."

  4.  **Compare the Logics:**
      *   *Similarity:* Both involve costly displays that seem wasteful but convey information (fitness vs. wealth).
      *   *Difference (Crucial):*
          *   Zahavi: Biological constraint. You *cannot* fake a heavy tail if you are weak. The cost is physiological.
          *   Veblen: Economic/Social constraint. You *can* fake wealth (debt, fraud), but social sanctions or eventual bankruptcy punish it. The cost is financial, but financial resources are transferable and borrowable in a way genetic fitness is not.
      *   *Honesty:* Zahavi's signal is inherently honest due to differential cost. Veblen's signal is *contingently* honest (usually correlated with wealth) but vulnerable to counterfeiting.

  5.  **Evaluate as Stable, Honest Signals:**
      *   Zahavi is more robust *biologically* because genetic quality isn't easily borrowed.
      *   Veblen is less robust *economically* because capital can be leveraged. However, Veblenian signaling often evolves into "Zahavian" constraints (e.g., burning money where you can't get it back).
      *   *Verdict:* Zahavi is the stricter model of honest signaling. Veblen is more about social construction of value.

  6.  **Identify the Strain Points for the Novel:**
      *   *Function vs. Meaning:* Peacock tails signal reproductive fitness to *mates*. Conspicuous consumption signals economic power to *rivals/peers*.
      *   *Inheritance:* Wealth can be inherited unearned; fitness (mostly) cannot. A rich idiot can waste money. A weak peacock cannot grow a big tail.
      *   *The "Why":* Peacocks don't choose to signal; genes do. Humans choose (agency).
      *   *The "Cost":* For the peacock, the cost is survival risk. For the human, the cost is reduced liquidity.
      *   *The "Audience":* Peacocks signal to potential mates. The wealthy family signals to society (and perhaps themselves).

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the strength of the analogy (it's a classic comparison for a reason) but validate the user's skepticism.
      *   *Section 1: The Logic of Zahavi.* Explain the Handicap Principle clearly (differential cost, impossibility of cheating).
      *   *Section 2: The Logic of Veblen.* Explain Conspicuous Consumption (waste as proof of surplus, invidious comparison).
      *   *Section 3: The Convergence and Divergence.*
          *   Convergence: Costly signals convey hidden quality.
          *   Divergence: Biological constraints vs. Economic liquidity. The ability to go into debt (fake the signal).
      *   *Section 4: Which is the Better Honest Signal?* Zahavi wins on strict honesty. Veblen relies on social enforcement.
      *   *Section 5: Where the Analogy Strains (Novel Advice).*
          *   Agency (Choice vs. Instinct).
          *   Inheritance (Old money vs. Genetic quality).
          *   Utility (Is the waste actually useless?).
          *   The "Mate" aspect (Is the family trying to attract mates or dominate peers?).
      *   *Conclusion:* Give the biologist permission to make the argument, but suggest where the family might push back effectively.

  8.  **Refining the Argument (Self-Correction/Nuance):**
