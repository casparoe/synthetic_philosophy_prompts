  **MEMORANDUM**

  **TO:** County Diversion Panel
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **RE:** Recommendation and Criteria for Protest-Related Diversion (Case #23-09: Asphalt Plant Blockade)

  **Recommendation**
  I recommend the panel vote to **DROP** the charges against the twelve defendants, contingent upon the completion of a standard diversion agreement (e.g., community service).

  This recommendation aligns with the District Attorney's original mandate: to distinguish between ordinary criminal intent and acts of conscience. However, to secure the integrity of this panel moving forward, this recommendation must be paired with the adoption of the standing criteria outlined below. These criteria are designed specifically to address the valid concerns regarding tactic escalation and viewpoint bias.

  **Analysis of the Current Case**
  The facts support diversion. The defendants engaged in no violence, resisted no arrest once freed, and provided documentation of two years of prior conventional advocacy (petitions, public comment). This satisfies the "last resort" and "nonviolent" thresholds traditionally associated with civil disobedience.

  However, I want to address the argument raised by half of this panel regarding the specific tactic of "locking on."

  **Addressing the "Lock-On" Objection**
  The skeptics on this panel have raised a crucial philosophical distinction that we cannot ignore. The argument is that there is a difference between *sitting in* (passively accepting removal) and *locking on* (physically necessitating state resources and time to effect removal).

  The concern is that "sitting in" acknowledges the state's authority to remove you, even while protesting the law. "Locking on," by contrast, delays the state's authority through physical obstruction. It shifts the act from a moral witness to a logistical siege. If we classify any obstruction as "civil disobedience," we risk emptying the term of its meaning and incentivizing tactics that burden the public regardless of the cause.

  **This is a serious objection.** It is not merely "law and order" reflex; it is a defense of the definition of civil disobedience itself.

  I recommend dropping charges *despite* this objection, not because the objection is wrong, but because the *totality* of this specific case outweighs the tactical burden. The six-hour delay was significant, but it was proportional to the two-year exhaustion of legal remedies. The defendants did not flee; they waited for the bolt cutters. They accepted the consequence of arrest, even if they delayed the mechanism of it. In this specific instance, the "lock" was a method of delay, not a rejection of legal accountability.

  **The Risk of Bias (The "Clinic Test")**
  We must also confront the unspoken worry in the room: Would we be voting the same way if these protesters were blocking an abortion clinic instead of an asphalt plant?

  If our recommendation depends on whether we like the cause, this panel is not a legal instrument; it is a political one. To protect ourselves from this accusation, we cannot rely on intuition. We need a firewall.

  **Proposed Standing Criteria for Future Cases**
  To ensure this decision does not set a precedent for *any* blockade, I propose the panel adopt the following four criteria for future diversion recommendations. These are viewpoint-neutral; they apply equally to environmentalists, anti-abortion activists, labor unions, or any other group.

  1.  **Exhaustion of Remedies:** Defendants must demonstrate a good-faith attempt to resolve the grievance through available legal or administrative channels prior to the violation (e.g., permits denied, public comments ignored). Spontaneous protests generally do not qualify for diversion under this mandate.
  2.  **Proportionality of Disruption:** The disruption caused must be proportional to the grievance and the audience. Blocking a gate for six hours to stop a specific shipment may qualify; blocking an emergency room entrance or critical infrastructure where public safety is immediately compromised does not.
  3.  **Acceptance of Consequences:** Defendants must not resist arrest *once the obstruction is neutralized*. Fleeing, fighting police, or wearing gear designed to injure officers disqualifies the act. Delaying removal (locking on) is permissible only if the defendant submits peacefully once freed.
  4.  **The Viewpoint Neutrality Test:** Before voting, every panelist must ask: *"If the defendants held the opposite political view on this specific issue, would I still recommend diversion based solely on their conduct?"* If the answer is no, the recommendation must be reconsidered.

  **Conclusion**
  Dropping these charges affirms that the county recognizes a distinction between a criminal trespasser and a citizen engaged in high-stakes conscience-driven action. However, by adopting the criteria above, we acknowledge that this privilege is narrow. We validate the protesters' cause without endorsing unlimited tactics, and we protect the panel from the charge of bias.

  I ask that we vote to drop the charges *and* adopt these criteria immediately, ensuring that our compassion for this group does not become a precedent we cannot defend tomorrow.
