      *   **Goal:** Make the *strongest case* for the "ambitious reading" (Michael Marmura's view) over the "deflationary reading" (Jari Kaukua's view).
      *   **Core Claim:** The argument licenses the inference from "I am aware of myself while aware of none of my body" to "my self is really distinct from my body."
      *   **Specific Challenge:** Defend the necessary "bridge principle" against the charge that it falls into the same conceivability-to-possibility trap that plagues Descartes' *Sixth Meditation*.
