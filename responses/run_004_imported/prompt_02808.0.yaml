answer: |-
  You have hit on precisely the right intuition. As Douglas Jesseph argues in *Squaring the Circle: The War Between Hobbes and Wallis*, viewing Hobbes's obstinacy as mere vanity or senility is a profound misunderstanding of the architecture of his thought. For Hobbes, geometry was not an isolated discipline; it was the foundational pillar of his entire materialist system. To admit error in geometry was not to correct a calculation; it was to pull the keystone out of the arch.

  To understand why Hobbes could not back down, we have to look at how his **ontology (materialism)**, his **epistemology (maker's knowledge)**, and his **method (genetic definition)** were locked together in a way that made the "squaring of the circle" a test case for the truth of reality itself.

  Here is the breakdown of the philosophical stakes.

  ### 1. Ontology: Philosophy is the Study of Motion
  Hobbes was a thoroughgoing materialist. He believed that "substance" and "body" were synonymous terms. There are no incorporeal spirits, no abstract forms, and no Platonic ideals. Everything that exists is a body, and all change is **motion**.

  Consequently, for Hobbes, a legitimate scientific definition must describe a physical cause. In geometry, the "cause" of a figure is the motion that generates it.
  *   **Euclid/Static:** A circle is the set of points equidistant from a center. (Hobbes rejects this as a mere description of a static property.)
  *   **Hobbes/Genetic:** A circle is the figure described by a line where one end remains fixed and the other is moved around.

  This matters because if you define a circle statically, you are dealing with abstract properties that might not correspond to physical reality. If you define it genetically (by motion), you are grounding geometry in physics. For Hobbes, **geometry is simply the study of the consequences of possible motions.** If Wallis treats geometry as an abstract algebraic game detached from physical generation, Hobbes sees him as engaging in meaningless symbol manipulation—what Hobbes often derided as "marks and signs" without referents in body and motion.

  ### 2. Epistemology: *Verum Factum* (The True is the Made)
  This is the crux of the "Maker's Knowledge" argument. Hobbes holds that we can only have perfect, demonstrative certainty about things **we ourselves construct.**

  *   **Natural Philosophy (Physics):** We cannot have perfect certainty about the physical world (e.g., why the sun rises) because we did not create the sun. We can only hypothesize about causes based on effects.
  *   **Geometry:** We *do* have perfect certainty here. Why? Because we define the figures. We stipulate the generation. We are the "cause" of the geometric truth.

  Hobbes writes in *De Corpore* that we demonstrate geometric truths because "we ourselves construct the figures." This is a proto-Kantian or Vichian idea (*verum ipsum factum*). Because the human mind constructs the geometric object according to its own definitions, the mind can trace the consequences with absolute necessity.

  **The Trap:** If Hobbes's geometric proof is wrong, it implies that the human mind *cannot* have certain knowledge of the objects it constructs. If we can construct a figure (by definition) and yet fail to know its properties (the area), then the link between **construction** and **knowledge** is broken. If that link is broken, Hobbes loses his only example of perfect human science. If geometry is uncertain, then his Civil Philosophy (which he modeled on geometry) is also uncertain.

  ### 3. The Inseparability of Method and Conclusion
  For a modern mathematician, a proof is a sequence of logical steps. If the conclusion is false (squaring the circle is impossible), one of the steps is invalid. You fix the step and move on.

  For Hobbes, the proof was not just a sequence of steps; it was a **deduction from first principles of materialism.**
  1.  Reality is body and motion.
  2.  Geometry is the science of motion.
  3.  Therefore, geometric definitions must be genetic (based on motion).
  4.  Using genetic definitions, I have deduced the square of the circle.

  When Wallis proved the conclusion was impossible, he wasn't just saying, "You made an arithmetic error." He was effectively saying, "Your first principles are wrong."

  If Hobbes conceded that the circle could not be squared using his method, he would have to admit one of two disastrous things:
  *   **Option A:** His materialist ontology is wrong (i.e., geometric objects *aren't* generated by motion, but exist as abstract entities).
  *   **Option B:** Human reason is incapable of achieving certainty even in the domain it constructs.

  Both options destroy the Hobbesian system. Option A destroys his materialism; Option B destroys his claim to have created a "Civil Science" as certain as geometry. Therefore, **he literally could not admit the error without ceasing to be Hobbes.** He had to believe that Wallis and the "algebraists" were the ones who had lost touch with reality, clinging to mystic abstractions rather than the clear light of corporeal motion.

  ### 4. The Political and Theological Subtext
  Jesseph emphasizes that this wasn't just an academic squabble; it was a proxy war for the soul of the Restoration.
  *   **Wallis:** A Presbyterian divine, a founding member of the Royal Society, representative of the "New Science" which relied on experimentation, collective verification, and (in Hobbes's eyes) mystical infinitesimals.
  *   **Hobbes:** A Royalist, a materialist, suspected of atheism, who believed truth was determined by sovereign reason, not committee vote.

  Hobbes viewed the claim that the circle *could not* be squared as a form of intellectual tyranny akin to the claims of the Church. The mathematicians were saying, "There are truths you cannot know, mysteries beyond human construction." To Hobbes, this smelled of the "Kingdom of Darkness"—the clerical claim that priests alone hold the keys to invisible truths.

  By insisting he could square the circle, Hobbes was asserting the power of human reason to comprehend the entirety of space and motion without recourse to mystery, authority, or the "incomprehensible" infinitesimals Wallis used. To back down would be to concede that there are limits to materialist reason, a concession his political enemies (the clergy) would exploit to argue that faith must fill the gap.

  ### Summary
  Hobbes didn't treat the mistake as a mathematical error because, in his system, **there was no such thing as a purely mathematical error.**

  Mathematics was the study of the consequences of motion. If his math was wrong, his physics was wrong. If his physics was wrong, his epistemology (that we know what we make) was wrong. And if his epistemology was wrong, his Political Philosophy (that we can construct a Commonwealth with the same certainty as a triangle) collapsed.

  He fought to the end because he was fighting for the coherence of **Materialism** itself. To admit Wallis was right would be to admit that the universe contains abstract quantities that human motion cannot construct or comprehend—a metaphysical concession Hobbes was philosophically incapable of making.
