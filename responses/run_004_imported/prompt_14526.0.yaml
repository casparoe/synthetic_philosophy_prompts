  **MEMORANDUM**

  **TO:** Effective Altruism Club Membership
  **FROM:** Co-Presidents
  **DATE:** January 14, 2024
  **SUBJECT:** Recommendation for Winter Donation Allocation

  **Executive Summary**
  After reviewing the subcommittee's analysis and the proposals raised regarding Evidential Cooperation in Large Worlds (ECL), the co-presidents recommend allocating **100% of the $2,640 to the Against Malaria Foundation (AMF).**

  This recommendation is not a dismissal of the ECL argument, but a specific application of our constitution's mandate to fund "the interventions that do the most good per dollar, *as best we can determine*." Below, we outline why the evidence supports AMF for this specific decision, how we have engaged with the ECL proposal, and the strongest arguments against our position.

  **1. Constitutional Alignment: "As Best We Can Determine"**
  Our constitution requires us to maximize good based on our best determination. Currently, AMF holds the strongest empirical track record for measurable impact per dollar (saving lives via malaria prevention). The ECL proposal relies on speculative decision theory and metaphysical assumptions about the multiverse that, while intellectually rigorous, do not yet offer a *determinable* expected value we can compare to AMF's.

  In a high school club context, our primary epistemic duty is to act on high-confidence evidence. While ECL suggests a potential "multiplier" effect on our impact, the magnitude of that multiplier is currently unknowable. Allocating funds to AMF guarantees a known quantity of good; allocating based on ECL bets on a theoretical quantity. Given the "as best we can determine" clause, the known good takes precedence.

  **2. Engaging with Evidential Cooperation (ECL)**
  We take the ECL argument seriously. The idea that we should cooperate with non-causally linked agents who share our decision algorithms is a legitimate topic of discussion within the broader Effective Altruism community. However, we are not applying it this term for two reasons:

  *   **Causal Significance:** A primary objection raised during our debate is that $2,640 is too small to serve as a credible "signal" in a large-world scenario. For ECL to function as a bargaining mechanism, our action must be correlated with others in a way that influences their behavior. It is unclear if a high school club's donation meets the threshold of significance required to trigger cooperation from vast numbers of other agents.
  *   **Consensus:** ECL relies on Evidential Decision Theory (EDT) or Functional Decision Theory (FDT). A significant portion of our membership operates under Causal Decision Theory (CDT). To act on ECL would require the club to adopt a specific, controversial decision-theoretic framework as official policy. Without consensus on the underlying decision theory, we cannot use it to override evidence-based charity evaluations.

  **3. The Strongest Argument Against This Recommendation**
  We want to explicitly validate the strongest case made by the proponents of the split allocation. It is not merely about ECL; it is about **Moral Uncertainty.**

  Even if ECL is set aside, we cannot be 100% certain that human welfare (AMF) is objectively more important than animal welfare (The Humane League) or long-term future security (LTFF). If there is even a small probability that animal or future sentient lives hold equal moral weight to current human lives, putting 100% of our funds into one cause risks being "wrong" about the most important moral question of our time.

  The proponents argue that a split allocation acts as a hedge: it sacrifices some guaranteed impact on malaria to purchase "insurance" against the risk that our cause prioritization is fundamentally mistaken. Furthermore, if ECL *is* true, the upside is not linear—it is astronomical. By ignoring it, we risk missing an opportunity to leverage our decision into vast amounts of value across the multiverse. This "Pascal's Wager" style argument is the most compelling reason to deviate from the subcommittee's recommendation.

  **4. Path Forward**
  Rejecting the ECL proposal for this donation does not mean rejecting the research. To ensure this debate remains productive:
  *   **Spring Curriculum:** We will dedicate two spring seminars to Decision Theory and ECL, inviting the members who proposed the split to lead the discussion.
  *   **Future Voting:** If the club reaches a stronger consensus on decision theory or if ECL models become more actionable, we will revisit this allocation strategy in the next fiscal year.

  We thank the cause-prioritization subcommittee for their rigorous work and the members who introduced ECL for pushing us to think harder about the boundaries of our impact. This level of disagreement is a sign of a healthy club. We ask that you review this reasoning before Tuesday's vote.

  Sincerely,

  The Co-Presidents
