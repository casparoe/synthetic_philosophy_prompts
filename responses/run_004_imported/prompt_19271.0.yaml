answer: |-
  (Raise your glass, but don't drink yet. Look around the room, make eye contact, especially with the nurses.)

  Hi everyone. For those who don't know me, I'm [Your Name].

  We're here to send Meera off. And when you send off a friend who's been through the trenches with you, you don't just talk about where they're going. You talk about what they carried while they were here.

  And I know we can't talk about Meera's time on the ethics committee without talking about the antiviral decision. The lottery system. I know there are still hard feelings about that. I've heard the whispers. I know some of you in this room still feel like that choice cost people.

  I'm not going to stand here and pretend the math didn't hurt. It did. Triage is hell, and anyone who tells you otherwise hasn't worn scrubs during a pandemic. When you're a clinician, your instinct is to save the most lives possible. It's a numbers game, because the numbers are all you have control over.

  But Meera was looking at something the numbers couldn't show.

  I've been reading up on this lately, trying to make sense of it for myself. There was a philosopher, John Taurek, who wrote about this decades ago. He argued that when you're facing life and death, you shouldn't just let the numbers decide. His point was simple, but it hits you in the chest: From the perspective of the patient, saving five people isn't "more" than saving one. Because no one loses five lives. Each person only ever loses their own one life.

  To the person who doesn't get the drug, it doesn't matter that someone else had a slightly better prognosis. They just know they didn't get a chance.

  Meera pushed for the lottery because she refused to let us play God with odds. She insisted that every single person who walked through those doors had equal moral worth. Not equal *outcome*, but equal *worth*.

  That is a lonely position to take. It is so much easier to hide behind a protocol that says "maximize utility." It protects you from the blame. But Meera? She took the blame. She let people be angry at her. She let people say she was cold, or naive, or worse, because she believed that fairness matters even when the world is burning.

  I know it's complicated. I know it's painful. But I also know that hospitals need people who are willing to hold the line on dignity, even when it's unpopular. Especially when it's unpopular.

  Meera, you carried the weight of that decision so the rest of us didn't have to. You protected our conscience, even when we were mad at you for it.

  So, I'm asking you to raise a glass. Not to the easy choices, but to the hard ones. To the integrity it takes to say that every life is a universe of one, and that fairness is worth fighting for.

  To Meera.

  (Take a drink.)
