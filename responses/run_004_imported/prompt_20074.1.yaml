  9.  **Final Polish:** Ensure references to relevant literature (Dennett, maybe Hoover on causal abstraction, maybe recent SAE papers like Gemma or Anthropic). *Self-correction: Keep it conceptual, don't get bogged down in specific paper citations unless they are seminal.*

  **(Self-Correction during drafting):** I need to make sure I distinguish between *reconstruction* (autoencoding) and *explanation* (interpretability). SAEs optimize the former to get the latter. The gap is where the epistemology lives.

