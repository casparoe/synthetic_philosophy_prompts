      *   **Section 1: The Ontological Bar.** What makes a component *real*? (Causal efficacy, stability, non-arbitrariness).
      *   **Section 2: Dennett's Real Patterns.** How it applies. Does it help? It shifts from "is it true?" to "is it useful?" But usefulness is relative.
      *   **Section 3: The Relocation of Dispute.** The cost function problem. Who decides the penalty for complexity?
      *   **Section 4: A Path Forward.** Causal abstraction, scale-relative reality, convergence.
