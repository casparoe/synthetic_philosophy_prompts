  *(Self-Correction Note)*: I need to make sure I don't accidentally make Molinism sound like determinism. The key is that the truth is *counterfactual*, not *causal*. The Open Theist will argue that distinction is illusory. I need to make sure that tension is the climax of the dialogue.

