answer: |-
  **Linz, 1620.** The study is dim, lit by a pair of tallow candles that sputter in the draft from the window. The table between them is a landscape of paper: scattered ephemerides, ink-stained compasses, and a large horoscope wheel half-drawn in charcoal.

  **Helisaeus Röslin** leans forward, tapping a finger on the circle of the zodiac drawn on the paper. **Johannes Kepler** sits opposite, rubbing his temples, a quill tucked behind his ear.

  **Röslin:** You ask me to discard the signs, Johannes. Twelve centuries of physicians, kings, and navigators have relied upon the Ram, the Bull, the Lion. And now you tell me they are fictions? Look at the sky. The Sun warms us when it climbs high, it chills us when it sinks low. The equinoxes are real. The solstices are real. The Zodiac is merely the map of that journey. How can a map be "arbitrary bookkeeping" when the terrain is physical?

  **Kepler:** The terrain is physical, Helisaeus, I grant you. The ecliptic is the Sun's path, and the Earth's tilt creates the seasons. But nature does not count in thirties. Show me a stone that falls thirty degrees. Show me a plant that blooms because the Sun entered a sector drawn by Chaldean priests. The Zodiac is a grid we lay over the heavens, like latitude and longitude on a globe. It is useful for naming, yes, but it has no causal power. A planet does not change its nature because it crosses an imaginary line we drew between stars that have no connection to one another.

  **Röslin:** And yet you keep the aspects. The sextile, the square, the trine. Are these not also lines drawn by men? If I stand in a field and look at two trees, the angle between them exists only because I am there to measure it. If the Earth is the observer, as you say, then the angle is relative to the Earth. Why is the angle "real" while the sign is "fiction"? Both are geometry projected by a human mind onto the void.

  **Kepler:** (Leaning in, eyes brightening) Because the angle is not merely projected. It is *constructed*. Tell me, Helisaeus, if I pluck a string and then pluck a string half its length, what do you hear?

  **Röslin:** An octave. A consonance. Any musician knows this.

  **Kepler:** And if I take two-thirds of the string?

  **Röslin:** A fifth.

  **Kepler:** Precisely. These ratios—one to two, two to three, three to four—they exist whether a human ear hears them or not. They are woven into the fabric of creation. They are the language of the Architect. Now, look to the heavens. A conjunction is a union of rays. An opposition is a diameter, a ratio of one to two. A trine divides the circle by three; a square by four. These are the same ratios that govern music. They are the only geometrical figures that can be inscribed in a circle using the known methods of construction. They are objective truths, not subjective divisions.

  **Röslin:** You argue from music to meteorology. It is a poetic leap. Even if I grant that the square aspect corresponds to the musical fourth, why does this cause rain? Or war? Or a fever in the King? A geometric ratio is a relationship of numbers. Numbers do not wet the soil. In the old system, Mars rules the Fire signs. When Mars enters Aries, his heat is compounded. We have a mechanism: planetary nature plus zodiacal quality. You strip away the zodiac, you strip away the rulerships, you strip away the houses. You leave me with... triangles. How does a triangle make it rain?

  **Kepler:** Not a triangle! A configuration of light! Think of the Earth not as a dead clod of dirt, but as a living body, endowed with a soul, an *anima terrae*. Just as your soul responds to music without you calculating the ratios, the Earth's soul perceives the aspects. When the rays of two planets converge upon the Earth at a square, the Earth feels a tension, a dissonance. It stirs the vapors. It shakes the humors. It is not the geometry itself acting on the mud; it is the geometry perceived by the living Earth.

  **Röslin:** (Sighs, leaning back) So now the Earth is a beast that shivers when Saturn and Mars make a right angle. This is your "physics"? It seems to me you are replacing one mystery with a greater one. At least the old astrology is honest. It says the stars *signify*. It does not claim they push and pull like invisible hands. But you... you want them to be physical causes. If the Earth's soul perceives these harmonies, why does it not perceive the signs? If the Earth is alive, does it not know it is Spring?

  **Kepler:** It knows the seasons! But it does not know the name "Aries." The Earth responds to the *light* of the planets. The light varies in intensity and angle. The Zodiac signs are fixed stars in the background. They are distant suns, utterly unrelated to our system. Why should the light of Jupiter change because it is visually superimposed over the stars of the Scorpion? It is madness. It is like saying a man's voice changes pitch because he stands in front of a tapestry of a lion rather than a tapestry of a fish.

  **Röslin:** But the tapestry moves with the seasons! The signs are tied to the equinoxes. Aries is the vernal point. It is the time of sprouting.

  **Kepler:** The *point* is natural. The *thirty-degree segment* is not. Where does Aries end and Taurus begin? At exactly thirty degrees? Does the sap in the tree stop flowing at twenty-nine degrees and resume at thirty-one? Nature flows continuously. She does not jump in steps of thirty. But the aspects... the aspects are distinct. A conjunction is a meeting. An opposition is a parting. These are moments of change, discrete events in the continuous flow.

  **Röslin:** (Picks up a pair of compasses, spinning them idly) You are a mathematician, Johannes. You seek perfection. But look at the practitioners. I have cast charts using the old rules—the domiciles, the exaltations, the lots of Fortune—and I have predicted the harvest. I have warned of plagues. If the system were mere superstition, would it work so often?

  **Kepler:** It works often enough to keep us in business, and often enough to keep the Emperor interested. But how often does it fail? How many times have we seen a "benefic" Jupiter in a "dignified" sign bring hail and ruin?

  **Röslin:** And how many times have your "harmonic aspects" failed to stir the weather? You criticize the old house system, yet you cast nativities. You calculate the Ascendant. Is the Ascendant not the cusp of the first house? If the horizon is an arbitrary circle relative to the Earth, why does the moment of birth matter?

  **Kepler:** (Pauses, looking down at the charcoal chart) The moment of birth... that is the imprint of the configuration upon the infant soul. It is the first breath, the first intake of the cosmic harmony. I do not deny the Ascendant. I deny that the sky is divided into twelve equal rooms above that horizon. The sky is one field of light. The houses are... shadows.

  **Röslin:** Shadows that guide kings. You walk a razor's edge, my friend. You wish to cleanse astrology of its superstitions, but in doing so, you strip it of its language. If I cannot say "Mars in Scorpio," if I cannot say "Saturn in the Tenth House," what do I tell the patron? "Sir, the Earth's soul felt a tritone"? They will throw you out before you finish the sentence.

  **Kepler:** Then let them throw me out. I would rather be a midwife to a new science than a nursemaid to an old superstition. I am trying to save astrology from the charge of witchcraft. If we claim the stars force the will, we deny God and man. If we claim the stars incline through harmony, we honor the Creator's geometry and preserve free will.

  **Röslin:** And yet, you still cast the horoscope for Wallenstein. You still sell the almanac.

  **Kepler:** (Quietly) I have a family to feed, Helisaeus. And... I believe there is truth in the shadows, even if the map is wrong. I am trying to find the bone beneath the flesh.

  **Röslin:** But you cannot have the bone without the flesh. The aspects are the skeleton, I grant you. But the signs, the houses, the rulerships... this is the muscle. It gives the system leverage. Without it, your harmonies are beautiful, but they are silent. They sing in the void, but they do not speak to human life. You say the Earth feels the square aspect. Does the Earth feel the difference between a square from Mars and a square from Venus?

  **Kepler:** Yes. Because the rays themselves differ. Mars emits a piercing, drying ray. Venus emits a moist, tempering ray. The geometry is the vessel; the planet is the wine.

  **Röslin:** Then why does the vessel matter so much? If the wine is the cause, why do you obsess over the angle of the cup? If Mars is hot, he is hot in Aries, he is hot in Libra. Why does the square aspect trigger the effect and not the mere presence of the planet?

  **Kepler:** Because a single voice does not make harmony. It is the *relation* that stirs the soul. One note is just a tone. Two notes in tension create movement. The Earth sleeps in the continuous light of the planets. It is woken by the change in their relationship.

  **Röslin:** (Shakes his head, dipping his quill into the inkwell) You build a cathedral of crystal, Johannes. It is brilliant. It is clear. But I fear it is too cold to live in. The old astrologers built a cottage of mud and straw. It leaks, yes. It is ugly. But men live there.

  **Kepler:** Then let them live there. I will stay in the cathedral. Perhaps one day, when the mud has washed away, others will join me.

  **Röslin:** Perhaps. Or perhaps you will find yourself alone, preaching geometry to the wind.

  *Röslin bends over the chart, drawing a thick line through the Ascendant. Kepler watches him for a moment, then turns his gaze to the window, where the stars are beginning to pierce the twilight, silent and distant.*

  **Kepler:** The wind also has its ratios, Helisaeus. Even the wind.

  **Röslin:** (Without looking up) Calculate them for me when you have finished. I have a nativity due by morning.

  *Kepler says nothing. He picks up his compass, opens it, and hovers it over the blank paper, measuring nothing.*
