answer: |-
  **The Huck Finn Problem: A Dialogue on Moral Worth**

  **Elena:** Let's go back to the river. Huck decides not to turn Jim in. He writes the letter to Miss Watson, then tears it up, saying, "All right, then, I'll go to hell." He acts rightly, but he believes he is acting wrongly. For me, that disconnect disqualifies the act from having full *moral worth*.

  **Marcus:** Disqualifies it? Huck is sacrificing his eternal soul, by his own lights, to save a friend. If that isn't moral worth, what is?

  **Elena:** It's praiseworthy, certainly. But moral worth requires a specific relationship to the rightness of the act. Michael Smith argued that if you do the right thing but don't care about its rightness, you're like a clock that tells the right time only because you manually set the hands. You aren't functioning as a moral agent. Huck is moved by affection, not morality. If his affection for Jim had cooled, he would have turned him in. His goodness is fragile.

  **Marcus:** That's the "moral fetishism" charge, isn't it? You're suggesting that to be truly good, I have to care about "Morality" as this abstract, glowing property hovering over the action. But that seems narcissistic. When I help a friend in pain, I'm focused on *their pain*, not on the deontic status of my intervention. Huck is focused on Jim's humanity. That is the reason that *makes* the act right. His motivating reason coincides with the normative reason. That's the view Julia Markovits defends. Why isn't that enough?

  **Elena:** Because coincidence isn't commitment. Consider Kant's shopkeeper. He charges fair prices because it's good for business. The normative reason—honesty is required—is present. The motivating reason—profit—is not. We agree he lacks moral worth there. But Huck is the mirror image. The normative reason is present (Jim's freedom), and the motivating reason is present (loyalty), but he explicitly rejects the normative reason. He thinks he *should* turn Jim in. How can you get credit for doing what you think you shouldn't do?

  **Marcus:** He gets credit because he's responsive to the values that actually matter. You're demanding a second-order thought: "I am helping Jim, and helping Jim is Right." But adding that thought doesn't make the world better. It doesn't help Jim more. It just makes the agent more morally self-conscious.

  **Elena:** It makes the agent reliable. That's what you're missing. Imagine a case where someone's inclinations align with duty purely by luck. Say I want to borrow your car to drive to the coast. Unbeknownst to me, you need me to take the car so you can collect insurance on a theft you're faking. My selfish desire aligns with your fraudulent need. I do the "right" thing relative to your plan, but I'm just dialing the right phone number by accident.

  **Marcus:** That's a false analogy. Huck isn't guessing. He sees Jim is a person. He sees the cruelty of slavery. His emotions are tracking the moral truth, even if his intellectual moral theory—racist Southern Christianity—is lagging behind.

  **Elena:** But if he doesn't know he's tracking the truth, he can't correct course when his emotions fail. Suppose Huck wakes up one day and just doesn't *like* Jim anymore. On your view, does he now have an obligation to turn him in? No. But on my view, the only thing that would have kept him safe is a commitment to the idea that "enslaving people is wrong," regardless of his feelings. He lacks that commitment. He's morally lucky.

  **Marcus:** And on your view, if I help you *because* it's my duty, but I secretly resent you and would cheat you if the law didn't watch me, I'm somehow morally superior to the person who helps you because they love you? That seems to privilege the neurotic over the kind. You're worried about luck, but I'm worried about alienation. You want the agent to be alienated from their own sentiments, looking over their shoulder at the "Rightness" meter.

  **Elena:** I don't want alienation. I want integration. I'm happy if duty is just one motive among many. But it has to be *in the room*. It has to be doing some of the work. If I help you because I love you *and* because I think you deserve help, I'm secure. If I help you *only* because I love you, I'm at the mercy of my moods. Huck is a hero, but he's not a moral exemplar. He's a beautiful accident.

  **Marcus:** But what if the "duty" thought crowds out the human thought? There's a danger in making moral worth about the agent's purity rather than the victim's relief. If Markovits is right, worth is about the alignment of reasons. Huck's reason is "Jim is suffering." The truth is "Jim is suffering." The line connects. You want a detour through "It is my duty to alleviate suffering." Why is the detour necessary for worth?

  **Elena:** Because without the detour, you don't respect morality itself. You just respect Jim. If you only respect Jim, you're a good friend, but not necessarily a good person. What about the stranger you'll never see again? Huck wouldn't help a stranger he didn't like.

  **Marcus:** Maybe he would, if he imagined them as he imagined Jim. Look, we're at a standstill. You think moral worth is about the structure of the will—having the right reflexive attitude toward the law. I think it's about the content of the will—being moved by the features of the world that demand a response.

  **Elena:** And I think without the reflexive attitude, the content is just psychology, not morality.

  **Marcus:** And I think with only the reflexive attitude, the morality is just psychology—a desire for self-congratulation.

  **Elena:** So Huck goes to hell, in his mind, and we still can't agree if he's good.

  **Marcus:** He's good. You just can't see it because you're looking at his conscience instead of his friend.

  **Elena:** And you can't see that without a conscience, he has no anchor.

  *(Both sip coffee, the silence hanging between the structural and the substantive.)*
