          *   *The Fatal Flaw:* The student claims the successor is *stronger* ("strictly smarter"), but also claims the parent certifies the child. In formal arithmetic, a system cannot prove the soundness of a strictly stronger system (unless it's inconsistent). If $S_1 \vdash Sound(S_2)$ and $S_2$ is strictly stronger than $S_1$, then $S_1$ proves its own consistency (roughly), which violates G2.
          *   *The Actual Tiling Solution:* Usually, $T_{parent}$ proves $T_{child}$ is sound. Therefore $T_{parent}$ must be stronger. Therefore the child is *weaker*. The cost is that the agents get *dumber* (lose proof strength) over time.
          *   *Student's Claim:* "each new agent inherits a more powerful system... strictly smarter... hierarchy fully dissolves the obstacle."
          *   *Verdict:* This is factually incorrect regarding the formalism. You cannot have an infinite chain of *increasing* strength where the parent proves the child's soundness. That would imply the first agent proves the consistency of a system infinitely stronger than itself, which is impossible. The "cost" is specifically that the agents get *weaker*, not stronger. The student got the direction of the strength change wrong, and thus missed the "cost" (loss of strength/termination).

  3.  **Drafting the Rubric (JSON):**
      *   Need 3 parts (a, b, c).
      *   Total 10 points. Let's weight them. (a) is definition (3 pts), (b) is G2 relation (3 pts), (c) is hierarchy/cost (4 pts). Or maybe (a) 3, (b) 2, (c) 5 since (c) has the complex error. Let's stick to a balanced 3/3/4 split.
