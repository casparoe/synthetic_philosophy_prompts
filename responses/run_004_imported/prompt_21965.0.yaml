answer: |-
  Here is the tie-breaker you asked for, broken down into the historical/exegetical question (what Augustine actually thought) and the philosophical question (who is right).

  ### Part 1: Does Augustine's Logic Condemn Non-Verbal Ruses?

  **Verdict: Your friend is more correct about Augustine's internal logic, but you are right about the technical distinction.**

  To understand why, we have to look at how Augustine defines a lie. It is not simply "saying something false." In *De Mendacio* and *Contra Mendacium*, Augustine defines a lie as *enuntiatio contra mentem*—"a statement against one's own mind." It requires two things:
  1.  The speaker knows the truth is X.
  2.  The speaker intentionally signifies not-X to another person.

  The crucial variable here is **signification**. Augustine was a semiotician; he believed words are signs, but **actions can also be signs.**

  If a soldier raises a white flag, that is not just an action; it is a communicative sign that means "I surrender; do not shoot." If that soldier intends to shoot you after raising the flag, Augustine would condemn this as a lie (perfidy). Why? Because the soldier used a conventional sign to assert a falsehood. The medium (fabric vs. vocal cords) does not matter; the abuse of a sign given for communication does.

  Therefore, regarding your specific point about military deception:
  *   **Camouflage/Concealment:** Augustine distinguishes between *hiding* the truth and *asserting* the false. If you hide in a bush, you are withholding a sign. You are not asserting "I am not here." Augustine generally allows for silence and concealment (*dissimulatio*). So, camouflage and dummy tanks (which are passive objects) likely fall into a permissible gray area for him, provided they don't mimic specific protected signs (like a Red Cross).
  *   **Active Ruses/Undercover Work:** This is where your friend wins. Consentius wanted to *profess* a faith he didn't hold. That is a verbal assertion against the mind. Similarly, fake radio chatter mimicking a specific unit's command structure is an assertion. Augustine's core objection is the **will to deceive** (*voluntas fallendi*) using the faculties of communication God gave us.

  **The Tie-Breaker on History:** If Augustine were presented with modern laws of war, he would likely agree that *perfidy* (faking surrender) is sinful lying, but he might tolerate *camouflage* as mere concealment. However, regarding the Consentius case (undercover infiltration requiring profession of belief), your friend is absolutely right: Augustine condemns it. His framework is not limited to "speech sounds"; it covers any intentional communication of falsehood. His rigidity is about the **integrity of the sign**, not just the mouth that speaks it.

  ### Part 2: Which Ethical Framework Holds Up Better?

  **Verdict: Your position (the Standard View) holds up better.**

  While Augustine's position is internally consistent, it fails as a functional ethical system because it treats "Truth" as a metaphysical idol rather than a social virtue. Here is the decisive argument for why the Standard View (deception in adversarial contexts is permissible; deception in cooperative contexts is not) is superior.

  **1. The Function of Truth-Telling**
  Augustine treats truth-telling as an absolute duty owed to God, regardless of the human context. The Standard View treats truth-telling as a **social contract**. We tell the truth to enable cooperation, trust, and coordination.
  *   **Why the Standard View wins:** When you are at war, or when you are dealing with a heretical sect that intends to destroy you (from the Catholic perspective), the cooperative framework is already broken. You are not in a relationship of trust with the enemy. Therefore, the obligation to maintain the "truth contract" is void. Augustine's view demands you maintain a cooperative norm (honesty) in a non-cooperative context (war/infiltration), which is category error. It prioritizes the abstract purity of the speaker over the safety of the community.

  **2. The Problem of Conflicting Duties**
  Augustine admits that lying to save a life is a sin, just a "lesser" one. This creates a moral absurdity where a person is forced to choose between two sins.
  *   **Why the Standard View wins:** A robust ethical system should not force a moral agent into a "lose-lose" scenario when a clear hierarchy of values exists. Preserving innocent life is a higher good than preserving the technical accuracy of a statement. The Standard View resolves this by contextualizing the lie: lying to a murderer at the door is not a violation of trust, because the murderer has forfeited their right to the truth by threatening the social order. Augustine's framework cannot resolve this without damaging the agent's conscience (forcing them to accept guilt for doing the right thing).

  **3. The Slippery Slope Counter-Argument**
  Your friend's strongest point is likely the "slippery slope": if we allow lies for good causes, where does it end? Augustine avoids this by drawing a line at zero.
  *   **Why the Standard View wins:** The Standard View does not actually allow a slippery slope because it has a built-in brake: **Context.** We already successfully navigate this in daily life. We accept bluffing in poker, deception in football (fake outs), and secrecy in business negotiations, but we condemn lying to a spouse or a judge. Society does not collapse because we recognize these contexts are different. Augustine assumes any exception destroys the rule, but human experience proves we can maintain distinct ethical boundaries for distinct social spheres.

  ### Final Score

  *   **On Augustine's Text:** **Your Friend Wins.** Augustine's definition of lying relies on the *intent to deceive via signs*, not just vocalization. He would condemn undercover profession of faith and perfidy in war. He is more consistent than you gave him credit for.
  *   **On Ethical Reality:** **You Win.** Augustine's framework is too rigid to survive contact with the real world because it prioritizes the metaphysical status of a statement over the concrete well-being of human beings. The Standard View is superior because it recognizes that truth is a tool for human flourishing, not a master to be served at the cost of human life.

  **The Bottom Line:** Your friend is a better theologian (she understands Augustine's consistency); you are a better ethicist (you understand why that consistency is unsustainable).
