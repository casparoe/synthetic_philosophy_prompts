  "You're missing the point of the expansion," Marcus said, capping his marker. "We aren't talking about a new offer. We're talking about the *feasible set* changing because Alex's IP valuation doubled. The disagreement point is zero. The original set $S$ was symmetric. Max payoff for both was ten million. Nash and Kalai-Smorodinsky both give us five-five. That's the baseline."

  Elena nodded. "Agreed. Symmetry and Pareto efficiency lock that in. But now we move to set $S'$. Alex's maximum possible take—their ideal point—has jumped to twenty million. Yours stays at ten. The set $S'$ strictly contains $S$."

  "Right," Marcus said. "So, under Kalai-Smorodinsky, we look at the ideal point $(10, 20)$. We draw a line from the disagreement point $(0,0)$ to that ideal. We pick the point on the frontier that preserves that ratio. You get one-third of the total potential value, I get two-thirds. If the frontier allows, I get roughly $3.3$ million, you get $6.6$ million."

  "And under Nash?" Elena asked.

  "Under Nash," Marcus said, tapping the napkin hard, "you maximize the product of the gains. $x \cdot y$. Because the frontier has to stretch to reach your new twenty-million ceiling, the geometry changes. The curve gets steeper in the middle. The tangent point of the hyperbola shifts. In this specific configuration, the Nash solution moves to $(4, 11)$."

  Elena paused, spoon hovering. "I get four? I get *less* than the original five, even though the set of options expanded and my own maximum capability didn't change?"

  "Exactly," Marcus said. "That is the violation of Monotonicity. My opportunities improved. Your opportunities stayed exactly the same. Yet, under your beloved Nash solution, you are punished. You are worse off because I became more valuable."

  "I am not punished," Elena corrected, her voice cool. "The *local trade-off rate* changed. That is all Independence of Irrelevant Alternatives (IIA) cares about. IIA says: if the solution to the big problem ($S'$) happens to be available in the small problem ($S$), it must be the solution to the small problem. Conversely, if we remove options from $S'$ that we weren't going to pick anyway to get back to $S$, the solution shouldn't jump."

  "But it does jump," Marcus countered. "In your world, the mere existence of my higher ceiling changes the price of our cooperation, even if we never touch that ceiling. It implies that my bargaining power is derived from threats I have no intention of making. It feels... vindictive."

  "It's not vindictive, it's consistent," Elena said. She pulled the napkin toward her. "Think about *why* the point moves to $(4, 11)$. It moves because to give you that twenty-million potential, the frontier had to bulge. That bulge changes the marginal rate of substitution at the solution point. In the neighborhood of the agreement, you are now relatively more efficient at converting joint value into your own utility. Nash rewards marginal efficiency. It doesn't care about your distant, unrealized potential."

  "It cares about the shape of the set," Marcus said. "And the shape is determined by my maximum. So it *does* care about my potential. It just cares about it in a way that hurts the other party. That's why Monotonicity is the better axiom for long-term cooperation. If I know that developing new IP—which expands the set in my favor—might actually *reduce* your share, I have a perverse incentive to hide my potential. Or, if I'm you, I have an incentive to block my growth to protect my bargaining share. Nash creates a tax on improvement."

  Elena leaned back. "And Kalai-Smorodinsky creates a subsidy for inefficiency. If I guarantee you a fixed proportion of your ideal point, what stops you from inflating your ideal point? What stops you from adding 'irrelevant alternatives'—fake options, grandiose claims—to shift the ideal point and drag the solution line toward you?"

  "IIA is supposed to prevent that," Marcus conceded. "But IIA is too rigid. It treats the feasible set as a static menu. But bargaining is dynamic. If I bring more to the table, even as potential, the spirit of the deal should reflect that I am bringing more, not that I am crushing you."

  "Unless 'crushing' is just a side effect of efficiency," Elena said. "Look, let's step back from the startup. You know the objection my friend in mechanism design always raises? He says this whole debate is academic theater. 'No real negotiator computes a tangent,' he says. 'They split the surplus based on power dynamics and outside options. These axioms are just post-hoc rationalizations.'"

  Marcus sighed. "The 'no one calculates it' argument. It's the most boring objection in economics."

  "Is it?" Elena pressed. "If the math doesn't map to the behavior, is the dispute substantive? Or is it just a disagreement about which aesthetic we prefer? Do we prefer the aesthetic of local consistency (Nash) or the aesthetic of proportional fairness (K-S)?"

  "It is substantive," Marcus said immediately. "Because these solutions aren't just descriptions; they are *normative*. When you write a smart contract to arbitrate a dispute between two AIs, or when you design a governance protocol for a DAO, you have to code an objective function. You cannot code 'power dynamics.' You have to code an axiom. If you code Nash, you are encoding the belief that only realized trade-offs matter. If you code K-S, you are encoding the belief that potential matters."

  "But which belief is *true*?" Elena asked. "That's the question. Is fairness about respecting the local geometry of the deal, or is it about respecting the relative standing of the agents?"

  "I think it's about avoiding the 'paradox of expansion'," Marcus said. "Imagine we are moral theorists aggregating credences. Theory A and Theory B. Initially, they have equal weight. We split resources 50/50. Then, Theory A discovers a new argument that expands its maximum possible utility—it can save more lives, essentially. Theory B's maximum stays the same. Under Nash, Theory B might lose allocation *because* Theory A became more potent. That seems morally wrong. It penalizes moral progress."

  Elena shook her head. "But under K-S, if Theory A inflates its maximum claim—say, by adopting a utilitarian framework with infinite scope—it drags all resources toward itself, even if the *marginal* benefit of those resources is low. Nash protects the marginal value. It ensures resources go where they do the most good *at the margin*, not where the theoretical ceiling is highest. In the AI context, Nash prevents an agent from holding the negotiation hostage by claiming it has a 'maximum utility' of a googolplex."

  "So you think IIA is a shield against bluffing?"

  "I think IIA is a shield against context-dependence," Elena said. "If the solution depends on options we aren't choosing, then the solution is unstable. If I can change the outcome by adding a dummy option that no one wants, the mechanism is gameable. Nash is immune to that. K-S is not. K-S depends on the ideal point. If I can manipulate the ideal point, I manipulate the deal."

  "You can manipulate the ideal point in Nash too, by warping the frontier," Marcus shot back. "But let's answer your friend's challenge. Is there a fact of the matter?"

  Elena considered this. She looked out the window at the rain. "I think the fact of the matter is that 'Fairness' is not a single dimension. It's a vector. Nash optimizes for *stability* and *efficiency*. K-S optimizes for *solidarity* and *relative fairness*. The disagreement is substantive because it forces you to choose which value you are willing to violate."

  "Which one is more damning?" Marcus asked. "Violating Monotonicity? Or violating IIA?"

  "Violating Monotonicity feels like a betrayal," Marcus said softly. "It says, 'I am worse off because you did better.' That corrodes trust. In a repeated game, in a co-founder relationship, that kills the partnership."

  "Violating IIA feels like insanity," Elena countered. "It says, 'The answer changes even though the relevant options didn't.' That corrodes rationality. If the solution moves when I remove an option I wasn't going to take, then the solution was never about the options. It was about the geometry. It makes the outcome arbitrary."

  They sat in silence for a moment. The napkin sat between them, stained with coffee and ink, covered in triangles and curves.

  "Here's the thing," Marcus said finally. "Your friend the mechanism designer is right that no one calculates the tangent. But they calculate the *intuition*. When a co-founder says, 'Wait, just because I found a bigger market doesn't mean you get less,' they are invoking Monotonicity. When a lawyer says, 'The terms shouldn't change just because we discussed a higher valuation that we didn't accept,' they are invoking IIA."

  "So the math is just the rigorous version of the gut check," Elena said.

  "Exactly. And the gut check disagrees. That's why the math disagrees." Marcus picked up the napkin. "So for the startup? Alex and Jamie?"

  Elena smiled, a thin, sharp expression. "If they want to maximize the exit value and prevent gaming of the IP valuation? Nash. If they want to ensure Alex keeps incentivized to grow the pie without punishing Jamie for Alex's success? Kalai-Smorodinsky."

  "They can't have both."

  "No," Elena said, picking up her cup. "They can't. That's the theorem. They have to decide what kind of partners they want to be. Consistent rationalists, or solidaristic collaborators."

  "And if they can't agree on that?"

  "Then the feasible set shrinks to the disagreement point," Elena said. "Zero for both."

  Marcus folded the napkin and put it in his pocket. "I'll draft the K-S clause. You draft the Nash."

  "May the best axiom win."

  "May the partnership survive."
