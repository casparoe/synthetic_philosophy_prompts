answer: |-
  # The Wager of Time: Adjudicating the Kelly Criterion

  The debate over the Kelly criterion is not merely a technical dispute about portfolio allocation; it is a philosophical collision between two conceptions of rationality. On one side stands the traditional expected-utility framework, which views rationality as the satisfaction of subjective preferences under uncertainty. On the other stands the emerging "ergodic" or geometric rationality framework, which views rationality as alignment with the objective physics of time and growth.

  Your friend argues that Kelly betting is a norm because it respects the trajectory of a single life through time. You argue, following Paul Samuelson, that Kelly is merely a specific utility function masquerading as a universal law. To resolve this, we must strip away the rhetoric of "heuristics" and "fallacies" and examine the structural conditions under which wealth evolves.

  ### The Case for Geometric Rationality

  Your friend's position rests on a physical observation about how wealth actually behaves. In quantitative finance and biological evolution, wealth is rarely additive; it is multiplicative. If you gain 50% and then lose 50%, you do not break even; you lose 25%. This compounding creates a non-ergodic process.

  In an ergodic system, the time average (what happens to one person over many trials) equals the ensemble average (what happens to many people in one trial). In a non-ergodic, multiplicative system, they diverge. The ensemble average expected value (EV) might be positive and infinite, but the time-average growth rate for a single trajectory can be negative.

  The strongest form of your friend's argument, championed by researchers like Ole Peters, is that traditional expected-value reasoning commits a category error. It averages over parallel hypothetical worlds that the agent will never experience. A rational agent lives in only one world, moving forward in time. If a betting strategy leads to "ruin" (wealth hitting zero, an absorbing state), the game ends. No amount of expected value in parallel universes matters to an agent who has gone broke in this one.

  Because the Kelly criterion maximizes the expected logarithm of wealth, it maximizes the time-average growth rate. In the limit of infinite repetitions, a Kelly bettor will almost surely outperform any other bettor. From this viewpoint, Kelly is not a preference; it is a law of motion. To bet more than Kelly is to invite volatility drag that erodes capital; to bet less is to leave growth on the table. Therefore, for any agent who wishes to persist in a multiplicative environment, Kelly is the only dynamically consistent strategy. It is a rationality norm because violating it is tantamount to choosing self-elimination.

  ### The Case for Expected Utility (The Samuelson Objection)

  Your position relies on the rigorous architecture of decision theory established by von Neumann and Morgenstern. The core tenet is that rationality consists in maximizing the expectation of a utility function that represents an agent's preferences.

  Paul Samuelson's 1971 critique, "The 'Fallacy' of Maximizing the Geometric Mean," remains the bedrock of this view. Samuelson conceded that the geometric mean (Kelly) dominates in the infinite long run. However, he noted that "in the long run we are all dead." For any finite horizon $T$, maximizing expected log wealth does not necessarily maximize expected utility.

  Consider an agent with a specific liability: they need \$10 million in five years to fund a pension obligation. A Kelly strategy might maximize the *probability* of growing wealth, but it does not guarantee hitting that specific target. An agent with a linear utility function (risk-neutral) over that specific horizon might rationally choose a higher-variance strategy that has a lower geometric growth rate but a higher probability of hitting the binary target.

  Furthermore, Samuelson argued that there is nothing privileged about the logarithm. Log utility implies a specific coefficient of relative risk aversion (CRRA = 1). An agent with CRRA = 2 (more risk-averse) or CRRA = 0 (risk-neutral) has different rational requirements. To claim Kelly is a "norm" is to impose a specific utility function on all agents. If rationality is defined as satisfying one's own preferences, then an agent who prefers a high-risk, high-reward trajectory (accepting a high probability of ruin for a small chance of astronomical wealth) is not irrational for rejecting Kelly. They simply value the tail risk differently.

  ### Adjudication: Physics vs. Preferences

  The stalemate at dinner arises because both sides are correct within different domains, but both overreach when claiming universality.

  The Ergodicity economists are correct that **Expected Value maximization is structurally flawed in multiplicative domains.** Relying on ensemble averages in a non-ergodic world is indeed a mathematical error that leads to ruin. If the choice were strictly between "Maximize Raw Expected Value" and "Maximize Geometric Growth," the latter wins for any agent intending to survive more than one round.

  However, Samuelson is correct that **Geometric Growth is not a substitute for Utility.** The ergodicity argument attempts to derive an "ought" from an "is." It argues that because the time-average growth rate is an objective physical quantity, agents *ought* to maximize it. But growth is only valuable insofar as it serves the agent's ends. If an agent's utility function is bounded (e.g., they only care about wealth up to a certain point) or if they have a short time horizon, the "objective" growth rate is irrelevant.

  The crucial synthesis lies in recognizing the difference between **instrumental rationality** and **constitutive rationality**.
  *   **Constitutive Rationality (Samuelson):** What are your goals? This is determined by your utility function. There is no norm here other than consistency.
  *   **Instrumental Rationality (Kelly):** Given your goals, what is the best method to achieve them? Here, the physics of the system imposes constraints.

  The ergodicity proponents fail when they claim Kelly is utility-independent. It is not. It presupposes the utility of *continuation*. If you do not care about staying in the game, Kelly does not apply. But the Samuelson camp fails when they treat Expected Value as a viable alternative in repeated betting. In a multiplicative system, raw EV maximization is not just risky; it is mathematically incoherent as a long-term strategy because it ignores the absorbing barrier of zero.

  ### The Verdict

  We must now render a verdict. Is the Kelly criterion a rationality norm or a heuristic?

  **Verdict:** The Kelly criterion is a **domain-specific rationality norm for capital preservation and growth**, but it is **not a universal decision-theoretic imperative.**

  It deserves the title of "norm" only under the following strict conditions:
  1.  **Multiplicative Dynamics:** The wealth process must be multiplicative (compounding), not additive.
  2.  **Indefinite Horizon:** The agent must intend to participate in the market repeatedly without a fixed stopping time.
  3.  **Preference for Continuation:** The agent must value remaining in the game (avoiding ruin) more than they value the asymmetric upside of over-betting.

  When these conditions are met, Kelly is not merely a heuristic; it is the **unique solution to the problem of dynamic consistency.** To violate Kelly in this domain is to accept a mathematical certainty of underperformance relative to the optimal growth path, and a high probability of ruin. In this specific context, your friend is right: maximizing raw expected value is irrational because it optimizes for a metric (ensemble average) that the agent will never experience.

  However, outside these conditions, Samuelson prevails. If the bets are additive (e.g., a salary negotiation), if the horizon is fixed and short (e.g., a quarterly earnings target), or if the agent has a utility function that specifically values a "lottery ticket" outcome over steady growth, then Kelly is irrational.

  **The Determining Factor:**
  The answer in any given case is determined by the **absorbing state**.
  *   If the decision environment contains an absorbing state (ruin) that terminates the agent's ability to make future decisions, and the agent wishes to avoid termination, then **Kelly is the rational norm.** It is the mathematical price of survival.
  *   If the decision environment allows for recovery from losses, or if the agent is willing to accept termination for a chance at a higher peak, then **Kelly is merely a strategy** corresponding to log-utility, and Expected Utility maximization remains the supreme norm.

  **Conclusion:**
  You should concede to your friend that in the specific realm of repeated financial investment, "Expected Value" thinking is indeed dangerous and often irrational due to non-ergodicity. The Kelly criterion is the correct tool for navigating the geometry of compounding time. However, you must hold your ground that this does not dethrone Expected Utility Theory as the broader framework for rationality. Kelly tells you how to drive the car to ensure it doesn't crash; Expected Utility tells you where you want to go. Confusing the mechanics of the engine with the destination of the journey is the error both sides risk making. Kelly is the rationality of the vessel; Expected Utility is the rationality of the voyager. Both are required, but neither is sovereign over the other.
