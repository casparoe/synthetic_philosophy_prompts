answer: |-
  Your intuition is spot on, and you should definitely trust it over your roommate's quick dismissal. While the **Sunk Cost Fallacy** is certainly present, labeling it as such is descriptive, not explanatory. It tells you *what* is happening (ignoring irrecoverable costs), but not *why* it is so psychologically sticky or how the strategic interaction with the neighbor transforms the decision matrix.

  For a behavioral econ seminar, this is actually a goldmine case study because it sits right at the intersection of **Game Theory** (strategic interaction) and **Behavioral Psychology** (deviations from rational utility maximization).

  Here is a breakdown of what is likely going on, structured so you can use it for your seminar.

  ### 1. The Game Theory: It's Not a Solo Decision
  Your roommate treated this as a single-agent decision problem (Uncle vs. The Void). But this is a two-player game. The neighbor's actions change the "rational" payoff structure.

  *   **The War of Attrition:** In game theory, this scenario is a classic *War of Attrition*. Two parties compete for a resource by accumulating costs over time. The winner is the one who can endure the costs longer. Theoretically, a rational actor calculates their "reservation price" (the max they will pay) and sticks to it. However, in a War of Attrition with incomplete information, neither side knows the other's limit. Your uncle might believe that if he holds out one month longer, the neighbor will crack.
  *   **Signaling and Reputation:** Your uncle said, "if I don't hit back... it'll look like he's caving." This is a **Signaling** problem. If he settles now, he isn't just losing the driveway; he is signaling to the neighbor (and potentially others) that he is a "soft target." If there is a non-zero probability that the neighbor will encroach on the *fence* next if they win the *driveway* now, then spending \$60k to defend the driveway might be rationally framed as an investment in deterring future litigation.
      *   *The Trap:* This logic holds water only up to a point. Once legal fees exceed the value of the driveway + the expected value of future encroachments, it becomes irrational. But because "future encroachments" are hypothetical, it's easy to overestimate their probability to justify current spending.
  *   **The Dollar Auction (Escalation of Commitment):** This is the most relevant game theory model. Martin Shubik's "Dollar Auction" involves auctioning off a dollar where the highest bidder wins the dollar, but *both* the highest and second-highest bidders must pay their bids.
      *   Once bidding hits \$0.90, the second bidder (at \$0.85) faces a choice: lose \$0.85 or bid \$0.95 to potentially win \$1.00 (netting \$0.05).
      *   Rational actors quickly bid past \$1.00 to minimize losses.
      *   **Application:** Your uncle and the neighbor are both the "second-highest bidder." They aren't paying for the driveway anymore; they are paying to avoid realizing the loss of the money they already spent.

  ### 2. The Behavioral Econ: Why Rationality Breaks Down
  Even accounting for strategy, \$60k for two feet of pavement is a massive deviation from standard utility maximization. Here is where the biases deepen the trap.

  *   **Loss Aversion (Prospect Theory):** This is arguably more powerful than sunk cost here. According to Kahneman and Tversky, losses loom larger than gains.
      *   **Framing:** Settling now frames the past \$60k as a *realized loss*. Continuing to fight keeps the possibility alive that the outcome will be a "win" (getting the driveway), which psychologically offsets the costs.
      *   **The Break-Even Effect:** Your uncle isn't trying to maximize wealth; he is trying to **break even**. He needs a victory that feels worth \$60k. Since the driveway isn't worth that, the *victory itself* must absorb the value. This leads to the next point.
  *   **Negative Reciprocity & Emotional Utility:** Standard econ assumes utility comes from assets (driveway, money). Behavioral econ acknowledges utility comes from emotions.
      *   Your uncle admitted: "he probably wouldn't even care... if the neighbor hadn't fought back."
      *   The utility function has shifted. It is no longer $U(Driveway)$. It is now $U(Driveway) + U(Punishing Neighbor) - U(Feeling Like a Pushover)$.
      *   If the emotional satisfaction of "not letting them win" or "making them suffer as much as I have" is high enough, spending \$60k is internally consistent, even if financially ruinous. This is **Negative Reciprocity**: the willingness to incur a cost to punish someone perceived as unfair.
  *   **Cognitive Dissonance & Self-Justification:**
      *   "I am a smart person who makes good financial decisions."
      *   "I have spent \$60k on a driveway."
      *   These two thoughts create dissonance. To resolve it without admitting error (which hurts the ego), the brain inflates the importance of the driveway. *It can't just be pavement; it must be a matter of Principle/Justice.* The more he spends, the more "Principled" the fight must become to justify the cost.

  ### 3. Why Does Walking Away Get Harder?
  You asked: *"Why does walking away seem to get harder the more has already been spent, when logically it should arguably get easier?"*

  Logically, you are right: The expected marginal cost of the next month of litigation should be weighed only against the expected marginal benefit. The past \$60k should be irrelevant.

  Psychologically, the **Threshold of Pain** moves.
  1.  **The "Just One More" Heuristic:** At \$10k spent, quitting feels like wasting \$10k. At \$60k, quitting feels like wasting \$60k. The pain of "wasting" the investment scales with the investment, making the exit barrier higher.
  2.  **Escalation Dynamics:** Because the neighbor is also escalating (Game Theory), the cost to win increases over time. If the neighbor spends \$5k more, your uncle feels he must spend \$5k more to maintain his position. The "price of admission" to the settlement table keeps rising.
  3.  **The Neighbor's Trap:** You asked if the neighbor is caught in the same trap. Almost certainly. This is a **Symmetric Escalation**. The neighbor is likely thinking, "I've spent \$30k, I can't let them win now." Both parties are holding the other hostage. This is why third-party mediation often fails unless one side is forced to capitulate (e.g., runs out of money).

  ### 4. How to Frame This for Your Seminar
  If you bring this up in class, you can elevate the discussion by distinguishing between **Rational Escalation** and **Irrational Escalation**.

  *   **Rational Escalation:** Spending more to signal resolve so the other party backs down early (Strategic Commitment).
  *   **Irrational Escalation:** Spending more because you cannot psychologically accept the past loss (Sunk Cost/Loss Aversion).

  **The Synthesis:**
  Your uncle likely started with *Rational Escalation* (signaling he won't be pushed around). But as costs mounted, *Loss Aversion* and *Negative Reciprocity* took over. The "Sunk Cost Fallacy" isn't just a math error; it's an emotional inability to close a "mental account" at a loss.

  **Discussion Question for Class:**
  *"In a War of Attrition where both parties exhibit Loss Aversion, does the 'rational' Nash Equilibrium change? If I know my opponent is irrational and willing to spend \$100k for a \$10k asset due to pride, is it rational for me to fold immediately, or is it rational to spend \$11k to call their bluff?"*

  (This touches on the **Gang of Four Model** in reputation games, where rational players mimic irrational players to gain advantage).

  ### Summary
  Your roommate isn't *wrong*, but she's shallow. It is the Sunk Cost Fallacy, but it is **supercharged by Game Theory dynamics and Prospect Theory.**

  *   **Game Theory:** War of Attrition + Dollar Auction.
  *   **Psychology:** Loss Aversion (fear of realizing the loss) + Negative Reciprocity (desire to punish).
  *   **Result:** The utility of "Winning" has detached from the asset value and attached to the recovery of emotional/financial investment.

  It's a perfect example of how "rational" strategic thinking can lock you into an "irrational" outcome when human psychology is added to the payoff matrix.
