answer: |-
  The vial sat on the desk between them, catching the sterile light of the recruitment office. Inside, the nanite suspension shimmered like trapped smoke. It was the key to the Aeon Mission, the one-way colonization vessel destined for the Proxima Centauri b system. But the key wasn't the ship; it was the injection. To survive the century-long transit awake, without crumbling under the weight of irreversible isolation, candidates had to undergo the Neural Dampening.

  Elara stared at the vial. Julian, the mission coordinator, tapped his pen against his clipboard.

  "Look at the numbers, Elara," Julian said, his voice reasonable, grounded. "We've run the simulations. There's an eighty-five percent chance the colony establishes sustainability within forty years. Your expertise in hydroponics increases that by another ten percent. You're looking at a high-probability success state for the species, plus guaranteed historical legacy. Even accounting for the loss of contact with Earth, the utility calculus is overwhelmingly positive."

  Elara nodded slowly. She understood the math. She could weigh the value of human survival against the cost of her own loneliness. That was ordinary uncertainty. She knew what loneliness felt like; she knew what legacy felt like. She could assign values to those outcomes and sum them up.

  "But that's not the variable we're discussing," Elara said softly.

  Julian sighed, leaning back. "The side effects. We've been over this. The Dampening reduces attachment anxiety. You won't miss us. You won't feel the ache of separation. It's a trade-off. You give up the pain of missing Earth to gain the stability needed to build the new one."

  "It's not a trade-off I can evaluate, Julian. That's the problem."

  "It's risk assessment," he insisted. "You weigh the cost of emotional blunting against the benefit of mission success. Everyone does it. Soldiers do it when they deploy. Parents do it when they move families abroad."

  "No," Elara said, turning her gaze back to the shimmering fluid. "When a soldier deploys, they know what fear feels like, and they know what courage feels like. They expect to come back to a self that recognizes those feelings. When I take this... I am not betting on an outcome. I am betting on a new self."

  She picked up the vial. It was cool to the touch.

  "Right now," she said, "I value connection. I value the sting of missing my sister. I value the way grief hollows me out when I think about never seeing this office again. Those values are part of who I am. The Dampening doesn't just remove the pain; it removes the capacity to value the connection that causes the pain. The person who arrives at Proxima won't care about Earth the way I do. She might not care about Earth at all."

  "So?" Julian shrugged. "She'll be happy. She'll be productive. Isn't that what matters?"

  "I can't know," Elara said. "That's the epistemic wall. I can read the reports. I can talk to the simulations. But I cannot know what it is *like* to be a person who does not mourn. I cannot simulate the phenomenology of a self that doesn't prioritize attachment. To know what it's like, I have to become her. But if I become her, I won't care whether the choice was worth making."

  Julian rubbed his temples. "You're looping. You're saying you can't choose because choosing changes the chooser."

  "I'm saying I can't use my current preferences to judge a future that invalidates them," Elara corrected. "Expected utility requires a stable agent. It requires that the 'I' who chooses is the same 'I' who experiences the outcome. If the experience remakes the 'I,' the calculation collapses. I'm trying to maximize utility for a stranger who will inhabit my body."

  "You're overthinking the philosophy," Julian said, though his voice lacked its earlier certainty. "You have the data. You know the mission parameters. You know the psychological profile of the post-Dampening state. It's just information gaps. Fill them with probability."

  "I can't fill them," Elara said. "Information tells me what happens. It doesn't tell me what it *is*. I can know every chemical detail of a strawberry, but I don't know the taste until I eat it. This is heavier than a taste. This is the structure of my soul. If I take this, I won't just be lonely less. I will be someone who doesn't need love. How can I, who need love, decide that becoming someone who doesn't need it is a good idea? And how can I decide it's a bad idea, if the person I become won't mind?"

  She looked at Julian. He was looking at her with the frustration of a man trying to solve an equation that kept changing its variables mid-sum.

  "You want me to treat this like buying a house," Elara said. "Where I might regret the commute, but I'll still be me. This isn't a commute. It's a death. The Elara who sits here now, who loves her sister and fears the silence... she ends when the needle goes in. The colonist begins. I am being asked to authorize my own replacement based on values I will no longer hold."

  "We need you, Elara," Julian said quietly. "The mission fails without the hydroponics lead."

  "I know."

  "Then look at the vial as a tool. Not a transformation."

  "It is the transformation," she said.

  Elara set the vial down. The silence in the room was heavy, not with the absence of sound, but with the presence of the impossible choice. She looked at her hands. They were the hands of a woman who loved, who grieved, who feared. Soon, they might be the hands of someone efficient, serene, and indifferent.

  She could not know if the serenity was worth the indifference. She could not know if the survival of the species mattered to the person who would no longer feel connected to the species. She stood at the edge of a cliff, asked to judge the view from the bottom without jumping.

  Julian waited. The pen hovered over the consent form. The vial waited. The future waited, opaque and unreachable.

  Elara picked up the pen.
