      *   **The Resolution:** The Section 5 prediction is the arbiter. It transforms the paper from "descriptive" to "predictive."
      *   **The Condition:** Authors must run the Section 5 experiment. If it holds, Accept. If not, the paper withdraws or becomes a negative result (which is also valuable).
      *   **Tone Check:** Ensure I'm not just saying "R1 is right." I need to say "R2 is right about the value of unification, but R1 is right about the verification needed to claim that value."

