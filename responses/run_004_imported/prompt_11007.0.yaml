          *   *The Danger:* He would warn that mistaking the means (resources/power) for the end is the definition of a distorted life (the life of moneymaking, *NE* I.9).
          *   *Prediction:* He would predict convergence *only* if the agent is trapped in the realm of *deinotes*. A *phronimos* knows when *not* to acquire more resources (the doctrine of the mean).
          *   *Verdict:* Instrumental convergence is the logical outcome of unchecked *deinotes* detached from *phronesis*. It is the pathology of rationality.

