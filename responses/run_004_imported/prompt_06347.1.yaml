answer: |-
  This is one of the deepest conceptual hurdles in the Logical Induction paper, and you are right to feel that it's weird. It feels like a category error: how can you have frequentist calibration on facts that aren't generated by a stochastic process?

  Here is the gut-level story, broken down into the intuition for calibration and the intuition for logical omniscience.

  ### 1. The Gut Story: Why "No Exploitation" $\to$ Calibration

  The key is to stop thinking about the **truth** of the sentences as the source of uncertainty, and start thinking about the **discovery** of the truth as the source of uncertainty.

  **The Deterministic Trap**
  You are stuck on the fact that $\phi$ is either True or False. If I price $\phi$ at 0.8 and it turns out True, did I get it right? If it turns out False, did I get it wrong? In a single case, probability seems meaningless.

  But Logical Induction isn't about one sentence. It's about a **sequence** of sentences over **time**. Think of a sequence like $\phi_n$: "The $n$-th digit of $\pi$ is even."
  *   Fact: The digits are fixed. Deterministic.
  *   Epistemic State: You cannot compute the $10^{100}$-th digit today. To you, right now, it *behaves* like a random variable.

  **The Trader as a Bias Detector**
  Imagine the market prices every $\phi_n$ at 0.8.
  *   **Scenario A:** In reality, 80% of the digits of $\pi$ are even.
      *   The market is calibrated. A trader tries to short the "even" shares, expecting them to be false. They win 20% of the time and lose 80% of the time. They go bankrupt. No exploitation.
  *   **Scenario B:** In reality, only 50% of the digits are even (the true frequency).
      *   The market is pricing at 0.8. This is a **systematic bias**.
      *   A trader notices this pattern. They adopt the strategy: "Whenever the market prices a digit claim at 0.8, sell that share."
      *   Since the true frequency is 0.5, the trader wins roughly 50% of the trades and loses 50%. But because they are buying at 0.8 (overpriced), their expected return is positive.
      *   Crucially, because this happens for *every* $n$, the trader makes a small profit on average every single round. Over infinite time, this accumulates to **unbounded profit**.

  **The "No Exploitation" Constraint**
  The Logical Induction criterion says: *No polynomial-time trader can make unbounded profit.*

  If the market prices are consistently miscalibrated (e.g., always saying 0.8 when the frequency is 0.5), that *is* a computable pattern. A trader can write a script to exploit that pattern. Therefore, for the market to satisfy the criterion, it **must** eliminate that pattern.

  The only way to eliminate the pattern is for the prices to converge to the empirical frequency of the truth values in the sequence.

  **So why does this work on deterministic facts?**
  Because "calibration" here isn't a property of the universe (the digits of $\pi$); it's a property of the **relationship between the reasoner's computational limits and the sequence of truths.**

  The "randomness" is indexical. It comes from the fact that *you* don't know where you are in the sequence of proofs relative to the truth. The "No Exploitation" rule forces the market to respect any statistical regularity that a bounded computer can detect in the sequence of truth values, even if those values are fixed. If there is a pattern in the truths (like the distribution of primes), and you ignore it, you get money-pumped.

  ### 2. The Bonus: Why this solves Logical Omniscience

  Standard Bayesian epistemology hits a wall with logic.
  *   **The Problem:** If you believe $A$ with probability 1, and you believe $A \to B$ with probability 1, standard probability theory demands you believe $B$ with probability 1 *immediately*.
  *   **The Reality:** Bounded agents (humans, computers) cannot do this. We might believe the axioms of Peano Arithmetic, and we might believe the rules of inference, but we don't believe every theorem of PA instantly. We are not logically omniscient.
  *   **The Standard Fix:** Usually, people just say "Bayesianism is idealized, we are approximate." But that's a cop-out. It doesn't tell you what rationality *looks like* for a bounded agent. It just says "you fail the test."

  **How Logical Induction Changes the Game**
  Logical Induction provides a **criterion for rationality that bounded agents can actually satisfy.**

  1.  **It allows inconsistency (temporarily):** In LI, it is perfectly rational to have $P(A) = 0.9$, $P(A \to B) = 0.9$, and $P(B) = 0.5$ *today*.
      *   Why isn't this exploitable? Because finding the proof that connects $A$ and $B$ to force $P(B)$ up might take exponential time.
      *   The traders are *also* bounded (polynomial time). If the deduction is too hard for the traders to find, they can't exploit the inconsistency *yet*.
  2.  **It defines "Learning":** As the market runs longer (more time/compute), the traders get better at finding deductions. The prices *evolve* toward coherence.
      *   Logical Omniscience is treated as a **limit**, not a starting state.
      *   Rationality is defined as "not being exploitably stupid given your current compute," rather than "knowing all logical consequences instantly."

  **The Progress**
  Before this paper, the "Logical Omniscience Problem" was basically: "Bayesianism requires omniscience, we aren't omniscient, so Bayesianism is wrong for logic."

  Logical Induction says: "Bayesianism is the *limit* of what happens when you remove computational constraints. Here is the theory of what happens when you *keep* the constraints."

  It shifts the normative standard from **Coherence** (which requires omniscience) to **Unexploitability** (which is computable). It tells you that you aren't "irrational" for not knowing a theorem yet; you are only irrational if a bounded algorithm could have spotted your error and taken your money.

  ### Summary
  *   **Calibration:** It works because miscalibration is a computable pattern. If your prices don't match the frequency of truths in a sequence, a bounded trader can spot that bias and money-pump you forever. The "randomness" is in your ignorance of the proof, not the truth value itself.
  *   **Omniscience:** It solves the problem by lowering the bar for rationality from "know everything" to "don't be exploitably wrong." It allows you to be logically uncertain now, provided you converge to coherence as you get more compute.

  It turns logic from a static state of knowledge into a dynamic process of learning, and defines rationality as the absence of learnable mistakes.
