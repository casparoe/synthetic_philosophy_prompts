      *   *Key Assumption:* Archimedean property of utility (no lexical priority). If $X$ is bad, $N \times X$ can exceed $Y$ for large enough $N$.
      *   *Vulnerability:* Lexical thresholds (some harms are *categorically* worse). Scope insensitivity (psychological inability to grasp the numbers).
      *   *Role of Chaining:* Minimal. It's a direct multiplication.

  3.  **Analyze Norcross's Argument ("Comparing Harms"):**
      *   *Structure:* Sorites-style continuum (chaining).
      *   *Goal:* Argue against lexical priority (specifically in the context of consequentialism and animal suffering vs. human gourmet tastes, though the "Headaches vs. Lives" paper focuses on the structural argument).
      *   *Mechanism:* Create a spectrum from "Death" to "Headache" via intermediate steps (e.g., Death -> 1 year pain -> 1 month pain -> ... -> Headache).
      *   *Premise:* For any adjacent pair in the spectrum, the worse harm is not *lexically* superior to the slightly lesser harm given enough numbers. Or, more precisely, there is no clear cutoff where lexical priority kicks in.
      *   *Transitivity:* Crucial. If $A > B$, $B > C$, ... $Y > Z$, then $A > Z$ (in terms of trade-offs).
      *   *Key Assumption:* No sharp discontinuities in value (continuity).
      *   *Vulnerability:* The Sorites Paradox. If you deny a sharp cutoff, you must accept the conclusion. If you accept a sharp cutoff, you must justify *where* it is.

