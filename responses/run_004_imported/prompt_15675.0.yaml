          *   *Personal:* The one who stays doesn't change. The one who goes might.
          *   *Verdict:* Complicates identity too much (Parfit territory).
      *   *Idea 6: "The Empathy Link" / Hive Mind Lite.* Connecting your nervous system to a specific, non-human entity or a large group, but retaining individual agency.
          *   *Epistemic:* Feeling what others feel.
          *   *Personal:* Does this change your values or just give you more data?
