answer: |-
  **The Interval**

  The thermometer read 98.4°F.

  Arthur stared at the digital display on the monitor, then at the probe taped to his wife's chest. In his old life, before the pension and the quiet house, he had calibrated mass spectrometers. He knew that if a gauge said a tank was pressurized, it was pressurized. If the temperature was ninety-eight degrees, the system was thermodynamically active.

  But the chart at the foot of the bed said *Time of Death: 04:12*.

  It was now 14:00. Elena had been dead for ten hours, yet her skin was the color of toasted almond, not the waxen grey of the morgue photos he'd seen at his mother's funeral. When he held her hand, it yielded. It was warm.

  "Arthur."

  Dr. Evans stood in the doorway. He was a good man, Arthur knew. He'd delivered their first daughter. But today, Evans spoke in a voice that sounded like it was reading from a script written by a lawyer.

  "We need to discuss the next steps," Evans said, stepping into the room. He didn't touch Elena. He stood near the ventilator, which breathed for her with a soft, rhythmic *hiss-click*. "The neurological criteria are met. There is no blood flow to the brain. She is gone."

  "The chart says she's dead," Arthur said. He didn't look up from the monitor. "But the oxygen saturation is ninety-nine percent. Her blood pressure is stable on the pressors. And..." He gestured to the ultrasound machine tucked in the corner. "The baby moved ten minutes ago."

  Evans sighed, a sound of professional fatigue. "This is somatic support. We are maintaining the body for the sake of the fetus. It doesn't mean she's alive. It means the cells are still perfused."

  "Cells don't organize themselves into a heartbeat," Arthur said. "Cells don't heal."

  He pulled back the sheet on Elena's arm. There was a bruise there, dark purple, from where the IV catheter had been inserted during the crash. Yesterday, it had been black and blue. Today, the edges were yellowing. The hemoglobin was breaking down, being cleared away by a liver that was supposedly part of a corpse.

  "Arthur," Evans said gently. "Death isn't a single moment anymore. It's a process. We draw the line where it makes sense legally."

  "That's the problem," Arthur muttered. "You're drawing a line on a gradient."

  He remembered the chemist in him screaming at the imprecision. In the lab, if your standard deviation was this wide, you threw out the assay. You didn't publish the data. But here, they were betting a soul on a margin of error.

  Evans shifted his weight. "If we turn off the ventilator, the heart will stop. Then we wait five minutes. If it doesn't auto-resuscitate, we declare circulatory death. That is the backup standard."

  "A bet," Arthur said. "You wait five minutes to bet that it won't start again. If it did start, would she be alive again? Or just a reanimated corpse?"

  "That's not... that's not how it works."

  "Isn't it?" Arthur finally looked at the doctor. "I read the papers. People declared like this, they grow fingernails. They fight infections. One woman carried a baby for months. If a body can gestate a life, how is it a coffin?"

  Evans looked at Elena. For a second, the script dropped. He looked at the rise and fall of her chest, driven by the machine, but synchronized with the subtle, autonomous micro-movements of her ribs.

  "It's about the person, Arthur," Evans said softly. "Elena isn't in there."

  "Where is 'there'?" Arthur asked. "Because right now, she's right here. She's warm."

  Evans didn't answer. He couldn't. There was no measurement for *there*.

  The doctor left, promising to return in the hour to discuss organ viability. The word hung in the sterile air. *Viability.* As if parts of her could be alive while the whole was dead.

  Arthur pulled his chair closer. He placed his hand on Elena's stomach. It was firm, distended. Twenty-four weeks.

  *Thump.*

  A kick. Strong. Defiant.

  Arthur closed his eyes. He thought about the circulatory definition Evans had mentioned. The five-minute wait. It was an arbitrary window, a social agreement masquerading as biology. A gamble that the sinoatrial node wouldn't fire on its own. If death was the cessation of function, the function was continuing. If death was the departure of the self, Arthur couldn't prove the self was gone, only that it couldn't speak.

  He leaned down and kissed Elena's cheek. It smelled of soap and the faint, metallic tang of the hospital, but underneath that, it smelled like *her*. Like vanilla and sleep. A corpse smells of nothing, or of decay. She smelled of life.

  "You hear that, El?" he whispered. "They say you're gone. But you're keeping him safe."

  The ventilator *hissed*. The monitor beeped. The yellow bruise on her arm continued to fade, her immune system scavenging the damaged cells, repairing the breach. A dead thing does not repair itself. A dead thing does not grow.

  Arthur sat in the silence between the beeps. He realized then that he wasn't waiting for her to die. She had already died, according to the paper in the plastic sleeve. But he also wasn't sitting with a body.

  He was sitting in the gap.

  It was a strange, quiet place, this interval between the law and the biology. It was where the definitions failed to cover the reality. It was where a husband had to hold the hand of a wife who was legally a memory but physically a presence.

  Arthur took a marker from the bedside table. He reached for the whiteboard where the nurses wrote the shift changes and vitals.

  Under *Status*, the night nurse had written *Deceased (Neuro)*.

  Arthur uncapped the marker. He didn't cross it out. He couldn't change the law. But underneath it, in small, precise letters, he wrote:

  *Temp: 98.4. Healing. Gestating.*

  He capped the marker and took her hand again. It squeezed back. Or maybe it was just the tone of the muscles, the residual tension of the tendons. He would never know for sure. There was no instrument sensitive enough to measure the difference.

  "Five minutes," Arthur said to the empty room, thinking of the circulatory wait time. "That's all it takes to change everything."

  The baby kicked again, a ripple under his palm.

  "Not today," Arthur said.

  He sat in the warm light of the ICU, watching the numbers on the screen, living in the space where the measurement didn't match the label, waiting for a truth that medicine couldn't give him.
