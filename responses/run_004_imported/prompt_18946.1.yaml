answer: |-
  # The Calculus of Consensus: Adjudicating Harsanyi's Aggregation Theorem

  The dispute between you and your friend touches upon one of the most contentious fault lines in modern moral philosophy and welfare economics. At stake is whether a formal mathematical result can bridge the is-ought gap to deliver a substantive moral theory. Your friend argues that John Harsanyi's Aggregation Theorem provides a near-deductive proof of utilitarianism. You counter, invoking Amartya Sen, that the theorem leaves the moral heavy lifting—interpersonal comparability and weighting—entirely undone.

  To adjudicate this, we must distinguish between the *structural* implications of the theorem and its *normative* force. The verdict is this: Your friend is correct that the theorem establishes utilitarianism as the unique *structural* solution to social aggregation under specific rationality constraints. However, you are correct that these constraints beg the central moral questions. Consequently, the theorem does not prove utilitarianism; rather, it demonstrates that utilitarianism is the price of admission for treating society as a rational expected-utility maximizer. It is a powerful consistency check, but a poor moral foundation.

  ### The Theorem Precisely Stated

  To evaluate the claims, we must first define the terrain. Harsanyi's Aggregation Theorem (1955) operates within the framework of expected utility theory. It posits a society of $n$ individuals. Let each individual $i$ have preferences over risky prospects (lotteries) that satisfy the von Neumann–Morgenstern (VNM) axioms: completeness, transitivity, continuity, and independence. These preferences are represented by utility functions $U_i$, unique up to positive affine transformations (scaling and shifting).

  The theorem introduces a Social Welfare Function (SWF) representing society's ranking of these prospects. Harsanyi imposes two conditions on this social ranking:
  1.  **VNM Rationality:** The social preference ordering must also satisfy the VNM axioms.
  2.  **The Pareto Principle:** If every individual prefers prospect $A$ to prospect $B$, society must prefer $A$ to $B$. (Harsanyi typically uses the Strong Pareto principle: if everyone prefers $A$ to $B$, and at least one person strictly prefers $A$, society strictly prefers $A$).

  The mathematical conclusion is rigorous: If these conditions hold, the social utility function $W$ must be a linear combination of the individual utility functions. That is:
  $$W = \sum_{i=1}^{n} a_i U_i + b$$
  where $a_i \geq 0$ are weights and $b$ is a constant.

  ### The Friend's Case: The Inevitability of the Sum

  Your friend's enthusiasm is well-placed regarding the *negative* power of the theorem. Harsanyi's result is devastating for non-consequentialist or non-welfarist theories that wish to claim the mantle of rationality.

  If one accepts that individuals are rational in the VNM sense (a standard assumption in decision theory) and that social policy should not make everyone worse off (the Pareto principle is difficult to reject outright), then any social ordering that *cannot* be represented as a weighted sum of utilities is mathematically ruled out. This excludes lexicographic orderings, rigid rights-based constraints that violate Pareto, and prioritarian views that violate the Independence Axiom (e.g., giving extra weight to the worse off regardless of total utility).

  Your friend argues this "all but proves" utilitarianism because it derives the utilitarian *form* from axioms that appear neutral and procedural. It suggests that utilitarianism is not a metaphysical commitment to "the greatest good," but simply what happens when you aggregate rational preferences consistently. If you want a social ordering that respects individual risk attitudes and unanimous agreement, you *must* sum utilities. In this light, the theorem transforms utilitarianism from a controversial moral doctrine into a theorem of rational choice.

  ### Your Case: The Measurement and Weighting Gap

  Your objection, rooted in Sen's critique, targets the *substance* hidden within the formalism. There are two distinct problems here: the problem of weights and the problem of measurement.

  First, the **problem of weights**. The theorem concludes that $W = \sum a_i U_i$. It does not conclude that $a_i = a_j$. The weights $a_i$ are non-negative, but otherwise arbitrary. A social planner could assign a weight of 1,000,000 to a dictator and 0.0001 to everyone else, and the theorem would still hold provided the Pareto principle is respected (which it would be, as long as the dictator's preferences aren't violated when everyone else is). Classical utilitarianism requires equal consideration ($a_i = a_j$), but Harsanyi's Aggregation Theorem provides no justification for equality. It validates *weighted* utilitarianism, which is compatible with stark hierarchy.

  Second, and more technically fatal, is the **problem of measurement (interpersonal comparability)**. VNM utility functions are unique only up to positive affine transformations ($U' = \alpha U + \beta$, where $\alpha > 0$). This means an individual's utility scale has no fixed zero point and no fixed unit. For Individual 1, the difference between life and death might be 10 utils; for Individual 2, it might be 1,000 utils.

  To sum $U_1 + U_2$, we must know the ratio of their units. If we cannot compare the "size" of a util across persons, the sum is mathematically meaningless. The theorem *assumes* we have a set of $U_i$ functions that can be summed, but VNM theory alone does not provide the calibration to make them commensurable. As Sen argues, without a mechanism to fix the scales across persons (interpersonal comparison of utility levels or units), the aggregation is a "category mistake." You are adding apples to oranges and calling it fruit salad. The theorem presupposes the very commensurability that utilitarianism is accused of lacking.

  ### Adjudication and Verdict

  Who is right? The answer depends on whether we view the theorem as a moral argument or a consistency constraint.

  Your friend is right that the theorem imposes a severe **structural constraint**. If one accepts the VNM axioms for society, utilitarianism is the only game in town. This is a significant result because it forces critics of utilitarianism to attack the VNM axioms (specifically Independence) or the Pareto principle. For example, if you believe society should care about the *distribution* of utility ex-post (equality of outcome) rather than just the expected sum, you must violate the Independence Axiom. The theorem successfully corners non-utilitarians: you cannot be a welfarist, a rationalist (in the VNM sense), and a non-utilitarian simultaneously.

  However, you are right that this structural constraint lacks **moral content**. The theorem is conditional: *If* social preferences satisfy VNM, *then* they are utilitarian. But why should social preferences satisfy VNM? The VNM axioms are justified for individuals facing risk because they prevent self-defeating behavior (e.g., money pumps). It is far less clear why a *society* should be treated as a single rational agent facing risk. To assume society satisfies the Independence Axiom is arguably to assume the conclusion—that society cares only about expected welfare sums—right from the start.

  Furthermore, your point on comparability is decisive regarding the "proof" of utilitarianism. A utilitarianism that cannot specify how to weigh or scale different people's utilities is not a moral theory; it is an empty formula. The Aggregation Theorem does not solve the scaling problem; it merely pushes it into the coefficients $a_i$. Without an independent argument for interpersonal comparability (such as Harsanyi's separate "Veil of Ignorance" argument, which is distinct from the Aggregation Theorem), the theorem cannot distinguish between classical utilitarianism and a rigid caste system.

  **The Verdict**

  The dispute is resolved by recognizing that the theorem proves a *conditional necessity*, not a *moral truth*.

  Your friend claims the theorem proves utilitarianism. This is **false**. The theorem proves that *if* we treat society as a VNM-rational agent and *if* we accept the Pareto principle, *then* social welfare must take a utilitarian form. It does not justify the antecedents, nor does it fix the weights or scales required to make that form morally actionable.

  You claim the theorem leaves the weights and units arbitrary. This is **true**, but it understates the theorem's value. The theorem shows that any alternative to utilitarianism requires rejecting either Pareto or VNM-rationality for society. This is a heavy burden for the non-utilitarian.

  Therefore, the final judgment is in your favor, but with a concession to your friend. Harsanyi's Aggregation Theorem does not give us good reason to accept utilitarianism as a *complete moral system* because it fails to address interpersonal comparability and equal weighting. However, it does give us good reason to accept that **welfarist aggregation is structurally utilitarian.**

  If your friend argues that the theorem forces any *rational welfarist* to be a utilitarian, she is correct. If she argues it forces any *rational person* to be a utilitarian, she is wrong. The theorem does not bridge the gap between individual rationality and social ethics; it merely shows that if you build a bridge using specific materials (VNM axioms), it must have a specific shape (utilitarianism). Since the choice of materials is itself a moral question, the theorem cannot bear the full philosophical weight your friend assigns it. You win the argument on the merits of moral proof, but your friend wins on the merits of formal constraint.
