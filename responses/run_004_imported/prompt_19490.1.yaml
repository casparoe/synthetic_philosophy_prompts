          *   *Candidate:* **Aumann-Hart-Perry (Equilibrium of Selves).** This formalizes the "multi-selves" idea into a proper game-theoretic equilibrium. It doesn't just say "there are multiple selves," it defines the equilibrium condition that recovers the 1/3 result.
      *   **A Tier (Strong):** Good explanations, but maybe rely on specific philosophical commitments.
          *   *Candidate:* **Planning Self Dominance (Piccione & Rubinstein).** This is the original proposal. It says "commit to the plan." It resolves the practical issue but leaves the philosophical tension of "why shouldn't I deviate now?" somewhat open. It acknowledges time inconsistency rather than solving the belief update paradox.
