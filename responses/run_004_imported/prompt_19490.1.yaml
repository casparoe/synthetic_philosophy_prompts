  2.  **Recall/Research the Absent-Minded Driver Problem:**
      *   **Setup:** Driver needs to exit at the 2nd intersection. Payoffs: Exit 1 (0), Exit 2 (4), Continue past 2 (1). (Standard payoffs vary, but the logic holds).
      *   **Planning Stage:** Before starting, the driver chooses a probability $p$ of exiting at any intersection. Expected payoff $U(p) = p(0) + (1-p)p(4) + (1-p)(1-p)(1)$. Maximizing this yields $p = 1/3$.
      *   **Action Stage:** At an intersection, the driver wonders "Where am I?". Belief $\alpha$ = prob being at 1st intersection. Consistency requires $\alpha = 1 / (1 + (1-p))$. If $\alpha = 1/2$ (intuition), then $p$ changes. This creates time inconsistency.
      *   **The Paradox:** The optimal plan at the start ($p=1/3$) is not optimal at the intersection if you update beliefs based on being there (unless you restrict belief updating).
      *   **Key Resolutions/Approaches:**
          1.  **Planning Self Dominance (Piccione & Rubinstein):** Stick to the planning optimal. Accept time inconsistency.
          2.  **Aumann, Hart, Perry (AHP) / Modified Multi-Selves:** Treat each intersection as a distinct agent playing a game. Equilibrium concept.
          3.  **Causal Decision Theory (CDT) vs. Evidential Decision Theory (EDT):** EDT leads to the 1/3 solution via conditioning on the action. CDT struggles with the belief update.
          4.  **Halfer vs. Thirder (Sleeping Beauty):** Analogous to credence updating.
          5.  **Dissolution (No Paradox):** It's just a constraint on information sets. The "probability of being here" is ill-defined without a strategy.
          6.  **Briggs / Ratificationism:** Actions must be ratifiable.

