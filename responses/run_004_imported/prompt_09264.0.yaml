          *   Goal: Show $E$ was *expected* (nomic expectability).
          *   Problem for History: Historians rarely state universal laws of human behavior. Hempel calls these "explanation sketches" (placeholders for laws).
          *   Implication for 1914: To explain the war, one needs laws like "Alliances involving mobilization timetables under diplomatic pressure lead to war."
      *   **Danto (Narrativist Model):**
          *   Explanation = Storytelling/Narrative.
          *   Key Concept: The "Narrative Sentence" (describing an earlier event in terms of a later one, e.g., "The archduke visited Sarajevo, initiating the Great War").
          *   Goal: Make the event *intelligible* within a temporal structure, not necessarily predictable.
          *   Implication for 1914: The war is explained by tracing the sequence of decisions, misunderstandings, and temporal pressures, rendering the outcome coherent in retrospect without needing universal laws.

  3.  **Analyze the Case Study: Christopher Clark's *The Sleepwalkers*:**
      *   **Thesis:** No single culprit; a systemic failure; "sleepwalkers" watching each other, aware but unseeing; contingency; complex interlocking mechanisms (mobilization schedules, alliance rigidity, domestic politics).
