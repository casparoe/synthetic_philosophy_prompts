      *   *Fact:* For any given position, there is a theoretical game-theoretic value (Win, Loss, or Draw) assuming perfect play from both sides.
      *   *Conclusion:* The probability of White winning is either 0 or 1. We just don't know which. Therefore, a probabilistic bet is epistemologically shaky.
