answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I have the distinct privilege of standing here today.

  I want to start by acknowledging a debate I had two weeks ago with my friend Daniel, who is sitting three tables back. Daniel, if you're listening, I'm going to concede the point.

  We were arguing about David Lewis's account of convention. Daniel's position was that almost everything we are doing right now—the order in which the groomsmen walked down the aisle, the fact that we stand when a toast is proposed, even the specific words of the vows—are what Lewis calls "coordination equilibria." They are regularities that persist only because we all conform to them, and we all expect everyone else to conform to them. They are arbitrary. We could have walked in reverse order. We could have exchanged toasters instead of rings. As long as we all expected it, it would have worked just as well.

  Daniel didn't stop at the ceremony. He argued that the private rituals between a couple—the specific joke that ends a fight, the code phrase used at airport security, the way one person always hands the other the coffee mug—are the same thing. Arbitrary solutions to coordination problems that got calcified over time.

  For a while, this bothered me. Because if Daniel is right, if these rituals are arbitrary, does that make them less real? If the [Groom] could have just as easily developed a different inside joke with someone else, does that diminish what he has with [Bride]?

  But then I realized that Daniel was describing the *origin* of a convention, but he wasn't describing the *history* of a commitment.

  Yes, the choice of convention is arbitrary. But the *maintenance* of that convention is not.

  In decision theory, a coordination equilibrium is stable. But in a marriage, it is actively sustained. When [Bride] and [Groom] established their private rituals, they were solving a coordination problem. But every day since then, they have chosen to solve it the same way.

  And this is where Lewis's picture needs a slight amendment for the context of love. A coordination convention, kept up long enough, stops being merely convenient and starts carrying normative weight. It transforms from "this is what we do" into "this is who we are."

  If [Groom] were to walk out on stage today wearing a clown suit, it would be a deviation. If he were to stop saying the thing he always says at airport security, it wouldn't just be a change of habit. It would feel like a betrayal. Why? Because the arbitrary signal has become the vessel for trust. The value isn't in the specific signal; the value is in the reliability of the sender.

  [Bride], you know better than anyone in this room that rational agents can coordinate on many different equilibria. But you also know that the cost of switching equilibria is often higher than the cost of staying put. Not because the new way is worse, but because the old way is *yours*.

  The fact that your relationship is built on arbitrary conventions doesn't make it fragile. It makes it resilient. It means you have built a language that only the two of you speak fluently. It means you have taken the chaos of possible worlds and selected one, together, and decided to inhabit it.

  Daniel, you were right that there was nothing inherently sacred about the specific path you took. But you were wrong to think that makes the walking of it any less holy. The sacredness isn't in the coordinates; it's in the journey.

  So, to the rest of the room: when you raise your glass in a moment, know that the act of standing is arbitrary. We could sit. But we stand because we share an expectation. We stand because we agree, collectively, that this moment matters.

  And to [Bride] and [Groom]: May your coordination equilibria always be stable. May your arbitrary rituals become your deepest truths. And may you never find a better solution to the problem of how to be together than the one you have already found.

  Please join me in raising a glass.

  To [Bride] and [Groom].
