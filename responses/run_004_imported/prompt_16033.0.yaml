          *   If the drop is due to *bias/noise* (Wednesday-me is tired/jaded/losing confidence), Reflection *does not* hold. Monday-me should not defer to a known biased future self.
      *   *The "Forgotten Evidence" Problem:* If Wednesday-me forgets why they were optimistic, Reflection fails.
