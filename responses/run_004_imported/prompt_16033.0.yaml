      *   **The "Known Bias" Exception:** If you know your future self will be biased (e.g., "Wednesday-me is always grumpy"), you must correct for that *now*. You don't adopt the 40%; you adopt the 40% *minus the grumpiness factor*.
      *   **Self-Trust:** Reflection is fundamentally about trusting your future rationality. If that trust is broken (by fatigue, bias, forgetting), the principle doesn't apply.

