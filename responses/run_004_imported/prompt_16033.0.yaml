      *   *Refinement:* The user says "Wednesday-me is always going to be way more pessimistic." If this is a *known fact* to Monday-me, Reflection Principle screams that Monday-me is irrational. UNLESS Monday-me believes Wednesday-me is compromised (tired/jaded).
