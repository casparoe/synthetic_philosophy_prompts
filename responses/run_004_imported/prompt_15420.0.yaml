answer: |-
  Thank you all for being here. For those of you who don't know me, I am [Mother's Name]'s child. I am also a science writer, which is why I was asked to speak today. I suspect the department chair also calculated that I was the only person in the family less likely to accidentally misstate an eigenvalue in front of this audience. I have done my best to ensure the physics is sound, though I know that for half the people in this room, the temptation to correct my phrasing is physical. I promise I sent this draft to three of her former students, and they were only allowed to change the footnotes.

  But before she was a physicist, and before she was a subject of my profiles, she was my mother. And while she spent forty years studying the statistics of energy levels, what she really studied was rigor. She taught me that precision is not just a technical requirement; it is a form of respect. To say what you mean, and not a syllable more, was her highest ethic.

  Many of you know the story she loved to tell at dinner parties. It was her favorite fact in all of mathematics: that the spacing between the zeros of the Riemann zeta function—abstract numbers governing the primes—matches the spacing between energy levels in heavy atomic nuclei. Two worlds that should not know each other, speaking the same statistical language.

  To some, this is a miracle. To others, it is merely "universality," a tidy statistical bucket where unrelated systems happen to fall. My mother had little patience for either extreme. She would gently but firmly correct anyone who called it evidence of a pre-existing cosmic order. She was not a Platonist. But she was equally dismissive of those who waved it away as trivial. She argued that saying "it's just universality" only moves the question up one level. Why are nature and the primes so stingy with their mathematics? Why do they share the same limited vocabulary?

  She often reminded me that "unreasonable" was Wigner's word, not hers. And that he had meant it as a worry, not a compliment. She believed the connection wasn't a proof of divine architecture, but a demand for attention. It was a signal that we are not yet asking the right questions.

  This stance led to a friendly, thirty-year debate with Warren, who is sitting in the front row. Warren, you know better than anyone that she never quite forgave you for citing her results as evidence for mathematical realism. But she also never forgave you for missing a dinner, or for drinking the wrong wine. You were her closest friend since graduate school. You disagreed on what the math meant, but never on how seriously it must be taken. I know you are smiling, Warren. You know that if I have characterized her skepticism too softly, you have standing instructions to correct me. But please, save it for the reception. She would want us to get to the wine.

  For the family and friends here who never quite understood what she did for a living: she didn't just solve equations. She listened to them. She treated the universe as a puzzle that deserved to be solved without cheating. She brought that same fierce curiosity to everything else. To gardening, to politics, to raising me. She wanted to know how things fit together, not so she could feel superior, but because she believed the world was worth understanding exactly as it is.

  She was not always easy. She demanded clarity. She would stop a conversation to define a term. But in a world that is increasingly comfortable with vagueness, her refusal to fudge the details was a kind of kindness. She showed us that if you are careful enough, if you are honest enough about what you know and what you don't, the world will reveal itself.

  We miss her. We miss her laugh, which was surprisingly loud for someone so precise. We miss her at the head of the table, waiting for someone to bring up the zeta function so she could tell us why we were all wrong about what it meant.

  She leaves behind a body of work that will outlast us. But she also leaves behind a standard. Do not reach for the mystical explanation just because it comforts you. Do not reach for the dismissive one just because it closes the file. Stay with the worry. Stay with the question.

  Thank you.
