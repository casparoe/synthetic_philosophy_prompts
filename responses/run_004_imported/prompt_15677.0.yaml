answer: |-
  You and your friend have independently rediscovered one of the most famous and vexing problems in the foundations of probability theory. You are not missing a trick; you have bumped up against the **Paradox of the Principle of Indifference**.

  The short answer to your first question is: **Yes, the question is strictly underdetermined.** There is no mathematical fact of the matter about the probability without adding assumptions that are not present in the problem statement.

  The short answer to your second question is: **This implies that the habit of assigning equal probabilities under ignorance is logically flawed when applied to continuous variables.** It is not a neutral default; it is a substantive modeling choice.

  Here is a detailed breakdown of why this happens, why "rescuing" the principle is difficult, and what this implies for reasoning under uncertainty.

  ### 1. The Mathematical Conflict
  Your intuition and your friend's intuition are both mathematically consistent within their own frameworks, but they are mutually exclusive.

  *   **Your Framework (Uniform Length):** If the edge length $L$ is uniformly distributed on $[20, 50]$, the probability density function (PDF) is $f_L(l) = \frac{1}{30}$. The probability that $L < 35$ is exactly $0.5$.
  *   **Your Friend's Framework (Uniform Volume):** Volume $V = L^3$. If $V$ is uniformly distributed on $[20^3, 50^3]$, then $L = V^{1/3}$. By the change-of-variables formula, the PDF for length becomes $f_L(l) \propto l^2$. This distribution heavily weights larger lengths. Under this assumption, the probability that $L < 35$ is roughly $0.23$, not $0.5$.
  *   **The Third Option (Uniform Surface Area):** Surface Area $A = 6L^2$. If $A$ is uniform, $f_L(l) \propto l$. This yields a probability roughly $0.35$.

  Since length, volume, and surface area are in a one-to-one relationship, a state of "maximum ignorance" about the physical object should theoretically yield the same probability regardless of which variable we use to describe it. The fact that it doesn't proves that **"maximum ignorance" cannot be represented by a uniform distribution on continuous variables.**

  ### 2. Why the Principle of Indifference Fails Here
  The Principle of Indifference (PoI) states that if you have a set of mutually exclusive possibilities and no reason to favor one over the other, you should assign them equal probability.

  This works beautifully for **discrete** cases (e.g., a coin has two sides, so 50/50; a die has six faces, so 1/6). In discrete cases, the "labeling" of the outcomes is usually symmetrical.

  However, in **continuous** cases, the PoI is not invariant under reparameterization. A uniform distribution is not a "shapeless" state of ignorance; it is a specific shape that privileges the linear scale of the variable you chose. By choosing length, you implicitly assumed that the manufacturing or ordering process is linear. By choosing volume, you assumed it is cubic.

  As the economist John Maynard Keynes pointed out in his *Treatise on Probability* (1921), the PoI leads to contradictions whenever the possibilities can be described in multiple continuous ways. There is no "view from nowhere" that allows you to distribute probability evenly without choosing a specific metric first.

  ### 3. Can It Be Rescued? (The Search for Invariance)
  Mathematicians and philosophers have tried to fix this. The most famous attempt comes from the physicist E.T. Jaynes, who argued that we should look for **transformation groups** that leave the problem invariant.

  *   **Scale Invariance:** If the problem didn't have fixed bounds (20 to 50) but was about the *ratio* of sizes, we might argue for scale invariance. This leads to the **Jeffreys Prior**, which suggests a probability density proportional to $1/L$ (log-uniform). This gives yet *another* answer (roughly 0.41).
  *   **Translation Invariance:** If the problem were about a location on a ruler rather than a size, uniform distribution is invariant under translation.

  However, in your specific puzzle, the bounds (20 and 50) break scale invariance, and the physical nature of the object breaks translation invariance. There is no symmetry group that clearly privileges length over volume without knowing **how the order is generated.**

  ### 4. The Implication: Probability Requires a Generative Model
  This is the most critical takeaway. Probability is not merely a measure of human ignorance; it is a description of a **process**.

  When you ask, "What is the probability?", you are implicitly asking, "If we ran the process that generates this order many times, what frequency would we observe?"

  *   **If the customer orders based on shelf space:** They care about dimensions. Length (or footprint) is the natural variable. A uniform distribution on length might be appropriate.
  *   **If the customer orders based on plant size:** They care about soil capacity. Volume is the natural variable. A uniform distribution on volume might be appropriate.
  *   **If the manufacturer sets prices based on material cost:** They care about surface area.

  Without knowing the *mechanism* that selects the number, there is no fact of the matter. The "ignorance" is not in the math; it is in the physical description of the scenario.

  ### 5. What This Means for Reasoning Under Uncertainty
  You asked if the habit of assigning equal probabilities is rescuable. The answer is: **It must be restricted.**

  1.  **Discrete Symmetries Only:** The Principle of Indifference is safe only when there is a genuine physical or logical symmetry (e.g., the faces of a die, the seats at a round table).
  2.  **Continuous Variables Require Priors:** When dealing with continuous quantities, you cannot simply say "I don't know, so it's uniform." You must state, "I don't know, so I will use a **reference prior**."
      *   In professional statistics, we often use **Jeffreys Priors** or **Maximum Entropy Priors** to minimize the amount of information we are assuming. But even these are not "neutral"; they are chosen because they have mathematical properties (like invariance) that make them useful, not because they represent "truth."
  3.  **Sensitivity Analysis:** The correct response to this puzzle isn't to pick one answer, but to report the range. "Depending on whether the selection process is driven by linear dimensions, area, or volume, the probability lies between 0.23 and 0.50." This acknowledges the underdetermination rather than hiding it.

  ### Conclusion
  Your friend was right to push back, and you were right to feel that the "obvious" answer was unstable. The puzzle has no unique solution because **probability is not a property of the state of knowledge alone; it is a property of the model connecting that knowledge to the world.**

  To assign a probability is to make a claim about how the world works. When you assumed the edge length was uniform, you weren't just expressing ignorance; you were making a hidden assumption that the "ordering mechanism" operates linearly on length. Since the problem statement explicitly forbids you from knowing the mechanism, it forbids you from calculating a unique probability.

  The lesson isn't that probability is broken, but that **"I have no information" is not a valid input for a probability calculation.** You always need at least one piece of structural information: *How is this number produced?* Without that, any number you produce is just a reflection of your own arbitrary choice of variables.
