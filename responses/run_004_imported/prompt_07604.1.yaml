      *   *Okay, let's write.*

      *(Self-Correction during drafting the "Fair Hearing"):* I need to make sure the argument for Bottom-Line is *strong*. It's not just "it's the rules." It's that tenure is a gestalt judgment. A candidate might be "excellent" in research but "toxic" in teaching, or vice versa, and the binary criteria don't capture the nuance. The Bottom-Line vote allows members to weigh the *combination* of traits.

