prompt: |-
  I've been working through Henry Sidgwick's *Methods of Ethics* for a graduate seminar on theories of well-being, and I keep returning to a passage in Book I where he tries to define a person's "good on the whole" in terms of idealized desire. It struck me that this is essentially a Victorian ancestor of the "idealized preference" or "ideal advisor" accounts that turn up later in Rawls, Brandt, and Railton, and, further downstream, of the informal idealization at the heart of Yudkowsky's proposal for "coherent extrapolated volition" in AI alignment, on which an AI is supposed to target not people's actual, present, possibly confused wishes but something like what they would want if they knew more, had more time to think it through, and had in some sense become the people they wished they were. I'd like help working through exactly what Sidgwick's definition says, because I think its internal moving parts bear directly on that later idea, and I can't quite tell whether they support it or undercut it.

  Here is the passage in full (*The Methods of Ethics*, Book I, Chapter IX, §3, "Good"):

  "For it is not even sufficient to say that my Good on the whole is what I should actually desire and seek if all the consequences of seeking it could be foreknown and adequately realised by me in imagination at the time of making my choice. No doubt an equal regard for all the moments of our conscious experience — so far, at least, as the mere difference of their position in time is concerned — is an essential characteristic of rational conduct. But the mere fact that a man does not afterwards feel for the consequences of an action aversion strong enough to cause him to regret it cannot be accepted as a complete proof that he has acted for his 'good on the whole.' Indeed, we commonly reckon it among the worst consequences of some kinds of conduct that they alter men's tendencies to desire, and make them desire their lesser good more than their greater: and we think it all the worse for a man — even in this world — if he is never roused out of such a condition, and lives till death the life of a contented pig, when he might have been something better. To avoid this objection, it would have to be said that a man's future good on the whole is what he would now desire and seek on the whole if all the consequences of all the different lines of conduct open to him were accurately foreseen and adequately realised in imagination at the present point of time.

  "This hypothetical composition of impulsive forces involves so elaborate and complex a conception that it is somewhat paradoxical to say that this is what we commonly mean when we talk of a man's 'good on the whole.' Still, I cannot deny that this hypothetical object of a resultant desire supplies an intelligible and admissible interpretation of the terms 'good' (substantive) and 'desirable,' as giving philosophical precision to the vaguer meaning with which they are used in ordinary discourse. ... The notion of 'Good' thus attained has an ideal element: it is something that is not always actually desired and aimed at by human beings; but the ideal element is entirely interpretable in terms of fact, actual or hypothetical, and does not introduce any judgment of value fundamentally distinct from judgments relating to existence — still less any 'dictate of Reason.'

  "It seems to me, however, more in accordance with common sense to recognise — as Butler does — that the calm desire for my 'good on the whole' is authoritative, and therefore carries with it implicitly a rational dictate to aim at this end, if in any case a conflicting desire urges the will in an opposite direction. Still, we may keep the notion of 'dictate' or 'imperative' merely implicit and latent — as it seems to be in ordinary judgments as to 'my good' and its opposite — by interpreting 'ultimate good on the whole for me' to mean what I should practically desire if my desires were in harmony with reason, assuming my own existence alone to be considered."

  Three things about this are giving me trouble. First, Sidgwick rejects his initial formulation — desire that has foreseen and imaginatively "realised" the consequences of a choice "at the time of making my choice" — by way of the contented-pig remark, which talks about a man's actual feelings after the fact; but the formulation being rejected was explicitly hypothetical and prospective, not a claim about actual retrospective satisfaction. I'm not sure exactly how the objection connects to the formulation it's supposed to be refuting, and, relatedly, what real work is being done by the switch to "now," "on the whole," and "all the different lines of conduct" in the revised version. Second, having built this idealized-desire notion as, in his own words, "entirely interpretable in terms of fact" and free of any independent "dictate of Reason," Sidgwick almost immediately reaches for Butler's idea that this desire is "authoritative" and asks us to understand a person's good in terms of desire that is "in harmony with reason." That looks like a substantive addition rather than a further refinement of the same hypothetical-desire story. Am I right that something has genuinely changed between the two characterizations, and if so, is the passage entitled to appeal to "reason" here without circularity, given that it never independently tells us what makes a desire rational apart from its being directed at the good? Third, and this is what I'm most interested in: does an idealization procedure like CEV's face the same fork Sidgwick seems to face here? If "what you would want if you knew more and thought faster" is meant purely as a naturalistic, psychological extrapolation, it seems to inherit the contented-pig worry, since the extrapolation process could presumably entrench or corrupt someone's desires rather than correct them, with nothing internal to the procedure to tell the two apart; but if it instead builds in some substantive standard of rational or convergent desire to rule that out, it seems to inherit something like the circularity worry instead. I'd be glad to hear whether you think there is a principled way for this sort of idealization to do its intended work without falling on either horn, and whether Sidgwick's own text offers any hints toward escaping it that a modern reader might easily miss.
