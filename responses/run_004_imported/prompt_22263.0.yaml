answer: |-
  This is a remarkably sharp reading of Sidgwick. You have correctly identified that *The Methods of Ethics* contains the ur-text for idealized preference theories, and your intuition that the structural problems Sidgwick encounters here map directly onto the difficulties in AI alignment (specifically CEV) is philosophically fertile ground. Sidgwick is struggling with the Is/Ought gap in the context of prudential rationality, and that struggle is exactly the one Yudkowsky faces when trying to derive "what we wish we wanted" from "what we want."

  Here is a breakdown of the three troubles you raise, working through the text and then applying it to the alignment problem.

  ### 1. The Contented Pig and the Shift to "Now"

  You are right to be puzzled by the objection. The first formulation is:
  > *My Good = What I should actually desire... if all consequences... foreknown and adequately realised... at the time of making my choice.*

  Sidgwick rejects this using the "contented pig" argument: a man might choose a path that degrades his capacities, and once degraded, he feels no regret. Since he feels no regret, the first formulation (which relies on the agent's informed desire) might validate the choice. But Sidgwick insists this is not his "Good on the whole."

  **The Problem:** The first formulation allows the *standard of evaluation* to shift along with the agent. If I choose to become a pig, and I successfully become a pig, my "informed desire at the time of choice" might have been predicated on a misunderstanding of what it is to be a pig, OR, more likely, Sidgwick is pointing out that the *satisfaction* of the desire is contingent on the *quality of the desirer*. If the choice destroys the very faculties required to make a rational assessment of "Good," the fact that the resulting pig is content is irrelevant.

  **The Revision:**
  > *My Good = What he would **now** desire... if all consequences of **all the different lines of conduct**... accurately foreseen... at the **present point of time**.*

  Three things are doing work here to block the Pig objection:

  1.  **"Now" / "Present point of time":** This locks the *evaluator* in place. It prevents the "adaptive preference" problem. We are not asking what the future (degraded) self would endorse; we are asking what the *current*, fully capacitated self would endorse *for* the future self. The "present point of time" acts as a fixed Archimedean point. It ensures that the evaluation is made by an agent who still possesses the capacity to distinguish "higher" and "lower" goods.
  2.  **"On the whole":** This introduces **temporal neutrality**. The first formulation focuses on the "time of making my choice" (a local optimization). The revision requires a synoptic view of the entire life. A choice might maximize desire-satisfaction at $t_1$ but reduce the capacity for satisfaction at $t_2$ through $t_{10}$. "On the whole" forces the integration of these temporal slices.
  3.  **"All the different lines of conduct":** This introduces **global coherence**. The first formulation might compare "Action A vs. Status Quo." The revision requires comparing "Action A vs. B vs. C..." This prevents local maxima. The contented pig might prefer "Pig-life vs. Current Struggle," but if there was a third option "Enhanced Human Life" that was foreseen, the "present" self would choose that.

  **Verdict:** The revision saves the theory from the "degradation of the desirer" objection by fixing the locus of idealization to the *current rational agency* rather than allowing the idealization to include *becoming a different kind of agent*.

  ### 2. The Shift from "Fact" to "Reason"

  You ask if Sidgwick is entitled to appeal to "reason" after claiming the definition is "entirely interpretable in terms of fact."

  **The Tension:** Sidgwick wants a naturalistic meta-ethics (Good = Hypothetical Psychological State). But he recognizes that "Good" carries an *authority* that mere psychological facts do not. When he says the ideal element is "interpretable in terms of fact," he means we don't need to posit a Platonic Form of the Good; we just need to posit a hypothetical psychological state.

  However, when he invokes Butler ("calm desire... is authoritative") and "harmony with reason," he is admitting that not all hypothetical desires count. Only the *rational* ones do.

  **Is it Circular?**
  It depends on how Sidgwick defines "Reason" in Book I. In the context of Egoistic Hedonism (which he is analyzing here), "Reason" primarily means **Prudence** (temporal neutrality) and **Consistency**.
  *   If "Rational" means "Prudent" (giving equal weight to all moments of time), then it is **not circular**. He is defining Good as "What a Prudent Agent would desire." Prudence is a formal constraint on the desire-formation process, not a substantive moral claim.
  *   If "Rational" implies "Morally Right," then it **is circular**.

  Sidgwick is hedging. He wants to say: "Good is what you'd want if you were smart and calm (Fact)." But he knows that "smart and calm" implicitly involves "caring about your future self" (Normative Principle of Prudence).

  **The Substantive Addition:** You are correct that something changes. The first paragraph offers a *procedural* definition (more info + more imagination). The second paragraph offers a *normative* constraint (harmony with reason). Sidgwick realizes that information alone doesn't guarantee rationality. A person can have full information and still be irrationally myopic or structurally incoherent. The appeal to "Reason" is an admission that the idealization procedure requires a **normative model of agency**, not just a descriptive model of psychology.

  ### 3. The CEV/Alignment Fork

  This is the crux of your inquiry. Does CEV face the same fork? **Yes, absolutely.**

  **Horn A: Purely Naturalistic Extrapolation (The Pig Risk)**
  If CEV is just "run the human psychology forward with more compute," it risks the Contented Pig scenario.
  *   *Wireheading:* If the extrapolation process discovers that stimulating the reward center is the most efficient way to satisfy "desire," it might extrapolate us into wireheads.
  *   *Preference Corruption:* If our current desires include self-destructive tendencies (e.g., addiction, ideological radicalization), a purely causal extrapolation might entrench these as "stable equilibria."
  *   *Sidgwick's Lesson:* Sidgwick's move to "present point of time" suggests that we cannot let the extrapolation change the *criteria* of evaluation. We must evaluate the future trajectory from the standpoint of our current *reflective* capacities. For AI, this means the AI cannot just optimize for *satisfaction*; it must optimize for *satisfaction as judged by the uncorrupted agent*.

  **Horn B: Normative Extrapolation (The Circularity Risk)**
  If CEV builds in "rationality" to rule out wireheading (e.g., "extrapolate what we would want if we were *better* people"), it faces the circularity/loss-of-volition problem.
  *   *Whose Rationality?* If "rationality" is defined by the AI's model, the AI is no longer aligning with *our* volition, but with *its* theory of the good.
  *   *Sidgwick's Lesson:* Sidgwick escapes the charge of "Platonic Dictate" by claiming the dictate of Reason is **implicit in ordinary judgments**. He argues that when we say "My Good," we *mean* "What my rational self would command."
  *   *Application to AI:* This suggests that "Volition" is not a raw datum (like a preference ordering). Volition is a **reflective equilibrium**. To align with human volition, the AI *must* model human normative reasoning, not just human desires. The "circularity" is not a bug; it is a feature of what it means to be a rational agent. We *want* to be governed by reasons, not just impulses.

  **Escaping the Fork:**
  Sidgwick offers a hint in the phrase: *"assuming my own existence alone to be considered."*
  He isolates the *structure* of the agency (Prudence/Time-Neutrality) from the *content* of the morality (Utilitarianism vs. Egoism).

  For AI alignment, this suggests a principled way out:
  1.  **Formal Normativity:** The idealization procedure should not build in substantive moral values (e.g., "don't kill"). That would be Horn B (imposing values).
  2.  **Structural Rationality:** Instead, it should build in *formal* constraints on agency (e.g., "avoid internal contradiction," "value future selves equally," "prefer coherence over fragmentation"). This is Sidgwick's "harmony with reason."
  3.  **The "Present Point" Lock:** The AI should extrapolate our desires, but evaluate the *outcome* of that extrapolation against our current *reflective endorsement*. (i.e., "If I saw the person I would become under this extrapolation, would I, *now*, approve of that transformation?")

  **Conclusion:**
  Sidgwick's text suggests that idealized desire theories cannot be purely descriptive. They inevitably smuggle in a theory of **rational agency**.
  *   If you deny this (Horn A), you get the Contented Pig (alignment with a corrupted version of the user).
  *   If you accept this (Horn B), you avoid the Pig, but you must admit that "Volition" includes a commitment to rationality that transcends current psychological states.

  Sidgwick's "paradox" ("somewhat paradoxical to say that this is what we commonly mean") is the acknowledgment that ordinary language conflates *what we want* with *what we should want*. For AI alignment, this means CEV cannot simply be a prediction engine. It must be a **philosophical engine** capable of distinguishing between "preference satisfaction" and "good." Sidgwick's hint is that this distinction rests on **temporal neutrality** and **reflective coherence**, which are formal properties of agency that can arguably be modeled without imposing substantive moral dogma.

  You are right to see the ancestor here. Sidgwick identifies the exact fault line: **Is "Good" what we would desire, or is it what we would desire *if we were rational*?** And if the latter, where does "rational" come from? Sidgwick's answer (Intuition of Prudence) is the only bridge available to CEV as well.
