answer: |-
  This is a fantastic problem to have. Most writers rely on "brooding silence" or "grinned like a shark" to convey team dynamics, but grounding your ensemble in a specific metaphysics of group agency will give your dialogue and conflict a structural integrity that readers feel even if they can't name it.

  To answer your core question immediately: **Yes, it matters.** Which theory you implicitly adopt changes the *nature* of the betrayal, the *language* of the accusation, and the *conditions* under which a character is allowed to quit.

  Here is the substantive breakdown of the differences, followed by how each plays out in your "two minutes before the job" scene.

  ### 1. The Substantive Differences: Mechanism and Ontology

  The core disagreement isn't about whether groups exist (all three agree there is no mystical hive mind floating in the ether); it is about **reductionism** and the **source of obligation**.

  **Michael Bratman: The Architect (Reductive Interlocking)**
  *   **The Mechanism:** Shared intention is nothing over and above the personal intentions of the individuals, provided they interlock correctly. For us to "intend to rob the bank," I must intend that *we* rob the bank, you must intend that *we* rob the bank, and we must both know this (common knowledge). Crucially, our sub-plans must **mesh**. If I plan to blow the door and you plan to pick the lock, we don't have a shared intention yet; we have a conflict.
  *   **The Ontology:** Strictly individualistic. There is no "group agent." There are only individuals whose intentions reference each other.
  *   **The Obligation:** Obligations arise from **reliance**. Because I announced my intention and you relied on it to form your own plan, I now have a moral obligation not to frustrate you. It is a web of interpersonal expectations.

  **John Searle: The Biologist (Primitive We-Intentionality)**
  *   **The Mechanism:** Searle agrees with Bratman that there is no group mind, but he disagrees that "we intend" can be reduced to "I intend + beliefs about you." He argues that "we-intend" is a **primitive biological capacity** in the individual brain. Just as I can have an "I-intention" without analyzing it, I can have a "we-intention." It is in my head, but its *content* is collective.
  *   **The Ontology:** Individualistic location (in the skull), but non-reductive content. The "we" is a fundamental mode of consciousness, not a calculation of interlocking parts.
  *   **The Obligation:** Obligations arise from the **Background**. Because we are social animals with this biological capacity, violating a we-intention is a violation of our social nature. It feels like a betrayal of identity, not just a breach of contract.

  **Margaret Gilbert: The Politician (Joint Commitment & Plural Subjects)**
  *   **The Mechanism:** Gilbert argues that when we jointly commit, we create a **Plural Subject**. This isn't just a metaphor. By expressing readiness to enter a joint commitment, we form a new entity (the "we") that holds the intention. Crucially, **no single individual can rescind the intention unilaterally.** Only the plural subject can dissolve the commitment.
  *   **The Ontology:** Normatively emergent. A new normative entity exists between the members. You are no longer just five individuals; you are one body politic.
  *   **The Obligation:** Obligations are *sui generis* (of their own kind). They are not just moral promises; they are **rights and duties of membership**. If you bail, you aren't just breaking a promise; you are acting without authority, because you no longer own the intention—the *group* does.

  ---

  ### 2. The Heist Scenario: The Bailout

  **The Scene:** It is T-minus two minutes. The Safecracker (let's call her V) puts down her torch. "I'm not doing this," she says. "I'm leaving."

  Here is how the metaphysics changes the reaction of the remaining four crew members.

  #### If you follow Bratman (The Architect)
  *   **The Diagnosis:** The mesh has failed. V's sub-plan (leave) no longer meshes with the others' sub-plans (enter). The shared intention has dissolved because the necessary interlocking conditions are broken.
  *   **The Accusation:** The others are angry because V has made them **vulnerable**. They formed their individual intentions based on the reliability of V's intention.
  *   **The Dialogue:** "You knew I was counting on you to clear the alarm. Now I'm exposed. You screwed me."
  *   **The Verdict:** V is morally blameworthy for causing harm through reliance, but she *is* free to leave. She owns her own intentions. The group cannot stop her physically without violating her individual agency. The obligation is a debt of damages, not a chain of command.
  *   **Narrative Vibe:** Cynical, pragmatic, transactional. "You broke the deal."

  #### If you follow Searle (The Biologist)
  *   **The Diagnosis:** V has undergone a psychological shift. She has lost the "we-intention" in her head. The collective action is impossible because the biological prerequisite is missing in one node.
  *   **The Accusation:** The others feel a sense of **alienation**. It's not just that the plan is ruined; it's that V has exiled herself from the social reality they built.
  *   **The Dialogue:** "Look at me. We are doing this. *We.* You can't just turn that off."
  *   **The Verdict:** V is psychologically severed from the group. The others might try to reignite her "we-intention" through emotional appeal or shared focus, but if the primitive state is gone, the joint action is dead.
  *   **Narrative Vibe:** Psychological, intense, identity-focused. "You're not one of us anymore."

  #### If you follow Gilbert (The Politician)
  *   **The Diagnosis:** V is attempting to do something **metaphysically impossible**. She cannot quit unilaterally. The intention belongs to the Plural Subject (the Crew), not to V. By trying to leave without the group's consent, she is acting ultra vires (beyond her powers).
  *   **The Accusation:** The others are angry because V is claiming an **authority she doesn't have**. She is treating a joint commitment as a personal promise.
  *   **The Dialogue:** "You don't get to decide that. *We* decide that. Sit down."
  *   **The Verdict:** V is not free to leave. Under Gilbert's view, she requires the permission of the other members to rescind the joint commitment. If she walks, she is violating a specific normative bond that overrides her individual preference.
  *   **Narrative Vibe:** Binding, claustrophobic, high-stakes. "You belong to the job now."

  ---

  ### 3. Recommendation for the Novel

  For a heist novel, **Gilbert's account offers the most dramatic tension.**

  Most thrillers hand-wave this by saying, "We shook hands, so you're honor-bound." That's weak. But if you write the scene with Gilbert's metaphysics in mind, the conflict becomes deeper.

  When V tries to bail, the Leader shouldn't just say, "You're breaking a promise." He should say, **"You don't have the right to quit."**

  This shifts the power dynamic. It implies that the "Crew" is an entity that supersedes the individuals. It justifies why the other four might feel entitled to coerce her, or why they feel a collective rage that is disproportionate to a simple broken contract. It explains why the "strangers" feel like family instantly—they have formed a Plural Subject.

  **However, Bratman is more realistic for criminals.**
  Criminals usually operate on Bratmanian terms: "I need you to do X so I can do Y. If you don't, I kill you." It's about meshing sub-plans and enforcement.

  **The Synthesis for Drafting:**
  You can use the *tension* between these views to create conflict between your characters.
  *   Maybe the **Leader** operates on **Gilbertian** logic ("We are a team, you can't leave").
  *   Maybe the **Rogue/Safecracker** operates on **Bratmanian** logic ("I have my own goals, if they don't mesh, I'm out").

  This creates a philosophical clash that underpins the action. The Leader feels betrayed because his ontology of the group is violated; the Rogue feels trapped because she believes she retains individual sovereignty.

  **Defensible Metaphysics Check:**
  If you want to be defensible:
  1.  **Don't** imply they share a literal telepathic link (avoids the "group mind" fallacy).
  2.  **Do** emphasize the *normative* shift. Once they agreed to the job, the rules of engagement changed from "what I want" to "what we owe."
  3.  **The Bailout:** If V leaves, she isn't just changing her mind; she is dismantling the structure that allows the others to act. The anger shouldn't just be "you're unreliable," it should be "you've destroyed the agent that was supposed to commit this crime."

  If you write the accusation as **"You are dissolving us,"** rather than **"You are leaving us,"** you capture the Gilbertian nuance without needing a philosophy lecture. It makes the stakes ontological: if she walks, the "Crew" ceases to exist, and the remaining four are just four scared individuals standing in front of a bank. That is a terrifying moment.
