prompt: |-
  ok so i need someone to poke holes in this because i don't fully trust my own judgment on it right now. I'm ABD on a Frege dissertation (sense/reference stuff, mostly) and my advisor offhandedly mentioned "the diary" last week like it was obvious I'd know about it. I did not. Spent the weekend reading about the 1924 diary entries -- wanting Jews' political rights curtailed, lumping them in with the Social Democrats and Catholics as enemies of the nation, pining for some strongman to sort out the "chaos" of Weimar parliamentary politics -- roughly, anyway, I only read a couple of secondary summaries so correct me if I'm garbling any of that. Point is I can't file it under gross biographical trivia that doesn't touch the actual philosophy anymore.

  Here's the argument I scratched out, tell me if it actually holds together:

  Freges whole case against psychologism already hands us a tidy answer to "does any of this matter." In "Der Gedanke" he insists thoughts (Gedanken) live in a mind-independent third realm, that logic states laws of truth rather than laws of how some particular thinker happens to reason -- so whatever the Begriffsschrift is worth, it can't depend on the biography of the guy who wrote it. Case closed, right?

  Except it bugs me that the same man who needed one eternal, hierarchical, contamination-proof realm of Truth also wanted one eternal, hierarchical, contamination-proof social order, scrubbed of exactly the pluralism he blamed for Germany's decline. Maybe that's just a coincidence of temperament and nothing more. But if the same horror of contingency is driving both the anti-psychologism and the politics, does that put any real pressure on the philosophical arguments themselves -- or am I just committing, ironically, the exact genetic fallacy Frege spent his career warning everyone else against?

  Tell me straight: does this go anywhere, or is it a dead end that anyone who's actually read the secondary literature would've dismissed ages ago? And separately -- am I being unfair to him?
