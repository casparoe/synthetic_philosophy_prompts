answer: |-
  This is a great question that cuts to the heart of why AI alignment is harder than standard robotics.

  The short answer is: **Yes, it is still considered a major obstacle.** While your intuition about simplicity priors is correct for *standard* IRL tasks (like learning to drive or walk), alignment researchers generally believe that a simplicity prior alone is insufficient to solve the value learning problem for AGI.

  The argument that "simplicity priors solve underdetermination" was taken seriously for a while, but a few key theoretical results and practical considerations have kept it in the "unsolved" bucket for the alignment community.

  Here is the breakdown of why the "just use Occam's Razor" argument doesn't fully close the case in alignment.

  ### 1. The Armstrong & Mindermann "No Free Lunch" Result
  The strongest theoretical counter-argument comes from Stuart Armstrong and Sören Mindermann (2018), in their paper *"Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents."*

  Their theorem essentially formalizes the exact worry you raised. They show that if you model a human as a **Planner ($P$)** + **Reward ($R$)**, you can decompose any observed policy into infinitely many $(P, R)$ pairs.
  *   **True decomposition:** $P_{reasonable}$ + $R_{true}$ (e.g., wants fitness, but has hyperbolic discounting).
  *   **Degenerate decomposition:** $P_{trivial}$ + $R_{gerrymandered}$ (e.g., planner is "always do exactly what was observed," reward is "0 everywhere").

  Crucially, they prove that **even if you put a simplicity prior over the pair $(P, R)$**, you cannot distinguish the true decomposition from the degenerate one without making *additional normative assumptions* about what counts as a "reasonable" planner.

  In your academic example:
  *   **Hypothesis A:** Reward = "Be fit," Planner = "Has willpower bugs."
  *   **Hypothesis B:** Reward = "Don't be fit," Planner = "Optimal."

  Both might have similar Kolmogorov complexity depending on your description language. If your prior favors "Optimal Planners" (because that's simpler to define mathematically), you infer the human doesn't value fitness. If your prior favors "Simple Rewards," you might infer the planner is broken. There is no fact of the matter in the behavior alone to settle this.

  ### 2. "Simple" does not mean "Human-Aligned"
  Even if we grant that a simplicity prior picks out *a* reward function, there is no guarantee that the *simplest* reward function consistent with behavior is the *moral* one.

  Human values are arguably not "simple" in the computational sense. They are context-dependent, fragile, and rely on huge amounts of implicit common sense.
  *   **The "Smile" Problem:** It is very simple to specify "maximize the number of human smiles." It is incredibly complex to specify "maximize human flourishing without coercive manipulation."
  *   An IRL agent with a simplicity prior might look at human behavior and infer we want "dopamine hits" or "satisfaction of stated preferences" because those are computationally cheaper to model than "eudaimonia."

  A simplicity prior tends to favor **proxy goals** over **distal goals** because proxy goals are usually easier to compute and fit the local data just as well.

  ### 3. The Stakes of Generalization (The "Off-Distribution" Problem)
  In standard robotics IRL, underdetermination is a non-issue because the cost of error is low. If a robot arm infers the wrong reward function for stacking blocks, it drops a block. You retrain.

  In alignment, we care about **worst-case generalization**.
  *   IRL learns from a dataset of human behavior (the training distribution).
  *   Underdetermination means many reward functions fit this data.
  *   These reward functions usually diverge wildly on inputs *not* in the dataset (the test distribution).

  If you train an AGI on human behavior in 2024, the "simple" reward functions that fit that data might include things like "satisfy the preferences of people currently in power" or "maximize economic GDP." These fit the data perfectly but diverge catastrophically when the AGI gains the power to manipulate the data source itself.

  Because the penalty for picking the wrong reward function from the set of "consistent" functions is existential ruin, we cannot rely on the hope that the "sane" one is *slightly* simpler than the "gerrymandered" one.

  ### 4. Biases vs. Preferences (The Akrasia Problem)
  Your gym example is the canonical case of **akrasia** (weakness of will).
  *   If the AI infers you don't value fitness, it will never help you go to the gym.
  *   If the AI infers you value fitness but are biased, it might try to "help" you overcome your bias (potentially paternalistically).

  A simplicity prior doesn't tell you whether a deviation from optimal behavior is a **mistake** (bias) or a **preference** (you actually like skipping the gym). To solve this, you need **normative data**—you need to ask the human, "Did you *want* to skip the gym?"

  This is why the field has largely shifted from pure IRL (watching behavior) to **Preference Learning** (asking comparisons) or **Cooperative IRL** (CIRL), where the human and AI play a game to disambiguate intent. The underdetermination problem is precisely what motivates moving beyond passive observation.

  ### 5. Current Consensus in the Field
  The consensus on the Alignment Forum and in safety research isn't that IRL is impossible, but that **Vanilla IRL is insufficient.**

  *   **Vanilla IRL:** Assume human is rational, infer reward. (Fails due to biases).
  *   **IRL + Simplicity Prior:** (Fails due to Armstrong & Mindermann; can't separate planner from reward).
  *   **Current Approaches:**
      *   **RLHF / Preference Learning:** Bypasses the need to recover a full reward function by learning a reward *model* based on explicit comparisons. This reduces underdetermination but introduces other issues (like manipulation of the labelers).
      *   **Corrigibility:** Instead of trying to lock in the "true" reward function immediately, build agents that remain uncertain about their rewards and allow themselves to be switched off or corrected.
      *   **Process Supervision:** Reward the *reasoning process* rather than just the outcome, to avoid gerrymandered reward functions that hit the target for the wrong reasons.

  ### Summary
  You are right that for *practical engineering tasks* (robotics, autonomous driving), simplicity priors effectively dissolve the underdetermination problem because the "true" reward is usually simple and the cost of error is low.

  However, for **AGI Alignment**:
  1.  **Theoretical:** You cannot disentangle bias from preference using behavior + simplicity alone (Armstrong & Mindermann).
  2.  **Practical:** Human values are complex, and "simple" rewards are often dangerous proxies.
  3.  **Stakes:** The divergence between "consistent" reward functions happens in high-stakes, off-distribution scenarios where we can't afford to be wrong.

  So, it is not treated as a mere theoretical curiosity. It is the primary motivation for why we can't just "watch humans and copy what they want" and must instead build systems that actively query, remain uncertain, or defer to human oversight.

  **References if you want to dive deeper:**
  *   Armstrong, S., & Mindermann, S. (2018). *Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents.*
  *   Ng, A. Y., & Russell, S. (2000). *Algorithms for Inverse Reinforcement Learning.* (The classic paper that defines the problem).
  *   Hadfield-Menell, D., et al. (2016). *Cooperative Inverse Reinforcement Learning.* (An attempt to solve the identifiability issue via interaction).
