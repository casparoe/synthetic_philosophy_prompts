  A friend of mine and I got into a whole argument last night about Nozick that never really got resolved. Her point was that because of the Wilt Chamberlain thing, the entitlement theory basically proves that whatever distribution comes out of people freely trading is just, full stop — which means taxation and even reparations for stuff like slavery would be fundamentally illegitimate no matter how the original wealth got accumulated. I didn't have a great comeback in the moment, but isnt that basically right? like isn't the whole point of "liberty upsets patterns" that once people are freely trading, you cant legitimately step in and rearrange things regardless of how the initial holdings came about?
