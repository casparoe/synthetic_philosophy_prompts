prompt: |-
  Been in a reading group on population ethics and we just got to infinite ethics, and now I think I've accidentally convinced myself the whole field is kind of moot -- which is annoying since I'm supposed to be writing my seminar paper on it. The argument: any countably infinite population has the same cardinality (aleph-null) no matter how utility is distributed across its members, so it seems like any two infinite worlds have to come out "equally good" once you compare them that way -- even in cases where one is a straight Pareto improvement on the other (literally everyone better off, no one worse off). If that's right, doesn't it mean utilitarians just can't rank infinite worlds at all, so all the infinite ethics papers are basically just rearranging deck chairs on a problem that's definately unsolvable? Feels like I'm missing something obvious but I can't put my finger on it.
