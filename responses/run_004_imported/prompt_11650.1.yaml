answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I'm a friend of the couple from our PhD program. And looking out at the room, I realize we have a bit of a split audience. About half of you are philosophers who know exactly why [Bride] and [Groom] argue about everything. The other half are family members who just know they argue about everything.

  I'm actually a philosopher of mind, so I spend my days worrying about whether we have free will or if we're just biological robots. But [Bride] and [Groom]? They worry about *Truth*. And they have spent the last several years passionately disagreeing on what that word even means.

  [Bride] is a Peircean. For the family: she believes truth is something a community works toward together, over a long, long time. It's a promise that if we keep asking questions and being honest, we will eventually converge on the right answer. It's patient. It's idealistic. It's "we get there together, eventually."

  [Groom] is a Jamesian. He believes truth is what has "cash value." Does this belief work for you *right now*? Does it help you navigate the world today? If it pays off in your actual life, it's true. It's practical. It's immediate. It's "does this help me live?"

  Naturally, they think the other is dangerous. [Bride] thinks [Groom]'s view collapses into, "True just means whatever I can get away with believing." [Groom] thinks [Bride]'s view is a mystical appeal to an infinite future that never actually arrives. She thinks he's too impulsive; he thinks she's too abstract.

  I've watched them debate this over cheap coffee in the grad school lounge and over expensive wine on vacations. And for a long time, I thought, "Well, this is a fundamental incompatibility." One wants the long game, one wants the immediate win.

  But then I started watching them plan a wedding. And I started watching them build a life. And I realized something that neither Peirce nor James quite wrote down, but that both of them were reaching for.

  I realized that a marriage *requires* both.

  Because, [Groom], if you only had your view? If truth was only about what pays off *right now*? Then a wedding vow is meaningless. A promise is a debt you pay in the future. You can't cash out the value of "in sickness and in health" on a Tuesday afternoon when everyone is healthy and happy. The cash value of a promise isn't in the moment you make it; it's in the moment you keep it when it's hard. You need [Bride]'s long-view convergence to make sense of commitment. You need to believe in the "eventual" to survive the "now."

  But [Bride], if you only had your view? If truth was only about that distant, ideal convergence at the end of inquiry? You'd never actually *live*. You'd be waiting for the perfect answer, the perfect moment, the perfect alignment of the community. But life isn't lived at the end of time. It's lived on Tuesday mornings when the sink is leaking and you're late for work. You need [Groom]'s cash value to make the idealism habitable. You need to know that what you are building *works*, that it brings warmth and joy and actual payoff in the present, or you'll never have the strength to keep walking toward the future.

  The reconciliation isn't that one of you converted the other. It's that your relationship is the place where these two ideas stop fighting and start holding hands.

  [Bride], you give [Groom] the North Star. You remind him that there is a truth bigger than his immediate convenience, a "we" that is stronger than his "I." You anchor him.
  [Groom], you give [Bride] the ground beneath her feet. You remind her that truth isn't just a destination; it's a vehicle. It's something you use to get through the day. You mobilize her.

  Peirce said truth is what the community would agree on at the end of inquiry. James said truth is what happens to an idea when it becomes good for believing.

  Look at them. They are a community of two. And every day they choose to be kind, to listen, to compromise, to laugh—that is a deposit in the bank. That is cash value. That is convergence.

  They have proven that you don't have to choose between the truth that saves you in the moment and the truth that saves you in the end. Because when you love someone like this, the daily payoff *is* the long-term convergence. The way he makes her laugh today *is* the evidence that they will be happy fifty years from now. The way she supports his dreams today *is* the proof of their lifelong partnership.

  They haven't solved the debate. I expect they'll be arguing about Peirce and James at their 50th anniversary. But they have solved the problem of how to live. They've shown us that truth isn't just a concept you write papers about. It's a practice you build together.

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your life together have immediate cash value, may it converge on a happy ending, and may you always find the truth in each other.

  To the happy couple!
