answer: |-
  This is a remarkably sharp philosophical intuition. You are absolutely right to draw the parallel. The Armstrong & Mindermann (2018) result is effectively a formalization of **Quine's indeterminacy of translation**, transposed from the philosophy of language to the philosophy of action and decision theory.

  Here is an argument for why your analogy holds, where it gets even deeper (involving Donald Davidson), and what it implies for the "fact of the matter" regarding human preferences.

  ### 1. The Structural Isomorphism

  The structural mapping between Quine's *Word and Object* (1960) and Armstrong & Mindermann's IRL impossibility result is nearly one-to-one.

  | Component | Quine (Indeterminacy of Translation) | Armstrong & Mindermann (IRL Impossibility) |
  | :--- | :--- | :--- |
  | **Observable Data** | Native's utterances & stimulus conditions (Behavior) | Agent's policy / trajectory (Behavior) |
  | **Hidden Target** | Meaning / Reference (Semantics) | Reward Function (Preferences) |
  | **Mapping Function** | Translation Manual | Rationality / Planning Algorithm |
  | **The Problem** | Multiple manuals fit all behavioral evidence. | Multiple $(R, \text{rationality})$ pairs fit all behavior. |
  | **Canonical Example** | "Gavagai" = Rabbit vs. Undetached Rabbit Part | Rational max($R$) vs. Anti-rational min($-R$) |
  | **Conclusion** | No fact of the matter about meaning. | No fact of the matter about preferences (without assumptions). |

  In both cases, you have an input-output black box.
  *   **Quine:** Input (Stimulus) $\to$ [Meaning + Translation Manual] $\to$ Output (Utterance).
  *   **IRL:** Input (State) $\to$ [Reward + Rationality Model] $\to$ Output (Action).

  Quine argues that because we only see the Input and Output, we cannot uniquely determine the internal bracketed terms. Armstrong & Mindermann prove mathematically that for any simplicity prior you place on the Reward function, there exists a complementary complexity in the Rationality model that cancels it out, leaving the behavior identical but the inferred reward opposite.

  ### 2. Epistemology vs. Ontology: Is there a "Fact of the Matter"?

  Your question asks if the lesson is that there is **no fact of the matter** about what someone wants. This moves from an epistemic claim (we can't know) to an ontological claim (it doesn't exist).

  **Quine's Stance:** Quine was an ontological behaviorist. He believed that if two translation manuals account for all possible behavioral evidence equally well, there is literally no deeper fact about what the native *means*. Meaning is not a ghost in the machine; it is constituted by behavioral dispositions.

  **The IRL Stance:** Most IRL researchers treat this as an **epistemic** problem, not an ontological one. They assume humans *do* have true preferences, and the math is just telling us we need more data or better priors (e.g., neuroscience, structural constraints on the brain).

  **The Philosophical Synthesis:** However, if you accept the Quinean analogy, the Armstrong & Mindermann result suggests that "preferences" are not pre-existing entities waiting to be discovered like fossils. Instead, **preferences are interpretative constructs.**

  To say an agent "wants $X$" is not a description of a hidden variable; it is a summary of their behavior *under a specific assumption of rationality*. Without that assumption, the concept of "wanting" dissolves into mere motion.

  ### 3. The Missing Link: Davidson's "Radical Interpretation"

  If you like this analogy, you should look into **Donald Davidson**, who bridged Quine and Decision Theory.

  In *Radical Interpretation* (1973), Davidson argued that you cannot separate **belief**, **meaning**, and **desire**. To interpret an agent, you must assume a "Principle of Charity." You must assume the agent is largely rational and that their beliefs are largely true.

  *   **Quine:** Indeterminacy is unavoidable.
  *   **Davidson:** Indeterminacy is resolved by *normative stipulation*. We *make* it the case that the agent is rational to make interpretation possible.

  This is exactly what we do in IRL. To solve the Armstrong & Mindermann degeneracy, we **stipulate** that humans are "noisy rational" (Boltzmann rationality). We don't know this is true; we assume it because without that normative constraint, the concept of "reward" is mathematically undefined.

  Therefore, the "fact of the matter" about what someone wants is **co-constituted** by the rationality model you impose on them. If you model a human as perfectly rational, their preferences look one way. If you model them as having specific cognitive biases (e.g., hyperbolic discounting), their "true" preferences shift to compensate.

  ### 4. Why This Matters for AI Alignment

  If your hypothesis is correct, it has terrifying implications for AI Alignment:

  1.  **Alignment is Hermeneutics, not Engineering:** We aren't "extracting" values; we are "interpreting" them. There is no ground truth to check our work against.
  2.  **The Risk of Projection:** If preferences are indeterminate without a rationality model, then an AI aligning to human preferences is effectively **projecting its own rationality model onto humans.** If the AI assumes a rationality structure that differs from human cognition (e.g., it assumes transitivity of preference where humans are intransitive), it will infer "preferences" that humans don't actually hold.
  3.  **Manipulation:** If the ($R$, Rationality) pair is degenerate, an AI could theoretically manipulate the human's rationality (e.g., induce confusion or bias) to make a desired reward function easier to optimize, while claiming it is still satisfying the human's "true" preferences.

  ### 5. Counter-Argument: The Biological Escape Hatch

  The one place where the Quine analogy might break is **physicalism**.

  Quine's radical translation assumes we *only* have behavioral evidence. But in IRL, we potentially have access to the "machine code" of the agent (neuroscience, brain scans).
  *   If we can observe the dopamine reward prediction error signals in the brain, does that break the degeneracy?
  *   Maybe the brain *physically* implements $R$ in a way that distinguishes it from $-R$.

  However, a hardline Quinean (or a computational functionalist) would argue that even neural data is just more behavior at a lower level. You still need to interpret what the neural firing *means* or *values*. You still need a mapping function between voltage spikes and "goodness." The regress continues.

  ### Conclusion

  You have hit on a profound insight. The Armstrong & Mindermann result is indeed **Quine's Indeterminacy of Translation applied to Utility Theory.**

  The lesson is that **preferences are not revealed; they are assigned.**

  There is no "fact of the matter" about what an agent wants independent of a model of how they think. To speak of human values is to speak of a joint product of human behavior and the interpreter's normative assumptions about rationality. In AI alignment, this means we cannot simply "learn" values; we must negotiate the rationality model we use to define them. We are not discovering what humans want; we are deciding how to make sense of what they do.
