  8.  **Final Polish:** Check the Ramsey quote ("ethically indefensible"). Ensure Stern vs. Nordhaus positions are accurately characterized (Stern: low $\delta$, Nordhaus: market-based $r$).

  *(Self-Correction Note)*: I need to be careful not to imply that diminishing marginal utility is *morally neutral*. It has moral implications (utilitarianism). But the distinction is between *discounting the person* vs. *discounting the dollar*.

