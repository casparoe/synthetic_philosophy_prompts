prompt: |-
  I'm working on a longer feature about how economists put a present-day price tag on climate damage that won't hit for another 50-100 years (the whole "social cost of carbon" fight), and I've gone down a rabbit hole on discounting that I can't climb back out of. Everyone talks about "discounting the future" like its one move, but the more I dig into the postmortems on the Stern Review and the Nordhaus rebuttals, the clearer it gets that the standard discount rate is actually smuggling together two pretty different ideas: theres "pure time preference," which just means caring less about a unit of someone's wellbeing purely because it happens later, full stop, and then there's the separate move of discounting future consumption because people down the line will probably be richer, so an extra dollar (or a ton of avoided carbon damage) is worth less to them at the margin than it is to us now. Stern basically zeroed out the first one and got these huge, scary damage estimates; Nordhaus thought that was borderline dishonest and wanted something closer to observed market interest rates.

  My economist friend swears these two things are worlds apart morally - one is basically arbitrary discrimination against people who don't exist yet, the other is just ordinary diminishing-marginal-utility reasoning that any decent utilitarian should already accept - but when I pushed her on why philosophers get so exercised about pure time preference specifically while mostly shrugging at the growth-adjusted kind, given that both spit out the exact same practical result (future welfare counts for less in the sum), she kind of hand-waved. I gather Frank Ramsey is the guy who kicked this off almost a century ago by basically calling pure time discounting indefensible. So could you walk me through the actual distinction properly: is there a real principled case for treating these two forms of discounting so differently, or is the growth-based one just pure time preference wearing a lab coat? Genuinely want a verdict here, not just a "well, philosophers disagree" shrug.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The Social Cost of Carbon (SCC), specifically the discount rate debate (Stern vs. Nordhaus).
      *   **Core Question:** What is the *real* moral/principled distinction between "pure time preference" (discounting future welfare just because it's later) and "discounting due to economic growth/diminishing marginal utility" (discounting because future people will be richer)?
      *   **User's Frustration:** Their economist friend claims they are morally distinct, but when pressed on *why* philosophers care about one and not the other (since both reduce the present value of future harm), the friend hand-waved. The user wants a verdict, not a shrug.
      *   **Context:** Long-form feature journalism. Needs depth, clarity, and a strong narrative hook/explanation.
      *   **Key Figures:** Frank Ramsey, Nicholas Stern, William Nordhaus.
      *   **Goal:** Explain the distinction clearly, validate the user's skepticism (it *does* look similar mathematically), but articulate the philosophical defense for why they are treated differently.

  2.  **Deconstruct the Discount Rate ($r$):**
      *   The standard Ramsey Rule equation: $r = \delta + \eta \cdot g$
      *   $\delta$ (delta): Pure rate of time preference (PRTP). Impatience. Myopia.
      *   $\eta$ (eta): Elasticity of marginal utility of consumption (aversion to inequality).
      *   $g$: Growth rate of consumption.
      *   *User's Insight:* Both $\delta$ and ($\eta \cdot g$) make future dollars count less today. So why is $\delta$ "evil" and ($\eta \cdot g$) "rational"?

  3.  **The Philosophical Distinction (The "Verdict"):**
      *   *Pure Time Preference ($\delta$):* This is about *identity* and *rights*. If I value a util of happiness in 2100 less than a util in 2024 *solely* because of the date, I am saying future people matter less. This violates intergenerational equity. It's discriminatory based on temporal location. Ramsey called it "ethically indefensible."
      *   *Growth/Marginal Utility ($\eta \cdot g$):* This is about *capacity to benefit*. If future people are richer, a dollar helps them less than it helps a poor person today. It's not that their happiness counts less; it's that the *instrument* (money/carbon damage) matters less to them. It's an empirical claim about wealth, not a moral claim about worth.
      *   *Analogy:* Giving \$100 to a billionaire vs. a starving person. You don't value the billionaire less as a human; you value the *impact* of the \$100 less.

  4.  **Addressing the User's Skepticism ("Is it just a lab coat?"):**
      *   The user is right to be suspicious because in *practice*, high discount rates (whether from $\delta$ or $g$) lead to the same policy outcome: do less now.
      *   However, the *justification* changes the moral landscape.
      *   *Crucial Nuance:* The growth argument relies on the assumption that future people *will* be richer. If climate change makes them poorer (negative $g$), the logic flips. This is a key point for a climate story.
      *   *Risk/Uncertainty:* We don't know $g$. If we wreck the planet, $g$ could be negative. Then $\eta \cdot g$ becomes negative, meaning we should save *more*. Pure time preference doesn't care about that.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the rabbit hole. Validate the user's intuition (mathematically, they look the same). State the thesis: The distinction is real, but it hinges on *why* the value drops, not *that* it drops.
