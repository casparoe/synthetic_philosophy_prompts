      *   *Emphasis:* Highlight that $\delta$ is a *parameter choice*, while $g$ is a *forecast*.

  7.  **Final Review against User Prompt:**
      *   Did I answer "is there a real principled case"? Yes.
      *   Did I avoid the "philosophers disagree" shrug? Yes.
      *   Did I address the "lab coat" suspicion? Yes.
