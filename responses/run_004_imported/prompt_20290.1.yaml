      *   **The Moral Core (Pure Time Preference):** Explain Ramsey's objection. It's discrimination. Analogy: Distance vs. Time. (We don't discount people in Australia just because they are far away).
      *   **The Economic Core (Diminishing Marginal Utility):** Explain the "Richer Future" assumption. Analogy: The Billionaire vs. The Pauper. It's about the *good*, not the *person*.
      *   **The "Verdict" (Addressing the Hand-Wave):** Why philosophers care. One is axiomatic (how we value lives), the other is empirical (how wealth works).
      *   **The Climate Twist (The "Gotcha"):** This is crucial for the user's story. The growth argument assumes growth. If climate change causes collapse, the growth discount reverses. This undermines Nordhaus's reliance on market rates if those rates assume stability.
      *   **Conclusion:** Summarize. It's not a shrug. One is a moral choice (how much we love future generations), the other is a bet (how rich they will be).

  6.  **Refining the Tone:**
      *   Needs to be journalistic but authoritative.
      *   Avoid overly dense jargon where possible, or explain it immediately.
      *   Respect the user's intelligence (they clearly know the Stern/Nordhaus debate).
