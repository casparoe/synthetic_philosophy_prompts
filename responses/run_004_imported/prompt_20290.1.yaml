answer: |-
  You have hit on the exact nerve that makes the economics of climate change so explosive. Your intuition is sharp: mathematically, in the discounting formula, pure time preference and growth-adjusted discounting look identical. They both shrink the present value of future harm. If the output is the same (do less today), why does the input matter so much?

  Here is the verdict you are looking for: **The distinction is real, principled, and morally significant, but your skepticism is justified because the "growth" argument relies on a gamble that might not pay off.**

  To write this feature, you need to separate the *ethics of valuation* from the *economics of capacity*. Here is the breakdown of why philosophers and economists treat these two components of the Ramsey Rule differently, and where the "lab coat" accusation actually holds water.

  ### 1. The Equation: $r = \delta + \eta \cdot g$

  To understand the fight, you have to look under the hood of the standard discount rate ($r$). It is usually composed of two parts (the Ramsey Rule):

  1.  **$\delta$ (Delta): Pure Rate of Time Preference.** This is the "impatience" parameter. It asks: *Do we value a unit of wellbeing in 2100 less than a unit in 2024 simply because it is later?*
  2.  **$\eta \cdot g$ (Eta times Gamma): The Growth/Marginal Utility Component.** This asks: *Will future people be richer?* If consumption ($g$) grows, and utility from consumption diminishes ($\eta$), then an extra dollar is worth less to a rich future person than to us.

  **Your friend is right about the moral distinction, but you are right to suspect the practical outcome.**

  ### 2. Pure Time Preference ($\delta$): The Moral Offense

  Frank Ramsey, in his 1928 paper *A Mathematical Theory of Saving*, called pure time preference "ethically indefensible and [arising] merely from the weakness of the imagination."

  Here is the principled case against it: **It is discrimination based on temporal location.**

  If you set $\delta$ at 3%, you are effectively saying that a child born in 2100 counts for less than a child born today, purely because of the date on their birth certificate. In almost every other moral framework, this is unacceptable. We do not discount the suffering of people in Australia because they are far away (spatial discounting); why do we discount people in 2100 because they are far away in time?

  *   **The Philosophical Verdict:** $\delta$ is a moral parameter. Setting it high is an explicit choice to value current generations over future generations. Stern set this near zero (0.1%) because he argued we have no right to discriminate against our descendants. Nordhaus set it higher (around 1-1.5%+) because he argued we observe humans *acting* impatient in markets, so we should model that behavior.
  *   **Why it matters:** If you justify climate inaction using $\delta$, you are admitting that you simply care less about future people. That is a hard moral pill to swallow in a policy document.

  ### 3. Growth-Adjusted Discounting ($\eta \cdot g$): The Empirical Bet

  This is where your friend says "diminishing marginal utility" is fine, and you suspect it's just "time preference in a lab coat."

  The argument here is not that future people *matter* less, but that a *dollar* (or a ton of carbon damage) matters less to them. If we assume the global economy grows at 2% a year, people in 2100 will be roughly 7 times richer than we are. To a billionaire, losing \$1,000 is annoying; to a pauper, it is catastrophic. If we assume future generations are billionaires, we should invest less now to save them \$1,000, because they can afford the loss better than we can afford the mitigation cost.

  *   **The Philosophical Verdict:** This is not discrimination against *persons*; it is an assessment of *goods*. It is utilitarian logic: maximize total welfare. Transferring wealth from poor (us) to rich (them) reduces total welfare.
  *   **Why philosophers shrug:** Because it's not a moral axiom; it's an empirical forecast. It relies entirely on the variable **$g$ (growth)**.

  ### 4. The "Lab Coat" Accusation: Where You Are Right

  Here is the angle for your feature that will make your economist friend sweat. The distinction holds up *only if* the growth assumption holds true.

  The "growth" discount ($\eta \cdot g$) looks like moral neutrality, but it smuggles in a massive assumption: **That the economy will grow.**

  If climate change is catastrophic, $g$ could be zero or negative. If future people are *poorer* than us because we wrecked the climate, the math flips. If $g$ is negative, the term $\eta \cdot g$ becomes negative. This implies the discount rate should be *lower* (or negative), meaning we should value future damages *more* than present costs, because future people will be desperate for the resources we are burning now.

  **This is the verdict:**
  *   **Pure Time Preference ($\delta$)** is a **moral choice**. It is indefensible if you believe in intergenerational equity.
  *   **Growth Discounting ($\eta \cdot g$)** is an **empirical gamble**. It is defensible in theory, but potentially dishonest in practice if used to justify inaction while assuming away the risk that climate change itself destroys the growth that justifies the discount.

  Nordhaus uses market interest rates to derive his discount rate. But market rates reflect optimism about stable growth. Using market rates to discount climate damage is circular: it assumes the market survives the climate damage to generate the rates used to discount the damage.

  ### 5. Summary for Your Feature

  You can frame the distinction like this:

  **Pure Time Preference** is saying, "I care less about my grandchildren than my children because they haven't been born yet." Philosophers hate this because it violates the principle of equal moral worth.

  **Growth Discounting** is saying, "I expect my grandchildren to be richer than me, so they can pay for their own problems." Economists accept this because it follows standard utility theory.

  **The Catch:** The second argument only works if you don't burn down their house. If climate damage suppresses growth, the "richer future" assumption collapses, and the discount rate should plummet. By using a high discount rate based on historical growth, economists like Nordhaus are effectively betting that climate change won't be bad enough to stop economic growth.

  **The Headline:** The fight over the discount rate isn't just about math; it's about whether we are betting on a future rich enough to ignore us, or a future too poor to save itself. Stern bet on the latter (low discount rate, act now); Nordhaus bet on the former (higher discount rate, act gradually).

  Your friend isn't hand-waving on the moral distinction—there is a real difference between discriminating against a person and assessing their wealth. But you are right to press on the fact that in a climate context, **wealth is endogenous.** We determine how rich they are by how much carbon we emit. Discounting their suffering because you assume they'll be rich, when your inaction is what makes them poor, is the ultimate "lab coat" move.
