      *   *Q4 (Specific Constraint - Linguistics):* "Intended" vs. "Decided." The effect shrinks or changes with different verbs.
          *   *Follow-up:* If she says "pragmatics," ask why competence varies with pragmatics.
      *   *Q5 (Deepening Linguistics):* What about "knowingly"?
          *   *Follow-up:* If she distinguishes intention from knowledge, ask about the boundary.
      *   *Q6 (Specific Constraint - Causality/Parsimony):* Extending to causal judgments. If everything is moral, is the theory too big?
          *   *Follow-up:* If she says "yes, it's all moral," ask about physical causation.
      *   *Q7 (Norms beyond Morality):* Etiquette or conventional norms. Does the effect hold?
          *   *Follow-up:* If yes, is it really *moral* or just *normative*?
      *   *Q8 (Developmental/Individual Diff):* Do kids or psychopaths show the effect?
