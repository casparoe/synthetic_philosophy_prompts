      *   **The Interviewee's View (Competence/Constitutive):** Morality is part of the *concept* of intentionality. It's not a performance error (bias).
      *   **Rival View (Machery/Trade-off):** It's about weighing costs and benefits. The Interviewee calls this "moral valence in disguise."
      *   **Goal:** Challenge the "Constitutive" view by showing where it gets messy, unfalsifiable, or linguistically unstable, without being overtly hostile (it's an interview, not a debate).

  3.  **Drafting Strategy - Progression:**
      *   *Questions 1-3:* Establish the core claim and the dismissal of rivals.
      *   *Questions 4-6:* Introduce specific empirical pressure points (linguistics, trade-offs).
      *   *Questions 7-9:* Broaden the scope (causality, parsimony).
      *   *Question 10:* The "killer" falsification question.

  4.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Setting the stage):* Ask about the core claim. Why is it competence, not performance?
