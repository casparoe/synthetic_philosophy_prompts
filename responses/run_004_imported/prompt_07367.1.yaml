answer: |-
  1. **The Competence Claim**
  You argue that the Knobe effect reveals the true structure of our concept of intentional action, rather than a performance error induced by emotional reaction. But if moral evaluation is constitutive of the *competence* itself, why do we observe significant variance in the effect's magnitude across different demographic groups? If this is the grammar of our moral psychology, shouldn't it be as stable as the grammar of our native language?

  *   **Follow-up:** If she answers that the *core* competence is stable but performance variables (like attention or cognitive load) create the variance, ask: "At what point does accumulated variance stop looking like noise and start looking like a different underlying rule set?"

  2. **The "Disguise" Rebuttal**
  You've dismissed Machery's trade-off hypothesis by claiming it is merely "moral valence wearing a cost-benefit disguise." That is a strong charge of theoretical redundancy. Can you point to a specific mechanism in the trade-off model where the calculation *must* fail without secretly importing a moral premise?

  *   **Follow-up:** If she argues that weighing "costs" inherently requires valuing outcomes morally, ask: "Does that mean a purely prudential cost-benefit analysis is psychologically impossible for human beings, or just that your theory subsumes prudence under morality?"

  3. **The Trade-Off Vignette Challenge**
  To test that redundancy claim, I need you to specify a concrete vignette. Describe a specific trade-off scenario where the costs and benefits are clearly balanced, the moral valence is neutral or ambiguous, and yet your account predicts a *null* result while the trade-off hypothesis predicts a positive effect. If you cannot name a case where your theory risks being wrong, how is the account falsifiable?

  *   **Follow-up:** If she describes a hypothetical neutral case that hasn't been tested, ask: "Why hasn't it been tested? Is it because the prediction is obvious, or because you suspect the Knobe effect would still appear, undermining the trade-off explanation?"

  4. **Linguistic Sensitivity**
  Recent data suggests the size of the effect shifts significantly depending on whether we ask if an agent "intended to" bring about a side effect versus whether they "decided to" bring it about. If moral evaluation is built into the *concept* of intentional action, why does the concept appear to fluctuate based on simple verb substitution?

  *   **Follow-up:** If she attributes this to pragmatic context rather than semantic content, ask: "If pragmatics can switch the moral component on and off, is the morality really part of the concept's competence, or is it a contextual heuristic applied on top of it?"

  5. **The "Knowingly" Boundary**
  Extending that linguistic point: subjects are often willing to say an agent brought about a side effect "knowingly" even when they deny it was "intentional." If morality is constitutive of intentionality, where exactly do you draw the boundary between the moral threshold for knowledge and the moral threshold for intention?

  *   **Follow-up:** If she argues that knowledge requires a lower threshold of normative engagement than intention, ask: "Doesn't that imply two different moral mechanisms? And if so, isn't it more parsimonious to say there is one neutral mechanism sensitive to different normative weights?"

  6. **Causal Judgments and Parsimony**
  Some experimentalists have found Knobe-like asymmetries in purely causal judgments (e.g., whether a component *caused* a system failure). How far are you willing to extend your story before the theory stops being an account of intentional action and becomes a theory of everything? At what point does claiming "all cognition is morally laden" cease to be an insight and start being a loss of parsimony?

  *   **Follow-up:** If she embraces the view that all causal attribution is normative, ask: "If a falling rock 'causes' a window to break, is there a moral valence there? If not, what distinguishes human causation from physical causation in your model without reintroducing the very bias you're trying to eliminate?"

  7. **Non-Moral Norms**
  Studies have shown the effect persists even when the norm violated is one of etiquette or convention rather than morality (e.g., wearing a swimsuit to a formal party). If the effect is triggered by convention, why do you insist on labeling the underlying competence as *moral* evaluation rather than general normative evaluation?

  *   **Follow-up:** If she replies that conventions are a subset of moral norms in this context, ask: "Does expanding the definition of 'moral' to include etiquette risk making the term too broad to do any explanatory work in distinguishing right from wrong?"

  8. **Developmental and Clinical Evidence**
  If this moral competence is fundamental to the concept of intention, we should see it in populations with impaired moral reasoning. Do children with callous-unemotional traits or adults with psychopathy display the Knobe effect? If they don't, does that suggest the effect is indeed a moral bias rather than a conceptual competence?

  *   **Follow-up:** If she cites data showing these groups *do* show the effect, ask: "If the effect persists without empathetic concern, doesn't that support the rival view that this is a cold cognitive heuristic about norm violation, not a deep moral evaluation?"

  9. **Prescriptive Consequences**
  Let's assume you are right and the law is currently using a "biased" definition of intentionality that ignores this moral component. Should legal statutes be rewritten to align with your folk-concept findings, or do you advocate for a revisionary project where the law ignores the folk concept to maintain objectivity?

  *   **Follow-up:** If she says she is only describing, not prescribing, ask: "But if your description shows that 'objective' intentionality is impossible for humans, isn't the prescription implicitly to abandon the search for objective mens rea?"

  10. **The Falsification Condition**
  Finally, I want to pin this down for the record. State, in advance, the single empirical result that would make you abandon a competence account for a performance-error account. Is there a specific pattern of data, a specific demographic, or a specific vignette outcome that would force you to concede that morality is merely a bias?

  *   **Follow-up:** If she offers a vague condition (e.g., "if the effect disappeared entirely"), ask: "If the effect disappeared in 90% of cases but held in 10%, would you posit a sub-competence, or would you finally accept the performance-error model?"
