      *   *Q9 (Theoretical Cost):* Is redefining "intentional" worth the confusion it causes in law/ethics?
          *   *Follow-up:* If she says "descriptive not prescriptive," ask why it matters.
      *   *Q10 (Specific Constraint - Falsification):* What result kills the theory?
