answer: |-
  **Setting:** *The corridor outside the main lecture hall, late evening. The hum of the building's HVAC system is the only background noise. Most of the crowd has dispersed to the reception, but ELENA and MARCUS linger by the coffee urn, cups in hand. Both are senior cosmologists, long-time colleagues, and friends.*

  **Elena:** (Staring into her black coffee) The speaker glossed over it, didn't he? Ten minutes on the measure problem, then a hand-wave about vacuum decay rates. As if tweaking the nucleation rate saves us from the Boltzmann brains.

  **Marcus:** He's optimistic. If the decay time is short enough, the de Sitter phase doesn't last long enough to cook the fluctuations.

  **Elena:** "If." And that's a big "if." Look, Marcus, you know the math. In an eternal de Sitter vacuum, the thermal fluctuations at the horizon are inevitable. Given infinite time, the number of Boltzmann Brains (BBs) diverges. The number of Ordinary Observers (OOs)—us, evolved after a Big Bang—is finite. The ratio is infinite. If that model is true, I am almost certainly a BB.

  **Marcus:** And since you are presenting an argument to me in a corridor, you believe you are not.

  **Elena:** Exactly. So the model is falsified. It predicts I should be a solipsistic hallucination with false memories of this conversation. I am not. Therefore, the model is wrong. It's a straightforward *modus tollens*.

  **Marcus:** Is it? Or is it a *petitio principii*? You're using your reasoning faculties to evaluate a theory that says those very faculties are unreliable.

  **Elena:** Here we go. The Carroll line. "Cognitive Instability."

  **Marcus:** It's not just a slogan, Elena. Think about the Bayesian update. You're saying $P(\text{Model} | \text{I am an OO})$ is low because $P(\text{I am an OO} | \text{Model})$ is near zero. But where does the data "I am an OO" come from? It comes from your memories, your sensory inputs, your logic. If the Model is true, those inputs are random noise. You can't use noise to disconfirm the source of the noise.

  **Elena:** So what? We just accept the Model?

  **Marcus:** No. We reject it *a priori*. We say that any cosmological model that renders typical observers incapable of reliable inference is not a viable scientific theory. It's not that the data disproves it; it's that the theory disqualifies itself from the game of science.

  **Elena:** (Sets cup down on a windowsill) That smells like immunization. You're placing the conclusion beyond the reach of evidence. If I can say, "Any theory that predicts I'm wrong is cognitively unstable," I can shield *any* theory from falsification. I could propose a theory where the sky is green, and when you point to the blue sky, I say, "Ah, but in that theory, your perception of blue is a hallucination, so you can't use that perception to reject the theory."

  **Marcus:** That's a fair worry, but the cases aren't symmetric. In your green-sky example, the theory is ad-hoc. In the BB case, the theory is a natural extrapolation of quantum field theory in curved spacetime. The problem isn't that the theory is contrived; it's that it's *self-undermining*. A map that says "This map is mostly incorrect" cannot be used to navigate. You don't navigate with it and then say, "Well, I got to my destination, so the map is wrong." You throw the map out before you start walking.

  **Elena:** But who decides which maps are throw-away maps? You're introducing a principle that isn't physical. It's epistemological. You're saying the universe *must* be such that we can understand it. That's Kantian, not empirical.

  **Marcus:** It's pragmatic. Science requires a link between evidence and truth. If a theory severs that link for the majority of observers it predicts, it destroys the basis for its own confirmation. I'm not saying the universe must be convenient. I'm saying a theory that denies the possibility of confirmation is not a scientific theory.

  **Elena:** Let's press that. Why do I have the right to assume I'm typical? That's the Self-Sampling Assumption. Why should the frequency of observers in the universe track the truth of my self-location?

  **Marcus:** (Pauses) Because without it, you can't do cosmology at all.

  **Elena:** Precisely! So admit it. It's an assumption. A piece of prior machinery we bolt onto the physics to make predictions work.

  **Marcus:** Yes.

  **Elena:** And if it's an assumption, why is your version of it—"Reject BB-dominating theories"—better than mine—"Update against BB-dominating theories"? In my version, I keep the epistemology standard: Data comes in, I update the credence of the theory. In your version, you modify the prior to zero out any theory that makes the data unlikely *for indexical reasons*.

  **Marcus:** Because your version leads to skepticism. If you treat "I am an OO" as empirical data subject to updating, you have to admit there is a non-zero probability you are a BB. If you admit that, you have to admit your memories might be false. If your memories might be false, your update is based on garbage. You can't climb a ladder and then kick it out from under you while you're still standing on it.

  **Elena:** I'm not kicking the ladder out. I'm saying the ladder doesn't reach the roof. Look, Marcus, suppose the universe *is* eternal de Sitter. Suppose BBs *do* dominate. It's a grim fact. It doesn't change the fact that *I* am having this conversation. I have a continuous history. I have a thermodynamic arrow of time pointing away from a low-entropy past.

  **Marcus:** A history that a BB could fluctuate into having.

  **Elena:** Sure. But the *probability* of a BB fluctuating into a state where it *consistently* observes the laws of physics, derives general relativity, and predicts its own existence is vanishingly smaller than the probability of an OO doing it. Even if BBs are more numerous, the ones that act like us are rare among BBs.

  **Marcus:** Are they? In infinite time, everything happens.

  **Elena:** But we're talking about measures. If the measure of OOs is non-zero and the measure of "sane" BBs is suppressed... look, this is getting into the weeds. The point is: I trust my records. I trust the CMB. I trust the fossil record. These are correlated pieces of evidence. A fluctuation explains one moment of consciousness. It doesn't explain the coherence of the external records I share with you.

  **Marcus:** Unless you and I are fluctuating together. A "Boltzmann Duo."

  **Elena:** (Laughs) The probability is exponentially lower.

  **Marcus:** But still non-zero. And in an infinite universe, non-zero is infinity. That's the math you started with.

  **Elena:** Okay, let's step back. You say we must reject BB-dominating theories *a priori* to avoid cognitive instability. I say that's dogmatism. It's saying, "The universe cannot be such that we are deluded." But nature is under no obligation to preserve our epistemic security. If the best physics says we're likely fluctuations, then we should accept that we are likely fluctuations, even if it makes our reasoning shaky. We should be fallibilists.

  **Marcus:** Fallibilism is one thing. Self-destruction is another. If you accept you are likely a BB, you lose the justification for believing the physics that told you you're likely a BB. It's a paradox. You can't hold the belief "I am likely a BB" rationally.

  **Elena:** Why not? I can hold the belief "My instruments are likely calibrated incorrectly" without throwing away the instruments. I just lower my confidence.

  **Marcus:** It's deeper than calibration. If you are a BB, you don't have instruments. You have a memory of instruments. There's no external reality to check against.

  **Elena:** But I *act* as if there is. And the success of my actions—building telescopes, predicting eclipses—suggests the OO hypothesis is better.

  **Marcus:** That's the pragmatic argument again. But a BB could fluctuate into a state where it *believes* its actions are successful.

  **Elena:** For how long? The BB flickers and dies. I persist.

  **Marcus:** For a subjective second, which feels like a lifetime.

  **Elena:** (Sighs) So we're at the impasse. You think my reliance on "I am an OO" is question-begging. I think your reliance on "Cognitive Stability" is a shield against unpleasant truths.

  **Marcus:** I think it's a condition of possibility for science.

  **Elena:** I think it's a restriction on what the universe is allowed to be.

  **Marcus:** Not what the universe *is*, but what we can *say* about it.

  **Elena:** (Picks up her coffee cup again) You know, when I worked on nonequilibrium stats mech, we dealt with this. The H-theorem. Loschmidt. We resolved it by coarse-graining. We admitted that the arrow of time isn't in the microstate; it's in our description of it.

  **Marcus:** And?

  **Elena:** And now you're telling me the "Ordinary Observer" isn't in the cosmology; it's in our description of it. But you want to elevate that description to a fundamental constraint. You want to make the coarse-graining a law of nature.

  **Marcus:** I want to make it a law of *inference*. If the coarse-grining leads to a contradiction where the observer cannot trust the grain, you need a new grain.

  **Elena:** Or you admit the grain is fine, and the picture it produces is just unsettling.

  **Marcus:** If the picture erases the eye looking at it, it's not a picture.

  **Elena:** (Smiles faintly) That's poetic, Marcus. But physics isn't poetry. It's about what's out there.

  **Marcus:** And physics is done by minds in here. (Taps his temple) If the "out there" makes the "in here" impossible, we have a category error.

  **Elena:** I suppose that's why they pay us the big bucks. To argue about whether we exist.

  **Marcus:** (Chuckles) And whether we can know it.

  **Elena:** Come on. The reception still has wine. I need something real to drink, just in case I'm a fluctuation.

  **Marcus:** Lead the way. But if you start dissolving into thermal noise, I'm not catching you.

  **Elena:** Fair enough.

  *(They walk down the corridor. The lights flicker once, imperceptibly, then stabilize.)*
