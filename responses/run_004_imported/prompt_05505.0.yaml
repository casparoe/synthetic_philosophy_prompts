prompt: |-
  I'm a junior at my high school and one of five student members on our Student Government Elections Board, which hears complaints about campaign conduct and has the authority to certify, sanction, or void election results; I joined partly because I'm in AP Government this year and wanted to see how rules like this actually get applied rather than just discussed in the abstract. We just finished counting votes for next year's Student Body President, and the runner-up has filed a formal complaint asking us to void the results, which has turned into the most contested case the board has handled in the three years it's existed. Our faculty advisor has asked each of the five of us to submit a short written recommendation before Friday's meeting, which she'll read aloud before we debate and vote, and I'd like mine to hold up on the merits rather than simply restate whichever way I happen to lean personally.

  The situation is this. Priya won by 41 votes out of about 590 cast, and Marcus, the runner-up, argues that three of her tactics crossed the line from campaigning into manipulation, even though our bylaws only ban "dishonest or manipulative practices" and separately protect "vigorous persuasive campaigning" without ever saying where one shades into the other. First, in the final week, she and her team sent noticeably different direct-message pitches to different friend groups based on things gathered from those groups' own posts and group chats -- telling club-sport captains she'd fight for a bigger locker-room budget, telling the AP crowd she'd push to cap nightly homework -- so that almost no one outside her inner circle saw one coherent version of her platform, and some of what different groups were promised is in real tension with the rest. Second, our rules bar any new campaign material once voting opens, so she timed a video to go live at the exact moment the 24-hour window began: a montage of real, unedited clips of Marcus taken from a recorded advisory-period discussion on student mental health that the school itself had posted online months earlier for students who'd been absent, resequenced and set to somber music to imply he doesn't take the issue seriously. Nothing in it is fabricated, but because the no-new-material rule had just kicked in, Marcus had no way to respond or add context without breaking the very rule she had technically obeyed. Third, because she filed her candidacy a day earlier, her video appeared above his on the school's official voting portal, and she posted a countdown urging supporters to vote the second polls opened, pulling in a wave of votes before undecided students had even scrolled down to see Marcus's video. It's been the main topic of conversation in the cafeteria all week, with people's opinions splitting almost perfectly along who they voted for, which frankly makes me trust my own instincts on this even less.

  Could you draft the memo I'll circulate to the rest of the board? It should run no more than a page, recommend one clear resolution -- certifying the results as they stand, voiding the election and ordering a rerun, or some middle option like certifying the results while formally censuring the campaign -- and defend that recommendation on its merits rather than by appeal to precedent, since we have none. It should also propose two or three concrete criteria we could actually add to the bylaws to separate manipulative tactics from legitimate persuasion going forward, since whatever line we draw this week will become the de facto standard for every election after it. Please engage seriously with the strongest version of Priya's defense -- that no single statement she made was false, and that targeted messaging and favorable timing are just how campaigns work everywhere -- rather than dismissing it, since at least two of the five board members already find it convincing. And if you conclude a rerun is the right call, please suggest a realistic window for it, given that final exams start in three weeks and turnout would likely collapse after that.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Junior high school student, member of the Student Government Elections Board (5 members total).
      *   **Task:** Draft a written recommendation memo for the upcoming board meeting regarding a contested election.
      *   **Context:** Priya won by 41 votes (out of 590). Marcus (runner-up) filed a complaint.
      *   **Issues:**
          1.  *Micro-targeting:* Different promises to different groups (potentially contradictory).
          2.  *Timing/Editing:* Video released exactly when "no new material" rule started, using resequenced old clips of Marcus to imply he doesn't care about mental health (technically true, no new footage, but misleading context).
          3.  *Portal Positioning:* Used earlier filing to get top spot + countdown to surge early votes before others saw Marcus.
      *   **Constraints:**
          *   Max 1 page.
          *   Clear recommendation (Certify, Void/Rerun, or Middle Ground).
          *   Defend on merits (not precedent, as there is none).
          *   Propose 2-3 concrete bylaw criteria for future elections.
          *   Engage seriously with Priya's defense (truthfulness, standard campaign tactics).
          *   If rerun suggested, propose a realistic window (exams in 3 weeks).
      *   **Tone:** Professional, reasoned, fair, suitable for a high school student government board but serious enough for a faculty advisor to read aloud.

  2.  **Determine the Recommendation:**
      *   *Option A: Certify.* Hard to justify given the "manipulative practices" clause. The video editing and micro-targeting feel like they undermine informed consent.
      *   *Option B: Void/Rerun.* Strongest moral case, but disruptive. The margin (41 votes) is small enough that these tactics likely mattered.
      *   *Option C: Censure/Certify.* Weak enforcement. Doesn't fix the unfairness.
      *   *Decision:* **Void the election and order a rerun.** Why? The combination of tactics, especially the video timing and the contradictory promises, prevents voters from making an informed choice based on a coherent platform. The margin is tight (7%). The integrity of the process is more important than the schedule disruption.
      *   *Rerun Window:* Needs to be before exams. Voting takes a few days. Campaigning takes a week. Let's say 10 days.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly immediately.
      *   **Analysis of the Complaint (The Merits):**
          *   Address Priya's defense first (as requested). Acknowledge that technical compliance isn't the same as ethical compliance. Acknowledge that targeting is normal, but *contradictory* targeting is the issue.
          *   Address the Video. It's the strongest point for Marcus. "Technically compliant" but "substantively deceptive" due to timing and editing.
          *   Address the Portal/Timing. This is less egregious but contributes to the cumulative effect.
      *   **Conclusion on Current Election:** The "informed voter" standard was compromised. 41 votes is within the margin of error for these influences.
      *   **Bylaw Recommendations:** Need concrete criteria.
          1.  Define "Manipulative" regarding consistency (no contradictory promises to distinct groups).
          2.  Define "New Material" regarding context (editing existing footage to change meaning counts as new material).
          3.  Equalize visibility (randomize portal order or blind period).
      *   **Rerun Logistics:** Propose a timeline. Exams in 3 weeks. Need to finish voting before exam stress peaks.
      *   **Closing:** Reiterate commitment to fairness.

  4.  **Refining the Tone:**
      *   Avoid sounding like a lawyer (too stiff) or a friend (too casual).
      *   Ensure it sounds like a student leader who takes AP Gov seriously.
      *   Make sure the engagement with Priya's defense is charitable but firm. *Self-Correction:* I need to make sure I don't just say "she lied." I need to say "she created a fragmented reality."

  5.  **Drafting - Content Check:**
      *   *Page Limit:* Keep it tight. No fluff.
      *   *Priya's Defense:* Explicitly mention that targeted messaging is standard. Counter with the "coherent platform" argument.
      *   *Video:* Focus on the "no new material" loophole.
      *   *Bylaws:* Make them actionable.
      *   *Timeline:* 3 weeks until exams. Rerun needs to happen ASAP. Let's suggest voting concludes 1 week before exams.

  6.  **Writing the Memo (Iterative Process):**
      *   *Header:* To: Elections Board | From: [My Name] | Date: [Current Date] | Subject: Recommendation re: Presidential Election Complaint.
      *   *Recommendation:* Void results, schedule rerun.
      *   *Argument:* Start with the defense. Yes, she didn't lie. Yes, timing is strategy. *However*, the bylaws ban "manipulative practices."
      *   *Point 1 (Targeting):* It's not just targeting; it's contradictory promises. Voters can't hold a candidate accountable if the platform changes per audience.
      *   *Point 2 (Video):* This is the killer. Using the "no new material" rule as a shield for a hit piece released at the deadline prevents rebuttal. That violates the spirit of fair debate.
      *   *Point 3 (Portal):* Cumulative advantage.
      *   *Verdict:* 41 votes is too close to ignore this.
      *   *Bylaws:* 1. Platform Consistency. 2. Contextual Integrity (editing). 3. Blind Voting/Randomized Order.
      *   *Timeline:* Campaign 1 week, Vote 2 days. Finish 10 days from now. Before exams.

  7.  **Review against Constraints:**
      *   One page? (Will keep word count around 500-600).
      *   Clear resolution? (Void/Rerun).
      *   Merits over precedent? (Yes).
      *   Concrete criteria? (Yes).
      *   Engage Priya's defense? (Yes).
      *   Rerun window? (Yes).

  8.  **Final Polish:** Check for flow and persuasive language. Ensure the distinction between "vigorous persuasion" and "manipulation" is clear. (Self-Correction: Make sure the timeline is realistic. If exams are in 3 weeks, we have 2 weeks for campaigning and voting. That's tight but doable.)

  9.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **TO:** Student Government Elections Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Presidential Election Complaint

  **Recommendation**
  I recommend that the Board **void the current election results** and order an immediate rerun. While no single action by the winning campaign was explicitly prohibited by the letter of our bylaws, the cumulative effect of these tactics violates the spirit of our ban on "manipulative practices." Certifying this result would establish a precedent that technical compliance justifies undermining informed consent.

  **Analysis of Merits**
  We must engage seriously with Priya's defense: she made no false statements, targeted messaging is standard political strategy, and she exploited rules regarding timing and filing exactly as written. In a vacuum, vigorous persuasion should be protected. However, our bylaws distinguish persuasion from manipulation.

  1.  **Fragmented Platforms:** Targeting demographics is legitimate; presenting contradictory platforms to different groups is not. If a candidate promises Group A they will cut homework and Group B they will extend study halls, they are not persuading voters on a coherent record but manufacturing consent through omission. This prevents voters from holding the winner accountable to a single standard.
  2.  **The "No New Material" Loophole:** The mental health video is the critical failure point. While the footage was archival, the *narrative* was new. Releasing a resequenced, contextualized attack piece the moment the rebuttal window closed technically obeyed the "no new material" rule but effectively silenced the opponent. This is procedural manipulation, not persuasion.
  3.  **Portal Positioning:** While filing early is strategic, combining top-billing with a countdown to surge votes before opponents are viewed exploits the interface design rather than voter preference.

  The margin of victory was 41 votes (approx. 7%). Given the targeted nature of the messaging and the suppressed rebuttal window, we cannot confidently assert that the result reflects the will of the student body based on accurate information.

  **Proposed Bylaw Criteria**
  To prevent future ambiguity, I propose we adopt the following definitions for the next cycle:
  *   **Platform Consistency:** Candidates must publish a single, written platform document accessible to all voters. Deviations from this document in private or targeted communications that create material contradictions constitute manipulation.
  *   **Contextual Integrity:** "Campaign Material" includes any edited compilation of existing footage where the sequencing or audio alters the original context. Such material is subject to the same blackout windows as new footage.
  *   **Equal Visibility:** The voting portal must randomize candidate order for each user or enforce a 12-hour "blind period" after polls open where vote totals and candidate order are hidden to prevent bandwagon surges.

  **Rerun Timeline**
  With final exams beginning in three weeks, we must act immediately to preserve turnout.
  *   **Campaign Period:** 5 days (starting Monday).
  *   **Voting Window:** 2 days (Thursday–Friday of next week).
  *   **Certification:** Before homeroom the following Monday.

  This schedule concludes the process ten days before exams, minimizing academic conflict while ensuring the new administration has legitimacy. We have a duty to protect the integrity of the vote over the convenience of the schedule.

  **Resolution:** Void results; schedule rerun for next week; adopt proposed criteria for future elections.
