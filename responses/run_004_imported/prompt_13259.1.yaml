      *   **Part 1: The Negation Test (Truth-Conditions vs. Something Else):**
          *   Explain "Truth-Conditional Meaning" simply (what makes a sentence true or false).
          *   Explain how negation usually works (canceling the claim). Example: "The cat is not on the mat."
          *   Apply to "Jerk": "John is not a jerk." If John isn't a jerk, the sentence is true and harmless. The insult is part of the truth condition.
