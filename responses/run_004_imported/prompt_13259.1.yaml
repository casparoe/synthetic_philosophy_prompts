      *   There are two main camps in the philosophy of language regarding slurs:
          *   **Semantic View (Truth-Conditional):** The offensiveness is part of the literal meaning (truth conditions).
          *   **Pragmatic View (Non-Truth-Conditional):** The offensiveness is conveyed via implicature, presupposition, or expressivism.
      *   The user's observation (negation doesn't cancel the offense) is the primary argument *against* the Semantic View and *for* the Pragmatic View (specifically Presupposition or Expressivism).
      *   Reclamation is a related but distinct issue, often involving appropriation and changing the expressive content.

