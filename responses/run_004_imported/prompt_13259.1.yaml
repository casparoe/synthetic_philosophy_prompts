          *   *Option C: Expressivism (The leading view).* The word doesn't just describe; it *performs* an attitude.
              *   Analogy: "Ouch!" or "Boo!"
              *   When you say the slur, you are expressing contempt, regardless of whether you are affirming or denying the category.
              *   This explains why "Not a [slur]" still stings: you still expressed the attitude of contempt by invoking the term.
          *   *Option D: Implicature (Gricean).* The offense is implied.
              *   *Problem:* Implicatures usually *can* be cancelled by negation. So this is less popular for slurs than Expressivism/Presupposition.

      *   **Part 3: Why does this matter? (Semantic vs. Pragmatic):**
