      *   *Nuance:* Be careful not to conflate "Absolute Space" (the container) with "Absolute Motion" (invariant acceleration). Newton needs the former to make sense of the latter, but modern geometry (Galilean spacetime) allows absolute acceleration without a "container" in the naive sense.
