  so in my classical indian phil seminar we just wrapped the pramana unit and I can't stop thinking about the svatah-pramanya vs paratah-pramanya fight between the Naiyayikas and the Bhatta Mimamsakas. Kumarila's side says a cognition's validity is self-certifying (svatah) by default and only invalidity needs to be established by something further, while the Naiyayikas say validity itself always has to be certified by a separate cognition (paratah), usually via successful practical activity or by checking that the causal conditions werent defective. can you write me an essay that actually weighs the infinite regress objection to the paratah side against the "how do you even tell error from veridical cognition from the inside" objection to the svatah side (think the classic case of mistaking a shell for silver), and then commits to an actual verdict instead of just saying its complicated? a hybrid position is fine as long as you argue for it, just don't cop out with a non-answer. doesnt need to be super long, just needs to actually take a stand.
