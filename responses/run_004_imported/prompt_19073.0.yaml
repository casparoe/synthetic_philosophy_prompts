answer: |-
  **The Burden of Proof: Why Nyāya Externalism Defeats Mīmāṃsā Intrinsicism**

  The debate between the Bhāṭṭa Mīmāṃsakas and the Naiyāyikas regarding *prāmāṇya* (validity) is not merely a technical dispute over epistemic mechanics; it is a fundamental disagreement about the default stance of human consciousness toward the world. Kumārila's Mīmāṃsā argues for *svataḥ-prāmāṇya*: a cognition is valid by default, self-certifying, and only invalidated by external defects (*doṣa*). The Nyāya school, conversely, argues for *parataḥ-prāmāṇya*: validity is extrinsic, requiring certification by a subsequent cognition or successful activity. While Mīmāṃsā offers a compelling phenomenological account of belief, Nyāya provides the only viable epistemology. When weighing the infinite regress objection against Nyāya against the indistinguishability-of-error objection against Mīmāṃsā, the latter proves fatal. Nyāya's externalism wins because it alone can distinguish truth from falsehood without collapsing into skepticism, provided we understand its solution to the regress not as a chain of cognitions, but as a termination in practical reality.

  The Mīmāṃsā position is intuitively attractive because it mirrors the psychology of belief. When I see a cup, I do not hesitate; I simply believe there is a cup. Kumārila argues that if every cognition required a second cognition to validate it, we would face an infinite regress (*anavasthā*). We would never act, trapped in a hall of mirrors checking our checks. By positing validity as intrinsic, Mīmāṃsā secures a foundation for action. However, this strength crumbles when confronted with the problem of error, specifically the classic case of mistaking a shell for silver (*śukti-rajata*).

  In the shell-silver scenario, the erroneous cognition arises with the same phenomenological force as a veridical one. From the "inside," the silver looks real. If validity is intrinsic (*svataḥ*), the cognition *should* carry the mark of truth. But it doesn't. The Mīmāṃsaka must argue that the cognition is intrinsically valid until a defect is discovered. But this is semantically slippery. If I act on the cognition and fail to pick up silver, the cognition is proven false. Mīmāṃsā claims this invalidity is *parataḥ* (caused by external defects like distance or bad light). But the crucial question is: *How do I know I am in a defect-condition from the inside?* I cannot. If I cannot distinguish the shell-silver cognition from real-silver cognition at the moment of arising, then *svataḥ-prāmāṇya* offers no epistemic security. It grants a presumption of truth that is undetectably fragile. An epistemology that cannot, even in principle, differentiate veridical perception from hallucination at the point of origin is not an epistemology; it is a description of dogmatism.

  The Naiyāyikas, recognizing this danger, insist that validity must be certified externally (*parataḥ*). We know the water is real not because the vision feels true, but because drinking it quenches thirst (*samvādi pravṛtti*). The obvious objection here is the infinite regress. If Cognition A requires Cognition B to validate it, what validates Cognition B? If the answer is Cognition C, we never reach certainty.

  However, this objection relies on a category error. Nyāya does not claim that every validation requires an infinite chain of *cognitions*. The regress stops at successful practical activity. When I reach for the water and my thirst is quenched, the validation is not another mental state requiring verification; it is a brute causal interaction with the world. The "success" is not a cognition that needs validating; it is a state of affairs. Gaṅgeśa and the Navya-Nyāya tradition refine this by noting that we do not need to validate every trivial cognition (like seeing a pot) in daily life; we only seek validation when doubt arises. But when doubt *does* arise, the only way to resolve it is external. The regress objection assumes a coherentist trap, but Nyāya is fundamentally externalist and pragmatist. The chain ends where the mind meets the world.

  Therefore, the verdict must favor Nyāya. The Mīmāṃsaka's regress objection is logical, but the Naiyāyika's error objection is existential. A logical puzzle about infinite chains can be solved by redefining the terminus of the chain (as Nyāya does with action). But the inability to distinguish error from truth is a system-crashing bug. If *svataḥ-prāmāṇya* is true, then error is inexplicable, because error presents itself as truth. Mīmāṃsā tries to patch this by saying defects cause invalidity, but since defects are often invisible to the cognizer, the system leaves the agent trapped in subjective certainty.

  Nyāya accepts the burden of proof. It admits that we are not self-certifying machines. It demands that truth be earned through causal coherence and practical efficacy. This is a harder standard, but it is the only one that allows for the correction of error. We can accept a modified hybrid position: phenomenologically, we operate as Mīmāṃsakas (trusting our senses by default to function), but epistemologically, we must be Naiyāyikas. When asked to define *knowledge* rather than *belief*, the Mīmāṃsā position fails. Knowledge requires a link to reality that cannot be guaranteed from the inside.

  Ultimately, the *parataḥ* theory prevails because it acknowledges that truth is not a property of the mind's glow, but of the mind's fit with the world. The infinite regress is a price worth paying for an epistemology that can actually tell the difference between silver and a shell. Mīmāṃsā saves us from skepticism by ignoring the possibility of error; Nyāya saves us from error by risking the hard work of verification. In a seminar on *pramāṇa*, the latter is the only defensible standard for knowledge.
