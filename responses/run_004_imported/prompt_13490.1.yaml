answer: |-
  This is a classic problem in **mechanism design**, and it's a fantastic real-world example to keep in mind for your seminar.

  The short answer is: **Your sister (the mom) is right that a standing rule is possible, but the skeptical nephew is right that a *fixed allocation* rule is a trap.**

  The solution lies in distinguishing between a rule that dictates the **outcome** (e.g., "Nephew A always gets July") versus a rule that dictates the **process** (e.g., "Here is the fair algorithm we use every year to decide who gets July").

  The nephew is afraid of an *allocative* rule because it ignores future information asymmetry (work schedules). Your sister wants a *procedural* rule to reduce transaction costs (the exhausting negotiation). You can satisfy both by designing a mechanism that is **incentive-compatible**—meaning it makes it in their best interest to be honest about their schedules without needing to trust each other.

  Here is a breakdown of why the nephew is worried, and a specific "standing rule" design that solves it.

  ### 1. Why the Nephew is Half-Right
  The nephew is objecting to a **static partition**. If they sign a contract today saying "You get the first two weeks of August forever," he is absolutely correct: that is inefficient. In five years, he might have a newborn and need June, while his brother has a job that requires travel in August. A static split locks them into inefficiency and guarantees resentment.

  However, he is wrong to think that *all* standing rules are static allocations. A standing rule can be a **dynamic procedure**.

  ### 2. The Core Problem: Information Asymmetry & Trust
  The annual fight happens because of "cheap talk."
  *   **Nephew A says:** "I really need Week 4, my work schedule is rigid."
  *   **Nephew B thinks:** "He's bluffing. He just wants the prime week. If I push back, he'll cave."

  Because neither can verify the other's work flexibility, they treat the negotiation as a poker game rather than a logistics problem. To stop the fighting, you need a mechanism that makes bluffing **costly**.

  ### 3. The Solution: A "Serpentine Draft with Teeth"
  Instead of assigning weeks, assign **priority**. Here is a specific standing rule your sister could propose that protects both sides:

  **A. The Serpentine Draft (Fairness)**
  Every spring (e.g., March 1st), they hold a draft for the summer weeks.
  *   **Year 1:** Nephew A picks first, Nephew B picks second.
  *   **Year 2:** Nephew B picks first, Nephew A picks second.
  *   *(Or use a serpentine order: A-B-B-A for the weeks, then flip the order next year.)*

  This solves the long-term fairness issue. Neither is permanently locked out of prime weeks.

  **B. The "Use-It-or-Lose-It" Clause (Incentive Compatibility)**
  This is the critical part that addresses the nephew's trust issue.
  *   **Rule:** If you draft a week, you must use it.
  *   **Penalty:** If you draft a week and then cancel (without offering it to the other nephew first), you incur a penalty.
  *   **The Penalty:** You lose your first-round draft pick the following year.

  **Why this works:**
  This removes the ability to bluff. If Nephew A claims he "needs" Week 4 but is actually just hoarding it to keep B out, A now faces a risk. If his work schedule *does* change and he can't go, he suffers a penalty (losing priority next year). This forces him to only draft weeks he is **highly confident** he can use. It aligns his private incentive (getting the week) with the social goal (efficient use of the cabin).

  **C. The Right of First Refusal (Efficiency)**
  If the owner of a week realizes they cannot go, they *must* offer it to the other nephew before leaving it empty or renting it to an outsider. This ensures the cabin is used by the family (which is usually the goal of inheritance) without requiring a new negotiation.

  ### 4. Why This is "Safe" for the Skeptical Nephew
  The nephew's fear was: *"What if the rule locks me out of weeks I need in the future?"*

  Under this **Procedural Rule**:
  1.  **Flexibility is preserved:** He isn't locked into specific weeks forever. Every year, the draft reflects that year's actual work schedules.
  2.  **Trust is not required:** He doesn't need to believe his brother's story about work flexibility. The penalty clause ensures his brother won't hoard weeks he doesn't actually need.
  3.  **Ex-Post Efficiency:** The weeks go to the person who values them most *that specific year*, because the person who values them most will be willing to risk the penalty to draft them.

  ### 5. The "Nuclear Option" (Buyout Clause)
  If they want to be truly sophisticated, they can add a **buyout clause** to the standing rule.
  *   Either nephew can offer to buy the other's share at a pre-agreed valuation formula (e.g., average of three appraisals).
  *   If the offer is made, the other nephew must either sell or buy the offeror out at the same price.

  This is the ultimate efficiency mechanism. If one nephew values the cabin significantly more (perhaps he lives closer, or has more flexible work forever), the market will reveal that, and the cabin ends up with the person who gets the most utility from it, while the other gets cash. Often, just having this clause on the table makes people behave more reasonably in the draft because they realize the asset has a liquid cash value.

  ### Summary for Your Sister
  Tell her the nephew is right to reject a **fixed schedule**, but wrong to reject a **fixed process**.

  She should propose a **Standing Procedural Agreement**:
  1.  **Alternating Draft Priority** (solves long-term fairness).
  2.  **Penalty for Non-Use** (solves the trust/bluffing problem).
  3.  **Right of First Refusal** (solves last-minute cancellations).

  This creates a "safe" standing rule that adapts to changing work schedules while removing the need for annual trust-based negotiations. It turns a relationship problem into an administrative one.
