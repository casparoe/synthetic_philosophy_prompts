answer: |-
  1. **The Unified Principle**
  You argue that *De Regimine Principum* and the *Summa*'s treatment of sedition are applications of a single principle rather than a tension. To test that unity: what is the specific normative rule that generates *both* the claim that the tyrant is the true seditious party *and* the prohibition on private individuals removing him? Is it a rule about *justice* (what is owed to the tyrant) or *prudence* (what consequences follow removal)?

  *   **Follow-up:** If you say it is a rule of prudence regarding consequences, does that not render the prohibition contingent on historical circumstance rather than a binding moral principle? And if it is a rule of justice, how can a man who is "seditious" against the common good retain a claim of justice against those defending that same good?

  2. **The Principal-Agent Problem**
  Aquinas suggests a tyrant forfeits his title to rule by seeking private gain over the common good. If we view rulership as a principal-agent relationship where the community is the principal and the ruler is the agent, why should the remedy for an agent diverting the principal's assets be reserved for a "higher public authority"? If the agent has already voided the contract by acting ultra vires, why isn't any citizen, as a stakeholder in the common good, empowered to terminate the agency?

  *   **Follow-up:** You will likely reply that only the "whole community" or a superior can act to avoid factionalism. But if the tyrant has already fractured the community by ruling for private gain, what mechanism exists for the community to act as a "public authority" without relying on the very private individuals you forbid from acting?

  3. **Instrumental vs. Terminal Objections**
  Much of Aquinas's warning against tyrannicide rests on the risk of factional chaos or the emergence of a worse successor. Does this make his opposition to private tyrannicide *instrumental* (it usually leads to bad outcomes) rather than *terminal* (it is intrinsically evil)? If a cleanly executed removal guaranteed a stable, virtuous successor, would the "careful lawyer" still object, or does the risk of chaos exhaust his moral objection?

  *   **Follow-up:** If you insist the objection is terminal regardless of outcomes, why does the *Summa* focus so heavily on the *disturbance of the multitude* as the defining harm of sedition? Does that not imply that if the multitude is not disturbed, the moral calculus changes?

  4. **The Usurper Distinction**
  Your unified reading relies on the nature of tyranny itself. Yet Aquinas elsewhere distinguishes between a usurper who never held legitimate title and a rightful ruler who becomes tyrannical. If the "unified principle" is about the *common good* being violated, why does the origin of the rule matter? Does your reading not undercut itself by failing to sharply distinguish the usurper (who has no title to forfeit) from the legitimate ruler turned tyrant (who does)?

  *   **Follow-up:** If you argue Aquinas treats them differently procedurally but not morally, does that not admit that the "public authority" requirement is merely a procedural hurdle for the legitimate ruler, rather than a metaphysical constraint on who may defend the common good?

  5. **The "Lawyer, Not Revolutionary" Defense**
  Your stock response is that Aquinas was "a careful lawyer, not a revolutionary." But natural law theory posits that when positive law fails, we fall back on the law of reason. If the "lawyer" is insisting on legal procedure in a situation where the law itself is the weapon of the tyrant, is he not prioritizing *legalism* over *law*? At what point does adherence to procedure become complicity in the injustice the procedure was meant to prevent?

  *   **Follow-up:** If you counter that natural law *includes* the requirement for order, I would ask: whose order? If the tyrant's order is inherently disordered with respect to the common good, does preserving the *form* of authority satisfy natural law while violating its *end*?

  6. **The Ontology of "Public Authority"**
  When Aquinas reserves the right of removal to "public authority," what is the ontological status of that authority in a tyranny? Is it a metaphysical entity that persists even when the institutions are corrupted, or is it embodied in actual people? If it is embodied in people, why are those people morally incapacitated from acting when the head is rotten? If it is metaphysical, how does it act without human hands?

  *   **Follow-up:** If you argue it resides in the "community as a whole," does that not effectively license a coordinated private action, provided it is sufficiently broad? Where is the line between a "faction" and the "public" if not in the number of swords drawn?

  7. **Sedition and the Definition of Peace**
  In II-II, q. 42, Aquinas argues the tyrant is seditious because he fosters discord to maintain power. But if "peace" is defined as the tranquility of order, and the tyrant's order is a tranquility of fear, is removing him an act of sedition or an act of restoration? If the tyrant is the author of the discord, does stopping him not cease the sedition rather than perpetuate it?

  *   **Follow-up:** You will likely say that the *act* of removal introduces uncertainty. But is the uncertainty of a transition morally weightier than the certainty of ongoing injustice? Why does the "lawyer" privilege stability over rectification?

  8. **Teleology and the Common Good**
  Aquinas is a teleologist; the end of government is the common good. If the government actively destroys that end, does the means of removing it not become subordinate to the restoration of the end? Does your unified reading not risk inverting Aquinas's teleology by making the *preservation of the governing structure* a higher good than the *common good* that structure was meant to serve?

  *   **Follow-up:** If you deny this inversion, you must explain why the structure is preserved when its function is nullified. Is the "careful lawyer" protecting the client (the people) or the firm (the monarchy)?

  9. **Prudence vs. Doctrine**
  Is Aquinas's caution against tyrannicide a matter of universal moral doctrine or contingent political prudence given the 13th-century context? If it is prudence, it may not bind us in modern contexts with different institutional safeguards. If it is doctrine, it must hold even when the prudential risks are minimized. Which is it?

  *   **Follow-up:** If you say it is doctrine, you must defend the intrinsic evil of removal regardless of consequence. If you say prudence, you concede that a "revolutionary" reading is valid whenever the prudential calculus shifts. Can you sustain the unified reading if the prudential calculus changes?

  10. **The Mariana Test**
  Finally, Juan de Mariana, a later Scholastic, invoked Aquinas to license private tyrannicide under specific conditions. Was Mariana extending Aquinas's logic to its necessary conclusion regarding the forfeiture of title, or did he fundamentally break with the Thomistic tradition? If he broke with it, where exactly does his reasoning diverge from the "unified principle" you defend?

  *   **Follow-up:** If you argue Mariana broke with Aquinas, are you not admitting that the "unified reading" requires suppressing the more radical implications of Aquinas's own premises regarding tyranny and the common good?
