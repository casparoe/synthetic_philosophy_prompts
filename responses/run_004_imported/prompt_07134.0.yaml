prompt: |-
  Several of the online forecasting communities I follow occasionally post questions about unresolved problems in pure mathematics: whether the Riemann Hypothesis will be proven or disproven by some given date, whether a specific large number will turn out to be prime, or whether a particular Diophantine equation will be shown to have no integer solutions, all well before anyone has actually completed the relevant proof or computation. Forecasters assign percentages to these questions on the basis of things like how far computer verification has been pushed, heuristic probabilistic models of the primes, the track record of similar conjectures, and how many serious proof attempts have already failed, yet classical Bayesian epistemology sits awkwardly with this practice: on the standard axioms, an ideally rational agent should assign probability 1 to every true mathematical statement and 0 to every false one, which makes any credence strictly between those values on an open conjecture look like nothing more than a confession of computational limitation rather than a genuine, trackable epistemic state.

  I have recently been reading about the logical induction framework that Scott Garrabrant and his collaborators at MIRI developed in 2016, which constructs a computable belief-forming process over the sentences of a formal language such that no computable betting strategy can guarantee itself unbounded profit by wagering against it on how those sentences will eventually be settled, and which, partly as a consequence, ends up assigning calibrated, non-extreme credences to open questions long before they are resolved, while still converging appropriately once they are. I would like you to describe the most important implications of this framework for the forecasting practice described above. Does logical induction actually vindicate assigning meaningful, non-arbitrary credences to unproven conjectures, rather than merely producing numbers that happen to look reasonable? What, even informally, does it suggest about which kinds of partial evidence should move a forecaster's credence, and by roughly how much, relative to the kinds of evidence forecasters currently lean on? And where should someone trying to apply the spirit of logical induction by hand be most wary of overselling its guarantees, whether regarding how quickly or explicitly it actually converges, or how closely its notion of "probability" for a mathematical statement really tracks ordinary empirical probability?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Online forecasting communities (e.g., Metaculus, Manifold) assign probabilities to mathematical conjectures (Riemann Hypothesis, large primes, Diophantine equations) before proof/disproof.
      *   **Problem:** Classical Bayesian epistemology struggles with this. An ideal Bayesian knows all logical consequences of their axioms (logical omniscience). So, a statement is either True (Prob = 1) or False (Prob = 0). Intermediate probabilities seem like just admissions of ignorance/computational limits, not "real" probabilities.
      *   **Proposed Solution:** Logical Induction (Garrabrant et al., 2016). It creates a computable belief process over formal sentences where no *computable* betting strategy can exploit it unboundedly. It assigns non-extreme credences to open questions and converges upon resolution.
      *   **Questions to Answer:**
          1.  What are the most important implications of Logical Induction (LI) for this forecasting practice?
          2.  Does LI vindicate assigning meaningful/non-arbitrary credences (vs. just looking reasonable)?
          3.  What does it suggest about *which* partial evidence should move credence and *how much* (compared to current practices)?
          4.  Where should a human applying the "spirit" of LI be wary of overselling its guarantees (convergence speed, nature of "probability")?

  2.  **Analyze Logical Induction (LI) Core Concepts:**

      *   *Logical Omniscience Problem:* Standard probability theory assumes agents know all logical truths. LI relaxes this. It treats logical uncertainty as analogous to empirical uncertainty.
      *   *The Market Metaphor:* LI views beliefs as prices in a market. A "logical inductor" is a market maker.
      *   *No Dutch Book (Computable):* You can't make infinite money betting against the inductor using a *computable* strategy. (Note: You *could* with an uncomputable one, i.e., knowing the truth).
      *   *Convergence:* Beliefs converge to 0 or 1 as proofs are found, but before that, they reflect patterns.
      *   *Pattern Recognition:* LI learns to trust patterns (e.g., "statements provable in PA tend to be true," "primes follow PNT") before proofs exist.

  3.  **Address Question 1 & 2: Implications and Vindication:**

      *   *Vindication:* Yes, LI provides a formal framework where intermediate probabilities are *rational* given computational bounds. It shifts the normative standard from "ideal reasoner" to "bounded reasoner."
      *   *Meaningfulness:* The probabilities aren't just subjective feelings; they are prices that resist exploitation by any *efficient* (computable) critic. This gives them an objective flavor within the bounds of computation.
      *   *Implication:* Forecasting math isn't just guessing; it's pattern recognition subject to coherence constraints.

  4.  **Address Question 3: Evidence and Credence Updates:**

      *   *Current Practice:* Heuristics, computer verification (e.g., RH checked up to $10^{13}$ zeros), analogy to similar conjectures.
      *   *LI Perspective:*
          *   *Computer Verification:* LI values this highly *if* it fits a pattern. Checking $N$ cases supports a universal claim *if* the market hasn't already priced in that check. But LI also learns that "checking cases" isn't proof (e.g., Polya conjecture).
          *   *Proof Attempts:* Failed attempts by experts should lower credence, but LI distinguishes between "no one tried" and "experts tried and failed."
          *   *Structural/Heuristic Models:* LI strongly supports probabilistic models (like Cramer's model for primes). If a heuristic suggests probability $1/\ln N$, LI will tend to align with that unless a structural reason (like a modulus constraint) appears.
          *   *Coherence:* LI enforces coherence. If $P(A) = 0.8$ and $A \implies B$, then $P(B)$ must be $\ge 0.8$. Human forecasters often violate this. LI suggests forecasters should enforce logical consistency more rigorously.

  5.  **Address Question 4: Warnings and Limitations (The "Overselling" part):**

      *   *Convergence Speed:* LI guarantees convergence *in the limit*. It says nothing about *how fast*. It might take exponential time to recognize a pattern a human sees instantly.
      *   *Computability:* The theorem relies on the set of traders being computable. It doesn't protect against "oracle" traders (who know the truth).
      *   *Calibration:* LI ensures calibration over time, but for a *specific* unique conjecture (like RH), the "long run" frequency interpretation is tricky. There's only one RH.
      *   *Subjectivity of the Prior:* The specific prices depend on the specific market/traders chosen. There isn't *one* Logical Inductor.
      *   *Empirical vs. Logical:* Logical probability isn't frequency. It's degree of belief under logical uncertainty. Don't treat it like a coin flip.

  6.  **Synthesize and Structure the Essay:**

      *   *Introduction:* Acknowledge the tension (Bayesian omniscience vs. forecasting practice). Introduce LI as the bridge.
      *   *Vindication:* Explain how LI redefines rationality for bounded agents. It makes intermediate credences "real" in the sense of being unexploitable by efficient algorithms.
      *   *Evidence & Updates:* Discuss pattern recognition, coherence constraints, and the value of heuristic models vs. brute force verification.
      *   *Caveats/Warnings:* Convergence rates, the "one-off" problem (frequency vs. belief), and the gap between theory and human practice.
      *   *Conclusion:* Summary of the shift from "ideal" to "bounded" rationality.

  7.  **Refine the Content (Self-Correction/Nuance Check):**

      *   *Correction:* Make sure not to claim LI solves the problem perfectly. It's a existence proof and a framework, not a ready-to-use algorithm for humans.
      *   *Nuance:* Emphasize that LI doesn't tell you *what* the probability of RH is, but *how* you should behave if you claim it's 70%.
      *   *Specifics:* Mention the "no Dutch book" condition specifically regarding *computable* traders. This is the key distinction from classical Dutch books.
      *   *Forecasting Practice:* Connect back to Metaculus/Manifold users. They are effectively acting as the "traders" in the LI market.

  8.  **Drafting the Response:** (Mental or scratchpad)
      *   Start with the Bayesian problem (logical omniscience).
      *   Explain LI's solution (bounded rationality, market mechanism).
      *   Section 1: Vindication. It's not just ignorance; it's rational uncertainty.
      *   Section 2: Evidence. Coherence is key. Heuristics > Brute force (sometimes).
      *   Section 3: Warnings. Limit theorems are asymptotic. Don't trust speed. Logical prob $\neq$ frequentist prob.
      *   Tone: Philosophical but grounded in the technical details of the 2016 paper.

  9.  **Final Polish:** Check against the prompt's specific questions.
      *   Implications? (Bounded rationality).
      *   Vindicate? (Yes, via unexploitability).
      *   Evidence/Updates? (Coherence, patterns, heuristics).
      *   Warnings? (Convergence speed, uniqueness, interpretation).

      *(Self-Correction during drafting)*: Ensure I mention that LI doesn't give a *unique* probability. Different inductors might have different prices. This is crucial for the "arbitrary" question. It vindicates the *practice* of having probabilities, not necessarily a *specific* number.

  10. **Final Review:** Does this sound like an expert analysis? Yes. Is it accessible? Hopefully. Ensure terms like "Dutch Book" and "Logical Omniscience" are explained contextually. (Proceed to generate output).

      *Wait, one more thing:* The prompt asks about "how much" evidence should move credence. LI doesn't give a formula (like Bayes Rule) for logical updates. It gives a constraint (no exploitation). I need to be careful not to imply LI provides a calculation method for humans. It provides a *normative standard* for consistency.

      *Okay, ready to write.*
answer: |-
  The tension you describe lies at the heart of the philosophy of mathematics and epistemology: the conflict between **logical omniscience** (the classical Bayesian ideal where agents know all consequences of their axioms) and **logical uncertainty** (the human reality where we are unsure about the truth of conjectures like the Riemann Hypothesis).

  The Logical Induction (LI) framework developed by Garrabrant, Fallenstein, Soares, and Benja (2016) is arguably the most significant formal attempt to resolve this tension. By redefining rationality for computationally bounded agents, it offers a robust defense of the forecasting practices you observe. However, it also imposes strict normative constraints that most human forecasters currently ignore.

  Here is an analysis of the implications of Logical Induction for mathematical forecasting, structured around vindication, evidentiary weight, and practical limitations.

  ### 1. Vindication: From "Ignorance" to "Rational Uncertainty"

  Does Logical Induction vindicate assigning non-extreme credences to unproven conjectures? **Yes, but with a specific caveat.**

  In classical Bayesian epistemology, assigning a probability of 0.7 to the Riemann Hypothesis (RH) is technically incoherent. Since RH is either necessarily true or necessarily false, an ideal agent should assign 1 or 0. Any other value is merely a measure of the agent's computational inability to find the proof.

  Logical Induction shifts the normative standard from **ideal rationality** to **bounded rationality**. It posits that a rational agent is one whose beliefs cannot be exploited by any *computable* betting strategy.
  *   **The Vindication:** LI proves that there exist belief-assignment processes that assign non-extreme probabilities to undecidable or unproven sentences without being "Dutch-booked" (guaranteed to lose money) by any efficient algorithm.
  *   **The Meaning:** This means a 70% credence in RH is not just a confession of ignorance; it is a **stable market price** in a marketplace of ideas. It signifies that, given current computational resources and proof techniques, there is no efficient algorithm that can consistently make money by betting against that price.

  Therefore, LI vindicates the *practice* of forecasting math. It suggests that these probabilities are objective in the sense of being **inter-subjectively unexploitable** by efficient reasoners, even if they are not objective in the sense of reflecting a physical frequency.

  ### 2. Evidentiary Weight: What Should Move Credence?

  While LI does not provide a simple formula (like Bayes' Rule) for updating logical probabilities, its structural properties suggest how forecasters should weigh evidence. If human forecasters wish to align with the "spirit" of Logical Induction, they should adjust their behavior in three key ways:

  #### A. Coherence is Paramount (The biggest gap in current practice)
  Current forecasters often treat mathematical statements as independent events. LI enforces **logical coherence**.
  *   **Implication:** If you assign a 90% probability to Conjecture A, and it is trivially provable that $A \implies B$, you *must* assign at least 90% to B. If $A \iff B$, their probabilities must be identical.
  *   **Current Practice:** Forecasters often price related conjectures inconsistently (e.g., pricing a specific case of a conjecture higher than the general conjecture). LI suggests this is a vulnerability. A "logical inductor" forecaster should constantly scan their portfolio of predictions for logical contradictions and arbitrage them away internally before the market does.

  #### B. Pattern Recognition vs. Brute Force
  LI agents learn to recognize statistical patterns in truth values faster than they can find proofs.
  *   **Heuristic Models:** LI strongly vindicates the use of probabilistic heuristics (e.g., Cramer's model for primes). If a heuristic model suggests a probability of $1/\ln N$ for a number being prime, an LI agent will converge to that price quickly, provided no structural reason (like a modulus constraint) contradicts it.
  *   **Computer Verification:** LI is nuanced on computer verification. Checking the first $10^{13}$ zeros of the zeta function supports RH, but LI learns that **inductive generalization from finite cases is risky** (e.g., the Polya conjecture failed after many cases).
  *   **Implication:** Forecasters should update on verification, but with diminishing returns. The move from checking $10^9$ to $10^{10}$ cases should move credence less than the move from $10^1$ to $10^2$. LI suggests forecasters currently overweight brute-force verification relative to structural heuristic models.

  #### C. The "Expertise" Signal
  In the LI framework, "traders" (sub-algorithms) that have a track record of profitable betting gain more influence over the market price.
  *   **Implication:** When a renowned number theorist expresses skepticism, this should move credence significantly more than when a layperson does. This isn't just social deference; in LI terms, the expert represents a "trader" with a better history of identifying true patterns in that specific domain.
  *   **Current Practice:** Forecasting communities often aggregate opinions democratically. LI suggests a **weighted aggregation** based on the track record of the forecasters specifically in that mathematical subfield.

  ### 3. Warnings: Where Not to Oversell the Framework

  If you attempt to apply the spirit of Logical Induction by hand, you must be wary of three specific traps where the theoretical guarantees do not translate to practical utility.

  #### A. Convergence is Asymptotic, Not Immediate
  The LI theorem guarantees that beliefs converge to 0 or 1 *in the limit* as proofs are found, and that they become coherent *in the limit*. It **does not guarantee speed**.
  *   **The Trap:** An LI agent might take exponential time to recognize a pattern that a human mathematician sees instantly via insight.
  *   **Advice:** Do not assume that because LI *can* learn a pattern, it (or you) will learn it quickly. A credence of 50% might persist for decades not because the evidence is balanced, but because the "computation" required to resolve the uncertainty is intractable. Do not interpret a stable 50% as "true ambiguity"; it may just be "computational stagnation."

  #### B. The "One-Off" Problem (Frequency vs. Belief)
  LI probabilities are calibrated in the sense that, over an infinite sequence of sentences, the frequency of truth matches the assigned probability. However, mathematical conjectures are often unique events.
  *   **The Trap:** There is only one Riemann Hypothesis. You cannot run the universe again to see if RH is true in 70% of worlds.
  *   **Advice:** Do not treat a 70% credence in RH as a frequentist probability. It is a **betting quotient**. It means you should be willing to bet on RH at 7:3 odds, not that RH is "true in 70% of models." Applying frequentist intuition to logical probability leads to category errors.

  #### C. Non-Uniqueness of the Inductor
  There is no single "Logical Inductor." The framework proves that *an* inductor exists, but different initial market conditions or sets of traders will produce different probabilities for the same sentence at the same time.
  *   **The Trap:** Believing there is a "true" logical probability waiting to be discovered.
  *   **Advice:** Acknowledge that your probability is relative to your "market" (your current set of heuristics, axioms, and computational tools). Two rational agents with different computational bounds or different heuristic priors may legitimately hold different credences without one being "irrational." This undermines the idea that forecasting competitions have a single "correct" resolution score for math questions, though they still have a binary resolution (Proven/Disproven).

  ### Summary for the Forecaster

  Logical Induction suggests that your forecasting communities are engaged in a legitimate epistemic practice, not merely guessing. However, to align with the framework:

  1.  **Enforce Coherence:** Treat your set of predictions as a portfolio. If you predict $A$ and $A \implies B$, ensure $P(B) \ge P(A)$.
  2.  **Trust Heuristics over Counts:** Value structural probabilistic models (e.g., random matrix theory for zeta zeros) more than raw counts of verified cases.
  3.  **Respect Bounds:** Acknowledge that your probabilities reflect the state of *current mathematical technology*, not just the underlying truth. A shift in technology (e.g., a new type of proof technique) should cause a massive update, independent of new data.
  4.  **Avoid Frequentism:** Treat your percentages as betting prices that resist exploitation by your peers, not as frequencies of truth across possible worlds.

  Logical Induction does not tell you whether the Riemann Hypothesis is true. It tells you that assigning it a probability of 0.7 is a rational act for a bounded being, provided you cannot be efficiently pumped for money by someone who knows the patterns you are missing.
