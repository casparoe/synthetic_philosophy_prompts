      *   **Brandt (Cognitive Psychotherapy):** Desires surviving maximal exposure to facts and logic. It's a *procedural* rationality test applied to the *individual*.
      *   **Railton (Full-Information):** What my "idealized self" (fully informed, instrumental rationality) would want for my "actual self." It's a *relational* account of well-being.

  3.  **Address Key Question 1: Agreement and Divergence on Idealization:**
      *   *Agreement:* All three reject actual desire satisfaction (we want what we *should* want, not just what we *do* want). All three rely on epistemic improvement (more info, better reasoning). All three assume there is a "stable point" or convergence after idealization.
