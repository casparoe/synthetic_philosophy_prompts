      *   **Key Question 1:** Beyond the individual vs. collective shift, where do their underlying assumptions about idealization agree or diverge?
      *   **Key Question 2:** Does the "alienation objection" (that the idealized self is too different to have authority over the actual self) threaten CEV, or does the collective nature change the diagnosis?
