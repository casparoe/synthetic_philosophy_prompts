      *   *Counter:* The objection is about the *idealized counterpart's* authority. In Railton, the counterpart is *me-but-omniscient*. In CEV, the counterpart is *us-but-mature*. The "us" provides a buffer. If my ideal self hates my hobby, I feel alienated. If "Humanity+" keeps my hobby as part of our cultural heritage even if I personally outgrow it, I feel less alienated.
