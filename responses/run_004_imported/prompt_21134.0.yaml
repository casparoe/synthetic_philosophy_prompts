          *   *Wait, let's look closer:* Railton's ideal self wants things *for* the actual self. CEV asks what the idealized humanity would want *for the future*.
          *   *Stronger Verdict:* The alienation objection is *fatal* to individual full-information accounts (Railton/Brandt) because the epistemic gap destroys psychological continuity. CEV *avoids* this specific fatality because its idealization process is explicitly defined by *continuity of identity* ("grown up farther together") rather than just information. However, CEV faces a *political* alienation problem.
          *   *Decision:* I will argue that CEV is *less* vulnerable to the traditional alienation objection than Railton/Brandt, because CEV builds psychological and moral continuity into the definition of idealization, whereas Railton/Brandt treat idealization primarily as an epistemic cleanup that risks severing the link to the actual self.

  5.  **Drafting the Argument:**
