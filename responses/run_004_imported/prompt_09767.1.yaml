answer: |-
  This is a fantastic question because it cuts right to the tension between **decision theory as math** (graphs, cycles, optimization) and **decision theory as philosophy** (what constitutes an "agent").

  Your programmer intuition is spot-on: in a static graph, a negative cycle is a bug, and backward induction (pruning the tree) is the standard fix. In the literature, this is indeed **Sophisticated Choice**. You anticipate your future self's "irrational" move, and you adjust your current move to compensate.

  So, why isn't that the end of the story? Why does Edward McClennen (and others like David Gauthier or J. Edward McClennen in *Rationality and Dynamic Choice*) argue for **Resolute Choice**?

  Here is the breakdown of why plain lookahead doesn't settle the debate, and why Resolute Choice claims to be the more "rational" fix.

  ### 1. The Limit of Sophisticated Choice (Lookahead)

  You are correct that Sophisticated Choice stops the money pump. If I know I will trade $C \to A$ at the end, I know I will end up with $A$ minus \$3. If I prefer keeping $A$ to having $A$ minus \$3, I simply refuse the first trade ($A \to B$). The loop never starts. I keep my money.

  So, the pump is stopped. What's the problem?

  #### A. It Violates the Separability Principle
  Standard decision theory relies on the **Separability Principle**: Your choice at any node should depend only on the future consequences available from that node, not on how you got there or what you planned earlier.

  Sophisticated Choice violates this. At the first node, you refuse a trade ($A \to B$) that you *actually prefer* ($B > A$) solely because you predict you will make a "bad" choice later. You are letting a future error dictate a current truth. To a philosopher of agency, this looks like **capitulation**. You are admitting that you are not a unified agent, but a sequence of conflicting time-slices, and the current slice is held hostage by the future slice.

  #### B. It Leads to "Dominated Strategies"
  In more complex dynamic problems (beyond the simple 3-item pump), Sophisticated Choice can force you into a strategy that is objectively worse than one you *could* have taken if you had the power to commit.

  Imagine a scenario where entering the loop is actually beneficial *if* you can complete it, but costly if you deviate.
  *   **Sophisticated Agent:** "I know I will deviate at step 3. Therefore, entering at step 1 guarantees a loss. I will not enter." (Result: Missed opportunity).
  *   **Resolute Agent:** "I know I will want to deviate at step 3. I will commit now to not deviating. Therefore, entering at step 1 yields a gain. I will enter." (Result: Gain).

  If the Resolute Agent can actually pull this off, they achieve a higher utility than the Sophisticated Agent. If rationality is about maximizing utility, Sophisticated Choice is suboptimal because it treats your own future preferences as immutable laws of physics rather than mutable states of mind.

  #### C. It Accepts Fragmentation
  The deepest objection is metaphysical. Sophisticated Choice assumes the agent is **dynamically inconsistent** and accepts it. It says, "I am a collection of selves, and Self-T1 must negotiate with Self-T2."
  McClennen argues that a rational agent must be **diachronically unified**. You aren't a chain of distinct people; you are one person over time. If your preferences cycle, that is a flaw in *you*, not a constraint you must work around. Rationality requires fixing the flaw, not navigating around it.

  ### 2. The Case for Resolute Choice

  Resolute Choice says: **Choose a plan at $t_0$ that maximizes utility over the whole path, and bind your future selves to it.**

  You called this "smuggling irrationality in the back door." Here is the counter-argument for why it's actually *more* rational.

  #### A. It's Not "Overriding Judgment," It's "Executing Policy"
  Think of it like a Ulysses contract. Ulysses knows he will want to steer toward the Sirens later.
  *   **Sophisticated Ulysses:** "I know I will steer toward the Sirens at $t_2$. Therefore, at $t_1$, I should sail far away from them." (Result: Never hears the song, or crashes because he tried to avoid the path entirely).
  *   **Resolute Ulysses:** "I am tying myself to the mast at $t_0$. At $t_2$, when I scream to be released, I will ignore that scream because it contradicts my $t_0$ policy."

  Is ignoring your $t_2$ scream irrational? No. It's recognizing that your $t_2$ judgment is compromised (by the Sirens, or by cyclic preferences). Resolute Choice argues that **reflective preferences** (what you want for your life as a whole) trump **myopic preferences** (what you want in the immediate moment).

  #### B. Transitivity as a Policy, Not a Primitive
  In standard economics, transitivity ($A>B, B>C \implies A>C$) is an *axiom*. If you violate it, you're irrational.
  McClennen flips this. He suggests transitivity should be a **normative achievement**.
  *   **Sophisticated Choice:** "I have cyclic preferences. I will navigate them carefully." (You remain cyclic).
  *   **Resolute Choice:** "I have cyclic preferences. I will adopt a plan that imposes transitivity on my actions." (You become effectively transitive).

  Resolute Choice doesn't smuggle irrationality; it **enforces rationality** on a system that would otherwise be irrational. It uses willpower (or precommitment) to linearize the cycle.

  #### C. The "Programmer" Analogy: Global vs. Local Scope
  Since you're a programmer, here is the best way to model the difference:

  *   **The Money Pump** is a recursive function with a bug where the state transitions don't converge.
  *   **Sophisticated Choice** is like handling the bug with **error propagation**. Each function call checks if the next call will return an error, and if so, it returns an error immediately. The program doesn't crash, but it also doesn't do the work. It's defensive coding.
  *   **Resolute Choice** is like using a **Global Lock / Mutex**. The main thread sets a `PLAN_EXECUTING = true` flag. All subsequent function calls check this flag. If `PLAN_EXECUTING` is true, they ignore their local parameters and follow the global plan.

  Is the Global Lock "irrational"? No, it's a concurrency control mechanism to prevent race conditions (in this case, temporal race conditions between your $t_0$ self and $t_1$ self). Without the lock, you have a data race on your own utility function.

  ### 3. Why the Debate Persists

  If Resolute Choice sounds better, why doesn't everyone use it?

  1.  **The "Magic" Problem:** Sophisticated Choice requires only prediction (which we can model). Resolute Choice requires **willpower** or **binding technology**. In economics, "willpower" is often treated as a black box or a cost. If I *can't* actually bind my future self, Resolute Choice is empty advice. (McClennen argues that being rational *includes* the capacity to bind oneself).
  2.  **Dynamic Consistency:** Economists love **Dynamic Consistency** (if you plan to do X later, you actually do X later without needing to bind yourself). Sophisticated Choice preserves this. Resolute Choice admits you *won't* want to do X later, so you have to force yourself. To a strict Bayesian, needing to force yourself implies your initial calculation was wrong. To a McClennen-style planner, it implies your initial calculation was *wiser*.
  3.  **The Regret Argument:** A Sophisticated chooser never regrets a choice (because they anticipated everything). A Resolute chooser might feel regret at $t_2$ ("I wish I could trade C for A now!") but suppresses it. Some argue that ignoring genuine current preferences is inherently paternalistic and risky.

  ### Summary

  You are right that **Sophisticated Choice (Lookahead)** solves the *mathematical* problem of the money pump. It prunes the negative cycle.

  However, it solves it by **shrinking the agent**. It says, "I am limited by my future weakness."
  **Resolute Choice** solves it by **expanding the agent**. It says, "I am defined by my long-term plan, and my future weakness is just noise to be filtered."

  McClennen's point is that if you have to choose between being an agent who accommodates their own bugs (Sophisticated) vs. an agent who patches their own bugs via commitment (Resolute), the latter is the only one that deserves the title "Rational." It's not smuggling irrationality; it's installing a patch for the cyclic preference bug that ensures the system runs as a coherent whole.
