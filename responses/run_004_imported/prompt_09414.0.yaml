          *   *Weaknesses:* Rigid, can seem barbaric (lex talionis), doesn't account for social context, hard to scale (how much prison time equals fraud?).
          *   *Defensibility:* High on moral intuition regarding guilt, low on practical application.

      *   **Hegelian Retributivism:**
