      *   *Structure:*
          1.  Define Udayana's criteria for *śabda* (*āpta* + *tātparya*).
          2.  Analyze the LLM against the *āpta* condition (Knowledge & Truthfulness).
          3.  Analyze the LLM against the *tātparya* condition (Intentionality).
          4.  Address the "Authorless" parallel (*apauruṣeya*).
          5.  Evaluate the "Designer/Corpus" workaround.
