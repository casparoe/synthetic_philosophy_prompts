      *   *Key Sanskrit Terms:* *Āpta*, *Tātparya*, *Apauruṣeya*, *Pramāṇa*, *Jñāna*, *Icchā*, *Prayatna*.

  6.  **Refining the Argument (Self-Correction during drafting):**
