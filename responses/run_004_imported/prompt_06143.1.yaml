answer: |-
  The asymmetry between the Liar and Curry's paradoxes lies in the specific proof-theoretic mechanisms required to derive triviality (the derivation of an arbitrary sentence $B$) from the paradoxical sentence. While the Liar paradox relies essentially on the principle of *Ex Contradictione Quodlibet* (Explosion), Curry's paradox derives triviality using only the structural properties of the conditional and assumption management, completely bypassing negation and contradiction.

  Here is the technical explanation of why paraconsistency fails to block Curry's paradox and the specific structural rule that must be restricted.

  ### 1. Paraconsistency and the Liar Paradox
  Paraconsistent logics, such as Priest's **LP** (Logic of Paradox), are defined by the invalidity of the Explosion rule (EFQ):
  $$ A, \neg A \nvdash B $$
  In LP, a sentence can be both true and false (a "glut"), designated by the value $\{1, i\}$. The Liar sentence $\lambda$ (where $\lambda \leftrightarrow \neg \lambda$) is assigned the value $i$. Consequently, $\lambda$ and $\neg \lambda$ are both designated. In classical logic, this contradiction would trigger Explosion, deriving any $B$ and trivializing the system. In LP, because Explosion is invalid, the contradiction is contained. The system tolerates the inconsistency without collapsing into triviality.

  ### 2. The Curry Derivation and the Irrelevance of Negation
  Curry's paradox constructs a sentence $C$ that asserts its own implication of an arbitrary sentence $B$:
  $$ C \leftrightarrow (C \to B) $$
  The derivation of triviality proceeds as follows in a standard Natural Deduction framework:

  1.  $C \leftrightarrow (C \to B)$ (Fixed-point axiom/schema)
  2.  $\quad \mid \quad C$ (Assumption for $\to$-Intro)
  3.  $\quad \mid \quad C \to B$ (From 1, 2 by $\leftrightarrow$-Elim)
  4.  $\quad \mid \quad B$ (From 2, 3 by $\to$-Elim / Modus Ponens)
  5.  $C \to B$ (From 2–4 by $\to$-Intro)
  6.  $C$ (From 1, 5 by $\leftrightarrow$-Elim)
  7.  $B$ (From 5, 6 by $\to$-Elim)

  **The Proof-Theoretic Asymmetry:**
  Notice that **negation does not appear** in this derivation. Consequently, the paraconsistent restriction of Explosion is logically inert here. The derivation does not produce a contradiction ($A \land \neg A$) that needs to be prevented from exploding; it produces $B$ directly. Even if the logic tolerates contradictions perfectly, Curry's paradox forces the acceptance of $B$ solely through the properties of the conditional and the management of assumptions. Therefore, a logic can be paraconsistent (block Liar-induced triviality) but still be trivialized by Curry.

  ### 3. The Culprit: Structural Contraction
  To identify the rule that must be restricted, we must analyze the usage of the assumption $C$ in the subproof (lines 2–4).

  In line 4, $B$ is derived from the set of assumptions $\{C, C \to B\}$. However, $C \to B$ was itself derived from the assumption $C$ (in line 3). Thus, within the scope of the subproof, the assumption $C$ is used **twice**:
  1.  Once as the antecedent to detach the conditional (Line 3).
  2.  Once as the antecedent to detach the resulting implication (Line 4).

  In sequent calculus terms, the derivation from lines 2–4 establishes:
  $$ C, C \vdash B $$
  To move to line 5 ($C \to B$), we apply $\to$-Introduction, which typically requires discharging the assumption to yield:
  $$ C \vdash B $$
  The inference from $C, C \vdash B$ to $C \vdash B$ is the structural rule of **Contraction** (specifically, left-contraction):
  $$ \frac{\Gamma, A, A \vdash B}{\Gamma, A \vdash B} $$

  ### 4. Why Contraction Must Be Restricted
  For a dialetheist to retain a **detachable conditional** (one that validates Modus Ponens, which is essential for ordinary reasoning and mathematical proof), they cannot simply reject $\to$-Elim. If Modus Ponens is preserved, the only way to block the Curry derivation is to prevent the merging of the two instances of the assumption $C$.

  Therefore, the dialetheist must restrict **Contraction**.

  This restriction is independent of negation. Contraction is a structural rule governing the multiplicity of assumptions (a "resource" management rule), not a logical rule governing truth values or negation. A logic that restricts Contraction is often called a **contractive-free** or **substructural logic** (e.g., certain relevant logics like **LC** or linear logic variants).

  ### Summary
  *   **Liar Paradox:** Trivialization depends on **Explosion** ($A, \neg A \vdash B$). Paraconsistency blocks this by invalidating Explosion.
  *   **Curry's Paradox:** Trivialization depends on **Contraction** ($A, A \vdash B \Rightarrow A \vdash B$) and Modus Ponens. It generates $B$ without negation.
  *   **The Asymmetry:** Paraconsistency addresses the former but leaves the latter untouched.
  *   **The Solution:** To block Curry while maintaining a usable conditional, the dialetheist must restrict **Contraction**. This explains why LP (which retains Contraction) is vulnerable to Curry if equipped with a detachable conditional, necessitating a move toward non-contractivist paraconsistent logics.
