answer: |-
  Here are ten questions designed to press the guest's thesis without shutting down the conversation, including the specific angles you requested and the tactical notes for follow-ups.

  **1. The Solitude of Pity**
  "Rousseau argues that theater pity is a tax we pay to feel virtuous without acting, but when I cry over a character alone in my room, there's no audience to perform for. Doesn't the privacy of reading strip away the 'self-congratulatory' element Rousseau hated?"
  **Note:** She'll claim emotion is identical regardless of context; shut it down by asking if private shame motivates action better than public virtue-signaling.

  **2. The Liar Without a Witness**
  "The actor counterfeits a self in front of witnesses, but a novelist constructs a voice in solitude. Does the charge of 'lying' even survive when there is no one present to be deceived in the moment of creation?"
  **Note:** She'll equate the narrator to a persona; shut it down by asking if the reader *believes* the narrator is real or consents to the game.

  **3. The Rousseau Exception**
  "Rousseau wrote *Le Devin du Village* and comedies while telling Genevans to ban theater. Was that a contradiction, or did he believe moral art gets a hall pass that other fiction doesn't?"
  **Note:** She'll argue his work was didactic, not entertainment; shut it down by asking who grants the 'moral' exemption and if novelists can claim it too.

  **4. The Binge-Watcher vs. The Citizen**
  "You argue novels make us passive spectators, but isn't a person binge-watching eight episodes alone on a couch the true passive spectator, far more than a Genevan citizen sitting in a communal hall?"
  **Note:** She'll conflate all consumption as passive; shut it down by asking if the mental labor of imagining a scene counts as 'action' Rousseau valued.

  **5. The Mercenary of Sentiment**
  "Rousseau hated actors because they sold their emotions for wages, and as a professional novelist, I sell empathy for a living. Am I, by his definition, a mercenary of sentiment?"
  **Note:** She'll say the market corrupts the art; shut it down by asking if unpaid hobbyists are then the only ethical storytellers.

  **6. Imagination vs. Illusion**
  "In *Emile*, Rousseau champions imagination as essential for empathy, yet in the *Letter* he condemns theatrical illusion. Where is the line between the imagination he praised and the illusion he condemned?"
  **Note:** She'll distinguish 'natural' from 'artificial' imagination; shut it down by asking if writing fiction is inherently artificial or can be natural expression.

  **7. The Moral Resolution**
  "If the problem is empty pity, does a novel that ends without moral resolution fail, or is the ambiguity itself a form of honest engagement with a messy world?"
  **Note:** She'll argue ambiguity encourages apathy; shut it down by asking if real life offers moral resolutions that fiction is obligated to match.

  **8. The Labor of Reading**
  "A theatergoer receives a finished image, but a reader has to build the world in their head. Isn't reading actually a form of labor Rousseau would respect more than sitting in the dark?"
  **Note:** She'll claim the author still dictates the terms; shut it down by asking if the reader's mental contribution alters the moral weight of the experience.

  **9. The Performance of Self**
  "Rousseau feared we'd become actors in society, but with social media, aren't we all performing selves now, making fiction the only honest place left to be fake?"
  **Note:** She'll argue fiction reinforces the performance; shut it down by asking if fiction allows us to process that performance safely.

  **10. The Verdict**
  "If we apply your reading of the *Letter* strictly, does any fiction survive the purge, or is there a single book Rousseau would allow on the shelf?"
  **Note:** She'll name a moral/religious text; shut it down by asking if a novel that challenges morality is then inherently dangerous.
