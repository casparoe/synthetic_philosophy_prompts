answer: |-
  The episode you describe is based on real historical documents, but the interpretation that Newton "lapsed into irrational pseudoscience" requires significant nuance. It tells us less about the conflict between religion and reason, and more about how historical context shapes what counts as "rational" inquiry.

  Here is a breakdown of the historical facts and the philosophical implications of Newton's theological work.

  ### 1. The Facts of the 2060 Manuscript
  It is true that in a manuscript now held at the Hebrew University of Jerusalem (Keynes Ms. 7), Newton wrote: *"It may end later, but I see no reason for its ending sooner."* regarding the year 2060.

  However, popular accounts often distort this in two ways:
  *   **Destruction vs. Renewal:** Newton did not predict the destruction of the Earth or the extinction of humanity. He was predicting the beginning of the Millennium—a period of peace and divine rule described in Revelation. For Newton, this was a political and spiritual restructuring of the world, not necessarily its physical annihilation.
  *   **Certainty vs. Speculation:** Newton explicitly warned against the "rashness" of setting exact dates. He offered 2060 as a calculation based on specific prophetic timelines (specifically the 1,260 days/years mentioned in Daniel), but he framed it as a possibility to discourage fanaticism, not as a divine revelation. He wrote, *"This I mention not to assert when the time of the end shall be, but to put a stop to the rash conjectures of fanciful men."*

  ### 2. Science and Theology Were Not Separate
  To label Newton's theology "pseudoscience" is anachronistic. In the 17th century, the distinction between "science" (natural philosophy) and "theology" was not sharp.
  *   **Two Books of God:** Newton, like many of his contemporaries (including Boyle and Kepler), believed God revealed himself through two books: the Book of Nature (physics) and the Book of Scripture (theology).
  *   **Unified Quest:** Studying prophecy was not a "lapse" from his scientific work; it was part of the same project. He sought to uncover the hidden laws governing the universe, whether those laws were gravitational or historical/prophetic.
  *   **Methodological Rigor:** Newton applied a form of rigor to his theology. He learned ancient languages (Hebrew, Aramaic, Greek), studied historical chronologies, and compared texts. While we reject his *premises* (that the Bible contains encoded future history), his *method* was consistent with the scholarly standards of his time.

  ### 3. Rationality and Premises
  The core of your question is whether this shows a rigorous mind can become irrational due to religious conviction. A more precise philosophical takeaway is that **logic cannot correct false premises.**

  Newton was a master of deduction. However, deduction only guarantees that the conclusion follows from the premises; it does not guarantee the premises are true.
  *   **Physics:** Premise = Empirical observation + Mathematical consistency. Result = Highly accurate laws of motion.
  *   **Prophecy:** Premise = The Bible is a divinely encoded historical document. Result = Complex chronologies that make sense internally but do not correspond to external reality.

  Newton's theological work demonstrates that high intelligence and logical rigor do not immunize a thinker against error if the foundational axioms are untestable or incorrect. This is not unique to religion; brilliant scientists today can hold rigorous views within their field while maintaining unfounded beliefs in other areas (e.g., political ideology or alternative medicine).

  ### 4. The "Last Magician"
  The economist and collector John Maynard Keynes, who purchased many of Newton's private papers, famously summarized this duality after reading Newton's alchemical and theological manuscripts:

  > *"Newton was not the first of the age of reason. He was the last of the magicians."*

  Keynes meant that Newton straddled two worlds. He used the emerging tools of the Enlightenment (math, empiricism) but was driven by a pre-Enlightenment desire to uncover ancient, hidden wisdom (prisca sapientia) believed to be possessed by the ancients.

  ### Conclusion
  Does this episode show that religious conviction makes a rigorous mind irrational? **Not necessarily.**

  It shows that **rationality is context-dependent.** Newton was operating within a worldview where divine providence was an active force in history. Within that framework, analyzing prophecy was a rational activity.

  The lesson is not that religion corrupts science, but that **genius is not infallibility.** Even the greatest intellects are products of their time, bound by the available data and the prevailing metaphysical assumptions of their culture. Newton's theological errors remind us that the scientific method is a specific tool for specific questions, and applying rigorous logic to untestable premises—even for a genius—will not yield scientific truth.
