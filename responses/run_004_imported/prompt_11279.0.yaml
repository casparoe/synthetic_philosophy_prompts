      *   *Key Correction:* Must emphasize the difference between *probing* (readout) and *intervention* (causality). This is the most important teaching moment.

  7.  **Refine the Dennett Point:**
      *   Dennett's "Real Patterns" is actually an argument *for* a kind of realism (pattern realism). If a pattern allows prediction/compression, it is real *as a pattern*. The student claims this is usually taken to mean deflationism/fiction. This is a subtle philosophical error. Dennett opposes the idea that only "fundamental physics" is real. So features *are* real if they predict well. The student conflates "not fundamental physics" with "fiction." I need to point this out gently.

