answer: |-
  This is one of the most fertile misunderstandings in the history of decision theory. You have correctly identified that the Kelly/Samuelson debate is not merely about bet-sizing; it is a clash between two metaphysics of probability. One side views probability as a measure of belief across possible worlds (the Bayesian/Subjective/Ensemble view); the other views probability as a frequency of events in time (the Frequentist/Objective/Time view).

  You asked for a definite answer. Here it is: **The ergodicity argument does not succeed in establishing geometric rationality as a distinct, general theory of rationality. It is, fundamentally, expected-utility maximization with logarithmic utility, dressed in the language of dynamical systems.**

  However, that "dressing" is not merely cosmetic. It provides a physical derivation for *why* logarithmic utility is the correct function for wealth, stripping it of psychological arbitrariness. While it fails as a universal theory of rational choice, it succeeds as a universal theory of *wealth accumulation*.

  To justify this, I will first give the ergodicity argument its strongest possible case, showing why it feels like a revolution. Then I will explain why it ultimately collapses back into the Samuelson framework when we step outside the narrow lane of multiplicative wealth dynamics.

  ### The Strongest Case for Geometric Rationality

  The ergodicity economists (led notably by Ole Peters) argue that classical expected-utility (EU) theory commits a category error. They claim EU theory calculates an "ensemble average"—what would happen if 10,000 versions of you played the game once in parallel universes. But you do not live in 10,000 universes. You live in one, and you play the game sequentially over time.

  For ergodic processes (like rolling a die), the time average and the ensemble average converge. If you roll a die enough times, your average result matches the statistical expectation. But wealth dynamics are **non-ergodic**. If you bet your entire bankroll on a coin flip that has a positive expected value (say, win 60% or lose 50%), the ensemble average says you should bet everything. After one flip, the "average" version of you is richer. But in the *time* average—the single path you actually walk—if you hit tails once, you are bankrupt. You cannot come back from zero to average out your winnings in the next universe.

  On this view, risk aversion is not a psychological quirk or a "preference" parameter. It is a physical constraint of the system. Volatility acts as a drag on compound growth (the "volatility tax"). If you lose 50%, you need a 100% gain just to get back to even. Therefore, maximizing the arithmetic expected value is physically irrational for a single agent over time. Maximizing the geometric growth rate (Kelly) is the only strategy that avoids ruin and maximizes wealth in the limit.

  This framework elegantly dissolves the St. Petersburg Paradox without needing to invent a curved utility function. It says the paradox arises because we are looking at ensemble averages of a non-ergodic game. If you look at the time average, the value of the game is finite.

  In this light, Geometric Rationality claims to be "better-grounded" because it anchors rationality in the **physics of time** rather than the **psychology of preference**. It says: "You don't need to *feel* risk-averse to bet Kelly; you need to bet Kelly because the math of time demands it if you want to survive."

  ### The Strongest Case for Classical Expected Utility

  Paul Samuelson's rebuttal rests on the sovereignty of the agent's goals. Expected Utility theory is not a theory of wealth; it is a theory of *choice*. It posits that a rational agent acts to maximize the expectation of a utility function that represents their preferences.

  The crucial weakness of the ergodicity argument is that it assumes your only goal is to maximize terminal wealth at an infinite time horizon. But humans have finite lives, consumption needs, and non-monetary values.

  1.  **Finite Horizons:** If you are playing a poker game that you know will end in 30 minutes, the "long-run" geometric growth rate is irrelevant. You might rationally choose to "go broke" trying to double up to pay a rent bill due tomorrow. The ergodic argument assumes you are playing forever; EU accommodates the fact that you will die.
  2.  **Consumption vs. Accumulation:** Wealth is not a score; it is a means to consumption. If I have \$10 million, the utility of the next \$1 million is lower than the utility of the first \$10,000 when I was starving. EU captures this via diminishing marginal utility. Ergodicity captures this only if you equate "log wealth" with "utility," which brings us back to square one.
  3.  **Non-Wealth Goals:** Sometimes I bet to have fun, to signal status, or to help a friend. If I donate half my bankroll to charity, I have reduced my geometric growth rate to zero (or negative). Is this "irrational" under geometric rationality? Yes. Is it irrational under EU? No, provided my utility function values charity.

  Samuelson's point is that "rationality" is about internal consistency with one's own goals, not obedience to the dynamics of wealth. If I prefer a 90% chance of doubling my money and a 10% chance of ruin over a 100% chance of slow growth, EU says I am rational. Geometric rationality says I am mathematically doomed. But if my goal is "get rich quick or die trying," the latter is the correct description of my outcome, while the former is the correct description of my *choice*.

  ### The Verdict: Why Ergodicity is Log-Utility in Disguise

  The ergodicity argument succeeds in proving that for a specific class of problems—**repeated, multiplicative bets with reinvestment and an infinite horizon**—the time-average growth rate is the physically correct metric. In this specific domain, they are right: risk aversion is a property of the dynamics, not the mind.

  However, this does not make it a distinct *general* theory of rationality. Here is why it collapses back into Expected Utility with Logarithmic Utility:

  **1. Mathematical Equivalence**
  Maximizing the expected logarithm of wealth ($E[\ln W]$) is mathematically identical to maximizing the time-average geometric growth rate. The ergodicity proponents have not found a new optimization target; they have derived a specific utility function from physical first principles. They have answered the question Samuelson left open ("Why log?"), but they have not escaped the Samuelson framework ("Maximize expected utility").

  **2. The "Utility" of Survival**
  The ergodicity argument implicitly assumes that "ruin" (wealth = 0) has negative infinity utility. If you assign a utility of $-\infty$ to bankruptcy, then Expected Utility theory *also* dictates that you must avoid ruin at all costs, leading you to Kelly-like betting. The difference is that Peters says this $-\infty$ is a law of physics (you can't bet from zero), while Samuelson says it's a preference (I really don't want to be broke). But the behavioral output is the same.

  **3. The Generalization Failure**
  A general theory of rationality must handle one-off decisions, consumption, and non-monetary goods. Ergodicity economics struggles here. How do you calculate the "time-average growth" of a decision to get married, or to take a job with a fixed salary? You can't. You have to revert to Expected Utility. If Geometric Rationality cannot guide choices outside of investment dynamics, it is a specialized tool, not a foundational theory.

  **4. The Subjectivity of the "System"**
  Even the ergodic argument relies on a boundary definition. What is the "wealth" being tracked? Is it my poker bankroll? My net worth? My human capital? If I lose my poker bankroll but can earn more income from my job, the "ruin" is not absorbing. The dynamics change based on how I define the system, which reintroduces the subjective judgment that EU theory centers.

  ### Conclusion

  The ergodicity economists have won the battle but lost the war.

  They have won the battle by demonstrating that for **multiplicative wealth dynamics**, the Kelly criterion is not just a heuristic but a physical necessity for survival. They have successfully argued that in this specific context, risk aversion is not a psychological parameter to be tuned, but a mathematical constraint to be respected. This is a profound improvement over the vague "risk tolerance" questionnaires of modern finance.

  However, they lose the war for **rational choice under uncertainty** generally. Their framework is too narrow to encompass the full range of human decision-making. By focusing exclusively on the time-evolution of wealth, they implicitly adopt a logarithmic utility function without acknowledging that this is a utility function.

  Samuelson was right: Rationality is maximizing the expectation of your preferences. The ergodicity economists simply proved that for a specific, common class of preferences (long-term wealth accumulation), the utility function *must* be logarithmic to align with the physics of time.

  So, to answer your question directly: **Geometric rationality is expected-utility maximization with logarithmic utility dressed up in different language.** The language is more honest about the source of the risk (the dynamics of the world vs. the psyche of the bettor), but the underlying logic of rational choice remains firmly within the Expected Utility tradition. You should use the Kelly criterion for your poker bankroll because the ergodicity argument proves it is the correct utility function for that game, but do not mistake it for a replacement for the broader logic of decision-making.
