  so in my Theory of Knowledge class we learned that Plato came up with the definition of knowledge as justified true belief like 2400 years ago, and then in 1963 this guy Edmund Gettier comes along and basically disproves it with two short counterexamples. we actually had to read the original paper for homework and it barely even mentions Plato (like one footnote), which seems kinda weird if Plato's supposedly the one who came up with the whole theory in the first place. it also just blows my mind that this defintion sat there completely unchallenged for like 2000+ years and then got taken down by a paper thats only a few pages long — was Plato's reasoning for JTB actually that airtight, or did nobody seriously stress-test it until the 60s?
