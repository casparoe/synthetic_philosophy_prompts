  8.  **Final Polish:** Ensure the distinction between *normative* reasons (what you should do) and *motivating* reasons (what makes you do it) is clear, as this is the crux of the philosophical dispute. (Actually, Williams argues normative reasons *must* be capable of being motivating reasons). I will stick to the Williams framework as it's the standard bearer for this debate.

