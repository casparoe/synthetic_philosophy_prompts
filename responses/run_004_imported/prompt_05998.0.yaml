answer: |-
  **Title:** The Geometry of Being: Why Special Relativity Favors the Block Universe

  **Introduction**

  For thirty years, you operated within the pragmatic ontology of the laboratory. In that context, Special Relativity (SR) is a tool for synchronization and correction; the "reality" of time dilation is confirmed by muon decay rates and GPS clock offsets, but the metaphysical implications often remain shelved with the equipment. It is a common and reasonable stance for working physicists to assume that if the equations work, the ontology is settled. However, your retirement reading has touched upon the precise nerve where physics bleeds into metaphysics. The Rietdijk–Putnam argument and Penrose's Andromeda paradox are not merely puzzles; they are geometric proofs regarding the structure of existence.

  You ask for a definite verdict: Does the relativity of simultaneity refute presentism in favor of eternalism? You further ask to evaluate the two most sophisticated defenses of presentism: Neo-Lorentzianism and Howard Stein's point-presentism.

  My verdict is this: **Eternalism wins outright.** The geometry of Minkowski spacetime is not merely a calculational device but an ontological map. The presentist replies, while intellectually strenuous, fail as principled responses. Neo-Lorentzianism is an *ad hoc* rescue that contradicts the methodological lessons of relativity, and Stein's strategy, while geometrically principled, abandons the core metaphysical commitment of presentism to save the label.

  **The Geometric Challenge: Rietdijk–Putnam and Andromeda**

  To understand why the verdict must fall against presentism, we must look strictly at the geometry you know well. Presentism asserts that only events on a single, global hyperplane of simultaneity exist. The past is gone; the future is not yet. However, SR dictates that simultaneity is frame-dependent.

  The Rietdijk–Putnam argument exploits the transitivity of existence. Suppose Observer A and Observer B pass each other at event $O$. They are moving relative to one another. Their respective planes of simultaneity intersect at $O$ but diverge elsewhere. Consider a distant event $E$ (say, a fleet launching in Andromeda). For Observer A, $E$ may lie in the future. For Observer B, moving slightly toward Andromeda, $E$ may lie in the past (or present).

  If we assume that "what is real" cannot depend on the arbitrary choice of an observer's velocity, we face a contradiction. If $E$ is real for B, and B is real for A (since they meet at $O$), then $E$ must be real for A. By varying the velocity of B, we can sweep the entire spacetime manifold. If reality is frame-independent, the entire manifold must be equally real. This is the Block Universe.

  Penrose's Andromeda paradox sharpens this by emphasizing the human scale. Two people walking past each other on the street have different planes of simultaneity. For one, an Andromedan fleet has already launched; for the other, the decision to launch hasn't been made. If the future is genuinely open (as presentism requires), how can it be fixed for one pedestrian and open for the other? The only consistent solution is that the launch event exists timelessly in the manifold, regardless of who is looking at it.

  **Reply 1: Neo-Lorentzian Presentism**

  The first defense you encountered is Neo-Lorentzianism. This view accepts the empirical predictions of SR but posits a privileged reference frame—a modern "ether"—that defines the true, absolute simultaneity. In this view, the relativity of simultaneity is an epistemic illusion caused by the behavior of our measuring rods and clocks, not an ontological feature of time.

  Is this a principled response? **No. It is a textbook *ad hoc* rescue.**

  As a physicist, you appreciate that a theory's power lies in its symmetry and its economy. The triumph of Einsteinian relativity over Lorentz's ether theory was not empirical (both predict the same null results for interferometers) but methodological. Lorentz's theory required a dynamical conspiracy: matter must contract and clocks must slow in exactly the right way to hide the privileged frame from *any* possible experiment.

  Neo-Lorentzian presentism asks us to posit an entity (the privileged frame) that is, by the theory's own definition, empirically undetectable. It violates Occam's Razor without gaining predictive power. More damningly, it treats the Lorentz symmetry of the laws of physics as a coincidence rather than a structural feature of spacetime. To save the metaphysics of a global "now," Neo-Lorentzianism must deny the ontological significance of the spacetime geometry that has been confirmed by every high-energy experiment of the last century. It saves presentism only by rendering the physics a shadow play behind a hidden reality we can never access. This is not physics; it is metaphysics fighting science.

  **Reply 2: Howard Stein's Point-Presentism**

  The second defense is more subtle and mathematically rigorous. In 1968, Howard Stein argued that we should relativize the relation "is real." Instead of asking "Is event $E$ real?" (simpliciter), we ask "Is event $E$ real *for* observer at event $a$?"

  Stein proposed that an event $b$ is real for $a$ if and only if $b$ lies in the past light cone of $a$ (or is $a$ itself). This respects the causal structure of Minkowski spacetime. It avoids superluminal definitions of reality and acknowledges that I can only know what has reached me.

  Is this a principled response? **It is principled regarding geometry, but it fails as presentism.**

  Stein's move is mathematically consistent with SR. It avoids the contradictions of the Rietdijk–Putnam argument by denying the transitivity of "is real" across spacelike separated regions. However, it comes at a steep metaphysical cost. Traditional presentism relies on a *shared* present—a global stage upon which we all act together. Stein's view fragments existence into individual light cones.

  Under Stein's definition, "the present" shrinks to a single point, and "reality" expands only as the past light cone grows. This is not presentism; it is a localized "growing block" or a solipsism of the moment. It concedes the main point of the eternalist: that there is no global hyperplane of existence. By redefining "real" to mean "causally accessible," Stein saves the *word* "presentism" but abandons the *worldview*. He grants the eternalist the block manifold but argues that our *access* to it is limited. But eternalism never claimed we have access to the future; it only claims the future *exists*. Stein's argument is a principled response to the epistemology of SR, but it does not refute the ontology of the block.

  **The Verdict**

  We must judge these views by how well they integrate the physics into the metaphysics.

  Neo-Lorentzianism fails because it treats the fundamental symmetry of spacetime (Lorentz invariance) as a superficial disguise for a Newtonian reality. It requires us to believe in a structure that the physics explicitly tells us is irrelevant to the dynamics. It is an *ad hoc* attachment of a metaphysical tail to a physical dog that has no use for it.

  Stein's point-presentism fails because it is a semantic retreat. It accepts the Minkowski manifold but tries to carve out a notion of "becoming" that is so local it loses the intersubjective "now" that defines the presentist intuition. If two observers cannot agree on what exists, and "existence" is reduced to "what is in my past light cone," we have effectively accepted the Block Universe but added a subjective indexical to the word "real."

  **Eternalism wins outright.**

  The Minkowski manifold is the most robust ontological interpretation of Special Relativity. It treats the geometry as fundamental, not derivative. It explains the Rietdijk–Putnam argument without requiring hidden variables (Neo-Lorentzianism) or redefining existence into local isolation (Stein).

  In the Block Universe, the relativity of simultaneity is not a paradox; it is a feature. Just as "left" and "right" depend on your orientation in space, "past" and "future" depend on your velocity through spacetime. This does not mean reality is subjective; it means that slicing the block into "nows" is a frame-dependent operation, like slicing a loaf of bread at an angle. The loaf exists regardless of how you slice it.

  You spent thirty years measuring the properties of this loaf. The physics you trusted implies that the slices are not the reality; the loaf is. Presentism requires the slice to be the only reality. To maintain that in the face of SR requires either denying the symmetry of the loaf (Neo-Lorentzianism) or claiming each crumb only exists for itself (Stein). Neither is sustainable. The geometry of spacetime is the geometry of being, and that geometry is four-dimensional.
