answer: |-
  **The Actuary of Silence**

  Elias sat at the kitchen table, the glow of his laptop screen cutting a blue rectangle into the dark. On the screen: a spreadsheet. Column A: *Costs*. Column B: *Benefits*. Column C: *Probability*.

  He was an actuary. He priced risk for a living. He knew how to calculate the likelihood of a flood, a crash, a death. But Row 47 of the spreadsheet was empty. The label read: *Post-Graft Utility.*

  The Graft sat in a sterile canister on the table next to his coffee. It looked like a knot of black root, pulsing faintly. It was a neural symbiote. You placed it at the base of the skull. It didn't just give you access to the Network; it rewired the reward centers that made you *want* to be an individual.

  He picked up the testimonial printout. It was from a woman named Sarah, three years post-Graft. Elias had known Sarah. She used to love jazz, spicy food, and arguing about politics.

  The testimonial read:
  *"The noise of 'I' is gone. There is no hunger, only the flow. When the wind hits the tower, I do not feel cold, I feel the pressure differential. It is not sad that the leaf falls. It is necessary data. Do not ask if I am happy. Happiness is a small box. I am the room."*

  Elias frowned. He highlighted the sentence: *Do not ask if I am happy.*

  He tried to input this into Column B. If Sarah wasn't happy, was that a negative? But she also said she wasn't sad. She was… *necessary*. How do you assign an expected value to "necessity"?

  He typed: *Loss of individual preference satisfaction.*
  He deleted it.
  He typed: *Gain in ontological security.*
  He deleted that, too.

  The problem wasn't that he didn't have enough information. It was that the information he needed could only be processed by a brain that didn't exist yet. To decide rationally, Elias needed to know what the Graft felt like. But to know what it felt like, he had to cease being the Elias who could weigh the pros and cons.

  The Elias sitting here loved the smell of rain on hot asphalt. He loved the sting of a failed bet. He loved his wife, specifically her, not the concept of partnership. The testimonial suggested that after the Graft, "wife" would just be "adjacent node."

  If he chose *no*, he preserved his values. He stayed Elias. But he remained trapped in a skull, screaming into the void, knowing there was a silence on the other side of the wall that might be better, or might be nothing, but he could never check.

  If he chose *yes*, he might gain the universe. But the "he" who gained it wouldn't care about gaining it. The victory would belong to a stranger wearing his skin.

  He looked at the canister. The black root pulsed, a slow, rhythmic heartbeat that didn't match his own.

  *What am I optimizing for?* he thought. *My current self's desires? Or the future entity's existence?*

  If he listened to his current self, the answer was obvious: *No. Don't die.*
  But that felt like a toddler refusing to learn to read because holding the book is comfortable.

  He opened a new cell in the spreadsheet. He typed: *The value of becoming someone who no longer wants this.*

  The cursor blinked. It was a metronome counting down a life he hadn't lived yet.

  He realized then that the spreadsheet was a cage built of old wood. It could measure the weight of a stone, but it couldn't measure the weight of water. To make this choice, he had to stop acting like an actuary. He had to make a leap that looked, from where he sat, exactly like suicide.

  Elias closed the laptop. The blue light vanished, leaving only the kitchen dark and the faint, bioluminescent thrum of the root in the canister.

  He didn't weigh the pros. He didn't weigh the cons. He acknowledged that the scale itself was about to be melted down.

  He reached out. His hand trembled, not from fear, but from the friction of two incompatible worlds rubbing against each other. He touched the glass.

  "I hope," he whispered to the empty room, "that you don't miss me."

  He didn't know who he was talking to. The man at the table, or the room that was waiting to be born.

  Elias picked up the canister. He did not calculate the odds. He walked toward the bedroom, toward the mirror, toward the end of the calculation.
