      *   **Core Argument 1: The Great Filter:** Explain this clearly. It's the strongest point. Life easy = Filter ahead = Bad news for long-term survival.
      *   **Core Argument 2: The Fermi Paradox:** Finding simple life deepens the mystery of why we don't see *advanced* life.
