      *   *Wait, that's the opposite.* In Death in Damascus: If you go to Aleppo, Death is in Aleppo. The prediction *matches* the location.
      *   *Correct Logic:* The predictor places the "bad outcome" where you decide to go.
      *   *Scenario:* A "Resource Allocation" AI. You need a life-saving drug. There are two dispensaries. The AI allocates the stock based on where it predicts patients will go to hoard it. If it predicts you will go to Clinic A, it moves the stock to Clinic B (or vice versa? No, in Death in Damascus, Death is *where you are*).
