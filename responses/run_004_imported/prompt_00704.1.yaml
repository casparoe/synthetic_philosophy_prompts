      *   *Let's go with a Legal/Parole Hearing.* The "Board" uses a predictive model. If you argue for parole (deliberate choice), you seem manipulative. If you accept your fate, you seem reformed. But if you *decide* to accept your fate to game the system, it knows.
      *   *Let's try a Sci-Fi "Gate" scenario.* It's clean and isolates the logic.
