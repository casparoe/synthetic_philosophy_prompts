      *   The Solution: He must sell without *deciding* to sell. Randomness.
      *   *Critique:* A bit abstract. Let's make it physical.

      *   *Final Choice:* **The "Sanctuary" Door.**
      *   Setting: A dystopian city. A shelter during a purge.
      *   Mechanism: The door opens only for those who do not *intend* to enter. (Wait, that's "The Girl Who Fell in Love with the Monster" logic).
      *   *Back to Death in Damascus:* The threat follows the choice.
      *   *Setting:* A job interview for a position that requires "unpredictability."
      *   *Let's go with the "Algorithmic Audit" idea.* It feels modern and claustrophobic.
      *   *Protagonist:* Mara.
      *   *Antagonist:* The Compliance Algorithm (The Auditor).
      *   *Stakes:* Her license/livelihood/freedom.
      *   *The Bind:* She must submit a report. Option A: Admit fault (penalty but safe). Option B: Deny fault (risk audit, if caught, ruin). The Auditor predicts her choice. If she decides to Admit, the Auditor flags it as "calculated remorse" (fail). If she decides to Deny, the Auditor flags it as "deception" (fail).
      *   *Actually, let's make it simpler.* Two rooms. One has the exit. The "Hunter" is in the room she chooses.
      *   *Okay, let's write about a "Predictive Security Gate."*
      *   Elias needs to pass through a checkpoint to save someone. The Gate is guarded by "The Arbiter." The Arbiter will shoot/stop anyone it predicts is trying to pass. To pass, the Arbiter must predict you are *not* trying to pass. But you *are* trying to pass.
      *   *Wait, that's a paradox, not Newcomb.*
      *   *Newcomb/Death in Damascus:* The outcome is fixed based on the prediction.
      *   *Scenario:* **The "Whistleblower's Drop."**
      *   Elias has data. He needs to upload it. Two servers: Alpha or Beta.
      *   The "Hunters" (Corporate Security AI) are monitoring. They will intercept the upload at whichever server they predict he will use.
      *   If Elias reasons "Alpha is faster," Hunters go to Alpha. Intercept.
      *   If Elias reasons "Beta is safer," Hunters go to Beta. Intercept.
      *   He needs to choose in a way the AI cannot predict.
      *   *This works.* It captures the symmetry and the need for randomness.

  3.  **Drafting - Scene by Scene:**
