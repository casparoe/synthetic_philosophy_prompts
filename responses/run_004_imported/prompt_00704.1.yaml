      *   **Constraint:** Do *not* retell "Death in Damascus" (no Death, no appointment book, no cities like Damascus/Aleppo/Cleveland). Needs a contemporary or invented setting.
      *   **Length:** Short story, 2-3 pages (roughly 1000-1500 words).
      *   **Focus:** Dramatize the bind. Dwell on the realization that *thinking clearly* is the danger.
      *   **Ending:** Ambiguous. Is the random choice an outwitting or a fulfillment?

