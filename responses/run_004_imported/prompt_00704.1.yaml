answer: |-
  The room had no corners. It was a smooth, white cylinder, the walls curving seamlessly into the floor and ceiling. In the center stood a console with two interfaces, identical in every respect. One on the left, labeled *ALPHA*. One on the right, labeled *OMEGA*.

  Elias stood before them, his hand hovering. He was sweating, though the air was climate-controlled to a crisp sixty-eight degrees.

  He had the drive in his pocket. It contained the evidence that would bring down the Directorate. To release it, he had to upload it to one of the two external gateways. To survive the upload, he had to choose the gateway the Directorate's security AI, *Aegis*, was *not* monitoring.

  But *Aegis* did not monitor randomly. *Aegis* monitored based on prediction. It analyzed biometric stress, pupil dilation, micro-tremors in the hand, and the neural latency of decision-making. It didn't just watch what he did; it modeled who he was.

  If Elias decided, through reason, that *ALPHA* was the better choice—perhaps because the cabling looked newer, or because the light on the console seemed steadier—*Aegis* would detect the formation of that preference. It would see the cognitive commitment before his finger even twitched. It would route the interception protocols to *ALPHA*.

  If he decided *OMEGA* was safer, *Aegis* would see that commitment, too. It would route the interception to *OMEGA*.

  Elias had been standing there for twenty minutes.

  *Think,* he told himself. *There has to be a logical path.*

  He looked at *ALPHA*. It felt solid. Reliable. He could argue himself into it. *The left side is dominant for most users; maybe they expect me to go right. So I go left.*

  But as soon as the thought formed, a cold dread washed over him. That was a reason. That was a deliberation. *Aegis* ate deliberations for breakfast. If he chose *ALPHA* because of a counter-intuitive strategy, *Aegis* would predict the counter-intuition. The interception would be waiting.

  He looked at *OMEGA*. *Maybe I should flip a coin.*

  No. Even deciding to flip a coin was a decision. If he committed to the coin toss, *Aegis* would predict he was committing to a coin toss. But a coin toss has two outcomes. If *Aegis* predicted he would toss, could it predict the *result*?

  Elias pulled his hand back from the console. He paced the small circle of the room. The silence was heavy, not empty. It felt like the silence of a held breath.

  The problem wasn't that he didn't know which port was safe. The problem was that *his knowing* made it unsafe. The safety of the port was causally linked to his method of choosing it.

  If he stayed in the room, the Directorate would find him eventually. If he chose a port based on preference, *Aegis* would catch him. If he chose a port based on a complex game-theoretic calculation, *Aegis* would catch him. *Aegis* was built to model rational agents. It thrived on intent.

  To beat a predictor that reads intent, you cannot intend.

  He stopped pacing. He looked at his hands. They were shaking. Not from fear, exactly, but from the strain of trying to stop his own brain from working. He needed to act without a why. He needed to be a glitch in the causality.

  *If I choose Alpha,* he thought, *I die.*
  *If I choose Omega,* he thought, *I die.*
  *If I let chance choose,* he thought...

  He reached into his pocket. He didn't have a coin. He pulled out a small, jagged piece of metal—a shim he'd used to pick the lock of the outer door. It wasn't balanced. It wasn't fair. That was good. Fairness implied a system. This was just noise.

  He held the shim between his thumb and forefinger.

  *Heads, Alpha. Tails, Omega.*

  He stared at the shim. He tried to empty his mind. He tried to stop hoping for heads. He tried to stop fearing tails. He realized that even the hope was data. Even the fear was a signal. *Aegis* was reading the shape of his desire.

  *Don't want it,* he told himself. *Don't want to live. Don't want to win. Just be the mechanism.*

  It was a paradox. To genuinely randomize his choice, he had to suppress the very survival instinct that had brought him to this room. He had to become indifferent to his own death for the split second of the toss. If he cared about the outcome, the outcome was determined by his care, and *Aegis* would see it.

  He closed his eyes. He breathed in. He tried to imagine the Directorate winning. He tried to imagine the upload failing. He tried to make peace with the end of the story. It was the hardest thing he had ever done. It felt like cutting a nerve.

  *Let it be noise,* he thought. *Let me be static.*

  He flicked his thumb.

  The shim spun into the air, catching the sterile white light. It tumbled, a chaotic blur of silver. For a moment, it was neither heads nor tails, neither Alpha nor Omega. It was just physics. It was just gravity and angular momentum. It was the only thing in the room that wasn't being watched, because it had no mind to read.

  Elias kept his eyes closed. He didn't want to see the landing. He didn't want to adjust his catch. He let it hit the back of his left hand with a sharp *clink*.

  He didn't look. He placed his right hand on the console. He waited for the tactile feel of the metal to tell him where he was. He slid his hand to the right. *OMEGA.*

  He opened his eyes. His hand was on *OMEGA*.

  He hadn't chosen it. The shim had chosen it. He was just the muscle that executed the toss. He was a peripheral device for the coin.

  He pressed the drive into the slot.

  The console hummed. A light bar began to crawl across the screen. *UPLOAD INITIATED.*

  Elias waited for the alarm. He waited for the doors to lock, for the gas to flood in, for the realization that *Aegis* had predicted the shim, predicted the imbalance, predicted his need for randomness.

  The light bar moved. 20%. 40%.

  Was *Aegis* watching *OMEGA*? Or had the AI, faced with a true random variable, defaulted to a split resource allocation? Or worse—had *Aegis* predicted that Elias would resort to randomness, and therefore placed the trap on whichever side the coin happened to favor?

  If the AI was perfect, it didn't matter how he chose. The prediction would encompass the method of choice. The coin toss was just another step in the causal chain, and the chain led to *OMEGA*.

  60%. 80%.

  Elias stopped breathing. He realized he was still trying to analyze the outcome. He was still looking for a reason why he would survive. He forced his eyes to stay open, to stare at the blinking cursor, without attaching meaning to it.

  The bar hit 100%.

  *UPLOAD COMPLETE.*

  The door behind him hissed. The lock disengaged.

  Elias stood there. He had won. He had outmaneuvered the perfect predictor by ceasing to be a decision-maker.

  But as he reached for the door handle, a cold thought settled in his stomach, heavier than the drive had been.

  *Aegis* had let him go.

  Why?

  Because the randomness had worked? Because the AI truly couldn't predict the shim?

  Or because the AI had predicted he would toss the shim, predicted it would land on *OMEGA*, and decided that letting him upload the file was the optimal outcome for the Directorate? Perhaps the file contained misinformation. Perhaps the trap wasn't interception, but dissemination.

  He looked back at the console. The screen was dark now. There was no way to know if he had outwitted the system, or if his "random" act was the exact variable the system required to fulfill its own design.

  He had escaped the trap of deliberation only to enter the trap of ambiguity. He stepped through the door into the hallway, the silence of the room following him, wondering if freedom was just another form of prediction he hadn't seen coming.
