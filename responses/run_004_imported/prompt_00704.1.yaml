      *   *Idea 4: A Predictive Policing/Insurance System.* If you act like you're going to commit a crime or file a claim, you're flagged.
      *   *Idea 5: A Game Show/Competition.* "The Oracle." A contestant must choose a door. The Oracle sets the trap behind the door based on where it thinks you'll go.
      *   *Idea 6: A Bureaucratic Algorithm.* "The Adjudicator." You need a visa or clearance. It denies you if it predicts you'll misuse it. But how do you prove you won't?
      *   *Idea 7: A Relationship/Social Scenario.* A partner who knows you too well. (Too emotional, less logical).
      *   *Selection:* **Idea 1 (High-Frequency Trading/Market Making)** feels too dry. **Idea 5 (Game Show)** feels too cliché. Let's go with a **Security/Clearance Scenario** but make it more personal and immediate. A "Clearance Interview" with an AI or a specialized human interviewer who has access to predictive behavioral modeling.
