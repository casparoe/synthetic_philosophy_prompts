      *   **Scene 3:** The Realization. Thinking is the leak. He needs noise.
      *   **Scene 4:** The Act. Flipping a coin (or using a randomizer).
      *   **Scene 5:** The Aftermath/Ambiguity. Did it work? Or did the AI predict the randomization?

  4.  **Refining the Logic:**
      *   Make sure the "Death in Damascus" logic is clear.
      *   *Damascus:* Stay -> Death is there.
