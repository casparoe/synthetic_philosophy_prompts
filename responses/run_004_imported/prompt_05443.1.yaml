answer: |-
  Your friend is half-right, but the "half-right" part is the dangerous bit. He is correct about the theoretical math, but he is ignoring the practical constraints that turn the theoretical optimum into a real-world disaster.

  Here is the breakdown of why Full Kelly is theoretically optimal but practically fragile, and why "Half-Kelly" is often the mathematically superior choice for actual humans and funds, even if their only goal is maximizing wealth.

  ### 1. The Theoretical Truth (Where your friend is right)
  Your friend is correct that if you know the **true** probabilities and payoffs, and you can bet **infinitely** many times without interruption, Full Kelly maximizes the expected logarithmic growth rate of your bankroll.

  He is also correct about the Ergodicity/Geometric Mean argument (popularized by Ole Peters and the LessWrong crowd). In a compounding system, the arithmetic mean (ensemble average) is misleading. If you bet 100% of your bankroll on a coin flip that pays 2x on heads and 0x on tails, your *arithmetic* expected value is positive (0.5 * 2 + 0.5 * 0 = 1.0, wait, bad example. Let's say 1.1x on heads).
  *   **Arithmetic Mean:** Suggests you get rich.
  *   **Geometric Mean:** Recognizes that one loss wipes you out to zero, and the geometric mean of any path containing a zero is zero.

  So, yes: for repeated compounding bets, maximizing the geometric mean (which is what Kelly does) is the correct objective function for growth. Maximizing arithmetic EV is indeed "naive" in that specific context.

  **However, this relies on a massive assumption: That you know the true edge.**

  ### 2. The Estimation Error Problem (The "Garbage In" Problem)
  This is the single strongest mathematical argument against Full Kelly and for Fractional Kelly.

  The Kelly formula requires precise inputs: the probability of winning ($p$) and the payoff odds ($b$). In a casino (like blackjack card counting), these are knowable. In financial markets, sports betting, or crypto, **they are estimates.**

  The Kelly function is **convex** with respect to estimation error.
  *   If you underestimate your edge, you bet less than optimal. You grow slightly slower, but you are safe.
  *   If you **overestimate** your edge (which is statistically almost guaranteed due to noise, luck, and overconfidence), Full Kelly tells you to bet *too much*.

  **The Math of Overbetting:**
  If you bet exactly double the Kelly amount (2x Kelly), your expected geometric growth rate drops to **zero**. You will tread water forever.
  If you bet *more* than double Kelly, your expected geometric growth becomes **negative**. You will inevitably go to zero, even if you have a genuine positive edge.

  Because almost every quant or trader overestimates their edge (due to overfitting data, ignoring transaction costs, or assuming past volatility predicts future volatility), Full Kelly is effectively betting into a zone where a small error in estimation turns a winning strategy into a bankrupting one.

  **Fractional Kelly (e.g., Half-Kelly) is not "cowardice"; it is a robustness buffer.** It accounts for the variance in your estimate of the edge. It acknowledges that your "calculated edge" is a distribution, not a fixed number. Half-Kelly puts you on the "safe side" of the curve where estimation errors reduce profit but do not cause ruin.

  ### 3. The Variance/Growth Efficiency Trade-off
  Even if you knew the true edge perfectly, Full Kelly is not the "efficient frontier" of investing.

  There is a mathematical property of the Kelly curve: **Volatility scales faster than growth.**
  *   **Full Kelly:** Maximizes growth rate ($G$).
  *   **Half-Kelly:** Achieves approximately **75% of the growth rate** of Full Kelly, but with only **50% of the volatility (variance)**.

  Think about that trade-off. By cutting your bet size in half, you give up only 25% of your potential compound return, but you cut the risk (drawdowns) in half.

  Why does this matter if you want to "maximize money"?
  1.  **Margin and Liquidity Constraints:** In the real world, if your portfolio drops 50% (a common drawdown in Full Kelly strategies), you might face margin calls, investor redemptions, or psychological forced liquidation. If you are forced to withdraw capital at the bottom of a drawdown, the compounding math breaks. Half-Kelly smooths the equity curve enough to keep you in the game.
  2.  **Diminishing Marginal Utility of Speed:** If Strategy A makes you $10M in 10 years with a 50% chance of a 60% drawdown, and Strategy B makes you $7.5M in 10 years with a 25% chance of a 30% drawdown, Strategy B is often "better" because the risk of ruin (or forced exit) during the drawdown phase is non-linear.

  This isn't about "risk tolerance" in the emotional sense; it's about the **mathematical efficiency of capital deployment.** Half-Kelly is often the "sweet spot" of efficiency.

  ### 4. Finite Horizons vs. Asymptotics
  Kelly is an **asymptotic** result. It guarantees optimality as $t \to \infty$.
  However, no trader has an infinite time horizon.

  In a finite number of bets, the distribution of outcomes under Full Kelly is extremely wide. While the *median* outcome is maximized, the *variance* of the terminal wealth is massive.
  If you have a finite goal (e.g., "I need to retire in 20 years"), maximizing the *median* outcome (Kelly) might expose you to a significant probability of falling below a necessary threshold, even if the *average* outcome is huge.

  While your friend argues that Arithmetic EV is naive, relying solely on the asymptotic geometric maximum is also naive if you don't live asymptotically. Fractional Kelly narrows the distribution of terminal wealth, increasing the probability that you actually achieve a "good enough" result within a human lifetime.

  ### 5. Summary: Is your friend right?
  **No.** Your friend is treating a theoretical model as a physical law without accounting for parameter uncertainty.

  *   **Is Geometric Mean the right metric?** Yes, for compounding repeated bets, maximizing geometric growth is superior to arithmetic EV.
  *   **Is Full Kelly the right way to maximize Geometric Mean?** Only if you know the true probabilities with 100% certainty.
  *   **Are Half-Kelly bettors cowards?** No. They are accounting for **estimation error** and **variance drag**.

  **The Verdict:**
  Full Kelly is the optimal strategy for a **god** who knows the future probabilities and cannot be forced to liquidate.
  Half-Kelly is the optimal strategy for a **human** who has to estimate probabilities and needs to survive the variance of the real world.

  Deviating from Full Kelly isn't leaving money on the table due to fear; it's paying an insurance premium against the very high probability that your edge calculation is slightly wrong. In quant trading, staying solvent is the primary constraint on maximizing money. Half-Kelly maximizes the probability of staying solvent while capturing the bulk of the growth. That is rational, not cowardly.
