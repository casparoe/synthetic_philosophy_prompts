      *   *Compensation:* Legal wants to pay. That's good, but the *admission* matters.
      *   *Key Distinction:* Liability (paying) vs. Responsibility (owning the cause). Legal is separating them. The user wants them linked.

  8.  **Final Polish:** Structure with clear headings. Ensure the distinction between *legal liability* and *moral responsibility* is clear. (This aligns with the user's "feels wrong" vs "violated a duty" conflict).

