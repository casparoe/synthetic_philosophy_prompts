      *   **Transition to the Bride:** How does she fit in? She solved the puzzle not by trickery, but by being a person of her word. She doesn't calculate her way out of commitments.
      *   **Transition to Marriage:** Address the "elephant in the room." Is marriage the toxin? No. Marriage is the *solution* to the puzzle. It changes the incentives.
      *   **The Vows:** Distinguish the puzzle's intention from wedding vows. The puzzle is about a one-off trick. Vows are about building a shared identity where "I" becomes "We."
      *   **Conclusion:** Raise a glass. Wish them well.

  5.  **Refining the Tone (Self-Correction during drafting):**
