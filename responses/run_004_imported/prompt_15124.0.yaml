  1.  **Analyze the Request:**
      *   **Occasion:** Wedding reception toast.
      *   **Recipient:** Closest friend from an old online rationalist forum.
      *   **Key Theme:** Gregory Kavka's Toxin Puzzle.
      *   **Constraint 1 (Audience):** Most guests don't know decision theory; need to explain the puzzle simply.
      *   **Constraint 2 (Content):** Use the puzzle's *mechanics* (intention vs. action, pre-commitment, trust), not just a vague "keeping promises" metaphor.
      *   **Constraint 3 (Tone/Meaning):** Say something specific and true about the bride.
      *   **Constraint 4 (Crucial Avoidance):** Do *not* imply that marriage vows are like the Toxin Puzzle (i.e., don't suggest the vows are irrational or impossible to keep). The puzzle is about a *false* intention; marriage is about a *true* one.
      *   **Length:** Approximately 5 minutes (roughly 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Toxin Puzzle:**
      *   *The Setup:* Billionaire offers money if you *intend* to drink a toxin tomorrow.
      *   *The Catch:* Money is deposited tonight based on the intention. Drinking happens tomorrow.
      *   *The Paradox:* Once you have the money, why drink? It makes you sick and gives no extra reward. Therefore, a purely rational actor can't form the intention because they know they won't follow through.
      *   *The Solution (generally accepted):* You need a reason to drink *other* than the money. You need to be the *kind of person* who follows through on intentions, or you need to bind yourself somehow. It's about identity and trustworthiness, not just immediate utility maximization.

  3.  **Bridge the Puzzle to Marriage:**
      *   *The Problem:* If marriage is just a transaction based on current feelings, what happens when feelings fade (the "money is in the bank" moment)?
      *   *The Contrast:* In the puzzle, the intention is instrumental (fake it to get the cash). In marriage, the intention is constitutive (the promise *makes* the relationship).
      *   *The Bride's Trait:* She isn't a "maximizer" who abandons ship when utility drops. She is a "commitment device." She values integrity and the bond itself over immediate optimization.
      *   *The Groom's Role:* He is the person who makes the "toxin" (hardships) worth facing, not because of a payout, but because they are in it together.

