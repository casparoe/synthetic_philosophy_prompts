answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I've had the privilege of knowing [Bride] for over a decade. We met in a very specific corner of the internet, a place where people gather to argue about logic, probability, and how to optimize their lives.

  Naturally, when [Bride] asked me to give this toast, she didn't ask for stories about how we met or how kind she is. She asked me to talk about Gregory Kavka's Toxin Puzzle.

  For the ninety percent of you currently checking your phones to see if this is a joke: don't worry. I'll explain.

  Imagine an eccentric billionaire offers you a deal. He has a vial of a substance that is foul-tasting and will make you violently ill for a day, but otherwise harmless. He tells you: "If, by midnight tonight, you sincerely *intend* to drink this toxin tomorrow afternoon, I will deposit one million dollars into your bank account."

  He has a machine that can scan your brain and detect your intentions with perfect accuracy. He isn't testing whether you *actually* drink it tomorrow. He is only testing whether you *intend* to drink it tonight.

  So, here is the trap. To get the million dollars, you must form the intention to drink the toxin. But, once midnight passes and the money is in your account, you have no reason to drink it. You've already been paid. Drinking it will only make you sick. A perfectly rational person knows this. And because they know they won't drink it tomorrow, they cannot sincerely intend to drink it tonight.

  The puzzle asks: Can a rational person ever make a promise they have no incentive to keep?

  [Bride] and I spent years arguing about this. Some people say the solution is to bind yourself—to hire a bodyguard to force you to drink it. Others say you just have to be irrational.

  But watching [Bride] over the last decade, I realized she solves the Toxin Puzzle not by trickery, and not by irrationality. She solves it by being a specific kind of person.

  There are people who make decisions based on what is optimal in the exact moment. If the incentive disappears, the promise disappears. But [Bride] is different. She is what we in the business call a "commitment device." When she forms an intention, she doesn't treat it as a prediction of her future behavior based on future incentives. She treats it as a binding constraint on her future self.

  She is the kind of person who drinks the toxin. Not because she wants to be sick, but because her integrity is worth more than the million dollars. She understands that the ability to commit—to make your future self obey your present self—is the only thing that allows us to build anything lasting.

  Now, I know what you're thinking. "Great, so marriage is the toxin? And the groom is the billionaire?"

  Absolutely not. And this is where the philosophy actually gets beautiful.

  In the Toxin Puzzle, the reward is separate from the act. You get the money *before* you suffer the cost. That separation is what makes the intention impossible.

  But marriage is the solution to that separation.

  [Bride] and [Groom], you are not entering a contract where the reward comes before the work. You are entering a state where the work *is* the reward.

  When you stand up here and make your vows, you are essentially telling the world: "We are removing the option to calculate." You are saying that when things get hard—when the "toxin" of life, stress, illness, or boredom shows up—you will not re-evaluate the utility of staying together. You will not wait for a brain scan to prove you intend to stick it out.

  You are building a shared identity where "I" becomes "We." And in that union, the rational choice changes. It is no longer irrational to sacrifice for the other person, because the other person *is* you.

  [Bride], you taught me that the only way to win the Toxin Puzzle is to be the kind of person who doesn't need a reason to keep their word other than the fact that they gave it.

  [Groom], you are the person who makes sure she never has to drink the toxin alone.

  So, if you could all raise your glasses.

  To [Bride] and [Groom]. May your intentions always be sincere, may your commitments always be binding, and may you never have to calculate the utility of loving one another.

  Cheers.
