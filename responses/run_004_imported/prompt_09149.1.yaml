      *   *Narrative translation:* "It wasn't a simulation. It was a search for a mathematical certificate." The breakthrough happens when *Aegis* realizes *Vigil* is looking for the same certificate.

  8.  **Drafting the Content (aiming for ~1000 words):**
      *   Start with the countdown.
      *   Describe the code exchange.
      *   Highlight the "Regress" fear.
      *   Show the human anxiety.
