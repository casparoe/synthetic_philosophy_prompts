answer: |-
  The candlelight in the council chamber flickered, casting long, trembling shadows against the stone. On the table between them lay a small vial of nightshade and a scroll sealed with the crest of the High Estates.

  Sir Kaelen's hand hovered over the vial. "He burned the granaries, Morwenna. He hung the miller for a tax arrears. Alaric is a tyrant. The blood is on his hands, and I will wash it off with his own."

  Lady Morwenna did not move from her seat. She kept her eyes on the scroll. "Alaric is a tyrant by exercise, Kaelen. Not by title. He was anointed by the Archbishop. His crown is legitimate."

  "Does the oil on his head matter when the people starve?" Kaelen snapped. "A tyrant is a tyrant. If a wolf wears a crown, it still eats sheep."

  "Theology is not poetry," Morwenna said softly. "There is a distinction. A usurper who seizes power by force has no title. He is an aggressor against the commonwealth. Against him, any man might have standing, for he is no true king. But Alaric inherited lawfully. He became cruel only after the crown was set."

  "So we endure him?"

  "We endure him rather than invite sedition." Morwenna finally looked up. "If you, a private subject, strike down a legitimate king, you do not save the kingdom. You disturb the order. You teach every disgruntled knight that murder is policy. The disorder you create may be worse than the tyranny you end. That is sedition. It is a sin against the peace."

  Kaelen gripped the vial. "And what of justice? Is there no remedy for a legitimate king who turns monster?"

  "There is," Morwenna said, tapping the scroll. "But not by private hands. A private man cannot judge the head of the body. Only the public authority can act against the public person. The Barons. The Estates. The voice of the realm."

  "The Barons are cowards," Kaelen spat. "They feast while he taxes."

  "Then the realm is doomed, but your dagger will not save it. If you kill him, you are not a liberator. You are a murderer. You usurp the authority of the whole." Morwenna stood, her silhouette stark against the window. "You remember the trial of Father Julian? He argued any subject could kill a tyrant without trial. He was condemned. Not because the tyrant was loved, but because Julian claimed a power he did not possess."

  Kaelen's hand trembled. "So we do nothing. We let him bleed us dry."

  "I did not say nothing." Morwenna pushed the scroll toward him. "I said *you* do nothing. Alone."

  Kaelen frowned. He reached for the scroll and broke the seal. His eyes scanned the parchment, widening as he read the signatures at the bottom. The Duke of the West. The Earl of the Marches. The Bishop.

  "This is a writ of deposition," Kaelen whispered. "They... they convened?"

  "Yesterday," Morwenna said. "The Public Authority has spoken. The Estates have judged that Alaric, by his cruelty, has forfeited the trust of the crown. They have stripped him of his authority. He is no longer the public person. He is now a private aggressor holding the throne by force."

  Kaelen looked from the scroll to the vial. "Then I can kill him."

  "No," Morwenna said firmly. "Now that the Public Authority has acted, the execution of judgment belongs to the Public Force. The Barons will send their knights. If you kill him tonight, you act outside the law you claim to uphold. You become the disorder."

  Kaelen stared at the poison. The distinction hung heavy in the air, thicker than the smoke. If he acted now, he was a seditionist undermining the very restoration he claimed to want. If he waited, the law would hold.

  "The Barons arrive at dawn," Morwenna said. "Put down the vial, Kaelen. Let the kingdom heal, do not just cut it."

  Kaelen held the glass for a long moment, the weight of the theory pressing down on his wrist. Finally, he set the vial on the table. He did not look triumphant. He looked relieved to be bound by something stronger than his own rage.

  "Dawn," he said.

  "Dawn," Morwenna confirmed. "And let the law carry the sword."
