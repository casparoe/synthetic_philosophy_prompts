answer: |-
  The short answer is **no**. Unfortunately, your proposed loophole does not work. Choosing a ranked system that violates the Independence of Irrelevant Alternatives (IIA), such as the Borda count, will **not** allow you to escape the Gibbard-Satterthwaite theorem.

  Here is the detailed breakdown of why this is the case, why the Borda count is likely to make your specific problem worse, and what options you actually have.

  ### 1. Why violating IIA doesn't dodge Gibbard-Satterthwaite

  You have correctly identified that Arrow's Impossibility Theorem relies on IIA to prove its result. However, you are mistaken about the Gibbard-Satterthwaite (G-S) theorem.

  *   **Arrow's Theorem** is about creating a fair **social ordering** (a complete ranking of all candidates) that satisfies certain consistency criteria. IIA is crucial there because it ensures the ranking between Candidate A and Candidate B doesn't flip just because Candidate C dropped out.
  *   **The Gibbard-Satterthwaite Theorem** is about **social choice** (picking a single winner) and **incentives**. It states that for any deterministic voting system with three or more candidates, if the system is not a dictatorship, there will always be situations where a voter can benefit by voting insincerely (tactical voting).

  **Crucially, the G-S theorem does not assume IIA.** It does not care whether your system satisfies IIA or violates it. The proof holds for *all* ranked voting systems (Plurality, Instant Runoff, Borda, Condorcet methods, etc.). Therefore, deliberately picking a system that violates IIA does not remove the constraint; the G-S theorem applies to Borda count just as strictly as it applies to systems that might satisfy IIA (though no ranked system with 3+ candidates can satisfy all of Arrow's criteria anyway).

  ### 2. The Borda Count is vulnerable to the exact behavior you want to stop

  You mentioned that students ranked their favorite second to stop a disliked candidate. This is a form of tactical voting known as **compromising**.

  The Borda count is notoriously susceptible to tactical voting, often even more so than other ranked systems.
  *   **Burying:** In Borda, you get points for every position. If you strongly dislike Candidate X, you have a huge incentive to rank them last, even if they are actually your second choice, to minimize their score.
  *   **Compromising:** If your favorite candidate (A) is perceived as weak, you might rank a stronger candidate (B) first to ensure someone you "tolerate" wins instead of someone you hate (C).

  Because Borda counts every rank position, every voter has a constant incentive to adjust their ballot based on who they think will win, rather than their true preferences. In fact, political scientists often cite Borda as one of the *most* manipulable ranked systems. Switching to Borda would likely increase the amount of gaming, not decrease it.

  ### 3. The Theoretical Reality Check

  The Gibbard-Satterthwaite theorem is an "impossibility theorem" for a reason. It proves that **no ranked voting system exists** that is perfectly immune to tactical voting (unless there are only two candidates or one person is a dictator).

  *   **Instant Runoff Voting (IRV):** Reduces the incentive to "compromise" (ranking a lesser evil first), but introduces the incentive for "favorite betrayal" (ranking your favorite lower to help them survive later rounds).
  *   **Condorcet Methods:** Can be vulnerable to "teaming" (running multiple similar candidates to swamp the count) or burial strategies.
  *   **Borda Count:** Vulnerable to burial and compromising.

  There is no mathematical "safe haven" among ranked ballots.

  ### 4. What can you actually do?

  Since mathematics dictates that you cannot eliminate tactical voting entirely with a ranked ballot, you have to look for practical mitigations rather than theoretical perfection.

  **A. Change the type of ballot (Cardinal Voting)**
  The G-S theorem applies to **ordinal** systems (ranking candidates 1st, 2nd, 3rd). It does not strictly apply in the same way to **cardinal** systems (rating candidates independently, like Score Voting or Approval Voting).
  *   **Approval Voting:** Voters select all candidates they approve of. This eliminates the "ranking favorite second" problem because you can approve both your favorite and the "lesser evil." It is much harder to game effectively without knowing exactly how others will vote.
  *   **Score Voting:** Voters give a score (e.g., 0-5) to each candidate. While Gibbard's later work shows no system is perfectly strategy-proof, Score Voting tends to encourage honest voting more often than ranked systems in real-world scenarios because there is no penalty for giving your favorite a high score and a viable candidate a high score as well.

  **B. Accept and Educate**
  If you must stick with ranked ballots (due to bylaws or tradition):
  *   **Acknowledge the flaw:** Admit to the student body that no system is perfect.
  *   **Education:** Teach students that "honest voting" is usually the best strategy in systems like Instant Runoff Voting (IRV), whereas in Borda, strategy is almost required.
  *   **Culture:** Foster a culture where tactical voting is frowned upon. In small elections like a high school council, social norms can be more powerful than mathematical incentives.

  ### Summary
  You cannot dodge the Gibbard-Satterthwaite theorem by violating IIA, because IIA is not a premise of that theorem. Furthermore, the Borda count is particularly prone to the exact tactical voting behavior you are trying to prevent. If you want to reduce the incentive to rank a favorite second, you should consider switching to **Approval Voting** or **Score Voting**, rather than looking for a different ranked system.
