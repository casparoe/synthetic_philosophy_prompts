      *   **2. Institutional Legitimacy & Trust:** A government agency isn't a lone moral agent. It relies on social contract. If the public perceives the system as abandoning the desperate for the trivial, compliance and trust erode. This is a *rule-consequentialist* argument, not just intuition.
