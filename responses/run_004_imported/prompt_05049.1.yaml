      *   Premise 2: Small harms/benefits sum up to large harms/benefits if $N$ is large enough.
      *   Premise 3: Refusing to aggregate is a cognitive bias (scope insensitivity).
      *   Conclusion: Therefore, policy should maximize total aggregate utility (QALYs), even if it ignores severe individual suffering for the sake of diffuse benefits.
