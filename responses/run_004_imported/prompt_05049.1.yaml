          *   Crucial point: In the toy case, the choice is *deterministic*. In health policy, it is *probabilistic*.
          *   Wait, the user mentioned "population that doesn't exist as individuals yet." This is the key. *Ex Ante* equality of opportunity.
          *   If I know I have a 0.001% chance of the degenerative disease and 100% chance of mild asthma, maybe I pick the inhaler. But if the degenerative disease means *ruin* and the asthma is *annoyance*, risk aversion dictates I prioritize avoiding ruin.
