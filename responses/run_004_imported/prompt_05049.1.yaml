      *   Earn the conclusion? Yes, use philosophical frameworks (Rawls, Rule Consequentialism, Prioritarianism).
      *   Address the "scope insensitivity" charge? Yes, reframe it as "moral weighting."

  8.  **Final Polish:** Ensure the tone is supportive but intellectually rigorous. (Self-Correction: Make sure not to just say "Rawls says X." Explain *why* it applies here specifically against the QALY aggregation).

      *   *Key insight to highlight:* The QALY measures *health*, not *justice*. Maximizing health output is not the same as distributing health justly. The supervisor is conflating efficiency with equity.

