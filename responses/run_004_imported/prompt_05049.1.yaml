  6.  **Finalizing the Argument Plan:**
      *   **Concession:** Grant the Torture/Specks math.
      *   **Point 1: The Veil of Ignorance (Ex Ante vs. Ex Post).** In the toy case, identities are fixed. In policy, we are all potential patients. Rational risk-aversion prioritizes catastrophe avoidance over aggregate optimization.
      *   **Point 2: The Legitimacy/Stability Constraint.** A state agency isn't a utilitarian calculator; it's a political institution. Abandoning the desperate undermines the social contract required to fund the system.
      *   **Point 3: Prioritarianism.** QALYs assume utility is linear. Moral philosophy often argues utility for the worse-off weighs heavier. This isn't bias; it's a different weighting function.
      *   **Synthesis:** The supervisor is committing a *category error* between individual moral arithmetic and institutional design principles.

  7.  **Review against Constraints:**
