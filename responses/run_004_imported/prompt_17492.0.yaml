answer: |-
  Good morning. For those who don't know me, I'm [Name]. I've spent the last two years embedded in this lab, watching interpretability researchers try to reverse-engineer neural networks while writing a book about whether they're finding structure or projecting shadows. When our keynote fell ill, I was asked to step in. I suspect the invitation was less about my expertise and more about my role as a translator between the two halves of this room.

  I know the temptation in a room like this. Half of you build sparse autoencoders to decompose activations; the other half read Fodor and Pylyshyn. More than one of you has already told me, unprompted, that the connectionist-classicist debate was settled in 1988. The argument was that neural networks lack the compositional structure required for genuine representation.

  But we are not in 1988. We are not arguing about backprop in the abstract. We are arguing about specific tensors in specific models. So, let's be plain about what is actually at stake today. It is not a semantic dispute about the definition of "representation." I promised you I would not say "it depends what you mean by that word." Because it doesn't.

  The disagreement is mechanistic. It is about causal leverage.

  On one side, we have the Interpretability Realists. Their claim is this: When a sparse autoencoder (SAE) identifies a feature direction in activation space that correlates with "goldfish," and that direction is sparse and monosemantic, the network is *using* that direction to compute. They argue that even if the network stores features in superposition—packing more features than neurons by overlapping them—the SAE successfully untangles the true causal joints of the system. To them, if you can intervene on that feature and predictably change the model's output, you have found a representation. It is real because it is a lever.

  On the other side, we have the Structural Skeptics. Many of you in this camp argue that finding a direction that correlates with "goldfish" is trivial. You can find a principal component that correlates with anything if you look hard enough. Your claim is that the SAE is imposing a human-readable basis onto a mathematical object that has no such basis intrinsically. The network doesn't "have" a goldfish feature; it has a high-dimensional vector state that *causes* goldfish tokens. The SAE feature is a post-hoc map, not the territory. It behaves *as if* it represents goldfish, but the representation exists in the eye of the interpreter, not in the causal machinery of the weights.

  This is not a debate about definitions. It is a debate about superposition.

  If features are truly superposed, they are not locally distinct. They interfere. So when an SAE separates them, is it recovering the network's native code, or is it performing a lossy compression that makes sense to *us* but not to the model?

  Here is the test we are actually arguing over: If I take the "goldfish" feature vector found by the SAE, and I ablate it, does the network fail specifically on goldfish reasoning? The Realist says yes, that proves the feature is causally efficacious. The Skeptic says no, that only proves the feature is correlated with the causal substrate. The substrate might be distributed across a thousand other directions that the SAE merely approximated.

  Fodor and Pylyshyn worried about systematicity. Today, the worry is about *ontology*. Are SAE features ontological primitives of the network's computation, or are they just convenient coordinate systems for human observers?

  If they are primitives, then mechanistic interpretability can eventually translate the model's thoughts. If they are coordinate systems, then interpretability is just advanced psychology—we are studying our own projection as much as the network's function.

  For the next two days, I ask that we stop asking "Is this a representation?" and start asking "Does this feature do work?" Let's look at the circuits. Let's look at the intervention data. Let's see if the structure holds up when we push it, rather than when we just look at it.

  The ghost of 1988 is in the room, but the models are new. Let's see if the old arguments survive contact with the new weights.

  Thank you.
