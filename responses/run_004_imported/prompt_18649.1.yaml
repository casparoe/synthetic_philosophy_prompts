answer: |-
  The throat was the first thing to return. It was a raw, scraping ache, a physical testament to the smoked salmon that had lodged there like a stopper in a bottle. Freddie Ayer lay in the private ward at Middlesex Hospital, the white sheets pulled up to his chest, staring at the ceiling. It was a plain ceiling. Plaster, paint, a hairline crack near the light fixture. Verifiable.

  Julian, a former student and now a colleague, sat in the visitor's chair, holding a bouquet of flowers that seemed aggressively alive against the sterile backdrop.

  "The press is outside, Freddie," Julian said softly. "They're calling it a miracle. They're calling it a conversion."

  Freddie turned his head slowly. The movement cost him energy. "Let them call it what they like. Language is slippery, Julian. You know that better than anyone."

  "They say you saw God."

  "I saw a light." Freddie's voice was a rasp, but the precision was intact. "A painfully bright red light. It possessed a certain... authority. And there were figures. Two of them. Ministers, I suppose you could say. They were concerned with the upkeep of space."

  Julian leaned forward. "And?"

  "And they had bungled it. The cosmos was in a bit of a state. They seemed to think I might help sort it out." Freddie closed his eyes. The memory of the light was not like a memory of a lecture hall or a dinner party. It did not have the texture of the past. It hummed, present and vibrating, behind his eyelids. "Nonsense, obviously."

  "Obviously," Julian echoed, though his tone wavered. "Hypoxia. The temporal lobe firing in the absence of oxygen. We can verify the cardiac arrest. We can verify the resuscitation. The rest is... neurological noise."

  "Precisely," Freddie said. He opened his eyes and looked at his own hand. He flexed the fingers. Matter in motion. Electrochemical signals. "A statement is only cognitively meaningful if it can be empirically verified. 'I saw the divine' is not verifiable. Therefore, it is meaningless. It is not false, Julian. It is nothing. It is a cry of pain, like 'Ouch,' mistaken for a proposition of fact."

  "Then why write the essay?" Julian asked. "Why title it *What I Saw When I Was Dead*? If it's meaningless, why give it a title?"

  Freddie was silent for a long moment. The monitor beside him beeped, a steady, rhythmic verification of his continued existence. *Beat. Pause. Beat.*

  "Because," Freddie said, "while the proposition is meaningless, the experience was not."

  He shifted, wincing as the IV tugger at his wrist. "I have spent a lifetime dismantling metaphysics. I have told students that to speak of the soul is to speak nonsense. To speak of an afterlife is to engage in linguistic confusion. And logically, nothing has changed. The red light does not constitute evidence. It cannot be tested. It cannot be repeated. It is a private sensation, no more proof of heaven than a migraine is proof of hell."

  "But?"

  Freddie looked away from his hand, toward the window. The London sky was a dull, smoggy grey. Verifiable weather. "But the conviction... the *feeling* of the thing. It was not a dream, Julian. Dreams fade. This remained. When I came back, I did not feel like a man who had woken up. I felt like a man who had been interrupted."

  He paused, searching for the words that wouldn't betray his life's work, yet wouldn't lie about his heart.

  "I find my confidence in the finality of death has been... eroded. Slightly. Not by argument. Argument requires premises, and I have no premises. But by a sensation. It is as if I have touched a wall I was certain was solid, and found my hand pass through it, even though my eyes tell me it is still there."

  "Does that frighten you?" Julian asked.

  Freddie chuckled, a dry, brittle sound. "It irritates me. It is intellectually untidy. I am an atheist, Julian. I wish to remain an atheist. The idea of a celestial bureaucracy managing space is absurd. I hope there is nothing. I hope that when the heart stops, the light goes out. I enjoy this world. I enjoy the salmon, when it does not choke me. I enjoy the argument. I do not want an eternity of it."

  "So you hope you are wrong about the feeling?"

  "I hope the feeling is a trick," Freddie corrected. "I hope it is a flicker of the dying brain. I want it to be meaningless." He looked back at Julian, his eyes sharp, defiant, yet shadowed by a profound uncertainty. "And yet. I cannot look at the crack in that ceiling and feel entirely certain that it is all there is. The verification principle stands. The logic holds. But the logic feels... thin. Like a net cast over an ocean. It catches the fish, yes. But it does not hold the water."

  Julian stood up, adjusting his coat. He looked at the great philosopher, the man who had banished God from language, now sitting in a hospital gown, haunted by a red light he insisted didn't exist.

  "What do I tell them, Freddie? The press?"

  Freddie lay back against the pillows. He could feel the beat of his heart, a drum in the dark. He knew, scientifically, that it was a pump. He knew, logically, that it would stop. But he remembered the silence between the beats, and the light that waited there.

  "Tell them," Freddie said, his voice dropping to a whisper, "that I saw a red light. Tell them it was magnificent. And tell them it proved nothing."

  He closed his eyes again, waiting for the darkness to return, terrified that it might not be empty, and terrified that it might.
