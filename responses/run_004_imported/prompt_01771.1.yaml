answer: |-
  The chart at the foot of the bed said *Deceased*. The hand in Elias's palm said *Here*.

  It was a Tuesday, or maybe a Thursday. The days blurred into the hum of the HVAC system and the rhythmic *hiss-click* of the ventilator. Elias rubbed his thumb over Sarah's knuckles. They were warm. Not the cooling waxen warmth of a body left too long in the sun, but the deep, radiating heat of blood moving, of metabolism churning.

  "Your nails are growing," Elias whispered. He had measured them last week with a ruler, a habit from his old life in the lab. Two millimeters. A dead thing does not synthesize keratin. A dead thing does not fight off the urinary tract infection she'd gotten three days ago, yet her white blood cell count had spiked and normalized without antibiotics.

  The door opened. Dr. Evans stepped in, holding a tablet like a shield. He was a good man, Elias knew. Kind eyes. But he spoke in categories.

  "Elias," Evans said softly. "We need to talk about the next steps. The organ procurement team is waiting on the final authorization."

  "She healed the scrape on her shin," Elias said. He didn't look up. He was watching the rise of the sheet over Sarah's chest. Driven by the machine, yes, but the lungs expanded, the oxygen exchanged, the hemoglobin turned from dark to bright red in the capillaries. "Dead tissue doesn't granulate, Doctor. I looked it up."

  Evans sighed, the sound of a man who has had this conversation a hundred times. "Somatic integration can persist for a time. It's a known phenomenon. But the brain, Elias. The brain is gone. The electricity is silent. That is the legal definition."

  "The law is a piece of paper," Elias said. "This is my wife."

  "I know." Evans moved closer, checking the monitors. The ECG showed a steady sinus rhythm. "But we can't keep a body indefinitely. It's not... sustainable."

  *Body.* Not *her*. Not *Sarah*.

  "When I die," Elias said, "will you wait for my heart to stop? Or will you turn off the machine and say I'm already gone?"

  "That's different. You aren't brain dead."

  "Am I?"

  The silence stretched, filled only by the ventilator. *Hiss. Click.*

  This was the gap. Elias lived in it. To the state, Sarah was a corpse being kept artificially warm for the sake of organs. To Elias, she was a woman in a deep, unbreakable sleep, whose body was still fighting to stay whole. He had read the papers the nurse slipped him when she thought he wasn't looking. Shewmon. The word felt heavy. It validated the knot in his stomach that refused to untie. If the body is a unified organism, and the body is healing, growing, gestating—how can the mind be the sole arbiter of the whole?

  But then there was the other side. The circulatory question.

  Last week, there had been a power flicker. The backup generator kicked in, but there was a three-second lag. The ventilator had alarm-chirped. Sarah's chest had stilled.

  Elias had grabbed her wrist. No pulse.

  For ten seconds, she was cold. Not physically, but existentially. She was a statue. Then the machine roared back to life, the lungs inflated, and the color returned to her lips.

  Was she dead for those ten seconds? The doctors said no, because the cessation wasn't permanent. But if they had walked in at second five, declared circulatory death, and stopped there, she would have been buried. The difference between a grieving widow and a murderer was often just a countdown timer. Two minutes. Five minutes. A bet that the heart wouldn't auto-resuscitate.

  "Elias," Evans said gently. "If we don't move forward, we have to discuss withdrawing support. Naturally."

  "Withdrawing support," Elias repeated. "That means she dies of circulatory failure. Then you wait two minutes. Then she is officially dead."

  "Yes."

  "But if you keep the machine on, she is officially dead now."

  "Legally, yes."

  "So death isn't a biological event anymore," Elias said, finally looking up. "It's an administrative one. It's a signature."

  Evans didn't answer. He couldn't.

  The doctor left, promising to return in an hour. Elias was alone with the ambiguity.

  He took a warm washcloth from the basin. He began to wash her face. This was the ritual. The sensory data that contradicted the chart. The skin was elastic. The cheeks flushed pink under the friction. A small cut on her lip from the intubation tube had closed up yesterday.

  *Homeostasis,* his chemist brain whispered. *The system is maintaining equilibrium.*

  But the eyes were open, fixed and dilated. The EEG was a flat line.

  Elias leaned down and rested his forehead against her shoulder. He could feel the vibration of the ventilator traveling through her ribs, but underneath that mechanical rhythm, there was something else. A subtle thrum. The gut peristalsis. The kidney filtration. The complex, silent chemistry of a living organism.

  He realized then that he wasn't waiting for her to wake up. Not anymore. He was waiting for the world to catch up to what his hands were telling him.

  He wasn't guarding a corpse. He wasn't guarding a patient. He was guarding the question itself.

  As long as the machine hummed, and as long as her skin remained warm to the touch, he would occupy this space where the definitions failed. He would be the witness to the paradox.

  "Two minutes," Elias whispered to the sleeping room, thinking of the countdown the doctors would use if the heart stopped. "That's all the time it takes to change a wife into a memory."

  He squeezed her hand. It squeezed back. Not a reflex, he told himself. He couldn't prove it, but he told himself.

  He sat down in the chair, pulled the blanket over his lap, and settled in. The chart said *Deceased*. The thermometer said *98.6*. Elias closed his eyes and listened to the breath that was both hers and the machine's, living in the space between the two.
