answer: |-
  This is an excellent question that cuts to the heart of Sidgwick's philosophical project. You have identified a genuine friction point: how does the rigorous, consensus-demanding intuitionist of *The Methods of Ethics* reconcile with the "pegging away" empiricist of the SPR?

  To help you prepare for your seminar, I will break this down into two parts: first, characterizing the evidential model in the SPR address, and second, testing its continuity with the epistemological conditions in *The Methods of Ethics*.

  ### 1. The Evidential Model: "Burying Incredulity"

  You ask whether this is a Humean reply regarding testimony or a purely inductive argument. The answer is that Sidgwick is employing a **cumulative probabilistic model**, which borrows from both but leans heavily on the mid-19th-century logic of scientific discovery (specifically Whewell and Mill).

  **Against a Strict Humean Reading**
  Hume's argument against miracles (*Enquiry Concerning Human Understanding*, Section X) posits that a wise man proportions his belief to the evidence, and since the evidence for a miracle is always outweighed by the uniform experience of natural law, testimony alone is insufficient.
  Sidgwick accepts the Humean premise that "scientific incredulity" is rational because it is based on "long growing" roots (uniform experience). However, he rejects the Humean conclusion that the prior improbability is *insurmountable*.
  *   **The Shift:** Sidgwick treats incredulity not as a logical barrier, but as a **high prior probability** that requires a correspondingly high volume of counter-evidence to shift.
  *   **The Mechanism:** When he speaks of witnesses with "credit to draw upon," he is treating credibility as a quantifiable asset. One witness cannot break the bank of scientific skepticism, but a portfolio of credible witnesses can. This is a **convergence of probabilities** argument. It is not that any single fact proves thought-transference; it is that the *coincidence* of many facts makes the hypothesis of "chance" or "fraud" less probable than the hypothesis of "genuine phenomenon."

  **The Inductive Weight**
  This is also deeply Millian. Sidgwick is arguing for **induction by accumulation**. In *A System of Logic*, Mill discusses how complex phenomena often require a "concurrence" of conditions to be verified. Sidgwick applies this to psychical research: because the phenomena are elusive (they don't happen on demand), you cannot use a single crucial experiment (*experimentum crucis*). You must instead build a "heap."
  *   **Key Distinction:** This is not "proof beyond reasonable doubt" (legal/deductive); it is "preponderance of evidence" (civil/probabilistic). Sidgwick is lowering the bar for *initial acceptance* of a field of study while keeping the bar high for *final certification*.

  ### 2. Tension with *The Methods of Ethics*

  Now, does this sit easily with *The Methods of Ethics* (MoE)? In Book III, Chapter XI ("The Philosophy of Common Sense"), Sidgwick outlines the conditions under which a moral intuition can be considered valid. The four criteria are:
  1.  **Clarity:** The terms must be precise.
  2.  **Reflection:** The proposition must be self-evident upon careful thought.
  3.  **Consistency:** Intuitions must not conflict.
  4.  **Consensus of Experts:** There must be agreement among competent judges.

  Here is where the tension—and the continuity—lies.

  **The Continuity: Social Epistemology**
  Sidgwick is consistently a **social epistemologist**. In both Ethics and Psychical Research, he distrusts the solitary mind.
  *   In **Ethics**, if a moral axiom is disputed by other competent philosophers, Sidgwick suspends judgment. He treats the "consensus of experts" as a necessary check against individual bias.
  *   In **SPR**, he explicitly relies on witnesses with "credit." He is not asking us to trust the *phenomenon* directly, but to trust the *judgment* of the credible observers.
  *   **Synthesis:** In both cases, Sidgwick argues that truth is not just a relation between a mind and a fact, but a relation between a community of inquirers and a fact. The "credit" of the SPR witness is the empirical analogue to the "competence" of the ethical expert.

  **The Tension: The Role of Disagreement**
  This is the critical point for your seminar.
  *   **In Ethics:** Lack of consensus is **defeasible**. If the experts disagree, the intuition is not self-evident, and the claim fails (or must be reformulated). The consensus is a *condition of validity*.
  *   **In SPR:** Lack of consensus (scientific incredulity) is **motivating**. Sidgwick admits the experts (scientists) currently disagree with him. But rather than abandoning the claim, he proposes a research program to *force* a consensus through accumulation. The consensus is a *goal of inquiry*.

  **How to Resolve the Tension**
  You can argue that Sidgwick distinguishes between **Rational Intuition** (Ethics) and **Empirical Induction** (SPR).
  *   **Ethics:** Deals with necessary truths. If they are truly self-evident, agreement should be immediate among competent minds. Persistent disagreement suggests error in the intuition itself.
  *   **SPR:** Deals with contingent, empirical facts. Disagreement here is expected because the data is difficult to gather ("elusive phenomena"). Therefore, the lack of consensus does not falsify the claim; it merely indicates the data heap is not yet high enough.

  However, a sharper critique (which might spark good seminar discussion) is that Sidgwick is being **strategically inconsistent**. He uses the "consensus of experts" in Ethics to dampen dogmatic moral claims, but in SPR, he is arguably being dogmatic by insisting the evidence *will* eventually compel consensus, despite the current lack thereof. He is protecting psychical research from the very skeptical scrutiny he applies to moral intuitions.

  ### 3. The "Hidden" Philosophical Stake

  To truly understand why Sidgwick tolerates this tension, you should mention his broader philosophical anxiety. Sidgwick was deeply worried that a materialist worldview undermined the rationality of morality (specifically the reconciliation of Duty and Self-Interest).
  *   If death is the end, why be moral when immorality pays?
  *   If psychical research proves survival after death, the "sanctions" of morality are restored.

  Sidgwick's epistemology in the SPR address is driven by a **pragmatic need for hope**. He needs the "heap of facts" to exist because his ethical system *needs* the possibility of a theological underpinning to remain fully rational. This explains why he is willing to "peg away" despite incredulity: the stakes for his ethical system are too high to let scientific materialism win by default.

  ### Seminar Talking Points

  Here are three specific angles you can raise in discussion:

  1.  **The Financial Metaphor:** Ask the group to analyze the economic language ("credit," "draw upon," "draft"). Does this reduce epistemology to a marketplace of reputation? Does this align with his view of "competent judges" in *Methods*?
  2.  **The Definition of "Expert":** In *Methods*, the experts are moral philosophers. In SPR, the experts are scientists. Sidgwick is essentially asking scientists to become experts in a field they reject. Is this a category error, or a legitimate expansion of scientific competence?
  3.  **Fallibilism vs. Tenacity:** Sidgwick is the great fallibilist of Victorian ethics. Does his SPR address show the limits of his fallibilism? Is he clinging to psychical research with a tenacity he would criticize in a moral dogmatist?

  ### Summary for your preparation
  Sidgwick is using a **cumulative probabilistic model** to overcome high prior improbability. This is **continuous** with his *Methods of Ethics* in its reliance on social epistemology (trust in competent judges/credit). However, it is in **tension** regarding the function of disagreement: in Ethics, disagreement invalidates; in SPR, disagreement motivates further accumulation. This tension is likely sustained by Sidgwick's hope that psychical research can secure the theological premises his Utilitarianism requires.
