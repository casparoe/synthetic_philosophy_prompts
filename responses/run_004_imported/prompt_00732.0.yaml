      *   **Key Passage:** Sidgwick's 1882 SPR Presidential Address regarding "scientific incredulity" and the need to accumulate a "heap of facts" rather than relying on single pieces of evidence.
      *   **Core Question 1:** What model of evidential reasoning is Sidgwick using here? (Humean testimony vs. inductive weight-of-evidence?)
      *   **Core Question 2:** Does this approach align with or tension with his epistemological conditions in *The Methods of Ethics* (specifically the "consensus of experts")?
      *   **Goal:** Provide a clear analysis to help the user prepare for a seminar discussion.

  2.  **Deconstruct the SPR Passage:**
      *   *Context:* Founding President of the Society for Psychical Research (SPR). Goal: Legitimize the study of telepathy/mediumship/etc. against "scientific incredulity."
      *   *Metaphor:* "Burying [incredulity] alive under a heap of facts."
      *   *Mechanism:* Accumulation of witnesses ("credit to draw upon"), experiments, and facts. No single piece is decisive.
      *   *Underlying Logic:* It's not about one knockout blow (deductive or singular inductive proof). It's about aggregate weight overcoming a high prior probability of falsehood (incredulity).
      *   *Reference:* De Morgan (probability/logic) and Lincoln (persistence).

  3.  **Analyze Question 1: Model of Evidential Reasoning:**
      *   *Hume on Miracles:* Hume argues that no testimony is sufficient to establish a miracle unless the falsehood of the testimony would be *more* miraculous than the event. Sidgwick seems to be pushing back against a Humean *dismissal*, but using a Humean *calculus*. He admits incredulity has "strong roots" (high prior improbability). He argues that *accumulated* testimony can outweigh this. This looks like a Bayesian update before Bayes was named: $P(H|E) \propto P(E|H) \times P(H)$. If $P(H)$ is low (incredulity), you need a lot of $E$ (facts/witnesses).
      *   *Inductive Weight:* It's also Millian induction. Multiple instances, varying conditions, building a generalization.
      *   *Sidgwick's Specific Twist:* It's not just "more witnesses." It's witnesses with "credit" (authority/competence). This introduces a social epistemology element. It's about *credibility* aggregating to shift *consensus*.
      *   *Conclusion on Q1:* It's a hybrid. It acknowledges the Humean problem (prior improbability) but proposes a cumulative inductive solution that relies heavily on the *authority* of the observers. It's a "convergence of probabilities" model.

  4.  **Analyze Question 2: Tension with *The Methods of Ethics* (MoE):**
      *   *MoE Epistemology:* Sidgwick is a rationalist/intuitionist regarding first principles (Utilitarianism, Prudence, Justice). But how do we verify them?
      *   *Conditions for Certainty:* In MoE (Book III, Chapter XI), Sidgwick outlines criteria for valid intuition:
          1.  Clarity and precision of terms.
          2.  Self-evidence (careful reflection).
          3.  Consistency (no conflict between intuitions).
          4.  **Consensus of Experts:** "The agreement of experts" is a crucial test. If informed, intelligent people disagree, the intuition isn't self-evident.
      *   *The Tension:*
          *   In *Psychical Research*: He is trying to *create* a consensus where none exists (against "scientific incredulity"). He admits the experts (scientists) are currently incredulous. He wants to bury *their* incredulity under facts.
          *   In *Ethics*: He relies on the *existing* consensus of experts (philosophers/moralists) to validate intuitions. If there's disagreement, he suspends judgment or seeks reconciliation.
          *   *Key Difference:* In Ethics, the "experts" are those trained in philosophical reflection. In SPR, the "experts" are scientists who are currently hostile. Sidgwick is asking scientists to become experts in a new field.
          *   *Continuity:* Both rely on the *ideal* of a rational consensus. In Ethics, it's a check against dogmatism. In SPR, it's the *goal* of the research program. He treats scientific incredulity not as a refutation but as a "prejudice" to be overcome by better data, eventually leading to a new consensus.
          *   *The "Credit" Point:* In SPR, he values witnesses with "credit." In Ethics, he values the judgment of those with "competence." This is continuous.
      *   *Potential Conflict:* In Ethics, if the consensus isn't there, the intuition fails. In SPR, if the consensus isn't there (yet), he says "keep pegging away." Is this dogmatic? Or just provisional? Sidgwick views SPR as *empirical* science, whereas Ethics is *rational* intuition. So the epistemological standards *should* differ (empirical accumulation vs. rational reflection).

