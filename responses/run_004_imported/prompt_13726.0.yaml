answer: |-
  Your boyfriend isn't just being weirdly philosophical; he's actually tapping into a genuine distinction that ethicists and philosophers talk about regarding **moral agency** versus **technical expertise**.

  While it feels intuitive to trust a wise friend in both scenarios, there is a meaningful difference between outsourcing a factual judgment and outsourcing a moral one. Here is why that distinction matters, and why the missing "why" is the most important part of this story.

  ### 1. Expertise vs. Alignment
  When you ask Jill about a contractor, you are asking for **epistemic authority**. You are acknowledging that she knows something you don't (market rates, reliability, quality of work). The "right" answer is objective: the contractor who does the best job for the best price. You don't need to understand *why* Contractor A is better than Contractor B to benefit from the result. If the roof doesn't leak, the decision was correct.

  When you ask Jill about inheritance, you are asking for **moral alignment**. There is no objective "right" answer to fairness. There are only competing values: *Is fairness about equality (splitting evenly)? Or is it about equity (rewarding labor)? Or is it about respecting the dead's wishes?*

  When you outsource a moral decision without asking for the reasoning, you aren't borrowing expertise; you are borrowing **conviction**. If you don't know *why* keeping the money is right, you can't truly stand behind that advice. You are essentially telling your cousin, "The moral rule here is to do what Jill says," rather than, "The moral principle here is that caretaking deserves compensation."

  ### 2. The Function of Reasoning
  You asked: *"Does it matter at all that I only wanted her answer and never asked for her reasoning?"*

  In a factual decision: **No, not really.** If Jill says "Hire Bob," and Bob fixes the leak, Jill's reasoning is irrelevant to the outcome.

  In a moral decision: **Yes, it matters immensely.**
  *   **Internalization:** Moral decisions require us to live with the consequences. For your cousin to let go of her guilt, she needs to believe the decision is *virtuous*, not just *authorized*. If she keeps the money just because Jill said so, the guilt might return the moment Jill isn't around to validate her.
  *   **Defense:** If the siblings complain, your cousin needs a moral argument ("I cared for him for five years"), not an appeal to authority ("My cousin's friend said it's okay").
  *   **Growth:** Engaging with the *why* helps you refine your own moral compass for next time. Skipping the reasoning leaves you morally dependent on Jill forever.

  ### 3. Moral Abdication vs. Moral Counsel
  There is a difference between seeking **counsel** and seeking a **verdict**.

  *   **Moral Counsel:** "Jill, here is the situation. I'm torn between respecting the will and family harmony. What factors should I consider?" (This preserves your agency; you weigh the factors Jill gives you.)
  *   **Moral Verdict:** "Jill, what should I tell her to do? I'll say whatever you say." (This abdicates your agency.)

  Your boyfriend is noticing that you treated a moral question like a verdict. By not asking Jill *why*, you turned her into a moral oracle rather than a thoughtful friend. This makes the advice brittle. If Jill is wrong (or if her values don't actually match your cousin's situation), you have no framework to realize it.

  ### 4. The "Cousin" Factor
  There is a second layer here: Your cousin asked *you*. She wanted *your* support. By channeling Jill, you inadvertently signaled that you didn't feel confident enough in your own moral judgment to support her.

  If you had asked Jill for her reasoning, you could have told your cousin: *"I talked to Jill, and she pointed out that your uncle explicitly wanted to reward your labor, and that ignoring his wishes might actually be more disrespectful than splitting the money. Does that resonate with you?"*

  That invites your cousin to think. Passing along just the verdict ("Keep it") shuts down thinking.

  ### The Verdict on Your Boyfriend's Point
  Your boyfriend is right that there is a difference, but he might be wrong if he implies you *shouldn't* ask for help. We absolutely should consult others on moral dilemmas.

  The difference is this:
  *   With a **contractor**, you outsource the **decision**.
  *   With **morals**, you should outsource the **perspective**, but keep the **decision**.

  By skipping the "why," you treated a values-based question like a multiple-choice test where Jill had the answer key. Morality isn't multiple-choice; it's an essay. You need to show your work to believe the grade.

  So, is your boyfriend being weirdly philosophical? A little. But on the core point—that moral reasoning belongs to the person making the choice, and skipping the "why" undermines that ownership—he's actually spot on.
