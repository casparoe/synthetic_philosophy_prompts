answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I have the distinct privilege of having watched [Groom] and [Bride] fall in love in the library carrels of the economics department.

  Looking around the room, I see a split audience. About half of you are economists, and the other half are sane people who just want to know if the open bar is unlimited. I promise to speak to both of you.

  [Groom] and [Bride] met on day one of the PhD program. They bonded immediately over a shared passion: the fundamental architecture of human welfare. And by "bonded," I mean they have been arguing productively and aggressively about it ever since.

  Their intellectual conflict is the engine of their relationship. [Groom] built his dissertation on the work of Lionel Robbins, who famously argued that comparing happiness between two different people is scientifically impossible. According to Robbins, saying "she is happier than he is" isn't a fact; it's a value judgment dressed up as science. We can't get inside each other's heads. We can't measure it. So, we shouldn't pretend we can.

  [Bride], on the other hand, works in the tradition of Harsanyi and Sen. She argues that if we don't readmit some degree of interpersonal comparability, welfare economics is useless. We can't rank social outcomes. We can't make policy. We can't do anything. She has spent the better part of a decade dismantling [Groom]'s papers during conference Q&A sessions on exactly this point.

  Now, for the non-economists, here is the joke you need to understand the dynamic.

  Lionel Robbins argued that comparing utility between people is impossible. Which is very convenient for [Groom], because it means he can stand up today and claim he is the happiest man in the room without providing any empirical data. He is theoretically protected from verification.

  However, [Bride]'s research insists that if you don't compare welfare, you can't make decisions. So, while [Groom] maintains that her happiness is a black box he cannot scientifically open, [Bride] has spent the last five years ensuring his happiness metrics are accurate, usually by correcting him when he assumes he knows what she wants.

  Basically, he thinks this marriage is a beautiful hypothesis that cannot be tested. She knows it's a dataset that requires daily maintenance.

  But I want to arrive somewhere honest, rather than just clever. Because looking at them, I realize that this theoretical impasse is exactly why they are going to succeed.

  Marriage, at its core, is the problem of interpersonal utility comparison. It is the daily, impossible task of weighing another person's joy against your own, another person's pain against your own, without ever truly having their data.

  If you are purely Robbinsian about it, you end up isolated. You say, "I can never truly know what you feel, so I will stop trying to measure it." That is a lonely way to live.

  But if you are purely Harsanyi-Sen about it, you risk arrogance. You assume you know what is good for the other person. You impose your welfare function on them. That is a suffocating way to live.

  [Groom] and [Bride] work because they hold both truths at once.

  [Groom] brings the humility of Robbins. He knows he cannot fully know her. He respects the opacity of her inner life. He doesn't assume her utility is just a mirror of his.

  [Bride] brings the ambition of Sen. She insists that despite the impossibility, they must make the comparison. They must try to rank the outcomes. They must decide, together, what makes a "good life" for the unit of two that they now are.

  They are suited for this because they don't take the comparison for granted. They argue about it. They check the assumptions. They challenge the weights in the function.

  In a world where many couples assume they know what the other is thinking, these two verify. In a world where many couples stop asking if the other is happy because "of course you are," these two treat happiness as a variable that needs constant estimation.

  So, to the happy couple: May your life together be Pareto optimal. May you continue to challenge each other's identifying assumptions. And may you find that while science may not be able to settle interpersonal comparisons of utility, love is the only value judgment that matters.

  To [Groom] and [Bride].
