prompt: |-
  Okay so for my seminar on collective rationality (it's this weird interdisciplinary mashup cross-listed with the law school) we just spent two weeks on judgment aggregation, and I feel like I've got the baby case down but I'm totally lost on the general theorem. The baby case is the Kornhauser and Sager court example: three judges, two premises (was there a valid contract? was there a breach?) and a conclusion (liable iff both premises hold). Everyone's individual judgments are perfectly consistent, but if you take a majority vote premise-by-premise you get "liable," and if you vote straight on the conclusion instead you get "not liable." I get why that can happen -- it's basically Condorcet's paradox except with logically connected propositions instead of preference orderings.

  What I can't wrap my head around is List and Pettit's actual impossibility result, the one that's supposed to be the "Arrow's theorem" of judgment aggregation. Every summary I've read just lists the conditions -- universal domain, anonymity, and this thing called "systematicity" thats apparently independence and neutrality bundled into one axiom -- and then jumps straight to "therefore dictatorship (or flat-out impossibility once you also demand anonymity)" like that's supposed to be self-evident. I don't have any gut-level sense of why forcing the aggregation rule to treat every proposition "the same way" instead of case-by-case is doing all the work. Like, with Arrow I eventually got the pairwise-comparison trick explained to me and it clicked, but I can't reconstruct an equivalent click for the judgment aggregation version on my own, and my prof kind of breezed past it in lecture.

  Could you walk me through the intuition behind this (not a symbol-pushing proof, I can get that from the readings if I need it) -- like why does making the rule "systematic" across propositions specifically force you into a dictator or an oligarchy of judges, rather than some other bad outcome? And if you don't mind, could you tie it back to why people talk about premise-based vs. conclusion-based procedures as basically a decision about wich axiom to give up? My professor mentioned that connection in passing and I'd like to actually understand it before I try to use it in my term paper, instead of just gesturing at "well, they sacrifice systematicity" and hoping nobody asks a follow-up.
