answer: |-
  You are absolutely not being pedantic. You won the argument.

  Your friend is describing a standard economic mechanism, but you are correct that conflating it with "pure time preference" obscures the ethical weight of the decision. In climate economics, this distinction isn't just semantic hair-splitting; it is the single most important factor in determining whether we recommend aggressive action today or kicking the can down the road.

  Here is the breakdown of the concepts, the equation you remember, and why the Stern vs. Nordhaus debate proves you right.

  ### 1. The Equation: The Ramsey Rule
  The equation you are vaguely remembering is the **Ramsey Rule** for the social discount rate ($r$). It decomposes the discount rate into two distinct parts:

  $$r = \rho + \eta \cdot g$$

  Here is what the variables mean:

  *   **$r$ (Social Discount Rate):** The rate at which we discount future costs and benefits.
  *   **$\rho$ (Rho - Pure Rate of Time Preference):** This is the "impatience" parameter. It asks: *Do we value the wellbeing of people in the future less than people today simply because they exist in the future?*
  *   **$\eta$ (Eta - Elasticity of Marginal Utility):** This measures how quickly the value of an extra dollar diminishes as you get richer. It is essentially a measure of **inequality aversion**.
  *   **$g$ (Growth Rate):** The expected growth in per capita consumption. How much richer will the future be?

  ### 2. The Conceptual Difference
  Your friend is arguing about the second part of the equation ($\eta \cdot g$), but calling it the whole thing ($r$). Here is why economists and philosophers insist on keeping them apart:

  #### Pure Time Preference ($\rho$)
  This is an **ethical** parameter.
  *   **What it says:** "A unit of wellbeing in 2100 is intrinsically worth less than a unit of wellbeing in 2024, just because of the date."
  *   **The implication:** It discriminates against future generations based on their location in time.
  *   **The consensus:** Most moral philosophers (and many economists) argue $\rho$ should be near zero. Frank Ramsey, the guy who invented this equation, famously called a positive pure time preference **"ethically indefensible and a mere concession to human weakness."** If you set $\rho > 0$, you are saying future people matter less than us, full stop.

  #### Diminishing Marginal Utility ($\eta \cdot g$)
  This is an **economic/descriptive** parameter.
  *   **What it says:** "We value the wellbeing of people in 2100 *equally* to people today. However, if people in 2100 are much richer than us, an extra dollar gives them less happiness than it gives us."
  *   **The implication:** We aren't discounting *people*; we are discounting *consumption*. If we are poor and they are rich, transferring a dollar from us to them might actually lower total global welfare.
  *   **The justification:** This relies on the assumption of economic growth ($g$). If the future is catastrophically poor due to climate change, this term shrinks, and the discount rate drops.

  **Why keep them apart?**
  If you lump them together into one "discount rate," you hide the ethical choice.
  *   If I say, "I use a 5% discount rate," you don't know if that's because I think future people don't matter ($\rho$) or because I think they will be incredibly rich ($\eta \cdot g$).
  *   By separating them, we force the economist to admit: "I am assuming future generations matter less intrinsically" (which is controversial) vs. "I am assuming future generations will be wealthy" (which is an empirical forecast that can be debated).

  ### 3. The Stern vs. Nordhaus Fight (The Bonus Round)
  This distinction is exactly what drove the famous debate between **Nicholas Stern** (author of the *Stern Review*, 2006) and **William Nordhaus** (Nobel laureate).

  **Nicholas Stern (The User's Side)**
  *   **Approach:** Prescriptive/Ethical.
  *   **Parameters:** He set $\rho$ at **0.1%** (virtually zero). He argued we have no ethical right to discriminate against future generations. He used a standard $\eta$ of 1.
  *   **Result:** Because $\rho$ was so low, his overall discount rate ($r$) was very low (~1.4%).
  *   **Policy:** A low discount rate means future damages (climate catastrophe in 2100) look huge in present-value terms. We should spend a lot of money *now* to prevent them.

  **William Nordhaus (The Friend's Side)**
  *   **Approach:** Descriptive/Market-based.
  *   **Parameters:** He argued we should use observed market interest rates to determine $r$. Market rates imply a much higher $\rho$ (people *act* like they are impatient).
  *   **Result:** His overall discount rate was higher (~4–6%).
  *   **Policy:** A high discount rate means future damages look small in present-value terms. We should spend less now and phase in regulations slowly.

  **Where your friend fits in:**
  Your friend is using the logic of the $\eta \cdot g$ term ("they will be richer, so a dollar matters less") to justify a high discount rate.
  *   **The Trap:** If you assume high growth ($g$) and high elasticity ($\eta$), you get a high discount rate *without* admitting you have a high pure time preference ($\rho$).
  *   **The Problem:** If climate change *stops* that growth (i.e., $g$ becomes negative or zero because of environmental collapse), the $\eta \cdot g$ justification vanishes. If the future is poorer than us, diminishing marginal utility suggests we should sacrifice *more* for them, not less.
  *   **The "Shady" Part:** By calling the whole thing "time preference," your friend implies that discounting is a natural fact of economics (like interest rates), rather than an ethical choice about how much we value the lives of our grandchildren.

  ### The Tiebreaker Verdict
  Tell your friend this:

  > "You are describing the **wealth effect** ($\eta \cdot g$), not **pure time preference** ($\rho$).
  >
  > If you argue we should discount the future because they will be richer, that is a contingent economic forecast. If climate change makes them poorer, your argument flips, and we should invest *more*.
  >
  > But if you argue we should discount the future simply because it is the future ($\rho$), that is an ethical claim that future lives are worth less than ours.
  >
  > Economists keep them separate so we don't sneak controversial ethical assumptions (that future people don't matter) inside of empirical assumptions (that future people will be rich). Conflating them is exactly what allows high discount rates to look 'objective' when they are actually moral judgments."

  You aren't being pedantic; you're identifying the central ethical tension in climate economics. You win.
