          *   $\rho$ (rho): Pure Rate of Time Preference (PRTP). This is the "impatience" parameter. Do we value the present intrinsically more than the future *just because* it's the present?
          *   $\eta$ (eta): Elasticity of Marginal Utility of Consumption. This measures how much less valuable an extra dollar is as you get richer (diminishing marginal utility). It also relates to inequality aversion.
          *   $g$: Growth rate of per capita consumption. How much richer will the future be?
      *   *The Friend's Argument:* Focuses on $\eta \cdot g$. If future people are richer ($g > 0$) and money matters less to rich people ($\eta > 0$), then we should discount their consumption.
      *   *The User's Argument:* Focuses on $\rho$. The friend is calling the whole thing "time preference," but the ethical weight lies mostly in $\rho$. $\rho$ implies the future matters less *by definition*, which many philosophers (and the user) find ethically indefensible.

  3.  **Address the Conceptual Difference:**
      *   **Pure Time Preference ($\rho$):** Ethical/Philosophical. "I care less about 2100 than 2024 simply because it is 2100." Often viewed as discriminatory against future generations. Ramsey called it "ethically indefensible."
      *   **Diminishing Marginal Utility ($\eta \cdot g$):** Economic/Descriptive. "I care about 2100 just as much, *but* if they are richer, a dollar helps them less than it helps us now." This is about *what* we are discounting (consumption/welfare), not *who* (future people).
