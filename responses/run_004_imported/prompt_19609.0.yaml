          *   Ben: The NCL is functionally analogous but structurally distinct. The connectivity patterns differ.
          *   Alex: But the *output* and the *learning rules* look the same. Reinforcement learning models fit both.
      *   **Deep Dive 4: Phenomenology (The "Feel"):**
          *   The user asked about "feeling" curiosity/boredom.
          *   Ben: If the neural substrate for *affect* is different, is the *feeling* different?
