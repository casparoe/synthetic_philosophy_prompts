answer: |-
  This is a fantastic question, and you have hit on one of the most common points of confusion regarding the history of quantum foundations. You aren't misunderstanding the math so much as the *target* of Bell's theorem.

  The short answer is: **Bell's Theorem does not rule out Bohmian Mechanics. It rules out *Local* Hidden Variable theories. Bohmian Mechanics is explicitly *Non-Local*.**

  In fact, Bell's theorem can be read as saying: *"Bohm was right all along; hidden variables are possible, but the price of admission is non-locality."*

  Here is the breakdown of where the confusion lies, why Bell admired Bohm, and why the 2022 Nobel Prize doesn't kill Pilot-Wave theory.

  ### 1. The Crucial Distinction: Local vs. Non-Local
  Your misunderstanding stems from this sentence: *"And the punchline of the theorem is that you can't: any hidden-variable theory that reproduces QM's predictions has to be nonlocal, full stop."*

  You interpreted this as: *"Therefore, hidden-variable theories are impossible/bad/refuted."*

  But the logical conclusion is actually: *"Therefore, any valid hidden-variable theory **must** be non-local."*

  *   **Standard QM (Copenhagen):** Non-local correlations (entanglement), but no hidden variables.
  *   **Many-Worlds:** Local dynamics (unitary evolution), but no single outcome (so Bell inequalities don't apply in the standard way).
  *   **Bohmian Mechanics:** **Hidden variables + Non-locality.**

  Bell proved that you cannot have **Local Hidden Variables**. Since Bohmian Mechanics willingly accepts **Non-Local Hidden Variables**, it sails right through the hole in Bell's sieve. It is the *only* hidden variable theory that survives Bell's theorem because it was the template Bell used to construct the theorem.

  ### 2. What was Bell actually trying to do?
  You wrote: *"Bell wrote his famous 1964 paper specifically because he'd been impressed by Bohm's 1952 hidden-variable theory and wanted to check whether you could build a version of it that got rid of the obviously weird part -- the pilot wave instantaneously guiding every particle..."*

  This is half-right. Bell *wished* he could find a local theory. He was a realist who was uncomfortable with the non-locality in Bohm's theory. He hoped that perhaps Bohm's non-locality was a quirk of that specific model and that a smarter, **Local** Hidden Variable theory could be found.

  His theorem was the bad news: **No.** You cannot have a Local Hidden Variable theory. Nature is fundamentally non-local (in the sense of violating local realism).

  So, Bell didn't prove Bohm was wrong. He proved that **Bohm's "weird part" (non-locality) is a mandatory feature of reality, not a bug of the theory.**

  ### 3. Why did Bell admire Bohm for the rest of his life?
  To understand this, you have to understand the context of the 1950s. The "Copenhagen Orthodoxy" (Bohr, Heisenberg, Pauli) had established a dogma that went something like this:
  1.  Quantum Mechanics is complete.
  2.  Hidden variables are impossible (based on a proof by von Neumann).
  3.  Asking what a particle is "really doing" when not measured is meaningless.

  **David Bohm broke step 2.** In 1952, he constructed a fully deterministic hidden variable theory. It showed that von Neumann's proof relied on an assumption that was physically unjustified.

  Even though Bohm's theory was non-local (which bothered Bell), Bell admired Bohm because **he broke the dogma.** He showed that "Hidden Variables" were not mathematically impossible, just costly. Bell felt the physics community had been intellectually lazy, accepting von Neumann's proof without checking it.

  Bell's admiration wasn't sentimentality; it was gratitude. Bohm forced the community to stop waving their hands about "complementarity" and admit that if you want realism, you have to accept non-locality. Bell spent his career trying to get physicists to take that implication seriously.

  ### 4. What did the 2022 Nobel actually confirm?
  The 2022 Nobel (Aspect, Clauser, Zeilinger) was for experimental tests of Bell Inequalities.
  *   **Result:** Nature violates Bell Inequalities.
  *   **Meaning:** **Local Realism is false.**

  This kills **Local Hidden Variable theories**.
  It does **not** kill **Non-Local Hidden Variable theories (Bohm)**.
  It does **not** kill **Standard QM** (which abandons realism in the classical sense).
  It does **not** kill **Many-Worlds** (which abandons single outcomes).

  All of these interpretations predict the same violation of Bell inequalities. The Nobel Prize confirmed that the *predictions* of Quantum Mechanics are correct, but it does not distinguish between Bohm, MWI, or Copenhagen. They are all empirically equivalent regarding Bell tests.

  ### 5. So why does Eliezer (and most physicists) dismiss Bohm?
  If Bell's theorem doesn't kill Bohm, why is it a minority view? The criticisms are different from what you suspected.

  1.  **Relativity:** This is the big one. Standard Bohmian Mechanics requires a **preferred reference frame** to define the instantaneous guidance of the pilot wave. While it prevents faster-than-light *signaling* (so it doesn't break causality operationally), it breaks the *spirit* of Special Relativity (Lorentz invariance) at the ontological level. Most physicists find this ugly. (There are relativistic extensions of Bohm, but they are complex and clunky).
  2.  **Asymmetry:** In Bohmian mechanics, particles have positions, but the wave function guides them. The particles affect the wave, but the wave affects the particles more. It feels "unbalanced" compared to standard QM where the wave function is the whole story.
  3.  **Parsimony (Eliezer's main point):** Eliezer's sequence argues for MWI based on Occam's Razor. MWI says "Just the Wave Function." Bohm says "The Wave Function **PLUS** actual particles that ride on top of it." Since the particles are "hidden" and don't change the experimental predictions, Eliezer argues they are epiphenomenal baggage. You're paying an ontological cost for no empirical gain.

  ### Summary
  You thought Bell's Theorem said: *"Hidden Variables are impossible."*
  Bell's Theorem actually said: *"Local Hidden Variables are impossible."*

  Bohmian Mechanics is a **Non-Local Hidden Variable** theory. It fits the theorem perfectly. Bell admired Bohm because Bohm proved the orthodox dogma wrong, even if the cost was non-locality. The 2022 Nobel confirmed that nature is indeed non-local, which keeps Bohmian Mechanics alive as a valid (if unpopular) interpretation, distinct from MWI or Copenhagen.

  The reason physicists don't flock to Bohm isn't because Bell killed it; it's because making it compatible with Relativity is hard, and it adds ontological baggage that doesn't change the predictions.
