  i saw a video that said Solomonoff induction basically proves occam's razor with actual math -- shorter program = more probable to be the true explanation. doesnt that mean the simpler theory is always more likely to be right, no matter how well a more complicated theory fits the evidence? feels like that would make the whole gather-more-evidence part of science kind of pointless lol
