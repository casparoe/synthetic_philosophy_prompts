answer: |-
  This is an excellent question. You have identified the exact friction point where formal social choice theory meets institutional reality. Most introductions stop at the "paradox" itself, but the real philosophical and practical meat lies in what List, Pettit, and others argue we must *do* about it.

  The Discursive Dilemma (or Doctrinal Paradox) is not merely a curiosity about voting; it is a proof that **collective rationality is not an emergent property of individual rationality.** It must be *institutionally constructed*.

  Here is a breakdown of the implications for group agency, the non-arbitrary nature of procedure selection, potential escapes, and practical design for your board.

  ### 1. Theoretical Implications: Is "Group Belief" Real?

  The most profound theoretical implication of the discursive dilemma, particularly in the work of Philip Pettit and Christian List (*Group Agency: The Possibility, Design, and Status of Corporate Agents*), is that it forces a move from a *summative* view of group belief to a *functionalist* view.

  *   **The Summative View (Naïve):** The group believes $P$ if and only if most members believe $P$. The discursive dilemma proves this view yields irrational group agents (holding inconsistent beliefs).
  *   **The Functionalist View (List & Pettit):** A group has a "belief" or "intention" not because of a mental state shared by members, but because the group *functions* as an agent. To be an agent, the group must maintain rationality (consistency and coherence) over time.

  **The Implication:** "Group belief" is not something you discover by polling members; it is something you *manufacture* through procedure. If your nonprofit board wants to claim it has a coherent "mission" or "strategy" (a group belief), it cannot simply aggregate individual votes on outcomes. It must adopt a procedure that prioritizes the consistency of the group's stance over the satisfaction of individual member preferences.

  This means group rationality is **artificial**. It does not happen naturally. If you do not design for it, the group is not a rational agent; it is merely a crowd.

  ### 2. Premise-Based (PBP) vs. Conclusion-Based (CBP): Is the Choice Arbitrary?

  You asked if the choice between aggregating on premises (vote on budget/mission, derive decision) or conclusions (vote on decision, ignore premises) is arbitrary. **It is not arbitrary, but it is normative.** It depends on the *telos* (purpose) of the specific institution.

  List and Pettit frame this as a trade-off between **Responsiveness** and **Rationality**.

  *   **Conclusion-Based Procedure (CBP):**
      *   *Priority:* Responsiveness to members' views on the specific outcome.
      *   *Best for:* Legislative bodies, referendums, or political assemblies where the primary goal is to reflect the will of the constituents/members at that moment.
      *   *Risk:* The group may end up with a "belief set" that is logically incoherent over time (e.g., voting to expand programs while voting to cut revenue sources).
  *   **Premise-Based Procedure (PBP):**
      *   *Priority:* Rationality and consistency of the group's doctrine.
      *   *Best for:* Courts, scientific panels, central banks, and **mission-driven nonprofits**.
      *   *Risk:* The outcome may contradict what a majority of members would have voted for if asked directly about the conclusion (a "dictatorship of the premises").

  **For your Nonprofit Board:**
  The choice is non-arbitrary because of your fiduciary and mission-based constraints. A court *must* use PBP because the law requires consistency with precedent (premises). A legislature *can* use CBP because they represent shifting popular will.
  A nonprofit board is closer to a court or a trustee body. You are guardians of a mission (a set of premises). Therefore, **PBP is normatively superior for you.** If you vote CBP, you risk voting yourself out of your own mission statement without realizing it.

  ### 3. Is There a Principled Way Out? (Escaping the Impossibility)

  List and Pettit (2002) proved an impossibility theorem similar to Arrow's: No procedure can simultaneously satisfy Universal Domain, Anonymity, Systematicity, and Consistency. You cannot have a perfect system. However, you can "escape" by relaxing conditions that are not essential to your specific context.

  Here are the three principled workarounds:

  **A. Restrict the Domain (Deliberation)**
  The dilemma arises most sharply when individual judgment profiles are diverse. If members deliberate *before* voting to align their understanding of the premises, the profile becomes "single-peaked" or coherent.
  *   *Practical:* Do not vote immediately. Require a discussion phase where the goal is to align on the *facts* and *criteria* (premises) before discussing the *action* (conclusion).

  **B. Relax Anonymity (Specialization/Division of Labor)**
  The theorem assumes everyone votes on everything. In reality, institutions assign epistemic authority.
  *   *Practical:* The Finance Committee votes on the budget premise; the Program Committee votes on the mission-fit premise. The full board then votes on the conclusion based on those certified premises. This breaks the "Universal Domain" condition and reduces the cognitive load that leads to inconsistency.

  **C. Sequential Priority (Constitutionalization)**
  You decide in advance which propositions are "settled" and cannot be reopened by a simple majority vote on the conclusion.
  *   *Practical:* Your Mission Statement and Bylaws are "super-premises." A vote on a new program is only valid if it is logically consistent with the Mission. If a majority votes for a program that violates the Mission, the vote is ruled *out of order*. This institutionalizes PBP.

  ### 4. Epistemic Weight: Reasoning vs. Decision

  This is crucial for how you read your own minutes and public statements.

  *   **If you use CBP:** The "Official Reasoning" provided after the vote is **epiphenomenal**. It is rhetoric constructed to justify a decision made on other grounds (coalition building, intuition, compromise). You should give the *decision* weight, but treat the *reasoning* as low-credibility post-hoc rationalization.
  *   **If you use PBP:** The "Official Reasoning" is **constitutive**. The decision *is* the logical output of the premises. The epistemic weight lies in the premises.

  **Implication for your Board:**
  If you want your board to be an epistemic authority (i.e., people trust your judgment because you are rational), you must treat the **Minutes** as the primary record of group belief, not just the Resolutions.
  *   *Bad Practice:* "Motion to open Program X passed 5-4."
  *   *Good Practice:* "Board affirmed Premise A (Budget available) and Premise B (Fits Mission). Therefore, Program X is authorized."

  If you record only the conclusion, you lose the ability to check for consistency in future meetings. You will suffer from "diachronic inconsistency" (voting one way today and the opposite way next year because the context shifted slightly).

  ### 5. Practical Committee Design Recommendations

  Given the above, here is how you translate the Discursive Dilemma into board governance:

  1.  **Formalize the Premises:** Explicitly list the criteria for decision-making in your bylaws or governance manual. (e.g., "All new programs must satisfy: 1. Positive 3-year budget projection, 2. Alignment with Strategic Goal Y").
  2.  **Vote on Criteria First:** When a proposal comes up, hold a preliminary vote on whether the criteria are met. If the majority votes "No" on the budget premise, the motion to launch the program dies automatically, regardless of how much they like the program. This enforces PBP.
  3.  **Avoid "Logrolling":** The dilemma encourages logrolling ("I'll vote for your budget premise if you vote for my program conclusion"). This creates unstable coalitions. Explicit voting on premises makes these trades visible and harder to hide.
  4.  **Designate a "Rationality Guardian":** In courts, this is the judge writing the opinion. In a board, this is the Chair or Governance Committee. Their job is not to decide the outcome, but to ensure the *path* to the outcome is logically consistent with past decisions and the mission.
  5.  **Accept the "Counter-Majoritarian" Cost:** Understand that PBP might sometimes override what a majority wants *right now*. This is a feature, not a bug. It protects the long-term agency of the corporation against the short-term whims of the current directors.

  ### Summary

  The Discursive Dilemma implies that **group rationality is a design choice, not a natural occurrence.**

  *   **Theoretically:** Group belief is real only if the group is structured to maintain consistency (Functionalism).
  *   **Procedurally:** PBP is not arbitrary; it is required for institutions that value integrity over time (like nonprofits/courts), whereas CBP is for institutions that value responsiveness (like legislatures).
  *   **Practically:** You escape the impossibility theorem by restricting the domain (deliberation), dividing labor (committees), and constitutionalizing premises (bylaws).
  *   **Epistemically:** If you want your board's decisions to carry weight, the reasoning must be voted on, not just the outcome.

  For your nonprofit, the risk is not just inconsistency; it is **mission drift**. The Discursive Dilemma shows exactly how mission drift happens mechanically: through a series of locally rational, majority-supported conclusion votes that collectively violate the organization's foundational premises. Adopting a Premise-Based Procedure is the only structural defense against this.
