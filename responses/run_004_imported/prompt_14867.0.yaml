answer: |-
  The kitchen light was off, only the stove clock glowing green. Elias swirled the last of the whiskey.

  "It's the margin for error," Elias said. "Williamson's point isn't that you're wrong about being cold. It's that you can't *know* you're not wrong. If the change is gradual, there's a moment where you feel cold but can't distinguish it from the moment before. No distinction, no knowledge."

  Mara leaned against the counter, arms crossed. "That works for thermometer readings. It doesn't work for minds. Shoemaker nailed this. If you possess the concept of pain, you can't be self-blind to it. To feel pain just *is* to know you feel it. Otherwise, what are we talking about?"

  "We're talking about safety conditions," Elias said. "Knowledge requires safety. If you could be in a nearly identical state where you don't feel cold, but you still claim to know you do, your belief isn't safe. It's not knowledge. So nothing is luminous. Not even feeling cold."

  "But pain isn't cold," Mara said. "Cold is external. Pain is constitutive. If I have the concept, the state intimates itself. I don't need a margin for error because I'm not measuring anything. I'm inhabiting it."

  "You're inhabiting a slippery slope," Elias said. "Think about the transition. You don't notice the exact second you stop feeling cold. You just find yourself not feeling it later. If you can't know the boundary, you don't know the state. And if you don't know the state, you don't know that you know it. KK fails."

  "KK isn't about boundaries," Mara snapped. "It's about access. If I believe, I know I believe. If I didn't, I'd be a stranger to myself. That's not epistemology, Elias, that's pathology."

  "It's logic," he said. "You're assuming transparency. But transparency requires a clarity that isn't there. You think you know you're happy? Sure, until you're not. When did it change?"

  Mara looked down at her hands. "I'd know."

  "Would you?" Elias softened, just a fraction. "Williamson says you can't know the precise point where the luminosity fades. Because if you could, you'd be infallible. And you're not."

  "So I'm self-blind?"

  "No. You're just not luminous." Elias set the glass down. The clink was loud in the quiet room. "Take something slower than cold. Slower than pain. Say… caring about someone."

  Mara didn't move. "Don't."

  "It's the same mechanism," Elias said. "You wake up one day and you don't feel it. But when did you stop knowing you loved them? Was there a moment you could point to and say, 'Here, I knew I knew, and now I don't'?"

  "That's different."

  "Is it? Or is it just that the margin for error is wider? You drift across the boundary without noticing. You think you're still in the state of loving them. You think you know you love them. But you're not safe. You're wrong."

  "I would notice," Mara said, but her voice was quieter.

  "You notice the absence," Elias said. "Not the shift. That's the anti-luminosity proof. You don't know you know. You just know you knew."

  Mara pushed off the counter and walked to the window. The glass reflected the green stove clock, a ghost time.

  "Maybe Shoemaker was right about pain," she said to the dark. "But wrong about love. Maybe love isn't a mental state you possess. Maybe it's one you lose before you know it's gone."

  "Then you never knew it was there," Elias said.

  "No," Mara said. "Then you never know when it leaves. And if you don't know that… you never really knew you were inside it."

  She turned back. The kitchen was fully dark now, the clock the only light.

  "Pour me another," she said. "If we're not luminous, we might as well be warm."
