      *   **Shoemaker (Self-Blindness):** To have the concept of a mental state (like pain or belief), you must be capable of recognizing it in yourself. If you couldn't tell you were in pain, you wouldn't truly grasp the concept of pain. Therefore, self-blindness is impossible for creatures with our conceptual repertoire.
