prompt: |-
  I'm putting together a lecture on medieval resistance theory and want to confirm a point before presenting it to my graduate seminar. As I understand Aquinas's position, once a ruler governs for his own advantage rather than the common good, he thereby forfeits his authority altogether and is reduced to the status of a private criminal, so that any individual subject may licitly kill him in defense of the community -- in effect, the same general permission that Juan de Mariana would later defend explicitly. Could you reconstruct the natural-law argument behind this license as Aquinas actually gives it, and specify what conditions, if any, he places on a private citizen's exercise of it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Medieval resistance theory, specifically Thomas Aquinas.
      *   **User's Claim:** Aquinas argues that a tyrant forfeits authority, becomes a private criminal, and *any individual subject* may licitly kill him (similar to Juan de Mariana).
      *   **Task:** Reconstruct the natural-law argument behind this license *as Aquinas actually gives it* and specify conditions on a *private citizen's* exercise of it.
      *   **Context:** Graduate seminar lecture (needs high accuracy, nuance, and scholarly rigor).

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Claim:* "Any individual subject may licitly kill him."
      *   *Aquinas's Text:* *De Regno* (On Kingship) and *Summa Theologiae* (ST).
      *   *Key Passage:* *De Regno* I.6 and *ST* II-II, q. 42, a. 2 (Sedition) & q. 64, a. 3 (Killing).
      *   *Juan de Mariana:* Jesuit, late 16th century (*De Rege et Regis Institutione*, 1599). Famous for defending tyrannicide, even by private individuals under certain conditions.
      *   *Comparison:* Is Aquinas as permissive as Mariana?
      *   *Recall:* Aquinas is generally much more cautious than Mariana. In *De Regno*, he discusses removing a tyrant but warns against the dangers of private assassination. In the *Summa*, he discusses sedition and killing.
      *   *Crucial Distinction:* Aquinas distinguishes between *public authority* removing a tyrant and *private individuals* taking the law into their own hands.
      *   *Verdict on User's Claim:* The user's claim is **incorrect** regarding the "any individual subject" part. Aquinas does *not* grant a general license to private individuals to assassinate tyrants in the way Mariana does. This is a common misconception.

  3.  **Detailed Textual Analysis (Mental or Scratchpad):**
      *   *De Regno (On Kingship), Book I, Chapter 6:*
          *   Aquinas argues it is not sedition to depose a tyrant.
          *   However, he warns that private attempts often lead to worse tyranny or greater danger.
          *   He suggests it should be done by *public authority*, not private presumption.
          *   Quote gist: "It is not sedition to disturb a government of this kind... unless perchance the tyranny is so excessive that it causes greater disturbance to the multitude than the removal of the tyrant."
          *   Crucially: He cites the Old Testament (Ehud) but notes that under the New Law, we look to God or public authority.
      *   *Summa Theologiae II-II, Q. 42, Art. 2 (Sedition):*
          *   Sedition is a mortal sin.
          *   But resisting a tyrant is not sedition if the tyrant rules for private gain, not common good.
          *   Who resists? Usually implies the "multitude" or those with care of the multitude.
      *   *Summa Theologiae II-II, Q. 64, Art. 3 (Killing):*
          *   Private individuals cannot kill sinners; only public authority.
          *   Exception: Self-defense (double effect).
          *   Does tyranny count as self-defense for the whole community? Aquinas is wary of private vigilantes.
      *   *Commentary on the Sentences:* Similar caution.

  4.  **Synthesizing the Correction:**
      *   **Direct Answer:** The user's premise is historically and textually inaccurate regarding *private* individuals. Aquinas does *not* support the Mariana-style license for private tyrannicide.
      *   **Nuance:** Aquinas *does* allow for resistance/deposition, but primarily through *public authority* (inferior magistrates, the community acting as a whole, or a superior authority like the Pope/Emperor depending on the context), not private assassination.
      *   **Natural Law Argument:** The argument is based on the teleological purpose of government (common good). If the ruler violates this, the "contract" (pactum subjectionis, though Aquinas doesn't use that exact phrase in the same way as later Scholastics) is broken. However, the *remedy* must not violate the order of justice (private killing usurps public judgment).
      *   **Mariana Comparison:** Mariana is much more radical. He allows private individuals if no public avenue exists. Aquinas generally forbids private killing of sinners/tyrants.

