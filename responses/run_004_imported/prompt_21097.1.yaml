          *   Mention the Ehud example. Aquinas acknowledges it but says it was under the Old Law/special inspiration, not a general rule for Christians.
          *   Explain *why*: Private killing disrupts the order of justice. Only the state can execute justice. A tyrant is still the state until removed by the state (or superior).
          *   Clarify the "forfeiture" theory. Aquinas does say the tyrant acts unjustly, but he doesn't explicitly say they instantly become a "private criminal" liable to *anyone's* sword. He says they forfeit the *right to rule*, not necessarily the *protection of law* against private violence.

