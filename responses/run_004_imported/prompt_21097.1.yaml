answer: |-
  This is a critical point to clarify before your seminar, as the claim you outline contains a significant historical and textual inaccuracy regarding Aquinas. While your description accurately reflects the later Jesuit theorist **Juan de Mariana** (specifically his *De Rege et Regis Institutione*, 1599), it **does not accurately reflect Thomas Aquinas's position.**

  If you present Aquinas as granting a license to *private individuals* to assassinate tyrants in the same manner as Mariana, you will likely face rigorous correction from students familiar with the primary texts. Aquinas is far more cautious and restrictive.

  Here is a reconstruction of Aquinas's actual argument, the textual evidence, and the specific conditions he places on resistance, which you can use to correct and refine your lecture.

  ### 1. The Core Correction: Public vs. Private Authority
  Aquinas **does not** grant a general license to private individuals to kill tyrants. His consistent position is that while a tyrant may be resisted and deposed, this action belongs to **public authority**, not private presumption.

  *   **Juan de Mariana:** Argues that if no public mechanism exists, a private citizen may kill a tyrant (tyrannicide) as an act of defense of the commonwealth.
  *   **Thomas Aquinas:** Argues that private killing of a ruler is generally illicit, even if the ruler is tyrannical, because it usurps the order of justice. Removal must be effected by a superior authority or the community acting corporately, not by private individuals.

  ### 2. The Primary Text: *De Regno* (On Kingship) I.6
  This is the text most often cited regarding Aquinas and tyranny. In Chapter 6, Aquinas asks whether it is permissible to kill a tyrant.

  **The Argument:**
  1.  **Teleology of Rule:** Government is ordained for the common good. A ruler who seeks private advantage rather than the common good rules unjustly and is a tyrant.
  2.  **Forfeiture of Claim:** Such a ruler does not merit the reward of faithful subjects. In fact, Aquinas states it is **not sedition** to disturb such a government (*"Non est seditio... huiusmodi regimen disturbare"*).
  3.  **The Restriction (Crucial for your lecture):** Immediately after establishing that resisting a tyrant is not sedition, Aquinas places a heavy restriction on *how* this is done. He writes:
      > "To proceed against the cruelty of tyrants is an action to be undertaken, **not through the private presumption of a few, but by public authority.**" (*"Non est procedendum... auctoritate privata, sed publica."*)

  **Why the Restriction?**
  Aquinas offers a natural-law/prudential argument against private assassination:
  *   **Risk of Greater Evil:** Private attempts often fail, leading the tyrant to become more suspicious and cruel.
  *   **Disorder:** If private killing is permitted, it undermines the very order of justice required for the common good. It sets a precedent where subjects judge and execute their superiors, leading to anarchy or worse tyranny.
  *   **The Case of Ehud:** Aquinas addresses the Old Testament example of Ehud killing Eglon (Judges 3). He concedes Ehud was licit but argues this was due to **special divine inspiration**, not a general rule of natural law applicable to Christians. Under the New Law, we are to look to public order or divine intervention, not private violence.

  ### 3. The *Summa Theologiae* Corroboration
  Your lecture should also reference the *Summa* to show consistency in his moral theology.

  *   **ST II-II, q. 42, a. 2 (On Sedition):** Aquinas reiterates that resisting a tyrant is not sedition because the tyrant is already guilty of sedition against the common good. However, the resistance implies a collective action to restore order, not individual vigilantism.
  *   **ST II-II, q. 64, a. 3 (On Killing):** Aquinas establishes that **private individuals cannot licitly kill sinners.** Only public authority, acting as the "minister of God," can execute justice.
      *   *Application to Tyrants:* A tyrant is a sinner, but unless he is stripped of his office by a superior authority, he technically retains the *status* of the public person. Therefore, a private subject lacks the jurisdiction to execute him.
      *   *Exception:* The only exception Aquinas consistently allows for private killing is **self-defense** (via the principle of double effect), where the intent is to save one's own life, not to kill the aggressor. This does not scale to "defense of the community" by a private citizen.

  ### 4. Reconstructing the Natural-Law Argument
  If you wish to present the natural-law logic behind Aquinas's resistance theory without attributing the "private license" error, frame it as follows:

  1.  **Premise 1 (Teleology):** Political authority is natural and necessary for human flourishing, but its legitimacy is conditional on its end (*finis*), which is the **common good**.
  2.  **Premise 2 (Deviation):** When a ruler directs the community to his private good, he acts contrary to the natural law of governance. He becomes a "robber" (*latro*) in a moral sense, though perhaps not yet in a legal sense.
  3.  **Premise 3 (Order of Justice):** Natural law requires that justice be administered through proper order. Private individuals are parts of the whole; they do not possess the authority to judge and execute the head of the whole, as this destroys the unity of the body politic.
  4.  **Conclusion:** Therefore, while the tyrant forfeits his **moral right to rule**, he is not automatically reduced to the status of a private criminal liable to **private execution**. The remedy must match the disorder: since the tyranny is a public corruption, the cure must be a **public action**.

  ### 5. Conditions for Licit Resistance (According to Aquinas)
  For your seminar, specify that Aquinas allows resistance only under these conditions:

  1.  **Public Authority:** The action must be taken by those with care of the multitude (e.g., inferior magistrates, barons, or representatives of the community), not isolated individuals.
  2.  **No Superior Recourse:** Ideally, one should appeal to a superior authority (e.g., the Pope, the Emperor, or the electors who originally appointed the king) to depose the tyrant.
  3.  **Proportionality:** If the community acts corporately to depose the tyrant, they must ensure that the removal does not cause greater harm to the common good than the tyranny itself (*"nisi forte sic excedat tyrannis..."*).
  4.  **Divine Intervention:** In cases where no human remedy is possible, Aquinas advises patience and prayer, arguing that God can soften the tyrant's heart or remove him, rather than sanctioning private violence.

  ### Recommendation for Your Lecture
  To maintain scholarly rigor, I suggest framing the lecture as a **development of resistance theory** rather than a static position:

  *   **Aquinas (13th Century):** Establishes the *principle* that tyranny forfeits moral authority but restricts the *remedy* to public authority/corporate action. He explicitly rejects private tyrannicide.
  *   **Conciliarists & Later Scholastics (15th-16th Century):** Begin to expand the definition of "public authority" to include estates or representatives.
  *   **Juan de Mariana (16th Century):** Represents the radicalization of the theory, explicitly arguing that when public avenues are closed, the "public authority" devolves to the individual citizen, thereby permitting private tyrannicide.

  **Summary for your students:** "Aquinas provides the *justification* for resistance (the common good), but Mariana provides the *license* for private assassination. Conflating the two obscures the crucial medieval concern for legal order and the hierarchy of justice."

  This distinction will demonstrate a sophisticated grasp of the textual tradition to your graduate students.
