prompt: |-
  I coordinate a small volunteer-run grief support nonprofit -- we run peer support groups for people who've lost a spouse, child, or partner, and we're loosely partnered with a hospital's palliative care unit for referrals both ways. I'm on the 7-person steering committee (mostly peer facilitators like me, plus a hospital chaplain and a part-time grief counselor), and at our meeting in three weeks we have to vote on something that's been dividing us for months: whether to start screening everyone who joins a group using the new "Prolonged Grief Disorder" criteria that got added to the DSM a couple years back, and then routing anyone who screens positive out of peer support and into "real" clinical treatment (therapy, meds, the works) instead.

  Half the committee thinks this is obviously good -- people whose grief isnt easing up after a year or more need more than a chat circle, and honestly without an actual diagnosis code insurance wont cover extended therapy anyway, so the label is doing real work for people. The other half (me included, most days) keeps getting stuck on something my nephew sent me once from his psych program, about a philosopher named Ian Hacking who argued that mental illness labels aren't like labels for rocks or chemicals -- slapping a "disorder" on the way someone grieves might change how they see themselves and how everyone around them treats them, and that changed behavior turns around and reshapes what the "disorder" even looks like in the first place. So I keep worrying we'd basically be manufacturing the exact thing we're claiming to just be detecting, and telling freshly bereaved people their sadness is a pathology on top of everything else they're carrying.

  Could you write the recommendation memo I'll circulate to the committee before the vote? I need it to actually land on a side -- adopt the screening, drop the idea, or adopt it with real conditions attached -- with a concrete plan for how and when we'd roll it out (or not), and it needs to take the "insurance and undertreatment" argument seriously instead of just letting the Hacking-style worry win by default.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Coordinator of a small volunteer-run grief support nonprofit.
      *   **Audience:** 7-person steering committee (peer facilitators, hospital chaplain, part-time grief counselor).
      *   **Topic:** Voting on whether to screen new members for Prolonged Grief Disorder (PGD) using DSM criteria and route positives to clinical treatment instead of peer support.
      *   **Conflict:**
          *   *Pro-Screening:* PGD needs clinical care (therapy/meds); diagnosis is needed for insurance coverage; peer support isn't enough for pathological grief.
          *   *Anti-Screening (User's leaning):* Ian Hacking's "looping effect" concern (labeling changes self-perception/behavior); risk of pathologizing normal grief; fear of manufacturing the disorder.
      *   **Requirements:**
          *   Must take a side (Adopt, Drop, or Adopt with Conditions).
          *   Must include a concrete plan (rollout/timeline).
          *   Must seriously address the "insurance/undertreatment" argument (cannot just dismiss it based on philosophical worries).
          *   Tone: Professional, empathetic, balanced but decisive, suitable for a steering committee memo.

  2.  **Determine the Stance:**
      *   *Option A (Adopt Fully):* Too risky. Alienates the peer-support ethos, risks harming vulnerable people by medicalizing normal grief too early.
      *   *Option B (Drop Fully):* Ignores the valid clinical concern. Some people *do* need more than peer support, and insurance barriers are real.
      *   *Option C (Adopt with Conditions/Hybrid):* This is the most nuanced and responsible path. It acknowledges the clinical reality (some need help) without embracing the "looping effect" dangers of universal mandatory screening. It allows for *identification* without immediate *exclusion* or *labeling*.
      *   *Decision:* **Recommendation: Adopt a "Identify and Support" model, not a "Screen and Exclude" model.** We will use the criteria as a *guide for conversation*, not a *gatekeeping tool*. We will not diagnose. We will not mandate routing out. We will build bridges to clinical care for those who want it, while keeping peer support available unless there is imminent risk.

      *Refining the Stance:* Actually, looking closer at the prompt, the specific proposal is "screening everyone... and then routing anyone who screens positive out of peer support and into... clinical treatment."
      *   *My Recommendation:* **Reject the mandatory screening/exclusion model.** Instead, implement a **voluntary, conversational assessment with integrated care pathways.**
      *   *Why?* The "Screen and Route Out" model is too rigid for a volunteer org. It creates the exact Hacking "looping effect" the user fears (telling people they are disordered). However, the "Insurance/Undertreatment" argument is valid. So, the solution is to help people *access* that diagnosis if *they* seek it, without the nonprofit acting as the gatekeeper or diagnostician.
      *   *Wait, let's look at the "Insurance" argument again:* The pro side says "without an actual diagnosis code insurance wont cover extended therapy." True. But can a volunteer nonprofit diagnose? Usually no. Only licensed clinicians can diagnose for insurance. So the proposal to "screen using DSM criteria" is legally/ethically shaky for a volunteer org anyway.
      *   *Pivot:* The recommendation should be to **Drop the mandatory screening/exclusion policy**, but **Implement a Clinical Liaison Protocol.** This addresses the undertreatment risk without the pathologizing risk.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly up front. (Don't adopt the mandatory screen/exclude model. Do adopt a supportive referral pathway).
      *   **Context:** Briefly acknowledge the debate (Clinical need vs. Philosophical/Ethical risk).
      *   **Analysis of the Proposal (The "Why Not"):**
          *   Address the Hacking concern (Labeling/Looping effects).
          *   Address the Scope of Practice (Volunteers shouldn't diagnose).
          *   Address the Mission (Peer support is for *all* grievers, not just "normal" ones).
      *   **Addressing the Counter-Argument (The "Insurance/Undertreatment" point):**
          *   Acknowledge validity: People *do* need care. Insurance *does* require codes.
          *   Solution: We don't need to be the ones applying the label to facilitate the care. We can partner with the hospital to facilitate *their* assessment.
      *   **The Recommendation (The "What"):**
          *   No mandatory DSM screening by volunteers.
          *   Intake conversation includes wellness checks (not diagnostic).
          *   Warm handoffs to the hospital partner for those struggling.
          *   Co-facilitation model (Peer + Clinician) for complex groups.
      *   **Implementation Plan:** Timeline, training, partnership refinement.
      *   **Conclusion:** Reiterate mission alignment.

  4.  **Refining the Tone:**
      *   Needs to be respectful of the clinicians on the committee (Chaplain, Counselor).
      *   Needs to validate the volunteers' concerns.
      *   Needs to sound like it comes from a Coordinator who understands both the heart (peer support) and the head (clinical realities).
      *   *Key Phrase:* "Gatekeeping vs. Gateways." We don't want to be gates; we want to be bridges.

  5.  **Incorporating Ian Hacking:**
      *   Don't get too academic. Translate "looping effects" into practical terms: "If we tell someone their grief is a disorder, they may stop trusting their own healing process."
      *   Balance it: "But ignoring clinical reality isn't kindness either."

  6.  **Final Review against Constraints:**
      *   *Take a side?* Yes (Reject mandatory screen/exclude).
      *   *Concrete plan?* Yes (Intake protocol changes, partnership MOU).
      *   *Address insurance argument?* Yes (Clinicians diagnose, we refer).
      *   *Timeline?* Yes (3 months).

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe suggest a trial period?
      *   *Correction:* No, screening for a disorder you can't treat is ethically risky. Better to be firm on "No Diagnosis by Volunteers."
      *   *Make sure to emphasize:* The hospital partner has the clinicians who *can* diagnose for insurance. We leverage them.

  8.  **Final Polish:** Check for empathy and clarity. Ensure the distinction between "screening" (volunteers checking boxes) and "assessment" (clinicians evaluating) is clear. (Proceed to generate output).

  *(Self-Correction Note: The prompt asks me to write the memo the user will circulate. I need to write it in their voice, as the Coordinator.)*

  *(Wait, one more check on the "Take a Side" requirement.)*
  The prompt says: "I need it to actually land on a side -- adopt the screening, drop the idea, or adopt it with real conditions attached."
  My chosen side: **Drop the mandatory screening/exclusion idea, but adopt a structured clinical referral pathway.** This is technically "Drop the idea [as proposed]" but "Adopt with conditions [a new model]." I will frame it as **Rejecting the "Screen-and-Exclude" Model in favor of an "Assess-and-Connect" Model.** This feels like the most responsible leadership stance.

  Let's refine the "Insurance" counter-argument. The committee members arguing for screening say the *label* helps get insurance. If we don't screen, do they lose that?
  *Counter:* Volunteers cannot assign diagnosis codes anyway. Only the licensed counselor or hospital partners can. So the volunteer screening is actually *redundant* for insurance purposes. It's just a gatekeeping mechanism. I need to make sure this point lands hard.

  Okay, ready to write.cw
answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee, [Nonprofit Name]
  **FROM:** [Your Name], Program Coordinator
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding PGD Screening and Referral Protocols

  **Executive Summary**

  After months of discussion and reviewing the clinical and ethical implications of our proposed intake changes, I am recommending that the committee **vote against the mandatory screening and exclusion model** currently on the table.

  Instead, I propose we adopt an **"Assess-and-Connect" Protocol**. Under this model, we do not use DSM-5-TR criteria to gatekeep entry into peer support, nor do volunteer facilitators attempt to identify Prolonged Grief Disorder (PGD). Instead, we will refine our intake conversations to identify distress levels, and leverage our hospital partnership to facilitate clinical assessments for those who need them—without requiring a diagnosis as a condition of receiving peer support.

  This recommendation rejects the binary choice between "medicalizing grief" and "ignoring clinical need." It prioritizes our mission of inclusive peer support while creating a more effective pathway to clinical care for those who require it.

  **Context and The Core Conflict**

  We are divided between two valid concerns:
  1.  **Clinical Necessity:** Colleagues argue that grievers meeting PGD criteria need professional treatment (therapy/medication) that peer support cannot provide. They rightly note that a formal diagnosis is often the key to unlocking insurance coverage for that treatment.
  2.  **Ethical Risk:** Others worry that applying a "disorder" label to normal variations of grief changes how members view themselves (the "looping effect"). There is a risk that we pathologize pain that simply needs time and community, potentially harming the very people we aim to help.

  **Analysis of the Proposed "Screen-and-Exclude" Model**

  While the intention behind mandatory screening is safety and care, implementing it as proposed presents three critical issues:

  *   **Scope of Practice:** As a volunteer-run organization, our facilitators are not licensed to diagnose mental health conditions. Using DSM criteria as a screening tool places volunteers in a quasi-clinical role they are not trained or insured to hold.
  *   **The "Looping" Risk:** If we tell a bereaved spouse at intake that their grief looks like a "disorder" and therefore they cannot join our group, we reinforce isolation. We risk confirming their fear that something is "wrong" with them, rather than normalizing their struggle.
  *   **Redundancy Regarding Insurance:** A volunteer screening does not generate a billable diagnosis code. Only a licensed clinician (like our part-time counselor or hospital partners) can provide the documentation insurance requires. Therefore, our screening does not actually solve the insurance barrier; it only creates a barrier to *our* support.

  **Addressing the Undertreatment Argument**

  I want to be clear: I accept the argument that some members are suffering beyond the scope of peer support and need clinical intervention. The risk of undertreatment is real. However, **exclusion is not the only way to refer.**

  We can acknowledge that someone needs more help without telling them they are "too broken" for our circle. The current proposal assumes that peer support and clinical treatment are mutually exclusive. Evidence suggests they are most effective when integrated. A person can benefit from trauma therapy *and* a peer group; removing the peer group removes a protective social factor that aids clinical recovery.

  **Recommendation: The "Assess-and-Connect" Protocol**

  I recommend we **drop the mandatory PGD screening** and instead implement the following three-part plan:

  **1. Intake Conversations, Not Screenings**
  We will update our intake script to focus on *functioning and safety* rather than *symptom counting*.
  *   *Current:* "Do you feel stuck? (Yes/No)"
  *   *New:* "How is your grief impacting your daily ability to function? Are you open to speaking with a clinician about additional support?"
  *   *Goal:* To identify distress without applying a label.

  **2. Formalized Warm Handoffs (The Insurance Solution)**
  We will formalize an MOU (Memorandum of Understanding) with our hospital palliative care partners.
  *   If a member expresses high distress or interest in clinical care, we do not turn them away. We offer a "Warm Handoff."
  *   Our hospital partner agrees to prioritize referrals from us for a clinical assessment.
  *   *Crucially:* The hospital clinician, not us, determines if PGD criteria are met. If they diagnose PGD, *they* handle the insurance coding. We remain the support layer, not the diagnostic gatekeeper.

  **3. Co-Facilitation for Complex Groups**
  For groups dealing with traumatic loss (suicide, overdose, sudden death), we will pair a peer facilitator with a clinician (chaplain or counselor) for the first 3 sessions. This ensures clinical oversight without medicalizing the entire group dynamic.

  **Implementation Timeline**

  *   **Month 1 (Nov):** Draft new intake scripts and MOU with hospital partners. Training session for facilitators on "Identifying Distress vs. Diagnosing."
  *   **Month 2 (Dec):** Pilot the new Intake Protocol with new registrants. No one is turned away based on grief duration or intensity during this phase.
  *   **Month 3 (Jan):** Review referral data. How many people accepted the "Warm Handoff"? Did insurance barriers persist?
  *   **Month 6 (June):** Full committee review. If clinical partners report that our referrals are consistently unqualified for care, we revisit the screening criteria then.

  **Conclusion**

  We are not clinicians. We are companions. By refusing to diagnose, we protect our members from the stigma of a label they may not need, and we protect our volunteers from liability. By strengthening our referral pipeline, we ensure that those who *do* need clinical care get it faster and with better insurance support than we could ever provide on our own.

  We can be a bridge to treatment without becoming a gate. I ask that you vote to reject the mandatory screening proposal and authorize the formation of a working group to draft the "Assess-and-Connect" MOU with our hospital partners.

  Thank you for your dedication to this difficult work.

  [Your Name]
  Program Coordinator
