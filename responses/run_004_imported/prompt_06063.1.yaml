answer: |-
  You have put your finger on precisely the fault line that currently divides the philosophy of cognitive science. Your suspicion is well-founded: the "tidy story" prevalent in the rationalist sphere is not a necessary consequence of the Free Energy Principle (FEP) mathematics, but rather a specific philosophical interpretation of that mathematics—specifically, the **inferentialist/representationalist** interpretation championed by Jakob Hohwy.

  To answer your core questions directly: **No, the FEP mathematics does not strictly favor the internalist reading over the enactive one regarding the location and constitution of the "self."** The formalism is largely neutral on where the Markov blanket is drawn and what ontological status we assign to the "generative model." However, **yes, the rationalist-adjacent narrative does smuggle in the internalist picture**, largely because the language of "Bayesian inference," "beliefs," and "models" carries heavy representational baggage that the math itself does not necessitate.

  Here is an analysis of why the formalism allows for both, how the interpretations diverge, and where the smuggling occurs.

  ### 1. The Markov Blanket Formalism: What It Does and Does Not Entail

  To understand the neutrality of the FEP, we must look strictly at what a Markov blanket (MB) is in this context. In probabilistic terms, a Markov blanket defines a boundary of **conditional independence**.

  If we partition a system into **Internal states ($I$)**, **External states ($E$)**, **Sensory states ($S$)**, and **Active states ($A$)**, the MB consists of $S$ and $A$. The formal requirement is:
  $$P(I, E | S, A) = P(I | S, A) \cdot P(E | S, A)$$

  This entails that given the sensory and active states, the internal states are statistically independent of the external states.

  **What this entails:**
  1.  **Statistical Separation:** The internal states cannot "know" about the external states except through the mediation of the blanket ($S$ and $A$).
  2.  **Self-Evidencing:** To maintain their structural integrity (i.e., to remain within a limited set of states that defines their existence), the internal states must minimize variational free energy, which is mathematically equivalent to maximizing the evidence for their own existence given the sensory flow.

  **What this does *not* entail:**
  1.  **The Location of the Blanket:** The math does not specify that the Markov blanket corresponds to the **skull** or the **skin**. It only requires that *some* boundary exists where conditional independence holds. A tool-using human, a termite mound, or a coupled agent-environment system could theoretically constitute the "Internal" partition if the statistical dependencies hold.
  2.  **The Ontology of the Model:** The FEP proves that a system *behaves as if* it possesses a generative model. It does not prove that the system contains a literal, propositional, or map-like representation of the world. The "model" could be implicit in the dynamics of the internal states themselves.
  3.  **The Direction of Fit:** While the math describes minimizing surprise, it does not dictate whether this is achieved primarily by changing the model (perception) or changing the world (action), nor does it dictate that action is *only* for the sake of fulfilling predictions rather than maintaining the coupling itself.

  ### 2. The Internalist/Inferentialist Reading (Hohwy)

  Jakob Hohwy's reading takes the statistical boundary of the Markov blanket and identifies it with the **biological boundary of the brain (or organism)**.

  *   **The Veil:** Because $I$ is conditionally independent of $E$, Hohwy argues the brain is "trapped" behind the sensory interface. It can never access the world directly, only the probabilistic shadows cast on the sensory sheet.
  *   **The Model:** The internal states *are* the generative model. Therefore, cognition is essentially inference. The brain's job is to infer the hidden causes of sensory data.
  *   **Action:** Action is "active inference." We move our bodies to sample data that confirms our predictions (minimizing expected free energy).
  *   **The Commitment:** This is a strongly **representationalist** view. The internal states *stand in for* external causes. Truth (veridicality) matters because a model that fails to predict leads to high surprise and system dissolution.

  **Where the formalism supports this:** The FEP was largely developed in the context of neurobiology. If you define $I$ as "neuronal states," the math works beautifully to describe predictive coding in cortical hierarchies.

  **Where it oversteps:** Hohwy moves from "statistically independent" to "epistemically sealed." He treats the Markov blanket as a phenomenological veil of perception, whereas the math only describes a statistical dependency structure.

  ### 3. The Ecological/Enactive Reading (Bruineberg, Kiverstein, Rietveld)

  The enactive critics accept the FEP mathematics but reject the identification of the Markov blanket with the skull, and the identification of the "model" with a representation.

  *   **The Coupled System:** They argue the relevant Markov blanket often encompasses the **brain-body-environment coupling**. If an organism uses a tool (e.g., a blind man's cane), the statistical dependencies might extend down the cane. The "Internal" states are the dynamics of the whole coupled system.
  *   **The Model as Dynamics:** They argue the "generative model" need not be an internal representation. Instead, the **dynamics of the system itself** embody the model. The organism doesn't *have* a model of the affordances; it *is* a system attuned to affordances. Minimizing free energy is simply the mathematical description of maintaining a viable relationship with the environment (homeostasis/allostasis).
  *   **Action:** Action is not about making the world match a prediction; it is about **maintaining the Markov blanket itself**. We act to keep the coupling viable. If I predict a cup is graspable, and I grasp it, I am not "confirming a hypothesis" in a propositional sense; I am sustaining the structural integrity of my agency.
  *   **The Commitment:** This is a **non-representationalist** (or "weakly representationalist") view. Cognition is constituted by the interaction, not hidden behind it.

  **Where the formalism supports this:** The FEP applies to *any* self-organizing system, from cells to societies. A cell minimizes free energy without having "beliefs." Therefore, "minimizing surprise" cannot inherently imply "Bayesian inference" in the cognitive sense. It implies **self-preservation**.

  ### 4. Is the Math Neutral?

  The mathematics of the FEP is **neutral regarding the boundary** but **ambiguous regarding the ontology.**

  1.  **Boundary Neutrality:** As noted, the math does not force the MB to be skin-tight. If the statistical conditional independence holds across a brain-tool-environment loop, the FEP applies to that larger loop. The internalist reading *imposes* the skull boundary based on anatomical priors, not mathematical necessity.
  2.  **Ontological Ambiguity:** The FEP relies on the "As-If" principle. A system minimizes VFE *as if* it is performing Bayesian inference.
      *   **Hohwy** collapses the "as-if" into an "is." The brain *is* doing inference.
      *   **Enactivists** keep the "as-if." The system behaves *as if* it infers, but this is just a description of its self-organizing dynamics.

  However, there is one area where the math leans slightly internalist: **The definition of "Evidence."** In the FEP, minimizing free energy is maximizing the "model evidence." This language is inherently Bayesian/representational. Enactivists have to work harder to reinterpret "evidence" as "viability" or "persistence." They argue that for a living system, the only "evidence" that matters is evidence that the system continues to exist. This is a philosophical reinterpretation of the mathematical term "evidence."

  ### 5. The Rationalist Smuggle

  You asked if rationalist-adjacent writing smuggles in the internalist picture. **The answer is an unequivocal yes.**

  When the rationalist sphere describes the brain as a "hierarchical Bayesian prediction engine," it makes three moves that are not forced by the FEP:

  1.  **Reification of Beliefs:** It treats the probability distributions in the generative model as **credences** (degrees of belief) held by an agent. The FEP only requires physiological states that covary with environmental causes. Turning these into "beliefs" imports a folk-psychological layer that aligns with the rationalist project of "fixing your thinking," but it is not required by the physics of self-organization.
  2.  **Solipsism of the Skull:** It assumes the "agent" is the brain inside the head, looking out. This fits the rationalist focus on individual epistemic rationality. It ignores the possibility that the "agent" minimizing free energy is the person-in-the-world, where the "thinking" is distributed across the coupling.
  3.  **Truth as Optimization:** The rationalist narrative often assumes that minimizing surprise leads to **accurate models** of reality. But the FEP only guarantees models that ensure **survival**. A system can minimize free energy by ignoring the world (dark room problem) or by hallucinating (psychosis), provided it maintains its own integrity. The enactive reading emphasizes that we minimize free energy to stay alive, not necessarily to know the truth. The rationalist reading often conflates "survival" with "epistemic accuracy."

  ### Conclusion

  The Free Energy Principle is a mathematical description of **how self-organizing systems persist**. It establishes that such systems must embody a statistical relationship with their causes that looks like a generative model.

  *   **Hohwy (Internalist)** reads this as: "Therefore, the brain is an inference machine trapped behind the senses, trying to model the truth."
  *   **Bruineberg/Clark (Enactive)** reads this as: "Therefore, the organism is a self-organizing system that maintains its boundary through active coupling, where 'modeling' is just the dynamics of staying alive."

  The mathematics supports the **structure** of both claims (conditional independence, feedback loops, error minimization) but does not dictate the **ontology** (representation vs. dynamics) or the **boundary** (skull vs. coupling).

  The rationalist narrative collapses this distinction because it is primarily interested in **epistemology** (how do I form true beliefs?) rather than **biology** (how does this system persist?). By treating the FEP as a theory of *belief formation* rather than *system persistence*, the rationalist summary inevitably privileges Hohwy's internalist reading, presenting a philosophical choice as a mathematical necessity. You are correct to identify this as a collapse; the "tidy story" is a useful heuristic for rationality, but it is not a faithful map of the underlying cognitive science debate.
