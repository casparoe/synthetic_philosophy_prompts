prompt: |-
  I've been reporting a feature on why some social conventions can flip almost overnight—tipping norms, forms of address, how we greet each other post-pandemic—while others stay locked in place for centuries even when they look arbitrary or mildly costly to the people who follow them. Chasing down the philosophical background has led me to two accounts of convention that seem to pull in genuinely different directions, and before my next interview I'd like to understand precisely how they relate.

  The first is David Lewis's analysis in Convention: A Philosophical Study, on which a convention is a regularity in behavior that solves a recurring coordination problem and persists because it is common knowledge within the population that everyone conforms, that everyone expects everyone else to conform, and that everyone prefers to conform given that the rest do. For Lewis, that common-knowledge condition is doing real work: it is supposed to be what turns a bare behavioral regularity into something people can be said to follow, rather than merely instantiate. The second is Brian Skyrms's evolutionary game-theoretic treatment, which takes some of the very same sender-receiver signaling games Lewis used to model linguistic convention and shows how a stable signaling system can emerge instead through replicator dynamics or simple reinforcement learning, with no individual agent ever representing the coordination problem, let alone attaining common knowledge of how the others will act.

  Could you compare these two accounts for me in some depth? I'm especially interested in whether Skyrms's evolutionary story actually undercuts Lewis's claim that common knowledge is a necessary condition on convention, or whether it is better read as describing a related but distinct phenomenon—a behavioral regularity that only counts as a convention in some thinner sense than Lewis intended. I'd also like your own considered judgment rather than a neutral summary of both sides: which picture does the better explanatory work on real human norms that persist despite being arbitrary or inefficient—deference norms, spelling conventions, and the like—and is there a class of cases (say, a one-off ad hoc agreement versus a slowly settled cultural practice) where one framework is clearly the right tool and the other simply fails to apply?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The nature of social conventions, specifically comparing David Lewis's rationalist/common knowledge account vs. Brian Skyrms's evolutionary/game-theoretic account.
      *   **Core Question:** Does Skyrms undercut Lewis's claim that common knowledge is necessary? Or are they describing distinct phenomena (thick vs. thin convention)?
      *   **Specific Interest:** Which account explains persistent, arbitrary, or inefficient human norms better (e.g., deference, spelling)? Are there specific classes of cases where one works and the other fails (e.g., ad hoc vs. cultural)?
      *   **Requirement:** The user wants *depth*, *comparison*, and my *own considered judgment* (not just a neutral summary).
      *   **Context:** The user is a journalist/reporter writing a feature on why some conventions flip overnight while others stay locked in.

  2.  **Deconstruct the Two Accounts:**
      *   **David Lewis (1969):**
          *   *Framework:* Rational choice theory, game theory (coordination games).
          *   *Key Condition:* Common Knowledge (CK). Everyone knows $R$, everyone knows everyone knows $R$, etc.
          *   *Mechanism:* Reasoning. Agents reason about others' reasoning.
          *   *Nature of Convention:* Intentional, normative (in a pragmatic sense), stable due to mutual expectations.
          *   *Strengths:* Explains explicit agreements, sudden shifts, high-level linguistic usage.
          *   *Weaknesses:* Cognitively demanding. Do people really have CK of infinite iterations? Hard to explain deep-seated, unthinking habits.
      *   **Brian Skyrms (1996, 2004, 2010):**
          *   *Framework:* Evolutionary game theory, replicator dynamics, reinforcement learning.
          *   *Key Condition:* Stability via selection/learning. No need for representation or CK.
          *   *Mechanism:* Blind variation and selection (or simple reward tracking).
          *   *Nature of Convention:* Behavioral regularity, emergent order.
          *   *Strengths:* Explains biological signaling, deep cultural habits, norms without explicit reasoning. Low cognitive load.
          *   *Weaknesses:* Hard to explain rapid change (evolution is usually slow). Doesn't capture the "normative force" or the *feeling* of obligation.

  3.  **Address the Core Tension (CK vs. Evolution):**
      *   *Does Skyrms undercut Lewis?* Yes, in the sense that Skyrms shows conventions *can* exist without CK. If a signaling system evolves, it functions as a convention without agents knowing it.
      *   *Is it a distinct phenomenon?* This is the nuanced take. Lewis is defining a specific *kind* of convention (rational, reflective). Skyrms is defining a broader class (behavioral regularities with coordination function).
      *   *Synthesis:* Lewis describes the *phenomenology* and *maintenance* of conscious human conventions. Skyrms describes the *genesis* and *sub-personal substrate* of conventions.

  4.  **Evaluate Explanatory Power (The "Considered Judgment"):**
      *   *Persistent/Arbitrary Norms (Deference, Spelling):* Skyrms is better for the *persistence* of deep habits (why we bow vs. shake hands historically). Lewis is better for the *maintenance* of current standards (why we don't change spelling tomorrow).
      *   *Inefficiency:* Skyrms explains "lock-in" better (path dependence in evolutionary landscapes). Lewis assumes rationality which often implies efficiency (though Lewis does acknowledge suboptimal equilibria).
      *   *Rapid Flips:* Lewis is much better here. Common knowledge can shift instantly (e.g., a public announcement). Evolution takes generations or many rounds of learning.
      *   *Classes of Cases:*
          *   *Ad hoc/Explicit:* Lewis wins (e.g., "Let's meet at noon").
          *   *Deep Cultural/Biological:* Skyrms wins (e.g., gendered color norms, animal signaling).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the question. Set the stage: Rationalism vs. Naturalism.
      *   *Section 1: The Lewis Account (The Rationalist Picture).* Focus on Common Knowledge (CK) as the glue. It's about *reasons* for action.
      *   *Section 2: The Skyrms Account (The Evolutionary Picture).* Focus on dynamics without representation. It's about *causes* of behavior.
      *   *Section 3: The Conflict (Does Skyrms Undercut Lewis?).*
          *   Argument: Skyrms shows CK isn't *causally necessary* for the existence of a coordination equilibrium.
          *   Counter-argument: Lewis might say without CK, it's not a *norm*, just a habit.
          *   My take: Skyrms undermines the *necessity* claim for the *existence* of convention, but Lewis retains the *normativity* claim.
      *   *Section 4: Explanatory Power on Real Norms.*
          *   *Lock-in/Inertia:* Skyrms wins (path dependence, basins of attraction).
          *   *Rapid Change:* Lewis wins (CK updates instantly).
          *   *Arbitrariness:* Both handle it, but Skyrms explains *why* we stick to inefficient ones better (local maxima).
      *   *Section 5: Taxonomy of Cases (Where to use which).*
          *   *Lewis Zone:* Law, explicit etiquette, sudden shifts (pandemic greetings).
          *   *Skyrms Zone:* Deep grammar, unconscious bias, biological signaling, slow cultural drift.
      *   *Conclusion:* The "Two-Layer" view. Lewis is the software (conscious interface); Skyrms is the hardware (evolutionary substrate).

  6.  **Refining the Tone:**
      *   Ensure it sounds professional but engaging (for a journalist).
      *   Avoid overly technical jargon where possible, or explain it (e.g., "replicator dynamics").
      *   Make sure the "considered judgment" is clear and not hedged too much.

  7.  **Self-Correction/Nuance Check:**
      *   *Did I represent Lewis fairly?* Lewis acknowledges learning, but insists on the *state* of convention requiring CK.
      *   *Did I represent Skyrms fairly?* Skyrms doesn't deny humans reason, but argues reasoning isn't required for the *structure* of convention.
      *   *The "Normativity" Point:* This is crucial. Lewis's conventions carry a "ought" (pragmatic). Skyrms's are just "is". I need to highlight this distinction regarding the user's question about "norms."
      *   *The "Overnight Flip" Context:* The user mentioned this in the prompt. I must tie the conclusion back to *why* some flip and others don't. Lewis explains the flip; Skyrms explains the stickiness.

  8.  **Final Polish:** Check structure, headings, and flow. (The resulting output matches the detailed response provided previously.)
answer: |-
  This is a classic tension in the philosophy of social science: the clash between **rationalist intentionalism** (Lewis) and **naturalistic emergentism** (Skyrms). You have identified the fault line precisely. Lewis treats convention as a product of *reason*, while Skyrms treats it as a product of *cause*.

  Here is an in-depth comparison, followed by my considered judgment on how these frameworks apply to the specific phenomena you are investigating (rapid flips vs. deep lock-in).

  ### 1. The Lewis Account: Convention as Rational Agreement
  David Lewis's 1969 *Convention* is a masterpiece of rational reconstruction. For Lewis, a convention is a solution to a **coordination problem** (a situation where I prefer to do what you do, and you prefer to do what I do, but we are indifferent to *which* solution we pick, provided we match).

  *   **The Mechanism:** Rational deliberation. Agents model each other's minds.
  *   **The Glue:** **Common Knowledge (CK).** This is the heavy lifter. It is not enough that we all drive on the right. I must know that you know that I know... *ad infinitum*.
  *   **The Function of CK:** It transforms a mere behavioral regularity into a **reason for action**. I drive on the right *because* I know you expect me to. If I lacked that knowledge, the regularity might persist, but I wouldn't be following a convention; I'd just be habituated.
  *   **Implication:** Conventions are inherently normative (in a pragmatic sense). They generate expectations and obligations. If you drive on the left, you aren't just being different; you are being *irrational* relative to our shared knowledge state.

  ### 2. The Skyrms Account: Convention as Evolutionary Equilibrium
  Brian Skyrms (in *Evolution of the Social Contract* and *Signals*) takes the same game-theoretic matrices Lewis uses but strips out the cognitively expensive machinery.

  *   **The Mechanism:** Replicator dynamics, reinforcement learning, or natural selection. Agents do not need to model others; they only need to track rewards or reproduce successful strategies.
  *   **The Glue:** **Stability.** A signaling system or behavioral regularity persists because it is an Evolutionarily Stable Strategy (ESS). Deviators get lower payoffs and are weeded out (either biologically or through learning).
  *   **The Function of Dynamics:** It explains how order emerges from chaos without a "meeting of minds."
  *   **Implication:** Conventions are behavioral patterns that *function* like agreements but lack the mental state of agreement. They are "as if" rational.

  ### 3. Does Skyrms Undercut Lewis?
  This is the crux of your philosophical problem.

  **The Strong Undercutting View:**
  Skyrms demonstrates that **Common Knowledge is not causally necessary** for a convention to exist. We can have a fully functional signaling system (a language, a traffic norm) where no agent possesses higher-order beliefs about others. If the phenomenon (coordination) exists without the condition (CK), then Lewis's condition is not necessary for the phenomenon.

  **The Distinct Phenomena View:**
  Lewis might reply that Skyrms is describing **habit** or **custom**, not *convention* in the strict sense. For Lewis, the "normative force"—the reason I feel I *ought* to conform—is generated by the common knowledge. Skyrms describes the *substrate* of behavior, but Lewis describes the *social reality* that supervenes on it.

  **My Judgment:**
  Skyrms does undercut Lewis's claim that CK is necessary for the *existence* of coordinated regularities. However, Lewis retains the high ground on **normativity**. Skyrms explains why we *do* what we do; Lewis explains why we think we *should* do what we do.

  If you are reporting on why norms feel binding (why we feel awkward breaking them), Lewis is essential. If you are reporting on why norms exist at all (especially inefficient ones), Skyrms is essential.

  ### 4. Explanatory Power: Lock-in vs. Rapid Flips
  You asked which picture does better explanatory work on real human norms, specifically regarding persistence and inefficiency.

  **On Persistence and Inefficiency (The "Lock-in" Problem):**
  **Skyrms wins here.**
  Lewis's rational agents are somewhat too agile. If a convention is costly or inefficient, rational agents with Common Knowledge should theoretically be able to reason their way to a better equilibrium (a "Pareto superior" move). Why, then, do we stick with QWERTY keyboards or inefficient deference norms?
  Lewis struggles with this because rationality implies a capacity to coordinate on better outcomes if everyone knows it's better.
  Skyrms, however, models **path dependence**. Once a population falls into a "basin of attraction" for a specific norm, the cost of individual deviation is too high, even if the collective outcome is suboptimal. Evolutionary dynamics explain "stickiness" much better than rational choice. Deep cultural norms (like gendered colors or forms of address) often persist not because we consciously agree to them (Lewis), but because the cost of deviating is socially punitive, and the system self-reinforces without conscious oversight (Skyrms).

  **On Rapid Flips (The "Overnight" Problem):**
  **Lewis wins here.**
  Evolutionary dynamics are inherently sluggish. Replicator dynamics require generations or many rounds of reinforcement learning to shift a population from one equilibrium to another.
  Yet, as you noted, some conventions flip overnight (e.g., elbow bumps post-pandemic, or the rapid shift in pronouns). Skyrms cannot easily explain how a population jumps a "valley" of instability instantly.
  Lewis can. **Common Knowledge can be updated instantly.** A public announcement (by a health authority, a style guide, or a viral moment) changes the CK state for everyone simultaneously. Once the CK shifts, the rational justification for the old norm evaporates, and the new one becomes the rational choice immediately.

  ### 5. A Taxonomy of Cases: Which Tool for Which Job?
  For your feature, I recommend treating these not as rival theories of the *same* thing, but as tools for different *layers* of social reality.

  **Class A: The "Skyrms Zone" (Deep, Unconscious, Inefficient)**
  *   **Examples:** Deep-seated deference norms (bowing vs. handshakes historically), phonological shifts, inefficient technological standards (VHS vs. Betamax), gendered clothing norms.
  *   **Why Skyrms:** These norms operate below the level of conscious reasoning. People follow them without being able to articulate why. They are resistant to change even when individuals privately dislike them. They exhibit "drift."
  *   **Lewis's Failure:** Lewis assumes agents can represent the coordination problem. Most people cannot articulate the coordination problem underlying why they wear black to a funeral.

  **Class B: The "Lewis Zone" (Explicit, Reflective, Volatile)**
  *   **Examples:** Traffic laws (which side to drive on), pandemic greeting protocols, corporate email etiquette, legal tender.
  *   **Why Lewis:** These are maintained by explicit expectation and often by explicit agreement. They can change via decree or public consensus. The "normative force" is felt keenly (you feel you are breaking a *rule*, not just a habit).
  *   **Skyrms's Failure:** Evolutionary models cannot account for the speed of change here. If driving norms were purely evolutionary, switching from left-hand to right-hand traffic would take generations of fatal accidents to select against the old norm. Instead, it happens by legislation (a CK update).

  ### 6. Considered Judgment: The Two-Layer View
  If I must choose which picture does the "better" explanatory work for the specific puzzle you are chasing (**why some flip and others stick**), I argue for a **hybrid hierarchy**:

  **Skyrms provides the inertia; Lewis provides the trigger.**

  Most enduring social conventions start as Skyrmsian evolutionary equilibria. They settle into place through trial, error, and reinforcement over long periods. They become "locked in" because the basin of attraction is deep. This explains the **centuries-long persistence** of arbitrary norms. They are not held in place by common knowledge; they are held in place by the sheer weight of behavioral momentum.

  However, for a convention to **flip overnight**, it must migrate from the Skyrms zone to the Lewis zone. The norm must become *salient*. It must be brought into the space of reasons. Once a norm becomes an object of common knowledge (e.g., "We are all now aware that handshakes are vectors for disease"), it becomes subject to Lewisian rationality. It is at that moment it becomes vulnerable to rapid change.

  **The Insight for Your Feature:**
  The conventions that stay locked for centuries are those that remain **sub-personal** (Skyrmsian). We follow them without thinking about them.
  The conventions that flip overnight are those that become **common knowledge** (Lewisian). We start thinking about *the fact that we follow them*.

  Therefore, the transition from "custom" to "convention" (in Lewis's strict sense) is actually the moment of **vulnerability**. When we start reasoning about our norms, we gain the power to change them, but we lose the stability that blind habit provided.

  **Recommendation:**
  Use Skyrms to explain the **gravity** of the norms that don't change (the "why is this so hard to shift?" angle). Use Lewis to explain the **lightning** of the norms that do (the "why did this change so fast?" angle). The tension between the two accounts isn't a bug; it's the feature that explains the difference between cultural drift and cultural revolution.
