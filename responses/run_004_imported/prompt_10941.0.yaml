      "It's not that I forgot," Elena said, staring at the black screen of her phone. The parking garage hummed, fluorescent lights flickering overhead. "It's that I offloaded it. Correctly. Efficiently."

      "You offloaded your home address," Mark said. He was leaning against a concrete pillar, arms crossed over his chest. He looked as gray as the walls. "That's not offloading, El. That's atrophy. You don't know where we live."

      "I know *how* to access where we live. It's the Otto argument. If I had a physical notebook where I wrote our address, and I trusted it implicitly, you'd say recalling that note is an act of memory. Why does silicon change the ontology? The process is identical."

      "Because a notebook doesn't ping satellites," Mark said. "It doesn't auto-update when roads close. It's coupled, not constituted. Just because you're causally connected to it doesn't mean it's *you*. That's the coupling-constitution fallacy. You're mistaking a tool for an organ."

      "You're drawing a line at the skull because it's convenient, not because it's true. The skin isn't a metaphysical barrier. If the resource is reliable, accessible, and trusted, it's part of the cognitive system. That device was always available. It was automatically accessed. It *was* my memory."

      "Then where does it stop?" Mark pushed off the pillar, pacing the empty lane. "That's the cognitive bloat objection. If external access counts as cognition, does the mind stop at the phone? Is Google your frontal lobe? If I ask you a question and you search it, are *you* thinking, or is the server farm thinking?"

      "You're being literalist. It's about integration. I feel disabled right now. My cognitive reach has been amputated. Does the phenomenology not count? I literally cannot formulate the plan to get home without that extension."

      "Derived versus non-derived content," Mark muttered, rubbing his eyes. "The phone holds symbols. You give them meaning. Without you, it's just magnetic states. Your brain *is* the meaning. The phone is just a mirror."

      "My brain is also just electrochemical states without context. Look, I'm not saying the phone has qualia. I'm saying the *system* of Elena-plus-Phone is the thinking unit. You're clinging to biological chauvinism."

      "I'm clinging to boundaries. You rely on me to pick you up when you're drunk. Does that make me part of your motor cortex? If I die, do you lose the ability to walk?"

      "That's different. You're an agent. The phone is transparent."

      "Is it? Or is it just quieter?" Mark sighed, the fight draining out of him along with the adrenaline. "I know the address. I remembered it. Biological, messy, internal."

      "Because you're stubborn."

      "Because I'm internalist." He walked over and offered a hand. "Come on. I'll drive. But I'm not letting you navigate."

      Elena took his hand, pulling herself up. "Fine. But if we get lost, it's your biology failing, not my tech."

      "If we get lost," Mark said, opening the car door, "it's because we're human. And it's 2am."

