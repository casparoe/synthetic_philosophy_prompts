answer: |-
  This is a superb question that cuts to the heart of the hermeneutic tension in Douglass's mature political thought. You are right to identify the apparent contradiction: a rigid textualism that refuses to consult the "secret intentions" of the framers, married to a robust natural-law purposivism that reads the document through the Declaration.

  To answer your first question: **Douglass fits neatly into neither modern Original Public Meaning (OPM) textualism nor standard Living Constitutionalism.** Instead, his 1860 position represents a distinct category we might call **"Natural Rights Textualism"** or **"Constitutional Perfectionism."**

  Here is how that distinction breaks down, and how it applies to *Shelby County*.

  ### 1. Douglass vs. Modern Originalism and Living Constitutionalism

  **Why he is not a Scalia-style Original Public Meaning Textualist:**
  Modern OPM textualism (particularly in its conservative iteration) seeks the semantic meaning of the text as understood by the public at the time of ratification. If Douglass were a strict OPM originalist, he would have to concede that in 1787, the "public meaning" of "We the People" and "Liberty" was widely understood to exclude enslaved Africans. Scalia himself acknowledged that the original Constitution was compatible with slavery.

  Douglass rejects this. In the Glasgow speech, he distinguishes between the **intentions of the men** (the framers) and the **intent of the instrument** (the Constitution). He argues that while the *men* may have been complicit in slavery, the *paper* contains no sanction for it. For Douglass, the "meaning" of the text is not determined by the historical expectations of its authors, but by the moral logic of the words themselves. When the text says "liberty," it means natural liberty, regardless of whether the 1787 public intended to apply it universally. This is closer to **Dworkinian moral reading** than to Scalia's historical semantics, yet it retains a textualist constraint that Dworkin sometimes loosened.

  **Why he is not a Standard Living Constitutionalist:**
  Living Constitutionalism often posits that the Constitution's meaning evolves with contemporary societal values. Douglass does not argue that the Constitution *changed* between 1787 and 1860. He argues that the anti-slavery meaning was *always there*, waiting to be claimed. He insists on the fixity of the text to deny the Garrisonian claim that the document was inherently corrupt. For Douglass, the Constitution is a "glorious liberty document" not because it evolves, but because it was *born* that way, and pro-slavery forces had simply hijacked its interpretation through custom and precedent (what he called the "slaveholding interpretation").

  **The Synthesis:**
  Douglass's method is **positivist regarding the source** (only the written text counts) but **naturalist regarding the content** (the text presupposes natural rights). He treats the Constitution as a legal deed that must be interpreted by the "rules of law," but he assumes that the "rules of law" presume justice.

  ### 2. Douglass on *Shelby County v. Holder*

  If we apply Douglass's 1860 hermeneutic (and his Reconstruction-era nationalism) to *Shelby County*, the result is stark. **Douglass would likely view *Shelby County* as a catastrophic betrayal of textualism, precisely mirroring the pro-slavery jurisprudence he fought against.**

  Here is the breakdown of why:

  **A. The "Equal Sovereignty" Principle as Extratextual**
  In 1860, Douglass railed against the "secret intentions" and unwritten understandings that allowed slavery to exist despite the text's silence. In *Shelby County*, the Roberts Court relied on the "fundamental principle of equal sovereignty among the states" to strike down Section 4(b) of the Voting Rights Act.

  As you noted, this principle is not in the text. It is a structural inference drawn from the admission of new states. Douglass would identify this immediately as the kind of **extratextual reasoning he denounced in Glasgow**. He argued that if the text does not sanction slavery, slavery is illegal. Conversely, if the text *does* sanction federal enforcement of voting rights (15th Amendment, Section 2), then state sovereignty claims cannot override it. To allow an unwritten principle of "equal sovereignty" to nullify a written enforcement power would be, for Douglass, allowing "intentions nowhere stated" to override the "plain reading" of the law.

  **B. The 15th Amendment as a "Second Founding"**
  By the 1870s, Douglass viewed the Reconstruction Amendments not merely as amendments, but as a **re-founding** of the Republic. In his 1867 speech "Reconstruction," he argues that the pre-war federalism is dead. The 15th Amendment explicitly shifted the balance of power regarding suffrage from the States to the Federal Government.

  *Shelby County* treats the 15th Amendment as an exception to the original 1787 structure of federalism. Douglass would argue the opposite: the 15th Amendment *altered* the structure of federalism. To insist on "equal sovereignty" in the face of the 15th Amendment is to prioritize the *original* Constitution (which Douglass argued was anti-slavery but structurally weak) over the *Reconstruction* Constitution (which was explicitly remedial and nationalist).

  Douglass would likely argue that the "equal sovereignty" doctrine is the ghost of the "state sovereignty" doctrine that protected slavery before the war. In 1860, he insisted the National Government had the power to abolish slavery in the states if the text allowed. In 1870, he insisted the National Government had the duty to protect voting rights. *Shelby County* restricts that duty based on a pre-war structural assumption.

  **C. The "Rules of Law" and Remedial Text**
  Douglass insisted on construing the Constitution according to "ordinary legal rules." In legal interpretation, specific text usually overrides general principle.
  *   **The Text:** 15th Amendment, Section 2: "The Congress shall have power to enforce this article by appropriate legislation."
  *   **The Principle:** Equal Sovereignty (unwritten).

  Douglass would argue that under ordinary legal rules, the explicit grant of enforcement power must trump an implicit structural presumption. To do otherwise is to engage in the very "construction by inference" that pro-slavery jurists used to find property rights in human beings where the text said "persons."

  ### 3. The Verdict

  Douglass would likely view *Shelby County* as **the return of the "covenant with death" logic, disguised as textualism.**

  While the majority in *Shelby* claimed to be protecting the Constitution's structure, Douglass would argue they were protecting the *interests* of the states (akin to the slave states) against the *text* of the Amendment. He would see the "equal sovereignty" principle as a "secret intention" of the federal structure that the 15th Amendment explicitly abrogated.

  He would say to the Court what he said to the Garrisonians: **Do not look behind the paper for reasons to limit liberty.**
  *   To the Garrisonians (1850): "Do not look at the framers' complicity; look at the text's liberty."
  *   To the *Shelby* Court (2013): "Do not look at the original federal structure; look at the text's enforcement clause."

  ### Conclusion for Your Dissertation

  If you are framing this in your work, you might argue that Douglass offers a **third way** in constitutional theory that contemporary scholars often overlook. He demonstrates that **textual fidelity can be a radical, progressive tool** if one accepts that the text encodes normative moral truths (Natural Law) that override historical expectations (Original Expected Application).

  Regarding *Shelby County*, Douglass serves as a potent critic of **structural originalism** that ignores the **textual revolution of Reconstruction**. He would argue that the 15th Amendment is not a narrow exception to state sovereignty, but a redefinition of it. To hollow it out using an extratextual principle is to commit the exact sin he accused the Taney Court of in *Dred Scott*: allowing unwritten racial and structural assumptions to defeat the plain legal force of the Constitution's liberty guarantees.

  In short: Douglass would be a textualist regarding the **Reconstruction Amendments**, but he would view any extratextual principle used to diminish their scope as a violation of the "rules of law" he championed in Glasgow.
