      *   **The Circulatory Alternative:** Discuss the fallback. It's biologically sound but practically difficult (DCD limitations).
      *   **The Verdict:** Argue for abandoning the pretense. WBD is not death. It is a state of irreversible unconsciousness with artificial somatic support. We should justify organ donation on *moral* grounds, not biological fiction. This preserves scientific integrity.

  7.  **Refining the Tone:**
      *   Avoid condescension.
      *   Use physiological terms correctly (homeostasis, neuroendocrine, somatic).
      *   Be decisive. No "on the one hand, on the other."
      *   Address the "moving the goalposts" feeling directly.

  8.  **Self-Correction/Nuance Check:**
      *   *Check:* Did Shewmon's patients survive *without* ventilation? No, they needed ventilation.
      *   *Nuance:* The PCBE argues ventilation = external support = lack of integration.
