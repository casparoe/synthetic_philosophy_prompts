answer: |-
  *To a young colleague who has pressed the "Astronomical Waste" argument upon him, Cambridge, 1929*

  My dear friend,

  You have presented me with a formidable calculus. It is seductive, I admit. It has the clean, cold beauty of a differential equation, and it leverages the very machinery of probability and value that I have spent these last years trying to clarify. You argue that if we accept the logic of expected utility—that an action's worth is the product of its probability and its consequence—then the sheer magnitude of the future must swamp the present. A tiny reduction in the risk of extinction, multiplied by trillions of potential lives, yields an expected value that renders our immediate sufferings and joys negligible.

  You suggest that my "Epilogue" was merely a poetic flourish, a sentimental refusal to follow the math where it leads. You ask if my own work in *Truth and Probability* does not bind me to this cosmic bookkeeping.

  I must tell you plainly: it does not. In fact, it is precisely because of that work that I must reject your conclusion. You are using the tools of logic to dismantle the very conditions under which logic applies to human life.

  Let us look first at **probability**. In my view, probability is not a mysterious frequency inherent in the universe, nor is it a logical relation between propositions in the abstract. It is a *degree of belief*. And how do we measure a degree of belief? By the odds at which a man is prepared to bet. It is tied to *action*.

  When you speak of the "accessible universe" and the "next billion years," you are asking me to assign a probability to a state of affairs that lies entirely beyond the horizon of my evidence, and indeed, beyond the horizon of any possible action I can verify. For a probability to be rational, it must be grounded in a system of beliefs that can be tested and adjusted by experience. What experience can correct your estimate of the population of the 30th century? None.

  If I cannot conceive of the outcome, I cannot form a coherent belief about it. If I cannot form a belief, I cannot assign a probability. To plug an arbitrary number into the expected utility formula here is not mathematics; it is superstition dressed in algebra. You are treating the future not as a field of human possibility, but as a storage depot of value waiting to be filled. But value is not a substance like corn or coal. It is a relation between a mind and its world.

  This brings me to **value**. You speak of "astronomical waste," as if lives were coins dropped in the dust. But in my ethics, as in Moore's (though I think I have corrected him here), the good is tied to the *experience* of the good. You ask me to sacrifice the definite goods of the foreground—the love of my friends, the solution of a problem, the relief of a present pain—for the sake of "potential people."

  But potential people do not exist. They have no preferences. They have no capacity for enjoyment. To say we owe them a duty is to speak nonsense. We can only have duties regarding the *kind* of future we desire, based on the values we hold *now*. And what are those values? They are human values. They are finite.

  This is where my "perspective" returns. You charge me with drawing the world "not to scale." I answer that a map drawn to scale for a human walker is useless if it requires a microscope to read the path at his feet. Ethics is not for the universe. The universe, as I have said, does not know we are here. Ethics is for *us*. It is a system of navigation for finite beings with limited powers and limited imaginations.

  When you multiply a human good by $10^{50}$, you do not get a "larger" human good. You get a number that has ceased to mean anything to a human mind. It is no longer a guide to action. It is a fetish.

  In *Truth and Probability*, I argued that the laws of probability are norms for consistency in belief. But consistency requires that the terms remain meaningful throughout the calculation. If the "utility" of a future life is so remote that it cannot be compared in any sensible way to the utility of a present life—if the trade-off requires me to treat my living brother as a rounding error—then the calculation has left the realm of rational choice and entered the realm of fanaticism.

  You say this is "longtermism." I call it a flight from responsibility. It is easier to worry about the extinction of a species in a million years than to feed a hungry child in Cambridge today. The former requires only imagination; the latter requires effort.

  So, no. My mathematics does not commit me to your conclusion. It saves me from it. For it teaches me that probability is the logic of partial belief *in action*, and value is the object of *human* desire. To abandon the foreground for the background is not to be more rational. It is to cease to be an agent at all.

  I remain, etc.

  **F.P. Ramsey**
