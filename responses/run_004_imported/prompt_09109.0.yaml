  8.  *(Self-Correction on the "Vindication" point)*: Wait, would NEG actually vindicate the "maker's knowledge"? Hobbes thinks we make the *definitions*, but he thinks the *consequences* are forced by the nature of motion. If I define a "straight line" differently, Hobbes might say I'm not talking about a straight line anymore. He is a realist about the *referents* of geometric terms (they are accidents of bodies). So NEG might look like changing the subject to him, not constructing alternative worlds. I need to emphasize this. To Hobbes, "parallel" *means* equidistant and never meeting. If you say they meet, you contradict the definition. The insight of NEG is that "parallel" can be defined differently *consistently*. Hobbes would likely view this as sophistry unless it maps to physical motion.

      *Revised Plan:* Emphasize that for Hobbes, definitions aren't arbitrary; they are reports of how we conceive generation. If the generation implies Euclidean space, then non-Euclidean is "false" naming. But if physical space turns out non-Euclidean, then his physics is wrong. The certainty remains in the reasoning, but the application to nature becomes contingent. This breaks his system because he needs the application to be necessary for *Scientia*.

