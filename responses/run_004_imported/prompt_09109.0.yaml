answer: |-
  This is a fantastic question. It cuts right to the bone of Hobbes's philosophical project, which is often misunderstood as merely political when it is actually a unified system of materialism, epistemology, and geometry. You are right to sense a tension here: Hobbes's epistemology of "maker's knowledge" seems flexible enough to accommodate multiple systems, but his ontology (materialism) seems to demand a single, true description of the physical plenum.

  Let's work through this using Hobbes's commitments in *De Corpore* (1655) and his pamphlets against Wallis, keeping Kant out of it and focusing strictly on nominalism, materialism, and the causal theory of knowledge.

  ### 1. The Hobbesian Baseline: Generation and Certainty
  To see where Non-Euclidean Geometry (NEG) hits him, we have to be precise about *why* Hobbes thinks geometry yields *scientia* (certain knowledge).

  For Hobbes, all reasoning is computation (addition and subtraction of concepts). Certainty arises only when we know the **cause** of the thing we are reasoning about. In natural philosophy (physics), we observe effects and guess at causes; thus, physics is hypothetical and probabilistic. We didn't make the stars, so we can't be certain of their motives.

  In geometry, however, we *do* make the objects. As you noted, this is "maker's knowledge." But for Hobbes, this isn't just about logical consistency. It is about **generation via motion**.
  *   **Definition:** A definition in geometry is not a arbitrary label; it is a report of how the mind generates the phantasm of the figure.
  *   **Truth:** A true proposition is one where the predicate is necessarily contained in the subject *because of the way the subject was generated*.
  *   **Space:** Crucially, Hobbes is a substantivalist about space in a materialist sense. There is no "empty space." Space is the "phantasm of a thing existing without the mind simply." But real extension belongs to bodies. Geometry studies quantity abstracted from body, but it remains grounded in the laws of how matter moves.

  So, for Hobbes, Euclidean geometry isn't just one consistent system; it is the necessary logic of extension and motion in the actual universe.

  ### 2. The Non-Euclidean Challenge: Vindication or Wreckage?
  When Bolyai, Lobachevsky, and Riemann arrive, they present Hobbes with a dilemma that splits his epistemology from his ontology.

  #### The Epistemological Vindication (The "Maker" Argument)
  On the surface, NEG looks like it confirms Hobbes's "maker's knowledge." Hobbes argues that we have certainty because we lay down the definitions and construct the consequences.
  *   **Hobbesian Take:** "I define a line this way; I derive these consequences. That is certain."
  *   **NEG Reality:** "I define a line *that* way (hyperbolic); I derive *those* consequences. That is also certain."

  If Hobbes were a pure formalist, he would say: "Excellent. There are multiple domains where humans generate objects and achieve certainty. Geometry remains the gold standard of *scientia*." The existence of multiple consistent geometries shows the power of the human mind to construct causal chains from defined generations.

  #### The Ontological Wreckage (The "Materialist" Argument)
  Here is where the system breaks. Hobbes is not a formalist. He is a materialist who believes geometry is the **foundation of physics**.
  In *De Corpore*, Hobbes intends for geometry to provide the necessary laws for natural philosophy. If geometry is certain, and physics is built on geometry, then physics can (in principle) attain a higher degree of certainty than mere observation.

  *   **The Problem:** If there are multiple consistent geometries, which one describes the **actual motion of actual bodies**?
  *   **Hobbes's Dilemma:**
      1.  **If he says "All of them are true":** He contradicts his materialism. Two bodies cannot move in Euclidean straight lines *and* hyperbolic geodesics simultaneously in the same plenum. Physical space is singular.
      2.  **If he says "Only one is physically true":** He must appeal to **experience** to decide which one.

  This second option is the killer. For Hobbes, experience yields only probability, not *scientia*. If the choice between Euclidean and Non-Euclidean geometry depends on measuring the angles of a giant cosmic triangle (to see if they sum to 180°), then geometry ceases to be a priori certain knowledge of causes and becomes a posteriori hypothetical knowledge of effects.

  **The Verdict:** It wrecks him.
  Hobbes's claim to certainty relies on the identity of **logical necessity** and **physical necessity**. He believes that because we construct the definitions of geometry, the truths derived are necessary *and* applicable to the physical world. NEG severs this link. It shows that logical necessity (consistency of the system) does not guarantee physical necessity (truth about the world).

  If Hobbes accepts NEG, he must admit that geometry, while internally certain, is not necessarily the language of nature. This collapses his project in *De Corpore* to unify philosophy. He would be forced to admit that the geometry of space is a contingent fact of the universe, not a necessary truth of reason. For a man who built his reputation on deducing politics and physics from first principles with geometric rigor, this is a catastrophic concession.

  ### 3. Would He Contradict Himself?
  Yes, specifically regarding his theory of **Definition**.

  In *De Corpore*, Hobbes insists that definitions are the "first principles" of science. They are arbitrary in the sense that we choose the names, but they must be **conceivable**. You cannot define a contradiction (e.g., a square circle) because you cannot conceive the generation of such a thing.

  Hobbes assumes that the Euclidean parallel postulate is part of the *conceivable generation* of a line in space. He would likely argue that Non-Euclidean "lines" are not truly lines because they do not match the phantasm of the shortest path generated by simple motion.

  However, if confronted with the rigorous consistency of NEG, Hobbes would face a contradiction between:
  1.  **Nominalism:** Truth is about the correct ordering of names/definitions. (Supports multiple geometries).
  2.  **Materialism:** Names refer to accidents of bodies. There is only one set of accidents for bodies in space. (Supports one geometry).

  He would likely try to escape by claiming NEG is merely "word-play" (as he accused Wallis's algebra of being). He would argue that NEG geometers are changing the meaning of the word "straight" without changing the name, thus violating the laws of proper definition. But this is a defensive retreat. It saves his ontology by denying the mathematical legitimacy of NEG, which a CS PhD student (and indeed any modern mathematician) knows is untenable. He would be defending the *truth of Euclid* by attacking the *definitions of Lobachevsky*, effectively prioritizing his physics over his own epistemology of construction.

  ### 4. The Hilbert Postscript: Despise or Admire?
  You asked about Hilbert's formalism (stripping geometry of intuitive content, "points, lines, planes" = "tables, chairs, beer mugs").

  **Hobbes would absolutely despise it.** In fact, he would view it as the ultimate culmination of the "vain philosophy" he spent his life fighting.

  Here is why:
  1.  **Causality is King:** For Hobbes, to know something scientifically is to know its **cause**. In geometry, the cause of a figure's properties is its **generation** (the motion that creates it). Hilbert's axiomatic method explicitly removes the need for generation or intuition. It treats geometry as a logical game of implications. To Hobbes, this is reasoning without a causal anchor. It is "reckoning without understanding."
  2.  **The Attack on Algebra:** Hobbes hated Wallis partly because Wallis used algebraic symbolism to solve geometric problems. Hobbes saw this as obscuring the physical motion with opaque symbols. Hilbert takes this abstraction to the extreme. For Hobbes, if you cannot trace the proposition back to a mental image of motion, you are not doing philosophy; you are shuffling counters.
  3.  **Truth vs. Consequence:** Hobbes distinguishes between "truth" (correct predication) and "science" (knowledge of consequences from causes). Hilbert offers a system of consequences without causes. Hobbes would call this a "system of tautologies," useful perhaps for calculation, but devoid of the *scientia* that grants power over nature.

  **The Irony:**
  The irony, which your CS background probably appreciates, is that Hobbes's desire for a "universal calculus of reason" (a dream shared by Leibniz later) actually *leads* to Hilbert. Hobbes wanted reasoning to be as indisputable as addition. Hilbert showed that to make it indisputable, you have to strip it of the messy semantic content (motion, matter) that Hobbes thought was essential.

  Hobbes wanted certainty *through* meaning (the meaning of motion). Hilbert found certainty *through* syntax (the manipulation of symbols). Hobbes would see Hilbert's victory as a Pyrrhic one: you saved the certainty, but you killed the connection to the real world that made the certainty matter.

  ### Summary
  If you dropped a book on Hyperbolic Geometry on Hobbes's desk in 1660:
  1.  **Epistemologically:** He might initially admire the rigorous deduction (Maker's Knowledge).
  2.  **Ontologically:** He would reject its physical applicability. He cannot tolerate a universe where the "nature of space" is contingent.
  3.  **Systemically:** It breaks his bridge between Math and Physics. He can no longer claim Physics is demonstrable via Geometry if Geometry is just one of many consistent menus.
  4.  **Hilbert:** He would view formalism as the triumph of the Scholastics he hated—words without referents, logic without causes.

  He dies insisting he squared the circle not just because he was stubborn, but because admitting he was wrong would admit that the "necessary laws of motion" were not actually necessary. And for a materialist determinist, that is a bridge too far.
