      *   **Ontology:** Materialism. There is no space without body. Geometry is the study of "quantity" abstracted from body, but ultimately grounded in the motion of actual matter.
      *   **Truth:** Truth is about the correct ordering of names (nominalism), but in geometry, the names refer to generated quantities. A true proposition matches the generation.
      *   **Uniqueness:** Hobbes assumes Euclidean geometry is *the* geometry. For him, the definitions (e.g., parallel lines never meet) aren't just axioms; they describe the necessary consequences of how motion works in the plenum.

  3.  **Analyze the Impact of Non-Euclidean Geometry (NEG):**
