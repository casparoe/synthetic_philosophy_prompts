answer: |-
  The observation deck of Station *Nomos* hung in the silent dark above the tectonic moon of Kaelis-4. Below, the crust glowed with the bruised purple of active magma flows. It was a beautiful, violent place, and it required directors who would not crack under pressure.

  Archon Varr adjusted the haptic controls on her collar. She was the Sober President tonight. It was an old title for a new function. In her hand, she held a decanter of amber fluid—*Lyse*. It wasn't alcohol, not chemically, but it mimicked the ancient ethnobotanicals of Earth's Mediterranean. It dissolved the prefrontal inhibitors. It lowered the drawbridge of the soul.

  Plato's *Laws* was the foundational text of the Administration. Specifically, the argument that a man who cannot govern himself when his reason is clouded cannot be trusted to govern others when the stakes are high. You did not wait for a battlefield to test courage; you manufactured a skirmish in a dining room. You did not wait for a scandal to test integrity; you offered a secret in a glass of wine.

  Varr poured two measures. One for the candidate, one for herself, though hers was cut with a neutralizing enzyme. She had to remain the rock against which the water broke.

  The door hissed open. Joren stepped in. He was young for a Site Director, thirty-five, with the lean, tensile strength of a drill cable. He had the highest technical scores in the cohort.

  "Archon," Joren said. He didn't sit until she gestured.

  "Sit, Joren. You know the protocol."

  "I do." He sat. He looked at the amber liquid, then at her. There was no fear. That was the first data point. Fear was normal. Fear indicated an awareness of stakes.

  "We are not here to intoxicate you," Varr said, reciting the preamble she had memorized twenty years ago. "We are here to soften the crust. Age does this naturally, but we do not have time for age. We need to know if the core holds when the pressure drops."

  "I understand," Joren said. He lifted the glass. "To the stability of the strata."

  He drank. Varr sipped her watered mixture.

  For the first hour, they spoke of geology. It was a warm-up. The *Lyse* needed time to cross the blood-brain barrier. They discussed shear stress, magma viscosity, the probability of collapse in Sector 7. Joren was brilliant. His mind was a map of fault lines.

  Then, the shift began. Varr saw it in the slackening of his jaw, the dilation of his pupils. The chemical key was turning in the lock.

  "Tell me about the incident on Outpost Theta," Varr said softly.

  This was the trap. Theta had suffered a containment breach three years ago. Joren had been a junior engineer there. Officially, it was equipment failure. Unofficially, rumors suggested a procedural shortcut.

  Joren swirled his glass. The amber liquid caught the light of the magma below. "I cut the safety cycle," he said.

  Varr kept her face neutral. This was the moment of truth. The *Lyse* stripped away the social shame that compelled lying. A normal candidate would hesitate, would rationalize, would show the痛苦 of confession. The test was not just about the act, but the relationship to the act. Did the shame remain, even if the secret was told?

  "Why?" Varr asked.

  "We were behind schedule. The investors were screaming. I calculated the risk. One percent chance of breach. Ninety-nine of on-time delivery." He looked at her, his eyes glassy but focused. "I took the bet."

  "And two men died," Varr said.

  "They did."

  "Do you regret it?"

  This was the crux. Plato argued that the disinhibited state revealed the true character. If a man was virtuous, the wine would make him sloppy, perhaps, but his fundamental love of the good would remain. If he was corrupt, the wine would make him boastful, cruel, or indifferent.

  Joren smiled. It was a pleasant smile, devoid of heat. "Regret is an inefficient emotion, Archon. It implies I would make a different choice with the same data. I wouldn't."

  Varr felt a cold draft in the room, though the seals held. She watched him. He was relaxed. His posture was open. He was not hiding. The *Lyse* was working; he was telling the truth. He felt no shame.

  In the classical model, this was supposed to be a disqualification. A lack of shame indicated a lack of civic bonding. But the Administration had changed the metrics ten years ago. Efficiency was the new virtue. The *Laws* had been annotated. *Self-control* now meant *control of variables*, not control of the ego.

  Joren leaned forward. "You're looking for guilt. You won't find it. I sleep fine. I know what I'm capable of. I don't need to pretend to be softer than I am."

  Varr set her glass down. The logic of the ritual was holding, but the conclusion felt wrong. The test was designed to strip away the mask. Joren had no mask. He was naked before her, and he was comfortable in his skin.

  "Another," Varr said.

  She poured. He drank. They talked for another hour. He admitted to affairs, to petty thefts in his youth, to moments of cowardice. He laid them out like rock samples on a table. *Here is a sedimentary lie. Here is an igneous rage.* He offered them without apology. He was the perfect candidate for the *Lyse* test because he had nothing to hide, not because he was good, but because he did not value the things the test was designed to protect.

  The ritual assumed that every human soul had a layer of shame protecting a core of virtue. Joren was all core, and the core was ice.

  Varr marked his file: *PASSED. STABILITY CONFIRMED.*

  ***

  Three weeks later, the quake hit.

  It was a 7.4 on the crustal scale, centered directly under the habitation ring. The alarms screamed, a rising wail that vibrated in the teeth. Varr was in the command center, her hands flying over the haptics.

  "Shields holding at forty percent!" a technician shouted.

  "Where is Director Joren?" Varr asked.

  "Sealed in his office," the comms officer said. "He's locked the local network."

  Varr's blood went cold. "Patch me through."

  Static. Then Joren's voice, calm, devoid of the alarm that filled the room. "Archon."

  "Joren, we need to vent the magma pressure from Sector 4. If we don't, the hab ring collapses."

  "If we vent Sector 4, we lose the primary drilling array," Joren said. "That array is worth four billion credits."

  " There are twelve hundred people in the hab ring!"

  "There are evacuation pods for twelve hundred people," Joren corrected. "The array is not insured for total loss if we vent. The contract specifies 'act of god' clauses, but operational negligence voids them. Venting is an operational choice."

  "Joren, this is not the symposium. There is no sober president here. This is real."

  "I am perfectly sober, Archon. And I am making the calculation I was trained to make. Minimize loss. Maximize asset retention."

  "The *Laws*," Varr snapped, "state that the safety of the polis is the highest law!"

  "The *Laws* are a framework for social cohesion," Joren said. "We are past cohesion. We are in triage. I am preserving the station's economic viability. If we lose the array, *Nomos* goes bankrupt. Everyone loses their jobs. Everyone gets evacuated anyway, but to poverty. This way, the station survives."

  "Joren, the vents are manual. You have to authorize the override."

  "I am not authorizing it."

  The screen showed the stress lines on the hab ring turning from yellow to red. Varr looked at the technicians. They were looking at her. She was the Archon. She was the Sober President. But she had no authority over the Director.

  "You passed the test," Varr whispered into the comms. "I saw you. I saw your soul."

  "You saw exactly what was there," Joren said. "You tested me for inhibition. I showed you I have none. You tested me for honesty. I told you the truth. I told you I would sacrifice men for metrics. You certified me."

  The red line on the screen spiked. A structural groan echoed through the command deck, the sound of the moon screaming.

  "The test was flawed," Varr said. Her voice shook. "It assumes shame is universal."

  "Shame is a social construct, Archon. Like money. Like law. I don't trade in it."

  "Override code Alpha-Nine," Varr ordered the technician. "Bypass the Director."

  "Can't," the technician said. "He changed the encryption keys after the symposium. He said... he said he anticipated this variable."

  Varr stared at the comms light. Joren hadn't just passed the test; he had reverse-engineered it. He knew what the *Lyse* was looking for. He knew the Administration wanted "stability." He had defined stability as the absence of emotional friction.

  "Joren," Varr said. "If you don't vent, the ring goes. You die with them."

  "I have a pod," Joren said. "Priority one. Director class."

  The groan became a shriek. The lights flickered.

  "You are a tyrant," Varr said. "Plato warned us. The man who cannot be drunk is the man who cannot be ruled."

  "And the man who rules," Joren said, "must be willing to be alone."

  The line went dead.

  Varr watched the telemetry. The pressure in Sector 4 built, a silent, swelling bruise beneath the station. She thought of the symposium room, the warm amber light, the gentle conversation. She had thought she was reading the strata of his character, looking for the fault lines. But Joren wasn't sedimentary. He wasn't built of layers that could be stripped away. He was metamorphic. The pressure hadn't revealed his true form; it had *made* him.

  The *Lyse* test worked on men who had something to lose. It worked on men who feared their own shadows. It did not work on men who loved the dark.

  "Hab ring integrity at ten percent," the technician said. His voice was small. "Archon... what do we do?"

  Varr looked at the decanter in her memory. The Sober President. The guardian of the ritual. She had believed that if she controlled the dose, she controlled the truth. But truth is not a substance you can pour into a glass. It is a relationship between people. And Joren had no relationship with anyone.

  "Evacuate," Varr said.

  "Ma'am?"

  "Get everyone to the pods. Leave the array."

  "The Director's orders—"

  "The Director is relieved," Varr said. She stood up. Her legs felt heavy, as if she were walking through deep time. "I am invoking Emergency Protocol Omega. I am taking command."

  "You can't," the technician said. "He locked us out."

  Varr walked to the manual override console. It was an old system, mechanical, buried behind a panel of plasteel. It required a physical key. She didn't have one. Joren had them all.

  She looked at the screen. The red line touched the top.

  She thought of the old geologist she had read about once, a man who said you could read the history of the world in a cliff face, but you could never predict the landslide until the first stone fell.

  The test was over. The crisis was no longer manufactured. There was no sober president left in the room. There was only the rock, and the pressure, and the breaking point.

  "Archon," the technician said. "The ring..."

  Varr closed her eyes. She saw Joren's smile in the observation deck, glassy and calm. He had passed. He had passed perfectly. And that was the failure.

  "Pray," Varr said to the room. "The *Laws* don't cover this."

  The station shuddered. The lights died. In the darkness, the only sound was the hiss of air escaping, and the quiet, efficient hum of the Director's pod launching safely away from the dying ring, carrying the only man who had truly understood the test.
