answer: |-
  1. **The Lewisian Patch vs. The Fink**
  Martin's electro-fink is widely taken to refute the Simple Conditional Analysis because the wire loses its conductivity the moment it is touched. However, David Lewis proposed a reformed analysis where the intrinsic basis need only persist *through* the stimulus to the manifestation, which seems to immunize the view against finks. You argue that *no* conditional analysis can be repaired. Why do you think Lewis's specific move—requiring the stability of the basis—fails to save the conditional analysis, and doesn't his distinction between finks and standard cases actually grant you the ontological ground you need for powers?

  *   **Follow-up:** (Anticipating she will argue that specifying "stability" without circularity is impossible) If defining a "stable basis" inevitably requires appealing to other dispositions to rule out finks, doesn't that suggest the conditional analysis is just hiding the powers it claims to analyze, rather than eliminating them?

  2. **Masks, Antidotes, and the "Still Present" Problem**
  In masking cases, unlike fink cases, the disposition and its categorical base seem to remain intact but are merely blocked by an extrinsic interferer. To distinguish a mask from a fink, you need an account of the disposition being "still present" that doesn't itself bottom out in a conditional analysis. How does Dispositional Essentialism provide an independent ontology for a disposition that is present but not manifesting, without simply asserting it as a brute fact?

  *   **Follow-up:** (Anticipating she will appeal to the intrinsic nature of the property) If the property's identity is purely relational (defined by what it *would* do), how can it remain numerically identical when those relations are blocked? Does "being present" imply a categorical residue you claim to reject?

  3. **The Regress of Manifestations**
  A common criticism is that if every manifestation of a power is just the triggering of further, more fundamental powers, we face a regress where nothing is ever actually grounded. Does explaining a power's manifestation by appeal to yet further powers threaten to empty the essentialist thesis of content, leaving us with a web of relations but no relata?

  *   **Follow-up:** (Anticipating she will posit a fundamental level of powers) If there is a fundamental level where powers no longer rely on deeper powers, how do we identify that level without relying on the very conditional analyses you reject? Is the "bottom" of the regress empirically accessible or purely theoretical?

  4. **Pure Powers and Property Identity**
  If we reject categorical quiddities, then a property is exhausted by its causal profile. But if Property A is defined by its relation to Property B, and Property B by its relation to Property A, aren't we trapped in a holism where no single property has a determinate identity? How do you secure the identity of individual powers without a categorical anchor?

  *   **Follow-up:** (Anticipating she will argue for structuralism) If the identity is purely structural, does that allow for the possibility of a "switched world" where the structural roles are identical but the properties are different? If not, does that make the identity of properties necessary in a way that constrains scientific discovery?

  5. **Laws of Nature and Metaphysical Necessity**
  Dispositional Essentialism typically entails that laws of nature are metaphysically necessary rather than contingent. How do you handle apparent cases of contingency? If water *must* boil at 100°C given its essence, how do we make sense of scientific modeling that treats these laws as variables in counterfactual scenarios?

  *   **Follow-up:** (Anticipating she will distinguish between epistemic and metaphysical possibility) If the necessity is metaphysical, does that mean scientists who model worlds with different laws are literally talking about impossibilities? Does this make Dispositional Essentialism hostile to the practice of theoretical physics?

  6. **Vector Addition and Composition**
  When an object is subject to multiple forces, we model the result via vector addition. In a world of pure powers, what is it that "holds" these competing dispositions together to produce a single manifestation? Do we need a categorical substrate to explain the composition of powers, or is the composition itself a further power?

  *   **Follow-up:** (Anticipating she will say composition is a higher-order power) If the composition rule is itself a power, does it require a further rule to compose it with the first-order powers? Are you committed to an infinite hierarchy of compositional powers?

  7. **Actuality vs. Modality**
  You argue that dispositions ground modality. But critics charge that 'power' is just as modal a notion as 'possibility' or 'necessity.' How is positing an "actual" power any less modal than positing a "possible" manifestation? Aren't you just shifting the modal burden rather than grounding it?

  *   **Follow-up:** (Anticipating she will argue powers are categorical-in-nature but powerful) If powers are actual existents, how does an actual property point toward a non-actual manifestation without invoking a modal operator in its very definition? Is the "directedness" of a power observable?

  8. **Ontological Parsimony and the "Friend's" Challenge**
  My friend argues that a sufficiently patched conditional analysis is ontologically cheaper than positing primitive powers. Even if you're right that the Simple Conditional Analysis fails, isn't Dispositional Essentialism just buying a solution to a problem created by its own refusal to accept complex, ceteris paribus conditionals? Why is a complex conditional ontologically worse than a primitive power?

  *   **Follow-up:** (Anticipating she will argue truth-makers are required) If the truth-maker for the complex conditional is the power itself, haven't you admitted that the power is the fundamental ontological commit, making the conditional analysis redundant rather than competitive?

  9. **Causal Exclusion and Events**
  In a metaphysics of powers, do events still do causal work, or is causation entirely a transaction between properties? If properties do all the work, does this create a causal exclusion problem where the object possessing the power is rendered causally inert?

  *   **Follow-up:** (Anticipating she will adopt a substance-causation or bundle view) If objects are just bundles of powers, what provides the unity for that bundle? Is the "unity" itself a power, and if so, what binds it to the other powers?

  10. **Falsifiability and Defeat Conditions**
  To close: Many critics claim Dispositional Essentialism is unfalsifiable. What specific observation or argument would count as evidence against Dispositional Essentialism *specifically*, rather than merely showing that some particular conditional analysis of dispositions is flawed? If no empirical finding could refute it, is it a metaphysical framework or a scientific hypothesis?

  *   **Follow-up:** (Anticipating she will argue it's a metaphysical framework) If it's a metaphysical framework, does that insulate it from scientific revision? If science discovered a property that truly had no dispositional profile, would you reject the science or the metaphysics?
