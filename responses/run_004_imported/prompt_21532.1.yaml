answer: |-
  The hum was the only thing that proved she existed. It vibrated up through the soles of Ren's boots, a low, thrumming note that settled in her teeth. It came from the tether.

  Five hundred meters of carbon nanotube cable stretched out from the airlock of Pod A, disappearing into the absolute dark to connect with Pod B. There were no stars. There was no cosmic background radiation, no distant glow of galaxies, no dust. The sensors had been screaming "Void" for three weeks. The universe outside the *Dyad* was not just empty; it was unrendered.

  Ren stood at the command console, her hand hovering over the stress gauge. The needle trembled in the red.

  "Structural integrity at eighty-four percent," the system chimed. The voice was flat, devoid of the panic tightening her chest.

  She looked out the viewport. Black. Not the deep, textured black of space dotted with pinpricks of light, but a flat, matte void. It was like staring at the back of her own eyelids. Yet, her feet felt heavy. Her blood pooled in her legs. The coffee in her mug sat flat against the table, surface perfectly perpendicular to the floor.

  They were spinning. She knew they were spinning. The *Dyad* was designed as a centrifuge, two pods whirling around a common center of gravity to generate one gee of artificial gravity. But usually, spinning meant movement relative to something. You spun against the stars. You spun against the background hum of the universe.

  Here, there was nothing to spin against.

  Ren walked to the window, her gait heavy, weighted by the centrifugal force. She placed her palm against the cold glass. If Newton was right, the tension in the tether was real. The globes were receding from the center of motion, pulling against the cord, striving to fly off in straight lines while the cord forced them into circles. The tension was the proof. The heaviness in her gut was the proof. Space itself was a container, and they were scraping against its walls.

  But if Mach was right, the tension was a ghost. Rotation was only a relation between bodies. If there were no other bodies, no fixed stars, no distant mass to define an inertial frame, then they weren't rotating. They were just... hanging. And if they weren't rotating, why was the tether singing? Why was her stomach churning?

  The hum pitched up. A sharp twang echoed through the hull, like a guitar string snapped an octave too high.

  "Stress at eighty-nine percent," the system said.

  Ren turned back to the console. The tether was fraying. The molecular lattice was fatiguing under the constant strain. She had two choices, and they mapped perfectly onto a three-hundred-year-old argument she'd read about in a manual once, back when there were libraries.

  Option One: Sever the tether.

  If she cut the cable, the centrifugal force would vanish. The pods would drift apart. But if Mach was right, and the rotation was an illusion caused by the lack of external reference, cutting the tether might not change anything. Or worse, if the tension was real but the rotation was relative to a hidden mass she couldn't see, cutting the tether would send them spiraling into the dark, never to find each other again.

  Option Two: Engage the Substrate Lock.

  The Lock was an experimental drive, meant to anchor the ship to the quantum vacuum itself. It assumed space had structure. It assumed there was a "there" there. If she engaged it, the Lock would attempt to freeze the *Dyad's* orientation relative to the void. If space was absolute, the Lock would stabilize the rotation, dampening the wobble and relieving the stress on the tether.

  If space was merely relational, the Lock would have nothing to grab onto. It would burn power until the reactors died, the tether would snap, and they would drift.

  "Stress at ninety-two percent."

  Ren's hand shook. She looked at the gyroscope readout. The sphere on the screen was precessing. It was changing orientation. But relative to what? The screen showed the ship's hull. The hull was rotating with her. The gyroscope was measuring a change in direction that her eyes couldn't confirm.

  It was the bucket argument made flesh. Newton's bucket of water knew it was spinning because the water climbed the walls. Ren knew she was spinning because her blood knew. But the eyes, the arrogant eyes, demanded a reference point. They demanded a star to track across the sky.

  There were no stars.

  She thought about the silence. If she engaged the Lock, and it worked, the hum would change. The vibration would smooth out. The tension would ease. She would be admitting that space was a thing, a substance that could hold them, push against them, define them.

  If she severed the tether, she admitted that the connection was the only truth. Without the cord, there was no system. Just two lonely pods in a nothing that didn't care if they moved.

  "Stress at ninety-five percent. Warning. Critical failure imminent."

  The floor lurched. A micro-fracture somewhere in the tether sent a shockwave through the hull. Ren stumbled, catching herself on the console. The coffee mug slid, tipped, and shattered. The liquid didn't splash outward; it pooled heavily, obeying the fake gravity.

  She had seconds.

  If she was wrong about the Lock, the reactors would drain. Life support would fail in hours. If she was wrong about the tether, it would snap in seconds.

  She looked out the window again. The black was oppressive. It felt like a weight pressing against the glass. Was it pressing in, or was she pressing out?

  "Newton," she whispered. The name felt strange in the silence. "You old bastard."

  She believed the tension. She believed the pull in her gut. The universe might be empty, but the force was real. The cord was screaming. You don't argue with a screaming cord. You don't tell a snapping rope that it shouldn't be tight because there's nothing to see.

  But what if the tension was the lie? What if the emptiness outside was leaching into the ship, confusing the sensors, tricking the body? What if she engaged the Lock and nothing happened because there was no floor to the universe to lock onto?

  "Stress at ninety-seven percent."

  The hum was a shriek now. The lights flickered.

  Ren slammed her hand down. Not on the Sever switch. On the Lock.

  She held her breath. She waited for the grab. She waited for the ship to shudder as it caught hold of the fabric of space.

  For a heartbeat, nothing happened. The shriek of the tether continued. The heaviness in her legs remained.

  Then, the hum shifted.

  It didn't stop. It didn't smooth out. It deepened. The vibration changed frequency, moving from a sharp twang to a low, resonant boom. The stress gauge didn't drop. It climbed. Ninety-eight percent.

  Ren stared at the needle.

  If the Lock had worked, the tension should have eased. The ship would be stabilized against the void. But the tension was increasing.

  Did that mean the Lock had failed? That space was relational, and the device was spinning its wheels against nothing, burning power while the tether died?

  Or did it mean the Lock had succeeded? That by locking onto absolute space, it had revealed the true speed of their rotation, stripping away the illusions, and the tension was higher because now they were fighting the true weight of the universe?

  The lights died. The emergency strips glowed red.

  "Stress at ninety-nine percent."

  Ren gripped the console. The floor vibrated so hard her vision blurred. She couldn't tell if the ship was shaking or if her eyes were shaking. She couldn't tell if they were spinning faster or if the universe was tightening around them.

  Outside, the black remained perfect. Unbroken. Unmoved.

  Inside, the tether sang its final note.

  Ren closed her eyes. She listened to the hum. It was the only map she had. It told her she was moving. It told her she was pulled. It told her there was a force. It did not tell her why.

  The gauge hit one hundred.

  There was a sound like a gunshot, sharp and final. The heaviness in her legs vanished instantly. Ren floated, untethered from the floor. The hum stopped. The silence rushed in, absolute and total.

  They had separated.

  She drifted toward the console, weightless. The Lock was still engaged, drawing power, searching for a substrate to hold onto. The sensors still reported rotation. The gyroscopes still precessed.

  But she felt nothing.

  Ren floated in the center of the room, suspended between the floor and the ceiling. She looked out the viewport. The black was still there. Pod B was gone, lost in the void.

  She was moving. She knew she was moving. The instruments said so. But there was no way to know if she was spinning in place, or if the universe was spinning around her, or if both were true, or neither.

  She reached out and touched the glass. It was cold.

  "Okay," she said to the silence. "Okay."

  She didn't turn the Lock off. She didn't turn it on. She just floated, waiting to see if the dizziness would come back, waiting to see if the silence would ever answer.
