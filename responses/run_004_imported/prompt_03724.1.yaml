      *(Self-Correction during drafting)*: I need to be careful not to overstate the link. Berkeley doesn't explicitly say "My economics follows from my metaphysics" in every query. But the structural homology is striking and noted by scholars (like Patrick Kelly or S.H. Mellone). I should present it as a coherent worldview rather than a direct logical deduction he wrote down.

