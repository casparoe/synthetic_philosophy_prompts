prompt: |-
  I'm a philosophy of math PhD student who sits in on the set theory seminar in the math department, mostly so I have something concrete to be confused about. Last week two of the math students, Dan and Mei, got into a side-argument that ate the last twenty minutes of the seminar, and I want someone impartial to sort out who was actually right.

  (1) Dan claimed that whenever a proof says 'X exists by Zorn's Lemma,' the author is fully committed to the Axiom of Choice, no hedging, because ZL and AC are provably equivalent over ZF -- it's an equivalence, so there's no wiggle room. (2) Mei pushed back that the equivalence is about the general schema, quantified over every poset, and a single invocation might only need a far weaker fragment -- her example was Hahn-Banach, which drops out of the Boolean Prime Ideal theorem, something strictly weaker than full choice, so calling every Hahn-Banach proof 'a use of full AC' is just false. (3) Dan came back that this doesn't matter, you can't assume you got lucky like that -- he cited a result, Blass I think, early 80s, that 'every vector space has a basis' all by itself implies full AC over ZF, so that particular use of Zorn's Lemma is exactly as strong as advertised. (4) Mei said that's not a counterexample, it's her point sharpened: whether a given ZL-appeal needs the whole thing or a scrap of it is a real, case-by-case theorem, so you can't read the choice-strength off the mere fact that someone cited Zorn's Lemma -- Dan's 'no wiggle room' rule is true as a slogan and false as math. (5) Dan's last word was that in practice nobody does this bookkeeping before publishing, they just cite Zorn's Lemma and move on, so 'you're on the hook for full choice until proven otherwise' is the honest working default, and Mei's position only looks right in hindsight, after somebody's already done the hard reverse-math.

  I couldn't tell who was landing the better hits, and honestly I'm not even confident thier math is right in places. Can you adjudicate move by move: first give your verdict as a JSON block of the form {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>}, where each score is an integer from -2 (clearly mistaken) to 2 (clearly right), then briefly justify each score -- flagging anywhere the actual mathematical claims (the Blass result, the BPI/Hahn-Banach point) are shaky -- and say what both of them are still missing.
