  2.  **Deconstruct the Private Language Argument (PLA):**
      *   *Core Issue:* Can a language refer to immediate private sensations such that *only* the speaker can understand it, and its correctness is determined solely by the speaker's internal criterion?
      *   *The Diarist (PI §258):* Tries to associate a sign 'S' with a sensation. Later, tries to use 'S' again. How does he know he's using it correctly? He has no independent criterion. "Whatever is going to seem right to me is right." This means we can't talk about 'right' here.
      *   *Key Requirement:* Normativity. Meaning requires rules. Rules require the possibility of making a mistake. To make a mistake, there must be a distinction between *thinking* one is following the rule and *actually* following the rule. This distinction requires public criteria, practices, and checks.
      *   *Inner Speech:* Wittgenstein doesn't deny we have inner speech. He denies that inner speech gets its meaning from a private ostensive definition. Inner speech is parasitic on outer speech (public language).

