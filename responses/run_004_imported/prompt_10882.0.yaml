      *   *Crucial Point:* The friend says the device shows inner speech is "ordinary public-language use running through a new physical channel." Wittgenstein would likely nod at this. For Wittgenstein, inner speech *is* already public-language use (internalized). The BCI just makes the "internal" externally visible.

