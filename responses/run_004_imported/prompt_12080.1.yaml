      *Let's go.*
answer: |-
  (She taps her glass. Not aggressively, but with the specific, metallic clarity that cuts through a crowded room. She waits for the silence. She doesn't smile immediately.)

  Thank you. Please, stay seated. 

  Thirty years. It sounds like a round number, doesn't it? A clean resolution. Like a perfect cadence. But anyone in this room who played a note in this pit, or sang a phrase on that stage this past six weeks, knows that *Così fan tutte* does not give us clean resolutions. 

  For those of you joining us from the board and our donor community: thank you. You see a comedy. You see two couples, a trick, and a wedding. You see a night where the tickets were sold and the lights went up on time. We could not do this without that stability. 

  But for the company... for the musicians and the singers... you know the other half of the equation. You know that while Don Alfonso treats human hearts like chips in a poker game, Mozart writes music that treats those same hearts as sacred vessels. The libretto says, "It's all a joke, everyone is fickle." The oboe says, "The grief is real." The script says, "Forgive and forget." The harmony says, "You will never forget this."

  For a long time, people tried to fix this. They tried to direct it as a farce to make it lighter, or as a tragedy to make it deeper. But the opera only works if you refuse to choose. If you admit that the cynicism and the sincerity are both true, at the exact same time.

  I have thought about this often, standing on my podium. 

  There is a temptation, at a retirement dinner, to offer you a resolved narrative. To tell the donors that every moment was a joy. To tell the orchestra that we were all warriors for high art. But that would be a lie. And after thirty years of listening for the truth in the sound, I find I have no patience for lies.

  The truth is, sometimes this work was a grind. Sometimes the "fidelity" we asked of you—to this company, to this city, to this repertoire—felt like Don Alfonso's wager. It felt like a game where the rules were rigged, where the funding was a trick, where the audience's attention was fleeting. 

  And yet. 

  When the downbeat came, the feeling was real. The exhaustion was real. The loyalty you showed each other in the dark of the pit was real. 

  If I told you I am simply sad to leave, I would be insulting the relief I feel. If I told you I am simply glad to go, I would be insulting the love I carry for this craft. Like Fiordiligi, I have learned that you can be broken by the experiment and still stand in the finale. 

  So I will not offer you a toast to "happily ever after." We are not in a fairy tale. We are in an opera. 

  I toast you to the tension. 

  To the donors: thank you for believing the game was worth playing. 
  To the company: thank you for knowing the pain was worth singing. 

  May we all have the courage to hold two contradictory truths in our hands at once, and not drop them. To *Così*. To the unresolved. 

  (She raises her glass. She does not drink immediately.)
