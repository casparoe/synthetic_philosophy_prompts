answer: |-
  This is a superb pedagogical moment. You have reached the pivot point of the *Bai Ma Lun*, where Gongsun Long shifts from the initial intensional distinction (shape vs. color) to a more sophisticated argument involving reference, extension, and the ontology of attributes. The difficulty your students face is genuine: the text moves fluidly between metaphysical claims about "white" and semantic claims about "naming," and the validity of the conclusion depends entirely on how one bridges that gap.

  Here is a reconstruction of the logical anatomy, an analysis of the *Li* (separate) vs. *Ding* (fix) dynamic, and an evaluation of how the Fung and Hansen readings handle this specific passage.

  ### 1. Logical Anatomy of the Sophist's Closing Move

  The Sophist's final speech can be parsed into four logical steps. The brilliance (and sleight of hand) lies in how Step 2 supports Step 4.

  1.  **The Ontology of Attributes (Indeterminacy vs. Fixation):**
      *   *Premise:* "White" in the abstract (*bai*) is indeterminate (*bu ding*); it is not tied to any specific bearer.
      *   *Premise:* "White" in the compound "White Horse" is determinate (*ding*); it is tied to a specific bearer (the horse).
      *   *Intermediate Conclusion:* Determinate White $\neq$ Indeterminate White. (Therefore, the "white" in "white horse" is ontologically distinct from the universal "white".)

  2.  **The Semantics of Selection (Extension):**
      *   *Premise:* The name "Horse" makes no selection/rejection (*wu qu qu*) regarding color; its extension includes yellow, black, and white.
      *   *Premise:* The name "White Horse" makes a selection/rejection (*you qu qu*) regarding color; its extension excludes yellow and black.
      *   *Intermediate Conclusion:* The extension of "Horse" $\neq$ The extension of "White Horse".

  3.  **The Principle of Non-Identity:**
      *   *Premise:* What makes no selection cannot be equated with what makes a selection. (If $X$ allows $A, B, C$ and $Y$ allows only $A$, then $X \neq Y$.)

  4.  **Final Conclusion:**
      *   "White Horse is not Horse" (*Bai ma fei ma*).

  **The Logical Gap:** The gap you identified is between Step 1 (Metaphysics of White) and Step 2 (Semantics of Exclusion). Step 1 explains *why* the compound is complex, but Step 2 does the heavy lifting for the conclusion. The Sophist relies on the intuition that if two terms have different conditions of application (extensions), they cannot be identical.

  ### 2. The *Li* (Separate) vs. *Ding* (Fix) Nexus

  This is the crucial dialectical turn. The Objector and Sophist are using these terms to talk past each other, which generates the aporia.

  *   **The Objector's *Li* (Epistemic/Operative):**
      *   For the Objector, *li* is a mental operation required for predication. To say "This white horse is a horse," I must mentally *separate* the attribute 'white' from the subject and ignore it.
      *   *Argument:* "Having a white horse implies having a horse" is true *only if* we perform this operation of separation.
      *   *Implication:* Common sense predication relies on abstraction.

  *   **The Sophist's *Ding* (Ontological/Constitutive):**
      *   For the Sophist, *ding* is a constitutive feature of the compound name. When you say "White Horse," you have *fixed* the white to the horse. You cannot simply mentally undo this fixation without changing the subject.
      *   *Argument:* Because the white is *fixed* in the compound, the compound refers to a specific reality that is distinct from the reality referred to by "Horse" alone.
      *   *Implication:* Linguistic composition mirrors ontological composition. You cannot *Li* (separate) what is *Ding* (fixed) without destroying the object of reference.

  **Do they do the same work?**
  No. *Li* is the Objector's attempt to save common sense by treating attributes as detachable modifiers. *Ding* is the Sophist's method of reifying the compound, treating "White Horse" as a rigid designator that cannot be reduced. The Sophist's move is to argue that the Objector's *Li* is illegitimate because the *Ding* is already done by the name itself.

  ### 3. Reconstruction: Fung Yu-lan (Platonic Realism)

  Fung reads Gongsun Long as a realist about universals (Forms).

  *   **Reading the Passage:**
      *   "White" (Indeterminate) = The Universal *Whiteness*.
      *   "White Horse" (Fixed) = The Compound Universal *White-Horseness*.
      *   "Horse" = The Universal *Horseness*.
      *   **Selection/Exclusion:** For Fung, the "selection" argument is about the definition of the Forms. The Form *Horse* does not contain color in its definition. The Form *White Horse* contains color in its definition.
  *   **Handling *Li* vs. *Ding*:**
      *   *Li* is the process of abstracting the Universal from the particular.
      *   *Ding* is the combination of Universals.
      *   Fung argues that because the Compound Universal is distinct from the Simple Universal, they are ontologically non-identical.
  *   **Does it license the conclusion?**
      *   **Yes, strongly.** If "White Horse" names a distinct Form from "Horse," then "White Horse is not Horse" is literally true in the realm of reality (the *li* 理).
      *   **Weakness:** It struggles slightly with the "selection/exclusion" (*qu/qu*) language. Forms don't typically "exclude" things in a mereological sense; they simply *are* what they are. Fung has to interpret the extensional argument as a reflection of intensional definitions.

  ### 4. Reconstruction: Chad Hansen (Mereological/Nominalist)

  Hansen reads the School of Names through a linguistic nominalist lens, treating terms as "mass nouns" or names for stuff/portions of the world.

  *   **Reading the Passage:**
      *   "White" = A stuff-attribute.
      *   "Horse" = A stuff-kind.
      *   "White Horse" = A compound stuff-kind (the intersection of white-stuff and horse-stuff).
      *   **Selection/Exclusion:** This is the core of Hansen's reading. "Horse" picks out all horse-stuff. "White Horse" picks out a *subset* of horse-stuff.
  *   **Handling *Li* vs. *Ding*:**
      *   *Li* is separating the attribute-stuff from the object-stuff.
      *   *Ding* is specifying a particular portion of the world.
      *   Hansen argues the Sophist is pointing out that the *extension* (the actual stuff picked out) is different.
  *   **Does it license the conclusion?**
      *   **Yes, but weakly.** It licenses the claim that "The term 'White Horse' is not equivalent to the term 'Horse'."
      *   **The "Fei" Problem:** Hansen must interpret *fei* (not) as "is not equivalent to" rather than "is not a member of." In standard logic, $A \subset B$ does not imply $A \neq B$ (in terms of class membership), but it does imply the *names* are not synonymous. Hansen argues Gongsun Long is exploiting the ambiguity of *fei* to make a semantic point look like an ontological one.
      *   **Strength:** It handles the *qu/qu* (selection/exclusion) argument perfectly. This is clearly an extensional argument about what counts as a valid response to a request.

  ### 5. Evaluation and Conclusion for the Seminar

  Which reading licenses the stated conclusion?

  **The Verdict:**
  If the goal is to make the sentence **"A white horse is not a horse"** metaphysically true, **Fung's Realism** is the only reading that licenses it. If "Horse" and "White Horse" name distinct Universals, they are simply different entities.

  However, if the goal is to make the **argumentative structure** (specifically the *qu/qu* selection argument) valid, **Hansen's Mereological/Nominalist** reading is superior. The argument about excluding yellow and black horses is an argument about extensions and reference, not about the metaphysical essence of Forms.

  **The Pedagogical Synthesis:**
  For your seminar, I suggest proposing that Gongsun Long is intentionally conflating these two levels to produce a *performative contradiction*.

  1.  **The Trap:** The Objector assumes "is" (*fei*'s opposite) means class membership (A white horse *is a* horse).
  2.  **The Switch:** The Sophist argues using identity/equivalence (The concept 'White Horse' *is identical to* the concept 'Horse').
  3.  **The Role of *Ding*:** The Sophist uses *Ding* to argue that the *name* "White Horse" creates a new, fixed reference point that cannot be reduced.
  4.  **The Role of *Qu/Qu*:** The Sophist uses the selection argument to prove that because the *extensions* differ, the *identities* must differ.

  **Recommendation:**
  Conclude that **Hansen's reading explains the mechanism, but Fung's reading explains the ambition.**
  *   Hansen shows *how* the argument works logically (by shifting from membership to equivalence of extension).
  *   Fung shows *why* the Sophist thinks this matters (because names carve reality at its joints).

  The Sophist's closing move is valid **only if** one accepts that difference in extension entails non-identity of the named reality.
  *   **Objector:** "Horse" and "White Horse" name overlapping realities; therefore, one implies the other.
  *   **Sophist:** "Horse" and "White Horse" name *different* realities (one selected, one unselected); therefore, one is not the other.

  The "logical anatomy" is a **modal shift**: The Objector is arguing from **existence** (If a white horse exists, a horse exists). The Sophist is arguing from **naming conventions** (The name 'White Horse' functions differently than 'Horse'). The Sophist wins the debate only by refusing to answer the Objector's existential claim, instead doubling down on the semantic/ontological distinction established by *Ding*.

  **Seminar Question to Pose:**
  "Does the Sophist's appeal to 'selection and exclusion' (*qu/qu*) undermine his earlier metaphysical claim about 'fixed white' (*ding bai*)? If 'White Horse' is distinct because it excludes black horses, isn't that a pragmatic fact about language use (Hansen), rather than a fact about the nature of Whiteness itself (Fung)? And if it's just about language use, does 'White Horse is not Horse' amount to anything more than 'The word "white horse" is not synonymous with the word "horse"'?"

  This forces students to decide whether the *Bai Ma Lun* is a treatise on metaphysics or a deconstruction of linguistic pragmatics.
