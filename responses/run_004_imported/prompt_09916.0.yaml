answer: |-
  This is a sophisticated premise, and you are right to be cautious. The "Situationist Challenge" to virtue ethics is a specific, technical debate from the late 90s/early 2000s (Harman's 1999 paper, Doris's 2002 book *Lack of Character*). If you get the citations wrong, a reader in the field will bounce; if you get the *tone* wrong, any reader will bounce.

  Here is my feedback based on your three criteria.

  ### 1. Is Marion's argument a fair statement of the situationist case?

  **Verdict:** It is accurate in substance but slightly dogmatic in tone—which is actually perfect for her character, provided it's intentional.

  Marion accurately cites the "greatest hits" of the situationist canon: the Fundamental Attribution Error (FAE), the Darley & Batson Good Samaritan study (seminarians), the Isen & Levin phone booth study, and Mischel's correlation coefficient (the famous .20–.30 range). Her summary of Harman's metaphysical critique (that virtue ethics reifies the FAE) is also correct.

  **The Nuance Check:**
  You worry she caricatures Doris. She does, slightly. John Doris is careful to say that situationism doesn't prove character *doesn't exist*, but that *global* traits (consistent across all situations) are empirically unsupported. He allows for "local" traits (e.g., honesty-in-the-classroom-but-not-at-parties).
  *   **Why this works for Marion:** Marion is not trying to write a dissertation; she is trying to sleep at night. She *needs* the hard determinist version ("variance... is mostly weather, not character") to absolve herself. She is weaponizing the nuance away.
  *   **The Risk:** The only thing Iris would catch immediately is the phrase "closer to noise than to a soul." That's Marion's poetry, not Mischel's data. But since Marion is emotional, this is forgivable.

  **Recommendation:** Keep Marion's stats accurate (you have them right), but let her slide into that determinist conclusion explicitly. It shows she is using the philosophy therapeutically rather than intellectually.

  ### 2. Is Iris's reply the strongest one available?

  **Verdict:** Her current reply is academically robust (Kamtekar and Annas are the correct counters), but there are two arguments that might land harder emotionally and thematically.

  **The Current Reply:**
  Invoking Rachana Kamtekar (who argued that virtue ethicists care about *phronesis*/perception, not robotic consistency) and Julia Annas (the skill analogy) is the "Gold Standard" of virtue ethics rebuttals. It is philosophically sound.

  **Stronger Alternatives/Additions:**
  1.  **The Normative/Descriptive Gap:** This is the most devastating objection to situationism. Psychology describes how people *do* behave; ethics prescribes how they *ought* to behave. Just because the seminarians *failed* to stop doesn't mean stopping wasn't the virtuous thing to do, or that virtue is a myth. It just means humans are flawed.
      *   *Why it fits:* It forces Marion to admit she *failed*, rather than allowing her to claim the standard was impossible.
  2.  **The Social Scaffolding Argument:** You mentioned remembering an argument that virtue is sustained socially. This is likely drawn from Alasdair MacIntyre or contemporary "extended mind" virtue ethics. Virtue isn't a solo internal muscle; it requires a community to sustain it.
      *   *Why it fits your plot:* Marion failed in a *staff room*. If virtue requires social scaffolding, her cowardice might be partly the fault of the school culture that didn't support her. This complicates her guilt (which is good for a novel) without erasing it.

  **Recommendation:** Keep the Annas "skill" analogy (it's very accessible). But consider swapping the Kamtekar citation for the **Normative/Descriptive** point. It cuts deeper: *"You're confusing a map of how people fail with a rulebook for how to live."*

  ### 3. Does the exchange read like two people who have metabolized this material?

  **Verdict:** Not yet. Currently, it reads like two encyclopedia entries arguing with each other.

  **The Problem:**
  The density of proper nouns is unnatural for a dinner table, even between academics.
  *   **Marion:** "Harman's whole argument," "Doris backs it up," "Milgram's subjects, Zimbardo's guards," "Isen and Levin's dime-in-the-phone-booth result," "Mischel had already shown."
  *   **Iris:** "Harman's rhetoric," "Doris's considered claim," "Kamtekar's reply," "Aristotle," "Annas."

  In a seminar, you cite to establish authority. At dinner, especially between sisters, you cite to wound or to plead. Real experts shorthand the references. They talk about the *ideas*, not the bibliography.

  **How to Fix It:**
  1.  **Reduce the Name-Dropping:** Marion doesn't need to say "Isen and Levin." She can say, "The study where finding a dime made people helpful." Iris doesn't need to say "Kamtekar." She can say, "One of the standard replies to this is..." or "You're ignoring the role of perception."
  2.  **Add Emotional Subtext:** Marion is confessing; Iris is judging.
      *   Marion should sound desperate for the "weather" argument to be true.
      *   Iris should sound frustrated that Marion is hiding behind data.
  3.  **Break the Monologues:** People interrupt. They drink wine. They get annoyed.

  **Rewrite Suggestion (illustrating the shift):**

  > **Marion:** "It isn't just that people are inconsistent, Iris. It's that the inconsistency runs all the way down. We're wired to over-explain behavior by character and under-explain it by circumstance. That's the Fundamental Attribution Error. Doris has the data: the seminarians in the Good Samaritan study. When they were told to hurry, only one in ten stopped to help a man doubled up in a doorway. One in ten. And these were people literally on their way to give a talk on that parable."
  >
  > **Iris:** "So you're hiding behind the seminarians now?"
  >
  > **Marion:** "I'm saying the variance in a life is mostly weather, not character. Mischel showed trait scores barely predict behavior from one situation to the next. It's a .3 correlation. That's closer to noise than to a soul."
  >
  > **Iris:** "That's Harman's rhetoric. And it confuses how people *do* act with how they *should* act. Just because the seminarians failed doesn't mean virtue is a myth. It means they failed."
  >
  > **Marion:** "It means the situation was rigged."
  >
  > **Iris:** "Or it means you're treating virtue like a reflex instead of a skill. Annas compares it to playing the piano. You don't disprove the existence of virtuosity by pointing out that beginners fall apart under pressure. Maybe you're just... out of practice."

  ### Summary
  1.  **Marion's Philosophy:** Accurate enough, appropriately biased by her guilt.
  2.  **Iris's Philosophy:** The Annas skill analogy is perfect. Consider adding the "Is vs. Ought" distinction for more bite.
  3.  **The Voice:** Cut the bibliography. Let the ideas stand on their own. Make the philosophy serve the emotional conflict, not the other way around.

  You have a very strong handle on the material; the next step is to trust that the *ideas* are interesting enough that you don't need to constantly show us the footnotes.
