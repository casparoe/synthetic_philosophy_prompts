out? Either the argument treats "what happens at round five" as a live possibility, which quietly admits a rational player might sometimes pass after all, or it's reasoning about a scenario its own premises rule out -- and maybe the real lesson of the game isn't that rational players grab immediately, but that "everyone is rational, and everyone knows everyone else is too" simply isn't a coherent thing to assume about a game shaped like this one. Owen didn't have a ready reply, and the thread died down soon after.

