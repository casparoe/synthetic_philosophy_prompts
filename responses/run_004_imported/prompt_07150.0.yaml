  **MEMORANDUM**

  **TO:** State Gaming Board, Full Committee
  **FROM:** Voluntary Exclusion Petition Panel
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Petition #4921 (Lifetime Self-Exclusion Reinstatement)

  ### **I. Executive Summary & Recommendation**

  After reviewing the evidence, interviewing the petitioner, and deliberating on the precedential impact of this decision, the Panel submits the following recommendation regarding Petition #4921:

  **Recommendation:** **Deny petition for immediate full reinstatement.**

  **Proposed Timeline:** The petitioner shall remain on the Lifetime Self-Exclusion List for a minimum of **five (5) additional years**. He will be eligible to submit a new petition for review in **October 2028** (marking 16 years total exclusion).

  This recommendation represents a compromise between the integrity of the self-exclusion program and the evidence of the petitioner's rehabilitation. While we acknowledge the petitioner's significant life improvements, we cannot override the specific "Ulysses Contract" he entered into during crisis without establishing a precedent that weakens the lifetime option for all future participants. However, acknowledging the fairness concerns regarding permanent exclusion, we propose a defined timeline for re-evaluation rather than an indefinite bar.

  ### **II. Case Background**

  The petitioner voluntarily enrolled in the State's Lifetime Self-Exclusion Program 11 years ago following severe gambling-related harm, including the loss of his primary residence and maximal debt across three credit lines. At the time of enrollment, the petitioner was offered a standard 5-year term but explicitly elected the Lifetime option.

  His written intake statement from 11 years ago contains the following declaration: *"I am choosing lifetime because I don't trust future me for one second. I want this to be impossible to undo, even by me."*

  The petitioner now petitions for reinstatement based on the following evidence:
  *   **Financial Stability:** Steady employment for 8 years; all gambling-related debt discharged.
  *   **Social Stability:** Married for 6 years; strong family support system.
  *   **Clinical Support:** Letter from a licensed addiction counselor stating there are "no clinical signs of active gambling disorder" and that the petitioner has developed robust coping mechanisms.

  The petitioner's primary argument is one of fairness: he contends that a decision made in crisis should not act as a permanent life sentence, particularly when 5-year enrollees are automatically reinstated without review.

  ### **III. Analysis of Competing Interests**

  The Panel was evenly divided on this matter. The depth of this split requires us to rigorously examine both the humanitarian argument for reinstatement and the regulatory argument for denial.

  **The Argument for Reinstatement (The "Recovery" Perspective)**
  Half of the Panel argues that denying this petition punishes success. Addiction is a treatable condition, not a permanent moral failing. If the goal of the Gaming Board is harm reduction, keeping a recovered individual excluded may serve no protective function and could potentially drive them toward unregulated, illegal gambling markets where no safeguards exist. Furthermore, there is a valid equity concern: if two people exhibit the same level of recovery, but one is free to gamble because they picked "5 years" and the other is banned forever because they picked "Lifetime," the system appears to penalize the person who was originally *more* responsible about their risk assessment. To deny this petition is to assert that the Board knows the petitioner's current mental state better than his counselor does.

  **The Argument for Denial (The "Integrity" Perspective)**
  The other half of the Panel argues that the "Lifetime" option exists specifically to remove agency from the addict during periods of clarity. This is known in behavioral economics as a "Ulysses Contract"—binding one's future self to prevent a known weakness. The petitioner explicitly requested that his future self *not* be trusted. If the Board grants this petition, we are effectively ruling that a rational decision made in recovery (the petition) outweighs a rational decision made in crisis (the exclusion).

  If we rule that "Lifetime" can be overturned after 11 years based on good behavior, "Lifetime" ceases to mean "Lifetime." It becomes a "Long-Term" option. This creates a dangerous precedent. Future petitioners in crisis may select "Lifetime" believing they can appeal it later if they "fix" their lives, thereby diluting the psychological barrier the program is designed to erect. The integrity of the list relies on the certainty that the ban is absolute.

  ### **IV. Rationale for Recommendation**

  We are recommending a **Denial of Immediate Reinstatement with a 5-Year Re-evaluation Timeline**.

  We cannot grant immediate reinstatement because doing so invalidates the petitioner's own explicit instruction from 11 years ago. He asked for a barrier he could not cross. To remove that barrier now, even at his request, violates the specific safety mechanism he demanded. We must honor the agency of his past self, who correctly identified that his "future self" would be skilled at rationalization. The petitioner's current argument—that it is "unfair" to hold him to his worst moment—is exactly the type of rationalization his past self sought to prevent.

  However, a flat, indefinite denial ignores the clinical evidence of recovery and the evolving understanding of addiction as a manageable condition. A permanent ban without review risks becoming punitive rather than protective. Therefore, we are attaching a timeline.

  By setting a re-evaluation date at **16 years total exclusion**, we maintain the sanctity of the "Lifetime" designation (it is not merely a 10-year ban) while providing a pathway for exceptional cases. This timeline signals that "Lifetime" is the default expectation, but that the Board retains the discretion to review cases where the duration of exclusion significantly exceeds the standard 5-year term.

  ### **V. Implementation Timeline**

  Should the Board accept this recommendation, the Panel proposes the following schedule:

  *   **November 2023:** Board issues formal denial of immediate reinstatement to Petitioner #4921.
  *   **December 2023 – January 2024:** Panel drafts policy guidelines for "Lifetime Re-evaluation Criteria" to ensure future decisions are not ad-hoc. This will define what constitutes "extraordinary evidence of rehabilitation" required for future lifetime petitions.
  *   **October 2028:** Petitioner #4921 becomes eligible to submit a new petition. At that time, the Board will review his continued stability against the new guidelines.
  *   **Q1 2029:** Full Board review of the "Lifetime" policy language to determine if a formal "15-Year Review Clause" should be added to future contracts to manage expectations proactively.

  ### **VI. Conclusion**

  This is a difficult decision because the petitioner has done everything right since his exclusion. He has earned his stability. However, the Self-Exclusion Program is not designed to reward good behavior; it is designed to prevent catastrophic harm. The petitioner's own words from 11 years ago remind us that the greatest risk often comes when a person believes they are "cured."

  By denying immediate reinstatement but setting a 5-year review timeline, we uphold the integrity of the lifetime commitment while acknowledging that people can change. We ask the Board to affirm that while recovery is possible, the safeguards we put in place during crisis must not be easily dismantled during calm.

  **Respectfully Submitted,**

  The Voluntary Exclusion Petition Panel
