          *   §6 seems *metaphysical/logical*: Supposing indiscernibles is supposing the same thing under two names (necessary claim).
      *   **The Question:** Which reading is the "real" Leibniz? How does this affect the evaluation of Black's counterexample? If §3, Black wins (contingent fact). If §6, Black begs the question (metaphysical impossibility).

