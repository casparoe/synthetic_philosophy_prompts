  This passage is a fascinating example of Galileo's rhetorical and scientific strategy. He is attempting to disarm a major theological objection to Copernicanism (that it contradicts Scripture) by arguing that, physically speaking, the *Ptolemaic* system actually makes the biblical miracle impossible to perform literally, whereas his version of the Copernican system makes it mechanically feasible.

  Here is an explanation of the reasoning behind his three main points.

  ### 1. The Ptolemaic Problem: The *Primum Mobile* and the Length of the Day

  Galileo argues that if one accepts the traditional Ptolemaic (geocentric) astronomy, Joshua's command ("Sun, stand still") creates a physical paradox. To understand this, we must look at how Ptolemaic astronomy explains day and night.

  *   **The Role of the *Primum Mobile*:** In the Ptolemaic system, the Earth is stationary at the center. The daily rising and setting of the sun and stars is not caused by the Earth rotating, but by the outermost sphere of the universe, the *Primum Mobile* (Latin for "First Mover"), spinning from East to West once every 24 hours. This sphere carries all the inner spheres (including the Sun's sphere) along with it.
  *   **The Sun's "Proper Motion":** The Sun has its own independent, much slower motion through the Zodiac (East to West relative to the stars, but effectively West-to-East along the ecliptic relative to the daily spin). This is its "annual" motion.
  *   **Why Stopping the Sun Shortens the Day:** A "Solar Day" (24 hours) is slightly longer than a "Sidereal Day" (the time it takes the stars to rotate once, ~23 hours 56 minutes). The difference exists because while the *Primum Mobile* spins the Sun Westward, the Sun is also drifting slowly Eastward on its own. The *Primum Mobile* has to spin a little *extra* each day to catch up to the Sun's new position.
      *   Galileo points out that if the Sun were to stop its "true and proper Motion" (its Eastward drift), the *Primum Mobile* would not have to rotate as far to bring the Sun back to the horizon. Consequently, **the day would become shorter** (by about 4 minutes), not longer.
  *   **The Acceleration Argument:** To actually lengthen the day in the Ptolemaic system, you would need the Sun to drift Eastward *faster*, forcing the *Primum Mobile* to rotate even further to catch it. Galileo claims that to keep the Sun fixed above the horizon (preventing sunset), the Sun would essentially have to move Westward at the same speed as the *Primum Mobile* to counteract the daily rotation.
  *   **The Conclusion:** In the Ptolemaic system, the Sun is a passenger on the *Primum Mobile*. Stopping the passenger does not stop the vehicle. Therefore, for the day to lengthen, the *Primum Mobile* must stop, not the Sun. Since Joshua commanded the *Sun* to stop, a literal reading of the text is mechanically impossible in the Ptolemaic system. It would require assuming Joshua spoke metaphorically (meaning "Stop, *Primum Mobile*") rather than literally.

  ### 2. The Copernican Alternative: The Sun as the "Principle of Motion"

  Galileo proposes that in the Copernican system, the miracle is mechanically straightforward, but this relies on a specific physical theory he developed regarding sunspots.

  *   **Sunspots and Solar Rotation:** Galileo references his *Letters on Sunspots* (1613). By tracking spots across the face of the Sun, he claimed to have demonstrated that the Sun rotates on its axis approximately once a month.
  *   **The Sun as Engine:** Galileo goes beyond simple heliocentrism (Sun at the center) to propose a physical causation. He suggests that the Sun's rotation is the **motive force** that drives the planets. He calls the Sun the "Fountain of Light, and Principle of Motion." In his view, the Sun emits a force (perhaps magnetic or spiritual) via its rotation that sweeps the planets along in their orbits and potentially drives their daily rotations as well.
  *   **Halting the System:** If the Sun is the engine of the solar system, then stopping the engine stops the cars.
      *   If God commands the Sun to "stand still" (stop rotating on its axis), the motive force ceases.
      *   Consequently, the Earth stops orbiting the Sun.
      *   Crucially, Galileo implies the Earth's daily rotation is also dependent on this solar influence. If the Earth stops rotating, the Sun will appear to hang motionless in the sky.
  *   **Why This Suffices:** In this model, stopping the Sun *does* stop the "whole Worlds Systeme." You do not need to issue separate commands to the Earth, the Moon, or the *Primum Mobile* (which doesn't exist in this system). By halting the central source of motion, all dependent motions cease. The day is lengthened because the Earth's rotation (which causes the Sun to appear to set) has stopped.

  ### 3. The Argument for Literalism

  This is the most rhetorical and daring part of Galileo's strategy. Conventionally, heliocentrism is seen as conflicting with passages like Joshua 10, because the Bible says the Sun moves and stands still, while Copernicus says the Earth moves and the Sun is stationary. Galileo flips this objection.

  *   **Ptolemy Requires Metaphor:** As established in point 1, if the Ptolemaic system is true, Joshua's words are technically incorrect. The Sun's stopping would not lengthen the day; only the *Primum Mobile's* stopping would. Therefore, to save the Ptolemaic system, one must argue that Joshua was "stooping to their Capacity" (accommodating the language to the ignorance of the common people) and did not mean what he literally said.
  *   **Copernicus Allows Literalism:** Galileo argues that in his version of the Copernican system, the text can be taken literally.
      *   **The Command:** "Sun, stand still." (The Sun stops rotating).
      *   **The Effect:** The Day lengthens. (Because the Earth stops rotating).
      *   **The Appearance:** To an observer on Earth, it looks exactly as if the Sun has stopped moving across the sky.
  *   **Relieving the Pressure:** Galileo is arguing that the Copernican system honors the *causal* logic of the scripture better than the Ptolemaic system does. In Ptolemy, the Sun is a passive light in a moving sphere; in Galileo's Copernicanism, the Sun is the active "Prince" of the system. If the Bible attributes the miracle to the Sun's agency, the system that makes the Sun the active source of motion (Copernicus) fits the text better than the system that makes the Sun a passive passenger (Ptolemy).

  **Summary:** Galileo is not denying the miracle; he is arguing that the *physics* of the miracle work better in a heliocentric universe. He claims that the Church's preferred astronomy (Ptolemy) actually forces a metaphorical reading of the Bible, whereas his astronomy allows the biblical author to be understood literally regarding the physical cause of the event.
