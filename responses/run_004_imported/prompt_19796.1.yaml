answer: |-
  This is a fantastic tension to hang a dissertation on, because it cuts to the heart of whether ethics is a *calculus of the universe* or a *practice of human beings*.

  If you put 1920s Ramsey in a room with a modern Longtermist arguing that AI x-risk swamps all other priorities due to the astronomical value of the future, **Ramsey wins.** But he doesn't win by contradicting his 1928 paper; he wins by showing the Longtermist has misunderstood what that paper was actually doing.

  Here is the resolution: Ramsey's rejection of discounting in *A Mathematical Theory of Saving* is a constraint on **selfishness**, whereas his "perspective" argument in the *Epilogue* is a constraint on **absurdity**. The Longtermist falls into the trap of absurdity by treating ethics as a view from nowhere.

  Here is how Ramsey shakes this out.

  ### 1. The 1928 Paper is About Justice, Not Aggregation
  The Longtermist reads Ramsey's "ethically indefensible" line as a command to maximize the sum total of utility across all time, treating a person in the year 3000 as mathematically identical to a person in 2024.

  But look at the context of the 1928 paper. Ramsey is deriving an optimal savings rate for a *continuous community*. He is solving a problem of **distribution between generations**, not **maximization across the cosmos**. When he says pure time discounting is indefensible, he means the present generation has no right to privilege its own enjoyment *merely because it is present*. It is a ban on intergenerational selfishness.

  However, Ramsey *does* allow for discounting based on **probability**. In the 1928 model, he explicitly includes a factor for the chance of extinction (war, catastrophe). He writes that we discount the future not because it is *later*, but because there is a chance there will be *no one there* to enjoy it.

  The Longtermist says: "Sure, but if the value ($V$) of the future is $10^{50}$ lives, even a tiny probability ($P$) of saving them yields a huge Expected Value ($EV$)."

  Ramsey would reject this algebraic move. Why? Because it violates the human perspective required for ethics to function.

  ### 2. The "Epilogue" is the Metaphysical Check
  In the *Epilogue* (1931), Ramsey is fighting a different enemy: nihilism. He is arguing against the idea that the vastness of space and time renders human life meaningless. His solution is the "threepenny bits" analogy: we must draw the world in **perspective**, not to **scale**.

  If you draw the world to scale (the Longtermist view), the heat death of the universe or the potential trillions of future digital minds dominate the picture. The present human struggle becomes a speck. Ramsey says this is ethically paralyzing and psychologically impossible. We *cannot* value things purely by their cosmic scale. We value them by their relation to our agency and our imaginative grasp.

  When Ramsey says in the *Epilogue* that the remote future has negligible present value, he isn't contradicting the 1928 paper. He is clarifying that **value is agent-relative**.

  *   **1928:** Don't discount the future just because *you* are greedy for the present.
  *   **1931:** Don't inflate the future just because *math* says the numbers are big.

  The Longtermist argument relies on the "view from nowhere"—an objective, cosmic accounting of utility. Ramsey is a pragmatist (heavily influenced by Peirce and Wittgenstein). For Ramsey, belief and value are guides to **action**. A value so remote that it requires ignoring the immediate texture of human life to pursue it is not a human value; it is a mathematical fetish.

  ### 3. The Resolution: "Human Scale" vs. "Cosmic Scale"
  Ramsey would tell the Longtermist that they are committing a category error. They are applying the logic of *cosmic scale* (from physics/astronomy) to the logic of *human ethics* (which requires perspective).

  In the 1928 paper, Ramsey assumes a "bliss" state or a finite horizon of human continuity. He is interested in the welfare of **humanity as a going concern**. He is not interested in the abstract sum of conscious experiences regardless of their connection to human history.

  If the Longtermist argues for sacrificing present welfare to mitigate AI risk for the sake of $10^{50}$ future beings, Ramsey would ask: **Are these beings part of our human perspective, or are they abstract units?**

  If the AI risk scenario involves a future so alien, so distant, and so dependent on speculative metaphysics that it requires us to treat the present as negligible, Ramsey would say you have lost the plot. You are no longer doing ethics; you are doing theology with calculus.

  ### The Verdict
  Ramsey resolves the tension by distinguishing between **arbitrary time preference** (which is selfishness) and **perspectival valuation** (which is necessary for action).

  *   **Longtermist Logic:** Value = Utility $\times$ Probability $\times$ Time. (Time is neutral, so infinite time = infinite value).
  *   **Ramsey's Logic:** Value = Utility $\times$ Probability $\times$ **Human Grasp**.

  Ramsey would argue that the "ethically indefensible" quote prohibits us from saying "a life in 2100 matters less than a life in 2024." It does *not* compel us to say "a trillion lives in 3000 matter more than a billion lives in 2024."

  The Longtermist wins on the math, but Ramsey wins on the philosophy. For Ramsey, ethics is not about getting the cosmic sum right; it is about living well in a world drawn in perspective. To let the "astronomical waste" argument override near-term human suffering is to draw the world to scale, and Ramsey explicitly rejects that as a basis for human life.

  **For your diss:** The key is to frame Ramsey not as a proto-utilitarian aggregator, but as a **humanist pragmatist**. His zero-discount rate is a rule of **fairness** between connected generations, not a rule of **maximization** across the cosmos. The Longtermist takes the 1928 technical constraint and turns it into a 1931 metaphysical absolute, which Ramsey would call nonsense.
