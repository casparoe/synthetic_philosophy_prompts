answer: |-
  The debate between epistemicism and supervaluationism regarding higher-order vagueness turns on a fundamental question: **Can a theory of vagueness eliminate sharp boundaries entirely, or must it merely shift their location?**

  When focusing specifically on higher-order vagueness—the phenomenon where the boundary between clear cases and borderline cases is itself blurry—the two theories diverge sharply in their candor, though they may converge in their logical commitments. Epistemicism candidly posits sharp cutoffs at every order of vagueness. Supervaluationism attempts to model the absence of such cutoffs using the "definitely" operator ($D$) and admissible precisifications. However, upon rigorous analysis of the higher-order structure, the supervaluationist maneuver does not succeed in eliminating sharp boundaries; rather, it **relocates** the commitment to a sharp cutoff from the object language (the predicate's extension) to the meta-language (the boundary of the set of admissible interpretations).

  ### Epistemicism: Sharpness at Every Order

  Epistemicism maintains that vague predicates have classical extensions: there is a specific grain of sand that is the last one to count as part of a heap, even if we cannot know which one it is. When addressing higher-order vagueness, epistemicism remains consistent with this core thesis.

  For the epistemicist, the operator "Definitely" ($D$) functions as a modal operator governed by classical logic. If $F$ is a vague predicate, there is a sharp boundary between $F$ and $\neg F$. Consequently, there is also a sharp boundary between $DF$ (Definitely $F$) and $\neg DF$ (Not Definitely $F$).
  *   **First-Order:** There is a last case that is $F$.
  *   **Second-Order:** There is a last case that is *definitely* $F$.
  *   **Higher-Orders:** For any iteration $D^n$, there is a sharp cutoff between $D^n F$ and $\neg D^n F$.

  Epistemicism accommodates higher-order vagueness by treating it as **iterated ignorance**. The fact that we cannot locate the boundary between clear cases and borderline cases is simply a reflection of our ignorance regarding the boundary of the "definitely" operator. Epistemicism does not try to dissolve the sharpness; it accepts that reality (and logic) is precise, even if our epistemic access is not. Thus, regarding higher-order vagueness, epistemicism is theoretically stable: it posits sharp cutoffs all the way up the hierarchy of definiteness.

  ### Supervaluationism: The Admissibility Maneuver

  Supervaluationism attempts to capture the intuition that there are *no* sharp boundaries. It defines truth as "super-truth": a sentence is true if and only if it is true on all **admissible precisifications** (ways of making the vague predicate precise).
  *   $p$ is super-true iff $\forall s \in S (p \text{ is true on } s)$.
  *   $p$ is borderline iff $\exists s_1, s_2 \in S (p \text{ is true on } s_1 \land p \text{ is false on } s_2)$.

  To handle higher-order vagueness, supervaluationists introduce the $D$ operator: $Dp$ is true iff $p$ is super-true. Higher-order vagueness is modeled by the transition from $Dp$ to $\neg Dp$. The supervaluationist claims that because the set of admissible precisifications $S$ represents the "penumbra" of the predicate, there is no sharp line between the cases that fall into $S$ and those that do not.

  ### The Relocation of Sharpness

  The critical issue arises when we ask: **What determines the set $S$ of admissible precisifications?**

  For the supervaluationist semantics to function logically, the relation "is an admissible precisification" must be well-defined. If we are to evaluate whether a sentence is true on *all* $s \in S$, the set $S$ itself must have determinate membership.
  1.  **If the boundary of $S$ is sharp:** Then there is a precise cutoff between interpretations that are admissible and those that are not. Consequently, there is a sharp cutoff between sentences that are true on *all* admissible interpretations and those that are not. This means there is a sharp boundary between $Dp$ and $\neg Dp$. The supervaluationist has successfully removed the sharp boundary from the extension of the predicate $F$, but they have **relocated** it to the boundary of the set $S$. The higher-order vagueness is illusory; there is a sharp line between "super-true" and "not super-true."
  2.  **If the boundary of $S$ is vague:** Then the set of admissible precisifications is itself vague. To model this, one would need a "supervaluation over sets of precisifications." This leads to a regress. To define the truth conditions at this higher level, one eventually requires a fixed set of "admissible sets of precisifications." At the top of this regress, a sharp boundary must be posited to ground the semantics.

  This critique, most notably advanced by Timothy Williamson, suggests that supervaluationism relies on a classical meta-language to define its non-classical object language. In the meta-language, classical logic applies, meaning the statement "Interpretation $i$ is in set $S$" is either true or false. There is no third option in the meta-theory. Therefore, **a sharp cutoff is inevitable.**

  ### Comparison and Justification

  Does the supervaluationist maneuver succeed in avoiding a sharp cutoff? **No.** It merely hides the sharpness in the meta-linguistic definition of admissibility.

  *   **Epistemicism** locates the sharp cutoff in the **world/language interface** (the extension of the predicate). It admits that for any level of definiteness $n$, there is a specific case $x$ such that $x$ is $D^n F$ and $x+1$ is $\neg D^n F$.
  *   **Supervaluationism** locates the sharp cutoff in the **semantic model** (the set of precisifications). It posits that there is a specific precisification $s$ such that $s$ is admissible and a neighboring $s'$ that is inadmissible.

  The supervaluationist might argue that the sharpness in the meta-language is acceptable because it is not "in the world." However, the prompt asks if the theory avoids a sharp cutoff *at some level*. By relying on a classical set $S$ to define super-truth, supervaluationism commits to the existence of a sharp boundary between the admissible and the inadmissible. This is structurally identical to the epistemicist's commitment to a sharp boundary between the true and the false.

  Furthermore, supervaluationism faces a dilemma regarding the $D$ operator that epistemicism avoids. If $D$ is defined via a sharp set $S$, then $D$ behaves classically (bivalently). If $p$ transitions from super-true to not-super-true, it does so at a specific point. This recreates the Sorites paradox at the level of the $D$ operator: if $x$ is definitely $F$, and $x$ is indistinguishable from $x+1$, why is $x+1$ not definitely $F$? The supervaluationist must say there is a sharp cutoff in admissibility that makes $x$ count on all precisifications but $x+1$ fail on at least one. This is the exact same "brute fact" the epistemicist posits, merely dressed in semantic clothing.

  ### Conclusion

  Supervaluationism does not succeed in eliminating sharp cutoffs regarding higher-order vagueness; it **relocates** them. While epistemicism candidly posits sharp boundaries in the extension of vague predicates (and their iterated definiteness), supervaluationism posits a sharp boundary in the set of admissible interpretations required to define those predicates.

  Epistemicism is theoretically more honest regarding this specific issue: it acknowledges that classical logic demands precision somewhere. Supervaluationism attempts to have it both ways—using classical logic to define a semantics that denies classical boundaries—but in doing so, it pushes the required precision into the meta-language. Thus, regarding higher-order vagueness, supervaluationism does not offer a boundary-less alternative to epistemicism; it offers an epistemicism about semantic admissibility rather than predicate extension.
