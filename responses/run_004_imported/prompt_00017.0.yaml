answer: |-
  This is a sophisticated objection that cuts to the heart of the philosophy of biology. You have correctly identified the tension between the **causal-process account** of selection (favored by Sober, Lewontin, and group selectionists), which locates selection in the differential survival of *interactors*, and the **replicator account** (favored by Dawkins, Williams, and Hull), which locates selection in the differential persistence of *replicators*.

  Your worry is that the gene-selectionist move is circular: *If you define evolution as the survival of replicators, genes win. But why define it that way?*

  To defend the gene-centric view without begging the question, we must argue that identifying genes as the unit of selection is not merely a semantic stipulation, but an **empirical and explanatory necessity** for making sense of cumulative adaptation, intragenomic conflict, and the temporal structure of evolution.

  Here is an argument for the gene-centric view that addresses your concern about circularity by focusing on explanatory power, empirical anomalies, and the distinction between the *target* and the *beneficiary* of selection.

  ### 1. Distinguishing the "Target" from the "Beneficiary"
  The first step in dissolving the circularity charge is to clarify the terminology, specifically engaging with Elliott Sober's distinction. Sober argues that we must distinguish between the **unit of selection** (the entity that interacts with the environment and causes differential survival) and the **beneficiary of selection** (the entity whose frequency increases as a result).

  *   **The Critic's View:** Sober and Lewontin argue the organism is the unit of selection because it is the *interactor*. It is the thing that starves, freezes, or mates. To call the gene the unit of selection is to confuse the map (genetics) with the territory (biology).
  *   **The Gene-Centric Defense:** We can concede that the organism is the *target* (or interactor) of selection without conceding that it is the *unit* of selection in the sense that matters for evolutionary theory. The question "What is the unit of selection?" is not asking "What dies?" but rather "What accumulates?"

  Evolution is distinct from mere ecological turnover because it involves **cumulative adaptation**. For adaptation to accumulate, information must be preserved across generations. Organisms do not preserve information across generations; they dissolve. Every generation, the organismal phenotype is dismantled and rebuilt. The only physical entity that maintains structural integrity and informational continuity across the deep time required for adaptation is the gene (or replicator).

  Therefore, calling the gene the "unit of selection" is not a fiat definition; it is an identification of the only entity capable of sustaining the *process* of cumulative selection. If you choose the organism as the unit, you cannot explain how complex adaptations arise, because the "unit" ceases to exist every generation.

  ### 2. The Argument from Intragenomic Conflict (The Empirical Wedge)
  The strongest non-circular argument for gene selectionism is empirical. If the organism were the fundamental unit of selection, we would expect the organism to function as a harmonious whole, optimizing its own reproductive success. Any internal conflict would be maladaptive noise.

  However, we observe systematic **intragenomic conflict**.
  *   **Meiotic Drive:** Some gene variants ("selfish genes") manipulate meiosis to ensure they are passed on to more than 50% of offspring, even if this reduces the fertility or survival of the organism.
  *   **Transposable Elements:** "Jumping genes" replicate within the genome, sometimes causing harmful mutations, solely for their own propagation.
  *   **Cytoplasmic Male Killing:** In some insects, mitochondrial genes (maternally inherited) kill male offspring to conserve resources for female offspring, directly contradicting the nuclear genome's interest and the organism's reproductive potential.

  **Why this matters for your objection:**
  A group/organism selectionist must treat these phenomena as anomalies or "subversion from within." They have to say, "The organism is the unit, but sometimes the parts rebel."
  The gene selectionist says, "These are not anomalies; they are exactly what we predict if the gene is the unit."

  This is not a matter of defining "replicator" by fiat. It is a matter of **predictive scope**. The gene-centric view subsumes organismic success *and* organismic failure under a single explanatory framework. The organism is a temporary coalition of genes that usually share a common interest (vertical transmission), but when interests diverge, the gene's interest prevails. This empirical reality suggests the gene is the causally privileged unit, not because we defined it so, but because it explains data that the organism-centric view treats as exceptions.

  ### 3. The Temporal Argument: Lineage vs. Instance
  You mentioned Hull's replicator/interactor distinction. A common critique is that Hull's criteria (longevity, fecundity, fidelity) are rigged to favor genes. However, these criteria are derived from the logic of **Darwinian algorithms**.

  For natural selection to work, there must be a correlation between the properties of an entity and its contribution to the next generation.
  *   **Organisms:** The correlation is broken every generation. My offspring is not a copy of me; it is a new mixture. I am an evolutionary dead end.
  *   **Genes:** The correlation holds. A specific allele in me can be identical by descent to an allele in a descendant 1,000 generations later.

  If we define the "unit of selection" as the entity that bridges the gap between generations, this is not a stipulation but a structural requirement of evolutionary theory. Evolution is a process that happens *over time*. An entity that cannot persist through time (the organism) cannot be the primary locus of evolutionary change, even if it is the locus of ecological interaction.

  To use an analogy: In a relay race, the runners (organisms) do the running, but the baton (gene) is what crosses the finish line. If you ask, "What is the unit of the race?" pointing to the runner is causally accurate for the *motion*, but pointing to the baton is structurally accurate for the *continuity*. If the baton is dropped, the race ends, regardless of how fast the runner was.

  ### 4. Addressing the "Bookkeeping" Objection
  Critics like Lewontin argue that genes are merely a "bookkeeping device" to track the real action, which happens at the phenotypic level. They argue that selection acts on phenotypes, and genotypes are just inferred.

  The gene-centric counter-argument is that **phenotypes are not stable enough to be selected *for* in the long run.**
  Selection acts on phenotypes *in the moment*, but it selects *for* genotypes *over time*.
  *   If a phenotype is successful but not heritable, evolution does not occur.
  *   If a phenotype is heritable, it is because of the underlying genotype.

  Therefore, the genotype is not just a passive ledger; it is the **causal anchor**. The reason the phenotype exists is the genotype. The reason the phenotype's success matters for the future is the genotype's replication. To call genes "bookkeeping" is to imply they are passive records. In reality, they are active instructions that construct the vehicles. The "vehicle" (organism) is the mechanism by which the "replicator" (gene) makes copies of itself.

  This reverses the causal arrow proposed by the critic. The organism does not use genes to reproduce; genes use organisms to reproduce. This is not a metaphorical flourish; it is a claim about developmental biology. The developmental program is stored in the DNA, not in the organismal structure.

  ### 5. Multi-Level Selection and Heuristic Power (Okasha/Sober)
  Finally, we must address the Multi-Level Selection (MLS) framework, championed by Sober and Okasha. They argue that we can mathematically model selection at the group, organism, and gene level simultaneously (via the Price Equation), and that these models are often mathematically equivalent. If they are equivalent, why prefer the gene view?

  The defense here is **heuristic and protective**.
  1.  **Parsimony:** The gene-centric view provides a single currency (inclusive fitness) to explain behavior across all levels. MLS requires balancing parameters between levels. While mathematically possible, the gene view often offers a more direct path to explaining altruism (Kin Selection) without invoking group benefit as a causal force.
  2.  **Protection against Fallacy:** The history of evolutionary biology is littered with "Good of the Species" arguments (Wynne-Edwards). These are organism/group-centric arguments that turned out to be false. The gene-centric view acts as a "straw man" detector. By forcing the question "How does this trait replicate the underlying code?", it prevents the attribution of agency to groups that do not have replication mechanisms.

  While Okasha is right that MLS is mathematically valid, the gene-centric view is **ontologically safer**. Groups often lack the copying fidelity to be true replicators. Organisms lack the longevity. Genes possess both. To treat groups as units of selection is to treat them *as if* they were organisms, which requires additional empirical justification (e.g., showing the group has a bottleneck and reproduction mechanism, as in eusocial insects). The gene view assumes the baseline reality of replication; the group view assumes a derived, fragile reality.

  ### Conclusion: Why It's Not Circular
  To return to your core worry: Is this circular?

  It is circular only if you define "evolution" as "change in gene frequencies" at the outset. But if you define evolution as **"cumulative adaptive change over deep time,"** then identifying the gene as the unit of selection is an **empirical conclusion**, not a premise.

  1.  **Premise:** Cumulative adaptation requires a substrate with high copying fidelity and longevity.
  2.  **Observation:** Organisms and groups lack this fidelity and longevity; they are dismantled every generation.
  3.  **Observation:** Genes (DNA sequences) possess this fidelity and longevity.
  4.  **Conclusion:** Therefore, genes are the fundamental unit of selection.

  The gene-selectionist is not stipulating that genes matter; they are arguing that *nothing else can do the job* of sustaining evolution. The organism is the stage, the environment is the director, but the gene is the script. Without the script, the play cannot continue to the next night, no matter how well the actors performed.

  By focusing on **intragenomic conflict**, **temporal continuity**, and the **distinction between target and beneficiary**, you can defend the gene-centric view as the one that best captures the causal structure of evolutionary explanation, rather than merely winning a semantic game.
