answer: |-
  You are right to be bothered. In fact, the fact that this bothers you is a good sign—it means you're thinking like a scientist rather than just a technician.

  Here is the direct answer you asked for: **Your coworker is half-right, but he's missing the biological signal. You are looking for a hard boundary that evolution does not provide, but the 95% number is not just a random guess.**

  Here is the breakdown of why that number exists, why "species" is fuzzy everywhere (not just bacteria), and why your supervisor's answer was incomplete.

  ### 1. Where the 95% Actually Comes From
  Your supervisor told you it "stuck around" from older methods. She was glossing over the fact that this was a deliberate calibration, not just inertia.

  Before we could sequence whole genomes cheaply, the gold standard for defining bacterial species was **DNA-DNA Hybridization (DDH)**. In the 1980s, the international committee on bacterial taxonomy set a rule: if two bacteria share **70% DNA hybridization**, they are the same species.

  When Whole Genome Sequencing (WGS) replaced DDH, scientists needed to know how WGS data correlated to the old legal and medical standards. They ran thousands of comparisons and found that **70% DDH correlates almost perfectly with 95–96% Average Nucleotide Identity (ANI).**

  So, the 95% cutoff isn't a number someone pulled out of thin air; it is a **translation key**. It ensures that a species defined today means the same thing as a species defined in 1990. If they changed the cutoff to 98% or 90%, it would invalidate decades of epidemiological data, medical literature, and food safety regulations.

  ### 2. Is "Species" Real in Bacteria?
  Your coworker said it's "just a filing system." This is a common cynical take, but it ignores **ecological coherence**.

  In animals, species are often defined by reproduction (the Biological Species Concept you learned in school). In bacteria, since they clone themselves and swap genes horizontally (Horizontal Gene Transfer), species are defined by **ecological niche and genomic stability.**

  When bacterial populations diverge, they don't just drift randomly. They adapt to specific environments (a cow's gut, a leaf surface, a human wound). Natural selection pulls the genome into a cluster.
  *   **Above 95% ANI:** The bacteria generally share the same metabolic capabilities, pathogenicity, and ecological niche. They are functionally the same "thing."
  *   **Below 95% ANI:** You start seeing significant differences in what they eat, what toxins they produce, and where they live.

  So, the "clusters" are real biological phenomena. The *line* drawn between them is pragmatic, but it is drawn at a point where biological function typically diverges. It is not *purely* arbitrary bookkeeping; it is a **operational threshold on a real biological continuum.**

  Think of it like the color spectrum. Is "blue" a real thing? Yes. Is the exact wavelength where "blue" becomes "green" arbitrary? Yes. But if you tell a painter to "mix blue," they know what to do. The 95% ANI is the wavelength where "blue" becomes "green."

  ### 3. Is This Fuzziness Unique to Bacteria?
  No. This is the dirty secret of taxonomy that undergraduates rarely get told: **The Biological Species Concept (interbreeding) is leaky even for animals.**

  *   **Hybridization:** Wolves, coyotes, and dogs can interbreed. So can lions and tigers. So can many species of ducks and oak trees. By the strict "fertile offspring" definition, many distinct animal species should be lumped together.
  *   **Ring Species:** The *Ensatina* salamanders in California form a ring around a valley. Population A breeds with B, B with C, C with D... but when you get to Population G at the end of the ring, it cannot breed with Population A. Are they one species or seven? There is no factual answer, only a descriptive one.
  *   **Cryptic Species:** Two populations of mosquitoes might look identical and never interbreed, but genetically they are distinct. One carries malaria, the other doesn't. If you rely on "looks" or "interbreeding," you miss the danger.

  The fuzziness you are sensing isn't a bacteria problem; it is an **evolution problem.** Evolution is a continuous process of divergence. Taxonomy is a discrete system of naming. You are trying to overlay a grid on a landscape. The grid lines are human-made, but the hills and valleys (the genetic clusters) are real.

  ### 4. Why This Matters for Your Job
  In food safety, "arbitrary" has real consequences.
  If you identify a pathogen as *Listeria monocytogenes*, there are specific regulatory actions. If it's a different *Listeria* species, the risk profile might change.

  The 95% ANI rule is defensible because it is **predictive.** If two isolates are >95% identical, we can predict with high confidence that they will react the same way to sanitizers, have the same virulence factors, and pose the same risk to consumers. If you ignore the cutoff, you lose the ability to predict behavior based on identity.

  ### The Verdict
  *   **Your Coworker:** He is right that species boundaries are human constructs, but wrong to imply there is no biological reality behind them. The clusters are real; the names are ours.
  *   **Your Supervisor:** She was right about the history, but wrong to imply it's just tradition. It's a calibrated standard to maintain continuity with medical and legal history.
  *   **You:** You are right to question it. The definition is pragmatic, not absolute.

  **The Bottom Line:**
  There is no "God-given" line in the sand where one species becomes two. Evolution is a gradient. However, the 95% ANI cutoff is the **best statistical proxy we have** for where functional differences usually emerge, calibrated against 50 years of prior data. It is a pragmatic line drawn on a real biological map.

  Don't stop questioning the "why." That skepticism is what keeps science honest. But for the purpose of your lab work, treat the 95% line as a functional reality, because in terms of risk and physiology, it usually acts like one.
