  1.  **Analyze the User's Input:**
      *   **Core Issue:** The user lives by a "deferred life plan" (grind now, enjoy later). Every time they hit a milestone, the satisfaction is fleeting (48 hours), and they immediately optimize for the next goal. They feel they have "Goodharted" their own life (turned measures of success into the goal itself, losing the original intent).
      *   **Contrast:** Their 7-year-old nephew builds Legos without a goal, plan, or audience, and enjoys it immensely.
      *   **Experiment:** The user picked up guitar with *no goals* (no recitals, no mastery, no resume value).
