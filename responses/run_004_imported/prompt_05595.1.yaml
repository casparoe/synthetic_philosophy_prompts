      *   **Core Problem:** The "Specificity Challenge." If fire has no causal power, why does burning *always* happen with fire and cotton, but not water and cotton? Is the pattern arbitrary (brute fact) or does it imply hidden powers (contradicting occasionalism)?
      *   **Specific Constraint:** Al-Ghazālī must hold a *genuinely occasionalist* position without conceding arbitrariness or secretly readmitting causal powers. Ibn Rushd must press the challenge hard.
