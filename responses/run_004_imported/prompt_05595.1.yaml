          *   *Core Tenet:* God is the only true Agent (*Fa'il*). Created things are inert.
          *   *Mechanism:* "Custom" (*'ādah*). God creates the contact, then creates the burning.
          *   *Defense against Specificity:* The connection isn't in the *things*, it's in the *Divine Will/Knowledge*. The pattern reflects God's wisdom and consistency, not the nature of the fire.
          *   *Nuance:* He allows for "secondary causes" linguistically but denies them ontologically. He distinguishes between "power" as an created accident vs. "power" as an essential nature.
      *   **Ibn Rushd (The Aristotelian):**
          *   *Core Tenet:* God is the First Cause, but secondary causes have real efficacy derived from their forms/natures.
          *   *Critique:* Denying natures makes science impossible. It makes God's action arbitrary or mechanical. It undermines the wisdom of creation.
          *   *Argument:* If the pattern is consistent, there must be a reason *in the creatures*. If not, why doesn't God burn cotton with ice?

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Cordoba or Baghdad (timeless space). Establish the stakes.
      *   **Round 1: The Specificity Challenge.**
