answer: |-
  Here is a constructive argument for the irreducibility of resultant luck, designed to fit into a longform piece. It moves beyond a survey of the debate and attacks the metaphysical assumptions underlying the "epistemic dissolution" view.

  ***

  ### The Ghost in the Machine: Why Resultant Luck Is Real

  The epistemic dissolution of resultant luck is seductive because it protects a deeply held intuition: the Control Principle. We want to believe that moral worth is immune to fortune. If two drunk drivers make the same reckless choice, the logic goes, they are morally identical. The fact that one hit a child and the other didn't is just a cosmic coin flip. When we blame the killer more than the lucky survivor, the dissolvers (like Zimmerman) argue we are suffering from a cognitive illusion. We aren't seeing *more* blame; we just have *better evidence* of the blame that was already there.

  This view is clean, tidy, and fundamentally wrong. It rests on a ghostly conception of human agency that locates morality entirely inside the skull. To argue that resultant luck is an illusion, you have to assume that an action is essentially a mental event (a "trying" or a "choice") that merely *causes* physical effects. But actions are not just mental seeds; they are world-involving events. When we strip the outcome out of the moral equation, we aren't clarifying the ethics; we are lobotomizing the act.

  Here is the case for why resultant luck is a real, irreducible feature of the moral landscape, even holding the agent's mental state fixed.

  #### 1. The Metaphysics of Action: Tryings vs. Doings
  The epistemic argument assumes that the moral core of the drunk driver's action was completed the moment they turned the key while intoxicated. Everything after that is just causal fallout. But this misunderstands what an action *is*.

  If I throw a stone at a window, I have performed an action. If the stone hits and shatters the glass, I have performed a *different* action: breaking a window. The intention and the muscle movement were identical in both cases, but the moral description of the event has changed. Why? because agency is not a closed loop between mind and body; it is a transaction between an agent and the world.

  To say the outcome doesn't matter is to say the world doesn't matter. It treats the physical reality of the child's death as a mere backdrop, like the weather. But the death is not the weather; it is the *realization* of the driver's agency. The lucky driver imposed a risk; the unlucky driver imposed a harm. Risk and harm are ontologically distinct categories. A risk is a probability; a harm is a fact. To claim the moral status is identical is to claim that threatening to shoot someone is morally the same as shooting them, provided the trigger pull was equally negligent. Most legal and moral systems reject this for a reason: because the *completion* of the harm changes the nature of the wrong.

  #### 2. The Relational Nature of Rights
  Morality is not just about the purity of the agent's will; it is about the rights of the patients. The epistemic view focuses entirely on the driver (the agent) and ignores the child (the patient).

  Every person has a right not to be killed. They also have a right not to be endangered, but these are not the same right. When the lucky driver makes it home, they have violated the child's right to safety (by creating risk), but the child's right to life remains intact. When the unlucky driver hits the child, they have violated the right to life.

  This isn't just semantic. The violation of a right creates a specific normative debt. If I break your vase, I owe you a replacement. If I almost break your vase but catch it at the last second, I owe you an apology for the scare, but I do not owe you a vase. The difference in what I owe you is not because my *negligence* changed (it didn't), but because the *state of your rights* changed.

  The epistemic dissolver argues we blame the killer more because the body proves the negligence. But that's backward. We recognize the negligence as morally catastrophic *because* it resulted in a body. The outcome validates the severity of the rights violation. If resultant luck were an illusion, then the victim of a crime would be irrelevant to the moral weight of the crime. But the victim is the very point of the morality.

  #### 3. Agent-Regret and the Obligation of Repair
  This is where Bernard Williams's concept of "agent-regret" becomes constructive rather than just descriptive. Williams noted that agents feel a special kind of regret for outcomes they caused, even accidentally, that they don't feel for mere near-misses. The dissolvers dismiss this as irrational guilt. But look at what that regret *does*.

  Agent-regret is not just a feeling; it is a recognition of a specific obligation to repair. The driver who kills the child must face the parents, pay restitution, and carry the burden of having ended a lineage. The lucky driver does not. If the moral facts were identical, these obligations would be identical. But they aren't. The unlucky driver has a debt to the world that the lucky driver does not.

  If you tell the unlucky driver, "Don't worry, you're no more blameworthy than the guy who got home safe," you are not comforting them; you are gaslighting them. You are telling them that the child's death is morally irrelevant. The "luck" here is not an artifact of our epistemology; it is the difference between a life interrupted and a life continued. That difference is real, it is in the world, and it attaches to the agent who caused it. To deny this is to insist that agents are not responsible for what they actually do, only for what they meant to do.

  #### 4. The Cost of Dissolution
  Finally, consider the practical cost of accepting the epistemic view. If resultant luck is an illusion, then criminal law is fundamentally unjust. We punish attempted murder less than successful murder. If Zimmerman is right, this is a mistake. We should punish the attempter exactly as harshly as the killer, because their "moral guilt" is identical.

  But almost no one actually believes this, even philosophers who argue for it in papers. Why? Because we recognize that the *harm* is part of the *wrong*. The suffering of the victim is a disvalue in the universe. The agent who brings that disvalue into existence has a different moral relationship to the universe than the agent who merely flirted with it.

  To dissolve resultant luck is to retreat into a Kantian fortress where the only thing that matters is the good will. But we don't live in a kingdom of ends; we live in a causal network. We are embodied agents whose choices ripple outward. Sometimes the ripples hit nothing; sometimes they drown a child. To say that the drowning is morally irrelevant to the thrower is to sever the link between agency and reality.

  #### Conclusion: The Burden of Being an Agent
  Resultant luck is not a puzzle to be solved; it is the tax we pay for being effective agents. If our actions had no uncertain outcomes, we would be gods. If our moral standing were immune to outcomes, we would be ghosts.

  The drunk driver who kills is not necessarily a *worse person* in terms of character than the one who gets home safe. They may have the same vice, the same recklessness, the same disregard. But they bear a heavier *burden*. They are the author of a tragedy, not just a risk. That distinction is not an epistemic error. It is the difference between a loaded gun pointed at a head and a bullet in the brain. The mental state of the shooter is the same. The moral reality is not. Resultant luck survives because the world survives, and morality is about how we live in that world, not just how we think about it.
