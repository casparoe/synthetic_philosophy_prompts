answer: |-
  The toast popped, but Arthur didn't move to butter it. He was standing in the center of his kitchen, holding the knife, staring at the linoleum.

  It wasn't that the linoleum looked different. It was the same speckled beige, same scuff mark near the fridge where he'd dropped a cast-iron skillet three years ago. It wasn't that he suspected he was in a dream, or a simulation, or someone else's house. Those would be beliefs. He could have argued against those. He could have listed the reasons why this was his kitchen: the mortgage papers in the drawer, the memory of laying the tile, the way the light hit the dust motes.

  The problem was that the list had nowhere to stand.

  Usually, the thought *This is my kitchen* isn't a thought at all. It's the silence between the notes. It's the hinge on which the door of his morning swings. You don't look at a hinge and ask if it's holding the door; if it stops holding, the door doesn't swing, you don't inspect the metal.

  But the hinge had become visible.

  "Arthur?"

  His wife, Elena, walked in. She was wearing her blue robe. She reached for the coffee mugs.

  "Did you hear me?" she asked.

  Arthur looked at her. He knew her. He knew the slope of her nose, the way her hair frizzed in the humidity. But the certainty that usually anchored the word *wife* had dissolved. It wasn't that he thought she was an impostor. That would be a delusion, a specific belief to be countered.

  It was worse. It was that the category had lost its gravity.

  "I hear you," Arthur said. His voice sounded flat, like a recording played in an empty room.

  "You're staring at the floor," Elena said. She poured the coffee. The liquid glugged, brown and steaming. A normal fact. A normal event. But for the event to be real, the stage had to be solid. And the stage was vibrating.

  Arthur tried to engage the world. He tried to perform the act of *being in a kitchen*. He reached for the butter. His hand moved through the air. He knew the trajectory. He knew the weight of the knife. But the connection between the intention and the object felt like it was being mediated by a wire that had been cut.

  "Is something wrong?" Elena asked. She touched his arm. Her hand was warm.

  If this were a normal doubt, he could test it. *Pinch yourself. Look at a clock. Read a sentence twice.* Those are moves within the game of checking reality. They presuppose that clocks are reliable, that skin sensation is a valid metric, that sentences have stable meanings.

  But Arthur couldn't make a move. To check if this was his kitchen would require a ground outside the kitchen to stand on. There wasn't one.

  "I don't know," Arthur said.

  "You don't know if something is wrong, or you don't know what?"

  "I don't know..." He stopped. He wanted to say, *I don't know if this is my kitchen.* But saying it made it sound like a hypothesis. Like he was considering the possibility that he had taken a wrong turn at the bedroom door. That wasn't it. It was that the *is* had lost its function.

  He looked at his hand. The one holding the knife.

  Wittgenstein wrote that if you say *I know I have a hand*, you are speaking nonsense. You don't know it. It is not a piece of knowledge. It is something you show by reaching, by grasping, by pointing. To say it is to treat a rule of the game as a piece played within the game.

  Arthur tried to grasp the handle of the butter dish.

  *I know this is butter,* he thought.
  But the thought didn't land. It hovered.

  If he doubted it, he was mad. If he affirmed it, he was lying. Because affirmation implies the possibility of negation, and the possibility of negation was no longer there. It had been replaced by a void.

  "Arthur, sit down." Elena guided him to the table.

  He sat. The chair supported his weight. Physics was working. The causal chain was intact. But the *meaning* of the chair—the fact that it was *his* chair, in *his* house, in a world that had existed before he sat down—was no longer a given. It was a proposition he was being asked to sign off on, and he had lost his pen.

  "I feel," Arthur said, searching for a word that didn't exist, "like I'm trying to read a sentence where the grammar has been removed."

  "Grammar?" Elena frowned. "Are you having a stroke?"

  "No."

  "Then what?"

  Arthur looked at the toast. Cold now. "Imagine you're playing chess. And suddenly, you look at the bishop, and you realize there's no rule that says it moves diagonally. It's just a piece of wood. You *could* move it like a knight. You *could* eat it. The rule isn't written on the wood. The rule is... us. It's us agreeing to move it that way."

  "Okay," Elena said slowly. "And?"

  "And I think I forgot how to agree."

  He looked around the room. The fridge hummed. A car drove past outside. These were hinges. *The earth exists. Objects persist. Time flows.* They were supposed to be the riverbed through which the water of his thoughts flowed. But the riverbed had turned to water. Everything was fluid. Nothing held the weight of a fact.

  He realized then that he couldn't leave the room.

  To leave the room, he would have to open the door. To open the door, he would have to assume the door led to a hallway. To assume the hallway led to a world. But the assumption was no longer silent. It was loud. It was a demand.

  If he stood up, he would be asserting *I am going to the hallway.* But he didn't have the authority to make that assertion anymore. The authority didn't come from him. It came from the hinge. And the hinge was loose.

  "I can't," Arthur said.

  "Can't what?"

  "Can't go on."

  Elena reached across the table and took his hand. She squeezed it. "Arthur, this is my hand. And that is yours. We are here. It is Tuesday."

  She was throwing him ropes. But they were ropes made of the same fraying fiber. She was offering him propositions—*Tuesday, Hand, Here*—as if they were life rafts. But they weren't rafts. They were the water.

  "I know you're trying to help," Arthur said. "But you're speaking the language."

  "And you're not?"

  "I'm listening to the silence underneath it."

  He looked at the knife again. It was a tool. A tool implies a user and a task. *Cut.* But *cutting* implies a future where the bread is sliced. The future was no longer guaranteed by the past. The induction was broken. Just because the knife cut yesterday didn't mean it cut today, not because of magic, but because the *concept* of 'today' had detached from the *concept* of 'yesterday'.

  He wasn't afraid. Fear requires a threat. A threat requires a future.
  He wasn't sad. Sadness requires a loss. He hadn't lost anything; he had just noticed that nothing was ever held in place to begin with.

  He was just stopped.

  "Arthur," Elena said, her voice tightening. "Eat your toast."

  It was a command. A move in the language game. *Command -> Obey.*

  Arthur looked at the toast. He knew what he was supposed to do. He knew the script. But the script was just ink on paper. There was no actor.

  "I can't," he said softly. "The hinge won't turn."

  "What hinge?"

  Arthur didn't answer. He couldn't explain that he wasn't trapped in the room. He was trapped in the proposition *This is a room.* And he couldn't step out of it, because there was no 'out' to step into. There was only the terrifying, open silence where the certainty used to be.

  He sat still. The coffee steamed. The fridge hummed. The world continued to spin, violently, without his permission, without his agreement, grinding on hinges that he could no longer see, but could no longer trust to hold.

  He waited for the feeling to pass. But he knew, with a clarity that was the only thing left that felt real, that feelings pass within time. And this was what time was made of.

  So he just sat. And the toast got colder. And the silence grew louder, until it was the only thing in the house.
