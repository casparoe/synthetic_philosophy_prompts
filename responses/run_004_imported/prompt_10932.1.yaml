  **The Insensate Machine: Defending the Strong Reading of Descartes' Beast-Machine Doctrine**

  The caricature of René Descartes as the philosopher who vivisected his dog without a twinge of guilt because he believed it felt nothing is a staple of introductory ethics courses. Yet, as closer inspection of his correspondence reveals, particularly his 1649 exchange with Henry More, the historical Descartes is more elusive than the caricature suggests. In these letters, Descartes appears to distinguish between *thought* (which he denies animals) and *sensation* (which he seems tentatively to grant them), leading some scholars to propose a "softened" reading: animals are unconscious sentients, capable of feeling pain without thinking about it. However, while this reading offers a more palatable ethics, it collapses under the weight of Descartes' own metaphysics. A rigorous analysis of his systematic works demonstrates that the "Strong Reading" is the only one coherent by his own lights: Descartes did indeed deny animals any feeling whatsoever. To grant them sensation, even unconscious sensation, would require abandoning the fundamental dualism that defines his philosophy. Consequently, while Descartes may not have personally advocated for sadism, his metaphysical framework provided the intellectual architecture that licensed cruelty by rendering animal suffering an ontological impossibility.

  To understand why the Strong Reading is the necessary conclusion, one must begin with Descartes' definition of the mind. In the *Principles of Philosophy* (Part I, Article 9), Descartes defines "thought" (*cogitatio*) broadly to include everything that happens within us of which we are immediately conscious. This list explicitly includes "sensing" (*sentire*), willing, imagining, and understanding. For Descartes, sensation is not merely a mechanical input; it is a mode of thinking. Pain, for instance, is not the damage to the flesh, nor the transmission of signals to the brain; it is the *conscious experience* of that transmission. In the *Second Meditation*, he establishes that he is a "thinking thing," and his certainty of his own existence relies on the immediate awareness of his states. If sensation is a mode of thought, and animals lack a mind (a *res cogitans*), then logically, they cannot sense. To claim an animal feels pain is to claim it possesses a mind, which Descartes explicitly denies to preserve the uniqueness of the human soul and its immortality.

  Proponents of the "softened" reading point to the correspondence with Henry More to argue that Descartes allowed for a distinction between conscious thought and unconscious sensation. In the letter of February 5, 1649, Descartes writes that he does not deny life or sensation to animals if sensation is understood as a bodily function, but he denies them "thought" in the strict sense. He suggests that animals might have "passions" without conscious awareness. However, accepting this distinction creates a fatal incoherence within the Cartesian system. If sensation can exist without consciousness, then sensation is a property of extension (*res extensa*), not thought (*res cogitans*). This blurs the absolute ontological divide between mind and body that serves as the foundation of Descartes' entire philosophy. If matter can feel, even unconsciously, the special status of the human mind is compromised, and the mechanistic physics Descartes championed becomes contaminated with proto-panpsychism. Descartes was too systematic a thinker to accept this trade-off. In his mature system, there is no "unconscious feeling"; there is only mechanical reaction (in the body) and conscious awareness (in the mind). Since animals have no mind, they have no awareness, and therefore, by Descartes' definition, no sensation.

  The letters to More, therefore, should not be read as a philosophical revision but as a diplomatic evasion. Descartes was aware that the beast-machine doctrine invited charges of cruelty and impiety. In pressing him, More was highlighting the moral absurdity of the view. Descartes' response—suggesting animals might have "sensation" without "thought"—was an attempt to mitigate the outrage without surrendering the core metaphysical claim that animals lack an immortal, rational soul. He attempts to have it both ways: maintaining the machine ontology for scientific purposes while offering a linguistic concession to moral critics. But philosophically, it does not hold. When Descartes writes systematically, such as in the *Discourse on Method* or the *Passions of the Soul*, the language of "unconscious sensation" disappears. He describes animal cries not as expressions of pain, but as the creaking of a clockwork mechanism, driven by the flow of animal spirits. To interpret the letters as overriding the systematic works is to privilege Descartes' apologetics over his ontology. The Strong Reading remains the only one that preserves the internal consistency of Cartesian dualism.

  If we accept that Descartes truly denied animals any capacity for feeling, the question of his culpability for the cruelty his view encouraged becomes clearer. It is historically debated whether Descartes himself practiced vivisection or treated animals poorly; anecdotes suggest he kept a dog named Monsieur Grat and treated him with some affection. However, personal behavior is less significant than the conceptual license his philosophy granted. By categorizing animal screams as the mere noise of a broken spring, Descartes removed the primary epistemic barrier to abuse: the recognition of suffering. If a scientist in the 17th century accepted Cartesian physics, they were not ignoring the animal's pain; they were logically compelled to deny its existence.

  Therefore, Descartes bears significant intellectual responsibility for the culture of cruelty that followed, even if he did not intend it. He constructed a metaphysical system where the evidence of the senses (the screaming dog) was overruled by a priori reasoning (the dog has no mind). This did not merely "allow" for cruelty; it sanitized it. The vivisectionists who followed in his wake were not acting against Cartesianism but were often applying it rigorously. Descartes' blame lies not in personal malice, but in the construction of a worldview that rendered empathy toward animals a category error.

  In conclusion, while the correspondence with Henry More offers a tempting avenue for exonerating Descartes from the charge of denying animal sensation, this "softened" reading is incoherent within the framework of his own dualism. Because Descartes defines sensation as a mode of conscious thought, and denies animals thought, he must logically deny them sensation. The letters represent a pragmatic wobble, not a philosophical solution. By committing to the Strong Reading, we acknowledge that Descartes did view animals as insensate machines. This confirms that his legacy regarding animal cognition is not one of misunderstood nuance, but of a rigorous, systematic exclusion that provided the metaphysical justification for centuries of disregard toward the inner lives of non-human beings.
