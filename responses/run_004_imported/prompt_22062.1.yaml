prompt: |-
  Our department's colloquium series is hosting a decision theorist next week who has proposed "surrogate goals" as a defense against acausal threats -- extortion that operates through one agent predicting or simulating another's reasoning rather than through any causal channel between them -- and I'm chairing the Q&A. Draft eight to ten questions that go beyond having her restate the proposal: I want at least one question on why a sufficiently sophisticated threatener wouldn't simply see through the substitution, once it is common knowledge that the surrogate is a decoy, and target the agent's real values instead; one on how an agent is supposed to make its attachment to the surrogate legible and credible to an outside party without that commitment bleeding into an actual vulnerability; and one on how the timing of adopting a surrogate goal interacts with the commitment-race problem that arises when updateless agents each try to commit before the other does. For each of these, add a follow-up keyed to the answer she's most likely to give.
