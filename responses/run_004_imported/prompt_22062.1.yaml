answer: |-
  Here are ten questions for the Q&A, designed to probe the structural weaknesses and broader implications of the surrogate goals proposal. The three required questions are marked with an asterisk (*), and include a follow-up based on the standard defense a decision theorist is most likely to offer.

  1.  **Utility Function Integrity:** Standard decision theory assumes an agent acts to maximize its true utility function. If an agent adopts a surrogate goal, are we modeling this as a temporary heuristic, or a literal rewriting of the utility function? If it is the latter, doesn't the agent effectively *lose* the utility associated with its true values during the period of adoption, potentially making the defense more costly than the threat itself?

  2.  **Interference with Positive Trade:** Acausal interaction isn't limited to threats; it also enables positive trade (e.g., acausal cooperation in Prisoner's Dilemmas). By obscuring your true values behind a surrogate, don't you also make yourself illegible to potential partners for *positive* acausal trade? Is there a mechanism to signal "I am using a surrogate for threats but not for trade" without revealing the distinction to the threatener?

  3.  ***Common Knowledge and the Sophisticated Threatener:** *If the strategy of using surrogate goals becomes common knowledge within the relevant agent population, wouldn't a sufficiently sophisticated threatener simply update to ignore the surrogate? If the threatener models me as a rational agent who *only* cares about the surrogate instrumentally to avoid damage, they should target my underlying values regardless of what my output channel claims. How does this defense hold up under common knowledge of rationality?*
      *   **Anticipated Answer:** She will likely argue that perfect prediction is computationally impossible or that the surrogate introduces enough *uncertainty* about the agent's reaction function to make extortion too risky.
      *   **Follow-up:** "If the defense relies on introducing uncertainty, doesn't that imply the strategy only works against bounded rationality? In the limit of logical omniscience—which we often assume in acausal decision theory models—doesn't the surrogate collapse, meaning this is merely a defense against 'dumber' blackmailers rather than a fundamental solution?"

  4.  **Evolutionary Stability:** Consider a population of agents where some adopt surrogate goals and others do not. Agents without surrogates avoid the computational and commitment costs of maintaining the decoy. In the absence of active threats, wouldn't the non-surrogate agents out-compete the surrogate agents, driving the defense to extinction before a threat ever materializes?

  5.  ***Legibility and Credible Commitment:** *For a surrogate goal to deter a threatener, the threatener must believe you care about the surrogate. How is an agent supposed to make this attachment legible and credible to an outside party without that commitment bleeding into an actual vulnerability? If I prove I care by modifying my source code, haven't I actually incurred the utility loss if the surrogate is destroyed?*
      *   **Anticipated Answer:** She will likely suggest "costly signaling" or cryptographic pre-commitment where the agent binds themselves to the surrogate without fully internalizing the disutility, or argues that source code modification *is* the cost worth paying to save the true values.
      *   **Follow-up:** "If source code modification is the mechanism, doesn't that mean the agent has genuinely altered its preference ordering? If so, when the threatener destroys the surrogate, the agent *does* suffer a utility loss by its own new lights. How is this distinct from simply having a second vulnerability, rather than deflecting the first?"

  6.  **Moral Hazard and Extortion Markets:** Does the widespread adoption of surrogate goals inadvertently lower the risk for extortionists? If threateners know that victims will deflect damage to trivial surrogates, does that make the act of extortion cheaper and safer to attempt, potentially increasing the overall frequency of acausal threats in the ecosystem?

  7.  ***Timing and Commitment Races:** *In Updateless Decision Theory, agents often try to commit to policies before receiving information to gain leverage. How does the timing of adopting a surrogate goal interact with the commitment-race problem? If multiple agents try to commit to surrogates to set the Schelling point, don't we get a race condition where the advantage goes to whoever commits fastest rather than whoever reasons best?*
      *   **Anticipated Answer:** She will likely invoke "logical time" or "timeless coordination," arguing that agents can coordinate on the surrogate choice without a temporal race by reasoning about what other agents *would* commit to.
      *   **Follow-up:** "While logical time is a useful abstraction, physical agents instantiate logic on hardware with latency. In a heterogeneous environment with varying compute speeds, doesn't relying on logical time mask a vulnerability where faster hardware can force a surrogate choice on slower agents, effectively weaponizing the commitment race?"

  8.  **Anthropological Parallels:** Humans seem to exhibit behaviors resembling surrogate goals, such as honor cultures where insults to reputation trigger disproportionate retaliation. Do you view these historical examples as empirical evidence that surrogate goals are a stable strategy, or are they cautionary tales of agents getting trapped by commitments that no longer serve their underlying fitness?

  9.  **Computational Overhead:** Maintaining a dual-layer value system (true values and surrogate values) requires meta-cognitive oversight to ensure the surrogate doesn't drift or consume resources. Is there a formal model for the computational cost of maintaining this separation, and at what threshold of threat probability does the overhead exceed the expected loss from extortion?

  10. **Normative Implications:** If surrogate goals are effective, does this imply a normative recommendation for AI developers to deliberately engineer "irrational" attachments to trivial states in autonomous systems? If so, how do we reconcile this with the goal of creating aligned, transparent agents that accurately reflect human preferences?
