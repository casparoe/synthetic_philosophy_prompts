      *   *What is it?* An agent modifies their utility function (or pretends to) to care about something trivial or unrelated (the surrogate) instead of their real values, hoping a threatener will target the surrogate instead.
      *   *Why?* To minimize damage if acausal extortion occurs. If the threatener demands you do $X$ or they destroy your values, you want them to destroy something you don't care about.
      *   *The Problem:* Acausal threateners are usually modeled as super-intelligent predictors. If they know you're faking, they target the real values. If you actually care about the surrogate, you've changed your values (potentially costly).

  3.  **Drafting the Specific Required Questions:**

