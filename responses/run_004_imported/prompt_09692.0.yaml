prompt: |-
  Kind of a random question but it's been on my mind since we hit the unit on psychiatric classification in my philosophy of psychiatry class. My friend got diagnosed with BPD about a year ago and honestly it's messing with my head a little. Before that she was just kind of intense sometimes, but ever since the diagnosis she's joined a couple online BPD communities, reads about it constantly, and now describes her own moods in phrases straight out of the diagnostic criteria, like "I'm splitting rn." The weird part is she fits the profile way more now than she did before any of this. Everyone in our friend group says thats just confirmation bias, like we're only noticing the behavior now that we have a label for it, but that doesn't feel like the whole story to me, its more like the label itself is doing something rather than just describing what was already there. Is my friend group right that this is basically just us noticing things differently after the fact, or does getting diagnosed actually change a person in some deeper way?
