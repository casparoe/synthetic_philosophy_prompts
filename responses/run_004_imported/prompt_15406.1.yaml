          *   *Correction/Nuance:* Technically, Martin focused on the "finkish lack" to show the conditional isn't necessary for the disposition (wire isn't conductive, but would conduct if touched). The "reverse fink" is often attributed to later discussions or elaborations (sometimes Lewis himself discusses the symmetric problem). However, in the context of an undergrad/grad exam, treating finks as breaking the biconditional in both directions is standard and acceptable.
