      *   *Wait, check Sentence 1:* "If Oswald didn't kill Kennedy, someone else did." Since we know Kennedy was killed, the consequent "Someone else did" is actually entailed by "Oswald didn't" + "Kennedy was killed". This makes it logically robust.
