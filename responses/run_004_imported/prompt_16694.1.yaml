      *   **The Solution:** Possible Worlds Semantics (Stalnaker/Lewis). Explain the "nearest world" concept.
      *   **Verdict on Classical Logic:** It's not broken, just specialized. Don't toss it out, just upgrade the toolkit for counterfactuals.
