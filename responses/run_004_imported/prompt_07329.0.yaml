answer: |-
  **Setting:** *A quiet corner of the university garden, late afternoon. The sun is beginning to dip. ELIAS (an Epicurean) sits on a stone bench, watching the light fade. DIANA (a Deprivation Theorist) joins him, holding a copy of Nagel's "Mortal Questions."*

  **Elias:** You've been staring at that page for twenty minutes, Diana. I take it you're still trying to find the flaw in the logic?

  **Diana:** I'm looking for the hinge, Elias. The point where the argument turns. Epicurus seems so airtight. "When we are, death is not. When death is, we are not." It's a perfect disjunction. If I accept his premises, I have to conclude that my own death is literally nothing to me. And yet… every instinct I have screams that dying young is a tragedy.

  **Elias:** Instincts are evolved heuristics, not metaphysical truths. We fear the *process* of dying—the pain, the interruption. But the state of being dead? That is simply the absence of the subject. If there is no "you" to experience the loss, how can the loss be *yours*?

  **Diana:** That's the Existence Condition. You're arguing that for something to be bad for me, I must exist at the time the badness obtains.

  **Elias:** Precisely. Badness must land on a subject. If I am annihilated, there is no target for the arrow of misfortune. To say death is bad for the dead is like saying a haircut is bad for the bald man. It's a category error.

  **Diana:** But consider the counterfactual. If I die tomorrow at twenty, versus dying at eighty. In the first scenario, there is a vast array of experiences—loves, projects, sunsets—that I would have had in the second scenario. The difference between the two lives is real. The goods in the eighty-year life are objectively missing from the twenty-year life.

  **Elias:** Missing for whom?

  **Diana:** For the person who died.

  **Elias:** But that person *isn't*. That's the rub. You are positing a subject who stands outside of time, looking at their own timeline, and sighing over the missing chapters. But no such subject exists. There is only the living person, who ceases. Once they cease, there is no one to bear the deprivation. You've described a tragedy for the *survivors*, or perhaps a tragedy from the "view of the universe," but not a misfortune *for the deceased*.

  **Diana:** This is where I think the Existence Condition is too restrictive. It assumes that all harm must be experiential. That to be harmed, I must *feel* harmed.

  **Elias:** If you don't feel it, who does?

  **Diana:** Think about betrayal. Suppose I go away for a year. While I'm gone, my friends spread malicious lies about me. They ruin my reputation. I never find out. I return, everyone acts kind, I live happily. Was I harmed?

  **Elias:** Your reputation was harmed. Your social standing was damaged. But *you*? You experienced no distress. Your consciousness was untouched.

  **Diana:** Most people would say I *was* harmed. The badness lay in the fact that the truth about my relationships was different than I believed. It wasn't about the experience of the betrayal; it was about the objective fact of it. If harm can be non-experiential in life, why must it be experiential in death?

  **Elias:** A sharp analogy. But there is a difference. In the betrayal case, *you* still exist. You are walking around, the subject of that false reputation. The harm is attached to a living entity. In death, the entity is gone. You are trying to attach a predicate ("harmed") to a null set.

  **Diana:** Am I? Or am I saying that the subject of a life is not just a momentary consciousness, but a trajectory? I am not just a point; I am a line. If the line is cut short, the line itself is diminished, even if the endpoint feels no pain. The subject of the misfortune is the person-as-a-whole, not the person-at-a-moment.

  **Elias:** That sounds poetic, Diana, but metaphysically risky. If the "person-as-a-whole" is the subject, then where does it exist? It doesn't exist after death. So you are saying a non-existent entity suffers a loss.

  **Diana:** I'm saying the *fact* of the loss is timeless. It is true *now* that if you die tomorrow, you lose the future goods. That truth doesn't require you to be conscious of it to be true.

  **Elias:** Let's press that. Let's bring in Lucretius. He grants your deprivation point for the sake of argument, but he asks: Look back. Think of the time before you were born. That is an eternity of non-existence. You were deprived of all the goods of the Roman Empire, the dinosaurs, the formation of the stars. Does that trouble you?

  **Diana:** No.

  **Elias:** Why not? If non-existence is a deprivation of goods, prenatal non-existence deprived you of just as much as postmortem non-existence will. By your logic, your birth was just as much a misfortune as your death will be. Yet you do not mourn the time before you were born.

  **Diana:** The Symmetry Argument. It's the strongest challenge to my view.

  **Elias:** It should be fatal. The state of non-existence is identical in both directions. If one is harmless, the other must be.

  **Diana:** But the *direction* matters. Time has an arrow. Possibility lies in the future, not the past. When I die, I am losing *possible* futures. When I was not born yet, those futures were not yet open to me. The prenatal time is a time where I *could not* have existed. The postmortem time is a time where I *could have* existed, but won't.

  **Elias:** "Could have." There it is. The modal fallacy. Once you are dead, you *cannot* exist either. The future where you continue is not a real possibility once you are dead; it's a counterfactual. Just as the past where you were born earlier is a counterfactual. Why is the counterfactual future more real than the counterfactual past?

  **Diana:** Because of the orientation of the subject. I move toward the future. My desires, my projects, my biology are all oriented forward. To cut off the future is to frustrate the vector of my life. To look at the past is to look at a closed door.

  **Elias:** But who is doing the looking? Again, you need a subject. If I am dead, I have no vector. I have no orientation. You are projecting the perspective of the *living* onto the *dead*. You are standing in the garden, alive, imagining yourself dead, and feeling the loss. But that feeling belongs to the living Elias, not the dead one.

  **Diana:** I admit, Elias, this is the pressure point. If I hold strictly to your metaphysics—where only the present conscious subject is real—then you win. Death is nothing. But I suspect your metaphysics is too thin to capture what we value. We don't value moments of consciousness; we value *lives*. And a life is a narrative structure.

  **Elias:** And if it is a narrative, it must be read by someone. If the reader is gone, the story isn't "sad," it just *ends*.

  **Diana:** But the *quality* of the story is affected by the ending. A symphony cut off in the second movement is objectively worse than one completed, even if the instruments don't feel regret.

  **Elias:** Worse for whom? For the audience? Yes. For the composer? Perhaps. But for the symphony itself? The symphony doesn't care. If I am the symphony, and I cease, I do not care.

  **Diana:** You keep returning to "care." You equate "bad for X" with "X cares about it." I am arguing that "bad for X" means "X is deprived of what is good for X." I can be deprived of something I don't know I want. A child deprived of education is harmed, even if they are happy playing in the mud.

  **Elias:** But the child *exists* to receive the harm later, or to be remediated. The dead do not.

  **Diana:** *[Pauses]* This is where I have to concede some ground. I cannot locate the harm *in* the time after death. There is no experience there. I have to argue that the harm is located *at the moment of death*, or perhaps distributed across the life, as a property of the life's shape.

  **Elias:** Distributed across the life?

  **Diana:** Yes. The badness of death isn't a state I enter; it's a feature of the life I led. A life cut short is a lesser good than a life fulfilled. The misfortune attaches to the biographical whole.

  **Elias:** That is a retreat from the common-sense view, Diana. Common sense says, "It is bad *to die*." You are now saying, "It is bad *to have lived a short life*."

  **Diana:** Is there a difference?

  **Elias:** A profound one. If it is bad *to have lived a short life*, then the tragedy is complete the moment you die. There is no lingering misfortune. But Lucretius would still ask: Why is a short life worse than a long one if the endpoint is the same nothingness? If the total sum of experience is what matters, then a life of 20 happy years is just a smaller sum, not a tragedy. It's only a tragedy if you assume we are *owed* more time.

  **Diana:** We aren't owed time. But we are creatures who project. The tragedy is the frustration of that projection.

  **Elias:** And I say that projection is an illusion of the living. Look, Diana. I don't want to win on technicalities. I want peace. If I believe your view, I must fear the cessation of my projects. I must view the future as a thief. If I believe my view, I see the boundary of my life as a natural limit, like the edge of a map.

  **Diana:** But doesn't your view drain life of its stakes? If death is nothing, why rush to finish the project? Why love deeply, if the loss of the lover is "nothing to them"?

  **Elias:** We love because we are here. The wine is sweet not because we fear the bottle will empty, but because we are drinking. Your view makes death a shadow that darkens the wine. Mine removes the shadow so you can taste the vintage.

  **Diana:** But the shadow is real, Elias. The deprivation is real. If I die tomorrow, I lose the chance to finish this conversation. That is a loss of a good. To deny it is to deny the value of the conversation we are having now.

  **Elias:** I deny that the loss is *mine* once I am gone. I grant that it is a loss for *you*, and for the world. But for me? I am the space where the loss does not land.

  **Diana:** *[Sighs]* We are at an impasse. It comes down to this: Do we define the "self" as the conscious experiencer in the present moment? If so, you are right. Death is the end of the subject, so no subject is harmed. Or do we define the "self" as a temporally extended entity with interests that transcend the present moment? If so, I am right. Death violates those interests.

  **Elias:** And neither definition can be proven without begging the question.

  **Diana:** Exactly. If I assume interests can survive the subject, I win. If you assume interests require a present subject, you win.

  **Elias:** So the debate isn't about death. It's about what kind of beings we are.

  **Diana:** It seems so. Are we containers for experiences, or are we authors of narratives?

  **Elias:** If we are authors, the book ends. The author doesn't suffer because the book stops.

  **Diana:** But the author *wants* the book to continue. And that want is part of the book.

  **Elias:** *[Stands up, looking at the sunset]* Then perhaps the truth is in the tension. Death is nothing to the dead, as I say. But the *approach* of death is something to the living, as you say. And since we are always living until we are not, your view governs our life, while mine governs our end.

  **Diana:** A partitioned truth?

  **Elias:** A practical one. I will use my view to cure my fear of the state of being dead. You may use yours to justify the value of preserving life.

  **Diana:** I can accept that. Though I still maintain that if you die before dessert, you've been cheated.

  **Elias:** *[Smiles]* And I maintain that the one who is cheated cannot file the complaint. Shall we go get the dessert anyway? While the subject of the experience still exists?

  **Diana:** Yes. Before the deprivation becomes actual.

  *[They walk toward the cafeteria, the argument unresolved, but the value of the present moment mutually acknowledged.]*
