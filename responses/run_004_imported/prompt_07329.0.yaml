          *   Nagel: Deprivation Account (Death is bad because it deprives us of life's goods).
          *   The Existence Condition/Requirement (Badness requires an existing subject).
          *   Lucretius's Symmetry Argument (Prenatal vs. Postmortem non-existence).
      *   **Format:** Dialogue between an Epicurean and a Nagel-style Deprivation Theorist.
      *   **Tone:** Evenly matched, genuine engagement, no easy wins, acknowledging pressure points and lack of tidy resolution.
      *   **Specific Constraint:** The Deprivation Theorist must be pressed hard on the Existence Condition and Symmetry Argument. The Epicurean must reckon with the best replies to their challenges.

  2.  **Character Conception:**
