          *   Diana counters with the Deprivation Account (Nagel's core thesis).
          *   *Check:* Are they listening? Yes, Diana acknowledges the logic but challenges the premise of "badness."

      *   **Round 2: The Existence Condition (The Hardest Hit).**
          *   Elias presses: *Who* is suffering the loss? If I don't exist, I can't be harmed.
          *   Diana needs a robust reply. She can't just say "it's obvious." She needs to argue about *timeless* truths or the nature of the subject. Nagel's idea that the subject is a "continuant" across time is useful here.
          *   Elias counters: That stretches the concept of "harm" too thin.
          *   *Pressure Point:* Diana admits this requires rethinking "harm" as not necessarily experiential.

      *   **Round 3: Lucretius's Symmetry Argument.**
