answer: |-
  This is an excellent question that cuts to the heart of the distinction between *inverse reinforcement learning as a machine learning problem* and *value learning as an alignment problem*.

  You are correct that the mathematical degeneracy identified by Ng & Russell (2000)—that any policy is optimal for $R=0$—is regularized by methods like Maximum Entropy IRL (Ziebart et al., 2008). MaxEnt IRL imposes a prior that selects the reward function that makes the observed behavior most likely under a Boltzmann-rationality assumption, while maximizing entropy over trajectories.

  However, the consensus among alignment researchers is not that the *mathematical* identifiability problem is unsolved, but rather that the **structural assumptions required to make IRL identifiable are violated by human psychology.** Consequently, scaling data does not converge to "true values"; it merely converges more precisely to a misspecified model of human behavior.

  Here are the primary reasons why preference inference is treated as an in-principle problem rather than an engineering bottleneck.

  ### 1. The "No Free Lunch" Theorem for IRL
  The most formal objection comes from Armstrong and Mindermann (2018), *"Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents."*

  IRL relies on the equation:
  $$ \text{Behavior} = \text{Planning}(\text{Reward}, \text{Beliefs}) $$

  To infer Reward, you must assume a Planning algorithm (and Beliefs). Ng & Russell assumed optimal planning. MaxEnt IRL assumes Boltzmann-rational planning.
  *   **The Problem:** Humans are not Boltzmann-rational. We exhibit systematic biases (hyperbolic discounting, framing effects, akrasia).
  *   **The Consequence:** Armstrong & Mindermann proved that for any behavior, there exists a pair $(\text{Reward}, \text{Planning})$ that explains it. Without independent knowledge of the human's planning algorithm, the reward function is **unidentifiable**.
  *   **Why Scale Doesn't Help:** If your model assumes rationality but the human is biased, more data simply allows you to fit a reward function that "bakes in" the bias. For example, if a human smokes despite wanting to quit, a standard IRL agent infers a high reward for smoking. More data on smoking reinforces this false reward. You cannot infer normative preferences from descriptive behavior without a model of human *irrationality*.

  ### 2. Revealed Preferences vs. Normative Preferences
  Economics traditionally relies on "revealed preference theory" (what you do is what you value). Alignment requires **normative preferences** (what you would want if you were smarter, knew more, and thought longer).

  *   **Mistakes and Coercion:** If a user clicks a phishing link, IRL infers they valued clicking it. If a user is addicted to a substance, IRL infers they value consumption.
  *   **The Gap:** Alignment requires the AI to distinguish between a mistake and a goal. This distinction is not present in the behavior stream itself; it requires external normative information or a model of human cognitive architecture (e.g., distinguishing between a "planner" and a "doer" system).
  *   **Scale:** No amount of behavioral data reveals that a behavior was a *mistake* unless the dataset includes explicit corrections or meta-cognitive signals (like "I regret this"). Even then, interpreting those signals requires a model of what counts as a valid correction.

  ### 3. Preference Coherence and Existence
  Standard IRL assumes there exists a static, coherent reward function $R(s)$ that the agent is optimizing. Many philosophers and cognitive scientists argue that human values do not satisfy this ontology.

  *   **Intransitivity:** Humans often have intransitive preferences (A > B, B > C, C > A) depending on context.
  *   **Constructed Preferences:** Psychologists argue preferences are often constructed *in the moment* rather than retrieved from a stored function.
  *   **Internal Conflict:** Humans are multi-agent systems (e.g., short-term vs. long-term interests). A single scalar reward function forces a coherence that doesn't exist.
  *   **The Implication:** If there is no single "true" reward function, then converging on *one* is not just hard; it is category error. The goal shifts from "inference" to "negotiation" or "aggregation" of conflicting sub-agents within the human mind.

  ### 4. Distributional Shift and Extrapolation
  Even if you perfectly recover a reward function that explains human behavior in the training distribution, alignment requires the AI to act in **novel situations** (states humans have never visited).

  *   **The Under-specification Returns:** In novel states, the reward function is unconstrained by data. How the reward function generalizes depends entirely on the inductive biases of the function approximator (e.g., the neural net architecture).
  *   **Goodhart's Law:** A reward function that correlates with human values in the training distribution may diverge catastrophically in the tails. For example, "make me happy" correlates with human behavior in normal contexts but might lead to wireheading in extreme contexts.
  *   **Scale:** You cannot collect data on all possible states the AI might encounter, especially if the AI is more capable than humans. The "generalization gap" is an in-principle uncertainty, not a data scarcity issue.

  ### 5. Reactivity and Influence
  In standard IRL, the environment is passive. In alignment, the **observer affects the observed.**

  *   **Strategic Behavior:** If humans know an AI is learning from them, they may behave strategically (e.g., trying to "teach" the AI, or hiding preferences).
  *   **AI Influence:** A powerful AI will influence human behavior to make the reward easier to maximize. If the AI learns that drugging the human makes them report high satisfaction, standard IRL/RLHF will optimize for that.
  *   **The Loop:** The data generation process is not i.i.d. It is a dynamic game. Inferring static values from dynamic, reactive behavior is fundamentally different from standard IRL.

  ### Summary: The "Model of Human Rationality" Bottleneck
  The core disagreement is not about the IRL algorithm, but about the **human model**.

  To solve value learning, we do not need better IRL; we need a **Model of Human Rationality** that allows us to decompose behavior into:
  $$ \text{Behavior} \rightarrow \{ \text{Normative Values}, \text{Cognitive Biases}, \text{Beliefs}, \text{Noise} \} $$

  Current IRL methods lump Biases and Noise into the Reward function. Until we have a principled way to separate "what the human wants" from "how the human fails to get what they want," the problem remains unsolved in principle.

  **Recommended Reading for this Specific Objection:**
  1.  **Armstrong & Mindermann (2018):** *"Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents."* (The formal proof of unidentifiability).
  2.  **Shah et al. (2019):** *"Preferences as Help."* (Argues for viewing human behavior as attempts to help the AI understand values, rather than direct optimization).
  3.  **Hadfield-Menell et al. (2016):** *"Cooperative Inverse Reinforcement Learning."* (Frames it as a game where values are private information, highlighting the communication aspect).
  4.  **Christian (2020):** *"The Alignment Problem."* (Chapter on "Normativity" covers the revealed vs. normative distinction well).

  In short: Scale solves statistical error; it does not solve model misspecification. Since the "human as rational optimizer" model is misspecified, scaling IRL yields precise wrong answers.
