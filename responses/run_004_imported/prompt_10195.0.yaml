      *   **Question:** Why do alignment researchers still treat preference inference as an *in-principle* unsolved problem rather than just an engineering challenge?
      *   **Underlying Assumption:** Human behavior is generated by a single, consistent reward function that can be recovered given enough data and the right algorithm.

  2.  **Evaluate the Validity of the Premise:**
      *   *Is the degeneracy problem solved?* Technically, MaxEnt IRL and similar methods (e.g., GAIL, adversarial IRL) pick *a* reward function from the feasible set. They resolve the *mathematical* under-specification by adding regularization/priors.
      *   *Does this mean we recover "true" values?* No. It means we recover a reward function that explains the data *under the assumption of rationality*.
      *   *Is scale the only bottleneck?* This is the crux of the disagreement. Alignment researchers argue that human behavior is not generated by a stationary, consistent reward function in the way IRL assumes.

  3.  **Brainstorm Key Counter-Arguments (Why it's not just scale):**
      *   **Bounded Rationality & Systematic Biases:** Humans aren't Boltzmann-rational. We have cognitive biases (akrasia, hyperbolic discounting, framing effects) that look like "sub-optimal" behavior under a single reward function but are actually structural features of human cognition. IRL often conflates beliefs, biases, and rewards.
      *   **The "No Free Lunch" Theorem for IRL:** Armstrong & Mindermann (2018) showed that without assumptions about human rationality, you can't distinguish between the reward function and the planning algorithm. Any behavior can be explained by *any* reward function if you assume a complex enough planning algorithm.
      *   **Context-Dependence & Constructed Preferences:** Preferences aren't always pre-existing. They are constructed in the moment, context-dependent, and often inconsistent (preference reversals). There might not be a "true" $R(s)$ to recover.
      *   **Multi-Objective & Hierarchical Values:** Human values are hierarchical, conflicting, and context-sensitive. A single scalar reward function might be the wrong ontology.
      *   **The "Off-Distribution" Problem:** Training on observed behavior only covers a tiny slice of state space. When the AI acts in novel situations (which it will, if it's powerful), the extrapolation of the reward function is unconstrained by data. This is the "inner alignment" or "generalization" problem.
      *   **Influence vs. Inference:** The AI's presence changes human behavior (reactivity). Also, humans can be manipulated.
      *   **Normative vs. Descriptive:** Just because someone *does* something doesn't mean they *value* it (e.g., addiction, coercion, mistake). IRL recovers revealed preferences, not necessarily normative preferences.

  4.  **Structure the Response:**
