      *   **Key Argument 2: Revealed vs. Normative Preferences:** Distinguish between what people do (addiction, mistakes) and what they want. IRL gets the former; alignment needs the latter.
      *   **Key Argument 3: Preference Coherence:** Humans are not coherent agents. We have internal conflict. A single reward function might be the wrong target.
