      *   *Van Fraassen's Bad Lot:* The true hypothesis isn't in the set. Adelaide assumes the truth *is* in the set of plausible narratives she constructs.
      *   *The Twist:* To make it a detective story failure, Adelaide needs to accuse someone innocent because their guilt makes a "better story," while the truth is messy, accidental, or involves someone outside the suspect pool (or a mechanism no one considered).
      *   *Decision:* Let's combine them. The "Lovely" theory points to a specific suspect with motive and means in a symmetrical way. The "True" theory is mundane, asymmetrical, or involves a "Bad Lot" scenario (the real cause wasn't considered). Let's go with a "Bad Lot" scenario where the *mechanism* of death/crime was misunderstood, leading to a false attribution of agency.

