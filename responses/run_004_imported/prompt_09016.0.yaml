      *   *Why is this "Likeliest vs Loveliest"?* The Accident theory is "Likeliest" (people make mistakes, chemists store things wrong), but the Murder theory is "Loveliest" (explains the diary, the burning, the fingerprints in a cohesive narrative of guilt).
