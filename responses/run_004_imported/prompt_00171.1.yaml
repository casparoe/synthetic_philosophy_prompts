answer: |-
  look, first off we have to remember that Selby-Bigge's edition (the 1902 Clarendon one) really cemented the reading of Hume as the great skeptic of reason, especially in the Intro to the *Enquiries*. if you take that Hume—the one who thinks reason is inert, who thinks causality is just custom in the mind—then the discursive dilemma (the List/Pettit stuff) isnt really a surprise to him. its almost expected.

  the paradox shows that you can have perfectly rational individuals and end up with an irrational collective outcome just by aggregating judgments via majority rule. a rationalist would panic here. they'd say "oh no, the system is broken, how do we fix the logic?" but Hume? Hume would probably smirk. he'd say this vindicates his whole point about the limits of abstract reasoning when it tries to govern human affairs.

  in the *Treatise*, Book 3, Hume spends all that time on justice as an "artificial virtue." he says justice isn't something we discover by pure reason, its a convention we invent because we need stability. the discursive dilemma basically proves that you cant derive a consistent collective will just by summing up individual rationalities. the "general will" or the "voice of parliament" isnt a logical entity. so when List and Pettit show the inconsistency, Hume would say: "of course. you're treating a political body like a geometric proof."

  would he try to dissolve the paradox? in a way, yes. but not by fixing the voting math. he'd dissolve it by shifting the ground from *reason* to *sentiment* and *utility*. the problem assumes that logical consistency is the highest good for a state. Hume would deny that. the highest good is peace, order, and the satisfaction of our passions (mostly property and security). if the court or parliament reaches a verdict that is logically inconsistent but everyone accepts it because the *authority* is established, then for Hume, it works. the inconsistency is a theoretical problem for philosophers, not a practical one for society.

  remember Hume's point on the British Constitution—it's a messy mix of monarchy, aristocracy, and democracy, full of contradictions if you analyze it strictly, but it works because of custom and allegiance. the discursive dilemma is just a formal version of that messiness.

  so, reaction?
  1. **Vindication:** it proves reason cant bind a multitude. the "mind of the state" is a fiction. Selby-Bigge's notes on the *Enquiry* emphasize that we act on belief/habit, not logical deduction. the paradox shows deduction failing at scale.
  2. **Dissolution:** the paradox only matters if you think reason should rule. since reason is the slave of the passions, the collective inconsistency doesnt matter as long as the *passion* for order is satisfied. we need a sovereign or a final decider not to ensure logical purity, but to stop the endless disputation.

  Hume would probably say the literature is too obsessed with the "rationality" of the collection. he'd ask: does it produce utility? does it maintain the convention of justice? if yes, the logical glitch is irrelevant. he might even say the dilemma shows why we need "artificial" structures (like a judge with casting vote, or a monarch) to override the aggregation problem. not because the judge is smarter, but because the *decision* is needed more than the *consistency*.

  also, theres a hint of this in his essays on the ideal republic. he knows factions and voting lead to weird outcomes. he prefers mixed government to check these things. the discursive dilemma is just another reason why simple majoritarianism is dangerous—something Hume already suspected because he distrusted pure democracy (mob passion).

  so yeah, he wouldn't be bothered. he'd say List and Pettit are discovering the limits of reason that he already mapped out. the "collective agent" is an artifact, not a natural object, so it doesnt have to obey the laws of individual logic. it obeys the laws of convention. if the convention holds, the logic can be messy.

  (quick note: selby-bigge's footnotes on the *Treatise* often point out where Hume is anticipating later utilitarianism. this fits. the utility of the verdict outweighs the logical consistency of the premises.)

  basically: the paradox is real, but its not a crisis. its a feature of artificial bodies. Hume tells us to stop expecting institutions to be rational agents and start treating them as conventions for managing passion. end of story.
