answer: |-
  The hotel bar was dim, the ice in Elias's whiskey long since melted. He leaned forward, tapping a napkin with a pen.

  "Face it, Mara. Solomonoff induction closes the book. For two centuries, Occam's Razor was aesthetic advice. Now? It's a theorem. The shortest program on a universal Turing machine is the best hypothesis. Hume's gap is bridged by bits."

  Mara swirled her pinot noir, unimpressed. "You're confusing 'defined' with 'justified.' Kolmogorov complexity doesn't rescue Occam; it relocates the subjectivity. You say 'universal Turing machine,' I ask 'which one?' The invariance theorem only says the difference between my machine and yours is an additive constant. It doesn't say that constant is zero."

  "It doesn't need to be zero," Elias countered. "It needs to be fixed. $K_1(x) - K_2(x) \leq c$. Once you have enough data, the complexity of the pattern dwarfs the constant. The noise washes out. In the limit, all reasonable UTMs converge on the same truth."

  Mara set her glass down hard. "In the limit. Elias, we are not asymptotic beings. We live in the finite. If I choose a UTM where 'grue' is a primitive instruction and 'green' requires a complex subroutine, then for any dataset we will *ever* actually observe, 'grue' is the simpler hypothesis. The constant doesn't shrink. It can swamp the evidence."

  "That's a pathological machine," Elias said, waving the pen. "You're rigging the compiler."

  "Am I?" Mara leaned in. "Or did you just rig yours? When you say 'pick a sensible machine,' what do you mean? You mean one where simple arithmetic and basic physics are easy to encode. But that's exactly the bias Occam was supposed to justify! You're smuggling in your prior judgment about what counts as 'natural' under the guise of machine selection. It's Goodman's *grue* problem wearing a compiler as a costume."

  Elias paused, taking a sip of the watery whiskey. "Okay. But even if the baseline is subjective, the *method* is rigorous. We've formalized the structure of induction. We know *why* we prefer simplicity. It's not magic; it's compression."

  "Is it?" Mara pressed. "If the justification for picking Machine A over Machine B is 'Machine A makes the true laws of physics simpler,' you're reasoning in a circle. You need the truth to pick the machine, but you need the machine to find the truth. The invariance theorem tells you the disagreement is bounded, but for finite human science, that bound is the whole ballgame."

  "So we're stuck?" Elias asked, deflating slightly. "We just admit induction is a biological habit?"

  "I'm saying the math is beautiful, but it doesn't do the metaphysical heavy lifting you want. It tells you how to be consistent, not how to be right. You haven't solved Hume; you've just given him a programming language."

  Elias sighed, signaling the bartender for another round. "Well. At least the code compiles."

  Mara clinked her glass against his. "Until it throws a runtime exception. Cheers."
