      *   **Goal:** 8-9 interview questions that challenge/strain the Simulator Picture, avoiding surface-level repetition.
      *   **Specific Areas to Probe:**
          *   The practical irrelevance of the distinction (users talk to simulacra).
          *   The effect of RLHF/Fine-tuning (base model vs. aligned model).
