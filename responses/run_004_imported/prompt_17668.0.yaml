      *   *Point 1: The Nature of the Paradox.* It's about *price*, not just choice. EV says price = $\infty$. Bernoulli needs to show price = finite. $Y$ is utils, $X$ is ducats. You can't pay in utils.
      *   *Point 2: $X$ as Certainty Equivalent.* Define it clearly. It operationalizes the utility into market terms.
