      *   *Accuracy:* The philosophical distinction regarding causation by omission is real and relevant to tort law (negligence). I need to represent the theories accurately.

  3.  **Deconstruct the Philosophical Debate:**
      *   **Process/Transference Theories:** Causation requires a physical flow of energy or a physical process connecting cause to effect. An omission (nothing happening) has no physical substance. Therefore, strictly speaking, the *absence* of turning didn't kill him; the *ulcer/infection* did.
      *   **Counterfactual Theories:** Causation is about dependence. "If X had not happened, Y would not have occurred." If the staff *had* turned him, he *would not* have died. Therefore, the failure to turn is a cause.
      *   **Normative/Contextual Theories:** Causation isn't just physics; it's about expectations and duties. In a care home, turning patients is part of the "normal course of events." Deviating from that norm makes the omission causal.

