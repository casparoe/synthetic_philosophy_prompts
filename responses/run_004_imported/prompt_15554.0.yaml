answer: |-
  You are absolutely right to be suspicious of the hyphenated label. In contemporary philosophy of science, conflating Duhem and Quine is often treated as a beginner's mistake, precisely for the reasons you've identified. Larry Laudan famously declared the "Duhem-Quine Thesis" dead in 1990, arguing that it conflates two distinct arguments with different scopes and implications.

  For your comprehensive exams, disentangling these two is crucial. Below is a direct comparison structured around your specific questions regarding scope, rationality, and the technical evolution of underdetermination.

  ### 1. Scope: Physics vs. The Web of Belief

  The most immediate difference lies in the domain of application.

  **Duhem: Methodological Holism in Physics**
  In *The Aim and Structure of Physical Theory* (1906), Duhem's holism is restricted and specific.
  *   **Domain:** He explicitly confines his thesis to **physics**. He argues that chemistry and biology (at the time) were more classificatory or morphological and did not rely on the same dense network of abstract theoretical hypotheses to generate predictions.
  *   **Logic and Math:** Crucially, Duhem **excludes** logic and mathematics from the holistic web. For Duhem, mathematical deduction and logical principles are certain. When a prediction fails, the uncertainty lies in the physical hypotheses and the auxiliary assumptions (instrumentation, background conditions), not in the logical connectives used to derive the prediction.
  *   **The Argument:** His point is about the **logic of falsification**. You cannot test a hypothesis $H$ in isolation; you test $H$ + Auxiliaries $A$. If the prediction $P$ fails, logic tells you only that $(H \land A)$ is false, not which conjunct is to blame.

  **Quine: Semantic/Epistemological Holism**
  In "Two Dogmas of Empiricism" (1951), Quine radicalizes Duhem's insight into a universal epistemological principle.
  *   **Domain:** Quine's "web of belief" encompasses **the whole of science**. There is no principled boundary between physics, psychology, or the social sciences.
  *   **Logic and Math:** Quine explicitly **includes** logic and mathematics. He argues that the laws of logic are simply central strands in the web, highly entrenched due to their utility, but revisable in principle (e.g., his later suggestion that quantum mechanics might motivate a revision of distributive laws in logic).
  *   **The Argument:** Quine collapses the analytic/synthetic distinction. For Quine, no statement is immune to revision "come what may." This is not just about testing units (Duhem) but about **meaning and confirmation**. The unit of empirical significance is the whole of science.

  **Comps Takeaway:** Duhem offers a *local* thesis about experimental practice in physics; Quine offers a *global* thesis about the nature of knowledge and meaning.

  ### 2. Rationality: "Good Sense" vs. Pragmatism

  Does underdetermination lead to irrationalism? Both philosophers say "no," but their mechanisms for preserving rationality differ significantly.

  **Duhem: *Bon Sens* (Good Sense)**
  Duhem acknowledges that logic alone cannot dictate which hypothesis to reject when a prediction fails. However, he is not a relativist.
  *   **The Tiebreaker:** He invokes *bon sens* (good sense). This is a form of scientific judgment cultivated by experience. It isn't an algorithm, but it is a rational faculty.
  *   **Criteria:** Scientists use coherence, simplicity, and the likelihood of the auxiliary assumptions to decide where to make the cut.
  *   **Implication:** Theory choice is not logically compelled, but it is **rationally constrained**. Duhem preserves a robust notion of scientific rationality that operates *within* a stable logical framework. He believes that over time, good sense will converge on the theory that best represents the "natural classification" of the world.

  **Quine: Pragmatic Virtues and Naturalism**
  Quine's position is more austere and, some argue, leaves the door open to non-rational factors.
  *   **The Tiebreaker:** Quine relies on **pragmatic virtues**: conservatism (minimizing disturbance to the web), simplicity, and generality.
  *   **Implication:** Because even logic is revisable, the constraints on theory choice are looser than in Duhem. Quine is a naturalist; he believes we should study how humans actually form beliefs (psychology) rather than seeking a "first philosophy" to justify them.
  *   **Rationality:** Quine doesn't think theory choice is *arbitrary*, but he shifts the ground of rationality from "correspondence to truth" (in a strong realist sense) to "efficacy in predicting experience." While Duhem's *bon sens* aims at truth (natural classification), Quine's pragmatism aims at utility. This makes Quine's view more vulnerable to charges of instrumentalism or relativism, though Quine himself remained a scientific realist of a sort.

  **Comps Takeaway:** Duhem saves rationality through judgment (*bon sens*) within fixed logic. Quine saves rationality through pragmatism, but at the cost of making logic itself contingent.

  ### 3. Duhem's Holism vs. Quine's Later Underdetermination (EESW)

  Your third point is the most technically demanding. We must distinguish between Duhem's original argument and Quine's later formulation of the **Underdetermination of Theory by Evidence** (often discussed in *Word and Object* and the essay "On Empirically Equivalent Systems of the World").

  **Is Quine's EESW a natural extension of Duhem?**
  Superficially, yes. Deep down, **no**. They are structurally different arguments.

  1.  **Duhem's Problem (Local/Testing):** Duhem argues that for any *single* experiment, the evidence underdetermines which *part* of the theoretical cluster is false. It is a problem of **attribution**. It does not necessarily imply that there is a rival *total* theory that explains everything equally well.
  2.  **Quine's EESW (Global/Ontological):** Quine's later thesis is stronger. He argues that for any total theory $T$ that fits all possible observational data, there is a logically incompatible theory $T'$ that also fits all possible data. This is a problem of **construction**.

  **Why they are importantly different:**
  *   **Logical Compatibility:** Duhem's holism suggests we can save a hypothesis by adjusting auxiliaries. Quine's EESW suggests we can construct entirely different logical structures that yield the same observational conditionals.
  *   **The Role of Logic:** In Duhem's framework, the competing explanations are usually variations within the same logical space. In Quine's EESW, the competing systems can be logically incompatible (e.g., different ontologies) yet empirically equivalent.
  *   **Translatability:** Quine spent decades wrestling with whether empirically equivalent theories are just "notational variants" of each other. If they are translatable, the underdetermination is trivial. If they are not, it is profound. Duhem did not worry about this; he assumed the goal was a single natural classification.

  **Verdict:** Quine's later treatment is not merely an extension; it is a **radicalization**. Duhem showed that evidence doesn't dictate *revision*; Quine showed that evidence doesn't dictate *selection* between total systems. Quine turned a methodological problem about experimentation into a metaphysical problem about truth and ontology.

  ### Summary for Your Exams

  If you are pressed on the "Duhem-Quine Thesis" in your exams, I recommend the following strategy:

  1.  **Acknowledge the Conflation:** Start by noting that while the label is standard, it obscures vital distinctions (cite Laudan if possible).
  2.  **Distinguish the Theses:**
      *   **Duhem:** Holism of testing (Physics only; Logic exempt). Solved by *Bon Sens*.
      *   **Quine:** Holism of confirmation (Total science; Logic revisable). Solved by Pragmatism.
  3.  **Address Underdetermination:** Clarify that Duhem argued for the impossibility of *crucial experiments* (local underdetermination), whereas Quine argued for the possibility of *empirically equivalent global systems* (global underdetermination).
  4.  **Evaluate Rationality:** Conclude that Duhem preserves a more traditional view of scientific rationality converging on truth, whereas Quine naturalizes rationality, making it a function of pragmatic success within a web that includes logic itself.

  **Suggested Secondary Reading for Comps:**
  *   **Larry Laudan,** "The Demise of the Duhem-Quine Thesis" (Essential for this specific distinction).
  *   **Kyle Stanford,** *Exceeding Our Grasp* (For a modern take on underdetermination that leans closer to Duhem's historical concerns).
  *   **Roger Ariew,** "The Duhem Thesis" (For a detailed exegesis of Duhem's actual text vs. the Quinean interpretation).
  *   **Quine,** "On Empirically Equivalent Systems of the World" (1975) – to see how his view tightened/shifted from "Two Dogmas."

  Your intuition that the label papers over real differences is spot-on. Demonstrating that you understand *how* they differ will show your committee you have moved beyond textbook summaries into genuine critical engagement.
