  ok this is gonna sound super random but in my IB Theory of Knowledge class we got sidetracked onto logic and my teacher brought up this thing called the "problem of logical omniscience" and now i cant stop thinking about it. basically in the classic possible-worlds way of modeling belief, if you believe P and you believe P implies Q, you're automatically stuck believing Q too, and you technically believe literally every tautology, which is obviously not how real minds work. can you give me an actual concrete scenario (not just an abstract P/Q setup, and not the "nobody knows every theorem of math" example, i've heard that one already) where this breaks down in a genuinely surprising way, and then tell me whether something like impossible-worlds semantics or awareness logic actually fixes the problem or just quietly redefines it away?
