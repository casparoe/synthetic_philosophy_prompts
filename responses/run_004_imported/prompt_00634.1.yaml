answer: |-
  Given your background in formal ethics and social choice, I will dispense with introductory definitions of vNM utility or the Pareto principle and focus directly on the structural mismatch between Harsanyi's Aggregation Theorem and the specific epistemic conditions of your committee.

  While the proposal to average vNM utilities is superficially attractive, Harsanyi's theorem carries three critical implications that suggest this procedure is theoretically unjustified in your specific context, primarily because your committee's disagreement is **doxastic** (about probabilities) rather than **axiological** (about values).

  ### 1. The Common Probabilities Assumption
  The most significant implication of Harsanyi's theorem for your committee is its reliance on the **assumption of common subjective probabilities**.

  Harsanyi's result demonstrates that if individual preferences and social preferences satisfy the vNM axioms and the Pareto principle, the social welfare function must be a linear combination of individual utilities:
  $$ W = \sum_{i=1}^{n} a_i U_i $$
  However, this derivation strictly requires that all individuals and the social planner share the same probability distribution over states of the world ($P_i = P_{social}$ for all $i$).

  **Implication for the Committee:**
  You noted that members "hold quite different views about how likely any given proposal is to actually succeed." This violates the common probabilities assumption.
  *   If members report expected utilities for proposals (which are lotteries over success/failure), they are reporting $E_i[U] = \sum_s P_i(s)U_i(s)$.
  *   If you average these expected utilities, you are conflating differences in belief ($P_i$) with differences in value ($U_i$).
  *   Harsanyi's theorem justifies aggregating *values* under shared *risk*, not aggregating *expectations* under divergent *uncertainty*.

  Using Harsanyi to justify averaging expected utilities when priors differ is a category error. It treats a disagreement about empirical likelihood as a disagreement about ethical weight. As Philippe Mongin has argued in his critiques of Harsanyi, when probabilities differ, the linear aggregation of expected utilities can violate the Pareto principle in spurious ways (e.g., two members might prefer Proposal A to B for entirely different reasons—one thinks it's valuable but unlikely, the other thinks it's likely but less valuable—leading to a social preference that neither endorses under a unified description of the world).

  ### 2. Ex-Ante vs. Ex-Post Utilitarianism
  Your committee is effectively debating between *ex-ante* and *ex-post* aggregation, a distinction that becomes critical when probabilities diverge.

  *   **Ex-Post (Harsanyi's Domain):** Aggregate utilities over outcomes first ($W(s) = \sum U_i(s)$), then evaluate the proposal based on the social expectation of that welfare ($E[W]$). This requires agreeing on a social probability distribution $P_{social}$.
  *   **Ex-Ante (Your Colleagues' Proposal):** Calculate individual expected utilities first ($E_i[U]$), then aggregate them ($\sum E_i[U]$).

  **Implication for the Committee:**
  With heterogeneous priors, *ex-ante* utilitarianism (averaging expected utilities) is normatively contentious. It can lead to "money pump" scenarios or agreeable bets where the committee funds a project that everyone knows is likely to fail, simply because the utility weights are skewed.
  Since your members agree on "what a successful outcome would look like" (implying $U_i(\text{success}) \approx U_j(\text{success})$), the variance in their evaluations is driven almost entirely by $P_i$.
  *   If you average expected utilities, you are implicitly engaging in **linear opinion pooling** on the probabilities, not ethical aggregation on the utilities.
  *   Harsanyi provides no justification for linear opinion pooling. There are separate arguments for that (e.g., Madansky, 1978), but they come with their own impossibility results (e.g., keeping marginalization properties intact).

  ### 3. Interpersonal Comparability and Calibration
  Harsanyi's theorem assumes that individual utility functions are cardinally measurable and interpersonally comparable up to a common unit and zero point. In theoretical social choice, we often assume this away via "extended preferences" or a hypothetical impartial observer.

  **Implication for the Committee:**
  In practice, asking committee members to "report a vNM utility function" is operationally fraught.
  *   Without a calibration mechanism (e.g., standard lotteries with defined anchor points), Member A's "0.8 utility" may correspond to Member B's "0.4 utility."
  *   If members agree on the *value* of success, the easiest path is to normalize $U(\text{success}) = 1$ and $U(\text{failure}) = 0$ for everyone.
  *   If you do this, the "utility function" collapses into a probability estimate. The proposal to "average utilities" becomes a proposal to "average probability estimates."
  *   If you do *not* do this, and allow members to assign different values to success (e.g., based on their specific research interests), you reintroduce the interpersonal comparison problem. Harsanyi requires a justification for the weights $a_i$. In a committee of peers, equal weights ($a_i = 1/n$) are standard, but this assumes equal standing and calibrated scales, which is rarely the case without explicit normalization.

  ### Recommendation for Procedure

  Given that the disagreement is primarily about likelihoods ($P$) rather than values ($U$), Harsanyi's theorem suggests you should **not** simply average reported expected utilities. Instead, consider a two-stage procedure that respects the separation of belief and value:

  1.  **Standardize Values (Ex-Post Welfarism):** Since you agree on what success looks like, define a common cardinal scale for outcomes (e.g., $U(\text{high impact}) = 10$, $U(\text{moderate}) = 5$, $U(\text{fail}) = 0$). This satisfies the interpersonal comparability requirement.
  2.  **Aggregate Beliefs Separately:** Instead of averaging expected utilities, aggregate the probability estimates. You might use a Delphi method or simple averaging of the probabilities *first* to generate a committee consensus probability $P_{social}$.
  3.  **Calculate Social Expected Value:** Compute the committee ranking based on $P_{social} \times U_{common}$.

  **Why this is better:**
  This approach acknowledges that Harsanyi justifies the aggregation of the $U$ term (which you have largely standardized by agreement), but it recognizes that the $P$ term requires epistemic aggregation, not ethical aggregation. It prevents a member from disproportionately influencing the outcome by inflating their utility scale rather than providing evidence for their probability estimate.

  **Summary:** Citing Harsanyi to justify averaging expected utilities when priors diverge is theoretically incorrect. The theorem supports averaging *utilities over outcomes* given *shared probabilities*. Since your committee shares values but diverges on probabilities, you should invert the procedure: standardize the utilities and aggregate the probabilities.
