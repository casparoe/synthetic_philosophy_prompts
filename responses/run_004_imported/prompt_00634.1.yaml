prompt: |-
  I'm a philosophy PhD student working on formal approaches to distributive ethics and social choice theory. I also sit on my graduate program's small research-grants committee, which allocates a modest annual budget across a handful of competing proposals submitted by fellow students. Several members want to formalize our deliberations by having each of us report a von Neumann–Morgenstern utility function over the possible outcomes of each proposal and then simply averaging these into a single committee ranking, citing Harsanyi's aggregation theorem as justification. Please describe the most important implications of Harsanyi's theorem for whether, and how, our committee should adopt this procedure, bearing in mind that members generally agree on what a successful outcome would look like but often hold quite different views about how likely any given proposal is to actually succeed.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **User:** Philosophy PhD student specializing in formal approaches to distributive ethics and social choice theory. This means they know the technical jargon (vNM utility, Harsanyi, social welfare functions, etc.) and expect a rigorous, nuanced answer. I don't need to explain the basics of vNM utility, but I do need to apply the theory correctly to the specific institutional context.
      *   **Context:** Graduate program research-grants committee. Small budget, competing student proposals.
      *   **Proposal:** Members report vNM utility functions over outcomes, average them to get a committee ranking.
      *   **Justification:** Harsanyi's Aggregation Theorem.
      *   **Key Fact:** Members agree on *what* a successful outcome looks like (common cardinal scale of value?) but disagree on *probabilities* (likelihood of success).
      *   **Task:** Describe the most important implications of Harsanyi's theorem for whether/how to adopt this procedure.

  2.  **Deconstruct Harsanyi's Aggregation Theorem:**
      *   *What does it actually say?* If individuals and the social planner satisfy vNM axioms (rationality) and the Pareto principle (if everyone prefers $A$ to $B$, society prefers $A$ to $B$), then the social welfare function must be a weighted sum of individual utilities. $W = \sum a_i U_i$.
      *   *Crucial Assumption:* Individuals and society share the *same subjective probabilities* over states of the world. This is often overlooked. Harsanyi's theorem is about aggregating *preferences* (utilities), not *beliefs* (probabilities).
      *   *The User's Scenario:* Members agree on outcomes (utilities) but disagree on probabilities. This is the exact *inverse* of the standard Harsanyi setup (where probabilities are common, utilities differ). Or rather, it's a mix. If they agree on "what a successful outcome looks like," do they agree on the utility of that outcome? Probably. But if they disagree on the likelihood of success, they are effectively disagreeing on the *expected utility* of the proposal.

  3.  **Identify the Core Tension:**
      *   The committee wants to average *utilities*.
      *   But the disagreement is about *probabilities* (empirical beliefs about the world/proposal viability).
      *   Harsanyi's theorem requires common probabilities to derive the linear utility aggregation.
      *   If probabilities differ, averaging utilities conflates differences in value with differences in belief.
      *   *Implication:* Using Harsanyi to justify averaging utilities when beliefs diverge is theoretically suspect. It violates the "Common Priors" or "Common Probabilities" assumption essential for the standard interpretation of the theorem in this context.

  4.  **Connect to Social Choice & Ethics (The User's Expertise):**
      *   *Mongin's Critique:* Philippe Mongin has written extensively on Harsanyi and the distinction between beliefs and values. This is relevant literature for a PhD student.
      *   *The "Spurious Consensus" Problem:* If I think a project has a 90% chance of success and you think 10%, but we value success equally, our expected utilities differ wildly. Averaging our *ex-ante* expected utilities might hide the disagreement. Averaging our *utilities over outcomes* ignores the belief disagreement.
      *   *The "Decision under Uncertainty" aspect:* The committee is making a decision under uncertainty. Harsanyi applies to social welfare under risk (known probabilities) or uncertainty (if probabilities are subjective but shared).
      *   *Ex-ante vs. Ex-post:* This is the critical distinction.
          *   *Ex-post:* Evaluate outcomes after uncertainty is resolved. (Hard for a grant committee).
          *   *Ex-ante:* Evaluate expected utility before resolution.
          *   Harsanyi is usually interpreted as an *ex-post* welfarist theorem (aggregate utilities over outcomes, then calculate expectation). But if the committee averages *expected* utilities (reporting a single number per proposal), they are doing *ex-ante* aggregation.
          *   If they report utility functions over *outcomes* (success/failure), they can aggregate utilities, then apply probabilities. But whose probabilities?

  5.  **Formulate the Advice:**

      *   **Point 1: The Common Probabilities Assumption.** Harsanyi's theorem strictly requires that individuals and the social observer share the same subjective probabilities. Since the committee members *disagree* on probabilities (likelihood of success), the theorem does not directly justify averaging utilities to form a social ranking of *prospects* (proposals).
      *   **Point 2: Ex-Ante vs. Ex-Post Pareto.**
          *   If you aggregate expected utilities (Ex-Ante), you run into problems if beliefs differ (e.g., speculative bets).
          *   If you aggregate utilities over outcomes (Ex-Post), you need a way to handle the divergent probabilities.
          *   Harsanyi supports Ex-Post utilitarianism. The committee seems to be leaning toward Ex-Ante (evaluating proposals based on expected success).
      *   **Point 3: Conflating Beliefs and Values.** If members report vNM utilities over *proposals* (which are lotteries), they are reporting Expected Utilities. Averaging EUs when probabilities differ is not justified by Harsanyi. It treats belief disagreements as value disagreements.
      *   **Point 4: Strategic Manipulation.** In a small committee, reporting true vNM utilities is not incentive-compatible. (Gibbard-Satterthwaite looms, though Harsanyi is about welfare, not voting). But practically, students might inflate utilities for their friends' projects.
      *   **Point 5: Interpersonal Comparisons.** Harsanyi requires cardinal utilities with a common zero and unit (or at least comparable scales). "Reporting a utility function" is operationally difficult. How do we calibrate my "10" vs. your "10"? Harsanyi assumes this is solvable (often via "extended preferences"), but in practice, it's a major hurdle.

  6.  **Refine the Argument for the Specific Scenario:**
      *   *Scenario:* Agree on value of success, disagree on probability.
      *   *Math:* Let $U(success) = 1, U(fail) = 0$ for everyone.
      *   Member 1: $p_1 = 0.9 \rightarrow EU_1 = 0.9$.
      *   Member 2: $p_2 = 0.1 \rightarrow EU_2 = 0.1$.
      *   Average EU = 0.5.
      *   Does this represent the "Social Utility"?
      *   Harsanyi says: Social Welfare $W = \sum U_i(outcome)$. Then $E[W] = \sum p_{social} U_i(outcome)$.
      *   Who determines $p_{social}$? If we average probabilities, that's a different theorem (e.g., linear opinion pooling). If we average Expected Utilities, we are implicitly averaging probabilities *and* utilities together, which violates the separation required by Harsanyi.
      *   *Key Insight:* Since they agree on values ($U$), the disagreement is purely doxastic. Harsanyi is an ethical theorem about aggregating *values*, not a statistical theorem about aggregating *beliefs*. Using it to solve a belief disagreement is a category error.

  7.  **Structure the Response:**
      *   **Acknowledge Expertise:** Keep the tone peer-to-peer, rigorous, avoiding basic definitions.
      *   **The Central Problem (Common Probabilities):** Highlight that Harsanyi requires shared probabilities. This is the "gotcha" for their proposal.
      *   **Ex-Ante vs. Ex-Post:** Distinguish between aggregating expected utilities vs. utilities over outcomes. Explain why the distinction matters given their belief divergence.
      *   **The "Values vs. Beliefs" Distinction:** Since they agree on values, Harsanyi is the wrong tool. They need an epistemic aggregation method (for probabilities) + a decision rule.
      *   **Interpersonal Comparability:** Remind them that "reporting a utility function" is non-trivial without calibration.
      *   **Strategic/Practical Concerns:** Briefly mention incentive compatibility and the burden of elicitation.
      *   **Recommendation:** Suggest separating the evaluation of *merit* (value) from *viability* (probability).

  8.  **Self-Correction/Nuance Check:**
      *   *Did I interpret Harsanyi correctly?* Yes, Harsanyi (1955) assumes individuals and society have the same probability judgments.
      *   *Is there a version for different probabilities?* Harsanyi (1977) and later Mongin (1995) discuss this. If probabilities differ, the social welfare function might not be linear, or it requires weighting beliefs.
      *   *Is the user asking for a "Yes/No"?* No, they ask for "implications... for whether, and how." So I need to provide actionable theoretical guidance.
      *   *Tone:* Professional, academic, helpful.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Validate the ambition but flag the theoretical mismatch.
      *   *Section 1: The Common Probability Assumption.* This is the big one. Harsanyi doesn't apply if $P_i \neq P_j$.
      *   *Section 2: Ex-Ante vs. Ex-Post.* Explain that averaging EUs is Ex-Ante utilitarianism, which is controversial with heterogeneous priors (Pareto efficiency issues).
      *   *Section 3: Operationalizing Utility.* Cardinality and zero-points.
      *   *Section 4: Alternative Approach.* Separate probability estimation from value judgment.
      *   *Conclusion:* Summary recommendation.

  10. **Final Polish:** Ensure references to Mongin, Weymark, or standard social choice literature are implicit or explicit where appropriate to signal shared knowledge. (Decided to keep citations light but precise concepts heavy). Make sure to emphasize that since they *agree* on values, the problem is epistemic, not ethical.

  *(Self-Correction during drafting)*: Wait, if they agree on what a successful outcome looks like, do they have the same utility function over outcomes? The prompt says "members generally agree on what a successful outcome would look like." This implies $U_i(success)$ is roughly constant across $i$. If $U_i$ is constant, then $\sum a_i U_i$ is just proportional to $U$. The disagreement is entirely in $E[U]$. So averaging $E[U]$ is effectively averaging $P_i$. Harsanyi justifies averaging $U$, not $P$. This confirms the category error argument.

