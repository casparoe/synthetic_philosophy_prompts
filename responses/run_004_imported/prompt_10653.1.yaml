answer: |-
  Good morning. For those who don't know me, I was Nora's friend from graduate school. We spent a lot of time reading, and a lot of time eating dinner while arguing about what we'd read.

  Nora died three weeks ago. She was twenty-six years old.

  Many of you know that Frank Ramsey, the mathematician and philosopher Nora studied more than anyone, also died at twenty-six. Nora was the first to point out the coincidence, usually with a wry smile. She was finishing her dissertation on his work, specifically on subjective probability. But the piece of Ramsey she loved most wasn't technical. It was a passage she would bring up unprompted, often when one of us was having a particularly bad day.

  She told us that Ramsey said his picture of the world was drawn in perspective, not to scale. In his view, the stars shrink down to the size of coins. He insisted he felt no humility before the vastness of the universe, in space or in time. His argument was that mere size and duration are not the kinds of things that can outweigh a mind capable of thinking and loving.

  Nora told us once that this was the only piece of philosophy that ever actually changed how a bad day felt, rather than just being fun to argue about.

  I have spent the last few weeks trying to understand why she loved that passage so much, and how it fits into this room, today.

  To Nora's colleagues: I know what Ramsey's argument does. It defends the significance of human goods against the charge of cosmic triviality. It argues that value is intensive, not extensive.

  To Nora's family: I know that argument does not fix what has happened here.

  There is a gap between what Ramsey proved and what we are feeling. Ramsey's words explain why a life matters, but they do not explain why it ended so soon. They do not give back the forty or fifty years Nora should have had. They do not explain why she was taken while so many others stay. If I were to tell you that her short life was "enough" because it was meaningful, I would be lying. It was not enough. We wanted more time. We wanted her to grow old. We wanted to hear what she would have thought in ten years, in twenty.

  Nora was explicit about what she believed. She did not believe in souls watching over us. She did not believe everything happens for a reason. She believed that grief is the price of love, and that pretending otherwise is an insult to the truth. So I will not tell you she is in a better place. I will not tell you this was part of a plan.

  But I will tell you this: Ramsey was right about the scale.

  The universe is vast and indifferent. It does not care that Nora is gone. But we are not the universe. We are the perspective. And in our perspective, Nora was not small.

  The value of a mind is not measured in the number of breaths it takes, but in the depth of its attention. Nora thought harder and loved more fiercely in twenty-six years than most people do in eighty. She made us feel seen. She made complex things clear. She made bad days bearable just by sitting across the table and explaining why the stars were only the size of coins.

  We cannot fix the time we lost. We have to carry that weight. But we do not have to let the vastness of the loss erase the significance of what was here.

  To her parents and her brother: You taught her how to think and how to love. That was the engine of her life. Ramsey wrote that size cannot outweigh a mind capable of those things. Look around this room. These people are here because her mind touched theirs. That impact is real. It is physical. It is happening right now.

  Nora taught us that we don't need the comfort of an afterlife to find meaning in a life. We only need to recognize the value of the thinking and the loving that actually happened.

  She is not watching over us. But she is still with us, in the way we think, and in the way we refuse to let the universe's silence have the final word. She mattered. Not because of how long she stayed, but because of who she was while she was here.

  Thank you.
