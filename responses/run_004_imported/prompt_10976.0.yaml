      *   *Specific Check:* The "Map/Territory" question needs to really land. The "Löb" question needs to distinguish between *mathematical* trust and *engineering* trust. The "Grain of Truth" needs to challenge the impossibility claim.

  5.  **Final Polish:** Organize clearly with headers. Add an intro and outro encouraging the user. (Proceed to generate output based on these thoughts).

