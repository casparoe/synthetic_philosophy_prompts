      *   *Key Tension:* Formalism vs. Pragmatism. Much of embedded agency research comes from MIRI/CFAR-adjacent circles which prioritize rigorous formal guarantees. A common critique is that this might be too restrictive compared to empirical deep learning approaches. The questions should reflect this tension.

