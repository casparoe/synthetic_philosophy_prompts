  A few of us from my decision theory seminar (I'm in a philosophy PhD program, working on formal epistemology) got dinner last week, right after the week we covered Good's theorem, so naturally everyone had it loaded and ready to misapply on each other. The situation that actually kicked things off: a friend of a friend is at 50% risk for Huntington's and has decided not to take the predictive genetic test, even though it's free through her insurance and there's no treatment either way — it would just convert her uncertainty into a yes or no. Two people at the table, Nate and Farah, spent a solid twenty minutes arguing about whether that's irrational, and i haven't been able to stop replaying it since.

  (1) Nate opened with: there's an actual theorem here, not just a vibe. Good's theorem says a Bayesian facing a decision should always weakly prefer to see a costless signal before acting, since worst case you just ignore it and do whatever you'd have done anyway — so refusing free evidence when nothing is stopping you from looking can never raise your expected utility, and her declining the test is a plain mistake. (2) Farah pushed back: the theorem is stated relative to a fixed decision problem, it proves information helps you act better given some choice you're already facing. There's no treatment for Huntington's, so there's no act the result would change, so the theorem doesn't even get a foothold here. (3) Nate replied that there's plenty it would change — whether to have biological kids, whether to front-load retirement savings or buy long-term care insurance now, whether to tell a future partner — so the antecedent is satisfied after all. (4) Farah granted that but said it only shows the theorem covers the decision-relevant slice of the value; it says nothing about the direct psychological cost of just knowing (dread, changed self-conception, whatever you want to call it), because Good's proof assumes the available acts and their payoffs don't depend on whether you're informed, except that you get to pick a better one. The moment "finding out" carries a cost that isn't mediated by any downstream choice, she said, you're outside what the theorem was ever about, so Nate doesn't get to just cite it and call the matter closed. (5) Nate's comeback: doesn't that move generalize to justify anything? A gambler could just as well say the cost of finding out he lost is a real cost, so it's rational to never check the score. If dread counts as a legitimate cost in Farah's story, why doesn't it count there too?

  Neither of them budged, and I had to change the subject before it got weird. Could you go through this move by move (five verdicts, one per numbered claim) and say where each of them is right or wrong? I'm especially curious whether Farah's distinction between decision-value and psychic cost actually survives Nate's gambler comparison in (5), or whether that comparison shows her move proves too much and just collapses into "anything counts as a cost if you say it does." If it helps, you can start with a quick JSON block like {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>} with scores from -2 (clearly wrong) to 2 (clearly right), then explain each one. And separately — is there some standard qualification on Good's theorem that both of them are just missing entirely?
