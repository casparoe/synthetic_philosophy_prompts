  ### Analysis of the Moves

  **1. Nate: "Good's theorem says... refusing free evidence... is a plain mistake." (Score: 1)**
  Nate is technically correct about the *theorem's conclusion* under its standard axioms, but overconfident in its *application*. Good's Theorem (1967) demonstrates that for a Bayesian expected-utility maximizer, the expected value of free information (EVFI) is non-negative. If the information is truly costless and the agent can ignore it, they cannot do worse in expectation. However, Nate treats the theorem as a normative hammer without verifying the premises. In formal epistemology, we know theorems are conditionals: *if* the framework holds, *then* the conclusion follows. By declaring the friend's choice a "plain mistake" without establishing that the framework fits the psychology of Huntington's testing, he commits a model-error. He gets a positive score for stating the theorem correctly, but loses points for ignoring the boundary conditions.

  **2. Farah: "No treatment... so there's no act the result would change." (Score: -1)**
  This is Farah's weakest move. It relies on an overly narrow conception of the "decision problem." In the Savage framework, a decision problem is defined by the set of available acts and the states of the world that determine their consequences. "Treatment" is just one type of act. As Nate correctly identifies in (3), the state (gene positive/negative) drastically alters the optimal strategy for reproduction, financial planning, and career trajectory. If the posterior probability shifts the optimal act in *any* of these domains, the information has instrumental value. Farah incorrectly conflates "medical intervention" with "decision-relevance."

  **3. Nate: "There's plenty it would change — kids, savings, insurance..." (Score: 2)**
  Nate is entirely right here. He correctly expands the outcome space. The utility function for a person facing a Huntington's risk isn't just $U(\text{health}, \text{treatment})$; it includes $U(\text{children's risk}, \text{financial security}, \text{relationship honesty})$. Since the genetic status is a state variable that causally influences the expected utility of these acts, the antecedent of Good's Theorem (that there exists a decision problem sensitive to the state) is satisfied. This rebuts Farah's claim that the theorem "doesn't get a foothold."

  **4. Farah: "Theorem assumes... payoffs don't depend on whether you're informed." (Score: 2)**
  This is the technical knockout punch. Good's Theorem relies on the assumption that the utility function is defined over **world-states and acts**, not over **belief-states**. Formally, $U(a, s)$ must be independent of the information partition or the act of observation. If the agent derives negative utility directly from the state of *knowing* $s$ (e.g., anxiety, loss of hope, "dread"), then the cost of information is not zero, even if the monetary cost is zero. The "act" of observing the signal changes the utility function itself. Farah correctly identifies that once you introduce "psychic costs" intrinsic to the belief state, you have violated the independence assumption required for Good's proof. The value of information can indeed be negative in such models.

  **5. Nate: "Doesn't that move generalize... rational to never check the score." (Score: 0)**
  Nate raises a standard philosophical worry about **preference sovereignty**, but he misunderstands the formal implication. In standard decision theory, if an agent's utility function includes a term for "peace of mind" or "avoiding dread," then it *is* rational for the gambler not to check the score. This isn't a collapse of the theory; it's a correct application of it to agents with non-standard preferences. Nate's worry is that this makes the theory unfalsifiable (any behavior can be rationalized by positing a weird utility function). While that is a valid meta-theoretical concern about *ad hoc* modeling, it doesn't mean Farah is wrong about the Huntington's case. The distinction holds: if the cost is mediated by downstream action, Good applies; if the cost is intrinsic to the belief, Good does not apply. Nate gets a 0 because he identifies a real tension (trivialization risk) but draws the wrong conclusion (that the distinction is invalid).

  ### The Missing Qualification

  There is a standard qualification on Good's Theorem that neither of them explicitly named, though Farah gestured toward it. It is the assumption of **State-Independent Utility** (or sometimes, the lack of **Intrinsic Epistemic Utility**).

  Good's Theorem proves that information has non-negative *instrumental* value. It assumes the agent cares about the world, not about their map of the world.
  *   **The Formal Constraint:** The utility function $U$ must be defined on the consequence space $C$, where consequences are functions of Acts and States only: $c = f(a, s)$. The information signal $E$ itself cannot appear as an argument in $U$.
  *   **The Violation:** In the Huntington's case (and the gambler case), the agent has a preference over **doxastic states**. They value *hope*, which requires a specific probability distribution (specifically, one that isn't collapsed to 0 or 1). When an agent values the *distribution* of their credences rather than just the accuracy or the worldly outcomes, the Value of Information can be negative.

  **The Technical Fix:**
  If you want to model this formally without breaking decision theory, you expand the outcome space.
  *   **Nate's Model:** Outcomes = {Healthy, Sick}.
  *   **Farah's Model:** Outcomes = {Healthy-Knowing, Healthy-Ignorant, Sick-Knowing, Sick-Ignorant}.

  If the agent prefers {Healthy-Ignorant} to {Healthy-Knowing}, then "taking the test" is an act that leads to a less preferred outcome category, regardless of the medical state. Good's Theorem still holds in this expanded space (you should take the test *if* you value Knowing more than Ignorant), but since the agent *doesn't* value Knowing, the theorem doesn't compel them to test.

  **Summary for your seminar:**
  Farah wins on the technicality (assumption violation), but Nate wins on the modeling norm (we should be wary of expanding utility functions just to save a behavior from appearing irrational). The friend isn't violating Good's Theorem; she is operating outside its domain of applicability because she has a **taste for ignorance**. Good's Theorem applies to instrumental rationality, not to agents who treat ignorance as a consumable good.
