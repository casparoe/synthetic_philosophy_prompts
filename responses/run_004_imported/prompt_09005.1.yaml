  6.  **Naomi (2):** This is historically and textually precise. Anscombe's broader project in *Modern Moral Philosophy* was to argue that without a divine law framework, consequentialist arithmetic dissolves moral obligation, and she indeed popularized "consequentialism" as a pejorative label for this reasoning.

