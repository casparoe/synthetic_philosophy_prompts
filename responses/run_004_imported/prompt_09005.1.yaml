  ### Who Has Anscombe's Argument Right?

  **Naomi is the clear winner on the text, but both miss the deeper meta-ethical wrinkle.**

  Naomi accurately reconstructs Anscombe's specific argument regarding intention and the Doctrine of Double Effect. She correctly identifies that Anscombe views the bombing as the intentional killing of innocents (murder), which is an absolute prohibition that cannot be overridden by arithmetic. Wes is arguing *against* Anscombe using the very tools (consequentialism) she claims are responsible for the moral rot he is witnessing; he understands the counter-argument, but he doesn't understand why Anscombe thinks that counter-argument is illegitimate.

  **The Missing Wrinkle:**
  There are two layers to Anscombe's position that neither Wes nor Naomi fully articulate:

  1.  **The Institutional Complicity:** Anscombe's pamphlet isn't just about whether Truman was right or wrong; it's about what Oxford University *does* when it awards him a degree. Her argument is that by honoring him, the institution is formally endorsing the proposition that "murdering innocents is permissible if the sums work out." She is attacking the *moral language of the institution*, not just the tactical decision.
  2.  **The Theological Underpinning:** Naomi mentions Anscombe thinks consequentialism is "rotten," but doesn't explain *why*. For Anscombe, moral concepts like "obligation" and "murder" only have coherent traction within a Divine Law framework. Without a Lawgiver, "ought" loses its meaning, and ethics devolves into psychology or sociology (i.e., consequentialism). Wes's pivot to "lesser evil" assumes a secular utilitarian framework that Anscombe believes is philosophically incoherent, not just morally disagreeable. She isn't just saying the math is wrong; she's saying the calculator is broken.
