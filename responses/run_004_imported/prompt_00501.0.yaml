answer: |-
  This is an exceptionally sharp observation. You have identified what is widely considered the single most important philosophical challenge to Strawson's project. In the literature, this is often referred to as the **"Normativity Objection"** or the charge of **"Psychologism."**

  Your intuition is correct: if Strawson's argument rests *solely* on the claim that "we are psychologically incapable of abandoning reactive attitudes," he has indeed committed a version of the naturalistic fallacy (deriving an *ought* from an *is*). Psychological inescapability does not entail rational justification. As you noted, we are psychologically prone to certain cognitive biases (e.g., confirmation bias or tribalism), but that doesn't make those biases epistemically justified.

  To help you prepare for your seminar, I will break this down into three parts:
  1.  **The Structure of the Objection:** Why the move from psychology to normativity is philosophically precarious.
  2.  **Strawson's Nuance:** Why Strawsonians argue he isn't making the crude move critics accuse him of.
  3.  **Contemporary Defenses:** How philosophers like R. Jay Wallace and Stephen Darwall have refined Strawson's view to close the gap.

  ---

  ### 1. The Structure of the Objection (The Normativity Gap)

  The objection claims that Strawson conflates **inescapability** with **justification**.

  **The Critic's Argument:**
  1.  **Strawson's Premise:** Human beings are naturally constituted such that they cannot globally abandon reactive attitudes (resentment, gratitude, etc.) without ceasing to participate in ordinary human relationships (the "participant stance").
  2.  **Strawson's Conclusion:** Therefore, our practices of holding people responsible (via these attitudes) are justified, and the skeptic's worry about determinism is empty.
  3.  **The Gap:** Even if Premise 1 is true (we *can't* stop), it does not prove that the attitudes are *appropriate* or *fair* (we *shouldn't* stop).

  **Why this is shaky:**
  Imagine a species hardwired to feel intense hatred toward anyone with red hair. They cannot help but feel this hatred; it is constitutive of their social psychology. If a philosopher from that species argued, "We cannot stop hating redheads, therefore redheads deserve hatred," we would reject that reasoning. The fact that a practice is deeply ingrained does not prove it tracks moral truth.

  The skeptic (the incompatibilist) is asking for an **external justification**. They want to know: *Given the metaphysical truth of determinism, is it fair to punish or resent someone?* Strawson replies: *We can't stop resenting.* The critic replies: *You didn't answer the question. You told us about your psychology, not about justice.*

  ### 2. Strawson's Nuance: Is it really a Fallacy?

  Defenders of Strawson argue that critics often read him too crudely. Strawson is not merely making a sociological or psychological claim; he is making a **conceptual** or **transcendental** claim.

  **The "No Coherent Alternative" Argument:**
  Strawson suggests that the skeptic is asking for a justification from a "view from nowhere"—a standpoint outside of human life itself. But the concepts of "justice," "fairness," and "responsibility" only have meaning *within* the framework of human relationships.
  *   If you abandon the participant stance entirely (adopting the "objective attitude" toward everyone), you cease to view others as moral agents. You view them as objects to be managed, cured, or trained.
  *   In that objective stance, the question "Is this person *really* responsible?" doesn't arise.
  *   Therefore, there is no external standpoint from which to judge the participant stance. The participant stance is the **condition of possibility** for moral discourse.

  **The Shift:**
  Strawson isn't saying "We do it, so it's right." He is saying, "The question 'Is it right?' only makes sense *inside* the practice we cannot abandon. To ask if the practice itself is justified from the outside is unintelligible."

  This moves the argument from **Psychology** (we can't stop) to **Intelligibility** (we can't make sense of morality without it). However, critics still push back: *Even if it's the only game in town, is it a rigged game?*

  ### 3. Contemporary Defenses: Closing the Gap

  To defend Strawson in your seminar, you need to show how contemporary "Strawsonians" (Naturalistic Compatibilists) bridge the Is-Ought gap. They do this by arguing that reactive attitudes are not just blind feelings; they contain **normative content**.

  #### A. R. Jay Wallace: The Normativity of Demands
  In *Responsibility and the Moral Sentiments* (1994), Wallace argues that Strawson focused too much on the *emotions* (resentment) and not enough on the **moral demands** embedded in them.
  *   **The Move:** Resentment isn't just a sting; it is a protest against a violation of a legitimate moral demand.
  *   **Closing the Gap:** The justification for resentment doesn't come from the fact that we feel it (psychology). It comes from the fact that the **demand** we hold (e.g., "you ought to respect me") is reasonable and fair.
  *   **Seminar Point:** You can argue that Strawson implies this: Reactive attitudes are only appropriate when the agent had the capacity to understand and comply with the demand. Determinism doesn't remove that capacity. Therefore, the attitudes are justified not because they are inevitable, but because they track the violation of reasonable expectations.

  #### B. Stephen Darwall: The Second-Person Standpoint
  Darwall (*The Second-Person Standpoint*, 2006) expands Strawson by focusing on the relational nature of responsibility.
  *   **The Move:** Responsibility is essentially **second-personal**. It involves one person making a claim on another ("I demand you stop that").
  *   **Closing the Gap:** The authority to make this demand is constitutive of equal moral relationships. If we give up reactive attitudes, we give up the idea that we are equals who can make claims on one another.
  *   **Seminar Point:** The justification is the **value of moral community**. We are justified in holding people responsible because doing so is the only way to relate to them as free and equal persons rather than as objects. The "ought" comes from the value we place on interpersonal relationships, not just the psychological inability to leave them.

  #### C. The Wittgensteinian "Bedrock"
  Some defenders argue that the demand for further justification is a philosophical illusion.
  *   **The Move:** Justifications come to an end. When I have exhausted my reasons, "my spade is turned."
  *   **Closing the Gap:** Asking "But is the whole practice justified?" is like asking "Is the standard meter bar in Paris really one meter long?" It *defines* the meter. Similarly, our reactive attitudes define what responsibility *is*.
  *   **Seminar Point:** The skeptic wants a "super-justification" outside of human life. Strawson shows that such a justification is impossible. We must accept that our form of life is the ultimate ground of justification.

  ### 4. Strategy for Your Seminar Discussion

  Here is how you can articulate this in class to show you grasp the depth of the issue:

  **1. Acknowledge the strength of the objection:**
  > "I'm concerned that Strawson risks committing a naturalistic fallacy. He seems to argue that because we *cannot* abandon reactive attitudes, we are *justified* in keeping them. But psychological inescapability doesn't guarantee moral correctness, just as cognitive biases are inescapable but irrational."

  **2. Offer the Strawsonian refinement (The Wallace/Darwall move):**
  > "However, I think a sophisticated defense of Strawson relies on distinguishing between the *feeling* of resentment and the *moral demand* it embodies. If we follow R. Jay Wallace, the justification isn't that we 'can't help but feel,' but that these attitudes express legitimate expectations we have of one another as members of a moral community. Determinism doesn't negate our ability to meet those expectations."

  **3. Pose the critical question (The "Value" Argument):**
  > "So the real question isn't 'Can we stop?' but 'Do we value the kind of relationships that require these attitudes?' If we value interpersonal relationships where people make claims on one another, then the reactive attitudes are justified as the necessary infrastructure of that relationship. Strawson isn't deriving an 'ought' from an 'is,' but rather arguing that the 'ought' of responsibility is internal to the 'is' of human social life."

  ### Summary Checklist for Your Prep
  *   **The Objection:** Psychological inevitability $\neq$ Moral justification (The Normativity Gap).
  *   **Strawson's Defense:** There is no "external" standpoint; the practice is constitutive of moral life.
  *   **Wallace's Upgrade:** Focus on the *legitimacy of the demand*, not just the emotion.
  *   **Darwall's Upgrade:** Focus on the *second-personal authority* required for equality.
  *   **Your Position:** Strawson is right that the skeptic asks for an impossible "view from nowhere," but Strawson needs the help of Wallace/Darwall to show that the attitudes track *reasonable demands*, not just blind psychology.

  This structure shows you understand the text, the standard objection, and the cutting-edge responses. Good luck with the seminar!
