answer: |-
  Good morning. Thank you all for being here.

  For those of you who don't know me, I'm a friend of Walt's. We shared an office wall in the physics department for thirty-odd years. We spent decades arguing about cross-sections, grant proposals, and the best way to brew coffee in a breakroom. But if you asked Walt five years ago what he was really thinking about, he wouldn't have talked about particle accelerators. He would have talked about David Lewis.

  Right after he retired, Walt fell hard for this idea about how the universe actually works. He dragged me into it, too, over many cups of coffee. He became convinced that the laws of nature—the things we spent our careers chasing—weren't like rules written in a rulebook that the universe has to obey. He believed they were just a summary. A description of the pattern of everything that actually happens.

  He called it the "mosaic." Just the vast collection of every moment, every event, fitted together.

  Now, Walt left me a note before he died. It was titled "Banned Phrases for My Funeral." At the top of the list was "He is obeying higher laws now," and right underneath it was "It was all meant to be."

  He was dead serious about that. He didn't want us to pretend there was some hidden hand guiding things, or that his death was part of a plan. He didn't believe in destiny. He believed in what *happened*.

  And honestly, I think there is a lot of comfort in that.

  Because if there is no grand plan, then the value of a life isn't in what it was *supposed* to achieve. It's in what it actually *was*. The sum of the moments. The laughter at the dinner table, the patience with a graduate student, the time spent on the floor with the grandkids.

  Walt loved his model trains. He spent hours in his basement building those layouts. To the physicists in the room, I think Walt would say the universe is just a giant version of that basement: a vast arrangement of matter and events, nothing more, nothing less. But to the rest of us, and to Walt himself, the point wasn't the theory. It was the beauty of the layout.

  He used to tell me that we are just patterns in the mosaic. And I told him once, "Walt, if we're just patterns, you were a very stubborn one."

  But here is the thing about a mosaic, or a train track layout: once a piece is set down, it stays there. The past is fixed. Nothing can erase the fact that Walt was here. Nothing can undo the kindness he showed, or the work he did. In a world where things are constantly changing, the fact that he lived is now a permanent part of the structure of reality.

  He isn't somewhere else. He is right here, in the sum of what he left behind.

  So, we aren't here to say that everything happens for a reason. We are here to say that what happened *mattered*.

  Walt, you were a wonderful friend, a brilliant physicist, and you built a hell of a layout. We'll miss you.
