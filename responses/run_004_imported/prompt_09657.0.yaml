      *   *Addressing the "Duty" vs. "Gift" tension:* This is the tricky part. I need to validate the donors without shaming the family.
          *   *Idea:* If we say it was "easy," we insult her courage. If we say it was "required," we insult her generosity.
          *   *Phrasing:* "It is tempting to say she did what anyone should do. But the truth is, she did what few *could* bring themselves to do."
