          *   Do *not* minimize her sacrifice (avoid calling it "just nice" or "easy").
          *   Tone: Respectful, poignant, balanced, authentic.

  2.  **Deconstruct the Philosophical Conflict (for internal clarity):**
      *   *The Friend's Argument (Utilitarian/Demandingness):* If the cost is low (one kidney, survivable surgery) and the benefit is huge (life saved), the moral obligation is absolute. Therefore, not donating is immoral. Calling it "heroic" lets non-donors off the hook.
      *   *The Counter-Argument (Supererogation/Agency):* Morality has a baseline (do no harm, keep promises, care for dependents). Going *beyond* that baseline is good but not required. Bodily autonomy is a fundamental right. Asking someone to surgically alter their body, even safely, is a significant request. The *willingness* to bear that burden voluntarily is what makes it virtuous. If it were mandatory, it wouldn't be a gift; it would be a tax.
      *   *The Eulogy's Path:* Navigate between these. Acknowledge the physical reality (it *was* a sacrifice, it *was* risky enough to matter) without preaching to the non-donors. Focus on the *spirit* of the gift rather than the *obligation* of the act. The value lies in the *freedom* of the choice.

  3.  **Determine the Tone and Structure:**
      *   **Tone:** Warm, reflective, dignified, slightly philosophical but grounded in emotion.
