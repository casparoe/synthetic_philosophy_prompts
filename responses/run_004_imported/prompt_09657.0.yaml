answer: |-
  Good morning. Thank you all for being here.

  Looking around this room, I see two distinct circles of my aunt's life. On one side, her family—those of us who knew her through holidays, birthdays, and the quiet moments of ordinary life. On the other, her colleagues from the transplant registry—the donors, the recipients, the medical staff who fought alongside her.

  It is rare that these two worlds collide. But they collide here because they were both sustained by the same engine: my aunt's capacity to love people she had not yet met.

  Twenty years ago, my aunt gave a kidney to a stranger. She didn't do it for recognition. She did it, and then she went to work. For the rest of her life, she volunteered for the registry, helping pair donors with recipients. She didn't just give an organ; she gave her time, her empathy, and her relentless belief that we are responsible for one another.

  I know there is a temptation, when we speak of organ donation, to make it sound easy. We talk about medical statistics. We talk about how the body compensates. We say, "It's a low-risk procedure." And medically, that may be true. But to call it "low risk" is to miss the point of what she did.

  Any surgery is a confrontation with mortality. Any sacrifice of a part of oneself is a burden. To wake up with a scar, to recover, to live with one kidney when you could have lived with two—that is a cost. It is a real, physical cost.

  There is an argument that says if the cost is survivable, and the benefit is a life saved, then morality demands we all do it. That to call this act "heroic" or "exceptional" is just a way for the rest of us to feel less guilty for keeping both our kidneys.

  I understand that argument. But I believe it misunderstands the nature of a gift.

  A gift, by definition, must be free. If it is demanded, it is a tax. If it is obligatory, it is a duty. My aunt did not pay a tax. She gave a gift. And the value of that gift lies precisely in the fact that she could have said no.

  She possessed full autonomy over her own body. The world did not require this of her. The law did not mandate it. Her family did not expect it. In a world that often tells us to protect what is ours, to hoard our health and our security, she chose to open her hands.

  To say that she went "above and beyond" is not to shame those who keep their organs. It is to acknowledge that while we all have duties—to be kind, to be honest, to care for our families—there exists a realm of human action that exceeds the baseline of duty. The Greeks called it *supererogatory*. I call it grace.

  If we frame her actions as a duty we all failed, we turn her life into a ledger of guilt. That was never her way. I watched her work the phones at the registry. She never shamed a potential donor who hesitated. She never made a family member feel small for not being able to donate. She understood that fear is real, and that capacity varies. She didn't help people because she thought they were morally indebted; she helped them because she believed in their freedom to be generous.

  She knew that if she forced the issue, the gift would lose its meaning.

  So, to her fellow donors here today: You know the weight of what she carried. You know the ache of the incision and the weight of the choice. Honor her by knowing that she stood with you in that truth. She never minimized the sacrifice.

  And to my family: Do not feel that her generosity casts a shadow over your own. She did not love us less because we did not donate. She loved us enough to show us what was possible. She did not give a kidney to make us feel guilty; she gave it because she had an abundance of life she wanted to share.

  The best way to honor her is not to carry a burden of obligation. It is to recognize that we are capable of more than we think. We are not required to give a kidney to be good people. But we are invited to ask ourselves: Where can we be a little more open? Where can we be a little less afraid? Where can we offer something that isn't strictly required, but is deeply needed?

  My aunt lived a life that said, "I am my brother's keeper." Not because the law said so, but because love said so.

  Let us not mourn her as a saint who set a standard we cannot reach. Let us remember her as a woman who showed us that the human heart, much like the human body, has more to give than we often dare to believe.

  Thank you.
