          4.  **The Balance:** Subtly address the "duty" argument without making it a debate. Focus on the *gift* aspect. A gift must be free to be valuable.
          5.  **Closing:** A call to remember her spirit, not just her organs.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with gratitude for people coming. Acknowledge the unique mix of people in the room.
