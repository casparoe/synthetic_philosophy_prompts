answer: |-
  **MEMORANDUM**

  **TO:** Foundations Working Group
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Classical Axioms in Core Library

  ### 1. Executive Summary

  After reviewing the trade-offs between formalization velocity and computational content, I recommend we **retain the intuitionistic core** but adopt a **scoped classical architecture**.

  Specifically:
  1.  **Do not hardcode** Excluded Middle (EM) or Choice into the logical kernel.
  2.  **Develop a stable `Classical` module** that asserts these axioms globally.
  3.  **Policy:** The Analysis track imports `Classical` by default; the Algorithms/PL track does not.

  This approach preserves the unique CS value proposition (code extraction) while removing the friction preventing the Analysis group from formalizing standard theorems. It effectively replicates the architectural success of Lean's `mathlib` without permanently burning the bridge to constructive semantics.

  ### 2. Context and Options

  We are currently debating whether to move from our status quo (Intuitionistic Type Theory, axioms explicit) to a "Hard Classical" core (axioms baked in).

  *   **Option A: Hard Classical.** We modify the kernel or base imports to assume EM and Choice globally.
  *   **Option B: Hard Constructive (Status Quo).** We require constructive proofs for everything unless explicitly axiomatized per-lemma.
  *   **Option C: Constructive Core + Scoped Classical (Recommended).** The kernel remains constructive, but we provide a sanctioned, one-line import to enable classical reasoning for specific projects.

  ### 3. Analysis of Trade-offs

  #### 3.1. The Analysis Argument (Friction vs. Fidelity)
  The Analysis group is correct that strict constructivity impedes formalizing standard undergraduate real analysis.
  *   **The Pain Point:** Proving that a non-empty finite set of reals has a maximum requires decidable equality on reals, which is constructively false. Similarly, the Bolzano-Weierstrass theorem generally requires some form of choice or EM.
  *   **The Risk:** If we force constructive proofs for these, we are not formalizing *analysis*; we are formalizing *constructive analysis*. This diverges from the actual curriculum we are trying to support and creates an unsustainable maintenance burden (contorted proofs that confuse students).
  *   **The Precedent:** Lean's `mathlib` is the gold standard for library size. It achieves this by assuming classical logic early in the hierarchy.

  #### 3.2. The PL/Algorithms Argument (Extraction vs. Opacity)
  The PL group is correct that baking classical axioms into the core destroys computational content.
  *   **The Value Prop:** As a CS department project, our differentiator from a pure math formalization is the potential to extract verified algorithms. An existence proof ($\exists x, P(x)$) in a constructive core yields a witness $x$; in a classical core, it yields only a promise that $x$ exists.
  *   **The Risk:** If we bake EM/Choice into the kernel, *everything* becomes potentially noncomputable. We lose the ability to audit the library for extractable code. We cannot guarantee that a sorting algorithm proven correct in the library will actually compile to a runnable function.
  *   **The "Noncomputable" Tag:** Relying on the system to tag lemmas as `noncomputable` is insufficient if the axioms are global. We need a structural guarantee that a constructive subset exists.

  #### 3.3. The Diaconescu Compromise
  A few members suggested adding the Axiom of Choice (AC) without Excluded Middle (EM) as a middle ground. **We must reject this.**
  Diaconescu's Theorem demonstrates that in standard type theoretic settings, AC implies EM. If we add Choice, we get Excluded Middle whether we want it or not. There is no technical middle ground here: adding Choice *is* committing to classical logic. We must treat them as a package deal.

  ### 4. Recommendation: Scoped Classical Architecture

  I propose we adopt **Option C**. This is not a vague compromise; it is a specific architectural decision used by both Coq (via modules) and Lean (via `open Classical`).

  **Why this works:**
  1.  **Kernel Integrity:** By keeping the kernel intuitionistic, we preserve the *possibility* of extraction. The PL group retains the ability to certify that specific modules (e.g., data structures, sorting) are fully constructive and extractable.
  2.  **User Experience:** We create a `Foundations.Classical` module. The Analysis group adds `import Foundations.Classical` to their root file. From that point on, `em` and `choice` are available globally. They get the `mathlib` experience (no contortions) without forcing that model on the Algorithms group.
  3.  **Explicit Boundaries:** This forces us to be explicit about where the boundary lies. If an Algorithms student tries to import a Lemma from the Analysis library, the type checker will flag that they are pulling in classical axioms. This is a *feature*, not a bug—it teaches students exactly when they are leaving the realm of computable mathematics.

  **Addressing the "Baked-In" Counter-Argument:**
  The Analysis group might argue that having to write `import Classical` is trivial but still annoying, and that we should just make it default.
  *   *Rebuttal:* If we make it default, we lose the ability to enforce constructivity in the Algorithms course. Since this project serves *two* courses with conflicting requirements, the configuration must be per-project, not global. One line of code is a negligible cost for preserving the CS research angle of the project.

  **Addressing the "Extraction" Counter-Argument:**
  The PL group might argue that even with scoped axioms, accidental leakage will occur.
  *   *Rebuttal:* We can mitigate this with linter rules or attributes (e.g., `@[constructive]`) that fail compilation if a lemma marked constructive relies on classical axioms. This is easier to enforce if the axioms are not in the kernel.

  ### 5. Implementation Plan

  If the group accepts this recommendation, I suggest the following immediate steps:

  1.  **Freeze the Kernel:** Confirm the underlying type theory remains intuitionistic (no hardcoded EM/Choice).
  2.  **Create `Classical.lean`:** A single file that defines `em : ∀ P, P ∨ ¬P` and `choice` as axioms.
  3.  **Refactor Analysis Proofs:** Move existing classical proofs to depend on `Classical.lean` rather than ad-hoc axiom declarations.
  4.  **Documentation:** Clearly mark the library hierarchy. Modules under `Analysis.*` may import `Classical`; modules under `Algorithms.*` must not.

  ### 6. Conclusion

  We are building a tool for a CS department, not a pure math institute. Our library must reflect that dual identity. A Hard Classical core sacrifices our CS identity; a Hard Constructive core sacrifices our utility for the Analysis course.

  A Constructive Core with Scoped Classical axioms allows us to say "Yes" to both: Yes, we can formalize standard real analysis without contortions. Yes, we can still extract verified code for algorithms. It requires slightly more architectural discipline, but it is the only path that keeps both use-cases viable.

  I recommend we vote to adopt the **Scoped Classical** architecture.
