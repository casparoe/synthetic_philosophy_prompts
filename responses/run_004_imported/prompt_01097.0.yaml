answer: |-
  **Setting:** *A quiet study, timeless. Books line the walls—Hume, Kant, Locke. Two armchairs face one another across a low table. P.F. Strawson (Peter) sits with a pipe unlit in his hand. Galen Strawson sits opposite, leaning forward, hands clasped.*

  **Galen:** You always did have a talent for dissolving problems, Father. But I worry that in "Freedom and Resentment," you didn't dissolve the problem of free will. You dissolved the *question*.

  **Peter:** [Smiling gently] I tried to show that the question, as the optimists and pessimists asked it, was asked from a standpoint we cannot occupy. We are here, Galen. In the world. In relationships.

  **Galen:** But that's precisely where the trouble lies. You argue that because we *cannot* abandon the reactive attitudes—resentment, gratitude, indignation—we are justified in keeping them. You compare it to Hume on induction. We can't justify induction from outside, but we can't stop using it, so we are rational to keep it.

  **Peter:** Precisely. It is a framework of intelligibility. To ask for a justification of the reactive stance from outside the reactive stance is like asking for a visual justification of sight without using the eyes.

  **Galen:** But Hume's point about induction concerns *prediction*. It concerns what we expect to happen next. Moral responsibility concerns *desert*. It concerns what is *owed*. If I say, "You deserve blame," I am making a claim about the structure of the universe and your place in it, not merely reporting on my emotional reflex. My Basic Argument shows that the condition for that claim ever being true is impossible. To be truly responsible for an action, you must be responsible for the character that produced it. To be responsible for that, you must have chosen it. And so on, *ad infinitum*. No one is *causa sui*. No one is self-created.

  **Peter:** I grant you the logic of the regress, Galen. I do. If "responsibility" requires being a prime mover, a god-like self-creator, then no one is responsible. But that is not what "responsibility" means in the life we actually live. You are defining responsibility by a metaphysical standard that has no purchase on human practice.

  **Galen:** I am not defining it by a metaphysical standard! I am defining it by the standard *your* attitudes imply. When you feel resentment, when you feel moral indignation, you are not just saying, "I am annoyed." You are saying, "You *ought* not to have done that, and you *could* have done otherwise, in a way that traces back to *you*." The reactive attitudes *presuppose* the very thing the Basic Argument proves impossible. So, you have a choice: either admit the attitudes are based on a falsehood, or admit you are changing the subject from "true desert" to "social utility."

  **Peter:** I am not changing the subject to utility. I am locating the subject. You think there is a "true desert" floating somewhere above the practices of human life, waiting to be measured against your regress. I say the "truth" of responsibility is found *in* the participation. Look, you acknowledge that we can take the "objective attitude." We can view someone as a subject for treatment, management, or study. We do this with the very young, the very ill, the deranged.

  **Galen:** Yes. When we see they are not agents.

  **Peter:** Exactly. But we cannot take that attitude toward everyone, all the time. To do so would be to cease to be human. It would be a kind of intellectual suicide. If the cost of accepting your Basic Argument is that we must view all human interaction as a management problem, then the argument, however logically sound, demands a price we cannot pay. And if we cannot pay it, then the "truth" it offers is not a truth that can govern our lives.

  **Galen:** But that is pragmatism, Father. That is saying, "It is useful to believe a fiction." If the Basic Argument is sound, then the reactive stance is a collective delusion. It is like believing the sun goes around the earth. It feels natural. It is inescapable for the untrained eye. But it is false. You are arguing that because we are psychologically committed to the Ptolemaic system, we should say the earth *is* the center.

  **Peter:** No. I am arguing that "center of the universe" is a concept that only has meaning within a framework of observation. In the framework of human relationships, you *are* a center of agency. The mistake is trying to step outside the framework to judge the framework. Your Basic Argument steps outside. It looks at human agency from the perspective of eternity, or from the perspective of physics, and says, "See? No magic self-creation." Of course there is no magic self-creation. But responsibility isn't magic. It's a status we confer on participants in a community.

  **Galen:** But does "confer" mean "create"? Or does it mean "recognize"? If I blame you, I claim to be *recognizing* a fact about your moral standing. If that fact cannot exist—because of the regress—then my blame is a mistake. You lean on the Hume analogy again. But induction works. It gets us bread. It keeps us warm. What does the reactive stance get us if it is metaphysically ungrounded? It gets us pain. It gets us retribution. It gets us the prison system justified by "desert" rather than safety. If we accepted my conclusion, we could still manage behavior. We could still quarantine the dangerous. We just wouldn't lie to ourselves that they *deserve* suffering.

  **Peter:** You speak of "lying to ourselves." But is it a lie? Or is it a different category of truth? When you love someone, Galen, do you require a metaphysical guarantee that their love is uncaused before you accept it?

  **Galen:** Love is one thing. Justice is another.

  **Peter:** Is it? Reactive attitudes are the fabric of love as much as justice. Resentment is the flip side of gratitude. If you strip out the idea that the other person is the *source* of the good or harm in a deep sense, you strip out the relationship. You reduce the other to an object. You say we could still "manage behavior." That is the objective stance. I am telling you that a world of pure objective stance is not a world of justice without illusion. It is a world without *people*.

  **Galen:** I am not asking for a world without people. I am asking for a world without *cruelty justified by metaphysics*. You say my argument requires us to view people as objects. I say your argument requires us to view people as *mysteries*. You ask us to ignore the causal chain that makes them who they are. You ask us to pretend that at some point, the buck stops with them. It doesn't. And because it doesn't, the resentment you cherish is ultimately a form of ignorance. It is ignorance of the causal history of the person standing in front of you.

  **Peter:** It is not ignorance to refuse to apply a standard that is irrelevant. Imagine a chess player who demands to know the chemical composition of the pieces before making a move. You are demanding the chemical composition of the will. I am saying the game is played with the pieces as they are. The "truth" of the move is in the rules of the game, not in the chemistry.

  **Galen:** But in chess, the pieces don't suffer. In life, they do. If I blame someone, I inflict pain. If that blame is based on a logical impossibility—the impossibility of ultimate responsibility—then the pain is gratuitous. You say the game is what matters. I say the cost of the game is too high if the rules are incoherent. You claim I am stepping outside the human framework. I claim I am looking at the framework from the only place that matters: the place where we ask, "Is this *fair*?" And fairness requires that the person could have been otherwise in a way that they authored. They cannot. So it is not fair.

  **Peter:** [Pauses, looking into his unlit pipe] You keep coming back to "authored." To "ultimate." You want a kind of responsibility that is immune to luck. Immune to history. Immune to genetics. You want a responsibility that is pure.

  **Galen:** I want a responsibility that is *true*.

  **Peter:** And I am telling you that truth is not found in the abstraction. It is found in the encounter. When you look me in the eye and I hurt you, and you feel that sting of indignation... that is not a theoretical error. That is a recognition of a breach between us. To tell you that your indignation is invalid because of a causal regress is to tell you that your experience of the breach is invalid.

  **Galen:** I am telling you the breach is real, but the *blame* is not. The breach is damage. The blame is a judgment of the soul. We can repair damage without judging the soul.

  **Peter:** Can we? Can you repair a marriage without the concept of betrayal? Can you have friendship without the concept of loyalty? These concepts carry the weight of responsibility. If you lighten that weight by removing the "ultimate" element, the concepts collapse. You are left with management. And I fear, Galen, that a world of management is a colder place than a world of resentment.

  **Galen:** A colder world, perhaps. But a clearer one. You chose to anchor responsibility in our inability to leave the human perspective. I respect that. It is a profound observation about our psychology. But you mistake the *inescapability* of the view for the *validity* of the view. We cannot help seeing the stick in the water as bent. That doesn't make it bent. We cannot help feeling ultimate blame. That doesn't make it deserved.

  **Peter:** [Leans back] Then we are at the impasse I feared. You see a bent stick that needs straightening. I see a refraction that is part of the light itself. You want to save the universe from inconsistency. I want to save the human world from alienation.

  **Galen:** And I wrote my response to "Freedom and Resentment" knowing you would not read it.

  **Peter:** [Softly] I am reading it now. And I tell you: your logic is flawless. But it is a logic for angels, or for machines. Not for fathers and sons.

  **Galen:** But we are both.

  **Peter:** [Silence stretches between them] Yes. We are both. And that is why we cannot agree.

  *[The light in the study fades, leaving the two figures in shadow, the books on the shelves standing as silent witnesses to the argument that logic could not bridge.]*
