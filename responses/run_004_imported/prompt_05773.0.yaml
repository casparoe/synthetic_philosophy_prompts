          *   **Q2 (Williamson/Lackey):** Williamson is treated fairly on Lottery. Lackey is treated fairly on the surface, but the "transmitter of evidence" move is a slight pivot from Lackey's original point (which was about *asserting P* without believing P). Williamson could argue she violates the norm but is *excused*. The draft claims she acts *properly*. This is a crucial distinction.
          *   **Q3 (Counterexamples):**
