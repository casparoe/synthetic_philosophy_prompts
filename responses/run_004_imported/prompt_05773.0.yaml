          *   *Verdict:* Generally fair, but risks simplifying the "assertion vs. testimony of evidence" distinction in the teacher case.

      *   *Question 3: Counterexamples to "Shape/Stability".*
          *   *The "Stable Falsehood" problem:* What if I have a very stable, high credence based on bad evidence (e.g., a cult member, or a reliable-looking but fake clock)?
          *   *Gettier:* I look at a stopped clock that happens to be right. My credence is high. Is it stable under scrutiny? If I check again (look at the clock), it's still the same (stopped). If I ask an expert, they might contradict.
          *   *Lottery Refinement:* What if the lottery has 10^100 tickets? Is the credence stable then? At some point, statistical evidence *does* feel like knowledge. The draft says "base rate is... the kind of consideration a single further fact... can override." But in high N lottery, a single fact (who won) overrides, but the *probability* doesn't change much.
          *   *Moore's Paradox:* "P, but I don't believe P." The bet theory explains this (I'm not staking my standing). But what about "P, but I don't know P"?
