          *   *Distinction:* Williamson wants a constitutive norm (Assertion *is* governed by Knowledge). This view says Assertion *is* a bet.
          *   *Critique:* It might be more akin to "Responsibility Norms" (Duties) rather than "Constitutive Norms." Does "staking standing" actually explain the *phenomenology* of assertion better than knowledge? Or is it just a consequentialist gloss on a deontic rule?
          *   *Verdict:* It's a sophisticated version of pragmatic encroachment applied to speech acts, but the "bet" metaphor adds a specific social cost mechanism that pure pragmatic encroachment sometimes lacks. However, it risks collapsing into a general "appropriateness" norm which is too vague.

