      *   *Key Distinction:* Kant allows killing for necessity/use, but forbids torment. Factory farming is torment + waste + commodification.
      *   *Refinement:* The argument isn't that Kant bans meat. It's that Kant bans *treatment that violates our duty to ourselves*. The scale of factory farming makes the violation of self-regarding duty *systemic*.

  9.  **Final Polish:** Ensure the distinction between *Vice* (individual) and *Structural Sin* (systemic) is addressed through Kant's lens of *Duties to Oneself* and *Maxims*. (This aligns with recent scholarship by scholars like Wood, Korsgaard, etc., though I won't name-drop unless it helps). Let's stick to the textual logic.

      *   *Key move:* The "hardening" isn't just an emotional blunting; it's a failure to recognize the *analogy* of suffering. If I structure my life to ignore massive suffering, I am actively cultivating a blindness that is incompatible with moral virtue.

