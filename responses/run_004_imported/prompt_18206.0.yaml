answer: |-
  This is an excellent tension to raise in a seminar. You are right to identify that the standard "indirect duty" summary often glosses over the *mechanism* of the wrong. If the wrong is strictly the **cultivation of a cruel disposition in a specific agent via a specific act**, then industrialized, outsourced suffering looks like it might slip through the cracks of Kant's moral net. In fact, a strict reading could imply that the "sanitized" supermarket purchase is morally safer than the farmer shooting his dog, precisely because the former leaves the consumer's sympathetic feelings untouched.

  However, to claim Kant *cannot* condemn factory farming requires a very narrow reading of "character" and "duty to oneself." Here is how you can push the argument past the cliché without forcing Kant into a position he wouldn't recognize.

  ### 1. Shift from "Sympathy" to "Moral Sensibility"
  The common reading focuses on *sympathy* (a pathological feeling). If it's just about feelings, you're right: I can buy nuggets without feeling anything. But Kant's concern in the *Doctrine of Virtue* is broader. It is about the **cultivation of moral sensibility** (*moralische Gefühl*).

  For Kant, we have a duty to cultivate our natural moral feelings because they are the "subjective conditions of receptiveness to the concept of duty." If factory farming requires me to **structurally ignore** the connection between my end (eating) and the means (mass suffering), I am actively cultivating a *blindness* to suffering.
  *   **The Argument:** It is not just that I become "hard-hearted" in an emotional sense; it is that I make myself a person whose practical reasoning *requires* the suppression of the analogy between animal suffering and human suffering. I am training myself to treat feeling beings as *mere things* as a matter of policy. That is a corruption of my rational capacity to recognize moral relevance, which is worse than a momentary loss of sympathy.

  ### 2. The Maxim of the Consumer (Complicity as Willing)
  Kantian ethics evaluates the **maxim** of the action, not just the physical motion.
  *   **The Farmer:** Maxim = "I will destroy this being because it no longer serves me." (Reveals ingratitude and tyranny).
  *   **The Factory Farm Consumer:** Maxim = "I will sustain myself via a system that treats feeling beings as industrial inputs, regardless of the suffering involved, because it is convenient."

  Even if I don't pull the trigger, I am **willing the system**. For Kant, willing an end involves willing the necessary means. If the means involve the systematic violation of the "analogy" (treating feeling creatures as mere machinery), I am endorsing that violation.
  *   **The Scale Problem:** You asked if the impersonal nature makes it *less* of a problem. A Kantian could argue the opposite: Individual cruelty is a vice; **institutionalized cruelty is a normalization of vice.** By participating in a system that makes the "hardening of heart" a requirement of the economy, I am not just corrupting myself; I am upholding a social structure that makes moral receptiveness difficult for *everyone*. This violates the duty to promote the moral well-being of others (an indirect duty to humanity).

  ### 3. The Duty to the Worker (The Missing Link)
  This is the strongest textual hook for Kant. You mentioned the workers are just "running repetitive lines." Kant would likely view the **conditions of the slaughterhouse worker** as a direct violation of duties to humanity.
  *   To do that job, the worker *must* deaden their sympathy. They must suppress their natural repugnance to violence to perform the labor.
  *   By buying the product, I am willing a system that requires **other humans to degrade their own moral character for my consumption.**
  *   In the *Metaphysics of Morals*, Kant argues we have duties to avoid treating humans in ways that reduce them to mere tools. A system that turns a human into a "stunning machine" is a violation of the dignity of the *worker*. Therefore, factory farming is condemnable not (only) because of the chicken, but because it necessitates the moral corruption of the human laborer. The consumer is complicit in corrupting the worker.

  ### 4. Ingratitude and the "Analogy"
  Kant's example of the dog is often about **ingratitude**. The dog served the human; the human discards it.
  *   Factory farming takes this to the extreme. It creates life *solely* to discard it. It is the institutionalization of ingratitude.
  *   Kant argues that because animals are "analogues" of humans, how we treat them sets a precedent for how we view humanity. If I accept a system where life is manufactured, confined, and destroyed for trivial ends (taste/convenience), I am normalizing a **logic of disposability**.
  *   **The Seminar Point:** The danger isn't just that I become mean; it's that I accept a **principle of disposability**. If I accept that feeling beings can be treated as raw material, I weaken the barrier that protects *vulnerable humans* (the disabled, the elderly, the marginalized) from being treated as raw material. The "impersonal" nature of the factory farm makes this logic *more* dangerous, not less, because it removes the emotional check (disgust/pity) that might otherwise trigger moral reflection.

  ### Conclusion for the Seminar
  You can concede that on a superficial reading, Kant's "emotional hardening" argument struggles with distance. **However**, if you interpret the duty as a **duty to oneself to maintain moral clarity**, factory farming is *worse* than the farmer shooting the dog.

  The farmer's act is a visible vice that can be recognized and condemned. The factory farm is an **invisible structural vice** that allows me to benefit from cruelty while maintaining the illusion of my own innocence. For Kant, **self-deception** is a major vice. Relying on the "impersonal" supply chain to keep my hands clean is a form of moral self-deception that dulls the rational recognition of suffering more effectively than any single act of brutality.

  So, Kant doesn't have to bite the bullet. He can argue that **systemic, depersonalized cruelty is a more sophisticated threat to moral character** because it hides the corruption from the agent, making it harder to root out.
