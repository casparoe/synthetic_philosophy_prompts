answer: |-
  **MEMORANDUM**

  **TO:** Investment and Grantmaking Committee
  **FROM:** [Your Name/Secretariat]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Payout Policy and Strategic Spend-Down Framework

  ### 1. Executive Summary

  Following the receipt of the unrestricted bequest and our mandate to "do the most good, weighing all persons and generations impartially," this memo recommends the adoption of a **2.0% annual payout rate**, coupled with a **mandatory strategic review every five years**.

  This policy represents a "Patient Philanthropy Plus" approach. It prioritizes capital preservation and compounding to respect the interests of future generations, while retaining sufficient liquidity to address pressing existential risks in the present. This recommendation explicitly hedges against the "Cluelessness Objection"—the epistemic uncertainty regarding long-term consequences—by avoiding permanent lock-in and establishing a governance structure designed to mitigate value drift and expropriation risks.

  ### 2. Interpreting the Mandate: Intertemporal Impartiality

  Our founding mandate requires us to weigh the welfare of all persons and generations impartially. This is not merely a suggestion; it is a constraint on our discount rate. Standard foundation practice (typically a 5% payout) implicitly discounts the future heavily, prioritizing current beneficiaries over future ones.

  To treat future generations impartially, we must acknowledge that a dollar invested today, if preserved and grown, can purchase significantly more "good" in the future, provided:
  1.  Financial returns exceed economic growth (allowing the endowment to grow faster than the problems).
  2.  Future interventions are more cost-effective than current ones.
  3.  The capital survives intact (avoiding expropriation or mission drift).

  ### 3. The Case for Patient Philanthropy (Steelman)

  The faction advocating for minimal spend-down (often <1%) argues from a position of rigorous intertemporal arbitrage, not complacency. Their argument rests on three pillars:

  *   **The Compounding Advantage:** At a conservative 7% nominal return and 2% inflation, a 1% payout allows the real value of the endowment to double approximately every 23 years. In a century, the foundation could wield nearly 20 times its current purchasing power. If the problems of the 22nd century are solvable, we will be vastly more impactful then.
  *   **Epistemic Humility:** We currently lack the knowledge to solve many deep structural problems. By waiting, we allow humanity to gather more information, identify clearer bottlenecks, and develop better technologies. Spending now risks "premature optimization" on interventions that may prove ineffective or counterproductive in hindsight.
  *   **Option Value:** Capital in hand is flexibility. In the event of a genuine existential catastrophe (e.g., a engineered pandemic or unaligned AI transition), liquid capital will be at a premium. A massive endowment acts as a global insurance policy, preserving the capacity to act when the marginal utility of money is highest.

  This position is not "hoarding"; it is the strategic deferral of consumption to maximize total utility across the timeline of human civilization.

  ### 4. Counter-Arguments and Risk Assessment

  #### A. The High-Leverage Present
  The opposing faction argues that the present moment is the "hinge of history." With transformative AI and advanced biotechnology emerging simultaneously, the risk of permanent civilizational collapse is non-negligible in the near term.
  *   **Risk:** If we save for the future but there is no future because we failed to mitigate an existential risk today, the compounding argument collapses to zero.
  *   **Mitigation:** A 0% payout is unacceptable. We must fund risk mitigation now. However, a 5% payout assumes the present is *permanently* more leverage-rich than the future, which contradicts the impartiality mandate.

  #### B. Institutional Risks (Drift and Expropriation)
  Capital saved for centuries faces two threats:
  1.  **Value Drift:** Future trustees may not share our longtermist commitments, diverting funds to conventional, lower-impact philanthropy.
  2.  **Expropriation:** Political instability or regulatory changes could seize or restrict the endowment.

  #### C. The Cluelessness Objection
  A deeper philosophical objection threatens both factions: We are likely too "clueless" about the long-run consequences of our actions to make century-scale expected value calculations. If we cannot predict the second-order effects of spending now, we certainly cannot predict the conditions of spending in 2124.
  *   **Implication:** If long-term EV reasoning is broken, we cannot justify *either* extreme patience *or* aggressive spend-down based on confident predictions of the future.
  *   **Resolution:** We must adopt a **robust decision-making framework** rather than an optimizing one. We should choose a policy that performs "adequately well" across a wide range of future scenarios, rather than "optimally" in one specific forecast.

  ### 5. Recommendation: The 2% Adaptive Policy

  To balance these competing risks and acknowledge our epistemic limitations, I recommend the following policy:

  **1. Payout Rate: 2.0% annually.**
  *   **Rationale:** This rate is significantly below the standard 5%, signaling our commitment to future generations and allowing for real capital growth (assuming ~5% real returns). However, it provides meaningful annual capital (2% of a large bequest is substantial) to engage with high-leverage present risks (AI safety, biosecurity).
  *   **Hedging Cluelessness:** This is a "barbell" hedge. It avoids the risk of total irrelevance (by spending nothing) and the risk of total depletion (by spending too much). It acknowledges we might be at the hinge of history, but refuses to bet the entire farm on that hypothesis alone.

  **2. Review Schedule: Mandatory Strategic Review every 5 Years.**
  *   **Mechanism:** Every five years, the Committee must vote to reaffirm, adjust, or suspend the payout rate.
  *   **Rationale:** This directly addresses the Cluelessness Objection and Value Drift. We are not making a binding decision for centuries; we are making a binding decision for five years. This allows us to update our beliefs based on new technological developments (e.g., AGI timelines) and geopolitical shifts.
  *   **Trigger Clause:** In the event of a declared Global Existential Emergency (as defined by a supermajority vote of the Committee), the payout cap may be temporarily suspended to deploy capital immediately.

  **3. Governance Safeguards.**
  *   **Mission Lock:** The foundation's bylaws must be amended to make the "impartiality of generations" clause difficult to remove (e.g., requiring a 90% trustee vote to amend).
  *   **Board Composition:** Staggered terms with a requirement that a minority of trustees possess specific expertise in longtermist risk and future generations advocacy.

  ### 6. Conclusion

  A 2% payout rate with a five-year review cycle is the most robust path forward. It honors the bequest's mandate by treating future people as moral equals, without succumbing to paralysis. It accepts the Patient Philanthropy argument that time is an asset, while conceding to the Presentist argument that the asset must be protected to exist at all.

  By refusing to claim certainty about the distant future, and instead building a mechanism to update our course regularly, we protect the foundation against the very real risks of value drift and epistemic overconfidence. We preserve the option to save the world later, while funding the work to ensure there *is* a later.

  **Action Required:**
  Please review this framework prior to our meeting on [Date]. We will vote on adopting the 2% payout policy and the 5-year review charter.
