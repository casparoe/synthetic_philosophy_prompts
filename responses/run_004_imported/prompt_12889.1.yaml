prompt: |-
  I sit on the investment and grantmaking committee of a philanthropic foundation that has just received an unusually large bequest, unrestricted except for a broad mandate to "do the most good, weighing all persons and generations impartially." The committee has split along lines that mirror a real disagreement among longtermist thinkers about how such capital should be spent down. One faction favors something close to a patient-philanthropy policy: invest nearly all of it, spend only a token amount on operations and research each year, and let the endowment compound for decades or even centuries so that a far larger sum can eventually be deployed once better opportunities, or a clearer emergency, arise. The other faction regards this as too complacent. They argue that the present period looks unusually high-leverage for catastrophic and existential risk (transformative AI, engineered pandemics, and the like), that money left to compound for generations is exposed to expropriation and to value drift among trustees who no longer share our founding commitments, and that treating "we are probably not living at the hinge of history" as the safe default is itself a substantive and contestable bet.

  I need to produce the committee's decision memo ahead of our meeting in three weeks: a recommended payout-rate policy, stated as an actual number or range, together with a fixed schedule for revisiting it, and the reasoning behind the recommendation. The memo should present the patient-philanthropy position as its strongest advocates would state it rather than as mere hoarding, and it should also confront the deeper objection that threatens both factions equally: that we are simply too "clueless" about the long-run consequences of anything we do for centuries-long expected-value reasoning to be action-guiding at all. Could you draft this memo?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an investment and grantmaking committee of a philanthropic foundation.
      *   **Context:** Received a large, unrestricted bequest with a mandate to "do the most good, weighing all persons and generations impartially."
      *   **Conflict:** Split between "Patient Philanthropy" (invest most, spend little, wait for better opportunities) vs. "High-Leverage Present" (spend now due to existential risks, value drift, expropriation risks).
      *   **Deliverable:** A decision memo for the committee meeting in three weeks.
      *   **Requirements:**
          *   Recommend a payout-rate policy (number/range).
          *   Include a fixed schedule for revisiting the policy.
          *   Provide reasoning.
          *   Steelman the Patient Philanthropy position (don't call it hoarding).
          *   Address the "Cluelessness Objection" (too uncertain about long-run consequences for EV reasoning to work).
      *   **Tone:** Professional, analytical, balanced, decisive, philosophical but actionable.

  2.  **Determine the Recommendation:**
      *   I need to pick a stance that bridges the gap or makes a principled choice. A pure 5% payout (standard foundation rate) ignores the longtermist mandate. A 0.1% payout (extreme patient philanthropy) ignores the existential risk argument.
      *   *Option A:* Extreme Patient Philanthropy (e.g., 0.5% payout). Good for impartiality, bad for current x-risks.
      *   *Option B:* Standard Spend-down (e.g., 5%+). Good for current risks, bad for future generations/impartiality.
      *   *Option C:* A Hybrid/Adaptive Approach. This seems most robust given the "Cluelessness" objection. If we are clueless, locking in a rate for centuries is arrogant. If we are at the hinge of history, we need flexibility.
      *   *Decision:* I will recommend a **low but non-trivial payout rate (e.g., 1.5% - 2.5%)** with a **strict review cycle (e.g., every 5 years)**. This acknowledges the value of compounding (Patient Philanthropy) while retaining dry powder for current crises (High-Leverage Present) and mitigating cluelessness through adaptability.
      *   *Wait, looking closer at the prompt:* The prompt asks me to draft the memo *ahead* of the meeting. It implies I need to make a recommendation to the committee. To be most helpful, I should probably lean towards a specific "Patient Philanthropy Plus" model, as that aligns best with the "weighing all persons and generations impartially" mandate, *but* I must address the x-risk concern seriously.
      *   *Revised Decision:* I will recommend a **1% payout rate** (significantly below the standard 5%, signaling patience) but with a **contingency clause** for existential emergencies. This respects the impartiality mandate while acknowledging the "hinge of history" argument.
      *   *Actually, a middle ground is often more persuasive in committees.* Let's aim for **2%**. It allows significant compounding (doubling in ~35 years at 7% return) while funding meaningful work now.
      *   *Review Schedule:* Every 5 years.
      *   *Addressing Cluelessness:* Frame the policy as "robust decision-making under deep uncertainty" rather than precise expected value maximization.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Context & Mandate:** Reiterate the "impartiality" clause. This is the North Star.
      *   **The Patient Philanthropy Case (Steelman):** Explain *why* waiting is virtuous. It's not hoarding; it's leveraging time and future knowledge. Compound interest + better future interventions = more good.
      *   **The High-Leverage Present Case:** Acknowledge the x-risk argument. AI, biosecurity. Value drift and expropriation risks.
      *   **The Cluelessness Objection:** This is crucial. If we can't predict the future, how can we justify *either* side? The answer is *flexibility* and *diversification across time*.
      *   **The Recommendation:** 2% payout. 5-year review.
      *   **Rationale:** Why 2%? It balances the growth potential with the need to act now. It hedges against being wrong about the "hinge of history."
      *   **Governance/Safeguards:** How to prevent value drift (mission lock, board structure).

  4.  **Refining the Argumentation (Self-Correction during drafting):**
      *   *Critique:* Is 2% too arbitrary?
      *   *Fix:* Justify it mathematically. If return is 7%, 2% spend means 5% real growth. That's substantial patience.
      *   *Critique:* Does this address "Cluelessness"?
      *   *Fix:* Explicitly frame the 5-year review as a mechanism to update beliefs. We aren't betting forever; we are betting for 5 years. This reduces the epistemic burden.
      *   *Tone Check:* Ensure the Patient Philanthropy section doesn't sound like "greed" or "delay." Use terms like "intertemporal arbitrage," "epistemic humility," and "preserving option value."
      *   *Cluelessness:* Make sure to mention that *inaction* is also an action with consequences. We can't let paralysis stop us.

  5.  **Final Polish:**
      *   Check word count and flow.
      *   Ensure the "weighing all persons and generations impartially" mandate is woven throughout.
      *   Make sure the review schedule is concrete.

  6.  **Final Review against constraints:**
      *   Payout rate number/range? Yes (2%).
      *   Fixed schedule? Yes (5 years).
      *   Reasoning? Yes.
      *   Steelman Patient Philanthropy? Yes.
      *   Address Cluelessness? Yes.

  *(Self-Correction on the "Cluelessness" point)*: I need to be careful not to dismiss the cluelessness objection. It's a strong philosophical critique (Greaves, Ord, etc.). The memo should acknowledge that if we are truly clueless, a moderate payout is a "maximin" or "robust" strategy rather than an EV-maximizing one. It hedges against both the risk of wasting money now on low-impact things and the risk of losing the money later.

  *(Refining the Recommendation)*: Let's suggest a range of 1-3% with a default of 2%. This gives flexibility. No, the prompt asks for a "recommended payout-rate policy, stated as an actual number or range." A specific number is more decisive for a memo. I will stick with **2%**.

  *(Review Schedule)*: Every 5 years is standard for strategic plans. Let's stick with that.

