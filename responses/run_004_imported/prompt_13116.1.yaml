      *   *Resolution:* It's not a retraction of the *diagnosis*, but a tactical shift in *method* born of desperation/necessity. In *Two Ages*, he warns against the press creating a "public." In *The Moment*, he uses the press to *dissolve* the "Christendom" public back into individuals. He isn't trying to form a new public opinion; he's trying to shatter the illusion of Christian public opinion.
      *   *Nuance:* Kierkegaard distinguishes between "publishing" (communicating truth) and "press freedom" (the mechanism of leveling). He uses the tool he hates because there is no other way to reach the individual in a leveled age.

