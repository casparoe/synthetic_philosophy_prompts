answer: |-
  You are not just being risk-averse; you are instinctively reaching for one of the most famous principles in welfare economics and political philosophy. You and your friend are reenacting the classic debate between **John Harsanyi's Utilitarianism** and **John Rawls' Difference Principle**.

  Given that you are an Econ PhD, you will appreciate that this isn't just a semantic disagreement; it is a disagreement about the specification of the **Social Welfare Function (SWF)** you are implicitly using to govern the co-op.

  Here is the breakdown of the principles at play, why your instinct is theoretically robust, and why it might be practically superior for a co-op specifically.

  ### 1. The Friend's Argument: Harsanyi and Expected Utility
  Your friend is arguing from the position of **Bayesian Rationality behind the Veil of Ignorance**.

  John Harsanyi (1953, 1955) argued that if rational individuals are behind a veil of ignorance (not knowing which role they will occupy) and they seek to maximize their own expected utility, they will choose the social arrangement that maximizes the **average utility** (or income, assuming linear utility of money).

  *   **The Logic:** If there is a $1/N$ probability of landing in any role $i$, your expected payoff is $\frac{1}{N}\sum x_i$. To maximize this expectation, you maximize the sum (and thus the average).
  *   **The Assumption:** This assumes the founders are **risk-neutral** regarding their position in the firm. It treats the co-op pay structure as a lottery ticket where the goal is to maximize the expected value of the ticket.

  ### 2. Your Argument: Rawls and Maximin
  Your instinct aligns with John Rawls' **Maximin Rule** (specifically the Difference Principle).

  Rawls argued that the "veil of ignorance" should not lead to expected utility maximization because the stakes involve one's basic life prospects. When the stakes are fundamental (livelihood, status, basic security), rational agents should not gamble. Instead, they should choose the arrangement where the **worst-off position is as good as possible**.

  *   **The Logic:** You are maximizing $\min(x_i)$. You are prioritizing the floor over the ceiling.
  *   **The Assumption:** This implies extreme **risk aversion** (lexicographic preferences), but Rawls argues this isn't irrational; it is rational when the downside risk involves unacceptable hardship or when the probability distribution is unknown (uncertainty vs. risk).

  ### 3. Is it "Just" Risk Aversion?
  Technically, yes, Maximin is a specific utility function where the marginal utility of income for the poorest member is infinite relative to the rich. However, in the context of a **worker co-op**, your instinct is supported by three additional principles that go beyond simple personal risk aversion:

  #### A. The Stability Constraint (Instrumental Rationality)
  In a conventional capitalist firm, if the lowest-paid worker quits, management hires a replacement. In a worker co-op, **labor is membership.**
  If the person in the lowest-paid role feels the distribution is unjust or their pay is too low relative to the effort/risk, they can veto the structure or simply leave. If the lowest-paid member leaves, the co-op loses a voting member, potentially jeopardizing quorum or operational capacity.
  Therefore, maximizing the minimum isn't just moral; it is **instrumentally rational for firm survival.** The "weakest link" determines the stability of the cooperative chain. Your friend is optimizing for *potential* revenue; you are optimizing for *retention* and *cohesion*.

  #### B. The Concavity of Utility
  Even standard welfare economics acknowledges the **diminishing marginal utility of income**.
  *   Gaining \$10k when you make \$40k provides a massive utility boost.
  *   Gaining \$10k when you make \$100k provides a smaller boost.
  If the "higher average" option requires depressing the lowest wage to boost the highest wage, the *total utility* of the group might actually fall, even if the *total income* rises. Unless your friend can prove that the marginal utility of money is constant for all of you, the "average payout" argument is economically flawed.

  #### C. Ex-Ante Fairness vs. Ex-Post Envy
  You are setting these rules *ex-ante* (before roles are known). However, you will live with them *ex-post*.
  If the group chooses the "High Average" rule, and you end up in the lowest role, you may experience **envy** or **resentment**, which creates transaction costs (arguing, shirking, politicking).
  Rawls argued that a society (or co-op) is more stable when the least advantaged know the system is designed to protect them. By choosing the Maximin rule, you are buying **social insurance** against future resentment.

  ### 4. A Proposal for Resolution
  Since you are economists, you can formalize this. You don't have to choose binary Utilitarianism vs. Rawlsianism. You can specify a **Generalized Social Welfare Function**, such as the Atkinson Index or a Constant Elasticity of Substitution (CES) function:

  $$ W = \left( \sum_{i=1}^{N} x_i^{1-\epsilon} \right)^{\frac{1}{1-\epsilon}} $$

  *   If $\epsilon = 0$, you are Utilitarians (Friend's view).
  *   If $\epsilon \to \infty$, you are Rawlsians (Your view).
  *   If $\epsilon = 1$, you maximize the geometric mean (a compromise).

  **The Pragmatic Pitch to Your Friends:**
  Tell them this: *"I understand the Expected Value argument. But in a co-op, the lowest-paid member has the highest propensity to quit, and their departure costs us more than the extra surplus generated by the higher-paid roles. Maximizing the floor minimizes turnover risk and maximizes group utility due to diminishing marginal returns on income. Let's maximize the minimum, provided it doesn't collapse the total surplus."*

  ### Summary
  You are not being irrationally cautious. You are advocating for a **Rawlsian Social Welfare Function** over a **Utilitarian** one. In the specific institutional context of a worker co-op—where labor is capital and membership is sticky—your position is arguably more **economically efficient** for long-term survival than your friend's, even ignoring the moral weight.

  Stick to your instinct. It's good economics.
