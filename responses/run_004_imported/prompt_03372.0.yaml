answer: |-
  **Setting:** *The locutorio of the Convent of Santa Paula, Mexico City, circa 1691. A heavy iron grille separates the interior of the cloister from the outer parlor. On one side sits Sor Juana Inés de la Cruz. On the other, Bishop Manuel Fernández de Santa Cruz. They have never met in person, though their letters have recently set the intellectual world of New Spain ablaze. The Bishop has requested this private audience before demanding her public silence.*

  **Bishop:** You know why I am here, Sor Juana. The ink on your critique of Father Vieira is barely dry, and already it circulates from the viceregal palace to the lowest tavern. You have corrected a saint. You have corrected a man. And you have done it from behind a veil.

  **Sor Juana:** I corrected an argument, My Lord. Not a man. And certainly not a saint, though I hold Father Vieira in the highest esteem. If logic finds a gap in a sermon, is it piety to ignore the gap, or to point it out so the structure may be strengthened?

  **Bishop:** Piety is knowing when a gap does not need your hand to fill it. I did not write to you as "Sor Filotea" to scold a child. I wrote to you as one admirer of intellect to another. But I must ask you: to what end? You possess a mind that would make a king jealous. Yet you are a bride of Christ. Your vocation is prayer, penance, and the care of the sisters within these walls. Instead, you treat your cell like a university. Four thousand books. Instruments for measuring the stars. Astrolabes. Microscopes. Is this the furniture of a soul preparing for heaven? Or is it the hoarding of a mind afraid to be still?

  **Sor Juana:** You frame it as a choice between God and the World. I see no such division. If God created the stars, is studying their motion not studying His handiwork? If He designed the laws of nature, is measuring them not an act of worship? To ignore His creation in favor of only His text seems to me a greater ingratitude.

  **Bishop:** It is not ingratitude. It is order. There is a hierarchy of knowledge. At the peak, theology—the study of salvation. Below that, moral philosophy—how to live. Below that, natural philosophy—the mechanics of things. Look to Boethius. He began with the subtleties of music and mathematics, but he ascended. He left the "how" to master the "why." You seem determined to crawl deeper into the "how." I call this *curiosidad*. It is an itch. It is knowledge for the sake of possession. It feeds the intellect but starves the soul.

  **Sor Juana:** With respect, My Lord, that distinction is a luxury of those who have never had to find truth with their own hands. You speak of "useful" knowledge versus "curious" knowledge. Who decides the utility? You say Boethius ascended to moral philosophy. But how can we speak of morals, of human nature, if we do not understand the physical vessel we inhabit?

  **Bishop:** Because the soul is not physical.

  **Sor Juana:** But it resides in the physical. And understanding the physical prevents error. Let me give you an example. I was once chided for studying when I should have been praying. I was told that the ancients knew all there was to know. But I watch. I pay attention. I noticed that when you fry an egg in oil, the white hardens. But if you put that same egg in boiling syrup, it does not harden; it falls apart. It remains fluid.

  **Bishop:** A kitchen triviality.

  **Sor Juana:** Is it? If Aristotle had spent less time dictating to his students and more time standing over a stove, he might have understood that heat acts differently on proteins depending on the medium. He might have written less on abstract causes and more on observable effects. Is that "curiosity"? Or is it the only way to stop us from repeating errors? If I learn why the egg behaves as it does, I understand the properties God gave the matter. How is that not useful? How is that not a step toward understanding the consistency of His laws?

  **Bishop:** Because it leads nowhere but to more questions. You solve the egg, then you ask about the oil, then the fire. It is an infinite regress. It distracts you from the one question that matters: *Am I saved?* Your intellect is a horse, Sor Juana. It is powerful. But if you let it run wherever it smells water, it will run off a cliff. It needs a rider. That rider must be Faith, not Observation.

  **Sor Juana:** And if Faith tells me that Truth cannot contradict Truth? If God is the author of both Scripture and Nature, and my observation of Nature seems to conflict with a reading of Scripture, is it not my duty to check the reading?

  **Bishop:** *[Leans closer to the grille]* Now we touch the nerve. You speak of reading Scripture. You speak of correcting preachers. This is not about eggs. This is about authority. You cite Saint Paul: "Women should keep silent in the churches." You argue in your letter that this applies only to public preaching from the pulpit. That it does not forbid private writing or theological discussion.

  **Sor Juana:** It is a plain reading of the text. I am not in the pulpit. I am in my cell. I am not commanding the faithful; I am discussing ideas with a peer.

  **Bishop:** But your cell has no walls anymore. Your words are printed. They are read by merchants, by students, by women who should be spinning wool. When you write, you teach. When you teach theology, you assume a priestly function. Do you see the danger? It is not that I believe you lack the capacity to reason. God forbid. You reason better than half the clergy in Mexico. The danger is Pride.

  **Sor Juana:** Pride?

  **Bishop:** To believe that your judgment supersedes the tradition of the Church. To believe that your "curiosity" is a higher calling than your obedience. When you publish a critique of a sermon, you invite the world to judge the Church by your standards, not God's. You make yourself the arbiter. That is the serpent's offer. *You shall be as gods, knowing good and evil.*

  **Sor Juana:** *[Pauses, looking down at her hands]* I know the accusation. I have felt it. But tell me, My Lord: if God gave me this mind—if He gave me the capacity to understand Kircher's theories on the subterranean fires, to calculate the stars, to parse the logic of a sermon—and I buried it in the dirt because I was told it was "unfeminine" or "too curious"... would that not be the greater pride? To assume my judgment of what is "useful" is superior to God's gift?

  **Bishop:** No. Because the gift is given for a purpose. A sword given to a soldier is not meant for carving meat. You have a sword of immense sharpness. I am asking you to sheath it, not because it is dull, but because you are using it in a kitchen.

  **Sor Juana:** But the kitchen is where I live! You speak of the "world" as if it is out there, in the plaza. My world is here. My instruments are here. My books are here. If I cannot seek God in the ink and the oil and the stars, where am I to seek Him? In silence alone? But silence is empty. I fill it with His creation.

  **Bishop:** You fill it with *yourself*. That is the crux. When you write, when you argue, when you dissect an egg or a sermon, who is at the center of the picture? The glory of God? Or the glory of Sor Juana? If you were truly humble, you would be content to let others interpret the world while you interpret your soul.

  **Sor Juana:** And if my soul *requires* the interpretation of the world to find God? You say Boethius moved on. But what if he was wrong? What if the "subtleties" are the very threads that hold the robe together? You worry I am proud. I worry you are lazy.

  **Bishop:** *[Stiffens]* Careful.

  **Sor Juana:** I mean no disrespect. But there is a laziness in accepting authority without testing it. You call it obedience; I call it a failure of stewardship. God gave us senses. He gave us reason. To blunt them is to return the talent to the master wrapped in a napkin. As for the silence in church... I will not preach from the pulpit. I will not claim the power of orders. But I will not pretend to be less than I am. If my writing causes scandal, perhaps the scandal is not in my pen, but in the expectation that a woman should be less than human.

  **Bishop:** It is not about being less than human. It is about order. The body has many parts. The eye does not try to be the hand. You are the eye of this colony, Sor Juana. Everyone knows it. But an eye that tries to walk will stumble, and the body will fall. I am not asking you to stop thinking. I am asking you to stop publishing. Keep your eggs. Keep your astrolabes. Write for your sisters. But do not send your thoughts out to wrestle with the bishops. That is not your station.

  **Sor Juana:** So the disagreement is not about the truth of the egg. Nor the logic of the sermon. It is about the gate.

  **Bishop:** It is about the gate. Truth is dangerous in the wrong hands. Not because the hands are weak, but because the world is weak. They will read your work and see a woman defeating a man, and they will not see the logic. They will see chaos. They will see the overturning of order. I am responsible for that order.

  **Sor Juana:** And I am responsible for the truth I perceive. If I see a thing clearly, I cannot unsee it. I can remain silent, yes. I can burn my papers. But do not tell me it is because my curiosity is illicit. Call it what it is: it is inconvenient.

  **Bishop:** *[Sighs, the tension leaving his shoulders]* It is inconvenient. I grant you that. You are an inconvenience to the easy order of things. But Sor Juana... consider the cost. You trade your peace for a footnote in history. I trade my comfort to protect the peace of the Church. We are both serving. We just disagree on the master.

  **Sor Juana:** I hope the master is the same. The God of the Stars and the God of the Silent.

  **Bishop:** He is. But He speaks to me through the hierarchy, and to you through the creation. It is a difficult bridge to cross. *[He stands]* I will not demand you burn the books today. But I ask you: before you send the next letter to the press, ask yourself. Is this for Him? Or is it for the itch?

  **Sor Juana:** *[Rises as well]* And I ask you, My Lord: before you demand my silence, ask yourself. Is this for Order? Or is it for the comfort of those who fear the egg might prove them wrong?

  **Bishop:** *[A faint, weary smile]* We are at an impasse.

  **Sor Juana:** We are. But at least we are clear. You do not think I am incapable.

  **Bishop:** I think you are capable of great harm. And great good. I pray you choose the latter. Even if it means the world hears less of you.

  **Sor Juana:** And I pray, My Lord, that the Church learns that truth, wherever it is found, is never truly disorder.

  *[The Bishop bows slightly. Sor Juana curtsies. He turns to leave the parlor. She remains at the grille, looking not at the door, but at the light filtering through the iron bars, casting a grid of shadows on the floor.]*
