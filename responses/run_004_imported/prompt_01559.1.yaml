      *   *Synthesis:* Pascal avoids the *full* force of the Mugging because his scenario is a **forced choice between two specific options** (God/No God), whereas Mugging exploits an **unbounded hypothesis space**. However, the "Many Gods" objection is essentially the Mugging applied to theology. Pascal blocks it by asserting the specific revelation of Christianity makes that hypothesis salient/probable compared to others, whereas the Mugger has no such salience.

