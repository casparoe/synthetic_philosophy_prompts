      *   **Future Standard/Policy:** Suggest a distinction between *Misconduct* (ethical breach) and *Questionable Research Practices (QRPs)* or *Communication Standards*. Recommend the university adopt guidelines on "calibration of claims" without making it a punishable offense.
      *   **Next Steps/Timeline:** Vote at Friday's meeting, notify parties within 5 days, refer to Graduate Council/Dept for educational workshop.

  4.  **Refining the Tone:**
      *   Must sound like an administrative memo, not a philosophy paper. Avoid jargon like "Williamson" or "Lackey" explicitly unless it helps clarify, but use the *concepts* (knowledge norm vs. justification). Actually, given the user is an epistemologist, they might appreciate the concepts, but the *committee* members (likely scientists, admins, lawyers) might not. *Decision:* Keep the philosophical concepts implicit but rigorous. Use terms like "epistemic warrant," "calibration of certainty," "norms of assertion."
