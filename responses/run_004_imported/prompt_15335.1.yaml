      *   **Philosophical Undercurrent:** The user sees this as an assertion norm debate (Knowledge Norm vs. Justified Belief/Reasonable Belief Norm). Complainants $\approx$ Williamson (Knowledge); Authors $\approx$ Lackey/Standard Scientific Practice (Justified Belief).
      *   **Committee Policy:** Misconduct = Fabrication, Falsification, Plagiarism (FFP). Excludes honest error. Silent on overclaiming.
      *   **Requirements:**
          *   Specific recommendation (dismissal, finding short of misconduct, referral, etc.).
