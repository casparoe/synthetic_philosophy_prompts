  *(Self-Correction during drafting)*: Wait, if I'm the Grad Rep, do I have the authority to issue a recommendation memo to the whole committee? Usually, the Chair circulates the agenda. But the prompt says "draft the short memo I'm supposed to circulate before Friday's meeting." I will frame it as a "Position Statement/Recommendation" to inform the committee's vote.

  Let's refine the philosophical engagement. The complainants argue that asserting $P$ requires knowing $P$. The authors argue asserting $P$ requires having good evidence for $P$. In science, we rarely *know* $P$ (in the infallible sense). We have high confidence. The memo needs to explain why adopting the "Knowledge Norm" would paralyze science, while acknowledging the "Justification Norm" allows for error.

