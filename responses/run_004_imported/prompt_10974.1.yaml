      *   **Tone:** Analytical, philosophical, economically rigorous, suitable for a magazine feature.

  2.  **Initial Brainstorming & Concept Mapping:**
      *   *Moral Trade:* Based on the idea that utility functions differ. I care about X, you care about Y. I do X for you, you do Y for me. Net moral utility increases.
      *   *Comparative Advantage:* Requires trust/enforcement. In international trade, contracts are enforceable by law, reputation matters, goods are visible.
      *   *Adverse Selection (Hidden Type):* Before the deal. Who is actually a "moral trader"? If I claim to be a utilitarian willing to trade, am I really? Or am I a egoist pretending to trade to get you to do something I want without reciprocating?
      *   *Moral Hazard (Hidden Action):* After the deal. Did you actually buy the leather? Did you actually stop eating factory meat? Monitoring is hard.
