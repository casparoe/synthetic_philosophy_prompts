  4.  **Addressing the "Fundamental vs. Practical" Question:**
      *   Is it just a bug to fix (e.g., better signaling)? Or does it break the analogy?
      *   *Argument for Fundamental:* The "currency" of moral trade is *integrity*. If integrity is tradable, it ceases to be integrity. This is the "commodification of morality" critique.
      *   *Argument for Practical:* Communities can build reputation systems (like effective altruism groups).
      *   *Decision:* It strikes at the *mechanism* of comparative advantage because comparative advantage assumes enforceable exchange. If the "goods" are inherently non-contractible, the market model fails structurally, not just frictionally.

  5.  **Addressing the Counter-Point (Where Morality Resists Market Failure):**
      *   Internal sanctions (guilt) vs. External sanctions (fines).
