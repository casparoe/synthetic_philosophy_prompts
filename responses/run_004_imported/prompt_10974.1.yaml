      *   **The Adverse Selection Problem (The "Fake Utilitarian"):** Focus on *Hidden Type*. Before the trade, how do I know you value the trade? If the goal is "doing good," pretending to trade to get free moral labor is a dominant strategy for non-moral actors. This drives sincere traders out.
      *   **The Moral Hazard Problem (The "Secret Burger"):** Focus on *Hidden Action*. Monitoring costs. In trade, we use escrow/third parties. In morality, conscience is the only escrow. If conscience is flexible (motivated reasoning), the contract is void.
      *   **The Collapse of the Analogy (Fundamental vs. Practical):** This is the crux. Comparative advantage relies on *credible commitment*. In economics, law/reputation provides this. In morality, the commitment *is* the good. If you need external enforcement, it's not moral trade, it's bribery. If you rely on internal enforcement, it's unobservable. This suggests a structural flaw, not just a wrinkle.
