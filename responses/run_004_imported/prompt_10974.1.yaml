answer: |-
  This is a exceptionally sharp critique. You have correctly identified that Toby Ord's proposal, while theoretically elegant, imports the assumptions of neoclassical trade theory into a domain where the fundamental mechanisms of enforcement and verification are missing.

  To construct the strongest argument that moral trade is vulnerable to a dual collapse via adverse selection and moral hazard, we need to treat moral commitments not as immutable preferences (as standard economics often does) but as *claims* that are subject to strategic manipulation.

  Here is the argument structured for your feature, moving from the specific economic mechanisms to the question of whether this is a bug or a feature of the theory.

  ### 1. The Adverse Selection Problem: The Market for "Moral Lemons"

  In George Akerlof's classic "Market for Lemons," asymmetric information drives high-quality goods out of the market because buyers cannot distinguish them from low-quality goods. In moral trade, the "quality" of the trader is their sincerity.

  **The Mechanism:**
  For a moral trade to occur, Party A (Vegetarian) must believe that Party B (Omnivore) actually holds the moral view they claim to hold (e.g., "I care about animal welfare, but only regarding factory farming").
  *   **The Sincere Trader:** Incurs a genuine psychic cost to uphold their end of the bargain (e.g., giving up leather).
  *   **The Insincere Trader (The "Moral Free Rider"):** Claims to hold the view to secure the concession from the Sincere Trader, but has no intention of upholding their end, or holds the view so weakly that they will renege at the first temptation.

  **The Collapse:**
  In a standard market, if I sell you a bad car, you sue me or leave a bad review. In moral trade, the "product" is a change in private behavior based on a private conviction. If the Omnivore agrees to stop eating factory meat but secretly continues, the Vegetarian cannot verify this without incurring prohibitive monitoring costs (hiring a private investigator to track the Omnivore's lunch).

  Because the Sincere Trader cannot distinguish the Insincere Trader ex-ante, they must discount the value of the proposed trade based on the *probability* of defection. As the discount rate rises, the expected utility of the trade drops. Eventually, for the Sincere Trader, the risk of being exploited (giving up leather for no reduction in animal suffering) outweighs the potential gain. They exit the market. The remaining market is dominated by Insincere Traders looking for easy concessions. This is the classic adverse selection spiral: the "lemons" (hypocrites) drive out the "peaches" (saints).

  ### 2. The Moral Hazard Problem: Unenforceable Contracts

  Even if we solve the selection problem (perhaps the parties know each other well), we face moral hazard: the risk that one party changes their behavior *after* the deal is struck because the action is hidden.

  **The Mechanism:**
  In international trade, comparative advantage works because contracts are enforceable by international law, or at least by the threat of future trade sanctions. If Country A stops buying wheat, Country B stops selling steel.
  In moral trade, the enforcement mechanism is supposed to be *internal* (conscience) rather than *external* (law).

  **The Collapse:**
  This creates a unique vulnerability. In a commercial contract, if I fail to deliver, I lose money. In a moral contract, if I fail to deliver, I might actually *gain* utility (I get the leather from you, and I still eat my factory burger).
  The "cost" of breaking a moral promise is guilt. But guilt is subjective and malleable. A rational actor can engage in **motivated reasoning** to lower the psychic cost of defection. The Omnivore can tell themselves, "Well, the vegetarian is already buying leather, so my one burger doesn't matter," or "The pasture-raised farm I supported went bankrupt, so I'm off the hook."

  Because the "enforcement officer" (the conscience) is employed by the potential defector, the contract is structurally unenforceable. This invites moral hazard: once the Vegetarian has bought the leather (a visible, sunk cost), the Omnivore has a dominant strategy to defect on the meat restriction (an invisible action). Anticipating this, the Vegetarian never buys the leather. Trade volume collapses to zero.

  ### 3. Is This a Wrinkle or a Theoretical Undercutting?

  This is the crux of your feature. Is this merely a frictional cost (like shipping fees in international trade), or does it break the comparative advantage analogy?

  **The Argument for "Theoretical Undercutting":**
  It undercuts the analogy because **comparative advantage relies on the transferability of utility.**
  In standard economics, if I trade you wheat for steel, I don't need to trust your *motives*, only your *delivery*. The goods are alienable; once you hand me the steel, it's mine, and you can't take it back.
  In moral trade, the "goods" are *moral states of affairs* contingent on *moral agency*.
  *   If the Omnivore eats the burger secretly, the "good" (reduced suffering) never comes into existence.
  *   If the Omnivore eats the burger openly but claims it was an accident, the "contract" is voided by subjective interpretation.

  The economic model assumes that preferences are **revealed** by action. But moral trade requires that preferences be **stated** prior to action, and then **maintained** despite counter-incentives. This inverts the standard economic model. In standard trade, we assume actors are self-interested and enforce contracts externally. In moral trade, we must assume actors are *other*-interested (altruistic) and enforce contracts internally.
  If you need external enforcement to make moral trade work (e.g., public shaming, binding contracts), it ceases to be "moral" trade and becomes standard coercion or bribery. If you rely on internal enforcement, the information asymmetry is too high for a market to clear.

  Therefore, the problem is not just practical; it is **categorical**. The "currency" of moral trade is integrity. But integrity is only valuable if it is not traded for gain. The moment you introduce the incentive structure of a market (I give X to get Y), you potentially crowd out the intrinsic motivation required to make the trade honest. This is known in psychology as the **overjustification effect** or "motivational crowding out." By treating moral concessions as tradable commodities, you may degrade the very commitment that gives them value.

  ### 4. Where Morality Might Resist Market Failure (The Nuance)

  To be fair to Ord, there are respects in which moral commitments might resist these failures better than ordinary goods, which you should acknowledge to maintain balance.

  1.  **Identity Signaling:** In ordinary markets, I might lie about liking a car to get a deal. In moral communities (like Effective Altruism groups), moral views are often tied to *identity*. Faking a moral view risks social exile if discovered. The "reputation collateral" in tight-knit moral communities can be higher than the financial collateral in anonymous markets.
  2.  **Internal Sanctions:** While I argued guilt is malleable, for sincere believers, the cost of hypocrisy is not just a fine; it is cognitive dissonance. For a true vegetarian, eating meat might cause genuine psychological distress that acts as a stronger enforcement mechanism than a lawsuit.
  3.  **Repeated Games:** Moral trade is rarely a one-off transaction. It happens within communities. In game theory, the "Shadow of the Future" can sustain cooperation even without contracts. If I cheat you on a moral trade, I lose the ability to trade with you (and your network) forever.

  ### 5. Synthesis for the Feature

  The strongest conclusion for your piece is this:

  Ord's analogy holds **mathematically** but fails **institutionally**.
  Mathematically, yes, if Party A values X more than Y, and Party B values Y more than X, swapping them increases total utility.
  Institutionally, markets require **verification** and **enforcement**.
  *   Commercial markets solve this with law, money, and tangible goods.
  *   Moral markets lack these. They rely on trust and conscience.

  The vulnerability to adverse selection and moral hazard isn't just a "bug" to be fixed with better apps or contracts; it points to a fundamental difference between *economic value* (which is agnostic about the source) and *moral value* (which is often deontological or virtue-based). If the moral value of an action depends on the *reason* it was performed (e.g., "I didn't eat the meat because it's wrong" vs. "I didn't eat the meat because you paid me with leather"), then the trade itself might nullify the moral gain.

  **The Hook:**
  You might frame it this way: *Economic trade works because we don't have to agree on why we want the goods, only that we do. Moral trade fails precisely because we cannot verify why we want the goods, and the act of trading them changes the reason.*

  This suggests that while moral trade is a beautiful heuristic for finding common ground, treating it as a rigorous market mechanism invites a collapse where the most cynical actors exploit the most sincere, leaving the "market for morality" in a state of equilibrium where no trade occurs at all.
