answer: |-
  Good evening, everyone. For those who don't know me, I'm the Best Man. Which, in this specific context, mostly means I'm the guy who read *Being and Nothingness* so Danny didn't have to finish it alone.

  If you look closely at my nan over there, she's already asleep. That's a normal reaction to Sartre. But Danny and Mia met in a book club that decided, for reasons lost to history, to spend four months reading it. And apparently, nothing bonds two people faster than mutual existential dread over the chapter on "Bad Faith."

  Now, I'm not a philosopher. I'm a guy with a library copy and a lot of confused highlighting. But because Danny made me read it, I learned something about why this marriage works. And it's actually the opposite of what you usually hear at weddings.

  See, Sartre argues that "Bad Faith" is a two-way trap. It's a pincer movement.

  On one side, you have the trap Danny lived in for about a decade before he met Mia. This is the trap of refusing to be anything. It's the guy who says, "I'm just keeping my options open," or "I can't settle down, it's not who I am." You pretend you're pure freedom, a ghost with no shape, so you never have to take responsibility for a choice. We all know that Danny. The Danny who thought buying a houseplant was a commitment issue. The Danny who once dated a woman for three months because he couldn't figure out how to break up without "defining the relationship."

  Sartre says that's a lie. You aren't a ghost. You're a person who has to choose.

  But—and here is the part for Mia's book club friends, try not to roll your eyes too visibly—there is the *other* trap. The one weddings are famous for. This is the trap of treating yourself like a fixed object. It's saying, "We're soulmates," or "It was fate," or "We were always meant to be." It sounds romantic, but philosophically? It's lazy. It erases the work. It pretends you didn't choose this; it pretends the universe chose it for you so you don't have to wake up tomorrow and choose it again.

  So, Danny and Mia are standing in the middle of this existential minefield. And the reason I'm standing here, and the reason they're so happy, is that they've managed to dodge both bullets.

  Danny, you aren't the commitment-phobe anymore. You've accepted that you are a "fiancé," and soon a "husband." You've taken on a shape. You've accepted the facticity, to use the jargon.

  And Mia, you know better than anyone that Danny isn't a fixed object. You know he's not a "husband" in the way a table is a table. He's a human being who could choose otherwise every single morning. And the miracle isn't that you're "meant to be." The miracle is that you *know* you aren't meant to be, in any cosmic sense, and you look at each other anyway and say, "I am choosing this. I am choosing you."

  That is what authenticity looks like. It's not a magic spell. Signing the register today doesn't switch off your freedom. It doesn't turn you into a finished product. It just means you've agreed to build something difficult together, consciously, without the safety net of "fate" to blame if things get hard, and without the escape hatch of "I need to find myself" if things get boring.

  Danny, my advice—and I say this as a man who highlighted page 45 three times and still doesn't fully get it—is don't let the wedding turn you into a statue. Don't think, "Right, I'm married now, the choosing is done." The choosing is just starting.

  And Mia, thank you for dragging him out of the first trap, and for being sharp enough to help him avoid the second.

  So, if everyone could raise a glass.

  To Danny and Mia. May you never pretend you had no choice. May you never pretend you don't have to keep choosing. And may you always find the courage to be authentically, terrifyingly free... together.

  To the happy couple!
