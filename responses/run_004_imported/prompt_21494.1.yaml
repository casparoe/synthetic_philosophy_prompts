  Lin: "Who is the 'I' that loses them? The 'I' is already changing."
  Sarah: "But the *potential* is real."
  Lin: "Potential is a ghost."
  ...
  Okay, let's write it.

  *(Post-Drafting Review)*: Make sure the ending feels like a pause, not a conclusion. They are working a night shift; the conversation is part of the work.

  *(Final Tweak)*: Ensure Lin doesn't sound *too* mystical. He's a chaplain; he deals with real grief. He needs to ground the metaphysics in care. Ensure Sarah doesn't sound cold; she defends the value of the individual life because she cares about patient rights and dignity.

