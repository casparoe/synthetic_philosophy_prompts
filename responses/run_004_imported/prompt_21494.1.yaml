answer: |-
  **SCENE START**

  **INT. HOSPITAL BREAK ROOM - 3:00 AM**

  The hum of the refrigerator is the only constant sound. The lights are too bright, buzzing faintly. 

  LIN (50s), wearing a clerical collar under a loose, grey sweater, stirs a cup of tea. SARAH (40s), in a blazer that has seen better hours, stares into a black coffee. On the table between them lies a file folder, closed.

  SARAH
  It's not the state of being dead that terrifies them, Lin. It's the subtraction.

  LIN
  Subtraction implies there was a sum to begin with. A fixed quantity.

  SARAH
  There is. A life. A specific, biographical trajectory. When Mr. Henderson dies tonight, the world loses the next ten years of his contribution. His grandchildren he won't meet. The books he won't read. That is a harm.

  LIN
  A harm to whom?

  SARAH
  To him.

  LIN
  (Pauses, sips tea)
  Thomas Nagel would agree with you. The deprivation account. Death is bad because it deprives the subject of the goods of life they would otherwise have experienced. But tell me, Sarah: where is this subject standing when the harm occurs?

  SARAH
  That's the point. They don't have to be standing. You don't have to experience a harm for it to be a harm. If a friend betrays you behind your back, you are harmed even if you never know. If a man is robbed while he sleeps, he is worse off, even if he wakes up happy. Death is the ultimate robbery.

  LIN
  But the sleeping man wakes. The betrayed friend might find out. Henderson, once dead, is not a sleeping man. He is not a man at all. You are positing a ghost. You are saying, "There is a Henderson-shaped hole in the universe, and that hole is suffering."

  SARAH
  The hole isn't suffering. The loss is objective. Look at the asymmetry. We don't weep for the time before we were born. Lucretius made this point, Nagel refined it. We don't dread the eons of non-existence behind us. Why dread the eons ahead?

  LIN
  Because the "you" that exists now projects forward. It cannot project backward.

  SARAH
  Exactly. And that projection is the basis of all human planning, all value. If I tell a patient, "Don't fear death, it's just a transformation," I am asking them to sever that projection. I am asking them to invalidate the very thing that makes their life meaningful: their future.

  LIN
  (Softly)
  I am not asking them to invalidate their life. I am asking them to stop confusing the wave with the water.

  SARAH
  The wave crashes, Lin. The wave ends.

  LIN
  The water remains. Zhuangzi's wife died. His friend Hui Shi came to offer condolences and found Zhuangzi sitting on the floor, drumming on a tub and singing. Hui Shi was horrified. "She bore your children," he said. "To sing is too much."

  SARAH
  It sounds like sociopathy.

  LIN
  It sounds like it, until you hear the reasoning. Zhuangzi said he grieved at first, like any man. But then he looked back to before she was born. Before she had a body. Before she had even *qi*. She was a mist in the great clod of earth. Then she changed into life. Now she has changed again, into death. It is like the progression of spring, summer, autumn, winter. To weep as if she were gone forever is to show I do not understand fate. So he stopped.

  SARAH
  But Zhuangzi was Zhuangzi. He was a philosopher. Most people are not knots of cosmic energy to themselves. They are parents. They are engineers. They are *somebody*. When you tell a dying man he is just *qi* condensing and dispersing, you aren't comforting him. You're erasing him.

  LIN
  Am I? Or am I relieving him of the burden of holding himself together when his hands are already slipping? You speak of harm, Sarah. You say death harms the patient because it takes away their future. But who is the "their"? It is a temporary knot in the flow. If I hold a handful of water, and I open my hand, have I harmed the water?

  SARAH
  You haven't harmed the water. But you've emptied the hand. And the hand is what matters to the person holding it.

  LIN
  The hand is part of the flow too.

  SARAH
  (Leans forward)
  Here is my objection to your drumming on the tub. If death is merely a transformation, no different than birth, then nothing is lost. If nothing is lost, then nothing is gained. If the knot untying is no different than the knot tying, then the struggle to live, to cure, to alleviate pain... it's all theater. Why do you sit by Henderson's bed? Why give morphine? If he's just changing form, let him change.

  LIN
  (Steady)
  I give morphine because the knot is tight *now*. The transformation is painful *now*. Daoism is not nihilism. We do not hasten death. We do not ignore pain. We simply refuse to add the terror of annihilation to the pain of dying. You want to comfort them by promising them more time. I comfort them by showing them that time is not theirs to keep.

  SARAH
  But it *is* theirs. That's the ethical baseline. Autonomy. Rights. They belong to a subject. If you dissolve the subject into the cosmos, you dissolve the rights. You can't have bioethics without a self to protect.

  LIN
  And you can't have a good death without letting go of the self. You argue that death is bad because it deprives the subject of goods. But this relies on a counterfactual. "He would have lived ten more years." How do you know? Maybe he would have been miserable. Maybe he would have suffered. You are mourning a hypothetical life that never existed.

  SARAH
  I am mourning the *possibility*. Possibility is the currency of human life.

  LIN
  Possibility is a ghost. It haunts the living, not the dead. You say we don't fear pre-natal non-existence because we can't look back. I say we don't fear it because it is the truth of our origin. We came from nowhere. We go to nowhere. The fear is not in the destination, Sarah. It is in the grip.

  SARAH
  The grip is life.

  LIN
  The grip is tension.

  SARAH
  (Sighs, rubs her temples)
  Let's try the skull. Zhuangzi found a skull on the road. Asked it if it died from war, or shame, or cold. That night, the skull came to him in a dream. Said, "In death, there are no rulers above, no subjects below. No seasons. I am happy as a king." Zhuangzi offered to bring it back to life. The skull refused. "Why would I give up kingly joy for human toil?"

  LIN
  (Nods)
  A powerful story.

  SARAH
  It's a fantasy. It's a coping mechanism for the terror of the unknown. You're using a dream to validate the idea that death is preferable to life. That's dangerous in a hospice. If a patient believes death is "kingly joy," they might stop eating. They might refuse treatment that could give them five good years.

  LIN
  Zhuangzi didn't bring the skull back. He let it be.

  SARAH
  Because it was a story! In this room, we have real people. And for them, death is not a dream. It is a cessation. Nagel's point about the asymmetry isn't just about perspective. It's about directionality. Life moves forward. Consciousness is an arrow. To stop the arrow is to break it. You can say the wood remains, the feathers remain... but the flight is over. And the flight was the point.

  LIN
  Was it? Or was the flight just the wind moving through the feathers?

  SARAH
  (Sharp)
  To the arrow, the flight is everything.

  LIN
  To the arrow? The arrow feels nothing.

  SARAH
  The *person* is the arrow.

  LIN
  No. The person is the wind *and* the arrow. And when the arrow falls, the wind does not stop. You are terrified, Sarah, not for Henderson, but for the story you tell yourself about Henderson. You need him to be a discrete unit because if he isn't, then you aren't either. And if you aren't a discrete unit, who is it that will die when your time comes?

  Sarah goes still. The refrigerator hums. She looks at her coffee, then at Lin.

  SARAH
  I don't need him to be a discrete unit for my sake. I need it for his. Because if he's just... energy... then his suffering was just physics. Friction. Heat. If he's a self, his suffering was a tragedy. And tragedy demands witness. It demands that we say, "This should not have happened."

  LIN
  (Quietly)
  And if I say, "This is exactly what should have happened. It is the nature of the thing," do I fail to witness?

  SARAH
  You witness the process. I witness the person.

  LIN
  Perhaps the person is just the process experiencing itself for a moment.

  SARAH
  Then the moment matters more than the process. Because the process is blind. The moment sees.

  LIN
  (Smiles faintly)
  And when the eye closes, does the sight vanish? Or does it return to the light that made it possible?

  SARAH
  It vanishes. That's the cost of sight. It's expensive. It costs everything.

  LIN
  Then let us not make the price higher by fearing the payment.

  SARAH
  I'm not afraid of the payment. I'm afraid of the theft.

  LIN
  Nothing is stolen. Everything is returned.

  SARAH
  (Shakes her head, standing up)
  Tell that to the widow in the waiting room. She doesn't feel like she's getting her husband back. She feels like she's been robbed.

  LIN
  (Standing as well)
  I will sit with her. I will not tell her she is wrong to feel robbed. I will sit with her until she feels the wind again.

  SARAH
  (Pauses at the door)
  You know Nagel's argument doesn't actually say death is painful. It says it's a misfortune.

  LIN
  And Zhuangzi's argument doesn't say life is meaningless. It says it is a dream within a dream.

  SARAH
  We're not going to agree.

  LIN
  No. But the night is long enough for both of us to be right.

  Sarah exits. Lin stays. He picks up his tea. It has gone cold. He drinks it anyway, listening to the hum of the machine, the silence of the hall, the rhythm of the building breathing.

  **SCENE END**
