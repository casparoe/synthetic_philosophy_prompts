prompt: |-
  I'm doing a PhD in philosophy (mostly social ontology / phil language stuff) and we just spent two whole seminar sessions on David Lewis's *Convention*, grinding through the coordination-equilibria-plus-common-knowledge machinery. It's put me in the annoying position of overanalyzing my own house. Three of us live together, and there's this norm where whoever notices we're out of a staple -- coffee, dish soap, toilet paper, whatever -- just quietly buys more themselves, no reimbursment, no discussion. As far as I can tell it started because one housemate did this once back in year one and it just... stuck. Two of us definately think it's a bad system since it obviously screws over whoever burns through stuff fastest, and we'd rather do a shared kitty everyone tops up monthly. Every time it comes up at "house meeting" everyone nods along that the kitty is better, and then nothing changes and we're back to the old pattern within a week.

  Using Lewis's actual account of what makes something a convention in the first place -- the arbitrariness condition (there has to be a real alternative regularity that would've worked just as well), the common knowledge requirement, and especially his stuff on precedent as a source of salience that makes one equilibrium self-perpetuating -- what does his theory imply about why we're stuck, and about what it would actually take for a small group like ours to shift onto a new convention? I'm especially curious whether his framework predicts that everyone privately agreeing the kitty is superior should be almost beside the point, and whether "let's all just agree to switch" at a house meeting even counts as the kind of common-knowledge-generating event his theory requires, or whether that's smuggling in more than the theory can actually license. Don't just recap the book's definitions for me -- I want the implications actually worked out for a case like this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in philosophy (social ontology/phil language).
      *   **Context:** Just finished seminar sessions on David Lewis's *Convention*.
      *   **Problem:** Applying Lewis's theory to a real-life housemate situation (staple-buying norm vs. proposed kitty system).
      *   **Specific Constraints:** Do *not* just recap definitions. Work out the implications for this specific case. Address the "arbitrariness," "common knowledge," and "precedent/salience" conditions. Address whether the house meeting agreement counts as sufficient common knowledge/salience to shift conventions.
      *   **Tone:** Academic but applied, rigorous, acknowledging the user's expertise (no baby steps), slightly conversational (since it's a housemate story).

  2.  **Deconstruct the Lewisian Framework (Mental Check):**
      *   *Definition of Convention:* A regularity $R$ in a population $P$ in a recurrent situation $S$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on the condition that others do (coordination equilibrium).
          4.  There is an alternative regularity $R'$ that could have solved the coordination problem (Arbitrariness).
          5.  All the above are *common knowledge* (CK).
      *   *Salience/Precedent:* How do we pick an equilibrium? Past success makes a solution salient. "We did it this way before, it worked, so we do it again."
      *   *Agreement:* Lewis is skeptical of agreement *alone* creating convention without the backing of expectations and conditional preferences. Agreement works if it creates CK of intentions to conform.

  3.  **Apply to the Housemate Case:**
      *   *Current State:* "Quiet Replenishment" (QR).
      *   *Proposed State:* "Shared Kitty" (SK).
      *   *The Problem:* Everyone agrees SK is *better* (Pareto superior?), yet they stick with QR.
      *   *Lewisian Diagnosis:* Why is QR a convention? Why isn't SK?
      *   *The "Agreement" Issue:* The house meeting nod seems to fail. Why?

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the irony (Lewis-ing your own life). Validate the frustration. State the thesis: Lewis explains *stability* better than *change*, especially when preferences aren't purely coordinative.

      *   **Condition 1: Is QR actually a Lewisian Convention?**
          *   Regularity? Yes.
          *   Expectations? Yes.
          *   Conditional Preference? *Here's the rub.* Lewis requires a *coordination problem*. In QR, do I prefer to buy soap *only if* you do? Or do I just need soap?
          *   *Critique:* QR looks more like a "social norm" or "moral obligation" than a pure coordination convention. If I don't buy soap, we run out. That's a Prisoner's Dilemma or Assurance Game, not necessarily pure Coordination. *However*, for the sake of the exercise, let's treat it as a coordination equilibrium regarding *who* buys and *how*.
          *   *Arbitrariness:* Yes, SK is the alternative $R'$.

      *   **Condition 2: Why the "Kitty" Agreement Fails (The Core Lewisian Insight):**
          *   Lewis on Agreement: Agreement creates CK of *intentions*. But intentions aren't actions.
          *   The Gap: For a convention to shift, the CK must be about *conformity*, not just *preference*.
          *   *Expectations:* At the meeting, I expect you to agree. But do I expect you to *actually top up the kitty* next month when it's inconvenient?
          *   *Precedent:* QR has the weight of history (Year 1). SK has no precedent. Precedent creates salience. The meeting tries to create salience via declaration, but without a track record, the salience is weak compared to the inertia of QR.
          *   *Conditional Preferences:* This is the big one. In Lewis's model, I conform because I expect *you* to conform. If I suspect you'll revert to QR (buying soap individually because the kitty is empty), my best response is to revert to QR. The agreement doesn't guarantee the *expectation of conformity*.

      *   **Condition 3: The "Better System" Paradox:**
          *   Lewis conventions don't have to be optimal; they just have to be *equilibria*.
          *   If QR is an equilibrium and SK is a *better* equilibrium, why the stickiness?
          *   *Transition Costs:* Switching conventions is itself a coordination problem. We need to coordinate on *switching*.
          *   *The "First Mover" Problem:* Who opens the kitty? Who puts the first $20 in? If I put money in and you don't, I lose. QR has low transaction costs for the individual act (just buy soap). SK has high setup costs (establish the account/box, trust mechanism).

      *   **Condition 4: What Would Actually Work (Lewisian Prescriptions):**
          *   Mere talk isn't enough. You need to generate CK of *action*.
          *   *Focal Point:* You need a salient trigger. "I put the box on the table *now* with $20 in it."
          *   *Iterated Signaling:* One meeting isn't enough. You need repeated confirmation.
          *   *Altering Payoffs:* Lewis assumes preferences are fixed. To shift, you might need to make QR less attractive (e.g., "I will stop buying soap entirely until the kitty exists"). This forces the coordination problem to become acute.

      *   **Condition 5: The Philosophical Catch (Social Ontology nuance):**
          *   Is this actually a Lewisian convention? Or is it a Searleian status function? Or a norm sustained by sanctions?
          *   Lewis assumes *common interest*. If two housemates think QR "screws over the fast burners," there is a *conflict of interest*. Lewis's model struggles with mixed-motive games.
          *   *Implication:* Lewis's theory might actually predict *failure* here because the "common interest" condition is violated. The fast burners prefer SK, the slow burners (who benefit from QR) might tacitly prefer QR. The "nodding" might be cheap talk to avoid conflict, not genuine CK of intention.

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check:* Did I recap definitions too much? *Correction:* Keep definitions embedded in the analysis.
      *   *Check:* Did I answer the "house meeting" question? *Yes,* focus on why talk $\neq$ CK of conformity.
      *   *Check:* Is the tone right? *Yes,* keep it peer-to-peer.
      *   *Key Insight:* The distinction between CK of *preference* vs. CK of *intention to conform*. The meeting establishes the former, not the latter.
      *   *Key Insight 2:* The role of *precedent*. QR has it, SK doesn't. Precedent trumps abstract agreement in Lewis's model.
      *   *Key Insight 3:* The "Arbitrariness" condition is met, but the "Equilibrium" condition is shaky if preferences aren't aligned.

  6.  **Final Structure:**
      1.  **Diagnosis:** QR is a convention; SK is a mere proposal.
      2.  **The Meeting's Failure:** CK of preference $\neq$ CK of conformity.
      3.  **Precedent vs. Declaration:** Why history beats talk.
      4.  **The Equilibrium Trap:** Conditional preferences and the fear of defection.
      5.  **The "Common Interest" Caveat:** Is this actually a Lewisian case? (The conflict of interest angle).
      6.  **Prescription:** How to use Lewis to break the deadlock (Focal points, binding actions).

  7.  **Final Polish:** Ensure terms like "recurrent situation," "coordination equilibrium," and "salience" are used precisely. (Self-correction: Make sure to emphasize that Lewis thinks conventions solve *coordination problems*, not necessarily *prisoner's dilemmas*. If the housemates have divergent interests, Lewis's model explains why the convention *doesn't* form, or why the old one persists due to inertia.)

  8.  *(Drafting response based on these points...)*
answer: |-
  This is a classic case of "philosophical vertigo"—where the tools you're sharpening start cutting into your own furniture. It's also a perfect stress test for Lewis.

  You're asking whether Lewis's framework predicts that your house meeting was essentially performative noise, and what would actually be required to shift the equilibrium. The short answer is: **Yes, Lewis implies your meeting was insufficient, and likely *necessarily* insufficient given how he models the transition between conventions.**

  Here is the breakdown of why you are stuck, working strictly through the machinery of *Convention*.

  ### 1. The Diagnosis: Quiet Replenishment (QR) vs. Shared Kitty (SK)

  First, we have to establish that QR is actually a Lewisian convention.
  *   **Regularity:** Yes, people buy stuff.
  *   **Expectations:** You expect others to buy if they see a gap; they expect you to.
  *   **Conditional Preferences:** This is the tricky bit. In a pure Lewisian coordination problem, I prefer to do $R$ *given* that you do $R$. In QR, do I prefer to buy soap only if you buy soap? Not exactly. I prefer *having soap*. But I prefer *buying soap quietly* given that you *also buy soap quietly* (avoiding the awkwardness of accounting). So, yes, it functions as a coordination equilibrium regarding the *method* of procurement, even if the underlying need is independent.
  *   **Arbitrariness:** Yes. SK is a clear alternative $R'$. It solves the same recurrent situation (running out of staples).
  *   **Common Knowledge:** Yes. Everyone knows QR is the rule, everyone knows everyone knows, etc.

  So QR is a convention. SK is currently just a *proposed* regularity. The problem is transitioning from equilibrium $E_1$ (QR) to equilibrium $E_2$ (SK).

  ### 2. Why the House Meeting Failed: CK of Preference $\neq$ CK of Conformity

  You asked if "let's all just agree to switch" counts as the kind of common-knowledge-generating event Lewis requires. Lewis's answer would be: **No.**

  Lewis distinguishes sharply between **agreement** and **convention**. In Chapter 3, he discusses agreement as a way to *generate* convention, but he is very specific about what the agreement must establish. It is not enough to have Common Knowledge (CK) that everyone *prefers* SK. You already have that. Two of you think QR is unfair; presumably, the third agrees it's suboptimal even if they benefit.

  What you lack is **CK of intentions to conform.**

  When you nod at the house meeting, you generate CK that everyone *intends to try* to switch. But for a convention to hold, I need to know that you will conform to SK *even when it is inconvenient*, because you expect *me* to conform.
  *   **The Lewisian Gap:** At the meeting, I agree to SK. But next week, when I see we're out of toilet paper, I have to make a split-second decision. I look at the (empty) kitty box. I ask myself: "If I put $20 in now, will my housemates actually use the kitty next time, or will they just buy their own roll like usual?"
  *   If I suspect there is even a 10% chance you will revert to QR (because QR is the entrenched precedent), my conditional preference shifts. If you revert to QR, my contribution to the kitty is wasted (or I end up double-paying). Therefore, my best response to *uncertainty about your conformity* is to stick with the known equilibrium (QR).

  The meeting generated CK of *talk*, not CK of *future action*. Lewis requires the latter to sustain a convention.

  ### 3. Precedent as Salience: Why History Beats Talk

  This is the heaviest weight in Lewis's account. You mentioned **precedent**. For Lewis, precedent is the primary source of **salience**.
  *   **QR** has the weight of three years of successful coordination. It is "prominent" in your shared history. It screams, "Do this! It worked before!"
  *   **SK** is abstract. It has no track record.

  Lewis argues that when multiple equilibria exist, agents coordinate on the one that is most salient. Precedent makes QR overwhelmingly salient compared to SK. A verbal agreement attempts to create a *new* kind of salience (a "focal point" created by declaration), but Lewis is skeptical that declaration alone can override the salience of established precedent without a mechanism to enforce the expectation.

  In your case, the salience of QR is reinforced every single time someone successfully buys soap without drama. Every successful act of QR reinforces the expectation that QR is the rule. Every time the kitty sits empty for a week, it reinforces the expectation that SK is *not* the rule. The "signal" of the meeting is drowned out by the "noise" of daily precedent.

  ### 4. The "Common Interest" Caveat (The Social Ontology Trap)

  Here is where your specific case might actually break Lewis's model, which is a crucial insight for your PhD work.

  Lewis's model assumes a **coordination problem**, which implies **common interest**. Everyone prefers $(R, R)$ to $(\text{not-}R, \text{not-}R)$.
  *   In QR, you noted that two of you think it "screws over whoever burns through stuff fastest."
  *   This implies that for the high-consumption housemates, QR is *not* a preferred equilibrium compared to SK.
  *   For the low-consumption housemate (the free-rider), QR *is* the preferred equilibrium.

  If preferences diverge, this is not a pure coordination problem; it is a **Battle of the Sexes** or a **Prisoner's Dilemma** masked as a convention. Lewis's theory explains why conventions *persist* when interests align, but it is less robust at explaining why they persist when there is latent conflict.

  **Implication:** The "nodding" at the meeting might not be genuine CK of intention. The low-consumption housemate might be nodding to avoid conflict (cheap talk) while having no intention of changing their behavior. If Lewis's condition of "common interest" is violated, the theory predicts exactly what you are seeing: verbal agreement without behavioral shift. The convention persists not because of coordination, but because the beneficiary of the old convention has no incentive to signal genuine intent to change.

  ### 5. What Would Actually Shift the Convention? (Lewisian Prescriptions)

  If you want to use Lewis to fix this, you cannot rely on "agreeing to agree." You need to manipulate the conditions for **salience** and **conditional expectations**.

  1.  **Create a Focal Point (Salience):** You need to make SK more salient than QR *in the moment of action*.
      *   *Action:* Put a physical box on the counter *with money in it* immediately after the meeting.
      *   *Lewisian Logic:* This changes the physical situation $S$. Now, when I see soap is low, the salient object is the box with cash, not the memory of past quiet purchases. You are artificially engineering precedent.

  2.  **Bind the Expectation (CK of Conformity):** You need to raise the cost of reverting to QR to make the intention credible.
      *   *Action:* The two of you who want SK must publicly declare: "We will no longer buy individual staples. If the kitty is empty, we go without."
      *   *Lewisian Logic:* This alters the payoff matrix. It removes QR as a viable option for you. Now, the third housemate *knows* (CK) that you will not conform to QR. Their conditional preference shifts: "If they won't buy soap quietly, and I want soap, I must conform to SK." You are forcing the coordination equilibrium by eliminating the alternative.

  3.  **Iterated Signaling:** One meeting is not enough to establish CK of conformity.
      *   *Lewisian Logic:* Conventions are sustained by iterated interactions. You need a "probationary period" where you explicitly discuss the conformity. "Hey, the kitty worked this week." This builds the *new* precedent required to overwrite the old one.

  ### Summary for your Seminar

  If you bring this back to class, the punchline is this: **Lewis's theory predicts that verbal agreement is ontologically weaker than behavioral precedent.**

  A convention is a self-perpetuating system of expectations. Your house meeting tried to change the *norm* without changing the *expectations*. As long as everyone expects everyone else to revert to QR when the pressure is on, rational agents (in Lewis's sense) will revert to QR. To shift the convention, you don't need more discussion; you need to **alter the salience of the options** and **generate CK of binding intent**, likely by making the old equilibrium temporarily unavailable.

  You are stuck because you are trying to solve a coordination problem with discourse, but Lewis shows us that coordination is solved by **mutual expectation grounded in action.** Until the kitty has a history of success that rivals the history of QR, QR wins. Precedent is king.
