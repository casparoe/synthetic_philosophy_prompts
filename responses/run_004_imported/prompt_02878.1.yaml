answer: |-
  "He's not going to stop," Marcus said, swirling the ice in his whiskey. "Not unless he has a reason to."

  "He has a reason," David replied, leaning back. "She's his wife. He claims to love her."

  "He claims a lot of things. But tonight? He looked at her like she was furniture. I'm saying he needs a real incentive. A consequence."

  "See, that's where you're smuggling in external reasons," David said, tapping his glass. "Williams would say if there's no sound deliberative route from Paul's current motivational set to treating her better, then there *is* no reason. Full stop."

  Marcus sighed, the sound of a man who'd heard this before. "So because he's selfish, he has no reason to be kind? That's not philosophy, Dave. That's a get-out-of-jail-free card for monsters. If a guy doesn't care about anyone, you're saying he has no reason not to hurt them?"

  "I'm saying he has no *internal* reason. There's a difference between 'Paul has no reason to stop' and 'Paul shouldn't stop.'"

  "Practically? There isn't," Marcus shot back. "If I tell a judge, 'My client had no reason not to commit fraud because he doesn't care about honesty,' the judge laughs. The law assumes reasons exist independently of your desires. Otherwise, accountability is just a suggestion."

  "Accountability is about blame, not reasons," David countered. "You can blame Paul. You can punish him. But don't pretend he's irrational for ignoring a reason that doesn't connect to anything he values. That's just magical thinking. It assumes morality floats outside of human psychology."

  "It assumes morality *binds* human psychology," Marcus said. "If you tell people reasons are only what they already want, you kill the possibility of change. You're saying you can't argue someone into being better unless they're already halfway there."

  "I'm saying you can't argue someone into a conclusion their premises don't support. If Paul's premise is 'my comfort matters most,' you can't derive 'I should suffer for her' from that."

  "So you write him off."

  "I diagnose him," David corrected. "If you want him to stop, you don't appeal to his duty. You change his motivations. Threaten his reputation. Hit his wallet. Give him a route."

  Marcus stared at him for a long moment, then took a drink. "That's a cold way to save a marriage."

  "It's an honest way to understand a man."

  "Honest," Marcus muttered, signaling the bartender. "Maybe. But don't ask me to call it true."

  "Cheers to that," David said, clinking his glass against Marcus's. They drank, the argument settling between them like sediment, unresolved as always.
