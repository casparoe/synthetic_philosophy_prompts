          *   *REU Status:* REU explicitly violates Independence. It is designed to handle common consequence/common ratio effects by weighting the probability of the "sure" part differently than the risky part.
          *   *Verdict:* This is the classic motivation for rank-dependent models (including REU). Buchak discusses this extensively.
          *   *Tier:* S.

      *   **2. Rabin's Calibration Argument:**
          *   *Description:* Matthew Rabin showed that if risk aversion over small stakes is explained solely by concave utility of wealth, it implies absurd risk aversion over large stakes.
          *   *EU Status:* Devastating critique of EU with curved utility.
          *   *REU Status:* REU separates risk attitude (probability weighting) from wealth attitude (utility). You can be risk-averse over small stakes via the risk function without implying absurd curvature over large stakes. Buchak explicitly cites Rabin as a motivation for separating risk from utility.
          *   *Verdict:* REU solves this by decoupling the two parameters.
          *   *Tier:* S (or high A). Let's go S because it's a major theoretical advantage Buchak highlights.

      *   **3. Buying Insurance and Lottery Tickets:**
          *   *Description:* People pay to avoid risk (insurance) and pay to embrace risk (lottery) simultaneously. Friedman-Savage puzzle.
          *   *EU Status:* Requires a utility function that is concave then convex (inflection point). Possible but ad hoc.
          *   *REU Status:* REU can model this via the risk function (e.g., inverse-S weighting) without needing weird utility inflection points. However, Prospect Theory is usually the go-to here. REU *can* do it, but is it the *defining* case? Buchak focuses more on rational risk aversion than the specific psychology of gambling. Still, it handles it better than simple concave EU.
