      *   REU modifies EU by introducing a risk function $r(p)$ applied to cumulative probabilities (or decumulative, depending on formulation, but essentially weighting probabilities non-linearly based on rank).
      *   Formula roughly: $REU = \sum u(x_i) \cdot [r(P(\text{outcome} \ge x_i)) - r(P(\text{outcome} \ge x_{i+1}))]$.
      *   Key distinction from EU: EU assumes linearity in probabilities. REU allows non-linearity in probabilities *as a representation of attitude toward risk*, distinct from attitude toward wealth (utility curvature).
      *   Key distinction from Prospect Theory (PT)/RDU: PT/RDU are primarily *descriptive* psychological models. Buchak's REU is primarily a *normative* framework arguing that it is rational to weigh probabilities non-linearly if one has a specific global risk attitude. However, mathematically, REU is isomorphic to RDU. The prompt asks about *accounting for the puzzles*, which leans towards explanatory power, but the "independent work" aspect hints at the normative justification Buchak provides.
