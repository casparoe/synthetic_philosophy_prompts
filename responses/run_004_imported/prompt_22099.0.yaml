answer: |-
  You have hit upon one of the most famous and debated cruxes in Indian epistemology. Your intuition is spot-on: there is a genuine tension in NS 1.1.4, and the history of Nyāya commentary is largely a history of trying to resolve the friction between *avyapadeśya* (non-verbal) and *vyavasāyātmaka* (determinate).

  Here is the breakdown of the textual history, the functional difference between the qualifiers, and where the *nirvikalpaka/savikalpaka* distinction actually enters the picture.

  ### 1. Is the *Nirvikalpaka/Savikalpaka* split in the Sūtra?
  **Short answer:** No.

  The terms *nirvikalpaka* (indeterminate) and *savikalpaka* (determinate) do not appear in Gautama's *Nyāya Sūtra* 1.1.4. This distinction is a later hermeneutic development, crystallized primarily by **Uddyotakara** (6th century CE) in his *Nyāyavārttika*, and solidified in response to the Buddhist epistemologist **Dignāga**.

  Gautama's sūtra is cryptic by design. It lists four conditions for perception:
  1.  *Indriyārthasannikarṣotpannaṃ* (Born of sense-object contact)
  2.  *Avyapadeśyam* (Non-verbal)
  3.  *Avyabhicāri* (Non-erroneous)
  4.  *Vyavasāyātmakaṃ* (Determinate/Decisive)

  If you read these literally and synchronically (applying to a single moment of cognition), you run into the exact problem you identified: How can a cognition be "non-verbal" (*avyapadeśya*) yet "determinate" (*vyavasāyātmaka*), since determination usually implies identifying an object as "this is that" (which requires concepts/words)?

  ### 2. Vātsyāyana's Strategy (The *Bhāṣya*)
  Vātsyāyana (c. 4th century CE), in his *Nyāya Bhāṣya*, is aware of this tension. His commentary is pre-Dignāga, so he isn't yet fighting the Buddhist battle over pure sensation vs. construction.

  **His move on *Avyapadeśya*:**
  You are correct that Vātsyāyana insists *avyapadeśya* does not preclude identifying a cow. He interprets *avyapadeśya* not as "devoid of conceptual association" but as **"not born from words."**
  *   **Function:** It rules out *śabda-pramāṇa* (testimony). If I tell you "There is a cow in the field," and you cognize it, that cognition is *vyapadeśya* (verbal/testimonial). If you see it yourself, it is *avyapadeśya*.
  *   **Result:** This allows perception to include conceptual identification ("This is a cow") without contradicting the "non-verbal" clause, because the *source* is the senses, not the testimony.

  **His move on *Vyavasāyātmaka*:**
  *   **Function:** This rules out *saṃśaya* (doubt) and *tarka* (hypothetical reasoning).
  *   **Example:** In dim light, you might see a shape. Your senses contact the object, but you think, "Is this a man or a post?" This is sense-contact, but it lacks *vyavasāya* (decisiveness). Once the light improves and you think, "This is definitely a man," that is *vyavasāyātmaka*.
  *   **Result:** It ensures perception yields a firm judgment, not just a raw sensory manifold or a doubt.

  **So, in Vātsyāyana's reading:** There is no contradiction. *Avyapadeśya* refers to the **etiology** (cause) of the cognition (senses, not words). *Vyavasāyātmaka* refers to the **phenomenology** of the cognition (certainty, not doubt).

  ### 3. The Buddhist Challenge and the "Patch"
  The tension you feel becomes a crisis when **Dignāga** (c. 5th–6th century CE) attacks the Nyāya definition.

  Dignāga argues that true perception (*pratyakṣa*) must be *kalpanāpoḍha* (free from conceptual construction). He argues that if you identify something as a "cow," you are mixing sensory data with memory/universals, which is inference/construction, not perception. He latches onto *avyapadeśya* in NS 1.1.4 to say: "See? Gautama admits perception is non-verbal. Nyāya is wrong to claim conceptual cognition is perception."

  **The Nyāya Counter-Move (Uddyotakara and later):**
  To defend against Dignāga, later Nyāya commentators (starting with Uddyotakara) introduce the **two-stage theory** explicitly into the interpretation of the sūtra. They argue that *Pratyakṣa* (Perception) is a complex process that includes two stages:
  1.  **Nirvikalpaka (Indeterminate):** The initial flash of sense-contact. It is *avyapadeśya* (truly non-verbal/conceptual). It grasps the particular (*svalakṣaṇa*) but without associating it with a name or universal.
  2.  **Savikalpaka (Determinate):** The subsequent cognition that associates the particular with a universal/name ("This is a cow"). This is *vyavasāyātmaka*.

  **Is this a patch?**
  Yes, largely. Scholars like B.K. Matilal and Jonardon Ganeri argue that this two-stage theory is a retroactive defense mechanism. They read the sūtra's qualifiers diachronically (over time) rather than synchronically (at one time):
  *   *Avyapadeśya* describes the first stage (*nirvikalpaka*).
  *   *Vyavasāyātmaka* describes the second stage (*savikalpaka*).
  *   The word *Pratyakṣa* covers the whole causal chain.

  ### 4. Summary of the Functional Differences
  To answer your specific question about whether there is an actual difference in the job each qualifier does:

  | Qualifier | Literal Meaning | Vātsyāyana's Function (Early Nyāya) | Later Nyāya Function (Post-Dignāga) |
  | :--- | :--- | :--- | :--- |
  | **Avyapadeśya** | Non-verbal / Not to be expressed | **Source Marker:** Rules out Testimony (*Śabda*). Ensures the cognition comes from senses, not language. | **Stage 1 Marker:** Describes the *nirvikalpaka* stage. Truly devoid of concepts/words. |
  | **Vyavasāyātmaka** | Of the nature of determination | **Quality Marker:** Rules out Doubt (*Saṃśaya*). Ensures the cognition is a firm judgment. | **Stage 2 Marker:** Describes the *savikalpaka* stage. Involves conceptual identification. |
  | **Avyabhicāri** | Non-erroneous | **Truth Marker:** Rules out Illusion (*Bhrānti*). | **Truth Marker:** Rules out Illusion. |

  ### 5. Conclusion for your Reading Group
  You are right to suspect that the *nirvikalpaka/savikalpaka* distinction is a "fix."
  1.  **The Tension:** It is inherent in the sūtra. Gautama likely intended a commonsense definition where "perception" means "seeing something and knowing what it is." He didn't feel the need to separate raw sensation from conceptual identification.
  2.  **Vātsyāyana:** Tries to keep it simple. He reads *avyapadeśya* as "non-testimonial" to avoid the contradiction. For him, perception is inherently conceptual ("This is a cow") but sensory in origin.
  3.  **Later Commentators:** Forced by Buddhist logic to admit a pre-conceptual stage, they split the definition. *Avyapadeśya* applies to the first moment; *vyavasāyātmaka* applies to the second.

  **Recommendation:** When discussing NS 1.1.4, it is fruitful to present the definition as having two layers: the **surface layer** (Vātsyāyana's pragmatic reading: perception is certain sensory knowledge, not hearsay) and the **deep layer** (Later Nyāya's technical reading: perception is a process moving from raw sensation to conceptual certainty). The tension you found is the engine that drove Nyāya epistemology for a thousand years.
