      *   **Tone:** Academic but personal, looking for a linguistic/pragmatic analysis to resolve a interpersonal conflict. Needs to be empathetic but rigorous.

  2.  **Identify Key Linguistic/Philosophical Concepts:**
      *   **Assertion Norms:** The Knowledge Norm of Assertion (KNA) vs. Truth Norm vs. Justified Belief Norm.
      *   **Gricean Maxims:** Quality (do not say what you believe to be false/lack adequate evidence).
      *   **Epistemic Modality:** Hedging vs. flat-out assertion.
      *   **Speech Acts:** Illocutionary force, uptake, responsibility.
      *   **Context/Stakes:** The practical implications of the assertion (high stakes for the cousin).
      *   **Source of Evidence:** Statistical/base rate vs. direct testimony/observation.

  3.  **Evaluate the "Knowledge Norm of Assertion" (KNA):**
      *   *Standard:* You should assert $p$ only if you know $p$. (Williamson, Unger, etc.)
      *   *Application:* Did the User *know* the cousin was in? No. It was a probabilistic inference.
      *   *Verdict:* Under KNA, the User violated the norm. This aligns with the Cousin's intuition.

  4.  **Evaluate the "Justified Belief Norm" (JNA) or Evidence Norm:**
      *   *Standard:* You should assert $p$ if you have sufficient justification/evidence for $p$.
      *   *Application:* Is 97.5% sufficient justification? In low-stakes contexts (e.g., "The sun will rise tomorrow"), yes. In high-stakes contexts (e.g., "You got the job"), maybe not.
      *   *Verdict:* Context-sensitive. The stakes raise the threshold for "sufficient."

  5.  **Analyze the Gricean Maxim of Quality:**
      *   *Rule:* Do not say that for which you lack adequate evidence.
      *   *Application:* Base rates are evidence, but are they *adequate* for a categorical claim about a specific individual?
      *   *Nuance:* The gap between group probability and individual outcome. The "Reference Class Problem."

  6.  **Address the User's Specific Intuition (Base Rate vs. Overhearing):**
      *   *Scenario A (Base Rate):* 97.5% chance. User asserts "You're in."
      *   *Scenario B (Overhearing):* User hears name. Maybe 97.5% reliable hearing/interpretation. User asserts "You're in."
      *   *User's Feeling:* Scenario B feels less wrong.
      *   *Linguistic Explanation:*
          *   **Direct vs. Indirect Evidence:** Evidentiality. Overhearing is direct evidence of the *decision* (potentially). Base rate is indirect evidence of the *probability*.
          *   **Causal Chain:** Overhearing is causally linked to the specific event. Base rate is statistically linked to the class, not the token.
          *   **Accountability:** If I overhear, I can say "I heard X." If I use base rates, I'm making a prediction. Assertions are typically about *facts*, not *predictions* (unless marked as such).

  7.  **Consider the Interpersonal/Pragmatic Context (Face and Stakes):**
      *   **Stakes:** High for the cousin (emotional investment, telling family).
