prompt: |-
  Okay, this has been bugging me for weeks and my roomate (a syntax person, so not exactly invested) and I can't agree on it, so I want an outside opinion. I'm doing a linguistics PhD on the pragmatics/semantics side, and over winter break my cousin got an interview invite from a PhD program. A friend of mine who's an alum there mentioned, kind of in passing, that over the last five years something like 39 out of 40 people who made it to the interview stage ended up admitted, so clearing that bar is basically a formality. My cousin texted me freaking out the night before decisions came out, and I just told her straight up, "you're in, seriously, stop stressing" — because honestly 97.5% is about as sure as I am of most things I say out loud all day. Except she was the 1 in 40. She's been kind of cold to me since, her point being that I had no business telling her she got in when I didn't actually know that, and that she wouldn't have called her parents and grandma to tell them early if I'd just said "it's looking really good" instead of stating it like a done deal.

  I had a pragmatics seminar last term that covered speech acts and Gricean maxims, so I've got some vocabulary for this, but nothing that actually settles who's right here. My gut says there has to be room for just flatly asserting stuff based on strong evidence, since testimony and memory aren't infallible either and we don't normally demand certainty before letting people state things outright. But it also feels different from, say, if I'd told her the same thing because I personally overheard someone on the admissions committee say her name in a hallway — even if that turned out to be a mishearing, I feel like I'd be less in the wrong than if I'm just going on a base rate, at the exact same confidence level, and I can't work out why that difference should matter. Is there an actual principled story about when someone's entitled to just assert something outright instead of hedging, and does it settle whether I actually messed up here?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

