      *   **Responsibility:** By asserting flatly, the User took epistemic responsibility. When it failed, the User bore the blame for the "false assertion."
      *   **Hedging:** Hedging ("It looks good") transfers some epistemic risk back to the hearer or acknowledges uncertainty. It manages expectations.

  8.  **Synthesize the Argument:**
