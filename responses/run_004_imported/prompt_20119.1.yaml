answer: |-
  This is a classic case where pragmatic theory actually maps remarkably well onto interpersonal friction. Since you're in the weeds of pragmatics/semantics, I'll skip the pop-psychology and go straight to the epistemic norms of assertion, because I think they provide the "principled story" you're looking for.

  The short answer is: **Yes, there is a principled distinction, and yes, theoretically, you messed up.**

  Here is the breakdown of why your cousin's reaction is pragmatically sound, why your intuition about the "overhearing" scenario is distinct, and how to frame an apology that speaks to your shared understanding of communication.

  ### 1. The Norm of Assertion (KNA vs. JNA)
  The dominant view in the philosophy of language and linguistics regarding assertion is the **Knowledge Norm of Assertion (KNA)**, championed by Williamson, Unger, and others. The rule is simple: *One must assert $p$ only if one knows $p$.*

  *   **Your move:** You asserted $p$ ("You are in").
  *   **Your epistemic state:** You had a justified true belief that *most people in this position get in*, but you did not have knowledge that *she* got in. You had high credence, not knowledge.
  *   **The violation:** Under KNA, asserting based on statistical probability, no matter how high (short of 100%), is a violation. You should have asserted "It is highly probable that you are in" or used epistemic modals ("You must be in," "You're almost certainly in").

  There is a rival view, the **Justified Belief Norm (JNA)**, which says you can assert if you have sufficient evidence. However, even JNA is usually context-sensitive regarding *what counts* as sufficient evidence. This leads us to the next point.

  ### 2. Contextualism and Stakes
  Pragmatic contextualism (think Jason Stanley or John Hawthorne) suggests that the epistemic standard required for "knowing" (and thus asserting) shifts based on the **practical stakes** for the hearer.

  *   **Low Stakes:** If you tell a friend, "The coffee shop is open," based on it being open 97.5% of mornings, and it's closed, they're annoyed but they just walk away.
  *   **High Stakes:** Your cousin was preparing to manage her family's expectations and her own emotional state. The cost of a false positive was high (embarrassment, disappointment, explaining a retraction to Grandma).

  In high-stakes contexts, the threshold for "sufficient evidence" to warrant a flat-out assertion rises. A base rate of 39/40 is strong evidence, but in a high-stakes environment, it does not meet the threshold for a categorical assertion. By asserting flatly, you implicitly signaled that the stakes were low enough that you were willing to take epistemic responsibility for the 2.5% risk. She is signaling that the stakes were too high for that risk to be taken on her behalf without her consent.

  ### 3. The "Overhearing" Intuition (Evidentiality)
  You mentioned that if you had overheard a committee member say her name, you feel you'd be less in the wrong, even if your hearing was fallible (say, 97.5% reliable). Why does that feel different if the confidence level is identical?

  This comes down to **evidential type** and **causal connection**.

  *   **Base Rate (Your actual scenario):** This is *indirect, statistical evidence*. It applies to the *class* (interviewees), not the *token* (your cousin). Asserting a token fact based on class data is a category mismatch in conversation. It treats the individual as a statistical average rather than a specific agent with a specific outcome.
  *   **Overhearing (Hypothetical):** This is *direct, perceptual/testimonial evidence*. Even if fallible, it is causally linked to the specific event of the decision.

  In languages with grammatical evidentiality (like Turkish or Quechua), you would be grammatically marked for this distinction. In English, we mark it via modality and hedging.
  *   **Base Rate:** Requires hedging ("Statistically, you're in").
  *   **Testimony/Perception:** Allows flat assertion ("I heard you're in").

  When you assert flatly, you implicate that you have direct evidence (or knowledge). By using a base rate to support a flat assertion, you created a **false implicature** about the nature of your evidence. Your cousin reasonably inferred you had more direct insight than you did.

  ### 4. Speech Act Responsibility and Reliance
  Finally, look at this through **Speech Act Theory** (Austin/Searle). An assertion is not just a description of the world; it is an invitation to rely.

  *   **Illocution:** "You are in."
  *   **Uptake:** Cousin accepts this as fact.
  *   **Perlocution:** Cousin tells parents.

  When you assert, you undertake a **commitment**. You become the guarantor of the truth of $p$. If $p$ turns out false, the hearer is entitled to hold you accountable for the consequences of their reliance.

  If you hedge ("It looks really good"), you are sharing the epistemic risk. You are saying, "Here is my assessment, but you should manage your own expectations." By asserting flatly, you took the risk entirely upon yourself. Since the risk materialized, the blame lands on you. Your cousin isn't just mad that she was rejected; she's mad that you assumed the authority to manage her epistemic state regarding a life event without the warrant to do so.

  ### The Verdict and The Fix
  You messed up, but not because you're a bad cousin. You messed up because you treated a **probabilistic inference** as a **factual assertion** in a **high-stakes context**.

  **How to apologize (Linguist-to-Linguist style):**
  Don't just say "I'm sorry I was wrong." That focuses on the truth value. Focus on the *norm violation*.

  1.  **Acknowledge the Norm:** "I realize now that I violated the norm of assertion. I treated a high probability as knowledge, and I didn't have the warrant to make a categorical claim."
  2.  **Acknowledge the Stakes:** "I didn't respect the high stakes involved. I should have hedged to let you manage your own expectations with your family."
  3.  **Validate Her Reaction:** "You're right that the difference between 'it's looking good' and 'you're in' is the difference between sharing hope and taking epistemic responsibility. I took that responsibility without having the evidence to back it."

  This validates her feelings without making you sound like you're just guessing. It shows you understand *why* the communication failed, not just that the prediction failed.

  **For your dissertation:**
  This is actually a perfect case study for the intersection of **epistemic modality** and **social accountability**. The "39/40" statistic is a great example of why *group-level probability* does not license *individual-level assertion* without modal marking, regardless of the confidence level. The "overhearing" intuition highlights that English speakers track **evidential source quality** (direct vs. statistical) even without grammaticalized evidentials, regulating assertion norms accordingly.

  Good luck with the cousin, and good luck with the PhD. Hopefully, your defense goes better than her interview!
