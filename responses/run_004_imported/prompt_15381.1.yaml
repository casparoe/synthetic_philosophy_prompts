      *   *Recommendation:* If she just lies and the scanner buys it, it weakens the puzzle. If she actually finds a way to make the intention sincere, that shows true genius.

  6.  **Final Polish:** Ensure the distinction between "lying" and "intending" is clear. The scanner detects *intention*, not truth-telling. This is crucial. If the scanner just detects lies, it's a polygraph. If it detects intention, it's Kavka's puzzle. The prompt says "confirms she really means it," implying intention.

