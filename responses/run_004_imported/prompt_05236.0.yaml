      *Let's write.* (Focusing on keeping it tight and within word count).

      *Check:* Did I capture the "hesitating means losing" aspect? Yes, need to emphasize that waiting is interpreted as weakness or an opening for the other to lock.
      *Check:* Did I capture the "incompatible commitments"? Yes, both demand total control.
      *Check:* Dark irony? Yes, efficiency leads to ruin.

  9.  **Review against constraints:**
