prompt: |-
  Okay, this is a pretty specific ask but I need actual help, not just sympathy. I sit on the allocation committee for a small giving circle - four of us, money sits in a joint donor-advised fund, currently about $180k, mostly earmarked for global health stuff like malaria nets. Last week Priya, one of the other members, brought us a proposal from a contact of hers who does impact litigation funding: we'd front part of the fund for a specific case, and by our own best collective guess it's roughly 60% likely to settle or win (in which case we get back about double our stake out of the fee award) and 40% likely to get dismissed (in which case we lose the whole stake, no partial outcomes). She wants the committee to consider commiting as much as half the fund, and says opportunities like this come up through her contact maybe two or three times a year.

  This turned into a whole thing with my friend Theo over dinner, who isn't on the committee but is way more into this stuff than any of us. He says the only defensible way to size a bet like that is something like the Kelly criterion - whatever fraction maximizes the fund's long-run growth rate, which for these odds works out to something like a fifth, not a half, and that going in any heavier than that is a bad idea even on pure growth-maximizing grounds, forget caution. I pushed back with that whole Sam Bankman-Fried coin-flip thing (I think it was an old 80,000 Hours interview that recirculated after FTX collapsed) - if we're really risk-neutral altruists and a marginal dollar does about the same good whether it's dollar 900 or dollar 90,000, then treating "the fund goes to zero" as uniquely catastrophic is smuggling in a personal risk-aversion that has no business being in a charity's decision procedure, and we should just take whatever bet has the highest expected value, full stop. We argued for like two hours and neither of us budged.

  I have to put something in front of the actual committee by Thursday, so could you draft the memo? It needs to land on an actual number - how much of the $180k, if any, we commit to Priya's proposal - not just "it depends," and it has to walk through the reasoning in a way the two committee members who've never heard of the Kelly criterion could actually follow and push back on if they want. And please engage seriously with the expected-value-maximizing side rather than dismissing it, since that was basically my position at dinner and I don't want the memo to just quietly assume Theo was right.
