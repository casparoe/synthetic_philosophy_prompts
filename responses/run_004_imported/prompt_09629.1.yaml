answer: |-
  **MEMORANDUM**

  **TO:** Giving Circle Allocation Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Impact Litigation Funding Proposal

  ### Executive Summary

  Priya has presented a high-potential opportunity to allocate a portion of our Donor-Advised Fund (DAF) to impact litigation funding. The deal terms are favorable: a 60% probability of doubling our stake and a 40% probability of total loss.

  While the Expected Value (EV) of this bet is positive, the proposed allocation size of 50% ($90,000) exposes the fund to unnecessary mathematical risk that would actually reduce our long-term ability to do good. Based on an analysis of optimal bet sizing for repeated positive-EV opportunities, **I recommend we commit $36,000 (20% of the fund)** to this initial case.

  This memo outlines the reasoning behind this specific number, balancing the imperative to maximize impact (the EV argument) with the necessity of preserving our capital base for future opportunities (the risk management argument).

  ### The Opportunity

  *   **Investment:** Litigation funding for a specific impact case.
  *   **Probability of Success:** ~60% (Settlement or Win).
  *   **Payoff:** 2x return on stake (Net +100%).
  *   **Probability of Failure:** ~40% (Dismissal).
  *   **Loss:** 100% of stake.
  *   **Frequency:** Priya indicates similar opportunities may arise 2–3 times per year.

  ### Analysis of Allocation Size

  To determine how much to commit, we must resolve two competing intuitions:
  1.  **Maximize Expected Value:** Since every dollar we win saves more lives/funds more nets, we should bet big to maximize the arithmetic average return.
  2.  **Preserve Capital:** If we lose too much, we cannot operate. We must avoid "ruin."

  Priya's proposal leans heavily on the first intuition. However, because she indicates this is a *recurring* opportunity (2–3 times a year), we are not making a single bet; we are managing a portfolio over time. This distinction changes the math.

  #### 1. Why 50% is Mathematically Dangerous
  If we commit 50% of the fund ($90,000) to a single case, we create a scenario where volatility works against us, even if the odds are in our favor.

  Consider a scenario where we take two of these deals in a year, and we win one and lose one (which is statistically likely given a 60% win rate):
  *   **Start:** $180,000
  *   **Bet 1 (Loss):** We lose $90,000. Remaining: $90,000.
  *   **Bet 2 (Win):** We bet $45,000 (50% of remaining). We win $45,000 profit. Total: $135,000.
  *   **Result:** Despite winning 50% of our bets on a positive-EV deal, **we have lost 25% of our total fund.**

  This is the volatility drag. When you bet too large a fraction of your bankroll, losses hurt more than wins help. At a 50% allocation size, the risk of permanently impairing our capital is unacceptably high, which contradicts our mission to sustain giving over time.

  #### 2. The Growth-Optimal Sizing (The Kelly Criterion)
  There is a standard mathematical formula used by investors and insurers to determine the exact bet size that maximizes long-term wealth growth without risking ruin. It is called the **Kelly Criterion**.

  The formula accounts for our win rate (60%) and our payout odds (1:1).
  *   **Formula:** *Edge / Odds*
  *   **Calculation:** 60% (Win Prob) – 40% (Loss Prob) = **20%**

  According to this model, **20% is the maximum allocation that maximizes the growth rate of our fund.** Any amount higher than 20% (like Priya's 50%) actually *decreases* our expected long-term growth and increases the risk of drawdown. Any amount lower than 20% reduces our growth potential but lowers volatility.

  #### 3. Addressing the "Risk-Neutral" Argument
  Some argue that as charities, we should be "risk-neutral." If a marginal dollar does the same amount of good whether we have $10,000 or $100,000, we should simply maximize the arithmetic expected value, even if it risks the fund going to zero.

  However, this view assumes we can restart the fund easily if we lose everything. In reality:
  *   **Operational Ruin:** If the fund drops significantly (e.g., below $50k), our administrative overhead becomes inefficient, and our ability to vet future deals degrades.
  *   **Sequence Risk:** Since Priya expects 2–3 deals a year, we are facing a *sequence* of bets. In a sequence, risking 50% per bet makes eventual ruin near-certain, regardless of how positive the EV is on each individual deal.

  Therefore, protecting the principal is not "risk aversion" in a personal sense; it is a requirement for maintaining our capacity to do good in the future.

  ### Recommendation

  I propose we authorize a commitment of **$36,000 (20% of current assets)** to Priya's contact for this case.

  **Rationale for 20%:**
  1.  **It Captures the Upside:** It is the mathematically optimal size for growing the fund over time. It takes the EV argument seriously by deploying significant capital where the edge exists.
  2.  **It Rejects Over-Betting:** It firmly establishes that 50% is not "bold," it is mathematically inefficient. It protects the committee from the volatility drag described above.
  3.  **It Allows Diversification:** By using only 20% per case, we retain the capacity to fund 4–5 similar opportunities over the next year without needing to wait for returns to clear. This aligns with Priya's intel on deal flow.

  ### Risk Mitigation & Next Steps

  *   **Cap Exposure:** We should set an internal policy limit that no single speculative investment exceeds 20% of the DAF corpus at the time of commitment.
  *   **Re-evaluation:** We will review the performance of this litigation funding strategy after 12 months or three deals.
  *   **Approval:** If the committee agrees, I will draft the transfer authorization for $36,000 to be executed by Thursday.

  ### Conclusion

  We have a rare opportunity to deploy capital at a positive expected value in a non-traditional asset class. We should take it. However, to serve our mission best, we must size the bet to ensure we survive to place the next one. 20% achieves the maximum growth potential without crossing into reckless territory.

  I look forward to discussing this at our meeting.
