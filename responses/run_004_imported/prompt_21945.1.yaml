      *   **The Problem:** The user sees a "fatal problem." The exposure happened decades ago. You cannot intervene on the past. It's impossible, not just difficult. Therefore, how can causation be defined by interventions that *cannot* happen?
      *   **The Worry:** Is the expert just dressing up standard statistics/counterfactuals in fancy language? What does "intervention" mean in this context if it's not physical manipulation?
