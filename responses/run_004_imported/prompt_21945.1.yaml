      *   *The "In Principle" Argument:* Even if we can't go back to 1985, the variable "Solvent Exposure" is the *kind* of variable that *could* be manipulated (unlike "Year of Birth" or "Laws of Physics"). That's what makes it causal.
      *   *Pearl's Contribution:* The $do$-operator allows us to calculate $P(Y | do(X))$ from observational data $P(Y | X)$ *if* we have the right graph and assumptions. This is exactly what the expert is doing: using stats to simulate the intervention.
