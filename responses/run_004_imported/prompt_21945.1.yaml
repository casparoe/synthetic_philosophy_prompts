      *   **Key Distinction 1: Hypothetical vs. Actual:** Explain that interventionism is about *what would happen if*, not *what we did*. The impossibility of time travel doesn't negate the truth of the counterfactual.
      *   **Key Distinction 2: Type vs. Token:** The epidemiologist is establishing *type* causation (Solvent $\to$ Cancer) using interventionist logic on data. This general rule is then applied to the mother's *token* case.
