answer: |-
  The usual story about Popper and evolution is a cautionary tale about creationist cherry-picking: he called it metaphysical, then he changed his mind, and they ignore the change. But for your column, the richer irony lies in *why* he changed his mind. It wasn't that he suddenly found natural selection to be a law of physics; it was that he recognized it could be formulated to make **risky, historical predictions** that could, in principle, be proven false.

  Popper's recantation hinged on the distinction between a logical tautology ("survivors survive") and a causal claim with empirical content ("specific traits confer survival advantages in specific environments, and we can find evidence of this in the fossil record"). Once evolution made claims that could clash with evidence, it crossed the line from metaphysics to science.

  Applying this specific reasoning to the modern rift between the Extended Evolutionary Synthesis (EES) and the Traditionalists (Neo-Darwinists like Jerry Coyne) yields a counterfactual that cuts against the grain of the "defenders of science" narrative.

  **Popper would likely have judged the EES proponents (Laland et al.) to be doing the more distinctively "scientific" work, while viewing the Traditionalist defense as flirting with the very metaphysical dogmatism Popper spent his life fighting.**

  Here is the reconstruction of that judgment:

  ### 1. The Danger of the "Complete" Theory
  Popper's epistemology is built on fallibilism: no theory is ever final, and claiming completeness is an "immunizing stratagem." The Traditionalist argument often rests on the claim that the Modern Synthesis is *already* sufficient to explain niche construction and plasticity via existing genetic mechanisms (e.g., "plasticity is just gene regulation").

  To Popper, this sounds dangerous. If a theory claims to explain every possible outcome by shoehorning new data into old variables without generating new, independent tests, it risks returning to the tautology Popper originally feared. If every instance of niche construction is explained post-hoc as "genetically programmed," the theory becomes unfalsifiable. Popper would likely argue that by insisting the Modern Synthesis is complete, Traditionalists are protecting a paradigm rather than exposing it to refutation.

  ### 2. The Value of the "Research Programme"
  Popper explicitly used the phrase "metaphysical research programme" in his 1976 critique. He later accepted evolution because it moved beyond that. The EES proponents explicitly frame their work as expanding the *research programme* to include new variables (developmental bias, niche construction) that generate **novel predictions**.

  For example, standard theory might predict adaptation follows environmental change; EES predicts that organism-driven niche construction can *direct* the path of adaptation independently of initial selection pressures. This creates a specific battleground for falsification. Popper valued theories that increased "empirical content"—that is, theories that forbid more states of affairs. By adding variables that constrain *how* evolution can happen (not just *that* it happens), the EES increases the surface area for potential refutation.

  ### 3. The Verdict on "Scientific Work"
  Popper distinguished between "normal science" (puzzle-solving within a paradigm) and "critical science" (challenging the paradigm's limits).
  *   **The Traditionalists** are acting as guardians of a successful paradigm. While biologically pragmatic, their philosophical stance is conservative. They argue the current map covers the territory.
  *   **The EES proponents** are arguing the map is missing dimensions.

  Popper would side with the map-makers who say, "Here is a new territory we might be wrong about." He would argue that the EES is doing the more *scientific* work not because they are necessarily *right* about the biology, but because their methodology is more aligned with **critical rationalism**. They are inviting new tests that could break the Modern Synthesis.

  ### The Sharper Counterfactual for Your Column
  The twist for your readers is this: The intelligent-design writers quote Popper to say evolution is unscientific. But if Popper were alive today, he might use his own criteria to criticize the **dogmatic defense** of evolutionary theory.

  He would likely tell Jerry Coyne: *"Your fear is that the EES dilutes the theory. My fear is that your insistence on the sufficiency of the Modern Synthesis immunizes it against new evidence. If you claim genes explain niche construction without independent testable mechanisms for that claim, you are returning to the metaphysical tautology I originally warned against."*

  And he would tell Kevin Laland: *"Your expansion is welcome only if it makes the theory more vulnerable, not less. If 'niche construction' becomes a catch-all explanation for anomalies, you have merely built a new metaphysics."*

  **The Punchline:** Popper's recantation wasn't a surrender to evolution; it was a demand for rigor. In the modern debate, the side most eager to subject the core theory to *new* risks (EES) is more Popperian than the side eager to declare the core theory *safe* (Traditionalists). The soundbite everyone quotes is "Popper said evolution is metaphysical." The lesson your column should highlight is: **"Popper said any theory that claims it cannot be extended is metaphysical."**
