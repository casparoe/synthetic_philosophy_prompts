answer: |-
  Here are 10 sharp interview questions tailored to your guest's specific defense of *Marriage and Morals*. The first four address your mandatory topics with conditional follow-ups designed to prevent evasion. The remaining six cover the broader philosophical and historical stakes of the book.

  ### Part 1: The Core Arguments (With Follow-Ups)

  **1. The Jealousy/Instinct Claim & The Russell Biography**
  Russell argues that jealousy is largely a product of property anxiety and upbringing rather than a fixed biological instinct. But the most famous test case for this theory is Russell's own life: his open marriage to Dora was an explicit agreement to reject possessiveness, yet it ended in a bitter divorce fueled by jealousy after they both had outside affairs. If the theory is sound, why did the practice fail so spectacularly in the one household run by the theory's author?
  *   **Conditional Follow-Up:** *If she argues they simply "executed it poorly" or that Russell evolved past this view later:* "Doesn't that suggest the theory lacks predictive power? If the people most invested in making non-jealousy work couldn't do it, is the problem with the execution, or is the premise that jealousy is purely social actually false?"

  **2. "Companionate Marriage" & Judge Ben Lindsey**
  A significant portion of Russell's proposed structure leans on Judge Ben Lindsey's concept of "companionate marriage"—a childless union with legal contraception and easy divorce. Dora actually wrote the introduction to Lindsey's book on the subject. Is Russell using Lindsey's framework to do independent moral work here, or is "companionate marriage" essentially a respectable brand name for a lifestyle arrangement he already wanted to justify on other grounds?
  *   **Conditional Follow-Up:** *If she says Lindsey provided necessary legal scaffolding:* "But Russell was a philosopher, not a lawyer. If the moral justification rests on the legal structure of another man's book, does that weaken Russell's claim that this is a new ethical discovery rather than just a policy preference?"

  **3. The Double Standard & Paternity Certainty**
  In the chapter on the double standard, Russell aims to dismantle the asymmetry between what is tolerated in husbands versus wives. But critics argue he doesn't actually remove the underlying logic of paternity certainty; he just extends the same permissiveness to women that men previously enjoyed. Does his fix genuinely equalize the moral standing of spouses, or does it just create an equal-opportunity infidelity culture while leaving the old anxiety about lineage untouched?
  *   **Conditional Follow-Up:** *If she claims Russell wanted to make paternity irrelevant:* "If paternity is irrelevant, why does Russell still insist on state support for children being tied to the family unit? If he keeps the financial structures of paternity intact, can he really claim to have solved the moral asymmetry?"

  **4. The "Children Hinge" in Sexual Ethics**
  There is a distinct hinge in the book where the ethics of fidelity flip: if there are no children, sexual freedom is paramount; if there are children, fidelity becomes a duty. Is this a consistent utilitarian principle doing real ethical work, or does it function as an escape hatch that allows the theory to sound radical while retreating to conservatism whenever the stakes get high?
  *   **Conditional Follow-Up:** *If she says it's a straightforward utilitarian calculation about harm:* "Who defines the harm threshold? If a parent's sexual freedom makes them happier and thus a better parent, doesn't a strict utilitarian view sometimes demand *more* freedom, not less? Why is the presence of children an automatic trump card?"

  ### Part 2: Broader Philosophical & Historical Context

  **5. The Eugenics Elephant in the Room**
  *Marriage and Morals* was published in 1929, when eugenics was mainstream among intellectuals, and Russell does touch on the idea that some people "should not reproduce." How do you reconcile the book's liberal arguments for sexual freedom with its illiberal suggestions about who is fit to be a parent? Does defending the book today require excising those passages, or are they integral to his view of the state's role in reproduction?

  **6. State Authority vs. Parental Authority**
  Russell argues for less church interference in marriage but seems to advocate for *more* state interference in child-rearing and education. Where exactly does he draw the line between the family as a private unit and the family as a state resource? Is there a risk that his model replaces the tyranny of the priest with the tyranny of the social worker?

  **7. Sexual Education: Curiosity vs. Consent**
  Modern sex education focuses heavily on consent and safety. Russell's approach in the book focuses heavily on curiosity and removing shame. Do you think Russell's model is actually more robust than ours today? Does focusing on "knowledge" rather than "rules" better prepare people for the ethical complexities of adult relationships?

  **8. The Secular Foundation of Morality**
  Russell writes this as a man who has rejected religious sanction for morality. He has to build a case for why fidelity matters at all without God. Where does he locate the "sacredness" of a promise in a secular framework? Is his argument that breaking promises causes social instability strong enough to hold against the desire for immediate personal happiness?

  **9. Possession vs. Love**
  Russell makes a distinction between "possessive love" (which he condemns) and "constructive love" (which he praises). But in practice, isn't some degree of exclusivity a form of possession? Is it actually possible to have a deep, long-term partnership without the kind of proprietary feeling Russell warns against, or is he asking humans to be something they aren't?

  **10. Why *This* Book Now?**
  There are plenty of places to read Russell on logic or war. Why defend *Marriage and Morals* specifically in the current year? Is there a specific argument in this text that cuts through modern debates better than, say, a modern feminist or conservative text would? What does Russell get right that the 21st century has forgotten?
