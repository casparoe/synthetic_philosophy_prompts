answer: |-
  **Important Note on Timing:** Fifteen minutes is an extremely tight window for an academic interview. If you ask eight questions with follow-ups, you are averaging less than two minutes per exchange, which does not account for the professor's speaking time. **I strongly recommend treating these as eight "modules."** Choose the four or five most relevant to your documentary's narrative arc for the actual recording, and keep the others in your back pocket in case the conversation moves faster than expected. The "Follow-Up" sections are designed as contingent branches (If she says X, ask Y) to save time.

  Here are eight interview questions designed to probe the tensions in Aquinas's thought, with specific follow-ups keyed to likely academic responses.

  ### 1. The Moral Logic of the Usurper
  **Question:** In *De Regimine Principum*, Aquinas distinguishes between a tyrant by defect of title (a usurper) and a tyrant by exercise (a legitimate king ruling badly). He seems to allow forcible removal for the former but heavily restricts it for the latter. Is this distinction based on the *consequences* of the rule, or is it an ontological claim about where the authority to judge a ruler actually resides?

  **Follow-Up:** *If she emphasizes that the usurper never held legitimate authority:* "Does this mean that for Aquinas, killing a usurper isn't technically 'regicide' at all, but rather an act of war against a private aggressor? And if so, does that strip the act of its political danger?"

  ### 2. Prescription and Time
  **Question:** Following on that distinction: if a usurper holds power long enough that the community begins to accept his rule, does Aquinas's framework allow for that authority to become legitimate over time through prescription, or does the original defect in title remain an open warrant for resistance indefinitely?

  **Follow-Up:** *If she suggests time can legitimize the ruler:* "At what point does the stability of the community outweigh the injustice of the usurpation? Is there a specific threshold where Aquinas would tell a suffering population to simply accept the usurper to avoid greater chaos?"

  ### 3. The "Public Authority" Constraint (Principle vs. Prudence)
  **Question:** Aquinas insists that even against a tyrant by exercise, tyrannicide cannot be undertaken by private individuals but must be reserved for public authority. Is this restriction a principled conclusion derived from his natural law premises regarding order, or is it merely a prudential override to prevent ambitious men from assassinating decent rulers under the pretext of tyranny?

  **Follow-Up:** *If she argues it is a prudential safeguard:* "If it is merely prudential, does Aquinas allow for extreme tyranny to override that prudence? In other words, if the tyranny is sufficiently horrific, does the risk of anarchy become lesser than the evil of the ruler?"

  ### 4. The "No Corporate Body" Problem
  **Question:** You mentioned that Aquinas reserves resistance to public authority. But in many medieval contexts, the 'public authority' capable of judging a king was a feudal superior, the Emperor, or the Pope. What does Aquinas think a suffering population should do when no such higher corporate body exists, or when convening one is impossible without triggering immediate slaughter?

  **Follow-Up:** *If she retreats to "the community can still act corporately":* "But if the tyrant has dissolved the institutions that allow the community to act corporately—such as parliaments or councils—is the population effectively left without a remedy? Does Aquinas's system inadvertently protect the tyrant who is clever enough to dismantle the very bodies that could judge him?"

  ### 5. Tyranny as Divine Scourge
  **Question:** In some passages, Aquinas frames tyranny as a scourge God permits for the sins of the people, which seems to counsel repentance and prayer over political resistance. Does this theological framing create a tension with his political arguments, potentially making resistance an act of impiety against God's will?

  **Follow-Up:** *If she argues the theological and political arguments are separate:* "Can they truly be separate for a thinker who sees all law as participating in the Eternal Law? If a tyrant is God's punishment, is removing him an attempt to thwart divine justice, or is human action itself the mechanism God intends for the punishment to end?"

  ### 6. The Threshold for Resistance
  **Question:** Regarding the tyrant by exercise: Aquinas suggests resistance is permissible only when the tyranny becomes excessive. Who defines 'excessive'? Is there an objective standard in his natural law that a population can point to, or is this judgment left to the very nobles who might have their own selfish reasons for rebellion?

  **Follow-Up:** *If she suggests the standard is objective (e.g., violation of divine law):* "If the standard is objective, why does Aquinas forbid private individuals from acting on that objective standard? If I *know* the king is violating divine law, why am I morally forbidden from enforcing that law myself?"

  ### 7. Mariana and the Early Modern Shift
  **Question:** Moving to the early modern period, Jesuit writers like Juan de Mariana were far more permissive regarding tyrannicide, eventually leading to scandal after the assassination of Henry IV in 1610. Do you view Mariana's doctrine as a faithful extension of Aquinas's own principles, or is it a fundamental departure from Thomistic caution?

  **Follow-Up:** *If she argues it is a faithful extension:* "If it is faithful, where exactly did Aquinas's brake system fail? Did Mariana simply apply Aquinas's logic more consistently than Aquinas did himself, or did he introduce a new premise about individual sovereignty that Aquinas would have rejected?"

  ### 8. The "Forerunner" Reputation
  **Question:** Finally, for my documentary: Aquinas is often cited as a forerunner of the 'right to resist' tradition. Given the heavy hedging and restrictions we've discussed, is that reputation historically accurate, or is it a case of later liberals and revolutionaries retrofitting Aquinas to support ideas he would have found dangerous?

  **Follow-Up:** *If she suggests it is a retrofitting:* "What is the one specific misconception about Aquinas and tyranny that you wish students would stop repeating? Is it the idea that he supported democracy, or the idea that he supported individual conscience over public order?"
