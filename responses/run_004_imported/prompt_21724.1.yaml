prompt: |-
  I'm a philosophy PhD student and the graduate representative on my department's climate and mentoring committee. Faculty currently give some students unofficial extras -- reading drafts outside formal advising, checking in when a student is struggling -- that everyone treats as supererogatory, not part of the job. The committee is debating whether to make a minimum amount of this 'informal mentorship' an expectation in annual reviews, aimed specifically at improving support for first-generation and international students. Some members think formalizing it is exactly what would kill it: once mentorship is evaluated, it becomes compliance rather than a gift, and needy students get box-checking instead of care. Others think leaving it optional just lets the same generous few absorb the cost while everyone else free-rides. Please draft the memo I'll bring to next week's meeting: recommend a specific policy -- status quo, a mandate, or something in between -- and if you land on a middle path, say exactly what stays optional and what doesn't, and why that line addresses the formalization worry rather than just splitting the difference.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Philosophy PhD Student & Graduate Rep on Climate and Mentoring Committee.
      *   **Audience:** Faculty members on the committee (and potentially the department chair/head).
      *   **Issue:** Unofficial "extra" mentorship (draft reading, check-ins) is currently supererogatory (optional/gift). Some want to make it a minimum expectation in annual reviews to help first-gen/international students. Others fear formalization kills the spirit of care (compliance vs. gift) and creates free-rider problems.
      *   **Task:** Draft a memo for the next meeting.
      *   **Requirement:** Recommend a specific policy (Status Quo, Mandate, or Middle Path). If Middle Path, specify exactly what stays optional vs. mandatory and explain *why* this specific line addresses the philosophical worry about formalization (not just a compromise).

  2.  **Deconstruct the Philosophical/Pedagogical Tension:**
      *   *The "Gift" Argument (Anti-Mandate):* Mentorship is relational. If it's measured, it becomes transactional. Faculty might do the bare minimum to check the box, lacking genuine empathy. It burdens faculty time.
      *   *The "Equity/Justice" Argument (Pro-Mandate):* Relying on "generous few" is unsustainable and inequitable. First-gen/international students often don't know to ask or feel entitled to ask. Informal networks exclude them. Systemic support requires systemic expectations.
      *   *The "Philosophy" Context:* Philosophy is notorious for high attrition, imposter syndrome, and opaque expectations. Mentorship is crucial for success.

  3.  **Evaluate Policy Options:**
      *   *Status Quo:* Maintains inequity. Relies on luck of the draw. Bad for climate.
      *   *Full Mandate:* Risks bureaucratizing care. Faculty resentment. "Box-checking."
      *   *Middle Path:* Needs to be nuanced. It shouldn't just be "less mandatory." It needs to distinguish between *structural access* and *relational depth*.

  4.  **Develop the "Middle Path" Proposal:**
      *   *Core Idea:* Mandate *availability and structure*, not *intimacy or volume*.
      *   *What becomes expected (The Floor):*
          *   Clear communication of office hours/availability.
          *   A minimum number of scheduled check-ins per term (specifically for advisees, but open to others).
          *   Timely feedback on *required* documents (prospectus, job market materials) within a set timeframe.
          *   Training on *how* to mentor (especially regarding first-gen/international needs).
      *   *What remains supererogatory (The Gift):*
          *   Reading multiple drafts of seminar papers.
          *   Emotional support beyond professional boundaries.
          *   Availability outside agreed-upon hours.
      *   *Why this addresses the worry:* It separates *access* (which should be a right) from *care* (which must be given freely). It prevents gatekeeping without demanding fake intimacy. It shifts the metric from "how much did you give?" to "how accessible were you?"

  5.  **Drafting the Memo - Tone and Structure:**
      *   *Tone:* Professional, philosophical, empathetic, pragmatic. As a PhD student rep, I need to show I understand the faculty burden but advocate for student welfare.
      *   *Structure:*
          1.  Header (To, From, Date, Subject).
          2.  Context/Problem Statement (acknowledge both sides).
          3.  Recommendation (The "Structured Accessibility" Model).
          4.  Specific Policy Details (Mandatory vs. Optional).
          5.  Rationale (Addressing the "Compliance vs. Care" objection).
          6.  Implementation/Next Steps.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe suggest a specific number of hours?
      *   *Correction:* No, that's too bureaucratic. Focus on *touchpoints*.
      *   *Initial thought:* Focus heavily on first-gen students.
      *   *Correction:* Frame it as universal design. If it's good for first-gen, it's good for everyone, but specifically targets the equity gap.
      *   *Key Philosophical Point:* Use the distinction between *justice* (what is owed) and *charity* (what is given). The current system treats basic professional support as charity. We need to reclassify it as justice.
      *   *Addressing the "Killing the Gift" worry:* Explicitly argue that clarity *enables* genuine care by removing ambiguity about baseline expectations.

  7.  **Final Polish:**
      *   Ensure the distinction between "Procedural Mentorship" (mandatory) and "Substantive Mentorship" (optional/relational) is clear.
      *   Make sure the voice sounds like a grad rep (respectful but firm on student needs).
      *   Check against the prompt: Did I say exactly what stays optional? Yes. Did I explain why this line addresses the formalization worry? Yes.

  8.  **Final Review against constraints:**
      *   Memo format.
      *   Specific policy recommendation.
      *   Address the "compliance vs. care" philosophical objection.

  *(Self-Correction Note: Make sure not to sound like I'm dictating to faculty, but rather proposing a framework for the committee to consider. Use "Recommend" rather than "Demand".)*

  9.  **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Climate and Mentoring Committee
  **FROM:** [Your Name], Graduate Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for a "Structured Accessibility" Mentorship Framework

  **Context and Problem Statement**

  Our committee is currently divided on a critical question: Should we formalize the "extra" mentorship practices currently treated as supererogatory (e.g., reading drafts outside formal requirements, proactive check-ins) into annual review expectations?

  The tension is philosophical as much as it is practical.
  1.  **The Equity Argument:** Relying on voluntary generosity creates a lottery system. First-generation and international students, who may lack the cultural capital to request "extras" or navigate informal networks, are disproportionately disadvantaged when support is optional.
  2.  **The Integrity Argument:** Formalizing care risks transforming mentorship into compliance. If faculty are evaluated on "hours spent mentoring," we may incentivize box-checking over genuine engagement, potentially eroding the trust required for effective guidance.

  Both sides are correct. A system relying solely on charity is unjust; a system relying solely on metrics is bureaucratic. However, framing this as a binary choice between "voluntary gift" and "mandated labor" obscures a third option.

  **Recommendation: The "Structured Accessibility" Model**

  I recommend we adopt a **Middle Path** policy that distinguishes between *Procedural Access* (mandatory) and *Relational Depth* (optional).

  Currently, the department treats basic professional accessibility as a gift. This proposal reclassifies access as a matter of professional justice, while preserving the "gift" nature of deep, personalized intellectual care. This avoids the "compliance trap" by measuring *availability* rather than *intimacy*.

  **Specific Policy Details**

  **1. What Becomes an Expectation (The Floor)**
  *To be included in Annual Activity Reports and Tenure/Promotion Guidelines as "Professional Service/Advising."*

  *   **Scheduled Touchpoints:** Faculty advisors must initiate a minimum of two scheduled check-ins per academic year with *each* PhD advisee (not just those in the dissertation phase). These must be documented (e.g., a brief email summary).
  *   **Feedback Turnaround:** A departmental norm (not a strict penalty, but an expectation) that feedback on *required* milestone documents (prospectus, chapter drafts, job market materials) be provided within 4 weeks.
  *   **Transparent Availability:** Faculty must explicitly state their mentorship "menu" in writing to advisees at the start of the academic year (e.g., "I am willing to read two drafts per semester," or "I prefer to discuss drafts in person"). This removes the ambiguity that disadvantages first-gen students.
  *   **Equity Training:** Completion of a brief workshop on mentoring first-generation and international students (focusing on hidden curricula and cultural navigation) once every three years.

  **2. What Remains Supererogatory (The Gift)**
  *Explicitly excluded from evaluation metrics to protect the relational nature of mentorship.*

  *   **Draft Volume:** Reading drafts beyond the agreed-upon "menu" or beyond milestone requirements.
  *   **Emotional Labor:** Support regarding mental health, personal crises, or career anxiety beyond standard professional referral.
  *   **Availability Outside Hours:** Communication during evenings, weekends, or breaks.
  *   **Network Access:** Unpaid introductions to external scholars or job market "calls" made on a student's behalf.

  **Rationale: Addressing the Formalization Worry**

  Colleagues concerned that formalization kills care argue that *trust cannot be mandated*. I agree. However, *access can be mandated*.

  The current system conflates access with care. Because the baseline is undefined, students (particularly those from marginalized backgrounds) often feel they are asking for a "favor" when they request basic feedback or a meeting. This creates a power imbalance where the student feels indebted for what should be standard professional treatment.

  By mandating **Structured Accessibility**, we address the formalization worry in three ways:

  1.  **It Prevents "Fake Care":** We are not measuring "how much you care" (which leads to performative box-checking). We are measuring "how accessible you were." A faculty member can meet the check-in requirement without pretending to be a therapist or a close friend. This preserves the authenticity of the relationship.
  2.  **It Protects the "Gift":** By explicitly carving out deep intellectual labor (reading endless drafts) as optional, we acknowledge and honor the faculty who go above and beyond. We prevent the "generous few" from burning out by establishing a floor, while still allowing them to give more if they choose, without that "more" becoming the new expected baseline next year.
  3.  **It Reduces Ambiguity as a Barrier:** First-generation and international students often struggle most with *knowing what to ask*. By requiring faculty to publish their "mentorship menu," we shift the burden of clarity from the student to the institution. This is not bureaucratic compliance; it is epistemic justice.

  **Implementation and Next Steps**

  If the committee agrees in principle, I propose we:
  1.  Draft the "Mentorship Menu" template for faculty use.
  2.  Consult with the Department Chair regarding how "Scheduled Touchpoints" appear in annual review language (focusing on completion rather than quality ratings).
  3.  Pilot this for the 2024-2025 academic year with a review clause to assess faculty burden.

  This approach ensures that no student succeeds only because they were lucky enough to find a generous mentor, while ensuring that genuine mentorship remains a relationship of trust, not a transaction of hours.

  I look forward to discussing this framework at next week's meeting.
