answer: |-
  Here are ten interview questions designed for a philosophy-of-science colloquium, tailored to your background in evolutionary biology. They move beyond the standard textbook objections to probe the practical and metaphysical implications of the Cummins-style account.

  ### 1. The Malfunction Problem
  **Question:** A core motivation for the etiological view is its ability to ground the normativity of "malfunction"—a heart *ought* to pump even if it doesn't. On your view, if a heart loses the capacity to pump, it simply lacks that function relative to the circulatory system. But in clinical and biological practice, we treat a non-pumping heart as *failed*, not merely different. If "malfunction" is just "absence of capacity," how does your account distinguish between a broken heart and a heart that has simply been repurposed or decommissioned by the organism, without smuggling in a historical 'ought'?

  *   **Likely Dodge:** She will argue that malfunction is relative to the specific analytical capacity chosen by the researcher.
  *   **Follow-up:** "But who gets to choose the capacity? If the biologist chooses 'circulation,' isn't that choice itself guided by the knowledge that this organ was *maintained by selection* for circulation? Doesn't the normativity return in the selection of the explanatory context?"

  ### 2. The Liberality Worry
  **Question:** Critics argue that because any causal contribution counts as a function on your view, the concept becomes too liberal—for example, the heart's function includes making thumping noises because that contributes to a cardiologist's capacity to diagnose. You've suggested this liberality is a feature, not a bug. But if 'function' applies to noise-making, blood-pumping, and heat-radiating equally, does the term lose its utility in distinguishing the *organized* contributions of a system from mere side effects?

  *   **Likely Dodge:** She will claim that functions are only ascribed relative to a specific explanatory interest (e.g., we aren't interested in noise when explaining circulation).
  *   **Follow-up:** "If 'function' is entirely parasitic on 'explanatory interest,' isn't it just a synonym for 'relevant cause'? Why retain the teleological language of 'function' at all if it doesn't track a specific subset of causal relations?"

  ### 3. Swampman and Unselected Traits
  **Question:** Consider a Swampman-style case or a trait arising from synthetic biology that has no selection history. The etiological account says these traits have no functions; your account says they do, provided they contribute to a system capacity. You frame this as an advantage for your view. But isn't it possible that the etiological intuition—that without history there is no *biological* function—is correct? Does granting functions to Swampman traits prove your view is more flexible, or that it fails to capture what makes biological function distinct from mere mechanical operation?

  *   **Likely Dodge:** She will argue that biology needs to explain the current capacities of organisms, regardless of their history, to be useful for physiology.
  *   **Follow-up:** "Physiology certainly needs to explain capacities, but do they need to call those capacities 'functions'? If we strip away the evolutionary history, haven't we moved from biology into biochemistry or physics?"

  ### 4. Cancer and Pathological Functions
  **Question:** In cancer biology, tumor cells often exhibit highly organized causal roles—they recruit blood vessels, suppress immune responses, and metabolize efficiently. On a strict Cummins account, relative to the *tumor system*, these are functions. Relative to the *host*, they are malfunctions. Does your view force us to accept that cancer has 'functions' simply because it is a complex, self-maintaining system? If so, how do we preserve the biological distinction between physiological function and pathological process?

  *   **Likely Dodge:** She will say the attribution depends on which containing system we are analyzing (the organism vs. the clonal cell line).
  *   **Follow-up:** "But the organism is the privileged unit in evolutionary biology. If your account treats the tumor's systemic capacity as functionally equivalent to the host's, aren't you erasing the distinction between the individual and the parasite that evolution relies on?"

  ### 5. Exaptation and Function Change
  **Question:** When a trait is co-opted for a new use (exaptation), the etiological account struggles to say the *new* use is a function until selection acts. Your account handles this easily. However, does this ease come at the cost of continuity? If a feather's function changes from insulation to flight instantly on your view, do we lose the ability to track the *evolutionary transition* where the trait was present but not yet functional for flight?

  *   **Likely Dodge:** She will argue that tracking the transition is a historical project, while ascribing function is a structural project; they don't need to match.
  *   **Follow-up:** "But evolutionary biology is precisely the project of marrying structure and history. If your definition of function ignores the 'not yet functional' phase of an adaptation, doesn't it render the concept useless for studying the origin of novelty?"

  ### 6. Systems Biology vs. Evolutionary Biology
  **Question:** Your view seems tailor-made for systems biology, where the focus is on network topology and current capacity rather than history. Do you see the Cummins account as the primary definition for physiology and the etiological account as secondary for evolution? Or do you believe the causal-role account should fully replace the selected-effects account even in evolutionary explanations?

  *   **Likely Dodge:** She will likely advocate for a pluralistic approach where different definitions serve different sub-disciplines.
  *   **Follow-up:** "If we accept pluralism, doesn't that concede that 'biological function' isn't a natural kind? And if it's not a natural kind, why do philosophers fight so hard to define it universally?"

  ### 7. The Artifact Analogy
  **Question:** The causal-role account works seamlessly for artifacts (a thermostat's function is to regulate temperature). By aligning biological function so closely with artifact function, do you risk obscuring the disanalogy that organisms, unlike thermostats, create and maintain themselves? Does your view inadvertently treat organisms as designed objects without a designer?

  *   **Likely Dodge:** She will argue that the analogy is useful because both involve analyzing complex systems relative to a capacity.
  *   **Follow-up:** "But the 'design' in organisms is illusory (selection), whereas in artifacts it's literal (intent). If your account treats them identically, aren't you grounding biological function in a metaphor rather than a mechanism?"

  ### 8. Explaining Presence vs. Explaining Activity
  **Question:** Etiological accounts explain why a trait is *present* in the population. Causal-role accounts explain what a trait is *doing* in the system. Is there a risk that by focusing on the latter, we lose the ability to explain why the trait persists over deep time? Can a causal-role account ever explain the stability of a trait, or only its current operation?

  *   **Likely Dodge:** She will say that explaining stability is an evolutionary question, not a functional analysis question.
  *   **Follow-up:** "But if 'function' is supposed to be the bridge between the trait's activity and its persistence, and your definition cuts that link, haven't you made function explanatorily isolated from evolution?"

  ### 9. Interest-Relativity and Hidden Normativity (Part 1)
  **Question:** You argue that the "liberality" of your view is managed by the researcher's interest-relative choice of capacity. But in practice, biologists' interests are heavily constrained by evolutionary theory—they look for capacities that enhance fitness. Isn't it the case that 'interest-relativity' is just a backdoor way of reintroducing selection? Are you actually allowing *any* causal role, or just the ones selection would have picked?

  *   **Likely Dodge:** She will insist that researchers often study capacities that are byproducts or neutral, not just adaptations.
  *   **Follow-up:** "Can you give a concrete example where a biologist ascribes a 'function' to a trait that they know is a neutral byproduct? If they don't, then 'interest' is tracking 'selection' anyway, and selection is doing the normative heavy lifting."

  ### 10. Interest-Relativity and Hidden Normativity (Part 2)
  **Question:** Following up on that: If functions are interest-relative, then normative claims (e.g., "this heart is diseased") are also interest-relative. But medical normativity feels objective—a patient dies regardless of the biologist's interest. If your account makes malfunction dependent on our explanatory choices, does it undermine the objectivity required for fields like medicine or conservation biology?

  *   **Likely Dodge:** She will argue that the interests are constrained by the objective facts of the system's organization, so the normativity is stable enough.
  *   **Follow-up:** "But 'organization' is descriptive, while 'disease' is prescriptive. If the prescriptive force comes from our *interest* in the organism surviving, isn't that interest ultimately grounded in the evolutionary fact that organisms *are* selected to survive? So aren't we back to Wright?"
