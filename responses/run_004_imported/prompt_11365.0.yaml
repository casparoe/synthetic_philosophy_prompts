      *   Let's ensure the Liberality question is distinct from the "Function vs. Cause" question.

  5.  **Final Review against Constraints:**
      *   8-10 questions? Yes.
      *   No simple Cummins vs. Wright restatement? Yes, focused on implications/applications.
