      *   **Goal:** 8-10 interview questions.
      *   **Constraints:**
          *   Do *not* just ask for a restatement of Cummins vs. Wright (the classic debate).
          *   Must include specific topics:
              *   Malfunction problem (normativity).
              *   Liberality worry (hearts make noise).
              *   Swampman/unselected traits (is permissiveness an advantage or a bug?).
              *   Interest-relativity (does it smuggle in selection-based normativity?).
          *   Format: Each question needs a "quick follow-up" keyed to the likely dodge.
          *   Tone: Academic, probing, respectful but challenging (suitable for a colloquium).

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Cummins (CR):** Function = causal contribution to a capacity of a containing system. Context-dependent. No inherent normativity (malfunction is just lack of capacity). Liberality is a feature (functions are relative to explanatory interests).
      *   **Wright/SE:** Function = why the trait was selected. Inherent normativity (malfunction = failing to do what it was selected for). Restrictive (only selected traits have functions).
      *   **The Tension:** CR is good for physiology/systems biology but struggles with normativity/malfunction. SE is good for evolution/normativity but struggles with spandrels/new traits.
      *   **The Guest's Stance:** Defends CR. Claims liberality is good (interest-relative). Needs to be pushed on whether "interest" hides "selection."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Malfunction.*
          *   *Idea:* If a heart stops pumping, CR says it just lacks the capacity. SE says it's *broken*. How does CR handle the *normative* force of "broken"?
          *   *Draft:* How do you handle malfunction?
          *   *Refinement:* Make it sharper. Focus on the distinction between "can't" and "shouldn't."
          *   *Follow-up:* She'll likely say "malfunction is relative to the analyzed capacity." Push back: That doesn't capture the *failure* aspect.

      *   *Requirement 2: Liberality (Hearts make noise).*
          *   *Idea:* If I explain the sound of the heartbeat, is making noise a function? CR says yes. SE says no.
          *   *Draft:* Isn't it too liberal? Hearts make noise.
          *   *Refinement:* Focus on the "explanatory context." If *any* causal role counts, does "function" lose its distinctive scientific utility?
          *   *Follow-up:* She'll say "It depends on what you're explaining." Push: Does this make 'function' just a synonym for 'cause'?

      *   *Requirement 3: Swampman/Unselected Traits.*
          *   *Idea:* Swampman has no history. SE says no functions. CR says yes. Is this an advantage or does it show CR is too loose?
          *   *Draft:* What about Swampman?
          *   *Refinement:* Frame it as a tension between "forward-looking" (what it does now) vs. "backward-looking" (history). If CR allows Swampman functions, does it detach function from *biology* specifically?
          *   *Follow-up:* She'll say "Biology needs to explain current capacities." Push: Then why call it 'biological function' and not just 'causal role'?

      *   *Requirement 4: Interest-Relativity & Normativity (The "Smuggling" charge).*
          *   *Idea:* She says functions are interest-relative. But don't scientists' interests track selection history anyway?
          *   *Draft:* Is interest-relative just selection in disguise?
          *   *Refinement:* When a biologist picks a capacity to analyze, aren't they usually picking the one that was selected for? If so, isn't selection doing the heavy lifting?
          *   *Follow-up:* She'll deny the convergence. Push: Show empirical evidence where interests diverge from selection.

      *   *Filling the rest (8-10 total):*
          *   Need questions on: Systems Biology, Cancer, Homology, Artifact Analogy, Normativity in Medicine, Evolutionary Explanations.
          *   *Q4 (Systems Bio):* CR fits systems bio better. Does this mean SE is obsolete for physiology?
          *   *Q5 (Cancer):* Cancer cells have causal roles. Are they functional? CR might say yes (relative to the tumor). SE says no (malfunction). How to distinguish?
          *   *Q6 (Homology):* How does CR handle traits that keep the same structure but change function (exaptation)? SE handles this well.
          *   *Q7 (Artifacts):* CR works for artifacts. Does this blur the line between biological and artificial? Is that okay?
          *   *Q8 (Normativity in Medicine):* Doctors treat malfunction. If CR lacks normativity, is it useless for medicine?
          *   *Q9 (Evolutionary Explanations):* Can CR explain *why* a trait is there, or only *how* it works?
          *   *Q10 (Future Proofing):* With synthetic biology (new traits), does CR become the default?

  4.  **Refining and Polishing:**
      *   Ensure the tone is appropriate for a PhD-level colloquium (technical but accessible).
      *   Check the "Follow-up" sections. They need to anticipate the standard CR defense (e.g., "It's context dependent") and press further.
      *   Ensure the specific constraints (Malfunction, Liberality, Swampman, Interest-Relativity) are met prominently.

