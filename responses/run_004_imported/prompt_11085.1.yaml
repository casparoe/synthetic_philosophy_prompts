prompt: |-
  my best friend from my phd program is getting married in three weeks and I'm giving the toast, and I've gotten myself into a bit of a bind. Priya and I are both finishing dissertations on classical Indian philosophy -- she's the one who actually specializes in Nyaya epistemology, I'm more on the Buddhist logic side, but we've spent four years reading nyaya sutra commentaries together for our comps -- and she's marrying Mark, who is great but has never read a philosophy text in his life (he's an ER nurse). So the room is going to split almost exactly in half: her whole cohort and commitee, who will absolutely notice if I get vyapti wrong, and then Mark's family plus most of Priya's actual relatives, who just need this to be a sweet wedding toast and not a defense.

  A few weeks ago, half-delirious from studying, I told Priya I was going to structure the toast around the four pramanas -- perception, inference, comparison, and testimony -- as four different routes by which the room can be said to "know" these two are actually right for each other. She thought it was hilarious and is now holding me to it, so backing out isn't an option anymore. Could you actually write this toast for me? I want real content in there and not just the labels: use the smoke-on-the-hill inference for anumana, the classic gavaya (the wild-ox one) story for upamana, and for sabda I want a bit about what actually makes someone an "apta," a reliable testifier, since atleast three of Priya's aunties are planning to give impromptu testimony about how they "always knew" these two would end up together, and I suspect by Nyaya's own standards that shouldn't count as knowledge at all. Pratyaksa (perception) is the easy one -- "just look at them" -- but I'm sure you can do better than that too. It needs to land as an actual warm, funny wedding toast, around four or five minutes long, not a re-enactment of my qualifying exam.
