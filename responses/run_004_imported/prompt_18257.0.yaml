answer: |-
  **Setting:** *A university seminar room, late afternoon. The whiteboard is covered in decision nodes. In the corner, a graduate student acting as the "Trader" stands behind a table with three brochures: Package A (Cheap, Bad Weather), Package B (Moderate, Moderate), Package C (Expensive, Great Weather). You are watching Elena (a strict transitivity theorist) and Marcus (a proponent of resolute choice) observe the setup.*

  **Elena:** Look at him. He's actually picking up Package C. He knows he prefers A to B, B to C, and C to A. He knows the fee is a dollar. And he's going to sign the first slip.

  **Marcus:** He's not irrational yet, Elena. He's just at the first node. He prefers B-minus-a-dollar to C. Why wouldn't he trade?

  **Elena:** Because he knows where the road goes. It's a money pump. If he takes this trade, he'll take the next. He'll trade B for A, then A back to C. He'll end up with exactly what he started with, only three dollars poorer. The cycle *is* the irrationality. It's not a bug in the execution; it's a bug in the preference structure.

  **Marcus:** That's the textbook line. But it assumes the Chooser is a slave to the moment. It assumes that because he *currently* prefers B to C, he is rationally compelled to trade. McClennen's point is that rational agency extends over time. The Chooser can form a plan at the outset: "I will take the first trade, take the second, and then I will *stop*."

  **Elena:** Stop? At the third node, he holds A. The offer is A for C-minus-a-dollar. By his own lights, right then and there, C-minus-a-dollar is better than A. If he stops, he is knowingly choosing an option he ranks lower. You're calling that "rational planning"? I call it akrasia. You haven't removed the irrationality; you've just relocated it from the preference cycle to the dynamic inconsistency. You're asking him to act against his own current judgment.

  **Marcus:** I'm asking him to act according to a *prior* judgment that governs the sequence. Look, if rationality is just maximizing at every single node, then yes, he's doomed. But that's a myopic view of agency. When I decide to diet, I prefer the salad now. But at 10 PM, I prefer the cake. If I eat the cake because "currently I prefer it," am I being rational? Or am I failing to execute a plan that serves my broader evaluative stance?

  **Elena:** Dieting is about weakness of will. This is different. In the diet case, you claim your *true* preference is the long-term health. In the money pump, by stipulation, his preference *at the third node* is genuinely C over A. It's not a lapse in attention. It's his actual value function. To tell him "ignore that" is to tell him "ignore your values." That's not rationality; that's self-deception.

  **Marcus:** It's not ignoring values. It's recognizing that values can be context-dependent without being irrational. Think about the Davidson-McKinsey-Suppes setup. He prefers A to B because of price. B to C because of itinerary. C to A because of weather. The weighting shifts based on the pairwise comparison. That's how human valuation works. If we say that structure is forbidden, we're saying most human beings are structurally irrational. Resolute choice says: "Your preferences can cycle, but your *choice function* must be constrained by your plan." The rationality isn't in the snapshot preference; it's in the integrity of the plan.

  **Elena:** But that's expensive. You're positing a whole new faculty of "resolution" just to save the cycle. Why not just use sophistication? If the Chooser is sophisticated, he uses backward induction. He looks at the third node, sees he will trade A for C, and realizes that taking the first trade leads to C-minus-three-dollars. Since C is better than C-minus-three, he simply rejects the first trade. No resolve needed. He just anticipates his future self and constrains his current choice accordingly.

  **Marcus:** Ah, the sophisticated move. It looks cleaner, but it's not the free lunch you think it is. You say he "simply rejects" the first trade. But at the first node, he prefers B-minus-one to C. To be sophisticated, he has to reject B-minus-one *even though he prefers it*.

  **Elena:** He rejects it because he knows it leads to a worse outcome overall.

  **Marcus:** Exactly. So he is *still* choosing an option he currently ranks lower. He is ranking "C (status quo)" above "B-minus-one" at node one, even though his pairwise preference says B-minus-one is better. He's only doing it because he treats his future irrationality as a fixed constraint. Sophistication accepts the pump as inevitable and retreats. Resolute choice says the pump is avoidable if I bind my future self. Both violate local maximization, Elena. The difference is that Sophistication admits defeat to the cycle, while Resolution masters it.

  **Elena:** But Sophistication doesn't require a mysterious "binding." It's just standard game theory applied to oneself. If I know I'm going to walk off a cliff at step three, I don't take step one. That's consistent. Your Resolute Chooser has to perform a kind of magic trick where he decides at step one that step three's preferences don't count. Why do step three's preferences get vetoed?

  **Marcus:** Because step three's preferences are the result of a process he already deemed destructive at step one! If I know that indulging my preference at step three ruins the plan I validated at step one, rationality demands I stick to the plan. But let's step back from the mechanics. Why are we so desperate to ban intransitivity?

  **Elena:** Because it leads to sure losses. Money pumps.

  **Marcus:** In toy cases with dollars, sure. But what about when the currency isn't money? Think of Rachels' spectrum cases. Or Temkin. A world with mild headaches for a billion people versus one person being tortured for fifty years. Plausibly, the billion headaches are worse than the million. The million are worse than the thousand. But is the thousand worse than the one torture? Many people have the intuition: No. The torture is uniquely bad. That's intransitive.

  **Elena:** Temkin uses that to argue "better than" isn't transitive. I use it to argue our intuitions about spectra are messy and need refinement.

  **Marcus:** Or maybe "better than" really is intransitive in axiology. If we accept the money pump argument, we have to say that anyone who holds those moral intuitions is structurally irrational, vulnerable to being "pumped" out of moral value. But there's no trader in the moral case. There's no sequence of swaps. The pump relies on dynamic choice structures that don't exist in static moral comparison. If we ban intransitivity because of the pump, we're letting a parlor trick dictate the structure of value theory.

  **Elena:** That's a category error. Decision theory is about action under scarcity. If your moral theory implies you'd trade away moral value in a cycle, your moral theory is action-guidingly defective. But fine, grant me the moral case. In the vacation case, there *is* a trader. There *are* fees. The Chooser is losing utility. If he can keep the cycle but stop the loss via resolution, fine. But you still haven't answered the charge: at the moment of the third trade, he is choosing what he judges to be worse.

  **Marcus:** He is choosing what he judges to be worse *in isolation*. But he is choosing what he judges to be better *as part of the plan*. You're assuming the only valid perspective is the instantaneous one. I'm saying the plan has normative weight.

  **Elena:** And I'm saying the plan only has weight if it aligns with the preferences at the time of execution. Otherwise, it's tyranny by your past self. Why does the Marcus of Tuesday get to dictate to the Marcus of Thursday?

  **Marcus:** Because the Marcus of Tuesday made a commitment that the Marcus of Thursday has reason to honor. If I can't commit, I can't cooperate with myself. And if I can't cooperate with myself, I'm not an agent; I'm a sequence of temporal slices. The money pump doesn't prove intransitivity is irrational. It proves that *myopic* maximization is irrational.

  **Elena:** And Sophistication avoids myopia without the tyranny. It acknowledges the Thursday self's preferences by predicting them, rather than trying to override them.

  **Marcus:** It acknowledges them by capitulating to them! It says, "I can't stop the pump, so I won't start." Resolute choice says, "I can stop the pump, so I will." One limits agency to fit the preferences; the other shapes preference-execution to fit the agency.

  **Elena:** But at what cost? If you have to cultivate a psychological ability to ignore your current preferences to make your theory work, maybe the theory is the problem. Transitivity is cheap. It doesn't require willpower. It just requires consistent ordering.

  **Marcus:** And it requires us to deny plausible value structures, like the spectrum cases, just to save the math. I'd rather keep the value structures and pay the price of a more complex theory of agency.

  **Elena:** *(Gesturing to the Trader, who is tapping a pen on the table)* Well, the Chooser is hesitating. He's looking at the third slip.

  **Marcus:** He's resolving.

  **Elena:** He's realizing he's about to throw away a dollar for nothing. That's not resolution; that's learning. If he learns to stop, he's admitted C isn't better than A in this context. The cycle breaks.

  **Marcus:** Or he's realized that being a pump victim is worse than holding A. He's changed his meta-preference, not his object-preference. He still likes the weather on C more than A. He just likes keeping his dollar more.

  **Elena:** Then money is the transcendent metric. And if money is transitive, his overall preference ordering is transitive. The cycle was an illusion of focusing on attributes.

  **Marcus:** *(Smiling)* And there it is. You'll always save transitivity by expanding the description of the options until they fit. I'm willing to let the cycle stand and fix the choice rule.

  **Elena:** And I'm willing to fix the preference rule because I don't trust a choice theory that tells agents to ignore what they want in the moment.

  **Marcus:** We're not disagreeing about the math, Elena. We're disagreeing about what a person is.

  **Elena:** A locus of consistent preferences.

  **Marcus:** A project extended through time.

  *(The Trader clears his throat. The Chooser puts the pen down. He keeps Package A. He declines the trade.)*

  **Elena:** See? Sophistication. He knew he'd regret the next trade.

  **Marcus:** Or resolution. He decided five minutes ago he wouldn't be played. We can't tell from the outside.

  **Elena:** No. We can't. But I know which one I'd bet on.

  **Marcus:** And I know which one allows me to keep my moral intuitions intact.

  *(They watch the Trader pack up the brochures. Neither moves to leave.)*
