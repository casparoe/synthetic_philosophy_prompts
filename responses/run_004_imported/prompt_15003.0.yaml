          *   *Argument 3: Boltzmann Brains.* If we treat the current state as a fluctuation without PH, we get BBs. If we treat PH as a brute fact, we avoid BBs, but we haven't explained *why* the universe isn't dominated by BBs in the long run. It makes our existence incredibly special without a mechanism.
          *   *Argument 4: Derivativeness.* If the Arrow depends on PH, then the Second Law isn't a fundamental law, it's a consequence of PH + Microphysics. Calling the Second Law the "explanation" is mislabeling the dependency.
