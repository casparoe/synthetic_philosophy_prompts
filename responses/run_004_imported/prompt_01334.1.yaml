answer: |-
  This is an incredibly sharp observation. You have hit on exactly what keeps Wittgenstein scholars up at night. In fact, the tension you're feeling between the **Hinge** metaphor (static, structural) and the **Riverbed** metaphor (fluid, historical) is the central puzzle of *On Certainty*.

  You aren't missing a "straight answer" because Wittgenstein didn't write one. He died before finishing the book, and more importantly, he wasn't trying to build a systematic theory. He was trying to *dissolve* a confusion.

  However, there is a way to reconcile these metaphors without saying Wittgenstein was just being sloppy. The key lies in distinguishing between **how they function in the moment** versus **how they exist over time.**

  Here is the breakdown of how to make the Hinge and the Riverbed fit together, and what that means for the "Kind vs. Degree" question.

  ### 1. Synchronic vs. Diachronic (The "Now" vs. The "Long Run")

  The easiest way to reconcile the two images is to look at the timescale.

  *   **The Hinge (Synchronic/In the Moment):** When you are in the middle of a specific inquiry (a "language game"), certain things must be held fast *right now*. If you are a geologist testing soil samples, you cannot simultaneously doubt whether the earth exists, whether your hands are real, or whether your testing equipment is functioning. If you doubt those, the inquiry stops. In this specific moment, these propositions are **immutable**. They are the hinges.
  *   **The Riverbed (Diachronic/Over History):** If you zoom out to look at human history over centuries, what counts as a "hinge" changes. 500 years ago, "The sun orbits the earth" functioned as a hinge for most people. It was the bedrock upon which other reasoning flowed. Today, that proposition has shifted into the "water" (it is now something we test/teach), and "The earth orbits the sun" has hardened into the riverbed.

  **The Reconciliation:** A hinge is fixed *relative to the system of doubt operating at that time*, but the system itself evolves. The door needs a stationary hinge to swing *today*, but you can replace the hinge *next year*.

  ### 2. The Crucial Point: Role vs. Content

  This leads to your second, deeper worry: *If hinges can change, aren't they just really entrenched ordinary beliefs?*

  This is the debate between **Kind** (Hinges are logically different from beliefs) and **Degree** (Hinges are just beliefs we feel very strongly about).

  Wittgenstein argues for **Kind**, but with a twist. It is not about the *content* of the sentence, but the *job* the sentence is doing.

  *   **Ordinary Belief:** "There is milk in the fridge." I can verify this. I can be wrong. If I doubt it, I open the door.
  *   **Hinge Certainty:** "I have two hands." I do not verify this. I do not look at my hands to prove they exist before I use them to type. If I try to "verify" this, the verification makes no sense (how do I check? With my hands?).

  **Why it's not just "Degree":**
  If hinges were just "really strong beliefs," then theoretically, with enough evidence, I could doubt them. But Wittgenstein says that doubting a hinge isn't being "more skeptical"; it's **opting out of the language game.**

  If you genuinely doubt "The earth has existed for more than 5 minutes," you aren't a rigorous philosopher; you are, in Wittgenstein's terms, acting in a way that makes communication impossible. You aren't playing the game of "giving and asking for reasons" anymore.

  **So, how does this fit the Riverbed?**
  The *proposition* ("The sun orbits the earth") stays the same, but its **logical status** changes.
  1.  **Phase A:** It functions as a Rule (Hinge/Riverbed). It dictates how we interpret evidence.
  2.  **Phase B:** It functions as an Empirical Claim (Water/Door). It is subject to evidence.

  The shift isn't that the belief got weaker; it's that the *grammar* of our society changed. The proposition moved from being a **rule of the game** to being a **move in the game**.

  ### 3. Is Wittgenstein Being Loose with Metaphors?

  Yes and no.

  *   **Yes:** He explicitly warns against taking his metaphors too literally. He writes in *On Certainty* that he is offering "remarks," not a doctrine. He wants to stop us from looking for a single, perfect foundation for knowledge (like Descartes did).
  *   **No:** The tension is intentional. He wants to show that certainty isn't a rigid, Platonic structure (just Hinges) nor is it a chaotic flux (just Riverbed). It is a **living system**.

  If he only used the Hinge metaphor, you might think human knowledge is static and dogmatic.
  If he only used the Riverbed metaphor, you might think knowledge is relativistic and has no stability.
  By using both, he shows that knowledge requires stability to function, but that stability is human and historical, not divine or eternal.

  ### 4. Summary: Answering your specific worries

  **Worry 1: "One says the foundation can't move... the other says it drifts."**
  *   **Resolution:** The foundation can't move *while you are building the house on it*. But over centuries, we might decide to build on a different patch of land. The immobility is functional, not eternal.

  **Worry 2: "If hinges drift, what's left of the claim that they're a different KIND of thing?"**
  *   **Resolution:** They remain a different *kind* because of how we treat them *while they are acting as hinges*.
      *   **Ordinary Belief:** Justified by evidence.
      *   **Hinge:** Justifies the evidence. (You use your eyes to prove the milk is there; you don't use evidence to prove your eyes work—that's the hinge).
      *   Even if a hinge eventually becomes an ordinary belief (like the sun orbiting the earth), *while it was a hinge*, it was not functioning as a belief. It was functioning as a rule.

  ### A Final Thought for your Reading

  You are reading *On Certainty* exactly right by feeling this tension. Wittgenstein's goal is to make you feel uncomfortable with the idea that "Knowledge" is one single thing.

  He wants you to see that "certainty" isn't a mental state (like feeling really sure). It's a **behavioral stance**. It's how we act. We act *as if* the earth exists. We act *as if* our names are real.

  The Hinge tells you: "You must act this way to do anything at all."
  The Riverbed tells you: "What we act 'as if' is true can change over generations."

  That leaves you with a view of human knowledge that is stable enough to live by, but flexible enough to learn from. That's the sweet spot Wittgenstein was aiming for.
