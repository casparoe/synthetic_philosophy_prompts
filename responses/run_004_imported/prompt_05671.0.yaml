prompt: |-
  I'm part of a small wild food foraging club, about 40 people. Every fall we do a potluck where everyone brings mushrooms they've foraged themselves. For years the rule was that one guy, our most experienced forager (30+ years at it), eyeballs everyones haul and gives a thumbs up or down before it goes near the food table. Last year he almost approved a dangerous lookalike, only caught because another member double-checked on a hunch. Now the club's split: one side wants to replace him with a panel of 5 people who each look it over and majority-vote safe or not, figuring more eyes catches more mistakes. The other side says that's actually more dangerous -- in practice the 5 will just watch whoever sounds most confident and nod along, so it's not really 5 independent checks, and our one expert is so much better at this than any 5 people we'd realistically recruit that diluting his judgment with theirs could make us worse at catching a bad one, not better. I'm on the committee that runs the club and need to bring a short written recommendation to next week's meeting. Can you draft it -- an actual process (how many checkers, what counts as approval, whether we need unanimity since someone could die) plus the reasoning behind it, in a way that seriously deals with the 'more checkers isn't automatically safer' worry instead of just brushing past it?
reasoning: |-
  Here's a thinking process that leads to the recommended proposal:

  1.  **Analyze the Request:**
      *   **Context:** Small wild food foraging club (40 people). Annual mushroom potluck.
      *   **Current Situation:** One expert (30+ years) inspects all mushrooms. Last year, he nearly approved a dangerous lookalike (caught by a less experienced member).
      *   **Conflict:**
          *   *Side A:* Replace the single expert with a panel of 5 (majority vote). Argument: More eyes catch more mistakes.
          *   *Side B:* Keep the single expert (or similar). Argument: Groupthink/authority bias will make the panel ineffective; the single expert is superior to the sum of the panel. Diluting his judgment increases risk.
      *   **Task:** Draft a short written recommendation for the committee to present at the next meeting.
      *   **Requirements:**
          *   Define the actual process (number of checkers, approval criteria, unanimity vs. majority).
          *   Provide reasoning.
          *   *Crucially:* Address the "more checkers isn't automatically safer" concern (groupthink, authority bias, dilution of expertise) seriously, not just hand-wave it.
          *   Tone: Professional, safety-focused, diplomatic, decisive.

  2.  **Evaluate the Options:**
      *   *Option 1: Single Expert.* High expertise, but single point of failure (fatigue, distraction, human error). The near-miss last year proves fallibility.
      *   *Option 2: Panel of 5 (Majority Vote).* Theoretically more eyes, but practically prone to "diffusion of responsibility" and "authority bias." If the loudest person is wrong, the rest follow. Also, finding 5 *competent* people is hard. If 3 are novices and 2 are experts, the novices might outvote the experts or just defer.
      *   *Option 3: Hybrid/Redundant System.* This is the safety engineering approach. Redundancy works *only if* the checks are independent.
      *   *Option 4: Zero Tolerance/Unanimity.* If *anyone* has a doubt, it's out. This shifts the burden from "proving safe" to "proving unsafe."

  3.  **Develop the Recommendation (The "Safety Engineering" Approach):**
      *   *Core Principle:* Mushroom identification is binary (safe/deadly) but human judgment is probabilistic. We need to minimize false positives (calling a deadly mushroom safe).
      *   *Addressing the "Panel" Worry:* The worry about groupthink is valid. To counter it, checks must be *independent* and *sequential*, not simultaneous. The "Veto Power" concept is crucial. One "No" kills the batch. This empowers the less experienced person who had the hunch last year.
      *   *Addressing the "Expert" Worry:* The expert is still vital, but shouldn't be the *only* line of defense. He becomes the final verifier, not the sole decider.
      *   *The Process:*
          1.  **Primary Check:** The Expert (or most qualified available).
          2.  **Secondary Check:** A designated "Safety Officer" (rotating or elected, must have specific training).
          3.  **Open Challenge:** Any member can raise a flag *before* cooking.
          4.  **Decision Rule:** Unanimous consent for safety. One veto = rejection.
      *   *Why this works:* It keeps the expert's high skill central but adds a mandatory independent verification step that breaks the "authority bias" (because the second checker knows their specific job is to disagree if needed). It empowers the "hunch" holder from last year.

  4.  **Drafting the Content - Section by Section:**

      *   **Header:** Clear title, to/from, date.
      *   **Executive Summary:** State the goal (safety) and the recommendation (Dual-Check + Veto).
      *   **The Problem:** Acknowledge the near-miss and the limitations of both the "Single God-Mode Expert" and the "Democratic Panel."
      *   **The Proposal (The Protocol):**
          *   Two mandatory identifiers.
          *   Independent verification (don't stand over each other's shoulders).
          *   Unanimous approval required (Veto power).
          *   "Unknown = Unsafe" rule.
      *   **Reasoning (Addressing the Conflict):**
          *   *Why not just the Expert?* Human error exists (fatigue, cognitive bias). The near-miss proved it.
          *   *Why not a 5-person vote?* Diffusion of responsibility. Social pressure to agree.
          *   *Why this Hybrid?* It creates *independent* redundancy. It formalizes the "hunch." It protects the expert from being the sole scapegoat.
      *   **Implementation:** How to select the second checker (training, not just popularity).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is asking for two experts realistic?
      *   *Fix:* The second person doesn't need to be a 30-year expert. They need to be trained specifically on *local deadly lookalikes*. Their job isn't to identify everything, but to spot the specific dangerous things the expert might gloss over. Actually, better to frame it as "Two Qualified Identifiers." If we only have one true expert, the second person must be the next most qualified, but the rule remains: if either says no, it's out.
      *   *Critique:* The prompt asks to address the "5 people nodding along" worry specifically.
      *   *Fix:* Explicitly mention "Social Loafing" and "Authority Bias" in the reasoning section. Explain how the "Veto" rule counters this.
      *   *Tone Check:* Ensure it doesn't sound like I'm firing the expert. He is an asset. We are protecting him and the club.

  6.  **Final Polish:**
      *   Make it concise.
      *   Ensure the "Unanimity" point is bold. In food safety, especially mushrooms, majority rule is lethal.
      *   Emphasize that "Safe" means "100% Certain," not "Probably."

  7.  **Final Output Generation:** (This matches the provided good response.)
      *   Structure: Recommendation, Protocol, Rationale.
      *   Key phrase: "Independent Redundancy."
      *   Key mechanism: "Veto Power."

  *(Self-Correction Note: Make sure to emphasize that the second checker must write down their ID *before* seeing the first checker's result to ensure independence.)* -> Added to the protocol.

  8.  **Final Review against constraints:**
      *   Short written recommendation? Yes.
      *   Actual process defined? Yes.
      *   Reasoning included? Yes.
      *   Deals with 'more checkers isn't safer' worry? Yes, by focusing on independence and veto power rather than headcount.

