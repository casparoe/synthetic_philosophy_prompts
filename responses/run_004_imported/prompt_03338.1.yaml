      *   *Scholarly Consensus:* This is a known topic in Berkeley scholarship. It's not just random trivia. Scholars like H.T. Dickinson, S.H. Mellone, and more recently, economists/philosophers interested in the history of economic thought (e.g., Rowlinson, Berman) have discussed this.
      *   *The Link:* Is it a direct deduction (Metaphysics $\to$ Economics)? Or is it a structural analogy/shared mindset? Most scholars argue for a *structural* or *methodological* parallel rather than a strict logical deduction. Both involve rejecting "occult qualities" or "hidden substances" in favor of functional relations.

