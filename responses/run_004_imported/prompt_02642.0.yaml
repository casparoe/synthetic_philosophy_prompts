answer: |-
  This is an excellent passage to analyze for a history-of-science paper. It captures a pivotal moment in the Victorian "boundary work" of science—where the definition of what counts as legitimate inquiry was being contested. Sidgwick is trying to carve out a space for psychical research within the scientific establishment, and his rhetoric is doing a lot of heavy lifting.

  Here is a breakdown of the grammar, the rhetorical consistency, and the evidentiary strategy.

  ### 1. Untangling the Grammar: What is the "Scandal"?

  The sentence structure is convoluted because Sidgwick is stacking multiple clauses to build a specific moral pressure.

  **The Structure:**
  The core sentence is: *"[That X, Y, and Z]... is a scandal."*
  The subject of the sentence is not the phenomena themselves, but a complex situation described in three parts:
  1.  **The Persistence:** The dispute over the reality of these phenomena is "still going on."
  2.  **The Testimony:** "So many competent witnesses" believe in them.
  3.  **The Interest:** "So many others" want the question answered.
  4.  **The Contrast (The Crux):** "*And yet*... the educated world... should still be simply in the attitude of incredulity."

  **The Plain English Claim:**
  Sidgwick is **not** saying it is a scandal that the phenomena might be fake. He is **not** even saying it is a scandal that the dispute exists.
  He is claiming it is a **scandal of scientific negligence.**

  His argument is: *Given the potential importance of these phenomena (if true) and the volume of credible testimony supporting them (even if unproven), it is shameful that the "educated world" (the scientific establishment) has dismissed them without a rigorous, organized investigation.*

  The "scandal" is the **mismatch** between the weight of the claims and the dismissiveness of the scientific community. He is accusing mainstream science of being dogmatic in its skepticism, which, to Sidgwick, is just as unscientific as dogmatic belief.

  ### 2. "Scandal" vs. Neutrality: Is He Contradicting Himself?

  You asked whether calling the situation a "scandal" undermines his claim a few lines later that the Society is "unpledged" and has "no foregone conclusion."

  **The Short Answer:**
  It is consistent with *procedural* neutrality, but it violates *epistemic* neutrality.

  **The Nuance:**
  *   **Procedural Neutrality (Consistent):** Sidgwick is true to his word that the SPR will not start with the conclusion that ghosts/spirits/telepathy are real. They intend to test the claims. Calling the *lack of investigation* a scandal does not require him to believe the *results* will be positive. One can say, "It is a scandal that we haven't tested this drug," without believing the drug works.
  *   **Epistemic Neutrality (Inconsistent):** However, the word "scandal" does reveal a bias in how he frames the *problem*. By framing the *incredulity* of the educated world as the scandalous element (rather than the lack of physical evidence for the phenomena), he is implicitly validating the claims as worthy of serious attention.

  **Why this matters for your paper:**
  Sidgwick is engaging in what sociologist Thomas Gieryn calls **"boundary work."** He is trying to expand the boundary of "Science" to include Psychical Research.
  *   **Mainstream Science's Boundary:** "These claims are anecdotal and impossible; therefore, they are outside science."
  *   **Sidgwick's Boundary:** "These claims are testified to by credible men and are potentially revolutionary; therefore, ignoring them is unscientific."

  So, while he claims neutrality on the *nature* of the phenomena, he is not neutral on the *status* of the inquiry. He is arguing that skepticism without investigation is dogma. The word "scandal" is a rhetorical tool to shame the scientific establishment into letting him in the door.

  ### 3. "Competent Witnesses": Evidence or Appeal to Authority?

  Your intuition here is sharp. In the context of 1882, leaning on "competent witnesses" is indeed an **appeal to authority**, but it was an appeal to a specific kind of authority that was currently losing ground.

  **The Historical Context:**
  In the early-to-mid 19th century, "gentlemanly science" relied heavily on the reputation of the observer. If a Fellow of the Royal Society said he saw something, his character was the guarantee of the fact. However, by the 1880s, science was shifting toward **instrumentation, reproducibility, and quantification.** Testimony was becoming less valuable as physical evidence became the gold standard.

  **Is it doing evidential work?**
  *   **Logically:** No. In modern terms, this is a classic *argumentum ad verecundiam* (appeal to authority). The number of people who believe something, or their social status, does not make a physical claim true.
  *   **Rhetorically (in 1882):** Yes. Sidgwick is using this to overcome the "prior probability" problem. The claims (telepathy, spirits) violate known laws of physics. To get scientists to look at them, he needs to lower the barrier to entry. He is arguing: *"We know this sounds impossible. But when men of science (competent witnesses) say they saw it, we cannot simply call them liars or fools. We must investigate."*

  **For your term paper:**
  You can argue that Sidgwick is using an **older epistemic norm (testimony)** to legitimize a **new organization (the SPR)** in the face of **emerging norms (instrumental verification).**

  He is essentially saying: "The evidence is currently testimonial, but the testimony is too strong to ignore. Therefore, we must form a society to convert this testimony into laboratory data." The appeal to "competent witnesses" is the bridge he builds to get from "superstition" to "research."

  ### Summary for Your Argument
  If you are writing on boundary disputes, Sidgwick's address is a perfect case study of how pseudoscience (or proto-science) attempts to legitimize itself:
  1.  **Reframing Skepticism:** He redefines the "educated world's" skepticism not as rational caution, but as dogmatic neglect (the "scandal").
  2.  **Procedural vs. Substantive:** He claims procedural neutrality ("we will test it") to mask a substantive commitment ("this is too important to ignore").
  3.  **Epistemic Bridging:** He uses the authority of "competent witnesses" to demand scientific attention for claims that lack physical evidence.

  Sidgwick isn't just describing a situation; he is performing a speech act designed to move Psychical Research from the parlor to the laboratory.
