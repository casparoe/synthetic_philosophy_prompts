  2.  **Task 1: Untangling the Grammar (What is the "scandal"?):**
      *   *The Sentence:* "That the dispute as to the reality of these marvellous phenomena... should still be going on, that so many competent witnesses should have declared their belief in them, that so many others should be profoundly interested in having the question determined, and yet that the educated world, as a body, should still be simply in the attitude of incredulity."
      *   *Structure:* It's a complex nominal clause starting with "That..." acting as the subject of "is a scandal."
      *   *Components of the "That" clause:*
          1.  The dispute is still going on.
          2.  Many competent witnesses believe.
          3.  Many others are interested.
          4.  *Yet* the educated world is incredulous.
      *   *Interpretation:* The scandal isn't that the phenomena are real (he says "if only a tenth part... could be shewn to be true"). The scandal isn't necessarily just that the dispute exists. The scandal is the *mismatch* between the weight of testimony/interest and the dismissal by the "educated world." It's a scandal of *methodological neglect*. Science *should* be investigating this because the potential payoff is huge ("impossible to exaggerate the scientific importance"), but instead, it's ignoring it.
      *   *Plain English:* It is shameful that serious science hasn't settled this yet, given how many credible people say it happens and how important it would be if true.

  3.  **Task 2: Neutrality vs. "Scandal" (Rhetorical Consistency):**
      *   *Sidgwick's Claim:* The SPR is "unpledged" and has "no foregone conclusion."
      *   *The Word "Scandal":* Does this imply he believes they are real?
      *   *Analysis:* Not necessarily. A "scandal" in this context is institutional, not ontological. He is criticizing the *scientific community's behavior*, not affirming the *phenomena's existence*. He is saying it is unscientific to ignore data (testimony) without examination.
      *   *Nuance:* However, there is a tension. By framing the *incredulity* as the problem (rather than the lack of physical evidence), he tilts the field. He treats the testimony of "competent witnesses" as data that *deserves* a trial, whereas mainstream science treated it as noise. So, while he claims neutrality on the *result*, he is not neutral on the *methodological starting point*. He believes the question is worthy of science, which was itself a controversial stance.
      *   *Verdict:* It's consistent with procedural neutrality (we haven't decided if ghosts are real) but inconsistent with epistemic neutrality (we have decided that the claims are serious enough to demand attention). It's a "methodological bias" toward investigation.

  4.  **Task 3: "Competent Witnesses" (Evidence vs. Authority):**
      *   *The Phrase:* "so many competent witnesses should have declared their belief."
      *   *History of Science Context:* In the 19th century, "gentlemanly science" relied heavily on personal testimony and reputation. The shift was toward instrumentation and reproducibility.
      *   *Analysis:* Is it an appeal to authority? Yes, technically. It argues: "Smart people believe this, so it shouldn't be ignored."
      *   *Is it doing evidential work?* In the context of 1882, yes. Testimony *was* considered a form of evidence, though weakening. Sidgwick is trying to bridge the gap: "We know testimony isn't proof, but when *enough* credible people give it, it becomes a phenomenon that needs explaining."
      *   *Boundary Work:* This is classic boundary work. He is trying to expand the boundary of "science" to include these testimonies, while mainstream science was drawing the boundary to exclude them as "anecdote."
      *   *Verdict:* It is an appeal to authority, but one grounded in the epistemic norms of the time. It serves to legitimize the *inquiry*, not prove the *conclusion*.

