answer: |-
  You are absolutely not crazy for feeling like this is contradictory. In fact, you've hit on one of the most debated and criticized parts of Mill's political philosophy. Modern readers (and even some of his contemporaries) look at that passage and say, "Wait, you just said money shouldn't matter, and now you're giving extra votes to bankers and employers?"

  Here is the breakdown of the distinction Mill is trying to make, and where he fits on the democracy/epistocracy spectrum.

  ### 1. Is he contradicting himself? (Property vs. Function)

  Mill isn't trying to be hypocritical; he is trying to make a very specific philosophical distinction between **status** and **competence**.

  *   **The Problem with Property:** When Mill says basing votes on property is "odious," he means it creates class warfare. If the rule is "Rich people get more votes," the poor will rightly feel the system is rigged against them. Also, wealth is often accidental (inheritance, luck) and doesn't prove you are smart. A trust fund baby has money but might be an idiot. Mill doesn't want idiots running the government, even rich ones.
  *   **The Logic of Occupation:** Mill believes that certain jobs *force* you to use your brain in complex ways. An employer has to manage people, forecast risks, and calculate budgets. A skilled laborer has to understand complex machinery. A banker manages complicated interests.
  *   **The Distinction:** Mill is arguing that **money is a byproduct, but mental exercise is the cause.** He wants to reward the *mental labor*, not the bank account.
      *   *His logic:* It's not that bankers are rich, so they get votes. It's that being a banker requires high-level reasoning, so they get votes. (The fact that high-level reasoning usually leads to becoming rich is, to him, secondary).

  **So, is it actually different?**
  To your point: **In practice, not really.** In 1861 (and today), "employers" and "bankers" were almost exclusively wealthy, and "laborers" were poor. Mill is trying to dress up a class-based system in the language of a meritocracy. He wants a "Natural Aristocracy" of intellect, not an "Artificial Aristocracy" of cash.

  He thinks if you frame it as "We are rewarding intelligence/skill," the working class might accept it. If you frame it as "We are rewarding wealth," they will revolt. He is trying to make inequality palatable by linking it to merit rather than luck.

  ### 2. Does this count as Epistocracy?

  Yes, but it's a specific *kind*.

  *   **Pure Democracy:** 1 Person = 1 Vote. (Equality of outcome).
  *   **Pure Epistocracy:** Only the knowledgeable get to vote. (Exclusion of the ignorant).
  *   **Mill's System (Plural Voting):** Everyone votes, but some votes weigh more.

  Political scientists usually classify Mill's proposal as a **weighted epistocracy** or **plural voting**. It sits in the middle.
  *   It is **democratic** because it maintains *universal suffrage* (everyone gets at least one vote, including the poor and uneducated). Mill was actually very progressive for his time in insisting that *everyone* must have a voice to protect their interests.
  *   It is **epistocratic** because it violates *political equality*. It explicitly states that some citizens' judgments are more valuable than others based on presumed competence.

  **Why does he do this?**
  Mill is terrified of the **"Tyranny of the Majority."** He believes that in a pure 1-person-1-vote system, the uneducated majority will outvote the educated minority and pass laws that hurt long-term progress (like taxing the rich to give immediate cash to the poor, rather than investing in education).

  He sees plural voting as a "safety valve." The educated minority gets extra votes to ensure they can block stupid laws, but not enough votes to ignore the poor completely.

  ### 3. How to use this in your class discussion

  If you want to sound like you really get the text, here are three points you can raise:

  1.  **The "Proxy" Problem:** Mill admits we don't have a "trustworthy system of general examination" to test intelligence directly. So, he uses **occupation as a proxy for intelligence.** You can argue that this is a flawed proxy. Does being a foreman actually make you better at understanding *national* policy than a teacher or a nurse? Mill assumes "business intelligence" = "political intelligence," which is a huge leap.
  2.  **The Stability Argument:** Mill explicitly says tying votes to money is "impracticable" because people will hate it. He thinks tying votes to *jobs* is more stable. You can ask the class: Is he right? Would people today accept a system where CEOs get 3 votes and warehouse workers get 1, provided it was framed as "leadership roles" rather than "wealth"?
  3.  **The Definition of Epistocracy:** Your teacher might define epistocracy strictly as "rule by the knowledgeable." Mill's system is technically **Representative Government with Epistocratic Constraints.** He wants democracy, but he wants to rig the scales slightly toward the "wise." It shows that the line between democracy and epistocracy isn't a binary switch; it's a slider.

  ### Summary
  Mill isn't contradicting himself on purpose; he is trying to shift the justification for inequality from **wealth** (which he hates) to **merit/function** (which he values). However, you are right to be skeptical: in the real world, those categories overlap so much that it effectively becomes a property qualification anyway.

  And yes, it counts as a form of epistocracy (specifically **plural voting**), because it weights political power based on presumed competence rather than treating all citizens as political equals.
