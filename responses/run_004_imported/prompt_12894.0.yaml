  *   **On Nagel:** Perfectly standard reconstruction. You have the logical structure of the derivation account down cold.
  *   **On Fodor:** Be careful with the ontology here. Fodor argues special-science *kinds* are not physical kinds, but he maintains *token physicalism* (every individual instance is physical). Saying they are "not... physical properties" risks attributing dualism to him.
