          *   *Assessment:* This is standard textbook Nagel. Accurate enough for an undergrad/grad seminar context.
      *   **Part 2: Fodor.** "Fodor's multiple-realizability argument targets exactly this bridge-law requirement... no single physical predicate is coextensive with the special-science predicate, so no genuine bridge law... Fodor concludes that they are autonomous, higher-level properties that are not, after all, physical properties."
