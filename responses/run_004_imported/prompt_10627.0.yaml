answer: |-
  This is a fantastic project. The tension between the public mathematician and the private heretic is rich ground for fiction, and your instinct to avoid the "Newton hated the Trinity" elevator pitch is correct. That fact is the premise, not the story. The story is in the *texture* of that secrecy.

  Here are 10 interview questions designed to respect the historian's expertise while drilling down into the specific ambiguities you need for your novel. Each includes a "pivot" follow-up to prevent the conversation from settling into standard biography territory.

  ### 1. The Taxonomy of Heresy
  **Question:** In popular biographies, Newton is almost universally labeled an "Arian." But reading the Keynes papers, the specificity of his Christology seems to shift over time. Is "Arian" actually a useful category for Newton, or is it a lazy shorthand that obscures the fact that his views might have been closer to Socinianism or even a unique form of Mosaic monotheism?

  **Follow-up:** If she suggests the label is "complicated" or "fluid": "In the context of the 1670s, if he were caught, would the authorities have charged him with Arianism specifically, or was his rejection of the *homoousios* distinct enough to be considered something more dangerous? I'm trying to gauge the specific vocabulary of the fear he would have felt."

  ### 2. The Mechanics of the Dispensation
  **Question:** We know Newton held his Trinity fellowship for over thirty years without taking holy orders, which normally required subscription to the Thirty-Nine Articles. We often hear he received a dispensation from Charles II, but how did that function day-to-day? Was there a specific administrative loophole, or did it rely on the winking complicity of the Master of the College?

  **Follow-up:** If she frames it as a standard bureaucratic exemption: "But given the religious intensity of the Restoration period, did he still have to perform orthodoxy in chapel? I'm curious about the physical performance of belief—was he ever required to kneel at the altar or read the Athanasian Creed aloud, and if so, how did he reconcile that with his private notes?"

  ### 3. The "Two Corruptions" and Textual Method
  **Question:** I want to ask about the *Two Corruptions of Scripture* manuscript. When Newton attacks the *Comma Johanneum* (1 John 5:7), is he operating as a modern textual critic would, looking at Greek manuscript families, or is his philology driven entirely by a theological necessity to remove Trinitarian proof-texts?

  **Follow-up:** If she emphasizes his rigorous scholarship: "Does his conclusion ever outpace his evidence in these drafts? I'm looking for the moment where the historian becomes the heretic—does he ever accuse the Church Fathers of *malicious* forgery rather than just scribal error, and does that conspiracy mindset bleed into how he views his scientific contemporaries?"

  ### 4. The General Scholium's "Dominion"
  **Question:** In the General Scholium to the *Principia*, Newton writes extensively about God's "dominion." Some scholars argue this language is deliberately unitarian—emphasizing a God of power over a God of essence. Do you read those passages as coded anti-Trinitarian theology, or is that reading too much into what was meant to be a natural philosophical conclusion?

  **Follow-up:** If she suggests it's ambiguous or safe: "But if it were safe, why did he wait until the second edition to expand it? If the 'dominion' language isn't doing anti-Trinitarian work, what is the theological payload of the Scholium? I'm trying to understand if the physics is meant to support the heresy or hide it."

  ### 5. Chronology of Radicalization (The 1670s Context)
  **Question:** My novel is set primarily in the 1670s and 80s. A lot of Newton's theological writing is undated or from later decades. By the time he is working on the *Principia* in the 1680s, is his heterodoxy fully formed, or is he still in the process of deconstructing his own faith during the years he is discovering calculus and gravity?

  **Follow-up:** If she says his views were stable early on: "Do we have any evidence from that specific decade of him testing these ideas on colleagues? I'm trying to understand if he was already isolated by the 1680s, or if he was still actively debating this with people like Barrow or Halley."

  ### 6. The Idolatry Argument
  **Question:** For Newton, the Trinity isn't just an error; it's idolatry. He frames the worship of Christ as God as a violation of the First Commandment. How central is this moral outrage to his worldview? Is it a peripheral theological quirk, or is it the emotional engine that drives his need for truth in *all* fields?

  **Follow-up:** If she downplays the emotional weight: "In his private manuscripts, does he use violent language about the corruption of the Church? I'm asking because I need to know if his silence was born of cowardice or of a strategic belief that the world wasn't ready for the truth."

  ### 7. The Circle of Trust
  **Question:** We know he corresponded with Locke and Fatio de Duillier about these matters later on. But in the Cambridge of the 1670s, who was in his confidence? Was there a specific circle of 'heterodox friends,' or was he entirely alone in the college, surrounded by men he considered idolaters?

  **Follow-up:** If she suggests he was mostly solitary: "How would he have identified a safe confidant? Was there a specific shibboleth or a way of signaling these beliefs without stating them outright? I'm interested in the mechanics of secrecy in a collegiate environment."

  ### 8. Prophecy and History
  **Question:** The Yahuda papers reveal Newton wrote more on prophecy and church history than on physics. He believed he could decode the timeline of the Apocalypse. How does his historical millenarianism connect to his physics? Is he trying to restore a 'pristine' knowledge of the world that existed before the Corruptions?

  **Follow-up:** If she separates the science from the prophecy: "But doesn't his belief in a unified truth suggest that uncovering the laws of motion and uncovering the true history of the Church are the same project? If he believes the ancients knew the physics, does he believe they also knew the true theology?"

  ### 9. The Decision Not to Publish
  **Question:** Newton wrote millions of words on theology but published almost nothing. Was this purely fear of losing his position, or did he have a theological objection to making these mysteries public? Did he believe some truths were only for the elect?

  **Follow-up:** If she cites career preservation as the main reason: "But he was willing to fight vicious battles over optics and calculus. Why was the theology different? Was there a specific moment where he considered publishing and pulled back, or was the silence a consistent policy from the start?"

  ### 10. The Novelist's Dilemma
  **Question:** Finally, from a historian's perspective: When fiction writers portray Newton, they often make him either a cold rationalist or a mad mystic. What is the one internal contradiction in his character that you think is most often missed? Where is the human tension in the manuscripts?

  **Follow-up:** If she suggests he was simply "complex": "Can you point to a specific passage where his voice breaks through the scholarly Latin? I'm looking for the moment where the anger or the fear leaks out of the footnotes, because that's the gap my character is trying to navigate."
