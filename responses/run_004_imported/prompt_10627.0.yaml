      *   *Drafting Q4 (General Scholium):* Physics/Theology link.
      *   *Drafting Q5 (Chronology):* The novel is set in the 70s/80s. Was he already this radical then?
      *   *Drafting Q6 (Idolatry):* What's the stakes? Why is Trinity worship idolatry to him?
      *   *Drafting Q7 (The Circle):* Who knew? Did he talk to colleagues?
      *   *Drafting Q8 (Prophecy):* The Yahuda papers. Apocalypse.
      *   *Drafting Q9 (Publication):* Why not publish? Fear or strategy?
      *   *Drafting Q10 (Legacy):* How should a novelist portray this inner conflict?

  4.  **Refining the Follow-ups:**
      *   *Constraint:* The user wants follow-ups that catch the historian if they try to "flatten" the story (i.e., give the standard biography answer).
      *   *Strategy:* The follow-up needs to say, "Okay, but in the manuscripts..." or "But in the context of the 1670s..."
      *   *Example:* If she says "He was just cautious," the follow-up should be "But his private notes are violent in their language against Athanasius."

  5.  **Review against Constraints:**
      *   8-10 questions? Yes.
