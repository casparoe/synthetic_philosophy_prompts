      *   **Required Topics:**
          1.  The label "Arian" (is it accurate?).
          2.  How he kept his fellowship without subscribing to the 39 Articles.
          3.  The "Two Corruptions" manuscript & 1 John 5:7 textual argument.
          4.  Theology vs. Physics (General Scholium "dominion" language).
      *   **Format:** Question + Follow-up (keyed to likely historian answers to prevent flattening).
      *   **Tone:** Intellectual, specific, respectful of the scholarship, acknowledging the tension between public persona and private belief (which is the core of the novel).

  2.  **Deconstruct the Required Topics & Brainstorm Angles:**

      *   *Topic 1: "Arian" Label.*
          *   *Issue:* Arianism implies the Son is a created being, distinct from the Father, but often still divine in a lesser sense. Newton's views were often more radical (Socinian influences, strict monotheism, Christ as a mediator/prophet but not God).
          *   *Question:* Challenge the taxonomy.
          *   *Follow-up:* If she says "It's complicated," push on *which* heresy fits better.

      *   *Topic 2: The Fellowship/Subscription Loophole.*
          *   *Issue:* Trinity fellows had to take holy orders eventually. Newton got a dispensation from Charles II. Why him? How did he navigate the daily chapel life?
          *   *Question:* Focus on the mechanism of the dispensation and the daily performance of orthodoxy.
          *   *Follow-up:* Ask about the risk. Was he ever close to being caught?

      *   *Topic 3: "Two Corruptions" & 1 John 5:7.*
          *   *Issue:* The *Comma Johanneum*. Newton argued it was a later insertion. This undermines the Trinitarian proof-text.
          *   *Question:* Ask about his *method*. Was he doing modern textual criticism or theological special pleading?
          *   *Follow-up:* Did he think this corruption was accidental or malicious? (Conspiracy vs. error).

      *   *Topic 4: Theology vs. Physics (General Scholium).*
          *   *Issue:* "Pantokrator" language. Does "dominion" imply a unitary God vs. a Triune God?
          *   *Question:* Is the *Principia*'s God the God of the heresy manuscripts?
          *   *Follow-up:* If she says "No," ask why he bothered putting theology in a math book at all.

      *   *Additional Topics needed to reach 8-10:*
          *   *Chronology:* When did these beliefs solidify? (1670s is the novel's setting).
          *   *The Circle:* Who did he trust? (Locke? Fatio? Pepys?).
          *   *Motivation:* Why did he care? (Idolatry argument).
          *   *The Apocalypse:* Newton wrote more on prophecy than physics. How does that fit?
          *   *The "Silence":* Why write so much if never publishing?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Drafting Q1 (Arianism):* Start with the label. Newton is often called Arian. Is that lazy?
      *   *Drafting Q2 (Fellowship):* How did he stay at Trinity? The dispensation.
