          *   *Supervaluationism:* Many candidate boundaries. No single true boundary. Ignorance is semantic/metaphysical indeterminacy. Logic is non-classical (existential generalization holds, instantiation fails).
      *   **The "Extra Steps":** Explain that Supervaluationism accepts "There is a cutoff" but rejects "Here is the cutoff." Epistemicism accepts both (in principle).
      *   **Why Philosophers Care:** It's about the nature of truth and reality. Epistemicism says the world/meaning is sharp. Supervaluationism says meaning is incomplete.
