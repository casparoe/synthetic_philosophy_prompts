      *   **Supervaluationism:** The cutoff exists *semantically relative to a precisification*, but there is no fact of the matter about *which* precisification is the "right" one. The proposition "Grain 543 is the cutoff" lacks a truth value (it's indeterminate).
      *   **The Crucial Difference:** It's about the status of the *specific* cutoff claim.
