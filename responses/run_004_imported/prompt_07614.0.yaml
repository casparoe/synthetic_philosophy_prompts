answer: |-
  Your friend is right, and your confusion is completely warranted. In fact, your reaction ("Isn't this just epistemicism with extra steps?") is one of the most common and potent objections raised against supervaluationism, most notably by Timothy Williamson (the leading epistemicist) himself.

  You have stumbled onto one of the technical "bullet bites" that supervaluationists have to swallow to make their semantics work. Here is the breakdown of why your friend is correct, why the two views are technically distinct, and why many philosophers suspect you're right to feel they are suspiciously similar.

  ### 1. The Mechanism: Why Supervaluationism Entails a Cutoff

  To see why your friend is right, we have to look at how supervaluationism defines truth.

  *   **Precisifications:** Supervaluationism suggests that a vague term like "heap" doesn't have one extension (set of things it applies to), but rather a set of *admissible precisifications*. Each precisification is a sharp, classical version of the term. (e.g., Precisification A says 100 grains is a heap, 99 is not; Precisification B says 105 is a heap, 104 is not).
  *   **Supertruth:** A statement is **supertrue** if it is true on *all* admissible precisifications. It is **superfalse** if false on *all*. If it varies, it is **indeterminate**.

  Now, look at the Sorites series. On *any* given classical precisification, classical logic applies. In classical logic, you cannot go from "is a heap" to "is not a heap" without a transition point. Therefore, on **every single precisification**, there exists a specific grain $n$ where $H(n)$ is true and $H(n+1)$ is false.

  Since the statement $\exists n (H(n) \land \neg H(n+1))$ ("There is a cutoff") is true on every precisification, it is **supertrue**.

  So, yes: **Standard supervaluationism commits to the truth of "There is a sharp cutoff."**

  ### 2. So, How Is This Not Epistemicism?

  This is where the "extra steps" come in. While both views agree that the sentence "There exists a cutoff" is true, they disagree violently on the status of the *specific* cutoff claims.

  **The Epistemicist View:**
  *   **Metaphysics:** There is one true extension of "heap."
  *   **Specific Claim:** For any specific number $k$ (say, 543), the statement "543 is the cutoff" is either True or False.
  *   **Ignorance:** We just don't know which one is True. But reality has decided.
  *   **Logic:** Classical logic holds everywhere. If $\exists x \phi(x)$ is true, there is some specific $c$ such that $\phi(c)$ is true. (Existential Instantiation holds).

  **The Supervaluationist View:**
  *   **Metaphysics:** There is no single true extension; there is a cloud of equally valid candidates.
  *   **Specific Claim:** For a specific number $k$ in the penumbra (the fuzzy zone), the statement "543 is the cutoff" is **indeterminate**. It is true on some precisifications and false on others. It has no truth value.
  *   **Ignorance:** It's not that we don't know the fact; it's that there *is no fact* about which precisification is the "real" one.
  *   **Logic:** **Existential Instantiation fails.** You can have $\exists x \phi(x)$ be supertrue, while for every specific constant $c$, $\phi(c)$ is indeterminate.

  This is the technical distinction. The epistemicist says: "There is a cutoff, and grain $n$ is it (we just don't know $n$)." The supervaluationist says: "There is a cutoff, but no specific grain $n$ is the cutoff."

  To a classical logician, that second sentence sounds insane. To a supervaluationist, it's the necessary cost of preserving the intuition that "bald" is genuinely fuzzy while keeping classical logic for the non-fuzzy parts.

  ### 3. Why Philosophers Treat Them as Opposed

  They are treated as opposed because they offer different diagnoses of *why* the Sorites paradox feels compelling.

  *   **Epistemicism** diagnoses the error as **Ignorance**. The inductive premise ("If $n$ is a heap, $n+1$ is a heap") is simply false. There is a specific $n$ where it fails. We are misled because the boundary is unknowable.
  *   **Supervaluationism** diagnoses the error as **Contextual Shift/Indeterminacy**. The inductive premise is indeterminate (true on some precisifications, false on others). We are misled because we conflate "supertrue" with "true."

  The "Fallacy of Gray" connection you mentioned is interesting here. Yudkowsky argues against the idea that because categories are fuzzy, we can't make binary distinctions or truth claims.
  *   **Epistemicism** aligns well with Yudkowsky here: Binary truth exists, don't let fuzziness stop you from reasoning.
  *   **Supervaluationism** also aligns: Supertruth is binary. But it adds a third category (indeterminate) which Yudkowsky might view as suspicious if taken as a metaphysical feature rather than an epistemic one.

  ### 4. The "Notational Variant" Charge

  You asked if they are just notational variants. Timothy Williamson argues **yes**.

  His argument is that supervaluationism posits a sharp boundary between the **true** (supertrue) and the **indeterminate**.
  *   If you have 100 grains, it's supertrue it's a heap.
  *   If you have 10 grains, it's superfalse it's a heap.
  *   Somewhere in between, there must be a last grain $k$ where "k is a heap" is supertrue, and $k+1$ where it is *not* supertrue.

  Williamson argues that this boundary between "supertrue" and "not supertrue" is just as sharp and unknowable as the boundary the epistemicist posits between "true" and "false." Therefore, the supervaluationist hasn't actually escaped the "bizarre metaphysical commitment" of sharp boundaries; they've just moved it up a level to the boundary of the precisifications.

  ### Summary

  1.  **Is your friend right?** Yes. Supervaluationism entails "There exists a sharp cutoff" is true.
  2.  **Is it Epistemicism?** Technically no, because it denies that any *specific* cutoff claim is true. It breaks the link between "something exists" and "we can point to it."
  3.  **Why the distinction matters:** Epistemicism claims the fuzziness is in our **knowledge**. Supervaluationism claims the fuzziness is in the **world/meaning** (semantic indeterminacy).
  4.  **The Cost:** Supervaluationism avoids saying "Grain 543 is definitely the cutoff," but it pays for this by accepting a logic where "Something is F" is true, but nothing specific is F. Many find this logic just as counterintuitive as Williamson's unknowable cutoff.

  You haven't missed anything; you've just identified the exact pressure point where the two theories grind against each other. The supervaluationist tries to have their cake (no specific sharp line) and eat it too (classical logic holds, so "there is a line" is true). Whether that's a brilliant synthesis or a contradiction in disguise is still the main debate in the field.
