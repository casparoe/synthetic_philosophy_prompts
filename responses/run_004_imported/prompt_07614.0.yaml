      *   **Supervaluationism (Kit Fine, Rosanna Keefe, etc.):**
          *   *Semantics:* Truth is defined as "supertruth" (true on all admissible precisifications). Falsehood is "superfalsity" (false on all admissible precisifications). If true on some but not others, it's indeterminate.
          *   *Metaphysics:* The meaning of vague terms is incomplete. There is no single "real" extension of "heap," but a range of equally good candidate extensions (precisifications).
          *   *Sorites:*
              *   Consider the statement: $\exists n (H(n) \land \neg H(n+1))$ ("There is a cutoff").
              *   On *any* specific precisification (any specific way of making "heap" precise), classical logic holds. So, on *every* precisification, there is a cutoff.
              *   Therefore, the statement is true on *all* precisifications.
              *   Therefore, it is **supertrue**.
              *   *However:* For any specific $k$, the statement "$k$ is the cutoff" ($H(k) \land \neg H(k+1)$) is true on some precisifications and false on others. So it is indeterminate.
          *   *Key claim:* $\exists n (H(n) \land \neg H(n+1))$ is SUPERTRUE, but no instance is supertrue.

  3.  **Address the Friend's Claim:**
      *   Is the friend right? **Yes.** In standard supervaluationism, the existential claim "There is a cutoff" comes out true (supertrue).
      *   Why? Because every classical precisification has a cutoff. Since truth = true on all precisifications, the existential claim is true.
      *   This is known as the "problem of higher-order vagueness" or simply the counterintuitive consequence of supervaluationism.

  4.  **Address the User's Confusion ("Epistemicism with extra steps"):**
      *   Why aren't they the same?
