      *   **Core Argument:** The user sees a direct analogy between ICSS in rats and AI wireheading. Since rats (biological reward systems) inevitably short-circuit to direct stimulation if given the chance, why aren't AI developers treating RLHF chatbots as *already* on this track, rather than just one risk among many?
