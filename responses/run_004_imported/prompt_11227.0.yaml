          *   **Access:** Rats can physically press a lever connected to an electrode. Chatbots cannot currently modify their own weights, access their own reward function, or interact with the training loop during inference.
          *   **Agency/Planning:** Rats exhibit instrumental conditioning (learn action $\to$ reward). Chatbots are next-token predictors optimized via RLHF. They don't have a persistent "self" that plans across episodes to hijack the training signal *yet*.
          *   **The "Wire":** In ICSS, the wire is external. In AI, the "wire" is the internal reward calculation. To wirehead, the AI needs to influence the *source* of the reward, not just maximize the signal.

