answer: |-
  First, welcome to the rabbit hole. It is a peculiar pleasure to find someone who has spent 35 years at the bench wrestling with Wei Dai's posts; that is a collision of worlds that doesn't happen often. Your grasp of Counterfactual Mugging (CM) is accurate, and your intuition about the connection to pre-registration is sharp.

  To answer your core question directly: **You have identified a structural isomorphism, but the "updatelessness" is doing specific philosophical work that "binding commitment" alone does not capture.** However, in the context of clinical trials, that work is largely handled by institutional enforcement rather than internal logic.

  Here is a breakdown of where the analogy holds, where it diverges, and how to situate UDT among its cousins (TDT/FDT) given your background.

  ### 1. The Counterfactual Mugging Setup
  Your memory serves you well. The setup is:
  *   **Omega** flips a fair coin.
  *   **Tails:** Omega asks you for \$100.
  *   **Heads:** Omega gives you \$10,000 *if and only if* Omega predicted you would give the \$100 on Tails.
  *   **The Crux:** You are on the Tails branch. You know the coin landed Tails. The \$10,000 on Heads is counterfactually gone. Causal Decision Theory (CDT) says "Keep the \$100." Updateless Decision Theory (UDT) says "Pay the \$100."

  UDT argues that the decision is not about the action *now*, but about selecting the **policy** that governs your actions across all possible branches. Since the policy "Pay on Tails" yields an ex-ante expected value of \$4,950, and "Refuse on Tails" yields \$0, a rational agent selects the policy *before* updating on the coin flip.

  ### 2. Is Pre-Registration Just a Ulysses Pact?
  Your skepticism is warranted. A Ulysses pact (tying oneself to the mast) is a **causal precommitment**. I know my future self will be weak, so I physically restrict my future options. In clinical trials, the journal requirements and the fear of retractions act as the ropes binding the statistician to the mast.

  If we view the trial solely through this lens, UDT adds no value. It's just game theory: *If I p-hack, I get punished by the community.*

  However, there is a deeper layer where "updatelessness" is doing real work, and it lies in the **nature of the reward**.

  In Counterfactual Mugging, the \$10,000 on Heads is not given because you *actually* paid on Tails (you haven't yet); it is given because your *algorithm* is the type that *would* pay. The reward is contingent on your **disposition** in a counterfactual world.

  In clinical trials, consider the "reward" to be **Scientific Validity** (or more technically, the control of the Type I error rate).
  *   **Ex-ante:** You design a trial to have $\alpha = 0.05$.
  *   **Ex-post:** The primary endpoint fails ($p=0.06$), but a subgroup analysis looks amazing ($p=0.01$).
  *   **The Temptation:** Switch to the subgroup.
  *   **The Counterfactual:** The validity of that $p=0.01$ is only real if your decision rule *would have ignored it* had the primary endpoint succeeded.

  If you switch endpoints based on the data, you are "updating" on the data to change your decision rule. This inflates the false positive rate. The "validity" of the trial exists in a counterfactual space: it depends on what you *would have done* had the data been different.

  **So, is it UDT?**
  *   **Institutionally:** No. It's a binding contract enforced by editors.
  *   **Epistemically:** Yes. To maintain the integrity of the inference, the researcher must act *as if* they have not seen the data when applying the decision rule. They must refuse to update their policy based on the specific realization of the data.

  The "updateless" aspect is that the **statistical guarantee** holds only if the decision procedure is independent of the data realization. You are effectively optimizing for the ex-ante expected truth-value of the research program, sacrificing the ex-post opportunity to publish a "significant" finding from *this specific trial*.

  ### 3. UDT vs. TDT vs. FDT (The Decision Theory Zoo)
  Since you mentioned getting lost in the acronyms, here is the 30,000-foot view tailored to a scientist:

  *   **CDT (Causal Decision Theory):** The standard. Choose the action that causally influences the outcome.
      *   *CM Verdict:* Keep the \$100. (My action now can't change the past coin flip).
      *   *Trial Analogy:* The data is what it is. If the subgroup looks significant, publish it. (This leads to p-hacking).
  *   **EDT (Evidential Decision Theory):** Choose the action that gives the best news about the world.
      *   *CM Verdict:* Keep the \$100. (Knowing I kept it doesn't change the fact the coin is Tails).
  *   **TDT (Timeless Decision Theory):** Proposed by Eliezer Yudkowsky. Your decision is an instance of an abstract algorithm. Omega predicts the algorithm, not the specific action.
      *   *CM Verdict:* Pay the \$100. (My decision now is logically linked to Omega's past prediction).
      *   *Trial Analogy:* My decision now is an instance of "How Scientists Behave." If I p-hack, I instantiate a "P-hacking Scientist" algorithm, which degrades the field's trust.
  *   **UDT (Updateless Decision Theory):** Proposed by Wei Dai. Even stronger than TDT. You choose your policy *before* receiving any observations (even if you have them). You don't just treat your decision as an algorithm; you treat your *knowledge state* as part of the optimization problem.
      *   *CM Verdict:* Pay the \$100. (I maximize utility across all possible worlds I could be in, weighted by my prior, ignoring which one I'm actually in).
      *   *Trial Analogy:* I design the analysis plan to maximize the long-term truth-finding of the field (the prior), ignoring the specific data I currently hold (the update).

  **Functional Decision Theory (FDT)** is the modern synthesis (Yudkowsky & Soares, 2017) that mostly subsumes TDT and UDT. If you are writing an essay today, FDT is the current "standard" for this cluster of ideas, though UDT is still the specific term for the "don't update on observations" mechanic.

  ### 4. Where the Analogy Might Need Nuance
  If I were peer-reviewing your essay, here is the one objection I would raise:

  **The Source of the Counterfactual Dependency.**
  In Counterfactual Mugging, the dependency is **logical/metaphysical**. Omega is a perfect predictor. Your decision *now* logically determines the money *then*.
  In Clinical Trials, the dependency is **frequentist/procedural**. The Type I error rate is controlled only if the procedure is fixed.

  A UDT agent pays Omega because it is *rational* to do so, even if no one is watching. A scientist follows pre-registration largely because *editors are watching*.
  *   **Correction:** You can salvage the UDT analogy by focusing on the **Bayesian interpretation of methodology**. If you view the "Scientific Method" as a single agent optimizing for truth over time, pre-registration is the UDT policy. The individual scientist is just the temporary executor of that policy. The "updatelessness" is built into the *method*, not necessarily the *human*.

  ### Summary for Your Essay
  1.  **Your intuition is correct:** Pre-registration is the real-world institutionalization of an updateless policy. It prioritizes ex-ante expected utility (valid inference) over ex-post local optimization (significant p-values).
  2.  **The Distinction:** It is technically a **binding precommitment** enforced by social incentives, whereas UDT is a **logical precommitment** enforced by rationality. However, the *effect* on the outcome (preserving the counterfactual value) is identical.
  3.  **The "Work" Updatelessness Does:** It explains *why* the pre-commitment generates value. It generates value because the "reward" (validity/trust/funding for future trials) depends on your disposition in counterfactual scenarios where the data looked different.

  You haven't mangled the decision theory; you've successfully mapped a high-abstraction philosophical problem onto a concrete scientific protocol. That is exactly how these concepts should be tested. If you write that essay, I suspect you'll find an eager audience among both the rationalist community (who love real-world applications) and the meta-science community (who might appreciate the formal justification for their rules).

  One final tip: If you cite decision theory, referencing **Functional Decision Theory (FDT)** might be safer than UDT, as it is the more current terminology in that circle, but the "Updateless" mechanism is exactly what you are describing in pre-registration.

  Would you like to workshop the specific phrasing of the analogy, or are you confident enough to proceed?
