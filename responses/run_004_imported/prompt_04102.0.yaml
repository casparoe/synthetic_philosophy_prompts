answer: |-
  John Wallis visits Thomas Hobbes in 1660, carrying a stack of refutations twenty-five years in the making.

  **Wallis:** "Thomas, please. It's over. You cannot square the circle. The demonstration is impossible."

  **Hobbes:** "Impossible for *you*, perhaps. You treat geometry like physics—guessing at causes hidden in the nature of things. But I told you in *De Corpore*: Geometry is the only true science precisely because *we* construct the causes ourselves. We draw the line. We generate the circle. We know the truth because we made it."

  **Wallis:** "You made a mistake. You've constructed a fallacy. I've shown you the arithmetic a dozen times."

  **Hobbes:** "Arithmetic is for merchants. I am speaking of *consequences from stated causes*. I stated the cause. I constructed the figure. Therefore, I know the consequence with absolute certainty. If your calculation contradicts my construction, it is not my geometry that is wrong, John. It is your logic that is merely 'prudence'—guessing at an external standard that does not exist."

  **Wallis:** "It's math, Thomas. The ratio holds whether you decree it or not."

  **Hobbes:** *(Slamming his hand on the diagram)* "In the State of Nature, perhaps. But inside this diagram, *I* am the Sovereign. I did not discover this square; I *legislated* it. You are not pointing out an error, Mr. Wallis. You are staging a rebellion."

  **Wallis:** "So you'll never concede?"

  **Hobbes:** "A Sovereign does not apologize to his subjects. Now, if you'll excuse me, I have a new pamphlet to write. I believe I've just discovered that Wallis himself is equal to zero."
