      *   **The Pivot (Why we reject it):** Operational burden on nurses (gatekeepers), legal liability (Title VI), staff morale/dignity (being judged by race), and the slippery slope (validating bias).
      *   **Alternative Support:** How do we help the Black patient with trauma? (Advocacy, pain protocols, not racial sorting).
      *   **Closing:** Call to action.

  4.  **Refining the Tone:**
