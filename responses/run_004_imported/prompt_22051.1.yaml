  **(Self-Correction Note):** I need to make sure Hobbes doesn't just say "I'm right." He needs to argue that *even if* this specific proof is contested, the *nature* of geometric knowledge is still superior to physics. Wallis needs to press that *practice* invalidates *theory*.

