answer: |-
  **London, Autumn 1656**
  **The Lodgings of Thomas Hobbes, near Fleet Street**

  *The room is spare, dominated by a heavy oak table strewn with diagrams. Ink stains mar the edges of fresh pamphlets. THOMAS HOBBES stands by the window, looking out at the gray street. JOHN WALLIS sits at the table, a quill in hand, tapping it rhythmically against a copy of Hobbes's newly printed* Six Lessons. *The air is thick with the smoke of a dying fire.*

  **WALLIS:** You have printed it, then. *Six Lessons*. You lecture us as if we were schoolboys who have forgotten their Euclid, and I the headmaster who has lost his rod.

  **HOBBES:** (Turning from the window) I lecture you as professors who have forgotten what a demonstration *is*. You mistake the manipulation of symbols for the reasoning of causes. You treat geometry as a trade of accountants, not a science of philosophers.

  **WALLIS:** And yet, Mr. Hobbes, when the accountant balances the books and finds a discrepancy, the money is missing. When I balance your quadrature against the axioms of Archimedes, the truth is missing. I do not come here to re-hash the arc and the line. We both know the verdict of the mathematicians. I come to ask you why you persist.

  **HOBBES:** Persist? I persist because I am consistent.

  **WALLIS:** You are consistent in error. That is not a virtue. It is a stubbornness that threatens to drag your entire philosophy into the mud with it. You claim in this pamphlet—again—that geometry is certain because we construct the objects. We draw the circle. We define the point. Nature does not give us these; we generate them. Therefore, we know them perfectly.

  **HOBBES:** Precisely. Because we are the cause of the figure, we know the properties of the figure. In physics, in natural philosophy, we are outside looking in. We guess at the hidden springs of nature. We cannot be certain. But in geometry, and in civil philosophy, we are the creators. I draw the line; I covenant the commonwealth. The certainty is in the making.

  **WALLIS:** But Mr. Hobbes, consider the implication of your own failure. You claim certainty arises from construction. Yet here you stand, having constructed a circle that cannot exist. You have drawn lines that, by your own definitions, contradict one another. If the certainty lies in the *act* of construction, why does your construction yield falsehood?

  **HOBBES:** (Moves to the table, leaning on his cane) A mason may lay a brick crooked. Does that mean the art of masonry is uncertain? Does it mean the laws of architecture are mere opinion? I have stumbled in the calculation, Wallis. I have not stumbled in the principle.

  **WALLIS:** In geometry, the calculation *is* the principle. There is no distinction between the law of the square and the act of squaring. If you claim to square the circle and you have not, you have not merely made a mistake; you have violated the very conditions that make geometry certain. You claim we know the truth because we make the object. But if the object you make is a chimera—a square circle—then you have not made an object at all. You have made words.

  **HOBBES:** (Sharp intake of breath) I have made reasoning.

  **WALLIS:** You have made assertions. Listen to me, Thomas. Your entire system in *De Corpore*, your physics, your politics—it rests on this foundation. You tell us that Civil Philosophy is certain because, like geometry, we construct it. We build the State by covenant, just as we build a theorem by postulate. If you cannot be certain in the geometry, why should we trust you in the Commonwealth? If the geometer cannot measure his own lines, how can the philosopher measure the rights of men?

  **HOBBES:** (Voice low, intense) Because the Sovereign does not need to square the circle to keep the peace. But you miss the point of the certainty. The certainty of geometry is that *if* the definitions are held, the consequences follow. It is a chain of computation. My error was in the computation, not in the chain.

  **WALLIS:** But who checks the computation? You? You have rejected the tools we use to check it. You despise my algebra. You call it a "scabbard of secrets," a net of symbols cast over the truth.

  **HOBBES:** Because it is! You write *x* and *y* and you manipulate them like counters in a game, without knowing what magnitudes they represent. It is blind reckoning. Geometry is light. You *see* the proportion. Algebra is guessing in the dark.

  **WALLIS:** Algebra is the logic of invention! It allows us to test the very chains you claim to prize. Without it, you are alone in a room with your ruler, trusting your own eye against the consensus of every geometer from Alexandria to Oxford. You say we construct the truth. I say you are constructing a private language that no one else can speak. If certainty requires construction, it also requires *demonstration* to another mind. You cannot demonstrate this.

  **HOBBES:** I have demonstrated it!

  **WALLIS:** To yourself.

  **HOBBES:** (Straightens up, pacing) You think this is about pride. You think I cling to this quadrature because I cannot bear to be bested by the Professor of Geometry. It is not pride, John. It is necessity.

  **WALLIS:** Necessity?

  **HOBBES:** If I concede that I am wrong about the circle, I concede that a man can construct a system of thought, based on definitions he himself has made, and *still* be in error. Do you see? If geometry is not certain, then Civil Philosophy is not certain.

  **WALLIS:** And if it is not certain?

  **HOBBES:** Then the Sovereign's law is no more certain than the priest's revelation. It becomes a matter of opinion. If I admit that my reasoning on magnitudes can be fundamentally flawed despite my best construction, then a subject may argue that his reasoning on obedience is equally valid. The certainty of the geometric proof is the analogue for the certainty of the Sovereign's command. Both are artificial constructs. Both must be absolute. To admit a flaw in the geometry is to admit a crack in the Leviathan.

  **WALLIS:** (Silent for a moment, setting down the quill) So you will not yield. Not because you believe the math is right, but because you fear what happens to the politics if the math is wrong.

  **HOBBES:** I believe the math is right. But even if it were not... the *kind* of knowledge remains superior. Physics is conjecture. We did not make the world. But we made the State. We made the Figures. To say we cannot know them truly is to say man is blind to his own creations. I will not accept that man is blind to his own hands.

  **WALLIS:** But you are blind to the error in your hand! That is the tragedy. You argue that because we make the object, we cannot be mistaken about it. But men build houses that fall down. Men write laws that contradict themselves. Men draw circles that do not close. The act of construction does not guarantee the perfection of the result. It only guarantees that the error is ours, not Nature's.

  **HOBBES:** Then the error is mine. I will bear it. But I will not surrender the method. Your algebra, your empirical tinkering—it leaves the world a chaotic place of probabilities. I offer a world of consequences. Cause and Effect. Definition and Conclusion.

  **WALLIS:** A world of consequences built on a false premise is a tyranny, Thomas. Not a science. You want certainty so badly you are willing to break logic to keep it. You say we make the objects of geometry. I say the objects of geometry obey rules we did not make. You cannot covenant with a ratio. You cannot command a proportion to be equal when it is not.

  **HOBBES:** (Returning to the window) We shall see. The *Six Lessons* are printed. The arguments are laid out. Let the learned judge.

  **WALLIS:** They have judged. And they will judge again next year, and the next. You know this will follow you to your grave.

  **HOBBES:** (Without turning) Better to die defending the possibility of certainty than to live comfortably in a world of guesses. You may have the circle, Mr. Wallis. You may have your algebra and your Royal Society and your little measurements. But do not ask me to surrender the claim that man can know what he makes.

  **WALLIS:** (Standing, gathering his papers) I do not ask you to surrender the claim. I ask you to acknowledge that *making* is not *knowing*. You can build a commonwealth, Thomas. But if you build it on a false square, it will fall. And when it falls, do not blame the wind. Blame the tool.

  **HOBBES:** The tool is reason.

  **WALLIS:** Then sharpen it. Or it will cut you.

  *Wallis bows, stiffly. Hobbes does not turn from the window. Wallis exits, closing the door softly. Hobbes remains, looking out at the street, his reflection ghostly in the glass, superimposed over the gray London afternoon.*

  **HOBBES:** (To the empty room) It is not the tool that is dull. It is the eye that refuses to see the dark.

  *He turns back to the table, dips a fresh quill in ink, and pulls a new sheet of paper toward him. He draws a circle.*

  **[END]**
