answer: |-
  **Setting:** *A university faculty lounge, late afternoon. The coffee is stale, but the air is thick with unresolved tension. **Ron** (Resource Egalitarian, channeling Dworkin) is leaning back in his chair, arms crossed. **Elena** (Capability Theorist, channeling Sen and Cohen) is perched on the edge of the table, pen in hand.*

  **Ron:** Look, I think we're letting the perfect be the enemy of the good. You keep saying resources aren't enough because people differ in their ability to convert them. I agree they differ. That's exactly why we need the hypothetical insurance market. It's not about giving everyone the same wheelchair; it's about compensating for the brute bad luck of needing one, without subsidizing the bad luck of choosing to drink only 1982 Bordeaux.

  **Elena:** But that distinction is the fault line, Ron. Let's start with the disability case, since that's where your view usually wins people over. You say we compensate the disabled person via the insurance scheme. But to calculate the premium—to decide how much coverage a "prudent" person would buy behind the veil of ignorance—you have to know what they are insuring *for*.

  **Ron:** They're insuring against a loss of welfare, obviously. Or rather, a loss of the capacity to achieve a normal range of life plans.

  **Elena:** There it is. "Normal range of life plans." That's not a resource metric. That's a capability metric. You're smuggling in a notion of functioning to calculate the resource transfer. If I'm born with a severe mobility impairment, the insurance payout isn't determined by the market price of wheelchairs alone. It's determined by what we think a person *needs to be able to do* to participate in society. If the society is all stairs, the payout is high. If it's all ramps, the payout is low. The resource value is derivative of the capability deficit.

  **Ron:** That's a category error. The insurance market is a device to measure *opportunity cost*. If you are disabled, you have fewer opportunities to convert resources into welfare. The insurance payout is meant to restore your share of social resources to what it would have been had you not suffered that brute luck. We don't need a list of capabilities to run the simulation. We just ask: "What income transfer would the average person purchase to protect themselves against the risk of being in your position?"

  **Elena:** But how do they know what to purchase without knowing what constitutes a decent life? Imagine the deliberation behind the veil. I don't know if I'll be blind. I ask myself, "How much insurance should I buy?" To answer that, I have to think, "What activities are so central to human life that losing my sight would devastate them?" Reading? Navigating public space? Recognizing faces? If I don't have a prior theory of valuable functionings, I can't price the risk. So, the "resource" compensation is actually just a shadow price of a capability deficit. G.A. Cohen called this "midfare"—it's a state between resources and welfare. You're pretending it's resources, but it's loaded with normative judgments about human functioning.

  **Ron:** Okay, grant that there's a normative judgment involved. Every theory of justice has one. The advantage of my view is that it respects the *ambition-sensitivity* constraint. This is where your view collapses. Let's move to the second case. The person with the expensive taste. Let's call him Louis. Louis refuses to be happy unless he has vintage champagne. I have a modest taste for beer. We start with equal resources. Louis spends his share on champagne and is miserable; I spend mine on beer and am content. Do you compensate Louis?

  **Elena:** Not necessarily. But your reason for refusing is what I question. You say no because his tastes are "cultivated." He chose them. Therefore, he is responsible for the shortfall in his welfare.

  **Ron:** Exactly. Justice is about leveling the playing field, not guaranteeing the score. If we subsidize Louis, we are effectively taxing my frugality to subsidize his extravagance. That violates the distinction between *circumstance* (which is unchosen) and *choice* (which is authored by the agent). Disability is circumstance. Champagne is choice.

  **Elena:** But is the line that clean? What if Louis's "taste" is actually a deep-seated psychological need for aesthetic refinement, cultivated not out of snobbery but because it's the only way he can access a sense of meaning? And conversely, what if the disabled person *doesn't* value the capability you're compensating them for? Suppose a person born with a mobility impairment has adapted their preferences and is perfectly happy staying at home, writing poetry. They don't *want* the ramp. Your insurance scheme gives them the resources for the ramp anyway, based on what the "average prudent insurer" would have bought. You're forcing resources on them that they don't value, while refusing resources to Louis who *does* value his champagne. You're prioritizing the "objective" resource bundle over the actual freedom to pursue what they value.

  **Ron:** I'm not forcing the ramp. I'm giving them the *purchasing power* equivalent to the insurance payout. If they choose not to buy the ramp, that's their prerogative. But notice what you're doing. If you compensate Louis, you make the distribution *endowment-insensitive*. You're saying society is responsible for our preferences. That's paternalistic in a different way. It treats citizens like passive vessels of welfare rather than active agents. My system says: "Here are your resources. You are the sovereign over your own life. If you ruin it with expensive tastes, that's on you. If you ruin it with bad gambles, that's on you." That respects agency.

  **Elena:** It respects a very thin, legalistic version of agency. It ignores *conversion factors*. Let's say we both get $50,000. You are able-bodied. I have a chronic illness that requires $20,000 in medication just to function at your baseline. I have $30,000 left for living; you have $50,000. We have equal resources, but I do not have equal *freedom*. Your "sovereignty" is an illusion if I lack the capability to convert the money into actual functioning. And here's the kicker on indeterminacy: You claim your insurance market solves this. But how do we determine the premium? Is it the average? The median? What if the risk is rare but catastrophic? The calculation is wildly indeterminate. You're hiding the indeterminacy behind a veil of economic modeling.

  **Ron:** It's indeterminate in practice, sure. But as a *metric of justice*, it's clearer than yours. Because your metric—the "Capability List"—is politically explosive. Who decides which capabilities count? Is "religious freedom" a capability? Is "sexual expression"? Is "access to the internet"? If the state decides the list to determine who gets what, you've opened the door to massive paternalism. At least with resources, money is neutral. It doesn't tell you how to live.

  **Elena:** Money isn't neutral! That's the myth. Allocating resources *is* allocating power. And regarding the list: It's not handed down from on high. It's formed through public reasoning. But let's go back to your indeterminacy charge. You say my list is vague. I say your insurance premium is *equally* vague, but you pretend it's objective. To set the premium for disability, you have to decide: Are we insuring against the loss of *income*, or the loss of *functioning*? If it's income, it's too low (because disabled people face higher costs). If it's functioning, we're back to my view.
  Furthermore, consider the asymmetry again. You compensate the disabled person for a "need" but not Louis for his "taste." But both are requirements for their well-being. Why is the need for mobility "objective" and the need for aesthetic refinement "subjective"? Often, the disabled person's need is only a need because society is structured a certain way. If society valued poetry-writing over walking, the mobility impairment wouldn't be a deficit. You're reifying social norms as natural facts to justify the asymmetry.

  **Ron:** Because mobility is a *general-purpose means*. Almost every life plan requires moving through the world. Very few life plans require vintage champagne. We compensate for the lack of all-purpose means because we don't know what anyone's specific conception of the good is. That's liberal neutrality. If we start compensating for specific capabilities, we have to judge which conceptions of the good are valid. I'm trying to avoid the state becoming an arbiter of the good life.

  **Elena:** But you *are* arbitrating! By deciding that "mobility" counts as a brute luck deficit but "aesthetic sensitivity" counts as a voluntary taste, you are making a judgment about what counts as a normal human functioning. You're just doing it covertly. Cohen's point was devastating here: You can't run the insurance device without a currency of advantage. If the currency is welfare, you collapse into welfarism (and have to pay for Louis's champagne). If the currency is resources, you ignore conversion factors. The only stable currency is "access to advantage" or capability. You're trying to stand on a middle ground that doesn't exist.

  **Ron:** I think the middle ground is exactly where we need to be. Look, I admit the insurance device is a heuristic. But it captures a moral intuition you're glossing over: *Responsibility*. If Louis *could* have trained himself to enjoy beer but chose not to, he owns that cost. If I am born blind, I did not choose that. Your view risks blurring that line. If we focus on capabilities, we might end up saying Louis lacks the "capability to be happy" and deserves compensation. That creates a society of victims, where every unhappiness is a claim on the public purse.

  **Elena:** And your view creates a society of formal equals who are substantively unfree. You hand the paraplegic $50,000 and say, "You're equal to the able-bodied person now." It's a cruel fiction. I'd rather struggle with the democratic process of defining a capability list—arguing about what matters, revising it, debating it—than hide behind a hypothetical market that pretends to be neutral while relying on hidden normative assumptions. At least my indeterminacy is honest. It admits that justice is a debate about the good, not just a calculation of assets.

  **Ron:** But that debate never ends, Elena. Policy needs to be implemented. We need a cutoff. The insurance market gives us a cutoff: What would the average person pay? It's a focal point. Your capability approach gives us... a conversation.

  **Elena:** Justice *is* a conversation, Ron. Especially when it comes to human diversity. If you freeze the metric at resources, you freeze the inequalities that arise from human difference. You're prioritizing the clarity of the metric over the reality of the people it's supposed to serve.

  **Ron:** And you're prioritizing the reality of the people over the liberty of the individual to be responsible for their own choices. I'd rather be accused of false precision than true paternalism.

  **Elena:** *(Sighs, putting the pen down)* So we're back to the stalemate. Liberty vs. Freedom. Procedure vs. Substance.

  **Ron:** *(Uncrossing his arms, picking up his coffee)* Maybe. Or maybe we just agree that Priya was right to be frustrated. It's a hell of a hard problem.

  **Elena:** *(Smiles faintly)* She's going to ask us to do it again next week, you know.

  **Ron:** I know. Bring the wine. But I'm not paying for the vintage stuff.

  **Elena:** Deal. But only because I have the capability to drink it, not because I have the resources.

  **Ron:** Don't push it.
