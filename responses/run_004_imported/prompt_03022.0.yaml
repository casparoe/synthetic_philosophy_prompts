      *   **Point 4: The "Strong Expectation" Requirement.** Decision theory generally demands that the good stuff and bad stuff balance out robustly (absolute convergence). If the "good" possibilities sum to $+\infty$ and "bad" to $-\infty$ separately, the net value is undefined, regardless of how you pair them up.

