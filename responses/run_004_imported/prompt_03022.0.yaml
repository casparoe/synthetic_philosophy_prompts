      *   **Core Issue:** The expected value (EV) series is conditionally convergent (alternating signs, magnitude grows). By Riemann Rearrangement Theorem, the sum depends on the order of terms.
      *   **User's Proposed Solution:** Why not just sum in the *temporal order* of the coin flips (Flip 1, Flip 2, Flip 3...)?
