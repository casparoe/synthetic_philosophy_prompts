  4.  **Identify the "Missing Big Picture":**
      *   **Pragmatism over Truth:** Turing isn't trying to prove ESP is false; he's trying to make the test *robust* against it.
      *   **The Nature of the Test:** The test is about *communication channels*. ESP is just another channel. Blocking it ensures the channel is textual.
      *   **Rhetorical Strategy:** Turing often concedes points to opponents only to show they don't matter. "Okay, assume ESP is real. Does it stop machines? No, we just build a room."
      *   **The Real Issue:** The ESP section reveals Turing's commitment to *physicalism*. If ESP exists, it violates known physics. By containing it, he preserves the physicalist framework required for computing.

