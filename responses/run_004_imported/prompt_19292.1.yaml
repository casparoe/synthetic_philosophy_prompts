  2.  **Historical Context & Voice:**
      *   **Setting:** Needs to be plausible. 1926 is the key year (Du Bois's "Criteria of Negro Art" speech was October 1926; Locke's "Art or Propaganda?" was in *The Crisis* around the same time). Let's place it in a quiet corner of a New York salon or office, perhaps after a public event.
      *   **Du Bois:** Formal, intense, uncompromising, driven by a sense of urgent moral duty. He speaks in measured but powerful sentences. He views himself as a leader of the race.
      *   **Locke:** Sophisticated, aesthetic-focused, philosophical, slightly more detached but deeply committed to racial pride through culture. He values nuance and the integrity of the medium.
