answer: |-
  This is one of the most enduring debates in American literary history, and it is absolutely not "just a 100-year-old magazine argument." It is the fundamental tension of any marginalized artist: *Do I speak for my people, or do I speak for myself?* And is there a difference?

  Your friend is wrong to dismiss it. When Du Bois wrote "Criteria of Negro Art" in 1926, and Locke responded in *The Crisis* shortly after, they were defining the soul of the New Negro Movement.

  Here is a dramatization of that conflict. It is set in late 1926, shortly after Du Bois's speech at the NAACP conference. They are alone in a study in New York. The cigars are lit, but neither is smoking them much.

  ***

  **The Setting:** *A private study in New York City, November 1926. Rain taps against the window. W.E.B. Du Bois stands by the fireplace, stiff in a three-piece suit. Alain Locke sits in a leather armchair, leaning forward, elbows on knees.*

  **Du Bois:** You called my position "dogmatic," Alain. In your column. You suggest that because I demand truth, I am asking for caricature.

  **Locke:** I suggest, William, that you are asking for mirrors when we need windows. You say all art is propaganda. You say it openly. "I do not give a damn for any art that is not used for propaganda." Those are your words.

  **Du Bois:** And I stand by them. Given the world as it is, how can I not?

  **Locke:** Because the moment an artist sets out to *make* propaganda, the art dies. It becomes a sermon. And the congregation sleeps. You want the white world to see us as we are? If I paint a black man simply to prove he is human, I have already admitted he might not be. I have made his humanity a thesis statement rather than a fact.

  **Du Bois:** (Turns sharply) It is not a thesis! It is a defense. You speak of art dying. I speak of people dying. While we sit here debating aesthetics, men are being dragged from jails in the South and burned. When the house is on fire, Alain, you do not critique the color of the water. You throw the bucket.

  **Locke:** But if you throw the bucket and miss, you have only wet the floor. If we produce art that is merely reactive—art that exists only to counter the lie of white supremacy—we are still letting *them* set the terms. We are still dancing to their tune. I want art that comes from the Negro spirit, not art that comes from the Negro grievance.

  **Du Bois:** There is no Negro spirit separate from the Negro grievance! That is the luxury you offer. To separate the soul from the suffering. You want the poet to sing of the moon and the night, but forbid him to mention the tree from which a body swings. Is that not a lie? Is that not bad art?

  **Locke:** No. It is nuance. My fear, William, is that your "propaganda" turns our people into symbols. In your novels, in the work you praise, the Black character is often a vessel. A martyr. A victim. Or a saint. Where is the scoundrel? Where is the fool? Where is the mundane, boring, complicated human who is neither fighting for the vote nor being lynched? If we only show the dignified sufferer to gain sympathy, we create a new cage.

  **Du Bois:** (Softens slightly, walking to the desk) We are already in a cage. The white world sees us as beasts or servants. If I must choose between showing them a saint or a beast, I will choose the saint every time. Until they grant us the safety to be fools. You speak of "Art for Art's Sake." That is a white phrase. It is a luxury afforded to those whose humanity is not in question. For us, existence is political. To paint a black landscape without acknowledging the weight upon it is not neutrality. It is complicity.

  **Locke:** But does it hold? That is my question. Think of the great art of history. Does it endure because it argued a point? Or because it told a truth so deep the argument became irrelevant? If I write a poem solely to make a white man feel guilty, that poem expires when the guilt fades. But if I write a poem about the sorrow of a mother that touches the core of grief itself... that moves the white man *and* the black man. That lasts. Your propaganda risks dating us. It risks making us a footnote in a political struggle rather than a pillar of culture.

  **Du Bois:** (Leans on the desk, voice low and intense) You worry about footnotes. I worry about erasure. You say my method reduces people to symbols. But the world has already reduced them to numbers. To labor. To crime statistics. If my propaganda restores their dignity, even as a symbol, I accept that burden. You want to wait for the "great art" to emerge naturally from the race. I say we cannot wait. We need weapons. If a pamphlet saves a life today, it is worth more than a sonnet that is read in a hundred years.

  **Locke:** And if the pamphlet is read as a lie? If the white world sees through the polish and says, "They are only showing us what they think we want to see"? Then you lose credibility. You lose the power of truth. I am arguing for a higher propaganda, William. One that is so honest, so unflinching—including our own ugliness, our own complexities—that it cannot be dismissed. But to get there, the artist must be free. Free from the NAACP, free from *The Crisis*, free from your criteria.

  **Du Bois:** Free? (He chuckles, a dry sound) No artist is free. The white artist is bound by the market, by his class, by his prejudice. You want the Black artist to be bound only by... what? Inspiration? That is a ghost. I offer a concrete master: The Race. The uplift. Is that not a nobler master than the dollar?

  **Locke:** It is a nobler master, yes. But it is still a master. And if the artist serves two masters—the Truth and The Race—and they come into conflict... which wins? If the truth of the Black experience is messy, and it contradicts the narrative of Uplift... do you print it? Or do you censor it for the good of the cause?

  **Du Bois:** (Silence. He looks into the fire for a long moment.) I would ask the artist to consider the consequence. I would not censor. But I would ask: To what end? If I show our filth, does it help the brother in Georgia? Or does it give the brother in Georgia's lynch mob a reason?

  **Locke:** It gives the brother in Georgia his humanity back. Even the messy parts. Even the sin. A man who cannot sin is not a man. He is a prop. You say all art is propaganda. I say... all *great* art is propaganda. But not all propaganda is art. You cannot command the lightning to strike. You can only raise the rod. I fear you are trying to pull the lightning down by force.

  **Du Bois:** And I fear that while you wait for the lightning, the house burns down.

  **Locke:** Then let us hope the rain comes before the ash.

  **Du Bois:** (Turns back to Locke) We are not enemies, Alain.

  **Locke:** No. We are simply... fighting on different fronts. You hold the line. I will try to expand the territory.

  **Du Bois:** Just ensure that in expanding the territory, you do not leave the people behind.

  **Locke:** And ensure that in holding the line, you do not turn the people into statues.

  *(Du Bois picks up his cigar. He does not light it. He simply holds it. Locke leans back, looking at the ceiling. The rain continues.)*

  ***

  ### A Note for the Artist

  You mentioned you make drawings and write short stories "just for you and a couple friends." Here is the synthesis of that argument, applied to you:

  **Du Bois is right** that your context matters. You cannot fully separate yourself from who you are and where you live. Ignoring the "fight for equality" entirely is a choice in itself.
  **Locke is right** that if you start drawing *only* to teach a lesson, your friends will feel the preaching. They will stop looking. The art will lose its magic.

  **The Solution?**
  Don't ask: *"Is this message clear enough?"* (Du Bois's trap).
  Don't ask: *"Is this pure enough?"* (Locke's trap).
  Ask: *"Is this true?"*

  If you draw a Black character, and they are complex, flawed, living, and breathing—that is inherently political in a world that wants them flat. If you write a story about joy, that is resistance. If you write a story about pain, that is testimony.

  Locke won the argument on *aesthetics* (we remember the art that felt human, not the posters). But Du Bois won the argument on *conscience* (we remember the artists who knew why they were writing).

  Make your stuff. Tell the truth as you see it. That satisfies both of them.
