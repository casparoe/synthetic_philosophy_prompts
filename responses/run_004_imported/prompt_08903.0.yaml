      *   *Refining Follow-ups:* Make them "trap" questions gently. If he gives the standard answer, the follow-up exposes the tension.

  7.  **Final Output Generation:** (Drafting the response with the appropriate tone). *Note: Ensure the tone respects the user's expertise while empowering them to challenge the guest.*

