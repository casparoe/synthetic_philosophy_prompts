prompt: |-
  Okay random question but this has been bugging me for like a week now. I'm taking intro ethics this semester and we just finished the Kant unit, where the big idea was that the moral worth of what you do comes from your will/intentions and shouldn't really depend on how things happen to turn out. Right after that unit something happened in my friend group that doesnt sit right with me and I can't quite figure out why, so I'm hoping you can help me think it through.

  Basically, my friend and I both help run our university's meme/confessions page, and on the same night we each posted a pretty similar edgy joke about the football team after they choked in a big game. Mine got like 30 likes and nothing else happened. Hers got screenshotted and reposted by some way bigger sports account completely out of context, blew up over the weekend, and by Monday the athletics department had emailed our club about it and she'd been forced to step down as an admin and post a public apology with her actual name on it. Looking back, our two jokes were honestly about equally risky/mean, she just had way worse luck in terms of who happened to see it and when the algorithm decided to care. Some people in our friend group think she basically deserves everything that happened because of "what actually went down," and others think its kind of insane that she's being treated like she did something way worse than me, when we made pretty much the identical call that night.

  So who's actually right here? Is there some principled reason she deserves more blame than me even though the only real difference between us is who happened to see the post and when, or is that difference basically an illusion created by how much worse consequences make something feel? We've got a debate final coming up in that class and part of me wants to use this as my example, so I'd genuinely love an actual argued answer instead of just 'well, that's just the internet for you.'
