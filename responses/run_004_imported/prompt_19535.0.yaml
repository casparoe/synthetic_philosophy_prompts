answer: |-
  This is not just a random question; this is a textbook case of a specific philosophical problem known as **Moral Luck**, specifically *resultant luck*. You have stumbled upon one of the most famous tensions in ethical theory, and it is perfect for your debate final.

  To give you the "argued answer" you need for class, we have to look at this through two competing lenses: the **Kantian/Control Principle** (which aligns with your intuition) and the **Consequentialist/Social Practice** view (which aligns with the friends saying she deserves it).

  Here is the breakdown of the ethical arguments so you can use them in your debate.

  ### 1. The Kantian Argument: The Control Principle
  Since you just finished the Kant unit, this is the most natural place to start. Kant argues that the only thing good without qualification is a **Good Will**. Conversely, the only thing that makes you *blameworthy* is a **Bad Will** (or a maxim that violates the Categorical Imperative).

  *   **The Argument:** Moral assessment must be based only on what is within the agent's control. You controlled your intention, your decision to post, and the content of the joke. You did *not* control the algorithm, the sports account that screenshot it, or the athletics department's reaction.
  *   **Application:** You and your friend adopted the exact same *maxim* (the subjective principle of volition): *"I will post this specific joke to this specific page despite the risk of it being offensive."*
  *   **Conclusion:** From a strict deontological perspective, **you are equally blameworthy.** To punish your friend more severely is to punish her for bad luck, not for bad morality. If morality depends on luck, then morality is irrational, because we cannot control luck.
  *   **Debate Point:** If we accept that she deserves more punishment, we are admitting that morality is a lottery. That undermines the very concept of justice.

  ### 2. The Counter-Argument: Moral Luck and Harm
  The friends who think she "deserves it" are relying on a deep-seated human intuition that philosophers like **Thomas Nagel** have analyzed. Nagel pointed out that while we *say* we believe in the Control Principle, we almost never *act* like it.

  *   **The Argument:** This is **Resultant Luck**. Consider the classic example: Two drunk drivers drive home equally recklessly. Driver A gets home safely. Driver B hits a pedestrian. Legally and morally, we punish Driver B much more severely. Why? Because **harm matters.**
  *   **Application:** Your friend's post *actually caused* reputational damage to the university and distress to the athletes. Yours did not. Even if the *risk* was the same, the *realization of harm* was different.
  *   **Conclusion:** In social and institutional contexts, we judge actions by their outcomes because outcomes are what affect the community. Your friend is not being punished for her "soul"; she is being held accountable for the **damage incurred.**
  *   **Debate Point:** Ethics isn't just about internal purity; it's about living in a community. If your action burns the house down, you are responsible for the ashes, even if you didn't *mean* to burn it.

  ### 3. The Institutional vs. Moral Distinction
  There is a third layer here that might win you the debate. You need to distinguish between **Moral Blame** and **Administrative Liability.**

  *   **Moral Blame:** Was your friend a "bad person"? Did she have a "bad will"? Kant would say she is no worse than you. Her moral character is identical to yours in this instance.
  *   **Administrative Liability:** The university is not a court of moral philosophy; it is a bureaucracy managing risk. When the athletics department stepped in, they weren't asking, "Whose will was more corrupt?" They were asking, "Which action created a liability we need to mitigate?"
  *   **The Synthesis:** Your friend group is conflating these two.
      *   If the question is "Is she a worse person than me?" the answer is **No** (Kant/Control Principle).
      *   If the question is "Does she bear the responsibility for the cleanup?" the answer is **Yes** (Consequentialism/Institutional Policy).

  ### How to Use This in Your Debate
  If you want to use this example, here is a strong structure for your argument:

  1.  **Define the Tension:** Start by defining **Moral Luck**. State that the situation highlights the conflict between the *Control Principle* (we are only responsible for what we control) and our *Outcome Bias* (we judge based on results).
  2.  **The Kantian Defense:** Argue that from the perspective of **moral worth**, the punishment is unjust. If morality is rational, it cannot depend on the algorithm. If it does, then "being good" is just "being lucky."
  3.  **The Concession:** Acknowledge the Nagel point. Admit that in the *real world*, consequences dictate punishment because society cares about harm reduction, not just intention policing.
  4.  **The Kicker:** Argue that while the *administration* was justified in managing the damage (consequentialism), the *friend group* is wrong to judge her character as worse than yours (deontology). We should resist the urge to conflate bad luck with bad character.

  ### The Verdict
  **Philosophically (Kantian):** You are right. She does not deserve more *moral blame*. The difference is an illusion created by consequences.
  **Sociologically/Pragmatically:** The other friends are right. She bears the *consequences* because she is the causal agent of the harm, regardless of intent.

  For an ethics class, the "Kantian" answer is usually the one professors are looking for in this context: **It is irrational to assign more moral guilt based on factors outside the agent's control.** The fact that it feels like she deserves it is a bug in human psychology, not a feature of ethical truth.

  Good luck with the final. This is a fantastic real-world application of the unit.
