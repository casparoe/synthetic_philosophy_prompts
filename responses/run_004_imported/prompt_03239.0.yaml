answer: |-
  Here is the position: **Hume would side with the Humeans (Lewis), but he would reject Lewis's metaphysics almost as vigorously as he would reject Armstrong's.**

  He would not be a Lewisian Humean Supervenient in the strict ontological sense, but he would be a **Methodological Humean** regarding laws. He would endorse the *Best System Account* (BSA) as the only cognitively meaningful way to talk about laws, while treating the "mosaic" not as Lewis's robustly real spacetime points, but as the totality of observable phenomena.

  Here is the argument for why this is the case, why the "New Hume" reading doesn't save the Anti-Humeans, and how he would handle quantum entanglement.

  ### 1. Why the "New Hume" Reading Doesn't Save Anti-Humeanism
  Your colleague is right that the "New Hume" (Strawson, Wright) is a serious scholarly position. If Hume was a skeptical realist, he believed that there *is* a causal glue in the world, but human cognition is structurally barred from grasping it.

  However, this does not push him toward Armstrong or Bird. In fact, it cements his alliance with Lewis against them.

  **The Reason:** The debate between Humeans and Anti-Humeans in contemporary metaphysics is not just about what *exists*; it is about what we can *say* and *theorize*.
  *   **Armstrong/Bird:** Claim we can posit, name, and build metaphysics around "necessitation relations" or "dispositional essences." They claim these are intelligible components of a theory of laws.
  *   **Hume (Old or New):** Claims that any term not traceable to an impression is meaningless noise.

  Even if "New Hume" is right and Hume privately believed in secret powers, his entire philosophical project is built on the prohibition of speculating about them. In the *Enquiry*, Section VII, Hume explicitly argues that because we have no impression of power, the word "power" has no distinct meaning when applied to external objects.

  If you resurrected Hume and showed him Armstrong's *N* relation (necessitation between universals), Hume would ask: "From what impression is this derived?" Armstrong would say, "It's a theoretical posit required to explain regularity." Hume would reply: "Then it is sophistry and illusion."

  Therefore, the Old/New debate is irrelevant to the modern dialectic.
  *   **Old Hume:** No powers exist. -> Supports Humean Supervenience.
  *   **New Hume:** Powers exist but are unknowable/unspeakable. -> Supports Humean Supervenience *as a theory of knowledge*, because we cannot include unknowable powers in our "systematization."

  Hume would tell Armstrong: "You are trying to make the unknowable the cornerstone of your metaphysics. That is dogmatism." He would tell Lewis: "You are positing a 'mosaic' of local particulars as if you know the substance of the world. That is also dogmatism. But your account of *laws* as summaries of regularities is the only one that respects the limits of human understanding."

  **Verdict:** Hume lands on the Humean side because Anti-Humeanism violates his **empiricist criterion of meaning**, regardless of his ontological commitments.

  ### 2. The Specific Stance: Pragmatic Best System, Not Lewisian Ontology
  Hume would not sign off on Lewis's *Ontology*. Lewis was a modal realist and believed in a precise, God's-eye view of the "mosaic" of local qualities. Hume was a skeptic about substance, the self, and the continuous existence of objects.

  Hume's version of Humean Supervenience would be **Phenomenalist Best System Analysis**.
  *   **The Mosaic:** Not spacetime points with intrinsic properties, but the totality of perceptual events (impressions).
  *   **The Laws:** The axioms that best balance simplicity and strength in organizing those impressions.

  He would reject the Anti-Humean claim that laws *govern*. For Hume, "governing" implies a power, and we have no impression of nature obeying a rule. Nature just *is*. To say a law "makes" an electron spin up is to project a human feeling of expectation onto the universe.

  So, if forced to choose a camp in the modern department:
  *   He joins the **Humeans** in denying that laws are irreducible modal entities.
  *   He critiques the **Lewisians** for reifying the "mosaic" into a metaphysical absolute.
  *   He destroys the **Anti-Humeans** for violating empiricist semantics.

  ### 3. The Quantum Entanglement Bonus
  This is where the rubber meets the road. Tim Maudlin's argument is that Humean Supervenience is empirically false because quantum mechanics (specifically entanglement) shows that the physical state of the world does *not* supervene on the intrinsic qualities of local spacetime points. The whole is not determined by the parts.

  If Hume were dropped into a quantum physics lab, would this break his view?

  **No. It would only break Lewis's specific formulation of it.**

  Hume's core commitment is not to "local point-sized particulars." That is a 20th-century metaphysical add-on. Hume's core commitment is to **"matters of fact" accessible to experience.**

  1.  **Redefining the Mosaic:** Hume would look at the quantum state vector (the wave function). Is it a "matter of fact"? In the context of modern science, yes. It is the fundamental datum from which predictions are derived. Hume would simply update his ontology. The "mosaic" is not local beables; the mosaic is the global wave function history.
  2.  **The Supervenience Claim:** As long as the laws (the Schrödinger equation, etc.) are seen as *descriptions* of how that wave function evolves, rather than *powers* that force it to evolve, Hume is happy. The laws still supervene on the total history of the quantum state.
  3.  **The "Spooky Action" Objection:** Maudlin argues that non-locality implies a holistic nature that contradicts Humean separability. Hume would respond with skepticism about "separability" itself. In the *Treatise*, Hume argues that our idea of distinct existences is a fiction of the imagination. If experience (via the Bell inequalities) tells us the world is non-separable, Hume accepts the experience. He does not have a prior commitment to "locality" that trumps empirical data.

  **However, here is the dent:**
  Hume would be deeply suspicious of *realist* interpretations of the wave function that treat it as a "dispositional essence" (like Bird). If a physicist says, "The entangled state *disposes* the particles to correlate," Hume hears "secret power."

  He would prefer an **Instrumentalist Humeanism**. He would say: "The entanglement is a regularity in our observations. The math systematizes it. Do not tell me the math is a 'governing structure.' It is a tool for navigating impressions."

  ### Summary of the Resurrected Hume's Position

  If Hume walked into your department meeting today:

  1.  **On the Name:** He would accept the label "Humean Supervenience" but clarify that it is a thesis about *human conceptualization*, not a thesis about the *mind-independent structure of reality*.
  2.  **On Old vs. New:** He would tell your colleague that even if he (Hume) was a "New Hume" skeptical realist, it doesn't matter for philosophy. Philosophy is limited to the understanding. Since we cannot understand necessitation, we must theorize *as if* it doesn't exist. **Anti-Humeanism is therefore philosophically illegitimate, regardless of metaphysical truth.**
  3.  **On Lewis:** "You have turned my skepticism into a dogmatic ontology of 'possible worlds' and 'local qualities.' But your account of *laws* is correct. Laws are summaries, not rulers."
  4.  **On Quantum Entanglement:** "You are fighting over whether the world is 'local.' I do not know if the world is local. I know that your best systematization of phenomena requires non-local math. Accept the math as a matter of fact, but do not reify the equations into 'governing powers.' If the mosaic is holistic, then the mosaic is holistic. The laws still supervene on the mosaic; the mosaic is just weirder than Lewis thought."

  **Final Answer:** Hume is a **Humean**, but primarily for semantic and epistemological reasons, not metaphysical ones. He rejects Anti-Humeanism because it claims knowledge of the unknowable. He accepts Humean Supervenience because it is the only theory of laws that remains within the bounds of empirical sense. Quantum entanglement forces him to update the *content* of the mosaic, but not the *supervenience* relationship itself.
