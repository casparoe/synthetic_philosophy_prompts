      *   *Core Humean Insight:* We have no impression of "power," "force," or "necessary connection" in external objects. We only have the impression of expectation/habit internally.
      *   *Application to Modern Debate:*
          *   **Lewis (HS):** Fits the "Old Hume" reading perfectly. Laws are summaries of the mosaic. No hidden powers.
          *   **Armstrong/Bird (Anti-Hume):** Posits entities (necessitation relations, dispositions) that are not directly observable.
      *   *The "New Hume" Twist:* If Hume is a skeptical realist, he might say, "Sure, maybe there *are* Armstrongian universals, but we can't talk about them meaningfully."
      *   *Decision:* Which reading drives his *philosophical practice*? Even if the "New Hume" is historically accurate regarding his *metaphysical agnosticism*, his *epistemological strictures* remain. He bans what cannot be traced to an impression from serious philosophical discourse.
      *   *Verdict:* He would side with the Humeans (Lewis), *but* with a crucial caveat. He wouldn't endorse Lewis's *metaphysics* (modal realism, etc.) but rather his *methodology*. He would reject Anti-Humeanism as meaningless speculation.

