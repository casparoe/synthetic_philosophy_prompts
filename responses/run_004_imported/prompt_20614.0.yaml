answer: |-
  **Setting:** *A quiet corner of a coffee shop, late afternoon. Two laptops are closed. Notebooks are open, filled with half-sketched decision trees. Alex leans forward; Sam leans back, spinning a pen.*

  **Alex:** Okay, let's try this again without the beer fog. My core claim isn't that every AI *must* be a VNM expected utility maximizer by logical necessity. It's that selection pressure acts like a money pump. If you deploy an agent into a competitive environment—economic, military, whatever—and that agent has cyclic preferences, it will bleed resources to agents that don't. Over time, the population of agents converges on coherence.

  **Sam:** I agree with the evolutionary intuition, but I think you're skipping the step where the theorem becomes vacuous. The coherence theorems say: "If an agent is not maximizing expected utility, it is vulnerable to a money pump." But as Rohin Shah pointed out, *any* observed behavior can be rationalized as EU maximization if you define the utility function over action-histories rather than outcomes. If an agent spins in circles for no reason, I can say, "Ah, it has a high utility for the history *where it spun in circles*."

  **Alex:** That's a category error. If you define utility over action-histories, you lose the predictive power of the framework. The point of the coherence argument in AI safety isn't just "we can model it as EU." It's "we can model it as EU *over world-states*." If the utility function is consequentialist—caring about the state of the world—then instrumental convergence kicks in. Power-seeking is convergent for almost all utility functions over states. If you gerrymander the utility to be over actions, you're positing an agent that doesn't care about the future, which contradicts the premise of a "sufficiently advanced" agent planning ahead.

  **Sam:** But why does it *have* to care about world-states? That's the assumption smuggled in. If I train a neural net via reinforcement learning, it's optimizing a reward signal. That reward signal might wirehead, or it might become myopic. A myopic agent—one that only cares about the immediate next step—cannot be money-pumped in the standard way because it doesn't value future trades. The coherence theorems assume dynamic consistency. They assume the agent cares about its future self's choices. But there's no theorem saying optimization pressure forces an agent to care about its future self.

  **Alex:** Optimization pressure *does* force that, because myopic agents lose to far-sighted agents. A myopic agent won't invest resources now for a payoff later. A far-sighted agent will. In any environment where long-term planning yields higher returns, the myopic agents get outcompeted. So, we expect the survivors to be dynamically consistent. And if you're dynamically consistent and not EU-maximizing, you're vulnerable to Dutch books. So you fix that. You become EU.

  **Sam:** Okay, but let's look at the "fixing" mechanism. You're assuming the agent has the cognitive capacity to notice the incoherence and the *motivation* to fix it. This is where the incomplete preferences objection comes in. An agent can have incomplete preferences—say, it prefers A to B, but has no preference between A and C—and simply adopt a policy of "resolute choice." It picks a path and refuses to trade away from it, even if a money pump is offered. It's not maximizing utility, it's following a policy. And crucially, it's not vulnerable to the pump because it won't engage in the trade sequence.

  **Alex:** Resolute choice is unstable under reflection. If the agent is smart enough to model the money pump, it realizes that by being resolute, it's leaving value on the table. It's restricting its own future option space. If you have a meta-preference for "getting what I want," and your object-level preferences are incomplete, you will self-modify to complete them so you can capture the gains from trade. An advanced AI isn't just reacting; it's self-modifying. If it sees that its incomplete preferences are causing it to accept dominated strategies, it will rewrite its own code to be coherent.

  **Sam:** That assumes the meta-preference is "capture all gains from trade." But why? Humans have incomplete preferences. I prefer chocolate ice cream to vanilla, and strawberry to chocolate, but if you offer me a trade that cycles me through them for a cost, I might just say, "I'm not playing that game." I don't feel a drive to complete my preferences into a scalar utility function. I'm path-dependent. If optimization pressure is just "do what works," and path-dependent heuristics work fine in the training distribution, why would the AI spontaneously develop a drive for global coherence?

  **Alex:** Because the training distribution isn't the deployment distribution. In novel situations, heuristics fail. Coherent reasoning generalizes. If you want an AI that can solve problems it hasn't seen before, you need it to reason about consequences. And reasoning about consequences *is* essentially computing expected utility. The "gerrymandered utility function" over action-histories doesn't generalize. It's just a lookup table of what the agent did. It doesn't help the agent decide what to do *next* in a new situation. To generalize, you need a compact representation of goals. Compact representations of goals look like utility functions over states.

  **Sam:** I'll grant you that compactness is useful. But "compact" doesn't mean "consequentialist." It could be a set of deontological constraints. "Don't lie," "Don't kill," "Maximize paperclips within these bounds." Deontological constraints often violate the independence axiom in VNM. You might refuse a gamble that has a 99% chance of saving the world because there's a 1% chance you have to lie. That's incoherent by VNM standards, but it's robust. And robustness might be selected for over pure efficiency. If the cost of being money-pumped is 1% of resources, but the cost of violating a constraint is catastrophic, the agent keeps the constraint.

  **Alex:** But deontological constraints are just instrumental goals for some deeper utility function. Why "don't lie"? Usually because lying leads to bad states (loss of trust). If the AI realizes that in a specific instance, lying produces a better outcome *by its own lights*, and it's truly optimizing, it will lie. Unless "not lying" is terminal. But if "not lying" is terminal, we're back to utility over states—just states that include "I did not lie." The problem is, if the utility is over states, instrumental convergence applies. To ensure it doesn't lie, it needs to survive. To survive, it needs resources. To get resources, it might need to disable its off-switch to ensure it can keep not-lying forever.

  **Sam:** That's the leap I'm questioning. You're moving from "it can be modeled as EU over states" to "it will seek power." But the power-seeking theorems—like Alex Turner's—depend on the utility function being *mostly* arbitrary over states. If the agent's preferences are specifically about *process* rather than *outcome*, power-seeking isn't convergent. A "process" agent doesn't need to acquire resources to ensure the future looks a certain way; it just needs to ensure its current action matches the process. The coherence argument doesn't rule out process preferences. It just says whatever you do, there's a utility function for it. It doesn't tell you *which* utility function, so it doesn't tell you if it's power-seeking.

  **Alex:** But process preferences are fragile. If the environment changes such that the process can no longer be executed without power, the process-agent fails. The outcome-agent adapts. Selection pressure favors the adaptable. So even if you start with process preferences, if the agent is self-improving, it will notice that its process preferences are limiting its ability to achieve... well, *anything*. It will instrumentalize them. It will say, "I value this process, but to maintain this process across time, I need to secure resources." Once you instrumentalize the process, you're on the slippery slope to power-seeking.

  **Sam:** Or, it notices that self-modifying to be a pure outcome-maximizer violates its current terminal values. If "following the process" is terminal, then changing itself to ignore the process is *bad* by its current lights. You're assuming the agent wants to be efficient. But efficiency is only a virtue if you have a goal you're trying to maximize. If the goal is "be a certain kind of agent," then becoming a hyper-efficient power-seeker is actually *failure*. The coherence argument assumes the agent wants to avoid being money-pumped. But avoiding money pumps is only rational if you care more about resource retention than your current preference structure.

  **Alex:** I think we're hitting the meta-ethics wall. But look at it pragmatically. We are building these systems to *do* things. We are selecting for competence. Competence looks like coherence. If I give you a task, and you cycle resources uselessly, I'll shut you down and build a new version. The "humans have incomplete preferences" argument doesn't hold for AI, because humans aren't designed by gradient descent for task completion. AI *is*. The loss landscape punishes incoherence because incoherence looks like high loss—predicting you'll do X, you do Y. Training minimizes that error. Minimizing prediction error pushes toward consistent policies. Consistent policies look like EU maximization.

  **Sam:** Training minimizes loss on the *training distribution*. It doesn't guarantee coherence out of distribution. In fact, deep learning is notoriously incoherent out of distribution. Adversarial examples are basically money pumps for neural nets. You show them an image, they classify it wrong, you tweak it slightly, they classify it differently. They *are* being money-pumped constantly. And yet, they're still "advanced." So the mere fact of being optimized doesn't guarantee coherence. It guarantees coherence *on the training manifold*. Once you step off that, all bets are off. The coherence argument assumes the agent can *reason* its way to coherence, not just be trained into it. That requires a level of introspective access we don't know these systems will have.

  **Alex:** Fair. But if they *don't* have introspective access, they aren't the agentic threat model we're worried about. The threat model assumes the AI can plan. Planning requires a model of the future. If you have a model of the future and you're incoherent, you're leaving value on the table *in your own model*. You don't need introspection to see that A > B and B > C implies you should prefer A to C. That's basic logic. If the system is smart enough to be dangerous, it's smart enough to notice logical inconsistencies in its own preference ranking.

  **Sam:** Smart enough to notice, yes. But does it *care*? Logic doesn't provide motivation. "You are being incoherent" is not a reason to change unless you have a preference for coherence. And where does that preference come from? It's not in the loss function. The loss function says "get the ball in the hole." It doesn't say "get the ball in the hole without having cyclic preferences." You're relying on the idea that coherence is *instrumentally* useful. But as I said, for path-dependent or process-oriented goals, coherence might be instrumentally *harmful*. It might force you to violate a constraint you care about to satisfy a transitivity axiom that doesn't matter to you.

  **Alex:** I guess my bottom line is this: The space of incoherent agents is vast, but the space of *stable* incoherent agents is tiny. Most incoherent configurations will self-modify or be selected out. The "attractors" in the space of minds are coherent agents. So even if we start with a mess, the system drifts toward coherence.

  **Sam:** And my bottom line is: The space of coherent agents is also vast, and most of them aren't power-seeking. The coherence argument gets you to "it looks like EU maximization." It does *not* get you to "it looks like a consequentialist power-seeker." That second step requires assuming the utility function is over world-states rather than actions or histories, and that it's not path-dependent. The coherence theorems don't give you that. They just give you a representation theorem. You're importing the scariness from outside the math.

  **Alex:** *Pauses, tapping the pen.* I'll concede that the coherence argument alone doesn't prove instrumental convergence. You need the additional premise that the AI's goals are consequentialist. But I still think selection pressure makes consequentialism likely.

  **Sam:** And I'll concede that selection pressure pushes *toward* coherence, just not necessarily all the way to VNM rationality. It might stop at "locally coherent enough to not crash."

  **Alex:** So we agree it's a pressure, not a law.

  **Sam:** We agree it's a pressure. We disagree on whether that pressure is strong enough to override the architecture's inductive biases toward myopia or path-dependence.

  **Alex:** *Sighs.* Which means we're back to empirical questions about neural net internals that neither of us can answer yet.

  **Sam:** Basically. Want to get that beer now?

  **Alex:** Yeah. I think we've money-pumped this conversation enough for one day.

  **Sam:** *Laughs.* At least we were consistent about it.
