  7.  **Refining the "Locality vs. Realism" point:**
      *   Bell's 1964 paper assumed determinism (a form of realism).
      *   Bell's 1976 paper ("The theory of local beables") generalized this to stochastic theories. The assumption is **Local Causality**.
