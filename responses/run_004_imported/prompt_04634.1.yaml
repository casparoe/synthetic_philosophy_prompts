      *   *Many-Worlds (Everett):* Tricky. Often claimed to be local. The wavefunction evolves locally (Schrödinger equation is local). The "non-locality" is an illusion of branching. However, defining "locality" in MWI is contentious. Some say it saves locality by sacrificing single-outcome realism.
      *   *Superdeterminism:* Saves locality by sacrificing "measurement independence" (free choice). The settings and the particle state share a common cause in the past. Locality is preserved, but at the cost of scientific method independence (conspiracy).
      *   *Summary:* None escape "costs." Bohm pays with non-locality. MWI pays with ontology (many worlds). Superdeterminism pays with free will/methodology.

  6.  **Synthesizing the Response:**
      *   *Tone:* Encouraging but rigorous. Acknowledge the difficulty of the topic.
      *   *Structure:*
          1.  Fact Check (2015 vs. 2017 Starlight).
          2.  The "Locality vs. Realism" Debate (The Friend was right). Explain Maudlin/Norsen's position (Bell proved Non-locality, not just Not-(Local&Real)).
