      *   *Correction:* The 2015 experiments closed the locality and detection loopholes simultaneously. The starlight/quasar experiments came later (2017, 2018) to address the freedom-of-choice loophole more aggressively.
      *   *Action:* Need to correct the date/experiment detail.

  3.  **Evaluate "Locality vs. Realism" Framing:**
      *   *Draft Claim:* "Since giving up realism... most physicists have concluded that locality is the assumption that has to go."
      *   *Expert Consensus (Bell, Maudlin, Norsen, etc.):* This is the core friction point.
      *   *Bell's View:* Bell derived his inequality from *local causality*. He often spoke of "beables" (realism), but the core conflict is with *local causality*.
      *   *Maudlin/Norsen View:* They argue strongly that Bell's theorem proves **non-locality** outright, *assuming* the predictions of QM are correct. They argue "realism" isn't an independent assumption you can drop to save locality. If you drop realism (in the sense of hidden variables), you still have non-local correlations that demand explanation. Maudlin famously says: "Bell's theorem proves that nature is non-local." The "realism" escape hatch is often considered a confusion (conflating outcome determinism with Bell's broader local causality condition).
