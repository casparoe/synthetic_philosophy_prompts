      *   So, logically: Not (Locality AND Realism).
      *   Pop-sci says: Pick one.
      *   Maudlin says: Realism isn't an assumption of Bell's theorem (in the 1976 version). Only Local Causality is. So Locality is dead.
      *   *Advice:* Suggest phrasing that emphasizes the failure of "Local Causality" rather than a symmetric choice.

