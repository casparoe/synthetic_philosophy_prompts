  I'm a retired physicist who's gotten pretty into moral philosophy since retiring, and lately I've been reading about Anscombe's campaign against Oxford giving Truman an honorary degree over Hiroshima and Nagasaki (the "Mr Truman's Degree" pamphlet). Here's what's bugging me though: the standard defense of the bombings has always been that they saved lives overall, since a land invasion of Japan would've been way bloodier for both sides. If thats basically right on the numbers, doesn't it pull the rug out from under Anscombe's whole objection? Seems like her case amounts to a bet about body counts that just didn't pay off once historians ran the estimates. Am I missing something, or does her argument just not really hold up anymore?
