answer: |-
  You are asking a sharp question that cuts to the heart of a clash between two very different ethical frameworks. As a physicist, you are naturally inclined to look at the variables and the outcome: if $X$ deaths prevent $Y$ deaths, and $Y > X$, the action is justified. This is **consequentialism** (specifically utilitarianism).

  However, to say Anscombe's argument rests on a "bet about body counts" is to misunderstand the fundamental premise of her philosophy. Her argument does not hold up *if* you assume consequentialism is the correct moral framework. But if you assume her framework (deontological/natural law), the body counts are morally irrelevant.

  Here is why your assessment that she was just "bad at math" misses the point of her pamphlet *Mr. Truman's Degree*.

  ### 1. The Category Error: Consequences vs. Actions
  Anscombe was a student and successor of Wittgenstein, but in ethics, she was an Aristotelian-Thomist. She argued that certain actions are **intrinsically evil**, regardless of their consequences.

  For Anscombe, the deliberate killing of the innocent (non-combatants) is murder. It is an absolute prohibition.
  *   **The Consequentialist View:** The morality of the act is determined by the net outcome (lives saved vs. lives lost).
  *   **Anscombe's View:** The morality of the act is determined by the nature of the act itself and the intention of the agent.

  When you ask if the "land invasion estimates" pull the rug out from under her, you are assuming the rug is made of data. For Anscombe, the rug is made of moral law. Even if a land invasion would have cost 10 million lives, Anscombe would argue you cannot murder 200,000 innocents to prevent it. To her, "doing evil that good may come" is logically incoherent.

  ### 2. Intentionality and the Doctrine of Double Effect
  This is the technical philosophical core where your physicist's eye for precision will appreciate the distinction. Catholic moral theology (which Anscombe adhered to) utilizes the **Doctrine of Double Effect**. This doctrine allows for actions that have bad side effects, provided:
  1.  The act itself is good or neutral.
  2.  The bad effect is not intended (only foreseen).
  3.  The bad effect is not the *means* to the good end.
  4.  There is a proportionate reason for allowing the bad effect.

  Anscombe argued the atomic bombings (and indeed, the area bombing of Dresden and Tokyo) violated this specifically on point #3. The death of the civilians and the destruction of the cities was not an unfortunate side effect of hitting a military target; **the terror and destruction of the civilian centers was the very mechanism by which the surrender was coerced.**

  Therefore, in her view, the civilians were not "collateral damage"; they were the target. That makes the act intentional killing of the innocent, which she classifies as murder. No amount of "lives saved" calculus can justify murder in her framework.

  ### 3. The "Numbers" Were Contested Then, Too
  It is worth noting that even in 1956, the "million lives saved" narrative was not the settled historical fact it is often portrayed as today.
  *   Many military leaders (including Eisenhower and Leahy) believed Japan was already on the verge of collapse due to the naval blockade and conventional bombing.
  *   The Soviet entry into the war was arguably as significant a factor in the surrender as the bombs.

  However, Anscombe anticipated the consequentialist defense. She wrote:
  > *"It is pointless to argue about whether the bombing was necessary to win the war... We are not concerned with the utility of the act, but with its justice."*

  She explicitly bracketed off the historical debate about invasion casualties because she deemed it irrelevant to the moral classification of the act.

  ### 4. Does Her Argument "Hold Up"?
  You asked if her argument doesn't really hold up anymore. The answer depends entirely on which ethical operating system you are running.

  *   **If you are a Utilitarian:** Her argument fails. If the net reduction in suffering was positive, the act was moral. The historical data on Operation Downfall casualties becomes the critical variable.
  *   **If you are a Deontologist (or Just War Theorist):** Her argument holds up perfectly. The development of "total war" strategies that erase the distinction between combatant and non-combatant is a moral catastrophe, regardless of the efficiency of the outcome.

  In modern Just War Theory (*jus in bello*), Anscombe's position has actually gained ground, not lost it. The principle of **non-combatant immunity** is a cornerstone of international humanitarian law (e.g., the Geneva Conventions). While nations still violate it, the *legal and moral consensus* is that intentionally targeting civilians is a war crime, full stop. You cannot defend a war crime in court by saying, "But it shortened the war."

  ### 5. Why This Bothered Her Specifically
  Anscombe wasn't just analyzing history; she was protesting Oxford University. Her point was institutional integrity. By giving Truman an honorary degree, Oxford was effectively endorsing the principle that heads of state are exempt from ordinary moral prohibitions against murder if they claim it serves the greater good.

  She feared that if we accept the consequentialist defense of the atomic bomb, we remove the only brake on future atrocities. If "saving lives" justifies killing innocents, what limit is there on what a state can do to its enemies (or its own people) in the name of security?

  ### Summary
  You aren't missing data; you are applying a different moral algorithm.
  *   **Your calculation:** Minimize total death count.
  *   **Anscombe's calculation:** Minimize violations of absolute moral prohibitions.

  If the historical consensus shifted tomorrow and proved that an invasion would have cost *fewer* lives than the bombs, a utilitarian would have to condemn Truman. Anscombe would condemn him regardless. Conversely, if an invasion would have cost 50 million lives, a utilitarian praises Truman. Anscombe still condemns him.

  Her argument doesn't rely on the body count estimates, so new historical data doesn't invalidate it. It only invalidates it if you reject the premise that there are actions we must never commit, regardless of the cost. Given your background, you might find that constraint inefficient, but logically, within her system, it is robust.
