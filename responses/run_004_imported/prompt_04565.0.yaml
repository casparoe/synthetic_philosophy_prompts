answer: |-
  **Setting:** *The courtyard of the Nizamiyya Madrasa, Baghdad. Late evening. The air is cool, smelling of jasmine and old paper. A single brass brazier glows between two low divans. YUSUF (40s, an Ash'arite theologian, robes immaculate) sits cross-legged, watching the coals. TARIQ (50s, a physician and philosopher, sleeves rolled up, ink-stained fingers) paces slowly, holding a scroll.*

  **Tariq:** You stare at the ember as if it speaks to you, Yusuf. Does it whisper theology?

  **Yusuf:** It whispers the truth of power, Tariq. Look. You place your hand near it, you feel heat. You throw a scrap of cotton upon it, it turns to ash. You say the fire did this. I say you are mistaken. The fire is inanimate. It has no will, no agency. It is God who creates the blackness in the cotton at the precise moment the cotton touches the flame.

  **Tariq:** We are back at the *Incoherence*, then? I thought the ink on that debate had dried twenty years ago.

  **Yusuf:** The ink dries, but the error remains. You philosophers claim the fire burns by its own nature (*tabi'a*). You say there is a necessary connection between the contact and the burning. This is shirk of the intellect. It assigns agency to what is dead.

  **Tariq:** It assigns reality to what is evident! If I deny that the fire burns, I deny the testimony of my senses and the judgment of my reason. Tell me, Yusuf. If there is no causal connection, why do you not reach into the brazier to retrieve your prayer beads?

  **Yusuf:** *(Smiles faintly)* Because God has established a habit (*'ada*). He creates the burning whenever contact occurs. He is consistent. But consistency is not necessity. If I were to reach in, and God willed that I be unburned—as He willed for Abraham in the furnace—I would remain cool. The fire does not compel the burn. God compels it.

  **Tariq:** But that makes the universe a theater of shadows! If the fire has no nature to burn, and the water has no nature to cool, and the bread has no nature to satiate... then nothing in this world is truly connected to anything else. You have severed the links of existence.

  **Yusuf:** I have severed the idols of necessity. I have preserved the absolute sovereignty of the Agent.

  **Tariq:** You have destroyed the possibility of knowledge! Think, my friend. Put aside theology for a moment. I am a physician. When I give scammony to a patient, it purges the bile. Why? Because of the nature of the scammony and the nature of the bile. If you are right, the scammony does nothing. God creates the purging at the moment of swallowing.

  **Yusuf:** Precisely.

  **Tariq:** Then medicine is sorcery! If there is no causal link, I cannot predict the cure. I might as well give the patient stones and pray God creates health. You say God maintains a "habit." But how do I know this habit? Only by observing the past. But if the past has no power over the future—if the connection is not real—then observing the past teaches me nothing about what God will do next. He could wake tomorrow and decide that poison nourishes and bread kills.

  **Yusuf:** He *could*. That is the point. His power is not bound by your definitions of "poison."

  **Tariq:** But if He *could*, then certainty is impossible. Not just metaphysical certainty, but practical certainty. You make a liar of the Creator.

  **Yusuf:** How?

  **Tariq:** Because He endowed us with intellects that perceive cause and effect. He gave us minds that grasp that heat expands air and cold contracts it. If these natures are illusions—if the fire is not truly hot—then God has created us with an intellect that perceives falsehood as truth. He has deceived us. And the Truthful One does not deceive.

  **Yusuf:** *(Leans forward, tapping the arm of the divan)* You confuse the perception of sequence with the perception of power. We see the contact, then we see the ash. We do not see a "power" passing from the fire to the cotton. That power is an inference you add. God creates the contact, and God creates the ash. The link is in the mind of the observer, not in the fabric of the world. This protects God from being a "deceiver" because He never claimed the fire had power. You are the one claiming it.

  **Tariq:** It is not an inference! It is the definition of a thing. What is fire, if not that which burns? What is water, if not that which quenches? If you strip things of their natures, they cease to be things. They become mere occasions for God's action. The universe becomes a single, chaotic moment repeated endlessly.

  **Yusuf:** It is not chaotic. It is ordered by Will, not by blind law.

  **Tariq:** It is ordered by Wisdom! Consider the miracle you cling to. Abraham in the fire. You say this proves fire has no nature. I say it proves God is the Master of natures.

  **Yusuf:** Explain.

  **Tariq:** A miracle is not the suspension of causality. It is the intervention of a higher cause. When a man throws a stone, it breaks a window. The stone has the nature to break. But if I catch the stone mid-air, the window remains whole. Did the stone lose its nature? No. A stronger agent intercepted the effect.
  When God saved Abraham, He did not turn the fire into "cold fire" essentially. He intercepted the effect of the fire through a higher power. But for the fire to be intercepted, it must first *have* a nature to intercept! You cannot stop a cause that does not exist.

  **Yusuf:** *(Pauses, looking at the coals)* You argue that God works *through* the natures.

  **Tariq:** I argue that God created the natures to be His agents. To deny secondary causation is to diminish God's creation. It implies He is too weak to delegate power. You make God a micromanager, moving every atom Himself, like a puppeteer jerking strings. I say He is a King who grants authority to His subjects. The fire truly burns because He granted it the authority to burn.

  **Yusuf:** But where does that authority end? If the fire truly burns by its own nature, is God bound by it? Can He *not* make the fire cool without a "miracle"? Is He constrained by the logic of Aristotelian physics?

  **Tariq:** He is not constrained by logic, for logic is the structure of His own mind. But He does not contradict His own wisdom. To create a nature and then pretend it does not function is wasteful. And God is not wasteful (*la yaf'alu Allah al-'abath*).
  If your view holds, Yusuf, then prophecy is no different from magic. The miracle of the Staff of Moses... was the staff actually turning into a serpent? Or did God just create the *image* of a serpent in the eyes of the onlookers while the wood remained wood?

  **Yusuf:** *(Sharp intake of breath)* Do not put words in my mouth. The staff became a serpent.

  **Tariq:** How? If natures are fixed only by habit? If the wood has no nature, and the serpent has no nature, then the transformation is meaningless. It is a trick of the light. My view preserves the reality of the miracle. The staff's nature was temporarily subsumed by a higher command, but the reality of the serpent was true. It had the nature of a serpent, created instantly by God, acting through the form of the staff.

  **Yusuf:** You cling to these "natures" as if they are partners to God.

  **Tariq:** I cling to them as the signs of God. When I study the movement of the spheres, or the digestion of food, I am studying the *ways* of God. If I say "the digestion happens because God wills it" and stop there, I have closed the book of the universe. I have refused to read the sentences He wrote.
  You fear that admitting causes limits God. I tell you, admitting causes honors God's consistency. It allows the human mind to participate in divine knowledge. If there is no cause, there is no science. There is only memory of what happened yesterday, and hope that God does the same today.

  **Yusuf:** *(Softly)* It is not hope. It is trust (*tawakkul*).

  **Tariq:** Trust is for the soul. Knowledge is for the mind. You ask me to sever the mind from the world to save the soul. I say the world is a mirror. If you smash the mirror because you fear it might reflect something other than the Reflector, you see nothing at all.

  **Yusuf:** And I say you worship the mirror. You look at the reflection of the fire and say, "This burns." You forget the Hand that holds the glass.

  **Tariq:** I look at the fire, I see the burning, and I say, "This burns by the permission of the Hand." I do not deny the Hand. I simply refuse to pretend the fire is cold.

  **Yusuf:** *(Sits back, the tension easing slightly)* We are agreed on the Hand, Tariq. We dispute the weight of the glass.

  **Tariq:** And whether the glass can break the fall of a stone.

  **Yusuf:** *(Gestures to the brazier)* Then let us test the habit. Pass me the tongs. I will not test God's power, but I will not test His habit either. I am a theologian, not a martyr.

  **Tariq:** *(Laughs, handing over the iron tongs)* Wisdom, at least, is consistent. Even for an Ash'arite.

  **Yusuf:** And even for an Aristotelian, prayer is better than logic when the night grows cold.

  *(Yusuf adjusts the coals. The sparks fly up, bright and brief, vanishing into the dark courtyard.)*
