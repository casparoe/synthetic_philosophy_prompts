prompt: |-
  Ok I'm working on a novel with a scene set in a 12th century madrasa, and I need two of my characters to have a proper argument about causation - one's a hardcore occasionalist in the al-Ghazali mold, the other's an Aristotelian philosopher basically channeling Averroes (yes I know they never actually crossed paths, thats fine for my purposes, its fiction). Could you write me their dialogue? I want the occasionalist to make Ghazali's actual argument - fire doesn't burn cotton by its own nature, God just habitually creates the burning at the moment of contact and could withhold it without any contradiction - and I want the philosopher to give a genuinely strong reply about natures and secondary causation, not just wave his hands at "common sense." Push them into the harder stuff too - doesn't denying real natures make science and prediction impossible, and how does the philosopher's view leave room for miracles at all? I want both of them equally sharp and actually responding to what the other just said, not just restating their own position louder.
