answer: |-
  **Margins, Luminosity, and the Conflation Problem: Why Williamson's Chapter 4 and Chapter 5 Must Part Ways**

  **Introduction**

  It has become a standard refrain in contemporary epistemology to treat Timothy Williamson's anti-luminosity argument (Chapter 4 of *Knowledge and Its Limits*) and his argument against the KK principle (Chapter 5) as two sides of the same coin. The standard reading suggests that both arguments rest on a single "margin for error" principle: that knowledge requires safety across nearby worlds, and since our discriminatory powers are limited, we cannot know the boundaries of our own minds any better than we know the boundaries of the external world. Consequently, many departments teach that if you accept Williamson's case against KK, you are committed to his claim that no non-trivial mental state is luminous.

  This essay argues that this conflation is a mistake. While both arguments utilize margin-for-error reasoning, they target different epistemic structures and rely on distinct premises regarding the nature of the conditions involved. Chapter 4 targets the *luminosity of phenomenal states* via a sorites series on the *condition itself* (feeling cold). Chapter 5 targets the *iterability of knowledge* via the *inexactness of evidence* regarding external (or internal) facts. By disentangling them, we can see that Williamson's argument in Chapter 5 succeeds in undermining KK for inexact knowledge, while his argument in Chapter 4 fails to undermine the luminosity of phenomenal states. To demonstrate this, I will engage with Brueckner and Fiocco's factivity objection (the "Lincoln" case) and Sorensen's epistemicist reply, before committing to a verdict: we should reject the luminosity of *knowledge*, but we need not reject the luminosity of *feeling*.

  **Distinguishing the Arguments**

  The conflation arises because both arguments invoke a "margin for error" requirement. However, the locus of the margin differs fundamentally.

  In Chapter 4, Williamson argues against the luminosity of a condition $C$ (e.g., feeling cold). He constructs a sorites series from dawn to noon where the subject gradually ceases to feel cold. The argument relies on the premise that if one knows $C$ obtains at time $t_i$, one must be in a position to know $C$ obtains at $t_{i+1}$ (a nearby time), because the internal state is indistinguishable. Since $C$ eventually fails, there must be a point where $C$ obtains but is not known. Here, the margin for error is applied to the *phenomenal condition itself*. The vagueness is in the *feeling*.

  In Chapter 5, Williamson argues against $K\phi \to KK\phi$. This argument does not require a gradual shift in the fact $\phi$. It relies on the claim that knowledge of $\phi$ is "inexact." If I know the time is roughly 3:00 PM, my evidence rules out 4:00 PM but does not rule out 3:01 PM. To know that I know, I would need a margin of error large enough to cover the margin of error of the first-order knowledge. Williamson argues this leads to an infinite regress or a contradiction for inexact knowledge. Here, the margin for error is applied to the *evidence supporting the proposition*, not necessarily to the proposition's truth conditions.

  The crucial distinction is this: Chapter 4 claims you can be in a mental state without knowing it because the *state's boundaries* are fuzzy. Chapter 5 claims you can know a fact without knowing you know it because *knowledge requires safety* and safety compounds. Conflating them assumes that phenomenal states are "inexact" in the same way perceptual estimates of the external world are. This is precisely what is at issue.

  **The Brueckner and Fiocco Objection: Factivity and the Lincoln Case**

  To see why the margin-for-error principle is not as monolithic as Williamson suggests, we must engage with the objection raised by Brueckner and Fiocco (2002). They challenge the reliability condition underpinning Williamson's safety constraints. Their counterexample, often illustrated by the "Lincoln" case, highlights the role of factivity in severing the link between internal similarity and epistemic status.

  Consider a subject, S, who believes Lincoln is President on the morning of April 15, 1865. Lincoln is alive; S's belief is true and justified. S knows Lincoln is President. Now consider a nearby possible world, $w^*$, identical to the actual world except that Lincoln was assassinated one minute earlier. In $w^*$, S still believes Lincoln is President (since the news hasn't traveled), but the belief is false. Therefore, S does not know in $w^*$.

  Williamson's margin-for-error principle suggests that because $w^*$ is so close to the actual world, S's epistemic position in the actual world is compromised. If S cannot distinguish the actual world from $w^*$, and S doesn't know in $w^*$, then S shouldn't count as knowing in the actual world. But this is counterintuitive. In the actual world, Lincoln *is* President. S's belief is factive. The shift in epistemic status is caused entirely by an external fact (Lincoln's death), not by a shift in S's evidence or internal state.

  Brueckner and Fiocco use this to argue that Williamson's reliability condition is too strong. It demands that knowledge be preserved across worlds where the *fact* changes, even if the *evidence* remains constant. Applied to the luminosity argument, this creates a wedge. In Chapter 4, Williamson assumes that because the *phenomenology* changes gradually, the *knowledge* of that phenomenology must fade gradually. But the Lincoln case shows that knowledge can drop out instantly due to factivity, even if the internal state remains stable.

  If we apply this to the feeling-cold case: Suppose "feeling cold" is a luminous state. Williamson argues that because there is a nearby time where I don't feel cold (but can't tell the difference), I don't know I feel cold now. But the Brueckner/Fiocco point suggests that the *factivity* of the mental state might hold firmly in the actual case, regardless of the nearby failure. If "feeling cold" is a present-tense phenomenal fact, its truth is guaranteed by my experience of it. The "nearby world" where I don't feel cold is a world where the *fact* is different. Just as S knows Lincoln is President despite the nearby assassination world, I might know I feel cold despite the nearby time where I cease to feel it. The margin-for-error principle works for external facts (like Lincoln's status) because they are independent of our access. It does not necessarily apply to phenomenal facts, which are constituted by our access.

  **A Second Reply: Sorensen and Epistemicism**

  While Brueckner and Fiocco attack the modal principle, Roy Sorensen (2002) attacks the sorites structure of Chapter 4 directly. Williamson's argument assumes that "feeling cold" is vague, such that there is no sharp boundary between feeling cold and not feeling cold. This forces the conclusion that there is a "penumbral" zone where one feels cold but doesn't know it.

  Sorensen argues that this begs the question against epistemicism. If one accepts that vague predicates have sharp boundaries (even if we cannot locate them), then there is a specific millisecond $t$ where the feeling of cold ceases. At $t-1$, I feel cold and know it. At $t$, I do not feel cold. There is no need for a luminous failure in the penumbra because there is no penumbra in reality, only in our ignorance of the cutoff.

  This reply is unavailable for Chapter 5. The argument against KK does not rely on the vagueness of the proposition known (e.g., "the tree is 5 meters tall"). It relies on the *inexactness of the measurement*. Even if the tree has a precise height, my visual evidence does not pinpoint it precisely. Therefore, Sorensen's objection saves Chapter 4 (Luminosity) without saving Chapter 5 (KK). This further demonstrates that the arguments are distinct: one falls to epistemicism about vagueness; the other stands firm on the limitations of perceptual discrimination.

  **The Verdict**

  So, does Williamson succeed? I commit to the following verdict: **Williamson succeeds in showing that KK fails for inexact knowledge (Chapter 5), but he fails to show that no interesting mental state is luminous (Chapter 4).**

  We should accept the Chapter 5 argument. Knowledge of the external world (and even many internal states treated as objects of judgment) is inexact. It relies on evidence that could easily have been slightly different. Because safety margins compound, $KK$ is not a universal principle. If you know the jar has roughly 500 jellybeans, you do not necessarily know that you know it, because your margin for error on the second-order judgment must be wider than the first, eventually exceeding the range of possibility. This is a robust result that clarifies the limits of introspection regarding *facts*.

  However, we should reject the Chapter 4 argument as a general attack on luminosity. The "feeling cold" case fails because it treats phenomenal states as if they were external objects of perception. As the Brueckner and Fiocco objection highlights, factivity anchors knowledge in the actual world. For core phenomenal states (like feeling pain or feeling cold), the "appearance" is the "reality." There is no gap between the fact and the evidence in the same way there is for Lincoln's presidency or the height of a tree.

  When I feel cold, my evidence is the feeling itself. There is no "nearby world" where I have *this exact feeling* but it isn't a feeling of cold, because the feeling constitutes the fact. Williamson's sorites relies on the idea that the *condition* fades while the *evidence* stays the same. But for luminous states, the evidence *is* the condition. If the condition fades, the evidence fades with it. Therefore, the margin-for-error principle does not generate a gap between the state and the knowledge of the state.

  **Conclusion**

  The departmental habit of conflating Williamson's Chapter 4 and Chapter 5 arguments is philosophically costly. It leads students to believe that refuting KK requires refuting the transparency of experience, or vice versa. By separating them, we see that Williamson's anti-KK argument is a powerful tool for understanding the safety conditions of propositional knowledge, while his anti-luminosity argument overreaches by applying externalist constraints to internalist phenomena.

  For your seminar tomorrow: Push your students to defend the distinction. Ask them if they really believe that "feeling cold" is inexact in the same way "estimating the temperature" is. If they say yes, press them on the Brueckner/Fiocco point: Does the factivity of the experience anchor the knowledge in a way that external facts do not? Williamson is right that we are not luminous gods regarding our *knowledge*, but he is wrong to conclude we are blind to our *feelings*. Keep the arguments separate, and you save the mind from the very skepticism Williamson threatens to impose upon it.
