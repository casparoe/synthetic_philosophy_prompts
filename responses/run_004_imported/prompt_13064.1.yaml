answer: |-
  The glassware was clean, arranged in a geometry of anticipation. Yusuf adjusted the brass clamp, feeling the cool bite of the metal against his thumb. In the silence of the laboratory, the only sound was the low hum of the ventilation, a mechanical breath keeping the air fresh. He did not think of the ventilation as a machine that moved air; he thought of it as an occasion where God created the motion of air in a specific, repeated pattern.

  Yusuf was a natural philosopher of the Third Order, specializing in thermal junctions. His work was not to discover forces, for there were no forces hidden inside things waiting to be unleashed. There was only the Custom (*al-ʿāda*), the unbroken habit of the Creator. His job was to map the sequences. When *this* configuration of glass and fluid is present, and *this* flame is ignited, what follows? Usually, heat. Usually, expansion. Usually, vapor.

  He opened his ledger. The pages were filled with tables of succession. *Condition A followed by Event B.* He dipped his pen. "Day 4,092. Distillation of saline solution. Expectation: Boiling at standard degree."

  He struck the flint. The spark was not a transfer of energy; it was a signal. The flame erupted, yellow and steady. Yusuf watched the fire lick the bottom of the flask. He knew the theory perfectly well, had recited it since childhood: the fire possesses no burning power. The cotton does not burn because of the fire; God creates the blackness and the ash at the moment of contact, out of generosity and habit. If God willed, the fire could cool the water. If God willed, the glass could turn to silk. But God does not will chaos. He wills order. He wills the *ʿāda*.

  Yusuf adjusted the valve. The flame grew brighter. He waited.

  This was the part of the day that always brought the quiet vertigo. In the Newtonian heresies of the ancients, this wait would be passive. The heat would be traveling, invisible particles colliding, a mechanism winding itself forward by necessity. But Yusuf knew the truth. There was no bridge between the flame and the water. There was a gap, a temporal atom of nothingness, and in that gap, the world was recreated anew.

  He watched the liquid. It was still.

  For a heartbeat, the stability of the world felt thin. He remembered the Seventeenth Discussion from his seminars, the words of al-Ghazālī echoing in the back of his mind. *The connection between what is habitually believed to be a cause and what is habitually believed to be an effect is not necessary.* Ibn Rushd had argued that this destroyed science, that it made rational inference impossible. Yusuf looked at his ledger, at the thousands of entries confirming the boiling point of water. Was it inference? Or was it memory?

  He was not predicting a law; he was remembering a promise.

  The first bubble formed. Then another. The water began to churn.

  Yusuf exhaled, a breath he hadn't realized he was holding. The Custom held. The junction was secure. He reached out to touch the thermometer, then paused. His hand hovered over the glass. He could feel the radiating heat on his skin, but he corrected himself: he felt the sensation of heat, which God created alongside the proximity to the flame.

  He recorded the temperature. "Observed: Standard succession confirmed."

  It was mundane. That was the miracle of it. The theologians spoke of *kharq al-ʿāda*, the tearing of the custom, the miracle of the prophet who walks on water or survives the fire. But Yusuf found the unbroken custom more overwhelming. To sustain this illusion of necessity, moment after moment, for every atom in the universe… it required a vigilance so total it made his head spin. Every sunrise was a fresh creation. Every chemical bond was a renewed decree.

  He moved to the next station, preparing a reaction between acid and metal. He poured the liquid. He waited for the fizz.

  Sometimes, in the deep quiet of the lab, he wondered what it would feel like if the Custom shifted. Not a miracle—that was for prophets—but a glitch. A single instance where the acid did not bite. It wouldn't mean the end of the world, necessarily. It would just mean the data required updating. It would mean the Divine Habit had a nuance they hadn't mapped yet. But the fear was not of error; it was of intimacy. To live in a world of laws is to live in a clockwork house. To live in a world of Custom is to live in the hand of a Person.

  The metal fizzed. Hydrogen gas released. The balloon inflated.

  Yusuf capped the vessel. The routine grounded him. The science was robust. They could build engines, cure diseases, map the stars, all by trusting the *ʿāda*. The predictive power was identical to the materialists of old, but the humility was different. When an experiment failed, it was not because the model was wrong about the machinery; it was because the Philosopher had misjudged the Habit. It kept them honest. It kept them watching.

  He cleaned the glassware, wiping away the condensation. The cloth was dry, then wet, then dry again. Each state a creation.

  As he turned off the main gas valve, the flame vanished. Not extinguished, but ceasing to be created. The darkness in the burner was as positive as the light had been. Yusuf hung up his coat and walked to the door. He placed his hand on the latch. He expected the metal to be cool. He expected the door to open. He expected the hallway to be there.

  He pushed. The latch clicked. The door swung wide.

  Yusuf stepped into the corridor, the solid floor supporting his weight. He did not thank the floor. He did not thank the Custom. He simply acknowledged the continuity, the immense, silent generosity of the repetition. He walked toward the exit, trusting, with every step, that the ground would continue to be created beneath his feet.
