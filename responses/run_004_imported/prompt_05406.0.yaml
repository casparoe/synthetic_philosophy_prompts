      *   *Reference:* Mention Kreps et al. (1982) "Gang of Four" model implicitly or explicitly. It's the standard rebuttal to finite horizon cooperation.
      *   *Analogy:* Use the "Chainstore Paradox" or just stick to Centipede. Centipede is the direct fit.

  8.  **Final Polish:**
