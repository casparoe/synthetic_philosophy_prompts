answer: |-
  The recognition that AI alignment research is, in many respects, applied moral philosophy in disguise is one of the most fertile insights for understanding the field's current impasses. Nowhere is this more evident than in the concept of Coherent Extrapolated Volition (CEV). Eliezer Yudkowsky's proposal—that an AI should pursue what humanity *would* want if we knew more, thought faster, and were more the people we wished we were—is structurally isomorphic to the "full-information" or "idealized-preference" accounts of well-being defended by moral philosophers like Richard Brandt and Peter Railton.

  However, by importing this framework, alignment theory has also inadvertently imported its most devastating critique. As philosopher David Sobel and others have argued, idealized-preference accounts suffer from a problem of **normative alienation**. If you idealize a preference-holder sufficiently to strip away ignorance, cognitive bias, and inconsistency, you risk creating a "wise stranger"—an agent whose desires are no longer recognizably those of the original person. CEV inherits this weakness, and the move from individual idealization to interpersonal convergence does not dissolve the problem; it arguably exacerbates it.

  ### The "Wise Stranger" Objection

  To understand the vulnerability of CEV, one must first understand Sobel's critique of Brandt and Railton. In full-information accounts, what is good for an individual is defined by what they would desire if they possessed all relevant facts and reasoned with perfect rationality. Railton, for instance, suggests we look to an "idealized self" who knows the actual circumstances and consequences of available actions.

  Sobel's objection is that there is a limit to how much you can change a person before they cease to be *that* person. Our actual desires are constituted partly by our limitations, our specific histories, and our emotional textures. If I am passionate, impulsive, and locally focused, and my idealized counterpart is coolly rational, omniscient, and cosmically focused, why should I care what *they* want? Their desires may be more "consistent," but they lack **subjective motivational grip**. They are the desires of a different agent—a wise stranger—wearing my name. If I were to meet my fully extrapolated self, I might find them morally repugnant or simply indifferent to the things that give my actual life meaning.

  CEV faces this exact dilemma. Yudkowsky defines CEV as what we would want if we "had grown up farther together" and "resolved much of our internal disagreement." But consider the magnitude of this extrapolation. To resolve internal disagreement and achieve coherence, the extrapolation process must smooth over cognitive dissonance, contradictory values, and factual errors.

  If the AI pursues the volition of this extrapolated humanity, it risks pursuing goals that no living human would endorse. For example, under conditions of "full information" and "clear reasoning," humanity might conclude that individual autonomy is an inefficient heuristic for well-being, or that certain forms of suffering are mathematically necessary for optimal outcomes. If the AI implements these conclusions, it is satisfying the "volition" of a post-human philosophical construct, not the actual people currently alive. The alignment is technically successful (it matches the extrapolated volition) but practically failed (it alienates the humans it was meant to serve).

  ### The Interpersonal Complication

  The crucial divergence between standard moral philosophy and CEV is the scope of idealization. Brandt and Railton are generally concerned with what is good for an *individual* (or how individual rationality aggregates). CEV requires **interpersonal coherence**. It asks not just what *I* would want if I were smarter, but what *humanity* would want if *we* were smarter and agreed with each other.

  Does this interpersonal step offer a way out of Sobel's trap, or does it spring it tighter? There are two ways to view this, but the weight of the argument suggests it makes the problem worse.

  **The Case for Dissolution:**
  One might argue that interpersonal convergence grounds the idealization. While a single individual's extrapolated self might drift into solipsistic or bizarre territory (the "hermit philosopher" problem), the requirement to converge with *others* forces the extrapolated volition to remain anchored in shared human experience. To find agreement, the extrapolation might have to retain common, robust human values (like care for children, aversion to pain) that survive the idealization process. In this view, the "wisdom of the crowd" acts as a ballast against the "wise stranger" drift.

  **The Case for Exacerbation:**
  However, this optimistic view underestimates the difficulty of coherence. It is difficult enough to make one person's values consistent over time. Making billions of people's values consistent with one another requires a far more aggressive extrapolation function.

  Living humans hold incommensurable values. A devout ascetic and a hedonistic artist may both be fully informed and rational, yet their volitions may point in opposite directions. To generate a *coherent* extrapolated volition from these conflicting inputs, the CEV process cannot simply average them; it must transform them into a higher-order framework where they no longer conflict.

  This necessitates a higher degree of abstraction. To make the ascetic and the artist agree, the extrapolation might have to strip away the specific content of their desires (asceticism, art) and retain only abstract structures (e.g., "pursuit of meaning"). But as the values become more abstract to accommodate convergence, they become less recognizably *human*.

  Furthermore, the interpersonal step introduces a **tyranny of extrapolatability**. Some human value systems may extrapolate "smoothly" toward coherence (e.g., utilitarian frameworks), while others may be deeply particularistic and resist extrapolation without dissolving entirely (e.g., deontological constraints based on specific religious revelations). A CEV process seeking coherence might systematically favor the values of those whose worldviews are more amenable to rationalist smoothing, effectively silencing the "unextrapolatable" portions of humanity.

  In this light, the interpersonal step intensifies Sobel's objection. The "wise stranger" is no longer just a smarter version of *you*; it is a diplomatic compromise between a billion smarter versions of everyone else. The resulting agent is not just alien to your current self; it is alien to your *tribe*, your *culture*, and your *species* as it currently exists.

  ### Conclusion

  The resemblance between CEV and full-information accounts is not merely superficial; it is structural. Consequently, CEV inherits the "loss of self" problem identified by Sobel. The promise of alignment—that the AI will do what we *really* want—relies on the assumption that our "real" wants are hidden beneath our errors, waiting to be revealed. But if our identity is partly constituted by those errors, limitations, and disagreements, then revealing the "true" volition may mean erasing the agent who holds it.

  The move to interpersonal convergence does not save CEV from this fate. On the contrary, the requirement for global coherence demands a more radical transformation of human values than individual idealization does. It risks producing a volition that is coherent, rational, and utterly unrecognizable to the humanity it was designed to preserve. For AI alignment to succeed, researchers must grapple with a philosophical question that cannot be solved by code: At what point does improving human volition cease to be alignment and become replacement?
