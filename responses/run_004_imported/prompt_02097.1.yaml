answer: |-
  This is an exceptionally sharp reading of the text. You have put your finger on one of the most famous and contentious cruxes in Nietzsche scholarship. If your character's father was a careful reader, he absolutely would have stumbled here, and his marginalia would likely reflect the struggle to reconcile these two passages.

  To answer your primary question: **No, Nietzsche is not simply contradicting himself in a careless way, but he is deliberately repurposing language that he knows is loaded.** However, scholars are indeed divided on exactly how to square the circle, and that division offers rich material for your character's reconstruction of her father's mind.

  Here is a breakdown of the tension, the scholarly consensus (and dissent), and how this might look in the margins of your novel.

  ### 1. The Philosophical Tension
  You are correct about the conflict.
  *   **Essay 1, Section 13:** Nietzsche attacks the **metaphysical subject**. He argues that the idea of a stable "I" that stands behind actions (like the lightning behind the flash) is a linguistic fiction. We are a multiplicity of drives, affects, and impulses. There is no "being" behind the "doing."
  *   **Essay 2, Section 2:** Nietzsche describes the **sovereign individual**. This figure sounds suspiciously like the substantial subject Nietzsche just debunked: autonomous, possessing a "long will," master of its fate, capable of promising.

  If the "doer" is a fiction in Essay 1, who exactly is making the promise in Essay 2?

  ### 2. How Scholars Resolve It
  There are three main camps in Nietzsche scholarship regarding this tension. Your character's father might have leaned toward one of these, or oscillated between them.

  **A. The Naturalist/Psychological Reading (The most common resolution)**
  Scholars like Brian Leiter or John Richardson argue that Nietzsche isn't denying the *experience* of selfhood, only its *metaphysical substance*.
  *   **The Argument:** When Nietzsche says there is no "doer," he means there is no soul or ego independent of the body and drives. However, a human being can organize their drives into a hierarchy. When the higher drives successfully command the lower drives, the result is a coherent, predictable agency.
  *   **The Sovereign Individual:** This isn't a metaphysical soul; it is a **psychological achievement**. The "sovereign individual" is the one whose drives are so disciplined that they *appear* to have a unified will. They have made themselves "calculable."
  *   **The Fix:** Essay 1 describes the *ontology* (what we are: chaos/drives). Essay 2 describes the *culture/psychology* (what we can become: disciplined order).

  **B. The Historical/Teleological Reading**
  Scholars like Lawrence Hatab or Alexander Nehamas focus on the phrase "ripest fruit."
  *   **The Argument:** The sovereign individual is the end product of the "morality of custom." It is the point where the tree dies. Nietzsche is describing a historical type, not necessarily his own ideal.
  *   **The Irony:** The sovereign individual is "super-moral" because they have outgrown the need for external rules, but they are still defined by that history. Some scholars argue the *Übermensch* (mentioned in *Zarathustra*) is the next step beyond the sovereign individual.
  *   **The Fix:** Nietzsche isn't endorsing the sovereign individual as the final truth of humanity, but as the culmination of the specific historical process he is tracing in the *Genealogy*.

  **C. The Ironical/Critical Reading**
  A more radical reading (championed by some post-structuralists) is that Nietzsche is being ironic about "autonomy."
  *   **The Argument:** Since "autonomous" and "moral" are mutually exclusive (as Nietzsche writes), and since Nietzsche thinks all will is will to power (relational), true autonomy is impossible. The sovereign individual *thinks* they are free, but they are still bound by their own physiology and history.
  *   **The Fix:** The "conscience" the sovereign individual feels is just the internalized voice of the custom they escaped. They haven't escaped the prison; they just became the warden.

  ### 3. The Key Nuance: "Freedom" vs. "Free Will"
  For your novel, the most convincing annotation would hinge on Nietzsche's redefinition of freedom.
  *   Nietzsche hates **"libertarian free will"** (the idea that I could have done otherwise in a metaphysical sense, uncaused). This is the "doer" he attacks in Essay 1.
  *   Nietzsche loves **"freedom as self-mastery"** (the feeling of power when one's drives are aligned). This is the "sovereign" in Essay 2.

  The sovereign individual does not have "free will" in the Christian/Kantian sense. They have a **strong will**. They are not free from causality; they are free from *contradiction*.

  ### 4. Ideas for the Father's Marginalia
  Since your character is reconstructing her father's thinking, the notes should reflect the *process* of grappling with this, not just the solution. Here are a few possibilities for how a thoughtful reader might annotate this crux:

  **Option 1: The Cross-Reference (The Analytical Mind)**
  > *[Next to Essay 2, Sec 2]* "But who promises? See I:13. If there is no 'lightning' apart from the flash, there is no 'will' apart from the willing. Is this 'sovereign' just the dominant drive pretending to be the whole self? A necessary fiction?"

  **Option 2: The Existential Realization (The Emotional Mind)**
  > *[Next to 'ripest fruit']* "Ripest fruit = end of the tree? Is this the goal or the decay? To be 'autonomous' is to be alone. He says 'super-moral'—but isn't this just a harder morality? One I impose on myself? The weight of the promise."

  **Option 3: The Skeptical Pushback (The Critical Mind)**
  > *[Next to 'autonomous and moral are mutually-exclusive']* "Then why call it a 'conscience'? Conscience is the voice of the herd internalized. This 'sovereign' thinks he has escaped, but he is still measuring himself by his ability to bind himself. Still a slave to the concept of obligation."

  ### 5. Recommendation for the Novel
  The most compelling narrative arc for the character would be if her father **saw the tension and didn't fully resolve it.**

  Nietzsche is often intentionally perspectival. He wants the reader to feel the friction between the "no subject" and the "sovereign subject." If the father's notes show him wrestling with whether the "Sovereign Individual" is a liberation or a new kind of cage, it makes him feel more human.

  **Suggested interpretation for the father:**
  He might conclude that the "Sovereign Individual" is a **tragic figure**. To become sovereign, one must violently suppress the chaos of one's own drives (Essay 1's reality) to create the illusion of unity (Essay 2's requirement). The "conscience" is the scar tissue from that self-violence.

  This fits the mood of the *Genealogy*, which is often about suffering, cruelty, and the cost of civilization. It would allow your character to realize that her father saw his own "sovereignty" (perhaps his independence, his stoicism, his ability to keep promises) not as a triumph, but as a costly discipline that isolated him.

  **In short:** You have found a real philosophical problem, not a reading error. Scholars debate it to this day. Use that ambiguity. Let the father's notes ask the question rather than answering it definitively. That is often more true to Nietzsche than any dogmatic solution.
