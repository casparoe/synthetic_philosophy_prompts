  I spent my working life as a physicist (solid-state stuff, nothing weapons-related) and only really got into philosophy after I retired a few years back -- I do one of those OLLI seminars at the university near me now, which is alot of fun even when it makes my head hurt. This month we did a unit on Anscombe and her fight with Oxford over giving Truman an honorary degree, and it kicked off a proper argument between two people in the group, Marcus and Deb, that kept going well past the coffee break. I've been turning it over since and can't decide who actually won which point, so I wrote down the exchange as best I remember it and would like your read.

  (1) Marcus opened by saying Anscombe basically has it right: the target committee picked Hiroshima and Nagasaki partly because they were still intact, so that flattening one would produce a shock big enough to break Japan's will to keep fighting -- which means the civilian dead weren't collateral to some military objective, they were the mechanism, and that's exactly what her double-effect reasoning says you can't wave away as "unintended." (2) Deb agreed that's a fair description of double effect but said the same logic convicts more or less every strategic-bombing campaign of that war, Britain's included, so either the test is too strict to tell us anything useful or Truman isn't specially damned, he's just one more name on a very long list. (3) Marcus said Anscombe would take that bullet happily -- her real target in the pamphlet was the whole style of "necessity" reasoning that lets statesmen excuse this sort of thing, not Truman's reputation specifically -- and added that the "it ended the war faster" defense is shakier than people assume anyway, since there's a decent historical case that it was the Soviet invasion of Manchuria, not the bombs, doing most of the work of pushing Japan toward surrender. (4) Deb said that's a bit unfair to Truman's actual situation in August 1945: whatever historians conclude now with Soviet and Japanese archives open, his government was working off invasion-casualty estimates at the time, not hindsight, so you can accept Anscombe's point about intention and still treat it as a separate question how blameworthy Truman personally was, given what he could have known. (5) Marcus's comeback was that this concedes more than Deb thinks: Anscombe's argument was never that Truman's beliefs about consequences were unreasonable, it's that even a sincere, well-grounded belief that killing innocents as a means will save more lives overall doesn't stop the killing from being murder on her account -- that's the whole point of her going after consequentialism rather than just going after Truman's judgment.

  Could you go through this move by move rather than just declaring an overall winner? For each numbered statement I'd like your verdict on whether it's right, half-right, or missing something -- I'm especially stuck on (2), whether "this convicts everyone" actually damages Anscombe's argument or just shows it has a wide (maybe correct) scope, and on (4), where I can't tell if Deb has found a genuine gap between judging the act and blaming the agent, or is just moving the goalposts. Also say what you think both of them are missing about either Anscombe's actual position or the history, since neither of them raised it at the table. If you don't mind, end with a JSON block scoring each numbered move from -2 (clearly wrong) to 2 (clearly right), like {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>}, then a couple sentences on who's ahead once it's all added up.
