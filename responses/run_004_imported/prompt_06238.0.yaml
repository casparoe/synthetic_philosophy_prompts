answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** Town-Gown Relations Subcommittee (Student Representatives)
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Voter Enfranchisement and Ballot Measure 4B (Housing Construction Moratorium)

  ### Executive Summary

  The Town-Gown Relations Subcommittee has convened to address the procedural and democratic implications of Ballot Measure 4B, which proposes a five-year moratorium on new multi-unit rental construction within a half-mile radius of the university. While the Subcommittee acknowledges the legitimate concerns of permanent residents regarding long-term neighborhood planning, we have identified a critical discrepancy between the population impacted by this measure and the electorate empowered to decide it.

  Students comprise approximately 40% of the city's population and will bear the immediate economic brunt of a supply cap. However, due to ambiguity surrounding "domicile" registration requirements, student voter participation is historically negligible.

  After reviewing three potential pathways—(1) maintaining status quo registration with added comment sessions, (2) proactive clarification of eligibility and facilitated registration for current residents, and (3) a non-binding advisory ballot—**the Student Representatives recommend Option 2: Proactive Clarification of Eligibility and Facilitated Registration.**

  We believe this option best aligns with democratic principles of representation, ensures the legitimacy of the ballot outcome, and addresses housing policy as a shared community concern rather than a zero-sum conflict between transient and permanent residents.

  ### Background and Problem Statement

  Ballot Measure 4B is framed as a protection of "neighborhood character," but functionally operates as a supply constraint on rental housing. The five-year timeline of the moratorium coincides directly with the typical tenure of the university student population. Consequently, students are the primary demographic "affected" by the potential rent inflation and scarcity resulting from this measure.

  Currently, student voter registration is low. This is not solely due to apathy, but due to a chilling effect regarding legal "domicile." Many students believe that registering at their campus address requires an intent to reside in the city indefinitely after graduation. This interpretation creates a barrier to entry for a population that is legally resident for the duration of their enrollment.

  The Subcommittee discussion highlighted three positions:
  1.  **Status Quo:** Maintain current registration interpretation; add public comment sessions.
  2.  **Enfranchisement:** Proactively inform students of their eligibility to register at their campus address for the duration of their residency and streamline the process.
  3.  **Advisory Ballot:** Create a separate, non-binding student tally to be presented alongside official results.

  ### Recommendation

  **We recommend the City Council authorize the City Clerk's office to launch an immediate "Clarification and Facilitation" campaign (Option 2).**

  This recommendation entails:
  1.  **Public Guidance:** Issuing an official clarification that "domicile" for voting purposes includes any resident whose primary home is within city limits for the majority of the year, regardless of post-graduation intent.
  2.  **Targeted Outreach:** Deploying registration materials and support directly through university channels and off-campus housing complexes.
  3.  **Timeline Alignment:** Ensuring this information is disseminated prior to the voter registration deadline for the May election.

  ### Rationale

  **1. Democratic Legitimacy and the "All-Affected" Principle**
  A vote on housing supply is not merely a long-term zoning decision; it is an immediate economic intervention. The "all-affected" principle of democratic theory suggests that those whose interests are materially impacted by a decision should have a say in that decision. Because the moratorium's five-year window directly overlaps with student residency, excluding students from the vote creates a scenario where a minority of the affected population decides the housing conditions for the majority. This risks a crisis of legitimacy for the Council regardless of the vote's outcome.

  **2. Addressing the "Transient Resident" Objection**
  We acknowledge the counter-argument that students, who may not reside in the city long-term, should not dictate policy that permanent residents must live with for decades. This is a valid concern regarding *long-term* stewardship. However, Measure 4B is not a 50-year comprehensive plan; it is a five-year emergency brake.
  *   **Immediate Impact:** The harm of rent spikes is immediate. Students currently living here are subjected to the coercive force of the housing market regulated by this vote.
  *   **Shared Stake:** A stable, affordable housing market is not solely a student interest. It ensures university enrollment stability, which drives the local economy, and prevents the displacement of lower-income permanent residents who also rely on multi-unit stock.
  *   **Non-Zero-Sum:** Enfranchising students does not disenfranchise permanent residents. It expands the electorate to reflect the actual community composition. If permanent residents hold a strong consensus on neighborhood character, their votes will still carry decisive weight, but the outcome will be more representative.

  **3. Rejection of Alternative Options**
  *   **Status Quo (Option 1):** Adding public comment sessions without voting rights relegates students to "petitioners" rather than "constituents." Comment sessions do not carry equal weight to a ballot, effectively creating a two-tiered citizenship.
  *   **Advisory Ballot (Option 3):** A separate "student ballot" is administratively burdensome and symbolically damaging. It suggests that student voices are relevant only as consultation, not as binding authority. This risks deepening town-gown resentment rather than fostering integration.

  ### Implementation Timeline

  To ensure this recommendation is viable for the May ballot, the following timeline is required:

  *   **Week 1 (Immediate):** Council reviews and approves the "Clarification of Domicile" language with City Attorney sign-off.
  *   **Week 2:** City Clerk's office finalizes outreach materials (mailers, digital assets) explicitly stating eligibility criteria for students.
  *   **Week 3:** Council meeting to formally adopt the outreach plan.
  *   **April 1 – April 15:** Intensive registration drive. City staff to host pop-up registration tables at campus hubs and major apartment complexes.
  *   **April 15:** Voter Registration Deadline.
  *   **May:** Election Day.

  ### Conclusion

  The goal of this recommendation is not to tilt the scales in favor of one demographic, but to ensure the scales accurately reflect the community. By clarifying eligibility and removing barriers to registration, the City Council can ensure that Ballot Measure 4B is decided by the full constituency it will impact. This approach upholds the integrity of the election, mitigates the risk of future legal or civic challenges regarding representation, and models a collaborative approach to town-gown governance.

  We urge the Council to adopt this recommendation immediately to meet registration deadlines.

  Respectfully submitted,

  [Your Name] & [Other Student Rep Name]
  Student Representatives, Town-Gown Subcommittee
