      *   **The Puzzle:** Bayesians claim stopping rules don't matter (LP). Frequentists claim stopping rules *must* matter (alpha spending). The user knows the "sampling to a foregone conclusion" objection (Armitage vs. Savage/Birnbaum).
      *   **The Specific Request:** A *mechanistic* answer, not just "LP says so." The user suspects the answer lies in martingales and Ville's inequality (conservation of expected evidence).
      *   **The Core Question:** Why does the Bayesian posterior odds sequence stay bounded (martingale property) while the Frequentist p-value can be driven to significance with probability 1 under optional stopping?
      *   **Desired Output:** A walkthrough with a toy example (coin flips, likelihood ratios) showing the math of the asymmetry.

  2.  **Initial Knowledge Retrieval & Verification:**
      *   *Likelihood Principle:* Yes, $P(\theta | D) \propto P(D | \theta) P(\theta)$. The stopping rule affects $P(D)$, but if it's non-informative about $\theta$, it cancels out in the likelihood ratio.
      *   *Martingale Property:* Under the true hypothesis $H_0$, the likelihood ratio $LR_n = \frac{P(D_n | H_1)}{P(D_n | H_0)}$ is a martingale with expectation 1.
      *   *Ville's Inequality:* For a non-negative martingale $M_n$ starting at 1, $P(\sup_n M_n \geq 1/\alpha) \leq \alpha$. This bounds the probability of ever reaching high evidence against $H_0$ if $H_0$ is true.
      *   *Frequentist P-values:* A p-value is $P(T \geq t_{obs} | H_0)$. Under optional stopping, the distribution of the *minimum* p-value achieved over time is not uniform. It tends toward 0.
      *   *The Asymmetry:* Bayesians track the *ratio* of probabilities (which is a martingale under the null). Frequentists track the *tail probability* of a statistic (which is not a martingale under optional stopping).

  3.  **Structuring the Explanation:**
      *   **Acknowledge and Validate:** Confirm the user's intuition is correct (it *is* about martingales and Ville's inequality).
      *   **The Setup:** Define the toy model (Coin flips, $H_0$ vs. $H_1$).
