      *   Ensure Ville's Inequality is stated correctly. $P(\sup M_t \geq \lambda) \leq E[M_0]/\lambda$. Here $M_0 = 1$, so $P(\sup LR \geq 1/\alpha) \leq \alpha$.
      *   For the Frequentist side, be careful not to say p-values are *always* broken, but that *uncorrected* p-values under optional stopping are broken. The "alpha spending" fixes this by effectively adjusting the threshold $\lambda$ in Ville's inequality context (group sequential designs).
