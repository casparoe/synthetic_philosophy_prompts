answer: |-
  You have correctly identified the mathematical engine under the hood: **the Likelihood Ratio is a martingale under the null hypothesis, whereas the p-value is not.**

  The asymmetry you are looking for arises because the Bayesian metric of evidence (the Likelihood Ratio) has a bounded expectation under the true null, allowing us to apply **Ville's Inequality**. The Frequentist metric (the p-value) is calibrated for a *fixed* sample size; when you make sample size a random variable dependent on the data, you break the calibration, and the random walk nature of the test statistic ensures it will eventually cross any fixed significance boundary with probability 1.

  Here is the mechanistic walkthrough using your requested coin-flip toy model.

  ### 1. The Setup

  Imagine we are flipping a coin with true bias $\theta_{true}$. We are testing two simple hypotheses:
  *   $H_0: \theta = 0.5$ (The coin is fair)
  *   $H_1: \theta = 0.6$ (The coin is biased)

  We flip the coin sequentially, observing data $D_n = (x_1, \dots, x_n)$ where $x_i \in \{H, T\}$.

  ### 2. The Bayesian Mechanism: The Likelihood Ratio Martingale

  The Bayesian updates their belief using the Likelihood Ratio (LR):
  $$ \Lambda_n = \frac{P(D_n | H_1)}{P(D_n | H_0)} $$

  The posterior odds are simply $\text{Odds}_n = \Lambda_n \times \text{Prior Odds}$. To see if an adversary can "peek" until they force a false conclusion, we must ask: **If $H_0$ is actually true, how large can $\Lambda_n$ get?**

  #### The Martingale Property
  Assume $H_0$ is true ($\theta = 0.5$). Consider the expected value of the next likelihood ratio $\Lambda_{n+1}$ given the current data $D_n$.
  $$ E_{H_0}[\Lambda_{n+1} \mid D_n] = \sum_{x_{n+1}} \frac{P(D_n, x_{n+1} | H_1)}{P(D_n, x_{n+1} | H_0)} P(x_{n+1} | D_n, H_0) $$
  Since the flips are independent:
  $$ = \sum_{x_{n+1}} \frac{P(D_n | H_1)P(x_{n+1} | H_1)}{P(D_n | H_0)P(x_{n+1} | H_0)} P(x_{n+1} | H_0) $$
  $$ = \frac{P(D_n | H_1)}{P(D_n | H_0)} \sum_{x_{n+1}} P(x_{n+1} | H_1) $$
  Wait, the sum is over the outcomes weighted by $H_0$'s probabilities, but the numerator has $H_1$'s probabilities. Let's write it out explicitly for a coin flip.
  $$ E_{H_0}[\Lambda_{n+1} \mid D_n] = \Lambda_n \cdot \left( P(H|H_0)\frac{P(H|H_1)}{P(H|H_0)} + P(T|H_0)\frac{P(T|H_1)}{P(T|H_0)} \right) $$
  $$ = \Lambda_n \cdot \left( P(H|H_1) + P(T|H_1) \right) = \Lambda_n \cdot 1 = \Lambda_n $$

  **Result:** Under the true null hypothesis $H_0$, the sequence of Likelihood Ratios $\Lambda_n$ is a **martingale** with expectation $E[\Lambda_0] = 1$.

  #### Ville's Inequality
  This is the measure-theoretic bound that saves the Bayesian. Ville's Inequality states that for a non-negative martingale $M_n$ starting at $M_0 = 1$:
  $$ P\left( \sup_{n \geq 0} M_n \geq \frac{1}{\alpha} \right) \leq \alpha $$

  Apply this to our Likelihood Ratio. If we set a threshold for "conviction" at $\Lambda^* = 20$ (roughly strong evidence), the probability that the LR *ever* reaches 20 during an infinite sequence of peeking, **given $H_0$ is true**, is:
  $$ P(\exists n : \Lambda_n \geq 20 \mid H_0) \leq \frac{1}{20} = 0.05 $$

  **Mechanistic Conclusion:** Even if an adversary peeks after every flip and stops the moment the data favors $H_1$ by a factor of 20, they will only succeed in fooling you 5% of the time in the long run. The "evidence" is conserved in expectation; you cannot manufacture expected evidence for a false hypothesis.

  ### 3. The Frequentist Mechanism: The P-Value Random Walk

  Now look at the standard Frequentist approach. They calculate a test statistic, typically a z-score based on the sample proportion $\hat{p}_n$:
  $$ Z_n = \frac{\hat{p}_n - 0.5}{\sqrt{0.5 \times 0.5 / n}} $$
  The p-value is $p_n = P(Z > Z_n \mid H_0)$.

  #### The Calibration Assumption
  The p-value is valid only if $n$ is fixed *ex ante*. Under that condition, if $H_0$ is true, $p_n \sim \text{Uniform}(0,1)$. Thus $P(p_n < 0.05) = 0.05$.

  #### The Optional Stopping Break
  The adversary uses the rule: "Keep flipping until $p_n < 0.05$, then stop and reject $H_0$."
  This asks for the probability of the union of events:
  $$ P\left( \bigcup_{n=1}^{\infty} \{ p_n < 0.05 \} \;\middle|\; H_0 \right) $$

  Because $\hat{p}_n$ performs a random walk (scaled by $\sqrt{n}$), it satisfies the **Law of the Iterated Logarithm**. The sample proportion $\hat{p}_n$ will oscillate around 0.5 infinitely often, but the confidence interval shrinks as $1/\sqrt{n}$. Eventually, purely due to stochastic fluctuation, the sample path will deviate enough from the mean to cross the $Z=1.96$ boundary.

  In fact, for a simple symmetric random walk (which this approximates), the probability of eventually crossing *any* fixed boundary is **1**.
  $$ P(\exists n : p_n < 0.05 \mid H_0) = 1 $$

  **Mechanistic Conclusion:** By peeking, the Frequentist transforms a 5% error rate into a 100% error rate. The p-value does not track the *ratio* of probabilities (which is a martingale); it tracks the *tail area* of a distribution that assumes a fixed $n$. When $n$ varies, the tail area no longer represents the probability of the event under the null.

  ### 4. Why the Asymmetry Exists

  You asked why the analogous Frequentist quantity lacks the martingale property.

  1.  **Definition of the Metric:**
      *   **Bayesian (LR):** $\frac{P(Data|H_1)}{P(Data|H_0)}$. This compares the *density* of the observed data under two hypotheses. Under $H_0$, the "noise" in the numerator is perfectly canceled by the expectation operation, leaving the expectation constant.
      *   **Frequentist (p-value):** $\int_{T(data)}^{\infty} P(T|H_0) dT$. This integrates over *unobserved, more extreme data*. When you peek, you change the definition of "more extreme." A result that is "extreme" at $n=10$ might be "normal" at $n=100$. By checking repeatedly, you are effectively integrating over the *path* of the experiment, not just the endpoint. The p-value calculation ignores the path volume.

  2.  **Conservation of Expected Evidence:**
      *   For the Bayesian, $E[\text{Posterior}] = \text{Prior}$. You cannot expect to change your mind in a specific direction without evidence. If $H_0$ is true, you cannot systematically expect the LR to rise. It might rise temporarily (a fluctuation), but Ville's inequality bounds the *maximum* height of that fluctuation.
      *   For the Frequentist, the "error rate" is defined over the sampling distribution of the *stopping rule*. If the stopping rule is "stop when significant," the sampling distribution of the *final* statistic is no longer the standard normal; it is the distribution of the *maximum* of a random walk. The standard p-value formula fails to account for this "selection bias" introduced by the stopping rule.

  ### 5. Addressing "Sampling to a Foregone Conclusion"

  Armitage's objection was: *"If stopping rules don't matter, can't I just sample until I prove what I want?"*

  The Bayesian answer is: **"You can try, but the math limits your success rate."**

  If $H_0$ is true:
  *   **Frequentist:** You *will* eventually get $p < 0.05$. (Success rate = 100%)
  *   **Bayesian:** You *might* get $\Lambda > 20$, but the probability of that ever happening is $\leq 1/20$. (Success rate $\leq$ 5%)

  If $H_1$ is true:
  *   **Frequentist:** You will eventually get $p < 0.05$ (Power $\to$ 1).
  *   **Bayesian:** $\Lambda_n \to \infty$ almost surely. (Posterior $\to$ 1).

  The Bayesian is protected because their metric of evidence ($\Lambda$) is intrinsically tied to the truth of the hypotheses via the likelihood function. The Frequentist metric ($p$) is tied to the *design* of the experiment. When the design becomes adaptive (optional stopping), the $p$-value decouples from the long-run error rate unless explicitly corrected (e.g., alpha-spending functions, which essentially manually enforce a Ville-like bound on the Frequentist side).

  ### Summary

  The resolution is not philosophical; it is topological.

  *   **Bayesian:** Tracks a **martingale** (Likelihood Ratio). The maximum of a martingale is bounded in probability (Ville's Inequality). Optional stopping cannot inflate the Type I error beyond the inverse of the evidence threshold.
  *   **Frequentist:** Tracks a **tail probability** conditional on fixed $n$. Under optional stopping, this becomes the minimum of a sequence of dependent uniform variables, which converges to 0. The Type I error inflates to 1.

  The Bayesian pays for this robustness by having to specify $H_1$ explicitly (you can't compute an LR without an alternative). The Frequentist pays by having to specify the stopping rule explicitly (you can't compute a valid $p$ without knowing when you planned to stop). If the Frequentist lies about the stopping rule, their error bounds are void. If the Bayesian lies about the prior or $H_1$, their posterior is garbage, but *optional stopping itself* does not invalidate the calibration of the LR under the null.
