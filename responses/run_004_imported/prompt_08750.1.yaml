          *   Optional Stopping Rule: "Stop when $p_n < 0.05$."
          *   Why it breaks: The event $\{ \exists n : p_n < 0.05 \}$ is the union of events over $n$. For a random walk (which the sum of coin flips is), it will cross any boundary eventually with probability 1 (recurrence).
