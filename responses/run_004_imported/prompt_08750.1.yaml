      *   **The Crucial Difference:** Contrast *expectation* (Bayes) vs. *sampling distribution under a fixed n* (Freq). The Bayesian integrates over parameter space; the Frequentist integrates over sample space *conditional on a fixed design*.
      *   **Addressing "Sampling to a Foregone Conclusion":** Explain that while a Bayesian *can* be fooled, the *cost* (in terms of prior probability mass) limits how often this happens. The Frequentist error rate explodes.
      *   **Caveats/Nuance:** Mention that this assumes the true model is in the support of the prior (or at least $H_0$ is). Mention computational costs or "practical" stopping.

  4.  **Drafting the Content - Step-by-Step:**

      *   *Toy Model:* Coin flips $X_i \in \{H, T\}$.
