answer: |-
  **The View from Before the Coin Flip: A Defense of Updateless Rationality**

  The dispute between you and your friend captures the central fault line in modern decision theory. On one side stands the intuitive, act-based conception of rationality: an agent should maximize expected utility conditional on everything they currently know. On the other stands the policy-based, updateless conception: an agent should act according to the policy that would have maximized expected utility from the standpoint of their prior knowledge, before specific observations were made. Your friend argues that once the coin lands tails, the game is over, and paying is a sunk cost. You argue that rationality is about the algorithm that generates the act, not the act itself, and that updating on the coin toss severs the logical link required to win.

  To adjudicate this, we must look beyond the immediate intuition of the Counterfactual Mugging and examine the structural requirements of a rational agent embedded in a world containing predictors. The verdict must favor the updateless, policy-based approach. While act-based conditioning (Causal or Evidential Decision Theory) aligns with our immediate phenomenological experience of choice, it fails as a normative guide for agents who wish to be successful in environments where their choices are predicted. Rationality is not merely about reacting correctly to the present; it is about being the *kind* of agent that secures the best outcomes.

  ### The Distinction: Conditioning vs. Optimization

  The core distinction lies in how the decision problem is framed temporally and informationally. Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) are "updateful." They prescribe choosing the act $A$ that maximizes expected utility given the agent's current credence function $P$ and evidence $E$. In the Counterfactual Mugging, once you observe the coin is Tails, your evidence $E$ includes "Coin = Tails." Since Omega is a perfect predictor, the probability that the coin was Heads, given that it is Tails, is zero. Therefore, the expected utility of paying is $-\$100$, and the expected utility of refusing is $\$0$. CDT/EDT dictates refusal.

  Updateless Decision Theory (UDT), by contrast, does not condition on the specific observation $E$ when evaluating the choice. Instead, it selects a policy $\pi$ (a mapping from observations to actions) that maximizes expected utility relative to the prior probability distribution, before the observation was made. From the "ex ante" perspective, the coin is 50% Heads and 50% Tails.
  *   If Policy = "Pay if Tails": Expected Value = $(0.5 \times \$10,000) + (0.5 \times -\$100) = \$4,950$.
  *   If Policy = "Refuse if Tails": Expected Value = $(0.5 \times \$0) + (0.5 \times \$0) = \$0$.

  UDT dictates that you should Pay, not because paying changes the past (it doesn't), but because being the *type of agent* that pays is the only way to access the counterfactual reward. The disagreement is not about the physics of the situation; it is about whether rationality evaluates the *act* in isolation or the *source code* that produced the act.

  ### The Dynamic Inconsistency of Act-Based Reasoning

  The weakness of your friend's position becomes stark when we move from the abstract Mugging to Parfit's Hitchhiker, a case that highlights the dynamic inconsistency of updateful reasoning.

  In Parfit's Hitchhiker, you are stranded in a desert. A driver offers a ride to the city, but only if he predicts you will pay him $\$100$ upon arrival. The driver is a perfect predictor. If he predicts you won't pay, he leaves you to die. Suppose he picks you up. You are now safely in the city. Your friend's logic applies perfectly here: You have the ride. The driver's prediction is already made. Paying costs you $\$100$ and gains you nothing causally or evidentially. A CDT/EDT agent in the city will refuse to pay.

  However, a CDT/EDT agent *anticipates* this future refusal. Knowing they will not pay once in the city, the driver predicts this and leaves them in the desert. The updateful agent dies.

  The UDT agent, however, reasons updatelessly. They adopt the policy "Pay if arrived." Because they are committed to this policy even before being picked up, the driver predicts payment, picks them up, and they arrive in the city minus $\$100$. They survive.

  This illustrates the crux of the dispute: **Dynamic Consistency.** An updateful agent is dynamically inconsistent. Their optimal plan at time $T_1$ (before the ride) is to pay at $T_2$. But their optimal act at time $T_2$ (after the ride) is to refuse. Because they cannot bind their future self, their present self is doomed. Your friend argues this is simply the tragedy of the situation. You argue this is a failure of rationality. If a decision theory systematically leads its adherents to die in the desert while updateless agents survive, the defect lies in the theory, not the world.

  ### Resolute vs. Sophisticated Choice

  This modern debate mirrors the older literature on dynamic choice, specifically the distinction between "sophisticated" and "resolute" choice articulated by Edward McClennen and later David Gauthier.

  A **sophisticated chooser** uses backward induction. They look at their future self, predict what that future self will do given future incentives, and act accordingly now. In the Hitchhiker case, the sophisticated chooser realizes, "Once I am in the city, I will have no reason to pay. Therefore, the driver will not pick me up. Therefore, I will die." Sophistication acknowledges the lack of control over the future self but offers no mechanism to fix it. It is the formalization of your friend's view: rationality is local to the moment of choice.

  A **resolute chooser**, conversely, treats a prior plan as binding. They choose a course of action at the outset and adhere to it even when local incentives shift. McClennen argued that resoluteness is necessary for rational cooperation and planning. However, critics often charge resoluteness with irrationality: why should a past preference bind a present agent whose circumstances have changed?

  UDT provides the formal machinery that vindicates resoluteness without appealing to psychological willpower. It argues that the "circumstances" haven't changed in the relevant sense. The relevant circumstance is not "I am now in the city," but "I am an agent facing a decision node." If the agent's algorithm changes behavior based on the node in a way that lowers ex-ante expected value, the algorithm is flawed. Resoluteness is not a psychological hack; it is a logical requirement for optimization across time and counterfactuals.

  ### Weighing the Considerations

  Your friend's strongest objection is the **arbitrariness of the prior**. Why, they ask, should the "view from nowhere" privilege the moment before the coin flip? Why not the view from five minutes later, or the view from before I was born? If rationality is about making the best decision *now*, why defer to a self that knew less?

  The answer is that the "ex ante" perspective is not arbitrary; it is the only vantage point where the agent has **leverage**. In problems involving predictors (Omega, the Hitchhiker driver), the outcome is determined by the correlation between the prediction and the act. That correlation is established before the observation is made. Once you update on the observation (Coin = Tails), you have thrown away the leverage. You are effectively trying to change the output of a function after the input has been processed.

  Furthermore, we must consider **exploitability**. An updateful agent is vulnerable to a form of money pump. An adversary could construct a series of Counterfactual Muggings. The updateful agent will always refuse to pay (since the coin always lands Tails in the actual world they experience), and thus never receives the rewards. They are systematically outcompeted by updateless agents. If rationality is normative—if it is supposed to guide us toward success—then a theory that guarantees lower utility is deficient.

  However, we must concede a point to your friend: Updatelessness feels alien. It requires ignoring relevant evidence (the coin is Tails). It demands a form of "akrasia" where you act against your current conditional preferences. This suggests that if we define rationality as "acting in accordance with one's current strongest reasons," CDT wins. But this is a thin definition. A thicker, more robust definition of rationality is "possessing a decision-making architecture that yields the highest utility."

  ### The Verdict

  I side with you. The updateless, policy-based approach is the superior account of rationality.

  The justification rests on a specific conception of what an agent *is*. Your friend views the agent as a sequence of temporal slices, each optimizing locally. I argue the agent is a **continuant**—a single logical entity extended through time and counterfactual space. When Omega predicts you, Omega is not predicting a temporal slice; Omega is predicting the continuant.

  If you refuse to pay in the Counterfactual Mugging, you are essentially saying, "I wish I were the kind of agent who pays, but I am not." This is an admission of defeat. A rational agent should strive to *be* the kind of agent who wins. In cases like the Mugging and the Hitchhiker, "winning" is causally impossible for an updateful agent because the predictor has already screened off the causal path. The only path to utility is the logical path: ensuring your decision algorithm outputs the value that makes the predictor's favorable prediction true.

  This verdict is qualified: it applies specifically to decision problems where outcomes depend on the *disposition* or *policy* of the agent, typically mediated by prediction or logical correlation (as in Newcomb-like problems). In standard causal environments where no predictor exists, CDT and UDT usually converge. But in the domain of high-stakes strategic interaction and prediction—which is increasingly the domain of AI, economics, and evolutionary biology—the updateless view is indispensable.

  Your friend is correct that paying feels like a loss in the moment. But rationality is not about minimizing regret in the actual world; it is about maximizing expected utility across the possible worlds your actions influence. By refusing to pay, your friend saves $\$100$ in the Tails world but ensures they get $\$0$ in the Heads world. By paying, you lose $\$100$ in the Tails world but secure $\$10,000$ in the Heads world. Since you do not know which world you are in until *after* the decision logic is evaluated by Omega, you must act to win the set.

  To be rational is to be the sort of person who gets picked up in the desert. Sometimes, that requires paying the fare even after the ride is over.
