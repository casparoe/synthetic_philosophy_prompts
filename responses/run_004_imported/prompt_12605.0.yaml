answer: |-
  **MEMORANDUM**

  **TO:** Value-Assessment Committee
  **FROM:** [Your Name], Patient & Community Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Cost-Per-QALY Thresholds for Drug Allocation

  **Purpose**
  Next month, this committee must decide whether to adopt a $150,000 per Quality-Adjusted Life Year (QALY) cutoff as a binding tiebreaker for drug budget allocation. This memo outlines my recommendation to **reject the use of a rigid QALY cutoff as a tiebreaker** and instead adopt a **Multi-Criteria Decision Analysis (MCDA) framework** that incorporates cost-effectiveness data alongside explicit equity and severity weights.

  **Summary of Perspectives**
  In preparing for this vote, I have weighed two compelling, yet conflicting, arguments presented during our public comment period:

  1.  **The Efficiency Argument (Health Economics):** Resources are finite. To maximize the total health of our population, we must prioritize interventions that yield the greatest health return per dollar. Without a standardized metric like QALYs, allocation becomes arbitrary or susceptible to lobbying.
  2.  **The Equity Argument (Disability Rights):** The QALY metric inherently devalues the lives of people with disabilities. By defining "quality of life" relative to a non-disabled baseline, a QALY calculation assumes a year lived with a disability is worth less than a year lived without one. Using this as a tiebreaker systematically disadvantages patients with chronic conditions (such as Ehlers-Danlos Syndrome) whose treatments may improve function or reduce pain without extending life expectancy.

  **Analysis: The "Value Judgment in a Lab Coat"**
  The core disagreement is not merely mathematical; it is philosophical. The health economist is correct that we cannot fund every request; trade-offs are unavoidable. However, the disability advocate is correct that a QALY cutoff hides a profound ethical choice behind a scientific veneer.

  When we calculate a QALY, we are making an *interpersonal comparison of utility*. We are asserting that Person A's gain in mobility is mathematically equivalent to Person B's gain in longevity. There is no neutral, scientific way to verify this. Therefore, adopting a hard cutoff is not a "rational allocation" neutral of values; it is an active policy choice to prioritize efficiency over equity.

  As a hospital system, we have a fiduciary duty to remain solvent (supporting the economist's concern). But we also have an ethical and legal duty to avoid discrimination and serve the most vulnerable (supporting the advocate's concern). A rigid QALY cutoff fulfills the former at the direct expense of the latter.

  **Recommendation**
  I recommend the committee **scraps the proposal to use a $150k/QALY cutoff as a binding tiebreaker.**

  In its place, I propose we adopt a **Multi-Criteria Decision Analysis (MCDA) Framework**. Under this model:

  1.  **Cost-Effectiveness Data Remains an Input:** We will still review cost-per-outcome data (including QALYs or alternative metrics like evLYG) to understand efficiency. This respects the need for fiscal stewardship.
  2.  **No Single Metric Decides:** Cost-effectiveness will be one weighted factor among several. Other mandatory factors must include:
      *   **Severity of Illness:** Prioritizing those with the highest burden of disease.
      *   **Equity Impact:** Explicitly assessing whether approval reduces or exacerbates health disparities for disabled populations.
      *   **Financial Toxicity:** The impact of the drug on the patient's out-of-pocket costs.
  3.  **Deliberative Tiebreaking:** If the budget cannot cover all highly-ranked drugs, the tiebreaker should not be a formula, but a structured committee vote based on the weighted criteria above.

  **Rationale**
  This approach acknowledges the economist's reality (scarcity requires prioritization) without accepting the advocate's fear (that disabled lives are worth less). It makes the value judgments explicit rather than hiding them in an algorithm. It allows us to say, "This drug is less cost-effective, but it serves a population with historically poor access and high severity, so we will fund it."

  **Next Steps**
  I move we form a subcommittee to draft the specific weights for the MCDA framework, ensuring patient representation is included in defining "equity" and "severity," prior to the November vote.

  Respectfully,

  [Your Name]
  Patient & Community Representative
