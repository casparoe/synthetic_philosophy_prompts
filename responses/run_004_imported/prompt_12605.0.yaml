      *   *The Economist's View:* Resources are scarce. We need a metric to maximize total health benefit. QALYs (Quality-Adjusted Life Years) combine length and quality of life. A threshold ($150k/QALY) ensures we don't spend millions for marginal gains. It's utilitarian maximization.
      *   *The Advocate's View:* QALYs inherently devalue disabled lives. If a treatment restores function to a disabled person, the "gain" in quality of life is often calculated as smaller than for a non-disabled person (because the baseline utility weight is lower). This violates the ADA and ethical norms of equal worth. It treats disability as a deficit to be corrected rather than a state of being. The "interpersonal comparison" critique means we can't scientifically say Person A's pain is exactly 0.7 of Person B's pain.
      *   *The User's Position (EDS Patient):* Likely feels the sting of the advocate's argument personally. EDS is often invisible, chronic, and affects quality of life without necessarily shortening life. A strict QALY cutoff might deprioritize treatments that improve daily functioning/pain management over life-extending cancer drugs.

  3.  **Evaluate the Options:**
      *   *Option 1: Adopt as proposed.* Risks alienating the patient seat (user), violates disability equity, potential legal/ethical backlash. Ignores the advocate's valid point.
