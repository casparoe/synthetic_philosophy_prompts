answer: |-
  **Setting:** *A quiet corner of a university faculty lounge, late afternoon. Rain streaks the window overlooking the Maryland campus. **Elena**, a theorist of democratic inclusion, stirs her tea. **Marcus**, a specialist in constitutional design and democratic boundaries, leans back in his chair, holding a copy of Whelan's essay.*

  **Elena:** You read the brief for the city council? They're citing Takoma Park. They want to do this. And they're citing my neighbor's situation—nine years, taxes, civic association, green card. No vote. It's the classic boundary problem made flesh.

  **Marcus:** It is. And Whelan would tell you that the council is asking the wrong question. They're asking, "Who *should* vote?" But they can't answer that without first deciding who gets to ask the question. If you let the current voters decide whether to include non-citizens, you've already assumed the current voters are the only legitimate "people." If you let the non-citizens decide, you've assumed they're already in. There is no democratic procedure to constitute the demos. It's pre-political.

  **Elena:** I grant Whelan's paradox. I even grant that it's likely irresolvable in the abstract. But we live in a world of existing states, not a state of nature. We have to draw the line somewhere. My argument is that the All-Subjected Principle is the least arbitrary line we have. If you are subject to the coercive power of the local government—zoning, schools, policing, taxation—you should have a say in how that power is exercised. My neighbor is subject to that power. Excluding her treats her as a means to the ends of the citizenry, not an end in herself.

  **Marcus:** But notice what you've done. You've solved the Boundary Problem by invoking a principle—coercive subjection. But who defines the scope of "subjection"? Is a commuter who works in the city, uses the roads, and pays sales tax "subjected"? Is a developer who owns three rental properties but lives in Virginia "subjected"? Your principle doesn't tell us where the boundary lies; it just gives us a vocabulary to fight over it. You've relocated the boundary problem, not solved it.

  **Elena:** Fair. But "long-term resident" is a pragmatic heuristic for subjection. It filters out the transient. It captures those whose life prospects are tied to the locality.

  **Marcus:** There's the cut. "Long-term." Why nine years? Why not nine months? Why not exclude anyone who doesn't own property? You're making a judgment call about the *intensity* of subjection. But that judgment call is exactly what the Boundary Problem says is illegitimate without a prior demos. You are essentially saying, "I, Elena, have decided that nine years of residency constitutes sufficient subjection." But on what authority?

  **Elena:** On the authority of moral consistency. If we claim to be a democracy, we cannot permanently rule over a class of people without their consent. Now, turn it around, Marcus. You oppose the measure. You defend the citizenship boundary. But you know as well as I do that citizenship is morally contingent. It's often determined by *jus soli* accident or historical exclusion. Why is the boundary of the nation-state the sacred line for a *municipal* election? If the Boundary Problem is real, why is "citizenship" any less arbitrary than "nine years residency"?

  **Marcus:** I don't claim citizenship is morally sacred. I claim it is functionally necessary. Democracy requires a "we." It requires a group of people who understand themselves as engaged in a common project over time. Citizenship is a technology for stabilizing that "we." It's a pre-commitment device. If we open the franchise to everyone subject to local law, we invite the question: why not everyone affected by local law? And if we go there, the demos becomes potentially global. A zoning decision in Maryland affects housing prices in DC, which affects commuters from West Virginia. The All-Affected Principle explodes the polity.

  **Elena:** I'm not arguing for All-Affected. I'm arguing for All-Subjected. There's a difference. I'm not talking about economic ripple effects. I'm talking about legal coercion. But let's press your "technology" argument. If citizenship is just a tool for stability, what do we do when the tool creates injustice? My neighbor is part of the community in every social sense. She serves on the civic association. She sends kids to school. To tell her, "You are part of the 'we' for taxes and schools, but not for the vote," creates a caste system. Doesn't that undermine the very stability you're trying to protect? A democracy that permanently excludes its permanent residents loses legitimacy.

  **Marcus:** It does. But the remedy isn't necessarily local franchise. It could be federal naturalization reform. By lowering the bar locally, you might inadvertently reduce the pressure to fix the national boundary. But here is my harder question for you, Elena. You say you stop at "long-term resident." What about the undocumented neighbor of your friend? They also pay taxes (often via ITIN), they also send kids to school, they are also subject to the local police. In fact, they are *more* vulnerable to coercion. If the principle is subjection, why do they not get the ballot?

  **Elena:** *[Pauses]* That is the hard case. And I will admit: if I am honest, my hesitation there is pragmatic, not principled. If I say "everyone subject to the law," I must include them. However, there is a distinction regarding legal status. The green card holder has federal permission to remain. The undocumented resident lives under a constant threat of federal removal that makes their local subjection qualitatively different.

  **Marcus:** So you *are* drawing a line based on federal categories. You're piggybacking on the very citizenship/nationality boundary you claim is arbitrary for local purposes.

  **Elena:** I'm piggybacking on the reality of enforcement. But let's not pretend your line is cleaner. You defend the citizenship requirement. But as we said, that line is drawn by history, often by violence or exclusion. If the Boundary Problem means there is no neutral way to decide the demos, then the status quo is just one arbitrary answer frozen in time. Why is *that* arbitrariness better than mine?

  **Marcus:** Because it's an arbitrariness we can live with. Whelan suggests that because the boundary cannot be democratically justified, we must accept it as a fact of history, or decide it by non-democratic means—like a constitutional convention or a legislative act that acknowledges its own foundational nature. The Maryland state legislature, for instance. But for a city council to unilaterally redefine the demos? That assumes the city council represents the *true* people. It's circular.

  **Elena:** But the city council *is* the governing body. If they wait for a metaphysical certainty about who "the people" are, they'll never govern. Politics is the art of the possible, Marcus. The Boundary Problem is a philosophical truth, but it's a political paralysis. If we accept that the problem is irresolvable, doesn't that compel us to err on the side of inclusion? If we can't know for sure where the line *should* be, isn't the safer moral bet to include those who are clearly embedded in the community, rather than exclude them?

  **Marcus:** That's an argument from risk mitigation. But consider the risk on the other side. If the "people" cannot trust that the electorate is stable, they may retreat from democracy entirely. If I know that the rules of membership can change every election cycle based on who shows up, I might stop investing in the common good. Citizenship provides a kind of friction. It says, "To join this project, there is a threshold." It's not about moral worth; it's about mutual commitment.

  **Elena:** But commitment is shown by action, not paperwork. My neighbor has shown commitment. Nine years. Civic association. Taxes. You're valuing the *form* of commitment over the *substance*. And you still haven't answered the relocation charge. You say citizenship stabilizes the boundary. But who decides who is a citizen? The federal government. So you haven't solved the Boundary Problem; you've just outsourced it to a different level of government that is even less responsive to local conditions. You've traded a local boundary problem for a national one.

  **Marcus:** *[Nods slowly]* I concede that. I haven't solved the problem. No one can. Whelan was right: any rule for inclusion is ultimately undemocratic because it precedes the democracy it constitutes. My argument isn't that citizenship is the *true* boundary. It's that it is a *conventional* boundary that allows politics to happen. Without a convention, we are stuck in infinite regress.

  **Elena:** And my argument is that when a convention becomes unjust—when it creates a permanent underclass within the community—the cost of maintaining the convention outweighs the cost of the instability. We have to acknowledge the paradox. We have to say, "We know we cannot logically prove this boundary is correct, but we are drawing it here because exclusion is a greater evil than arbitrariness."

  **Marcus:** So you admit it's arbitrary?

  **Elena:** I admit it's a political decision, not a logical deduction. Just like your defense of citizenship. You aren't defending it because it's logically pure. You're defending it because you fear the instability of redrawing it.

  **Marcus:** Precisely. And you are advocating redrawing it because you fear the injustice of keeping it. We are both standing on the edge of the abyss Whelan described. You want to jump; I want to build a fence.

  **Elena:** But the fence is already hurting people.

  **Marcus:** And jumping might collapse the ground we stand on. But... *[He sighs]* if I accept your premise that the boundary is ultimately a political choice and not a logical truth, then I cannot claim the status quo is naturally ordained. I can only claim it is prudent.

  **Elena:** And if I accept your premise, I cannot claim enfranchisement is a matter of logical right. I can only claim it is a matter of political courage. We both have to admit that the council's vote next week isn't discovering the "true" demos. It's *creating* one.

  **Marcus:** Yes. It's a constitutive act. They are saying, "From this day forward, *this* is who we are."

  **Elena:** And if they say "no," they are saying, "We choose to remain a community that rules over some of its neighbors without their consent."

  **Marcus:** Or they are saying, "We choose to maintain a distinction between national membership and local governance, however flawed, to preserve a coherent chain of sovereignty."

  **Elena:** *[Smiles faintly]* So we agree. The Boundary Problem isn't going away. Whelan wins.

  **Marcus:** Whelan always wins. The question is just how we live with the loss.

  **Elena:** Then I suppose the only thing left to ask is: which loss is harder to live with? The instability of a new boundary, or the injustice of the old one?

  **Marcus:** *[Stands up]* For you, it's the injustice. For me, it's the instability. And neither of us can prove the other wrong, because the proof requires a court we don't have yet.

  **Elena:** No. The proof requires a vote.

  **Marcus:** Indeed. Good luck to your neighbor.

  **Elena:** Thank you, Marcus. I'll need it.
