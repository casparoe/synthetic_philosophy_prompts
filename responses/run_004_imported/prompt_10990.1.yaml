          *   *Analysis:* Good's theorem assumes dynamic consistency (the agent maximizes EU at all nodes). If preferences change over time (e.g., hyperbolic discounting), the current self might prefer *not* to know to prevent the future self from making a "bad" (from current perspective) choice.
