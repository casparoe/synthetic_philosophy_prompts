answer: |-
  Here are 8 interview questions tailored for your podcast. They're designed to be conversational but cut straight to the philosophical and empirical bone, keeping your guest from just lecturing for 40 minutes.

  I've included the specific topics you asked for, plus a few on phenomenology and ethics to round out the conversation.

  ### 1. The Puccetti Distinction
  "Let's start with the history, because I know you want to distance yourself from the old 1970s view. Puccetti famously argued that the surgery didn't *create* two people, it just *unmasked* two people who were already there. Your view is that the fission actually happens during the cut. Why is that distinction so important? If the outcome is the same (two minds acting independently), why does it matter if they were hiding in there all along?"

  *   **Likely Answer:** She'll say Puccetti's view is empirically false (normal brains show too much integration) and metaphysically messy.
  *   **Follow-up:** "So you're saying unity is the default state? If unity is the default, at what exact point in the severing of the fibers does the 'one' become 'two'? Is there a millisecond where it's 1.5 subjects?"

  ### 2. The Cross-Cueing Worry
  "I want to play the skeptical listener for a minute. A common objection is 'cross-cueing.' This is the idea that the hemispheres aren't actually conscious of each other's work, but they're cleverly signaling through the body—like the left hand tapping a rhythm that the verbal left hemisphere interprets. How do we *really* know, in your latest experiments, that the hemispheres aren't just playing a clever game of charades with the rest of the body?"

  *   **Likely Answer:** She'll mention control conditions where tactile or auditory cues are blocked, or response times are too fast for signaling.
  *   **Follow-up:** "But if the body is the shared medium, can we ever fully block the signal? If I can't rule out cross-cueing 100%, does that force us to be agnostic about whether there are truly two subjects, or just two processors?"

  ### 3. Implicit Awareness (The "Something Happened" Studies)
  "There's newer data that complicates the clean 'two minds' picture. You have patients who can't verbally identify an object in the left visual field, but they can point to it, or they show emotional reactions to it. It suggests *some* information is still getting across, or that there's a deeper level of unity. Does this implicit awareness threaten your view? Or do you categorize that as 'subpersonal' processing that doesn't count toward subjecthood?"

  *   **Likely Answer:** She will likely draw a line between "access consciousness" (reportable) and "phenomenal consciousness," or argue that subpersonal integration doesn't imply a single subject.
  *   **Follow-up:** "That's a crucial line. But if 'I' can react to something without 'me' knowing why, isn't that true for intact brains too? If the split-brain patient isn't unique in that regard, does it still prove there are two *selves*, or just two *systems*?"

  ### 4. The Falsification Condition
  "I love this topic, but I try to keep my feet on the ground. I need to ask the hard science question: What evidence would make you abandon the two-subjects view? Is there a specific patient behavior, or a brain scan result, that would force you to say, 'Okay, I was wrong, it's just one mind struggling with a disconnected brain'?"

  *   **Likely Answer:** She might suggest a case where complex, novel reasoning requires simultaneous integration of left and right info without delay.
  *   **Follow-up:** "We've seen patients who can coordinate bimanual tasks (like dressing themselves) quite well after recovery. If they can cooperate that smoothly, does 'cooperation' become indistinguishable from 'unity' in your framework?"

  ### 5. The Phenomenology of the Patient
  "One thing that always trips me up is the patient testimony. When you ask split-brain patients, 'Do you feel like two people?', they almost always say 'No, I feel normal.' They report a unified experience. As a philosopher of mind, how much weight do you give their testimony? Are they lying, mistaken, or is one hemisphere doing all the talking?"

  *   **Likely Answer:** She'll argue the speaking hemisphere (Left) is genuinely unified but ignorant of the Right's experience (the "interpreter" theory).
  *   **Follow-up:** "So the Left is essentially confabulating a unified history? If the Left is unaware of the Right's pain or joy, does the Left have moral responsibility for what the Right hand does?"

  ### 6. Conflict vs. Cooperation
  "We always talk about the 'intermanual conflict' cases—where one hand buttons a shirt and the other unbuttons it. That's the money shot for the two-minds view. But most of the time, the hands *don't* fight. They cooperate. If the two subjects share a body and a survival instinct, wouldn't we expect them to cooperate even if they were distinct? How do you distinguish 'negotiated peace' from 'single will'?"

  *   **Likely Answer:** She'll argue that conflict reveals the underlying metaphysics, while cooperation is just pragmatic alignment of interests.
  *   **Follow-up:** "But if the interests always align because they share a body, does the distinction become practically meaningless? If they never disagree, are they functionally one person?"

  ### 7. The "Switching" Problem
  "Let's talk about attention. In a normal brain, I can focus on my left hand or my right hand at will. In the split-brain, is attention also split? Can the Left Hemisphere 'tune out' the Right Hemisphere's visual field, or are they both always 'on'? I'm trying to picture what the inner life looks like. Is it like two people in a car, or one person with double vision?"

  *   **Likely Answer:** She'll likely describe it as two separate streams of consciousness that don't have access to each other's attentional spotlight.
  *   **Follow-up:** "If they are separate streams, does that mean if the body falls asleep, *two* entities lose consciousness? If the body wakes up, do *two* entities wake up feeling refreshed?"

  ### 8. The Takeaway for the "Unity" Obsessed
  "I fell down a YouTube hole on Sperry because I was obsessed with the idea of my own unity. I like feeling like *one* thing. If your view is right, and the corpus callosum is the glue holding the 'self' together, that's pretty unsettling for the rest of us with intact brains. Should we be worried that our sense of unity is just as fragile as a split-brain patient's? What does your research say about the 'normal' self?"

  *   **Likely Answer:** She'll reassure that intact brains have massive redundancy and integration, so the "one self" is robust, but perhaps more modular than we think.
  *   **Follow-up:** "So the 'self' is more of a coalition than a king? If it's a coalition, does that change how we think about responsibility or guilt in everyday life, even without surgery?"
