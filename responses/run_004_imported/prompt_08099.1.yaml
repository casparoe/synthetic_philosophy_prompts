          *   Trigger: First-year refused prank war ("not the same lab").
      *   **The Argument Flow:**
          1.  Renata: Not the same lab (material/project change).
          2.  Owen: Same lab (causal/organizational continuity).
          3.  Renata: Verbal dispute (different senses of "lab").
