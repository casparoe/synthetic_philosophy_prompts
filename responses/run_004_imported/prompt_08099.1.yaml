          5.  Renata: Vagueness/No fact of the matter (she wins by default).
          6.  Owen: Not a borderline case (extreme turnover), vagueness doesn't apply here.
      *   **Task:** Analyze move-by-move, determine who has the better of it at each stage, focus on the last two moves (verbal/vagueness vs. substantive), and identify anything missed.
      *   **Background Knowledge:** Metaontology (Hirsch, Chalmers), Metaphysics (Identity, Constitution, Vagueness), Phil of Language (Vagueness, Verbal Disputes).

  2.  **Deconstruct the Argument Move-by-Move:**

      *   **Move 1: Renata's Initial Claim (Constitution/Project View).**
          *   *Argument:* Identity depends on people + project. Both changed completely. Therefore, not the same lab.
          *   *Assessment:* Strong intuitive pull (Ship of Theseus). If a football team trades every player and changes sports, is it the same team? Her view aligns with a "constitutive" or "functional" view of social objects.
          *   *Weakness:* Ignores institutional/legal continuity.

      *   **Move 2: Owen's Counter (Causal/Organizational View).**
          *   *Argument:* Identity depends on causal chains, administration, and leadership. PI + Meetings + Notebooks = Continuity.
