          *   Diagnosis: This is **not** Death in Damascus. It's closer to *normal risk* compounded by *apophenia* (seeing patterns in noise).
          *   Priya's comment was theoretically cool but practically irrelevant to the job hunt.
          *   Advice: Don't paralysis-analyze. The "safe" option failing before doesn't mean the universe is counter-predicting you.
