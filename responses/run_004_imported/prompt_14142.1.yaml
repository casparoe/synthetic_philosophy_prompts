  7.  **Final Polish:** Check the flow. Ensure the distinction between "Correlation" (Newcomb) and "Matching" (Damascus) is crystal clear. (Self-correction: In Newcomb's, you also want to match the prediction to get the money. The difference is the *payoff structure*. In Newcomb's, matching yields high utility. In Damascus, matching yields death. Wait, that's not quite right.
      *   *Correction:* In Newcomb's: Prediction is made *before*. Your action doesn't change the prediction, but reflects it.
      *   In Damascus: Prediction is made *before* (Appointment book). Your action doesn't change the book, but reflects it.
      *   *So what's the difference?* The difference is the **goal**. In Newcomb's, you want your action to *correlate* with the state (Money in Box). In Damascus, you want your action to *anti-correlate* with the state (Death's Location).
