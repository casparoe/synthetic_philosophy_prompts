      *   *Philosophical Move:* To close the flicker, we focus on the *moral* choice. The moral choice is "Decide to drive drunk." The physical act is secondary. If the parent prevents the *act*, does the son retain responsibility for the *decision*?
      *   *Better approach:* Stick to the user's prompt. They want the situation *framed* as a Frankfurt case. I will construct the analogy such that the "sign" of intervention is the *intention* to drive (manifested by movement), but since the son didn't form that intention, the intervener remained idle. The "flicker" is closed because the son's ignorance ensures the intervener played no role in his deliberation. The alternative possibility (driving drunk) was illusory, but the *source* of the actual action was internal.

  7.  **Final Polish:**
