prompt: |-
  I'm a software engineer with no formal training in philosophy, but a friend recommended Nick Bostrom's book on anthropic reasoning a couple of years ago, and I've been mildly obsessed with self-locating belief puzzles ever since. I run a small interview podcast on the side for a similarly technical, non-academic audience, and next month's guest is a philosopher who has published in defense of "thirding" in the Sleeping Beauty problem, working in the tradition that runs from Adam Elga's original argument through his published exchange with David Lewis. From what I've read of her work, her favorite move against halfers is to appeal to long-run frequencies: picture running the coin-flip-and-awakening procedure a thousand times and tallying how the awakenings split between heads and tails, and she treats the case for one-third as more or less settled by that picture alone, using it to close down halfer objections fairly quickly.

  I'd like help drafting eight to ten questions that push past that move rather than just letting her repeat it. Specifically, I want one question that presses on why counting individual awakenings, rather than individual coin flips or individual subjects, is the right way to set up that frequency intuition in the first place — especially since this exact question, of which events count as the relevant "trials," is also what makes the debate between the Self-Sampling Assumption and the Self-Indication Assumption, and the Doomsday argument that rides on it, so contentious. I want another question that uses Bostrom's Presumptuous Philosopher scenario to ask whether her style of reasoning commits her to cosmological conclusions most people would find absurd, and one on the "extreme" version of the problem, where tails produces a thousand awakenings instead of two, asking what that case does or doesn't actually show about the ordinary one. I'd also like a question on whether the fact that Beauty ends up placing a different number of bets depending on the outcome undermines the betting argument for thirding that I've seen described, only half-jokingly, as the "why ain't cha rich" argument against halfing — since that argument is presumably her strongest card. For each of these, please add a short, specific follow-up tuned to the answer she's most likely to give, and close out the set with a question about what result, if any, would actually move her toward halfing, or whether she suspects the whole dispute might be merely verbal.
