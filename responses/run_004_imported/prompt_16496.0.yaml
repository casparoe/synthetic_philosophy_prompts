answer: |-
  This is a fantastic question. You've hit on the exact conceptual jump that trips up most people moving from introductory game theory to the stuff used in mechanism design and multi-agent RL. Your intuition is correct: moving from pure to mixed domination *does* import a heavier set of assumptions, and the breakdown in $N>2$ player games is one of the subtlest results in the field (proved by David Pearce in 1984).

  Since you're an engineer, I'm going to skip the philosophy and give you the **system architecture view** of game theory. Think of strategies as APIs, payoffs as latency/throughput metrics, and rationality as an optimization constraint.

  Here is the intuition breakdown.

  ---

  ### 1. Why does mixing make $M$ dominated? (The Convex Hull)

  You asked: *"Why does hedging between two options that each individually lose to $M$ half the time suddenly make $M$ the dominated one?"*

  The best way to visualize this is **geometry**, specifically the **Convex Hull**.

  Imagine the Row Player's payoffs as coordinates in a 2D space.
  *   The X-axis is "Payoff if Column plays L".
  *   The Y-axis is "Payoff if Column plays R".

  Plot your strategies as points:
  *   **T** is at $(4, 0)$.
  *   **B** is at $(0, 4)$.
  *   **M** is at $(1, 1)$.

  Now, draw a line segment connecting **T** and **B**. This line represents every possible mixed strategy between T and B.
  *   50/50 mix is the midpoint $(2, 2)$.
  *   75/25 mix is at $(3, 1)$.
  *   10/90 mix is at $(0.4, 3.6)$.

  **The Intuition:**
  In optimization terms, **T** and **B** define the "efficient frontier" of your strategy space. **M** lies strictly *inside* the region bounded by T, B, and the origin.

  If you are an optimizer trying to maximize payoff, and you have access to a randomization primitive (a coin flip), you can generate any point on that line segment. Since the entire line segment is "higher and to the right" of point **M**, point **M** is simply **inefficient**. It consumes resources (a strategy slot) but returns less value than a weighted combination of other available resources, regardless of the external state (Column's move).

  **The Engineering Analogy:**
  Think of **T** and **B** as two volatile servers.
  *   Server T handles high traffic (L) well but crashes on low traffic (R).
  *   Server B handles low traffic (R) well but crashes on high traffic (L).
  *   Server M is a mediocre server that handles both okay, but poorly.

  If you have a load balancer (the mixed strategy) that routes 50% of requests to T and 50% to B, your *aggregate* system performance is $(2, 2)$. This is strictly better than routing 100% to M $(1, 1)$. Even though T crashes half the time and B crashes half the time, the *portfolio* never crashes as hard as M. $M$ is dominated because it is **sub-optimal resource allocation**.

  ---

  ### 2. The "Stronger Assumption" (Ordinal vs. Cardinal)

  You suspected that mixed strategies import a bigger assumption about rationality. **You are absolutely right.**

  *   **Pure Strategy Domination** only requires **Ordinal Utility**.
      *   I need to know that I prefer $4 > 1$ and $1 > 0$. I don't need to know *how much* more. If we changed payoffs from $(4, 0)$ to $(100, 0)$, the pure domination logic doesn't change.
  *   **Mixed Strategy Domination** requires **Cardinal Utility** (Expected Utility Theory).
      *   It matters that the payoff is $4$ and not $100$.
      *   In your example, the 50/50 mix yields an expected payoff of $2$. This beats $M$'s $1$.
      *   But if we changed $T$'s payoff from $4$ to $1.1$, the 50/50 mix yields $0.55$, which *loses* to $M$.
      *   Therefore, to claim $M$ is dominated, we must assume the player cares about the **magnitude** of the payoff, not just the ranking.

  **Why do we accept this assumption?**
  In backend systems and RL, we assume agents are **Expected Utility Maximizers**. If an agent has access to a random number generator (which software agents always do), failing to use it to smooth out variance and increase expected return is literally a bug in the agent's logic.
  Pure strategy rationality says: "Don't pick a strictly worse option."
  Mixed strategy rationality says: "Don't pick an option when a *probability distribution* over other options yields a higher expected return in every state."

  It treats the player's own randomization device as part of their strategy stack. If you can simulate a "super-strategy" by flipping a coin, and that super-strategy beats your pure strategy, the pure strategy is dead code.

  ---

  ### 3. The $N$-Player Glitch (Rationalizability vs. IEDS)

  This is the hardest part, but also the coolest. Your friend mentioned that Iterated Elimination of Dominated Strategies (IEDS) and **Rationalizability** diverge when there are 3+ players.

  **Definitions:**
  *   **IEDS:** We delete strategies that are never a best response to *any* mixed strategy the opponents might play.
  *   **Rationalizability:** A strategy survives if it is a best response to *some belief* about what opponents play, where that belief is consistent with them also being rational.

  **In 2-Player Games:**
  They are equivalent. Why?
  Because Player 1's "belief" about Player 2 is just a probability distribution over Player 2's strategies. That is mathematically identical to Player 2 playing a mixed strategy.
  *   Belief = Mixed Strategy.
  *   Best Response to Belief = Best Response to Mixed Strategy.
  *   Result: IEDS $\equiv$ Rationalizable.

  **In 3+ Player Games:**
  They diverge. **Rationalizable strategies $\supseteq$ IEDS strategies.**
  Some strategies survive Rationalizability but get eliminated by IEDS. Why? **Correlation.**

  **The Intuition:**
  In IEDS, when Player 1 checks if Player 2's strategy is dominated, Player 1 assumes Player 3 and Player 4 are mixing **independently**.
  *   Player 1 assumes: $P(\text{P3 plays } X \text{ and P4 plays } Y) = P(\text{P3 plays } X) \times P(\text{P4 plays } Y)$.

  In Rationalizability, Player 1 only needs a **belief**. Player 1 is allowed to believe that Player 3 and Player 4's actions are **correlated**, even if they can't talk to each other.
  *   Player 1 believes: "If P3 plays $X$, P4 is likely to play $Y$."

  **The Engineering Analogy (Distributed Systems):**
  Imagine you are Service 1. You depend on Service 2 and Service 3.
  *   **IEDS Assumption:** Service 2 and Service 3 fail independently. Their uptime is a product of individual probabilities.
  *   **Rationalizability Reality:** Service 2 and Service 3 might share a underlying dependency (e.g., the same database cluster, the same network rack). If the DB goes down, *both* fail. Their failures are correlated.

  If you optimize your code assuming independence (IEDS), you might decide a certain retry logic is "dominated" (useless). But if there is correlation (Rationalizability), that retry logic might actually be the best response to a "shared failure mode" belief.

  **Concrete Example:**
  In a 3-player game, Strategy $S$ for Player 1 might be terrible if Players 2 and 3 mix independently. But, Strategy $S$ might be amazing if Player 2 and Player 3 happen to coordinate their actions (correlated belief).
  *   IEDS says: "Since P2 and P3 *must* mix independently in our model, $S$ is dominated. Delete it."
  *   Rationalizability says: "P1 is allowed to *believe* P2 and P3 will correlate (perhaps they share a culture, or a signal). If that belief is consistent with *their* rationality, $S$ is a best response. Keep it."

  Because IEDS forces the **independence assumption** on opponents' mixed strategies, it is more aggressive. It deletes more strategies. Rationalizability is more permissive because it allows for **correlated beliefs** about opponents.

  ### Summary for the Backend Brain

  1.  **Mixed Domination:** It's about **Convexity**. If strategy $M$ lies inside the convex hull of other strategies, it is inefficient. You can construct a "portfolio" of other strategies that outperforms $M$ in every scenario.
  2.  **The Assumption:** It upgrades from **Ordinal** (ranking) to **Cardinal** (magnitude) utility. It assumes the agent can and should use randomization to maximize expected value.
  3.  **The $N$-Player Divergence:** IEDS assumes opponents' randomizations are **independent** (product distribution). Rationalizability allows for **correlated beliefs**. In complex systems (3+ agents), assuming independence when correlation exists leads to over-eliminating viable strategies.

  You weren't missing a math step; you were sensing the shift from simple preference ordering to expected utility optimization, and the shift from independent actors to potentially correlated beliefs. That's a very sharp instinct to have without a philosophy background.
