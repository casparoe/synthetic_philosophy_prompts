prompt: |-
  Last night a friend and I argued for hours about Frankfurt cases and got stuck exactly where the literature does: whether "buffer" cases -- which remove the need for any prior sign before the counterfactual intervener acts -- genuinely escape the dilemma defense, or merely push the same problem back a step. I'm organizing a panel on free will for my university's philosophy society, and one of the invited speakers denies, on Frankfurt-style grounds, that moral responsibility requires the ability to do otherwise. I'd like my questions for her to pick up where my friend and I got stuck rather than have her simply rehearse the standard Jones-and-Black scenario: draft seven or eight questions that press her on this. I want at least one question on whether buffer cases truly dissolve the dilemma defense or just relocate it, one on whether the "flicker of freedom" shows some thin alternative possibility always survives even though it's too flimsy to ground responsibility, and one on how her actual-sequence account of responsibility distinguishes ordinary Frankfurt-style non-intervention from the zygote-style manipulation argument, which has a strikingly similar structure -- and for each, a follow-up keyed to the answer she's most likely to give.
