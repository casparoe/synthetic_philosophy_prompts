prompt: |-
  I write crime novels and brought a heist scene to my writing group last week that sparked a weirdly heated argument. In the scene a five-person crew robs a bank, but the mastermind has lied to two of them about the point of the job -- she told them its a straightforward cash grab, when really she's there to burn a set of documents in the vault and the cash is just cover. Dana said the scene doesn't work as written because you can't really call it "the crew's heist" if two of the five don't even know whats actually happening -- for her, a real joint action means everyone's in on the same plan, not just going through motions someone else understands and they don't. Marcus pushed back, saying that's way too strict: soldiers in a platoon don't know the full battle plan either, and we still say the platoon fought the battle together, not just "the general's battle." Dana said being on a need-to-know basis is completely different from being flat-out lied to about the goal. Marcus answered that the two deceived crew members still know exactly what they're doing -- robbing this bank, right now, together -- and that the lie is only about their personal reason for it, and reasons don't change whether an action counts as joint. Dana wasn't having it: she said if the goal two of them think they're pursuing isn't the real goal at all, then they're not actually party to the real plan, just tools being used by the people who are. It went in circles from there and nobody budged. I can't tell who's actually right here. Can you go through it move by move and say who has the better of it at each point, and whether there's something both of them are missing?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** The user is a crime novelist who presented a heist scene to a writing group.
      *   **The Conflict:** A debate arose between two group members (Dana and Marcus) about whether a heist can be considered a "joint action" or "the crew's heist" if some members are lied to about the true objective.
      *   **The Scene:** 5-person crew. Mastermind lies to 2 members. True goal: Burn documents. Cover story: Steal cash.
      *   **Dana's Position:** It's not a joint action/crew heist if members are lied to about the goal. They are tools, not participants. Need-to-know $\neq$ being lied to.
      *   **Marcus's Position:** It is a joint action. Analogy: Soldiers don't know the full battle plan but still fight the battle together. The physical action is shared; the *reason* doesn't negate the jointness of the *act*.
      *   **Task:** Analyze the debate move-by-move, determine who has the better argument at each stage, and identify what both might be missing.

  2.  **Deconstruct the Arguments (Philosophical/Narrative Lens):**
      *   *Core Issue:* The definition of "Joint Action" or "Collective Agency" in the context of fiction (and reality).
      *   *Dana's Core Claim:* Intentional alignment is necessary for collective agency. If intentions diverge fundamentally (cash vs. documents/destruction), the collective breaks.
      *   *Marcus's Core Claim:* Functional alignment is sufficient for collective agency. If physical actions coordinate towards a shared immediate event (robbing the bank), the collective holds, regardless of hidden motives.
      *   *Philosophical Background:* This touches on Bratman's theory of shared intention vs. simpler coordination theories. It also touches on narrative tension (dramatic irony).

  3.  **Step-by-Step Analysis:**

      *   **Move 1: Dana's Opening Salvo.**
          *   *Claim:* Can't call it "the crew's heist" if 2/5 don't know the point. Real joint action = everyone in on the same plan.
          *   *Evaluation:* Strong on *moral/psychological* cohesion. Weak on *functional* definition. In crime fiction, betrayal is a trope. If betrayal negates "heist," then most heist movies with a twist don't feature a heist.
          *   *Verdict:* Marcus has the better of it here on definition, but Dana has a point on *spirit*.

      *   **Move 2: Marcus's Counter (Soldier Analogy).**
          *   *Claim:* Soldiers don't know the full plan but still fight the battle together.
          *   *Evaluation:* Good analogy for *hierarchy*, but Dana specifically distinguished "need-to-know" from "lied to." Soldiers are usually told "Secure that hill," not "Secure that hill to distract the enemy while we flank" (though sometimes they are). However, soldiers aren't usually told "We are attacking for freedom" when the real goal is "We are attacking for oil."
          *   *Verdict:* Dana has the better of it on the distinction. Being withheld info $\neq$ being given false info.

      *   **Move 3: Dana's Distinction (Need-to-Know vs. Lie).**
          *   *Claim:* Need-to-know is different from being flat-out lied to about the goal.
          *   *Evaluation:* This is her strongest philosophical point. Shared intention requires truth. If I think we are dancing and you think we are fighting, we aren't doing the same thing socially, even if our limbs move similarly.
          *   *Verdict:* Dana wins this round logically.

      *   **Move 4: Marcus's Rebuttal (Reasons vs. Actions).**
          *   *Claim:* They know exactly what they are doing (robbing the bank). Reasons don't change whether an action counts as joint.
          *   *Evaluation:* This is the crux. Is a heist defined by the *physical acts* (entering, disabling alarms, taking boxes) or the *intent* (acquisition vs. destruction)? In law and narrative, intent matters. But functionally, they are acting in concert.
          *   *Verdict:* Split. Marcus wins on *functional description*, Dana wins on *narrative classification*.

      *   **Move 5: Dana's Closing (Tools vs. Party).**
          *   *Claim:* If the goal isn't real, they aren't party to the plan, just tools.
          *   *Evaluation:* This is the "Manipulation Argument." If I move your hand to sign a contract, you didn't sign the contract. If the mastermind moves their actions via deception, are they agents?
          *   *Verdict:* Dana is philosophically tighter here regarding *agency*.

  4.  **Synthesizing the "Missing Piece":**
      *   Both are arguing about *ontology* (what *is* a heist?) when the real question is *narrative utility* (what serves the story?).
      *   Both are ignoring the *audience perspective*. The audience knows (or finds out) the truth. The tension comes from the gap between the crew's perception and reality.
      *   Both are ignoring the *genre convention*. Heist stories *thrive* on the "one person with a secret agenda" trope.
      *   *Resolution:* It *is* the crew's heist functionally, but it *isn't* the crew's heist intentionally. The drama lies in that gap.

  5.  **Drafting the Response:**
      *   *Tone:* Analytical, fair, helpful to a writer.
      *   *Structure:*
          1.  Introduction (acknowledge the fascinating philosophical/narrative puzzle).
          2.  Move-by-Move Breakdown (Dana 1, Marcus 1, Dana 2, Marcus 2, Dana 3).
          3.  The Verdict on "Who is Right" (It depends on definition).
          4.  What They Are Missing (The Narrative/Genre Context).
          5.  Advice for the Writer (How to use this tension).

  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "it's fiction, do what you want." I need to answer the philosophical question they were arguing.
      *   *Nuance:* Marcus's soldier analogy is actually weaker than he thinks because military discipline relies on trust in the *mission*, not just the *task*. If soldiers thought they were doing a peacekeeping mission and found out it was a massacre, they would argue they weren't party to that mission. So Dana's point about the *goal* is strong.
      *   *Nuance:* However, in crime fiction, "The Heist" is often defined by the *event*, not the *motive*. Ocean's 11 is about the money, but if one guy was doing it for revenge, it's still Ocean's 11's heist.
      *   *Key Insight:* The definition of "The Heist" shifts depending on whether you are looking from the *inside* (character perspective) or the *outside* (plot perspective).

  7.  **Final Polish:** Check against the prompt requirements.
      *   Go through move by move? Yes.
      *   Say who has the better of it? Yes.
      *   Say what both are missing? Yes.

  8.  *(Final thought before generating)*: Make sure to emphasize that *both* are right in different contexts, which is why the argument went in circles. They are talking past each other using different definitions of "joint action."

  **(Self-Correction on the Soldier Analogy):** I need to be careful with the soldier analogy. Soldiers *are* often lied to (propaganda, strategic obfuscation). But Dana's point is about the *immediate tactical goal*. If I tell a soldier "Take that bridge to cut supply lines" but the real reason is "To lure the enemy into a kill zone," the soldier is still taking the bridge. If I tell them "Take that bridge for training" and it's actually "To start a war," that's different. In the heist, the physical act is "Open vault." The goal is "Take cash" vs "Burn paper." The physical act is identical. Marcus is stronger on the physical act, Dana is stronger on the *shared intention*.

