answer: |-
  This is a fascinating debate because it isn't just about writing; it's a genuine philosophical puzzle about **collective agency**. Dana and Marcus are arguing past each other because they are using different definitions of what constitutes a "joint action." Dana is arguing from the perspective of *shared intention*, while Marcus is arguing from the perspective of *functional coordination*.

  Here is a move-by-move breakdown of who has the stronger argument at each stage, followed by what both of them are missing.

  ### Move 1: Dana's Opening Salvo
  **Dana:** You can't call it "the crew's heist" if two of five don't know the point. Real joint action means everyone is in on the same plan.
  **Marcus (Implicit):** Disagrees.

  *   **Who has the better of it?** **Marcus.**
  *   **Why:** In the genre of crime fiction, the definition of a "heist" is usually functional, not psychological. If five people coordinate to breach a security system and enter a vault, they have executed a heist together, regardless of their internal motivations. If Dana's definition held true, *Ocean's Eleven* wouldn't be a joint heist because Rusty and Danny have layers of the plan the others don't see until the end. By Dana's logic, almost no ensemble crime thriller features a "crew"; they feature a puppet master and puppets. Marcus is right that the *action* itself is joint, even if the *knowledge* isn't equal.

  ### Move 2: Marcus's Counter (The Soldier Analogy)
  **Marcus:** Soldiers in a platoon don't know the full battle plan, but we still say the platoon fought the battle together.
  **Dana:** Disagrees.

  *   **Who has the better of it?** **Dana.**
  *   **Why:** Marcus's analogy is shaky because of the distinction Dana immediately pounces on. Soldiers operate on a "need-to-know" basis regarding *strategy*, but they are rarely lied to about the *objective*. If a sergeant tells a squad "Secure that building," the goal is to secure the building. If the sergeant told them "Secure that building for a training exercise" when the real goal was "Lure the enemy into a trap to be sacrificed," the squad would rightly feel they were not willing participants in the *real* mission. Marcus conflates *tactical opacity* (not knowing the general's next move) with *strategic deception* (being told you are doing X when you are actually doing Y).

  ### Move 3: Dana's Distinction (Need-to-Know vs. Lie)
  **Dana:** Being on a need-to-know basis is completely different from being flat-out lied to about the goal.
  **Marcus:** Pushes back (see Move 4).

  *   **Who has the better of it?** **Dana.**
  *   **Why:** This is Dana's strongest philosophical point. Shared agency requires a "we-intention." For us to truly do something *together*, we must agree on *what* we are doing. If I think we are dancing and you think we are fighting, we are physically moving together, but we are not socially "dancing together" or "fighting together." If the two crew members think they are stealing money, they intend to commit larceny. If the mastermind intends arson/evidence destruction, their intentions do not overlap. Therefore, they are not parties to the *same* plan; they are parties to *different* plans that happen to overlap physically.

  ### Move 4: Marcus's Rebuttal (Reasons vs. Actions)
  **Marcus:** The deceived crew still know exactly what they're doing (robbing this bank). Reasons don't change whether an action counts as joint.
  **Dana:** Disagrees (see Move 5).

  *   **Who has the better of it?** **It's a Tie (depending on perspective).**
  *   **Why:** Marcus is right about the **external view**. To the police, the security guards, and the audience watching the scene unfold, five people robbed a bank. The physical reality is a joint action. However, Dana is right about the **internal view**. To the characters themselves, the social contract is broken. Marcus is defining the heist by the *event*; Dana is defining the heist by the *agreement*. In a writing group, both definitions matter, which is why neither can concede.

  ### Move 5: Dana's Closing (Tools vs. Party)
  **Dana:** If the goal they think they're pursuing isn't the real goal, they aren't party to the real plan, just tools.
  **Marcus:** No further rebuttal recorded.

  *   **Who has the better of it?** **Dana.**
  *   **Why:** This is the "Manipulation Argument." If I trick you into handing me a box, thinking it contains books, when it actually contains a bomb, you did not help me plant a bomb. You helped me move a box. I used you. In your scene, if the mastermind burns the documents, the two deceived members did not "burn the documents." They "secured the cash." The mastermind used their labor to achieve a goal they did not consent to. Philosophically, Dana is correct: they are instruments of the mastermind's will, not co-authors of the plan.

  ---

  ### The Verdict: Who is Right?

  **Philosophically:** **Dana is right.**
  True joint action requires shared intention. If the end goal is different, the action is not truly shared; it is merely coordinated. The deceived members are accomplices to the *robbery*, but they are not accomplices to the *destruction of evidence*.

  **Genre-Wise:** **Marcus is right.**
  Readers of crime novels do not care about the philosophical purity of collective agency. They care about the *event*. If five people walk in and five people walk out (or get caught), it is a five-person heist. The betrayal is a plot twist, not a reclassification of the event. If you tell a reader, "This wasn't the crew's heist, it was just the mastermind's heist," they will feel you are splitting hairs.

  ### What Both of Them Are Missing

  Both Dana and Marcus are arguing about **ontology** (what *is* the heist?) when they should be arguing about **narrative tension** (what does this *do* to the story?).

  **1. The Audience Perspective (Dramatic Irony)**
  Both are ignoring the most important person in the room: the reader.
  *   If the reader knows the mastermind is lying, the scene is about **suspense**: *When will the crew find out?*
  *   If the reader doesn't know until the end, the scene is about **betrayal**: *We thought they were a team, but they weren't.*
  Whether it counts as a "joint action" matters less than how the deception affects the crew's dynamic later. Dana is worried about the label; Marcus is worried about the logistics. You should be worried about the **consequences**.

  **2. The Definition of "The Job"**
  They are missing that "The Heist" has two layers:
  *   **The Operational Layer:** (Marcus's view) Breaching the vault, disabling lasers, timing the guards. On this layer, it *is* a joint action. All five contribute.
  *   **The Motivational Layer:** (Dana's view) Why are we here? On this layer, the crew is fractured.
  The scene works *because* of this tension, not in spite of it. The argument in your writing group proves the scene is provocative.

  **3. The "Tool" Argument is a Feature, Not a Bug**
  Dana argues that the deceived members are just "tools." In a crime novel, **that is the conflict.**
  If Dana is right, and they are merely tools, that creates a massive problem for the mastermind. Tools break. Tools talk. If those two members find out they were used to burn documents rather than get rich, do they turn on the mastermind? Do they feel violated?
  Marcus thinks the lie doesn't change the action. But in a character-driven story, the lie *completely* changes the action because it changes how the characters feel about what they did *after* the fact.

  ### Advice for Your Scene

  Don't try to resolve their debate in the text. **Lean into the ambiguity.**

  *   **If you want Dana to be right:** Write the aftermath showing the deceived members feeling violated, realizing they were pawns, and perhaps sabotaging the mastermind later. This validates Dana's point that they weren't true partners.
  *   **If you want Marcus to be right:** Write the scene showing the seamless coordination of all five members. Show that their skills are essential to the document burning, proving that even without knowledge, their agency was required. The heist *needed* them, making them partners by necessity.

  **The Fix:**
  The scene works as written. The argument your group had is actually a testament to the complexity of your setup. You can acknowledge both truths in the narrative:
  *"To the cameras, it was a five-person job. To the two men holding the bags, it was a payday. But to the woman with the lighter, it was something else entirely."*

  Let Dana and Marcus keep arguing. It means your scene has enough friction to generate heat.
