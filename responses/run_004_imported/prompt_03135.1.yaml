answer: |-
  This is one of the most famous objections to David Lewis's philosophy, often called the **"Humphrey Objection,"** originally raised by Saul Kripke. Your intuition captures the core of the critique: if Humphrey himself doesn't win in any other world, how can it be *Humphrey* who "could have won"?

  However, Lewis explicitly denies that it follows from his theory that such claims are not true of Humphrey. He argues that ordinary modal claims **are** true of Humphrey, even though their truth conditions involve distinct individuals in other worlds.

  Here is how Lewis defends his view against the charge that modal claims are only "really" about someone else.

  ### 1. Truth Conditions vs. Subject Matter
  Lewis distinguishes between what a sentence is *about* and what makes it *true*.
  *   **Subject Matter:** When we say "Humphrey could have won," the sentence is semantically about the actual Humphrey. He is the subject of the proposition.
  *   **Truth Conditions:** According to Lewis, for this proposition to be true, there must exist a possible world containing a **counterpart** of Humphrey who wins.

  Lewis argues that the fact that the *truth-maker* involves a distinct individual (the counterpart) does not change the fact that the *truth-bearer* (the claim) is about Humphrey. To use an analogy: If I say "I am tall," the truth of this claim depends on my height relative to a comparison class of other people. The truth involves other people, but the claim is still about me. Similarly, for Lewis, Humphrey's modal properties depend on his counterparts, but the properties belong to Humphrey.

  ### 2. The Counterpart Relation as "Relevance"
  The user's objection rests on the idea that the counterpart is "someone else who merely resembles" Humphrey. Lewis argues that the counterpart relation is not *mere* resemblance; it is a specific relation of **similarity in important respects** (such as origin, appearance, or causal history) that anchors the counterpart to Humphrey.

  For Lewis, to ask "What could Humphrey have done?" is to ask "What do the individuals who are relevantly similar to Humphrey (his counterparts) do in other worlds?" Because the counterparts are selected specifically *because* of their relationship to Humphrey, facts about them count as facts about Humphrey's modal profile.

  ### 3. The Temporal Parts Analogy
  Lewis often defends his view by comparing modal realism to **perdurantism** (the view that objects persist through time by having temporal parts).
  *   Consider the claim: "Lewis was bent in 1980 and straight in 2000."
  *   On a temporal parts view, there is no single entity that is both bent and straight. There is a 1980-time-slice (bent) and a 2000-time-slice (straight).
  *   **Objection:** Does it not follow that "Lewis was bent" is not really true of Lewis, but only of a temporal slice?
  *   **Lewis's Reply:** No. We accept that claims about temporal parts are true of the whole person. Why should we not accept that claims about modal parts (counterparts) are true of the actual person?

  Lewis argues that if we accept that distinct temporal segments can ground truths about a single person's history, we should accept that distinct modal segments (counterparts) can ground truths about a single person's possibilities.

  ### 4. Translation, Not Elimination
  Lewis views Counterpart Theory as a **translation** of modal language into non-modal language (the language of quantification over worlds and individuals).
  *   **Ordinary Language:** "Humphrey could have won."
  *   **Lewis's Translation:** "There exists a world $W$ and an individual $x$ in $W$ such that $x$ is a counterpart of Humphrey and $x$ wins in $W$."

  Lewis argues that if the translation is accurate, then the ordinary claim is true if and only if the translated claim is true. Since the translated claim can be true, the ordinary claim is true. He insists he is not *eliminating* Humphrey from the picture; he is explaining what Humphrey's possibilities *consist in*.

  ### 5. Why the Objection Persists (Kripke's Point)
  Despite Lewis's defenses, many philosophers find the objection compelling. Kripke's point was essentially intuitive: when we care about whether *Humphrey* could have won, we care about *him*, not some "qualitatively similar" person in another universe.
  *   If the counterpart differs slightly (e.g., has one extra hair), is it still Humphrey's possibility?
  *   If the counterpart suffers, does Humphrey have reason to care?

  Lewis bites the bullet here. He admits that on his view, Humphrey has no *literal* access to other worlds, and strictly speaking, it is the counterpart who experiences the winning or losing. However, Lewis maintains that this is the metaphysical cost of taking possible worlds seriously as concrete entities. He argues that our intuition that "it must be *me*" relies on a mistaken belief in trans-world identity, which leads to logical paradoxes (like the problem of accidental intrinsics) that Counterpart Theory solves.

  ### Conclusion
  Does it follow that ordinary claims are never really true of the person? **Lewis says no.**
  *   He argues the claims **are** true of the person.
  *   The mechanism of truth involves counterparts, but the **reference** remains fixed on the actual individual.
  *   To deny this, Lewis argues, is to confuse the *analysis* of a property with the *subject* that holds the property.

  However, critics maintain that even if Lewis's logic is consistent, his theory fails to capture the *meaning* of our modal intuitions. We want to know about Humphrey's potential, not a doppelgänger's actuality. Thus, while Lewis denies your conclusion logically, he acknowledges that his theory requires a revision of how we intuitively understand "possibility."
