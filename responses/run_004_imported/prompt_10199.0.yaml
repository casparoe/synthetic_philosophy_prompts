answer: |-
  **Setting:** *A private room in a members' club. The table is green felt, but there are no chips, only ledgers and pens. A biased coin sits in a glass case between them. **Eva** (Expected Value) adjusts her glasses. **Leo** (Logarithmic/ergodic) leans back, watching the coin.*

  **The Bet:** *A single opportunity, repeatable indefinitely. Stake any fraction $f$ of current bankroll $W$. Probability $p=0.6$: Wealth becomes $W(1+f)$. Probability $q=0.4$: Wealth becomes $W(1-f)$. (Note: "Doubling the stake" implies net odds $b=1$).*

  **Eva:** (Writing in her ledger) I'm marking my stake at $f=1$. All in.

  **Leo:** (Calmly) And I'm marking $f=0.2$. Twenty percent.

  **Eva:** You're leaving money on the table, Leo. The expected return on this bet is positive. $0.6 \times 2 + 0.4 \times 0 = 1.2$. For every dollar I stake, I expect to get $1.20 back. If I reinvest everything every round, my expected wealth after $N$ rounds is $W_0 \times (1.2)^N$. Your expected wealth, with your conservative fraction, grows at a slower arithmetic rate. By the definition of rational choice—maximizing expected utility of terminal wealth—I am the rational agent here.

  **Leo:** By the definition of *ensemble* utility, perhaps. You're calculating the average wealth of a billion parallel universes where a billion Evas make this bet. In the vast majority of those universes, you are broke.

  **Eva:** But I don't live in the median universe. I live in the expectation. Rationality isn't about predicting the most likely path; it's about weighting outcomes by their value and probability. If there is a one-in-a-million chance I become a trillionaire, and the cost is small, I take it. Here, the cost is ruin, but the probability of ruin isn't one. It's $0.4^N$.

  **Leo:** As $N$ goes to infinity, $0.4^N$ goes to zero. Ruin becomes certainty. You are describing a process with an absorbing state at zero. Once you hit it, the game stops. You cannot compound on zero. The arithmetic expectation assumes you can borrow from your future selves in the universes where you won to pay for the losses in the universes where you lost. But you are a single trajectory in time. You cannot average across time.

  **Eva:** That's the ergodicity argument, I know. Peters and Gell-Mann. But it rests on a physicalist reduction of economics. Why must I accept the time average as the normative standard? If I have access to capital markets, I *can* create an ensemble. I can sell shares of my betting strategy to a thousand investors. To them, the risk is diversifiable. The arithmetic mean is the correct pricing metric for the market. My personal utility function might be linear in wealth if I'm acting as an agent for that market.

  **Leo:** But you aren't just a pricing node. You're a decision-maker with a lifespan. If you bet 100%, your geometric growth rate is negative infinity. $\lim_{N \to \infty} \frac{1}{N} \ln(W_N/W_0)$. For you, specifically, the wealth vanishes. The Kelly criterion isn't just a utility function preference for log wealth; it's the maximum sustainable growth rate for *any* agent who plans to survive the process. It's the boundary between persistence and extinction.

  **Eva:** Survival is a constraint, not an objective function. If I have a finite horizon, your "sustainable growth" dogma collapses. Suppose I need \$10 million in five rounds to save a project, and I currently have \$1 million. Kelly betting might not get me there with high enough probability. I might need to "bet bold," overshooting Kelly to maximize the probability of hitting the target before the deadline. In a finite world, the asymptotic limit is irrelevant. We die before we reach infinity.

  **Leo:** A fair point on finite horizons. But you're conflating two things. If your utility is truly linear in wealth, you should indeed bet everything. But if your utility is linear, why do you care about the specific \$10 million target? That implies a step-function utility, which is concave near the threshold.
  Furthermore, even with a finite horizon, Kelly minimizes the expected time to reach any given wealth target, asymptotically. If you bet more than Kelly, you increase volatility more than you increase drift. You increase the risk of falling below the target path more than you increase the chance of soaring above it.

  **Eva:** That's only true if the target is very high and the horizon is very long. Look, let's strip the philosophy. The disagreement is axiomatic. You assume the order of operations is: Take the logarithm of wealth, *then* take the expectation. $E[\ln(W)]$. I assume: Take the expectation of wealth, *then* apply utility. $U(E[W])$.
  If I use $U(W) = W$, I maximize $E[W]$. This is consistent with von Neumann-Morgenstern. It satisfies the independence axiom. Your approach violates the independence axiom because the value of a bet depends on the sequence of previous bets (path dependence).

  **Leo:** And that path dependence is the feature, not the bug. The independence axiom holds for additive risks, not multiplicative ones. If I add \$100 to your wealth, the order doesn't matter. If I multiply your wealth by 1.5 or 0.5, the order matters immensely.
  Consider this: If you lose 50% of your bankroll, you need a 100% gain to recover. If you gain 50%, you only lose 33% to go back. The arithmetic mean treats $+50\%$ and $-50\%$ as symmetric around zero. They are not. They are symmetric around the geometric mean. By maximizing arithmetic expectation, you are systematically underweighting the drag of volatility on compounding.

  **Eva:** I'm not underweighting it; I'm pricing it. Volatility drag is real, but it's a cost I'm willing to pay for higher exposure. You call it an "error." I call it a risk premium. If I stake 100%, I accept a 40% chance of ruin in round one. But in the 60% where I survive, I'm double where you are.
  Imagine we do this for one round only. I have \$200 expected value. You have \$102 expected value ($1.2 \times 1 + 0.8 \times 0$ wait, no—your bankroll grows by $1 + 0.2(1) = 1.2$ on win, $1 - 0.2 = 0.8$ on loss. $0.6(1.2) + 0.4(0.8) = 0.72 + 0.32 = 1.04$. My EV is 1.2, yours is 1.04).
  In a one-shot game, I dominate you. Why does repeating the game change the rationality of the first move?

  **Leo:** Because repeating the game changes the *structure* of the payoff. In a one-shot, the ensemble average and time average are identical. You play once, you get one result. The expectation is just a weighted sum.
  But once you commit to reinvestment, you change the topology of the problem. You are no longer summing independent draws; you are multiplying them. The Law of Large Numbers applies to the sum, not the product. For the product, the typical outcome is determined by the geometric mean.
  Your "expected value" of $(1.2)^N$ is driven by an increasingly vanishingly small set of trajectories where you win an anomalously high number of times. The measure of that set goes to zero. You are optimizing for an event that almost surely won't happen to *you*.

  **Eva:** But "almost surely" isn't "surely." And in economics, tail events matter. If that one trajectory where I win 90% of the coin flips yields enough utility to offset the ruin in the other 99% of trajectories, then maximizing expectation is still correct.
  You're smuggling in a specific utility function—logarithmic—and calling it "physics." But why log? Why not square root? If I have diminishing marginal utility of wealth, I should bet less than Kelly. If I have increasing marginal utility (a startup needing to scale to survive), I should bet more. Kelly is only optimal if $\ln(W)$ is my utility. That's a psychological claim, not a physical one.

  **Leo:** It's not psychological. It's about the definition of "rational" in a non-ergodic system. If you maximize $E[W]$ in a multiplicative process, you are effectively choosing a strategy that guarantees your removal from the game. A rational agent, presumably, prefers to remain an agent.
  The log function emerges because it is the only function that converts the multiplicative process into an additive one, making the time average equal to the ensemble average. It's the transformation required to make the system ergodic for the single observer. You don't need to *like* log wealth; you need to use it to measure growth correctly.

  **Eva:** (Pauses, tapping her pen) I concede that for an infinite horizon with no consumption, Kelly dominates in terms of almost-sure convergence. But economics is the study of scarcity and allocation over *finite* lives.
  If I am 90 years old, I don't care about the geometric growth rate. I care about the arithmetic expectation of my estate. I might stake 100%.
  If I am a pension fund with liabilities due next month, I might stake 0%.
  The Kelly fraction is a solution to a specific maximization problem: maximize asymptotic growth rate. It is not a universal law of rationality. It is a tool. You are treating a tool as a moral imperative.

  **Leo:** And you are treating a mathematical artifact—the ensemble average—as a moral imperative. You say you're 90 years old. If you bet 100% and lose, you die with zero. If you bet Kelly, you likely die with a positive sum.
  The disagreement isn't about the math. We agree on the probabilities. We agree on the compounding.
  The disagreement is about what constitutes "value." Is value the average across all possible histories, or is value the history you actually inhabit?
  If you treat the ensemble average as real, you are implicitly assuming you can trade with your parallel selves. Since you can't, the ensemble average is a fiction. It's a map that doesn't match the territory.

  **Eva:** But the ensemble average *is* real for the bookmaker. He takes the other side of my bet. He has a million customers. For him, the Law of Large Numbers works. The risk is diversified.
  If I can sell my risk to him, or to the market, then the ensemble average becomes my reality through pricing. I can hedge. If I can hedge, I don't need to worry about the single trajectory. I can arbitrage the difference between my time average and the market's ensemble average.

  **Leo:** (Smiles) Now we're getting somewhere. If you can hedge perfectly, the risk disappears, and the arbitrage opportunity vanishes. The market price should adjust until the expected return equals the risk-free rate.
  But in this room, there is no market. There is just you, the coin, and time. No hedging. No parallel selves. In this specific, isolated context, the ergodicity break is real.
  So, I'll ask you again: Why stake 100%?

  **Eva:** (Looks at the coin, then at her ledger) Because if I win the first five flips, I have 32 times my bankroll. I can then stop. I can secure the win. My strategy isn't "bet 100% forever." It's "bet 100% until I hit a target, then stop."
  Your Kelly strategy guarantees slow growth. Mine offers a non-zero probability of explosive growth. If my utility function has a threshold—say, I need to escape poverty to have any utility at all—then your "safety" is a trap. It keeps me comfortably poor forever.

  **Leo:** That is the strongest argument for over-betting. Threshold utility. But be careful. If the threshold is high and the horizon is long, over-betting reduces the probability of hitting the threshold. There is an optimal fraction to reach a target $T$ in time $N$, and it's often close to Kelly, not 100%.
  Betting 100% is only optimal if the target is reachable in one step and impossible otherwise.

  **Eva:** Then we agree on the math, but not the norm. You prescribe Kelly as the default for "rationality." I prescribe it as the solution for "unconstrained long-run growth."
  I'll tell you what. I'll bet 100% on the first round. If I win, I'll switch to Kelly for the rest of the night. If I lose, I'll buy you dinner.

  **Leo:** (Extends a hand) And if you win, I'll concede that finite horizons change the normative landscape. But I'm buying the dinner anyway. Because even if you win the first round, you've exposed yourself to unnecessary ruin risk for a gain you could have achieved with lower variance.

  **Eva:** (Shakes hand) Rational agents disagree on the discount rate, Leo. Not just the growth rate.

  **Leo:** Or perhaps we disagree on whether we're betting on a coin, or betting on our ability to stay in the game.

  *Eva flips the coin. It spins, catching the light—a blur of probability. They watch it fall, not to see who is rich, but to see who is still playing.*
