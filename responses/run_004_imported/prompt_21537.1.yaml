answer: |-
  A philosopher gets hired to test a new "smart bomb" that's supposed to have the disposition to explode on impact.

  He drops it from a plane. It hits the ground. Nothing happens.

  The General calls him up: "Why didn't it blow?"

  The Philosopher says, "We need to diagnose the failure. Is it a fink or a mask?"

  The General says, "Speak English."

  The Philosopher says, "Did the bomb lose its explosiveness the exact moment it hit the ground (fink), or is the explosiveness still there but something's blocking the detonator (mask)?"

  The General checks the telemetry. "Detonator's disconnected. It's a mask."

  The Philosopher says, "Okay, connect the wire. The disposition is intact."

  The General asks, "And if it was a fink?"

  The Philosopher says, "Then bury it. You can't wire up a property that vanished on impact."

  The General pauses. "Okay. You're fired."

  The Philosopher says, "Fink or mask?"

  The General says, "Mask. You're still employed, I'm just preventing you from accessing the base."

  The Philosopher says, "Then unlock the gate."

  The General says, "No."

  ***

  **The Swap Test:**
  If you swap the terms in the punchline ("If it's a **fink**, connect the wire. If it's a **mask**, bury it"), the logic breaks:
  *   **Swapped Fink:** If the explosiveness *vanished* on impact (fink), connecting the wire does nothing. The property is gone.
  *   **Swapped Mask:** If the explosiveness is *still there* but blocked (mask), burying it is dangerous and unnecessary; you just need to remove the block.

  The joke only works because the solution depends entirely on whether the property *ceased to exist* (fink) or is just *prevented from manifesting* (mask).
