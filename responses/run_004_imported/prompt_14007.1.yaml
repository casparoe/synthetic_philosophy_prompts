answer: |-
  **Setting:** *A misty bench in the philosophical limbo. Peirce is cleaning his pipe with aggressive precision. James is leaning back, looking relaxed.*

  **Peirce:** You ruined the word, William. "Pragmatism." I had to coin "pragmaticism," ugly as it is, just to keep you out of my laboratory.

  **James:** Charles, don't be sour. I popularized the thing. I made it live. You buried it in logic; I gave it blood.

  **Peirce:** You gave it fever. Let's take a case. Mrs. Gable, 19th century. Consumptive. Drinks a specific herbal tonic her swear-by auntie made. She recovers. Lives forty years. She tells everyone the tonic works. It "works" for her community. It satisfies. By your account, is that belief true?

  **James:** For Mrs. Gable, yes. The belief guided her successfully through life. It gave her hope, which aided recovery, and it coordinated her community. It had cash-value.

  **Peirce:** Then suppose modern chemistry proves the tonic is inert water. Her recovery was spontaneous remission. Is the belief true or false?

  **James:** It *was* true. Truth happens to an idea. It becomes true, is made true by events. For forty years, it worked. Now it doesn't. Truth changes.

  **Peirce:** *[Strikes match]* There is your error. You confuse truth with expediency. If the tonic is inert, the belief was *false* when she held it, even if it felt good. Truth is the opinion fated to be agreed upon by all who investigate. The final opinion says "inert." Therefore, it was always false.

  **James:** But that final opinion is nowhere, Charles. It's in the infinite future. I'm living *now*. If I tell a dying man, "Believe only what the end of inquiry will say," he dies in despair. My truth helps him live. Yours is a regulative ideal that offers no warmth. You've defined truth out of human reach. That's my hit: your truth is useless for the living.

  **Peirce:** *[Pauses]* A fair strike. My definition is not a tool for immediate action; it is a norm for distinguishing belief from mere sentiment. But here is my hit on you: If truth is just what works for the individual, what happens when two beliefs conflict? Suppose the tonic believer meets the doctor. Both feel satisfied. Both think they "work." By your account, both are true. That is a contradiction. Truth must be one.

  **James:** *[Sighs]* I concede that. I cannot have two contradictory truths in the public sphere. "What works" must eventually include coherence with the wider web of experience. If the chemistry contradicts the tonic, the tonic belief loses its cash-value in the long run. I concede that individual satisfaction isn't the whole metric.

  **Peirce:** And I concede this: The "final opinion" is indeed an idealization. We cannot wait for it to judge current claims. We must act on the best available evidence *now*, even if fallible. My account explains what truth *is*, but yours better describes how humans *navigate* toward it.

  **James:** So I own the psychology of belief, and you own the logic of truth?

  **Peirce:** It seems so. You kept the word because it was useful. I kept the concept because it was real.

  **James:** *[Smiles]* Then let's agree: The tonic was false, but believing it was vital.

  **Peirce:** Agreed. But don't call it truth.

  **James:** I'll call it "life." You keep the rest.
