answer: |-
  This is one of the most scrutinized passages in the history of economic and ethical thought. Your suspicion is well-founded: on the surface, Aristotle appears to oscillate between money and demand as the "measure." However, most careful reconstructions suggest he is not contradicting himself but rather distinguishing between the **instrument** of measurement and the **ontological ground** of value.

  Here is a reconstruction of the argument that addresses your two specific questions regarding the consistency of the "measure" and the function of the geometrical apparatus.

  ### 1. Money vs. Demand: Signifier vs. Signified

  You ask whether Aristotle is switching between two candidates for the measure. The most charitable and textually supported reading is that he is distinguishing between the **conventional proxy** (money) and the **substantive reality** (demand).

  *   **Money (*nomisma*) is the Ruler:** When Aristotle says money "measures all things," he is describing its functional role in the marketplace. It is the common denominator that allows a house and a shoe to be expressed in the same numerical terms (e.g., 5 minas vs. 1 mina).
  *   **Demand (*chreia*) is the Length:** When he says demand is the "unit" that "holds all things together," he is explaining *why* money has value. Money is a token; it has no natural value (it is "not by nature but by law"). It only works because it represents the underlying social reality: that people need what others produce.

  **Is this consistent?**
  Yes, provided we accept his distinction between *nomos* (convention) and *physis* (nature). Money is the *nomos* solution to a *physis* problem. The problem is: "How do we equate a house and a shoe?" The natural answer is: "Because humans need both to survive/flourish." The conventional answer is: "We agree to call the house 5 coins and the shoe 1 coin."

  Therefore, Aristotle is not switching measures; he is drilling down.
  1.  **Surface level:** Money measures goods.
  2.  **Deep level:** Demand measures the validity of money.

  **What is "Demand" a unit of?**
  This is the harder question, and here Aristotle is notoriously vague compared to modern economists. He does not offer a quantifiable metric like "labor hours" (Marx) or "utility" (Neoclassicals).
  *   **Demand as Social Necessity:** For Aristotle, demand is not merely subjective desire; it is objective need relative to the *polis*. A house and a shoe are commensurable because both are necessary for the citizen to function in the community.
  *   **The "Unit":** The "unit" of demand is not a fixed quantum (like 1 util). It is a **relational intensity of need** at the moment of exchange. When Aristotle says things are commensurable "with reference to demand," he means they are commensurable *insofar as* the builder's need for shoes matches the shoemaker's need for a house.
  *   **Pre-Money Commensurability:** You ask how they are commensurable *before* pricing. Aristotle's answer is likely that they aren't *precisely* commensurable before agreement. This is why he concludes the passage by saying, "in truth it is impossible that things differing so much should become commensurate." Demand does not provide a perfect mathematical equation; it provides a **sufficient social equivalence** to allow the transaction to happen. The "unit" is the mutual recognition of need that binds the city together.

  ### 2. The Geometrical Apparatus: Ethical Scaffolding or Economic Solution?

  You ask if the "cross-conjunction" and proportion (A:B :: C:D) are doing genuine argumentative work or just dressing up the comparison.

  **The Verdict:** The geometry is doing genuine **ethical** work, but it is **not** solving the economic problem of commensurability.

  **How the Geometry Works:**
  Aristotle sets up the proportion to ensure **reciprocity**, not just equality.
  *   Let A = Builder, B = Shoemaker.
  *   Let C = House, D = Shoes.
  *   **Cross-Conjunction:** A gives C to B; B gives D to A.
  *   **The Proportion:** The ratio of the goods exchanged must reflect the ratio of the producers. If the Builder is socially "worth" twice the Shoemaker (due to skill, status, or cost of training), then the House must be worth twice the quantity of Shoes.

  **Does this secure commensurability?**
  No. The geometry *presupposes* commensurability. You cannot establish the ratio A:B (Builder to Shoemaker) unless you already have a way to compare their social worth. You cannot establish C:D (House to Shoes) unless you already have a way to compare the goods.
  *   **The Geometry's Function:** It ensures that the exchange does not disrupt the social hierarchy. It prevents the Builder from being impoverished or the Shoemaker from being exploited *relative to their status*. It is a formula for **justice**, not a formula for **price**.
  *   **Is it "Dressing Up"?** In a modern economic sense, yes, it is decorative. It adds no computational power to determine price. However, in Aristotle's ethical framework, it is essential. It demonstrates that exchange is not merely about things (C and D); it is about people (A and B). The "commensurability" of goods is derivative of the "commensurability" of citizens within the polis.

  ### Summary of the Reconstruction

  Aristotle's argument can be reconstructed in three steps, which resolves the apparent inconsistency:

  1.  **The Problem:** Exchange requires equality (justice), but goods (houses/shoes) are naturally unequal and incommensurable.
  2.  **The Mechanism (Geometry):** To maintain justice, the ratio of goods exchanged must equal the ratio of the producers' social worth. This ensures reciprocity.
  3.  **The Metric (Money/Demand):** To make the ratio calculable, we need a common measure.
      *   *Conventionally,* we use **Money**. It acts as the intermediate ruler.
      *   *Ultimately,* the truth of that measure is **Demand**. Money works only because it represents the mutual need that holds the city together.

  **Addressing your specific doubts:**
  *   **Is he switching measures?** No. He is distinguishing the *token* (money) from the *substance* (demand).
  *   **What is the unit of demand?** It is not a fixed metric. It is the "sufficient" equivalence of need required to sustain social cohesion. Aristotle admits this is not mathematically precise ("in truth it is impossible").
  *   **Is the geometry doing work?** It is doing the work of defining *justice*, not the work of defining *value*. It shows us what a fair exchange looks like structurally, even if it doesn't tell us how to calculate the numbers.

  **Conclusion:**
  Aristotle is not failing to notice a contradiction between money and demand; he is offering a sophisticated critique of money. He is arguing that money is a social technology (*nomisma*) invented to solve the problem of measuring human need (*chreia*). The geometrical apparatus is not an economic algorithm but an ethical diagram, illustrating that fair exchange is about maintaining the proportional bond between citizens, not just balancing ledgers. The "inconsistency" you sense is actually Aristotle acknowledging the gap between the messy reality of human need and the clean lines of mathematical proportion.
