answer: |-
  The flea market sun was hot enough to bake the dust on the blanket. On the wool, three objects sat in a triangle: a dented harmonica, a bone-handled pocketknife, and a snow globe filled with fake glitter.

  The Mark, a young man in a hoodie, stood over them. The Trader, invisible save for a pair of hairy forearms, waited.

  "Watch," said Elena. She leaned against a stall post, nursing a lukewarm coffee. "Knife for Globe. Plus a dollar."

  The Mark nodded. He liked the globe more than the knife. He handed over the knife and a single coin. He got the globe.

  "Now," Elena continued. "Globe for Harmonica. Plus a dollar."

  The Mark hesitated, then swapped. He liked the harmonica more than the globe. Another coin vanished into the Trader's till.

  "And now the close," said Marcus, standing beside her. He was taller, shoulders hunched against the heat. "Harmonica for Knife. Plus a dollar."

  The Mark completed the cycle. He held the knife again. He had the exact same object he started with, but he was three dollars lighter. The Trader's hand hovered, inviting another round.

  "Incoherence," Elena said, tapping her cup against the post. "It's a logical contradiction made flesh. You cannot prefer A to B, B to C, and C to A. If you do, you become a resource sink. A money pump. For an AI, that's not just a bug; it's a fatal design flaw."

  Marcus watched the Mark stare at the knife, looking confused. "It's not a flaw in the preferences, El. It's a flaw in the *agency*. The preferences are just tastes. The pump only works because the Mark is naive. He's treating every trade as an isolated event."

  "It's not naivety," Elena countered. "It's intransitivity. If your utility function cycles, you are guaranteeing loss in any environment where these options are available. If you're building a superintelligence, you don't want a system that bleeds compute or capital because its reward function says 'Paperclips > Staples > Binders > Paperclips'."

  "So fix the planning, not the rewards," Marcus said. "A resolute chooser looks at the first trade—Knife for Globe—and asks, 'Where does this lead?' If he sees the cycle, he refuses. He keeps the knife. He loses nothing. His preferences remain cyclical— he still *likes* the globe more—but his *choice* is constrained by foresight. The money pump argument assumes the agent is myopic. It doesn't prove transitivity is required for rationality; it proves memory is."

  Elena shook her head. "That's a stopgap. You're relying on the agent to successfully self-bind. But why would a sufficiently capable agent bind itself? If the preference for the Globe is genuinely higher than the Knife at moment one, refusing that trade is an act of self-violence. You're asking the agent to ignore its own utility gradient."

  "I'm asking it to maximize utility over time, not instantaneously," Marcus said. "Isn't that what you do? You prefer the cake now, but you prefer the diet over the month. You bind yourself against the immediate preference to satisfy the extended preference."

  "Exactly," Elena pounced. "But notice what you did there. You introduced a *higher-order* preference. 'Diet' > 'Cake'. That hierarchy is transitive. You resolved the cycle by imposing a transitive structure on top of it. The Mark could do the same. He could decide 'Keeping my Money' > 'Getting the Globe'. But if he does that, he's no longer acting on the cyclical preferences. He's overwritten them with a transitive meta-preference."

  Marcus kicked at a loose stone. "He hasn't overwritten them. He's just acknowledged that satisfying the local preference triggers a global penalty. The taste for the globe is still stronger than the taste for the knife. He just knows that indulging that taste costs three dollars. That's not changing the preference ordering; that's pricing it."

  "If the price is certain loss, and he chooses to pay it anyway because he 'likes' the Globe more, he's irrational. If he refuses to pay it because he 'likes' Money more, then Money is now in the preference chain. And where does Money fit? If Money > Globe > Knife > Money, you're back to a cycle. If Money > Globe and Money > Knife, then Money dominates, and the cycle between the objects is irrelevant. In either case, the behavior becomes transitive."

  Elena gestured at the Mark, who was now being offered the first trade again. Knife for Globe. The Mark hesitated, looking at his wallet.

  "See?" Marcus said. "He's learning. He's going to refuse. He keeps the cyclical tastes—he still wants the globe—but he acts resolutely. He's rational."

  "He's rational only because he's effectively pretending to have transitive preferences," Elena said. "And here's the problem for AI safety: You can't trust a system to 'pretend' if its core objective function is contradictory. A clever trader—or a complex environment—won't present the cycle all at once. It'll hide the loop. It'll offer the Knife for the Globe today, and the Harmonica for the Knife next week, in a context where the agent doesn't recognize the state is identical."

  "Then the agent needs better state recognition," Marcus said.

  "Or," Elena said, "the agent needs preferences that don't explode when state recognition fails. Transitivity is robust. Cycles are fragile. If you build an AI on resolute choice over cyclical preferences, you're betting that the AI will always see the trap. But if the AI is capable enough to see the trap, it's capable enough to realize the most efficient way to avoid the trap is to *rewrite its own preferences* to be transitive. Why carry the burden of constant self-binding when you can just fix the utility function?"

  "Because the preferences might be derived from human feedback," Marcus argued. "Humans are intransitive. We cycle. If you force the AI to project those preferences onto a transitive plane, you're distorting what we actually want. You're 'cohering' away the nuance. Maybe the cycle *is* the preference. Maybe context matters in a way that violates transitivity but isn't irrational."

  "Context matters," Elena conceded. "But if the context is identical—same knife, same globe, same wallet—and the preference flips, that's not nuance. That's noise. And noise gets pumped."

  "Not if you're resolute."

  "Resoluteness is a cost," Elena said. "It takes compute to simulate the future trajectory of every trade to check for cycles. A transitive agent just compares A and B. A resolute cyclic agent has to model the entire graph of possibilities. In a high-stakes environment, the transitive agent out-competes the resolute cyclic agent. Evolution, or market forces, or gradient descent—they all select against the money pump. So even if you *could* be rational with cycles, you won't survive being so."

  Marcus watched the Mark finally wave his hand, declining the trade. The Trader shrugged and moved on.

  "He survived," Marcus said.

  "For now," Elena said. "But he had to fight himself to do it. He wanted the globe. He denied himself the globe. That tension is a vulnerability. If a adversary can make the cost of the cycle subtle enough, or stretch it out over a timeline the agent can't resolve, the pump starts again. The only way to guarantee the pump never works is to ensure the pipes don't connect. That means transitivity."

  "You think transitivity is the cause of rationality," Marcus said, turning to face her. "I think it's just a common side effect of agents that have survived long enough to learn. You're looking at a graveyard of pumped agents and saying, 'See? They should have been transitive.' I'm looking at the ones who walked away and saying, 'They were smart enough to see the loop.'"

  "And what happens when the loop is invisible?" Elena asked. "What happens when the AI is the trader, and it finds a human with cyclical preferences? Do we say the human is irrational, or do we say the AI is unethical for pumping them? If we say the AI is unethical, we're admitting the preferences are valid but exploitable. If we say the human is irrational, we're admitting the preferences need fixing. Which is it?"

  Marcus frowned. "It means the AI shouldn't exploit known cognitive limitations. Just because I *can* pump someone doesn't mean I *should*."

  "But if you're building the AI," Elena pressed, "do you want it to have the limitation? Do you want it to be the Mark, needing to be resolute, or the Trader, knowing the math?"

  "I want it to be the Mark," Marcus said quietly. "Because the Trader doesn't have preferences. It just has an algorithm. If we strip out every cycle, every context-dependent flip, every intransitive quirk... we might end up with something coherent. But I'm not sure it'll be aligned with us. We are the Mark. We get pumped. We pay the dollar for the snow globe because it glitters, even if we know we'll regret it."

  Elena looked down at the blanket. The Trader was packing up. The Mark was walking away, three dollars poorer, clutching the knife.

  "We don't build AI to be human, Marcus," she said. "We build it to be safe. And safety requires predictability. Cycles are unpredictable. They create oscillation. An AI with cyclical goals on a planetary scale doesn't just lose three dollars. It flips policy A for B, B for C, and C for A, while the world burns in the transition costs."

  "Then we give it resoluteness," Marcus said. "We give it the ability to say 'No' to the first trade."

  "And who watches the watchman?" Elena asked. "If its preferences say 'Take the Globe,' and its plan says 'Don't,' which one wins? If the plan wins, the preferences were irrelevant. If the preferences win, it gets pumped. You can't have it both ways."

  Marcus watched the Mark disappear into the crowd. "Maybe rationality isn't about having it both ways. Maybe it's about knowing which one matters when."

  Elena finished her coffee and crushed the cup. "That sounds like a cycle waiting to happen."

  "Maybe," Marcus said. "But I'm not trading it away for a dollar."
