  2.  **Deconstruct Ramsey's 1928 Paper:**
      *   *The Problem:* Maximizing $\int_0^\infty U(c_t) dt$. If $U(c_t)$ stays positive, this goes to infinity. You can't compare infinities easily.
      *   *Ramsey's Solution (Section I):* Introduce $B$ (Bliss), the maximum possible utility rate. Maximize $\int_0^\infty (B - U(c_t)) dt$. This represents the "total regret" or "shortfall." If the economy converges to Bliss fast enough, this integral converges.
      *   *The Ethical Claim:* $\rho = 0$ (pure time preference is zero). Why? Because future people matter just as much.
      *   *The "Section II" Twist:* Ramsey acknowledges that in practice, we might need a discount rate. Why? Not because future welfare matters less, but because of *probability of extinction* or *changing circumstances*.
      *   *The "Bliss" vs. Discounting:* Does Bliss act like discounting?
          *   Discounting: $e^{-\rho t} U(c_t)$. Weight declines exponentially with time.
          *   Bliss: $(B - U(c_t))$. Weight is constant over time, but the *value* being measured is distance from a ceiling.
          *   *Key Insight:* Bliss does *not* discount the future. It makes the sum finite without devaluing future utility relative to present utility. It treats a unit of shortfall today the same as a unit of shortfall in 1000 years.

  3.  **Address the Specific Questions:**

      *   **Q1: Is Bliss just a technical patch or functional discounting?**
