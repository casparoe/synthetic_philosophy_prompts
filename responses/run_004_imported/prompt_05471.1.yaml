answer: |-
  The dawn light over Oakhaven was the color of bruised iron. Elias stood on the dock beside the *Gullwing*, his hand resting on the cold railing. His left shoulder throbbed, a deep, dull ache that had woken him an hour before the alarm. It was an old break, set wrong twenty years ago, and it sang like a tuning fork whenever the pressure dropped. Beside him, the glass barometer nailed to the pilings had fallen three millibars since midnight.

  The water in the harbor was flat, unnervingly so, but the sky past the headland was a smear of charcoal.

  Elias watched the *Kestrel* pull away from the dock. That was Jory. Jory was young, eager, and heavily leveraged on his new engine. He waved as he passed, throttle open, heading for the deep water past the rocks.

  "Too early," Elias muttered to himself. He checked the glass again. Still falling.

  Then the *Sarah Jane* followed. Then the *Two Brothers*. Three boats now, cutting white wakes into the gray swell, heading toward the same patch of horizon.

  Elias gripped the railing. His private evidence was screaming *stay*. The ache in his bone was specific; it wasn't the general stiffness of dampness, it was the sharp pinch of a gale. But the harbor was emptying. He looked at the three hulls diminishing against the headland. Jory was reckless, but the captain of the *Sarah Jane* was cautious. She wouldn't risk her crew unless she saw something. Maybe the cloud cover was thinner out there. Maybe the wind shear was different past the breakwater.

  They saw what he saw—the gray sky, the dropping glass—but they had gone anyway. Therefore, they must know something he didn't.

  The weight of their decision pressed heavier than the ache in his shoulder. If he stayed, and they came back heavy with cod, he would look foolish. If he stayed, and they sank, well, that was a different calculation, but right now, the probability seemed to tilt toward profit. Three rational actors couldn't all be wrong about the same thing. Their actions were data, and the data said *go*.

  Elias reached for the ignition key. The metal was cold. He slid it into the slot. It was rational to trust the crowd. His own signal was noisy; pain was subjective. The movement of the fleet was objective.

  He turned the key. The engine coughed, then caught, vibrating through the soles of his boots. He began to cast off the stern line.

  From the dock above, a voice called out. "You heading out, Elias?"

  It was Silas. Silas owned the *Orion*, the oldest boat in the fleet, tied up two slips down. He was a man who measured twice and cut once, who had survived the Great Gale of '98 by staying tied to the pilings while others prayed to engines.

  Elias looked up. Silas wasn't starting his engine. He was coiling a rope, slow and methodical. He wasn't watching the boats; he was watching the gulls.

  "Looks like a run," Elias said, his hand hovering over the cleat. "Jory and the others are already past the break."

  Silas didn't look at the boats. He pointed a calloused finger at the water near the dock. A cluster of gulls was diving franticly, not for fish, but snapping at the surface agitation caused by the dropping pressure. "They're feeding low. Insects coming down before the rain."

  Elias looked at the birds. He looked at his barometer. He looked at his shoulder.

  Silas tied off the coil. He wasn't leaving.

  Elias froze. The engine idled beneath him, a low thrum.

  Here was the calculation, silent and sudden. If Silas stayed, it meant Silas's private information was so strong that it outweighed the evidence of the three boats already gone. Silas could see the *Kestrel*. He could see the *Sarah Jane*. He knew they were out there. For Silas to remain tied up, his certainty had to be massive.

  And if Silas's certainty was massive enough to override the fleet, what did that say about Elias's own ache? Elias felt the same pressure drop Silas saw in the birds. If Silas was right to stay despite the three boats, then Elias was wrong to go *because* of the three boats. The prior actions of the fleet were only informative if the actors were relying on their own private signals. But if the second and third captains had just followed the first, then the "weight" of the fleet was an illusion. It was three boats, but only one decision.

  Silas had broken the chain. He had revealed that the public signal was fragile.

  Elias looked at the *Kestrel*, now a speck near the headland. He thought of Jory, trusting the empty space ahead of him. He thought of the *Sarah Jane*, trusting Jory. They were out there on a foundation of copied assumptions, building a tower of cards on the open ocean.

  The engine vibrated, eager to run. To stop now was to admit he had been wrong a moment ago. To stop now was to look at the three boats ahead and say, *You are blind.*

  But the rationality of the stop was colder than the fear of looking foolish. If Silas stayed, the value of the public information had crashed. The cascade was broken. The probability of a storm had just spiked, not because the clouds had changed, but because a single data point—Silas's inaction—had revealed the hidden variance in the private signals.

  Elias reached down and turned the key back. The engine sputtered and died. The silence rushed back in, heavier than before.

  "Bad day for it," Silas called down, not triumphantly, just stating a fact.

  "Looks that way," Elias said. He began to re-tie the stern line. His hands were steady, but his heart was hammering against his ribs. He watched the headland. The clouds there hadn't moved. The water hadn't changed. Nothing in the physical world had shifted since he started the engine, yet the truth of the situation had inverted completely.

  He wondered if Jory would see Silas on the way back. He wondered if one visible boat tied to the dock would be enough to turn the fleet around, or if they would trust the momentum they had already built.

  Elias sat on the bench and waited. The ache in his shoulder pulsed, no longer ignored, no longer overridden. It was just a fact again, waiting to be proven right. He watched the gray water, listening for the sound of engines returning, or the sound of the wind picking up. Either way, the waiting was the only rational thing left to do.
