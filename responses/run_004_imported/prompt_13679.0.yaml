answer: |-
  **Title:** The Penumbra of Value: Adjudicating the Dispute Between Parity and Vagueness in Hard Choices

  **Introduction**

  The structure of practical reason is traditionally modeled on a trichotomy of comparative relations: for any two options $A$ and $B$ relative to a covering consideration, either $A$ is better than $B$, $B$ is better than $A$, or $A$ and $B$ are equally good. This trichotomous view faces a persistent phenomenological challenge: the existence of "hard choices." In cases such as choosing between a stable legal career and a riskier artistic one, agents often feel that neither option is better, yet they are not equally good. Ruth Chang has revitalized the debate surrounding this phenomenon by arguing that the trichotomy is incomplete. She posits a fourth basic relation, "parity," to account for comparability without equality. Her primary engine for this claim is the Small-Improvement Argument (SIA). John Broome, conversely, contends that the SIA misdiagnoses the logical structure of value. He argues that the pattern Chang identifies is precisely what one should expect from ordinary vagueness in the comparative predicates "better than" and "equally good."

  This essay adjudicates the dispute between Chang's parity and Broome's vagueness. To do so, it must first isolate the specific logical work the Small-Improvement Argument is required to perform: it must demonstrate that equality is false, not merely indeterminate, and that vagueness cannot account for the stability of the intuition that a small improvement fails to tip the balance. I will argue that while Chang successfully captures the normative phenomenology of hard choices, the SIA fails to logically rule out Broome's vagueness diagnosis because it implicitly assumes bivalence in a context where vagueness denies it. Consequently, the verdict of this analysis is that parity does not deserve the status of a *sui generis* fourth relation. The phenomenon of hard choices is best understood as the operation of the standard trichotomy within a zone of ontic vagueness.

  **The Small-Improvement Argument and Its Burdens**

  To understand the stakes, one must formalize Chang's Small-Improvement Argument. The argument is a *reductio* against the claim that two hard-to-compare items, $A$ and $B$, are equally good. It proceeds as follows:

  1.  Assume for *reductio* that $A$ is equally good as $B$ ($A = B$).
  2.  If $A = B$, then a slightly improved version of $A$ (denoted $A+$) must be better than $B$ ($A+ > B$).
  3.  In hard choices, it is not the case that $A+ > B$ (the improvement is too small to make $A$ determinately better).
  4.  Therefore, $A$ is not equally good as $B$.
  5.  Since $A$ is not better than $B$, $B$ is not better than $A$, and $A$ is not equal to $B$, yet they are clearly comparable (unlike a career and a flavor of ice cream), they must stand in a fourth relation: Parity.

  For this argument to succeed in establishing parity as a *sui generis* relation, it must clear two distinct hurdles. First, it must rule out **equality**. This is the explicit target of the *reductio*. Chang relies on the intuition that equality is "sensitive" to small improvements; if two things are truly equal, any improvement to one breaks the tie. Second, and more crucially for the dispute with Broome, the SIA must rule out **vagueness**. If the failure of $A+$ to be better than $B$ is due to the vagueness of "better than" rather than the falsity of "equal to," then the trichotomy remains intact, merely blurred at the edges.

  Chang anticipates this. She argues that vagueness implies a lack of truth value (indeterminacy), whereas hard choices involve a determinate truth that the options are *not* equal. She contends that if the relation were vague, it would be indeterminate whether $A = B$. But, she argues, in hard cases, it is *determinately false* that $A = B$. The SIA is designed to prove this determinate falsity. If the SIA works, parity is metaphysically necessary. If it fails, ontological parsimony favors Broome's vagueness.

  **Broome's Vagueness Diagnosis**

  Broome's counter-argument, articulated in "Is Incommensurability Vagueness?", attacks the logical transition from premise 2 to premise 3. Broome accepts that "better than" and "equally good" are vague predicates. In semantic terms, there is a "penumbra" where the application of the predicate is neither determinately true nor determinately false.

  Broome argues that Chang's SIA relies on a principle of **collapsibility**: the idea that if $A$ and $B$ are on a par (or equal), a small improvement to $A$ must collapse the relation into "better than." Broome contends that if "equally good" is vague, then the statement "$A$ is equally good as $B$" may be indeterminate. If it is indeterminate, the conditional premise "If $A = B$, then $A+ > B$" does not function as a classical material implication.

  More specifically, Broome suggests that in the penumbra of vagueness, the relation between $A$ and $B$ is such that $A$ is not determinately better than $B$, $B$ is not determinately better than $A$, and $A$ is not determinately equal to $B$. When we introduce $A+$, we move slightly along the spectrum. However, if the vagueness is substantial, $A+$ may still fall within the penumbra relative to $B$. Thus, "$A+$ is better than $B$" is also indeterminate.

  For Broome, Chang's intuition in premise 3 ("It is not the case that $A+ > B$") is ambiguous. Does it mean "$A+ > B$ is false" or "$A+ > B$ is not determinately true"? Chang requires the former to prove inequality. Broome argues that only the latter is justified by the phenomenology of hard choices. We do not know that $A+$ is better; it is indeterminate. This indeterminacy is fully compatible with the trichotomy, provided we accept that the trichotomous relations themselves admit of degrees of determinacy. Broome's diagnosis preserves the standard logic of value while accommodating the phenomenology by locating the "hardness" in the semantic boundaries of the predicates rather than in a fourth metaphysical relation.

  **Adjudicating the Merits: The Failure of the SIA**

  The crux of the dispute lies in whether the SIA successfully distinguishes between *determinate falsity* (Chang) and *indeterminacy* (Broome). To adjudicate this, we must assess whether Chang provides independent grounds for claiming that "$A = B$" is determinately false in hard cases, other than the SIA itself.

  Chang argues that if $A$ and $B$ were merely vaguely equal, we could not explain why we feel justified in choosing either without flipping a coin. She suggests parity allows for "will-based reasons"—the agent creates reasons through commitment. However, this is a argument from normative consequence, not a logical proof of the relation's structure. Broome can reply that vagueness also permits discretion. If it is indeterminate whether $A$ is better than $B$, then there is no determinate requirement to choose $A$ or $B$. The agent's permission to choose is explained by the lack of a determinate normative requirement, not by a fourth relation.

  The fatal weakness in the SIA is its reliance on the **Principle of Bivalence** in the context of value comparisons. The SIA assumes that for any pair $A, B$, the proposition "$A$ is better than $B$" is either true or false. Under this assumption, if it's not true that $A > B$, and not true that $B > A$, and not true that $A = B$, a contradiction arises unless a fourth option exists. But Broome's vagueness hypothesis explicitly rejects bivalence for the penumbral cases.

  If "better than" is vague, then in a hard choice, the proposition "$A = B$" is neither true nor false; it is indeterminate. Consequently, the conditional "If $A = B$, then $A+ > B$" cannot be used to generate a contradiction in the classical sense. If the antecedent ($A=B$) is indeterminate, the truth value of the conditional is unstable. Furthermore, Chang's premise 3 asserts that $A+$ is *not* better than $B$. But if "better than" is vague, the correct description is that it is *indeterminate* whether $A+$ is better than $B$. Chang treats this indeterminacy as falsity to fuel her *reductio*. This begs the question against the vagueness theorist. She assumes the precision required to prove precision is lacking.

  Moreover, consider the **Sorites Series**. If we accept parity, we must explain where parity ends and "better than" begins. If $A$ is on a par with $B$, and we improve $A$ a million times, eventually $A$ will be better than $B$. At what specific increment does parity switch to "better than"? Chang faces a boundary problem identical to the one she attributes to vagueness. If she posits a sharp boundary between parity and "better than," she reintroduces arbitrariness. If she posits a vague boundary between parity and "better than," she has admitted vagueness into her own system, undermining the claim that parity resolves the vagueness problem. Broome's account is more parsimonious: there is only one source of vagueness (the trichotomous predicates), whereas Chang requires a fourth relation that *also* likely has vague boundaries.

  **The Normative Stakes and Phenomenological Accuracy**

  One might object that Broome's account fails to capture the *normative significance* of hard choices. Chang argues that parity explains why we feel we can commit to one option without violating rationality, whereas vagueness might imply we simply don't know the truth. However, this distinction is less sharp than Chang suggests. In Broome's framework, if it is indeterminate whether $A$ is better than $B$, rationality does not demand choosing $A$. It permits choosing either. The "normative gap" Chang identifies is preserved in Broome's account as a "normative indeterminacy."

  Chang's strongest point is phenomenological: hard choices feel like a specific state, not just confusion. However, phenomenology is not metaphysics. The feeling of a "fourth way" may be the cognitive experience of grappling with vague predicates. When we strain to compare a career in law to a career in art, the cognitive friction we experience is consistent with the brain attempting to apply precise logical operators to vague inputs. To reify this friction into a metaphysical relation is to mistake the map for the territory.

  **Verdict**

  The Small-Improvement Argument is a powerful intuitive pump, but it is logically insufficient to establish the existence of parity as a *sui generis* relation. To succeed, the SIA must demonstrate that the failure of $A+$ to be better than $B$ is due to the falsity of equality, rather than the indeterminacy of the comparative predicates. Chang fails to do this because her argument presupposes bivalence, which is the very point Broome's vagueness hypothesis denies. By treating indeterminacy as falsity, the SIA begs the question.

  Furthermore, Broome's account offers greater ontological parsimony. It explains the data of hard choices using existing logical tools (vague predicates) without multiplying the fundamental relations of value. While Chang's theory provides a rich language for discussing agency, it does not earn its metaphysical keep. The "hardness" of hard choices is a feature of the imprecision of value, not a feature of a unique normative relation.

  Therefore, the definite verdict is that **parity does not deserve the status of a *sui generis* fourth relation.** The structure of practical reason remains trichotomous. Hard choices are not evidence of a gap in the logic of value, but rather evidence of the inherent vagueness of the concepts "better than" and "equally good." Broome's diagnosis is philosophically superior because it resolves the impasse without inflating the ontology of normativity, correctly identifying the Small-Improvement Argument as a challenge that vagueness can absorb rather than one that refutes it.
