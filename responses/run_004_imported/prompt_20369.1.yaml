prompt: |-
  I'm on the new workload-equity subcommittee at my company (an HR-adjacent panel that handles job-description and workload disputes), and honestly this case hits close to home. A colleague filed a grievance because she keeps getting pulled into unpaid extra work that never shows up on her review -- running the inclusion panel discussions, being the go-to person whenever a manager has a question about accommodations, explaining her own disability to every curious new hire -- and she wants it formally recognized, either as comp time or credit toward promotion. Half the committee says this is just normal good-citizen stuff everyone does a bit of, and that formalizing it opens the floodgates (what about the guy who always fixes peoples printers, or whoever organizes the holiday party?). The other half thinks somethings different when the "extra work" is basically mining someone's identity for free rather than a skill they'd have anyway. I have to help draft the actual recommendation before next weeks meeting. Could you write the short memo -- a real decision (approve / deny / approve with conditions), a timeframe (including whether its retroactive and when it'd get reviewed again), and reasoning that seriously engages the "this is just normal citizenship work" objection instead of brushing it off? Sorry if this reads a bit ranty, I got asked to run another unpaid lunch-and-learn this morning so i'm kind of heated about it lol.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a new workload-equity subcommittee (HR-adjacent).
      *   **Task:** Draft a short memo with a recommendation (decision, timeframe, reasoning) regarding a colleague's grievance.
      *   **The Case:** A colleague (with a disability) is doing unpaid extra work related to her identity/disability (inclusion panels, accommodation go-to, explaining disability to new hires). She wants comp time or promotion credit.
      *   **The Conflict:** Half the committee says it's "normal good citizenship" (like fixing printers or organizing parties). The other half says it's "mining identity" and distinct from voluntary social tasks.
      *   **Requirements:**
          *   Real decision (Approve/Deny/Conditional).
          *   Timeframe (Retroactive? Review date?).
          *   Reasoning that *seriously engages* the "normal citizenship" objection (doesn't brush it off).
          *   Tone: Professional but empathetic, acknowledging the user's frustration (they are also doing unpaid labor).
      *   **User State:** "Heated" because they were just asked to do similar unpaid work.

  2.  **Determine the Stance/Decision:**
      *   *Option A (Deny):* Bad idea. Validates the exploitation, ignores the equity mandate of the committee, likely demoralizing.
      *   *Option B (Approve Unconditionally):* Risky. Might trigger the "floodgates" fear too aggressively without a framework. Hard to implement immediately.
      *   *Option C (Approve with Conditions/Framework):* Best path. It validates the grievance, sets a precedent for *this type* of work (identity-based labor) without necessarily opening the floodgates for printer-fixing, and creates a sustainable system.
      *   *Decision:* **Approve with Conditions.** Specifically, recognize this as "Diversity, Equity, and Inclusion (DEI) Labor" or "Identity Tax," distinct from general office citizenship.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Decision:** Clear and upfront. Approve the request for credit/comp, but frame it within a new guideline.
      *   **Timeframe:** Needs to be fair. Retroactive to when the grievance was filed (or start of the performance cycle), with a review in 6 months.
      *   **Reasoning (The Core Challenge):**
          *   Must address the "printer guy/holiday party" argument directly.
          *   *Key Distinction:* Voluntary social contribution vs. Required expertise based on protected status.
          *   *Argument:* Fixing a printer is a skill anyone *could* learn. Explaining a disability is inherent to *who someone is*. One is optional citizenship; the other is an extraction of personal experience for company benefit.
          *   *Risk:* Burnout and turnover of underrepresented staff.
          *   *Solution:* Formalize the role or compensate the time.
      *   **Tone:** Professional, firm, equitable. Needs to sound like it comes from a committee that understands the nuance.

  4.  **Refining the Argument (Addressing the "Floodgates"):**
      *   How do we stop the printer guy from claiming comp time?
      *   *Differentiation:* The printer guy is solving a technical glitch. The colleague is solving a *knowledge gap* regarding compliance and culture that management *should* be handling. Also, the colleague's labor is tied to a protected class, creating a potential legal/ethical risk if uncompensated (unequal burden).
      *   *Wording:* "Distinction between voluntary social glue and mandatory identity expertise."

  5.  **Addressing the User's Frustration:**
      *   The user mentioned they are heated because they were asked to do a lunch-and-learn.
      *   *Action:* I should add a note *outside* the memo to validate their feeling and suggest they protect themselves too. But the memo itself must remain professional.
      *   *Wait, the prompt asks me to write the memo.* I will write the memo, but I can add a brief "off-the-record" note at the end to support the user personally.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Subject Line:* Needs to be specific but confidential. "Recommendation re: Workload Equity Grievance [Case ID]"
      *   *Decision:* Approve. Credit toward performance review + comp time for future instances.
      *   *Reasoning:* Acknowledge the "good citizen" argument. It's valid for *social* tasks. But this isn't social. It's educational labor based on protected status. It creates an unequal burden.
      *   *Timeframe:* Retroactive to start of current review cycle. Review policy in 6 months.

  7.  **Review against Constraints:**
      *   Short memo? Yes.
      *   Real decision? Yes.
      *   Timeframe included? Yes.
      *   Engages the objection? Yes, this is crucial. I need to make sure I don't just say "No, it's different." I need to say "We hear the concern about floodgates, here is the specific filter that prevents that."

  8.  **Final Polish:**
      *   Ensure HR-speak is accurate but not soulless.
      *   Make sure the distinction between "office housework" and "identity labor" is clear.
      *   Check tone: Supportive of the grievant, respectful of the committee's concern about precedent.

  9.  **Adding the Personal Note:**
      *   Since the user said they are heated, I should acknowledge that in the conversational wrapper, not in the memo itself. The memo needs to be clean for them to use.

  **(Self-Correction during drafting):** I initially thought about suggesting a new job title. That might be too big for a subcommittee recommendation. Better to stick to "Workload Credit" and "Performance Review Weighting." Keep it actionable.

  **(Refining the "Floodgate" argument):** The key is *replicability*. Anyone can learn to fix a printer. Not everyone can (or should) speak to the disabled experience. That makes it a scarce resource the company is consuming. I'll use that.

  10. **Final Output Generation** (Proceed to generate response).
answer: |-
  **MEMORANDUM**

  **TO:** Workload-Equity Steering Committee
  **FROM:** [Your Name/Subcommittee Working Group]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation re: Grievance Case #24-B (Uncompensated DEI Labor)

  **DECISION:** **Approve with Conditions**

  We recommend granting the grievant's request for formal recognition of labor. This will be applied as:
  1.  **Immediate:** Compensatory time banked for hours logged on inclusion panels and accommodation consulting over the current review cycle.
  2.  **Future:** A weighted "DEI Leadership" line item added to her performance goals, counting toward promotion criteria.

  **TIMEFRAME & REVIEW:**
  *   **Retroactivity:** Effective from the start of the current fiscal performance cycle.
  *   **Policy Review:** This specific classification of labor will be reviewed by the Committee in 6 months to assess uptake and adjust guidelines.

  **REASONING & RATIONALE:**

  We acknowledge the Committee's valid concern regarding precedent. The objection that formalizing this work may "open the floodgates" for all informal office contributions (e.g., troubleshooting IT issues, organizing social events) is a necessary check against administrative bloat. However, we must distinguish between **voluntary office citizenship** and **extractive identity labor.**

  **1. The Distinction of Skill vs. Status**
  The "printer fixer" or "party planner" utilizes a skill or discretionary time that is theoretically replicable by any employee regardless of background. Their contribution is social glue.
  In contrast, the labor described in this grievance relies on the employee's protected status and lived experience. The company is utilizing her identity as a resource to educate management and satisfy compliance needs (accommodations). This is not "good citizenship"; it is subject-matter expertise derived from a protected class. To treat this as voluntary is to place an unequal tax on underrepresented staff that majority staff are never asked to pay.

  **2. The Risk of the "Floodgate" Argument**
  If we deny this based on the fear of the "printer fixer," we risk equating technical troubleshooting with the emotional and intellectual labor of explaining disability accommodations. The latter carries a higher risk of burnout and turnover for the employee, and higher legal/compliance risk for the firm if left unmanaged.
  *   **The Filter:** To prevent the floodgates, we recommend the Committee adopt a strict filter for future cases: *Is this labor based on a skill the employee chose to acquire, or is it based on who they inherently are?* Only the latter qualifies for this specific equity credit.

  **3. Business Case**
  Formalizing this does not discourage collaboration; it professionalizes it. By moving this work from "invisible favor" to "recognized contribution," we ensure that the work is done sustainably, rather than relying on the goodwill of employees until they burn out.

  **RECOMMENDATION:**
  Approve the credit immediately. Simultaneously, draft a "DEI Labor Framework" to clarify that while social volunteering remains informal, labor derived from protected-class expertise requires management oversight and compensation.

  ***

  **Off-the-record note:**
  I know you're heated (and rightfully so—being asked to run another unpaid lunch-and-learn while drafting this is ironic and frustrating). This memo is written to protect *you* as much as your colleague. By drawing the line between "skill" and "identity," we create a shield you can use next time someone asks you to educate them for free. Stick to the framework: if it's about your identity, it's billable work. Hang in there.
