  **Move 1 (Marcus):** This is the standard Lewisian counterfactual account of causation. It is intuitively powerful and serves as the default position in contemporary metaphysics: if $C$ had not occurred, $E$ would not have occurred. However, as a standalone claim regarding omissions, it is naive. It fails to distinguish between relevant and irrelevant counterfactual dependencies, which leaves it vulnerable to the "problem of many causes." It is a defensible starting point, but it lacks the necessary constraints to handle omission cases specifically.

  **Move 2 (Nadia):** This is a textbook *reductio ad absurdum* against the simple counterfactual theory of omissions. Nadia correctly identifies that without a constraint on *which* counterfactual dependencies count, causation becomes ubiquitous and trivial (everyone who didn't save the plants caused their death). In the literature, this is often called the problem of "profligate causation." It is a decisive objection to Move 1 as stated, forcing Marcus to refine his criteria for causal selection.

  **Move 3 (Marcus):** Marcus attempts to solve the selection problem by importing normative facts (promises/expectations) into the metaphysical relation. While this successfully picks out Jake, it conflates *causal responsibility* with *moral responsibility*. As Nadia will note, this makes causation interest-relative or mind-dependent in a way that many realists find unacceptable. It solves the pragmatic problem of who to blame, but it arguably fails to describe the ontological structure of the event.

  **Move 4 (Nadia):** Nadia is metaphysically precise here. She enforces the distinction between the *causal relation* (a matter of fact) and *attribution of blame* (a matter of normativity). If Marcus accepts Move 3, he concedes that "cause" is not a natural kind but a normative construct. This is a strong move because it protects the objectivity of causal claims, though it does leave Marcus without a mechanism to distinguish Jake from the Peruvian stranger on purely descriptive grounds.

  **Move 5 (Marcus):** This is Marcus's strongest move, appealing to the Hart and Honoré distinction between "causes" and "background conditions" based on normality. We select the abnormal factor (the lack of water in a context where watering is expected/normal) over the normal background. This avoids the explicit normativity of Move 3 (promises) by relying on statistical or contextual normality. It is a robust, standard defense in legal and philosophical theory, though it still admits that causal selection is context-sensitive.

  **Move 6 (Nadia):** Nadia shifts to a process or conserved quantity theory of causation (e.g., Salmon or Dowe). Her point is that omissions are "nothings," and nothings cannot transmit energy or momentum. This is the deepest metaphysical objection: that omission causation is ontologically suspect. However, this view is revisionist; it requires denying the truth of most everyday and legal causal claims involving omissions. It is a coherent position, but it comes at a high cost to common sense.

  **Missing Consideration:**
  Neither Marcus nor Nadia raised the **Interventionist account of causation** (associated with James Woodward). This framework defines causation in terms of invariance under intervention: $X$ causes $Y$ if an intervention on $X$ changes $Y$, holding other factors fixed. This handles omissions elegantly without requiring physical transmission (satisfying Nadia's worry about Move 6) and without relying purely on moral norms (addressing Nadia's worry about Move 3). On this view, Jake is a cause because his behavior is part of a stable causal model where manipulating his watering changes the plant's survival, whereas the Peruvian stranger is not part of that specific causal model. It bridges the gap between Marcus's counterfactuals and Nadia's demand for a non-normative, physicalist-friendly constraint.
