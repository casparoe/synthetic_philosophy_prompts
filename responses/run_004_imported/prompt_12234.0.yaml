prompt: |-
  A friend of mine, who works on intergenerational choice theory in an economics department and is considerably more comfortable with the relevant formalism than I am, and I spent much of a long train journey arguing about whether utilitarian aggregation can survive contact with an infinite universe. The trigger was an offhand remark about cosmology: on many current models space is infinite, so if value and disvalue are distributed through it the way our best guesses suggest, any two candidate worlds we might want to compare will each contain infinitely much good and infinitely much bad, and the ordinary utilitarian move of simply adding everything up stops working — the sums fail to converge, and even where a limiting value can be coaxed out of them, it turns out to depend on seemingly arbitrary choices, such as the order in which people, times, or regions get enumerated. We spent a couple of hours going back and forth about which of the standard proposed fixes for this, in what's sometimes called "infinite ethics," is actually least objectionable, and neither of us came away satisfied: whichever fix I favoured at a given moment, she would point out that it smuggled in exactly the kind of arbitrary, non-impartial stipulation — a discount rate, a privileged sequence of regions, a choice of limiting procedure — that it was supposed to avoid.

  I would like a more careful adjudication than the two of us managed to reach on our own. Please rank the following eight proposals for aggregating value across infinite populations or space-times, from most to least promising as a genuine axiology rather than as a formal workaround that quietly reintroduces the very arbitrariness it is meant to remove: the overtaking criterion (one stream is better if its running total eventually overtakes and stays ahead of the other's); the catching-up criterion (a more permissive limit-based relative of it); discounted, temporally or spatially weighted utilitarianism; the expansionist method of taking limits over an exhaustive sequence of finite regions; hyperreal- or surreal-valued utilitarianism; Vallentyne and Kagan's finitely-additive, region-based dominance approach; limiting average utilitarianism; and restricting comparisons to a merely partial, strong-Pareto-only ordering that leaves most pairs of worlds incomparable. In judging how promising a proposal is, weigh especially how well it can respect strong Pareto-dominance and full impartiality between people, times, and locations at once, bearing in mind that a well-known result in this area shows that no rule can jointly satisfy Pareto-dominance, impartiality, and transitivity for all infinite utility streams without covertly appealing to some non-constructive object, such as a Banach limit or a free ultrafilter, whose selection is itself arbitrary. Please give your answer as a JSON object with keys "S", "A", "B", and "C", ordered from most to least promising, each mapping to a list of the relevant proposals by name, in this format:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...]
  }
  ```

  Tiers need not be of equal size; please also add one or two sentences justifying whatever proposal(s) you place in tier S.
