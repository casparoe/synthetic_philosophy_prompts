          *   *OI:* Your result doesn't change my odds (given the settings and hidden state). (Correlation).
          *   *Analogy:* The "Bertlmann's Socks" vs. "Magic Coins" distinction is classic but needs to be sharpened. Let's use a "Common Cause" vs. "Direct Link" framing.

      *   **The "Spooky" Work (Why OI is the culprit):**
