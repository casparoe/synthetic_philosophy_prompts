          *   *Reason:* Alice cannot *control* her outcome. She gets random noise. Bob sees random noise. The correlation only appears when they compare notes *later* (subluminally).
          *   *Analogy:* Random number generators that are magically synchronized. I can't force mine to be "1" to tell you "1". I just get what I get, and you get what you get, and they match.

      *   **Physical Meaning (Holism/Non-separability):**
