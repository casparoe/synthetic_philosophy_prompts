      *   *Jarrett/Shimony Decomposition:*
          *   Parameter Independence (PI): $P(A | a, b, \lambda) = P(A | a, \lambda)$. (Setting at $B$ doesn't affect outcome at $A$).
          *   Outcome Independence (OI): $P(A | a, b, B, \lambda) = P(A | a, b, \lambda)$. (Outcome at $B$ doesn't affect outcome at $A$).
      *   *Relativistic Causality (No-Signalling):* Requires PI. If PI fails, you can signal.
      *   *Quantum Mechanics:* Violates OI, respects PI.
      *   *The Tension:* Pop science says "Non-locality." Philosophers say "It's complicated." If QM respects PI, is it really non-local in a relativistic sense?
