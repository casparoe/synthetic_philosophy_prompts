          *   *Intuition:* It's not that Alice *pushes* Bob's particle (that would be PI violation). It's that the two particles constitute a *single object* regardless of distance.
          *   *Key Phrase:* "Outcome Independence is about correlation without causal mediation."

      *   **No-Signalling Compatibility:**
