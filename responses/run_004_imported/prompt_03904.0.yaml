answer: |-
  This is exactly the right note to strike for a philosophy of physics seminar. The pop-science slogan "Bell proves nature is non-local" is technically true but philosophically lazy, while "Bell proves we must give up local realism" is often misleading because it treats "local realism" as a monolithic block rather than a conjunction of distinct probabilistic conditions.

  You are spot on to lean on Jarrett (1984) and Shimony (1984). Their decomposition of Bell's **Factorizability Condition** is the essential anatomical tool for this lecture.

  Here is a walkthrough of the distinction, the intuition behind why Outcome Independence is the "spooky" vector, and how it squares with no-signalling.

  ### 1. The Anatomy: Factorizability vs. Its Parts

  Bell's theorem starts with the assumption of **Local Causality**. Mathematically, this is encoded in the **Factorizability Condition**.

  Let $A$ and $B$ be outcomes at two wings, $a$ and $b$ be the settings (knobs), and $\lambda$ be the complete physical state of the pair in the past (the "hidden variables" or complete quantum state).

  **Factorizability** says:
  $$P(A, B | a, b, \lambda) = P(A | a, \lambda) \cdot P(B | b, \lambda)$$

  This equation says: *Once you know the complete past state $\lambda$ and your local setting, the joint probability of outcomes splits into two independent probabilities.*

  Jarrett and Shimony showed this single condition is logically equivalent to the conjunction of two distinct conditions:

  1.  **Parameter Independence (PI):**
      $$P(A | a, b, \lambda) = P(A | a, \lambda)$$
      *Intuition:* The **setting** chosen at wing $B$ does not influence the **outcome** at wing $A$.
      *Physical Meaning:* This is the genuine relativistic locality constraint. If PI fails, I can twist my knob ($b$) and instantly change the statistics of your results ($A$). That is superluminal signalling.

  2.  **Outcome Independence (OI):**
      $$P(A | a, b, B, \lambda) = P(A | a, b, \lambda)$$
      *Intuition:* The **outcome** obtained at wing $B$ does not influence the **outcome** at wing $A$ (given $\lambda$ and settings).
      *Physical Meaning:* This is a condition of statistical screening. It says $\lambda$ contains *all* the common causes. If OI fails, knowing your result gives me information about mine *even after* we have accounted for the common past $\lambda$.

  **The Punchline:** Quantum Mechanics violates Factorizability. But it does so specifically by violating **Outcome Independence** while respecting **Parameter Independence**.

  ### 2. Why Outcome Independence is the "Spooky" One

  In pop science, "non-locality" implies a mechanism: a push, a force, a signal traveling faster than light. That would be a violation of **Parameter Independence**. If I turn my knob and your needle moves, that's action-at-a-distance in the Newtonian sense.

  But QM respects PI. My knob doesn't move your needle. So where is the "spookiness"?

  It lies in **Outcome Independence**. To understand this intuitively, contrast two scenarios:

  **Scenario A: Bertlmann's Socks (OI Holds)**
  Dr. Bertlmann always wears mismatched socks. If he leaves home ($\lambda$), one sock is pink, one is green.
  *   You see the left foot is Pink ($A$).
  *   You instantly know the right foot is Green ($B$).
  *   *Did the left foot cause the right foot to be green?* No.
  *   *Did the setting of the left foot affect the right?* No.
  *   The correlation is fully screened off by $\lambda$ (the decision made at home). OI holds. This is boring classical correlation.

  **Scenario B: Quantum Coins (OI Fails)**
  Imagine two coins separated by light-years. $\lambda$ is the state prepared at the source.
  *   You flip your coin ($A$). It comes up Heads.
  *   Instantly, the other coin ($B$) is guaranteed to be Tails.
  *   *Crucial Difference:* In the sock case, $\lambda$ determined "Left=Pink, Right=Green." In the quantum case, standard QM says $\lambda$ does **not** determine "Left=Heads, Right=Tails." $\lambda$ only determines the *probabilities*.
  *   If OI fails, it means the specific realization of the outcome at $A$ is tied to the specific realization at $B$ in a way that the prior state $\lambda$ did not settle.

  **The Gut-Level Meaning:**
  Violating OI means the two particles do not possess separate, well-defined physical states that determine their outcomes individually. They constitute a **single, non-separable physical system**, regardless of spatial distance.

  When you measure one part of the system, you aren't just revealing a local property; you are actualizing a global property of the joint system. The "spookiness" isn't that $A$ pushes $B$; it's that $A$ and $B$ are not truly distinct entities in the way classical physics assumes. This is what Paul Teller called **Relational Holism**.

  ### 3. The No-Signalling Shield

  This is the part students struggle with most. *If the outcomes are instantly linked (OI violation), why can't I use that link to send a message?*

  The answer lies in the distinction between **Correlation** and **Control**.

  To send a signal (violate PI), I need to be able to **choose** the outcome at my end to encode a bit (0 or 1).
  *   If I could force my particle to be Spin Up to mean "Attack" and Spin Down to mean "Retreat," and your particle instantly mirrored that, we would have superluminal signalling.
  *   But in QM, I cannot force the outcome. I can only choose the *setting* (the basis of measurement).
  *   The outcome itself is fundamentally stochastic (random).

  **The Mechanism:**
  1.  **Alice** measures. She gets a random string of Ups and Downs. She cannot control which she gets.
  2.  **Bob** measures. He gets a random string of Ups and Downs.
  3.  Because OI is violated, their strings are perfectly (or statistically) correlated.
  4.  However, because Alice's string is random, Bob's string is also random *from his perspective*. He sees 50% Up, 50% Down regardless of what Alice does.
  5.  The correlation is only visible when they compare their lists **later**, via a classical (subluminal) channel.

  So, violating OI creates a "passive" link (shared randomness that wasn't pre-determined by $\lambda$), but respecting PI ensures there is no "active" lever (control over settings affecting distant outcomes). Special Relativity forbids superluminal *causal influence* (signalling), not superluminal *correlation*.

  ### 4. Physical Interpretation: What is actually happening?

  For your seminar, you want to move beyond the math to the ontology. If OI fails, what is the world like?

  **Option 1: Non-Separability (The Standard View)**
  Spatial separation does not imply ontological separation. The wavefunction is a field on configuration space, not 3D space. The "system" is the pair, not the particles. The failure of OI is simply the mathematical signature of this holism. There is no "influence" traveling; there is just one event happening in a distributed system.

  **Option 2: Superdeterminism (Denying Measurement Independence)**
  You can save Factorizability (and thus PI and OI) by arguing that the settings $a$ and $b$ are not independent of $\lambda$. This restores "local realism" at the cost of free will/experimental independence. Most philosophers reject this as pathological, but it's logically possible.

  **Option 3: Bohmian Mechanics (Explicit Non-Locality)**
  Interestingly, Bohmian Mechanics restores realism (particles have trajectories) but explicitly violates **Parameter Independence** at the hidden-variable level. The guidance equation for particle $A$ depends on the position of particle $B$.
  *   *Wait, doesn't that allow signalling?* No, because we cannot control the hidden variables (the initial positions). The signalling is "washed out" at the statistical level (Quantum Equilibrium).
  *   This shows that you can have a theory that is fundamentally non-local (violates PI ontologically) but empirically signal-local.

  **Option 4: Many Worlds (Denying Single Outcomes)**
  If there are no single unique outcomes (all outcomes occur in branching worlds), then OI is arguably moot. There is no "outcome at B" to condition on relative to "outcome at A" in a single world. The correlation is explained by the structure of the branching.

  ### 5. Summary for the Lecture Frame

  To frame this for your students, I suggest this narrative arc:

  1.  **The Pop-Sci Myth:** "Bell proves spooky action at a distance."
  2.  **The Correction:** Bell proves **Factorizability** is false.
  3.  **The Decomposition:** Factorizability = Parameter Independence (Locality) + Outcome Independence (Completeness/Separability).
  4.  **The Verdict:** Nature respects Parameter Independence (no signalling, SR is safe) but violates Outcome Independence.
  5.  **The Ontological Cost:** We don't have to accept "spooky forces." Instead, we must accept **Non-Separability**. The universe is not composed of distinct local bits that interact; it is composed of global states that manifest locally.
  6.  **The "Peaceful Coexistence":** Shimony's phrase. QM and SR coexist peacefully because the "non-locality" is of the holistic/correlational kind (OI), not the signal-carrying kind (PI).

  This framing respects the logic of the theorem while giving the students a clear picture of what physical intuition must be sacrificed (separability) and what is preserved (causal locality).
