prompt: |-
  I'm TAing an intro metaethics seminar this term, and next week I actually have to present on the Frege-Geach problem and how expressivists have tried to answer it, which is freaking me out a little since our professor is herself a card-carrying expressivist and will 100% grill me on the details. I've gone through the relevant bits of Blackburn's Spreading the Word (the logic-of-attitudes stuff, building up higher-order attitudes of approval/disapproval to mimic logical structure) and Gibbard's Wise Choices, Apt Feelings and Thinking How to Live (the hyperplan stuff, where normative sentences get truth conditions relative to a world plus a fully resolved 'plan,' so ordinary logic just falls out of that). I get the basic pitch of each on its own, but what I can't get from the secondary lit is where they'd actually disagree with each other -- every overview article just lists both as "live options for expressivists" and moves on like they're basically interchangeable.

  So could you write me a dialogue between a Blackburn-style quasi-realist and a Gibbard-style plan/norm-expressivist where each tries to convince the other that their own solution is the one that actually earns the name "solving Frege-Geach," and that the other's is either cheating (secretly smuggling in enough truth-conditional content that it stops being genuine expressivism) or just patching the problem case-by-case with ad hoc attitudes that don't really generalize. Id like them to get past the standard 'if lying is wrong then getting your little brother to lie is wrong' modus ponens example at some point, into how their machinery handles something harder -- negating a moral claim, disjunctions of moral claims, or even non-assertoric stuff like just wondering out loud whether lying is wrong. Please make it real back-and-forth where each move responds to the specific thing the other just said, not two prepared lectures running in parallel.
reasoning: |-
  Here's a thinking process that leads to the dialogue:

  1.  **Analyze the Request:**
      *   **Context:** The user is a TA for an intro metaethics seminar. They need to present on the Frege-Geach (F-G) problem and expressivist solutions.
      *   **Specific Challenge:** The professor is an expressivist and will grill on details. The user understands Blackburn (quasi-realism, higher-order attitudes) and Gibbard (norm-expressivism, hyperplans, truth-conditions relative to plans) but doesn't see the *disagreement* between them. Secondary lit treats them as interchangeable "live options."
      *   **Task:** Write a dialogue between a Blackburn-style quasi-realist and a Gibbard-style norm-expressivist.
      *   **Goal:** Each tries to convince the other their solution is the *real* solution to F-G, accusing the other of either cheating (smuggling in realism/truth-conditions) or being ad hoc.
      *   **Requirements:** Move beyond basic Modus Ponens (If lying is wrong, then getting brother to lie is wrong). Tackle harder cases: negation, disjunction, non-assertoric contexts (wondering). Real back-and-forth, not parallel lectures.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Blackburn (Quasi-Realism):**
          *   Core idea: Projectivism + Expressivism. We project attitudes onto the world.
          *   F-G Solution: Logic of attitudes. Logical connectives operate on *commitments* to attitudes.
          *   Mechanism: Higher-order attitudes. To accept "If P then Q" is to have a higher-order attitude of disapproving of the combination of accepting P and rejecting Q.
          *   Vulnerability: Is this just a formal trick? Does it explain *why* logic works, or just mimic it? Is it too psychological?
          *   Truth: "Truth" is a deflated notion we earn the right to use within the discourse.
      *   **Gibbard (Norm-Expressivism / Hyperplans):**
          *   Core idea: Judgments express acceptance of norms (plans).
          *   F-G Solution: Embed normative content in a possible-worlds-style semantics but relativized to *hyperplans* (fully resolved plans).
          *   Mechanism: Normative sentences have truth-conditions relative to a world-hyperplan pair. Logic works because it's basically possible worlds semantics.
          *   Vulnerability: Is this just realism in disguise? By giving truth-conditions, have you abandoned expressivism?
          *   Truth: More robust than Blackburn, but still grounded in planning nature.

  3.  **Identify the Conflict Point:**
      *   The user's intuition is correct: secondary lit often lumps them together. But there *is* a tension.
      *   Blackburn worries Gibbard is too close to realism (giving truth-conditions looks like cognitivsm).
      *   Gibbard worries Blackburn is too psychological/ad hoc (higher-order attitudes feel like a patch, not a semantic foundation).
      *   *Key battleground:* The status of "truth" and "proposition." Blackburn wants to *earn* the right to talk like a realist without being one. Gibbard wants to *explain* the realist talk by grounding it in planning semantics.

  4.  **Drafting - Section by Section:**

      *   **Setting the Scene:** A coffee shop or office hours. Let's make it late night, prepping for the seminar. Characters: "Simon" (Blackburnian) and "Allan" (Gibbardian).
      *   **Opening:** Acknowledge the F-G problem. Establish the stakes (the professor's scrutiny).
      *   **Round 1: The Basic Modus Ponens.**
          *   Simon: It's about consistency of attitudes. Disapproving of holding P and not Q.
          *   Allan: That's messy. It's about facts relative to plans. Logic holds because plans partition logical space.
      *   **Round 2: Negation and Disjunction (The Harder Cases).**
          *   Simon: Negation is rejecting an attitude. Disjunction is... tricky. Accepting that at least one attitude is in order.
          *   Allan: See, that's where you wobble. "At least one"? That sounds propositional. My hyperplans handle disjunction naturally as uncertainty in the plan.
          *   Simon: But your hyperplans look like possible worlds. You're a realist in sheep's clothing.
      *   **Round 3: Non-Assertoric Contexts (Wondering/Questioning).**
          *   Allan: Can you wonder an attitude?
          *   Simon: You can wonder whether to have the attitude.
          *   Allan: That changes the mental state. My semantics handles the content of the question directly.
      *   **Round 4: The "Cheating" Accusation.**
          *   Simon: You've reified norms into truth-conditions. You lost the expressivist soul.
          *   Allan: You've got the soul but no body. Your logic is a psychological mimicry, not a semantic account.
      *   **Conclusion:** No clear winner, but the distinction is sharp. Blackburn = Earning the right to realist talk via psychology of commitment. Gibbard = Explaining realist talk via semantics of planning.

  5.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Did I stay too technical? *Fix:* Keep the jargon (hyperplan, higher-order, truth-apt) but explain it in the flow of argument.
      *   *Check:* Is it just parallel lectures? *Fix:* Ensure interruptions and direct responses ("But that's exactly what I mean," "No, listen...").
      *   *Check:* Did I cover the specific request about negation/disjunction/wondering? *Yes, make sure that's a distinct section.*
      *   *Check:* Is the "cheating" accusation clear? *Blackburn accuses Gibbard of realism; Gibbard accuses Blackburn of ad-hocery.*

  6.  **Final Polish:**
      *   Make sure the voices sound distinct. Simon (Blackburn) should sound more pragmatic, focused on "earning the right." Allan (Gibbard) should sound more systematic, focused on "semantic structure."
      *   Ensure the TA (user) can extract the key philosophical distinction from the drama. (Maybe add a brief intro/outro note for the user).

  7.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Blackburn vs. Gibbard? Yes.
      *   F-G focus? Yes.
      *   Beyond Modus Ponens? Yes (Negation, Disjunction, Questions).
      *   Accusations of cheating/ad-hoc? Yes.
      *   Real back-and-forth? Yes.

  *(Self-Correction Note)*: I need to be careful not to misrepresent Gibbard. Gibbard *does* embrace truth-conditions in *Thinking How to Live*, but argues they are compatible with expressivism because they are relativized to hyperplans. Blackburn is wary of truth-conditions because they invite realism. This is the crux. I need to make sure Simon attacks the *truth-conditional* aspect specifically.

  Let's write it.cw
answer: |-
  **Setting:** *A dimly lit graduate student office, 10:30 PM. Coffee cups everywhere. Simon (a quasi-realist in the mold of Simon Blackburn) is pacing. Allan (a norm-expressivist in the mold of Allan Gibbard) is slumped in a chair, staring at a whiteboard covered in possible-worlds diagrams.*

  **Simon:** Look, the problem isn't explaining Modus Ponens to the undergrads. It's explaining it to *her*. If I tell her I'm solving Frege-Geach with higher-order attitudes, she's going to ask me if I'm just describing psychology or doing semantics.

  **Allan:** Then don't talk about psychology. Talk about consistency. That's the bridge.

  **Simon:** Consistency of *what*? That's the whole fight, Allan. For me, it's consistency of commitments. To say "If lying is wrong, then getting your brother to lie is wrong" isn to say I have a higher-order attitude: I disapprove of the combination of approving of the antecedent and disapproving of the consequent. It's a stance on stances.

  **Allan:** And that's where you lose her. "A stance on stances." It sounds like you're patching the leak with duct tape. You're treating logical connectives as if they were psychological operators. But logic isn't about how we feel about combinations of feelings. It's about truth-preservation. Or at least, something that plays the truth-role.

  **Simon:** Ah, there it is. The "T-word." You can't help yourself. You want truth-conditions. That's my worry about your hyperplan view. You say a sentence is true relative to a world-hyperplan pair. But once you start handing out truth-conditions like candy, aren't you just a realist in sheep's clothing? You've solved Frege-Geach by basically conceding to the cognitivist.

  **Allan:** No, I've solved it by taking the planning nature of judgment seriously. Look, when I accept a norm, I'm ruling out possibilities. A hyperplan is just a fully resolved plan for every contingency. When I say "Lying is wrong," I'm expressing my acceptance of a plan that rules out lying.

  **Simon:** Okay, but embed it. "It's not the case that lying is wrong."

  **Allan:** Easy. That expresses a plan that *doesn't* rule out lying. Or rather, it's incompatible with the plan that does. The logic falls out because hyperplans partition logical space just like possible worlds. Disjunctions, negations, conditionals—they all work because we have a semantics. You don't have a semantics, Simon. You have a story about what's going on in the head.

  **Simon:** I have a story about what we're *doing* when we talk! That's the point of quasi-realism. I'm trying to *earn the right* to talk about truth and propositions without positing weird normative facts. You're not earning it; you're buying it with counterfeit currency. You define truth-conditions relative to plans, but then you let students treat them like ordinary truth-conditions. When the professor asks, "What makes 'Lying is wrong' true relative to hyperplan H?" what do you say?

  **Allan:** The fact that H rules out lying.

  **Simon:** But H isn't a fact in the world. It's a plan. So you're saying the truth-maker is a plan. That sounds like you've reified plans into abstract objects. I keep it lean. "True" just means "stable under reflection" or "worthy of assertion." I don't need truth-conditions to explain why Modus Ponens works. I just need to show that if you accept the premises and reject the conclusion, you're in a state of practical inconsistency.

  **Allan:** Practical inconsistency is vague. Is it psychological? If I'm tired, maybe I don't feel the inconsistency. Logic shouldn't depend on your energy levels. My view explains why the inference is valid *regardless* of whether anyone actually feels the tension. The structure of hyperplans guarantees it.

  **Simon:** But does it explain *normativity*? If logic is just the geometry of hyperplans, why *ought* I follow it? My view ties logic directly to the pressure of attitudes. If I disapprove of lying, and I disapprove of the combination of [lying is okay + getting brother to lie], I'm *pressed* to disapprove of getting brother to lie. The "ought" comes from the nature of commitment.

  **Allan:** You're conflating the *source* of the norm with the *structure* of the logic. Frege-Geach is about structure. It's about how "wrong" means the same thing in "Lying is wrong" and "If lying is wrong..." Your higher-order attitude view risks changing the meaning. In the antecedent, "lying is wrong" looks like a proposition. In your explanation, it turns into an object of an attitude. You're shifting categories mid-inference.

  **Simon:** I'm not shifting categories; I'm showing how the propositional appearance is constructed. That's the "Quasi" in Quasi-Realism. I start with the expressivism, and I build up the logic. You start with the logic and try to cram expressivism into it.

  **Allan:** Let's test that. Negation. "Lying is not wrong." For you, that's... what? Rejecting the attitude of disapproval?

  **Simon:** It's tolerating lying. It's the absence of the disapproving attitude, or perhaps a higher-order approval of not disapproving.

  **Allan:** See, that's ad hoc. "Absence of attitude"? What if I have no attitude at all? "Lying is not wrong" isn't just indifference. It's a positive claim. On my view, it's accepting a plan that permits lying. It has a positive content. Your view struggles to distinguish between *denying* a norm and just *not having* one.

  **Simon:** I can handle that with higher-order complexity. I can disapprove of your indifference. But let's hit you with something harder. Disjunction. "Either lying is wrong or stealing is permissible."

  **Allan:** *[Smiles]* That's my home turf. It expresses uncertainty in my plan. I haven't decided between the plan that rules out lying and the plan that permits stealing. It's a partial hyperplan.

  **Simon:** But does it express an attitude? What am I feeling when I assert that disjunction? I'm not necessarily uncertain. I might be asserting it to trap you in a contradiction. "Either your god commands lying or morality is subjective." I'm not expressing my plan there; I'm mapping the logical space of *yours*.

  **Allan:** You're expressing your acceptance of a norm that says: "Rule out any hyperplan that forbids lying *and* forbids stealing." It's a constraint on plans.

  **Simon:** But now you're talking about constraints on abstract objects (hyperplans), not actual human planning. You've drifted into Platonism. I stay with the actual practices of speakers. When I say that disjunction, I'm inviting you to share a commitment. If you reject it, I don't say your map of hyperplans is wrong; I say you're practically unmanageable.

  **Allan:** Okay, but what about questions? Non-assertoric contexts. "I wonder if lying is wrong."

  **Simon:** Easy. You're wondering whether to adopt the attitude. You're deliberating.

  **Allan:** But the content of the wonder is "Is it true that lying is wrong?" You can't wonder an attitude. You wonder a proposition. If expressivism is true, there is no proposition there to wonder. So either "I wonder..." is nonsense, or you're admitting there's a proposition.

  **Simon:** No, "I wonder if lying is wrong" is shorthand for "I'm trying to figure out what to feel." But I see where you're going. You want to say your hyperplan semantics gives content to the question.

  **Allan:** Exactly. The question asks which hyperplan is the correct one to adopt. The semantics handles the embedding naturally because the sentences have content (relative to plans). Your view makes questions look like emotional confusion.

  **Simon:** Emotional confusion is closer to the metal than abstract hyperplans! But here's my real worry for the seminar. The professor is going to ask: "Does your solution explain why moral logic is *universal*?" If my logic is based on *my* higher-order attitudes, why can't I just decide that Modus Ponens doesn't apply to morality?

  **Allan:** Because logic isn't up to you. It's up to the structure of planning itself. If you plan, you logically commit to certain things. You can't opt out of logic without ceasing to plan.

  **Simon:** And I say logic isn't up to anyone because it's the structure of *communication*. If you violate Modus Ponens in moral discourse, you can't participate in the practice. You're not breaking a law of the universe; you're breaking the rules of the game.

  **Allan:** So it's conventional?

  **Simon:** It's constitutive of the discourse. Look, Allan, here's the charge I'm expecting from her. She's going to say to me: "Blackburn, you're just mimicking realism. You use truth-talk, you use validity-talk, but you refuse to ground it." And she's going to say to you: "Gibbard, you've grounded it, but you've turned norms into truth-conditions, so you're not an expressivist anymore."

  **Allan:** *[Sighs]* So we're both dead.

  **Simon:** Basically. But the difference is *where* the body is buried. Mine is buried in the psychology of commitment. I admit I'm reconstructing realist talk from expressivist materials. I own the reconstruction. You're claiming your materials *are* realist materials, just labeled "plans."

  **Allan:** I'm claiming that planning *is* the fundamental nature of normative judgment. Truth is a tool we use within planning. I'm not smuggling in realism; I'm explaining why realism looks plausible. We need truth-conditions to negotiate plans.

  **Simon:** But do you need *truth*? Or just agreement?

  **Allan:** If we disagree on a plan, we say one of us is mistaken. That's truth-talk.

  **Simon:** And I say that's just projecting the intensity of our disagreement.

  **Allan:** Okay, let's get specific for the TA prep. If she asks about the "Negation Problem" specifically—Schroeder's worry. How does "Lying is wrong" and "Lying is not wrong" relate?

  **Simon:** For me, they are inconsistent attitudes. I cannot simultaneously disapprove of lying and tolerate lying (in the same context). The inconsistency is in the *states of mind*.

  **Allan:** For me, the inconsistency is in the *content*. The set of hyperplans compatible with "Lying is wrong" and the set compatible with "Lying is not wrong" have no overlap.

  **Simon:** But why do they have no overlap? Because of the definition of negation in your semantics. Who defined that? You did. Did you define it to match our intuitions?

  **Allan:** I defined it to match the logic of planning.

  **Simon:** And I defined my higher-order attitudes to match the logic of commitment. We're both doing the same thing, Allan. We're just wearing different uniforms.

  **Allan:** No. My uniform fits better. You have to explain why higher-order attitudes follow classical logic. Why is my disapproval of (P and not-Q) equivalent to not-(P and not-Q)? You need to prove your psychology is classically structured. My semantics *stipulates* classical structure because planning requires it.

  **Simon:** But stipulation isn't explanation! You're assuming logic to explain logic. I'm trying to derive logic from the nature of valuing.

  **Allan:** And failing. Because valuing is messy. Logic isn't.

  **Simon:** *[Pauses, picks up a marker]* Okay. Maybe that's the pitch. I'm the messy humanist expressivist. You're the clean analytic expressivist. She's going to grill me on whether my messiness can sustain validity. She's going to grill you on whether your cleanliness is actually realism.

  **Allan:** So what's the synthesis?

  **Simon:** The synthesis is that Frege-Geach isn't a problem to be "solved" once and for all. It's a tension inherent in being an expressivist who wants to talk like a realist. I lean into the talking. You lean into the being.

  **Allan:** I lean into the planning.

  **Simon:** Right. Planning. Look, if she asks about the disjunction again... "Either lying is wrong or stealing is wrong."

  **Allan:** Say it expresses a constraint on admissible plans. A plan must rule out at least one.

  **Simon:** And I'll say it expresses a commitment to not endorsing a world where both are permitted.

  **Allan:** That sounds propositional. "A world where..."

  **Simon:** Everything sounds propositional if you stare at it long enough. That's the Quasi-Realist miracle.

  **Allan:** Or the Quasi-Realist sleight of hand.

  **Simon:** *[Grins]* Exactly. Now, help me figure out how to explain "If lying is wrong, then lying is wrong" without sounding like I'm saying "If I boo lying, then I boo lying." That's tautological but trivial.

  **Allan:** It's not trivial. It's the requirement that your plan be consistent with itself.

  **Simon:** Okay. "My plan must be consistent with itself." I can work with that. Just don't let me say "true."

  **Allan:** Don't let me say "fact."

  **Simon:** Deal.

  **Allan:** Wait, one last thing. Embedding under probability. "It's probable that lying is wrong."

  **Simon:** Oh, god.

  **Allan:** See? My hyperplans handle uncertainty naturally. Probability is just measure over the hyperplans.

  **Simon:** And I have to say... it's probable that I'll end up disapproving of lying?

  **Allan:** Sounds like you're predicting your own psychology.

  **Simon:** I am! Normative judgment *is* psychology on my view.

  **Allan:** Then you can't be wrong about it. If you predict you'll disapprove, and you do, you're right. But morality allows for error.

  **Simon:** Error is failing to live up to your own standards.

  **Allan:** *[Shakes head]* You're going to need more coffee for that one.

  **Simon:** And you're going to need more metaphysics to hide those truth-conditions.

  **Allan:** Touché. Let's get back to work.
