answer: |-
  First, I am so sorry you and your family are going through this. It is an incredibly painful position to be in: watching a parent hurt a partner, being told not to feel hurt by it, and sensing that the explanation ("he's not himself") wipes away something important about who he is.

  Your friend was absolutely right. P.F. Strawson's 1962 essay *"Freedom and Resentment"* is arguably the most famous text in modern philosophy regarding moral responsibility, and the scenario you described is practically the textbook case for it.

  You have hit on the exact nerve that makes Strawson difficult but brilliant. Let's break down the distinction between **excuses** and **exemptions**, why that distinction saves us from the "pessimist" (the hard determinist), and then apply the "objective attitude" to your father without losing your humanity in the process.

  ### 1. Excuses vs. Exemptions: Why the Distinction Matters

  You noted that both "he didn't mean it" (excuse) and "he's not himself" (exemption) seem to point to the same fact: *his brain isn't working right.* So why does Strawson split them?

  For Strawson, the difference isn't in the *physics* of the brain; it is in the **status of the relationship.**

  *   **Excuses:** These admit that the action was bad, but claim that *this specific instance* doesn't reflect the agent's ill will.
      *   *Example:* Your dad shoves your mom. If he says, "I slipped, I didn't see her there," that is an excuse.
      *   *Implication:* He is still a member of the moral community. He is still a "person" in the full sense. We still expect him to care about our feelings generally; this was just a blip. Resentment is mitigated, but the relationship remains a **participant relationship** (person-to-person).
  *   **Exemptions:** These claim that the agent is *incapable* of participating in the moral community at all, or at least in this regard.
      *   *Example:* Your dad shoves your mom because a tumor is pressing on his amygdala.
      *   *Implication:* He is temporarily or permanently "outside the game." You cannot hold him responsible because he lacks the capacity for the requisite goodwill. He is not a moral peer in this moment.

  **How this defeats the "Pessimist"**
  The "pessimist" Strawson argues against is someone who says: *"If determinism is true, no one is truly responsible. Every cruel act is just the result of prior causes (brain states, upbringing, physics). Therefore, we should never feel resentment toward anyone."*

  Strawson's counter-move using the excuse/exemption distinction is this:
  If the pessimist were right, **everyone** would be exempt, all the time. We would have to view every human being like we view a hurricane or a rabid dog—as a force of nature to be managed, not a person to be reasoned with.

  But we don't do that. We naturally distinguish between:
  1.  **Normal Determinism:** A person yells because they are stressed (caused), but they still understand they hurt you. (We hold them responsible; we might accept an *excuse* if they apologize).
  2.  **Abnormal Determinism:** A person yells because of a stroke-induced personality change (caused), and they *cannot* understand they hurt you. (We grant an *exemption*).

  Strawson argues that moral responsibility doesn't require "magic" free will (the ability to have done otherwise in a metaphysical sense). It only requires **normal participation in interpersonal relationships.** As long as someone is capable of understanding and responding to moral demands, they are responsible. When their brain damage removes that capacity, they are exempt.

  The distinction does the work of showing that we don't need to abandon responsibility globally just because some people are exempt locally.

  ### 2. Should You Take the "Objective Attitude" Toward Your Dad?

  This is the harder, more personal question.

  Strawson defines the **Objective Attitude** as seeing someone not as a partner in a relationship to be negotiated with, but as an object to be **managed, treated, trained, or avoided.** You don't feel resentment toward a storm; you just put up an umbrella.

  **Strawson's Technical Answer:**
  Strictly speaking, Strawson would say that if your father's frontal lobe damage has genuinely destroyed his capacity for impulse control and empathy regarding these comments, **yes, he falls into the exemption category.** In those specific moments, the "participant stance" (expecting him to respect your mom as a moral equal) is inappropriate because he literally cannot fulfill the requirement.

  In this narrow sense, your sister is channeling Strawson: "He's not himself" = "He is exempt." Therefore, resentment is irrational.

  **However, here is why your unease is philosophically valid (and Strawsonian):**

  Strawson explicitly warns against adopting the Objective Attitude too broadly. He says it is emotionally costly and "inhuman" to view people purely objectively. We are wired for connection.

  If you take the *full* objective attitude toward your dad, you stop seeing him as your father and start seeing him as a patient or a hazard. This protects your mom from the sting of the cruelty, but it effectively "kills" the relationship you have with him. It creates a grieving process where you mourn the father while he is still alive.

  **The Strawsonian Nuance for Your Situation:**
  Strawson would likely argue for a **mixed stance**, not a total objective one.

  1.  **Regarding the Cruelty:** You are justified in taking the objective attitude toward the *behavior*. Do not engage in moral arguments with him about why he shouldn't say those things. You cannot reason with the damage. Manage the environment (redirect him, remove your mom from the room) as you would manage a child or an illness. In this specific lane, your sister is right: don't take it personally.
  2.  **Regarding the Person:** You do not have to take the objective attitude toward *him* as a whole. You can still love him, visit him, and value his presence, provided you adjust your expectations.

  **Why "He's Not Himself" feels wrong:**
  Your sister's phrase implies a dualism: The "Real Dad" is gone, and this "Stroke Dad" is an imposter. Strawson would say this is a useful fiction for protection, but not metaphysical truth. This *is* your dad now. His brain is damaged, but he is still the locus of your history.

  If you fully adopt the objective attitude, you risk isolating him. If he senses he is being "managed" rather than engaged with, it can accelerate decline. Strawson acknowledges that we often oscillate. One minute you are furious (participant stance), the next you remember the diagnosis and feel pity (objective stance).

  ### 3. Summary: How to Navigate This

  To answer your specific questions directly:

  **1. Why does the distinction matter against the pessimist?**
  It proves that we don't need "libertarian free will" to have responsibility. We just need "psychological normalcy." The pessimist says *causation* removes responsibility. Strawson says *only specific types of causation* (psychological abnormality/compulsion) remove responsibility. Since we can distinguish between the two in practice, the pessimist's claim that "determinism kills all responsibility" is false.

  **2. Should you take the objective attitude?**
  Strawson would say: **Take it toward the behavior, not the soul.**
  *   **Do:** Accept that he cannot control the impulses. Stop expecting him to apologize sincerely. Stop letting his words define your mom's worth. Manage the situation clinically to protect her.
  *   **Don't:** Write him off as a non-person. Do not suppress your grief. The "unease" you feel is the pain of the relationship changing. Strawson would say that pain is a feature, not a bug. It proves you still care.

  Your sister is trying to use the "exemption" to protect your mom's feelings (which is good). But she is asking you to bypass your own reactive attitudes entirely, which Strawson would say is impossible and unhealthy. You are allowed to be sad that the dad you knew is gone, even if you acknowledge the dad who is here isn't responsible for the cruelty.

  Strawson doesn't tell you not to hurt. He tells you that your hurt is a testament to the fact that you still view your family as a community of persons, not just objects. That is worth holding onto, even while you manage the illness.
