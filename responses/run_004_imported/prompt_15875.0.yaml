      *   *Refining the Dennett point:* Make sure to mention that for Dennett, "real" *means* "compressive/predictive." So calling them "Real Patterns" isn't dismissing them as fake; it's defining their ontology.
      *   *Refining the Fodor point:* Fodor requires compositionality and specific syntax. Neural nets are distributed. SAEs try to force compositionality.
      *   *Key Insight:* The "sparsity penalty" in SAEs is the philosophical lever. Tune it, and you change the "reality" of the features. That screams Dennett.

