prompt: |-
  My friend Priya is getting married next month and I'm giving a toast at the reception. She and her fiancé Marcus actually met as rival bidders in a insane bidding war over a 1-bedroom condo, going back and forth for two weeks before either one knew who the other person was, and both ended up way overpaying. Somebody at work told me this is basically the "dollar auction" thing from game theory - the two front-runners keep escalating because neither wants to be the one who eats a loss and gets nothing for it (I write code for a living, not exactly my department, but it stuck with me). I want to build the toast around that instead of just name-dropping it once, but it has to work two ways: a bunch of her friends are econ/finance nerds who'll clock the reference immediately, while Marcus's grandma and half the room have never heard of game theory and just need a sweet, funny speech. Can you write me a 3-4 minute toast that uses the dollar auction as the real backbone of it, not just a one-liner, and doesnt accidentally make it sound like their marriage is just two stubborn people who hate losing?
