      *   Context (Crabs, shocks, no analgesic)? Yes.

  *(Self-Correction on "Student Rep" Role)*: As a student rep, I might not have the authority to *issue* the memo unilaterally. Usually, the Chair signs off. However, the prompt asks me to "draft that for me," implying a draft for the committee's consideration or a position paper to circulate before the vote. I will frame it as a **Committee Decision Memorandum (Draft)** intended for the Chair's signature or committee adoption, written from the perspective of the sub-committee or the Student Rep's formal recommendation. Let's make it a formal **ACUC Protocol Review Memorandum**.

