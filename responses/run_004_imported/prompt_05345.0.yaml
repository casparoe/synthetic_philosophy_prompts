prompt: |-
  My friend Priya is retiring at 44 after twenty-odd years in private equity — she's hit her number and says she's finally going to do what Keynes told everyone to do: take up painting and long lunches instead of chasing money she doesn't need. I'm doing the toast at her leaving drinks next friday, and since building a decent arc out of real material is literally my day job (I write novels), I dont want to hand her some limp "follow your passion" speech. I want it built around what Keynes ACTUALLY argued in that grandchildren essay of his — the bit about the love of money being basically a pathology, and his worry that most people, once they actually got the leisure, wouldn't have the first clue how to use it well — not the fridge-magnet version people trot out whenever they namedrop him. Problem is half the room is her old banking colleagues who'll smell a lecture a mile off, and the other half are the artist friends she's been neglecting for two decades who think finance people are lost causes. Can you write me a five-minute toast that uses his actual argument to say something true and specific about what Priya's doing, and still feels like a toast and not a seminar?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement leaving drinks for Priya (age 44, 20+ years in Private Equity).
      *   **Speaker:** A novelist (friend of Priya).
      *   **Theme:** John Maynard Keynes's essay "Economic Possibilities for our Grandchildren" (1930).
      *   **Key Keynesian Concepts to Include:**
          *   The love of money as a "disgusting morbidity" (pathology).
          *   The challenge of leisure: Once free from economic necessity, do we know how to live wisely?
          *   Avoiding the cliché "follow your passion."
      *   **Audience:** Mixed bag. Half PE/banking colleagues (pragmatic, skeptical of lectures), half artist friends (creative, skeptical of finance).
      *   **Tone:** Warm, witty, specific, not preachy, feels like a toast (5 minutes), acknowledges the tension between the two worlds.
      *   **Constraint:** Do not make it sound like a seminar/lecture.

  2.  **Deconstruct Keynes's Argument (for accuracy):**
      *   Keynes predicted that by 2030, technology and capital accumulation would solve the "economic problem" (scarcity).
      *   He argued the *real* problem would be psychological: How to use freedom from pressing economic cares.
      *   He called the love of money a "somewhat disgusting morbidity, one of those semi-criminal, semi-pathological propensities."
      *   He worried that "purposeful" people (like Priya in PE) might struggle when the purpose (making money) is removed.

  3.  **Determine the Arc of the Toast:**
      *   **Opening:** Acknowledge the milestone (44, retired). Hook the room with the Keynes reference but immediately ground it in Priya.
      *   **Middle (The Meat):** Address the two halves of the room.
          *   To the Bankers: Acknowledge the grind, but validate the exit. Money *was* the scorecard, but now it's just points.
          *   To the Artists: Acknowledge the skepticism, but highlight Priya's discipline. She isn't running *to* something vague; she's running *from* a completed task.
      *   **The Keynesian Twist:** Reframe retirement not as "stopping work" but as "starting life." The hard part isn't making the money; it's enjoying the freedom.
      *   **Closing:** A wish for her future. Not just "happiness," but "wise leisure." A call to raise a glass.

  4.  **Drafting - Section by Section:**

      *   *Salutation:* Keep it informal. "For those who don't know me..."
      *   *The Hook:* Mention the age. 44 is young for retirement. Mention Keynes.
      *   *Addressing the Bankers:* They know the grind. 20 years of deals, due diligence, exits. Acknowledge the skill. But quote the "disgusting morbidity" line gently. It's not an insult; it's a diagnosis they all share.
      *   *Addressing the Artists:* They think finance is soulless. But Priya is one of them at heart. She's not just quitting; she's returning.
      *   *The Core Argument:* Keynes worried people wouldn't know how to *be*. Priya knows. She's choosing painting and long lunches not as escapism, but as practice for being human.
      *   *The Novelist Touch:* Since the speaker writes novels, use a metaphor about narrative arcs. The "second act."
      *   *The Toast:* Raise a glass to the "economic problem" being solved, and the "human problem" beginning.

  5.  **Refining the Tone (Self-Correction during drafting):**
      *   *Critique:* Is quoting "disgusting morbidity" too harsh for a party?
      *   *Fix:* Frame it as Keynes calling *all of us* (including the speaker) morbid, not just Priya. Make it self-deprecating. "Keynes called it a sickness; we called it a bonus."
      *   *Critique:* Is it too intellectual?
      *   *Fix:* Keep the sentences punchy. Use concrete images (paint, wine, spreadsheets). Ensure the Keynes stuff is explained in plain English.
      *   *Critique:* Does it bridge the gap between bankers and artists?
      *   *Fix:* Explicitly mention the two tribes in the room. Show how Priya belongs to both.

  6.  **Final Polish (Checking against constraints):**
      *   *Time:* ~750-850 words for 5 minutes at a moderate pace.
      *   *Keynes Accuracy:* Ensure the "grandchildren" essay context is clear (solving scarcity -> facing leisure).
      *   *Specifics:* Mention Private Equity, painting, long lunches.

  7.  **Final Review of the Draft (Mental Walkthrough):**
      *   Start with the age. 44 is the hook.
      *   Bring in Keynes early but keep it light.
      *   Talk to the PE crowd: "You know the drill."
      *   Talk to the Art crowd: "You know the dream."
      *   Bring it back to Priya: She's the bridge.
      *   End with the toast.

  *(Self-Correction during final review)*: Make sure I don't sound like I'm saying finance is bad. It was a means to an end. The focus is on the *transition*.

  8.  **Final Output Generation** (This matches the provided good response).
answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I write novels, which means I spend my days making things up, while Priya spent the last twenty years making things happen.

  We are here to celebrate a rare plot twist. Priya is forty-four years old. She has worked in private equity for two decades. And as of this week, she is retired.

  Now, usually, when someone retires at forty-four, we tell them to "follow their passion." But I'm a writer, and I know that "follow your passion" is the lazy writer's version of a ending. It's deus ex machina. It doesn't explain *how* we get there, or why it matters.

  So, instead of clichés, I want to talk about John Maynard Keynes. Specifically, a short essay he wrote in 1930 called *Economic Possibilities for our Grandchildren*.

  I know, I know. Half of you are PE partners and you're already checking your watches for the carry calculation. The other half are artists and you're wondering why we're talking about a dead economist at a bar. Stick with me.

  Keynes made a prediction. He argued that within a hundred years, capital accumulation and technology would solve the "economic problem." He believed humanity would finally earn enough to no longer *need* to toil for survival. He thought we'd be working fifteen hours a week by now.

  He was right about the money. He was wrong about the psychology.

  Keynes wrote that the love of money is not a virtue. He called it a "disgusting morbidity." He called it a "semi-criminal, semi-pathological propensity."

  Looking around this room, I see the people who helped Priya cultivate that propensity, and I see the people who waited for her to outgrow it. To the bankers in the room: Priya loved the game. She was brilliant at it. But Keynes would argue that for twenty years, she was successfully managing a pathology for the sake of a future freedom.

  To the artists in the room: You worried that the finance world would swallow her soul. But Priya wasn't swallowed. She was loading the gun.

  Here is the part of Keynes's argument that actually matters for tonight. He wasn't worried about us making the money. He was terrified of what we'd do once we had it.

  He wrote: *"It will be those peoples, who can keep alive, and cultivate into a fuller perfection, the art of life itself and do not sell themselves for the means of life, who will be able to enjoy the abundance when it comes."*

  In other words: Making a living is a technical skill. Making a life is an art form. And Keynes worried that when the money finally stopped being the point, most of us wouldn't have the first clue how to fill the days. We'd get bored. We'd get anxious. We'd miss the misery because at least the misery felt like purpose.

  This is why Priya's retirement is so specific, and so brave.

  She isn't just stopping. She is pivoting to the harder work. She is trading the certainty of the spreadsheet for the uncertainty of the canvas. She is trading the quick deal for the long lunch.

  Keynes warned that when we are no longer needed by economic necessity, we have to learn to be wise. We have to learn to enjoy things that don't have a ROI. We have to learn to value time not because it's billable, but because it's fleeting.

  Priya, you have solved the economic problem. You hit your number. You won the game. But starting Monday, you start the real test. The test Keynes described.

  My wish for you is not that you find happiness—that's too vague. My wish is that you master the leisure.

  I hope your paints dry slowly. I hope your lunches stretch until the kitchen closes. I hope you never look at a clock to see if you're being productive. And when the bankers ask you what your yield is, and the artists ask you what your masterpiece means, I hope you can look at both of them and say: "The yield is time. The meaning is that I'm using it."

  Keynes thought this would take a century. Priya did it in twenty years.

  So, if everyone could raise a glass.

  To Priya. May you never sell yourself for the means of life again. And may you cultivate, into a fuller perfection, the art of life itself.

  Cheers.
