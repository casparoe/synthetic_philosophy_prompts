          *   Argue that Locke is primarily making an epistemological point (against innatism) rather than a phenomenological one (like Berkeley).
          *   Highlight the "Primary Qualities" context. For Locke, Figure *is* a primary quality. The idea *should* resemble the quality. But the *sensory vehicles* differ.
          *   Conclusion on Text: Locke is closer to Reading A (Association of distinct sensations referring to the same quality) but his language is loose enough that Berkeley could co-opt it for Reading B. He hasn't made Berkeley's distinction yet.
      *   **Part 2: Empirical Evidence (Vision Science):**
          *   Cite Cheselden (historical context Locke would have known about later) and modern studies (Project Prakash).
          *   Consensus: Immediate failure, rapid learning.
          *   Interpretation: This supports the "Need for Experience" (Locke) but leaves the "Heterogeneity" question open.
