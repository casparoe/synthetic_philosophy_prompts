      *   **Questions:**
          1.  Does Locke's wording settle whether he supports Reading A or Reading B? Or is he pre-theoretical on this distinction?
          2.  Does empirical evidence from newly sighted patients (cataract surgery, etc.) favor one reading over the other?

  2.  **Deconstruct Locke's Text (Philological/Philosophical Analysis):**
      *   *Molyneux's Reasoning (as quoted by Locke):* "he has not yet attained the Experience, that what affects his touch so or so, must affect his sight so or so."
          *   This phrasing ("must affect") suggests a contingent connection known only through experience. It doesn't explicitly deny a common underlying property (extension), but it denies *a priori* knowledge of the correlation.
      *   *Locke's Endorsement:* "I agree with this thinking Gent... and am of opinion, that the Blind Man, at first sight, would not be able with certainty to say..."
          *   Locke adopts Molyneux's reasoning.
      *   *Locke's Gloss:* "...consider how much he may be beholden to experience, improvement, and acquired notions, where he thinks he had not the least use of, or help from them."
          *   This emphasizes the *process* of learning the connection. It attacks the notion of innate ideas or immediate intuitive knowledge of the connection.
      *   *Context within the Essay:* This passage is in Book II, Chapter ix ("Of Perception"). The broader project is empiricist: all ideas come from sensation or reflection. Complex ideas are built from simple ideas.
      *   *Key Locke Doctrine:* Simple ideas of sensation. Are "visible figure" and "tangible figure" the *same* simple idea?
          *   Locke often speaks of "primary qualities" (solidity, extension, figure, motion/number) as real qualities of bodies that resemble our ideas of them.
          *   If figure is a primary quality, the idea of figure *should* be the same regardless of the sense, *provided* the mind abstracts it correctly.
          *   *However*, Locke distinguishes between the *sensation* and the *idea of the quality*.
