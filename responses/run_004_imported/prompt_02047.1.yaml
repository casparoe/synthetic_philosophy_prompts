      *   *Verdict on Question 1:* Locke is likely *not* committing to full heterogeneity (Berkeley) but is committing to strong empiricism regarding the *association* of senses. He believes in a common external reality (primary qualities), but denies the mind has innate access to the mapping between sensory modalities. He is closer to Reading A (correlational/associative) but his emphasis on "acquired notions" leaves the door open for Reading B, which Berkeley kicked wide open. Locke hasn't made the phenomenological distinction Berkeley makes.

