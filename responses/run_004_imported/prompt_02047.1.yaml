          *   Conclusion on Science: Supports Locke's "No" and his emphasis on learning. Doesn't definitively prove Berkeley's strong heterogeneity, but makes Locke's "common idea" claim tricky.
      *   **Part 3: Synthesis/Recommendation for the Paper:**
          *   Advise the user to frame Locke as an "Associationist" regarding the senses, distinct from Berkeley's "Heterogeneity" thesis.
          *   Locke denies *innate* connection; Berkeley denies *possible* direct connection.
          *   This is the precise nuance the user is looking for.

  5.  **Refine the Argument (Self-Correction/Nuance Check):**
      *   *Check:* Did Locke believe visible and tangible figure were the *same idea*?
      *   *Correction:* In Book II, Locke suggests that sight initially gives us a "flat" idea (light and colors) and we *learn* to perceive distance and 3D shape. This implies the immediate idea of sight is *not* the same as the idea of touch. So Locke *does* lean toward heterogeneity of the *immediate* ideas, even if he believes they refer to the same external primary quality.
      *   *Refinement:* I need to make sure I don't paint Locke as a naive realist here. He acknowledges the immediate objects of sight are different (light/color vs. resistance/shape). The "Figure" is a judgment *added* to sight via experience. This bridges the gap between Reading A and B.
      *   *Key Distinction:* Locke = Epistemological gap (need experience to link). Berkeley = Ontological/Phenomenological gap (no common content to link).
