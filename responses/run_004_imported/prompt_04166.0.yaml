answer: |-
  You have hit upon one of the most significant distinctions in social choice theory: the gap between *logical possibility* and *empirical probability*. Your intuition is correct, and it is shared by many political economists who work on institutional design. The standard pop-science interpretation of Arrow's Impossibility Theorem—that it proves democracy is mathematically broken—is a vast overstatement of its practical implications.

  Here is the strongest case for why Arrow's theorem is less damning for real-world democracy than it appears, centering on your insight about single-peaked preferences, while directly confronting the multi-dimensional objection.

  ### 1. The Theorem is a Boundary Marker, Not a Death Sentence
  Arrow's theorem is a "possibility proof." It demonstrates that there exists *at least one* configuration of preferences (a profile) under which no ranked voting system can satisfy a specific set of fairness criteria (Pareto efficiency, Non-dictatorship, and Independence of Irrelevant Alternatives) simultaneously.

  Crucially, it does not say that *all* preference profiles lead to paradox. It says that if you demand a system work perfectly for *every logically possible* profile (the Unrestricted Domain assumption), you will fail.

  This is analogous to physics. You could say, "It is impossible to build a perpetual motion machine." That doesn't mean engines are useless; it means there are thermodynamic boundaries within which engines must operate. Arrow's theorem defines the boundaries of social choice. It tells us: "If you want a stable outcome, you cannot have an unrestricted domain." It does not say stable outcomes are impossible; it says they require structure.

  ### 2. The Empirical Reality of Single-Peakedness
  Your reference to single-peaked preferences invokes Duncan Black's **Median Voter Theorem**. Black showed that if preferences are single-peaked along a single dimension, majority rule yields a stable Condorcet winner (the median voter's ideal point), and cycles vanish.

  Why should we believe real-world preferences are sufficiently single-peaked to make this relevant?

  *   **The Nature of Political Conflict:** While policy space is technically multi-dimensional (taxes, war, civil rights), political conflict is often reduced to a question of *distribution* or *degree*. Most voters prefer "some" public school funding, not "zero" or "infinite." They prefer a tax rate that is "optimal," not 0% or 100%. This inherent diminishing marginal utility creates single-peakedness naturally on many specific issues.
  *   **Cognitive Simplification:** Voters are not policy analysts. To manage cognitive load, voters project complex candidates onto a simple heuristic scale (Left/Right, Liberal/Conservative). Even if a voter's *true* utility function is complex, their *expressed* preference ordering often collapses into a single dimension. If voters behave *as if* they have single-peaked preferences, the mathematical conditions for stability are met, regardless of the underlying philosophical complexity.

  ### 3. Institutions *Create* Single-Peakedness (The Strongest Argument)
  This is the most critical point for defending real-world democracy. You rightly noted the objection that real politics bundles issues, which should create multi-dimensional chaos (the McKelvey Chaos Theorem). If voters have to vote on "Economic Policy + Cultural Values + Foreign Policy" simultaneously, preferences likely won't be single-peaked.

  However, democratic institutions are not passive receivers of preferences; they are **preference-structuring mechanisms**.

  *   **Party Discipline and Bundling:** Political parties exist, in part, to reduce dimensionality. By bundling a suite of policies into a single platform (Platform A vs. Platform B), parties force a multi-dimensional space back into a single choice. A voter may disagree with Party A on foreign policy but agree on economics. To vote, they must weigh these into a single utility score for "Party A." This aggregation effectively re-imposes single-peakedness on the *choice of government*, even if the underlying issues are complex.
  *   **Agenda Control:** Legislatures do not vote on everything at once. They use committees, rules of germaneness, and sequential voting. By breaking a complex budget into distinct bills (agriculture, defense, education), institutions isolate dimensions where single-peakedness is more likely to hold.
  *   **The Status Quo:** Real voting rarely happens in a vacuum. It is usually a choice between the Status Quo and a Proposal. This restricts the domain significantly. We aren't ranking all possible universes; we are deciding whether to move from point X to point Y. This binary nature sidesteps the cyclicality that requires three or more active options to manifest.

  In this view, Arrow's theorem doesn't prove democracy is impossible; it proves that **institutions are necessary.** Stable democracy requires structures (parties, committees, constitutions) that restrict the domain of choices to prevent the paradoxes Arrow identified.

  ### 4. "Satisfactory" vs. "Perfect"
  Arrow's theorem defines "satisfactory" in a way that no engineering system could ever meet. It requires a Social Welfare Function to produce a complete, transitive ranking of *all* alternatives that satisfies IIA (Independence of Irrelevant Alternatives).

  *   **Do we need a complete ranking?** No. Democracies only need to select a winner (or a governing coalition). We do not need a societal ranking of whether "Candidate C is better than Candidate D" if neither of them won.
  *   **The IIA Criterion:** IIA is the most controversial of Arrow's conditions. It states that the societal ranking between A and B should not change if C enters or leaves the race. In real politics, this is often an unreasonable demand. If a radical candidate (C) enters a race, they might change the context of the debate, revealing new information about A and B. Violating IIA isn't necessarily a "failure" of the system; it might be a feature of deliberative democracy.

  If we lower the bar from "Mathematically Perfect Social Welfare Function" to "Stable Selection of a Leader," the impossibility vanishes, especially under the restricted domains discussed above.

  ### 5. Confronting the Multi-Dimensional Objection
  You asked not to dodge the objection that many disputes are not single-peaked. This is the strongest counter-argument, often formalized as the **McKelvey-Schofield Chaos Theorem**. It suggests that in a multi-dimensional space with no restrictions, majority rule can lead anywhere; there is no equilibrium.

  Here is why this does not invalidate the defense of democracy:

  1.  **Chaos is Unstable:** While "anything can happen" in a chaotic system, random walks tend to cluster. Empirical studies of legislative voting often find that despite theoretical chaos, voting patterns remain remarkably stable over time. This suggests that while preferences *could* be multi-dimensional, social pressures (norms, party loyalty, ideology) constrain them enough to approximate stability.
  2.  **The "Core" Exists More Often Than Thought:** Recent computational political science suggests that even in multi-dimensional spaces, a "core" (a stable point that cannot be defeated by a majority) exists more frequently than the Chaos Theorem implies, provided voter preferences are correlated (which they are, due to the party system mentioned earlier).
  3.  **Legitimacy > Efficiency:** Even if a system occasionally produces a sub-optimal outcome due to preference cycling (which is rare in structured systems), the *process* of majority rule confers legitimacy. A system that avoids Arrow's paradox by using a dictator satisfies the math but fails the politics. A system that risks occasional instability but maintains public buy-in is "satisfactory" in the only sense that matters for governance.

  ### Conclusion
  Arrow's Impossibility Theorem is a profound logical insight, but it is often wielded as a conversation-stopper when it should be a conversation-starter. It tells us that we cannot have a perfect voting system that is indifferent to the structure of voter preferences.

  But we don't need indifference. We have political parties, constitutions, norms, and media ecosystems that structure preferences. We have a citizenry that tends to simplify choices into "more" or "less" (single-peakedness).

  Therefore, Arrow's theorem is not a proof that democracy is futile. It is a proof that **democracy requires institutions.** It demonstrates that a free-floating vote on anything at any time is unstable, but a structured democracy with parties, agendas, and constrained choices can—and does—produce stable, legitimate, and "satisfactory" outcomes. The theorem doesn't condemn real-world democracy; it merely explains why real-world democracy looks the way it does.
