answer: |-
  This is one of the most famous and technically rich debates in modern political philosophy. Your friend is relying on a standard move in welfare economics (the Harsanyi aggregation theorem), while you are sensing that Rawls is making a philosophical claim about the *limits* of that economic modeling.

  You are correct: Rawls is not simply "thumbing the scale." He is making a specific argument about why standard decision theory (Expected Utility) is inappropriate for choices regarding the basic structure of society.

  Here is a breakdown of the two arguments, exactly where they diverge, and an evaluation of which handles the device more consistently.

  ---

  ### 1. The Two Routes from the Veil

  #### Harsanyi's Route: The Impartial Observer
  John Harsanyi (a Nobel laureate in economics) argues that moral judgments are essentially preference judgments made under a "veil of ignorance."

  *   **The Setup:** You are an impartial observer. You know all the possible social positions in a society ($1$ to $N$) and the utility level associated with each ($U_1$ to $U_N$). You do not know which one you will occupy.
  *   **The Probability Assumption:** Harsanyi invokes the **Principle of Insufficient Reason** (Laplace). Since you have no evidence that you are more likely to be the king than the pauper, you must assign an equal subjective probability to occupying any given position ($1/N$).
  *   **The Decision Rule:** You are a rational agent. Rationality is defined by the von Neumann-Morgenstern axioms of **Expected Utility (EU) Maximization**.
  *   **The Calculation:** You choose the society that maximizes:
      $$ \frac{1}{N} \sum_{i=1}^{N} U_i $$
  *   **The Result:** This sum *is* average utility. Therefore, rational choice behind the veil entails Average Utilitarianism. To choose otherwise (e.g., to prioritize the worst-off) would be irrational risk-aversion, akin to refusing a fair bet because you might lose.

  #### Rawls's Route: The Original Position
  Rawls constructs the "Original Position" (OP) to model fairness, not just rationality.

  *   **The Setup:** Parties are mutually disinterested rational agents. They know general social theory but do not know their specific place in society, their talents, or their conception of the good.
  *   **The Probability Assumption:** Rawls explicitly **rejects** the Principle of Insufficient Reason. He argues the OP is a choice under **uncertainty**, not risk. There is no objective basis for assigning probabilities to social positions. To assign equal probability is to treat the choice as a gamble, which misrepresents the gravity of the situation.
  *   **The Decision Rule:** **Maximin.** You rank alternatives by their worst possible outcome and choose the one where the worst outcome is best.
  *   **The Justification:** Rawls argues Maximin is only rational under three specific conditions, all of which he builds into the OP:
      1.  **No Probability Knowledge:** (As above).
      2.  **Conception of the Good:** The parties care little for potential gains above the minimum guarantee. (Why risk starvation for a chance at being a billionaire?)
      3.  **Unacceptable Outcomes:** Some social positions involve conditions one cannot accept (e.g., slavery, destitution, loss of liberty).
  *   **The Result:** The Difference Principle. You arrange inequalities only if they benefit the least advantaged. This secures the "floor" against the unacceptable outcomes.

  ---

  ### 2. Where They Part Ways (The Cruxes)

  Your friend thinks the divergence is arbitrary. It is not. It rests on three substantive disagreements.

  #### A. Risk vs. Radical Uncertainty (The Probability Crux)
  This is the technical heart of the dispute.
  *   **Harsanyi** treats the Veil as a situation of **Risk**. In decision theory, "risk" means you don't know the outcome, but you *do* know the probability distribution. Harsanyi argues that without specific information, the only rational distribution is uniform.
  *   **Rawls** treats the Veil as a situation of **Uncertainty** (often called Knightian Uncertainty). He argues that in constitutional choice, there is *no* probability distribution. You aren't drawing a ball from an urn where you know the ratio of colors; you don't even know if there is an urn.
  *   **Why it matters:** Expected Utility theory collapses without probabilities. If you cannot assign $P$, you cannot calculate $P \times U$. Rawls argues that imposing equal probabilities is a hidden substantive assumption that biases the result toward utilitarianism.

  #### B. The Nature of the Choice (The "One-Shot" Crux)
  *   **Harsanyi** models the choice as one gamble among many in a life. If you lose this bet, you might win the next. Standard risk-neutrality applies over a long sequence of choices.
  *   **Rawls** argues the choice of basic justice is **unique, fundamental, and irreversible**. It determines the background conditions for all future choices. If you gamble on basic liberties or subsistence and lose, you may be unable to pursue any conception of the good at all.
  *   **Why it matters:** Rawls argues it is rational to be extremely risk-averse when the downside is the loss of the *capacity* to be a free citizen. Harsanyi assumes the downside is just "lower utility," which can be compensated for by the aggregate gain.

  #### C. The Currency of Justice (Primary Goods vs. Utility)
  *   **Harsanyi** relies on **Utility**. Utility is generally modeled as continuous and commensurable. You can trade off some liberty for some income if the utility gain is high enough. This smoothness is required for EU maximization.
  *   **Rawls** relies on **Primary Goods** (rights, liberties, opportunities, income, self-respect). Crucially, Rawls argues these are **lexically ordered**. Basic liberty cannot be traded for economic gain.
  *   **Why it matters:** You cannot run an Expected Utility calculation if the variables are not fungible. If "Self-Respect" is lexically prior to "Income," you cannot accept a 50% chance of doubled income if there is a 1% chance of losing self-respect. The EU model breaks down because the "cost" of the worst outcome is infinite (or lexical), forcing Maximin.

  ---

  ### 3. Evaluation: Which is More Consistent?

  If I have to take a side on which construction handles the Veil of Ignorance more consistently *on its own terms*, I side with **Rawls**, but with a caveat.

  **The Case for Harsanyi:**
  Harsanyi wins on *mathematical parsimony*. If you accept the standard Bayesian definition of rationality (which dominates economics and analytic philosophy), Harsanyi is right. If you are rational, you maximize expected utility. To do otherwise is to pay to avoid risk without a probabilistic justification. If the Veil is truly just an epistemic constraint, Harsanyi's derivation is tighter.

  **The Case for Rawls (The Winner):**
  Rawls wins on *political plausibility and the moral purpose of the device*.
  Rawls's crucial insight is that the Veil of Ignorance is not merely a heuristic for calculating rational self-interest; it is a **representation of fairness**.

  1.  **The "Gamble" Objection:** Rawls successfully argues that treating citizenship as a lottery is morally objectionable. A just society should not be one where it is "lucky" to be born free and "unlucky" to be born into servitude, even if the *average* welfare is higher. By rejecting the Principle of Insufficient Reason, Rawls prevents the reduction of persons to mere containers of utility.
  2.  **Stability:** Rawls asks: Which society can generate its own support over time? A utilitarian society asks the worst-off to accept their position because it helps the aggregate. Rawls argues this is unstable; the worst-off will eventually resent being sacrificed. The Difference Principle assures everyone that the system works for them.
  3.  **The Definition of Rationality:** Rawls challenges the Harsanyi premise that "Rationality = Expected Utility." He argues rationality is context-dependent. It is rational to maximize EU when choosing a breakfast cereal; it is irrational to maximize EU when choosing the constitutional principles that govern your life.

  **The Verdict:**
  Your friend is correct that *if* you accept standard decision theory axioms, Rawls looks like he is rigging the game. But Rawls's deeper argument is that **standard decision theory is the wrong tool for the job.**

  Rawls handles the Veil more consistently because he recognizes that the Veil changes the *nature* of the choice. It transforms the choice from a strategic game into a moral constraint. Harsanyi tries to derive morality from rationality (assuming rationality is fixed). Rawls constructs a scenario where the definition of rationality is shaped by the moral requirement to treat persons as ends, not means.

  **How to win the argument at the next dinner:**
  Tell your friend: *"Harsanyi assumes the parties behind the veil are gamblers. Rawls assumes they are trustees. If you are gambling with chips, maximize expected value. If you are trusteeshiping the basic rights of citizens that cannot be revoked, you secure the floor. The Veil isn't just about ignorance; it's about the stakes. If the stakes are your fundamental status as a free person, Expected Utility is irrational."*
