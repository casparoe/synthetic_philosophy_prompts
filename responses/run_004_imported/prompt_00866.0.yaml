answer: |-
  This is one of the most fascinating "footnotes" in the history of philosophy, and you are absolutely right to latch onto it. It feels jarring to the modern mind because we tend to categorize "rigorous analytic philosophy" and "ghost hunting" into mutually exclusive boxes.

  However, historians of philosophy generally agree that this wasn't a contradiction or a secret hobby. It was actually a **direct extension of his philosophical project.**

  Here is the breakdown of why Sidgwick—the hyper-rational utilitarian—spent two decades investigating telepathy and mediums, and why it makes perfect sense within the framework of *The Methods of Ethics*.

  ### 1. The "Dualism of Practical Reason"
  To understand the psychical research, you have to look at how *The Methods of Ethics* ends. Most textbooks stop at the "Hedonistic Utilitarianism" part, but the book ends on a deeply troubling note for Sidgwick.

  He identifies what he calls the **Dualism of Practical Reason**.
  *   **Rational Egoism:** It is rational to pursue my own happiness.
  *   **Rational Benevolence (Utilitarianism):** It is rational to pursue the general happiness.

  Sidgwick rigorously shows that there is no logical way to prove that these two always align in *this* life. Often, doing the moral thing ruins your own happiness, and pursuing your own happiness hurts the general good. For a utilitarian system to be fully rational, there needs to be a guarantee that virtue leads to happiness.

  In a secular, materialist world, that guarantee doesn't exist. Sidgwick realized that for ethics to be truly rational, there must be a **"Divine Government"** or an **afterlife** where justice is ultimately meted out. Without an afterlife, morality might just be a noble delusion.

  ### 2. Psychical Research as Empirical Theology
  Sidgwick was an empiricist. He didn't want to *believe* in God or the afterlife on faith (like a religious person) or dismiss it on dogma (like a hard materialist). He wanted **evidence**.

  In the late 19th century, the boundaries of "science" were different. Many intellectuals believed that if spiritual phenomena (telepathy, survival of consciousness after death) were real, they should be subject to empirical observation.

  Sidgwick didn't join the Society for Psychical Research (SPR) because he loved ghost stories. He joined because he was desperate to find **scientific proof of the survival of consciousness.**
  *   If he could prove scientifically that consciousness survives death, he could solve the Dualism of Practical Reason.
  *   If there is an afterlife, the utilitarian calculus changes. You can endure suffering now for a greater good later, knowing that the cosmic ledger will eventually balance.

  As he famously wrote in a letter: *"I am interested in the question [of immortality]... because it seems to me that if we could establish the existence of a future life... it would afford the only basis for a complete reconciliation of Egoism and Utilitarianism."*

  ### 3. He Was a Skeptic, Not a Mystic
  This is the key distinction. Sidgwick was not a "secret mystic." He approached psychical research with the same ruthless skepticism he applied to ethical intuitionism.

  *   **He exposed frauds:** Sidgwick and the SPR spent a massive amount of energy debunking fake mediums. He wasn't looking to confirm his biases; he was testing a hypothesis.
  *   **He remained agnostic:** Despite 20 years of research, Sidgwick never claimed to have found conclusive proof. He died still uncertain.
  *   **Methodological Consistency:** He treated psychical phenomena as natural phenomena that happened to be rare. He believed that excluding them from scientific inquiry *a priori* was dogmatic, just like religious belief was.

  So, he wasn't abandoning rationalism for mysticism; he was **expanding the scope of empiricism** to include data that mainstream science was ignoring.

  ### 4. The Victorian Crisis of Faith
  You also have to contextualize this historically. Sidgwick lived during the peak of the Victorian crisis of faith. Darwin had undermined religious dogma, but the human need for moral meaning remained.

  Many serious intellectuals of the time (including William James in the US) engaged in psychical research. It wasn't seen as "fringe" in the way it is today; it was seen by some as the cutting edge of trying to reconcile science and spirituality. For Sidgwick, the materialist worldview was morally dangerous because it removed the sanction for duty. He was fighting against nihilism.

  ### 5. The Tragic Irony
  There is a profound sadness to Sidgwick's story.
  *   In his philosophy, he constructed one of the most robust, rational systems of ethics ever written.
  *   But he personally felt that the system rested on a hope (the afterlife) that he could not prove.
  *   He spent 20 years looking for the "keystone" to lock his ethical arch in place, and he never found it.

  Some biographers suggest this contributed to his mental exhaustion and eventual death. He was a man who needed rational proof for moral hope, and the universe wouldn't give it to him.

  ### Summary
  Your professor glossed over it, but you found the key to understanding Sidgwick's deeper motivations.

  *   **Was it a contradiction?** No. It was an attempt to solve the biggest problem in his ethical system (the Dualism of Practical Reason).
  *   **Was he a mystic?** No. He was a hyper-rationalist who hoped empirical data could validate the premises required for morality to make sense.
  *   **Was it unrelated?** No. It was the practical application of his theoretical despair.

  Sidgwick isn't the guy who wrote a rational book and then went crazy chasing ghosts. He is the guy who wrote a rational book, realized it required a metaphysical premise to work, and then spent the rest of his life trying to scientifically verify that premise. That makes him arguably *more* consistent, not less.
