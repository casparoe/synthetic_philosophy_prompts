answer: |-
  This is a classic debate between **Standard Neoclassical Economics** (your friend the economist) and **Behavioral Economics/Psychology** (your friend the psychologist). Since you come from a background in foraging behavior, you'll recognize this immediately: it's the difference between assuming an organism *is* an optimizer versus trying to measure *how* it optimizes given cognitive constraints.

  Here is the breakdown of moves (1) through (6), evaluating who is holding the stronger ground at each step.

  **(1) The Economist:** *"Whatever someone consistently chooses just IS their preference..."*
  *   **Who is right:** **Economist (Technically).**
  *   **Analysis:** In standard Revealed Preference Theory (Samuelson, 1938), this is the axiom. Preference is not a mental state; it is a binary relation derived from choice. If $A$ is chosen over $B$, $A \succeq B$. To an economist of this school, saying "he prefers quitting but chooses smoking" is a logical contradiction, like saying "this triangle has four sides."
  *   **Caveat:** This defines preference as *decision utility* (what drives choice), not *experienced utility* (what brings satisfaction/health).

  **(2) The Psychologist:** *"That's nuts... conceptually impossible to ever act against your own considered desires..."*
  *   **Who is right:** **Psychologist.**
  *   **Analysis:** The psychologist correctly identifies that the strict economic definition renders the concept of *akrasia* (weakness of will) logically impossible. If choice defines preference, you can never choose against your preference. This contradicts clinical reality and introspection, where people reliably report distress about their own choices. The economist's definition is too narrow to capture the phenomenon of addiction.

  **(3) The Economist:** *"...refuses to call something a preference unless it shows up in a choice -- 'I want to quit' is cheap talk..."*
  *   **Who is right:** **Draw (Methodological vs. Ontological).**
  *   **Analysis:** The economist is methodologically correct: self-reports are often noisy or strategic ("cheap talk"), whereas choices involve budget constraints and real consequences. However, the psychologist is ontologically correct: just because a signal is noisy doesn't mean the underlying state (the desire to quit) doesn't exist. In biology, if a forager eats toxic prey, we don't say it "preferred" death; we say its information processing failed. The economist is conflating *measurement* with *reality*.

  **(4) The Psychologist:** *"...economists invoke exactly this 'he doesn't really want this' idea themselves, e.g. to justify cigarette taxes..."*
  *   **Who is right:** **Psychologist.**
  *   **Analysis:** This is a checkmate on the economist's claim of professional consensus. Modern "Behavioral Public Economics" explicitly relies on the distinction between a person's "doing self" (addicted) and "planning self" (wants health). Sin taxes are often justified by "internalities" (harm the smoker inflicts on their future self). The economist's friend is using a textbook definition that the profession's policy wing has already moved beyond.

  **(5) The Economist:** *"...picking one of those models is a modeling decision, not a fact about what he 'really' wants."*
  *   **Who is right:** **Economist (Philosophically).**
  *   **Analysis:** This is a retreat to *instrumentalism* (associated with Milton Friedman). The argument is that models are tools for prediction, not maps of truth. Whether we model the brother-in-law as one agent with high discount rates or two agents in conflict depends on which math predicts his future purchases better. There is no "God's eye view" of preference. This is a sophisticated defense.

  **(6) The Psychologist:** *"...concedes his whole point: there's no fact of the matter about 'the' revealed preference without first assuming some model..."*
  *   **Who is right:** **Psychologist.**
  *   **Analysis:** The psychologist traps the economist. In move (1), the economist claimed choice *reveals* preference objectively. In move (5), she admitted you need a psychological model to interpret the choice. If you need a model of the "self" to interpret the choice, then preference is not *purely* revealed by the choice alone; it is inferred from choice + psychological assumptions. This undermines the core claim of Revealed Preference Theory that it avoids "mentalistic" explanations.

  ### What Both Are Missing

  1.  **Decision Utility vs. Experienced Utility:** Your economist friend is talking about *Decision Utility* (the weight assigned to an option at the moment of choice). Your psychologist friend is talking about *Experienced Utility* (the actual hedonic outcome or welfare). Economics actually has a name for this split (popularized by Kahneman), but your friend was defending the older, stricter definition.
  2.  **The Foraging Analogy:** As a biologist, you know that if an animal consistently chooses a path that lowers its fitness, we don't say the animal "prefers" lower fitness. We look for constraints, information asymmetry, or evolutionary mismatch. The psychologist is essentially arguing for an "evolutionary mismatch" model (modern cigarettes vs. ancient brains), while the economist is insisting on treating the behavior as the fitness function itself.
  3.  **Time Inconsistency:** The core mathematical issue here isn't really preference; it's *discounting*. The brother-in-law likely has hyperbolic discounting (valuing "now" disproportionately higher than "later"). Both friends are arguing over the label "preference," when the math is actually about time-inconsistent discount rates.

  ### Overall Assessment

  The Economist started with a rigid definition that is technically coherent but empirically brittle. The Psychologist successfully demonstrated that to make the economics useful for real-world policy (like taxes) or clinical understanding (like addiction), you must import psychological assumptions about internal conflict. By move (6), the Economist admitted that "preference" depends on the model chosen, which validates the Psychologist's claim that choice alone doesn't tell the whole story.

  \verdict{Psychologist}
