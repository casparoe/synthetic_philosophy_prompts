      *   *Key Distinction:* Aquinas distinguishes between a *king* (rules for the common good) and a *tyrant* (rules for private good).
      *   *Key Distinction on Removal:* He distinguishes between *usurpers* (seized power illegitimately) and *legitimate rulers who become tyrannical*.
      *   *Key Distinction on Action:* He is generally *against* private individuals taking matters into their own hands (sedition/assassination). He prefers public authority or a higher power to remove the tyrant.
      *   *Nuance:* He acknowledges extreme cases but warns against the dangers of failed attempts (making tyranny worse) and the moral hazard of encouraging sedition.

  3.  **Address Question 1: Legitimate Election vs. Usurper:**
      *   *Aquinas's View:* Yes, this matters significantly.
      *   *Usurper:* If someone seizes power by force without right, Aquinas is more open to resistance (sometimes even by private individuals, though he's cautious).
      *   *Legitimate Ruler turned Tyrant:* If the authority was granted by the community (or a superior authority like the Emperor/Pope in his context), the community cannot simply revoke it unilaterally without due process or superior intervention. The initial consent creates a bond.
      *   *Application to Scenario:* The leader was elected (consent of the governed). This makes him a legitimate ruler *initially*. His subsequent actions make him tyrannical, but the *source* of his authority was valid. This makes removal harder under Aquinas's framework than if he were a coup leader.

