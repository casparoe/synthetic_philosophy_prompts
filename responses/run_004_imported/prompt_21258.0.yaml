      *   *Summa Theologiae:* He explicitly condemns sedition. Killing a tyrant privately is usually seen as sinful unless authorized by public authority.
      *   *Application to Scenario:* A "random citizen" acting alone or in a private cabal is *not* justified under Aquinas's standard moral theology.

  5.  **Address Question 3: Own People vs. Foreign Spies:**
      *   *Aquinas's View:* Foreign intervention is generally worse.
      *   *Reasoning:* A tyrant is an internal evil. Foreign intervention introduces external domination, which might be worse than the tyranny itself. It violates the sovereignty of the community.
      *   *Own People:* If "public authority" (e.g., parliament, electors, lesser magistrates) acts, it's more acceptable. But private citizens acting as "foreign spies" would is definitely out.
      *   *Application to Scenario:* Foreign spies assassinating the leader would be seen as an act of war/aggression, not justice. Aquinas values the common good of *that* specific community. Foreign interference usually harms the common good.

