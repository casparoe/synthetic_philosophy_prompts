answer: |-
  This is a fantastic question that cuts right to the tension in Aquinas's political thought. You're hitting on one of the most debated aspects of his work, specifically found in *De Regno* (On Kingship) and the *Summa Theologiae*.

  Aquinas is often misquoted as a champion of tyrannicide, but if you read his actual criteria, he is surprisingly conservative. He is much more worried about the chaos of sedition than he is eager to sanction assassination.

  Here is how Aquinas would likely break down your scenario based on his own categories.

  ### 1. The Source of Power: Usurper vs. Legitimate Ruler
  You asked if the fact that the leader was **initially elected** changes the calculus. For Aquinas, **yes, it changes everything.**

  Aquinas distinguishes between two types of tyrants:
  *   **The Usurper (*tyrannus ex defectu tituli*):** Someone who seizes power without any legal or moral right (a coup leader).
  *   **The Abusive Ruler (*tyrannus ex parte exercitii*):** Someone who has a legitimate title (like your elected leader) but rules unjustly.

  **For the Usurper:** Aquinas is more permissive. In *De Regno*, he suggests that if someone seizes power by force without the consent of the community, removing them is not strictly sedition. In some readings, he allows that a private individual might act here because the usurper has no bond of allegiance with the people.

  **For the Legitimate Ruler turned Tyrant:** This is your scenario. Because the leader was elected, there is a covenant or bond between the ruler and the ruled. The authority was granted by the community (or a superior authority). Aquinas argues that **the community cannot simply revoke that authority unilaterally through private violence.** To do so violates the order of justice. If the people granted the power, only a process representing the people (public authority) can revoke it, not a random individual.

  ### 2. The Agent: Random Citizen vs. Public Authority
  This is the biggest hurdle for your "random citizen" assassin. **Aquinas generally says no.**

  In *Summa Theologiae* (II-II, Q. 42, Art. 2), Aquinas defines sedition as a sin against the unity and peace of the people. He argues that killing a tyrant privately is dangerous for several reasons:
  1.  **The Risk of Failure:** If the assassination fails, the tyrant will likely become much more brutal and paranoid, making the situation worse for everyone.
  2.  **The Risk of Success:** Even if successful, the assassin might become the next tyrant, or the power vacuum could lead to civil war (which Aquinas views as worse than a single tyrant).
  3.  **Moral Order:** Private citizens do not have the authority to execute judgment on a superior. That belongs to God or a higher public authority.

  **The Exception:** Aquinas does mention the Old Testament story of Ehud killing King Eglon. However, he frames this as a specific instance of **divine inspiration**, not a general political rule. He does not think a modern citizen can claim "God told me to do it" as a legal defense.

  **The Solution:** Aquinas prefers that a **public authority** remove the tyrant. In a medieval context, this might be the Emperor removing a local king, or the Pope intervening. In a modern constitutional context, Aquinas would likely point to impeachment, voting (if still possible), or the actions of "lesser magistrates" (like state governors, the judiciary, or legislative bodies) who have their own independent authority to check the executive.

  ### 3. The Outsiders: Domestic Plotters vs. Foreign Spies
  Aquinas would almost certainly say **foreign intervention is worse.**

  Aquinas's political philosophy is built on the idea of the *common good* of a specific community.
  *   **Domestic Resistance:** While private assassination is bad, resistance organized by the community's own representatives (the "public authority" mentioned above) is permissible because it aims to restore the common good of *that* society.
  *   **Foreign Intervention:** If a foreign country sends spies to kill the leader, Aquinas would view this as an act of war or aggression, not justice. Even if the leader is a tyrant, foreign intervention usually results in the subjugation of the people to a foreign power. For Aquinas, being ruled by a local tyrant is preferable to being conquered by a foreign power, because the local tyrant is at least part of the political body, whereas the foreign power is an external threat to the community's existence.

  ### The Verdict according to Aquinas
  If you put Aquinas in a room with this scenario, his judgment would likely look like this:

  1.  **Is he a tyrant?** Yes. Ruling for private gain and destroying the rule of law fits the definition.
  2.  **Can a random citizen kill him?** **No.** Because the leader was initially legitimate, private assassination is sedition. It violates the moral order and risks greater chaos.
  3.  **Can the people remove him?** **Yes, but through procedure.** The "public authority" (legislature, courts, electors) that originally granted or checks the power must be the ones to depose him.
  4.  **Can foreigners do it?** **No.** That violates the sovereignty of the community and likely harms the common good more than it helps.

  ### Why this matters for your class
  The reason Aquinas is so cautious is that he lived in a time of constant feudal warfare. He saw that "tyrannicide" was often just an excuse for political murder that led to decades of instability.

  He essentially argues that **order is a prerequisite for justice.** You cannot achieve justice by destroying order (through private assassination). You must use the structures of order (public authority) to remove the injustice.

  In your modern scenario, Aquinas would argue that the moment the leader cancels elections and guts the courts, the *public authority* (like the legislature or the courts themselves) has a duty to act. If they fail, the people must endure and pray for deliverance, rather than taking the law into their own hands, because the moral risk of anarchy is, in his view, higher than the suffering under a tyrant.

  It's a hard pill to swallow for modern democrats, but it's consistent with his view that the universe has a divine order that private individuals shouldn't disrupt.
