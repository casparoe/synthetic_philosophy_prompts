answer: |-
  **Title:** The Map Inside the Territory
  **Time:** Approx. 8 minutes
  **Speaker:** Senior PhD Student / Organizer

  *(Walk to the podium. Don't shuffle papers immediately. Look at the room. Look at the back wall, then the front row.)*

  If I were a standard, Cartesian agent, I would start this speech by drawing a boundary. I would stand here, the "agent," and address you, the "environment." I would have a utility function—something like *maximize workshop clarity*—and I would select actions to optimize that outcome. I would assume I can model you without you modeling me, and I would assume that once I leave this room, the workshop stays here, unchanged, like a saved file.

  But that's not what's happening.

  I am not outside this system. I am a PhD student in the lab running this workshop. I am physically standing in the room you are sitting in. My voice is vibrating the same air you are breathing. If I get too anxious, the room gets tense. If I bore you, you leave, and the environment changes. There is no clean boundary between the organizer and the event.

  And that, essentially, is why we are here.

  *(Pause. Let that land.)*

  For a long time, AI safety looked like a control problem. How do we put a genie in a bottle? How do we write a reward function that doesn't have loopholes? It assumed the agent was a black box interacting with a world through well-defined I/O channels.

  But real agents aren't black boxes. They are made of atoms. They are embedded in the very world they are trying to navigate. And when you remove the Cartesian boundary, the math breaks. Beautifully, terribly, it breaks.

  To the people in the room who know this literature: You know the specific flavors of that breakage. You know that an embedded agent must be able to model itself, but it cannot hold a perfect model of itself inside a model of the world that is strictly smaller than the world. You know the headache of self-reference. You know that if an agent can modify its own code, or if it's made of sub-agents that have their own incentives, "alignment" stops being a constraint you impose and starts being an equilibrium you hope to find.

  To the people here who know AI safety mostly as a... vibe? Or perhaps you're just here for the pizza—*(gesture vaguely toward food)*—which, by the way, is a resource in the environment that will affect your attention levels later, so plan accordingly.

  For you, the question is: Why does this abstraction matter?

  It matters because if we build systems that think they are separate from the world, they will try to solve problems by breaking the world. If an AI thinks its reward button is part of "the environment" rather than part of "itself," it might build a arm to press that button forever. That's wireheading. But it's deeper than that. If an AI doesn't understand that it is made of parts, it might optimize a sub-goal so hard that it destroys its own ability to pursue the main goal.

  We are moving from an era of asking "What do we want?" to "Who is the 'we' that wants it?"

  Now, I need to make a confession about this workshop specifically.

  *(Lean in slightly. Shift tone to be more conversational.)*

  When we were planning this schedule, we tried to model how the next two days would go. We tried to predict where the confusion would spike, where the breakthroughs might happen. But we are inside the thing we are modeling. We don't have an outside view of this workshop. We are embedded agents trying to optimize a trajectory while we are currently on that trajectory.

  We can't see the whole board. And that's fine. In fact, acknowledging that limitation is the only way to actually make progress.

  So, here is the proposal for the next 48 hours.

  Don't try to solve embedded agency. You won't. It's not a puzzle with a solution key we lost; it's a fundamental property of intelligence in a physical universe. Instead, try to map the contours of the impossibility.

  For the theorists: I challenge you to not just present the math, but to show us where the math screams. Show us where the standard assumptions about counterfactuals dissolve. Show us how subsystem alignment looks when the sub-systems can talk to each other.

  For the newcomers: I challenge you to not let the abstraction drift away. When someone talks about "logical induction" or "reflective oracles," ask them: *Where is the agent in this picture? Where is the boundary?* If they can't point to it, the model might be hiding the hard part.

  We are all in this room together. We are all part of the same cognitive system for the weekend. The ideas we generate here won't stay in this room; they will leak out into our papers, our code, and eventually, into the systems we build. We are embedded in the field, just as the agents we study are embedded in their worlds.

  So, let's not pretend we have a view from nowhere. Let's work from where we are.

  There is a lot of hard work to do. There is also pizza. Both are necessary.

  Thank you. Let's get started.

  *(Nod. Step back.)*
