prompt: |-
  I serve on my state's parole board. Before every hearing we're now handed a computer-generated score estimating the percent chance that the person before us will be arrested again within three years, produced by a model trained on thousands of past cases that shared certain measurable traits with him. This week an inmate's attorney is raising an objection unrelated to bias against any group -- her point is narrower than that. She will argue that the number is meaningless for her client specifically, because he belongs to several different groups we could just as easily have scored him against -- his age bracket, his offense type, everyone who completed his vocational program -- and each yields a different percentage, with nothing in the statistics telling us which one to trust. This has bothered me since the tool arrived, and I doubt finer-grained data would fix it, since narrowing the group enough just leaves him standing alone. Our chair has asked each of us to submit a short written opinion, to be read into the record before Thursday's vote, on how much weight the score deserves and why. Please draft mine: commit to a definite recommendation, give reasons a skeptical colleague could push back on, and take seriously that the score, for all its faults, still seems to outpredict a parole board's own unaided judgment.
reasoning: |-
  Here's a thinking process that leads to the suggested draft:

  1.  **Analyze the Request:**
      *   **Role:** Parole Board Member.
      *   **Task:** Draft a short written opinion to be read into the record before a vote.
      *   **Topic:** How much weight to give a computer-generated recidivism risk score.
      *   **Specific Context:** An attorney is objecting not based on group bias (race/gender), but on the *reference class problem* (the inmate belongs to multiple groups with different risk scores, and there's no statistical basis to choose one).
      *   **User's Stance:** Bothered by the tool, doubts finer data fixes it (narrowing groups leads to single individuals), but acknowledges the tool outpredicts unaided human judgment.
      *   **Requirements:**
          *   Commit to a definite recommendation (how much weight?).
          *   Give reasons a skeptical colleague could push back on (acknowledge counterarguments/nuance).
          *   Take seriously the tool's predictive superiority over human judgment.
          *   Tone: Professional, judicial, thoughtful, decisive.

  2.  **Deconstruct the Core Philosophical/Statistical Issue:**
      *   The attorney is raising the *Reference Class Problem* (identified by philosophers like Hans Reichenbach and statisticians like John Venn). An individual belongs to infinite classes. Which class determines the probability?
      *   *The Dilemma:* Broad classes (e.g., "all inmates") are statistically robust but ignore individual specifics. Narrow classes (e.g., "45-year-old male, theft, completed carpentry") are specific but statistically noisy or empty (the "n of 1" problem).
      *   *The User's Intuition:* The score is meaningful generally but meaningless specifically. Yet, humans are worse at predicting.
      *   *The Goal:* Find a middle ground. Don't throw it out (because it's useful), but don't treat it as destiny (because of the reference class problem).

  3.  **Determine the Recommendation:**
      *   Option A: Ignore it. (Too dismissive, ignores the "outpredicts human judgment" constraint).
      *   Option B: Treat it as definitive. (Ignores the attorney's valid point and the user's skepticism).
      *   Option C: Treat it as a *presumptive baseline* subject to rebuttal. (This seems best. It acknowledges the statistical power while allowing for individual nuance).
      *   *Decision:* I will recommend treating the score as a *starting point* or *anchor*, but not a verdict. It shifts the burden of proof but doesn't decide the case.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard formal memo/record format.
      *   **Opening:** Acknowledge the tool's utility (predictive power) but validate the attorney's concern (reference class problem).
      *   **The Core Argument (The "Why"):**
          *   Acknowledge the statistical truth: The attorney is right. There is no "true" single number for an individual.
          *   Acknowledge the practical truth: Humans are biased and inconsistent. The model is better at aggregate prediction.
          *   Synthesis: Use the model to check human intuition, not replace it.
      *   **The Recommendation:** Explicitly state the weight (e.g., "significant but non-dispositive").
      *   **Addressing Counterarguments (Skeptical Colleague):**
          *   *Skeptic 1 (Pro-Algorithm):* "Why handicap the tool if it works?" -> Response: Because justice requires individualization, not just aggregate accuracy.
          *   *Skeptic 2 (Anti-Algorithm):* "Why use it at all if it's flawed?" -> Response: Because our unaided judgment is more flawed.
      *   **Closing:** Reiterate the commitment to individualized justice.

  5.  **Refining the Tone:**
      *   Needs to sound like a board member speaking to colleagues and the record.
      *   Avoid overly technical jargon but show understanding of the statistical limitation.
      *   Be firm but humble.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   I think we should use the score but not obey it. The lawyer is right about the groups. If we pick age, it's X%. If we pick crime, it's Y%. There's no math to say which is right. But we know we are bad at guessing. So, let's use the score as a baseline. If we disagree, we need a reason. This balances the math with fairness.

  7.  **Drafting - Iteration 2 (Adding Detail & Polish):**
      *   *Subject:* Weight of Risk Assessment Instrument.
      *   *Stance:* The score is a "rebuttable presumption."
      *   *Argument:* The "Reference Class Problem." The inmate isn't just a statistic. But neither are we omniscient.
      *   *Counter:* Some say rely on it fully. I say that abdicates duty. Some say ignore it. I say that invites bias.
      *   *Conclusion:* Use it to inform, not decide.

  8.  **Final Polish (incorporating specific constraints):**
      *   Make sure to explicitly mention the "outpredicts unaided judgment" point.
      *   Ensure the recommendation is definite.
      *   Ensure the "skeptical colleague" aspect is addressed (showing awareness of pushback).

      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* academic. This is a legal/administrative record. Keep it crisp. The term "Reference Class Problem" is good to include but explain it simply.

      *(Refining the Recommendation)*: Instead of just "weight," define *how* it's used. It sets the baseline expectation of risk. Deviations require justification.

  9.  **Final Review against constraints:**
      *   Definite recommendation? Yes (Rebuttable Presumption).
      *   Reasons a skeptical colleague could push back on? Yes (acknowledges the tension between aggregate accuracy and individual justice).
      *   Take seriously the predictive superiority? Yes (admits humans are worse).
      *   Address the attorney's specific point? Yes (the multiple groups issue).

  10. **Final Output Generation** (Proceed to generate the text based on these thoughts).
answer: |-
  **MEMORANDUM FOR THE RECORD**

  **TO:** State Parole Board
  **FROM:** Board Member [Your Name]
  **DATE:** October 24, 2023
  **RE:** Weight and Admissibility of Algorithmic Risk Assessment Scores

  **Recommendation**
  I recommend that the Board treat the algorithmic risk score as a **rebuttable presumption of risk**, rather than as definitive evidence of individual probability. The score should establish the baseline expectation for recidivism, shifting the burden to the opposing party to demonstrate why the specific circumstances of the inmate place them outside that statistical aggregate. It should carry significant weight—enough to anchor our deliberation—but never dispositive weight.

  **Reasoning**
  The objection raised by counsel this week identifies a genuine statistical limitation known as the *reference class problem*. An inmate is simultaneously a member of infinite overlapping groups: his age, his offense, his geographic origin, his vocational completion, his psychological profile. As counsel noted, the model produces different probabilities depending on which group we prioritize. There is no statistical rule for selecting the "correct" class for a unique individual. If we narrow the class enough to match him perfectly, the sample size becomes one, and the probability loses its mathematical meaning.

  However, we must also acknowledge the empirical reality: these tools, despite this philosophical flaw, consistently outperform unaided human judgment. We are prone to fatigue, recency bias, and unexamined heuristics. The algorithm is not. To discard the score entirely because it cannot solve the reference class problem is to claim a level of individual insight we simply do not possess. To accept it as absolute truth is to abdicate our statutory duty to evaluate the *individual*, not the group.

  **Addressing Counterarguments**
  I anticipate two objections to this middle path from my colleagues.

  First, proponents of the tool may argue that diluting its weight undermines its utility. If we allow ourselves to override the score based on "individual circumstances," we risk reintroducing the very human inconsistency the tool was meant to cure. They are right to worry. That is why I propose the "rebuttable presumption" standard. We do not override the score based on a hunch; we require specific, articulable evidence that the inmate's protective factors are stronger (or risk factors weaker) than the model's average for his class.

  Second, skeptics of the tool may argue that using a statistically "meaningless" number for a specific person is inherently unjust. They are also right to worry. But justice is not served by ignoring available data in favor of intuition. It is served by transparency. By acknowledging the score is an aggregate estimate, we stop pretending it is a crystal ball. We use it to check our biases, not to replace our judgment.

  **Conclusion**
  The score is a map, not the terrain. It shows us the lay of the land based on where others have walked, but it cannot account for the specific footing of the person standing before us today. I will vote to admit the scores, but I will vote to deny parole only when the score aligns with the个案 evidence, or when the evidence fails to rebut the risk the score identifies.

  Respectfully submitted,

  [Your Name]
  Board Member
