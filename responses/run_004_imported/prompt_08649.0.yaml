  *(Self-Correction during drafting)*: I need to be careful not to make it seem like she *has* a body she can't feel, but rather that the *concept* of the body becomes irrelevant. Avicenna's point is that the self-affirmation remains even if the body's existence is doubted. I should have her doubt the body's existence entirely, not just the sensation of it.

  Let's write.

