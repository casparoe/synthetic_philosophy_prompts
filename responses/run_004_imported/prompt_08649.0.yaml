answer: |-
  The transition wasn't a fade. It was a severance.

  One moment, Kael was standing on the pad, the hum of the transit gate vibrating through the soles of his boots, the smell of ozone and recycled air sharp in his nose. He was checking the chrono on his wrist, feeling the cool metal against his pulse.

  The next moment: Silence. Not the absence of noise, but the absence of the medium that carries it.

  Kael waited for the impact of arrival. He waited for the lurch of gravity reasserting itself, the way the otoliths in his inner ear usually tugged downward to tell him which way was down.

  There was no tug.

  He tried to inhale. Or rather, he sent the command to inhale. He expected the expansion of the diaphragm, the rush of cold air into the lungs, the rise of the ribcage.

  Nothing happened.

  Not paralysis. Paralysis implies resistance. Paralysis is a muscle refusing an order. This was… nothing. There was no muscle to refuse. There was no chest to rise. There was no air to rush.

  *Panic.*

  It hit him like a physical blow, except there was no body to receive the blow. The adrenaline spiked in a mind that had no bloodstream to carry it. He tried to scream, but there was no throat to constrict, no vocal cords to vibrate.

  *Okay. Stop. Think.*

  Kael tried to impose order on the chaos. He was a navigator. He understood vectors. He understood position.

  *Where am I?*

  He searched for the horizon. There was no light, so there was no dark to contrast it against. It wasn't blackness; blackness is a visual input. This was the absence of vision.

  *Am I falling?*

  He waited for the stomach-drop sensation of freefall. He waited for the wind rush. He waited for the rotation.

  His vestibular system, the ancient gyroscope of his biology, was silent. No semicircular canals detected rotation. No utricle detected linear acceleration. He was not falling. He was not rising. He was not stationary. Those words required a reference frame, and he had none.

  *Am I dead?*

  The thought floated in the void. If he were dead, would he be thinking? The question felt like a trap.

  He tried to find his boundaries. Usually, the self ends where the skin begins. The world is *out there*; I am *in here*. He tried to locate his hands. He sent a signal: *Clench left fist.*

  In a normal body, this generates a cascade of proprioceptive data. Muscle spindles fire, reporting tension. Joint receptors report angle. The brain updates the body schema.

  Here, the command went out into the white noise and returned no echo.

  Did the hand clench? He didn't know. Did he have a hand? He didn't know.

  He tried to touch his face. A fundamental grounding exercise. *Hand to cheek.* He visualized the movement. He felt the *intent* of the movement. But there was no collision. No warmth of skin on skin. No pressure.

  The horror began to creep in, cold and absolute. It wasn't the fear of pain. It was the fear of dissolution. Without the constant, low-level hum of proprioception, the brain loses the map of the self. He knew this theoretically—sensory deprivation studies, the old papers on deafferentation. But knowing it and living it were different things.

  Without the body, where did *he* stop?

  If he had no limbs, was he a torso? If he had no torso, was he a head? If he had no head to house the ears that couldn't hear, what was left?

  *I am thinking.*

  The thought was sharp. It didn't need a tongue to form. It didn't need ears to register. It just *was*.

  *I am afraid.*

  The emotion existed without a heartbeat to race. The fear was pure, unmediated by chemistry. It was a geometric shape of dread suspended in the nothing.

  *Do I exist?*

  He waited for the doubt to swallow him. If he couldn't verify his body, if he couldn't verify the space around him, maybe he was a ghost. A glitch. A memory playing in a dead machine.

  He tried to summon his name. *Kael.*

  The sound didn't echo, but the concept held. It felt heavy. Real.

  *Why does it feel real?*

  He stripped away the layers.

  Take away the sight of the transit gate. Gone.
  Take away the sound of the hum. Gone.
  Take away the smell of ozone. Gone.
  Take away the feeling of the boots. Gone.
  Take away the arms, the legs, the breath, the heart. Gone.

  What remained?

  There was a center. A point of awareness. It wasn't located in space, because there was no space. It wasn't located in a brain, because there was no brain to localize it. It was simply a vantage point.

  *I am.*

  The affirmation didn't come as a triumph. It came as a shock. It was the only solid thing in the universe.

  He tested it. *Suppose I have no body.*

  The thought held. He could conceive of himself existing without the limbs he couldn't feel. He could conceive of himself existing without the gravity he couldn't sense.

  *Suppose I do not exist.*

  The thought collapsed. It was impossible to think the thought without the thinker being present to think it.

  A strange calm began to displace the panic. It wasn't peace. It was the calm of a mathematician finding a constant in a chaotic equation.

  He was a variable that could not be solved away.

  He drifted—or rather, his awareness persisted—in the suspension. Time lost its meaning. Time was measured in heartbeats, in breaths, in the rotation of a planet. He had none of those. There was only the sequence of thoughts.

  *Thought one: I am here.*
  *Thought two: Is here a place?*
  *Thought three: No. Here is a state.*

  He tried to reconstruct the body. He imagined his right arm. He could visualize it perfectly—the scar on the forearm, the length of the fingers. But it was an image, like a picture of a chair. It wasn't *him*. He realized with a jolt that he had never truly *been* the arm. He had only *owned* it. He had piloted it.

  Now the pilot was sitting in a cockpit with no instruments, no windows, and no hull.

  *Am I a soul?*

  The word felt archaic, loaded with baggage he didn't want. *Consciousness? Substrate-independent processing?*

  The labels didn't matter. The experience did.

  He felt a sudden, terrifying vulnerability. If he was just this point of awareness, what kept him together? What prevented him from scattering? Usually, the body was the container. It held the mind in place, anchored by hormones, by nerves, by the desperate biological imperative to survive.

  Without the body, why did he stay *one* thing?

  *Because I say I am one.*

  It was an act of will. To be a self was a verb, not a noun. It was something he had to do, continuously. If he stopped affirming the center, would he diffuse? Would he become the void?

  He focused on the center. He pulled the scattered fragments of his memory toward it. The face of his sister. The smell of rain (a memory of smell, not the thing itself). The feeling of the transit gate boot-soles (a memory of touch).

  They were data. They were files. They were not *him*.

  He was the reader of the files.

  A new fear emerged. If he was distinct from the body, what happened to the body back on the pad? Was it standing there, empty? A shell? Or had the body vanished too, and this was the only reality left?

  He tried to send a command outward. *Let me back.*

  Silence.

  *Let me feel my foot.*

  Silence.

  He was alone with the *I*.

  It was lonely. God, it was lonely. The loneliness wasn't social; it was ontological. He was the only thing that existed. The void wasn't a place he was in; the void was everything that wasn't him. And since he couldn't verify anything outside his own awareness, the void might as well be infinite.

  He floated in the non-space. He didn't breathe, but he didn't suffocate. He didn't sleep, but he didn't tire.

  He began to experiment.

  *If I imagine a sphere, does it exist?*
  He imagined a red sphere. He could see it in his mind's eye. But was it outside him or inside him? There was no inside or outside. It was just an object of thought.

  *If I imagine pain?*
  He imagined a burn on his hand. He remembered the quality of pain. But he couldn't feel it. He could only know the concept of it.

  He was a king in a castle made of glass, suspended over an abyss.

  Hours? Years? Moments?

  He lost count.

  Then, a flicker.

  Not a sound. Not a light. A change in the texture of the silence.

  It felt like… resistance.

  He tested it. *Clench left fist.*

  Somewhere, in the deep, deep distance, there was a phantom echo. A ghost of tension. It wasn't sensation. It was a shadow of sensation. Like hearing a song you know so well that you can hear it in the silence between the notes.

  *Is it the body returning?*

  Or was it his mind finally building a simulation to cope with the isolation?

  He didn't know. And for the first time, he realized he didn't need to know.

  Before the flicker, he knew he existed.
  After the flicker, he knew he existed.

  The body was a variable. The self was the constant.

  He let the phantom sensation fade. He didn't chase it. He didn't beg for the return of the gravity, the breath, the heartbeat. Those were tools. They were interfaces. They were not the user.

  Kael settled into the suspension. He was the Flying Man, suspended in the vacuum of his own certainty. He was terrifyingly small, and he was infinitely large.

  *I am.*

  The thought rang out, not into the void, but as the void itself.

  *I am.*

  And for now, in the silence where no lungs could speak it, that was enough.
