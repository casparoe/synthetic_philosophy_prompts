  2.  **Deconstruct the "Flying Man" for Narrative:**
      *   *The Setup:* How do they get there? Sci-fi works best for total sensory isolation. A malfunction, an experiment, or a digital upload. Let's go with a malfunction during a transit or a simulation gone wrong. It allows for a sudden transition.
      *   *The Sensation:* The user knows proprioception. Losing it isn't just "numbness." It's the loss of the *schema*. No up/down, no limb location, no breathing rhythm, no heartbeat thump. It's the loss of the "body map."
      *   *The Conflict:* The mind trying to find purchase. Panic vs. Rationality. The "I" persisting without the "It" (body).
      *   *The Climax/Resolution:* Not answering "Am I a soul?" but answering "Can I hold onto *me* without *this*?"

  3.  **Drafting - Scene by Scene:**

      *   **Scene 1: The Transition.** Start *in media res* or right at the moment of loss. Sudden cutoff is more jarring. Let's make it a transport accident or a neural link failure. Let's go with a "jump" or "transit" scenario. It explains the void.
      *   **Scene 2: The Realization of Loss.** The character tries to move. Nothing happens. Not paralysis (which implies effort against resistance), but *absence* of feedback. This needs to be precise for the expert user. No vestibular otoliths telling them they're falling. No muscle spindles.
      *   **Scene 3: The Panic.** Breathing? Can't feel the chest expand. Heartbeat? Can't feel the pulse. This induces hyperventilation (mentally) but without physical feedback, it's a ghost panic.
      *   **Scene 4: The Cognitive Anchor.** Stripping away senses one by one. Memory? Intact. Math? Intact. Self-identity? That's the question.
      *   **Scene 5: The Affirmation.** The Avicenna moment. "I am." But make it visceral, not academic. A desperate grasp at existence.
      *   **Scene 6: The Open Ending.** Reintegration? Or staying in the void? Staying in the void is more poignant for the prompt. Let's leave them hovering in the certainty of self amidst the nothingness.

  4.  **Refining the Sensory Details (Crucial for this User):**
      *   *Vestibular:* No gravity vector. No sense of rotation. The "falling" feeling that never resolves.
      *   *Proprioceptive:* No sense of where the hands are. Trying to clench a fist and not knowing if it happened.
      *   *Interoceptive:* No hunger, no breath, no heartbeat. This is the hardest to simulate but essential for the "Flying Man."
      *   *Language:* Use terms like "schema," "feedback loop," "vector," but keep it narrative.

  5.  **Character Development:**
      *   Name: Elara.
      *   Role: Maybe a navigator or someone used to spatial awareness. Irony: An expert in position now has none.
      *   Voice: Analytical but fraying.

  6.  **Writing - Iteration 1 (Mental Outline):**
      Elara wakes up. Dark. Silent. She tries to breathe. Can't feel lungs. She tries to move arms. Can't feel them. She panics. Is she dead? She thinks. She remembers her name. She realizes she is thinking. Therefore she is. She floats forever.

      *Critique 1:* Too dry. Needs more texture. Needs the *horror* of the missing body.

  7.  **Writing - Iteration 2 (Focusing on the "Ghost Limb" aspect):**
      Make the absence palpable. The brain expects input and gets silence. That silence is loud. The "I" becomes a tiny point of light in a massive dark.

  8.  **Drafting the Narrative (incorporating the expert knowledge):**
      *   *Opening:* The cut. Not a fade, but a severance.
      *   *The Body Check:* She tries to locate her boundaries. There are none.
      *   *The Vestibular Void:* The inner ear usually screams gravity. Now, silence. Is she falling? Spinning? Impossible to tell.
      *   *The "I":* It emerges not as a conclusion, but as a survivor.

  9.  **Polishing:**
      *   Check the philosophy. Avicenna says the *essence* of the soul is self-awareness independent of the body. The story should show the *struggle* to find that essence when the body is the usual anchor.
      *   Check the science. Ensure the description of proprioceptive loss aligns with the user's background (e.g., distinguishing between motor command and sensory feedback).
      *   Pacing. Slow down the internal monologue.

  10. **Final Review against Prompt:**
