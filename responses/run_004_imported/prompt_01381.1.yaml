  Hey, quick one for you — I've been reading about Newton's bucket for a piece I'm working on, and my takeaway was that general relativity basically vindicated Mach and Leibniz over Newton: no more absolute space, and rotation/inertia turn out to be relative to the matter in the universe (frame-dragging and all that). So I'm a little confused why philosophers of physics still treat substantivalism vs relationism as a live debate — feels like Einstein already settled this in the relationists' favor decades ago, doesnt it?
