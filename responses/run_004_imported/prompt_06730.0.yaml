answer: |-
  The spreadsheet glowed on the laptop screen, casting a sickly blue pallor over the kitchen table. It was 3:17 AM. The coffee had gone cold an hour ago, leaving a ring of sludge on a stack of invoices.

  David rubbed his eyes. "It's not a feeling, Sarah. It's an aggregate. Ten million users times two seconds of latency is five thousand five hundred hours of lost human time. The single client loses ten hours. The math isn't even close."

  Sarah sat opposite him, her arms crossed tight over her chest, as if holding herself together. She wasn't looking at the screen. She was looking at the window, where the rain blurred the streetlights into smeared oranges.

  "Five thousand hours of what?" she asked. Her voice was quiet, stripped of the heat it had carried at 1:00 AM. "Blinking? Waiting for a page to load? Scrolling past an ad?"

  "Engagement time," David said. "Productivity. Leisure. It's time."

  "It's noise," she said. "You're adding up noise and calling it pain."

  They ran a mid-sized hosting firm. Nothing glamorous. They kept small business websites alive. Tonight, a cooling failure in Server Block 4 meant they had to throttle bandwidth. They had two choices, hardcoded into the failover script.

  Protocol A: Isolate the block. One client, a medical billing startup, goes offline for ten hours. Their service halts. Claims pile up. Panic. Potential bankruptcy.
  Protocol B: Distribute the load. Ten million users across the network experience a two-second lag on every click. Unnoticeable. Maybe a mild irritation if they noticed at all.

  David was the engineer. He believed in the system. Sarah was the operations lead. She believed in the people.

  "Imagine a room with ten million people," David said. He'd tried this on the drive, he was trying it again. "If everyone in that room gets a pinprick, does nobody feel it? If enough people get pinpricks, the total suffering outweighs one person being broken on the rack. That's the trade. We don't break the one."

  Sarah finally looked at him. Her eyes were tired, rimmed with red. "The problem isn't the pinprick, David. It's the room. You can't picture ten million people. Nobody can."

  "I can picture the number."

  "No, you can't." She reached for a jar of dried lentils on the counter, leftover from dinner. She dumped a handful onto the table. They scattered, clattering against the wood. "That's a hundred. Maybe two hundred. Can you feel the difference between this handful and two handfuls?"

  "Yes."

  "Okay." She swept them back into the jar. "Now imagine a jar so big it fills this house. Floor to ceiling. That's a million. Now imagine a jar that fills the city. That's ten million. Your brain says 'big jar.' My brain says 'big jar.' They feel the same. You're making a sacrifice based on a number that doesn't exist in your nervous system."

  David leaned forward, elbows on the table. "So we ignore the scale? We let the aggregate suffer because we can't count it? That's how you get tragedy of the commons. That's how the climate burns. Because a degree of warming is a speck of dust, and there are too many of us to feel it until the water rises."

  "This isn't the climate," Sarah snapped. "This is a website. And on the other side is *Gary*."

  "Gary" was the client. Gary's Medical Billing. David knew him. He'd spoken to Gary on Tuesday. Gary was anxious. Gary had a mortgage.

  "Gary is one," David said. "The ten million are real people too."

  "Are they?" Sarah stood up and walked to the window. She pressed her forehead against the glass. "If I walk down the street and bump into a million shoulders, I haven't assaulted an army. I've had a million accidents that don't count. There's a threshold, David. Suffering isn't linear. It's not a ramp. It's a cliff. Two seconds of lag is zero. Ten hours of downtime is a disaster. You can't multiply zero and get a disaster."

  "Zero isn't zero," David said. "It's entropy. It's friction. It's the slow erosion of everything."

  "It's invisible." She turned around. "If we do Protocol B, nobody knows. Nobody suffers. If we do Protocol A, Gary screams. You want to choose the path where we hear the scream. Why? Because it makes you feel honest?"

  "I want to choose the path where less time is lost."

  "You want to choose the path where the math stays clean."

  They stood in the silence of the kitchen. The refrigerator hummed, a low, vibrating drone. It was the sound of the machine keeping things cold, one compressor at a time.

  David looked back at the screen. The cursor blinked next to the selection box.
  `[ ] EXECUTE PROTOCOL A (ISOLATE)`
  `[ ] EXECUTE PROTOCOL B (DISTRIBUTE)`

  He thought about the atoms. The original thought experiment said *more than atoms in the universe*. That was the trick. The number was so big it was theological. But here, in the kitchen, the number was just ten million. It was a number you could see on a dashboard. It was a number you could bill for.

  But Sarah was right. He couldn't feel ten million. He could feel Gary. He could feel the tightness in his own chest, the fatigue in his shoulders. He could feel the anger in Sarah's voice.

  "Our brains evolved for tribes," David said softly. "Dunbar's number. One hundred and fifty people. Anything beyond that is abstraction. We aren't built for this."

  "Then maybe we shouldn't be making gods of our abstractions," Sarah said. She came back to the table. She didn't sit. She put her hand on the back of his chair. "If you save the ten million, you're saving a statistic. If you save Gary, you're saving a man. But if you save the statistic, you're saying the man is fuel."

  "And if I save the man, I'm saying the million don't matter."

  "I'm saying the million *don't feel it*."

  David's hand hovered over the trackpad. The blue light washed over his fingers. He thought about the dust specks. In the story, the specks were annoying. But if you had enough of them, did they become a blinding storm? Or did they just remain dust, piling up in corners, invisible until you swept them away?

  He thought about the drive this weekend. The argument that had gone in circles until the exit signs blurred. He realized now that they weren't arguing about the choice. They were arguing about the texture of reality.

  To David, reality was continuous. A smooth gradient of pain and pleasure that could be measured and summed.
  To Sarah, reality was discrete. There were safe zones and there were danger zones, and you didn't cross the line just because the other side was crowded.

  "If I click B," David said, "Gary goes under."

  "If you click A," Sarah said, "we become the people who broke Gary to save a fraction of a second for strangers who will never know we saved it."

  "We're already those people," David said. "We run the server. The lag happens either way. The question is who pays the bill."

  The rain intensified, drumming against the roof. It sounded like static. Like data.

  David moved the cursor. He didn't click. He just let it rest on `PROTOCOL B`.

  The math was clear. The aggregate time saved was massive. By any utilitarian metric, by any effective altruism calculation, B was the moral choice. It was the choice that minimized total suffering units.

  But looking at the screen, he felt nothing. No weight. No resistance. It was like deleting a temp file.
  If he moved to `PROTOCOL A`, the system would flag a critical error. It would require a password override. It would demand acknowledgment. It would feel like breaking something.

  "Why is the right choice the one that feels like a crime?" David asked.

  "Because the math is a map," Sarah said. "And Gary is the territory."

  She waited. She didn't tell him what to do. She knew that if she told him, it would be her choice, not his. And he had to live with the multiplication.

  David looked at the lentil jar. He imagined it filling the room. He imagined it filling the sky. He tried to summon the weight of ten million two-second delays. He tried to imagine the collective sigh of a city. But his mind kept snapping back to the kitchen table, to the two of them, to Gary's anxious voice on the phone.

  The brain was a small machine. It was built for fire and wolves and faces. It was not built for server farms.

  "I hate this," David whispered.

  "I know."

  He clicked.

  The screen refreshed. The status bar turned green. `PROTOCOL B ACTIVE. LOAD DISTRIBUTED.`

  Somewhere, ten million people blinked at their screens, maybe frowning for a microsecond as a page buffered.
  Somewhere, Gary's dashboard went red. His calls would start in four hours.

  David closed the laptop. The blue light vanished, leaving them in the warm, dim glow of the stove hood.

  "Did we do the right thing?" he asked.

  Sarah poured the cold coffee down the sink. The sound was loud in the quiet house. "We did the thing we could live with. For tonight."

  She turned off the light. "Come to bed, David. The numbers will still be there in the morning."

  He sat in the dark for a moment longer. He tried to count the seconds of silence, but he lost track after sixty. It was all just time, passing, indistinguishable and vast. He stood up, chair scraping against the floor, and followed her into the dark.
