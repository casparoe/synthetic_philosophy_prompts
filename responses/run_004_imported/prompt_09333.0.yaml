      *   **Intentional Stance:** Predict based on beliefs, desires, and rationality (e.g., "it wants to keep the room warm," "it believes the room is cold").
      *   **Criterion:** Use the intentional stance *if and only if* it provides significant predictive power that is otherwise too complex or cumbersome to achieve via the design or physical stance, and if the system's behavior is robustly rational relative to those beliefs/desires.
