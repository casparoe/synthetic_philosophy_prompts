answer: |-
  Good morning. Welcome to the sixth annual Calibration Club workshop.

  It is a genuine privilege to stand here again. When we started this group six years ago, the goal was modest: we wanted to stop pretending we knew things we didn't. We wanted to replace "I think this will work" with "I assign a 70% probability to this working," and then we wanted to keep score. We wanted to see if we could become honest about our own uncertainty.

  For five years, that project felt linear. We got better at defining reference classes. We got better at aggregating judgments. Our Brier scores improved. We felt like we were building a machine for clarity.

  But this year, we open under a cloud. And I think it would be disingenuous to pretend otherwise.

  As you know, last quarter, one of our most respected forecasters staked a high-confidence prediction on a major launch. Before that number was locked, two colleagues raised a specific, technical objection to the underlying model. The forecaster acknowledged the objection. She admitted, on the record, that she had not rebutted it. Yet, she left the probability unchanged. The launch failed. The forecast was not just wrong; it was confidently wrong.

  Since then, this room has fractured.

  I have heard from half of you that this was an act of admirable conviction. You argue that in a product organization, paralysis is a greater sin than error. You say that noise is inevitable, that every model has un-rebutted objections if you look hard enough, and that a leader's job is to absorb that ambiguity and commit. To lower the probability solely because of an unrebutted objection, you argue, is to be held hostage by skepticism.

  I have heard from the other half of you—including our distinguished guests from philosophy departments—that this is a textbook case of *epistemic akrasia*. For those less familiar with the term, it describes a state where you hold a belief, while simultaneously believing that you shouldn't hold it. If you admit that evidence against your reliability carries force, but you refuse to update your credence, you are, in a sense, breaking the rules of rationality. You are asserting, "I am right," while whispering, "I might not be rational to think so."

  This tension is uncomfortable. It threatens the cohesion of this club. If we cannot agree on what constitutes rational behavior in the face of dissent, can we really agree on how to score it?

  I am not going to resolve this tension for you today. And I am certainly not going to ask our academic guests to solve it for us.

  To the epistemologists joining us: thank you for being here. We know that in your literature, this question is still unsettled. There are "steadfasters" who argue that sticking to your guns is sometimes the only rational move, and there are "conciliationists" who argue that acknowledging peer disagreement demands a shift in confidence. We know you do not have a consensus. So, I am not asking you for a verdict on last quarter's forecast.

  Instead, I am asking for your help in framing the dilemma. We are practitioners. We have to ship code. We have to allocate budget. We cannot suspend action until the philosophy is settled. So, our task for this workshop is not to decide who was "right" in that specific instance. Our task is to determine how we live with this conflict moving forward.

  If we side too heavily with conviction, we risk dogma. We risk building a culture where "calibration" is just a veneer for intuition that refuses to die. We risk ignoring the very signals this club was built to amplify.

  But if we side too heavily with the demand for epistemic purity, we risk paralysis. We risk creating a culture where no one dares to make a call unless every objection is silenced, which in product development, is never. We risk confusing the map for the territory, treating our probability scores as moral obligations rather than tools for navigation.

  This is the frame for our sessions today: **How do we manage the trade-off between epistemic integrity and operational decisiveness?**

  When you sit in your breakout groups, I want you to resist the urge to retry the case from last quarter. Do not focus on the outcome. The fact that the launch failed makes this emotional, but remember: a lucky fool is still a fool, and a rational actor can still get burned by variance. Focus on the structure of the reasoning.

  I want the engineers and PMs to ask yourselves: When you hold a probability steady despite a known objection, what is the source of that steadiness? Is it genuine insight that the objection is noise? Or is it ego? Is it commitment to a roadmap? Be honest.

  I want our academic guests to push us on the definitions. When we say "rational," are we talking about individual coherence or collective reliability? Help us understand where the boundary lies between "steady leadership" and "akratic blindness."

  We are here because we believe that probabilistic thinking makes us better. But perhaps the next level of maturity for this club isn't about getting tighter confidence intervals. Perhaps it's about developing a vocabulary for the moments when the math doesn't tell us what to do.

  We are not going to leave here today with a new rule that says "Always update on unrebutted objections" or "Never lower confidence due to dissent." If anyone promises you that, they are selling something I don't have.

  What we can build is a shared awareness. We can agree that this tension exists. We can agree that it is dangerous to ignore it. And we can agree that the health of this club depends on our ability to argue about it without fracturing.

  The forecaster in question is here today. She is participating in the workshops. She is subjecting her process to the same scrutiny as everyone else. That is the culture we have built. We do not exile error; we examine it.

  So, let us lean into the discomfort. Let us acknowledge that we are trying to do something incredibly difficult: we are trying to be humble and confident at the same time. We are trying to be open to evidence while remaining capable of action.

  The philosophers can tell us why that is hard. But only we can decide how to do it.

  Thank you. Let's get to work.
