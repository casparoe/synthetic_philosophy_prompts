          4.  Knowledge distributes over conjunction: $Kp \land K(\neg Kp)$.
          5.  Knowledge implies truth (factivity): If you know $\neg Kp$, then $\neg Kp$ is true.
          6.  Contradiction: You have $Kp$ (from step 4) and $\neg Kp$ (from step 5).
          7.  Therefore, it is impossible to know ($p \land \neg Kp$).
          8.  If it's impossible to know, and we assumed all truths are knowable, then ($p \land \neg Kp$) cannot be true.
