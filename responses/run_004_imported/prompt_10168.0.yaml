prompt: |-
  I'm teaching a graduate seminar this term on practical reason, and this week's session sets Bernard Williams's "Internal and External Reasons" alongside Book 2 of Hume's Treatise of Human Nature, on the standard assumption that Williams's internalism — an agent has a reason to act only if there is a "sound deliberative route" from that agent's existing "subjective motivational set" to the action — is essentially a descendant of Hume's claim that reason alone cannot move the will. While drafting my lecture notes I reread the relevant stretch of the Treatise more slowly than usual, and I've argued myself into a difficulty about it that I'd rather sort out with you than discover live in front of twelve second-year students.

  Here is the passage (Treatise 2.3.3.4, 6–7; I've cut one clause for length, marked with [...]):

  "Reason is, and ought only to be the slave of the passions, and can never pretend to any other office than to serve and obey them.

  "What may at first occur on this head, is, that as nothing can be contrary to truth or reason, except what has a reference to it, and as the judgments of our understanding only have this reference, it must follow, that passions can be contrary to reason only so far as they are accompany'd with some judgment or opinion. According to this principle, which is so obvious and natural, 'tis only in two senses, that any affection can be call'd unreasonable. First, When a passion, such as hope or fear, grief or joy, despair or security, is founded on the supposition of the existence of objects, which really do not exist. Secondly, When in exerting any passion in action, we chuse means insufficient for the design'd end, and deceive ourselves in our judgment of causes and effects. Where a passion is neither founded on false suppositions, nor chuses means insufficient for the end, the understanding can neither justify nor condemn it. [...] In short, a passion must be accompany'd with some false judgment, in order to its being unreasonable; and even then 'tis not the passion, properly speaking, which is unreasonable, but the judgment.

  "The consequences are evident. Since a passion can never, in any sense, be call'd unreasonable, but when founded on a false supposition, or when it chuses means insufficient for the design'd end, 'tis impossible, that reason and passion can ever oppose each other, or dispute for the government of the will and actions. The moment we perceive the falshood of any supposition, or the insufficiency of any means our passions yield to our reason without any opposition. I may desire any fruit as of an excellent relish; but whenever you convince me of my mistake, my longing ceases."

  My difficulty is this. A few lines before this passage, Hume's stated thesis is unconditional: reason "can never oppose passion in the direction of the will." Yet what he goes on to describe looks like exactly that kind of opposition — a passion that would otherwise have issued in action is extinguished once the understanding corrects the belief it depended on, and the fruit example reads like reason redirecting the will, not like a passion that remains fully in command while reason merely ministers to it. So I'd like your help with two connected points. First, is there a way of construing "yield to our reason without any opposition" that preserves the letter of the slave thesis — reason having, in itself, no power to alter what we want or do — or does the passage in fact concede real, if narrowly circumscribed, motivational efficacy to reason, contrary to Hume's own announced conclusion? Second, whichever reading you favor, what should we make of the fact that Williams's internalism relies on this same manoeuvre — an internal reason claim can be defeated or revised by correcting the agent's factual or instrumental beliefs, without appeal to any external reason — to answer the standard complaint that internalism can't make sense of an agent having reason to revise a deeply mistaken end? Does Hume's example show that this belief-correcting move was internalist-respectable all along, or does it show that the move smuggles in more than a strict internalist is entitled to?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A graduate seminar instructor teaching practical reason.
      *   **Topic:** Bernard Williams's "Internal and External Reasons" vs. Hume's *Treatise* (Book 2, Part 3, Section 3).
      *   **Specific Problem:** The user sees a tension in Hume's famous "Reason is, and ought only to be the slave of the passions" passage. Hume claims reason *cannot* oppose passion, yet describes cases where correcting a belief (an act of reason) extinguishes a passion/desire. This looks like reason *opposing* passion.
      *   **Questions:**
          1.  Can we construe "yield to our reason" in a way that preserves the strict "slave thesis" (reason has no independent motivational power), or does Hume concede motivational efficacy to reason?
          2.  How does this bear on Williams's internalism? Does Hume's move validate Williams's strategy for handling mistaken ends (via deliberative routes correcting beliefs), or does it expose a flaw/smuggle in external reasons?
      *   **Context:** Graduate level, needs philosophical precision, nuance, and pedagogical utility.

  2.  **Deconstruct Question 1: Hume's Consistency (Slave Thesis vs. Belief Correction):**
      *   *The Tension:* If reason kills a passion by correcting a belief, isn't reason motivating the cessation of action?
      *   *Standard Humean Defense:* Reason doesn't *generate* a new motive. It removes the *object* of an existing motive. The passion (desire for fruit) exists *conditional* on a belief (fruit tastes good). If the belief goes, the passion dissolves. The passion isn't "opposed" by a rival force (Reason); it collapses because its foundation is gone.
      *   *Key Distinction:* Opposition vs. Undermining. Reason doesn't say "You shouldn't want this." Reason says "This isn't what you think it is."
      *   *The "Yield" Language:* "Yield to our reason" is metaphorical. It's not a surrender in battle; it's a evaporation.
      *   *Conclusion:* Hume is consistent *if* we understand "opposition" as conflict between independent motives (Reason vs. Passion). Belief correction isn't a conflict; it's a dissolution of the passion's intentional object.
      *   *Nuance:* Some scholars (e.g., Barry Stroud, Annette Baier) might push back, suggesting this gives reason too much power. But the standard compatibilist reading is that reason is instrumental/causal regarding beliefs, not normative regarding ends.

  3.  **Deconstruct Question 2: Williams and Internalism:**
      *   *Williams's Internalism:* $A$ has a reason to $\phi$ iff $A$ could reach $\phi$ via sound deliberation from their Subjective Motivational Set ($S$).
      *   *The Objection:* What if $S$ contains evil or mistaken ends? Can internalism criticize them?
      *   *Williams's Move:* Deliberation includes correcting factual beliefs and instrumental reasoning. If I want to drink petrol thinking it's gin, I have no internal reason to drink it. Correcting the belief changes the reason.
      *   *Connection to Hume:* Williams explicitly acknowledges his Humean lineage. He uses the "false belief" move exactly like Hume.
      *   *Does it Smuggle?*
          *   *Defense:* It doesn't smuggle external reasons. It stays within the agent's psychology. It's still about *their* motivations, just informed ones.
          *   *Critique:* Does "sound deliberation" imply a normative standard external to $S$? Williams says no, it's procedural. But if the correction of belief *changes* the motivation, is that reason doing the work?
          *   *Comparison:* Hume's fruit example is the prototype for Williams's "petrol vs. gin" example. Both rely on the idea that motivations are belief-dependent.
          *   *Verdict:* It shows the move is internalist-respectable *provided* one accepts the Humean psychology of action (belief-desire model). It doesn't prove external reasons exist; it proves internal reasons are sensitive to truth.

  4.  **Synthesize and Structure the Response:**
      *   **Tone:** Collegial, rigorous, respectful of the teaching context.
      *   **Introduction:** Acknowledge the sharpness of the observation. It's a classic puzzle.
      *   **Part 1: Hume's Consistency (The "Slave" Thesis):**
          *   Explain the "Two Senses of Unreasonableness" (False Existence, Insufficient Means).
          *   Clarify the mechanism: Reason doesn't *fight* passion; it *dissolves* it by removing its cognitive support.
          *   Analogy: Turning off a light vs. fighting the dark.
          *   Address "Yield": It's not submission to a master; it's the disappearance of the impulse upon realization of error.
          *   *Verdict:* Hume remains consistent. Reason has no *independent* motivational force.
      *   **Part 2: Williams and Internalism:**
          *   Connect Hume's fruit to Williams's gin/petrol.
          *   Explain how Williams uses the "sound deliberative route" to handle mistaken ends without invoking external reasons.
          *   Address the "Smuggling" charge: Does correcting beliefs import normativity?
          *   *Argument:* It imports *truth*, not *value*. Internalism requires motivations to be grounded in the world as it is.
          *   *Limit:* This works for factual/instrumental errors. It struggles with fundamental evaluative errors (e.g., "I want to torture"). Williams admits this limits internalism's critical reach.
      *   **Pedagogical Advice:** How to frame this for grad students.
          *   Don't present it as a "gotcha" on Hume.
          *   Present it as the *mechanism* of internalism.
          *   Highlight the difference between *critiquing ends* vs. *critiquing the basis of ends*.
      *   **Conclusion:** Summarize the link. Hume provides the psychological architecture; Williams builds the normative theory on top.

  5.  **Refine the Argument (Self-Correction/Deepening):**
      *   *Check:* Did I address "yield to our reason"? Yes, need to emphasize that "reason" here stands for "the realization of truth," not a competing motive.
      *   *Check:* Is the Williams link strong enough? Williams explicitly cites Hume. The "internal reason statement" is truth-apt. If the belief is false, the reason statement is false.
      *   *Nuance on Williams:* Williams distinguishes between the *S* set (which includes dispositions, etc.) and mere occurrent desires. The deliberative route can expand *S*. This is where the "smuggling" worry is strongest. I should mention that Williams allows deliberation to *modify* the S set, not just service it. This goes slightly beyond Hume's strict instrumentalism but stays internalist.
      *   *Refinement:* Make sure to distinguish between Reason as a *faculty* (Hume) and Reasons as *statements* (Williams). Hume talks about the faculty's power; Williams talks about the truth conditions of reason claims. They map onto each other but aren't identical.

  6.  **Drafting the Response:** (Mental or scratchpad)
      *   Start by validating the instructor's close reading.
      *   Section 1: Hume. The "Extinction" model. Passion depends on belief. No belief = no passion. Reason isn't a rival cause.
      *   Section 2: Williams. The "Gin/Petrol" case. Internal reasons are hypothetical truths about motivation. If the belief is false, the reason claim is false.
      *   Section 3: The "Smuggling" worry. Does truth imply value? No. But it does imply that internalism isn't just "whatever you want." It's "what you would want if you knew."
      *   Teaching tip: Use the fruit/petrol analogy in class.

  7.  **Final Polish:** Ensure philosophical terminology is precise (e.g., "propositional attitudes," "normative force," "instrumental rationality"). Keep the tone helpful for a lecturer preparing notes. (Proceed to generate output based on these thoughts.)
answer: |-
  This is an excellent difficulty to have stumbled into, and it cuts to the very heart of the Humean theory of motivation and its legacy in Williams. You are right to sense a tension here: if reason can extinguish a passion by correcting a belief, does that not grant reason a kind of veto power that contradicts the "slave" thesis?

  Here is a way to structure the resolution for your seminar notes, addressing both the exegesis of Hume and the implications for Williams's internalism.

  ### 1. Hume's Consistency: Extinction vs. Opposition

  To preserve the letter of the "slave thesis," you need to distinguish between **opposition** (conflict between two active forces) and **undermining** (removal of the conditions necessary for a force to exist).

  **The Mechanism of Dissolution**
  When Hume says reason and passion cannot "oppose each other," he is operating with a specific causal model of the mind. For Hume, a passion (or desire) is not a freestanding entity; it is an impression that is often *intentional*—it is about something. In the fruit example, the longing is not just a brute feeling; it is constituted partly by the belief "this fruit has an excellent relish."

  When reason corrects the belief ("this fruit is rotten"), it does not bring a rival motive to the table to fight the longing. Rather, it removes the cognitive prop that the longing leans upon. The passion does not "yield" in the sense of a defeated army surrendering to a victor; it evaporates like a shadow when the light is turned on.

  **Construing "Yield to our Reason"**
  You can teach this by focusing on the word "yield." In a conflict, yielding implies I *could* have resisted but chose not to. In Hume's description, the passion *cannot* persist once the falsity is perceived.
  *   **Strict Reading:** Reason has no *independent* motivational efficacy. It cannot generate a "do not eat" desire from scratch. It can only manipulate the "eat" desire by manipulating the beliefs attached to it.
  *   **The "Slave" Metaphor:** A slave does not give orders, but a slave who manages the household accounts can tell the master, "We have no money to buy that." The master's desire to buy is not opposed by the slave's authority; it is frustrated by the facts the slave presents. The master ceases to want the purchase *given the new information*.

  **Verdict on Point 1:** Hume does not concede motivational efficacy to reason. He concedes **causal efficacy to truth** (accessed by reason) over the *existence* of passions. Reason is still instrumental. It serves the passion by ensuring the passion is not wasted on non-existent objects or impossible means. The "opposition" is illusory; it is actually a collapse of the passion's intentional object.

  ### 2. Williams and the "Smuggling" Worry

  This Humean move is precisely the engine of Williams's internalism. Williams's famous example of the gin/petrol is a direct descendant of Hume's fruit.

  **The Williams Move**
  Williams argues that an internal reason statement ("A has a reason to $\phi$") is true only if A could reach $\phi$ via a sound deliberative route from their Subjective Motivational Set ($S$).
  *   **The Objection:** If A wants to torture people, internalism seems to say "A has a reason to torture."
  *   **The Humean Defense:** Williams replies that deliberation includes correcting factual beliefs. If the torturer believes torture produces justice, and it doesn't, the internalist can say, "Given the facts, you have no reason to do this."

  **Does this Smuggle in External Reasons?**
  This is the crux of your second question. Does correcting the belief import a normative standard external to the agent's $S$?

  *   **Argument for "Respectable Internalism":**
      It does not smuggle external reasons *if* we accept the Humean psychology. An internal reason is a truth-apt claim about the agent's psychology and the world. If the belief component of the motivation is false, the reason claim is false *internally*. Williams isn't saying "You ought not to torture" (external); he is saying "The statement 'You have a reason to torture' is false because your belief about the outcome is false." The normativity comes from the requirement of **truth**, not from a moral law. Truth is not an "external reason"; it is a condition of successful action.

  *   **Argument for "Smuggling":**
      However, your students might press this: Why does the agent *care* about the truth? If the torturer says, "I don't care if it produces justice; I just enjoy the act," the Humean/Williamsian move loses its grip.
      *   Hume's fruit example works because the desire was *for the taste*.
      *   Williams's petrol example works because the desire was *for a gin and tonic*.
      *   If the desire is *for the suffering itself* (sadism), correcting factual beliefs about suffering doesn't extinguish the desire.
      *   **The Limit:** Here, Williams admits internalism has limited critical reach. He allows that deliberation can also involve *imaginative* processes that might modify the $S$ set itself (e.g., realizing one would be disgusted by the act upon reflection). But if the agent refuses to deliberate, internalism hits a wall.

  **Verdict on Point 2:** Hume's example shows that the belief-correcting move is internalist-respectable **for instrumental and factual errors**. It validates Williams's strategy for cases where the end depends on a means or a false description of the object. However, it does not solve the problem of **fundamental evaluative error**. If the passion is not founded on a supposition of existence or causation, but on a valuation (e.g., "Pain is good"), Hume's reason is silent, and Williams's internalism cannot condemn it without stretching the definition of "sound deliberation" so far that it risks becoming externalist.

  ### Pedagogical Suggestion for the Seminar

  To make this live for your students without getting bogged down in exegesis, you might frame the tension as the difference between **Reason as a Rival** vs. **Reason as a Clarifier**.

  1.  **The Rival View (The Straw Man):** Reason and Passion are two little people in the head fighting over the lever. If Reason wins, it pushed the lever. (This is what Hume denies).
  2.  **The Clarifier View (Hume/Williams):** Passion is a projection on a screen. Reason controls the slide projector. If Reason changes the slide (the belief), the image (the passion) changes. Reason didn't fight the image; it changed the conditions of its appearance.

  **Discussion Question for the Class:**
  "Williams uses the Humean 'false belief' move to show internalism can criticize actions. But does this only work for 'mistaken' ends (like drinking petrol), or can it reach 'evil' ends (like torture)? If a Nazi believes correctly that his actions cause suffering, but desires that suffering, has Williams's Humean move run out of road?"

  This leads them directly to the limit of Internalism and the potential need for External Reasons (or a thicker theory of deliberation), which is likely where your seminar is heading next.

  ### Summary for your Notes

  *   **Hume's Consistency:** Preserved. Reason does not oppose passion; it dissolves it by removing its cognitive foundation. "Yielding" is metaphorical for "ceasing to exist due to error correction."
  *   **Williams's Inheritance:** Williams adopts this mechanism to show internal reasons are truth-sensitive.
  *   **The Smuggling Charge:** It is not smuggling *if* the criticism is limited to factual/instrumental rationality. It *is* potentially smuggling (or hitting a limit) if applied to fundamental evaluative commitments where facts alone cannot shift the $S$ set.
  *   **Takeaway:** Hume provides the psychological architecture (belief-desire dependence); Williams builds the normative theory (internal reason statements). Both rely on the idea that motivations are vulnerable to truth.

  This should allow you to present the "difficulty" not as a contradiction in Hume, but as the precise mechanism that makes Internalism plausible—and simultaneously reveals its limits.
