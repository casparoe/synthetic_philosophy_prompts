  Here is the ranking of the five solution concepts based on the strength and controversial nature of the epistemic assumptions required to justify them, from weakest to strongest.

  **1. Survival under iterated elimination of strictly dominated strategies (IESDS)**
  This sits at the base because it requires only that players are rational and that this rationality is known to some sufficient order (Common Knowledge of Rationality), without requiring players to hold specific beliefs about *which* rational strategies opponents will choose. In games with more than two players, it is the weakest because it allows players to hold correlated beliefs about their opponents' choices, imposing the fewest constraints on the belief structure.

  **2. Rationalizability**
  This is nearly identical to IESDS in two-player games, but in games with three or more players, standard rationalizability typically assumes that players believe their opponents' choices are independent of one another. This "independence of beliefs" is an additional epistemic assumption beyond pure rationality, making it slightly stronger (more restrictive) than IESDS, though it still relies primarily on Common Knowledge of Rationality without needing equilibrium consistency.

  **3. Correlated equilibrium**
  Moving beyond pure rationality, this concept requires the "Common Prior" assumption (often called the Harsanyi Doctrine), meaning all players must start with the same probability assessments over the underlying state of the world. While this is a strong structural assumption, correlated equilibrium is a broader set of outcomes than Nash equilibrium; it represents the natural consequence of Bayesian rationality with a shared prior, without requiring the players to coordinate on a specific profile independently.

  **4. Nash equilibrium**
  Although Nash equilibrium does not strictly require a Common Prior, it demands that players' beliefs are not just rational but *correct* (mutual knowledge of conjectures). This requires a "coordination miracle" where everyone's beliefs about everyone else's strategies align perfectly on a fixed point without a mediator. Because Nash equilibrium is a subset of correlated equilibrium, justifying this narrower set of outcomes requires stronger assumptions about belief consistency and coordination.

  **5. The backward-induction outcome in finite games of perfect information**
  This is the most contested because it requires Common Knowledge of Rationality to hold even at information sets that should never be reached if rationality were common knowledge (the "paradox of backward induction"). Justifying this outcome requires complex counterfactual reasoning to maintain that a player is still believed to be rational even after they make a move that appears irrational, making it the most fragile and epistemically demanding assumption on this list.

