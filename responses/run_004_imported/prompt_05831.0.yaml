  I don't have any formal training in mathematics, economics, or philosophy — I work in IT — but over the last couple of years I've fallen down a real rabbit hole with epistemic logic and game theory, purely as a hobby. It started with the classic "blue-eyed islanders" puzzle, where a fact every single islander already privately knows only starts to matter once it becomes common knowledge — once everyone knows it, knows that everyone else knows it, and so on without end — after being announced out loud in front of the whole group. Once that finally clicked for me, I got hooked on the idea that common knowledge is something qualitatively different from everyone just happening to know the same thing, or even from everyone knowing that everyone knows it up to some fixed, finite level. From there I started reading around online about how game theorists lean on a related idea, "common knowledge of rationality," to justify why rational players would land on one strategy profile rather than another — and this is where I've started to get a bit lost.

  What confuses me is that different solution concepts don't all seem to lean on this assumption in the same way, or to the same degree. From what I've pieced together, iterative deletion of dominated strategies, and rationalizability more generally, are often said to follow from common knowledge of rationality more or less on their own. Nash equilibrium seems to additionally need some form of common knowledge of the players' actual beliefs or conjectures, not just of their rationality, and correlated equilibrium, at least in the way Aumann originally set it up, seems to further rely on everyone sharing the very same prior over the underlying state space. Then there's backward induction in games like the centipede game, where I gather Aumann himself argued that common knowledge of rationality forces players all the way down to the backward-induction outcome, but that other theorists pushed back hard, questioning whether the assumption is even coherent once you ask what a player should believe about an opponent's rationality right after that opponent has made a move no rational player should ever make. I'd like a clearer sense of the relative "cost" of each of these results, in terms of how strong — and how contested — the assumption behind it really is.

  So here is my request: could you rank the following five items from the one that requires the weakest and least controversial common-knowledge-of-rationality-style assumption to the one that requires the strongest or most contested one — (1) survival under iterated elimination of strictly dominated strategies, (2) rationalizability, (3) Nash equilibrium, (4) correlated equilibrium, and (5) the backward-induction outcome in finite games of perfect information? Please add a sentence or two of justification for each placement, and then give your final answer as a JSON block using tiers, formatted like this (with ties allowed if you think two of these genuinely belong at the same level):

  ```json
  {
    "tier_1_weakest_assumption": ["..."],
    "tier_2": ["..."],
    "tier_3": ["..."],
    "tier_4": ["..."],
    "tier_5_strongest_assumption": ["..."]
  }
  ```
