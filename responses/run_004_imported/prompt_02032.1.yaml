  8.  **Final Polish:** Check against the prompt's specific request to go through criteria one at a time. (Structure the response with clear headings or logical flow corresponding to the criteria). Ensure the distinction between Reality TV (edited) and Streaming (live) is noted but ultimately collapsed under the same moral failing for Rousseau.

