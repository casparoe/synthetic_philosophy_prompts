      *   Ensure the Löbian aspect is clear: The proof exists because the statement "We both cooperate" is a fixed point.
      *   *Vulnerability:* The "Time Limit." If the proof takes too long, the agent defaults to Defect. This allows a "Complexity Shield" strategy where you make your code hard to read to force the other to defect, while you defect.

  7.  **Drafting the Content (Mental or Scratchpad):**
