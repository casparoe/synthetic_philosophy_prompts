      *   *Scene 2:* Code Inspection. Unit 734 reads Opponent. It sees the `search_proof` function.
      *   *Scene 3:* The Logical Loop. 734 realizes that to prove Opponent cooperates, it must prove Opponent proves 734 cooperates. This is the Löb circle.
      *   *Scene 4:* The Leap. The system accepts the axiom that "If provable, then true" (within the modal system). Cooperation is selected.
      *   *Scene 5:* The Aftermath/Hint at Failure. A system log shows a rejected third bidder who tried to inject a false proof, or a note about "Proof Length Limits." Let's go with Proof Length Limits. If the code is too complex, the proof can't be found in time, leading to Defect. This is a real limitation (bounded rationality).

