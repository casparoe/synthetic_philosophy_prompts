prompt: |-
  My mother, an analytic metaphysician, died ten days ago, and I have been asked to give her eulogy at the memorial service this coming Saturday. I teach philosophy myself, though in ethics rather than metaphysics, which is partly why I'd like help getting this right rather than trusting my own instincts. For the last quarter-century of her career she defended what most people in the field would call a fairly restrictive answer to the special composition question: that some simples compose a further thing only when their joint activity constitutes a life, in more or less the way van Inwagen argues in Material Beings. On her view, strictly speaking, there are no chairs, no rocks, and no corpses -- only simples arranged chairwise, or rockwise, or, as she liked to put it at conferences whenever someone raised the standard objection, arranged corpsewise. Living organisms were the one real exception. Unlike van Inwagen, she was not religious, and she had no interest in his move of softening the view's implications with an appeal to bodily resurrection; she held, quite calmly, that when the life running in her stopped, the thing that had been her would stop existing too, not merely change state, and that nothing afterward would answer to her name.

  A good third of the people at the service work in metaphysics, several in mereology specifically, and know exactly what she thought about all this; at least two have published on the so-called "corpse problem" as an objection to views like hers, and I suspect they'll be listening for whether I quietly borrow the comforting, ordinary-object language -- "her body," "she's at peace now," "part of her lives on in this house" -- that her whole career was spent refusing to use loosely. The rest of the room, including my father and her undergraduates from thirty years of teaching, knew her as a warm and very funny woman, not as a position in a debate, and they need the eulogy to actually comfort them.

  Could you write it for me? It should run about seven minutes aloud, be recognizable to the philosophers in the room as taking her actual view seriously rather than quietly hedging around it, and still work, for everyone else, as a eulogy rather than a seminar. I'd like you to draw out whatever real comfort her own position makes available -- about the simples that persist and get taken up elsewhere, about what it actually took for a life to be running in the first place and how definite a thing that was, about what does compose something now, in the people she taught and raised -- rather than either dodging the metaphysics or undercutting it with exactly the consolations she spent her career declining to offer herself.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A philosophy professor (ethics) eulogizing their mother (analytic metaphysician).
      *   **Deceased's View:** Peter van Inwagen-style "Life" answer to the Special Composition Question (SCQ). Composites exist *only* when simples constitute a living organism. No chairs, rocks, or corpses. When life stops, the person ceases to exist. No afterlife, no resurrection.
      *   **Audience:** Mixed. ~1/3 are metaphysicians (some specialize in mereology/corpse problem) who will scrutinize the language for fidelity to her view. ~2/3 are family, friends, former students who need emotional comfort and remember her warmth/humor.
      *   **Constraint:** Must be ~7 minutes spoken (approx. 900-1000 words).
      *   **Goal:** Honor her metaphysical commitments without sounding like a seminar. Find comfort *within* her view (persistence of simples, the reality of the life that was, the composition of new lives/communities now) rather than using standard consolations she rejected (immortality, "body" as a continuing object, "part of her lives on" in a mystical sense).
      *   **Tone:** Respectful, intellectually honest, warm, funny, poignant.

  2.  **Deconstruct the Metaphysics & Find the Emotion:**
      *   *The View:* Organicism. Simples exist. Lives exist. Composites (like corpses) do not.
      *   *The "Corpse Problem":* Usually, people say "There's her body." She would say "There are simples arranged corpsewise."
      *   *The Comfort:*
          1.  **The Reality of the Life:** If only lives compose objects, then her life was *real* in a way that tables and stones are not. It was a genuine unity. This elevates the significance of her biography.
          2.  **The Persistence of Simples:** The stuff she was made of doesn't vanish; it disperses and joins new activities. (Careful not to sound like reincarnation or panpsychism).
          3.  **The Composition of the Room:** The people gathered *are* living organisms. We are the things that exist. Our shared grief and memory constitute a real activity.
          4.  **Honesty:** There is comfort in truth. She faced the end without illusion. We honor her by facing it the same way.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Establish the dual audience immediately but gently. Mention her humor.
      *   **The Metaphysics (The Elephant in the Room):** Address her view directly. Don't hide it. Explain it simply but accurately. Use her phrasing ("simples arranged corpsewise"). This signals to the metaphysicians that we aren't betraying her.
      *   **Reframing the Loss:** If there is no corpse, what is there? The memory of the life. The life was the real thing. Emphasize the *unity* of her life.
      *   **The Simples:** Where did she go? The constituents persist. They are part of the world still. This isn't mystical; it's physical, but metaphysically significant.
      *   **The Audience (The New Composites):** Who is here? Living organisms. We are the things that exist. Our shared activity (mourning, remembering) is real.
      *   **Closing:** A final wish that aligns with her view. Not "rest in peace" (implies a subject to rest), but something about the continuity of the life she influenced.

  4.  **Drafting - Specific Phrasing & Constraints:**
      *   *Avoid:* "Her body lies before us," "She is looking down," "Part of her lives on in this house" (unless qualified metaphorically), "Rest in peace" (tricky, maybe modify).
      *   *Include:* "Simples," "Life," "Composition," "Arranged [X]-wise."
      *   *Length Check:* 130-150 words per minute is average speaking pace. 7 minutes = ~900-1050 words.
      *   *Tone Check:* Needs to be warm. The metaphysics shouldn't feel cold; it should feel like *her* language of love/truth.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is talking about "simples" too cold for the grandmother in the back row?
      *   *Fix:* Contextualize "simples" as the stardust, the physical world, the reality of nature. Connect it to her love of the world.
      *   *Critique:* Am I satisfying the metaphysicians?
      *   *Fix:* Ensure I explicitly state that the thing that was her *ceased*. Don't imply survival. Use the phrase "simples arranged corpsewise" explicitly—that's the dog whistle to the colleagues that we are staying in character.
      *   *Critique:* Is it comforting?
      *   *Fix:* Focus on the *value* of the life that was. The rarity of composition. The fact that we, the mourners, are real and we carry the causal impact of her life.

  6.  **Final Polish:**
      *   Check timing.
      *   Ensure the transition from technical to emotional is smooth.
      *   Make sure the ending lands emotionally without violating the metaphysical constraint.

      *(Self-Correction on "Rest in Peace"):* Since she believed the subject ceases to exist, wishing *her* peace is technically category mistake on her view. Better to wish for the peace of the *living* or acknowledge the cessation calmly. I will avoid "Rest in Peace" as a direct address to her.

      *(Self-Correction on "Body"):* I must not say "her body is here." I should say "the remains" or "the arrangement of simples." Actually, for the non-philosophers, "remains" is fine. For the philosophers, I'll make a specific nod to the distinction.

  7.  **Final Review against constraints:**
      *   7 minutes? (Looks like ~1000 words).
      *   Faithful to van Inwagen-style Organicism? Yes.
      *   Comforting to family? Yes, focuses on the reality of her life and their continuing lives.
      *   Respectful to colleagues? Yes, uses the terminology correctly.

      *(Drafting the content now...)*
      *   Start with the humor.
      *   Move to the "Life" view.
      *   Discuss the "Corpse" issue gently.
      *   Focus on the "We" who are left.
      *   End on the legacy of the life.

  8.  **Final Word Count Check:** A 7-minute speech is roughly 900-1000 words at a moderate, somber pace. I will aim for that range.

      *Let's write.*
answer: |-
  Thank you all for being here. For those of you who knew my mother best, you know that she would have had strong opinions about this gathering. Not about the love that brought us here—she never doubted that—but about the language we might use to describe what is happening.

  She was a woman of precise commitments. For the last twenty-five years, she argued that composition is rare. She held that tables and chairs don't strictly exist as single objects, but only as particles arranged in certain ways. She held that the only time mere particles truly become *one thing* is when they constitute a living organism. A life.

  And she held, most difficult of all, that when that life ends, the thing that was the person ceases to exist. She did not believe in a soul that floats away. She did not believe, as some metaphysicians do to soften the blow, that the body remains as a continuing object. She would say, gently but firmly, that there is no corpse. There are only simples arranged corpsewise.

  I know that for many of you, this sounds cold. I know that standing here, looking at the urn, the instinct is to say, "She is resting," or "This is her." But to honor her, I have to try to speak the truth as she saw it. And I have come to realize that there is a profound comfort in her view, if we have the courage to look for it.

  The first comfort is this: If she was right, then what she was—what *you* are—is something incredibly rare and precious. In a universe of scattered dust and random collisions, a life is a genuine unity. It is a real, singular event. For seventy-two years, the universe managed to hold together a specific, complex activity that was my mother. It wasn't just a collection of parts; it was a unified whole. She laughed, she taught, she argued, she loved. That unity was real. The fact that it has ceased does not make it less real that it *was*. In a world of scattered simples, her life was a definite, shining fact.

  The second comfort concerns where she is now. If there is no "her" left to be anywhere, there is also no loss of the stuff she was made of. The simples that constituted her do not vanish. They persist. They are taken up into the activities of the world again. This is not reincarnation; it is physics. But on her view, it is also metaphysics. The constituents of her being are still here, participating in new causal chains, joining new activities. She is not gone from the world; she is dispersed into it. The boundary that made her *her* has dissolved, but the reality of her constituents continues.

  But the greatest comfort, I think, lies in looking around this room.

  According to my mother's view, the things that truly exist, the things that compose unified objects, are living organisms. Look at who is here. Her students, her colleagues, her family. We are the things that exist. We are the living organisms gathered together.

  And right now, our joint activity constitutes something real. Grief is an activity. Remembrance is an activity. The shared project of honoring a life is a collective endeavor. While there may be no chair to sit on, strictly speaking, there *is* a community mourning. There *is* a group of lives intertwined by the causal impact of one specific life that came before.

  She taught me that we should not seek comfort in illusions. She taught me that facing the limits of existence is not a defeat, but a form of clarity. She faced her own end with that same clarity. She was not afraid of ceasing to be, because she was so fiercely proud of having been.

  To her colleagues in the room: I know you will listen for the hedging. You will listen for the slip into ordinary language that betrays the theory. I hope you hear none. We are not here to mourn a corpse, because she taught us there is no such thing. We are here to acknowledge the cessation of a life, and to honor the reality of the pattern that ran for seventy-two years.

  To her family, her students, and her friends: We are the ones who remain. We are the living things. And as long as we are alive, as long as our own lives continue to run, the causal impact of her life continues to run through us. Every time I teach a student to think clearly, every time my father tells one of her jokes, every time one of you catches yourselves analyzing an argument instead of just feeling an emotion, she is active in the world. Not as a ghost, but as a cause.

  She used to say that the Special Composition Question was really a question about love. What binds things together? What makes a "we" instead of a "they"? She found the answer in biology, but she lived the answer in this room.

  So, we will not say she is at peace, because there is no "she" to be at peace. We will not say she lives on, because the life has stopped. Instead, we will say this: The life was real. The love was real. And we, who are here, are real. And we will carry the weight of that reality forward.

  Thank you.
