  The rain hammered the roof of the A-frame, a rhythmic drumming that had lasted since they sat down at the oak table. The offer letter from the development group lay in the center, white and stark against the dark wood.

  "We agreed on the protocol," Alex said, tapping the paper. "Mom's rule. We don't sell unless two things are true. One: the offer meets the threshold. Two: the maintenance is beyond our capacity. Both keys have to turn."

  Blake nodded, swirling the dregs of his coffee. "I remember. Both keys."

  Casey rubbed their temples. "So let's turn them."

  Alex pulled a notepad closer. "Key one. Is the offer above four hundred thousand?"

  Alex raised a hand. Blake raised a hand. Casey kept theirs down.

  "Two to one," Alex said, marking a check. "The money is sufficient."

  "Key two," Casey said, voice tight. "Is the upkeep too much for us to handle individually?"

  Alex raised a hand immediately. Casey followed suit. Blake hesitated, looking out the window at the peeling paint on the deck, then kept his hand on the table.

  "Two to one," Alex said, marking another check. "The burden is too high."

  Alex capped the pen. "Both keys are turned. According to the protocol, we accept the offer. We sell."

  Blake shifted in his chair. "Wait. Hold on."

  "The math is done, Blake," Alex said.

  "The math is one thing. The decision is another." Blake leaned forward. "Let's just vote on the decision. Right now. Do we sell the cabin?"

  Alex raised a hand.

  Blake kept his down.

  Casey kept theirs down.

  The silence stretched, heavier than the rain. Alex looked at the notepad, then at the hands, then back at the notepad.

  "That's wrong," Alex said.

  "It's a direct vote," Blake said. "Majority rules. We keep the cabin."

  "But we just agreed," Alex said, pointing at the checks. "We agreed the price is good. We agreed the work is too hard. If the price is good and the work is too hard, we sell. That was the deal."

  "I voted that the price was good," Blake said. "But I don't want to sell. Because I don't think the work is too hard."

  "I voted the work is too hard," Casey said quietly. "But I don't want to sell. Because I don't think the price is good enough."

  Alex stared at them. "So individually, you both have reasons to say no. But collectively, you both said yes to the conditions that force a yes."

  "Collectively doesn't sign the deed," Blake said. "People do."

  "But if we follow the conditions we set," Alex insisted, tapping the paper again, "the group position is that the price is high and the burden is heavy. If the group position is those two things, the group position has to be 'sell.' Otherwise, why did we vote on the conditions?"

  "Because I wanted to know if you thought the price was fair," Blake said. "Not to bind me to a conclusion I disagree with."

  "And I wanted to know if you felt the burden," Casey added. "Not to force a sale based on a price I think is too low."

  Alex pushed the notepad away. "So we have a majority saying the conditions are met. And a majority saying the action shouldn't be taken. We can't sign the offer if the majority says no. But we can't keep the cabin if the majority says the conditions for selling are met."

  "Then one of the votes was wrong," Blake said.

  "Which one?" Casey asked.

  Blake looked at the offer letter. Casey looked at the rain. Alex looked at the notepad, where the two checkmarks sat neatly above a conclusion that no longer seemed to exist.

  "We have to vote again," Alex said.

  "On what?" Blake asked. "The conditions or the result?"

  "On what matters," Alex said.

  "They both matter," Casey said. "That's the problem."

  The rain continued to beat against the glass, obscuring the trees outside, making it impossible to tell where the yard ended and the woods began. Alex picked up the pen, hovered it over the paper, and waited. Blake crossed his arms. Casey poured more coffee, the liquid dark and steaming in the cold room. None of them moved to pick up the phone. None of them moved to put the letter away.
