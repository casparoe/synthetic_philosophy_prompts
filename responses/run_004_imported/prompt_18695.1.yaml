      *   **The Pivot (The Mom Connection):** Connect the philosophy to her specific career. Address the elephant in the room (35 years of "work").
      *   **Reframing Teaching:** How did she avoid the "purposive trap"? She didn't teach for the future; she taught for the *now*. The curiosity, the discussion, the moment of understanding.
      *   **Addressing the Audience (Students/Colleagues):** Tell them how they fit in. They aren't her "legacy"; they were her *partners* in the activity.
      *   **The Philosophy Check (for the grads):** Ensure the distinction between *Zwecktätigkeit* (purposive activity) and *Spiel* (play/joy) is clear without using the German terms necessarily.
      *   **Closing:** A toast to the future, but defined correctly (more time for things done for their own sake).

