answer: |-
  **MEMORANDUM**

  **TO:** Foundations Working Group
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Classical Axioms in Core Library

  ### 1. Executive Summary

  After reviewing the trade-offs between computational content and formalization velocity, I recommend we **maintain an intuitionistic core (no global classical axioms)** while establishing a standardized `Classical` module for local reasoning.

  We should not bake the Law of Excluded Middle (LEM) or the Axiom of Choice (AC) into the kernel or global namespace. Instead, we will treat classical reasoning as an optional dependency that must be explicitly imported or invoked. This preserves the project's unique value proposition for the CS/Algorithms track (code extraction) while unblocking the Analysis track via scoped classical instances and `noncomputable` tagging.

  ### 2. Context and Conflict

  The group is currently divided between two valid priorities:
  1.  **Formalization Velocity (Analysis Group):** Standard real analysis is cumbersome constructively. Proofs regarding maxima of finite sets, decidable equality, and convergence often require significant overhead without LEM. Citing `mathlib`'s success, this group argues that global classical logic is the pragmatic standard for mathematical libraries.
  2.  **Computational Content (PL Group):** The ability to extract verified algorithms from proofs is a primary differentiator of this project. Global classical axioms render definitions `noncomputable` by default, obscuring which lemmas correspond to actual code. This group argues that a constructive core is essential for the algorithms course integration.

  ### 3. Technical Analysis

  #### 3.1 The "Mathlib Precedent" Argument
  It is true that `mathlib` (Lean 3/4) adopted classical logic by default. This decision prioritized the formalization of mainstream mathematics over program extraction. For a general-purpose math library, this is the correct trade-off; the vast majority of mathematicians do not intend to compile their proofs to OCaml or C.

  However, our project scope differs. We are a CS department project with an explicit goal of integrating with an algorithms course. If we adopt `mathlib`'s architecture wholesale, we lose the ability to guarantee that a formalized sorting algorithm, for example, actually compiles to executable code. We would be building a math library, not a verified systems library. Therefore, `mathlib`'s precedent is instructive but not binding.

  #### 3.2 The "Choice without LEM" Compromise
  A compromise was suggested wherein we adopt the Axiom of Choice but withhold Excluded Middle. Technically, this is incoherent in constructive type theory due to **Diaconescu's Theorem**.

  Diaconescu's Theorem demonstrates that even a weak form of AC implies LEM. The intuition is as follows:
  1.  Construct a set $U = \{ x \in \{0,1\} \mid (x=0 \lor P) \land (x=1 \lor \neg P) \}$ for some proposition $P$.
  2.  $U$ is inhabited (by 0 or 1).
  3.  Apply AC to choose an element $u \in U$.
  4.  Check if $u=0$ or $u=1$. Because $u$ was chosen from $U$, this check effectively decides $P$.
  5.  Thus, AC grants us the ability to decide arbitrary propositions, deriving LEM.

  Consequently, adding AC globally *is* adding LEM globally. There is no middle ground at the core level. We must choose between a fully constructive core or a fully classical one.

  #### 3.3 The Constructive Friction
  The Analysis group is correct that constructive formalization is painful. For example, stating that "a nonempty finite set of reals has a maximum" requires the set to have decidable equality and the reals to have a constructive order structure, which is non-trivial.

  However, much of this friction can be mitigated without global axioms by using **Typeclasses**. We can require `DecidableEq` or `LinearOrder` as instance arguments on specific lemmas. This makes the requirements explicit: if a function requires decidable equality to compute, the type signature says so. This is a feature, not a bug, for the CS track.

  ### 4. Recommendation: Constructive Core, Scoped Classical

  I propose we adopt the following architecture:

  1.  **Core Logic:** The kernel remains intuitionistic. No global axioms.
  2.  **The `Classical` Module:** We provide a module that defines `axiom classical_choice` and `axiom excluded_middle`.
  3.  **Scoped Usage:** Users working on Analysis can `open Classical` in their files. This makes classical reasoning available for that scope.
  4.  **Tagging:** Any definition or lemma that relies on the `Classical` module must be marked `noncomputable`.
  5.  **Decidable Instances:** For common friction points (e.g., equality on finite types), we provide constructive instances where possible, and classical instances in the `Classical` module.

  ### 5. Addressing Concerns

  **To the Analysis Group:**
  This approach does not prevent you from doing analysis. It simply requires you to import `Classical` at the top of your file. You will have access to LEM and AC exactly as you would in `mathlib`. The only cost is a one-line import and the acknowledgment that theorems proved in this context cannot be extracted to code. Given that real analysis definitions (limits, continuity) are rarely extracted to code anyway, this is a negligible cost for your workflow.

  **To the PL Group:**
  This approach protects the computational integrity of the core. If a lemma is not marked `noncomputable`, you are guaranteed it is constructive. This allows us to safely identify candidates for the algorithms course. It also prevents the "slippery slope" where a dependency deep in the algebra library quietly introduces AC, breaking extraction for an algorithm defined at the top level.

  ### 6. Implementation Risks

  The primary risk is **leakage**. If a classical lemma is accidentally used in a computable definition, the typechecker must catch it.
  *   *Mitigation:* We must enforce strict `noncomputable` theory checking. If the assistant supports it, we should enable warnings for classical axioms in files marked for extraction.
  *   *Mitigation:* We should document a "Computable Subset" of the library. Core data structures (lists, trees) and algorithms must remain in the constructive namespace.

  ### 7. Conclusion

  Adopting global classical logic would simplify the Analysis work but effectively end the project's viability as a tool for verified algorithms. Conversely, strict constructivism risks stalling the Analysis formalization.

  A **Constructive Core with Scoped Classical** is the only architecture that satisfies both constraints. It acknowledges Diaconescu's Theorem by refusing to split hairs on AC vs. LEM globally, while acknowledging `mathlib`'s pragmatism by allowing classical reasoning where computation is not the goal.

  I recommend we vote to adopt this hybrid policy.

  ***

  **Attachments:**
  *   *Draft of `Classical.lean` module interface*
  *   *Summary of Diaconescu's Theorem proof sketch*
