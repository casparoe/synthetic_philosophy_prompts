  **Move (1) Ana: 1/2**
  Ana correctly identifies the core intuition behind standing: hypocrisy undermines the authority to blame. However, she asserts "zero standing" too quickly without establishing that the two cases are morally equivalent, which is a prerequisite for the hypocrisy charge to stick.

  **Move (2) Leo: -1/2**
  Leo makes a category error common in introductory seminars. He is correct that hypocrisy doesn't make the *proposition* ("Theo was selfish") false, but he fails to grasp that standing concerns the *propriety of the speech act*, not the truth of the content.

  **Move (3) Ana: 2/2**
  This is the strongest philosophical move in the exchange. Ana perfectly distinguishes between the truth-conditions of a moral claim and the warrant-conditions of the blamer, identifying the specific normative injury of the double standard.

  **Move (4) Leo: 1/2**
  Leo pivots effectively from denying standing matters to arguing he *has* standing. By claiming his apology acknowledged the wrong and the factual circumstances differed, he attacks the premise that he is actually a hypocrite, which is a valid defense against a standing objection.

  **Move (5) Ana: 0/2**
  Ana wobbles here. While the skepticism about the apology is fair, her claim that factual likeness is "a totally different question" from standing is confused; in hypocrisy cases, factual/moral likeness is precisely what *determines* standing.

  ***

  ### The Bigger Distinction: Truth-Conditions vs. Warrant-Conditions

  The reason Ana and Leo talk past each other is that they are operating with different models of what blame *is*. Leo treats blame as **assertoric**: he thinks he is merely stating a moral fact ("You did wrong"), so the only thing that matters is whether Theo actually did wrong. Ana treats blame as **authoritative**: she thinks blaming is a normative practice that requires the blamer to have a specific kind of moral license.

  For your paper, the fertile ground isn't just whether Leo is a hypocrite, but **whether having a justification (the exam timing) removes the hypocrisy or merely excuses the act.** Leo argues his reason made his act permissible (or less wrong), so he isn't holding Theo to a *different* standard, just a *relevantly nuanced* one. Ana argues that the *type* of act (prioritizing self over family) is what matters for standing, regardless of the nuance. You can frame this as a debate over whether standing is lost by **moral inconsistency** (believing different things are wrong) or **behavioral inconsistency** (doing different things). Leo claims he is morally consistent; Ana claims he is behaviorally inconsistent, and she argues the latter is what kills standing.
