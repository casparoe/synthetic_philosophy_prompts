answer: |-
  **Title:** The Intention of Destruction: Vindicating Anscombe's Charge Against Truman

  **Introduction**
  Elizabeth Anscombe's 1956 protest against Oxford's awarding of an honorary degree to Harry Truman remains one of the most provocative interventions in modern just war theory. Her pamphlet, *Mr. Truman's Degree*, does not merely argue that the atomic bombings of Hiroshima and Nagasaki were imprudent or disproportionate; it argues that they constituted murder. For Anscombe, the moral quality of an act is determined not by its consequences but by the intention of the agent. By ordering the destruction of cities with the specific aim of killing civilians to coerce surrender, Truman crossed a moral boundary that no calculation of lives saved could bridge. This essay argues that Anscombe's charge of murder is sustainable. While the Doctrine of Double Effect (DDE) faces legitimate philosophical pressure regarding the manipulability of "intention," and while consequentialist arguments regarding the stakes of nuclear war demand serious engagement, neither suffices to exonerate Truman. When combined with the historical reality that Japan's defeat was imminent independent of the bombs, Anscombe's deontological verdict stands firm: the intentional killing of the innocent is never permissible, and in this specific case, the mechanism of the act leaves no room for moral evasion.

  **The Structure of Anscombe's Argument**
  Anscombe's argument rests on a revival of the Scholastic distinction between intended effects and merely foreseen side effects. According to the DDE, an agent may perform an act that has both good and bad effects provided four conditions are met: the act itself is permissible; the bad effect is not intended as an end or a means; the good effect is not produced *by* the bad effect; and there is a proportionate reason for permitting the bad effect. Anscombe contends that the atomic bombings fail the second and third conditions decisively. In a standard tactical bombing of a munitions factory, civilian deaths might be a foreseen but unintended side effect of destroying a military target. In Hiroshima and Nagasaki, however, the cities themselves were the target, and the mechanism of coercion was the mass death and terror of the populace. The killing was not collateral; it was instrumental. For Anscombe, to use the death of the innocent as a lever to move the will of the enemy is to make murder the very engine of one's policy.

  **The Challenge of Redescription**
  The most sophisticated philosophical objection to Anscombe is that the intention/foresight distinction is linguistically malleable. A critic might argue that Truman did not intend "the death of civilians" *per se*, but rather "the destruction of the enemy's will to resist." On this reading, civilian death is merely the inevitable physical correlate of breaking that will, not the intention itself. If the target is "morale," the DDE might seemingly be satisfied.

  However, this redescription collapses under scrutiny in the case of area bombing. Anscombe anticipates this maneuver. One cannot break the will of a nation through terror without actually terrifying them, and in the context of 1945 technology, one could not terrorize a city without incinerating its inhabitants. The death of the civilians was not a separate event from the breaking of the will; it was the method by which the will was broken. If the civilians had survived unharmed but the city was destroyed, the coercive effect would have been negligible. Therefore, the harm to the innocent was not a side effect; it was the means. To claim otherwise is to engage in what Anscombe would call a "corrupt mind"—a willingness to redescribe evil to make it palatable. In this specific instance, the physical reality of the weapon binds the intention to the outcome so tightly that the distinction holds. Truman intended the destruction of the cities *in order to* kill the people within them, because their deaths were the proof of the weapon's efficacy and the source of the coercion.

  **The Consequentialist Pressure**
  A more visceral objection concerns the stakes. Anscombe's absolutism forbids the intentional killing of the innocent even if doing so would save a greater number of innocents. Critics argue that this is moral fetishism. If the invasion of the Japanese mainland (Operation Downfall) would have cost a million Allied lives and several million Japanese lives, does morality really demand we forbear an action that prevents this?

  Anscombe's response is that morality does not operate on a utilitarian calculus where murder can be purchased with enough lives saved. To allow the "greater good" to license the intentional killing of the innocent is to erase the concept of human rights entirely, reducing persons to numbers in an equation. However, the pressure remains: is an ethic that potentially prolongs bloody conflicts sustainable?

  This objection loses force when we examine the specific claim of necessity. The consequentialist defense of Truman relies on the premise that the bomb was the *only* alternative to a catastrophic invasion. If this premise is false, the consequentialist calculus evaporates. If the bomb was not necessary to end the war, then Truman did not save the hypothetical million lives; he merely chose a quicker method of killing over a slower method of strangulation (via blockade and conventional bombing). Anscombe does not need to prove that consequences never matter; she only needs to prove that they cannot justify *murder*. If the act is murder, the consequences are irrelevant. If the act is not necessary, the consequences are fabricated. As we shall see, the historical record suggests the latter.

  **Walzer and the Supreme Emergency**
  Michael Walzer, in *Just and Unjust Wars*, offers a modification to absolutism that seems to challenge Anscombe: the "supreme emergency" exemption. Walzer argues that in moments where a community faces imminent defeat and the threat of enslavement or extermination, leaders may temporarily override the rules of war to survive. Britain's bombing of German cities in 1940-41 might qualify.

  However, Walzer himself turns this exception against Truman. By August 1945, Germany had surrendered. Japan was isolated, its navy destroyed, its cities burning from conventional raids, and its economy collapsed. There was no "supreme emergency" in the sense of an existential threat to the United States or its allies. The defeat of Japan was scarcely in doubt; the only questions were the timing and the terms. Walzer argues that because the emergency was not supreme, the exemption does not apply.

  This convergence is fatal to Truman's defense. If one accepts Anscombe's absolutism, Truman is guilty of murder. If one accepts Walzer's consequentialist-leaning exception, Truman *still* fails the test because the conditions for the exception were not met. The only way to exonerate Truman is to argue that the demand for "unconditional surrender" justified any means, but this is precisely the kind of political absolutism that just war theory exists to curb. The "high stakes" objection fails because the stakes were artificially inflated by a refusal to clarify surrender terms regarding the Emperor, a diplomatic nuance that does not justify the obliteration of civilian populations.

  **Verdict**
  We must now render a verdict on whether Anscombe's charge of murder is sustainable. It is.

  The charge holds because the structure of the act fits the definition of intentional killing of the innocent, and the defenses offered against it crumble under philosophical and historical scrutiny. The "redescription" objection fails because the mechanism of the atomic bomb made civilian death the means of coercion, not a side effect. The "consequentialist" objection fails because it relies on a counterfactual necessity that historical evidence suggests was exaggerated; one cannot trade actual murdered innocents for hypothetical lives saved by a strategy that was not the only path to victory. Finally, the "supreme emergency" exception does not apply to a belligerent that has already secured strategic dominance.

  Anscombe's argument forces us to confront the uncomfortable reality that statecraft is not exempt from the moral laws that govern individuals. To call Truman a murderer is to assert that the office of the Presidency does not grant a license to do what would be a capital crime if committed by a private citizen. While the label is shocking, it is the logical consequence of taking human rights seriously. If the innocent possess a right to life that cannot be forfeited by the actions of their government, then targeting them is murder, regardless of the uniform worn by the person who drops the bomb. Anscombe's refusal to accept a consequentialist calculus in this instance is not a failure of moral imagination, but a necessary bulwark against the normalization of total war. Her charge is sustainable because the alternative—the idea that we may kill the innocent whenever the math looks favorable—is a principle that destroys the very foundation of justice. Truman's degree was not just a diplomatic error; it was a moral obscenity, and Anscombe was right to stand alone in saying so.
