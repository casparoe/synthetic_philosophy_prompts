  2.  **Deconstruct the Ethical/Philosophical Concepts:**
      *   **Lying:** Typically requires *intent to deceive*. If you believe $X$ is true and say $X$, you aren't lying, even if $X$ is false. (Subjective truth vs. Objective truth).
      *   **Misinformation vs. Disinformation:** Disinformation is deliberate (lying). Misinformation is accidental (false but believed).
      *   **Epistemic Responsibility:** This is the key concept supporting the sister's view. It's about the duty one has to ensure the accuracy of information before spreading it, especially in a professional context.
      *   **Trust/Reputation:** Spreading false info damages trust, regardless of intent.
      *   **Professional Norms:** In a workplace, verifying chain-of-command information is often expected, especially when it impacts others' lives (commutes, childcare, etc.).

  3.  **Evaluate the Arguments:**
      *   *Roommate's Point:* Morally, intent is huge. The user didn't *lie*. They were a victim of the manager's misinformation. They shouldn't beat themselves up about *malice*.
      *   *Sister's Point:* Practically and ethically, there's a standard of care. Passing on high-stakes info without verification can be negligent. It's not about *lying*, it's about *reliability*.

