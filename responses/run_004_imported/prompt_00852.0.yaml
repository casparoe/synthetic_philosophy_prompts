answer: |-
  This is a classic ethical dilemma that sits right at the intersection of **intent** (what you meant to do) and **impact** (what actually happened). Both your roommate and your sister are touching on valid points, but they are arguing about two different things.

  To answer your core question: **Yes, there is a profound difference between lying and wrongly asserting something you believe to be true.** However, your sister is also right that "not lying" doesn't automatically mean "no harm done" or "no responsibility taken."

  Here is the breakdown of why this distinction matters, why your coworkers are upset, and where the actual fault lies.

  ### 1. The Definition of Lying (Your Roommate's Point)
  Your roommate is technically correct about the definition of a lie. In ethics and philosophy, a lie requires **intent to deceive**.
  *   **Lying:** You know $X$ is false, but you say $X$ is true to make someone else believe it.
  *   **Mistaken Assertion:** You believe $X$ is true, and you say $X$ is true, but $X$ is actually false.

  You did not lie. You were not deceptive. You did not manufacture this information. Morally, your character is intact because you acted in good faith. If we judge you solely on your honesty, you are in the clear.

  ### 2. Epistemic Responsibility (Your Sister's Point)
  Your sister is pointing toward a concept philosophers call **epistemic responsibility**. This is the idea that we have a duty to be careful about what we claim to know, especially when sharing information that affects other people.

  When you tell a coworker, "We are moving buildings," that isn't just casual chatter. That information impacts their commute, their childcare, their housing situation, and their stress levels. Because the **stakes are high**, the **standard of verification** should also be higher.

  Here is what makes the second action (wrongly asserting) potentially "wrong," even without deception:
  *   **Negligence vs. Malice:** You can hurt someone through carelessness just as easily as through malice. If you borrow a friend's car and crash it because you were texting, you didn't *mean* to crash it, but you are still responsible for the damage.
  *   **The Chain of Trust:** In a workplace, information flows down a chain. When you passed the info on, you became a node in that chain. By presenting it as "fact" rather than "news I just heard," you implicitly vouched for its accuracy.
  *   **The Cost of Correction:** It takes seconds to spread false news, but it takes much more energy to correct it. You inadvertently taxed your coworkers' emotional energy.

  ### 3. Why Your Coworkers Are Mad
  Your coworkers aren't mad that you *lied* to them; they know you didn't. They are mad because **you became the face of a disruption that didn't happen.**

  When they read your message, they likely started mentally planning: *Do I need to leave earlier? Can I still drop my kid off? Is my parking pass still valid?* When they found out it was false, they felt a sense of whiplash. The comment "thanks for the misinformation" is snarky, but it highlights that they hold you responsible for the *spread* of the info, not the *creation* of it.

  ### 4. Where the Fault Actually Lies
  While your sister is right about the principle of verification, **you are being too hard on yourself regarding the specific context.**

  You are not the manager. You were called into an office and told something "matter-of-factly" by the person whose *job it is to know this information.*
  *   **The Manager's Failure:** The manager failed in two ways. First, by not knowing the move was cancelled. Second, and more importantly, by telling you it was a done deal without verifying it herself.
  *   **Your Position:** In a corporate hierarchy, it is generally reasonable to trust official communication from a manager. If you start questioning every announcement your manager makes as "just a rumor," you risk undermining your own leadership and creating anxiety.

  You failed a minor test of epistemic responsibility, but your manager failed a major test of leadership responsibility.

  ### 5. How to Resolve It
  You can't change the past, but you can control how you handle the aftermath. To fix the tension with your team, you need to validate their frustration without accepting blame for the deception.

  **Don't say:** "I'm sorry I lied." (You didn't.)
  **Don't say:** "It's not my fault, it's the manager's." (This sounds defensive.)
  **Do say:** "I know this caused a lot of unnecessary planning and stress, and I'm sorry for that. I was told this was confirmed by leadership, so I passed it on in good faith, but I understand how frustrating it is to get false info. I've clarified with management that nothing is moving."

  ### The Verdict
  *   **Is it lying?** No. Your roommate is right. You maintained your integrity.
  *   **Is it wrongdoing?** Not really, but it is a **professional error.** Your sister is right that we have a duty to be careful with facts, but in this specific case, your reliance on your manager was reasonable.

  **The Takeaway:**
  The difference between lying and spreading misinformation is the difference between **malice** and **negligence.** One damages your honesty; the other damages your reliability. You haven't lost your honesty, but to rebuild your reliability, acknowledge the *impact* of the error on your team, clarify the source, and move forward. Next time, if the news is big, a simple "I was told this is happening, but waiting for official written confirmation before making plans" protects you and your team.
