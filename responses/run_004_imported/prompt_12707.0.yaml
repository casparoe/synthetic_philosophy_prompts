answer: |-
  Good evening, everyone. For those who don't know me, I'm the groom's older brother. It is a profound honor to stand here today.

  Now, many of you know that [Groom] and [Bride] are finishing their PhDs in philosophy. For the rest of you, that basically means they enjoy arguing about things most people take for granted. In fact, their relationship began with a specific kind of argument. On their first date, [Groom] tried to explain a concept called Kripke's Wittgenstein rule-following paradox.

  Most people talk about the weather on a first date. [Groom] talked about the impossibility of meaning. And miraculously, [Bride] not only listened, she agreed to marry him.

  But as I started preparing this toast, I have to admit, I got a little worried. Because if you really dig into [Groom]'s favorite paradox, it poses a genuine problem for a wedding.

  Here's the worry: How do we know that the rules we follow today will mean the same thing fifty years from now? In philosophy, this is the problem of "plus" versus "quus." Imagine a rule that looks exactly like addition for every number you've ever used, but after a certain point, it does something totally different. No finite amount of past behavior can logically guarantee that you aren't following the trickster rule.

  So, apply that to marriage. [Groom] and [Bride] are saying "til death do us part" tonight. But how can they be sure that in forty years, in the middle of a difficult Tuesday, the phrase "do us part" will express the same commitment it does right now? What if the meaning drifts? What if "faithfulness" turns into "quus-faithfulness"? If meaning is just a private feeling in your head, there is no guarantee.

  For the philosophers in the room, you know where I'm going. For everyone else, stick with me, because the answer is actually beautiful.

  Kripke's Wittgenstein offers a "skeptical solution." It says that we stop looking for the meaning of a rule inside a person's private mind. You can't find the guarantee there. Instead, meaning is found in the *community*. A rule is only a rule if there are other people around to check you, correct you, and agree with you on how it's applied. We don't follow rules in isolation; we follow them together.

  And that is exactly why we are all here.

  If marriage were just a private contract between two minds, the paradox would win. There would be no way to lock in the meaning of "forever." But marriage is not a private act. It is a public practice.

  [Groom] and [Bride], the guarantee that your vows will mean the same thing in fifty years as they do tonight does not rest solely on your individual willpower. It rests on us.

  It rests on the parents who modeled what commitment looks like. It rests on the friends who will call you when you're drifting. It rests on this community, gathered here, to witness your promises and to hold the space for them. We are the ones who will help you ensure that "plus" never turns into "quus." We are the witnesses who make the rule real.

  So, [Groom], you don't have to carry the burden of fixing the meaning of your marriage alone. You have a village. And [Bride], you married a man who worries about the foundations of logic, but he found the only solution that matters: you, and all of us.

  Please raise your glasses.

  To the couple: May your life together be full of love, may your rules be clear, and may you always find the truth not just in your heads, but in the hands you hold.

  To [Groom] and [Bride]!
