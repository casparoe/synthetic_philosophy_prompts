answer: |-
  **Title: The Indexical Heart**

  Elias sat at the kitchen table, the rain blurring the window into a gray smear. On the table lay a copy of David Lewis's *On the Plurality of Worlds*, dog-eared on page twenty. He wasn't a philosopher, just a man who couldn't sleep, but the argument had hooked into his ribcage and refused to let go.

  *Every way a world could possibly be is a way some world is.*

  He looked at his coffee mug. Chipped rim. Blue glaze. In this world, he had dropped it last Tuesday. In another world, his hand had been steady. In another, he never bought the mug. In another, he never made coffee because he was already dead. In another, Mara was still here.

  That was the seduction of it. Usually, when you lost something, it vanished into the void of non-existence. It became nothing. But Lewis said no. Nothing is lost. The version of Elias who woke up next to Mara this morning wasn't a fantasy or a counterfactual conditional. He was flesh and blood. He was drinking coffee right now. He was just… over there.

  Elias closed his eyes. He tried to feel the weight of that plenitude. The universe wasn't a single thread; it was a vast, dark ocean of bubbles, each one a concrete reality. But the walls of the bubbles were absolute. No light leaked through. No gravity reached across. No prayer could bridge the gap.

  He picked up his phone. Mara's number was still in his favorites. He knew the statistics of his regret. He knew that in a significant percentage of the logical space, he had picked up the phone three years ago and said, *Don't go.* In those worlds, this silence didn't exist.

  But the isolation clause was the killer. *Spatiotemporally isolated.*

  It meant that the Elias who saved the relationship wasn't waiting for him in the future. He wasn't a potentiality. He was a stranger. A concrete stranger living a concrete life in a disconnected cosmos. Elias wasn't the protagonist of reality; he was just the Elias located *here*. "Actual" was just a word like "now" or "this." It didn't mean *real*. It just meant *where I am standing.*

  A profound loneliness washed over him, colder than the rain against the glass. It wasn't the loneliness of being alone in a room. It was the loneliness of being one specific coordinate in an infinite grid of selves.

  He imagined the other Eliases. Some were happy. Some were miserable. Some were writing this story. Some were burning the book. They were all equally real. None of them could help him. None of them could know he existed. He was causally sealed in this specific tragedy.

  He stood up and walked to the sink. He ran the water until it was hot, then turned it off. He looked at his reflection in the dark window.

  For the first time, the regret didn't feel like a mistake. It felt like a location.

  He hadn't failed to live the other lives. He was simply inhabiting this one. The grief wasn't proof that things went wrong; it was just the texture of *this* world's geology. The happy Elias elsewhere wasn't the one who got the prize. He was just the one located in the happy sector.

  Elias dried his hands. He walked back to the table and closed the book. The silence in the kitchen was heavy, absolute, and entirely his own. He couldn't visit the others. They couldn't visit him. There was only this index. This "here." This "now."

  He picked up the chipped mug. It felt solid. It felt heavy. It felt actual.

  "Okay," he whispered to the empty room. "I'm here."

  He took a sip. The coffee was cold, but it was real. And for now, that was the only reality he was allowed to touch.
