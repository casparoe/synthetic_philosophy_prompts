prompt: |-
  I'm working on a novel and honestly the main character is pretty obviously based on an ex of mine. The details are specific enought that they'd recognize themselves. My justification is that it's my story to tell, you know? Writers do this all the time. But then I started doing this weird thought experiment where I imagined everyone I'd ever been close to did the exact same thing -- like they all fictionalized our shared moments and memories and put them in their books without checking with me first. And the thought of that made me deeply uncomfortable. So what does that discomfort mean? Does it actually tell me anything about whether what I'm doing is okay?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Action:** The user is writing a novel where the main character is clearly based on an ex-partner.
      *   **Specificity:** The details are specific enough that the ex would recognize themselves.
      *   **Justification:** "It's my story to tell," "Writers do this all the time."
      *   **Trigger:** A thought experiment imagining *everyone* they've been close to doing the same thing (fictionalizing shared memories without consent).
      *   **Reaction:** Deep discomfort.
      *   **Question:** What does this discomfort mean? Does it indicate whether the action is ethically okay?

  2.  **Deconstruct the Ethical Dilemma:**
      *   **Artistic Freedom vs. Personal Privacy:** This is the core conflict. Writers *do* draw from life. However, there's a line between inspiration and exploitation/exposure.
      *   **The "Golden Rule" Aspect:** The user's thought experiment is essentially the Golden Rule ("Do unto others..."). The discomfort arises from realizing they wouldn't want this done to them.
      *   **Power Dynamics:** Who controls the narrative? If the ex is portrayed negatively, it could be damaging.
      *   **Legal vs. Ethical:** Legally, fiction is protected (mostly), unless it's defamatory or invades privacy in a specific way. Ethically, it's murkier.
      *   **The Purpose of the Art:** Is the specificity *necessary* for the art, or is it vindictive/processed trauma?

  3.  **Evaluate the Discomfort:**
      *   **Empathy Signal:** The discomfort is a sign of empathy. It means the user recognizes the ex as a person with agency and privacy, not just a character.
      *   **Ethical Compass:** It suggests the user's internal moral compass is flagging a potential boundary crossing.
      *   **Validity:** Yes, it tells them something important. It highlights the difference between *using* life as material and *exposing* someone without consent.

  4.  **Formulate the Advice:**
      *   **Validate the Feeling:** Acknowledge that the discomfort is significant and common among ethical writers. It's not just anxiety; it's moral intuition.
      *   **Address the "Writers Do This" Argument:** Acknowledge it's true (autofiction, roman à clef), but note that "common" doesn't always mean "harmless" or "kind." Many writers regret this or face fallout.
      *   **Analyze the Thought Experiment:** This is the strongest point. The Golden Rule test failed. Why? Because being turned into a character without consent feels violating.
      *   **Distinguish Between Inspiration and Identification:**
          *   *Inspiration:* Taking a trait, a vibe, a situation.
          *   *Identification:* Specific details that make the person recognizable.
      *   **Consider the Consequences:**
          *   Damage to the ex (reputation, emotional distress).
          *   Damage to the writer (reputation, guilt, legal issues).
          *   Damage to the art (does the specificity serve the story, or just the ego/trauma?).
      *   **Offer Solutions/Mitigation:**
          *   Change the details (composite characters, alter key identifiers).
          *   Focus on the *truth* of the emotion, not the *facts* of the event.
          *   Ask: "Is this necessary?"
          *   Consider the "Public Figure" test (is this person private?).

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic, non-judgmental, but firm on the ethical implications.
      *   *Structure:*
          1.  Validate the discomfort (it's a good sign).
          2.  Analyze the "Writers do this" defense (nuance needed).
          3.  Break down the thought experiment (why it matters).
          4.  Practical questions to ask themselves.
          5.  Middle-ground solutions (fictionalizing enough).
      *   *Key Insight:* The difference between writing *about* someone and writing *using* someone.

  6.  **Refining the Content (Self-Correction during drafting):**
