  ### Case Justifications

  **S Tier:** **Counterfactual Mugging** is the purest test of *updatelessness*; CDT updates on the coin flip result and refuses to pay, while UDT honors the pre-commitment policy. **Transparent Newcomb** forces the agent to ignore direct visual evidence (seeing the money) to maintain the logical correlation required for the predictor to have filled the box, isolating the "updateless" mechanic from mere prediction.

  **A Tier:** **Newcomb's Problem** is the paradigm case, though CDT proponents often dig in on the "money is already there" intuition. **XOR Blackmail** isolates logical correlation from common-cause correlation, forcing CDT to pay for information that UDT recognizes as spurious. **Absent-Minded Driver** tests updatelessness over self-locating beliefs and memory loss, where CDT fails to maintain a consistent policy across intersections. **Twin Prisoner's Dilemma** (Addition) strips away the "predictor" mystique to reveal pure logical correlation between identical decision procedures, which CDT ignores.

  **B Tier:** **Parfit's Hitchhiker** is essentially sequential Newcomb; CDT fails to pay upon arrival, but the disagreement is often framed as CDT vs. EDT regarding promises. **Psychopath Button** is primarily a CDT vs. EDT battle regarding self-knowledge and evidential correlations; UDT sides with EDT, but the core tension isn't strictly about *updatelessness* over time.

  **C Tier:** **Death in Damascus** demonstrates CDT's deliberational instability (oscillation), which UDT resolves by selecting a stable policy. However, since no theory allows the agent to survive a perfect predictor, UDT does not earn a utility advantage, only a coherence advantage.

  **F Tier:** **Newcomb's Soda** (Addition) involves a common-cause correlation rather than logical correlation or prediction. Both CDT and UDT correctly recommend drinking the soda (ignoring the evidential link), so the case discriminates EDT from the others but fails to wedge UDT against CDT.

  ***

  ### On Death in Damascus and the Psychopath Button

  Your intuition is correct: these cases belong to a slightly different category than the core "updatelessness" arguments.

  **Death in Damascus** is primarily an argument against **CDT's deliberational stability**, not necessarily an argument for UDT's *superiority in outcomes*. In this case, the predictor is perfect, so the agent dies regardless of the decision theory employed. UDT "wins" only in the sense that it avoids CDT's infinite loop of re-evaluation (the "trembling hand" instability). It shows that CDT is broken as a deliberative procedure, but it doesn't show UDT securing a better payoff than CDT could have secured with a fix. It belongs in a "CDT Coherence" folder rather than a "UDT Advantage" folder.

  **The Psychopath Button** is classically a **CDT vs. EDT** problem. The crux is whether an action provides *evidence* about a fixed trait (being a psychopath) that CDT should ignore. UDT aligns with EDT here because it treats the logical correlation between "being the type to press" and "being a psychopath" as decision-relevant. While UDT gets the right answer (don't press), the case doesn't hinge on *temporal* updatelessness (like Counterfactual Mugging) or *logical* simulation (like Newcomb) as much as it hinges on how to handle self-locating evidence about one's own nature. It's a strong case against naive CDT, but less specific to the *updateless* machinery that defines UDT against TDT or EDT.
