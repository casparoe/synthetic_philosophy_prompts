          *   *CDT Problem:* If I stay, Death is likely there $\rightarrow$ go. If I go, Death is likely there $\rightarrow$ stay. No stable pure equilibrium.
          *   *Ratificationist Solution:* Mix 50/50. Makes Death's location independent of my choice (in expectation). It's self-ratifying.
          *   *Intuition:* Mixing seems plausible (or at least, better than being predictably dead).

      *   **Psychopath Button (PB):**
          *   *Setup:* Paul considers pressing a button that kills all psychopaths. Paul is confident he's not a psychopath. *However*, only a psychopath would press the button.
          *   *CDT Problem:* If I press, I'm likely a psychopath $\rightarrow$ bad (maybe I die too? Or just moral repugnance? Usually, the setup implies pressing is evidence you're a psychopath, and psychopaths are miserable/bad). Let's stick to Egan's version: Pressing kills psychopaths. Paul isn't one. But only psychopaths press. So if Paul presses, he's a psychopath, so he dies.
          *   *Ratificationist Problem:* If I decide to press, I update that I'm a psychopath $\rightarrow$ pressing leads to death $\rightarrow$ don't press. If I decide not to press, I update I'm not a psychopath $\rightarrow$ pressing would have been good (kill psychos, I live) $\rightarrow$ wait, why didn't I press?
          *   *Wait, check the Ratification status in PB:*
              *   Option A (Press): If I decide to press, I believe I'm a psychopath. If I'm a psychopath, pressing kills me. Utility is low. Not ratifiable.
              *   Option B (Don't Press): If I decide not to press, I believe I'm not a psychopath. If I'm not a psychopath, pressing would kill psychos and spare me. Utility of pressing > Utility of not pressing. So "Don't Press" is *not* ratifiable either.
          *   *Intuition:* Don't press. Absolutely do not press. Mixing (flip a coin to potentially kill yourself) seems insane.

  3.  **Identify the Crucial Difference:**
      *   In *Death in Damascus*, the correlation is between *choice* and *external state* (Death's location). The mixed strategy breaks the correlation.
      *   In *Psychopath Button*, the correlation is between *choice* and *agent type* (Psychopath vs. Normal).
      *   *Key Insight:* You can't mix away your type. A mixed strategy in PB means "Sometimes I am the kind of person who presses." But the button setup says "Only psychopaths press." So if you mix, you are admitting a probability of being a psychopath.
      *   *Symmetry vs. Asymmetry:* DiD is symmetric (Death wants you dead regardless). PB is asymmetric (Pressing is good *unless* it reveals you're the kind of person who dies).
      *   *The "Tickle" Defense:* Egan uses PB to argue against CDT. But the Ratificationist response to PB is tricky.
      *   *Ah, the Real Issue:* In DiD, the mixed strategy makes the *outcome* independent of the choice (Death can't predict). In PB, the mixed strategy doesn't make the *type* independent. The act provides evidence about a fixed property.

  4.  **Evaluate Ratificationism's Status:**
      *   Does Ratificationism actually solve PB?
      *   Standard Ratificationism (Harper/Arntzenius): Requires an option to be ratifiable (maximize expected utility given the decision to take it).
      *   In PB, *neither* pure option is ratifiable.
      *   Does a mixed strategy help? If I mix 50/50, I still have to conditionalize on "I am undertaking a 50/50 mix." Does that imply I'm a psychopath?
      *   *Egan's Point:* Egan argues that CDT (even with ratification) gets it wrong because it tells you to press (if you think you aren't a psychopath) or gets stuck.
      *   *Wait, let's look closer at the intuition:* Why is "Don't Press" the right answer in PB if it's not ratifiable?
      *   Because "Don't Press" is *stable* in a way "Stay" isn't in DiD. In DiD, if you stay, you die. In PB, if you don't press, you live. The fact that pressing *would have been better* conditional on not pressing is a counterfactual that feels less binding than the immediate death in DiD.
      *   *Actually, the standard view:* Many decision theorists think Ratificationism *fails* on Psychopath Button. This is a known objection to Ratificationism (e.g., by Egan himself, or Joyce).
      *   *So the instructor's worry is valid:* Ratificationism might just look good in DiD because of symmetry.

