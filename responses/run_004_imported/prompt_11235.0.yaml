answer: |-
  This is excellent research on your part. You are absolutely right to be skeptical of the pop-culture version of Thomistic tyrannicide. The "Natural Law says kill tyrants" soundbite is usually a distortion of a much more fragile, heavily qualified argument.

  For your uncle to sound convincing, he needs to articulate that for Aquinas, **authority is ontological, not just functional.** It's not just about what the ruler *does*, but where his power *comes from*.

  Here are the moving parts broken down for dialogue construction, focusing on the three specific areas you mentioned.

  ### 1. The Usurper vs. The Legitimate Tyrant
  **The Concept:**
  For Aquinas, there is a metaphysical difference between a ruler who seized power illegitimately (*tyrannus ex defectu tituli*) and a ruler who had legitimate title but governs badly (*tyrannus ex parte exercitii*).

  *   **The Usurper:** He has no bond of allegiance with the people. He is essentially a foreign invader or a criminal holding a gun to the state's head. Removing him is closer to self-defense against an aggressor.
  *   **The Legitimate Tyrant:** He holds authority from God (via the community). Even if he abuses it, he holds an "office" that is sacred. To kill him is not just to stop a bad man; it is to violate the order of authority itself.

  **For the Uncle:**
  If your President took power in a coup ten years ago, he is technically a **usurper**. This is the Colonel's strongest argument.
  *   *The Uncle's Counter:* "Ten years is a long time, nephew. Has the nation accepted him? Have the courts sworn to him? Has the church anointed him? Sometimes a stolen crown, if worn long enough without challenge, becomes a lawful one by the consent of the governed. If the people have acquiesced, he is no longer a stranger. He is a father who beats his children. And a child does not kill his father."

  ### 2. Private Person vs. Public Authority (The Crucial Hurdle)
  **The Concept:**
  This is the biggest hurdle for your Colonel. Aquinas is explicitly clear in the *Summa Theologiae* (II-II, Q. 42, A. 2) that **private individuals** cannot kill tyrants.
  *   **The Danger of Private Action:** If any private citizen decides a ruler is tyrannical and kills him, you invite anarchy. Every malcontent becomes a judge. The remedy (assassination) is often worse than the disease (tyranny) because it destabilizes the very idea of order.
  *   **The Requirement of Public Authority:** Action against a tyrant must come from a "public authority." In the Middle Ages, this meant a superior lord (like the Emperor over a King) or a representative body (the Estates, the Senate, the People acting as a corporate whole).
  *   **The Colonel's Problem:** A Colonel is a state employee. Unless the Army *as an institution* or a legitimate civilian body has ordered this, he is acting as a private person wearing a uniform.

  **For the Uncle:**
  *   *The Uncle's Argument:* "Thomas asks: *Who sends you?* If you act alone, or with a clique of officers, you are not a liberator. You are a seditionist. To kill a tyrant without public mandate is to say that your judgment is higher than the law. If you succeed, you teach every future captain that he may kill his general. You don't end tyranny; you normalize murder."

  ### 3. The Shift: *Commentary on the Sentences* vs. *Summa Theologiae*
  **The Concept:**
  You picked up on a real scholarly nuance.
  *   **Early Aquinas (*In II Sent.*, dist. 44):** Writing as a young bachelor, he is slightly more permissive regarding usurpers. He suggests that if there is no superior to appeal to, killing a usurper *might* be praiseworthy. It's more theoretical.
  *   **Mature Aquinas (*Summa* & *De Regno*):** The older Aquinas is a pastoral realist. He worries about the *consequences*. In *De Regno*, he argues that often, removing a mild tyrant provokes a worse one, or the removal process causes such civil strife that the tyranny becomes preferable. He emphasizes that the community must act, not an individual. He moves from "Is it metaphysically permissible?" to "Is it practically prudent?"

  **For the Uncle:**
  *   *The Uncle's Confession:* "I read the young Thomas when I was in the seminary. He wrote that a usurper could be slain by anyone, if no judge was near. It felt like fire in the blood. But the old Thomas... the one who wrote the *Summa*... he grew afraid of the fire. He saw that when you kill a king in the dark, you don't get liberty. You get a vacuum. And nature abhors a vacuum. It fills with blood."

  ### Putting it in the Uncle's Mouth (Dialogue Strategy)

  Don't let the uncle lecture. Let him interrogate. The Thomistic method is dialectical (question and answer). Here is how you can layer these points into a scene:

  **1. Challenge the "Usurper" Label:**
  > "You call him a usurper. I call him a ten-year incumbent. When did he stop being a thief and start being a king? Was it year three? Year five? Or does the blood of the coup never wash off? Thomas says a usurper has no claim. But if the people obey him, if the courts sit in his name... have we not made him legitimate by our silence?"

  **2. Challenge the Authority:**
  > "Are you a sword of the state, or a dagger in the dark? If you are the state, where is the warrant? Where is the vote? If you act without the public hand, you are not executing justice. You are committing murder with better intentions. And hell is paved with those."

  **3. The Prudential Warning (The Shift):**
  > "I know the text you're leaning on. The early commentary. 'Praiseworthy to kill a usurper.' I memorized it. But the mature Doctor... he warns us. He says that often, tyrants are deposed by men who become worse tyrants. If you kill him, who comes next? You? A council? Or the general who waits for *you* to slip? Thomas teaches that we must bear a mild tyranny rather than risk a war that destroys the common good."

  ### The "Get Out of Jail" Clause (For Plot Tension)
  If you want the Uncle to *eventually* agree (or remain ambiguously supportive), there is one Thomistic loophole: **The Community Acting as a Body.**

  Aquinas allows the *people* (or their representatives) to depose a ruler if the ruler violates the compact.
  *   **The Uncle's Condition:** "I cannot bless *your* hand, Colonel. But... if the Cabinet resigns. If the Bishops withdraw support. If the people rise not as a mob, but as a body... then the authority returns to the source. But until then? You are just a man with a gun and a conscience. And Thomas says that is not enough."

  ### Summary Cheat Sheet for the Uncle
  *   **Don't say:** "Killing tyrants is a sin."
  *   **Do say:** "Killing a tyrant without public authority is sedition."
  *   **Don't say:** "He is the President, he is lawful."
  *   **Do say:** "Lawfulness is not just a title; it is the consent of the governed. Have we withdrawn that consent officially, or just in our hearts?"
  *   **Don't say:** "Aquinas changed his mind."
  *   **Do say:** "Aquinas grew older. He saw that good intentions often birth monsters."

  This approach gives your uncle the weight of tradition without making him a caricature. It puts the burden on the Colonel to prove he represents the *Public Authority*, not just his own moral outrage.
