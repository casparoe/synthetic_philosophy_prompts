      *   *Key Insight to Add:* The distinction between *defining* function and *identifying* function. Also, the specific stakes for Wakefield. Wakefield *needs* SE. If you accept CR, his "Harmful Dysfunction" analysis collapses because "dysfunction" loses its normative bite.

  6.  **Refining the Content (Self-Correction during drafting):**
