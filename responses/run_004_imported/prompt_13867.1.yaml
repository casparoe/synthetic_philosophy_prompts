      *   *Okay, I will recommend Rejecting the MTX protocol.* This allows for a robust defense of PDE against the "redescription" critique. If I approved it, I would have to argue that the trophoblast is "pathological tissue," which is a harder sell under traditional Catholic anthropology (the embryo is a patient, not pathology).
