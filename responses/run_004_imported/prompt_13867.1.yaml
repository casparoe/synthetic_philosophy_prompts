      *   *Refinement:* Actually, there is a nuanced middle ground some ethicists explore (the "ovarian/fallopian pathology" argument), but the consensus among Catholic ethicists (like Tonti-Filippini, May, the NCBC) is that MTX is illicit. To provide a *useful* opinion for a Catholic hospital, I should align with the prevailing interpretation of the ERDs to protect the institution and the patients' spiritual care, while acknowledging the philosophical difficulty.
