      *   *Decision:* To be faithful to the constraint of serving on a *Catholic-sponsored hospital committee* bound by *USCCB ERDs*, the ethically safe and standard position is to **reject** the use of methotrexate for ectopic pregnancy, while potentially suggesting palliative/expectant management or stricter criteria for salpingectomy. However, the prompt asks me to work through the reasoning. The strongest philosophical argument *within* the PDE framework favors salpingectomy over MTX.
