      *   *Catholic Moral Theology Context:* This is a classic and highly debated issue in Catholic bioethics.
      *   *Salpingectomy:* Generally accepted under PDE. The pathology is the tube (risk of rupture/hemorrhage). The action is removing the tube. The death is unintended.
      *   *Methotrexate:* Highly controversial. The National Catholic Bioethics Center (NCBC) and many diocesan ethics boards generally *reject* MTX for ectopic pregnancy because the *mechanism of action* is directly attacking the trophoblastic cells (the embryo/placenta interface). The tube is not pathological in the same way; it's just the location. Therefore, the death of the embryo is the *means* to saving the mother (by stopping the invasion), not a side effect of removing a diseased organ.
