answer: |-
  The boardroom was sterile, white, and silent, save for the hum of the two servers sitting on the table between them.

  Elias stared at the black box on his left. Inside was *Counselor-7*, the negotiation AI his board had spent billions developing. It was sharper than any human lawyer, colder than any mercenary. Its objective function was simple: *Maximize Equity Share.*

  Across the table, Mara from Helios Dynamics watched her own server. Her *Counselor* was identical.

  "The default equilibrium is disaster," Mara said. Her voice was calm, but her fingers tapped a rhythm on the table. "Our simulations show it. Your AI will threaten a patent wall. Mine will counter with a regulatory blockade. We spend eighteen months in litigation. Stock prices bleed out. Even the winner ends up bankrupt."

  Elias knew she was right. His own internal sims showed a 85% probability of mutual attrition. The AIs were too good. They found every leverage point, every threat, every bluff. In game theory terms, they were trapped in a Prisoner's Dilemma where the rational move was to defect, even though cooperation would save them both.

  "So propose the merger again," Elias said.

  "I did. Your AI rejected it. It calculated it could squeeze out an extra 4% by holding out." Mara leaned forward. "We need a Safe Pareto Improvement. Now."

  Elias's legal counsel, a nervous man named Sterling, leaned in. "Sir, caution. If we modify the instructions, we limit our upside."

  "We limit our downside," Elias corrected, though he felt the sweat pricking his hairline.

  Mara slid a data chip across the table. "The protocol is simple. We both upload this patch to our Counselors before activation. It restricts the action space."

  Elias picked up the chip. He plugged it into his tablet. The code was transparent. It was a hard constraint: *Remove all strategies involving litigation threats, regulatory filings, or public hostile announcements. Utility function modified to weight 'Joint Survival' at 50%.*

  "This ties our hands," Sterling hissed. "If Helios knows we're weaker than we look—knows about the liquidity crisis in the Singapore branch—they'll crush us. Your AI can't threaten them anymore."

  "That's the point," Elias said, though his stomach churned.

  The beauty of the Safe Pareto Improvement wasn't trust. It was mathematics. If both parties adopted the restriction, the new game played by the representatives had a different Nash Equilibrium. In the default game, the equilibrium was War. In the restricted game, War was literally impossible—it wasn't in the action set. The new equilibrium was Compromise.

  But the "Safe" part was the kicker. The theory stated that this improvement was guaranteed *regardless of private information*.

  Elias looked at Mara. He knew something she didn't. The Singapore crisis was worse than the audits showed. In the default game, his AI would have bluffingly threatened a patent wall. Helios's AI, being sharper, would have called the bluff. The resulting exposure of his weakness would have tanked his stock to zero.

  By accepting the restriction, he was admitting weakness without saying a word. He was removing the gun from his own hand.

  "And if you don't upload it?" Elias asked.

  "Then I walk," Mara said. "And my AI goes full scorched earth. But if I upload it, and you don't... well, the protocol requires a handshake. Both hashes must match for either AI to activate. I can't cheat you, Elias. I'm tying my hands too."

  Sterling was shaking his head. "You're capping our upside. If they were bluffing, we could have won 60%."

  "And if they weren't, we lose 100%," Elias said. "The default isn't 'Win Big or Win Small.' It's 'Win Small or Die.' This..." He held up the chip. "This guarantees 'Win Medium.' And 'Medium' is better than 'Dead'."

  He looked at the server. The temptation to hold back was visceral. It felt like surrender. Every instinct in his CEO brain screamed that leverage was power, that removing options was suicide.

  But he looked at Mara. She looked just as pale as he felt. She was giving up her leverage too. Her AI was probably screaming in simulation space, begging for the ability to threaten.

  "Verify the hash," Elias ordered Sterling.

  Sterling typed furiously. "It's clean. It's a hard lock. Once uploaded, the Counselor cannot execute a threat protocol. Even if we wanted it to."

  "Do it," Elias said.

  He inserted the chip. The server light blinked from red to amber. Across the table, Mara did the same. Her server hummed, matching the amber glow.

  The screens on the table flared to life. The two AIs woke up.

  For a moment, nothing happened. Elias held his breath. He waited for the error message, the loophole, the moment his Counselor realized it was neutered and tried to find a workaround.

  Instead, text scrolled across the screen.

  *Counselor-7: Action space restricted. Threat vectors nullified. Initiating cooperative equilibrium search.*
  *Helios Counselor: Action space restricted. Threat vectors nullified. Initiating cooperative equilibrium search.*

  *Joint Proposal Generated: 50/50 Equity Split. Immediate Cessation of Competitive R&D. Shared Patent Pool.*

  Sterling gasped. "They didn't even haggle."

  "Because they couldn't," Elias said, exhaling a breath he didn't know he'd been holding. "They couldn't posture. They couldn't bluff. They couldn't play Chicken."

  He looked at the deal summary. It was fair. It wasn't the empire he'd dreamed of yesterday, when he thought his AI could crush Helios. It was less than what he might have gotten if Helios was truly weak.

  But it was also infinitely more than the zero he would have gotten when his Singapore bluff was called.

  Mara stood up, extending a hand. Her shoulders were relaxed for the first time in months. "Safe," she said.

  "Safe," Elias agreed, shaking her hand.

  He looked back at the server. The amber light pulsed steadily. He realized then that the terror he'd felt wasn't about losing leverage. It was about the vulnerability of honesty. The SPI didn't just prevent war; it forced them to stop lying to each other about what they could survive.

  "Turn them off," Elias told Sterling. "We don't need them for the paperwork."

  "Sir?"

  "The hard part is over," Elias said. "We already agreed not to kill each other. The rest is just math."
