      *   *The "Self-Undermining" point:* If I think you are rational, your belief is data. If I ignore that data because "your prior," am I being rational about *your* rationality?
      *   *Priors:* What counts as a prior? "Viruses usually jump species" vs. "Gain of function is dangerous." These look like priors but are actually empirical claims based on past data. True priors are more like logical axioms.
