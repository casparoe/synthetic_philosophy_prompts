prompt: |-
  So I just got roped onto my town's Licensing Appeals Board (a neighbor nominated me before I really understood what the job involved), and my very first case is already a headache. A private, members-only club -- basically an adult swingers venue -- is up for license renewal. It's legal, discreet, no noise or parking complaints, nothing illegal happens inside, and everyone involved is a consenting adult. But a neighborhood group showed up in force at the hearing, something like 40 people, arguing the license should be pulled anyway because the place is "immoral" and "corrosive to the character of the community," with no claim that anyone's actually being harmed. Half the board thinks that's a perfectly legitimate basis for the town to act on -- a community gets to protect its own moral fabric -- and the other half thinks it's not a real reason at all unless somebody can point to concrete harm. Honestly the whole fight feels like its rehashing some legal philosophy debate I half-remember from a jurisprudence class years ago, something that traces back to a British report on sex-related laws from the 50s or 60s, but I don't remember the actual arguments well enough to make either side properly, and the "protect shared morals" side is the one I understand the least. Could you write the memo I'll circulate before we vote next week -- laying out the strongest version of both positions (please don't strawman the second one), and ending with an actual recommendation, plus conditions we could attach if a flat yes/no feels wrong?
