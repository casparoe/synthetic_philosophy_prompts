  3.  **Address the Core Conflict: "Sketch" vs. "Irreducible":**
      *   *Hempel's View:* Narrative is lazy science. If we knew all the psychology/sociology/economics laws, we wouldn't need the story.
      *   *Narrativist View:* Narrative isn't a placeholder for laws; it's the *only* way to make human action intelligible. Human action is temporal and meaningful. Laws strip away the agency and context that constitute the event.
