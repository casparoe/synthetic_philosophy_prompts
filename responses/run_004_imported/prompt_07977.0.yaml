          *   *Goal:* Objective, scientific, predictive (in principle).
          *   *Narrative:* Merely a heuristic or "explanation sketch." It lacks rigor because the laws are implicit.
          *   *Implication for the User:* The friend is channeling Hempel. To explain *why* the monarchy fell, you need to show it fits a pattern (fiscal exhaustion + elite defection = collapse).

      *   **Danto (Narrative Sentences/Analytical Philosophy of History):**
          *   *Core Idea:* History is organized around "narrative sentences." These describe an event in terms of something that happens *later* (e.g., "The Thirty Years' War began in 1618").
          *   *Critique of Hempel:* You can't predict the significance of an event at the time it happens. Explanation involves organizing events into a structure of meaning that requires hindsight.
          *   *Implication:* The granddaughter's perspective (hindsight) is epistemologically crucial, not just a literary device.

      *   **Hayden White (Metahistory/Linguistic Turn):**
          *   *Core Idea:* History is a verbal structure. The "facts" don't dictate the story form. Historians *emplot* events (Tragedy, Comedy, Romance, Satire).
          *   *Critique of Hempel:* There are no neutral laws. The choice of plot structure imposes meaning. Explanation is aesthetic/moral, not just causal.
