answer: |-
  The cooling units hummed, a low-frequency thrum that Elena felt in her teeth more than she heard. It was 3:00 AM in the quantum optics lab at Zurich. The room was bathed in the sterile glow of monitor screens and the occasional blink of a single-photon detector.

  Elena Varkov sat before the console, her coffee long cold. She was running a Bell test, the standard protocol for probing the seams of reality. On one side of the room, a laser pumped a nonlinear crystal, spitting out pairs of entangled photons. They flew apart, one toward Detector A, one toward Detector B.

  The crucial element was the setting. To close the "freedom-of-choice" loophole, the angle of the polarizers at A and B was determined by a random number generator seeded by the arrival time of photons from a distant quasar. Light that had traveled six billion years to reach Earth decided the measurement settings here, now. It was the gold standard for ensuring that the choice of measurement was independent of the particle's creation.

  Elena watched the correlation coefficient climb on the screen. *S = 2.82.*

  It violated the inequality. Again. Just as quantum mechanics predicted. Just as it always did.

  Most physicists saw this and shrugged. They accepted non-locality or abandoned realism. They said, "Spooky action is real," or "Properties don't exist until we look." But Elena couldn't shake the itch. The math was clean, but the implication felt like a scar on the logic of the universe.

  She leaned forward, initiating a secondary script she had written in secret. It wasn't looking for quantum correlations. It was looking for correlations between the *settings* and the *source*.

  Standard theory assumed Measurement Independence: the probability of the hidden variable $\lambda$ (the particle's state) is independent of the measurement setting $a$ and $b$. $P(\lambda | a, b) = P(\lambda)$.

  Elena's script searched for a drift. A microscopic bias. If the universe was superdeterministic, the quasar light choosing the angle and the crystal emitting the photon shared a common cause in the past. Their light cones overlapped at the Big Bang. If the initial conditions of the universe were fixed, then the quasar photon and the lab photon were not independent. They were actors reading from the same script.

  The progress bar crawled. 90%... 95%...

  A graph populated the screen. It was a scatter plot of the quasar-derived settings against the detection efficiency of the pairs. Theoretically, it should be white noise. A cloud of random points.

  It wasn't.

  There was a filamentary structure. Faint, buried under layers of statistical noise, but undeniable to an eye trained to find patterns in chaos. The settings chosen by the "random" quasar light were subtly, statistically biased toward the outcomes the particles would produce.

  Elena stopped breathing.

  It wasn't non-locality. The particles weren't talking to each other across the room. It wasn't non-realism. The particles didn't need to be undefined.

  It was that the choice to measure them had been made before the particles were born. Before the Earth was born.

  She stood up, her chair scraping loudly against the epoxy floor. The sound seemed to bounce off the walls, mocking her. She walked to the window. Zurich was dark, save for the streetlights.

  *Free will,* she thought. *The experimenter's freedom.*

  That was the axiom she had just broken. To save locality, to save realism, she had to sacrifice the idea that she could choose to measure spin up or spin down.

  She looked back at the console. Her hand hovered over the keyboard. She decided, consciously, deliberately, to type the letter 'Z'.

  *Why?* she thought. *Why 'Z'?*

  Because she wanted to test herself. Because she felt a surge of rebellion against the data on the screen.

  But if the data was right, that surge of rebellion was not hers. It was a chemical cascade in her brain, dictated by the arrangement of atoms in her cortex, which was dictated by the food she ate, the air she breathed, the formation of the solar system, the inflation of the universe.

  The neuron that fired to tell her finger to strike the key was entangled with the photon currently dying in Detector A. Not by a signal sent now, but by a knot tied 13.8 billion years ago.

  A wave of nausea hit her. She gripped the edge of the desk. This was the vertigo of the block universe. Time wasn't flowing; it was a landscape, already mapped. She wasn't a traveler; she was a feature of the terrain.

  "No," she whispered.

  She grabbed a physical coin from her pocket. A Swiss franc. Cold metal.

  "I choose," she said to the empty room. "I choose heads."

  She flipped it. It spun in the air, catching the monitor light.

  If superdeterminism was true, the outcome of this flip was correlated with the quasar data from an hour ago. The air currents in the room, the force of her thumb, the micro-fractures in the metal—all of it was part of the same causal web that determined the polarization of the photons.

  The coin landed on the desk. Tails.

  She felt a sudden, crushing exhaustion. If she ran the experiment again, would she find the same correlation? Of course. Because she was finding it *now*. There was no "again." There was only *this*.

  She imagined the history of the universe not as an exploding firework, but as a frozen block of ice. Every event, every thought, every "choice" she had ever made was embedded in the structure. The feeling of decision was just the sensation of moving through the ice, unaware that the path was already carved.

  She thought of her divorce three years ago. The argument in the kitchen. The words she had shouted. She had always believed she could have said something else, that she had the power to change the outcome.

  *Could you?* the data asked.

  Or were those words as inevitable as the orbit of the quasar that powered her randomizer?

  Elena slid back into her chair. The hum of the cooling units seemed louder now, like the ticking of a clock. She looked at the 'Enter' key. She had the power to delete the file. To burn the hard drives. To walk out of the lab and never come back.

  She raised her hand.

  If she deleted the file, it was because the initial conditions of the universe demanded she delete it. If she published it, it was because the Big Bang conspired to reveal its own determinism through her.

  There was no escape. Even the rejection of superdeterminism was determined.

  She looked at her reflection in the dark monitor. A woman with tired eyes, trapped in a skull, trapped in a room, trapped in a timeline.

  "It's not a conspiracy," she murmured, realizing the term physicists used was misleading. A conspiracy implied plotters, intent, a secret kept *from* someone.

  This wasn't a secret kept from her. It was the nature of the stage itself.

  She placed her finger on the 'Enter' key. She felt the resistance of the switch. She knew, with absolute certainty, what she was going to do. Not because she decided, but because the trajectory was set. The correlation held.

  Elena pressed the key.

  The file saved. The data remained.

  She sat back and waited for the sun to rise, knowing that the sunrise, like her decision, was merely the unfolding of a promise made at the beginning of time. She was not the experimenter. She was the experiment.
