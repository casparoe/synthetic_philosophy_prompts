          *   *Counter-arguments:* Realists argue that intended models exist (the "standard model" of arithmetic, the "real" universe of sets $V$). Just because logic can't pin it down doesn't mean reality doesn't. Putnam conflates *epistemic access* (what we can say) with *ontology* (what is).
