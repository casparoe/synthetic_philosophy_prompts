      *   *The Contradiction (Apparent):* Inside $M$, there is a set $S$ that $M$ thinks is uncountable. But $M$ itself is countable, so $S$ (as a subset of the domain of $M$) must be countable from the *outside*.
      *   *The Crux:* Why doesn't $M$ contain the bijection $f: \mathbb{N} \to S$?
      *   *The "Missing Bijection" Explanation:*
          *   A bijection is a *set of ordered pairs*.
          *   For $M$ to "know" $S$ is countable, the bijection set must exist *inside* $M$.
          *   The domain of $M$ is countable (from the outside). So there *exists* a bijection from the outside (in the metatheory).
          *   However, that specific set of pairs is not an element of $M$.
          *   *Analogy:* Think of $M$ as a library. The library has a countable number of books. One book ($S$) claims "There are too many stories to list." From outside, we can list all the pages in that book. But the *list itself* isn't inside the library. The library's rules (axioms) don't force that list to be written down as a book.
          *   *Technical nuance:* The quantifier "there exists a function" in ZFC is restricted to the domain of $M$. If the function isn't in the domain, $M$ doesn't see it.
