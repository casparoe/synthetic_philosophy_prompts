answer: |-
  **Title:** The Separateness of Propositions: Why Berker's Objection Undermines the Strong Accuracy-First Program

  The "accuracy-first" program in contemporary epistemology rests on an ambitious reductionist claim: that the fundamental epistemic good is accuracy, and that all other epistemic norms (coherence, updating, evidence-responsiveness) derive their value from their tendency to promote it. This program draws its primary motivation from Jim Joyce's accuracy-dominance argument, which demonstrates that any credence function violating the probability axioms is strictly dominated by a probabilistic rival that is more accurate in every possible world. However, Selim Berker's 2013 critique, "The Epistemic Invariance of the Separateness of Propositions," challenges not the mathematics of Joyce's proof, but the normative structure built upon it. Berker argues that accuracy-first epistemology commits the same structural error as act-utilitarianism in ethics. While this objection does not invalidate the mathematical utility of scoring rules, it fatally undermines the claim that accuracy maximization can serve as the *sole* foundational norm of epistemology.

  To understand the force of Berker's objection, one must reconstruct the analogy between epistemic utility theory and act-utilitarianism. Act-utilitarianism holds that the right action is that which maximizes aggregate welfare across all persons. John Rawls famously objected that this ignores the "separateness of persons": it treats society as a single super-person, licensing the sacrifice of one individual's rights or welfare if the aggregate gain to others is sufficiently large. Berker contends that accuracy-first epistemology commits an isomorphic error regarding the "separateness of propositions." By defining epistemic rationality as the maximization of total accuracy (usually the sum of accuracy scores across all propositions in a credence function), the theory treats the belief system as a single bucket of value.

  This aggregation licenses counterintuitive epistemic trade-offs. In Berker's framework, an agent could be required to hold a less accurate credence in proposition $P$ if doing so allows for sufficiently large accuracy gains regarding unrelated propositions $Q, R,$ and $S$. For example, an agent might be epistemically required to be less confident in a true proposition than their evidence warrants, simply because that "sacrifice" structurally permits them to be more accurate elsewhere in their belief system. Berker argues this violates a basic pre-theoretical intuition: epistemic norms are local. What you ought to believe about $P$ should depend on the evidence for $P$, not on the utility of believing $Q$. By allowing global accuracy to override local fidelity, accuracy-first epistemology treats propositions as mere vessels for value rather than distinct targets of belief, effectively erasing the boundaries between them just as utilitarianism erases the boundaries between persons.

  Accuracy-firsters have attempted to resist this conclusion, primarily by denying the normative significance of the analogy. The most common response, echoed by your officemate, is that propositions lack interests or rights; therefore, "wronging" a proposition is category mistake. However, a more sophisticated defense appeals to **Epistemic Holism**. Proponents like Richard Pettigrew or Hilary Greaves might argue that a credence function is not a collection of isolated beliefs but a unified map of the world. Just as a map's value lies in its overall representational fidelity rather than the precision of every single coordinate in isolation, a credence function's rationality is a global property. On this view, the "trade-off" is not a sacrifice of one belief for another, but an optimization of the single cognitive state. If the goal is to represent the world accurately, and the mathematical structure of accuracy dictates that local deviations maximize global fit, then the holist argues we should accept this result. The objection relies on the assumption that local norms are primitive, but the accuracy-firster claims global accuracy is the primitive, rendering the "separateness" intuition a bias rather than a constraint.

  While the Holistic Defense is coherent, it ultimately fails to save the strong accuracy-first project because it concedes the core of Berker's point: that accuracy maximization can conflict with local evidential norms. If the accuracy-firster bites the bullet and admits that an agent ought to believe against their local evidence to maximize global accuracy, they have severed the link between rationality and truth-seeking in the very cases where it matters most. Epistemology is traditionally concerned with how agents should respond to evidence regarding specific claims. A theory that mandates local inaccuracy for global gain ceases to be a theory of *epistemic* rationality and becomes a theory of *systemic* optimization. The "map" analogy fails because a map that deliberately distorts specific coordinates to improve its overall "score" is, in a meaningful sense, a defective map. The separateness of propositions matters because belief is an attitude toward specific contents, not a generic accumulation of points.

  Therefore, the verdict on Berker's objection must be decisive: **It sinks the strong accuracy-first program as a foundational project.** Berker successfully demonstrates that accuracy cannot be the *only* fundamental epistemic value. If we accept that trade-offs across separate propositions are epistemically impermissible (as intuition strongly suggests), then accuracy maximization must be constrained by deontological rules that apply proposition-by-proposition. This means accuracy is not "first" in the reductionist sense; it is one value among others, constrained by structural norms regarding how beliefs relate to evidence locally.

  This does not render epistemic utility theory useless. The mathematical framework of scoring rules remains an invaluable tool for measuring verisimilitude and proving coherence theorems (like Joyce's dominance argument). However, Berker shows that these tools cannot bear the entire normative weight of epistemology. The accuracy-first program promised to derive all epistemic norms from the single goal of accuracy maximization. Berker proves that doing so yields unacceptable implications regarding the separateness of propositions. Consequently, epistemology cannot be purely consequentialist about accuracy. It must acknowledge that the structure of belief imposes constraints that accuracy alone cannot justify. The project survives as a partial theory of epistemic value, but it fails as a totalizing foundation.
