      *   **The Accuracy-First Resistance:** I need to choose a strong one. The officemate's "propositions have no interests" is too weak. I'll focus on the **Global Coherentist Defense**. Accuracy-firsters (like Pettigrew or Joyce in later work) might argue that epistemic rationality *is* holistic. A credence function is a single object. You can't evaluate parts in isolation because the "accuracy" of a system isn't just the sum of parts; it's about the *whole* representing the *world*. Alternatively, I can discuss **Constraint-Based EUT** (imposing constraints that prevent trade-offs). Let's go with the argument that **Epistemic Norms are Global by Nature**. The objection assumes local norms are the default, but EUT argues global accuracy is the actual goal.
      *   **The Verdict:** I need to pick a side. Does it sink the project?
          *   *Argument for "Yes":* It undermines the "accuracy-first" claim to be the *sole* foundation. If you need deontological constraints to avoid Berker's problem, accuracy isn't first.
