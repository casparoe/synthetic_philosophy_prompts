      *   *Tone:* Keep it rigorous but essay-like.

  6.  **Final Polish:**
      *   Ensure Berker's specific terminology (epistemic consequentialism, separateness) is used.
      *   Make sure the response isn't just "Berker is right." Acknowledge the strength of EUT before delivering the verdict.
      *   *Verdict Nuance:* The objection shows that *unconstrained* maximization is untenable. Does that kill the project? If the project is "reduce all epistemology to accuracy maximization," yes. If the project is "use accuracy to illuminate norms," no. I will interpret the prompt's "Accuracy-First program" as the strong reductionist claim. Therefore, the verdict is: It sinks the strong reductionist program.

  7.  **Writing the Content:** (Mental Outline)
      *   Intro: Joyce's dominance argument $\rightarrow$ Accuracy-First. Berker's intervention.
      *   Berker's Argument: The Utilitarian Analogy. Aggregation implies trade-offs. Separateness of Propositions. The "Epistemic Sacrifice" case.
