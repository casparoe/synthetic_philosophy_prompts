answer: |-
  Good evening. For those who don't know me, I'm a former student of Naomi's, and now a science journalist. Looking around this room, I realize I'm speaking to two distinct audiences. On one side, we have game theorists who know exactly what a "subgame perfect equilibrium" is. On the other, we have Naomi's husband, her children, and old friends who have heard her talk about "the centipede" at every family gathering since the Reagan administration, usually while carving the turkey, without ever being told what it actually means.

  So, for the family: imagine a game where you and a partner take turns. There is a pot of money. On your turn, you can take the majority of the pot and end the game, or you can pass. If you pass, the pot grows, and it becomes your partner's turn. But if they take it, you get nothing.

  For the theorists: Backward induction suggests that if we assume common knowledge of rationality, the first player should take the pot on move one. Why? Because at the final node, the second player would take. Knowing that, the first player should take at the penultimate node. And so on, unraveling all the way back to the start.

  But in the lab, as Naomi has spent thirty-five years pointing out, hardly anyone does that. People pass. They keep passing. The pot grows.

  For the theorists, Naomi's career has been an argument against the idea that this is just "bounded rationality" or human error. She sided with the Pettit and Sugden objection: that reaching a later round is itself evidence against the initial assumption of common knowledge. If we are still playing, the epistemic conditions have changed. We aren't violating the theory; we are revealing that the theory's starting assumptions don't hold in a world where trust exists.

  And this brings me to why I'm standing here.

  It is tempting to look at Naomi's life—thirty-five years of marriage, a career mentoring hundreds of students—and say, "Look, she played the centipede irrationally. She never cashed out." It is tempting to call her devotion to her family and her students a beautiful violation of game theory.

  But Naomi would object to that on the merits. And she would be right.

  To call her life "irrational" implies she should have stopped at move one. That she should have taken the small, guaranteed sum of a quiet, self-interested life and ended the game. But in doing so, she would have accepted the premise that the only rational move is the selfish one.

  Naomi's work teaches us that when players keep passing, they aren't making mistakes. They are building a new context. By staying in the game round after round, year after year, you create a new common knowledge. You establish that the person across from you is not a utility-maximizing robot, but a partner.

  Her marriage didn't survive because they ignored the risks of the game. It survived because thirty years of passing the trust back and forth made the "take" move unthinkable. The payoff structure changed because *they* changed.

  The same is true for her career. A PhD advisor can "cash out" early. Publish the minimum, advise the few, protect the reputation. Naomi passed. She passed the opportunity to the next student, and the next. She kept the pot growing. She invested in people who hadn't proven themselves yet, betting that the game would continue long enough for them to flourish.

  So, I am not going to toast her for being "irrational." I am going to toast her for understanding that the only way to win a long game is to change the rules of what counts as rational play.

  She proved that if you treat "common knowledge of rationality" not as a fixed constraint but as something built through interaction, the pot doesn't just grow financially. It grows in wisdom, in legacy, and in love.

  Naomi, you didn't just study the centipede game. You lived the refutation of its pessimism. You showed us that the optimal strategy isn't to end the game on move one. It's to keep passing, until the pot is large enough for everyone.

  To Naomi.
