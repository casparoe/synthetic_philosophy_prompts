answer: |-
  You are right, and your friend is falling into a very common trap in formal epistemology.

  What you are describing is not incoherent; it is actually a textbook demonstration of how probability theory works when dealing with **conjunctions of uncertain events**. However, your friend is likely stumbling over a famous philosophical problem called the **Lottery Paradox**, which confuses *probabilistic credence* with *binary belief*.

  Here is the breakdown of why your intuition is mathematically sound, where your friend is coming from, and the one specific trap you actually need to watch out for.

  ### 1. The Math: The Conjunction Rule
  In Bayesian probability, coherence simply means obeying the axioms of probability. One of the most basic rules is how you handle "AND" (conjunctions).

  If you have two independent events, $A$ and $B$, the probability of both happening is:
  $$P(A \text{ and } B) = P(A) \times P(B)$$

  If you have 50 predictions, and you assign each a 90% ($0.9$) probability of being true, and we assume for a moment they are independent, the probability that **every single one** comes true is:
  $$0.9^{50} \approx 0.005$$

  That is a 0.5% chance. Conversely, there is a **99.5% chance that at least one prediction will be false.**

  So, mathematically, there is zero contradiction between:
  1.  "I am 90% confident in Prediction A."
  2.  "I am 90% confident in Prediction B..."
  3.  "I am 99.5% confident that not all of them will be true."

  Your friend claims this is incoherent, but it is actually the *only* coherent position. If you were 90% confident in each individual prediction but also 90% confident that *all* of them would come true, **that** would be incoherent.

  ### 2. The Philosophy: The Lottery Paradox
  Your friend is likely channeling Henry Kyburg's **Lottery Paradox (1961)**.

  Imagine a fair lottery with 1,000 tickets. It is rational to believe of any single ticket (Ticket #1) that it will lose (99.9% confidence). By extension, it seems rational to believe Ticket #2 will lose, Ticket #3 will lose, etc. But if you believe "Ticket #1 will lose AND Ticket #2 will lose...", you eventually conclude "All tickets will lose," which contradicts the known fact that one ticket must win.

  **The Resolution:**
  Formal epistemologists generally resolve this by distinguishing between **high credence** (e.g., 90% probability) and **binary belief** (accepting something as "True" for the sake of argument).
  *   **Your Friend's View:** They are likely assuming the **Lockean Thesis**, which suggests that if your confidence passes a certain threshold (say, 90%), you should treat it as a binary "Belief." If you "Believe" A and "Believe" B, logic dictates you must "Believe" (A and B). This leads to the contradiction.
  *   **The Bayesian View:** You never convert probabilities to binary beliefs. You keep them as probabilities. Probabilities do not aggregate linearly; they compound. Therefore, you can have high credence in the parts and low credence in the whole without contradiction.

  You are operating as a good Bayesian. Your friend is operating as a classical logician trying to force probabilities into True/False buckets.

  ### 3. The Real Trap: Calibration and "90%+"
  While your *logic* is sound, there is a practical trap here that your friend might be clumsily trying to warn you about. It lies in the specific numbers.

  You said you are "90%+ confident."
  *   If you mean **90%**: As calculated above, the chance of a perfect score is 0.5%. Your meta-belief (that you will make mistakes) is perfectly calibrated.
  *   If you mean **95%**: $0.95^{50} \approx 7.7\%$. You still have a 92% chance of at least one error. Still coherent.
  *   If you mean **99%**: $0.99^{50} \approx 60\%$. Here, there is a 60% chance you get them all right. If you are "close to 100% confident that at least a couple will be false," **then you are incoherent.**

  **The Calibration Check:**
  The "Scott Alexander" prediction game is ultimately about **calibration**.
  *   If you write down 50 predictions at 90% confidence, you should expect roughly 5 failures (10%).
  *   If you write down 50 predictions at 99% confidence, you should expect roughly 0.5 failures (which means you should expect to get them all right most years).

  If you are genuinely 99% confident in 50 distinct things, but you also believe you will definitely fail some, **you are overconfident in your individual probabilities.** You are assigning 99% to things that are actually more like 95% likely.

  So, your friend might be sensing **overconfidence bias** rather than logical incoherence. It is very common for humans to say "99%" when they really mean "95%." If you adjust your individual credences down to reflect your true uncertainty, the math resolves itself.

  ### 4. A Note on Independence
  The math above assumes your predictions are independent (e.g., "It will rain on Tuesday" vs. "The price of eggs will rise").
  If your predictions are highly correlated (e.g., "The Democrats will win the House" and "The Democrats will win the Senate"), the probability of them all being true is higher than the independent calculation.

  However, unless the correlation is perfect (1.0), the probability of the conjunction will *always* be lower than the probability of the individual components. So the structure of your argument holds: $P(\text{All}) < P(\text{Individual})$.

  ### The Verdict
  **You are right.**
  *   **Logical Coherence:** It is perfectly coherent to have high credence in individual propositions and low credence in their conjunction. This is basic probability theory.
  *   **Epistemic Virtue:** Your meta-belief (that you will likely get some wrong) is a sign of *good* calibration. It shows you understand that uncertainty compounds.
  *   **The Friend's Error:** They are conflating "high probability" with "certainty" or binary belief. They are applying deductive logic rules to inductive probabilities.

  **The Advice:**
  Keep doing the predictions. But use your meta-belief to audit your individual confidence levels.
  1.  Count how many predictions you have.
  2.  Look at the confidence levels.
  3.  Calculate the expected number of failures ($\sum (1 - p_i)$).
  4.  If your expected failures is 0.5, but you "know" you'll miss a few, **lower your individual confidence percentages** until the math matches your intuition.

  That isn't rationality breaking down; that's rationality working exactly as intended.
