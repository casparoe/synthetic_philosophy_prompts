answer: |-
  It is a distinct pleasure to engage with a colleague who approaches the limits of language with the same rigor one might apply to the limits of a physical theory. Your amusement is well-founded; there is a certain irony in a career spent measuring the measurable ending in a study of a philosopher who famously demarcated the measurable from the meaningful.

  To answer your central question directly: **I argue that there is a substantial, structural change between the two periods, not merely a shift in tone.** While both the *Tractatus* and the *Lectures on Religious Belief* share a fierce anti-evidentialism (rejecting Father O'Hara's approach), they arrive there via incompatible mechanisms. The *Tractatus* silences religious discourse because it lacks logical form; the later Wittgenstein validates it because it possesses a distinct grammatical form.

  Consequently, the claim that the believer and non-believer do not contradict one another is **not** a natural extension of the *Tractatus*. It is a innovation licensed only by the later concepts of "language-games" and "forms of life." In the *Tractatus*, there is no contradiction because one side is speaking nonsense. In the *Lectures*, there is no contradiction because the two sides are playing different games. This distinction is vital.

  Here is the justification for this reading, broken down by the philosophical mechanics at play.

  ### 1. The *Tractatus*: The Logic of Silence
  In the *Tractatus*, Wittgenstein's picture theory of language dictates that a proposition is meaningful only if it pictures a possible state of affairs in the world. Ethical and religious propositions attempt to speak about value or the "higher," which are not facts *in* the world but conditions *of* the world.

  *   **Status of Religious Language:** Strictly speaking, it is *unsinnig* (nonsense). It tries to say what can only be *shown*.
  *   **The Attitude:** This is not a dismissal of religion's importance; indeed, Wittgenstein valued it highly. But its importance lies precisely in its inability to be stated. To treat it as a set of claims is to degrade it.
  *   **The Contradiction Problem:** If a believer says "God exists" and a skeptic says "God does not exist," the *Tractatus* analysis is that **neither has uttered a proposition.** Since neither sentence pictures a state of affairs, there is no logical content to contradict. They are like two people arguing over whether "Goodness is green." There is no contradiction, only shared confusion.

  The *Tractatus* offers a **normative** boundary: "You *cannot* speak here." It is a logical prohibition.

  ### 2. The Later Lectures: The Grammar of Practice
  By the time of the 1938 lectures, Wittgenstein has abandoned the idea that language has a single essence (picturing). Instead, meaning is use. We look at how words function within specific "language-games" embedded in "forms of life."

  *   **Status of Religious Language:** It is meaningful, but its meaning is determined by its role in the life of the believer, not by its correspondence to empirical facts. When a believer speaks of the Last Judgement, they are not offering a weak hypothesis about a future event; they are expressing a regulatory principle for their entire life.
  *   **The Attitude:** This is **descriptive** and almost anthropological. Wittgenstein is not telling religious people they must be silent; he is telling philosophers they must stop analyzing religious claims as if they were scientific claims.
  *   **The Contradiction Problem:** Here, the believer and the non-believer *are* uttering meaningful sentences, but they belong to different language-games with different rules of evidence and verification. If the believer says "I believe in a Last Judgement" and the skeptic says "There will be no Last Judgement," they are not contradicting each other in the logical sense (A vs. not-A) because the *grammar* of "belief" and "Judgement" differs between their respective forms of life. They are, as Wittgenstein suggests, talking past one another, like two trains on parallel tracks.

  ### 3. Why This Is a Substantial Change
  The continuity you suspect lies in the shared rejection of **evidentialism**. Both early and late Wittgenstein agree that you cannot prove religion via physics or history. However, the *reason* for this agreement changes fundamentally.

  *   **In the *Tractatus*:** You cannot prove religion via evidence because religious statements are not about the world. They are transcendental. Evidence is irrelevant because the territory is off-limits to language.
  *   **In the *Lectures*:** You cannot prove religion via evidence because evidence is not the *point* of the language-game. Evidence is irrelevant because the practice operates on a different axis (trust, fear, salvation, regulation) than the scientific game (prediction, control, verification).

  This is the crux of the shift: **The *Tractatus* denies religious language cognitive status; the Later Wittgenstein grants it a distinct cognitive status.**

  In the *Tractatus*, religious language is a failed attempt to state facts. In the *Lectures*, it is a successful attempt to participate in a form of life. The later view allows for a positive description of religious discourse ("Look at what they *do* with these words") that the *Tractatus* strictly forbade ("Do not speak of this").

  ### 4. The "No Contradiction" Claim: Extension or Innovation?
  You asked specifically whether the "no genuine contradiction" idea is a natural extension of the earlier silence. I contend it goes well beyond anything the *Tractatus* could license.

  In the *Tractatus*, the lack of contradiction is a result of **logical vacuity**. There is no contradiction because there is no sense. It is a void.

  In the *Lectures*, the lack of contradiction is a result of **grammatical incommensurability**. There is sense on both sides, but the rules of inference differ. Wittgenstein uses the example of the believer and the non-believer looking at the same garden. One sees the hand of God; the other sees chance. They agree on all the facts (the empirical data), but they do not contradict because their disagreement is not about the facts, but about the *interpretation* of the facts within a form of life.

  The *Tractatus* could not accommodate this nuance. For the early Wittgenstein, if it's not a picture of a fact, it's silence. He lacked the vocabulary of "language-games" to explain how two people could meaningfully disagree without one being empirically wrong. The later vocabulary allows him to say: "They are not contradicting; they are diverging." This requires a positive theory of meaning (meaning as use) that the *Tractatus* explicitly rejected.

  ### Conclusion
  Your reading group is grappling with one of the most fertile tensions in 20th-century philosophy. While the *spirit* of the two periods is similar—a defense of religion against the encroachment of scientism—the *mechanism* is inverted.

  The *Tractatus* protects religion by placing it **outside** language (in the mystical).
  The *Lectures* protect religion by placing it **inside** language, but in a separate room (a distinct language-game).

  As a physicist, you might appreciate this analogy: The *Tractatus* is like saying, "Quantum mechanics cannot describe gravity; therefore, we must remain silent about gravity in the context of quantum equations." The Later Wittgenstein is like saying, "Quantum mechanics and General Relativity are different frameworks with different variables; applying the variables of one to the other is a category mistake, but both frameworks are valid within their own domains."

  The latter view allows you to talk about the "gravity" of religion without demanding it behave like "quantum" evidence. That is a substantial theoretical advance, not just a change of heart. Therefore, the "no contradiction" thesis is a fruit of the later philosophy, impossible to grow in the austere soil of the *Tractatus*.
