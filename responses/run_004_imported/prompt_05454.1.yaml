      *   Justify the reading? Yes.

      *(Self-Correction during drafting)*: I need to be careful with the word "nonsense." In the *Tractatus*, it's pejorative in a logical sense but valorized ethically. In the *Investigations*, "nonsense" is just language idling. I must make sure the distinction between "transcendental nonsense" and "grammatical misunderstanding" is clear.

      *Decision:* I will argue for the **Discontinuity Thesis**. The later Wittgenstein gives religion a *home* (a language-game) that the *Tractatus* explicitly evicted it from. The "no contradiction" point is the smoking gun: in the *Tractatus*, there's no proposition to contradict; in the Lectures, there are propositions, but they belong to different systems. That is a structural change, not just a tonal one.

