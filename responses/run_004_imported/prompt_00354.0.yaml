      *   **Evidential Cooperation in Large Worlds (ECL):**
          *   *Origin:* Associated with Oskar Li, Caspar Oesterheld, Vincent Conitzer, and the concept of "Evidential Decision Theory" (EDT) or "Functional Decision Theory" (FDT) applied to cosmology.
