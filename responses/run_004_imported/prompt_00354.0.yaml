answer: |-
  This is a nuanced distinction that even within the effective altruism (EA) and longtermist communities often gets blurred. Your sources are correct to insist on the separation: while both concepts aim to expand the sphere of cooperation, they rely on fundamentally different engines to generate value.

  To put it bluntly: **Moral Trade is about comparative advantage; ECL is about logical correlation.**

  Here is a breakdown of the distinctions tailored for your reporting, addressing your three specific points and concluding with side-by-side examples.

  ### 1. Causality and the Structure of the Universe

  **Moral Trade (Causal/Institutional):**
  Ordinary moral trade is causally mediated. It functions like standard economic trade but with moral goods. For me to trade with you, there must be a causal channel through which we negotiate, agree, and enforce (socially or contractually) the deal.
  *   **Role of the Universe:** The size or topology of the physical universe is irrelevant. Moral trade works in a single room with two people. It relies on *proximity* and *communication*, not cosmology.
  *   **Mechanism:** I do something that is cheap for me but valuable to you; you do something that is cheap for you but valuable to me. Value is created because our *marginal utilities* differ.

  **ECL (Acausal/Logical):**
  Evidential Cooperation in Large Worlds is explicitly acausal. It posits that you can cooperate with agents you can never communicate with and who cannot causally influence you.
  *   **Role of the Universe:** The "Large World" assumption is the engine. ECL requires a universe that is spatially infinite or sufficiently vast that exact (or near-exact) duplicates of your decision-making process exist elsewhere.
  *   **Mechanism:** My decision *here* does not *cause* the agent in the Andromeda galaxy to cooperate. However, because we run the same "decision algorithm," my decision provides *evidence* of what they decide. If I cooperate, it is evidentially likely they cooperate. In a large world, the sum of all those correlated actions creates a massive payoff that outweighs my local cost.

  ### 2. Decision-Theoretic and Epistemic Commitments

  **Moral Trade:**
  *   **Decision Theory:** Compatible with standard Causal Decision Theory (CDT). I choose to trade because I expect your causal response (enforced by reputation or contract) to benefit me.
  *   **Epistemic Needs:** I need to know your preferences differ from mine. I need to trust that you will uphold your end of the bargain (via institutions, reputation, or pre-commitment).
  *   **Key Assumption:** Preference Divergence. (I value X > Y; you value Y > X).

  **ECL:**
  *   **Decision Theory:** Requires Evidential Decision Theory (EDT) or Functional Decision Theory (FDT). Under CDT, my action cannot influence a spacelike-separated agent, so cooperation is irrational. Under EDT/FDT, my action is *logically correlated* with theirs. I reason: "If I output 'Cooperate', agents running this same algorithm likely output 'Cooperate'."
  *   **Epistemic Needs:** I need to believe the universe is large enough to contain correlated agents. I need to believe that my decision process is isomorphic to theirs (superrationality).
  *   **Key Assumption:** Logical Correlation. (We reason alike, therefore our actions will match, even without communication).

  ### 3. Are They the Same Phenomenon?

  They should not be collapsed. They are solving different problems using different leverage.

  *   **Moral Trade** solves the problem of **inefficient resource allocation** among agents with different values. It turns a zero-sum competition for resources into a positive-sum swap.
  *   **ECL** solves the problem of the **Prisoner's Dilemma** among agents who cannot communicate. It turns a situation where defection is dominant (in CDT) into one where cooperation is rational (in EDT/FDT).

  **Can they overlap?** Yes. You can have "Acausal Moral Trade," where agents with different values cooperate across the cosmos via ECL mechanisms. However, "Ordinary Moral Trade" (as your sources are using it) is a causal, local phenomenon based on preference divergence. ECL is an acausal, cosmological phenomenon based on decision correlation.

  Think of it this way: Moral Trade is a **handshake**; ECL is looking in a **mirror**. In a handshake, two different people connect. In a mirror, you coordinate with a reflection of yourself that you cannot touch.

  ### Worked Examples for Your Article

  To illustrate this to readers, place these two scenarios side-by-side.

  #### Scenario A: Ordinary Moral Trade (The Charity Swap)
  *   **The Agents:** Alice and Bob are both effective altruists living in London.
  *   **The Values:** Alice cares 90% about animal welfare and 10% about global health. Bob cares 90% about global health and 10% about animal welfare.
  *   **The Deal:** They agree that Alice will donate \$1,000 to a global health charity (which Bob values highly) and Bob will donate \$1,000 to an animal charity (which Alice values highly).
  *   **Why it Works:** Because of diminishing marginal returns, Bob's \$1,000 does more good for animals than Alice's does, and vice versa for health.
  *   **The Mechanism:** Causal. They meet, agree, and rely on social norms to ensure neither defects. If the universe were empty except for them, this would still work.
  *   **The Limit:** It stops where communication and enforcement stop. Alice cannot morally trade with a being in a distant galaxy she can never contact.

  #### Scenario B: Evidential Cooperation in Large Worlds (The Cosmic Clone)
  *   **The Agents:** Alice is on Earth. "Ali-Alice" is a physically distinct but cognitively identical agent in a distant galaxy. They can never communicate; light from one will never reach the other.
  *   **The Values:** Both care 100% about "The Good" (identical values).
  *   **The Deal:** Both face a choice: Spend resources to help the other's galaxy (Cooperate) or keep resources for their own galaxy (Defect).
  *   **The Logic:** Under standard decision theory, Alice should Defect; her action cannot causally help Ali-Alice's galaxy. But under ECL, Alice reasons: "I am running a specific decision algorithm. Ali-Alice is running the same algorithm. If I choose Cooperate, that is strong evidence Ali-Alice chooses Cooperate."
  *   **Why it Works:** In a "Large World," there are not just one, but billions of such correlated agents. By choosing Cooperate, Alice "unlocks" cooperative behavior across the cosmos. The aggregate good of billions of galaxies cooperating outweighs the local cost of her contribution.
  *   **The Mechanism:** Acausal/Logical. It relies on the structure of the universe (infinite/large) and the nature of reasoning (superrationality).
  *   **The Limit:** It fails if the universe is small (no clones) or if the agent believes their decision is unique (no logical correlation).

  ### Summary for your Piece

  If you need a single paragraph to anchor this section, consider something like this:

  > "While both moral trade and ECL seek to expand the circle of cooperation, they rely on different sources of leverage. Moral trade exploits *preference divergence*: I help what you love because you help what I love, mediated by causal agreements and trust. ECL exploits *logical correlation*: I help you because my decision serves as evidence that agents like me across the cosmos will do the same. Moral trade requires a handshake; ECL requires a mirror. The former works in a room of two people; the latter only works if the universe is vast enough to be filled with reflections."

  This distinction clarifies why your sources treat them separately: one is an extension of economics (trade), the other is an extension of decision theory into cosmology (ECL).
