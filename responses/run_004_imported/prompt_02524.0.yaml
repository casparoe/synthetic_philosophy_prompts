answer: |-
  **Philadelphia, 1771. Evening.**

  **The study is warm, lit by a single oil lamp. BENJAMIN FRANKLIN sits behind a desk cluttered with papers and a small, leather-bound booklet. Across from him sits JOSEPH, a Quaker merchant in a plain grey coat. A pot of tea sits untouched between them.**

  **JOSEPH**
  You still keep it, then. The little book.

  **FRANKLIN**
  (Tapping the leather cover)
  Faithfully. Though I confess, the ink is lighter in the later years. One's eyes fail before one's habits do.

  **JOSEPH**
  And the list? Is it still twelve?

  **FRANKLIN**
  (Smiles, a quick, knowing twitch)
  Thirteen. You know very well it is thirteen. I added the last at your behest, though you refused to let me put your name in the margin as the author of the amendment.

  **JOSEPH**
  The credit was never the point, Ben. The correction was. You were… difficult to be around. Brilliant, but sharp. Like a new coin that cuts the thumb.

  **FRANKLIN**
  And so I added *Humility*. "Imitate Jesus and Socrates." A modest proposal.

  **JOSEPH**
  You make light of it. But I've read what you wrote about it. You admit you never truly conquered it. You say you only mastered the *appearance*. You trained yourself to say "it appears to me" instead of "certainly." You trained your tongue, but did you train your spirit? Or did you just teach an arrogant man to speak like a humble one?

  **FRANKLIN**
  Is there a functional difference?

  **JOSEPH**
  (Leans forward)
  To the listener, perhaps not. To the Almighty, and to the man himself, the difference is everything. If I suppress a lie but cherish the deceit in my heart, I am not truthful. I am merely a silent liar. If you suppress a boast but cherish the pride, you are not humble. You are a actor playing a saint.

  **FRANKLIN**
  Joseph, consider the utility. If I am less offensive in conversation, if I am more open to correction, if I spare another man's feelings because I have checked my impulse to dominate him… does the world not benefit? Even if, in the privacy of my own skull, I am congratulating myself on how well I am hiding my pride?

  **JOSEPH**
  The world benefits, yes. But *you* do not. You are building a monument to yourself out of the bricks of self-denial. You say you check off these boxes—Temperance, Industry, Silence—and you mark a black dot when you fail. You treat virtue like a ledger. Debits and credits. But the soul is not a merchant's account. You cannot bookkeep your way into grace.

  **FRANKLIN**
  Why not? We are creatures of habit. Nature is not easily bent, but it can be coaxed. If I act the part long enough, does the part not eventually wear on the actor? I am trying to bend the wood. If it springs back, I bend it again.

  **JOSEPH**
  You are bending the branch, but the root remains twisted. Take this Humility. You wrote it down: "I cannot boast of much progress in the reality." You are proud of your progress in humility. Do you not see the snake eating its own tail? You are starving the pride only to feed it a richer diet. Now you are proud of your own modesty.

  **FRANKLIN**
  (Pauses, looks into his tea)
  I see it. I wrote that down too. "Even if I could suppose I had thoroughly overcome it, I should probably be proud of my humility."

  **JOSEPH**
  Then why continue the charade?

  **FRANKLIN**
  Because the charade is better than the alternative! Look, Joseph. There was a man who wanted to buy an axe. The smith agreed to polish it bright, but the man liked the grinding. He turned the wheel, the smith pressed the steel, it was heavy work. Halfway through, the man decided he liked the speckled look. He kept the axe as it was.

  **JOSEPH**
  I know the story. You use it to excuse your imperfections.

  **FRANKLIN**
  I use it to excuse *humanity's* imperfections. Most men decide the speckled axe is good enough. I am at least trying to grind the steel. If I stop at the appearance of virtue, I am still better than the man who doesn't even attempt the grinding. A speckled axe can still chop wood. A man who *acts* humble keeps the peace, even if his heart is noisy.

  **JOSEPH**
  But a speckled axe is honest steel. What you are describing is plating. It is silver over iron. And in time, Ben, the plating wears. When you are tired, or frightened, or dying… the iron will show. What then? Will you face your end with a list of checked boxes, or a clean conscience?

  **FRANKLIN**
  (Leans back, steepling his fingers)
  You ask if one can become virtuous by mimicking it. I say yes. You say no. But tell me, Joseph: If I give money to the poor, is it less charity because I enjoyed the thankfulness of the recipient? If I hold my tongue in anger, is it less peaceable because I was seething inside?

  **JOSEPH**
  It is less *you*. You are separating the deed from the doer.

  **FRANKLIN**
  I am separating the *public good* from the *private salvation*. I am a printer. I deal in impressions. If I make an impression of virtue upon the world, the world is improved. My own soul… (He shrugs) …that is between me and my Maker. I suspect He knows the ink is smudged.

  **JOSEPH**
  He knows. But do *you*? That is my fear. This system of yours, these thirteen weeks, cycling round and round like a millstone. It makes you the judge of your own crime. You mark the black dot. You forgive yourself. You move to the next week. It is too clean. It removes the struggle. Real virtue is messy. It is not a grid. It is a wrestling match in the dark.

  **FRANKLIN**
  (Softly)
  Perhaps. But I am an old man, Joseph. I have seen men who believe they are wrestling in the dark, yet they are only punching the air. They feel righteous, but they are cruel. They feel humble, but they are haughty. At least my grid tells me when I have slipped. It forces me to look at the black dot.

  **JOSEPH**
  Does it? Or does it just tell you where to wipe the ink? You say you never conquered Humility. Yet you list it. You claim it. It is the thirteenth jewel in your crown. Is that not the ultimate arrogance? To catalog your own holiness?

  **FRANKLIN**
  (A long silence. He runs a thumb over the edge of the booklet.)
  Maybe. It is possible that the very act of measuring oneself is a form of vanity.

  **JOSEPH**
  Then why keep the book?

  **FRANKLIN**
  Because without it, I would be worse. I know this. I would be louder. I would be lazier. I would be more certain of my own rightness. If this little book makes me a hypocrite, Joseph, it makes me a *useful* hypocrite. And if, in the grinding, some of the steel actually shines through… if some small part of the humility actually takes root… then the deception has served the truth.

  **JOSEPH**
  (Quietly)
  God grant it does. But beware, my friend. The devil is often found in the margins of a well-kept ledger.

  **FRANKLIN**
  (Opens the book to a fresh page, dips a pen)
  Then I shall try to keep the margins clean. Will you take some tea?

  **JOSEPH**
  (A small smile breaks through)
  I will. But pour it yourself. I wouldn't want to interrupt your industry.

  **FRANKLIN**
  (Chuckles, pouring)
  Silence is virtue number two, Joseph. You are testing me.

  **JOSEPH**
  Someone must.

  **FRANKLIN**
  Indeed. And for that, I am grateful. Even if I cannot say so without sounding proud of my gratitude.

  **JOSEPH**
  "I imagine" you are.

  **FRANKLIN**
  (Raises his cup)
  It appears so.
