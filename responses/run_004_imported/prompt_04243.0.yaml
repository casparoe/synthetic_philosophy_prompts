answer: |-
  You are reading the text correctly, and your suspicion is well-founded. The passage from *Summa Theologiae* II-II, Q. 64, Art. 7 is indeed the ur-text for the Doctrine of Double Effect (DDE), but the way it is deployed in modern analytic ethics (and specifically in rationalist forums) involves a significant amount of extrapolation that Aquinas does not explicitly make in this article.

  Here is a breakdown of your two questions regarding your interpretation and the generalizability of the doctrine.

  ### 1. Are you reading the distinction correctly?

  **Yes.** You have identified a crucial distinction that is often elided in introductory ethics summaries.

  Aquinas explicitly distinguishes between the **private individual** and the **public authority** regarding the *intention* of killing:

  *   **Private Individual:** May perform an act of self-defense where death is a foreseen but unintended side effect (*praeter intentionem*). They are bound by the natural inclination to preserve their own being. However, they **may not intend** the death of the aggressor. If they intend the death, the act becomes unlawful because a private person does not have authority over another's life.
  *   **Public Authority (Soldier/Judge):** **May intend** to kill, but only when that intention is referred to the **common good**. Because they act as agents of the state (which has the authority to punish or wage war for the safety of the community), the intentional killing is subsumed under the pursuit of justice or public safety.

  Aquinas writes: *"it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority."*

  This creates a hierarchy of intention. For the private citizen, the death of the aggressor must remain accidental to the moral species of the act. For the public agent, the death can be intended, provided it is not motivated by "private animosity" (revenge) but by the "common good."

  ### 2. Does this support the general-purpose DDE or a narrow claim?

  This passage supports the **mechanism** of the DDE but not the **general-purpose application** often attributed to it today. There are three major gaps between Aquinas's text here and the modern "four-condition" schema used in Trolley Problem discussions.

  #### A. The "Means" Condition is Absent
  The modern Mangan formulation (and the standard analytic DDE) includes the condition that *the bad effect must not be the means to the good effect.*
  Aquinas does not state this in Article 7. He says, *"Nothing hinders one act from having two effects."* He focuses entirely on **intention** vs. **foresight** and **proportionality** (moderation of violence).
  The "means" condition was developed later by commentators (such as Cardinal Cajetan in the 16th century) to handle cases where the bad effect seems inextricably linked to the good effect. In the Trolley Problem, the distinction between "switching the track" (DDE permissible) and "pushing the fat man" (DDE impermissible) relies heavily on the "means" condition. Aquinas's text here does not provide the theoretical machinery to distinguish those two cases; it only distinguishes between intending a result and foreseeing it.

  #### B. The Scope of Authority
  As you noted, Aquinas ties the permissibility of *intending death* specifically to public authority and the common good.
  *   **Modern DDE:** Often applied to medical ethics (e.g., hysterectomy on a pregnant woman with cancer) or strategic bombing. In these cases, private doctors or pilots are making decisions that intend or foresee death.
  *   **Aquinas:** Would likely analyze the medical case differently (perhaps under the principle of totality or direct vs. indirect sterilization/killing, which are later developments). He does not explicitly grant private individuals the license to intend death even for a "proportionate good" outside of the specific context of immediate self-preservation where the death is unintended.

  The modern DDE assumes a kind of moral equality among agents regarding the structure of intention. Aquinas assumes a **political theology** where the moral license to intend death is distributed hierarchically.

  #### C. Teleology vs. Deontology
  Rationalist discussions often treat DDE as a deontological constraint checker (a set of rules to see if an action is permissible).
  For Aquinas, this is **Natural Law teleology**.
  *   The act is lawful because it aligns with the natural inclination to preserve being ("it is natural to everything to keep itself in 'being'").
  *   The act is unlawful if it violates the order of justice (private persons usurping the authority of God/State over life and death).

  When rationalists apply DDE to the Trolley Problem, they are usually asking, "Does this logical framework allow me to pull the lever?" Aquinas is asking, "Does this act align with the ontological order of creation and justice?"

  ### Conclusion

  You are correct that the rationalist packaging is a "tidy modern packaging" of a much more specific scholastic argument.

  1.  **Your reading is accurate:** Aquinas restricts the *intention* to kill to public authorities acting for the common good. Private self-defense is justified only when the death is unintended.
  2.  **Generalizability:** This passage provides the **metaphysical foundation** for the DDE (the distinction between intended and foreseen effects), but it does not contain the **full doctrinal formulation** used today. The general-purpose DDE is a later synthesis by Catholic moral theologians (the Salamanca school and later manualists) who took Aquinas's principle of *praeter intentionem* and applied it to new casuistry (abortion, war, medical ethics) that Aquinas did not address in this specific article.

  Consequently, using this text to justify the standard four-condition DDE in a secular, universalist context (like the Trolley Problem) requires stripping it of its essential context: the distinction between private and public authority, and the Natural Law framework that defines what counts as "proportionate." Without that context, the "proportionality" condition becomes subjective, whereas for Aquinas, it was objective based on the limits of "blameless defense."

  So, the passage supports the **logic** of double effect, but not the **universal license** often implied by its modern invocation. It is a specific ruling on self-defense that was later canonized into a general principle, losing some of its specific political and theological constraints in the process.
