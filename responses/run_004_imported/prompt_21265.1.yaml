      *   *Key phrase:* "Justice without force is powerless" isn't a definition; it's a tragedy.

  9.  **Final Polish:** Check for clarity and flow. Ensure the distinction between *de facto* power and *de jure* authority is clear in Pascal's terms. (Proceed to generate response).

  *(Self-Correction Note)*: Wait, I need to be careful about the "natural justice" claim. Does Pascal believe in accessible natural law? Generally, Jansenists are skeptical of natural law in the Thomistic sense because reason is corrupted. So "true justice" is known only through Scripture/Grace, not unaided reason. I should nuance that. It's not that natural justice exists *for us* politically, but that it exists *in God*.

