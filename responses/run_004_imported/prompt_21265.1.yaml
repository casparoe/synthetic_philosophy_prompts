      *   Use specific Pascal terminology (*orders*, *fallen nature*, *divertissement* maybe, *raison des effets*).

  6.  **Addressing the Specific Question:**
      *   "Limited claim about justice-as-it-functions-politically... or natural justice really does bottom out at convention?"
      *   Answer: It's the former. Natural justice exists (in God), but human access to it is obliterated by sin. Convention fills the void. Grace doesn't "rescue justice" in the political sphere directly (City of God vs. City of Man), but it allows the individual to see the distinction.

  7.  **Final Review against constraints:**
