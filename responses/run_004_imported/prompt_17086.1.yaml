answer: |-
  This is a fascinating and pedagogically rich angle for a seminar on the demarcation problem. Henry Sidgwick's involvement with the Society for Psychical Research (SPR) is indeed one of the most compelling historical episodes for examining how intelligent, methodologically scrupulous agents navigate the boundaries of legitimate science.

  However, to ensure your lecture withstands scrutiny from both historians of science and philosophers, I must offer a crucial nuance regarding your premise. While Sidgwick's *intentions* and the SPR's *procedural aspirations* were rigorous, the historical and scientific consensus is that the evidence they amassed was **not** robust enough to sustain their claims, even by the standards of the time, let alone ours. The "failure" of psychical research is rarely attributed solely to institutional prejudice; it is equally attributed to the difficulty of eliminating sensory leakage, the unreliability of human testimony, and the statistical pitfalls inherent in searching for rare anomalies.

  If you frame the lecture as "Sidgwick was right, and the establishment was prejudiced," you risk presenting a historically contested claim as fact. However, if you frame it as **"Why did a mind like Sidgwick's find this evidence compelling when the broader scientific community did not, and what does that tell us about demarcation?"**, you open up a much deeper philosophical discussion about bias, theory-laden observation, and the sociology of scientific acceptance.

  With that framing in mind, here are three specific cases from the Sidgwick era that illustrate why the SPR felt they were onto something, along with the methodological tensions they reveal.

  ### 1. The Creery Sisters Experiments (1882)
  **The Case:** This was the SPR's first major experimental foray into "thought-transference" (telepathy). Five members of the Creery family attempted to guess cards drawn from a deck by agents in another room.
  **Why Sidgwick Found it Compelling:** The early results showed success rates significantly above chance. In the initial trials, the SPR investigators (including Sidgwick and F.W.H. Myers) believed they had controlled for sensory cues. For a group dedicated to empirical data, this looked like a replicable, quantifiable anomaly.
  **The Demarcation Tension:** This case is perfect for your lecture because the SPR's own rigor eventually undermined the result. As the experiments continued, the success rate dropped. Later analysis suggested "sensory leakage" (unintentional coughing, breathing, or visual cues) was likely responsible.
  **Lecture Point:** This illustrates that **methodological self-consciousness is iterative.** The SPR thought they were doing "science," but they had to learn *how* to do science with this specific subject matter. It complicates the Popperian view because the hypothesis *was* tested, but the "negative" results were initially obscured by noise that looked like signal.

  ### 2. The Census of Hallucinations (1894)
  **The Case:** Directed by Sidgwick, this was a massive statistical survey collecting over 17,000 questionnaires regarding hallucinatory experiences. The goal was to calculate the incidence of "phantasms of the living" (seeing a person who was dying or in crisis at a distance) to see if it exceeded the rate of coincidence.
  **Why Sidgwick Found it Compelling:** The final report (*Phantasms of the Living*) argued that the number of veridical hallucinations was roughly 1 in 43, whereas coincidence should have produced far fewer. Sidgwick viewed this as a statistical argument akin to epidemiology. He believed the sheer volume of data compensated for the unreliability of individual testimony.
  **The Demarcation Tension:** Critics (then and now) point out severe selection biases. People who *had* strange experiences were more likely to respond. Furthermore, verifying the "time of death" or the "time of the vision" relied on fallible memory.
  **Lecture Point:** This highlights the **problem of data quality in anomaly hunting.** It raises the question: Can statistical rigor rescue unreliable data? Sidgwick thought yes; the mainstream scientific establishment thought no. This is a classic demarcation dispute regarding what counts as "evidence."

  ### 3. The Hodgson Report on Madame Blavatsky (1885)
  **The Case:** Richard Hodgson, an agent of the SPR, was sent to India to investigate the Theosophical Society and its founder, Madame Blavatsky, who claimed psychic powers.
  **Why This Matters for Your Argument:** This case complicates the "gatekeeping" narrative. The SPR did not simply accept all psychic claims. Hodgson's report was devastating; he concluded Blavatsky was a fraud who used conjuring tricks to simulate psychic phenomena. Sidgwick supported this skeptical conclusion.
  **The Demarcation Tension:** This proves the SPR was not a credulous sect but an investigative body willing to debunk. Yet, despite this capacity for skepticism, they remained convinced of *other* phenomena (like telepathy) that critics argued suffered from similar flaws to the Blavatsky case.
  **Lecture Point:** This demonstrates that **skepticism is often domain-specific.** The SPR could apply rigorous demarcation criteria to Blavatsky but suspended them (or applied them differently) for the Creery sisters or mediumship. This suggests that demarcation is not just about method, but about prior probabilities and theoretical commitment.

  ### Suggested Philosophical Reframing for the Lecture

  To make your lecture robust, I suggest pivoting the conclusion slightly. Instead of arguing that the SPR was suppressed despite having "strong evidence," consider arguing that **the SPR case shows why methodological rigor alone is insufficient for demarcation.**

  1.  **Lakatosian Research Programmes:** You can frame the SPR as a "degenerating research programme." They constantly added ad-hoc hypotheses to explain away failures (e.g., "the psychic energy was drained by skeptical observers"), whereas mainstream science was a "progressive" programme.
  2.  **The Role of Consilience:** Mainstream science rejected psychical research not just out of prejudice, but because psychical phenomena lacked **consilience**. They did not connect with physics, biology, or chemistry. Sidgwick was willing to isolate the phenomena; the scientific establishment required them to integrate.
  3.  **The Human Element:** Sidgwick's involvement shows that even the most rigorous minds are susceptible to **confirmation bias** when the stakes are high (for Sidgwick, the possibility of survival after death had profound moral implications).

  ### Summary for Your Students
  If you present the Creery trials and the Census of Hallucinations as examples of **evidence that *appeared* robust to a rigorous mind like Sidgwick's, but ultimately failed to generate a cumulative science**, you will teach a more powerful lesson about the demarcation problem.

  It moves the discussion from "Who is the gatekeeper?" to "What are the epistemic conditions required for a claim to cross the boundary from heterodox inquiry to established science?" This honors Sidgwick's intellect without requiring you to endorse the validity of telepathy.
