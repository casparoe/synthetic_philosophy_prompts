      *   *The SPR's Methodology:* The early SPR *did* attempt to introduce methodological rigor to psychical research (e.g., controlled experiments, census taking). They were aware of the fraud problem.
      *   *The Evidence:* This is the critical pivot point. The user claims the evidence was "considerably more robust than the later scientific consensus... would suggest."
