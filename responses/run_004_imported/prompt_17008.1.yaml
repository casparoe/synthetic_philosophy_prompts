answer: |-
  The library lights had dimmed to their evening setting, casting long shadows across the stacks. Elena capped her pen and leaned back, the steam from her mug curling into the cool air. Marcus was still shuffling his notes, his brow furrowed.

  "You're not letting it go, are you?" Elena asked, nodding at the pile of papers.

  "Neither are you," Marcus replied, offering a tired smile. "But I think the group stopped too soon. The climate scientist case is a distraction. The real question is whether morality is a ledger or a relationship."

  "Meaning?"

  "Meaning, if I tell you to stop smoking because it kills you, the truth of that claim doesn't depend on whether I'm smoking a cigar right now." Marcus tapped his notebook. "That's the position I defended. The accusation stands on its own propositional content. Hypocrisy is a character flaw in the speaker, not a logical error in the speech."

  Elena stirred her coffee. "But blame isn't a weather report, Marcus. It's not just stating a fact about carbon concentrations. It's a normative demand. It says, *'You owe it to me, or to us, to stop.'* To make that demand, you need authority. And hypocrisy burns that authority."

  "Authority?" Marcus raised an eyebrow. "Since when do we need a license to point out a wrong? If I see a mugger, I don't need to be a saint to shout 'Stop.'"

  "A mugger is a legal violation. We're talking about moral blame within a community. There's a distinction between *silencing* blame and merely *weakening* it. Where do you land?"

  "I land on 'separate charge,'" Marcus said firmly. "When you call the scientist a hypocrite, you aren't answering his claim about emissions. You're filing a new complaint about his integrity. The emission claim remains untouched. It's not silenced, it's not weakened. It's just that now we're talking about two things instead of one."

  Elena shook her head. "That feels too clean. If standing is forfeited, the target doesn't just have a counter-complaint; they owe the blamer *no answer*. Imagine a reformed tax cheat. He starts berating current tax cheats. Does he have standing?"

  Marcus paused. "Yes. He's consistent now. He acknowledges the rule by following it."

  "Does he?" Elena leaned forward. "Suppose he berates them without ever acknowledging he used to be one. He acts as though he's always been on the side of the angels. Is his standing the same as someone who never cheated?"

  Marcus frowned, tracing the rim of his cup. "I see the trap. If standing requires moral authority, then hiding his past undermines it. But if standing is just about the truth of the claim 'tax cheating is wrong,' his past is irrelevant." He looked up. "Okay, I'll concede this: If the reformed cheat presents himself as *currently* virtuous to gain leverage, that's deception. And deception weakens the force of the blame. So, perhaps hypocrisy doesn't leave the original accusation 'completely untouched.' It introduces a defeater regarding the blamer's sincerity."

  "Good," Elena said. "So you're moving from 'separate charge' to 'weakened testimony.' Like a biased witness. But I want to push further. I think in some cases, it *silences* the blame. The target is entitled to say, 'Not from you,' and walk away."

  "That's dangerous," Marcus countered. "It gives wrongdoers a get-out-of-jail-free card. 'You stole a car too, so you can't tell me not to steal cars.' It creates a race to the bottom where only the sinless can speak, and since no one is sinless, no one can speak."

  "Which brings us to Cohen," Elena said. "The terrorism case. Cohen asks whether a bystander has standing to condemn a terrorist if the bystander is 'pure' only because they never had the opportunity or the nerve to commit the act. They aren't hypocrites—they aren't doing the thing they condemn. But are they morally superior?"

  Marcus nodded slowly. "Cohen's worry is about 'untested purity.' If I don't fly on private jets because I can't afford one, do I have standing to blame the billionaire who does, given the carbon cost?"

  "Exactly. If standing is just about not doing the thing, you have standing. But if standing is about *moral commitment*, your purity is accidental. It's luck."

  "So," Marcus said, testing the logic, "you're saying the billionaire could turn to you and say, 'You have no standing. You haven't sacrificed anything. You're just poor.'?"

  "I'm saying the accusation lacks *weight*," Elena corrected. "It's not that the climate math is wrong. It's that the moral demand is hollow. You haven't subjected yourself to the same normative pressures."

  Marcus sat back, looking at the ceiling. "I need to adjust my view. I've been treating blame as a statement of fact. But if blame is a call to accountability, then the relationship matters. If I demand sacrifice from you that I haven't made, and haven't *had* to make, I'm not inviting you into a shared moral community. I'm lecturing from a bunker."

  "Are you conceding the 'silencing' point, then?"

  "Not fully," Marcus said, holding up a finger. "I think 'silencing' is too strong. It implies the target owes no moral response. But the target *does* owe a response to the moral truth, even if they can ignore the messenger. However..." He paused, searching for the precision. "I will concede that hypocrisy can transform the *nature* of the exchange. If the blamer is a hypocrite, the target is entitled to shift the conversation to the blamer's inconsistency before addressing the substantive claim. It acts as a procedural block."

  "A procedural block," Elena repeated, tasting the phrase. "So it doesn't delete the claim, but it stalls its enforcement?"

  "Something like that. But let's test your view on the 'untested purity' again. If I say only those who have faced temptation have standing, we lose the voice of the innocent. We lose the child telling the adult not to hit. The child hasn't faced the same temptations. Are they silenced?"

  Elena winced. "That's the hard case. Okay. I need to narrow my claim. Standing isn't about having faced the *same* temptation. It's about acknowledging the *same* norm. The child and the adult both agree hitting is wrong. The hypocrite agrees hitting is wrong *for you*, but makes an exception for *themselves*."

  "So the forfeiture of standing comes from the *exception-making*, not the act itself?" Marcus asked.

  "Yes. The hypocrite says, 'The rule binds you, but my desires bind me.' That contradiction is what forfeits standing. The person who never had the opportunity to fly private doesn't make an exception for themselves. They just follow the rule, albeit by luck."

  Marcus nodded. "So the reformed tax cheat? If he acknowledges his past, admits he was wrong, and says 'We should both follow the rule,' he retains standing?"

  "He does," Elena agreed. "Because he's not claiming an exception. He's claiming solidarity in the rule."

  "And the climate scientist?" Marcus pressed. "If he says, 'I fly too much, it's a failing I'm trying to manage, but the science says we all need to fly less'?"

  "Then he keeps his standing," Elena said. "Because he includes himself in the blame."

  Marcus exhaled, finally taking a sip of his now-lukewarm coffee. "So we're closer than I thought. I started thinking blame was about the *truth of the proposition*. You started thinking it was about the *virtue of the speaker*."

  "And?"

  "And I think I see that blame is actually about the *validity of the demand*," Marcus said. "A hypocrite makes an invalid demand because they exempt themselves from the jurisdiction they're enforcing. It's like a judge sentencing someone for a crime the judge is actively committing. The law might be real, but the verdict is void."

  "Void," Elena mused. "That's stronger than 'weakened.' That's close to 'silenced.'"

  "Procedurally void," Marcus clarified. "Substantively, the law remains. So, if I hear a hypocrite blame me, I can say 'You have no authority to judge me.' But I cannot say 'The thing I did was right.'"

  Elena smiled. "I can accept that. The hypocrite loses the right to *hold you to account*, but they don't lose the ability to *state the moral fact*. The distinction is between the constative act and the illocutionary act."

  "Exactly." Marcus gathered his papers. "So the group was split because half were listening to the constative—the science—and half were listening to the illocutionary—the demand."

  "And the scientist?" Elena asked, standing up to pack her bag.

  "The scientist," Marcus said, "should have admitted the exception. If he'd said, 'I am failing to meet the standard I propose,' he would have kept his standing. By hiding it, he invited the charge of exemption."

  "Which," Elena added, slinging her bag over her shoulder, "is why your 'separate charge' theory didn't work. The hypocrisy wasn't a separate charge. It was evidence that he didn't believe his own demand applied universally. And if the blamer doesn't believe the demand applies universally, the target isn't obligated to accept it."

  Marcus held the door open for her. "I concede the point. Hypocrisy isn't just a character flaw. It's a structural failure in the act of blaming itself."

  "Good," Elena said as they walked into the cool night air. "Next week, we discuss whether luck undermines moral praise. I suspect you're going to hate that one too."

  Marcus laughed. "I'll bring extra coffee."
