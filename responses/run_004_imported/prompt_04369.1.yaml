      The Senior Common Room smelled of stale tobacco and polished wood. Outside, the June evening lingered, but inside, the air was thick with port and disagreement. Elizabeth Anscombe leaned forward, ash trembling on her cigarette.

      'You call it embarrassment, Gerald,' Anscombe said. 'I call it conscience. To honour Mr. Truman is to honour the deliberate killing of civilians.'

      Gerald Fenwick swirled his glass, watching the red legs cling to the crystal. 'It ended a war, Elizabeth. A war that had already consumed millions. You speak of civilians as if the line between soldier and citizen remained intact in 1945. It did not.'

      'The line exists wherever moral law exists,' she replied. 'Innocence is not a matter of personal guilt. It means simply not engaged in harming. The people of Hiroshima were not harming anyone when the bomb fell. To kill them as a means to an end is murder, regardless of the end.'

      Fenwick set his glass down with a sharp click. 'And if the end is preventing an invasion of Japan? If the alternative is half a million more dead boys from Oxford and Cambridge? You would let them die to keep your own hands clean?'

      'I would not murder to save them. That is the point.' Anscombe took a drag, her eyes unblinking. 'And do not pretend the bomb was the only way. It was the policy of Unconditional Surrender that made such methods seem necessary. We demanded they lay down their arms without guarantee. What did you expect them to do but fight to the death?'

      'Realism, Elizabeth. Not everyone can afford your absolutism.' Fenwick leaned back, exhaustion lining his face. 'When a nation mobilises for total war, its industry, its cities, its people become the engine of destruction. To stop the engine, you must strike the machine. Truman intended to stop the war, not massacre children.'

      'Intent does not change the act,' she countered. 'If you destroy the machine by killing the innocents who surround it, you have killed the innocents. You are arguing that utility overrides prohibition. That is utilitarianism, and it is bankrupt.'

      'It is survival,' Fenwick said quietly. 'No absolute prohibition survives contact with a war of that kind. If you insist on rules that ignore consequences, you make morality a luxury for the safe.'

      'Morality is precisely what we must keep when safety is lost,' Anscombe said. 'Otherwise, we are just calculating bodies.'

      They sat in silence, the gulf between them unbridgeable. The port remained untouched.

      Fenwick sighed. 'Your argument fails because you believe moral laws hold vacuum-sealed against the weight of the world.'

      Anscombe extinguished her cigarette. 'Yours fails because you believe the righteousness of an end sanctifies any means.'

