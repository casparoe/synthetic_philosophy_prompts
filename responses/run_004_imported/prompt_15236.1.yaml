answer: |-
  Your intuition is correct: your friend has conflated Aquinas with John of Salisbury. While Aquinas certainly condemns tyranny as a grave sin and a corruption of political order, he does **not** endorse the view that private individuals are licensed to commit tyrannicide. In fact, he explicitly argues against it in his mature works.

  The inference your friend makes—that because a tyrant forfeits legitimacy, any subject may kill him—breaks down on Aquinas's distinction between the *source* of authority and the *agent of removal*, as well as his deep concern for the evils of sedition.

  Here is a precise breakdown of where your friend's argument fails, the textual evidence against it, and what Aquinas actually recommends.

  ### 1. The Textual Problem: *De Regimine Principum*
  First, a caveat on the text your friend cited. *De Regimine Principum* (On Kingship) is incomplete. Scholars generally agree that **Book I and the first four chapters of Book II are by Aquinas**, but the remainder was written by his student, Ptolemy of Lucca. Ptolemy was more republican and more amenable to the deposition of rulers than his master. If your friend is citing passages from later in Book II, they are citing Ptolemy, not Aquinas.

  However, even in the sections definitely written by Aquinas (Book I), he is cautious. He argues that it is better to prevent tyranny through institutional limits than to cure it through violence. He writes that if the tyranny is not excessive, it is better to endure it lightly than to risk greater dangers by opposing it.

  ### 2. Where the Inference Breaks Down
  Your friend's syllogism looks like this:
  1.  Political authority is legitimate only if it serves the common good.
  2.  A tyrant serves only private good.
  3.  Therefore, the tyrant has no authority.
  4.  Therefore, any subject may kill him.

  Aquinas accepts premises 1 and 2. He rejects the move from 3 to 4. For Aquinas, the loss of *moral* legitimacy does not automatically grant *physical* license to private citizens. The breakdown occurs on two specific theological and political grounds:

  **A. Private vs. Public Authority**
  Aquinas maintains a strict distinction between private individuals and public authority. In the *Summa Theologiae* (II-II, q. 64, a. 3), he argues that killing a sinner (even a dangerous one) is licit only for those acting under public authority (like an executioner or a soldier), because they act for the good of the whole. A private individual does not have the charge of the common good.

  Therefore, if a private citizen kills a tyrant, they are committing murder, regardless of the tyrant's moral failings, because the private citizen is usurping a judgment that belongs to the community or a superior power.

  **B. The Danger of Sedition**
  In *Summa Theologiae* (II-II, q. 42, a. 2), Aquinas discusses sedition. He argues that opposing a ruler often leads to greater disorder than the tyranny itself. If every subject decides for themselves when a ruler has become a tyrant, the result is factionalism, civil war, and the breakdown of order itself.

  Aquinas fears that removing a tyrant often leads to a worse tyranny. He notes that the conspirators against a tyrant often become tyrants themselves to secure their position, or the ensuing chaos invites a harsher ruler to restore order. Thus, the "common good" (which justifies resistance in theory) often forbids private violence in practice.

  ### 3. The Exception: The Usurper
  There is one narrow exception where Aquinas comes close to your friend's view, found in his *Commentary on the Sentences* (II, dist. 44). He distinguishes between:
  1.  **A legitimate ruler who becomes tyrannical:** Cannot be killed by private individuals.
  2.  **A usurper who seizes power without title:** May be killed by anyone, because they never held authority to begin with.

  However, this is not "tyrannicide" in the sense of killing a reigning king; it is repelling an aggressor. Once a ruler is established and recognized, even if they rule badly, the protection against private violence applies.

  ### 4. What Aquinas Recommends Instead
  If private tyrannicide is forbidden, what does Aquinas suggest a subject do when faced with a genuine tyrant? He offers a hierarchy of responses, none of which involve private assassination:

  1.  **Public Deposition:** If there is a mechanism for it, the *community* (acting as a public body, not a mob) can depose the ruler. In *De Regimine*, Aquinas notes that if the people elected the king, they may have the right to depose him if he abuses his power. Crucially, this must be done through public authority, not private initiative.
  2.  **Appeal to a Superior:** If the tyrant is a subordinate ruler (e.g., a duke), one should appeal to his superior (e.g., the Emperor or the Pope).
  3.  **Divine Intervention:** If there is no human remedy (e.g., the tyrant is the Emperor with no superior), Aquinas advises turning to God. He cites the example of the Israelites praying against Pharaoh.
  4.  **Endurance:** In many cases, Aquinas counsel patience. He argues that the spiritual good of avoiding sin (murder/sedition) outweighs the temporal evil of suffering under a bad ruler, unless the tyranny is so extreme that it threatens the very existence of the community.

  ### 5. Aquinas vs. John of Salisbury
  Your friend is correct that John of Salisbury (*Policraticus*, 1159) explicitly defends tyrannicide. Salisbury uses a biological metaphor: the tyrant is a diseased limb, and any part of the body (any subject) has the right to cut it off to save the whole.

  Aquinas explicitly rejects this biological voluntarism. For Aquinas, the political order is not just a body; it is a hierarchy of authority derived from God. To kill a ruler without public mandate is to violate the divine order of judgment, even if the ruler is sinful.

  ### Summary for Your Next Dinner
  You can tell your friend that while Aquinas agrees that tyranny is a sin and that authority is conditional on the common good, he refuses to privatize the sword.
  *   **John of Salisbury:** The tyrant is a public enemy; any hand can strike him.
  *   **Aquinas:** The tyrant is a sinful ruler; only public authority can remove him, and private killing is sedition.

  Aquinas's position is more conservative and institutional: he prefers the risk of enduring a tyrant to the risk of legitimizing political assassination, which he views as a gateway to anarchy. Your friend's reading is a common modernization of Aquinas, projecting liberal resistance theory back onto a medieval mind that prioritized order and hierarchy above almost all else.
