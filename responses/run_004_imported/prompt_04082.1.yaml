      *   *Tone:* Keep it philosophical, analytical, and respectful of the text.
      *   *Key Latin Terms:* *Mendacium* (lie), *Veritas* (truth), *Prodito* (betrayal).
      *   *Potential Pitfall:* Don't make Augustine sound too pragmatic. He hates pragmatism if it violates divine law. Emphasize that the *success* of the diversion is secondary to the *truthfulness* of the statement.

  7.  **Final Polish:** Organize into clear headings. Ensure the direct questions from the prompt are answered explicitly. (Why does it escape betrayal? Is it principled?)

