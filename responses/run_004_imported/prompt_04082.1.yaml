      *   *Section 3: The Principled Distinction (Lying vs. Concealment).* Define *mendacium*. Explain that for Augustine, truthfulness is about the correspondence between mind and speech, not mind and listener's understanding. You can deceive without lying.
      *   *Section 4: Addressing the User's Critique (Inference Management).* Concede the user's point. It *is* inference management. But for Augustine, that's permissible. Lying is not. The "end" (saving the fugitive) doesn't justify the lie, but it justifies the concealment.
