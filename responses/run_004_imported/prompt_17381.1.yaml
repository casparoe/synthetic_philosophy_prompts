      *Wait, one more thought:* Is there a way to say Heine is right? If the definition of a public intellectual is to speak truth to power, Goethe failed. But Goethe didn't accept that definition. So the verdict depends on the metric. The prompt asks about Heine's critique. Heine's critique is that Goethe *could* have changed things but didn't.
