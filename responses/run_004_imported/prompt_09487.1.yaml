prompt: |-
  A bunch of us retired-science types (I did organic chemistry for 35 years, never opened a philosophy book til I quit) run a little monthly meetup, and this month it's a whole Saturday on Frege. I somehow got roped into the opening remarks. Trouble is, the afternoon session is a member's talk on that 1924 diary of his -- where he argues Jews and socialists shouldn't have equal civil rights and that parlimentary democracy is basically rotten -- and half the group already knows about it while the other half (me, three months ago) just thinks of him as the quantifier guy. I need about 5 minutes of welcome remarks that flag honestly that this is coming, without turning the day into a trial of the man or letting the hardcore logic crowd dismiss it as irrelevant to 'the real philosophy.' Bonus if you can put his own idea that logical truth is objective and nobody's private property to actual use here, instead of just being diplomatic. Can you write it?
