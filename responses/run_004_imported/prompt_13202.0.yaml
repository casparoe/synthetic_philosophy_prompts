      *   *CDT (Causal Decision Theory):* Chooses act based on causal impact. My choice doesn't *cause* Death's past prediction. So $P(Death | Stay) = P(Death)$ (prior). If priors are 50/50, both acts look equal.
      *   *Instability:* EDT leads to deliberational instability (as soon as I lean one way, I should switch).
