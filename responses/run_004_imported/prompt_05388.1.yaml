      *   **Problem:** Popular treatments elide this distinction, just saying "QM is nonlocal." The user knows QM violates one but respects the other, preserving no-signaling.
      *   **Goal:** Explain PI and OI intuitively, identify which one QM violates, and explain why violating the *other* one would be more alarming for relativistic causality (signaling).
      *   **Constraint:** Avoid heavy formalism (equations), focus on concepts and intuition.

  2.  **Deconstruct the Concepts:**
      *   **Bell Scenario:** Alice and Bob, spacelike separated, measuring entangled particles. Settings ($a, b$) and Outcomes ($A, B$). Hidden variables ($\lambda$).
      *   **Factorizability:** $P(A, B | a, b, \lambda) = P(A | a, b, \lambda) \cdot P(B | a, b, \lambda)$. (Wait, that's not quite right for the split).
      *   **Jarrett's Decomposition:**
          *   Factorizability $\iff$ Parameter Independence + Outcome Independence.
          *   **Parameter Independence (PI):** The probability of Alice's outcome doesn't depend on Bob's *setting*. $P(A | a, b, \lambda) = P(A | a, \lambda)$.
          *   **Outcome Independence (OI):** The probability of Alice's outcome doesn't depend on Bob's *outcome*. $P(A, B | a, b, \lambda) = P(A | a, b, \lambda) \cdot P(B | a, b, \lambda)$. Or, $P(A | B, a, b, \lambda) = P(A | a, b, \lambda)$.

  3.  **Drafting the Intuitive Explanations:**
      *   *Parameter Independence:* Does what Bob *chooses to do* (twist his knob) instantly change the statistics of what Alice *sees*?
      *   *Outcome Independence:* Does what Bob *actually gets* (his specific result) tell us something about what Alice *gets*, beyond what the shared history ($\lambda$) already told us?

  4.  **Identifying QM's Stance:**
