      *(Refining the Alternative)*: The prompt says the current cycle is 5 years. The problem was decline *between* cycles. So the alternative must address the gap. A "For-Cause" review is the standard solution. I will propose formalizing a "Referral for Capacity Review" that can be initiated by a Department Chair or a petition from graduate students, bypassing the 5-year clock.

      *(Refining the Opposition Steel-man)*: The "Yes" side isn't just ageist; they are worried about *asymmetry of information*. Students can't easily complain. Colleagues don't want to snitch. An age trigger removes the social burden of reporting. I need to acknowledge this social friction.

