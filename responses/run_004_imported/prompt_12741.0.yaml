answer: |-
  **MEMORANDUM**

  **TO:** Ad Hoc Committee on Post-Tenure Review Policy
  **FROM:** [Your Name], Student Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Late-Career Capacity Review

  **Recommendation**
  I recommend we **reject the mandatory age-75 trigger** and instead **retain the age-neutral five-year cycle as the sole scheduled mechanism**, amended by the creation of a formal, confidential "Capacity Concern Referral" process. This referral would allow Department Chairs or a coalition of graduate students to petition for an immediate, targeted review outside the standard cycle when specific evidence of decline emerges.

  **Reasoning: The Ciceronian Standard**
  Our debate mirrors the central tension in Cicero's *De Senectute*. Cato argues that age is frequently blamed for faults that are actually matters of individual character or specific health. He insists that fitness for duty must be determined by *function*, not chronology. The anecdote of Sophocles is dispositive: when hauled into court to prove incompetence due to age, Sophocles did not argue his birth year; he read his latest play. The jury acquitted him based on the work, not the man.

  To adopt an age-75 trigger is to presume incapacity before demanding proof of work. As Cato notes, irritability or cognitive slowing are not universal to age; they are particular to the individual. A policy that targets birth year risks insulting the Sophocles of our faculty while failing to address the specific *functional* deficits (e.g., inability to supervise dissertations) that actually cause harm. Our policy must replicate the Athenian jury: ask for the play, not the passport.

  **The Case for the Age Trigger (Minority View)**
  Those advocating for the age-75 review are not motivated by prejudice but by a prudent recognition of systemic friction. The strongest argument for the trigger is that "For-Cause" mechanisms rely on individuals to report colleagues or supervisors, a social burden that is often too high to bear. In the case that prompted this committee, decline went unaddressed because no one felt empowered to speak up until harm occurred. An age-based trigger is administratively clean and removes the stigma of reporting; it acts as a safety net when social courage fails. It prioritizes student protection over faculty sensibilities, arguing that while a high-performing 75-year-old may feel insulted, the cost of a false negative is merely hurt feelings, whereas the cost of a false positive (missing a declining professor) is damaged careers.

  **Proposed Alternative: Functional Triggers**
  To address the "silence" problem without age discrimination, the "Capacity Concern Referral" must be low-barrier and confidential. If a Chair observes a failure in mentorship, or if graduate students petition collectively, a review is triggered immediately. This shifts the focus from *who* the professor is to *what* the professor is doing. It allows us to intervene in the "harm case" without subjecting the "high-performer" to a ritualized insult. We should judge capacity by the text, not the timestamp.

  I look forward to discussing this framework on Tuesday.
