answer: |-
  ### The Scenario: The Unshattered Vase

  Imagine a time traveler, Elena, who is a curator in the year 2024. In her museum sits a specific, famous Song Dynasty vase. It is historically documented, physically examined, and undeniably **whole**. There are no cracks, no repairs, no chips. It survived the millennium intact.

  Elena travels back to the year 1024, to the workshop where the vase was just finished and set out to cool. She arrives alone, unseen, carrying a heavy iron hammer. She stands over the vase. She has the strength to swing, the balance to aim, and the opportunity to strike. No guards are present; the artisan has stepped out of the room.

  Here is the tension:
  1.  **Intuition A:** Obviously, Elena *can* smash the vase. She has the hammer, the strength, and the access. If she swings, physics dictates the ceramic will shatter.
  2.  **Intuition B:** Obviously, Elena *cannot* smash the vase. If she did, the vase in her 2024 museum would be shattered. But the vase in 2024 is whole. Therefore, she does not (and seemingly *cannot*) smash it.

  This scenario replicates the Grandfather Paradox's structure without involving ancestry or biological existence. It pits **local physical capacity** against **global historical fact**.

  ### Lewis's Semantic Diagnosis: The Two Senses of "Can"

  David Lewis argues that the paradox arises because we are sliding between two different sets of "relevant facts" when we use the word *can*.

  **1. "Can" relative to Local Facts (The Compatibilist Sense)**
  When we say Elena *can* smash the vase, we are holding fixed a narrow set of facts: the laws of physics, the hardness of the iron, the fragility of the ceramic, Elena's muscle mass, and the immediate absence of obstacles.
  *   **Relevant Facts:** Hammer is hard, vase is brittle, Elena is strong, no guards.
  *   **Verdict:** Relative to *these* facts, it is true that Elena **can** smash the vase. There is no internal contradiction between her local capacities and the act of smashing. In this sense, she has the ability.

  **2. "Can" relative to Global Facts (The Historical Sense)**
  When we say Elena *cannot* smash the vase, we are holding fixed a much broader set of facts that includes the state of the world in 2024.
  *   **Relevant Facts:** All of the above, *plus* the fact that the vase exists whole in the 2024 museum.
  *   **Verdict:** Relative to *this* expanded set, it is true that Elena **cannot** smash the vase. The proposition "Elena smashes the vase" is *incompossible* with the proposition "The vase is whole in 2024." Since the latter is a fixed fact of the actual world, the former must be false.

  **The Dissolution:**
  Lewis's move is to say there is no contradiction because the word "can" is context-sensitive.
  *   Is it true that "Elena can smash the vase"? **Yes**, relative to local facts.
  *   Is it true that "Elena cannot smash the vase"? **Yes**, relative to global facts.
  *   Is it true that "Elena can and cannot smash the vase"? **No**, because you cannot hold both sets of facts fixed simultaneously in a single context.

  The paradox vanishes once we admit that "can" never means "possible relative to *all* facts whatsoever." It always means "possible relative to *some selected* facts." Ordinary intuition screams because we naturally toggle between the local context (where we assess ability) and the global context (where we assess truth).

  ### Why This Is Distinct from Branching or Self-Consistency

  Lewis's semantic diagnosis is doing fundamentally different philosophical work than the two other common "pop" resolutions.

  **1. Versus Branching Timelines (Many-Worlds)**
  *   **The Branching Move:** This theory says Elena *does* smash the vase. When she strikes, the universe splits. In Branch A, the vase breaks (and she never returns to her original 2024). In Branch B, the vase remains whole (and that's the 2024 she came from).
  *   **Lewis's Difference:** Lewis is a defender of the **single, unified timeline**. He does not posit new worlds to save Elena's ability. In Lewis's view, there is only one 2024 and one 1024. Elena *does not* smash the vase. The branching theorist saves the "can" by making the act happen elsewhere; Lewis saves the "can" by redefining it as a local capacity that simply goes unexercised in the actual world. For Lewis, the tragedy is real: she has the ability, but the world is such that she never uses it.

  **2. Versus the Novikov Self-Consistency Principle**
  *   **The Novikov Move:** This is a physical/causal claim. It suggests the laws of physics *conspire* to prevent the inconsistency. If Elena tries to swing, her shoulder will slip, the hammer will slip, a bird will fly in the way, or she will have a sudden change of heart. The universe actively enforces consistency through causal mechanisms.
  *   **Lewis's Difference:** Lewis agrees Elena will fail, but he rejects the idea that a *special* physical force stops her. For Lewis, the "prevention" is logical, not causal.
      *   In Novikov's view, the probability of the hammer slipping is raised to 100% by time-travel physics.
      *   In Lewis's view, the hammer slips (or whatever happens) simply because that is part of the consistent block of history. There is no "force field of logic" pushing her hand aside.
      *   Crucially, Lewis's semantic move explains *why* we feel she "can" do it even though she won't. Novikov says, "She thinks she can, but physics says no." Lewis says, "She *really can* (locally), but she *really can't* (globally), and both statements are true." Lewis preserves the truth of her ability in a way Novikov does not; Novikov essentially says her local ability is an illusion because the causal chain was never open to that outcome. Lewis says the ability is real, but incompossible with the total world state.

  ### Summary

  The "Unshattered Vase" scenario forces us to confront the gap between **capacity** and **compossibility**.

  *   **Branching Timelines** resolve the tension by multiplying reality (she does it *somewhere*).
  *   **Novikov** resolves it by constraining causality (physics stops her).
  *   **Lewis** resolves it by constraining language (the word "can" shifts meaning).

  Lewis's treatment is uniquely deflationary. It suggests the Grandfather Paradox (and the Unshattered Vase) isn't a puzzle about physics or metaphysics, but a linguistic trap. We are fooled into thinking "can" implies "will happen in some accessible future," when in a block universe, "can" only ever means "fits with the specific slice of facts we are currently ignoring." The tragedy of the time traveler is not that they are physically restrained, but that their local abilities are logically marooned from the global truth.
