prompt: |-
  My aunt Ruth died three weeks ago at sixty-three, which everyone agrees was too soon, and I've been asked to give the eulogy this weekend. She left school at sixteen and spent her whole working life painting houses, but she read philosophy for fun on her own, out of library-sale paperbacks and photocopied essays, and about twenty years ago she pressed one of those essays on me — Moritz Schlick's piece on the meaning of life — telling me it had settled something she'd been turning over since she was a girl. I'm no scholar either, just someone she got started on it, so I follow the argument only in my own rough terms: that a life spent entirely on purposes — doing one thing so as to afford or achieve some further thing — never actually lands anywhere, because each purpose only hands you off to the next, and that whatever meaning a life has must come instead from whatever in it counts as play rather than work: things done the way a child plays, for no reason beyond themselves. Ruth took this more seriously than anyone I've known: she turned down two promotions to keep her afternoons free, spent years teaching herself to identify birds by ear for absolutely no reason, and, from her hospice bed, got quietly furious at a cousin who called her "such a hard worker." She left a note asking whoever spoke not to praise her work ethic, her accomplishments, or any "legacy," and not to console anyone with the thought that a longer life would have amounted to more — she wanted it said plainly that meaning was never a matter of how much got done or how long there'd been to do it in.

  I'd like your help writing that eulogy. It has to actually honor what she asked, not just gesture at it before sliding into the usual language once things get emotional, and it has to work for a room of maybe eighty people who mostly knew her as a good painter and a warm, slightly odd woman rather than as somebody with a philosophy of her own — except for one friend of hers from a secondhand-bookshop reading circle, who will notice immediately if the idea gets flattened or misstated. I don't know myself whether it's better to actually name Schlick and the essay or to carry the idea through in plain language and let the philosophy stay invisible. Five or six minutes, please, and something that could actually comfort people rather than just being correct.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** Aunt Ruth, died at 63 (too soon).
      *   **Profession:** House painter (left school at 16).
      *   **Passion/Philosophy:** Read philosophy (self-taught), specifically Moritz Schlick's "The Meaning of Life."
      *   **Core Argument:** Life spent on *purposes* (means to an end) never lands. Meaning comes from *play* (things done for their own sake).
      *   **Specific Instructions from Deceased:** Do not praise work ethic, accomplishments, or legacy. Do not console with "longer life = more meaning." State plainly that meaning isn't about quantity of work or time.
      *   **Audience:** ~80 people. Most knew her as a painter/warm/odd woman. One friend from a bookshop reading circle knows the philosophy well (must not flatten/misstate it).
      *   **Speaker:** Niece/Nephew (not a scholar, but initiated by Ruth).
      *   **Tone:** Honoring her request, comforting, authentic, not slipping into cliché.
      *   **Constraint:** 5-6 minutes spoken (approx. 750-900 words).
      *   **Decision Point:** Name Schlick or keep it invisible? (Need to weigh this).

  2.  **Determine the Strategy:**
      *   *Naming Schlick:* It honors the specific intellectual bond between the speaker and Ruth, and it signals to the bookshop friend that the source is respected. However, it risks alienating the general audience if it sounds too academic.
      *   *Decision:* Name him, but briefly and contextually. It validates the "one friend" and honors Ruth's specific gift to the speaker, but the *explanation* must remain accessible (as the prompt describes: "rough terms").
      *   *Avoiding Clichés:* No "she worked so hard," no "she left us too soon" (in the sense of unfinished business), no "her legacy lives on."
      *   *Focus:* Shift the definition of a "life well-lived" from *production* to *presence/play*.
      *   *Comfort:* The comfort comes from relieving the pressure on the mourners. If meaning isn't about *doing*, then grief doesn't need to be "productive" either.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. State the constraint immediately (her note). This sets the boundary and grabs attention.
      *   **The Work vs. The Life:** Acknowledge her job (painting) but pivot quickly to how she viewed it. She was good at it, but it wasn't *who she was*.
      *   **The Philosophy (The Core):** Introduce the Schlick essay. Explain the "Purpose vs. Play" argument simply. Use her examples (birdsong, turning down promotions).
      *   **Addressing the Grief (The "Too Soon" aspect):** Tackle the "63 is too young" sentiment without contradicting it, but reframing it. A longer life wouldn't necessarily mean *more* meaning if meaning isn't cumulative.
      *   **The Bookshop Friend:** A subtle nod. "Those who read with her know..."
      *   **Closing:** A call to action for the mourners. Not to "carry on her legacy," but to engage in their own "play." A final image of her.

  4.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add sensory details. The smell of paint, the sound of birds, the hospice bed moment.
      *   *Critique:* Is it comforting?
      *   *Fix:* Emphasize that *we* are allowed to rest too. The permission to not be productive.
      *   *Critique:* Did I follow her rules?
      *   *Fix:* Ensure no mention of "legacy" or "hard work" as virtues.

  5.  **Drafting - Writing the Content (incorporating the Schlick decision):**
      *   *Why name Schlick?* It's specific. It shows the speaker listened. It satisfies the bookshop friend. But keep it grounded. "She handed me a photocopy."
      *   *The "Play" concept:* Needs to be clear. Not just games, but *intrinsic value*. Birdsong is a perfect example.
      *   *The "Too Soon" paradox:* If meaning isn't time-based, does it matter she died at 63? Yes, because we miss her. But no, because her life wasn't "incomplete."

  6.  **Refining the Tone:**
      *   Needs to sound spoken, not read. Short sentences. Pauses.
      *   Avoid eulogy-speak ("passed," "gone to a better place," "angel"). Use "died," "dead," "here."
      *   Make sure the transition from "painter" to "philosopher" feels natural, not like a reveal of a secret identity, but an integration of how she lived.

  7.  **Final Review against Constraints:**
      *   5-6 minutes? (Word count check: ~850 words is usually safe for a slow, measured pace).
      *   Honor the note? (Yes, explicitly mentioned).
      *   Comforting? (Yes, by relieving the burden of achievement).
      *   Bookshop friend satisfied? (Yes, Schlick named, argument accurate).

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Did I accidentally praise her work ethic?
      *   *Correction:* Make sure to say she was *good* at painting, but that she refused to let it define her worth.
      *   *Check:* Is the Schlick explanation clear?
      *   *Correction:* Use the "chain of purposes" analogy. Doing X to get Y to get Z. vs. Doing A because A is good.

  9.  **Final Word Count Check:** Aiming for roughly 800-900 words.

  *(Self-Correction during final output generation)*: Ensure the emotional arc lands. Start with the instruction, move to the philosophy, apply it to her life, apply it to our grief, end with a quiet goodbye.

  10. **Final Polish:** Add stage directions for pacing. (e.g., [Pause]).

  *(Wait, one more thing)*: The prompt asks for help writing it. I should provide the speech text directly, perhaps with a brief note on delivery.

