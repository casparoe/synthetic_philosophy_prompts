prompt: |-
  So I've been reporting a piece on "information avoidance" — the research area on why people skip the genetic test for Huntington's, don't check the banking app when they're overdrawn, or ask the surgeon to tell their partner the biopsy result first instead of them. Theres a whole psych/behavioral econ literature on this by now. But when I ran a draft past a decision theorist friend, he said I was dancing around the actual theoretical backdrop: there's a classic result called Good's theorem (I.J. Good, late 60s) that supposedly proves a rational Bayesian agent should never expect free evidence to leave them worse off — the expected value of information is always non-negative, as long as they go on to update and act optimally on whatever they learn. He said most of the "look how irrational humans are" framing in the avoidance literature just skips over what the theorem actually licenses you to conclude, and now I cant stop turning it over.

  My editor hates wishy-washy conclusions, so here's what I need from you: an essay that actually gets into the guts of the theorem — why the proof goes through (it's basically a Jensen's-inequality trick: choosing your best action after you've seen the evidence beats committing to one before you've seen it, on average), and what exactly "non-negative in expectation" is and isn't promising you — and then adjudicates whether cases like Huntington's testing, spoiler-avoidance, or the classic finding that making information public can destroy an insurance arrangement that private uncertainty had made possible, are real counterexamples to the theorem, or just cases it was never making a claim about in the first place. Don't hedge and list considerations on both sides and shrug at the end — I want an actual verdict I can quote in the piece (a qualified one is fine, something like "the theorem is airtight but almost never the right thing to say to an information-avoider," if that's where you land), plus the argument that gets you there.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Information Avoidance vs. Good's Theorem (Value of Information).
      *   **Audience:** A journalist writing a piece for a general but intellectually sophisticated audience (likely a magazine like *The Atlantic*, *New Yorker*, or *Aeon*). The editor hates wishy-washy conclusions.
      *   **Key Requirements:**
          *   Explain Good's Theorem (why the proof works, specifically the Jensen's inequality/convexity angle).
          *   Explain what "non-negative in expectation" means (and doesn't mean).
          *   Adjudicate specific cases: Huntington's testing, spoiler avoidance, insurance markets/public information.
          *   **Crucial:** Provide a clear, quotable verdict (no hedging/shrugging).
          *   **Tone:** Analytical, authoritative, engaging, not dryly academic but rigorous.

  2.  **Deconstruct Good's Theorem:**
      *   *What is it?* I.J. Good (1967). A rational Bayesian agent should always accept free, relevant information.
      *   *Why?* Because having more information expands the set of available actions (or allows better mapping of actions to states).
      *   *The Math (Simplified):* Let $U(a, \theta)$ be utility of action $a$ in state $\theta$.
          *   Without info: Choose $a^*$ to maximize $E[U(a, \theta)]$.
          *   With info (signal $s$): Observe $s$, update beliefs to $P(\theta|s)$, choose $a_s^*$ to maximize $E[U(a, \theta)|s]$.
          *   Expected Utility with info: $E_s [ \max_a E[U(a, \theta)|s] ]$.
          *   Expected Utility without info: $\max_a E_s [ E[U(a, \theta)|s] ]$.
          *   Since $\max$ is a convex function, $E[\max] \ge \max E$. (Jensen's Inequality).
      *   *The Catch:* This assumes the utility function is fixed, the agent is purely instrumental (cares only about outcomes, not the information itself), and the information is costless.

  3.  **Analyze the "Counterexamples":**
      *   *Huntington's Disease:* Why avoid? The information changes the *state of mind* (anxiety, hope) directly, not just the action. Or, there is no action to take (no cure). If the action set is empty or unchanged, the value of information is zero instrumentally. If the news itself hurts utility (direct disutility), Good's theorem doesn't apply because utility depends on the signal, not just the final outcome.
      *   *Spoiler Avoidance:* Similar to above. The utility of watching a movie depends on *not knowing* the ending. Knowing the ending reduces the utility of the consumption experience. The information is a "bad" in the utility function.
      *   *Insurance Markets (Hirshleifer Effect):* Public information can destroy risk-sharing. If everyone knows who is sick before insurance is bought, no insurance happens. Private uncertainty allows pooling. Here, the information changes the *game* (the available contracts), not just the individual's action within a fixed game. Good's theorem assumes a fixed decision problem.

  4.  **Formulate the Verdict:**
      *   Is Good's Theorem wrong? No, mathematically it's sound *within its assumptions*.
      *   Are humans irrational for avoiding info? Not necessarily. They are often optimizing a different utility function than the one Good assumed.
      *   *The Verdict:* Good's Theorem is a tautology about *instrumental* value in a fixed world. Information avoidance happens when information has *intrinsic* value (emotional cost) or *strategic* value (changing the game structure). Therefore, the theorem is airtight but irrelevant to most real-world avoidance.
      *   *Drafting the Punchline:* "Good's Theorem is not a law of human behavior; it is a definition of instrumental rationality. When people avoid information, they aren't failing math; they are optimizing for peace of mind or social stability, variables Good's equation treats as zero."

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Hook with the tension. The behavioral economists say we're irrational; the decision theorist says we're ignoring Good. Set the stage.
      *   **The Guts of the Theorem:** Explain the math without getting bogged down. Use the "menu" analogy. Choosing from a menu *after* seeing what's fresh is better than ordering *before*. Mention convexity/Jensen's inequality simply.
      *   **The "Expectation" Trap:** Clarify that "expected value" doesn't mean "every time." You can get bad news. But *before* you look, the *prospect* of looking is valuable.
      *   **The Adjudication (The Meat):**
          *   *Huntington's:* No cure = no action change. Instrumental value = 0. Emotional cost > 0. Net negative. Good doesn't account for emotional cost.
          *   *Spoilers:* Information destroys consumption utility. It's a "bad."
          *   *Insurance (Hirshleifer):* Information changes the *rules*, not just the move. It destroys the market.
      *   **The Verdict:** Bring it home. The theorem assumes information is a tool. Often, information is an experience or a social disruptor.
      *   **Conclusion:** Final quotable summary.

  6.  **Refining the Tone:**
      *   Avoid "on the one hand, on the other hand."
      *   Be decisive. "The theorem is right, but the application is wrong."
      *   Ensure the explanation of Jensen's inequality is intuitive (the "flexibility" argument).
      *   Check against the prompt's requirement: "Don't hedge... I want an actual verdict."

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I explain Jensen's clearly?
      *   *Fix:* Use the "max of expectations vs expectation of max" phrasing. It's the standard way to explain it.
      *   *Critique:* Is the insurance example clear?
      *   *Fix:* Explicitly mention the Hirshleifer effect. It's the classic counterpoint to Good in economics.
      *   *Critique:* Is the verdict strong enough?
      *   *Fix:* Make sure the final paragraph is punchy. "Good's Theorem describes a robot, not a human." (Maybe too cliché). Let's go with "The theorem defines the value of information for a decision-maker; avoidance reveals the value of ignorance for a human being."

  8.  **Final Polish:** Check word count and flow. Ensure the distinction between *instrumental* and *intrinsic* value of information is sharp. (This is the key theoretical distinction).

  **(Self-Correction Note):** I need to make sure I don't dismiss Good's Theorem as "wrong." It's mathematically true. The error is in the *modeling* of the human utility function. The essay must reflect that nuance while remaining decisive.

  9.  **Finalizing the Verdict:** "Good's Theorem is airtight within its assumptions, but those assumptions strip away the very reasons humans care about information in the first place."

  Let's write.
answer: |-
  **The Value of Ignorance: Why Good's Theorem Doesn't Govern Human Lives**

  Your decision theorist friend is technically right, but his victory is Pyrrhic. I.J. Good's 1967 theorem is one of the most elegant results in decision science, and it is mathematically unassailable. It states that for a rational Bayesian agent, the expected value of free, relevant information is always non-negative. If you can update your beliefs and act optimally on what you learn, you should never turn down the data. To do so is, by definition, irrational.

  However, the behavioral literature on information avoidance is not wrong, either. The tension between Good's Theorem and the reality of Huntington's testing or spoiler avoidance does not reveal a flaw in the math. It reveals a flaw in the mapping. Good's Theorem is a statement about *instrumental* rationality in a fixed world. Human information avoidance is a response to *intrinsic* costs and *strategic* environments that the theorem explicitly excludes.

  Here is the verdict you can use: **Good's Theorem is airtight, but it is a tautology about tools, not a law of human behavior. It proves that information is valuable for making decisions, but it says nothing about the cost of living with the truth.**

  ### The Guts of the Theorem

  To understand why the theorem holds, you have to understand what it means to "value" information. In decision theory, you don't value the data itself; you value the ability to change your action based on the data.

  Imagine you are a general deciding whether to attack a hill. You have two choices: Attack or Retreat. Without intelligence, you must choose based on the average probability of victory. Let's say the odds are murky, so you choose to Retreat to play it safe. Your expected payoff is 5 points.

  Now, imagine a spy offers you a free report on the enemy's strength. Good's Theorem asks you to calculate the value of this report *before* you read it.
  1.  **Scenario A:** The spy says the enemy is weak. You update your beliefs, realize Attack is now optimal, and switch actions. Payoff: 10 points.
  2.  **Scenario B:** The spy says the enemy is strong. You update, realize Retreat was right all along, and stick with Retreat. Payoff: 5 points.

  Crucially, you never do *worse* than you would have without the info. In Scenario B, you simply ignore the new data and do what you would have done anyway. In Scenario A, you improve your outcome. Because the "maximum" function is convex (a mathematical property formalized by Jensen's Inequality), the average of the best choices you make *after* seeing the signal must be higher than the best choice you can make *before* seeing it.

  Mathematically: $E[\max_a U(a)] \geq \max_a E[U(a)]$.

  The expectation of the maximum (choosing best action after info) is always greater than or equal to the maximum of the expectation (choosing best action before info). Information grants you an option value: the option to change your mind. Since options have value and free information costs nothing, the net value must be positive.

  ### The Expectation Trap

  The first place the "humans are irrational" framing goes off the rails is in the interpretation of "expected value." Good's Theorem does not promise that every piece of news will make you happier. It promises that *before you look*, the prospect of looking is beneficial.

  If you check your bank account and find you are overdrawn, you are objectively worse off in that moment than if you had remained ignorant. But Good argues that *ex-ante* (before checking), you were better off having the capacity to know. Why? Because knowing allows you to fix the overdraft. Ignorance forces you to risk bouncing checks. The pain of the bad news is the price of the option to avoid overdraft fees.

  If a human avoids the bank app, Good's Theorem suggests they are irrationally throwing away the option to mitigate loss. In strict financial terms, they are. But this assumes the only utility that matters is the bank balance.

  ### Where the Theorem Breaks: Intrinsic and Strategic Costs

  This is where the Huntington's tests, the spoilers, and the insurance markets enter. These are not counterexamples to Good's math; they are counterexamples to Good's *assumptions*. Good's Theorem relies on three specific conditions that rarely hold in human psychology or social economics.

  **1. Information has no intrinsic utility (The Huntington's Case)**
  Good's Theorem assumes utility depends only on the final *outcome* (e.g., health, wealth), not on the *state of knowledge* itself. It treats information as a tool, like a hammer.
  For someone facing a genetic test for Huntington's disease, information is not a hammer; it is an experience. If there is no cure, the instrumental value of the test is zero. You cannot change your medical action. The only thing the test changes is your psychological state.
  If knowing you carry the gene causes years of anticipatory grief, that grief is a direct cost entered into the utility function. Good's Theorem calculates: *Value of Option to Act - Cost of Info.* Since the info is free and the option to act is null, the value is zero. But if the *consumption* of the info is painful, the net value becomes negative.
  Avoiding the test isn't irrational Bayesian updating; it's rational utility maximization where "peace of mind" is a valued good. Good's Theorem doesn't forbid this; it simply assumes that good isn't on the menu.

  **2. Information destroys the good (The Spoiler Case)**
  Spoiler avoidance is the cleanest refutation of the *applicability* of the theorem. When you watch a mystery movie, the utility of the experience is derived from the *process* of uncertainty resolution.
  If you know the butler did it, the utility of watching the movie drops. Here, the information is not a tool to help you choose a better action (like choosing a different movie); it is a "bad" that degrades the consumption of the current good.
  Good's Theorem assumes information allows you to optimize your interaction with the world. Spoiler avoidance proves that sometimes, the optimal interaction with the world requires you to remain ignorant of it. The theorem isn't wrong, but it is category-error wrong to apply it here. It calculates the value of information for a *decision-maker*, not for an *experiencer*.

  **3. Information changes the game (The Insurance Case)**
  This is the most devastating economic critique, known as the Hirshleifer Effect. Good's Theorem assumes a fixed decision problem. You are the only player, and the rules don't change when you learn the truth.
  In insurance markets, this is false. Insurance relies on private uncertainty. If I don't know if I'm sick, and you don't know if you're sick, we can pool risk. If a genetic test makes that information public *before* we buy insurance, the game changes. The insurer will charge me high premiums and you low ones. The risk-pooling arrangement collapses.
  In this scenario, public information makes the *group* worse off, even if it helps the *individual* decide. Good's Theorem is a single-agent model. It cannot account for situations where my information alters your willingness to trade with me. When information destroys the market that protects you, avoiding that information is not irrational; it is socially rational.

  ### The Verdict

  The behavioral economics literature often frames information avoidance as a "bias"—a glitch in human processing where fear overrides logic. Your decision theorist friend frames it as a misunderstanding of Good's Theorem. Both are partially blind.

  Good's Theorem is not a normative law that humans *should* follow in all contexts. It is a specific proof about the *instrumental value of information in a single-agent, fixed-utility framework.* It proves that if you care only about outcomes, and information costs nothing, and information doesn't hurt your feelings, and information doesn't change the rules of the game... then you should look.

  But those are massive "ifs."

  When people avoid genetic tests, they are not failing to maximize instrumental utility. They are maximizing emotional utility. When they avoid spoilers, they are protecting experiential utility. When societies limit certain data (like genetic insurance discrimination), they are protecting strategic utility.

  **Here is your conclusion:** Good's Theorem is airtight, but it is almost never the right thing to say to an information-avoider. The theorem describes the rationality of a robot optimizing a function; information avoidance reveals the rationality of a human optimizing a life. To call avoidance "irrational" is to insist that the only thing that matters is the final outcome, ignoring that for humans, the state of not-knowing is often a vital part of the well-being we are trying to maximize. We do not avoid information because we are bad at math. We avoid it because the math, as Good wrote it, leaves out the cost of the truth.
