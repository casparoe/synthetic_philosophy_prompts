      *Wait, one nuance:* Marcus says "Lying requires saying something false." In the case, the hiker said "Take the right fork." That is an imperative, not a declarative. However, it implies the proposition "The right fork leads to the summit." Marcus treats this as "saying something false." Since the right fork *did* lead to the summit, the implied proposition was *true*. So Marcus's premise holds for the case. Elena says the definition doesn't include worldly falsehood. This is accurate to *De Mendacio*. Okay, the logic holds.

      *Another nuance:* Marcus (3) says "I'm not disputing [blameworthiness]." This is a crucial concession. It means the moral stakes are lowered, making his argument purely semantic/conceptual. Elena (4) points out that even legal categories (murder) rely on internal states. This is a very strong counter.

