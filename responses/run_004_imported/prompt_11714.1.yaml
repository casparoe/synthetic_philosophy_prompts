      *   **H.L.A. Hart:** Follows Mill's Harm Principle. Law should only prevent harm to others. Distinguishes *positive morality* (what people happen to believe) from *critical morality* (rational ethical principles). Warns against enforcing mere prejudice or disgust. However, Hart *did* allow for some paternalism (preventing people from harming themselves), which complicates the Wackenheim case (where the state says "you harm your own dignity").

  3.  **Analyze the Case (Wackenheim v. France):**
      *   *Facts:* Wackenheim (little person) consented to being thrown for entertainment. Safety measures were in place.
      *   *Ban:* French authorities banned it.
      *   *Rationale:* Violation of human dignity.
      *   *Key Twist:* The state argued dignity is non-waivable. Wackenheim argued economic harm (loss of livelihood).
      *   *Relevance:* It's not just "disgust" (Devlin's old metric); it's "dignity" (modern constitutional metric). It involves consent (Hart's usual shield) but also self-harm/objectification (Paternalism).

  4.  **Drafting - Section by Section:**

