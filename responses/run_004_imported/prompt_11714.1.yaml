answer: |-
  **Setting:** *A quiet corner of a university faculty lounge, following a symposium on constitutional rights. Two legal philosophers, Julian (defending the Devlin position) and Sarah (defending the Hart position), are finishing coffee.*

  **Julian:** You looked uneasy during the Wackenheim panel, Sarah. The French courts banned a man from throwing himself across a room for a living, and you treated it like a tragedy. I see it as a vindication.

  **Sarah:** A vindication of what? The state telling a consenting adult he doesn't own his own body? Wackenheim wasn't hurting anyone. He was padded, the audience was willing, and he needed the money. The ban didn't protect him from harm; it protected the *spectators* from the idea of what he was doing.

  **Julian:** Precisely. And that is where Devlin was right, and your strict adherence to the Harm Principle is too thin. Devlin argued that society is not just a practical arrangement for mutual safety; it is a community of ideas. If you allow the fundamental concepts of that community to be eroded, the society disintegrates. Wackenheim wasn't just selling a service; he was commodifying human dignity.

  **Sarah:** There it is. "Human dignity." It's the secular saint of modern jurisprudence, but in this context, isn't it just Devlin's "morality" in a tuxedo? Devlin argued the law could enforce shared morality because immorality threatens the social fabric. Now, we say "dignity" threatens the social fabric. It's the same disintegration thesis. You're saying that if we allow Wackenheim to toss himself, the very concept of human worth collapses for everyone else.

  **Julian:** I won't deny the lineage. Devlin would recognize the "dignity" rationale immediately. For Devlin, the limit of toleration is reached when the "reasonable man" feels intolerance, indignation, and disgust. The French Council of State and the UN Committee essentially found that the reasonable person feels indignation at a human being used as a projectile. That feeling isn't mere prejudice; it's a recognition of a shared moral bond. If we allow individuals to waive their dignity, we devalue the currency for those who cannot waive it. The bond is broken.

  **Sarah:** But whose feelings count, Julian? Devlin's "reasonable man" test is notoriously slippery. As Dworkin pressed against Devlin: how do you distinguish between a genuine moral conviction and mere prejudice? The "indignation" the public feels toward dwarf-tossing might not be a defense of universal dignity. It might be ableism. It might be a discomfort with disability that is dressed up as high-minded principle. By using "dignity" to override Wackenheim's consent, the courts aren't protecting him; they are enforcing a *positive morality*—what people happen to feel—rather than a *critical morality*—what can be rationally justified.

  **Julian:** That's a fair challenge, but it assumes the feeling is *only* prejudice. Devlin would argue that some moral intuitions are the bedrock of rational society, even if they originate in feeling. But let's look at your side. Hart conceded to Mill that the state could intervene to prevent self-harm. Paternalism is permissible.

  **Sarah:** Hart did accept a degree of paternalism, yes. Seatbelts, helmet laws. But those prevent physical injury. Here, the "injury" is metaphysical. The state is saying, "You are harming your own moral status." That moves from paternalism back into legal moralism. Hart drew a line between preventing physical harm to the self and enforcing moral codes. Wackenheim argued the ban caused him *actual* harm—economic destitution. He said, "This is my livelihood." The state replied, "Your livelihood is less important than your abstract dignity." That inverts the liberal priority.

  **Julian:** Does it? If dignity is the precondition for having rights at all, then you can't trade it for cash. Devlin's point was that the individual is not sovereign over the moral environment any more than over the physical one. If Wackenheim turns himself into an object, he undermines the subject-status of all little people, and indeed, all people. The disintegration isn't immediate, but it's real. You cannot have a rights-based society where rights are waivable commodities.

  **Sarah:** But who decides which rights are waivable? Hart worried that once you grant the state the power to enforce morality without tangible harm, you give them a blank check. In this case, the "dignity" argument functions as a veto on autonomy that is impossible to contest. Wackenheim said, "I feel dignified because I am supporting my family." The Court said, "You are mistaken." That epistemic arrogance is what Hart warned against. If the "reasonable man" feels disgust, the minority loses. Always.

  **Julian:** And if the "reasonable man" feels that certain boundaries of humanity must not be crossed, the minority must yield. That is the price of a cohesive society. You call it arrogance; I call it stewardship. Look, I grant you that "dignity" can be abused. It can be a mask for prejudice. But in this specific case, the intuition is that some things are not for sale. If you accept Hart's view strictly, you must allow Wackenheim to toss. But then you must also ask: what prevents the next step? Selling organs? Selling oneself into slavery?

  **Sarah:** Hart would say we draw the line at tangible harm or coercion. Slavery involves the permanent alienation of liberty, which creates a harm to the self that is irreversible. Dwarf-tossing is a Saturday night gig. The slippery slope is a fear, not a harm. You are asking Wackenheim to sacrifice his actual welfare—his income, his choice—to maintain a symbolic boundary for the rest of us. That treats him as a means to an end, which I thought was the violation of dignity we were trying to avoid.

  **Julian:** He is a means to an end, yes. The end being the preservation of a society where human beings are not projectiles. Devlin would say that is a legitimate legislative aim, even without proof of physical harm. The law is a teacher. By banning the act, the state teaches that dignity is inalienable.

  **Sarah:** And the lesson Wackenheim received was that the state values his symbolic dignity more than his actual survival. Hart's distinction between positive and critical morality exists precisely to stop this. Just because the majority feels that dwarf-tossing is "undignified" doesn't make it so in critical morality. If we can't separate that feeling from prejudice, we have no business codifying it.

  **Julian:** But we can never fully separate them, Sarah. Morality *is* felt. If the reasonable man feels that the fabric of human worth is being torn, the law has a duty to stitch it, even if the thread is pulled from a willing participant.

  **Sarah:** And if that stitching strangles the participant, the law has lost its legitimacy. We're left with the same stalemate we started with in the 1960s. You trust the community's moral intuition to define the boundaries of the self. I trust the self to define the boundaries, provided no one else is hurt.

  **Julian:** And Wackenheim is the casualty of that disagreement.

  **Sarah:** No. He was the casualty of the ban.

  **Julian:** *(Sighs, picking up his cup)* Perhaps. Or he was the casualty of a market that offered him no better options, in a society that couldn't decide if it valued his labor or his image more. The law just picked a side.

  **Sarah:** It picked the side of abstraction over the person.

  **Julian:** It picked the side of the community over the individual.

  *(They sit in silence for a moment, the gap between them as wide as it was in 1959.)*
