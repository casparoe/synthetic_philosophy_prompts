      *   **Hart's Turn:**
          *   Argument: Disgust isn't a principle.
          *   Positive vs. Critical Morality: Just because people *feel* it's wrong (positive) doesn't make it rationally defensible (critical).
          *   Dworkin's Point: Is this disgust or prejudice against the disabled?
          *   The Paternalism Trap: Hart allowed some paternalism, but Wackenheim is consenting. The state is saying "We know your dignity better than you."
      *   **Rebuttal (Devlin):**
          *   Counter: It's not just prejudice. It's about the *status* of humanity. If we allow people to sell their dignity, we degrade the currency for everyone. The disintegration thesis applies to the *concept* of rights, not just feelings.
      *   **Rebuttal (Hart):**
          *   Counter: That's abstract. The concrete harm is Wackenheim's poverty. You are prioritizing a metaphysical bond over a living person's welfare.
          *   Hart's Concession: I know I parted with Mill on paternalism, but this is "moralistic paternalism," which is dangerous.
      *   **Closing:** No resolution. The tension between social cohesion (Devlin) and individual liberty/welfare (Hart) remains.

  5.  **Refining the Voices:**
      *   *Devlin (let's call him "Arthur"):* Needs to sound communitarian, concerned with the fabric of society, willing to admit that "dignity" is the new "morality."
      *   *Hart (let's call him "Elizabeth"):* Needs to sound analytical, precise, concerned with the limits of state power and the danger of conflating feeling with reason.
      *   *Check:* Did I include the "disintegration thesis"? Yes. The "reasonable man"? Yes. Positive/Critical morality? Yes. Dworkin's prejudice worry? Yes. Hart's paternalism concession? Yes.

