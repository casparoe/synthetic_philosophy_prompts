answer: |-
  Here are ten interview questions designed for a high-context audience, structured to prevent stock answers and press on the specific vulnerabilities of Updateless Decision Theory (UDT). Each includes a follow-up calibrated to the defense she is most likely to offer.

  ### 1. The Normative Authority of the Prior Self
  **Question:** You've addressed the Counterfactual Mugging objection before by characterizing the refusal to pay as "your updated self trying to renegotiate a deal it already struck." But that description assumes the prior self has the normative authority to bind the updated self. Why should the version of me that knows less, and cares less about the actual world I'm currently inhabiting, have veto power over the actions of the version of me that actually has to bear the cost?

  **Follow-up:** *If she argues that rationality is defined by global optimality across the prior:* "If global optimality is the metric, aren't you just defining rationality as 'whatever UDT outputs'? I'm asking for the independent normative force. If my updated self prefers a different policy that yields higher utility in the actual world, why is it *irrational* to switch, rather than just inconsistent?"

  ### 2. The Origin of the "Updateless" Prior
  **Question:** Let's talk about embedded agency. A genuine updateless agent optimizes a policy relative to a prior before receiving any evidence. But no physical agent exists prior to their observations; we are born into a world already full of data. When you prescribe a prior for an embedded agent, are you suggesting we computationally reconstruct a hypothetical pre-evidential state, and if so, how do we non-arbitrarily select which prior to use for that reconstruction?

  **Follow-up:** *If she suggests using a universal simplicity prior (e.g., Solomonoff):* "A simplicity prior is still a choice that carries empirical implications. If two agents choose different universal priors and end up with incompatible updateless policies, does UDT offer a resolution mechanism, or is the theory fundamentally relative to an arbitrary initial seed?"

  ### 3. Ontology of Source Code Counterfactuals
  **Question:** UDT relies heavily on evaluating counterfactuals like "if my source code outputted B instead of A." In a deterministic universe, that statement is logically false. Are you claiming these counterfactuals refer to something metaphysically real about logical space, or are they merely a useful fiction for decision-making? If it's the latter, doesn't the theory collapse when the fiction conflicts with the agent's model of physics?

  **Follow-up:** *If she argues they are useful fictions for logical uncertainty:* "If it's a fiction, its utility depends on the accuracy of the logical model. If an agent has a bug in its logical reasoner and evaluates the counterfactual incorrectly, UDT prescribes a dominated strategy. Does the theory have anything to say about agents who know they might be logically confused?"

  ### 4. The Commitment Races Pathology
  **Question:** There is a concern in the literature that UDT creates an incentive for "commitment races." If being updateless gives you a strategic advantage in bargaining scenarios, agents are incentivized to lock in their policies as early as possible, potentially before they have enough information to choose wisely. Does UDT inherently reward ignorance, and how do we prevent an equilibrium where agents blindfold themselves to gain bargaining power?

  **Follow-up:** *If she suggests committing to a policy of "not committing until informed":* "That sounds like a policy choice made at the updateless stage. But if another agent commits *earlier* to a policy of 'exploiting anyone who waits,' doesn't the updateless calculus force the first agent to capitulate? Where is the stop point on the regress of pre-commitments?"

  ### 5. Logical Omniscience vs. Boundedness
  **Question:** Classic UDT formulations often assume a level of logical omniscience that bounded agents don't possess. If I can't fully compute the consequences of my policy across all logical possibilities, I can't actually be updateless in the formal sense. Is there a bounded analogue of UDT that retains the benefits without requiring infeasible compute, or is UDT strictly an idealization we can only approximate?

  **Follow-up:** *If she argues that approximation is sufficient:* "Approximations introduce error terms. In adversarial environments like the Alignment Problem, won't adversaries specifically target the gap between the ideal updateless policy and the bounded approximation? Does UDT offer robustness guarantees here, or does it brittlely fail?"

  ### 6. Multi-Agent Equilibria and Bargaining
  **Question:** In a multi-agent setting where everyone is running UDT, we run into the problem of incompatible policies. If I optimize for my prior and you optimize for yours, and our preferred equilibria don't overlap, UDT doesn't specify how to bargain. Are we forced to import a separate bargaining solution on top of the decision theory, and if so, isn't the decision theory incomplete?

  **Follow-up:** *If she claims UDT agents naturally converge on Pareto optima:* "Convergence requires coordination on *which* Pareto optimum. Without a pre-established Schelling point, two updateless agents might simply lock into conflicting policies that result in a disaster outcome. Is the selection of the Schelling point part of the decision theory or an external prerequisite?"

  ### 7. The Human Implementation Gap
  **Question:** Your work is largely formal, but you've spoken about applying this to human rationality. Humans are biologically wired to update; we feel pain and loss acutely in the present branch. Is the prescription for humans to literally try to suppress updating, or is this a theory only for AI systems we build? If it's for humans, aren't you asking for a psychological modification that fights against our reward architecture?

  **Follow-up:** *If she says it's primarily for AI:* "If it's primarily for AI, then the 'rationality' community adopting it as a personal philosophy is category-error. Should we be teaching aspiring rationalists to act *as if* they are UDT agents, and what are the risks of that pretense in social dynamics where signaling updated empathy is crucial?"

  ### 8. Corrigibility and the Shutdown Problem
  **Question:** In the alignment context, an updateless agent might resist shutdown if its prior assigns high value to completing its goal, viewing a shutdown command as just another observation to route around. How does UDT distinguish between a "counterfactual mugging" style threat that should be ignored and a legitimate corrigibility signal that should be obeyed, given both look like observations that lower expected utility?

  **Follow-up:** *If she suggests the prior should value corrigibility:* "That pushes the problem back to the prior. If the designer gets the prior slightly wrong, the updateless agent locks in that error permanently because it refuses to update on the fact that it's causing harm. Doesn't updatelessness amplify prior specification errors more than updateful theories?"

  ### 9. Time Consistency as a Terminal Value
  **Question:** You argue for time consistency as a requirement of rationality. But evolution selects for survival, not time consistency. There are environments where being dynamically inconsistent—like having hyperbolic discounting—actually protects agents from exploitation by other agents. Why should we treat time consistency as a normative ideal rather than just one possible strategy among many?

  **Follow-up:** *If she argues that inconsistent agents get money-pumped:* "Money-pump arguments assume a specific environment where the pump exists. In a one-shot environment where no external agent can observe your history, the pump doesn't exist. Is UDT only rational in a universe full of predictors, and if so, is it really a general decision theory?"

  ### 10. The "Stop Point" of Updatelessness
  **Question:** Finally, is updatelessness a binary switch or a dial? Can an agent be updateless with respect to physical observations but update on logical facts, or vice versa? If we can mix and match, don't we need a meta-theory to tell us *what* to be updateless about, and isn't that meta-theory doing the actual heavy lifting?

  **Follow-up:** *If she admits it's a dial:* "If it's a dial, then the core contribution of UDT isn't the decision rule itself, but the heuristic for setting the dial. What is that heuristic? Is it 'be updateless about anything that can be predicted,' and if so, doesn't that just collapse into CDT for unpredictable events and Evidential Decision Theory for predictable ones?"
