      *   *Question 5: Time Consistency vs. Dynamic Consistency.*
          *   *Idea:* Distinguish between wanting to be consistent and actually being consistent.
          *   *Refinement:* Ask about the cost of time consistency. Is it always worth it?
          *   *Follow-up:* Probe edge cases where time consistency is harmful.

      *   *Question 6: The "Transparent Newcomb" Variation.*
          *   *Idea:* Use a specific problem variant to test the theory.
          *   *Refinement:* Focus on the "Ghost in the Machine" aspect. If the predictor is visible, does UDT break?
          *   *Follow-up:* Ask about the implication for real-world trust.

      *   *Question 7: Interaction with CDT/Evidentialists.*
          *   *Idea:* How does UDT interact with other agents?
          *   *Refinement:* In a mixed population, does UDT get exploited?
          *   *Follow-up:* Ask about evolutionary stability.

      *   *Question 8: Normative Force/Ought.*
          *   *Idea:* Why *ought* we follow UDT?
          *   *Refinement:* Is it a descriptive theory of optimal agents or a prescriptive one for humans?
          *   *Follow-up:* If prescriptive, how do humans overcome the psychological urge to update?

      *   *Question 9: Logical Uncertainty.*
