          *   *Refinement:* How does logical uncertainty interact with the updateless prior?
          *   *Follow-up:* Ask about the limit of logical omniscience.

      *   *Question 10: The "Stop Point".*
          *   *Idea:* When do we stop being updateless?
          *   *Refinement:* Is there a horizon? Can we be updateless about some things and updated on others?
          *   *Follow-up:* Ask about the hybrid approach.

