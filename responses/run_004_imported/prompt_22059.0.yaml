      *   *Check:* Did I capture Dev's "gerrymandering" point? Yes, the utility function over histories.
      *   *Check:* Is the distinction between "coherence implies EU" and "coherence implies *simple* EU" clear? This is the crux. I need to emphasize this.
      *   *Refinement:* Make sure to mention that Mara's Move 3 essentially concedes Dev's Move 4 before he makes it, but tries to salvage the conclusion. Dev's Move 4 is about the *labeling* of the argument.

