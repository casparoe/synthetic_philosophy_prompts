answer: |-
  The hotel bar is dim, the air thick with the hum of exhausted academics decompressing. Elena, a frequentist known for her work on meta-scientific reform, swirls a glass of Cabernet. Marcus, a Bayesian cognitive modeler, nurses a whiskey. They've just come from a contentious session on Questionable Research Practices.

  **Elena:** That last talk hit close to home. The one about the "significance filter." It's exactly what I'm seeing in reviews lately. People treating $p < .05$ like a finish line they can sprint toward whenever they want.

  **Marcus:** The optional stopping example?

  **Elena:** Precisely. A researcher checks the data every twenty participants. Stops the moment $p < .05$. Reports it as a standard fixed-sample test. It's mathematically indefensible. If the null is true, and you peek enough times, you *will* cross that line. The error rate isn't 5% anymore. It's closer to 20%, maybe higher depending on the peeking frequency.

  **Marcus:** But Elena, that assumes the $p$-value is measuring the long-run error rate of the *procedure*, not the evidence in the *data*.

  **Elena:** Because the procedure *is* what guarantees the error rate. That's the social contract of frequentist inference. When I read a $p$-value, I need to know the probability of seeing data this extreme *if* the null were true and I ran this experiment many times. If you change the stopping rule, you change the sample space. You change the "many times."

  **Marcus:** That's the rub. Why should my inference about *this* hypothesis depend on data I *could* have collected but didn't? That's the Likelihood Principle. The evidence is contained entirely in the likelihood function of the observed data. The likelihood function doesn't care why you stopped. It only cares about what you observed.

  **Elena:** The Likelihood Principle is elegant, Marcus, I'll give you that. But it's detached from the consequences of being wrong. If we ignore the stopping rule, we lose the ability to calibrate our claims. If a journal publishes 100 papers where everyone peeked until significance, and we ignore the stopping rule, we accept 20 false positives instead of 5. That's not a philosophical quibble; that's a replication crisis.

  **Marcus:** But that's a critique of how frequentist methods are used as decision rules, not of how data support hypotheses. If I use a Bayes Factor, optional stopping doesn't break the math. I can check the data every day. If the Bayes Factor hits 10 in favor of the alternative, I stop. The calibration of the Bayes Factor holds, roughly, regardless of when I looked.

  **Elena:** "Roughly" is doing a lot of heavy lifting there. There are proofs that show aggressive optional stopping can bias Bayes Factors if you use certain priors, specifically if you stop when the BF favors your pet theory. But let's stick to the frequentist case, since that's what the reviewer is demanding. You can't just say "intention doesn't matter." Intention defines the sampling distribution.

  **Marcus:** Does it? Let's press on that. You say the stopping rule matters. Okay. Imagine a researcher who doesn't have a formal stopping rule. They just collect data until their grant money runs out. Or until they feel "it's enough." Or until their graduate student graduates.

  **Elena:** Those are fixed resource constraints. They're effectively fixed $N$.

  **Marcus:** Are they? What if the grant runs out *because* they saw an interim result that looked promising, so they rushed to spend the rest? What if the student graduates early because the results looked clean? The "intention" is rarely a sharp, pre-registered binary switch. It's a fuzzy cognitive process. If the validity of my $p$-value hinges on the precise mental state of the experimenter regarding when they *would* have stopped, then the $p$-value is unknowable. We can never truly know the sampling distribution because we can't read minds.

  **Elena:** That's an argument for better transparency, not for ignoring the rule. We ask researchers to pre-register. To state the plan. If they deviate, they must disclose it. If they peeked, we adjust the alpha, or we treat it as exploratory. The fact that intentions are fuzzy is a reason to tighten our protocols, not to say the protocols don't matter. If you drive through a red light, you get a ticket. It doesn't matter if you "felt like" stopping but didn't. The rule is the rule.

  **Marcus:** But in science, the "ticket" is the validity of the inference. Here's where I think we talk past each other. You view the $p$-value as a behavior control mechanism. It's a speed bump to stop people from claiming noise is signal. I view inference as an updating of belief. If I observe 50 heads in 100 tosses, the likelihood of that data is the same whether I planned to toss 100 coins or planned to toss until I got 50 heads. The data speak for themselves. Why should the counterfactual world where I kept tossing penalize the actual world where I stopped?

  **Elena:** Because science isn't just about *your* belief, Marcus. It's about public knowledge. It's about filtering. When a researcher submits a paper, they are asking the community to trust that their result isn't a fluke. The $p$-value is a warranty. If you manufacture that warranty by peeking, you've committed fraud, effectively. You've sold a 5% warranty on a product that has a 20% failure rate. The Likelihood Principle might say the evidence is the same, but the *reliability of the claim* is not.

  **Marcus:** I agree the reliability of the *claim* changes if the claim is "This procedure rarely yields false positives." But if the claim is "These data are more likely under H1 than H0," the stopping rule is irrelevant. The problem is that social psychologists use $p$-values to do both jobs. They want the evidential weight of a likelihood ratio but the error protection of a frequentist test. You can't have both without pre-commitment.

  **Elena:** So you're saying the crisis is a category error?

  **Marcus:** I'm saying that if you want to measure evidence, use a metric that obeys the Likelihood Principle. If you want to control error rates in a decision process, use a method that accounts for stopping rules. But don't use a tool designed for error control to measure evidence, and then get angry when the measurement changes based on how you gathered the data.

  **Elena:** I can concede that $p$-values are misinterpreted as evidence measures. But we are stuck in a world where they *are* the gatekeepers. In this world, if I tell a young researcher, "Stopping rules don't matter, just look at the likelihood," they will peek until $p < .05$, publish, and add to the noise. Even if *they* believe their Bayesian update is correct, the *literature* becomes polluted with false positives because the selection mechanism is biased.

  **Marcus:** That's a sociological argument, not a statistical one.

  **Elena:** Statistics in social science *is* sociology! We are managing a community of fallible humans. If the method allows humans to game the system without penalty, the system collapses. The frequentist approach forces you to declare your hand upfront. It binds you. That binding is the value.

  **Marcus:** But it binds you to a counterfactual! Look, let's meet in the middle. Suppose we accept that for *decision making*—granting tenure, approving drugs, publishing in top journals—we need error control. Then the frequentist is right: you must account for the stopping rule. But for *scientific inference*—updating our understanding of a phenomenon—the Bayesian is right: the data are what they are.

  **Elena:** So the solution isn't to say the reviewer is wrong or your co-advisor is wrong. It's that they are answering different questions. The reviewer asks: "If we let this pass, what happens to the false positive rate of the journal?" The co-advisor asks: "Given these numbers, how much should I believe the effect exists?"

  **Marcus:** Exactly. And in the specific case of your student... if they report a $p$-value, they are invoking the frequentist contract. They cannot then hide behind the Likelihood Principle when the auditor checks the books.

  **Elena:** But if they re-analyze as Bayesian?

  **Marcus:** Then they must justify their priors. And they must accept that a Bayes Factor of 3 is not the same as $p < .05$. It's a softer claim.

  **Elena:** Here is where I worry. If we tell students, "Oh, just switch to Bayesian and you can peek all you want," we might just be moving the $p$-hacking to "BF-hacking." Choosing priors until you get the result you want.

  **Marcus:** Fair. But at least with Bayes, the stopping rule doesn't mathematically invalidate the calculation. With $p$-values, the calculation is literally undefined if the stopping rule is unknown. You can't calculate a tail probability if you don't know the shape of the tail.

  **Elena:** Okay. That's the strongest point. If the stopping rule is ambiguous—like your "grant money ran out" example—the frequentist $p$-value is indeed unknowable. In that case, the frequentist must treat the result as exploratory. No asterisks. No claims of "significance." Just effect sizes and intervals, with a big disclaimer.

  **Marcus:** And the Bayesian can treat it as evidence, but with the caveat that the prior might need to be more skeptical to account for the researcher's flexibility. We can penalize flexibility in the prior, rather than in the sampling distribution.

  **Elena:** So, for the PhD student... The reviewer is right that they cannot report $p < .05$ as if it were a fixed-N design. That is mathematically false. The Type I error is inflated.

  **Marcus:** And the co-advisor is right that the *data* haven't changed, and the likelihood ratio supports the alternative regardless of the stopping. But the student cannot claim the *frequentist properties* hold.

  **Elena:** So the revision path is: Acknowledge the optional stopping. Correct the $p$-values using a correction for sequential testing—like alpha spending functions—if they want to keep the frequentist frame. Or, pivot to a Bayesian analysis, but explicitly discuss how the priors were chosen to be robust against the flexibility of the design.

  **Marcus:** And perhaps most importantly, stop pretending the two frameworks are interchangeable. They aren't. The student tried to have it both ways. They collected data like a Bayesian (updating as they went) but tested like a frequentist (claiming error control).

  **Elena:** *(Signals for the check)* That seems to be the diagnosis. They treated the $p$-value as a measure of evidence, which it isn't, and they treated the stopping rule as irrelevant, which it is for evidence but not for error rates.

  **Marcus:** It's a category error, wrapped in a methodological dispute.

  **Elena:** I'll tell the reviewer they are right about the error rate. But I'll tell my lab that they need to stop using $p$-values as if they measure truth.

  **Marcus:** And I'll tell my lab that while the Likelihood Principle holds, ignoring the social context of publication is naive. If you game the system, even legally, you still break the trust.

  **Elena:** Cheers to that.

  **Marcus:** Cheers. Now, about those priors...
