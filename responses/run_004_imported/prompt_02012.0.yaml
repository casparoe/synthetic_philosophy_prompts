      *   *Thought:* Is there *any* case Walzer allows? He suggests Britain 1940 might qualify. If that case is historically coherent, then the categories diverge. If Britain 1940 wasn't actually a supreme emergency (revisionist history), then maybe they converge. But sticking to *internal logic*, Walzer *allows* for the possibility. Anscombe *does not*. That is the structural difference.
      *   *Refinement:* Emphasize that for Anscombe, the calculation is *category error*. For Walzer, the calculation is *permissible but restricted*.

