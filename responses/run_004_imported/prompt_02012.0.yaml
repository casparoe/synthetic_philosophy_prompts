      *   *Does Walzer's bar collapse into Anscombe's?*
          *   Walzer sets the bar high (existential + imminent).
          *   Anscombe sets the bar at infinity (never).
          *   *Critique:* Some argue Walzer's "Supreme Emergency" is so rare it effectively functions as an absolute.
          *   *Counter-Critique:* The *logical space* exists. Britain 1940 is Walzer's test case. Anscombe condemns Britain 1940 just as much as Truman 1945.
          *   *Realistic Case:* Nuclear deterrence? Preventing a genocidal regime from acquiring nukes?
          *   *Walzer's own view:* He struggles with this. He admits the exemption is dangerous.
          *   *Conclusion on Divergence:* Yes, they are structurally different. The Britain 1940 case is the wedge. Anscombe says it's murder. Walzer says it's a tragic necessity (though he later expressed ambivalence).

  6.  **Drafting the Argument:**
      *   *Introduction:* Acknowledge the depth of the debate. Define the two positions clearly (Absolutism vs. Threshold Deontology/Supreme Emergency).
      *   *Anscombe's Logic:* Focus on *intention*. The DDE. Why consequences don't matter. The concept of "murder" as a descriptive moral category, not just a legal one.
      *   *Walzer's Logic:* Focus on *rights* and *community survival*. The "Supreme Emergency" criteria (Imminence + Nature of Threat). The "Dirty Hands" aspect.
