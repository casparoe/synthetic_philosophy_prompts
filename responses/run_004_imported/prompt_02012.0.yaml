          *   *Implication:* They *do* diverge.
      *   *Does Walzer collapse into Anscombe?* No, because Walzer admits the *possibility* of override. Anscombe denies the *logic* of override.
      *   *Practical Implications:* Walzer's view creates a "slippery slope" risk (leaders claiming emergency). Anscombe's view risks "moral disaster" (refusing to prevent genocide if it requires killing innocents).
      *   *Conclusion:* They are fundamentally different structures. Anscombe is about the *act*; Walzer is about the *context*. The Hiroshima agreement is a point of overlap, not identity.

