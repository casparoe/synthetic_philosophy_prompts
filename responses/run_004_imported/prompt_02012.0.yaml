answer: |-
  This is a profound disagreement that cuts to the bone of modern just war theory. You and your friend have identified the two most sophisticated frameworks for analyzing the bombings: Elizabeth Anscombe's **deontological absolutism** and Michael Walzer's **threshold deontology** (or "rights-utilitarianism").

  While both positions condemn the bombings of Hiroshima and Nagasaki, they do so for fundamentally different reasons, rooted in incompatible moral architectures. To answer your specific question: **Yes, there is a realistic case where Walzer permits what Anscombe forbids.** The two views do not collapse into one another, even if they converge on Truman. The divergence lies in how they treat the relationship between moral rules and catastrophic consequences.

  Here is a rigorous comparison of the internal logic of each view.

  ### 1. Anscombe: The Logic of Intention and Absolute Constraints

  Anscombe's argument, articulated in *War and Murder* and her pamphlet *Mr. Truman's Degree*, rests on a specific conception of human action and moral agency.

  **The Core Principle:** It is never permissible to choose to kill the innocent as a means to an end.
  For Anscombe, morality is grounded in the **intention** of the agent, not merely the physical outcome. She relies on the Doctrine of Double Effect (DDE), but she applies it more rigorously than many modern Catholics. The DDE distinguishes between effects that are *intended* (chosen as part of the plan) and effects that are *foreseen but unintended* (side effects).

  **Application to Bombing:**
  Anscombe argues that "terror bombing" (area bombing of cities) necessarily intends the death of civilians. Why? Because the mechanism of the strategy relies on their death or terror to break the enemy's will. If the civilians survived unharmed, the strategy would fail. Therefore, their death is a *means*, not a side effect.
  *   **Structure:** This is an **agent-centered constraint**. The prohibition is on *what I do*, not on *what happens*.
  *   **Role of Consequences:** Consequences are morally irrelevant to the permissibility of the act. Even if killing 10,000 innocents would save 1,000,000 innocents, the act remains murder. To calculate otherwise is to treat innocent human beings as resources to be spent, which violates their status as persons.
  *   **The "Collapse" Question:** For Anscombe, there is no "emergency" high enough to override the prohibition. The logic is binary: either you intend the death of the innocent (murder) or you do not. There is no sliding scale.

  ### 2. Walzer: The Logic of Rights and Supreme Emergency

  Walzer's argument in *Just and Unjust Wars* (specifically Chapter 16, "Supreme Emergency") starts from a similar respect for non-combatant immunity but constructs a different safety valve.

  **The Core Principle:** Non-combatant immunity is a fundamental right, but rights can be overridden in the face of catastrophic utilitarian disaster.
  Walzer grounds immunity in individual rights. However, he is not a strict deontologist. He describes his view as a "utilitarianism of ultimate values." Normally, rights trump utility. But when the threat is to the very existence of the moral community itself, the calculus shifts.

  **The Criteria for Supreme Emergency:**
  Walzer sets an incredibly high bar for overriding the prohibition, consisting of two necessary conditions:
  1.  **Imminence:** The danger must be immediate (not a distant possibility).
  2.  **Nature of the Threat:** The threat must be existential, involving the enslavement or extermination of a people, not merely military defeat or loss of sovereignty.

  **Application to Bombing:**
  Walzer argues that Britain in 1940–41 *might* have qualified for this exemption. Nazi hegemony represented an existential threat to European liberalism and the survival of the British people, and defeat was imminent. Therefore, Churchill's area bombing, while still a crime against rights, might be *excused* (Walzer often uses the language of "dirty hands"—the act remains morally stained, but the leader is not condemned for doing it).
  However, regarding Truman in 1945, Walzer agrees with Anscombe: Japan was defeated, the threat was not existential to the U.S., and thus the exemption did not apply.

  **Structure:** This is **threshold deontology**. Rules hold absolutely *until* a certain threshold of disaster is crossed.
  **The "Collapse" Question:** Walzer explicitly worries that his exemption is dangerous and could become a slippery slope. However, he insists on keeping the logical possibility open. He believes that a moral theory that forbids preventing the end of the world is itself immoral.

  ### 3. The Divergence: The Case of Britain (1940)

  This is the critical wedge that proves the two structures are not identical.

  **Anscombe's Verdict:** Anscombe condemns the British area bombing of German cities just as fiercely as she condemns Hiroshima. For her, the desperation of Britain in 1940 does not change the moral nature of the act. Intending the death of German civilians to save British civilians is still murder. The "necessity" is irrelevant to the moral classification of the act.

  **Walzer's Verdict:** Walzer tentatively suggests that the British bombing *might* have been justified (or at least excusable) under the Supreme Emergency exemption. He writes, "I want to argue that there was a time when something like [the bombing of German cities] was permissible."

  **Why this matters:**
  If Walzer's view collapsed into Anscombe's, he would have to condemn the British bombing outright. He does not. This demonstrates that Walzer's framework allows for a **consequentialist override** that Anscombe's framework structurally excludes.
  *   For Anscombe, the prohibition is **exceptionless**.
  *   For Walzer, the prohibition is **defeasible**, though the defeater is rare.

  ### 4. Does Walzer's High Bar Mimic Anscombe's Absolutism?

  You asked whether Walzer's reasoning ends up doing the same work as Anscombe's in every *plausible* case. This is a common critique: that "Supreme Emergency" is a phantom category that never actually obtains, rendering the distinction theoretical only.

  However, there are two reasons why they remain distinct in practice, not just theory:

  **A. The Logic of Deterrence and Prevention**
  Walzer's framework allows for moral reasoning about nuclear deterrence that Anscombe's forbids. Walzer has argued (in later essays) that possessing nuclear weapons for deterrence might be permissible under a "supreme emergency" logic (preventing the existential threat of totalitarian conquest), even if using them is not. Anscombe would likely view the *intent* to kill civilians inherent in deterrent threats as equally immoral. Here, Walzer's framework permits a posture of statecraft that Anscombe's forbids, based on the calculation of future catastrophe.

  **B. The Burden of Proof**
  In Anscombe's system, the debate ends once *intention* is established. If you intended civilian death, you are guilty.
  In Walzer's system, the debate shifts to the *empirical assessment of the threat*. This changes the nature of political discourse.
  *   **Anscombe:** "Did you target civilians? Yes? Then it is murder."
  *   **Walzer:** "Did you target civilians? Yes? Okay, now prove the threat was existential and imminent."
  This forces leaders to justify the *magnitude of the threat*, not just the *method of war*. While this can be abused (leaders lying about emergencies), it creates a discursive space for weighing consequences that Anscombe slams shut.

  ### 5. Conclusion: Different Architectures

  Your friend's "scrupulous consequentialism" and your "Anscombean deontology" are indeed the poles, but Walzer sits in a distinct middle position that is not merely a compromise, but a different structure.

  *   **Anscombe** offers **Moral Clarity at the cost of Catastrophe.** She preserves the integrity of the moral agent but risks allowing the world to burn rather than dirty one's hands. Her logic is: *I must not do evil, even if the world ends.*
  *   **Walzer** offers **Moral Tragedy at the cost of Clarity.** He acknowledges that leaders sometimes face choices where all options are morally hideous. His logic is: *If the world ends, morality ends with it; therefore, I may do evil to save the conditions that make morality possible.*

  **Do they converge on Hiroshima?** Yes.
  **Do they converge in principle?** No.

  There is a realistic case where they diverge: **The "Ticking Time Bomb" of Civilizational Destruction.** If a regime were on the verge of acquiring the capacity to enslave or exterminate a population globally, and the *only* way to stop them was a strike that would intentionally kill innocents:
  *   **Anscombe** forbids the strike.
  *   **Walzer** permits (or excuses) the strike.

  Walzer's bar is high, but it is not infinite. Anscombe's is. Therefore, Walzer's doctrine does not do the same work as Anscombe's. It allows for the "lesser evil" reasoning that Anscombe explicitly rejects as a corruption of moral thought. Your argument with your friend stalled because you were arguing from a **threshold** position (Walzer) against a **consequentialist** position, while you wished you were arguing from an **absolutist** position (Anscombe). The Walzer/Anscombe distinction shows that one can reject consequentialism without accepting absolutism. Walzer proves that it is possible to believe consequences *matter* without believing they *rule*.
