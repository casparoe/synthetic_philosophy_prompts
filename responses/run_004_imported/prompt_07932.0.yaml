answer: |-
  This is an exceptionally sharp objection. You have put your finger on the central underdetermination problem in the split-brain literature: **the behavioral equivalence problem.**

  If Model A (One Subject, Switching Access) and Model B (Two Subjects, Parallel Access) predict identical behavior in natural settings, and Model A explains the lab data by positing a mechanism (switching) that is by definition unreportable, then the preference for Model A looks like a metaphysical prejudice rather than an empirical conclusion.

  Here is an argument built out along the lines of your intuition, designed to challenge the Switch Model's claim to superiority, followed by the strongest counter-argument a Bayne-defender could offer.

  ---

  ### The Argument for Permanent Duality: The "Phenomenal Surplus" and the "Simultaneity" Objections

  To defeat the Switch Model, you don't need to prove there *are* two subjects definitively; you only need to show that the Switch Model pays a higher theoretical price than the Duality Model to save the phenomenon of unity. The Switch Model survives only if we assume that **consciousness requires global attentional selection.** If we reject that premise, the Switch Model collapses into Duality.

  Here are two specific prongs of attack.

  #### 1. The Argument from Phenomenal Surplus (The Zombie Hemisphere Problem)
  The Switch Model relies on a specific cognitive architecture: usually a Global Workspace Theory (GWT) framework where information becomes conscious only when selected by attention for global broadcast. In the split-brain patient, the hemispheres compete for this broadcast slot. The winner is conscious; the loser is unconscious.

  **The Objection:** The "losing" hemisphere in split-brain cases displays cognitive sophistication that arguably *entails* phenomenality.
  *   **Evidence:** The disconnected hemisphere can perform categorization tasks, solve puzzles, express emotional preferences, and even learn new associations (e.g., the right hemisphere learning to associate a specific shape with a shock).
  *   **The Duality Claim:** If a system processes information with that level of semantic depth, emotional valence, and behavioral flexibility, it is theoretically profligate to call it "unconscious." It looks like a mind. To say it is a "mind" but has "no subject" is to create a philosophical zombie inside the skull.
  *   **The Switch Model Cost:** To maintain the Switch Model, you must argue that rich, semantic, emotional processing can occur *without* a subject of experience. You are saving the "One Subject" intuition by sacrificing the link between high-level cognition and consciousness.
  *   **Why Duality Wins Here:** The Duality Model accepts the link: High-level cognition implies a subject. Since both hemispheres show high-level cognition, there are two subjects. This is more parsimonious regarding the *nature of mind*, even if it is less parsimonious regarding the *count of subjects*.

  #### 2. The Argument from Simultaneous Motor Conflict
  Bayne's Switch Model posits that the stream of consciousness switches between hemispheres. This implies a temporal sequence: Left Hemisphere (LH) is conscious at $t_1$, Right Hemisphere (RH) at $t_2$.

  **The Objection:** There are cases of **intermanual conflict** that appear truly simultaneous, not sequential.
  *   **Evidence:** Patients reporting cases where one hand buttons a shirt while the other unbuttons it, or one hand reaches for a cigarette while the other slaps it away.
  *   **The Switch Model Cost:** To explain this, the Switch Model must posit that the "switching" frequency is incredibly high—fast enough to coordinate complex, opposing motor plans without the patient noticing a flicker in agency. But motor planning is not instantaneous. For the left hand to initiate an "unbuttoning" plan, it requires a duration of processing. If the RH is only "online" for a slice of time, how does it sustain a motor intention that opposes the LH's intention which is supposedly dominant in the next slice?
  *   **Why Duality Wins Here:** If there are two streams of consciousness, there are two concurrent agents formulating concurrent motor plans. This explains the *overlap* in conflict naturally. The Switch Model has to stretch the concept of "switching" until it looks indistinguishable from "parallel processing," at which point the label "One Stream" becomes semantically empty.

  #### 3. The Parsimony Reversal
  Your intuition is correct that the preference for Unity is often a default assumption. But we can flip the parsimony argument.
  *   **Standard View:** One subject is simpler than two.
  *   **Reversed View:** One subject + *ad hoc* switching mechanism + *ad hoc* attentional gate + *explanation for why switching is unnoticeable* is more complex than Two subjects + isolated processing.
  *   **The Point:** The Switch Model is only simpler if you ignore the machinery required to make it work. If the corpus callosum is cut, the biological hardware for integration is gone. The Switch Model asks us to believe the *software* (attention) integrates them anyway. The Duality Model says: Hardware is cut, so software is cut. That is arguably the more biologically honest baseline.

  ---

  ### The Strongest Defense of the Switch Model (Bayne's Counter)

  If you present the above in your seminar, a defender of Bayne (or Bayne himself) would likely respond with the **Constitution View** and the **Inattentional Blindness Analogy.**

  #### 1. The "Subject vs. Stream" Distinction
  Bayne argues that you can have **disunity of content** without **duality of subjects.**
  *   **The Argument:** Just because information is segregated doesn't mean the *owner* of that information is segregated.
  *   **The Analogy:** Consider **inattentional blindness** in a neurotypical brain. If you are focused on a basketball game, you might not consciously see a gorilla walking through the scene. The visual cortex processes the gorilla (proven by priming effects), but you are not conscious of it.
  *   **The Application:** Bayne argues the split-brain case is just extreme inattentional blindness. The RH processes the gorilla (or the left-visual-field stimulus), but because attention is locked on the LH, the LH-subject doesn't experience it. This doesn't mean there is a *second subject* experiencing the gorilla in the RH; it just means the single subject is unaware of that data.
  *   **Why this hurts the Duality View:** It forces the Duality proponent to explain why the split-brain RH is a *subject* while the neurotypical unattended visual field is not. Both involve isolated processing. If you say the split-brain RH is a subject, are you committed to saying every unattended part of a neurotypical brain is a potential subject? (The "Homunculi" problem).

  #### 2. The Phenomenology of Unity
  The strongest card Bayne holds is the **first-person report.**
  *   **The Argument:** Split-brain patients, when asked, do not report feeling like two people. They report feeling like one person who sometimes has trouble controlling their hands or seeing things.
  *   **The Burden of Proof:** If there were two subjects, we would expect reports of internal negotiation, distinct voices, or a sense of "otherness" within the skull (as seen in Dissociative Identity Disorder). We don't get that.
  *   **The Switch Model Explanation:** The reason they don't report switching is that the *narrative self* is located in the LH (language center). When the RH is "driving," the LH (the reporter) is offline or unaware. Therefore, the LH cannot report the RH's experience. The absence of evidence for duality (no report of two selves) is evidence of absence.

  ### Summary for Your Seminar

  To synthesize this for your discussion:

  1.  **Your Core Critique:** The Switch Model is empirically underdetermined. It relies on the assumption that "Unity is the Default" to break the tie between Switching and Duality, but outside the lab, the two models are behaviorally isomorphic.
  2.  **The Duality Advantage:** The Duality Model takes the **richness of the disconnected hemisphere's processing** seriously. It treats the RH as a conscious agent rather than a philosophical zombie, and it explains **simultaneous motor conflict** without invoking unobservably fast switching rates.
  3.  **The Switch Model's Best Defense:** It rests on the **Inattentional Blindness** analogy. If we don't count unattended stimuli in normal brains as "second subjects," we shouldn't count the unattended hemisphere in split-brains as one either. To do so risks multiplying subjects infinitely in every brain.

  **The Philosophical Stalemate:**
  Ultimately, the debate comes down to the **criteria for subjecthood.**
  *   If subjecthood requires **behavioral integration**, the Switch Model wins (they act as one).
  *   If subjecthood requires **phenomenal privacy** (i.e., if there is "something it is like" to be the RH, there is a subject there), the Duality Model wins.

  Bayne tries to have it both ways by saying there is "something it is like" for the whole brain, but only one hemisphere accesses it at a time. Your job is to press him on whether that "whole brain" subject is a real entity or just a theoretical fiction used to avoid the weirdness of two minds in one head.
