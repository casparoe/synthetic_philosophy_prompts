answer: |-
  This is a classic puzzle in the philosophy of religion, and David Lewis's 1997 paper *"Do We Believe in Penal Substitution?"* is indeed the text at the center of your dinner debate. It is a short, dense, and characteristically witty piece.

  It sounds like both you and your friend captured parts of the argument but perhaps talked past each other on the specific logical moves. In particular, your first point suggests a misunderstanding of Lewis's stance: Lewis does **not** argue that the "debt of punishment" metaphor is disanalogous to literal debt in a way that makes substitution senseless. Rather, he argues the **opposite**: he claims the metaphor is *more* apt than critics admit, precisely because of how we treat fines.

  Here is a reconstruction of Lewis's argument, broken down by your three specific questions.

  ### 1. The "Debt of Punishment" Metaphor
  You asked why Lewis thinks the metaphor is disanalogous in a way that makes substitution senseless. Actually, Lewis's primary target is the skeptic who claims exactly that.

  The standard objection to Penal Substitutionary Atonement (PSA) is that punishment is essentially personal. If I commit a crime, *I* must serve the time. To punish someone else is a category error; it's not like a financial debt where a third party can step in and pay the balance. The skeptic says: "Punishment isn't a debt; it's a personal liability."

  Lewis challenges this by pointing out that we **do** treat certain punishments as transferable debts. Specifically, he points to **fines**.
  *   When you are fined for parking illegally, the state imposes a monetary penalty.
  *   If a friend pays that fine for you, the state accepts the money and considers the punishment discharged.
  *   You do not go to jail for non-payment if your friend pays.
  *   The legal liability is satisfied by the third party.

  Lewis argues that if punishment were *essentially* non-transferable (as the skeptic claims), we would not allow this. The fact that we do allow it suggests that the "debt" metaphor is not a mere figure of speech; in the case of fines, punishment *is* treated as a transferable debt. Therefore, the claim that penal substitution is *logically incoherent* or *conceptually impossible* is false. We do it all the time.

  **The Nuance:** Lewis does acknowledge a disanalogy between fines and imprisonment. We do not allow a friend to serve your prison sentence. However, he argues this is a difference in *degree* and *kind of punishment*, not a difference in the *principle of justice*. If substitution is permissible for fines (which are punishments), then substitution is not inherently unjust. The skeptic cannot say substitution is *always* unjust; they must explain why it is okay for fines but not for divine judgment.

  ### 2. The Two Defenses of the Fine Analogy
  You correctly recalled that Lewis anticipates two obvious ways a skeptic might try to wiggle out of the fine analogy. He rejects both vigorously.

  **Objection A: "Fines aren't really punishment; they're just fees."**
  *   **The Skeptic's Move:** A critic might say, "A parking fine is just a price for parking. It's a fee for service, not a moral punishment. That's why someone else can pay it. Real punishment (like prison or divine wrath) is moral and personal."
  *   **Lewis's Rebuttal:** Lewis calls this "verbal evasion." Fines are imposed for *violations*, not for services. They are intended to deter and to penalize wrongdoing. If I park in a handicapped spot without a permit, I am not "buying" the right to park there; I am being punished for breaking the law. The moral quality of the act matters. If fines were merely fees, we would allow people to pre-purchase the right to park illegally (e.g., "I'll pay $100 now to park here illegally tomorrow"). We don't allow that. We only allow payment *after* the violation as a penalty. Therefore, fines are genuinely punitive, and the substitution is genuinely penal.

  **Objection B: "We only allow it because we can't stop it."**
  *   **The Skeptic's Move:** "Okay, maybe fines are punishment. But we only let friends pay them because it's impractical to check the source of every check or cash payment. It's a loophole, not a moral endorsement. God, however, can check the source, so He wouldn't allow it."
  *   **Lewis's Rebuttal:** This is Lewis's strongest point. He argues that if society truly believed third-party fine payment was morally abhorrent (a violation of justice), we would make it illegal and enforce that prohibition vigorously.
  *   **The Bribery Comparison:** Lewis compares it to bribery. We consider bribery morally repugnant. Consequently, we have strict laws against it, and we put significant effort into detecting and punishing it. We don't say, "Well, we can't stop people from slipping envelopes under tables, so we tolerate it." We stop it because we hate it.
  *   **The Conclusion:** The fact that we *don't* criminalize third-party fine payment indicates that we don't find it morally repugnant. We tolerate it not because we are powerless to stop it, but because we see no injustice in it. Therefore, the "impracticality" defense fails. We accept the principle of substitution in this case.

  ### 3. Lewis's Actual Conclusion (The Ambivalence)
  This is where your recollection is sharpest. Lewis does **not** conclude that Penal Substitutionary Atonement is therefore *true*, nor does he conclude that it is *false*. He also doesn't claim he has refuted all objections to Christianity.

  His conclusion is strictly about the **logical coherence** of the doctrine and the **consistency** of the skeptic.

  1.  **Against the "Incoherence" Objection:** Lewis concludes that the common atheistic/secular objection—that PSA is *logically impossible* or *inherently unjust by definition*—is refuted. Since we practice penal substitution in our own legal system (via fines), it cannot be inherently unjust. To claim it is unjust in the theological case requires a specific argument about why divine punishment differs from civil fines, not a blanket claim that "substitution is always wrong."
  2.  **The Charge of Hypocrisy:** Lewis argues that secular critics who balk at the Atonement while accepting fine-substitution are being inconsistent. As the title suggests, *"Do We Believe in Penal Substitution?"* His answer is "Yes, we do," at least in our civil practices.
  3.  **Theological Agnosticism:** Lewis does not claim this proves Christianity. He acknowledges that there may be other objections to PSA (e.g., does it actually solve the problem of sin? Is it fitting for God?). He merely removes the specific objection that it is *unjust* or *impossible*.
  4.  **The Limit of the Analogy:** Lewis remains ambivalent about whether the analogy fully holds for *eternal* punishment or *spiritual* guilt. He notes that while fines are transferable, prison sentences are not. He leaves open the question of whether divine judgment is more like a fine (transferable) or prison (non-transferable). He suggests that if God accepts Christ's sacrifice, it is analogous to the state accepting a friend's payment of a fine: the authority (God/State) has the right to decide whether to accept a substitute.

  ### Summary for Your Debate
  To settle the argument with your friend:

  *   **You were right** that Lewis is nuanced and doesn't simply say "Christianity is proven." He limits his scope to the logical coherence of substitution.
  *   **Your friend was right** that Lewis charges the skeptic with hypocrisy regarding fines. Lewis explicitly argues that we *do* accept penal substitution in everyday life.
  *   **Correction on Point 1:** You both need to adjust your understanding of the "debt" metaphor. Lewis argues that the skeptic claims punishment isn't a transferable debt, but Lewis uses the fine system to show that, in practice, we treat it as one.

  **The Verdict:** Lewis's essay validates your friend's claim that the *standard objection* (that substitution is inherently unjust) is weak, because our own practices contradict it. However, it validates your caution that this doesn't automatically make the doctrine *true* or *satisfactory* in all other respects. Lewis clears the logical hurdle, but he doesn't run the whole race for the theologian.

  If you want to press the point further, the remaining philosophical battleground isn't "Is substitution unjust?" (Lewis says no), but "Is the analogy between a parking fine and the Wrath of God strong enough to carry the theological weight?" Lewis admits that is still an open question.
