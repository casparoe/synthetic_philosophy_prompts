answer: |-
  This is a classic tension, but you're right that the standard "bite the bullet" response (Swampman has no functions) feels like a theoretical surrender. It saves the definition of function by sacrificing the phenomenon we're trying to explain.

  Here is the strongest argument an etiological theorist can make that **doesn't** dismiss the intuition and **doesn't** collapse into Cummins. It relies on shifting the locus of history from the **token organism** to the **trait type/design**.

  ### The Argument: "History of the Design, Not the Substrate"

  The core move is to argue that etiological functions attach to **trait types** (the blueprint), not merely **trait tokens** (the specific chunk of matter).

  **1. The Distinction: Token History vs. Type History**
  Strict etiological accounts (like Millikan's) define function relative to a *reproducing family*. The standard Swampman objection assumes that because *Swampman the token* has no parents, his heart belongs to no reproducing family.
  *   **The Counter:** Swampman's heart is a token of the *Human Heart Type*. The *Type* has a robust evolutionary history. The etiological account explains why *that specific structural arrangement* exists in the world. Swampman instantiates that arrangement perfectly.
  *   **The Claim:** The function is grounded in the history of the **information/structure**, not the history of the **atoms**. The lightning strike didn't select the heart; it *copied* a design that was selected. The "selectedness" is a property of the *pattern*, which Swampman bears.

  **2. Preserving Normativity (The SE Advantage)**
  This is where you avoid sliding into Cummins. Cummins-style accounts struggle with **malfunction**. If Swampman's heart pumps blood, it has the function of pumping blood. If it stops, it just loses that capacity. But we want to say it *malfunctions* (it fails to do what it *ought* to do).
  *   **The SE Win:** By anchoring Swampman's function to the history of the *Human Heart Type*, you preserve the **normative standard**. Swampman's heart *ought* to pump oxygenated blood because that is what the *type* was selected for. If Swampman's heart pumps deoxygenated blood (even if it keeps him alive via some weird swamp chemistry), the etiological account can correctly label this a **malfunction** relative to the design history.
  *   **Why CR fails here:** A causal-role account might say, "Well, if it keeps Swampman alive, that's its function." The etiological account says, "No, the *design* is for oxygenation; if he survives on deoxygenated blood, he's surviving *despite* his heart's function, not *because* of it."
  *   **Result:** You validate Swampman's function (yes, it pumps) without losing the SE superpower (explaining why pumping *wrong* is a failure).

  **3. The "Dispositional Lineage" Move**
  To seal the deal, argue that Swampman is not history-less; he is **history-laden dispositionally**.
  *   Upon creation, Swampman is immediately capable of entering a lineage. He possesses the *mechanism* of reproduction (gametes, DNA, etc.) that was shaped by selection.
  *   The etiological theorist can argue that functional ascription is **forward-looking regarding the lineage, but backward-looking regarding the design.** Swampman counts as a member of the human lineage *in potentia* because he carries the historical artifact (the genome/phenotype) that defines the lineage.
  *   Therefore, attributing function to Swampman isn't ignoring history; it's recognizing that he is a **sudden instantiation of a historical process.** He is a "delayed expression" of human evolutionary history.

  ### How to pitch this in your piece

  Don't frame it as "Swampman is special." Frame it as **"Biology studies Designs, not just Origins."**

  The etiological account isn't embarrassed by Swampman if we clarify that **selection history is the source of the *norm*, not the *certificate of existence*.**

  *   **The Bullet-Biting View:** "No history = no function." (Too rigid, ignores that the structure *is* a historical artifact).
  *   **The Cummins View:** "Current capacity = function." (Too loose, loses the concept of error/malfunction).
  *   **The Strong Etiological View:** "The structure's history = the norm for the token."

  Swampman's heart has a function because it is a **copy of a selected effect.** The lightning strike is irrelevant to the *definition* of the part, only to the *mode of its assembly*. As long as the part derives its structure from a lineage (even via miraculous copying), it inherits the normative constraints of that lineage.

  **The Punchline:** The etiological account doesn't need to say Swampman has *no* function. It needs to say Swampman's function is **borrowed** from the lineage he mimics. This preserves the historical requirement (the function comes from the past selection of the *type*) while accommodating the intuition (Swampman's heart works and can break just like ours). It treats Swampman not as a new species with no history, but as a **historical artifact created by non-historical means.** The history is in the *blueprint*, and he's holding the blueprint.
