answer: |-
  This is a fantastic rabbit hole to fall down, and you have hit on the exact tension that makes Neurath such a haunting figure for anyone working in information design today. You're right to sense that the "repeat icons, don't scale them" rule wasn't just a stylistic preference; it was an epistemological stance.

  If you sat Otto Neurath down in front of a Bloomberg terminal, a Our World in Data dashboard, and a viral Instagram infographic about wage gaps, I suspect his reaction would be a complex mixture of **technological vindication** and **moral horror**.

  Here is how I think that conversation would go, based on his writings (particularly *International Picture Language* and his essays on "Visual Education") and the political context of Red Vienna.

  ### 1. Vindication or Collapse? (The "What")

  Neurath would be stunned by the **ubiquity**. His dream was a "visual language" that bypassed the "babel" of spoken tongues to deliver facts directly to the eye. He wanted to democratize knowledge so that a worker could see their housing conditions relative to a capitalist's without needing to parse a dense sociological treatise. In 2024, that has happened. A toddler can navigate an iPad interface; a protest sign in Santiago can be understood in Seoul via iconography. The "helper language" is now the dominant language of the public sphere.

  However, he would likely argue that the **mission has been inverted**.

  Neurath's Isotype was explicitly **anti-rhetorical**. He drew a hard line between *education* (showing the facts so people can decide) and *propaganda/advertising* (using visuals to trigger a specific emotional response or action). He famously refused to let Isotype be used for commercial advertising or partisan political campaigns, even when funding was scarce. He believed that once you use the picture to *persuade* rather than *inform*, you break the trust required for the "helper language" to function.

  If he looked at the modern "picture economy," he would see that the visual channel has been entirely captured by the rhetorical function.
  *   **Viral Bar Chart Races:** These are designed to induce anxiety or triumph (gamification of data), not calm comprehension.
  *   **Infographics:** Most are advocacy tools designed to confirm bias, not challenge it with raw statistics.
  *   **Dashboards:** While useful, they are often built for managerial surveillance or KPI optimization, not worker empowerment.

  He would likely say: *"You have built the ship I designed, but you are using it to smuggle contraband instead of grain."* The medium won, but the ethic collapsed. The "Transformer" (Marie Reidemeister's role) was there to act as a buffer between the raw statistic and the picture, ensuring no emotional coloring leaked in. Today, the "Transformer" is an algorithm optimized for engagement, which mathematically privileges outrage over accuracy.

  ### 2. Principled Criticism vs. Anachronism (The "How")

  To your second point: **No, you are not projecting.** Neurath's design rules provide absolutely principled, non-anachronistic grounds to criticize modern data viz.

  The rule about **repetition vs. scaling** is not an aesthetic quirk; it is a claim about human perception and mathematical truth. Neurath understood that if you double the linear dimensions of an icon, you quadruple its area. If that icon represents a quantity, doubling the quantity should not look like a quadrupling. He called this "visual lying."

  He wrote explicitly about this in the 1930s. He argued that the eye estimates quantity by area (or volume), not by height alone. Therefore, changing the size of a single unit introduces a variable that the viewer cannot mentally correct for.

  **Where he would criticize today:**
  *   **Pictogram Scaling:** If a modern infographic shows a rich person as a giant money bag and a poor person as a tiny money bag, where the giant bag is 5x taller but 25x the area, Neurath would call this scientifically dishonest. It triggers an emotional response disproportionate to the data.
  *   **3D Pie Charts:** The perspective distortion makes the front slices look larger than the back slices. This violates the "uniformity of sign" principle.
  *   **Truncated Axes:** While Neurath focused on icons, his commitment to "truthful relations" would condemn cutting off the Y-axis to exaggerate a trend.

  **Where he might be nuanced:**
  Neurath was a pragmatist. He knew that sometimes you have so much data that repeating an icon 10,000 times is impossible. Isotype had rules for grouping (e.g., one icon = 1,000 units). He might accept that digital interactivity (hover states that reveal exact numbers) mitigates some of the risk of visual distortion. If the *impression* is approximate but the *data* is accessible on click, he might view that as an acceptable evolution of the "Transformer" role.

  However, he would likely argue that the **first impression** matters most. If the immediate visual hit is a lie, the tooltip doesn't fix it. The "feeling" of the data has already been corrupted.

  ### 3. The Tragedy of the "Transformer"

  The most poignant part of your discovery is Marie Reidemeister's role. She wasn't just a graphic designer; she was an **epistemic gatekeeper**. Her job was to take complex, messy social reality and reduce it to a picture *without losing the truth of the relations*.

  In modern data viz, we have automated the reduction (software) but eliminated the gatekeeper. We have tools like Canva or Tableau that make it incredibly easy to violate Neurath's rules. You can drag a slider to make a bubble chart 3D in seconds. The friction that used to exist—the need for a skilled "Transformer" to manually construct the chart—acted as a speed bump against distortion.

  Neurath would likely argue that we have confused **efficiency** with **clarity**. We can produce more charts faster, but the "signal-to-noise" ratio of truth has dropped because the ethical framework (the "Vienna Method") was discarded while the aesthetic (icons and charts) was kept.

  ### Summary

  If you asked Neurath about the modern state of visual information, I think he would say:

  > *"You have succeeded in making the picture universal, but you have failed to keep it neutral. You have given everyone a voice, but you have tuned the microphones to amplify the liars. My rule about not scaling the icons was not to make the charts pretty; it was to prevent the eye from being bullied by the hand that drew them. You have built a world where the hand bullies the eye constantly, and you call it 'design'."*

  It's not anachronistic to use his rules to critique modern viz; it's actually one of the few robust ethical frameworks we have that predates the commercialization of attention. He offers a "physicalist" ethics of design: **The visual representation must have a 1:1 structural correspondence to the fact, or it is not information, it is rhetoric.**

  In an era of "fake news" and deepfakes, Neurath's insistence that the *form* of the information carries its own moral weight feels less like a 1920s relic and more like an urgent manifesto we ignored.
