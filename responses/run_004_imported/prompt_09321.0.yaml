prompt: |-
  So I'm about two-thirds into a first draft of a novel set in Roman Spain in the early 400s, right in the aftermath of the whole Priscillianist affair, and there's a subplot where a bishop asks a layman in his congregation to fake a conversion to the sect so he can inform on them from the inside. While I was digging around for background texture I ran across a footnote claiming this isn't even hypothetical — that a real correspondent of Augustine's named Consentius apparently proposed almost exactly this scheme to him, and that Augustine's reply, a treatise called Contra Mendacium, is basically his answer to "but surely lying is fine here, its for a good cause." I can't get my hands on the actual text right now and the footnote didn't say much more than that, so I don't fully trust my own secondhand version of events.

  What I actually want from you is the shape of the argument itself, not just the "lying is always a sin" bumper-sticker version I already know from his earlier book De Mendacio. Did Augustine seriously engage with Consentius's reasoning — the idea that deceiving people who are themselves supposedly committed to deceiving outsiders, in service of protecting orthodox doctrine, is a special case where the end justifies the means — and explain concretely why that reasoning fails? Or does Contra Mendacium basically just restate the absolutist position from the earlier book, dressed up in a juicier example? I'm especially interested in whether his answer here is any more extreme, or any more carefully argued, than his general position, because I want my bishop character's objection to the whole spy scheme to sound like he's actually rebutting the informant's logic point by point, rather than just quoting scripture at him.
