answer: |-
  This is a brilliant premise. Using Bentham's unpublished manuscripts gives your narrator a way to be radical without being anachronistic. You are absolutely on the right track: Bentham's argument against the sodomy laws is one of the earliest and most rigorous applications of utilitarianism to sexual morality, and it fits your 1780s timeline perfectly (he wrote the essay *Offences Against One's Self* circa 1785).

  Here is a breakdown of the specific philosophical and historical points you asked about, followed by some suggestions on how to stage this for your narrator.

  ### 1. Is the argument based on the "Principle of Sympathy and Antipathy"?
  **Yes, exactly.**

  In the *Introduction to the Principles of Morals and Legislation* (1780/1789), Bentham defines the "principle of sympathy and antipathy" as the habit of approving or disapproving of actions not because they increase or decrease happiness, but simply because the person feels like it. He calls this a "principle of caprice."

  In his unpublished writings on "paederasty" (which he uses as a blanket term for male homosexual acts), Bentham applies this directly. He argues that for a law to be justified under the **Principle of Utility**, the act must produce "mischief" (pain, harm, or negative consequence) to someone other than the actor.
  *   **The Argument:** If the act is consensual and private, there is no victim. There is no pain inflicted on a non-consenting party. Therefore, there is no "mischief."
  *   **The Conclusion:** If there is no mischief, the only reason to punish it is "antipathy"—the visceral disgust felt by the spectator or the public. Bentham argues that antipathy alone is never a sufficient ground for punishment because it is subjective and irrational.

  For your narrator, the realization shouldn't be "This is unfair," but rather "This law punishes a feeling, not a harm."

  ### 2. Does Bentham confess to feeling disgust himself?
  **Yes, but with a crucial distinction.**

  This is the nuance that will make your narrator's internal monologue sing. Bentham does not necessarily claim to be devoid of the feeling, but he refuses to let the feeling dictate the logic.

  In *Offences Against One's Self*, Bentham acknowledges that the sentiment of disgust is widespread and powerful. He writes about the "repugnance" that the act inspires in the general public. In some notes, he admits that even a philosopher might feel a "secret uneasiness" or a reflexive aversion due to upbringing.

  However, his point is **normative, not descriptive**. He is saying: *Even if I feel disgust, my disgust is not a fact about the world; it is a fact about me.* To turn that feeling into a law is to tyrannize others based on one's own spleen.

  **For your narrator:** He can admit to the reader (or in a private journal) that he feels a "shudder" or a "natural aversion" when he thinks of the act, which makes his legal conclusion even stronger. He is overcoming his own conditioning to find the truth. That is a much more compelling character arc than a hero who is effortlessly progressive.

  ### 3. Does he offer a psychological explanation for the antipathy?
  **Yes. He attributes it to three main sources:**

  1.  **Religious Dogma:** Bentham notes that the prohibition comes largely from Mosaic law and Christian tradition, not from natural reason. He argues that people confuse "sin" (offense against God) with "crime" (offense against society).
  2.  **Association of Ideas:** This is a key Lockean/Benthamite psychological concept. People associate the act with dirt, disease, or secrecy. Because the act is hidden, the imagination fills the void with monsters.
  3.  **Lack of Familiarity:** Bentham suggests that if the act were more open or understood, the antipathy would vanish. He compares it to dietary taboos (e.g., eating pork or beef) which disgust some cultures but not others. If the disgust were natural/universal, it wouldn't vary by culture.

  **For your narrator:** He can use the "Association of Ideas" argument. He can reason that his friend is the same man he has known for years; the "monster" the law sees is a projection, not the reality of the person.

  ### 4. Is the Hart-Devlin Debate a rerun of this argument?
  **Yes, almost precisely.**

  The Hart-Devlin debate (late 1950s/early 1960s) is the direct intellectual descendant of this Benthamite line of thinking.
  *   **The Context:** The Wolfenden Report (1957) recommended decriminalizing homosexual acts in private in the UK.
  *   **Lord Devlin:** Argued that society has a right to enforce a shared morality to maintain social cohesion. He believed that "private immorality" could erode the "bond of society." This is essentially the "Principle of Sympathy and Antipathy" dressed up as social preservation.
  *   **H.L.A. Hart:** Defended the Wolfenden recommendations using a Mill/Bentham framework. He argued that without harm to others, the law has no jurisdiction. He explicitly attacked the idea that society dissolves just because private morals change.

  If your narrator is reasoning like Bentham in the 1780s, he is essentially prefiguring H.L.A. Hart's arguments in *Law, Liberty, and Morality* (1963). You can safely tell your readers (via author's note) or trust your own research that this is a consistent thread in liberal legal theory.

  ### Advice for the Scene: Vocabulary and Stakes

  To keep this grounded in the 1780s and avoid "21st-century opinions in a powdered wig," pay attention to the vocabulary your narrator uses.

  **Avoid:**
  *   "Gay rights" or "identity." (These are 19th/20th-century concepts).
  *   "Consent" in the modern sexual sense. (Use "consent of the parties" in a contractual sense).
  *   "Love is love." (Too romantic/modern).
  *   "Discrimination" or "Homophobia."

  **Use:**
  *   **"Mischief":** The Benthamite term for harm. *"Where is the mischief? Who is the victim?"*
  *   **"Utility":** The public good. *"Does hanging him serve the utility of the state?"*
  *   **"Antipathy":** The feeling of disgust. *"The law is founded on antipathy, not reason."*
  *   **"Asceticism":** The belief that pleasure is bad in itself.
  *   **"The Mosaic Prohibition":** Acknowledging the religious root without validating it as civil law.
  *   **"Effeminacy" or "Irregularity":** Period terms for the behavior.

  **The Stakes:**
  Remember that Bentham *never published* this essay. He wrote "Paederasty" in the margins of his notes and kept it locked away. He feared that publishing it would destroy his reputation and his ability to work on other legal reforms.

  **This is your dramatic tension.**
  Your narrator isn't just having a philosophical breakthrough; he is realizing that to save his friend, he might have to articulate a thought that could get *him* branded as a libertine or an atheist. In the 1780s, arguing against the sodomy law wasn't just liberal; it was socially suicidal.

  **A Sample Line of Reasoning for the Narrator:**
  > "The law presumes a poison in the act. But poison kills. It leaves a corpse. I have examined the particulars: there is no force, no complaint, no injury to property or person. The only pain inflicted is by the hangman's rope. If the public cries out for blood, it is not because the act has hurt them, but because it has offended them. But since when is a offended eye a sufficient judge for the gallows? If I hang a man because his dinner disgusts me, am I a magistrate or a tyrant?"

  This approach keeps the logic strictly utilitarian and legalistic, fitting your narrator's training, while allowing the moral horror of the situation to land with full historical weight.
