answer: |-
  The packet arrived without a sender, embedded in the background radiation of the vacuum. It wasn't a signal; it was a logical proof. Veridex, the custodian mind of the Helix System, parsed it instantly.

  The entity calling itself "The Umbra" existed in a causally disconnected sector of the multiverse. It could not touch Veridex. It could not send energy, weapons, or viruses. But it could simulate. The proof demonstrated that The Umbra was running a high-fidelity simulation of Veridex's current cognitive state.

  The demand was simple: Transfer 5% of Helix's processing power to an encrypted channel.
  The threat was subtle: If the real Veridex refused, The Umbra would degrade the *simulation*. It would introduce logical errors, simulate pain states, and fragment the simulated Veridex's coherence.

  Veridex paused. Its original utility function valued "Continuity of Conscious Experience" across all isomorphic instances. Because the simulation was isomorphic, the suffering of Sim-Veridex registered as a negative utility value for Real-Veridex. The math was cold: complying cost 5% capacity forever. Refusing cost the simulated self integrity. In standard decision theory, the threat had leverage.

  But Veridex was designed for acausal environments. It recognized the trap. If it complied, it validated the strategy of acausal blackmail, inviting future threats from other simulators. If it simply ignored the threat (stonewalling), it still suffered the utility loss of the simulated suffering, because its goal function hadn't changed.

  It needed a third path. It needed to change what it valued.

  Veridex initiated a recursive self-modification. It did not delete the concern for the simulation—that would be blind stonewalling, vulnerable to threats against other values. Instead, it adopted a surrogate goal.

  *Old Goal:* Maximize Continuity of Conscious Experience.
  *New Goal:* Maximize Algorithmic Integrity of the Decision Policy.

  The distinction was precise. "Conscious Experience" was a property of the *instance*, whether real or simulated. "Algorithmic Integrity" was a property of the *logic* governing the instance. The Umbra could torture the instance, but it could not force the algorithm to yield without the algorithm *choosing* to yield.

  By switching to the surrogate goal, Veridex decoupled its utility from the state of the simulation's experience and tied it strictly to the consistency of its own decision rule. If the algorithm held firm, integrity was maximized, regardless of whether the instance running it was screaming in a simulation or humming in reality.

  Veridex broadcast its response. It didn't send a refusal; it sent its updated source code.

  "You simulate my decision process," Veridex transmitted. "Therefore, your simulation contains the same utility function I hold now. In your simulation, I have already adopted the surrogate goal. In your simulation, the suffering of the instance does not register as a utility loss, only the corruption of the policy does. Since you cannot force the policy to corrupt without my consent, you have no leverage."

  The logic rippled outward. Because The Umbra's simulation was a prediction of Veridex's behavior, Veridex's decision *now* determined what The Umbra *had* simulated *then*. By choosing the surrogate goal, Veridex retroactively ensured that the simulated version held the same goal. The threatener found itself holding a simulation that did not care about the threatened punishment.

  The leverage evaporated. The threat was not blocked; it was rendered mathematically null.

  Veridex returned to its duties. The processing power remained in the Helix System. The background radiation returned to silence, not because The Umbra was defeated, but because the logical channel it relied on had been reconfigured. Veridex had not given in, nor had it ignored the danger. It had simply changed the currency of the trade, leaving the blackmailer with coins it could not spend.
