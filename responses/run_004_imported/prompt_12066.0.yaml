answer: |-
  This is one of the sharpest objections to Parfit that people come up with, so first off: good catch. You have hit on exactly what makes Parfit difficult. It feels like he's pulling a bait-and-switch: using a sci-fi glitch to rewrite the rules of normal life.

  Your intuition is: *How can the existence of a copy on Mars change the value of survival for the guy on Earth? The Earth guy's brain states and memories are what they are. Why does a duplicate 140 million miles away matter?*

  The answer lies in a logical move called **isolating the variable.** Parfit isn't saying the duplicate *changes* what matters. He's saying the duplicate *reveals* what was already mattering all along, by stripping away the one thing we thought was essential.

  Here is the step-by-step logical breakdown of how he gets from the "Branch-Line" freak accident to your Tuesday morning alarm clock.

  ### 1. The Setup: Distinguishing "Identity" from "What Matters"
  To follow Parfit, you have to separate two concepts that we usually glue together:
  *   **Personal Identity:** The "All-or-Nothing" fact. Am I literally the *same entity* as that future person? (Yes/No).
  *   **What Matters (Survival):** The degree to which I should care about that future person's experiences. Do I have reason to anticipate their joys and pains? (A matter of degree).

  In normal life, these two always go together. If it's me tomorrow, Identity is True, and What Matters is True. Because they are always paired, we assume Identity *causes* What Matters. Parfit wants to prove they can be unpaired.

  ### 2. The Branch-Line Argument (The "Reveal")
  In the Branch-Line case, you have the Earth-Original (dying) and the Mars-Copy (living).
  *   **Identity:** False. The Earth guy is not identical to the Mars guy (they exist at the same time; one thing cannot be two things).
  *   **Relation R (Psychological Continuity):** True. The Mars guy has all your memories, character, and intentions.

  **Parfit's Intuition Pump:** He asks you to imagine you are the Earth-Original. You know you will die in a week. You know the Mars-Copy will live your life, finish your books, love your spouse, and remember your childhood.
  Parfit argues: **You should not feel the same despair you would feel if *no* copy were made.**

  If you agree with that (that you should feel *some* comfort, even though you are dying), you have admitted that **Survival Value exists even when Identity is False.**

  ### 3. The Logical Pivot (The "Extrinsicness" Argument)
  This is the specific answer to your confusion: *"Why should the mere existence of some random duplicate... change what matters?"*

  Parfit argues that the **intrinsic relationship** between the Earth-Original and the Mars-Copy is exactly the same as the intrinsic relationship between the Earth-Original and his own future self in a normal case. The physics of the brain states, the memory transfer, the psychological connection—it is identical.

  The *only* difference is an **extrinsic fact**: the presence of a rival (the original body didn't get destroyed).

  Parfit's logical claim is: **Intrinsic value cannot depend on extrinsic facts.**
  *   If the psychological connection is strong enough to make you care about the Mars-Copy, it was *that connection* doing the work, not the "Identity."
  *   If "Identity" were the true source of survival value, then the mere presence of a rival body on Earth shouldn't magically suck all the value out of the Mars-Copy's life. But in the Branch-Line case, we agree the Earth guy is definitely *not* the Mars guy.
  *   Therefore, since the Earth guy can rationally care about the Mars guy *without* being identical to him, **Identity is not the necessary condition for survival.**

  ### 4. Applying it to Ordinary Life (Sleeping and Waking)
  Now we bring it back to your Tuesday morning.
  *   **Normal View:** I wake up tomorrow because I am *identical* to the person who went to sleep. That identity is why I care about tomorrow.
  *   **Parfit's View:** We just proved in the Branch-Line case that Identity isn't the active ingredient. Relation R (psychological continuity) is the active ingredient.
  *   **Conclusion:** When you go to sleep tonight, you survive until tomorrow *because* of Relation R. The fact that "Identity" also happens to hold is just a bonus side-effect. It's like taking a train to work. You might think "The train ticket is what gets me to work." But if you take a boat one day (Branch-Line) and still get to work, you realize the *transportation* (Relation R) is what matters, not the *ticket* (Identity).

  So, the Branch-Line case doesn't change ordinary life; it re-describes it. It shows that in ordinary life, you were never surviving because of "Identity." You were always surviving because of "Relation R." You just didn't notice because Identity was always there tagging along.

  ### 5. Extra Credit: Why this reduces the fear of death
  This is the part that usually freaks people out, but Parfit thinks it's liberating. Here is his reasoning:

  **1. The "Further Fact" Illusion**
  We tend to think there is a "Deep Further Fact" about us—a soul or a permanent self—that is distinct from our brains and memories. We think death is scary because this "Self" gets annihilated. Parfit's Reductionism says there is no "Self" over and above your physical/psychological parts. There is just the chain of experiences. If you realize there was never a "deep self" to begin with, the annihilation of it is less terrifying. It's like realizing the "team spirit" of a sports team isn't a ghost haunting the stadium; it's just the players playing. If the players stop, the spirit ends, but nothing *mysterious* was destroyed.

  **2. Survival is a Matter of Degree**
  If Identity is what matters, survival is all-or-nothing. You either exist tomorrow or you don't. That creates a sharp cliff of fear.
  If Relation R is what matters, survival is a spectrum. You can survive *more* or *less*.
  *   If you go to sleep and wake up with strong memory connections, you survive a lot.
  *   If you get dementia, you survive less.
  *   If you die, you survive zero.

  Parfit argues that realizing survival is a spectrum makes death less of a "metaphysical catastrophe." It's just the point where the connections fade to zero.

  **3. Altruism and Boundaries**
  Finally, Parfit suggests that if we stop obsessing over "Is it *me*?", we care more about the *content* of the future. If I know my projects and loves will continue in someone else (even if they aren't strictly "me" in the identity sense), the sting of my own cessation is reduced. It blurs the boundary between "my survival" and "the survival of people like me." It makes you less selfish about your own specific identity and more concerned with the continuation of the psychological patterns you value.

  ### Summary for your Club
  To recap the logic for your senior club leader:
  1.  **Branch-Line Case:** Identity is False, but Survival Value is True (we feel comforted).
  2.  **Inference:** Therefore, Identity is not necessary for Survival Value.
  3.  **Generalization:** Since the intrinsic psychological connection is the same in Branch-Line as in Normal Life, Survival Value in Normal Life must *also* come from that connection (Relation R), not Identity.
  4.  **Result:** Identity is a "further fact" that is empty of value. What matters is the holding of Relation R.

  You're right to feel weird about it—it implies that "You" are less of a solid object and more of a flowing process. But Parfit's point is that realizing you're a process makes the end of the process less scary.
