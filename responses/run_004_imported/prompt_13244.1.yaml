      *   *Guide III:32 (Sacrifices):* Maimonides says God didn't command sacrifice initially because it wasn't the norm. He allowed it to redirect the impulse from idols to God. The goal is *avodah shebalev* (service of the heart/prayer). The focus is on human spiritual evolution, not animal pain.
      *   *Guide III:48 (Laws of Slaughter/Kilayim):* Here he explicitly discusses *tza'ar ba'alei chayim*. He says laws like not slaughtering mother and young are to prevent pain to the animal *OR* to prevent cruelty in the human soul. He often leans towards the latter (human moral perfection).
