      *   Highway case? Yes.
      *   Empty HOT case? Yes.
      *   No easy winner? Yes.

  *(Self-Correction Note)*: I need to make sure Fred doesn't just appeal to "phenomenal consciousness" as a brute fact, because as a Representationalist, he thinks phenomenology *is* representation. His objection to Empty HOTs must be about the *nature* of representation (you can't represent what isn't there in some causal chain). Heidi's defense must be about the *mode* of representation.

  Let's write it.

  *Name choices:* Let's go with **Mara** (HOT) and **Leo** (FOR). Sounds distinct.

  *Setting:* Campus coffee shop, post-seminar.

  *Key argument refinement:*
  Leo on Highway: It's not that the visual state wasn't conscious; it's that the *conceptual* categorization was on autopilot. The experience was generic.
  Mara on Highway: No, the surprise upon snapping back proves the absence of awareness.
  Leo on Empty HOT: You're saying I can be in pain with no nociception? That's magic.
  Mara on Empty HOT: I'm saying the "painfulness" is the awareness, not the nociception.

