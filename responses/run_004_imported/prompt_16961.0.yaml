answer: |-
  Good morning, faculty, families, and the Class of 2024.

  If you listen to most graduation speeches, they follow a very specific story arc. It's the story of the climb. We are told that for the last four years, we have been grinding, sacrificing, and enduring. We stayed up late *in order to* get the grade. We took the AP classes *in order to* boost the GPA. We endured the stress *in order to* stand on this stage today.

  The narrative is that high school was the means, and this diploma is the end. We suffered the labor so we could claim the reward.

  But I want to suggest, for a moment, that if that story were entirely true, we would have wasted our time.

  There is a line of thinking, one that I was lucky enough to encounter in a Theory of Knowledge class a few years ago, which argues that an activity only truly has meaning if it is an end in itself. In other words: if you do something only for what comes *after*, you aren't really living in the moment you're doing it. You're postponing your life.

  This philosopher argued that the model for a meaningful life isn't the adult "worker," striving for a future paycheck or a future retirement. The model is the child at play. Not because children are immature, but because when a child plays, they aren't playing to finish the game. They are playing for the sake of playing. The meaning is in the doing, not the having done.

  Look back on the last four years. If we are honest, the moments that actually defined us weren't the moments we were treating school as a job. The meaning wasn't in the bubble sheets we filled out, or the college applications we stress-edited, or the ranking we were chasing. Those were means to an end. They were necessary, perhaps, but they weren't *meaningful*.

  The meaning was in the cracks.

  It was in the lab experiment that failed spectacularly, but had us laughing until our sides hurt. It was in the debate team practice where we argued about ethics until 6 PM, not for points, but because we cared about the answer. It was in the car rides, the inside jokes, the quiet moments in the library when you actually understood a concept and felt your brain click into place.

  In those moments, we weren't working for the future. We were inhabiting the present. We were, in a sense, playing.

  As we leave here, the pressure to turn our lives into a series of means-to-ends is going to get louder. We are told to choose majors *for* the job market. To take internships *for* the resume. To work *for* the weekend. To save *for* retirement.

  If we follow that script strictly, we risk spending our entire lives waiting to live. We risk treating our twenties as a waiting room for our thirties, and our thirties as a waiting room for our forties.

  So, my charge to you is not to "work hard." You already know how to do that. My charge to you is to protect your play.

  Find the things you do not because they get you somewhere else, but because doing them feels like being alive. Whether that is in your career, your art, your relationships, or your hobbies. If you find yourself in a job that is purely instrumental, where every hour is just a transaction for a paycheck, you will find your life draining away. But if you can find the "play" within the work—the curiosity, the craft, the sheer engagement of the moment—then you reclaim the meaning.

  We are not here because we finished the race. We are here because we ran.

  To our teachers: Thank you for the tools. But especially thank you to the ones who taught us that the questions matter more than the answers. You know who you are.

  Class of 2024, let's not go out there and just build resumes. Let's go out there and build lives that don't need to be justified by what comes next. Let's stop waiting for the weekend. Let's stop waiting for the promotion. Let's stop treating today as just a stepping stone to tomorrow.

  The diploma is a piece of paper. It is a means to an end. But this moment? The sun on our faces, the people beside us, the sheer relief and joy of being here? This is not a means. This is the point.

  Don't let the future steal the present. Go play.

  Thank you.
