          *   *Draft:* Why does evolution decide what's normal?
          *   *Refinement:* Connect genetics to morality. A trait can be statistically normal but functionally terrible (e.g., susceptibility to certain diseases). Why is the *mean* the *moral mandate*?
          *   *Follow-up:* She'll say "we need a line to draw." Counter: Why draw it at the mean rather than the optimum?

      *   *Requirement 3: Germline Editing/Choosing the Baseline.*
          *   *Concept:* If we can edit embryos, "restoring" function becomes "designing" function. The baseline shifts.
          *   *Draft:* What about CRISPR babies?
          *   *Refinement:* If we can prevent a genetic disorder via germline editing, are we restoring normal or creating a new normal? If everyone does it, the "species-typical" shifts. Does the obligation shift with it?
          *   *Follow-up:* She'll say "that's eugenics/too far." Counter: If the goal is opportunity, and the new baseline offers more opportunity, why resist?

      *   *Filling the remaining 5-7 questions:*
          *   Need to attack the "Species-Typical" definition from a geneticist's POV.
          *   Need to attack the "Fair Equality of Opportunity" (FEO) link.
          *   Need to attack the "Resource Allocation" dodge.
          *   Need to address variation within populations.
          *   Need to address aging (is aging a disease?).

      *   *Question 4 (Population Variation):* Species-typical varies by ancestry. Does justice require different baselines for different groups? (e.g., sickle cell trait).
      *   *Question 5 (The "Resource Allocation" Dodge):* Directly challenge the idea that hard cases are just budget issues. If the definition is fuzzy, the theory is broken, not just the budget.
      *   *Question 6 (Aging):* Aging is species-typical. Is it unjust to let us age? If we cure aging, is it therapy or enhancement?
      *   *Question 7 (Cognitive Variation):* ADHD/Autism spectrum. Neurodiversity. Where is the "normal" function there?
