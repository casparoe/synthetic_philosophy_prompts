      *   *Core Claim:* Health care is special because it protects "normal species functioning," which is necessary for "fair equality of opportunity."
      *   *Distinction:* Therapy (restoring normal) is obligatory; Enhancement (exceeding normal) is not.
      *   *Weakness:* "Normal species functioning" is statistically defined, not morally grounded. It varies by population, environment, and time.
      *   *Defense:* When lines blur, it's a budget problem, not a definition problem.

  3.  **Drafting the Questions (Iterative Process):**

