answer: |-
  The discovery of Frege's 1924 diary by Michael Dummett remains one of the most unsettling episodes in the history of analytic philosophy. To find the architect of modern logic advocating for the stripping of Jewish political rights, the disenfranchisement of women, and the expulsion of "undesirables" forces a confrontation between the purity of the *Begriffsschrift* and the impurity of the biographical man. For decades, the standard response has been a form of charitable compartmentalization: Frege's politics were a private vice, regrettable but philosophically inert, much like a mathematician's personal sins do not invalidate their proofs. However, recent scholarship, particularly the work of Stephen D'Arcy and the earlier provocations of Hans Sluga, suggests that Frege did not merely hold these views alongside his logic; he attempted to wield his logical apparatus in their service. He worried that vague racial predicates would render antisemitic legislation unworkable and utilized his treatment of genealogical sequences to justify rights based on descent.

  This evidence compels a specific verdict: while Frege's formal theorems remain technically valid, the connection between his politics and his philosophy is not merely biographical. It demands a reassessment of the *motivations* underlying his logical project, specifically the doctrine of sharp boundaries and the claim to topic-neutrality. We cannot read Frege's demand for conceptual precision as a purely epistemic virtue once we recognize it was also deployed as a tool for social exclusion. The logic itself may survive, but the conception of logic as a "view from nowhere" is compromised.

  To defend this verdict, we must navigate the debate between Hans Sluga and Richard Mendelsohn. Mendelsohn, translating the diary, dismissed Sluga's attempt to link Frege's logic and politics as tendentious. Mendelsohn's position relies on a robust distinction between the context of discovery and the context of justification. On this view, Frege's logic is a formal system; its validity depends on consistency and soundness, not the moral character of its creator. If Frege used predicate logic to argue for racism, the error lies in the premises (e.g., that race determines political worth), not the logical machinery. Therefore, the machinery remains clean.

  There is truth to this. Frege's definition of the ancestral of a relation does not become false because he applied it to genealogy. However, D'Arcy's analysis suggests the contamination goes deeper than application. Frege's political writings reveal an anxiety about *vagueness* that mirrors his logical anxieties. In the diary, Frege complains that current antisemitic legislation is flawed because the concept "Jew" lacks a sharp boundary. This is not merely a politician complaining about legal loopholes; it is a logician complaining about ontological indeterminacy. For Frege, a concept without a sharp boundary is not a concept at all. It is a defect of thought. When this logical imperative is transferred to the social sphere, the demand for "sharp boundaries" ceases to be a neutral methodological rule and becomes an ideological drive for purity.

  This forces us to reassess the motivation behind the law of bivalence and the demand for precision in analytic philosophy's founding moment. If the horror of the "vague" is partially rooted in a horror of social mixing or political instability, then the logical demand for sharp boundaries is not purely epistemic. It is, at least in part, an aesthetic and political commitment to order and exclusion. This does not make the law of excluded middle false, but it undermines the claim that Frege's logic is entirely topic-neutral. It suggests that the "ideal" language Frege sought was idealized not just for truth-preservation, but for a specific kind of rigidity that resonates with his authoritarian politics. We must therefore teach Frege's logic not as the natural, inevitable structure of reason, but as a constructed system born of specific, historically situated anxieties about clarity and order. The formalism stands, but the foundationalism crumbles.

  This verdict becomes clearer when contrasted with the case of Martin Heidegger. The question of Heidegger's Nazism is usually taken to have a more straightforwardly affirmative answer: his politics are philosophically significant. But the nature of the significance differs fundamentally from Frege's case, and understanding this difference illuminates the specific threat Frege poses to analytic self-conception.

  Heidegger's philosophy is explicitly ontological and historical. *Being and Time* concerns *Dasein*, a being whose existence is defined by its historicity and its decisions. When Heidegger embraced National Socialism, he did so believing it was an ontological destiny for the German people. The politics entered the *content* of the philosophy. The critique of Heidegger is that his ontology of "decision" and "destiny" left no philosophical barrier against fascism; indeed, it facilitated it. The philosophy is porous to history.

  Frege's case is more insidious precisely because his philosophy claims to be impermeable to history. Fregean logic concerns abstract objects and timeless truths. It is supposed to be the one place where history, psychology, and politics cannot tread. If Frege's politics are inert, it confirms the analytic dream: logic is a sanctuary from human folly. But if D'Arcy and Sluga are right that Frege reached for his logical machinery to solve political problems, the sanctuary is breached. The danger in Frege is not that his logic *contains* fascism (as Heidegger's ontology might contain a space for it), but that the *drive* to create a perfectly rigid, ahistorical logical system was itself fueled by a reactionary desire to escape the messiness of democratic pluralism.

  In Heidegger, the philosophy is compromised because it is too historical; in Frege, the philosophy is compromised because the insistence on being *ahistorical* is a political stance. The "view from nowhere" is revealed as a view from somewhere—specifically, from the perspective of a reactionary intellectual seeking to impose order on a chaotic Weimar Republic. This makes the reassessment of Frege more difficult than Heidegger. With Heidegger, we can excise the Nazi elements as a betrayal of the early work or a failure of the later work. With Frege, the "contamination" is in the very standards of rigor we inherited. The analytic virtue of "clarity" risks becoming complicit if clarity is defined by the exclusion of the vague, the mixed, and the ambiguous, and if that definition is politically motivated.

  Therefore, the verdict must be that Frege's political writings are philosophically significant, not because they falsify his theorems, but because they demystify his motivations. We cannot treat Frege's logic as a pure gift from the gods of reason. It is a human artifact, shaped by a mind that equated logical precision with social purity. This does not mean we must abandon classical logic or the *Begriffsschrift*. To do so would be to commit the genetic fallacy. However, it does mean we must abandon the hagiography that surrounds the origins of analytic philosophy. We must recognize that the demand for sharp boundaries, while technically useful, carries an ideological weight. It is a tool that can carve nature at its joints, but it can also be used to carve up a polity.

  For a graduate seminar on the origins of analytic philosophy, this distinction is crucial. If we treat the connection as biographically damning but philosophically inert, we reinforce the myth that logic is a moral vacuum. We teach students that they can be brilliant logicians and monstrous humans, and that the two realms never touch. But if we accept that Frege's logical imperatives were entangled with his political desires, we teach a more mature lesson: that methodological choices in philosophy are never entirely neutral. The pursuit of precision is a value, and like all values, it must be examined for its costs.

  In conclusion, Frege's diary does not invalidate his logic, but it invalidates his *logicism* as a purely neutral enterprise. The connection is not inert. It requires us to read the *Begriffsschrift* with a critical eye toward its driving anxieties. Unlike Heidegger, whose philosophy collapsed under the weight of his politics because it was built on historical destiny, Frege's philosophy stands formally but loses its innocence. It stands as a testament to the power of human reason, but also to its capacity for self-deception. We may use Frege's tools, but we must do so knowing they were forged in a fire that sought to burn away the ambiguous. In analytic philosophy, where ambiguity is often the enemy, this is a warning we cannot afford to ignore. The verdict is clear: the politics are not external to the philosophy; they are the shadow cast by its highest ideals. We must work in the light, but acknowledge the shadow.
