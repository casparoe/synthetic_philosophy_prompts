answer: |-
  This is a classic problem in decision theory, and frankly, your roommate is applying a dangerously oversimplified model of rationality. What you experienced is practically a real-world version of **"Parfit's Hitchhiker,"** a famous thought experiment in philosophy and game theory.

  Here is the breakdown of why paying was the rational choice, even from a cold, calculated decision-theory perspective, and why your roommate's analysis fails.

  ### 1. Ex-Ante vs. Ex-Post Rationality
  Your roommate is arguing for **ex-post rationality** (what is optimal *after* the event has occurred). From that narrow vantage point, the service is rendered. The cost of the tow is sunk for the driver. You have the cash. Paying reduces your wealth by \$300 with no material change to your physical safety. Therefore, $Utility(Keep Cash) > Utility(Pay)$.

  However, rational agents must consider **ex-ante rationality** (what is optimal *before* the event).
  *   **The Driver's Calculation:** The driver decided to come based on the probability that you are the *type of person* who pays ex-post.
  *   **The Equilibrium:** If it were common knowledge that all rational agents defect ex-post (like your roommate suggests), the driver's rational ex-ante move would be **never to come.**
  *   **The Result:** You would be stranded.

  By paying, you validated the driver's risk assessment. But more importantly, you maintained your own status as a "cooperator." If you reason that "I will defect when I can get away with it," you must acknowledge that *everyone else will too.* If everyone reasons like your roommate, the market for trust-based emergency services collapses. You paid to maintain a social norm that you might rely on again (even if not with this specific driver).

  ### 2. Your Utility Function Includes More Than Cash
  Your roommate is assuming your utility function looks like this:
  $$U = \text{Wealth}$$

  But human utility functions actually look more like this:
  $$U = \text{Wealth} + \text{Self-Concept} + \text{Social Reputation} + \text{Absence of Guilt}$$

  You admitted the situation has been "bugging you." That is a **psychological cost.**
  *   If you hadn't paid, you would have saved \$300 but incurred a "guilt cost."
  *   For many people, the disutility of knowing they screwed over someone who helped them in a vulnerable moment outweighs \$300.
  *   If the guilt would have bothered you for years, the net present value of that anxiety could easily exceed \$300.

  Therefore, maximizing your *total* utility required paying. You didn't just buy a tow; you bought peace of mind and integrity.

  ### 3. Time Consistency and Commitment Devices
  In decision theory, a major problem is **time inconsistency** (or hyperbolic discounting).
  *   **8:00 PM (Stranded):** "I promise I will pay him." (High value on rescue).
  *   **12:00 AM (Safe in Town):** "Why should I pay?" (Low value on promise, high value on cash).

  A rational agent knows they are susceptible to this shift. To solve this, rational agents use **commitment devices**.
  *   A legal contract is a commitment device.
  *   **Your moral character was your commitment device.**

  By paying, you proved that your internal commitment device works. If you view yourself as a rational agent who operates in society, having a reputation (even just with yourself) for keeping promises makes future negotiations easier. If you defect now, you weaken your own internal commitment mechanism, making it easier to defect in higher-stakes situations later.

  ### 4. Parfit's Hitchhiker
  Since you are in a seminar, you should look up **Derek Parfit's Hitchhiker**.
  *   **Scenario:** A driver offers a hitchhiker a ride from the desert only if the hitchhiker promises to pay upon reaching the city. Once in the city, the hitchhiker has no incentive to pay. The driver knows this.
  *   **Dilemma:** If the hitchhiker is "rational" (in your roommate's sense), the driver won't pick them up, and they die in the desert.
  *   **Solution:** The only way to get the ride is to be the *kind of person* who pays even when not forced to.

  You were the hitchhiker. The driver picked you up because he sensed you weren't a standard "rational actor" in the narrow sense. By paying, you confirmed that you are a **cooperator**, not a **defector**.

  ### The Verdict
  Your roommate is applying **Homo Economicus** logic to a human situation. That model predicts that people never vote, never tip at restaurants they won't revisit, and never return lost wallets. Empirically, people do all those things because they are rational enough to know that social capital and self-integrity have value.

  You were **rationally consistent.** You recognized that the \$300 bought you more than a tow; it bought you the continued existence of a world where people help each other without contracts, and it preserved your own self-concept as an honest person.

  Don't let the seminar talk you out of your intuition. In this case, your intuition understood the game better than your roommate did.
