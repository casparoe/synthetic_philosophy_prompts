answer: |-
  Here are 10 questions designed to press your guest on the specific vulnerabilities of autonomous IBE, including the required topics and follow-ups.

  **1. The "Trenchcoat" Claim**
  You describe standard Bayesianism as "IBE wearing a trenchcoat," implying that trying to reduce explanatory virtues to priors or likelihoods is a disguise rather than a reduction. If IBE is genuinely *autonomous* and not just a heuristic for Bayesian updating, what is the logical form of the rule? If it doesn't output a probability, what exactly does it output, and how do you prevent it from clashing with probabilistic coherence when the two diverge?

  **2. Van Fraassen's "Bad Lot" Argument**
  Van Fraassen argues that IBE is fundamentally flawed because it selects the best explanation from a *contingent set* of hypotheses we happened to conceive. Being the best of a bad lot doesn't make a hypothesis true, or even probable. If the truth isn't in our menu, IBE guarantees error. How do you justify the assumption that the actual truth is currently among the available candidates without begging the question?
  *   **Follow-up:** If you reply that we have background knowledge ensuring the truth is likely in the set, is *that* background knowledge secured via IBE? If so, aren't you offering a circular, abductive defense of abduction? If not, what non-abductive foundation supports it?

  **3. Lipton's "Loveliest vs. Likeliest"**
  Peter Lipton distinguishes the "likeliest" explanation (most warranted) from the "loveliest" (most explanatory, simple, unified). You argue virtues like simplicity are truth-conducive. But history is littered with simple, unified theories that were false (e.g., circular planetary orbits, phlogiston). Why should we think the universe is obligated to satisfy our aesthetic preference for simplicity rather than being messy and disjunctive?
  *   **Follow-up:** If you argue that simplicity *has* paid off historically, doesn't that rely on a sample biased toward successful theories? How do you rule out the possibility that we are currently in a "complex neighborhood" of reality where the loveliest explanation is systematically misleading, similar to how Newtonian mechanics was lovely but false at the limits?

  **4. The Screening-Off Challenge**
  Critics like Roche and Sober argue that once you fix the evidence $E$ and the hypothesis $H$, the fact that "$H$ explains $E$" adds no additional probability to $H$. In Bayesian terms, explanatoriness is screened off by the likelihoods. If you claim IBE is autonomous, you must deny this screening-off. What is the *extra* evidential weight that "explanatoriness" provides that isn't already captured by the fit between hypothesis and data?
  *   **Follow-up:** If you say explanatoriness adjusts our *priors* rather than likelihoods, how do we access these priors without relying on the very explanatory intuitions we are trying to justify? Doesn't this just push the "trenchcoat" problem back a step, making IBE a rule for setting priors rather than an autonomous rule of inference?

  **5. The Pessimistic Meta-Induction (PMI)**
  The PMI suggests that since past "best explanations" (like caloric fluid or the crystalline sphere) were ontologically wrong, our current best explanations are likely wrong too. If IBE is the engine of scientific realism, doesn't the historical track record of IBE suggest it is a reliability hazard? How can you trust IBE to deliver truth about unobservables when its history is a history of replacement?

  **6. Observables vs. Unobservables**
  Van Fraassen accepts IBE within the realm of the observable but rejects it when leaping to the unobservable. You defend the leap. But isn't the cognitive mechanism we use to infer a cat in the garden (from meowing) the same one we use to infer electrons (from cloud chambers)? If the mechanism is the same, why should we trust it in one domain and not the other, or if we trust it in both, how do you answer the constructive empiricist who says the "explanation" stops at saving the phenomena?

  **7. Underdetermination and Ties**
  Imagine a scenario where two incompatible hypotheses are equally explanatory—they possess the same virtues of simplicity, scope, and unification. An autonomous IBE rule seems to stall here, whereas Bayesianism might differentiate based on minute probabilistic nuances. Does your view force agnosticism in cases of explanatory ties, and if so, doesn't that limit IBE's utility in high-stakes scientific theory choice where decisions must be made?

  **8. Normative vs. Descriptive**
  Are you defending IBE as a *descriptive* account of how scientists actually reason, or a *normative* account of how they *ought* to reason? If it's descriptive, cognitive science suggests humans are prone to "explanatory bias" (preferring simple falsehoods over complex truths). If it's normative, by what standard are you judging it normative if not its truth-conduciveness, which brings us back to the PMI problem?

  **9. The Cost of Autonomy**
  By insisting IBE is not Bayesian, you lose the mathematical rigor of probability theory (e.g., avoiding Dutch Books). What is the specific payoff for this loss of formal precision? Is there a specific case where a strict Bayesian calculation yields one result, autonomous IBE yields another, and you are confident IBE is the one we should follow?

  **10. Error Theory for IBE**
  Every rule of inference has failure conditions. Modus Ponens fails if premises are false; induction fails if nature isn't uniform. What is the specific failure condition for IBE? Is it possible for a hypothesis to be the *best* explanation, satisfy all virtues, and yet we be *wrong* to infer it? If you say "no," you seem dogmatic; if you say "yes," you need to explain how we identify that failure condition without already knowing the truth.
