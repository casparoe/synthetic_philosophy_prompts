      *   *Drafting Q6 (Observables vs. Unobservables):* Van Fraassen distinction. Does IBE stop at the observable?
      *   *Drafting Q7 (Competing Hypotheses):* What if two explanations are equally "good" but incompatible? (Underdetermination).
      *   *Drafting Q8 (Normative vs. Descriptive):* Are you describing how scientists think or how they *should* think?
      *   *Drafting Q9 (The "Trenchcoat" metaphor):* Return to her slogan. What's the specific mechanism Bayesianism misses?
      *   *Drafting Q10 (Future/Methodology):* How do we train IBE? Can it go wrong systematically?

  4.  **Refining and Polishing:**
      *   *Check Constraints:* Do I have 8-10 questions? Yes. Do I have the 3 specific topics with follow-ups? Yes. Is the tone right? Needs to be respectful but probing.
      *   *Refining the Follow-ups:* Make sure they aren't just "But what about..." They need to target the *mechanism* of the escape route.
      *   *Refining the Screening-Off:* This is the hardest one. Need to ensure the distinction between "explanatoriness as evidence" vs. "explanatoriness as a guide to priors" is clear, since she rejects Bayesian reductionism.
      *   *Refining PMI:* Ensure it links to IBE specifically, not just realism generally.

