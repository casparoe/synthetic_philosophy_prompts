      *   *Drafting Q4 (Screening-Off):* This is technical. Need to phrase it clearly. $P(H|E\&Expl) = P(H|E)$.
          *   *Follow-up:* If she says "Explanatoriness changes the prior," ask how we access that prior without begging the question.
