      *   *The User's Worry:* If a test can be "gamed" by a fink or mask, can we trust regulatory decisions based on those tests?
      *   *The Nurse's View:* Real labs control for these variables. It's a definition problem, not a lab problem.

  4.  **Drafting the Argument - Section by Section:**

