prompt: |-
  Okay so this has been stressing me out all week. I just got put in charge of contract negotiations with a new supplier in Vietnam, and I dont speak a word of Vietnamese. Two independent translators went over the draft agreement and came back with totally different readings of the liability clause, each one positive the other messed it up, so I had them hop on a call together to hash it out while I listened in. Only problem is one of them is way more assertive and basically steamrolled the other, and I caught myself starting to believe him more just because of that. I've got no way to read the original contract myself, so simply going with whoever "won" the call feels off. Is there an actual better way to run this kind of showdown so it tracks who's right instead of who argues harder?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is leading contract negotiations with a Vietnamese supplier.
      *   **Language Barrier:** The user does not speak Vietnamese.
      *   **Conflict:** Two independent translators provided conflicting interpretations of a critical liability clause.
      *   **Attempted Resolution:** A call was held between the translators.
      *   **Issue:** One translator was assertive/dominant, the other was passive. The user feels biased towards the assertive one but knows that's unreliable.
      *   **Goal:** Find a method to determine accuracy based on merit/evidence, not personality/assertiveness.
      *   **Stakes:** High (contract negotiations, liability clause, international supplier).

  2.  **Identify the Core Risks:**
      *   **Legal Risk:** Misinterpreting liability could lead to significant financial loss or legal exposure.
      *   **Bias Risk:** Confidence $\neq$ Competence. Assertiveness $\neq$ Accuracy.
      *   **Process Risk:** Relying solely on verbal debate without written evidence.
      *   **Cultural Nuance:** Vietnamese business culture and legal terminology might have specific connotations lost in direct translation.

  3.  **Brainstorm Solutions/Strategies:**
      *   *Immediate Fix:* Stop relying on the "shout match."
      *   *Verification:* Get a third opinion (tie-breaker).
      *   *Evidence:* Force written explanations, not just verbal claims.
      *   *Context:* Consult a legal expert in Vietnamese law, not just a language translator.
      *   *Supplier Interaction:* Ask the supplier for clarification (carefully).
      *   *Process Change:* How to manage translators better in the future.

  4.  **Develop Specific Actionable Steps:**

      *   **Step 1: Pause and Reset.** Don't sign based on the call. Acknowledge the bias.
      *   **Step 2: Shift from "Translator" to "Legal Counsel."** A linguist translates words; a lawyer interprets law. The liability clause is a *legal* issue, not just a *language* issue. Need a Vietnamese qualified attorney.
      *   **Step 3: Require Written Submissions.** Force both translators to submit a written brief. Why is their interpretation correct? Cite specific words, grammar, legal precedents? This slows down the assertive one and gives the quiet one space to think.
      *   **Step 4: The "Back-Translation" Test.** Have a third party translate the *interpretations* back to English to see if they align with the intent.
      *   **Step 5: Engage the Supplier (Strategically).** Ask open-ended questions about the clause without revealing the internal dispute. "Can you walk us through how this clause functions in practice?"
