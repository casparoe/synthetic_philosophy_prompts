      *   *The "Standing" Question:* This needs a dedicated section. Break it down into "Logical Truth" vs. "Moral Authority."
      *   *Synthesis/Advice:* What should they have done? (Focus on the future, acknowledge mutual fault).

  6.  **Refining the Tone:**
      *   Needs to be objective but empathetic.
      *   Avoid legalistic jargon where possible, but use it where helpful (e.g., *tu quoque*).
      *   Ensure the distinction between "Is the criticism true?" and "Is the critic allowed to say it?" is clear.

  7.  **Self-Correction/Review during drafting:**
