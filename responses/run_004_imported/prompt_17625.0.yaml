prompt: |-
  I'm a lay member of the policy committee that oversees the predictive-testing program at our regional clinical genetics service. I ended up in this role after my own family went through counseling and testing for Huntington's disease, and because I don't sit clearly in either of the camps the committee has split into, the chair has asked me to draft the recommendation myself rather than let either side write it. For as long as the program has existed, people have been allowed to have their blood drawn and analyzed without ever finding out the result, provided they say so in advance; this opt-out has only ever applied to conditions like Huntington's, where nothing currently changes the course of the illness, since we already return results by default whenever there is a preventive step to take, as with the hereditary cancer syndromes we also test for. A couple of the geneticists on the committee now want to abolish the opt-out entirely. Their case rests on something I had never heard of until I looked it up out of curiosity: apparently there is a genuine result in decision theory, called Good's theorem, to the effect that a rational person, reasoning in advance, can never expect to do worse on average by consulting a piece of free evidence before acting than by declining to look at it. On their reading, honoring a request not to know is simply indulging a preference that nobody could defend once they saw the mathematics clearly. Our patient advocate on the committee thinks this whole line of reasoning is beside the point for a disease nothing can be done about, and that no theorem gets to tell a person she is making a mistake by choosing not to know.

  Could you draft the short written opinion I will circulate before next month's meeting? It should recommend, concretely, whether we keep, narrow, or drop the opt-out for conditions like Huntington's where no treatment or preventive action is available, together with how any change would actually be introduced and by when. I have a nagging sense that the geneticists are asking the theorem to settle a question it was never built to answer, but I cannot yet say exactly where their argument stops working, and I would like that traced through properly rather than waved away by simply asserting that autonomy outranks decision theory. Please also give their position its strongest form, since they are not being careless people, and I do not want to hand the committee an opinion that only wins because it never met their real argument.
reasoning: |-
  Here's a thinking process that leads to the drafted opinion:

  1.  **Analyze the Request:**
      *   **Role:** Lay member of a policy committee overseeing a predictive-testing program at a regional clinical genetics service.
      *   **Background:** Personal experience with Huntington's disease (HD) counseling/testing. Neutral stance (not in either camp).
      *   **Task:** Draft a short written opinion/recommendation for the committee.
      *   **Issue:** Whether to keep, narrow, or drop the "opt-out" (right not to know results) for untreatable conditions like HD.
      *   **Conflict:**
          *   *Geneticists:* Want to abolish opt-out. Cite Good's Theorem (decision theory) arguing rational agents should always want free information.
          *   *Patient Advocate:* Wants to keep opt-out. Argues autonomy and the specific context of untreatable disease matter more than abstract theorems.
      *   **Requirements:**
          *   Concrete recommendation (keep, narrow, drop).
          *   Implementation plan (how/when).
          *   Address Good's Theorem specifically (trace where the argument stops working, don't just wave it away).
          *   Steelman the geneticists' position (give it its strongest form).
          *   Tone: Professional, thoughtful, balanced, suitable for circulation among colleagues.

  2.  **Deconstruct Good's Theorem & Its Application:**
      *   *What is Good's Theorem?* (I.J. Good, 1967). Essentially: If you are a Bayesian expected-utility maximizer, the expected value of free information is non-negative. You should never expect to be worse off by observing free evidence before making a decision.
      *   *The Geneticists' Argument:* Testing is free (in terms of data acquisition cost to the patient, arguably). Knowing the result allows for better life planning. Therefore, a rational person should always want to know. Opting out is irrational.
      *   *The Flaw/Limitation:* Good's Theorem assumes the *only* value at stake is the utility of the *decision* made based on the information. It assumes the agent cares *only* about outcomes dependent on actions taken. It does not account for the *psychological cost* of possessing the information itself (information aversion). It assumes the utility function is defined solely over external states of the world, not internal mental states regarding knowledge. In HD, the "action" space is limited (no cure). The "cost" is psychological distress. If the distress of knowing outweighs the utility of planning, the theorem's assumptions about the utility function are violated in this context.
      *   *Key Distinction:* Instrumental value of information (helps you act) vs. Intrinsic disvalue of information (causes suffering). Good's Theorem addresses the former.

  3.  **Formulate the Recommendation:**
      *   *Decision:* Keep the opt-out.
      *   *Reasoning:* Clinical ethics (autonomy, non-maleficence) outweigh abstract decision theory in this specific context. The theorem doesn't apply because the "cost" of information is part of the utility function.
      *   *Implementation:* Maintain current protocol but enhance counseling to ensure the choice is informed (not just a reflexive fear). Review date: 2 years.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Introduction:** Acknowledge the role, the gravity of the issue, and the two positions. State the purpose of the memo.
      *   **Steelman the Geneticists:** Acknowledge Good's Theorem. Explain it clearly. Validate their intent (promoting patient welfare through rational planning). It's not that they are mathematically wrong, but that the *model* doesn't fit the *human reality*.
      *   **Critique of the Theorem's Application:** This is the core intellectual heavy lifting.
          *   Good's Theorem assumes information is costless. In HD, information has a psychological cost.
          *   It assumes utility is derived from *actions* taken based on info. In HD, actions are limited.
          *   It ignores "information aversion" as a rational preference within the utility function.
          *   Conclusion: The theorem proves you shouldn't ignore free info *if* you only care about making the best decision. It does not prove you shouldn't ignore info if knowing itself causes harm.
      *   **Ethical/Clinical Context:** Autonomy isn't just "rationality" in the economic sense. It includes the right to define one's own well-being. Non-maleficence (do no harm).
      *   **Recommendation:** Retain the opt-out.
      *   **Implementation:** Strengthen the counseling process (ensure it's a stable choice), not the testing protocol. Timeline: Immediate retention, review in 24 months.
      *   **Conclusion:** Reiterate the balance between logic and care.

  5.  **Refining the Tone:**
      *   Must not sound condescending to the geneticists. They are experts.
      *   Must not sound purely emotional (like "feelings matter"). It needs to be logical.
      *   Must reflect the lay member's unique position (bridging the gap).
      *   *Self-Correction during drafting:* I initially thought about suggesting narrowing the opt-out. But the prompt asks for a concrete recommendation. Given the HD context (no cure), narrowing it seems ethically risky. Keeping it is the standard of care internationally (e.g., EHA guidelines). I will recommend keeping it but ensuring the *process* of opting out is robust.

  6.  **Addressing the "Where the Argument Stops Working" Requirement:**
      *   I need to be precise. Good's Theorem relies on the assumption that the utility function $U$ is defined over outcomes $O$. If knowledge $K$ changes the utility of the outcome (i.e., $U(O, K)$ vs $U(O)$), and $K$ brings negative utility (distress), then the expected utility of acquiring $K$ can be negative. The theorem assumes $U$ is independent of the information state itself, only the resulting action.
      *   *Simpler explanation for the memo:* The theorem calculates the value of information for *making a choice*. It does not calculate the cost of *living with the knowledge*. For HD, living with the knowledge is the primary burden.

  7.  **Final Review against Constraints:**
      *   Short written opinion? Yes.
      *   Concrete recommendation? Yes (Keep).
      *   How/When? Yes (Protocol update, 24-month review).
      *   Trace Good's Theorem limits? Yes.
      *   Steelman geneticists? Yes.

  8.  **Final Polish:** Check for clarity, empathy, and authority. (Ensure I don't sound like I'm lecturing the geneticists on math, but rather on the *application* of math to clinical reality).

  *(Self-Correction Note)*: I need to make sure I don't misrepresent Good's Theorem. It states that the expected utility of *observing* the evidence is greater than or equal to the expected utility of *not* observing it, *given that you act optimally based on that evidence*. The catch is "act optimally." If the act of knowing reduces utility directly (psychological pain), that must be factored into the cost of the observation. If the "cost" of observation is non-zero (psychological harm), the theorem's condition of "free evidence" is violated. I will focus on the "free evidence" assumption.

  Let's draft.

  *Structure:*
  1. Header.
  2. Executive Summary/Recommendation.
  3. Analysis of the Decision Theory Argument (Steelman + Critique).
  4. Clinical & Ethical Context.
  5. Implementation Plan.
  6. Closing.

  *Voice:* Professional, respectful, analytical, compassionate.

  *Key phrase to include:* "Information is not costless when the currency is psychological well-being."

  *Timeline:* Immediate effect, review in 2 years.

  *Action:* Retain opt-out.

  Let's write.
answer: |-
  **MEMORANDUM**

  **TO:** Predictive-Testing Policy Committee
  **FROM:** [Your Name], Lay Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the "Right Not to Know" for Untreatable Conditions

  **1. Recommendation**

  After reviewing the arguments presented by both the clinical genetics team and the patient advocacy representation, I recommend that the committee **retain the current opt-out provision** for predictive testing of untreatable late-onset conditions, specifically Huntington's disease (HD).

  This policy should remain in place immediately. However, I recommend we strengthen the counseling protocol surrounding the election of the opt-out to ensure the decision is stable and informed, rather than reflexive. We should schedule a formal review of this policy in 24 months to assess whether emerging disease-modifying therapies alter the risk/benefit landscape.

  **2. The Argument for Abolishing the Opt-Out**

  I want to begin by acknowledging the strength and integrity of the argument put forward by our genetics colleagues. It is not merely paternalistic; it is grounded in a rigorous mathematical framework.

  The reliance on I.J. Good's 1967 theorem on the value of information is intellectually serious. In decision theory, Good's Theorem demonstrates that for a rational agent maximizing expected utility, the expected value of free evidence is always non-negative. Put simply: if you have the opportunity to learn something relevant before making a decision, and that learning costs nothing, you should never expect to be worse off by looking.

  Applied to our context, the argument is:
  1.  Genetic test results are relevant evidence for life planning (finance, family, career).
  2.  The test is provided at no financial cost to the patient.
  3.  Therefore, a rational patient should always prefer having the evidence to not having it, as it allows for more optimized decision-making.
  4.  Allowing patients to opt out of results enables them to act against their own rational self-interest.

  This position treats the patient as a rational agent whose welfare is maximized by optimizing their choices. It challenges us to ensure we are not colluding in avoidance that harms the patient's long-term agency. This is a robust position, and it deserves more than a dismissive appeal to "feelings."

  **3. Where the Decision Theory Argument Reaches Its Limit**

  However, after consulting with decision theorists outside the committee, I have identified where the application of Good's Theorem to this specific clinical context fails. It is not that the mathematics are wrong, but that the *premises* of the theorem do not hold for Huntington's disease testing.

  Good's Theorem rests on a critical assumption: that the information itself is **costless**.

  In the abstract models used in decision theory, "cost" usually refers to resources spent to acquire the data (money, time). In our program, the financial cost is indeed zero. However, the theorem assumes the utility function is defined only by the *actions* taken after receiving the information. It does not account for the utility impact of *possessing* the information itself.

  For conditions like hereditary cancer syndromes, information leads to action (surveillance, surgery), which improves health outcomes. The psychological burden of knowing is offset by the utility of prevention.

  For Huntington's disease, there is currently no preventive action. The "action space" is limited to life planning. In this specific context, the possession of a positive result carries a direct, intrinsic psychological cost (distress, anxiety, loss of hope) that is independent of any decisions made thereafter. If we treat psychological well-being as a component of "utility"—which we must in a clinical setting—then the information is not costless.

  Once the "cost" of acquiring the information (psychological harm) exceeds the "value" of the information (optimized planning), the expected utility of testing becomes negative. Good's Theorem does not compel an agent to acquire information that carries a net negative utility. Therefore, choosing not to know is not a violation of rationality; it is a rational calculation that the cost of knowing outweighs the benefit of planning.

  **4. Clinical and Ethical Context**

  Beyond the decision theory, we must consider the clinical mandate. Our service operates under the ethical principles of autonomy and non-maleficence (do no harm).

  *   **Autonomy:** Respecting autonomy means respecting a patient's own valuation of their well-being. If a patient determines that the psychological burden of a positive result undermines their quality of life more than the uncertainty does, overriding that judgment imposes an external valuation of "rationality" upon them.
  *   **Non-Maleficence:** Forcing disclosure of an untreatable, fatal diagnosis against a patient's will risks profound psychological harm, including depression and suicidality, without the counterbalance of medical intervention.

  The patient advocate's position is correct: a theorem regarding expected utility cannot override a patient's right to define what constitutes harm to themselves.

  **5. Implementation Plan**

  To address the legitimate concerns of the genetics team regarding rash decisions, I propose the following adjustments to the current protocol, effective immediately:

  1.  **Retention of Opt-Out:** The option to have blood drawn without receiving results remains available for untreatable conditions.
  2.  **Enhanced Counseling Protocol:** We will implement a mandatory "cooling-off" period for those selecting the opt-out. This involves:
      *   A specific counseling session dedicated solely to exploring the implications of *not* knowing.
      *   Documentation that the patient understands they can change their mind and request results later (if clinically feasible), but that once the sample is analyzed, the result exists in the record.
      *   Confirmation that the choice is not driven by transient anxiety but by a stable preference.
  3.  **Review Timeline:** This policy will be automatically reviewed in **24 months**. This timeline aligns with anticipated updates in HD therapeutic trials. If a disease-modifying treatment becomes available, the "costless information" premise changes, and we may need to revisit the opt-out policy at that time.

  **6. Conclusion**

  The geneticists on this committee are right to demand that our policies be rational. But rationality in medicine must account for the whole human experience, not just the optimization of decisions. Good's Theorem tells us that information is valuable for *acting*. It does not tell us that knowledge is valuable for *living*.

  For Huntington's disease, where acting is limited and living with the knowledge is burdensome, the opt-out is not an indulgence of irrationality. It is a necessary protection of patient welfare. I urge the committee to support this recommendation.
