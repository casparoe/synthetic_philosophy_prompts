          *   Non-Euclidean systems would be seen as studying *properties of bodies* (curved surfaces), not space itself.
          *   Can they be constructed? Maybe, but they wouldn't be "Universal Geometry."
      *   *Section 3: Hilbertian Formalism.*
          *   This is the death knell for Hobbes.
          *   Removing intuition/construction removes the "cause."
          *   It turns geometry into algebra (the "scab of symbols" he hated).
          *   It separates truth from making.
      *   *Section 4: The Constructivist Silver Lining.*
          *   Mention Brouwer/Intuitionism. Hobbes is a proto-constructivist but tied to materialism.
          *   If Formalism allowed for *mental* construction (not just logical consistency), Hobbes might find a foothold, but Hilbert specifically rejected the need for intuition.
      *   *Conclusion:* Hobbes's system collapses because it requires geometry to be a branch of *physics* (kinematics). Once geometry becomes purely logical/syntactic, his criterion for certainty vanishes.

  7.  **Refining the Tone:**
      *   Ensure I'm not mocking Hobbes. Treat him as a serious philosopher.
      *   Use his terminology (*phantasm*, *conatus*, *De Corpore*).
      *   Address the specific "maker's knowledge" point.

  8.  **Self-Correction/Check during drafting:**
      *   *Did I address the "scab of symbols" quote?* Yes, link it to Formalism.
      *   *Did I address the Euclid critique?* Yes, Hobbes wanted active definitions. Hilbert gives passive/implicit definitions.
      *   *Is the distinction between Non-Euclidean and Formalism clear?* Non-Euclidean changes the axioms but keeps the intuition (mostly). Formalism drops the intuition. Hobbes hates the latter more.
      *   *Wait, would Hobbes accept Non-Euclidean as "possible"?* Only if it describes a specific physical object, not space itself. Space for Hobbes is the image of the external world, which is uniform.
      *   *Key Insight:* Hobbes's geometry is *synthetic a priori* but grounded in *material motion*. Kant later tries to save the synthetic a priori via intuition. Hilbert makes it analytic. Hobbes would side closer to Kant on intuition but reject the transcendental idealism for materialism.

  9.  **Final Polish:** Check against the prompt's specific constraints (no "crank" take, work through the views seriously). (The resulting output matches the detailed response provided previously.)
answer: |-
  This is a fantastic question because it cuts past the caricature of Hobbes as a mathematically incompetent boor and engages with him as a serious epistemologist. You are absolutely right that his feud with Wallis wasn't just about bruised ego; it was a collision between two emerging paradigms of what mathematics *is*. Wallis was proto-formalist/analytic (manipulating symbols according to rules), while Hobbes was a radical constructivist/materialist (geometry is the study of generated quantity).

  If we take Hobbes's *De Corpore* and *Examinatio et Emendatio Mathematicae Hodiernae* seriously, his epistemology rests on the principle *verum et factum convertuntur* ("the true and the made are convertible"). We have scientific knowledge (*scientia*) only of things we can cause or construct. In geometry, we construct figures by motion (point $\to$ line $\to$ plane). In politics, we construct the Commonwealth by covenant.

  Here is how a consistent Hobbesian framework would likely process Non-Euclidean geometry and Hilbertian formalism.

  ### 1. Non-Euclidean Geometry: A Category Error
  When Lobachevsky, Bolyai, and Riemann showed that you could drop the parallel postulate and generate a consistent system, Hobbes would not necessarily reject the *logic* of the derivations. He would reject the claim that this constitutes "Geometry" in the strict sense.

  For Hobbes, geometry is not just any consistent logical system; it is the study of **space**, and space is a specific *phantasm*. In *De Corpore*, he defines space as "the phantasm of a thing existing without the mind simply." It is the mental image of the external world's capacity to receive bodies. Because this phantasm is derived from our universal experience of bodies moving in the world, Hobbes believes the properties of this space are fixed and necessary.

  **The Kinematic Test:**
  Hobbes defines a straight line as the trace of a point moving "without deviation." For him, the parallel postulate isn't an arbitrary axiom; it is a necessary consequence of how motion works in universal space.
  *   **Hobbes's Critique:** He would likely argue that Non-Euclidean "geometries" are actually descriptions of **curved bodies**, not space itself. If you draw triangles on a sphere, the angles sum to more than 180°. Hobbes would say: "You haven't found a new geometry of space; you've done physics on a curved surface."
  *   **The Maker's Knowledge:** Can you construct a hyperbolic plane via simple kinematic generation in the same way you generate a Euclidean plane? Hobbes might argue that to "construct" a hyperbolic space, you are implicitly assuming a physical medium that forces lines to curve. Therefore, it belongs to *physics* (the study of specific bodies), not *geometry* (the study of universal quantity and space).

  **Verdict:** He would absorb Non-Euclidean geometry by demoting it. It becomes a branch of applied physics or the study of specific surfaces, not a rival to "Universal Geometry." It doesn't wreck his system because his system claims to describe the *necessary structure of the phantasm of space*, which he believes is uniquely Euclidean.

  ### 2. Hilbertian Formalism: The Existential Threat
  David Hilbert's *Grundlagen der Geometrie* (1899) is where Hobbes's system faces a genuine crisis. Hilbert famously remarked that one should be able to replace "points, lines, and planes" with "tables, chairs, and beer mugs" without changing the validity of the theorems. This is the antithesis of Hobbes's ontology.

  **The Loss of Construction:**
  Hobbes insists that definitions must be **genetic**. You cannot define a circle as "a set of points equidistant from a center" (a static property); you must define it as "a figure described by a line rotating around a fixed point" (a generation).
  *   **Hilbert:** Defines terms implicitly via axioms. No construction required.
  *   **Hobbes:** If you don't tell me how the object is *made* (generated by motion), you haven't given me an object. You've given me a word.

  **The "Scab of Symbols" Vindicated:**
  Hobbes hated Wallis's algebra because he felt it was manipulating symbols without keeping track of the quantities they represented. Hilbertian formalism is the ultimate realization of this. It makes mathematics a syntactic game.
  *   **Epistemological Collapse:** For Hobbes, certainty comes from knowing the **cause**. In geometry, the "cause" of a theorem is the construction of the figure. If I prove a theorem about "points" that have no definition other than their relation to axioms, I have not traced the effect back to a cause (motion). I have merely checked for logical consistency.
  *   **Truth vs. Consistency:** Hobbes would argue that Hilbert has confused **consistency** (no contradictions in symbols) with **truth** (correspondence to generated reality). For Hobbes, a system can be consistent but meaningless if it lacks a referent in motion or matter.

  **Verdict:** Hobbes would view Formalism as a regression into Scholastic sophistry. It severs the *verum et factum* link. If I didn't "make" the point (even mentally, via the concept of motion), I cannot have *scientia* of it. He would likely classify Hilbertian geometry as a sophisticated form of accounting, not philosophy or science.

  ### 3. Is there a way out for Hobbes? (The Constructivist Rescue)
  There is one avenue where Hobbes's intuition survives, though not his specific materialism.

  In the early 20th century, L.E.J. Brouwer developed **Intuitionism**, which shares Hobbes's suspicion of formalism. Brouwer argued that mathematics is a free creation of the mind, but it must be constructible in intuition. He rejected the Law of Excluded Middle for infinite sets because you can't *construct* the answer.

  **Where Hobbes aligns:**
  *   Both reject the idea that mathematical existence is guaranteed by logical consistency alone.
  *   Both insist on a mental "making" process.

  **Where Hobbes diverges:**
  *   Brouwer's construction is purely mental/temporal. Hobbes's construction is **kinematic/material**. Hobbes needs the "motion of the point."
  *   If Hobbes could loosen his materialism slightly—admitting that "construction" happens in the *imagination* (as a simulation of motion) rather than requiring a commitment to physical kinematics—he might be able to accept Non-Euclidean geometry as "constructible mental spaces."

  However, Hobbes was a thoroughgoing materialist. He believed thoughts *were* motions in the head. So, for him, a mental construction *is* a physical motion. This binds him tightly to the Euclidean phantasm. He cannot accept a "mental space" that contradicts the universal phantasm of external space, because for him, the mind is a mirror of the material world.

  ### Conclusion: The System Breaks on Formalism
  If we take Hobbes seriously, his system is robust against Non-Euclidean geometry (by reclassifying it as physics) but **fataly vulnerable to Formalism.**

  His entire claim to certainty rests on the idea that geometry is certain *because* it is the study of consequences of our own definitions/constructions.
  1.  **Non-Euclidean Geometry:** Preserves construction (mostly) but changes the axioms. Hobbes says: "You changed the definition of Space, so you aren't doing Geometry anymore, you're doing Physics." (System survives).
  2.  **Hilbertian Formalism:** Removes construction entirely. Hobbes says: "You have removed the cause. You are manipulating names without concepts." (System collapses).

  Hobbes wanted geometry to be the bridge between the human mind and the material world, secured by the fact that we replicate the world's motions in our definitions. Formalism cuts that bridge. It makes geometry a self-contained language game. For Hobbes, a language game without a referent in motion is not knowledge; it is, to use his own venomous vocabulary, mere "insignificant speech."

  So, the drama with Wallis wasn't just Hobbes being unable to keep up with new math. It was Hobbes correctly identifying that the new algebraic/analytic trend (which Wallis represented) was moving toward a formalism that Hobbes rightly sensed would evacuate the "maker's knowledge" that he considered the only source of certainty. He lost the battle, but his diagnosis of the epistemological shift was remarkably prescient.
