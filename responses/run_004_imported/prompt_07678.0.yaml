answer: |-
  **Setting:** *A quiet corner of the school library, late afternoon. Two Ethics Bowl teammates, ELENA and MARCUS, are surrounded by stacks of notes.*

  **Marcus:** Okay, let's test the "First Promise" again. Imagine two people in a state of nature. No society, no institutions, no history of language games. Person A says to Person B, "I promise to guard this pass while you sleep." Person B sleeps. Person A leaves. Did Person A do something wrong?

  **Elena:** Yes, but not because they broke a promise. They broke a trust, maybe. They were unreliable. But strictly speaking, they didn't break a *promise* because the concept didn't exist yet. It's like asking if the first person to move a wooden piece on a board committed "checkmate." Without the rules of chess, you're just pushing wood.

  **Marcus:** That feels like legalism. If I look you in the eye and intentionally create an expectation that I will do something, and I do it specifically to get you to rely on me, I've created an obligation. The "First Promise" works because the moral force comes from the *assurance*, not the social backdrop. Person A manipulated Person B's expectations. That's the harm.

  **Elena:** But how does Person B know it's an assurance and not just a prediction? If I say, "I will likely guard the pass," that's a prediction. If I say, "I promise," that's a commitment. The difference isn't in my brain, Marcus; it's in the public meaning of the words. In your "First Promise" scenario, the words have no public meaning. Person A is just making noises. You can't invoke a convention to bind yourself if the convention isn't there to be invoked.

  **Marcus:** You're assuming the obligation comes from the *word* "promise." It doesn't. It comes from the interaction. Even if Person A didn't use that specific sound, if they communicated, "You can count on me, and I am telling you this *so that* you feel safe sleeping," they have bound themselves. The obligation arises because Person B now has a reason to sleep based on Person A's say-so. If Person A leaves, they've exploited Person B's reliance. That's wrong regardless of whether they have a social rulebook.

  **Elena:** I see the appeal. It makes morality feel more immediate. But here's the problem: Without the social practice, how do we distinguish a promise from a lie or a mistake? In a established society, we know "I promise" means "I am now obligated." In the state of nature, Person B has no way to know that Person A intends to be *obligated* rather than just *optimistic*. The practice is what creates the shared understanding that these words transfer a right from the promisee to the promisor. Without that shared grammar, Person A hasn't actually given Person B a claim on them.

  **Marcus:** But isn't that shared grammar just a codification of a deeper moral truth? Think about it backwards. Suppose we have a society where the practice of promising exists, but everyone knows it's corrupt. They say "I promise," but everyone knows it's just a formality. If I sincerely assure you in that broken system, am I *not* bound because the practice is rotten? Your view seems to suggest that if the social convention collapses, the moral obligation vanishes.

  **Elena:** Not vanishes. It shifts. If the practice collapses, you can't *promise* anymore, just like you can't play soccer if everyone stops agreeing on what a goal is. But you can still *warn* someone, or *assure* them. You just lose the specific institutional power of the promise. And that's actually a strength of my view. It explains why promises are so weighty. They aren't just personal feelings; they are part of a public good. We keep promises to maintain the institution itself. If I break a promise, I'm not just hurting you; I'm chipping away at a tool everyone needs.

  **Marcus:** That's a strong point about the public good. But it makes the obligation derivative. It suggests I only owe *you* because I owe *society*. In the "First Promise" case, Person A owes Person B directly. If the obligation is only about maintaining a convention, then if Person A could break the promise secretly—without damaging the general practice—it would be permissible. That can't be right. The wrong is done to Person B, not to the abstract concept of Language or Society.

  **Elena:** I'm not saying the victim doesn't matter. I'm saying the *source* of the duty is the practice. Look, grant me this: In your "First Promise," Person A intends to bind themselves. Where does that intention get its traction? Intentions alone don't create moral facts. I can intend to be the King of France, but that doesn't make me King. I need a coronation. The social practice is the coronation. Without it, Person A is just a person with a strong intention. The "wrong" done to Person B is the disappointment, yes, but the *breach of promise* requires the rule.

  **Marcus:** But the "coronation" metaphor assumes the power comes from the crowd. I think the power comes from the relationship. When Person A says "Count on me," they are inviting Person B to hold them accountable. They are authorizing Person B to blame them if they fail. That authorization doesn't need a third party, or a history, or a rulebook. It just needs two moral agents capable of understanding reliance. If your view is right, then the very first time humans tried to cooperate, they couldn't actually obligate each other until they'd done it enough times to form a "convention." That implies morality has a lag time.

  **Elena:** (Pauses, tapping a pen) Morality *does* have a lag time, maybe. Or at least, specific *institutions* do. You're conflating "being trustworthy" with "making a promise." In the First Promise case, Person A should definitely guard the pass. If they don't, they're a bad person. But calling it a "broken promise" is anachronistic. It's like calling the first wheel "inefficient transportation." It's the prototype. The obligation to guard the pass comes from general duties of benevolence or non-harm. The *promise* adds a specific layer of entitlement—that Person B can *demand* it, not just hope for it. That entitlement requires the practice.

  **Marcus:** So you admit the duty to act exists, you just quibble over the label "promise."

  **Elena:** It's not just a label! It changes the structure of the right. If it's just benevolence, Person A can weigh other factors. "I'm tired, I'll leave." If it's a promise, Person A's desire doesn't matter; Person B has a claim. I'm saying that specific *claim* structure is a human invention, like property law. You're saying it's a natural fact, like gravity.

  **Marcus:** And I'm saying that when I intentionally induce you to rely on me, I create a claim. It's not gravity, it's... it's interpersonal physics. If I hand you a fragile object and say "Hold this," I've created a situation where dropping it is wrong, not because of a rule, but because of what I just did to you. The "First Promise" is just the verbal version of handing over the object. The convention just helps us recognize it faster.

  **Elena:** But without the convention, how do we know I didn't just say "Hold this" sarcastically? Or hypothetically? The convention is the signal that removes ambiguity. In the First Promise, the ambiguity is total. So, if Person A leaves, we can blame them for being unreliable, but we can't say they violated a specific right Person B held.

  **Marcus:** We can if Person B understood the intent. And if Person A knew Person B understood. That's enough for morality. If we wait for the convention, we're saying morality is invented, not discovered.

  **Elena:** And if we say morality is discovered in every interaction, we risk making obligations too vague. Who knows what counts as "assurance"? The practice gives us clear lines. "I promise" is the line. Before that line was drawn, there was only the fog of human interaction.

  **Marcus:** (Sighs) So we're back to the fog. You think the First Promise is incoherent. I think it's the purest form of obligation.

  **Elena:** I think it's a powerful metaphor for obligation, but logically incomplete. You need the practice to make the words work.

  **Marcus:** And I think you need the moral relationship to make the practice matter.

  **Elena:** (Smiles slightly) Well, at least we can promise to meet here tomorrow to argue about it again.

  **Marcus:** Only if the convention holds.

  **Elena:** Only if the assurance is sincere.

  *(They both pack up their bags, neither looking fully satisfied, but both nodding in acknowledgment.)*
