      *   **Vanguard's Defense:** Credibility is key. Without binding, words are cheap.
      *   **Equilibrium's Pivot:** Binding isn't the only way to be credible. Conditional commitments exist.
      *   **Vanguard's Pushback:** Conditionality is weakness. It invites exploitation.
      *   **Equilibrium's Counter-Pushback:** Rigidity invites collision.
      *   **Climax:** The transmission moment approaches. Both have to decide.
      *   **Resolution:** Ambiguous. Do they send? Do they pause? Let the reader wonder.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Is Vanguard sounding too emotional/aggressive?
