  2.  **Part 1: The Triviality Argument (Why the naive view fails)**
      *   *Concept:* Functionalism defines mental states by their causal role (input $\to$ state $\to$ output). This is isomorphic to a Finite State Machine (FSM) or Turing Machine.
      *   *The Naive Definition:* System $P$ implements Automaton $M$ if there exists a mapping $f$ from physical states of $P$ to states of $M$ such that the transitions match.
      *   *The "Rock" Argument (Putnam/Searle):*
          *   A rock has physical states (position of atoms, temperature, voltage potential, etc.).
          *   Over time $t_1, t_2, \dots$, the rock passes through a sequence of physical states $p_1, p_2, \dots$.
          *   An FSM has a sequence of states $s_1, s_2, \dots$ given some input.
          *   *The Trick:* Just map $p_1 \to s_1$, $p_2 \to s_2$, etc.
          *   *Problem:* This is post-hoc. It doesn't respect *counterfactuals*. If the input had been different, would the rock have gone to $s_3$? We don't know, and the naive mapping doesn't care. It just maps the *actual* history.
      *   *SE Analogy:* It's like saying a specific log file "implements" a program because you can map each log line to a line of code. But if you changed the input, the log wouldn't change, whereas the program would. The log lacks the *causal structure*.
