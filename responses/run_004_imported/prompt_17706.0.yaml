      *   *The Constraint:* The mapping must preserve the *transition rules*, not just the trajectory.
      *   *Mechanism:*
          1.  **Grouping:** Physical states are grouped into "state types."
          2.  **Causal Topology:** The causal relations between physical state types must mirror the formal transitions of the automaton.
          3.  **Counterfactual Support:** If the system were in physical state type $A$ (mapped to formal state $X$) and received input $I$ (mapped to formal input $J$), it *would* transition to physical state type $B$ (mapped to formal state $Y$).
      *   *Why the Rock Fails:* A rock doesn't have discrete, reliable causal transitions. If you heat it (input), it expands. But does it have a state that reliably maps to "Add 1" vs "Add 2"? No. Its physical states are not grouped in a way that supports the *conditional* logic of the FSM. The mapping is arbitrary and doesn't hold under intervention.
      *   *Why Silicon/Neurons Succeed:* They have distinct components (gates, synapses) where changing the input reliably changes the output according to the logic. The causal structure is robust.

