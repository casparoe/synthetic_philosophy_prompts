answer: |-
  This is a heartbreaking situation, and your instinct is correct: telling him to "cheer up" is not only ineffective, it can feel dismissive of the massive loss he is experiencing.

  To answer your question directly: **No, he is not right.** But his feeling is understandable.

  He is currently viewing his worth through a single lens: *physical utility.* For 50 years, his value to himself, his family, and the world was measured in what he could construct with his hands. When that ability is taken away, it feels like a lobotomy of the soul. He isn't just losing a hobby; he is losing his identity, his routine, and his primary way of interacting with the world.

  However, the belief that "a man who can't build isn't a man" is a cognitive distortion fueled by grief and likely post-stroke depression. Here is a breakdown of what is happening and how you can actually help, beyond empty comfort.

  ### 1. Acknowledge the Grief (Don't Skip This)
  Your dad is mourning a death. The "Carpenter Dad" has died. If you try to rush him to a new hobby before he has grieved the old one, he will feel misunderstood.
  *   **What to say:** Instead of "You can still do other things," try: "I know this isn't just about tools. You're mourning who you've been for 50 years. It makes sense that you feel lost."
  *   **Why it works:** It validates his pain without agreeing with his conclusion that his life is over. It shows you respect the magnitude of the loss.

  ### 2. Address the Medical Reality
  You mentioned he had a stroke. It is crucial to know that **post-stroke depression is a physiological condition,** not just a reaction to bad news. The stroke affected his brain; it can alter the chemicals that regulate mood and hope.
  *   **The Action:** His doctor needs to know he is talking like this ("wait around and die"). This isn't just grumpiness; it's a symptom. Medication or therapy specifically for post-stroke depression can lift the fog enough for him to see a future again.
  *   **The Framing:** Tell him, "The stroke affected the part of your brain that handles mood, just like it affected your hands. We need to heal that part too."

  ### 3. Redefine "Building" (From Hands to Head)
  He believes building requires steady hands. You need to help him see that *master craftsmanship* resides in the mind, not just the fingers. He has 50 years of data in his head that is at risk of being lost.
  *   **Design and Planning:** Can he draw plans? Can he sketch out projects for *you* or a grandchild to build? He becomes the Architect; you become the Builder.
  *   **Teaching:** Is there a local vocational school or a grandson who wants to learn? He can supervise. He can correct technique. He can pass on the "why," even if he can't do the "how."
  *   **Finishing Work:** Often, the dangerous tools are the cutting tools (saws, routers). Sanding, staining, varnishing, and gluing are lower risk. Can he do the finishing touches on projects you cut?
  *   **Oral History:** Record him. Sit him down with a recorder and ask, "What was the hardest build you ever did?" "What's the trick to a perfect dovetail?" "Tell me about the first house you framed." This turns his knowledge into a legacy. It proves his value is in his *knowledge*, not just his grip strength.

  ### 4. Challenge the "Manhood" Narrative
  When he says, "A man who can't build... isn't much of a man," do not let it pass unchallenged, but challenge it gently.
  *   **The Counter-Argument:** "Dad, a man's worth isn't just what he can cut. It's what he knows, what he teaches, and how he loves this family. You built this family for 50 years. That doesn't disappear because your hands shake."
  *   **Shift the Metric:** Help him find value in being the *Elder*. In many cultures, the elder is not the one doing the labor, but the one holding the wisdom. He is transitioning from the Worker to the Wise Man.

  ### 5. Practical Steps for You
  *   **Don't Argue, Ask:** When he says "I'm useless," don't say "No you're not." Ask, "What is the one thing you miss the most about the shop?" Listen to the answer. That tells you what needs to be replaced.
  *   **Small Wins:** Find a tiny, safe project. Maybe assembling a model, or whittling with a safety knife, or even just organizing the tool shop for you. He needs to feel *agency* again.
  *   **Involve Mom:** She is scared. Tell her that his anger is grief. She shouldn't try to "fix" him either. She should focus on keeping him connected to the family, not just the workshop.

  ### Summary
  He is wrong that his value is gone, but he is right that his life has fundamentally changed. He is standing on the edge of a cliff, looking down. You can't just tell him to jump and fly. You have to build a bridge.

  The bridge is built of **validation** (this sucks), **medical support** (treat the depression), and **legacy work** (your hands might be done, but your knowledge is vital).

  He spent 50 years building things for others. Now, the family has to build a new purpose for him. It takes time, but please tell your mom: **This is not the end of him. It is a painful transition.** With the right support, he can find a new way to be a craftsman, even without the tools.
