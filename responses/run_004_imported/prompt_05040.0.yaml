  *(Self-Correction Note)*: I need to be careful not to dismiss the friend's view entirely. The friend's view (social trust) *is* in Augustine, especially in *Contra Mendacium*. The user's view (integrity of the soul/speech) is the *foundational* layer. The strongest argument shows the friend's view is derivative of the user's view, not mutually exclusive, but the user's view explains the *absolutism* better.

