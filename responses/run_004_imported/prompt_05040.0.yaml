      *   **User's Position (Alternative Reading):** Augustine's prohibition is *self-regarding*. It concerns the liar's soul and the integrity of the speech faculty given by God. The wrong is in the act itself (doing evil that good may come), not necessarily the injury to the hearer.
      *   **Evidence Cited by User:**
