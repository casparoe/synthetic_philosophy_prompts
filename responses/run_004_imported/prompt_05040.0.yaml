answer: |-
  This is a sophisticated dispute that cuts to the heart of Augustinian moral theology. You and your friend are essentially debating whether Augustine's prohibition on lying is **deontological regarding the neighbor** (friend's view: the neighbor has a claim on truth) or **ontological regarding the agent** (your view: the agent corrupts their God-given faculty of speech).

  Your friend's reading is the more common "social" interpretation, often favored because it makes Augustine seem more concerned with community cohesion. However, your reading is textually more robust when accounting for the *absolutism* of his position. If the wrong were primarily about harm to the deceived, the eighth grade of lying (saving a body from violation) would likely be permissible, or at least neutral, since the "deceiver" (e.g., a rapist or murderer) has no just claim to the truth that would outweigh a victim's life.

  Here is the strongest reconstruction of your argument, grounded in the texts, followed by an assessment of what survives your friend's objection.

  ***

  ### The Argument for Agent-Integrity: Augustine's Ontology of the Lie

  To argue that Augustine's ethics of lying is fundamentally self-regarding (in the theological sense of the soul's orientation toward God) rather than other-regarding, you must anchor the prohibition not in social contract, but in the **metaphysics of speech**.

  #### 1. The Telos of Speech and the Nature of Sin
  For Augustine, sin is not primarily a legal infraction but a disordering of love and a privation of being. God created human speech (*locutio*) as a sign to manifest the mind of the speaker to the mind of the hearer. This is its *telos*.
  *   **The Argument:** When one lies, one does not merely withhold information; one weaponizes the sign against its divine purpose. You are using a faculty designed for communion to create separation.
  *   **Why this supports you:** This makes the sin intrinsic to the act of the speaker. Even if the hearer is an enemy who intends harm (and thus suffers no "injustice" by being deceived), the speaker has still corrupted their own soul by misusing a divine gift. The wrong is located in the *voluntas fallendi* (will to deceive) within the agent, not the *damnum* (loss) in the patient.

  #### 2. The Eightfold Typology as a Gradient of Alienation from God
  Your friend argues the eight grades (*De Mendacio* 10.24) track harm to the victim. You should argue they track **distance from Divine Truth**.
  *   **Grade 1 (Religious Doctrine):** This is the worst lie not because it harms a specific listener's interests, but because it is a lie *against God*. It creates the maximum distance between the speaker and Ultimate Truth.
  *   **Grade 8 (Saving a Body from Defilement):** This is the "mildest" sin, but Augustine insists it remains a *peccatum* (fault). If the ethic were other-regarding, this lie would be a duty of charity. By classifying it as a sin (albeit venial), Augustine signals that the integrity of the speaker's adherence to Truth outweighs the physical safety of the neighbor.
  *   **The "No Victim" Lies:** Crucially, Grades 4, 5, and 6 include lies that harm no one (e.g., lying for politeness or jest). If the prohibition were based on the deceived party's right to truth, a harmless lie would be permissible. Augustine says it is not. This proves the violation is against the order of the soul, not the rights of the neighbor.

  #### 3. Romans 3:8 as the Structural Keystone
  Augustine's repeated appeal to *"Neque faciamus mala ut veniant bona"* ("Let us not do evil that good may come") is the strongest evidence for your reading.
  *   **The Argument:** This Pauline rule blocks consequentialist calculus. If the wrongness of lying depended on the net harm to the deceived, then preventing a murder would negate the wrong. Augustine's insistence that one must not do evil (lie) even for the sake of a great good (saving a life) locates the moral evil entirely in the **agent's action**.
  *   **In *Contra Mendacium*:** When addressing the Catholics who wanted to infiltrate Priscillianists, Augustine argues that you cannot become a liar to catch a heretic. To do so would be to destroy your own soul to save another's. This prioritizes the spiritual integrity of the agent over the potential salvation of the deceived.

  #### 4. The Case of Rahab: Separating Virtue from Vice
  Your handling of Rahab is critical. Scripture praises her (Hebrews 11:31, James 2:25), yet she lied.
  *   **Augustine's Move:** Augustine does not say Rahab's lie was good. He argues that her **faith and mercy** were praiseworthy, while her **lie** was a fault that was forgiven *despite* being a sin, not because it was virtuous.
  *   **Why this supports you:** If the ethic were other-regarding, Rahab's lie would be an act of justice toward the spies. Augustine refuses to sanctify the lie itself. He effectively says: "She was saved *through* the lie, not *for* the lie." This maintains the absolute prohibition on the act itself, regardless of the benevolent outcome, reinforcing that the moral locus is the agent's adherence to truth, not the recipient's safety.

  ***

  ### Engaging the Friend's Objection

  Your friend objects that this reading imports a "modern, agent-centered concern with moral purity" and ignores the social fabric. Here is how to engage that seriously to see what survives.

  #### 1. Is it "Modern Moral Purity"?
  **Critique:** Your friend suggests you are making Augustine into a Kantian, worried about keeping his own hands clean while the world burns.
  **Rebuttal:** This is anachronistic. Augustine's concern is not "purity" in a modern individualistic sense, but **ontological alignment**. For Augustine, the "self" is not an autonomous agent but a creature ordered toward God. To lie is to disorder the self. It is not "self-regarding" in the sense of selfishness; it is "God-regarding."
  *   **What survives:** You must concede that Augustine is not *indifferent* to the neighbor. He believes that a disordered soul cannot truly love the neighbor. However, you maintain that the *prohibition* itself is grounded in the soul's order, not the neighbor's rights. The friend is right that Augustine cares about the neighbor, but wrong about *why* lying is forbidden. It is forbidden because it breaks the liar, which subsequently makes them less capable of true charity.

  #### 2. Is the "Right to Truth" Anachronistic?
  **Critique:** Your friend argues the deceived has a "standing claim on the truth."
  **Rebuttal:** Augustine does not speak the language of rights. He speaks of *ordo* (order) and *caritas* (love). To say the deceived has a "right" implies a social contract view. Augustine's view is theological.
  *   **The Concession:** However, your friend is correct that Augustine *does* argue in *Contra Mendacium* that lying destroys human trust (*fides*), which is the bond of society.
  *   **The Synthesis:** You can grant your friend that social trust is a **secondary consequence** of the prohibition, but not its **primary foundation**. Augustine argues society collapses *because* lying is a sin against God's order, not that lying is a sin *because* society collapses. If social trust were the foundation, the "harmless lie" (Grade 5) would not be sinful, as it damages no trust. Since it is sinful, the foundation must be the agent's relation to Truth.

  #### 3. Cherry-Picking Hard Cases?
  **Critique:** Your friend says you focus on the extreme cases (Rahab, saving a life) to force an absolutist reading.
  **Rebuttal:** In moral theology, hard cases reveal the principles. If the principle holds in the case of saving a life, it defines the system.
  *   **What survives:** You should acknowledge that Augustine is deeply troubled by these cases. He wishes Rahab hadn't lied. He wishes there were another way to save the victim. His anguish shows he recognizes the *value* of the good outcome, but he subordinates it to the *nature* of the act. This confirms your reading: the act itself carries the moral weight, not the outcome.

  ### Conclusion: The Verdict

  Your argument is the stronger textual reading. Augustine's absolutism cannot be fully explained by an "other-regarding" ethic because he explicitly categorizes lies that cause no harm to the other as sinful.

  **The Strongest Formulation of Your Position:**
  Augustine's ethics of lying is **theocentric and agent-oriented**. The lie is a sin primarily because it is a *perversio linguae* (perversion of the tongue) that severs the speaker from God, who is Truth. The harm to the neighbor and the erosion of social trust are real and grave consequences, but they are derivative of the primary disorder: the soul's voluntary alienation from Truth.

  **What Survives of Your Friend's Objection:**
  Your friend is right to warn against making Augustine a modern individualist. Augustine does not think the liar is "safe" while the neighbor suffers; the liar is in spiritual peril precisely because they have failed to love the neighbor *in truth*. But the *prohibition* rests on the nature of the act and the agent, not the rights of the patient.

  You win the debate on the **foundation** of the prohibition (ontological/agent-centered), while your friend correctly identifies the **consequences** (social/relational). But since the question is why the lie is forbidden *even when it helps the neighbor*, your reading of the self-regarding integrity of the speech-faculty is the only one that accounts for the absolute ban.
