      *   **Conclusion:** Summarize the strongest version of the user's view.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I represent Augustine accurately? Yes, he is famously absolutist.
      *   *Check:* Did I address *Contra Mendacium*? Yes, specifically the Priscillianist context (infiltration). Augustine says you can't become a liar to catch a heretic.
      *   *Check:* Is the tone appropriate? Academic, respectful, analytical.
