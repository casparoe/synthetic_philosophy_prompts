      *   Address the "Right to Truth" anachronism. Augustine doesn't really speak in terms of "rights." He speaks of *ordo* (order) and *caritas* (love). Loving the neighbor means not leading them into error, but primarily it means not corrupting one's own capacity to love truly.

  6.  **Structuring the Response:**
