prompt: |-
  On several old Overcoming Bias and LessWrong threads about decision theory under unbounded gambles, I keep running into people gesturing at the "Pasadena paradox" as some sort of nastier cousin of the St. Petersburg paradox, without ever quite explaining why it's supposed to be worse. As I understand the two cases: in the classic St. Petersburg game, a fair coin is tossed until it first lands heads, and you're paid 2^n if the first heads occurs on toss n; the expected payoff is a divergent sum of positive terms, so it comes out unambiguously infinite, and there's a familiar toolkit for defusing the resulting puzzle — bounded utility functions, diminishing marginal utility of money, objections from the counterparty's necessarily finite wealth, and so on. Nover and Hájek's Pasadena game instead pays (-1)^(n+1) × 2^n⁄n if the first heads occurs on toss n, so the terms of the expectation alternate in sign and sum to the alternating harmonic series, which converges to ln 2 only conditionally, not absolutely. Since the series isn't absolutely convergent, Riemann's rearrangement theorem tells us that reordering the very same underlying outcomes lets you make the "expected value" equal any real number you like, or diverge to positive or negative infinity, or oscillate without ever settling on a value.

  I'd like you to compare the two paradoxes properly, rather than treating Pasadena as just "St. Petersburg, but weirder." Please explain precisely why an expectation that is undefined by rearrangement constitutes a different, and arguably deeper, kind of problem than one that is merely infinite, and then assess whether the standard rescues for St. Petersburg — bounding utility, invoking finite wealth, or simply refusing to take unbounded gambles seriously — do anything at all to help with Pasadena. Close with a clear, justified verdict: which of the two paradoxes poses the more serious threat to someone committed to maximizing expected value, and why?
reasoning: |-
  Here's a thinking process that leads to the comparison and verdict on the St. Petersburg vs. Pasadena paradoxes:

  1.  **Deconstruct the Request:**
      *   **Topic:** Decision theory under unbounded gambles, specifically comparing the St. Petersburg Paradox (SPP) and the Pasadena Paradox (PP).
      *   **Core Task:** Explain *why* PP is considered "nastier" or a "deeper" problem than SPP, focusing on the mathematical distinction between divergent positive series (SPP) and conditionally convergent series (PP).
      *   **Assessment:** Evaluate standard "rescues" for SPP (bounded utility, finite wealth, rejection of unbounded gambles) against PP. Do they work?
      *   **Verdict:** Conclude with a clear, justified verdict on which paradox is the more serious threat to Expected Value (EV) maximization.
      *   **Tone:** Analytical, precise, philosophical but grounded in the math (Overcoming Bias/LessWrong style).

  2.  **Analyze the St. Petersburg Paradox (SPP):**
      *   *Structure:* Payoff $2^n$ with probability $1/2^n$.
      *   *Expectation:* $\sum (1/2^n) \cdot 2^n = \sum 1 = \infty$.
      *   *Nature of the problem:* The sum diverges to $+\infty$.
      *   *Intuition clash:* People won't pay much to play, but EV says pay anything.
      *   *Standard Solutions:*
          *   Bounded Utility (Bernoulli): $U(money)$ grows slower than money (e.g., $\log$). Makes EV finite.
          *   Finite Bankroll: The casino can't pay $2^{100}$. Truncates the series.
          *   Time/Resource constraints: Practical limits.
      *   *Philosophical Status:* It's a problem of *magnitude*. The value is "too big."

  3.  **Analyze the Pasadena Paradox (PP):**
      *   *Structure:* Payoff $(-1)^{n+1} \frac{2^n}{n}$ with probability $1/2^n$.
      *   *Expectation:* $\sum (1/2^n) \cdot (-1)^{n+1} \frac{2^n}{n} = \sum \frac{(-1)^{n+1}}{n}$.
      *   *Nature of the problem:* This is the alternating harmonic series. It converges to $\ln(2)$ *if* summed in the natural order ($n=1, 2, 3...$).
      *   *The Catch:* In probability theory, expectation is defined via the Lebesgue integral. For the expectation to be well-defined independent of ordering, the series must be *absolutely* convergent ($\sum |x_i| p_i < \infty$). Here, $\sum |\frac{(-1)^{n+1}}{n}| = \sum \frac{1}{n} = \infty$.
      *   *Riemann Rearrangement Theorem:* Since it's conditionally convergent, reordering the terms changes the sum.
      *   *Decision Theory Implication:* There is no unique "Expected Value." The value depends on how you group or order the outcomes. But outcomes are unordered sets in a probability space. So, EV is *undefined*, not infinite.
      *   *Philosophical Status:* It's a problem of *definition*. The value doesn't exist.

  4.  **Compare the "Depth" of the Problem:**
      *   SPP: EV exists (as $+\infty$). The problem is mapping $\infty$ to rational action. We can say "EV is infinite, but utility is bounded."
      *   PP: EV *does not exist*. It's not $\infty$; it's undefined. You can't maximize something that isn't a number.
      *   *Key Distinction:* SPP breaks the link between EV and intuitive value. PP breaks the mathematical definition of EV itself within standard probability theory (Kolmogorov/Lebesgue).

  5.  **Evaluate Standard Rescues against PP:**
      *   *Bounded Utility:*
          *   SPP: Works well. $\sum p_i U(2^n)$ converges if $U$ is bounded.
          *   PP: If $U$ is bounded, does it fix the conditional convergence?
          *   Analysis: The payoffs in PP grow as $2^n/n$. If $U(x) \approx \log(x)$, then $U(\text{payoff}) \approx n - \log(n)$. The probability is $1/2^n$. The term becomes $(n - \log n)/2^n$. This converges absolutely!
          *   *Wait, check the payoff structure:* The PP payoff is $V_n = (-1)^{n+1} 2^n / n$.
          *   If we apply a utility function $U(V_n)$, we need to check absolute convergence of $\sum p_n |U(V_n)|$.
          *   If $U$ is bounded (e.g., arctan), then $|U(V_n)| < M$. $\sum (1/2^n) M$ converges. So bounded utility *does* rescue PP.
          *   *However:* The paradox is usually presented in terms of *money* or linear utility to attack the linearity of expectation. If the agent cares about money linearly, bounded utility is a change of preference, not a solution to the math problem.
          *   *Crucial Point:* The PP targets the *linearity of expectation* and the definition of integration. Bounded utility changes the integrand. Does it solve the *conceptual* issue that EV is undefined for unbounded linear utility? Yes, by making utility bounded. But is that a "rescue" or a "retreat"?
          *   *Refinement:* The PP is often cited to show that *even if* you accept unbounded utility (to solve SPP via "maybe infinity is okay"), you run into PP. If you bound utility to solve SPP, you solve PP too. But if you try to keep unbounded utility (to allow for infinite EV games), PP destroys you.
      *   *Finite Wealth:*
          *   SPP: Truncates the sum. EV becomes finite.
          *   PP: Truncates the sum. Since it's a finite sum, order doesn't matter. EV becomes well-defined.
          *   *Verdict:* Works for both, but relies on empirical constraints, not decision theory principles.
      *   *Refusing Unbounded Gambles:*
          *   SPP: "I won't play."
          *   PP: "I won't play."
          *   *Verdict:* Avoids the problem, doesn't solve the theoretical inconsistency.

  6.  **Synthesize the "Deeper Problem" Argument:**
      *   SPP is a conflict between theory (EV=$\infty$) and intuition (Price $\approx$ \$20).
      *   PP is a conflict within the theory itself (EV is undefined).
      *   In SPP, you can consistently say "The EV is infinite."
      *   In PP, you cannot consistently say "The EV is X."
      *   This threatens the *coherence* of Expected Utility Theory (EUT) more than SPP. SPP suggests EUT gives counterintuitive answers. PP suggests EUT gives *no* answer.

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the context (OB/LW threads). Define the core mathematical distinction (Divergence vs. Conditional Convergence).
      *   *Section 1: The Mathematical Chasm.* Explain why $\infty$ is a defined value in extended reals, but "undefined due to rearrangement" is a failure of definition. Use the Lebesgue integral distinction (integrable vs. not integrable).
      *   *Section 2: Assessing the Rescues.*
          *   Bounded Utility: Solves both, but requires abandoning linear utility of money.
          *   Finite Wealth: Solves both empirically, but leaves the idealized theory broken.
          *   Dominance/Principles: Mention that PP violates dominance principles in ways SPP doesn't (e.g., adding a constant to every payoff shifts the EV arbitrarily in PP, but not in SPP). *Self-Correction:* Actually, adding a constant to a conditionally convergent series can change the convergence properties or the limit. In SPP, adding a constant makes it diverge faster. In PP, it breaks the alternation balance.
      *   *Section 3: The Verdict.* PP is worse. Why? Because SPP allows for a consistent (if infinite) valuation, whereas PP makes valuation impossible without arbitrary stipulations (like ordering). It attacks the *existence* of the expectation, not just its *magnitude*.

  8.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does Bounded Utility actually solve PP?* Yes, if utility is bounded, the expectation is absolutely convergent. So if you accept bounded utility, PP disappears.
      *   *So why is PP worse?* Because PP closes the escape route of "Okay, maybe infinite EV is acceptable."
      *   *Scenario:* A theorist says, "I don't mind SPP. I accept that some games have infinite value. I will use extended real numbers."
      *   *Counter:* PP says, "You can't do that. Some games don't have *any* value, not even infinity."
      *   *Therefore:* PP forces the bounded utility conclusion harder than SPP. SPP allows a stubborn theorist to dig in ("Infinity is real!"). PP makes digging in impossible ("Undefined is not a value!").
      *   *Also:* The "ordering" issue. In probability, the sample space is a set. Sets are unordered. The expectation integral must be independent of enumeration. PP shows that for unbounded utilities, the integral is not well-defined. This is a foundational crack in the measure-theoretic formulation of EUT.

  9.  **Final Polish:** Ensure the tone is rigorous. Use terms like "Absolute Convergence," "Lebesgue Integral," "Extended Real Numbers." Make sure the verdict is punchy.

      *(Self-Correction on Finite Wealth)*: If wealth is finite, the payoff is capped. If the payoff is capped, the series is finite. A finite sum is always absolutely convergent. So finite wealth solves PP trivially. The question is about *idealized* decision theory. I need to emphasize that distinction.

      *(Check on Nover & Hájek)*: They argue that standard decision theory cannot handle this. They suggest that EUT is incomplete. I should reflect that.

      *(Final Plan)*:
      1. Intro: Define the math distinction clearly.
      2. Why PP is deeper: Existence vs. Magnitude.
      3. Rescues: Bounded utility (works but costly), Finite wealth (empirical not theoretical).
      4. Verdict: PP is the existential threat.

  10. **Writing the content.** (Mental check of the alternating harmonic series sum: $\sum (-1)^{n+1}/n = 1 - 1/2 + 1/3 - 1/4... = \ln 2$. Correct.)
      (Check payoff: $(-1)^{n+1} 2^n / n \times 1/2^n = (-1)^{n+1}/n$. Correct.)

      *One more nuance:* The "Arithmetic" objection. In SPP, you can argue about the value of infinity. In PP, you can't even do arithmetic. If Game A is Pasadena and Game B is Pasadena + $1, Game B should be better. But EV(A) is undefined, EV(B) is undefined. You can't compare them. This breaks dominance.

      *Okay, ready to draft.*
answer: |-
  The distinction between the St. Petersburg Paradox (SPP) and the Pasadena Paradox (PP) is not merely a matter of degree; it is a categorical difference between a problem of **magnitude** and a problem of **definition**.

  To understand why the LessWrong and Overcoming Bias communities often treat Pasadena as the more formidable opponent, we must look past the surface-level confusion (both involve infinite series and counterintuitive valuations) and examine the measure-theoretic foundations of Expected Utility Theory (EUT).

  ### 1. The Mathematical Chasm: Divergence vs. Undefinability

  The core difference lies in the convergence properties of the expectation series.

  **St. Petersburg (Divergence to Infinity):**
  In the SPP, the expected value is the sum of positive terms: $\sum_{n=1}^{\infty} 1$. In the context of measure theory and the extended real number line, this sum is well-defined. It equals $+\infty$.
  *   **Status:** The expectation *exists*, but it lies outside the standard real numbers.
  *   **Implication:** The theory functions consistently; it simply outputs a value that conflicts with human intuition and practical constraints. You can build a consistent axiomatic system that accommodates infinite values (e.g., using the extended reals), even if that system recommends irrational-sounding actions (like paying \$1 million to play).

  **Pasadena (Conditional Convergence):**
  In the PP, the expectation is the alternating harmonic series: $\sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$.
  *   **Status:** This series converges to $\ln 2$ *only* if summed in the specific order $n=1, 2, 3...$. However, the expectation of a random variable is defined as a Lebesgue integral. For a Lebesgue integral to be well-defined (independent of the enumeration of the sample space), the series must be **absolutely convergent**. That is, $\sum |x_n| p_n$ must be finite.
  *   In the Pasadena game, $\sum |\frac{(-1)^{n+1}}{n}| = \sum \frac{1}{n}$, which diverges.
  *   **Implication:** By the Riemann Rearrangement Theorem, the terms of this series can be reordered to sum to *any* real number, or $\pm \infty$. Since a probability space is a set (which has no intrinsic ordering), there is no mathematically privileged way to sum the outcomes. Therefore, **the expected value does not exist.** It is not infinite; it is undefined.

  **Why this is deeper:**
  The SPP tells you that your utility function assigns a value of $\infty$ to the gamble. The PP tells you that your utility function **fails to assign any value at all**. The SPP is a conflict between theory and intuition; the PP is a conflict within the theory itself. It demonstrates that for unbounded utility functions, the expectation operator is not well-defined on the space of all gambles.

  ### 2. Assessing the Standard Rescues

  Does the toolkit used to defuse St. Petersburg survive the Pasadena attack?

  #### A. Bounded Utility Functions
  *   **Against SPP:** If utility $U(x)$ is bounded (e.g., $U(x) = \arctan(x)$), the expected utility sum becomes a sum of bounded terms weighted by probabilities summing to 1. The series converges absolutely. EV becomes finite.
  *   **Against PP:** This rescue **works** against Pasadena as well. If utility is bounded, the Pasadena payoffs (however large) are mapped to a bounded range. The resulting expectation series becomes absolutely convergent.
  *   **Assessment:** This is the only robust theoretical solution to both. However, PP tightens the screw. In SPP, a stubborn theorist might argue, "I accept unbounded utility; I accept that some things are infinitely valuable." PP removes this option. If you insist on unbounded utility, PP shows your decision theory literally cannot evaluate common gambles. PP forces the bounded utility conclusion more aggressively than SPP.

  #### B. Finite Wealth / Bankroll Constraints
  *   **Against SPP:** If the casino has a maximum bankroll $W$, the game truncates at $n \approx \log_2 W$. The sum becomes finite. EV is large but finite.
  *   **Against PP:** Truncation also solves PP. A finite sum is always absolutely convergent; rearrangement does not change the total.
  *   **Assessment:** This is an empirical solution, not a theoretical one. It saves practical decision-making but admits that idealized Expected Utility Theory is false in the limit. It concedes that EUT only works because the universe is finite, not because the theory is robust. Both paradoxes succumb equally here, but neither is "solved" in the abstract.

  #### C. Dominance and Additivity Principles
  *   **Against SPP:** SPP creates tension with dominance (e.g., a game that pays \$1 more in every state should be preferred), but one can argue that $\infty + 1 = \infty$.
  *   **Against PP:** PP devastates dominance. Consider a Pasadena game $P$ and a modified game $P'$ that pays exactly \$1 more than $P$ in every outcome.
      *   Intuitively, $P'$ should be strictly preferred.
      *   Mathematically, $E[P]$ is undefined. $E[P']$ is the sum of the alternating harmonic series plus a sum of constants ($\sum 1/2^n$). Adding a constant to a conditionally convergent series can alter its convergence properties or its limit depending on grouping.
      *   Because the expectation is undefined, EUT cannot formally state that $E[P'] > E[P]$. The theory loses the ability to rank the two gambles, violating basic rationality axioms.
  *   **Assessment:** PP is significantly more damaging here. SPP strains dominance; PP breaks the arithmetic required to express it.

  ### 3. Verdict: Which is the Greater Threat?

  **The Pasadena Paradox poses the more serious threat to someone committed to maximizing expected value.**

  **Justification:**
  1.  **Existence vs. Magnitude:** The St. Petersburg Paradox challenges the *plausibility* of Expected Value maximization (it yields counterintuitive prices). The Pasadena Paradox challenges the *possibility* of Expected Value maximization (it yields no value). A theory that gives the wrong answer is flawed; a theory that gives no answer is incomplete or incoherent.
  2.  **Closing the Escape Hatches:** SPP allows a theorist to maintain unbounded utility functions by accepting infinite values as legitimate. PP closes this escape route. It demonstrates that unbounded utility functions lead to mathematical ill-definedness, not just large numbers. To rescue EUT from Pasadena, you *must* bound utility or restrict the domain of admissible gambles.
  3.  **Foundational Incoherence:** The Pasadena Paradox highlights that the standard definition of expectation (the Lebesgue integral) requires absolute convergence. If a decision theorist wishes to maintain that rational agents maximize expectation, they must accept that agents cannot have preferences over gambles that generate conditionally convergent series. This implies that rational preferences cannot be represented by unbounded utility functions over money.

  In summary, the St. Petersburg Paradox suggests that Expected Utility Theory might need **calibration** (e.g., adjusting for risk or utility curvature). The Pasadena Paradox suggests that Expected Utility Theory needs **foundation-laying** (e.g., proving that the integrals actually exist). The former is a bug; the latter is a potential crash of the operating system.

  **Verdict:** **Pasadena wins.** It transforms the problem from "How much is infinity worth?" to "What does it mean to value something that has no expectation?" For a formalist committed to EV maximization, an undefined expectation is a fatal error, whereas an infinite expectation is merely a boundary condition.
