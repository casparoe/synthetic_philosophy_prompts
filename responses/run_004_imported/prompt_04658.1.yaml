answer: |-
  This is an exceptionally sharp observation. You have correctly identified the tension between the *metaphysics* of causation (what physically makes things happen) and the *pragmatics* of explanation (what we need to know to prevent recurrence). The discomfort you feel in that postmortem room is the same discomfort philosophers feel when they stare at the "problem of profligate omissions."

  You asked for a fresh example, an explanation of the normative solution, and an honest assessment of whether it holds water. Let's walk through that.

  ### 1. The Example: The Cold Storage Catastrophe

  Imagine a large pharmaceutical warehouse dedicated to storing temperature-sensitive vaccines. One summer, the cooling system fails, $10 million worth of inventory spoils, and a regional vaccination drive is set back by months.

  The physical mechanism of failure is simple: The backup generator's fuel valve was in the "closed" position. When the main power grid failed, the generator tried to kick on, starved for fuel, and died.

  Here are the six people who *could* have prevented the loss by doing something they didn't do. For each, the counterfactual holds true: *If Person X had done Y, the spoilage would not have occurred.*

  1.  **The Maintenance Technician:** His weekly checklist included "verify generator fuel valve position." He signed the checklist without looking.
  2.  **The Shift Supervisor:** She walked past the generator room every day. The valve handle is red and visible through a small window. She never looked through the window.
  3.  **The Safety Inspector:** An external contractor who visits quarterly. He *could* have tested the generator under load, which would have revealed the valve issue. He only tested the electrical connections.
  4.  **The Warehouse Director:** He had the budget authority to install an automated valve sensor with an alarm. He declined the expenditure to save costs.
  5.  **The HR Manager:** Her office is next door. She walks past the generator room window five times a day. She has no technical training, but she *could* have noticed the red handle was horizontal (closed) instead of vertical (open) and asked about it.
  6.  **The Mayor:** She *could* have authorized municipal funding to upgrade the local power grid, preventing the initial blackout that necessitated the generator.

  **The Profligate Problem:**
  If causation is purely about counterfactual dependence ("But-for X, would E have happened?"), then **all six** are equally causes of the spoilage.
  *   But-for the HR Manager not looking, the valve would have been fixed.
  *   But-for the Mayor not funding the grid, the generator wouldn't have been needed.

  This is absurd. If we treat all six as "causes," the concept of causation loses its utility. It becomes a list of everything that didn't happen in the universe that would have stopped the event. Yet, intuitively, the Maintenance Technician feels different from the Mayor. Why?

  ### 2. The Normative (Default/Deviation) Solution

  This is where the theory you encountered comes in. Philosophers like H.L.A. Hart, Tony Honoré, and more recently Sarah McGrath, argue that we cannot distinguish these omissions based on *physics* alone. Physically, the absence of action by the Technician is identical to the absence of action by the Mayor: both are non-events.

  To single out the Technician, we must smuggle in a **norm**.

  **The Mechanism:**
  The theory posits that we mentally divide the world into a "default state" (what normally happens/what is expected) and a "deviation" (what is abnormal/wrong).
  *   **Causation is assigned to deviations, not defaults.**
  *   We only count an omission as a cause if the agent *ought* to have acted (or was *expected* to act).

  **Applying it to the Warehouse:**
  *   **Maintenance Technician:** The norm (job description, checklist) is to check the valve. His behavior was a *deviation* from the default. **Verdict: Cause.**
  *   **Shift Supervisor:** The norm is to supervise, but not necessarily inspect mechanical valves. However, if "safety walkarounds" are part of her role, this might be a minor deviation. **Verdict: Partial Cause.**
  *   **Safety Inspector:** The norm is quarterly testing. He performed the standard test, just not the load test. Depending on industry standard, this might be considered "within default." **Verdict: Not a Cause (or weak).**
  *   **Warehouse Director:** The norm is fiscal responsibility. Not buying every possible safety upgrade is the *default* behavior of a director. **Verdict: Not a Cause.**
  *   **HR Manager:** She has no duty to inspect generators. Her walking past without looking is the *default*. **Verdict: Not a Cause.**
  *   **The Mayor:** Her causal link is too distant, and there is no specific norm requiring her to fund this specific grid upgrade. **Verdict: Not a Cause.**

  By this logic, the "Cause" is not the physical absence of an action, but the **violation of an expectation**. The normative solution successfully filters the profligate list down to the one or two people who "broke the script."

  ### 3. The Honest Assessment: Resolution or Relocation?

  You asked whether this resolves the metaphysical puzzle or simply relocates it.

  **It relocates it.**

  Here is the hard truth: The normative solution does not find a *metaphysical* difference between the Technician's omission and the Mayor's omission. It finds a *moral/social* difference.

  If you ask a physicist, "What caused the vaccines to spoil?" and they answer, "The Maintenance Technician didn't turn the valve," they are not speaking strictly about physical forces. They are speaking about **explanatory selection**. They are selecting the factor that is:
  1.  Abnormal (relative to the system's design).
  2.  Manipulable (we can change this easily in the future).
  3.  Normatively salient (someone was supposed to do it).

  **Why this matters for your Retrospective:**
  The philosophical consensus (including McGrath's work) suggests that "causation" in human systems is not a natural kind like "gravity" or "mass." It is an **interest-relative concept**. We select causes based on what we want to achieve (prevention, justice, understanding).

  When your team resists "root-causing" the failure to a single person, your instinct is actually more philosophically defensible than the instinct to pin it on one "root cause."

  *   **The Metaphysical Reality:** The breach was caused by a complex system state where six different safeguards failed to engage. All six omissions are ontologically equal (they are all absences).
  *   **The Pragmatic Reality:** You need to fix the system. Fixing the HR Manager's behavior won't help. Fixing the Technician's process might.

  **The Danger of the Normative Solution:**
  The risk of using the "Default/Deviation" model in a postmortem is that it conflates **Cause** with **Blame**.
  *   If we say the Technician is the "Cause" because he deviated from the norm, we implicitly assign him the burden of the failure.
  *   But what if the norm was unreasonable? (e.g., The checklist was 200 items long, making it impossible to actually check everything).
  *   In that case, the "Deviation" was actually the *expected* outcome of a flawed system. The "Default" should have been "Humans make mistakes," and the "Deviation" was "The system relied on perfect human attention."

  ### 4. Recommendation for Your Team

  You asked if there is a principled answer to be had. The principle is this: **Distinguish between *Causal Explanation* and *Accountability Assignment*.**

  In your next retrospective, I suggest you explicitly frame the discussion using this distinction.

  1.  **Acknowledge the Profligate Truth:** Start by stating, "Physically, six different interventions could have stopped this. None of them is the 'single' physical cause." This validates the feeling that pinning it on one person is arbitrary.
  2.  **Use Norms for Triage, Not Blame:** Use the "Default/Deviation" logic to decide *where to invest engineering effort*, not who to reprimand.
      *   *Ask:* "Which of these six omissions represents a deviation from a *reasonable* expectation?"
      *   *If the expectation was reasonable:* Strengthen the safeguard (e.g., automate the check so the omission is impossible).
      *   *If the expectation was unreasonable:* Change the norm (e.g., "It is not reasonable to expect a human to catch this alert; we need to change the alerting threshold").
  3.  **Reframe "Root Cause":** Stop looking for the "Root Cause" (singular). Start looking for the **"Most Leverage Point."**
      *   The Maintenance Technician might be the "normative cause," but if the system allowed a single human error to take down production, the **System Design** is the "causal enabler."
      *   Often, the most defensible position is that the *system* caused the incident by allowing six single points of failure to align.

  **Conclusion:**
  Your instinct to resist singling out one failure-to-act is correct. The philosophy of omission suggests that "cause" in this context is a tool we use to carve up reality for specific purposes (like prevention), not a hidden feature of the universe waiting to be discovered.

  If you treat the "normative solution" as a way to identify **where we have the most leverage to change the future**, rather than **who broke the past**, you can keep your postmortem blameless without sacrificing rigor. You aren't ignoring the cause; you are acknowledging that the "cause" is a relationship between the event and your goals, not just the event itself.
