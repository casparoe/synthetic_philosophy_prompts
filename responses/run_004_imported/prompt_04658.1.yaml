      *   **Context:** The user works at a software company and recently attended a blameless postmortem regarding a security breach caused by an unpatched vulnerability.
      *   **Problem:** Six different people could have prevented the breach by acting differently. The "blameless" culture says don't pick one cause, but intuitively, some omissions feel more causal than others.
      *   **Philosophical Interest:** The user has been reading about the metaphysics of causation by omission, specifically the "problem of profligate omissions" (too many things *didn't* happen that *could* have prevented the outcome). They mention Sarah McGrath and the "default/deviation" (normative) approach.
      *   **Specific Request:**
          1.  Construct a *new*, fully worked-out example (no software, no plants) illustrating the profligate omissions problem.
