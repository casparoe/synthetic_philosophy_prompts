  2.  **Deconstruct the Philosophical Concepts:**
      *   **Causation by Omission:** $C$ (not doing $X$) causes $E$ (bad outcome) because if $C$ had done $X$, $E$ wouldn't have happened.
      *   **Profligate Omissions:** If we rely solely on counterfactual dependence ("if $X$ had happened, $E$ wouldn't have"), *everyone* who didn't do $X$ is a cause. (e.g., The President didn't patch the server either). This is intuitively wrong.
      *   **Normative/Default-Deviation Approach:** We distinguish between "normal/expected" behavior and "abnormal/deviant" behavior. Only the deviation from the norm counts as a cause. (e.g., The sysadmin *should* have patched; the President *should not* have been expected to).
      *   **The Critique:** Does "should" belong in metaphysics? Or is this just moral responsibility masquerading as causation?

