          *   *Point B: Transformation is Theory.* The process of "transforming" data into images involves selection and simplification. This is a theoretical act, not a neutral mirroring. ISOTYPE isn't showing "reality"; it's showing a *model* of reality.
          *   *Point C: Coherence vs. Correspondence.* ISOTYPE implies a correspondence theory (picture matches fact). Neurath's epistemology is coherentist (statement matches system). If ISOTYPE claims to be neutral, it claims to stand outside the system. But Neurath's boat says nothing stands outside the system.

