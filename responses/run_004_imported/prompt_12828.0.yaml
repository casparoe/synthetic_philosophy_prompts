      *   **Key Arguments for James:** The "final opinion" is a useless regulative fiction/theology; it offers no guidance for *now*; Peirce's scholastic realism smuggles in absolute truth; truth happens to an idea.
      *   **Tone:** Intellectual, rigorous, respectful but sharp. No easy wins. An honest impasse.
      *   **Specific Detail:** Mention Peirce's renaming of his doctrine to "pragmaticism" (ugly enough to be safe).

  2.  **Character Voices:**
      *   **Peirce:** Precise, logical, somewhat pedantic but deeply passionate about scientific method and realism. He values the *long run* and the *community*. He dislikes subjectivism. He can be gruff.
