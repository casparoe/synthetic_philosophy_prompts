      *   **Round 1: The Definition of Truth.**
          *   James: Truth is what works, what guides us beneficially.
          *   Peirce: That's too subjective. What if a lie works?
          *   James: A lie doesn't work *in the long run* of experience.
          *   Peirce: But you define it by the satisfaction *now*.
