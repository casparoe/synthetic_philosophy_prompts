      *   **SIA (Self-Indication Assumption):** You should reason as if you are a random observer from the set of *all possible* observers, weighted by the probability of that world existing. Worlds with more observers are more likely to contain *you*. (Cancels DA).
      *   **Reference Class Problem (for SSA):** Who counts as an observer? Just humans? Conscious beings? Aliens? If the class is too broad or too narrow, the math breaks.
