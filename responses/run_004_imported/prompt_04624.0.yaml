answer: |-
  **Setting:** *The living room floor. 11:30 PM. An IKEA LACK shelf is half-assembled. Particle board shards, cam locks, and wooden dowels are scattered across the rug. I am holding an Allen key like a dagger. My flatmate, Sarah, is reading Step 4 of the instructions.*

  **Me:** Hand me the long screw. But don't call it a screw. Call it a metal simple arranged screw-wise. Because that's all it is.

  **Sarah:** *(Without looking up)* If I hand you the screw, I am handing you a part of the shelf. Which exists.

  **Me:** It doesn't exist. *You* exist. The *simples* arranged screw-wise exist. But there is no "screw" over and above those simples. And certainly no "shelf." Not yet. Maybe not ever.

  **Sarah:** Here we go. You've been reading Van Inwagen again. Look, pass me the side panel. This *is* a shelf. Or at least, it's a fusion of parts that constitutes a shelf. The composition has already happened.

  **Me:** Composition never happens. That's the point. There are just simples in contact. You're reifying a relationship. You think because the wood particles are touching the metal particles in a specific configuration, a new entity pops into existence. It's magic.

  **Sarah:** It's not magic, it's logic. Think about the Special Composition Question. You're a nihilist, so your answer is "never." But consider the process. I tighten this cam lock. *(She twists the Allen key)* Did composition happen just now?

  **Me:** No.

  **Sarah:** Why not? Before I tightened it, the particles were loose. Now they're bound. If you say composition never happens, you have to say there's no difference ontologically between a pile of dust and a finished bookcase.

  **Me:** There is a difference! The dust is simples arranged dust-wise. The bookcase is simples arranged bookcase-wise. The *arrangement* differs. The ontology doesn't. I don't need to posit a new object "bookcase" to account for the utility of the arrangement.

  **Sarah:** But that leads directly into the Argument from Vagueness. If you think composition is restricted—that it happens only when parts are fastened, or functionally unified—you have to admit there's a precise moment where it switches on. If I turn the screw halfway, is there a shelf?

  **Me:** It's a vague predicate. "Shelf" is vague.

  **Sarah:** Existence isn't vague. That's the Lewis point. You can't have vague existence. Either there is an object composed of these parts, or there isn't. If you admit there's no sharp cutoff where composition begins, you have to admit composition is unrestricted. Any time you have some things, there is a fusion of those things. So yes, this half-built mess is a thing. And so is the fusion of that mess plus the dust bunny under the sofa.

  **Me:** And that's exactly why your ontology is bloated trash. You're telling me there exists an object composed of the Andromeda Galaxy and this Allen key?

  **Sarah:** Yes.

  **Me:** That's absurd.

  **Sarah:** It's counter-intuitive, not absurd. Lewis calls it "ontologically innocent." Positing the fusion doesn't add to your ontology. It's just the parts. To say "the fusion of X and Y exists" is just to say "X exists and Y exists." You aren't adding a third thing. You're just acknowledging the logical consequence of plural quantification.

  **Me:** It feels like you're adding a thing. You're changing the truth conditions. If I say "There is a trout-turkey," and you nod, you've cluttered the universe with gerrymandered monstrosities.

  **Sarah:** The trout-turkey exists. It's just not a *natural kind*. It doesn't have causal powers over and above the trout parts and the turkey parts. But why does that bother you? You're already willing to say "There are simples arranged trout-turkey-wise." What's the difference?

  **Me:** The difference is the quantifier! When I say "There are simples arranged trout-wise," I am not committed to a *trout*. I am committed to the simples. When you say "There is a trout-turkey," you are committed to an object that has spatial parts separated by light years. It violates the spirit of what "object" means.

  **Sarah:** But what does "object" mean, then? You're relying on a conceptual scheme where "object" implies causal unity or spatial continuity. But that's pragmatic, not metaphysical. You're arguing for parsimony, but nihilism isn't parsimonious.

  **Me:** How is denying the existence of arbitrary fusions not parsimonious?

  **Sarah:** Because you have to explain away ordinary talk. When I say "The shelf is leaning," you have to paraphrase that into "The simples arranged shelf-wise are collectively leaning." That's complex. You're introducing a primitive predicate "arranged X-wise" for every possible object. Isn't that more theoretical baggage than just accepting unrestricted mereology?

  **Me:** It's not baggage if it's true. And it avoids the explosion of entities. Look, if unrestricted composition is true, then before I even opened the box, there was an object composed of the particle board in the factory and the screws in Taiwan.

  **Sarah:** Correct.

  **Me:** And that object ceased to exist when we brought the parts together?

  **Sarah:** No. The fusion of the Taiwan-screws and the factory-board still exists. It's just scattered now. We've created a *new* fusion by bringing them into proximity, but the old scattered fusion is still there.

  **Me:** This is why people think metaphysics is disconnected from reality. You're defending the existence of a scattered object that has no function, no name, and no causal unity, purely to save yourself from admitting a sharp cutoff in a vague process.

  **Sarah:** I'm defending logic against vagueness. If you deny unrestricted composition, you have to tell me *where* the restriction is. Is it contact? Chemical bonding? Functional unity? If it's functional unity, does the shelf stop existing if I take one screw out?

  **Me:** It depends on the context.

  **Sarah:** Aha! So existence is context-dependent?

  **Me:** No, *talk* of objects is context-dependent. Existence is fundamental. There are only simples. The rest is just useful fiction for navigating the world.

  **Sarah:** So you're an instrumentalist about macroscopic objects?

  **Me:** I'm an eliminativist.

  **Sarah:** Okay, but let's go back to the "ontological innocence" claim. You dismissed it. But if the fusion is nothing over and above the parts, what are you actually saving? You admit the parts exist. You admit they are arranged. You just refuse to bind them with a variable bound by the existential quantifier. It feels like you're fighting over the symbol $\exists$.

  **Me:** *(Pauses, looking at the cam lock)* Maybe. But it's not just the symbol. It's what the symbol ranges over. If your quantifier ranges over trout-turkeys, your domain is infinitely larger than mine.

  **Sarah:** Is it? If the trout-turkey is nothing over and above the trout and the turkey, the domain size is the same. It's just a different way of counting. You count atoms. I count atoms and fusions. But since fusions supervene on atoms, I haven't added any *fundamental* being.

  **Me:** But you've added *derivative* being. And why? What work does the trout-turkey do?

  **Sarah:** It makes the logic clean. It avoids the Sorites paradox for existence.

  **Me:** And I avoid it by saying existence only applies to the base level. The Sorites applies to the predicates we apply to the arrangements, not to existence itself. "Shelf" is vague. "Simples" are not.

  **Sarah:** But are simples not vague? Where does the electron end and the field begin? If your base level is fuzzy, your nihilism collapses into the same vagueness you're trying to avoid.

  **Me:** *(Sighs)* That's a physics problem, not a mereology problem. Let's assume there's a fundamental level.

  **Sarah:** Okay, assume there is. Even then, we're back to the quantifier. I suspect our disagreement isn't about the world. It's about what we want the word "exists" to do. You want it to track "causally unified natural kinds." I want it to track "logical possibility of reference."

  **Me:** I want it to track *reality*. And in reality, there is no "trout-turkey." There's just a trout and a turkey.

  **Sarah:** And in reality, there is no "shelf." There's just wood and metal. You're in the same boat as me. You just refuse to admit you're sailing it. You use the word "shelf" constantly.

  **Me:** As a manner of speaking. *Façon de parler*.

  **Sarah:** But if it's just a manner of speaking, why is it true? "The shelf is leaning" is true. If there is no shelf, what makes it true?

  **Me:** The fact that the simples are arranged shelf-wise and leaning-wise.

  **Sarah:** So the truthmaker is the arrangement of simples.

  **Me:** Yes.

  **Sarah:** And for me, the truthmaker is the shelf (which is the simples). We agree on the truthmaker. We agree on the physical state of the world. We agree on the logic. We just disagree on whether we label the fusion as an object in our formal ontology.

  **Me:** *(Hands her the side panel)* So it's quantifier variance.

  **Sarah:** Looks like it. You're using a restricted quantifier. I'm using an unrestricted one. Neither of us is wrong about the furniture. We're just wrong about which logic is "privileged."

  **Me:** Mine is privileged because it doesn't commit me to the existence of a fusion of your left shoe and the moon.

  **Sarah:** And mine is privileged because it doesn't require me to believe that tightening a screw changes the fundamental ontology of the universe.

  **Me:** *(Takes the Allen key)* Pass me the cam lock. The simples arranged cam-lock-wise need to be inserted.

  **Sarah:** *(Smiles)* Here's the fusion of the cam lock and the panel. Try not to let it cease to exist when you drop it.

  **Me:** If I drop it, the arrangement changes. The "shelf" might vanish. The simples will just be arranged floor-wise.

  **Sarah:** The fusion will just be arranged scattered-wise. It'll still exist.

  **Me:** Don't start.

  **Sarah:** Just tighten the screw.

  **Me:** *(Tightening)* There. Arranged tightly-wise.

  **Sarah:** See? We can agree on that.
