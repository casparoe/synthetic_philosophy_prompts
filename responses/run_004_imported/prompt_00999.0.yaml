answer: |-
  You have your history right, but you are running into a classic distinction in logic that trips up a lot of people: the difference between **validity** and **soundness**.

  Here is the breakdown of what you're missing, why the theorem prover check doesn't mean what you think it means, and why the LessWrong (or general rationalist) sphere doesn't treat this as a proof of immortality.

  ### 1. Validity vs. Soundness (The Computer Check)
  When researchers (specifically Christoph Benzmüller and Bruno Woltzenlogel Paleo in 2013) ran Gödel's proof through a theorem prover, they confirmed that the argument is **valid**.

  *   **Validity** means: *If* the premises are true, the conclusion *must* follow. The logic has no holes.
  *   **Soundness** means: The argument is valid *AND* the premises are actually true in the real world.

  The computer confirmed validity. It did not (and cannot) confirm soundness.

  **Analogy:**
  1.  All toasters are gods.
  2.  This object is a toaster.
  3.  Therefore, this object is a god.

  If you run this through a theorem prover, it will check out as **valid**. The logic is perfect. But the conclusion is false because the first premise is nonsense. Gödel's proof is much more sophisticated than the toaster example, but the logical principle is the same: **Garbage In, Garbage Out.** The theorem prover verified the processing, not the input.

  ### 2. The Axioms are Controversial
  Gödel's proof relies on a set of axioms regarding "positive properties." For example, one axiom essentially states that if a property is positive, its negation is not positive. Another states that necessary existence is a positive property.

  The problem is that "positive" is not defined mathematically; it is a philosophical intuition.
  *   Is "omnipotence" a positive property? Gödel says yes.
  *   Is "being contingent" a negative property?
  *   Can we logically prove that "existence" is a predicate/property at all? (Kant famously argued no).

  Most philosophers and logicians reject the axioms as not being self-evident truths. They are assumptions that smuggle the conclusion in. If you don't accept the specific definition of "positive" Gödel uses, the proof collapses. Since the axioms aren't empirically verifiable, the proof remains a metaphysical exercise, not a demonstration of fact.

  ### 3. The "Modal Collapse" Problem
  There is a known technical issue with Gödel's ontological proof called **Modal Collapse**.

  If you follow Gödel's axioms strictly, it implies that **everything that is possible is necessary.** In other words, there are no contingent facts. Everything that happens *had* to happen. There is no free will, no randomness, and no alternative possibilities.

  While this might be compatible with some hard-determinist theological views, it contradicts our empirical observation of the world (quantum mechanics, subjective experience of choice, etc.). Many logicians view this as a *reductio ad absurdum*—proof that the axioms leading to this collapse are flawed.

  ### 4. God $\neq$ Afterlife
  Even if we grant you the biggest concession imaginable—that Gödel proved a "God-like being" necessarily exists—that does not logically entail an **afterlife for humans.**

  To get from "Necessary Being Exists" to "You will live after you die," you need several additional premises that are not in Gödel's formal system:
  1.  This Being cares about human individuals.
  2.  This Being has the power to preserve human consciousness.
  3.  Human consciousness is the kind of thing that *can* be preserved separately from the brain.

  Gödel personally believed these things (he was a Leibnizian theist), and he did write letters to his mother expressing his belief in an afterlife. However, those beliefs were **not** derived from the ontological proof. They were separate theological convictions. The formal proof stands entirely on its own without mentioning human souls. So, the afterlife is not a corollary; it's a separate claim entirely.

  ### 5. Why the LessWrong Sphere Ignores It
  The LessWrong community is heavily influenced by Bayesian rationality and empiricism. Their epistemology generally prioritizes:
  *   **Predictive Power:** Does this belief help me anticipate sensory experiences?
  *   **Empirical Grounding:** Is there evidence observable in the universe?

  A modal logic proof is **a priori**. It attempts to deduce facts about the universe purely from definitions and logic, without looking out the window. To a Bayesian, this looks like "trying to squeeze blood from a stone."

  If a logical proof contradicts empirical evidence (e.g., if the proof implies modal collapse, but we observe probability), the rationalist move is to discard the proof's assumptions, not discard reality. Furthermore, since the axioms are subjective, accepting them is functionally identical to "faith," just dressed in mathematical notation.

  ### Summary
  Gödel was a genius of the highest order, but he was also a man who suffered from significant mental health struggles and paranoia later in life. He believed he had found a logical proof for God, but the broader logical community views it as a fascinating exploration of modal logic, not a discovery of metaphysical truth.

  **What you are missing is that logic cannot create truth; it can only preserve it.** If the starting assumptions (axioms) aren't objectively true, the perfect logic doesn't make the conclusion true. The theorem prover showed the machine was working, not that the map matched the territory.
