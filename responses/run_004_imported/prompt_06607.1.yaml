answer: |-
  Thank you all for being here.

  Before I start, I need to read something Helen left in her files. It wasn't a funeral plan, exactly. It was a sticky note on a printout of Frank Ramsey's essay "Epilogue." It said: *"If anyone tells me I'm watching over them from a cloud, I will haunt them. If anyone says I'm 'at peace,' I'll haunt them harder. Just tell them why the stars don't matter."*

  So. No clouds. No peace. Just the stars.

  For those of you who knew Helen professionally, you know that for forty years, her favorite party trick was to corner a guest, point at the night sky, and dismantle their existential dread with a 1930s Cambridge philosopher.

  For those of you who knew her as a sister, an aunt, or a grandmother, you might remember her doing this at barbecues, usually while holding a pair of tongs and a glass of wine.

  She loved Frank Ramsey's argument because it was a shield. Ramsey wrote that just because the universe is vast and we are small, it doesn't mean our lives are insignificant. He said, and I'm quoting now: *"My picture of the world is drawn in perspective, and not like a model to scale. The foreground is occupied by human beings and the stars are all as small as threepenny bits."*

  To the physicists in the room: Helen knew the scale. She knew the light-years. She knew the entropy. But she also knew that a model to scale is useless for navigation. If you draw a map where the distance between New York and London is accurate but you leave out the roads, you aren't going anywhere.

  Helen believed that consciousness—our ability to think, to love, to worry about a eulogy—is the only thing that gives the universe a point of view. A star is impressive, yes. It is massive and hot and enduring. But a star cannot love a grandchild. A star cannot worry about whether it's being a good friend. A star cannot do cosmology. In the economy of meaning, Helen argued, stars are bankrupt. We are the only currency that spends.

  But I know what the other half of this room is thinking. I know what her teenage grandkids might be feeling. You're thinking: *Okay, but the universe does end. The heat death is coming. Everything turns to cold ash eventually. So why bother?*

  This was Helen's second point, and it was her own twist on Ramsey. She used to say that the heat death of the universe is so far in the future that its "present value" basically rounds to zero.

  In economics, you discount the future. A dollar ten years from now is worth less than a dollar today. Helen applied that to the end of time. The universe has billions of years left before the lights go out. That is so far away that it shouldn't discount the value of your Tuesday. It shouldn't discount the value of a hug, or a meal, or a day in the lab.

  She taught me this back when I was a baby reporter, hanging around her lab, trying to understand how to write about science without freezing the warmth out of it. I remember asking her once, "Doesn't it make you feel tiny? Knowing how long this all lasts compared to a human life?"

  She was looking at a monitor, tracking something faint and distant. She didn't turn around. She said, "Imagine you're at a concert. The music is beautiful. Does it matter that the concert hall will eventually be demolished? Does it matter that the audience will go home? No. The music is happening *now*. If you spend the whole symphony worrying about the cleaning crew arriving at the end, you miss the violin."

  Helen didn't live her life waiting for the cleaning crew. She lived in the foreground.

  To her family: I know this sounds cold. I know that when you lose someone, you want them to be somewhere. You want them to be looking down, safe, intact. Helen banned that language not because she didn't love you, but because she thought you were stronger than that. She thought *we* are stronger than that.

  She believed that saying she is "watching over you" actually diminishes what she did while she was here. It suggests that the real Helen is somewhere else, in the stars. But she wasn't in the stars. She was here. She was in the arguments about where to get lunch. She was in the patience she showed when teaching you to drive. She was in the fierce, bright way she listened when you spoke.

  That didn't go anywhere. It doesn't need to be "preserved" in an afterlife to be real. It happened. And because it happened, it changes the future.

  Ramsey wrote that human goods are "intrinsic." They don't need a cosmic backdrop to be valid. Love is not valuable because the universe approves of it. Love is valuable because *we* approve of it. We are the validators.

  So, how do we carry this? How do we grieve without the comfort of "she's in a better place"?

  We do it by acknowledging that this place was good enough for her. And it can be good enough for us, too.

  To her colleagues: We lost a brilliant mind. We lost someone who could see the perspective of the cosmos without losing the perspective of the human. She leaves a gap in the department that no new data can fill.

  To her family: You lost the person who made the coffee, who remembered the birthdays, who told you that you were smart even when you felt stupid.

  The Ramsey argument isn't that death doesn't hurt. It hurts. The foreground is empty. But the emptiness proves the value of what was there. If the stars are just threepenny bits, then Helen was the gold.

  I want to speak specifically to her grandchildren for a moment. Your grandmother was a woman who looked at the end of the universe and said, "Not today." She refused to let the size of the dark scare her out of the light of the present.

  The best way to honor that isn't to pretend she's still here. It's to do what she did. It's to draw your world in perspective. Put the people you love in the foreground. Make the stars small.

  Don't worry about the heat death. Don't worry about the ultimate end of things. Worry about being kind today. Worry about doing your homework. Worry about calling your mother. Worry about the Tuesday in front of you.

  Helen trusted that you could handle the truth. She trusted that you didn't need a fairy tale to find comfort. She believed that the fact that we are here, thinking and loving for a brief moment in the dark, is the miracle. Not the stars. Us.

  She isn't watching over us. She is behind us, pushing us forward. She is in the work she left, in the questions she asked, and in the way we look at the sky now, knowing it's vast, but knowing that we are the only part of it that matters.

  Thank you.
