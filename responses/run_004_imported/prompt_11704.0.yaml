prompt: |-
  I sit on the executive committee of a mid-sized manufacturing firm deciding what to do about a three-year-old breach-of-contract suit against a former supplier. We've already spent $3.5 million in legal fees; outside counsel says another $1.5 million and eight months would get us to trial, where we could win $6 million or lose entirely, and the supplier has just offered to settle for $500,000. Over dinner last night, a friend who teaches game theory argued that we're now in a real-world dollar auction: since neither side can recover what it has already spent, stopping now locks in a $3 million loss for us, while continuing offers a chance of coming out ahead at the risk of an even larger one — and the supplier faces the mirror image of that same choice, so both of us have reason to keep escalating well past the point where, in hindsight, stopping would have made more sense. A colleague's draft memo takes this to mean we should simply accept the settlement, since sunk costs are sunk; I think that's too quick, because what we should do here depends on what the supplier is likely to do next, not only on what we've already spent. Please draft the short memo I'll bring to Monday's vote: a concrete recommendation — accept, counter, or proceed to trial — with a timeframe, reasoning that actually engages the two-sided escalation dynamic my friend described rather than just invoking "ignore sunk costs" the way my colleague did, and a fair account of the strongest consideration against whatever you end up recommending.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Executive Committee Member of a mid-sized manufacturing firm.
      *   **Situation:** 3-year breach-of-contract suit against a former supplier.
      *   **Financials:** Spent $3.5M (sunk). Need $1.5M more to trial (8 months). Potential win $6M (net +$1M vs. current spend? No, vs. total cost). Settlement offer: $500k.
      *   **The Conflict:**
          *   *Colleague's View:* Accept settlement. Sunk costs are sunk. Don't throw good money after bad.
          *   *User's View:* Too quick. Need to consider the two-sided escalation dynamic (Game Theory/Dollar Auction), not just internal sunk costs.
          *   *Friend's Argument:* It's a "Dollar Auction." Both sides are trapped. Escalation is rational *if* the other side escalates, leading to irrational outcomes for both.
      *   **Task:** Draft a short memo for Monday's vote.
      *   **Requirements:**
          *   Concrete recommendation (Accept, Counter, or Proceed).
          *   Timeframe.
          *   Reasoning must engage the two-sided escalation dynamic (not just "ignore sunk costs").
          *   Include the strongest consideration against the recommendation.

  2.  **Deconstruct the Economics & Game Theory:**
      *   *Current Status:* Spent $3.5M.
      *   *Option A (Settle Now):* Receive $500k. Net position relative to start: -$3.0M. (The $3.5M is gone. We get $0.5M back).
      *   *Option B (Trial):* Spend additional $1.5M. Total cost $5.0M.
          *   Win (Probability $P$): Get $6M. Net position: +$1M ($6M - $5M).
          *   Lose (Probability $1-P$): Get $0. Net position: -$5.0M.
      *   *Expected Value (EV) of Trial:* $(P \times 6) - 1.5$ (marginal cost).
          *   To break even on the *marginal* investment ($1.5M), we need $P \times 6 > 1.5$, so $P > 25\%$.
          *   If we believe our chance of winning is > 25%, trial has positive *marginal* EV.
      *   *The "Dollar Auction" Insight:* The friend is right that *both* sides are trapped. The supplier has also spent money. If they settle for $500k, they pay us. If they go to trial, they risk paying $6M + their own legal fees.
      *   *Strategic Implication:* If we signal we are going to trial, does that force *them* to settle for more? Or does it force them to fight harder?
      *   *The Trap:* If both sides think "I've spent too much to quit," they both spend the extra $1.5M (and the supplier spends their equivalent). This destroys value for both.
      *   *The User's Point:* Simply accepting $500k ignores the leverage we have. The supplier *also* faces sunk cost fallacy. They might be desperate to avoid trial too.
      *   *Recommendation Strategy:* A hard "Accept" ignores leverage. A hard "Trial" ignores risk. A "Counter" exploits the mutual desire to avoid trial costs while acknowledging the escalation dynamic. We need to signal commitment to trial *unless* a better deal is made, but recognize that trial is value-destructive if both escalate.

  3.  **Determine the Recommendation:**
      *   *Accept ($500k):* Safe, but leaves money on the table if the supplier is also scared of trial.
      *   *Trial:* High risk. Only justified if $P > 25\%$. But if the supplier thinks $P$ is low, they won't settle higher.
      *   *Counter-Offer:* This is the sweet spot. It acknowledges the escalation dynamic. We signal we are *willing* to spend the $1.5M (escalate) to force them to realize their own exposure. But we prefer to settle to avoid the mutual loss.
      *   *Target:* The settlement should reflect the Expected Value of the trial minus the risk premium.
      *   *Decision:* **Counter-Offer.** Recommend making a final settlement offer with a short expiration, signaling readiness for trial if rejected. This addresses the user's concern about the two-sided dynamic (we use the threat of escalation to negotiate, rather than blindly escalating or blindly folding).

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Recommendation:** Counter-offer at $2.5M (or similar logical number) with a 2-week deadline.
      *   **Reasoning (The Core):**
          *   Acknowledge the sunk cost argument (Colleague). It's technically correct for *internal* decision making (is the next $1.5M worth it?).
          *   Integrate the Game Theory (Friend). This is a bilateral negotiation where *their* sunk costs matter. They are also facing a "Dollar Auction."
          *   The threat of trial is our leverage. If we just accept $500k, we signal weakness/capitulation.
          *   We need to credibly commit to the $1.5M spend to force them to reassess their risk.
          *   However, trial is negative sum (fees burn value). Settlement is positive sum (saves fees for both).
          *   Therefore: Threaten trial to drive up settlement, but settle before burning the $1.5M.
      *   **Strongest Consideration Against (The Risk):**
          *   They call the bluff. We spend the $1.5M and lose. Or we spend it and win, but net is still low.
          *   Or, the "Dollar Auction" takes hold: We counter, they counter, and we get dragged into the $1.5M spend anyway because neither side wants to look weak.
          *   Mitigation: Hard deadline.

  5.  **Refining the Numbers:**
      *   Current Offer: $500k.
      *   Trial Award: $6M.
      *   Marginal Cost: $1.5M.
      *   If we go to trial, supplier pays $6M + their legal fees.
      *   If they settle, they pay $X.
      *   A counter of $2.5M - $3M seems reasonable. It's less than the $6M risk but much more than $500k. Let's suggest **$2.75 million**. It splits the difference between the offer and the risk-adjusted value.
      *   Actually, let's look at the EV. If we think we have a 50% chance: EV = $3M - $1.5M cost = $1.5M marginal gain. Plus the $3.5M sunk is gone.
      *   Let's keep it strategic. Recommend a counter of **$2.5 million**.

  6.  **Addressing the "Dollar Auction" specifically:**
      *   The friend says: "Stopping now locks in a $3M loss... continuing offers a chance of coming out ahead."
      *   The memo needs to say: "Yes, but *they* are in the same boat. If we signal we are stopping (accepting $500k), they win. If we signal we are continuing, they might fold to save *their* marginal costs."
      *   The goal is to escape the auction *together* at a price better than $500k, without actually paying the $1.5M.

  7.  **Review against Constraints:**
      *   Short memo? Yes.
      *   Concrete recommendation? Yes (Counter).
      *   Timeframe? Yes (2 weeks).
      *   Engage two-sided dynamic? Yes (Leverage based on their exposure).
      *   Strongest consideration against? Yes (Risk of bluff call/escalation).

  8.  **Final Polish:** Tone should be executive, decisive, yet nuanced. Avoid academic jargon but use the logic. Ensure the distinction between "sunk costs" (internal) and "strategic leverage" (external) is clear.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Counter." I need to explain *why* countering engages the dynamic better than accepting. Accepting ends the auction immediately at a bad price. Trial continues the auction dangerously. Counting attempts to close the auction at a midpoint by leveraging the threat of continuation.

      *Wait, one nuance:* The friend's argument is that *both* sides have reason to keep escalating. The memo needs to acknowledge that risk. If we counter, we risk entering the escalation phase. So the recommendation must include a "walk-away" point or a strict deadline to prevent *us* from falling into the trap we are describing.

      *Revised Plan:* Recommend a final counter-offer with a "take it or leave it" posture. This uses the escalation threat without necessarily incurring the cost.

  9.  **Finalizing the Content:**
      *   **To:** Executive Committee
      *   **From:** [My Name]
      *   **Subject:** Recommendation on [Supplier] Litigation
      *   **Rec:** Counter-offer $2.5M, 14-day expiry. Prepare for trial if failed.
      *   **Logic:** Sunk costs are irrelevant to *our* EV, but relevant to *their* settlement calculus. They want to avoid trial risk + fees too.
      *   **Risk:** They call bluff. We spend $1.5M.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Executive Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Strategic Recommendation: [Supplier] Litigation Settlement

  **Recommendation**
  I recommend we **reject the current $500,000 offer and submit a final counter-offer of $2.5 million**, with a strict 14-day expiration. Simultaneously, we must authorize counsel to prepare for trial as if the counter-offer will be rejected. If the supplier does not meet us near this figure by the deadline, we proceed to trial.

  **Reasoning: Beyond Sunk Costs**
  My colleague's memo correctly notes that the $3.5 million already spent is sunk and should not dictate our decision. However, relying solely on internal sunk-cost logic ignores the strategic reality described by the "Dollar Auction" dynamic: **the supplier is trapped in the same escalation trap we are.**

  1.  **The Two-Sided Dynamic:** Like us, the supplier has incurred significant legal fees over three years. For them, going to trial risks a $6 million judgment plus their own marginal legal costs. Settling for $500,000 minimizes their immediate cash outflow but admits liability.
  2.  **Leverage via Credible Threat:** If we accept $500,000 now, we signal that we are risk-averse and desperate to stop the bleeding. This invites them to hold firm. To escape the "auction" at a better price, we must credibly signal that we are willing to spend the additional $1.5 million to trial.
  3.  **Value Creation:** Trial is value-destructive for both parties (burning $1.5M of our fees + their fees). A settlement between $500k and $6M saves everyone's marginal legal costs. By threatening trial, we force them to weigh their own risk of escalation. A $2.5 million settlement captures roughly half the potential award while saving us the $1.5 million trial cost and eight months of management distraction.

  **Strongest Consideration Against This Recommendation**
  The primary risk is that the supplier **calls our bluff.** If they believe our threat to proceed to trial is a bluff rooted in sunk-cost fallacy, they may reject the counter-offer. This forces us into a binary choice: spend the $1.5 million to maintain credibility (risking a total loss if the verdict is unfavorable) or retreat to the $500,000 offer after failing to negotiate, which weakens our position further.

  Furthermore, by countering, we risk entering the very escalation spiral my friend warned against. If they counter back at $1 million, the pressure to "spend $1.5 million to save the negotiation" becomes intense. We must remain disciplined: if they do not move significantly toward $2.5 million, we must either go to trial or walk away to $500,000 immediately, rather than engaging in a war of attrition.

  **Next Steps**
  Upon approval, I will instruct outside counsel to draft the settlement agreement with the 14-day clause and schedule trial preparation milestones to begin immediately, ensuring our threat is operationally credible.
