      *(Final Grade Decision)*: 8/10. The content is A-level, the textual basics are B-level (Speaker error).

      *(JSON Structure)*: Ensure it's valid JSON.

      *(Walkthrough)*: Be specific about *why* "Socrates" is wrong (Dramatic setting). Be specific about *why* the analogy is right (Fear/Pleasure parallel).

      *(Office Hours Script)*: Give the user something they can literally say.

