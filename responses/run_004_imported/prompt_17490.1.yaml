      *   **Point 2: The Principle of Sufficient Reason (PSR):** This is the hammer. Why *this* coordination? The reason cannot be found within the agents alone (since they are isolated). It must be found in their common origin/concept.
      *   **Point 3: The Status of Logical Truths:** Acausal trade relies on logical/mathematical truths (decision theory). For Leibniz, these exist in the Divine Intellect.
