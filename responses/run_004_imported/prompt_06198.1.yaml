answer: |-
  The rain blurred the funeral home windows, turning the streetlights into smeared halos. Marguerite stared at her plastic cup of wine, then at the empty chair beside her, then at Julian as he sat down. He smelled of wet wool and old paper.

  "They seated us together," Julian said, peeling off his damp coat. "Departmental irony, or just ran out of chairs?"

  "Probability favors the latter," Marguerite said. "Though Halloway would have appreciated the symmetry."

  "Halloway would have told us to shut up and drink." Julian took a sip, winced, and set the cup down. "He hated when we turned grief into a seminar."

  "He hated sloppy reasoning. There's a difference." Marguerite turned to face him fully. "I read your contribution to the symposium. The section on global supervaluationism."

  "I hoped you wouldn't."

  "You posit a set of admissible precisifications to save truth from indeterminacy," she said, her voice low but cutting. "But you haven't solved higher-order vagueness, Julian. You've just displaced it. Where exactly does the set of admissible precisifications stop? Is there a sharp boundary between the admissible and the inadmissible?"

  Julian sighed, leaning back. "It's a boundary of usage, Marguerite. It's constrained by the rules we actually follow."

  "But is *that* boundary sharp?" she pressed. "If you say there's a borderline case between admissible and inadmissible, then your supertruth collapses into indeterminacy again. If you say the boundary is sharp, then you're an epistemicist about precisifications. You've bought a sharp boundary anyway; you've just hidden it behind a modal operator."

  "It's not hidden. It's structural." Julian tapped the table. "Look, the problem with your view—the Williamsonian stubbornness of it—is that it requires magic. You claim there is a fact of the matter about exactly how many grains make a heap. But what fact is that? Usage is messy. It's fluid. It doesn't contain numerical data. How does the chaotic history of human speech acts fix a single, precise integer?"

  "Usage doesn't fix it consciously," Marguerite countered. "It fixes it constitutively. Ignorance isn't evidence of non-existence. Just because we can't know the boundary doesn't mean it isn't there. The world is precise, Julian. Our access is limited."

  "The world is precise?" Julian shook his head. "That's a metaphysical commitment, not a discovery. You're saying reality itself has no fuzziness. But look at us." He gestured between them. "Is this friendship dead, or is it borderline? You want a yes or no. I'm telling you there are worlds where it's true, worlds where it's false, and in this one, it's undefined."

  Marguerite flinched, barely perceptible. "Don't. Don't use the theory to dodge the relationship."

  "I'm not dodging. I'm describing." Julian's voice softened. "You think if we dug deep enough into the facts of our history, we'd find a sharp cutoff where I stopped being your friend. I think there are some things that simply lack a truth value. And insisting otherwise... it feels like violence."

  "Insisting otherwise is insisting on bivalence," she said, though her grip on the cup loosened. "It's insisting that reality is robust enough to bear truth. If you allow truth-value gaps, you lose classical logic. You lose the law of excluded middle. You make the world less real."

  "I make it honest," Julian said. "Halloway knew it. Remember his last lecture? He stopped mid-sentence about the Sorites. Didn't finish the proof. Just said, 'Some lines aren't meant to be drawn.'"

  "He was tired," Marguerite said automatically.

  "He was wise." Julian looked at her, really looked at her, for the first time in ten years. The sharpness in her eyes was familiar, the same intensity that had kept them awake in the library until 3 a.m., arguing over drafts until the sun came up. "You look exhausted, Marguerite. Defending sharp boundaries everywhere must be tedious."

  "And living in the fog must be comforting," she replied, but the edge was gone. "It lets you avoid saying no."

  "Or it lets me avoid saying yes when I'm not sure." Julian reached out, hovering his hand near hers on the table, then withdrew it. "We're not going to resolve this. Not tonight. Not ever."

  "No," Marguerite said. She took a drink of the warm wine. "But you're wrong about higher-order vagueness."

  "And you're wrong about usage."

  "Obviously."

  A silence settled between them, less hostile than the one before. Outside, the rain continued to blur the world, softening the hard lines of the street. Julian picked up his cup.

  "To Halloway," he said. "Who knew when to stop."

  Marguerite hesitated, then clinked her plastic cup against his. "To Halloway. Who knew when to leave things unsaid."

  They drank. It was still terrible wine, but for a moment, the boundary between them felt less like a wall and more like a line drawn in water, shifting, but there.
