answer: |-
  This is a fantastic question, and your engineering analogy (the watchdog process that never fires) is actually a really sharp way to understand Frankfurt's core intuition. You have grasped the *mechanism* of the argument perfectly.

  The short answer is: **You are right that Frankfurt changed the game, but you are wrong that he ended it.**

  Your friend was right—it is more complicated. But it's not complicated because philosophers like to make things difficult; it's because Frankfurt's counterexample forced the opposition to upgrade their defenses. The debate didn't die; it migrated.

  Here is the structural breakdown of why the free will debate is still very much alive, translated into terms that should click with your backend background.

  ### 1. The Shift from "Leeway" to "Sourcehood"

  Before Frankfurt, the Incompatibilist argument (the side that says determinism kills free will) looked like this:
  1.  **Determinism** means you can't do otherwise.
  2.  **Responsibility** requires you to be able to do otherwise (PAP).
  3.  Therefore, **Determinism** kills responsibility.

  Frankfurt successfully attacked premise #2. He showed that you can be responsible even if you can't do otherwise.

  **However,** Incompatibilists simply shifted their ground. They stopped arguing about *Alternative Possibilities* (Leeway) and started arguing about *Origination* (Sourcehood).

  **The Engineering Analogy:**
  Imagine your code runs perfectly. There is no watchdog process. You deployed it, and it executed the logic exactly as you wrote it.
  *   **Frankfurt says:** "See? The watchdog didn't fire. You wrote the logic. You are responsible for the output."
  *   **The Incompatibilist replies:** "Sure, the watchdog didn't fire. But who wrote *you*?"

  If determinism is true, your "choice" to vote for Smith was the inevitable result of prior states of the universe (the Big Bang + Laws of Physics). In a Frankfurt case, Jones is the immediate source of the action. But in a deterministic universe, Jones is just a middleman. The "root commit" in the git history of his action traces back to before he was born.

  This is called **Source Incompatibilism**. They argue that moral responsibility requires you to be the *ultimate source* of your actions. Even if you could do otherwise or not, if your internal state was determined by external factors you didn't control, you aren't the true author. Frankfurt's chip doesn't touch this; it only removes *alternative* paths, it doesn't fix the *origin* of the actual path.

  ### 2. The "Flicker of Freedom" Strategy

  There is a technical objection to Frankfurt cases that argues PAP isn't actually falsified. This is known as the "Flicker of Freedom" defense.

  In the Frankfurt scenario, Jones decides on his own. But consider the alternative scenario: Jones decides to vote Green, and the chip fires.
  *   **Scenario A:** Jones votes Smith (on his own).
  *   **Scenario B:** Jones votes Smith (forced by chip).

  Incompatibilists argue there *is* an alternative possibility here, just not a different *outcome*. The alternative is **how** the outcome came about. Jones *could have done otherwise* in the sense that he could have been in a scenario where he was coerced.

  **The Engineering Analogy:**
  Think of it like an API response.
  *   **Case 1:** Your service returns `200 OK` because the logic processed correctly.
  *   **Case 2:** Your service returns `200 OK` because a load balancer intercepted a crash and served a cached response.

  The output is identical (`200 OK` / Vote Smith). But the *process* was different. Incompatibilists argue that moral responsibility attaches to the *process*, not just the output. If there is even a tiny "flicker" of difference in the causal history (voluntary vs. forced), then "could have done otherwise" is still technically in play, just at a meta-level.

  ### 3. The "Actual Sequence" vs. "Global Determinism" Distinction

  This is the big structural thing you might be missing. Frankfurt cases are **local** counterexamples, but Determinism is a **global** claim.

  Frankfurt shows that *in a specific scenario*, an agent can be responsible without alternatives. But Compatibilists need to show that we are responsible in *our actual world*, which (if physical determinism is true) is a world where *every* choice is causally locked by the past.

  In the Frankfurt case, Jones's brain is functioning normally *except* for the chip. The chip is an external intervener.
  In a Deterministic world, *physics itself* is the chip.

  **The Engineering Analogy:**
  *   **Frankfurt Case:** Your microservice has a bug, but there's a sidecar proxy that *would* have corrected the packet if you sent the wrong one. You sent the right one, so the proxy did nothing. You are still the author of the packet.
  *   **Determinism:** The entire runtime environment is sandboxed such that it is physically impossible for the code to execute any path other than the one it does.

  The Incompatibilist argues that the Frankfurt case is cheating because it assumes Jones has free will *inside* the scenario to make the initial choice, and only uses the chip to block alternatives. But if Determinism is true, Jones never had the freedom to make the initial choice either. The chip is redundant because the laws of physics already guaranteed the vote.

  ### 4. Why the Debate is Still "Massive"

  So, why are philosophy departments still fighting this?

  1.  **Semantics vs. Metaphysics:** A lot of the post-Frankfurt debate is about what we mean by "Responsibility." Compatibilists tend to define responsibility functionally (did the agent respond to reasons?). Incompatibilists define it metaphysically (was the agent the uncaused cause?). They are often talking past each other.
  2.  **The Cost of Compatibilism:** To accept the Frankfurt/Compatibilist view, you have to accept a definition of "free will" that feels watered down to many people. It's "freedom from coercion," not "freedom from causation." Many people (and philosophers) feel this doesn't capture the deep sense of agency we experience.
  3.  **New Arguments:** Since PAP was weakened, Incompatibilists developed new arguments that don't rely on "could have done otherwise." The **Consequence Argument** (popularized by Peter van Inwagen) is the big one. It argues: *If determinism is true, our acts are the consequences of the laws of nature and events in the remote past. But it is not up to us what went on before we were born, and neither is it up to us what the laws of nature are. Therefore, the consequences of these things (including our present acts) are not up to us.*

  Notice that argument doesn't mention "alternative possibilities" once. It's purely about **control**. Frankfurt kills the "Alternative Possibilities" argument, but he doesn't kill the "Control" argument.

  ### Summary for your next party

  You can tell your friends that Frankfurt was a knockout punch to **Leeway Incompatibilism** (the idea that you need options to be responsible).

  But the debate survived because Incompatibilists pivoted to **Source Incompatibilism** (the idea that you need to be the ultimate origin of your actions).

  **Your Watchdog Analogy Refined:**
  *   **Frankfurt:** The watchdog didn't restart the service, so the service is responsible for the uptime.
  *   **Incompatibilist:** Sure, the watchdog didn't restart it. But the service is running on hardware and an OS that were completely configured by someone else before the service ever started. The service never had "root access" to its own execution.

  Frankfurt proved you don't need a backup plan to be responsible. He didn't prove you own the server. That's why the debate is still running.
