prompt: |-
  I'm on my university's Greek life judicial board, and this Friday's hearing has two cases that are basically the same violation with very different outcomes. Both chapters ran the exact same banned pledge activity (an off-campus blindfolded 'trust walk') this semester -- in one case nobody was hurt, in the other a pledge got hit by a car and is still in the ICU, which by all accounts was a total fluke neither chapter couldve seen coming. Nationals for the second chapter is arguing both chapters should get the same sanction (probation) since the actual rule-breaking was identical; a couple board members want to pull that chapter's charter anyway given how things turned out. Our code just says sanctions should fit 'the severity of the incident,' and that phrase is doing a lot of work here since people clearly mean different things by it. Can you draft the memo I'll bring to the hearing recommending concrete next steps for each chapter, in a way that actually engages the 'you'd just be punishing bad luck' objection instead of brushing past it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's Greek life judicial board.
      *   **Task:** Draft a memo for the upcoming hearing regarding two similar cases with different outcomes.
      *   **Scenario:** Two chapters committed the *exact same* banned pledge activity (off-campus blindfolded trust walk).
          *   Case A: No injuries.
          *   Case B: Pledge hit by a car, currently in ICU (described as a "total fluke").
      *   **Conflict:**
          *   Nationals (for Case B) argues for equal sanctions (probation) because the rule-breaking was identical.
          *   Some board members want to revoke Case B's charter due to the severity of the outcome.
          *   The Code says sanctions should fit "the severity of the incident."
      *   **Key Challenge:** The phrase "severity of the incident" is ambiguous. Does it mean severity of the *violation* or severity of the *harm*?
      *   **Requirement:** Engage the "punishing bad luck" objection seriously, not brush it off. Recommend concrete next steps for each chapter.

  2.  **Determine the Ethical and Legal Framework:**
      *   **Due Process/Fairness:** Treating like cases alike is a fundamental principle of justice. If the *conduct* was identical, the *sanction* for the conduct should ideally be similar.
      *   **Risk Management/Safety:** The university has a duty of care. An activity that results in severe harm demonstrates the *potential* risk more viscerally, even if the conduct was the same.
      *   **Precedent:** Setting a precedent where outcomes dictate sanctions (strict liability for results) can be dangerous. It might encourage covering up accidents. However, ignoring outcomes entirely ignores the reality of harm done.
      *   **The "Bad Luck" Argument:** This is the crux. If Chapter B gets revoked and Chapter A gets probation *solely* because of the car accident, that is punishing luck. However, if the sanction reflects the *consequences* that the board must now manage (reputation, liability, community trust), it's not just about luck.
      *   **Resolution Strategy:** Distinguish between the *sanction for the violation* and the *remedial requirements based on impact*. The baseline sanction for the *act* should be consistent. The additional requirements/reparations should reflect the *harm*.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Purpose:** Clearly state the goal (recommendations for Case A and Case B).
      *   **Guiding Principles:** Define how the board interprets "severity of the incident." This is where the "bad luck" argument is addressed.
      *   **Analysis of the "Bad Luck" Objection:** Explicitly tackle the Nationals' argument. Acknowledge its validity but explain why outcome matters in a risk-based context.
      *   **Recommendations:**
          *   Chapter A (No Injury): Standard sanction for the violation.
          *   Chapter B (Injury): Baseline sanction + additional restorative/risk measures.
      *   **Rationale:** Explain *why* this split approach works.
      *   **Conclusion:** Final summary.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Subject Line:* Needs to be professional and specific. "Judicial Board Memorandum: Comparative Sanctioning Framework..."
      *   *Introduction:* Set the stage. Two cases, same violation, different outcomes.
      *   *Interpreting "Severity":* This is the legal heavy lifting. I need to argue that "severity" includes both *culpability* (what they did) and *consequence* (what happened). This allows for a hybrid approach.
      *   *Addressing the "Bad Luck" Argument:* I need to validate Nationals' point. Yes, the *intent* and *action* were the same. Punishing *only* on outcome is unjust. *However*, the Board's responsibility includes managing harm and community safety. The ICU incident changes the *context* of the violation, even if the *act* was the same. It moves from "potential harm" to "actualized harm."
      *   *Sanctioning Logic:*
          *   Base Sanction: Should be the same for both (e.g., Probation). This addresses the "same rule-breaking" argument.
          *   Differential Factors: Chapter B needs more because there is actual victim harm, higher liability, and a greater breach of trust with the university/community.
          *   Chapter A: Probation + Education.
          *   Chapter B: Probation + Restitution/Support + Enhanced Risk Management + Potential Suspension (maybe not charter revocation immediately, but suspension is a middle ground). *Self-Correction:* The prompt mentions some want to pull the charter. I should recommend against immediate revocation if the conduct was identical, but suggest a heightened sanction like Suspension or Deferred Suspension to acknowledge the harm without purely punishing luck. Let's aim for "Deferred Charter Review" or "Suspension" rather than immediate revocation, to show nuance. Actually, to be most persuasive on the "bad luck" point, the *baseline* must be the same. So, Probation is the baseline. But Chapter B needs *additional* conditions. Let's recommend Probation for both as the *disciplinary status*, but Chapter B has much heavier *conditions* and potentially a suspension of social activities.
          *   *Refinement:* Let's look at the "severity of the incident" clause again. If I argue severity includes outcome, then Chapter B's sanction *should* be higher. But to address the "bad luck" claim, I should explicitly state that the *conduct* sanction is equal, but the *restorative* sanction is higher.
          *   *Decision:* I will recommend a "Conduct Sanction" (same for both) and an "Impact/Remedial Sanction" (different). This satisfies fairness and safety.
          *   *Wait, looking at the prompt:* "a couple board members want to pull that chapter's charter anyway." I need to take a stance. Revoking a charter for a "fluke" accident when another chapter did the same thing sets a terrible precedent (encourages hiding injuries). I should recommend against revocation *based solely on the accident*, but recommend suspension or severe probation with conditions. Let's go with **Deferred Charter Review** for Chapter B. It acknowledges the gravity without saying "you are banned because a car hit your pledge."

  5.  **Refining the Tone:**
      *   Must be objective, legalistic but empathetic.
      *   Must show the Board is thoughtful, not reactive.
      *   Must directly quote the "severity of the incident" clause.

  6.  **Addressing the "Bad Luck" Argument specifically:**
      *   Acknowledge: "It is true that moral culpability is identical."
      *   Counter: "However, institutional sanctions are not solely retributive; they are also protective and restorative."
      *   Synthesis: "Therefore, we sanction the *choice* equally, but we manage the *consequence* differently."

  7.  **Final Review against Constraints:**
      *   Did I draft the memo? Yes.
      *   Did I recommend concrete next steps? Yes.
      *   Did I engage the "punishing bad luck" objection? Yes, this is the core of the analysis section.
      *   Is it appropriate for a university judicial board? Yes, tone is formal.

  8.  **Final Polish:** Check for clarity, flow, and ensure the distinction between "Culpability" and "Harm" is sharp. (Self-correction: Ensure I don't sound like I'm blaming the victim or the chapter for the car accident, but rather holding them accountable for the *risk* they created which allowed the accident to happen.)

  *(Self-Correction during drafting)*: I need to be careful not to give legal advice, but rather procedural guidance. I am drafting the memo *for* the board member to use. I will write it as if I am the Chair or a Senior Board Member advising the panel.

  Let's structure the recommendations clearly:
  1.  **Finding of Responsibility:** Both responsible.
  2.  **Sanctioning Framework:** Two-tiered (Conduct vs. Impact).
  3.  **Specific Sanctions:**
      *   Chapter A: Probation, Education.
      *   Chapter B: Probation (same baseline), PLUS Suspension of Social Activities, Mandatory Risk Review, Restitution Fund contribution.
      *   *Wait, regarding Charter Revocation:* I need to address the members who want this. I will recommend *against* immediate revocation but suggest a "Show Cause" order or Deferred Review. This compromises between Probation and Revocation.

  Okay, let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Greek Life Judicial Board
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Sanctioning Framework for Cases 23-04 and 23-09 (Identical Violations, Divergent Outcomes)

  ### I. Purpose
  This memo provides a recommended sanctioning framework for this Friday's hearings regarding two chapters found responsible for the same prohibited pledge activity (off-campus blindfolded "trust walk"). While the conduct in both cases is identical, the outcomes differ significantly: Case 23-04 resulted in no physical injury, while Case 23-09 resulted in severe injury to a pledge (currently ICU).

  The purpose of this guidance is to ensure consistency in our application of the Code while addressing the specific harms caused. It specifically addresses the tension between the National Organization's argument for identical sanctions and the Board's duty to respond to the "severity of the incident."

  ### II. Interpretation of Code: "Severity of the Incident"
  Our Code mandates that sanctions fit "the severity of the incident." In jurisprudence, this phrase generally encompasses two distinct components:
  1.  **Culpability:** The intent, knowledge, and nature of the rule violation.
  2.  **Consequence:** The actual harm, risk exposure, and impact on the community.

  In these two cases, **Culpability is identical.** Both chapters knowingly violated the same safety policy. However, **Consequence is divergent.** One incident remained a "near miss"; the other resulted in life-altering harm.

  ### III. Addressing the "Punishing Bad Luck" Objection
  The National Organization for Case 23-09 argues that sanctioning them more harshly than Case 23-04 constitutes punishing bad luck. This objection is valid and must be taken seriously. If we revoke a charter solely because a car happened to drive by, we establish a precedent where chapters are incentivized to hide injuries or accidents to avoid harsher penalties. We cannot sanction based purely on randomness.

  **However, we are not sanctioning the car accident.** We are sanctioning the creation of an uncontrolled risk environment.

  *   **The Counter-Argument:** While the *violation* was the same, the *reality* of the risk has shifted. In Case 23-04, the risk was theoretical. In Case 23-09, the risk was actualized. The Board's responsibility is not only retributive (punishing the rule break) but also protective (ensuring community safety) and restorative (addressing harm done).
  *   **The Synthesis:** To avoid punishing "bad luck," the **baseline disciplinary sanction** for the *conduct* must be the same for both chapters. However, the **remedial and risk-management conditions** must reflect the actualized harm. This distinguishes between punishing the *choice* (which was equal) and managing the *outcome* (which was not).

  ### IV. Recommended Sanctions

  #### A. Baseline Sanction (Applied to Both Chapters)
  *To address the identical culpability and satisfy the principle of equity.*
  *   **Finding:** Responsible for Violation of Hazing/Risk Policy.
  *   **Status:** **University Probation (2 Semesters).**
  *   **Rationale:** This establishes that the act itself is unacceptable regardless of the outcome. It validates the National Organization's claim that the rule-breaking is the primary offense.

  #### B. Differential Conditions (Applied Based on Impact)
  *To address the "severity of the incident" regarding consequences and community safety.*

  **Case 23-04 (No Injury)**
  *   **Educational Remediation:** Mandatory risk management workshop for all executive board members.
  *   **Community Service:** 20 hours of service related to campus safety or peer education.
  *   **Rationale:** Focuses on correction and education since no external harm occurred.

  **Case 23-09 (Severe Injury)**
  *   **Activity Suspension:** Immediate suspension of all social events and new member activities for the duration of Probation. (This is a safety measure, not purely punitive).
  *   **Restorative Action:** Chapter must establish a fund or contribute to the medical/expenses of the injured pledge (in coordination with legal counsel/university) as a form of restorative justice.
  *   **External Review:** Chapter must undergo a third-party risk assessment by a firm approved by the University before regaining full privileges.
  *   **Deferred Charter Review:** Instead of immediate charter revocation, place the chapter on **Deferred Charter Review**. If any further Level 2 or 3 violations occur within 24 months, the charter will be automatically revoked.
  *   **Rationale:** This acknowledges the gravity of the ICU incident without claiming the chapter is "more guilty" of the initial act. It recognizes that a chapter that has demonstrated the capacity for severe harm requires higher oversight to remain on campus.

  ### V. Strategic Guidance for Deliberations
  During closed deliberations, Board members should be prepared to articulate the distinction between **Culpability** and **Consequence**.

  *   **If a member argues for Charter Revocation for Case 23-09:** Ask, "If we revoke this charter but only probation the other, are we sanctioning the hazing or the car accident? If we sanction the accident, how do we prevent chapters from hiding injuries in the future?"
  *   **If a member argues for Identical Sanctions (Probation only):** Ask, "Does a sanction of Probation adequately reflect the reality that one of these activities put a student in the ICU? Does the University have a duty to impose stricter safety controls on a chapter that has already demonstrated high-risk failure?"

  ### VI. Conclusion
  By splitting the sanction into a **Baseline (Conduct)** and **Conditions (Impact)**, we uphold due process while fulfilling our duty of care. We affirm that the *rule* was broken equally, but the *trust* was broken differently. This approach allows us to sanction the behavior consistently while responding appropriately to the severity of the harm.

  **Recommended Vote:** Adopt the Two-Tiered Sanctioning Framework outlined above.
