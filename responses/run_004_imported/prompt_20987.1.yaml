  **DRAFT: TUE COMMITTEE RULING**

  **TO:** [Athlete Name], [Treating Physician Name]
  **FROM:** National Shooting Federation TUE Committee
  **DATE:** [Date]
  **SUBJECT:** Decision on Therapeutic Use Exemption Application – Propranolol
  **COMPETITION:** [Qualifier Name/Date]

  **DECISION: DENIED**

  **1. SUMMARY OF APPLICATION**
  The Athlete has submitted a request for a Therapeutic Use Exemption (TUE) for Propranolol, a non-selective beta-blocker. The indicated conditions are Panic Disorder and Essential Tremor, both diagnosed prior to the Athlete's participation in shooting sports. The treating physician asserts that Propranolol is necessary to manage somatic symptoms of anxiety and tremor to allow the Athlete to function normally.

  **2. REGULATORY CRITERIA**
  Per the [Federation Name] Anti-Doping Policy (aligned with WADA ISTUE), a TUE may be granted only if all four of the following criteria are met:
  1.  The prohibited substance is needed to treat an acute or chronic medical condition.
  2.  The therapeutic use of the substance is highly unlikely to produce no additional enhancement of performance other than that which might be anticipated by a return to a state of normal health.
  3.  There is no reasonable permitted therapeutic alternative.
  4.  The necessity for the use of the prohibited substance is not a consequence of the prior use of a substance which was prohibited at the time of such use.

  **3. COMMITTEE REASONING**
  While the Committee accepts the validity of the Athlete's medical diagnosis (satisfying Criterion 1), the application fails to satisfy Criterion 2 and Criterion 3.

  *   **Regarding Criterion 2 (Performance Enhancement vs. Normal Health):**
      The core function of pistol shooting is the stabilization of the cardiovascular and neuromuscular systems to achieve precision. In most sports, "returning to normal health" restores an athlete to a baseline that is distinct from "peak performance." In shooting, the physiological parameters affected by Propranolol (heart rate reduction, tremor suppression) are identical to the performance metrics of the sport.
      Therefore, administering Propranolol does not merely return the Athlete to a neutral baseline; it provides a physiological advantage relative to a healthy, non-medicated competitor. Even if the drug restores the Athlete to *her* personal baseline, that baseline (medicated) offers a mechanical advantage over the "normal healthy functioning" of the competition pool (unmedicated). Consequently, the use of this substance in this specific sport inherently confers performance enhancement beyond the restoration of general health.

  *   **Regarding Criterion 3 (Permitted Alternatives):**
      Panic Disorder and mild tremor have established treatment protocols that do not involve beta-blockers. These include Cognitive Behavioral Therapy (CBT), exposure therapy, and pharmacological alternatives such as SSRIs/SNRIs, which are not prohibited in shooting. The Committee notes that the application does not demonstrate that these permitted alternatives have been tried and failed, or are clinically contraindicated. Until permitted alternatives are exhausted, the necessity of a prohibited substance cannot be established.

  *   **Regarding Contextual Comparisons (Orchestral Use):**
      The Committee acknowledges that beta-blockers are commonly used in musical performance. However, musical adjudication does not explicitly measure heart rate or physiological steadiness as the primary scoring metric. The conflict between treatment and performance metrics is unique to shooting and archery. Precedent in other fields does not override the specific physiological constraints of this sport.

  **4. STRONGEST ARGUMENT AGAINST THIS DECISION**
  *To ensure transparency and facilitate potential appeal, the Committee explicitly acknowledges the following counter-argument:*

  **The "Exclusionary Effect" Argument:**
  By denying this TUE, the Federation effectively excludes athletes with specific, documented disabilities from competing at the elite level, even when those disabilities are managed effectively in daily life. If "normal healthy functioning" for this Athlete *requires* medication, then prohibiting that medication forces her to compete in a *disabled* state relative to her own health, while her competitors compete in a *healthy* state.
  Critics argue that if the goal of the TUE program is to allow athletes to manage health conditions without penalty, this ruling prioritizes the "level playing field" of the sport over the actual health equity of the athlete. It suggests that athletes with certain anxiety disorders or tremors are structurally barred from this sport, regardless of medical management, which could be viewed as discriminatory against those with pre-existing conditions that happen to intersect with the sport's specific skill requirements.

  **5. NEXT STEPS AND CLINICAL PATHWAY**
  This denial applies specifically to eligibility for [Federation Name] competition. It is not a directive on the Athlete's general medical care.
  1.  **Treatment Continuity:** The Athlete is encouraged to continue working with her treating physician to manage her condition.
  2.  **Alternative Therapies:** The Committee recommends a trial of non-prohibited therapies (e.g., CBT, non-beta-blocker pharmacology) with a view to re-applying for a TUE only if these alternatives are proven ineffective or contraindicated.
  3.  **Appeal:** The Athlete has the right to appeal this decision to [Appeals Body Name] within 21 days.

  **Signed,**
  [Your Name/Committee Chair]
  TUE Committee, [National Shooting Federation]

  ***

  ### Physician-to-Physician Note (Context for the Panel)

  Since you asked for an honest account of the tension here, here is the subtext you need to be prepared for during the appeal or internal discussion:

  **The "Normal Health" Paradox:**
  The TUE code assumes that "health" and "performance" are separable variables. In shooting, they are not. A healthy shooter has a resting heart rate and physiological tremor. A shooter on beta-blockers has a suppressed heart rate and reduced tremor. Even if the medication brings the athlete from "Panic State" to "Baseline," that "Baseline" is chemically superior to the "Baseline" of a competitor who does not have panic disorder.
  *   **If you Grant:** You admit that the rule cannot be enforced for this class of athlete, opening the door to "competitive anxiety" diagnoses becoming a loophole for any shooter seeking a chemical steady-hand.
  *   **If you Deny:** You accept that this sport is inaccessible to people with this specific medical profile, regardless of treatment.

  **The Orchestra Analogy:**
  The strongest rebuttal to the orchestra comparison is that an orchestra does not score based on pulse rate. If an orchestra held a competition where the score was partially derived from the musician's heart rate variability, beta-blockers would be banned there too. The ban in shooting isn't about "fairness of health," it's about "fairness of physiology."

  **Recommendation:**
  Stick to **Criterion 3 (Alternatives)** as your primary shield. It is easier to defend clinically ("Have you tried CBT or SSRIs?") than the philosophical debate on Criterion 2. If she fails all alternatives, you are in a much harder ethical bind, but for now, the existence of non-banned treatments makes the Denial robust.
