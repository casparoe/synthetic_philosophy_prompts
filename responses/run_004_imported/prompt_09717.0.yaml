prompt: |-
  I have been asked to give the commencement address for a physics department's graduating PhD cohort. The department's top dissertation prize is named for Émilie du Châtelet, and the chair has asked that the address engage with the actual argument of her "Discourse on Happiness" rather than the usual Newton-translator anecdote. Her claim, briefly: because love, ambition, and reputation all depend on luck and on other people, lasting happiness requires one passion that depends on nothing but oneself and does not fade with age, rejection, or bad luck — for her, that passion was study. Half the room will be physicists who have lived through the job-market grind and will wince at anything glib; the other half will be family who have never heard of her and just want a happy send-off. Make her argument do real work for graduates facing years of postdocs and grant rejections, without collapsing into a generic "find your passion" platitude or turning into a lecture on the eighteenth-century exclusion of women from the academy — even though that exclusion is exactly why she needed such an argument in the first place. Write the address (about seven minutes).
reasoning: |-
  Here's a thinking process that leads to the commencement address:

  1.  **Analyze the Request:**
      *   **Occasion:** PhD Commencement Address for a Physics Department.
      *   **Audience:** 50% Physicists (jaded, job-market weary, skeptical of platitudes), 50% Family/Friends (supportive, unfamiliar with academic nuance or Émilie du Châtelet).
      *   **Key Constraint:** Engage with Émilie du Châtelet's *Discourse on Happiness* (specifically her argument about self-sufficient passion), *not* the usual "she translated Newton" anecdote.
      *   **Core Argument:** Happiness requires a passion dependent only on oneself, immune to luck/age/rejection. For her, it was study.
      *   **Tone:** Authentic, not glib, not a generic "follow your passion" speech, not a history lecture on sexism (though acknowledging context implicitly).
      *   **Length:** About 7 minutes (roughly 900-1100 words spoken at a moderate pace).
      *   **Goal:** Make her argument useful for graduates facing postdocs/grant rejections.

  2.  **Deconstruct Du Châtelet's Argument:**
      *   *Premise:* External validation (love, fame, ambition) is fragile because it relies on others and luck.
      *   *Conclusion:* To be happy, you need an internal engine. A passion that is self-sustaining.
      *   *Application:* For physicists, "study" (the work itself) must be that engine, not the *result* of the work (papers, jobs, tenure).
      *   *Nuance:* This isn't "love your work so much you don't need money." It's "protect your relationship with the work from the volatility of the market."

  3.  **Address the Audience Tension:**
      *   *Physicists:* They know the job market is brutal. Telling them "just love physics" sounds like exploitation. I need to acknowledge the pain of rejection. The argument must be a survival mechanism, not a moral imperative.
      *   *Family:* They need to understand why this matters. They need to see the resilience in the graduates. Avoid jargon.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the honor. Name-drop the prize (Du Châtelet). Immediately pivot away from the Newton translation trope. Set the stage: This is about *happiness*, not just physics.
      *   **The Context (Brief & Subtle):** Acknowledge she was an outsider (woman in 18th century) without making it a history lecture. Use it to frame *why* she needed this philosophy. She couldn't rely on the academy accepting her; she had to rely on the work itself.
      *   **The Core Argument:** Explain the *Discourse on Happiness*. External vs. Internal. Love, fame, ambition = luck. Study/Passion = self.
      *   **The Application (The Hard Part):** Address the physicists directly. The job market. The grant rejections. The postdoc grind.
          *   *Risk:* Sounding like "work harder."
          *   *Fix:* Frame it as "insulation." If your happiness depends on the *outcome* (the job), you will be miserable. If it depends on the *act* (the understanding), you survive the noise.
      *   **The Family Angle:** Explain to the families that this resilience is what they are seeing. It's not stubbornness; it's a strategy for endurance.
      *   **Closing:** Bring it back to the present. The degree is proof of the passion, not just the credential. Send them off with the idea that the work belongs to them, regardless of where they work.

  5.  **Refining the Tone (Self-Correction during drafting):**
      *   *Check:* Is this too preachy? *Adjustment:* Use "we" and "I" where possible. Acknowledge that this is hard.
      *   *Check:* Is it too historical? *Adjustment:* Keep Du Châtelet's biography minimal. Focus on the text.
      *   *Check:* Is it too depressing about the job market? *Adjustment:* Acknowledge the reality but focus on agency.
      *   *Check:* Is it 7 minutes? *Adjustment:* Word count check. 1000 words is roughly 7 minutes at 140 wpm.

  6.  **Drafting - Specific Phrasing:**
      *   Instead of "Follow your passion," say "Protect your relationship with the work."
      *   Instead of "Women were excluded," say "She knew the doors might remain closed."
      *   Instead of "You will get rejected," say "The noise of the market is inevitable."

  7.  **Final Polish:**
      *   Ensure the transition between the 18th century and the 21st-century job market is smooth.
      *   Make sure the ending feels uplifting but grounded.

  *(Self-Correction Note during drafting)*: I need to be careful not to imply that studying physics is enough to pay the bills. Du Châtelet was wealthy; these students are not. I must distinguish between *happiness/meaning* and *livelihood*. The argument is about where to anchor the *self*, not how to pay rent. I will add a line acknowledging that this doesn't solve material insecurity, but protects the spirit.

  8.  **Final Review against constraints:**
      *   Du Châtelet's *Discourse* argument? Yes.
      *   No Newton translator anecdote? Yes.
      *   No generic "find passion"? Yes.
      *   No lecture on sexism (but acknowledged)? Yes.
      *   7 minutes? Looks right.

  9.  **Final Word Count Check:** Aiming for ~1000-1100 words.

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  Thank you, Chair [Name], colleagues, families, and most importantly, the graduating class of [Year].

  It is a profound honor to stand here. I know that in physics departments, the "top dissertation prize" often comes with a standard story. Usually, it involves a woman in a salon, translating Newton, and being a muse to Voltaire. It is a nice story. It is also, for our purposes tonight, insufficient.

  The prize you received is named for Émilie du Châtelet. But the text I want to talk about is not her translation of the *Principia*. It is her *Discourse on Happiness*.

  I want to talk about this text because half of you in this room have spent the last five years running code that crashed, debugging experiments that failed, and waiting on emails from hiring committees that never arrived. The other half of you are family members who have watched your loved ones endure that grind, wondering why they keep going.

  Du Châtelet wrote her *Discourse* in the 1740s. She was a woman in a field that formally did not want her. She knew that ambition, reputation, and even love were fragile things. She argued that if your happiness depends on how other people treat you, or on the luck of the draw, you will be miserable. She wrote that lasting happiness requires a passion that depends on nothing but oneself. A passion that does not fade with age, rejection, or bad fortune. For her, that passion was study.

  Now, I can hear the groans from the postdocs in the back. This sounds like the setup for a platitude. It sounds like I am about to tell you to "follow your passion" so you never work a day in your life.

  I am not going to say that.

  We live in a material world. We know that passion does not pay rent. We know that the academic job market is not a meritocracy; it is a bottleneck. If I tell you that loving physics is enough, I am ignoring the reality that you need a position, a grant, a visa, a salary. Du Châtelet herself was wealthy; she had the privilege to study without worrying about her next meal. Most of you do not.

  So, how does an 18th-century argument help you face a 21st-century job market?

  It helps if we stop viewing her argument as a moral imperative and start viewing it as a survival strategy.

  Du Châtelet's point was not that you should ignore the world. It was that you must protect your internal engine from the volatility of external validation.

  For the last half-decade, you have been trained to measure your worth by output. By papers published. By citations. By the prestige of the institution offering you a postdoc. These are the things Du Châtelet would classify as "dependent on luck and other people." They are outside your control. If you anchor your happiness to them, you are anchoring a ship in a storm to a floating dock.

  When the grant gets rejected, if your sense of worth is tied to the grant, you break. When the job market freezes, if your identity is tied to the job title, you freeze with it.

  Du Châtelet argues for a different anchor. She argues that the act of understanding itself—the sheer, private friction of your mind against the problems of the universe—must be the source of the fuel. Not the *result* of the work. The *work*.

  This is not about working harder. It is about ownership.

  To the graduates: You have spent years mastering tools that very few people on this planet possess. You look at the cosmos and you see structure where others see noise. That capacity belongs to you. It cannot be fired. It cannot be rejected by a hiring committee. It does not vanish if you move into industry, or teaching, or policy.

  If you can locate your satisfaction in the *doing*—in the clarity of the derivation, in the elegance of the model, in the rigor of the analysis—you build a fortress around your intellectual life. The market will fluctuate. The funding cycles will boom and bust. But the relationship you have built with the truth is yours.

  To the families and friends in the audience: You may have worried that your graduates were chasing something too elusive. You saw the stress. You saw the late nights. Du Châtelet's argument explains why they persisted. They were not just chasing a credential. They were cultivating a capacity. When they talk to you about their work, they aren't just talking about a job. They are talking about the one thing they have that is entirely their own. Support them not just in finding a position, but in protecting that spark.

  Du Châtelet wrote this while knowing the doors of the Academy might remain closed to her. She wrote it knowing she might never get the credit she deserved. And yet, she found happiness in the work. She found a freedom that no institution could grant and no exclusion could revoke.

  She was right about the physics, obviously. But she was also right about the life.

  So, as you leave this department, you will face noise. You will face rejection. You will face moments where the external world tells you that you are not enough, or that you are in the wrong place, or that you are too late.

  When that happens, remember the *Discourse*. Do not let the volatility of the market dictate the value of your curiosity. Do not let the silence of a hiring committee convince you that you have nothing to say.

  Keep the passion that depends on yourself. Keep the study. Keep the work. Because the degree you receive today certifies that you know physics. But the life you live tomorrow will depend on whether you remember that the joy of understanding is the only thing that is truly tenure-track.

  Congratulations.
