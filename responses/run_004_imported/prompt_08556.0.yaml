answer: |-
  # The Architectural Limit of Epistemic Modesty

  The intellectual lineage of Overcoming Bias and LessWrong has always been haunted by a specific ghost: Aumann's Agreement Theorem. For the early community, it was a beacon of rationalist hope—a mathematical proof that honest, rational agents cannot agree to disagree. If you and I truly understand each other's beliefs and reasons, we must converge. But as you note, this hope rests on a load-bearing assumption that many have found suspicious: the Common Prior Assumption (CPA).

  Robert Aumann proved that if two Bayesians share a common prior and have common knowledge of each other's posteriors, their posteriors must be identical. The theorem says nothing about what happens if priors differ. John Harsanyi, the father of games of incomplete information, simply stipulated that rational agents *must* share a common prior, treating divergent priors as a form of irrationality akin to holding contradictory beliefs. But this always felt like a fiat, a modeling convenience rather than a truth about minds.

  Robin Hanson attempted to derive the CPA from deeper principles with his "Uncommon Priors Require Origin Disputes" argument. His claim is that if two agents agree on the causal story of how they acquired their priors (their genetics, upbringing, and data processing), they are logically committed to sharing a prior. To disagree on priors while agreeing on origins is to claim, "My causal history is more truth-tracking than yours," which violates a pre-rational symmetry condition.

  Your friend argues this vindicates strong epistemic modesty: if you cannot prove your origin is superior, you must defer to the peer. I argue this is a category error. Hanson's argument is logically valid for ideal Bayesian agents but fails to bind human reasoners because it treats cognitive architecture as propositional belief. The Common Prior Assumption is **not binding on bounded agents**, and the practical license it grants is not automatic deference, but a protocol of **asymmetry auditing**.

  ### The Technical Bottleneck

  To understand why Hanson's rescue attempt fails, we must first be precise about why Aumann's theorem requires a common prior.

  In Bayesian updating, a posterior belief is a function of two inputs: the prior probability distribution and the new evidence (likelihood). If two agents observe the same evidence but start with different priors, they will mathematically necessarily arrive at different posteriors. Aumann's theorem works by showing that if agents have *common knowledge* of their posteriors, they effectively pool their information. If they share a prior, this pooled information forces their posteriors to coincide.

  Without a common prior, the theorem collapses. If I start believing the coin is biased toward heads (90%) and you start believing it is biased toward tails (90%), we can look at the same sequence of flips, update correctly according to our own priors, and never agree. Harsanyi's doctrine attempts to close this loophole by defining rationality such that having a different prior *is* the irrationality. He posits that all differences in belief must be attributable to differences in information, not differences in initial probability assignments.

  Hanson's contribution was to ask *why*. Why should rationality demand a common prior? His answer relies on a "veil of ignorance" over cognitive origins. Imagine we step back before we existed, knowing only the physical laws and the distribution of possible minds that could evolve. From this "pre-rational" vantage point, we should assign equal probability to being any specific mind in that distribution. Therefore, if we meet in the real world and agree on the causal story of how we came to be (e.g., "We are both humans evolved on Earth, educated in similar systems"), we should treat our priors as samples from the same distribution. To claim your prior is better is to claim your specific sample was privileged, which requires evidence of asymmetry in the origin story.

  ### The Architectural Objection

  Hanson's argument is elegant, but it relies on a sleight of hand that works for abstract agents but breaks for humans. It assumes that a "prior" is a piece of data that an agent *has*, rather than a description of what an agent *is*.

  For an ideal Bayesian, the prior is a probability distribution over states of the world. It is an object the agent can inspect, compare, and update upon. For a human, the "prior" is inextricably woven into our cognitive architecture—our heuristics, our neural weights, our intuitive sense of plausibility. I cannot inspect my prior in the same way I inspect my belief about the weather. I *am* my prior.

  This leads to the **First-Person Privilege Problem**. Hanson's argument requires that I treat my own mind as a black box equivalent to yours, sampled from a common distribution. But I do not experience my own reasoning as a black box. I experience it as *reasoning*. When I check my work, I feel the force of the logic. When I check yours, I only see the output.

  To satisfy Hanson's condition, I must believe that the feeling of logical necessity I experience is no more reliable than the output you produce. But I cannot genuinely believe that. To do so would require me to doubt the very faculty I am using to evaluate the doubt. This is not a dispute about origins that can be settled by sharing causal stories; it is a structural asymmetry in access. I have introspective access to my own error-correction processes; I do not have access to yours. Therefore, the condition "agree on the causal story of origins" is never actually met between humans. I always know more about my own origin (my immediate mental state) than I do about yours.

  Furthermore, Hanson's argument presupposes that the "origin story" is a shared factual matter. But in deep disagreements, the origin story is often the contested variable. If I think you are biased, I believe your origin story includes "exposure to propaganda." You believe your origin story includes "exposure to truth." We do not agree on the causal story. Hanson's theorem only kicks in *after* we agree on the causes of our beliefs. But in the hard cases that matter—politics, philosophy, complex science—we rarely agree on the causes.

  ### The Verdict

  Here is the definite verdict: **The Common Prior Assumption is false for human reasoners.**

  It is not merely that we lack the computational power to satisfy Aumann's conditions (logical omniscience); it is that our priors are architectural constraints, not propositional attitudes. We cannot "update" our priors to match a peer's in the way we update a belief about a stock price, because the prior is the engine doing the updating.

  Hanson's "Origin Dispute" argument succeeds in showing that *if* two agents could view their own cognitive algorithms as external objects sampled from a known distribution, they would have to converge. But humans cannot do this. We are trapped in the first-person perspective. Therefore, the rational requirement to share a prior does not bind us.

  This does not mean "anything goes." It means that the burden of proof for deference is higher than Hanson suggests. You are not rationally compelled to average your belief with a peer's simply because you cannot prove your origin is superior. The inability to prove superiority is the default human condition, not a specific epistemic deficit.

  ### Practical License: Asymmetry Auditing

  If the CPA does not bind, what does this license in practice? It rejects both the strong deference Hanson's friend advocates and the stubborn independence of the naive realist. It mandates a protocol of **Asymmetry Auditing** followed by **Moderate Conciliationism**.

  1.  **Audit for Asymmetry:** When you encounter a genuine epistemic peer who disagrees with you, do not immediately update toward them. Instead, investigate the *causal origins* of the disagreement. Look for specific asymmetries in information, processing power, or bias.
      *   *Do they have data you lack?* (Information asymmetry)
      *   *Are they incentivized to believe differently?* (Motivational asymmetry)
      *   *Are they operating outside their domain of expertise?* (Competence asymmetry)
      *   *Are you emotionally invested in a way they are not?* (Bias asymmetry)

      If you find a credible asymmetry that favors you (e.g., you did the math, they read the headline), Hanson's condition is not met, and you are not required to defer. This aligns with Yudkowsky's argument in *Inadequate Equilibria*: modesty is not a virtue when you have evidence of superior positioning.

  2.  **Moderate Conciliationism:** If, after a good-faith audit, you find no specific asymmetry—you cannot explain why you are right and they are wrong other than "I feel I am"—*then* you must update. However, you do not need to split the difference 50/50.
      *   Because you have first-person access to your own reasoning coherence, you are licensed to retain some weight on your own view.
      *   However, the mere existence of the disagreement is evidence that your cognitive architecture might be misfiring in this domain.
      *   **The Rule:** Update your confidence toward the peer's position by a significant margin (e.g., 20-40%), enough to acknowledge the possibility of architectural error, but not so much that you abdicate your own judgment entirely.

  3.  **Meta-Uncertainty:** Finally, acknowledge that the disagreement itself lowers the certainty of *both* parties. If two calibrated instruments disagree, the truth is likely not that one is right and the other wrong, but that the environment is noisier than either instrument modeled. Increase your uncertainty bounds.

  ### Conclusion

  Hanson's "Uncommon Priors" argument is a beautiful piece of ideal theory that clarifies what rationality *would* look like from a God's-eye view. But we are not gods, and we are not ideal Bayesians. We are bounded agents with opaque cognitive architectures and privileged first-person access. The Common Prior Assumption is a useful regulative ideal—a reminder to seek symmetry—but it is not a binding law that forces automatic deference.

  When you meet a peer who disagrees, do not blindly defer. Do not stubbornly resist. Audit the origins of the disagreement. If you find no asymmetry, treat the disagreement as evidence that the world is more complex than your prior allowed, and move toward them, but keep your feet on the ground of your own reasoning. That is the only epistemic modesty a human can actually practice.
