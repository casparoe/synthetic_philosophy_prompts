answer: |-
  **MEMORANDUM**

  **TO:** Fellowship Selection Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Finalist Work Sample Structure

  ### Executive Summary
  I recommend we **modify** the current finalist work sample rather than keeping it as-is or dropping it entirely. Specifically, we should reduce the time burden (from 5 days to ~2 days) and introduce a modest stipend for the work sample phase.

  This approach preserves the screening value of the task (testing research competence) while correcting for a signaling failure: the current structure selects for *economic liquidity* rather than *research potential*.

  ### The Signaling Analysis
  The argument to "keep it" rests on a specific interpretation of signaling theory: that unpaid labor acts as a Handicap Principle (Zahavi/Grafen) filter, where only candidates with high "commitment" (the desired trait) are willing to bear the cost.

  However, for a signal to create a stable *separating equilibrium* (Spence), the marginal cost of the signal must be lower for the high-quality type than for the low-quality type.
  *   **The Desired Trait:** Research talent, grit, and independent thinking.
  *   **The Current Signal:** 120 hours of unsupervised time.

  **The Problem:** The cost of 120 hours is not differentially cheaper for talented researchers. A brilliant candidate working two jobs to support a family faces a *higher* marginal cost for that time than a less talented candidate with substantial savings or no dependents.

  Consequently, the current task is not a true handicap signal of research ability; it is a **bonding mechanism for liquidity.** It filters for "people who can afford to work for free," which correlates with socioeconomic background, not necessarily research promise. We are currently paying a deadweight loss in talent diversity to signal "seriousness," but we are signaling *our* selectivity rather than testing *their* capability.

  ### Recommendation: The "Paid Sprint" Model
  We should shift from testing *endurance* to testing *intensity*.

  1.  **Reduce Scope:** Compress the work sample into a 2-day "sprint" task (e.g., a specific literature critique or narrow proposal outline) rather than a 5-day open-ended proposal.
  2.  **Introduce Stipend:** Pay all finalists a flat fee (e.g., $500) for completing the sprint.
  3.  **Increase Evaluation Rigor:** Since we are removing the "who can suffer more" filter, we must sharpen the rubric on the output itself. The signal becomes the *quality of the work*, not the *unpaid nature of the labor*.

  **Why this works on signaling terms:**
  *   **Honesty:** High-talent candidates can produce superior work in less time. Low-talent candidates cannot fake quality even if they have free time.
  *   **Reciprocity:** Paying the stipend signals *our* commitment to the field. It attracts candidates who view research as professional work, not a hobby for the wealthy.
  *   **Feasibility:** As this is only for finalists (not all applicants), the cost is contained. If we have 10 finalists, the cost is ~$5,000, which is a small premium to ensure we aren't filtering out the best talent due to cash-flow constraints.

  ### Implementation Timeline
  Assuming we vote to adopt this at the next meeting:

  *   **Nov 15:** Finalize the new 2-day task prompt and evaluation rubric.
  *   **Dec 1:** Determine stipend amount and secure funds from the operating budget.
  *   **Jan 10:** Update public fellowship guidelines and FAQ to reflect the new process.
  *   **Feb 1:** Open applications for the next cohort under the new rules.

  ### Conclusion
  The "Keep It" camp is correct that we need a filter for seriousness. But in signaling terms, we need a filter that is *correlated with talent*, not one that is *correlated with wealth*. By paying for the work sample, we purchase the right to judge candidates solely on their output, ensuring our selection criteria actually match our mission.

  I look forward to discussing this in the next session.
