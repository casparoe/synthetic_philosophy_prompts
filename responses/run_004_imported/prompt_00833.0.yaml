      *   *The "Confession":* Is the *Memoir* note a private admission of the *Methods* problem? Yes. The *Methods* ends aporetically (with a "fundamental contradiction"). The note says "I can't be rational without resolving this."
      *   *Why Faith?* If the universe is indifferent (materialist/atheist), then Egoism wins (why sacrifice self-interest for the greater good if death is the end?). To make Utilitarianism *rationally binding* over Egoism, you need a sanction. Sidgwick thinks religious sanctions (divine reward/punishment) are the only thing that historically and logically bridges the gap.
