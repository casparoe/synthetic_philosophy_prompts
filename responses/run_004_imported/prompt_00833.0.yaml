      *   *Kantian Angle:* Yes, this smells like Kant's *practical postulates*. Kant says we must *postulate* God/Immortality to make sense of the Highest Good. Sidgwick is often seen as anti-Kantian, but here he converges.
      *   *Sidgwickian Nuance:* Sidgwick distinguishes between *theoretical* reason (what is true) and *practical* reason (what to do). If theoretical reason can't prove the moral order, but practical reason collapses without it, "hope" might be the emotional correlate of a "practical postulate."
