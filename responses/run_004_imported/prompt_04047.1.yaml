      *   *Correction:* Todhunter says Condorcet argues that "however large may be the probability of the correctness of a single decision, we cannot escape having a large probability that in the course of many decisions some innocent person will be condemned." This is the "Long Run" argument.
      *   *Check:* How does the mortality table fit in?
      *   *Correction:* That sets the *standard* of "negligible risk." It defines the unit of measurement. "We ignore risk $X$ in daily life. Judicial error risk $Y$ is greater than $X$. Therefore we cannot ignore $Y$."
      *   *Refinement:* Make sure to distinguish between the *threshold* (mortality tables) and the *accumulation* (long run error). Both are needed.

  7.  **Final Polish:**
