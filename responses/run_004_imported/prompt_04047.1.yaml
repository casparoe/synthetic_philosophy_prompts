prompt: |-
  Quick research question that's eaten my whole afternoon. Im drafting a novel set in Paris during the Terror with a secondary character who's basically Condorcet with the serial numbers filed off — mathematician, revolutionary, spends his last months hiding from a Convention warrant, still working right up until they finally catch him. I want one scene where he explains to someone who thinks he's gone soft in the head that his opposition to the guillotine isn't sentiment, it actually falls out of his own probability work. So I went hunting for what that argument actually was and fell into an 1865 book by the Cambridge mathematician Isaac Todhunter, "A History of the Mathematical Theory of Probability," which has a whole chapter on Condorcet and is, frankly, pretty savage about him — at one point Todhunter says the "obscurity and self-contradiction are without any parallel" in Condorcet's actual prose. I found a free scan on archive.org, and buried in the chapter is the bit below (I've bracketed the spots where the OCR mangled a fraction):

  710. Condorcet now proceeds to the second question, which we have seen in Art. 695 that he proposed to consider — namely, the numerical value of the probability which ought to be obtained in various cases. This discussion is interesting, but not of much practical value. Condorcet notices an opinion enunciated by Buffon. Buffon says that out of 10,000 persons one will die in the course of a day; but practically the chance of dying in the course of a day is disregarded by mankind; so that 1/10,000 may be considered the numerical estimate of a risk which any person is willing to neglect. Condorcet objects to this on various grounds, and himself proposes a different numerical estimate. He finds from tables of mortality that the risk for a person aged 37 of a sudden death in the course of a week is [a fraction, mangled in the scan], and that the risk for a person aged 47 is [also mangled]. He assumes that practically no person distinguishes between these two risks, so that their difference is in fact disregarded; and it is this tiny difference that Condorcet proposes to take as a risk which a man would practically consider equivalent to zero in the case of his own life.

  711. Condorcet considers, however, that the risk which we may with propriety neglect will vary with the subject to which it relates. He specially considers three subjects: the establishment of a new law, the decision between claimants as to the right to a property, and the condemnation of an accused person to capital punishment. We may observe that he records the opinion that capital punishments ought to be abolished, on the ground that, however large may be the probability of the correctness of a single decision, we cannot escape having a large probability that in the course of many decisions some innocent person will be condemned. See his pages cxxvi, 241.

  I can parse each individual sentence fine but I keep losing the thread of the actual argument connecting them. Could you walk me through how he gets from "here's a risk gap people already shrug off every day" to "therefore, no executions"? And seperately — is this the same reasoning as the famous Condorcet Jury Theorem people cite in democracy theory (more voters or judges means a more reliable verdict), or is it a genuinely different argument that just happens to reuse the same probability toolkit? My hunch is it's different — one seems to be about how trustworthy a single verdict is, the other about what happens when you run an already-trustworthy process over and over across many separate cases — but I don't trust my own math enough to put confident words in a character's mouth. And if the argument has a hole in it (say, it actually proves too much and would condemn any punishment whatsoever, not just execution), I'd love to know that too, since that's the kind of comeback the other character in the scene ought to be able to make.
