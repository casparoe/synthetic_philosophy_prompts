answer: |-
  This is a fantastic detail to hang a scene on. It captures the specific Enlightenment madness of believing you can calculate morality, which fits the Terror perfectly. You are right to be suspicious of the logic thread; Condorcet is notoriously dense, and Todhunter (who was writing a century later with the benefit of hindsight and a more rigorous definition of probability) is actively hostile to him.

  Here is the breakdown of the argument, the distinction from the Jury Theorem, and the ammunition you need for the counter-argument.

  ### 1. The Logical Thread: From Mortality Tables to the Guillotine

  Condorcet is trying to establish an **objective threshold for "moral certainty."** He wants to move justice from "I feel sure" to "The math says this is safe."

  Here is the step-by-step chain your character would use:

  1.  **Define "Negligible Risk" ($\epsilon$):** How do we know when a risk is small enough to ignore? Buffon suggested 1 in 10,000 per day. Condorcet refines this using mortality tables. He observes that a 37-year-old and a 47-year-old face slightly different risks of sudden death within a week, yet humans treat these risks as identical. Therefore, the *difference* between those two risks is the mathematical limit of human concern. Let's call this number $\epsilon$ (epsilon). It is the smallest risk a rational man disregards in his own life.
  2.  **The Asymmetry of Consequences:** In a property dispute, if the judge errs, money changes hands. It is reversible. In a capital case, if the judge errs, a life is lost. It is irreversible. Therefore, the risk of error allowed in a capital case must be lower than in a property case.
  3.  **The Constraint:** To execute a man is morally permissible *only if* the probability of his innocence is lower than $\epsilon$ (the risk we ignore when crossing the street or waking up in the morning). We cannot demand a higher standard of safety from the State than we demand from Nature.
  4.  **The Judicial Reality:** Human testimony is flawed. Witnesses lie, judges are tired, evidence is circumstantial. Condorcet argues that no human judicial process can guarantee an error rate lower than $\epsilon$.
  5.  **The Accumulation (The Todhunter Quote):** Even if you claim your process is 99.9% accurate (which is generous), if the Republic tries 1,000 capital cases, the math dictates you *will* execute innocent people.
  6.  **The Conclusion:** Since the risk of executing an innocent person ($P_{error}$) is demonstrably higher than the risk of sudden death we accept in daily life ($\epsilon$), and since the State should not kill with less certainty than Nature does, capital punishment is mathematically illegitimate.

  **In character voice:**
  > "You call it mercy. I call it arithmetic. If I walk from here to the Seine, I accept a risk of death so small my mind cannot register it. That is the limit of human fear. But the Tribunal? Their margin of error is a thousand times larger. To sign a death warrant is to claim a certainty that God does not possess. If the math says one innocent in a thousand must die, then the law is not a shield. It is a lottery."

  ### 2. Is this the Condorcet Jury Theorem?

  **Your hunch is correct: It is a genuinely different argument.** In fact, they are almost philosophical opposites.

  *   **The Jury Theorem (1785):** This is **Epistemic Optimism**. It states that if each voter is slightly more likely to be right than wrong ($p > 0.5$), adding more voters drives the probability of a *correct majority decision* toward 100%. This argument is used to defend **Democracy and Republics**. It says: "Trust the crowd."
  *   **The Anti-Guillotine Argument (1790s):** This is **Epistemic Humility**. It focuses on the *residual error rate* over *multiple trials*. It says: "Even if the crowd is usually right, the cumulative probability of a catastrophic error approaches certainty over time." This argument is used to defend **Human Rights and Due Process**. It says: "Distrust the crowd's power to kill."

  **Why this matters for your novel:**
  This creates a beautiful internal conflict for your Condorcet-analogue. He likely helped design the Republic using the Jury Theorem (believing in the wisdom of the voters), but now sees that same Republic using the guillotine. He realizes that while the *vote* might be democratic, the *consequence* is mathematically intolerable. He is trapped between his math that builds the state and his math that condemns its violence.

  ### 3. The Holes (Ammunition for the Opposing Character)

  If the other character wants to tear this argument apart, here are the three strongest counters. These are historically grounded in the arguments of the Jacobins and Robespierre (who viewed terror as justice).

  **A. The "Risk of Inaction" Counter**
  Condorcet calculates the risk to the *accused*. He ignores the risk to the *public*.
  *   **The Argument:** "You calculate the risk of killing an innocent man. What is the probability that sparing a guilty tyrant leads to the death of ten thousand innocents? If we do not execute the enemies of the Republic, the Republic falls. Your math balances one life against the safety of the Nation. That is not math, Citizen. That is treason."
  *   **The Hole:** Condorcet's framework treats the execution as an isolated event. It doesn't account for utilitarian calculus (one death prevents a civil war).

  **B. The "Too Much" Counter (Reductio ad Absurdum)**
  If the threshold is "negligible risk," this logic bans everything, not just executions.
  *   **The Argument:** "By your own mortality tables, surgery carries a risk greater than $\epsilon$. War carries a risk greater than $\epsilon$. Even imprisoning a man carries the risk he dies of fever in his cell. If we follow your 'negligible risk' to its end, the State can do nothing. It cannot defend itself. It cannot judge. It can only watch. A Republic that cannot act is a corpse."
  *   **The Hole:** Condorcet's standard is arguably *too* high for any human institution to function. It proves too much.

  **C. The "Static Probability" Counter**
  Condorcet assumes the error rate of the courts is fixed.
  *   **The Argument:** "You say the courts are flawed. Then fix the courts! Do not abolish the penalty because the judges are blind. Sharpen their sight. Your math assumes human fallibility is a constant. But we are making men new. The New Man does not lie. The New Tribunal does not err. You are using old math for a new world."
  *   **The Hole:** This is the revolutionary fanaticism talking. It assumes political will can override statistical reality. It's a great line for a fanatic, but mathematically false.

  ### 4. Historical Note for Flavor

  Condorcet actually wrote *Sur l'application de l'analyse à la probabilité des décisions rendues à la pluralité des voix* (On the Application of Analysis to the Probability of Majority Decisions).

  In reality, Condorcet was arrested in 1794. He was found dead in his cell the next morning. The official story was natural causes (heart failure/stroke), but it was widely believed he took poison (he reportedly carried a ring of poison like many Girondins).

  If you want a killer detail for the scene: Condorcet believed that **probability could cure politics.** He thought if you could just quantify the "right" decision, factionalism would end. The tragedy of his life is that he used math to design a system that ultimately used math to justify hunting him down.

  **Suggested Dialogue Snippet:**

  > **Critique:** "You speak of risk like it's a debt to be balanced. But the Nation is not a ledger."
  >
  > **Condorcet-Analogue:** "No. It is a machine. And if the machine crushes one finger in every thousand turns, you do not say 'the machine is mostly good.' You say the machine is broken. I will not oil a machine that eats children."
  >
  > **Critique:** "And if the machine stops, the wolves come in. Who calculates the risk of the wolves, Citizen Mathematician? Is that in your tables?"
  >
  > **Condorcet-Analogue:** "Then we build a cage, not a blade. A cage can be opened if we are wrong. A blade cannot. That is the only variable that matters."

  This keeps the focus on the **irreversibility** of the error, which is the core of his probabilistic moral argument.
