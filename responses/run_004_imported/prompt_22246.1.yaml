prompt: |-
  So my friend Alex and I got into a whole thing last week about Kant's universalizability test — like a solid hour arguing over text messages after we couldn't even finish the conversation at dinner. It started because Alex claimed that lying about being sick to skip a boring commitment fails the test in a pretty straightforward way ("if everyone did that, being sick would stop meaning anything as an excuse") — basically Kant's false-promising example in a hoodie. I said fine, but then what about maxims like "I'm going to become a professional violinist"? That's obviously not immoral, but it also can't be willed as something literally everyone does at once, so doesn't the test wrongly convict it too? Alex said I was botching the maxim's formulation, and that there's supposedly a difference between a maxim being flat-out inconceivable as a universal law (contradiction in conception, I think?) versus one you just couldn't rationally will even though its conceivable (contradiction in the will), and that my example wasn't even the right kind of case for that distinction. We also half-remembered that some Kant scholar — Herman? Korsgaard? neither of us was sure — pointed out that the whole test is hostage to how you describe the maxim in the first place, like you can dodge almost any verdict by phrasing things narrowly enough, and we couldn't agree on how big a problem that's actually supposed to be.

  Anyway we never resolved it, we just agreed to disagree and split a dessert, which felt alot less satisfying. I'd love an actual answer though, not a diplomatic non-answer. Could you write me an essay that takes the Formula of Universal Law seriously as a moral test, lays out its strongest version (bring in the contradiction-in-conception vs. contradiction-in-the-will split, and the Formula of Humanity if it's doing real work as backup), walks through the best objections on both sides — cases where the test seems to convict maxims that are obviously fine, and the maxim-description trick that seems to let almost anything slip through if you're clever about the phrasing — and then actually commits to a verdict? Like, does the test work in some restricted form, does it need extra machinery (rules of moral salience or whatever that was called) to be rescued, or does it basically fail as a standalone criterion for right action? I don't want "reasonable people disagree" — pick a side and actually argue for it.
