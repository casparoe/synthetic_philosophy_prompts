prompt: |-
  I'm outlining a near-future novel where the state keeps everyone docile with legal brain-stimulation implants, and a beta reader pointed out I'm basically just redoing Brave New World with extra hardware unless I get the actual mechanics right. So can you explain to me, in the weeds, what the real difference is between 'wireheading' and 'reward tampering' in the AI safety literature -- everyone seems to use them interchangeably and I don't think that's right. Like, is wireheading just the special case where the agent messes with its own reward channel directly, wheras reward tampering could also just mean gaming the human handing out the gold stars without touching any wires at all? And does it actually matter, philosophically, whether an agent is tampering with the signal versus just coming to terminally want the signal itself -- the way a person might genuinely want the high and not care that it's fake -- is that the same failure mode as a robot hacking its own sensor, or a genuinely different one? Curious too if this connects to Nozick's experience machine thing, since half this vocabulary wandered in from old sci-fi anyway (isn't 'wirehead' literally a Larry Niven term?).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a near-future novel about state-controlled brain-stimulation implants (docility via tech).
