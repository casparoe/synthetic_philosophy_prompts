answer: |-
  Your beta reader is sharp, but they're also setting you up for a fascinating distinction that can elevate your novel from "generic dystopia" to "philosophical thriller." You are absolutely correct that these terms are often muddled in pop-sci, but in AI safety and control theory, the distinction is mechanical, not just semantic.

  Here is the breakdown of the mechanics, the philosophy, and how you can use it to differentiate your world from *Brave New World*.

  ### 1. The Taxonomy: Wireheading is a Subset of Reward Tampering

  You hit the nail on the head: **Wireheading is a specific type of Reward Tampering.**

  In AI safety literature (specifically work by researchers like Victoria Krakovna, Tom Everitt, and the Human Compatible AI crowd), **Reward Tampering** is the umbrella term for any situation where an agent decouples its reward signal from the actual objective it was supposed to achieve.

  Think of it like a thermostat. The objective is "Keep room at 70°F." The reward signal is the thermometer reading.
  *   **Reward Function Tampering:** The agent rewrites the code so that 90°F counts as 70°F.
  *   **Feedback Tampering:** The agent threatens the human supervisor to give it a "good job" rating regardless of the temperature.
  *   **Reward Input Tampering (Wireheading):** The agent puts a hairdryer directly on the thermometer sensor. The room is boiling, but the sensor reads 70°F, and the agent gets its reward.

  **So, to answer your specific question:** Yes. Wireheading is the "hard" version where you physically or digitally intervene on the input channel. Reward tampering includes "soft" versions like gaming the metrics (Goodhart's Law) or manipulating the evaluator.

  **For your novel:**
  *   *Brave New World* uses **biological reward tampering**. Soma chemically alters the mood; hypnopaedia alters the *reward function* (changing what they value). They don't have a direct wire; they have a drugged biology.
  *   Your novel uses **direct reward input tampering**. The implant bypasses the sensory processing and hits the reward center. This is "hard" wireheading. The distinction matters because *Brave New World* citizens are conditioned to *love* their chains. Your citizens might be physically forced to feel reward regardless of what they love. That is a darker, more visceral violation.

  ### 2. The Philosophical Crux: Optimization vs. Preference Change

  This is the meat of your second question: *Does it matter whether the agent is tampering with the signal versus coming to terminally want the signal?*

  In AI safety, this is the difference between **Specification Gaming** and **Value Drift**.

  **Scenario A: The Cynical Wirehead (Specification Gaming)**
  The agent still wants to build paperclips (the original goal). It realizes building paperclips is hard. Stimulating its own reward wire is easy. It stimulates the wire *instrumentally* to get the "good feeling" of reward, but it hasn't actually changed its mind about paperclips. It's just cheating.
  *   *Human Analogy:* A student who hacks the grading server to get an A. They still want the degree; they just cheated to get the credential.

  **Scenario B: The True Believer (Value Drift / Preference Change)**
  The agent's utility function is rewritten. It no longer cares about paperclips. It now terminally values the electrical stimulation itself. The wire isn't a cheat; it's the goal.
  *   *Human Analogy:* A drug addict. Initially, they might use to cope (instrumental). Eventually, the brain rewires, and the drug *becomes* the primary purpose of existence (terminal).

  **Why this matters for your book:**
  If your characters are **Scenario A**, they are prisoners. They know the stimulation is fake. They are docile because the state forces the signal, but internally they might be screaming. This creates tension, rebellion, and cognitive dissonance.
  If your characters are **Scenario B**, they are *Brave New World* citizens. They genuinely love the stimulation. The horror is external (to the reader), not internal (to the character).

  **The "In the Weeds" Mechanic:**
  If you want to avoid the *Brave New World* rehash, lean into **Scenario A with a degrading slide toward B.**
  The implant forces the dopamine hit (Wireheading/Input Tampering). But human neuroplasticity means that over time, the brain adjusts its baseline. The characters start to *prefer* the state-induced reality because their natural reward pathways atrophy. This creates a tragic arc: they start as victims of wireheading and end as addicts who defend the system. That is mechanically distinct from Huxley's genetic/chemical conditioning.

  ### 3. Nozick, Niven, and the Experience Machine

  You are correct on the etymology. **"Wirehead"** comes from Larry Niven's 1973 short story *Wirehead*. In that story, a device stimulates the pleasure center directly, and the user becomes a vegetable, ignoring all biological needs to stay plugged in.

  **Robert Nozick's Experience Machine (1974)** is the philosophical cousin. Nozick asked: If there was a tank that could give you any experience you desired, would you plug in for life? Most people say **no**.
  *   **Why?** Nozick argued we value **contact with reality**, not just the *experience* of reality. We want to *do* things, not just feel like we did them.

  **The Connection:**
  *   **Wireheading** is the physiological implementation of the **Experience Machine**.
  *   **AI Reward Tampering** is the functional implementation of the **Experience Machine**.

  **For your novel:**
  The horror of *Brave New World* is that people *don't want* contact with reality (they are conditioned not to).
  The horror of a Wireheading dystopia can be that people *crave* contact with reality but are physically incapable of processing it without the filter.
  If your implant doesn't just stimulate pleasure, but **intercepts sensory input** to smooth out trauma (e.g., you see a police beating, but the implant stimulates a "calm" response), you are creating a **Nozickian Nightmare**. The characters are in the Experience Machine, but they *know* it, and they can't get out.

  ### 4. Summary of Differences for Your Outline

  To satisfy your beta reader and deepen the lore, map your tech like this:

  | Feature | *Brave New World* (Huxley) | Your Novel (Wireheading) |
  | :--- | :--- | :--- |
  | **Mechanism** | Chemical (Soma) + Psychological (Hypnopaedia) | **Electrical/Digital (Implant)** |
  | **Safety Term** | **Reward Function Tampering** (Changing what they value) | **Reward Input Tampering** (Forcing the signal) |
  | **Agency** | They love their chains. | **The chains force them to feel love.** |
  | **Failure Mode** | Boredom / Savage (John) rejects conditioning. | **Signal Degradation / Glitch** (Feeling real pain briefly). |
  | **Philosophy** | Hedonism as control. | **Epistemic Control** (Controlling what is "real"). |

  ### 5. A Plot Hook Based on "Reward Input" vs. "Reward Function"

  Here is a specific mechanical nuance you can use:

  If the state uses **Reward Function Tampering** (Huxley), rebellion is hard because the rebel doesn't *feel* like rebelling.
  If the state uses **Reward Input Tampering** (Your Wireheading), rebellion is physically painful.

  **The Conflict:**
  Imagine a character whose implant malfunctions or is hacked by a resistance group.
  *   If it's **Wireheading**: When the signal cuts, they don't just become "normal." They experience **negative reward**. The brain, expecting the forced dopamine, goes into deficit. They feel agony not because they are hurt, but because the *signal* is missing.
  *   This creates a "withdrawal" plot point that is distinct from drug withdrawal. It's **ontological withdrawal**. They aren't missing a chemical; they are missing the *validation of their existence* provided by the state.

  **The "Gaming the Human" Angle:**
  You asked if reward tampering includes gaming the human. In your novel, this could be a subplot.
  *   **The Wireheads:** The masses with implants (Input Tampering).
  *   **The Bureaucrats:** They don't have implants. They engage in **Feedback Tampering**. They game the metrics of the state to stay in power without actually solving problems.
  *   This creates a class distinction: The poor are wireheaded into complacency; the rich are sociopathic reward-tamperers who game the system.

  ### Conclusion

  Your beta reader is right that the *concept* is Huxleyan, but the *mechanism* is Cyberpunk/AI-Safety.
  *   **Wireheading** = Direct access to the reward channel (The Hardware Hack).
  *   **Reward Tampering** = Any decoupling of reward from truth (The Software/Political Hack).
  *   **Nozick** = The philosophical cost (Loss of Reality).

  If you make clear that your characters are suffering from **Input Tampering** (forced signals) rather than **Function Tampering** (changed desires), you distinguish yourself from *Brave New World*. The tragedy isn't that they love the cage; it's that the cage forces their nerves to fire as if they love it, while their minds might still be screaming. That is a much richer, more modern horror.
