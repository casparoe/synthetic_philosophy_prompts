      *   **Topic:** The "depragmatizing" of Dutch Book arguments (DBAs), specifically David Christensen's strategy vs. Patrick Maher's objection.
      *   **Core Problem:** The classical DBA is pragmatic (about betting losses). Christensen tries to make it epistemic (about inconsistent judgments of fairness). Maher objects that this requires an additivity premise that begs the question (presupposes probabilism).
      *   **Task:** Clarify what is being "smuggled in" at the additivity step, evaluate whether the depragmatizing strategy survives, and compare it to representation theorem arguments.

  2.  **Deconstruct the Argumentative Landscape:**
      *   **Classical DBA:** Incoherent credences $\rightarrow$ Acceptable bets $\rightarrow$ Sure loss. *Objection:* Why bet? (The "Why bet?" objection).
      *   **Christensen's Move (Depragmatization):** The irrationality isn't the loss; it's the *inconsistency* in valuing the bets. If you value $A$ at \$x and $B$ at \$y, but value $A \lor B$ (disjoint) at something other than \$x+\$y, your valuations are inconsistent. The sure loss is just a *demonstration* of this inconsistency.
      *   **Maher's Objection:** To say the valuations are inconsistent, you need a norm that says "Valuations *ought* to be additive." But additivity is exactly what probabilism requires. So, Christensen assumes probabilism to prove probabilism. It's circular.
      *   **The "Smuggled" Premise:** It's the principle of *Separability* or *Linearity* of value/fairness across distinct propositions.

  3.  **Address the "Smuggled" Premise (The Core Technical Point):**
      *   Christensen relies on the idea that the fairness of a package of bets is determined by the sum of the fairness of individual bets.
      *   Maher argues that an agent might reasonably value a package differently than the sum of parts (e.g., due to risk aversion, though DBAs usually assume linear utility, or due to holistic evaluation).
      *   To claim inconsistency, Christensen needs a bridge principle: *If bet $B_1$ is fair and bet $B_2$ is fair, then the conjunction of accepting $B_1$ and $B_2$ is fair.*
      *   But "fairness" here is defined by credences. If credences aren't additive, the sum of fair bets isn't necessarily fair.
      *   *Crucial nuance:* Christensen argues this isn't about *accepting* bets, but about *judging* them fair. The inconsistency is synchronic.
      *   *Maher's counter:* Judging $B_1$ fair and $B_2$ fair doesn't logically entail judging $B_1 + B_2$ fair unless you already accept the additivity of value.

  4.  **Evaluate the Survival of Depragmatization:**
      *   *Can it survive?* Some think yes, if framed as a coherence constraint on *attitudes* rather than bets. (e.g., Joyce's non-pragmatic accuracy arguments).
      *   *Christensen's defense:* He might argue that additivity of fairness is a conceptual truth about what "fair price" means in this context, not a substantive normative claim.
      *   *Weakness:* It still feels like it leans heavily on the analogy with money/value, which brings pragmatism back in.
      *   *Current Consensus:* Most formal epistemologists agree Maher has a strong point. Pure DBAs (even depragmatized) struggle to escape the charge of circularity or pragmatism without additional substantive assumptions.

  5.  **Compare with Representation Theorems:**
      *   *Representation Theorems (RT):* Start with preferences over acts, derive probability and utility.
      *   *Advantage:* Doesn't start with probabilities. Derives them from structural rationality constraints on preference (e.g., Independence, Sure Thing Principle).
      *   *Disadvantage:* Still pragmatic (about preferences/choices). Also has its own axioms that can be challenged (e.g., Allais paradox).
