answer: |-
  This is a sharp diagnosis of the dialectic. You have correctly identified the fault line in the post-Ramsey literature: the tension between the *demonstration* of incoherence (the Dutch Book) and the *source* of the irrationality (the fairness judgments).

  You are asking about the specific move where Christensen (and others like Skyrms) attempt to shift the locus of irrationality from the *consequences* of the bets (the sure loss) to the *attitudes* underwriting them (the fairness valuations). Maher's objection is indeed that this shift relies on a bridge principle that is substantively equivalent to the additivity axiom of probability, thereby rendering the argument circular.

  Here is an analysis of what is being smuggled in, the prospects for the depragmatizing strategy, and how this compares to the representation-theorem alternative.

  ### 1. The Smuggled Premise: Linearity of Fairness

  To see exactly what Christensen needs to assume, we must formalize the "depragmatized" move.

  In the classical DBA, we define a fair betting price $q$ for a proposition $A$ as one where the agent is indifferent between buying and selling a bet that pays \$1 if $A$ is true and \$0 otherwise. Let $V_A$ be the agent's valuation (fair price) of this bet.
  Classical Probabilism requires $V_{A \lor B} = V_A + V_B$ for mutually exclusive $A, B$.

  Christensen's depragmatization argues that the irrationality lies in the synchronic inconsistency of the valuations themselves. If you judge $B_1$ fair and $B_2$ fair, but judge the package $B_1 + B_2$ unfair (or vice versa), your judgments are logically inconsistent.

  **The Smuggled Premise:** For this to count as a *logical* inconsistency rather than a mere difference in evaluation, Christensen must invoke a **Principle of Separability** (or Linearity of Fairness):
  > *The fairness value of a package of distinct bets is identical to the sum of the fairness values of the individual bets.*

  Maher's critique (specifically in "Money Pumps and Rationality," 1997, and his 2000 critique of Christensen) is that this principle is not a conceptual truth about "fairness" or "judgment." It is a substantive normative claim about how values aggregate.

  An agent could consistently hold that:
  1.  Bet $B_1$ is fair at \$0.50.
  2.  Bet $B_2$ is fair at \$0.50.
  3.  The package $B_1 + B_2$ is *not* fair at \$1.00 (perhaps they value it at \$0.90 due to risk aversion, or holistic assessment).

  Unless you *stipulate* that fair values must aggregate linearly, there is no contradiction in the triad above. But if you stipulate that fair values must aggregate linearly, you have effectively stipulated that credences must be additive. Since additivity is the very conclusion the DBA is meant to establish, the argument becomes question-begging.

  Christensen attempts to block this by arguing that we are talking about *degrees of belief*, not utility. He claims that if credences represent degrees of belief, they *must* obey the laws of logic, and additivity is a law of logic for partial beliefs. But Maher retorts that this just pushes the question back: *Why* must degrees of belief obey additivity? To answer "Because otherwise you are susceptible to a Dutch Book" brings back the pragmatism. To answer "Because it is a conceptual truth" requires an argument that Maher finds lacking.

  ### 2. Can the Depragmatizing Strategy Survive?

  The consensus in contemporary formal epistemology is largely sympathetic to Maher. The depragmatized DBA faces a dilemma:

  1.  **If fairness is defined pragmatically** (in terms of willingness to bet), then the additivity of fairness depends on the additivity of utility over packages of bets. But expected utility theory itself relies on probabilism. Thus, using EUT to prove Probabilism via DBA is circular.
  2.  **If fairness is defined epistemically** (as a "fair cognitive price"), the claim that these prices must add up is not analytically true. It requires a substantive norm of "cognitive linearity."

  **Is there a defense?**
  Some proponents (e.g., Howson, 2000) suggest that the DBA shouldn't be viewed as a *proof* but as a *reductio* of the coherence of the *concept* of incoherent belief. They argue that the concept of a "degree of belief" is functionally defined by its role in decision-making. If the functional role breaks down (via the Dutch Book), the concept is misapplied.

  However, this concession effectively admits that the normativity is tied to the functional/pragmatic role. It saves the argument from circularity only by conceding that the norm is pragmatic (about functional coherence) rather than purely epistemic (about truth or accuracy).

  **Verdict:** The depragmatizing strategy in its strong form (claiming to establish purely epistemic norms without pragmatic presuppositions) does not survive Maher's objection. It either collapses back into pragmatism or assumes probabilism to prove probabilism.

  ### 3. Dutch Book vs. Representation Theorems

  You asked whether we should abandon DBAs in favor of Representation Theorem (RT) arguments. This is the standard next step, but it is not without its own baggage.

  **The Case for Representation Theorems:**
  RT arguments (Ramsey, Savage, Jeffrey) start with preferences over acts and derive a probability function and a utility function that represent those preferences.
  *   **Advantage:** They do not assume the agent has pre-existing credences that might be incoherent. They show that *if* an agent's preferences satisfy certain structural axioms (Ordering, Independence, Sure Thing Principle), *then* the agent behaves *as if* they are maximizing expected utility relative to a probability function.
  *   **Avoiding the "Why Bet?" Objection:** RTs are less vulnerable to the "I don't have to bet" objection because they frame the norms in terms of *preferences*, which are arguably more fundamental to agency than explicit betting dispositions.

  **The Problem with RTs:**
  However, RTs face a parallel objection to Maher's. The axioms required for the representation (particularly Independence or Sure Thing) are themselves substantive normative claims.
  *   **The Normative Gap:** Just because your preferences *can* be represented by a probability function doesn't mean you *ought* to have preferences that satisfy the axioms. Why is it irrational to violate the Independence axiom (as in the Allais paradox)?
  *   **Pragmatic Residue:** Like DBAs, RTs ground rationality in choice behavior. If you are a cognitivist who believes epistemic rationality is distinct from practical rationality, RTs fail to isolate the *epistemic* norm. They show that probabilism is a requirement of *instrumental* rationality, not necessarily *epistemic* rationality.

  ### 4. The Third Option: Accuracy Arguments

  Given your PhD focus, you are likely aware that the current "gold standard" for non-pragmatic defenses of probabilism is the **Accuracy Argument** (pioneered by Jim Joyce, 1998).

  If your goal is to establish probabilism as a norm of *epistemic* rationality (divorced from betting and preference), the Accuracy Framework is superior to both DBAs and RTs.
  *   **The Core Idea:** Credences are evaluable based on their gradational accuracy (closeness to the truth).
  *   **The Theorem:** Joyce proves that if an agent's credences violate the probability axioms, there is an alternative set of credences that is *more accurate* in every possible world (dominance). If credences obey the axioms, no such dominating alternative exists.
  *   **Avoiding Maher's Objection:** This does not rely on additivity of betting value. It relies on the assumption that accuracy is measured by a proper scoring rule (like the Brier score). While one can challenge the choice of scoring rule (Leitgeb, Pettigrew), it avoids the circularity of assuming linear value aggregation.

  ### Recommendation for Your Work

  If you are writing on the foundations of probabilism:

  1.  **Concede the point on DBAs:** Acknowledge that Maher's objection successfully blocks the "depragmatized" DBA from serving as a *foundational* proof of probabilism. The additivity of fairness is not a conceptual truth; it is a normative postulate equivalent to probabilism.
  2.  **Nuance the Utility of DBAs:** DBAs are not useless. They remain powerful *heuristic* devices for illustrating the structural relationships between credences. They show *what* goes wrong when probabilism is violated (instability in valuation), even if they don't prove *why* it is epistemically forbidden without further premises.
  3.  **Position RTs as Complementary:** RTs are better for linking belief to action, but they share the pragmatic residue. They justify probabilism as a norm of *consistent agency*, not necessarily *truth-tracking*.
  4.  **Pivot to Accuracy:** If your project requires a robust defense of probabilism as an *epistemic* norm, the Accuracy Framework is the strongest contemporary candidate. However, be prepared to defend the "Epistemic Utility" assumptions (e.g., why truth is the sole epistemic good, and why proper scoring rules are the correct measure).

  **Summary:** Maher is right. The depragmatized DBA smuggles in the Linearity of Fairness, which is normatively equivalent to Additivity. The strategy cannot survive as a non-circular foundational argument. Representation theorems avoid the specific betting circularity but remain pragmatic. For a purely epistemic defense, the literature has largely migrated toward Accuracy Arguments.

  **Key References for your bibliography:**
  *   Christensen, D. (2001). "Clever Bookies and Coherent Beliefs." *Philosophical Review*.
  *   Maher, P. (1997). "Depragmatized Dutch Book Arguments." *PSA*.
  *   Maher, P. (2000). "Probabilities for Two Proposals." *Nous*.
  *   Joyce, J. M. (1998). "A Nonpragmatic Vindication of Probabilism." *Philosophy of Science*.
  *   Leitgeb, H. & Pettigrew, R. (2010). "An Objective Justification of Bayesianism I: Measuring Inaccuracy." *Philosophy of Science*.
