prompt: |-
  I'm the non-physician admin rep on my hospital's Medical Executive Committee, and we've got a genuinely nasty case coming to a head at Monday's meeting. A surgeon has had three different nurses independently report, over the last month, that he seemed unsteady and smelled of alcohol before two separate procedures -- but he was never actually tested in the moment, there's no toxicology on file, and his own explanation for both incidents (allergy meds, a hand-sanitizer mishap) is at least plausible taken on its own. About half the committee wants to put him on interim suspension today pending a full investigation; the other half says nurse impressions plus no positive test has never been our bar for suspending anyone's ability to work before, and that we'd basically be inventing a new, lower standard purely because the downside of being wrong -- a patient hurt mid-surgery -- sounds scarier than the downside in cases we didn't suspend for.

  What's turned this into a two-meeting stalemate is that one of our members has a philosophy MA from before med school, and she keeps insisting this is a live case of "pragmatic encroachment" -- her worry is that if we let how bad it'd be to be wrong shrink how much evidence counts as "enough to act on," we're doing something different in kind from just being extra cautious with the same evidence, and the committee ought to be honest about which one it's actually doing. She's also brought up epistemic contextualism, pointing out that the language we'd use in an interim finding ("reasonable cause to believe") versus a final revocation finding ("the Committee finds") might already be smuggling in exactly the standard-shifting she's worried about, just dressed up as neutral legal drafting.

  I got asked to write the actual decision memo since I'm suppose to be the neutral party here, and I don't want to just paper over her point to get to a recommendation faster -- but I also can't hand the committee three pages of epistemology with no bottom line. Can you draft that memo: a recommendation on the interim suspension with a concrete timeline for the fuller investigation, one that actually takes a stand on whether it's legitimate for the suspension decision to lower the evidential bar itself, versus holding the evidence fixed and doing all the stakes-sensitivity through the choice of action instead.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Non-physician admin rep on the Medical Executive Committee (MEC).
      *   **Task:** Draft a decision memo for the Monday meeting regarding a surgeon accused of impairment (alcohol).
      *   **Situation:** Three nurses reported unsteadiness/smell of alcohol over a month (two separate procedures). No toxicology tests. Surgeon has plausible explanations (allergy meds, sanitizer).
      *   **Conflict:** 50/50 split on interim suspension.
      *   **Complicating Factor:** One committee member (MD/MA Philosophy) argues this is a case of "pragmatic encroachment" (letting stakes dictate evidence standards) vs. "stakes-sensitivity in action" (fixed evidence, variable action threshold). She worries about "epistemic contextualism" in the language used ("reasonable cause" vs. "finds").
      *   **Goal:** A recommendation on interim suspension + investigation timeline that *addresses* the philosophical point without becoming a philosophy paper. It needs to take a stand on whether lowering the evidential bar is legitimate or if we should hold evidence fixed and adjust action thresholds.
      *   **Tone:** Professional, administrative, decisive, yet intellectually honest.

  2.  **Deconstruct the Philosophical Argument (for internal understanding):**
      *   *Pragmatic Encroachment:* The idea that knowledge/justification depends on practical stakes. (e.g., "I know the bank is open" might be true for a casual depositor but false for someone facing foreclosure if they don't deposit today).
      *   *The Member's Worry:* If we say "We *know* he's impaired" based on weak evidence just because the stakes are high, we are corrupting the truth standard.
      *   *The Alternative:* Keep the epistemic standard fixed (e.g., "Is it more likely than not?"). Let the *action* change based on stakes. (e.g., "We aren't sure he's impaired, but the risk is so high we must act *as if* he might be until proven otherwise.")
      *   *Legal/Administrative Reality:* "Reasonable cause" or "probable cause" *is* a lower standard than "preponderance of evidence" or "beyond reasonable doubt." This is standard administrative law. The philosophical point is actually describing standard due process tiers, but framing it as an epistemic danger.
      *   *Strategy:* Validate the member's insight (it shows rigor) but frame it within established administrative law and patient safety protocols. The distinction is between *fact-finding* (adjudication) and *risk-management* (interim action).

  3.  **Determine the Recommendation:**
      *   *Patient Safety:* Paramount. Three independent reports is significant, even without tox.
      *   *Fairness to Physician:* Due process is needed. Suspension shouldn't be punitive without proof, but protective.
      *   *Resolution:* Recommend **Interim Suspension**. Why? Because the stakes (patient life) justify a precautionary pause based on *reasonable suspicion*, not *proven guilt*.
      *   *Addressing the Philosophy:* Explicitly distinguish between the *standard of proof for restriction* (risk-based) vs. *standard of proof for discipline* (evidence-based). This validates the member's concern about conflating the two while allowing the committee to act safely.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and specific.
      *   **Executive Summary:** Bottom line up front. Recommend suspension + investigation.
      *   **Background:** Briefly state the facts (3 reports, 2 incidents, no tox, explanations).
      *   **The Core Question:** Frame the debate. Is the evidentiary threshold shifting, or is the action threshold shifting?
      *   **Analysis (The Philosophical/Administrative Bridge):** This is the tricky part.
          *   Acknowledge the member's point.
          *   Clarify that interim suspension is *not* a finding of fact (guilt). It is a risk mitigation tool.
          *   Therefore, we are *not* lowering the bar for "truth" (epistemology); we are raising the bar for "permission to practice" (privileging) based on risk.
          *   This aligns with Joint Commission/NCQB standards usually.
      *   **Recommendation:**
          *   Immediate interim suspension (with pay, usually, to reduce legal blowback).
          *   Mandatory evaluation (PHP - Physician Health Program).
          *   Timeline (e.g., 30 days for initial report).
          *   Reinstatement criteria (clearance from evaluation).
      *   **Language Guidance:** Address the "reasonable cause" vs. "finds" wording. Ensure the memo reflects that this is a *suspicion-based safety measure*, not a *guilt-based sanction*.

  5.  **Refining the Tone:**
      *   Avoid jargon where possible, but use precise administrative terms.
      *   Don't dismiss the philosophy member; credit the rigor.
      *   Ensure the legal counsel would not have a heart attack (add a disclaimer to consult legal).
      *   Make sure it sounds like an Admin Rep wrote it (process-oriented, neutral).

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Keep the philosophical discussion contained to the "Framework for Decision" section. Keep the rest operational.
      *   *Critique:* Did I answer the specific prompt about "lowering the evidential bar" vs "holding evidence fixed"?
      *   *Fix:* Yes, explicitly state that we are *not* claiming to "know" he is impaired (lowering evidence bar for truth), but rather that the *threshold for restricting privilege* is lower than the *threshold for terminating privilege* (stakes-sensitivity in action).
      *   *Critique:* Is the timeline concrete?
      *   *Fix:* Specify 72 hours for notice, 30 days for evaluation.

  7.  **Final Polish:** Check for clarity, neutrality, and authority. (Ensure the distinction between "Summary Suspension" and "Interim Suspension" is clear if necessary, but keep it simple: "Interim Restriction".)

  *(Self-Correction on "Philosophy"):* I need to make sure I don't sound like I'm lecturing the MD/MA. I should frame it as "incorporating the committee's rigorous discussion on standards of proof."

  *(Self-Correction on "Legal"):* I am an AI, not a lawyer. I must include a note that this is a draft for internal discussion and requires Legal/HR review.

  8.  **Final Output Generation** (Proceeding to draft based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Medical Executive Committee
  **FROM:** [Your Name], Administrative Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Interim Privilege Restriction for Dr. [Surgeon Name]

  ### Executive Summary

  This memo recommends the immediate implementation of an **Interim Summary Suspension** of Dr. [Surgeon Name]'s clinical privileges, pending the outcome of a formal investigation and Physician Health Program (PHP) evaluation.

  This recommendation is based not on a finding of factual guilt regarding impairment, but on a risk-mitigation standard necessitated by patient safety stakes. To address the Committee's valid concerns regarding evidentiary standards, this memo explicitly distinguishes between the *epistemic threshold for adjudication* (discipline) and the *risk threshold for restriction* (safety).

  **Recommended Action:** Vote to authorize interim suspension effective immediately.
  **Investigation Timeline:** Initial report due within 14 days; Final resolution target within 60 days.

  ### Background

  Over the past 30 days, three independent nursing staff members have reported observations concerning Dr. [Surgeon Name]'s fitness for duty prior to two separate procedures. Observations included gait unsteadiness and the scent of alcohol. No point-of-care toxicology testing was administered at the time of incidents. Dr. [Surgeon Name] has provided alternative explanations (allergy medication, topical sanitizer exposure) which are medically plausible but unverified.

  The Committee is currently divided on whether these reports constitute sufficient evidence for interim suspension absent toxicological confirmation.

  ### Framework for Decision: Evidence vs. Action Thresholds

  A significant portion of our deliberation has focused on whether acting on these reports constitutes an inappropriate lowering of our evidentiary standard. Specifically, concerns were raised regarding "pragmatic encroachment"—the risk that we might allow the severity of potential outcomes to artificially inflate our confidence in the facts themselves.

  To resolve this stalemate, we must distinguish between two distinct administrative functions:

  1.  **Adjudication (Discipline):** This requires a fixed evidentiary standard (e.g., Preponderance of Evidence). Here, we ask: *"Are we convinced the physician was impaired?"* In this domain, stakes should **not** alter the evidentiary bar. We cannot discipline based on fear; we must discipline based on proof.
  2.  **Risk Management (Interim Action):** This requires a variable action threshold based on stakes. Here, we ask: *"Is the risk of allowing practice while uncertainty exists tolerable?"* In this domain, the severity of the potential harm **legitimately** lowers the threshold for precautionary action.

  **The Committee's Stand:**
  We are **not** lowering the evidential bar for truth. We are not claiming to "know" Dr. [Surgeon Name] is impaired based on weak evidence. Rather, we are holding the evidence fixed (as "reasonable suspicion") and allowing the high stakes of surgical safety to dictate a precautionary pause.

  This distinction preserves the integrity of our fact-finding process while honoring our primary obligation to patient safety. It aligns with Joint Commission standards and typical Medical Staff Bylaws regarding "Summary Suspension," which are designed precisely for situations where immediate action is necessary to protect patients, regardless of whether final adjudication has occurred.

  ### Recommendation

  **1. Interim Summary Suspension**
  Dr. [Surgeon Name]'s privileges are restricted effective immediately. This is a neutral, protective act, not a punitive one.
  *   **Rationale:** Three independent corroborating reports of impairment symptoms in a high-risk environment create an unacceptable risk profile, regardless of the plausibility of alternative explanations.
  *   **Status:** Administrative leave with pay (pending HR/Legal review) to maintain neutrality.

  **2. Mandatory Evaluation**
  Dr. [Surgeon Name] must undergo a comprehensive fitness-for-duty evaluation through a designated Physician Health Program (PHP).
  *   **Scope:** Evaluation must address potential substance use, medication interactions, and neurological/physical stability.
  *   **Compliance:** Failure to cooperate results in automatic recommendation for privilege revocation.

  **3. Investigation Timeline**
  *   **T+72 Hours:** Formal notice served to Dr. [Surgeon Name]; Legal counsel appointed.
  *   **T+14 Days:** Preliminary report from Medical Staff Leadership regarding the investigation status.
  *   **T+30 Days:** PHP Evaluation completed and submitted to the Committee.
  *   **T+60 Days:** Final MEC vote on reinstatement or further disciplinary action based on the *adjudicative* standard (Preponderance of Evidence).

  ### Language and Findings (Addressing Epistemic Contextualism)

  To ensure our documentation reflects the distinction outlined above, the language in the official motion and notification letters must be precise:

  *   **Do Not Use:** "The Committee finds the physician was impaired." (This implies a factual conclusion we do not yet possess.)
  *   **Do Use:** "The Committee determines there is **reasonable cause to believe** a threat to patient safety exists." (This accurately reflects a risk-based threshold.)
  *   **Do Not Use:** "Suspension due to misconduct."
  *   **Do Use:** "Interim restriction pending investigation."

  By strictly segregating the language of *suspicion* (interim) from the language of *finding* (final), we avoid the epistemic confusion of conflating safety protocols with truth claims. This allows us to act decisively on the stakes without compromising our evidentiary integrity.

  ### Next Steps

  If the motion passes today:
  1.  Legal and HR will finalize the notification letter by 5:00 PM today.
  2.  The Chair will notify Dr. [Surgeon Name] tomorrow morning.
  3.  The Investigation Subcommittee will convene within 48 hours.

  **Approval Required:**
  [ ] Approve Interim Summary Suspension
  [ ] Approve Investigation Timeline
  [ ] Refer back to Subcommittee

  ***

  **Note to Committee:** *This draft is intended to facilitate decision-making. All actions must be reviewed by Hospital Legal Counsel and HR to ensure compliance with state medical board regulations and employment law prior to execution.*
