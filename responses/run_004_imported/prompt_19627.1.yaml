answer: |-
  You have an excellent ear for philosophy, and your instinct is spot-on. You haven't just stumbled into a rabbit hole; you've found the exact fault line where ancient ethics meets modern metaphysics.

  Your Tuesday philosophy meetup friend is being dogmatic. The argument is logically *valid* (the conclusion follows from the premises), but it is not *sound* (the premises are contestable). You are absolutely correct that Epicurus is "helping himself" to a specific assumption about what constitutes harm.

  Here is the breakdown of what is actually doing the work in that passage, the objection you're remembering, and how you can use this tension to make Eleanor and her daughter's dynamic incredibly rich.

  ### 1. The Hidden Premise: The "Experience Condition"
  You identified the crux of the issue: *"It only seems to land if you already accept that nothing can be bad for someone unless that person exists, at that time, to undergo it."*

  In contemporary philosophy of death, this is called the **Experience Condition** (or sometimes the Existence Requirement).

  Epicurus doesn't explicitly argue for this in the *Letter to Menoeceus* because, for him, it is foundational axiology. Earlier in the letter, Epicurus establishes that pleasure is the "starting point and goal of the blessed life." For an Epicurean, "good" and "bad" are cashed out entirely in terms of sensation (pleasure and pain).
  *   **Premise 1:** Something can only be good or bad for you if you can experience it as pleasant or painful.
  *   **Premise 2:** Death is the permanent end of all experience/sensation.
  *   **Premise 3:** Therefore, death cannot be experienced as pleasant or painful.
  *   **Conclusion:** Therefore, death is neither good nor bad for you.

  When Epicurus says, *"when death is present, we no longer exist,"* he is relying on Premise 1. If you reject Premise 1, the rest of the quote collapses.

  ### 2. The Objection: Thomas Nagel and the "Deprivation Account"
  Your memory is serving you perfectly. The philosopher is **Thomas Nagel**, and the essay is **"Death" (1970)**.

  Nagel specifically targets the Experience Condition. He argues that we can be harmed by things we do not experience. His famous example is indeed betrayal:
  > *"If a man is betrayed by his friends, ridiculed behind his back, and despised by people who pretend to be his admirers, he may be very unhappy about it if he discovers what is happening. But if he never discovers, is he not harmed nonetheless?"*

  Nagel says yes. The harm lies in the **objective state of affairs**, not the subjective experience of it.

  Applied to death, Nagel proposes the **Deprivation Account**: Death is bad not because the *state of being dead* is painful (Epicurus is right that it isn't), but because death deprives you of the goods of life you *would have had* if you hadn't died.
  *   **Epicurus:** Looks at death as a *state* (non-existence).
  *   **Nagel:** Looks at death as an *event* (the cutting short of a life).

  So, is the argument "airtight"? No. It holds only if you accept Epicurean Hedonism. If you believe life has value beyond immediate sensation (projects, relationships, potential), Nagel wins.

  ### 3. How to Use This in the Novel
  This philosophical conflict is a goldmine for your characters. It shouldn't just be background; it should be the engine of their conflict.

  **Eleanor's Perspective (The Shield)**
  Eleanor is using Epicurus as armor. As a classics professor, she likely *knows* the Nagel objection. She probably taught it. But she is choosing Epicurus *willfully*.
  *   **Why?** Because Nagel's view makes death tragic. Epicurus's view makes death neutral.
  *   **The Character Beat:** She isn't quoting Epicurus because she thinks it's logically irrefutable; she's quoting it because she is terrified. If she admits Nagel is right, she has to admit she is losing something precious. Epicurus allows her to face the end with *ataraxia* (tranquility).
  *   **The Flaw:** Epicurus's argument addresses the fear of *being dead*. It does not address the pain of *dying* (the process), nor does it address the grief of *those left behind*. Eleanor is using an argument about the *subject* of death to comfort the *survivors* of death. That is a category error, and it explains why her daughter finds it cold.

  **The Daughter's Perspective (The Grief)**
  The daughter represents the Nagelian intuition. Her grief isn't about Eleanor's state of non-existence; it's about the deprivation of future time.
  *   **The Conflict:** When Eleanor says, "When I am dead, I will not suffer," the daughter hears, "Your grief is irrational."
  *   **The Counter:** The daughter doesn't care if Eleanor suffers *after* death. She cares that the relationship is being severed *now*. Epicurus has no answer for survivor's grief, only for the decedent's fear.

  **A Specific Scene Idea**
  Have Eleanor quote the passage dryly. Have the daughter push back, not emotionally, but intellectually (perhaps she learned this from her mother).
  *   **Daughter:** "That only works if harm requires sensation, Mom. Nagel showed that's false. You're being deprived of us. We're being deprived of you. That's a harm, even if you can't feel it."
  *   **Eleanor:** "Nagel was a clever man. But he wasn't dying. I find Epicurus more... comfortable."

  This admits Eleanor knows the counter-argument but chooses the philosophy that lets her sleep at night. It makes her human rather than just a mouthpiece for Stoicism/Epicureanism.

  ### 4. One More Piece of Ammo: Lucretius
  Since Eleanor is a classics professor, she might also reach for **Lucretius** (*De Rerum Natura*), who expanded on Epicurus. He offers the **Symmetry Argument**:
  *   We do not grieve about the infinite time before we were born.
  *   The time after we die is the same mirror image.
  *   Therefore, we should not grieve about the time after we die.

  This often annoys people even more than Epicurus (because prenatal non-existence feels different from post-mortem non-existence), but it gives Eleanor more "dry" ammunition to deflect emotion.

  ### Summary for Your Drafting
  1.  **You are right:** Epicurus assumes the "Experience Condition." It is not proven in the text; it is axiomatic to his system.
  2.  **You are right about Nagel:** Thomas Nagel (1970) argues that deprivation counts as harm, even without experience. This breaks Epicurus's logic if you accept Nagel's axioms.
  3.  **The Friend is Wrong:** The argument is not airtight; it is contingent on a specific definition of "harm."
  4.  **For the Book:** The tension isn't just about logic; it's about utility. Eleanor needs Epicurus to be true so she can face death without panic. Her daughter needs Nagel to be true so her grief is validated. Neither can fully concede to the other without hurting the other.

  If you write Eleanor knowing *why* the argument is vulnerable but using it anyway as a coping mechanism, she becomes a much more compelling, tragic figure. She isn't just quoting a book; she's trying to talk herself out of terror.
