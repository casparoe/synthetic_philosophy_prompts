answer: |-
  **Setting:** *The study of Charles Sanders Peirce, Milford, Pennsylvania. Autumn, 1902. The room is cluttered with books, papers, and scientific instruments. Outside, the wind rattles the windowpanes. William James is visiting from Cambridge. A fire burns low in the grate.*

  **William James:** Charlie, the fire is welcome. It's bitter out on the road. And I must say, looking at these shelves, it seems you haven't let the world's neglect starve your intellect, even if it has starved your purse.

  **Charles Sanders Peirce:** Neglect is a precise term, Will. But let us not dwell on my misfortunes. I invited you here to dwell on *your* success. Specifically, your lecture at Berkeley. "Philosophical Conceptions and Practical Results." You were generous. You put my name at the cradle of this movement.

  **James:** It was a matter of historical record, nothing more. I found the principle in your papers from the seventies. It seemed to me the only solvent capable of dissolving the metaphysical knots that have strangulated philosophy for centuries. I wanted to give the father his due.

  **Peirce:** And in doing so, you made the child a celebrity. But I fear you have dressed the child in clothes that do not fit. You have made pragmatism a pillow for the weary. When I read your account, Will, I feel a shiver. You speak of truth as what is "good in the way of belief." You speak of the "cash-value" of an idea in terms of satisfaction.

  **James:** I speak of life, Charlie. Men do not live in a logical vacuum. They live in a stream of experience. If an idea carries them through that stream without shipwreck, if it marries old opinion to new fact in a way that feels right, that is truth. It is truth in the making.

  **Peirce:** It is truth in the *wishing*. This is why I have decided, in my upcoming papers for *The Monist*, to coin a new name for my own doctrine. I shall call it "pragmaticism."

  **James:** Pragmaticism? It sounds like a prescription for indigestion.

  **Peirce:** Precisely. It is ugly enough to be safe from kidnappers. You have taken the principle, which I intended as a logical maxim for clarifying concepts, and you have turned it into a doctrine of individual salvation. And here lies the danger, Will. If truth is merely what is "good" or "satisfying" to hold, how do you distinguish between a belief that is *true* and a belief that is merely *comforting*?

  **James:** You think I mean comfort in the sense of a nursery tale?

  **Peirce:** I mean that if I believe, against all evidence, that my deceased wife is still in the next room, and that belief grants me solace, allows me to function, and eases my grief... by your metric, is that belief not true? It works. It satisfies a need. It has cash-value. If pragmatism cannot distinguish between the hard-won truth of a scientist and the comforting delusion of a mourner, it is not a theory of truth. It is a theory of therapy.

  **James:** *(Leans forward, stirring the fire)* You press me hard, Charlie. But you mistake the "satisfaction." I do not mean the momentary glow of a warm feeling. I mean satisfaction in the face of the *entire* pressure of reality. Your mourner may find solace in believing his wife is present, but let him try to hand her a cup of tea. The tea will fall through the air. The silence will remain. The belief fails to lead him through the subsequent parts of his experience. It creates a discontinuity.

  **Peirce:** So you appeal to future experience to correct the present satisfaction?

  **James:** I appeal to the *workability* of the belief. A comforting falsehood is a bad instrument. It jams the machinery of life. Truth is the name for whatever proves itself to be a reliable guide through the thicket of sensation. If the belief "my wife is dead" allows me to navigate the world without constant collision with unexpected voids, *that* is why it is true. Not because it matches a static reality, but because it leads. So, to answer you: No, a comforting falsehood is not true, because eventually, reality will exact its toll. The satisfaction must be durable, not just sweet.

  **Peirce:** *(Nods slowly, tapping his pipe against the mantel)* You rely, then, on the stubbornness of experience to cure the subjectivity of the believer. Very well. I grant that experience resists us. But this rescue operation requires time. It requires a correction mechanism. And this brings me to your critique of my own position. You have written to me that my definition of truth—the opinion fated to be agreed upon by the community of inquirers at the ideal limit of investigation—is a "promissory note."

  **James:** I did say that. And I stand by it. You define truth as what we *would* believe if inquiry were pushed to its ultimate extremity. But Charlie, none of us will be there. The sun will burn out before the "final opinion" is reached. To base your definition of truth on a point in time that is logically unreachable is to make truth irrelevant to the living. It is a theological hope disguised as logic. You ask me to wait for the end of history to know if I am right now. That is not philosophy; that is faith.

  **Peirce:** You charge me with faith. I charge you with solipsism. If truth is only what works for you, or for me, in the finite stretch of our lives, then "error" loses its meaning. If I say the earth is flat, and it works for my local navigation, and I die before sailing off the edge... in your system, was I wrong?

  **James:** You were wrong because the *potential* for collision existed.

  **Peirce:** Potential to whom? To whom does the collision matter if no one is there to experience it? You see, Will, your "durable satisfaction" still relies on a hypothetical observer. My "final opinion" is not a promise that we will arrive. It is a logical necessity for the *meaning* of reality itself. To say a thing is "real" is to say it is independent of what you or I happen to think. But how can we conceive of that independence? Only by conceiving of a consensus that is not dependent on any finite mind.

  **James:** But that consensus is a fiction.

  **Peirce:** It is a *regulative* fiction, if you like, but it is the only thing that keeps truth from collapsing into "what James finds useful" or "what Peirce finds logical." You call it an empty promissory note. I answer you: It is the only currency that holds its value. Without the ideal limit, truth is just the current majority vote of the living. And we know how often the living are wrong. To answer your challenge directly: The "final opinion" is not a date on a calendar. It is the anchor that prevents truth from drifting into mere consensus. If you cut that anchor, you are left with a sea of individual utilities, and no way to say one is better than another except by who shouts loudest.

  **James:** *(Stands and walks to the window, looking out at the darkening woods)* You anchor it in a future that doesn't exist. I anchor it in the blood and struggle of the present. You say my view makes truth too human. I say your view makes it too divine. You want a truth that waits for the end of time. I need a truth that helps a man decide whether to jump across a chasm *now*. If he believes he can make it, and that belief gives him the energy to leap, and he lands... that belief *made* itself true in the moment of acting. Waiting for the community of inquirers to verify his jump is useless if he is dead at the bottom.

  **Peirce:** And if he jumps and falls? Was his belief true until the moment of impact?

  **James:** It was true for the purpose of the leap. Truth *happens* to an idea. It becomes true, is made true by events.

  **Peirce:** Then truth is mutable. A thing can be true on Tuesday and false on Wednesday.

  **James:** A thing can be useful on Tuesday and fatal on Wednesday. Why should truth be exempt from the flux of life?

  **Peirce:** Because then it is not truth. It is expediency. And that is why I must brand my doctrine "pragmaticism." I must sever the artery. I cannot allow my logical maxim—that the meaning of a concept lies in its conceivable practical consequences—to be conflated with your psychological claim—that the truth of a concept lies in its emotional or volitional utility.

  **James:** *(Turns back from the window)* And I cannot allow your "logical maxim" to freeze the living pulse of human experience into a scholastic abstraction. You fear the kidnappers, Charlie. I fear the morgue. You want to save the word "Truth" from being misused. I want to save the *use* of truth from being rendered impotent by definitions no human being can ever verify.

  **Peirce:** *(Sits heavily in his chair)* We are at an impasse. You think my limit is a fantasy. I think your utility is a mirage.

  **James:** Not a mirage. A map. Your map shows the destination, but no roads. My map shows the roads, but admits the destination might change as the terrain shifts.

  **Peirce:** Then let us agree on this: The word "pragmatism" is yours. You have made it too popular for me to reclaim. I shall keep my "pragmaticism." It shall be ugly, precise, and lonely. Like me.

  **James:** *(Smiles sadly)* And I shall keep "pragmatism." It shall be messy, human, and dangerous. Like life. But Charlie... know that even in your "pragmaticism," you are still speaking to the human need for order. That is a satisfaction, is it not?

  **Peirce:** *(A faint, grim smile)* Perhaps. But it is a satisfaction derived from the belief that the universe is intelligible, not that it is comfortable. There is a difference, Will.

  **James:** There is. And I suspect we shall both be dead before we prove which one matters more.

  **Peirce:** Then the community of inquirers will decide.

  **James:** Or they will simply find new questions to ask.

  *(Peirce says nothing. He picks up his pen and dips it into the inkwell. James pulls on his coat. The wind rattles the glass again.)*
