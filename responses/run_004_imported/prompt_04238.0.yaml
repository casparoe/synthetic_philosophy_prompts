  **Move 1 (Marta): +1**
  Marta starts from a position of scientific integrity. In hazard mapping, transparency about data scarcity is virtuous. However, from a statistical standpoint, four data points are insufficient to constrain a recurrence model meaningfully (whether Poisson or time-dependent). She wins points for honesty but loses ground on utility; a probability distribution with variance spanning orders of magnitude is often indistinguishable from ignorance in a decision context.

