      *   *ECL:* Needs a large/infinite universe (to guarantee copies). Needs EDT (correlation is enough). Needs a reference class (who counts as "me"?). Lower bar on simulation, higher bar on cosmology/reference class.
      *   *Comparison:* AT is "I trade with *that* specific alien AI." ECL is "I cooperate with *all agents sufficiently like me*."

  4.  **Address Question 2: Does the difference buy anything?**
