      *   **Evidential Cooperation in Large Worlds (ECL) / MSR:** Rooted in Evidential Decision Theory (EDT) + Cosmology (Infinite/Multiverse). Involves statistical correlation. "I do X because in a large enough world, there are copies/analogs of me doing X, and their outcomes matter." Less about specific bargaining, more about correlating with a reference class.

  3.  **Address Question 1: Requirements:**
