      *Let's structure the verdict clearly.* I'll argue ECL is more defensible *pragmatically* but AT is more defensible *logically* (if you accept FDT). But since the question is about "agents you will never observe," ECL's reliance on physical copies makes the "claim" more tangible than AT's logical ghosts. Okay, I'll go with ECL being the more defensible *basis for human action*, while noting AT is the ideal for superintelligences. Actually, the prompt asks which is more defensible for *treating agents as having a claim*. I'll argue ECL, because the correlation is physically instantiated, whereas AT's logical dependence is metaphysically heavier.

      *Wait, one nuance:* AT doesn't require an infinite universe, just logical dependence. ECL *requires* a large/infinite universe. That's a big assumption. Is assuming an infinite universe more defensible than assuming FDT? In modern cosmology, infinite universes are a mainstream hypothesis. FDT is a niche decision theory. So ECL wins on the "mainstream science" front, loses on "decision theory consensus."
