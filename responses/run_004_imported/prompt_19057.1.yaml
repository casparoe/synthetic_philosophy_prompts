      *   *Gödel's 2nd Theorem:* A sufficiently strong formal system (like Peano Arithmetic, PA) cannot prove its own consistency *within* the system.
      *   *Gentzen's Proof:* Proves the consistency of PA using transfinite induction up to the ordinal $\epsilon_0$.
      *   *The Conflict:* Gödel says PA can't prove Con(PA). Gentzen *did* prove Con(PA). How? Because Gentzen used methods *outside* PA (transfinite induction).
      *   *The Crux:* Are Gentzen's methods "finitary" in Hilbert's sense? Most logicians say no. Transfinite induction up to $\epsilon_0$ involves infinitary concepts.
      *   *Conclusion:* It's a concession. Hilbert wanted finitary proofs. Gentzen used infinitary (though constructive/intuitionistically acceptable to some) proofs.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Define Hilbert's Program (security of mathematics via finitary consistency proofs).
          *   State Gödel's blow (internal consistency unprovable).
          *   Introduce Gentzen's intervention (1936, $\epsilon_0$).
          *   Thesis Statement: Gentzen's proof bypasses Gödel by stepping outside the system, but it fails Hilbert's strict "finitary" criterion. Therefore, it is a technical triumph but a philosophical concession, shifting the goalposts from absolute finitary certainty to relative consistency based on stronger (transfinite) principles.

      *   **Hilbert's Requirement (The "Finitary" Standpoint):**
          *   What did Hilbert mean by *finistisch*?
          *   Concrete objects (numerals, strokes).
          *   No quantification over infinite totalities.
          *   Intuitively evident.
          *   Goal: To justify "ideal" (infinitary) mathematics using "real" (finitary) mathematics.
          *   Crucially: The meta-theory must be weaker than or distinct from the object theory in a way that guarantees epistemic security.

      *   **Gödel's Obstacle:**
          *   Second Incompleteness Theorem.
          *   If $T$ is consistent, $T \nvdash \text{Con}(T)$.
          *   Implication for Hilbert: If the finitary methods can be formalized *within* PA (which Hilbert seemed to assume was possible for finitary reasoning), then PA cannot prove its own consistency using those methods.
          *   So, a finitary proof of PA's consistency is impossible *if* finitary reasoning $\subseteq$ PA.

      *   **Gentzen's Solution:**
          *   Cut-elimination (Hauptsatz).
          *   Transfinite induction up to $\epsilon_0$.
          *   Why it bypasses Gödel: Transfinite induction up to $\epsilon_0$ is not provable in PA. It is a stronger principle. Thus, the proof happens in a system $T'$ where $T' \supset PA$. Gödel is satisfied (the system proving consistency is stronger), but Hilbert might be unhappy.

      *   **The Core Conflict: Is $\epsilon_0$-induction Finitary?**
          *   Hilbert's view: Finitary = no actual infinity.
          *   Gentzen's method: Uses ordinals. $\epsilon_0$ is an infinite ordinal.
          *   Interpretation: While $\epsilon_0$ is countable and can be represented combinatorially (Cantor normal form), the *principle* of induction up to it implies accepting a well-ordering of an infinite structure.
          *   Bernays (Hilbert's collaborator) admitted this goes beyond the original finitary standpoint.
