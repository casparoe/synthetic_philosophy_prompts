          *   *Concession angle:* Hilbert wanted to reduce the uncertain (infinity) to the certain (finitary). Gentzen reduced PA to $\epsilon_0$-induction. But is $\epsilon_0$-induction more certain than PA? Arguably not. It assumes the consistency of a stronger system.
          *   *Verdict:* It concedes the point on which Hilbert could not compromise. The epistemic gain is null if the meta-theory is as doubtful as the object theory. Hilbert wanted a foundation *below* arithmetic; Gentzen provided a foundation *above* arithmetic.

      *   **Conclusion:**
          *   Summarize the distinction.
          *   Gödel showed limits of internal proof.
          *   Gentzen showed consistency is provable externally.
          *   But the "finitary" constraint was the heart of Hilbert's epistemological project.
          *   Final judgment: A profound technical success that transformed proof theory, but a philosophical surrender of Hilbert's original strictures.

