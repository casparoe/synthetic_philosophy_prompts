      *   *Critique:* The verdict needs to be sharp. "Heavily discounted reasons" is good. I should specify *how* it changes behavior. It shouldn't mean "send money to aliens." It should mean "don't optimize exclusively for local values if it risks alien values at low cost."
      *   *Tone Check:* Avoid overly casual language. Use terms like "normative force," "epistemic access," "counterfactual dependency."

  6.  **Developing the Verdict:**
