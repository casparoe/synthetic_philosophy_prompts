prompt: |-
  im putting together an essay question for my grad decision theory seminar and want something meatier than another newcomb's problem essay. so: "evidential cooperation in large worlds" (ECL, sometimes called multiverse-wide superrationality) is the idea that if the universe or multiverse is big enough, it almost certainly contains huge numbers of agents who reason like we do but hold different values -- agents we can never causally interact with -- yet choosing to act more cooperatively/impartially toward the values of "agents like us" is evidence that our counterparts elsewhere are doing likewise, so everyone does better in expectation, purely acausally. can you write an essay on whether this actually gives us genuine first-order reasons to change our behavior here and now, or whether its really just superrationality wearing a cosmology costume that falls apart once you take seriously how uncertain and diffuse the relevant correlations are? weigh the strongest arguments on both sides, but actually commit to a verdict -- "ECL gives real but heavily discounted reasons, mostly cashing out as generic cooperativeness rather than specific 'trades'" counts as landing somewhere; "more research is needed" does not.
