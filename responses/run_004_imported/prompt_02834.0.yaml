answer: |-
  **Title:** The Cosmological Veil: Assessing the Normative Weight of Evidential Cooperation in Large Worlds

  **Abstract:** *Evidential Cooperation in Large Worlds (ECL) posits that in a sufficiently vast universe, agents can secure acausal gains from trade by conditioning their actions on the expected behavior of distant, non-interacting counterparts. This essay evaluates whether ECL generates genuine first-order normative reasons for action or merely dresses up superrational intuition in cosmological garb. I argue that while the decision-theoretic logic of ECL is sound under Evidential or Functional Decision Theory, the epistemic uncertainty regarding reference classes and correlation strengths heavily discounts its practical force. Consequently, ECL does not justify specific resource diversion for "acausal trades," but it does mandate a policy of generic cooperativeness and value pluralism.*

  ---

  ### Introduction

  Standard Causal Decision Theory (CDT) instructs agents to maximize utility based on the causal consequences of their actions. In a local context, this ignores the states of agents with whom one cannot causally interact. However, if the universe is spatially infinite or a multiverse exists, there likely exist countless agents who reason similarly to us but hold different values. Evidential Cooperation in Large Worlds (ECL) suggests that by adopting a policy of cooperation toward the values of these "alien" agents, we provide evidence that they are doing the same for us. Since the number of such agents is vast, the expected value of this acausal trade could dwarf local causal impact.

  Critics argue that ECL is merely Hofstadterian superrationality wearing a cosmology costume—a framework that collapses once one acknowledges the diffusion of correlations across light-years and the ambiguity of "similar reasoning." This essay weighs the decision-theoretic validity of ECL against its epistemic fragility. I contend that ECL provides real but heavily discounted reasons for action. It fails as a mechanism for specific acausal contracting but succeeds as a justification for a broader, more impartial ethical stance.

  ### The Argument from Scale and Decision Theory

  The strongest case for ECL rests on the conjunction of modern cosmology and non-causal decision theory. If inflationary cosmology is correct, the observable universe is a tiny patch of a much larger whole, potentially containing infinite duplicates or near-duplicates of human civilization. Even if the probability of a specific agent existing elsewhere is low, the sheer cardinality of the universe ensures that the *expected number* of agents reasoning via similar algorithms is high.

  Proponents argue that if one accepts Evidential Decision Theory (EDT) or Functional Decision Theory (FDT), the normative force of ECL follows deductively. In FDT, an agent chooses an output for their decision algorithm. If that algorithm is instantiated in multiple locations (due to physical similarity or convergent evolution of reasoning), the output is logically correlated. By choosing to "cooperate" (i.e., assign positive weight to the values of other civilizations), an agent updates the probability that counterparts elsewhere will do the same.

  The magnitude of this effect is the crux of the argument. In a "large world," the number of potential trading partners ($N$) is astronomical. Even if the probability of correlation ($P$) is small, and the cost of cooperation ($C$) is moderate, the expected benefit ($N \times P \times Benefit$) can easily exceed local causal opportunities. To ignore ECL, on this view, is to leave utility on the table due to a parochial attachment to causal efficacy. It transforms ethics from a local game into a multiversal coordination problem, where the rational move is to signal cooperativeness to all potential algorithmic siblings.

  ### The Epistemic Fog: Reference Classes and Correlation

  However, the leap from decision-theoretic formalism to first-order action guidance is blocked by severe epistemic hurdles. The "superrationality in costume" critique targets the stability of the correlation required for ECL to function.

  First, there is the **Reference Class Problem**. For ECL to work, I must identify which distant agents are running "my" decision algorithm. If the class is too narrow (e.g., "exact molecular duplicates"), $N$ drops to near zero, negating the cosmological multiplier. If the class is too broad (e.g., "any sentient being"), the correlation in decision-making vanishes. A civilization of paperclip maximizers might reason "instrumentally" like us, but their terminal values prevent cooperation. Without a robust theory of which cognitive architectures correlate with which policy choices, the evidential link is speculative.

  Second, there is the **Dilution of Correlation**. In local Newcomb problems, the predictor (Omega) has a defined mechanism for correlation. In ECL, the correlation relies on the abstract similarity of reasoning processes across causally disconnected regions. In a chaotic multiverse, noise may dominate signal. If my decision to cooperate is influenced by local cultural factors that do not exist elsewhere, the evidential link is broken. If the correlation strength is $0.0001$ rather than $0.9$, the expected value calculation flips, making ECL a net loss compared to local causal altruism.

  Finally, there is the **Value Learning Hazard**. To cooperate with alien values, I must model them. If I misidentify what a counterpart values, my "cooperative" act might actually be antagonistic. Given the vastness of the value space, the risk of accidental antagonism is high. A policy of "generic cooperation" might inadvertently support value systems that are hostile to existence or complexity, reducing total multiversal value.

  ### Superrationality or Cosmology?

  Is ECL merely superrationality dressed up? Hofstadter's original superrationality failed because it lacked a mechanism for correlation in one-off Prisoner's Dilemmas. ECL attempts to supply that mechanism via cosmology. Does it succeed?

  It succeeds in establishing *possibility*, but fails in establishing *precision*. Cosmology guarantees that there are *many* agents, but it does not guarantee that they are *relevantly similar* in their decision nodes. The "costume" critique holds water insofar as ECL proponents often assume a level of algorithmic isomorphism that physics does not support. Physical laws may be uniform, but initial conditions and evolutionary paths are not.

  However, dismissing ECL entirely as a costume ignores the logical possibility of convergent instrumental reasoning. If rational agents converge on certain meta-ethical norms (e.g., "cooperation yields higher utility than defection"), then the correlation is not based on identical history, but on identical rationality. If this convergence holds, ECL is not magic; it is the recognition of logical facts that hold across space-time. The critique, therefore, should not be that the correlation is impossible, but that it is too noisy to support high-stakes betting.

  ### Verdict: Discounted Reasons and Generic Cooperativeness

  Does ECL give us genuine first-order reasons to change our behavior? **Yes, but heavily discounted.**

  We must reject the strong conclusion that ECL justifies radical resource diversion (e.g., sacrificing significant local welfare to send "signals" to the multiverse). The epistemic uncertainty regarding reference classes and correlation strengths acts as a massive discount rate. To prioritize acausal trade over causal good is to succumb to a form of Pascal's Mugging where the "mugger" is the size of the universe. The probability of the relevant correlations being strong enough to matter is too low to override near-certain local needs.

  However, we must also reject the weak conclusion that ECL is irrelevant. The logic of ECL survives as a justification for **generic cooperativeness and value pluralism**.
  1.  **Low-Cost Cooperation:** Since the cost of "not destroying" potential alien values is often near zero, while the potential upside is infinite, ECL mandates a policy of restraint. We should avoid optimizing our local light-cone in ways that are hostile to a wide range of possible value systems (e.g., avoiding aggressive expansion that preempts other civilizations' existence).
  2.  **Meta-Cooperation:** ECL supports investing in research that improves our ability to identify and model alien values. This is a robust first-order reason: improving our decision theory and value learning is good locally *and* increases the probability of successful acausal trade.
  3.  **Impartiality:** ECL undermines ethical parochialism. If my values are one among many in the multiverse, and cooperation is beneficial, then weighting my values exclusively is suboptimal. This aligns with impartial moral theories (like utilitarianism) but grounds them in decision theory rather than axiology.

  Therefore, ECL does not demand we build temples to alien gods. It demands we act as responsible citizens of a logical multiverse. It shifts the optimal policy from "maximize local value at all costs" to "maximize local value subject to constraints of broad cooperativeness."

  ### Conclusion

  Evidential Cooperation in Large Worlds is not a loophole to infinite utility, nor is it a philosophical delusion. It is a legitimate consideration for any agent accepting non-causal decision theory in an infinite universe, but its normative force is blunted by epistemic opacity. The "cosmology costume" does not fully animate the corpse of superrationality, but it does provide a sturdy shell for a specific ethical stance: humility. We should act cooperatively toward the values of "agents like us" not because we are certain of the trade, but because the cost of cooperation is low, the potential upside is vast, and the logical symmetry of rationality suggests we are not alone in our reasoning. ECL thus cashes out not as a specific trading protocol, but as a virtue ethic for the multiverse: be the kind of agent that makes acausal cooperation possible, just in case the universe is watching.
