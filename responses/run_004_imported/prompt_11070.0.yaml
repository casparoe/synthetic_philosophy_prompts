answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** Civic Decision-Making Task Force
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Futarchy Pilot for Transportation Bond Allocation

  ### Executive Summary

  The Task Force recommends **conditional endorsement of a modified futarchy pilot** to resolve the three-year deadlock on the $400 million Transportation Bond. While we recognize the theoretical promise of using conditional prediction markets to aggregate information ("bet on beliefs"), we share significant concerns regarding market liquidity, the relocation of political conflict to the metric-setting phase, and, most critically, the risk of post-decision sabotage by losing stakeholders.

  Therefore, we do not recommend adopting the proposal exactly as submitted by the civic-tech nonprofit. Instead, we recommend a **Restricted Experimental Pilot** that incorporates specific governance guardrails. These modifications are designed to mitigate moral hazard and ensure that, regardless of the market outcome, the implementation of the winning plan remains robust against political retaliation. If these safeguards cannot be legally codified prior to the market opening, the Task Force recommends reverting to a traditional referendum.

  ### Background and Context

  For three years, the City has been unable to allocate $400 million in transportation funding. The choice is between Plan A (Bus Rapid Transit expansion) and Plan B (Road Capacity and Repaving). Traditional consulting studies have produced contradictory results, each favoring the sponsors who commissioned them. This has eroded public trust and stalled critical infrastructure development.

  A coalition of local economists and civic technologists has proposed a futarchy mechanism:
  1.  **Vote on Values:** The Council defines a "Quality of Movement Index" (QMI).
  2.  **Bet on Beliefs:** Conditional prediction markets estimate the QMI score five years out under Plan A vs. Plan B.
  3.  **Binding Outcome:** The plan with the higher implied market value is automatically implemented.

  The Task Force is divided. Proponents argue this bypasses biased consultants and incentivizes residents to research the plans deeply. Opponents argue this merely shifts lobbying from policy arguments to index-weighting manipulation and invites the losing side to sabotage the winning project to vindicate their market position.

  ### Analysis of Benefits

  We acknowledge the strength of the proponent's argument. The current deadlock is a failure of information aggregation.
  *   **Incentivized Truth-Seeking:** Unlike public comment periods, which reward rhetoric, prediction markets reward accuracy. Stakeholders with private information (e.g., local business owners regarding traffic patterns) would have a financial incentive to trade on that knowledge rather than hoard it.
  *   **Explicit Value Trade-offs:** By forcing the Council to codify the QMI weights (e.g., how much commute time matters relative to pedestrian safety) *before* the policy choice, we make value judgments transparent rather than hiding them inside black-box consultant models.
  *   **Breaking the Deadlock:** A binding market outcome provides political cover for Council members to vote for a plan they might privately support but publicly fear opposing.

  ### Analysis of Risks and Task Force Concerns

  The Task Force's opposition raises three substantive objections that cannot be dismissed as resistance to innovation. These risks form the basis of our recommended modifications.

  **1. The Sabotage and Moral Hazard Problem**
  This is the most severe technical risk. In a standard election, the loser has an incentive to ensure the winner succeeds (to avoid governing failure). In futarchy, if I have bet heavily on Plan A, and Plan B wins, I profit if Plan B *fails* to meet the QMI targets. This creates a perverse incentive for the losing coalition to quietly obstruct the winning plan (e.g., through permitting delays, litigation, or public relations campaigns undermining adoption).
  *   *Assessment:* Valid. In a city of this size, key stakeholders are known to each other. The financial stakes of a $400M project could justify significant expenditure on obstruction.

  **2. The Counterfactual Verification Problem**
  Because only one plan is built, we can never observe the QMI score of the plan that was *not* built. We will never know if the market was "right."
  *   *Assessment:* Valid, but inherent to all governance. Every decision is a counterfactual gamble. However, futarchy claims to optimize *expectations*, not guarantee outcomes. The risk here is that if the winning plan fails due to external shocks (e.g., a recession), the mechanism itself may be discredited, or conversely, if it succeeds despite poor market signals, the mechanism gains undue credit.

  **3. Relocation of Politics (Index Gaming)**
  Critics argue that fighting over the QMI weights is just as political as fighting over the plans themselves. If the Index weights commute time heavily, Plan B likely wins; if it weights pedestrian safety heavily, Plan A likely wins.
  *   *Assessment:* Valid. However, we view this as a feature, not a bug. It is preferable to fight openly over values (the Index) than to hide value judgments inside consultant assumptions about "economic impact."

  ### Recommended Modifications and Safeguards

  To proceed, the risks above must be actively managed. We propose the following four conditions be added to the pilot charter:

  **1. Decoupling Market Payouts from Implementation Success**
  To mitigate the sabotage risk, the structure of the prediction market must be altered.
  *   *Modification:* The market should not be a standard "winner take all" based on the realized Index. Instead, use a **scoring rule mechanism** where traders are rewarded based on the *accuracy of their probability estimates* relative to the outcome, rather than pure directional betting.
  *   *Alternative Mitigation:* If standard conditional markets are used, the City must establish an **Independent Implementation Oversight Committee**. This body would have budget authority and staffing independent of the Council to execute the winning plan. Its mandate would be to insulate the project from permitting delays or bureaucratic friction initiated by political opponents. Losing stakeholders must sign a "Good Faith Implementation" covenant as a condition of market participation.

  **2. Supermajority Requirement for Index Weighting**
  To prevent the Index from being gamed to predetermine the outcome:
  *   *Modification:* The QMI weights should not be set by a simple Council majority. They should require a **two-thirds Council vote** or be determined by a **Citizens' Assembly** selected by sortition. This ensures the metric reflects a broad consensus on values, making it harder for one faction to load the dice.

  **3. Liquidity and Market Depth Guarantees**
  A thin market is easily manipulated by a wealthy actor.
  *   *Modification:* The pilot must include a designated **Market Maker** funded by the civic-tech nonprofit or a grant, obligated to maintain bid-ask spreads within a specific range. Furthermore, there should be position limits for any single entity to prevent one wealthy donor from cornering the market and dictating the outcome.

  **4. The "No Regrets" Clause**
  To address the counterfactual anxiety:
  *   *Modification:* The Council must pass a concurrent resolution acknowledging that the market decision is based on *expected* value, not guaranteed results. If the winning plan fails to meet QMI thresholds due to execution errors (not design flaws), the mechanism is not deemed a failure. Conversely, if the plan succeeds but the market predicted failure, the mechanism is still deemed successful for aggregating available information at the time.

  ### Recommendation

  The Task Force recommends the City Council **adopt the Futarchy Pilot only if the safeguards above are codified.**

  Specifically, we urge the Council to:
  1.  **Authorize the formation of the Independent Implementation Oversight Committee** prior to opening the markets. This is the non-negotiable safeguard against sabotage.
  2.  **Refer the QMI Weighting to a Citizens' Assembly** rather than retaining it within the Council, to depoliticize the "Vote on Values" stage.
  3.  **Cap individual market positions** at 5% of total market volume to prevent manipulation.

  If the legal or financial framework cannot support these safeguards—particularly the insulation of the winning project from political obstruction—the Task Force recommends **rejecting the pilot** and returning to a traditional referendum. A futarchy experiment that fails due to sabotage would be worse than the current gridlock; it would actively incentivize civic cynicism and reward obstructionism.

  ### Conclusion

  Our current deadlock is costly. Every month of delay degrades existing infrastructure and wastes tax dollars. The futarchy proposal offers a genuine path to break the consultant stalemate by aligning financial incentives with accurate forecasting. However, it introduces new vulnerabilities that standard voting does not possess.

  By implementing the Oversight Committee and diversifying the Index-setting process, we can harness the information-aggregation benefits of prediction markets while neutralizing the incentive to sabotage. This approach treats the pilot not as a magic bullet, but as a high-stakes experiment that requires rigorous containment protocols. We believe this modified path offers the best chance to resolve the transportation bond while preserving the integrity of City governance.

  **Vote of the Task Force:** 6 in favor of Modified Pilot, 4 in favor of Rejection, 1 Abstention.
