answer: |-
  **Setting:** *The garden at La Chevrette, Madame d'Épinay's estate, just outside Paris. Late afternoon, Autumn 1758. The leaves are turning, and the light is low. JEAN-JACQUES ROUSSEAU walks briskly along a gravel path. DENIS DIDEROT follows, holding a copy of the newly printed* Letter to d'Alembert *in one hand, tapping it against his thigh.*

  **DIDEROT:** You walk as if you are fleeing a crime scene, Jean-Jacques. And yet, you are the one who has just published the indictment.

  **ROUSSEAU:** I walk to keep the blood warm, Denis. The air is turning. And I am not fleeing. I am removing myself from the smoke of your salons. It chokes me.

  **DIDEROT:** *(Stopping)* Then stop. Turn. Look at me. You send this missile into the heart of the *Encyclopédie*, into the heart of our friendship, and you expect me to read it as a mere difference of opinion? You tell Geneva to banish the theater. You tell us that we are corrupting the very souls we claim to enlighten.

  **ROUSSEAU:** *(Turning, face tight)* I tell Geneva to preserve itself. There is a difference. You speak of enlightenment as if it were a lantern you carry into a dark room. I speak of it as a fire that can burn the house down if the timber is rotten.

  **DIDEROT:** Rotten? The theater? You argue that Molière corrupts the French? That watching a man play a miser makes us more stingy?

  **ROUSSEAU:** I argue that watching a man *play* a miser allows us to feel superior to him without ever opening our own purses. That is the poison, Denis. Pity on the stage is a tax we pay to excuse our indifference in the street. We weep for Hecuba, we weep for Phaedra, and because we have wept, we believe we are good men. Then we step out into the courtyard and step over the beggar without a glance. Our conscience is discharged.

  **DIDEROT:** *(Stepping closer)* Or… hear me. Or, by exercising that muscle of sympathy, we keep the heart soft. A man who cannot be moved by the representation of suffering will certainly not be moved by the reality of it. The stage is a school. When a father sees a play about a prodigal son, does he not hug his own child tighter on the way home?

  **ROUSSEAU:** He hugs the child because the emotion is cheap! It costs him nothing to feel for a character who cannot ask him for bread. Real virtue is difficult. It requires action. It requires risk. The theater reduces virtue to a sentiment. It makes morality a matter of taste. You sit in your box, you shed a tear, and you applaud. You have done your duty for the evening.

  **DIDEROT:** You reduce the audience to idiots. You think we cannot distinguish between the shadow and the substance?

  **ROUSSEAU:** I think the shadow is more comfortable! And I think the actor… *(He gestures vaguely, with distaste)* …the actor is the vector of this disease. To make a trade of one's person? To stand up and say, "I am not myself, I am Agamemnon," and to be paid for the lie? It is a profession of inauthenticity. It corrodes the soul of the player until he no longer knows where the mask ends and the face begins. How can a republic of honest men tolerate a class of professional counterfeits?

  **DIDEROT:** *(A sharp laugh)* A professional counterfeit? Is that what you call craft? Is a carpenter a counterfeit because he builds a table that is not a tree? The actor is a craftsman of the human spirit. He studies passion so that he may display it truly. When I write a drama, Jean-Jacques, I do not write to lull men to sleep. I write to show them the moral complexities of their own lives. The "serious drama." The bourgeois father, the merchant, the judge. Not kings and heroes. Real problems.

  **ROUSSEAU:** Invented problems!

  **DIDEROT:** Arranged problems! To illuminate universal truths!

  **ROUSSEAU:** And in doing so, you divide the city. Look at your playhouses. The rich in the boxes, the poor in the pit. Some performing, most watching. Passive. Silent. You create a spectacle where a few are active and the many are consumers of emotion. In Geneva, I propose festivals. Open air. No tickets. No stage. We dance, we sing, we are all the spectacle to one another. There is no separation. There is only the community, seeing itself.

  **DIDEROT:** *(Softening, pacing slowly)* Geneva. Always Geneva. You speak as if Paris is a village of two thousand souls where everyone knows the baker's name. We are a metropolis. We are strangers to one another. In Paris, the festival you describe is impossible. We cannot all dance in the Place Vendôme. We need a mirror. We need a place where strangers can gather and feel the same emotion at the same moment. That *is* a kind of unity, Jean-Jacques. When a thousand people gasp in unison, that is a social bond.

  **ROUSSEAU:** *(Pauses, looking at the ground)* It is a bond of spectators. It is the unity of a crowd, not a people.

  **DIDEROT:** And what is a people, if not a crowd that has learned to feel together?

  *(Silence hangs between them for a moment. A bird calls from the trees.)*

  **ROUSSEAU:** *(Quietly)* I will concede this to you, Denis. I have seen men weep at the Comédie. I have seen it. And I know that tear is real water, salted by real grief. I do not doubt the sensation. I doubt the aftermath. I fear that the passion expended in the theater is passion subtracted from the world. But… if your "serious drama" truly forces a man to confront his own duty, rather than simply admire a hero… if it is not merely a diversion…

  **DIDEROT:** *(Nodding slowly)* If it is merely diversion, you are right. It is opium. I concede that. There are plays—many plays—that are nothing but vanity. Flattery of the court, cheap jokes at the expense of the virtuous. If the theater serves only to amuse the idle, it deserves your scorn. It deserves to be shut.

  **ROUSSEAU:** Then we agree it is dangerous.

  **DIDEROT:** We agree it is a tool. A hammer can build a house or crush a skull. You seem to believe the hammer is inherently violent. I believe it depends on the hand that swings it. But here is my blow, Jean-Jacques, and you must take it. You speak of transparency. You speak of the festival where all are known to all. That requires a city where no one has secrets. But secrets are the only shelter a man has against the tyranny of the public eye. In your Geneva, in your open-air dance, if a man is sad, he must dance anyway. If he is an outcast, he is exposed. The theater allows a man to sit in the dark and be alone, even among thousands. Sometimes, anonymity is a mercy.

  **ROUSSEAU:** *(Stiffening)* Anonymity is the luxury of the corrupt. In a healthy state, there should be no need to hide.

  **DIDEROT:** That is a demand for angels, not men. And it is why your model cannot work here. You want to make Paris into Geneva. You want to shrink the world to fit your philosophy. I am trying to build a philosophy that fits the world as it is. Large, messy, anonymous. The theater gives us a space to practice being human without the immediate demand of the neighbor's judgment. It is a rehearsal.

  **ROUSSEAU:** A rehearsal that never leads to the performance.

  **DIDEROT:** *(Smiling sadly)* Perhaps. But it is better than no rehearsal at all.

  **ROUSSEAU:** *(Turns away, looking toward the horizon)* You know why this cuts me so deeply, Denis? Because I love the arts. I love music. I love the swell of a chorus. But I see the cost. I see the council member who funds the opera house but cuts the hospital budget. I see the man who praises *Tartuffe* but cheats his business partner. I want the virtue to come before the verse.

  **DIDEROT:** And I want the verse to inspire the virtue. We are chasing the same deer, Jean-Jacques. You think it runs toward the forest; I think it runs toward the village.

  **ROUSSEAU:** *(Turns back, eyes weary)* I fear that if we build the village around the theater, we will find we have built a temple to illusions. But… *(He hesitates)* …I admit, when I read your *Natural Son*, I felt a catch in my throat. I cannot deny that.

  **DIDEROT:** *(Surprised)* You read it?

  **ROUSSEAU:** I read it. It was… honest. For a play.

  **DIDEROT:** *(Bows his head slightly)* And I admit, your description of the festival… the image of the people as their own spectacle… there is a beauty there I cannot dismiss. It shames me, sometimes, that our gatherings are so transactional. We buy a ticket; we consume art. We are customers, not citizens. I wish I knew how to fix that in a city of millions. I do not.

  **ROUSSEAU:** Nor do I. Perhaps that is the tragedy. Not the play, but the scale.

  **DIDEROT:** *(Offers the copy of the Letter back to Rousseau)* Keep your pamphlet. I will not burn it. But do not ask me to stop writing for the stage.

  **ROUSSEAU:** *(Takes the paper, but does not open it)* And I will not ask you to stop. But I will ask you to watch the audience. Watch them when they leave. Do they go to help, or do they go to sleep?

  **DIDEROT:** I will watch. If you will watch the dancers in your meadow. See if they are free, or if they are merely performing for each other.

  **ROUSSEAU:** *(A faint, thin smile)* Agreed.

  **DIDEROT:** The sun is gone. Let us go in. Madame d'Épinay will wonder where we have vanished to.

  **ROUSSEAU:** Let her wonder. But yes. The cold is coming.

  *(They walk side by side toward the house, not touching, the distance between them neither closed nor widened, but measured.)*
