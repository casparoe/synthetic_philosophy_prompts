      *   **Characters:** Jean-Jacques Rousseau and Denis Diderot.
      *   **Setting:** Around the time of the publication of Rousseau's *Letter to d'Alembert on the Theatre* (1758). Face-to-face conversation (fictionalized, as their relationship was fracturing).
      *   **Core Conflict:** The value of theater. Rousseau argues it substitutes artificial pity for real action, corrupts the actor, and divides the community. Diderot argues it cultivates sympathy, moralizes through "serious drama," and civilizes.
      *   **Tone:** Intellectual, passionate, nuanced. No caricatures (Rousseau isn't just a prude; Diderot isn't just a cheerleader).
      *   **Requirements:** Real blows landed on specific points. At least one genuine concession from each side. No clean win for either.
      *   **Context:** The user is a community theater practitioner who encountered this debate via a city council funding argument. The dialogue should resonate with that practical concern (art vs. action).

  2.  **Historical & Philosophical Context:**
      *   **Rousseau:** *Letter to d'Alembert* (1758). Key concepts: *amour-propre* (vanity/social comparison), authenticity, the danger of passive spectatorship, the "festival" model (active participation), Geneva as a small republic vs. Paris as a monarchy/cosmopolis. He believes theater pacifies conscience.
      *   **Diderot:** *The Paradox of the Actor* (written later, but ideas forming), *Discourse on Dramatic Poetry*. Key concepts: The "fourth wall," serious drama (*drame bourgeois*), theater as a school of morals, the actor as a skilled craftsman of emotion who moves the audience to virtue.
      *   **Relationship:** They were friends, then fell out. This conversation should reflect the tension of a breaking friendship.

  3.  **Drafting - Scene Setting:**
      *   Needs to be intimate but tense. A garden or a study. Let's go with a garden in the countryside (La Chevrette), where they often met. It allows for walking, stopping, pacing—physical manifestations of their mental states.
      *   Time: Late afternoon, 1758.

  4.  **Drafting - The Argument Structure:**
      *   **Opening:** Acknowledge the rift. The *Letter* is the elephant in the room.
      *   **Round 1: The Nature of Pity.** Rousseau: Pity on stage is easy, costless. Diderot: It exercises the muscle of empathy.
      *   **Round 2: The Actor.** Rousseau: The actor is a professional liar, losing their self. Diderot: The actor is a skilled observer, teaching us to see truth.
      *   **Round 3: The City/Community.** Rousseau: Festivals unite; theater divides (active/passive). Diderot: Paris isn't Geneva. Scale matters.
      *   **Concessions:**
          *   Rousseau admits theater *can* move people, even if he fears the aftermath.
          *   Diderot admits bad theater is mere distraction and that the "festival" ideal has merit for small communities.
      *   **Closing:** Unresolved but respectful. The friendship is strained but the intellects have engaged.

  5.  **Drafting - Voice & Style:**
      *   **Rousseau:** Earnest, intense, focused on *nature*, *truth*, *conscience*, *transparency*. Sentences should feel urgent, sometimes jagged.
      *   **Diderot:** Witty, pragmatic, encyclopedic, focused on *utility*, *craft*, *society*, *progress*. Sentences should be more flowing, persuasive, rhetorical.

  6.  **Writing - Section by Section (Iterative refinement):**

      *   *Intro:* Establish the tension. Diderot holding the pamphlet.
      *   *The Pity Argument:* Rousseau's key point: "We weep for Hecuba, but ignore the beggar." Diderot's counter: "We weep *because* we are capable of feeling for the beggar."
      *   *The Actor:* Rousseau calls it "counterfeiting." Diderot reframes it as "emulation of virtue."
      *   *The Concession (Diderot):* He admits that mere spectatorship can become lazy. He acknowledges the risk of "tearful satisfaction."
      *   *The Concession (Rousseau):* He admits that in a large city (Paris), the festival model is impossible. He acknowledges the *need* for some shared moral language, even if theater is flawed.
      *   *The Scale Argument:* This is crucial. Geneva vs. Paris. Rousseau's politics work for a village; Diderot's for a metropolis.
      *   *Ending:* They part ways, knowing the friendship is changing, but the debate remains vital.

  7.  **Refining the Philosophy (Self-Correction during drafting):**
