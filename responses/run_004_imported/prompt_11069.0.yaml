  **(Self-Correction Note):** I need to make sure I don't use *The Paradox of the Actor* anachronistically. That was written much later (1770s/80s). I should stick to his views from the *Encyclopédie* period and his early plays (*The Natural Son*). He believed in the actor's sensitivity at this stage, before the "cold observer" theory fully developed. I will focus on the *moral utility* of drama.

  9.  **Final Review against constraints:**
