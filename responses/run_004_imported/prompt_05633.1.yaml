answer: |-
  **MEMORANDUM**

  **TO:** Zoning Board of Appeals Members
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Upcoming Hearing: [Address] – Analytical Framework & Recommendation

  **1. Executive Summary & Recommendation**

  This Thursday, we are hearing the appeal regarding the proposed detached Accessory Dwelling Unit (ADU) at [Address]. The central tension is whether a lot containing a main house and a detached ADU retains its "Single-Family" zoning classification.

  **Recommendation:** I recommend we **GRANT** the permit, subject to specific site-plan conditions regarding parking placement and exterior screening.

  **Rationale:** We cannot deny the permit based on the argument that an ADU functionally creates a "two-family" environment. State law defines the *name* (the legal classification), and under the new ADU statute, an ADU is legally distinct from a primary dwelling. However, we can and should address the *actuality* (the physical impact) through strict site conditions that ensure the unit remains subordinate in practice, not just in theory.

  **2. The Core Conflict: Classification vs. Reality**

  We are facing a structural problem that mirrors a classic philosophical dispute regarding names (*ming*) and actualities (*shi*). To reach a defensible decision, we need to separate the legal definition from the physical impact.

  *   **The Applicant's Position (The Argument of Name):**
      The applicant's counsel argues that "Single-Family Residential" is a legal category defined by the *type* of structures allowed, not the number of people sleeping there. Under state law, an ADU is defined as "accessory." Therefore, logically, Main House + ADU = Single-Family Lot. To deny this is to confuse the definition of "accessory" with "primary." They are correct on the law: the state has fixed the *name*, and we cannot reclassify a state-defined ADU as a "second family home" for the purpose of prohibition.

  *   **The Neighbors' Position (The Argument of Actuality):**
      The abutters argue that names must correspond to reality. If a property has two kitchens, two utility meters, and two unrelated leases, the *actuality* is a multi-household property. The impacts—parking demand, trash, noise—align with "Two-Family" zoning, regardless of the "Accessory" label. They are correct on the impact: ignoring the physical reality of two households would be negligent planning.

  **3. Legal Constraints**

  We must acknowledge that the "Name" argument currently holds the legal weight. The state's ADU statute preempts local bylaws that effectively ban ADUs in Single-Family zones. If we deny this permit on the grounds that "an ADU makes this a two-family lot," we will almost certainly be overturned in court. The state legislature has decided that an ADU *is* compatible with Single-Family zoning. We cannot legislate from the bench that "White Horse is not Horse" when the statute says "White Horse counts as Horse."

  However, preemption is not total. While we cannot ban the *use*, we retain authority over the *site plan*. This is where we address the neighbors' concerns.

  **4. Mitigating the Actuality (Conditions of Approval)**

  To respect the neighbors' valid concerns about the *actuality* of the property without violating the *name* of the zoning, I propose the following conditions. These are designed to ensure the ADU remains truly "accessory" in function and impact:

  *   **Parking:** Limit off-street parking to [X] spaces total for the property, located [specific location] to prevent street congestion. We acknowledge two households exist, but we cap the vehicular footprint to match the street's single-family character.
  *   **Screening:** Require 6-foot privacy screening between the ADU and the nearest neighbor to mitigate noise and light intrusion (addressing the *actuality* of closer density).
  *   **Subordination:** Require that the ADU's exterior finishes and roofline remain secondary to the main house. This ensures the visual *name* of the streetscape remains single-family.
  *   **Utility Monitoring:** Require a single water/sewer connection where legally permissible, or metering that does not encourage high-volume commercial use.

  **5. Next Steps & Timeline**

  *   **Hearing:** Thursday, October 26, 7:00 PM.
  *   **Deliberation:** Immediate following hearing.
  *   **Decision Deadline:** By law, we must issue our written decision within [65/90] days of the hearing record closing. I propose we vote Thursday and aim to have the written findings filed by November 15.
  *   **Appeal Period:** Once filed, there is a 20-day appeal period before the permit can be issued.

  **6. Conclusion**

  We cannot solve this by simply quoting the bylaw, because the bylaw is currently in tension with state statute. Nor can we solve it by ignoring the neighbors' lived experience of density.

  We must accept the legal *name* (this is a Single-Family lot with an accessory unit) while managing the physical *actuality* (this is a lot with increased density). Granting the permit with strict site conditions is the only path that respects the rule of law without abandoning our duty to the neighborhood's character.

  Please review the attached draft conditions before Thursday.

  [Your Name]
  ZBA Member
