  3.  **Evaluate LLMs against Davidsonian Criteria:**
      *   *Do LLMs Triangulate?* No. They process text tokens based on statistical probabilities derived from training data. They do not perceive the world directly, nor do they interact with a human *in the moment* to fix a reference to an external object (even if they talk about objects, the causal link is broken).
      *   *Do LLMs have Causal History?* They have a history of training on human text. But is this the *right kind* of history? For Davidson, the history must involve causal interactions with the *world* and *other minds* to ground meaning. Text is already "second hand." It's a map of a map. Swampman had *no* history; LLMs have a history of *symbols*, not a history of *world-interaction*.
      *   *Swampman Analogy:* Swampman is a better analogy than one might think. Swampman looks like Davidson but lacks the causal lineage. LLMs look like speakers but lack the causal lineage of *embodied interaction*.
      *   *Principle of Charity:* Charity is used to maximize truth/agreement between *interpreters*. If the LLM has no beliefs (because no triangulation/history), there is nothing to be charitable *about*. We can predict its outputs, but we aren't interpreting *thoughts*.

