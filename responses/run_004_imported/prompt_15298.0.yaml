      *   *Swampman:* History matters. A physical duplicate without a causal lineage of interaction with the world lacks intentionality. It's a "blob" making noises, not asserting propositions.
      *   *Principle of Charity:* A methodological necessity for *interpretation*. We must assume agreement to identify disagreement. But it applies to *interpreting a speaker*. If there is no speaker (no mind), is there anything to interpret?
