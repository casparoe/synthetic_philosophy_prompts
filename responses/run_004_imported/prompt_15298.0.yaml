      *   *Reason 2: Swampman Parallel.* Training on text is not the same as the causal history required for intentionality. Text is already semantic; deriving semantics from semantics without world-contact is circular (or just syntax).
      *   *Reason 3: Principle of Charity Limits.* Charity presupposes a rational agent. If the system isn't an agent (no beliefs/desires), Charity is a category error. We treat it *as if* it means something (instrumentalism), but it doesn't *actually* mean anything (realism).
      *   *Nuance:* Davidson might acknowledge the *appearance* of rationality but insist it's merely complex disposition, not genuine intentionality.

