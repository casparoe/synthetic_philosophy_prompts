answer: |-
  You are not reinventing the wheel; you have accidentally rediscovered a fundamental principle of **semiotics** (the study of signs and symbols) and **cognitive psychology**.

  Your suspicion is 100% correct: **Icons are excellent at representing nouns and simple verbs, but they are functionally incapable of representing complex logic, conditions, or abstract relationships without significant cognitive load.**

  Your PM is operating under a common misconception known as the **"Iconic Fallacy"**: the belief that images are a universal language that bypasses culture and cognition. They aren't. Text is actually *more* efficient for what you are trying to do.

  Here is the breakdown of why this is happening, the theory behind it, and how you can argue this to your PM without just sounding like a stubborn engineer.

  ### 1. The Theory: Concrete vs. Abstract
  Human cognition processes images and language differently.
  *   **Icons map to concrete concepts:** A picture of a camera maps to the physical object "camera." A picture of a gear maps to "mechanism/settings" (via metaphor). These are **referential**.
  *   **Logic maps to abstract relationships:** Words like "AND," "OR," "NOT," "UNLESS," "IF," and "EXCEPT" are **functional**. They describe the *relationship between* concepts, not the concepts themselves.

  There is no visual equivalent of a conjunction or a conditional operator. You can draw a "dog" and you can draw a "house," but there is no universally understood drawing for "The dog is in the house **unless** the mailman is here."

  In semiotics, this is the difference between an **Icon** (resembles the thing) and a **Symbol** (arbitrary meaning agreed upon by convention).
  *   **Text is a symbol system optimized for abstraction.** We agreed that the sound/shape "NOT" means negation.
  *   **Visuals are icon systems optimized for recognition.**

  When you try to force an icon to do the job of a symbol (like using a slash for "NOT"), you are fighting the medium. The slash through a cigarette means "Prohibition" (a social rule), not "Boolean Negation" (a logical state). Users interpret the slashed bell as "Broken" or "Forbidden" because that is the cultural convention for that symbol, not "Logical OFF."

  ### 2. The "Universal Language" Myth
  Your PM's pitch ("pictures are universal") is factually incorrect.
  *   **Icons are learned, not innate:** The "floppy disk" save icon makes no sense to anyone under 25. The "gear" for settings is a Western industrial metaphor. In some cultures, a magnifying glass means "search," in others, it means "inspection" or "scrutiny."
  *   **Cultural Context:** A "thumbs up" is positive in the US and offensive in parts of the Middle East. An owl represents wisdom in the West and bad luck in parts of Asia.
  *   **The Localization Cost:** Localizing text strings is cheap. Modern mobile frameworks (like Flutter, SwiftUI, or Android Resources) handle JSON string files effortlessly. The cost of translating 50 strings into 40 languages is negligible compared to the engineering cost of three sprints spent debugging icon comprehension, plus the revenue cost of users dropping off during onboarding because they don't understand the requirements.

  ### 3. Cognitive Load and Error Rates
  When a user sees text that says "Location AND Bluetooth required," they parse it linearly. The syntax does the work for them.

  When a user sees `[Location Icon] + [Bluetooth Icon]`, they have to:
  1.  Identify Icon A.
  2.  Identify Icon B.
  3.  Identify the operator (the plus sign).
  4.  Infer the relationship (Does plus mean 'and'? Does it mean 'add'? Does it mean 'combine'?).
  5.  Deduce the outcome.

  This increases **cognitive load**. In UX, every millisecond of hesitation increases the chance of abandonment. For complex logic, text is actually the *low-friction* option.

  ### 4. Is there a way around it?
  If you absolutely cannot use text (which you should fight against), you cannot solve this with *better icons*. You have to solve it with **interaction design**.

  **Option A: State-Based UI (Show, Don't Tell)**
  Don't explain the logic; enforce it visually.
  *   *Instead of:* An icon saying "Turn on Location AND Bluetooth."
  *   *Do:* Grey out the feature. When tapped, show a modal: "This feature needs Location." (Now you only localize the error message, not the rule).
  *   *Why:* It moves the logic from a *declaration* to a *constraint*.

  **Option B: Progressive Disclosure (Lazy Localization)**
  Show the icon on the main screen. If the user taps it or hovers, *then* reveal the text explanation.
  *   *Why:* You only pay the localization cost for text that is actually read. Most users won't read the tooltip, but the ones who are confused will. This satisfies the PM's budget concern while saving the UX.

  **Option C: Animation over Static Icons**
  Humans are better at reading narrative in motion than logic in static symbols.
  *   *Example:* An animation showing a signal going from the phone to a satellite, then fading out when a wall appears.
  *   *Why:* It demonstrates causality ("If wall, then no signal") without needing the word "if."
  *   *Downside:* Expensive to produce, hard to localize if the metaphor doesn't land.

  ### 5. How to argue this to your PM
  Do not frame this as "Icons are hard." Frame this as **"Risk and Cost."**

  1.  **The Support Ticket Argument:** "Every user who misunderstands the 'NOT' icon becomes a support ticket or a churned user. The cost of translating 50 strings is $X. The cost of 1,000 confused users is $100X."
  2.  **The Precedent Argument:** "Show me one major global app (WhatsApp, Uber, Instagram, Banking apps) that uses zero text for settings or logic. Even IKEA instructions, the gold standard for visual communication, use text for warnings and complex steps. If the best UX teams in the world use text for logic, it's not a creativity problem; it's a medium limitation."
  3.  **The A/B Test:** Propose a test. "Let's A/B test the Icon-Only flow vs. a Minimal Text flow. If the Icon-Only flow has higher completion rates, we keep it. If not, we use text." (Spoiler: The text flow will win).

  ### Summary
  You are facing a **category error**. You are trying to use a tool designed for *recognition* (icons) to perform *computation* (logic).

  *   **Is it real?** Yes. It is a well-documented limitation in information design.
  *   **Can you fix it with better icons?** No. There is no visual symbol for "unless."
  *   **The Solution:** Use text for logic. Use icons for navigation. If you must avoid text, use interaction states (greyed out buttons) rather than symbolic declarations.

  Your friend in UX research couldn't give you an answer because **there isn't one.** You've hit the wall of what visual language can do. It's time to push back with confidence.
