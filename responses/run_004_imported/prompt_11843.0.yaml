      *   *Point 4: The "Comfort" Trap.* Address the user's psychological state. If it's parity, you have to *create* reasons (Chang's "will"). If it's imprecision, you just acknowledge the limits of value. The comfort comes from feeling like the universe is open, but maybe the universe is just fuzzy.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic but philosophically rigorous. Acknowledge the difficulty of the choice.
      *   *Structure:*
