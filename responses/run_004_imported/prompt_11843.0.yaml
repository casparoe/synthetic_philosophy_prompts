      *   *Refining the SIA Critique:* I need to be careful. Chang anticipates the vagueness objection. She says parity is *determinate* (it is determinately true that they are on a par), whereas vagueness is *indeterminate*.
      *   *Counter to Chang's Counter:* How do we know it's determinate? The phenomenology is the same. The SIA relies on the intuition that $A+$ is not better than B. But if "better than" is vague, then "$A+$ is better than B" might be indeterminate, not false. If it's indeterminate, the logic of SIA (which relies on bivalent truth values) breaks down.
      *   *Key Philosophical Reference:* John Broome? Horgan? No, keep it accessible but precise. Focus on the logic of the SIA itself.
