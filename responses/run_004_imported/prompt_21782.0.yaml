prompt: |-
  I'm reporting a piece on the "right not to know" in genetic testing — the well-documented fact that most people at risk for Huntington's, for instance, choose not to take the test even when it's free, accurate, and takes about an afternoon. While I was talking it through with a friend of mine who's an actual decision theorist (not just a rationalist-blog dabbler), he waved the whole phenomenon away by invoking Good's theorem on the value of information: a rational Bayesian who's about to make a decision should never turn down a costless chance to learn more first, since doing so can only weakly help, never hurt, in expectation. In his view the decliners aren't making some defensible values-based call, they're just being irrational, and the theorem isn't ambiguous about it.

  That answer bugged me, but "ignorance is bliss" obviously wasn't gonna cut it as a comeback against someone quoting an actual theorem at me, so I want to come back better armed. Can you build the most rigorous case you can for the position that Good's theorem does NOT actually convict the decliners of irrationality — that you can accept the theorem completely and still think declining is the rational choice for plenty of these people? Don't give me the hand-wavy version, get into the actual guts of the proof: what its assuming about the decision problem and the action set staying fixed before and after you look, what "costless" is quietly doing there, and whether the classic "you can always just ignore the new evidence and act as you would have anyway" defense of the theorem survives once you allow that simply knowing something (dread, an altered sense of your own future, whatever) can itself be part of what a person values, apart from any action it changes. This is for a sidebar aimed at readers who already know some decision theory, so no need to dumb it down for my sake.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The "right not to know" in genetic testing (specifically Huntington's Disease).
      *   **Conflict:** The user's friend (a decision theorist) claims declining testing is irrational based on Good's Theorem (Value of Information). The user believes there's a rigorous counter-argument.
      *   **Goal:** Build the *most rigorous case possible* that Good's Theorem does *not* convict decliners of irrationality.
      *   **Audience:** Readers who already know some decision theory (no dumbing down).
      *   **Key Constraints:** Get into the guts of the proof, assumptions about action sets, the definition of "costless," and the role of information itself in the utility function (epistemic utility vs. instrumental utility).

  2.  **Deconstruct Good's Theorem (1967):**
      *   *What does it actually say?* In a Bayesian decision framework, the expected utility of making a decision *after* observing free evidence $E$ is always greater than or equal to the expected utility of making the decision *before* observing $E$.
      *   *Formula:* $EU(\text{act after } E) \ge EU(\text{act before } E)$.
      *   *Key Assumptions:*
          1.  **Instrumentalism:** Utility depends *only* on the state of the world and the action taken ($U(s, a)$). It does *not* depend on the information state itself ($U(s, a, E)$).
          2.  **Costless Information:** The act of observing $E$ has no negative utility (no money, time, or psychological cost).
          3.  **Fixed Action Set:** The set of available actions remains the same before and after observation.
          4.  **Bayesian Updating:** The agent updates probabilities correctly via conditionalization.
          5.  **Maximization:** The agent chooses the action that maximizes expected utility in both scenarios.

  3.  **Identify the Loopholes/Counter-Arguments:**
      *   *Argument 1: Psychological Costs (Violating "Costless").*
          *   If knowing causes distress (dread, anxiety), that distress is a *cost*.
          *   *Counter to Friend:* The friend likely dismisses this as "irrational emotion."
          *   *Rigorous Rebuttal:* In decision theory, utility is defined over outcomes. If "living with knowledge of impending doom" is a distinct outcome from "living with uncertainty," and the agent prefers the latter, that is a valid preference ordering. It makes the test *not* costless.
      *   *Argument 2: Utility of Information State (Violating "Instrumentalism").*
          *   Good's theorem assumes information is only valuable instrumentally (to change actions).
          *   If information has *intrinsic* disutility (e.g., ruining the quality of life *now*), the theorem doesn't apply directly.
          *   *Rigorous Rebuttal:* We need to expand the utility function to include the information state: $U(s, a, k)$, where $k$ is the knowledge state. If $U(s, a, \text{know}) < U(s, a, \text{not know})$, the expected utility calculation flips.
      *   *Argument 3: Action Set Changes (Violating "Fixed Action Set").*
          *   Knowing you have HD might remove certain life plans (e.g., having children, certain careers) not because they are physically impossible, but because they become utility-negative *given the knowledge*.
          *   *Rigorous Rebuttal:* This is subtle. It's more about the utility function changing based on the state, but it can be framed as the effective action space being constrained by the psychological burden.
      *   *Argument 4: Non-Bayesian Updating / Resilience.*
          *   Some argue that beliefs shouldn't just be probabilities; they should have "resilience" (Skyrms). High-impact negative news might shatter the decision-making framework itself.
          *   *Decision:* This might be too philosophical/psychological. Stick to standard decision theory modifications first.
      *   *Argument 5: Time Inconsistency / Hyperbolic Discounting.*
          *   The "future self" who knows might be miserable, while the "current self" values current happiness more.
          *   *Decision:* Good's theorem is usually atemporal or assumes a single agent. This is a valid critique but maybe less "guts of the proof" than the utility function argument.

  4.  **Develop the Strongest Rigorous Argument:**
      *   The core issue is the **separability of information and utility**. Good's theorem proves $VoI \ge 0$ *only if* utility is defined solely over world-states and actions, not over belief states.
      *   *Step 1: Formalize Good's Theorem.* Show the inequality.
      *   *Step 2: Isolate the Axiom.* Point out $U(o)$ vs $U(o, k)$.
      *   *Step 3: Introduce "Epistemic Utility" or "Information Aversion".* Cite relevant literature (e.g., Caplin & Leahy, "Psychological Expected Utility Theory").
      *   *Step 4: Reframe "Costless".* If anxiety is a cost, the test isn't free. $C(E) > 0$. If $C(E) > VoI$, then declining is rational.
      *   *Step 5: Address the "Just Ignore It" Defense.* The friend says "You can always ignore the info."
          *   *Rebuttal:* You cannot voluntarily uninfluence your posterior beliefs (Bayesian updating is automatic upon acceptance of evidence). You also cannot voluntarily decouple utility from belief states if the utility derives from anticipation (Loewenstein).

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, rigorous, respectful of the friend's expertise but firm on the limitations of the theorem.
      *   *Structure:*
          1.  Acknowledge the friend is technically right *within the strict bounds of the theorem*.
          2.  Show where the bounds fail to map onto the real-world scenario (The Mapping Problem).
          3.  Deep dive into the Utility Function assumption (Instrumentalism vs. Intrinsic value of ignorance).
          4.  Deep dive into the "Costless" assumption (Psychological costs as real costs).
          5.  Deep dive into the "Ignore It" defense (Cognitive impossibility of un-learning).
          6.  Conclusion: It's not irrationality; it's a different model specification.

  6.  **Refining the Technical Details:**
      *   *Good's Inequality:* $E[\max_a E[U(a)|\omega, E]] \ge \max_a E[U(a)|\omega]$.
      *   *The Violation:* If $U$ depends on $E$ (the signal/knowledge), then $U(a, \omega, E)$.
      *   *Caplin & Leahy (2001):* "Psychological Expected Utility Theory and Anticipatory Feelings." This is the gold standard citation for this. They model anxiety as a function of belief.
      *   *The "Ignore It" Rebuttal:* This relies on the assumption of *free disposal* of information. In standard info theory, you can throw away a signal. In cognitive psychology, you cannot choose not to update a belief once you accept the evidence as true. This violates the "free disposal" assumption implicit in Good's setup.

  7.  **Final Polish:**
      *   Ensure the distinction between *instrumental* value of information and *intrinsic* (dis)utility of information is clear.
      *   Make sure the "costless" argument distinguishes between transaction costs and psychological costs.
      *   Check that the "action set" point is addressed (sometimes knowing restricts actions not physically, but normatively/utility-wise).

  8.  **Self-Correction during drafting:** I initially thought about mentioning non-Bayesian agents. But the prompt asks to accept the theorem and show why decliners are still rational. It's better to argue that the *premises* of the theorem don't hold for this specific decision problem, rather than attacking Bayesianism itself. The rationality lies in the correct specification of the utility function, not in violating Bayes' rule.

      *Wait, one nuance:* The friend says "decliners are irrational." To prove them rational, I need to show that *given their actual preferences*, declining maximizes utility. Good's theorem says "Given standard preferences, testing maximizes utility." So the conflict is about preference specification. Is preferring ignorance "irrational"? Standard decision theory says preferences are exogenous. If I prefer chocolate to vanilla, that's not irrational. If I prefer ignorance to knowledge, is that irrational? Only if knowledge is assumed to be a pure good. But if knowledge causes pain, it's a bad. So, it comes down to whether "mental state" is a valid argument in the utility function. Yes, it is (Sen, Caplin, etc.).

      *Okay, let's structure the argument around the "State Space" definition.* Good's theorem assumes the state space is physical. If the state space includes mental states, the theorem's conclusion changes.

      *Let's write it.*
answer: |-
  Your friend is technically correct but substantively wrong. He is applying a theorem derived for a specific class of decision problems (instrumental information acquisition with state-independent utility) to a problem that falls outside that class (intrinsic utility of belief states).

  To arm yourself for this sidebar, you need to show that Good's Theorem (1967) is not a universal law of rationality, but a conditional proof that relies on specific axioms about the utility function and the nature of information. When those axioms fail to map onto the phenomenology of genetic testing, the theorem's conclusion collapses.

  Here is the rigorous case for why declining the test is consistent with expected utility maximization, provided we specify the decision problem correctly.

  ### 1. The Guts of Good's Theorem: Where the Axioms Live
  Good's proof demonstrates that the expected utility of making a decision *after* observing free evidence $E$ is greater than or equal to the expected utility of deciding *before*.

  Formally, let $A$ be the set of actions, $\Omega$ the state space, and $U(a, \omega)$ the utility function.
  The value of information is positive because:
  $$ E_{\omega, E} [ \max_{a \in A} E[U(a, \omega) | E] ] \ge \max_{a \in A} E[U(a, \omega)] $$

  The inequality holds because the agent on the LHS can always choose to ignore the evidence and take the action on the RHS. Therefore, having the option to condition action on $E$ must weakly dominate not having it.

  **The Catch:** This proof relies on the assumption that $U$ is defined **only** over actions and physical world-states ($\omega$). It assumes information is purely *instrumental*. It enters the calculation only by shifting the probability distribution $P(\omega|E)$, not by entering the utility function itself.

  ### 2. Violation 1: Utility Over Belief States (The Caplin & Leahy Objection)
  The most rigorous counter-argument comes from expanding the domain of the utility function. In the standard Good framework, utility is $U(a, \omega)$. In the case of Huntington's, utility is more accurately modeled as $U(a, \omega, \pi)$, where $\pi$ is the agent's subjective belief state (or information set).

  If an agent derives **intrinsic disutility** from holding a specific belief (e.g., "I carry the mutation"), then acquiring information changes the utility function directly, not just the probability weights.

  *   **The Formal Shift:** If $U(a, \omega, \text{know}) < U(a, \omega, \text{ignorant})$, then the expected utility of testing includes a negative term for the psychological cost of knowing.
  *   **The Literature:** Cite **Caplin and Leahy (2001), "Psychological Expected Utility Theory and Anticipatory Feelings."** They formalize the idea that agents derive utility from *anticipation*. If the anxiety cost of the belief $\pi = 1$ (certain disease) outweighs the instrumental benefit of planning around that disease, the net value of information becomes negative.
  *   **The Verdict:** Good's theorem does not apply to utility functions that are non-separable with respect to information. Preferring ignorance isn't irrational; it's a preference over mental states, which is a valid argument for $U$. To call it irrational is to impose an external normative constraint on what agents are allowed to value (i.e., "you must only value physical outcomes"), which violates the standard Humean view that preferences are exogenous.

  ### 3. Violation 2: The "Costless" Assumption and Free Disposal
  Your friend invokes the "costless" clause of Good's theorem. He likely interprets this as "no money, no time." But in decision theory, a cost is any reduction in utility.

  *   **Psychological Cost as Transaction Cost:** If receiving the result induces dread, depression, or a "spoiled present," that is a utility cost $C(E) > 0$. Good's theorem only guarantees $VoI \ge 0$ if $C(E) = 0$. If the psychological burden $C(E)$ exceeds the instrumental value of the information, rational choice dictates declining.
  *   **The "Free Disposal" Fallacy:** Your friend's fallback is likely: *"But Good's theorem says you can always ignore the info. So the cost is zero."*
      *   **The Rebuttal:** This assumes **free disposal of information**. In standard information theory, an agent can observe a signal $s$ and choose to act as if they never saw it. In cognitive psychology, **Bayesian updating is not voluntary.** Once you accept the test result as evidence, you *cannot* maintain your prior belief. You cannot "ignore" the knowledge that you have a 99% chance of early-onset dementia while making life plans.
      *   **Rigorous phrasing:** The "ignore it" defense assumes the action set $A$ includes a strategy "Act as if $E$ was not observed" that successfully decouples the agent's belief state from their utility. If utility depends on belief (see point 1), and belief updates automatically upon observation (Bayesian conditionalization), free disposal is impossible. The information is not freely disposable; it is cognitively sticky. Therefore, the "costless" assumption is violated.

  ### 4. Violation 3: The Action Set and Dynamic Consistency
  Good's theorem assumes a static decision problem: you make a choice, the game ends. But genetic testing initiates a **dynamic sequence** of decisions.

  *   **Restriction of Effective Action Space:** Knowing you have Huntington's may not physically remove actions (you can still have children), but it may render certain high-utility actions *inaccessible* due to the change in the utility function. For example, "Hopeful Long-Term Planning" might yield high utility under ignorance ($U=100$) but negative utility under knowledge ($U=-50$) because the planning becomes painful or futile.
  *   **Time Inconsistency:** If we model this as a game between "Self at $t_0$" (deciding to test) and "Self at $t_1$" (living with the result), we risk a Pareto inferior outcome. If $t_0$ values the tranquility of $t_1$'s ignorance more than $t_1$ values the instrumental advantage of knowledge, declining is the rational choice for the temporal agent as a whole.
  *   **Resilience (Skyrms):** Some decision theorists (like Brian Skyrms) argue that rationality isn't just about probability weights, but about the **resilience** of the decision framework. High-impact negative information can shatter the framework required to maximize utility (e.g., inducing depression that lowers the capacity to derive utility from *any* action). If the information destabilizes the maximization engine itself, the expected utility calculation is undefined or negative.

  ### 5. Summary for the Sidebar
  You can summarize the technical rebuttal like this:

  > Good's Theorem proves that information has non-negative value *only if* three conditions hold: (1) utility depends solely on physical outcomes, not mental states; (2) information is truly costless, including psychologically; and (3) agents can voluntarily "un-learn" evidence they wish to ignore.
  >
  > In the case of Huntington's, all three fail.
  > 1.  **Utility is belief-dependent:** People value hope and dread is a cost.
  > 2.  **Information is costly:** The psychological burden is a real utility tax.
  > 3.  **Disposal is impossible:** You cannot choose to remain uncertain once you know.
  >
  > Therefore, the decliners are not violating decision theory; they are correctly solving a decision problem that your friend has misspecified. They are maximizing expected utility over a state space that includes their own peace of mind.

  ### The "Kill Shot" Argument
  If he pushes back, hit him with this:

  **"Good's Theorem is a theorem about the value of information for *control*. It assumes the agent's goal is to match actions to states. But if the agent's goal includes *experiencing* the states in a particular way (e.g., without dread), then information is not just a tool for control, it is an input into consumption. You wouldn't quote Good's Theorem to prove it's irrational to decline a free spoiler for a movie you're watching. Why? Because the utility of the movie depends on your ignorance of the plot. Genetic testing is the same: for many, the 'movie' of their life is better watched without reading the script first."**

  This frames the issue not as a failure of rationality, but as a failure of his model to capture the *consumption value* of ignorance.
