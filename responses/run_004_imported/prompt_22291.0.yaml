answer: |-
  **Setting:** *The Grand Hall of the International Physics Congress, Geneva, 2100. A hush has fallen over the assembly. On the podium, Dr. Aris Thorne has just finished a ten-minute intervention arguing that the proposed "Omega Collider" experiment is unnecessary. The experiment was designed to distinguish between Theory $T_1$ (universe contains $10^{24}$ observers) and Theory $T_2$ (universe contains $10^{36}$ observers). Thorne argues that Self-Indication Assumption (SIA) renders $T_2$ a trillion trillion times more probable prior to any data. Professor Julian Vane, a senior epistemologist seated in the front row, stands up abruptly.*

  **Vane:** (Voice booming) Dr. Thorne, you are asking us to cancel a ten-billion-credit experiment based on a syllogism? You claim that because $T_2$ posits more observers, your existence makes $T_2$ virtually certain. This is the Presumptuous Philosopher in the flesh. You are deriving the structure of the cosmos from the fact that you are sitting in the chair.

  **Thorne:** I am deriving it from the laws of probability, Professor. If I draw a ball from an urn, and the ball is red, I should favor the hypothesis that the urn contains mostly red balls. If $T_2$ is true, there are a trillion trillion times more "seats in chairs" like this one than if $T_1$ is true. That I am in one of them is evidence for $T_2$. To ignore this is to ignore the data of my own existence.

  **Vane:** But the ball *exists* in both urns! In both theories, *you* exist. The Self-Sampling Assumption (SSA) treats you as a random sample from the set of *actual* observers. Since both theories predict actual observers like us, the ratio remains one-to-one. You are conflating *possible* observers with *actual* ones. SIA allows you to boost the probability of a hypothesis simply because it populates the universe with more ghosts. It licenses armchair cosmology. You can rule out sparse universes without looking through a telescope.

  **Thorne:** And your SSA licenses armchair eschatology. If you insist on treating me as a random sample from the set of *actual* observers, look at the temporal distribution. If humanity survives for millions of years, the number of future humans will dwarf the number of past humans. If I am a random sample from that total set, it is overwhelmingly unlikely that I would find myself among the first few billion. The fact that I *am* early implies the total set must be small. Your view, Professor, doesn't just save the experiment; it proves humanity will go extinct within the next few centuries. The Doomsday Argument is the tax you pay for avoiding my presumptuousness.

  **Vane:** (Pauses, gripping the back of the chair in front of him) The Doomsday Argument is a *reductio*, Dr. Thorne, not a feature. It shows where SSA requires refinement, not where it fails. We fix it by narrowing the reference class. I am not a random sample from "all observers." I am a random sample from "observers with access to 21st-century cosmological data." That class is not growing exponentially. By restricting the class to those epistemically situated like me, the Doomsday implication evaporates. I don't have to bet on extinction; I just have to bet on my own cognitive context.

  **Thorne:** That is ad hoc maneuvering, and you know it. You are tuning the reference class specifically to avoid the conclusion you dislike. If you can shrink the class to "physicists in 2100" to avoid Doomsday, why not shrink it to "people who believe $T_1$" to prove $T_1$? The Reference Class problem isn't a bug you can patch; it's the hole in the hull. If the choice of reference class determines the empirical verdict, then SSA has no predictive power until you specify the class. But if you specify the class *after* seeing the implications, you aren't doing epistemology; you're doing damage control. Does narrowing the class escape the commitment, or does it just relocate the arbitrariness from the conclusion to the premise?

  **Vane:** It relocates it to a premise we can debate on independent grounds! We can argue about whether "access to cosmological data" is a relevant similarity without invoking the end of the world. But let's return to your "data." You claim your existence is evidence for $T_2$. Why? Because there are more of *you*? This is the heart of my objection. In standard Bayesianism, evidence $E$ confirms $H$ if $P(E|H) > P(E|\neg H)$. But $E$ here is "I exist." "I exist" has probability 1 in any world where I am reasoning. You are treating a precondition of reasoning as a variable outcome.

  **Thorne:** No, I am treating *self-locating* information as evidence. It is not just "I exist." It is "I am *this* observer." In a $T_2$ universe, the proportion of observers who have my exact subjective state is vastly higher than in a $T_1$ universe. If you walk into a casino and win the lottery, you should suspect the game is rigged, or that there are many lotteries running. If there are a trillion trillion lotteries ($T_2$) versus one trillion ($T_1$), the fact that *you* hold a winning ticket favors the multi-lottery hypothesis. To deny this is to claim that your indexical position in the universe is uncorrelated with the universe's size. That is the real magic act.

  **Vane:** But in the casino, the tickets are physical objects distributed by a mechanism. In cosmology, the "observers" are the mechanism. You are using the output to prove the input. If I accept SIA, I must accept that I can know the size of the universe by sitting in a dark room and thinking about how many people *could* exist. That violates the principle that empirical claims require empirical verification. You are asking the physicists to trust your priors over their detectors.

  **Thorne:** I am asking them to trust that their detectors are located in a universe that is likely to contain detectors! If $T_1$ were true, it would be incredibly unlikely for *me* to be here observing it, simply because there are so few "heres" available. You accuse me of armchair cosmology, but you are willing to bet the survival of our species on a reference class trick to avoid looking in the mirror. Which is more expensive, Professor? Wasting ten billion credits on an experiment that SIA says is redundant, or ignoring a probabilistic proof that our lineage is about to be culled?

  **Vane:** The cost of being presumptuous is error. The cost of Doomsday is panic. But there is a middle ground you ignore. SSA does not demand we ignore the size of the universe; it demands we condition on the fact that we are *already* here. Once we condition on existence, the number of other observers shouldn't shift the odds between theories that both allow us. Your SIA penalizes sparse worlds unfairly. It implies that a theory predicting a trillion observers is *a priori* more likely than one predicting one, solely because of the number. That is an ontological bias, not an epistemic one. You are assuming the universe *wants* to be populated.

  **Thorne:** I am assuming nothing about what the universe wants. I am accounting for the observation selection effect. If you flip a coin, and Heads creates a million observers and Tails creates one, and you find yourself as an observer, you should bet on Heads. Not because the coin is biased, but because *you* are more likely to be there if it lands Heads. If you reject this, you must explain why the reasoning changes when the observers are cosmological. Is there a principled reason to trust self-locating evidence in the coin case but not the cosmological case? Or do you simply dislike the consequence?

  **Vane:** The principled reason is causal independence. In the coin case, the observers are created *by* the outcome. In the cosmological case, the theories describe the background conditions *for* the observers. You are double-counting. But fine. Let's say I grant you the Reference Class problem is difficult. Let's say I grant SSA implies some version of Doomsday. Is that worse than your Presumptuousness? If I accept SSA, I might wrongly predict extinction, but I remain open to empirical data about $T_1$ and $T_2$. If I accept SIA, I close the book on empirical data entirely. I have made physics subordinate to indexical logic. I cannot *learn* from the experiment, because I've already decided the result. That is dogmatism, Aris.

  **Thorne:** And I say it is rationality. If the math says the experiment is redundant, running it is the dogma. You cling to the idea that we need to "look" to know, even when the logic of observation tells us what we'll see. You fear being presumptuous, so you embrace a worldview where our early birth is a ominous sign of death. I embrace a worldview where our existence is a sign of abundance. Both of us are making bets from the armchair, Julian. The only difference is the size of the universe we are willing to imagine.

  **Vane:** (Sits down slowly, but keeps his gaze fixed on Thorne) Then we are at an impasse. You are willing to bet on abundance at the cost of empirical closure. I am willing to bet on empirical openness at the cost of existential dread.

  **Thorne:** (Nods, turning back to the microphone) Then let the physicists decide which cost they can afford. The math is clear. The question is whether you have the courage to accept where the probability mass lies.

  *(The hall remains silent. The chair of the committee looks from Thorne to the physicists holding the budget codes. No one moves to switch off the projector.)*
