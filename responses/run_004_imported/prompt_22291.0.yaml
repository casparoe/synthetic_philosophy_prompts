      *   **Characters:**
          *   SIA Proponent (Self-Indication Assumption): Believes you should reason as if you are randomly selected from all *possible* observers. Implication: $T_2$ is vastly more likely. Experiment is a waste.
          *   SSA Proponent (Self-Sampling Assumption): Believes you should reason as if you are randomly selected from a specific *reference class* of actual observers. Implication: $T_1$ and $T_2$ remain roughly equal (prior to experiment). But implies Doomsday Argument.
      *   **Key Constraint:** No simple summaries. The trade-off must be *fought out*. Each side must engage the specific objection raised.
          *   SSA must challenge SIA's "armchair cosmology."
          *   SIA must counter with SSA's "Doomsday Argument" commitment.
          *   SSA must address the Reference Class problem/Doomsday relocation.
          *   SIA must address the principled reason for trusting self-locating evidence.
      *   **Tone:** Philosophical dialogue, rigorous but dramatic (set *at* the moment of the scenario).
      *   **Outcome:** Unresolved, but balanced. No cheap concessions.

  2.  **Character Conception:**
      *   **SIA Proponent (let's call her Dr. Aris Thorne):** Confident, Bayesian, focused on the logic of existence as evidence. Sees SSA as arbitrary.
      *   **SSA Proponent (let's call him Prof. Julian Vane):** Cautious, focused on empirical grounding, worried about the metaphysical overreach of SIA. Haunted by the Doomsday implication but trying to manage it.

  3.  **Setting the Scene:**
      *   Year 2100. Conference hall. Tension high. Physicists ready to spend credits on the "Great Collider" or similar. Thorne stands up to stop it. Vane interrupts from the floor.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Thorne makes the SIA claim. The experiment is unnecessary because $T_2$ (trillion trillion observers) is overwhelmingly more likely simply because *we exist*.
      *   **Vane's Counter (SSA):** This is absurd. You're deriving physics from metaphysics. SSA says we treat ourselves as random samples from *actual* observers, not possible ones. Since both theories allow for us, the odds stay even. The experiment is needed.
      *   **Thorne's Rebuttal (The Turn):** If you stick to SSA, you fall into the Doomsday Trap. If you think you are a random sample from all humans who *will* exist, and you find yourself early in the sequence, the bulk of humans must be near you. Hence, extinction soon. You claim my view is presumptuous; yours is morbid.
      *   **Vane's Defense (Reference Class):** I can narrow the reference class. I'm not a random "observer," I'm a "physicist in 2100." If I narrow it enough, Doomsday vanishes.
      *   **Thorne's Counter-Defense (Arbitrariness):** That's ad hoc. Why that class? If you can tune the class to avoid Doomsday, you can tune it to avoid any conclusion. It makes the theory unfalsifiable. Plus, does narrowing the class save you from the Presumptuous Philosopher charge?
      *   **Vane's Pushback (Empirical Anchor):** SIA allows existence to confirm theories. That's the core issue. Why does *my existence* confirm a theory with more people? That's magic. SSA keeps existence as a precondition, not evidence.
      *   **Thorne's Final Salvo (The Principle):** Existence *is* evidence. If I win a lottery, I should suspect the lottery had more winners. To deny this is to ignore the selection effect. You accept selection effects in quantum mechanics (many worlds), why not here?
      *   **Closing:** Standoff. The cost of SIA (Presumptuousness) vs. The cost of SSA (Doomsday/Reference Class arbitrariness).

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did Vane actually address the Reference Class objection substantively?
      *   *Correction:* Make sure Vane doesn't just say "I choose a small class." He needs to argue *why* a restricted class is epistemically valid (e.g., shared cognitive architecture) and admit it might not fully kill Doomsday but mitigates it.
      *   *Check:* Did Thorne address why self-locating evidence settles empirical bets?
      *   *Correction:* Thorne needs to argue that "I exist" is a data point. If Theory A makes "I exist" more probable (by having more 'I's), Theory A is favored. This is the core of SIA.
      *   *Tone Check:* Ensure they aren't just lecturing. They need to interrupt, challenge, and react to the specific pressure.

