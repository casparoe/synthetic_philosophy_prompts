prompt: |-
  So there's this move Hilary Greaves makes to try to save consequentialism from the "cluelessness" problem (the worry that we can never really know the long-run effects of our actions, so expected value calculations are kind of hopeless). She splits it into "simple" cluelessness, where the unforeseeable effects are symmetric and just cancel out in expectation, and "complex" cluelessness, where we have some shaky systematic reason to think effects skew one way, but that reason is itself unstable. Can you argue that this distinction doesnt actually save expected-value reasoning for consequentialists, basically that her "simple" cases turn out to be just as complex/clueless as the ones she's worried about once you look closely?
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Hilary Greaves' response to the "cluelessness" objection against consequentialism (specifically expected utility maximization).
      *   **Greaves' Distinction:**
          *   *Simple Cluelessness:* Unforeseeable effects are symmetric/random. They cancel out in expectation ($E[X] = 0$). We can ignore them.
          *   *Complex Cluelessness:* We have *some* reason to think effects skew one way, but that reason is unstable/defeasible. This creates decision paralysis.
      *   **Greaves' Goal:** Save consequentialism by arguing most cases are "simple," so we can proceed with standard EV calculations based on foreseeable effects.
      *   **Task:** Argue *against* Greaves. Specifically, argue that the distinction fails because "simple" cluelessness is actually just as problematic as "complex" cluelessness upon closer inspection. Essentially, collapse the distinction.

  2.  **Understand Greaves' Position (Mental Sandbox):**
      *   Greaves (in "The Cluelessness Problem," 2016) acknowledges that actions have infinite causal chains (butterfly effect).
      *   If we can't estimate the long-term value, EV is undefined.
      *   Her move: If the unknown effects are *independent* and *symmetrically distributed* around zero, their expected value is zero. So, $EV(Action) = EV(Known) + EV(Unknown) = EV(Known) + 0$.
      *   She admits "complex" cluelessness (where we have a hint of skew) is hard, but claims "simple" is common and manageable.

  3.  **Brainstorming Counter-Arguments (Collapsing the Distinction):**
      *   *Argument 1: The Reference Class Problem.* To say effects are "symmetric," you need a reference class of similar actions/effects. But how do you define that class? Different definitions yield different symmetries. This introduces the instability Greaves associates with "complex" cluelessness into "simple" cases.
      *   *Argument 2: Non-Linearity of Value.* Value isn't linear. A small positive effect + a small negative effect $\neq$ zero if one triggers a tipping point. Symmetry in *causal impact* doesn't imply symmetry in *value*.
      *   *Argument 3: Correlation/Dependency.* Greaves assumes independence. But long-term effects are likely correlated. If I save a life, that person has kids, who have kids. The "noise" isn't random walk; it's a trend. Random walks aren't always mean-reverting in value space.
      *   *Argument 4: The "Zero" Baseline is Arbitrary.* Why is the default expectation zero? Maybe the default state of the universe is declining value, so any intervention has a skewed baseline. Deciding the baseline is zero is itself a contested, unstable judgment (complex cluelessness).
      *   *Argument 5: Epistemic Access.* How do we *know* it's simple? To verify symmetry, we need knowledge about the distribution of unknown effects. But if they are unknown, we can't verify the distribution. Asserting symmetry is an empirical claim without evidence, which is itself an unstable reason (complex).

  4.  **Developing the Strongest Line of Attack:**
      *   The prompt asks to argue that "simple" cases turn out to be "complex."
      *   The core of "complex" cluelessness is *unstable reasons for skew*.
      *   The core of "simple" cluelessness is *asserted symmetry*.
      *   *The Pivot:* Asserting symmetry *requires* a reason. That reason is inevitably unstable. Therefore, simple cluelessness *is* complex cluelessness.
      *   *Key Concept:* **The Principle of Indifference.** Greaves relies on a version of this. But applying the Principle of Indifference to causal chains is notoriously fragile (Bertrand's Paradox style issues).
      *   *Key Concept:* **Value Skew.** Even if causal effects are symmetric (e.g., someone lives 5 years longer vs 5 years shorter), the *value* might not be. (e.g., Living longer allows for more good, dying sooner prevents bad? Or vice versa).

  5.  **Drafting the Argument Structure:**
      *   **Introduction:** Briefly state Greaves' position and the goal (to collapse the distinction).
      *   **Point 1: The Epistemic Gap (How do you know it's simple?).** To classify a case as "simple," you need positive evidence of symmetry. But lacking evidence is not evidence of symmetry. Asserting symmetry without evidence is an unstable epistemic move.
      *   **Point 2: Non-Linearity of Value.** Symmetry in events $\neq$ symmetry in utility. The mapping from world-states to value is likely non-linear. This turns symmetric causal noise into skewed value noise.
      *   **Point 3: The Reference Class/Partition Problem.** Symmetry depends on how you carve up the possibilities. Different partitions give different expectations. Choosing a partition is a source of instability (complex cluelessness).
      *   **Point 4: Correlated Chains (The Butterfly Effect isn't Random Walk).** Long-term effects aren't independent coin flips. They are path-dependent. Path dependence creates skew.
      *   **Conclusion:** The "simple" category is empty or vanishingly small. The problem remains.

  6.  **Refining the Tone:**
      *   Needs to be philosophical, rigorous, but accessible.
      *   Acknowledge Greaves' sophistication (she's a heavyweight).
      *   Use terms like "Principle of Indifference," "non-linear utility," "partition sensitivity."

  7.  **Self-Correction/Review during drafting:**
