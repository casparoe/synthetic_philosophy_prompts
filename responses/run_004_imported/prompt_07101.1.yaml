answer: |-
  This is a sophisticated objection to one of the most sophisticated defenses of consequentialism. Hilary Greaves' 2016 paper, "The Cluelessness Problem," is widely regarded as the best attempt to rescue expected utility theory from the worry that long-term consequences are unknowable. Her strategy is to bifurcate the problem: **Simple Cluelessness** (where unknown effects are symmetric and cancel out) vs. **Complex Cluelessness** (where we have defeasible reasons to suspect a skew). She argues we can ignore the former and only worry about the latter.

  To argue that this distinction fails, you need to demonstrate that the epistemic conditions required to classify a case as "simple" are themselves subject to the instability that defines "complex" cluelessness. In short: **There is no stable ground on which to stand and declare a case "simple."**

  Here is an argument for why Greaves' distinction collapses, rendering expected-value (EV) reasoning hopeless even in her "simple" cases.

  ### 1. The Epistemic Instability of "Symmetry"
  Greaves' defense of simple cluelessness relies on a version of the **Principle of Indifference**. She suggests that if we have no evidence that the unforeseeable effects skew positive rather than negative, we are licensed to treat the expected value of those effects as zero.

  However, the claim "I have no reason to think the effects skew positive" is itself an unstable epistemic judgment.
  *   **The Problem of Hidden Skews:** To confidently assert symmetry, I must be sure that my ignorance is not itself biased. But how can I know that? My ignorance is a product of my cognitive limitations and my position in history. For example, a 19th-century utilitarian might have thought the long-term effects of industrialization were "simply clueless" (symmetric). We now know there was a massive systematic skew (climate change, existential risk).
  *   **The Collapse:** If I cannot rule out the possibility that my ignorance is systematically biased (e.g., by selection effects, or by the fact that I am only aware of *some* causal pathways), then my reason for treating the case as "simple" is defeasible. But a defeasible reason for thinking effects are symmetric is exactly what Greaves defines as **Complex Cluelessness**.
  *   **Conclusion:** You cannot classify a case as "simple" without making a higher-order judgment about the nature of your ignorance. That higher-order judgment is inevitably shaky. Therefore, every "simple" case hides a "complex" problem at the meta-level.

  ### 2. Causal Symmetry $\neq$ Axiological Symmetry
  Greaves' argument assumes that if causal effects are symmetric, their *value* is symmetric. She assumes that if an action is equally likely to cause event $A$ or event $\neg A$, and those events are causally symmetric, their contribution to the good cancels out. This assumes a linear relationship between causal impact and moral value.

  *   **Non-Linear Value Functions:** Moral value is likely non-linear. Consider a "tipping point" model of history. Suppose the long-term future is valuable only if humanity survives the next 1,000 years. An unforeseeable effect that delays a catastrophe by 10 years might have near-zero value, while an effect that accelerates it by 10 years might have infinite negative value.
  *   **The Skew:** Even if the *causal* noise is symmetric (e.g., equally likely to speed up or slow down a process), the *value* noise is heavily skewed because of the non-linear stakes.
  *   **The Collapse:** To claim a case is "simple," I must know not just the causal distribution, but the *value* distribution of those causes. But assessing the value distribution of unforeseeable long-term effects requires the exact kind of long-term forecasting that cluelessness says is impossible. If I try to justify the linearity of value, I enter the realm of unstable, defeasible reasoning (Complex Cluelessness). If I don't, I'm making an unjustified assumption.

  ### 3. Partition Dependence (Bertrand's Paradox)
  A technical but devastating problem for the "simple" cluelessness defense is **partition dependence**. The expected value of "unknown effects" changes depending on how you carve up the possibility space.

  *   **The Problem:** Imagine I don't know the long-term impact of giving \$100 to a stranger.
      *   *Partition A:* I divide the unknown outcomes into "Good," "Bad," and "Neutral." If I treat these as equally likely (Indifference), the EV is positive (since Good > Neutral > Bad).
      *   *Partition B:* I divide the outcomes by the specific number of people who eventually exist because of this act. The distribution looks different.
      *   *Partition C:* I divide outcomes by the timing of the effect.
  *   **The Instability:** There is no privileged way to partition the space of "unforeseeable effects." Greaves needs the expectation to be zero across all valid partitions for the "simple" defense to hold. But it won't be.
  *   **The Collapse:** Deciding *which partition* is the correct one for calculating EV is a philosophical judgment with no settled answer. Any reason I give for preferring Partition A over Partition B will be shaky and defeasible. Thus, the attempt to calculate the "simple" EV introduces a new layer of unstable reasoning. The "simple" calculation dissolves into a "complex" debate about reference classes.

  ### 4. Path Dependence and Correlation
  Greaves' model of simple cluelessness treats unforeseeable effects somewhat like a **random walk** (independent steps that cancel out over time). This assumes that the long-term causal chain is a series of independent noise events.

  *   **Chaotic Systems:** Causal chains in social and biological systems are not random walks; they are chaotic and path-dependent. A small effect early on (the butterfly effect) doesn't just add noise; it selects a *trajectory*.
  *   **The Lock-In:** Once a trajectory is selected (e.g., a specific technology becomes dominant due to a random early adoption), the subsequent effects are correlated with that choice. They don't cancel out; they compound.
  *   **The Collapse:** To treat a case as "simple," I must assume the causal chain is mean-reverting (it tends back to zero). But if the causal chain is path-dependent (it locks in), the variance grows over time without the mean returning to zero. Determining whether a specific causal chain is mean-reverting or path-dependent is an empirical question we cannot answer for the long term. Asserting it is mean-reverting is an unstable empirical claim—again, pushing the case into "complex" cluelessness.

  ### Summary of the Argument
  Greaves wants to save consequentialism by carving out a safe zone ("simple cluelessness") where we can ignore the unknown. She defines this zone by the absence of reasons to suspect skew.

  The counter-argument is that **the absence of evidence is not evidence of absence, and asserting it requires evidence.**
  1.  To claim symmetry, you need to know the distribution of value (which is non-linear).
  2.  To claim symmetry, you need to know the correct partition of possibilities (which is arbitrary).
  3.  To claim symmetry, you need to know the causal structure is mean-reverting (which is empirically unknowable).

  Every time you try to justify that a case is "simple," you are forced to make a substantive, defeasible claim about the world, value, or probability. As soon as you make that claim, you have introduced the "unstable systematic reason" that Greaves reserves for **Complex Cluelessness**.

  Therefore, the category of "Simple Cluelessness" is empty. All cases of long-term uncertainty involve complex cluelessness, and the expected value of our actions remains fundamentally undefined. Greaves' distinction doesn't solve the problem; it just relabels the unsolvable part.
