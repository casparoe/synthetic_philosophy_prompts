  8.  **Final Polish:** (Mental check of the Greaves 2016 paper specifics). Greaves argues that for simple cluelessness, we can apply the Principle of Indifference. The counter-argument should target the applicability of that principle in causal contexts.

      *(Self-Correction)*: Wait, Greaves actually discusses the Principle of Indifference and rejects it in some contexts, relying more on the idea that *absence of evidence of skew* permits treating as zero. I need to target *that* specific move. The move is: "If I have no reason to think $X > Y$, I should treat $E[X-Y] = 0$."
      *Counter:* Having "no reason" is itself an unstable epistemic state. As soon as you reflect on *why* you have no reason, you might find a reason (e.g., selection bias in your knowledge).

