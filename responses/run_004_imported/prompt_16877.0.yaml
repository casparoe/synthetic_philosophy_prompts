prompt: |-
  I've read Eliezer's quantum physics sequence on LessWrong probably three times over the years, and the bit that always stuck with me is the arguement that Bell's theorem doesn't actually prove nonlocality -- it only rules out local theories where a measurement has one definite outcome, and since many-worlds drops the single-outcome assumption instead of locality, it just walks straight through the theorem untouched. Very satisfying, cake and eat it too. But I've since run into physicists, Tim Maudlin especially, who think this is kind of a bait-and-switch: that MWI isn't "local" in the sense that actually matters once you ask what the theory has to posit to get the correlations right, something about the wavefunction not being a thing in ordinary space, or the branches needing to line up across space in a way that smells suspiciously frame-dependent. Can you actually walk through where the real disagreement is? Like, are Eliezer and Maudlin just using "local" to mean two different things, in which case fine, or is there some actual physical commitment MWI has to make beyond "no collapse" that quietly smuggles back in something Bell-theorem-adjacent, just not the signalling kind. And please don't give me the "well it depends what you mean by local" non-answer -- I want to know what's actually being disputed and who's got the stronger case.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Background:** The user is familiar with Eliezer Yudkowsky's Quantum Physics Sequence on LessWrong (specifically the argument that Many-Worlds Interpretation (MWI) avoids Bell's Theorem by rejecting "single outcome" rather than "locality").
      *   **Conflict:** The user has encountered counter-arguments from physicists like Tim Maudlin, who claim MWI isn't truly local in a physically meaningful sense (wavefunction not in 3D space, branch alignment issues, etc.).
      *   **Goal:** The user wants to understand the *real* disagreement. Is it just semantics ("local" means different things), or is there a substantive physical commitment MWI makes that smuggles in non-locality?
      *   **Constraint:** Do not give the "it depends on what you mean by local" non-answer. Identify the specific physical/ontological dispute and evaluate who has the stronger case.

  2.  **Deconstruct the Core Arguments:**

      *   **Eliezer/Deutsch/Wallace (Pro-MWI Locality):**
          *   Bell's Theorem assumes: Locality + Realism + *Single Outcome*.
          *   MWI keeps Locality (Schrödinger equation is local) and Realism (wavefunction is real).
          *   MWI rejects Single Outcome (all outcomes happen).
          *   Therefore, Bell's inequalities don't apply.
          *   No action-at-a-distance is needed to explain correlations; they arise from the structure of the entangled state evolving locally.

      *   **Maudlin/Seevinck/Valentini (Anti-MWI Locality):**
          *   Bell's notion of locality is about *beables* (physical stuff) in spacetime.
          *   The wavefunction lives in Configuration Space ($3N$ dimensions), not 3D space.
          *   For MWI to recover the *appearance* of a single world with specific correlations, the "branches" must align.
          *   This alignment or the structure of the wavefunction itself encodes non-separable correlations that exist across spacelike separation *before* measurement.
          *   Maudlin argues that if the ontology isn't in 3D space, "locality" in the sense of relativistic causality is vacuous or redefined in a way that cheats the spirit of Bell.

  3.  **Identify the Substantive Dispute (Beyond Semantics):**
      *   It's not *just* semantics, though semantics play a role. The core dispute is **Ontological**: *Where does the physics happen?*
      *   **Side A (Eliezer):** Physics happens in the Hilbert Space/Configuration Space via the local evolution of the wavefunction. 3D space is emergent. If the fundamental equation is local in the fundamental space, the theory is local.
      *   **Side B (Maudlin):** Physics must account for events in 3D spacetime (the world we observe). If the fundamental ontology (wavefunction) is in $3N$ space, then a change in one part of the wavefunction (corresponding to particle A) instantly affects the description of the other part (particle B) *in the fundamental ontology*, even if no signal is sent. This is "non-separability," which Maudlin equates to a form of non-locality relevant to Bell.

  4.  **Evaluate the "Bait-and-Switch" Claim:**
      *   Maudlin's charge is that MWI proponents redefine "local" to mean "unitary evolution in Hilbert space" rather than "influences confined to light cones in 3D space."
      *   Is it a bait-and-switch?
          *   *Yes,* if you demand Bell's "Local Causality" applies to outcomes in 3D space. MWI doesn't have unique outcomes in 3D space.
          *   *No,* if you accept the wavefunction as the primary reality. The evolution is strictly local in configuration space.
      *   *Crucial Point:* Bell's Theorem rules out *Local Hidden Variable* theories. MWI isn't a hidden variable theory; it's a wavefunction-only theory. But does it satisfy *Bell Locality*?
      *   Bell Locality condition: $P(A|B, \lambda) = P(A|\lambda)$. In MWI, there is no unique $A$ or $B$. So the condition is ill-defined.
      *   Maudlin's counter: To get the *statistics* of $A$ and $B$ to match quantum predictions, the wavefunction must have a structure that correlates spacelike regions non-separably.

  5.  **Synthesize the "Real" Disagreement:**
      *   **The Ontology of the Wavefunction:** Is the wavefunction a field in 3D space (No, it's in $3N$)? If it's in $3N$, is that space "physical"?
      *   **Separability:** A theory is separable if the state of the whole is determined by the state of its parts. QM (including MWI) is *non-separable*. Entanglement means the state of the system is not just State(A) + State(B).
      *   **Maudlin's Point:** Non-separability is a form of non-locality. Even if no signal travels, the fact that the physical state of region $X$ cannot be specified without reference to region $Y$ violates the spirit of relativity's local realism.
      *   **Eliezer's Point:** "Non-separability" isn't "action-at-a-distance." No energy/information moves. The correlations were baked in at the source. The evolution is local.

  6.  **Determine Who Has the Stronger Case:**
      *   *Technically:* Eliezer is right that MWI violates the *assumptions* of Bell's theorem (Outcome Independence) without requiring superluminal causal influences (Parameter Independence).
      *   *Philosophically/Physically:* Maudlin is right that this comes at the cost of **Separability**. If you value "the physical state of a region depends only on things in that region," MWI fails.
      *   *Verdict:* It's a trade-off. MWI saves "no superluminal signaling/causation" but sacrifices "separability of states in 3D space." Maudlin argues separability is what mattered to Einstein/Bell. Eliezer argues no-signaling is what matters to Relativity.

  7.  **Drafting the Response:**
