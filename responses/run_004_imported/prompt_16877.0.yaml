          *   Maudlin's "bait-and-switch" accusation stems from the fact that Einstein wanted *both*. MWI gives up one to save the other.
      *   **Conclusion:** MWI doesn't "walk through untouched." It pays a price (holism/non-separability). Whether that price counts as "non-locality" is the philosophical battleground.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say MWI violates Bell's theorem. It doesn't. It violates the *premises*.
      *   *Nuance:* Maudlin specifically argues that "Outcome Independence" isn't a free pass. If the outcomes are correlated without a common cause in the past light cone *that fully determines them*, it's spooky. In MWI, the "common cause" is the entangled wavefunction. But the wavefunction is non-separable.
