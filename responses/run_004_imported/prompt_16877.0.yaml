answer: |-
  This is one of the sharpest disagreements in the foundations of physics, and you are right to be suspicious of the "it's just semantics" deflection. While definitions matter, the friction between Eliezer (representing the Deutsch/Wallace MWI camp) and Tim Maudlin (representing the rigorous Bell/Bohm camp) is about a specific **ontological commitment** that MWI must make to function.

  The short answer is: **Eliezer is right that MWI preserves *Dynamical Locality* (no superluminal causal influences), but Maudlin is right that MWI sacrifices *Ontological Separability* (the idea that physical states belong to specific regions of space).**

  Maudlin's "bait-and-switch" accusation stems from the fact that when Einstein and Bell talked about "locality," they implicitly assumed Separability. MWI keeps the equations local but makes the state global. Here is the breakdown of the actual physical dispute.

  ### 1. The Two Definitions of "Local"
  To understand the disagreement, we have to split "locality" into two distinct physical concepts that are often conflated.

  **A. Dynamical Locality (Eliezer's Focus)**
  This asks: *Do the equations of motion allow influences to propagate faster than light?*
  In MWI, the universe is described by a wavefunction evolving via the Schrödinger equation (or QFT equivalent). The Hamiltonian is local. Terms in the equation only couple fields at the same point or adjacent points in spacetime. There is no "spooky action" term that reaches across the universe to collapse a particle.
  *   **Verdict:** MWI is strictly locally dynamical. No signal, energy, or causal influence travels faster than $c$.

  **B. Ontological Separability (Maudlin's Focus)**
  This asks: *Does the physical state of a region of space depend *only* on things in that region?*
  In a classical local theory, if you specify the state of region A and the state of region B, you have specified the state of the whole system (A+B). This is **Separability**.
  Bell's Theorem assumes Separability. It assumes there is a $\lambda$ (a state) in the past light cone that fully determines the probabilities of outcomes at A and B independently.
  *   **Verdict:** MWI is **Non-Separable**. An entangled wavefunction $\psi_{AB}$ cannot be factored into $\psi_A \times \psi_B$. The physical state of region A *cannot* be fully specified without reference to region B, even if they are light-years apart.

  ### 2. The "Bait-and-Switch" Charge
  Maudlin's argument is that Eliezer is claiming victory by switching from Separability to Dynamical Locality.

  When Bell proved his theorem, he showed you cannot have **Local Separable** theories that match quantum predictions.
  *   **Bohmian Mechanics** keeps Separability (particles have definite positions) but sacrifices Dynamical Locality (the guiding wave exerts instant influence).
  *   **Collapse Theories (GRW)** keep Separability (mostly) but sacrifice Dynamical Locality (collapse is instant).
  *   **MWI** keeps Dynamical Locality but sacrifices Separability.

  Maudlin argues that **Separability is the core intuition behind Relativity.** Relativity says spacetime events are locally structured. If the fundamental ontology (the wavefunction) lives in Configuration Space ($3N$ dimensions) rather than 3D Space, then "spacelike separation" in 3D space is no longer the fundamental constraint on physical reality.

  **The Physical Commitment MWI Makes:**
  To walk through Bell's theorem untouched, MWI must posit that **the fundamental physical reality is the wavefunction in Configuration Space, not events in 3D Spacetime.**
  This is the "smuggled" commitment. If you insist that physics must be about "stuff happening in 3D space," MWI is non-local because the "stuff" (the wavefunction amplitude) at coordinate $x_1$ is inextricably linked to the "stuff" at coordinate $x_2$ in a way that defies spatial separation.

  ### 3. The Branch Alignment Problem
  You mentioned the branches needing to "line up." This is where the rubber meets the road.

  In MWI, when Alice measures spin Up, the world branches. When Bob measures spin Down, the world branches. For the correlations to hold (Alice Up always sees Bob Down), the branching structure must be consistent across spacelike separation.
  *   **Eliezer's View:** This is handled by decoherence. The entanglement spreads locally. The correlation is established at the source when the particles interact. The "branches" are just the decomposition of the global wavefunction. No coordination is needed at measurement time.
  *   **Maudlin's View:** This requires the global wavefunction to maintain a specific structure across spacelike regions that encodes the correlation *before* measurement. This structure is **holistic**. It is a single object stretching across the universe.

  Maudlin argues that a theory where the state of the universe is a single, indivisible object in high-dimensional space is **non-local in the sense that matters for spacetime physics.** It implies that the universe is not made of parts that interact locally, but is a single whole that merely *appears* to have parts.

  ### 4. Who Has the Stronger Case?

  **Eliezer has the stronger case on Causality.**
  If your worry is "Can I send a message faster than light?" or "Does measuring here change the physics there?", MWI is clean. There is no causal mechanism in MWI that violates Special Relativity. If "locality" means "no superluminal causation," MWI wins hands down.

  **Maudlin has the stronger case on Ontology.**
  If your worry is "What is the world made of?", Maudlin wins. Bell's theorem was originally motivated by Einstein's desire for a world where distant objects have separate, real existences (Separability). MWI explicitly denies this. The "state" of your lab is not a thing that belongs to your lab; it is a slice of a global wavefunction.
  Maudlin's charge of "bait-and-switch" is substantively correct in this regard: MWI proponents claim to satisfy "Bell Locality," but they do so by rejecting the assumption (Single Outcome/Separability) that gives Bell Locality its physical bite in a 3D world.

  ### The Verdict

  The disagreement is not merely semantic; it is about **Supervenience**.
  *   **Maudlin:** Physical facts about spacetime regions should supervene on local beables in those regions. MWI violates this. Therefore, MWI is non-local in the relativistic sense.
  *   **Eliezer:** Physical facts should supervene on the fundamental dynamical law. The law is local. Therefore, MWI is local.

  **Who is right?**
  If you care about preserving the **spirit of Einstein's Relativity** (that the world is built of local events in spacetime), **Maudlin is right.** MWI requires a holistic ontology that treats the universe as a single, non-separable block. This is a form of non-locality, even if it doesn't allow signaling.

  If you care about preserving **Causal Structure** (no faster-than-light influences), **Eliezer is right.** MWI is the only interpretation that is strictly local-dynamical.

  **The "Real" Answer:**
  MWI does not "walk through Bell's theorem untouched." It pays a price. The price is **Non-Separability**.
  Eliezer frames this price as "dropping the single-outcome assumption," which sounds cheap.
  Maudlin frames this price as "accepting a holistic wavefunction ontology," which sounds expensive.

  They are describing the same physical commitment. Maudlin has the stronger case that this commitment violates the intuition of locality that motivated Bell in the first place. Eliezer has the stronger case that this commitment is less physically damaging than superluminal causation.

  **Summary:** MWI saves *Signal Locality* by sacrificing *State Separability*. Maudlin argues that *State Separability* is what "Locality" meant to Bell. Eliezer argues *Signal Locality* is what matters for physics. Both are technically correct about the math; the dispute is about which physical principle is sacrosanct. Maudlin's critique is stronger if you view physics as describing a world of objects in space; Eliezer's is stronger if you view physics as describing the evolution of information.
