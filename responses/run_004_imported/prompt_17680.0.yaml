answer: |-
  The cockpit of the *Kestrel* smelled of ozone and stale coffee. On the main display, the void wasn't empty. It was occupied by the Preceptor.

  It wasn't a ship, not really. It was a slab of matte-black geometry that hung in the silence, bleeding gravity waves. It didn't chase. It didn't need to. The Preceptor's predictive algorithms were legendary in the Rim. It didn't calculate where you were going; it calculated where you *would decide* to go, and it arrived there before you left.

  Elara's hand hovered over the jump lever. Two coordinates glowed on the nav-console.

  **Sector 4 (The Nebula).** Dense ion storms. Good for hiding, bad for engines.
  **Sector 9 (The Hollow).** Empty space. Fast travel, nowhere to conceal a signature.

  "Come on," she whispered. Her heart was hammering against her ribs, a frantic rhythm that the ship's biomonitors were definitely broadcasting.

  She gripped the lever, muscles tensing to drive it forward toward Sector 4.

  *Stop,* she thought.

  If she committed to Sector 4, that meant her brain had settled on Sector 4. If her brain had settled on Sector 4, the Preceptor's simulation of her psychology had already settled on Sector 4. If the simulation said Sector 4, the Preceptor was currently waiting in the Nebula.

  If she jumped to Sector 4, she died.

  She pulled her hand back. Sweat stung her eyes.

  *Okay. Sector 9 then.*

  She shifted her grip, aiming for the second coordinate.

  *No.*

  The logic snapped shut like a trap. The moment she felt the relief of choosing Sector 9, that feeling became the data point the Preceptor used. To choose Sector 9 was to signal Sector 9. To signal Sector 9 was to find the Preceptor waiting in the Hollow.

  If she jumped to Sector 9, she died.

  Elara slumped in the pilot's couch. The air recycling hummed, indifferent. This was the glitch. The paralysis. It wasn't that she didn't know the odds; it was that the odds were a function of her own certainty.

  "Think," she hissed. "It's already made its move. Causality goes one way."

  That was the argument her old crewmate, Jax, would have made. *The Preceptor is already at one of the gates, Elara. It made its choice based on who you were ten minutes ago. Your choice now doesn't change where it is. It just changes where you are. Pick the one you think it's less likely to be at.*

  But that was a lie. She knew it was a lie. The Preceptor didn't just profile her past self; it ran a live simulation of her decision process. It was linked to her biometrics. Her hesitation *was* the input.

  If she decided to stay, the evidence mounted that Death was here.
  If she decided to flee, the evidence mounted that Death was there.

  There was no stable state. Every deterministic choice was unratifiable. The second she signed off on a destination, the expected utility of that destination plummeted to zero. She was trapped in a mirror maze where looking at the exit moved the wall.

  The proximity alarm chirped. The Preceptor was charging its lance. She had thirty seconds.

  Elara's hand shook over the console. She tried to force herself to pick Sector 4. She visualized the ion storms. She tried to generate genuine conviction. *I am going to Sector 4.*

  As soon as the thought solidified, a cold dread washed over her. *It knows. It's in the Nebula.*

  She tried to pivot. *I am going to Sector 9.*

  Immediate despair. *It's in the Hollow.*

  It was like trying to stand on water. The moment she put weight on a decision, it sank.

  "Randomize," she said aloud. The word felt like a surrender.

  There was a deck of physical cards in the storage compartment beneath her seat. Old Earth poker cards. Analog. No digital footprint.

  If she let a card decide, was she actually choosing? Or was she just outsourcing the suicide?

  If she drew the Red suit, she went to Sector 4. If Black, Sector 9.

  But the Preceptor could predict that she would use the cards. It could predict the shuffle. It could predict the cut.

  *No,* she thought, her fingers fumbling with the box. *It predicts agency. It predicts motive.*

  If she chose Sector 4, she had a reason (hiding). If she chose Sector 9, she had a reason (speed). Reasons were predictable.

  But a card had no reason. A card was entropy.

  If she bound her will to the card, she wasn't making a decision about *where* to go. She was making a single decision to *obey the randomizer*.

  Was that a loophole? Or was it just a fancier way of digging her own grave? If the Preceptor knew she was the kind of person who would trust a coin flip in a crisis, it would calculate the odds of the flip. It would have to guess the card.

  But to guess the card, the Preceptor would have to be in two places at once. It couldn't be in the Nebula *and* the Hollow. It had to commit.

  If she committed to a 50/50 mix, the Preceptor had to guess which 50% she would actualize. It couldn't know. For the first time in the chase, the information link was broken. Not because she was smarter, but because she had ceased to be an agent making a choice and become a vessel for noise.

  It felt like cowardice. It felt like lobotomizing her own survival instinct.

  *Ten seconds.*

  The Preceptor's lance began to glow violet.

  Elara tore the wrapper off the cards. She didn't shuffle. Shuffling took time. She just pulled one from the middle.

  She looked at the face.

  **Seven of Diamonds.**

  Red. Sector 4.

  For a microsecond, her brain screamed. *It knows! You picked Red, so it predicted Red, so it's in the Nebula!*

  That was the old loop. That was the trap.

  She forced her hand to ignore the meaning of the card. The card wasn't a prediction. It was a command. She hadn't chosen the Nebula. She had chosen to obey the card. The Preceptor couldn't simulate the card because the card wasn't in the simulation. The card was outside the system.

  "Ratify this," she whispered to the empty cockpit. "I choose to let chance choose."

  Did that hold up? If she committed to "Let Chance Choose," did the Preceptor just wait at the most statistically probable outcome of chance? No. Because chance had no probability until it collapsed.

  She wasn't fleeing to Sector 4. She was fleeing to *Probability*.

  *Five seconds.*

  Her hand moved. Not with the hesitation of a chooser, but with the mechanical inevitability of a piston. She punched the coordinates for Sector 4.

  The engine whined. The stars stretched.

  For one terrifying eternity, she waited for the impact. She waited for the black slab to decant from the ion storms, lance charged, waiting exactly where she knew it would be because she knew she would be there.

  The jump hit.

  Gravity slammed her into the couch. The stars snapped back into points. The sensors swept the void.

  Ion storms crackled blue and violent on the viewscreen.

  No Preceptor.

  Elara exhaled, a ragged, broken sound. She looked at the Seven of Diamonds on her console.

  She hadn't outsmarted it. She hadn't found a place it couldn't go. She had simply removed herself from the equation. She had made her own mind unreadable by making it irrelevant.

  But as the *Kestrel* drifted into the storm, a cold thought lingered.

  Had she actually escaped? Or had the Preceptor calculated that she would try to randomize, calculated the odds of a Red draw, and decided the Nebula was the better bet, only to arrive three seconds late because a card is faster than a simulation?

  She looked at the card again.

  It didn't matter. For the first time in her life, she had made a choice that didn't feel like a confession. She hadn't decided to live. She had just let the universe decide for her.

  Elara pushed the card into the dark slot of the console and engaged the stealth drives. She wasn't going to think about the next jump until she had to.
