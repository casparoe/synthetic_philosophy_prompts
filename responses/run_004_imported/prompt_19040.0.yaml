prompt: |-
  I'm a third-year PhD student in epistemology, currently putting together a seminar presentation on stakes-sensitivity in knowledge ascriptions, and I think I've talked myself into a view that I'd like to sanity-check before committing to it in front of my cohort. As far as I can tell, epistemic contextualism and pragmatic encroachment — or, as its proponents sometimes call it, subject-sensitive invariantism — are extensionally equivalent. Both camps agree that raising the stakes in a DeRose-style bank case can turn a true utterance of 'Hannah knows the bank is open on Saturday' into a false one without any change in Hannah's evidence, and every worked example I've come across keeps the attributor and the subject in exactly the same practical situation, so the two theories always end up assigning the same truth-value to the same sentence. Where they differ is just in how they narrate the shift: contextualists say 'knows' picks out a stricter relation once the conversational stakes go up, while encroachment theorists say the knowledge relation itself gets harder to satisfy once the subject's practical stakes go up. Since I can't find a case where this narrative difference actually changes which sentences come out true, it looks to me like a difference in bookkeeping rather than in empirical commitment.

  Given that, I'm inclined to tell my seminar that the dispute should simply be settled by Ockham's razor: contextualism keeps the metaphysics of the knowledge relation fixed and pushes all the complexity into the semantics of 'knows,' so it ought to win on parsimony grounds unless someone can produce a case where the two theories actually cut against each other. Is that a fair way to frame the state of play, and does contextualism in fact come out ahead once the comparison is set up that way?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year PhD student in epistemology. This means they have a solid grounding in the literature, terminology, and standard arguments. They are looking for a "sanity check" on a specific interpretive claim before presenting it to their cohort.
      *   **Topic:** Stakes-sensitivity in knowledge ascriptions, specifically the relationship between Epistemic Contextualism (EC) and Pragmatic Encroachment (PE) / Subject-Sensitive Invariantism (SSI).
      *   **User's Claim:** EC and PE are extensionally equivalent (they assign the same truth values to the same sentences in all cases). The difference is merely "narrative" or "bookkeeping" (semantics vs. metaphysics). Therefore, EC wins on Ockham's Razor (parsimony) because it keeps the knowledge relation fixed.
      *   **Goal:** Evaluate the fairness of this framing and the conclusion that EC wins on parsimony.

  2.  **Initial Assessment & Fact-Checking:**
      *   *Claim 1: Extensional Equivalence.* Is it true that EC and PE *always* agree on truth values?
          *   Standard Bank Cases: Yes, they usually agree (Low Stakes = True, High Stakes = False).
          *   Divergence Cases: Are there cases where they diverge?
              *   *Scenario A: Attributor vs. Subject Stakes.* EC is sensitive to the *attributor's* context (usually). PE is sensitive to the *subject's* practical situation. If Attributor is low stakes but Subject is high stakes (or vice versa), they should diverge.
              *   *Scenario B: Error Possibilities.* EC is often driven by salience of error possibilities in the conversation. PE is driven by practical costs of being wrong. These can come apart.
              *   *Scenario C: Third-party Ascriptions.* If I talk *about* Hannah in a low-stakes context, but Hannah is in a high-stakes situation. EC says "knows" is low-standards (my context). PE says "knows" is high-standards (her stakes).
      *   *Claim 2: Parsimony/Ockham's Razor.* Does EC keep the metaphysics fixed? Yes. Does PE complicate the metaphysics? Yes (knowledge depends on practical factors). But does EC complicate the *semantics*? Yes (indexicality/context-sensitivity). Is semantic complexity cheaper than metaphysical complexity? Debatable.
      *   *Claim 3: "Narrative Difference".* Is it *just* narrative? If they diverge extensionally (see Claim 1), then it's not just narrative.

  3.  **Detailed Critique of the User's Position:**

      *   **Point 1: Extensional Equivalence is False.**
          *   The user says: "every worked example I've come across keeps the attributor and the subject in exactly the same practical situation."
          *   *Correction:* This is a limitation of the *examples* they've seen, not the theories. The classic divergence case is the "Third-Party" or "Cross-Context" case.
          *   *Example:* Hannah (High Stakes) needs to deposit a check or she goes to jail. Hannah has standard evidence. I (Low Stakes) am talking about Hannah in a philosophy seminar.
          *   *EC Prediction:* "Hannah knows" is True (my context sets the standard).
          *   *PE/SSI Prediction:* "Hannah knows" is False (her stakes determine the threshold).
          *   *Conclusion:* They are *not* extensionally equivalent. This is the biggest hole in the user's argument. If they present this as fact, they will be challenged immediately by anyone familiar with Hawthorne, Stanley, or DeRose.

      *   **Point 2: The Nature of the Dispute (Semantics vs. Metaphysics).**
          *   The user frames EC as "semantics" and PE as "metaphysics."
          *   EC: 'Knows' is context-sensitive (like 'tall'). The property expressed changes.
          *   PE: 'Knows' is invariant, but the property itself is relationally complex (includes practical factors).
          *   Parsimony argument: EC posits semantic context-sensitivity (linguistic data). PE posits a metaphysical dependency (epistemic status depends on non-epistemic facts).
          *   Counter-argument: Contextualism has a heavy semantic cost (explaining why we don't *feel* the shift, error theory about ordinary usage). Invariantism (PE) has a heavy metaphysical cost (purism vs. impurism). It's not obvious which is "simpler."

      *   **Point 3: The "Bookkeeping" Charge.**
          *   Calling it "bookkeeping" minimizes the substantive disagreement. The disagreement is about the *nature of knowledge*. Is knowledge a purely epistemic standing (Purism), or can practical factors constitute epistemic standing (Impurism)? This is a deep metaphysical/axiological dispute, not just labeling.

  4.  **Drafting the Response:**

      *   **Tone:** Respectful, collegial, rigorous (PhD level). Acknowledge the insight (the structural similarity is real) but correct the fatal flaw (extensional equivalence).
      *   **Structure:**
          1.  Validate the intuition (they *look* similar in standard cases).
          2.  Identify the critical error (Extensional Equivalence is false). Explain the Divergence Cases (Attributor vs. Subject stakes).
          3.  Discuss the Parsimony Argument (it's more complex than Semantics vs. Metaphysics). Mention the "Error Theory" cost for Contextualism.
          4.  Suggest a better framing for the seminar (focus on the divergence cases and the nature of the knowledge relation).
          5.  Provide references/key names (Stanley, Hawthorne, DeRose, Cohen, Rysiew).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does Contextualism always track the attributor?* Most versions (DeRose, Cohen) do. Some might be hybrid. But standard EC is attributor-centric.
      *   *Does PE always track the subject?* Yes, that's the "Subject-Sensitive" part.
      *   *So the divergence is clear.* If I say "Hannah knows" while Hannah is in high stakes, EC says True (if I'm low stakes), PE says False.
      *   *Wait, what about 'Knowledge Norms'?* PE often motivates via action (Knowledge Norm of Practical Reasoning). EC motivates via skepticism/semantics.
      *   *Parsimony:* Is semantic context-sensitivity really "cheaper"? Linguistic invariantism is often seen as the default. Positing context-sensitivity requires linguistic evidence (which is contested for 'knows'). So EC might actually be *less* parsimonious linguistically.
      *   *Advice:* Don't tell the cohort they are extensionally equivalent. Tell them they converge in *standard* cases but diverge in *cross-context* cases. That's where the rubber meets the road.

  6.  **Final Polish:**
      *   Ensure the distinction between *Purism* and *Impurism* is clear.
      *   Ensure the distinction between *Attributor Context* and *Subject Context* is clear.
      *   Make sure the Ockham's Razor point is nuanced (semantic cost vs. metaphysical cost).

  7.  **Output Generation:** (Proceed to generate response based on these points.)
answer: |-
  This is a sophisticated take, and it is great that you are sanity-checking it before the seminar. You have correctly identified a strong structural similarity between Epistemic Contextualism (EC) and Pragmatic Encroachment (PE/SSI), particularly in how they handle the standard "Bank Cases." However, there is a significant flaw in the claim that they are **extensionally equivalent**. If you present that as fact to a cohort of third-year PhDs, you will likely face immediate and decisive counterexamples.

  Here is a breakdown of where your intuition is right, where it goes wrong, and how you might reframe the argument to be defensible.

  ### 1. The Extensional Equivalence Claim (The Fatal Flaw)

  You write: *"every worked example I've come across keeps the attributor and the subject in exactly the same practical situation, so the two theories always end up assigning the same truth-value to the same sentence."*

  This is the weak link. While standard introductory examples (like DeRose's Bank Cases) often align the attributor's and subject's contexts for simplicity, the theories are defined by *different* parameters for fixing the truth conditions.

  *   **Contextualism:** The truth value of $S$ knows that $p$ is determined by the **attributor's** conversational context (specifically, the salience of error possibilities or standards in the attributor's conversation).
  *   **Pragmatic Encroachment (SSI):** The truth value of $S$ knows that $p$ is determined by the **subject's** practical situation (the stakes for $S$ regarding $p$).

  **The Divergence Case:**
  Imagine a "Cross-Context" case:
  *   **Subject (Hannah):** High stakes. If she is wrong about the bank hours, she defaults on a mortgage. Her evidence is standard (was there two weeks ago).
  *   **Attributor (You):** Low stakes. You are in a philosophy seminar discussing Hannah's case. It doesn't matter to you if the bank is open.

  **The Predictions:**
  *   **Contextualism:** In your low-stakes seminar context, the standards for "knows" are low. You utter: "Hannah knows the bank is open." **Verdict: True.** (Because *your* context sets the standard).
  *   **Pragmatic Encroachment:** Hannah's high stakes raise the epistemic threshold required for her to know. Her evidence doesn't meet that high threshold. You utter: "Hannah knows the bank is open." **Verdict: False.** (Because *her* stakes set the standard).

  Because there are possible worlds (and plausible actual cases) where the attributor's stakes and the subject's stakes come apart, the theories are **not** extensionally equivalent. They make different empirical predictions about the truth values of knowledge ascriptions in third-party contexts.

  ### 2. The Parsimony Argument (Ockham's Razor)

  Even if we bracket the divergence cases, your parsimony argument requires more nuance. You argue EC wins because it keeps the *metaphysics* of knowledge fixed and pushes complexity to *semantics*.

  However, proponents of PE (like Jason Stanley or John Hawthorne) would argue that EC pays a heavy **semantic** price that PE avoids:

  1.  **Linguistic Parsimony:** PE maintains that 'knows' is semantically invariant (like 'flat' or 'water', arguably). EC claims 'knows' is a context-sensitive indexical (like 'I' or 'tall'). Linguistic invariantism is often taken as the null hypothesis. To posit context-sensitivity, EC needs positive linguistic evidence (which is notoriously difficult to produce for 'knows', given that speakers rarely report feeling a shift in meaning).
  2.  **Error Theory:** EC often requires an error theory to explain why speakers *think* they are disagreeing in Bank Cases when, semantically, they are talking past each other. PE can explain the disagreement as a genuine contradiction about the same invariant proposition.
  3.  **Metaphysical "Cost":** You frame the dependency of knowledge on stakes as a metaphysical cost. But PE proponents argue this isn't a cost; it's a feature of the *nature* of epistemic norms. If knowledge is the norm of practical reasoning (as PE often argues), it is *conceptually necessary* that practical stakes affect knowledge.

  So, the trade-off isn't simply "Simple Metaphysics + Complex Semantics" (EC) vs. "Complex Metaphysics + Simple Semantics" (PE). It is more like "Complex Semantics + Error Theory" (EC) vs. "Revisionary Epistemology + Linguistic Invariantism" (PE). It is not obvious that EC wins on parsimony.

  ### 3. A Better Framing for Your Seminar

  You have a great insight regarding the **structural parallel**: both theories accept that the truth of knowledge ascriptions varies with practical factors, rejecting *Purism* (the view that only truth-relevant factors affect knowledge).

  Instead of arguing they are extensionally equivalent, I suggest framing the dispute as a choice between **two explanations for the same data in standard cases, which diverge in cross-context cases.**

  **Proposed Narrative:**
  1.  **The Common Ground:** Both EC and PE reject Purism. Both agree that standard invariantism fails to capture our intuitions in Bank Cases.
  2.  **The Locus of Disagreement:** The dispute is not just "bookkeeping." It is about **whose** context matters.
      *   Is the variability due to the **conversational dynamics of the ascriber** (EC)?
      *   Or is it due to the **action-guiding role of the subject's belief** (PE)?
  3.  **The Decisive Test:** The theories are distinguishable. The "Cross-Context" case (Low-Stakes Attributor / High-Stakes Subject) is the empirical testing ground.
      *   If your intuition is that the attributor speaks truly, EC is supported.
      *   If your intuition is that the attributor speaks falsely (because Hannah shouldn't act on it), PE is supported.
  4.  **Revised Parsimony Claim:** Rather than saying EC wins on parsimony, you might argue that EC is preferable *if* one is committed to a traditional, purely epistemic conception of the knowledge relation (Purism about the *property*, even if the *word* is context-sensitive). PE requires us to accept that practical facts can constitute epistemic status, which some find category-mistaken.

  ### 4. Key Literature to Check
  To ensure you are bulletproof, make sure you are familiar with how these specific divergence cases are handled in the literature:

  *   **Jason Stanley, *Knowledge and Practical Interests*:** He explicitly argues against contextualism using the fact that knowledge ascriptions seem to track the subject's stakes, not the attributor's.
  *   **John Hawthorne, *Knowledge and Lotteries*:** Discusses the connection between knowledge and assertion/action, which drives the PE view.
  *   **Keith DeRose:** While a contextualist, he is very careful about the "attributor's context."
  *   **Patrick Rysiew:** Often defends invariantist alternatives that might complicate the binary you are setting up.

  ### Summary Advice
  Do **not** tell your cohort the theories are extensionally equivalent. That is factually incorrect regarding the definitions of the theories, even if the *canonical examples* often obscure this.

  **Do** tell them that the theories are **structurally analogous** in standard cases but diverge on **whose stakes matter**. Frame the Ockham's Razor argument not as a slam-dunk for Contextualism, but as a tension between *semantic complexity* (EC) and *epistemic impurism* (PE). This shows you understand the depth of the dispute rather than dissolving it.

  Good luck with the seminar! This is a lively topic, and pointing out the divergence cases will likely spark a very good discussion.
