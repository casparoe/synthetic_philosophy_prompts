answer: |-
  This is a fantastic question, and you have put your finger on exactly the pressure point that broke naive falsificationism and gave rise to the post-Popperian landscape. As a chemist, you know that when an instrument gives an anomalous reading, you don't immediately throw out the laws of physics; you check for interference, calibration drift, or sample contamination. Le Verrier's move was essentially treating the solar system like an analytical run with an unknown interferent.

  You are absolutely correct: **Logically, the two moves are identical.** In both cases, you have:
  1.  **Theory ($T$):** Newtonian Mechanics + Universal Gravitation.
  2.  **Auxiliary Assumptions ($A$):** The number and mass of known planets.
  3.  **Observation ($O$):** Orbital anomaly.
  4.  **Move:** Modify $A$ to $A'$ (add a planet) to save $T$.

  If Popper's falsificationism were a strict algorithm, Newtonian gravity should have been considered "falsified" by the Uranus anomaly just as much as by the Mercury anomaly. The fact that the scientific community embraced the first and (eventually) rejected the second suggests that "what counts as science" isn't just about logical structure or immediate falsifiability.

  Here is how the philosophy of science unpacks this, why Popper struggles with it, and whether Lakatos actually gives you a way to distinguish them *before* the telescope finds (or fails to find) the object.

  ### 1. Where Popper Breaks Down (The Duhem-Quine Problem)
  Popper wanted a demarcation criterion that was logical and timeless. But he ran into the **Duhem-Quine thesis**: hypotheses cannot be tested in isolation, only in conjunction with auxiliary assumptions. When a prediction fails, logic dictates that *either* the core theory *or* one of the auxiliaries is false. Logic does not tell you which one to discard.

  Popper tried to patch this by banning "ad hoc" hypotheses. He defined an ad hoc hypothesis as one introduced solely to save a theory from falsification, without yielding new testable consequences.
  *   **The Problem:** Both Neptune and Vulcan *did* yield new testable consequences (look at coordinates $X,Y$).
  *   **The Hindsight Trap:** If you define "testable" as "actually verified," then Neptune wasn't ad hoc and Vulcan was. But as you noted, that's hindsight. At the moment of proposal, both were equally testable. Popper doesn't have a robust mechanism to distinguish a *plausible* auxiliary from an *implausible* one without peeking at the outcome.

  ### 2. The Lakatosian Shift: Research Programmes
  Imre Lakatos, a student of Popper, realized you can't evaluate a single hypothesis in a vacuum. You have to evaluate the trajectory of the entire **Scientific Research Programme (SRP)**.

  For Lakatos, an SRP has:
  *   **A Hard Core:** The fundamental laws (Newton's Laws). These are treated as irrefutable by methodological decision.
  *   **A Protective Belt:** The auxiliaries (number of planets, initial conditions, atmospheric drag).
  *   **A Heuristic:** A set of problem-solving techniques for modifying the belt.

  Lakatos distinguishes between **Progressive** and **Degenerating** problem shifts.
  *   **Theoretically Progressive:** The new auxiliary hypothesis predicts *novel* facts (excess empirical content) that were not part of the original problem.
  *   **Empirically Progressive:** Some of those novel facts are corroborated.

  **Applying this to Le Verrier:**
  *   **Neptune:** The shift was theoretically progressive (predicted a location) and empirically progressive (Galle found it). The Newtonian programme was expanding its content.
  *   **Vulcan:** The shift was theoretically progressive (predicted a location), but it failed to become *empirically* progressive.

  **But this still feels like hindsight.** You asked if there is a principled way to tell them apart *before* the fact. Lakatos offers a criterion called **Independent Testability**, which is the closest thing to an answer you'll get.

  ### 3. Independent Testability: The "Before the Fact" Distinction
  Lakatos argued that an auxiliary hypothesis is ad hoc (in a bad way) if it explains the anomaly but cannot be tested *independently* of that anomaly.

  **The Neptune Case:**
  To save Newton, Le Verrier posited a planet. This hypothesis had independent testability because the existence of a planet implies more than just "Uranus wobbles." It implies:
  1.  A gravitational pull on Uranus (the anomaly).
  2.  A visible disk in a specific part of the sky (independent observation).
  3.  Potential perturbations on other bodies (later verified).

  The key is that the *method of verification* (pointing a telescope) is independent of the *method of discovery* (calculating perturbations).

  **The Vulcan Case:**
  Here is where the chemistry analogy might help. Imagine you have a chromatogram with a ghost peak.
  *   **Scenario A (Neptune):** You hypothesize a new contaminant. You predict it elutes at 5 minutes. You run a standard or use a mass spec, and you detect it at 5 minutes.
  *   **Scenario B (Vulcan):** You hypothesize a new contaminant to explain the ghost peak. You predict it elutes at 2 minutes. You look, but you don't see it. So, to save the hypothesis, you add *another* auxiliary: "It's a contaminant that doesn't absorb at the detector wavelength unless the temperature is exactly 400°C during a solar eclipse."

  Le Verrier's Vulcan hypothesis required **stacking auxiliaries** to explain why the planet wasn't immediately obvious.
  1.  **Auxiliary 1:** There is a planet causing the precession.
  2.  **Auxiliary 2:** It is small/dark enough to have escaped detection by all previous surveys.
  3.  **Auxiliary 3:** It is only visible during specific transit conditions.

  While Vulcan was *in principle* testable, the *cost* of testing it (waiting for eclipses, distinguishing it from sunspots) was high, and the hypothesis required increasingly specific constraints to remain viable as searches came up empty.

  **The Principled Difference:**
  At the time of proposal, a Lakatosian would argue that the Neptune hypothesis had **higher independent testability** than Vulcan.
  *   **Neptune:** The prior probability of an unseen outer planet was non-negligible (the solar system was known to extend outward; Uranus itself was recently discovered). The " Protective Belt" adjustment was consistent with the existing heuristic of the programme (planets exist, they perturb each other).
  *   **Vulcan:** The prior probability of an unseen *inner* planet was lower. An object close enough to the Sun to cause that precession should, by the existing laws of optics and reflection (part of the same Newtonian programme), be readily visible. To posit Vulcan was to create tension *within* the protective belt (Gravity says it's there; Optics says we should see it).

  ### 4. The Bayesian Perspective (A Modern Supplement)
  While Lakatos provides the structural answer, modern philosophers of science often lean on Bayesian confirmation theory to clarify the "before the fact" intuition. This might resonate with your analytical background.

  $$ P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)} $$

  Where $H$ is the hypothesis (New Planet) and $E$ is the Evidence (Orbital Wobble).

  *   **$P(E|H)$ (Likelihood):** For both Neptune and Vulcan, this is high. If there is a planet there, it explains the wobble.
  *   **$P(H)$ (The Prior):** This is where they differ.
      *   **Neptune:** What is the prior probability of a planet existing beyond Uranus? Given the spacing of Jupiter, Saturn, and Uranus, the prior was reasonably high.
      *   **Vulcan:** What is the prior probability of a planet inside Mercury? There was no precedent. Furthermore, the "search space" inside Mercury is small, and the visibility constraints are high. The prior probability was significantly lower.

  A Bayesian would say Le Verrier was rational to pursue Neptune first because the posterior probability was higher *even before the telescope looked*. When Vulcan failed to materialize, the posterior probability crashed, not just because of the negative result, but because the hypothesis required increasingly "tuned" parameters (making it small, dark, specific orbit), which penalizes the prior probability (Occam's razor / penalizing model complexity).

  ### 5. So, was Vulcan "Bad Science"?
  This is the uncomfortable truth for a retired scientist: **No, it wasn't bad science.**

  In the 1860s, positing Vulcan was **good Normal Science** (to use Kuhn's term). It was the rational move within the Newtonian paradigm.
  *   If Le Verrier had immediately jumped to "Newton's laws are wrong," *that* would have been considered radical and unjustified given the track record of Newtonian mechanics.
  *   The "sin" of Vulcan wasn't proposing it; it was **clinging to it for too long** as the protective belt became tattered.

  By the early 20th century, astronomers had posited not just one planet, but swarms of asteroids ("Vulcanoids") to explain the precession. They were adding epicycles. At that point, the Research Programme was **degenerating**. It was predicting less and less while requiring more and more assumptions.

  Einstein's General Relativity, conversely, was a **Progressive Problem Shift**.
  1.  It explained the Mercury anomaly (the old problem).
  2.  It predicted the bending of starlight by the Sun (a novel prediction).
  3.  It predicted gravitational redshift (another novel prediction).

  When Eddington confirmed the light bending in 1919, the Newtonian programme was abandoned not because it was "falsified" in 1859, but because a new programme emerged that had higher heuristic power and explained the same data with fewer ad hoc auxiliaries.

  ### Summary for the Analytical Chemist
  To answer your specific question on whether there is a principled way to tell them apart *before* the fact:

  1.  **Naive Falsificationism:** Fails. It cannot distinguish the two cases logically.
  2.  **Lakatos:** Distinguishes them based on **independent testability** and **consistency within the protective belt**. Neptune was consistent with existing optical and dynamical assumptions; Vulcan required tension between dynamical assumptions (gravity) and optical assumptions (visibility).
  3.  **The "Before the Fact" Reality:** Philosophy cannot give you an algorithm. It gives you **heuristics**.
      *   *Heuristic 1:* Does the auxiliary hypothesis require violating other well-established parts of the theory (e.g., optics)?
      *   *Heuristic 2:* Does the hypothesis require stacking further auxiliaries to explain why it hasn't been seen yet?
      *   *Heuristic 3:* Is there a precedent for this type of entity (outer planets vs. inner planets)?

  Le Verrier's Vulcan move was rational science that happened to be wrong. The distinction isn't between "science" and "pseudoscience," but between a **progressive problem shift** (Neptune) and a **degenerating problem shift** (Vulcan). We can often spot the degenerating shift early by noticing when we are spending more effort justifying why we *can't* see the interferent than we are spending analyzing the interferent itself.

  You hit on the exact reason why Popper is no longer the final word: science isn't a logic gate; it's a risk management strategy for theories. Le Verrier took a calculated risk on Neptune that paid off, and a calculated risk on Vulcan that didn't. Both were valid bets at the time.
