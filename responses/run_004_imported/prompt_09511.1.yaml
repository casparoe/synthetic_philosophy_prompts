answer: |-
  The intake form on the clipboard felt different the second time.

  Elias sat in the beige waiting room, pen hovering over the paper. The first time he was here, six months ago, the questions had been about childhood. *Did you lose pencils? Did you climb things you shouldn't?* He had answered based on memories that felt like they belonged to a stranger. Now, the questions were about the present. *Do you feel a physical vibration in your chest when waiting for a text? Do you scroll until your thumb hurts to silence a thought?*

  He checked the box for *Often*. He wasn't sure if he did that before the diagnosis, or if he only started doing it once he knew it counted as a symptom.

  When Dr. Aris called his name, she didn't look at a chart. She looked at him with a kind of weary curiosity. "How's the new regimen?"

  "Good," Elias said, too quickly. He reached into his pocket and touched the textured ring on his finger—a fidget tool he'd bought three days after the diagnosis. "I'm using the Pomodoro method. I've stopped beating myself up about the laundry."

  "And the focus?"

  "It's... selective." Elias hesitated. This was the part he'd seen on his feed. The videos from creators with millions of followers who looked like him, talked like him, described a specific kind of paralysis. *It's not that you can't focus,* they said. *It's that you only focus on what threatens you or delights you.* "I hyperfixed on cleaning the garage for six hours yesterday. But I couldn't answer an email."

  Dr. Aris nodded, typing. "Interesting. We're seeing that a lot. The 'threat-based nervous system' description."

  "Is that... is that in the manual?"

  "Not yet," she said. She turned the screen slightly toward him. The diagnostic criteria on her monitor looked different than the PDF he'd downloaded during his 3:00 AM doomscrolling spirals. The bullet points had shifted. The emphasis on *physical hyperactivity* had shrunk; the section on *internal restlessness* and *sensory gating* had expanded. "Honestly, Elias, the criteria for adult presentation are undergoing a revision. The old metrics were built on observing eight-year-old boys in classrooms. They didn't capture what's happening in the clinic now."

  Elias felt a strange vertigo. "Because there are more of us?"

  "Because you're describing it differently," she corrected gently. "Five years ago, patients came in saying, 'I'm lazy.' Now, they come in saying, 'I have executive dysfunction.' They come in with vocabulary. They tell me about dopamine menus. They tell me about masking. So, we listen. If fifty patients a week tell me their brain feels like a browser with too many tabs, eventually I have to consider that a clinical sign, not just a metaphor."

  Elias looked down at his hands. He was spinning the ring. *Click. Click. Click.*

  When he was twenty, he had tapped his pen in lectures. He thought that was just nervousness. Now, he knew it was *stimming*. Knowing that changed the sensation. It wasn't anxiety anymore; it was regulation. The physical act was the same, but the meaning had inverted, and the inversion changed the feeling. He wasn't a broken neurotypical person; he was a functioning neurodivergent one. The shame had evaporated, replaced by a strange, performative pride. He was curating his symptoms as carefully as his Instagram feed.

  "So," Elias said, his voice quiet. "If I hadn't known the words... if I hadn't seen the videos... would I still feel this way?"

  "Would you still be unable to answer the email?" Dr. Aris asked. "Probably. But you might not have noticed the vibration in your chest. You might have just called it stress."

  She printed a prescription adjustment. "We're updating the screening tools next quarter. We're adding questions about 'rejection sensitivity' and 'time blindness.' The committee agreed the data from the adult cohort was too significant to ignore."

  Elias took the paper. He was part of the data. He was part of the committee, in a way. His confession, his adoption of the label, his performance of the "ADHD lifestyle"—it was all feeding back into the machine that defined him.

  He walked out to his car. A notification buzzed on his phone. A video thumbnail: *10 Signs You Have the Inattentive Type (Number 7 Will Shock You).*

  He knew, logically, that the condition was real. The struggle to start tasks was real. The relief of medication was real. But as he sat in the driver's seat, spinning the ring on his finger, he couldn't tell where the biology ended and the story began. He was changing the definition by living it, and the definition was changing him by guiding how he lived.

  He put the phone in the cupholder. He didn't watch the video. He didn't put the phone away, either. He just sat there, listening to the hum of the engine, wondering if the silence in his head was peace, or just the quiet between loops.
