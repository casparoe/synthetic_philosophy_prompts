      *   *Lower Tier (Bolted-on):* Potts (CI). Hard to flip conventional implicatures without changing conventions.
      *   *Bottom Tier (Weak/Bolted-on):* Hom (Combinatorial Externalism) and Hom & May (Null Extension). Hom's view ties meaning to oppressive structures, making reclamation semantically difficult (requires changing the ideology). Null Extension is arguably the worst because if the content is empty/fictional, reclaiming it as *positive* is semantically mysterious within the theory.

