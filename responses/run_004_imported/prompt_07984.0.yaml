prompt: |-
  I'm in a grad seminar on philosophy of language this term and we just spent two sessions on the semantics/pragmatics of slurs. I got kind of obsessed with one specific sub-problem afterward: reclamation/appropriation, i.e. how a slur that's devastating coming from an outsider can be totally fine (even affirming) when used within the targeted group — "queer" is the obvious case but there's plenty of others. My professor walked us through the standard theories people use to explain the offensiveness of slurs in general, but the reclamation discussion mostly felt bolted on after the fact rather then actually following from each theory's core mechanism, and I want a second opinion before I commit to a term paper angle.

  Here are the six accounts I'm weighing: (1) prohibitionism (Anderson & Lepore's view that slurs are just prohibited words, full stop, with no special semantic or expressive content of their own), (2) Hom's combinatorial externalism (slurs semantically encode a complex derogatory property that's fixed by racist social institutions), (3) Hom & May's null-extension / "pejoratives as fiction" view (the racist property is uninstantiated, so slurs are semantically empty, like names in fiction), (4) the conventional-implicature / multidimensional-semantics view in the Potts tradition (offensiveness is a non-at-issue expressive dimension layered on top of ordinary truth-conditional content), (5) Jeshion's expressivism (slurs directly express contempt for the target without any mediating descriptive content), and (6) Camp's perspectival account (slurs invoke or impose a whole derogatory way of viewing the target group, more like a lens than a proposition).

  Can you rank these six from best to worst at genuinely explaining reclamation — meaning the theory's own internal machinery predicts or naturally accommodates why in-group use can defuse or invert the slur, as opposed to needing some extra stipulation shoehorned in afterward? Give me the answer as a JSON list ordered best to worst, formatted like this:

  ```json
  [
    {"theory": "...", "verdict": "built-in", "reason": "..."},
    {"theory": "...", "verdict": "bolted-on", "reason": "..."}
  ]
  ```

  where "verdict" is either "built-in" or "bolted-on" and "reason" is a sentence or two. Don't be shy about being opinionated on which one is clearly the weakest of the bunch.
