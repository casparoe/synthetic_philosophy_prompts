      *   **Constraint:** Be opinionated, especially about the weakest.

  2.  **Evaluate Each Theory on Reclamation:**

      *   **(1) Prohibitionism (Anderson & Lepore):**
          *   *Core Idea:* Slurs are offensive because they are prohibited words. Their content is neutral (same as neutral counterparts), but their use is banned by social convention.
          *   *Reclamation:* If offensiveness is just about prohibition, reclamation is simply changing the prohibition status within a sub-community. It's essentially a pragmatic rule change.
          *   *Fit:* Pretty good. It explains why context matters (who is speaking). If the rule is " Outsiders can't say it, insiders can," that's just a specific prohibition rule. However, it struggles to explain the *positive/affirming* aspect, not just the "not offensive" aspect. It treats it as a rule exception rather than a semantic shift.
          *   *Verdict:* Built-in (mostly), but maybe a bit thin on the "affirming" part. Let's call it "built-in" because the mechanism (prohibition rules) is context-sensitive by nature.

      *   **(2) Combinatorial Externalism (Hom):**
          *   *Core Idea:* Slurs semantically encode a complex derogatory property fixed by external social institutions (ideologies). The content is truth-conditional.
          *   *Reclamation:* This is hard. If the meaning is fixed by racist institutions, how does the target group change it? Hom argues reclamation changes the semantic content, but this requires a shift in the external ideology. It's not immediate. It often requires stipulating that the group creates a *new* word or changes the ideology.
          *   *Fit:* Weak. The theory ties meaning tightly to oppressive structures. Reclamation requires breaking that tie, which the theory doesn't naturally accommodate without saying the meaning literally changes (which is slow) or that there are two different words.
          *   *Verdict:* Bolted-on.

      *   **(3) Null-Extension / "Pejoratives as Fiction" (Hom & May):**
          *   *Core Idea:* The derogatory property is empty/null (no one actually has it). Slurs are like fiction.
          *   *Reclamation:* If the content is null/empty anyway, what is being reclaimed? If the slur invokes a fictional negative essence, in-group use would still invoke that fictional essence unless the fiction changes. This view struggles significantly with reclamation because it denies the content is real, making the positive affirmation hard to ground semantically.
          *   *Fit:* Very Weak. It explains offensiveness via the invocation of a harmful fiction, but doesn't explain how insiders turn that fiction into a badge of honor without changing the fiction itself (which loops back to Hom's externalism problems).
          *   *Verdict:* Bolted-on (and problematic).

      *   **(4) Conventional Implicature / Multidimensional Semantics (Potts tradition):**
          *   *Core Idea:* Slurs have at-issue content (neutral counterpart) + CI content (expressive/derogatory).
          *   *Reclamation:* You can keep the at-issue content and cancel or modify the CI content in specific contexts. However, CIs are usually conventional and hard to cancel. Explaining how the CI flips from negative to positive requires a mechanism for context-sensitive CIs, which isn't standard Potts.
          *   *Fit:* Moderate. It separates the descriptive from the expressive, allowing the expressive to vary. But standard CI theory says CIs are conventional and stable. Reclamation requires them to be unstable or agent-relative.
          *   *Verdict:* Bolted-on (requires modifying the stability of CIs).

      *   **(5) Expressivism (Jeshion):**
          *   *Core Idea:* Slurs express the speaker's contempt/attitude directly. No descriptive content needed.
          *   *Reclamation:* If I use the word, I express *my* attitude. If an insider uses it, they express *their* attitude (solidarity/pride). The word is a vehicle for attitude.
          *   *Fit:* Strong. The meaning *is* the expression of attitude. Different speakers, different attitudes. It naturally allows the expressive force to depend on the speaker's identity and intent.
          *   *Verdict:* Built-in.

      *   **(6) Perspectival Account (Camp):**
          *   *Core Idea:* Slurs invite the audience to adopt a specific derogatory perspective/worldview.
          *   *Reclamation:* In-group use can invite the audience to adopt a *different* perspective (one of solidarity/reappropriation) using the same lexical item. The word is a tool for perspective-taking.
          *   *Fit:* Very Strong. It treats the slur as a prompt for a cognitive stance. Insiders can use the prompt to invoke a counter-perspective. It explains the shift in "flavor" without needing to change truth conditions or prohibitions.
          *   *Verdict:* Built-in.

