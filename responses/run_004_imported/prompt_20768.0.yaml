  My cousin's little coffee shop just hit its 4 year anniversary and she jokingly asked me to guess how many more years it'll last before closing down. I told her I have zero inside info on her finances or plans, literally nothing to go on except that its been open 4 years, and she said that means I have no basis to guess at all, its basically a coinflip between "closes next month" and "still around in 30 years." But something in me feels like just knowing how long a thing has already lasted should tell you at least a little about how much longer it'll probably go, even with no other info to work with. Am I onto something real here or is my cousin right? And if there is something to it, does the same logic scale up to bigger stuff, like how much longer humanity itself has left, or does that fall apart once you go that big?
