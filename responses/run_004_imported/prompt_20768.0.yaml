answer: |-
  You are definitely onto something real. In fact, your intuition is backed by a specific statistical and philosophical principle, while your cousin's "coin flip" argument relies on a misunderstanding of how probability works for things like businesses.

  You are describing **Lindy's Law** (and a related concept called the **Copernican Principle** or **Gott's Prediction**).

  Here is the breakdown of why you're right, how the math works, and whether it applies to the end of humanity.

  ### 1. Why Your Cousin is Statistically Wrong
  Your cousin is treating the coffee shop's lifespan like a **memoryless process** (like radioactive decay or rolling a die). In a memoryless process, the past does not influence the future. If a radioactive atom hasn't decayed yet, it isn't "closer" to decaying than a fresh atom.

  However, businesses (and most human endeavors) are **not memoryless**. They have a "hazard rate" that changes over time.
  *   **The Startup Hump:** The highest risk of failure for a restaurant is in year one. If they survive that, the risk drops. If they survive year three, the risk drops further.
  *   **Selection Effect:** By lasting 4 years, the shop has already proven it has a viable location, a customer base, and a supply chain. It has passed several "filters" that kill weaker shops.

  Therefore, a 4-year-old shop is statistically much more likely to reach year 5 than a 1-month-old shop is to reach year 1.

  ### 2. The Math: Lindy's Law & Gott's Prediction
  There are two ways to formalize your intuition.

  **Lindy's Law**
  Named after a delicatessen in New York where comedians would gather, this law states: *For non-perishable things (ideas, technologies, institutions), the expected future lifespan is proportional to their current age.*
  *   If a book has been in print for 1 year, expect it to be in print for 1 more.
  *   If a book has been in print for 50 years, expect it to be in print for 50 more.
  *   **Applied to the shop:** Since it has lasted 4 years, Lindy suggests you should expect it to last roughly another 4 years as a baseline median.

  **Gott's Copernican Principle (The Delta-t Argument)**
  In 1993, astrophysicist J. Richard Gott published a paper in *Nature* applying this logic. He argued that unless you have a reason to believe you are observing something at a special time (like the very beginning or very end), you should assume you are observing it at a random point in its timeline.
  *   With 95% confidence, the total lifespan of a phenomenon is between $\frac{1}{39}$ and $39$ times its current age.
  *   **Applied to the shop:** It is 4 years old.
      *   **Lower bound:** It could close in $\frac{4}{39}$ of a year (about 5 weeks).
      *   **Upper bound:** It could last $4 \times 39$ more years (156 years).
  *   **The Verdict:** This creates a massive range, but it **rules out the "coin flip."** It makes it highly improbable that it closes *next month*, and highly improbable that it lasts *300 years*. It centers the probability around the current age.

  ### 3. Does This Scale to Humanity?
  This is where it gets fascinating. J. Richard Gott actually used this exact logic to predict the future of the human race.

  *   **Current Age:** *Homo sapiens* have existed for roughly 200,000 years.
  *   **The Prediction:** If we assume we are random observers in the timeline of humanity (not living at the very beginning or the very end), then with 95% confidence, humanity will last between:
      *   **Minimum:** $200,000 / 39 \approx 5,100$ more years.
      *   **Maximum:** $200,000 \times 39 \approx 7.8$ million more years.

  **Does it hold up?**
  It works as a **statistical prior**, but it has limitations when scaled up:

  1.  **Changing Hazard Rates:** The Lindy effect assumes the risk of death stays constant or decreases. However, humanity has recently developed technologies (nuclear weapons, engineered pandemics, AGI) that *increase* the risk of extinction. This violates the assumption that the future looks like the past.
  2.  **The "Special Time" Argument:** We might not be random observers. If we are living in the "bottleneck" era where technology outpaces wisdom, we might actually be near the end, not the middle.
  3.  **Perishable vs. Non-Perishable:** Lindy's Law applies best to non-biological things. Humans are biological; we have a natural expiration date. However, "Human Civilization" is an institution, so the logic applies better to the *civilization* than the *species*.

  ### 4. The Verdict
  **You win the argument.**

  Your cousin claimed there is "no basis to guess." You correctly identified that **survival itself is data.**

  *   **Cousin's View:** Ignores the data of the past 4 years.
  *   **Your View:** Uses the past 4 years as a baseline for future resilience.

  **The Caveat:**
  This logic gives you a **probability distribution**, not a guarantee.
  *   If your cousin's shop has been losing money for 4 years and is only open because she has rich parents, the "Lindy" effect is weakened. The shop hasn't survived due to fitness; it has survived due to life support.
  *   But absent that "inside info," the statistical prior is that a 4-year-old business is far more stable than a 4-month-old one.

  So, tell her: "Statistically, you've passed the danger zone. I'm guessing you'll make it to at least year 8."
