      *   *Milgrom-Stokey:* Rational agents don't trade on info alone.
      *   *Reality:* Massive trading volume.
      *   *Keynes:* Markets *are* dominated by speculation (guessing what others think), not enterprise (calculating yield).
      *   *Synthesis:* Keynes would look at the No-Trade theorem and say, "Exactly! If agents were truly rational in the Bayesian sense regarding uncertain future yields, they *wouldn't* trade. The fact that they *do* trade proves they aren't acting on calculated probability but on convention, herd behavior, or animal spirits."
      *   *Vindication:* The theorem highlights the absurdity of applying Bayesian rationality to fundamental uncertainty. It proves the *model* of the agent is wrong for the real world, not that the real world is irrational in a silly way.

