      *   **Keynes (*Treatise on Probability*):** Probability is a logical relation between evidence and hypothesis ($P(h|e)$). It's not just subjective degree of belief (Ramsey). Crucially, he introduces the "weight of evidence" ($w$). High probability with low weight is different from high probability with high weight.
      *   **Keynes (*General Theory* Ch. 12):** Investment is driven by long-term expectation, but this is swamped by short-term speculation (beauty contest). "Animal spirits" drive action when calculation is impossible due to uncertainty (not just risk).

  3.  **Address Point 1: The Common Prior Assumption (CPA):**
      *   *Aumann's view:* Priors are common because we all come from the same universe/Humean induction.
      *   *Keynes's view:* In the *Treatise*, he argues against subjectivism (Ramsey). However, he acknowledges that different people have access to different evidence ($e$). If $P(h|e)$ is objective, but $e$ differs, probabilities differ.
      *   *The Clash:* Aumann says "if we know each other's posteriors, we converge." Keynes says "the weight of evidence matters." Even if we agree on the probability number, if my weight is low and yours is high, our *confidence* differs.
      *   *Verdict:* Keynes would likely reject the CPA *as applied to macroeconomic fundamentals*. He distinguishes between risk (calculable) and uncertainty (incalculable). For uncertain events (future yield of an investment), there is no objective probability to have a "common prior" about.

