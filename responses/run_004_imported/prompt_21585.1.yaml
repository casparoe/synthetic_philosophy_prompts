prompt: |-
  In my decision theory seminar, we've just moved from causal and evidential decision theory to Wei Dai's updateless decision theory (UDT) as a way of handling puzzles like counterfactual mugging, where an agent who conditions on which branch of the problem it actually ended up in seems to talk itself out of the choice that would have served it best beforehand. My understanding is that UDT resolves this by having the agent simply decline to update its probabilities on new evidence, since conditionalizing on what it observes is exactly what gets ordinary Bayesian agents into trouble in these cases. For this week's problem set we have to apply UDT to a new variant of counterfactual mugging, and I want to make sure I'm setting it up correctly: when the agent learns which way the coin landed, should its credence stay fixed at the prior probability rather than being updated on that observation, since that's presumably what makes the theory "updateless"?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Decision theory seminar, moved from CDT/EDT to Updateless Decision Theory (UDT).
      *   **Topic:** Counterfactual Mugging.
      *   **User's Understanding:** UDT resolves Counterfactual Mugging by having the agent *decline to update its probabilities on new evidence*. The user thinks conditionalizing on observations is the problem.
      *   **Specific Question:** When applying UDT to a new variant, should the agent's credence stay fixed at the prior probability rather than updating on the observation (e.g., coin landing), because that's what makes it "updateless"?
      *   **Goal:** Verify/correct the user's understanding to help them solve the problem set correctly.

  2.  **Evaluate the User's Understanding of UDT:**
      *   *Core Claim:* "UDT resolves this by having the agent simply decline to update its probabilities on new evidence."
      *   *Assessment:* This is a common misconception, but it's technically inaccurate in a subtle but crucial way. UDT isn't about *ignoring* evidence or refusing to process information. It's about *where* the update happens in the decision-making process.
      *   *Nuance:* UDT agents *do* condition on their observations when selecting an action *policy*, but they optimize the policy from a "pre-commitment" perspective (behind a veil of ignorance) rather than maximizing expected utility conditional on the current state *after* the observation.
      *   *Key Distinction:* It's not that $P(Heads)$ stays 0.5 when you see Tails. It's that the *decision rule* is chosen based on the expected utility over all possible observations weighted by their prior probabilities, not the expected utility of the specific action given the specific observation.
      *   *Terminology:* "Updateless" refers to the *decision procedure*, not necessarily the *belief state* in a naive sense. The agent computes $ArgMax_{policy} E_{prior}[Utility(policy, world)]$, not $ArgMax_{action} E_{posterior}[Utility(action, world)]$.

  3.  **Address the Specific Question (Credence vs. Policy):**
      *   *Question:* "Should its credence stay fixed at the prior probability rather than being updated on that observation?"
      *   *Answer:* No, not exactly. The agent *knows* what it observed. It doesn't pretend it didn't see the coin. However, it doesn't let that observation *screen off* the counterfactual branches when evaluating the optimality of its policy.
      *   *Correction:* The agent conditions on the observation to know *which part of the policy to execute*, but the *evaluation of the policy* was done using the prior.
      *   *Analogy:* Think of it as writing a computer program before the coin flip. The program can have `if (coin == heads) then ... else ...`. The program knows the coin result when it runs, but the *logic* of the program was chosen to maximize expected value before the coin was flipped.

  4.  **Formulate the Explanation:**
      *   **Validate:** Acknowledge that the intuition is close (UDT avoids the trap of EDT/CDT in mugging), but the mechanism description needs refinement.
      *   **Clarify "Updateless":** It means optimizing a *policy* (mapping from observations to actions) from the perspective of the prior, not optimizing an *action* from the perspective of the posterior.
      *   **The Counterfactual Mugging Case:**
          *   Scenario: Omega flips coin. Heads: asks for $100. Tails: gives $10,000 *if* you would have given $100 on Heads.
          *   EDT/CDT (Updateful): See Tails. Know Omega won't ask for money. Utility of giving $0 is better than -$100. Refuse. (Result: Miss out on $10k in the counterfactual).
          *   UDT: Choose policy $P$. $P(Heads) = Give$, $P(Tails) = N/A$ (or whatever).
          *   Calculation: $EV(Policy) = 0.5 \times U(Give | Heads) + 0.5 \times U(Get 10k | Tails \text{ because } Policy(Heads)=Give)$.
          *   Execution: When the agent sees Tails, it doesn't recalculate. It executes the pre-committed policy.
      *   **Direct Answer to "Credence":** The agent's *beliefs* about the world state update (it knows it's in the Tails branch), but its *decision criterion* does not condition on being in that branch to the exclusion of the other. It acts as if it is still "behind the veil" regarding the *evaluation* of correctness.
      *   **Warning:** If the student codes/implements this as "ignore the observation," they might fail variants where the observation matters for *which* action is physically possible or relevant. The policy is a function *of* the observation.

  5.  **Refine the Technical Detail (Logical Induction/Functional Decision Theory):**
      *   UDT is often associated with MIRI (Yudkowsky, Soares) and Wei Dai.
      *   Later iterations are often called Functional Decision Theory (FDT).
      *   Key concept: Subjunctive dependence / Logical correlation.
      *   Make sure not to confuse "updating probabilities" with "updating the decision rule."
      *   *Crucial Point:* The agent doesn't say "I assign 50% probability to Heads even though I see Tails." That would be delusional. The agent says "I see Tails. My policy says if Tails, do X. This policy was chosen because it maximizes utility assuming 50% Heads."

  6.  **Drafting the Response:**
      *   *Opening:* Friendly, academic tone. Validate the intuition but correct the technical mechanism.
      *   *Core Correction:* Distinguish between *belief updating* and *decision updating*. UDT agents update beliefs (they know what they see) but optimize policies globally.
      *   *The "Why":* Explain that conditioning on the observation cuts the logical link to the counterfactual branch where the payoff happens.
      *   *Application to Problem Set:* Advise them to define a policy function $\pi(observation) \rightarrow action$ and maximize expected utility over the prior distribution of observations.
      *   *Caveat:* Mention that "Updateless" is slightly misleading nomenclature if taken literally as "never update beliefs."

  7.  **Review against Constraints:**
      *   Keep it helpful for a seminar student.
      *   Ensure accuracy regarding UDT/FDT.
      *   Don't solve the problem set for them, but ensure the setup is correct.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Wait, does UDT update probabilities?* In the strict Wei Dai formulation, the agent considers all logical possibilities. It doesn't necessarily "update" in the Bayesian sense of discarding worlds. It weights worlds by their prior probability in the utility calculation. So, in the *calculation*, the weights stay at the prior. But the agent *knows* its input.
      *   *Better phrasing:* The agent maximizes $E_{prior}[U(\text{output of policy})]$. It does not maximize $E_{posterior}[U(\text{action})]$.
      *   *Addressing the specific question:* "Should credence stay fixed?" -> "No, don't pretend you didn't see the coin. But do use the prior weights for the decision calculation."

  9.  **Final Output Structure:**
      *   Acknowledge the insight (UDT avoids the trap).
      *   Correct the mechanism (Policy optimization vs. Belief denial).
      *   Explain the Counterfactual Mugging application.
      *   Provide the correct formal setup for the problem set.
      *   Mention FDT as a related modern framing.

