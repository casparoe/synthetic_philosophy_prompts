answer: |-
  You have the right intuition about *why* UDT is introduced (to solve problems like Counterfactual Mugging where standard updating leads to suboptimal outcomes), but your understanding of the *mechanism* is slightly off in a way that could lead you to set up the problem incorrectly.

  If you implement UDT as "refuse to update your credences on new evidence," you risk modeling the agent as delusional (believing the coin is 50/50 even when looking at it). That is not how UDT works.

  Here is the precise distinction you need for your problem set:

  ### 1. Belief Updating vs. Decision Updating
  UDT agents **do** process observations. They know which branch they are in. If the coin lands Tails, the UDT agent knows the coin landed Tails. It does not maintain a credence of 0.5 in Heads *in the sense of believing Heads is still physically possible*.

  The "updateless" part refers to the **objective function**, not the belief state.
  *   **Standard (Updateful) Agents:** Maximize expected utility conditional on the current observation (the posterior).
      $$ \text{Action} = \arg\max_a E[U(a) \mid \text{Observation}] $$
  *   **UDT Agents:** Maximize expected utility of a **policy** (a mapping from observations to actions) calculated from the **prior**.
      $$ \text{Policy} = \arg\max_\pi E[U(\pi(\text{Observation}))]_{\text{Prior}} $$

  ### 2. Applying this to Counterfactual Mugging
  In the standard Counterfactual Mugging:
  *   **Coin:** 50% Heads, 50% Tails.
  *   **Heads:** Omega asks for $100.
  *   **Tails:** Omega gives you $10,000 *if and only if* Omega predicts you would have given $100 on Heads.

  **The Updateful Mistake:**
  When you see Tails, you conditionalize on Tails. You reason: "I am in the Tails branch. Omega is not asking for money. If I pay $0, I keep $10,000. If I pay $100, I keep $9,900." You refuse to pay. But because you refused, your counterfactual self on Heads would also refuse, meaning you lose the $10,000 in the actual world (Tails).

  **The UDT Solution:**
  You do not ask, "What should I do *now* that I see Tails?"
  You ask, "What **policy** should I have committed to before the coin flip?"
  *   **Policy A (Pay if Heads):** $EV = 0.5 \times (-\$100) + 0.5 \times (\$10,000) = \$4,950$.
  *   **Policy B (Refuse if Heads):** $EV = 0.5 \times (\$0) + 0.5 \times (\$0) = \$0$.

  You choose Policy A. When you actually observe Tails, you execute the instruction associated with Tails in that policy (which might be "do nothing," but the critical part is that the policy *also* specified "Pay if Heads").

  ### 3. How to Set Up Your Problem Set
  For your variant, do not set the agent's credence to the prior *after* observing the outcome. Instead:

  1.  **Define the Policy:** Define the agent's decision as a function $\pi(O)$ where $O$ is the set of possible observations.
  2.  **Calculate Expected Utility:** Compute the expected utility of that function using the **prior probabilities** of the observations.
  3.  **Execute:** Once the optimal $\pi$ is identified, the agent simply outputs $\pi(O_{actual})$.

  **Crucial Warning:**
  If your variant involves the observation giving information about the *state of the world* that is independent of the predictor (e.g., "The coin landed Tails, and there is a bomb in the room"), the agent must still condition on that observation to avoid the bomb. UDT only refuses to update in a way that severs **logical/subjunctive links** to counterfactual branches where payoffs are determined by your decision algorithm.

  ### Summary
  Don't tell your professor the agent "ignores the evidence." Tell them the agent **optimizes a input-output policy based on prior expected utility, rather than optimizing a specific action based on posterior expected utility.**

  This distinction preserves the agent's rationality (it knows what it sees) while securing the benefits of pre-commitment (it wins the mugging). This is often formalized in later literature (like MIRI's Functional Decision Theory) as reasoning about the *output of your decision algorithm* rather than your *physical action*.

  Good luck with the problem set! This is a subtle but fascinating shift in perspective.
