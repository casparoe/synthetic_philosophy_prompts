      *   **Ending:** Unresolved. Bellarmine issues the warning, but no abjuration. The famous certificate is implied as the outcome.

  2.  **Historical Fact-Checking & Constraints:**
      *   **Date:** Late February 1616 (The Congregation of Qualifiers met on Feb 24, 1616. Bellarmine's summons likely happened just before or around this time).
      *   **Bellarmine's Position:** He wasn't an obscurantist. He was a Jesuit theologian, skilled in controversy. He wrote to Foscarini (1615) outlining his view: If there were a true demonstration, we'd have to reinterpret Scripture. But he doubted such a demonstration existed. He accepted the *ex suppositione* use of Copernicus (as a calculating tool).
      *   **Galileo's Position:** He believed he had strong proofs (tides, Venus phases). He was confident, perhaps overly so. He hadn't published *Dialogue Concerning the Two Chief World Systems* yet (1632). He was working on the tides argument (which turned out to be flawed).
      *   **The "Warning":** It was a *monitio* (admonition), not a formal Inquisition trial at this stage. Galileo was not forced to abjure *yet*.
      *   **The Certificate:** Bellarmine gave Galileo a letter on May 26, 1616, stating he hadn't abjured. This scene precedes that.

  3.  **Character Voices:**
      *   **Bellarmine:** Courteous, precise, theological, patient but firm. He respects Galileo but worries about the theological implications and the lack of physical proof. He speaks like a scholar-priest.
      *   **Galileo:** Passionate, empirical, slightly impatient with abstraction, confident in his senses (telescope), but vulnerable on the physics (why doesn't the earth fly apart?).

  4.  **Drafting - Section by Section:**

      *   **Setting the Scene:** Rome, Bellarmine's residence. Private, quiet. Contrast the noise of the city/controversy with the quiet room.
      *   **Opening:** Politeness. Acknowledge the tension without exploding it immediately. Bellarmine sets the stage (the Pope's concern).
      *   **The Core Conflict (Scripture vs. Nature):** Galileo brings up Augustine immediately. This is his shield. Bellarmine accepts the shield but questions the sword (is the truth actually demonstrated?).
      *   **The Evidence (The Leverage):**
          *   Galileo offers: Phases of Venus (destroys Ptolemy), Sunspots (heavens change), Tides (proof of motion).
          *   Bellarmine counters: Phases fit Tycho Brahe's system too. Sunspots show corruption but not motion. Tides are speculative. Where is the *necessary* proof?
          *   Bellarmine's *Ex Suppositione*: You can use it to calculate. That's enough for now.
      *   **The Climax/Standoff:** Galileo insists the earth *moves*. Bellarmine insists the burden of proof is on the mover of the earth, not the mover of the interpretation of Scripture.
      *   **Resolution:** Bellarmine issues the instruction (do not hold/teach as fact). Galileo accepts the instruction but not the premise. The certificate is hinted at.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure Bellarmine doesn't say "The Bible says the sun moves." He should say "The Bible speaks in the language of the common people."
      *   *Correction:* Make sure Galileo doesn't claim he has proof of parallax (he didn't). He relies on the Tides argument mostly for physical proof, which was his weak point.
      *   *Nuance:* Bellarmine should acknowledge Galileo's genius. He isn't jealous; he's cautious.
      *   *Nuance:* Galileo should acknowledge the theological risk. He isn't an atheist; he wants to save Scripture from error.

  6.  **Writing the Dialogue (Iterative Process):**
      *   *Start:* Bellarmine offering wine? No, too casual. Water or just sitting. Let's have them standing or sitting formally.
      *   *Augustine:* Galileo cites *The Literal Meaning of Genesis*. Bellarmine knows it better than Galileo. He agrees in principle.
