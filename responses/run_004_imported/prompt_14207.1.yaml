prompt: |-
  I'm a PhD student in Islamic intellectual history, and I organize the Q&A portion of my department's graduate colloquium. Next month's guest is a historian of Islamic philosophy who defends the kind of occasionalism about causation that al-Ghazālī develops in the Seventeenth Discussion of the Tahāfut al-Falāsifa: fire does not burn cotton, God does, and the "connection" we observe between the two is God's habitual custom ('āda), not a necessity residing in the things themselves. Draft eight to ten interview questions that go beyond having her restate the view. Include at least one question on what secures the reliability of everyday expectation and inductive or experimental practice if no natural necessity underlies it, one on whether explaining that reliability through "custom" quietly reintroduces the very law-like structure occasionalism was supposed to eliminate, and one on how her position actually differs from Malebranche's occasionalism, given how differently the two are motivated. For each, add a follow-up keyed to the answer she's most likely to give -- for the Malebranche question in particular, the follow-up should press her with the objection Ibn Rushd raises in the Tahāfut al-Tahāfut, that denying things their own causal powers makes demonstrative knowledge of the world impossible.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User:** PhD student in Islamic intellectual history, organizing a grad colloquium Q&A.
      *   **Guest:** Historian of Islamic philosophy defending Ghazalian occasionalism (specifically from *Tahāfut al-Falāsifa*, Discussion 17).
      *   **Core View:** Fire doesn't burn cotton; God does. Connection is habitual custom (*'āda*), not natural necessity.
      *   **Task:** Draft 8-10 interview questions.
      *   **Constraints:**
          *   Go beyond restating the view.
          *   Include specific questions on:
              1.  Reliability of expectation/induction without natural necessity.
              2.  Whether "custom" reintroduces law-like structure (circularity/reintroduction objection).
              3.  Difference from Malebranche (motivations) + Follow-up on Ibn Rushd's objection (demonstrative knowledge).
          *   Include follow-up questions for *each* main question, keyed to likely answers.
          *   Tone: Academic, rigorous, suitable for a graduate colloquium in Islamic intellectual history.

  2.  **Deconstruct the Core Philosophical Issues:**
      *   *Ghazālī's Occasionalism:* Denial of necessary connection (*darūra*). Affirmation of habitual succession (*'āda*). God is the sole agent.
      *   *Epistemology:* How do we know things will happen? Prophecy vs. normalcy. Miracles as breaks in custom.
      *   *Metaphysics:* Nature of causation. Powers (*quwa*) in objects vs. direct divine volition.
      *   *Comparative:* Malebranche (Christian Occasionalist). Motivation: Divine glory/omnipotence vs. Ghazālī's motivation (protecting divine omnipotence + possibility of miracles).
      *   *Critique:* Ibn Rushd (Averroes). Argument: Denying causal powers denies science/demonstration (*burhān*).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1 (Reliability/Induction):* Need to ask how we trust fire will burn tomorrow.
          *   *Draft:* How do we trust induction if there's no necessity?
          *   *Refinement:* Make it more technical. Focus on the epistemic status of *'āda*.
          *   *Follow-up:* If she says "God's promise," ask about the epistemic access to that promise.

      *   *Question 2 (Custom vs. Law):* Does *'āda* just mean "law" by another name?
          *   *Draft:* Isn't custom just a law?
          *   *Refinement:* Focus on the ontological status. If God *always* acts the same way, is the distinction between necessity and habit meaningful?
          *   *Follow-up:* If she says "It's contingent," ask about the explanatory power of calling it contingent if it never changes.

      *   *Question 3 (Malebranche + Ibn Rushd):* This is a specific requirement.
          *   *Draft:* How are you different from Malebranche? Follow-up: Ibn Rushd says no science.
          *   *Refinement:* Distinguish motivations (theological vs. metaphysical). Follow-up needs to hit the *Tahāfut al-Tahāfut* objection hard regarding *burhān*.
          *   *Follow-up:* If she distinguishes motivations, press on the *consequence* for scientific realism.

      *   *Question 4 (Miracles):* Ghazālī wants miracles to be possible.
          *   *Draft:* How do miracles fit in?
          *   *Refinement:* Focus on the definition of miracle as a break in custom. Does this make miracles arbitrary?
          *   *Follow-up:* If she says "No, they have purpose," ask how we distinguish miracle from anomaly without causal criteria.

      *   *Question 5 (Human Agency):* If God does everything, what do humans do?
          *   *Draft:* Do humans have free will?
          *   *Refinement:* Focus on *kasb* (acquisition) or the specific Ghazalian view on human acts. How does occasionalism impact moral responsibility?
          *   *Follow-up:* If she appeals to *kasb*, ask if *kasb* is just a metaphor for occasionalism.

      *   *Question 6 (Secondary Causes):* Ghazālī accepts secondary causes in a sense (in *Ihyā* maybe? Or just as terminology).
          *   *Draft:* Do secondary causes exist?
          *   *Refinement:* Ghazālī allows "causes" as linguistic conventions. Is this instrumentalism?
          *   *Follow-up:* If she says "Instrumentalism," ask if this undermines the truth-claims of scripture which posit causes.

      *   *Question 7 (Divine Wisdom):* Why does God follow custom?
          *   *Draft:* Why does God keep the habit?
          *   *Refinement:* Is *'āda* rooted in divine wisdom (*ḥikma*) or pure will (*irāda*)? If wisdom, does that imply a structure God adheres to?
          *   *Follow-up:* If "Pure Will," ask about the intelligibility of the world.

      *   *Question 8 (Modern Science):* Relevance to modern science.
          *   *Draft:* What about physics?
          *   *Refinement:* Can a Ghazalian occasionalist be a practicing scientist? Humean comparison.
          *   *Follow-up:* If "Yes," ask about the ontological commitment of the scientist vs. the metaphysician.

      *   *Question 9 (Textual Interpretation):* *Tahāfut* vs. other works.
          *   *Draft:* Is this consistent with your other books?
          *   *Refinement:* Does the *Tahāfut* represent his final view, or is it dialectical?
          *   *Follow-up:* If "Dialectical," ask why defend it so vigorously in the *Maqāṣid*.

      *   *Question 10 (Metaphysical Cost):* What do we lose?
          *   *Draft:* What is the cost of this view?
          *   *Refinement:* What explanatory power is sacrificed?
          *   *Follow-up:* If "None," challenge the intuition of causal powers.

  4.  **Review and Refine:**
      *   Check constraints: 8-10 questions? Yes. Specific topics covered? Yes (Induction, Custom/Law, Malebranche/Rushd). Follow-ups included? Yes. Tone appropriate? Yes.
      *   *Self-Correction on Q3 (Malebranche):* Ensure the follow-up specifically cites Ibn Rushd's argument about demonstration (*burhān*).
      *   *Self-Correction on Q1 (Induction):* Ensure it touches on the *epistemic* security, not just the metaphysical.
      *   *Self-Correction on Q2 (Custom):* Ensure it challenges the *utility* of the distinction.

  5.  **Final Polish:** Check the phrasing to sound like a knowledgeable PhD student in Islamic intellectual history (using terms like *'āda*, *darūra*, *burhān*, *Tahāfut*, etc.). Ensure the follow-ups are logical responses to the *likely* defensive moves a scholar would make.

