          *   *Claim:* Full AC brings "monsters" (Banach-Tarski, non-constructible well-ordering of $\mathbb{R}$).
          *   *Claim:* Solovay's model shows consistency of DC + "All sets of reals are Lebesgue measurable."
          *   *Conclusion:* Suspect full AC, restrict to DC.

      *   **Oskar's Reply (The Case for Full AC):**
