prompt: |-
  Had a whole argument with my friend Mara last night, started from a work story she told me. A coworker of hers saw a slack message flagging that a server certificate was about to expire, reacted with a 👍, then got pulled into other stuff and never actually renewed it. Three weeks later it expired and took down checkout for six hours. Mara says the coworker not renewing it obviously caused the outage, same as if he'd unplugged the server himself. I said that's too quick -- a dozen other people saw the same message and also didn't renew it, whoever set the expiry warning for 3 weeks out instead of 3 days didn't do their job either, and technically the whole on-call rotation that week 'could have' caught it too. So either they're all equally causes, which seems nuts, or there's some principled reason the coworker is basically THE cause and the rest aren't -- and I don't know what that reason is. Mara thinks the 👍 counts as taking ownership; I think that's a fact about blame, not causation. We went in circles for an hour and its still bugging me.

  Turns out this is an actual known problem in the causation literature (something like a 'selection problem' for omissions), and there's a few rival strategies for handling it: counterfactual-dependence accounts, physical-process accounts, contrastive accounts, and norm-based accounts. Can you rank these four by how well they let you say the coworker -- and not everyone else who also didn't act -- caused the outage? Give me a JSON block like {"1": "<approach>", "2": "<approach>", "3": "<approach>", "4": "<approach>"}, where 1 is the best fit and 4 the worst, then justify each placement in 1-2 sentences.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Scenario:** A coworker saw a Slack message about an expiring certificate, reacted with 👍, got distracted, didn't renew it. Certificate expired 3 weeks later, causing an outage.
      *   **Debate:** Mara says the coworker caused the outage (like unplugging the server). The user says many others could have acted, warnings were set poorly, on-call could have caught it, so singling out the coworker is arbitrary unless there's a principled reason.
      *   **Task:** Rank four specific causation theories/approaches based on how well they support the claim that *the coworker* (and not everyone else) caused the outage.
      *   **Theories:** Counterfactual-dependence accounts, Physical-process accounts, Contrastive accounts, Norm-based accounts.
      *   **Output Format:** JSON block `{"1": "<approach>", "2": "<approach>", "3": "<approach>", "4": "<approach>"}` followed by 1-2 sentence justifications for each placement.
      *   **Constraint:** 1 is the best fit (most successfully singles out the coworker), 4 is the worst fit.

  2.  **Evaluate the Theories against the Scenario:**

      *   **Goal:** We want the theory that *best* distinguishes the coworker from the background conditions/other potential actors to say "Yes, the coworker caused this."
      *   **Scenario Specifics:** It's an omission (failure to act). Many people could have acted (omission overdetermination/preemption issues). There's a normative element (job responsibilities, the 👍 reaction).

      *   **Theory 1: Norm-based accounts (e.g., Hitchcock, Knobe, Sytsma)**
          *   *Core Idea:* Causation judgments depend on normative expectations (what someone *should* have done). Abnormalities or violations of norms are selected as causes.
          *   *Application:* The coworker had a specific duty (implied by seeing the message and 👍ing it, or just their role). Others didn't have that specific normative expectation triggered in the same way. The warning setting might be a background condition, but the violation of the specific duty to renew is the norm violation.
          *   *Fit:* Very strong. This theory is specifically designed to handle omission cases and "selection problems" by appealing to responsibility/norms to pick out the cause from the background. It explains why the coworker is the cause and the others (who had no specific duty/expectation) are not.
          *   *Rank:* 1 (Best).

      *   **Theory 2: Contrastive accounts (e.g., Schaffer)**
          *   *Core Idea:* Causation is a quaternary relation: C rather than C* caused E rather than E*. We select causes based on the contrast we care about.
          *   *Application:* We ask "Did the coworker's failure to renew (rather than renewing) cause the outage (rather than no outage)?" vs "Did the on-call's failure (rather than checking) cause...?" By choosing the appropriate contrast (focusing on the specific agent who acknowledged the task), we can isolate the coworker.
          *   *Fit:* Strong. It allows us to frame the question such that the coworker is the relevant variable. However, it relies on pragmatic selection of the contrast, which might feel slightly less "objective" than norms in this specific moral/blame-heavy context, but it handles the "why him and not others" by shifting the contrast class.
          *   *Rank:* 2 (Very good, but norms handle omissions slightly more directly in folk intuition).

      *   **Theory 3: Counterfactual-dependence accounts (e.g., Lewis)**
          *   *Core Idea:* C causes E if, had C not occurred, E would not have occurred.
          *   *Application:* Had the coworker renewed it, no outage. So he caused it. *Problem:* Had *anyone else* renewed it, no outage. Had the warning been set to 3 days, no outage. This leads to "causal overdetermination" or too many causes. It struggles to distinguish the coworker from the other potential preventers without additional pragmatic filters. It treats all necessary conditions equally.
          *   *Fit:* Weak for *selection*. It confirms causation but fails to distinguish the coworker from the others who also could have prevented it (the "many causes" problem the user mentioned).
          *   *Rank:* 3 (Struggles with the selection problem).

      *   **Theory 4: Physical-process accounts (e.g., Salmon, Dowe)**
          *   *Core Idea:* Causation involves the transmission of a conserved quantity (energy, momentum) or a physical process connecting cause and effect.
          *   *Application:* This is an omission. There is *no* physical process connecting "not renewing" to "server down." It's a lack of action. Process theories notoriously struggle with omissions (often denying they are causes at all or treating them as very derivative).
          *   *Fit:* Worst. It cannot easily account for causation by omission without significant contortion. It would likely say nothing caused the outage physically except perhaps the passage of time, making it hard to blame the coworker specifically.
          *   *Rank:* 4 (Worst).

  3.  **Drafting the Justifications:**

      *   *Norm-based:* Best because it uses job duties and the 👍 reaction to establish a specific normative expectation, distinguishing the coworker from others who had no such obligation.
      *   *Contrastive:* Good because it allows us to frame the cause relative to the specific expectation of that agent, though it relies on pragmatic context to select the contrast.
      *   *Counterfactual:* Problematic because if anyone else had acted the outage would be prevented too, making everyone equally causal without further criteria.
      *   *Physical-process:* Worst because omissions involve no physical transmission of energy, making it difficult to classify the inaction as a cause at all.

  4.  **Refining the Ranking:**
      *   Is Norm-based definitely better than Contrastive here? The prompt mentions "selection problem for omissions." Norm-based accounts (like Hitchcock's) are explicitly cited in literature regarding how norms resolve the selection problem for omissions. Contrastive accounts help, but Norms are the heavy lifter for "why this omission and not that one."
      *   Is Counterfactual better than Physical? Yes, counterfactuals at least handle omissions (if he had acted, result changes), whereas physical processes struggle to find a "process" in a non-action.
      *   So: Norm > Contrastive > Counterfactual > Physical.

  5.  **Final Review against Constraints:**
      *   JSON block format.
      *   Keys "1", "2", "3", "4".
      *   1-2 sentence justifications.
      *   Rank 1 = Best fit for singling out the coworker.

  6.  **Constructing the Output:** (Self-Correction: Ensure the names match the prompt's list exactly).
      *   Prompt list: counterfactual-dependence accounts, physical-process accounts, contrastive accounts, and norm-based accounts.
      *   My ranking: Norm-based, Contrastive, Counterfactual, Physical-process.

      *   *Justification 1 (Norm-based):* This approach excels at omission cases by selecting causes based on violated expectations, distinguishing the coworker's specific duty and 👍 acknowledgment from the background inaction of others.
      *   *Justification 2 (Contrastive):* This allows singling out the coworker by framing the cause relative to their specific role expectations, though it relies on pragmatic context to choose the right contrast rather than an objective fact.
      *   *Justification 3 (Counterfactual):* While it confirms the coworker's action matters, it fails to distinguish him from others who could have also prevented the outage, leading to the 'too many causes' problem you described.
      *   *Justification 4 (Physical-process):* This is the worst fit because omissions involve no physical transmission of energy or process, making it difficult to classify the inaction as a cause at all.

  7.  **Final Polish:** Check JSON validity.

