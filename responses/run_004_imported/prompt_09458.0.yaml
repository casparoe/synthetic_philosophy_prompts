answer: |-
  This is a precise and necessary distinction to make. Popular discourse frequently conflates the *Kalam* cosmological argument (which is temporal: "Whatever begins to exist has a cause") with Thomistic cosmological arguments (which are primarily ontological: "Whatever is contingent requires a necessary ground").

  If we strictly adhere to what Thomas Aquinas wrote, particularly in *Summa Theologiae* (Part I, Question 46) and his short treatise *De Aeternitate Mundi* (On the Eternity of the World), he would likely view modern cosmological models—whether Borde-Guth-Vilenkin (BGV) or Hartle-Hawking—as belonging to a different category of inquiry than his metaphysical proofs. He would likely see them as irrelevant to the validity of his argument for a Necessary Being, though potentially relevant to theology.

  Here is an analysis of how Aquinas's actual positions bear on the current cosmological landscape.

  ### 1. The Eternity of the World: A Philosophical Open Question
  The most critical piece of evidence for your article is that Aquinas explicitly argued that **reason cannot prove the universe had a beginning.**

  In *Summa Theologiae* I, q. 46, a. 2, Aquinas asks "Whether it is an article of faith that the world began?" He answers that yes, it is an article of faith, *not* a demonstrable truth. He writes:

  > "That the world had a beginning... is an object of faith, but not of demonstration or science... It must be confessed that the world had a beginning... but this is not demonstrable."

  In *De Aeternitate Mundi*, he goes further, arguing against contemporaries who claimed an eternal world was logically contradictory. Aquinas insists there is no logical contradiction in the idea of a world created by God that has existed eternally. For Aquinas, "creation" describes a dependence of being (*esse*), not necessarily a temporal start.

  **Implication for Cosmology:**
  Because Aquinas built his system to function *even if* the universe were eternal, a theorem like **Borde-Guth-Vilenkin**, which suggests a past boundary to spacetime, would not strengthen his metaphysical proof. He would likely view BGV as a fascinating discovery in natural philosophy (physics) that happens to align with Scripture, but he would caution against using it as a premise for God's existence. If future physics overturned BGV and restored an eternal inflation model, Aquinas's argument would remain untouched.

  ### 2. *Per Se* vs. *Per Accidens* Causal Series
  To understand why Aquinas is insulated from cosmological models of the "beginning," one must understand his distinction between two types of causal series. This is often flattened in popular coverage.

  *   **Series *per accidens* (Accidental):** A father begets a son, who begets a grandson. The father can die, and the son can still beget. This series extends backward in time.
  *   **Series *per se* (Essential):** A hand moves a stick, which moves a stone. If the hand stops, the stone stops. All causes must act simultaneously.

  Aquinas's arguments for a First Cause (specifically the Second and Third Ways) focus on the *per se* series. He is arguing for a **hierarchical dependence of being right now**, not a temporal chain of events leading back to a start. He is asking, "What sustains the existence of this contingent thing at this exact moment?" not "What started the chain of events?"

  **Implication for Hartle-Hawking:**
  The **Hartle-Hawking no-boundary proposal** suggests that as we go back in time, time becomes space-like, and there is no singular "first moment." The universe is finite but unbounded. This creates a headache for the *Kalam* argument, which requires a discrete "beginning to exist."

  However, for Aquinas, the lack of a well-defined "first moment" is metaphysically neutral. His argument does not require a $t=0$. It requires that the universe, at *any* time $t$ (even if $t$ is negative infinity), is contingent. If the Hartle-Hawking wave function describes a universe that is ontologically contingent (i.e., it does not contain within itself the reason for its own existence), Aquinas would argue it still requires a Necessary Being to sustain it, regardless of whether it has a temporal boundary.

  ### 3. Contingency vs. Temporal Origin
  The Third Way (Argument from Contingency) rests on the modal status of beings, not their temporal duration. The argument posits that if everything were possible not to exist (contingent), then at some point nothing would have existed.

  Aquinas is often misunderstood here as making a temporal claim ("given infinite time, everything will fail to exist"). However, many Thomistic scholars interpret this modally: "If everything *depends* on something else for existence, and there is no independent source, there is no explanation for why anything exists at all."

  **Extrapolation Flag:** *Aquinas did not know quantum mechanics. The following is an extrapolation based on his metaphysical principles applied to quantum cosmology.*

  If we apply Aquinas's logic to the **quantum vacuum** or the **wave function of the universe**: Aquinas would ask whether these entities are "Necessary" or "Contingent."
  *   If the quantum vacuum is subject to fluctuation, decay, or relies on laws of physics that could have been otherwise, Aquinas would classify it as contingent.
  *   Therefore, even a "no-boundary" quantum universe would require an external ground for its being.

  Aquinas would likely argue that physics describes *how* things change and interact (movement from potentiality to actuality), but metaphysics explains *why* there is actuality at all. A "no-boundary" condition explains the geometry of spacetime, but it does not explain why there is a wave function rather than nothing, or why that wave function has the power to actualize a universe.

  ### 4. What Aquinas Would Say to the Physicists
  If briefed on the current landscape, Aquinas would likely make three points:

  1.  **On BGV:** "You have shown that the universe likely had a temporal beginning. This is consistent with my faith, but it is not necessary for my philosophy. Do not build a proof for God on a physical theory that might be revised."
  2.  **On Hartle-Hawking:** "You say the 'beginning' is ill-defined. I agree that human reason struggles to grasp the origin of time. But this does not remove the need for a cause of *being*. Whether the universe is a sphere without a boundary or a line with a start, it is still a 'thing' that exists. Does it exist by its own nature? If not, it needs a cause."
  3.  **On the Category Error:** "You are debating natural philosophy (the physics of the cosmos). I am discussing metaphysics (the nature of being). You can have an eternal universe with a God, or a beginningless universe with a God. The question is not 'When did it start?' but 'Why is it here?'"

  ### 5. Summary for Your Article
  The distinction you want to pressure-test is real and robust in the texts.
  *   **The *Kalam* Argument** is vulnerable to the Hartle-Hawking proposal because it premises God's existence on a temporal beginning ("began to exist"). If "beginning" is ill-defined, the premise fails.
  *   **Aquinas's Argument** is largely immune to both BGV and Hartle-Hawking because it premises God's existence on ontological contingency.

  **Extrapolation Flag:** *Aquinas never addressed quantum gravity. Asserting that he would "dismiss" these theories as metaphysically neutral is an inference based on his rigid distinction between faith (creation in time) and reason (creation as dependence). It is possible a modern Thomist might argue that a "no-boundary" universe implies a different kind of necessity, but classical Thomism holds that only God is truly Necessary (His essence is His existence).*

  **Conclusion:**
  Aquinas would likely view the debate between BGV and Hartle-Hawking as a debate about the *furniture* of the universe, not the *house* itself. He would argue that cosmology explains the arrangement of matter and time, but it cannot answer the metaphysical question of why there is a cosmos to arrange. He would caution against tying the existence of God to the "Big Bang" specifically, because if the Bang is removed or redefined by better physics, the God of the philosophers should not vanish with it.

  For your article, the headline distinction is this: **The *Kalam* argument needs a Big Bang; Aquinas does not.** Aquinas needs a distinction between "that which could not-exist" and "that which must-exist." Current quantum cosmology complicates the "when," but leaves the "why" entirely open.
