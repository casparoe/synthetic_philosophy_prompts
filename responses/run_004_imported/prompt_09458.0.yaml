      *   *Section 1: Aquinas on the Eternity of the World.* Cite *Summa Theologiae* I, q. 46 and *De Aeternitate Mundi*. Make clear he thought an eternal world was logically compatible with creation. This is the bedrock.
      *   *Section 2: The Nature of Causality.* Explain *per se* vs. *per accidens*. Aquinas cares about the hand moving the stick *now*, not the grandfather who died years ago. This insulates him from cosmological models of the past.
      *   *Section 3: Engaging BGV.* If BGV shows a beginning, Aquinas says "Consistent with faith, but not required for proof." If it fails, his argument survives.
