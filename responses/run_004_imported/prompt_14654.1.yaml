prompt: |-
  Got into a whole argument with my friend Alex last night about Hofstadter's superrationality -- he thinks the symmetry argument is basically just cooperation dressed up as logic, and I couldn't fully talk him out of it even though I think theres more going on. Anyway, I host a little decision theory podcast and next week's guest actually defends superrationality as the rational move in a one-shot prisoner's dilemma against a psychological twin (and one-boxes on Newcomb for basically the same reason). Can you draft 8-9 interview questions that go past just having her restate the argument? I want at least one on the fact that mutual defection is ALSO a symmetric outcome, so symmetry alone can't be what's picking out cooperation, one on whether the view just smuggles in 'agents will coordinate on the better equilibrium' as an extra premise thats doing all the work, and one connecting her view to functional decision theory's 'subjunctive dependence' move. For each, give me the reply she'll probably reach for and a follow-up that keeps the pressure on.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Topic:** Hofstadter's Superrationality (specifically in the context of One-Shot Prisoner's Dilemma and Newcomb's Problem).
      *   **Context:** The user hosts a decision theory podcast. The guest defends superrationality/one-boxing.
      *   **Goal:** Draft 8-9 interview questions that go *beyond* restating the standard argument.
      *   **Specific Requirements:**
          *   At least one question on mutual defection being a symmetric outcome (symmetry $\neq$ cooperation).
          *   At least one question on whether the view smuggles in a "coordinate on better equilibrium" premise.
          *   At least one question connecting to Functional Decision Theory (FDT) and "subjunctive dependence."
          *   For each question: Provide the guest's likely reply and a follow-up to keep the pressure on.
      *   **Tone:** Intellectual, probing, respectful but challenging (podcast interview style).

  2.  **Deconstruct Superrationality:**
      *   *Core Claim:* Rational agents facing the same problem with the same information will reach the same conclusion. Therefore, my decision determines the twin's decision.
      *   *Critique 1 (Symmetry):$ C,C $ is symmetric, but $ D,D $ is also symmetric. Why pick $ C $?
      *   *Critique 2 (Causality):* My choice doesn't *cause* the twin's choice in a physical sense. It's a correlation, not causation.
      *   *Critique 3 (Equilibrium Selection):* Is "superrationality" just a fancy name for assuming we can negotiate or select the Pareto-optimal Nash equilibrium without communication?
      *   *Connection to FDT:* FDT formalizes this via "subjunctive dependence" (logical correlation between decision algorithms).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Symmetry Objection (Required).*
          *   *Draft:* Why not defect? Defection is symmetric too.
          *   *Refinement:* Make it sharper. Focus on the fact that symmetry is a constraint, not an objective function.
          *   *Guest Reply:* We maximize utility within the symmetric constraint.
          *   *Follow-up:* But standard rationality says you can't control their move. How do you justify treating the correlation as a control variable?

      *   *Question 2: The "Smuggled Premise" (Required).*
          *   *Draft:* Are you just assuming we coordinate?
          *   *Refinement:* Frame it as "Equilibrium Selection." Is superrationality just a heuristic for picking the Pareto-dominant Nash equilibrium?
          *   *Guest Reply:* It's derived from the definition of rationality, not an extra premise.
          *   *Follow-up:* If it's derived, show me the step where 'rationality' implies 'preference for Pareto optimality' without importing a social preference.

      *   *Question 3: FDT Connection (Required).*
          *   *Draft:* How does this relate to FDT?
          *   *Refinement:* Focus on "subjunctive dependence." Does superrationality require a stronger metaphysical claim than FDT's logical correlation?
          *   *Guest Reply:* They are cousins. FDT formalizes the intuition.
          *   *Follow-up:* FDT relies on source code similarity. Hofstadter relies on "thinking alike." Is the latter too vague to handle asymmetric intelligence?

      *   *Question 4: The "One-Shot" Nature.*
          *   *Focus:* Real world vs. Thought experiment.
          *   *Draft:* Does this work in real life?
          *   *Refinement:* Focus on the *common knowledge* requirement. How much common knowledge is needed for the symmetry to hold?
          *   *Guest Reply:* Idealized rationality assumes common knowledge.
          *   *Follow-up:* If common knowledge breaks down even slightly, does the argument collapse into standard CDT?

      *   *Question 5: Newcomb Connection.*
          *   *Focus:* Consistency across problems.
          *   *Draft:* You one-box. Why?
          *   *Refinement:* Link the predictor in Newcomb to the twin in PD. Is the predictor just a "frozen" twin?
          *   *Guest Reply:* Yes, same logical structure.
          *   *Follow-up:* In Newcomb, the money is already there. In PD, the twin hasn't moved. Does the temporal aspect matter for your view?

      *   *Question 6: The "Magic" Objection (Causality).*
          *   *Focus:* Spooky action at a distance.
          *   *Draft:* It sounds like magic.
          *   *Refinement:* Address the "causal isolation" critique. How do you respond to the charge that this treats logical correlation as causal leverage?
          *   *Guest Reply:* It's not causal leverage, it's evidential leverage utilized by a decision theory that cares about output.
          *   *Follow-up:* But if I defect, the world doesn't change, only my *expectation* of the world changes. Why act on expectation over causal impact?

      *   *Question 7: Evolutionary Stability.*
          *   *Focus:* Game Theory/Evolution.
          *   *Draft:* Would this evolve?
          *   *Refinement:* If superrational agents meet sub-rational (CDT) agents, they get exploited. Is superrationality evolutionarily stable?
          *   *Guest Reply:* In a population of superrationalists, it wins.
          *   *Follow-up:* But invasion by defectors wipes them out. Is it only rational in a utopia?

      *   *Question 8: The Definition of "Rational".*
          *   *Focus:* Semantics vs. Substance.
          *   *Draft:* Is this just redefining rational?
          *   *Refinement:* Are we arguing about the word "rational" or the actual decision procedure?
          *   *Guest Reply:* It's about winning.
          *   *Follow-up:* If "winning" requires assuming a correlation that doesn't causally exist, are we maximizing utility or maximizing comfort with our self-image?

      *   *Question 9: Practical Application/Policy.*
          *   *Focus:* AI/Real world.
