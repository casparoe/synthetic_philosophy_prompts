answer: |-
  Here are 9 interview questions designed to probe the structural weaknesses and philosophical commitments of superrationality, complete with the guest's likely defense and a pressure-testing follow-up.

  ### 1. The Symmetry Constraint vs. Objective Function
  **Question:** "Let's start with the classic symmetry argument. You argue that because I and my psychological twin are identical rational agents, we must output the same move. But mutual defection is *also* a symmetric outcome. Symmetry alone restricts us to the diagonal of the payoff matrix (Cooperate/Cooperate or Defect/Defect), but it doesn't tell us which point on that diagonal to pick. Why does symmetry privilege the Pareto-optimal outcome over the Nash equilibrium?"

  *   **Guest's Likely Reply:** "Symmetry isn't the only premise; it's the constraint within which we maximize. Once you accept you are locked into the diagonal, you simply choose the diagonal point with the highest utility. Since C/C yields more than D/D, a rational agent who knows they are symmetrically locked picks C."
  *   **Follow-up:** "But that 'locking' is the contentious part. A Causal Decision Theorist says, 'I am free to pick any row, regardless of what the twin does.' By saying I'm 'locked to the diagonal,' aren't you essentially redefining the agent's degrees of freedom to *force* the cooperative outcome? At what step does 'I predict he will do what I do' turn into 'I must act as if I determine what he does'?"

  ### 2. The "Smuggled Premise" of Equilibrium Selection
  **Question:** "This leads to a worry that superrationality is just equilibrium selection dressed up as logic. It feels like the argument smuggles in an extra premise: 'When multiple symmetric equilibria exist, agents will coordinate on the better one.' If that's the heavy lifter, isn't superrationality just a fancy way of assuming away the coordination problem rather than solving it?"

  *   **Guest's Likely Reply:** "It's not an extra premise; it's a consequence of what it means to be rational. If two agents reason identically, they cannot end up on different steps of the same ladder. They aren't 'coordinating' in a communicative sense; they are converging on the unique solution that maximizes their shared algorithm's output."
  *   **Follow-up:** "But 'maximizing the algorithm's output' assumes the algorithm cares about the *joint* output. Standard rationality cares about *my* output. If my algorithm says 'Defect' because that dominates 'Cooperate' regardless of the other row, why is it irrational to run that algorithm? Are you arguing that rationality includes a preference for group utility when the agents are identical?"

  ### 3. Connection to Functional Decision Theory (FDT)
  **Question:** "I want to connect this to Functional Decision Theory. FDT justifies one-boxing and cooperation via 'subjunctive dependence'—the idea that my decision and the predictor's (or twin's) decision are logical outputs of the same function. Does Hofstadter's superrationality require a stronger metaphysical claim than FDT? Does it need me to believe I *cause* the twin's move, or is logical correlation enough?"

  *   **Guest's Likely Reply:** "It's the same move. Hofstadter was informal, but FDT formalizes it. You don't need causation; you need to recognize that your decision procedure *is* the twin's decision procedure. When you intervene on your decision, you are logically intervening on the twin's decision because they are the same computation."
  *   **Follow-up:** "FDT relies on source code transparency or high-fidelity simulation. Hofstadter's original argument was about 'thinking alike' as humans. If I'm slightly smarter than my twin, or we have different priors, the logical identity breaks. Does superrationality collapse entirely with imperfect symmetry, whereas FDT might still hold with high correlation? Is superrationality just FDT in a fragile, idealized limit?"

  ### 4. The "Magic" Objection (Causal Isolation)
  **Question:** "Critics often call this 'spooky action at a distance.' In a one-shot PD, the boxes are closed. If I defect, the money in the other box doesn't physically change. Superrationality asks me to act *as if* my choice changes the other box. Why should a rational agent maximize based on evidential correlations that lack causal mechanisms?"

  *   **Guest's Likely Reply:** "Because the goal is to win, not to have causal influence. If acting 'as if' I control the other box results in me walking away with $100 instead of $10, then that decision procedure wins. Causality is a tool for achieving goals, not a constraint on decision-making itself."
  *   **Follow-up:** "But if I defect, I *actually* get the higher payoff if the twin cooperates. By cooperating, I'm leaving money on the table in the world where the twin defects. Aren't you advising agents to make themselves vulnerable to exploitation in the non-symmetric cases just to capture gains in the symmetric cases? Is that really 'rationality' or just a specific risk policy?"

  ### 5. Common Knowledge and Regress
  **Question:** "For the symmetry argument to hold, I need to know you're rational, you need to know I'm rational, I need to know that you know, and so on. In the real world, common knowledge of rationality is incredibly fragile. If I suspect there's a 1% chance you're a standard Causal Decision Theorist, does the superrational argument dissolve immediately?"

  *   **Guest's Likely Reply:** "In idealized decision theory, we assume common knowledge. In practice, you weigh the probability. But even with a small probability of a twin, the expected utility of cooperation can outweigh defection if the payoff for mutual cooperation is high enough. It's a gradient, not a binary switch."
  *   **Follow-up:** "If it's a gradient, then it's just standard Expected Utility Theory with a probability estimate on the twin's behavior. Where is the distinct 'superrational' move left? If I cooperate because I assign a 90% probability you'll cooperate, that's just evidential reasoning. What work is 'superrationality' doing that Bayesian updating isn't already doing?"

  ### 6. Newcomb's Problem Consistency
  **Question:** "You one-box on Newcomb's Problem for the same reason you cooperate in the PD. But in Newcomb, the money is already in the box. In the PD, the twin hasn't moved yet. Does the temporal asymmetry matter to you? Is the PD just a 'two-agent Newcomb' where the predictor is another agent rather than a demon?"

  *   **Guest's Likely Reply:** "Exactly. The temporal order is irrelevant. The logical order is what matters. In both cases, your decision is correlated with the state of the world (money in box / twin's move) via a common cause (your shared rationality/algorithm)."
  *   **Follow-up:** "In Newcomb, the predictor is usually assumed to be *outside* the game. In PD, the twin is a *player* with their own payoff structure. If the twin realizes I'm a superrationalist, can they exploit me by pretending to be a twin while secretly planning to defect? Does superrationality require a 'honor among thieves' clause that standard game theory doesn't?"

  ### 7. Evolutionary Stability
  **Question:** "Let's look at this evolutionarily. If a population of superrationalists meets a population of defectors, the defectors wipe them out. Superrationality seems to only work in a utopia where everyone is already superrational. Is this a theory of how agents *should* reason, or is it only stable in a world where everyone already agrees to it?"

  *   **Guest's Likely Reply:** "It's a theory of how agents should reason to maximize utility in high-correlation environments. In a low-correlation environment, defection is correct. But as AI and transparent agents become common, high-correlation environments will be the norm, making superrationality the dominant strategy long-term."
  *   **Follow-up:** "So it's not a universal theory of rationality; it's context-dependent on the density of other superrationalists. If that's true, isn't the rational move to *identify* the density first? And if I have to identify it, haven't I just reduced superrationality to a conditional strategy: 'Cooperate if likely twin, else Defect'?"

  ### 8. The Definition of "Winning"
  **Question:** "Proponents often say, 'Superrationalists win.' But in the one-shot PD, if I defect and you cooperate, I win more than you. If we both cooperate, we win less than I would have won against a cooperator. In what sense does the superrationalist 'win' other than avoiding the worst-case scenario?"

  *   **Guest's Likely Reply:** "They win in the sense that they maximize the return of their decision algorithm across the possible worlds they find themselves in. You might win a single round by defecting against a cooperator, but your algorithm is parasitic. The superrational algorithm generates more value in a universe populated by copies of itself."
  *   **Follow-up:** "That sounds like a moral argument disguised as decision theory. You're praising the algorithm that is 'good for the species' of rational agents. But rationality is usually agent-relative. Why should I care if my algorithm is 'parasitic' if it gets me the money in this specific, one-off instance?"

  ### 9. AI and Source Code Transparency
  **Question:** "Finally, looking forward: If we build AIs that can read each other's source code, superrationality becomes provable via 'program equilibrium.' Does this suggest that superrationality isn't actually a human rationality theory at all, but rather a theory of machine interaction that we're mistakenly trying to apply to opaque human brains?"

  *   **Guest's Likely Reply:** "It applies wherever there is logical correlation. Humans have enough shared structure—culture, biology, education—to create non-trivial correlation. It's stronger in AIs, but not exclusive to them."
  *   **Follow-up:** "But with humans, the 'source code' is hidden and noisy. If the theory only becomes robust when the code is transparent, isn't the human application of superrationality just a bet on psychological similarity? And if it's just a bet, why call it a logical necessity rather than a heuristic?"
