answer: |-
  Good evening, everyone. For those who don't know me, I'm the groom's brother.

  I have a bit of a unique position tonight. Half of you are here because you're family, who just want to know if the open bar is working. The other half are [Bride]'s econ cohort, who are currently scanning this speech for theoretical inaccuracies. I should warn you: I'm currently in a philosophy of economics seminar on bounded rationality, so I feel qualified to speak on this. But mostly, I'm just the brother who has watched [Groom] fall in love.

  [Groom] and [Bride] bonded over a very specific hero: Herbert Simon. For the family, Simon was a polymath who won a Nobel in Economics but is also considered a grandfather of Computer Science. He argued that humans aren't perfect calculators. We have "bounded rationality." We can't process every variable in the universe.

  So, how do we make decisions? Simon said we don't *maximize*. We don't scan every single option to find the theoretical global optimum, because that search would take forever and cost us everything. Instead, we *satisfice*. We set an aspiration level—a set of values and standards that matter most—and when we find something that meets them, we choose it. And then, crucially, we stop searching.

  Now, I know what some of you are thinking. "Satisficing? Really? In a wedding toast? That sounds like 'settling.'"

  And that is exactly where the theory gets misunderstood, and where [Groom] and [Bride] get it right.

  Simon never argued for lowering the bar. He argued for recognizing that the "perfect" is the enemy of the "good" *only if* you refuse to commit. In optimization, the value is in the *finding*. In satisficing, the value is in the *building*.

  [Groom] and [Bride] didn't find each other because they ran out of options. They found each other because they knew what mattered. Their aspiration level wasn't a checklist of superficial traits; it was a threshold for intellectual curiosity, kindness, resilience, and a shared obsession with how the mind works. When they met, they cleared that bar. And instead of wondering "what else is out there," they made the rational, beautiful choice to stop the search and invest everything into what they had found.

  In Computer Science terms, they stopped running the algorithm and started writing the code. In Economic terms, they recognized that the utility of a partnership isn't discovered; it's created over time through commitment.

  To the econ students in the room: You know that a satisficing solution becomes optimal once you account for the cost of search. But to the family: All this really means is that they looked at each other and said, "I don't need to keep looking. I'm home."

  They understand that a marriage isn't about finding the perfect person. It's about taking a person who meets your highest standards, and then spending a lifetime making that choice the best one you could have possibly made. They are optimizing *together*, day by day, rather than searching alone.

  So, if we could raise a glass.

  To Herbert Simon, for giving us the vocabulary. But mostly, to [Groom] and [Bride]. May your aspiration levels remain high, may your search costs remain zero, and may you spend the rest of your lives proving that the best decision you ever made was the day you decided to stop looking and start building.

  To the happy couple.
