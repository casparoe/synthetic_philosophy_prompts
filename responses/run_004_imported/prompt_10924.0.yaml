answer: |-
  The "boundary problem," as crystallized by Frederick Whelan, presents a formidable challenge to democratic theory: if the legitimacy of democratic decisions rests on the consent of the governed, who constitutes "the governed" must itself be decided democratically. Yet, as Whelan notes, any vote to determine membership presupposes a prior definition of who is entitled to vote. This generates an infinite regress, leading Whelan to conclude that boundaries must be fixed by pre-political facts (history, culture, or arbitrary fiat) rather than democratic principle.

  In response, contemporary theorists have proposed normative criteria to break this circle. Robert Goodin advocates the **All-Affected Interests (AAI)** principle, while Arash Abizadeh defends the **All-Subjected (Coercion)** principle. While both attempt to provide a moral standard for boundary-setting that bypasses Whelan's procedural regress, they differ significantly in scope and determinacy. In my judgment, Abizadeh's principle comes closer to resolving Whelan's circularity, whereas Goodin's principle merely relocates it. This is best illustrated by examining how each principle handles the case of transnational carbon emissions.

  ### The Rival Principles

  **Goodin's All-Affected Interests Principle** posits that "everyone who is affected by the decisions of a given government should have a right to participate in that government's processes." Normatively, this is rooted in a utilitarian concern for welfare and the protection of interests. If a decision impacts your well-being, you should have a say to protect that well-being.

  **Abizadeh's All-Subjected Principle** argues that democratic legitimacy is required specifically where coercive political power is exercised. Drawing on the liberal premise that coercion requires justification to those coerced, Abizadeh contends that the *demos* must include all those subject to the coercive apparatus of the state. This is not about welfare, but about autonomy and the legitimacy of force.

  ### The Concrete Case: Transnational Carbon Emissions

  Consider a scenario where the United States legislature is voting on a deregulation of carbon emissions.

  **Under Goodin's AAI:** The causal chain of climate change is global. A decision in Washington affects sea levels in Tuvalu, agriculture in India, and weather patterns in Europe. Because the interests of a Tuvaluan are demonstrably "affected" by US policy, Goodin's principle suggests the Tuvaluan should be enfranchised in the US decision. Taken seriously, AAI implies that for issues like climate change, the *demos* must be global. Every voter on earth potentially has a stake in every major industrial nation's environmental policy.

  **Under Abizadeh's Coercion Principle:** The analysis differs. While the Tuvaluan is *harmed* by US emissions, are they *subject to US coercive power*? Abizadeh typically defines coercion as the imposition of binding laws backed by force. The US state does not enforce its environmental laws upon Tuvaluans; it does not arrest them for non-compliance, nor does it tax them. While the *consequences* of the law cross borders, the *coercive jurisdiction* does not. Therefore, under a strict reading of Abizadeh, the Tuvaluan is not part of the US *demos* regarding this specific policy, though they might be part of a *demos* for a global climate treaty that *does* exert coercive power over them.

  ### Evaluating Whelan's Circularity

  The crux of Whelan's challenge is whether a principle can define the boundary without requiring a democratic vote to validate the principle itself.

  **Goodin Relocates the Circularity**
  Goodin's principle appears to solve the boundary problem by offering an objective metric: causal affectation. However, "affectation" is notoriously indeterminate. In a complex global economy and ecosystem, almost everyone is affected by almost everything (the "butterfly effect"). To make AAI workable, one must draw a line around which interests count and how direct the causal chain must be.
  Who draws that line? If the existing *demos* decides which foreign interests are "significant enough" to warrant enfranchisement, we have returned to Whelan's circle: the *demos* is defining its own boundaries. If we say "all causal effects count," the *demos* becomes unbounded and democracy becomes unworkable. Thus, AAI relocates the circularity from "who votes" to "what counts as an affected interest." It pushes the political contestation back one step but does not resolve it.

  **Abizadeh Resolves (or Dissolves) the Circularity**
  Abizadeh's approach is more successful because it grounds the boundary in the **conditions of legitimacy** rather than the **consequences of policy**. Abizadeh argues that the obligation to include the subjected is not a decision the *demos* makes; it is a moral constraint that exists *prior* to the democratic act. If a state claims the right to coerce, it *automatically* incurs an obligation to justify that coercion to the coerced.
  This avoids Whelan's regress because it does not require a vote to determine the boundary. The boundary is revealed by the reach of the coercive apparatus. While one might argue about what counts as "coercion" (e.g., is economic sanction coercion?), the threshold is binary and institutional (law/force) rather than scalar and causal (degree of harm).
  In the climate case, Abizadeh acknowledges that if the US joins a global climate regime that enforces penalties on Tuvalu, Tuvaluans must be included in *that* regime's *demos*. But regarding domestic US law, the boundary remains national. This preserves the possibility of a functioning democratic unit while still challenging arbitrary exclusion (as Abizadeh famously does regarding border controls, which *are* coercive acts against outsiders).

  ### Conclusion

  Goodin's All-Affected Interests principle is morally expansive but theoretically unstable. By making membership contingent on causal consequences, it renders the *demos* fluid and potentially infinite, requiring a political decision to stabilize the boundaries—thereby relocating Whelan's circularity.

  Abizadeh's All-Subjected principle comes closer to a genuine resolution. By tethering democratic membership to the specific exercise of coercive power, it provides a determinate, institutional criterion that does not require democratic validation to be operative. It treats the boundary not as a question for the vote, but as a precondition for the vote's legitimacy. While not perfect—debates over the nature of coercion remain—Abizadeh successfully shifts the burden from a procedural impossibility to a normative constraint on state power, offering a more robust answer to Whelan's paradox.
