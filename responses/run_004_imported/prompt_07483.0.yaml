      *   **Part (d): PP vs. Reflection**
          *   *Reflection:* Current credence defers to future credence. $C_t(A | C_{t'}(A)=x) = x$. Jordan gets the formula right.
          *   *Difference:* PP = objective chance. Reflection = future subjective credence. Jordan gets this.
          *   *Relationship:* "Reflection is best understood as a special case of the Principal Principle rather than a genuinely separate principle." **Problematic Claim.** While Lewis discusses connections, standard interpretation (and van Fraassen's own view) treats them as distinct constraints. Reflection is about diachronic coherence of the agent. PP is about agent-world alignment. Calling Reflection a "special case" of PP is philosophically contentious and often considered incorrect because Reflection applies even in domains without objective chance (e.g., mathematics, ethics, or if one is an anti-realist about chance).
