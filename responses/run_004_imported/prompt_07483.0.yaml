          *   *Mechanism:* "Since you're conditionalizing on the history-and-theory pair... an undermining future is no longer a threat." This is the right *idea*. By conditionalizing on the theory $T$, we acknowledge that $T$ might be false if the future undermines it. The NP tells us to defer to the chance function *defined by T*, not the "true" chance function (which we can't know without knowing the future).
