      *   **Part (b): Humeanism & The Big Bad Bug**
          *   *Humeanism:* Chances read off total history (past + future) via Best System. Correct.
          *   *Undermining Future:* Defined as a continuation compatible with present chances but which would make a different best system true. Correct.
          *   *The Bug:* Present chances depend on future. If an undermining future occurs, the present chance attribution was false. PP says trust present chances. But present chances assign positive probability to the undermining future. If you trust them, you assign credence to a scenario where the chances you are trusting are false. Contradiction/Instability.
