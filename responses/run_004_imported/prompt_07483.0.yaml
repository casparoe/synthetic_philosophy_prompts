      *   *Part (c) Attribution:* Is confusing van Fraassen with Hall/Thau a 2-point deduction? In a seminar specifically on Lewis's metaphysics, yes. Lewis explicitly discusses Hall and Thau in "Humean Supervenience Debugged." Van Fraassen is the Reflection Principle guy. Mixing them up suggests the student might have conflated the "New Principle" with the "Reflection Principle" conceptually, even if they described the NP mechanics okay. However, the description of the NP mechanics ($H_t$ & $T$) is the hard part, and they got that. I'll stick with 5/7. It's a "good but flawed" answer.
