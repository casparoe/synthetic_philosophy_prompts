answer: |-
  This is an excellent question that cuts to the heart of a common misunderstanding about Integrated Information Theory (IIT). Your reasoning is logically sound *if* one assumes IIT is a form of computational functionalism. However, the skepticism expressed by Giulio Tononi, Christof Koch, and other IIT proponents stems from the fact that **IIT is explicitly not functionalist.**

  The discrepancy you are noticing arises because IIT defines "causal structure" differently than the standard rationalist/computationalist argument for mind uploading does. Here is a breakdown of why IIT theorists reject the conclusion that a software emulation guarantees consciousness, despite their theory focusing on causal structure.

  ### 1. Intrinsic vs. Extrinsic Causality
  The standard uploading argument relies on **extrinsic** causality. It argues that if the input-output functions and the logical flow of information are preserved, the system is equivalent.

  IIT, however, is built on the axiom of **Intrinsic Existence**. For a system to be conscious, it must exist for itself, not for an outside observer. This means the system must possess **intrinsic causal power**. It must constrain its own past and future states physically.

  *   **The Simulation Distinction:** Tononi often uses the analogy of a weather simulation. You can simulate a hurricane on a computer with perfect fidelity regarding pressure and wind velocity equations. However, the computer does not get wet, and the wind inside the case does not blow. The simulation describes the causal structure; it does not *instantiate* it.
  *   **IIT's View:** In a digital emulation, the "causal connections" between simulated neurons are logical dependencies within a software program. The *physical* causal connections are those within the CPU (transistors switching states). The CPU's physical causal structure is vastly different from the brain's. Therefore, the $\Phi$ of the computer running the simulation is the $\Phi$ of the computer hardware (which is likely low), not the $\Phi$ of the simulated brain.

  ### 2. The Substrate Does Matter (Contrary to Functionalism)
  The rationalist argument for uploading usually rests on **Substrate Independence**: the idea that mind is to brain as software is to hardware.

  IIT posits **Substrate Specificity**. While it doesn't demand biological tissue specifically, it demands a physical substrate that supports specific causal properties (recurrence, feedback, integration) in a way that is not time-multiplexed.

  *   **Von Neumann Bottleneck:** Most modern computers use a von Neumann architecture, where memory and processing are separate, and operations are largely serial (clocked). To simulate a massively parallel, recurrent neural network, the CPU cycles through states sequentially.
  *   **The Loss of Integration:** In IIT 3.0 and 4.0, $\Phi$ is calculated based on the system's ability to be irreducible to its parts *at a specific moment in time*. If a computer simulates neuron A affecting neuron B by saving a value to RAM and reading it in the next clock cycle, IIT argues this breaks the intrinsic integration. The physical mechanism causing the state change is the clock and the bus, not a direct causal link between the "simulated neurons." Consequently, the intrinsic causal structure of the emulation is fragmented, resulting in a $\Phi$ near zero, regardless of how complex the software is.

  ### 3. Cause-Effect Repertoires are Physical, Not Logical
  In the rationalist view, "causal organization" often refers to the abstract dependency graph (if X fires, Y fires). In IIT, "causal structure" refers to the **Cause-Effect Repertoire** of the physical mechanism.

  For IIT, a connection counts only if the physical state of element A *mechanistically constrains* the physical state of element B.
  *   **In the Brain:** Neurotransmitters and electrical potentials physically constrain adjacent neurons.
  *   **In an Emulation:** The state of "Simulated Neuron A" is a number in a register. It does not physically constrain "Simulated Neuron B." The *CPU* constrains the register.

  Tononi and Koch argue that because the physical causal links in a digital computer do not map 1:1 onto the causal links of the simulated brain, the $\Phi$ is not preserved. The emulation reproduces the *behavior* of the causal structure, but not the *causal power* itself.

  ### 4. Where IIT *Would* Allow Uploading
  It is important to note that Tononi and Koch are not vitalists; they do not believe consciousness requires "magic biology." Their skepticism is directed at **digital simulation on general-purpose hardware**, not uploading per se.

  IIT leaves the door open for consciousness in non-biological systems if the hardware itself is wired to match the causal topology of the brain.
  *   **Neuromorphic Hardware:** If you built a silicon chip where every transistor or gate corresponded directly to a neuron or synapse, with physical recurrent connections and parallel processing (no time-multiplexing), IIT suggests this system *could* have high $\Phi$ and be conscious.
  *   **The Distinction:** The hesitation is about *emulation* (software simulating hardware) vs. *instantiation* (hardware mirroring the structure).

  ### Summary of the Discrepancy
  Your premise was: *"IIT identifies experience with $\Phi$, a precise, computable measure of a system's integrated causal structure -- meaning a sufficiently fine-grained emulation that preserves the brain's causal relations should generate the same $\Phi$."*

  The IIT correction is: *"An emulation preserves the **logical** causal relations, but not the **physical** causal relations. $\Phi$ is a measure of the physical mechanism's irreducibility. Since the physical mechanism of a computer running a simulation is fundamentally different from the physical mechanism of a brain, the $\Phi$ will be different (and likely negligible)."*

  ### Why This Matters for Rationalists
  For the rationalist community, this is a significant pivot. It suggests that IIT is not the "physicalist vindication" of functionalist uploading they hoped for. Instead, IIT acts as a constraint on *how* uploading must be achieved. It implies that we cannot simply "scan and run" on a cloud server; we may need to "scan and build" using neuromorphic engineering to preserve the intrinsic causal power required for $\Phi > 0$.

  Tononi and Koch are consistent: they are skeptical of uploading *as currently conceived by computationalists*, because they believe computationalists are confusing the map (the simulation) with the territory (the intrinsic causal power).
