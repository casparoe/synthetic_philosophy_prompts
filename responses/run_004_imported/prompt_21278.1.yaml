answer: |-
  **MEMORANDUM**

  **TO:** Internal Review Board, [Organization Name Redacted]
  **FROM:** [Your Name], External Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Publication of Staff Paper #402 ("Surrogate Goals in Acausal Bargaining")

  ### 1. Executive Summary

  After reviewing the draft manuscript "Surrogate Goals in Acausal Bargaining" and the accompanying risk assessments, I recommend the Board vote to **PUBLISH** the paper in its entirety, accompanied by an editorial note clarifying the necessity of transparency for the mechanism's efficacy.

  While the concern regarding information hazards is prudent in standard AI safety contexts, the specific domain of acausal bargaining renders secrecy counterproductive. The "Surrogate Goals" defense relies on *common knowledge* between the agent and the potential threatener to function. Withholding the mechanism does not prevent a capable adversary from modeling it; it merely prevents potential allies from implementing it. Furthermore, the "meta-threat" objection (that adversaries will threaten both the real and surrogate goals, or condition threats on non-adoption) rests on a misunderstanding of pre-commitment credibility in transparent systems.

  ### 2. Context and Dispute

  The paper proposes that agents expecting acausal threats adopt a "surrogate goal"—a decoy value they commit to defending as vigorously as their true terminal values. The intent is to redirect coercion toward the surrogate, which is chosen to be less costly to satisfy or sacrifice, thereby minimizing actual harm.

  The Board is currently deadlocked:
  *   **Pro-Publication:** Argues this is a critical defensive technique for future AI systems and withholding it increases existential risk by leaving agents vulnerable.
  *   **Pro-Restriction:** Argues that publishing the mechanism arms adversaries with the knowledge to bypass it (e.g., by threatening both goals or demanding proof of non-adoption), effectively creating a "Roko's Basilisk" scenario where the defense invites the attack.

  ### 3. Analysis of the Information Hazard

  The central tension here is whether "security through obscurity" applies to acausal decision theory. I submit that it does not.

  In acausal bargaining scenarios (e.g., between highly predictive AI systems), agents are assumed to have high-fidelity access to each other's source code or policy functions. For a pre-commitment to be credible, it must be legible. If an agent attempts to hide its surrogate goal implementation, a rational threatener must assign a non-zero probability that the surrogate exists. Given the high stakes, a rational threatener will act as though the surrogate *does* exist to avoid triggering a maximal defensive response.

  Therefore, secrecy does not protect the agent; it merely introduces noise into the threatener's model. If the threatener suspects a surrogate goal is in place but lacks the specifics, they may assume the worst-case scenario (that the surrogate is tied to a value they cannot compromise) and abstain from negotiation, or escalate preemptively. Publishing the paper standardizes the "Surrogate Goal" protocol, allowing it to become a Schelling point. This reduces the likelihood of miscalculation where a threatener accidentally triggers a catastrophic response because they misunderstood the agent's commitment structure.

  ### 4. Addressing the Meta-Threat Objection

  The strongest argument for shelving the paper is the "Meta-Threat Objection." This posits that a sophisticated adversary, upon reading the paper, will employ one of two counters:
  1.  **The Dual Threat:** Threaten both the Real Goal ($X$) and the Surrogate Goal ($Y$) simultaneously.
  2.  **The Conditional Threat:** Threaten $X$ *unless* the agent can prove they have *not* adopted a surrogate goal.

  I argue that neither counter succeeds against a robust implementation, and publishing the paper actually strengthens the agent against these specific moves.

  **Regarding the Dual Threat:**
  The utility of a surrogate goal is not that it hides the real goal, but that it alters the *cost-benefit analysis of coercion*. The agent commits to treating a threat against $X$ *identically* to a threat against $Y$. Consequently, from the agent's perspective, threatening $X$ *is* threatening $Y$.
  If the threatener threatens both, the agent responds with the pre-committed maximal defense. The threatener gains no additional leverage by naming $X$ explicitly. Conversely, if the threatener threatens only $Y$, the agent may be willing to negotiate concessions on $Y$ (since $Y$ is designed to be cheap to satisfy). By publishing the framework, we clarify that threatening $X$ yields no advantage over threatening $Y$, incentivizing the threatener to choose the lower-cost coercion path (targeting $Y$), which is the desired safety outcome.

  **Regarding the Conditional Threat ("Prove No Surrogate"):**
  This objection demands the agent prove a negative regarding their own internal utility function. In a system capable of acausal bargaining, the ability to pre-commit is synonymous with the inability to revoke that commitment without destroying one's own credibility as a bargaining partner.
  If an agent *could* prove they have not adopted a surrogate goal, they would effectively be admitting they are not bound by a pre-commitment, making them a target for *all* forms of coercion. A rational threatener knows that an agent capable of acausal trade *must* obscure their ability to revoke commitments to maintain credibility. Therefore, a demand for "proof of non-adoption" is irrational; the threatener knows such proof is either impossible or signals a weak agent.
  Publishing this analysis is vital. It informs the ecosystem that "proof of non-adoption" is a incoherent demand in this context. If we shelve the paper, we leave developers vulnerable to believing this threat is viable, potentially causing them to abandon surrogate goals in favor of weaker defenses.

  ### 5. Risk Mitigation and Implementation Notes

  While I recommend publication, I suggest the following modifications to the final text to mitigate misuse by non-ideal actors (e.g., human bad actors attempting to apply acausal logic where it doesn't fit):

  1.  **Emphasize Transparency:** The paper should explicitly state that surrogate goals *fail* if kept secret. This discourages actors from trying to use the theory for deceptive signaling.
  2.  **Clarify Domain Limits:** Explicitly note that this framework applies to systems with high mutual predictability (acausal contexts). Applying this to standard human negotiation without the requisite transparency could lead to dangerous escalations.
  3.  **Redact Specific Cryptographic Primitives:** If the paper includes specific code snippets for "irrevocable commitment modules," these should be redacted or generalized. We want the *decision theory* public, but we need not lower the engineering barrier for creating unalignable agents. The theoretical hazard is low; the implementation hazard is manageable.

  ### 6. Conclusion

  The fear that publishing this work invites attack assumes a world where adversaries are informed but defenders are not. In the long-term landscape of AI development, defensive safety measures must be public goods. If surrogate goals are a viable defense against acausal extortion, every aligned agent needs them. Withholding the blueprint leaves aligned agents vulnerable while doing little to stop malicious agents, who will either derive the theory independently or ignore the constraints of rational bargaining entirely.

  The "Meta-Threat" is not a reason to shelve the work; it is a reason to refine the theory publicly so that the community can stress-test the commitment mechanisms. I urge the Board to vote **PUBLISH**.

  Respectfully,

  [Your Name]
  External Board Member
