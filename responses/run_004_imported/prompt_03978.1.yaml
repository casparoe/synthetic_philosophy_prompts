answer: |-
  This is a sharp, textually grounded provocation, and it cuts through a very common undergraduate misconception. You are right to be cautious about the "developmental" narrative (young hot-head vs. old statesman), because the textual evidence for a hard reversal is thin.

  Here is an honest assessment of your three pressure points, followed by a verdict on whether it's worth the class time.

  ### 1. Are you harmonizing too charitably? (Development vs. Consistency)
  You are not harmonizing *too* charitably, but you should acknowledge that the *tone* does shift, even if the doctrine doesn't break.

  The "developmental" thesis (that Thomas softened his stance) usually relies on reading the *Sentences* as a theoretical abstraction and *De Regimine*/*Summa* as practical political theology. However, most current scholarship leans toward your view: **consistency via specification.**

  *   **The *Sentences* Context:** This is a commentary on Peter Lombard, dealing with specific objections regarding sin and merit. The "praised and rewarded" line is a reply to an objection about whether killing a tyrant is meritorious. Thomas grants it *only* under the specific condition of usurpation (*invasio*) where no public authority exists to judge.
  *   **The *De Regimine* Context:** Here he is advising a king. Naturally, he emphasizes stability and the dangers of private initiative. The story of the Syracusan woman isn't a retraction of the *Sentences*; it's a warning against the *indiscriminate* application of the *Sentences* principle.
  *   **The *Summa* Context:** This is the mature synthesis. By framing it through the lens of *sedition* (II-II, q. 42), he makes the moral calculus about the *common good*. If the tyrant destroys the common good, opposing him isn't sedition. But if the opposition causes more disorder than the tyranny, it becomes sinful.

  **Verdict:** Your claim holds. It is not a change of mind; it is a change of **jurisdictional precision.** The *Sentences* allows for action when there is *no* jurisdiction (usurper); the later works explain what to do when jurisdiction *does* exist (community or superior). You aren't harmonizing charitably; you are recognizing that Thomas treats the usurper as a criminal outlaw, not a legitimate ruler who went bad.

  ### 2. Is the Usurper-vs.-Tyrant distinction backreading?
  **No.** This is the strongest part of your argument.

  You are not backreading from Bartolus or the Commentators. The distinction between the *tyrannus ex defectu tituli* (tyrant by lack of title/usurper) and the *tyrannus ex parte exercitii* (tyrant by exercise/misrule) is available to Thomas via:
  1.  **Roman Law:** The *Lex Julia de vi publica* distinguishes between those who seize power and those who abuse it.
  2.  **Canon Law:** Gratian and the decretalists discuss the deposition of bishops and rulers, making distinctions based on legitimate election vs. intrusion.
  3.  **John of Salisbury:** In the *Policraticus* (which Thomas knows), the distinction is already present, though John is more permissive about killing the "image of depravity."

  Thomas inherits this legal vocabulary. In the *Sentences* passage you cite, he explicitly uses the language of "violence and ruse" (*per violentiam et astutiam*) regarding the acquisition of power. He is not talking about a legitimately crowned king who becomes oppressive; he is talking about a warlord who seizes the throne.

  **Verdict:** You are on solid historical ground. The distinction is Thomistic (and pre-Thomistic), not a later civilian invention projected backward.

  ### 3. Is this "Old News" to Specialists?
  **Yes and No.**

  *   **To Medievalists:** This is standard fare. Anyone who specializes in medieval political thought (the "Cambridge School" lineage, e.g., Skinner, Nederman, Canning) knows that the "Aquinas endorsed tyrannicide" soundbite is a caricature. The nuance regarding usurpation vs. misrule is found in any decent graduate seminar on the subject.
  *   **To Generalists/Students:** It is **not** old news. The "Aquinas = Tyrannicide" myth is incredibly sticky. It appears in intro textbooks, pop-history videos, and general surveys of political theory.

  **Pedagogical Value:**
  Just because specialists know it doesn't mean it isn't worth class time. In fact, it is *more* worth class time because it teaches students **how to read primary sources against secondary reputations.**

  If you present this, you aren't just teaching Aquinas; you are teaching historiography. You are showing them how a single sentence (*Sentences*) can be weaponized to create a reputation that the rest of the corpus (*Summa, De Regno*) contradicts or heavily qualifies.

  ### Suggestions to Bulletproof the Provocation

  If you want to make this airtight for the seminar, consider adding these two nuances:

  **1. The "Public Authority" Caveat**
  In *De Regimine* I.6, Thomas says if there is a superior authority (like an Emperor over a King), appeal to them. If the community installed the king, the community can depose him.
  *   **The Kicker:** Thomas rarely believes the conditions for legitimate private killing are actually met in the 13th century. By the time you get to the *Summa*, the "utilitarian hedge" (don't do it if it causes worse turmoil) effectively swallows the rule. You might argue that while the *theoretical* right exists in the *Sentences*, the *practical* possibility is almost nil in his mature work.

  **2. The Authorship of *De Regimine* Book II**
  You cite *De Regimine* I.6, which is securely Thomas. Be careful if you venture into Book II of that text, which is widely attributed to Ptolemy of Lucca and is much more "republican" and conciliarist. Stick to Book I for Thomas's voice. Your current draft does this, but keep it in mind if students push back with citations from later in the treatise.

  **3. The Word "Tyrannicide"**
  Aquinas never uses the noun *tyrannicidium* affirmatively. He talks about *occidere* (to kill) or *deicere* (to depose). The term "tyrannicide" carries a glorified, heroic connotation that Thomas avoids. Pointing out that he refuses to name the act might be a nice linguistic flourish to support your "restrictive" claim.

  ### Final Verdict
  **Do it.**

  It is a robust argument that holds up textually. It corrects a major misconception without turning Aquinas into a modern liberal (he still allows for removal, just through specific channels).

  It works best if you frame it not as "Aquinas changed his mind," but as **"Aquinas is more of a lawyer than you think."** He is obsessed with *jurisdiction* and *order*. The *Sentences* case is a legal edge-case (outlaw usurper); the *Summa* case is political reality (established ruler). Showing students that Aquinas cares more about the *rule of law* than the *removal of bad men* is a powerful lesson for a seminar on resistance theory.

  **Rating:** High value. Not new to specialists, but essential for students.
