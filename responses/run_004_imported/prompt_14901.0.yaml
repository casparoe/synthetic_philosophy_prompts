answer: |-
  First off, huge respect for turning a pub quiz dispute into a genuine philosophical inquiry. You have effectively reinvented a significant chunk of contemporary epistemology (the study of knowledge and belief) over a couple of pints. That is exactly how good philosophy often starts: with a nagging intuition about a specific case.

  To answer your three questions directly: **Yes, this is a very real, named problem.** **Your "fix" is a recognized philosophical position (though controversial).** And **yes, there are specific thought experiments designed to attack it.**

  Here is the breakdown of where your thoughts land on the philosophical map.

  ### 1. Is this a real recognized problem?
  **Yes.** You hit the nail on the head with your Google search.

  *   **Higher-Order Evidence (HOE):** This is evidence about your own cognitive performance. (e.g., "I am drunk," "I am tired," "An expert disagrees with me").
  *   **Epistemic Akrasia:** This is the state you described: believing $P$ while simultaneously believing that believing $P$ is irrational or untrustworthy.

  The specific puzzle you are grappling with is often called **The Problem of Rational Akrasia**. It asks: *Can it ever be rational to be akratic?*

  For a long time, the standard view was "No." Philosophers argued for something called the **Akratic Principle**: *It is always irrational to believe $P$ while believing that one shouldn't believe $P$.* The idea was that rationality requires coherence between your levels of thought.

  However, in the last 15 years, philosophers like **David Christensen** and **Sophie Horowitz** have argued that Higher-Order Evidence *forces* us into akrasia. Their argument is basically your argument: If I have strong evidence that I'm drunk (HOE), I must lower my confidence. But if my first-order reasoning (the quiz logic) still looks perfect to me, I still believe the answer. Therefore, rationality sometimes *requires* me to be in that split, self-undermining state.

  ### 2. Does your "fix" hold up, or is it wordplay?
  Your fix is: *Believing $P$ and believing "my belief in $P$ is trustworthy" are separate states that can peel apart without irrationality.*

  In the literature, this is known as the **Level-Splitting View**. It is not wordplay; it is a robust defense against the idea that akrasia is always irrational.

  **Why it holds up:**
  It respects the "force" of both types of evidence.
  1.  **First-Order Evidence:** The logic of the quiz question still looks valid to you. To ignore this is to ignore the evidence you have right in front of your eyes.
  2.  **Higher-Order Evidence:** The fact that you are drunk is undeniable. To ignore this is to be dogmatic.

  If you say, "Because I'm drunk, I must now pretend the logic looks bad to me," you are lying to yourself about your current mental state. The logic *does* look good. So, the Level-Splitting view says: Keep the belief (because the logic looks good), but downgrade the *justification* (because you're drunk).

  **The Cost:**
  The "cost" of this fix is exactly what you felt: it creates a fragmented mind. You are left saying, "I believe it's X, but I admit I have no business believing it's X." It feels unstable. But proponents argue that reality is sometimes unstable, and our minds have to reflect that.

  ### 3. Are there counterexamples that blow this up?
  Yes. There are two major objections to your fix that you should know about.

  #### A. The "Self-Defeat" Objection
  Critics (like philosopher **Maria Lasonen-Aarnio**) argue that if you truly believe "I shouldn't trust this belief," that belief *itself* becomes a reason to drop the original belief.

  *   **The Argument:** If I believe "My compass is broken," I stop following the compass. If I believe "My brain is broken regarding this quiz question," why do I continue to follow my brain's conclusion?
  *   **The Counter to your fix:** If you acknowledge your reasoning is compromised, but you stick with the conclusion anyway, aren't you essentially ignoring the higher-order evidence? By keeping the belief, aren't you implicitly saying, "Actually, maybe I'm not *that* compromised"?

  #### B. The "Bootstrapping" Problem
  Imagine you have a magic 8-ball. You ask it a question, it says "Yes." You believe the answer is Yes.
  Now, suppose you get Higher-Order Evidence that the 8-ball is random noise.
  *   **Your Fix:** You believe "Yes" (because the ball said it), but you believe "I shouldn't trust the ball."
  *   **The Objection:** This seems absurd. Once you know the source is unreliable, you can't rationally hold the belief the source produced, even if you can't spot the error in the specific output.

  In your pub quiz case, *you* are the 8-ball. If you know the mechanism (your drunk brain) is faulty, can you really keep the output (the answer) just because it "looks right" internally?

  ### The "Total Evidence" Alternative
  There is a third option you didn't mention, which avoids the split.

  Some philosophers argue you should combine the First-Order and Higher-Order evidence into a **Total Evidence** judgment.
  *   **First Order:** "The logic points to Answer A."
  *   **Higher Order:** "I am drunk."
  *   **Total Evidence:** "It is *probable* that Answer A is correct, but I am not *justified* in being confident."

  This moves you away from "I believe A" to "I suspend judgment on A, leaning slightly toward A." This avoids akrasia because you no longer believe $P$ fully; you just think $P$ is *likely*. This dissolves the tension but demands you be less certain than your gut wants to be.

  ### Verdict on your Essay Idea
  You have stumbled onto a live wire in modern philosophy. Your intuition that "lowering confidence creates a split state" is the exact argument David Christensen makes in his paper *"Does Reasoning Know What It Is Doing?"*

  **If you write this essay:**
  1.  **Keep the Pub Quiz Story:** It's a perfect concrete example of "defeaters" (evidence that defeats justification).
  2.  **Define the Tension:** Clearly state the conflict between "My logic looks sound" vs. "I am unreliable."
  3.  **Present your Fix:** Argue for Level-Splitting (that the two beliefs are distinct).
  4.  **Steel-man the Opposition:** Acknowledge the "Self-Defeat" objection. If I know I'm untrustworthy, why listen to me?
  5.  **Your Conclusion:** You might argue that in cases of *partial* impairment (like a few pints), Level-Splitting is the only honest way to handle it. You aren't totally broken (like the magic 8-ball), just noisy. Therefore, keeping the belief while tagging it with a "warning label" (the HOE) is the most rational human response.

  **Reading Recommendations (if you want to dive deeper):**
  *   **David Christensen:** *"Disagreement as Evidence"* or *"Epistemic Akrasia"* (He is the champion of the view that akrasia is sometimes rational).
  *   **Sophie Horowitz:** *"Epistemic Akrasia and Epistemic Reasons"* (She argues against Christensen, saying akrasia is always irrational).
  *   **Gideon Rosen:** *"Skepticism about Moral Responsibility"* (Touches on similar issues regarding capacity).

  **Summary:** You haven't just given the problem a new name; you've independently derived a position that professional epistemologists are currently publishing papers arguing about. Your "fix" is the **Level-Splitting View**, and while it has critics, it is a legitimate, defensible solution to the problem of Higher-Order Evidence. Go finish that essay.
