prompt: |-
  Ok so this has been rattling around in my head for like 2 weeks now and I finally sat down and tried to get my thoughts in order, kind of like the start of an essay I might actually finish one day. None of my friends are into this kind of stuff so I figured I'd run it by you instead. Backstory: at a pub quiz a while back, me and my mate got a question wrong that I was 100% sure we had right - even now, looking back, the actual chain of reasoning I used still seems totally solid to me. My mate, who's normally way better at this stuff than me, was already telling me in the moment he thought I was wrong, and on top of that we'd both had a few pints, and I distinctly remember thinking "I know for a fact being a bit drunk makes you overconfident about stuff like this" - and I still didn't budge an inch. Afterwards I went down a google rabbit hole and found out theres apparently a whole area of philosophy about this, something to do with "higher order evidence," and a term, "epistemic akrasia," which as far as I can tell means believing something while also believing you shouldn't trust yourself on it.

  Here's the bit I can't shake. It seems like the rational move, once you get evidence your reasoning is compromised (a mate doubting you, being drunk, whatever), is to lower your confidence even if you personally can't spot an actual mistake in the reasoning - otherwise the higher order evidence isn't really doing anything at all. But if you do lower it, you land in this split state where your gut, first-order reasoning still says the answer's right, while you also believe you shouldn't be trusting that gut reasoning right now. That feels almost self-undermining, like believing something is true while also believing you have no business believing it. My half-baked fix is that believing something (call it P, since that's what the articles I found kept calling it) and believing that my belief in P is trustworthy right now are just two separate things that usually travel together but don't have to, and it's not automatically irrational for them to peel apart in exactly these higher-order-evidence type cases - but I honestly can't tell if thats an actual solution or if I've just given the problem a new name. Could you look this over and tell me: is this a real recognized problem in philosophy with a name/standard answer I should know about, does my little fix hold up or is it just wordplay, and is there some obvious counterexample or thought experiment that would blow the whole thing up?
