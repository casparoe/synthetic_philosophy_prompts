answer: |-
  **Setting:** *A quiet corner of a university library café. Rain streaks the windows. Two philosophers, RON (Resource Egalitarian, channeling Ronald Dworkin) and ELENA (Capability Theorist, channeling Amartya Sen and Martha Nussbaum), are surrounded by stacks of papers.*

  **RON:** Look, the intuition is simple, Elena. If we want to treat people as equals, we must distinguish between their *circumstances* and their *choices*. Circumstances are luck; choices are responsibility. My theory of equality of resources does exactly that. It compensates for brute bad luck—like being born with a disability—but it holds people accountable for their ambitions, like cultivating a taste for vintage Bordeaux.

  **ELENA:** It's elegant, Ron, I'll give you that. But elegance isn't truth. You're saying resources are the "currency" of justice. But resources are inert. A wheelchair is a resource. A ramp is a resource. But if I'm paralyzed and the city has no ramps, giving me a wheelchair doesn't give me the *capability* to leave my house. You're measuring the inputs, not the freedom to live.

  **RON:** That's why we have the hypothetical insurance market. We don't just hand out wheelchairs. We ask: behind a veil of ignorance, where you know the general risks of society but not your own specific endowments, how much insurance would a prudent average person buy against becoming disabled? The payout from that hypothetical scheme determines the real-world transfer. That respects the resource metric while acknowledging the cost of the disability.

  **ELENA:** And there's the first crack in the dam. "How much insurance would a prudent person buy?" That question is radically indeterminate. To answer it, I have to know what that prudent person thinks a *life worth living* looks like. I have to know what functionings they value.

  **RON:** Not necessarily. They are insuring against a loss of *opportunity*. They know that being disabled generally requires more resources to access the same opportunities as the able-bodied.

  **ELENA:** But "same opportunities" is doing all the heavy lifting there! If the prudent person thinks, "Well, if I'm blind, I just need enough money for a cane," the payout is low. If they think, "If I'm blind, I need screen readers, guide dogs, and accessible transit to be a participating citizen," the payout is high. The insurance calculation *cannot* be done without first deciding what capabilities society deems essential. You're smuggling the capability list in through the back door of the "prudent insurer."

  **RON:** I'm not smuggling it; I'm democratizing it. The insurance scheme reflects the community's aggregate judgment on the cost of misfortune. But let's stick to the asymmetry, because that's where your view gets messy. Consider the case of the Connoisseur. I have a taste for cheap beer; you have cultivated a taste for rare wine. We have equal resources. I am satisfied; you are miserable because you can't afford your wine on this budget. Do I owe you a transfer?

  **ELENA:** In your framework, no. Because you treat the taste as a choice.

  **RON:** Exactly. It's option luck. You cultivated that taste. If I compensate you, I am effectively taxing my "cheap" preferences to subsidize your "expensive" ones. That violates the ambition-sensitivity constraint. I am penalized for being easy to please.

  **ELENA:** But why is the disability different? The disabled person also has a "metabolic" requirement for more resources to achieve the same level of well-being.

  **RON:** Because the disability is an *endowment*. It's brute luck. The taste is an *ambition*. It's cultivated.

  **ELENA:** Is it that clean? G.A. Cohen hit this hard. He talked about "midfare"—the state of being neither just having the goods nor just the utility, but the *condition* of the person. If I have a disability, my "midfare" is compromised unless I get more resources. But what if my "expensive taste" isn't a frivolous whim? What if I've cultivated a taste for high art or complex philosophy, and engaging with that is a central part of my human functioning?

  **RON:** Then you should have factored that into your life plan given your resources.

  **ELENA:** Or, perhaps, your resource metric is blind to human diversity. You say the disabled person needs more cash to reach the same starting line. I say *everyone* has different conversion factors. The disabled person converts money to mobility at a low rate. The artist converts money to meaningful participation at a low rate if art is expensive. Why is the physical conversion factor a matter of justice, but the psychological or cultural conversion factor a matter of "expensive taste"?

  **RON:** Because if we start compensating for subjective conversion factors, we lose the ability to hold people responsible for anything. If you claim you *need* opera to function, who am I to say you don't? We end up with a bottomless pit of claims. The resource view draws a bright line: We equalize the external means, not the internal capacities to enjoy them. The disability is an external deficit in your bodily endowment. The wine taste is an internal preference.

  **ELENA:** But the insurance move you made earlier undermines that bright line. To calculate the disability payout, you had to assess the *value* of the functioning lost. You had to say, "Being able to move around is worth $X." If you can do that for mobility, why can't you do it for social participation or cultural engagement?

  **RON:** Because mobility is a prerequisite for almost *any* life plan. It's all-purpose means. Expensive tastes are specific life plans. Justice should secure the means, not the ends.

  **ELENA:** And there we have it. The "all-purpose means" argument. But Ron, money isn't all-purpose. It's purpose-specific based on context. Five hundred dollars buys mobility in a city with public transit. It buys nothing in a city without it. So the resource value is *already* dependent on the capability environment.
  And back to the indeterminacy. You accuse my capability list of being arbitrary. "Who decides the capabilities?" you ask. But your insurance scheme is *more* arbitrary. You're asking me to guess a premium for a risk I can't quantify, based on a "prudent person" who doesn't exist. At least with capabilities, I can look at what people actually *do* and *are*. I can observe deprivation. You're observing bank accounts.

  **RON:** I'm observing opportunity sets! And yes, the insurance calculation is hypothetical. It's a device to determine social priority, not an actual actuarial table. But it forces us to be efficient. If you demand a capability list, you invite paternalism. Who puts "religious freedom" or "artistic expression" on the list? If you leave it open, it's vague. If you close it, you're dictating what a good life is. My resource view is neutral. I give you the cash; you decide if you want wine or wheelchairs or prayer books.

  **ELENA:** Neutrality is a myth when the playing field is tilted. If I give a paraplegic and a sprinter equal cash and say "Go run a race," I haven't been neutral. I've privileged the sprinter's biology.
  And let's press the indeterminacy on your side again. You say the prudent insurer determines the payout. But suppose the society is ableist. The "average prudent person" might think, "Eh, if I'm disabled, I'll just stay home. I'll insure for basic care, not full participation." Does that mean justice only requires basic care?

  **RON:** ...That's a risk. That's why the veil of ignorance needs to be thick. They shouldn't know the prevailing prejudices of the society.

  **ELENA:** But they have to know the *prices* in the society to know how much insurance to buy. If they know the prices, they know the prejudices. You can't separate the two.
  This is Cohen's point. The only way to justify a high insurance payout for the disabled is to assume they are entitled to a certain level of *functioning*. If you don't assume that entitlement, the "prudent" choice might be to save the money for something else. So, the entitlement to the functioning precedes the insurance calculation. The insurance is just a pricing mechanism for a capability right you've already assumed.

  **RON:** I'll concede that the *justification* for the insurance relies on a rough idea of human dignity. But the *metric* remains resources. Why does that matter? Because it preserves the distinction between me and my circumstances.
  If I am a wine lover, and you adopt the capability view, you might tax me to subsidize my wine because you decide "aesthetic appreciation" is a central capability. Now you've severed the link between my choices and my costs. I chose to like wine. Why should the beer-drinker pay?

  **ELENA:** And if I adopt the resource view, I might let a disabled person starve because the "prudent insurer" in a rich society decided disability wasn't a high-risk investment.
  Here's the pressure point, Ron. You treat the disability case as a deficit of *means*. I treat it as a restriction of *freedom*.
  If we fix the means but not the environment, the freedom remains restricted. If we fix the capabilities, the means take care of themselves.
  Regarding the expensive tastes: I don't necessarily say subsidize the wine. I say we need to ask *why* the taste is expensive. Is it a snobbish preference? Or is it a genuine human need for beauty that society has priced out of reach? Your theory stops asking at "choice." Mine asks, "Is this a valuable functioning?"

  **RON:** And who asks that question? The state? The philosopher-king?

  **ELENA:** Public reasoning. Democratic debate. Which is messy, yes. But your "hypothetical insurance" is a debate held in a black box with a fictional person. At least my debate is with real people about what they actually value.

  **RON:** But your debate has no stopping rule. When is a capability "enough"?

  **ELENA:** When is a resource bundle "equal"? You have to adjust for prices, for location, for family size... you're adjusting for conversion factors anyway! You just call them "price variations." I call them "human diversity."
  Let's look at the asymmetry again. You compensate the disabled person because they didn't *choose* the disability. You don't compensate the wine lover because they *chose* the taste.
  But what if the wine lover was raised in a culture where wine is the only solvent for social bonding? Is that a choice?
  And what if the disabled person *chooses* not to use the wheelchair you bought them, preferring to crawl? Do you cut them off?

  **RON:** If it's a genuine choice, yes. Because I'm equalizing resources, not functionings. If they choose a cheaper way of living, they keep the surplus. That's the reward for prudence.

  **ELENA:** And that's where we diverge. I think justice is about ensuring people can *be* and *do*. If they can do that with less, great. But if they can't do that with more, the resource metric has failed.
  You're worried about the beer-drinker subsidizing the wine-drinker. I'm worried about the wheelchair-user being told they have "equal resources" while they sit on the curb watching the bus drive by.
  Your insurance scheme tries to bridge that gap, but as we've said, the bridge is built out of capability assumptions.

  **RON:** I think we agree that the insurance scheme isn't perfect. But it's the best we can do without violating personal responsibility. If I compensate you for your expensive tastes, I am treating you like a child who can't manage their own desires. I am saying your preferences are a misfortune, not a part of *you*.

  **ELENA:** And if I don't compensate you for your conversion factors, I am treating you like a machine that converts dollars to welfare at a standard rate. I am ignoring that you are a unique human being with specific barriers.
  You fear paternalism. I fear abandonment.
  The "midfare" is where we live, Ron. It's not the goods, and it's not the happiness. It's the *living*. Your theory measures the fuel. Mine measures the driving. You can have a full tank and nowhere to go.

  **RON:** And you can have a destination in mind but no consensus on how to get there. If we can't agree on the list of capabilities, we have no metric for justice. I'd rather have an imperfect metric of resources than no metric at all.

  **ELENA:** And I'd rather have a messy debate about human freedom than a precise calculation of hypothetical premiums that ignores whether people can actually live their lives.

  **RON:** *Sips cold coffee.* So, we're back to square one. Resources protect responsibility; Capabilities protect diversity.

  **ELENA:** *Smiles faintly.* And the disability case proves we need both, but neither theory can fully swallow the other. The insurance scheme needs a capability list to set the payout. The capability list needs a resource constraint to be feasible.

  **RON:** Then perhaps the argument isn't about which currency is right, but where the exchange rate lies.

  **ELENA:** Just don't ask me to calculate that rate using a hypothetical insurer.

  **RON:** And don't ask me to put "appreciation of fine wine" on a constitutional list of central capabilities.

  **ELENA:** Deal.

  *They sit in silence for a moment, the rain still beating against the glass, the problem of equality unsolved but perhaps a little better understood.*
