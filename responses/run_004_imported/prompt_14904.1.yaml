prompt: |-
  So I'm TAing a history of political thought seminar this semester and we just wrapped up the unit on Aquinas and tyranny — De Regimine Principum, the bit in his Sentences commentary (book II, dist. 44, I think it's q.2 a.2 but don't quote me on the exact article) about whether killing a tyrant counts as sinful sedition, plus the parallel passage in the Summa (II-II q.42, on sedition). What's been bugging a couple of my students, and honestly me too, is how the standard undergrad gloss — "Aquinas was basically fine with tyrannicide" — flattens a position that's actually pretty hedged. He's clearly nervous about private individuals just unilaterally deciding some ruler counts as a tyrant and acting on it, as opposed to the community or some public authority doing the deposing, and there's also that distinction (formalized more by guys like Bartolus later, but at least implicit in Aquinas) between a tyrant by defect of title — basically a usurper — versus a legitimate ruler who becomes tyrannical in how he actually exercises power.

  For a discussion section exercise I want to spring on them something totally anachronistic: would Aquinas think a modern democratic state's intelligence service is justified in drone-striking a foreign dictator (think a Gaddafi-type figure, or hypothetically someone like Kim Jong-un) rather then invading the country or just doing sanctions. Obviously drone warfare, the Westphalian state system, and international law on non-intervention are all things he never had to reckon with, so "well he was ok with killing tyrants so sure" feels too easy to me. I want something that actually engages his framework: does a foreign agency like the CIA count as the kind of "public authority" he thinks removal requires, does the usurper vs. tyrant-by-conduct distinction even make sense applied to something like a hereditary dictatorship, and does his common-good/natural-law apparatus actually cash out into a determinate verdict here or does it just run out of road at some point. Would love your reconstruction of this, staying as close as you can to the actual texts and distinctions rather than the pop-summary version of "Thomistic tyrannicide."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a Teaching Assistant (TA) for a History of Political Thought seminar.
      *   **Topic:** Aquinas on tyranny and tyrannicide (*De Regimine Principum*, *Sentences* Commentary, *Summa Theologiae* II-II q.42).
      *   **Problem:** The standard undergrad gloss ("Aquinas was fine with tyrannicide") is too simplistic. Aquinas is cautious, emphasizing public authority over private initiative and distinguishing between usurpers and legitimate rulers turned tyrannical.
      *   **Task:** Create a discussion section exercise/scenario that applies Aquinas's framework to a modern anachronistic case: A modern democratic state's intelligence service (e.g., CIA) drone-striking a foreign dictator (e.g., Gaddafi, Kim Jong-un).
      *   **Requirements:**
          *   Avoid the easy answer ("He was ok with killing tyrants so sure").
          *   Engage Aquinas's actual framework (public authority, common good, usurper vs. conduct, natural law).
          *   Stay close to the texts/distinctions, not the pop-summary.
          *   Address whether a foreign agency counts as "public authority," the applicability of the usurper/conduct distinction, and whether the natural law apparatus yields a determinate verdict.

  2.  **Deconstruct Aquinas's Position (Mental Retrieval & Verification):**
      *   *De Regimine Principum* (On Kingship): Book I, Chapter 6 is the key text often cited. It argues against private individuals killing tyrants. It suggests public authority should act. If no public authority exists (usurper), it might be permissible, but even then, caution is urged to avoid greater harm.
      *   *Summa Theologiae* II-II, q. 42, a. 2 (Sedition): Sedition is sinful because it opposes the unity of the multitude. However, resisting a tyrant who sows discord is *not* sedition. But who resists?
      *   *Sentences* Commentary (In II Sent., d. 44, q. 2, a. 2): Discusses whether it is lawful to kill a tyrant. He leans towards "no" for private persons, yes for public authority.
      *   *Key Distinctions:*
          1.  **Private vs. Public Authority:** Private killing is generally forbidden (risk of chaos, worse tyrant). Public deposition is preferred.
          2.  **Usurper (Defect of Title) vs. Tyrant by Exercise:** A usurper has no claim. A legitimate ruler who turns bad is harder to remove because they *have* a claim, and removing them might cause greater scandal or harm.
          3.  **The Common Good:** The ultimate metric. Does removing the tyrant serve the common good or cause greater turmoil?
          4.  **Divine Judgment:** Sometimes tyranny is a punishment for sin; humans shouldn't interfere with God's justice unless there's a clear mandate.

  3.  **Evaluate the Modern Scenario against Aquinas's Framework:**
      *   **Scenario:** CIA (foreign intelligence) drone-strikes a foreign dictator.
      *   **Issue 1: Public Authority.** For Aquinas, "public authority" usually means the *internal* authority of the polity being ruled (the nobles, the parliament, the people acting collectively). A *foreign* power is not the "public authority" of the tyrant's subjects. In Aquinas's worldview, kings are accountable to God and perhaps the Emperor/Pope (in a Christendom context), but not to foreign sovereigns in a Westphalian sense.
      *   **Issue 2: Usurper vs. Exercise.**
          *   *Kim Jong-un:* Hereditary. Technically "legitimate" title within his system, but tyrannical exercise.
          *   *Gaddafi:* Came to power via coup. Usurper? Or established ruler over time?
          *   *Aquinas's view:* Usurpers are easier to justify removing. Legitimate rulers turned tyrants are harder.
      *   **Issue 3: The Common Good & Consequences.** Aquinas is a consequentialist regarding the *common good* (though deontological on natural law). Will the drone strike cause more chaos? (Libya post-Gaddafi is a strong counter-argument).
      *   **Issue 4: International Law/Justice.** Aquinas has a theory of Just War (*Summa* II-II, q. 40). Assassination isn't quite war. It's more like execution. Does a foreign state have jurisdiction to execute another state's ruler? In Thomistic terms, jurisdiction is tied to the community.

  4.  **Drafting the Response:**
      *   **Acknowledge the TA's Insight:** Validate that the "standard gloss" is indeed wrong. Aquinas is cautious.
      *   **Structure the Exercise:** Break it down into specific Thomistic hurdles the students must clear.
      *   **Hurdle 1: Jurisdiction/Authority (The "Who" Question).**
          *   Text: *De Regimine* I.6.
          *   Point: Aquinas insists on *publica auctoritas*. Does the CIA count? No, it's a foreign power. For Aquinas, a foreign king killing another king looks like war or murder, not legal deposition.
      *   **Hurdle 2: Title vs. Exercise (The "What" Question).**
          *   Text: *De Regimine* distinctions.
          *   Point: Apply to Kim (hereditary) vs. Gaddafi (coup). Aquinas is more lenient on usurpers. But does foreign intervention change this?
      *   **Hurdle 3: The Common Good/Scandal (The "Why/Result" Question).**
          *   Text: *Summa* on Sedition.
          *   Point: The risk of a worse successor. The "Libya Problem." Aquinas worries about the *perturbatio* (disturbance) of the multitude.
      *   **Hurdle 4: Natural Law & International Order.**
          *   Text: *Summa* on Just War.
          *   Point: Is this an act of war? If so, does it meet *jus ad bellum*? Assassination is generally distinct from battle.
      *   **Conclusion/Verdict:** It's likely Aquinas would say *no*, or at least be deeply skeptical. The foreign element breaks the "public authority" link.
      *   **Pedagogical Tips:** How to run this in section. Socratic questioning.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to make sure I don't just say "Aquinas would hate this." I need to show *why* based on his logic.
      *   *Nuance:* Aquinas does allow for appeal to a "superior" (like the Pope or Emperor in his context). Could the UN be a analogue? Maybe, but the CIA is not the UN.
      *   *Nuance:* The *Sentences* passage specifically mentions that if there is no human recourse, one appeals to God. Private killing is a last resort but dangerous.
      *   *Key Insight:* The core Thomistic principle is that authority is relative to the *community*. A foreign power is not part of that community's hierarchy. Therefore, they lack the *jurisdiction* to execute the ruler, even if the ruler is tyrannical.

  6.  **Final Polish:**
      *   Ensure tone is appropriate for a TA (academic, helpful, nuanced).
      *   Check citations (De Regimine I.6 is the big one, ST II-II q.42 a.2, ST II-II q.40).
      *   Make sure the distinction between "private individual" and "foreign state" is clear. A foreign state isn't a "private individual," but it also isn't the "public authority" of the *subject* community.

  7.  **Output Generation:** (Proceed to write the response following this structure.)
answer: |-
  This is a fantastic pedagogical move. You are absolutely right to be suspicious of the "Aquinas = Proto-Lockean Regime Change" gloss. It ignores the profound conservatism and ecclesiological context of his thought. Aquinas is not advocating for a right of revolution in the modern liberal sense; he is wrestling with how to preserve the *ordo* of the community when the head becomes diseased, without killing the body in the process.

  The anachronistic drone strike scenario is perfect because it forces students to confront the **jurisdictional** limits of Aquinas's theory, not just the moral ones.

  Here is a reconstruction of how Aquinas would likely analyze this, broken down by the specific Thomistic distinctions you mentioned, followed by a suggested structure for your discussion section.

  ### 1. The Authority Problem: *Publica Auctoritas* vs. Foreign Power
  **The Text:** *De Regimine Principum* I.6 and *Summa Theologiae* II-II, q. 42, a. 2.

  **The Thomistic Logic:**
  Aquinas is explicit that a private person (*privata persona*) cannot kill a tyrant. He cites the example of Ehud killing Eglon (Judges 3) but notes this was by "divine instinct," not human law. For human law, the removal must be by **public authority**.

  **The Application:**
  In Aquinas's framework, "public authority" is internal to the polity. It is the nobles, the estates, or the community acting through established procedures to depose a ruler who has violated the pact of rule.
  *   **The CIA/Foreign State:** A foreign intelligence service is not the *publica auctoritas* of the tyrant's subjects. To Aquinas, a foreign king striking another king is not "law enforcement" or "deposition"; it is an act of war or murder.
  *   **Jurisdiction:** Authority is relational. The ruler is the head of *this* body politic. A foreign power stands outside that body. They lack the jurisdiction to execute the "head," even if the head is cancerous. For Aquinas, there is no global "public authority" (unless you stretch to say the Pope or Emperor, but even then, their jurisdiction is spiritual or imperial, not necessarily executive over sovereign kings in the modern sense).
  *   **Verdict:** The CIA fails the authority test. They are, structurally, "private persons" relative to the target state, or hostile combatants, not judges.

  ### 2. The Title vs. Exercise Distinction (*Defectus Tituli* vs. *Exercitium*)
  **The Text:** *De Regimine Principum* I.6.

  **The Thomistic Logic:**
  Aquinas distinguishes between:
  1.  **Usurpers:** Those who seize power without title.
  2.  **Tyrants by Exercise:** Those with legitimate title who rule unjustly.

  He is much more permissive regarding usurpers. If a ruler has no title, the community (or a superior authority) can depose them. If the ruler has a title but rules badly, Aquinas is extremely cautious. He warns that removing a legitimate ruler often leads to greater tyranny or civil strife (*perturbatio*).

  **The Application:**
  *   **Kim Jong-un (Hereditary):** In his own context, he holds *titulus*. He is a tyrant by exercise. Aquinas would be highly skeptical of removal because the title is "legitimate" within that order. Removing him risks the *perturbatio* of the multitude.
  *   **Gaddafi (Coup):** He came to power by force. He is closer to a usurper (*defectus tituli*). Aquinas might be more open to action here *in principle*, **but** only if undertaken by the Libyan people or their recognized superiors, not a foreign drone.
  *   **Verdict:** The distinction matters, but it doesn't save the drone strike. Even if the target is a usurper, the *agent* of removal must still be internal or superior, not external/foreign.

  ### 3. The Common Good and the Risk of Scandal
  **The Text:** *Summa Theologiae* II-II, q. 42, a. 2 (On Sedition).

  **The Thomistic Logic:**
  Sedition is sinful because it opposes the unity of the multitude. However, resisting a tyrant is not sedition *unless* the resistance causes greater harm to the multitude than the tyranny itself. Aquinas is a consequentialist regarding the common good: if removing the tyrant leads to civil war, famine, or a worse tyrant, it is sinful to remove him.

  **The Application:**
  *   **The "Libya Problem":** This is the strongest Thomistic argument against the drone strike. If the strike collapses the state apparatus (as in Libya post-2011), leading to warlordism, migration crises, and greater suffering for the common people, then the act was contrary to the *bonum commune*.
  *   **Intention:** Aquinas cares about the *finis operis* (end of the work). If the drone strike is done for geopolitical stability (US interest) rather than the good of the *subjects* of the tyrant, it fails the charity test.
  *   **Verdict:** Aquinas would demand a high certainty that the successor regime would be better. Given the unpredictability of regime collapse, the presumption is against the strike.

  ### 4. Just War vs. Assassination
  **The Text:** *Summa Theologiae* II-II, q. 40 (On War).

  **The Thomistic Logic:**
  For war to be just, it requires:
  1.  Sovereign authority (*auctoritas principis*).
  2.  Just cause.
  3.  Right intention.

  **The Application:**
  *   **Assassination:** Targeted killing of a specific individual is generally distinct from *bellum* (war) in medieval thought. It looks more like execution. As established in point #1, the foreign power lacks the judicial authority to execute.
  *   **Just War:** If the drone strike is framed as an act of war, does the foreign state have a *just cause*? Self-defense? If the tyrant hasn't attacked the foreign state, there is no just cause for war. Humanitarian intervention is a modern concept; Aquinas does not have a robust theory of "war for the sake of strangers' common good" absent a violation of natural law that impacts the wider Christendom (e.g., piracy, blocking trade, attacking allies).
  *   **Verdict:** It likely fails *jus ad bellum*.

  ---

  ### Discussion Section Plan: "The Thomistic Red Team"

  Here is a way to structure the 50-minute section to walk them through this without lecturing.

  **1. Warm-up (5 mins): The "Standard Gloss"**
  *   Ask: "What's the one-sentence summary of Aquinas on tyrannicide you've seen in secondary lit?"
  *   Write on board: *"Aquinas permits killing tyrants."*
  *   Challenge: "Find the hedge. Where does he say 'Wait, actually, maybe not'?" (Get them to cite *De Regimine* I.6 on the risk of a worse tyrant).

  **2. The Scenario Drop (5 mins)**
  *   Hand out the prompt: *CIA Drone Strike on a Foreign Dictator.*
  *   Ask for a show of hands: "Based on the 'Standard Gloss,' is this Thomistically permissible?" (Most will say yes).
  *   Tell them: "Today you are Thomistic Red Teamers. Your job is to find why Aquinas would say **No**."

  **3. Breakout Groups (20 mins): The Three Hurdles**
  Divide the class into three groups. Each gets one "Hurdle" to analyze using the texts.

  *   **Group 1: The Authority Hurdle (*De Regimine* I.6)**
      *   *Question:* Aquinas says removal requires "public authority." Who is the public authority in North Korea or Libya? Is the US President or the CIA a "public authority" for Libyan citizens?
      *   *Hint:* Think about jurisdiction. Can a judge from France sentence a criminal in Germany?

  *   **Group 2: The Consequence Hurdle (*ST* II-II, q. 42)**
      *   *Question:* Aquinas worries about "sedition" and disturbance of the multitude. If the drone strike causes a power vacuum, civil war, or famine, does the act remain virtuous?
      *   *Hint:* Think about the *bonum commune* of the *subjects*, not the *security* of the US.

  *   **Group 3: The Title Hurdle (*De Regimine* I.6)**
      *   *Question:* Does it matter if the target is a hereditary monarch (Kim) vs. a coup leader (Gaddafi)? How does "defect of title" change the moral math for an *external* actor?
      *   *Hint:* If they are a usurper, does that give *anyone* the right to kill them, or just their own subjects?

  **4. Synthesis & Debate (15 mins)**
  *   Bring groups back together.
  *   **Crucial Pivot:** Ask Group 1: "If the CIA isn't the public authority, who is? The UN? The Pope?" (This exposes the Westphalian gap. Aquinas has no answer for a secular international order).
  *   **Crucial Pivot:** Ask Group 2: "If the strike prevents a nuclear attack (Self-Defense), does Aquinas change his mind?" (This moves it from Tyrannicide to Just War. Does the ruler lose immunity if he threatens others? Aquinas might allow war, but is *targeted killing* permissible in war, or must it be battle?)

  **5. Closing Takeaway (5 mins)**
  *   Summarize: The "Standard Gloss" works for internal deposition by nobles. It breaks down for external intervention.
  *   **The Big Lesson:** Aquinas's political thought is **relational** and **teleological**, not **rights-based**.
      *   *Rights-based:* "The tyrant violated human rights, therefore anyone can stop him."
      *   *Thomistic:* "The tyrant disrupted the order of *this* community; therefore *this* community's authority must restore order, provided it doesn't cause greater disorder."
  *   Final thought: The modern assumption that "Good Guys can kill Bad Guys anywhere" is fundamentally un-Thomistic because it ignores the specific authority relations that make violence lawful rather than sinful.

  ### Why this works for your students
  It stops them from treating Aquinas as a vending machine where you put in "Tyrant" and get out "Permission to Kill." It forces them to see that for Aquinas, **legitimacy is procedural and relational**, not just substantive. A ruler can be substantively evil, but if the *procedure* to remove them is wrong (private/foreign vs. public/internal), the act is sinful.

  This aligns perfectly with your concern about the "flattened" gloss. It shows that Aquinas is less interested in the *outcome* (the tyrant is dead) than in the *order* (was the act consistent with the hierarchy of justice?).
