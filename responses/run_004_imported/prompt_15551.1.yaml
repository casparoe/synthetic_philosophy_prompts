      *   Note on Galileo's answer? Yes.
      *   Follow-up? Yes.
      *   Baronio/Joshua included? Yes.
      *   Demonstration/Parallax/Tides included? Yes.
      *   Augustinian limits included? Yes.
      *   Bellarmine/Foscarini included? Yes.
      *   Tone check: No cartoon villainy. Intellectual sparring.

  6.  **Final Polish (Self-Correction during drafting):**
