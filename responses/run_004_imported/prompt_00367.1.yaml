answer: |-
  You are absolutely right to feel that something is off about this situation. In fact, you have stumbled onto a very famous problem in ethics and psychology. Your intuition is sharper than your friend's "actions have consequences" argument, because that argument ignores the role of chance.

  Here is the vocabulary and the framework you need to explain exactly why this bugs you.

  ### 1. The Concept: "Moral Luck"
  The philosophical term for what you are describing is **Moral Luck**. This occurs when two people make the exact same choice, but their moral standing or punishment is judged differently based on factors outside their control.

  In your scenario, this is specifically **Resultant Luck**. Both drivers took the exact same risk. The only variable that changed was the environment (where the parked car was).
  *   **Your argument:** Moral blame should be attached to the *choice* (texting while driving), not the *outcome* (hitting the car).
  *   **The reality:** Society attaches blame to the *outcome*.

  ### 2. Distinguish "Moral Blame" from "Practical Consequences"
  Your friend said, "Actions have consequences." That is true, but it conflates two different things. You need to separate them to make your point clear.

  *   **Practical Consequences:** These are the financial and legal realities. Kid A hit a car; he (or his parents) has to pay for it. Kid B hit nothing; there is no bill to pay. This part is unavoidable. You can't punish Kid B financially for damage that doesn't exist.
  *   **Moral Judgment/Character:** This is where the unfairness lies. Kid A is being treated like a "reckless idiot" while Kid B is treated like a "safe driver." **This is false.** They were equally reckless. Kid B was just lucky.

  **How to say it:**
  > "I get that the first kid has to pay for the damage. That's just reality. But why do we treat him like a worse *person*? They made the exact same mistake. One got caught by luck, the other didn't. We're judging their character based on a coin flip, not their actual choices."

  ### 3. The Danger of "Outcome Bias"
  Psychologists call what everyone at your school is doing **Outcome Bias**. This is when we evaluate the quality of a decision based on the result rather than the information available at the time the decision was made.

  *   **At the moment of the glance:** Both decisions were 100% identical in quality (bad).
  *   **After the fact:** One looks catastrophic, one looks harmless.

  **Why this matters:** If you only punish the guy who hits something, you teach everyone else that texting while driving is fine *as long as you get lucky.* It creates a false sense of security for Kid B and everyone else. They think, "I looked at my phone and nothing happened, so I'm a good driver." No, you're just a lucky one.

  **How to say it:**
  > "The problem is that by letting the second guy off the hook socially, we're teaching everyone that texting while driving is only bad if you crash. It makes the second guy think he's safe, when he was actually just as dangerous. He got lucky, not skilled."

  ### 4. Why Schools and People Do This (The Counter-Argument)
  To be fair to your friends, there is a reason people react this way, even if it's philosophically flawed.
  *   **Visibility:** No one saw Kid B look at his phone. They saw Kid A hit the car. People react to evidence.
  *   **Tangibility:** It is easier to rally around a victim (the parked car owner) than a potential risk.
  *   **Policy:** Schools often have clauses like "bringing disrepute to the team." An accident report is public record; a glance at a phone is not. The school *can't* punish Kid B because they don't know.

  However, this explains *why* it happens, it doesn't make it *morally right*.

  ### Summary: How to Explain It at Lunch
  Next time your friends bring it up, try saying something like this:

  > "I know it looks like Kid A is the reckless one because he crashed. But imagine you rewind time 100 times. In most of those versions, Kid A doesn't hit the car either. They made the exact same choice.
  >
  > If we only judge people when things go wrong, we're not judging their driving, we're judging their luck. Kid B isn't a better driver; he's just a lucky one. It bugs me because we're letting him think he's safe when he's actually taking the same risk."

  **The Bottom Line:**
  It is reasonable to judge the *consequences* differently (one pays for a bumper, one doesn't). It is **not** reasonable to judge the *character* or *risk* differently. You are identifying a flaw in how humans process risk and fairness. Trust your gut on this one.
