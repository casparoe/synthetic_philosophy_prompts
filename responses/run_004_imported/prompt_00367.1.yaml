prompt: |-
  So this thing happened at my school and it's been bugging me for weeks. Two guys in my grade were both driving home from practice, and both of them looked down at their phone for like two seconds at the same intersection - basically identical amount of carelessness. One of them drifted a little and clipped a parked car, no one hurt but pretty expensive damage. The other guy did the exact same thing, glanced at his phone same amount of time, but nothing happened, he just kept driving like normal. Now the first kid got kicked off the soccer team, his parents grounded him for a month, and people at school kinda act like he's a reckless idiot. The second guy nobody even knows what he did, he's still treated completely normal.

  I brought this up with my friends at lunch bc it felt unfair somehow but one of them said "well he's the one who actually hit something, actions have consequences" which i guess is true but it still feels off to me since they made the literal same choice and the only difference is what happened after was totally out of their control. Like if the wind had blown differently or the other car was parked two feet to the left, it'd be the reverse. Is it actually reasonable to judge these two guys so differently, or is everyone just reacting to bad luck and calling it a character thing? I want to be able to explain why this bugs me instead of just going "idk it feels wrong."
