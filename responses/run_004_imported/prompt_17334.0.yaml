answer: |-
  The tablet lay on the glass table, the screen dimmed to a soft, waiting grey. The consent form was only three pages, but the weight of it pressed against the surface as if it were made of lead. Elias sat with his hands clasped, watching the dust motes dance in the shaft of afternoon light cutting across the room. Outside the window, the city rushed by in a blur of horns and hurried pedestrians, a chaotic stream of single-point perspectives. Everyone down there was inside their own head, trapped in the singular, messy first-person.

  Elias was here to leave that behind.

  The door opened silently. Kael walked in. He moved differently than Elias remembered from their college days. There was no hesitation in his step, no unconscious checking of pockets or glancing at a watch. He sat opposite Elias, folding his hands with a symmetry that felt practiced. Kael had undergone the Dual-View procedure six months ago.

  "You look tired," Kael said. His voice was even, lacking the usual cadence of concern. It was a statement of fact, not an expression of empathy.

  "I haven't been sleeping," Elias admitted. "I keep trying to imagine it. Trying to run the simulation."

  Kael tilted his head slightly. "You can't simulate it, Eli. You know that."

  "I know the theory," Elias said, tapping the edge of the tablet. "I know it's epistemically... I know I can't know what it's like until I'm there. But I need to know if I'll want to come back. That's the clause. Irreversible."

  "There is no coming back," Kael said. "You know that too."

  "I know the contract says that. I need to know if *you* want to come back."

  Kael looked out the window at the street below. "Why would I want to return to the dark?"

  "It's not dark. It's... intimate. It's warm." Elias leaned forward. "When I look at my wife, I want to be lost in her eyes. I want to feel the sting of an argument in my chest. I want the noise. You're telling me that after the procedure, I'll see myself standing there arguing. I'll see her standing there. I'll see the geometry of the conflict. But I won't feel the sting."

  "You'll feel the data," Kael corrected. "The sting is just confusion. It's biological static. The Dual-View clears the static."

  "But the static is where the love is," Elias insisted. "If I'm watching myself love her, am I still loving her? Or am I just observing a subject named Elias who is in love?"

  Kael turned back to him. His eyes were calm, unnervingly so. They didn't dart or flicker. They held Elias's gaze with a steady, optical precision. "You're asking me if you'll still care about her. The answer is yes. But you will care about her differently. You won't be afraid of losing her."

  "I should be afraid," Elias said. "Losing her would be devastating. That fear tells me she matters."

  "Fear tells you your survival is threatened," Kael said. "It doesn't tell you about value. Before the procedure, I thought my anxiety was passion. I thought worrying about my work meant I cared about my work. Now I see I was just vibrating. I work better now. I love my wife better now. I don't waste energy on the vibration."

  Elias felt a cold knot tighten in his stomach. This was the bind. He was asking Kael to validate the things Elias currently valued—passion, fear, the visceral sting of being alive—but Kael was speaking from a place where those things had been reclassified as inefficiencies. Kael wasn't lying. He genuinely believed he loved his wife better. But the metric had changed.

  "Does she miss you?" Elias asked quietly.

  Kael blinked. "Miss me? I'm here. I'm more present than I've ever been."

  "She says you feel distant. Like you're watching her live her life instead of living it with her."

  Kael shrugged, a gesture that seemed purely functional. "She is adjusting. She is still operating in the single stream. She perceives my calm as absence. That is her limitation, not mine."

  "That's what scares me," Elias said. "That I'll look at her, and I'll see her limitation. That I'll look at you, and I'll see why you think I'm small."

  "I don't think you're small," Kael said. "I think you're uncalibrated."

  Elias looked down at the tablet. The screen woke up, sensing his proximity. The signature box pulsed gently. *I acknowledge that the alteration of neural pathways is permanent. I acknowledge that subjective valuation of experience may shift.*

  "If I sign this," Elias said, "the person who signs it isn't the person who wakes up tomorrow. The person who wakes up won't care about the doubts I'm having right now. He'll look at these doubts and see them as symptoms of the problem he just solved."

  "Exactly," Kael said. "So why hold onto them?"

  "Because they're mine," Elias said. "These doubts... they're the structure of who I am. If I remove them, who's left? You say it's better. But 'better' for who? For the new guy. The new guy is happy. I'm not the new guy. I'm the old guy who has to die so the new guy can live."

  Kael leaned forward, mirroring Elias's posture, but the mirroring felt mechanical. "You're treating the self like a object that persists. It doesn't. It's a process. You're just choosing to upgrade the process. Look, Eli. I don't have the anxiety you have. I don't lie awake wondering if I'm enough. I don't feel that crushing weight when I walk into a room. Is that loss? Or is it shedding a weight you've been told is necessary?"

  "It's necessary if I want to feel real," Elias said.

  "Real," Kael repeated. The word seemed to taste strange in his mouth. "You equate suffering with reality. That's a preference. It's not a fact. After the shift, you won't prefer it. You'll wonder why you ever did. You'll look at this moment, at you sweating over this tablet, and you'll feel pity. Not for the risk. But for the confusion."

  Elias picked up the stylus. It felt light, insubstantial. He hovered it over the glass. He tried to project himself forward, to stand in the shoes of the man he would be in twenty-four hours. He tried to imagine looking at his wife and seeing the geometry of her expression rather than feeling the pull of her sadness. He tried to imagine feeling *pity* for his current self.

  He couldn't do it. The simulation failed. It was like trying to imagine a new color, or trying to understand what it was like to be a bat. He could know the mechanics, but he couldn't know the *qualia*. And because he couldn't know the experience, he couldn't know if he would value it. And because the experience would change what he valued, he couldn't trust his current judgment to decide.

  "Does it get lonely?" Elias asked. "Seeing everything from the outside?"

  Kael paused. For the first time, a flicker of something crossed his face. Not emotion, but a processing delay. "Loneliness is a desire for connection that isn't met. When you see the connections clearly, the desire dissolves. So no. It doesn't get lonely. It gets quiet."

  "And you prefer the quiet?"

  "I prefer the truth," Kael said.

  Elias looked out the window again. A couple was arguing on the corner below. He couldn't hear them, but he could see the gestures. The woman's hands were raised, sharp and jagged. The man's shoulders were slumped. From up here, it looked like a dance. A pattern of stress and release. Elias felt a pang of sorrow for them. He felt involved. He wanted to go down there and hug them, or tell them to stop, or just sit with them in the mess of it.

  Kael watched him watching them. "You see the pain," Kael said. "I see the mechanism. Both are true. But only one allows you to fix it."

  "I don't want to fix it," Elias whispered. "I want to witness it."

  "You can't witness what you're drowning in," Kael said.

  Elias looked back at the tablet. The signature box was still pulsing. He thought about his wife. He thought about how she cried when she was happy, how her face crumpled in a way that broke him open. If he underwent the procedure, he would understand why she cried. He would see the neural firing, the hormonal cascade, the historical triggers. He would be able to comfort her with perfect efficiency. He would never feel helpless again.

  But he would never feel helpless.

  He realized then that Kael couldn't answer the question. Kael wasn't withholding the truth; he literally couldn't access the value system Elias was using to ask it. Kael was a vampire swearing that the blood tasted like wine, unable to remember what water tasted like, unable to understand why anyone would prefer it.

  Elias tightened his grip on the stylus. His hand trembled. The tremor was a signal. It was fear. It was uncertainty. It was the noise.

  "If I do this," Elias said, not looking up, "will you still be my friend?"

  "I am here," Kael said. "I will always be here."

  "That's not an answer."

  "It's the only answer that matters."

  Elias lowered the stylus to the glass. The tip hovered a millimeter above the surface. He could feel the heat of his own palm, the pulse in his wrist, the tightness in his throat. He could feel the terror of making a mistake. He could feel the hope that it would all go away.

  He thought about the man he would be tomorrow. That man would look at this trembling hand and see a glitch. That man would sign this form without a second thought. That man would walk out of this room and feel light, unburdened, clear.

  Elias took a breath. The air tasted like dust and old paper. It tasted like now.

  He pressed the stylus down.
