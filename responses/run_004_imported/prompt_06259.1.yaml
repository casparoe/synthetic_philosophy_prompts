answer: |-
  **Title:** Truth, Embedding, and the Cost of the Equation: A Defense of Truth-Conditional Semantics for Indicatives

  **Introduction**

  David Lewis's triviality results present a stark choice for the semantics of indicative conditionals. If we accept that indicative conditionals express propositions with standard truth conditions, and we accept that rational degrees of belief in these propositions obey the Kolmogorov axioms, Lewis proved that one cannot maintain Adams' Thesis (The Equation)—$P(A \to B) = P(B|A)$—in full generality without trivializing the probability function. Faced with this trilemma, the literature has largely bifurcated. On one side stand the non-cognitivists (Adams, Edgington), who preserve the Equation by denying that conditionals express truth-evaluable propositions. On the other stand the truth-conditionalists (Stalnaker, Jackson), who preserve the propositional status of conditionals by restricting or reinterpreting the Equation.

  This paper defends the latter horn. I argue that the cost of abandoning truth conditions is prohibitively high because it renders the logical embedding of conditionals intractable, undermining the role of conditionals in complex reasoning. Conversely, the cost of weakening Adams' Thesis is not merely an ad-hoc surrender to Lewis's proof but follows principled distinctions between *assertibility* and *truth*, and between *learning* a conditional and *conditionalizing* on its antecedent. By retaining a truth-conditional semantics, we preserve the compositional integrity of natural language logic, accepting that the intuitive link between conditional belief and conditional probability is a pragmatic feature of assertion rather than a semantic identity.

  **I. The Embedding Problem: A Structural Cost for Non-Cognitivism**

  The primary motivation for Adams' Thesis is its capture of pre-theoretic intuition: we seem to believe "If A, B" to the exact degree that we believe B given A. However, preserving this intuition requires denying that conditionals have truth conditions. As your professor noted, this invites a Frege-Geach style problem. While often dismissed by non-cognitivists as a formalistic worry, the embedding problem represents a substantive failure to account for the logical behavior of conditionals in natural language.

  The issue is not merely that non-cognitivists must define a new notion of "validity" (such as Adams' probabilistic validity, where the uncertainty of the conclusion cannot exceed the sum of the uncertainties of the premises). The deeper issue is *compositionality*. In a truth-conditional framework, the meaning of a complex sentence is a function of the truth values of its parts. If "If A, B" lacks a truth value, it cannot function as a constituent in truth-functional compounds.

  Consider negation. If I say, "It is not the case that if it rains, the match will be cancelled," what am I denying? For the truth-conditionalist, I am denying that the closest rain-world is a cancellation-world. For the non-cognitivist, the embedded clause "if it rains, the match will be cancelled" is not a claim that can be true or false; it is a conditional assertion. Negating a conditional assertion is semantically opaque. Edgington suggests we treat this as a rejection of the conditional commitment, but this struggles to distinguish between "I deny that (if A, B)" and "If A, not-B." In classical logic, $\neg(A \to B)$ is equivalent to $A \land \neg B$. Without truth conditions, the non-cognitivist loses this equivalence, forcing a divergence between natural language negation and logical negation.

  The problem becomes critical with **iterated conditionals**. Consider the sentence: "If (if A, B), then C."
  For the truth-conditionalist (e.g., Stalnaker), the antecedent is a proposition (the set of worlds where the closest A-world is a B-world). We can then look for the closest world where *that* proposition is true and check if C holds there.
  For the non-cognitivist, the antecedent "if A, B" has no truth value. Therefore, it cannot serve as the condition for the outer conditional. What does it mean to suppose a non-proposition? Edgington attempts to handle this via suppositional degrees of belief, but the machinery becomes increasingly complex and detached from standard logic. We lose the ability to treat conditionals as premises in arguments like Hypothetical Syllogism:
  1. If A, B
  2. If B, C
  3. Therefore, If A, C

  If premises (1) and (2) are not true or false, the argument is not truth-preserving. While Adams' probabilistic validity can show that high confidence in premises transfers to the conclusion, this is a weaker property than validity. It fails to explain why we treat these inferences as *necessary* rather than merely *probable*. The non-cognitivist pays for the Equation by fragmenting the logic of conditionals from the logic of the rest of our language. This is not a cosmetic cost; it is a loss of explanatory power regarding how we reason with conditionals as objects of thought, not just tools for assertion.

  **II. The Truth-Conditional Alternative**

  By contrast, a Stalnakerian semantics treats $A \to B$ as a proposition true at a world $w$ iff $B$ is true at the closest $A$-world to $w$ (denoted $f(w, A)$). This immediately solves the embedding problem. Since $A \to B$ denotes a set of worlds, it can be negated, disjoined, or embedded as an antecedent without semantic residue. The logic of conditionals becomes a sub-logic of propositional modal logic, preserving compositionality.

  However, this view requires us to abandon the universal validity of Adams' Thesis. Lewis's proof demonstrates that for any proposition $A \to B$ defined over a standard probability space, there will be some probability function $P$ such that $P(A \to B) \neq P(B|A)$. To defend this horn of the dilemma, we must show that this divergence is not a bug, but a feature of distinguishing semantics from pragmatics.

  **III. A Principled Rationale for Weakening the Equation**

  Why should we expect $P(A \to B)$ to diverge from $P(B|A)$? If the Equation captures our intuitive usage, is weakening it not merely an ad-hoc surrender to Lewis's theorem? I argue there is a principled rationale for this divergence based on the distinction between **assertibility conditions** and **truth conditions**, and the difference between **learning** and **conditionalizing**.

  **1. Assertibility vs. Truth (The Jackson Strategy)**
  Frank Jackson argued that we should locate the Equation not in the truth conditions of the conditional, but in its *assertibility conditions*. On this view, the truth condition of $A \to B$ is indeed Stalnakerian (the closest A-world is a B-world). However, it is a Gricean norm of conversation that one should not assert a proposition unless it is robust. We assert $A \to B$ only when $P(B|A)$ is high, because asserting a material conditional (or Stalnaker conditional) that is true only because $\neg A$ is highly probable would be misleading.
  This explains the intuitive pull of the Equation without making it a semantic identity. The Equation describes when we *say* conditionals, not what they *mean*. This is principled because it aligns with general pragmatic theories of assertion: we often restrict assertion to propositions that are informative and robust, even if their truth conditions are broader.

  **2. Learning vs. Conditionalizing**
  A deeper, semantic rationale for the failure of the Equation concerns how probability mass shifts when we accept a conditional.
  $P(B|A)$ represents the probability of $B$ *after* we have learned $A$ (conditionalization). This operation eliminates all $\neg A$ worlds and renormalizes.
  $P(A \to B)$ represents the probability that the conditional *is true* now. To learn that $A \to B$ is true (on Stalnaker's account) is to learn that the closest $A$-world is a $B$-world. This eliminates worlds where the closest $A$-world is a $\neg B$-world (i.e., $A \land \neg B$ worlds, roughly speaking), but it *does not* eliminate $\neg A$ worlds.

  Here lies the principled divergence: **Conditionalizing on A and Learning $A \to B$ are different updates to the probability space.**
  *   Conditionalizing on $A$ removes $\neg A$ worlds.
  *   Learning $A \to B$ removes $(A \land \neg B)$ worlds (specifically, those where the selection function picks a $\neg B$ world).

  Because these operations modify the probability space differently, there is no a priori reason to expect the resulting probabilities to be identical across all distributions. Lewis's triviality proof essentially shows that if we insist these two different updates yield the same probability value for all $P$, the space of possibilities collapses.
  Therefore, we should expect the Equation to fail precisely in cases where the distinction between "supposing A" and "asserting if A" matters. For example, in cases where $A$ is highly improbable but the connection between $A$ and $B$ is strong, $P(B|A)$ might be 1, but $P(A \to B)$ might be lower if there is significant uncertainty about the selection function (the "closeness" relation).

  **3. Where the Thesis Fails**
  The triviality proof requires the Equation to hold for *all* probability functions, including those derived by conditionalizing on new evidence. The truth-conditionalist can argue that the Equation holds for our *actual* prior probability function (explaining the intuition) but fails to survive conditionalization.
  Why? Because conditionalizing on new evidence $E$ changes the weights of the worlds. It can change the "closest" A-world without changing the conditional probability $P(B|A)$ in the same proportion.
  This provides a non-ad-hoc prediction: The Equation should hold approximately in ordinary contexts where our probability functions are "rigid" with respect to the selection function, but it should break down in complex epistemic contexts (like those involving iterated conditionals or evidence about the selection function itself). This aligns perfectly with Lewis's result: the Equation cannot be a universal law of probability, but it can remain a reliable heuristic for simple assertions.

  **Conclusion**

  The choice between Adams' Thesis and truth-conditional semantics is a choice between preserving an intuitive probabilistic identity or preserving the logical composability of language. The non-cognitivist solution purchases the Equation at the price of logical fragmentation, rendering negation, disjunction, and iteration semantically problematic. This is a substantive cost that undermines the role of conditionals in reasoning.

  In contrast, preserving truth conditions allows us to integrate conditionals into a unified logic of natural language. The cost—weakening Adams' Thesis—is not a mere concession to Lewis's theorem. It is motivated by the principled distinction between the conditions under which a proposition is true and the conditions under which it is assertible, and by the structural difference between learning a conditional and conditionalizing on an antecedent. We should accept that the Equation is a pragmatic rule of thumb for assertion, not a semantic definition. By doing so, we save the logic of conditionals from triviality without losing the insights that made Adams' Thesis compelling in the first place.
