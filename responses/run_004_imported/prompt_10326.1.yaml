answer: |-
  Good evening. For those who don't know me, I was one of Naomi's graduate students, back when her office still smelled of mimeograph fluid and burnt coffee. Now I'm a science journalist, which means I spend my life translating complex ideas for people who didn't sign up for them. That feels like appropriate training for tonight, because looking around this room, I see we have a distinct split.

  On my left, I see game theorists who can recite the subgame perfect equilibrium of a centipede game in their sleep. On my right, I see Naomi's husband, David, her children, and old friends who have heard her talk about "the centipede" at dinner tables since the Reagan administration, likely assuming it involved insects or perhaps a very confusing board game.

  So, let's bridge the gap. The centipede game is deceptively simple. Two players. A pot of money that grows every round. On your turn, you can either "take" the pot and end the game, or "pass" to the other player, letting the pot grow. If you keep passing, you both get rich. But if the other player takes, you get nothing.

  Standard theory—specifically backward induction—says that two perfectly rational players who *know* they are both rational should never pass. They should take the money on the very first move. Why? Because if you reason backward from the end, you realize trust is mathematically suicidal.

  But as Naomi has spent thirty-five years pointing out, hardly anyone actually does that. In the lab, people pass. They trust. They cooperate. They keep the game going.

  For decades, some of Naomi's colleagues argued this was just a failure of human brains—that we are boundedly rational, too confused to see the logical end. But Naomi argued something far more profound. She argued, alongside thinkers like Pettit and Sugden, that the act of playing past the first round isn't a mistake. It's evidence. If we are still playing in round ten, the assumption that we are cold, rational maximizers must be false. The game itself updates the rules. By continuing to play, we prove that "common knowledge of rationality" never existed in the first place.

  And this, I think, is the secret to Naomi's career, and to the life she shares with David.

  If you look at Naomi's trajectory through the lens of backward induction, she has been wildly irrational. The rational move for a academic in the 1990s might have been to publish the easy papers, secure the endowment, and cash out. The rational move in a marriage might be to protect yourself, to minimize risk, to take the sure sum when it's offered.

  Naomi never took the sure sum. She kept passing. She passed the trust on to the next student, and the next. She passed the patience on to her children. She kept the pot growing, year after year, round after round, well past the point where the theory says she should have stopped.

  Now, I know Naomi is sitting there thinking, "Don't you dare call my life irrational as a compliment." She would object on the merits. And she would be right.

  Because if we apply her own theory to her life, her choices aren't a violation of logic. They are a correction of the initial conditions. The fact that she is standing here after thirty-five years of marriage, and thirty-five years of mentoring, is proof that the "common knowledge of rationality" was never the right model for this room. We are not playing a game of isolated maximization. We are playing a game where the act of continuing changes the value of the pot.

  Her career hasn't been a standing violation of her theory. It has been a running argument with it. She lived the counter-example. She showed us that when you refuse to end the game on move one, you don't lose. You create a new game where trust is the dominant strategy.

  So, to the theorists in the room: Naomi showed us that the equilibrium isn't always where the math says it is.
  And to the family in the room: You already knew that. You've been living in the evidence for decades.

  Naomi, you taught us that the most interesting things happen not when we cash out, but when we pass the turn. Thank you for never stopping the game.

  To Naomi.
