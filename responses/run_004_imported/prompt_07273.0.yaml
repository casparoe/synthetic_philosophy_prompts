      *   *Most Promising for PhD Project:* Focus on the **iteration of the margin-for-error principle**. The argument requires $MFE$ to apply to the knowledge state itself repeatedly. A defender might argue that while $Kp$ requires safety, $KKp$ might not require the *same* margin, or that the "position to know" is not factive in the same way. Or, more standardly, argue that **phenomenal states are luminous** (Cartesian view) and Williamson begs the question by assuming externalism about mental states. If mental states are internally constituted, the "nearby world" where the state differs doesn't exist.

