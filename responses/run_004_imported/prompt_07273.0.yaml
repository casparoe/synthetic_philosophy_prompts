      *   *Connection:* If KK holds, then knowledge is luminous *for the subject*. If I know $p$, then I know that I know $p$. This implies that the condition "knowing $p$" is luminous.
      *   *Williamson's Move:* He argues *no* non-trivial condition is luminous. Therefore, the condition "knowing $p$" is not luminous. Therefore, it's possible to know $p$ without being in a position to know that one knows $p$.
      *   *Nuance:* It's not just that introspection is unreliable (psychological claim). It's that the *structure of knowledge* (safety/margin for error) prevents luminosity.
      *   *The Transfer:* If KK were true, then whenever $Kp$ holds, $KKp$ holds. This means the subject is always in a position to know their epistemic state. But the anti-luminosity argument shows there are borderline cases of *knowing* where one cannot know one knows.
      *   *Specifics:* Consider the series applied to the condition $Kp$. As evidence slowly degrades, there's a point where you stop knowing $p$. But you can't detect that exact point. So there's a case where you know $p$ (just barely) but don't know that you know $p$ (because if you did, you'd have to be safe against nearby error, which you aren't).

