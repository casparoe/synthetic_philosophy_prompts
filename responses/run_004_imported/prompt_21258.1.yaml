answer: |-
  This is one of the most famous and debated questions in the history of political philosophy. You have hit on a tension that scholars have argued about for 700 years.

  To give you an accurate answer, we have to look primarily at two of Aquinas's works: *De Regno* (On Kingship) and the *Summa Theologiae* (specifically the sections on Sedition and Killing).

  Here is how Aquinas would likely analyze your scenario, breaking down the three specific variables you asked about: the origin of power, the identity of the assassin, and the nationality of the plotters.

  ### 1. Legitimate Election vs. Usurpation (Tyrant by Exercise vs. Tyrant by Defect)
  Aquinas makes a crucial distinction between two types of tyrants:
  *   **Tyrant by Defect (Usurper):** Someone who seizes power without any legal or moral right (a coup leader).
  *   **Tyrant by Exercise:** Someone who has a legitimate title to rule but abuses that power (your scenario).

  **Aquinas's Verdict:** The fact that he started as a legitimately elected leader **does change the calculus significantly.**

  In *De Regno*, Aquinas suggests that removing a usurper is much easier to justify. Because they never had legitimate authority, resisting them isn't really "rebellion" against order; it's restoring order.

  However, for a leader who gained power legitimately (through the consent of the people, which Aquinas acknowledges is a valid way to establish authority), Aquinas is much more cautious. He argues that even if the ruler becomes corrupt, the *office* itself remains sacred because it represents the order of the community. To kill him is to attack the structure of law itself.

  While Aquinas believes the community has a right to depose a tyrant who acts against the common good, he views this as a **collective legal action**, not a criminal act against a person. The initial legitimacy makes unilateral violence harder to justify because the ruler still holds the "office," even if they are abusing it.

  ### 2. Random Citizen vs. Public Authority
  This is the most important point in Aquinas's framework. You asked if a "random citizen" would be justified.

  **Aquinas's Verdict:** **No.** A private citizen acting alone is almost never justified in assassinating a ruler, even a tyrant.

  In the *Summa Theologiae* (II-II, Q. 64, Art. 3), Aquinas argues that the power to use lethal force belongs solely to **public authority**. He compares it to a doctor amputating a limb: a random person can't cut off your arm to save your life; only a doctor with proper authority can. Similarly, only the "body politic" acting through its proper mechanisms can remove the head.

  In *De Regno*, Aquinas explicitly warns against private individuals taking it upon themselves to kill tyrants. He points out that this usually leads to greater chaos. If any private citizen can decide a leader is a tyrant and kill them, you invite endless instability, sedition, and the risk that the next ruler will be even worse.

  For Aquinas, the justification for removal must come from a **public process**. In his time, this might mean the nobles, the church, or a representative body of the people acting together. In a modern context, Aquinas would likely look for impeachment, judicial review, or organized, lawful resistance by representatives of the people, not a lone assassin.

  ### 3. Domestic Plotters vs. Foreign Spies
  You asked if it matters if the plot comes from inside the country or from a foreign power.

  **Aquinas's Verdict:** **Yes, it matters immensely.** Foreign intervention is generally unjustifiable in this context.

  Aquinas is a natural law theorist who believes political communities are natural organisms. A foreign power sending spies to kill a leader is not acting as a "public authority" over that community; they are acting as an external aggressor.

  *   **Domestic:** The people (the "multitude") have a relationship with the ruler. If the ruler violates the "contract" of the common good, the multitude (acting publicly, not privately) has the right to depose him.
  *   **Foreign:** A foreign state has no jurisdiction. For Aquinas, foreign assassination is essentially an act of war, not an act of justice. It violates the natural order of sovereignty. Even if the tyrant is evil, Aquinas would likely argue that foreign assassination creates more disorder than it solves, violating the peace between nations.

  ### The "Greater Evil" Warning
  There is one final piece of Aquinas's thought you should know. In *De Regno*, he offers a pragmatic warning that is often overlooked. He argues that sometimes, **enduring a mild tyranny is better than the risks of removing it.**

  He writes that often, when people rise up against a tyrant, the resulting conflict causes more death and suffering than the tyranny itself. Furthermore, the new leader who emerges from the rebellion often becomes paranoid and tyrannical to secure their power, leading to a cycle of worse oppression.

  ### Summary of Aquinas's Position
  If you brought this specific scenario to Aquinas:

  1.  **On the Leader:** He is a tyrant by exercise. He has forfeited his moral right to rule, but he still holds the office.
  2.  **On the Assassin:** A "random citizen" assassinating him is committing a sin (murder/sedition). It is not an act of justice because the citizen lacks public authority.
  3.  **On the Plotters:** If it is the people acting collectively through a representative body to depose him, that is permissible. If it is a foreign power, that is an act of aggression and is not permissible.

  **The Bottom Line:** Aquinas would likely condemn the assassination. He would argue that the remedy for a tyrant is **public deposition**, not **private execution**. He would urge the citizens to use whatever legal or collective mechanisms remain to remove him lawfully, warning that violence by private individuals usually destroys the rule of law entirely, which is the very thing they are trying to save.

  ***

  *Disclaimer: This is an analysis of 13th-century scholastic philosophy for educational purposes. It does not constitute legal advice or an endorsement of political violence.*
