  4.  **Address Question 2: Random Citizen vs. Public Authority:**
      *   *Aquinas's View:* This is the crux of *Summa Theologiae* II-II, Q. 42, Art. 2 (Sedition) and Q. 64, Art. 3 (Killing).
      *   *Private Individual:* Generally, no. Killing is an act of public authority. A private citizen killing a ruler is usually seen as sedition or murder, even if the ruler is bad, because it undermines the *order* of law itself.
      *   *Exception:* If there is a higher authority to appeal to (like the people collectively or a superior lord), that authority should act, not a lone wolf.
      *   *Conclusion:* A "random citizen" straight-up assassinating him is *not* supported by Aquinas. It needs to be a public act or authorized by a representative body.

  5.  **Address Question 3: Domestic Plotters vs. Foreign Spies:**
      *   *Aquinas's View:* Aquinas values the natural order of communities.
      *   *Foreigners:* Foreign intervention is generally viewed with suspicion. It violates the sovereignty of the political community. In Aquinas's time, the "international community" was Christendom under the Pope/Emperor, but even then, external assassination isn't the go-to.
      *   *Domestic:* The community itself has the right to depose a tyrant (in *De Regno*), but again, it must be done through some mechanism of public authority, not just chaos.
      *   *Conclusion:* Domestic action (by the people/representatives) is more justifiable than foreign assassination, but foreign assassination is almost certainly out under natural law (violates peace/order).

