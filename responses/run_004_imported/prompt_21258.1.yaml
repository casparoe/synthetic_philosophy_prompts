      *   *Key Text:* *De Regno* (On Kingship) and *Summa Theologiae* (specifically II-II, Q. 42 on Sedition and Q. 64 on Killing).
      *   *Core Principle:* Aquinas generally opposes tyranny. He believes government is for the common good. Tyranny is a perversion of this.
      *   *Tyrannicide:* Aquinas is *very* cautious about this. He does not give a blank check for assassination.
      *   *Usurper vs. Legitimate Ruler turned Tyrant:* There is a distinction. A usurper (someone who seizes power without right) can be resisted more easily. A legitimate ruler who becomes tyrannical is trickier.
      *   *Who acts?* Aquinas emphasizes public authority over private initiative. A "random citizen" acting alone is generally problematic (sedition/disorder).
      *   *Foreign Intervention:* Aquinas is a natural law theorist but also respects order. Foreign intervention is generally seen as destabilizing unless there's a higher authority (like the Pope/Emperor in his context, which doesn't apply directly now) or a just war framework.
      *   *The "Lesser Evil" Argument:* Sometimes enduring a mild tyranny is better than the chaos of rebellion which might lead to worse tyranny.

  3.  **Address Question 1: Legitimate Election vs. Coup (Usurpation):**
      *   *Aquinas's View:* In *De Regno*, Aquinas distinguishes between a tyrant by *exercise* (legitimate title, bad rule) and a tyrant by *defect* (usurper, no title).
      *   *Usurper:* Easier to depose. Sometimes killing them is praised (e.g., Ehud in the Bible).
      *   *Legitimate Title turned Bad:* This is the user's scenario. Aquinas is much more hesitant here. Why? Because the authority was originally granted by the community (or God, in his view). Removing them risks greater disorder.
