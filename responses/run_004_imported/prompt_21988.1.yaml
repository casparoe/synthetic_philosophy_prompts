answer: |-
  This is a fascinating problem, and your intuition to apply a physicist's lens to it is apt. In fact, you have inadvertently reconstructed one of the most famous thought experiments in modern political philosophy. The argument that "if every local interaction is voluntary, the resulting global distribution must be just" is precisely the argument made by the libertarian philosopher Robert Nozick in his 1974 book *Anarchy, State, and Utopia*. He used the example of basketball star Wilt Chamberlain to show how a pattern of equality inevitably dissolves through voluntary exchange, and argued that trying to restore the pattern violates liberty.

  However, your suspicion that fairness among people does not work like conservation laws in a closed physical system is also supported by a robust tradition of philosophical thought, most notably by John Rawls and G.A. Cohen.

  To help you think this through without resorting to a bland compromise, we need to examine the premises underlying the "conservation law" analogy. The dispute in your garden turns on three specific questions: the moral status of natural talent, the definition of the system's boundaries, and the purpose of the association itself.

  ### 1. The "Conservation Law" Analogy (Historical Entitlement)
  The members arguing against redistribution are relying on a **historical entitlement theory** of justice. In your physics analogy, they argue that if every local interaction conserves "justice" (i.e., is consensual and non-coercive), the final macroscopic state is valid by definition.

  Under this view, the inequality is legitimate because:
  *   **Just Acquisition:** The initial plots were distributed equally.
  *   **Just Transfer:** Every trade was voluntary.
  *   **Self-Ownership:** Members own their skills and labor. If one member has a "green thumb" (analogous to higher energy or mass in a particle), that advantage is theirs to exploit. To tax the fruits of that skill is to claim partial ownership of the person, which they view as theft.

  If you accept these premises, the chain of consensual exchanges *does* settle the matter. Redistribution would indeed be unjust, akin to violating a conservation law.

  ### 2. The "Initial Conditions" Problem (Moral Arbitrariness)
  However, your second question cuts to the heart of the egalitarian critique: *Does it matter that a few members began already better equipped?*

  In a physics experiment, if you are studying thermal equilibrium, the intrinsic energy of the particles is a given parameter. In political philosophy, specifically in the work of John Rawls and "luck egalitarians" like G.A. Cohen, natural talents and prior knowledge are considered **morally arbitrary**.

  You did not *earn* your innate aptitude for botany any more than you earned your height or your parents' socioeconomic status. The egalitarian argument posits that while you are entitled to the *labor* you exert, the community has a claim on the *rents* generated by scarce, innate talents.
  *   **The Counter-Argument:** The successful gardeners are not just selling labor; they are selling the scarcity value of their superior knowledge. Since that knowledge was unequally distributed at the start (despite equal plots), the resulting inequality reflects "brute luck" rather than "option luck" (risks voluntarily taken).
  *   **Implication:** If the association views itself as a cooperative endeavor to mitigate the effects of brute luck, then the consensual trades *do not* settle the matter. The starting point was not truly equal because "human capital" was excluded from the initial equalization.

  ### 3. System Boundaries and Social Infrastructure
  There is a third angle, perhaps the most pragmatic for a community garden. In physics, we must define the system boundary. Is the informal economy truly a private system operating in a vacuum?

  The successful traders are utilizing the association's formal infrastructure to generate private gain. They rely on:
  *   The collective reputation of the garden (drawing Saturday customers).
  *   The shared water and security.
  *   The trust established by the formal association rules.

  In economic terms, their private gains contain a **positive externality** generated by the collective. If the informal economy creates inequality that threatens the cohesion of the association (e.g., if less successful members feel demoralized and quit, raising fees for the rest), then the "system" is becoming unstable.

  From this perspective, the proposal to pay into the common fund is not "redistribution of theft" but rather a **user fee** or a **rent** paid to the collective infrastructure that made the private gains possible. It acknowledges that the trades were not purely bilateral; they occurred within a social ecosystem that sustains value.

  ### 4. The Teleological Question
  Finally, you must consider the *telos* (purpose) of the association.
  *   **If the goal is Liberty:** The primary good is the freedom to exchange. Then the Nozickian view holds. Inequality is the price of freedom.
  *   **If the goal is Community/Equality:** The primary good is the shared experience and the egalitarian nature of the plot holders. Then the Rawlsian view holds. Inequality is permissible only if it benefits the least advantaged (e.g., if the successful gardeners teach workshops that raise everyone's yield).

  The friction arises because the garden was founded on egalitarian terms (equal plots/fees) but operates with libertarian rules (unrestricted private accumulation). The current dispute is the system correcting for that inconsistency.

  ### Conclusion
  To answer your specific questions:

  1.  **Does the chain of consensual exchanges settle whether the association may redistribute?**
      No. That fact only settles the matter if you presuppose that "justice" is solely about the history of transactions (process) rather than the structure of the outcome (pattern). Since your association was founded on "deliberately egalitarian terms," it implies a commitment to a patterned principle, not just procedural liberty. The consensual trades explain *how* the inequality happened, but they do not justify *why* it should be permanent within an egalitarian framework.

  2.  **Must something further be true of the starting point or trades?**
      Yes. For the inequality to be considered fully just within an egalitarian association, the "starting point" would have needed to account for differences in human capital (knowledge/skill), or the trades would need to include a mechanism that ensures the benefits of superior skill diffuse through the community (e.g., mandatory knowledge sharing).

  3.  **Does it matter that members began better equipped?**
      Yes, significantly. If the inequality stems purely from harder work (weeding more hours), the libertarian argument is stronger. If it stems from prior knowledge (an unearned advantage), the egalitarian argument for redistribution is stronger. In your case, it is likely a mix, but the "knowledge asymmetry" suggests the playing field was not truly level, despite the identical plots.

  **Recommendation for your thinking:**
  Do not view this as a conflict between "theft" and "fairness." View it as a conflict between **individual entitlement** and **institutional integrity**. The association is not a state; it is a voluntary cooperative. The question is not whether the successful gardeners *deserve* their money in the abstract, but whether the accumulation of that money undermines the specific egalitarian terms upon which the cooperative was built.

  If the inequality threatens the participation of the less successful members (causing the "system" to fail), then the collective has a legitimate claim on a portion of the surplus to maintain the stability of the experiment. A contribution to the common fund is less a "tax on success" and more a "maintenance fee for the ecosystem that allowed the success to occur."
