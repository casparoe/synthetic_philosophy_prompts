answer: |-
  **Setting:** *A small, quiet restaurant. The check has been paid, but a ceramic bowl of white rice sits between them, half-empty. Two spoons rest on the table. **Eli** (Epistemicist) and **Sara** (Supervaluationist) are finishing their tea.*

  **Eli:** *(Gesturing to the bowl)* Look at that. There's a fact of the matter about whether that's a heap of rice.

  **Sara:** There's a fact of the matter that it's rice. But a "heap"? That's a semantic artifact, Eli. There are some ways of making the word "heap" precise where that pile counts, and some ways where it doesn't. On the supervaluationist view, the sentence "This is a heap" is neither true nor false. It's indeterminate.

  **Eli:** It's one or the other. You're just conflating *truth* with *knowability*. There is a specific number of grains—say, 412—where 412 is a heap and 411 is not. We just can't know which number it is.

  **Sara:** *(Leans forward, resting her chin on her hand)* That's the part I can't swallow. Think about how we learned the word. Did anyone ever point to 412 grains and say, "This is a heap," and then point to 411 and say, "This is not"?

  **Eli:** No.

  **Sara:** Our usage is messy. We apply "heap" to piles of leaves, piles of clothes, piles of rice. The conditions of application are fuzzy. So, how does that fuzzy usage magically crystallize into a razor-sharp boundary in the world? What *fixes* the cutoff at 412 rather than 413? There's nothing in our linguistic practice that could possibly do that work.

  **Eli:** You're assuming that for a fact to exist, we must have a method to verify it. But look at it this way: Knowledge requires safety. If I claim to know that 412 grains is a heap, I have to be in a position where I couldn't easily be wrong.

  **Sara:** Safety?

  **Eli:** Margin for error. If 412 is the cutoff, then 412 and 413 look identical to the human eye. If I judge 412 is a heap, but in a nearby possible world I'm looking at 411 and judge it's a heap, I've made a mistake. To *know* the cutoff, I'd need to be able to distinguish the cutoff grain from the non-cutoff grain. But I can't. So, the boundary exists—it's fixed by the complex totality of our usage and the physical facts—but it is *necessarily* unknowable. The fuzziness is in our knowledge, not in the world.

  **Sara:** So you're saying the universe conspires to hide the exact number from us? That seems ontologically extravagant. I'd rather say the truth-value is missing. It's not that the boundary is hidden; it's that there is no boundary. The sentence fails to express a proposition.

  **Eli:** But then you have to deal with the logic. If "This is a heap" is neither true nor false, what about "It is definitely a heap"?

  **Sara:** That's true. On every admissible precisification, a large pile is a heap. So "Definitely a heap" is true.

  **Eli:** Okay. So there's a boundary between "Definitely a heap" and "Not definitely a heap." Is *that* boundary sharp?

  **Sara:** *(Pauses, stirring her tea)* Well...

  **Eli:** If it's sharp, then you're an epistemicist about the word "definitely." You're admitting there's a precise point where "definitely" stops applying. But if that boundary is *vague*—if there are borderline cases of "definitely"—then you haven't solved the Sorites. You've just pushed it back one level. You have a second-order Sorites paradox. Where does "definitely" end and "borderline" begin?

  **Sara:** We can iterate the operator. "Definitely definitely..."

  **Eli:** And where does that chain stop? If you say the boundary between "definitely" and "borderline" is itself vague, you're admitting that vagueness is in the world, or in the semantics, but you still haven't explained how a logic works without sharp boundaries somewhere. If you say the boundary is sharp, you've accepted my view for the higher-order predicates. You can't have it both ways. You can't say "There are no sharp boundaries" without drawing a sharp boundary around that claim.

  **Sara:** *(Sighs, looking at the rice)* That's the cost, isn't it? If I want to preserve the intuition that there's no magic number of grains, I have to accept a logic where bivalence fails. I have to accept that some sentences don't map to reality true-or-false. It makes the logic complicated. It makes "validity" a matter of truth-preservation across all models, not just reality.

  **Eli:** And my cost is that I have to tell my grandmother that when she made a sandwich, there was a precise moment where removing one crumb turned it from "a sandwich" into "not a sandwich," and she just couldn't see it. It makes language seem like a precision instrument that we're blind to.

  **Sara:** So, you admit it feels unnatural?

  **Eli:** It feels like I'm positing magic. A sharp boundary fixed by nothing we can access. But the alternative is giving up classical logic. If I accept your view, I have to say that "P or not P" isn't always true. If "This is a heap" is indeterminate, then "Either this is a heap or it isn't" fails. I can't live with that. The law of excluded middle is too useful.

  **Sara:** And I can't live with the idea that meaning is sharper than understanding. If we can't verify it, if it plays no role in our communication, why call it a fact? It makes truth inert.

  *(Silence settles between them. The waiter comes by to clear the table. He hovers over the rice bowl.)*

  **Waiter:** Can I get this scraped for you?

  **Eli & Sara:** *(In unison)* It's a heap.

  *(The waiter takes the bowl. Eli and Sara look at each other.)*

  **Eli:** *(Quietly)* I hate that I have to believe there was a specific grain in there that made the difference. That's the hardest pill. Knowing that the cutoff is there, but treating it as if it doesn't exist in every practical conversation.

  **Sara:** And I hate that I have to tell you that when you said "It's a heap," you didn't actually say anything true. Even though we both knew what you meant. I save the logic of usage, but I lose the logic of truth.

  **Eli:** I save the logic of truth, but I lose the connection to usage.

  **Sara:** *(Picks up her bag)* Same time next week?

  **Eli:** Definitely.

  **Sara:** *(Smiles wryly)* See? Is that word vague?

  **Eli:** Don't start.

  *(They stand up and leave.)*
