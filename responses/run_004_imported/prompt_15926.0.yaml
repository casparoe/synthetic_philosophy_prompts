prompt: |-
  A friend and I spent a long car ride arguing about whether it even makes sense to say that science "gets closer to the truth" over time. It started with something mundane — I claimed current dietary guidelines are closer to the truth than the food pyramid we grew up with, and she pointed out that we'll probably say the same about today's guidelines in thirty years, so what is "closer" even tracking if every stage is just another falsehood on the way to the next one? I brought up Popper's notion of verisimilitude, meant to give a rigorous sense in which one false theory can be objectively nearer the truth than a rival false theory. Looking into it afterward, I found the concept is in worse shape than either of us assumed. Popper's own formal definition was shown, independently, by David Miller and Pavel Tichý in 1974, to have an absurd consequence: as long as two theories are both false, neither can count as closer to the truth than the other. That wrecks exactly the kind of comparison (say, Einstein over Newton) the whole idea was invented to license, and every later repair that appeals to some notion of "similarity to the truth" seems to smuggle in its own arbitrary choices about which respects of resemblance count. Write a short story that dramatizes this problem — setting, characters, and genre are up to you. I don't want a lecture in fictional dress: let the philosophical difficulty emerge from what happens to the characters, and let the ending take a real stance on whether anything survives of the idea that inquiry gets closer to the truth.
reasoning: |-
