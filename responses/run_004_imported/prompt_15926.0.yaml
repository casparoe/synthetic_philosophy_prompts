answer: |-
  The navigation console of the *Inductive* hummed with a sound that Elara had come to dread: the low, oscillating whine of unresolved variance.

  "We're drifting again," Kael said. He didn't look up from his datapad. He was calibrating the atmospheric scrubbers, a task that required less attention than he was giving it. "Sector 4 coordinates don't match the stellar drift."

  Elara tapped the holo-display. The red line of their trajectory wavered against the blue mesh of the star chart. "The Newtonian approximation held for three centuries of spaceflight, Kael. It's only now, near the gravity well, that we need the Relativistic correction."

  "Correction," Kael snorted. "That's a polite word. The Newtonian map was false. It said space was flat. It wasn't. This new map says space is curved. It's probably not exactly that, either. In thirty years, someone will write a paper saying space is crumpled, or folded, or made of string. Why should I trust the ship's life to a map we already know is a lie?"

  "Because it's a *better* lie," Elara snapped. "It gets us closer to the target."

  "Closer to what? The Truth?" Kael finally looked up. His eyes were tired. "You can't measure distance to a destination you've never seen. If Theory A is false, and Theory B is false, logic says they are equally distant from the Truth. Zero equals zero. You're just picking the falsehood that makes you feel safer."

  Elara turned back to the console. She keyed in the command to run a verisimilitude check. It was a standard diagnostic, designed to compare the predictive content of the old navigation model against the new one. The screen flickered.

  **ERROR: CONTENT COMPARISON INVALID.**

  "See?" Kael said, pushing off the wall to float beside her. "The machine knows."

  "It's a glitch," Elara muttered, her fingers flying over the haptic keys. "It's trying to calculate truth-content and falsity-content. Both models are technically false because neither accounts for the quantum fluctuations in the gravity well. Since both have false consequences, the algorithm can't rank them."

  "Miller and Tichý," Kael said softly. "1974. Old Earth history. They proved that if your theory is false, you can't mathematically prove another false theory is closer to the truth without smuggling in arbitrary assumptions about which errors matter more."

  "So we're blind?" Elara's heart hammered. They were approaching the accretion disk. If they miscalculated the trajectory by a fraction of a degree, the *Inductive* would be shredded.

  "We're not blind," Kael said. "We're just honest. We admit we don't know where we are. We should stop."

  "Stopping means drifting into the well. We have to move." Elara stared at the two models on the screen. Model A (Old) was simple, clean, and known to be wrong. Model B (New) was complex, messy, and also known to be wrong. The computer refused to say B was better than A because, strictly logically, both contained false statements.

  But the ship was shaking. The gravity shear was intensifying.

  "It's not about the statements," Elara whispered.

  "What?"

  "The proof," Elara said, her mind racing through the philosophy she'd studied at the Academy. "It assumes truth is a binary switch. True or False. Like a light. But navigation isn't a light. It's a resolution."

  She pulled up the raw data feed. She didn't look at the propositions *Space is Flat* or *Space is Curved*. She looked at the residuals. The gap between prediction and observation.

  "Look," she pointed. "Under Model A, the error margin is five thousand kilometers. Under Model B, the error margin is five hundred."

  "Both are errors," Kael argued, though his voice lacked conviction. "Five hundred kilometers of error is still a lie."

  "But it's a smaller lie," Elara said. "The logic proof fails because it treats all falsehoods as equal. It doesn't account for *precision*."

  "Precision isn't truth," Kael countered. "A broken clock is precise twice a day. A clock that runs slow is precise in its error. How do you know Model B isn't just consistently wrong in a way that happens to look right now?"

  Elara gripped the console. The ship groaned. They were minutes from the insertion point. She realized Kael was right about the logic. She couldn't *prove* Model B was closer to the ultimate nature of reality. She couldn't prove they were progressing toward Capital-T Truth.

  But she could prove that Model B retained the successful structure of Model A while correcting the specific deviation that mattered *here*.

  "It's not about the destination," Elara said, her hand hovering over the engage key. "It's about the structure. Model B includes everything Model A got right, plus it fixes the specific thing that kills us in a gravity well. It preserves the structural invariants."

  "That's an assumption," Kael said. "You're assuming the structure of reality matches the structure of the math."

  "I have to," Elara said. "Because the alternative is that the universe is chaotic noise, and if that's true, we're dead anyway."

  She looked at Kael. "If I switch to Model B, and we survive, does it matter if the theory is technically 'false'?"

  "It matters if we claim it's True," Kael said. "If we claim we've arrived, we stop looking. We stop correcting."

  "I'm not claiming we've arrived." Elara took a breath. "I'm claiming the fog is thinner."

  She engaged Model B.

  The ship lurched. The alarms screamed. The red line on the display swung wildly, then stabilized. The blue mesh of the star chart snapped into alignment with the visual feed outside the viewport. The stars stopped streaking. They hung still, sharp and cold.

  They had made the insertion. They were alive.

  Elara slumped back in her chair. The hum of the engine settled into a steady rhythm.

  "We got lucky," Kael said, though he was already checking the sensors to confirm their position.

  "We didn't," Elara said. "We used a map that had fewer fatal errors than the last one."

  "But it's still a map," Kael insisted. "In thirty years, this model will fail too. Someone will find a place where the math breaks. And then we'll say *that* new map is 'closer.' But if every map is eventually false, what are we getting closer *to*?"

  Elara looked out at the stars. They were beautiful, distant, and utterly indifferent to her geometry.

  "Maybe we aren't getting closer to the Truth," Elara said quietly. "Maybe Truth isn't a place you arrive at. Maybe it's just the limit of the function."

  Kael frowned. "Explain."

  "Asymptote," she said. "We never touch the line. We never hold the perfect Truth. But the gap gets smaller. The errors get less fatal. The resolution gets higher." She tapped the glass of the viewport. "We aren't tracking a destination, Kael. We're tracking clarity. The map will always be false because the map is not the territory. But if the map stops killing us, and lets us go further than the last one... that's not luck."

  Kael was silent for a long time. He looked at the data stream, the tiny, persistent residuals that Model B still couldn't explain. He knew they would be the basis for Model C.

  "So," Kael said finally. "We agree the theory is false."

  "Yes."

  "And we agree it will be replaced."

  "Yes."

  "But we go with it anyway."

  "We go with it," Elara said, "because 'closer' doesn't mean 'true.' It means 'less wrong in a way that matters.'"

  Kael nodded slowly. He didn't look happy—skepticism was a hard habit to break—but he turned back to his console. "Course locked. Proceeding on the new falsehood."

  "Proceeding," Elara confirmed.

  The *Inductive* moved forward into the dark, guided by a lie that worked better than the last one, chasing a truth it would never catch, but knowing, with absolute certainty, that it was no longer where it started.
