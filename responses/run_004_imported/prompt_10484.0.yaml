          *   **Verdict:** **Major Red Flag.** This is a common misunderstanding. For Peirce, it's not *just* consensus (agreement). It's consensus *caused by reality constraining inquiry*. If everyone agreed the earth was flat, Peirce would say they are wrong because reality would eventually force a correction. It's consensus *under ideal conditions*, driven by an external reality.
