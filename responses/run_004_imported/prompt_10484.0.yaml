answer: |-
  You have excellent instincts. That "nagging feeling" you have is correct: while your summary is readable and captures the *vibe* of the difference, it flattens out a philosophical schism that is actually the most important part of the story.

  If you send this as-is, you aren't teaching her something "wrong" per se, but you are reinforcing the exact misconception you were trying to avoid (that pragmatism is just "truth is what feels good").

  Here are the three specific spots where you are smoothing things over too much, particularly regarding Peirce:

  **1. The "Consensus" Trap**
  You wrote: *"...truth is whatever opinion the whole community of investigators would eventually settle on... which once you strip away the jargon is really just consensus by another name."*

  **The Correction:** This is the biggest philosophical risk in your draft. For Peirce, it wasn't just consensus (agreement); it was consensus **forced by reality.**
  Peirce was a realist. He believed there is a real world out there that pushes back against us. If the whole community agreed the earth was flat, Peirce would say they are wrong, because eventually, reality (ships falling off the edge, etc.) would force them to change their minds. His point was that inquiry, if pursued long enough, is *convergent* because reality constrains it. Calling it "just consensus" makes it sound like a democratic vote, which Peirce would hate.

  **2. The "Same Thing" Claim**
  You wrote: *"So really the two of them were saying the same thing..."*

  **The Correction:** They were explicitly **not** saying the same thing. This is the famous twist in the history of pragmatism.
  Peirce was so annoyed by James's more psychological, individualistic take (the "satisfying to you" part) that he actually renamed his own philosophy **"Pragmaticism."** When asked why, Peirce famously wrote that the new name was "ugly enough to be safe from kidnappers." He wanted to protect his logical, scientific version from James's more humanistic, religious version.

  **3. Peirce's Reaction**
  You wrote: *"...and my understanding is Peirce was glad to have James spread it to a wider audience."*

  **The Correction:** Peirce was actually quite critical of James. He felt James had made the doctrine too loose and subjective. While they remained friends, Peirce spent his later years trying to distinguish his "scientific" pragmatism from James's "humanistic" pragmatism.

  ### Suggested Tweaks

  You don't need to rewrite the whole thing, but if you adjust the ending, you'll be philosophically safe. Here is a version of your last half that keeps your voice but fixes the accuracy:

  > "...James took that basic idea and made it famous, except he put it in more personal terms. For him, an idea is true if believing it is useful and satisfying, if it has good 'cash value' for your life.
  >
  > **But here's the twist: Peirce actually didn't think they were saying the same thing. He worried James made it sound too subjective, like 'truth is whatever feels good.' Peirce was so concerned about this that he renamed his own philosophy 'Pragmaticism' to distinguish it from James's version. So while James focused on the individual's life, Peirce was focused on how scientific inquiry gets constrained by reality over time.**"

  ### Why this matters for your friend
  Since your original goal was to counter the idea that "pragmatism is an excuse to believe whatever you want," keeping the Peirce/James distinction clear actually helps your argument.
  *   **James** says: Truth has to work for your life, *but* it also has to align with experience (he wasn't advocating for delusions).
  *   **Peirce** says: Truth is what you can't *help* but believe after investigating reality forever (you can't just choose it).

  By acknowledging they split up, you show that even the founders were worried about the "believe whatever you want" interpretation!

  **Verdict:** Your draft is 85% there and very readable. Just fix the ending to acknowledge the split, and you're good to go.
