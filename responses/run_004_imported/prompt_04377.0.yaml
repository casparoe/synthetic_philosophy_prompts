answer: |-
  **Setting:** *The foyer of a grand opera house. It is intermission, just before the final scene of Act II. The air is thick with the scent of stale perfume and anticipation. Critics ARTHUR and BEATRICE stand near a marble column, clutching flutes of warm champagne.*

  **ARTHUR:** (Gesturing with the program) Ten minutes, Beatrice. In ten minutes, they're going to walk out there, take off those fake Albanian moustaches, and expect us to believe that four years of emotional devastation can be smoothed over with a cadence in C major. It's going to be a disaster.

  **BEATRICE:** A disaster? Or the only honest ending possible?

  **ARTHUR:** Don't start with the irony defense. I'm talking about dramatic integrity. Kerman was right: the music in the second act has dug too deep. When Fiordiligi sang "Per pietà," she wasn't playing a role in a farce. She was exposing a soul in crisis. That aria is tragic. You cannot follow a tragedy with a shrug.

  **BEATRICE:** But life *does* follow tragedy with a shrug, Arthur. That's Williams's point. You're demanding a psychological continuity that the social world doesn't permit. In ten minutes, the masks come off. The men return. The women are shamed. And what happens? They don't kill themselves. They don't flee to a convent. They get married.

  **ARTHUR:** Exactly! They get married. As if nothing happened. That's the incoherence. If the music is true, the plot is a lie. Mozart wrote music that suggests these feelings are absolute, irreversible. To have Fiordiligi accept Guglielmo back five minutes after admitting she betrayed him for Ferrando? It reduces her to a puppet. It makes the profound music of the last hour a decorative lie.

  **BEATRICE:** No, it makes the music a record of what is *suppressed*. You're listening to the reconciliation as if it's happy. Listen to the ensemble. It's not a celebration of love restored; it's a sonic act of sweeping dust under the rug. The "depth" you love in Fiordiligi's aria isn't negated by the ending; it's buried by it. That's the unsettling truth. Social convention *requires* that we ignore the depth of our own betrayals to keep the structure standing.

  **ARTHUR:** (Takes a sharp sip of champagne) That's a clever philosophical pivot, but it fails as theater. If the point is that convention crushes feeling, the audience needs to feel the crushing. Instead, we feel the mechanics. We see Da Ponte's contrivance. When Don Alfonso says "Così fan tutte," he's not revealing a tragic truth about society; he's winking at the audience. He's telling us, "Don't worry, it was just a game." If it was just a game, why did Mozart make us cry in the trio?

  **BEATRICE:** Because the game *hurts*. Williams argues that the gap *is* the meaning. If Mozart had written shallow music for a shallow plot, it would be a pleasant comedy. If he had written a tragic plot for tragic music, it would be *Medea*. But he wrote tragic music for a comic plot. That friction is where the opera lives. When they pair off in the final scene—swapped back to their original partners—it looks like order is restored. But the music carries the memory of the swap. We know Fiordiligi loves Ferrando, and Dorabella loves Guglielmo. They are marrying the wrong men to satisfy the contract.

  **ARTHUR:** But does the drama support that reading? Or does it just collapse? You say we "know" they love the wrong men. The libretto doesn't say that. The staging usually has them hugging their original partners. If the drama doesn't explicitly show the pain of the compromise, it's not a complex truth; it's a botched resolution. Kerman's critique is that Mozart lets the composer override the dramatist. The music says "This matters," and the plot says "This doesn't matter." One of them has to lose.

  **BEATRICE:** Why does one have to lose? Why can't the music be the subconscious and the plot be the conscious behavior? In the final scene, watch Fiordiligi's face. If the soprano is any good, she won't be beaming. She'll be terrified. The "blithe resolution" you despise is actually a mask of civility. You want them to scream. But in their world, in *our* world, screaming gets you exiled. Marrying the man you tested and failed is the price of re-entry into society.

  **ARTHUR:** (Leans in, lowering his voice) But at what cost to the art? If I leave the theater feeling that the last hour of emotional investment was a cheat, Mozart has failed *me*. Art isn't just sociology; it's an experience of truth. If I believe in Fiordiligi's pain during "Per pietà," I cannot believe in her compliance in the sextet. It breaks the spell. It reminds me I'm watching a construct. It turns the sublime into the cynical.

  **BEATRICE:** And if you leave feeling comfortable, if the ending feels "earned" in the way you want, Mozart has lied to you. He would be telling you that love conquers all, that fidelity is easily restored. That's the fairy tale. The "cynicism" you hear is actually the sound of maturity. They are reconciling not because they forgive, but because they have to. The music is serious *because* the plot is frivolous. The seriousness of the music protests the frivolity of the solution.

  **ARTHUR:** But the protest is inaudible to half the house! They'll hear the major key and clap. They'll miss the tragedy you're describing. A work of art cannot rely on the audience ignoring its own surface to find its meaning. If the plot resolves farcically, the drama is farcical. The music becomes an ornament, however beautiful. It's like putting a Requiem mass at the end of a sitcom.

  **BEATRICE:** Is it a Requiem? Or is it a wedding march played at a funeral? Think about the final chorus. "Fortunato l'uom che prende." "Happy is the man who takes things as they come." It's advice to accept the lie. You call it incoherent; I call it a diagnosis. You want the characters to act on their emotions. I'm telling you the opera proves they *can't*. That's the "unsetting truth" Williams talks about. We are not free agents. We are creatures of convention.

  **ARTHUR:** (Pauses, looking at the stage door) If you're right, then Mozart is a cynic. He's saying human feeling is irrelevant.

  **BEATRICE:** No. He's saying human feeling is irrelevant *to the survival of the social order*. There's a difference. The music validates the feeling; the plot validates the survival. Both are true. That's why it hurts.

  **ARTHUR:** It hurts because it's bad dramaturgy, Beatrice. It's a fracture. In ten minutes, when they sing that final ensemble, I'm going to hear Mozart apologizing for having to finish the piece.

  **BEATRICE:** And I'm going to hear him forcing us to sit through the lie without looking away. If you look at Fiordiligi and see a puppet, that's your refusal to see the strings.

  **ARTHUR:** (Straightening his jacket) The strings are visible. That's the problem.

  **BEATRICE:** (Smiling faintly) Then why are you still here? Why didn't you leave after "Per pietà"?

  **ARTHUR:** (Stares at her, then at his watch) Because I need to see if he can pull it off. Even if he shouldn't have tried.

  **BEATRICE:** Precisely. The mismatch is the drama.

  *(The bell rings, sharp and commanding. The crowd begins to surge back toward the auditorium.)*

  **ARTHUR:** We'll see if the C major holds.

  **BEATRICE:** We'll see if you can bear to hear it.

  *(They turn and walk back into the dark, the argument suspended but unresolved, as the overture to the final scene begins to swell.)*
