answer: |-
  **The Physics of Fortune: Adjudicating Kelly, Samuelson, and Ergodicity**

  The Kelly criterion occupies a unique space in decision theory, straddling the line between a mathematical theorem and a philosophy of life. It prescribes sizing bets to maximize the expected logarithm of wealth, a strategy that guarantees asymptotic dominance over any other fixed strategy in repeated multiplicative games. To its proponents, this is not merely a prudent policy but the objectively rational approach to risk. To its critics, most notably Paul Samuelson, this claim is a fallacy that smuggles a specific utility function (logarithmic) into a argument claiming to be preference-free. Recently, a new defense grounded in "ergodicity economics" has emerged, arguing that the divergence between time averages and ensemble averages in multiplicative processes makes geometric maximization a physical necessity rather than a psychological preference. This essay adjudicates this dispute. It argues that while ergodicity economics successfully refutes Samuelson's claim that Kelly relies on arbitrary psychological assumptions, Samuelson's core objection regarding the agent's horizon and objectives survives. The definite verdict is that geometric rationality is privileged *instrumentally* for agents seeking sustained participation in non-ergodic systems, but it is not privileged *normatively* for all agents independently of their utility functions and time horizons.

  To understand the stakes, one must first grasp the conflicting intuitions. The Kelly criterion arises from the observation that in repeated betting, wealth compounds. If a bettor wagers too aggressively, a string of losses can deplete capital to a point from which recovery is mathematically impossible (ruin). By maximizing the geometric growth rate, the Kelly bettor avoids ruin and achieves the highest possible wealth in the limit as the number of rounds approaches infinity. Defenders argue this makes Kelly "objective": since everyone prefers more wealth to less, and Kelly produces the most wealth in the long run, everyone should bet Kelly.

  Samuelson dismantled this argument in the 1970s. He pointed out that "in the long run we are all dead." The asymptotic dominance of the Kelly strategy relies on the limit as $N \to \infty$. For any finite horizon, however large, there is a non-zero probability that a Kelly bettor will underperform a bolder bettor. More importantly, Samuelson argued that maximizing expected geometric growth is mathematically equivalent to maximizing expected utility *only if* the agent's utility function is logarithmic. If an agent has linear utility (valuing each dollar equally) or a step-function utility (needing a specific sum for a specific purpose), the Kelly fraction is suboptimal. Samuelson's charge was that Kelly proponents were claiming to derive an "ought" from the mathematics of compounding alone, while silently importing a specific "ought" (log utility) to make the math work.

  The ergodicity argument, championed by physicists like Ole Peters, attempts to bypass Samuelson's utility critique entirely. It posits that standard expected value reasoning commits a category error by conflating ensemble averages with time averages. In an additive process (like winning or losing a fixed dollar amount), the average wealth across a million parallel universes (ensemble) is the same as the average wealth of one person playing a million times (time). Such systems are ergodic. However, in multiplicative processes (investing, betting percentages), the system is non-ergodic. The ensemble average can show exponential growth while the single time-average trajectory goes to zero. Ergodicity economics argues that because an agent lives in one timeline, not a multiverse, the only physically observable quantity is the time-average growth rate. Since the time-average growth rate of wealth is the geometric mean, maximizing it is not a preference; it is a requirement of physical consistency.

  Does this ergodicity defense vanquish Samuelson? It succeeds in neutralizing the charge of circularity regarding utility. Samuelson claimed Kelly implicitly assumes log utility. Ergodicity replies that log utility is not an assumption about human psychology, but a property of the dynamical system governing wealth. If wealth changes multiplicatively, the observable growth rate *is* the logarithm of the wealth ratio. Therefore, an agent maximizing their time-average growth is not "choosing" log utility; they are aligning their expectations with the physical reality of non-ergodic dynamics. In this specific regard, the ergodicity argument is superior: it demonstrates that arithmetic expected value is often physically irrelevant for sequential decision-making. To maximize arithmetic expected wealth in a multiplicative game is to optimize for a parallel universe you will never inhabit.

  However, Samuelson's objection survives in a modified form, rooted in the agent's horizon and the definition of "success." The ergodicity argument derives its force from the assumption of an indefinite or infinite horizon. It argues that over time, the time-average converges to the expected growth rate. But if an agent has a finite horizon, the convergence is not guaranteed. A bettor with a linear utility function who needs to maximize expected wealth for a one-time donation after ten rounds may rationally choose a strategy that risks ruin but offers a higher arithmetic expectation. The ergodicity argument shows that the *process* is non-ergodic, but it does not dictate that the *agent* must care about the long-run rate of the process.

  Furthermore, "wealth" is rarely the terminal good. Agents care about consumption, obligations, or specific thresholds. If an agent needs to double their money to pay a debt or face imprisonment, the Kelly criterion—which prioritizes survival and steady growth—may be too conservative. In this scenario, the "rational" move is to maximize the probability of hitting the threshold, even if it lowers the geometric growth rate. Samuelson was correct that rationality is teleological; it depends on the end goal. Ergodicity corrects the *map* of how wealth moves (showing it is multiplicative, not additive), but it does not choose the *destination*.

  Therefore, the verdict on whether geometric rationality is privileged over arithmetic expected-value reasoning must be conditional. Geometric rationality is not privileged independently of an agent's utility function and horizon. It is, however, privileged *instrumentally* for any agent whose primary objective is to maintain agency and avoid ruin in a multiplicative environment over an indefinite horizon.

  The dispute is best resolved by distinguishing between *physical rationality* and *normative rationality*. Ergodicity economics establishes that geometric growth is the physically correct measure of performance for a single trajectory in a multiplicative world. In this sense, relying on arithmetic expected value is a cognitive error akin to ignoring gravity; it calculates outcomes that cannot physically materialize for the individual agent. Samuelson, conversely, was defending normative rationality: the idea that an agent's choices should reflect their specific constraints and desires.

  If the goal is survival and sustained compounding, the ergodicity argument renders Samuelson's objection moot; there is no "preference" to debate because the alternative leads to extinction. But if the goal is finite-horizon maximization or threshold achievement, Samuelson's objection stands. The Kelly criterion is not a universal law of rational action, but it is a universal law of *survival* in non-ergodic systems.

  In conclusion, the ergodicity intervention transforms the Kelly criterion from a controversial heuristic into a robust description of dynamical reality. It successfully rebuts the claim that Kelly relies on arbitrary psychological assumptions by grounding logarithmic growth in the physics of time averages. Yet, Samuelson's insight remains vital: physics dictates what is possible, but preferences dictate what is desirable. Geometric rationality is privileged only insofar as the agent's utility function aligns with the preservation and growth of capital over time. For the investor seeking to endure, Kelly is objectively rational. For the gambler seeking a specific, finite payout, it is merely one option among many. The synthesis of these views teaches us that while we cannot choose the ergodic properties of the world, we must still choose our relationship to time.
