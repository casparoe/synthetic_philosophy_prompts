prompt: |-
  I've been reading rationalist blogs and forums for long enough that the Dutch book argument for probabilism feels like old news at this point: if your credences violate the axioms of probability, a sufficiently clever bookie can offer you a set of bets that each look individually acceptable by your own lights but that combine into a guaranteed loss, so coherence is required on pain of a sure loss. What I'd never properly chased down, until a friend from my local meetup passed around Richard Pettigrew's SEP entry on epistemic utility arguments, is the "accuracy-first" alternative that keeps getting mentioned as a more purely epistemic rival to the Dutch book story — the line of argument, originating with Jim Joyce's 1998 paper, that you can derive the very same requirement of probabilistic coherence from the goal of accuracy alone, with no bets or bookies anywhere in sight.

  Here's where I get stuck. As I understand it, you measure how accurate a credence function is at a world using some "legitimate" (i.e., strictly proper) scoring rule, with the Brier score as the go-to example, and the theorem says that any credence function violating the probability axioms is accuracy-dominated: there exists a coherent credence function that beats it in every possible world simultaneously, not merely in expectation. That's a considerably stranger and stronger claim than the Dutch book result, and while I can recite it, I don't yet feel why it's true.

  Could you walk me through the underlying intuition — ideally via the geometric picture involving convex sets and projections (I gather this is how the later Predd et al. proof cleans up Joyce's original argument) — for why incoherent credences always end up dominated in this way? I'm especially interested in what concretely breaks in the argument if the scoring rule is merely proper rather than strictly proper, or if you tried to run the same argument with a rule that isn't proper at all, like plain absolute error. I'd like to actually come away seeing why incoherence has to be dominated, rather than just trusting the citation.
reasoning: |-
  Here's a thinking process that leads to the explanation of the accuracy-first argument for probabilism:

  1.  **Deconstruct the User's Request:**
      *   **Background:** Familiar with rationalist blogs/forums, knows the Dutch Book argument well (pragmatic justification).
      *   **Topic:** Epistemic Utility Theory / Accuracy-First Epistemology (Jim Joyce, Richard Pettigrew).
      *   **Core Question:** Why does probabilistic incoherence imply accuracy domination? Specifically, wants the *geometric intuition* (convex sets, projections) found in Predd et al. (2009).
      *   **Specific Sub-questions:**
          *   Why does incoherence lead to domination?
          *   What breaks if the scoring rule is merely *proper* vs. *strictly proper*?
          *   What breaks if the scoring rule is *improper* (e.g., absolute error)?
      *   **Goal:** Move from "reciting the theorem" to "seeing why it has to be true."

  2.  **Initial Brainstorming & Structuring:**
      *   I need to start by setting up the formal framework briefly (worlds, credence functions, scoring rules) but quickly move to the geometry.
      *   The core geometric insight is that coherent credences form a convex set (a simplex), and incoherent credences lie outside this set.
      *   Strictly proper scoring rules define a notion of "distance" (Bregman divergence) such that the expected score is minimized at the true probability.
      *   The "Domination Theorem" relies on the Separating Hyperplane Theorem or simple projection geometry.
      *   I need to explain *why* the geometry works: The incoherent point is "further away" from every truth vertex than some coherent point is.
      *   I need to address the "strictly proper" vs. "proper" vs. "improper" distinction carefully. This is crucial for the user's specific curiosity.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the shift from pragmatic (Dutch Book) to epistemic (Accuracy). Validate their intuition that the geometric proof is the key to "seeing" it.

      *   **The Setup (Simplified):**
          *   Finite set of worlds/outcomes ($W$).
          *   Credence function $c$ assigns numbers to propositions (or worlds).
          *   Truth values are represented as "omniscient" credence functions (vertices of a simplex).
          *   Scoring rule $S(c, w)$ measures inaccuracy (lower is better).

      *   **The Geometric Picture (The Core):**
          *   *Space:* Represent credence functions as vectors in $\mathbb{R}^n$.
          *   *Coherent Set:* The set of probability functions $\mathcal{P}$ is the convex hull of the possible worlds (the vertices). It's a simplex.
          *   *Incoherent Point:* An incoherent $c$ lies *outside* this simplex.
          *   *Scoring Rules as Distance:* A strictly proper scoring rule (like Brier) acts like a distance metric. Specifically, the score $S(c, w)$ is related to the squared Euclidean distance between $c$ and the vertex representing world $w$.
          *   *The Projection:* If $c$ is outside the simplex, there is a unique point $c^*$ inside the simplex that is "closest" to $c$ (orthogonal projection).
          *   *The Domination:* Because of the geometry of the simplex and the nature of the distance metric, $c^*$ is closer to *every* vertex than $c$ is. Therefore, $c^*$ is more accurate than $c$ at every possible world.
          *   *Visual Analogy:* Imagine a triangle (2 outcomes + 1, or 3 outcomes). Coherent probs are inside/on the triangle. Incoherent is outside. Drop a perpendicular to the nearest face/point. That point is better.

      *   **Why Strictly Proper Matters (The Crucial Nuance):**
          *   *Strictly Proper:* Unique minimum at the true credence. This ensures the "distance" function is strictly convex. It guarantees that moving towards the simplex *strictly* reduces inaccuracy at all vertices.
          *   *Merely Proper:* The minimum might not be unique. You might have a flat region. An incoherent credence might project onto a boundary where the score is equal, not strictly better. So, you get *weak* domination (at least as good, sometimes better) rather than *strong* domination (strictly better at all worlds).
          *   *Improper (e.g., Absolute Error):* The "distance" analogy breaks. The level sets of the scoring function aren't nice convex shapes centered on the truth. You can construct cases where an incoherent credence is actually *closer* to the truth vertex than any coherent one according to that specific metric. The geometric projection argument fails because the "gradient" doesn't point towards the truth in the right way.

      *   **Addressing the "Why" (Intuition Check):**
          *   Why does the projection work? Because the simplex is convex.
          *   Why does the score work? Because strictly proper rules penalize deviation from the truth in a way that aligns with Euclidean geometry (Bregman divergence).
          *   The "Dutch Book" is about money pumps (cycles). The "Accuracy" argument is about being unnecessarily far from the truth in all directions.

      *   **Refining the Explanation of Predd et al. (2009):**
          *   They generalized Joyce. They showed that *any* strictly proper scoring rule generates a Bregman divergence.
          *   The key theorem: If $S$ is strictly proper, then $c$ is probabilistic iff $c$ is not accuracy-dominated.
          *   The geometric proof relies on the fact that the set of coherent credences is closed and convex.

      *   **Addressing Absolute Error:**
          *   Give a concrete example. 1 proposition $A$. Worlds: $A$ true, $A$ false.
          *   Coherent: $p(A) + p(\neg A) = 1$.
          *   Incoherent: $c(A) = 0.5, c(\neg A) = 0.5$ (Wait, that's coherent).
          *   Incoherent: $c(A) = 0.5, c(\neg A) = 0.6$ (Sum = 1.1).
          *   Absolute Error Score: $|c(A) - truth(A)| + |c(\neg A) - truth(\neg A)|$.
          *   Show that sometimes the incoherent one isn't dominated. (Actually, for Absolute Error, probabilism isn't even required for non-domination in some setups, or rather, the domination theorem fails). *Self-Correction:* Be careful here. Absolute error is proper but not *strictly* proper in some contexts, or rather, it doesn't generate the right geometry. Actually, Absolute Error is often cited as *not* eliciting probabilities correctly in the same way. Let's stick to the fact that it doesn't generate a Bregman divergence that supports the projection theorem.
          *   Better example: A scoring rule that rewards extreme confidence regardless of truth (improper). Obviously, incoherence might win.
          *   Better focus: Why Strict Properness is needed for the *projection* to guarantee *strict* improvement at *all* vertices.

  4.  **Review and Refine:**
      *   *Tone:* Intellectual peer-to-peer. Acknowledge their sophistication.
      *   *Clarity:* Use the triangle/simplex analogy heavily. It's the most intuitive hook.
      *   *Accuracy:* Ensure the distinction between weak and strong domination is clear regarding proper vs. strictly proper.
      *   *Check:* Did I answer the specific question about Predd et al.? Yes, focus on the convex geometry and Bregman divergence.

  5.  **Final Polish:** (Mental walk-through of the geometric argument)
      *   Vertices $v_1, ..., v_n$ represent worlds.
      *   Coherent set $\mathcal{P}$ = Convex Hull of $v_i$.
      *   Incoherent $c \notin \mathcal{P}$.
      *   Strictly proper score $S(c, v_i)$ behaves like squared distance $||c - v_i||^2$.
      *   Find $c^* \in \mathcal{P}$ minimizing distance to $c$.
      *   By properties of convex projection, the angle $\angle c c^* v_i$ is obtuse (or right).
      *   By law of cosines, $||c - v_i||^2 > ||c^* - v_i||^2$.
      *   Therefore $c^*$ is more accurate at every $v_i$.
      *   This holds for any Bregman divergence generated by a strictly proper rule.
      *   If not strictly proper, the "distance" isn't strict, so $c^*$ might equal $c$ in score (weak domination).
      *   If improper, the level sets aren't convex around the truth, so the projection doesn't guarantee improvement.

  6.  **Constructing the Output:** (Proceed to write the response following this structure.)
answer: |-
  This is one of the most satisfying transitions to make in formal epistemology. Moving from the Dutch Book argument to the Accuracy Argument feels like switching from a pragmatic warning ("you'll lose money") to a structural diagnosis ("you are geometrically misplaced relative to the truth").

  You are correct that the Predd et al. (2009) proof is the cleanest way to visualize this. It strips away the calculus of Joyce's original 1998 proof and replaces it with convex geometry.

  Here is the walkthrough of the intuition, the geometric picture, and exactly what breaks when you tamper with the scoring rule.

  ### 1. The Geometric Setup

  To see why incoherence implies domination, we need to map credences into a geometric space.

  **The Space of Worlds:**
  Imagine a finite set of possible worlds $W = \{w_1, w_2, ..., w_n\}$. These are mutually exclusive and exhaustive.
  We can represent any credence function $c$ as a vector in $\mathbb{R}^n$, where the $i$-th component is the credence assigned to world $w_i$.

  **The Coherent Set (The Simplex):**
  A credence function is probabilistically coherent if and only if:
  1.  $c(w_i) \geq 0$
  2.  $\sum c(w_i) = 1$

  Geometrically, the set of all coherent credence functions, let's call it $\mathcal{P}$, is the **convex hull** of the "omniscient" credence functions.
  *   An omniscient agent at world $w_1$ assigns 1 to $w_1$ and 0 to everything else. This is the vector $v_1 = (1, 0, ..., 0)$.
  *   There are $n$ such vertices ($v_1$ through $v_n$).
  *   $\mathcal{P}$ is the simplex formed by connecting these vertices. (If $n=3$, $\mathcal{P}$ is a triangle. If $n=2$, it's a line segment).

  **The Incoherent Point:**
  If your credences violate the axioms (e.g., they sum to 1.5, or one is negative), your vector $c$ lies **outside** the simplex $\mathcal{P}$.

  ### 2. Scoring Rules as Distance Metrics

  This is the critical pivot. We need to interpret the "inaccuracy score" $S(c, w)$ geometrically.

  A **strictly proper** scoring rule (like the Brier score) has a specific mathematical property: it generates a **Bregman Divergence**. Without getting bogged down in the calculus, the intuition is that a strictly proper scoring rule measures "distance from the truth" in a way that behaves very much like squared Euclidean distance.

  For the Brier score specifically, the inaccuracy of $c$ at world $w_i$ is exactly the squared Euclidean distance between the point $c$ and the vertex $v_i$:
  $$ \text{Brier}(c, w_i) = ||c - v_i||^2 $$

  For *any* strictly proper scoring rule, the geometry is "distorted" but topologically equivalent to this. The "level sets" of the scoring function (contours of equal inaccuracy) are strictly convex shapes centered on the truth vertex.

  ### 3. The Projection Argument (Why Domination Happens)

  Now we have the stage set:
  1.  You have a set of truth-vertices ($v_1...v_n$).
  2.  You have a "safe zone" of coherence ($\mathcal{P}$), which is a convex shape containing those vertices.
  3.  You are standing at point $c$, which is **outside** $\mathcal{P}$.
  4.  Your "penalty" at any world is determined by your distance from that world's vertex.

  **The Move:**
  Since $\mathcal{P}$ is a closed, convex set and $c$ is outside it, there exists a unique point $c^*$ inside $\mathcal{P}$ that is the **orthogonal projection** of $c$ onto $\mathcal{P}$. Intuitively, $c^*$ is the point in the coherent set closest to you.

  **The Geometry of Domination:**
  Why is $c^*$ more accurate than $c$ at *every* possible world $v_i$?

  Imagine the line segment connecting $c$ and $c^*$. Because $c^*$ is the projection onto a convex set, the angle formed by the path from $c$ to $c^*$ and the path from $c^*$ to any vertex $v_i$ is **obtuse** (or right-angled).

  Visually: The simplex $\mathcal{P}$ "blocks" the view of the vertices from $c$. To get from $c$ to any vertex $v_i$, you must first pass "near" $c^*$.
  By the Law of Cosines (or simple Pythagorean intuition in the Brier case):
  $$ ||c - v_i||^2 = ||c - c^*||^2 + ||c^* - v_i||^2 + \text{positive term} $$
  Because the angle is obtuse, moving from $c$ to $c^*$ reduces the distance to **every** vertex $v_i$ simultaneously.

  Since the scoring rule tracks this distance (monotonically), $c^*$ has a lower (better) score than $c$ at every world $w_i$.
  *   $c$ is incoherent.
  *   $c^*$ is coherent.
  *   $c^*$ is strictly more accurate than $c$ regardless of which world turns out to be actual.

  **The Intuition:** Incoherence isn't just a risk; it's a structural inefficiency. Being outside the simplex means you are "over-committing" or "under-committing" in a way that pushes you away from all possible truth-points simultaneously. Coherence pulls you into the "center of gravity" of the possible truths, which is always safer.

  ### 4. What Breaks if the Rule is Merely Proper?

  A scoring rule is **proper** if you maximize expected accuracy by reporting your true credences. It is **strictly proper** if that is the *unique* way to maximize expected accuracy.

  If the rule is merely proper (not strictly), the "distance" function has flat spots. The level sets of the scoring function are convex, but not *strictly* convex (imagine a square contour instead of a circle).

  **The Geometric Consequence:**
  When you project your incoherent point $c$ onto the coherent set $\mathcal{P}$, you might land on a flat face of the scoring rule's level set.
  In this case, $c^*$ might be **equally** accurate as $c$ at some worlds, rather than strictly more accurate.

  *   **Result:** You get **Weak Domination**. ($c^*$ is at least as accurate as $c$ in all worlds, and strictly more accurate in at least one).
  *   **Why it matters:** Weak domination is philosophically weaker. It allows for the possibility that your incoherent credences are "just as good" as the coherent ones in some scenarios. Strict domination says incoherence is *always* a mistake, full stop. To get the strong normative force Joyce wants, you need strict properness.

  ### 5. What Breaks if the Rule is Improper? (e.g., Absolute Error)

  This is where the argument collapses entirely. Let's look at **Absolute Error** (Linear Scoring Rule): $S(c, w) = -|c(w) - 1|$.

  **The Geometric Breakdown:**
  Improper scoring rules do not generate convex level sets centered on the truth. They often incentivize extremization (reporting 0 or 1 regardless of belief).
  Geometrically, the "gradient" of the score does not point toward the truth vertex in a way that aligns with the convex hull of probabilities.

  **Concrete Counter-Example:**
  Consider 2 worlds, $w_1, w_2$.
  *   Coherent credences lie on the line segment connecting $(1,0)$ and $(0,1)$. Equation: $c_1 + c_2 = 1$.
  *   Consider an incoherent credence $c = (0.5, 0.5)$. Wait, that sums to 1.
  *   Consider incoherent $c = (0.6, 0.6)$. Sum = 1.2.

  Let's use Absolute Distance from truth: $|c_1 - truth_1| + |c_2 - truth_2|$.
  *   **World 1 (Truth is 1,0):**
      *   Incoherent $c=(0.6, 0.6)$ Score: $|0.6 - 1| + |0.6 - 0| = 0.4 + 0.6 = 1.0$.
      *   Coherent $c^*=(0.5, 0.5)$ Score: $|0.5 - 1| + |0.5 - 0| = 0.5 + 0.5 = 1.0$.
      *   (Here they tie).
  *   **World 2 (Truth is 0,1):**
      *   Incoherent $c=(0.6, 0.6)$ Score: $|0.6 - 0| + |0.6 - 1| = 0.6 + 0.4 = 1.0$.
      *   Coherent $c^*=(0.5, 0.5)$ Score: $|0.5 - 0| + |0.5 - 1| = 0.5 + 0.5 = 1.0$.

  In this specific linear case, the incoherent credence isn't dominated; it ties with the coherent one. But we can construct improper rules where the incoherent one **wins**.

  Imagine a scoring rule that rewards you for assigning 1 to the actual world but penalizes you *less* for being confidently wrong if you violate probability axioms in a specific way. If the scoring rule is improper, the "contours" of equal accuracy might be shaped such that the point outside the simplex is actually inside a "better" contour than any point inside the simplex.

  **The Intuition:**
  Strict properness ensures that the "direction of improvement" (the gradient) always points toward the truth vertex.
  *   **Strictly Proper:** The "slope" of the score always leads you into the simplex.
  *   **Improper:** The "slope" might lead you off a cliff. You might be able to improve your score by moving *further* into incoherence (e.g., by becoming more extreme than probability allows). If the scoring rule incentivizes extremization, an incoherent credence of 1.1 might be "more accurate" (by that rule's lights) than a coherent 1.0 when you are right, without enough penalty when you are wrong.

  ### Summary of the Intuition

  1.  **Coherence is Convexity:** Probabilistic coherence defines a convex region (simplex) in credence space. The possible truths are the corners of this region.
  2.  **Accuracy is Distance:** Strictly proper scoring rules measure inaccuracy as a kind of distance from the truth corners.
  3.  **Incoherence is Exterior:** Incoherent credences lie outside this region.
  4.  **Projection is Improvement:** In Euclidean (and Bregman) geometry, if you are outside a convex set, there is always a point inside the set that is closer to *every* corner of the set than you are.
  5.  **Strictness is Key:** If the "distance" metric isn't strictly convex (merely proper), you might only tie. If the metric is distorted (improper), the "closest point" logic fails, and incoherence might actually win.

  The Dutch Book argument says incoherence makes you vulnerable to a predator. The Accuracy argument says incoherence makes you **geometrically inefficient** at tracking the truth, regardless of whether anyone is betting against you. You are literally standing further away from every possible reality than you need to be.
