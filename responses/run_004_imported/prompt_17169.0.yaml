      *   **The Problem:** A specific applicant passed all 3 hurdles (2-1 on each), but *every* committee member voted "No" on at least one hurdle. Therefore, *every* committee member effectively voted "No" on the applicant overall, yet the applicant was approved. This is a classic voting paradox (specifically, the *Ostrogorski Paradox* or a variant of the *Discursive Dilemma*).
      *   **Current Situation:** Lease signing in 2 weeks. Co-op is split (Emergency re-vote vs. Precedent/Rule of Law).
      *   **Task:** Write a short memo to the committee/co-op.
