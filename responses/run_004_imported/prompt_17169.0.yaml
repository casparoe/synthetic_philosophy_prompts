          *   *Option B:* Re-vote/Rescind. (Fixes the "wrong" outcome, but damages trust/reputation and sets a "rules don't matter" precedent).
          *   *Option C:* Negotiated withdrawal. (Offer the applicant a way out without prejudice, perhaps by admitting a procedural confusion).
          *   *Decision:* The most ethical and practical path is usually to honor the commitment *unless* there's a legal out. However, since *no one* on the committee supports them, having them move in is a disaster for community cohesion. But rescinding is legally risky.
