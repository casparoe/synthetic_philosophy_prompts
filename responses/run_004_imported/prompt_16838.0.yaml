          *   The emotional weight: Trusting math over instinct.
      *   **Caveat:** Mention that if she can leave a physical marker (chalk, scuff), the problem collapses. The story needs a reason she can't do that (reset? supernatural? cleaning crew?). I should mention this as a plot hole check.

  7.  **Final Review of the Math:**
      *   Let $\alpha$ be prob of continuing (Straight).
      *   Payoff $U = \alpha(1-\alpha)$. Max at $\alpha = 0.5$.
      *   Probability of being at 1st fork ($P_1$) vs 2nd fork ($P_2$).
