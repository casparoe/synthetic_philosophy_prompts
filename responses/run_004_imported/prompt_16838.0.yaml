      *   Plot Hole Check (Physical markers).

  9.  (Self-Correction during drafting): Make sure to emphasize that she *remembers loops* but not *intra-loop progress*. If she doesn't remember loops either, she can never learn the strategy. The prompt implies she is trying to solve it, so she must retain loop memory. I will clarify this distinction.

