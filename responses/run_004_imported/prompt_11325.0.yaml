answer: |-
  **MEMORANDUM**

  **TO:** Promotion and Tenure Committee
  **FROM:** [Your Name], Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Procedure for Final Deliberation: [Candidate Name]

  As we prepare for our final meeting on November 15, I am writing to outline the procedural path I recommend we take regarding [Candidate Name]'s tenure file. As you know, we face an uncommon but not unprecedented situation: six external referee reports, matched for seniority and expertise, resulting in a 3–3 split. Furthermore, this split correlates perfectly with methodological traditions—three letters from the candidate's own framework and three from a rival paradigm.

  This impasse has generated a substantive philosophical disagreement within our own committee, mirroring the broader epistemological debate between the "Equal Weight" view (Elga) and the "Right Reasons" view (Kelly). One camp argues that the even split among peers is higher-order evidence requiring suspension of judgment. The other argues that our first-order engagement with the text and letters warrants a decisive vote. A third consideration is whether the methodological correlation renders these referees non-peers, suggesting the disagreement is not about quality but about incommensurable priors.

  After careful review of the file and our previous discussions, **I recommend that the committee commission two additional tie-breaking external letters** before rendering a final verdict.

  **Rationale for Recommendation**

  The core difficulty here is not merely that the letters disagree, but *why* they disagree. If the split were random, the Equal Weight view might suggest we simply lack sufficient evidence to vote yes, favoring a delay. If the split were purely about quality regardless of tradition, the Right Reasons view might suggest we vote based on our internal reading. However, the methodological correlation suggests a confounding variable. We cannot determine if the negative letters reflect defects in the work or defects in the referees' ability to evaluate work outside their tradition.

  Commissioning two targeted letters allows us to control for this variable. We will seek referees known for work that bridges these methodological divides or who are recognized authorities in the broader subfield rather than specific camps. This is not an attempt to "shop" for a positive outcome, but to secure evidence that isolates *scholarly quality* from *methodological alignment*. This action respects the gravity of the disagreement without surrendering to skepticism or rushing to judgment.

  **Engagement with Alternative Options**

  I want to address honestly why I am not recommending the other two viable options, as both have strong philosophical and administrative defenses.

  *   **Why not Vote This Cycle?**
      Proponents of voting now (aligning with Kelly's "Right Reasons" view) correctly note that we have read the book and possess the letters. We are capable of forming a judgment. To delay could be seen as failing in our duty to decide. However, voting now carries a significant risk of institutionalizing methodological bias. If our internal vote breaks along the same methodological lines as the external letters, we cannot claim with confidence that the decision was based on the candidate's excellence rather than our own departmental priors. In a tenure case, where the standard is *excellence* rather than *competence*, a decision clouded by this ambiguity is vulnerable to appeal and, more importantly, may be unjust.

  *   **Why not Extend the Clock a Year?**
      Proponents of extension (aligning with Elga's "Equal Weight" view) argue that a 3–3 split among peers is itself evidence that the case is not yet tenure-ready. This is a humane and epistemically humble position. It avoids the risk of a negative vote based on inconclusive data. However, a blanket extension is passive. It assumes time alone will resolve the methodological dispute. Without new data, we risk reconvening in a year with the same 3–3 split and the same methodological deadlock. Extension punishes the candidate with uncertainty without actively improving the committee's ability to evaluate the work. We owe it to the candidate to try to resolve the ambiguity now, rather than simply waiting for it to potentially dissipate.

  **Timeline and Next Steps**

  If the committee agrees to this recommendation at our November 15 meeting, we will proceed as follows:

  1.  **Identification of Referees (By December 1):** The Chair, in consultation with the committee, will identify two scholars with demonstrated capacity to evaluate cross-traditional work. Names will be circulated to the committee for veto/approval to ensure no conflicts.
  2.  **Submission of Materials (By December 10):** The manuscript and a specific prompt asking referees to address the work's contribution to the broader subfield (rather than specific methodological adherence) will be sent.
  3.  **Receipt of Letters (By February 15):** We will request an 8-week turnaround.
  4.  **Final Vote (March 1 Committee Meeting):** We will convene immediately upon receipt of the letters to render a final recommendation to the Dean.

  This path requires more work from all of us, but it best honors our obligation to the candidate, the integrity of the tenure process, and the philosophical rigor of our discipline.

  Please come to the November 15 meeting prepared to discuss this procedural motion.

  Regards,

  [Your Name]
  Chair, P&T Committee
