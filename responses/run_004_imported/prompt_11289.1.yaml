      *   **Characters:** Galen Strawson (son, hard incompatibilist) vs. P.F. Strawson (father, compatibilist). The prompt allows for fictionalized stand-ins, but given the specificity of the "family feud" aspect, using their names (or clear proxies) is better. I will use their names but treat them as philosophical archetypes to allow for dramatic license while respecting their actual arguments.
      *   **Key Arguments to Include:**
