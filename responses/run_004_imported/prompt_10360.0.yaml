answer: |-
  Here is the settlement: **Your friend is substantively right, but you are formally right.** However, since the core of your argument was whether the Discursive Dilemma is "just Condorcet's paradox in a fancier costume" and therefore "nothing new," **you lose the bet.**

  While the mathematical structures are deeply isomorphic (validating your intuition), the Discursive Dilemma identifies a structural problem in collective decision-making that preference cycles cannot capture. It is not a subset of Condorcet; rather, preference aggregation is a special case of judgment aggregation.

  Here is the proper breakdown of why the Dilemma is genuinely distinct, despite sharing the same "impossibility DNA."

  ### 1. The Formal Link (Where You Are Right)
  You are correct that the impossibility theorems are mathematically related. In 2002 and 2004, Christian List and Philip Pettit formalized **Judgment Aggregation (JA)** theory and proved that Arrow's Impossibility Theorem can be derived as a special case of the Judgment Aggregation impossibility result.

  *   **Preference Aggregation (Arrow/Condorcet):** Individuals submit *orderings* of outcomes (e.g., $A > B > C$). The goal is a collective ordering.
  *   **Judgment Aggregation (Discursive Dilemma):** Individuals submit *truth-values* on logically connected propositions (e.g., $P=True, Q=True, \therefore R=True$). The goal is a consistent collective set of judgments.

  Mathematically, you can encode a preference ordering as a set of propositions (e.g., "A is better than B," "B is better than C"). If you do this, the JA framework swallows the Arrow framework whole. So, formally, they belong to the same family of impossibility results regarding the tension between **Individual Rationality**, **Collective Rationality**, and **Democratic Aggregation**.

  If your argument was strictly "Do these theorems share the same underlying logical impossibility structure?" the answer is **yes**.

  ### 2. The Substantive Gap (Where Your Friend Is Right)
  Your claim that the Discursive Dilemma is "just Condorcet" fails because it conflates **intransitivity** (Condorcet) with **logical inconsistency** (Discursive Dilemma).

  *   **Condorcet's Paradox** arises because majority rule can produce cyclic preferences ($A > B$, $B > C$, $C > A$). The collective "wants" are incoherent.
  *   **The Discursive Dilemma** arises because majority rule can produce logically inconsistent beliefs ($P$ is accepted, $Q$ is accepted, but $P \land Q$ is rejected). The collective "beliefs" are incoherent.

  **The Smoking Gun:** You can construct a Discursive Dilemma scenario where **no Condorcet cycle exists.**

  Imagine the three judges from your example again.
  *   **Issue:** Liability ($R$) requires Valid Contract ($P$) AND Breach ($Q$). So $R \iff (P \land Q)$.
  *   **Judge 1:** Yes $P$, Yes $Q$, Yes $R$.
  *   **Judge 2:** Yes $P$, No $Q$, No $R$.
  *   **Judge 3:** No $P$, Yes $Q$, No $R$.

  **Majority Vote:**
  *   $P$: Yes (2-1)
  *   $Q$: Yes (2-1)
  *   $R$: No (1-2)

  **Result:** The collective accepts $P$ and $Q$, but rejects $R$. This violates the logical constraint $R \iff (P \land Q)$.

  Now, look at the **preferences**. Suppose all three judges *agree* on the ranking of outcomes: they all prefer "Correct Liability" over "Incorrect Liability." There is no preference cycle here. Everyone agrees on what the *goal* is. The conflict isn't about what they *want* (preferences); it's about how the *facts* aggregate (judgments).

  Condorcet's paradox requires a conflict in desires (orderings). The Discursive Dilemma can occur even when desires are perfectly aligned, provided there is disagreement on the *premises* that lead to the outcome. This proves the Dilemma is not "just" a preference cycle.

  ### 3. The "New" Insight: Reasons vs. Outcomes
  The reason your friend (the Poli Sci PhD) cares about this is that the Discursive Dilemma introduces a dimension that preference aggregation ignores: **The structure of reasoning.**

  *   **Preference Aggregation** is "black box." It asks: "Which outcome do you want?" It does not ask *why*.
  *   **Judgment Aggregation** is "transparent." It asks: "Do you accept Premise 1? Do you accept Premise 2?"

  The Discursive Dilemma highlights a specific tension between **Premise-Based Voting** (voting on the reasons) and **Conclusion-Based Voting** (voting on the verdict).
  *   If you vote on premises, you ensure logical consistency but might overturn the majority's desired verdict.
  *   If you vote on the conclusion, you respect the majority's verdict but might endorse a decision based on false or rejected premises.

  Preference aggregation (Condorcet/Arrow) literally cannot model this distinction because it has no concept of "premises." It only has "alternatives." Therefore, the Discursive Dilemma reveals a problem about **accountability and reason-giving in democracy** that Condorcet's paradox simply does not address. That makes it conceptually "new."

  ### 4. The Verdict
  You are correct that the *mathematics* of impossibility are isomorphic. If you treat judgment sets as "alternatives," the theorems look the same. In that narrow sense, Arrow "falls out" of Judgment Aggregation.

  However, your conclusion that the Discursive Dilemma is "just Condorcet in a costume" is incorrect for two reasons:
  1.  **Direction of Generalization:** Judgment Aggregation is the *general* theory; Preference Aggregation is the *special* case. Saying JA is "just PA" is like saying "Calculus is just Arithmetic." It misses the expanded scope.
  2.  **Phenomenological Difference:** As shown above, you can have the Discursive Dilemma without a Condorcet cycle. The Dilemma captures logical inconsistency in *beliefs*, not just intransitivity in *desires*.

  **Settlement:**
  Tell your friend she wins on the **substantive** point: The Discursive Dilemma is a different beast because it deals with logical consistency of beliefs and the tension between reasons and outcomes, which preference cycles cannot model.

  Tell her you win on the **formal** point: The impossibility results are mathematically isomorphic, and Judgment Aggregation theory does indeed subsume Arrow's framework.

  But on the core question—"Is it actually anything new?"—the answer is **yes**. It shifted social choice theory from studying "what we want" to studying "what we believe and why," which is a genuinely distinct contribution.
