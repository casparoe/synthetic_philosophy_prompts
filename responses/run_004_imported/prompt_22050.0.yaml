answer: |-
  You are half-right, but the other half is a trap that could undermine the credibility of your piece if a philosophically literate reader (or editor) catches it.

  You are correct that both camps share a **diagnostic premise**: they both reject "pure proceduralism" (the idea that a decision is legitimate *just* because the process was fair, regardless of the outcome). Both epistocrats and epistemic democrats agree that political legitimacy depends, at least in part, on the system's ability to track truth or produce good outcomes (instrumentalism).

  However, your assumption that they sit on the **same spectrum** (with epistemic democracy as a "moderate" version of epistocracy) is philosophically incorrect. They are not different intensities of the same idea; they are **rival hypotheses about how knowledge works in politics.**

  Here is the breakdown of why treating them as a spectrum is a flattening error, and how you should frame it instead.

  ### 1. The Core Disagreement: Individual vs. Collective Intelligence
  *   **Epistocracy (Brennan):** Assumes competence is **individual and hierarchical**. Some people know more than others; therefore, to get the right answer, you must weight the input of the "knowers" more heavily. It views the electorate like a classroom: the teacher (expert) should have more say than the students (novices).
  *   **Epistemic Democracy (Estlund/Landemore):** Assumes competence is **distributed and systemic**. Hélène Landemore, for example, relies on the "Diversity Trumps Ability" theorem. The argument is that because political problems are complex, no single expert (or class of experts) has the cognitive diversity to solve them. You need the *maximum* number of perspectives to unlock the solution.

  **The Trap:** If you frame epistemic democracy as "epistocracy-lite," you imply that epistemic democrats *wish* they could restrict the vote but are holding back for PR reasons. In reality, Landemore and Estlund argue that restricting the vote would **make the system dumber.** To them, universal suffrage isn't a moral concession; it's an epistemic necessity.

  ### 2. The Estlund Objection: "Who Guards the Guardians?"
  David Estlund (in *Democratic Authority*) is the key figure here. He explicitly argues **against** epistocracy, even though he is an epistemic theorist.

  His argument isn't just that voting is a right; it's that we cannot agree on *who* the experts are without triggering reasonable disagreement. If you institute a voting test, the people who design the test will inevitably bias it toward their own views. Therefore, epistocracy fails on its own terms: it claims to produce correct answers, but the mechanism for selecting the rulers is politically contested and unreliable.

  For Estlund, democracy is the only system that is *both* epistemically reliable (better than random) *and* acceptable to all qualified points of view. Epistocracy fails the second test, which undermines the first.

  ### 3. Why This Matters for Your Tech/VC Angle
  This distinction is actually the most interesting part of your story. The "rule by the knowledgeable" chatter in Silicon Valley is almost exclusively **Epistocratic** in the Brennan sense.
  *   **VC Mindset:** Meritocracy is hierarchical. Intelligence is an individual asset. The "founder mode" implies the visionary should have total control.
  *   **The Blind Spot:** Tech culture often underestimates **collective intelligence**. They assume that because a crowd contains many ignorant people, the crowd is ignorant. Epistemic democracy argues the opposite: the crowd is smart *because* it aggregates distributed information that elites miss.

  If you frame epistemic democracy as just "nice epistocracy," you miss the chance to critique the VC worldview using its own logic (efficiency/truth-tracking). You can argue that the VC push for epistocracy might actually be **inefficient** and **error-prone** compared to democratic aggregation.

  ### 4. How to Frame It in Your Piece
  Instead of a spectrum of *commitment*, frame it as a spectrum of **mechanism**.

  *   **Shared Goal:** Both want political decisions to be "correct" (truth-tracking/competent).
  *   **Divergent Mechanism:**
      *   **Epistocracy:** Filter the input (restrict the franchise) to raise average competence.
      *   **Epistemic Democracy:** Widen the input (universal suffrage + deliberation) to maximize cognitive diversity and error-correction.

  **Suggested phrasing for your draft:**
  > "While both epistocrats and epistemic democrats agree that political legitimacy relies on making good decisions rather than just following fair procedures, they are rivals, not cousins. Epistocrats like Jason Brennan argue that we should restrict voting to the competent to avoid error. Epistemic democrats like Hélène Landemore argue that restricting voting *causes* error, because it cuts off the diverse information needed to solve complex problems. The tech world's current fascination with 'rule by the knowledgeable' assumes the former, ignoring the possibility that their own 'meritocratic' filters might be blinding them to the data they need."

  ### Summary
  *   **Are they the same underlying move?** Yes, in that they both prioritize *outcomes* over *pure procedure*.
  *   **Is one a moderate version of the other?** No. They make contradictory empirical claims about how to achieve those outcomes.
  *   **Can you put them on a spectrum?** Only if the spectrum is "How much do you trust individual experts vs. collective systems?" not "How much do you restrict the vote?"

  If you treat them as rivals offering competing technical solutions to the same problem (how to get the right answer), your piece will be much sharper and philosophically bulletproof.
