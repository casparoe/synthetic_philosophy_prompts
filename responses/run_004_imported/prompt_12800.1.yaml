          *   Kant's Rebuttal to Hegel: Moral progress is possible, institutional constraints reduce war, the ideal regulates action even if not fully realized.
          *   Deeper Disagreement: The nature of freedom (negative vs. positive/ethical) and the nature of the state (means vs. end).
      *   **Tone:** High-level philosophical debate, "full strength" arguments, not caricatures.
      *   **Format:** Dialogue.

  2.  **Character Conception:**
