prompt: |-
  I have spent a good deal of time reading about the replication crisis on my own, and there is one recurring point I have never seen explained to my full satisfaction. Among the "questionable research practices" blamed for inflated false-positive rates is optional stopping: monitoring results as data come in and halting collection the moment p drops below 0.05. I can see why this distorts the true error rate under standard frequentist reasoning, since it effectively gives chance repeated opportunities to get lucky. Yet I have also come across the claim that a Bayesian analysis of that very same final dataset would be completely untouched by this practice, on the grounds of the likelihood principle: the idea that all the evidential meaning in data is carried by the likelihood function and does not depend on the stopping rule that produced it. This strikes me as almost too convenient. How can one and the same sequence of observations count as badly biased evidence under one framework, yet as perfectly legitimate evidence under another, apparently just because of the researcher's private intentions about when to stop collecting data? I would like a genuinely careful, mechanistic explanation of what is actually going on here, together with an honest assessment of whether Bayesians' claimed immunity to optional stopping truly holds up, or whether it is more of a theoretical idealization that quietly depends on assumptions practicing researchers rarely satisfy.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Core Issue:** The apparent contradiction between Frequentist and Bayesian views on optional stopping (peeking at data and stopping when $p < 0.05$).
      *   **Frequentist View:** Optional stopping inflates Type I error rates (false positives). It's a "questionable research practice" (QRP).
      *   **Bayesian View:** Often claimed to be immune to optional stopping due to the Likelihood Principle. The evidence in the data is the same regardless of *why* you stopped.
      *   **User's Skepticism:** This seems "too convenient." How can the *same* data be biased in one framework and unbiased in another just based on intentions? Is the Bayesian immunity real or a theoretical idealization?
      *   **Request:** A careful, mechanistic explanation + an honest assessment of whether Bayesian immunity holds up in practice.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Frequentist Logic:* Depends on the sampling distribution of the test statistic under the null hypothesis. The sampling distribution changes if the stopping rule changes (because the sample space includes all possible paths that *could* have been taken).
      *   *Bayesian Logic:* Depends on the posterior distribution, which is proportional to Likelihood $\times$ Prior. The Likelihood Principle states that if the likelihood function is proportional across two experiments, the inference should be the same. Stopping rules usually don't change the likelihood of the observed data (assuming the rule doesn't depend on unobserved parameters in a specific way).
      *   *The Conflict:* Frequentists care about long-run error rates (behavior of the procedure). Bayesians care about belief updating given the specific data (coherence of belief).
      *   *The Catch:* Bayesian immunity isn't absolute. It depends on the prior, the model, and the specific stopping rule. If the stopping rule is informative about the parameter *beyond* the data, it matters. Also, calibration is an issue.

  3.  **Drafting the Explanation - Step-by-Step:**

      *   **Introduction:** Acknowledge the depth of the question. It's a classic and profound issue in statistics philosophy. Validate the user's skepticism ("too convenient" is a common reaction).

      *   **Part 1: The Frequentist Mechanism (Why it breaks):**
          *   Explain the definition of a p-value. It's $P(\text{Data} \ge \text{Observed} | H_0)$.
          *   Crucial point: "Data" includes the *potential* data under the stopping rule.
          *   Analogy: Rolling a die until you get a 6. If you fix $N=1$, $P(6)=1/6$. If you roll until 6, $P(\text{eventually get 6}) = 1$.
          *   In hypothesis testing: Every peek is a chance to cross the threshold. The "sample space" expands to include paths where you would have stopped earlier. This inflates the false positive rate.
          *   Key takeaway: Frequentism evaluates the *procedure*, not just the specific dataset.

      *   **Part 2: The Bayesian Mechanism (Why it claims immunity):**
          *   Bayes' Theorem: $P(H|D) \propto P(D|H) \times P(H)$.
          *   The Likelihood Principle: Inference depends on $P(D|H)$ for the *observed* $D$.
          *   If the stopping rule is "non-informative" (depends only on observed data, not on unknown parameters directly), the likelihood function for the observed data remains the same whether you fixed $N$ or peeked.
          *   Example: 10 heads in 20 tosses vs. 10 heads stopped at 20 tosses. Likelihood is $\theta^{10}(1-\theta)^{10}$ in both cases (ignoring combinatorial constants that cancel in Bayes factors).
          *   Key takeaway: Bayesianism evaluates the *evidence in the specific data*, not the long-run behavior of the collector.

      *   **Part 3: Reconciling the Contradiction (The "Intentions" Problem):**
          *   Address the user's specific worry: "How can intentions matter?"
          *   Frequentist: Intentions define the sampling plan, which defines the null distribution.
          *   Bayesian: Intentions are irrelevant *unless* they convey information about the parameter.
          *   Analogy: A detective finding a clue. Frequentist asks, "How often would a random search find this?" Bayesian asks, "Given this clue, how likely is the suspect guilty?"

      *   **Part 4: The Honest Assessment (Is Bayesian Immunity Real?):**
          *   *Theoretical Validity:* Yes, under strict conditions (Likelihood Principle holds, proper priors).
          *   *Practical Caveats (The "Gotchas"):*
              1.  **Calibration:** While the *ratio* of beliefs (Bayes Factor) might be valid, the *posterior probabilities* can be miscalibrated if you stop early on noisy data. You might end up with high confidence in the wrong direction more often than you think if the prior is weak.
              2.  **Informative Stopping Rules:** If the reason you stop is related to the parameter in a way not captured by the data (e.g., budget runs out because the effect looks small), the stopping rule *is* informative.
              3.  **Prior Sensitivity:** Optional stopping exacerbates prior misspecification. If you peek, you are essentially selecting for data that looks extreme. A robust prior handles this better, but a flat prior might lead to overconfidence.
              4.  **Decision Theory:** If you use Bayesian inference to make frequentist-style decisions (e.g., "publish if $BF > 10$"), you re-introduce error rate problems.
              5.  **Simulation Evidence:** Mention that simulations show Bayesian methods are *more* robust to optional stopping than p-values, but not perfectly immune in terms of false discovery rate control in a population of studies.

      *   **Part 5: Conclusion:**
          *   Summarize. It's not magic; it's a difference in what is being measured (long-run error vs. current belief).
          *   Verdict: Bayesian immunity is theoretically sound regarding *evidential meaning*, but practically limited regarding *decision-making calibration*.

  4.  **Refining and Polishing:**
      *   *Tone:* Respectful, academic but accessible, nuanced. Avoid dogmatism.
      *   *Clarity:* Use concrete examples (coin flips are standard for this).
      *   *Addressing the "Intentions" point:* Make sure to emphasize that for Frequentists, intentions define the reference class. For Bayesians, they don't, unless they change the likelihood.
      *   *Self-Correction during drafting:* I need to be careful not to say Bayesians are *completely* immune. Recent literature (e.g., Rouder, Wagenmakers, but also critics like Gelman or Mayo) suggests nuance. Rouder (2014) argues for immunity, but others point out calibration issues. I must present the "Honest Assessment" clearly.
      *   *Specific Terminology:* Mention "Likelihood Principle," "Sampling Distribution," "Calibration," "Bayes Factor."

  5.  **Final Review against User Prompt:**
      *   Did I explain the mechanistic difference? Yes (Sampling distribution vs. Likelihood).
      *   Did I address the "intentions" paradox? Yes (Reference class vs. Conditionality).
      *   Did I provide an honest assessment of the immunity claim? Yes (Theoretical yes, practical caveats).

  6.  (Self-Correction Note): Make sure to distinguish between *estimation* (posteriors) and *testing* (Bayes Factors). Optional stopping affects them slightly differently, but the core principle is similar. I will focus on the general Bayesian update mechanism.

  7.  **Final Polish:** Check for flow and ensure the distinction between "evidential meaning" and "error rate control" is sharp. (This is the crux of the philosophical divide).

  *(Self-Correction during final output generation)*: Ensure I mention that if the stopping rule depends on the *parameter* (not just data), even Bayesians must adjust. But standard optional stopping depends on data, so the likelihood principle usually saves it. However, the *calibration* of the final probability is the weak point.

