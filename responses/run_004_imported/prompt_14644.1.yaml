answer: |-
  This is one of the deepest and most contentious questions in the philosophy of statistics. Your skepticism is well-founded: it does feel counterintuitive that the *same* numbers can be deemed "corrupted" in one framework and "pure" in another simply because of what was in the researcher's head.

  The resolution lies in recognizing that Frequentism and Bayesianism are not answering the same question. They are optimizing for different properties of inference. The claim of Bayesian immunity is theoretically robust under specific conditions, but it is often oversold in practice, particularly regarding decision-making and calibration.

  Here is a mechanistic breakdown of why the divergence occurs, followed by an honest assessment of the Bayesian claim.

  ---

  ### 1. The Mechanism: Why Frequentism Breaks
  To understand why optional stopping inflates false positives in Frequentism, you must look at how a p-value is defined.

  A p-value is not the probability that the null hypothesis is true given the data. It is the probability of observing data **as extreme or more extreme** than what you observed, **assuming the null is true**, across the **entire sample space defined by your experimental design**.

  **The Mechanism of Inflation:**
  When you fix the sample size ($N=100$) in advance, the "sample space" consists of all possible sequences of 100 observations. The threshold for significance ($p < 0.05$) is calibrated so that only 5% of those sequences cross the line under the null.

  When you engage in optional stopping (peeking), you change the sample space. The experiment is no longer "collect 100 data points." It is now "collect data until $p < 0.05$ or $N=100$."
  *   Under the null hypothesis, random noise will fluctuate.
  *   By checking repeatedly, you give the random walk multiple opportunities to cross the significance boundary.
  *   Even if the true effect is zero, a random walk will eventually cross *any* boundary if you let it go on long enough (or peek often enough).

  **The Role of Intentions:**
  For a Frequentist, the "intention" (the stopping rule) defines the **reference class**. To calculate the error rate, you must simulate all the experiments you *could* have run but didn't. If your intention was to stop early, the "unrun" experiments where you would have stopped at $N=50$ are part of the probability calculation for the data you actually got at $N=100$. Therefore, the private intention changes the mathematical definition of the p-value.

  ### 2. The Mechanism: Why Bayesianism Claims Immunity
  Bayesian inference is governed by Bayes' Theorem:
  $$ P(H|D) \propto P(D|H) \times P(H) $$
  The core engine is the **Likelihood Function**, $P(D|H)$.

  **The Likelihood Principle:**
  This principle states that all the evidential meaning of the data is contained in the likelihood function of the *observed* data. If two experiments yield proportional likelihood functions for the observed data, they should yield the same inference, regardless of the design or stopping rule.

  **Why Stopping Rules Often Cancel Out:**
  In standard optional stopping, you stop based on the *observed data* (e.g., "the effect looks big enough").
  *   Let $D$ be the data you actually collected.
  *   Let $S$ be the stopping rule.
  *   The Bayesian updates on $P(H | D, S)$.
  *   Using Bayes rule: $P(H | D, S) \propto P(D, S | H) \times P(H)$.
  *   This expands to: $P(D | H, S) \times P(S | D, H) \times P(H)$.

  If the stopping rule depends *only* on the observed data (which is the case in standard optional stopping), then $P(S | D, H) = 1$ (since you *did* stop, given you have this data). Furthermore, if the stopping rule does not depend on the parameter $H$ directly (only through the data), then $P(D | H, S) = P(D | H)$.

  **The Result:** The stopping rule $S$ mathematically drops out of the equation. The posterior depends only on the data you have and your prior. The "intentions" are irrelevant because they do not change the likelihood of the data that is actually sitting in front of you.

  **The Conceptual Difference:**
  *   **Frequentist:** "How often would a procedure like this yield misleading results?" (Focus on the *process*).
  *   **Bayesian:** "Given that I have *this* specific data, how should I update my beliefs?" (Focus on the *state of knowledge*).

  ### 3. The Honest Assessment: Is the Immunity Real?
  This is where your skepticism is vital. The theoretical immunity is sound, but the *practical* immunity is conditional. There are three major caveats where the Bayesian claim of "complete immunity" frays.

  #### A. Calibration and False Discovery Rates
  While optional stopping does not invalidate the *coherence* of a Bayesian posterior (your beliefs remain internally consistent), it can wreck the **calibration**.

  If you simulate 1,000 studies where the null is true, and you use optional stopping with a Bayes Factor threshold (e.g., stop when $BF_{10} > 10$), you will indeed stop earlier than a fixed-N design. However, among the studies where you stop and claim an effect, the proportion that are actually false positives may be higher than the nominal threshold suggests, *if your prior is not well-specified*.

  Frequentist methods are designed specifically to control the long-run error rate (Type I error). Bayesian methods are designed to quantify evidence. If you use Bayesian evidence thresholds to make binary decisions (Publish/Don't Publish) while optional stopping, you can inadvertently reintroduce high false-discovery rates, especially with small sample sizes where noise is high. The Bayesian math is correct, but the *decision rule* applied to the math may be optimistic.

  #### B. Informative Stopping Rules
  The Likelihood Principle holds only if the stopping rule is **non-informative** about the parameter *beyond* what is in the data.
  *   **Non-informative:** "I stop when $p < 0.05$." (Depends on data).
  *   **Informative:** "I stop because my grant money ran out, and I only got a grant because my preliminary data looked promising." OR "I stop because the effect size is smaller than I hoped, so I'm cutting losses."

  If the reason for stopping conveys information about the parameter that is not captured in the likelihood of the observed data, a Bayesian *must* model the stopping rule. If you ignore an informative stopping rule, your posterior *will* be biased. In practice, distinguishing between a rule that depends only on data and one that depends on external constraints correlated with the parameter is difficult.

  #### C. Prior Sensitivity
  Optional stopping interacts dangerously with **prior misspecification**.
  In a fixed-N design, the data eventually overwhelm a weak prior. In optional stopping, you are effectively selecting for moments where the data looks extreme. If your prior is too flat (uninformative) or centered incorrectly, optional stopping allows you to "hunt" for a posterior that looks confident but is actually driven by the combination of a weak prior and noise selection.

  Recent simulation work (e.g., by Gelman, Carlin, and others) suggests that while Bayesian methods are *more* robust to optional stopping than p-values, they are not immune to the inflation of effect size estimates. If you stop as soon as the credible interval excludes zero, you are systematically selecting for overestimates of the effect magnitude (the "winner's curse"). The *direction* of the inference might be valid, but the *magnitude* will be biased.

  ### 4. Summary: Resolving the Paradox
  How can the same data be biased in one framework and not the other?

  1.  **Frequentism** treats the data as a realization of a **random variable**. The properties of that variable depend on the stopping rule. Therefore, the data carries the "scar" of the stopping rule in its sampling distribution.
  2.  **Bayesianism** treats the data as a **fixed condition**. You condition on the data you have. The stopping rule is treated as a separate variable that, under standard conditions, provides no additional information about the hypothesis once the data is known.

  **The Verdict:**
  The Bayesian claim of immunity is **theoretically valid** regarding the *interpretation of evidence* (the Likelihood Principle holds). If you want to know "What do these specific numbers say about my hypothesis?", the stopping rule is irrelevant.

  However, the claim is **practically idealized** regarding *decision making and calibration*. If you use Bayesian tools to mimic Frequentist decisions (binary significance testing) while optional stopping, you lose the long-run error guarantees Frequentism tries to protect, and you risk overconfidence in effect sizes.

  **Recommendation for the Practitioner:**
  Do not view Bayesian immunity as a "get out of jail free" card for QRPs.
  *   **Transparency:** Always report the stopping rule. Even if a Bayesian analysis is technically valid, hiding the rule prevents readers from assessing potential calibration issues or informative stopping.
  *   **Priors:** Use robust, skeptical priors if optional stopping is anticipated. This counteracts the tendency to stop on noise.
  *   **Estimation over Testing:** Focus on the posterior distribution and credible intervals, not just crossing a Bayes Factor threshold. This mitigates the "winner's curse" of stopping early on large effects.

  The divergence isn't magic; it's a trade-off. Frequentism sacrifices relevance to the specific data to protect long-run error rates. Bayesianism sacrifices long-run error control to provide coherent belief updating for the specific data. Optional stopping exploits the weakness of the former but stresses the assumptions of the latter.
