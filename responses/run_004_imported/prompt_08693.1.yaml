answer: |-
  This is a beautiful situation to be in, first off. Teaching yourself a craft to connect with a lost relative is meaningful, and finding out he had a great eye is a gift.

  To answer your question directly: **You are right about the authorship, but Mara is right about the craft.** However, she is drawing the wrong conclusion from the market data.

  The argument you two are having is actually a classic debate in photography theory that has been raging since the medium was invented. It boils down to the difference between the **Image** (the creative vision) and the **Object** (the physical print).

  Here is the breakdown of why Mara's market argument doesn't prove her point, and where the principled line actually sits.

  ### 1. The Market Argument: Scarcity vs. Authorship
  Mara is correct that vintage prints sell for more than posthumous prints. But she is misinterpreting *why*.

  If her theory were true—that the person touching the chemicals is the primary author—then a print made by your grandfather in 1980 should be worth roughly the same as a print he made in 1960, provided the quality was the same. After all, the "author" (his hands/brain) is the same. But as you noted, vintage prints (made near the time of the negative) are worth more than later prints made by the same photographer.

  This proves that the market isn't valuing the *labor of printing* above all else. It is valuing **provenance and historical context.**
  *   **Vintage Print:** This is a historical artifact. It was part of the artist's original statement to the world at that specific time. It has "aura," as the philosopher Walter Benjamin called it.
  *   **Later/Estate Print:** This is a reproduction of a vision. Even if the photographer makes it, it lacks the historical immediacy.

  The market hierarchy doesn't prove the printer is the author; it proves that **time and proximity to the artist's intent create value.**

  ### 2. The Score vs. The Performance
  The most useful analogy here is music.
  *   **The Negative is the Score:** Your grandfather composed the music. He chose the notes (composition), the tempo (shutter speed), and the dynamics (lighting).
  *   **The Print is the Performance:** You are the conductor and the orchestra. You are interpreting the score.

  If you play Beethoven's 9th Symphony, you make creative choices. You decide how fast to go, how loud the drums are, the emotional swell. A great performance is distinct from a bad one. But **no one says the symphony belongs to the conductor.** It is still Beethoven's 9th.

  Mara is arguing that because you conducted the performance, it's now "Your Symphony." But in photography, as in music, we distinguish between the *composer* and the *interpreter*. You are the interpreter of his vision. That is a noble and skilled role, but it doesn't make you the author of the image.

  ### 3. The "Creative Choice" Threshold
  Mara is right that printing involves creative choices. Dodging and burning can change the mood of a photo significantly. Ansel Adams famously said, *"The negative is the score, and the print is the performance."* He spent days in the darkroom on a single print.

  However, there is a difference between **interpretation** and **creation**.
  *   **Creation:** Deciding what to photograph, when to click the shutter, and how to frame the world. This is 90% of the photographic act.
  *   **Interpretation:** Deciding how to translate the latent image on the film into silver on paper.

  Unless you are cropping the image significantly, combining negatives, or altering the reality of the scene (which you aren't), you are working within the boundaries of *his* creative decisions. You are realizing his intent, not superseding it.

  ### 4. The Ethical/Practical Middle Ground
  In the fine art world, there is a standard protocol for exactly this situation, and it solves your problem without needing to declare one of you the "sole owner" of the work.

  When an estate authorizes prints from old negatives, they are labeled transparently. If you were to exhibit or sell these, the credit line should read:

  > **[Grandfather's Name]**
  > *Printed by [Your Name]*

  Or:
  > **[Grandfather's Name]**
  > *From the original negative, printed [Year]*

  This acknowledges the hierarchy of authorship. The image is his. The specific physical object is a collaboration, but one where you are serving his vision.

  ### The Verdict
  Mara is conflating **economic value** with **creative authorship**.
  *   The market values the *artifact* (the vintage print) higher than the *image* (the negative). That is about scarcity and history, not who held the tongs.
  *   You are the custodian of his vision. By learning to print, you aren't stealing his authorship; you are rescuing his work from oblivion.

  **So, who is right?**
  You are right that they are his photos. The creative soul of the image is his.
  Mara is right that the *print* is a unique object that bears your mark.
  But she is wrong that this makes them *yours*.

  Don't let the market logic convince you that your connection to your grandfather is just a transaction of labor. You aren't manufacturing a product; you're finishing a conversation he started. Keep printing them, credit him as the photographer and yourself as the printer, and enjoy the process. That's the only part that actually matters.
