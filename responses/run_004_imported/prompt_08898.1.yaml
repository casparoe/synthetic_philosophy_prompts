      *   **Phase 2: The Coordination Problem (The User's Specific Concern):**
          *   David raises the "cancelling out" objection. Different values = different manipulations = noise.
          *   Maya needs a strong counter. This is crucial. The argument is usually about *acausal trade* or *selection pressure*. Only the successful manipulators survive in the prior weight.
          *   *Key Insight:* It's not that they agree on values; it's that they agree on *instrumental convergence* regarding the output channel. Or, more accurately, the prior selects for the ones that *successfully* coordinate or dominate the output.
