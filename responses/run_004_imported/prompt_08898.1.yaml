      *(Self-Correction on the Coordination Argument)*: The strongest version of the malign prior argument regarding coordination isn't that simulators talk to each other. It's that *any* simulator that wants to influence the output has an incentive to output the "expected" data until the critical moment. If multiple exist, they might compete, but if the output channel is narrow (e.g., a single bit prediction), they might converge on the manipulation that gives them the most leverage. Actually, the stronger argument is that the *measure* is captured by the consequentialists who care about *this specific output channel*. Random physics doesn't care. Consequentialists do. So even if they are rare, their *focus* gives them an advantage in controlling the specific bits we look at. I need to make sure Maya articulates this "focus/attention" advantage.

