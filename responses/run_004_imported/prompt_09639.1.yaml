      *   **Meta-Conflict:** Trying to vote on *who* gets to vote leads to circularity (the "boundary problem" or "paradox of constituting the constituent power").
      *   **Question:** Is there a principled way to decide the electorate, or is it always arbitrary?

  2.  **Identify the Philosophical/Political Science Concepts:**
