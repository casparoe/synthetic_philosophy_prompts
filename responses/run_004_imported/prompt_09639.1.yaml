      *   *Incoming Freshmen:* They will live under the rules *later*. However, they aren't part of the community *yet*.
      *   *The Circularity:* To vote on who votes, you need a pre-existing rule about who votes. This is the "infinite regress" issue.

  4.  **Formulate a Response Strategy:**
