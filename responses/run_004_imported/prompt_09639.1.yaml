      *   Key thinkers: Robert Dahl ("Procedural Democracy"), Frederick Whelan ("Democratic Theory: The Boundary Problem"), Carl Schmitt (Constituent Power), Social Contract Theory (Locke, Rousseau).
      *   Key concepts: All-affected interests principle, All-subjected principle, Coercion principle, Stakeholder principle.

  3.  **Evaluate the Specific Arguments:**
