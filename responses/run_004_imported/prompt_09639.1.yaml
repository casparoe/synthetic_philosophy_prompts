              *   *Provisional Rules:* A temporary committee decides the voting rules.
              *   *Representation:* Current students vote *on behalf* of the future community (trusteeship).

      *   **Applying to the Student Council Case:**
          *   *Argument for Current Students:* They are the actual legal members *now*. The council is an entity of the current student body. Incoming students haven't accepted the social contract yet.
