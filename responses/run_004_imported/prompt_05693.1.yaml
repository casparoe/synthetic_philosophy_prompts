prompt: |-
  I picked up a used copy of Bernard Williams's On Opera a while back, mostly out of curiosity about what a guy famous for moral luck and trashing utilitarianism would have to say about something as seemingly frivolous as opera. There's a thread running through a bunch of the essays where he pushes back on what I'd call the "Kerman view" (after Joseph Kerman's Opera as Drama) -- basically the idea that an opera's music only earns it's keep insofar as it's serving the dramatic and psychological truth of the story, so "just beautiful" singing that isn't doing dramatic work gets treated as a bit of a cop-out. Williams seems to think that standard is too narrow and actually misdescribes what's going on when an opera is working well.

  Problem is I only have a hazy memory of how he actually argues for that -- read it kind of fast at a friend's place and didn't take notes. My friend, who's way more into music theory than philosophy, reckons it's basically just Williams being precious about high art vs cheap spectacle, but that doesn't sound right based on what little I remember. Can you walk me through what his actual position is -- why he resists the idea that music always has to be justified by drama, and what he thinks is really doing the work in opera instead? Not looking for a plot-summary-level answer, more the actual philosophical guts of the argument.
