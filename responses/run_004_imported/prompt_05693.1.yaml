answer: |-
  Your friend's take—that Williams is just sniffing about "high art" versus "spectacle"—is a classic category error, and ironically, it's the same kind of error Williams accuses Kerman of making. Williams isn't defending opera as a museum piece; he's defending it as a specific, coherent *form of life* that has its own rules of truthfulness.

  To get to the philosophical guts of *On Opera*, you have to understand that Williams is treating opera not as a branch of theater, but as a distinct philosophical problem about how we express interiority.

  Here is the breakdown of his argument against the "Kerman view" and what he puts in its place.

  ### 1. The Category Mistake: Drama vs. Opera
  Kerman's *Opera as Drama* (1956) is essentially a humanist manifesto. He argues that for opera to be serious art, the music must be subservient to the dramatic situation. If a singer stands still and belts out a high C just because it sounds nice, but it doesn't match the character's psychological state or advance the plot, Kerman calls that a failure. He wants opera to approximate the psychological realism of Ibsen or Chekhov.

  Williams thinks this is a **category mistake**. He argues that Kerman is judging a hybrid form by the standards of one of its parents (drama) while ignoring the other (music).

  For Williams, music in opera is not an *illustration* of the drama; it is a *constituent* of the action. In spoken drama, words describe or enact things. In opera, the musical utterance *is* the thing happening. If you demand that the music always justify itself by reference to a non-musical dramatic standard, you cease to have opera and you have "illustrated radio play." Williams's core philosophical move here is to insist that opera is *sui generis*. It creates its own world with its own ontology. You can't judge the truth of that world using the metrics of realistic theater.

  ### 2. The Problem of Time and Interiority
  This is where Williams gets really interesting, and where his background in moral psychology shines through.

  In realistic drama, time is linear and functional. If a character is deciding whether to kill themselves, the drama moves through that decision. In opera, music **suspends** time. An aria can take five minutes to express a feeling that, in real life, would pass in a second.

  Kerman sees this suspension as a potential flaw (is it stalling the drama?). Williams sees it as the **primary function** of opera. Music allows for an exploration of interiority that spoken drama literally cannot accommodate without becoming boring or pretentious.

  Williams argues that music doesn't just "serve" the psychology; it **creates a space for psychology to exist** that wouldn't otherwise be there. When a character sings, they are not just communicating information; they are inhabiting a state of being. The "work" being done isn't plot advancement; it's the revelation of a subjective state that is too complex for words alone. If you cut the "beautiful singing" because it isn't "doing dramatic work," you are actually deleting the psychological depth, because in opera, the beauty *is* the depth.

  ### 3. Honesty About Artificiality (The "Impossible" Object)
  Williams is obsessed with **truthfulness**, but he distinguishes sharply between *realism* and *truth*.

  Kerman wants opera to be psychologically realistic (people shouldn't sing when they are dying). Williams points out that opera is inherently impossible. People *don't* sing when they die. To pretend otherwise is to lie.

  Williams argues that opera works best when it is **honest about its own artificiality**. The "Kerman view" tries to smooth over the absurdity of opera to make it palatable to literary critics. Williams thinks we should lean into the absurdity. The fact that a character sings an elaborate coloratura while bleeding out is a convention of the form. If the music is compelling, we accept the convention.

  This connects to his broader philosophical skepticism about theory. Just as he thought moral theory (like Utilitarianism) often fails to capture the messy reality of ethical life, he thinks Kerman's theory fails to capture the messy reality of aesthetic experience. Williams is saying: *Don't try to make opera rational. It's a dream state. Treat it honestly as a dream, not falsely as a documentary.*

  ### 4. Expression vs. Representation
  Perhaps the most technical philosophical point Williams makes is about the relationship between the music and the libretto.

  Kerman tends to want the music to **represent** the emotion of the text. (Text: "I am sad." Music: Sad sounds.)
  Williams argues that the music often **expresses** something that the text cannot say, and sometimes even **contradicts** the text.

  This is the concept of **musical irony**. A character might sing words that are confident and assertive, but the music might reveal they are terrified or deluded. If you follow Kerman, you might say the music is "distracting" from the text. Williams says the music is telling the *truth* that the text is hiding.

  For Williams, the music has an epistemic authority that the words do not. The orchestra knows what the character feels even if the character doesn't. Therefore, the music cannot be subservient to the drama, because the music often knows more than the drama does. To subordinate the music to the text is to silence the most honest voice in the room.

  ### 5. Why Your Friend is Wrong
  Your friend thinks Williams is being precious about "high art." But Williams's argument is actually quite democratic in a weird way. He isn't saying "spectacle is bad." He is saying that **spectacle and convention are part of the contract.**

  When Williams defends "just beautiful singing," he isn't defending empty virtuosity for the sake of elitism. He is defending the idea that **sensuous pleasure is a legitimate cognitive tool.** The pleasure we get from the sound *is* part of the understanding we gain of the character. If we deny that pleasure because it isn't "working" dramatically, we are applying a Puritanical work-ethic to art that Williams finds philosophically incoherent.

  ### Summary of the "Philosophical Guts"
  Williams's position rests on three pillars that directly counter Kerman:

  1.  **Autonomy:** Music is not a handmaiden to drama; it is an equal partner that defines the ontology of the work.
  2.  **Truthfulness vs. Realism:** Opera should not pretend to be real life (realism); it should be honest about its artificial conventions to achieve emotional truth.
  3.  **Epistemic Privilege:** Music reveals psychological truths that text cannot access, sometimes by contradicting the text.

  Williams is essentially arguing that Kerman is trying to solve the "problem of opera" by eliminating the "opera" part. Williams wants to save the phenomenon. He thinks the magic of opera lies precisely in that tension between the absurdity of singing and the truth of the emotion, and that trying to resolve that tension in favor of "drama" kills the thing you're trying to save.

  It's very consistent with his moral philosophy: he's skeptical of systems (like Utilitarianism or Kerman's Dramatic Theory) that try to flatten human experience into a single metric of value. He wants to preserve the complexity, even if it's messy.
