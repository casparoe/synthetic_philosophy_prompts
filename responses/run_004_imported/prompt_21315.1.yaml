      *   Psychotherapy often involves reframing, emotional processing, and value shifts, which look like "manipulation" from the outside but "clarity" from the inside.
      *   If Reflection holds, the user should align current beliefs with expected future beliefs.
      *   If Reflection fails (due to irrationality, memory loss, or non-evidential updating), the user might be justified in resisting the change.
