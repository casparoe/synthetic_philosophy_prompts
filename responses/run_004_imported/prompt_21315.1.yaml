      *   *Intuition:* I should trust my future self as an epistemic authority *if* I expect that future self to be rational and informed.
      *   *Van Fraassen's Motivation:* Diachronic coherence. Avoiding Dutch Books over time. Respect for future rationality.

  3.  **Identify the Tension (The User's Dilemma):**
