answer: |-
  Good evening. For those who don't know me, I've had the privilege of covering monetary policy for about fifteen years. Which means I've spent a decade and a half trying to translate what [Honoree's Name] says into sentences that don't put people to sleep.

  Looking around this room, I see we have a split audience. On one side, we have her family, who love her for her warmth, her humor, and her ability to listen. On the other side, we have a dense cluster of economists who love her for her rigorous handling of transmission mechanisms. My challenge tonight is to bridge that gap. Fortunately, [Honoree's Name] spent her entire career building that bridge herself.

  To understand her work, you have to understand a specific idea from 1752. David Hume, the Scottish philosopher, wrote an essay called "Of Money." His big idea was that money is just a veil. He argued that if you print more currency, you don't actually make a country richer. Eventually, prices just catch up. Everything costs more, but you can't buy any more stuff. In the long run, money is neutral. It doesn't change the real world; it just changes the numbers on the price tags.

  For many economists, that was the end of the story. If the long run is neutral, why bother managing the money supply? Why have a central bank at all?

  But [Honoree's Name] always pointed out that Hume admitted something crucial. He said there is an interval. A gap between printing the money and prices rising. And in that gap, something magical happens. People feel slightly richer. Businesses see demand. They hire workers. Output goes up. There is a real, temporary kick to the economy.

  For forty years, that interval was her home.

  To her family: Imagine you're planning a road trip. The destination is fixed. You're going to end up at the same place regardless of how fast you drive. That's the long run. But [Honoree's Name] cared about the drive. She cared about whether the car had enough gas to get up the hill, whether the engine was smooth, and whether everyone in the car had a seat. She knew that while the destination might be neutral, the journey determines who survives the trip.

  To my colleagues in the economics section: She understood that "long-run neutrality" is a theoretical anchor, but "short-run non-neutrality" is where people live. Equilibrium is where models converge; disequilibrium is where families lose homes or find jobs. She never treated the adjustment period as a mere friction to be ignored. She treated it as the only place where policy actually matters.

  She taught me that while prices might eventually adjust, wages are sticky, expectations are slow, and human beings are not rational calculators waiting for equilibrium. They are people who need paychecks today, not in ten years when the veil lifts. Her entire career was an argument that the temporary kick *is* the point. If you can stabilize that interval, if you can stretch out the boom and soften the bust, you haven't just moved numbers on a spreadsheet. You've protected livelihoods.

  Now, she is entering her own transition. She is moving from the high-frequency data of the central bank to the long-run equilibrium of retirement.

  In economic theory, the long run is a place of stillness. But I don't think that's what awaits her. I think she's earned the right to enjoy her own short-run kick. She's earned the interval where the pressures of inflation targeting are replaced by the immediate satisfaction of a garden, a grandchild, or a quiet morning without a briefing book.

  We often talk about legacy in terms of compound interest or multiplying effects. I won't make that mistake. We know better than to confuse nominal values with real output. Instead, I want to talk about stability.

  Her legacy isn't that she made the numbers bigger. It's that she made the system steadier. She ensured that when the shocks came—and they always come—the interval didn't become a cliff. She managed the transition so that the rest of us could plan our lives without worrying that the veil was about to be ripped away overnight.

  So, if the long run is where prices settle, let us celebrate the short run, where life happens. And let us celebrate the person who spent forty years making sure that life was worth living during the adjustment.

  Please raise your glasses.

  To [Honoree's Name]: For mastering the veil, for championing the interval, and for proving that while money may be neutral in the long run, her impact on us is profoundly real.

  To [Honoree's Name].
