      *   *Fintech Specifics:* Mention ECOA, Disparate Impact, Adverse Action. This is crucial because the user is in lending, not criminal justice (COMPAS).
      *   *The "Fact of the Matter":* Address this directly. There *is* a fact of the matter regarding compliance, even if there isn't one regarding universal moral fairness.

  6.  **Refining the Argument (Self-Correction during drafting):**
