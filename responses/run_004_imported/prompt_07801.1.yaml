      *   **Skeptic (let's call him David):** Pragmatic, analytical (maybe also design/tech background to match the user), sees the trickiness in the framing. He needs to use SIA/Reference Class arguments effectively without dismissing the math.

  3.  **Drafting - Section by Section:**

