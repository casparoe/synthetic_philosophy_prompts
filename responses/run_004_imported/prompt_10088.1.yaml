answer: |-
  This is a classic debate in AI alignment, and while your intuition aligns with standard statistical learning theory (more data $\rightarrow$ better convergence), your friend's position actually reflects the prevailing technical consensus in the alignment community.

  You are right that if we treat humans as black boxes, we can predict their behavior arbitrarily well with enough data. However, **Inverse Reinforcement Learning (IRL) is not trying to predict behavior; it is trying to recover the latent *reward function* that generates the behavior.**

  The reason alignment researchers treat this as fundamentally underdetermined is not because of a lack of data, but because of a structural ambiguity known as the **Planner-Reward Degeneracy**.

  Here is the breakdown of why your friend is technically correct, even if their "people aren't rational" argument felt vague.

  ### 1. The Identifiability Problem (Even with Optimal Agents)
  Even in the idealized case where a human is a perfectly rational agent maximizing a reward function, their behavior does not uniquely identify that reward function.

  This was established early on by Ng & Russell (2000). They showed that for any optimal policy, there is an infinite set of reward functions that would make that policy optimal. Specifically, you can add any **potential-based reward shaping** function to the true reward without changing the optimal policy.
  *   **True Reward:** $R(s)$
  *   **Shaped Reward:** $R'(s) = R(s) + \gamma \Phi(s') - \Phi(s)$

  Both $R$ and $R'$ produce the exact same behavior in an optimal agent. No amount of behavioral data can distinguish between them. To pick one, you need a prior assumption about the "simplicity" or "structure" of the reward, which is a normative choice, not a data-driven one.

  ### 2. The Planner-Reward Degeneracy (The Knockout Argument)
  Your argument rests on the idea that we can use a "sensible model of how preferences translate into action" (a planner) to account for bounded rationality. This is where the fundamental underdetermination kicks in.

  Let $B$ be observed behavior.
  Let $R$ be the reward function (preferences).
  Let $P$ be the planning algorithm (rationality model).

  Behavior is the output of the planner acting on the reward: $B = P(R)$.
  In IRL, we observe $B$ and want to find $R$. To do this, we must assume $P$.

  **The problem is that we do not know $P$.** Humans are not just "noisy rational." We have systematic biases, akrasia (weakness of will), framing effects, and context-dependent preferences.
  *   If a person eats cake while on a diet, is it because:
      1.  They actually prefer cake over health ($R$ says cake > health)?
      2.  They prefer health over cake, but have low impulse control ($P$ is myopic)?

  Mathematically, there are infinitely many pairs of $(P, R)$ that can generate the same behavior $B$.
  *   **Armstrong & Mindermann (2018)** formalized this in *"Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents."* They proved that without normative assumptions (i.e., stipulating what counts as a "bias" vs. a "preference" beforehand), you cannot disentangle the planner from the reward, even with infinite data.

  If you assume a specific planner (e.g., Boltzmann Rationality), you can recover a reward function. But if your assumption about the planner is slightly wrong, the recovered reward function will be wrong, and it will **not converge to the truth** as data increases. It will converge confidently to the wrong answer.

  ### 3. The Ontological Problem: Do "True Preferences" Exist?
  Your argument assumes that a "true reward function" exists to be found. Behavioral economics and psychology suggest this might be false.

  Humans often do not have pre-existing, consistent preferences. Preferences are frequently **constructed** in the moment based on framing, defaults, and emotional state.
  *   If I choose A over B today, but B over A tomorrow (due to a mood shift), there is no single static $R$ that explains both.
  *   IRL assumes a stationary MDP (Markov Decision Process). If human values are non-stationary or context-dependent in ways not captured by the state space, the model is misspecified.

  In this view, the problem isn't that we lack data; it's that the target variable ($R$) doesn't exist in the form the math requires.

  ### 4. Why Alignment Cares (The Normative Gap)
  Finally, the reason alignment researchers worry about this is that **predictive accuracy is not the goal.**

  If we build an AI that perfectly mimics human behavior, it will replicate our biases, addictions, and inconsistencies.
  *   **Revealed Preference:** I smoke cigarettes. (Inferred $R$: I value smoking.)
  *   **Normative Preference:** I wish I didn't smoke. (True $R$: I value health, but $P$ is flawed.)

  To align AI with what humans *want* (rather than what they *do*), we must distinguish between competence (the planner) and objectives (the reward). As shown in point #2, this distinction cannot be made from behavior alone. It requires **normative information**—explicit feedback, philosophical constraints, or assumptions about what constitutes a "mistake."

  ### Summary
  You won the argument on **engineering**: Yes, with enough data and a fixed model of rationality, we can build systems that predict human actions incredibly well.

  Your friend won the argument on **principles**: No amount of behavioral data can uniquely identify the underlying reward function because the mapping from (Reward + Planner) to Behavior is many-to-one.

  The alignment community treats this as underdetermined because solving it requires more than just data; it requires solving the philosophical problem of defining what counts as a "rational error" versus a "genuine preference." That is not a data problem; it is a normative one.
