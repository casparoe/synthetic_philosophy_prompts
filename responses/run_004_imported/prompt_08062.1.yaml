  **Justifications**

  *   **Move 1 (Mara): 1.** Mara appeals to the intuitive principle that "ought implies can." If Dana literally *could not* act due to anxiety, blame is inappropriate. However, she moves too quickly from "anxiety caused this" to "anxiety removed control," ignoring that causes influence choices without always negating them.
  *   **Move 2 (Ben): 2.** This is the strongest philosophical move. Ben correctly identifies that Mara's logic leads to hard determinism: if causal explanations excuse actions, *all* actions are excused. He forces the debate to acknowledge that responsibility requires distinguishing between *types* of causes, not just the presence of causation.
  *   **Move 3 (Mara): 1.** Mara retreats to a standard compatibilist distinction: some causes (compulsions, seizures) bypass agency, while others (desires, fears) operate *through* it. This is a necessary distinction to save moral responsibility, though she hasn't yet proven anxiety fits the former category.
  *   **Move 4 (Ben): 1.** Ben challenges the empirical classification of Dana's anxiety. He argues that feeling "frozen" is often a conflict of motivations (fear vs. duty) rather than a lack of capacity. His slippery slope argument holds: if psychological difficulty exempts responsibility, moral obligation collapses.
  *   **Move 5 (Mara): -1.** This commits the "line-drawing fallacy" (Sorites paradox). Just because the boundary between "hard" and "impossible" is vague doesn't mean there aren't clear cases on either side (e.g., a panic attack vs. mild nervousness). Pointing out vagueness doesn't invalidate Ben's distinction.

  **What They're Missing**

  Both Mara and Ben are treating this as a metaphysical puzzle about free will, when it is actually a **normative and relational** issue.

  1.  **The Function of Blame:** They assume blame is only about retrospective justice (did she deserve it?). They miss that blame often serves a forward-looking function: communicating expectations and maintaining trust. Even if Dana's anxiety is genuine, the *impact* on her sister remains, and acknowledging that impact is separate from judging Dana's moral worth.
  2.  **Degrees of Responsibility:** They are arguing in binaries (fully blameworthy vs. completely exempt). In reality, responsibility is scalar. Dana might be less responsible than a flake, but more responsible than someone having a seizure. This allows for a response that balances compassion with accountability (e.g., "I understand you couldn't help it, but we still need to figure out how you make amends").
  3.  **Dana's Agency:** Neither considers that validating Dana's anxiety might actually require holding her accountable. Treating her as completely incapable (Mara's view) can be infantilizing, while treating her as fully capable without support (Ben's view) ignores her reality. The missing piece is how to support her agency while addressing the broken promise.
