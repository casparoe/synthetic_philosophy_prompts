answer: |-
  The short answer is **no**. The accuracy-dominance argument fails if you use the Absolute Difference score (also known as the $L_1$ norm or Manhattan distance) instead of the Brier score (the $L_2$ norm or Euclidean distance).

  While your intuition is natural—both scores measure "distance from the truth"—the mathematical proof that justifies probabilism relies on specific geometric properties that the Brier score possesses but the Absolute Difference score lacks. Specifically, the argument requires the inaccuracy measure to be **strictly convex**.

  Here is a detailed breakdown of why the argument fails for Absolute Difference, including a concrete counter-example and the geometric explanation.

  ### 1. The Counter-Example
  To see why the dominance argument fails, we can construct a simple scenario where a non-probabilistic credence function is **not** strictly dominated by any probabilistic function when using Absolute Difference.

  **The Setup:**
  *   Consider a partition with two propositions: $A$ and $B$ (where $B = \neg A$).
  *   There are two possible worlds: $w_A$ (where $A$ is true, $B$ is false) and $w_B$ (where $A$ is false, $B$ is true).
  *   **Inaccuracy Measure:** Absolute Difference. The inaccuracy of a credence $c$ in a world $w$ is $|c(A) - v_w(A)| + |c(B) - v_w(B)|$, where $v$ is the truth value (1 or 0).

  **The Non-Probabilistic Credence ($c$):**
  Let us assign credences that violate probability axioms (specifically, additivity):
  *   $c(A) = 0.6$
  *   $c(B) = 0.6$
  *   Sum = 1.2 (Incoherent)

  **Calculate Inaccuracy of $c$:**
  *   **In World $w_A$:** $A$ is true (1), $B$ is false (0).
      $$Inacc(c, w_A) = |0.6 - 1| + |0.6 - 0| = 0.4 + 0.6 = \mathbf{1.0}$$
  *   **In World $w_B$:** $A$ is false (0), $B$ is true (1).
      $$Inacc(c, w_B) = |0.6 - 0| + |0.6 - 1| = 0.6 + 0.4 = \mathbf{1.0}$$

  **The Probabilistic Competitor ($p$):**
  Any probabilistic function $p$ must satisfy $p(A) + p(B) = 1$. Let $p(A) = x$, which implies $p(B) = 1 - x$.

  **Calculate Inaccuracy of $p$:**
  *   **In World $w_A$:**
      $$Inacc(p, w_A) = |x - 1| + |(1 - x) - 0| = (1 - x) + (1 - x) = \mathbf{2 - 2x}$$
  *   **In World $w_B$:**
      $$Inacc(p, w_B) = |x - 0| + |(1 - x) - 1| = x + x = \mathbf{2x}$$

  **The Dominance Test:**
  For probabilism to be justified via dominance, there must be some $x$ such that $p$ is **strictly more accurate** (lower inaccuracy) than $c$ in **both** worlds.
  1.  To beat $c$ in $w_A$: $2 - 2x < 1.0 \Rightarrow 1 < 2x \Rightarrow \mathbf{x > 0.5}$
  2.  To beat $c$ in $w_B$: $2x < 1.0 \Rightarrow \mathbf{x < 0.5}$

  **Result:** It is mathematically impossible to satisfy both conditions simultaneously. There is no probabilistic credence function that is strictly more accurate than the incoherent $(0.6, 0.6)$ in every possible world. The best a probabilistic function can do (at $x=0.5$) is tie the incoherent function, but not dominate it.

  ### 2. The Geometric Explanation: Convexity
  The failure stems from the geometry of the "isoinaccuracy" curves (contour lines connecting points of equal inaccuracy).

  *   **Brier Score (Strictly Convex):** The contours are circles (or hyperspheres). If you are at an incoherent point outside the probability simplex (the line where $c(A)+c(B)=1$), you can always draw a straight line perpendicular to the simplex. Moving along this line toward the simplex reduces the distance to *both* truth-value vertices (1,0) and (0,1) simultaneously. This guarantees a dominating probabilistic point exists.
  *   **Absolute Difference (Convex, but not Strictly):** The contours are diamonds (squares rotated by 45 degrees). These shapes have flat edges. In the example above, the incoherent point $(0.6, 0.6)$ lies on a flat edge of an inaccuracy diamond. Moving toward the probability line might reduce distance to one truth-value vertex, but it inevitably increases (or keeps equal) the distance to the other.

  ### 3. Technical Requirement: Strict Propriety
  In formal epistemology, the accuracy-dominance theorem (proven by Jim Joyce and refined by others like Pettigrew) requires the inaccuracy measure to be **strictly proper** and **strictly convex**.

  *   **Strict Propriety:** Ensures that if you are a probabilist, you expect your own credences to be the most accurate.
  *   **Strict Convexity:** Ensures that the "penalty" for being wrong increases at an increasing rate. This curvature is what "pushes" incoherent credences toward the probability simplex in all dimensions simultaneously.

  The Absolute Difference score is proper, but it is **not strictly convex**. Because it is linear, it lacks the "curvature" required to guarantee that moving toward coherence improves accuracy relative to all possible truth-value assignments simultaneously.

  ### Summary
  Your intuition that both scores measure "distance" is correct, but in the context of accuracy-first epistemology, **not all distances are created equal.**

  The justification of probabilism is not merely about minimizing distance; it is about the **topology** of that distance. The Brier score's spherical geometry allows for a point that is universally closer to the truth than any incoherent point. The Absolute Difference score's diamond geometry creates "blind spots" (like the 0.6/0.6 case) where incoherence is not strictly penalized relative to coherence across all worlds. Therefore, the accuracy-dominance argument cannot be used to justify probabilism if one adopts the Absolute Difference score.
