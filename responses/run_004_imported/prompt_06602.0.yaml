answer: |-
  Your intuition is spot on. What you are describing is one of the central engines of the replication crisis. While it feels like "expertise" to the researcher, epistemologically, it is a defense mechanism that renders the science unfalsifiable.

  Here is why that logic is flawed, broken down into the specific cognitive and structural traps it creates.

  ### 1. The Unfalsifiability Trap
  The most fundamental problem is that this move makes the hypothesis **unfalsifiable**.

  In the philosophy of science (specifically Karl Popper), for a claim to be scientific, there must be some observable evidence that could prove it wrong. If a researcher says, "The effect is real," and then responds to a failed replication with "You did it wrong," they are moving the goalposts.

  If *every* failure can be explained away by "botched methodology" without the original researcher having to specify exactly *what* was botched and prove that fixing it restores the effect, the theory becomes immune to evidence. It transforms from a scientific hypothesis into a belief system. As the psychologist Paul Meehl famously noted, in "soft" sciences, theories often have a "protective belt" of auxiliary assumptions that get adjusted to save the core theory from refutation.

  ### 2. The "Dozen Times" Illusion (Selection Bias & Degrees of Freedom)
  When a researcher says, "I've run this a dozen times and it works," they are implicitly claiming a high success rate. However, in the pre-registration era, this claim is often misleading due to two factors:

  *   **The File Drawer Problem:** Did they run it 12 times and it worked 12 times? Or did they run it 20 times, it worked 12 times, and they only talk about the 12? If the latter, the effect size is inflated, and the reliability is much lower than claimed.
  *   **Researcher Degrees of Freedom (The Garden of Forking Paths):** This is the subtle killer. An experienced researcher knows how to "make" the effect appear. They might know that if they exclude these three outliers, or use this specific covariate, or phrase the survey question *this* way, the p-value drops below 0.05.
      *   When they say "I've done it a dozen times," they often mean "I've successfully navigated the analytical choices to get a significant result a dozen times."
      *   When a replicator tries to copy the *protocol*, they don't have the tacit knowledge of those analytical tweaks.
      *   Therefore, the original researcher isn't proving the *effect* is robust; they are proving their *skill at extracting significance* is high.

  ### 3. Tacit Knowledge vs. Standardized Protocol
  There is a legitimate argument known as the **"Tacit Knowledge" defense**. It suggests that some experiments are like artisanal crafts; there are unwritten nuances (tone of voice, timing, lab atmosphere) that aren't captured in the methods section.

  *   **The Valid Version:** "We noticed the replication failed. Looking at their materials, we see they used a 5-point scale instead of our 7-point scale, and previous internal data suggests the effect vanishes on 5-point scales. Here is the data proving that."
  *   **The Invalid Version (What you're seeing):** "It didn't work? You must have missed something. I know it works."

  The rational move isn't to toss out the replication; it's to **investigate the discrepancy.** If the original researcher genuinely knows the "secret sauce," they should be able to identify the variable that caused the failure. Dismissing it without investigation assumes the conclusion (that the replication is wrong) before examining the evidence.

  ### 4. The Bayesian Error
  From a Bayesian perspective, belief updating is mathematical.
  1.  **Prior:** You have high confidence the effect is real (because you've seen it many times).
  2.  **New Evidence:** A registered, high-powered replication fails.
  3.  **Update:** Even if you trust your prior experience more than the replication, your confidence *must* decrease slightly.

  To wave off the replication entirely is to update your confidence by **zero**. This implies you assign the failed replication a probability of zero of being correct. That is dogmatic, not rational. A rational scientist would say, "This is strange. My prior is strong, but this new data is concerning. We need a multi-lab replication to adjudicate."

  ### 5. Individual Rationality vs. Scientific Rationality
  You asked: *"Isn't tossing out a shaky failed replication actually the rational move?"*

  *   **Individually Rational?** Yes. If your career, tenure, and reputation are built on this effect, admitting it might be fragile is costly. Dismissing the replication protects your status.
  *   **Scientifically Rational?** No. Science is a collective error-correction machine. The "rational move" for science is to treat the failed replication as a signal that our understanding of the *boundary conditions* of the effect is incomplete.

  ### Summary
  The logic fails because it conflates **"I can produce this result"** with **"This result is a robust feature of reality."**

  A magician can pull a rabbit out of a hat a dozen times in a row. That doesn't mean rabbits naturally inhabit hats; it means the magician has mastered a specific set of conditions to create the illusion. When a skeptic tries to copy the trick and fails, the magician saying "You just didn't do it right" doesn't prove the rabbit lives in the hat. It just proves the trick is hard to copy.

  In science, if a phenomenon depends entirely on the specific touch of the original magician to exist, it is not a robust scientific fact; it is an **artisanal artifact.** Dismissing failed replications without investigation is the primary mechanism by which artisanal artifacts get masqueraded as universal laws.
