      *   *Nuance:* Sometimes replications *are* low quality. I shouldn't say *all* failed replications are gold. The issue is the *automatic dismissal without investigation*.
      *   *Key distinction:* "I know it's real" is a claim about *truth*. "I can make it happen" is a claim about *skill*. Confusing the two is the error.

  8.  **Final Polish:** Organize with clear headings. Ensure the "File Drawer" and "Degrees of Freedom" points are clear. End with a strong takeaway about the shift from "trust me" to "show me."

  **(Self-Correction Note):** Make sure to mention *HARKing* (Hypothesizing After Results are Known) or *p-hacking* as reasons why the "dozen times" might yield positive results even if the effect is null.

