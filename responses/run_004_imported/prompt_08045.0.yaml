  ### **Advice for You (The Grader)**
  Since this is your friend, you might feel bad giving her a 14/20. However, in a philosophy class, swapping **Excuses** and **Exemptions** is like swapping "Necessary" and "Sufficient" conditions in logic—it changes the entire argument.

  If you give her full credit on that section, you aren't helping her learn the material for the exam. The fairest thing you can do is mark the error clearly (like I did above) so she knows to fix it before the teacher sees it, *if* your teacher allows revisions after peer review. If this is the final submission, you have to grade what's on the page. A strict TA would deduct heavily for the swap, so a 14/20 is defensible and honest.
