answer: |-
  It is genuinely impressive that you arrived at this position independently. What you have reconstructed is indeed the core of Galen Strawson's "Basic Argument," which traces back to Kant and Hume but was sharpened by Strawson in the 1980s and 90s. You have identified the *causa sui* (self-caused) problem: to be truly responsible for your actions, you must be responsible for the character that produced them, which leads to an infinite regress.

  Your two puzzles strike at the heart of why Strawson's view is distinct from both libertarians (who believe in indeterministic free will) and other skeptics (who advocate for social reform). Here is the reasoning behind Strawson's positions on both points.

  ### 1. Why Indeterminism Doesn't Help (The "Luck" Objection)

  Your intuition is shared by many: if determinism is true, I am a puppet; if indeterminism is true, the strings are cut, and I can move freely. Strawson argues that cutting the strings doesn't give you control; it just makes you a puppet dancing in the wind.

  Here is the reconstruction of his reasoning:

  **A. Control vs. Randomness**
  Moral responsibility requires *control*. For an action to be yours in a responsibility-grounding way, it must issue from *you* (your intentions, character, values).
  *   **Determinism:** The action is determined by your character. But you didn't choose your character (the Basic Argument). So, no responsibility.
  *   **Indeterminism:** Suppose there is a genuine break in the causal chain. When you make a choice, it is not fully determined by your prior character/state.

  Strawson asks: If the choice wasn't determined by your character, what determined it? If nothing determined it, it happened by **chance**.
  If you choose A over B, and that choice was not determined by your values or desires (otherwise we are back to determinism), then the difference between choosing A and choosing B is a matter of luck.

  **B. The Disappearing Agent**
  Imagine you are deciding whether to tell the truth or lie.
  *   If your character *determines* you to tell the truth, Strawson says you aren't responsible because you didn't choose your character.
  *   If your character *does not determine* the choice (indeterminism), then at the moment of choice, there is a probability you might lie. If you tell the truth, it wasn't because "you" (your character) made it happen; it was because the random neural noise went one way rather than the other.

  Strawson argues that introducing randomness does not introduce *agency*; it introduces *accident*. Being responsible for an accident is incoherent. If the action pops out of an undetermined gap, it is not *authored* by you any more than a determined action is. In fact, it is *less* authored by you, because it is disconnected from your reasons and values.

  **C. The Regress Remains**
  Even with indeterminism, the Basic Argument still applies. To be responsible for an undetermined choice, you must be responsible for the mental state that tolerated or utilized that indeterminism. But you didn't choose that mental state either. The regress of "you didn't choose the way you are" applies regardless of whether the "way you are" operates deterministically or probabilistically.

  **Summary:** Indeterminism gives you "could have done otherwise," but it robs you of "because I wanted to." Responsibility requires the latter.

  ### 2. Why Strawson Doesn't Advocate Radical Reform

  This is where Galen Strawson diverges from contemporaries like Derk Pereboom or Gregg Caruso. These philosophers agree that free will is impossible but argue we should replace retributive justice with a "public health quarantine model" and eliminate blame. Strawson is much more pessimistic (or perhaps realistic) about human nature.

  **A. The Influence of P.F. Strawson**
  Galen is the son of P.F. Strawson, who wrote the famous essay *"Freedom and Resentment."* The elder Strawson argued that "reactive attitudes" (resentment, gratitude, blame, praise) are not intellectual theories we adopt; they are constitutive of human relationships. We cannot view other humans as objects to be managed without ceasing to relate to them as people.

  Galen inherits this view. He believes that while the *metaphysics* of responsibility is impossible, the *psychology* of responsibility is inescapable.

  **B. The Distinction Between Truth and Practice**
  Strawson distinguishes between:
  1.  **Ultimate Moral Responsibility:** (Metaphysical) Impossible, as per the Basic Argument.
  2.  **Practical Responsibility:** (Psychological/Social) Inevitable.

  He argues that knowing the Basic Argument is true does not give us the power to turn off our reactive attitudes. If someone kicks your dog, you will feel anger. If someone saves your child, you will feel gratitude. You might intellectually know they weren't "ultimately" responsible, but you cannot *feel* that in the moment.

  **C. Skepticism About Reform**
  Unlike Caruso, who thinks we can rationally transition to a system without retributive blame, Galen suspects this is wishful thinking. He believes:
  *   **Retribution is natural:** The desire to punish wrongdoers (not just for safety, but because they *deserve* it) is hardwired into us.
  *   **Reform has limits:** We can make laws less cruel, and we can stop executing people based on the fiction of free will. But we cannot stop holding people responsible in our hearts.
  *   **The Tragic View:** Strawson often presents his conclusion as a tragedy. We are beings who crave ultimate responsibility and meaning, but the universe makes it impossible. We must live with this contradiction. Reforms don't solve the existential problem; they just tidy up the legal system.

  **D. "No Responsibility" vs. "No Consequences"**
  Strawson does not argue that we should stop punishing people in the sense of containment. If someone is dangerous, they must be restrained. But he agrees this is not because they *deserve* punishment in a cosmic sense. However, he doesn't think we should campaign to remove the *language* of blame from society, because he thinks it's a futile fight against human nature. He accepts that we will continue to play the "responsibility game" even though we know the game is rigged.

  ### Summary of the Strawsonian Position

  1.  **On Indeterminism:** Randomness is not freedom. If your actions aren't determined by your character, they are accidents. If they are determined by your character, you are stuck with the Basic Argument (you didn't choose your character). Either way, Ultimate Responsibility is impossible.
  2.  **On Reform:** We cannot live as if we believe the Basic Argument. Our reactive attitudes are biologically and socially hardwired. We can mitigate the worst excesses of punishment, but we cannot eliminate the human practice of holding one another responsible. We are condemned to be free, but not *ultimately* free.

  You have landed on a position that many professional philosophers spend careers debating. The tension you feel—between the logical impossibility of responsibility and the intuitive pull of chance—is exactly where the modern debate lives. Strawson's contribution is to insist that we stare directly at that impossibility without flinching, even if it offers no comfort and no clear path to social utopia.
