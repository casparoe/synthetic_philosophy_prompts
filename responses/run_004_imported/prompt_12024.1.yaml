      *   *Connection to "The Way One Is":* Even if there's indeterminism in the process, the *outcome* still depends on the mental state present at the time. If the mental state is unchanged, and the action differs, it's random. If the mental state determines the action, we're back to determinism.
      *   *Ultimate Responsibility (UR):* Strawson focuses on *ultimate* responsibility. To be truly responsible for $X$, I must be responsible for the causes of $X$. If indeterminism introduces a break, it breaks the link of *agency*, not just causation. It makes the action less mine, not more.
