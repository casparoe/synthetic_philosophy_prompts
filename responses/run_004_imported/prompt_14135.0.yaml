answer: |-
  Here is my verdict: **Skyrms naturalizes Lewis, vindicating the game-theoretic structure of convention while undercutting the epistemic definition Lewis thought was essential.** Regarding arbitrariness, stochastic stability does not destroy the concept, but it forces a crucial distinction between the *multiplicity* of equilibria (which preserves arbitrariness) and the *probability* of selecting them (which constrains it).

  Here is the breakdown of why this is the most productive way to frame the comparison for your seminar.

  ### 1. The Epistemic Break: Vindication of Structure, Rejection of Definition
  Lewis's project in *Convention* was partly descriptive and partly reductive. He wanted to show how meaning and social order could arise from rationality and common knowledge. He treated common knowledge not merely as a way conventions *happen* to persist, but as a constitutive condition of what a convention *is*.

  Skyrms undercuts this definitional claim. By demonstrating that signaling systems (the paradigmatic case of convention) emerge in populations of agents with zero cognitive capacity—agents that merely reinforce successful strategies—Skyrms shows that common knowledge is **causally unnecessary** for the phenomenon Lewis sought to describe.

  If you accept Skyrms, Lewis's definition turns out to be a description of a specific, high-cognition *subset* of conventions (perhaps those among adult humans in explicit coordination), rather than an analysis of the concept itself. Skyrms vindicates Lewis's insight that conventions are **coordination equilibria**, but he rejects Lewis's claim that they must be **sustained by reasons**. For Skyrms, conventions are sustained by **history and success**.

  **Verdict:** Lewis identified the *topology* of convention correctly (coordination problems), but he misidentified the *glue* (rational expectation vs. evolutionary stability).

  ### 2. Arbitrariness vs. Stochastic Stability
  This is the sharper philosophical conflict. Lewis defines arbitrariness counterfactually: a convention is arbitrary if there is an alternative regularity that *could* have served the same purpose. He implies a kind of symmetry: $R$ and $R'$ are equally viable.

  Peyton Young's work on stochastic stability complicates this. In many evolutionary models, while multiple equilibria exist, one is **risk-dominant**. Due to the structure of the payoff matrix and the nature of "noise" (mutations/errors) in the system, the dynamic process will converge on the risk-dominant equilibrium with probability approaching 1 over the long run.

  If the dynamics make Equilibrium A 99% likely and Equilibrium B 1% likely, is the selection of A still "arbitrary" in Lewis's sense?

  **My view is that stochastic stability refines rather than refutes arbitrariness, provided we distinguish between two layers:**

  1.  **Structural Arbitrariness:** Does the game possess multiple Nash equilibria? If yes, the *solution* is arbitrary in the sense that no single option is uniquely dictated by rationality or physical necessity. Lewis is right here.
  2.  **Dynamic Selection:** How does the population navigate the landscape? Young shows this is not symmetric. Some equilibria are "deeper basins of attraction."

  Skyrms and Young show that while the *existence* of a convention is arbitrary (we could have had no signaling system, or a different one), the *specific selection* is often biased by the topology of the problem.

  **The Verdict on Arbitrariness:** Lewis was too strong in suggesting alternatives "equally" could have taken hold. Skyrms and Young show that while alternatives *exist* (preserving the core of arbitrariness), they are not *equally probable*. This does not undercut the concept of convention, but it does undermine Lewis's suggestion that conventions are purely matters of "will" or "agreement." They are matters of **historical contingency constrained by structural stability.**

  ### 3. Synthesis for Your Seminar
  For your session, I recommend arguing that Skyrms forces us to **decouple the ontology of conventions from the psychology of agents.**

  *   **Lewis** gives us the **First-Person Perspective**: When I follow a convention, I do so because I know you know I know... and we both see the alternative. This captures the *normative force* of convention (why I feel I *ought* to drive on the right).
  *   **Skyrms** gives us the **Third-Person Perspective**: When we observe a population, we see stable signaling patterns emerge without anyone intending them. This captures the *descriptive reality* of how norms spread.

  **Final Conclusion:**
  Skyrms does not refute Lewis; he **subsumes** him. Lewisian conventions are a special case of Skyrmsian signaling systems where the agents happen to have the cognitive capacity to represent the equilibrium as common knowledge.

  However, regarding **arbitrariness**, you should argue that Lewis's definition requires modification. We must replace "equally viable alternatives" with **"multiple stable states."** Stochastic stability explains why we end up in one stable state rather than another, but the fact that *other* stable states exist (even if harder to reach) preserves the essential arbitrariness that distinguishes a convention from a law of nature.

  **In short:** Skyrms vindicates Lewis's game theory but overturns his rationalism. Arbitrariness survives, but it becomes a property of the *system's landscape* rather than the *agent's choice*.
