answer: |-
  The train car was mostly empty, the kind of late-night silence that hums in the fluorescent lights. Elias rubbed his eyes, the blue light of his phone stinging his retina. He was looking at a grant proposal from a colleague in Oxford. The ask was two million dollars. The goal: mitigate a specific vector of misalignment in recursive self-improving systems. The estimated probability of success was 0.04%. The stakes were existential.

  *Expected value,* Elias thought, the mantra of his career. *Probability times impact.* If the impact is the survival of the human species, even 0.04% is worth the budget. It was mathematically trivial. It was why he had a job.

  "You look like you're carrying the world."

  Elias looked up. A man had sat opposite him. He was young, maybe late twenties, wearing a nondescript grey hoodie. He wasn't holding a bag. His hands were open on his knees, palms up.

  "Long day," Elias said, locking his phone.

  "I need five hundred dollars," the stranger said. His voice was flat, devoid of the usual cadence of a beggar. There was no plea, just a statement of fact.

  Elias sighed, shifting his briefcase. "I don't carry cash. And I don't give to panhandlers."

  "I'm not panhandling." The stranger leaned forward slightly. "I'm offering a transaction. If you give me five hundred dollars via Venmo right now, I will prevent the simulation substrate from deleting three billion conscious instances in the next cycle."

  Elias blinked. The absurdity was so precise it felt like a joke. "A simulation."

  "Not a metaphor. I have access to a console. I can't prove it to you empirically within this layer, but I can show you the hash." The stranger pulled out a phone. He tapped a few times and turned the screen toward Elias. It was a cascade of alphanumeric code, scrolling too fast to read, overlaid on a live feed of the train car itself, but with a slight latency lag.

  Elias felt a cold prickle at the base of his neck. It was a trick. It had to be. A deepfake loop, some augmented reality app. But the latency was wrong. The people in the video feed moved a fraction of a second before the people in the car did.

  "Even if I believed you," Elias said, his voice tight, "why me? Why this train?"

  "Because you're a node," the stranger said. "You allocate capital based on expected value calculations. I checked the public records. You work for the Institute."

  Elias froze. He knew the type. Every community had its fundamentalists, the people who took the metaphors literally. But this wasn't a metaphor. This was the structure of his own life, stripped of its professional padding.

  "This is Pascal's Mugging," Elias said, feeling a surge of defensive intellect. "You know that? You're invoking a known paradox to exploit a cognitive bias."

  "I'm invoking the math you use," the stranger corrected. "You tell donors that there is a one percent chance an AI kills everyone. So they give you millions. Your probability is lower than mine. Your stake is higher, sure. But is it infinitely higher? How many future lives are there? Trillions? Quadrillions?"

  "We use a leverage penalty," Elias said automatically. "If you claim to affect more people, the probability that you are actually in a position to do so decreases proportionally."

  "Who decided that?" The stranger didn't blink. "Is that a law of physics, Elias? Or is it a patch you invented because the real math broke your budget?"

  Elias opened his mouth, then closed it. The leverage penalty *was* a patch. He'd heard the debates at conferences. Whispers in the back of the room after the keynote speakers left. *It feels arbitrary. It feels like we're rigging the equation to get the answer we want.*

  "If I pay you," Elias said, "and you're lying, I've lost five hundred dollars. If I don't pay, and you're telling the truth, I'm complicit in three billion deaths."

  "Complicit," the stranger repeated. "That's the word you use for the AI risk, isn't it? Complicity through inaction."

  Elias looked at his phone. The Venmo icon sat on his home screen. He could do it in ten seconds. Five hundred dollars was nothing to him. It was a dinner. It was a fraction of his monthly donation to the Against Malaria Foundation.

  But it wasn't about the money. It was about the integrity of the system. If he paid, he was validating the reasoning that allowed charlatans to drain resources from 'real' existential risks. If he didn't pay, he was admitting that his own reasoning had a hidden ceiling—a point where the numbers got too big and he just decided to stop believing.

  "What's the probability?" Elias asked.

  "Low," the stranger said. "Very low. One in a billion, maybe less."

  "And the stake?"

  "Three billion instances. Plus the downstream effects."

  Elias did the math. It was positive expected value. It was overwhelmingly positive. If he applied the same heuristic he used for the Oxford grant—the one that justified his salary, his office, his sense of moral urgency—he had to pay.

  He felt sick. The hum of the train seemed to deepen, vibrating in his teeth. He thought about the Oxford grant. He thought about the donors who wrote checks based on spreadsheets filled with variables they couldn't measure. He was the priest of this religion, interpreting the signs of the future. And here was a layman, holding a bible of pure logic, demanding the tithe.

  "That code," Elias said. "The latency lag. How are you doing it?"

  "Does it matter?" The stranger tilted his head. "If I showed you a peer-reviewed paper on AI alignment, would you understand the code inside the neural net? No. You trust the institution. You trust the consensus. Right now, I am the institution."

  Elias's thumb hovered over the phone. He tried to summon the bounded utility function. *I value human life, but not infinitely.* But why? Why did his utility cap out before three billion simulated souls? Was his compassion finite? If so, wasn't that a moral failing?

  "I don't have a clean answer," Elias whispered.

  "Neither do you," the stranger said softly. "That's why you're hesitating. You know the line is thin. You know you're just drawing it where it's convenient."

  The train slowed for the next station. The lights flickered.

  Elias looked at the stranger's eyes. They weren't crazy. They were tired. They looked like Elias felt.

  "If I pay," Elias said, "will you stop asking?"

  "I'll stop asking you. I have to ask someone else on the next line."

  Elias unlocked his phone. His thumb trembled. He wasn't convinced. He didn't believe the simulation story. But he didn't *disbelieve* it enough to bet three billion lives on his skepticism. And wasn't that the whole point? Acting under uncertainty?

  He tapped the screen. Entered the amount. Scanned the QR code the stranger held up.

  *Sent.*

  The stranger nodded. He stood up as the doors opened. He didn't say thank you. He didn't say goodbye. He just stepped onto the platform and vanished into the crowd.

  Elias sat alone in the car. He looked at the transaction record. *Payment to User8842.*

  He waited for the relief of having done the rational thing. He waited for the anger of having been scammed. Neither came. There was only a hollow quiet, the feeling of having stepped off a ledge and finding that gravity still worked, but the ground beneath him felt made of paper.

  He opened his email draft to the Oxford colleague. *Regarding the probability estimates...*

  He stared at the cursor blinking in the white space. He typed a sentence, then deleted it. He typed another. It all looked like noise. He locked the phone and watched his own reflection in the dark window, wondering how many versions of himself were watching him back, and whether any of them were real enough to save.
