      *   **Round 2: The "Dodge" Accusation.**
          *   *C:* This is immunization. You're rigging the game.
          *   *W:* No, I'm describing how the game is actually played. If I treat it as a hypothesis, I'm not understanding the believer.
      *   **Round 3: The Stakes (Life vs. Theory).**
