answer: |-
  The hotel bar was designed to absorb sound, a carpeted box of low lighting and expensive leather that smelled faintly of gin and floor polish. It was the kind of place where conversations went to die, or where they went to become serious.

  Judith was staring into the ice of her bourbon when she heard the voice.

  "The structure of the drink matches the structure of the belief, doesn't it? You need the bottom layer to hold the rest."

  She looked up. Aaron stood there, holding a glass of white wine that looked too delicate for his hand. Ten years had added gray to his temples and deepened the lines around his mouth, but the glint in his eye was exactly as it had been in the seminar room at Chicago.

  "Aaron," Judith said. She didn't smile, but she gestured to the empty stool beside her. "I thought you were in Zurich."

  "Sabbatical. Just got back this morning. I saw your name on the program. I assumed you'd be defending the Given."

  "I'm defending sanity, Aaron. Sit down."

  He sat. They clinked glasses, a tentative peace offering that lasted exactly three seconds.

  "I sat through your keynote," Aaron said, taking a sip. "It was elegant. Really. The way you mapped the doxastic hierarchy was clean. But you did the same thing you always do. You stopped the regress whenever it became inconvenient."

  "I stopped it where justification *requires* it to stop," Judith corrected, setting her glass down on a coaster with precise alignment. "If I claim that $P$ is justified by $Q$, and $Q$ by $R$, I cannot go on forever. If I do, I never actually justify $P$. I just postpone the justification."

  "The classic completion objection," Aaron said, nodding. "You think justification is a task that has to be finished. Like digging a hole."

  "It *is* a task. If I ask you why you believe the cat is on the mat, and you give me a reason, and I ask for a reason for that reason, and you do this forever... when am I justified? At step ten? Step one million? If the chain never terminates, the warrant never transfers."

  Aaron leaned forward, resting his elbows on the table. "That assumes the warrant has to travel from the end of the chain to the beginning. But that's your foundationalist intuition bleeding into my framework. You're imagining the reasons as links in a physical chain, where if the last link isn't bolted to a wall, the whole thing falls."

  "Isn't it?"

  "No. Think of it as a series of prompts. To be justified in believing $P$, I don't need to have traversed an infinite number of reasons. I just need to be able to provide a reason $Q$ for $P$, and if challenged on $Q$, provide $R$, and so on, *ad infinitum*, without repeating myself."

  "Peter Klein's mantra," Judith said, waving a hand. "But it ignores the cognitive reality. We are finite beings, Aaron. We die before we finish the second hundred reasons. How can an infinite chain justify a belief held by a creature that expires in the first billion seconds of the sequence?"

  "Because justification isn't about what you *have* held in your mind simultaneously. It's about what is *available* to you." Aaron tapped the table. "There's a distinction between the reasons I am currently deploying and the reasons that are available for deployment. The chain exists as a possibility space. As long as for every reason I offer, there is a further, non-repeating reason available, the belief is justified. The finitude of my mind doesn't truncate the chain; it just limits how far I've walked down it."

  Judith shook her head, a sharp, dismissive motion. "Availability is too weak. I have a billion reasons available to me for why the sky is blue, but if I don't actually possess the connection between them, they don't justify *my* belief. They just exist in the ether. You're outsourcing the work of justification to a hypothetical ideal agent, not the actual believer."

  "And you're outsourcing the work to a magic trick," Aaron countered, his voice rising slightly. "Let's talk about your terminus. You say the chain stops at a basic belief. Call it $B_0$. Why is $B_0$ justified?"

  "Because it's self-evident. Or evident to the senses. It doesn't derive its justification from another belief; it has it intrinsically."

  "Ah, intrinsic credibility." Aaron swirled his wine. "So, if I ask you why $B_0$ is true, your answer is essentially: 'Because it is.' But if I ask you why $B_1$ is true, and you say 'Because $B_0$ is,' you're admitting $B_1$ needs external support. Why does $B_0$ get a free pass? Isn't it just arbitrary? It looks to me like you're just picking a spot where you got tired of answering questions and declaring it sacred ground."

  "It's not arbitrary if the belief is non-doxastic," Judith said, her tone hardening. "The foundation isn't just another belief. It's an experience. A sensory seeming. I don't need a reason for the fact that I am *being seemed to* in a certain way. That is the bedrock. To ask for a reason for a raw feel is a category mistake."

  "But you don't believe raw feels, Judith. You believe propositions. You believe *'There is a red apple.'* That's a claim about the world. That claim can be wrong. Illusions happen. Hallucinations happen. If $B_0$ is fallible, it needs justification. If it's infallible, it's trivial. You can't have it both ways. If you stop the regress at a fallible belief without giving a reason for it, you are being dogmatic. You're saying, 'This is where I dig my heels in,' and calling it epistemology."

  "I'm calling it the only way to avoid skepticism," Judith shot back. "If you don't anchor the chain, the whole thing floats. Your 'availability' distinction is a sleight of hand. If I believe $P$ right now, I need a reason that justifies $P$ right now. A reason that *might* be available to me in five minutes, or that a smarter version of me could access, doesn't help the current epistemic status. It's like saying I'm wealthy because I *could* win the lottery tomorrow. No. You need assets in hand."

  "But your assets are counterfeit!" Aaron leaned in closer. "You say the foundation justifies itself. But justification is a relation. It's transitive. $A$ justifies $B$. How can $A$ justify $A$? If it's because of its own nature, then why doesn't *any* belief justify itself if it feels certain enough? The Infinitist avoids the arbitrariness because we never claim to have the whole truth. We admit that every reason is provisional, dependent on the next one. It keeps the inquiry open. Your foundation closes it. It kills curiosity."

  "My foundation makes knowledge possible," Judith said. "Without a terminus, you have no stability. You have an endless deferral of meaning. If every reason depends on the next, and none are secure, then nothing is secure. It's a house built on clouds. At least with foundationalism, once you hit the bedrock, you know you can build."

  "The bedrock is an illusion," Aaron said softly. "It's just the point where the water gets too deep for you to swim, so you pretend you're standing on the bottom."

  "And your ocean has no floor," Judith replied. "You're asking me to accept that a task which is impossible to complete is the very definition of success. That's not philosophy, Aaron. That's mysticism."

  "Is it?" Aaron sat back, picking up his wine. "Or is it just an honest admission that human understanding is unbounded? You want a guarantee that you're right. I'm satisfied with the ability to keep asking why."

  "And that's why your graduate students can't write dissertations," Judith said, a faint smile finally breaking through. "They never reach a conclusion."

  "And that's why your graduate students can't handle criticism," Aaron returned, matching the smile. "They think they've found the Truth with a capital T."

  They sat in silence for a moment, the hum of the hotel HVAC filling the gap. The argument hadn't moved an inch in ten years. Judith still felt the pull of the anchor; Aaron still felt the pull of the horizon.

  "Are you going to the reception?" Aaron asked.

  "In a minute," Judith said. "I need to finish this."

  "The bourbon?"

  "The thought."

  Aaron nodded. He signaled the bartender for the check. "You know, Klein passed last year."

  Judith looked up, surprised. "I didn't know. I'm sorry, Aaron."

  "Don't be. He hated being treated like a guru. He'd have loved this." Aaron put his card in the black leather folder. "He'd say the argument itself is the justification. The chain continues."

  Judith took a final sip of her drink, the ice clinking against her teeth. "Or he'd say we're just two finite minds pretending to grasp the infinite."

  "See?" Aaron stood up, buttoning his jacket. "We agree on something."

  "Don't push it."

  "See you at the podium, Judith."

  "Try not to fall off the edge, Aaron."

  He walked away toward the ballroom doors. Judith watched him go, then looked back down at her glass. She traced the condensation on the side, thinking about the bedrock, thinking about the chain, and wondering, as she always did, if the distance between them was a gap that could be bridged, or just another link in the endless sequence. She signaled the bartender for another round.
