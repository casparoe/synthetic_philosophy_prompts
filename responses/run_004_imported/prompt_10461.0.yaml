      *   **Topic:** Harsanyi's Aggregation Theorem (1955) and its claim to derive utilitarianism from decision-theoretic premises.
      *   **Core Premises:** Individuals satisfy vNM axioms, Society satisfies vNM axioms, Pareto Indifference (if everyone is indifferent, society is indifferent).
