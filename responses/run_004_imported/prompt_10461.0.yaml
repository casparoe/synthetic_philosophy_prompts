          *   It shows that *if* you are a welfarist and *if* you accept vNM rationality for society, *then* you must be a weighted utilitarian. But those "ifs" are heavy ethical lifting.
          *   Final Verdict: The theorem is a consistency result, not a justification. It shows utilitarianism is the *only* coherent welfarist aggregation method under risk, but it cannot justify welfarism or comparability itself.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I distinguish between the Aggregation Theorem and the Impartial Observer? The prompt focuses on Aggregation (Pareto + vNM). I should acknowledge that Aggregation yields *weighted* utilitarianism. Harsanyi's move to *classical* (equal weight) utilitarianism requires the Impartial Observer. I should note that even *weighted* utilitarianism requires comparability to be meaningful. If I can't compare units, the weights are arbitrary.
      *   *Check:* Diamond's objection. Is it about comparability? Some argue that if we properly accounted for "fairness utility," the sum would change. But Diamond argues fairness is non-welfarist. I need to take a stance. I will argue it reveals a limitation in the *welfarist* premise inherent in the theorem, not just the math.
      *   *Tone:* Academic, philosophical, decisive.

  5.  **Final Polish:**
      *   Ensure the verdict is clear in the intro and conclusion.
      *   Make sure Sen and Diamond are engaged *substantively*, not just namedropped.
      *   Clarify the distinction between "mathematical validity" and "ethical foundation."

  6.  *(Mental Outline of the Essay)*
      *   **Intro:** Harsanyi's ambition. Thesis: Theorem is mathematically valid but ethically incomplete; it derives form, not substance.
      *   **Body 1: The Comparability Gap (Sen).** Explain vNM scaling. Explain why summing requires common units. Harsanyi's attempt to bridge it. Why it fails without extra ethical assumptions.
      *   **Body 2: The Fairness Gap (Diamond).** Explain the coin flip. Ex-ante vs. Ex-post. Why this challenges the welfarist restriction of the theorem.
      *   **Body 3: The Verdict.** The theorem reduces social choice to a technical problem of aggregation *given* specific ethical premises. It does not generate those premises. Therefore, it is not a foundational derivation.
      *   **Conclusion:** Summarize. It's a conditional necessity, not an unconditional proof.

