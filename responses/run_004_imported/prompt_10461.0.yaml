answer: |-
  **Title:** The Form Without the Substance: Assessing Harsanyi's Aggregation Theorem

  John Harsanyi's 1955 aggregation theorem is one of the most ambitious projects in modern moral philosophy. It attempts to bridge the is-ought gap by deriving a substantive ethical conclusion—utilitarianism—from purportedly neutral premises of rational choice theory. By combining the von Neumann-Morgenstern (vNM) axioms of individual rationality with a Pareto condition on social preference, Harsanyi aimed to show that a rational society must maximize a weighted sum of individual utilities. If successful, this would transform utilitarianism from a contentious moral doctrine into a requirement of Bayesian coherence. However, despite the theorem's mathematical elegance, it fails to provide a genuine decision-theoretic foundation for utilitarianism. While the theorem validly demonstrates that *if* one accepts specific welfarist and rationality constraints, utilitarian aggregation is the only coherent option, it cannot justify those constraints themselves. Engaging with the objections raised by Amartya Sen regarding interpersonal comparability and Peter Diamond regarding procedural fairness reveals that Harsanyi's derivation relies on hidden ethical assumptions that the decision-theoretic framework alone cannot supply.

  To understand the failure, one must first appreciate the theorem's mechanism. Harsanyi posits that individuals and society both rank lotteries over social states according to the vNM axioms (completeness, transitivity, continuity, and independence). This ensures that both individual and social preferences can be represented by expected utility functions. The critical bridge is the Pareto Indifference principle: if every individual is indifferent between two lotteries, society must be as well. Mathematically, this constraint forces the social utility function ($W$) to be an affine transformation of the sum of individual utility functions ($U_i$). That is, $W = \sum a_i U_i + b$. Harsanyi argues this commits us to utilitarianism, as social welfare is strictly a function of individual welfare levels.

  The first and most devastating objection concerns the measurement of utility, famously pressed by Amartya Sen. In the vNM framework, an individual's utility function is unique only up to a positive affine transformation ($U' = aU + b$, where $a > 0$). This cardinality captures attitudes toward risk, but it does not fix a zero point or a unit of measurement that is consistent across persons. For the social sum $\sum a_i U_i$ to have ethical meaning as utilitarianism, the units of $U_i$ must be interpersonally comparable. We must know that one "util" of satisfaction for Alice represents the same magnitude of welfare as one "util" for Bob.

  Harsanyi attempted to close this gap by suggesting that individuals have similar "capacities for satisfaction" or by invoking an "impartial observer" who imagines themselves in the place of others. However, within the strict bounds of the aggregation theorem, these are extraneous assumptions. The theorem itself treats the $U_i$ functions as given inputs. Without an independent ethical stipulation that the scales are comparable, the weights $a_i$ in the aggregation formula become indeterminate. One could assign a massive weight to a dictator's utility and a near-zero weight to everyone else's, and the theorem would still hold, provided the Pareto condition is met regarding the dictator's preferences. Sen is correct that the theorem presupposes the possibility of interpersonal comparison of utility levels (or at least units) to yield classical utilitarianism, but it provides no decision-theoretic mechanism to establish it. Risk preference cardinality is not welfare cardinality. Consequently, the theorem derives the *form* of utilitarianism (linear aggregation) but leaves the *substance* (the weights and scales) ethically inert. It proves that *if* we can compare utilities, we should sum them; it does not prove *that* we can compare them.

  The second objection, articulated by Peter Diamond, attacks the sufficiency of the welfarist premises themselves. Diamond's critique focuses on the theorem's inability to account for procedural fairness. Consider a society with two individuals and one indivisible good. Option A gives the good to Person 1; Option B gives it to Person 2; Option C is a fair coin flip between them. Suppose both individuals value the good equally. Under Harsanyi's ex-ante expected utility framework, Option A, B, and C all yield the same sum of expected utilities (1 util total). The Pareto condition, applied to preferences over lotteries, renders society indifferent between handing the good to Person 1 outright and flipping a fair coin.

  Diamond argues this is counterintuitive: the coin flip has intrinsic moral value as a fair procedure, independent of the final allocation of goods. This objection is best diagnosed not merely as a clash between ex-ante and ex-post standards, but as a rejection of the theorem's underlying welfarism. Harsanyi's theorem assumes that the only relevant information for social choice is the profile of individual utility functions over outcomes (or lotteries). If "fairness" is not captured in the individual $U_i$ functions, the theorem ignores it. Defenders of Harsanyi might argue that individuals derive utility from living in a fair society, and thus fairness is already included in $U_i$. However, this reduces fairness to a preference satisfaction metric, which misses Diamond's point that fairness is a deontic constraint on how society treats its members, not just another commodity they consume. If the theorem cannot accommodate the moral significance of procedural justice without redefining it as a preference, it fails to capture the full scope of ethical reasoning. It shows that Bayesian rationality is incompatible with non-welfarist concerns, which is an argument against the scope of Bayesian rationality in ethics, not a proof of utilitarianism.

  These two objections converge on a single verdict: Harsanyi's theorem is a consistency result, not a foundational derivation. It successfully demonstrates that utilitarian aggregation is the unique method compatible with vNM rationality and Pareto efficiency. However, this is a conditional victory. The theorem does not validate the premises; it merely exposes their implications. The requirement for interpersonal comparability (Sen) is an ethical assumption smuggled into the mathematical setup, and the exclusion of procedural fairness (Diamond) is a consequence of the welfarist restriction inherent in the Pareto principle.

  Therefore, Harsanyi's theorem does not succeed in giving utilitarianism a genuine decision-theoretic foundation. A genuine foundation would derive ethical conclusions from purely non-ethical premises (such as logic or rationality). Instead, Harsanyi derives ethical conclusions from ethical premises disguised as rationality constraints. The Pareto principle is itself a normative claim about the supremacy of individual welfare, and the assumption that social risk choices should mirror individual risk choices (vNM for society) is a contentious moral stance, not a logical necessity.

  In conclusion, Harsanyi's aggregation theorem should be viewed as a powerful clarification of what utilitarianism entails rather than a proof of its truth. It tells us that if we commit to welfarism, Bayesian rationality, and interpersonal comparability, we are logically committed to weighted utilitarianism. But since the theorem cannot generate comparability or justify the exclusion of non-welfarist values like procedural justice from within its own axioms, it remains ethically incomplete. The theorem shows that utilitarianism is *coherent* with rational choice theory, but it does not show that rational choice theory *requires* utilitarianism. Thus, the search for a purely decision-theoretic foundation for ethics remains unfulfilled.
