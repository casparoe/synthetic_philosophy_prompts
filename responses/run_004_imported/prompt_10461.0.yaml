      *   *Section 3: The Fairness Objection (Diamond).* The coin flip example. Ex-ante (expected utility) vs. Ex-post (actual outcome fairness). Harsanyi's theorem focuses on ex-ante welfare. Diamond argues for procedural justice. This suggests the vNM framework itself might be too narrow to capture all moral values (like fairness of process).
      *   *Section 4: Synthesis/Verdict.* Do these objections kill the project? Not entirely, but they limit it. The theorem shows that *if* you accept vNM rationality and Pareto, you get a weighted sum *structure*. But it doesn't tell you the *weights* or guarantee the *scale* is comparable. It derives "formal utilitarianism" but not "substantive classical utilitarianism" (equal weights, comparable units).
      *   *Conclusion:* Reiterate verdict. The theorem is a powerful consistency check, not a foundational derivation.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Start with the allure of Harsanyi's project. Turning "ought" into "rational choice." State the verdict: The theorem establishes the *functional form* of social welfare but fails to secure the *ethical content* of utilitarianism without smuggling in normative assumptions regarding interpersonal comparability and the scope of welfare.

      *   **The Theorem's Mechanism:** Keep it brief. Individuals have $U_i$. Society has $V$. Pareto Indifference implies $V$ depends on $U_i$'s. vNM axioms imply linearity. Result: $V = \sum a_i U_i + b$. Harsanyi argues for equal weights ($a_i$) via the "veil of ignorance" (though the prompt focuses on the 1955 aggregation theorem, not necessarily the 1953/1955 veil of ignorance argument, I should distinguish them. The prompt specifies the 1955 Aggregation Theorem premises: vNM + Pareto. The equal weights usually come from the Impartial Observer argument. I need to be careful not to conflate the two, though they are related. The prompt asks about the *Aggregation Theorem* specifically. The Aggregation Theorem yields *weighted* utilitarianism. Harsanyi *argues* for equal weights elsewhere. I must focus on whether the Aggregation Theorem *itself* justifies utilitarianism. Actually, the prompt says "Harsanyi took this as proof that Bayesian rationality plus a minimal Pareto condition commits us to something like utilitarianism." I need to address if the *sum* itself is enough for utilitarianism, even if weights are arbitrary.)
      *   *Correction:* The Aggregation Theorem proves the social utility function is a linear combination. It does *not* prove the weights are equal. Harsanyi needs the Impartial Observer argument for equal weights. However, the prompt asks if it gives utilitarianism a foundation. Weighted utilitarianism is still utilitarianism. The bigger issue is the *scale*.

      *   **Objection 1: Interpersonal Comparability (Sen):**
          *   vNM utility measures strength of preference under risk.
          *   $U_i$ is unique up to positive affine transformation ($aU + b$).
          *   To sum $U_1 + U_2$, the units must match. Does "1 util" for Alice mean the same as "1 util" for Bob?
          *   Harsanyi's defense: Similar biological/psychological makeup? Or the "extended preferences" approach?
          *   Critique: The theorem *assumes* we can plug $U_i$ into the same equation. But without an independent ethical stipulation that units are comparable, the weights $a_i$ absorb the scaling differences. If Alice's unit is huge and Bob's is tiny, a high $a_i$ for Bob might just correct the scale.
          *   Verdict on this point: The theorem requires *cardinal unit comparability* (CUC) to be ethically meaningful as classical utilitarianism. The theorem doesn't generate CUC; it presupposes the possibility of it. Sen is right: it's ethically inert without this.

      *   **Objection 2: Procedural Fairness (Diamond):**
          *   The Example: One good, two people. Option A: Give to Person 1. Option B: Give to Person 2. Option C: Coin flip.
          *   If $U_1(Good) = U_2(Good) = 1$, then Ex-Ante EU for C is 0.5 each. Sum = 1. Ex-Ante EU for A is 1 for P1, 0 for P2. Sum = 1.
          *   Harsanyi/Pareto says Society is indifferent between A and C (if we look at ex-ante expected utility).
