          1.  The Measurement/Comparability Objection (Sen): Utility is unique only up to positive affine transformation (zero point/unit). Does this allow interpersonal comparison needed for utilitarianism?
          2.  The Fairness/Procedure Objection (Diamond): The theorem ignores procedural fairness (e.g., coin flips vs. arbitrary assignment) if expected utilities are identical. Is this an ex-ante vs. ex-post clash? A comparability issue? Something else?
      *   **Requirement:** Reach and defend a *definite verdict* (no fence-sitting).

  2.  **Initial Brainstorming & Structuring:**
      *   *Introduction:* State Harsanyi's claim (rationality + Pareto $\rightarrow$ Utilitarianism). State the thesis/verdict early or build towards it. (I think the verdict should be that the theorem is mathematically sound but ethically incomplete; it derives *form* but not *substance* of utilitarianism without extra ethical inputs.)
      *   *Section 1: The Theorem's Logic.* Briefly explain how it works. vNM utilities represent risk attitudes. Pareto ensures social welfare tracks individual welfare. The math yields a weighted sum.
