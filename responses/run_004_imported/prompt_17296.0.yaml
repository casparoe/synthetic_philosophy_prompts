      *   **Constraint:** Engage seriously with the arguments in *The Querist*, not just philosophical immaterialism riffing.

  2.  **Deconstruct Berkeley's *The Querist*:**
      *   *What is it?* A series of queries (questions) published in the 1730s regarding Ireland's economic stagnation.
      *   *Key Theses:*
          1.  **Money is not wealth:** Gold and silver are not the end goal. Real wealth is the produce of the land and the industry of the people (Queries 1-50ish).
