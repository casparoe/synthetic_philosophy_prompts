answer: |-
  **Memorandum**
  **To:** Reading Group Participants
  **From:** [Your Name]
  **Subject:** Re: Normative Diagnosis of Information Cascades (BHW/Banerjee)

  The contention that information cascades represent a "breakdown of collective rationality" or a failure of the "wisdom of crowds" rests on a category error regarding the locus of the inefficiency. While it is indisputable that the *social outcome* of a cascade is often informationally inefficient (i.e., the probability of selecting the wrong state does not converge to zero as $N \to \infty$), labeling this phenomenon "collective irrationality" conflates the failure of a specific information topology with a failure of agent reasoning.

  The stronger, more precise diagnosis is that cascades are the equilibrium result of a **positive informational externality** in a sequential decision environment with observable actions but unobservable signals. The "fragility" of cascades is not evidence of instability or irrationality; rather, it is the structural signature confirming that private information is being suppressed, not aggregated. Furthermore, we must rigorously distinguish this payoff-relevant informational mechanism from the reputational herding found in Scharfstein–Stein environments.

  Here is the case for the externality diagnosis.

  ### 1. Individual Rationality vs. Social Optimality
  The "collective irrationality" framing implicitly invokes the Condorcet Jury Theorem (CJT) as the normative benchmark. Under CJT, if agents vote independently based on private signals, the majority decision converges to the truth almost surely. When BHW cascades fail to achieve this, the temptation is to declare a failure of rationality.

  However, CJT assumes a mechanism (simultaneous voting on signals) that does not exist in the BHW setup. In the BHW sequential game, agents maximize expected utility given their information sets $\mathcal{I}_t = \{s_t, a_1, \dots, a_{t-1}\}$. An agent enters a cascade only when the public likelihood ratio, derived from the history of actions, overwhelms the likelihood ratio of their private signal. At that threshold, imitating the predecessor is the unique Bayesian-Nash equilibrium strategy.

  To call this "irrational" is to argue that agents *should* sacrifice their own expected payoff to improve the information set of downstream agents. That is not a requirement of rationality; it is a requirement of altruism. The divergence between the decentralized equilibrium and the social planner's solution (who would compel agents to reveal signals) is the textbook definition of an externality problem. The "failure" lies in the institutional design (observability of actions only), not in the cognitive processing of the agents. The system is not "irrational"; it is **incentive-incompatible** for full information revelation.

  ### 2. Fragility as Evidence of the Externality
  A common intuition against the rationality view is the well-known fragility of cascades: a cascade based on the actions of thousands of agents can be overturned by a single public signal or a small shift in priors. The "collective irrationality" proponent might argue that a rational aggregation process should be more robust—that the weight of thousands of agreeing agents should not be so easily dismissed.

  I argue the opposite: **Fragility is the smoking gun of the informational externality.**

  If the cascade were a robust aggregation of information, overturning it would require evidence proportional to the number of agents. The fact that it is fragile proves that the "weight" of the cascade is not proportional to $N$. Once the cascade begins (say, at $t=3$), actions $a_4, \dots, a_N$ contain *zero* incremental information about the state. They are identical regardless of the underlying signals $s_4, \dots, s_N$.

  Therefore, the public belief freezes at the level it reached at $t=3$. The fragility demonstrates that the apparent consensus is an illusion built on a very small effective sample size. This directly supports the externality diagnosis:
  1.  Agents $4 \dots N$ possess private information ($s_t$).
  2.  They rationally choose not to reveal it via their actions because the private cost of deviating from the public history outweighs the private benefit.
  3.  Because that information is suppressed, the public belief remains "thin."
  4.  Consequently, the public belief is easily perturbed by new public information.

  If agents were behaving "irrationally" (e.g., via some psychological conformity bias), we might expect the cascade to exhibit hysteresis or stickiness unrelated to the likelihood ratios. Instead, the cascade breaks exactly when the new information shifts the posterior enough to make the private signal pivotal again. This sensitivity confirms that agents are constantly monitoring the payoff-relevant evidence, ready to act on their private information the moment the public history ceases to dominate it. That is the behavior of a rational Bayesian, not an irrational conformist.

  ### 3. Distinction from Scharfstein–Stein (Reputational Herding)
  It is vital to distinguish the BHW mechanism from the herding described by Scharfstein and Stein (1990), as conflating the two weakens the externality argument.

  *   **BHW (Informational Cascades):** Agents care about the **state of the world** ($\omega$). The externality is purely informational. Agent $t$ ignores $s_t$ because $a_{t-1}$ is a sufficient statistic for $\omega$ that dominates $s_t$. There is no strategic concern about how other agents perceive $t$'s ability.
  *   **Scharfstein–Stein (Reputational Herding):** Agents (e.g., fund managers) care about the **market's inference of their ability/type**. They herd to avoid looking like an outlier with low ability. Here, the inefficiency arises because agents ignore their private signals to manipulate the posterior belief about their *own competence*, not necessarily because the public history dominates the private signal regarding the asset's value.

  In S-S, the herding is driven by career concerns (a different kind of externality). In BHW, the herding is driven by the **non-excludability of information**. Once Agent 1 and 2 reveal their signals through actions, that information becomes a public good. Agent 3 free-rides. By calling BHW cascades "collective irrationality," we risk psychologizing what is actually a rigorous free-rider problem. In BHW, if you could price the information contained in $s_t$ and compensate Agent $t$ for revealing it, the cascade would not occur. In S-S, even with compensation, the reputational incentive might still distort behavior depending on the correlation structure of signals.

  ### 4. Conclusion: A Design Failure, Not a Cognitive One
  The "collective irrationality" framing is seductive because it focuses on the suboptimal social welfare outcome. However, in economics, we routinely distinguish between Pareto-inefficient equilibria and irrational behavior. A Prisoner's Dilemma is not evidence of "collective irrationality"; it is evidence of conflicting incentives in a non-cooperative setting.

  The BHW cascade is the sequential-learning equivalent of the Prisoner's Dilemma. The agents are trapped in a low-information equilibrium not because they cannot compute the Bayesian update, but because the structure of the game makes the provision of information a dominant strategy only for the first few movers.

  The fragility of the cascade confirms that the "crowd" is not wise because the crowd is not actually voting; they are free-riding. To diagnose this as a failure of rationality is to blame the drivers for a traffic jam caused by a bottleneck in the road design. The bottleneck here is the observability of actions rather than signals. Recognizing this distinction is crucial for social epistemology: the remedy is not to train agents to be "more rational" (they are already Bayesian optimal), but to design institutions that internalize the informational externality (e.g., mechanisms that incentivize signal revelation or obscure early actions to prevent premature cascading).

  The cascade is not a breakdown of reason; it is the logical consequence of rational agents navigating an environment where information is a public good with no market price.
