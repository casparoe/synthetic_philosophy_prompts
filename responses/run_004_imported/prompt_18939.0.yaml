answer: |-
  **MEMORANDUM**

  **TO:** Forecasting Program Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Scoring Rule Retention (Brier vs. Log Score)

  ### Executive Summary

  After reviewing the proposal to transition from Brier Score to Logarithmic (Log) Score, I recommend we **retain the Brier Score** as our primary metric for personnel selection, supplemented by a new "Extreme Overconfidence" audit.

  While the Log Score advocates are theoretically correct regarding strict propriety and locality, those properties optimize for *belief elicitation* in infinite horizons, not *personnel selection* in finite, high-stakes contexts. Given that these scores determine eligibility for grantmaking advisory roles, robustness and signal-to-noise ratio must take precedence over theoretical purity. The variance inherent in Log Scoring introduces unacceptable noise into our selection process over quarterly timeframes.

  ### Context and Stakes

  Our forecasting program serves two distinct functions:
  1.  **Epistemic:** Improving individual calibration and accuracy.
  2.  **Operational:** Identifying staff capable of advising on high-stakes grantmaking decisions.

  The tension in this debate stems from conflating these two goals. A scoring rule ideal for function (1) is not necessarily ideal for function (2). Because the output of this program directly influences who advises on capital allocation, we must prioritize a metric that reliably identifies consistent judgment rather than one that maximally penalizes specific types of error at the cost of high variance.

  ### Analysis of the Log Score Proposal

  **The Argument For:**
  The proponents of Log Score raise valid theoretical points. Log Score is a *strictly proper* scoring rule, meaning it maximizes expected score only when a forecaster reports their true credence. It is also *local*, meaning the score depends only on the probability assigned to the outcome that actually occurred, not the counterfactuals.

  From the perspective of **Epistemic Utility Theory**, Log Score is often preferred because it aligns with information theory (minimizing surprisal/entropy). It heavily penalizes overconfidence (e.g., assigning 99% to an event that does not happen). In a pure truth-seeking environment, this is desirable: it forces forecasters to treat "certainty" with the gravity it deserves.

  **The Operational Risk:**
  However, Log Score is unbounded. A single prediction of 1% on an event that resolves True results in a score of $\ln(0.01) \approx -4.6$. A single prediction of 0.1% that resolves True results in $\approx -6.9$. In a weekly tournament with ~10 questions per quarter, **one "black swan" error can mathematically eliminate a participant from contention**, regardless of their performance on the other 9 questions.

  This creates two problems for our specific context:
  1.  **Selection Noise:** We risk filtering out our best judges due to bad luck or genuine uncertainty on low-probability events, rather than poor judgment.
  2.  **Risk Aversion:** Forecasters may learn to avoid making sharp predictions on difficult questions to protect their score, reducing the informational value of their forecasts for our grantmaking decisions.

  ### Analysis of the Brier Score Retention

  **The Argument For:**
  Brier Score ($1 - (p - o)^2$) is bounded between 0 and 1. It is also strictly proper, though not local. Its primary advantage is **robustness**. An error on a low-probability event hurts, but it does not catastrophically tank a quarter's performance. This stability is crucial when using scores as a proxy for employee capability.

  Furthermore, Brier Score is intuitively interpretable for staff who are not forecasting specialists. This lowers the barrier to entry and encourages participation, which improves our internal data pool.

  **The Theoretical Trade-off:**
  The Brier holdouts must acknowledge the theoretical cost. Because Brier is not local, it technically incentivizes forecasters to care about the probabilities assigned to false outcomes. In practice, this can lead to slight hedging. However, empirical literature suggests that for human forecasters over short horizons, the difference in calibration quality between Brier and Log optimization is negligible compared to the difference in participation rates and score stability.

  ### Decision Rationale: Fit for Purpose

  The core disagreement is not about math; it is about **utility functions**.

  The Log Score advocates are optimizing for *Epistemic Utility* (maximizing the accuracy of the probability distribution itself). We, however, are optimizing for *Decision Utility* (selecting reliable advisors for grantmaking).

  In a grantmaking context, we need advisors who are:
  1.  Generally well-calibrated.
  2.  Resilient to outlier events.
  3.  Willing to make calls without fear of career-impacting score volatility.

  Log Score optimizes for (1) at the expense of (2) and (3). Brier Score balances all three. Since we are using this data for HR-adjacent decisions (team selection), we cannot accept a scoring rule where variance dominates signal over a 12-week period. Epistemic Utility Theory is not "settled" in a way that overrides operational risk management; it simply defines a different objective function than the one we need.

  ### Recommendation and Mitigation

  **1. Retain Brier Score for Ranking.**
  We will continue to use Brier Score to rank participants for quarterly team selection. This ensures that selection is driven by consistent performance rather than vulnerability to single-event variance.

  **2. Implement an "Extreme Overconfidence" Audit.**
  To address the valid concern that Brier Score under-punishes dangerous overconfidence (e.g., saying 99% and being wrong), we will add a secondary filter.
  *   **Mechanism:** Any staff member who assigns >95% probability to an outcome that resolves False more than twice in a quarter will trigger a manual review.
  *   **Consequence:** This does not automatically disqualify them, but it flags their calibration curve for the Committee. If the overconfidence is systemic, they are ineligible for the advisory team regardless of their Brier Score.

  **3. Educational Clarification.**
  We will update our onboarding materials to clarify *why* we use Brier. We should explicitly state: *"We use Brier Score because it rewards consistency and protects against outlier noise, which is appropriate for personnel selection. Log Score is theoretically elegant but operationally volatile for short-term tournaments."* This validates the theoretical knowledge of the Log proponents while explaining the operational constraint.

  ### Conclusion

  Switching to Log Score would be a victory for theoretical elegance at the cost of operational fairness. By retaining Brier Score and adding a specific guardrail for extreme overconfidence, we satisfy the need for robust personnel selection while mitigating the risk of rewarding dangerous certainty.

  I request the Committee's approval to proceed with this hybrid approach for the Q4 cycle.
