  *(Final Decision)*: Recommend **Brier Score** for the primary ranking mechanism, supplemented by a **Calibration/Overconfidence Audit**. This directly addresses the "grantmaking advice" stakes (we don't want overconfident wrong people) without the variance issues of Log scoring.

