answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm a friend of the couple, and I work in mathematical logic. Which, as it turns out, is the only appropriate background for explaining how [Partner A] and [Partner B] fell in love.

  They met co-authoring a paper on program equilibrium. For the half of you who are nodding, you know exactly what that means. For the rest of you—mostly family, who I love dearly—you should know that their field studies how independent agents decide to trust one another.

  Their running joke is that their relationship follows the logic of "FairBot." In their research, two agents want to cooperate, but neither wants to be the sucker. If I say, "I'll commit if you commit," and you say, "I'll commit if you commit," we end up in a standoff. An infinite loop of waiting for the other person to blink. In logic, we call this an infinite regress. In dating, we call it "talking stages" that last three years.

  The breakthrough in their research—and in their relationship—comes from a result called Löb's Theorem. Without getting into the modal logic, Löb found a way to turn that infinite loop into a fixed point. It allows an agent to say: "I will cooperate, because I can see that our cooperation is logically inevitable." It breaks the "you first" paradox. It allows trust to exist without requiring one person to jump off the cliff before the other.

  [Partner A] and [Partner B] joke that they only really committed once they'd pulled this "Löbian move" on each other. They stopped simulating every possible future outcome to check for safety, and instead found a fixed point where cooperation was the only stable state.

  But here is the part where I, as a logician, have to be honest. [Partner A] and [Partner B] are not computer programs. They do not have source code. I cannot read [Partner B]'s mind to verify his algorithms, and [Partner A] cannot run a simulation of [Partner B]'s future behavior. Human beings are opaque. We are messy. We change. We are not verifiable.

  If trust required perfect verification, no marriage would ever happen.

  So, why does this logic still matter? Why stand up here, in front of witnesses, and make a vow?

  Because in the absence of source code, we need something else to break the regress. We need a "fixed point" in the real world.

  In logic, Löb's Theorem works because the system can see its own proof. In life, a wedding vow works because it is public. When you say "I do" in front of your family, your friends, and your community, you are creating a piece of common knowledge. Everyone here knows you are committed. You know that everyone knows. And you know that your partner knows that everyone knows.

  That publicity changes the structure of the game. It stops the infinite loop of "What if they change their mind?" or "What if I'm the only one trying?" By making the promise public, you make the cost of defection high, and the stability of cooperation tangible. You are building a structure where the most rational, most human, and most loving move is to keep trusting.

  The vow doesn't prove you are perfect. It proves you are willing to be bound. It turns the terrifying question "Will you love me tomorrow?" into a stable fact: "We have chosen to love each other."

  [Partner A] and [Partner B], you have spent your careers studying how agents can cooperate in uncertain worlds. Today, you move from theory to practice. You acknowledge that you cannot verify each other like code. But you have chosen to create a fixed point anyway. You have chosen to make your love a logical necessity of your lives.

  So, if everyone could please raise a glass.

  To the infinite regress of doubt, and the courage it takes to end it.
  To the public proof of your private commitment.
  And to the fixed point you have found in each other.

  To [Partner A] and [Partner B].
