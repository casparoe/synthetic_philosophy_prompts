      *   **Separability/Reduction of Compound Lotteries:** Standard EU assumes a compound lottery (Lottery A then Lottery B) is equivalent to a single-stage lottery with the reduced probabilities. REU *can* treat them differently depending on how the risk function is applied (to the whole tree or branch-by-branch).
      *   **The Problem:** If an agent prefers $L_1$ to $L_2$ at the start, but upon reaching a node where the choice is effectively between components of $L_1$ and $L_2$, they reverse preference, they are dynamically inconsistent. This opens them to money pumps.
