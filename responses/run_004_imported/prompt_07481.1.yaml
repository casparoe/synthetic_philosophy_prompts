answer: |-
  You have put your finger on the single most contentious issue in the reception of Buchak's *Risk and Rationality*. Your intuition is correct: the dynamic consistency problem is the Achilles' heel of Risk-Weighted Expected Utility (REU) theory.

  While Buchak provides a sophisticated defense, it is entirely defensible to argue that REU cannot escape the dynamic-consistency bind without accepting one of the two horns of the dilemma you proposed. Below is an argument fleshing out that dilemma, analyzing why Buchak's solutions (resolute choice and the rejection of the reduction of compound lotteries) ultimately force her into one of these two corners.

  ### 1. The Setup: Why REU Breeds Dynamic Inconsistency

  To see why the bind is inescapable, we must first locate the source of the tension. REU maximizes:
  $$ REU(L) = \sum_{i} [r(P(E_i)) - r(P(E_{i+1}))] \cdot u(x_i) $$
  where $r$ is a non-linear risk function.

  Because $r$ is non-linear, REU violates the **Independence Axiom**. This allows it to accommodate Allais preferences (preferring a sure thing over a high-probability gain, but reversing that preference when probabilities are scaled down).

  However, in a multi-stage decision tree, violating Independence typically leads to **Dynamic Inconsistency**.
  1.  **At $t_1$ (Ex-ante):** The agent prefers Plan A (which involves a risky sub-gamble later) over Plan B.
  2.  **At $t_2$ (Ex-post):** The agent reaches the node where the sub-gamble is to be played. Because the probabilities have now shifted (some uncertainty has been resolved), the weighting function $r$ applies differently to the remaining branches. The agent now prefers the option they intended to reject at $t_1$.

  If the agent follows their current preferences at $t_2$ (a strategy known as **Sophisticated Choice** or backward induction), they will deviate from the plan. If they are **Naive**, they get money-pumped. To avoid the pump while keeping the Allais preference, they must be **Resolute**.

  ### 2. Horn (a): The Collapse into EU over Richer Outcomes

  Your first horn suggests that REU can only save dynamic consistency by collapsing into ordinary Expected Utility (EU) maximization over a history-indexed outcome space.

  **The Argument:**
  Dynamic consistency is guaranteed if the object of choice is the entire decision tree (the "whole path") rather than the local nodes. If an REU agent treats the sequence "Play Gamble 1, then Gamble 2" as a distinct outcome from "Play Gamble 3," they are effectively individuating outcomes by their history or the structure of the gamble.

  If we allow outcome individuation to be this fine-grained, an EU maximizer can mimic any REU preference.
  *   **REU Explanation:** "I chose the safe option because I am risk-averse (concave $r$-function)."
  *   **EU Explanation:** "I chose the safe option because I assign higher utility to the outcome '\$1M won via a safe bet' than to '\$1M won via a risky bet'."

  **Why this is a collapse:**
  If the REU theorist insists that dynamic consistency requires evaluating the whole tree as a single package to prevent preference reversal, the specific functional form of REU (the $r$-function applied to probabilities) loses its distinctive explanatory power.
  1.  **Redundancy:** If the "risk attitude" is entirely captured by how the agent values specific paths (e.g., valuing "certainty" as a property of the outcome), then we don't need a separate risk function $r$. We can just bake that preference into $u$.
  2.  **Loss of Structural Insight:** Buchak's main selling point is that risk is a *structural* attitude toward the probability distribution, not just a preference for certain goods. But if maintaining rationality (dynamic consistency) requires treating the structure *as* the good, the distinction between "attitude toward risk" and "preference for outcomes" blurs.

  **Verdict on (a):** REU does not mathematically collapse into the EU formula ($\sum p \cdot u$), but it **conceptually collapses** into a framework where risk attitudes are indistinguishable from outcome preferences. This undermines Buchak's claim that REU captures a distinct category of rationality separate from standard utility maximization.

  ### 3. Horn (b): The Costly Bullet of Resolute Choice

  Your second horn suggests that if REU avoids the collapse by maintaining its distinct functional form, it must accept a bullet (Resolute Choice) that is at least as costly as the Allais violations it was designed to accommodate.

  **The Argument:**
  Buchak explicitly advocates for **Resolute Choice**. The agent makes a plan at $t_1$ and binds their future self to it at $t_2$, even if their local preferences at $t_2$ have changed. She argues this is a feature of rational agency, not a bug.

  However, Resolute Choice violates the principle of **Separability** (or Dynamic Consistency). Separability states that preferences at a decision node should depend only on the future consequences available from that node, not on the past history or the plan made previously.

  **Why this bullet is costly:**
  1.  **The Money Pump Threat:** The standard argument against violating Separability is the money pump. If you are not dynamically consistent, a cunning bookie can extract money from you. Buchak argues Resolute Choice blocks the pump (because you don't deviate), but critics (like Briggs 2010, Thoma 2018) argue this is ad hoc. It requires a "magical" ability to ignore your current preferences without an external pre-commitment device.
  2.  **Comparative Cost:**
      *   **The Allais Violation:** Violates **Independence**. Many decision theorists (including Savage) argue Independence is constitutive of rationality, but others (including Buchak) argue it is too restrictive for risk.
      *   **The Resolute Choice Violation:** Violates **Separability/Dynamic Consistency**. Most decision theorists regard Dynamic Consistency as *more* fundamental than Independence. Independence is about how you weigh probabilities; Separability is about whether you are a unified agent over time.
      *   **The Trade-off:** To save the intuition that Allais preferences are rational (a substantive claim about risk), Buchak requires agents to violate a procedural constraint on temporal rationality (Separability). Many critics argue that violating Separability is a *higher* cost because it threatens the very coherence of the agent as a single entity over time.

  **Verdict on (b):** Accepting Resolute Choice saves REU from money pumps, but only by violating Separability. Since Separability is often viewed as a stricter requirement for rationality than Independence, the "cost" of this bullet is indeed at least as high as the cost of abandoning Allais preferences.

  ### 4. Buchak's Defense and Why It Fails to Dissolve the Dilemma

  Buchak anticipates this. She argues that **Reduction of Compound Lotteries (RCL)** is not a normative requirement for REU. She claims that a compound lottery is not the same gamble as its reduced form because the risk function applies to the *structure* of the uncertainty.

  *   **Her Claim:** It is rational to care *how* uncertainty resolves, not just the final distribution. Therefore, dynamic inconsistency isn't a flaw; it's a reflection of the fact that the choice situation at $t_2$ is genuinely different from $t_1$.
  *   **The Counter:** This defense leans heavily on Horn (a). If the choice situation at $t_2$ is "genuinely different" because the history matters, then we are back to individuating outcomes by history. If we do that, we are back to the EU-collapse worry: the "risk attitude" is just a preference for specific historical paths.

  Furthermore, regarding Resolute Choice, Buchak argues that rational agents have the capacity to make plans and stick to them. However, as Richard Pettigrew and others have noted, this moves the burden from *decision theory* to *philosophy of action*. It assumes a faculty of "resolution" that standard decision theory does not model. If decision theory is supposed to tell us what to choose based on our preferences, a theory that says "ignore your current preferences" is arguably failing to guide choice.

  ### Conclusion

  Your dilemma is robust.

  1.  **If REU preserves Dynamic Consistency** by treating the whole tree as the object of choice, it risks **collapsing into EU** over a richer outcome space, thereby losing its claim to model a distinct *structural* attitude toward risk.
  2.  **If REU preserves its distinct structural account** of risk (via the $r$-function), it must endorse **Resolute Choice**, which violates Separability. This violation is widely considered a **costlier bullet** than violating Independence, as it exposes the agent to charges of diachronic irrationality that are arguably more severe than Allais-type preferences.

  Buchak's project succeeds in showing that Allais preferences *can* be formalized without violating Stochastic Dominance. However, it does not successfully show that they can be formalized without violating other core tenets of rational choice theory (Separability/Dynamic Consistency). Thus, REU does not so much *solve* the problem of Allais preferences as it *relocates* the irrationality from the Independence Axiom to the principle of Separability.

  You are not misremembering; you have correctly identified the price of admission for REU theory.

  **References for further digging:**
  *   **Briggs, R. (2010).** "Putting a Value on Beauty." (Critique of REU and dynamic consistency).
  *   **Thoma, J. (2018).** "Risk and Diachronic Rationality." (Argues Resolute Choice is too costly).
  *   **Pettigrew, R. (2015).** "Risk and Rationality." (Review discussing the dynamic consistency issue).
  *   **Buchak, L. (2013).** *Risk and Rationality.* (Specifically Chapter 6 on Dynamic Choice).
