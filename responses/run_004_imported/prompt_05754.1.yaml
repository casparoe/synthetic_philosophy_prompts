answer: |-
  You and your friend are both right, but you are playing two different games. This is a classic clash between **Decision Theory** (your friend's territory) and **Game Theory/General Equilibrium Economics** (your territory).

  The short answer is: **Good's Theorem** holds for a single decision-maker facing "nature," where the rules of the game don't change based on what you know. **The Hirshleifer Effect** applies to multi-agent markets, where the rules of the game (prices, contract availability) *change* specifically because everyone knows the information.

  Here is the breakdown of both results, and the exact assumption where they diverge.

  ---

  ### 1. Your Friend's Case: Good's Theorem (1967)
  **The Claim:** For a rational Bayesian agent, the expected utility of making a decision *after* receiving free information is always at least as high as making the decision *before* receiving it.

  **The Logic:**
  Imagine you have to choose between Action A and Action B.
  *   **Without info:** You pick the one with the higher expected value based on current probabilities.
  *   **With info:** You get a signal. Now you can pick A if the signal says "good" and B if the signal says "bad."
  *   **The Kicker:** Even if the information turns out to be useless, you can always choose to ignore it and do exactly what you would have done anyway. Therefore, having the option to use the info can never be worse than not having the option.

  **Key Assumptions:**
  1.  **Single Agent:** It is you vs. Nature. There are no other strategic players reacting to your knowledge.
  2.  **Fixed Payoff Structure:** The rewards and penalties for Action A or B do not change depending on whether you know the information.
  3.  **Costless Information:** The signal itself costs nothing to acquire.

  **Verdict:** In a vacuum, your friend is mathematically correct. Information gives you more flexibility, and flexibility has non-negative value.

  ---

  ### 2. Your Case: The Hirshleifer Effect (1971)
  **The Claim:** Public information can reduce social welfare (and individual welfare) by destroying risk-sharing opportunities.

  **The Logic:**
  Insurance markets work by pooling **uncertainty**.
  *   **Scenario A (Ignorance):** Nobody knows who will get sick. Healthy people subsidize sick people. Everyone buys insurance. Risk is pooled. Everyone is happy (high expected utility due to risk aversion).
  *   **Scenario B (Perfect Info):** A genetic test reveals exactly who will get sick.
      *   The insurance company now knows you are high-risk. They charge you a premium equal to the full cost of treatment.
      *   The insurance company knows the other guy is low-risk. He refuses to pay high premiums to subsidize you.
      *   **Result:** The risk-sharing contract collapses. The high-risk person is uninsurable. The low-risk person is self-insured. Both are effectively worse off than when they were pooling risk, because the *uncertainty* was the asset that allowed them to trade.

  **Key Assumptions:**
  1.  **Multi-Agent/Market:** Your payoff depends on other people's actions (insurers pricing, other customers buying in).
  2.  **Endogenous Payoffs:** The "price" of the action (insurance premium) changes *because* the information became public.
  3.  **Risk Aversion:** Agents prefer a smooth consumption path over a volatile one.

  **Verdict:** In a market context, you are correct. Information can destroy the very mechanism (insurance) that provided value.

  ---

  ### 3. The Breaking Point: Which Assumption Fails?

  You are talking past each other because Good's Theorem relies on an assumption that the Hirshleifer scenario explicitly violates.

  **The Broken Assumption:**
  > **Good's Theorem assumes the set of available actions is independent of the information signal.**

  In Good's framework, whether you know the signal or not, Action A (buying insurance) is always available to you at the same price. The information only changes your *belief* about whether Action A is a good idea.

  In Hirshleifer's framework, the information signal **changes the feasible set of actions.**
  *   **Before Info:** Action A (Buy Insurance at pooled rate) is available.
  *   **After Info:** Action A is **no longer available.** The insurer withdraws the contract.

  Because the information causes the market to withdraw the option you would have chosen, you are strictly worse off. Good's Theorem says "you can always ignore the info and do what you would have done." Hirshleifer says "if you get this info, the market won't let you do what you would have done."

  ### 4. Private vs. Public Information
  There is a second nuance worth mentioning to settle the argument.

  *   **Good's Theorem** generally applies to **private information**. If *only you* know you are high-risk, and the insurer doesn't, you can exploit that info to buy insurance (adverse selection). In that specific case, the info *is* valuable to you (but bad for the insurer).
  *   **Hirshleifer** specifically relies on **public information**. It is the fact that *everyone* (including the insurer) knows the risk that destroys the market.

  If the information is public, it becomes a "common knowledge" event that shifts the Nash Equilibrium of the market. Good's Theorem does not account for equilibrium shifts; it only accounts for individual optimization against a static background.

  ### Summary for Your Friend
  You can tell her this:

  > "Good's Theorem is true for **Decision Theory**, where I am optimizing against a static world. But Hirshleifer showed that in **Game Theory/Economics**, information can change the rules of the game. If knowing the truth makes the other players (insurers) stop offering me the contract I need, then the information has negative value. Good's Theorem assumes the menu of options stays the same; Hirshleifer shows the menu disappears when the info becomes public."

  **Who won?**
  *   **Mathematically/Logically:** She is right about isolated rational choice.
  *   **Economically/Realistically:** You are right about how information functions in society and markets.

  Since the real world is full of strategic interactions and markets, your intuition is the one that applies to actual policy and life, even if her theorem holds in a vacuum.
