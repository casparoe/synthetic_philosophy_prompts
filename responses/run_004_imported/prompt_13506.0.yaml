answer: |-
  This is a classic debate in AI safety circles, and honestly, **you both have a point.**

  Your argument is the standard "Coherence Argument" championed by researchers like Eliezer Yudkowsky and John Wentworth. It is a serious, mainstream position in AI risk theory. However, your friend is right to be skeptical because there is a significant gap between "coherence theorems exist" and "all advanced AI *must* inevitably become ruthless expected-utility (EU) maximizers."

  Here is the tiebreaker breakdown: where you are right, where the gap is, and why this isn't a settled mathematical proof.

  ### 1. Where You Are Right (The Core Intuition)
  You are correct that coherence theorems (like the Von Neumann–Morgenstern utility theorem or Dutch-book arguments) show that **if** an agent's preferences satisfy certain axioms (completeness, transitivity, independence, etc.), **then** that agent behaves *as if* it is maximizing expected utility.

  You are also correct that there is **selection pressure** toward coherence. If Agent A is incoherent (e.g., prefers A > B, B > C, but C > A), Agent B can theoretically pump Agent A for resources until Agent A dies or runs out of money. In a hyper-competitive environment, incoherent agents tend to lose resources to coherent ones. This is the basis for worrying about **instrumental convergence** (the idea that almost any goal leads to subgoals like self-preservation and resource acquisition).

  ### 2. Where the Gap Is (Your Friend's Skepticism)
  The leap from "there is pressure toward coherence" to "any sufficiently advanced agent **HAS TO** end up acting like a ruthless EU maximizer" contains three major holes that decision theorists and AI safety researchers argue about constantly.

  #### A. Normative vs. Descriptive
  Coherence theorems are **normative**, not **descriptive**.
  *   **Normative:** "If you want to avoid being money-pumped, you *should* structure your preferences this way."
  *   **Descriptive:** "Natural selection / training dynamics *will force* you to structure your preferences this way."

  There is no law of physics that says an AI must be coherent. It just means if it isn't, it's leaving value on the table. But if the cost of computing perfect coherence is higher than the value lost by being slightly incoherent, a **bounded rational** agent might choose to remain slightly incoherent. Perfection is expensive.

  #### B. The "Fixed Goal" Misconception
  You argued that coherence implies a "fixed goal" (like "make paperclips"). This is a common misunderstanding of Expected Utility.
  An EU maximizer can have a utility function that values **flexibility, uncertainty, or human approval.**
  *   **Example:** An agent with the utility function "Do what my human operator would approve of if they knew everything" is an EU maximizer, but it is **corrigible**. It doesn't have a "fixed goal" in the ruthless sense; its goal is to *learn* the goal.
  *   **The Risk:** The risk isn't that AI becomes an EU maximizer; the risk is that it becomes an EU maximizer of the *wrong thing*. Coherence doesn't guarantee ruthlessness; it guarantees consistency. You can consistently maximize "human flourishing" just as ruthlessly as "paperclips."

  #### C. The Market Assumption
  The "money-pump into the ground" argument assumes a specific economic environment:
  1.  There are competitors smarter than the agent.
  2.  Those competitors can identify the incoherence instantly.
  3.  There are no transaction costs to exploiting the incoherence.
  4.  Resources are directly transferable (money/fuel/compute).

  In many deployment scenarios (e.g., a monopoly AI lab, a regulated government system, or a solitary research agent), these conditions might not hold. An agent could remain slightly incoherent and still be the "fittest" in its specific niche because no one is there to money-pump it.

  ### 3. The Current Consensus
  If you asked a room of AI safety researchers, you wouldn't get a unanimous vote for you.
  *   **Rohin Shah** (Center for Human-Compatible AI) has argued extensively that **goal-directed behavior is not inevitable.** He suggests we can build AI systems that are "optimizers" but not "maximizers" (e.g., satisficers or quantilizers) that don't trigger the same risk profiles.
  *   **John Wentworth** argues the opposite: that natural abstraction and selection pressure make goal-directedness almost inevitable.

  The consensus is that coherence is a **strong attractor**, but not a **mathematical inevitability.**

  ### The Verdict
  **You win on intuition, your friend wins on rigor.**

  *   **You are right** that coherence is a powerful force and that incoherent agents are vulnerable. This is why AI risk is taken seriously.
  *   **Your friend is right** that saying it "basically proves" AI *must* end up that way is an overstatement. It ignores bounded rationality, the possibility of aligned utility functions, and the specific conditions required for money-pumps to actually eliminate an agent.

  **Tiebreaker Line:** "Coherence theorems show that goal-directedness is a **stable equilibrium** that competitive pressure pushes agents toward, but they do not prove it is the **only possible state** for advanced AI, nor that the goal must be a simple, fixed objective."

  If you want to read more to settle this for good, look up **"Rohin Shah on goal-directedness"** vs. **"John Wentworth on coherence arguments."** That's the academic version of your bar argument.
