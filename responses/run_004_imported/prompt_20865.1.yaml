      *   *Cantor's Ontology:* Emphasize his realism. Sets aren't defined by axioms; axioms describe sets.
      *   *Addressing the Paradox:*
          *   Skolem says: "Uncountable" = "No bijection in the model."
          *   Cantor says: "Uncountable" = "No bijection *period*."
