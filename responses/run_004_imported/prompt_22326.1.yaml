answer: |-
  Hi everyone. For those who don't know me, I'm a friend of Dave's. And like about half the people in this room, I'm enough of a finance nerd that I could probably talk your ear off about compound interest and withdrawal rates.

  But the other half of this room—Dave's family, especially his parents—I know you're looking at this a little differently. You love him, you're proud of him, but I think there's a part of you that worries this looks like… stopping. Like he's opting out of something important.

  So, I want to talk about Dave's favorite essay. You know the one, Dave. The Keynes piece. Now, usually, when we FIRE nerds talk about that essay, we quote the fun part. The part about the fifteen-hour work week. The part that says technology and savings will solve everything. Dave has made us all recite that part until we could do it in our sleep.

  But there's a second half of that essay that Dave doesn't bring up as often. Probably because it's less fun.

  Keynes wrote that solving the money problem is actually the easy part. He said that when people finally get what they want—when they get the freedom and the time—they might face a "severe problem." He used a very specific word. He said mankind will face this new challenge "with a dread."

  Because, as he put it, the real question isn't how to get rich. It's "how to use his freedom from pressing economic cares… to live wisely and agreeably and well."

  He was worried that without the grind, without the necessity of survival, we might lose our sense of purpose. He worried that having too much freedom is actually harder than having none.

  And I think that's why I'm standing here today. Because I want to say something to Dave's parents, and something to Dave.

  To Dave's family: Your worry? It's not old-fashioned. It's actually incredibly insightful. Keynes would agree with you. Walking away from the structure of a career is risky. It *is* hard to lose the thing that organized your whole effort for twenty years. You aren't wrong to be nervous.

  But here's the thing: Dave isn't nervous. And that's because he's read the footnotes.

  To Dave: The last three years were about the math. And you crushed the math. But Keynes was right—the math was the easy part. The hard part is the morning after. It's figuring out who you are when you aren't "the guy who's grinding." It's avoiding the trap of just filling time with stuff, instead of filling it with meaning.

  Most people never get to face that problem. They stay on the treadmill until the treadmill stops them. You've earned the right to struggle with the better problem.

  So, this isn't a toast to "never working again." It's a toast to the harder work that starts Monday. It's to the "real problem" Keynes talked about.

  Dave, you've solved the economic problem. Now, go solve the human one. We're all here to help you do it.

  To Dave.
