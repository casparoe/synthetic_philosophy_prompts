answer: |-
  I was in a code review with Dave, arguing against his dynamic lookup for the system owner.

  "Look," I said, pointing at the diff. "We hardcode `const OWNER_ID = 492`. It's a rigid designator."

  Dave sighed. "But we only know 492 is the owner because we queried the seed data. That's empirical. What if the data changes?"

  "We needed a database query to discover it, sure," I said. "That makes it *a posteriori*. But now that we know `492` *is* `THE_ORIGINATOR`, the identity is necessary. In no possible world where 492 exists is 492 not THE_ORIGINATOR. It's Hesperus and Phosphorus, Dave. We needed a telescope to see they were the same planet, but they weren't *contingently* the same planet."

  Dave rubbed his temples. "Fine. But what about the `TIMEOUT_CONSTANT` we set to the legacy server's ping?"

  "That's different," I said. "That's the meter stick. We stipulated `ONE_METER` is `LEGACY_PING` at *t0*. We know that *a priori* by definition, but it's contingent. The ping could have been higher. So `TIMEOUT_CONSTANT` varies across possible worlds, even if the definition holds in this one."

  "Okay," Dave said, turning back to his keyboard. "I'm going to write a unit test to cover the edge case where `OWNER_ID` isn't `THE_ORIGINATOR`."

  I closed my laptop. "You can't."

  "It's a mock object," he said. "I can make the ID return 493."

  "No," I said. "You're not mocking data. You're writing a test for a metaphysical impossibility. You might as well assert that Hesperus isn't Phosphorus in the staging environment."

  Dave paused. "So if I run the test..."

  "The test won't fail," I said. "But logic will."
