prompt: |-
  I'm a software engineer who was recently elected to my condominium association's board, and I've somehow ended up being the one asked to write up a recommendation on a dispute the rest of the board can't settle on its own — possibly because I was the only one willing to reread our entire declaration of covenants line by line. That declaration, drafted back in 1988, says units may be used 'only for single-family residential purposes' and that 'no trade, business, or commercial activity of any kind shall be conducted on or from any unit.' One owner, who lives out of state and has never actually stayed in her unit, has been renting it out through Airbnb for stretches as short as two nights, several times a month. About half the board wants to send a cease-and-desist letter and start the fining process under our enforcement policy; the other half thinks the declaration doesn't clearly cover this, since the guests are still just sleeping and living there the way any resident would, and the 'business' language was obviously aimed at things like a storefront or a home office with clients coming and going, not a unit filled through an app. We paid for an hour of a real-estate attorney's time, and she told us both readings were 'legally defensible' and that it was up to the board — which was not the answer anyone wanted.

  The timing makes this more than academic: a unit two doors down is under contract to sell, and the buyer's lender has sent the board a standard questionnaire asking whether the declaration restricts short-term or transient rentals and whether any such restriction has been consistently enforced, since an unclear or inconsistent answer can reportedly complicate financing for the whole building, not just that one sale. Amending the declaration to add an explicit minimum-lease term would require a two-thirds vote of all owners by mailed ballot, which realistically takes months we don't have before the closing date. A couple of board members keep appealing to 'what the original drafters intended,' but none of them are still owners here, and the only surviving 1988 meeting minutes we could dig up don't mention rentals at all. The whole argument reminds me, oddly, of fights I've had at work over whether code should do exactly what a spec says or whatever the spec was obviously trying to accomplish when it didn't anticipate some case — except here there's no author left to go ask.

  Could you draft the short memo I'll circulate to the rest of the board before our meeting next Tuesday? It should recommend one concrete path forward — enforcement, non-enforcement, or something like a conditional or grandfathering arrangement — along with a realistic timeline for acting given the pending sale, and it should take the strongest version of whichever side it doesn't recommend seriously, rather than treating that reading of the declaration as obviously careless or unreasonable.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Software engineer, newly elected Condo Board member.
      *   **Task:** Draft a memo to the rest of the board recommending a path forward on a short-term rental (Airbnb) dispute.
      *   **Context:**
          *   Declaration (1988) says "single-family residential purposes" and "no trade, business, or commercial activity."
          *   Owner (out-of-state) rents via Airbnb (2-night stays, several times/month).
          *   Board is split 50/50 (Enforce vs. Don't Enforce).
          *   Attorney said both readings are "legally defensible" (board must decide).
          *   **Urgency:** A unit two doors down is under contract. Lender questionnaire asks about restrictions on transient rentals and consistent enforcement. Unclear/inconsistent answers risk financing for the *whole building*.
          *   **Constraint:** Amending the declaration takes months (too late for this sale).
          *   **Analogy:** User compares this to software specs (literal vs. intent).
      *   **Requirements:**
          *   Recommend *one* concrete path (Enforcement, Non-enforcement, or Conditional/Grandfathering).
          *   Include a realistic timeline.
          *   Take the strongest version of the *opposing* view seriously (steel-manning).
          *   Tone: Professional, decisive, balanced, actionable.
          *   Deadline: Meeting next Tuesday.

  2.  **Determine the Recommendation:**
      *   *Option A: Non-Enforcement.* Risky. Lender questionnaire asks if restrictions exist. If we say "Yes, but we ignore them," that's inconsistent enforcement. If we say "No," we might be misrepresenting the 1988 Declaration. Risks financing for the whole building.
      *   *Option B: Full Enforcement.* Legally defensible per attorney. Aligns with "single-family" and "no business." Solves the lender questionnaire issue (Yes, restricted, Yes, enforced). Hard on the Airbnb owner, but protects the building's financial health.
      *   *Option C: Conditional/Grandfathering.* Too complex for the immediate timeline. Creates ambiguity for the lender.
      *   *Decision:* **Enforcement** is the only path that secures the pending sale and protects the corporation's liability/financing capabilities. The lender's concern is the biggest lever here. The "intent" argument is weak compared to the financial risk.
      *   *Nuance:* I need to acknowledge the "Don't Enforce" side's argument (that 1988 drafters didn't foresee Airbnb) to meet the prompt's requirement.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly up front.
      *   **Context/Background:** Briefly recap the dispute and the attorney's input.
      *   **The Urgent Constraint (The Lender):** This is the tie-breaker. Explain why the pending sale dictates the decision.
      *   **Analysis of Opposing View (Steel-manning):** Acknowledge the "1988 Intent" argument. It's not stupid; it's just risky right now.
      *   **Analysis of Recommended View:** Why "Single-Family" + "No Business" = No Airbnb.
      *   **Recommendation & Timeline:** Specific steps. Cease & Desist -> Fine -> Policy.
      *   **Long-term Solution:** Mention the amendment process for later.

  4.  **Refining the Tone:**
      *   Avoid emotional language.
      *   Use the "Software Engineer" analogy subtly if it helps frame the logic (spec vs. implementation), but keep it formal for the board. *Self-Correction: Better to keep it strictly professional for a board memo, but use the logical rigor the user appreciates.*
      *   Ensure the "Steel-man" requirement is met. I need to explicitly state why the other side makes sense *in a vacuum*, but why it fails *in this specific context*.

  5.  **Addressing the Lender Questionnaire:**
      *   This is the critical piece. If the board votes *not* to enforce, they effectively admit to inconsistent enforcement or lack of restriction. This triggers lender red flags.
      *   If the board votes *to* enforce, they can truthfully answer "Yes, restricted" and "Yes, enforced."
      *   Therefore, the recommendation *must* be enforcement to save the sale (and future sales).

  6.  **Drafting the Content (Iterative Process):**

      *   *Subject Line:* Needs to be clear. "Recommendation regarding Short-Term Rentals & Pending Sale."
      *   *Opening:* We need a decision by Tuesday.
      *   *The "Other Side":* Acknowledge that "residential use" is ambiguous regarding Airbnb. The 1988 drafters didn't know apps. It's reasonable to think sleeping guests = residential.
      *   *The "This Side" (Recommendation):* But, "No business" is key. Airbnb is a business. Transient use violates "single-family" stability.
      *   *The Kicker:* The lender questionnaire. We cannot answer "No restriction" honestly. We cannot answer "Restriction exists but we ignore it" without risking financing.
      *   *Action Plan:* Send letter. Pause fines for 30 days to allow compliance. Start amendment process for clarity later.

  7.  **Review against Constraints:**
      *   One concrete path? Yes (Enforcement).
      *   Realistic timeline? Yes (Immediate letter, 30-day compliance, amendment later).
      *   Steel-man opposing view? Yes (Acknowledged ambiguity and historical context).
      *   Tone? Professional, decisive.

  8.  **Final Polish:** Check for clarity and brevity. Board members are volunteers; they won't read a novel. Make it scannable but substantive. (Self-Correction: Ensure I explicitly mention the "two-thirds vote" constraint regarding the amendment to show I understand the long-term fix isn't immediate).

  9.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm bullying the Airbnb owner, but rather protecting the *association*. The focus is on the *financial risk* to the building, not just moralizing about Airbnb. The lender questionnaire is the objective criterion that breaks the tie.

  *(Refining the "Steel-man")*: I should explicitly validate that the "Non-Enforcement" board members aren't being careless; they are being reasonable about historical intent. This builds consensus.

  *(Refining the Timeline)*: The sale is pending. The questionnaire needs to be returned *now*. The board vote needs to happen Tuesday. The letter needs to go out Wednesday.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Condominium Association Name]
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Short-Term Rentals & Pending Lender Questionnaire

  **Executive Summary**
  To protect the financial interests of the Association and ensure the pending sale of Unit [Number] closes without financing complications, I recommend the Board immediately vote to **enforce** the existing Declaration restrictions against the short-term rental activity in Unit [Number].

  While the ambiguity of our 1988 Declaration is genuine, the immediate risk posed by the lender questionnaire outweighs the benefit of the doubt. We should issue a formal notice of violation this week, while simultaneously launching the long-term process to amend the Declaration for explicit clarity.

  **Context & The Immediate Constraint**
  As you know, our attorney has confirmed that both interpreting the Declaration to ban Airbnb (the "Literal/Business" view) and allowing it (the "Intent/Residential" view) are legally defensible. In a vacuum, this is a philosophical debate about 1988 drafting intent versus modern usage.

  However, we are not in a vacuum. A lender for a prospective buyer in Unit [Number] has issued a questionnaire asking:
  1.  Does the Declaration restrict transient/short-term rentals?
  2.  Is this restriction consistently enforced?

  If we answer "No" to Question 1, we may be misrepresenting the "single-family" and "no business" clauses. If we answer "Yes" to Question 1 but "No" to Question 2 (by choosing non-enforcement), we signal inconsistent governance. Either outcome risks the lender rejecting the loan, which jeopardizes not only this sale but the marketability of all units in our building.

  **Analysis of the Opposing View (Non-Enforcement)**
  I want to address the arguments for non-enforcement seriously, as they are not without merit.
  *   **Historical Intent:** The drafters in 1988 could not have anticipated rental apps. Their concern regarding "business" activity was likely focused on foot traffic, signage, or noise (e.g., a law office or shop), not transient occupants sleeping in a unit.
  *   **Residential Nature:** Airbnb guests do use the unit for "residential purposes" (sleeping, cooking) indistinguishable from a long-term tenant or house guest.
  *   **Property Rights:** Unit owners generally have the right to lease their property. Restricting the *duration* of a lease without explicit text can be seen as an overreach of board authority.

  Those advocating for this position are not ignoring the rules; they are arguing for a reasonable interpretation of "residential" that accommodates modern technology without stifling owner rights.

  **Analysis of the Recommended View (Enforcement)**
  Despite the validity of the points above, the enforcement position is the only one that secures the Association's financial stability right now.
  *   **Commercial Activity:** Airbnb is not merely leasing; it is a commercial hospitality business operated from the unit. The "no trade or business" clause is explicit, regardless of 1988 intent.
  *   **Single-Family Stability:** Transient occupancy (2-night stays) fundamentally alters the security and insurance profile of a "single-family residential" building compared to traditional tenancy.
  *   **The Lender Standard:** Mortgage underwriters treat short-term rentals as high-risk. To satisfy the questionnaire truthfully and safely, we must be able to state that restrictions exist *and* are enforced.

  **Recommendation & Timeline**
  We cannot amend the Declaration before the closing date (requiring a 2/3 vote and months for balloting). Therefore, we must act on the current text.

  1.  **Board Vote (Tuesday, Oct 31):** Vote to classify short-term rentals (less than 30 days) as a violation of the "single-family residential" and "no business" clauses.
  2.  **Notice of Violation (Wednesday, Nov 1):** Send a formal letter to the owner of Unit [Number].
      *   Cite the specific Declaration sections.
      *   State that the current usage violates the "no business" clause.
      *   **Grace Period:** Allow 30 days to cease the activity before fines commence. This demonstrates good faith and mitigates claims of aggressive enforcement.
  3.  **Lender Questionnaire (Wednesday, Nov 1):** Return the questionnaire stating that the Declaration *does* restrict transient rentals and that the Board *is* enforcing these restrictions.
  4.  **Long-Term Fix (November – Q1 2024):** Immediately draft an amendment explicitly defining "minimum lease term" (e.g., 6 months or 1 year). Launch the 2/3 vote process to ratify this. This removes ambiguity for future sales and owners.

  **Conclusion**
  Choosing non-enforcement validates the "Intent" argument but exposes the Association to significant financing risk. Choosing enforcement validates the "Literal" text and protects the building's marketability. Given our fiduciary duty to all owners, not just the one in dispute, I urge the Board to vote for enforcement on Tuesday.

  I am available to discuss this further prior to the meeting.
