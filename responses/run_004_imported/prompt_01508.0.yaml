      *   *Why the Annoyance?* Calling it "Cartesian" imposes a Western, epistemological framework on an Islamic metaphysical/psychological one. It ignores the Neoplatonic/Aristotelian context of Avicenna. It reduces "self-presence" to "logical certainty."
