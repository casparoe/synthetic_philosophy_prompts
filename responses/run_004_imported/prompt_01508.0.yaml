      *   *Does it matter for the novel?* Probably not the textual history, *but* the shift in tone matters. The *Isharat* version feels more intimate, which fits a hospital bed hallucination better.
      *   *Decision:* Tell the user not to get bogged down in bibliography, but acknowledge the tonal shift if they want to reference specific texts.

