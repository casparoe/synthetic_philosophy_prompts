prompt: |-
  I'm taking a philosophy of physics seminar this semester and we just spent two weeks on Bell's theorem. Afterward, two people in my study group got into a real argument about what the theorem actually shows, and it never got resolved, so I want an outside read since I honestly can't tell who's right myself.

  (1) Nadia said Bell's theorem plus the loophole-free experiments prove the universe is non-local, full stop -- there's some influence between entangled particles that outruns the speed of light. (2) Theo said that's too fast: Bell's original argument needs locality AND the assumption that particles have determinate values before measurement (hidden variables, or "realism"), and the experiments only force you to give up that whole package -- so you could keep locality and drop realism instead, e.g. plain no-hidden-variables QM. (3) Nadia replied that this doesn't actually buy you anything, because even without positing hidden variables you still have to explain why the two distant results end up correlated exactly the way QM predicts once both sides have an outcome, and "no hidden variables" doesn't make that any less non-local, it just relocates the mystery. (4) Theo said the real issue is which exit you take from Bell's later, tighter "local causality" condition rather than his early "local hidden variables" version -- and that a couple of the exits, like many-worlds (where arguably no single outcome ever has to get sent anywhere) or superdeterminism (denying that measurement settings are independent of the hidden state), genuinely preserve locality. Nadia wasn't convinced by either: she said many-worlds' claim to be local is itself contested, and superdeterminism is basically a get-out-of-jail-free card that could rescue locality from literally any experiment, so it shouldn't even count as a real option.

  Neither of them backed down, and I've reread the SEP page on Bell's theorem like three times now and still dont feel like I can referee this properly. Could you go through the four moves and say what's right, wrong, or importantly incomplete in each one -- not just whose overall position wins -- and then say what, if anything, you think both of them are missing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of physics seminar, spent two weeks on Bell's theorem.
      *   **Problem:** Two study group members (Nadia and Theo) are arguing about the implications of Bell's theorem + experiments. The user is confused and wants an outside assessment.
      *   **Task:** Evaluate four specific "moves" in their argument (Nadia 1, Theo 1, Nadia 2, Theo 2), identifying what's right, wrong, or incomplete in each. Then, identify what *both* might be missing.
      *   **Constraint:** Do not just declare a winner. Provide nuance.
      *   **Tone:** Academic, clear, balanced, philosophically precise (suitable for a seminar student).

  2.  **Deconstruct the Arguments:**

      *   **Nadia (1):** Bell + Experiments $\rightarrow$ Non-locality (full stop). Influence outruns light.
          *   *Assessment:* This is the "Orthodox" or "Bohmian" take. It assumes Realism is non-negotiable or that "Non-locality" is the only coherent way to describe the violation of Bell inequalities. It often conflates "signal locality" (no FTL communication) with "ontological non-locality."
      *   **Theo (1):** Bell requires Locality + Realism (Hidden Variables). Experiments force giving up the package. You can keep Locality if you drop Realism (standard QM/Copenhagen).
          *   *Assessment:* This is the standard textbook "Copenhagen-ish" take. Bell's inequality derivation *does* assume local hidden variables. Standard QM avoids the inequality by denying definite values prior to measurement. However, does standard QM truly satisfy "locality" in the relativistic sense? That's the crux.
      *   **Nadia (2):** Dropping hidden variables doesn't help. You still need to explain the correlation. "No hidden variables" just relocates the mystery; the correlation itself implies non-locality.
          *   *Assessment:* This touches on the "Outcome Dependence" vs. "Parameter Dependence" distinction (Jarrett/Shimony). It challenges whether "anti-realism" actually saves locality. If the wavefunction collapses globally, is that local?
      *   **Theo (2):** Focus on Bell's "Local Causality." Exits exist: Many-Worlds (no single outcome to send) or Superdeterminism (no independent settings). These preserve locality.
          *   *Assessment:* Theo is technically correct that these are logical options. MWI claims locality by denying unique outcomes. Superdeterminism denies statistical independence. Nadia's counter (MWI contested, Superdeterminism ad hoc) is also standard.

  3.  **Evaluate Each Move (Drafting the Content):**

      *   *Nadia (1):* **Incomplete/Overstated.** Bell's theorem *mathematically* rules out Local Hidden Variables. It doesn't strictly prove "influence" in a signaling sense. It proves violation of *Local Causality*. Saying "influence outruns light" suggests signaling, which is false (No-Communication Theorem). She's jumping to an ontological conclusion that isn't the only one.
      *   *Theo (1):* **Mostly Right but Tricky.** He's right that the derivation assumes Local Realism. He's right that Standard QM drops realism (definite values). *However*, whether Standard QM is "local" is debated. Wavefunction collapse is often viewed as non-local (instantaneous update across space). So claiming QM "keeps locality" is contentious depending on how you define locality (signal vs. ontological).
      *   *Nadia (2):* **Strong Point.** She identifies the "measurement problem" aspect. Even if values aren't pre-determined, the *correlation* of outcomes at spacelike separation needs explanation. If the state updates globally upon measurement, that looks non-local. She's highlighting that "anti-realism" doesn't automatically mean "locality."
      *   *Theo (2):* **Technically Correct, Philosophically Costly.** MWI and Superdeterminism *are* the two main ways to save Local Causality strictly. Nadia's objections are standard philosophical pushback (MWI ontology is heavy/contested; Superdeterminism undermines scientific method). Theo is right they are *logical* exits; Nadia is right they are *costly*.

  4.  **Identify What Both Are Missing (The "Meta" Analysis):**

      *   **Definition of Locality:** They are talking past each other because "Locality" isn't univocal.
          *   *Signal Locality:* No FTL communication (Preserved by QM).
          *   *Bell Locality / Local Causality:* Factorizability of probabilities (Violated by QM).
          *   *Relativistic Locality:* Microcausality in QFT (Commuting observables at spacelike separation).
      *   **The Role of the Wavefunction:** Is the wavefunction real (psi-ontic) or knowledge (psi-epistemic)? This changes the stakes of "realism."
      *   **Pusey-Barrett-Rudolph (PBR) Theorem:** Might be too advanced, but worth noting that "dropping realism" has its own constraints now.
      *   **Relational/Pragmatic Views:** QBism or Relational QM. They dissolve the problem by changing what probabilities *are*.
      *   **Common Cause vs. Direct Cause:** Bell rules out local common causes. It doesn't strictly prove direct FTL causation, though it looks like it.

  5.  **Structure the Response:**

