          *   Thorne: But the child is still *safe*. The goal is safety, not identical strength.
          *   Vance: But the *reason* for safety is external to the child's system. The parent proves the child safe, the child can't prove itself safe. That's the regress.
      *   *Parametric Polymorphism:*
          *   Thorne: Fallenstein lets the agent reason about a parameterized family. It avoids the strength loss.
          *   Vance: It kicks the can. The trust is in the parameter instantiation, not the system itself. It's a trick of syntax.
          *   Thorne: It's a feature. It allows the agent to say "I trust any agent with parameter $k$ if I have $k+1$."
      *   *Probabilistic Reflection:*
          *   Thorne: This is the winner. We don't need proof. We need high probability. It matches human cognition.
          *   Vance: You've changed the subject. "I probably believe I'm sound" isn't "I am sound." You've surrendered the epistemic norm of truth for coherence.
          *   Thorne: Because truth is inaccessible from the inside!
      *   *The Wrap-up:*
          *   They need to realize they might be talking past each other on the definition of "Trust."
          *   Vance: Trust implies certainty/justification.
          *   Thorne: Trust implies reliability/actionability.
