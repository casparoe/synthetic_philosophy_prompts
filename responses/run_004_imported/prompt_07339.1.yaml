prompt: |-
  I'm a second-year counseling psychology graduate student completing a practicum placement at my university's community training clinic, and this term I'm also taking a graduate seminar on moral psychology that keeps bleeding into my clinical work in ways I hadn't expected. As the trainee representative on the clinic's care-quality committee, I've been asked to produce a first draft of guidance on client requests to be matched, or re-matched, with a clinician of a particular race. The clinic's current intake policy says only that "reasonable requests for clinician reassignment will be accommodated when feasible," without specifying what makes a request reasonable, and two cases from this past month have exposed how much work that word is quietly doing. In the first, a Black client asked after two sessions to be transferred from her assigned white therapist to a Black one, explaining that she did not feel able to be fully honest with him about her family history; intake approved the switch within a day, and no one on staff thought twice about it. In the second, a white client ended his third session early and asked the front desk for "someone who isn't Black," offering only that he would feel "more comfortable that way." The clinic approved that switch too, without further inquiry, and it is only in retrospect, discussing the two cases side by side, that the committee has split. Some supervisors want a single uniform rule -- honor any client's stated preference about a clinician's race, as a matter of policy, since it is not the clinic's place to rank whose racial comfort counts as legitimate -- while others, including the therapist reassigned in the second case, argue that treating the two requests as interchangeable ignores everything the clinic otherwise knows about the asymmetry between a marginalized client's guarded trust and a member of the majority's racial aversion, and that calling the second request a mere "preference" simply launders something the clinic would refuse to tolerate in any other context.

  Could you draft the short memo I have been asked to bring to next week's meeting? It should recommend a rule specific enough for intake coordinators to actually apply the next time such a request arises, rather than falling back on "weigh the factors case by case," and it should set out the reasoning behind that rule and not just the bottom line -- including a fair-minded statement of the strongest version of whichever side it does not adopt, since I will need to defend the memo against whichever supervisor ends up feeling overruled.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Second-year counseling psychology graduate student, trainee representative on the care-quality committee.
      *   **Context:** University community training clinic. Taking a moral psychology seminar (influencing perspective).
      *   **Task:** Draft a short memo for next week's committee meeting.
      *   **Topic:** Guidance on client requests to be matched/re-matched with a clinician of a particular race.
      *   **Current Policy:** Vague ("reasonable requests... accommodated when feasible").
      *   **Trigger Cases:**
          1.  Black client requests Black therapist (from White therapist) due to trust/honesty concerns. Approved.
          2.  White client requests non-Black therapist (from Black therapist) due to "comfort." Approved.
      *   **The Conflict:**
          *   Side A (Uniform Rule): Honor *any* stated preference. Don't rank legitimacy of racial comfort. Client autonomy/fit is paramount.
          *   Side B (Asymmetry Rule): Distinguish between marginalized trust-building and majority aversion/prejudice. Accommodating the latter harms staff and violates clinic values.
      *   **Requirements:**
          *   Recommend a specific rule (actionable for intake coordinators).
          *   Provide reasoning (not just the bottom line).
          *   Include a "steelman" (fair-minded statement) of the opposing view.
          *   Tone: Professional, ethical, nuanced, suitable for a graduate training clinic.

  2.  **Determine the Stance:**
      *   As a counseling psychology student influenced by moral psychology, the ethical imperative leans heavily towards Side B (Asymmetry). Counseling psychology ethics (APA, ACA) emphasize social justice, non-discrimination, and do no harm. Accommodating racial exclusion requests from majority clients harms the clinician (dignitary harm) and reinforces systemic racism. Accommodating marginalized clients' requests for shared identity often serves therapeutic alliance and cultural humility.
      *   *Decision:* The memo should recommend a policy that distinguishes between requests rooted in marginalization/trust-building and requests rooted in exclusion/prejudice. It cannot be a flat "yes" to all, nor a flat "no" to all. It needs a operationalizable criterion.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Purpose:** Clearly state why this memo exists (the two recent cases, the need for clarity).
      *   **Recommendation (The Rule):** Needs to be specific.
          *   *Idea:* Allow requests for *affinity* (shared identity for trust), deny requests for *exclusion* (specific racial ban).
          *   *Refinement:* "Requests for a clinician of a specific racial/ethnic background to enhance cultural safety or shared experience will be accommodated when feasible. Requests to exclude clinicians based solely on their racial/ethnic background will not be accommodated."
          *   *Operationalizing:* How does intake know the difference? They need to ask *why*. The rule must require a brief inquiry into the *function* of the request.
      *   **Rationale:**
          *   Therapeutic Alliance vs. Ethical Obligations.
          *   Power dynamics (marginalized vs. majority).
          *   Staff welfare (training environment).
          *   Moral Psychology angle (without being too academic): Distinguish between *seeking safety* vs. *imposing exclusion*.
      *   **The "Steelman" (Opposing View):**
          *   Need to represent Side A fairly.
          *   Arguments: Client autonomy, therapeutic fit is subjective, slippery slope of intake interrogating clients, risk of rupturing alliance before it starts.
          *   Why it's being overruled (gently): Autonomy isn't absolute; it doesn't extend to discrimination that harms others or violates clinic mission.
      *   **Implementation:** How does intake handle this tomorrow? Scripting or guiding questions.

  4.  **Refining the Tone:**
      *   Must sound like a grad student (respectful, eager, but ethically firm).
      *   Must acknowledge the complexity (it's not easy).
      *   Must be actionable (intake coordinators are often administrative staff, not clinicians, so the rule can't be too abstract).
      *   *Self-Correction on Tone:* Avoid being preachy. Acknowledge the validity of client comfort while drawing the line at harm. Ensure the "moral psychology" influence shows up as ethical reasoning, not jargon.

  5.  **Drafting the Content (Iterative Process):**

      *   *Rule:* "Accommodate requests *for* a specific identity; do not accommodate requests *against* a specific identity."
      *   *Nuance:* What if a White client says "I want a White therapist"? Is that *for* White or *against* non-White? Usually the latter in this context. The key is the *reason*.
      *   *Revised Rule:* Intake must briefly ascertain the *goal*. Is it to find cultural congruence (Yes)? Or to avoid a group (No)?
      *   *Wait, practical constraint:* Intake staff might not be trained to probe deep.
      *   *Simpler Rule:* "Requests for shared identity/cultural match are valid. Requests to exclude a race are not."
      *   *Let's look at the cases:*
          *   Case 1: Black client wants Black therapist. (Request *for* shared identity). -> Allow.
          *   Case 2: White client wants "someone who isn't Black." (Request *against* a group). -> Deny.
      *   *Policy Draft:* "The clinic will accommodate requests for a clinician of a specific racial or ethnic background when framed as a desire for cultural congruence or shared experience. The clinic will not accommodate requests that explicitly exclude clinicians based on their racial or ethnic background."

      *   *Steelman:* Focus on the "Therapeutic Alliance" argument. If a client isn't comfortable, therapy fails. Why risk the alliance? Also, the "Neutrality" argument.
      *   *Rebuttal:* The alliance cannot be built on the sacrifice of staff dignity. Neutrality in the face of exclusion is complicity.

  6.  **Final Polish:**
      *   Check constraints: Short memo? Yes. Specific rule? Yes. Reasoning? Yes. Opposing view? Yes.
      *   Ensure the "Moral Psychology" influence is subtle but present (focus on asymmetry of power/harm).
      *   Make sure it sounds like it comes from a *trainee representative* (collaborative, not dictatorial).

  7.  **Final Review against Safety Guidelines:**
      *   Does this promote discrimination? No, it argues *against* accommodating discriminatory requests.
      *   Is it harmful? No, it protects marginalized staff and clients.
      *   Is it ethical? Yes, aligns with APA/ACA ethics codes regarding discrimination and justice.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm diagnosing the client. The intake coordinator isn't judging the *truth* of the feeling, but the *nature* of the request.
      *   *Adjustment:* Focus on the *framing* of the request. "I need a Black therapist" vs "I don't want a Black therapist."
      *   *Actually, deeper:* A White client saying "I want a White therapist" is functionally an exclusion if the motive is aversion. But often "cultural match" is valid for anyone.
      *   *Key Distinction:* The *asymmetry* argument from the prompt is crucial. The policy needs to reflect that requests from marginalized clients for safety are treated differently than requests from majority clients for exclusion.
      *   *Refined Policy:* "Requests grounded in the client's need for cultural safety or shared marginalized experience will be prioritized. Requests grounded in racial exclusion or aversion will not be honored."
      *   *Wait, how does intake know the ground?* They have to ask. "Can you help me understand what you hope a clinician of that background would provide?"
      *   *Okay, let's keep it actionable.* "Intake will accommodate requests for a specific racial/ethnic match. Intake will not accommodate requests to exclude a clinician based on race." (This covers Case 1 [For] vs Case 2 [Against]).
      *   *Wait, Case 2 was "Someone who isn't Black".* That is an exclusion request.
      *   *Case 1 was "Transfer to a Black one".* That is a match request.
      *   *Okay, the For/Against distinction is the most actionable for intake.*

      *   *Wait, one nuance:* A White client might say "I want a White therapist" to discuss White privilege. That's valid. A White client saying "I don't want a Black therapist" is invalid. The *reason* matters.
      *   *Decision:* The policy should require a brief clarification of intent.
      *   *Revised Policy:* "Requests for a clinician of a specific race/ethnicity to facilitate cultural congruence will be honored. Requests to exclude clinicians of a specific race/ethnicity will not be honored."
      *   *Wait, what if the White client says "I want a White therapist" but means "I don't want Black therapists"?* Intake can't know that instantly.
      *   *Okay, the prompt asks for a rule specific enough for intake to apply.*
      *   *Best approach:* Distinguish between *Affinity* (I want X) and *Exclusion* (I don't want Y). But also acknowledge the power dynamic.
      *   *Let's go with the "Cultural Congruence vs. Racial Exclusion" framework.*

      *(Final Plan)*:
      1.  Header.
      2.  Context (the two cases).
      3.  Recommendation (The Distinction Rule).
      4.  Rationale (Therapeutic alliance vs. Ethical duty/Staff safety).
      5.  Counter-argument (Client Autonomy/Alliance risk).
      6.  Implementation (Script for Intake).

      *Wait, need to ensure I don't overstep as a student.* Frame it as a "Draft Proposal for Committee Consideration."

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Care-Quality Committee, Community Training Clinic
  **FROM:** [Your Name], Trainee Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Draft Guidance on Client Requests for Clinician Racial Matching

  **Purpose**
  Following the two reassignment cases earlier this month, this memo proposes a specific policy framework to replace the current "reasonable request" standard. The goal is to provide intake coordinators with actionable criteria that align with our clinic's ethical obligations to both clients and trainees, while acknowledging the complexity of racial dynamics in the therapeutic alliance.

  **Recommendation**
  I recommend the committee adopt a policy of **Asymmetrical Accommodation based on Affinity vs. Exclusion.**

  **The Rule:**
  1.  **Affinity Requests:** Requests for a clinician of a *specific* racial or ethnic background (e.g., "I would like to work with a Black therapist") will be accommodated whenever feasible, regardless of the client's own racial identity.
  2.  **Exclusion Requests:** Requests to *exclude* clinicians of a specific racial or ethnic background (e.g., "I do not want to work with a Black therapist") will not be accommodated. In these instances, the intake coordinator will explain that while we strive for good fit, we cannot assign clinicians based on racial exclusions. The client will be offered a referral to an outside provider if they decline the assignment.

  **Rationale**
  This distinction rests on the ethical difference between seeking cultural safety and enforcing racial exclusion.

  *   **Therapeutic Function:** Requests for affinity often signal a desire for cultural congruence, shared lived experience, or safety in discussing race-related trauma. Accommodating these supports the therapeutic alliance and acknowledges the reality of systemic marginalization.
  *   **Ethical Obligation:** Requests for exclusion function differently. Accommodating a majority client's request to exclude a marginalized clinician validates racial aversion as a legitimate consumer preference. This causes dignitary harm to our trainees and staff, contradicting our training mission to promote social justice and non-discrimination.
  *   **Operational Clarity:** This rule allows intake staff to make a determination based on the *framing* of the request (For vs. Against) rather than requiring them to adjudicate the subjective "legitimacy" of a client's feelings in the moment.

  **Consideration of the Opposing View**
  I recognize that some supervisors advocate for a **Uniform Accommodation Policy**, honoring any stated racial preference without distinction. The strongest version of this argument prioritizes **Client Autonomy and Alliance Preservation**. Proponents argue that therapy is voluntary and effectiveness relies on client comfort; if a client feels unable to trust a clinician due to racial difference, forcing the match risks early termination or superficial work. Furthermore, interrogating a client's motivation ("Why don't you want this clinician?") may feel intrusive and rupture the alliance before it begins. From this perspective, the clinic's role is to provide service, not moral education, and ranking one client's racial comfort as more "reasonable" than another's risks paternalism.

  **Response to Opposing View**
  While client autonomy is paramount, it is not absolute. Ethical codes (APA, ACA) prohibit discrimination that harms others. Accommodating racial exclusion requests treats a clinician's identity as a deficit, which creates a hostile training environment and violates our duty of care to our staff. We can honor a client's need for fit without validating prejudice. By offering referrals for exclusion requests, we respect the client's right to choose their provider without compromising the clinic's integrity.

  **Implementation for Intake**
  To minimize confrontation, intake coordinators should be trained to listen for the *direction* of the request.
  *   *If Client says:* "I need someone who isn't [Race]," the response is: "We do not assign clinicians based on racial exclusions. We can refer you to outside providers who may have different staffing."
  *   *If Client says:* "I need someone who is [Race]," the response is: "We will note that preference and do our best to match you."

  **Next Steps**
  I request the committee review this draft for potential edge cases (e.g., clients who phrase exclusions as affinity preferences) and discuss referral protocols for clients whose exclusion requests cannot be met.

  ***

  **Notes for the Student (Mental Check):**
  *   **Tone:** Professional, respectful, but ethically firm.
  *   **Actionable:** The "For vs. Against" distinction is something an admin can actually hear and act on.
  *   **Steelman:** The "Opposing View" section respects the supervisors who want to prioritize the alliance, acknowledging their concern isn't malicious, just ethically different.
  *   **Moral Psychology:** The "Asymmetry" concept is embedded in the rationale without using jargon.
  *   **Safety:** It protects the clinic from liability regarding discrimination while protecting staff from harm.

  *This draft is ready for your review and adaptation.*
