answer: |-
  **Setting:** *A quiet corner of a university coffee shop. A crumpled scratch-off ticket sits on the table between Priya and Tomas. A napkin is covered in calculus.*

  **Priya:** So the math is unambiguous, Tomas. We maximize the Nash product. My utility is linear, $u_P(x) = x$. Yours is $u_T(y) = \sqrt{y}$. The disagreement point is zero for both. We maximize $x\sqrt{100-x}$.

  **Tomas:** I know the derivative, Priya. $f'(x) = \sqrt{100-x} - \frac{x}{2\sqrt{100-x}}$. Set to zero, you get $2(100-x) = x$, so $3x = 200$. You take \$66.67. I get \$33.33.

  **Priya:** Exactly. It's the unique solution satisfying Pareto-optimality, symmetry, invariance, and Independence of Irrelevant Alternatives (IIA). It's the standard for a reason.

  **Tomas:** It's *a* standard. But look at the Kalai–Smorodinsky calculation. My ideal utility is $\sqrt{100} = 10$. Your ideal utility is $100$. The utopia point is $(100, 10)$. The solution lies on the ray from $(0,0)$ to $(100,10)$, which is the line $v = 0.1u$.

  **Priya:** Intersecting that with the Pareto frontier $v = \sqrt{100-u}$.

  **Tomas:** Right. $0.01u^2 = 100 - u$. $u^2 + 100u - 10,000 = 0$. Positive root gives $u \approx 61.80$. So you get \$61.80. I get \$38.20.

  **Priya:** And there it is. You want the extra five dollars.

  **Tomas:** I want the solution that doesn't penalize me for my risk aversion as harshly as Nash does. Under Nash, my concavity drags my share down to thirty-three bucks. Under Kalai–Smorodinsky, I get thirty-eight. That's a fifteen percent difference on my share.

  **Priya:** It's not about penalizing you. It's about consistency. Think about IIA. Suppose we agreed on the Nash split. Now imagine we restrict the feasible set to just two points: the disagreement point and the Nash solution. Obviously, we pick the Nash solution. Now, if we expand the set back to the full frontier, IIA says the choice shouldn't change. The Nash solution is stable regardless of what other non-chosen options are on the table. Your Kalai–Smorodinsky solution violates that.

  **Tomas:** Because Kalai–Smorodinsky admits that the *shape* of the frontier matters, not just the local tangent. Priya, look at the Monotonicity axiom. If the feasible set expands in a way that is strictly good for me—say, my utility function improves, or the ticket value goes up—but doesn't hurt you, I should never end up worse off. Nash violates this. There are expansions of the bargaining set where my options improve, but the Nash product maximization shifts the split *against* me to keep the product balanced.

  **Priya:** That's a specific pathology of the Nash solution, sure. But consider the cost of your axiom. Your solution depends entirely on the "utopia point." That point is defined by the maximum utility each of us could get *if the other got nothing*. Those are points on the frontier we would never, ever choose. They are Pareto-dominated extremes.

  **Tomas:** They define the range of possibility.

  **Priya:** They define the range of *theoretical* possibility. Here's the killer objection: Suppose I found a way to make the ticket worth \$101, but only if you got \$0. That point is feasible now. It changes my ideal utility from 100 to 101. It doesn't change your ideal utility. It doesn't change the disagreement point. But it shifts the Kalai–Smorodinsky ray. It changes the split of the original \$100, even though that \$101 option is something neither of us would ever accept. Your solution is sensitive to irrelevant alternatives.

  **Tomas:** *[Taps the napkin]* But is it irrelevant? If your potential maximum increases, your bargaining power *should* increase. Kalai–Smorodinsky captures that. Nash ignores it. Under Nash, if my ideal point shoots up—say, I become less risk-averse—the solution doesn't necessarily shift in my favor unless the local curvature changes. Nash treats bargaining as a local optimization problem. Kalai–Smorodinsky treats it as a division of relative gains.

  **Priya:** Relative gains to what? To a fantasy point where I get nothing? Fairness shouldn't depend on the worst-case scenario for the other party. IIA ensures that the agreement depends only on the options that are actually competitive near the solution. It makes the solution robust. If you remove options far away from the settlement, Nash doesn't budge. Kalai–Smorodinsky jumps around.

  **Tomas:** Robustness to what? To ignoring the geometry of the conflict? Look, the core intuition of Kalai–Smorodinsky is that we should equalize the ratio of utility gained to utility possible. I'm getting 61.8% of my max potential. You're getting 61.8% of yours. That feels like equal treatment. Under Nash, you get 66.7% of your max, I get 57.7% of mine. You're winning the bargaining game simply because your utility function is linear.

  **Priya:** My utility function isn't "winning." It's the truth of my preferences. I value the marginal dollar constantly. You value the first dollar more than the last. The Nash solution respects the intensity of preferences. The product maximization means we trade off utility gains where they are equal in proportion. $\frac{u'_P}{u_P} = \frac{u'_T}{u_T}$. It equalizes the *percentage* gain in utility from the disagreement point.

  **Tomas:** But that percentage gain is anchored at zero. If my risk aversion compresses my utility scale, Nash interprets that as me caring less about the surplus. It punishes risk aversion. Roth showed this decades ago. If I'm more risk-averse, Nash gives me less. Kalai–Smorodinsky normalizes for the scale. It acknowledges that my "10 utils" is worth just as much effort to achieve as your "100 utils."

  **Priya:** But your scale is arbitrary. That's why we have the invariance axiom. We can rescale your utility to match mine. If we multiply your utility by 10, your ideal point becomes $(100, 100)$. The Kalai–Smorodinsky line becomes $v=u$. The intersection becomes 50/50 money split. Wait—if we rescale, KS changes the money split?

  **Tomas:** *[Pauses]* No. If I rescale my utility to $10\sqrt{y}$, my ideal utility is 100. The ray is $v=u$. The frontier in utility space is $v = 10\sqrt{100-u}$. Intersection: $u = 10\sqrt{100-u} \Rightarrow u^2 = 100(100-u) \Rightarrow u^2 + 100u - 10000 = 0$. It's the same quadratic. $u \approx 61.8$. But now $u$ is in "rescaled utils." In money, $u_P = 61.8$. So KS is invariant to affine transformations. I didn't slip up there.

  **Priya:** You didn't. But notice what happened. When you rescaled, the *interpretation* of the ideal point changed, but the money split stayed the same. That's good. But it doesn't fix the IIA violation. Suppose we add a feasible option where I get \$100 and you get \$10. That's dominated. You'd never take it. But if that option exists, it might change your maximum possible utility if the current frontier doesn't hit $y=100$.

  **Tomas:** In this specific problem, the frontier *does* hit $y=100$. So the utopia point is on the boundary. But I grant you: in general, KS is sensitive to the shape of the entire frontier, not just the tangent at the solution. I accept that trade-off. I'd rather have Monotonicity. I'd rather know that if the pie gets bigger for me, I don't lose slice size.

  **Priya:** And I'd rather know that if we throw away options we weren't going to use, the deal doesn't change. That's rational stability. Your solution says: "I will change our agreement on the \$100 because I noticed a theoretically possible outcome where you get everything and I get nothing, even if that outcome is inefficient." That's not fairness, Tomas. That's holding the agreement hostage to ghosts.

  **Tomas:** They aren't ghosts. They represent bargaining power. If you *could* walk away with \$100, even if you don't want to leave me with nothing, that potential leverage matters. Nash says leverage only matters if it changes the marginal rate of substitution at the settlement point. KS says leverage matters if it changes the horizon of possibility.

  **Priya:** But leverage should be about credible threats. The utopia point isn't a credible threat. It's a fantasy. I can't force you to take zero. The only credible threat is the disagreement point. Nash respects that. It builds up from the disagreement point using the local trade-offs.

  **Tomas:** And that's why Nash fails Monotonicity. Imagine a new scenario. Same \$100. But now, I have an outside option that gives me \$10 for sure if we don't agree. Disagreement point shifts to $(0, 10)$ in money, or $(0, \sqrt{10})$ in utils. The feasible set expands upward for me.

  **Priya:** And under Nash, depending on the curvature, my share could actually *increase* because your gain over disagreement is smaller, shifting the product max.

  **Tomas:** Exactly! The set expanded in my favor—I have a better fallback—and Nash might punish me by giving me a smaller share of the surplus. That violates basic fairness. If my position improves, I shouldn't lose. Kalai–Smorodinsky guarantees I don't.

  **Priya:** But KS guarantees it by looking at the *ideal* point, which might not have moved. If your outside option improves your disagreement point but not your maximum possible utility, KS might not reward you enough, or it might behave erratically depending on how the ideal point is defined relative to the new disagreement point.

  **Tomas:** KS is defined relative to the disagreement point. The ray connects $d$ to $a$. If $d$ moves up for me, the ray steepens. I get a larger share. It's monotonic in the disagreement point too.

  **Priya:** *[Sips coffee]* We're at an impasse. The axioms are incompatible. We can't have both IIA and Monotonicity.

  **Tomas:** We can't. So which one is "fairer"? Do we value consistency of choice over irrelevant options? Or do we value not being punished for an expansion of opportunities?

  **Priya:** I value consistency. If the solution changes because I added an option you'd never pick, the solution was never really about the options we care about. It was about the geometry of the hull.

  **Tomas:** And I value the relative gain. We are partners in this. We should walk away feeling we achieved the same fraction of our best-case scenario. You achieved 62% of your dream. I should achieve 62% of mine. Under Nash, you achieve 67%, I achieve 58%. You're leveraging your risk neutrality to squeeze me.

  **Priya:** I'm not leveraging anything. I'm just maximizing the product. The math doesn't care about your risk aversion; it just reflects it.

  **Tomas:** And the math of Kalai–Smorodinsky reflects the range of our potential.

  **Priya:** *[Looks at the ticket]* So, \$66.67 for me, or \$61.80?

  **Tomas:** \$61.80 for you. \$38.20 for me.

  **Priya:** IIA says I should take the \$66.67.

  **Tomas:** Monotonicity says I should demand the \$38.20.

  **Priya:** *[Smiles faintly]* You know, there's a third option. The Egalitarian Solution. Equal utility gains.

  **Tomas:** Requires interpersonal utility comparisons. We agreed we can't do that.

  **Priya:** Right. So we're back to the axioms.

  **Tomas:** It seems the fairness of the split depends entirely on which impossibility theorem you're willing to live with.

  **Priya:** Or which axiom you think a rational agent would refuse to violate. I won't violate IIA.

  **Tomas:** And I won't accept a solution where improving my options makes me worse off.

  **Priya:** *[Folds the napkin]* Well. We have the ticket. We have the pen.

  **Tomas:** And we have two different numbers.

  **Priya:** Shall we flip a coin to decide which axiom governs?

  **Tomas:** *[Laughs]* That's the only solution invariant to our bargaining power. Heads for Nash, Tails for Kalai–Smorodinsky?

  **Priya:** Deal. But if it's tails, I'm arguing Monotonicity is incoherent next time.

  **Tomas:** And if it's heads, I'm proving IIA is a trap.

  **Priya:** *[Pulls out a coin]* Ready?

  **Tomas:** Ready.
