answer: |-
  This is a superb question, and it is entirely fitting that a physicist should find this fragment both compelling and frustrating. Pascal is constructing a system of human relations that, like a physical model, relies on defined terms and forces, yet he arrives at a conclusion that seems to violate the initial boundary conditions.

  You have identified the precise tension that makes this fragment one of the most debated in the *Pensées*. To resolve it, we must look at how Pascal shifts the definition of "justice" between the first sentence and the last, and how his theological anthropology (the doctrine of the Fall) dictates the solution.

  Here is an analysis of the logical structure, the nature of the "concealment," and the final verdict on whether this is cynicism or necessity.

  ### 1. The Logical Impasse: Two Definitions of Justice
  Your translation is accurate. The apparent contradiction you sense—that Pascal rejects "force without justice" as tyranny, yet concludes that we made "the strong just"—dissolves if we recognize that Pascal is using the word *justice* in two different registers.

  *   **Justice₁ (Ontological/Divine):** This is justice in the first sentence ("force without justice is tyrannical"). This is absolute equity, truth, and moral rightness. For Pascal, this belongs to God. It is "sujette à dispute" among humans because our reason is corrupted by original sin. We cannot agree on what Justice₁ is.
  *   **Justice₂ (Sociological/Legal):** This is justice in the final sentence ("on a fait que ce qui est fort fût juste"). This is simply the established law, the status quo, the recognized authority.

  When Pascal says "force without justice is tyrannical," he means Force without Justice₁.
  When he says "we made that which is strong be just," he means we conferred the *title* of Justice₂ upon Force.

  He is not saying that Force *became* morally good. He is saying that to avoid perpetual civil war (which results from everyone disputing Justice₁), society agreed to treat Force *as if* it were Justice. The final sentence is therefore **descriptive, not normative.** It is a statement of historical and sociological fact: *This is how human societies actually function.*

  ### 2. The Physics of Social Order
  As a physicist, you might view this as a problem of equilibrium.
  *   **Ideal State:** Justice₁ + Force. (Moral rightness backed by power).
  *   **Unstable State:** Justice₁ without Force. (Righteousness that cannot enforce itself; "impuissante").
  *   **Violent State:** Force without Justice₁. (Tyranny).
  *   **Actual State (The Solution):** Force + The *Label* of Justice₁.

  Pascal argues that because Justice₁ is epistemologically inaccessible to fallen humanity (it is "open to dispute"), it cannot serve as the foundation for a stable state. Force, however, is "très reconnaissable" (easily recognized). It is an empirical fact. You know when an army is at the gate; you do not know for certain if a law is morally perfect.

  Therefore, society solves the stability problem by mapping the label "Just" onto the vector "Force." This stops the dispute. It does not make the force morally righteous, but it makes it **authoritative.**

  ### 3. The Role of Concealment
  You ask about the context where Pascal advises the wise to conceal from the people that law rests on establishment rather than equity (see *Pensées* L103/S135 and surrounding fragments on "The Mystic Foundation of Authority").

  This is not cynical manipulation in the Machiavellian sense (power for power's sake). It is **pastoral and political prudence** born of a tragic worldview.

  *   **The Danger of Truth:** If the ordinary person realizes that the King's law is based merely on historical conquest (Force) and not Divine Equity (Justice₁), they will lose respect for the law.
  *   **The Consequence:** Without respect for the law, society dissolves into the state of nature, which for Pascal is a war of all against all.
  *   **The Remedy:** We must allow the people to believe that Force *is* Justice. We must let them think the strong are just. This "fiction" preserves peace.

  So, does this make the fragment cynical? It makes it **realist.** Pascal believes that in a fallen world, we cannot have True Justice. We have to choose between Chaos (disputing Justice₁) and Order (accepting Force as Justice₂). He chooses Order, but he insists the "wise" know the difference so they do not idolize the State.

  ### 4. Is it Tyranny or Legitimacy?
  To answer your specific question: *"Does he think something real and minimally legitimate comes into being once force settles into unopposed custom?"*

  **Yes.** For Pascal, legitimacy is not derived from moral perfection; it is derived from **duration and custom.**

  In other fragments, Pascal argues that time creates right. "Custom is our nature," he writes. When Force persists long enough without successful challenge, it hardens into Custom. Once it is Custom, it acquires a "second nature" legitimacy. It is not *truly* just (in the eyes of God), but it is *civilly* just (in the eyes of men), and therefore it must be obeyed to maintain the peace.

  The "tyranny" he ruled out in the second clause refers to Force that is *naked*—Force that admits it is not Just. That provokes rebellion. Force that *clothes itself* in the robes of Justice (even if falsely) becomes "Legitimate Authority."

  ### 5. Summary for the Experimentalist
  If we treat this as an experimental report on the human condition:

  1.  **Hypothesis:** We want a society that is both Moral (Just) and Stable (Strong).
  2.  **Constraint:** Humans cannot agree on Morality (Justice is disputable). Humans can agree on Power (Force is recognizable).
  3.  **Observation:** Attempts to build society on Morality fail (powerless). Attempts to build society on Naked Power fail (tyranny/rebellion).
  4.  **Result:** The only stable configuration observed is one where Power appropriates the *name* of Morality.
  5.  **Conclusion:** We must obey this configuration to avoid chaos, but we must intellectually recognize it as a necessary fiction, reserving True Justice for the Kingdom of God.

  Pascal is not unmasking justice to destroy it; he is unmasking it to show us why we need grace. He is telling you that political justice is a stopgap measure for a broken species. The "concealment" is the lubricant that keeps the machine from grinding itself to dust.

  So, the final sentence is a **diagnosis of the human political condition**, not an endorsement of the morality of the strong. He is saying: *We could not make the Good Strong, so we made the Strong Good (by definition).* It is a lament, but also an instruction on how to live in a world where perfect equity is impossible.
