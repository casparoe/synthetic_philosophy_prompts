      *   *Distinction:* There is a difference between *True Justice* (divine/absolute) and *Human Justice* (conventional/legal).
      *   *Resolution:* Pascal is describing a *pragmatic substitution*, not a moral transformation. Force *claims* the title of justice to avoid constant war. It doesn't become *truly* just, but it becomes *socially* accepted as just to maintain order.

