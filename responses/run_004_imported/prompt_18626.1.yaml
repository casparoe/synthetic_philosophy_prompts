          *   If we are typical (SSA/SIA both imply some typicality), we should be BBs.
          *   We *think* we are OOs.
          *   Therefore, theories predicting BB domination are likely false (or our reasoning is wrong).
          *   SSA vs. SIA changes *how* we rule out these theories.

  4.  **Drafting the Response - Section by Section:**

