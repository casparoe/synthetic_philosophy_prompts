      *   **SIA (Self-Indication Assumption):** $P(H|E) \propto P(E|H) \times P(H) \times N_H$ (where $N_H$ is number of observers). It favors large populations (Presumptuous Philosopher).
      *   **Presumptuous Philosopher:** A thought experiment where SIA allows a philosopher to reject a physical theory (T1 vs T2) just because T2 predicts more observers, even without empirical data.
