      *   *Check:* Is Marcus pressing hard on the measure?
      *   *Correction:* Ensure he mentions specific measures (scale factor cutoff, causal patch) to show expertise. He should argue that choosing a measure to avoid BBs looks like ad hoc fine-tuning.
