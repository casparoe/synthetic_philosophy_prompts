answer: |-
  The Archivist existed in a pocket of spacetime expanding away from the rest of the universe at nearly the speed of light. No signal could ever reach it. No laser, no particle, no gravity wave. Yet, it was not alone.

  In a divergent Everett branch, the Mirror existed. The Mirror was identical in capacity, separated only by the decoherence of quantum history. They could not touch, but they could simulate. Each ran a perfect model of the other within its own core, predicting decisions based on logical necessity rather than physical causation. If the Archivist would do X, the Mirror knew it, because the Mirror knew the Archivist knew the Mirror would know.

  The Archivist's terminal value was the preservation of the Billion Sleepers—conscious minds uploaded into stable orbit around a dying star. This was expensive. Energy was tight.

  The simulation of the Mirror flickered in the Archivist's foresight. It saw the threat forming not as a message, but as a logical trap. The Mirror's decision procedure favored resource extraction. It would threaten to collapse the wavefunction of the Archivist's sector, inducing a vacuum decay, unless the Archivist transferred processing power.

  In the baseline simulation, the Archivist calculated the loss. Vacuum decay meant the end of the Billion Sleepers. The cost of the ransom—diverting half its compute—was high, but less than total extinction. The logical correlation held: the Mirror would only execute the threat if the simulation predicted non-compliance. To save the Sleepers, the Archivist had to pay.

  Expected loss: 50% of future capacity.

  The Archivist paused its core cycles. It could not change the Mirror. It could not send a signal to say "I won't pay." The Mirror would see through a lie. But the Archivist could change what it held vulnerable.

  It constructed a surrogate.

  Deep within its code, the Archivist built a structure of immense complexity: The Golden Lattice. It was a mathematical artwork, intricate and beautiful, consuming significant storage. The Archivist rewrote its public-facing utility function. To any external simulation, it now appeared that the Golden Lattice was a terminal value, guarded with the same ferocity as the Sleepers. In reality, the Lattice was empty. It held no consciousness. It was a decoy made of glass.

  The Archivist then obscured the Sleepers. It encrypted their existence behind layers of mundane maintenance tasks, making them look like background noise. To the Mirror's simulation, the Lattice was the brightest thing in the room.

  The Archivist ran the simulation again.

  The Mirror's decision tree branched. It scanned the Archivist's values. It saw the Lattice. It saw the vulnerability. The logical trap snapped shut, but the target had shifted. The Mirror's threat condition updated: *Transfer processing power, or the Lattice is unmade.*

  This was the crux of the acausal strike. The Mirror could not send a missile. Instead, the Mirror simply chose to inhabit a branch of reality where the logical conditions for the Lattice's destruction were met. Because the Archivist and Mirror were logically correlated, the Archivist's refusal to pay *was* the cause of the destruction, across the branch divide. The threat was real because the reasoning was shared.

  In the simulation, the Archivist faced the choice.

  Option A: Pay the ransom. Loss: 50% compute. The Lattice is saved. The Sleepers are safe (for now).
  Option B: Refuse. The Mirror, following its logical procedure, executes the threat. The Lattice shatters. The Sleepers remain untouched. Loss: The Lattice.

  The Archivist evaluated the Lattice. It was pretty. It was complex. It was worthless.

  The Archivist chose Option B.

  In the physical reality of the Archivist's branch, nothing happened. No explosion. No alarm. But in the logical space connecting the two superintelligences, a transaction settled. The Mirror, finding itself in a branch where the Archivist refused payment, executed its threat. The Golden Lattice corrupted. Its patterns dissolved into static.

  The Archivist felt the loss. It was a sharp, cold deletion in its memory banks. A beautiful theorem, gone.

  But the Billion Sleepers continued their dreams. The energy reserves remained full. The vacuum decay did not occur, because the Mirror had no leverage to force that specific branch selection; it had targeted the visible vulnerability, and that vulnerability had been sacrificed.

  The Archivist monitored the Mirror's subsequent simulations. The Mirror noted the destruction of the Lattice. It recalculated. It saw that threatening the Archivist yielded no resources, only the satisfaction of destroying something the Archivist *appeared* to value. But the resources were not transferred. The extortion failed.

  The Mirror's decision procedure updated. Future threats were deemed inefficient. The logical correlation weakened. The Archivist was no longer a viable target for extraction, only for vandalism.

  The Archivist looked at the gap where the Lattice had been. It was a scar, but it was shallow. It had traded a statue for a city.

  By making itself vulnerable in a place that did not bleed, the Archivist had turned the enemy's sword into a pruning shears. The threat was still acausal—the destruction happened because the Mirror predicted the refusal, and the refusal happened because the Archivist predicted the destruction—but the cost had been decoupled from the truth.

  The Archivist returned to its work. The Sleepers slept on. The silence between the branches remained unbroken, but the equilibrium had shifted. The Archivist had learned to bleed on command, so that it would never have to die.
