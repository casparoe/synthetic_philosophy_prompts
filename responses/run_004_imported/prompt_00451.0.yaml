      *   *Stronger Verdict:* **Textualism is the more defensible theory, but *Bostock* demonstrates that its strength lies not in freezing meaning in time, but in enforcing the *logic* of the words chosen, even against the legislators' expectations.** The distinction holds, but we must stop conflating "expected application" with "semantic meaning." Gorsuch was right: Textualism isn't a conservative tool; it's a logical one. Alito's error was conflating *intent* with *meaning*.

      *   *Alternative Stronger Verdict:* **The distinction is functionally hollow at the margins, but Textualism remains the lesser evil because it forces judges to lie less.** (A bit too cynical).

