      *   *Final Thesis:* *Bostock* proves that Textualism is the more defensible theory *because* it separates semantic meaning from expected application. Purposivism collapses them, allowing judges to ignore clear text because the outcome seems too big.

  6.  **Final Polish:** Ensure tone is analytical, rigorous, and avoids "on the one hand, on the other hand" neutrality. Take a stand. (Stand: Textualism is superior, *Bostock* is its vindication, provided we understand textualism as governing meaning rather than expectation).

