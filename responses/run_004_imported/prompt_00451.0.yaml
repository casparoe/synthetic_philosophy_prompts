answer: |-
  # The Elephant and the Algorithm: What *Bostock* Really Says About Statutory Interpretation

  The Supreme Court's 2020 decision in *Bostock v. Clayton County* was a legal Rorschach test. To progressives, it was a civil rights victory secured by a conservative justice. To conservatives, it was judicial legislation disguised as grammar. Justice Neil Gorsuch, writing for the majority, applied a rigid, almost algorithmic textualism to Title VII of the Civil Rights Act of 1964 and concluded that discriminating against an employee for being gay or transgender is necessarily discrimination "because of... sex." Justice Samuel Alito, in dissent, fired back that this was "purposivism in textualist drag," arguing that no one in 1964 intended the law to cover sexual orientation, and that Gorsuch was ignoring the "elephant in the room" that Congress does not hide in mouseholes.

  This collision has left many observers, yourself included, with a fractured mental model. If textualism is supposed to be a constraint that preserves the status quo and respects original legislative choices, why did it produce a transformative social outcome? If purposivism is supposed to effectuate the "spirit" of the law, why did the dissent rely so heavily on the historical expectations of the 1964 Congress?

  The confusion stems from a misunderstanding of what the debate is actually about. *Bostock* does not prove that the distinction between textualism and purposivism is hollow. Rather, it clarifies the distinction by forcing us to choose between two competing theories of democratic legitimacy. The verdict is clear: **Textualism is the more defensible theory of interpretation, but only if we accept that it governs the *semantic meaning* of the law, not the *expected applications* of the legislators.** *Bostock* vindicates textualism not because it reached a liberal outcome, but because it refused to let judicial assumptions about legislative intent override the logical operation of the enacted text.

  ### The Algorithm vs. The Elephant

  To understand why *Bostock* is a triumph for textualism rather than a refutation of it, we must look closely at Gorsuch's mechanism. He did not argue that the "purpose" of Title VII was to protect LGBTQ+ individuals. He explicitly disavowed legislative intent. Instead, he treated the statute as a logical proposition.

  Title VII makes it unlawful to discharge an individual "because of... sex." Gorsuch applied a "but-for" causation test standard in tort law: If the employee's sex were different, would the discharge have occurred? If a man is fired for dating men, but a woman would not be fired for dating men, the discharge turns on the employee's sex. Therefore, the text prohibits the conduct.

  This is textualism as code. It ignores the political climate of 1964. It ignores whether the 88th Congress would have been horrified by this outcome. It asks only: *Do these words, given their ordinary logical structure, cover this conduct?*

  Alito's dissent attacks this on contextual grounds. He invokes the "elephant in the mousehole" canon: Congress does not alter the fundamental details of a regulatory scheme in vague terms or ancillary provisions. To Alito, the "ordinary meaning" of "sex" in 1964 was biological binary sex, not sexual orientation or gender identity. He argues that Gorsuch is actually engaging in purposivism—updating the law to match modern values—while pretending to be bound by the text. Alito's textualism is one of *historical semantic context*; Gorsuch's is one of *logical semantic application*.

  ### The Crucial Distinction: Meaning vs. Expectation

  The friction in *Bostock* reveals the true fault line in statutory interpretation. It is not Text vs. Purpose. It is **Meaning vs. Expectation.**

  Purposivism, and Alito's version of contextual textualism, often conflate what a law *says* with what the legislators *thought* it would do. Alito's argument rests heavily on the fact that the 1964 Congress did not *expect* Title VII to protect gay or transgender employees. There is overwhelming historical evidence for this. But Gorsuch's counter-argument is devastatingly simple: "The limits of the drafters' imagination supply no reason to ignore the law's demands."

  Consider a speed limit. If a city council passes a law setting a speed limit of 55 mph to reduce accidents involving Model Ts, does that law not apply to Ferraris? A purposivist might argue the "purpose" was safety regarding 1930s technology, so the limit shouldn't bind modern cars. A textualist says the law says "55 mph," and the Ferrari is going 80. The text applies to situations the drafters never imagined because the *words* cover them.

  *Bostock* is the Ferrari case. The 1964 Congress passed a rule: "No discrimination because of sex." They may have only been thinking about the Model T (women being paid less than men for the same job). But the textual logic of the rule covers the Ferrari (firing someone for transitioning).

  This is where the distinction between the two camps does real work. Purposivism allows a judge to say, "The text says X, but the purpose was Y, so we will limit X to fit Y." Textualism says, "The text says X, and X logically implies Z, so Z is the law."

  ### Why Textualism Wins the Legitimacy Argument

  If we accept that the role of the judiciary is to apply the law as written by the legislature, textualism is the only defensible theory. Purposivism inevitably grants judges a veto power over clear text based on speculative assumptions about what the legislature "really wanted."

  Alito's dissent falls into this trap. When he argues that Congress wouldn't have passed Title VII if they knew it covered sexual orientation, he is asking the Court to engage in counterfactual political speculation. Maybe they wouldn't have. Or maybe they would have passed it anyway, accepting the "unintended" consequences as the price of a broad principle. By limiting the text to the "expected applications" of 1964, Alito is effectively amending the statute to match his guess of the political equilibrium of the 88th Congress.

  Gorsuch's approach respects democratic accountability more rigorously. If the outcome of *Bostock* is truly an "elephant in a mousehole" that Congress never intended, the remedy is for Congress to amend the law. They have the power to do so. By contrast, if the Court adopts Alito's approach, it insulates the statute from correction. It tells Congress: "We will interpret your broad words narrowly to match what we think you meant, so you don't need to be precise." This creates a moral hazard, encouraging legislators to use vague language knowing the courts will clean up the "mistakes" later.

  Furthermore, *Bostock* destroys the myth that textualism is inherently a conservative tool for preserving the status quo. Textualism is a methodology, not an ideology. It is a commitment to the *enacted word* over the *unenacted wish*. Sometimes, as in *Bostock*, the enacted word is broader than the unenacted wish. Sometimes, as in other cases, it is narrower. To demand that textualism always produce "conservative" outcomes is to demand that it be purposivism in disguise—purposivism with a conservative purpose.

  ### The Verdict: Textualism, But Without the Blindfold

  Does this mean textualism is perfect? No. *Bostock* reveals a vulnerability in Gorsuch's opinion: the claim that this is purely "ordinary meaning." Alito is right that "sex" in 1964 did not colloquially mean "gender identity." Gorsuch bridges this gap not through dictionary definitions, but through logical necessity (the but-for test). This suggests that "textualism" must be understood not as a search for historical dictionary definitions, but as a search for the **logical scope of the enacted rule.**

  Therefore, the verdict is this: **Textualism is the superior theory of interpretation, but it must be understood as a theory of *linguistic commitment*, not *historical freeze-drying*.**

  *Bostock* proves that the textualist/purposivist distinction is not hollow. It is the difference between a judge who asks, "What did the words legislate?" and a judge who asks, "What did the legislators anticipate?" The former is a judicial role; the latter is a legislative one.

  Purposivism fails as a general theory because it is unadministrable. "Purpose" is often multifaceted and contested. Title VII had multiple purposes: protecting women, protecting minorities, ensuring economic efficiency. Which purpose wins? Textualism provides a constraint: the words chosen.

  However, textualists must stop pretending that "plain meaning" is always obvious. Gorsuch's opinion works because he leans heavily on the logic of causation, not just dictionary definitions. A defensible textualism admits that context matters, but it treats context as a tool to understand the *words*, not to override them. Alito used context to narrow the words based on historical expectation. Gorsuch used logic to apply the words based on their structure.

  *Bostock* is a triumph for textualism because it demonstrates that a consistent commitment to the text can yield justice even when the political winds have shifted. It shows that the rule of law is not about preserving the past, but about honoring the commitments we made in the past, even when we didn't fully understand their scope.

  The distinction between textualism and purposivism is real, and it matters. Purposivism invites judges to save Congress from its own broad language. Textualism forces Congress to own its words. In a democracy, the latter is the only defensible position. *Bostock* did not bend textualism to reach a liberal result; it proved that textualism, when applied with intellectual honesty, is more powerful than the political assumptions of the legislators who wrote the law. The text is not a mousehole. It is a mandate. And if an elephant fits inside it, the elephant stays.
