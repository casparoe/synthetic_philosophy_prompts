  4.  **Drafting - Section by Section:**

      *   **Introduction:** Hook the reader with the *Bostock* paradox. The conservative judge, the liberal outcome, the accusatory dissent. State the thesis: *Bostock* does not hollow out the distinction; it clarifies it. Textualism is superior because it prioritizes the *enacted word* over the *anticipated application*, whereas purposivism allows judges to veto text based on speculative political constraints.
      *   **The Majority's Move (Gorsuch):** Explain the "but-for" causation. It's mechanical. It treats the statute like code. If X then Y. It ignores the "elephant" argument.
      *   **The Dissent's Counter (Alito):** The "Elephant in the Mousehole." Context matters. 1964 Congress didn't intend this. Calling it textualism is a sham.
      *   **The Deep Dive (The Crux):** What is "meaning"? Is it what they *thought* they were doing, or what the words *do*? Use the analogy of a speed limit. If the sign says 55, it applies to Ferraris even if the council only thought of Fords.
      *   **Evaluating the Theories:**
          *   Purposivism's flaw: It requires mind-reading. It allows judges to say "You didn't *really* mean this."
