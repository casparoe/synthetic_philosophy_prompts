prompt: |-
  Next week's podcast guest is a philosopher of religion whose new paper tries to finish something David Lewis (yes, the modal realism guy) left hanging in a weird little essay on penal substitution. Lewis's setup: nobody thinks a guilty offender's friend serving his prison sentence lets the offender off the hook, and he explains why -- punishment isn't like a debt, there's no "creditor" who just wants to be made whole again. But then he points out we're all totally fine with a friend paying someone's fine instead, which is just as much a case of one person's penalty landing on somebody else. He concludes that everyone, not just Christians defending the atonement, is quietly inconsistent about this, and ends by half-suggesting the shared inconsistency is itself weak evidence penal substitution can somehow make sense, even though he can't say how. My guest's paper is basically an attempt to supply the "how."

  Write me 7-8 interview questions that make her actually engage the argument rather then just restate it. I want one on Lewis's move to head off "fines are really just fees" by pointing at fines severe enough to feel like real punishment -- does her account still need that severity threshold, or can it be dropped? One on Lewis's own doubts about the "we just can't practically stop people gifting each other the money to cover a fine" explanation for why we tolerate fine-substitution -- does she think he's right to doubt it, and if so what's her alternative story? And one going after that closing "shared inconsistency is evidence" move, since that seems just as consistent with both sides sharing the same mistake. Give each question a follow-up keyed to the answer she'll most likely give.
