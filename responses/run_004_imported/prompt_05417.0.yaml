answer: |-
  1. **The Mechanism of Completion**
  Lewis's essay is famously a fragment; he identifies a tension in our intuitions about penalty-transfer but explicitly refuses to resolve it, leaving the theological door ajar without walking through it. Your paper claims to supply the missing mechanism. Are you arguing that Lewis identified the *right* puzzle but lacked the *right* metaphysics to solve it, or do you think he intentionally left it open because he suspected the solution required resources secular philosophy doesn't possess?

  *Follow-up:* She will likely argue that Lewis had the right intuition but lacked a specific account of *authority* or *covenant* to make the transfer stick. If so, press her: If the solution requires theological resources like covenant, does that undermine Lewis's use of the secular fine analogy? If the fine analogy only works when imported back into theology, does it actually do any independent argumentative work, or is it just an illustration?

  2. **The Severity Threshold (Mandatory)**
  Lewis anticipates the objection that fines are merely administrative fees rather than genuine punishment. He blocks this by pointing to fines severe enough to ruin a life, arguing that at a certain threshold, a fine *feels* like prison. Does your account of penal substitution rely on that severity threshold? In other words, for the substitution to be morally intelligible, does the penalty transferred need to cross a specific threshold of suffering, or can your account handle the transfer of trivial penalties?

  *Follow-up:* She will likely say severity matters because it distinguishes punishment from price. Push back: If severity is the key, does that imply the efficacy of the atonement is partly a function of the *intensity* of Christ's suffering? If God could have achieved the same result with less pain, does your account suggest He was obligated to minimize the "fine," or does the severity itself do the work?

  3. **The "Practical Impossibility" Objection (Mandatory)**
  Lewis rejects the idea that we allow fine-substitution simply because it's practically impossible to stop friends from gifting money. He thinks there must be a normative reason we permit it. Do you agree with his dismissal of the practical explanation? If we *could* perfectly police financial transfers, do you think we *should* ban friends from paying each other's fines, or is there a moral permission there that persists even if enforcement were perfect?

  *Follow-up:* She will likely argue there is a moral permission based on the fungibility of money versus the non-fungibility of bodily liberty. Press her: If money is fungible but the *liability* is personal, why does the liability attach to the wallet rather than the person? If you say liability can be transferred via money, why can't it be transferred via a plea bargain? Where exactly does the "fungibility" line get drawn in your account?

  4. **Punishment as Debt vs. Retribution**
  Lewis insists punishment is not a debt owed to a creditor; if it were, third-party payment would be unproblematic across the board. But your project is to make third-party payment problematic enough to be meaningful, yet possible enough to be valid. Are you secretly reintroducing a debt model to make the transfer work? If punishment isn't a debt, what is the "currency" being transferred in your account, and who holds the ledger?

  *Follow-up:* She will likely deny it's a debt and use a term like "satisfaction of justice" or "restoration of order." Push back: If it's not a debt, the "creditor" (God/State) shouldn't care who pays. If they *do* care who pays, doesn't that imply the punishment is essentially about the specific offender's moral reform? If so, how does substitution avoid rendering the punishment morally inert?

  5. **Voluntariness and the Friend**
  In Lewis's fine example, the friend pays voluntarily. In standard penal substitution, Christ volunteers. But in the prison example Lewis rejects, we usually assume the friend volunteering to sit in the cell is irrelevant; the law still says "no." Does voluntariness do any heavy lifting in your solution? If a stranger volunteered to serve my prison sentence today, would your account say the state *could* accept that without injustice, even if current law forbids it?

  *Follow-up:* She will likely argue voluntariness is necessary but not sufficient. Push back: If voluntariness isn't sufficient to justify prison substitution in secular law, why is it sufficient in the theological case? Is the difference merely that God has the authority to change the rules of justice, whereas the state does not? If so, doesn't that make penal substitution an act of divine power rather than an act of justice?

  6. **Inconsistency as Evidence (Mandatory)**
  Lewis's boldest move is suggesting that our shared inconsistency on fines versus prison is itself weak evidence that penal substitution *might* be coherent. A critic would say shared inconsistency is just evidence of a shared mistake, not a shared insight. Why should we treat this intuition gap as a crack in the wall that lets light in, rather than just a structural flaw we need to patch up by banning fine-substitution?

  *Follow-up:* She will likely argue that widespread intuitions track moral truth even when inconsistent. Push back: Widespread intuitions also track evolutionary biases. If the inconsistency arises because fines are impersonal and prison is personal, isn't that a coherent distinction rather than an inconsistency? If you argue it's an inconsistency, aren't you relying on the very intuition (that punishment is non-transferable) that you're trying to soften?

  7. **Secular Spillover**
  If your account successfully explains how penal substitution works by resolving Lewis's puzzle, does it have implications for secular criminal justice? If you can make sense of one person bearing another's penalty in the theological case, have you inadvertently made a case for allowing wealthy offenders to hire proxies for community service or even incarceration? Or is your solution hermetically sealed within the theology?

  *Follow-up:* She will likely say the solution is sealed because God's relationship to justice is unique. Push back: If the logic is sealed, then Lewis's secular analogy isn't doing the heavy lifting; it's just a metaphor. If the logic *isn't* sealed, and you've solved the philosophical problem of penalty transfer, why shouldn't secular courts adopt your model? Which is it: is this a general philosophical solution or a special theological plea?

  8. **Lewis's Modal Realism**
  David Lewis is best known for modal realism—the idea that all possible worlds are real. This essay is an outlier in his corpus, dealing with normative ethics and theology. Do you think his modal metaphysics influences this argument? For instance, does the idea of "possible punishments" or "counterfactual justice" play a hidden role in how you're finishing his argument, or is this purely a case of his analytic method applied to a new topic?

  *Follow-up:* She will likely say it's his analytic method, not his ontology. Push back: Lewis often treated logical space as a real landscape. If he treats the "inconsistency" as a feature of logical space, does your solution require us to treat moral truths as discovered features of that space? If so, does that commit us to a moral realism that many modern theologians might want to avoid?
