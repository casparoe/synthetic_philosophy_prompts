      *   *Solution 3: Logical Omniscience Relaxation (Impossible Worlds).*
          *   Idea: Standard probability assumes logical consistency. Real agents aren't logically omniscient.
          *   Mechanism: Assign probabilities to logical relationships themselves. $P(H \to E) < 1$.
