      *   *The Conflict:* If $E$ is "old evidence," the agent already knows $E$ is true. So, $P(E) = 1$.
      *   *The Consequence:* If $P(E) = 1$, then $P(E|H) = 1$. Therefore, $P(H|E) = P(H)$. The evidence $E$ does not change the probability of $H$. No confirmation occurs.
      *   *Real-world example:* Mercury's perihelion ($E$) was known before General Relativity ($H$). GR explained $E$. Intuitively, $E$ confirms $H$. Bayesianism says it shouldn't.
      *   *Why is it deep?* It strikes at the heart of *diachronic* (over time) vs. *synchronic* (at a time) rationality and the nature of logical omniscience.

  3.  **Addressing "Why is this a genuine problem?"**
      *   It's not just a coding bug. It's about the *normative* claim of Bayesianism. Bayesianism claims to model rational belief update. If it fails to model one of the most famous cases of scientific confirmation (Einstein/Newton), its claim to be a *general* theory of confirmation is weakened.
      *   It highlights the assumption of *Logical Omniscience*. Standard Bayesian agents know all logical consequences of their beliefs. If you know $H$, and $H \implies E$, you must already know $E$. If you already know $E$, $P(E)=1$.
