          *   *Refinement:* Focus on whether bounded proof checkers evade the theorem or just push the can down the road (e.g., needing to trust the bound itself).
          *   *Follow-up:* If she says "Bounds solve it," ask about the meta-trust in the bound.

      *   *Q3 (FairBot/Cooperation):* The tension between obstacle and tool.
          *   *Draft:* You use Löb for FairBot but say it stops tiling. Why the difference?
          *   *Refinement:* Focus on the direction of the implication. In FairBot, we want a fixed point. In tiling, we want a soundness transfer.
          *   *Follow-up:* If she says "Different contexts," ask if the underlying logic is actually different or just the goal.

      *   *Q4 (Human Self-Trust):* The philosophical angle.
          *   *Draft:* Are humans broken too?
          *   *Refinement:* If formal agents can't do it, and we can, does that prove we aren't formal? Or that we are inconsistent?
          *   *Follow-up:* If she says "Humans are inconsistent," ask if that's a safe property for AGI.

      *   *Q5 (The "Patches"):* Addressing her specific view on hierarchies/probabilistic methods.
          *   *Draft:* Why don't hierarchies work?
          *   *Refinement:* Focus on the "strength loss" per generation. If you weaken every time, the chain dies.
          *   *Follow-up:* If she suggests "asymptotic stability," ask for the formal mechanism that avoids the drop.

      *   *Q6 (Probabilistic/Logical Induction):* Specific technical counter-argument.
          *   *Draft:* What about Logical Induction?
