          *   *Draft:* You say people change the question. How?
          *   *Refinement:* Ask for a concrete example where a proposed solution solves $X$ but the actual problem was $Y$.
          *   *Follow-up:* If she gets abstract, ask for the specific definition of "trust" being altered.

      *   *Q8 (Existential Risk/Safety):* Why does this matter practically?
          *   *Draft:* Is this just theory or does it kill AGI safety?
          *   *Refinement:* If we can't tile, can we do recursive self-improvement safely?
          *   *Follow-up:* If she says "We just don't let them modify," ask about instrumental convergence finding a way anyway.

      *   *Q9 (Constructive vs. Non-Constructive):* A bit more technical.
          *   *Draft:* Is there a constructive way out?
          *   *Refinement:* Focus on whether the impossibility is a hard limit or a sign we need new logic.
          *   *Follow-up:* If she says "New logic," ask if that logic is sound.

      *   *Q10 (Closing/Personal):* What keeps her up at night?
          *   *Draft:* What's the big takeaway?
          *   *Refinement:* What's the one intuition you wish more AI researchers had about this?
          *   *Follow-up:* If she gives a platitude, ask for a specific misconception.

      *(Self-Correction during drafting)*: I need to make sure the follow-ups are specific "dodges." Logicians often dodge by saying "It depends on the formalization" or "That's a philosophical question, not mathematical." I need to anticipate those.

      *Re-evaluating Q1 (Löb vs Gödel):* Dan's point is common. G2 says $\neg \text{Prov}(\text{Con})$. Löb says $\text{Prov}(\text{Prov}(C) \to C) \to \text{Prov}(C)$. In tiling, we want $A \vdash \forall \phi (\text{Prov}_B(\phi) \to \phi)$. If $A$ and $B$ are same strength, this implies $A$ proves its own soundness, which implies inconsistency (via G2/Löb). The distinction is subtle. G2 is about Consistency, Löb is about Soundness/Truth. I need to make sure the question highlights *Soundness* vs *Consistency*.

      *Re-evaluating Q3 (FairBot):* FairBot uses Modal Logic of Provability (GL). The cooperation happens because the fixed point exists. Tiling fails because the soundness transfer fails. The question should highlight that Löb's theorem *creates* the fixed point for cooperation but *blocks* the soundness transfer for tiling.

