          *   *Refinement:* Make it sharper. G2 is about consistency; Löb is about soundness/trust in implications.
          *   *Follow-up:* If she says "They are equivalent," push on the structural difference in the tiling context.

      *   *Q2 (Bounded Agents):* Real computers aren't infinite.
