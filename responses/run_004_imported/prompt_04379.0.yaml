      *   *The Framework:* Branching time (multiple possible futures).

  3.  **Analyze Peirceanism:**
      *   *Truth Condition:* $Fp$ (It will be that $p$) is true at moment $m$ iff $p$ is true at all histories passing through $m$.
      *   *Implication for Sea Battle:* If the future is branching (contingent), there is a history with a battle and one without. So $Fp$ is false. $F\neg p$ is also false.
      *   *Handling Determinism:* Rejects Bivalence for future contingents. $Fp \lor F\neg p$ is not a theorem.
      *   *Cost:* Loss of duality. $\neg Fp$ does not imply $F\neg p$. "It is not the case that there will be a battle" is true, but "There will be no battle" is false. This feels linguistically awkward.
      *   *Prior's Preference:* Prior liked this because it validates the intuition that future contingents aren't *settled* true yet. It aligns with an "open future."

  4.  **Analyze Ockhamism:**
      *   *Truth Condition:* Truth is relativized to a moment-history pair $(m, h)$. $Fp$ is true at $(m, h)$ iff $p$ is true at the moment on $h$ corresponding to tomorrow.
      *   *Implication for Sea Battle:* At $(m, h_1)$, $Fp$ is true. At $(m, h_2)$, $Fp$ is false.
      *   *Handling Determinism:* Rejects the idea that truth at a moment is absolute (monadic). It accepts bivalence relative to a history, but not relative to a moment *simpliciter*.
      *   *Cost:* What is the truth value of "There will be a sea battle" *now*, without picking a history? It lacks a truth value *simpliciter*. This makes assertion tricky. If I assert it, am I asserting it relative to the "actual" history? But which one is that?
      *   *Belnap's Contribution:* Developed the formal semantics (BT + Ockhamist valuation).

