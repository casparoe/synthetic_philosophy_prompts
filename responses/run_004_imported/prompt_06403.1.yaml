answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm in the same PhD program as Priya, though I work in philosophy of mind. So, while Priya has been spending the last few years mapping the intricate architecture of value and ethics, I've been over in the corner arguing about whether a robot can feel pain. Stepping up to talk about ethics tonight feels a bit like a mechanic trying to perform surgery—but for Priya, I'm willing to risk a malpractice suit.

  As many of you know, Priya is defending her dissertation on G.E. Moore's *Principia Ethica* next month, and then marrying Dan the week after. It is incredibly fitting that her entrance into married life is bookended by Moore. Because if you know Moore, you know he isn't exactly the poet of love. He's rigorous. He's precise. He's, well… a philosopher.

  But there is one idea in Moore's work that I think perfectly captures what is happening here tonight. Moore argues that the best things in life are what he calls "organic unities."

  For the family members wondering if you need a degree to understand this: you don't. It's actually a very simple idea. Moore says that the value of a whole isn't just the sum of its parts. Sometimes, when you bring two good things together, they don't just add up; they multiply. They create a third thing that is greater than the two individuals could ever be alone.

  Priya is brilliant, kind, and fiercely driven. Dan is [insert 1-2 genuine traits, e.g., grounded, witty, deeply patient]. They are both wonderful people on their own. We love them individually. But Moore would argue that the *relationship* between them has a value that exceeds Priya-plus-Dan. That union is an organic unity. It's a new entity with its own worth.

  However—and here is the part that matters, and the part Priya would yell at me if I got wrong—Moore is incredibly strict about *how* that value is generated. He argues that personal affection is only truly good if it is directed at something that is actually good.

  In other words, love isn't valuable just because it feels intense. It's valuable because it is *true*.

  Moore warns against affection based on illusion. If you love someone because you've put them on a pedestal, or because you're ignoring their flaws, or because you love the idea of them rather than the reality, Moore says that diminishes the value of the whole. It's not a true organic unity; it's a fantasy.

  And this is why I am so confident in this marriage.

  I have watched Priya and Dan together for [length of time]. I have never seen them try to flatter each other with illusions. I have seen them challenge each other. I have seen Priya rely on Dan's [specific strength] when she was [specific stressful situation, e.g., writing/changing jobs]. I have seen Dan light up when Priya [specific action, e.g., explains her work/makes a joke].

  They don't just admire each other; they *see* each other. Their affection tracks the actual good qualities in the other person. It is accurate. And because it is accurate, it is durable.

  To the philosophers in the room: Yes, I am aware Moore distinguishes between the cognitive state and the emotional state, and yes, I am simplifying the supervenience of value. But I think you'll agree the application holds.

  To the rest of the family: What this means is that Priya and Dan aren't just "in love." They are partners who recognize the best in one another, and by bringing those best parts together, they are building a life that is bigger than what either could build alone.

  Priya, you've spent years analyzing what makes things "good." Tonight, you don't have to analyze it. You just have to live it.

  So, if we accept Moore's premise—that a true affection directed at a genuine good creates one of the highest values possible—then looking at this couple, the room is practically overflowing with value.

  Please raise your glasses. To the organic unity. To Priya and Dan.
