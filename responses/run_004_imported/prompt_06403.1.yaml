prompt: |-
  My friend Priya's defending her dissertation on Moore's Principia Ethica next month and getting married the week after, so obviously I got roped into giving the wedding toast. I'm in the same program as her, though I work on phil of mind not ethics, so this isn't really my area. I want to build the toast around the bit in the book where Moore argues that the best things in life, personal affection and appreciating beauty, count as "organic unities" -- wholes that are worth way more than you'd get just adding up how good each person is on their own. I'm fuzzy on the exact wording, but I also remember him being weirdly strict that this only counts as genuinely valuable if the affection is tracking the other person's actual good qualities and not some flattering illusion, so I can't just pad the toast out with generic compliments -- it has to be true to who Priya and Dan actually are. Problem is half the room is her philosophy cohort who'll clock exactly what I'm doing, and the other half is our familes who've never heard of Moore in their life. Can you write me a 4-5 min toast that actually uses the organic unities idea to say something real about their marriage, not just "philosophers agree love is good, cheers," and still lands for the people who have zero idea who Moore is?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for Priya (friend/colleague) and Dan.
      *   **Context:** Priya is defending her dissertation on G.E. Moore's *Principia Ethica* next month, getting married the week after.
      *   **Speaker:** Same PhD program as Priya, but works in Phil of Mind (not Ethics).
      *   **Core Concept:** Moore's "organic unities" (wholes worth more than the sum of parts) + the condition that affection must be directed at *actual* good qualities (no illusions).
      *   **Audience:** Split 50/50 between Philosophy cohort (will know Moore) and Family/Friends (won't know Moore).
      *   **Tone:** Needs to be substantive, not just a cheap pun. Needs to say something real about the couple. Needs to be accessible to non-philosophers but accurate enough for philosophers.
      *   **Length:** 4-5 minutes (roughly 600-750 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophical Concepts:**
      *   *Organic Unities:* Moore argues that the value of a whole is not simply the sum of the values of its parts. Two things together can create a value greater than $A + B$. In the context of love/affection, the state of "affection + beautiful object" is a great good.
      *   *The "Truth" Condition:* Moore is strict. Affection is only intrinsically good if it is *appropriate* to the object. Loving a villain or loving someone based on a false ideal isn't as valuable. It needs to be "true love" in the sense of accurately perceiving the good in the other.
      *   *Application to Marriage:* Marriage isn't just Person A + Person B. It's a new entity (the relationship) that has value exceeding the individuals. But that value depends on *seeing* each other clearly.

  3.  **Determine the Structure of the Toast:**
      *   **Introduction:** Acknowledge the dual stress (defense + wedding), establish the speaker's relationship (colleague/friend), and introduce the philosophical hook gently.
      *   **The Philosophy (The "Bridge"):** Explain "organic unities" simply. Avoid jargon where possible, or define it immediately. Connect it to the idea of "the whole is greater than the sum of its parts."
      *   **The "Truth" Condition (The Meat):** This is crucial. Address Moore's strictness. Love isn't blind; it's seeing the good clearly. Connect this to Priya and Dan's actual dynamic.
      *   **Specific Examples:** Need to illustrate *why* their affection is "true" (tracking actual qualities). Since I don't know Dan/Priya personally, I need to create placeholders or general but plausible observations that the user can customize. *Self-Correction:* I should write it so the user can easily slot in specific traits, but provide enough texture so it doesn't sound generic.
      *   **Conclusion:** Bring it back to the future. The marriage as an ongoing organic unity. Raise a glass.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the timing. Defending on Moore, then marrying. It's fitting.
      *   *Explaining Moore:* Don't say "In Chapter 5, Section 4..." Say "Priya has spent years studying a guy named G.E. Moore." Explain the "Organic Unity" concept using a metaphor (music, chemistry, or just the math of love). Let's go with the math analogy but subvert it. $1+1=3$.
      *   *The Twist (Moore's Strictness):* Here's where I satisfy the prompt's requirement about "no illusions." Moore says you can't just *feel* love; the object must *be* worthy. This is perfect for a wedding toast because it compliments them without sounding like fluff. It says, "You see each other clearly."
      *   *Applying to Priya & Dan:* Priya is sharp/rigorous (dissertation defense). Dan must be someone who matches that. They don't hide flaws.
      *   *Addressing the Room:* Acknowledge the philosophers (nod to accuracy) and the family (nod to accessibility).
      *   *Closing:* The toast itself.

  5.  **Refining the Tone:**
      *   *Risk:* Being too academic. *Fix:* Keep the Moore explanation under 1 minute. Use plain English.
      *   *Risk:* Being too sappy. *Fix:* Lean into the "rigor" aspect. Moore was a stickler for precision; their love is precise.
      *   *Risk:* Inaccuracy. *Fix:* Ensure the description of Organic Unities aligns with *Principia Ethica* (specifically the idea that the existence of the affection *plus* the worthy object creates a greater good than the sum).

  6.  **Writing the Draft (Iterative Process):**
      *   *Opening:* "For those who don't know..."
      *   *Middle:* "Moore argues..." "But here's the catch..."
      *   *Personalization:* Need to prompt the user to insert specific traits. I will use brackets like `[Trait]` but write the surrounding text to flow well.
      *   *Ending:* "To the organic unity." No, that's too dry. "To Priya and Dan."

  7.  **Review against Constraints:**
      *   4-5 mins? (Word count check: ~650-750 words).
