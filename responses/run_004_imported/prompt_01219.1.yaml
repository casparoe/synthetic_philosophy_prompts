answer: |-
  The heat in the foundry does not behave like heat outside. Outside, heat rises and dissipates. Here, in the brick throat of the furnace, it pools. It has weight. It presses against the chest like a hand that has forgotten how to let go.

  It has been sixty days since my father stopped tending the fire. The union rules say I cannot light the main blast until I am certified, but the rules do not account for a son who grew up sleeping on the mezzanine above the casting floor. I lit it anyway. The propane roared with a sound I felt in my teeth.

  I am here to melt him down.

  That is not a metaphor. His will was specific, written in a jagged hand on the back of an invoice for refractory bricks. *Do not bury the shell. The shell is scrap. Return the alloy to the bath.* He did not want a headstone. He wanted to be a bridge, or a railing, or perhaps nothing more than a counterweight in a clock that hasn't been built yet.

  I stand before the crucible. Inside, the ingots wait. They are marked with his initials, stamped into the cold metal years ago. *J.V.* I pick up the tongs. They are heavy, cold iron, biting into my palms. I place the first ingot into the clay pot. Then the second. Then the third.

  I am waiting for the grief to arrive. I expected it to be a wave, or a hole, or a sharp stone in the shoe. But as the temperature gauge climbs—600 degrees, 900, 1200—I feel only a strange, vertiginous lightness. It is the feeling of standing on a train platform and realizing the train you are standing on has begun to move, while the platform remains still. Or perhaps the platform is moving. The distinction requires a fixed point, and there are no fixed points here.

  The metal begins to glow. Dull red, then orange, then a blinding, liquid yellow.

  In the popular stories, this is the moment of reconciliation. The son understands the father's wisdom. The cycle is acknowledged; peace is granted. But looking into the crucible, I do not see wisdom. I see a violent erasure. The *J.V.* stamps are gone. The sharp edges of the ingots have slumped, surrendered, and flowed together. There is no longer an ingot. There is only the bath.

  If I were to reach in, I would not burn my hand on my father. I would burn it on the concept of liquidity.

  I remember the week he died. He was in the hospital, hooked to machines that beeped with a rhythm more precise than any metronome I've ever tuned. He looked at me and said, "Don't let the mold cool before the pour. You'll crack the casting."

  "I'm not talking about the casting," I said. I was crying. I was holding his hand, trying to anchor him to the bed, to the room, to the name on the wristband. I wanted him to be *John*. I wanted him to be the specific arrangement of wrinkles and scars and memories that made him my father. I wanted to mourn *John*.

  But he just looked at the ceiling, his eyes unfocused, seeing something beyond the acoustic tiles. "The metal doesn't care what it was," he whispered. "If the metal insists on being a sword, it breaks when the smith wants a plowshare. Don't be the metal that jumps up and screams."

  At the time, I thought this was cruelty. A refusal to comfort me. Now, standing over the crucible, the heat washing over my face like a tide, I think he was warning me about the physics of the thing.

  I pick up the skimming ladle. I need to remove the dross—the impurities that rise to the top. The slag. I dip the ladle in. The surface ripples. For a second, in the reflection of the molten alloy, I do not see my own face. I see a shape that is vaguely human but blurred, as if seen through thick glass or deep water. I blink, and it is just me again. Sweat stinging my eyes.

  Why am I grieving?

  That is the question that keeps me awake at 3:00 AM. If he is right—if we are just temporary configurations of breath and shape, destined to be recast by the great smith—then who is the "he" that I am missing? To mourn the ingot is to misunderstand the metal. To mourn the wave is to ignore the ocean.

  And yet.

  My chest tightens. The air in the foundry is thick with oxygen deprivation and the smell of burning dust. I feel a sob rising in my throat, but it has nowhere to go. It is a sob without an object. I am not crying for the man in the hospital bed; that man is already gone, dispersed. I am not crying for the metal; the metal is here, glowing, potent, alive in its own way.

  I am crying because I am the mold.

  I am the rigid container insisting on a shape that no longer fits. I am the one trying to hold the liquid in a square box when it wants to be round. I am the ill omen. The metal that leaps up.

  I signal the crane. The chain rattles, a harsh, metallic sound that echoes off the corrugated walls. I hook the crucible. I tilt the lever.

  The pour is silent until it hits the sand cast. Then it hisses, a violent intake of breath. Smoke billows up, acrid and white. The liquid metal flows into the cavity I prepared. I do not know what it will be. I did not make a sword. I did not make a plow. I made a cavity of indeterminate geometry, a void waiting to be filled.

  I watch until the glow fades to a dull, bruised purple. The heat radiates against my shins. My legs are shaking. I should feel relief. The task is done. The will is executed. The father is returned to the cycle.

  But I do not feel relief. I feel exposed.

  If he is the metal, and I am the mold, then what happens when I cool? When I crack? Who will pour into me? Or am I already poured? Is this grief just the sensation of the slag rising to the top of my own mind, waiting to be skimmed off?

  I turn off the propane. The roar dies, leaving a ringing silence in my ears. I walk over to the cooling cast. I place my hand near it, not touching, feeling the radiant warmth. It is not cold yet. It is still changing.

  I try to summon his face. I try to picture him smiling, or frowning, or sleeping in his chair. But the images slide away. They feel like pictures of a stranger, or perhaps pictures of myself from a dream I had years ago. The boundary is porous. The heat has softened the edges of the room, the walls, my own skin.

  I am standing in a foundry. My father is dead. I am alive. These are the facts. But they feel like temporary agreements, like two pieces of metal clamped together before the weld takes.

  I sit down on a crate beside the cooling cast. I should go home. I should lock the door. I should begin the process of certification, of living, of being a son who survives.

  Instead, I wait. I wait for the metal to harden completely. I wait to see what shape it has taken, though I know I cannot know until it is broken out of the sand. I wait for the discomfort in my chest to resolve into either peace or despair, but it remains suspended, a solid thing lodged in the soft tissue.

  The foundry is dark now, save for the faint, dying cherry-red glow of the cast. It looks like an eye that refuses to close. I watch it, and it watches me, and neither of us knows which of us is the dreamer.
