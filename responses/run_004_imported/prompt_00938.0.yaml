      *   **Core Concept 3: Gradients.** The steam engine works because of a temperature difference. The stone on the ground is in equilibrium.
      *   **Conclusion:** Eddington isn't glossing over a gap; he is highlighting the difference between an isolated system (cards/fallen stone) and a process driven by a gradient (steam engine). The "Arrow of Time" points to the net increase, not the local decrease.

  8.  **Final Polish:** Ensure the tone is respectful of the user's scholarship and provides clear, modern analogies (like the air conditioner or refrigerator) to supplement the steam engine. (A refrigerator makes ice [ordered] by heating the kitchen [disordered]).

