      *   *The "Gap":* There is no gap in the physics, but there is a rhetorical leap. Eddington assumes the reader understands that a steam engine requires a fuel source and a sink. He is emphasizing that energy allows for *local* reversals of entropy at the cost of *global* increase, whereas the card analogy suggests a monotonous increase without the possibility of local extraction.

