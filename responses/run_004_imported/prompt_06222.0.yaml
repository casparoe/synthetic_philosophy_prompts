answer: |-
  Welcome, everyone. Thanks for making the trip. Look around the room for a second. We have a unique configuration of people here. Half of you have read the sequences and could probably derive the leverage penalty on a napkin. The other half of you sign the checks and get rightfully nervous when someone starts talking about infinite expected value. I need both of you for this to work, which means we need to be honest about the trap we're walking into.

  We exist to fund the stuff that looks like a bad bet to everyone else. If the path was clear, the government or the big foundations would have already covered it. We are here for the high-variance tail, the projects that probably won't work but might change everything if they do. But there is a specific failure mode for a foundation like ours. It's the temptation to be seduced by the size of the prize rather than the quality of the plan. We all know the math. If you multiply a tiny probability by an astronomical outcome, the number gets big. It's tempting to just shut up and multiply. But if we do that blindly, the first person who walks in here claiming they can save three to the power of three lives walks away with our entire endowment, and we're done by lunch.

  On the other hand, if we swing too hard the other way and dismiss anything with odds lower than ten percent, we aren't a long-shot fund. We're just a conservative grantmaker with a branding problem. We'd miss the actual black swans. So we need a decision rule that sits in the uncomfortable middle.

  Here is how we are going to handle it this quarter. We are going to treat the magnitude of the claim as a demand for mechanistic evidence. If you tell us you're going to save a thousand lives, we need to see a plausible budget and a team. If you tell us you're going to save a billion lives, a budget and a team aren't enough. We need to see the physics, the causal chain, and the proof of work that scales with that ambition. You cannot have astronomical leverage resting on a single point of failure. That is our heuristic. The bigger the claim, the heavier the burden to show the mechanism isn't magic.

  I want to be clear about what this costs us. This rule is not perfect. By demanding that the mechanism scale with the claim, we are admitting that we might reject the one project that actually works through a miracle or a breakthrough we didn't anticipate. We are building a firewall against mugging, and yes, that means some real signal might get blocked. We are accepting that risk. We are choosing to survive as an institution over the possibility of funding a moonshot that relies entirely on faith. We need to be able to look at the donors and say we stewarded the capital, and we need to be able to look at ourselves and say we didn't ignore the tails entirely.

  So when you pitch today, don't just sell us the outcome. We can imagine the outcome ourselves; that's why we're here. Sell us the bridge between where we are and where you say you're going. If the bridge looks too thin for the weight you're asking it to carry, we're going to pass, no matter how beautiful the destination is. This isn't about being skeptics or believers. It's about being engineers. We're building a portfolio, not buying a lottery ticket. Let's get to work.
