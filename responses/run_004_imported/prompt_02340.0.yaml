answer: |-
  Here is the strongest version of your argument. It frames the debate not around intuition (which is subjective) but around **theoretical utility and logical coherence**. The core claim is that while Universalism and Nihilism have counterintuitive *consequences*, Organicism has destructive *foundational costs* that undermine the very project of metaphysics.

  ***

  ### The Argument: Why Ontic Indeterminacy is a Dealbreaker

  Your friend is right that van Inwagen bites the bullet on vagueness in *Material Beings*. He admits that if "constituting a life" is vague, then it can be indeterminate whether some objects compose a whole, and therefore indeterminate how many concrete objects exist.

  However, you can argue that this concession is fatal. It is not merely a "cost"; it is a collapse of the framework required to do ontology in the first place. Here is the case for why accepting indeterminate cardinality is a significantly higher theoretical price than the "extreme" views of Lewis (Universalism) or Sider (Nihilism).

  #### 1. The Logical Cost: Breaking the Quantifier
  The most damaging argument against van Inwagen comes from Theodore Sider and David Lewis. They argue that existence is expressed by the logical quantifier ($\exists$). In classical logic, the quantifier is precise. For any $x$, either $x$ exists or it does not.

  If van Inwagen is right, then the quantifier itself is vague. This creates a catastrophe for logical reasoning about the world.
  *   **The Problem:** If cardinality is indeterminate, then statements like "There are exactly $n$ objects in this room" lack a truth value.
  *   **The Consequence:** This doesn't just affect metaphysics; it bleeds into mathematics and science. If the number of concrete particulars is ontically indeterminate, then the mapping between physical reality and set theory becomes unstable.
  *   **Comparison:** Lewis's "trout-turkeys" are weird, but they don't break logic. There is a determinate fact that a trout-turkey exists. We can count it. Van Inwagen's view implies that *counting itself* can fail to yield a fact. It is better to have a bloated ontology (Lewis) than a broken logic.

  #### 2. The Metaphysical Priority of Existence
  Vagueness is acceptable in derivative properties, but not in fundamental existence.
  *   **Semantic vs. Ontic:** We accept that "heap" is vague. But that is semantic vagueness; the atoms themselves are determinately arranged. Van Inwagen is committed to *ontic* vagueness: reality itself is fuzzy.
  *   **The Gravity of Existence:** Existence is not a property like "being tall" or "being red." It is the precondition for having properties. To say that *existence* is indeterminate is to say that it is indeterminate whether reality includes a certain entity.
  *   **The Argument:** If reality is fundamentally precise (a standard metaphysical assumption), then vague existence is impossible. If reality is *not* fundamentally precise, then metaphysics becomes a study of fuzziness rather than structure.
  *   **Comparison:** Nihilism (Sider) says "tables don't exist." That is a precise, hard fact. It cuts reality cleanly. Universalism says "everything exists." That is also a precise, hard fact. Organicism says "it's kinda fuzzy." In a contest of theoretical virtues, **Precision** outweighs **Intuition**. It is better to be precisely wrong (Nihilism/Universalism) than vaguely right (Organicism).

  #### 3. The Evans Argument and Identity
  Gareth Evans famously argued that vague existence entails vague identity, which is absurd. If it is indeterminate whether object $X$ exists, is it indeterminate whether $X = X$?
  *   Van Inwagen tries to dodge this by denying that vague composition leads to vague identity. He argues the *objects* are precise, but *whether there is an object* is vague.
  *   **Your Counter:** This distinction is thin and costly. If there is no fact of the matter about whether the xs compose a $y$, then there is no fact of the matter about whether $y$ is identical to itself (since if it doesn't exist, it can't be self-identical).
  *   **The Cost:** To save Organicism, van Inwagen must reject standard principles of identity logic. Lewis and Sider preserve classical identity logic. Again, preserving logic is a cheaper theoretical cost than preserving the intuition that "organisms exist but trout-turkeys don't."

  #### 4. Theoretical Virtues: Parsimony vs. Simplicity
  Your friend might argue Organicism is more *parsimonious* (fewer objects than Universalism). But you should argue it is less *simple*.
  *   **Universalism:** One simple rule: Composition always occurs.
  *   **Nihilism:** One simple rule: Composition never occurs.
  *   **Organicism:** One complex, vague rule: Composition occurs when... life happens? (But when does life begin? When does it end? Is a virus a life?)
  *   **The Trade-off:** Lewis pays with ontological abundance (too many objects). Van Inwagen pays with ideological complexity (vague primitives). In metaphysics, ideological simplicity (having clear, precise concepts) is generally more valuable than ontological parsimony. A universe with a trillion trout-turkeys is messy; a universe where *existence* is fuzzy is unintelligible.

  #### 5. The "So What?" Factor
  Finally, press the practical implication of the disagreement.
  *   **Lewis's Cost:** If Lewis is right, we just have to acknowledge that "object" is a broader category than we thought. It changes nothing about how we interact with tables or organisms. It is a harmless inflation.
  *   **Van Inwagen's Cost:** If van Inwagen is right, then during the process of conception or death, there is a period where the universe literally lacks a determinate number of things. This implies a "metaphysical glitch" in reality during biological transitions.
  *   **The Punchline:** It is less costly to accept the existence of weird fusions (Lewis) than to accept that the universe undergoes periods of indeterminate cardinality. The former expands our inventory; the latter undermines the inventory system itself.

  ### Summary for the Debate
  "Van Inwagen's middle road collapses because the bridge is made of fog. Lewis and Sider offer us maps of the world that are precise, even if the territory they describe is weird (trout-turkeys) or sparse (no tables). Van Inwagen offers us a map that matches our intuition of the territory but admits the grid lines themselves are blurry.

  If we have to choose between a map that includes too many islands (Universalism) and a map where the number of islands is sometimes undefined (Organicism), we must choose the former. Indeterminate cardinality isn't just a bullet to bite; it's a refusal to play the game of ontology. Logic requires determinate truth values for existence claims. Van Inwagen sacrifices logic to save common sense. Lewis sacrifices common sense to save logic. Logic is the tool we use to argue, so we cannot sacrifice it without sawing off the branch we're sitting on."
