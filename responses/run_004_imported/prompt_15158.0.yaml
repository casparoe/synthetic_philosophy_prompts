answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I've known Priya for years, and I've had the privilege of watching her and [Partner's Name] build a life together.

  Now, looking around this room, I realize I have a unique challenge. About half of you are family who just want to know if the couple is happy. The other half are philosophy PhDs and EA forum regulars who are currently running a cost-benefit analysis on the open bar.

  So, let's address the elephant in the room. I know what some of you are thinking. We are gathered here to witness a union that costs roughly thirty thousand dollars. In a strictly impartial, scope-sensitive framework, that capital has a high counterfactual impact. We could have eloped at the courthouse and funded several thousand malaria nets. By EA standards, this wedding is, objectively, a bit inefficient.

  But here is the thing about Priya and [Partner]: they know the math. They know the demandingness objection. And they got married anyway.

  Why? Because they understand something that Peter Railton wrote about thirty years ago. Railton argued for "sophisticated consequentialism." The idea is that to actually do the most good in the world, you cannot be the kind of person who is constantly calculating the good in every moment. If you try to optimize every interaction, you become brittle. You burn out. You become less effective.

  To be a truly effective force for good, you need deep, non-instrumental commitments. You need relationships that aren't transactions. You need a love that says, "I am choosing you, not because it maximizes global utility in this specific instance, but because you are my person."

  Priya and [Partner] aren't ignoring their values tonight. They are investing in the infrastructure required to sustain them.

  Samuel Scheffler called this "agent-centered prerogatives." It's the moral permission to give extra weight to your own projects and people. Because if you don't have a home to come back to, if you don't have a specific person who knows your coffee order and your anxieties, the weight of the world becomes too heavy to carry.

  This wedding isn't a distraction from the work. It is the foundation of it.

  I have seen how they love each other. It is patient, it is kind, and yes, it is partial. And that partiality is a feature, not a bug. It recharges them. It makes them smarter, kinder, and more resilient advocates for the future. In long-termist terms, this marriage is a high-leverage investment in human capital.

  So, to the aunts and uncles: They are deeply in love.
  And to the philosophers: They are rationally justified.

  Priya and [Partner], may your life together be full of love that feels unconditional, even if your ethics don't be. May you always have a safe harbor from the storm, and may you never run a regression analysis on a date night.

  Please raise your glasses. To Priya and [Partner].
