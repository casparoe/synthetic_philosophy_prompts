      *   *Counter:* Obligation is world-indexed. $O_w(A)$. If in $w$, $\neg \diamond(A \land B)$, then in $w$, $\neg O(A \land B)$. If Agglomeration holds in $w$, then in $w$, $\neg (O(A) \land O(B))$. Marcus tries to import consistency from $w'$ to $w$. That fails because 'ought' is sensitive to 'can' *in the world of utterance/assessment*.

