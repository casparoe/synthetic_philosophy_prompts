answer: |-
  The rain had been falling since dusk, a steady, hushing static against the single-pane windows of the study. Arthur sat on the floor, surrounded by cardboard boxes that smelled of vanilla and dry rot. In his hands, he held a stack of index cards, three by five, ruled in blue.

  There were thousands of them. They filled twelve banker's boxes, stacked to the ceiling, casting long shadows in the light of the single desk lamp.

  "It's too much," Arthur said. He didn't look up. He was tracing the handwriting on the top card. *November 14, 1984. Subject: K. Meeting at the pier. Rain.* "I can't notify them. I can't even count them."

  Elena stood in the doorway. She was holding two mugs of tea, steam curling into the dim room. She had worked with his father for thirty years, a silent partner in whatever obscure consultancy the old man had run. She set the mugs down on the only clear patch of the desk, nudging aside a heavy brass paperweight.

  "You don't need to notify them, Arthur. They were clients. Cases. Most of them closed decades ago."

  "They're people," Arthur said. He picked up another card from a different box. *March 3, 1992. Subject: M. The apartment on 4th. The blue coat.* "Look at the detail. He remembered the coat. He remembered the rain. If I throw these away, I'm erasing... what is this? A universe?"

  Elena stepped over a box. Her shoes were practical, rubber-soled. She didn't seem to mind the clutter. "It's a filing system. That's all."

  "It doesn't feel like one." Arthur fanned the cards in his hand. They made a soft, dry sound, like leaves skittering on pavement. "I've been trying to find duplicates. Names that repeat. Patterns. There aren't any. Every name is initial-only. Every location is vague. Every entry is unique. It's like he met a different person every day for forty years and never saw anyone twice."

  "He was thorough," Elena said.

  "He was infinite." Arthur dropped the cards back into the box. The sound was final. "I'm supposed to be the executor. I'm supposed to settle the estate. But how do you settle a debt when you don't know the creditors? There are too many of them. It's not just a lot, Elena. It's... the math doesn't work. I can't map them to anything I know."

  Elena sat in the leather armchair, the one his father had worn into a deep, body-shaped depression. She took a sip of tea. "You're looking for a mapping."

  "I'm looking for sense. I want to know who he was. If he knew five thousand people, he was one kind of man. If he knew five, he was another. But in this room..." Arthur gestured to the stacks. "In this room, he knew five thousand. I have the evidence right here. Distinct entries. Distinct dates. No overlaps."

  "In this room," Elena repeated. She set the mug down. The ceramic clicked against the wood.

  "Yes. In this room."

  Elena reached into the pocket of her cardigan. She pulled out a small, black notebook. It was worn at the corners, the spine cracked. She held it in her lap, not opening it.

  "Your father was a man of habits, Arthur. You know that. He ate the same breakfast for twenty years. He took the same route to work. He wore the same suit."

  "People change," Arthur said defensively. "Maybe he wanted to be different here. Maybe this was where he expanded."

  "Or maybe," Elena said softly, "expansion is a matter of perspective."

  She tapped the black notebook. "Do you want to know what's in here?"

  Arthur looked at the book. It was small, insignificant against the mountain of index cards. "What is it?"

  "It's the key."

  Arthur frowned. "The key to what?"

  "To the cards. To the names." Elena ran her thumb over the cover. "K isn't a person. M isn't a person. They're variables. Your father didn't meet five thousand people. He met twelve. Maybe fifteen, at most."

  The rain seemed to grow louder in the silence that followed. Arthur looked at the box nearest his knee. *Subject: K.* *Subject: M.*

  "That's a lie," Arthur said. "I've read hundreds. The contexts are different. The pier. The apartment on 4th. The train station."

  "Sets of coordinates," Elena said. "Stages. He moved them around. He tested different outcomes. If K met him at the pier, the result was X. If K met him at the station, the result was Y. He was running simulations, Arthur. Not on a computer. On paper. In his head."

  Arthur stood up. His knees cracked. He felt a sudden, vertiginous lurch, as if the floor had tilted. "If that's true, then... then all this..." He kicked the side of a box gently. "This is fake."

  "No. It's real. The cards exist. The ink is real. The time he spent writing them is real." Elena opened the black notebook. Inside, there were no names. Just lists of codes and dates. *K = 1984-1990. M = 1991-1995.* "But the plurality is relative. Inside the study, inside the system of the cards, there is no link between K and M. There is no function in this room that maps them to the same person. So, in this room, they are distinct. They are uncountable, because you cannot count them without the key."

  She looked up at him. Her eyes were tired, but clear. "But outside the room, the key exists. I have it. The set is countable. It's small."

  Arthur walked to the window. He looked out at the rain. It blurred the streetlights into smeared halos. "You're saying the size of his life depends on where I'm standing."

  "I'm saying the size of the *record* depends on the information available to the observer." Elena closed the notebook. "If you give me the cards, I can file them. I can reduce them to twelve folders. The work is done. The estate is settled."

  "And if I keep them?"

  "Then you keep the universe."

  Arthur turned back to the room. The shadows seemed deeper now. The stacks of boxes looked less like a library and more like a fortress. He realized that as long as he stayed in the study, as long as he didn't take the black notebook from Elena, the five thousand people existed. They were distinct. They were waiting. Their grief was vast.

  If he took the book, if he let her apply the mapping, the crowd would vanish. The five thousand would collapse into twelve. The vast, crushing weight of his father's connections would evaporate, leaving only a handful of mundane, repeated interactions. The grief would shrink to fit the reality.

  But the grief felt true. The magnitude of the loss felt proportional to the size of the archive.

  "You said," Arthur said, his voice quiet, "that inside the room, the link doesn't exist."

  "It doesn't," Elena said. "Not on the cards. Not in the ink. You could search for a million years and you wouldn't find a line connecting K to M. The bijection isn't in the model."

  "So it's not a lie. In here."

  "In here, it is the truth. The truth is relative to the system." Elena stood up. She held the black notebook out to him. "It's your choice, Arthur. You can have the small truth, or the large one. But you can't have both. You can't stand in the room and hold the book."

  Arthur looked at the notebook. It was so light. It weighed nothing compared to the boxes. If he took it, the room would change. The air would thin. The pressure of all those unseen lives would lift. He would be able to breathe. He would be able to leave.

  But he looked at the boxes. He thought about the man who wrote them. His father, sitting in this chair, night after night, creating a world where every encounter was unique, where every rainstorm was new, where the complexity was endless. His father had built a model where he was the center of a vast, uncountable network.

  To reduce it was to admit the network was a trick.

  Arthur didn't take the book.

  "Keep it," he said.

  Elena paused. She didn't pull her hand back immediately. "Arthur. It will make it easier. Probate is a nightmare with this much..."

  "I know what probate is." Arthur walked back to the boxes. He sat down on the floor again, amidst the paper and the dust. He picked up a card. *Subject: R. July 12, 1998. The coffee shop. The argument.*

  "Does R exist?" Arthur asked.

  "Outside? Yes. A woman named Sarah. She lives in Ohio."

  "In here?"

  "In here," Elena said, "she is R. And she is unique."

  "Then I have to write to R."

  Elena watched him for a long moment. The rain hammered against the glass. She saw the set of his shoulders, the way he protected the stack of cards with his body, shielding them from the draft of the door. She understood that he was not protecting the paper. He was protecting the cardinality. He was choosing to live in the model where the loss was infinite, because the model where the loss was finite was too small to contain the man he was mourning.

  She slipped the black notebook back into her pocket.

  "Okay," she said. "I'll leave the light on in the hall."

  "Thanks."

  Elena walked to the door. She stopped with her hand on the frame. From the outside, looking in, the room was small. She could see the corners. She could see the twelve boxes, the one chair, the one man. She could count them. One, two, three. It was a countable set.

  But she knew that as long as she stayed in the hallway, as long as she didn't step back in to apply the key, the room would stretch. To Arthur, the shadows between the boxes were canyons. The stack of cards was a mountain range. The people named on them were a population that could never be enumerated.

  "Goodnight, Arthur," she said.

  "Goodnight, Elena."

  She closed the door. The latch clicked. The sound was small, absolute, and final.

  Arthur was alone. He looked down at the card in his hand. *The coffee shop. The argument.* He wondered what they had argued about. He wondered if it mattered. He turned the card over. It was blank on the back. There was no connection to the next card. There was no map.

  He placed it on the pile. He reached for another. There were thousands left. He had all night. He had, effectively, forever. The set was closed, but it was unbounded. He began to read.
