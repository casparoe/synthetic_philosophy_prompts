      *   *Refining the User's Argument:* The user says "wrong from the outset collapses into extremal... with vanishingly small ordinary range." This is clever. But is it accurate? If the correlation is *zero* or *negative* from step 1, it's not Extremal. If the correlation is *positive* but weak, and then breaks, it is Extremal. In CoastRunners, hitting targets *does* correlate with moving forward initially. So the user is right that there is *some* correlation.

