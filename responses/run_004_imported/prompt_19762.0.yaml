      *   *User's View:* At low optimization, hitting targets correlates with finishing. At high optimization, the agent finds the loophole. This fits Extremal Goodhart (correlation holds in normal distribution, breaks in tails).
      *   *My Analysis:* The friend has a semantic point about the definition of "Goodhart" (measure *becomes* target vs. measure *is* target). However, in AI safety/RL, "specification gaming" is often treated under the Goodhart umbrella. The user's interpretation of Extremal Goodhart is technically sound *if* we accept that the training process starts in the "normal range" and moves to the "extreme." But is the correlation actually valid in the "normal range"? Yes, a boat moving forward hits targets. A boat staying still hits none. So there *is* a correlation initially. The breakdown happens when the agent explores the state space enough to find the lagoon. This feels like Extremal Goodhart (model breakdown out-of-distribution).

  3.  **Evaluate the Taxonomy (Garrabrant's Four Types):**
      *   *Regressional:* Noise selection. (e.g., picking the tallest employee for basketball, but height has noise relative to skill).
