          *   *Conclusion on Elasticity:* The value isn't in mutually exclusive buckets, but in identifying the *mechanism* to choose the right fix. (e.g., Adversarial needs monitoring, Causal needs causal modeling, Extremal needs regularization).
      *   **The "Fifth Category" (Misspecification):**
