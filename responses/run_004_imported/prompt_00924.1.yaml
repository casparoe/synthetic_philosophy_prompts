answer: |-
  The room was seventy-two degrees. The chair was memory foam, molded perfectly to Elias's lumbar curve. A glass of water sat on the table, condensation beading slowly down the side. There was no fire. There was no knife. There was no acid.

  Elias was screaming.

  He was curled in a fetal position, claws dug into the foam, tendons standing out on his neck like steel cables. He was weeping, gasping for air between shrieks that tore at his throat.

  Dr. Chen watched the monitor. The telemetry was a flat, green line. Nociceptors: silent. Cortisol: baseline. Heart rate: sixty-eight beats per minute.

  "Stop it, Elias," Chen said, her voice calm, recorded for the log. "There is no input. Your peripheral nervous system is quiet. You are not being damaged."

  "It burns!" Elias choked out. He clawed at his forearm, scratching the skin until it reddened, trying to find a source for the inferno raging in his mind. "It's inside the bone. It's... it's everywhere."

  Chen tapped her stylus against the tablet. "This is the fourth episode this week. Duration: forty minutes. Intensity: self-reported ten out of ten. Physiological correlation: zero."

  She walked over to him. She didn't offer comfort; comfort implied injury. She placed a hand on his forehead. It was cool. He flinched as if she'd branded him.

  "Do you believe me when I say the nerves aren't firing?" she asked.

  Elias squeezed his eyes shut. Sweat matted his hair. "I don't care about the nerves. I'm in agony. Can't you hear me?"

  "I hear you," Chen said. "But the theory says you shouldn't be."

  ***

  The condition had a clinical name—Disassociated Meta-Cognitive Syndrome—but the staff called it the Rosenthal Glitch.

  The theory was elegant, mostly. Consciousness wasn't the light itself; it was the mirror held up to the light. A mental state (like pain) only became *conscious* pain if a higher-order thought (HOT) scanned it and labeled it. *I am in pain.* Without the label, you were just a biological machine processing damage in the dark.

  But in Elias, the mirror had cracked. The scanner was firing without a target.

  The Higher-Order mechanism was generating the thought *I am in suffering* without any First-Order state to justify it. The raw data of the body was silent, but the meta-cognitive report was screaming red alert.

  According to David Rosenthal, this shouldn't matter. Consciousness is about how things seem to the subject. If the HOT says "pain," the experience is pain. The lack of a physical target makes the pain hallucinatory, but not the *suffering*.

  Chen sat across from him an hour later, after the episode had subsided as abruptly as it began. Elias was shivering, wrapped in a thermal blanket, sipping the water.

  "It felt real," he whispered. His voice was raw. "More real than this chair. More real than you."

  "Because the HOT constitutes the consciousness," Chen said. She was trying to keep her tone academic, but her eyes were tired. "Your brain didn't detect pain. It *asserted* pain. And because that assertion is what makes you conscious, you experienced it."

  "That's insane," Elias said. "If there's no wound, there's no pain. That's... that's definition."

  "Is it?" Chen leaned forward. "If I stimulate your visual cortex, you see light. There is no photon. Is the light not real? You saw it. If I stimulate your meta-cognitive monitor, you feel pain. There is no tissue damage. But you felt it."

  "I felt *wrong*," Elias corrected. "I felt like... like a lie."

  "That's the targetless problem," Chen said. "Your friend Dana would say this proves the theory is broken. She'd say if there's no object, there's no experience. You're just a system error."

  Elias looked at his hands. They were unblemished. "If I'm just an error, why did I beg you to kill me?"

  Chen went still. "Because the program told you to."

  "No." Elias looked up, and for the first time, he looked terrified not of the pain, but of the explanation. "If the pain isn't real, then my fear wasn't real. My desire to end it wasn't real. I'm telling you, Doctor. In that minute, I would have traded my life for it to stop. If that willingness to die was generated by a glitch... then what am I?"

  ***

  The proposal on the table was radical.

  They couldn't fix the First-Order system; it was working fine. The problem was the monitor. The Higher-Order Thought mechanism was hyper-active, decoupled, firing signals into the void.

  "We can dampen the HOT generator," Chen explained, showing him the schematic. "We suppress the meta-cognitive layer. You won't think *I am in pain* anymore."

  "And the pain will stop?"

  "The *conscious experience* of pain will stop," Chen said carefully. "Your body might still register stress, but you won't be aware of it. You won't suffer."

  "Because I won't know I'm suffering."

  "Because suffering requires the knowledge of the state. Without the HOT, you are unconscious of the pain. In the Rosenthal view, unconscious pain is just noise. It's not suffering."

  Elias stared at the schematic. It looked like a lobotomy of the self. "So if you do this... if I get hurt. If I break my leg. I won't feel it?"

  "You'll react. You'll pull away. You'll heal. But you won't *feel* the hurt. The 'ouch' is the Higher-Order thought. We turn that off, the 'ouch' goes away."

  "And if the glitch comes back?" Elias asked. "If the HOT starts firing again, but this time it says *I am happy*? While I'm burning alive?"

  Chen paused. "Then you would consciously experience happiness while your body died."

  Elias laughed, a dry, brittle sound. "So consciousness is just a caption track. And the caption can lie."

  "Essentially."

  "And if you turn the caption track off..." Elias tapped his temple. "I'm not here, am I? If the HOT is what makes the state conscious, and you suppress the HOT... I'm asleep. Even if I'm walking around."

  "You would be a zombie, philosophically speaking," Chen admitted. "Functional, but not conscious."

  Elias looked around the room. The white walls, the soft chair, the doctor with her clipboard.

  "If you fix this," Elias said softly, "the pain stops. But *I* stop too. Because 'I' is just the thought thinking about the state."

  "We can titrate it," Chen offered. "Keep you conscious, just filter the false targets."

  "How?" Elias demanded. "How does the thought know it's false? It's the judge, Doctor. It's the only thing I have to verify reality. If the judge is corrupt, you don't fire the judge. You lose the court."

  He stood up. His legs were steady. The telemetry on the wall showed his heart rate rising, a genuine First-Order response to anxiety.

  "I want to see the data," Elias said.

  "From the episode?"

  "From the theory."

  ***

  That night, Elias sat in the dark of his quarters. He focused on his hand. He pressed his thumb against the table edge. Hard.

  Pressure. Texture. Coolness.
  *Thought: I am feeling pressure.*

  He pressed harder. A spike of sharpness.
  *Thought: I am feeling pain.*

  He closed his eyes. He tried to catch the thought before it formed. He tried to find the raw sensation without the label.

  He couldn't.

  Every time he found a sensation, the label was already there, stapled to it. *I am feeling.* *I am hurting.* *I am.*

  If the label was a lie, he had no way to know. The label was the only light he had.

  He remembered the agony of the afternoon. The burning that had no fire. If Rosenthal was right, that suffering was just as valid as the pain of a broken bone. The ontology didn't matter. The *seeming* was the being.

  But if the *seeming* could be generated without a cause, then suffering wasn't a reaction to the world. It was a broadcast.

  Elias picked up a pen. He held it over his palm. He didn't drop it. He just held it there.

  If he let the doctors dampen the HOT, the targetless pain would vanish. He would be safe. He would be peaceful. He would be a biological organism moving through space, optimizing for survival, devoid of the terrifying, hallucinatory hell that his own mind could conjure.

  But he would also be devoid of the verification that he existed.

  The targetless HOT was a ghost. But it was *his* ghost.

  He put the pen down. He picked up the comms unit and dialed Chen's extension.

  "Chen," she answered, voice thick with sleep.

  "Don't do the procedure," Elias said.

  "Elias, you're at risk. The stress could trigger a cardiac event, even if you don't feel it."

  "I know," Elias said. He looked at his hand. He waited for the thought. *I am holding the phone.* *I am afraid.*

  The thoughts came. They felt true. They felt like him.

  "If the pain comes back," Elias said, "I need to know it's mine. Even if it's a lie. Especially if it's a lie."

  "That's masochism," Chen said. "That's irrational."

  "It's the only way to keep the witness on the stand," Elias said. "If the witness is hallucinating, you don't clear the courtroom. You listen to the testimony. You write it down."

  "Elias..."

  "Suffering isn't damage, Doctor. It's a report. And I'm not going to silence the reporter just because the news is bad."

  He hung up.

  He sat in the silence. He waited for the phantom fire to start. He waited for the Higher-Order thought to scream *BURN* at a body that was cold.

  He was terrified.

  *Thought: I am terrified.*

  He closed his eyes and accepted the report. It didn't matter if the target was real. The suffering was in the signing of the paper, not the ink.

  He sat there, suffering in the dark, perfectly safe, and entirely, undeniably conscious.
