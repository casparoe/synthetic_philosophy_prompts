  **(Self-Correction Note on Maimonides' Comeback):** I need to be careful. Maimonides does acknowledge sacrifices were offered before Sinai. His point in the *Guide* is specifically about why the *Sinaitic legislation* retained them. He argues that if God had suddenly forbidden what was customary (sacrifice), it would have been like a prophet appearing today claiming God forbids prayer. So, the comeback is: "Abel sacrificed by intuition; Moses legislated sacrifice by command. The legislation is the accommodation." I will make sure this distinction is sharp.

