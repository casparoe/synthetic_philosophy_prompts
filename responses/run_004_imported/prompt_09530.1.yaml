      *   **The Nahmanidean (Nachman):** Kabbalist/Mystic leaning (though keeping it accessible), focused on cosmic order, *kavanah* (intent), intrinsic spiritual mechanics. Sees Torah as connecting worlds.

  3.  **Drafting - Section by Section:**

