answer: |-
  You are right to be suspicious. The conflation of Goodhart's Law and Campbell's Law is one of those intellectual shibboleths that signals membership in the rationalist/policy-adjacent community but often obscures more than it reveals. Your intuition that the Strathern quote is the folk version is correct (Strathern, 1997), and your suspicion that Goodhart (1975) and Campbell (1976) are describing different mechanisms is also correct.

  They are not the same law. While they describe overlapping phenomena, they diagnose different failure modes. Goodhart is primarily an **epistemic claim about statistical control**, whereas Campbell is a **sociological claim about institutional corruption**.

  To defend this verdict, we need to strip away the folk wisdom and look at the original texts through the lens of Scott Garrabrant's taxonomy.

  ### 1. The Original Formulations

  **Goodhart (1975): The Collapse of Regularity**
  Charles Goodhart's original formulation in *Problems of Monetary Management: The UK Experience* was:
  > "Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes."

  Goodhart was writing about monetary aggregates (like £M3). His point was that the relationship between money supply and inflation was a *statistical regularity* derived from historical data. Once the Central Bank tried to *control* inflation by targeting £M3, the public and banks adjusted their behavior. The correlation didn't just get noisy; the structural relationship broke.
  *   **Key Mechanism:** The act of control alters the parameters of the system such that the historical model no longer predicts the future.
  *   **Key Tone:** Technical, macroeconomic, systemic. It is about the failure of a *model*.

  **Campbell (1976): The Corruption of Process**
  Donald Campbell's formulation in *Assessing the Impact of Planned Social Change* was:
  > "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."

  Campbell was writing about social indicators (crime rates, test scores, GDP). His focus was not just that the indicator would stop correlating with the goal, but that the *social process itself* would be damaged.
  *   **Key Mechanism:** Incentives create "corruption pressures" that lead actors to game the system, actively degrading the underlying value.
  *   **Key Tone:** Sociological, normative, institutional. It is about the failure of an *organization*.

  ### 2. Mapping to Garrabrant's Taxonomy

  Scott Garrabrant's taxonomy divides Goodhart effects into four categories based on *why* the proxy $U$ diverges from the true goal $V$ under optimization.

  1.  **Regressional:** $U = V + \epsilon$. Optimizing $U$ selects for large $\epsilon$. (The Winner's Curse).
  2.  **Causal:** $U$ is correlated with $V$ but does not cause $V$. Optimizing $U$ does not move $V$.
  3.  **Extremal:** The correlation holds in the normal distribution but breaks in the tails.
  4.  **Adversarial:** An agent optimizes $U$ specifically to decouple it from $V$.

  **Goodhart's Law maps primarily to Regressional and Causal.**
  In Goodhart's monetary example, the "collapse of statistical regularity" is often a **Causal** failure. The money supply correlates with inflation, but targeting the supply doesn't cause the desired inflation outcome if velocity changes. It is also **Regressional**: by targeting the aggregate, the central bank selects for economic conditions where the aggregate is high but inflation is not necessarily controlled (selecting for noise in the relationship).
  While there are agents involved (banks), Goodhart's framing treats their reaction as a systemic parameter shift rather than a moral failure. The regularity collapses because the *system dynamics* changed, not necessarily because the bankers were "cheating" in a normative sense.

  **Campbell's Law maps primarily to Adversarial.**
  Campbell explicitly uses the word **"corruption."** This is the smoking gun. Corruption implies agency and intent. When Campbell warns that social processes will be "distorted," he is describing **Adversarial Goodhart**.
  *   *Example:* A police department is measured by crime clearance rates.
  *   *Goodhart (Causal/Regressional):* The metric stops predicting actual safety because the relationship between clearance and safety is complex.
  *   *Campbell (Adversarial):* The police department stops recording minor crimes or reclassifies felonies as misdemeanors to boost the rate. They are actively gaming the metric to the detriment of the goal.

  Campbell's Law is essentially a specific subset of Goodhart's Law where the optimization pressure is applied to *human institutions* with *performance incentives*, leading to *adversarial gaming* that causes *normative harm*.

  ### 3. The Divergence: Epistemic vs. Normative

  The reason you feel they are different is that they locate the failure in different places.

  **Goodhart is Epistemic.**
  Goodhart's Law warns us that our *map* is no longer accurate. It says: "You cannot use this proxy to steer." The solution to Goodhart's Law is often better modeling, finding more robust proxies, or recognizing the limits of control. It is a warning about the *information content* of the metric.

  **Campbell is Normative/Sociological.**
  Campbell's Law warns us that our *territory* is rotting. It says: "Steering with this proxy will break the thing you care about." The solution to Campbell's Law is often removing incentives, adding qualitative oversight, or reducing the stakes of the metric. It is a warning about the *incentive structure* of the agents.

  Consider a school system optimizing for test scores:
  *   **Goodhart Effect:** The scores go up, but they no longer correlate with student learning because the test was a noisy proxy for learning to begin with (Regressional), or because the test measures test-taking skill rather than knowledge (Causal). The metric is now useless information.
  *   **Campbell Effect:** Teachers stop teaching untested subjects (art, history), or administrators cheat on the answer sheets. The *education system* is actively damaged. The metric is not just useless; it is destructive.

  ### 4. The Verdict

  **Goodhart's Law and Campbell's Law are not the same mechanism.**

  *   **Goodhart's Law** is the broader umbrella. It describes the decoupling of a proxy from a goal under optimization pressure. It encompasses Regressional, Causal, and Extremal effects, which can occur in purely physical or statistical systems without any "corruption."
  *   **Campbell's Law** is a specific instantiation of **Adversarial Goodhart** within **social systems**, with an added emphasis on **institutional decay**.

  Conflating them is dangerous because it suggests a single solution. If you think you are facing Goodhart's Law (Causal/Regressional), you might try to fix it by finding a better metric or using a more complex model. But if you are actually facing Campbell's Law (Adversarial), a better metric will simply invite more sophisticated corruption.

  Campbell's original formulation carries an emphasis that does not sit comfortably in the "structural" view of Goodhart. Campbell is concerned with the **moral hazard** of measurement. Goodhart is concerned with the **Lucas Critique** of measurement.

  **Final Defense:**
  If Goodhart's Law were the whole story, we could solve it by making the metric harder to game (e.g., making the test harder). But Campbell's Law suggests that high-stakes measurement *itself* is the poison. The "corruption pressures" Campbell mentions are inevitable in social systems where agents care about their outcomes. Goodhart tells us the signal will break; Campbell tells us the system will break *because* the agents try to fix the signal.

  Therefore, your friends are wrong. They are citing Strathern's aphorism, which collapses the distinction. Goodhart describes the failure of the **control loop**. Campbell describes the failure of the **institution**. Recognizing the difference is the only way to apply Garrabrant's taxonomy correctly: use Goodhart to audit your metrics, but use Campbell to audit your incentives.
