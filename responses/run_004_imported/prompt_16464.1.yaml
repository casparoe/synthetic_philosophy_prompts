      *   *Section 3: The Crucial Divergence.*
          *   Goodhart is epistemic (the signal stops informing).
          *   Campbell is normative/sociological (the system stops functioning).
          *   Example: A school.
              *   Goodhart: Test scores correlate with learning. We optimize for test scores. We find that high scores no longer correlate with learning (Regressional/Extremal).
              *   Campbell: We optimize for test scores. Teachers teach to the test, cheat, or narrow the curriculum, actively harming education (Adversarial/Corruption).
      *   *Section 4: The Verdict.*
          *   They are not the same. Campbell is a subset of the broader Goodhart phenomenon, but specifically the *Adversarial* subset with a focus on *institutional decay*. Goodhart is broader and includes non-agentic statistical failures.
          *   Conflation is harmful because the solutions differ. (Fix the metric vs. fix the incentives/oversight).

  5.  **Refining the Tone:**
