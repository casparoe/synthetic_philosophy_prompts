  2.  **Deconstruct the Source Material:**

      *   **Goodhart's Law (1975):**
          *   *Context:* UK Monetary Policy.
          *   *Original Phrasing:* "Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes."
          *   *Mechanism:* Economic agents react to the policy rule. If the Central Bank targets $M3$, banks adjust behavior to meet $M3$ targets without necessarily changing the underlying economic reality (inflation/growth) $M3$ was supposed to proxy.
          *   *Nature:* Primarily about *control* and *statistical regularities* breaking down under optimization pressure. It's often systemic/structural.

      *   **Campbell's Law (1976):**
          *   *Context:* Social Indicators and Public Policy.
          *   *Original Phrasing:* "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor."
          *   *Mechanism:* Explicitly mentions "corruption pressures" and "distort and corrupt." Focuses on the *social process* and the *intent* of the actors.
          *   *Nature:* Primarily about *perverse incentives* leading to *gaming* and *corruption* of the process itself.

      *   **Strathern's Quote:** "When a measure becomes a target, it ceases to be a good measure." (Often misattributed to Goodhart). This is the folk version.

      *   **Garrabrant's Taxonomy (2018):**
          *   *Regressional:* The proxy is noisy. Optimizing the proxy selects for noise. (Winner's Curse).
          *   *Causal:* The proxy is caused by the goal, but not the only cause. Optimizing the proxy doesn't cause the goal. (Umbrella/Rain).
          *   *Extremal:* The proxy holds in the normal distribution but breaks in the tails. (Too much of a good thing).
          *   *Adversarial:* An agent actively optimizes against the proxy to hide the true state or game the system.

  3.  **Synthesize and Compare:**

      *   *Goodhart (1975):* Focuses on the collapse of a *statistical regularity*. In the monetary context, this is often about expectations and market reactions. It fits well with **Regressional** (selecting for noise in the money supply data) and **Causal** (money supply correlates with inflation, but targeting it doesn't guarantee inflation control if velocity changes). It *can* be Adversarial (banks gaming), but Goodhart's framing is more about the *regularity* collapsing than the *moral corruption* of the bankers.
      *   *Campbell (1976):* Focuses on *corruption pressures* and *distortion of social processes*. This is explicitly about human agents reacting to incentives in ways that undermine the *purpose* of the institution. This maps very strongly to **Adversarial Goodhart**. The "corruption" implies an agent finding a loophole or cheating.
      *   *The Distinction:* Goodhart is about the *map* (the statistical model) breaking when you try to steer the *territory* using it. Campbell is about the *territory* (the social system) rotting when you steer it using the *map*.
      *   *Garrabrant's Lens:*
          *   Goodhart $\rightarrow$ Regressional/Causal/Extremal (Systemic/Statistical failure).
          *   Campbell $\rightarrow$ Adversarial (Agent-based gaming/corruption).

