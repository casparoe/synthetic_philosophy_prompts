  6.  **Self-Correction/Nuance Check:**
      *   *Wait, is Goodhart purely non-adversarial?* In the 1975 paper, he talks about market participants reacting to policy. That *is* agentic. However, his framing is about the *regularity* collapsing, not the *moral hazard* per se. Campbell makes the moral hazard/corruption the *central* point.
      *   *Is Campbell purely adversarial?* He mentions "distort and corrupt." Corruption implies agency. But could it be extremal? If you teach *too much* to the test, is that adversarial? Yes, because it's a decision to prioritize the metric over the goal.
      *   *Garrabrant's view:* Garrabrant himself has noted that "Goodhart's Law" is often used as a catch-all. The taxonomy was built to disentangle this.
      *   *Verdict:* Campbell is a specific *flavor* of Goodhart (Adversarial), but Goodhart's original insight covers non-adversarial statistical collapse. Therefore, they are not identical. Campbell adds a sociological layer of *corruption* that Goodhart's monetary example only implies structurally.

