      *   *Point 1: The Nature of Infinity.* Pascal isn't doing math; he's doing metaphysics. Finite vs. Infinite is a categorical distinction (order of magnitude vs. order of being). Mugging uses large finites. Pascal rejects this equivalence.
      *   *Point 2: The Forced Bet.* "You are embarked." You can't opt out of the God question. You *can* opt out of the Mugger. The Wager addresses paralysis; the Mugging addresses gullibility.
      *   *Point 3: The Role of Reason.* Pascal limits reason. "Reason's last step is to recognize there are infinite things beyond it." The Mugging assumes reason can calculate the incalculable. Pascal says reason must submit to the Heart/Faith when it hits the divine.
      *   *Point 4: Moral Psychology.* The Wager is therapy ("learn from the unbelievers who bound themselves..."). The Mugging is coercion.
      *   *Conclusion:* Pascal laughs at the mugger. The logic holds for God because God is the *only* thing that fits the "Infinite" slot.

  7.  **Refining the Tone:**
