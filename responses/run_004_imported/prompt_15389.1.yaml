  8.  **Final Polish:** Organize with clear headings. Ensure the distinction between *epistemic justification* (truth) and *professional justification* (liability/consensus) is clear. (This is the key insight).

  **(Self-Correction Note):** I should make sure not to validate the circularity *too* much. If the firm is artificially inflating values by referencing their own past work without external validation, that *is* a risk. I need to advise on how to spot the difference between healthy reflexivity and dangerous feedback loops.

