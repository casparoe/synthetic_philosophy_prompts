answer: |-
  The coffee in the convention center lobby is notoriously bad, but it serves a purpose: it keeps people standing. Elena adjusted her conference badge, which read *E. VARELA – University of Bristol*, and leaned against a high-top table. Marcus, wearing a *M. KOWALSKI – Georgia State* lanyard, stirred sugar into his styrofoam cup.

  They had just sat through a panel on "Cognitive Boundaries in the Age of AI."

  "So," Marcus said, taking a sip. "You really bought the speaker's claim that when she uses her AI scheduler to manage her grant deadlines, the AI is *believing* the deadlines on her behalf?"

  Elena smiled, tired but sharp. "Not that the AI is believing, Marcus. That's the homunculus trap. The claim is that the *system*—Sofia plus the App—holds the belief. The cognitive process of 'remembering the deadline' extends beyond the skull. It's Otto's notebook, only with Wi-Fi."

  "Here we go," Marcus sighed. "The ghost of Otto returns. Look, I'm willing to grant that the app is causally essential. Without it, Sofia misses the deadline. But causal dependence isn't constitution. Just because I need oxygen to think doesn't mean the air is part of my mind."

  "Classic Adams and Aizawa," Elena countered. "The Coupling-Constitution fallacy. You're asserting it, but you're not justifying it. Why is the skull a magic boundary? If the app functions exactly like biological memory—storing info, retrieving it on demand, guiding action—why does it matter where the silicon sits?"

  "Because of the Parity Principle's limits," Marcus said, pointing his stirrer at her. "Clark and Chalmers say: if a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then it is part of the cognitive process. But the 'were it done in the head' clause is doing all the work. We *can't* do what the app does in the head. The app communicates via APIs and cloud servers. Our neurons communicate via electrochemical spikes. They aren't functionally isomorphic."

  "They are at the functional level of abstraction that matters," Elena insisted. "Take Sofia's navigation app. Let's call it 'Wayfinder.' It learns her habits. She gets in the car, and Wayfinder automatically loads the route to the lab. It doesn't wait for a command. It anticipates. That's not just storage; that's active processing of spatial memory. Inga recalls the route biologically; Sofia recalls it via Wayfinder. The 'Trust and Glue' conditions are met. It's always available, it's automatically trusted, and it's easily accessible."

  "Trust and Glue establishes *integration*," Marcus corrected. "It establishes that the tool is deeply embedded in her cognitive life. I'll even grant you Rupert's 'Embedded Cognition' view: the environment is structured to support cognition. But embedding isn't extending. When a spider uses a web to detect prey, the web isn't part of the spider's nervous system. It's a tool the nervous system exploits. Wayfinder is a web. Sofia is the spider."

  "But the spider feels the vibration *in* the web," Elena pressed. "The cognitive loop closes through the web. If you sever the web, the spider's cognitive capacity to detect prey vanishes. If you sever the connection to Wayfinder, Sofia's capacity to navigate the city vanishes. If the capacity is realized by the coupling, why isn't the vehicle of that capacity the coupled system?"

  "Because of the content," Marcus said, shifting gears. "This is where the derived vs. non-derived distinction kills the extension thesis. When Inga remembers the route, her neural state has intrinsic intentionality. It's about the route in virtue of her biological history and teleology. When Wayfinder displays the route, that map has *derived* content. It's only 'about' the route because Sofia interprets it that way, and because the programmers coded it that way. The phone doesn't care where she goes."

  Elena shook her head. "That's biological chauvinism. Why do neurons get 'intrinsic' intentionality for free? They are just causal mechanisms responding to inputs. We attribute 'aboutness' to them because of their role in the system. If the phone plays the same role, why can't it bear the content? You're positing a magic sauce in the meat that you can't identify functionally."

  "I can identify it mechanistically," Marcus replied. "Neural plasticity involves specific causal powers—LTP, synaptic weighting—that are constitutive of learning. Wayfinder uses lookup tables and GPS triangulation. The mechanisms are different. Adams and Aizawa argue that cognitive processes must be constituted by specific kinds of causal mechanisms. You can't just say 'function is all that matters.' If I calculate a sum using a calculator, the calculator isn't doing math. It's shuffling electrons. *I* am doing the math using the calculator."

  "But Sofia isn't calculating the route," Elena argued. "She's not doing anything. Wayfinder does it. She just drives. If the processing is offloaded, and the result is endorsed without critical scrutiny—which meets the 'Trust' condition—then the processing is part of her cognitive profile. You're clinging to the skin as a boundary because it feels intuitive, not because it's philosophically robust."

  "It's not about intuition; it's about ownership," Marcus said. "If Wayfinder glitches and sends her into a lake, we don't say Sofia had a false belief. We say her tool failed. If her hippocampus misfires, *she* has a false belief. The attribution of mental states tracks the organism, not the organism-plus-tool. If you extend the mind to the phone, where do you stop? Does the cloud count? If the server is in another country, is part of Sofia's mind in a jurisdiction she can't enter?"

  "That's a *reductio* based on geography, not cognition," Elena laughed. "The location is irrelevant. But let's look at the 'Glue' again. You say the mechanism matters. But Clark's point is that we shouldn't care about the substrate. If we upload Inga's brain to a silicon substrate that functions identically, you'd call that a mind. So why is the silicon in the skull a mind, but the silicon in the pocket just a tool?"

  "Because of the feedback loop of self-regulation," Marcus said, leaning in. "Sofia's biological systems regulate the phone. She charges it. She updates it. She decides when to trust it. The phone does not regulate her biology. The direction of fit is one-way. The organism is the master; the tool is the slave. In a genuine cognitive system, the parts mutually regulate each other to maintain homeostasis. Wayfinder doesn't care if Sofia survives. Her brain does."

  Elena paused, considering this. "That's a stronger point. But consider the next generation. Suppose the app is neural-linked. It doesn't show a map; it stimulates the visual cortex to *show* her the arrow overlaid on the road. It writes directly to working memory. At that point, the 'derived content' objection collapses because she doesn't interpret the screen; she experiences the route. Is that part of her mind then?"

  "If it's neural-linked, you've changed the vehicle," Marcus conceded slightly. "If the silicon is causally integrated into the neural net such that it's indistinguishable from synaptic input, then yes, you might have a case for extension. But that's not how smartphones work. They interface through sensory organs—eyes and ears—which are transducers, not constitutive parts of the memory system itself. There's a bottleneck. Inga's recall is direct; Sofia's is mediated by perception."

  "But the 'Trust and Glue' condition is about that mediation becoming transparent," Elena countered. "When the mediation disappears phenomenologically, when she doesn't 'look up' the route but just 'knows' it because the app is so seamless, the perceptual bottleneck becomes irrelevant. You're demanding a biological criterion for a functional definition. If the system behaves as a believer, treat it as a believer."

  "And I'm saying that 'behaving as a believer' isn't enough for *being* a believer," Marcus said, finishing his coffee. "You're defining cognition by its outputs. I'm defining it by its internal constitution. We can agree that Sofia and Wayfinder are a coupled system. We can agree they are an integrated unit of problem-solving. I'll even grant you that the boundary of the *agent* might be fuzzy in a pragmatic sense. But the boundary of the *mind*? The mental states themselves? Those stay in the head. To say otherwise is to confuse the tools of thought with the thinking itself."

  Elena picked up her bag. "And I think that distinction is going to become impossible to maintain when the tools start thinking back. But fine. We agree on the coupling. We disagree on the constitution."

  "Exactly," Marcus said. "You see a continuum of cognitive processes. I see a categorical difference between the organism and its environment. We can walk to the next session."

  "Only if Wayfinder knows the way," Elena joked.

  "My hippocampus is fine," Marcus replied. "It doesn't need a charge."

  "Yet," she said, holding the door open. "But give it ten years."

  They walked out into the hallway, the argument unresolved, the boundary between skull and world still drawn firmly in the sand, though neither was quite sure if the tide was coming in.
