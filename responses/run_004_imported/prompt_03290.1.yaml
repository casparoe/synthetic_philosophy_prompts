      *   *Opportunity Cost of Emotional Energy:* The stress of the flip might cost more than the potential extra $300 gain.

  5.  **Synthesizing the Argument:**
      *   *Acknowledge the Friend's Technical Correctness (with caveats):* In strict Expected Utility Theory, for small stakes, risk aversion is hard to justify purely on wealth utility. Matthew Rabin's calibration theorem supports the friend.
      *   *Challenge the Friend's Definition of Rationality:* Economics models are maps, not territories. "Rational" in econ $\neq$ "Rational" in life.
      *   *Introduce Prospect Theory:* Kahneman & Tversky. Reference points matter. The pain of getting $0 is psychologically heavier than the joy of getting $600.
      *   *Introduce "Utility of Certainty":* Certainty itself has value (consumption smoothing, planning, emotional stability).
      *   *Ergodicity/Time Averaging:* Real life isn't an ensemble average. You live one timeline.
      *   *Conclusion:* The user is not irrational; they are just using a more sophisticated utility function that includes psychological factors, not just final wealth states.

