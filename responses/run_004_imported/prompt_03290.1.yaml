answer: |-
  Your friend is relying on a specific, narrow definition of "rationality" from classical economics, but she is overlooking decades of research in behavioral economics, psychology, and decision theory. While her argument holds up within the strict confines of a textbook model, it fails to describe how human beings actually derive value from money and life.

  You are not making a mistake. Your preference for certainty is defensible, and here is the artication you are looking for.

  ### 1. The Friend's Argument: Expected Utility Theory
  Your friend is arguing from **Expected Utility Theory (EUT)**. In this model, a rational person maximizes the expected utility of their final wealth.
  *   **The Math:** Both options have an Expected Value (EV) of $300.
  *   **The Assumption:** Economists usually explain risk aversion through *diminishing marginal utility*. This means the first $300 you get is more valuable to you than the second $300. Therefore, a guaranteed $300 is worth more than a 50% chance at $600.
  *   **The Friend's Rebuttal:** She argues that because $300 is small relative to your income, your marginal utility is effectively constant (linear). A dollar is worth a dollar. Therefore, you should be indifferent. If you aren't, she claims you are violating the axioms of rational choice.

  She is technically referencing a concept known as **Rabin's Paradox**. Economist Matthew Rabin proved that if you reject small-stakes gambles (like this one) purely due to diminishing marginal utility of wealth, you would logically have to reject absurdly large gambles too (e.g., a 50/50 chance to lose $100 or gain $1 million). Since no one would reject that large gamble, Rabin argued that risk aversion on small stakes *cannot* be explained by wealth utility alone.

  **So, in a way, your friend is right:** Your choice isn't about the *wealth* utility. **But she is wrong to conclude it is irrational.** She is assuming wealth utility is the *only* kind of utility that exists.

  ### 2. The Defense: Prospect Theory and Loss Aversion
  In 1979, psychologists Daniel Kahneman and Amos Tversky published **Prospect Theory**, which revolutionized economics (and won Kahneman a Nobel Prize). They showed that people do not evaluate outcomes based on final wealth, but rather as **gains and losses relative to a reference point.**

  *   **Reference Point:** When offered the choice, your brain sets a reference point. Often, the "sure thing" becomes the reference.
  *   **Loss Aversion:** Humans feel the pain of a loss roughly twice as intensely as the pleasure of an equivalent gain.
  *   **The Application:** If you take the gamble and get $0, your brain codes this as a **loss** (of the $300 you "could have had"). If you get $600, it's a gain. Because the pain of getting $0 outweighs the pleasure of getting $600, the *expected emotional value* of the gamble is actually lower than the sure thing, even if the *mathematical* value is the same.

  Choosing the guaranteed sum is a rational strategy to minimize the psychological pain of regret.

  ### 3. The Utility of Certainty (Planning and Agency)
  Money is not just a number; it is a tool for agency and planning. Certainty has intrinsic value that a coin flip does not.

  *   **Consumption Smoothing:** Even if $300 doesn't change your life, it allows for immediate, specific planning (e.g., a nice dinner, a bill payment, a gift). You can plan *now* with the guaranteed $300. You cannot plan with a probability. The ability to make concrete plans has utility.
  *   **Cognitive Load:** Holding a gamble creates a tiny open loop in your brain. "What if I lose?" Certainty closes the loop. Saving yourself the mental energy of wondering is a valid benefit.
  *   **Regret Minimization:** If you take the gamble and lose, you may feel foolish ("I should have taken the sure money"). If you take the sure money and miss out on the $600, you feel nothing. You are paying a "premium" (the foregone potential gain) to purchase insurance against future regret. That is a valid purchase.

  ### 4. Ergodicity: You Live One Life
  There is a deeper mathematical critique of your friend's view called **Ergodicity**.
  *   **Ensemble Average:** This is what your friend is calculating. If 1,000 people took this bet, the average payout would be $300 per person.
  *   **Time Average:** This is your reality. You are one person living through time. You cannot average out the result with other versions of yourself.

  In a non-ergodic system (like real life), avoiding ruin or avoiding zero is often more important than maximizing average growth. While $0 isn't "ruin" in this specific context, the *principle* of preferring a certain positive outcome over a probabilistic one is a robust heuristic that protects you in larger, more dangerous situations. Training yourself to value certainty can be a beneficial habit, even when the stakes are low.

  ### 5. Redefining "Rationality"
  Finally, we must ask: **What is rationality for?**

  If rationality means "maximizing the output of a specific economic formula," then yes, you are irrational. But if rationality means **"making choices that best align with your preferences and well-being,"** then you are perfectly rational.

  If the peace of mind from the guaranteed $300 provides you with more satisfaction than the thrill of the gamble, then you have maximized your *actual* utility. Your friend is criticizing you for not maximizing *her* utility function (wealth accumulation), rather than your own (which includes emotional stability and certainty).

  ### Summary for your friend
  You can tell your friend this:
  > "You are assuming my utility function depends only on my final bank balance. It doesn't. It also includes the value of certainty, the cost of potential regret, and the psychological weight of loss aversion. I am not maximizing expected monetary value; I am maximizing expected *well-being*. Since the certainty makes me happier than the gamble, my choice is rational by the only metric that actually matters."

  You are not squeamish; you are accurately pricing the value of peace of mind. Keep taking the $300.
