      *   *Section 2: Why the Friend is Incomplete (Prospect Theory).* Money isn't just wealth; it's gains and losses relative to a reference point. Loss aversion. Getting $0 feels like a loss.
      *   *Section 3: The Value of Certainty.* Planning value. "Bird in the hand." Emotional cost of regret.
      *   *Section 4: Redefining Rationality.* Rationality is about satisfying *your* preferences, not a textbook model. If certainty brings peace, that's utility.
      *   *Section 5: Ergodicity (Optional but cool).* Ensemble average vs. Time average. (Maybe keep this simple so as not to overcomplicate). Let's stick to the psychological/behavioral aspects as they are more relatable.
      *   *Closing:* You are defensible. Your friend is modeling a "Homo Economicus," you are a human.

  7.  **Refining the Tone:**
