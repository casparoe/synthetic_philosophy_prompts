prompt: |-
  Whenever I'm offered a choice between a guaranteed sum of money and a coin flip with the same average payoff — say, a certain $300 versus a coin flip for $600 or nothing — I take the guaranteed sum, even though the amounts involved are small enough, relative to my income, that they wouldn't meaningfully affect my life either way. A friend who studies economics tells me this is irrational: at these amounts, an extra dollar is worth just as much to me as the last one, so there's no financial reason to treat the safe option as better than the gamble, which means my consistent preference for certainty must just be squeamishness rather than anything I could actually defend. I don't feel like I'm making a mistake, but I can't articulate why. Is she right, or is there a genuine, defensible reason for choosing the way I do?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Scenario:** Choice between a guaranteed sum (e.g., $300) and a coin flip for double or nothing (50% chance of $600, 50% chance of $0). Both have the same Expected Value (EV) of $300.
      *   **User's Behavior:** Consistently chooses the guaranteed sum.
      *   **Context:** Amounts are small relative to income (marginal utility of money should be roughly constant).
      *   **Friend's Argument:** This is irrational. Since marginal utility is constant at this scale, risk aversion is unjustified. It's just "squeamishness."
      *   **User's Feeling:** Doesn't feel like a mistake, but can't articulate why.
      *   **Goal:** Determine if the friend is right or if there's a defensible reason for the user's preference.

  2.  **Initial Economic Assessment (The Friend's View):**
      *   *Expected Utility Theory (EUT):* Standard neoclassical economics assumes rational agents maximize expected utility.
      *   *Risk Neutrality:* If utility is linear in money (constant marginal utility), one should be indifferent between $300 sure and 50/50 $600/$0.
      *   *Risk Aversion:* Usually explained by diminishing marginal utility of wealth (Bernoulli). A dollar means less to a rich person than a poor person.
      *   *Friend's Point:* Since the amounts are small relative to income, the utility curve is effectively linear here. Therefore, risk aversion implies an implausibly high degree of curvature elsewhere (Rabin's Paradox). So, technically, within the strict confines of *expected utility theory with wealth-based utility*, the friend has a strong point.

  3.  **Behavioral Economics & Psychology (The User's View):**
      *   *Loss Aversion (Prospect Theory):* People feel losses more intensely than gains. $0 feels like a loss relative to the reference point of "maybe getting $600" or even just the disappointment of getting nothing vs. the certainty of $300.
      *   *Regret Aversion:* If I take the gamble and get $0, I'll feel stupid. If I take the sure thing, I never have to wonder "what if."
      *   *Transaction Costs/Cognitive Load:* Deciding to gamble requires emotional energy. Certainty saves mental bandwidth.
      *   *Liquidity/Immediate Need:* Even if small relative to *annual* income, is $300 immediately useful? Yes. Is $0 useful? No.
      *   *Ergodicity:* A one-off bet vs. repeated bets. (Though the prompt implies a one-off or occasional scenario).

  4.  **Philosophical/Pragmatic Defense:**
      *   *Rationality Definition:* Is rationality only about maximizing mathematical expectation? Or is it about satisfying preferences that lead to well-being?
