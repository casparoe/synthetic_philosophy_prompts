      *   *The Intuition:* Explanation requires asymmetry and priority. $A$ explains $B$ implies $A$ is ontologically or metaphysically prior to $B$. Humeanism makes laws ontologically *posterior* to the mosaic (they depend on it), yet scientifically *prior* (they explain it).

  3.  **Deconstruct the Humean Response (Loewer's Distinction):**
