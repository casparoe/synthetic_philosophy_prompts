      *   **Topic:** The "explanatory circularity" objection to Humean Supervenience (specifically David Lewis's Best System Analysis - BSA) and the Humean response (specifically Barry Loewer's).
      *   **Task:** Clearly lay out (1) why the circularity charge has force, and (2) how sophisticated Humeans attempt to defuse it.
