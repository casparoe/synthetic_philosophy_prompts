  10. (Final check on Lewis): Lewis argues that if composition is restricted, there must be a sharp cutoff. If the criteria are vague, there is no sharp cutoff. If there is no sharp cutoff, composition is vague. Lewis thinks ontic vagueness is impossible. So, restricted composition fails.
      *   My defense must show that the criteria are *not* vague. The criteria is "participation in a self-maintaining biological event." This is binary. Either the simple is involved in the metabolic cycle or it isn't. The pacemaker isn't. Therefore, no vagueness.

  11. (Final check on Van Inwagen): In *Material Beings*, van Inwagen says composition occurs when the activities of the simples *constitute* a life. He uses the example of a flame or a whirlpool as analogies for lives. The pacemaker is more like the match that lights the fire, not the fuel burning.

