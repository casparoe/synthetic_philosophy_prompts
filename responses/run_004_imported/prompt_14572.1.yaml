prompt: |-
  I'm taking a seminar on personal identity this term, and the last couple weeks were Parfit's teletransporter material followed by, as a kind of counterweight, Bernard Williams' old paper "The Self and the Future." The Parfit part I feel like I get: the basic teletransporter case, then the branch-line version where the scanner does its job but your original body on Earth isn't destroyed right away, it's just damaged and dying, so you get a few days of overlap with your replica on Mars before the "branch line" closes -- and Parfit's move is that this should feel about as good as ordinary survival, so what matters can't be identity itself, its just psychological continuity and connectedness (relation R). What threw me was Williams. He describes basically one underlying setup two different ways: once as a neutral swap where two people's memories and personalities get exchanged between their bodies, and once along the lines of "tomorrow your body is going to be tortured, and by the way, beforehand we're going to overwrite your memory and character to match someone else's" -- and apparently people's dread tracks the body in the second framing even though he's stipulated it's the very same facts as the first. My professor basically said this is a live wound in the psychological-continuity program, not something Parfit has a clean answer to, which surprised me.

  So could you actually compare the two views for me: Parfit's account of what matters in survival, built on the teletransporter/branch-line cases, versus Williams' case for bodily continuity as basic, built on that redescription/torture argument. Does Williams' argument really show that relation-R theorists are tracking the wrong thing, or is there a cheap way for Parfit to absorb it (e.g. by just saying the dread is a bias rather than evidence about identity)? And more broadly, which of the two do you think gives the more defensible account of rational self-interested concern for the future, and why -- I've read both pieces already, so please don't just summarize them at me, I want an actual verdict on who comes out ahead in this specific exchange.
