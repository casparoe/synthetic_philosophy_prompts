answer: |-
  **Setting:** *The hotel bar at the APA Eastern Division. It's 11:30 PM. The noise level is a dull roar of tenure-track anxiety. Elena (Semanticist) and Julian (Pragmatist) are sharing a high-top table, both loosening ties.*

  **Elena:** You loved the panel, didn't you? I saw you nodding when the speaker said slurs are just neutral terms with a "prohibition" sticker slapped on them.

  **Julian:** I'm not nodding at the morality, Elena, I'm nodding at the parsimony. Look, take the case we heard earlier: someone snaps, "He's not a *Kraut*, he's just German, quit it." They're shutting down a bigot. On my view, the speaker spoke truly—they just violated a social convention against using that word-form. It's dicey, sure, but semantically innocent.

  **Elena:** Innocent? That's the problem. On Combinatorial Externalism, that sentence forces the listener to access a racist ideology to even process the negation. You can't say "not *Kraut*" without invoking the *Kraut*-concept, which includes the prescription that Germans ought to be subjugated. You're literally asserting a false ideology to deny it.

  **Julian:** But that's where your theory chokes. If the content is the problem, negation should cleanse it. If I say, "He's not a murderer," I'm not accusing him of murder. But if I say, "He's not a *Kraut*," the air still curdles. Why? Because the word itself is prohibited, not the proposition. It's strict liability. You broke the glass rule, even if you were trying to sweep up the shards.

  **Elena:** Strict liability makes the offense arbitrary. If it's just a taboo on the phonemes, then the hate is accidental. But it's not. The reason we prohibit the word is *because* of the content you claim isn't there. If the ideology wasn't baked into the truth conditions, you could swap the slur for a nonsense word, teach everyone the same hate, and it wouldn't be offensive until the taboo caught up. That's absurd.

  **Julian:** Is it? Imagine we discover a new group and bigots coin a new slur tomorrow. It hurts immediately, before any complex ideology has time to crystallize into a semantic value. Your view requires too much lag time. My view explains the immediate sting: the community recognizes the *intent* to violate the norm against derogatory labeling. The damage is in the act of utterance, not the abstracta you're chasing.

  **Elena:** The act of utterance is harmful *because* it signals commitment to the ideology. That's the hole in Prohibitionism: you can explain why it's rude, but not why it's *false*. When a neo-Nazi says, "He is a *Kraut*," he isn't just breaking a rule; he's stating something that doesn't hold. The world doesn't contain *Krauts*. It contains Germans. Your theory makes the neo-Nazi's sentence true, just impolite.

  **Julian:** And your theory makes the anti-racist's sentence—"He's not a *Kraut*"—semantically clean, yet you admit it feels dirty. You have to do gymnastics to explain why a true sentence feels like a weapon. I just say: don't touch the weapon. Also, how do you handle reclamation? When an in-group member uses the slur, the "ideology" doesn't vanish, but the offense does. Did they change the truth conditions of the word for the whole population?

  **Elena:** They changed the context of the ideology. Reclamation strips out the subjugation clause from the semantic content for that specific usage. But for an out-group speaker, even in negation, the clause is active. That's why "He's not a *Kraut*" feels dicey coming from me or you. We're still manipulating a concept that defines people by their supposed inferiority, even to deny it.

  **Julian:** But that means semantics is dependent on the speaker's identity in a way that breaks compositionality. I'm saying the word is toxic *because* we agreed to make it toxic. It's a social tool. If we treat it as semantically distinct, you risk reifying the slur as if it actually picks out a different kind of object than "German." I want to say *Kraut* means *German*, full stop, and the rest is ethics, not logic.

  **Elena:** And I'm saying ethics *is* logic here. You can't separate the hate from the meaning without sanitizing history. If you say *Kraut* just means *German*, you're implying the only difference is our sensitivity. I'm saying the difference is in the world. The term carries a fictional, violent ontology. Using it, even negatively, traffics in that fiction.

  **Julian:** So we're at the stalemate I expected. You think I'm ignoring the moral weight of meaning; I think you're turning moral weight into metaphysical baggage.

  **Elena:** Basically. You want to save truth-conditions from the mess of use. I think the mess *is* the conditions.

  **Julian:** *Raises his glass.* Well, here's to the mess. I won't say the word, and you won't analyze it.

  **Elena:** *Clinks glass.* Deal. Order me a gin. And if you call the bartender a *Kraut* to get it faster, I'm leaving.

  **Julian:** Noted. One gin, coming up.
