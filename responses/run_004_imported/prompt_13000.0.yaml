      *(Self-Correction)*: Wait, I need to make sure the Hom view on negation is clear. For Hom, "X is not a K" is technically true (since nothing is a K), but *uttering it* is problematic because it forces the audience to process the ideological content. The A&L view says "X is not a K" is true (same as "X is not German") but *uttering it* violates the prohibition. The distinction is subtle. I need to sharpen the conflict.
      *Refinement:* She should argue that the *concept* is the problem. He should argue the *word* is the problem.
