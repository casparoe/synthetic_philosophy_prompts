      *Wait, one more check on Hom:* Hom's view is that the slur term *refers* via an ideology. The ideology is false. So "Hans is a Kraut" is false. "Hans is not a Kraut" is true. But why is it offensive? Because to understand it, you must access the ideology.
      *Check on A&L:* "Hans is a Kraut" is true (if Hans is German). "Hans is not a Kraut" is true (if Hans is German). Offense is purely pragmatic/social rule.

      *Okay, let's write.*

  7.  **Final Review against constraints:**
