  8.  **Final Polish:** Ensure tone is appropriate for a PhD peer (rigorous, precise, no oversimplification). Use Sanskrit terms correctly but explain them. (Check: *pravṛtti-sāmarthya*, *anuvyavasāya*, *khyāti*, *doṣa*).

  *(Self-Correction during drafting)*: I need to be precise about *utpatti*. Nyāya says validity *arises* from the causal conditions of the cognition (which include the proper functioning of senses). So validity arises *with* the cognition. But is that *svataḥ*? Nyāya says no, because the causes (sense-object contact) are *external* to the cognition itself. Kumārila says the validity arises from the very nature of the cognition.
  Actually, the standard Nyāya view is: *Prāmāṇya* (validity) has causes (*guṇa*). *Aprāmāṇya* (invalidity) has causes (*doṣa*). Both are extrinsic to the cognition's *essence*.
  Kumārila: Validity has no separate cause (intrinsic). Invalidity has a cause (defects).
