answer: |-
  You have hit on precisely the point that Douglas Jesseph emphasizes in *Squaring the Circle*: the Hobbes-Wallis controversy was not merely a dispute over a geometric theorem, but a collision between two incompatible metaphysical systems. To understand why Hobbes could not simply concede error, one must recognize that for Hobbes, geometry was not an isolated discipline. It was the epistemological keystone of his entire materialist philosophy.

  If Hobbes admitted that his geometry was wrong, he was not merely admitting a calculation error; he was admitting that his criteria for **certainty**, his definition of **causality**, and his rejection of **incorporeal substance** were all flawed.

  Here is an breakdown of the philosophical logic that locked Hobbes into his position.

  ### 1. *Verum Factum*: The Epistemology of Maker's Knowledge
  The foundation of Hobbes's confidence is the principle of *verum ipsum factum* ("the true is the made"). Hobbes argues that we can only have perfect, demonstrative knowledge of things that we ourselves create.

  *   **Natural Philosophy (Physics):** We do not know the world with certainty because God made the world. We can observe effects and hypothesize causes, but we cannot know the true causes because we did not construct the universe.
  *   **Civil Philosophy (Politics):** We *can* have certainty here because we construct the Commonwealth. We define the covenants and the sovereign; therefore, we can demonstrate the necessary consequences of those definitions (as he attempts in *Leviathan*).
  *   **Geometry:** This is the bridge. We have perfect certainty in geometry because we construct the figures. We define the circle, the line, and the angle.

  For Hobbes, a geometric proof is not a discovery of pre-existing Platonic truths; it is a tracking of the consequences of our own definitions. If his proof of squaring the circle failed, it implied a failure in the construction. But since Hobbes believed his construction followed the only valid method (motion), admitting the proof was wrong suggested that **human reason is incapable of achieving certainty even in the realm it constructs.** This would undermine the claim that his political philosophy could offer similar scientific certainty.

  ### 2. Genetic Definition and Materialism
  You correctly identified Hobbes's commitment to "genetic" definition. This is where his materialism bites hardest. For Hobbes, **all change is motion, and all causality is mechanical.**

  *   **The Static View (Wallis/Euclid):** A circle is the set of all points equidistant from a center. This is a property-based definition. It treats the figure as a static object that can be analyzed algebraically or logically.
  *   **The Genetic View (Hobbes):** A circle is the path traced by a line rotating around a fixed point. This is a causal definition. It explains *how* the figure comes to be.

  For Hobbes, to define a thing by its properties rather than its generation is to engage in "Scholastic nonsense." It treats abstract concepts as if they have real existence independent of matter. If you accept Wallis's abstract algebraic manipulation of quantities, you are implicitly accepting that "number" or "ratio" can exist without a physical body to be counted or measured.

  To Hobbes, this smelled of **incorporeal substance**—the very "ghosts" of the Catholic Church and the Platonists that he spent his life trying to exorcise. If Wallis is right that geometry can be done via abstract symbols without reference to physical motion, then Hobbes's materialism (the claim that *everything* that exists is body) is false. There would be a realm of abstract entities that are real but not material. Hobbes could not concede the math without conceding the metaphysics.

  ### 3. Reason as Computation
  Hobbes famously defined reasoning as "reckoning"—that is, addition and subtraction.
  *   In logic: Adding names to form propositions.
  *   In geometry: Adding lines to form figures.
  *   In physics: Adding motions to form consequences.

  This computational view of reason relies entirely on the idea that the objects of reason are discrete, constructible units (bodily motions). Wallis's emerging calculus and use of infinite series treated quantities as fluid and potentially infinite. Hobbes rejected the **actual infinite** as a contradiction in terms (you cannot count to infinity).

  When Wallis used methods that relied on indivisibles or infinite series to critique Hobbes, Hobbes didn't just see bad math; he saw **nonsense syntax.** To Hobbes, Wallis was trying to add and subtract things that had no physical referent. To accept Wallis's correction would be to admit that "reason" is not merely computation of bodies, but something more abstract and mystical.

  ### 4. The Systemic Stakes: Why He Couldn't Back Down
  This brings us to the core of your question: Why the stubbornness?

  If Hobbes had stood before the Royal Society and said, "You are right, my proof is wrong, I miscalculated," he would have triggered a domino effect through his system:

  1.  **Geometry:** My method of genetic definition does not guarantee truth.
  2.  **Epistemology:** "Maker's knowledge" does not guarantee certainty even when we construct the objects.
  3.  **Metaphysics:** Abstract quantities may have validity independent of bodily motion (undermining Materialism).
  4.  **Politics:** If I cannot demonstrate certainty in geometry (the easiest science), my claim to demonstrate certainty in politics (the hardest science) is hubris. *Leviathan* becomes opinion, not science.

  For Hobbes, the certainty of geometry was the warrant for the certainty of his political conclusions. He needed the geometric method to validate the scientific status of his civil philosophy. If the geometric foundation cracked, the *Leviathan* lost its claim to be a "science of justice."

  ### 5. Incommensurable Worlds
  Jesseph points out that by the end, Hobbes and Wallis were not even speaking the same language.
  *   **Wallis** was moving toward modern mathematics: symbolic, operational, and willing to treat mathematical objects as independent of physical instantiation.
  *   **Hobbes** was fighting for the last gasp of a rigorous Aristotelian-Euclidean ideal, filtered through a radical materialist lens.

  Hobbes wasn't being vain; he was being **consistent**. He recognized that Wallis's mathematics was not just a different set of techniques, but a different ontology. To accept Wallis's proof was to accept a world where abstract relations exist without matter. Hobbes would rather die a heretic in the eyes of mathematicians than a dualist in the eyes of philosophers.

  ### Summary
  The tragedy of Hobbes's later years is that he was defending a unified system of thought against a fragmenting modernity. He could not treat the squaring of the circle as a "math mistake" because, in his system, **there is no such thing as a purely mathematical mistake.** There are only errors in reasoning about bodies in motion.

  To admit error in *De Corpore* was to admit that the "Science of Justice" in *Leviathan* rested on sand. He held the line not because he thought he was right about the circle, but because he knew that if he was wrong about the circle, he was wrong about everything.
