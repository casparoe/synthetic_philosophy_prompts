  8.  **Final Polish:** Ensure the distinction between "simple" (noise) and "complex" (systematic bias) is applied rigorously to the SAI context. (e.g., Monsoon shifts aren't random noise; they are physically constrained but directionally uncertain in a way that matters).

  **(Self-Correction Note):** I need to be careful not to validate the science itself (I am an AI, not a climatologist), but rather validate the *structure of the uncertainty* as described by the user. The user *says* the second-order effects are hard to weigh. I accept that premise.

  9.  **Final Structure:**
