          *   *Options:* Precautionary Principle, Maximin (avoid worst case), Reversibility.
          *   *Nuance:* The letter is for *trials*, not deployment. Does trials trigger the worst case? Maybe via the "slippery slope" or moral hazard.
          *   *Impact:* Shifts burden of proof. Instead of "prove it helps," it becomes "prove it doesn't trigger the systemic risks."

      *   *Implication 3: Scope of Cluelessness (General vs. Specific).*
          *   *Thought:* User asks: "Doesn't this apply to malaria charities too?"
          *   *Analysis:* Yes, but degrees matter. Malaria nets have short causal chains. SAI has global, chaotic, long-term causal chains.
          *   *Impact:* Cluelessness is scalar. It gives *special* reason to be cautious about SAI compared to nets, even if it undermines all long-termism to some degree.

      *   *Implication 4: The Epistemic Status of the Agent.*
          *   *Thought:* The user is an expert. Does that change the moral obligation?
          *   *Analysis:* Yes. "Reasonable foreseeability" is relative to the agent. A layperson might be simply clueless; the expert is *complexly* clueless because they know the mechanisms of failure.
          *   *Impact:* Signing might be epistemically dishonest (as the user feared).

      *   *Implication 5: The "Small Trials" Distinction.*
