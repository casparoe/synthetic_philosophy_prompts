answer: |-
  This is an incredibly sharp reading of the text, and you have put your finger on one of the most famous and debated tensions in Bentham's moral philosophy. You are right to feel that this looks like a concession, and you are also right to spot the potential contradiction with the *Introduction to the Principles of Morals and Legislation* (IPML).

  Scholars (like Louis Crompton, who edited this essay, and more recently Gerald Postema) have wrestled with this exact passage. Here is how to unpack what Bentham is doing, why it isn't necessarily a contradiction, and where the "fudging" accusation holds water.

  ### 1. Psychological Fact vs. Normative Principle
  The key to resolving the tension between this essay and the IPML is distinguishing between **pain as a psychological fact** and **antipathy as a moral principle.**

  *   **In the IPML:** When Bentham attacks the "Principle of Sympathy and Antipathy," he is attacking it as a *standard of right and wrong.* He is saying you cannot justify a law *simply* by saying "I dislike this." That is an arbitrary assertion, not a rational ground.
  *   **In the Paederasty Essay:** Here, Bentham is acting as a psychological hedonist. He is acknowledging a fact of human nature: "If you feel disgust, you are experiencing a real sensation of pain." To deny that the bigot feels pain would be unscientific.

  So, he isn't contradicting himself. He is saying: "Yes, your disgust causes you real pain (fact). However, that pain does not automatically justify using the coercive power of the state to remove it (normative principle)."

  ### 2. The "Groundless" Pain Argument
  Look closely at this line: *"The antipathy in question ... is grounded only in prejudice. It may therefore be assuaged ... only in bringing to view the considerations which shew it to be ill-grounded."*

  Bentham is making a utilitarian calculation about the **source** of the pain.
  *   **Scenario A (Punishment):** You punish the gay man. The bigot feels pleasure. The gay man feels immense pain (loss of liberty, life, reputation). The prejudice remains intact.
  *   **Scenario B (Education):** You do not punish. You use reason to show the bigot that the act harms no one. The bigot's prejudice dissolves. The pain of antipathy disappears without inflicting pain on the gay man.

  For Bentham, the pain of antipathy is "illusory" in the sense that it is based on a false belief (that the act causes harm). In utilitarian terms, the most efficient way to eliminate that pain is to correct the belief, not to sacrifice the liberty of the minority. If you punish the act, you validate the false belief, making the prejudice harder to cure in the long run.

  ### 3. The Security Argument (The "Where to Stop" Point)
  This is the heavy lifter in the passage you quoted: *"if the propensity to punish were admitted... one should never know where to stop."*

  For Bentham, **Security** is the most important expectation the law must protect.
  *   If "disgust" is accepted as a valid ground for punishment, then no one is secure. Today it is gay men; tomorrow it is left-handed people, or people who wear the wrong hat, or political dissenters.
  *   The **pain of insecurity** (the anxiety that you might be punished at any moment for no objective reason) is a massive, widespread pain that affects *everyone* in the society, not just the minority.
  *   Therefore, in the felicific calculus, the **long-term pain of societal insecurity** outweighs the **short-term pleasure the bigots get from seeing punishment.**

  He is essentially arguing that the "pleasure" the bigots feel is **impure** (in the terms of the felicific calculus). It is followed by more pain (instability, tyranny, fear) than it is worth.

  ### 4. Is He Fudging?
  To answer your specific question: **Yes and no.**

  **No:** He is being consistent with hedonism. He refuses to lie and say the bigot's disgust "doesn't count." He includes it in the calculus to show that *even if* you count it, punishment still fails the utilitarian test because of the consequences (insecurity) and the availability of better solutions (education).

  **Yes:** There is a strategic ambiguity here. In the IPML, he wants to dismiss antipathy entirely as a moral guide. Here, he temporarily validates it as a "mischief" to disarm his opponents. He is meeting the religious/moral conservatives on their own ground ("You say it causes pain? Okay, let's talk about pain.") to show that their own logic leads to decriminalization.

  Some critics argue this *does* weaken his position because it suggests that if the prejudice were *strong enough*, or if the insecurity could be managed, the pain of the majority might outweigh the rights of the minority. It leaves open the door for a "tyranny of the majority" calculation that Bentham usually tries to close.

  ### Summary for your Seminar
  If you want to nail this in your seminar, you can frame it like this:

  1.  **Bentham grants the pain is real** to maintain psychological consistency (hedonism requires acknowledging all sensations).
  2.  **He denies the pain justifies law** because the pain is based on false beliefs (prejudice) that can be cured cheaper via education than punishment.
  3.  **He overrides the calculus** with the principle of **Security**. Allowing "antipathy" as a legal ground creates systemic insecurity that produces more total pain than the specific disgust of the bigots.
  4.  **Regarding IPML:** It is not a contradiction but a distinction between **data** (pain exists) and **principle** (pain alone doesn't justify law).

  You can conclude that while it looks like a concession, it's actually a sophisticated move to show that Utilitarianism, properly calculated, protects minorities better than "natural law" or religious morality does, because those systems have no check on prejudice, whereas Utilitarianism checks prejudice against the cost of insecurity.
