answer: |-
  The clock on the wall ticked past two, the sound distinct in the hollow of the conference room. Cold coffee sat in paper cups between stacks of amended drafts. Imre Vass rubbed a hand over his face, the stubble rasping against his palm, while Dalia Reyes leaned back, balancing her chair on two legs until it thudded down.

  "You know the line, Imre," Dalia said, her voice low, stripped of the courtroom projection she'd used all day. "Jefferson to Madison. 'The earth belongs always to the living generation.' They aren't here. The people who will have to live under this nine-tenths rule. They didn't vote for us, and they didn't sign this."

  "Ulysses didn't vote for his future self, either," Imre replied, tapping the clause with a pen. "He ordered his men to tie him to the mast. He knew the Sirens were coming. We know what comes when rights are subject to a simple majority during a panic. We have the bodies to prove it."

  "Ulysses was one man, Imre. A single continuous consciousness." Dalia leaned forward, elbows on the table. "He held the authority to bind himself, and he held the authority to untie himself when the song ended. You're proposing to bind millions of people who don't know each other, against dangers you can only guess at, without giving them the key. That isn't precommitment. That's necromancy."

  "The key isn't lost," Imre said, meeting her eyes. "It's just heavy. Three successive parliaments. That isn't the dead speaking; that's the living proving they've changed their mind slowly. If a future generation truly needs to amend this, they can. But they have to sustain the desire over years. That duration *is* the continuity of the self. It filters out the momentary panic from the considered will."

  "But you're assuming the danger looks the same ten years from now," Dalia countered. "You're binding them against *our* war. What if the danger isn't mob rule next time? What if the danger is the rigidity itself? If the pressure builds and there's no valve, the pipe doesn't bend. It bursts. You're trading the risk of panic for the certainty of fracture."

  "I'd rather argue about the pressure than clean up the explosion," Imre said softly. "The asymmetry of the risk is what matters. If we make it too hard to amend, we lose efficiency. We get gridlock. If we make it too easy, we get the camps again. I can live with gridlock. I won't sign off on a constitution that allows a temporary majority to strip rights during a crisis."

  "Gridlock kills too, just slower," Dalia said. "When people can't change the law, they stop respecting it. You remember the Southern provinces? They didn't leave because the constitution was too hard to amend. They left because it was too hard to be heard. Nine-tenths isn't a supermajority, Imre. It's a veto for a minority. Any ten percent can hold the rest hostage."

  "Any ten percent," Imre repeated, weighing the words. "Or the ten percent who are most vulnerable. The ones who don't have the money to lobby, or the guns to threaten. This clause isn't to protect the majority from the minority. It's to protect the minority from the majority. You spent twenty years litigating around entrenched clauses that protected privilege. I'm trying to write one that protects people."

  "I fought those clauses because they were shields for injustice," Dalia said, tapping the table. "A shield is useless if you're nailed to the floor. You say three parliaments can release the bond. But if the system is gerrymandered, or if the media is controlled, that consensus never forms. You're banking on a future virtue we haven't secured yet. You're trusting the future self to be rational, but you're giving it no way to act if it isn't."

  "Then we haven't secured anything, regardless of this clause," Imre said, leaning back, the fatigue finally showing in his shoulders. "If the culture collapses, no text saves us. But without the text, the culture has nothing to hold onto when the collapse starts. This clause says: some things are not up for vote during a fire. Even if the voters want to burn the house down."

  "And who decides what the fire is?" Dalia asked. "You? Me? The courts? You're asking me to trust that the interpreters of this clause will be wiser than the legislators. But we're the same people. We're just tired."

  "I'm asking you to trust that the process is wiser than the moment," Imre said. "I'm not asking for wisdom. I'm asking for friction. Enough friction to make sure that if they want to change this, they really mean it."

  Dalia looked at the clock, then back at the draft. She picked up her pen, spun it once, and set it down without writing. "Friction creates heat, Imre. Sometimes that starts the fire you're trying to stop."

  "Sometimes," Imre said, closing his notebook. "But sometimes it stops the spark from catching. I don't know which it will be. But I know what happened when there was no friction at all."

  "I know too," Dalia said quietly. She pulled the draft toward her, aligning the pages. "I just don't know if I'm willing to bet the next generation loses either way."

  "Neither am I," Imre said. "But the vote is at nine."

  "Then I'll be there," Dalia said, standing up. "And I'll argue both sides until I don't have a voice left."

  "I'd expect nothing less," Imre said. He didn't move to pack up yet. He just looked at the clause, then at the dark window where the city slept, unaware of what was being decided for them.
