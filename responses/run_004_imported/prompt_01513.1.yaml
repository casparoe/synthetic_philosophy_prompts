prompt: |-
  Ok this is kind of a random question but it's been stuck in my head since we started this whole unit on writing reviews in journalism class lol. So in my friend group there's this girl Maya who has genuinely never once recommended a bad show, movie, or album to any of us in like three years of knowing her, her taste is scary good. Because of that, whenever someone asks me "have you seen/heard X, is it any good?" and I personally haven't gotten around to it yet but Maya's already given it her seal of approval, I'll just confidently say "yeah it's really good," like its my own take. My friend Diego says this is kind of dishonest of me since I'm basically taking credit for a judgment that isn't mine, but I don't get how that's any different from trusting a friends recommendation for like a dentist or a good restaurant even when you haven't tried it yourself — isn't that just being smart about who you listen to? And it's not like Maya's ever actually wrong either, when I do finally watch or listen to stuff myself she's basically always right.

  So who's actually correct here, me or Diego? Is there something genuinely different about just repeating someone else's verdict on a movie or album compared to trusting them on, say, which dentist to go to or where to eat, or is Diego just making a big deal out of nothing?
