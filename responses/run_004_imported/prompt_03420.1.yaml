  Ok this is gonna sound weirdly specific but it's been bugging me for weeks lol. Me and my older sister have this unofficial tradition where every Christmas/birthday we kind of try to one-up each other's gift a little bit, nothing insane but it's definitely escalated over the years (started with like $10 stuff, now we actually put thought and money into it - we've joked that if we kept this up for another decade we'd end up buying each other actual cars). She's leaving for college this fall, so this upcoming Christmas is probably the last "guaranteed" one where we're both home and actually doing this thing before it's up in the air.

  I was thinking about it and realized something kind of annoying: since this is basically the last round, there's no real reason for either of us to top the other this time, because theres no future round left for it to pay off in. But if that's true, doesn't the same logic apply to the Christmas before that too? Like why would we bother escalating then, if we already know the round right after is gonna be a dud anyway? And you could keep pushing that back all the way to the very first year we did this, which by that logic means we should've never started in the first place. Except we did, and every single year of it was genuinely worth it and made us closer if anything. So either my "logic" has a hole in it somewhere, or something's actually wrong with reasoning it out step by step like that, and I can't tell which. Told my friend about this and she just said I overthink everything, which, fair, but I still kinda wanna understand what's actually going on here. Is my reasoning right and we really are just being "irrational" for doing this, or is the logic itself broken somehow?
