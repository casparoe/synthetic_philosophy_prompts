      *   If Peano Arithmetic (PA) or ZFC is inconsistent, then there exists a statement $P$ such that both $P$ and $\neg P$ are provable.
      *   By the principle of explosion (*ex falso quodlibet*), if a system is inconsistent, every statement becomes provable. $1 = 0$ becomes provable. Theorems become meaningless.
      *   Gödel's 2nd Incompleteness Theorem says a system cannot prove its own consistency. We rely on relative consistency (e.g., ZFC is consistent if ZF is consistent) or intuition.
      *   The story needs to capture the moment where the "faith" is shaken not by philosophy, but by a concrete derivation that looks valid.
      *   The protagonist needs to be a working mathematician/logician.

  3.  **Character & Setting:**
