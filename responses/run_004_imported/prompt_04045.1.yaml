answer: |-
  The coffee on Elias's desk had developed a skin, a thin, iridescent film that trembled when the building's heating kicked in. On his monitor, the PDF glowed with the stark, unforgiving clarity of LaTeX typesetting. It was thirty-four pages long. The title was modest: *A Note on the Derivability of Contradiction in PA*.

  PA. Peano Arithmetic. The bedrock. The integers, addition, multiplication, induction. The system upon which Elias had built a career, upon which engineering stood, upon which the quiet certainty of his mornings was predicated.

  He scrolled to page twelve. This was where Julian's argument tightened its grip. Elias had been here for four hours. He had checked the quantifiers. He had traced the substitution instances. He had verified the use of the induction schema. It was boring. That was the terrifying part. It wasn't a flashy paradox involving self-reference or semantic loops. It was a grind. A slow, mechanical derivation that started with the standard axioms and ended, inexorably, with $0 = 1$.

  If this was correct, the principle of explosion applied. *Ex falso quodlibet*. From falsehood, anything follows. If $0 = 1$ is a theorem, then every statement in the language of arithmetic is a theorem. The Riemann Hypothesis is true. The Riemann Hypothesis is false. The sky is green. God exists. God does not exist. The system becomes trivial. It collapses into noise.

  Elias rubbed his eyes. The room was dark, save for the screen and the streetlights filtering through the rain-streaked window. He remembered the incident in 2011. Edward Nelson. A giant. He had claimed PA was inconsistent. The community had held its breath. Then Tao had found the gap. A subtle circularity. The breath was exhaled. The foundation held.

  But Nelson was old then. Julian was forty. Sharp. Meticulous. And Julian wasn't claiming a gap in someone else's work; he was handing over a finished derivation.

  Elias picked up his phone. He hesitated, then dialed. It rang four times before Julian picked up. His voice was flat, drained of its usual lecturing cadence.

  "You're still there," Elias said.

  "I haven't moved," Julian replied. "Did you find it?"

  "I'm on page fourteen. The transition from line 40 to 41. You're using a cut rule."

  "It's admissible."

  "It looks admissible," Elias said. "But if it is, then we're done. You understand what you're saying, Julian? You're saying that every proof we've ever written is simultaneously valid and invalid. You're saying that consistency is a hallucination."

  "I know what I'm saying, Elias."

  "Frege," Elias said. "Russell's letter. Frege added an appendix to the second volume of *The Basic Laws of Arithmetic*. He wrote that nothing more unfortunate can befall a scientific writer than to have one of the foundations of his edifice shaken away after the work is finished. But Frege knew immediately. He had time to write the appendix. We… we might not know."

  "There is no appendix this time," Julian said. "If this holds, there is no outside vantage point. Gödel told us we couldn't prove consistency from the inside. He didn't say we couldn't prove inconsistency. If we can prove inconsistency from the inside, then the inside is all there is. And it's rotting."

  Elias looked back at the screen. He imagined the community reaction. The arXiv submission would go up in six hours. By noon, it would be everywhere. By evening, the senior logicians would be convening emergency seminars. They would tear this paper apart. They would look for the gap with the desperation of drowning men looking for a raft.

  But what if they didn't find it?

  "What happens tomorrow?" Elias asked. "I have undergraduates. Calculus I. Limits. Derivatives. All of it rests on the completeness of the reals, which rests on the construction of the numbers, which rests on this."

  "You teach them the same thing," Julian said. "The bridge doesn't fall down because the math is wrong. The physics still works. The integers still count."

  "But the proof is gone," Elias said. "A proof is supposed to be a guarantee. It's supposed to be eternal. If I write a proof on a chalkboard, I am saying, 'This is true, regardless of time, regardless of us.' If this paper stands, then a proof is just a temporary consensus. It's just a story we tell until someone finds a better contradiction."

  "It was always a story, Elias. We just forgot."

  Elias hung up. He turned back to the screen. He forced himself to read the derivation again, line by line. He wanted to find the error. He needed to find the error. He wanted to be the one to write the email to Julian saying, *Line 42 assumes what it proves.* He wanted to be the savior of the system.

  But the logic held. It was seductive in its simplicity. It utilized the very strength of the system—the ability to encode its own syntax—against itself. It wasn't a trick. It was a key turning in a lock that shouldn't have existed.

  He thought about the phrase *crisis of certainty*. It sounded dramatic, like a headline. But here, in the quiet of his office, it felt like grief. It was the loss of a parent you didn't know was mortal. The axioms were supposed to be the things that didn't break. They were the definitions of truth. If $1 \neq 0$ is not necessarily true, then what is?

  He opened a new document. He began to type. He wrote: *Theorem: The system is consistent.* He began to sketch a proof. It was easy. In an inconsistent system, everything is provable. So, he could prove consistency. He could prove inconsistency. He could prove that Julian was right, and he could prove that Julian was wrong. Both proofs would be valid within the system.

  The absurdity of it made him nauseous. The formal system had become a liar that could tell the truth about its own lying.

  He stopped typing. He looked at his hands. They were solid. The coffee cup was solid. The world outside, with its rain and traffic and sleeping students, did not care about Peano Arithmetic. The sun would rise even if $0=1$. That was the disconnect. The map was burning, but the territory remained. Yet, mathematicians lived in the map. It was their only territory.

  Elias saved the file. He named it *Review_Draft_1.tex*. He didn't send it.

  He stood up and walked to the window. The rain had stopped. The street below was slick with reflection. He wondered about Julian. Was he sleeping? Was he staring at his own screen, waiting for the email that would either vindicate him or destroy him? Or perhaps waiting for the email that would tell him the world had decided to ignore him, to treat the proof as a pathological curiosity, a virus to be quarantined rather than a truth to be accepted.

  Mathematics had survived crises before. The discovery of irrational numbers. The paradoxes of the infinite. The incompleteness theorems themselves. Each time, the definition of mathematics expanded to accommodate the shock. They built new systems. ZFC replaced naive set theory. Intuitionism offered a way out.

  But this was different. Those were expansions. This was a dissolution. If PA is inconsistent, you cannot simply build a new arithmetic that includes the old one. You have to abandon the integers as we know them. You have to tell the engineers that their calculations work only by accident, that they are building on sand that happens to behave like stone.

  Elias went back to his desk. He sat down. He opened the PDF again. He highlighted line 41.

  *Therefore, $\neg \text{Con}(PA)$.*

  He stared at the symbols. They were black on white. They were silent. They demanded nothing. They simply existed.

  He realized then that the burden wasn't on Julian to prove the inconsistency. The burden was on everyone else to prove the consistency. And Gödel had already told them they couldn't do that. They could only believe. They had always only believed. The proof just made the faith visible.

  Elias closed the laptop. The room plunged into darkness. He sat there for a long time, listening to the hum of the computer fan winding down. He thought about his class tomorrow. He would walk in. He would write $1 + 1 = 2$ on the board. He would speak about limits and continuity. He would act as if the ground was solid.

  Because it was. Or because it had to be.

  He stood up and put on his coat. He would leave the paper for the morning. Let the sun hit it first. Let the daylight test the ink. He walked to the door, hand on the switch, and paused.

  If the system was inconsistent, then it was possible that he would leave the room, and possible that he would not. Both statements were provable. The certainty of his own movement was gone, replaced by a terrifying freedom.

  He flipped the switch. The light died. He opened the door and stepped into the hallway, walking carefully, one foot in front of the other, proving his own consistency with every step, hoping that the universe, unlike the arithmetic, would hold.
