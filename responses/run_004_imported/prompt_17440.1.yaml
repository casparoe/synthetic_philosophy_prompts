prompt: |-
  Random context dump, sorry in advance: I'm on the committee for my law school's jurisprudence society, and we run this tiny podcast that maybe fifteen people listen to, mostly our own parents. I only ended up being "the philosophy of law person" because of a genuinely unhinged argument at a family dinner a couple months ago -- there's a push in my country right now to decriminalise sex work, my uncle is dead against it, and when I asked him why, given that literally nobody in the scenario he was describing is being forced into anything, he basically said "because it's wrong, and the law is allowed to say so." I didn't have a real comeback beyond "that feels undemocratic," and a friend later told me I'd basically reinvented one side of the old Hart-Devlin debate from the 60s. So I went and read up on it, and now, somehow, I'm the one writing questions for our next episode.

  Our guest next month is a legal philosopher who's built her career defending an updated version of Patrick Devlin's side of that fight -- she thinks the "no victim, no crime" liberal consensus (Hart's side, more or less) quietly smuggles in its own contestable morality, and that a society is entitled to use the law to protect a shared moral fabric even when nobody involved is harmed. I've read her main article twice, so I know she can recite the position fluently, which is exactly the problem -- I don't want 40 minutes of her just walking us through it uncontested.

  Could you draft 8-10 interview questions, each with a short follow-up keyed to whatever dodge she's most likely to reach for? I'd like at least one on Devlin's "reasonable/right-minded person" test for locating the limits of toleration -- including the caveats he added himself, like insisting mere distaste isn't enough -- and whether the whole apparatus does anything besides dress up majority disgust as principle; one on the disintegration thesis and whether it's even falsifiable, given Devlin never actually shows a society coming apart because it tolerated something; one that makes her account for the fact that the very practice (homosexuality) that prompted Devlins original essay is now the textbook case of harmless private conduct, without letting her get away with "well, that one turned out to be a mistake" for free; and one that pins her to the sex-work case specifically, since that's literally the live version of the argument I keep having with my uncle.
