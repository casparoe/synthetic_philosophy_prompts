answer: |-
  Your intuition is psychologically sound, and your writing group is narratively cautious. Neither of you is necessarily "wrong," but you are arguing about two different things: **truth versus structure.**

  Here is the breakdown of why your approach is valid, why your group is reacting that way, and how to determine if you are actually being "lazy" or just writing a different kind of story.

  ### 1. The Psychological Truth: You Are Right
  Your assessment of human emotion is accurate. Cognitive psychology and relationship studies support the idea that major emotional shifts are rarely singular events. They are usually processes of **accretion** or **erosion**.

  *   **Retrospective Narrative:** Humans rarely experience feelings in real-time with perfect clarity. We usually construct the narrative of "when I fell out of love" *after* the fact to make sense of the chaos.
  *   **The Boiling Frog Effect:** In long-term relationships, the change is often in what stops happening (the absence of a bid for connection) rather than what starts happening (a fight). Absence is hard to pinpoint in a specific scene.
  *   **Uncertainty:** The feeling of "I don't know if this is permanent" is often more agonizing and realistic than "I am done."

  If your novel aims for realism, literary fiction, or psychological depth, forcing a "lightning bolt" moment would actually be the lazy choice. It would be imposing a Hollywood structure onto a human experience to make the reader comfortable.

  ### 2. The Narrative Risk: Why Your Group is Worried
  Your writing group isn't necessarily saying "people don't feel this way." They are saying, **"Readers need to feel that something has changed."**

  When a group calls this a "cop-out," they usually mean one of three things:

  *   **Passive Protagonist:** If the character doesn't realize anything, does she make any choices? A story where things happen *to* a character without them processing it can feel like nothing is happening.
  *   **Lack of Catharsis:** Readers invest emotional energy. They want a return on that investment. A "clean moment" provides closure. Without it, the reader might feel stranded.
  *   **Ambiguity vs. Vagueness:** There is a difference between *intentional ambiguity* (thematically rich uncertainty) and *vagueness* (the author didn't do the work to define the stakes). If the group feels the emotional stakes are muddy, they will ask for a clear realization scene to fix it.

  ### 3. Is It Lazy Writing?
  It is only lazy if you are using "realism" as an excuse to avoid writing the **consequences** of the feeling.

  You do not need a scene where she says, *"I no longer love him."* That is often bad writing anyway (on-the-nose).
  However, you **do** need scenes where her behavior changes because the love is gone.

  **The Test:**
  *   **Lazy:** She feels distant, thinks "I don't know what's wrong," acts distant, and the book ends with her still wondering.
  *   **Intentional:** She feels distant, buys a one-way ticket, or stops wearing her wedding ring, or sleeps on the couch *without* being able to articulate why. The **action** confirms the feeling even if the **internal monologue** is uncertain.

  ### 4. How to Satisfy Both Sides
  You can keep your realistic, slow-burn ambiguity while giving the writing group the structural satisfaction they crave. You don't need a moment of *certainty*; you need a moment of *irreversibility*.

  Consider these alternatives to the "Clean Realization Scene":

  *   **The Action Realization:** She doesn't realize she's fallen out of love, but she realizes she can't stay. She packs a bag. The action is clear, even if the emotion is muddy. (See: *The Seawall* by Anna Hope or *Revolutionary Road*).
  *   **The External Mirror:** Have another character point it out. "You look tired when you're around him." The protagonist denies it, but the reader sees the truth.
  *   **The Physical Shift:** Describe a physical reaction to his touch that she tries to rationalize but can't. The body knows before the mind does. Show the body knowing.
  *   **The End of Hope:** Instead of realizing the love is dead, she realizes the *possibility* of it returning is dead. That is a clearer, actionable realization that fits your slow-burn model.

  ### 5. Famous Precedents
  You are in good company. Many acclaimed works reject the "clean break."
  *   **"The Story of an Hour" (Kate Chopin):** The realization is complex and tied to freedom rather than just hatred.
  *   **_Normal People_ (Sally Rooney):** The characters constantly misread each other and themselves. The "moments" are often missed connections.
  *   **_Marriage Story_ (Film):** The divorce happens, but the love and the confusion coexist until the very end.

  ### Verdict
  **Do not add a fake epiphany.** If you force a scene where she suddenly "knows," you will betray the theme of your book and your own understanding of human nature. Your group is reading through the lens of traditional structure; you are writing through the lens of psychological realism.

  **However,** listen to their *concern*, not their *solution*. Their concern is likely that the arc feels flat.
  *   Make sure the **decay** is visible scene-by-scene, even if the character doesn't name it.
  *   Make sure the **ending** feels like a result of that decay, not just a fade-to-black.

  If the reader can trace the erosion perfectly, even if the character cannot, you have succeeded. That is not lazy; that is dramatic irony, and it is powerful. Trust your third novel instincts. You know the difference between a mess and a mosaic.
