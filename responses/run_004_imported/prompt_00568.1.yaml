      *   **Distinguish "Lazy" vs. "Intentional":** The key difference is execution. Is the ambiguity a result of avoiding the hard work of showing the decay, or is it a deliberate stylistic choice?
      *   **Actionable Solutions:** How to keep the ambiguity but satisfy the reader's need for *something*?
