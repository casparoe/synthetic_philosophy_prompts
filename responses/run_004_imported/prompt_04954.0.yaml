answer: |-
  The problem of causation by omission poses a significant challenge to metaphysical accounts of causality. When a lifeguard fails to save a drowning swimmer, or a gardener neglects to water a neighbor's plants, we intuitively hold them responsible for the harm. Yet, ontologically, an omission is a non-event; it is the absence of an action. This raises the question of whether such absences can be genuine causes or merely placeholders in our explanatory practices. Furthermore, this issue is compounded by the **selection problem**: if the lifeguard's failure is a cause, why is it not also a cause that the bus driver down the street failed to jump in and save the swimmer? Indefinitely many agents could have intervened; why do we single out the lifeguard?

  Comparing David Lewis's counterfactual-dependence account with Phil Dowe's conserved-quantity (physical-process) account reveals a sharp divergence. Lewis accepts omissions as genuine causes but relegates the selection problem to pragmatics. Dowe denies that omissions are genuine causes, categorizing them as "quasi-causes," yet must still explain why we select specific omissions for blame. While Dowe's account is ontologically stricter, **Lewis provides the more principled treatment of the selection problem.** Lewis transparently locates selectivity in the pragmatics of causal attribution, consistent with his broader metaphysics. Dowe, conversely, must reach beyond his official physicalist resources—importing the very counterfactual and normative machinery he excludes from "real" causation—to explain the phenomenon of omission talk, resulting in a fractured and less principled account of selectivity.

  ### Lewis: Counterfactual Dependence and Pragmatic Selection

  David Lewis's theory defines causation in terms of counterfactual dependence between distinct events. Roughly, $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred. This framework naturally accommodates omissions. If the lifeguard had noticed the swimmer (the omission had not occurred), the swimmer would not have drowned (the effect would not have occurred). Thus, for Lewis, the failure to notice is a genuine cause.

  However, this inclusivity generates the selection problem immediately. Counterfactually, the swimmer's death also depends on the bus driver not saving him, the baker not saving him, and so on. If any of them had acted, the death would have been prevented. Lewis acknowledges this "profligacy" of causes. He argues that while the *causal relation* is an objective feature of the world (determined by counterfactuals), **causal selection** is a pragmatic matter. We distinguish the "cause" from mere "conditions" based on context, salience, and normative expectations.

  In the lifeguard case, the lifeguard's omission is selected not because it is metaphysically distinct from the baker's omission, but because the lifeguard has a duty to act. Lewis's theory is principled here because it maintains a clear division of labor: metaphysics determines the web of counterfactual dependencies, while pragmatics (human interests, norms, and context) determines which thread we pull out and label "the cause." Lewis does not pretend the metaphysics alone solves the selection problem; he admits that selectivity is external to the causal relation itself.

  ### Dowe: Physical Processes and Quasi-Causation

  Phil Dowe's conserved-quantity theory defines causation as the exchange or possession of a conserved quantity (like energy or momentum) between processes. On this view, causation requires a physical connection. Since an omission involves no physical process linking the agent to the outcome (the lifeguard's *not-moving* transmits no energy to the drowning swimmer), Dowe argues that omissions are **not genuine causes**.

  To accommodate the intuition that the lifeguard is responsible, Dowe introduces the category of "quasi-causation." An omission is a quasi-cause if there is a relevant counterfactual dependence and a normative expectation that the action should have occurred. Dowe thus dissolves the selection problem at the ontological level: there is no selection of *causes* among omissions because there are no causal omissions. However, he must still explain the selection of *quasi-causes*. Why do we call the lifeguard's omission a quasi-cause but not the baker's? Dowe appeals to norms and expectations: the lifeguard was *supposed* to act.

  ### Comparison: Principled Treatment of Selectivity

  The crux of the comparison lies in how each theory handles the resources required to solve the selection problem.

  **1. Consistency of Resources**
  Lewis's theory is built on counterfactuals. Since omissions generate counterfactual dependencies just as positive events do, including them requires no new metaphysical machinery. When Lewis appeals to pragmatics to solve the selection problem, he is consistent with his view that causation is abundant and objective, while causal *talk* is selective and interest-relative. He reaches beyond his metaphysical resources, but he openly categorizes that reach as "pragmatics," not metaphysics.

  Dowe's theory is built on physical processes. To handle omissions, he cannot use his official resources (conserved quantities), because by definition, omissions lack them. Consequently, Dowe must construct a parallel account ("quasi-causation") that relies heavily on **counterfactuals** (the very thing he rejects for real causation) and **norms** (which are not physical). In explaining why we select the lifeguard's omission over the baker's, Dowe relies on the same normative and counterfactual machinery that Lewis uses. However, Dowe presents this as a secondary, derivative category. This creates a tension: his explanation of omission-selectivity relies on resources (counterfactuals) that his core theory deems insufficient for real causation.

  **2. Transparency regarding Selectivity**
  Lewis offers a more principled treatment of selectivity because he correctly identifies that the difference between the lifeguard and the baker is not a difference in *causal structure*, but a difference in *obligation*. In the web of counterfactuals, they are identical. Lewis admits this and says our selection is based on norms.

  Dowe attempts to preserve the intuition that there is a metaphysical difference (one is a cause, the other is not), but since he admits omissions aren't causes, he must explain the difference via norms anyway. Thus, Dowe's theory implies that the "real" causation (physics) is irrelevant to the selection problem, while the "quasi" causation (norms/counterfactuals) does all the work. This renders his physicalist constraint otiose regarding the specific problem of omissions. He reaches beyond his physicalist resources just as much as Lewis reaches beyond his metaphysical resources, but Lewis is more honest about the division. Lewis says, "Causation is everywhere; selection is up to us." Dowe says, "Causation is physical; but for omissions, we pretend it's counterfactual and select based on norms."

  **3. The Selection Problem Specifically**
  The selection problem asks why we single out one non-event among infinite possibilities.
  *   **Lewis:** All are causes. We single one out based on context/duty. The theory explains *why* we select (pragmatics) without distorting the ontology.
  *   **Dowe:** None are causes. We single one out as a "quasi-cause" based on context/duty.

  Dowe's approach is less principled regarding selectivity because it creates an ontological dualism to solve what is essentially a pragmatic problem. By denying omissions the status of causes, Dowe forces the selection problem into a shadow category ("quasi-causation") that mimics the structure of Lewis's account but lacks its ontological commitment. This suggests that Dowe's physicalist restriction is unable to handle the selection problem on its own terms; it must import the counterfactual/normative framework to explain why we talk about omissions at all. Lewis, by contrast, allows the counterfactual framework to handle the ontology of omissions directly, leaving the selection problem to be solved by the pragmatics of communication and responsibility, which is where selectivity naturally resides.

  ### Conclusion

  While Dowe's conserved-quantity account offers a robust ontology for positive causation, it fares worse than Lewis's counterfactual account regarding the selection problem for omissions. Dowe must reach beyond his official physicalist resources, importing counterfactuals and norms to explain "quasi-causation," effectively admitting that his core theory cannot account for the selectivity we care about in moral and legal contexts. Lewis, conversely, provides a more principled treatment. He acknowledges that the metaphysics of causation (counterfactual dependence) renders the lifeguard and the baker ontologically equal, and he locates the selectivity squarely in the pragmatics of normative expectation. By separating the objective causal relation from the subjective causal selection, Lewis offers a transparent explanation that aligns with our practices of responsibility without fracturing the concept of causation into "real" and "quasi" categories. Thus, Lewis accommodates the selectivity of omissions more coherently, admitting that the distinction lies in our interests, not in the physical fabric of the world.
