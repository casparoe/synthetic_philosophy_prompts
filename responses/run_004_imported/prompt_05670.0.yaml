      *   **Theoretical Validity:** Address the "time-average justification" first. Does it survive the move to portfolios? (Yes, via portfolio growth rate).
      *   **Mathematical Implications (The "How-To"):** Explain Generalized Kelly. Mention the covariance matrix. Explain how correlation shrinks/expands positions.
      *   **Practical Considerations for a Student Society:**
