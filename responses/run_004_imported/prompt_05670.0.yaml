          *   Constraints (No shorting, leverage limits).
      *   **Geometric Rationality Nuance:** Briefly touch upon the philosophical shift (risk as volatility drag, not utility).
      *   **Summary/Recommendation:** Actionable advice for the committee.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Refining the Ergodicity Point:* Be careful. In a single bet repeated, LLN converges the geometric mean to the expected log return. In a portfolio held for one term, the return is a random variable. Over *many terms*, the portfolio return sequence converges. So the time-average logic applies to the *terms*, not the individual trades within a term. The portfolio is just a "composite bet" played each term.
      *   *Refining the Correlation Point:* Make sure to explain *why* correlation matters. If assets are perfectly correlated, it's like one big bet. If uncorrelated, variance drops, allowing higher total leverage for same growth rate.
