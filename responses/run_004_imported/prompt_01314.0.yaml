      *   *Check:* Did I address "conditions"? Yes (Usurper vs. Legitimate, Public vs. Private).
      *   *Check:* Did I take a stand? Yes (No general right for private individuals; public authority required).

  *(Self-Correction during final review)*: I need to make sure I don't gloss over the *Sentences* too much. It *does* say "quilibet" (anyone). I must acknowledge this but explain why *De Regno* supersedes or clarifies it as the mature political doctrine. The prompt asks what he is *best read* as permitting. The best reading integrates the texts but prioritizes the mature systematic work (*De Regno*/*Summa*) over the student commentary (*Sentences*).

  Let's structure the verdict clearly: Aquinas permits lethal resistance against a *usurper* by private individuals only as a last resort of defense, but forbids it against a *legitimate* ruler, reserving that for public authority. Thus, a "right to tyrannicide" in the sense of private judicial execution is rejected.

