prompt: |-
  I'm reporting on the long-running debate over whether insurers should be permitted to see the results of predictive genetic tests, and I think I've come across the detail that settles it. I.J. Good's 1967 theorem on the value of information establishes, as a matter of Bayesian decision theory, that a rational agent's expected utility can never be lowered by learning a relevant, cost-free piece of evidence before acting on it — the expected value of information, in the jargon, is always non-negative. If that's a genuine mathematical result, then any rule barring insurers or applicants from using genetic information would seem to make the resulting contracts strictly less accurate, and therefore less efficient, whatever the equity case for such rules might be. Yet plenty of serious economists and bioethicists argue that restricting this information can leave everyone, including future policyholders, better off. Have I missed some wrinkle in how Good's theorem applies to a case like this, or are these economists really just setting aside a settled piece of decision theory for political reasons?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** The debate over insurers using predictive genetic test results.
      *   **User's Claim:** I.J. Good's 1967 theorem on the Value of Information (VoI) proves that having more information (genetic tests) always increases expected utility for a rational agent. Therefore, banning insurers from using this information makes contracts less efficient.
      *   **User's Observation:** Economists and bioethicists argue that restricting this information can make everyone better off (Pareto improvement).
      *   **User's Question:** Did I miss a wrinkle in Good's theorem, or are these experts ignoring math for politics?
      *   **Tone:** Skeptical of the experts, confident in the mathematical theorem, seeking clarification.

  2.  **Evaluate I.J. Good's Theorem:**
      *   **What does it say?** For a *single* rational decision-maker, the expected value of free, relevant information is non-negative. It never hurts to know more *before making a decision*.
      *   **Key Assumptions:**
          *   Single agent.
          *   Cost-free information.
          *   The agent controls the action based on the information.
          *   Utility is defined solely over the outcomes of that specific decision.
      *   **Does it apply to Insurance Markets?** Insurance is a *multi-agent* game (insurer vs. applicant) with *asymmetric information* and *adverse selection*. Good's theorem is about individual decision theory, not general equilibrium or game theory.

  3.  **Identify the "Wrinkle" (The Economic Counter-Argument):**
      *   **Adverse Selection:** If applicants know their risk but insurers don't (or vice versa), market dynamics change.
      *   **The Hirshleifer Effect (1971):** This is the crucial missing piece. Jack Hirshleifer showed that *public* or *shared* information can sometimes destroy risk-sharing opportunities.
      *   **Mechanism:** Insurance works by pooling risk. If you know *exactly* who will get sick (perfect information), you can't insure them (or premiums equal expected loss). If information is revealed *before* the contract is signed, high-risk individuals become uninsurable or face prohibitive premiums.
      *   **Ex-Ante vs. Ex-Post:** Good's theorem looks at decision utility *given* the information. Economics looks at welfare *before* the information is known (veil of ignorance).
      *   **Market Failure:** Unrestricted information can lead to market unraveling (Akerlof's "Lemons" problem). If high risks are priced out, the pool shrinks, premiums rise for the rest, more drop out, market collapses.

  4.  **Synthesize the Conflict:**
      *   **Good's Theorem:** Applies to an *insurer* deciding on a premium *given* an applicant. Yes, knowing the genetics helps the insurer price accurately.
      *   **Economic/Bioethical View:** Applies to the *system* of insurance and the *applicant's* welfare *before* testing. If testing is allowed/mandatory, high-risk people lose access to insurance. Their expected utility drops drastically (financial ruin if they get sick). The *aggregate* welfare might drop even if the *insurer's* accuracy goes up.
      *   **Conclusion:** The user is misapplying a single-agent decision theory theorem to a multi-agent market equilibrium problem. The experts aren't ignoring math; they are using different (and more appropriate) math (Game Theory/General Equilibrium).

  5.  **Draft the Response (Iterative Process):**

      *   *Acknowledge and Validate:* Start by confirming Good's theorem is real and respected. Don't dismiss the user's finding.
      *   *The Pivot:* Explain *why* it doesn't settle the debate. It's a category error (Decision Theory vs. Market Equilibrium).
      *   *Key Concept 1: The Hirshleifer Effect.* This is the specific economic counter-theorem. Explain how information can destroy risk-pooling value.
      *   *Key Concept 2: Adverse Selection & Unraveling.* Explain how information asymmetry (or symmetry) affects the pool.
      *   *Key Concept 3: Ex-Ante Welfare.* Distinguish between "utility after knowing" vs. "welfare before knowing." People value not knowing (insurance).
      *   *Address the "Political Reasons" Claim:* Gently correct this. It's not politics; it's welfare economics.
      *   *Nuance:* Mention that Good's theorem *does* apply to the insurer's profit maximization, but that's not the same as social welfare.

  6.  **Refine the Argument (Self-Correction/Check):**
      *   *Did I explain Good's theorem correctly?* Yes, single agent.
      *   *Is the Hirshleifer citation accurate?* Yes, Jack Hirshleifer, "The Private and Social Value of Information and the Reward to Inventive Activity" (1971).
      *   *Is the distinction clear?* Insurer efficiency $\neq$ Social efficiency.
      *   *Tone Check:* Ensure I don't sound condescending. The user made a smart connection, just applied it to the wrong domain.

  7.  **Final Polish:** Structure with clear headings. Use bold text for key terms. Ensure the conclusion directly answers the "Have I missed some wrinkle?" question. (Yes, you missed the game-theoretic context).

      *(Self-Correction during drafting)*: I should make sure to mention that Good's theorem assumes the information doesn't change the *state of the world*, just the decision. In insurance, the *availability* of insurance changes the state of the world for the applicant. Also, emphasize that insurance is about transferring risk, and perfect information eliminates risk *insurability*.

  8.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  You have identified a genuine and profound theorem in decision theory, but you have encountered a classic case of **category error**. You are applying a theorem from *single-agent decision theory* to a *multi-agent market equilibrium* problem.

  The economists and bioethicists you are reading are not ignoring I.J. Good's theorem for political reasons. They are relying on a different set of mathematical results—specifically from welfare economics and game theory—that demonstrate why Good's theorem does not guarantee social efficiency in insurance markets.

  Here is the wrinkle you have missed, broken down into three key concepts.

  ### 1. Single Agent vs. Multi-Agent Systems
  **Good's Theorem (1967)** applies to a single rational agent making a decision. It states that if *you* are the one acting, and the information is cost-free, knowing more cannot lower your expected utility.
  *   **Application to Insurer:** For the *insurance company* acting alone, Good's theorem holds. If an insurer knows an applicant has a high-risk gene, they can price the policy to match the risk, avoiding losses. Their expected utility (profit) increases or stays the same; it never decreases.

  **The Insurance Market**, however, is a **two-sided market** involving risk transfer between an insurer and an applicant. The "utility" in question is not just the insurer's profit, but the **social welfare** of the pool of policyholders.
  *   **The Conflict:** What maximizes the insurer's decision-theoretic utility (perfect pricing) may minimize the applicant's utility (affordability) and destroy the mechanism of insurance itself (risk pooling).

  ### 2. The Hirshleifer Effect (1971)
  The specific economic counter-theorem you are looking for was published by Jack Hirshleifer in 1971, titled *"The Private and Social Value of Information and the Reward to Inventive Activity."*

  Hirshleifer demonstrated that **information can have negative social value.**
  *   **How Insurance Works:** Insurance functions by pooling risk. Low-risk people subsidize high-risk people. This works best when risks are uncertain *ex-ante* (before the contract).
  *   **The Effect:** If predictive genetic testing makes risk certain *before* the contract is signed, the opportunity for risk-sharing vanishes.
      *   If I know I have the Huntington's gene, I will buy maximum coverage.
      *   If the insurer knows I have it, they will charge me a premium equal to the payout (or deny coverage).
      *   **Result:** The "insurance" becomes a pre-paid savings plan. The high-risk individual loses the benefit of pooling. Their *ex-ante* expected utility (viewed from before they knew their genetic status) is lower because they have lost the ability to insure against that specific risk.

  In this context, **ignorance is a valuable asset.** By banning the use of genetic tests, society preserves the "veil of ignorance" that allows risk pooling to function. This is not a political preference; it is a welfare calculation showing that *ex-ante* welfare is higher when certain information remains hidden.

  ### 3. Market Unraveling (Akerlof's Lemons)
  There is a second dynamic known as **adverse selection**, formalized by George Akerlof (1970).
  *   **Scenario A (Ban on Insurer Use):** Applicants might still take tests privately. If high-risk applicants know they are high-risk (but insurers don't), they buy more insurance. Insurers lose money, raise premiums for everyone, low-risk people drop out, and the market collapses.
  *   **Scenario B (Mandatory/Allowed Use):** If insurers use the tests, high-risk people are priced out. They remain uninsured. If they get sick, they become a public burden (emergency rooms, state support).
  *   **The "Settled" Debate:** The debate isn't about whether information is valuable to the *insurer* (Good's theorem says yes). The debate is about whether the **externalities** of that pricing create a net negative for society.

  If high-risk individuals are denied coverage and subsequently bankrupted by illness, the social cost (crime, loss of productivity, state welfare) may exceed the efficiency gains the insurer made by avoiding the claim. Good's theorem does not account for externalities; it only accounts for the decision-maker's direct utility.

  ### Summary
  You have not found a flaw in the economists' reasoning; you have found the boundary condition of Good's theorem.

  1.  **Good's Theorem** proves that information is valuable to the **insurer's pricing accuracy**.
  2.  **Hirshleifer's Theorem** proves that information can be destructive to **risk-sharing welfare**.
  3.  **Akerlof's Model** proves that information asymmetry can cause **market collapse**.

  The economists argue that restricting genetic information preserves the **value of insurance** (the ability to transfer unknown risk), which outweighs the **value of accuracy** (pricing risk perfectly).

  **Verdict:** The experts are not setting aside decision theory for politics. They are prioritizing **general equilibrium welfare economics** over **partial equilibrium decision theory**. Good's theorem is mathematically sound, but it is the wrong tool for measuring social welfare in a risk-pooling market. The "wrinkle" is that in insurance, the goal is not to predict the future accurately, but to share the burden of an unpredictable future. Perfect prediction destroys the product.
