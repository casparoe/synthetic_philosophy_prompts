prompt: |-
  I'm on the board of our little local history museum — all volunteers, nobody with any art background. Our one real "name" piece, a big landscape always labeled as being by the one painter from our town who ever got properly famous, is why most people actually come in. We hired a conservator to clean it, and after some pigment testing she's now pretty confident he didn't paint it at all — more likely an apprentice or someone in his circle copying his style at the time, and it only picked up his name decades later from a donor who liked the idea of owning a real one. So nobody was trying to trick anybody when it was actually painted, it just sort of turned into a fake later through other peoples wishful thinking and bad paperwork. Half the board wants to quietly relabel it and move it out of the main room since technically we've been misrepresenting it for years, the other half says people get the exact same experience standing in front of it either way, so changing anything now just makes us look bad for no benefit to anyone walking through the door. I have to bring a memo to next month's meeting saying what we actually do and by when — can you write that for me, with a real recommendation, and make it actually deal with that second argument instead of waving it off as missing the point.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small local history museum, all-volunteer board, no art background.
      *   **Problem:** The star attraction (a landscape by the town's famous painter) has been determined by a conservator to be *not* by the famous painter, but likely by an apprentice/circle member. It wasn't a malicious forgery originally, but attribution drifted over time due to wishful thinking/bad paperwork.
      *   **Conflict:**
          *   Group A: Relabel quietly, move out of main room (Integrity/Accuracy focus).
          *   Group B: Keep as is, change nothing (Visitor Experience/Reputation focus).
      *   **Task:** Write a memo for next month's meeting.
      *   **Requirements:**
          *   Include a real recommendation.
          *   Address the "Visitor Experience" argument (Group B) seriously, not dismissively.
          *   Set a timeline/deadline.
          *   Tone: Professional, empathetic, decisive, suitable for a volunteer board.

  2.  **Determine the Recommendation:**
      *   *Option 1 (Status Quo):* Bad idea. If the truth comes out later (and it often does in the art world), the museum loses all credibility. It's ethical malpractice.
      *   *Option 2 (Hide it):* Bad idea. It's still a valuable historical object (local history, even if not by the *master*). Hiding it wastes resources and diminishes the collection.
      *   *Option 3 (Relabel & Reframe):* Best option. It maintains integrity while preserving the visitor experience. It turns a potential scandal into an educational opportunity.
      *   *Decision:* Recommend updating the label to reflect the new attribution *but* keeping the painting in the main room (or a prominent spot) with a narrative that explains *why* this matters. This addresses Group A's integrity concern and Group B's experience concern.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the conservator's findings.
      *   **The Situation:** Briefly summarize the findings without jargon. It's not a "fake," it's a "misattribution."
      *   **Addressing the Conflict (The Core Task):**
          *   Acknowledge Group A (Integrity): We have an ethical duty to be accurate.
          *   Acknowledge Group B (Experience): They are right that the visual beauty hasn't changed. Visitors come for the beauty and the story.
          *   *Synthesis:* The story *has* changed, and that new story is actually interesting. Hiding the truth risks greater reputational damage later.
      *   **The Recommendation:**
          *   Update the label (honestly).
          *   Keep the painting prominent (it's still historically significant to the town).
          *   Add context (make the attribution history part of the exhibit).
      *   **Timeline:** Specific steps and deadlines (e.g., label change by X date, board vote by Y date).
      *   **Closing:** Reiterate the mission (trust, education, history).

  4.  **Refining the Tone:**
      *   Needs to be respectful of volunteers. No scolding.
      *   Needs to be firm on ethics without being alarmist.
      *   Needs to validate the "Visitor Experience" argument. *Why* is Group B right? Because the aesthetic value is real. *Why* are they risky? Because trust is fragile.
      *   *Key phrase to include:* "The painting hasn't changed, but our story about it has."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey Board. Conservator says painting isn't by Famous Guy.
      *   Some want to hide it. Some want to keep lying.
      *   I say we tell the truth. If we don't, and someone finds out, we look like fools.
      *   But Group B is right, it's still a pretty painting. So we keep it up.
      *   We change the label to "Circle of Famous Guy."
      *   Let's do this by next quarter.
      *   Thanks.

      *Critique 1:* Too blunt. "Keep lying" is inflammatory. Needs more nuance on the "Visitor Experience" argument. Needs to sound like a leadership document.

  6.  **Drafting - Iteration 2 (Adding Nuance):**
      *   Subject: Attribution Update for [Painting Name].
      *   We have new data. It's likely an apprentice.
      *   Group A says accuracy. Group B says visitor experience.
      *   Group B makes a good point: the visual experience is the same. But museums are about truth. If we get caught, the experience is ruined forever.
      *   Recommendation: Relabel, keep on display, explain the history.
      *   Timeline: Vote next meeting, implement in 30 days.

      *Critique 2:* Better. But needs to really lean into the "deal with that second argument" instruction. I need to explain *how* the new label enhances the experience rather than detracting from it. The mystery *is* the history.

  7.  **Final Polish (incorporating into the final output):**
      *   Use professional formatting.
      *   Make the recommendation specific (New text, placement).
      *   Ensure the timeline is realistic for volunteers.
      *   Emphasize that "Local History" includes the history of the *object* itself, not just the image.
      *   Make sure the "Group B" argument is validated: Yes, the aesthetic value remains. Yes, we don't want to shame visitors. But transparency builds *more* trust, which improves the long-term experience.

  8.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Real recommendation? Yes (Reattribute & Reframe).
      *   Deal with Group B argument? Yes (Acknowledged aesthetic value, but highlighted trust risk).
      *   Timeline included? Yes.
      *   Tone appropriate for volunteers? Yes.

      *(Self-Correction during drafting)*: I should make sure I don't use the word "fake." The prompt says "nobody was trying to trick anybody." I should use terms like "studio practice," "circle of," or "period copy." This aligns with the conservator's view and reduces the stigma.

      *(Refining the Timeline)*: Volunteers move slowly. "Next month's meeting" is when the decision happens. Implementation should be within 60 days of approval.

      *(Refining the Argument)*: The strongest counter to Group B is that a museum's currency is trust. If a school group or a donor finds out we *knew* and didn't say, the "experience" becomes one of betrayal. I need to phrase this gently but firmly.

  9.  **Final Output Generation** (Proceed to write the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Name of Museum]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Attribution of [Name of Painting]

  **Purpose**
  The purpose of this memo is to present a course of action regarding the attribution of our key landscape piece, currently cataloged as [Painting Name] by [Famous Painter]. Following the recent conservation assessment and pigment analysis, we now possess evidence suggesting the work was created by an apprentice or associate within the painter's studio, rather than by the master himself.

  We must decide how to integrate this new information into our public presentation. This memo outlines the ethical considerations, addresses the valid concerns regarding visitor experience, and provides a specific recommendation for a vote at next month's meeting.

  **The Situation**
  The conservator's report indicates the work is a period piece, likely created in the famous painter's studio during his lifetime. It is not a modern forgery. However, the attribution to the master himself appears to have originated from a donor's assumption decades ago rather than documented provenance.

  Currently, the board is divided between two positions:
  1.  **Accuracy:** We must correct the record immediately to maintain institutional integrity.
  2.  **Visitor Experience:** The visual impact of the painting remains unchanged; altering the label risks disappointing visitors and drawing negative attention to the museum without adding value to their visit.

  **Addressing the Visitor Experience Argument**
  The argument that "the experience remains the same" is partially correct and deserves serious weight. Visitors are drawn to the beauty of the landscape and the connection to our town's most famous artist. Aesthetically, the painting has not changed. If we simply swap the label to read "Unknown Artist," we risk diminishing the object's perceived value and making our past volunteers look incompetent.

  However, relying on the status quo carries a significant long-term risk to that same visitor experience. Museums operate on a currency of trust. If a visitor, researcher, or donor discovers we *knew* the attribution was incorrect and chose to conceal it, the "experience" shifts from appreciation to betrayal. That loss of credibility would far outweigh the temporary disappointment of a label change.

  Furthermore, the history of the painting *is* local history. The story of how our town's famous artist worked, how his studio operated, and how local collectors coveted his name is a richer, more human story than a simple signature. By updating the display, we do not diminish the experience; we deepen it from passive viewing to active learning.

  **Recommendation**
  I recommend we adopt a strategy of **"Transparent Reframing."** We will correct the attribution without removing the painting from prominence.

  **Specific Actions:**
  1.  **Update Attribution:** Change the wall label to: *[Painting Name], c. [Date]. Oil on canvas. Circle of [Famous Painter].*
  2.  **Add Context:** Include a brief paragraph on the label or a small adjacent placard explaining the conservation findings.
      *   *Draft Text:* "Long attributed to [Famous Painter], recent analysis suggests this work was created by a skilled member of his studio. In the 19th century, studio assistants often worked in the master's style. This piece remains a vital example of our town's artistic heritage and illustrates the high demand for [Famous Painter]'s work during his lifetime."
  3.  **Placement:** The painting should remain in the main gallery. It is still a significant historical object, regardless of the specific hand that painted it.
  4.  **Internal Records:** Update all catalogs, insurance documents, and website listings to reflect the "Circle of" attribution immediately.

  **Timeline**
  *   **Board Vote:** [Date of Next Month's Meeting]
  *   **Label Design & Approval:** Within 2 weeks of vote.
  *   **Installation of New Labels:** Within 45 days of vote.
  *   **Website/Database Update:** Concurrent with label installation.

  **Conclusion**
  We are a history museum, not just an art gallery. Our mission is to preserve and share the truth of our community's past, even when that truth is more complicated than the legend. By acknowledging the painting's true origin, we protect the museum's reputation for honesty and turn a potential controversy into an educational opportunity.

  I move that we approve this recommendation at the upcoming meeting.

  [Your Signature]

  [Your Name]
  Board Member
