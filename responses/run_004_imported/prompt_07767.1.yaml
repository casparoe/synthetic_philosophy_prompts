      *   *Open-mindedness vs. Skepticism:* Turing was open to counter-intuitive ideas (computable numbers, universal machines, machine intelligence). However, he wasn't a gullible mystic. He treated ESP as a physical phenomenon that could interfere with an experiment, not necessarily as a spiritual truth.
