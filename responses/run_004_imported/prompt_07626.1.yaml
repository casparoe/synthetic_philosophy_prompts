answer: |-
  **To the Partners of MacFarlane, Smellie & Co.**
  **14th October 1758**

  **Re: The Deacons' Petition to the Convention of Royal Burghs**

  Gentlemen,

  You have asked for my assessment regarding the circular petition currently circulated by the Guild Deacons, which urges Parliament to restrict the export of specie and levy heavier duties upon foreign manufactures. You require to know whether this House should lend its name to the measure.

  My recommendation is plain: we ought not to sign. To do so would be to endorse a remedy that is at once futile and injurious to the very trade it claims to protect. I offer this opinion not lightly, nor without regard for the distress the Deacons allege, but because the principles underpinning their petition misunderstand the nature of money and the flow of commerce.

  The Deacons proceed from the notion that the nation's wealth consists in its stock of gold and silver coin, and that any outflow of this "treasure" to England or the Continent is a permanent loss to be arrested by law. This is a confusion of the instrument for the thing itself. Coin is not wealth; it is but the oil which allows the wheels of industry to turn. If we hoard the oil, the wheels seize. If we allow it to circulate, even abroad, it returns by the natural course of trade.

  The Deacons fear that an unfavourable balance of trade bleeds us dry. Yet, if we permit specie to leave when prices here are high, the quantity of money remaining in Scotland diminishes. Consequently, the price of our labour and commodities must fall. As our prices fall, our goods become more competitive against the English and the Dutch. Foreign buyers will seek us out, the balance will turn, and the coin will flow back to Glasgow as inevitably as water seeks its level. To prohibit the export of coin is to dam the stream; it does not increase the water, it merely stagnates the mill.

  Furthermore, there is a prevailing anxiety that a scarcity of coin drives up the rate of interest, choking credit for our tobacco ventures. Experience suggests otherwise. Interest is not governed by the quantity of coin in the vault, but by the stock of real capital available for lending. If our warehouses are full of tobacco and our fields of linen, there is capital to borrow, regardless of whether the settlement is made in gold or bill. To restrict coin will not lower interest; it will only make settlement difficult.

  It is also worth considering that the prosperity of our neighbours in England is not purchased at our expense. A wealthy neighbour is a better customer than a poor one. If the English grow rich through their manufactures, they possess greater means to purchase our re-exported tobacco. To raise duties in retaliation is to tax our own merchants and invite reciprocity that closes their ports to our goods.

  **However,** I must address the objection you yourselves raised, which carries more weight than the Deacons' philosophy. Even if the mechanism of trade is self-correcting, it is not instantaneous. There is a lag between the outflow of specie and the return of competitiveness. In that interval, prices fall, credit tightens, and men are turned from the works. A theoretical equilibrium offers no bread to an idle weaver in the Gallowgate. The Deacons argue that the magistrate must intervene to spare the people this interim hardship. This is a humane concern, and one I do not dismiss as mere ignorance.

  Yet, legislation cannot suspend the laws of commerce without penalty. If we artificially retain coin here while our prices remain high, our goods will not sell. If our goods do not sell, the workmen are idle regardless of the penalty on export. The petition seeks to treat the symptom (the loss of coin) rather than the disease (a lack of competitiveness). By signing, we would encourage a false sense of security, delaying the necessary adjustments in our industry and frugality that would truly restore the balance. We would trade a sharp, short correction for a prolonged stagnation.

  **Conclusion:**

  I advise the House to **refuse the petition.**

  Instead, I suggest we draft a brief counter-remonstrance to the Convention. We should argue that the true remedy lies not in restraining the circulation of money, but in encouraging industry and lowering the cost of our own production. Let the coin go where it will; if our tobacco is priced well and our linen is fine, the coin will find its way back to the Clyde.

  I remain, Gentlemen, your humble servant,

  *J. Morison*
