      *   Glasgow tobacco merchants? Yes.
      *   Humean arguments (specie flow, money as instrument, interest rates, non-zero-sum)? Yes.
      *   Decisive recommendation? Yes.
      *   Acknowledges short-term disruption? Yes.
      *   Period register? Yes.

