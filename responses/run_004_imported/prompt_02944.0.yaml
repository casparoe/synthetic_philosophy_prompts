answer: |-
  This is an exceptionally sharp question. You have correctly identified a tension between Quine's ontological criterion (the indispensability argument) and his metaethical skepticism (specifically in "On the Nature of Moral Values"). Most introductory treatments of Quine gloss over this, but you have pinpointed exactly where the friction lies.

  To answer this, we must reconstruct Quine's criteria for ontological commitment and measure Enoch's "Deliberative Indispensability Argument" against them. While Enoch presents his argument as a Quinean extension, a rigorous application of Quine's actual commitments suggests he would have rejected Enoch's move.

  Here is the reconstruction of the reasoning Quine most plausibly would have used, followed by a definitive verdict.

  ### 1. The Baseline: Why Quine Accepts Numbers
  To understand why Quine would likely reject Enoch, we first have to be precise about why he accepted mathematical entities in the first place. It is a common misconception that Quine believed in numbers simply because they are "useful."

  For Quine, ontology is determined by our best **scientific** theory of the world. His naturalism is *scientific* naturalism. We believe in electrons because they are indispensable to physics, and physics is our best tool for predicting **observation sentences** (sensory stimuli like "Lo, a rabbit").
  *   **The Chain:** Observation Sentences $\rightarrow$ Physical Theory $\rightarrow$ Mathematics.
  *   Mathematics is indispensable to Physics.
  *   Physics is indispensable to predicting Observation.
  *   Therefore, Mathematics earns ontological rights by association with the empirical anchor.

  Quine accepts abstract objects (sets, numbers) reluctantly, as a "dragon" we must keep in the cellar because it guards the house of science. They are admitted only because we cannot formulate the laws of physics without them.

  ### 2. Enoch's Shift: From Science to Deliberation
  David Enoch's argument attempts to parallel this structure but changes the anchor.
  *   **Enoch's Chain:** Moral Facts $\rightarrow$ Practical Deliberation.
  *   Deliberation is indispensable to our lives (just as science is).
  *   Moral facts are indispensable to deliberation (just as math is to science).
  *   Therefore, Moral Facts earn ontological rights.

  Enoch argues that if we are justified in believing in numbers because we can't do physics without them, we are justified in believing in moral facts because we can't deliberate without them.

  ### 3. Quine's Objections: Three Principled Blocks
  If we apply Quine's specific philosophical commitments to Enoch's argument, three major obstacles emerge.

  #### A. The Loss of the Empirical Anchor
  In "On the Nature of Moral Values," Quine emphasizes that science converges because of **observation sentences**. When two scientists see a rabbit, their sensory stimuli force a convergence in their reports. This intersubjective check is what allows science to claim objectivity.

  Quine explicitly states that ethics lacks this. There is no "moral stimulus" that forces assent in the way a rabbit does.
  *   **Quine's Critique:** Enoch's argument makes deliberation the tribunal of truth. But for Quine, deliberation is not a truth-tracking mechanism in the scientific sense; it is a desire-satisfying mechanism.
  *   Without observation sentences to anchor the web of belief, "indispensability" floats free. For Quine, a concept is indispensable only if it helps us predict sensory experience. Moral facts might be indispensable for *feeling* good about a decision, or for social coordination, but they do not help predict the rabbit. Therefore, they do not meet the naturalistic criterion for existence.

  #### B. Truth-Aptness and Cognitive Content
  Quine's indispensability argument applies to theories that aim at **truth**. We believe in sets because they are part of a true theory (physics).
  In "On the Nature of Moral Values," Quine is deeply skeptical that moral sentences function like scientific sentences. He suggests they are closer to "commands" or "expressions of sentiment" (a non-cognitivist leaning), or at best, claims that cannot be verified.
  *   **Quine's Critique:** You cannot be indispensable to a truth-apt theory if you are not part of a truth-apt system. If moral discourse is primarily about nurturing sentiments (as Quine suggests in the dog/turnip example), then positing "moral facts" is a category mistake. We don't need *facts* to explain sentiments; we need *psychology*.
  *   Enoch assumes moral claims are truth-apt (capable of being true). Quine's 1978 paper suggests they lack the empirical content required to be true in the robust sense required for ontology.

  #### C. Eliminability (The "Psychology" Loophole)
  This is perhaps the strongest technical objection. In the philosophy of science, an entity is indispensable only if it cannot be **paraphrased away**. We cannot talk about physics without numbers; there is no nominalist version of physics that works as well.
  *   **Quine's Critique:** Can we explain deliberation without moral *facts*? Yes. We can explain deliberation entirely using **beliefs and desires** (psychological states).
  *   If I deliberate about whether to steal a turnip, I don't need a "moral fact" to explain my hesitation. I need a belief ("stealing causes punishment") and a desire ("I want to avoid punishment") or a sentiment ("I feel bad about stealing").
  *   Quine would argue that Enoch has confused *normative authority* with *ontological commitment*. Just because we *feel* we ought to deliberate using moral terms doesn't mean moral *objects* exist. We can have the discourse without the ontology. Math cannot be eliminated from physics; moral facts *can* be eliminated from psychology.

  ### 4. Addressing the Holist Counter-Argument
  A pro-Enoch reading might point to Quine's **holism**. Quine believes the "web of belief" is connected. Couldn't moral beliefs be part of the web?

  Quine would reply that while moral beliefs are *in* the web, they are not near the periphery where the web touches the world (observation). They are deep in the center, associated with our genetic and cultural conditioning. For Quine, being "in the web" isn't enough for realism; you must be in the web *as a posited entity required for empirical prediction*. Moral values, for Quine, are more like logical laws or conceptual truths that we revise only under extreme duress, but unlike math, they do not facilitate the prediction of sensory stimuli. They facilitate social cohesion. For a scientific naturalist, social cohesion is a sociological fact, not evidence for moral *properties*.

  ### The Verdict

  **Quine would have rejected David Enoch's argument.**

  While Enoch's argument is structurally similar to the Quine-Putnam indispensability argument, it violates the core constraint of Quine's naturalism: **the primacy of empirical science as the arbiter of existence.**

  Quine accepted mathematical realism because math is indispensable to *physics*, and physics is our best account of *sensory experience*. Enoch asks us to accept moral realism because morals are indispensable to *deliberation*. For Quine, deliberation is a psychological process, not an empirical theory of the world. Since moral facts are not required to predict observation sentences, and since moral discourse can be explained via psychology (beliefs/desires/sentiments) without positing objective moral properties, Quine would view Enoch's move as an illegitimate expansion of ontology.

  He would likely characterize Enoch's argument as a category error: confusing the indispensability of a *normative practice* (deliberation) with the indispensability of a *theoretical entity* (like an electron or a set). Quine's naturalism is strict; it allows dragons in the cellar only if they guard the empirical house. Moral facts, lacking an observational anchor, would be evicted.
