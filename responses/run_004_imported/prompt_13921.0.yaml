answer: |-
  **Elena:** Look, Marcus, I get the intuition. If I had watered the fern, it would be alive. But causation requires a productive connection—a transfer of energy or a physical process. My *not* watering isn't a process; it's the absence of one. You can't transmit a force that doesn't exist. At best, my omission explains the death, it doesn't *cause* it.

  **Marcus:** But explanation *is* what causation does. On a counterfactual account, if the effect depends on the putative cause, it's a cause. The fern's survival depended on your action. If you say omissions aren't causes, you can't account for standard cases like starvation or suffocation. We say lack of oxygen killed him, not just the presence of a blockage.

  **Elena:** That's where the view explodes. If my not-watering is a cause, then the Queen of England's not-watering is also a cause. She didn't water it either. In fact, everyone on earth who didn't water it is a cause. You've got thousands of causes for one dead plant, most of them spatially disconnected. That's metaphysically insane.

  **Marcus:** It's only insane if you ignore default conditions. Causation isn't just about raw counterfactuals; it's about deviations from a normal or expected course. The Queen has no role in the fern's maintenance; you did. The "normal" background includes you watering it. Your omission was a deviation; hers wasn't. That filters the noise.

  **Elena:** And there it is. "Role," "expected," "normal." You're smuggling a moral or social duty into the metaphysics to fix the problem. The universe doesn't care about your job description. Physically, your absence and the Queen's absence are identical: zero water molecules added. You're using ethics to do ontological work.

  **Marcus:** I'm not talking about moral duty, I'm talking about system norms. A heart *not* pumping causes death, not because the doctor has a duty to fix it, but because pumping is the biological default. Norms aren't just ethical; they're structural. We identify causes by looking at what interrupted the expected functioning of a system. You interrupted the care system; the Queen didn't.

  **Elena:** But the heart example relies on a physical mechanism failing. The "interruption" is the clot, the tissue death—the positive events. If you rely on "expected functioning," you make causation subjective. Two people with different expectations about who should water the plant get different physical realities of what caused the death. Causation should be mind-independent.

  **Marcus:** Causation is a relation between events, but *causal selection* is always interest-relative. We're looking for difference-makers relevant to a context. Production accounts are too narrow; they miss the structure of dependence that actually matters for science and law. The fern died because the specific agent responsible for its water didn't act. That's a real fact about the world, not just a feeling.

  **Elena:** It's a real fact about *responsibility*, maybe. But if you insist that's causation, then every time I don't punch you, I'm causing your safety. I'm constantly causing the world to continue as is by omitting to destroy it. If you want to keep "cause" meaningful, you have to restrict it to positive productions, not infinite negative non-events.

  **Marcus:** And if you restrict it that way, you lose the ability to explain why things go wrong. Sometimes the cause *is* the missing piece. I'd rather accept that causal claims are context-sensitive than deny that starvation kills. The fern is dead, Elena. Your omission made the difference. That's enough for me.
