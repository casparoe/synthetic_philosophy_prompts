answer: |-
  **Setting:** *The faculty lounge, 4:30 PM. The whiteboard is still covered in diagrams from the Moral Psychology seminar. Two mugs of lukewarm coffee sit on the table. ELENA (Virtue Ethicist, Philosophy Dept) and MARK (Situationist, Psychology Dept) are unpacking their bags. They look tired but energized.*

  **Mark:** (Tossing a pen onto the table) Okay, I'll say it. Zimbardo was a showman. The guards were coached. Milgram's archives show he debriefed poorly and maybe pushed harder than the script said. "The Lifespan of a Lie," right? I read the piece. You were right to bring it up in lecture.

  **Elena:** (Raising an eyebrow) I'm sorry, could you record that? I need it for my next tenure review. "Mark admits the Situationist Holy Trinity has a leak."

  **Mark:** Don't get cocky. The Trinity lost two legs, but the torso is still standing. Just because the prison guards were acting and the shock-teachers were stressed doesn't mean character exists. It just means those specific experiments were messy. The structural point remains: people don't act from internal traits; they act from external pressures.

  **Elena:** So, what's left in the torso?

  **Mark:** Hartshorne and May. 1928. Character Education Inquiry. They tested thousands of kids. Cheating on a math test, cheating on an athletic game, lying to a teacher, stealing coins. If "honesty" was a virtue—a stable trait—you'd expect a kid who cheats on math to cheat at sports.

  **Elena:** And?

  **Mark:** The correlations were tiny. A kid might be scrupulously honest about the coins but cheat on the math test to win. Honesty wasn't a thing inside the kid; it was a function of the specific context. Risk of getting caught, peer pressure, how much they wanted the prize.

  **Elena:** That's eighty-year-old data, Mark.

  **Mark:** It's been replicated. Look at Batson's "Good Samaritan" study. Seminary students. People training specifically for *virtue*. They're asked to give a talk on the Parable of the Good Samaritan. On the way to the hall, they pass a guy slumped in an alley, coughing.

  **Elena:** I know the study.

  **Mark:** Do you know the predictor? Whether they stopped to help wasn't correlated with how religious they were. It wasn't correlated with whether they were thinking about the Good Samaritan. It was correlated with whether they were *late*. If they were told they were running behind, most walked right past. The situation—time pressure—swamped the "trait."

  **Elena:** And the dime?

  **Mark:** Isen and Levin. Phone booth study. You find a dime in the return slot, you're significantly more likely to help a stranger pick up dropped papers. A literal ten cents shifts your moral compass. If virtues like "helpfulness" were robust character traits, a dime shouldn't move the needle. But the data says the situation moves the needle every time.

  **Elena:** (Leaning back) You're making the same category error you've made for ten years.

  **Mark:** Which is?

  **Elena:** You're treating virtues like binary switches. As if having the virtue of honesty means you *never* lie, regardless of the stakes, or that "helpfulness" means you stop for every coughing man even if you're about to miss a lecture that will educate fifty future counselors.

  **Mark:** It's not about perfection, Elena. It's about prediction. If traits exist, they should predict behavior. But when you run the numbers across the literature, the correlation between personality measures and actual behavior rarely exceeds 0.3.

  **Elena:** The famous 0.3 ceiling.

  **Mark:** Exactly. Do the math. An *r* of 0.3 means personality accounts for less than 10% of the variance in behavior. Ninety percent is situational noise. If I build a model in my lab that predicts 10% of the output, I throw it out. You want to build an entire ethical system on the 10%.

  **Elena:** But that 0.3 is across *heterogeneous* situations. You're aggregating behavior in a phone booth with behavior in a seminar with behavior in a cheating scandal. Of course the correlation is low. That's like measuring my "driving skill" by averaging my speed on the highway, my parking accuracy, and my ability to change a tire.

  **Mark:** But life *is* heterogeneous. Virtue ethics claims to guide us through *life*, not just "morally salient" situations that you get to define post-hoc.

  **Elena:** Here's the substantive pushback, Mark. And I want you to listen, because this isn't just "philosophy is normative." You're assuming virtues are causal mechanisms that fire automatically. Like a reflex. "Stimulus: Dime. Response: Help."

  **Mark:** Aren't they?

  **Elena:** No. Virtues are more like expertise. Think about a grandmaster chess player. If you put them in a random board state, they'll make a good move. If you put them in a board state where the pieces are knocked over, or the clock is broken, or they're playing checkers by mistake, they might fail. Does that mean chess skill doesn't exist?

  **Mark:** (Pauses) No, but chess skill is domain-specific. You're claiming "moral character" is domain-general.

  **Elena:** I'm claiming it's domain-sensitive. The seminary students in Batson's study? They interpreted the situation as "Get to the lecture hall on time." A truly virtuous agent might have interpreted the situation as "A human being is suffering in my path." The virtue isn't just the action; it's the *perception* of the situation. Your studies measure the action. You miss the cognition.

  **Mark:** That's a convenient shield. "You didn't measure their perception." But if the perception doesn't result in the behavior, what work is the virtue doing? If the "honest" kid still cheats when the risk is low, the virtue isn't doing much work.

  **Elena:** It's doing the work of probability. You said it yourself: 10% of the variance. In a complex system, a 10% edge is massive. But more importantly, virtues are developmental. You're testing undergraduates and seminary students. They're novices.

  **Mark:** So the virtues only exist in the sages? The people who don't show up in our subject pools?

  **Elena:** I'm saying you're measuring the seed and complaining it's not a tree. Hartshorne and May showed kids. Kids don't have fully formed prefrontal cortexes, let alone stable characters. Of course their behavior is situational. They're learning. Virtue ethics is a theory of *flourishing* and *development*, not a snapshot of current undergraduate behavioral statistics.

  **Mark:** But if the theory requires the subject to be a sage to be falsifiable, isn't that unfalsifiable?

  **Elena:** No. It predicts that with training and reflection, the consistency *should* increase. You're using the lack of virtue in the population to argue against the existence of virtue. That's like measuring the average fitness of the American population and concluding that "physical health" is a fiction because most people can't run a six-minute mile.

  **Mark:** (Smiles) That's good. But here's the kicker. The situationist isn't saying we should give up on being good. We're saying the way to make people good isn't "build character." It's "fix the situation."

  **Elena:** Engineering the environment.

  **Mark:** Exactly. If you want people to stop for the coughing man, don't pray for virtue. Make sure the schedule isn't so tight that they're late. If you want to stop cheating, change the incentive structure, don't lecture on honesty. If 90% of the variance is situational, why are you spending your energy trying to fix the 10% internal trait?

  **Elena:** Because the situation doesn't interpret itself.

  **Mark:** What does that mean?

  **Elena:** Two people can be in the same "situation." One sees a dime and feels lucky; the other sees a dime and feels it's litter. One sees a time crunch as a crisis; the other sees it as a test of priority. The situation exerts pressure, yes. But the *agent* determines the vector of that pressure. If you remove the agent's disposition entirely, you have no explanation for why, in the *exact same situation*, one person stops and the other walks.

  **Mark:** Random noise.

  **Elena:** Or unmeasured internal variance.

  **Mark:** (Sighs, picks up his coffee) You know, for ten years I've tried to convince you that character is a folk psychological illusion. Like phlogiston.

  **Elena:** And for ten years I've tried to convince you that you're measuring behavior and calling it morality. You've conceded the prison, Mark. You've conceded the shocks. But you won't concede that the 0.3 correlation might be the signal in a very noisy world.

  **Mark:** I'll concede this: If virtues exist, they're fragile. They're easily overridden. They aren't the robust engines you describe in Aristotle.

  **Elena:** And I'll concede this: If we ignore the situational pressures, our ethics is useless. We can't just tell people to "be brave" and ignore the fact that the system is designed to punish bravery.

  **Mark:** (Stands up) So, we're at the same place we were last year?

  **Elena:** (Gathering her papers) Mostly. Except now we know the prison guards were acting.

  **Mark:** (Grinning) Small victories. Same time next week?

  **Elena:** Same time. But I'm changing the syllabus. We're reading the Batson study again.

  **Mark:** Fine. But I'm assigning the footnote about the time pressure variable.

  **Elena:** Deal.

  *(They walk out together, the argument unresolved, the whiteboard still full of their conflicting diagrams.)*
