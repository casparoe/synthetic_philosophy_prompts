answer: |-
  You have stumbled upon a profound concept in game theory and decision theory, often discussed under the names **Program Equilibrium**, **Transparent Game Theory**, or within the framework of **Logical Decision Theory**.

  You are not just lucky; there is a rigorous mathematical and logical principle behind why this works. However, there is also a significant security caveat you need to be aware of (which I will address at the end).

  Here is the breakdown of why transparency creates cooperation rather than vulnerability.

  ### 1. The Core Mechanism: Conditional Cooperation
  In a standard trade (a version of the **Prisoner's Dilemma**), the fear is that you send your item and the other person keeps theirs. In a verbal agreement, you have no way to enforce the promise.

  In your script-based system, the code does not simply say, "I will send the item." A robust trading script says:
  > *"I will send the item **IF AND ONLY IF** I can verify that your script will also send the item."*

  Because you exchange the source code *before* execution, the other party can inspect your logic. They can see that your script is programmed to cooperate **conditionally**.
  *   If they try to exploit you (by writing a script that takes but doesn't give), your script detects this (logically or structurally) and refuses to send.
  *   If they write a script that mirrors yours (cooperates if you cooperate), both scripts verify each other, and the trade executes.

  ### 2. Why Transparency is a Strength (Credible Commitment)
  In traditional negotiation, hiding your strategy is often seen as power. In this specific logical setup, hiding your strategy is a signal of **untrustworthiness**.

  *   **Hiding Code:** If you hide your code, I cannot verify that you aren't a "DefectBot" (a script that always takes). Since I am rational, I will not risk sending my item to a black box. No trade occurs.
  *   **Showing Code:** By showing your code, you are making a **Credible Commitment**. You are mathematically binding yourself to a specific behavior. You are removing your own ability to cheat. Paradoxically, by removing your ability to cheat, you make yourself a safe partner.

  This transforms the interaction from a gamble on *character* (which is unknown) to a verification of *logic* (which is known).

  ### 3. Why Exploitation Fails
  Your intuition suggests that knowing your strategy allows a stranger to exploit you. This would be true if the games were **causally independent** (i.e., their decision happens in a vacuum).

  However, when both parties run code that analyzes the other's code, the decisions become **logically correlated**.
  *   Imagine you write a script called `FairBot`. It says: "Cooperate if I can prove the other bot cooperates with me."
  *   If a stranger tries to write an `ExploitBot` that tricks `FairBot`, `FairBot` simply defects. The result is **Mutual Defection** (no trade).
  *   The stranger realizes that exploiting you yields nothing (0 value), whereas cooperating with you yields a profit (positive value).
  *   Therefore, the rational move for the stranger is to write a script that cooperates with your script.

  This creates a **Nash Equilibrium** where mutual cooperation is the stable outcome, provided both sides use transparent, conditional logic.

  ### 4. The Theoretical Lineage
  This scenario is a real-world analogue to thought experiments explored by researchers in AI safety and decision theory (notably at institutions like the Machine Intelligence Research Institute or discussed in communities like LessWrong).
  *   **Program Equilibrium (Moshe Tennenholtz, 2004):** Proved that agents submitting programs that can read each other can sustain cooperation in one-shot Prisoner's Dilemmas.
  *   **FairBot / PrudentBot:** Specific algorithms designed to cooperate only with agents that can prove they will reciprocate, avoiding exploitation by simpler bots.

  ### 5. A Critical Security Warning
  While the *game theory* behind your observation is sound, the *implementation* you described contains a massive real-world risk that standard game theory often abstracts away: **Arbitrary Code Execution.**

  In the theoretical models, we assume the code is a pure mathematical object that only outputs "Cooperate" or "Defect." In reality, **running a script sent by a stranger is incredibly dangerous.**
  *   A malicious actor could send a script that says `Cooperate` but also contains hidden instructions to `Delete_Users_Files`, `Steal_Crypto_Wallets`, or `Open_Backdoor`.
  *   Even if the trading logic is honest, the code could be doing other things in the background.

  **Recommendation:** If you are actually doing this, ensure these scripts are running in a highly restricted **sandbox** (a virtual environment with no access to your personal data, network, or wallet) and that the code is audited or deterministic in a verifiable way. Do not run raw scripts from strangers on your main machine, regardless of how "honest" the trading logic appears.

  ### Summary
  You haven't found a group of unusually honest people; you have found a **mechanism that enforces honesty.**

  Transparency works here because it allows for **verifiable conditional cooperation**. By showing your code, you prove you *cannot* cheat without triggering a failure state. This removes the risk for the other party, making them willing to trade. The people hiding their code aren't seen as "strategic"; they are seen as "unverifiable risks," and rational traders avoid them.

  You have effectively digitized the handshake, but made the grip of the handshake mathematically unbreakable.
