          *   Permutation invariance (could the arrangement be swapped without qualitative difference?).
      *   **Tone:** Intellectual, rigorous, respectful, echoing Black's original style but updated with contemporary metaphysical terminology (haecceity, weak discernibility, structuralism).
      *   **Outcome:** No need for agreement, but arguments must be engaged.

  2.  **Character Conception:**
