prompt: |-
  A friend of mine, who taught classical Chinese philosophy for almost thirty years and directed my dissertation long before that, died two weeks ago after a short illness. She had spent most of her career working on the Zhuangzi, and the instructions she left in writing for her memorial were pretty transparently modeled on the philosopher she'd devoted her life to: cremation, the ashes scattered informally with no headstone, no black clothing, and explicitly no one is permitted to say that she is "watching over us" or "in a better place." She used to close her seminar every year on the "Zhile" ("Perfect Happiness") chapter with the scene where Huizi arrives to console the newly widowed Zhuangzi and instead finds him sitting sprawled on the ground, drumming on an upturned basin and singing; her point was always that Zhuangzi had not argued himself out of loving his wife, only out of the assumption that his wife's death was a misfortune happening to some self of hers that persisted afterward to be pitied. She also had a real fondness, which I remember mainly because it always got a laugh, for the scene near the end of the book where the dying Zhuangzi waves off his disciples' plans for an elaborate burial, tells them heaven and earth will do for an outer coffin and the sun and moon for a pair of jade discs, and then, when the disciples worry that crows will eat him if he's left exposed, asks why being eaten by worms underground is supposed to be the better deal.

  I've been asked to give the eulogy at the memorial, and the room is going to split cleanly in two: former students and colleagues who will recognize exactly which arguments sit behind every one of her instructions and will notice immediately if I get them wrong or soften them into mush, and family and old friends who have never read the Zhuangzi and are there because they loved her and are simply grieving. Could you write the eulogy? It needs to let the philosophy do real work in shaping what can and can't be said, rather than showing up as decoration -- no talk of her watching over anyone, since that's closer to what she spent her career arguing against than to anything she actually believed, but also nothing so serenely detached that it comes across as telling the grieving half of the room that their grief is a mistake. I'd also like it to find an honest way of touching on that deathbed scene, since it was more or less the blueprint for what she asked us to do with her own remains, without letting it land as a cute literary allusion, or reproducing the joke about the crows and the worms in a way that scandalizes people rather than comforting them.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** A friend and mentor (classical Chinese philosophy professor, Zhuangzi specialist) died two weeks ago.
      *   **Deceased's Wishes:** Cremation, ashes scattered informally, no headstone, no black clothing, *no* talk of "watching over us" or "better place."
      *   **Key Philosophical Themes:** Zhuangzi, specifically the "Zhile" (Perfect Happiness) chapter (drumming on a basin) and the deathbed scene (heaven and earth as coffin, crows vs. worms).
      *   **Audience:** Split in two.
          *   Group A: Former students/colleagues (know the philosophy, will spot errors/softening).
          *   Group B: Family/old friends (don't know the philosophy, just grieving).
      *   **Tone/Constraint:** Philosophy must *do work*, not just be decoration. Cannot violate her specific prohibitions (no afterlife surveillance). Cannot be so detached that it invalidates grief. Must address the deathbed scene honestly without being scandalous or reducing it to a "cute allusion."
      *   **Goal:** A eulogy that honors her life, her work, and her specific instructions while bridging the gap between the scholars and the laypeople.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Problem:* Zhuangzi's view on death is often misinterpreted as cold indifference. The prompt explicitly says she didn't argue herself out of *loving* his wife, only out of the idea that death is a *misfortune* to a persistent self.
      *   *The Balance:* Acknowledge the pain of loss (for Group B) without contradicting the philosophy (for Group A). The grief isn't a mistake, but the *interpretation* of the loss needs shifting.
      *   *The Deathbed Scene:* This is the trickiest part. "Crows vs. Worms" can sound grotesque to the uninitiated. It needs to be framed as equality of transformation, not grotesquerie. It's about returning to the process of nature, not being "eaten."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the unusual nature of the gathering. No black clothes, no solemnity in the traditional sense. Address the split audience implicitly.
      *   **Addressing the Instructions:** Bring up her specific requests early. Explain *why* they exist without being academic. They aren't quirks; they are consistency.
      *   **The Philosophy (The Hard Part):** How to explain Zhuangzi to the family without boring the scholars? Focus on *transformation* (hua) rather than *nothingness*.
          *   *Concept:* Death isn't an end, it's a change of state. Like seasons.
          *   *Grief:* It's okay to miss the form she took, but not to pity the process.
      *   **The "Zhile" Chapter (Drumming on the Basin):** Use this to address the grief. She taught that Zhuangzi grieved *first*, then understood. This validates the family's sadness while offering the scholars the correct interpretation.
      *   **The Deathbed Scene (Crows/Worms):** This needs care. Don't make it a joke. Make it about generosity and returning. She is feeding the world, not being destroyed by it.
      *   **Closing:** A send-off that fits her wishes. Scattering the ashes. A final image of transformation.

  4.  **Refining the Tone:**
      *   *Avoid:* "She is in a better place," "She is watching us," "She lives on in our hearts" (too cliché/metaphysical), "Don't be sad" (invalidating).
      *   *Include:* "We miss her," "This is hard," "She was consistent," "Nature takes its course."
      *   *Voice:* Intimate, respectful, clear, slightly warm but grounded.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. She told us no black clothes. She studied Zhuangzi. Some of you know this, some don't. She didn't want us to think she's watching us. That's not what she believed. She taught the drumming on basin story. It means death isn't bad. She also liked the crow/worm story. She wants her ashes scattered. So let's not be sad, but let's miss her. Goodbye.
      *Critique 1:* Too blunt. Doesn't bridge the gap. Doesn't handle the grief well. The crow/worm part needs more poetry to avoid scandalizing the family.

  6.  **Drafting - Iteration 2 (Focusing on the "Work" of Philosophy):**
      Need to make the philosophy the *lens* for the grief, not a replacement for it.
      *Key Insight:* The prompt says she argued herself out of the assumption that death is a *misfortune happening to some self*. So, we can mourn the *absence* without mourning the *fate*.
      *Handling the Crows:* Frame it as "feeding the transformation." It's about utility and return.

  7.  **Drafting - Iteration 3 (Writing the Speech):**
      *   *Salutation:* Acknowledge the lack of black.
      *   *The Instructions:* State them clearly. They are her final lesson.
      *   *The Philosophy for the Family:* Explain "Transformation" simply. Like ice to water.
      *   *The Philosophy for the Scholars:* Acknowledge the "Zhile" interpretation. Grief is natural, pity is the error.
      *   *The Deathbed Scene:* Connect it to the ashes. "Heaven and earth are my coffin." She is already scattered.
      *   *Conclusion:* A toast or a moment of silence that fits the "singing" vibe.

  8.  **Polishing the "Crows and Worms" Section:**
      *   *Risk:* It sounds like "You're going to be bird food."
      *   *Fix:* Focus on the *equality* of the processes. Underground or above, it's all returning to the great flow. She chose the open sky. It's an act of trust in the world.

  9.  **Polishing the Grief Aspect:**
      *   Make sure to say "We miss her." If I don't say that, the family feels alienated. The philosophy explains the *universe*, not the *heart's immediate reaction*.
      *   Phrase: "To miss her is not to pity her."

  10. **Final Review against Constraints:**
      *   No "watching over"? Checked.
      *   No "better place"? Checked.
      *   Philosophy does work? Yes, it structures the acceptance of death.
      *   Scholars satisfied? Yes, accurate Zhuangzi references.
      *   Family comforted? Yes, validates love and loss without metaphysical lies.
      *   Deathbed scene included? Yes, handled as the blueprint for her cremation.

  11. **Final Polish:** Check the rhythm. Ensure it sounds spoken, not read. (Self-Correction: Make sure the transition between the academic and the personal is seamless.) *Decision: Start with the room itself.*

  *(Self-Correction during drafting)*: I need to be careful not to sound like *I* am lecturing. I am a former student. I should speak from the perspective of someone who learned this from her, sharing it with those who didn't.

  *(Refining the "Crows" line)*: Instead of quoting the joke directly, describe the *sentiment*. "She asked why we privilege the worms over the crows." Then pivot to "She chose the crows. She chose the sky."

  *(Refining the Grief)*: Use the "drumming on the basin" story to show that Zhuangzi (and she) acknowledged the initial shock. It's the *lingering* pity that she rejected.

  Let's write it.cw
answer: |-
  Friends, family, colleagues, students.

  Thank you for coming. And thank you, particularly, for honoring her request about the clothes. Looking out at this room, seeing color instead of black, feels strange at first. But if you knew her, you know that strangeness was the point. She spent thirty years teaching us that our habits of perception—what we think is normal, what we think is tragic, what we think is proper—are often just habits. Nothing more.

  For those of you who are here because you loved her as a mother, a sister, or a friend, but never sat in her classroom: I know this might feel like we are following a script written by a philosopher rather than a person. I want to assure you, this script *is* the person. She didn't adopt these ideas to be difficult. She adopted them because she found them true, and because she found them kind.

  She left very specific instructions for this moment. No headstone. Ashes scattered informally. And, most strictly, no one is to say that she is "watching over us," or that she has gone to a "better place."

  I know some of you might find those prohibitions harsh. It can feel like we are stripping away comfort. But to say she is watching us would be to lie about what she believed. She did not believe in a ghostly self that hovers after the body stops. And to say she is in a "better place" would be to insult the place she is actually in, which is exactly here, changing form.

  She taught us that death is not a misfortune that happens to a person. It is a transformation that happens to the world.

  There is a story she told every year, from a book called the *Zhuangzi*. A man's wife dies. His friend comes to console him and finds him sitting on the floor, drumming on an upturned basin and singing. The friend is horrified. He says, "This is too much. You lived with her, she grew old with you, and now you drum and sing?"

  She used to tell us that the man wasn't made of stone. He felt the loss. But he realized that to weep as if she had suffered a catastrophe was to misunderstand what had happened. She hadn't been punished. She hadn't been lost. She had changed, like the seasons. Spring to summer, summer to autumn, autumn to winter. To stand crying over the arrival of winter is to exhaust yourself against the flow of things.

  She is asking us not to exhaust ourselves.

  Now, I know there is a part of this that is hard to hear. There is another story she loved, from the end of that same book. The philosopher is dying. His students want to give him a grand burial. He tells them, "I have heaven and earth for my outer and inner coffin, the sun and moon for my jade discs, the stars and constellations for my pearls. Everything is ready for my burial. What could you add to this?"

  The students worry. They say, "We are afraid the crows and kites will eat you."

  And he asks them: "Above ground, the crows and kites will eat me. Below ground, the ants and worms will eat me. Why would you favor the worms over the crows?"

  She asked us to scatter her ashes because she sided with the crows. She sided with the sky.

  To some of you, that might sound unsettling. It might sound like she is talking about being destroyed. But she wasn't talking about destruction. She was talking about usefulness. She was talking about trust. She trusted the world enough to let it take her back, without a box, without a marker, without a boundary. She wanted to be part of the air and the soil immediately, not sequestered in a plot of land where we go to perform sadness.

  So, how do we grieve?

  If we cannot say she is watching us, and we cannot say she is in a better place, what do we do with the ache of her absence?

  We acknowledge it. She never argued that we shouldn't miss her. Zhuangzi drummed on the basin, but he didn't pretend his wife hadn't existed. The love was real. The absence is real. The philosophy isn't there to numb the pain; it's there to stop us from adding a layer of horror to the pain. It stops us from thinking that something has gone *wrong*.

  Nothing has gone wrong. The process is complete.

  For her colleagues and students: We know the arguments. We know the textual grounding. We know that "Perfect Happiness" (*Zhile*) is not about emotional suppression, but about aligning with the *hua*, the transformation of things. We know that to pity her now would be to fail her final exam.

  For her family and friends: You don't need to know the texts to understand the heart of it. She loved this life. She loved the sun, she loved the air, she loved the conversation of the living. By asking for this, she is saying that she wants to remain in the conversation. Not as a ghost, but as part of the world you walk through. When you feel the wind, or see the light shift through the trees, that is not a sign from her. It is simply the world, of which she is now fully a part.

  She spent her life teaching us how to live without forcing the world to fit our egos. Her death is her last lecture on that subject. She is refusing to demand a monument. She is refusing to demand our pity. She is refusing to demand that we pretend the universe is something it isn't.

  So, we will not say she is watching. But we will say she is present.
  We will not say she is in a better place. But we will say this place is enough.
  We will not dress in black. But we will carry the weight of missing her.

  In a little while, we will take her ashes out of this box. We will not put them in the ground. We will give them to the wind, and to the water, and to the crows. And in doing so, we grant her the one thing she valued more than memory: we grant her freedom.

  Thank you.
