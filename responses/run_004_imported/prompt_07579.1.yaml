answer: |-
  This is a fascinating project, and your friend's warning is astute. Capturing Hobbes without reducing him to a caricature of "cold logic" requires understanding *why* he thought logic yielded truth.

  However, there is a critical historical correction I must offer before you draft the scene, as it fundamentally changes how Hobbes would speak about his mathematics.

  ### The Historical Reality: Hobbes was (in)famously wrong
  Your working understanding is that Hobbes had a "track record of demonstrated mathematical success." **Historically, the opposite is true.**

  By the Restoration (1660s), Hobbes was notorious in London intellectual circles not for his mathematical successes, but for his stubborn insistence on solutions that the mathematical community had universally rejected. Specifically, he spent decades claiming to have solved the classical problem of **"Squaring the Circle"** (constructing a square with the exact same area as a given circle using only a compass and straightedge).

  He published his "solution" in *De Corpore* (1655). It was almost immediately debunked by John Wallis, the Savilian Professor of Geometry at Oxford and a founding member of the Royal Society. Wallis and Hobbes engaged in a public, vitriolic feud that lasted until Hobbes's death in 1679. The Royal Society's refusal to admit him was partly due to his age and politics, but largely because the leading members (like Wallis, Boyle, and Hooke) viewed his mathematical claims as the ravings of a dogmatic old man who refused to accept error.

  **Why this is good for your novel:**
  This does not weaken your scene; it strengthens it. If Hobbes stands at that dinner table and cites his own geometric work as "settled proof," the skeptical natural philosophers (likely Royal Society affiliates) would exchange knowing glances. It highlights his **stubbornness** and his **isolation**. He isn't defending a universally acknowledged triumph; he is defending a castle he built that everyone else says is falling down. This fits your description of him "smarting over the Royal Society's refusal."

  ### The Actual Grounds of His Confidence
  To avoid the "cardboard rationalist" trap, you need to understand that Hobbes's confidence didn't come from *empirical success* (i.e., "I solved many problems, therefore I am right"). It came from an **epistemological claim about causality.**

  Hobbes argued that geometry is certain not because geometers are smart, but because **we create the objects we study.**
  *   **Natural Philosophy (Science):** We study the natural world (created by God). We can only observe effects and guess at causes. Therefore, physics can never be truly certain, only probable.
  *   **Geometry & Civil Philosophy:** We define the lines, circles, and contracts. We construct them. Because we are the *cause* of the figure (or the Commonwealth), we can have absolute knowledge of its properties.

  For Hobbes, certainty comes from **construction**, not observation.

  ### Specific Geometric References for the Scene
  Given the above, here are three ways Hobbes might gesture toward geometry at your dinner table.

  #### 1. The "Squaring of the Circle" (The Stubborn Choice)
  This is the most dramatic option. Hobbes genuinely believed he had solved this. If he cites this, it shows his brilliance and his delusion simultaneously.
  *   **The Context:** In *De Corpore*, Hobbes claimed to have found a geometric construction that squared the circle.
  *   **How he frames it:** He wouldn't say, "Wallis disagrees." He would say, "I have demonstrated the equality of the sector and the square."
  *   **The Reaction:** Your skeptical philosophers would likely stifle smiles. It underscores that Hobbes values his own reasoning over their consensus.
  *   **Sample Line:** *"You look to your telescopes and your air-pumps for truth, gentlemen, as if nature were a book you could read without error. I tell you, I have squared the circle. Not by measurement, which is fallible, but by generation. I constructed the cause. Where is the error in that? There is none. Yet you deny me."*

  #### 2. The First Principles of Euclid (The Methodological Choice)
  If you want Hobbes to sound more authoritative and less embattled, have him reference the *method* of Euclid rather than his own discoveries.
  *   **The Context:** Hobbes reportedly discovered Euclid by accident in a gentleman's library, opening *Elements* to Proposition 47 (Pythagorean theorem). He was captivated by the chain of demonstration.
  *   **How he frames it:** Focus on the **definitions**. For Hobbes, if you define "Line" and "Motion" correctly, the rest follows inevitably.
  *   **The Reaction:** The philosophers might agree with the method but dispute its application to human nature.
  *   **Sample Line:** *"Open Euclid. What is a line? The trace of a moving point. We know it because we make it. So it is with the Commonwealth. It is not a mushroom sprung from the earth; it is an artifact. We define the motion of men, we construct the Sovereign, and the rest follows as night follows day. It is geometry by another name."*

  #### 3. The "Duplication of the Cube" (The Technical Choice)
  Like squaring the circle, this was a classical problem Hobbes claimed to solve.
  *   **The Context:** Constructing a cube with double the volume of a given cube.
  *   **How he frames it:** It serves as another example of his belief that he had mastered the "Science of Consequences."
  *   **Sample Line:** *"I have shown you how to double the cube. The Academy cries 'false,' but they cannot find the flaw in the reasoning, only in their own inability to see the generation of the magnitude."*

  ### Advice for the Dialogue: Avoiding "Cardboard Rationalism"
  To satisfy your friend's warning, ensure Hobbes doesn't sound like a modern logician. He shouldn't talk about "data" or "hypotheses." He should talk about **Motion** and **Cause.**

  1.  **Focus on "Generation":** Hobbes was a materialist. He believed everything was matter in motion. Geometry isn't abstract shapes; it's the record of a pen moving. Politics isn't ethics; it's the channeling of human motion (passion) to avoid the collision of war.
  2.  **Dismiss Empiricism:** The Royal Society (Boyle, Hooke) believed in experimentation. Hobbes hated this. He thought experiments were just "stories" that could be faked. True knowledge comes from the mind reasoning from definitions.
      *   *Hobbesian line:* *"You pump the air and watch the mercury rise. You call this knowledge? It is mere history. You record what happened once. I tell you what **must** happen, by the necessity of the definitions."*
  3.  **The Tone of Injury:** He should sound like a man who has seen the Truth and is surrounded by children playing with toys. His rationality is fueled by anger and pride.

  ### Recommendation for the Scene
  I recommend having him reference **the Squaring of the Circle**, but frame it through his philosophy of **Generation/Construction**.

  This allows the other characters to be skeptical (knowing Wallis debunked it) while allowing Hobbes to remain internally consistent (he knows he is right because he constructed the proof). It perfectly captures the tragedy of the elderly Hobbes: a genius of political theory whose later years were consumed by a mathematical error he could not concede, mirroring his fear of the chaos that comes when men refuse to submit to a single, defined authority.

  **Drafting Prompt:**
  Have him trace a shape on the table with a knife or finger.
  *"I draw a line. I know its length because I willed the motion. I draw a circle. I know its center because I planted the point. Now, you tell me the Commonwealth is messy, that men are unpredictable. I say you are looking at the wood and missing the architecture. If we define the Sovereign as we define the Center, the rest is... calculation."*
