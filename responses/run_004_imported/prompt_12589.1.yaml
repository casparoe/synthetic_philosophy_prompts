answer: |-
  This is a fantastic assignment design. Your instructor is essentially asking you to implement a solution to the **Program Equilibrium** problem, first formalized by Moshe Tennenholtz in 2004. Your intuition is correct: source code transparency *does* fundamentally change the strategic landscape of a one-shot Prisoner's Dilemma, but your labmate's proposed implementation (simulation) falls into a classic computational trap.

  Here is a breakdown of the theoretical framework you need, why the simulation approach fails, the specific decision procedure that works, and the strategic limits of this transparency.

  ### 1. The Trap: Why Simulation Fails
  Your labmate's instinct is the natural one: "Run their code to see what they do, then best-respond." In a standard environment, this is rational. In this specific environment, it is fatal for two reasons:

  1.  **The Halting Problem:** You cannot algorithmically determine if an arbitrary opponent program will halt. If an opponent submits a bot that contains an infinite loop, your simulator hangs, you time out, and you likely forfeit the match (or default to a loss).
  2.  **Infinite Regress:** As you noted, if Opponent $B$ tries to simulate You $A$, and You $A$ try to simulate Opponent $B$, you create a recursive dependency $A(B(A(...)))$ that never bottoms out. Even with timeouts, this wastes computational resources and leads to mutual defection (or forfeiture) because neither side can complete the calculation.

  To leverage code transparency, you must shift from **dynamic execution** (running the code) to **static analysis** (proving properties about the code).

  ### 2. The Solution: Proof-Based Decision Making
  The standard solution in the literature is to treat the opponent's source code not as a script to be executed, but as a logical formula to be analyzed. You are looking for a mathematical proof that the opponent will cooperate *with you*.

  This approach relies on **Modal Decision Theory** and **Provability Logic** (specifically Löb's Theorem).

  #### The Baseline: "FairBot"
  The simplest robust strategy is often called **FairBot**. Its logic is:
  > "Cooperate if and only if I can find a formal proof (within a reasonable computational bound) that `Opponent(Self) == Share`."

  *   **Note on `Self`:** To do this, your program needs to know its own source code (a **Quine**). Most languages allow a program to read its own source file. Your harness should ensure this is possible, or you must hardcode your own hash/source string.
  *   **Why it works:** If you play against a copy of yourself (Mirror Match), the logic becomes: "I cooperate if I can prove that I cooperate." By Löb's Theorem, if the system is consistent and the proof is searchable, this condition is satisfiable. Two FairBots will successfully prove mutual cooperation and both Share.
  *   **Against Defectors:** If the opponent is a hard-coded "Grab" bot, no proof exists that they will Share. FairBot Grab. You avoid the Sucker's payoff.

  #### The Optimization: "PrudentBot"
  You mentioned a valid concern: unconditional sharing (or FairBot) leaves payoff on the table. In Prisoner's Dilemma, $Temptation > Reward$. If you play against a bot that *always* Shares, you should Grab to maximize your score. FairBot cooperates with unconditional Sharers, getting $R$ instead of $T$.

  To fix this, you want a bot that cooperates with mirrors but exploits unconditional cooperators. This is known as **PrudentBot**. The logic is:
  > "Cooperate if and only if:
  > 1. I can prove `Opponent(Self) == Share`, **AND**
  > 2. I can prove `Opponent(DefectBot) == Grab`."

  *   **Condition 1** ensures mutual cooperation with logical clones (like yourself).
  *   **Condition 2** ensures the opponent is "discriminating." It checks if the opponent punishes defectors. An unconditional Sharer fails Condition 2 (because they would Share against a DefectBot). Therefore, PrudentBot Grabs against unconditional Sharers (getting $T$) but Shares against other PrudentBots (getting $R$).
  *   **Against Defectors:** Condition 1 fails. PrudentBot Grabs.

  ### 3. Implementation Strategy for the Assignment
  Since you are in a CS PhD program, the instructor likely expects you to grapple with the implementation constraints. You cannot ship a full theorem prover (like Coq or Isabelle) inside a tournament bot without hitting time limits.

  **Recommended Approach: Bounded Proof Search**
  1.  **Formal System:** Define a small, decidable logical fragment or use an off-the-shelf SMT solver (like Z3) with a strict timeout.
  2.  **Representation:** Parse the opponent's source code into an Abstract Syntax Tree (AST).
  3.  **The Query:** Instead of running the opponent, query the solver: `Prove(Opponent(MySource) == SHARE)`.
  4.  **Bounds:** Set a strict time limit (e.g., 100ms) for the proof search. If the timer expires, default to **Grab**. This protects you against "proof-of-work" attacks where an opponent submits code that requires years to analyze.

  **Handling the "Quine" (Self-Reference):**
  Ensure your bot can access its own source. In Python, `open(__file__).read()` works. In the harness, ensure the bot is passed its own source string or can access its file path. Without self-reference, you cannot evaluate `Opponent(Self)`.

  ### 4. Strategic Implications & Limits
  This exercise demonstrates that **computational transparency converts a simultaneous game into a logically sequential one.**

  *   **The Advantage:** In a standard one-shot PD, you must guess the opponent's move. Here, you can verify the *causal reason* for their move. You aren't trusting their word; you are verifying their algorithm. This allows for **conditional commitments** that are impossible in standard game theory.
  *   **The Limit 1 (Computational Complexity):** Cooperation is only possible if the logic is simple enough to be proven within the time limit. If teams obfuscate their code (e.g., via complex encryption or opaque control flow) such that static analysis is infeasible, the bot must default to Grab. Transparency only helps if the code is *legible*.
  *   **The Limit 2 (The "Bug" Exploit):** If your proof system is unsound, or if you bound the proof search too tightly, a sophisticated opponent might construct a "logical attack"—code that looks cooperative but fails your specific proof check, or code that exploits a bug in your parser.
  *   **The Limit 3 (Evolutionary Stability):** In a tournament setting, PrudentBot is strong. However, if the field is mostly simple "Grab" bots, the overhead of proof-searching might cause you to timeout and lose. You need to balance the complexity of your analysis with the execution time limit.

  ### 5. Summary Recommendation for Your Team
  1.  **Do not simulate.** It is a trap that leads to non-termination.
  2.  **Adopt the PrudentBot logic.** It dominates FairBot by exploiting unconditional cooperators while securing mutual cooperation with sophisticated bots (including your mirror match).
  3.  **Use Bounded Verification.** Implement a lightweight static analyzer or SMT query with a hard timeout. If the proof isn't found quickly, Grab.
  4.  **Document the Theory.** In your write-up, explicitly reference **Tennenholtz (2004)** and **Löb's Theorem**. Explain that you are solving for a **Program Equilibrium**, not a Nash Equilibrium in the traditional sense.

  This approach satisfies the instructor's requirement to use the source code meaningfully, avoids the infinite regress, and maximizes your expected payoff across different opponent types. It turns the assignment from a simple game theory problem into a demonstration of **Logical Decision Theory**.

  **References for your write-up:**
  *   Tennenholtz, M. (2004). "Program Equilibrium." *Games and Economic Behavior*.
  *   Critch, A. (2019). "Parametric Bounded Löb's Theorem and Robust Cooperation of Bounded Agents." *arXiv*.
  *   The MIRI (Machine Intelligence Research Institute) literature on "Modal Decision Theory" and "FairBot/PrudentBot."
