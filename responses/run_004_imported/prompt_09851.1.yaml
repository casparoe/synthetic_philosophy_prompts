          *   Jamie: Skeptical. Is this just moving the goalposts?

      *   **Exchange 5: The PAP Defender's Counter to the Buffer.**
          *   Jamie: Attacks the buffer. If the buffer guarantees the outcome, the initial triggering of the buffer is the only AP. Is *that* morally significant? If yes, PAP stands. If no, why is the final action responsible?
