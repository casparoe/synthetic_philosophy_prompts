          *   Show how Supervenience makes $M$ and $P$ non-separable.
          *   Explain why an intervention on $M$ is "fat-handed" (hits $P$ too).
          *   Show that if $P$ is in the model, $M$ is screened off. If $P$ is not, the model is mis-specified relative to physical closure.
      *   **Section 4: Parallel Cases (Special Sciences):** Address the user's point about genes/interest rates.
          *   Distinguish *nomological* supervenience (mental/physical) from *contingent* aggregation (economics/biology).
          *   Argue that in biology/economics, the lower level isn't *metaphysically necessitated* in the same way, or we simply ignore it for pragmatic reasons, not metaphysical ones.
      *   **Section 5: Conclusion:** Reiterate that while interventionism works for *prediction* and *control* (pragmatic), it fails to secure *ontological* causal status for $M$ distinct from $P$ in the face of Kim's argument.

  4.  **Drafting - Tone and Style:**
