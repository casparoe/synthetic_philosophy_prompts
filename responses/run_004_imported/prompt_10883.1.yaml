      *   **Addressing the User:** Speak directly to their experience ("As you know from the lab...").
      *   **Key Philosophers to Reference:** James Woodward (Interventionism), Jaegwon Kim (Exclusion), Michael Baumgartner (The critique of interventionism), possibly Lei Zhong or Christian List.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe argue that mental states don't exist.
