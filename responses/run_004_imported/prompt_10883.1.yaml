      *   **Section 2: The Strongest Rescue Attempt (Realization Insensitivity):** Present the argument the user instinctively made. $M$ is robust across different $P$ bases. Cite authors like Campbell or Woodward's own later attempts.
      *   **Section 3: The Deflationary Critique (Baumgartner's Challenge):** This is the core.
