          *   Cannot be the Doomsday Argument.
          *   Cannot be the Sleeping Beauty problem.
          *   Must involve two rival hypotheses implying different numbers of observers within a specified reference class.
          *   Must walk through the credences for SSA and SIA.
          *   Must pinpoint exactly where/why they part ways.
          *   Must analyze the effect of narrowing/broadening the reference class.
          *   Must state a personal verdict on which is more defensible in this specific example.
          *   Must name the strongest unresolved objection to that verdict.
      *   **Context:** The user is writing a piece on cosmological selection effects and needs a pedagogical tool for readers before diving into the heavy cosmology.

  2.  **Deconstruct SSA vs. SIA:**
      *   **SSA (Self-Sampling Assumption):** "Reason as if you are a random sample from the set of all observers in your reference class." (Focuses on *where* you are in the distribution).
      *   **SIA (Self-Indication Assumption):** "Reason as if you are a random sample from the set of all *possible* observers, weighted by the probability of their existence." (Focuses on *that* you exist at all; favors hypotheses with more observers).
      *   **Key Divergence:** SIA penalizes hypotheses with fewer observers simply because there are fewer "slots" for you to occupy. SSA treats the existence of the observers as given (conditional on the hypothesis) and asks about your indexical location within them.

  3.  **Brainstorming Scenarios:**
