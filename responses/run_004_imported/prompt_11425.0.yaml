          *   Hypothesis H1: The company runs 1 shift with 10 agents.
          *   Hypothesis H2: The company runs 1 shift with 1000 agents.
          *   You are an agent. You don't know which shift size it is.
          *   *Problem:* This feels too much like "I exist, therefore H2 is likely." That *is* SIA. I need a scenario where the *evidence* is indexical.

      *Let's try a scenario involving identification numbers or specific locations.*
      *   **Scenario:** The "Secure Facility Badge."
      *   **Setup:** You wake up in a secure facility with no memory of how you got there. You find a badge in your pocket.
      *   **Hypotheses:**
