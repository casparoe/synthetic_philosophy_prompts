prompt: |-
  I have been reporting on anthropic reasoning for a piece on cosmological selection effects, and every account I encounter illustrates the divergence between the self-sampling assumption (SSA) and the self-indication assumption (SIA) using Nick Bostrom's "presumptuous philosopher." Before turning to the cosmology, I want a simpler, mundane analogy to walk readers through the underlying logic. Please devise a new scenario -- not a repackaging of that thought experiment, the Doomsday argument, or the Sleeping Beauty problem -- in which two rival hypotheses imply different numbers of observers within a specified reference class. Walk through the credences SSA and SIA would each assign, pinpoint exactly where and why they part ways, and note whether that divergence survives if the reference class is drawn more narrowly or more broadly. Finally, state which verdict strikes you as more defensible in your own example, and name the strongest unresolved objection that its defenders face.
