answer: |-
  **Title:** The Metaphysical Cost of Blockage: Why the Dilemma Defense Resurfaces in Sophisticated Frankfurt Cases

  **Introduction**

  The Principle of Alternative Possibilities (PAP)—the thesis that an agent is morally responsible for an action only if she could have done otherwise—has long been a cornerstone of debates regarding free will. Harry Frankfurt's seminal 1969 argument sought to sever the link between moral responsibility and alternative possibilities by constructing cases where an agent acts on her own, yet could not have done otherwise due to the presence of a counterfactual intervener. If successful, Frankfurt cases (FCs) would undermine incompatibilist arguments that rely on PAP to show that determinism precludes moral responsibility. However, the efficacy of FCs depends on their coherence in an indeterministic world, for it is there that the debate over PAP is most urgent.

  The "Dilemma Defense," articulated by David Widerker and Carl Ginet, challenged the coherence of classic FCs in indeterministic settings, arguing that they either presuppose determinism or fail to eliminate alternative possibilities. In response, philosophers like John Martin Fischer, Derk Pereboom, and Alfred Mele developed "blockage cases," which eliminate the need for prior predictive signs by physically blocking alternative neural pathways. This essay reconstructs the original Dilemma Defense and explains the blockage strategy. However, it ultimately argues that blockage cases fail to rescue the Frankfurt strategy. While they successfully evade the *epistemic* horn of the original dilemma, they succumb to a deeper *metaphysical* dilemma: to truly eliminate alternative possibilities in an indeterministic world, the blockage mechanism must deterministically guarantee the outcome, which in turn compromises the agent's sourcehood and undermines the very intuition of responsibility the case relies upon.

  **The Dilemma Defense Reconstructed**

  To understand the stakes, one must recognize that Frankfurt's target is primarily the incompatibilist (specifically the libertarian), who holds that moral responsibility requires both indeterminism and alternative possibilities. Frankfurt aims to show that responsibility requires indeterminism (perhaps) but *not* alternative possibilities. For an FC to work against the libertarian, the scenario must be compatible with indeterminism.

  In the classic case, Jones deliberates and chooses to vote for Candidate A. Black, a neurosurgeon, wants Jones to vote for A. Black monitors Jones's brain and stands ready to intervene if Jones shows signs of choosing B. Jones chooses A on his own; Black does not intervene. Frankfurt argues Jones is responsible, yet could not have chosen B (because Black would have forced him).

  Widerker and Ginet argue that this setup is incoherent in an indeterministic world. For Black to know *when* to intervene, he must detect a "prior sign" (e.g., a neural blip) that reliably indicates Jones is about to choose B. This generates a dilemma:

  1.  **The Deterministic Horn:** If the prior sign is causally sufficient for the choice of B, then the choice is determined. If the choice is determined, the case presupposes determinism. This begs the question against the libertarian, who already grants that if determinism is true, PAP might be false (or that responsibility is impossible). The case fails to show that *indeterministic* agents can be responsible without AP.
  2.  **The Indeterministic Horn:** If the prior sign is *not* causally sufficient (because the world is indeterministic), then the sign does not guarantee the choice. Jones could exhibit the sign and still choose A. If Jones can choose A despite the sign, he retains the ability to do otherwise *before* Black intervenes. Thus, AP exists, and the case fails to provide a counterexample to PAP.

  The force of this defense is that it renders FCs question-begging. They only work in deterministic worlds, where they are unnecessary to refute the libertarian, or they fail to eliminate AP in indeterministic worlds, where they are needed.

  **The Blockage Strategy**

  Proponents of the Frankfurt strategy responded by constructing cases that eliminate the need for prediction and prior signs. In "blockage cases," the counterfactual intervener does not wait for a sign; rather, the alternative possibilities are blocked *ex ante*.

  Consider a variation developed by Mele and Robb. Jones's decision is the product of an indeterministic deliberative process. However, Black has installed a device that blocks all neural pathways leading to any decision other than A. The pathway to A remains open. Jones deliberates and chooses A via the open pathway. Black's device does not intervene in the actual sequence; it merely renders the alternative sequences physically inaccessible.

  Because there is no reliance on a prior sign to predict the choice, the Dilemma Defense ostensibly loses its grip. There is no need to ask if the sign determines the choice, because there is no sign. The alternative possibility is removed not by prediction, but by physical impossibility. Fischer argues that this preserves the "actual sequence" of events: Jones's choice is caused by his own reasons and deliberation, exactly as it would be if Black were absent. The presence of Black is causally inert in the actual sequence, yet it ensures that Jones could not have done otherwise. Thus, the blockage strategy claims to isolate moral responsibility from alternative possibilities without presupposing determinism.

  **The Resurfacing Dilemma: Sourcehood and Causal Identity**

  Despite their sophistication, blockage cases do not escape the spirit of the Dilemma Defense; they merely displace it from an epistemic problem (prediction) to a metaphysical one (causation and sourcehood). The core issue is whether the blockage mechanism can eliminate alternative possibilities in an indeterministic world without altering the causal status of the agent's action in a way that undermines responsibility.

  To evaluate this, we must confront the following dilemma regarding the blockage mechanism itself:

  1.  **The Blockage is Indeterministic:** If the mechanism blocking the alternative pathways operates indeterministically (to match the indeterministic nature of Jones's deliberation), then there is a non-zero probability that the blockage fails. If the blockage can fail, Jones retains the possibility of choosing B. AP remains, and the Frankfurt counterexample fails.
  2.  **The Blockage is Deterministic:** To ensure Jones *truly* cannot do otherwise, the blockage mechanism must operate deterministically. It must causally guarantee that the B-pathways are closed.

  It is the second horn that proves fatal. If the blockage is deterministic, it becomes a deterministic cause within the causal history of the action, even if it does not "fire" in the sense of forcing the choice. Why? Because in an indeterministic world, for an alternative to be *truly* impossible, the actual sequence must be causally necessitated by the conjunction of the agent's psychology and the blockage constraints.

  This leads to the "Sourcehood Objection." The intuition that Jones is morally responsible in a Frankfurt case rests on the claim that he acts "on his own." In blockage cases, however, the fact that Jones succeeds in choosing A is not solely due to his indeterministic deliberation; it is partly due to the deterministic structure of the environment (the blockage) that ruled out failure. If the world is genuinely indeterministic, Jones's deliberation *could* have resulted in B. The only reason it didn't is that the blockage made B impossible.

  This creates a tension regarding the identity of the action. In the counterfactual scenario (where Jones wavers), Black's mechanism *forces* the choice. In the actual scenario (where Jones chooses on his own), the blockage *constrains* the choice. For the Frankfurt argument to work, the action in the actual sequence must be relevantly identical to the action in a world without Black. But if the blockage is deterministic, the causal history of the action includes a deterministic constraint that is external to the agent.

  Critics like Robert Kane and Kadri Vihvelin argue that this external constraint compromises "ultimate responsibility." If the agent's success in doing the right thing is guaranteed by a deterministic external mechanism, the agent is not the *ultimate source* of the action in the robust sense required by incompatibilists. The blockage case succeeds in removing AP only by importing a deterministic element into the causal history of the action. But if that deterministic element is present, the incompatibilist is justified in claiming that the agent lacks the control required for responsibility—not because of the lack of AP, but because of the lack of *sourcehood*.

  Therefore, the dilemma resurfaces: Either the blockage fails to eliminate AP (if it is indeterministic), or it eliminates AP only by introducing a deterministic causal factor that undermines the agent's status as the ultimate source of the action (if it is deterministic). In the latter case, the intuition that Jones is responsible becomes unstable. We may feel Jones is responsible because he *felt* free, but metaphysically, his action was the only physically possible outcome given the external constraints. This looks suspiciously like the "Deterministic Horn" of the original Dilemma Defense, merely hidden within the architecture of the blockage rather than the prediction sign.

  **Verdict**

  Do blockage cases succeed in rescuing the Frankfurt strategy? The answer is **no**. While they successfully demonstrate that one can construct a logically consistent story where an agent lacks AP and acts without direct intervention, they fail to vindicate the philosophical conclusion Frankfurt intended.

  Frankfurt's goal was to show that AP is irrelevant to moral responsibility. However, blockage cases show only that AP can be removed by external constraints. They do not show that an agent can be responsible in an indeterministic world where the *agent herself* lacks the power to do otherwise. By relying on a deterministic blockage to eliminate AP, these cases tacitly admit that in a purely indeterministic setting (without the blockage), AP would exist. Consequently, the absence of AP in the blockage case is an artifact of the experimental setup (the intervener), not a feature of the agent's freedom.

  Furthermore, the introduction of a deterministic blockage into an otherwise indeterministic deliberative process creates a hybrid metaphysics that incompatibilists are right to reject. If the action is truly the agent's own in the libertarian sense, it must be that the agent could have failed to choose A. If the blockage ensures she cannot fail, the "could have done otherwise" condition is violated, but so is the "agent as ultimate source" condition. The responsibility intuition in Frankfurt cases relies on the agent being the source; the blockage ensures the lack of AP. But in doing so, the blockage usurps the role of the "guarantor" of the action.

  Thus, a version of the original dilemma resurfaces. The blockage cases avoid the epistemic problem of prediction, but they cannot avoid the metaphysical problem of causal sufficiency. To kill alternative possibilities, they must determine the outcome. If they determine the outcome, they threaten the agent's sourcehood. If they preserve sourcehood (by leaving the process indeterministic), they fail to kill alternative possibilities robustly.

  **Conclusion**

  The evolution from classic Frankfurt cases to blockage cases represents a significant technical achievement in the philosophy of action, successfully neutralizing the epistemic objections raised by Widerker and Ginet. However, this technical success comes at a metaphysical cost. Blockage cases do not prove that alternative possibilities are irrelevant to moral responsibility; rather, they prove that alternative possibilities can be removed by external deterministic constraints. But in removing them this way, they compromise the very agential control that grounds responsibility. The Dilemma Defense, therefore, remains resilient. It teaches us that one cannot excise alternative possibilities from an indeterministic world without also excising the indeterminism that libertarians claim is essential for freedom. Consequently, the Principle of Alternative Possibilities, perhaps refined as a principle of "robust sourcehood," retains its status as a necessary condition for moral responsibility in the indeterministic worlds where the debate matters most. Frankfurt's strategy, even in its blockage form, fails to sever the link between freedom and the power to do otherwise.
