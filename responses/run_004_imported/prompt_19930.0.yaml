answer: |-
  **Title:** The Resilience of Alternative Possibilities: Why Blockage Cases Fail to Rescue the Frankfurt Strategy

  **Introduction**

  The Principle of Alternative Possibilities (PAP)—the thesis that an agent is morally responsible for an action only if she could have done otherwise—has long served as a cornerstone for incompatibilist theories of free will. Harry Frankfurt's seminal 1969 argument sought to dismantle this principle by constructing cases where an agent appears morally responsible despite lacking the ability to do otherwise, due to the presence of a counterfactual intervener. However, the efficacy of Frankfurt-style cases (FCs) against libertarian accounts of free will was severely challenged by the "Dilemma Defense," articulated by David Widerker and Carl Ginet. They argued that classic FCs presuppose determinism, thereby begging the question against the libertarian. In response, philosophers such as John Martin Fischer, Derk Pereboom, and Alfred Mele have developed sophisticated "blockage" cases designed to eliminate alternative possibilities without relying on prior deterministic signs. This essay reconstructs the Dilemma Defense, analyzes the blockage strategy, and argues that these sophisticated cases ultimately fail to rescue the Frankfurt strategy. A refined version of the original dilemma resurfaces in the form of a tension between causal guarantee and sourcehood: if the blockage mechanism is robust enough to eliminate alternative possibilities in an indeterministic world, it compromises the agent's status as the unique source of the action, thereby undermining responsibility on grounds independent of PAP.

  **The Dilemma Defense**

  To understand the force of the blockage response, one must first grasp the severity of the Dilemma Defense. Classic Frankfurt cases rely on a counterfactual intervener (Black) who monitors the agent (Jones) and stands ready to force a specific decision should Jones show signs of choosing otherwise. For Black to know *when* to intervene, he must rely on some prior sign or indication of Jones's impending choice. Widerker and Ginet argue that this setup generates a destructive dilemma for the incompatibilist who wishes to use FCs to refute PAP.

  The first horn of the dilemma posits that the prior sign is causally sufficient for the ensuing decision. If the sign necessitates the choice, then the decision is determined prior to the agent's volition. In this scenario, the Frankfurt case presupposes determinism. Since libertarians deny that moral responsibility is compatible with determinism, a case that assumes determinism cannot be used to prove that responsibility is compatible with the *absence* of alternative possibilities in an indeterministic world. It simply begs the question.

  The second horn posits that the prior sign is not causally sufficient. In an indeterministic world, it is possible for the sign to occur without the decision following. If this is the case, then at the moment the sign appears, Jones could still choose otherwise. Consequently, Jones retains the alternative possibility that PAP deems necessary. If Jones retains this possibility, the case fails to demonstrate that responsibility exists without alternative possibilities. Thus, the classic Frankfurt case either assumes determinism (begging the question) or fails to eliminate alternative possibilities (failing to refute PAP).

  **The Blockage Strategy**

  Proponents of the Frankfurt strategy have responded by constructing "blockage" cases, which attempt to sever the link between the intervener's mechanism and any prior deterministic sign. The core innovation is to conceive of the intervener not as a monitor who waits for a signal, but as a barrier that physically or psychologically blocks all alternative pathways to action while leaving the actual pathway open.

  Derk Pereboom's "Tax Evasion" cases and the Mele-Robb indeterministic model are paradigmatic here. In Mele and Robb's formulation, two causal processes operate in parallel: one stemming from the agent's own indeterministic deliberation, and another "backup" process installed by a manipulator. The backup process is designed to issue in the same decision at the exact same time if the agent's process fails. Crucially, the backup process is "blocked" from issuing the decision unless the agent's process falters. In the actual sequence, the agent's process succeeds, and the backup process remains inert.

  Fischer argues that this sidesteps the Dilemma Defense because there is no prior sign that determines the choice. The agent's decision is the result of an indeterministic process that is genuinely her own. Yet, because the backup process would have guaranteed the outcome had the agent's process wavered, the agent could not have done otherwise. The alternative possibilities are "finked" or blocked; they are not available in the relevant sense, yet the actual sequence remains untouched by manipulation. This is intended to show that even the libertarian must admit responsibility in the absence of APs, provided the actual sequence is of the right kind.

  **The Resurfacing Dilemma: Causal Redundancy and Sourcehood**

  While blockage cases are technically superior to classic Frankfurt examples, they do not escape the underlying logical tension identified by Widerker and Ginet. The dilemma resurfaces not as a problem of *prior signs*, but as a problem of *causal redundancy and sourcehood*. For the blockage case to work against the libertarian, it must operate in an indeterministic world (to avoid begging the question). However, in an indeterministic world, the relationship between the agent's process and the blocker's guarantee creates a new dilemma: either the blocker's presence renders the agent's causal contribution non-essential to the *necessity* of the outcome, or the indeterminism leaves a "flicker" of freedom that preserves PAP.

  Consider the Mele-Robb model. We are asked to imagine that the agent's indeterministic process and the blocker's deterministic process race to produce the same decision. In the actual sequence, the agent wins. The defender claims the agent is responsible because her process caused the action. However, we must ask: what ensures that alternative possibilities are truly eliminated? It is the presence of the blocker. But if the blocker is physically present and causally poised to intervene, is it truly causally inert?

  If the blocker is part of the total causal state of the world at the time of decision, and the blocker guarantees outcome *X*, then the total causal state necessitates *X*. Even if the agent's specific neural pathway is indeterministic, the *system as a whole* (agent plus blocker) is deterministic regarding the outcome. This reintroduces the first horn of the original dilemma: the scenario effectively presupposes a form of local determinism regarding the outcome. For the libertarian, moral responsibility requires that the agent be the *ultimate source* of the action. If the outcome is guaranteed by the background setup (the blocker), the agent is not the ultimate source of the *fact that X occurred*, even if she is the source of the *process leading to X*. The necessity of the action is grounded in the manipulator's setup, not the agent's will. This undermines responsibility for the same reason determinism does: the agent lacks control over the fact that the action was inevitable.

  Conversely, if we insist that the blocker is truly causally inert until the agent fails—that the blocker does not contribute to the causal sufficiency of the actual decision—we face the second horn. In an indeterministic world, there is a non-zero probability that the agent's process could have failed or diverged at the very last instant. If the agent's process is truly indeterministic, there is a possible world with the same past and laws where the agent chooses differently *just before* the blocker intervenes. In that world, the blocker intervenes. But if the agent could have chosen differently at that final instant, she had an alternative possibility, however fleeting. This is the "flicker of freedom" strategy. If this flicker exists, PAP is not refuted; it is merely restricted to robust alternatives. But for the libertarian, even a flicker of alternative possibility is often sufficient to ground the kind of control required for responsibility. By failing to fully extinguish the alternative possibility without introducing deterministic guarantee, the blockage case fails to create a scenario where the agent is responsible *despite* having no ability to do otherwise.

  Furthermore, there is a deeper metaphysical worry regarding the identity of the action. In blockage cases, the action is supposedly "overdetermined" in the counterfactual sense. But if the blocker guarantees the outcome, can we truly say the agent's indeterministic deliberation was the *cause* of the action in the responsibility-grounding sense? If the outcome was fixed by the blocker's presence, the agent's deliberation becomes causally redundant regarding the *occurrence* of the event. While compatibilists like Fischer are willing to accept responsibility in such cases (via semi-compatibilism), this concession is unavailable to the project of refuting PAP *against the libertarian*. The libertarian insists that responsibility requires the agent to determine the outcome. In a blockage case, the setup determines the outcome; the agent merely navigates a path that was the only one open. This is structurally indistinguishable from a deterministic world where the laws of nature fix the outcome. Thus, the blockage case either smuggles in determinism (violating the libertarian's conditions for responsibility) or leaves open a possibility of divergence (preserving PAP).

  **Verdict**

  The blockage cases developed by Fischer, Pereboom, and Mele do not succeed in rescuing the Frankfurt strategy against the Principle of Alternative Possibilities. While they successfully evade the specific technical objection regarding "prior signs," they fall victim to a more fundamental version of the same dilemma. The core issue is that one cannot simultaneously eliminate alternative possibilities in an indeterministic context and preserve the agent as the unique, ultimate source of the action.

  If the blockage mechanism is robust enough to ensure the agent could not have done otherwise, it renders the outcome inevitable given the total state of the world. This inevitability compromises the agent's sourcehood in a way that is functionally equivalent to determinism, thereby begging the question against the libertarian who ties responsibility to indeterministic sourcehood. If the mechanism is not robust enough to ensure inevitability without compromising sourcehood, then alternative possibilities remain, and PAP stands. Consequently, the Frankfurt strategy fails to demonstrate that moral responsibility is compatible with the total absence of alternative possibilities in the only contexts where that absence is controversial (i.e., indeterministic worlds). The Principle of Alternative Possibilities, perhaps refined to focus on the *source* of the alternatives rather than their mere existence, remains a necessary condition for moral responsibility. The blockage cases, therefore, do not refute PAP; they merely illuminate the inextricable link between having alternatives and being the ultimate source of one's actions.
