          *   *Nadia:* Stranger, community college decision theory instructor. Hard-nosed, pragmatic, uses Causal Decision Theory (CDT)/Straightforward Maximization. Won't drive Vera to town unless convinced Vera will pay her back voluntarily.
      *   **Core Conflict:** A philosophical argument about rationality, commitment, and trust.
          *   *Nadia's Stance:* Once in town, paying back is a sunk cost. A rational agent maximizes utility *at the moment of action*. Therefore, promising now doesn't bind you later.
          *   *Vera's Stance:* Constrained Maximization/Resolute Choice. Rationality involves adopting a disposition *beforehand*. Reneging later proves you never truly committed. It's not stubbornness; it's consistency of agency.
      *   **Specific Requirements:**
          *   Prose format (narration + dialogue), not script.
          *   Length: 1-2 pages.
          *   Nadia must challenge Vera's "I decided to" as rationalized stubbornness.
          *   Vera must answer without just name-dropping "Functional Decision Theory" (FDT) or "Updateless Decision Theory" (UDT).
          *   Address the paradox: Nadia's theory makes her want people to be irrational (by her definition) so she can trust them.
          *   Ending: Genuine standoff. No clear winner.

  2.  **Character Voices & Tone:**
      *   *Nadia:* Sharp, tired, cynical but intellectually rigorous. She's seen this movie before. She treats the truck cab like a classroom but with higher stakes.
      *   *Vera:* Intellectual but weary. She knows the theory but has lived the failure (dropping out). She's trying to prove her integrity is rational, not just moral.
      *   *Atmosphere:* Claustrophobic, humming engine, desert dark, the tension of the unpaid debt hanging over them.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting and the immediate tension. Vera identifies the paradox. Nadia acknowledges it but dismisses its practical value.
