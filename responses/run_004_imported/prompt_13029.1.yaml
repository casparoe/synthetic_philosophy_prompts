      *   **The Constrained Maximization Argument (Vera):** Vera counters. Rationality isn't just about the specific moment; it's about the type of agent you are. If you defect later, you were never the type of person who could get the ride.
      *   **The "Stubbornness" Objection (Nadia):** Nadia hits the weak point. Saying "I decided" is just a feeling. Feelings don't move money. Why is sticking to a past decision rational when it hurts you now?
      *   **The Response (Vera):** Vera needs to distinguish this from mere policy-worship. It's about *identity* and *predictability*. If you can't bind yourself, you can't cooperate.
      *   **The Paradox:** Nadia admits she *wants* Vera to be "irrational" (by CDT standards) because that's the only way to be trustworthy.
      *   **The Standoff:** They arrive (or near arrival). The money question remains unresolved until the end. No handshake, no clear resolution.

  4.  **Refining the Philosophy (Self-Correction during drafting):**
