answer: |-
  The diesel engine hummed a low, steady vibration through the floorboards, a physical bass note to the silence that had settled between them. Outside, the desert was a void, broken only by the twin cones of the truck's headlights chewing up the white line. Vera watched the mile markers slide past, feeling the weight of the envelope of cash in her jacket pocket. It was enough for the tow, plus gas. It was also enough to disappear.

  "Parfit's Hitchhiker," Vera said finally. She didn't look at Nadia. "That's what this is. You're the driver. I'm the hitchhiker. The town is the hospital."

  Nadia kept her eyes on the asphalt. Her hands were at ten and two, relaxed but immovable. "I know the thought experiment, Vera. I teach the undergrads who think it's a riddle. It's not a riddle. It's a ledger."

  "In the thought experiment," Vera said, "the driver can read minds. Or at least, read micro-expressions. If they think you'll lie, they leave you in the desert."

  "I don't read minds. I read incentives." Nadia shifted, the leather of her seat creaking. "Here's the causal chain. Right now, you want me to drive. So you promise. Once we hit the city limits, I have no leverage. I can't stranding you again. If you pay me then, you are down two hundred dollars and I am up two hundred. If you walk, you are up two hundred and I am down time and fuel. A rational agent maximizes utility at the point of action. In town, paying me is a loss. So a rational agent walks."

  "That's Straightforward Maximization," Vera said. "It assumes the decision in town is independent of the decision at the roadside."

  "It is independent. The past is sunk. You can't eat yesterday's dinner."

  "But you didn't pick up a straightforward maximizer," Vera said. She turned in the seat, the seatbelt digging into her collarbone. "If you had, you would have left me in the dust. You picked me up because you thought I was the kind of person who pays. That means you're betting I'm not a straightforward maximizer. You're betting I'm a constrained maximizer."

  Nadia snorted, a short, dry sound. "I'm betting you're tired and scared and want to get home. I'm not betting on your philosophy."

  "You're betting that my decision in town is logically correlated with my decision here. If I'm the type of person who decides to pay now, that type of person pays later. If I'm the type who decides now but plans to defect later, I'm a liar, and you wouldn't have stopped." Vera leaned forward. "The rational move isn't made at the ATM in town, Nadia. It was made at the roadside. I committed to a policy. To reopen the question now isn't cleverness. It's a failure of agency."

  "It's called updating on new information," Nadia countered. Her voice tightened, just a fraction. "The new information is: *I am safe.* The threat is gone. Why should I bind my future self to a promise made when I was vulnerable? That's not agency. That's stubbornness. You're arguing that I should hurt myself in the future just to prove a point to my past self."

  "It's not about proving a point. It's about being a node in a causal network that allows for cooperation." Vera tapped her chest. "If I defect in town, I prove that I am not the person you picked up. I prove that my promise was noise, not signal. But more than that—if everyone reasoned like you do, Nadia, no one would ever get a ride. Your theory of rationality requires that everyone else be irrational enough to keep their promises so that you can exploit them. You want the world full of fools who pay debts they don't have to."

  Nadia was quiet for a long stretch. The truck drifted slightly around a curve, correcting smoothly. "I want the world full of people who keep promises," she said. "I just don't call it rational when it costs them nothing to break them. Call it morality. Call it virtue. Don't call it decision theory."

  "Because it doesn't fit your math?"

  "Because the math describes the world, not how we wish it was." Nadia glanced at her, eyes reflecting the green glow of the dashboard. "You say you decided back there. Okay. But what stops you from deciding *again* when we see the bank lights? What stops you from saying, 'Actually, I'm maximizing now'?"

  "Because if I do that, I admit that my initial decision wasn't a decision. It was a prediction." Vera settled back, the adrenaline of the argument cooling into something harder. "You're asking me to treat my own will as a variable I can toggle based on convenience. But I can't. If I treat my commitment as optional, I never really had it. And if I never really had it, you shouldn't have picked me up. So if I walk away in town, I'm not just stiffing you. I'm proving you wrong for stopping. And I don't want to be the person who proves you right about everyone being a liar."

  "That's emotional," Nadia said. "You're dressing up pride as logic."

  "Maybe. Or maybe you're dressing up defection as clarity."

  The lights of the town appeared on the horizon, a smudge of orange against the black. The hum of the engine seemed to grow louder as the speed dropped. They were five minutes out. The silence returned, heavier than before, filled with the unspoken calculation of the next ten minutes.

  Nadia's hand rested on the gear shift. "You know, if you pay me, you're validating a system where I exploit your goodwill. If you don't, you validate my theory that everyone's a shark."

  "If I pay you," Vera said, watching the orange smudge grow into streetlamps, "I validate the idea that we can be the kind of people who don't leave each other in the dark."

  Nadia didn't answer. She signaled for the exit, the blinker ticking rhythmically in the sudden quiet. She pulled the truck to the curb in front of the all-night diner, the engine idling. She didn't lock the doors. She didn't hold out her hand. She just looked at Vera, waiting to see which version of rationality walked out of the cab.
