      *   *Check:* The Ending. It can't be "Vera pays and Nadia smiles." It needs to be ambiguous. Maybe they pull up to the ATM, and the conversation stops, leaving the action unwritten or hinted at.

  5.  **Drafting - Focusing on Sensory Details:**
