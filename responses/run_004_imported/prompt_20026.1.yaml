prompt: |-
  I'm on the board of my small condo association (all volunteer, nobody's a lawyer) and there's a situation I can't stop chewing on. One owner, call him Frank, filed a formal complaint against his neighbor for parties that blow way past our 11pm quiet-hours rule. Everyone in the building also knows Franks been illegally renting his spare room on Airbnb for two years, breaking a totally different rule the board's never enforced against him, and the neighbor he's complaining about is the one who reported Frank's Airbnb thing to the city last month, so this reeks of payback. Half the board wants to shelve Frank's complaint since he's such a hypocrite, the other half says the noise rule got broken regardless of who reported it or why. Its got me wondering whether being a hypocrite actually costs you the right to call someone else out, or if that's just a convenient way to dodge getting called out yourself. Could you write the memo I'd bring to Tuesday's meeting recommending what the board should actually do, with real reasons, and taking the "Frank's a hypocrite" argument seriously instead of just waving it away?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a small condo association (volunteer, non-lawyers).
      *   **Situation:** Owner "Frank" filed a noise complaint against a neighbor. Frank is illegally renting on Airbnb (unreported/unenforced by the board). The neighbor reported Frank's Airbnb to the city. Frank's noise complaint looks like retaliation.
      *   **Conflict:** Half the board wants to shelve Frank's complaint due to hypocrisy/retaliation. The other half says rules are rules.
      *   **Task:** Write a memo for the Tuesday board meeting recommending a course of action.
      *   **Key Requirement:** Take the "Frank's a hypocrite" argument seriously (don't just wave it away), but provide real reasons for the recommendation.
      *   **Tone:** Professional, objective, legally cautious (since they aren't lawyers), practical, and governance-focused.

  2.  **Determine the Core Legal/Governance Principles:**
      *   **Selective Enforcement:** This is the biggest risk. If the board enforces rules against one person but not another (especially if they know about the violation), they open themselves up to lawsuits. Ignoring Frank's Airbnb while punishing his neighbor for noise *might* be okay if they are different rules, but ignoring Frank's Airbnb entirely is a liability.
      *   **Retaliation:** Many state laws and governing documents protect owners' rights to report violations. Punishing Frank for filing a complaint because he's a "hypocrite" could be seen as retaliatory against his right to participate in governance.
      *   **Unclean Hands:** This is the legal doctrine the "hypocrite" argument relies on. However, in HOA/Condo law, this rarely absolves someone of liability for *current* violations.
      *   **Fiduciary Duty:** The board must act in the best interest of the association, which means consistent enforcement and minimizing legal risk.

  3.  **Evaluate the "Hypocrisy" Argument:**
      *   *Why it feels valid:* It's unfair that Frank breaks rules and then demands others follow them. It feels like abuse of the system.
      *   *Why it's dangerous:* If the board dismisses a valid noise complaint solely because Frank breaks a different rule, they are effectively saying "Rule X doesn't apply to Frank, so Rule Y doesn't apply to his neighbor." This creates a precedent that rules are optional based on moral standing.
      *   *The Middle Ground:* Acknowledge the frustration but separate the two issues. Frank's hypocrisy doesn't invalidate the noise, but it does highlight the board's failure on the Airbnb issue.

  4.  **Formulate the Recommendation:**
      *   **Action 1:** Investigate and process the noise complaint on its merits. (Don't shelve it).
      *   **Action 2:** Address the Airbnb violation separately and immediately. (Stop selective enforcement).
      *   **Action 3:** Establish a policy for retaliation/harassment if the noise complaint is found to be baseless, but don't assume it is yet.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the recommendation (Proceed with noise investigation, but also address Airbnb).
      *   **The Core Question:** Address the "hypocrisy" argument directly. Does it cost you the right to complain? Legally/Governance-wise: No.
      *   **Risk Analysis (The "Why"):**
          *   *Selective Enforcement:* The biggest legal threat.
          *   *Retaliation:* Protecting owner rights to report.
          *   *Fiduciary Duty:* Consistency.
      *   **Addressing the "Hypocrisy" Argument:** Validate the board's feelings. It *is* frustrating. But explain why acting on that frustration is dangerous.
      *   **The Airbnb Elephant:** Acknowledge the board's failure here. This needs to be fixed to restore credibility.
      *   **Recommended Action Plan:** Step-by-step instructions for the meeting.
      *   **Conclusion:** Reiterate the goal (fairness, risk mitigation).

  6.  **Refining the Tone:**
      *   Avoid legalese (since they aren't lawyers), but use correct concepts (selective enforcement, fiduciary duty).
      *   Be empathetic to the board's frustration with Frank.
      *   Be firm on the governance principles.
      *   *Self-Correction during drafting:* I initially thought about suggesting they fine Frank immediately. *Correction:* No, they need to follow due process. Just recommend opening a violation file for the Airbnb issue.
      *   *Self-Correction on the Noise:* Don't assume the noise happened. Recommend *investigating* it.

  7.  **Final Review against Constraints:**
      *   Did I take the hypocrisy argument seriously? Yes, by dedicating a section to "The Moral Intuition vs. Governance Reality."
      *   Is it practical for volunteers? Yes, clear steps.
      *   Is it safe? Yes, emphasizes consistency to avoid lawsuits.

  8.  **Final Polish:** Check for clarity and impact. (The resulting memo matches the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Condo Association Name]
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Violation Complaints and Enforcement Consistency

  ### Executive Summary

  We are currently facing two distinct violation issues: a noise complaint filed by Owner A ("Frank") against Owner B, and a known, unenforced short-term rental violation by Owner A. There is a strong sentiment on this Board that Owner A's hypocrisy should disqualify his complaint.

  This memo recommends that we **process the noise complaint on its merits** while simultaneously **opening a violation file for the short-term rental.** Dismissing the noise complaint based on Owner A's conduct exposes the Association to significant legal liability and undermines our fiduciary duty. However, ignoring the short-term rental any longer is no longer an option.

  ### The Core Question: Does Hypocrisy Forfeit Enforcement Rights?

  The argument before us is intuitive: *Is it fair for someone breaking the rules to demand others follow them?* Morally, many of us feel the answer is "no." It feels like an abuse of the system, especially given the timeline of events suggests retaliation.

  However, in community association governance, the answer is generally "no, hypocrisy does not forfeit rights." Here is why we must take that argument seriously, even if we dislike it:

  1.  **The "Unclean Hands" Doctrine is Weak Here:** While courts sometimes use the "unclean hands" doctrine to deny relief to a hypocritical plaintiff, this usually applies in litigation, not in administrative board hearings. Unless our Governing Documents specifically state that an owner in violation cannot file complaints, we do not have the authority to strip Owner A of that right.
  2.  **Retaliation Risks:** Most state condo acts and our own bylaws protect an owner's right to petition the board. If we shelve a complaint solely because the filer is also a violator, we risk a claim that we are retaliating against Owner A for exercising his rights.
  3.  **The Precedent of Selective Enforcement:** This is the highest risk. If we enforce the noise rule against Owner B but refuse to acknowledge Owner A's standing because he breaks the rental rule, we are effectively creating a tiered system of citizenship. If we are sued by Owner B later, their attorney will argue that the Board acts arbitrarily. If we are sued by Owner A, they will argue we denied them due process.

  ### The Real Danger: Selective Enforcement

  The "hypocrisy" argument is actually a distraction from the Board's larger liability: **We have known about a rental violation for two years and have not enforced it.**

  By focusing on Frank's character, we are inadvertently admitting to selective enforcement.
  *   **Scenario A (Shelving the complaint):** We look like we are punishing Frank for reporting the neighbor, or we look like we only enforce rules when it suits our personal feelings about an owner.
  *   **Scenario B (Enforcing noise, ignoring Airbnb):** We look like we are protecting Frank's rental income while punishing the neighbor. This is a classic selective enforcement lawsuit waiting to happen.

  The only defensible position is **Consistent Enforcement.** Rules must be applied equally, regardless of who is involved or their history.

  ### Recommended Action Plan

  To protect the Association and resolve this fairly, I recommend the Board take the following steps at Tuesday's meeting:

  **1. Separate the Issues**
  We must formally decouple the noise complaint from the rental violation. They are governed by different sections of our documents and carry different penalties. One does not cancel out the other.

  **2. Proceed with the Noise Investigation**
  We should not shelve the complaint. To do so would be arbitrary.
  *   **Action:** Notify the accused neighbor of the complaint per standard procedure.
  *   **Action:** Gather evidence (logs, witnesses, decibel readings if available).
  *   **Caveat:** If the investigation reveals the complaint was *maliciously false* (not just unproven, but fabricated), we can then explore fining Frank for harassment or abuse of process, but we must have proof first.

  **3. Address the Airbnb Violation Immediately**
  We cannot knowingly ignore a violation because it's inconvenient or because the violator is currently "useful" to us. Our failure to enforce the rental rule to date is a vulnerability.
  *   **Action:** Open a formal violation file for the short-term rental.
  *   **Action:** Issue a cure notice to Frank requiring him to cease the rental activity by a specific date.
  *   **Reasoning:** This neutralizes the "hypocrisy" argument. We are no longer ignoring his violation. We are enforcing all rules, against all owners, equally.

  **4. Document Everything**
  Given the animosity between these owners and the potential for retaliation claims, every communication must be in writing and strictly factual. We do not mention the Airbnb issue in correspondence regarding the noise, and vice versa.

  ### Conclusion

  It is frustrating to be manipulated by an owner who is not following the rules themselves. It feels like letting Frank win. But the Board's job is not to judge moral standing; it is to govern the community according to the documents.

  If we shelve the complaint because Frank is a hypocrite, we validate the idea that rules are optional based on who you are. If we enforce the noise rule but ignore the rental rule, we invite a lawsuit.

  The only path that protects our volunteers and the Association is to enforce both rules, against both owners, starting now.

  **Motion for Tuesday's Meeting:**
  *I move that the Board instructs management to proceed with the standard investigation process for the noise complaint filed by [Unit #], and simultaneously instructs management to issue a Notice of Violation regarding the short-term rental restriction to [Unit #] effective immediately.*
