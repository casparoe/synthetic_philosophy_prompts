answer: |-
  You have an excellent grasp of the 30,000-foot view, but you are right to sense that the "Hart won, Fuller lost, everyone went home" narrative is a bit too tidy. If you write your piece based solely on that summary, you'll have the orthodoxy right, but you might miss the most interesting tension for your "zombie laws" angle.

  Here is where you are flattening the picture, and why that matters for your reporting.

  ### 1. Hart didn't say judges' hands are *totally* tied.
  You wrote: *"If a rule was enacted through the proper channels, its binding, full stop."*

  This is the most common misconception about Legal Positivism. Hart argued that law and morality are *conceptually* separate (the "Separation Thesis"). He agreed that a statute could be legally valid but morally repugnant. However, he did **not** argue that a judge is morally obligated to enforce every valid law, nor that the law provides no room for moral reasoning.

  Hart acknowledged the "open texture" of language. Laws have a core of certainty and a penumbra of doubt. In the penumbra, judges *must* exercise discretion, and that discretion often involves social or moral aims. Furthermore, Hart distinguished between **validity** (is this law?) and **obligation** (must I obey this law?). A Hartian might say of a zombie sodomy statute: "Yes, it is technically valid law because it was passed correctly and never repealed. But because it is unjust, there is no moral obligation to obey it, and the state should exercise its discretion not to enforce it."

  **For your piece:** The Hartian view explains *why* the law is still on the books (validity is a technical status), but it doesn't necessarily demand it be enforced.

  ### 2. Fuller's "Inner Morality" isn't just "be nice."
  You summarized Fuller as arguing for an "inner morality of law" that sounds nice but lost. Fuller's argument was actually much more mechanical and functional than that.

  Fuller argued that for a system to count as "law" at all, it must be capable of guiding human conduct. To do that, it must meet eight procedural criteria (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy through time, and congruence between official action and declared rule).

  If a law fails these, it isn't just "bad law"; it fails to function *as law*.

  **For your piece:** This is your golden ticket. A "zombie law" is a perfect Fullerian violation. If a sodomy statute sits on the books for 20 years but is never enforced, or enforced only arbitrarily against specific people, it violates the principle of **congruence** and **constancy**. A Fullerian would argue that a zombie law creates a situation where citizens cannot guide their conduct by the rules. Therefore, it is legally defective *on its own terms*, not just morally defective. Fuller gives you a vocabulary to argue that zombie laws aren't just unjust; they are legally broken.

  ### 3. The "Victory" was pyrrhic.
  It is true that most Anglo-American legal scholars identify as positivists today. However, the version of positivism that won looks a lot different than Hart's 1958 version.

  *   **Inclusive Positivism:** Many modern positivists (like Jules Coleman) conceded to Fuller that morality *can* be incorporated into law if the legal system says so (e.g., a Constitution that bans "cruel and unusual punishment" forces judges to make moral judgments).
  *   **Dworkin:** Shortly after Hart-Fuller, Ronald Dworkin entered the chat and attacked *both* of them. He argued that law isn't just rules (Hart) or procedures (Fuller), but includes underlying principles of justice that judges must interpret.

  So, while Hart "won" the label war, the battlefield shifted. The debate isn't "Law vs. Morality"; it's "How much morality is required to interpret the law?"

  ### 4. Why this matters for "Zombie Laws"
  If you stick to the "Hart won" narrative, your article concludes: *"These laws are valid but unjust, and only the legislature can fix them."* That's a bit of a downer and legally deterministic.

  If you incorporate the nuance, your article can explore a more dynamic tension:
  *   **The Hartian Problem:** We keep these laws on the books because we treat legal validity as a historical fact (was it voted on?), not a living reality.
  *   **The Fullerian Critique:** By keeping unenforceable laws on the books, we undermine the Rule of Law itself. We create a gap between the "law in books" and the "law in action." This breeds cynicism and confusion, which Fuller warned was the death of a legal system.

  ### The Verdict
  You aren't wrong, but you are describing the **orthodoxy**, not the **ongoing friction**.

  *   **Refine your summary:** Hart established that validity and morality are separate questions, but he didn't prove they *should* be treated separately in practice.
  *   **The Hook:** Use Fuller to argue that "zombie laws" aren't just harmless relics. By failing to be enforced consistently, they violate the "inner morality" of the legal system, making the law less predictable and less legitimate, even if they remain technically "valid."

  That gives your piece a philosophical spine: The fight isn't just about cleaning up old statutes; it's about whether a law that doesn't function as a guide for conduct deserves to be called "law" at all. That is exactly why law professors are still teaching this debate 70 years later.
