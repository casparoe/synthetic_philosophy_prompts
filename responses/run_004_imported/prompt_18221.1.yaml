prompt: |-
  My sister — a philosopher whose dissertation is on the ethics of promising — is getting married next month, and she has asked me to give the toast, her reasoning being that since making difficult ideas legible to a general audience is my job, I ought to get the philosophy right rather than lean on sentiment. Her one rule: I am not allowed to say that the vows are "magic words" that bind the two of them together, since her own work argues against exactly that folk picture, in favor of something closer to Scanlon's account of why breaking a promise wrongs someone — by exploiting expectations you deliberately encouraged, not by defying some independent power the words themselves carry. Roughly half the guests will be her philosophy department, who will notice if I fake it; the other half is family who have never heard of Scanlon and just want three warm, funny minutes. Write the toast, about three minutes long: it should use a real, defensible answer to why promises bind as its emotional core rather than as decoration, and it needs to land for both halves of the room.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Sibling of the bride.
      *   **Occasion:** Wedding toast.
      *   **Audience:** 50% Philosophy Department (experts, specifically know the bride's work), 50% Family/General (non-experts, want warmth/humor).
      *   **Bride's Constraint:** Do *not* call vows "magic words." Do *not* treat promises as mystical binding forces.
      *   **Theoretical Framework:** Use T.M. Scanlon's account of promising (Principle F). Key idea: Promises bind because breaking them exploits expectations *you* deliberately encouraged. It's about the relationship and trust, not the words themselves.
      *   **Tone:** Warm, funny, intellectually honest (no fake philosophy), accessible (legible to non-philosophers).
      *   **Length:** About 3 minutes (roughly 400-500 words spoken at a moderate pace).

  2.  **Deconstruct Scanlon's Principle F (Simplified for a Toast):**
      *   *The Folk View:* Saying "I promise" casts a spell. The words have power.
      *   *The Scanlon View:* Saying "I promise" creates an expectation in another person. You intend for them to rely on you. If you break it, you betray that specific trust you invited. It's wrong because of what it does to the *other person*, not because it breaks a cosmic rule.
      *   *Application to Marriage:* Marriage isn't a spell that keeps you together. It's a deliberate act of inviting your partner to rely on you completely, and then choosing, every day, to honor that reliance.

  3.  **Drafting - Section by Section:**

      *   **Opening (The Hook):** Acknowledge the assignment. The sister gave a specific brief. This is funny because it's very "her."
      *   **The Constraint (The "Magic Words" Ban):** Address the elephant in the room. Most toasts say vows are magical. She says no. Why? Because she's a philosopher.
      *   **The Theory (The Core):** Explain Scanlon without using jargon like "Principle F." Use the concept of "invited reliance."
          *   *Drafting thought:* How to make this warm? Connect "invited reliance" to love. Love *is* letting someone rely on you.
      *   **The Application (The Couple):** Connect the theory to the Groom/Partner. He knows what he's signing up for. He knows the expectations he's encouraging.
      *   **The Closing (The Wish):** A wish for the future based on this view. Not "may the magic hold," but "may you continue to honor the trust."

  4.  **Refining the Tone (Balancing the Room):**
      *   *For the Philosophers:* Needs to accurately reflect Scanlonian contractualism. No metaphysical realism about promises.
      *   *For the Family:* Needs to sound like a brother/sister talking about love, not a lecture. Avoid "moral obligation" language; use "trust" and "care."
      *   *Humor:* Poke fun at the sister's precision. Poke fun at the density of the theory.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. My sister told me what to say. She says vows aren't magic. That's boring. Just kidding. She follows Scanlon. Promises are about expectations. You tell someone to trust you, then you break it, that's bad. So [Groom], don't break her trust. She encouraged you to trust her. Love is about not disappointing expectations you created. Cheers.

      *Critique 1:* Too dry. Too blunt. Needs more warmth and flow.

  6.  **Drafting - Attempt 2 (Adding Flesh and Warmth):**
      Hello. As you know, I'm the writer, and she's the philosopher. She gave me a style guide. Rule 1: No magic words. She hates the idea that saying "I do" casts a spell. She prefers Scanlon. Basically, a promise is wrong to break because you told someone to count on you. It's about the relationship. [Groom], she is counting on you. You encouraged that. So don't break it. It's actually more romantic because it's active. You choose to keep the promise.

      *Critique 2:* Better. But needs to be smoother. The transition from Scanlon to romance needs to be the emotional peak. The "why" needs to be clear for the family.

  7.  **Final Polish (Focusing on the "Legible" aspect):**
      *   Make the Scanlon explanation metaphorical. "Handing someone a map." "Inviting them to lean."
      *   Ensure the "Magic Words" prohibition is the joke that sets up the sincere point.
      *   End on a high emotional note that satisfies the "warmth" requirement.

  8.  **Writing the Toast (incorporating the above):**
      *   *Start:* Acknowledge the sister's specific instructions.
      *   *Middle:* Explain the "no magic" rule. Explain the "expectation" rule simply.
      *   *Turn:* Why this is actually *more* romantic. It's active, not passive.
      *   *End:* Toast to the active choice.

      *(Self-Correction during drafting)*: Make sure I don't accidentally imply the *words* do nothing. They communicate the intention. But the *binding force* is the relationship, not the utterance.
      *Scanlon nuance:* It's about the "assurance" given.
      *Family nuance:* "Assurance" = "Knowing you've got my back."

  9.  **Final Review against constraints:**
      *   3 minutes? (Word count check: ~450 words is usually 3 mins spoken slowly).
      *   No "magic words"? (Check).
      *   Scanlonian core? (Check - focus on induced expectations/reliance).
      *   Warm/Funny? (Check).

  10. **Final Polish:** (Produces the final output provided in the good response).
answer: |-
  Good evening. For those who don't know me, I'm the sibling. And for those who do know my sister, you know that when she asks for a favor, she comes with a style guide.

  She told me: "You make difficult ideas legible for a living. So, please get the ethics right." Her one rule was that I cannot stand here and say that the vows you two are about to exchange are "magic words." I am not allowed to suggest that saying "I promise" casts a spell that metaphysically binds your souls together.

  Apparently, that is philosophically naïve. And since half this room would heckle me for conceptual imprecision, I will defer to the expert.

  So, if the words aren't magic, why do they matter? Why does breaking a promise wrong someone?

  My sister's work argues that a promise binds us not because of the words themselves, but because of what those words *do* to the person listening. When you promise, you are deliberately inviting someone to rely on you. You are telling them, "You can build your expectations on this." To break that promise is to exploit the very trust you asked them to have. It's not that you broke a cosmic rule; it's that you let down the person who leaned on you because you told them it was safe to lean.

  And honestly? I think that is much more romantic than magic.

  Magic is passive. It happens *to* you. But this view—the view that promises are about sustained, deliberate reliability—means that marriage isn't a spell you cast once and forget. It is a daily, active choice to honor the expectations you have encouraged in another person.

  [Groom/Partner's Name], you know what you are signing up for. You are signing up to be the person she relies on. You are signing up to ensure that the expectations she has of you are never weapons used against her, but a foundation she can stand on.

  And [Sister's Name], you are promising to do the same. To create a space where his reliance on you is met with care, not exploitation.

  So, I am not going to toast to the "magic" of today. I am going to toast to the work. To the clarity of your communication. To the integrity of your expectations. And to the profound, unmagical, human courage it takes to look at someone and say, "You can count on me," and then spend a lifetime proving it true.

  To the bride and groom.
