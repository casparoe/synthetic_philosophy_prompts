answer: |-
  This is a classic debate in evolutionary biology, and your intuition is actually supported by a significant chunk of modern philosophy of biology. Your flatmate is right that the 1979 paper is often strawmanned, but you are right that the *application* of the "spandrel" label is often treated as a conversation-stopper rather than a research hypothesis.

  To rebuild your argument properly, you need to shift the ground from **"Are traits adaptations?"** (an empirical question) to **"How do we verify any evolutionary hypothesis?"** (a methodological question).

  Here is a structured defense of the position that the Spandrels critique does not bankrupt adaptationism, hitting your two specific requirements and utilizing the philosophical distinctions you mentioned.

  ### 1. The Epistemic Symmetry Thesis
  **Argument:** Identifying a trait as a spandrel (non-adaptive byproduct) requires the exact same evidentiary burden as identifying it as an adaptation. It is not an external check; it is an internal alternative hypothesis.

  Your flatmate used "that could just be a spandrel" as a rebuttal. But a spandrel is not a default state; it is a specific causal claim. To claim a trait is a byproduct, you must demonstrate:
  *   **Phylogenetic History:** That the trait arose in a lineage where it conferred no fitness advantage, or persisted despite a cost.
  *   **Developmental Coupling:** That the trait is inextricably linked to another trait that *is* selected for (e.g., the redness of blood is a byproduct of hemoglobin's oxygen-carrying capacity, not selected for color itself).
  *   **Absence of Design:** That the trait lacks the complex functional architecture characteristic of selected traits.

  **The Kicker:** How do you prove those three things? You use the **Comparative Method**. You look at related species, you model developmental pathways, and you analyze cost-benefit ratios. These are the *exact same tools* adaptationists use to test adaptive hypotheses.

  Therefore, the "Spandrel" critique cannot function as a theory-free external check on adaptationism. It is simply **Competing Hypothesis Testing**.
  *   **Hypothesis A:** Trait T was selected for Function F.
  *   **Hypothesis B:** Trait T is a byproduct of Trait S (which was selected for Function G).

  Both A and B require empirical validation. If your flatmate asserts B without evidence, she is guilty of the exact same "just-so storytelling" she accuses you of. She is telling a story about developmental constraints or historical contingency that is just as unverified as your story about adaptive utility.

  ### 2. The Vulnerability of Constraint Explanations
  **Argument:** Gould's favored alternatives (developmental constraints, historical contingency, architectural necessity) are often *more* vulnerable to the "just-so story" charge than adaptationist hypotheses.

  This is the Dennett point you remembered. In *Darwin's Dangerous Idea*, Dennett argues that Gould treats "constraints" as if they are free-floating laws of physics that limit selection. But often, constraints are themselves the product of past selection, or they are theoretical constructs that are difficult to measure.

  *   **Adaptationist claims are often positively testable:** You can measure current utility, reproductive success, or energy costs *now*. While this doesn't prove history, it provides tangible data points.
  *   **Constraint claims are often negatively testable:** To prove a trait is a constraint, you often have to prove that selection *could not* have acted. Proving a negative (that no possible adaptive pathway existed) is notoriously difficult.

  For example, if you argue "Human chin shape is a spandrel of jaw reduction," you have to model the developmental field of the jaw and show that a chin *must* result from that reduction. If that model is speculative, your "spandrel" explanation is a story.

  Gould mocked adaptationists for assuming every trait has a function. But there is an equal risk in assuming every trait is limited by a constraint. If you explain a lack of optimization by saying "developmental constraints prevented it," without independent evidence of that developmental constraint, you have told a **"just-so story about impossibility."** It is rhetorically safer (because it's harder to disprove), but methodologically it is just as speculative.

  ### 3. The Philosophical Cleanup: Empirical vs. Methodological Adaptationism
  **Argument:** The 1979 paper successfully attacks *Empirical Adaptationism*, but it fails to undermine *Methodological Adaptationism*.

  This is where Peter Godfrey-Smith's distinctions (and earlier work by Sober and Lloyd) save your position. You need to make this distinction clear to your flatmate:

  1.  **Empirical Adaptationism:** The claim that *most* traits in nature are optimal adaptations shaped by natural selection. (Gould & Lewontin successfully showed this is false; drift and byproducts exist).
  2.  **Methodological Adaptationism:** The research strategy of *testing* adaptive hypotheses as the default starting point because natural selection is the only known process that creates complex functional design.

  **Your Defense:**
  The "Spandrels" paper is a warning against *Empirical Adaptationism* (don't assume everything is adaptive). You are defending *Methodological Adaptationism* (start by testing for adaptation).

  Why is Methodological Adaptationism still valid even if Spandrels exist?
  *   **The Signal-to-Noise Ratio:** Complex functional organization (like the eye or the heart) is overwhelmingly likely to be the product of selection. Starting with a null hypothesis of "random byproduct" for complex traits is a poor heuristic because it ignores the one force known to create complexity.
  *   **The Burden of Proof:** Gould argued the burden of proof lies on the adaptationist. But as per point #1, the burden lies on *whoever makes the specific causal claim*. If the trait looks designed, the adaptationist hypothesis is the stronger prior. The "spandrel" hypothesis requires its own evidence.

  ### Summary for the Next Argument
  If you want to condense this for a follow-up conversation, here is the tightest version of your argument:

  1.  **"Spandrel" is a hypothesis, not a null.** You can't just label something a byproduct. You have to prove the developmental or phylogenetic linkage. That requires the same comparative data as an adaptive hypothesis.
  2.  **Constraints are speculative too.** Saying "selection couldn't act because of constraints" is often an unfalsifiable claim about developmental space. It's a story about why something *didn't* happen, which is harder to verify than a story about why it *did*.
  3.  **Heuristic value remains.** Even if not everything is an adaptation, assuming a trait *might* be one is the most productive way to discover what it actually does. If you assume it's a spandrel first, you stop looking for function. If you assume function and find none, *then* you have evidence for a spandrel.

  **The Closing Line:**
  "Gould was right that we shouldn't assume every trait is an adaptation. But he was wrong to imply that pointing out 'it could be a spandrel' is a scientific argument. It's just a counter-hypothesis. And counter-hypotheses need data just as much as adaptive stories do."
