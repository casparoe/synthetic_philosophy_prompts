prompt: |-
  So my flatmate (she's mid-PhD in evolutionary biology) and I had this argument last night that was basically about the Gould and Lewontin spandrels paper for like half an hour before either of us actually said that out loud. I kept floating adaptive explanations for random human behaviors and she kept shutting them down with some version of "that could just be a spandrel," like that alone was a full rebuttal. I pushed back that this is kind of a cheap move — you can't actually point at some trait and call it a non-adaptive byproduct without doing the same comparitive, hypothesis-driven reasoning that adaptationists do, so the critique isn't coming from some neutral, theory-free vantage point outside the programme it's attacking. She said I was flattening the actual 1979 paper into a strawman and that it was really about burden of proof and unfalsifiability, not a ban on adaptive stories. I also vaguely remember reading (Dennett, maybe, in Darwin's Dangerous Idea?) that Gould's own preferred alternatives — developmental constraints, historical contingency, that sort of thing — are just as unfalsifiable and story-shaped as the "just-so stories" he loved to mock, but I couldn't reconstruct the actual argument in the moment, which bugged me all night.

  Can you help me build this properly? I want a real argument, not just a gut feeling, for the position that the spandrels critique does NOT show the adaptationist research programme is methodologically bankrupt. At minimum I want it to hit two things: (1) that identifying something as a spandrel/byproduct in the first place already presupposes the same comparative reasoning distinctive of adaptationism, so it can't function as an external check on it, and (2) that Gould and Lewontin's own favored explanations are exactly as vulnerable to the just-so-story charge as the hypotheses they're targeting. If it's useful, feel free to bring in how later philosophy of biology — I'm thinking of how people like Godfrey-Smith split adaptationism into different kinds (empirical vs methodological, etc.) — helps or complicates the case, but I'd rather have a tight defense of this specific position than a broad survey of the whole debate.
