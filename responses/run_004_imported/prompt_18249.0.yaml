  3.  **Deconstruct Goal 2: The Symmetry of "Just-So Stories":**
      *   *The Core Point:* Gould mocked adaptationists for telling unfalsifiable stories. But are constraint/constraint stories falsifiable?
      *   *Adaptationist Story:* "X exists because it increased fitness via function Y." (Testable via current utility, cost-benefit, phylogeny).
      *   *Constraint Story:* "X exists because development/physics/history made Y impossible."
      *   *The Vulnerability:* How do you test "impossible"? Often, constraint explanations rely on theoretical models of developmental space that are hard to empirically verify. If an adaptationist says "It's for mating," and Gould says "No, it's a constraint," both are positing unobserved causal histories.
      *   *Dennett's Angle:* Dennett argued that Gould underestimated the power of natural selection to find solutions. Claiming something *couldn't* evolve adaptively requires knowing the landscape of possibilities, which is often speculative.
