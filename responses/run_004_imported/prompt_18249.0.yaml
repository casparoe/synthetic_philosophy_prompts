      *   *Section 2: The Symmetry of Storytelling (Goal 2).* Address Dennett's point. Constraint hypotheses are often negative claims ("Selection *couldn't* act"). Negative claims are hard to prove. Adaptation hypotheses are positive claims ("Selection *did* act"). Both can be speculative.
