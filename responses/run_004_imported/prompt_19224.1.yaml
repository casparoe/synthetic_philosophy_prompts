  "Judy Benjamin starts out certain she's equally likely to be in any of four regions: Red-HQ, Red-2nd-Company, Blue-HQ, Blue-2nd-Company, so each gets credence 1/4. She then receives a radio message -- 'if you're in Red territory, the odds are 3:1 that you're in the HQ area' -- and the radio cuts out before anything else is said. Using the minimum-relative-entropy solution to this problem, say what happens to her credence that she is in Red territory at all, and explain what van Fraassen took the example to be a problem for."

  and here's the answer that came back, worth 10 pts:

  "Even though the message says nothing that directly compares Red to Blue, minimizing relative entropy against the uniform prior subject to P(HQ | Red) = 3/4 actually pushes her credence in Red territory down, from 1/2 to around 0.47, with the credence in Blue rising to make up the difference. Maximum entropy and minimum cross-entropy updating are just two names for the same procedure, so it doesn't matter which one you compute with. Van Fraassen's point was that this is a problem for Jeffrey conditionalization: learning something that's purely about the breakdown within Red territory shouldn't move the odds of Red vs Blue at all, and the fact that it does shows Jeffrey's rule isn't invariant under this kind of irrelevant refinement of the evidence."

  can you grade this out of 10 and give me the specific comments that justify it, point by point, rather than just a vibe? a little rubric as JSON would be great too, its easier for me to paste into the spreadsheet I keep grades in.
