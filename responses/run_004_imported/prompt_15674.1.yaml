          *   *Independence:* High historical standing, but relies on axiomatic subjective utility.

      *   **Ergodicity Economics (Time-Average vs. Ensemble-Average):** Popularized by Ole Peters. Argues that EV is an ensemble average (many parallel universes), but we live in one timeline (time average). For multiplicative dynamics, time-average growth rate $\neq$ ensemble average. Maximizing time-average growth leads to Kelly.
