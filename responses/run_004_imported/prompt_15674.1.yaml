      *   **Long-Run Almost-Sure Dominance (Breiman's Theorem):** Over infinite time, a Kelly bettor will almost surely have more wealth than any other strategy that differs significantly.
          *   *Critique:* "In the long run we are all dead." It doesn't help with finite horizons or utility of consumption along the path.
          *   *Independence:* Strong asymptotic result, but doesn't necessarily justify Kelly for finite $N$ without additional assumptions.

      *   **Information Theory (Channel Capacity):** Kelly's original 1956 paper. Betting is like transmitting information over a noisy channel. Maximizing growth rate = maximizing channel capacity.
          *   *Critique:* Very elegant, but mostly an analogy or specific application (gambling with inside info). Does it generalize to general investment?
          *   *Independence:* Provides a structural analogy, but ultimately maps to the same math as log utility.

      *   **Ruin Avoidance / Survival Heuristic:** Don't go broke. Kelly minimizes time to reach goals while avoiding ruin (in continuous time).
          *   *Critique:* Kelly *can* lead to large drawdowns (50%+). It doesn't strictly prevent ruin if leverage is misused or distribution has fat tails. It's often a constraint rather than an objective.
          *   *Independence:* Weak justification on its own. Fractional Kelly is usually better for ruin avoidance.

      *   **Geometric Rationality (Scott Aaronson / Critch / etc.):** A newer framework suggesting geometric averaging is the correct way to aggregate beliefs or utilities across agents or time, independent of ergodicity.
          *   *Critique:* Still developing. Often reduces to log utility in the limit.
