      *   *Core Thesis Argument:* Sin is selfishness/egotism (rejecting community). Faith is accepting community with God and others. Ethics is based on this community.
      *   *Mature Rawls:* *A Theory of Justice* (1971), *Political Liberalism* (1993). Focus on justice as fairness, overlapping consensus, public reason. Religion is a "comprehensive doctrine."
      *   *The "Rupture" vs. "Continuity" Debate:* This is a known topic in Rawls scholarship (e.g., work by Eric Gregory, Joshua Cohen, Robert Adams).
