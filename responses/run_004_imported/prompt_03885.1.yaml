  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the fascination. It's a great angle for a piece. Validate the user's premise (yes, the thesis exists and is theological).
      *   **The Early Rawls (Theological):**
          *   Focus on *Community*. Sin = separation/egotism.
          *   Ethics is grounded in a specific metaphysical/religious truth (Neo-orthodoxy).
          *   Universal claim: This is how things *are*.
      *   **The Mature Rawls (Political):**
