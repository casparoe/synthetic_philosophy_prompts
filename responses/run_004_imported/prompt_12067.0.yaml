  6.  **Self-Correction/Edge Case Check:**
      *   *Did the treatment affect channel?* No, channel is acquisition source. That happens before onboarding. So Channel is a pre-treatment covariate.
      *   *In a randomized trial, is Channel a confounder?* Technically, randomization breaks the link between Treatment and Pre-treatment covariates *in expectation*. But in a finite sample, imbalance exists. If imbalance exists, Channel acts like a confounder in that specific dataset. Stratification (or regression adjustment) recovers the unbiased estimate.
      *   *So in THIS specific case (Channel), the segments are likely more accurate for the underlying efficacy, BUT the aggregate is the actual business impact for this specific cohort mix.*
      *   *Wait, important distinction:* If we roll out to *everyone*, the future mix might differ. The "True Effect" of the *product change* is best estimated by the weighted average of the segments (adjusted for imbalance), not the raw aggregate of the imbalanced sample.
