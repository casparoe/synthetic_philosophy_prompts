      *   *Make sure to distinguish between:*
          1.  Bias due to sample imbalance (fixable by stratification/weighting).
          2.  Effect Modification (the feature actually works differently for different people).
      *   *The prompt says:* "Retention was higher... within every single channel." This suggests Effect Modification is *not* the driver (sign is consistent). The reversal is driven by weights (Sample Imbalance).
      *   *Conclusion for this specific case:* The analyst is likely right about *this* variable (Channel), but wrong about the *rule*. The friend is right about the *rule*.

  7.  **Final Structure:**
      *   **Verdict:** Your friend is right; the analyst is applying a heuristic as a law.
      *   **The "Why":** Pre-treatment vs. Post-treatment variables.
      *   **The Framework:** 3 Questions to ask before slicing.
