answer: |-
  You are asking a sharp question, but your summary rests on a significant misunderstanding of both Hume and Scanlon. In fact, the core innovation of both philosophers (and much of the modern literature on promising) is precisely to **distinguish** the wrong of breaking a promise from the wrong of lying.

  If your friend was sincere when she made the promise, she did not lie. But according to both Hume and Scanlon, she can still have wronged you. Your intuition that you were betrayed is not an outlier that philosophy cannot underwrite; rather, it is supported by the central mechanism these philosophers use to explain why promises bind us.

  Here is where your reading flattens the accounts, and how a more nuanced reading vindicates your feeling of being wronged.

  ### 1. Hume: Promises are Conventions, Not Mental States
  You interpret Hume as suggesting a promise is a "sincere declaration of a present intention." Actually, Hume argues the exact opposite.

  In the *Treatise* (Book 3, Part 2, Section 5), Hume explicitly attacks the idea that a promise is merely a resolution or a declaration of a current mental state. He argues that if a promise were just a declaration of intention, it would be redundant (why declare what is already evident?) and it would not create a new obligation.

  For Hume, a promise is a **social convention**. It is a performative act that only works because society has agreed to attach a specific moral sanction to it. When your friend promised to co-sign, she didn't just report her mental state; she invoked a social rule that says, "You can rely on this statement as if it were a guarantee."

  *   **The Wrong:** For Hume, the wrongness of breaking a promise isn't that you lied about your past intention; it's that you violated a convention necessary for social coordination. By backing out, she undermined the utility of the convention itself and frustrated the **reliance** you were entitled to place in that convention.
  *   **Application:** Even if she was sincere at T1, at T2 she violated the convention of promising. She invited you to rely on her (you looked for apartments based on this), and then she withdrew that support. For Hume, the harm is to the *reliance* and the *social fabric*, not to the truth-value of her earlier statement.

  ### 2. Scanlon: Principle F vs. Principle L
  Your reading of Scanlon is also a common misconception. In *What We Owe to Each Other*, Scanlon explicitly distinguishes between the wrong of lying and the wrong of breaking a promise. He does this by formulating two distinct principles:

  *   **Principle L (Loss):** This covers lying/deception. It forbids leading someone to believe something you know is false.
  *   **Principle F (Fidelity):** This covers promising. It states that if you intentionally lead someone to expect you will do X, and you know they want assurance of this, you must do X (unless they release you).

  Scanlon argues that Principle F creates a distinct obligation. The wrong is not that you misrepresented your mind at the moment of promising; the wrong is that you **violated the assurance you gave.**

  *   **The Wrong:** When you promise, you give someone a specific kind of control over your future actions. You transfer a piece of your autonomy to them to secure their planning. Breaking the promise is a violation of that specific relationship of trust, distinct from truth-telling.
  *   **Application:** Under Scanlon's view, your friend wronged you because she induced an expectation (that she would co-sign), knowing you needed that assurance to secure the lease. By changing her mind without your consent, she violated Principle F. The fact that her intention changed sincerely is irrelevant to the violation of the assurance she gave.

  ### 3. The "Reliance" Account
  Beyond Hume and Scanlon, the broader literature on promising (including legal theory and moral philosophy like that of Seana Shiffrin or T.M. Scanlon's contemporaries) generally centers on **reliance**.

  The moral force of a promise comes from the fact that it allows the promisee to plan their life.
  1.  **Invitation to Rely:** Your friend didn't just say, "I hope to do this." She said, "I will do this," inviting you to incur costs (time, search effort, lease negotiations) based on her participation.
  2.  **Foreseeable Harm:** She knew (or should have known) that if she backed out, you would be left scrambling.
  3.  **The Wrong:** The wrong is imposing a cost on you that you would not have incurred had she not promised.

  If promises were only about sincerity, you could never plan anything collaboratively. You would always have to hedge against the possibility that your partner's "sincere intention" might change. The point of promising is to *remove* that hedge. By backing out, she forced you back into a position of uncertainty that the promise was supposed to eliminate.

  ### 4. Is there a defense for your friend?
  Philosophy does allow for promises to be broken, but usually under specific conditions that your friend may not have met:
  *   **Duress or Impossibility:** If she literally could not afford it, the obligation might be voided. But she found a *cheaper* studio; this suggests a preference shift, not impossibility.
  *   **Release:** She should have asked to be released from the promise as soon as her mind changed, acknowledging the burden this placed on you.
  *   **Mitigation:** Did she help you find a replacement? Did she compensate you for the stress or cost?

  If she simply said, "I changed my mind, good luck," she treated the promise as a statement of current weather rather than a commitment of future action.

  ### Conclusion
  You are not flattening the literature; you are encountering a "Reductionist" interpretation (promising = truth-telling) that most major philosophers, including Hume and Scanlon, explicitly reject.

  *   **Hume** says the wrong is violating the social convention of reliance.
  *   **Scanlon** says the wrong is violating the principle of fidelity (assurance), which is distinct from lying.
  *   **Your Intuition** is correct: You were wronged not because she lied, but because she invited your reliance and then withdrew it, imposing a cost on you that the promise was meant to prevent.

  Your sense of betrayal is philosophically robust. The obligation of a promise binds the future, not just the present moment of speaking. By treating her change of mind as morally neutral because it was sincere, she is effectively denying the existence of the obligation itself.
