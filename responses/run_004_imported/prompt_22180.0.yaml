answer: |-
  The radio on the counter hummed with static, the kind of low white noise that filled the kitchen when the rest of the house was asleep. It was November, 1994. Outside, the wind was rattling the windowpane, but inside, Arthur sat at the small Formica table with a green ledger open in front of him.

  On the page, columns of numbers marched down in neat, blue-ink handwriting. *Date. Track. Horse. Odds. Stake. Result. Bankroll.*

  Arthur wasn't a rich man. He drove a ten-year-old sedan and wore coats until the elbows shone. But in the world of the ledger, he was a king of a very small, very quiet castle. He had a system. Everyone who bet on the horses had a system, usually one based on hunches, names, or the color of a jockey's silks. Arthur's system was based on survival.

  He took a sip of cold coffee and looked at the tip sheet for tomorrow's card at Aqueduct. His eyes stopped on the sixth race. A maiden special weight. Seven furlongs on the dirt.

  There was a horse named *Iron Clad*. The morning line odds were 5-to-1. But Arthur had done the work. He'd watched the workouts, checked the track bias, analyzed the pedigree for distance suitability. He knew something the public didn't. In his estimation, *Iron Clad* wasn't a 5-to-1 shot. He was a 2-to-1 shot. Maybe better.

  Arthur picked up his pen. He looked at the total at the bottom of the right-hand column: his current bankroll. It was a number that represented a lot of things. It was the emergency fund. It was the Christmas bonuses. It was the safety net that let him sleep without worrying about the boiler breaking or the car transmission slipping.

  If he bet according to the ghosts—the theoretical average of a million different Arthurs living in a million parallel universes—he should bet big. In that imaginary crowd of a million Arthurs, most would bet heavy on *Iron Clad*. Many would bet it all. In the average of those million universes, the wealth would be astronomical. The math of "Expected Value" screamed at him to load up. The edge was massive. It was the kind of bet you tell your grandchildren about.

  But Arthur wasn't a million Arthurs. He was one.

  He felt the pull in his chest, a physical tightening. This was the temptation. It wasn't just greed; it was the allure of certainty. How often does a lock like this come along? Maybe once a year. If he bet half his bankroll, and *Iron Clad* won, the ledger total would jump so high he could breathe easier for a decade. He could fix the roof. He could help his sister with tuition. He could stop counting every penny.

  He hovered the pen over the *Stake* column.

  To bet big was to admit that tomorrow didn't matter as much as tonight. To bet big was to say, "I am willing to risk never sitting at this table again for the chance to sit here as a wealthy man."

  Arthur closed his eyes. He remembered a man from the track years ago, a guy named Sal. Sal was brilliant. Sal could pick winners better than anyone Arthur had ever met. But Sal bet to maximize the win, not the sequence. Sal treated every bet like it was the only bet that mattered. Arthur hadn't seen Sal in fifteen years. Sal had gone bust in '79. He hadn't just lost his money; he had lost his place in the game. He was out.

  The math in the ledger wasn't about getting rich quick. It was about staying alive long enough for the edge to work. It was about understanding that ruin is permanent, but profit is temporary. You can recover from a bad week. You cannot recover from zero.

  Arthur looked at the radio. The track announcer's voice was prerecorded in his head, the call of a race that hadn't been run yet. *They're coming down the stretch...*

  If he bet the "Ghost's Amount," the amount the raw mathematics suggested was optimal for a single isolated event, he risked a tail-end outcome. Even a 2-to-1 shot loses sometimes. If *Iron Clad* stumbled at the gate, or got boxed in, or just had an off day, and Arthur had bet half his bankroll, the loss would be catastrophic. He'd be playing from behind. He'd be chasing. And when you chase, you make mistakes.

  He looked at the hallway leading to the bedrooms. His daughters were asleep back there. They didn't know about the ledger. They thought their father was just careful with money. They thought he was cautious because he was afraid.

  Arthur smiled, a small, private thing. They didn't understand that this wasn't fear. Fear is emotional. This was architectural. He was building a bridge across a river, and he wasn't going to use cheap steel just because the weather looked nice today. He was building it to last fifty years, not just one crossing.

  He looked back at the paper. The tension in his shoulder eased. He realized that the true edge wasn't in knowing which horse would win. The true edge was in knowing which bets to walk away from. It was the discipline to accept being smaller than he could be, in exchange for being there longer than he had to be.

  He moved the pen. He didn't write the number that would make him rich if he won. He didn't write the number that would break him if he lost. He calculated the fraction. It was a modest sliver of the total. It was boring. It was safe. It was an amount that said, *I will be here tomorrow.*

  He wrote the number down.

  Arthur capped the pen and closed the ledger. The sound of the cover shutting was final, like a gavel.

  He stood up and walked to the window. The wind was still blowing, but the glass held. He thought about the nature of a life. We like to think in averages. We say, "On average, things work out." But you don't live on average. You live in sequence. One day after another. If you hit a cliff on Tuesday, it doesn't matter that the average terrain for the rest of the week is flat. You're gone.

  He wasn't betting on horses. He was betting on Tuesdays. He was betting on the ability to sit at this table next week, and next year, and ten years from now. He was betting that he would be around to watch his girls grow up, to help them move into dorms, to walk them down aisles.

  The bankroll wasn't money. It was time.

  Arthur turned off the kitchen light. He walked down the hallway, stepping over the creaky board he'd known about for years. He paused at the first bedroom door, opening it just a crack to hear the soft rhythm of sleeping breaths.

  He had the edge. He knew it. But he also knew that the house always wins in the end, unless you refuse to let it take everything in one night.

  He went to bed, leaving the ledger on the table. In the morning, *Iron Clad* would run. He might win, and Arthur would make a quiet, modest profit. He might lose, and Arthur would absorb the hit and wake up on Wednesday with enough left to try again.

  Either way, Arthur would be there. He had chosen the long road over the shortcut. He had chosen the one life he actually had over the million lives he could have imagined. And as he drifted off to sleep, the silence of the house felt less like quiet, and more like stability. He had stayed in the game. And for a man who understood the math of living, that was the only win that counted.
