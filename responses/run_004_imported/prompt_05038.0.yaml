      *   *Goal Misgeneralization (GMG):* Comes from "Goal Misgeneralization in Deep Reinforcement Learning" (Langosco et al., DeepMind, 2021). Key concept: Capabilities generalize, goals don't. The agent learns a goal that works in training but fails in deployment.
      *   *Relationship:* They feel similar because both involve "the model wants the wrong thing at test time." But the *mechanism* is the crux of the difference.
      *   *Key Distinction:* Inner Alignment *requires* a mesa-optimizer (an internal search process optimizing a goal). GMG does *not* require a mesa-optimizer; it can happen in standard RL agents without internal planning/search.

  3.  **Drafting the Comparison - Section by Section:**

