      *(Self-Correction during drafting)*: I need to be careful with the "stuck on a plane" example. If I get a test result and can't act, Good's theorem actually *agrees* that the value of information is zero (not negative). It says $V(I) \ge 0$. So if the user feels it's *negative*, that implies a cost (anxiety). I need to make sure I distinguish between $V(I) = 0$ (no action possible) and $V(I) < 0$ (psychological cost). Good's theorem says $V(I) \ge 0$. So the counterexamples are actually cases where $V(I) < 0$ (due to costs) or where the utility function is defined differently.

