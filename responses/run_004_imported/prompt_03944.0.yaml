answer: |-
  This is a profound question that touches on moral philosophy, psychology, and the dynamics of intimacy. You are describing a classic philosophical problem known as *akrasia* (weakness of will), but you are also navigating a very practical relationship rupture.

  Your partner is arguing from a position of **Revealed Preference**, a concept borrowed from economics and behaviorism. You are arguing from a position of **Higher-Order Desires**, a concept from moral psychology. Both contain truth, but your partner is applying a pragmatic truth to an emotional context where it feels like an erasure of your internal reality.

  Here is a way to think through the disagreement without dismissing either side, distinguishing between what you value *reflectively* and what you optimize for *impulsively*.

  ### 1. The Validity of Your Partner's Argument (Revealed Preference)
  Your partner's stance is that "value" is not a feeling you have; it is a function you optimize. In this view, if you say you value connection but optimize for screen time, you are effectively lying about your values, even if you aren't doing it consciously.

  There is a hard utility to this view. In a long-term relationship, **predictability is a form of safety.** If she cannot predict your behavior based on your words, her ability to trust you diminishes. From her perspective, the "cost" of your laptop usage isn't just the lost time; it is the signal that her understanding of your priorities is unreliable. When she says, "Your choosing wins," she is saying: *I have to live with the reality of your actions, not the potential of your intentions.*

  If you accept this view entirely, however, you run into the problem you identified: it makes concepts like regret, temptation, and growth impossible. If doing $X$ means you value $X$ most, then a dieter who eats cake truly values cake more than health, and an addict who relapses truly values drugs more than recovery. This flattens the human experience.

  ### 2. The Validity of Your Argument (Hierarchy of Desires)
  You are sensing that "wanting" is not a singular state. The philosopher Harry Frankfurt distinguished between **first-order desires** (I want to scroll on my laptop now) and **second-order desires** (I want to be the kind of person who prioritizes my partner).

  When you told her you wanted to talk, you were expressing a second-order desire. It was a statement about your values and your identity. When you opened the laptop, you were succumbing to a first-order desire.

  The fact that the first-order desire won in that moment does not prove the second-order desire was fake. It proves that your **executive function** failed to align your actions with your values. This is the essence of *akrasia*. You can genuinely value health while eating junk food; the conflict is real, not illusory. To say the junk food was your "true" preference ignores the genuine distress you feel *after* eating it. If the cake was truly your highest value, you wouldn't feel guilt; you would feel satisfaction. The guilt is evidence that your higher-order value still exists, even if it was overpowered.

  ### 3. A Principled Distinction: Valuing vs. Prioritizing
  To answer your specific question: *Is there a non-circular way to say someone can genuinely want something while reliably failing to choose it?*

  Yes. The distinction lies between **Reflective Valuation** and **Immediate Prioritization.**

  *   **Reflective Valuation:** This is what you endorse when you are calm, looking at the big picture, and considering your identity. (e.g., "I value my relationship.")
  *   **Immediate Prioritization:** This is what your brain selects when faced with friction, fatigue, or dopamine triggers in the moment. (e.g., "I want the comfort of the screen.")

  Your partner is conflating the two. She is saying Immediate Prioritization *is* Reflective Valuation. You are saying Reflective Valuation is the "real" you, and Immediate Prioritization is a failure of mechanism.

  **The Synthesis:** Both are "real." The impulse is a real force. The value is a real commitment. The tragedy of human psychology is that they often live in different parts of the brain. The limbic system (impulse) reacts faster than the prefrontal cortex (planning). When you are tired after dinner, your "planning self" hands the keys to your "impulsive self."

  So, you are not lying when you say you want to talk. But you are also not wrong when you admit that, in the hierarchy of *immediate comfort*, the laptop is currently winning.

  ### 4. Why This Hurts the Relationship
  The philosophical nuance matters, but the relational impact matters more. Your partner's argument feels harsh because it invalidates your struggle. However, your defense might feel to her like an excuse.

  *   **Her experience:** She hears "I value us," but experiences "I am alone." To her, the internal conflict you feel is invisible; the empty chair beside you is visible.
  *   **Your experience:** You feel a genuine desire to connect, but also a genuine gravitational pull toward the laptop. You feel like you are fighting a battle she doesn't see. When she says "your actions show what you want," it feels like she is saying your struggle doesn't exist.

  The danger here is that "Revealed Preference" is a useful tool for economists, but a destructive tool for lovers. If you treat a partner's failures purely as data points of their true feelings, you leave no room for grace, growth, or the reality of human weakness.

  ### 5. How to Move Forward
  You cannot win this by convincing her that your internal state is more real than your external actions. You have to bridge the gap between the two.

  **1. Validate her data, explain your mechanism.**
  Acknowledge that she is right about the *impact*. "You are right that my actions show where I'm failing to prioritize us. I know it feels like I don't value talking. I want you to know that I *do* value it (reflective), but I have a habit loop that overrides that value when I'm tired (mechanism). I am not lying about the value, but I am failing at the execution."

  **2. Stop relying on willpower.**
  If you drift to the laptop "even when you have nothing pressing," this is not a value problem; it is an environmental design problem. Willpower is a finite resource.
  *   **Pre-commitment:** Leave the laptop in another room before dinner.
  *   **Transition rituals:** Create a 15-minute buffer between dinner and "free time" that involves no screens.
  *   **The "Why":** Admit to her that you are struggling with a habit, not a lack of love.

  **3. Rebuild trust through reliability, not explanation.**
  She is currently skeptical of your words because your words have become decoupled from your actions. The only way to recouple them is consistency. For the next two weeks, the goal isn't to have deep conversations; it's to simply *not be on the laptop* after dinner. Prove the reflective value by removing the competing option.

  ### Summary
  Your partner is **pragmatically correct** but **psychologically reductionist**. Your actions *do* dictate the reality of your evening, and in a relationship, reality matters more than intent. However, she is **philosophically incorrect** to suggest that your stated intentions are "noise." They are evidence of a competing value system that is currently losing the tug-of-war.

  You can genuinely want to connect while failing to do so. But in a four-year relationship, "I genuinely want to" eventually stops carrying weight if it isn't accompanied by "I have changed my environment to ensure I do." Acknowledge the truth in her observation without accepting the erasure of your internal experience, and then change the conditions that make the laptop the easier choice.
