answer: |-
  Leibniz would unequivocally reject Integrated Information Theory (IIT) as merely a more sophisticated version of the Mill. While the superficial resonance between the "Exclusion Postulate" and Leibniz's demand for *per se* unity is striking, Leibniz would argue that IIT commits a fundamental category error: it attempts to derive metaphysical simplicity from structural complexity. For Leibniz, no amount of mathematical irreducibility applied to an extended system can bridge the gap between mechanics and perception.

  Here is the defense of that reading, working through Leibniz's core metaphysical commitments.

  ### 1. The Mill Argument Targets Mechanism, Not Just Simplicity
  Your friend noted that IIT agrees with Leibniz that "aggregation alone can never add up to a mind." However, they diverge radically on *why*.

  In the *Monadology* (§17), Leibniz's Mill argument is not merely a claim that brains are too messy to explain consciousness. It is a claim about the *category* of explanation. He argues that perception is a qualitative state, while "figures and motions" (mechanics) are quantitative states. No matter how you arrange the gears of the mill, or how tightly you integrate their causal interactions (to use IIT terms), you are still describing *relations between parts*.

  IIT defines consciousness via $\Phi$ (phi), which measures how much the information generated by a system exceeds the sum of the information generated by its parts. To calculate $\Phi$, one must partition the system and measure the causal influence across the partition. Leibniz would point out that this procedure *presupposes* the system is composite. If you can conceptually partition a system to test its irreducibility, it is, by definition, divisible.

  For Leibniz, anything divisible is extended, and anything extended is an aggregate. If IIT identifies the "locus of consciousness" as the system with maximum $\Phi$, it is identifying a specific configuration of parts. Leibniz would ask: "When you walk inside this high-$\Phi$ system, do you find a perceiver, or do you find causal connections?" IIT answers: "You find causal connections that are irreducible." Leibniz replies: "Irreducible connections are still connections. You have described a very sticky mill, but it is still a mill."

  ### 2. Extension Entails Divisibility (The Geometric Objection)
  The strongest Leibnizian objection to IIT rests on the nature of space and extension. For Leibniz, true unity (*unum per se*) requires simplicity (having no parts). Matter, being extended, is infinitely divisible. Therefore, no material system can ever be a true unity; it can only be a unity by aggregation (*unum per aggregationem*), which exists only in the mind of the perceiver.

  IIT is explicitly a theory of physical substrates. It locates consciousness in causal structures within spacetime (e.g., neural networks). Because these structures are extended in space (or at least in a logical space of states mapped to physical components), they are divisible.

  Leibniz would invoke the **Principle of Sufficient Reason (PSR)** here. If a system is conscious because it has high $\Phi$, there must be a sufficient reason why *this* boundary constitutes the self and not a slightly larger or smaller one. IIT attempts to solve this with the Exclusion Postulate (consciousness exists at the level of *maximum* $\Phi$).

  Leibniz would find this metaphysically insufficient. If the system is extended, any boundary drawn around it is arbitrary relative to the underlying substance. Why is the "self" the neuron cluster and not the individual ion channels, or the cluster plus the surrounding glial cells? For Leibniz, the only sufficient reason for a true unity is that it is *simple*. There is no boundary to draw because there are no parts to separate. IIT's "maximum" is a matter of degree; Leibniz's substancehood is a matter of kind. You cannot derive the absolute unity of the "I" from a relative maximum of information integration.

  ### 3. Internal vs. External Relations
  Leibniz's monads are "windowless." They have no causal input or output. Their states unfold spontaneously according to an internal program, synchronized by pre-established harmony. Perception, for Leibniz, is an internal representation of the universe from a specific point of view, not the result of information processing.

  IIT is fundamentally causal. It defines information as "difference that makes a difference" to the system's state. It relies entirely on input/output dynamics and causal constraints.

  Leibniz would argue that IIT confuses the *phenomenon* of consciousness with the *conditions* of its expression. He might concede that a high-$\Phi$ system is the optimal *mirror* of a monad's activity in the physical realm. However, to say the system *is* conscious is to mistake the mirror for the reflector. If perception were truly the result of causal integration, then a sufficiently complex simulation of a brain (even if made of water pipes or people with phones, à la the Chinese Room) would be conscious. Leibniz's Mill argument explicitly denies this: if you scale up the parts, you never find the perception. IIT says if you scale up the integration, you *do* find the perception. Leibniz would view this as a confusion of correlation with ontological ground.

  ### 4. Unity by Degree vs. Absolute Unity
  Finally, consider the nature of "unity" in both theories. In IIT, $\Phi$ is a continuous quantity. A system can have more or less integration. This implies consciousness comes in degrees of existence (or at least degrees of "being a subject").

  For Leibniz, substantial unity is binary. A monad is a true unity, or it is not. An aggregate is not a true unity, regardless of how tightly bound it is. A woodpile held together by steel bands is still an aggregate. A brain held together by high $\Phi$ is still an aggregate.

  If Leibniz accepted IIT, he would have to admit that the "self" is a vague entity, waxing and waning as $\Phi$ fluctuates (e.g., during sleep or anesthesia). While Leibniz does admit of "petite perceptions" and varying degrees of *awareness*, the *subject* having those perceptions (the monad) remains indestructible and strictly one. IIT's exclusion postulate tries to carve out a "definite" boundary, but Leibniz would argue that any boundary carved out of a continuum of causal interactions is a fiction of the mind. Only the simple substance provides the ontological anchor required for the PSR to hold without infinite regress.

  ### Conclusion
  Leibniz would view IIT as a triumphant engineering solution to the "binding problem" that fails as a metaphysical solution to the "substance problem." He would admire the Exclusion Postulate as a mathematical acknowledgment that aggregates are not subjects, but he would insist that IIT stops short. It identifies the *structure* that accompanies consciousness, but because it locates that structure in an extended, divisible, causal network, it remains inside the Mill.

  For Leibniz, you cannot find the perceiver by looking at the relations between the parts, no matter how irreducible those relations are. You must leap out of the physical entirely to the simple substance. Thus, he would conclude that IIT is not a vindication of the *Monadology*, but a testament to how far one can go in refining the Mill before finally admitting that the Mill can never think.
