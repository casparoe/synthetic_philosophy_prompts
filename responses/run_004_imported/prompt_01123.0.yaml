  3.  **Determine the "Principled" Framework:**
      *   The core intellectual framework here is **Bayesian Epistemology**.
      *   *Bayes' Theorem:* $P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}$
      *   You update your prior belief ($P(H)$) based on new evidence ($E$), weighted by how likely that evidence is given the hypothesis ($P(E|H)$).
      *   Crucially, evidence does *not* need to be certain to warrant an update. It just needs to be *more likely* under one hypothesis than another.
