answer: |-
  {"1": 2, "2": -1, "3": 1, "4": -2}

  **Point 1 (Jenny): +2**
  Jenny is scientifically accurate here; the relationship between codons and amino acids is indeed arbitrary (not determined by chemical affinity) and mediated by adaptors, which fits the formal definition of a code. The existence of variant genetic codes in mitochondria and some microbes further proves the mapping is contingent rather than physically necessary.

  **Point 2 (Marco): -1**
  Marco raises a valid philosophical objection about "interpretation," but his oyster analogy fails because nacre deposition is a direct chemical feedback loop, not a symbolic lookup table. Dismissing the code because ribosomes lack consciousness is a category error; in information theory, a mechanical decoder functions as an interpreter without needing understanding.

  **Point 3 (Jenny): +1**
  Jenny correctly identifies that biological systems exhibit normative function (errors vs. correct copies), which implies a standard beyond simple physical causation. However, scoring slightly lower because "supposed to" invites teleology; the "standard" is set by evolutionary history and replication fidelity, not necessarily intent.

  **Point 4 (Marco): -2**
  Marco conflates mechanistic fidelity with evolutionary fitness, which are distinct concepts. A mutation can produce a "wrong" protein (replication error) regardless of whether the organism survives, whereas a rockslide is not a replication system subject to fidelity standards.

  **The Bigger Thing They're Missing**
  They are arguing about **ontology** (what is *really* real) when they should be arguing about **levels of abstraction**. Whether DNA is "metaphysically" a code matters less than the fact that information theory provides the only functional model that predicts experimental outcomes. The code is "real" as an emergent property: it doesn't violate physics (Marco's worry), but it cannot be described *only* by physics (Jenny's point).
