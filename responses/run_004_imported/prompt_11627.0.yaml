answer: |-
  You are not missing something obvious, you are not unlucky, and your group is definitely not dumb. In fact, you have inadvertently recreated two of the most famous problems in the history of mathematics and economics.

  The short answer to your genuine question is: **Yes. It is mathematically proven that no ranking or scoring method can ever fully avoid these paradoxes.**

  There is no "clean" system waiting for you to find it. What you are experiencing is not a bug in your process; it is a fundamental feature of aggregating preferences.

  Here is exactly what happened to your dinner club, why it happened, and what you can actually do about it.

  ### 1. The Circle (The Condorcet Paradox)
  Two months ago, you found that Thai > Burgers > Pizza > Thai. In social choice theory, this is called a **Condorcet Cycle**.

  It feels like it "shouldn't be possible" because we assume group preferences should be transitive (if A > B and B > C, then A > C). But individual preferences don't always add up to a logical group preference.

  **Why it happens:**
  Imagine your 8 friends have very different taste profiles.
  *   3 people love spicy food (Thai > Pizza > Burgers)
  *   3 people love comfort food (Burgers > Thai > Pizza)
  *   2 people are vegetarians who hate burgers (Pizza > Burgers > Thai)

  If you vote Thai vs. Burgers, the Thai lovers and the Vegetarians win (5-3).
  If you vote Burgers vs. Pizza, the Thai lovers and the Comfort lovers win (6-2).
  If you vote Pizza vs. Thai, the Comfort lovers and the Vegetarians win (5-3).

  Everyone voted honestly and consistently. The "circle" emerges from the *combination* of those votes, not from any inconsistency in the voters. This proves that a "majority winner" doesn't always exist.

  ### 2. The Flip (Violation of IIA)
  Last month, you used a points system (3 for 1st, 2 for 2nd, 1 for 3rd). This is known as the **Borda Count**.

  Your friend Priya noticed that removing the last-place option changed the winner between the remaining two. This is a violation of a criterion called **Independence of Irrelevant Alternatives (IIA)**.

  **Why it happens:**
  In a points system, the *magnitude* of the win matters, not just the order.
  *   **Scenario A:** You have Thai, Burgers, and Pizza. Maybe Thai gets a lot of 1st place votes, but also a lot of 3rd place votes (polarizing). Burgers gets mostly 2nd place votes (consensus). Thai wins on points.
  *   **Scenario B:** You remove Pizza. Now, the people who had Pizza as their 1st choice have to shift their points to their 2nd choice. This influx of points might push Burgers over Thai, even though nobody changed their mind about whether they preferred Thai or Burgers.

  The presence of a "losing" option (Pizza) altered the mathematical relationship between the "winning" options. This is inherent to almost all points-based ranking systems.

  ### 3. The Hard Truth (Arrow's Impossibility Theorem)
  This is the part that answers your main question. In 1950, economist Kenneth Arrow proved a theorem that won him a Nobel Prize. He asked: *Is there a voting system that can convert individual ranked preferences into a group ranking while satisfying a few basic fairness conditions?*

  He defined "fairness" as:
  1.  **No Dictator:** The result shouldn't just be whatever one person wants.
  2.  **Unanimity:** If everyone prefers A over B, the group result should be A over B.
  3.  **Independence of Irrelevant Alternatives (IIA):** The ranking between A and B shouldn't change if C is added or removed.

  **Arrow proved that for any election with 3 or more options, no voting system can satisfy all three of these conditions simultaneously.**

  You can have a system that avoids cycles, but it will be vulnerable to the "flip." You can have a system that respects IIA, but it might end up being a dictatorship. You can have a system that is democratic and consistent, but it will produce cycles.

  So, to answer you directly: **You have not been unlucky. You have bumped up against a mathematical limit.** It is not possible to design a ranking system that is immune to these weird outcomes.

  ### So, what should a dinner club do?
  Knowing that a "perfect" system doesn't exist is frustrating, but it frees you to pick a system that is *good enough* for your specific context. Since you are a small group of friends (not a nation holding an election), you have different tools available.

  Here are three approaches that work better than ranked voting for small groups:

  **1. Approval Voting (The "Thumbs Up" Method)**
  Instead of ranking (1st, 2nd, 3rd), everyone simply votes "Yes" or "No" on every option. You can vote "Yes" on as many as you like. The restaurant with the most "Yes" votes wins.
  *   **Why it helps:** It eliminates the ranking paradoxes. It measures *acceptability* rather than *preference order*. It stops the "points flip" because there are no points to redistribute.
  *   **The trade-off:** It doesn't capture intensity (a "meh yes" counts the same as an "excited yes"), but for dinner, usually finding something everyone is okay with is better than finding something half the group loves and half hates.

  **2. Range Voting (The "Score" Method)**
  Instead of ranking, everyone scores each restaurant from 1 to 5 (or 1 to 10). Average the scores.
  *   **Why it helps:** This is generally considered by voting theorists to be the most robust method for small groups. It avoids the Condorcet cycle because you aren't forcing a head-to-head order, and it handles the "consensus vs. polarizing" issue better than points. If everyone gives Burgers a 4, and Thai gets half 5s and half 1s, Burgers wins.
  *   **The trade-off:** It requires a bit more mental effort to score everything.

  **3. The "Veto" System (Modified Turns)**
  Go back to taking turns picking, but give everyone else a **Veto**.
  *   **How it works:** It's Alice's turn to pick. She suggests "Thai." Everyone else has 24 hours to veto. If more than, say, 2 people veto, she has to pick again.
  *   **Why it helps:** It restores the simplicity of taking turns but protects the group from the one person who wants to go to the restaurant that costs $200 per person or is 2 hours away.
  *   **The trade-off:** It's not "democratic," but for a recurring social event, efficiency often beats democracy.

  ### The Verdict
  Your group is split because half of you want a "fair" mathematical solution, and the other half realizes the math is broken. **Both sides are right.**

  The "fair" mathematical solution doesn't exist (Arrow's Theorem). But going back to pure turns feels arbitrary.

  **My recommendation:** Switch to **Range Voting (1-5 stars)**.
  It feels like ranking, but it captures *how much* people like an option. It is mathematically less prone to the specific paradoxes you encountered than Borda Count (points) or Pairwise (head-to-head).

  But more importantly, tell your friends about Arrow's Impossibility Theorem. Sometimes, knowing that the "glitch" is a fundamental law of the universe, rather than a mistake you made, is enough to stop the argument and just order the pizza.
