      *   **Dutch Book Argument:** This is the classic philosophical argument linking probability coherence to rational betting behavior. If your degrees of belief violate probability axioms, you can be "Dutch Booked" (guaranteed loss).
      *   **Belief vs. Expression:** The researcher claims her *beliefs* were fine, but her *expression* (pricing) was sloppy. The colleague claims the incoherence proves irrationality.
