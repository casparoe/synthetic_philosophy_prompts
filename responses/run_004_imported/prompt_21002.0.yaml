answer: |-
  Good morning. Thank you all for being here. For those who don't know me, I'm [Name], [Grandmother's Name]'s grandson.

  When we talk about Grandma, the images come easily. We see her in the choir loft, voice rising in the Sunday hymn. We see her in the same pew, week after week, year after year. For forty years, she was a fixture. To look at her, you would say she was a woman of absolute certainty. And in a way, she was. But I think if she were here, she would ask us not to confuse certainty with faith.

  I've been thinking a lot this past week about what it costs to show up. It's easy to show up when you feel answered. It's easy to sing when the music feels like it's coming from everywhere at once. But Grandma taught me that the deeper kind of love—the kind that lasts—is the kind that shows up even when the room is quiet. Even when the music stops.

  She knew what silence felt like. There were long seasons in her life where prayer didn't feel like talking to anyone. It felt like speaking into a void. She didn't hide from that feeling, and she didn't pretend it wasn't there. But she also didn't let it stop her feet from walking the path she'd chosen. She kept kneeling. She kept singing. Not because she was guaranteed a reward, and not because she had all the answers mapped out, but because she was loyal.

  I think there is something profoundly brave about that. We often want our beliefs to be like math problems, where if you get the right proof, the answer forces itself on you. But Grandma lived her faith like a relationship. And anyone who has loved another person knows that love isn't always a feeling. Sometimes, love is just the decision to stay. To remain present even when the connection feels thin. To offer your time when you aren't sure who is receiving it.

  In a room like this, we all hold different things to be true. Some of us find God in the silence, and some of us find the silence to be just silence. Some of us pray the rosary every night, and some of us haven't stepped inside a church in decades. Grandma didn't ask us to agree on the theology. She asked us to agree on the love. She showed us that you don't have to have everything figured out to be a good person, or a devoted mother, or a faithful friend.

  She didn't die with her doubts resolved. I don't think she would have wanted us to pretend she did. But I also don't think she died feeling abandoned. I think she died knowing that she had done the work. That she had offered her loyalty to something bigger than herself, even when the receipt never came.

  There is a idea that if love is real, it makes itself known clearly. But maybe real love also requires space. Maybe the silence wasn't a sign that no one was listening, but a space where her choice to love mattered more than her feelings about being loved back. She didn't need God to be a magic trick. She just needed Him to be a neighbor worth showing up for.

  So, as we say goodbye, I don't want to offer you a Grandma who was perfect in her belief. I want to offer you the Grandma who was real. The one who knew that doubt isn't the opposite of faith; indifference is. And she was never indifferent. She cared enough to keep asking, even when the answer was quiet.

  To my mom, and to my uncle, and to all of us: I think the best way to honor her isn't to pretend we know where she is right now, or what she sees. It's to live with the same honesty she did. To show up for each other, even when it's hard. To sing, even when we aren't sure who is listening.

  Grandma, thank you for teaching us that love is a verb. Thank you for the loyalty. We'll take it from here.

  Rest well.
