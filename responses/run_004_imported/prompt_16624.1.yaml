prompt: |-
  I host a podcast on judgment and decision-making whose audience mostly arrived via Kahneman, the Sequences, and the rest of the usual rationalist-blogosphere canon, so next week I want to complicate that picture: my guest is a cognitive scientist who defends the fast-and-frugal heuristics program as the true heir to Herbert Simon's bounded rationality, against a heuristics-and-biases tradition she thinks quietly redefined "satisficing" as a story about error measured against an idealized rational-actor benchmark. On her view, strategies like take-the-best and the recognition heuristic aren't degraded stand-ins for fuller computation but can outperform it outright -- the "less-is-more" effect -- and most textbook biases reflect the wrong normative standard rather than genuine irrationality. Draft eight to ten interview questions that don't just let her restate the adaptive-toolbox picture: I want one that presses on how far less-is-more results demonstrated in narrow tasks like city-population judgments are entitled to generalize, one on the strategy-selection problem -- how an agent, or a modeler, is supposed to know which heuristic from the toolbox fits a given environment without already doing something like the fuller computation the heuristic exists to avoid -- and one asking her to distinguish take-the-best's cue-by-cue stopping rule from Simon's original aspiration-level satisficing, rather than simply asserting continuity between them. For each of these three, add a follow-up keyed to the answer she's most likely to give, and close with a question about what finding would actually settle the dispute with the heuristics-and-biases camp, as opposed to one that just gets her to restate which normative standard each side prefers.
