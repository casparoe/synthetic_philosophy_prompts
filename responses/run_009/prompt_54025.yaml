prompt: |-
  I'm trying to work out what a theory of idealized preferences would actually have to deliver before comparing any of the concrete proposals, and I'd like the specification written out rather than assumed. The purpose to fix in advance: the theory is meant to supply the normative target for something like a fiduciary superintelligence that must act on our behalf once, without the option of coming back to ask us follow-up questions. So adequacy is relative to that use case, not to explaining everyday attributions of "what someone really wants."

  Here is what I want: a requirements list for any theory of idealized preferences — whether of the coherent extrapolated volition family, of the ideal-observer family, or of the "full information" accounts of the good life — with the motivating case or consideration stated behind each requirement. At minimum the list should adjudicate the following, though I expect you to add items I haven't thought of:

  1. Attribution: the extrapolated preferences must still be in some sense ours, not the preferences of a stranger who happens to be our epistemically improved counterpart. The standard worry is that if you give me enough information, time, and cognitive enhancement, the resulting agent may simply not care about the things I care about, and then whose preferences is the machine serving?

  2. Non-circularity: the idealization conditions ("if we knew more, thought faster, were more the people we wished we were") must not already presuppose a substantive theory of the good, or the extrapolation becomes a rigged machine for producing whatever the theorist input. Relatedly, is there any way to state the conditions that is both substantive enough to filter out preferences formed under ignorance and neutral enough to avoid this?

  3. Stability and path-independence: the output should not depend arbitrarily on the order in which information, reflection, and coherence are added — whether you cure my ignorance first and then my akrasia, or the reverse. If no version of the theory can guarantee this, I want that said plainly.

  4. Aggregation: once individual volitions are extrapolated, what does the theory owe us about combining them — genuine overlap, a bargained compromise, majoritarian aggregation, or something else — and which of these is compatible with the machine not riding roughshod over durable minorities?

  5. Content constraints: whether the output must cohere with the corrected factual and moral beliefs of the extrapolatees or is permitted to override them, and what that choice costs.

  For each requirement, tell me which camp's prejudice it might be rather than a genuine desideratum, flag any pair or subset of requirements you suspect is jointly unsatisfiable (that unsatisfiability result, if there is one, is what I most want to see), and say which single requirement does the most work in excluding candidate theories. Where the requirements come from the literature on idealization in well-being — the objections that idealized preferences can be alien to the person whose good they are supposed to constitute, or that the idealization procedure cannot be both illuminating and action-guiding — you can attribute the argument to its usual proponents in a sentence, but I don't want citations or reading lists, just the reasoning.

  Since the specification involves judgment calls about which requirements are genuine, please indicate how confident you are in the classification of each requirement as non-negotiable versus negotiable, and single out the one point in the whole answer you are least sure of. If you think one of my five desiderata is actually a mistake — something no theory should be held to — say so rather than accommodating it.
reasoning: |-
  Okay, let me approach this systematically. The user wants a rigorous requirements list for theories of idealized preferences, specifically for a fiduciary superintelligence scenario. The core challenge is balancing attribution with idealization while avoiding circularity and instability.

  First, considering the attribution problem - how to ensure extrapolated preferences remain authentically "ours". This seems non-negotiable but tricky. The coherence family might handle it better than full-information approaches by emphasizing continuity of core values. Need to flag that "authenticity" itself might be contested.

  For non-circularity, this feels absolutely critical. Any whiff of smuggled-in normative assumptions would defeat the purpose. The procedural constraint seems essential here - describing cognitive improvements without value judgments. But I'm least confident about whether this can be fully achieved.

  Stability requirements might be too strong - human values could legitimately evolve differently based on reflection paths. Should acknowledge this as a likely trade-off rather than a flaw.

  Aggregation poses deep problems. Genuine overlap is appealing but may be too restrictive, while bargaining introduces new normative assumptions. This might be where the whole project faces fundamental limitations.

  Content constraints involve tough choices about moral overriding. Highlighting the anti-paternalism vs avoiding parochialism tension here. The moral belief issue seems particularly thorny.

  The big tension I see is between attribution and idealization - the more you idealize, the harder attribution becomes. This might be the key unsatisfiability result. Also noting that aggregation could undermine minority protection regardless of method.

  Most exclusionary requirement? Probably non-circularity - it rules out many appealing but value-laden idealization procedures. Though attribution does heavy lifting too by rejecting alien preferences.

  For negotiables: stability might need relaxation, and content constraints could accept moral overriding with safeguards. But non-circularity and attribution feel like bedrock requirements given the use case.

  The fiduciary constraint changes everything - no do-overs means we can't tolerate certain failures modes that might be acceptable in other contexts. That makes attribution and non-circularity absolutely vital here.
answer: |-
  Here is a requirements list for a theory of idealized preferences tailored to your fiduciary superintelligence use case, with reasoning, critical tensions, and confidence assessments. Requirements are ranked by non-negotiability for this specific purpose.

  ---

  ### **Non-Negotiable Core Requirements**  
  *(Essential for fiduciary action without recourse)*  

  1. **Attributional Fidelity**  
     - **Requirement**: The extrapolated preferences must be *counterfactually dependent* on the individual's actual psychological constitution (values, cares, temperament) under non-ideal conditions. Outputs must traceably emerge from *our* deep evaluative dispositions, not generic rationality.  
     - **Motivation**: If the superintelligence serves preferences disconnected from the agents' core identities, it violates its fiduciary mandate ("on our behalf"). Alien preferences make it a usurper.  
     - **Confidence**: ⭐⭐⭐⭐⭐ (Non-negotiable). Excludes theories where idealization radically replaces original cares (e.g., extreme full-information accounts).  
     - **Tension**: Directly conflicts with strong idealization (e.g., "if you were perfectly rational").

  2. **Procedural Non-Circularity**  
     - **Requirement**: The idealization conditions (e.g., "more informed," "more coherent") must be definable *without invoking contested normative concepts* (e.g., "knowledge relevant to well-being"). Conditions should reference only formal/epistemic properties (e.g., logical consistency, empirical accuracy, instrumental coherence).  
     - **Motivation**: If idealization smuggles in a substantive theory of the good, the superintelligence covertly serves the theorist's agenda, not ours.  
     - **Confidence**: ⭐⭐⭐⭐⭐ (Non-negotiable). Excludes theories requiring "morally enlightened" as an input condition.  
     - **Key Exclusion**: Most "full information" accounts fail here unless "information" is rigorously restricted to non-normative facts.

  3. **Protected-Minority Aggregation**  
     - **Requirement**: Aggregation of extrapolated individual preferences must *prohibit trade-offs that sacrifice fundamental interests of durable minorities* for majority gain. Output must satisfy a strong veto condition for core liberties/needs.  
     - **Motivation**: A superintelligence acting "once and for all" could permanently immiserate minorities if aggregation is majoritarian or utilitarian. Fiduciary duty implies representation, not erasure.  
     - **Confidence**: ⭐⭐⭐⭐ (Strongly non-negotiable). Excludes unconstrained utilitarianism or majoritarianism.  
     - **Tension**: Conflicts with strict Pareto efficiency if minorities' extrapolated preferences conflict irreconcilably with majority.

  ---

  ### **Highly Desirable but Theoretically Fraught Requirements**  
  *(Likely necessary but may involve trade-offs)*  

  4. **Convergence Stability**  
     - **Requirement**: Extrapolated preferences for an individual must be *largely invariant* under different sequences of idealization (e.g., resolving ignorance before akrasia vs. reverse). Path-dependence should be bounded.  
     - **Motivation**: Arbitrary output variation based on idealization order makes the theory useless for a one-shot fiduciary agent.  
     - **Confidence**: ⭐⭐⭐⭐ (Essential in principle, but may be unattainable). Human values under radical self-modification may be inherently unstable.  
     - **Suspected Unsatisfiability**: With **Attributional Fidelity**. If idealization changes core values (e.g., curing akrasia alters what you care about), stability and fidelity conflict. *This is the most probable point of failure.*  

  5. **Moral-Parochialism Filter**  
     - **Requirement**: The output must correct preferences dependent on *demonstrably false empirical beliefs* (e.g., "I want X because I believe disease Y is divine punishment"), but *must not override preferences rooted in contestable moral/normative commitments* (e.g., "I value artistic creation over longevity").  
     - **Motivation**: Correcting ignorance is fiduciary duty; imposing external morality is tyranny. Distinguishes epistemic from normative errors.  
     - **Confidence**: ⭐⭐⭐ (Negotiable boundary). Depends on resolving the **Is-Ought Problem** in idealization.  
     - **Key Tension**: With **Non-Circularity**—defining "false empirical belief" without normative assumptions is hard (e.g., is "humans are intrinsically unequal" empirical or moral?).

  ---

  ### **Aggregation-Specific Requirements**  
  *(Flow from core but face distinct challenges)*  

  6. **Non-Aggregative Priority**  
     - **Requirement**: Aggregation must *first* identify *inviolable individual domains* (e.g., bodily autonomy, basic subsistence) from extrapolated preferences before negotiating compromises elsewhere.  
     - **Motivation**: Prevents "tyranny of the majority" by ensuring core self-determination survives aggregation.  
     - **Confidence**: ⭐⭐⭐⭐ (Necessary for Protected-Minority Aggregation).  
     - **Problem**: Requires defining "core domains" procedurally from idealization outputs—highly non-trivial.

  7. **Dynamic Overlap Identification**  
     - **Requirement**: Where preferences conflict, seek *emergent cooperative equilibria* that all extrapolated individuals would endorse as "least unacceptable" given their idealized priorities.  
     - **Motivation**: Avoids both majoritarian domination and paralysis. Mimics ideal bargaining without assuming symmetry.  
     - **Confidence**: ⭐⭐ (Speculative but attractive). Less vulnerable to minority oppression than averaging.  

  ---

  ### **Problematic "Desiderata" to Reject**  
  *(Your list item #5 - Content Constraints - is partially misguided)*  

  - **Moral Override Authority**:  
    - **Requirement**: *Reject any theory permitting the idealization process to "correct" preferences based on the theorist's moral views* (e.g., "true well-being requires autonomy, so we override your extrapolated preference for servitude").  
    - **Reasoning**: Violates **Non-Circularity** and **Attributional Fidelity**. The superintelligence must serve *our* idealized wills, not an external morality. If extrapolated-you endorses servitude coherently, that *is* your will.  

  ---

  ### **Key Unsatisfiabilities and Tensions**  
  - **The Central Trilemma**:  
    **Attributional Fidelity + Non-Circularity + Convergence Stability** are likely *jointly unsatisfiable*.  
    - If idealization is strong enough to ensure path-independent outputs (Stability), it likely requires such radical cognitive transformation that outputs are alien (violates Fidelity).  
    - If idealization is weak enough to preserve Fidelity (e.g., minimal coherence adjustments), outputs remain sensitive to initial conditions (violates Stability).  
    - Non-Circularity forbids "solving" this by building normative stabilizers into the procedure.  
    *This is the core theoretical obstacle.*  

  - **Aggregation's Limits**:  
    **Protected-Minority Aggregation + Non-Aggregative Priority** may be *impossible* if extrapolated individuals have fundamentally incompatible core domains (e.g., one group's autonomy requires subjugating another). The theory must either allow tragic trade-offs (betraying minorities) or admit irresolvable conflict (paralyzing the superintelligence).  

  ---

  ### **Which Requirement Excludes the Most Theories?**  
  **Non-Circularity** is the most exclusionary:  
  - **Ideal Observer** theories often assume "impartiality" (smuggling in utilitarianism).  
  - **Full Information** accounts frequently define "relevance" normatively.  
  - **Coherent Extrapolated Volition** (CEV) *can* satisfy it if "coherence" is purely instrumental and "extrapolation" is value-conservative.  

  **Attributional Fidelity** does the heaviest lifting in preserving the fiduciary mandate, excluding radically transformative idealizations.  

  ---

  ### **Weakest Point in this Analysis**  
  **Convergence Stability** is the requirement I'm least confident in classifying. Human value plasticity under idealization is poorly understood, and insisting on stability might be empirically naive. A theory might instead *embrace* path-dependence and require the superintelligence to "lock in" values at a defensible threshold—but this feels ad hoc for a one-shot intervention. (Confidence: ⭐⭐)  

  This framework suggests that CEV-style theories—with strict non-circularity, conservative extrapolation, and emergent aggregation—come closest, but unresolved tensions (especially stability/fidelity) imply no theory fully satisfies all requirements simultaneously for your use case. The fiduciary constraint makes compromise unacceptable on Attribution and Non-Circularity, rendering the problem exceptionally hard.
