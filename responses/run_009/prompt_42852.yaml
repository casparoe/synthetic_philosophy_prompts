  Here's a joke that turns on the core disagreement and the tragedy of the commons logic:

  **Two economists are adrift in a lifeboat after their cruise ship sinks.** They see dozens of people drowning in the water nearby. One of them, a stern-looking fellow clutching a copy of *Science*, starts barking orders.

  **Economist 1 (Captain Hardin-esque):** "Right! We've got limited rations and only two seats! We must maintain our carrying capacity! No one else comes aboard – it would swamp the boat! Survival demands we stay closed."

  **Economist 2 (Spaceship Earth Advocate):** "Hold on! That's archaic lifeboat thinking! We're *all* crew on Spaceship Earth! We have a shared responsibility! We *have* to bring some of them in – we're all in this together!"

  **Economist 1:** *(Sighs deeply, looking past his colleague at the desperate swimmers)* "Fine. You make a compelling point about shared responsibility and common resources." *(He gestures towards the water)* "Alright, everyone! New policy! This is now a *community lifeboat*! There's plenty of seawater we *all* share! Drink up!"

  **Economist 2:** "...That's worse than drowning! Why?!"

  **Economist 1:** *(Shrugs)* "Tragedy of the Commons. If it belongs to everyone, everyone uses it. Rationally. Until it's gone. Including the seawater we *can* drink. Better to keep the resources we *control* safe."

  **Why it works:**

  1.  **Core Disagreement:** The joke directly pits the "Lifeboat" (closed system, limited resources, exclusion necessary) argument against the "Spaceship Earth" (one system, shared responsibility, inclusion possible/necessary) argument.
  2.  **Tragedy of the Commons Logic:** The punchline hinges *entirely* on this logic. The captain cynically applies the "shared resource" idea to something abundant but vital (seawater) to demonstrate how quickly a *truly* unmanaged common resource gets depleted when "everyone acting rationally" exploits it. He twists the Spaceship Earth ethic to prove his Lifeboat point.
  3.  **Accessibility:**
      *   **Non-Reader:** Understands the basic conflict: One guy says "No room, save ourselves," the other says "We must help, we're all connected." The punchline shows a cynical, absurd consequence of sharing *everything* without limits.
      *   **Hardin Reader:** Laughs at the direct, darkly humorous application of the tragedy of the commons logic to undermine the spaceship metaphor. They recognize the captain's move as a reductio ad absurdum of the spaceship ethic *without* management, which Hardin argued was essential. The seawater specifically mirrors the "pasture" – abundant until everyone uses it "rationally."
  4.  **Not Generic Rich/Poor:** The conflict is framed entirely around the *theoretical arguments* (Lifeboat vs. Spaceship, managing commons) and the absurd application of one to defeat the other.

  The joke highlights the central tension: the Spaceship Earth view *requires* effective global cooperation and resource management to avoid the very tragedy the Lifeboat proponent fears. The captain’s malicious compliance exposes the potential flaw in assuming shared responsibility automatically prevents overuse. A Hardin reader will appreciate the direct nod to his core argument.
