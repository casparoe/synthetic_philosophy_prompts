answer: |-
  **THE WILLOW CREEK HOUSING COOPERATIVE**  
  **OFFICIAL MEMBER ORIENTATION PACKET (v. 3.2)**  
  **"Preference Aggregation: A Managed Risk Environment"**

  **Section 1: Welcome & Core Philosophy**  
  Welcome to Willow Creek! You have joined a community dedicated to rigorous, evidence-based collective living. Our governance model is predicated on a principled avoidance of preference aggregation fallacies, specifically those identified by Kenneth Arrow’s General Possibility Theorem (Social Choice and Individual Values, 1951). This theorem rigorously demonstrates the *impossibility* of deriving a rational, fair, and consistent group preference ordering from individual ordinal rankings under three or more alternatives while satisfying minimal conditions of fairness (Unrestricted Domain, Pareto Efficiency, Independence of Irrelevant Alternatives, Non-Dictatorship).

  Therefore, **we do not aggregate preferences across multiple alternatives.** We have restructured decision-making to operate entirely outside the theorem’s domain of application. Compliance is mandatory for harmony.

  **Section 2: Decision-Making Protocol (DMP)**  
  **2.1 Pairwise Voting Only:**  
  *   All co-op decisions (chore assignments, grocery brands, movie selection, thermostat settings exceeding 1°F adjustments) are resolved via **binary vote** (Option A vs. Option B). *This is essential. The theorem requires ≥3 alternatives to generate impossibility.*  
  *   Example: "Shall we purchase Brand X or Brand Y oat milk?" (Valid). "Rank your preference among Brand X, Brand Y, or Brand Z oat milk." (Invalid. Grounds for Remedial Logic Training).

  **2.2 Sealed Envelope Procedure (SEP):**  
  *   Ballots are collected and counted by the Governance Committee Chair of the Week (see Section 3).  
  *   **Crucially:** Results are recorded on a slip of paper, sealed within an opaque envelope labeled ONLY with the specific pairwise question voted upon (e.g., "Oat Milk: X vs. Y, 2024-04-27").  
  *   Envelopes are archived in the Fireproof Decision Box (Basement, behind the boiler. Code: 112358).  
  *   **Combining or comparing results across different pairwise votes is STRICTLY PROHIBITED.** Attempting to infer a group ranking across multiple options (e.g., "Since we chose X over Y and Y over Z, we must prefer X over Z") violates the Independence of Irrelevant Alternatives (IIA) condition *by construction* and risks introducing cyclic social preferences (a known impossibility artifact). Transitivity is an illusion we cannot afford. The result of Vote A exists solely for Vote A. The Box ensures this.

  **2.3 Emergency Provision:**  
  *   If three options *must* be considered (e.g., exterminator choice: "Rats-R-Us", "Squeak No More", "Do Nothing"), they are decomposed into a **fixed sequence** of pairwise votes:  
      1.  Vote 1: Option A vs. Option B. Result sealed.  
      2.  Vote 2: Winner of Vote 1 vs. Option C. Result sealed.  
      *No global ranking is inferred. The winner of Vote 2 is enacted, irrespective of how it might have fared against other pairwise combinations. This sequence avoids unrestricted domain over the trio simultaneously.*

  **Section 3: The Chair of the Week (CoW)**  
  *   To ensure Pareto Efficiency (if everyone prefers A to B, A wins) without triggering dictatorship concerns *within a single pairwise vote*, leadership rotates weekly.  
  *   The **Chair of the Week (CoW)** holds sole authority for:  
      *   Framing pairwise questions (ensuring clarity and binarity).  
      *   Administering the SEP.  
      *   **Resolving Ties:** In the event of a tie within a pairwise vote, the CoW's *personal* preference for A or B determines the outcome.  
  *   **Governance Committee Note:** *This is categorically **not** a Dictatorship.* Dictatorship, per Arrow, implies one individual's preferences dictate the *entire social ordering* across *all* possible alternatives. The CoW only breaks ties on *one specific binary choice* during their term. Authority is highly restricted and rotates universally. We do not violate Non-Dictatorship; we **distribute** it temporally and functionally. Every member serves as CoW for one non-consecutive week per semester via the Fixed Rotation Schedule (Posted on Fridge).

  **Section 4: Preference Expression Guidelines**  
  *   **Ordinal Rankings Only (Publicly):** Members may express preferences of the form "I prefer A to B" or "I am indifferent between A and B" concerning any pairwise choice presented.  
  *   **Cardinal Utilities (Private):** Members are free to *privately* hold and quantify preference intensities (e.g., "I *really* hate Brand Z oat milk"). **However, voicing cardinal utilities (e.g., "I hate Z ten times more than I like X"), making interpersonal comparisons ("I care more about this than you do"), or revealing indifference curves within earshot of a quorum (≥3 members) is strictly forbidden.** Arrow's Theorem operates *only* on ordinal rankings. Public revelation of cardinal information creates an unregulated aggregation space ripe for theoretical instability. Keep your intensities to yourself. *Suspected violations may require re-education via recorded lectures.*

  **Section 5: Prohibited Practices & Historical Precedent**  
  *   **Ranked-Choice Voting, Borda Count, Approval Voting, etc.:** All methods attempting direct aggregation across ≥3 alternatives are banned. They inevitably violate at least one of Arrow's conditions (usually IIA or Non-Dictatorship).  
  *   **Case Study: The Borda Incident (2023):** Former Member J. proposed using a Borda count to select pizza toppings. The issue was **not** that Borda yields poor outcomes (though it often does). The issue was its explicit violation of **Independence of Irrelevant Alternatives (IIA)**. Adding or removing a topping option (e.g., anchovies) altered the ranking of other toppings (e.g., pepperoni vs. mushrooms), an unacceptable dependence. J. was asked to leave. *We take IIA personally.*  
  *   **Attempting to Open the Decision Box:** Requires unanimous consent and a licensed logician present. Has never occurred.

  **Section 6: Conflict Resolution & The Pareto Principle**  
  *   If a proposed change (e.g., "Shall we move the compost bin?") is Pareto Superior (no one opposes, at least one prefers), it passes automatically without vote. This satisfies Arrow's Pareto condition safely.  
  *   All other conflicts are decomposed into pairwise votes under the DMP. Persistent disagreements about the decomposition process should be referred to the current CoW. Their decision is final for that week.

  **Conclusion:**  
  Living at Willow Creek requires discipline. Our system rigorously avoids the inescapable paradoxes of preference aggregation. It may seem complex, but consider the alternative: theoretical inconsistency, potential dictatorship, or worse – Condorcet cycles determining dishwashing duty. By embracing impossibility, we achieve a stable, if meticulously partitioned, harmony. Remember: **The Box is sacred. The CoW is temporary. Cardinality is silent.** Welcome to rational cohabitation.

  **Governance Committee**  
  *"Avoiding Aggregation Since 2022"*
