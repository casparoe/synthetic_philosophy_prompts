prompt: |-
  You're an alignment researcher with a background in formal epistemology, and I want your take on a resourcing question. Imagine you're advising a small org -- say two theorists plus a couple of research engineers, a two-year runway -- that is trying to decide what conceptual work on worst-case vs. average-case guarantees in AI safety deserves their limited hours. Not empirical scaling work, not interp -- the philosophy and theory layer underneath it.

  Concretely, help them rank the open questions. Ones I'm aware of: what does "worst case" even range over, i.e., which class of environments/adversaries is the guarantee supposed to hold against, and can we say anything principled about which ones we're allowed to exclude? Is there a defensible middle ground between full minimax and pure expected-value reasoning -- e.g., strategies that sample from the top quantile of the policy's own distribution rather than maximizing (quantilizer-style ideas), or agents with quantified impact limits -- or do these inherit the worst of both worlds? When people give informal probability estimates of catastrophe and then act on the average, what is that even averaging over, and should model weights be policy-relevant given how poorly calibrated they might be? And a weirder one that keeps coming up in discussions: does worst-case reasoning combined with astronomical or unbounded outcome spaces push you toward fanatical corner cases (s-risk type worries) that arguably shouldn't dominate the agenda, and if so what blocks that move -- bounded utilities, rejection of the premise, something else?

  For each question you include: why it matters (how much downstream work depends on it), how tractable it is for this particular team given they're mostly theory people with some engineering support, whether it's neglected or already well-served by existing frameworks, and what evidence or developments in the next couple of years would move it up or down your list. I care more about the reasoning behind the ordering than the list itself -- two reasonable people can rank these differently and I want to see the tradeoffs made explicit. Also please flag anything you think is overrated here: a question that gets a lot of airtime in alignment discourse but whose answer wouldn't actually change much in practice.

  Please think carefully before answering -- start by brainstorming freely and then impose structure. Don't just survey the field, actually commit to a prioritized agenda and defend it. And keep it accessible: assume the reader is smart and broadly informed but hasn't memorized the technical literature, so gloss jargon when you use it. Thanks!
