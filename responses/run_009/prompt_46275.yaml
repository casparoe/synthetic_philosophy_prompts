  ## THE VOLUNTARY EXCHANGE  
  *Monthly Newsletter of Proprietor's Haven, LLC*  
  **Volume 12, Issue 7**

  ---

  **DEAR CURATOR**  
  *Your questions answered by our Resident Philosopher, Dr. A. N. Cillary, J.D. (Juris Doctor of Just Holdings)*  
  *Disclaimer: Advice rendered constitutes philosophical elucidation, not binding arbitration. All interactions voluntary. Fees for extended consultation may apply.*

  ---

  **Dear Curator,**  
  My neighbor, Mr. Higgs, erected a new fence last month. He insists the property line runs precisely where his fence now stands, citing a drone survey he commissioned. My own, older survey (conducted by a reputable pigeon-mapping service) clearly shows my rhododendron bed extends two feet into what is now Higgs’s gravel dog-run. I demanded he move the fence. He demanded I pay for the relocation. Who is entitled to the disputed strip?  
  *– Hemmed In on Hawthorne*

  **Dear Hemmed In,**  
  Entitlement flows from rightful acquisition and voluntary transfer, not horticultural preference or avian cartography. The crucial question is historical: How did you come to hold the land bordering Mr. Higgs? Did your title chain originate in just appropriation (unowned land mixed with labour under the Lockean proviso)? Was each subsequent transfer voluntary? If so, your holding is just, bounded by the terms of your deed. Mr. Higgs’s holding is bounded by *his* deed. The location inscribed upon those mutually agreed deeds, derived from the historical chain of voluntary title transfers, *is* the boundary. Consult your original purchase contract and the associated plat. If the drone survey aligns with the recorded deeds derived from just historical transfers, the fence is justly placed, regardless of your rhododendrons' aspirations. If your pigeon-map aligns, your claim is just. Survey methodology is irrelevant; historical provenance is paramount. Paying for relocation remains a voluntary matter between consenting proprietors. Perhaps offer Higgs a mutually agreeable sum for easement rights to the rhododendron zone?  
  *– Curator*

  ---

  **Dear Curator,**  
  Old Man Vanderlay has started charging hikers $5 to cross the corner of his vast woodland to access the popular Raven’s Crag trail. He claims he’s “appropriating the path” since it was previously unowned and he’s “improving it” with a tollbooth. Isn’t this just gouging? The trail’s been used freely for decades!  
  *– Trail Troubled*

  **Dear Trail Troubled,**  
  Mr. Vanderlay’s action constitutes a fresh appropriation. The Lockean proviso governs: one may appropriate unowned resources *only* if “enough and as good” is left for others, or if the appropriation does not worsen others’ situation compared to the resource remaining unowned. Previously, the path existed in a state of nature, freely traversable. Vanderlay’s appropriation institutes a fee. Has this worsened the position of potential path-users? Arguably, yes; they now face a cost where none existed before. However, the proviso requires comparison to the *unowned* baseline, not to a prior *usage pattern*. Was the path truly unowned? Usage does not equate to ownership. If it was unowned, the critical test is: Does Vanderlay’s appropriation leave others worse off *than they would have been had the path remained unowned*? If the path remains physically accessible (merely monetized), and no one was *entitled* to its free use before (as it was unowned, not collectively held), the baseline condition is unchanged: access required no payment before, requires payment now, but no one had a *right* to that free access under the proviso’s counterfactual. His installation of a tollbooth constitutes labour mixing. Provided he doesn’t block alternative routes that existed in the unowned state (does one exist?), his appropriation likely satisfies the proviso. Your grievance concerns a new price, not a violation of justice. You retain the liberty *not* to pay and *not* to hike his path.  
  *– Curator*

  ---

  **Dear Curator,**  
  The Proprietor’s Haven Association (PHA) just levied its annual “Voluntary Community Beautification Fee.” It funds street trees, median flowers, and the park’s topiary hedge maze. Failure to pay results in suspension of trash collection services and a lien threat. Isn’t this just a tax by another name? How is this “voluntary”?  
  *– Fee-Finagled*

  **Dear Fee-Finagled,**  
  A crucial distinction exists. A tax, as condemned by entitlement theory, is the coercive seizure of justly held earnings, morally equivalent to forced labour. The PHA fee is categorically different. You *voluntarily* entered into a covenant with the PHA when you purchased property within Proprietor’s Haven, LLC. Your deed includes explicit, voluntary agreement to the Association’s charter and its fee structure for maintaining commonly valued amenities that enhance *your* property values (a benefit you freely accepted). Non-payment constitutes a breach of your *voluntary contract*, triggering the contractually stipulated consequences (service suspension, lien). This is enforcement of agreement, not coercive redistribution. The fee is payment for specific, contracted services that preserve the value of your just holding. Refusing to pay while demanding services would be akin to demanding goods from a store without tendering the voluntarily agreed-upon price – an attempt at unilateral appropriation, not resistance to taxation. Your continued residency signifies ongoing voluntary consent to the covenant.  
  *– Curator*

  ---

  **Dear Curator,**  
  Ever since young Billy “The Skyhook” Johnson started getting a mandatory $0.50 royalty from every home basketball game ticket sold by Haven Hoops LLC (a clause his agent shrewdly negotiated), things feel… lopsided. Billy’s building a mansion on Serenity Hill, while Old Ms. Gable, who ran the ticket booth for 30 years, struggles to maintain her bungalow. Billy’s done well, fine, but does he *deserve* so much more than someone who served the community faithfully for decades? Shouldn’t there be some… balance?  
  *– Uneven in Uplands*

  **Dear Uneven,**  
  You raise concerns about the current *pattern* of distribution – notions of desert, need, or relative shares. Entitlement theory is resolutely *historical*, not *patterned*. Justice in holdings depends *solely* on how holdings came about. Were the initial acquisitions just? Have all subsequent transfers been voluntary? If Billy Johnson’s royalty stems from a *voluntary* agreement freely entered into by Haven Hoops LLC (they valued his unique talents sufficiently to offer the contract) and fans (who voluntarily pay the ticket price knowing the royalty clause), then his resulting wealth is entirely just. Ms. Gable’s holdings result from her voluntary employment contract with Haven Hoops LLC (or its predecessors) and her own life choices. Comparing their mansions and bungalows, or assessing who “deserves” more based on perceived service, loyalty, or effort, is to apply a patterned principle (like utility or desert) that has no place in determining justice. Justice is satisfied by the history of voluntary exchange and agreement. The resulting “shape” – whether equal, unequal, clustered, or scattered – is morally irrelevant. Billy’s mansion is just because it flowed from just steps; Ms. Gable’s bungalow is just for the same reason. The theory is indifferent to the valley between them. Focusing on the pattern commits a category error, mistaking a snapshot for the process that created it.  
  *– Curator*

  ---

  **P.S. Regarding Historical Queries:**  
  The Curator occasionally receives letters referencing certain… *irregularities* in the founding acquisitions of Proprietor’s Haven, specifically the displacement of the original Grubb family homesteaders circa 1890. The entitlement theory is indeed rigorously historical. Past injustices, if proven, *do* render subsequent transfers from the tainted holding potentially unjust, requiring rectification to establish a just baseline. The theory acknowledges this. However, the *precise requirements* of rectification – determining the rightful claimants (direct descendants? a collective?), the counterfactual just distribution had the injustice not occurred, or the appropriate compensation metric – present significant… *theoretical complications*. The current holdings, derived from potentially tainted origins, exist in a state of moral ambiguity *within the theory itself*. While the injustice is noted and the *principle* of rectification affirmed, the practical application remains profoundly under-specified by the theory. We log the anomaly, acknowledge the unresolved historical variable (R-HV-1890-Grubb), and affirm that future just transfers depend on a clean baseline. Establishing that baseline retroactively, however, involves counterfactuals and distributive judgments the core theory explicitly rejects for *current* patterns. It is a complex matter, best addressed through voluntary historical societies or perhaps mutually agreed-upon arbitration (fees apply). The theory stands, the complication is noted. Next letter, please.  
  *– Curator*
