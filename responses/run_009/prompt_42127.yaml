answer: |-
  Here is a collaborative statement drafted after intensive adversarial collaboration between a committed etiological theorist (ET) and a causal-role theorist (CRT), structured per your request. Both sides concede ground on framing while preserving core commitments. Key terms:  
  - **Etiological function (ET)**: What a trait *was selected for* by natural selection (or intentional design). Grounds normativity.  
  - **Causal-role function (CRT)**: What a trait *currently does* within a system to contribute to a specified capacity. Grounds mechanistic explanation.  

  ---

  ### 1. Agreed Claims (Both Signatories)  
  1. **Phenomena Needing Explanation**: Function ascriptions in biology/medicine (e.g., "the heart functions to pump blood") must account for:  
     - (a) The utility of function talk in explaining *how* systems work (e.g., circulatory systems).  
     - (b) The possibility of *malfunction* (e.g., a heart failing to pump adequately).  
     - (c) The apparent *normativity* of function claims (e.g., "this heart *should* pump blood").  
     - (d) Why some traits (hearts) are standardly ascribed functions, while others (cancerous growths) are not.  

  2. **Shared Ground**:  
     - Function ascriptions are explanatory tools, not brute facts.  
     - Both accounts reject vitalism or intrinsic cosmic purposes.  
     - Selection history often *correlates* with current causal contributions in evolved systems.  
     - Malfunction implies a deviation from a benchmark (though benchmarks differ: ET = historical selection, CRT = systemic contribution).  
     - The plastic-digestion case (below) is a valid test for tensions.  

  ---

  ### 2. Disagreements Table  
  | Disagreement Core                                                                 | Etiological (ET) Wording                                                                                                     | Causal-Role (CRT) Wording                                                                                                       |  
  |-----------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------|  
  | What grounds the *normativity* of function claims?                                | Normativity derives solely from historical selection: A trait *should* do X iff X is what it was selected for.              | Normativity derives from systemic goals: A trait *should* do X iff X is required for a specified capacity of the containing system. |  
  | Can a trait have a function *prior* to selection history?                         | No: Functions require a history of selection. A novel trait (e.g., first-gen plastic-digester) has no function, only effects. | Yes: Functions arise from current causal roles. If a trait contributes to a system’s capacity (e.g., survival), it has a function now. |  
  | What explains the *ascription* of functions (e.g., why hearts, not clouds)?       | Selection history filters which causal roles count as functions. Clouds lack a selection history for raining.               | Systemic context filters functions: Hearts are ascribed functions within organisms; clouds within meteorological cycles (but organismal contexts are privileged). |  
  | Is selection history *necessary* for function claims?                             | Yes: Without history, "function" reduces to "effect," losing normativity and malfunction criteria.                          | No: Selection history is often irrelevant to explaining *how* a system works. Invoking history adds no explanatory power for capacities. |  

  ---

  ### 3. Cruxes: Tests and Predictions  
  **Crux 1: Does normativity require historical selection?**  
  - **Test Case**: A lab-created synthetic heart (no evolutionary history) placed in a human body. It pumps blood flawlessly for 10 years, sustaining life.  
    - **ET Prediction**: The synthetic heart has *no function*—only effects. Calling it "malfunctioning" if it fails is metaphorical (no historical norm).  
    - **CRT Prediction**: It *has* the function of pumping blood. If it fails, it malfunctions relative to the organism’s circulatory capacity.  
  - **Costs**:  
    - *ET*: Denies intuitive normativity in engineered/medical contexts.  
    - *CRT*: Must explain why "malfunction" isn’t just "ceasing to contribute" (e.g., is a broken rock "malfunctioning"?).  

  **Crux 2: Can novel traits have functions pre-selection?**  
  - **Test Case**: Engineered bacteria with a synthetic plastic-digesting circuit (your scenario). Released into ocean; circuit aids survival. *At release (Generation 0)*, before selection acts:  
    - **ET Prediction**: No function. Plastic-digestion is merely a beneficial effect. Function emerges only after selection fixes the trait.  
    - **CRT Prediction**: Yes, function exists. The circuit *currently* contributes to cell maintenance/survival (a systemic capacity).  
  - **Costs**:  
    - *ET*: Struggles to ascribe functions to engineered/novel traits (e.g., AI systems, prosthetics).  
    - *CRT*: Risks overascription (e.g., a random mutation immediately aiding survival has a "function"—but is this normative?).  

  **Crux 3: Does history add explanatory value beyond causal roles?**  
  - **Test Case**: Two identical hearts: one in a naturally evolved mammal, one in a Boltzmann-spawned duplicate (arising by quantum fluctuation). Both pump blood identically.  
    - **ET Prediction**: Only the evolved heart has a function. History explains *why* it exists and *why* pumping is its proper task.  
    - **CRT Prediction**: Both have identical functions. History is irrelevant to explaining *how* circulation works in either system.  
  - **Costs**:  
    - *ET*: Must defend why historical explanation is distinct from causal-mechanistic explanation.  
    - *CRT*: Must explain why we intuitively deny functions to accidental duplicates.  

  ---

  ### The "Merely Verbal" Claim  
  **Agreed**: The dispute is *partially* verbal regarding the **word "function"**.  
  - **Verbal Component**: Both sides use "function" to mean "contributor to a goal," but:  
    - ET reserves "function" for *selected* contributions (F<sub>et</sub>).  
    - CRT uses "function" for *any* systemic contribution (F<sub>cr</sub>).  
    If both used distinct terms (e.g., "selected-function" vs. "causal-role"), some disagreements vanish (e.g., CRT agrees hearts have F<sub>cr</sub>, ET agrees clouds lack F<sub>et</sub>).  

  **Substantive Residue**:  
  - **Normativity**: ET insists F<sub>et</sub> provides a naturalistic basis for "should" (via selection). CRT’s normativity relies on *imputed* systemic goals (e.g., organism survival), which ET deems ungrounded without history.  
  - **Explanatory Target**: ET argues F<sub>et</sub> explains trait *origins/persistence*; CRT argues F<sub>cr</sub> explains *current operations*. These are distinct (but compatible) explanatory projects.  

  **Conclusion**: The theories are complementary tools—ET for evolutionary questions, CRT for mechanistic physiology—but clash when overextended. The plastic-bacteria case exposes this: CRT sees immediate utility; ET sees ahistorical description masquerading as teleology.  

  ---  
  This document reflects genuine concessions: ET admits causal roles matter for "how" questions; CRT admits history matters for "why" questions. But core axioms (normativity ≈ history vs. normativity ≈ system goals) remain irreconcilable without redefining terms.
