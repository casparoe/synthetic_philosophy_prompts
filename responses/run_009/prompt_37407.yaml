  Now, about what the practice strictly presupposes versus what's merely compatible. The system doesn't logically require seeing cantons as sovereign entities - it could just be a pragmatic federal safeguard. But historical context matters: the half-cantons' special status and the 2013 example where popular majority lost suggest the communal dimension is foundational. Still, the statute-level referendum does imply that ordinary legislation derives authority purely from individual consent.

  On consistency between registers - that's the thorniest part. Philosophically, treating a Zuricher as 1/40th of a Uri voter in constitutional matters while granting them equal weight elsewhere is logically jarring. But in practice, Switzerland accepts this as the price of federalism. The equal-weight principle gets partially sacrificed for communal representation when the constitutional compact is at stake.

  Finally, if Switzerland adopted pure majoritarianism, they'd lose the cantonal check that protects small communities' interests. This isn't necessarily undemocratic (majorities could still protect minorities), but it would transform Switzerland from a federation of communities into a unitary democracy with federal administration. The 2004 maternity law case shows how cantonal opposition can be overruled - suggesting this change might not destroy legitimacy, but would alter the federal balance.

  The user seems particularly interested in whether this dual system reflects a coherent theory or just historical compromise. My response should acknowledge both elements: there's principled federalism in requiring cantonal approval for constitutional matters, but also pragmatic adaptation in how half-cantons are counted. The 2013 example perfectly illustrates the theoretical tension they're wrestling with.
answer: |-
  The Swiss constitutional referendum system embodies a sophisticated—and intentionally dualistic—theory of democratic legitimacy that fuses individual and federal principles. Here's a systematic analysis addressing your four queries:

  ### 1. **Implicit Theory of Democratic Authority**  
  The system presupposes a **compound sovereignty model**, where:  
  - **Constituent Power** (constitutional change) resides in *the people as a federation of communities*. This reflects a **pact theory**: Switzerland was formed by sovereign cantons pooling sovereignty, so altering the foundational pact requires consent from both the collective citizenry *and* the constituent communities. The cantonal veto ensures small communities aren’t overrun by populous cantons, preserving the *federal bargain*.  
  - **Legislative Power** (ordinary statutes) derives from *the people as an aggregate of individuals*. Here, majoritarian democracy suffices because statutes operate within the constitutional framework already ratified by both registers.  

  **Principled Justification for the "Deeper Change" Requirement**:  
  Constitutional amendments redefine the polity’s architecture (e.g., powers of federal vs. cantonal governments). Requiring cantonal approval acknowledges that Switzerland’s legitimacy stems from its member communities’ voluntary union. The "double gate" ensures that fundamental changes reflect:  
  - *Individual consent* (popular majority), and  
  - *Federal consent* (cantonal majority),  
  thereby respecting the polity’s dual nature as both a *nation* and a *federation*.  

  ---

  ### 2. **What the Practice Presupposes vs. What It Allows**  
  **Strict Presuppositions**:  
  - Cantons are *irreducible political communities* with inherent weight. The half-canton design (each with half a vote) confirms that communities—not just individuals—are constitutive units.  
  - Constitutional legitimacy requires *dual authorization*: neither individuals nor cantons alone embody the sovereign.  

  **Compatible but Not Required Interpretations**:  
  - **Majoritarian Core with Federal Check**: The system *allows* viewing the cantonal veto as a counter-majoritarian safeguard (e.g., protecting small cantons). However, this doesn’t fully explain why *only* constitutional changes face this hurdle.  
  - **Compact Theory**: The practice is *compatible* with seeing cantons as founding sovereigns, but not strictly required—Swiss cantons no longer claim pre-constitutional sovereignty.  
  - **Corporate Theory**: It *permits* viewing the people as a corporate entity composed of communities, but the individual-popular register tempers this.  

  **What Decides Among Interpretations?**  
  - **Historical Practice**: The 1848 Constitution emerged from cantonal negotiations, favoring a "federation-first" reading. The 2013 example (popular majority overruled by cantons) demonstrates that cantonal consent is non-negotiable for constitutional legitimacy.  
  - **Institutional Design**: Half-cantons’ fractional votes show communities—not individuals—are the unit of federal representation.  

  ---

  ### 3. **Consistency Between Registers**  
  The two registers are **logically inconsistent under pure egalitarian individualism** but **coherent under a federal-communitarian theory**.  
  - **Tension**: The national register ("one person, one vote") clashes with the cantonal register (a Uri voter > Zürich voter).  
  - **Resolution in Practice**: Switzerland prioritizes:  
    - *Individual equality for statutes* (governing daily life),  
    - *Communal equality for constitutional foundations* (sustaining the federation).  
  **What Must Give Way?**  
    - The *equal-weight principle* is partially suspended in constitutional referenda to preserve *communal autonomy*. This is the more natural concession: the system explicitly values territorial communities as sovereign constituents.  

  ---

  ### 4. **Consequences of Abolishing the Cantonal Register**  
  Adopting pure majoritarianism would:  
  - **Eliminate Federal Safeguards**: Small cantons would lose their constitutional veto, risking domination by large cantons (e.g., Zürich + Bern could outvote others).  
  - **Alter Legitimacy Foundations**: Constitutional changes would derive authority solely from individual consent, eroding the compact theory. This would:  
    - **Loss of Federal Balance**: Undermine Switzerland’s core identity as a *voluntary union of communities*.  
    - **Democratic Legitimacy Impact**: Legitimacy would shift from *dual authorization* to *simple majoritarianism*. While still democratic, it would weaken the federation-specific legitimacy that historically binds diverse linguistic/regional groups.  
  - **Practical Effects**: Disputes over resource allocation or cultural rights (e.g., language laws) could escalate without the cantonal check—potentially fueling secessionist sentiment in minority regions.  

  ---

  ### Conclusion  
  The Swiss system embodies a **federative theory of popular sovereignty**: the *demos* is simultaneously a unitary people (*nation*) and a union of communities (*federation*). Constitutional changes require both dimensions of consent because they redefine the terms of the federation itself. While the registers are in tension, they reflect a coherent compromise—prioritizing communal equality for foundational matters and individual equality for statutory governance. Abolishing the cantonal register would sacrifice federal balance for majoritarian efficiency, risking the stability of Switzerland’s multinational democracy. The system’s resilience suggests its "incoherence" is a deliberate feature: it forces broad consensus across both individual and communal lines for transformative change.
