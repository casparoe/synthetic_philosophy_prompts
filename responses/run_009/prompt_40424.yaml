  Question 4: Duplication version
    Setup: Instead of two awakenings on tails, she is put under and if the coin is tails, a perfect duplicate of her (with all her memories up to Sunday) is created and woken in an identical room. The original and the duplicate are never brought together. On Sunday, before being put under, what is her credence that the coin will land heads? And then, at the moment of a waking (either her original self or the duplicate, if created), what should the credence of the person waking be that the coin was heads?
