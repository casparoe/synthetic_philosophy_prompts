  We are going to create a quiz with 8 questions. Each question has 2-3 answer options. The questions are concrete cases as specified.

  Question 1: Plain Sleeping Beauty
    Setup: On Sunday, a fair coin is flipped. If heads, Sleeping Beauty is awakened on Monday only. If tails, she is awakened on Monday and Tuesday. Between awakenings, she is given a drug that makes her forget the previous awakening, so each awakening feels like the first. On awakening (before being told anything), what should her credence be that the coin landed heads?
    Options:
      A. 1/2
      B. 1/3

  Question 2: It's Monday
    Same setup as question 1, but upon awakening, the researchers tell her (truthfully) that today is Monday. Now what should her credence be that the coin landed heads?
    Options:
      A. 1/2
      B. 2/3
      C. 1/3

  Question 3: Betting version
    Same setup as question 1. Each time she wakes, she is offered a bet: it pays $1 if the coin was heads and costs $1 if tails. At the end of the experiment, the net result across all her awakenings is calculated (so if tails, she pays $2 total; if heads, she gets $1). At what odds should she be willing to accept this bet? (Note: This question is not to sort positions but to highlight that betting behavior and belief might come apart.)
    Options:
      A. She should accept the bet only if she gets at least 2:1 odds (i.e., if she wins at least $2 for each $1 she risks when the coin is heads, but note the bet structure is fixed: she pays $1 to win $1, but the net effect is that on tails she pays twice. So we need to ask: should she take the bet at even money? Actually, let's reframe to avoid odds confusion:)
    Let me reframe: The bet costs $1 to play each time it is offered. If heads, she wins $X (so net gain $X - $1). If tails, she plays twice and each time she loses $1 (so net loss $2). But note: she is offered the bet on every awakening, and she must decide each time without knowing if it's the only time or not. However, the key is that the experimenters will total the results. So for the same $1 bet, if she takes it on an awakening, she pays $1 then and gets $1 if heads at the end? But the timing of payment and reward is tricky.

    Alternatively, we can ask: If she is offered the bet at a price of $0.50 per bet (so she pays $0.50 to get $1 if heads, and nothing if tails), would she take it? But note: she might be offered the bet twice on tails.

    Let me simplify: The bet is offered on every awakening. She pays $1 to buy a ticket that pays $3 if the coin is heads (and $0 if tails). But then on tails she buys two tickets and loses $2, and on heads she buys one ticket and wins $3 - $1 = $2? That doesn't match.

    Instead, let's use a standard framing: She is offered a bet that costs $C to purchase and pays $1 if heads and $0 if tails. But note that if tails, she will be offered the bet twice. So her expected net loss/gain must account for that.

    Actually, the standard way: She is offered a bet that pays $1 if heads and costs $1 if tails, and this is settled immediately. But then if tails, she will have two bets: one on Monday and one on Tuesday. Each bet will cost her $1 if tails. So her net loss on tails is $2, and on heads she gains $1. The experimenters total her winnings and losses.

    The key point is that thirders and halfers both agree that she should accept the bet if the payout for heads is at least $2 (because then the expected value is positive). But to avoid confusion, let's ask a multiple choice about what she should do if offered a bet with a specific payout.

    However, note: the quiz taker might not know the standard agreement. So we can ask:

    "If the bet is offered at even money (she pays $1 to play and gets $1 if heads, $0 if tails; but note: if tails she will play twice and lose $1 each time, so net $2 loss; if heads she plays once and gets $1 - $1 = $0), then she would lose money on average. Actually, even money bet in this context is not symmetric.

    Let me define: The bet is: pay $1 to get $2 if heads (so net: if heads, she gains $1; if tails, she loses $1). But if tails, she does this twice: so she pays $2 and gets nothing, net loss $2. If heads, she pays $1 and gets $2, net gain $1.

    The expected value from a thirder perspective: 
      P(heads) = 1/3, P(tails) = 2/3, but note the bet is offered once on heads and twice on tails? Actually, the bet is offered on each awakening. So the expected value per bet is: 
        (1/3) * (2 - 1) + (2/3) * (0 - 1) = (1/3)(1) + (2/3)(-1) = -1/3.
    So she should not take the bet at these odds.

    But if the payout is $3 for heads (so she pays $1 to get $3 if heads, $0 if tails), then:
        Expected value per bet = (1/3)*(3-1) + (2/3)*(0-1) = (1/3)*2 + (2/3)*(-1) = 2/3 - 2/3 = 0.

    And if the payout is $3.01, then it's positive.

    However, the halfer would reason differently? Actually, both halfers and thirders agree on the betting behavior. The halfer would say: the coin is fair, so P(heads)=1/2. But note: if heads, she only bets once and wins $2 (if the payout is $3, she pays $1 to get $3, so net $2). If tails, she bets twice and each time she loses $1, so net loss $2. So her expected net gain: (1/2)*($2) + (1/2)*(-$2) = 0. So at $3 payout, expected value is 0. So same as thirder.

    Therefore, we can use this to illustrate that betting and credence might not be the same. So let's ask:

    "In the plain Sleeping Beauty setup, suppose that on each awakening she is offered a bet: she pays $1 to play, and if the coin is heads she wins $X (so net gain $X-1) and if tails she wins nothing (so net loss $1). If tails, she will be offered the bet twice (so total loss $2). If heads, she is offered the bet once. What is the smallest $X (to the nearest cent) for which she should accept the bet on an awakening?"

