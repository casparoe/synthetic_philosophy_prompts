    "In the plain setup, when offered the bet on an awakening, which of the following is true?"
      A. She should only accept the bet if the payout for heads is at least $3 (for a $1 stake).
      B. She should only accept the bet if the payout for heads is at least $2 (for a $1 stake).
      C. It depends on her credence in heads.

    The correct answer is A, and both halfers and thirders agree. But note: the halfer might think she needs $2? Let's check:

    Halfer: 
        She thinks P(heads)=1/2. But note: if heads, she only bets once and gets $X - $1. If tails, she bets twice and loses $2. 
        Expected value: (1/2)*(X-1) + (1/2)*(-2) = (X-1)/2 - 1 = X/2 - 1/2 - 1 = X/2 - 3/2.
        Set to zero: X/2 - 3/2 = 0 => X=3.

