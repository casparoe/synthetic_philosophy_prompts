    We can note that for some positions, the answer to Part B is the same as the duplication case (question 4) and for others it is the same as the scale case with one person.

  Question 7: Does she learn anything?
    Setup: She knew the entire protocol in advance, and when she wakes everything feels exactly as she expected. Some say she gains no new information, some say she does gain information (even if it's just that she is now experiencing an awakening), and some say the question is misguided.
