  ### Sleeping Beauty Position Quiz

  Answer each question based on the described case. Choose the option that best reflects your intuition. Be honest—no peeking at the scoring key!

  ---

  **Question 1 (Plain Sleeping Beauty)**  
  On Sunday, Sleeping Beauty is told the rules: A fair coin is flipped. Heads: she’s woken once, on Monday. Tails: she’s woken on Monday *and* Tuesday, with amnesia between so each awakening feels identical. She goes to sleep Sunday night. Upon awakening (before being told anything), what should her credence be that the coin landed heads?  
  - **A.** 1/2  
  - **B.** 1/3  

  **Question 2 (It’s Monday)**  
  Same setup as Question 1. Upon awakening, researchers truthfully tell her, "Today is Monday." Now what should her credence in heads be?  
  - **A.** 1/2  
  - **B.** 2/3  
  - **C.** 1/3  

  **Question 3 (Betting Version)**  
  Same setup as Question 1. Each time she wakes, she’s offered a bet: pay $1 to play, win $3 if heads (net +$2), win $0 if tails (net -$1). If tails, she’s offered the bet twice (net -$2 total). If heads, she’s offered it once. Should she take the bet?  
  - **A.** Yes (expected value positive)  
  - **B.** No (expected value negative)  
  - **C.** Indifferent (expected value zero)  

  **Question 4 (Duplication Version)**  
  Instead of awakenings: On Sunday, she’s put under. Heads: she’s woken on Monday. Tails: a *perfect duplicate* (with her memories) is created and woken in an identical room. Original and duplicate never meet. At the moment of waking (whether original or duplicate), what should her credence in heads be?  
  - **A.** 1/2  
  - **B.** 1/3  

  **Question 5 (Red Room)**  
  Same as Question 1, but she’s told in advance: Monday’s room is always red; Tuesday’s (if used) is blue. She wakes and sees a red room. How does this affect her credence in heads?  
  - **A.** Increases it  
  - **B.** Decreases it  
  - **C.** No change  

  **Question 6 (Scale Version)**  
  Heads: 1 awakening. Tails: 100 awakenings (amnesia between).  
  - **Part A:** If all 100 awakenings are *her* (same person), what should her credence in heads be upon waking?  
    - **A.** 1/2  
    - **B.** 1/101  
  - **Part B:** If the 100 awakenings are *100 different people* (duplicates with her memories), what should one duplicate’s credence in heads be?  
    - **A.** 1/2  
    - **B.** 1/101  

  **Question 7 (Does She Learn Anything?)**  
  She knew the entire protocol in advance. When she wakes, everything feels exactly as expected. Does she gain new information?  
  - **A.** No—she knew this would happen  
  - **B.** Yes—she learns "I’m awake *now*"  
  - **C.** "Gaining information" is the wrong frame  

  **Question 8 (Fact of the Matter?)**  
  When asked "What’s your credence now?", is there one rational answer?  
  - **A.** Yes—one number must be given  
  - **B.** No—the question is ill-posed (multiple identical awakenings)  
  - **C.** No—it depends on practical goals (e.g., betting)  

