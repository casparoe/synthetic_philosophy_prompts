  ### Scoring Key  
  Match your answers to the patterns below. Positions are defined by their commitments, not labels. Some positions split on edge cases.  

  1. **Thirder**  
     - Q1: B | Q2: B | Q3: C | Q4: B | Q5: A | Q6A: B | Q6B: B | Q7: B | Q8: A  
     - *Commitments*: Waking provides new indexical information ("I’m awake now"). Heads credence is 1/3 (1 awakening out of 3 possible). Duplicates count equally. Scale doesn’t care about personhood.  

  2. **Lewis Halfer**  
     - Q1: A | Q2: B | Q3: C | Q4: A | Q5: A | Q6A: A | Q6B: A | Q7: A | Q8: A  
     - *Commitments*: Coin is always fair (P=1/2). Being told "Monday" *updates* credence (to 2/3). Duplicates don’t change fairness. Seeing red implies Monday, so updates to 2/3.  

  3. **Double Halfer**  
     - Q1: A | Q2: A | Q3: C | Q4: A | Q5: C | Q6A: A | Q6B: A | Q7: A | Q8: A  
     - *Commitments*: Coin is always fair (P=1/2), *even after* learning it’s Monday or seeing red. No update from awakening or duplication.  

  4. **Observer-Relative (SSA-Style)**  
     - Q1: B | Q2: B | Q3: C | Q4: A | Q5: A | Q6A: B | Q6B: A | Q7: B | Q8: A  
     - *Commitments*: In same-person cases (Q1, Q6A), count awakenings (P=1/3 or 1/101). With *duplicates* (Q4, Q6B), count the coin’s fairness (P=1/2). Seeing red updates as in thirder.  

  5. **Deflationary / Pragmatic**  
     - Q8: B or C (regardless of other answers)  
     - *Commitments*: No "true" credence. The question is malformed or answer depends on context (e.g., betting odds in Q3 are agreed, but belief isn’t separable).  

  ---

  ### Notes  
  - **Q3’s role**: All positions agree on betting behavior (break-even at $3 payout). This catches conflating belief with action.  
  - **Q4 vs. Q6**: If you flip Q4 relative to Q1 (e.g., Q1=B but Q4=A), you likely hold observer-relative views. Q6 tests if scale/personhood matters for that flip.  
  - **Q5’s split**: Distinguishes double halfer (C) from others (A). Lewis halfer and thirder both increase credence but disagree on why.  
  - **Uncovered splits**: Positions may not separate on Q7 or Q8 alone. Deflationary overrides other labels if Q8=B/C.  
  - "Inconsistent"? If your pattern doesn’t fit, you might hold a hybrid or unorthodox view—blame the coin!
