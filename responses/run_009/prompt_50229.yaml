prompt: |-
  I'm part of a small decision theory reading group, and another member and I have been arguing about sunk costs for what must be over a year now, at this point mostly past each other. We finally decided to try the adversarial collaboration route: a fixed number of sessions, steelman each other, and at the end produce a joint statement we can both actually sign. I'm writing to ask you to draft that statement for us — obviously we'll revise, but we want a strong first pass to argue over.

  Here's roughly where we each stand. She's the hardliner: only consequences-from-now-on can justify a choice, sunk costs are rationally inert by definition, and whenever honoring sunk costs *looks* rational (staying in a PhD program because you're four years in, continuing a losing war because soldiers already died, finishing a bad movie) there's some disguised forward-looking reason doing the real work — information about project quality, reputational payoffs, option value, whatever. I'm the revisionist: I think there are residual cases where sunk-cost sensitivity is rational even after you condition on all her forward-looking factors, for two reasons. First, commitment: following through on projects at a loss is how you make your future threats, promises, and projects credible — to counterparties and maybe to yourself — and that credibility can't be had for free, someone who only ever follows through when it's ex ante profitable never builds it. Second, and she hates this one, the narrative thing: a person who abandons projects whenever the ledger says so has projects in a thinner sense than someone who sticks, and I think the ability to be a long-horizon agent is itself something rationality can require, not just a taste. A case we keep coming back to: a CEO who greenlit a now-failing project, and the question of whether continuing it partly because abandoning it would signal her earlier call was wrong counts as a legitimate reason or just an error dressed up as one. She says the moment you itemize reputation and signaling as consequences, I've conceded everything and we're just labeling differently; I say the disagreement about whether decision procedures can be assessed separately from single decisions is still live there, not verbal.

  For the document itself: a numbered section of claims we can both sign (including the boring operational ones — what counts as a sunk cost, when sunk-cost sensitivity is pathological, which famous cases we agree the fallacy label fits); then a disagreements section, with each disagreement worded so that each of us would accept the phrasing as a statement of our own view — that's where we always fail when we do it ourselves; then the cruxes, and for each crux a concrete case, thought experiment, or piece of evidence we both agree would bear on it, with both our predictions written down in advance. Please also flag explicitly which of our disagreements you think are genuinely substantive versus which are us using "rational" in two different senses — my own suspicion is the commitment dispute is substantive and the narrative-identity dispute is at least partly verbal, but I'd want her to be able to live with that diagnosis too, so be careful with how you put it. Format it as the numbered agreed-claims section followed by a disagreements table with columns for the crux, her prediction, mine, and what would settle it. And do flag the one place where you think *I'm* the one being sloppy — she'll trust the doc more if it doesn't read like my side won.
reasoning: |-
  Okay, the user is part of a decision theory reading group and has been debating sunk costs with another member for over a year. They've decided on adversarial collaboration and need a draft joint statement. Let me unpack their positions.

  First, the hardliner (let's call her Alice) believes only future consequences matter. Sunk costs are rationally inert. Any case where honoring sunk costs seems rational actually has hidden forward-looking reasons—like information, reputation, or option value. The user (let's call him Bob) is the revisionist. He argues that in some residual cases, sunk-cost sensitivity is rational even after accounting for Alice's factors. His two main points: commitment (building credibility for future threats/promises) and narrative identity (being a long-horizon agent isn't just a preference but a rational requirement).

  Their recurring example is a CEO who greenlit a failing project. Bob thinks continuing to avoid signaling a mistake could be rational due to commitment reasons. Alice says once you label reputation as a future consequence, it's just semantics. Bob insists the disagreement is about whether decision procedures can be evaluated separately from single decisions.

  For the document structure, they want:  
  1. Agreed claims (definitions, pathological cases)  
  2. Disagreements section phrased neutrally  
  3. Cruxes with concrete cases, predictions, and what would settle them  
  4. Explicit flags on substantive vs. verbal disagreements  
  5. A note where Bob might be sloppy (to build trust)  

  Key challenges:  
  - Defining "sunk cost" operationally without bias.  
  - Distinguishing pathological sunk-cost sensitivity from debated cases.  
  - Phrasing disagreements so both can endorse their own view.  
  - Designing crux tests that aren't strawmen.  
  - Diagnosing the commitment dispute as substantive vs. narrative as partly verbal.  
  - Finding where Bob might be sloppy—maybe his "narrative" argument conflates instrumental rationality with identity?  

  For the cruxes:  
  1. Commitment: Alice predicts a rational agent would abandon projects once unprofitable, even if it sacrifices credibility. Bob predicts commitment mechanics matter. The test could involve a repeated game where honoring sunk costs builds trust.  
  2. Narrative: Alice sees it as preference; Bob as rational requirement. The test might involve identical twins with different decision rules—but this risks being unfalsifiable. Need concrete scenarios.  

  Where Bob might be sloppy: Using "rational" without specifying if it includes constitutive elements of agency. Alice likely uses a narrower consequentialist definition.  

  The joint statement must feel balanced. Start with dry definitions to establish common ground. In disagreements, avoid "Bob thinks X, Alice thinks Y" but instead phrase as competing hypotheses. Highlight that the commitment crux is empirical (game theory evidence?) while narrative may hinge on meta-rationality assumptions.  

  For the CEO case: Alice would say "signaling cost" is a future consequence, so it's accounted for. Bob argues the decision rule itself has independent weight. The testable difference might be whether an agent who ignores sunk costs but pays for credibility (e.g., bonds) behaves identically to one with a commitment rule. If yes, Alice wins; if not, Bob's point holds.  

  Final structure:  
  - Agreed Claims (numbered)  
  - Disagreements Table (Crux, Alice’s Prediction, Bob’s Prediction, Settler)  
  - Diagnoses (substantive/verbal, Bob’s sloppiness)
answer: |-
  ## Joint Statement on Sunk Costs: Draft for Adversarial Collaboration  
  *Prepared for [Your Name] ("Revisionist") and [Her Name] ("Hardliner")*  

  ### Section 1: Agreed Claims  
  *We jointly endorse the following statements:*  

  1. **Definition of Sunk Costs**: A sunk cost is any investment (time, money, effort, emotional capital) that has already been incurred and cannot be recovered.  
  2. **The Core Principle**: Only *future consequences* (expected utility, costs/benefits from the present forward) can rationally justify a decision. Past investments, *in isolation*, provide no direct rational basis for continuing a course of action.  
  3. **Pathological Sunk-Cost Sensitivity**: We agree the "sunk cost fallacy" is a pervasive error in human cognition. Examples include:  
     - Finishing a meal you dislike because you paid for it (with no health/social consequences).  
     - Continuing a failing project *solely* because "we’ve come this far" (e.g., persisting with a broken car repair after exceeding its value).  
  4. **Forward-Looking Explanations for Apparent Exceptions**: Many cases where honoring sunk costs *appears* rational reduce to disguised forward-looking factors, such as:  
     - **Information signals**: Completing a PhD may reveal hidden skills/credentials.  
     - **Reputational/strategic effects**: A CEO continuing a project to maintain investor confidence.  
     - **Option value**: Sitting through a bad movie to preserve future cinema-going enjoyment.  
  5. **Burden of Proof**: Any claim that sunk costs *directly* justify a decision requires rigorous exclusion of all plausible forward-looking explanations.  

  ---

  ### Section 2: Disagreements and Cruxes  
  *We disagree on the following points. Each statement is phrased such that both parties can endorse it as a fair representation of their view.*  

  | Crux Description                                                                                                | Hardliner’s Position                                                                                                                                 | Revisionist’s Position                                                                                                                               | Test Case / Evidence                                                                                                                               | Settling Condition                                                                                                                              |
  | :-------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Commitment as Instrumental Rationality**<br>Is "building credibility through follow-through" reducible to standard future consequences, or does it require distinct decision rules? | **Prediction:** All commitment benefits (e.g., reputation for tenacity, self-signaling) are quantifiable as future payoffs. A rational agent can simulate credibility via explicit contracts/bonds without ever honoring sunk costs at a loss. | **Prediction:** Some credibility (e.g., in non-contractible settings, or for self-consistency) *cannot* be purchased piecemeal; it emerges only from a history of following through *even when locally suboptimal*. | **Case:** *The Repeated Startup CEO*: A founder has a history of abandoning projects when metrics dip. They now seek investors for a high-risk venture. Can they fully offset investor skepticism by offering a larger equity stake (mimicking credibility via explicit cost), or does their history impose an irreducible discount? **H predicts:** Explicit compensation (e.g., equity) fully offsets the discount. **R predicts:** A persistent discount remains due to perceived lack of resolve. | Empirical data on venture capital deals: Do founders with "abandoner" histories receive worse terms *after controlling for explicit risk-sharing offers*?                                                                                     |
  | **2. Narrative Identity as Rational Requirement**<br>Is "being a long-horizon agent" a constitutive element of rationality, or merely a preference?                          | **Prediction:** Narrative consistency is a psychological preference (like risk aversion), not a rational requirement. An agent who abandons projects based solely on future consequences remains fully rational, just with different utility weights. | **Prediction:** Rationality requires agents to maintain diachronic coherence. Abandoning projects *whenever* locally optimal produces "thinner" agency, undermining the capacity to pursue long-term goals. | **Thought Experiment:** *Identical Twins*: Twin A uses a strict "future-consequences-only" rule. Twin B uses a rule requiring completing 90% of projects they start, barring catastrophic future loss. Both have identical skills/resources. After 20 years, does Twin B exhibit greater resilience, goal achievement, or psychological coherence? **H predicts:** No systematic difference; outcomes depend only on project selection. **R predicts:** Twin B achieves more ambitious goals due to greater self-trust/partnerships. | Longitudinal studies on goal persistence: Do agents with "completion norms" (e.g., artists, researchers) achieve more ambitious outcomes than opportunistic maximizers *after controlling for talent/opportunity*? |
  | **3. Procedural Rationality**<br>Can decision *procedures* (not just outcomes) be rationally assessed?                                                                  | **Prediction:** Rationality evaluates only decisions in isolation. Procedures matter only insofar as they instrumentally improve future outcomes (e.g., efficient heuristics). | **Prediction:** Procedures have independent rational weight. A history of "local optimization" undermines future agency, justifying sunk-cost sensitivity as a meta-rational corrective. | **Case:** *The CEO’s Signaling Dilemma*: A CEO faces identical future consequences whether she abandons a failed project or continues it to avoid signaling fallibility. **H predicts:** Indifference; either choice is rational since consequences are identical. **R predicts:** Continuing is uniquely rational to preserve a credible decision procedure. | Neuroeconomic experiments: When future consequences are *precisely matched*, do agents still show procedural preferences? If yes, are these preferences correlated with long-term success?                           |

  ---

  ### Section 3: Diagnosis of Disagreements  
  1. **Substantive Disagreement**: The **Commitment** crux is substantive. It hinges on empirical questions about whether credibility can be fully commodified (e.g., via contracts) or requires behavioral history. *This is resolvable via evidence*.  
  2. **Verbal/Conceptual Disagreement**: The **Narrative Identity** crux is partly verbal. It reflects differing conceptions of rationality:  
     - *Hardliner*: "Rationality" is purely about maximizing expected utility given current preferences.  
     - *Revisionist*: "Rationality" includes maintaining the preconditions of agency (e.g., diachronic identity).  
     *This may require clarifying meta-ethical assumptions.*  
  3. **Sloppiness Flag**: The Revisionist’s narrative argument risks conflating *instrumental value* (commitment’s payoff) with *intrinsic value* (identity as an end). If narrative coherence lacks measurable future consequences, it may collapse into a preference—undermining the claim that sunk-cost sensitivity is *rationally required*.  

  ---

  ### Next Steps for Collaboration  
  1. **Revise Draft**: Annotate where phrasing misrepresents your view or misses nuance.  
  2. **Design Crux Tests**: Jointly refine test cases to ensure they are falsifiable and mutually acceptable.  
  3. **Gather Evidence**: For Commitment crux, seek venture capital/contract theory data. For Narrative, review longitudinal studies on goal persistence.  
  4. **Define "Rational"**: Explicitly resolve whether rationality includes constitutive elements of agency (meta-ethics discussion).  

  *This document stakes out common ground while preserving disagreements without caricature. It flags where the Revisionist’s position may overreach, ensuring balance. By writing predictions in advance, we avoid hindsight bias and focus on evidence.*
