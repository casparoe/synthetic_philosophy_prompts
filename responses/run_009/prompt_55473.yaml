prompt: |-
  I'm a novelist who teaches a semester-long craft seminar in an MFA program — fourteen students, mostly mid-draft on their first novels — and I've become obsessed with a problem that I suspect is philosophical rather than technical, though my philosophical education ended with an undergraduate survey twenty years ago. When I write a reveal (the masked stranger has been Elena's brother all along; the narrator is the child from chapter two), the identity sentence feels strange in a way my students can sense but not name: it reads as shocking, yet once it lands, everyone agrees it was true all along and could not have been otherwise without breaking the book, and yet nobody inside the story — and arguably nobody writing it, before the reveal — could have known it by sitting down and thinking. A friend with a philosophy PhD tells me I have stumbled into Kripke's territory: rigid designation, and identity statements that are necessary but only knowable a posteriori. She also tells me the same machinery bears on why names in my notebooks don't behave like disguised descriptions — "the detective" can be true of many characters, but the name I gave her at age eleven locks onto her whether or not she still qualifies as a detective by the final draft. I want my students to feel this rather than be told about it, because craft lectures about naming go in one ear and out the other.

  The parameters: one three-hour workshop block, fourteen students, zero philosophy background, no lecture up front, and the philosophical vocabulary withheld until the debrief at the very end. Design me an activity — a game, a collaborative serial-fiction exercise, a staged case with real constraints, whatever serves it — in which the students fix reference by naming characters of their own invention, accumulate descriptive dossiers about those characters, and then discover identities between them, so that they run into the two halves of the phenomenon on their own: that a reveal was "true all along" and that retconning it feels less like learning something new and more like changing the world, and simultaneously that nothing in the dossier ever determined who was identical to whom. I'd like concrete rules, materials (I can print cards, I have a whiteboard, no laptops in the room), a minute-by-minute timeline, and some mechanism that makes the "discovery" feel like genuine investigation rather than the author simply decreeing an answer.

  For the debrief, I want the mapping made explicit afterward: which moment in the activity corresponds to fixing a rigid designator, which to the discovery of an identity that was necessary but unknowable in advance, and how the pull they felt against retconning relates to the intuition philosophers lean on here. The classical example — the evening star turning out to be the morning star — should come out only in the debrief, not before. Tell me what will predictably go wrong the first time I run it (I suspect some students will insist their character was "really" the other one all along because the dossier pointed there, and I suspect others will happily rewrite their fictions mid-game), and how I should handle each. Most importantly, be honest about what the activity cannot reproduce: I take it that whatever necessity holds within a fiction holds by authorial fiat, which is not the metaphysical necessity at issue, and a novelist's godlike relation to her characters is not an epistemology anyone has toward the actual world. Say plainly which parts of the real doctrine the students will have genuinely felt, and which parts I will have to assert from the front of the room because no in-fiction exercise can produce them.
reasoning: |-
  We are going to design an activity that simulates the creation of fictional characters, the accumulation of descriptive information about them, and then the discovery of an identity between two characters that feels both necessary and a posteriori. The goal is for students to experience the rigidity of names and the necessity of identity statements without prior philosophical vocabulary.

   Activity Title: The Identity Revelation Game

   Materials:
   1. Index cards (or printed cards) for each student to create character "dossiers". We'll have two types: "Name Cards" and "Trait Cards".
   2. A whiteboard to track the characters and their traits (initially without revealing identities).
   3. A timer.

   Setup:
   - Each student will create two characters. However, we are going to have a twist: unbeknownst to them, one of their characters will later be revealed to be the same as another character (from a different student or the same) but under a different name and set of traits.

   However, to make the "revelation" feel earned and not arbitrary, we need to design the game so that the identities are fixed at the beginning but the descriptions might be ambiguous or incomplete until the reveal.

   Revised Plan:

   We have 14 students. We want to create a scenario where there are multiple characters, and then we reveal that two of them (from different students) are actually the same person. But we also want the students to have agency in creating the characters and then feel the resistance to changing the identity after it's fixed.

   Alternative Structure:

   Step 1: Character Creation (30 minutes)
   - Each student creates one character. They are given two index cards: one for the character's name (Name Card) and one for the character's traits (Trait Card).
   - Rules for creation:
       a. The name must be a proper name (e.g., "Detective Anna Blake", "Mr. X", "Elena"). They are told: "This name is fixed. It refers to this character and no one else in the story. Even if the character changes, the name stays attached to that individual."
       b. On the Trait Card, they write three traits: one physical, one personality, and one event that happened to the character. They are told: "These are descriptions that are true of the character at this point in the story. They might change, or we might learn they were mistaken."

   Step 2: Story Setup (15 minutes)
   - The instructor collects all the Name Cards and puts them on the left side of the whiteboard. Then, the Trait Cards are collected and shuffled. The instructor then reads each Trait Card aloud and writes the traits under the corresponding Name Card (but without revealing which traits belong to which name). Instead, the instructor creates a list of traits on the board under a numbered list (Trait Set 1, Trait Set 2, ...) and next to each trait set, the instructor writes the name of the character it belongs to in a hidden manner (e.g., written on the back of the card or in a hidden column). This is just for the instructor's record.

   However, this might be too messy. Let's try a different approach.

   Revised Step 2: Story World Building (20 minutes)
   - Each student introduces their character by name and shares one of the traits (so they feel ownership). The instructor writes the character names on the board and under each, the three traits (as provided by the student). This creates a public dossier for each character.

   Problem: We want an identity reveal. So we need to have two names that actually refer to the same individual. But if each student creates one character, we have 14 characters. We can't reveal that two of them are the same without merging two students' work arbitrarily.

   Alternative: The Instructor Plants a Pair

   We can have 12 students create one character each, and then two students (without knowing) are given a special role: they are both creating the same character but with different names and different traits. But how to do that without it being arbitrary?

   Better: We have 14 characters, but the instructor secretly chooses two of them to be the same person. However, the students don't know which two. Then, the activity is to discover which two are the same.

   But that might not work because the students created them independently.

   Let's restructure:

   Step 1: Character Creation (30 minutes)
   - Divide the class into two groups: Group A (7 students) and Group B (7 students). Each group will create a set of characters for a shared story.

   Group A's Task: Create a set of characters that exist in the present day of the story.
   Group B's Task: Create a set of characters that exist in a flashback or a past timeline (20 years ago).

   Each student in Group A creates one present-day character (with a name and three traits).
   Each student in Group B creates one past character (with a name and three traits).

   The instructor then secretly pairs one present-day character with one past character and declares that they are the same person. But we want this pairing to be fixed and not known in advance. How to make it feel necessary? We need some clues.

   Step 2: Creating the Clues (20 minutes)
   - The instructor (without revealing the pairings) asks each student in Group A to write one additional trait on a new card: a "mystery trait" that hints at a connection to the past. For example, "has a scar on the left hand", "always hums a certain tune", "has a locket with an old photo". Similarly, Group B writes a "mystery trait" that might connect to the present (e.g., "had a twin", "was in an accident that left a scar", "composed a tune that became famous").

   Step 3: The Revelation (30 minutes)
   - The instructor reveals that one of the present-day characters is actually the same person as one of the past characters. But which one? The students must investigate by matching the traits. However, we want the traits to be ambiguous so that multiple matches are possible? But then the reveal might feel arbitrary. Alternatively, we want the traits to be such that only one match is possible? But that would make it a priori knowable.

   How to create the necessary a posteriori element? We want the identity to be fixed by the instructor at the beginning (so it's necessary in the fiction) but the traits to be consistent with multiple possibilities until the moment of revelation.

   Idea: The instructor, when creating the pairs, chooses one pair to be the identity. The traits are then used to create a red herring and a true connection. But we don't want the students to figure it out by deduction.

   Instead, let's have the instructor fix the identity arbitrarily at the beginning (e.g., by drawing two names out of a hat: one from Group A and one from Group B). Then, we let the students create the traits. The problem is that the traits might not match at all.

   Revised: The instructor, after the characters are created, secretly pairs one present character with one past character. Then, the instructor gives a clue that only applies to that pair. But that clue is not revealed until the end.

   How about:

   Step 2: The instructor secretly pairs one present character (say, present character X) with one past character (past character Y). Then, the instructor creates a "secret connection": a trait that both characters share and that is unique to them. But we don't tell the students what it is. Instead, we let the students propose connections.

   Step 3: The Investigation (30 minutes)
   - The instructor puts the present characters on one side of the board and the past characters on the other.
   - The students are told: "One of the present-day characters is actually the same person as one of the past characters. You have to figure out who. You can ask for more information by requesting to see a trait that might connect them."

   But we don't have a pre-built set of connections. So we need to build in some constraints.

   Alternative: We have the students from Group A and Group B exchange their mystery traits and then try to match them. But that might be too easy.

   Let's try a different activity structure that is more controlled.

   Proposed Activity: The Twin Cities Mystery

   Setting: There are two cities, City A (present) and City B (past). The characters from Group A live in City A (present). The characters from Group B lived in City B (20 years ago). The mystery: one person from City B moved to City A and is living there under a new identity (one of the present characters). The students must find out who.

   Step 1: Character Creation (30 minutes)
   - Group A (present): Each student creates a present-day character. They write:
       Name: [Proper Name]
       Three Present Traits: (physical, personality, event in the present)
   - Group B (past): Each student creates a past character. They write:
       Name: [Proper Name] (this name is different from the present character they will become, but it's the same person)
       Three Past Traits: (physical, personality, event in the past)

   The instructor then secretly chooses one present character and one past character to be the same person. The instructor does this by drawing two cards at random.

   Step 2: Building the Clues (15 minutes)
   - The instructor then asks the student who created the chosen present character to add a fourth trait: a "connection trait" that is a scar, a tattoo, a habit, or a physical feature that would have been present in the past and is still present now. Similarly, the student who created the chosen past character adds a fourth trait: a trait that would be a precursor to the present trait (e.g., if the present trait is "has a scar on the left hand", the past trait might be "had an accident that injured the left hand").

   Step 3: The Dossier (10 minutes)
   - The instructor collects all the character sheets. On the board, the instructor writes the present characters and their four traits (without labeling which one is the connection trait). Similarly, the past characters and their four traits.

   Step 4: The Investigation (45 minutes)
   - The students are divided into small groups (3-4 students). Each group is given the task of finding the connection. They are told: "One of the past characters is one of the present characters. Find who it is by matching the traits."

   - However, the connection trait is the only one that is designed to be a direct link. The other traits might be ambiguous or even contradictory (e.g., the past character had brown hair, the present character has gray hair; but that's because they aged). The groups are allowed to ask the instructor for more information. For example, they might ask: "Is there a past character who had an accident that injured the left hand?" The instructor can then reveal that past character Y had that accident. Then they might look for a present character with a scar on the left hand. But note: multiple past characters might have had accidents? And multiple present characters might have scars? We need to make the connection trait unique.

   So the instructor must design the connection trait to be unique. How? By ensuring that the connection trait added in Step 2 is the only one that directly links and is unique to that pair.

   But what if the students don't think of that trait? Then they might not find the connection.

   Alternatively, the instructor can make the connection trait the only one that is shared between the two. But then it becomes a puzzle that can be solved by matching.

   We want the students to feel that the identity was necessary and fixed, but that they had to discover it by investigation. The moment of revelation should be when they see that the connection trait matches and then they realize that the two names refer to the same person.

   However, there's a risk that the students will think the identity was determined by the traits (the descriptions). We want them to feel that the identity was there all along, independent of the traits.

   How to achieve that?

   Idea: The instructor, after the groups have had time to investigate and propose their guesses, reveals the true pair. Then, the instructor emphasizes that even if the traits had been different (e.g., if the accident never happened and there was no scar), the identity would still hold because the names were fixed to the same person. But how to demonstrate that?

   Step 5: The Revelation (15 minutes)
   - The instructor reveals the pair. Then, the instructor says: "Now, what if we change the story? What if we remove the scar? Would that change the identity?" The students will likely say no. The instructor can then point out that the identity was fixed by the author (instructor) at the beginning, and the traits were just ways to discover it.

   But we want them to feel the resistance to changing the identity. So:

   Step 6: The Retcon Challenge (15 minutes)
   - The instructor then asks: "What if we decided to change who the identical pair is? For example, what if we decided that actually, Past Character Z is Present Character W? How would that feel? What would we have to change?"

   - The students will then realize that they would have to change the traits (the connection trait would no longer work, and other traits might conflict). But more importantly, they might feel that the original pairing was necessary because it was fixed.

   Step 7: Debrief (30 minutes)
   - The instructor then explains the philosophical concepts:
       - The moment of assigning the names: that fixed the reference (rigid designation).
       - The identity statement (e.g., "Bruce Wayne is Batman") is necessary because it's true in every possible situation in the story (if we imagine different scenarios, Bruce Wayne is still Batman) but we could only know it by investigation (a posteriori).
       - The resistance to retconning: because once the identity is fixed, changing it feels like changing the world, not just a description.

   - Then, the instructor introduces the real-world example: the morning star and the evening star (both are Venus). It was an empirical discovery, but now we know it's necessarily true.

   What will go wrong:

   1. Some students might say that the identity was determined by the traits (the scar). They might say that the character with the scar is the same because of the scar. We need to emphasize that the identity was fixed by the instructor at the beginning and the scar was just a clue.

   2. Some students might want to change the identity during the investigation because they found a better match with the traits. We must prevent that by rules: the identity is fixed and cannot be changed.

   3. The investigation might be too easy or too hard. We can control the traits to make sure there is one clear connection trait that is unique.

   4. The activity might feel artificial. We can mitigate by stressing that in fiction, the author fixes the identities arbitrarily, but then the discovery must be earned by the clues.

   What the activity cannot reproduce:

   - In the real world, the necessity of identity (e.g., Hesperus is Phosphorus) is metaphysical and independent of human stipulation. In fiction, the necessity is by authorial fiat. The students will have genuinely felt the rigidity of names and the a posteriori nature of the discovery, but the necessity is only fictional necessity. We have to explain that in the debrief.

   Revised Timeline:

   Total: 3 hours

   1. Introduction (5 minutes): Explain the activity as a mystery game.
   2. Character Creation (30 minutes): Group A (present) and Group B (past) create characters.
   3. Instructor secretly pairs one present and one past character (5 minutes). Then, the instructor asks only the creators of the paired characters to add one more trait (the connection trait). (5 minutes)
   4. Building the Dossier: The instructor writes all characters and their traits on the board (including the connection traits, but without marking them as special). (10 minutes)
   5. Investigation in small groups (45 minutes): Groups discuss and try to find the pair. They can ask the instructor questions about the traits (e.g., "Is there a past character who had an accident involving the left hand?" and the instructor can answer by revealing the past character who has that trait). The goal is to find a present character with a matching trait and then propose that they are the same.
   6. Revelation (15 minutes): The instructor reveals the true pair. Then, the instructor challenges: "What if we changed the pairing? What if we said that actually, Past Character X is Present Character Y? How would that feel? What would we have to change?" (This is the retcon challenge.)
   7. Debrief (30 minutes): Map the activity to the concepts.

   Materials:
   - Index cards for each student (two per character: one for the name and one for the traits, but we can have one card per character).
   - Whiteboard markers.

   How to handle the connection trait:

   - The instructor must ensure that the connection trait is unique and that there are no other traits that could lead to a false positive. For example, if the past character has "had an accident that injured the left hand", then the present character must have "has a scar on the left hand" and no other present character should have a scar on the left hand. Similarly, no other past character should have an accident that injured the left hand.

   But note: we have 7 past characters and 7 present characters. It's possible that by chance two past characters have accidents? To avoid, the instructor can guide the students when they are adding the connection trait:

   - To the student creating the past character of the chosen pair: "Please add a trait that is a unique event or physical feature that would leave a distinctive mark in the present."
   - To the student creating the present character: "Please add a trait that is a physical feature or habit that could be traced back to a unique event in the past."

   And then the instructor can check that the traits are unique and link appropriately. If they are not, the instructor can ask the student to adjust.

   Alternatively, the instructor can provide a list of possible connection traits and have the students choose one that is unique. But that might break the immersion.

   We'll trust that the students can create unique traits. If they don't, the instructor can intervene and ask for a more distinctive trait.

   First time running it: What if the students don't find the pair?

   We can have a rule: after 30 minutes of investigation, if no group has found it, the instructor can give a hint: "Look for a trait that is a physical mark or a habit that is described in both the past and the present."

   Alternatively, we can have the groups present their best guess and then reveal.

   But we want the revelation to feel like a discovery. So we can have the groups present their guesses and then reveal the true one.

   How to ensure that only one group might get it right? They might all get it right if the clue is obvious. Or none. We can live with that.

   Summary of the Activity:

   1. Introduction (5 min): "We are creating a story set in two timelines: present and past (20 years ago). One person from the past has moved to the present and is living under a new identity. Your task is to find out who."

   2. Character Creation (30 min):
      - Group A (7 students): Each creates a present-day character (name and three traits: physical, personality, event).
      - Group B (7 students): Each creates a past character (name and three traits).

   3. Pairing and Connection Traits (10 min):
      - Instructor randomly draws one present character and one past character to be the same person.
      - The two students (one from Group A and one from Group B) who created these two characters are asked to add one more trait each (the connection traits) without knowing why. They are told: "Add one more trait: for the present character, add a physical feature or habit that is distinctive and might have an origin in the past; for the past character, add an event or feature that would leave a distinctive mark in the present."

      (Instructor checks that the connection traits are unique and form a clear link. If not, the instructor can ask for adjustments.)

   4. Dossier Building (10 min):
      - The instructor writes on the board:
          Present Characters:
            Name1: Trait1, Trait2, Trait3, ConnectionTrait1
            ...
          Past Characters:
            NameA: TraitA, TraitB, TraitC, ConnectionTraitA
            ...

   5. Investigation (45 min):
      - Divide the class into 3-4 groups (about 3-4 students per group). Each group is given a copy of the character list (or they can look at the board).
      - They discuss and try to find the pair. They can ask the instructor: "Is there a past character with [specific connection trait]?" and the instructor will answer by naming the past character that has it (if any) or saying none. Similarly for present characters.
      - The groups are to write down their guess: which past character is which present character.

   6. Revelation (15 min):
      - Each group announces their guess and the reasoning.
      - The instructor reveals the true pair. Then, the instructor asks: "What if we decided to change the identity? Suppose we say that actually, Past Character X is Present Character Y (a different pair). How would that change the story? What would we have to change about the traits? How does that feel?"
      - The students should express that it feels wrong, like changing history.

   7. Debrief (30 min):
      - Map to philosophy:
          a. When you gave the names to the characters, you fixed the reference (rigid designation). The name refers to that specific individual in all possible versions of the story.
          b. The identity statement (e.g., "Present Character X is Past Character Y") is necessary: in every version of the story, they are the same. But you could only know it by investigation (a posteriori).
          c. The resistance to retconning: because it feels like you are changing the identity of the individual, not just a description.

      - Explain the real-world example: the morning star and the evening star. It was a discovery that they are the same object (Venus). Now we know it's necessarily true, but we didn't know it until we did the astronomical investigation.

      - What we couldn't simulate: In reality, the necessity is not by human fiat but by the nature of the objects. In fiction, the author decides. But the feeling of rigidity and the a posteriori necessity is the same.

   This should take about 150 minutes (2.5 hours). We have 10 minutes buffer.

   Let me know if this works.
answer: |-
  ### **Activity Design: The Identity Revelation Game**  
  **Goal:** Students experience rigid designation (names locking onto characters) and necessary a posteriori identities (reveals that feel "true all along" but require investigation).  

  ---

  #### **Materials**  
  - **Index Cards:** 30 blank cards (15 for names, 15 for traits).  
  - **Whiteboard:** Divided into two sections: **CHARACTER BANK** (names) and **DOSSIER BOARD** (traits).  
  - **Sticky Notes:** For students to submit "investigation questions."  
  - **Timer:** For pacing.  
  - **Envelopes:** Two sealed envelopes labeled "REVEAL" (for the final twist).  

  ---

  #### **Step-by-Step Timeline (3 Hours Total)**  
  **Phase 1: Character Creation & Reference Fixing (30 mins)**  
  - **Rules:**  
    - Each student creates **one character** by writing a **unique name** (e.g., "Elena Vance") on a card. No descriptions yet!  
    - Instructor collects name cards, shuffles, and pins them to the **CHARACTER BANK** on the whiteboard.  
    - **Key Constraint:** "Once a name is on the board, it is *locked* to that character. Even if you learn new facts later, the name refers to *this specific person*, not a description."  
  - **Why:** Students "fix reference" via naming without realizing it.  

  **Phase 2: Building Dossiers (45 mins)**  
  - **Rules:**  
    - Students pair up. Each pair picks **two random names** from the CHARACTER BANK.  
    - For each name, they write **three trait cards** (e.g., "scarred cheek," "hates crowds," "stole a necklace"). Focus on *contingent* traits (could change or be misremembered).  
    - Trait cards are pinned under the names on the **DOSSIER BOARD**.  
  - **Instructor Secret:** Assign two characters (e.g., "Elena Vance" and "The Hooded Figure") as **secretly identical**. Note this privately but *do not* hint at it yet.  
  - **Why:** Traits are disguised descriptions; names are rigid.  

  **Phase 3: The Investigation (60 mins)**  
  - **Rules:**  
    1. **Prompt:** "Rumors suggest one character in the dossier is leading a double life. Find out who!"  
    2. **Clue Generation:**  
       - Students write questions on sticky notes (e.g., "Who has the scar?" "Where was the necklace stolen?").  
       - **Critical Rule:** Answers must come *only* from existing traits. *No new facts!*  
    3. **Discovery Protocol:**  
       - Groups propose identity theories (e.g., "We think ‘Elena Vance’ is ‘The Hooded Figure’ because both have a scar").  
       - **Rebuff Arbitrary Claims:** If traits don’t align, say: "The evidence is ambiguous. Keep digging."  
  - **Instructor Role:**  
    - If students guess the secret pair *correctly*, reveal it immediately.  
    - If they guess *wrongly*, say: "The traits *could* support this, but let’s test if it breaks the world."  
    - If stuck, hint: "Focus on *where the traits overlap*."  
  - **Why:** Forces reliance on traits while hiding that identities are pre-fixed.  

  **Phase 4: The Reveal & Retcon Challenge (15 mins)**  
  - **The Twist:**  
    - Open the "REVEAL" envelope containing the secret identity (e.g., "Elena Vance = The Hooded Figure").  
    - Students check if traits align. If not, note contradictions (e.g., "Elena is outgoing, but the Hooded Figure is reclusive").  
  - **Retcon Challenge:**  
    - Propose changing the identity (e.g., "What if ‘Elena’ is *actually* ‘The Courier’ instead?”).  
    - Students vote: Does this feel like **discovering truth** or **changing history**?  
  - **Why:** Highlights that identities feel necessary *once fixed*, but traits alone don’t determine them.  

  **Phase 5: Debrief (30 mins)**  
  - **Map the Activity to Philosophy:**  
    | **Activity Moment**          | **Philosophical Concept**                     |  
    |------------------------------|-----------------------------------------------|  
    | Naming characters            | Fixing reference (rigid designation)          |  
    | Discovering identities       | Necessary a posteriori truth                  |  
    | Resistance to retconning     | Intuition of necessity (Kripke)               |  
    | Traits failing to determine ID | Descriptions vs. rigid designators          |  
  - **Introduce Real Examples:**  
    - "In fiction, 'Bruce Wayne is Batman' feels necessary once revealed—but you need the story to know it. In reality, 'Hesperus is Phosphorus' (Venus) is necessary but was discovered through observation."  
  - **Emphasize Limits:**  
    - ✅ **Felt by Students:** Rigidity of names, a posteriori discovery, "necessity within fiction."  
    - ❌ **Must Explain:** Metaphysical necessity (real-world identities aren’t author-dependent). Authors have godlike power; real epistemology doesn’t.  

  ---

  #### **Predictable Problems & Solutions**  
  1. **"But the traits prove it was them all along!"**  
     - **Solution:** Ask: "Could the traits have pointed to someone *else* if we wrote them differently? The name locks the person—the traits just help us find them."  

  2. **Students rewriting mid-game:**  
     - **Solution:** Enforce rules: "Traits are frozen after Phase 2. You must work with what’s there—no new facts!"  

  3. **Confusion during investigation:**  
     - **Solution:** Use guided questions: "Does this trait *define* the character, or describe them? What if the scar fades? Does the name still point to the same person?"  

  ---

  #### **What the Activity Captures (and What It Can’t)**  
  - ✅ **Authentically Felt:**  
    - The "click" of a reveal feeling inevitable once discovered.  
    - Frustration at retconning (feels like cheating, not learning).  
    - Names as "unbreakable" anchors despite changing traits.  
  - ❌ **Requires Explanation:**  
    - **Fictional vs. Metaphysical Necessity:** Students experience necessity *within a constructed world*, but real-world necessity (e.g., water = H₂O) isn’t authored—it’s mind-independent.  
    - **Epistemology:** Authors have omniscient power; real agents discover identities through empirical evidence, not narrative fiat.  

  ---

  **Final Tip:** Run the activity twice if possible. Students grasp the rigidity of names faster on the second round, deepening their intuition. By the debrief, they’ll have the visceral "aha" needed to transplant these ideas into their writing—no lecture required.
