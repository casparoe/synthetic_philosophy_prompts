answer: |-
  **1. Was the incident caused by failure in non-representational components (e.g., hardware, network, or power)?**  
     - *Sufficient answer:* Evidence from system logs or diagnostics showing physical/mechanical faults, environmental disruptions, or infrastructure errors.  
     - *Terminate if yes:* Do not attribute content to the system; the fix targets non-representational elements.  

  **2. Can the system’s output or internal state during the incident be mapped to a specific representation (e.g., a label, class, or decision) using its design or training data?**  
     - *Sufficient answer:* Logs, model outputs, or configuration files confirm the system assigned a discrete symbol (e.g., "fraudulent," "stationary") to the input.  
     - *Terminate if no:* Do not attribute content; hand to policy to define or investigate representation ambiguity.  

  **3. Does the system’s design history (specifications, training data, or documentation) explicitly define the intended meaning of the representation observed in question 2?**  
     - *Sufficient answer:* Design documents, requirement specs, or training labels specify what the representation denotes (e.g., "quarter" for a coin-acceptor design).  
     - *Terminate if no:* Do not attribute content; the meaning is undefined, and the fix requires policy intervention.  

  **4. Does the system’s current behavior in the incident equally align with two distinct candidate contents (e.g., the representation fits both "quarter" and "balboa")?**  
     - *Sufficient answer:* Input data and system behavior are indistinguishable under both interpretations (e.g., identical sensor readings for both contents).  
     - *Terminate if no:* Attribute the content defined in design history (from question 3); no further ambiguity.  

  **5. Is the choice between candidate contents (from question 4) resolvable solely by operational or business policy (e.g., redefining scope, tolerances, or priorities)?**  
     - *Sufficient answer:* Technical evidence cannot break the tie; resolution depends on human judgment (e.g., whether to prioritize historical design or current context).  
     - *Terminate if yes:* Attribute no content; hand to policy for a non-factual decision. If no, attribute the design-defined content (from question 3).
