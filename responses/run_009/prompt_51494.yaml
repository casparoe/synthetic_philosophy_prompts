      2. Can the specific internal representation formed by the system (e.g., the output class, label, or belief) be determined from available data (such as system logs or model outputs)? [If no, terminate: cannot attribute specific content; hand to policy for further investigation.]

      3. Is there documented design intent (in specifications, training data, or requirements) that defines what the representation (determined in question 2) is supposed to mean? [If no, terminate: cannot attribute meaning; hand to policy.]

      4. Was the representation produced by the system's normal operation (i.e., by the intended model or algorithm without software faults or unanticipated external influence on the software)? [This question does not terminate; it informs the report.]

      5. Was the input that led to the incident within the scope of the system's design (as defined in documentation)? [This question does not terminate; it informs the report.]

      Then the panel attributes content as: the design meaning of the representation.

      And the report includes notes from 4 and 5.

