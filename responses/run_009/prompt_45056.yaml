     Terry is a data analyst at a marketing firm. Terry must finish a quarterly report by the end of the day to meet a strict deadline. Terry knows that, in order to complete the report on time, he will have to use a shared server that will slow down the network for his colleague Sam, who is working on a less urgent project. Terry is indifferent to the slowdown for Sam. Terry uses the server, and Sam's work is slowed down.

