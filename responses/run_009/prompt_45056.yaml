answer: |-
  ### Vignettes

  **Harm Case (Not Blameworthy):**  
  Jordan is a graphic designer at a publishing house, finalizing layouts for a client’s urgent catalog to meet a 5 PM deadline. Jordan must use a specialized printer that monopolizes the office’s high-bandwidth network. Jordan knows this will disrupt Alex’s video call with an international vendor, causing Alex to miss a contract renewal window. Jordan is indifferent to Alex’s disruption but cannot avoid the printer without missing the deadline. Jordan uses the printer, and Alex’s call fails.  

  **Help Case (Praiseworthy):**  
  Jordan is a graphic designer at a publishing house, finalizing layouts for a client’s urgent catalog to meet a 5 PM deadline. Jordan must use a specialized printer that temporarily reroutes unused bandwidth. Jordan knows this will stabilize Alex’s lagging video call with an international vendor, ensuring Alex secures a contract renewal. Jordan is indifferent to Alex’s improved call but cannot avoid the printer without missing the deadline. Jordan uses the printer, and Alex’s call succeeds.  

  ---

  ### The Inversion Feature: **Avoidability of the Side Effect**  
  In both vignettes, the side effect is **unavoidable** if Jordan is to achieve the core aim (meeting the deadline). Jordan *cannot* complete the task without producing the side effect, eliminating alternatives.  

  #### Why This Inverts the Asymmetry:  
  - **Harm Case (No Blame)**: The unavoidable harm is excused as a "necessary evil." Blame is blocked because Jordan had no choice; the harm was inevitable given the constraints.  
  - **Help Case (Praise)**: The unavoidable help is framed as a "free benefit." Praise persists because the help is seen as a windfall gain—even unintended, it exceeds baseline expectations.  

  ---

  ### Theory Check  
  **1. Norm-Violation Account**:  
     - **Prediction**: Blame arises if the side effect violates a norm.  
     - **Harm Case**: No norm violation → No blame. The unavoidable harm aligns with norms of prioritizing urgent deadlines.  
     - **Help Case**: Norm compliance → Praise. The unavoidable help fulfills a latent norm of mutual aid (e.g., "support colleagues when possible").  
     - **Accommodation**: Easily explains both outcomes by appealing to context-dependent norms. Must concede that norms flexibly incorporate unavoidability (e.g., "avoid *gratuitous* harm").  

  **2. Reason-Explanation Account**:  
     - **Prediction**: Blame arises only if the agent acted *for* a bad reason (e.g., the harm itself).  
     - **Harm Case**: No blame. Jordan’s reason was meeting the deadline, not causing harm. Unavoidability underscores indifference.  
     - **Help Case**: Praise. The lack of alternatives severs the link between intention and outcome—observers infer a "lucky" good reason.  
     - **Accommodation**: Struggles with praise. Must concede that unintended benefits can be attributed to latent goodwill when no bad motive exists.  

  **Kinder to Norm-Violation**: The norm account cleanly handles both cases by tying evaluations to contextual rules. The reason-explanation account requires strained attributions of "latent reasons" in the help case.  

  ---

  ### Defense Against Objections  
  **Objection**: "This isn’t the side-effect effect—it’s about *excuses* (harm case) or *framing* (help case), not the core asymmetry."  
  - **Rebuttal**: Unavoidability is intrinsic to the side effect’s structure, not an external excuse. The classic effect holds avoidability constant (e.g., the chairman *could* choose differently). Here, unavoidability directly modulates the valence-dependent asymmetry.  

  **Minimal Modification to Restore Original Asymmetry**:  
  Add a single line to both vignettes:  
  > *"Jordan could have used a slower printer upstairs, avoiding the side effect but risking a 10-minute delay."*  
  **Result**:  
  - **Harm Case**: Blame returns (avoidable harm violates norms).  
  - **Help Case**: Praise vanishes (avoidable help implies indifference to benefits).  
  **Why**: Avoidability restores agency, reengaging the original mechanism. Without it, the inversion holds.  

  **Conclusion**: This case stresses both accounts but favors norm-violation. Unavoidability dissociates side-effect judgments from valence, revealing contextual norms as the asymmetry’s engine.
