prompt: |-
  I'd like your help thinking through a running disagreement I have with a colleague, a philosopher of science, about what actually survives when one theory is abandoned for another. Over the years she has delivered verdicts on a series of historical cases, and next week a new one comes up for discussion; I want to predict her answer before she gives it, and I want the prediction made properly rather than jumped to. Her verdicts so far are these. When the ether-based wave theory of light was replaced, she said the ether died but the equations lived on, and that this survival is what makes the episode a success rather than a mere refutation. On phlogiston she is adamant that nothing survived, not even the thought that combustion and respiration have something important in common, because the theory's unobservables were doing all the explanatory work and they were the wrong unobservables. On the crystal spheres of Ptolemaic astronomy she likewise says nothing survived except the observed planetary positions, which she refuses to count as survival at all, since the observations are not the theory's. On caloric she is genuinely torn: the mathematics of heat flow carried over into later accounts of diffusion, but she says the equations were reinterpreted so thoroughly that she cannot decide whether that is survival or coincidence. On Newtonian gravity she says the theory was absorbed rather than refuted, retained as a limiting case of its successor, which she counts as a third kind of survival, distinct from both the ether case and the phlogiston one. And on the old quantum theory giving way to matrix mechanics she says the formal analogies exploited by the correspondence principle survived, while Bohr's electron orbits did not, even though the orbits had featured in the derivations of the hydrogen spectrum. She is also emphatic on two negatives: predictive success by itself is never survival, and no unobservable object has ever survived a theory change. The new case is general relativity and whatever quantum gravity turns out to be. Suppose a future theory replaces general relativity, keeps its predictions in the regimes where it now works, recovers the field equations in an appropriate limit, but explains the metric field as emergent from something more fundamental, in something like the way thermodynamic quantities turn out to be statistical. Does she say anything survived? Predict her verdict, and do it by first laying out the candidate rules that fit her earlier verdicts — for example a rule about retained mathematical structure, a rule about retained working posits, and a rule about limiting-case absorption — and then saying which rule each earlier verdict supports and where those rules pull apart on the new case. Give me your best guess with your reasons, tell me which feature of the new case is doing the work, and describe a further case from the actual history of science, not a fantasy, that would best tell the candidate rules apart. Please write your answer in continuous prose, as one would in a letter, with no headings, bullet points, bold text or tables, and in British English.
reasoning: |-
  Hmm, the user wants me to help predict how their philosopher colleague would view whether anything "survives" when general relativity is replaced by quantum gravity. They've provided several historical cases with their colleague's verdicts on what survived when old theories were replaced.

  Looking at these cases: For ether theory, the equations survived but the ether concept died. For phlogiston, nothing survived. For crystal spheres, only observations survived which don't count. For caloric, she was torn about the mathematics. For Newtonian gravity, it survived as a limiting case. For the old quantum theory, formal analogies survived but electron orbits didn't. She also has two clear negatives - predictive success alone isn't survival, and no unobservable has ever survived.

  The new case involves quantum gravity replacing general relativity while keeping its predictions in applicable regimes, recovering field equations as a limit, and explaining the metric as emergent from something more fundamental - similar to how thermodynamics emerges from statistical mechanics.

  I need to develop candidate rules that fit her previous verdicts. There seem to be three main patterns: Retained mathematical structure (like in ether theory), limiting-case absorption (like Newtonian gravity), and formal analogies (like in the quantum theory case). But she rejects mere observational survival and survival of unobservables.

  For the quantum gravity case, the metric field being emergent seems crucial. Since she believes no unobservable object survives theory change, and the metric field is unobservable in GR, this suggests she would say it doesn't survive. However, the mathematical structures surviving as a limiting case might qualify as survival through absorption, similar to Newtonian gravity.

  There's tension here. The limiting-case recovery pulls toward survival verdict, while the unobservable nature of the metric field pulls against it. Given how adamant she was about phlogiston's unobservables not surviving, and how she refused to count observations as survival in the crystal spheres case, I think the unobservable principle might win out. She would likely say nothing substantial survived except the limiting-case mathematics.

  A good historical test case that would differentiate these principles is the transition from Fresnel's elastic solid ether to Maxwell's electromagnetic field theory. Fresnel's equations survived and were reinterpreted, but his mechanical ether was abandoned. This would test whether she focuses on mathematical survival or the abandonment of unobservables.

  So my prediction is that for quantum gravity replacing GR, she would say nothing survived except the mathematical structures in the classical limit, and she would not count the metric field itself as having survived due to its unobservable nature. The emergence aspect particularly undermines any claim to the metric's survival.
answer: |-
  My dear colleague,

  Your challenge is a fascinating one, and it requires careful unpacking of your philosopher friend's nuanced position. To predict her verdict on the quantum gravity case, we must first distil the implicit principles guiding her past judgements. Her verdicts reveal a sophisticated, multi-faceted view of scientific progress that resists simple reduction but clearly hinges on specific types of theoretical elements persisting through change, while rejecting others categorically.

  From the cases you recount, three candidate rules seem to underpin her reasoning:

  1.  **Retained Mathematical Structure:** Mathematical equations or formalisms can survive theory change intact, even when the ontological interpretation (the 'what it is about') changes radically. This constitutes genuine survival and marks the episode as progressive. The ether case is the paradigm: Maxwell's equations lived on, shorn of the mechanical ether substrate. The caloric case's ambiguity stems precisely from her uncertainty over whether the heat flow equations were truly *retained* or merely coincidentally resembled later diffusion mathematics.

  2.  **Limiting-Case Absorption:** A theory can survive not as a fundamental truth, but as a highly accurate approximation derivable as a special case (a 'limit') within a broader, more fundamental successor theory. This is distinct from mere equation retention and constitutes a different kind of survival, as seen in Newtonian gravity becoming a low-velocity, weak-gravity limit of general relativity.

  3.  **Formal Analogies/Correspondence:** Structural relationships or formal analogies exploited within the old theory for calculation or heuristic purposes can survive and find a rigorous foundation in the new theory. This is distinct from retaining specific entities or even exact equations, as demonstrated by the survival of the correspondence principle's formal analogies from the old quantum theory into matrix/quantum mechanics, while Bohr's specific electron orbits perished.

  Crucially, she emphatically rejects two things as constituting survival:

  *   **Predictive Success Alone:** Mere empirical adequacy in a domain (like the Ptolemaic planetary positions) does not count as theoretical survival; it's just data the new theory must account for, not a piece of the *old theory* living on.
  *   **Survival of Unobservable Objects:** No unobservable entity postulated by a theory (phlogiston, the crystalline spheres, the ether *as a substance*, caloric fluid, Bohr's orbits) ever survives theory change. Their explanatory role is entirely usurped or invalidated.

  Now, applying these rules to the quantum gravity case:

  *   **Predictions Kept:** This is explicitly stated but, according to her rule, this alone is *not* survival. It's necessary for the new theory to be viable, but doesn't signify anything of the *old theory* surviving.
  *   **Field Equations Recovered as a Limit:** This strongly suggests **Limiting-Case Absorption (Rule 2)**. General Relativity's mathematical core (the Einstein field equations) would be derivable from the quantum gravity theory under specific conditions (e.g., low energy, large scales). This parallels the Newtonian gravity case, which she deemed survival.
  *   **Metric Field as Emergent:** This is the critical point. The metric field in GR is the fundamental dynamical entity, the 'spacetime' itself. While not tangible, it is a postulated unobservable *object* (or field) doing the explanatory work. Her adamant stance that **no unobservable object ever survives (Negative Rule 2)** pulls decisively against survival. Explaining it as emergent from something more fundamental is akin to explaining the ether's effects via electromagnetic fields without the ether substance, or thermodynamics emerging from statistical mechanics without caloric fluid. In those cases (ether, caloric), the unobservable object died, even if mathematics survived or was reinterpreted.

  Here lies the tension. The recovery of the field equations as a limit strongly suggests survival via absorption (Rule 2). However, the explicit demotion of the metric field – the core ontological object of GR – from fundamental entity to emergent phenomenon directly invokes her principle that unobservable objects do not survive (Negative Rule 2). This is reminiscent of the ether: the equations (mathematical structure, Rule 1?) survived, but the ether (unobservable object) did not. Yet, in the ether case, she called it survival *because* of the equations. The quantum gravity case differs in that the mathematics is recovered *as a limit* (Rule 2), not necessarily retained intact as fundamental equations (Rule 1 might be less applicable).

  Nevertheless, the feature doing the heaviest lifting is the **emergence of the metric field**. Given her verdicts on phlogiston (wrong unobservables, nothing survived) and ether (equations survived, but not the unobservable ether substance), and her specific emphasis that *no unobservable object* survives, I believe this principle will dominate her reasoning. She will likely argue that while the mathematical description of spacetime *behaviour* survives approximately in a limit (constituting a form of progress/survival for the *predictive framework*), the fundamental *entity* postulated by GR – the metric field as a basic constituent of reality – has been abandoned and replaced. Therefore, she would probably conclude that **nothing *substantial* survived except the limiting-case mathematical description**, and she would explicitly *not* count the metric field itself as having survived.

  My best guess, therefore, is her verdict will be: **No, the fundamental ontology (the metric field) did not survive; only its mathematical description survives as an emergent approximation in a limiting case.** She might see this as analogous to the ether case (equations survive, ontology dies) but noting the added feature of limiting-case recovery makes it closer to a blend of that and the Newtonian case, yet the ontological abandonment of the core unobservable tilts it towards a verdict emphasising loss over substantial survival of the theory's essence.

  To test these candidate rules against each other, a compelling historical case is the transition from **Fresnel's elastic solid ether theory of light** to **Maxwell's electromagnetic field theory**. Fresnel derived mathematically precise descriptions of reflection, refraction, diffraction, and polarisation using a mechanical model of light as vibrations in an all-pervading elastic solid ether. Maxwell developed a theory based on dynamical electromagnetic fields, deriving wave equations for these fields propagating in vacuum. He showed that Fresnel's equations for reflection/refraction coefficients *could be derived* from his theory under certain assumptions, though the underlying mechanism (mechanical stresses in a solid vs. dynamical fields) was utterly different. Crucially, the *ether as a mechanical solid* was abandoned, but the precise mathematical relationships Fresnel found for light's behaviour at interfaces survived and were given a new foundation. This tests the rules:
  *   Does the survival of Fresnel's precise *mathematical equations* (Rule 1) constitute survival, even though the ontology (elastic solid ether) is abandoned (invoking Negative Rule 2)?
  *   Is it more like limiting-case absorption (Rule 2) if Maxwell's theory recovers Fresnel's results under specific conditions?
  *   Or, since the *equations* are retained exactly (not just analogies), does it fit Rule 1 clearly, overriding the abandonment of the unobservable ether? (This is essentially her verdict on the later ether case you mentioned).
  *   Contrast this with phlogiston, where *no* significant mathematical structure survived intact. How she parsed the Fresnel-to-Maxwell transition would be highly revealing, particularly whether she emphasises the equation retention as survival (like the later ether) or focuses on the abandonment of the unobservable mechanical ether as a loss preventing full survival.

  I suspect her view on Fresnel/Maxwell would align with her ether verdict: survival of the equations, death of the ontology. The quantum gravity case, however, pushes further by not just replacing the ontology but demoting the fundamental *status* of GR's core entity via emergence, while still recovering its mathematics as a limit. It’s precisely this emergence that I believe will lead her to deny substantial survival. I look forward to hearing how her actual verdict compares.

  Yours sincerely,

  A Fellow Enquirer
