  We are designing an in-class activity to illustrate the symbol grounding problem. The core idea is to have two groups: one with a purely symbolic mapping table (ungrounded) and one with the same table plus a few grounded tokens (grounded). The challenge is to make the ungrounded condition feel almost workable but ultimately impossible to achieve real meaning, while the grounded condition can succeed.

  Brainstorming alternative staging options:

  1. **Option A: Language Translation Game**
     - Students are given a set of sentences in an unfamiliar artificial language and must translate them using a dictionary. The ungrounded group gets a dictionary entirely in the same artificial language, while the grounded group gets the same dictionary plus a few words with pictures or objects.
     - *Rejected because:* It might be too abstract and not involve direct interaction with the world. Also, translation without grounding might still feel like they are making progress by manipulating symbols, but we want them to feel the lack of connection to the world.

  2. **Option B: Robot Command Simulation**
     - Students must write commands for a "robot" (played by the instructor) to perform tasks in the room. The ungrounded group has a command language defined only by other commands, while the grounded group has some basic commands tied to actual actions (e.g., "walk" means to take a step).
     - *Rejected because:* The robot's actions might be too ambiguous and the success of the grounded group might be too obvious. Also, the ungrounded group might feel they are making progress by composing commands that look right but without meaning.

  3. **Option C: Sorting Physical Objects**
     - Students must sort a collection of objects (e.g., colored blocks, shapes, etc.) into categories. The ungrounded group has a set of category labels defined only by relations to other labels, while the grounded group has a few labels that are explicitly tied to a property (e.g., "red" is shown with a red object).
     - *Rejected because:* It might be too simple and the ungrounded group might quickly realize the futility. We need a more elaborate system to create the "fluent nonsense" feeling.

  However, we can take elements from these. The core staging I have in mind (with objects and tasks) is promising. We'll design a hybrid: a set of tasks including sorting objects, executing instructions, and answering questions. The key is the mapping table.

  **Chosen Staging: The Alien Manual Activity**

  We will create an artificial script (let's call it "Alien Script") with a mapping table that has internal structure (compositionality, grammar, etc.). The table will be a set of entries that map from one symbol to other symbols, but without any external reference. The grounded group will get a few "grounding cards" that tie a few symbols to actual things in the room (e.g., a card that says "symbol X means the color of the wall", with a picture of the wall, or an actual object).

  **Design of the Mapping Table:**

  - We need a small set of primitive symbols (about 5-10) and then more complex symbols built from them. The table will be a dictionary that defines each symbol in terms of other symbols. The trick is to have a consistent structure so that the system feels productive.

  - We'll create a simple compositional system. For example:
    - Primitive symbols: A, B, C, D, E (about 5)
    - Complex symbols: made by concatenation, e.g., AB, AC, etc.
    - The dictionary will have entries for each symbol, defined using other symbols. But note: we must avoid circular definitions that are too obvious, and we must have a recursive structure so that complex symbols are built from simpler ones.

  - Example structure (using English letters for clarity; in reality we use an invented script):

    - Primitive symbols: 
        - "ZOT" = "KLO"
        - "KLO" = "ZOT" (this is a circular pair to create a sense of interdependence)
        - "FUB" = "ZOT KLO" (meaning: the combination of ZOT and KLO)
        - "BOL" = "FUB ZOT"

    But note: this is too arbitrary and might feel like nonsense. We need a system that appears to have a pattern.

