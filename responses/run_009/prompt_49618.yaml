          ● : "▲ ■"   [arbitrary]
          ▲ : "■ ●"
          ■ : "● ▲"
          ★ : "● ◆"
          ◆ : "★ ●"
        Complex:
          ◕ : "● ▲"
          ◔ : "◆ ▲"
          ◑ : "★ ◆"

      Tasks:

        Sorting: 
          Objects: 5 red blocks, 5 blue blocks, and 5 green blocks (green to have a distractor). 
          Categories: ◕ and ◔. 
          The green blocks have no category, so the students should not sort them? Or we can have a third category ◑, but we haven't grounded green. We'll say only two categories.

          So only sort the red and blue blocks. The green ones can be left out.

        Action instructions:

          Instruction 1: "▲ ★ ●"   -> put a block on a red object (which can be a red block or any other red object we provide, like a red book).
          Instruction 2: "◆ ★ ●"   -> put a blue object on a red object.

          We provide: red block, blue block, green block, red book, blue book.

      This should work.

  **Materials Construction:**

    - Alien script: Create symbols for ●, ▲, ■, ★, ◆, ◕, ◔, ◑. Use simple, distinct shapes. Make a mapping table handout for each group with two columns: Symbol and Definition.

    Example of the table (in alien script):

      Symbol    Definition
        ●         ▲ ■
        ▲         ■ ●
        ■         ● ▲
        ★         ● ◆
        ◆         ★ ●
        ◕         ● ▲
        ◔         ◆ ▲
        ◑         ★ ◆

    - Grounding cards (for grounded groups only): Three index cards.

          Card 1: Symbol ● with a red color patch and the word "red" (but note: we don't want English, just the patch and the symbol). Alternatively, just a red patch and the symbol.
          Card 2: Symbol ◆ with a blue patch.
          Card 3: Symbol ★ with a simple diagram: one square on top of another and an arrow.

    - Sorting materials:
          - 5 red blocks, 5 blue blocks, 5 green blocks.
          - Two bins or areas labeled with ◕ and ◔.

    - Action materials:
          - A red block, a blue block, a green block, a red book, a blue book, and a small whiteboard (or any other objects) placed on a table.
          - Instruction cards for actions (written in alien script):

              Card 1: "▲ ★ ●"   [symbols for ▲, ★, ●]
              Card 2: "◆ ★ ●"

    - Question task: We'll skip to save time.

  **Timeline (90 minutes):**

    0-5 min: Introduction
      - Explain that today we are doing an activity about communication and meaning.
      - Split into 4 groups of 4. Assign two groups to condition A (ungrounded) and two to condition B (grounded). Do not reveal the difference yet.

    5-10 min: Distribute materials
      - All groups get the mapping table handout and the set of objects for sorting.
      - Condition B (grounded) groups additionally get the three grounding cards.

    10-15 min: Explain tasks
      - "Each group has two tasks to complete within 30 minutes. You will be scored."
      - Task 1: Sorting. Sort the objects into the categories labeled with these two symbols (◕ and ◔). Note: not all objects may belong to a category.
      - Task 2: Action. Perform the actions described on these two instruction cards. You must do exactly what the card says.
      - Scoring: 
            Sorting: 1 point per object correctly placed (max 10 points, because there are 10 red and blue blocks).
            Action: 5 points per correctly performed action (max 10 points).
            Total: 20 points.

    15-45 min: Group work (30 minutes)
      - Groups work on the tasks. The instructor circulates and observes, but does not help.

    45-55 min: Scoring and reporting
      - Each group demonstrates their sorted categories and performs the actions.
      - Instructor scores them and writes scores on the board.

    55-75 min: Debrief discussion
      - Start by asking the groups about their experience.
      - Questions:
          - To ungrounded groups: How did you decide what the symbols meant? Did you feel like you understood the system? What was challenging?
          - To grounded groups: How did the grounding cards help? How did you use the table in addition to the grounding cards?
      - Highlight the difference in outcomes: grounded groups likely scored higher.

    75-85 min: Connect to philosophy
      - Ask: "What do you think was the key difference between the groups that had the grounding cards and those that didn't?"
      - Guide to the idea that the grounding cards provided a direct link to the world (ostension) that allowed the symbols to have meaning.
      - Point out: the ungrounded groups might have felt they were making progress (they might have sorted the objects in some way and performed actions) but without real understanding.

    85-88 min: Reveal the name of the problem: the symbol grounding problem, and mention Harnad.

    88-90 min: Wrap up.

  **Predictable Problems and Handling:**

    1. **Problem:** The ungrounded groups might not do anything and get frustrated.
       - *Handling:* Circulate during group work and encourage them to try their best, even if it's a guess. Remind them that they can use the table to relate symbols.

    2. **Problem:** The grounded groups might not figure out that they can use the table to extend the grounding (e.g., for ◕ = ● ▲).
       - *Handling:* The instructor can ask prompting questions during group work: "How might the table help you understand the complex symbols?"

    3. **Problem:** The action task might be ambiguous (e.g., which block to use?).
       - *Handling:* Accept any correct interpretation (e.g., any block on any red object).

    4. **Problem:* The groups might finish at different times.
       - *Handling:* Have extra tasks (e.g., try to write a new instruction) for groups that finish early.

    5. **Problem:* The ungrounded groups might cheat by imitating the grounded groups.
       - *Handling:* Separate the groups physically and monitor.

  **Limitations of the Activity:**

    - The grounding is provided by the instructor via the grounding cards, and the participants use their own cognitive apparatus to connect the symbols to the world. In a real symbol grounding problem for an AI, the grounding would have to be done by the system itself, via its own sensors and actuators. The activity does not show how grounding can be internal to the system.

    - The activity might give the impression that grounding is simply attaching symbols to things in the world, but Harnad's point is also about the sensorimotor ability to interact with the world. Our activity does not involve any learning or interaction beyond the ostension.

    - The ungrounded group's experience of "fluent nonsense" might not be fully achieved if they quickly give up. We rely on the competitive element to keep them engaged.

  Despite these limitations, the activity should create a vivid experience of the difference between grounded and ungrounded symbols.
