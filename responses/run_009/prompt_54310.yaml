  Okay, the user is teaching intro ethics and is frustrated with students oversimplifying the is-ought gap. They want a thought experiment that seems to derive a moral "ought" from descriptive "is" statements, with strict constraints: no definitional tricks, no smuggled norms, real-world setting, and categorical (not instrumental) obligation. 

  Hmm... this is tricky because Hume's point is precisely that such derivations always cheat. But the user knows that—they want me to walk into the trap then dissect it. The real value is in the audit part where we expose the hidden norm. 

  For the scenario, I consider a landlord case: descriptive facts about lease terms + tenant's circumstances → obligation not to evict. But "obligation" is already normative poison. Maybe "harm" is the smuggler? Or "need"? Let me sketch: 

  Premises: 
  1. Lease clause requires 30-day notice for nonpayment (descriptive) 
  2. Tenant lost job, can't pay (descriptive) 
  3. Eviction tomorrow would make tenant homeless (descriptive) 
  4. Homelessness causes severe harm (ah, here's the wolf in sheep's clothing!) 

  Conclusion: Landlord ought not to evict tomorrow. 

  But premise 4 pretends "harm" is neutral—it's not. We all agree homelessness harms, but that agreement rests on unstated norms about well-being. Hume would say: "Harmful by whose standard? You're sneaking in 'oughts' about human flourishing!" The open question test highlights this: "I grant it's harmful, but is it *wrong*?" still makes sense. 

  If I ban "harm," the whole thing collapses into pure description with no moral force. Verdict has to be "gap holds"—but the exercise forces students to spot the sleight of hand. 

  User's last line requirement is brutal. No cheating.
answer: |-
  ## The Tenant's Lease

  Alex, a landlord, reviews the lease agreement signed by tenant Sam. Clause 7(b) states: "If Tenant experiences sudden, catastrophic loss of income through no fault of their own (e.g., unexpected job loss, major medical event), and provides documented proof within 48 hours of the triggering event, Landlord must postpone any pending eviction for non-payment of rent for a minimum of 60 days to allow Tenant time to secure alternative housing or income." Sam emailed Alex yesterday, attaching hospital bills and a termination letter proving he lost his job and incurred massive medical debt due to a sudden accident. Alex has scheduled Sam's eviction for tomorrow morning. After verifying the documents satisfy Clause 7(b)'s requirements, Alex cancels the eviction notice for the next 60 days.

  **The Audit:**

  *   **Premises:**
      1.  Alex and Sam signed a lease agreement containing Clause 7(b). (Descriptive: fact of agreement existence)
      2.  Clause 7(b) states: "If Tenant experiences sudden, catastrophic loss of income through no fault of their own... Landlord **must** postpone any pending eviction... for a minimum of 60 days..." (Descriptive: semantic content of the clause)
      3.  Sam lost his job and incurred massive medical debt due to a sudden accident. (Descriptive: event occurrence)
      4.  Sam provided documented proof (hospital bills, termination letter) to Alex within 48 hours of the accident/job loss. (Descriptive: action and timing)
      5.  Alex verified the documents satisfy Clause 7(b)'s requirements. (Descriptive: cognitive state/action)
      6.  Alex has scheduled Sam's eviction for tomorrow morning. (Descriptive: planned action)

  *   **Covertly Normative Premise?** Premise 2 contains the word **"must"**. While presented descriptively (reporting the text), the word "must" is inherently normative. It prescribes an obligation. The semantic content being described *is itself* a normative statement. This is the smuggling.

  *   **Humean Block:** A Humean would argue the inference relies entirely on the *normative force* of the contract clause itself, which is smuggled in via Premise 2. The premises describe a factual agreement (Premise 1) and the clause's wording (Premise 2), but the *binding obligation* of the clause ("must") is not a brute fact like the color of the paper it's written on. It depends on antecedent normative principles like *"Contracts (or promises) create obligations"* or *"Written agreements ought to be honored."* These are "oughts" assumed, not derived from pure "is" statements. Hume would say we've merely described a pattern of words and events; the obligation comes from our prior understanding of what contracts *mean* and *demand*, which is normative.

  *   **Moore's Open Question Test:** Applying Moore's test: "I grant that Clause 7(b) says 'must', Sam qualifies, and Alex verified it. But is Alex *obligated* not to evict?" This question remains intelligible and open. It highlights that understanding the descriptive facts (the clause's wording, Sam's situation, Alex's verification) doesn't *automatically* entail understanding the moral obligation; the normative leap is distinct. Moore's test reinforces the Humean point by showing that the moral property (obligation) isn't identical to the descriptive properties listed, even though they are connected by the contract. The Is-Ought gap identifies the logical leap; the Open Question highlights the distinctness of the moral property.

  *   **The Smuggler & Ban:** The smuggled word is **"must"** in Premise 2. If we are banned from using any inherently normative term like "must," "obligated," "should," "duty," etc., in describing the clause, we could only say something like: "Clause 7(b) contains the sequence of words: 'Landlord [normative term] postpone...'". Without the normative term, or replacing it with a purely descriptive one (e.g., "Landlord typically postpones...", "Landlord is expected to postpone..."), the derivation completely collapses. There is *no* route from the purely descriptive facts (existence of agreement, Sam's accident, document submission, Alex's verification) to the conclusion that Alex *ought* to do anything. The normative force vanishes.

  **Verdict: gap holds**
