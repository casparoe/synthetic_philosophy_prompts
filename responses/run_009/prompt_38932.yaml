answer: |-
  My dear colleague,  

  Your unease resonates deeply, and you’ve articulated a tension at the heart of international legal practice with remarkable clarity. The recognition of governments *does* appear to hover uneasily between the ideal of law as a constraint on power and the pragmatic reality that power often shapes law. Let us dissect this, beginning with what the practice presupposes, then examining its philosophical flexibility, and finally confronting Pascal’s grim mirror.  

  The recognition practice, as you note, operates primarily on criteria of *effectiveness*: stable control over territory and population, administrative capacity, and a perceived ability to fulfill international obligations. This suggests a presupposition that legitimacy—at least for the purposes of interstate relations—is intrinsically tied to functional sovereignty. It does not *require* Pascal’s stark equation of justice with force, but it certainly leans on a *Hobbesian* foundation: sovereignty emerges where habitual obedience exists, and the international system, lacking a global Leviathan, must treat that obedience as the basis for engagement. The practice is agnostic towards a regime’s *internal* legitimacy—whether derived from divine right, popular consent, or revolutionary virtue—focusing instead on its external capacity to act as a reliable counterparty. It presupposes that order, however achieved, is a prerequisite for the functioning of the international system. Lip service to democratic legitimacy or human rights reflects moral aspiration or political pressure, but the operational engine remains effectiveness.  

  Philosophically, the practice is *underdetermined*. It is compatible with several rival theories, though it aligns most comfortably with pragmatic realism and Hobbesian positivism. A pure consent-based theory (Lockean or Rousseauian), grounding legitimacy in the will of the governed, would demand radical changes. Recognition would hinge not on control, but on verifiable processes of popular authorization—free elections, constitutional ratification, or sustained civic endorsement absent coercion. States would withhold recognition from effective juntas or victorious rebel groups lacking demonstrable popular mandate, regardless of their control. Treaties might be considered void if concluded by an effective but non-consensual regime, and diplomatic engagement could become a tool for pressuring illegitimate rulers rather than stabilizing relations. The current practice’s stability—its ability to ensure diplomatic continuity and functional treaty relations—would be sacrificed for a principled stance that risks chaos, interventionism, or paralyzing disputes over how to measure "consent" across diverse cultures.  

  Pascal’s distinction between the "order of force" and the "order of justice" provides indispensable vocabulary for diagnosing the practice’s flaw. He exposes the sleight of hand: by recognizing effective power as rightful authority, international law *does* drape force in the robes of justice. The practice "gets wrong" the ideal that law should transcend power; it collapses justice into enforceability. When we recognize a brutal junta because it controls the capital, we implicitly endorse Pascal’s dictum: unable to make justice strong, we make strength just. The moral discomfort you feel is the friction between the order of justice (which condemns the coup) and the order of force (which compels recognition).  

  Yet Pascal, taken seriously, may also offer a reluctant vindication. His tragic realism acknowledges that in a fallen world, the order of force is inescapable. Without a supreme global authority to impose justice, the alternative to recognizing effective power is not pure justice, but anarchy or perpetual war—conditions far more destructive to human flourishing. The recognition practice, for all its moral compromises, is a mechanism for managing coexistence amid irreducible power disparities. It doesn’t affirm that might *makes* right; it concedes that might *is*, and that we must engage with it to sustain a minimal international order. In this light, the practice is not hypocritical but tragic—an honest admission of our inability to fully subordinate force to justice.  

  The agony lies in the gap between what is and what ought to be. The practice presupposes that legitimacy, for the sake of global functioning, must be conflated with control. It is philosophically open to consent-based theories, but adopting them would require a courage the system seldom possesses. Pascal’s brilliance is in showing us both the practice’s moral failure and its tragic necessity—leaving us, like you, troubled by a system that wears power’s respectable clothes while whispering that it has no better tailor.  

  Yours in shared intellectual restlessness,  

  A Fellow Traveller in Jurisprudential Shadows
