  The user suspects recognition might be agnostic about legitimacy, and they’re right. It doesn’t actively endorse might-makes-right; it sidesteps legitimacy debates by outsourcing them to domestic politics. When states recognize a junta while condemning its illegitimacy (e.g., Myanmar), they’re separating the question of "who can sign treaties" from "who should rule." This aligns with Hobbes—sovereignty emerges from obedience, not virtue—but also with pragmatism: challenging effectiveness risks chaos.  

  Now, Pascal’s critique is sharper. He saw force and justice as fundamentally separate orders, and their conflation as a tragic surrender. Recognition practice embodies this by laundering power into legality. But crucially, Pascal might say it’s unavoidable—we can’t make justice strong, so we pretend strength is just. Thus, the practice isn’t hypocritical; it’s tragically realistic.  

  Rebuilding recognition on consent (e.g., democratic mandates) would demand radical changes. States would need tools to audit internal legitimacy—elections, civil society input—and deny recognition to effective but non-consensual regimes. This could empower oppressed populations (e.g., refusing to recognize coup leaders) but also invite interventionism and ideological clashes (e.g., Cold War divisions). The current system avoids these quagmires but at the cost of tolerating tyranny.  

  Finally, Pascal’s distinction does indict the practice: it reduces justice to the order of force. Yet his realism also pardons it—without a world government, what alternative exists? The user’s discomfort reflects this double bind. The practice isn’t philosophically committed to might-makes-right; it’s a reluctant tool for coexistence in an imperfect world.  

