  They’re asking for a reconstruction of what recognition presupposes about legitimacy: Does it require Pascal’s equation of justice with force, or is it compatible with consent-based theories? And if rebuilt on consent, how would the practice change? They also want an evaluation of whether Pascal’s framework exposes the practice’s flaws or, ironically, justifies it as an honest compromise.  

