answer: |-
  ## Dissertation Prospectus: Binding, Betting, and Belief Revision

  **Core Question:** Does the diachronic Dutch book (DDB) argument for conditionalization establish a *norm on credences themselves* or merely a *norm on betting policies*, and how does the agent's capacity for costless *self-binding* determine the answer?

  **Determinacy Assessment:** The question *is* determinate when framed as above. It asks for the *normative target* of the DDB argument (credences vs. policies) and makes this target *conditional* on a specific, formally definable agent capacity (self-binding). The answer will be a conditional claim: "Under condition X (binding ability/cost), the DDB argument constrains Y (credences/policies)." The key is rigorously defining "self-binding" and "constraining credences vs. policies" within the formal models.

  **The Gap in Existing Literature:**
  1.  **Orthodox View:** Treats the DDB argument as demonstrating the diachronic *irrationality* of non-conditionalizing credences. Violating conditionalization makes you *vulnerable* to a sure loss, implying a genuine norm governing your *degrees of belief* over time. The argument's force is seen as analogous to the synchronic case for coherence.
  2.  **Deflationist/Sophisticated Pragmatist View:** Argues Dutch book arguments (synchronic or diachronic) only show that certain *betting dispositions* are financially inadvisable. They establish norms for how to *act* (accept bets), not necessarily for what to *believe*. You can always avoid the Dutch book by refusing bets, preserving incoherent credences. This view often treats the synchronic and diachronic arguments similarly.
  3.  **The Unexplored Nexus:** The orthodox view largely ignores the architectural presupposition highlighted by the "future selves" critique: the argument *requires* that the agent cannot precommit her future self's betting behavior (or credences). The deflationist view often treats "refusing bets" synchronicly and diachronicly as the *same* escape hatch, without deeply analyzing why the diachronic case feels different (i.e., the temporal disconnect and lack of binding). Neither camp systematically investigates how the *availability and cost of self-binding mechanisms* fundamentally alters the normative implications of the DDB vulnerability. My core claim is that the "future selves" complaint and the "refuse bets" complaint converge on the *separation between credence and betting disposition*, which is modulated by the agent's capacity for precommitment.

  **Dissertation Structure & Methodology:**

  *   **Chapter 1: Deconstructing the Arguments & Identifying the Architectural Assumption**
      *   **Content:** Detailed analysis of the synchronic DBA (focusing on the "refusal" objection) and the diachronic DBA (focusing on the "multiple selves" objection and the role of conditionalization as a precommitment device). Formal reconstruction of both arguments to pinpoint the exact step where the separation between credence and betting disposition matters. Explication of "self-binding" within decision/game theory (e.g., precommitment contracts, binding resolutions, costly willpower models).
      *   **Method:** Conceptual analysis, formal logic. *Why not alternatives?* Pure conceptual analysis lacks precision; pure formalism misses the philosophical nuance. This chapter bridges them.
      *   **Goal:** Establish that both objections hinge on the *extent to which an agent can make her betting disposition track her credence* across time or counterfactual scenarios, and that this capacity is constrained by architectural features (binding ability/cost).

  *   **Chapter 2: Modeling Self-Binding in Diachronic Choice**
      *   **Content:** Develop formal models of agents facing diachronic Dutch book scenarios with varying capacities for self-binding. Key parameters: Cost of binding (zero, finite, infinite), scope of binding (binding credences directly vs. binding betting policies), and the mechanism (external contract, internal resolution with potential failure). Analyze DDB vulnerability and the resulting normative implications (what *must* the agent do to avoid a sure loss?) under each model.
      *   **Method:** Decision theory, game theory (especially models of hyperbolic discounting/precommitment if applicable), formal epistemology. *Why not alternatives?* Historical analysis wouldn't yield the needed formal results; purely abstract philosophy wouldn't capture the critical interactions between binding cost and vulnerability.
      *   **Goal:** Rigorously demonstrate how the availability and cost of self-binding transforms the normative force of the DDB argument. Show that with infinite binding cost (no binding), avoiding DDB requires conditionalizing credences. With zero binding cost, avoiding DDB only requires adopting a conditionalization-*compliant betting policy* via binding, even if credences momentarily deviate.

  *   **Chapter 3: Implications for Synchronic Arguments and the Nature of Credences**
      *   **Content:** Apply the insights from Chapter 2 to the synchronic DBA. Analyze the "refusal" objection through the lens of the agent's capacity to bind her *current* betting disposition to her credence. Explore whether synchronic credences are best understood as *defined* by (ideal) betting dispositions or as separable mental states. Discuss the relationship between conditionalization-as-updating-rule and conditionalization-as-precommitment-strategy.
      *   **Method:** Conceptual analysis informed by formal results. *Why not alternatives?* Extending the formal models directly to synchronicity risks conflation; this chapter synthesizes the diachronic insights back onto the synchronic debate.
      *   **Goal:** Argue that the synchronic "refusal" objection gains its force from an implicit (and usually costless) capacity for the agent to align her betting disposition with her credence *at a single time*, analogous to costless diachronic binding. Unify the understanding of Dutch book arguments as probing the *pragmatic link* between belief and action, modulated by architectural constraints.

  *   **Chapter 4: Normative Implications and the Status of Conditionalization**
      *   **Content:** Synthesize findings to answer the core question. Evaluate what the DDB argument *actually* proves: Under what conditions does it constrain credences, and under what conditions does it merely constrain betting policies? Discuss the ramifications for the normative force of conditionalization. Address potential objections (e.g., "credences just *are* betting dispositions," "binding *is* updating").
      *   **Method:** Normative philosophy, synthesis of previous chapters' results. *Why not alternatives?* This is the payoff chapter, drawing conclusions from the groundwork laid.
      *   **Goal:** Provide a clear, architecturally-sensitive account of the normative significance of Dutch book vulnerability, particularly for diachronic rationality.

  **Success Conditions:**
  *   **Primary Success (The "Separation Theorem"):** Demonstrating a clear, formal distinction: When precluding self-binding is *structurally impossible or infinitely costly*, the DDB argument necessitates conditionalizing *credences* to avoid guaranteed loss. When self-binding is *freely available* (zero cost), the DDB argument only necessitates adopting a *betting policy* that mimics conditionalization *via binding*, leaving credences potentially unconstrained by the vulnerability itself. This shows the deflationist insight applies robustly only when binding is cheap, while the orthodox view captures a truth when binding is impossible.
  *   **Secondary Success:** Successfully unifying the "future selves" and "refuse bets" critiques under the umbrella of "credence-policy separation modulated by binding capacity." Providing a novel, architecturally-informed framework for understanding the normative force (and limitations) of Dutch book arguments generally.

  **Failure Conditions:**
  1.  **Indeterminacy Failure:** If the distinction between "constraining credences" and "constraining policies via binding" cannot be made sufficiently precise or collapses under analysis (e.g., if binding *just is* changing one's credence, or if a policy *just is* the credence).
  2.  **Formal Model Failure:** If constructing tractable models showing the claimed shift in normative target (from credence to policy) under varying binding costs proves impossible or fails to deliver clear results.
  3.  **Unification Failure:** If the analysis reveals the synchronic and diachronic objections are fundamentally distinct *despite* the apparent link through credence-policy separation and binding, undermining the core hunch.
  4.  **Triviality/Obviousness Failure:** If the conclusion turns out to be widely accepted, trivial, or already explicitly stated in the literature in a way that negates the project's novelty. (Initial survey suggests this is unlikely).
  5.  **Architectural Framing Weakness:** If the focus on "agent architecture" proves less central than anticipated, failing to provide significant new insight beyond existing pragmatic or decision-theoretic critiques of DBAs.

  **Assessment of the "Architecture of the Agent" Framing:** The framing is **central and productive**, not weak. It directly addresses the core mechanism ("future selves can't contract") and provides the key variable (binding capacity/cost) to modulate the argument's normative implications. It forces a shift from abstract "rationality" to concrete agent *capacities and constraints*. However, guard against over-interpretation: "Architecture" here means *pragmatic capacities for commitment* within a decision-theoretic model, not necessarily detailed cognitive science. The term is useful shorthand, but the core work is in modeling these specific capacities (binding) within decision/game theory. The prospectus's success hinges on making this link between the abstract argument and the agent's concrete decision-making options rigorous. **Proceed confidently with this framing, but be precise in Chapter 1 about defining the relevant "architectural" features (binding mechanisms and costs).**
