  *(That is, is the trait neutral? If it were changed, would the organism be just as fit?)*  
  - **Yes** → **Genetic drift:** The trait's form is due to random chance in the population, not because of any function or constraint.  
  - **No** → **Constraint:** The trait's form is forced by the organism's body plan, development, or physical laws. It can't be different without causing problems.  

