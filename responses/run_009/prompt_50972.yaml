  **Handout: Why does this trait exist? A Decision Tree**

  Use the following questions to think about why a particular trait exists in the form it has. Start at the top and answer the questions based on evidence. Remember that without historical data, some branches may be hard to resolve.

  **Question 1: Was the trait's form shaped by natural selection acting on this trait?**  
  *(That is, if we could re-run evolution many times, would this trait usually evolve because it helps with survival or reproduction?)*  
  - **Yes** → Go to Question 2.  
  - **No** → Go to Question 3.  

  **Question 2: Is the trait's current function the same as the function that natural selection originally acted upon?**  
  *(For example, bird feathers originally evolved for warmth, but now are used for flight. If the function changed, it's not the same.)*  
  - **Yes** → **Direct adaptation:** The trait is an adaptation for its current function. It was built by natural selection because it does what it does now.  
  - **No** → **Exaptation:** The trait was built by natural selection for a different original function, but now it's used for something else.  

  **Question 3: Is the trait a necessary side effect (byproduct) of selection acting on another trait?**  
  *(That is, whenever the other trait is present, this trait comes along with it automatically. For example, the redness of blood is a byproduct of the chemistry of carrying oxygen.)*  
  - **Yes** → **Spandrel (byproduct):** The trait exists as a side effect of an adaptation for another trait. It wasn't directly selected for.  
  - **No** → Go to Question 4.  

