  ### Decision Tree: When Is a Human Being Dead?

  **Root Question (Q1):**  
  *Consider a body declared "brain dead" (no brain function) that is kept on a ventilator for months, heals wounds, fights infections, and gestates a fetus to birth. Is this body:*  
  - **A.** A living human organism (despite no brain function).  
  - **B.** A dead human organism (despite these functions).  
  - **C.** Something else—neither fully alive nor dead in traditional terms.  

  ---

  #### Branch from **A (Living organism)**:
  **Q2:**  
  *In "donation after circulatory death" (DCD), a patient's heart stops permanently (no auto-resuscitation possible), but it could be restarted artificially if attempted. The family refuses intervention. When does death occur?*  
  - **A.** Death occurs when the heart stops (cessation of circulation).  
  - **B.** Death occurs only after the decision not to restart the heart (irreversibility depends on intent).  

  - *From **A**:* **Leaf: Traditional Circulatory-Respiratory Criterion**  
    *Most awkward commitment:* Declaring death at circulatory cessation even if the heart *could* be restarted, implying a corpse could be "revivable."  
  - *From **B**:* **Leaf: Legal Definition as Policy Line**  
    *Most awkward commitment:* Admitting death is determined by social choice (e.g., intent not to revive), not purely biological facts.  

  ---

  #### Branch from **B (Dead organism)**:
  **Q3:**  
  *Consider a permanent vegetative state (PVS) patient: destroyed cortex (no consciousness), intact brainstem (breathes, sleeps, wakes). Is this patient:*  
  - **A.** Alive (due to preserved brainstem function).  
  - **B.** Dead (due to lost consciousness).  

  - *From **A**:* **Leaf: Whole-Brain Criterion**  
    *Most awkward commitment:* Calling a brain-dead body "dead" but a PVS body "alive," despite both lacking consciousness, due to residual brainstem activity.  
  - *From **B**:* **Leaf: Higher-Brain (Consciousness-Based) Criterion**  
    *Most awkward commitment:* Declaring a breathing, waking body "dead" because consciousness is permanently lost.  

  ---

  #### Branch from **C (Something else)**:
  **Q4:**  
  *A newborn lacks a cerebrum (anencephaly) but has a brainstem (breathes, heartbeat). Is this infant:*  
  - **A.** Alive (biologically functioning).  
  - **B.** Dead or never alive as a person (due to lacking consciousness).  

  **Q5 (If A from Q4):**  
  *In the chronic brain-dead body, does medical technology (e.g., ventilator) restore the body’s "self-integrating unity" (e.g., wound healing, fetal gestation), or does it merely delay decay?*  
  - **A.** It restores integration → **Leaf: Somatic View**  
    *Most awkward commitment:* Denying that brain death alone causes death if machines sustain integration (e.g., a body gestating a fetus is "alive").  
  - **B.** It only delays decay → **Leaf: Whole-Brain Criterion** (via consistency with Q1B).  

  **Q6 (If B from Q4):**  
  *Should we abandon the "dead-donor rule" (requiring donors to be dead) to allow organ procurement from permanently unconscious bodies, revising transplantation ethics?*  
  - **A.** Yes → **Leaf: Abandon Dead-Donor Rule**  
    *Most awkward commitment:* Permitting lethal organ removal from living bodies, demanding new ethics for "lethal donation."  
  - **B.** No → **Leaf: Legal Definition as Policy Line** (irreversibility is socially set).  

  ---

  ### Appendix: Limitations and Coherence Gaps
  1. **Unseparated Leaves:**  
     - **Higher-Brain vs. Personhood-Only Views:** The tree cannot distinguish someone who thinks *death* occurs at consciousness-loss (higher-brain) from someone who thinks only *personhood* (not biological life) ends then. Both answer identically on PVS (Q3B) and anencephaly (Q4B).  
     - **Policy Line vs. Somatic View:** A policy-focused person might agree with somatic integration answers (Q5A) if they see integration as a policy tool, not biology.  

  2. **Vacant Paths:**  
     - **"Something else" for PVS (Q3C):** No leaf exists. This reflects *unexplored territory*—e.g., a "neither alive nor dead" category for severe neurological loss.  
     - **Consistency in Circulatory Criterion:** Someone answering Q1A (brain-dead body alive) but Q2B (death in DCD depends on intent) has no leaf. This is likely *incoherent*—biological life (Q1A) clashes with social irreversibility (Q2B).  

  ---

  ### Design Notes
  - **Root Justification:** The root tests your hypothesis by forcing a choice between biology and declaration. This cleanly splits the tree, as biological-event adherents (Q1A/B) prioritize bodily status, while declaration adherents (Q1C) see death as context-dependent.  
  - **Added Case (Q4/Q6):** Anencephaly forces choosing between organismic life (brainstem function) and personhood (consciousness), exposing gaps in standard criteria.  
  - **Node Count:** 6 nodes (Q1–Q6), covering all required cases and leaves.
