  Okay, the user is working on a paper about Moore's paradox and wants to establish what an adequate account must achieve before defending any particular theory. Let me start by recalling what Moore's paradox is. The classic example is asserting something like "It's raining, but I don't believe it is." The user mentions both the commissive and omissive versions. The key issue is that such statements are absurd even though they can be true. 

  First, I need to list the desiderata for any theory explaining this paradox. The user provided several points: why the absurdity arises in assertion rather than truth; why it's limited to first-person present tense; whether weaker variants like uncertainty are included; why conditional embeddings restore felicity; and how to handle Moore's point that the situation described is possible.

  Let me break down each requirement. The assertion vs. truth point is crucial. A theory must explain why asserting the sentence is defective, not the sentence itself. The first-person restriction is another critical aspect. Third-person versions like "He thinks it's raining, but it isn't" aren't paradoxical. Weaker variants might test the boundaries of the paradox. If a theory only covers strong belief but not uncertainty, that's a limitation. The embedding issue shows that the absurdity disappears in conditionals, which any account should handle. Finally, acknowledging that the scenario is possible is essential; the sentence isn't contradictory.

  I should categorize these into non-negotiable versus theory-laden. Non-negotiables include the assertion defect, first-person restriction, embedding felicity, and the possibility of the situation. Weaker variants might be negotiable depending on the theory. For example, a strong norm of assertion might not cover uncertainty cases, while a belief-inconsistency approach might.

  Looking at potential conflicts. If a theory explains the assertion defect via pragmatic norms (like the knowledge norm), it might struggle with the embedding issue. Semantic approaches could handle embeddings better but might not clearly explain why assertion is problematic. Also, handling weaker variants could be tricky; if a theory requires full belief, it might exclude cases where the subject is uncertain.

  Now, scoring the two main strategies: pragmatic vs. semantic. Pragmatic approaches, like Williamson's knowledge norm, explain why asserting without knowledge is wrong. But they might not fully account for the embedding case. Semantic approaches, like self-ascription, explain the first-person aspect and embeddings but might need to incorporate pragmatic elements for assertion norms.

  The user's deeper needs: They want a solid foundation for their paper. Ensuring the criteria are comprehensive and unbiased helps them evaluate theories effectively. They might also need to identify gaps in existing theories or areas where further research is needed. Highlighting potential conflicts between desiderata could guide their analysis of which theories are more viable.
answer: |-
  Here's a breakdown of desiderata for an adequate account of Moore's Paradox, sorted by necessity and potential conflicts, followed by a brief scoring of the main strategies:

  **Core Non-Negotiable Desiderata (Must be Explained by Any Adequate Account):**

  1.  **Assertion/Belief Defect, Not Truth-Conditional Contradiction:**
      *   **Requirement:** Explain why the absurdity attaches *specifically to asserting* the Moorean sentence or *believing* the Moorean proposition. The account must show why asserting/believing it is defective/absurd *despite* the sentence being consistent and the proposition being possible/true in some situations.
      *   **Case:** "It's raining but I don't believe it is" *is* consistent and could be true (e.g., it's raining, but I'm oblivious). The defect is in the act of *saying* it or the state of *believing* it. An account merely showing inconsistency fails.

  2.  **First-Person, Present-Tense Constraint:**
      *   **Requirement:** Explain why the absurdity arises *only* for first-person, present-tense ascriptions (or denials) of belief about a *presently held* belief. "He believes it's raining, but it isn't" is unproblematic, as is "I *believed* it was raining yesterday, but it wasn't" or "He believes it's raining, but I don't believe it is".
      *   **Case:** The paradox relies on the subject simultaneously reporting/expressing a world-directed belief ("It's raining") and a conflicting self-report about their *current* doxastic state ("I don't believe it is"/"I believe it is not"). Shifting person, tense, or the object of belief eliminates the essential tension.

  3.  **Embedding Resilience:**
      *   **Requirement:** Explain why embedding the Moorean sentence under operators like conditionals ("If it's raining but I don't believe it is, then..."), supposition, or attitude verbs ("He thinks that it's raining but he doesn't believe it is") removes the absurdity and makes the utterance felicitous.
      *   **Case:** The conditional context suspends the normal commitments associated with *asserting* each conjunct. The speaker isn't asserting it's raining or asserting their disbelief; they are merely considering the hypothetical scenario described by the whole conjunction.

  4.  **Acknowledgment of Possibility:**
      *   **Requirement:** Acknowledge and be compatible with the fact that the state of affairs described by the Moorean proposition is genuinely possible and common (e.g., being wrong about the weather). The account must explain the *absurdity* without implying the *impossibility*.
      *   **Case:** Moore's key observation: we often *are* in situations where P is true but we don't believe it (or believe ~P). The paradox highlights a defect in *representing* that state to oneself (in belief) or to others (in assertion), not in the state itself.

  **Negotiable/Theory-Laden Desiderata (Often Reflect Theoretical Commitment):**

  5.  **Coverage of "Weaker" Variants (e.g., Uncertainty, Lack of Opinion):**
      *   **Requirement:** Should the account also explain the (arguably lesser) oddity of assertions like "P, but I'm not sure it is" or "P, but I have no opinion on whether P"?
      *   **Case:** This is contentious. Some see these as clearly related, differing only in degree. Others see a sharp distinction: the core paradox involves an *inconsistency* within the speaker's position (asserting P implies belief in P, conflicting with the second conjunct), while weaker variants involve mere epistemic caution or agnosticism, which might be pragmatically odd but not intrinsically self-defeating. A strong norm-of-assertion view (e.g., knowledge norm) might naturally extend to these, while a strict belief-inconsistency view might not.
      *   **Status:** Highly theory-laden. A strong account *should ideally* explain the spectrum, but a focus solely on the core belief-denial cases might be acceptable depending on the theory's scope.

  6.  **Explanation of Belief-Absurdity Parity:**
      *   **Requirement:** Should the account explain why *believing* the Moorean proposition is just as absurd (if not more so) as *asserting* it?
      *   **Case:** Moore noted the parallel absurdity. Some theories (especially semantic/expressivist) naturally cover both. Others (especially pragmatic assertion-norm theories) primarily target assertion and need supplementation for belief.
      *   **Status:** Often a consequence of the core explanation, but emphasis can vary. A complete account should address both.

  **Potential Conflicts:**

  *   **Assertion Norm vs. Embedding:** A strong pragmatic view explaining the defect *solely* via a norm of assertion (e.g., "Assert only what you know") might struggle to explain why embedding removes the defect *without* appealing to semantics/pragmatics of embedding. If asserting the conjunction violates the norm because you can't know P while knowing you don't believe P, why doesn't asserting the conditional containing that conjunction also violate the norm? Semantic views often handle embedding more naturally.
  *   **Coverage of Weak Variants vs. Precision:** Demanding explanation of all weak variants (uncertainty, lack of opinion) might force an account towards broader pragmatic explanations (e.g., Gricean maxims) which risk being less precise about the unique *inconsistency* of the core case. A sharper account focused on belief-inconsistency might exclude them.

  **Brief Scoring of Main Strategies:**

  1.  **Pragmatic (Assertion Norm - e.g., Williamson, Adler):**
      *   **Strengths:** Excels at **1 (Assertion Defect)**, clearly differentiating assertion from truth. Can naturally incorporate **5 (Weak Variants)** if the norm is demanding (e.g., knowledge). Handles **4 (Possibility)** well.
      *   **Weaknesses:** Struggles most with **3 (Embedding)** – explaining why asserting the conditional isn't defective requires auxiliary machinery. Less straightforward on **2 (First-Person)** – needs to explain why the norm violation *only* occurs with first-person belief denial (often invoking transparency or self-knowledge). Needs supplementation for **6 (Belief-Absurdity)**.

  2.  **Semantic/Expressivist/Self-Ascription (e.g., Shoemaker, Heal, some dynamic semantics):**
      *   **Strengths:** Naturally explains **2 (First-Person)** and **3 (Embedding)** – self-ascriptions express current states, embedding suspends this expression. Handles **4 (Possibility)** and **6 (Belief-Absurdity)** well, as the core issue is representational inconsistency in thought/expression.
      *   **Weaknesses:** Can be less direct on **1 (Assertion Defect)** – often needs to *add* a pragmatic layer (e.g., assertion expressing belief) to fully explain the speech act absurdity. May struggle or be less motivated to cover **5 (Weak Variants)** comprehensively, as "I'm not sure" isn't a direct inconsistency in the same way. Articulating the exact nature of the "expression" or "self-ascription" can be challenging.

  **Conclusion on Criteria:** The core desiderata (1-4) are essential and largely non-negotiable for any adequate account. Desideratum 6 (belief absurdity) is crucial for completeness. Desideratum 5 (weak variants) is important but potentially negotiable depending on the account's primary focus; its inclusion strongly favors pragmatic or broader expressivist approaches. The potential conflict between a strong assertion-norm view and embedding resilience is significant and may push towards semantic solutions or more nuanced pragmatic ones. Your list rightly forces engagement with the fundamental tension: the paradox arises from the *use* of language (or thought) to represent a state that is possible but cannot be coherently represented *in that way*.
