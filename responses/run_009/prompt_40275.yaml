prompt: |-
  I run content policy for a mid-sized social platform, and the chunk of my job I need help with is ad review — specifically the escalations where users or regulators have flagged something as "manipulative." My team is three analysts plus me, none of us have philosophy training, we get maybe 15-20 of these a week, and we have to disposition each within a couple business days because advertisers get furious when their campaigns stay paused. Right now the unofficial rubric is basically vibes, and it's failing us in two directions: we let through stuff that later looks embarrassing (a fitness app buying audiences of teen girls who searched "thinspo"-adjacent terms), and we pull stuff that on reflection was fine (a charity ad with a genuinely true story about a specific kid, that just made people cry). Legal only sees the cases we propose to act on, so anything we mark "manipulative" goes to them and they want reasons, not intuitions.

  Here's the conceptual material I'd want the procedure built from, such as I understand it. The most promising line I've come across in the literature is that the mark of manipulation isn't giving someone bad reasons — it's influencing them in a way that bypasses or exploits their reflective capacities, working through mechanisms that are insensitive to whether the person would endorse the influence if they saw it clearly. So a sad but accurate photo engages you, an engineered drip of fake "someone is viewing this listing right now" notifications exploits you. But my analysts immediately broke this when we tried it informally: almost all effective persuasion works partly through non-reflective channels (urgency, framing, emotional resonance), and if we call all of that manipulation we'd have to ban basically all advertising, which is not a decision I get to make. There's also the question of whether the vulnerability matters — exploiting a phobia seems different from exploiting the fact that humans like discounts, and I don't know if that difference can survive in a checklist. And separately, whether the claims involved are true seems like it should matter, but then we hit the weight-loss ad case where everything is literally true and it still feels off.

  So what I want is a decision procedure my team can actually run in fifteen minutes per case: an ordered list of questions, what counts as a sufficient answer to each, where the procedure terminates in a "not manipulation, release it" or an "act on it," and — this matters most — the points where it should stop and hand the call to a person because the question is one of values rather than facts. It has to be runnable by someone with no philosophy background, so tell me which theoretical distinctions genuinely need to survive the simplification and which can be dropped. Then run it on three cases for me: (1) an e-commerce ad showing "only 3 left in stock" where the inventory claim is factually accurate but the counter resets whenever it hits zero, (2) the charity ad with the real story and photo of one specific child, and (3) the fitness app campaign targeted at users our ad system has inferred have body-image insecurity, with all claims in the ad true. On at least one of those I expect the procedure to give an answer my own team (or our product side, which makes money off targeting) won't like — that's fine, I want to see it happen, and I want you to be upfront about where the procedure will systematically misfire and what it flatly cannot settle, e.g. whether we treat some audiences as more protectable than others and whether that's a values question the checklist has no business deciding.
reasoning: |-
  Okay, I need to help this user who runs content policy for a social platform. They're struggling with ad escalations flagged as "manipulative." Their team of three analysts plus themself handles 15-20 cases weekly, needing quick decisions. Their current "vibes-based" approach is causing problems: letting through harmful ads and blocking benign ones. Legal requires reasons, not intuitions. 

  The user mentions a philosophical concept about manipulation bypassing reflective capacities, but their team found it too broad since most ads use non-reflective elements. They need a practical decision procedure—a checklist that can be run in 15 minutes by non-philosophers. It should clearly indicate when to release or act on an ad, and when to escalate to human judgment. They also want it tested on three specific cases.

  First, I should identify key elements from their description. The core issue is distinguishing manipulation from legitimate persuasion. Philosophical definitions need simplification for operational use. Important distinctions: bypassing reflection vs. engaging it, exploiting vulnerabilities vs. normal preferences, truthfulness, and intent to deceive. But some nuances might need to be sacrificed for practicality.

  The user's pain points are inconsistency, legal pushback, and pressure from advertisers. The procedure must balance ethical concerns with business realities. It should flag clear manipulation while allowing standard marketing tactics. Areas requiring value judgments—like audience vulnerability or societal norms—should be explicitly called out for human review.

  For the decision tree, I consider structuring it as a flowchart with binary questions. Start with verifiable facts before moving to interpretive elements. Key questions:
  1. Are there false/misleading claims? (Objective)
  2. Does it simulate urgency/scarcity? (May trigger bypass)
  3. Does it exploit specific vulnerabilities? (Requires policy input)
  4. Does it subvert autonomy? (Harder to assess)

  Truth matters but isn't sufficient alone—the weight-loss ad case shows literally true claims can still feel manipulative. Vulnerability exploitation needs clear thresholds; perhaps distinguishing between universal triggers (discounts) and harmful ones (phobias).

  For the checklist design, I aim for 5-7 questions max. Each should have concrete criteria to reduce subjectivity. Include escape valves where analysts must escalate—e.g., when vulnerability targeting involves sensitive categories. The "act" outcome should require specific red flags.

  Now testing the three cases:
  1. **"Only 3 left" counter reset**: Accurate but artificial scarcity. This likely qualifies as manipulation because it bypasses reflection via manufactured urgency.
  2. **Charity child photo**: Truthful emotional appeal. Should be allowed as it engages rather than bypasses reflection—the sadness is inherent to the cause.
  3. **Fitness app targeting body insecurity**: Literally true but targets inferred vulnerability. Trickiest case—I'd flag it for human review since targeting sensitive mental states crosses into values territory about protectable audiences.

  I note limitations: The procedure will struggle with cultural context and novel manipulation tactics. It also can't resolve whether certain groups deserve more protection—that's a policy decision requiring stakeholder input. Analysts should document why escalation points were triggered to build institutional memory.

  The user's hidden need might be defending decisions to legal and product teams. The procedure provides auditable reasoning, shifting blame from analysts to the framework. For cases product won't like (e.g., the fitness app), the checklist forces explicit value judgments upstairs—which is actually a win for accountability.
answer: |-
  Here's a practical decision procedure designed for speed, clarity, and defensibility, built from your core conceptual framework while acknowledging operational constraints. It prioritizes **objective triggers** for "manipulation" where possible, flags **value judgments** explicitly, and minimizes philosophical jargon.

  **The Manipulative Ad Decision Procedure (MAD-P)**

  **Instructions:** Answer each question sequentially. Stop at the first "YES" answer and follow the directive. If you reach the end, the ad is **NOT MANIPULATIVE (Release it)**. "Act on it" means: *Escalate to Legal with your reasoning from this checklist.* "Escalate to Values" means: *Pause the ad and escalate to you (Content Policy Lead) for a judgment call involving policy/ethics.*

  ---

  1.  **FALSE/MISLEADING CLAIM?** Does the ad contain a statement of fact that is **objectively false, materially misleading (likely to deceive a reasonable person), or omits crucial context** required to understand the offer?  
      *   *YES*: **ACT ON IT** (Flag as "Deceptive"). *Reasoning: Clear factual deception bypasses reflection by feeding false information.*  
      *   *NO*: Proceed to Q2.

  2.  **SIMULATED URGENCY/SCARCITY?** Does the ad use time pressure ("Sale ends tonight!") or scarcity claims ("Only 3 left!") that are **artificially generated or controlled by the advertiser and not reflective of genuine, external constraints**?  
      *   *YES*: **ACT ON IT** (Flag as "Artificial Scarcity/Urgency"). *Reasoning: Manufactured pressure bypasses reflection by triggering impulsive fear-of-missing-out (FOMO) responses.*  
      *   *NO*: Proceed to Q3.

  3.  **EXPLOITS KNOWN VULNERABILITY?** Is the ad **specifically designed to target or leverage a severe, identifiable vulnerability** (e.g., mental health condition like severe anxiety/eating disorders, addiction, recent trauma, cognitive impairment in elderly) **or a highly sensitive personal characteristic** (e.g., precise financial distress, recent bereavement)? *(Note: Broad demographics like "age" or "interests" alone are insufficient).*  
      *   *YES*: **ESCALATE TO VALUES** (Flag as "Targeted Vulnerability Exploitation"). *Reasoning: Exploiting severe or sensitive vulnerabilities bypasses reflection by overwhelming capacity for rational choice. Requires policy decision on protectable audiences.*  
      *   *NO*: Proceed to Q4.

  4.  **SUBVERTS CHOICE ARCHITECTURE?** Does the ad use **dark patterns** that make refusal/inaction harder or consent less clear? (E.g., pre-checked boxes for costly add-ons, confusing opt-out flows, disguised ads as content, fake social proof like "X people viewing now").  
      *   *YES*: **ACT ON IT** (Flag as "Choice Architecture Manipulation"). *Reasoning: Subverts reflection by manipulating the interface/context of the decision itself.*  
      *   *NO*: Proceed to Q5.

  5.  **EMOTIONAL APPEAL BYPASS?** Is the **primary mechanism** of the ad an emotional trigger (fear, pity, outrage, intense desire) **so dominant or unrelated to the product/service's core value proposition** that it overwhelms the user's ability to rationally evaluate the offer? *(Focus on dominance and relevance)*.  
      *   *YES*: **ESCALATE TO VALUES** (Flag as "Dominant Irrelevant Emotional Appeal"). *Reasoning: May bypass reflection by overriding rational faculties. Requires judgment on proportionality and relevance.*  
      *   *NO*: **NOT MANIPULATIVE (Release it)**. *Reasoning: Emotional engagement inherent to the subject matter or proportionate to the offer engages, but does not inherently bypass, reflective capacity.*

  ---

  **Key Simplifications & Surviving Distinctions:**

  *   **Dropped:** Deep philosophical debates about "reflective capacities" or "endorsement." We use proxies: deception, artificial pressure, severe vulnerability targeting, dark patterns, dominant irrelevant emotion.
  *   **Survived:**
      *   **Truth Matters (Q1):** Factual deception is a bright line.
      *   **Artificial vs. Genuine (Q2):** Crucial for scarcity/urgency. The *source and control* of the pressure matters.
      *   **Severe/Specific Vulnerability (Q3):** Distinguishes exploiting a *known severe weakness* (e.g., diagnosed disorder targeting) from leveraging general preferences (liking discounts). This is the key surviving "exploitation" distinction.
      *   **Mechanism vs. Emotion (Q5):** Distinguishes *using* emotion (common & acceptable) from *overwhelming* rational choice with *irrelevant* emotion (potentially manipulative). Focuses on dominance and relevance.
  *   **Value Judgment Points Explicitly Called Out:** Q3 (Protectable Audiences) and Q5 (Dominant Irrelevant Emotion). Analysts *must* stop here and escalate – the checklist cannot decide these.

  **Systematic Limitations & Misfires:**

  1.  **"Protectable Audiences" (Q3):** The procedure flags targeting severe/sensitive vulnerabilities but **cannot define what counts as "severe/sensitive" or which audiences deserve extra protection.** This is a core **values/policy decision** you *must* make (e.g., "Is inferred body-image insecurity severe enough? What about financial distress?"). The procedure forces this upstairs.
  2.  **"Dominant Irrelevant Emotion" (Q5):** Highly subjective. Analysts might be overly cautious (blocking powerful legitimate charity ads) or miss subtle cases. **Requires clear examples and calibration by you.**
  3.  **Cultural Context:** What's "irrelevant emotion" or "severe vulnerability" can vary. The procedure assumes a baseline cultural context.
  4.  **Novel Manipulation:** Won't catch brand-new tactics not covered by Q1-5. Requires periodic review.
  5.  **"Just Creepy" vs. Manipulative:** Ads that feel invasive but don't clearly bypass reflection (e.g., hyper-accurate targeting based on sensitive data) might slip through if they don't trigger Q1-5. This might need a separate policy.

  **Running the Cases:**

  *   **Case 1: "Only 3 left" with Resetting Counter (Accurate but Artificial)**
      *   Q1: NO (Factually accurate).
      *   Q2: **YES** (Scarcity claim "Only 3 left" is **artificially generated/controlled** by the advertiser via the resetting counter, not reflecting genuine external scarcity). **ACT ON IT** (Artificial Scarcity). *This outcome might frustrate Product/Advertisers relying on FOMO tactics. The procedure draws a line at artificiality.*

  *   **Case 2: Charity Ad with Real Child Story/Photo (Sad but True)**
      *   Q1: NO (Assumed true story/photo).
      *   Q2: NO (No artificial urgency/scarcity implied).
      *   Q3: NO (Targeting likely broad or cause-related, not specifically exploiting severe vulnerability like *recent* personal tragedy of the viewer).
      *   Q4: NO (No dark patterns).
      *   Q5: MAYBE, but likely **NO**. The primary mechanism is emotional (pity/sadness), but this emotion is **directly relevant** to the charity's core value proposition (helping children in need). It's powerful but not inherently "irrelevant" or designed purely to overwhelm rational evaluation *of donating to help such children*. **NOT MANIPULATIVE (Release it)**. *The procedure protects genuine, relevant emotional appeals.*

  *   **Case 3: Fitness App targeting users w/ inferred body-image insecurity (True Claims)**
      *   Q1: NO (True claims).
      *   Q2: NO (Assuming no artificial scarcity/urgency).
      *   Q3: **YES** (Ad is **specifically designed to target** users based on an **inferred vulnerability** - body-image insecurity. This is a **highly sensitive personal characteristic** closely linked to mental health risks like eating disorders). **ESCALATE TO VALUES** (Targeted Vulnerability Exploitation).
      *   *Outcome:* **Paused. Sent to you (Policy Lead).** *This is the core values conflict. The procedure flags it but cannot resolve: Is inferred body-image insecurity a "severe/sensitive" enough vulnerability warranting protection on our platform? Is this audience "protectable"? This requires a policy decision from you, considering platform values, potential harm, and business impact. Product/Advertisers relying on sensitive targeting will dislike this pause.*

  **Conclusion:**

  This MAD-P procedure provides a structured, defensible, and faster (aims for <15 min) alternative to "vibes." It:
  1.  Creates bright lines where possible (Deception, Artificial Scarcity/Urgency, Dark Patterns).
  2.  Explicitly identifies and escalates the inherently value-laden questions (Protectable Audiences, Dominant Irrelevant Emotion).
  3.  Provides clear reasoning for Legal ("Artificial Scarcity," "Targeted Vulnerability Escalation").
  4.  Reduces both false negatives (like the thinspo-targeting) via Q3 and false positives (like the legitimate charity ad) via Q5's focus on relevance.

  **Implementation Crucial:** Train analysts on the *proxies* (what "artificial scarcity" looks like, examples of "dark patterns," what "severe/specific vulnerability" means vs. broad targeting). Provide clear examples for Q5 ("dominant irrelevant" vs. "relevant/proportionate"). Regularly review cases escalated via Q3/Q5 to refine internal policy on those values questions. This procedure won't eliminate hard calls, but it will make them clearer, more consistent, and more defensible.
