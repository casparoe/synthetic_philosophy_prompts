answer: |-
  ## Proposal: The Normative Authority of "Nature" in the Mencius-Xunzi Debate

  **(1) Core Research Question:** Did Mencius and Xunzi disagree substantively about whether labeling a psychological tendency as part of "human nature" (性, *xing*) inherently confers upon it a privileged, default *normative authority* within moral education, such that tendencies so labeled become presumptive starting points or guides for cultivation?

  **(2) Addressing Existing Framings & Why the Question Remains Open:**

  *   **Direct Contradiction Reading (Common, but contested adequacy):** Interpreters largely agree Mencius explicitly claimed human nature is good (*shan*), while Xunzi explicitly claimed it is bad (*e*). However, this framing assumes they shared a single, stable empirical referent for *xing*. The subsequent prevalence of the "talking past" diagnosis strongly suggests this assumption is problematic.
  *   **Mere Verbal Dispute Reading (Widely recognized as sophisticated):** Many sophisticated interpreters conclude Mencius and Xunzi used *xing* with such different implicit criteria that their claims don't directly conflict; they were defining the term differently based on distinct concerns (e.g., Mencius on innate moral potentials, Xunzi on raw, untutored spontaneity). **This diagnosis leaves open the key question:** *Why* did they develop these different criteria? What theoretical or practical *work* did labeling something *xing* perform for each within their broader project of moral education? The "talking past" view identifies the semantic divergence but doesn't sufficiently explain its *motivation* or *consequence*.

  My hypothesis is that the divergent semantic criteria stem from a deeper, substantive disagreement about moral pedagogy: Mencius required *xing* to bear normative authority to ground cultivation as "completion" (擴充, *kuochong*), while Xunzi required *xing* to be normatively inert to prevent it from undermining the exclusive authority of ritual (禮, *li*) and teachers.

  **(3) Methodology & Fellowship Activities:**

  During the two-month fellowship, I will conduct a focused textual analysis to test this hypothesis:

  1.  **Reconstructing Operational Concepts:** Precisely reconstruct the implicit *rules* or *criteria* each thinker uses to classify a tendency as belonging to *xing* (e.g., Mencius: spontaneous moral-like reactions prior to learning? Xunzi: innate desires independent of conscious artifice?).
  2.  **Identifying Critical Test Cases:** Identify specific psychological phenomena discussed by both thinkers or where their criteria yield divergent classifications. Key examples include:
      *   **Shame (恥, *chi*):** Both discuss shame. Is pre-instruction shame evidence of "good nature" (Mencius) or merely a raw feeling co-optable by ritual (Xunzi)? Does its classification as (not) *xing* affect its normative status in their pedagogy?
      *   **Parental Love:** Mencius cites it as sprout evidence. Xunzi might classify it as spontaneous desire needing ritual shaping. Does its status as *xing* grant it inherent normative weight for Mencius that it lacks for Xunzi?
      *   **Sensory Preferences:** How does each handle innate desires for food/comfort? Are they *xing*? If so, what normative role (if any) do they play?
  3.  **Textual Analysis of Normative Role:** For each test case, analyze:
      *   How the text classifies the tendency vis-à-vis *xing*.
      *   The *subsequent argumentative or pedagogical role* that classification plays. Does labeling it *xing* serve to (a) legitimize/authorize it, (b) mark it as material needing transformation, or (c) have no inherent normative consequence?
  4.  **Comparative Synthesis:** Systematically compare the results across cases to determine if the data consistently supports the hypothesis that the core disagreement concerns the *normative function* of the term *xing* within moral education.

  **(4) Failure Conditions:**

  This project would fail to support the hypothesis if:

  1.  **No Normative Link:** Textual analysis reveals that labeling a tendency *xing* carries *no discernible or consistent normative weight* (authoritative or inert) in *either* thinker's arguments about moral cultivation. The term would be purely descriptive.
  2.  **Shared Function:** Analysis shows Mencius and Xunzi *both* use *xing* either to confer normative authority *or* to mark normative inertness, contradicting the proposed opposition.
  3.  **Indeterminacy:** The texts prove too ambiguous or sparse on the specific test cases and the pedagogical consequences of labeling to draw reliable conclusions within two months (e.g., if Xunzi's view on the normative status of innate desires like shame remains fundamentally unclear upon close reading).
  4.  **Conceptual Confusion:** The attempt to isolate an "operational concept" of *xing* for each thinker proves impossible or yields criteria too vague or inconsistent to apply meaningfully to test cases.

