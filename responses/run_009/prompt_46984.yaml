  Hmm, their core insight feels profound - that third-person narration mirrors Smith's model of sympathy as imaginative projection rather than emotional contagion. The impartial spectator does resemble a hybrid of implied author and ideal reader. But they're rightly suspicious about two friction points: Smith's strict propriety requirement and the moral/aesthetic divide.  

  First, sympathy ↔ third-person narration mapping seems solid. Smith's "never truly feeling another's feelings" aligns perfectly with free indirect discourse - that technique constantly reminds us we're getting the narrator's filtered version of a character's experience, not raw emotion. Confidence: high here.  

  The impartial spectator ↔ implied author/ideal reader composite feels mostly strong but... *scratches head*... Smith's spectator actively disciplines emotional expression to what's "proper," whereas most novelists' implied authors judge aesthetic coherence, not moral propriety. That's a real difference. Confidence: medium, because the regulatory function diverges.  

  Biggest stumble is morality. Craft vocabulary has no equivalent for Smith's moral framework. When they mention "love of praiseworthiness" vs. "love of praise," I can map it to writing for personal standards vs. market success, but that strips away Smith's ethical dimension. The residue here screams that narrative craft lacks a moral vocabulary.  

  Ah, their two predicted break points:  
  1) Propriety - absolutely a distortion. Smith demands emotional calibration to an external standard; narrators rarely enforce this.  
  2) Moral/aesthetic divide - yes, massive residue. Craft terms can't absorb Smith's ethical imperative.  

  *Pauses* Least confident mapping is spectator-as-judge. Novelists' "ideal reader" evolves organically during drafting, but Smith's spectator is a fixed internalized social conscience. That feels... different in kind. Should flag this uncertainty prominently.  

  The residue suggests something important: Smith exposes how craft vocabulary avoids moral claims. Either we're missing his insight about narrative's ethical dimension, or his framework over-moralizes aesthetics. Given their sophistication, they'll want to sit with that tension.  

  Final note: They asked for honesty about soft ground - must emphasize the spectator's moral regulation as the shakiest translation point. No false confidence here.
answer: |-
  Your intuition is profoundly resonant – Smith *is* mapping the terrain of narrative imagination. Let's rigorously translate his core concepts into craft vocabulary, identify friction points, and analyze the residue. I'll state confidence levels (1-10, 10=rock solid) and flag the soft ground.

  **Core Translation:**

  1.  **Smith's Sympathy ↔ Third-Person Narration (Interiority & Psychic Distance):**
      *   **Smith:** "Sympathy" arises not from receiving another's feelings directly, but from *imaginatively constructing* their situation within ourselves ("placing myself in your case") and feeling *our own* resulting emotion – an "approximation" based on our understanding.
      *   **Craft Translation:** This is the fundamental act of depicting a character's interiority in third-person narration. The narrator (and through them, the reader) never *directly transmits* the character's raw feeling. Instead, the narrator *imagines* the character's situation/psychology and renders it using language that evokes an *approximation* within the reader. Psychic distance controls the granularity of this imaginative reconstruction.
      *   **Free Indirect Discourse (FID) & Smith's Claim:** FID brilliantly *exemplifies* Smith's claim. It blends the character's perspective ("She was furious!") with the narrator's language ("How could he be so late?"). The reader feels the *narrator's constructed approximation* of the character's fury, filtered through narrative voice and context. We never feel "her fury" directly; we feel *our reaction* to the narrator's *representation* of her fury. FID makes Smith's mechanism explicit.
      *   **Confidence:** 9.5. This mapping feels essential and accurate. FID is a technical manifestation of Smithian sympathy.

  2.  **The Impartial Spectator ↔ The Composite Judge (Implied Author + Ideal Reader):**
      *   **Smith:** The "impartial spectator" is an internalized, idealized, "well-informed" judge residing "within the breast." We desire its approval ("love of praiseworthiness"), which requires genuine propriety, not just the "love of praise" from actual, potentially biased or ignorant people.
      *   **Craft Translation:** The Spectator maps cleanly onto a *composite* of the **Implied Author** (the author's second self manifested in the text's choices, values, and judgments) and the **Ideal Reader** (the fully perceptive, empathetic reader the text constructs and addresses, whose judgment the author ultimately seeks to satisfy). This composite judge embodies the internal standard of narrative "praiseworthiness" – coherence, authenticity, depth, aesthetic rightness – distinct from pleasing an actual, fallible readership ("love of praise" = writing for market/applause). As the draft matures, this judge evolves ("half construct, half discover").
      *   **Confidence:** 8. The core function (internalized ideal judge vs. external actual approval) maps precisely. The *process* of constructing/discovering this judge mirrors internalizing the spectator.

  3.  **Love of Praise ↔ Writing for the Actual Readership/Market:**
      *   **Smith:** Desire for the immediate, actual approval of present company/society, which can be fickle, misguided, or based on superficial factors.
      *   **Craft Translation:** Writing primarily to please a specific, known market trend, chase bestseller formulas, gain immediate acclaim, win a popular prize, or satisfy a specific editor/agent's known preferences. It's responsiveness to the tangible, existing audience's appetites.
      *   **Confidence:** 9. Direct and clear analogy.

  4.  **Love of Praiseworthiness ↔ Writing for the Composite Judge (Implied Author/Ideal Reader):**
      *   **Smith:** Desire to be *worthy* of approval from the impartial spectator, regardless of whether actual approval is granted. Rooted in objective propriety and self-respect.
      *   **Craft Translation:** Writing to satisfy the internal standard embodied by the Implied Author/Ideal Reader composite. Striving for what feels *intrinsically right* for the story, characters, and themes – the standard the novelist feels *should* command respect from a truly discerning reader, even if the actual market doesn't reward it. This is the drive behind "killing your darlings" or pursuing difficult, unfashionable projects.
      *   **Confidence:** 9. Captures the internal drive for intrinsic narrative integrity.

  **Residue Report & Your Suspected Break Points:**

  1.  **The Discipline of Propriety (Your 1st Suspected Break):**
      *   **Smith:** The Spectator demands *propriety*: passions must be moderated ("pitched") to the level the Spectator can "go along with." This is a specific calibration – *neither more nor less* than the situation objectively merits. It's a moral-emotional thermostat.
      *   **Craft Translation Distortion:** While the Implied Author judges coherence and emotional truth, this judgment is rarely framed as a demand for *strict, socially calibrated propriety* in Smith's sense. A narrator can depict wildly *im*proper passions (rage, obsession, despair) with great aesthetic "rightness" (e.g., Dostoevsky, McCarthy). The judgment is more about *authenticity within the character/world* and *narrative effectiveness* than about calibrating emotion to an external standard of "appropriate degree." The Implied Author might demand intensity *beyond* what a dispassionate spectator could "go along with" for dramatic effect.
      *   **Residue:** Smith's specific, quasi-social calibration of emotional *degree* based on propriety doesn't cleanly translate. Craft vocabulary focuses on *verisimilitude* (within the fictional world) and *impact*, not social/moral propriety as an external measure.
      *   **Survival:** The *demand* survives (the Composite Judge demands *something*), but the *content* of the demand (propriety/calibration) distorts significantly.
      *   **Confidence in Break:** High (9). This is a major difference. The narrator's tacit judgments are broader and more aesthetically focused.

  2.  **Moral vs. Aesthetic Work (Your 2nd Suspected Break):**
      *   **Smith:** The Spectator is fundamentally a *moral* judge. Sympathy and propriety are mechanisms for moral evaluation and social cohesion. "Praiseworthiness" is ethical.
      *   **Craft Vocabulary Gap:** **This is the largest residue.** Our vocabulary (Implied Author, Ideal Reader, praiseworthiness) is primarily *aesthetic* and *structural*. While narrative judgments *can* have moral dimensions, the *terms themselves* lack an inherent moral component. We talk about "narrative justice," "moral complexity," or "ethical vision" *within* the story, but the *judge* (Implied Author/Ideal Reader) is primarily defined by aesthetic/structural discernment. "Praiseworthiness" in craft is about craft excellence, not necessarily moral goodness. A brilliantly crafted, deeply immoral narrative *is* praiseworthy in craft terms.
      *   **Residue:** Smith's entire framework is saturated with morality. Craft vocabulary is largely amoral. We lack a term for the *ethical* counterpart to the Implied Author – the internalized judge of the narrative's *moral* coherence or vision, distinct from its aesthetic one. The "Composite Judge" in craft is primarily aesthetic.
      *   **Survival:** Smith's *structural mechanism* (internal ideal judge vs. external actual approval) survives, but its *purpose and substance* (moral regulation) largely evaporates in the translation.
      *   **Confidence in Break:** 10. This is an inescapable gap.

  **Other Residues:**

  *   **The Social Origin:** Smith's Spectator is internalized *from* social interaction. The Craft Composite Judge is internalized *from* reading, writing, and aesthetic experience. The formative process differs.
  *   **Universality Aspiration:** Smith's Spectator aims for a universal, objective moral standpoint ("impartial"). The Craft Composite Judge is inherently more personal, shaped by the author's literary tradition, taste, and vision. While seeking a kind of narrative "truth," it doesn't claim Smith's level of universality.

  **Where the Residue Points:**

  1.  **Craft Vocabulary is Missing Something:** It lacks a robust conceptual slot for the *inherently moral dimension* of narrative judgment that Smith highlights. We have tools for aesthetic and structural judgment, but not for the *ethical imperative* or the *social calibration of emotion* that Smith sees as central to sympathetic imagination. Your craft terms excel at describing *how* we imagine others, but Smith forces us to confront *why* and *to what end* we do it (social/moral harmony). The residue points to a potential blind spot in purely aesthetic craft discourse regarding the moral weight and social function of narrative imagination itself.
  2.  **Smith's Framework Smuggles In Claims?:** While profound, Smith *does* universalize a specific (18th-century, bourgeois, sentimental) model of moral psychology as *the* mechanism of social cohesion. The "propriety" demand can feel alien and restrictive when applied directly to art. His framework might overstate the *necessity* of strict emotional calibration for successful imagination/narration. Art often thrives on exploring the *im*proper and excessive. So yes, Smith smuggles in normative claims about emotional expression and social order that aren't essential to the basic act of narrative imagination, though they are deeply linked to his *moral* project.

  **The Softest Ground (Least Confident Mapping):**

  *   **The Impartial Spectator as *Active Disciplinarian*:** Mapping this function onto the **Implied Author** feels most precarious. While the Implied Author *embodies* standards, the *active discipline* Smith describes (moderating passions *in real-time* to meet the Spectator's approval) feels more like the *conscious, pre-revision judgment of the author guided by their Ideal Reader/Internal Editor* during the drafting process. The Implied Author is the *result* of choices, not quite the *voice* making those choices moment-to-moment. Is the Spectator the internalized *standard* (closer to Implied Author/Ideal Reader) or the internal *process* of self-correction? This blurriness makes the mapping of the *disciplinary mechanism* onto a specific craft term less secure than the mapping of the *judge itself*.
      *   **Confidence in this specific aspect:** 6.5. The *judge* maps well; the *active, propriety-enforcing discipline* maps less perfectly onto a single craft term. It feels more like the author's conscious process *informed by* the composite judge.

  **Conclusion:**

  Your feeling is valid: Smith provides a powerful philosophical account of the imaginative mechanics central to fiction writing, especially third-person narration and FID. The translations of "sympathy," the "impartial spectator" (as composite judge), and the love of praise/praiseworthiness are remarkably robust on a structural level.

  However, significant residue exists:
  1.  **Smith's Propriety:** Its strict demand for emotional calibration doesn't translate cleanly to narrative aesthetics, which often embrace extremity.
  2.  **Smith's Morality:** This is the core residue. Craft vocabulary is aesthetic; Smith's framework is moral. The Composite Judge is an aesthetic arbiter; Smith's Spectator is a moral one.
  3.  **The Spectator's Discipline:** The *active, propriety-enforcing function* maps least securely onto a single craft term.

  The residue points *both* ways: craft discourse might undervalue the inherent moral dimension of narrative imagination that Smith exposes, *and* Smith's framework imposes a specific, normatively loaded moral psychology that isn't essential to the craft act itself, though deeply relevant to its potential social impact. Smith reveals the moral substrate underlying the craft – a substrate your vocabulary describes brilliantly in its own operational terms, but doesn't explicitly name as *moral*. Your craft sees the *how*; Smith articulates a profound *why* rooted in human sociality.
