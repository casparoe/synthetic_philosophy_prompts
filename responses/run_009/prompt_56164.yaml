prompt: |-
  I've spent enough time on Gödel's modal ontological argument to know that the live question isn't formal validity — take the derivations as correct — but whether it can be a good argument, and before I look at any more emended versions I want the standards written down first. The proof defines a Godlike being as one having all positive properties, moves from axioms about positivity to the possibility of such a being, and then, since necessary existence is itself taken to be positive, to a Godlike being's necessary existence; and it has since been shown that the original axioms also entail that whatever is true is necessarily true, which nearly everyone agrees is too high a price. Distill the demands on any argument of this shape into exactly five desiderata, judged for the purpose of persuading someone who is not already a theist. The pressures I'm aware of, which you should evaluate rather than merely transcribe: it must yield a unique maximally great being and not just some necessary existent, since abstract objects like the number 7 exist necessarily without being God; it must survive the mirror argument, running on negative properties toward a necessarily existent devil; it must not trivialize the modal logic it is couched in, as the original did; it must earn the possibility premise without smuggling a miniature ontological argument into the justification of that premise; and it must say whether Leibniz's insistence that God exist per se necessarily — necessary in itself, not merely entailed by something else that happens to be necessary — is a genuine requirement or a theological prejudice. Each of the five items should be a sentence or two: the requirement, the case behind it, and a clause on whether Gödel's original or a standard emendation satisfies it. Give the answer as a numbered list of exactly five items, no introduction or conclusion, in American English.
reasoning: |-
  Hmm, the user wants me to distill Gödel's ontological argument into five key requirements that a good version must meet. They're familiar with the argument's structure - defining a Godlike being with all positive properties, moving from possibility to necessity via axioms about positivity - and aware that standard versions collapse into necessitarianism (everything being necessary). They specifically want five desiderata that would persuade a non-theist, addressing uniqueness, avoiding devilish mirror arguments, maintaining logical integrity, justifying possibility without circularity, and handling Leibniz's "per se" necessity.

  Let me think through the pressures they mentioned. First, uniqueness: Gödel's original argument doesn't guarantee a single Godlike being, and we need to avoid equating God with abstract objects like numbers. Second, the mirror argument problem: defining God through negative properties could "prove" a necessary devil. Third, modal logic trivialization: the original axioms make all truths necessary, which is absurd. Fourth, possibility premise justification: we can't sneak in a mini-ontological argument when arguing that God's existence is possible. Fifth, Leibniz's "per se" necessity: whether God's necessity must be intrinsic rather than derived.

  Now for my distillation: 
  1. Uniqueness requirement - must pin down one entity, not just some necessary thing. Original fails this. 
  2. Asymmetry requirement - must block negative property mirroring. Original fails. 
  3. Non-trivialization requirement - can't make all modal distinctions collapse. Original fails catastrophically. 
  4. Non-circular possibility justification - possibility must be argued independently. Original doesn't attempt this properly. 
  5. Per se necessity handling - should address whether God's necessity is self-derived. Original claims it but implementation is flawed.

  I'll present these as five numbered items in American English, each with requirement, rationale, and verdict on Gödel's version. No intros or conclusions per the query. The tone should be crisp and analytical - this user clearly knows their stuff and wants rigor, not handholding. They've seen too many patched-up versions and want the bedrock criteria first.
answer: |-
  Here are the five distilled desiderata:

  1.  **Unique Identification of God:** The argument must demonstrate the existence of one specific, concrete, maximally excellent being distinct from necessary abstracta (like numbers). Gödel's original fails; it yields necessary existence but doesn't secure uniqueness or sufficient concreteness to differentiate God from abstract entities.
  2.  **Asymmetry Against Evil:** The formal apparatus must inherently block a structurally identical "mirror argument" defining a maximally evil being via negative properties, proving a necessary devil. Gödel's original fails; it provides no principled reason why "positive" properties couldn't be replaced by "negative" ones.
  3.  **Non-Trivializing Modal Logic:** The axioms must not entail modal collapse (that all truths are necessary), which obliterates meaningful modal distinctions and is widely rejected. Gödel's original fails catastrophically; its axioms directly imply modal collapse.
  4.  **Non-Circular Possibility Premise:** The justification for the possibility of a Godlike being must be independent and substantive, avoiding any covert reliance on the conclusion of the ontological argument itself. Gödel's original fails; it offers no genuine independent justification, leaving the possibility premise unsupported or question-begging.
  5.  **Clarification of Per Se Necessity:** The argument must explicitly address whether God's necessary existence is derived (entailed by other necessary truths) or *per se* (intrinsically necessary, grounded solely in God's own nature), and justify this choice philosophically. Gödel's original claims *per se* necessity via the "necessary existence" property but fails to adequately implement or justify it within the system, leaving it vulnerable to being interpreted as merely derived.
