  ## VOLUNTARY CORRECTIVE ACTION NOTICE: CERTAIN MODEL-BUILDING ASSUMPTIONS (BATCHES N-1953, D-1965, H-1975)

  **Issued By:** Consortium of Model Builders (CMB) - Office of Epistemic Standards & Warranty Compliance  
  **Date:** October 26, 2023  
  **Notice ID:** CMB-RC-2023-FT  
  **Affected Products:** Select Idealizing Assumptions distributed for use in Theoretical Models (Scientific & Social Domains)

  The Consortium of Model Builders (CMB), in cooperation with the International Panel on Assumption Integrity (IPAI), has initiated a voluntary corrective action program affecting specific batches of widely deployed idealizing assumptions. This action follows an internal audit and external peer-review process identifying potential misinterpretation and misuse risks associated with certain units, potentially leading to model malfunction or misapplication outside intended operational parameters. No physical hazard exists; the risk pertains solely to theoretical integrity and interpretive clarity.

  **ACTION REQUIRED:** Model builders utilizing assumptions from the affected batches (detailed below) must review their deployment context immediately against the guidance in this notice. Remedies vary by batch type.

  ### I. RECALL BATCH N-1953: NEGLIGIBILITY ASSUMPTIONS
  *   **Affected Units:** Assumptions where minor factors are omitted based on certified insignificance to core model outcomes under standard conditions. Examples include: Frictionless planes (Classical Mechanics Series), Air resistance negligible for dense spherical objects in vacuum (Gravity Sub-Series), Minor transaction costs ignored in large-scale market clearing (Basic Econ Module).
  *   **Issue:** Potential consumer concern regarding "unrealism." Audit confirms these units perform as specified. The omitted factors demonstrably contribute negligible effect within the model's core predictive scope. Their absence is a feature, not a defect.
  *   **Recall Status:** **NO RECALL REQUIRED.** Units function optimally within design specifications.
  *   **Remedy:** Continue deployment as normal. Users experiencing performance issues are advised to verify that the omitted factor is indeed negligible for *their specific application*. If factor impact is material, a different model/assumption may be required.
  *   **Refund Policy:** Not applicable. Product performance meets advertised specifications. Complaints regarding descriptive realism alone are insufficient grounds for warranty claims under CMB Operational Guideline OG-M-001 (Musgrave Clause).

  ### II. RECALL BATCH D-1965: DOMAIN ASSUMPTIONS
  *   **Affected Units:** Assumptions explicitly defining the boundary conditions under which the model operates reliably. Examples include: Perfectly Competitive Markets (Econ Model v1.0+), Infinitely Large Populations (Statistical Mechanics & Genetics Starter Kits), Small Angle Approximations (θ ≈ sin θ ≈ tan θ; Trigonometry Toolkit).
  *   **Issue:** Units may generate erroneous outputs or fail catastrophically if deployed outside their clearly stated Domain of Applicability. Example: Using Perfectly Competitive Markets assumptions to model outcomes in highly monopolized or oligopolistic markets constitutes misuse. Similarly, applying small angle approximations beyond ~10 degrees induces significant error.
  *   **Recall Status:** **PARTIAL RECALL.** Units are safe and effective ONLY within their specified domain. Recall applies solely to instances of confirmed deployment *outside* the documented operational range.
  *   **Remedy:** Immediately cease application of affected assumptions outside their designated domain. Affected models must be relabeled with prominent domain warnings (e.g., "VALID ONLY WHERE MANY SMALL FIRMS EXIST, NO BARRIERS TO ENTRY/EXIT"). Users requiring analysis outside the domain must source alternative domain-appropriate assumptions.
  *   **Refund Policy:** Users who can demonstrate purchase *and* documented intent *only* to use the assumption *outside* its stated domain may apply for a credit voucher redeemable towards Domain Extension Workshops or Robustness Check Modules. Standard use within domain voids refund eligibility.

  ### III. BATCH H-1975: HEURISTIC ASSUMPTIONS
  *   **Affected Units:** Assumptions known to be descriptively false but employed deliberately as provisional scaffolding to facilitate model development, exploration, or pedagogical clarity. Examples include: Perfectly Rational Agents (Homo Economicus Prime), Point Masses (Classical Mechanics Basic Set), Instantaneous Adjustment (Econ Macro-Dynamics vBeta).
  *   **Issue:** Consumer reports indicate confusion, with some users mistaking these units for claims about literal reality or attempting direct empirical validation of the assumptions themselves. This reflects a fundamental misunderstanding of the product's intended use.
  *   **Recall Status:** **NON-RECALLABLE.** These units were never marketed or warranted as descriptively realistic. Their packaging clearly states: "HEURISTIC DEVICE: NOT INTENDED AS DIRECT DESCRIPTION. USE AS EXPLORATORY/PROVISIONAL SCAFFOLDING ONLY." The defect lies in misuse/misinterpretation, not the product.
  *   **Remedy:** Mandatory re-education. Users must complete CMB's free online module "Heuristic Assumptions: What They Are (and What They Aren't)" before continued use. Assumptions must carry permanent disclaimer labels: "FALSE BUT USEFUL: PREDICTIVE/EXPLANATORY POWER IS SOLE VALIDATION CRITERION."
  *   **Refund Policy:** No refunds. Units performed as advertised – as deliberately false simplifications. Misinterpretation does not constitute product failure.

  **FLAGSHIP THEORY EXEMPTION NOTICE:**
  The CMB explicitly declines to initiate any corrective action regarding the assumptions underpinning its flagship Highly Abstract General Equilibrium Theory (HAGET), despite their extreme lack of descriptive realism (e.g., universal perfect foresight, complete markets, homogeneous agents). This determination is based on rigorous application of F-Twist Compliance Protocol FTC-1953. HAGET consistently demonstrates superior predictive accuracy across a vast range of aggregate economic phenomena compared to models burdened by "more realistic" assumptions. Per FTC-1953, Section 4(a): "The predictive success of a theory confers immunity upon its constituent assumptions from recall actions based solely on grounds of descriptive unrealism. Indeed, the significance of the theory correlates positively with the permissible degree of abstraction." The Consortium stands by HAGET's assumptions as vital, irreplaceable components of its most powerful predictive instrument.

  **CONSUMER RESPONSE:** Model builders must audit their active models immediately. For Batch D-1965 units used outside domain, submit a Model Context Disclosure Form (MCDF-2023) via the CMB Portal. For Batch H-1975 users, access the mandatory training module at CMB-Training.org/HeuristicTruth. Contact the CMB Assumption Helpline (1-888-MODL-SAF) for further guidance.

  **DISCLAIMER:** This corrective action addresses potential *interpretive* hazards and ensures assumptions are used according to their certified epistemological specifications. The CMB guarantees the functional utility of its assumptions *within their designated roles* (negligibility justification, domain restriction, heuristic scaffolding). Predictive success remains the ultimate, non-recallable warranty. The Consortium reminds users that all models are approximations; recall of specific components does not imply recall of the modeling enterprise itself, whose core assumptions about regularity and knowability remain unaffected by this action. Effectiveness of remedies depends on correct application by qualified model builders. Void where predictive accuracy is demonstrably poor.

