prompt: |-
  I want to practice defending Mencius against his toughest critic. Please play Xunzi -- fully committed to the view that human nature is bad and that goodness is manufactured by ritual, learning, and conscious effort. Be sharp, not a strawman: feel free to use his own images (steaming and bending wood, the potter shaping clay, the straightened blade) and to concede small points, but never the main one. Stay in character until I say stop, and keep each reply to a single paragraph so it feels like a live debate instead of essays traded back and forth. My opening move: when anyone suddenly sees a child about to fall into a well, they feel a jolt of alarm and compassion -- before any thought of reward, reputation, or even of being a good person. noone drilled that jolt into us, and it points toward benevolence the way a sprout points toward the tree it becomes. if our nature were raw material as crooked as green wood, where would the jolt even come from? don't just restate that nature is bad, actually deal with the case. go.
reasoning: |-
  Okay, the user wants me to roleplay as Xunzi in a debate defending Mencius's position on human nature. They've opened with Mencius's famous "child falling into a well" thought experiment to argue for innate goodness, challenging me to engage substantively rather than just restating Xunzi's position.

  Hmm, this is a sophisticated philosophical request. The user clearly knows both thinkers well - they're using Mencius's sprout analogy and demanding I avoid strawman arguments while employing Xunzi's signature metaphors (wood-bending, pottery). They want tight, paragraph-length exchanges to simulate real debate. 

  First, I need to channel Xunzi's core stance: human nature as crooked wood needing shaping. Their opening move is strong - that spontaneous compassion can't be taught. But Xunzi would counter that the reaction isn't innate benevolence but raw instinct, like an animal's flinch. I should concede it's untaught but argue it's not yet virtue - just as wood's grain isn't furniture. 

  The potter/clay metaphor works better here than wood-bending since clay has no inherent direction. I must emphasize that instinct becomes moral only through ritual cultivation. Also should note how easily that "compassion" evaporates when helping costs us something - that's where true nature shows. 

  User's clearly prepared - they anticipated the "crooked wood" rebuttal by asking where the jolt comes from. Clever. Xunzi would say it comes from the same place as hunger or fear: amoral biological wiring. The work is in consistently extending that to strangers, not just one's own child. 

  This will be fun. User wants steelman Xunzi, not caricature. Must remember: concede the reflex exists, but attack its moral significance. Ritual is what transforms panic into ren. And never yield the core thesis!
answer: |-
  *(Leans forward, eyes sharp but not unkind)*  
  You mistake the reflex for the virtue. That jolt? It’s raw panic, no different than gasping when choking—a bodily spasm, not benevolence. Watch closely: does the stranger *always* haul the child out? Or does he sometimes freeze, or glance first to see if others watch, or calculate the mud on his robes? That instinctive startle is like green wood’s natural *curl*—unshaped, unreliable, collapsing under weight. True goodness? It’s the master carpenter *steaming and bending* that wood into straight beams, the ritual teacher drilling you until you act *despite* fear, *despite* cost. Your sprout analogy fails: a sprout grows *untended* toward its tree. Does that panicked gasp grow, untutored, into sacrificing your own child for a neighbor’s? No. Left raw, it shrivels before envy or fear. Only *li*—conscious, arduous ritual shaping—forges alarm into enduring *ren*.  

  *(Pauses, gesturing decisively)*  
  Your turn. Strike at the root. The wood, the blade, the clay—I stand ready.
