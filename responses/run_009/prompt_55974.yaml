answer: |-
  Here are 11 interview questions for Dr. L., structured for flow and depth, incorporating your requirements and anticipating her likely responses:

  1.  **Motivation:** "Dr. L., core EU theory rests heavily on money-pump arguments to justify transitivity, completeness, and independence. You argue these arguments are overrated. To start, could you briefly summarize why you believe the standard money-pump narrative misidentifies the real lesson about rationality?" *(Bridging: Establishes core disagreement upfront.)*
  2.  **One-Shot vs. Sequential (Req 1):** "The classic money pump requires multiple trades to exploit an agent. If an agent exhibits intransitive preferences only *once*, and avoids being pumped sequentially – perhaps by luck or context – is there still a rational flaw in that single, isolated preference cycle? What harm does it cause?" *(Follow-up if she downplays harm: "If isolated cycles are benign, doesn't that undermine the normative force of transitivity itself for single choices?")*
  3.  **Sophisticated Choice (Req 2):** "Sophisticated agents foresee the pump and refuse the first trade. The standard reply is that while this avoids exploitation, it reveals a conflict between the agent's *preferences* and their *rational plan*. Why isn't this conflict itself irrational? What's wrong with requiring preferences to directly support coherent plans?" *(Follow-up if she emphasizes plan rationality: "Doesn't divorcing plan-rationality from preference-rationality make preferences normatively inert? Aren't they just descriptions of momentary whims?")*
  4.  **Resolute Choice & Separability (Req 3):** "Building on foresight, McClennen's 'resolute choice' involves committing to a plan upfront and sticking to it. Does your defense of agents who avoid pumps implicitly rely on endorsing resoluteness? And crucially, does this require rejecting the 'separability' of sequential decisions – the idea that rational choice at a node depends only on prospects *from* that node?" *(Follow-up if she affirms non-separability: "Many see separability as fundamental to instrumentally rational agency – choosing *now* based on future *choices*. Isn't rejecting it a huge cost, making your view less a refinement of standard rationality and more a radical alternative?")*
  5.  **Conditional-Preference Gap (Req 4):** "You've argued for a 'conditional-preference gap': an agent facing the *second* trade in a pump may rationally refuse because their preferences *at that point* differ from their initial conditional preferences, preventing the exploiter from 'closing the ledger'. Isn't this just saying agents can stubbornly stick to initial plans? How does this avoid making rationality unfalsifiable – couldn't *any* preference shift be defended this way?" *(Follow-up if she emphasizes context-sensitivity: "Doesn't this context-sensitivity itself become exploitable? Couldn't a clever exploiter design trades specifically targeting predictable shifts in your conditional preferences?")*
  6.  **Independence Axiom Violations (Req 5):** "Let's consider violations of Independence, like Allais preferences. Here, the *certainty* of an offer can change preferences mid-pump. If exploiting such an agent requires offering a sure-thing that itself *alters* the preferences you're trying to exploit, does the money-pump argument even get off the ground? Or does it reveal a deeper problem with pumping non-EU preferences?" *(Follow-up if she argues pumping fails: "If Allais preferences *can't* be pumped due to their structure, does that mean they are *more* rational than simple intransitivities, or just differently irrational?")*
  7.  **The Role of Protective Apparatus:** "You argue money pumps show we need protective apparatus – commitments, procedures, awareness. But doesn't this concede that the *underlying* preferences *are* vulnerable? Isn't the need for such apparatus itself evidence of a rational defect in the preferences?" *(Follow-up if she distinguishes vulnerability from defect: "If preferences necessitate complex defenses just to avoid exploitation, doesn't that make them practically irrational, even if not logically incoherent?")*
  8.  **Normative Force vs. Practical Avoidance:** "Much of your work focuses on how agents can *avoid* being pumped. But the standard argument aims to show cyclical preferences are *inherently irrational*, regardless of exploitability. Can your focus on avoidance strategies fully address this *normative* claim, or does it sidestep the core question of whether the preferences themselves constitute a mistake?" *(Bridging: Pushes from practical tactics back to normative foundations.)*
  9.  **Alternatives to EU Foundations:** "If money-pump arguments for EU axioms are flawed, what *should* ground rational choice theory? Are there alternative foundations – perhaps based directly on planning, dynamic consistency, or something else – that you find more compelling or less vulnerable to your critiques?" *(Bridging: Opens discussion on positive alternatives.)*
  10. **Scope of the Critique:** "Is your critique targeted specifically at money-pump arguments, or does it extend to other dynamic inconsistency arguments used to support EU, like Dutch books for probabilism or other sequential exploitation schemes? Does the core issue – conflating agent properties with preference properties – apply broadly?" *(Bridging: Broadens the perspective.)*
  11. **Closing: Diachronic Rationality in Action (Req Closing):** "Finally, if we accept your critique and move beyond money-pump arguments as the primary enforcer, what does 'diachronic rationality' concretely demand of us? What principle or practice should a graduate student listener adopt *instead* to ensure their choices remain rational over time, and avoid the pitfalls your work identifies?"

  **Key Design Choices:**
  *   **Order:** Starts with motivation (Q1), moves to core arguments (Q2-6), then examines implications/concessions (Q7-8), explores alternatives/scope (Q9-10), and ends with the actionable takeaway (Q11).
  *   **Substance:** Questions directly engage technical points (one-shot, sophistication, resoluteness, gaps, independence) while demanding justification beyond simple avoidance. Language assumes familiarity with terms like "sophisticated," "resolute," "separability," "Allais," "conditional preference."
  *   **Follow-ups:** Included for Q2, Q3, Q4, Q5, Q7. These anticipate likely responses based on her position (downplaying one-shot harm, emphasizing plan rationality, endorsing non-separability, emphasizing context-sensitivity, distinguishing vulnerability from defect) and push her towards harder concessions or clarifications. They target potential weaknesses in her view.
  *   **Bridging:** Brief remarks (in italics) guide the logical flow between clusters of questions.
  *   **Actionable Closing:** Q11 forces a positive, practical formulation of diachronic rationality, meeting your request for something a listener could act on.
