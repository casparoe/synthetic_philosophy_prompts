                 - We reveal: World A.

              Round 2 (World B):
                 - Same as Round 1, but we are in World B. We assign 12 distinct birth ranks from 1 to 200 (not from 1 to 2000! because we are restricting to the early ones for the purpose of the round). 
                 - They bet: they will likely bet on A because their birth rank is between 1 and 200.
                 - We reveal: World B. They lose.

              Round 3 (World B):
                 - We say: "Now we expand to the entire building: 100 people. We will assign birth ranks from the entire range of the world."
                 - We draw 100 distinct numbers from 1 to 2000 (since we are in World B).
                 - We show the list of birth ranks (or just the maximum). The maximum will be above 200 (most likely).
                 - They bet: they should bet on B because they see a birth rank above 200 (which is impossible in World A).
                 - We reveal: World B.

              Round 4 (World A):
                 - We assign 100 distinct birth ranks from 1 to 200.
                 - We show the list: the maximum is at most 200.
                 - They bet: they should bet on A.
                 - We reveal: World A.

              Round 5 (World B):
                 - We say: "Now we include 100 artificial minds that were created in the future. We have 100 humans in the building and 100 artificial minds. The humans are assigned birth ranks from 1 to 100 (early) and the artificial minds from 101 to 2000."
