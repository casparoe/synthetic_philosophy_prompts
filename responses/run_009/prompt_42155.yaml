                 - We reveal: World A.

            Debriefing:

            We start by asking:

              - In Round 2, why did we lose? 
                    We were in World B, but we only got birth ranks from 1 to 200. That made us think we were in World A. 

              - How is this like the Doomsday Argument?
                    In the Doomsday Argument, we are among the first 100 billion humans. We don't see any birth ranks above 100 billion. So we might think that the total number of humans is only 200 billion? But in reality, we might be in a world with 2 trillion humans and we are just early.

