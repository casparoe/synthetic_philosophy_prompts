              In the activity, we are randomly assigned a birth rank. This assumes that we are a random sample from all observers. In reality, we are not: we are necessarily at the current time. The move from "I am at birth rank 100 billion" to "I could have been any human that ever lived" is not justified. 

            We should emphasize this at the end.

            Implementation note: We can use a computer to generate the random numbers and display them. Or we can prepare the slips in advance.

            Given the time, we might do:

              - Round 1 and 2: with slips for 12 students.
              - Round 3 and 4: we generate 100 random numbers and display the list (or the max) on the board.
              - Round 5 and 6: we generate the birth ranks for humans and artificial minds and display them.

