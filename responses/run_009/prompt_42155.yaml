                 - We draw 100 distinct numbers for artificial minds from 101 to 2000.
                 - We show the birth ranks of the artificial minds (or just say there are birth ranks above 100).
                 - They bet: they should bet on B.
                 - We reveal: World B.

              Round 6 (World A):
                 - We say: "We have 100 humans in the building and no artificial minds (because World A doesn't have any)."
