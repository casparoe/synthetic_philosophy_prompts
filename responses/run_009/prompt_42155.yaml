              - In Rounds 5 and 6, how did we use the artificial minds?
                    They represented future observers. If we can know about future observers, then we can tell the world. But we can't.

            Then we introduce the terminology:

              - The Doomsday Argument: the idea that our birth rank (being around 100 billion) is evidence that the total number of humans is not much larger than 200 billion.

              - The reference class: who counts as an observer? In Rounds 5 and 6, we included artificial minds. But if we don't count them, then we are back to the human-only case.

              - The sampling assumption: the activity assumed that we are randomly sampled from the set of all observers. But in reality, we are not: we are here now because we were born now.

            What will predictably go wrong:

