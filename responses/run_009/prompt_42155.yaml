  ### Activity Design: Doomsday Argument Exploration

  **Objective**: Students confront the tension between treating their birth rank as random evidence and the intuition that this might mislead in the Doomsday Argument.

  **Setup**:
  - **Two worlds**: 
    - **World A (Short-lived)**: Total observers = 200 billion (200e9). 
    - **World B (Long-lived)**: Total observers = 2 trillion (2000e9 = 2e12).
  - **Prior odds**: Equal probability (1:1) for both worlds.
  - **Materials**: Numbered slips (birth ranks), coin (for world selection), projector/board to display group data.
  - **Key mechanics**: Students bet (imaginary $100) on which world they’re in. Correct bets double money; incorrect bets lose everything. Fractional betting allowed (e.g., "60% on A, 40% on B").

  ---

  ### Rounds

  #### **Round 1: This Room (12 Students)**
  - **World selection**: Secretly flip coin (e.g., Heads = A; Tails = B).  
  - **Birth rank assignment**:  
    - Assign each student a **distinct random birth rank between 1 and 200e9** (regardless of actual world).  
    - *Example slips*: #42, #108e9, #199e9, etc.  
  - **Information revealed**:  
    - Tell students: "You are in one of two worlds: World A (200 billion total observers) or World B (2 trillion). Your slip is your birth rank. Bet on the world."  
    - Do **not reveal the true world yet**.  
  - **Betting & payoff**: Students bet individually. Record bets. *Then* reveal true world and resolve payoffs.  
  - **Manipulation**: Birth ranks artificially capped at 200e9 (World A’s max), even if in World B.  
  - **Expected outcome**:  
    - In World A: Ranks ≤200e9 fit perfectly; students bet on A and win.  
    - In World B: Ranks ≤200e9 seem "typical" for A (since P(rank ≤200e9 | B) = 10%). Students bet on A due to likelihood ratio (10:1) but lose.  

  #### **Round 2: Entire Building (1,000 Students)**
  - **World selection**: New coin flip.  
  - **Birth rank assignment**:  
    - Assign 1,000 distinct birth ranks:  
      - If World A: Ranks from 1–200e9.  
      - If World B: Ranks from 1–2000e9 (full range).  
  - **Information revealed**:  
    - Display **maximum birth rank** of the group (e.g., "Max rank: #1.8e12").  
    - Tell students: "We expanded to everyone in this building. Bet using the max rank."  
  - **Betting & payoff**: Group bets (discuss as class). Reveal world and resolve.  
  - **Manipulation**: Uncapped ranks in World B allow high ranks to appear.  
  - **Expected outcome**:  
    - World B: Max rank >200e9 (likely). Students infer B and win.  
    - World A: Max rank ≤200e9. Students infer A and win.  
  - **Transition point**: Students see that high ranks (future observers) resolve uncertainty.

  #### **Round 3: Artificial Minds (1 Million "Future" Observers)**
  - **World selection**: Final coin flip.  
  - **Birth rank assignment**:  
    - **Humans**: 1,000 distinct ranks from 1–100e9 (early ranks).  
    - **Artificial minds**: 1e6 distinct ranks from 1000e9–2000e9 (future ranks, World B only).  
    - *In World A, no artificial minds exist*.  
  - **Information revealed**:  
    - Announce: "1 million artificial minds exist. Their birth ranks are all >1 trillion."  
    - Display a **histogram** of ranks (e.g., "Human ranks: 1–100e9; AI ranks: 1000e9–2000e9").  
  - **Betting & payoff**: Students bet individually. Reveal world and resolve.  
  - **Manipulation**: Future observers (AI) only exist in World B.  
  - **Expected outcome**:  
    - World B: Students see ranks >1e12 and bet on B (win).  
    - World A: No AI ranks; humans ranks ≤100e9. Students bet on A (win).  
  - **Key twist**: Forces confrontation with "who counts?" and whether future observers dilute evidence.

  ---

  ### Debriefing Guide  
  *(Withhold terms like "reference class" until the end)*  

  1. **Recap rounds**:  
     - *Round 1*: You lost in World B because your birth rank was "early" (≤200e9). You treated your rank as a random clue, favoring World A. But the sample was limited to early observers.  
     - *Round 2*: Expanding the sample revealed high ranks in World B. You saw "future people" directly.  
     - *Round 3*: Adding artificial minds made World B obvious. But only if you count non-human observers.  

  2. **Map to Doomsday Argument**:  
     - **Sampling from observers**: In Round 1, you assumed your birth rank was a random draw from *all* observers. But in World B, most observers are in the future. If you’re "early," should you infer doom?  
     - **The reference class problem**: Round 3 asked if AI minds count. Who is in the "reference class"? Only humans? Conscious beings? This changes the odds.  
     - **Dilution reply**: World B’s future observers *should* make your birth rank *less* surprising if you’re early. But in Round 1, we artificially restricted sampling to early ranks. In reality, we can’t see the future.  

  3. **The core impasse**:  
     - "Treating my birth rank as random" assumes you could have been anyone in history. But *are* you a random sample? Or are you fixed in time?  
     - The activity *simulated* randomness (we assigned slips). Reality doesn’t. The move from "I have a number" to "I could have been anyone" is where philosophy creeps in.  

  4. **Introduce terminology**:  
     - **Doomsday Argument**: Using birth rank as Bayesian evidence for humanity’s survival.  
     - **Reference class problem**: Uncertainty about which observers count (humans? AIs?).  
     - **Self-sampling assumption**: The claim that you’re a random observer from all who exist.  

  ---

  ### Predictable Problems & Solutions  
  1. **Problem**: In Round 1 (World B), students resist betting on A despite likelihood ratio.  
     - *Why*: They intuit that restricting ranks to 1–200e9 is "cheating" if World B has 2e12 observers.  
     - *Solution*: Acknowledge the tension: "We’re simulating what it’s like to be early in a long-lived world. In reality, we *are* early—but is that by chance or necessity?"  

  2. **Problem**: Scaling confusion (billions/trillions feel abstract).  
     - *Solution*: Use scientific notation (e.g., 200e9) and analogies ("World A is a village; World B is a continent").  

  3. **Problem**: Round 3’s artificial minds distract into AI ethics.  
     - *Solution*: Steer back: "Whether AI counts isn’t the point. The question is: *If* they count, does that change the inference?"  

  4. **What the activity can’t capture**:  
     - The leap from *having* a birth rank to *being a random sample*. In the activity, randomness is simulated (slips drawn). In reality, you didn’t "draw" your birth era—you’re stuck in it. This is where your 2 a.m. debate lives: **Can we treat the present as statistically neutral, or is it privileged?**  
     - *Facilitator script*: "In the game, we treated your birth rank as random. But is it? Or is your existence tied to your time? The Doomsday Argument assumes randomness; your gut says no. That’s the stalemate."  

  ---  
  **Final Note**: Run Round 1 in World B first (to induce loss). The frustration mirrors your friend’s position. By Round 3, students see that including future observers reverses the inference—but only if they exist. The unresolved question: *Can we infer their existence from our earliness?*
