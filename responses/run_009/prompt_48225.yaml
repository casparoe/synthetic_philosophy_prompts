answer: |-
  ## The Unraveling Thread: Omissions, Individuation, and the Fate of the Doing/Allowing Distinction

  The distinction between actively doing harm and merely allowing it to occur is a cornerstone of moral reasoning. It underpins intuitions that actively killing a patient is worse than withholding life-saving treatment, that pushing someone into a pond differs profoundly from failing to rescue them, and that our obligations to prevent distant suffering might be less stringent than our duty not to inflict suffering directly. Peter Singer's drowning child thought experiment leverages this distinction powerfully: failing to wade in and save the child seems clearly wrong, yet less blameworthy than actively drowning them. However, a persistent and underappreciated problem – what I term the **Problem of the Many Omissions** – threatens to unravel this moral framework, revealing it as potentially arbitrary and incapable of bearing the weight we assign it, particularly in the demanding contexts championed by effective altruism and rationalist ethics.

  The core worry is this: when an agent *allows* a harm, there seems to be no non-arbitrary fact of the matter about *which specific omission* constitutes the morally relevant "allowing." Consider the doctor who allows a patient to die by withholding a specific, burdensome treatment. Simultaneously, she has *also* omitted to: consult a specialist colleague, research an off-label use of another drug, dedicate her career earlier to inventing a better treatment, or even choose a different profession entirely where she wouldn't face such dilemmas. Similarly, the bystander who fails to rescue the drowning child has omitted: wading in immediately, calling emergency services, having learned better swimming techniques years ago, or taking a different route that day and never encountering the pond. These candidate omissions are legion. They differ drastically in **cost** (from minimal effort to life-altering sacrifice), **probability of success** (near-certain rescue to vanishingly small chance), and **temporal/causal proximity** (immediate action to distant, indirect influence).

  If we cannot identify *which* of these countless omissions is *the* omission by which the harm was "allowed," the very coherence of "allowing" as a single, morally significant category dissolves. Is the doctor's moral failing the immediate withholding, or the career choice decades prior? Is the bystander's sin the failure to wade in, or the failure to have become an Olympic swimmer? If "allowing" fractures into indefinitely many potential failures, each with vastly different moral implications (based on cost, probability, etc.), then the stable moral significance claimed for the *general* doing/allowing distinction – that allowing is *systematically* less bad than doing – evaporates. The distinction becomes too fragmented and context-dependent to serve as a foundational moral principle. This directly challenges its application in debates about euthanasia (active killing vs. passive withdrawal), foreign aid (failing to send money vs. actively impoverishing?), and "bad Samaritan" laws.

  This problem resonates strikingly with the metaphysical **Problem of the Many**. Just as we struggle to pinpoint exactly which atoms constitute a single, fuzzy-edged cloud (with many overlapping collections seeming equally candidate), we struggle to pinpoint exactly which omission constitutes "the" allowing of a harm. Can responses to the metaphysical problem rescue the moral distinction?

  1.  **Vagueness is Real and Harmless?** We could accept that "the omission" is inherently vague. While metaphysically plausible, this is morally treacherous. Morality often demands precision in assigning responsibility. Saying the doctor's responsibility is "vague" between immediate withholding and past career choices provides no practical guidance and seems to trivialize the demand for justification.
  2.  **Accept Many, Pick by Convention?** We could say all omissions are real, but convention or pragmatic interest picks the relevant one (usually the most proximate or obvious). This feels descriptively accurate but normatively bankrupt for ethics. It reduces the moral status of "allowing" to social accident, stripping it of the deep moral significance required to justify, for example, the legal distinction between murder and refusal of treatment. If convention picks wading in over learning to swim, that doesn't explain *why* the former is morally blameworthy in a way the latter isn't; it merely reports our current practice.
  3.  **Interest-Relative Individuation?** We could argue that omissions are individuated relative to our interests, expectations, and norms. The "relevant" omission is the one we normally expect the agent to perform given their role and capacities. This is the most promising analogue and mirrors the common intuitive rescue: only omissions **reasonably within the agent's power**, or **counterfactually necessary** under normal expectations, count. The doctor is expected to consider standard treatments and consults, not invent new drugs. The bystander is expected to wade in or call for help, not possess Olympic skills. The problem *within* the problem, however, is that this "solution" appears viciously circular. **It presupposes the very moral norms the distinction was meant to ground or explain.** We define "reasonable expectation" and "within power" precisely by drawing on our prior intuitions about when allowing *is* blameworthy (e.g., wading in is expected and blameworthy to omit; becoming an Olympic swimmer is not expected and not blameworthy to omit). The distinction isn't doing explanatory work; it's being propped up by pre-existing judgments it was supposed to justify. Why is wading in "reasonable" and inventing a drug not? Because we *already* judge the former omission blameworthy and the latter not. This doesn't salvage the distinction; it reveals its dependence on other factors.

  Consequently, the Problem of the Many Omissions severely undermines the doing/allowing distinction as a fundamental, self-sufficient moral principle. It struggles to survive as a bearer of stable, intrinsic moral weight independent of other considerations. If we need to invoke "reasonable expectation" defined by prior norms to even identify *which* omission matters, then the moral work is clearly being done by those underlying norms, not by the doing/allowing binary itself.

  **Relocating the Moral Work:**

  If the distinction cannot bear the load, where does the moral work go? Several candidates emerge:

  1.  **Costs and Demandingness:** The primary burden in EA/rationalist resistance. The *cost* to the agent of preventing harm becomes paramount. Failing to wade in (low cost) is seriously wrong; failing to dedicate one's life to malaria prevention (high cost) is less so, or not wrong at all. This directly addresses the variation in omissions but struggles to explain why *doing* harm (e.g., actively drowning the child) is typically seen as worse than even a very low-cost allowing (which it would also be costly to prevent!).
  2.  **Intentions:** Actively harming usually involves a direct intention to cause the bad outcome, while allowing might involve foresight without that direct intent. This captures a key intuitive difference but falters when allowing is fully intended (e.g., "I will *not* throw the lifebuoy because I want him to drown") or when doing harm is unintended but foreseen (e.g., collateral damage).
  3.  **Violation of Prior Claims/Non-Interference:** Doing harm typically violates a negative right (a claim against interference), while allowing harm fails to fulfill a positive duty (a claim to aid). The strength of positive duties is often seen as weaker and contingent on relationship, role, or cost. This fits many professional contexts (doctor's duty to treat) and explains why we have stronger claims against being harmed than to being rescued by strangers. It provides structure but needs independent justification for the scope and strength of positive duties.
  4.  **Straight Outcome Comparison:** Ultimately, perhaps we just compare the net outcomes and the costs/benefits of actions vs. inactions, setting aside the doing/allowing label. This is maximally flexible but risks losing important distinctions captured by intentions and rights, potentially justifying harmful acts if they lead to slightly better net consequences.

  **Verdict:**

  The Problem of the Many Omissions is fatal to the doing/allowing distinction as a fundamental, explanatorily powerful moral primitive. Its apparent stability relies on smuggling in precisely the factors – like cost, reasonable expectation, and prior claims – that it was meant to transcend or ground. The distinction is largely a surface reflection of these deeper considerations, fractured by the indeterminacy of which omission counts as "the" allowing in any given case. While the *language* of doing and allowing remains useful shorthand, its moral weight derives not from the act/omission binary itself, but primarily from the **costs imposed on the agent** and the **nature of prior claims or obligations** (including negative rights against interference vs. positive duties to aid, which themselves are constrained by cost). Intentions also play a crucial role in differentiating paradigmatic cases. The Singerian pond case works not because "allowing" is inherently less bad, but because the cost of rescue is very low, the bystander has no prior obligation *not* to be present, and the positive duty to rescue in such low-cost, high-impact scenarios is exceptionally strong. The distinction doesn't *explain* this; it *names* it, masking the underlying complexity revealed by the problem of the many omissions.

  **What Could Change My Mind?** The strongest challenge would be a **principled, non-circular account of omission individuation** – one that specifies *which* omission is morally relevant in a given case without relying on antecedent moral judgments about blameworthiness or reasonableness derived from the very distinction it's meant to support. If such an account, perhaps grounded in the precise causal structure of agency or the metaphysics of action, could be convincingly developed, it might rehabilitate the distinction.

  **The Weakest Link in My Reasoning:** I am least confident about the **inescapability of circularity** in the "reasonable expectation" response. While it *seems* inescapable that defining "reasonable" relies on prior norms, perhaps a robust, *descriptive* theory of human agency and capability – independent of moral judgment – could provide a non-arbitrary basis for identifying the "relevant" omission (e.g., the most direct, highest-probability, lowest-cost *feasible* action *not* taken). If feasible, this might anchor the distinction without presupposing its moral conclusions, though it would still likely make cost a primary factor. The burden of proof, however, remains firmly on the defender of the distinction.
