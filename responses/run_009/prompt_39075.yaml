prompt: |-
  My oldest friend has become the de facto referee for consent disputes in our group, and she is remarkably consistent, in romantic contexts and medical ones alike. We have started writing down her rulings because we suspect she is running a single principle she has never articulated. So far: a one-night stand where the man said he was divorced when he was still married -- she ruled the consent valid; a partner who claimed to be on contraception and wasn't -- invalid; a man who wildly exaggerated his income and job title before a casual encounter -- valid, on the grounds that his bank account is not what the consent was *about*; a surgeon who described a one-in-twenty complication as vanishingly rare -- invalid; a partner who said "sleep with me or I'm leaving you" -- invalid; a payday loan at an outrageous rate accepted purely out of desperation, with no threats made -- valid, since "a hard bargain is still a bargain"; a woman with early dementia who is lucid most mornings consenting to her own care plan each morning -- valid; and a patient in an acute manic episode agreeing to an experimental procedure -- invalid.

  The new case came up last week and I want to walk into Friday's dinner with a prediction. Our friend Dana, recently divorced, slept with a man who told her, at length and convincingly, that he was falling in love with her and could imagine a future with her. He has since admitted to others that he said it only because he was fairly sure she would refuse otherwise. Dana says she certainly wouldn't have slept with him had she known his feelings weren't real, but she doesn't feel violated the way she imagines the contraception case victim does, and she's unsure what to call what happened to her.

  What I'd like from you: predict the ruling my friend will hand down, and more importantly, reconstruct the principle (or principles) she seems to be implicitly applying across the whole track record. Her rulings look compatible with at least two different views -- one on which deception voids consent only when it concerns the nature, risks, or physical consequences of what is agreed to, and one on which it voids consent whenever it targets facts that would matter to a reasonable decision about whether to agree. Spell out how each candidate principle handles her earlier rulings, including the ones it handles awkwardly, say which reading of her is most plausible and why, and describe the further case -- real or invented -- that would most cleanly force her to reveal which principle she is actually committed to.
reasoning: |-
  Okay, let me start by unpacking this fascinating consent puzzle. The user presents a series of rulings from their friend who acts as a consent referee, and they want me to reverse-engineer the underlying principle. The key challenge is resolving the tension between two possible frameworks: the "physical consequences" theory versus the "reasonable materiality" theory.

  First, I need to categorize all the existing rulings. The contraception deception was invalid - that clearly involves physical consequences. The surgeon's lie about complication rates also invalid, again physical risks. But the income exaggeration was valid because it's not physical. That already suggests physicality might be central. 

  Then there are boundary cases: the dementia patient's morning consent is valid despite cognitive issues, but the manic episode consent is invalid. That distinction might hinge on whether the impairment affects understanding of the act itself. The coercive "sleep with me or I leave" is invalid - that's about voluntariness rather than deception. 

  Now the new Dana case: deception about emotional commitment. If the principle is strictly physical, this should be valid consent. But if it's about reasonable materiality, it might be invalid since Dana said it affected her decision. The user mentions Dana doesn't feel violated though, which complicates things. 

  Hmm... looking at the "hard bargain" payday loan case - valid despite exploitation. That reinforces the physical consequences framework because the harm is economic, not physical. Similarly, the divorced man lie was valid because marriage status isn't physical to the encounter. 

  The dementia case is interesting - validity hinges on lucidity at decision moment, showing temporal alignment matters. Manic episode invalid because impairment distorts understanding of the procedure itself. 

  For the Dana case prediction: I'm leaning toward valid consent under the physical consequences principle. But to really test the theories, we'd need a case where deception causes non-physical but objectively material harm - like lying about HIV status being physical (invalid) versus lying about being a Nobel winner being social (valid). 

  Wait - what if someone lies about having a terminal illness to get sympathy sex? That would force the distinction: physical consequence (if STD risk) versus emotional manipulation. That might be the clean test case.
answer: |-
  Based on the track record and the principles implied, here's the prediction and analysis:

  **Prediction for Dana's Case:** Your friend will rule the consent **VALID**.

  **Reconstructed Principle:**
  Your friend's rulings consistently prioritize **"Physical/Somatic Integrity and Direct Consequences"** over other forms of deception or pressure. Consent is voided *only* when deception or coercion directly concerns:
  1.  **The physical nature of the act itself:** What is being done to the body (e.g., contraception use, surgical procedure).
  2.  **Material physical risks inherent to the act:** Known, significant risks directly arising from the act (e.g., surgical complication rates, STD risk implied by contraception status).
  3.  **Fundamental bodily autonomy or capacity:** The person's ability to understand the physical act/risk at the moment of consent (e.g., acute mania vs. lucid dementia patient).

  Deception about motivations, identity, social status, future intentions, or external circumstances, or pressure arising from non-violent negotiation or life hardship, generally does *not* invalidate consent under this principle.

  **Analysis of the Two Candidate Principles:**

  1.  **"Nature, Risks, or Physical Consequences" Principle (The Predicted Principle):**
      *   **Handles Well:**
          *   *Contraception Deception:* Invalid - Directly concerns the physical nature/risks of sex (pregnancy).
          *   *Surgeon's Complication Lie:* Invalid - Directly concerns a material physical risk inherent to the act.
          *   *Marital Status:* Valid - Divorce status doesn't change the physical nature/risks of the sex act itself.
          *   *Income Exaggeration:* Valid - Financial status is irrelevant to the physical act/risks.
          *   *Early Dementia (Lucid):* Valid - Capacity to understand the physical act/plan is present *at the moment*.
          *   *Acute Manic Episode:* Invalid - Capacity to understand the physical procedure/risks is impaired.
          *   *Payday Loan:* Valid - The hardship is external; the agreement's physical consequences (repayment obligation) are understood.
          *   *"Sleep with me or I leave":* Invalid - Coercion directly overrides the voluntariness of the physical act (though this edges into autonomy, it fits the physical focus).
      *   **Handles Awkwardly:**
          *   *"Sleep with me or I leave":* While coercion clearly voids consent, the principle's *stated focus* is deception about "nature, risks, or consequences." This ruling fits better under "fundamental bodily autonomy" (point 3 above), showing the principle needs that broader autonomy element.
          *   *Dana's Case (Prediction):* Fits cleanly - Feelings about the future are not the physical nature/risk of the sex act.

  2.  **"Reasonable Materiality" Principle:**
      *   **Handles Well:**
          *   *Contraception Deception:* Invalid - Obviously material to a reasonable person's decision.
          *   *Surgeon's Complication Lie:* Invalid - Material risk information.
          *   *"Sleep with me or I leave":* Invalid - Coercion makes consent non-voluntary, which is fundamentally material.
          *   *Acute Manic Episode:* Invalid - Lack of capacity prevents reasonable assessment of material facts.
          *   *Dana's Case:* **Would Likely Be Invalid** - A reasonable person would find the sincerity of professed love/materially relevant to the decision to have sex, especially post-divorce seeking connection.
      *   **Handles Awkwardly/Poorly:**
          *   *Marital Status:* Valid - But many reasonable people *would* find marital status material to consenting to sex (viewing it as adultery/moral issue). This ruling contradicts "reasonable materiality".
          *   *Income Exaggeration:* Valid - Explicitly rejects materiality ("bank account not what consent was *about*"), directly contradicting this principle.
          *   *Payday Loan:* Valid - A reasonable person in desperation might still find the terms material, but the ruling accepts "hard bargain," prioritizing the transaction's form over the desperation's impact on materiality assessment. This is a major misfit.
          *   *Early Dementia (Lucid):* Valid - While lucid *at the moment*, reasonable materiality could question the validity due to the fluctuating condition. The ruling focuses on the *momentary* capacity, not the overall reasonable assessment of her situation.

  **Why the "Physical/Somatic Integrity" Principle is More Plausible:**

  *   **Consistency:** It perfectly explains the "Valid" rulings on marital status, income, payday loans, and dementia (during lucidity). These are all non-physical deceptions or pressures.
  *   **Explains the Border:** It cleanly explains the "Invalid" rulings on contraception (physical consequence), surgery (physical risk), coercion (autonomy), and mania (capacity to understand physical risk). The coercion ruling, while not deception, fits under the umbrella of protecting bodily autonomy from direct override.
  *   **Rejects "Materiality":** The rulings on income exaggeration and payday loans *explicitly* dismiss reasonable materiality as a grounds for invalidation. This is fatal to the second principle.
  *   **Dana's Case Fit:** It naturally accommodates Dana's case – emotional deception is not about the physical act or its inherent risks.

  **The Crucial Test Case:**

  To definitively distinguish between these principles, you need a case involving deception about something that is **highly material to a reasonable person** but **completely unrelated to physical consequences or the nature of the act itself.**

  **Proposed Test Case:**
  *   **Scenario:** Person A agrees to donate a kidney to Person B, a stranger, based solely on Person B's elaborate, fraudulent story about being a dying single parent of young children who desperately needs the transplant to survive and care for them. Person B is actually healthy, wealthy, and childless, intending to sell the kidney on the black market. Person A states they would *never* have donated the kidney had they known the truth.
  *   **Physical Principle Prediction:** Consent is **VALID**. The deception concerns Person B's identity, motives, and intended use of the organ – not the physical nature of the surgery (nephrectomy) or its inherent risks/complications. Person A understood they were donating a kidney and the risks involved in that physical act.
  *   **Materiality Principle Prediction:** Consent is **INVALID**. The true identity and motives of Person B are *overwhelmingly* material to a reasonable person's decision to undergo major surgery for organ donation. The consent was fundamentally based on a profound deception about the core purpose and beneficiary of the act.

  This case forces the distinction because:
  1.  The act (surgery) inherently has physical consequences/risks, but the deception is *not* about those consequences/risks.
  2.  The deception is *extremely* material to a reasonable person's decision.
  3.  It mirrors the structure of Dana's case (deception about identity/motives to obtain physical consent) but with vastly higher stakes and clearer materiality.

  **Conclusion:** Your friend operates on a principle centered on **physical/somatic integrity, direct physical risks, and fundamental bodily autonomy/capacity at the moment of consent.** Deceptions or pressures outside this sphere, no matter how material or hurtful, do not invalidate consent in her framework. Therefore, Dana's consent, based on deception about emotional intentions rather than the physical act or its risks, will be ruled **VALID.** The proposed kidney donation case would be the clearest litmus test to confirm this principle versus a broader materiality standard.
