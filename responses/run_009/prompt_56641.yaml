  For structure: Start with the unresolved puzzle, then the precise gap their project tackles. The ladder approach (suffering-small-happiness → suffering-huge-happiness → net-positive-lives → creation-vs-improvement) systematically tests boundaries. Contribution could be either finding a stopping point or mapping inconsistencies if none exists. 

  Execution plan should emphasize conceptual analysis: literature review → develop cases → peer intuition workshops → refine framework. Deliverables (paper draft + workshop) keep scope manageable. 

