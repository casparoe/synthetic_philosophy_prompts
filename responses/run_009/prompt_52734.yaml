  Let me unpack the requirements carefully. The statement needs four main sections: agreed claims, remaining disagreements, cruxes (key sub-questions), and case analyses for each crux. Plus two constraints: must tie everything to practical certification decisions, and address whether recent concessions actually resolve anything.

  For the agreed claims, I'm thinking both sides would accept:
  - There's a clear difference between verbal knowledge and practical ability (novice vs veteran)
  - Some experts struggle to articulate their skills
  - Learners often have knowledge-performance mismatches
  - Neither "pure propositional knowledge" nor "pure physical ability" fully captures expertise

  The disagreements will be fundamental. The intellectualist will insist knowing-how reduces to propositional knowledge (even if ability isn't guaranteed), while the Rylean will maintain skills are dispositions that aren't knowledge at all. The practical mode of presentation versus Ryle's regress seems like a core sticking point.

  For cruxes, these seem crucial:
  1. The injured champion case (can coach but can't perform)
  2. The manual-memorizing trainee (knows rules but can't execute)
  3. Whether dropping "knowledge" terminology changes anything
  Each needs a concrete coaching scenario both sides would accept as relevant.

  On recent concessions: intellectualists now say propositional knowledge doesn't require ability, anti-intellectualists allow skills involve "knowledge of ways." But does this help? I suspect not - the dispute just shifts to whether "practical mode of presentation" or "knowledge of a way" are genuinely non-propositional. There might be a verbal element here about what counts as "knowledge," but the substantive residue is whether certification requires assessing mental states (intellectualist) or behavioral capacities (Rylean).

  For practical implications:
  - Written exams could certify knowledge-that but not ability (both agree)
  - Inarticulate experts might still be competent (intellectualist: mode of presentation; Rylean: disposition)
  - Supervised practice remains essential for both, but for different reasons

  I'll structure this as a formal joint statement with clear sections. The tone should be rigorously balanced - no strawmen, no fudging. Each side's position should be stated in their own terms, with predictions on how key cases would play out. The commissioners will care most about how this affects certification design, so every philosophical point must link to practical assessment methods.
answer: |-
  ## Joint Statement: Adversarial Collaboration on the Nature of Knowing-How for Coaching Certification

  **Commissioned by:** National Coaching Certification Body  
  **Collaborators:** Dr. Alistair Finch (Intellectualist), Dr. Beatrice Reed (Anti-Intellectualist)  
  **Date:** October 26, 2023  

  **Preamble:** This statement clarifies points of agreement and persistent disagreement regarding the nature of knowing-how (KH), to inform the redesign of coaching certification standards. We address phenomena central to coaching expertise, identify constraints for any adequate account, state remaining disagreements candidly, outline key cruxes, and analyze concrete cases. We explicitly connect each point to practical certification decisions and assess whether recent theoretical concessions narrow the dispute.

  **1. Agreed Claims: Phenomena, Failures, and Constraints**  
  *(Both parties endorse the following statements)*

      1.  **Phenomenon of Dissociation:** A stark difference exists between a novice who can verbally recite coaching principles flawlessly and a veteran coach who reliably applies them effectively in dynamic situations, even if the veteran struggles to articulate them. *Certification Implication:* Written exams alone cannot certify competent coaching; practical assessment is indispensable.
      2.  **Phenomenon of Articulation Limits:** Genuine expertise (e.g., a master coach adjusting technique mid-session) can exist alongside an inability to fully articulate the principles guiding the action. *Certification Implication:* An apprentice coach's inability to articulate *all* aspects of their technique is not necessarily evidence of incomplete expertise; it may reflect the automaticity of skill. Assessment must evaluate performance, not just verbalization.
      3.  **Phenomenon of Mismatched Development:** Learners frequently exhibit mismatches: (a) Articulable knowledge of technique outpaces practical performance (e.g., a coach trainee knows the biomechanics of a skill but can't demonstrate it smoothly). (b) Practical performance outpaces articulable knowledge (e.g., a talented former athlete coaching intuitively but struggling with theory). *Certification Implication:* Certification pathways must accommodate and assess both dimensions (knowledge articulation *and* performance) separately and together, recognizing they develop unevenly.
      4.  **Failure of Simple Intellectualism:** Reducing KH *solely* to the ability to state propositions (e.g., reciting a coaching manual) fails to capture the reliable, situated performance characteristic of genuine skill and cannot explain the phenomena above (especially 1.1 & 1.2). *Certification Implication:* Classroom instruction and written exams, while necessary for foundational knowledge, are insufficient for full certification.
      5.  **Failure of Simple Anti-Intellectualism:** Reducing KH *solely* to a blind physical disposition or reflex (e.g., muscle memory) fails to capture the role of understanding, guidance, error-correction, and adaptation characteristic of skilled coaching, and struggles with phenomena like coaching without current physical ability (see Crux 1). *Certification Implication:* Certification cannot rely solely on performance drills; assessing understanding (even if tacit) is crucial.
      6.  **Constraint: Action-Orientation:** Any adequate account of KH must explain its fundamental connection to the guidance and successful execution of action in real-world contexts. *Certification Implication:* Assessment must ultimately focus on the candidate's capacity to produce effective coaching actions and outcomes.
      7.  **Constraint: Cognitive Penetrability:** KH involves cognitive elements beyond mere physicality – it is sensitive to instruction, reflection, planning, and reasoning (even if non-verbal). *Certification Implication:* Classroom instruction on theory and principles has a legitimate and necessary role in developing and assessing coaching expertise.

  **2. Remaining Disagreements**  
  *(Stated in each party's own terms)*

  *   **Dr. Finch (Intellectualist):** "Knowing how to coach is identical to possessing propositional knowledge (knowing-that) of ways to coach, where this knowledge is entertained under a distinctively *practical mode of presentation*. While possessing this knowledge does not strictly *entail* the ability to perform on every occasion (due to external factors), it is the core constitutive state. The practical mode of presentation explains the action-guiding role and potential inarticulacy."
  *   **Dr. Reed (Anti-Intellectualist):** "Knowing how to coach is fundamentally a complex, multi-track disposition (or set of competences) to perform coaching activities intelligently – to coach well, adapt, learn, correct mistakes, and explain when appropriate. This disposition is *not* constituted by knowing propositions, even under a 'practical mode'. Talk of 'knowledge of ways' refers to the *exercise* of the competence, not a propositional state underlying it."

  **3. Cruxes and Case Analyses**  
  *(Sub-questions where resolution would shift at least one party's position. Each includes a case, relevance, and predictions.)*

  **Crux 1: The Injured Champion Coach (Regress & Mismatch Case)**
  *   **Question:** Can the intellectualist's appeal to a "practical mode of presentation" (PMP) genuinely resolve Ryle's regress argument (does explaining action require an endless chain of knowings-that?), or does it merely relabel the problem? Does this case show KH can persist without current ability? *Relevance to Certification:* Can a coach who cannot physically demonstrate skills (e.g., due to injury) still be fully certified based on knowledge?
  *   **Case:** Elena, a former Olympic gymnastics champion and master coach, suffers a severe spinal injury, permanently losing the physical ability to demonstrate complex gymnastic skills. However, she can still acutely observe athletes, diagnose technique flaws with uncanny accuracy, provide precise verbal and visual (using models/diagrams) corrections, and strategically plan training. Her athletes consistently improve under her guidance.
      *   **Dr. Finch (Intellectualist) Prediction:** This case *supports* intellectualism. Elena retains the propositional knowledge of ways to perform and coach the skills, entertained under the PMP. The PMP allows this knowledge to guide *others'* actions through perception, judgment, and instruction, even if it cannot guide her *own* body due to injury. The PMP blocks the regress by being the specific *way* the proposition is grasped that makes it action-guiding *for the relevant agent* (here, her athletes via her coaching). She remains fully certifiable as her core KH (propositional knowledge under PMP) is intact; inability to demonstrate is an external impediment.
      *   **Dr. Reed (Anti-Intellectualist) Prediction:** This case *challenges* intellectualism and *supports* anti-intellectualism. Elena retains her coaching competence – a complex disposition to perceive, judge, instruct, and plan effectively. This competence was honed through practice but is not reducible to propositions. The PMP is a label for the *exercise* of this competence, not its foundation. Ryle's regress applies: if knowing-how requires knowing-that under a PMP, what explains the grasp of the PMP? Another knowing-that? Intellectualism hasn't solved it. She remains certifiable because her coaching disposition/competence, though distinct from her former athletic disposition, is intact. Her inability to demonstrate is irrelevant to her *coaching* KH.

  **Crux 2: The Manual-Memorizing Trainee (Mismatch Case)**
  *   **Question:** Does possessing all relevant propositional knowledge about coaching a skill (without a PMP) suffice for KH? Does successful performance without articulable propositional knowledge entail the absence of propositional knowledge or merely inaccessibility? *Relevance to Certification:* Can written exams, testing propositional knowledge, ever suffice for any aspect of certification? Is intuitive performance evidence of deficient knowledge?
  *   **Case:** Ben has meticulously memorized the entire official coaching manual for soccer goalkeeping, can recite every principle verbatim, and passes written exams with perfect scores. However, during practical drills, his instructions are confusing, his demonstrations awkward and ineffective, and he consistently misreads game situations in simulations, leading to poor tactical decisions for his "team." Conversely, Carla, a former player with minimal formal study, coaches intuitively. Her explanations are often vague ("Just get low and react!"), but her demonstrations are flawless, her drills are highly effective, and her tactical adjustments during scrimmages are consistently spot-on.
      *   **Dr. Finch (Intellectualist) Prediction:** This case *supports* intellectualism. Ben possesses propositional knowledge, but crucially *not* under the practical mode of presentation required for KH. He knows facts *about* goalkeeping coaching but lacks the knowledge *of ways to do it* under the PMP. Carla *does* possess propositional knowledge under the PMP, explaining her effective action, even if she can't articulate it in the manual's terms (the PMP makes the knowledge action-guiding but not necessarily verbally accessible). Written exams certify possession of *some* relevant knowledge-that but *cannot* certify KH, which requires the PMP (assessed via practice). Carla's performance demonstrates her possession of propositional knowledge under PMP.
      *   **Dr. Reed (Anti-Intellectualist) Prediction:** This case *supports* anti-intellectualism. Ben possesses knowledge-that but lacks the coaching competence (KH). Carla possesses the coaching competence (KH). Her competence explains her performance; attributing hidden propositional knowledge to her is unnecessary and explanatorily empty ("She performs well because she knows how (propositionally)!" is circular). Ben's case shows propositional knowledge is neither necessary nor sufficient for competence. Written exams certify knowledge-that, which may be *useful* but is distinct from KH. Carla's inarticulacy is an expected feature of her automatic competence, not evidence of hidden propositions.

  **Crux 3: The "Knowledge"-Free Dispute (Terminology)**
  *   **Question:** If both parties ceased using the word "knowledge" entirely, would a substantive disagreement about the nature of coaching expertise and its certification remain? *Relevance to Certification:* Are the core disagreements about the *structure* and *assessment* of expertise, or merely about the label "knowledge"?
  *   **Case:** Consider certification solely in terms of evaluating two distinct but related attributes: (A) **Cognitive Understanding:** Measured by ability to articulate principles, explain reasoning, answer theory questions (via exams, interviews). (B) **Practical Competence:** Measured by ability to perform coaching activities effectively (demonstrations, session planning, in-situ decision-making, athlete outcomes). The dispute is over whether (A) is *constitutive of* or merely *causally related to* (B), and what underlying state(s) explain (B).
      *   **Dr. Finch (Intellectualist) Prediction:** The substantive dispute remains. I hold that possessing (B) *just is* possessing a specific type of (A) (propositional attitude under PMP), even if we stop calling it "knowledge". The PMP is crucial for explaining how (A) guides action to yield (B). Certification must assess the presence of this specific cognitive state underlying competence. Dropping "knowledge" doesn't eliminate the need to identify the cognitive basis of (B).
      *   **Dr. Reed (Anti-Intellectualist) Prediction:** The substantive dispute remains largely intact. I hold that (B) is a practical competence/disposition, distinct from any propositional attitude (A). While (A) can inform and improve (B), (B) has its own structure (multi-track dispositions, habituation) and its primary evidence is successful performance. Certification must assess the disposition itself through performance. The dispute is about the ontology of skill, not the label "knowledge".

  **4. Assessment of Recent Concessions and the Verbal Dispute Question**

  Both parties acknowledge recent shifts:
  *   *Concession A (Intellectualist):* Propositional knowledge (under PMP) constitutive of KH does not strictly entail the ability to act (due to external factors like injury).
  *   *Concession B (Anti-Intellectualist):* Possessing a skill can involve non-propositional *knowledge of a way* (understood as an aspect of the competence itself).

  **Analysis:**
  1.  **Do concessions narrow the dispute?** Superficially, yes, by addressing specific counterexamples (Injured Champion, Manual-Memorizer). Concession A allows Intellectualists to handle ability failures. Concession B allows Anti-Intellectualists to use "knowledge" more flexibly for aspects of competence.
  2.  **Do concessions relocate the dispute?** **Yes, fundamentally.** The core disagreement now centers entirely on the interpretation of the key bridging concepts:
      *   **For Intellectualists:** The "Practical Mode of Presentation" (PMP) is the linchpin. The dispute becomes whether the PMP can be understood *without* presupposing non-propositional capacities or dispositions, and whether it genuinely solves the regress (Crux 1). Does Concession B's "non-propositional knowledge of a way" collapse into the Intellectualist's PMP?
      *   **For Anti-Intellectualists:** "Knowledge of a way" (Concession B) is merely a way of *describing* the exercise of the underlying competence/disposition. The dispute becomes whether the Intellectualist's propositional knowledge under PMP is anything *more* than a description of the competence or its effects. Does Concession A's decoupling of knowledge and ability undermine the claim that this knowledge is genuinely *constitutive* of the skill?
  3.  **Is there a merely verbal dispute?** **Partially, but with significant residual substance.**
      *   **Verbal Element:** Part of the disagreement *is* about the applicability of the term "knowledge." Both sides now agree that something cognitive/intellectual (Intellectualist: propositional under PMP; Anti-Intellectualist: non-propositional grasp inherent in competence) and something dispositional/behavioral are crucial. Insisting on calling the whole complex "knowledge" (Intellectualist) vs. reserving "knowledge" only for the separable propositional bits (Anti-Intellectualist) involves a terminological choice. Settling terminology alone wouldn't resolve the practical certification questions.
      *   **Substantive Residue:** The core ontological and explanatory disagreement persists: **Is the reliable, adaptive, intelligent guidance of coaching action (Practical Competence (B)) best explained by, and constituted by, a *propositional attitude* grasped in a special way (PMP), or is it constituted by a *sui generis practical disposition* that may utilize but is not reducible to propositional attitudes?** This difference directly impacts certification:
          *   **Intellectualist View (Finch):** Certification must verify the presence of the correct propositional attitude under PMP. While performance is the *best evidence* for this, it's the *cognitive state* being certified. Supervised practice is necessary to assess the PMP aspect.
          *   **Anti-Intellectualist View (Reed):** Certification must verify the presence of the coaching disposition itself. Performance assessment *directly* evaluates the competence. Cognitive understanding (A) is assessed separately as a valuable but distinct supporting factor. Supervised practice is necessary to directly assess the competence.

  **Conclusion for Certification Body:** Both parties agree that effective certification requires robust assessment of *both* cognitive understanding (via classroom instruction, written/oral exams) *and* practical competence (via supervised practice, performance evaluation, observed outcomes). The unresolved philosophical dispute centers on *why* this is necessary and the fundamental nature of what is being certified – a specific cognitive state enabling action, or a practical disposition manifesting in action. This disagreement, while partially verbal regarding the label "knowledge," has a substantive core concerning the ontology of skill. **Therefore, certification standards *must* incorporate both modalities robustly, regardless of the ultimate philosophical resolution.** The precise weighting and interpretation of "understanding" vs. "performance" evidence may remain contested, but the necessity of both components is beyond dispute based on the agreed phenomena. The cruxes outlined provide specific test cases that could inform future philosophical refinement relevant to assessment design.
