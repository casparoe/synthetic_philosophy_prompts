prompt: |-
  Last night my friend Maya and I had one of those arguments that starts over coffee and ends at 1am with somebody saying fine, take it to the seminar then — so now I'm on the hook for the work-in-progress seminar in two weaks, defending my line on Fitch's paradox of knowability to basically the worst possible audience for it. The department is mostly Dummett-style semantic anti-realists, two of whom actually work on intuitionist logic and believe, deep in their bones, that the meaning of a statement just is the way it gets verified within our current practice. Then there's one classical logician who thinks the whole "paradox" is nothing but a valid proof from premises the anti-realists already accepted, so they should either accept that all truths are known or admit their position was sentimental all along. And one formal epistemologist who goes straight for the proof-theoretic fine print in everything she reads. Maya, for the record, is on the side of restricting the knowability principle to the so-called cartesian propositions, and she spent the last hour of the argument telling me my view is just the relativized reading — every truth is knowable by someone at some time — in fancy dress, which stung, because I'm genuinely not sure she's wrong.

  My thesis, roughly: the standard escape hatches all quietly give up what the anti-realist actually cared about, since the point was never which propositions some arbitrarily located agent might someday come to know, it was whose practice fixes what our statements mean. My own line is that Fitch's proof only goes through because it treats the knower as a single idealized verifier who can know a whole conjunction at once — the step from possibly-K(p and not-Kp) to the contradiction needs one knower who simultanously knows p and knows that p is not known, and once you take knowers seriously as bounded, located, temporal agents (different people, different times, different faculties), the distribution of knowability over conjunction fails and the proof stalls. The catch, and the thing Maya and I could not settle at all: on my reading, group knowability stops being closed under conjunction, and maybe stops being factive?? And I can't tell whether that's a feature, a bug, or just me dodging the modal logic.

  So I need a prep sheet, and since our seminar Q&As are brutal and fast, I want it compressed. Give me exactly six items, numbered, ordered by how much damage they'd do (roughly the order they'll arrive), with no intro and no conclusion. Each item in two or three sentences max: the objection phrased the way that specific person would actually phrase it (say which of them it's coming from), my best one-line reply, and a short clause on where the reply is soft. Make the sixth item the question I'm praying nobody asks. And please be honest about the soft spots — if one of these objections simply beats me, I'd much rather hear it from you than find out live with my supervisor in the room.
