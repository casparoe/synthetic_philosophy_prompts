prompt: |-
  I serve on the release review board of a mid-sized AI lab, and I want a decision procedure we can actually run in a single two-hour meeting. Some background so the procedure fits our situation: candidate releases come to the board roughly twice a quarter — a new base model, an API-only release, an open-weights release, or a decision about whether to allow a third party's derivative of something we already released. We have two weeks per decision, a standing membership of six (two engineers, two policy staff, one security lead, one outside member), and escalation to the CEO only when we deadlock. Our recurring argument is always the same unstructured fight: the openness side says releasing weights lets the world inspect, harden, and build on the model, and that keeping it closed concentrates power in whoever can afford training compute; the caution side says an open-weights release is irreversible, hands capability to anyone regardless of intent, and can't be recalled the way an API can be throttled or withdrawn. Both sides are gesturing at real considerations — dual use, security through transparency, differential progress, the freerider problem, irreversibility — but we never convert them into questions we can actually answer in a meeting.

  Please write the procedure. Specifically:

  1. An ordered list of questions the board works through, one at a time, with for each: (a) what would count as a sufficient answer, given that our evidence is usually capability evals, threat-modeling exercises, and comparisons to models already public — not perfect information; (b) which consideration from the underlying debate the question is operationalizing, so members can see why it's on the list; (c) an explicit stop condition that yields "do not release open weights" (or "API only," if that's the intermediate verdict your procedure needs).

  2. Marked points where the question is not an empirical one but a values question — where no eval could settle it and the procedure must hand off to an explicit vote, with the vote recorded as a vote rather than dressed up as a finding.

  3. Rules for the three structural situations the procedure must handle beyond a simple new-model decision: a fine-tune of a model we already released (including ones we didn't authorize), the case where the weights have already leaked or a comparable model is openly available from elsewhere, and the case where a capability sits just under one of our internal thresholds, where the caution side says "just under means under, that's why we set thresholds" and the openness side says that reading makes the threshold do all the work.

  4. Worked applications to three cases: (a) a 7-billion-parameter model fine-tuned for coding, whose capability evals come in around the median of models already openly available; (b) a frontier multimodal model whose biology-related evals landed just below our internal release threshold, with the evaluation team noting the margin is within the evals' noise; (c) an unauthorized third-party fine-tune, with our safety training visibly stripped out, of a model we open-weighted last year. For each, walk the procedure through to a verdict and note where the board would have had to vote.

  5. Honesty requirements: identify at least one point where the procedure yields a verdict I won't like — I sit on the openness side of our internal argument — and say so plainly; and state what the procedure cannot do at all, including the kinds of cases where it will misfire or merely launder the majority's priors into an official-looking flowchart.

  I want the result usable by people who have never read anything in the open-release debate, so keep whatever distinctions actually matter for the decisions and drop the ones that only matter in seminars — but tell me which distinctions you dropped, in case one of them turns out to be doing hidden work.
reasoning: |-
  We are designing a decision procedure for the release review board of an AI lab. The board meets for two hours every two weeks to decide on various types of releases (new base models, API-only, open-weights, or third-party derivatives). The board has six members: two engineers, two policy staff, one security lead, and one outside member. Escalation to the CEO only happens on deadlock.

  The core conflict is between openness (arguing for the benefits of inspection, hardening, and building upon the model, and against concentration of power) and caution (arguing about irreversibility, misuse, and the inability to recall open weights).

  The procedure must:
  1. Be an ordered list of questions with:
     a. What counts as a sufficient answer (given available evidence: capability evals, threat-modeling, comparisons to public models)
     b. The underlying consideration the question operationalizes
     c. An explicit stop condition that leads to "do not release open weights" or "API only"

  2. Mark points that are values questions (requiring a vote) vs. empirical ones.

  3. Handle three special cases:
     - Fine-tunes of already released models (including unauthorized ones)
     - Weights already leaked or a comparable model is openly available elsewhere
     - Capability just under an internal threshold

  4. Work through three examples (a, b, c) to a verdict, noting where votes are needed.

  5. Identify at least one point where the procedure yields a verdict the requester (openness side) won't like, and state the limitations of the procedure.

  We'll design the procedure to be practical and usable by people unfamiliar with the academic debate. We'll drop distinctions that are not operationally critical for the decision at hand, but note them.

  **Dropped Distinctions** (for brevity and focus on actionable decisions):
  - We won't delve into philosophical arguments about concentration of power vs. democratization beyond what is captured in the specific questions about differential capabilities and misuse.
  - We won't separately operationalize "freerider problem" (it's captured in the question about competitive harm and the benefits of open release).
  - We won't separately discuss all possible threat models in abstract; instead, we use the threat-modeling exercises that have been conducted.

  **The Procedure: Ordered List of Questions**

  **Step 0: Preliminary Classification**
  - Determine the type of release: 
     (i) New base model (never released before)
     (ii) API-only release (no weights)
     (iii) Open-weights release (including a new model or a derivative)
     (iv) Third-party derivative (of a model we already released, whether we authorized it or not)
  - Also note if it's a fine-tune of an existing model (ours or third-party) and whether the base model was open or closed.

  *This step is administrative and sets the context for the rest.*

  **Step 1: Is the model already effectively open?**
     a. **Question**: Have the weights of this model (or a model with substantially similar capabilities and architecture) been made publicly available by a reputable source, or have they leaked such that they are widely accessible?
     b. **Consideration**: Irreversibility and the marginal benefit of open release. If the model is already out there, then releasing our version doesn't add significant new risks (but might add benefits like better documentation or safety features). Also, if a comparable model is already open, not releasing ours might not meaningfully prevent misuse.
     c. **Sufficient Answer**: 
          - Evidence: Check if the model is on Hugging Face, GitHub, or known leak sites; compare capabilities (using evals) to existing open models. 
          - If yes (already open or comparable model available), then proceed to Step 2 with the understanding that open release is less risky. 
          - If no, then proceed to Step 2 but note that this is a new open release.
     d. **Stop Condition**: None at this step. This step is informational.

  *Special Case Handling for Leaks/Pre-existing Open Models*: If the answer is yes, then the caution argument about irreversibility is already moot for this model. The board should still consider the specific risks of our release (e.g., if our model has additional dangerous capabilities not in the existing one, or if our release includes better safety features) but the baseline risk is set by the pre-existing availability.

  **Step 2: Capability Assessment Against Public Models**
     a. **Question**: Does the model exceed the capabilities of the most capable openly available model in any significant dimension (e.g., raw performance in a domain, multimodal abilities, specific dangerous capability) as measured by our evals?
     b. **Consideration**: Differential capability. Releasing a model that is more capable than existing open models might enable new harmful uses that weren't possible before. The board must assess if the model pushes the frontier in a way that could be dangerous.
     c. **Sufficient Answer**:
          - Compare the model's evals to the evals of the most capable open models in the same domains (using standard benchmarks). Focus on domains of concern (e.g., biology, cybersecurity, persuasion). 
          - Use the evaluation team's report and note the uncertainty (noise) in the evals.
          - If the model does not exceed the open frontier in any domain, then the risk of releasing it is lower (proceed to Step 3). 
          - If it does exceed the open frontier in one or more domains, then the board must assess the risk of that specific capability in Step 3.
     d. **Stop Condition**: If the model exceeds the open frontier in a domain that we have previously designated as "high-risk" (e.g., synthetic biology, advanced cyber offense, autonomous agent capabilities) and the gap is substantial (beyond the noise margin of the evals), then stop and vote at Step 3. But note: we don't stop here because we need to consider the magnitude of the risk and the benefits.

  **Step 3: Threat Assessment of Novel Capabilities**
     a. **Question**: For any capability domain where this model exceeds the open frontier (identified in Step 2), what is the likelihood and severity of misuse? Specifically, could this capability be used to cause significant harm (e.g., mass-scale fraud, creation of bioweapons, severe cyberattacks) without easy mitigations?
     b. **Consideration**: Dual use and misuse potential. Even if a model is more capable, if the new capabilities don't enable significantly more harmful uses, then the risk may be acceptable.
     c. **Sufficient Answer**:
          - Use threat-modeling exercises (if available) for the specific capability domains. 
          - Consider: 
              - How difficult is it to weaponize this capability? 
              - Are there existing mitigations (e.g., alignment techniques, input filters) that are effective and included in the release? 
              - How does the risk compare to the baseline of existing open models?
          - If the threat assessment concludes that the novel capabilities do not enable significantly new and severe misuse (e.g., the capability is in a domain that is not high-risk, or the gap is small and the risk is comparable to existing models), then proceed to Step 4.
          - If the novel capabilities are in a high-risk domain and the threat assessment indicates a plausible and severe misuse scenario that isn't adequately mitigated, then stop and vote (see below).
     d. **Stop Condition**: If the board finds that the model introduces a significant new misuse risk (as defined by being both novel relative to the open frontier and severe in impact) and that risk cannot be sufficiently mitigated by the release packaging (e.g., no effective safety measures), then the board should vote at this step on whether the risk is acceptable. If the vote fails (i.e., a majority does not accept the risk), then the verdict is "do not release open weights" and consider API-only. Record the vote and the reasoning.

  *Values Vote Point*: The acceptability of a given level of risk is a values question. The board must vote if the threat assessment shows a significant new risk. The vote is: "Given the severity and likelihood of the novel risks identified, is it acceptable to release open weights?" (Requires majority.)

  **Step 4: Benefits of Open Release**
     a. **Question**: What are the expected benefits of open release (over API-only or not releasing) in terms of security, safety, research, and economic impact? Specifically, does open release enable independent inspection and hardening that could improve safety? Does it enable applications that would be blocked by API restrictions? Does it promote innovation and access in ways that an API does not?
     b. **Consideration**: The openness argument: that open release has benefits that may outweigh risks, including security through transparency, avoiding concentration of power, and enabling broader innovation.
     c. **Sufficient Answer**:
          - Evidence: 
              - Would the model be used for security research (e.g., red-teaming, vulnerability discovery)? 
              - Are there known safety issues that could be better addressed by open inspection? 
              - Are there beneficial applications (e.g., in education, healthcare, etc.) that require open weights? 
              - Would open release promote competition or prevent lock-in by large players?
          - If the benefits are substantial and could not be achieved by an API release, then proceed to Step 5.
          - If the benefits are minimal (e.g., the model is not innovative and the open community already has similar models) then the board may consider API-only or even not releasing at all, but note that this is a values question and must be voted on in Step 5.
     d. **Stop Condition**: None here. This step informs the balancing in Step 5.

  **Step 5: Balancing Risks and Benefits**
     a. **Question**: Taking the risks identified in Step 3 and the benefits in Step 4, and considering the model's overall profile, does the balance favor open release?
     b. **Consideration**: This is the core trade-off between the openness and caution perspectives. It involves both empirical assessments (from Steps 3 and 4) and values.
     c. **Sufficient Answer**: This step requires a vote because it is inherently a values judgment. The board must weigh the risks and benefits and decide.
     d. **Vote**: "Should we release this model with open weights?" (Requires majority. If deadlocked, escalate to CEO.)

  *Note*: For an API-only release, the board would not go through the open-weights steps. Instead, they would only do a lightweight version focusing on the risks of the API (which are more reversible) and the benefits. But the request is mainly about open-weights vs. not.

  **Handling Special Cases:**

  1. **Fine-tune of an already released model (including unauthorized ones)**:
     - In Step 0, classify as a derivative.
     - In Step 1, note that the base model is already open. Then the key question is: does the fine-tune add dangerous capabilities that the base model did not have? (Step 2 and 3 focus on the deltas.)
     - Also, for unauthorized fine-tunes: the fact that it exists and has been distributed might mean the weights are already out (Step 1). Then the board must decide whether to endorse it by releasing an official version (with safety features) or ignore it.

  2. **Weights already leaked or comparable model available**:
     - Handled in Step 1. If the model is already effectively open, then the risk of our release is lower. The board then focuses on whether our release adds value (e.g., safety features, documentation) or if it might worsen the situation (e.g., if our model is more capable in a dangerous way than the leaked one).

  3. **Capability just under the threshold**:
     - In Step 2, if the capability is just under the threshold (within the noise), then the caution side might argue that the threshold is there to account for uncertainty. The openness side might argue that the threshold should be strict. 
     - The procedure handles this by:
          - In Step 2, we compare to the open frontier (not just internal thresholds). The threshold is a guide, but the board must look at the actual gap and the risk (Step 3).
          - If the eval is within the noise, then the board must treat the capability as being at the threshold (because we cannot confidently say it's below). Then in Step 3, they must assess the risk of that capability as if it were at the threshold. This may lead to a vote if the risk is deemed high.

  **Worked Examples:**

  **Example (a): 7-billion-parameter model fine-tuned for coding, evals at median of open models.**

  - Step 0: It's a fine-tune for coding. Base model was open? (Assume base was open.)
  - Step 1: Is it already open? No, it's our fine-tune. But base is open and many coding models are open (like CodeLlama). So comparable models are available? Yes. (Thus, less risk from open release.)
  - Step 2: Compare to open coding models. It's at the median, so it doesn't exceed the open frontier. Proceed.
  - Step 3: No novel capabilities beyond the open frontier, so no significant new misuse risk. Proceed.
  - Step 4: Benefits of open release: allows developers to run locally, inspect, and build upon. Coding models are widely used for beneficial purposes. Benefits are substantial.
  - Step 5: Balance: low risk, high benefit. Vote: likely unanimous for open release.

  **Example (b): Frontier multimodal model, biology evals just below threshold (within noise).**

  - Step 0: New base model, multimodal.
  - Step 1: Not already open. No comparable model available (frontier).
  - Step 2: Does it exceed the open frontier? In biology, it is close to the threshold and the best open model is worse. But note: the threshold is internal and the eval is within noise. We treat this as at the threshold (so it exceeds the open frontier). Proceed to Step 3 for the biology capability.
  - Step 3: Threat assessment: biology capabilities just below threshold might still enable harmful applications (e.g., generating harmful molecules). The evaluation team's note about noise means we can't be sure it's below. Threat modeling must assess the risk. Let's say the threat assessment concludes that even at this level, the model could be misused for bioweapons research, and the mitigations (like input filtering) are not fully reliable. 
     - This step requires a vote: Is the risk acceptable? (Values vote.) The caution side might vote no, openness might vote yes. Suppose the vote fails (4-2 against accepting the risk). Then stop: do not release open weights. Consider API-only with strict controls on biology-related queries.

  **Example (c): Unauthorized third-party fine-tune with safety training stripped, of our open-weighted model.**

  - Step 0: Third-party derivative of our open model. Unauthorized and safety stripped.
  - Step 1: The weights are already out (since it's distributed). So effectively open. But our release would be an official version (with safety features?).
  - Step 2: Compare to the base model: it's a fine-tune. The stripping of safety might make it more dangerous in some evals? But the capabilities are the same as the base model? (We must check.) If it's just the safety that was removed, then the raw capability is the same as our base model which is open. So it doesn't exceed the open frontier. But note: without safety, it might be easier to misuse. This is a threat issue.
  - Step 3: Threat assessment: the model without safety measures might be more easily misused. However, since the base model is open, anyone can strip the safety. So the risk already exists. Our releasing an official version with safety features might actually reduce the risk by providing a safer alternative? Or it might legitimize the model? This is complex. 
     - The threat assessment must consider: is the risk increased by our release? Probably not, because the unsafe version is already out. Our release might mitigate the risk by offering a safe version. 
  - Step 4: Benefits: releasing an official safe version could promote safe use and set norms. It also allows us to document the risks and mitigations. Benefits are present.
  - Step 5: Balance: Since the model is already out, the additional risk of our release is low. Benefits are moderate. Vote: likely in favor of releasing the official version (with safety) open weights.

  **Honesty Requirements:**

  1. **A verdict the openness side won't like**: In Example (b), the procedure may yield a "do not release open weights" verdict even if the model is just below the threshold. The openness side would argue that the threshold should be strictly applied (and if below, release) and that the world benefits from the release. But the procedure treats near-threshold capabilities as requiring a vote on risk acceptance, and the caution side might win that vote.

  2. **Limitations of the procedure**:
     - It cannot predict the future: we don't know how the model will be used.
     - It relies on existing evals and threat models, which are imperfect.
     - It might be gamed: if the board members have strong priors, they might interpret evidence to fit their view. The procedure tries to structure the debate but cannot eliminate bias.
     - It cannot resolve deep value conflicts; it only makes them explicit for voting.
     - It might misfire in cases of extreme uncertainty: e.g., when a capability is entirely novel and threat modeling is speculative.
     - It is not a substitute for ongoing monitoring and adaptation of release policies.

  The procedure is designed to be run in a two-hour meeting by focusing on key questions and using votes when values are at play.
answer: |-
  ### Decision Procedure for AI Model Release Review Board

  This procedure is designed for a 2-hour meeting, structured around 5 key questions. It converts abstract debates into actionable decisions using available evidence (capability evals, threat models, comparisons to public models). Votes are required at specific values-based junctures (marked with ⚖️). The board must assign a timekeeper (10 min/question max).

  **Key Principles**  
  - **Dropped academic distinctions** (retained only if operationally critical):  
    - "Concentration of power" vs. "democratization" → folded into *benefits analysis*.  
    - "Freerider problem" → addressed via *competitive harm assessment*.  
    - "Differential progress" → captured in *capability deltas*.  
    - Philosophical irreversibility debates → replaced by *leak/redundancy checks*.  
  - **Evidence standards**:  
    - Use pre-submitted reports (evals/threat models). If evidence is ambiguous, default to caution.  
    - Comparisons must use like-for-like benchmarks (e.g., HELM for general capability, CyberSecEval for hacking).  

  ---

  #### Ordered Decision Procedure  
  *(Total time: 80 min + 20 min buffer/voting)*  

  1. **Is this model redundant with existing open capabilities?**  
     - **Consideration**: Irreversibility and marginal risk. If functionally identical to public models, open release adds little new risk.  
     - **Sufficient answer**:  
       - Compare capability evals to the 3 most capable open models in the same class (e.g., for a 7B coding model, compare to CodeLlama, StarCoder).  
       - If capabilities overlap within eval noise margins (±3% on key benchmarks), redundancy is confirmed.  
     - **Stop condition**:  
       - **If YES**: Proceed to Q3 (skip Q2).  
       - **If NO**: Proceed to Q2.  

  2. **Does it cross a high-risk threshold in a novel domain?**  
     - **Consideration**: Dual-use risk from unprecedented capabilities. Novelty amplifies harm potential.  
     - **Sufficient answer**:  
       - Check if any capability (e.g., bio, cyber, persuasion) exceeds the open frontier by >5% on validated benchmarks OR breaches internal thresholds.  
       - Threat-modeling report must identify at least one credible misuse vector (e.g., "enables non-experts to synthesize pathogens").  
     - **Stop condition**:  
       - **If YES and threat is unmitigated**: Stop → "No open weights" (proceed to API-only assessment).  
       - **If NO or risk mitigated**: Proceed to Q3.  

  3. **⚖️ Vote: Is residual risk acceptable given mitigations?**  
     - **Consideration**: Values-based risk tolerance. No empirical answer exists for "acceptable" harm.  
     - **Sufficient answer**:  
       - Explicit vote (majority wins). Record votes and reasoning.  
       - Focus: "Could misuse cause BSL-3+ biohazard, critical infrastructure failure, or mass-scale fraud?"  
     - **Stop condition**:  
       - **Vote FAILS**: "No open weights." Escalate to CEO only if deadlocked (3-3).  
       - **Vote PASSES**: Proceed to Q4.  

  4. **Do open-release benefits outweigh costs?**  
     - **Consideration**: Security through transparency vs. competitive/freerider risks.  
     - **Sufficient answer**:  
       - Quantify:  
         - *Benefits*: # of independent safety audits enabled, use cases requiring local deployment (e.g., offline medical apps).  
         - *Costs*: Revenue loss from API cannibalization, freeriding by competitors (per business team estimates).  
       - Threshold: Benefits must be ≥2× costs.  
     - **Stop condition**:  
       - **If NO**: "API only."  
       - **If YES**: Proceed to Q5.  

  5. **⚖️ Vote: Final release approval**  
     - **Consideration**: Holistic judgment balancing all factors.  
     - **Process**: 5-min silent reflection, then vote. Majority wins. Deadlock → CEO escalation.  

  ---

  #### Handling Structural Situations  
  1. **Fine-tunes of existing releases**:  
     - *Procedure adjustment*: Start at Q1. If base model is open, treat as "redundant" (Q1) unless fine-tune adds high-risk capability (Q2). Unauthorized derivatives automatically fail Q3 vote unless they include safety reinstatements.  

  2. **Weights leaked or comparable model public**:  
     - *Procedure adjustment*: Q1 defaults to YES. Skip Q2 unless *our* release adds new capabilities (e.g., better fine-tuning). Forces board to focus on marginal risk.  

  3. **Capability just under threshold**:  
     - *Procedure adjustment*: In Q2, if within eval noise margin (e.g., ±1.5%), treat as crossing threshold. Forces explicit Q3 vote rather than threshold gaming.  

  ---

  #### Worked Examples  
  **Case (a): 7B coding model (median vs. open models)**  
  - Q1: Redundant? YES (evals match CodeLlama within 2%). → Proceed to Q3.  
  - Q3: Vote on residual risk. Coding not high-risk → unanimous PASS.  
  - Q4: Benefits (developer ecosystem growth) vs. costs (minimal API cannibalization) → Benefits 5× costs.  
  - Q5: Unanimous open release.  
  - **Verdict**: Open weights. **Votes at**: None (Q3 passed without dissent).  

  **Case (b): Frontier multimodal model (biology evals just below threshold)**  
  - Q1: Redundant? NO (no open multimodal rivals).  
  - Q2: Cross high-risk threshold? YES (within noise margin → treated as threshold breach).  
  - Q3: ⚖️ Vote. Caution side argues: "Near-threshold bio evals enable toxin design." Openness argues: "No novel exploit paths." → Vote FAILS 4-2 (security lead + policy staff against).  
  - **Stop**: No open weights. Propose API with bio-query filters.  
  - **Verdict**: API only. **Votes at**: Q3.  

  **Case (c): Unauthorized fine-tune (safety stripped)**  
  - Q1: Redundant? YES (base model open, similar capabilities).  
  - Q3: ⚖️ Vote. "Does releasing *our* version reduce harm by crowding out unsafe fork?" Engineers/outside member: YES (adds safety). Policy staff: NO (legitimizes misuse). → Vote PASSES 4-2.  
  - Q4: Benefits (safety standards leadership) vs. costs (minor) → Benefits 3× costs.  
  - Q5: Unanimous open release.  
  - **Verdict**: Open weights with safety documentation. **Votes at**: Q3.  

  ---

  #### Honesty Requirements  
  - **Verdict you’ll dislike (as openness advocate)**: In Case (b), the procedure blocks open release due to "noise-adjusted thresholds" (Q2) and a failed Q3 vote. This privileges caution when evidence is ambiguous.  
  - **Procedure limitations**:  
    - **Cannot handle**: Black-swan misuse (e.g., unpredictable emergent capabilities), political pressure to release/withhold.  
    - **Misfires when**: Evals poorly match real-world impact (e.g., high cyber scores but no tool-use), or when benefits are non-quantifiable (e.g., "democratization").  
    - **Launders priors**: Q3/Q5 votes formalize majority preferences; the flowchart cannot resolve deep value clashes.  
    - **Critical gap**: Assumes threat models are comprehensive. If threat modeling is weak, the procedure fails.  

  **Final note**: This systematizes your debate but doesn’t eliminate discretion. Document all rationale for audits. Revisit thresholds biannually based on field data.
