  We are going to translate the dispute about the Principal Principle and objective chance into the Bayesian statistician's vocabulary. The goal is a faithful translation, not a caricature. We will cover:

  1. The Principal Principle as a claim about calibration and predictive distributions.
  2. The "undermining" worry expressed in terms of a hierarchical model.
  3. The patched rules (like Hall's "New Principle") as modifications to conditioning or scoring.
  4. The Humean identification of chance in terms of limiting relative frequency or best-system summary.

  We'll then give a residue report: what, if anything, has no counterpart in statistical practice? And we'll address the question: in a hierarchical model, is the parameter a discovered quantity or a bookkeeping convenience?

  ## Translation

  ### 1. The Principal Principle (PP) in Bayesian Terms

  - **Lewis's PP**: If you know that the objective chance of event A is p, and you have no other relevant information, then your subjective credence in A should be p.

  - **In your terms**: 
    - Consider an exchangeable sequence of events (or random variables) X_1, X_2, ... . By de Finetti, there exists a parameter θ (which may be thought of as a limiting frequency) such that, conditional on θ, the X_i are i.i.d. with P(X_i=1 | θ) = θ.
    - The PP then says: if you know θ = p (exactly), then your credence for any X_i (or for a future X_{n+1}) should be p.

  - **But note**: In the Bayesian framework, you never know θ exactly. You have a prior over θ and update to a posterior. So the PP scenario is an idealization: it assumes you have perfect knowledge of the parameter.

  - **Your view (from de Finetti)**: 
    - Objective chance is not primitive. It emerges from exchangeability. The parameter θ is a mathematical object that summarizes the symmetry (exchangeability) of your beliefs. 
    - The PP, in this view, is a consequence of coherence: if you condition on θ=p, then by definition of the model, your predictive distribution for any X_i is Bernoulli(p). So the PP is built into the model.

  ### 2. The "Undermining" Worry in Hierarchical Model Terms

  - **The worry (from Lewis's Humean view)**: 
    - In Humeanism, the chance of an event is determined by the entire pattern of events in the world (the "Humean mosaic"). In particular, for a sequence of events, the chance might be identified with the limiting relative frequency (if it exists) or with the best systematization of the mosaic (the "best system").
    - Now, suppose you know the chance of A is p, but then you learn about future events that are part of the mosaic. This future information might alter the entire mosaic in such a way that the chance of A (which is defined by the whole mosaic) is no longer p. This is "undermining": learning about the future can change the chance of a past event.

  - **In your terms**:
    - Consider a finite sequence of binary events X = (X_1, ..., X_n) and a model with parameter θ. Assume the Humean view: θ is not a primitive but is defined as a function of the entire sequence, e.g., θ = (X_1+...+X_n)/n (the relative frequency) or θ is the value that minimizes some loss in a coding scheme (best system). 
    - Now, suppose you are at time t (with t < n) and you observe X_1, ..., X_t. The current relative frequency is θ_t = (X_1+...+X_t)/t. But the chance θ is defined on the whole sequence. So if you condition on θ = p (i.e., the entire sequence has average p), then learning about future events (X_{t+1}, ..., X_n) cannot change the past, but it can change the value of θ? 
    - Actually, if θ is defined as the relative frequency of the entire sequence, then θ is a function of the entire sequence. Therefore, at time t, θ is unknown because the future is unknown. But if you condition on θ = p, then you are fixing the entire sequence to have average p. Then, learning a future event doesn't change θ because θ is fixed? 

  - **The problem**:
    - In the Humean view, the chance θ is determined by the entire mosaic. So if we condition on θ=p, we are effectively conditioning on the entire sequence having relative frequency p. But then, if we learn a future event, say X_{t+1}=1, that doesn't change the past, but it does change the remaining future events because the entire sequence must average to p. So the chance of a past event (say X_1) might seem to change? 

  - **Example**:
    - Let n=2. We have two coin flips, and the chance θ is the relative frequency over the two flips. Suppose we condition on θ=0.5. Then the possibilities are (0,1) and (1,0). Now, at time t=1, we have not seen any flips. The chance of X_1=1 is 0.5 (since both (1,0) and (0,1) are equally likely? Actually, we haven't specified a prior over sequences). 
    - Now, if we learn X_1=1, then we know the entire sequence must be (1,0) to have θ=0.5. So the chance of X_1=1 is now 1? But that's not changing the past: we already observed X_1=1. 
    - The undermining worry is about the chance of a past event that we haven't observed? Actually, the worry is that if we condition on the entire mosaic, then learning about the future can change the chance of a past event because the chance is defined by the whole. But note: in a Bayesian model, we condition on the past to predict the future. We don't condition on the entire mosaic.

  - **Re-expression**:
    - In a hierarchical model, if we define θ as a function of the entire data (like the sample mean), then θ is a deterministic function of the data. So if we condition on θ, we are conditioning on a function of the data. Then, the joint distribution of the data given θ is concentrated on the set of sequences that have that θ. 
    - Now, the "undermining" scenario: 
        - Suppose we condition on θ = p (so the entire sequence has mean p). 
        - We then observe the first t data points. 
        - The chance of a past event (say the t-th event) is then the probability of X_t given θ and the other data? But note: given θ and the entire sequence except X_t, then X_t is determined? Because θ is a function of the entire sequence. 
    - This is not the way we build models. In a typical hierarchical model, θ is a latent variable, and the data are conditionally i.i.d. given θ. The joint distribution of the data and θ is such that θ is random and the data are random. We do not define θ as a function of the data.

  - **The key difference**:
    - In the Humean view, θ (chance) is defined as a function of the entire data (the mosaic). It is not a latent variable that exists independently. 
    - In the Bayesian model, θ is a latent variable that we put a prior on, and then the data are generated conditionally independently given θ. The joint distribution is p(θ, X) = p(θ) * p(X|θ). 
    - In the Humean view, the joint distribution is p(X), and θ = f(X) for some function f (like the limiting frequency). Then, if we condition on θ, we are conditioning on f(X)=p.

  - **Undermining in Bayesian terms**:
    - If we adopt the Humean definition of θ as f(X) (a function of the entire data), then conditioning on θ is conditioning on an event (f(X)=p). Then, the conditional distribution of the data given f(X)=p is a distribution that is uniform (or according to some prior) over the sequences that have f(X)=p. 
    - Now, if we have observed part of the data, say X_{1:t} = x_{1:t}, then the conditional distribution of the future data X_{(t+1):n} given θ=p (i.e., f(X)=p) and x_{1:t} is constrained to be such that the entire sequence has relative frequency p. 
    - The "undermining" worry is that the chance of a past event (say X_1) might be affected by learning the future? But note: we have already observed the past. So we condition on the past. 
    - However, if we haven't observed a past event? Suppose we are at time t, and we haven't observed X_1 (because we have missing data). Then, if we condition on θ=p (the entire sequence's frequency is p), and then we learn about the future, it can change the conditional distribution of X_1. This is because θ is a function of the entire sequence, so the future and the past are dependent given θ. 

    - Example: n=2, and we condition on θ=0.5. The sequences are (0,1) and (1,0). We haven't observed either. The probability that X_1=1 is 0.5. Now, if we learn X_2=0, then we know the sequence must be (1,0). So the conditional probability that X_1=1 becomes 1. So learning a future event changed the probability of a past event. 

    - But note: in a typical hierarchical model (with θ as a latent variable and the data conditionally i.i.d. given θ), if we condition on θ=p, then the past and future are conditionally independent. So learning the future does not change the distribution of the past. 

    - Therefore, the undermining worry arises only when θ is defined as a function of the entire data. It does not arise in the standard hierarchical model where θ is a latent variable and the data are conditionally independent given θ.

  ### 3. Patched Rules (e.g., Hall's New Principle)

  - **The New Principle (NP)**:
    - The original PP: Cr(A | chance(A)=p, E) = p, provided E is admissible.
    - The NP: Cr(A | chance(A)=p, E) = p, but now we condition on the entire chance function (or the theory of chance) rather than just the chance of A. The idea is to avoid undermining by conditioning on the whole pattern.

  - **In your terms**:
    - Instead of conditioning on θ (the chance of A) alone, we condition on the entire model and the value of the parameter. But note: in the hierarchical model, the chance of A is determined by θ. So conditioning on θ determines the chance of every event.

    - The NP can be translated as: condition on the entire parameter vector (if the model has multiple parameters) and the model structure. But in the simple Bernoulli case, θ is the whole story.

    - In the Humean view, the chance of A is determined by the entire mosaic. So the NP might be: condition on the entire mosaic? But that would make the chance of A trivial (because you know everything). 

    - Alternatively, in the hierarchical model, we don't condition on θ alone, but on θ and the fact that the data are exchangeable and generated conditionally i.i.d. given θ. Then the predictive distribution for A is Bernoulli(θ). So the NP in this case doesn't change anything.

    - However, in the Humean view where θ is a function of the entire data, the NP is often stated as: 
          Cr(A | H & T) = ch_T(A)
      where H is the history (the data we have) and T is the entire theory of chance (which specifies the chance for every event). 

    - In the Bayesian model, T would be the model specification (the likelihood and prior) and the parameter θ. Then conditioning on T and H, the predictive distribution for A is determined by θ and the model. 

    - But note: in the Humean view, T is determined by the entire mosaic. So conditioning on T and H is equivalent to conditioning on the entire mosaic? Not exactly: T is the best system, which might be a compressed representation of the mosaic. 

  - **In terms of conditioning policy**:
    - The NP might be seen as: condition on the entire model and the parameter, not just the chance of the event in question. In the Bernoulli case, that is already what we do.

  - **In terms of scoring rules**:
    - The philosophers are not typically talking about scoring rules. But if we think about the goal of calibration, then the NP might be seen as requiring that our credence should match the chance, but with the chance being defined relative to the entire model. 

  ### 4. Humean Chance in Bayesian Terms

  - **Humean Chance**: 
    - The chance of an event is identified with the limiting relative frequency (in the long run) or with the summary provided by the "best system" (a system that optimizes simplicity and strength).

  - **In your terms**:
    - **Limiting relative frequency**: 
        - For an infinite exchangeable sequence, by de Finetti, there is a θ such that the limiting frequency exists and equals θ almost surely. So in this case, the Humean chance is θ. 
        - But note: de Finetti shows that θ is a random variable, and the Bayesian treats it as such. The Humean might say that θ is not a random variable but a property of the infinite sequence (which exists objectively). 
        - However, the Bayesian does not assume the sequence is infinite. We model finite sequences as exchangeable and extend by coherence.

    - **Best-system summary**:
        - This is more complex. Suppose we have a finite sequence. The best system is a model (like a probability distribution) that provides a good compression of the data. The chance is then the probability assigned by that model.
        - In Bayesian terms, we might think of model selection. Suppose we have a set of candidate models. The best system is the model that achieves the best trade-off between accuracy (e.g., likelihood) and complexity (e.g., description length). 
        - But note: the best system is a function of the entire mosaic. So again, it is data-dependent. 

    - **Contrast**:
        - In the Bayesian hierarchical model, the parameter θ is a latent variable that we assign a prior to. It exists independently of the data in the sense that the prior is specified before seeing the data. 
        - In the Humean view, θ is defined only after seeing the entire data (or in the infinite case, the entire infinite sequence). It is a summary of the data, not a cause of the data.

  ## Residue Report

  What has no counterpart in statistical practice?

  1. **Conditioning on the entire mosaic**:
     - In the Humean view, chance is defined by the entire pattern of events. Therefore, conditioning on chance (in the Humean sense) is conditioning on a function of the entire data. This is not standard in Bayesian modeling. 
     - In Bayesian practice, we condition on the past to predict the future. We do not condition on a function of the entire data (which includes the future) because we don't have the future data.

  2. **Undermining**:
     - The undermining worry arises only when we interpret the parameter θ as a function of the entire data (including future data). This is not how statisticians use parameters. In a hierarchical model, θ is a latent variable that exists prior to the data. The data are conditionally independent given θ. Therefore, learning the future does not change the distribution of the past given θ. 
     - So the undermining scenario is an artifact of the Humean definition of chance. It does not arise in the standard Bayesian setup.

  3. **The New Principle**:
     - In the Bayesian framework, we already condition on the entire model and the parameter. Therefore, the New Principle doesn't add anything. 
     - However, if we adopt the Humean definition of chance (as a function of the entire mosaic), then the NP is an attempt to condition on the entire theory of chance (which is a function of the entire mosaic) without conditioning on the entire mosaic. This is a subtle distinction that doesn't have a direct counterpart in standard Bayesian modeling.

  ### The Key Question: Is the parameter a discovered quantity or a bookkeeping convenience?

  - **Your view**: The parameter is a bookkeeping convenience that arises from exchangeability. It is a way to encode symmetric beliefs. There is no further "objective" status to it.

  - **Humean view**: The parameter (chance) is a discovered quantity: it is a feature of the world (the mosaic) that we discover by looking at the entire pattern. It is not a bookkeeping device; it is an objective fact about the world.

  - **What survives translation**:
     - The question: is θ a latent variable that exists independently of the data (with a prior) or is it a function of the data?
     - In the Bayesian model, we treat θ as a latent variable. In the Humean view, θ is a function of the data.

     - However, note: de Finetti's theorem shows that for an exchangeable sequence, there is a θ such that the data are conditionally i.i.d. given θ. But this θ is defined on the infinite sequence. In practice, we use it for finite sequences as an approximation.

     - The philosophical disagreement reduces to the status of θ: 
          - Bayesian statistician: θ is a useful fiction that helps in making predictions. It is part of our subjective representation. 
          - Humean: θ is an objective feature of the world (the limiting frequency or the best summary) that we can discover.

     - But note: the Bayesian does not claim that θ is real. It is a representation of our beliefs. 

  ### Conclusion

  - The Principal Principle, in your framework, is a direct consequence of the definition of the hierarchical model. If you condition on θ=p, then the predictive distribution is p. 

  - The residue: 
     - The Humean view defines chance as a function of the entire mosaic (including future events). This leads to the undermining problem, which does not arise in the standard Bayesian model. 
     - The philosophers' concern is that without an objective grounding (like the entire mosaic), the PP is circular: it uses the parameter to define chance, but the parameter is just a tool for bookkeeping. 

  - Your view: exchangeability dissolves the need for objective chance. The PP is a theorem about coherence. 

  - The philosophers might reply: but what if the sequence is not exchangeable? Then the Bayesian model fails. And what if there are objective chances that are not captured by exchangeability? For example, in quantum mechanics, there might be objective chances that are not reducible to exchangeability. 

  - But note: de Finetti's theorem is for exchangeable sequences. There are extensions (like partial exchangeability) for more complex situations. 

  - Final thought: the disagreement might be less substantive than it appeared. The Bayesian can use the machinery without believing in objective chances. The philosopher of science might be concerned with the metaphysics of chance, which the statistician can bypass. 

  - However, the question of whether the parameter is discovered or a convenience remains. The Bayesian statistician can remain agnostic: the model is a tool for prediction. The Humean wants to ground chance in the physical world. 

  In your terms, once exchangeability is granted, the PP is a theorem. The residue is the metaphysical question: is there an objective chance that exists independently of our beliefs? But that question might not affect the statistical practice.
answer: |-
  ### Faithful Translation of the Dispute into Bayesian Statistical Vocabulary

  #### 1. **Principal Principle (PP) as Calibration and Predictive Distributions**
  - **Lewis's PP**: If you know the objective chance of event \(A\) is \(p\) and have no other relevant information, your credence in \(A\) should be \(p\).
  - **Your translation**:  
    In an exchangeable sequence \(X_1, X_2, \dots\) modeled with a parameter \(\theta\), de Finetti guarantees \(\theta\) exists such that \(X_i \mid \theta \sim \text{i.i.d.}\) with \(P(X_i = 1 \mid \theta) = \theta\). The PP reduces to:  
    \[
    P(X_{n+1} = 1 \mid \theta = p) = p.
    \]  
    This is a direct consequence of conditional independence in the model. "Deferring to chance" means using the posterior predictive distribution \(P(X_{n+1} \mid \text{data})\), which converges to \(p\) as data accumulates.  
  - **Her comeback**:  
    This assumes \(\theta\) is a "real" quantity to which we defer. But if \(\theta\) is *defined* as a functional of the data (e.g., limiting frequency), conditioning on \(\theta\) is circular. PP requires an objective \(\theta\) external to the data; otherwise, it's self-referential.

  #### 2. **Undermining in Hierarchical Model Terms**
  - **Her worry (Humean undermining)**:  
    If chance \(\theta\) is determined by the entire data pattern (e.g., \(\theta = \lim_{n \to \infty} \frac{1}{n} \sum X_i\) for a Humean), learning future data can alter \(\theta\), thereby changing the chance of *past* events.  
  - **Translation into a model**:  
    Consider a finite sequence \(X_1, \dots, X_n\) with \(\theta\) defined as a deterministic function of the data, e.g., \(\theta = \frac{1}{n} \sum_{i=1}^n X_i\) (Humean chance). The joint distribution is \(P(X_{1:n})\). Conditioning on \(\theta = p\) fixes \(\sum X_i = np\). Now:  
    - At time \(t < n\), after observing \(X_{1:t} = x_{1:t}\), your belief about \(X_{t+1}\) is based on \(P(X_{t+1} \mid x_{1:t}, \theta = p)\).  
    - But since \(\theta\) depends on *all* data, observing \(X_{t+1}\) changes the constraints on unobserved data (including past gaps). For example:  
      - With \(n=2\), \(\theta = \frac{X_1 + X_2}{2}\), and conditioning on \(\theta = 0.5\) implies sequences \((0,1)\) or \((1,0)\).  
      - If you then learn \(X_2 = 0\), \(X_1\) must be \(1\)—so the "chance" of \(X_1 = 1\) jumps from \(0.5\) to \(1\).  
    This violates the intuition that past events should be immutable.  
  - **Contrast with your view**:  
    In a standard Bayesian model, \(\theta\) is a latent variable with prior \(P(\theta)\), and \(X_i \mid \theta \sim \text{i.i.d.}\). Here, \(P(X_1 \mid \theta, X_2)\) is unchanged by observing \(X_2\) due to conditional independence. Undermining arises *only* if \(\theta\) is a data-dependent function, not a latent variable.

  #### 3. **Patched Rules (e.g., Hall's New Principle)**
  - **Hall's New Principle (NP)**:  
    Original PP fails under Humean chance due to undermining. NP revises it to:  
    \[
    \text{Credence}(A \mid \text{chance}(A) = p, T) = p,
    \]  
    where \(T\) is the complete "theory of chance" (specifying chances for all events).  
  - **Translation**:  
    - Conditioning *only* on \(\theta = p\) is insufficient; you must condition on the entire chance structure.  
    - In a hierarchical model, this means conditioning on the full model \(\mathcal{M}\) (likelihood and prior) and the parameter \(\theta\), not just \(\theta = p\).  
    - NP modifies the conditioning policy:  
      \[
      P(X_{n+1} = 1 \mid \theta = p, \mathcal{M}) \to P(X_{n+1} = 1 \mid \theta = p, \mathcal{M}, \text{all chance facts}).
      \]  
      But in a Bayesian model, \(\theta\) and \(\mathcal{M}\) already determine "all chance facts," so NP adds nothing new.  
    - **Scoring rule perspective**:  
      NP ensures calibration by requiring credence to match chance *within the complete theoretical context*. If chance is defined as the best-system summary (e.g., via minimum description length), NP aligns with using a prequential score that accounts for model complexity.

  #### 4. **Humean Chance as Limiting Frequency or Best-System Summary**
  - **Humean chance in your terms**:  
    - *Limiting relative frequency*: For an infinite exchangeable sequence, \(\theta = \lim_{n \to \infty} \frac{1}{n} \sum X_i\) (a.s. by de Finetti). But this is a *consequence* of exchangeability, not a primitive.  
    - *Best-system summary*: Given data \(X_{1:n}\), choose a model \(\mathcal{M}^*\) and parameter \(\theta^*\) minimizing a tradeoff (e.g., description length + prediction error). Chance is \(\theta^*\), defined *after* seeing all data.  
      Example: For binary data, \(\theta^*\) might be the frequency \(\frac{1}{n} \sum X_i\) if \(n\) is large, but a biased estimate if \(n\) is small and simplicity matters.  
  - **Key difference**:  
    Humeans treat \(\theta\) as an *output* of data compression/optimization, while Bayesians treat it as an *input* (latent variable) to the generative model.

  ---

  ### Residue Report: What Has No Counterpart in Statistical Practice?

  #### 1. **Non-Translable Elements**
  - **Metaphysical grounding of chance**:  
    Her claim that "without objective chances, PP has no foundation" relies on \(\theta\) being a *mind-independent* entity. This has no analogue in Bayesian statistics, where \(\theta\) is a tool for predictive coherence. Your view rejects the need for this grounding; hers insists on it.  
    - *Why no translation?* Statistics is agnostic about metaphysics. De Finetti shows exchangeability implies \(\theta\) exists mathematically, but not that it "exists" ontologically. Her demand exceeds the vocabulary.

  - **Humean chance as data-dependent function**:  
    Defining \(\theta = f(X_{1:n})\) as a deterministic function of the *entire dataset* (e.g., sample mean) conflicts with Bayesian modeling, where:  
    - \(\theta\) is specified *a priori* via \(P(\theta)\) and \(P(X \mid \theta)\).  
    - Conditioning on future data affecting past chances is incoherent in standard models.  
    - *Residue*: This is a deliberate philosophical choice (Humean supervenience). Statisticians avoid it by construction.

  #### 2. **Substantive vs. Verbal Disagreement**
  - **Where the disagreement is substantive**:  
    - **Status of \(\theta\)**: For you, \(\theta\) is a *bookkeeping device* for exchangeable beliefs. For her (and Lewis), it must be a *discovered quantity* in the world. This is irreconcilable within statistics alone.  
    - **PP as theorem vs. axiom**: You derive PP from coherence; she sees it as a fundamental norm requiring objective chances.  

  - **Where it collapses upon translation**:  
    - Undermining only arises under a Humean \(\theta = f(\text{data})\)—a setup Bayesians reject. In practice, statisticians use latent-variable models where \(\theta\) is not data-dependent, avoiding undermining.  
    - NP reduces to standard conditioning in Bayesian models, making it redundant. Philosophers' "patching" addresses a problem statisticians don't encounter.  

  #### 3. **Your Tentative View: Parameter as Bookkeeping vs. Discovery**
  - **Philosophers' surviving argument**:  
    Even with exchangeability, one can ask: *Why does the world exhibit this symmetry?* If exchangeability holds, your view suffices for prediction. But if there are "deeper" chances (e.g., quantum mechanics), exchangeability might be a consequence of objective randomness, not a replacement for it.  
    - *Translation*: In a hierarchical model, is exchangeability a subjective choice or an objective fact?  
    - *Her point*: If chances are real, PP could hold even without exchangeability (e.g., in single-case propensities). Bayesianism cannot recover this—it *requires* symmetry assumptions.  

  - **Your counter**:  
    De Finetti renders "single-case chance" incoherent. For any sequence (even \(n=1\)), exchangeability and PP emerge from coherent credences. Objective chance adds no predictive value.  

  #### Conclusion
  The residue compresses to **two irreconcilable perspectives**:  
  - **You**: Parameters are bookkeeping tools; PP is a coherence theorem.  
  - **Her**: Parameters must be discovered entities; PP is a law of rational deference.  

  Philosophy adds the question: *Could objective chance exist beyond exchangeability?* But in statistical *practice*, this changes nothing—exchangeability is sufficient for coherent inference. The dispute is metaphysical, not operational. Your view holds that once exchangeability is granted, "objective chance" is redundant; hers insists it's foundational. The midnight stalemate stands.
