prompt: |-
  I've worked in removals for over twenty years, and there is something that happens whenever two people carry a wardrobe up a staircase that I have never been able to name. I don't mean the physical side of it. I mean this: neither of us issues instructions, yet we adjust to each other continuously, and afterwards neither of us could say exactly what he did — the carrying seems to belong to the pair rather than to either man. And if one of us puts his end down without warning, the other's complaint is not merely "that was careless" but "you can't do that to me" — as though something had been owed, even though nothing was said, promised, or signed. What is more, that sense of being owed does not appear everywhere that people rely on each other. When two strangers reach a narrow gate at the same moment and each waits for the other, each plainly relies on the other's restraint, and yet if one pushes through first the other only grumbles; nobody feels betrayed. There is a similar fuzziness at the edges: two colleagues gradually start tidying a van together, and at some hard-to-locate point wandering off for a smoke stops being a personal choice and becomes the rebuke-worthy thing, but I could not tell you when the change happens.

  Does this cluster — the pair-owned doing, the rebuke without a promise, and above all the line between reliance that carries that entitlement and reliance that doesn't — have an established name in philosophy or anywhere else? I am not after a bare label. Please answer in four sections, in this order: (1) The nearest established concepts, and what each would say about my cases (about 200 words); (2) Where my cases break away from each of those concepts, taken one at a time (about 250 words); (3) Your verdict: either one of those concepts in fact covers the phenomenon, defended against the cases in section 2, or a new name and a plain-words definition of the dividing line I am chasing (about 200 words); (4) Two boundary cases that test that verdict, one falling on each side of the line (about 100 words).
reasoning: |-
  Hmm, the user has described a fascinating phenomenon from their 20 years in removals - that unspoken coordination when carrying furniture like a wardrobe up stairs. They've pinpointed several key elements: the joint ownership of the action, the sense of betrayal when one person breaks rhythm without warning, and the fuzzy boundary where reliance becomes obligation. They want to know if this has an established name in philosophy.

  The core puzzle lies in this transition from mere coordination to moral entitlement. The user contrasts the wardrobe case with other reliance scenarios (like strangers at a gate) where no such obligation exists. This suggests they're after something deeper than just teamwork terminology.

  Considering established concepts:
  - Joint action theory (Bratman/Gilbert) explains coordination but doesn't fully capture the moral dimension when things go wrong.
  - Social norms cover unwritten rules but feel too broad for this intensely dyadic experience.
  - Reliance-responsibility models (Goldberg) focus on one-sided dependence, not mutual emergence.
  - Implicit contracts seem too transactional for something that builds organically.

  Where these fall short: 
  Joint action theory misses the "you can't do that to me" violation feeling. Social norms lack the dyadic specificity. Reliance models don't explain the mutual emergence. Contracts imply premeditation absent here.

  My verdict: This is "emergent dyadic obligation" - a moral dimension that crystallizes when two people become a single operational unit through continuous adjustment. The dividing line is mutual embodiment: when your actions physically become the other person's safety condition.

  Boundary tests:
  - Falling on the obligation side: Two surgeons silently passing instruments mid-operation - abandonment would feel like betrayal.
  - Not triggering obligation: Dinner guests clearing plates together - walking away might be rude but not "you can't do that to me."
answer: |-
  Here is an analysis of your phenomenon, structured as requested. It draws on philosophy of action, ethics, and social ontology:

  ### (1) Nearest Established Concepts (≈200 words)
  - **Joint Intentionality (Bratman, Gilbert)**: Focuses on shared goals and interdependent actions. It would describe wardrobe-carrying as a "shared cooperative activity" where both agents mesh subplans without explicit agreement. The gate scenario involves parallel individual intentions ("I'll wait for you"), not truly joint action.
  - **Social Norms (Binder, Brennan)**: Unwritten rules governing behavior. Norms might explain tidying the van (gradual emergence of expected conduct) and gate grumbling (violation of courtesy). But norms are group-level, not dyad-specific.
  - **Reliance and Moral Responsibility (Goldberg)**: When we rely on others, their failure can create moral claims. Goldberg distinguishes "reliance" (loss from broken expectation) from "entitlement" (moral right). He’d note wardrobe-carrying creates high-stakes reliance, justifying rebuke.
  - **Implicit Contract (Rawls, Scanlon)**: Mutual unspoken agreements. The "something owed" resembles contractual duty arising from participation. But contracts typically require mutual acknowledgment, absent here.

  ### (2) Where Your Cases Break Away (≈250 words)
  - **Against Joint Intentionality**: Bratman/Gilbert require shared commitment to the *pair’s* action. Yet your movers don’t pre-plan; coordination emerges reactively ("neither issues instructions"). The "pair-owned doing" is felt retroactively, not intentionally built. Joint action also can’t easily explain the betrayal intensity ("you can’t do that to *me*")—it’s more personal than failing a shared plan.
  - **Against Social Norms**: Norms govern broad contexts (e.g., "don’t push in queues"). Your wardrobe case is hyper-local: a unique obligation forged *in that moment* between two specific people. Norms also don’t clarify why gate-reliance lacks entitlement: both involve unwritten rules, but only the wardrobe creates dyadic debt.
  - **Against Reliance Models**: Goldberg’s reliance (e.g., trusting a stranger’s driving) often lacks entitlement. Your cases show identical reliance (e.g., both movers depend equally) suddenly crossing into obligation *during* action. Reliance alone doesn’t explain why putting down the wardrobe feels like a *betrayal*, while gate-pushing is mere frustration.
  - **Against Implicit Contracts**: Contracts imply reciprocal promises. Nothing is "signed" mentally either; the obligation emerges fluidly. Contracts also don’t cover the "fuzziness" of tidying the van—there’s no moment of agreement, yet abandonment becomes rebuke-worthy.

  ### (3) Verdict: A New Concept—"Emergent Dyadic Obligation" (≈200 words)
  No established term fully captures this. I propose **emergent dyadic obligation** (EDO). Definition: *A moral claim arising between two agents when their unscripted, interdependent actions fuse into a single precarious task-body, making each person’s continued participation non-volitional for the other.*  
  **Why it fits**:  
  - **Dyadic**: It’s strictly pairwise (unlike norms).  
  - **Emergent**: Obligation crystallizes *through* action, not prior agreement (unlike contracts).  
  - **Obligation**: Explains the "owed" feeling and betrayal intensity—ceasing participation physically endangers the other.  
  - **Dividing line**: EDO arises when (a) actions are *physically* interdependent (wardrobe weight-sharing), (b) adjustments are *continuous and unspoken*, and (c) disengagement *directly threatens bodily/serious practical harm*. At the gate, interdependence is cognitive (timing) not physical; harm is frustration, not injury. Tidying the van becomes EDO only when tasks (e.g., lifting heavy boxes) meet (a)-(c).

  ### (4) Boundary-Testing Cases (≈100 words)  
  - **EDO Present**: Two firefighters passing buckets up a ladder during a blaze. If one walks away mid-chain, the other shouts "you can’t leave me like this!"—betrayal stems from fused bodily risk.  
  - **EDO Absent**: Two shoppers colliding carts in an aisle, then maneuvering around each other with muttered "sorrys". Reliance exists, but no fused task-body or harm beyond annoyance; walking away draws no moral rebuke.
