prompt: |-
  I'm a software engineer with no formal background in philosophy, and I've been noticing a pattern in workplace communication — in standups, incident reviews, vendor negotiations — that I'd like a name for, if one exists. The configuration is this: a person makes only statements that are literally true, but selects and orders them so that the listener comes away believing something false, and the false belief is clearly the point, not an accident. A couple of instances. At a stakeholder review last quarter, someone asked whether we had fixed a particular flaky test, and the engineer on it answered that the test hadn't failed since Tuesday. True — because the test had been disabled and skipped since Tuesday. When I asked our release manager whether we were on track for the deadline, she said all critical-path tickets were closed. Also true — the remaining ones had been reclassified as non-critical the previous afternoon. In both cases the answer was engineered: had the speaker said the false thing outright, it would have been a lie; had they said nothing, it would have been evasion. Instead they said something true, chosen precisely for the false thing a reasonable listener would infer from it in context.

  I want to be clear that this isn't the same as the more familiar moves around it. It's not ordinary vagueness or spin, because every sentence uttered is true, on-point, and informative at face value; the listener isn't left to guess from a non-answer. And I don't think it's plain deception by omission, because the speaker isn't just staying silent about the crucial fact — they make positive assertions, and those assertions do the deceptive work; the omitted fact just makes the true assertions mean the opposite of what they appear to mean. There's also a distinctive aftermath: when challenged, the speaker retreats to "everything I said was true," and it's oddly hard to pin down exactly what they did wrong in that moment, even though everyone in the room feels that something was.

  So my questions are these. Does this configuration have an established name, either in philosophy or in ordinary language that I've simply never encountered? Is there any settled position on whether it's morally the same as lying, worse, or meaningfully different — and where exactly does the wrongness live: in the original utterance, in the expectation the speaker exploits, or only in the later refusal to own the inferred conclusion ("I never said the test was passing")? I'm also curious about the edges: does it still count when the speaker didn't specifically intend the false reading but obviously should have known how it would land, and does it matter whether the victim asked a direct question versus the statement being volunteered? Please don't just give me a label — I'd like the concept properly carved out, with the boundary cases, and if no established term covers it, tell me that honestly and propose one.
reasoning: |-
  Okay, the user is a software engineer who's observed a specific deceptive communication pattern at work. They describe situations where someone says something technically true but leads the listener to a false conclusion. The examples given are pretty clear: an engineer implying a test was fixed when it was actually disabled, and a release manager implying deadlines were met by reclassifying tickets.

  Hmm, the user wants to know if there's a name for this. They've already ruled out lying, omission, vagueness, and spin. The key elements are: literally true statements, selective presentation to create false belief, intentional deception, and defensive retreat to literal truth when challenged.

  First thought: this feels like paltering, where you use truthful statements to mislead. But paltering is often associated with negotiations, and the user's examples are broader. Then there's equivocation, but that's more about ambiguous words rather than selective truths. 

  The user's really sharp about the nuances - they note how the deception comes from what reasonable listeners infer, not from the statements themselves. The aftermath detail where speakers hide behind "but I told the truth" is particularly interesting. That's the telltale sign of bad faith communication.

  Morally... this is tricky. It's clearly deceptive, but not a direct lie. Philosophers like Kant would hate it because it violates the spirit of truth-telling. Consequentialists might judge by the harm caused. The speaker is exploiting conversational norms - that's where the wrongness lives. They're weaponizing Grice's cooperative principle.

  Boundary cases matter too. What if the speaker didn't intend to deceive but should've known? That's negligence. Volunteered vs requested statements? Both can be deceptive, but answering direct questions this way feels more culpable.

  The user's frustration is palpable. They want to call out this behavior properly in tech environments. Naming it gives power. "Inferential deception" or "implicature denial" might work, though no perfect term exists. The proposed "truth-lamping" is vivid - like truth-shaped landmines.

  Most importantly, the user needs tools to combat this. Highlighting the pattern, demanding full context, pointing out violated conversational maxims. Naming it "truth-lamping" could actually help change workplace culture when explained properly.
answer: |-
  This pattern absolutely has a name in philosophy and linguistics, though it's more commonly discussed in specific contexts like law or politics. The most precise term for the **core mechanism** is **exploiting conversational implicature** or engaging in **misleading implicature**. However, the entire *behavioral pattern* you describe – the act, the intent, the defense, and the discomfort – is often called **paltering**.

  Here's the breakdown, carving out the concept as requested:

  1.  **The Core Mechanism: Exploiting Conversational Implicature (Gricean Maxims)**
      *   Philosopher H.P. Grice proposed that communication relies on a Cooperative Principle: participants assume each other is being truthful, informative, relevant, and clear.
      *   **Conversational implicature** is the *implied meaning* that arises from this cooperation, beyond the literal words. We constantly infer meaning based on context and expectations.
      *   **Example:** If you ask, "Is there any coffee?" and I say, "The pot is empty," I *implicate* "No, there is no coffee." I didn't say "no," but a cooperative speaker would only mention the empty pot if it meant no coffee was available.
      *   **The Exploitation:** In your examples, the speaker is deliberately violating Grice's Maxim of **Quantity** (be as informative as required) and **Relation** (be relevant). They provide *technically* true information that is *deliberately insufficient* or *misleadingly relevant*, knowing the listener will fill the gap with a specific, false implicature. The literal truth acts as a shield.

  2.  **The Established Term for the Behavior: Paltering**
      *   **Definition:** Paltering is the active use of truthful statements to create a false or misleading impression. It involves *selecting* and *presenting* true facts in a way designed to lead the listener to an incorrect conclusion.
      *   **Characteristics of Paltering:**
          *   **Literal Truth:** Every individual statement is verifiably true.
          *   **Intent to Mislead:** The *purpose* is to induce a false belief.
          *   **Exploitation of Implicature:** Relies on the listener drawing the "obvious" (but false) inference from the partial truth.
          *   **Active Deception:** It's not just omission; it's strategically using truth as a tool for deception.
          *   **Defensive Plausibility:** Allows the speaker to retreat to literal truth ("I said the test hadn't failed... which is true!") when challenged, creating the awkward aftermath you describe.

  3.  **Why It's Not Just Lying, Omission, Vagueness, or Spin:**
      *   **Lying:** Involves making a statement *known* to be false. Paltering uses true statements.
      *   **Deception by Omission:** Involves *withholding* crucial information. Paltering involves *actively making statements* that are true but misleading. The omission is *covered* by the deceptive statement. It's omission *via* misleading assertion.
      *   **Vagueness/Ambiguity:** Relies on unclear language. Paltering uses clear, specific, literal truths. The deception is in the *implication*, not the utterance.
      *   **Spin:** Involves emphasizing favorable aspects and downplaying negatives, often using subjective language. Paltering uses objective facts strategically to create a *specific false belief*, not just a rosier picture.

  4.  **Moral Status: Why is it Wrong?**
      *   **Morally Equivalent to Lying (for most philosophers):** While technically distinct, the *intent to deceive* and the *resulting false belief* are identical to lying. The speaker aims for the listener to believe something false and engineers their communication to achieve that.
      *   **The Wrongness Lives In:**
          *   **The Intent:** The deliberate choice to cause a false belief.
          *   **The Exploitation:** Violating the fundamental cooperative norms of communication (Grice's Maxims) that enable trust and efficient exchange. This betrayal of conversational trust is key.
          *   **The Bad Faith:** The speaker benefits from the listener's reasonable inference while planning to deny responsibility for it later ("I never *said* that...").
          *   **The Outcome:** The listener is deceived, often leading to poor decisions (relying on a broken test, missing a real deadline).
      *   **Is it Worse?** Some argue it's *more* manipulative than a direct lie because it weaponizes the listener's own reasoning and trust in cooperation. The defensive retreat adds a layer of dishonesty about the dishonesty. Others argue a direct lie is a clearer, more severe breach. Most agree it's seriously unethical.

  5.  **Boundary Cases:**
      *   **Intent:**
          *   **Clear Intent (Core Case):** Speaker specifically intends the false inference (e.g., "I want them to think the test is fixed").
          *   **Reckless Indifference/Willful Ignorance:** Speaker doesn't *specifically* intend that inference but knows it's the overwhelmingly likely interpretation by a reasonable person and proceeds anyway. **This is still paltering and morally wrong.** The speaker has a duty to consider how their words will be understood, especially when answering direct questions. Claiming they "didn't intend it" in this scenario is usually disingenuous.
          *   **Genuine Carelessness:** Speaker doesn't realize the implication. This might be negligence or poor communication, but it lacks the *intentional deception* core to paltering. It's still bad, but different.
      *   **Direct Question vs. Volunteered:**
          *   **Direct Question:** Significantly strengthens the deception and the wrongness. The speaker is actively responding to a request for information and deliberately providing a misleading answer. This clearly violates the Maxim of Quantity and Relation. The duty to be fully informative is highest here.
          *   **Volunteered Statement:** Still deceptive and unethical paltering if the intent is to create a false belief. However, the speaker might argue they weren't obligated to speak at all. This doesn't excuse the deception *in* the statement they chose to make, but the context might lessen the perceived duty compared to answering a direct query.
      *   **Plausible Deniability/Reasonableness:** Is the false inference the *only* reasonable one? If the listener jumps to an unwarranted conclusion the speaker couldn't anticipate, it's not paltering. Paltering relies on exploiting a *reasonable*, predictable inference in the context.

  **Conclusion:**

  *   **Established Name:** **Paltering** is the best-established term for the *behavior* you describe – using truthful statements to actively mislead by exploiting expected inferences.
  *   **Core Mechanism:** **Exploitation of Conversational Implicature** (violating Grice's Cooperative Principle, especially Quantity and Relation).
  *   **Moral Status:** Widely considered **morally equivalent to lying** due to the identical intent to deceive and outcome. The wrongness lies in the deceptive intent, the exploitation of communicative trust, and the ensuing false belief.
  *   **Boundaries:** Requires intent to deceive (or reckless disregard for the obvious inference) and relies on the false inference being reasonable in context. Direct questions heighten the obligation and culpability.

  **Proposal if Paltering Feels Too Narrow (Though it Fits Well):**

  If "paltering" feels too specific to negotiation contexts where it's often studied, a more descriptive term capturing the "truth bomb that blows up into a lie" aspect you keenly observe is: **Truth-Lamping** (implying it's a truth-shaped landmine) or **Implicature Denial**. However, **paltering** is the recognized term in ethics and communication studies for this precise deceptive tactic. Understanding it as the **exploitation of conversational implicature with the defense of literal truth** provides the precise conceptual carving you seek. This pattern is corrosive to trust in precisely the way you've experienced – it leaves everyone feeling deceived but struggling to point to a single false word. Naming it "paltering" or "misleading implicature" gives you the tool to call it out directly.
