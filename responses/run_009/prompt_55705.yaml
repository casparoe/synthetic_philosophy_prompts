  ### Application to Cases

  **Case 1: Default-risk model for credit line increases**

     - Protected attributes: NOT available -> Step 0: we cannot measure group fairness. 
          - Action: Check overall model performance (calibration, accuracy) and then **ESCALATE TO LEGAL/COMPLIANCE**.
          - Why? Because we cannot assess disparate impact. In a regulated domain like credit, this might be illegal.
          - This might make the PM unhappy because we are blocking the model until legal clears it or until we get the data.

  **Case 2: Fraud model**

     - Protected attributes: available -> proceed.
     - Model output: continuous score -> we can set thresholds.
     - Primary harm:
          - FP: freezing a legitimate account -> harm to the customer (inconvenience, maybe financial loss if they can't access funds when needed).
          - FN: not freezing a fraudulent account -> harm to the customer (loss of money) and to the company.
     - From the customer's perspective, both are harmful. So we might care about both. 
     - We choose **Equalized Odds** (equal TPR and equal FPR) to ensure that no group experiences more FPs (unnecessary freezes) or more FNs (missed fraud).

     - Trade-off: 
          - We might break calibration: the risk scores might not be well calibrated by group. 
          - Also, the actual fraud rate among the frozen accounts (PPV) and among the not-frozen accounts (NPV) might differ by group. 
          - But we are willing to accept that to control both types of errors.

     - How to do it in practice? 
          - We can adjust the threshold for each group to achieve equal TPR and equal FPR? But that's two constraints. Usually, we choose one threshold for all groups and hope that the rates are similar. If not, we might need to train a model that specifically optimizes for equalized odds, or do post-processing.

     - In the one-hour meeting: 
          - We can compute the TPR and FPR by group at the current threshold. If they are within an acceptable range (e.g., difference < 10%), then we are good. 
          - If not, we might need to change the threshold or the model.

     - This might make the PM unhappy because it might reduce overall fraud catch rate or increase false freezes.

  **Case 3: Resume screener**

     - Protected attributes: available.
     - Model output: ranking (or score that is used for ranking).
     - Selection: we take the top 10% for interviews.
     - Primary fairness concern: we want the interview pool to be diverse, so we care about the representation of groups in the top 10%.
     - Choose **Demographic Parity** in the top 10%: the proportion of each group in the selected set should be close to their proportion in the applicant pool.

     - Trade-off: 
          - If the distribution of qualifications (as per the resume) differs by group, then forcing DP might mean we are not selecting based solely on merit. We might be excluding more qualified candidates from an overrepresented group and including less qualified ones from an underrepresented group. This might reduce the quality of the interview pool.

     - How to do it: 
          - We can adjust the ranking to meet the DP constraint by group? But that's a form of affirmative action. 
          - Alternatively, we can set group-specific thresholds to meet the desired representation.

     - This is a values call: the company must decide if it values diversity over pure merit in the interview stage. We should probably escalate to HR and legal to get a policy.

     - This will likely make the PM unhappy because it might force a change in the ranking.

  ### The Procedure as a Checklist

  We'll now write the procedure as an ordered list of questions with paths.

  **0. Group Fairness Feasibility**
     - Q0: Can we measure protected attributes for groups of concern? (Yes/No)
        - If No: 
            - Document overall model performance (accuracy, calibration, etc.).
            - **Action: ESCALATE TO LEGAL/COMPLIANCE**.
            - End.
        - If Yes: Proceed.

  **1. Model Output**
     - Q1: What is the model output type?
          - A: Continuous score (or probability) that can be thresholded -> go to 2.
          - B: Binary decision (already thresholded) -> go to 2 (because we can still choose to change the threshold? But the model might be already in production with this threshold. However, for fairness, we might change it. So we treat it as continuous score with a current threshold.)
          - C: Ranking -> go to 5.

     Actually, we can handle binary as a special case of continuous with a fixed threshold. So:

     - For A and B: go to 2.
     - For C: go to 5.

  **2. Binary Decision (or continuous score with threshold)**
     - Q2: What is the primary fairness concern? (Choose one)
          - A: Avoiding disproportionate harm from false positives (FP) to the individual. [Example: FP = denying benefit to a deserving individual] -> then we care about **False Positive Rate (FPR)**. We want **equal FPR**.
          - B: Avoiding disproportionate harm from false negatives (FN) to the individual. [Example: FN = granting benefit to an undeserving individual who then gets harmed (e.g., debt they cannot repay) OR in fraud: FN = not freezing a fraudulent account, leading to customer loss] -> then we care about **False Negative Rate (FNR)**, which is 1-TPR. We want **equal TPR**.
          - C: Avoiding both types of harm equally and we are willing to give up calibration -> then we want **Equalized Odds (equal TPR and equal FPR)**.
          - D: We want the approval/selection rate to be fair (demographic parity) -> then we want **equal selection rate (Demographic Parity)**.

     - Then go to 3.

  **3. Trade-off Explanation and Red Flags**
     - For the chosen criterion in 2, explain the trade-off and check for red flags:

        - If **equal FPR**:
            - Trade-off: If base rates differ, then equal FPR might lead to unequal FNR. This means one group might have more false negatives (e.g., more fraud missed or more defaults approved) than another.
            - Red flag: If the base rate is very different, the group with higher risk might have a much higher FNR, leading to more harm from FN in that group or more financial loss.
            - Check: Compute FPR by group at the current threshold. If the difference is > X% (e.g., 10%), then we need to adjust the threshold for one group to equalize FPR. But note: this might require a lower threshold for one group and a higher for another, which might be illegal in some contexts (like credit) -> escalate to legal.

        - If **equal TPR**:
            - Trade-off: If base rates differ, then equal TPR might lead to unequal FPR. This means one group might have more false positives (e.g., more legitimate accounts frozen or more creditworthy individuals denied) than another.
            - Red flag: If the base rate is very different, the group with lower risk might have a much higher FPR, leading to more harm from FP in that group.
            - Check: Compute TPR by group. If the difference > X%, adjust threshold, but again be cautious of legality.

        - If **Equalized Odds**:
            - Trade-off: We might break calibration. The risk scores will not be interpretable as probabilities by group. Also, if base rates differ, then the actual risk in the approved/denied groups will differ by group.
            - Red flag: If base rates are very different, then the group with higher base rate will have a higher proportion of approved who are risky (in a benefit-granting model) -> might lead to more harm in that group? 
            - Check: Compute TPR and FPR by group. If either differs by > X%, we need to adjust the model or thresholds. But note: we might not be able to achieve both with one threshold per group -> might require post-processing.

        - If **Demographic Parity**:
            - Trade-off: If base rates differ, then we might approve more unqualified individuals in one group and deny more qualified in another. This might reduce overall accuracy and lead to financial loss.
            - Red flag: If base rates are very different, then forcing DP might require extreme threshold adjustments.
            - Check: Compute selection rate by group. If the difference > X%, adjust threshold to meet DP. But in regulated domains, this might be illegal -> escalate to legal.

     - Then go to 4.

  **4. Action for Binary Decision**
     - If the current model meets the chosen criterion (within an acceptable margin, e.g., 10% relative difference), then approve.
     - If not, can we adjust the threshold to meet the criterion without breaking the business case?
          - If yes, then recommend threshold adjustment and approve.
          - If no, then we need to improve the model or change the criterion -> go to 6.

  **5. Ranking**
     - Q5: How is the ranking used?
          - A: We select a fixed number or percentage (top K) -> then we care about **Demographic Parity in the selected set**.
          - B: We use the ranking for prioritization without a fixed cutoff -> then this is complex. We might care about the entire curve. We can check if the AUC is similar by group and if the error rates at various thresholds are not too different. But this is judgment-based. We might require that for any threshold, the FPR and TPR do not differ by more than Y. Or we might use a fairness metric like average rank by group. If the disparity is too large, we might need to use a fairness-aware ranking algorithm. -> This might be beyond the scope, so **ESCALATE to HR and legal for policy**.

     - For A: 
          - Trade-off: If the groups have different distributions of the quality being ranked, then DP might force us to select less qualified candidates from some groups.
          - Check: Compute the proportion of each group in the top K. If it is not within 80% of the proportion in the applicant pool (the 80% rule for disparate impact), then we have a red flag.
          - Action: If the disparity is too large, we might need to adjust the ranking (e.g., by group-specific thresholds or by re-ranking) to meet the DP goal. This is a values call -> **ESCALATE to HR and legal**.

  **6. When we cannot meet the criterion without unacceptable trade-offs**
     - Options: 
          - Choose a different fairness criterion.
          - Improve the model (e.g., collect more data, add features, use fairness-aware training).
          - Accept the disparity and document, but this might be legally risky -> **ESCALATE to legal**.

  **7. Judgment Calls**
     - The choice of primary fairness concern (Step 2) is a judgment call. We are not qualified to make it alone -> we should involve the PM and legal/ethics committee.
     - The acceptable margin (e.g., 10%) is arbitrary and should be set by policy.
     - In regulated domains (credit, hiring), we might be bound by law (e.g., ECOA for credit, Title VII for hiring). So we should always involve legal.

  ### Final Note

  The procedure is a checklist to structure the conversation and force consideration of trade-offs. It will not make the decision for you, but it will highlight the issues and when to escalate.
answer: |-
  Here's a practical, step-by-step procedure you can run in an hour, designed to cut through theoretical debates and force concrete decisions. It includes red flags, trade-offs, and judgment calls – with applications to your three cases.

  ---

  ### **Fairness Review Checklist**  
  *Run this in your 1-hour meeting. Document answers.*

  #### **Step 0: Pre-Meeting Prep (5 mins)**  
  - **What to do**: Pull confusion matrices (train/val/test) and overall performance metrics.  
  - **Red flag**: If protected attributes (gender, race, age) are unavailable *and* the model impacts regulated decisions (credit, hiring) → **ESCALATE TO LEGAL IMMEDIATELY**.  
    *Why?* You can't audit disparate impact without protected data. Using proxies (e.g., zip code) is legally risky.

  #### **Step 1: Define the Decision & Harm (10 mins)**  
  Ask the PM:  
  1. **"Who is affected by this model's decision?"**  
     - *e.g., Customers applying for credit, job applicants.*  
  2. **"What is the *concrete harm* if the model is wrong?"**  
     - **False Positive (FP) harm**: *e.g., Legitimate customer's account frozen, qualified candidate rejected.*  
     - **False Negative (FN) harm**: *e.g., Fraudster not caught, high-risk borrower approved.*  
  3. **"Is this a thresholded decision (approve/deny) or ranking (top 10%)?"**  

  #### **Step 2: Pick Your Priority (15 mins)**  
  *Based on Step 1, choose **one** primary fairness goal. Trade-offs are unavoidable.*  

  | **If the worst harm is...** | **Fairness Criterion** | **Trade-off (Plain English)** | **When Base Rates Differ?** |
  |-----------------------------|------------------------|--------------------------------|------------------------------|
  | **FP** (e.g., denying opportunities) | **Equal FPR** (False Positive Rate) | "We ensure Group A isn't disproportionately denied when they *should* qualify. But Group B may see more bad approvals (FNs), hurting system trust." | ✅ (FNs may concentrate in high-risk groups) |
  | **FN** (e.g., missing fraud) | **Equal FNR** (False Negative Rate) | "We ensure Group A isn't disproportionately exposed to harm (e.g., fraud). But Group B may see more false alarms (FPs), causing frustration." | ✅ (FPs may concentrate in low-risk groups) |
  | **Approval rates must be equal** (e.g., hiring) | **Demographic Parity** | "We force equal selection rates. If Group A has higher base risk, we must approve riskier applicants or deny safer ones in Group B." | ❗️High trade-off (sacrifices accuracy) |
  | **Score reliability matters most** (e.g., credit limits) | **Calibration** | "A score of 70% means 70% risk for all groups. But error rates (FPR/FNR) will differ, disadvantaging high-risk groups." | ✅ (Error rates diverge) |

  **Judgment call**: If the PM insists on multiple goals, say:  
  > *"The 'impossibility theorem' means we can't have calibration + equal FPR + equal FNR together. We must pick one. What's the *legally enforceable* harm we must avoid?"*

  #### **Step 3: Audit Feasibility (15 mins)**  
  *Check if your priority is achievable:*  
  - **Compute**: Group-wise confusion matrices.  
  - **Ask**:  
    - "Are base rates (>5% difference) or score distributions meaningfully different between groups?"  
    - "Can we adjust thresholds per group? (Often illegal in credit!)"  

  | **Criterion** | **Red Flag** | **Action** |
  |---------------|--------------|------------|
  | **Equal FPR/FNR** | >10% gap in FPR/FNR between groups | Adjust threshold for worst-off group. If accuracy drops >5%, model is flawed → **NO GO**. |
  | **Demographic Parity** | Base rates differ >10% | Forcing equal approval will harm accuracy → **ESCALATE TO LEGAL**. |
  | **Calibration** | Scores miscalibrated for any group (e.g., 50% score = 70% actual risk) | Recalibrate model. If persistent, **NO GO**. |

  #### **Step 4: Final Call (5 mins)**  
  - **Approve if**:  
    (a) Priority criterion gap <10% after adjustments, AND  
    (b) No legal red flags.  
  - **NO GO if**:  
    (a) Trade-off violates legal requirements (e.g., forcing DP in credit), OR  
    (b) Audit shows >10% disparity and no fix exists.  
  - **Escalate to legal if**:  
    (a) Protected data missing (Step 0), OR  
    (b) Base rates differ and PM insists on Demographic Parity.

  ---

  ### **Applied to Your Cases**  
  *Assumptions: US jurisdiction, protected attributes = race/age/sex.*

  #### **Case 1: Default-Risk Model (Credit Line Increase)**  
  - **Step 0**: Protected data **UNAVAILABLE** → **ESCALATE TO LEGAL**.  
    *Why?* Regulated under ECOA. Cannot prove compliance without group analysis.  
  - **Step 1**:  
    - Harm: **FP** = deny creditworthy customer (individual harm). **FN** = approve risky borrower (business harm).  
    - Thresholded decision.  
  - **Step 2**: **Equal FPR** (avoid FP harm).  
  - **Step 3**: Audit impossible (no protected data) → **BLOCK MODEL UNTIL DATA ACCESS APPROVED**.  
  - **PM unhappiness**: High. Solution: Legal must approve proxy attributes or buy data.

  #### **Case 2: Fraud Model (Account Freeze)**  
  - **Step 0**: Protected data available.  
  - **Step 1**:  
    - Harm: **FP** = freeze innocent customer (high harm). **FN** = miss fraud (harm to customer + business).  
    - Thresholded decision.  
  - **Step 2**: **Equal FPR** (avoid FP harm).  
  - **Step 3**:  
    - Audit shows: Group A FPR = 8%, Group B FPR = 15% (gap >10%).  
    - Adjust threshold for Group B to reduce FPR. New: Group A FPR=10%, Group B FPR=11%.  
    - FN rates: Group A FNR=20% → Group B FNR=25% (acceptable trade-off).  
  - **Approve** with threshold adjustment.  
  - **PM unhappiness**: Medium (fraud catch rate drops slightly).

  #### **Case 3: Resume Screener (Hiring)**  
  - **Step 0**: Protected data available.  
  - **Step 1**:  
    - Harm: **FP** = reject qualified candidate (high harm). **FN** = interview unqualified candidate (low harm).  
    - Ranking (top 20% get interviews).  
  - **Step 2**: **Demographic Parity in top 20%** (avoid disproportionate exclusion).  
  - **Step 3**:  
    - Base rates: Proportion of qualified candidates differs by group (Group A: 40%, Group B: 25%).  
    - Forcing DP would mean selecting less-qualified Group B candidates → **ESCALATE TO LEGAL/HR**.  
    - *Alternative*: Use **Equal FPR** (ensure qualified candidates aren't missed). Audit shows FPR gap <5% → **Approve**.  
  - **PM unhappiness**: High if forced to DP. Compromise: Equal FPR + HR oversight.

  ---

  ### **Key Takeaways**  
  - **Where impossibility theorems don't bite**:  
    - Rankings (no fixed threshold: focus on equal FPR at interview cutoff).  
    - Same base rates (all criteria achievable).  
  - **Judgment calls disguised as checklists**:  
    - Choosing the "worst harm" (Step 2) is subjective. Involve legal early.  
    - The 10% disparity threshold is arbitrary but practical.  
  - **When to say NO**:  
    - No protected data in regulated contexts.  
    - Demographic Parity with differing base rates.  
  - **Tooling**: Automate confusion matrix audits (Python: `fairlearn`, `AIF360`).  
  - **Script for PMs**: *"Fairness isn't free. If we prioritize X, we must accept Y. What’s our defensible trade-off?"*
