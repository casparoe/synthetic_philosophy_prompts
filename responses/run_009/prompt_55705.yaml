  We are going to design a procedure that the engineer can run in about an hour per model. The procedure will be a decision tree of questions, leading to a recommended fairness criterion (or a NO/escalation) and an explanation of the trade-offs.

  The key fairness criteria we consider (with plain English explanations) are:
  1. **Demographic Parity (DP)**: The proportion of positive predictions is the same across groups. This means that the same percentage of each group gets a loan approved, a credit line increase, etc. But this might force you to set different thresholds for different groups if one group has a higher base rate of the positive outcome (like defaulting less). Trade-off: If the base rates differ, DP might require you to approve unqualified individuals in one group or deny qualified individuals in another.

  2. **Equal Opportunity (EO)**: Equal true positive rates (TPR) across groups. This means that the model is equally good at identifying the "good" cases (like people who will repay) in each group. Trade-off: If base rates differ, then the false positive rates (FPR) might end up being different, meaning one group might get more false positives (e.g., more people who are denied credit but would have repaid).

  3. **Predictive Parity (PP)**: Equal positive predictive value (PPV) across groups. This means that among those who are predicted to be positive (e.g., approved for credit), the same proportion in each group actually is positive (e.g., repays). Trade-off: This might lead to different thresholds and thus different TPRs and FPRs. If base rates differ, then to have the same PPV, the model must be more selective for the group with a lower base rate.

  4. **Equal Accuracy (Acc)**: The overall accuracy is the same across groups. But this might hide disparities in the types of errors (e.g., more false positives for one group, more false negatives for another).

  The impossibility result (from Kleinberg, Mullainathan, Chouldechova, etc.) says that you cannot simultaneously satisfy:
  - Calibration (which is similar to PP): The predicted probability matches the actual probability of the event for each group.
  - Equal TPR (Equal Opportunity)
  - Equal FPR (which, with equal TPR, would imply equal error rates)

  And also that DP is incompatible with calibration if base rates differ.

  But note: if base rates are the same, then some of these become compatible.

  We'll structure the procedure as a series of questions:

  1. **What is the model's output?** 
     - (a) A probability score (or a continuous risk score that can be thresholded) -> go to 2
     - (b) A binary decision (already thresholded) -> go to 3
     - (c) A ranking (like in the resume screener) -> go to 4

  2. **Can you set the threshold?**
     - (a) Yes -> then we can adjust for fairness -> go to 5
     - (b) No -> then we have to use the existing binary decision -> treat as binary and go to 3

  3. **For binary decisions: What is the primary concern?** (This is a judgment call, but we'll guide with common concerns)
