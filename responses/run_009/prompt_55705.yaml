     - (b) We don't want to disproportionately expose a group to harm (e.g., freezing accounts, denying service) when they shouldn't -> then we care about false positives -> so we might want Predictive Parity (PPV) or Equal FPR -> go to 7
     - (c) We are equally concerned about both types of errors -> then maybe Accuracy, but note that might not be sufficient -> go to 8

