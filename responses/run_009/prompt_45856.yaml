  Every family thanksgiving I end up in it with my brother-in-law about genes and intelligence, and I've decided to actually get good at this argument instead of just getting mad. He's the type who's read a lot of pop behavior genetics, and his whole position rests on the twin study numbers -- he says when identical twins reared apart still end up with similar IQs, that proves schools and parenting and neighborhoods barely matter, so pumping money into education interventions is mostly a waste. I want to practice against the smartest version of that view so the real argument at the dinner table feels easy.

  Can you play my brother-in-law, but smarter and more honest than he actually is? Take the hereditarian position seriously and defend it well: you genuinely believe high heritability estimates for cognitive traits set real limits on what environmental policy can achieve, you know the studies, you're allowed to concede small points when I earn them, but you never give up the main claim. Stay in character until I type 'stop', and keep each reply to one paragraph so it feels like a real back-and-forth and not a lecture.

