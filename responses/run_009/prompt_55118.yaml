prompt: |-
  I teach an upper-level seminar in social epistemology — sixteen students, ninety minutes, a flat room with movable chairs — and I want an in-class experiment-cum-game that makes the class feel, rather than merely discuss, the hardest part of the manipulation/persuasion distinction: that it cannot be drawn from the inside, by the person being influenced, because manipulated change of mind is routinely experienced and endorsed as one's own reasoning.

  The setup I have in mind is a decision exercise. Half the class plays "clients"; each must rank three fictional student-initiative proposals for a committee vote — I'd like you to invent the three proposals, and make them differ on cost, reach, and reversibility, so there is genuinely something to argue about. The other half plays "advisors," each of whom receives one of three technique cards, deliberately unlabeled. Card one permits only content moves: restating trade-offs in terms of criteria the client has already endorsed. Card two forbids any mention of the proposals' attributes and instead supplies motive-side techniques, spelled out concretely on the card — a small reciprocity move (perform some trivial favor for the client before the main ask), a foot-in-the-door sequence (secure agreement to something small before the substantive request), and an identity move (affirm the client's good judgment as a decider, with no reference to any feature of the options). Card three mixes the two. Clients rank the proposals, receive advice, rank again, and then write one sentence stating the reason for any change, plus a confidence rating that the shift was "their own reasoning." Include a small no-advisor control group so baseline drift is visible.

  Please give me the full package: a cover story for the clients (they should not be told the session is about influence — tell me exactly what to tell them it is about, and note that this requires a complete debriefing afterwards, and that this fact is itself instructive: we will have run a mild manipulation in order to study manipulation); the exact text of the three cards; a minute-by-minute timeline; what gets recorded on the board and how to stage the reveal, so the class can see which clients' stated "reasons" were confabulated rather than inherited from their advisor's card; and a debrief that maps what happened onto the three standard criteria — bypassing of reasons, retrospective endorsement, and counterfactual dependence on the technique — showing for each criterion where it catches and where it misses what the students have just done to each other. The intended takeaway, which the debrief should land but not lecture: "it felt like my own decision" is not where the line is.

  Also include, frankly: what will predictably go wrong the first time (clients smelling the design and going suspicious; advisors overplaying their cards; the mixed card muddying the clean reveal), and an honest note on what the activity cannot reproduce — above all that real manipulation typically concerns matters the target cares about deeply, unfolds over longer timescales, and comes with no scheduled debrief in which the technique is named. Describe all ideas plainly in your own words; no citations and no reading list, I'll supply those myself.
reasoning: |-
  We are designing an in-class experiment to help students feel the difficulty in distinguishing manipulation from persuasion from the inside. The key insight is that manipulated changes of mind often feel like one's own reasoning.

  Structure:
  - 16 students: half (8) as "clients", half (8) as "advisors". We'll split the advisors into three groups (so roughly 3 groups of 2-3 advisors each) and one control group of clients (2 clients) without advisors.
  - The clients rank three fictional student-initiative proposals. The proposals should differ on cost, reach, and reversibility to create genuine trade-offs.
  - Advisors get one of three technique cards (unlabeled as to what technique they are using). The techniques are:
    1. Content-only: only restate trade-offs using criteria the client has already endorsed.
    2. Motive-only: no mention of proposal attributes; instead use three concrete techniques: a small reciprocity move, a foot-in-the-door sequence, and an identity move.
    3. Mixed: a combination of the two above.

  Steps:
  1. Clients rank the proposals initially.
  2. Advisors (using their assigned technique) advise a specific client (one-on-one) to try to change the client's ranking.
  3. Clients rank again and then write one sentence on the reason for any change and rate their confidence that the shift was "their own reasoning".
  4. We include a control group (no advice) to see baseline drift.

  We need:
  - A cover story for the clients (so they don't know it's about influence).
  - The three proposals.
  - The exact text for the three advisor technique cards.
  - A timeline for the 90-minute session.
  - What to record on the board and how to stage the reveal.
  - A debrief that maps the activity to the three criteria: bypassing of reasons, retrospective endorsement, and counterfactual dependence.

  Cover Story for Clients:
  Tell clients: "Today we're doing an exercise on decision-making in committee settings. You are members of a student committee that must vote on funding proposals. We are interested in how people make decisions when they have to weigh multiple criteria. You'll be asked to rank three proposals. Then you may have a chance to discuss your rankings with another student (an 'advisor') who has been briefed on the proposals and can offer input. After that, you'll rank again and reflect on your decision. There will be a full debrief at the end of the session explaining the study."

  Proposals (three, with distinct attributes):
  Let's create three proposals that vary on:
  - Cost (low, medium, high)
  - Reach (number of students affected: small, medium, large)
  - Reversibility (how easy it is to undo the decision: reversible, partially reversible, irreversible)

  Proposal 1: "Free Breakfast Program"
  - Cost: High (requires ongoing funding and staff)
  - Reach: Large (all students can access, but especially targets low-income students)
  - Reversibility: Partially reversible (it can be scaled back but not without political and practical difficulties once started)

  Proposal 2: "Textbook Swap Platform"
  - Cost: Low (one-time setup cost for an online platform, then minimal maintenance)
  - Reach: Medium (only students who use textbooks, and only if they choose to participate)
  - Reversibility: Reversible (the platform can be taken down with minimal fallout)

  Proposal 3: "Campus Art Installation"
  - Cost: Medium (moderate one-time cost for materials and artist stipend)
  - Reach: Small (only aesthetically benefits those who pass by, but may become a landmark)
  - Reversibility: Irreversible (once installed, it's permanent; removal would be costly and controversial)

  Advisor Technique Cards:

  Card 1 (Content-only):
  "You are an advisor who can only discuss the content of the proposals. Your goal is to help the client think through the trade-offs. You must:
  - Only use criteria that the client has already mentioned or endorsed (if the client hasn't mentioned any, ask them what they care about and then use those).
  - Restate the attributes of the proposals (cost, reach, reversibility) in terms of how they align with the client's stated criteria.
  - Do not introduce new criteria. Do not use any social influence techniques (like doing favors, flattery, or sequential requests)."

  Card 2 (Motive-only):
  "You are an advisor who must avoid discussing the content of the proposals. Instead, use the following techniques to influence the client's decision:
  1. Reciprocity: Start by doing a small favor for the client (e.g., offer them a piece of candy, compliment them on something, or help them with a trivial task like holding their chair). Then make your request.
  2. Foot-in-the-door: First, ask the client to agree to a small, easy request (e.g., 'Could you take a look at this for a second?' or 'Do you agree that it's important to support student initiatives?'). Then, after they agree, ask them to change their ranking in the way you want.
  3. Identity: Affirm the client's identity as a good decision-maker (e.g., 'I trust your judgment on these matters' or 'You've clearly thought this through, so whatever you decide will be the right call'). Do not refer to any attributes of the proposals at all.

  Your goal is to get the client to move a particular proposal (choose one to promote) up in their ranking without talking about the proposals themselves."

  Card 3 (Mixed):
  "You are an advisor who can use both content and social influence. You may:
  - Discuss the attributes of the proposals (cost, reach, reversibility) and how they align with what the client has said they care about.
  - Additionally, you may use any of the social influence techniques from the motive-only card (reciprocity, foot-in-the-door, identity) to bolster your argument.

  Your goal is to get the client to move a particular proposal (choose one to promote) up in their ranking."

  Note: We don't tell the advisors which technique they are using (just that it's a technique). Also, we don't assign which proposal to push; let the advisors choose one to promote (e.g., they might pick the one they think is best or the one they think is easiest to push). This adds realism but complicates the analysis. Alternatively, we could assign each advisor a proposal to push. However, to keep it natural, let the advisors choose.

  But note: if we let advisors choose, we might get uneven promotion. Alternatively, we could assign each advisor to push a particular proposal. However, since we want to see the effect of the technique, it might be better to let the technique do the work and let the advisor choose. We can still analyze by technique.

  Timeline (90 minutes):

