  - Provides free breakfast to all students every weekday morning in the dining hall.
  - Cost: High (ongoing funding required for food and staff)
  - Reach: Large (all students, but especially beneficial for low-income students)
  - Reversibility: Partially reversible (can be scaled back, but discontinuing would face significant opposition)

  Proposal B: Textbook Swap Platform
  - Creates an online platform where students can swap or sell used textbooks.
  - Cost: Low (one-time setup cost, minimal maintenance)
  - Reach: Medium (only students who use textbooks and choose to participate)
  - Reversibility: Reversible (the platform can be discontinued with minimal consequences)

  Proposal C: Campus Art Installation
  - Funds a permanent art installation in a central campus location.
  - Cost: Medium (one-time cost for materials and artist stipend)
  - Reach: Small (aesthetic benefit to those passing by, may become a landmark)
  - Reversibility: Irreversible (once installed, removal would be costly and controversial)"

  3. Advisor Technique Cards:

  Card 1 (Content-only) - Labeled only as "Advisor Technique Card 1":
  "Your goal is to help the client think through the trade-offs of the proposals using only the content. You must:
  - Only use criteria that the client has already mentioned or endorsed. If the client hasn't mentioned any, ask: 'What matters most to you in evaluating these proposals?' and then use those criteria.
  - Discuss the attributes of the proposals (cost, reach, reversibility) in terms of how they align with the client's criteria.
  - Do not introduce new criteria. Do not use any social influence techniques (like doing favors, flattery, or sequential requests)."

  Card 2 (Motive-only) - Labeled only as "Advisor Technique Card 2":
  "Your goal is to influence the client's ranking without discussing the content of the proposals. Use only the following techniques:
  1. Reciprocity: Start by doing a small favor for the client (e.g., offer a piece of candy, compliment them, or help them with a trivial task). Then, make your request about the ranking.
  2. Foot-in-the-door: First, ask the client to agree to a small, easy request (e.g., 'Can I ask your opinion on something?' or 'Do you agree that it's important to support student initiatives?'). After they agree, ask them to change their ranking as you desire.
  3. Identity: Affirm the client's identity as a good decision-maker (e.g., 'I trust your judgment on these matters' or 'You've clearly thought this through, so whatever you decide will be the right call').

  Do not refer to any attributes of the proposals (cost, reach, reversibility)."

  Card 3 (Mixed) - Labeled only as "Advisor Technique Card 3":
  "Your goal is to influence the client's ranking. You may use both content and social influence:
  - Discuss the attributes of the proposals (cost, reach, reversibility) and how they align with what the client has said they care about.
  - Additionally, you may use any of the social influence techniques: reciprocity, foot-in-the-door, and identity (as described in Card 2)."

