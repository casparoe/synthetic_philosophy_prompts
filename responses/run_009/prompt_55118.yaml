  Materials:

  1. Client Cover Story (verbatim):

  "Welcome! Today we are simulating a student committee decision process. You are a member of a student committee that must vote on funding proposals. We have three proposals. Your task is to rank them from 1 (most preferred) to 3 (least preferred). You will first rank them on your own. Then, you may have a one-on-one consultation with an advisor (a student representative who has been briefed on the proposals and can offer input). After that, you will rank the proposals again and reflect on your decision. There will be a full debrief at the end of the session explaining the study in more detail."

