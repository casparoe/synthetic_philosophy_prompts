  20-25: Advisors prepare: read their card and decide which proposal to promote.

  25-35: Pair advisors with clients (each advisor with one client). 10 minutes for one-on-one advice.

  35-40: Clients fill out final ranking and reflection (reason and confidence). Recorders collect.

  40-50: Recorders write the final rankings, reasons, and confidence on the board.

  50-60: Reveal:
     - First, show the change in rankings for each client (without revealing techniques). Ask: "What patterns do you see?"
     - Then, reveal the advisor techniques: 
