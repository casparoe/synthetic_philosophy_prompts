  - Which proposal did you try to demote? (if any): [optional]

  6. Recorder Sheet:
  - Record for each client number: 
     Initial ranking (e.g., 1st: A, 2nd: B, 3rd: C)
     Final ranking
     Reason for change (if any)
     Confidence rating

  Timeline (minute-by-minute):

  0-5: Introduction to the whole class: Explain the committee simulation and assign roles (clients and advisors). Also, assign 2 clients to control and 2 advisors to be recorders.

  5-10: Distribute materials:
     - Clients: Proposals sheet and client form (with cover story at the top).
