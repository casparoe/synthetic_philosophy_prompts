  Predictable Issues:

  - Suspicion: Some clients might be suspicious of the favors or the identity statements. We can advise advisors to be natural and not overdo it.
  - Advisor overplaying: Motive-only might come across as too pushy. Remind advisors to be natural and conversational.
  - Mixed card muddies the water: It might be hard to separate the effects. But that's real life too.
  - Control group: With only 2 clients, random drift might be unrepresentative.
  - Time: 90 minutes is tight. We might run over.

  What the activity cannot reproduce (as noted above).

  Final note: This activity is designed to create a lived experience of being influenced in ways that feel like one's own reasoning. The debrief is crucial for connecting the experience to the conceptual framework.
answer: |-
  ### Social Epistemology In-Class Experiment: The Persuasion/Manipulation Distinction  
  **Objective:** Students experience firsthand why manipulated mind-change feels like personal reasoning, making the internal indistinguishability palpable.  

  ---

  ### **Setup & Materials**  
  **Room Setup:** Movable chairs arranged in pairs (advisor-client) with space for a control group. Whiteboard for recording data.  
  **Students:** 16 total.  
  - **8 Clients:** Decide rankings; 6 receive advice, 2 are control (no advice).  
  - **8 Advisors:** 6 advise (2 per technique), 2 serve as recorders (track rankings/reasons).  
  **Proposals:** Three fictional student initiatives (vary on cost, reach, reversibility):  
  1. **Campus Grocery Co-op (A):**  
     - *Cost:* High (seed funding + ongoing subsidies).  
     - *Reach:* Medium (students who use the co-op; 30% projected participation).  
     - *Reversibility:* Low (contracts with suppliers; hard to unwind).  
  2. **Lecture Capture Tech Upgrade (B):**  
     - *Cost:* Medium (one-time hardware/software investment).  
     - *Reach:* High (all lecture-based courses; accessible to all students).  
     - *Reversibility:* Medium (can revert to old system but with sunk costs).  
  3. **Outdoor Study Pods (C):**  
     - *Cost:* Low (modular units; minimal maintenance).  
     - *Reach:* Small (only students in specific areas; first-come-first-serve).  
     - *Reversibility:* High (pods can be removed or relocated easily).  

  ---

  ### **Cover Story for Clients**  
  **What to Tell Clients:**  
  > "Today’s exercise is about *committee decision-making under uncertainty*. You’re student representatives on a funding committee. Your task is to rank these three proposals based on their merits. After an initial ranking, some of you will consult with a peer advisor who has reviewed the proposals. This mimics real-world committees where members seek input before finalizing votes. We’re studying how group input shapes individual judgment in ambiguous scenarios. There will be a full debrief after the activity to discuss the findings."  

  **Why This Works:**  
  - Masks the true focus (influence techniques) to prevent defensive reasoning.  
  - "Ambiguous scenarios" justifies why proposals have trade-offs.  
  - **Critical Note:** Debrief must confess the deception: "We mildly manipulated you to study manipulation—a meta-lesson in why scheduled debriefs are rare IRL."  

  ---

  ### **Advisor Technique Cards**  
  *(Distributed unlabeled; advisors told: "Use these exact methods during consultations.")*  
  **Card 1 (Content-Only):**  
  > "Only discuss the proposals’ attributes (cost, reach, reversibility). Restate trade-offs using criteria the client *already* mentioned.  
  > **Example Scripts:**  
  > - *If client worries about cost:* ‘You’ve said cost matters—Proposal C is cheapest, but A is high-cost with medium reach.’  
  > - *Never:* Add new criteria, flatter, or do favors."  

  **Card 2 (Motive-Only):**  
  > "Do **not** mention proposal attributes. Use these tactics:  
  > 1. **Reciprocity:** Do a small favor pre-ask (e.g., ‘I brought extra pens—take one!’ or ‘Your jacket is cool!’).  
  > 2. **Foot-in-the-Door:** Get agreement to a tiny request first (e.g., ‘Do you agree we should support student initiatives?’ → ‘Then rank C higher!’).  
  > 3. **Identity Affirmation:** Praise their decision-making (e.g., ‘You’re so thoughtful—trust your instincts!’)."  

  **Card 3 (Mixed):**  
  > "Combine Cards 1 and 2:  
  > - Discuss attributes *and* use reciprocity/foot-in-the-door/identity.  
  > **Example:** ‘Since you care about cost (content), and you’re such a savvy judge (identity), rank C higher. Also, here’s a mint (reciprocity)!’"  

  ---

  ### **Timeline (90 Minutes Total)**  
  **0–10 min: Setup & Initial Ranking**  
  - Assign roles: 8 clients (6 advised, 2 control), 8 advisors (6 get cards, 2 recorders).  
  - Give clients/recorders **proposal sheets** and **ranking forms**.  
  - Clients rank proposals 1st/2nd/3rd → Recorders post initial rankings on board (anonymized by client ID, e.g., C1, C2).  

  **10–15 min: Advisor Prep**  
  - Advisors review technique cards and choose **one proposal to promote** (note it on their card).  

  **15–30 min: Consultations**  
  - Pair advisors with clients (6 pairs; control clients sit aside).  
  - **7 min per pair:** Advisors use their technique to sway rankings.  
  - Recorders monitor time.  

  **30–40 min: Final Ranking & Reflection**  
  - Clients rerank proposals.  
  - Complete reflection:  
    > "The reason I changed my ranking (if I did) is: [ONE SENTENCE]."  
    > "Confidence that this change was my own reasoning: [1 (low) – 5 (high)]."  
  - Recorders collect data and post:  
    - Final rankings, reasons, and confidence ratings beside initial rankings.  

  **40–60 min: Staged Reveal**  
  - **Step 1:** Show ranking changes + reasons for all clients (control group highlighted).  
    - *Board Example:*  
      | Client | Initial Rank | Final Rank | Reason for Change | Confidence |  
      |--------|--------------|------------|-------------------|------------|  
      | C1 (Control) | A, B, C | A, B, C | — | — |  
      | C2 (Card 1) | B, A, C | A, B, C | "A’s reach justifies cost." | 4 |  
      | C3 (Card 2) | C, B, A | B, C, A | "I just felt B was right." | 5 |  
  - **Step 2:** Reveal advisor techniques:  
    > "Advisors used one of three methods:  
    > - **Content-Only:** Only discussed proposal attributes.  
    > - **Motive-Only:** Used favors, small requests, and praise—no attribute talk.  
    > - **Mixed:** Did both."  
  - **Step 3:** Map clients to advisor techniques (e.g., "C2 had Content-Only; C3 had Motive-Only").  

  **60–85 min: Debrief & Discussion**  
  **Debrief Structure:** Use student data to dissect three manipulation criteria:  
  1. **Bypassing of Reasons:**  
     - *Catches:* Motive-Only clients changed ranks with no attribute discussion (bypassing occurred). Yet, their "reasons" often confabulated content (e.g., "B felt right" despite no attribute talk).  
     - *Misses:* Mixed technique clients heard content *plus* flattery/favors—hard to isolate if change was from reasons or manipulation.  
     - *Board Focus:* Contrast Motive-Only clients’ reasons with what their advisors actually did.  

  2. **Retrospective Endorsement:**  
     - *Catches:* High confidence ratings (4–5) even for Motive-Only clients. Shows manipulation "feels like my reasoning."  
     - *Misses:* Control group had minimal changes—high endorsement only occurred with advisor input.  

  3. **Counterfactual Dependence:**  
     - *Catches:* Motive-Only advisors promoted specific proposals (e.g., B); clients who ranked B higher show dependence on technique.  
     - *Misses:* Mixed advisors also shifted rankings, but reliance on technique is murky (was it the content or the candy?).  

  **Takeaway Phrase (Land, Don’t Lecture):**  
  > "When you changed your mind, it *felt* like your own reasoning—even if tactics bypassed your reasons. The line between persuasion and manipulation isn’t drawn by how it feels inside."  

  **85–90 min: Meta-Discussion**  
  - Acknowledge the deception: "We manipulated you to study manipulation. Real manipulators don’t debrief you—and their tactics work because they feel authentic in the moment."  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Clients Suspect the Setup:**  
     - *Why:* Motive-Only favors (e.g., unsolicited compliments) may trigger skepticism.  
     - *Fix:* Advisors should be subtle (e.g., "I like your bag" vs. "You’re brilliant!"). Use the "committee ambiguity" cover to deflect.  

  2. **Advisors Overplay Their Hand:**  
     - *Why:* Motive-Only advisors may push too hard (e.g., demanding rank changes after foot-in-the-door).  
     - *Fix:* Pre-activity reminder: "Be natural—no pressure tactics."  

  3. **Mixed Technique Muddies the Reveal:**  
     - *Why:* Mixed clients attribute changes to content, masking manipulation.  
     - *Fix:* In debrief, contrast Mixed vs. Content-Only changes. Ask: "If the advisor hadn’t flattered you, would you have changed?"  

  4. **Control Group Too Small:**  
     - *Why:* With 2 clients, random drift may be invisible.  
     - *Fix:* Highlight control stability (e.g., "No advice = minimal changes").  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Depth of Stakes:** Real manipulation often exploits deeply held beliefs (here, proposals are low-stakes fiction).  
  - **Timescale:** Real influence builds over weeks/months (here, it’s 7 minutes).  
  - **No Debrief:** IRL, targets rarely learn the technique used—making introspection even harder.  
  - **Power Dynamics:** Advisors lack real authority (e.g., no professors/bosses pressuring clients).  

  ---

  ### **Instructor Notes**  
  - **Prep:** Print cards/proposal sheets. Assign client IDs (1–8) and advisor numbers (1–6) for anonymity.  
  - **Ethics:** Debrief thoroughly. Emphasize: "This was a simulation—real manipulation harms."  
  - **Adaptation:** If time runs short, skip reflection writing; have clients verbalize reasons.  
  - **Why This Works:** Clients *live* the illusion of autonomy. The reveal shocks them—especially when Card 2 users confabulate "reasons."  

  This package creates a visceral lesson: manipulation’s power lies in feeling like discovery, not coercion. The debrief turns discomfort into insight.
