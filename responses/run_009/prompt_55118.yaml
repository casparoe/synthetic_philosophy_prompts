  - Initial Ranking: [ ] A, [ ] B, [ ] C (1st, 2nd, 3rd)
  - Final Ranking: [ ] A, [ ] B, [ ] C (1st, 2nd, 3rd)
  - The reason I changed my ranking (if I did) is because: _________________________
  - Confidence that any change was the result of my own reasoning? (1 = not at all, 5 = completely): [1] [2] [3] [4] [5]

