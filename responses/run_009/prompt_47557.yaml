prompt: |-
  so, context: im a software engineer at a bioinformatics startup — my day job is building the pipeline that clusters bacterial genomes into species-ish groups, which in practice means arguing about nucleotide identity cutoffs with wet-lab people — and on the side I host a tiny podcast where I talk to whoever will put up with me, alot of academics. next week's guest is an old-school evolutionary biologist who has spent his whole career defending Mayr's biological species concept — the idea that a species is a group of actually or potentially interbreeding natural populations, reproductively isolated from other such groups — as the real definition, not just one option on a menu. he thinks the phylogenetic-cladistics people are basically defining something else and just calling it a species out of habit. I want maybe eight to ten questions from you that actually go somewhere instead of just letting him restate his view for an hour. specifically I need at least one question about ring species like the Ensatina salamanders in California, where each neighbor interbreeds with the next but the two ends of the ring meet up and don't interbreed — so is that one species or two, and if he says one, does the same species name apply to two forms that can't breed with each other; at least one about bacteria and other asexual lineages, since I deal with those daily and the interbreeding criterion seems to do literally nothing there, and at least one about conservation — like whether the endangered species act needs there to be one right answer to what a species is, and whether his view can even give a law something usable. for every question, include the follow-up you'd ask keyed to the answer he's most likely to give — e.g. if he says bacteria are a special case and the concept just applies wherever sex applies, push back on what makes sex so special that the majority of organisms on the planet get filed under special case. please actually commit: pick the questions yourself, pick the follow-ups yourself, and tell me your reasoning for each choice inline, don't hand me a menu of options with pros and cons. and write the whole thing as continuous prose like an email — no bullet points, no numbered lists, no headings, no bold — because I read these off my phone in the studio. last thing, I have zero philosophy background, so any term of art you use (reproductive isolation, species delimitation, whatever) needs a quick plain-language gloss I can say out loud without sounding like an idiot.
