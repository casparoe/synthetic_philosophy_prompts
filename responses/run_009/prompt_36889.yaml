prompt: |-
  I have followed the debate about aggregation in Scanlonian contractualism for roughly two decades, and it now strikes me as thoroughly ritualised. The cycle is familiar: a critic presents a case in which contractualism's individualist restriction — the rule that principles are to be rejected on the basis of individual-person complaints, so that complaints cannot simply be added together — appears to yield the wrong verdict, or appears to get the right verdict only by covertly aggregating. The classic shapes are the numbers case (several people each facing a serious harm that one rescuer could avert for only one of them), the transplant case (one death imposed on an innocent to save many), and the risk case (a large risk to a few versus tiny risks spread across a very large number). The contractualist responds with a new distinction: claims of different strengths within a life, comparisons between threats and unfairness, tie-breaking when claims are equally strong, or a shift from claims about final outcomes to claims about the imposition of risk ex ante. The critic calls the new distinction a gerrymander, produces a case engineered to slip between its clauses, and the cycle begins again. As far as I can tell, almost nobody has changed their mind since the mid-2000s, and the growing pile of distinctions has not produced anything resembling convergence.

  I want a diagnosis of this stall, not another round of it. My working hypothesis, offered as a hypothesis only, is that the debate is not really about contractualism at all, but about whether "aggregation" names a single phenomenon. It seems to me that at least three different operations travel under that name: summing benefits and burdens within a single life; counting across lives that each have the very same complaint; and weighing complaints of unequal strength across lives. If these are genuinely distinct operations, then perhaps the contractualist is entitled to accept the first two while rejecting the third, and the critics' real complaint — that this position is ad hoc — rests on conflating them. But I can see two ways this could go wrong. Perhaps the disagreement is instead substantive and lies elsewhere: a hidden commitment about whether the separateness of persons is a constraint on the content of moral reasoning itself, or merely a constraint on the form in which reasoning must be presentable to each person — a difference between what may count in deliberation and what must be shown to whom. Or perhaps the two sides are answering different questions under one heading: the contractualists addressing a theory of what we owe to each other, and the critics addressing a theory of what there is most reason to do, with the cases merely masking the divergence.

  Please diagnose the structure of the disagreement using what the participants actually say and do in the debate, rather than by surveying positions. Tell me which, if any, of the three readings above is right, or offer a better one if none is. In particular, I would like to know: whether the stall is a sign that the underlying question is ill-posed, or merely that it is hard; whether the accumulating distinctions are genuine progress being misdescribed, or noise; and what, concretely, would count as movement — a new kind of case, a formal constraint on any acceptable resolution, a distinction that both sides would have independent reason to accept, or the admission that no progress should be expected here and why. Please write your answer in British English.
reasoning: |-
  Okay, the user has been following the Scanlonian contractualism debate on aggregation for two decades and sees it as stuck in a ritualised cycle. They want a diagnosis of why it's stalled, not another round of arguments. Their hypothesis is that "aggregation" might refer to three distinct operations, and conflating them causes problems. They also suggest two alternative reasons for the stalemate: a substantive disagreement about the separateness of persons or a divergence in the questions being asked (what we owe vs. what there's most reason to do).

  First, I need to unpack the user's main points. They mention three types of aggregation: summing within a life, counting identical complaints across lives, and weighing unequal complaints. The user is wondering if contractualists accept the first two but reject the third, and critics conflate them. Alternatively, the deadlock might stem from deeper issues about the separateness of persons or differing philosophical projects.

  Looking at the debate's history, the ritualistic pattern is clear. Critics present cases like numbers, transplant, or risk scenarios. Contractualists respond with distinctions—different strengths within a life, risk imposition ex ante, etc. Critics then argue these are ad hoc gerrymanders. This cycle repeats without resolution.

  The user's hypothesis about three types of aggregation makes sense. Summing within a life is essential for individual well-being. Counting identical complaints allows saving many in numbers cases without weighing different strengths. But weighing unequal complaints across lives is where contractualists draw the line, as it violates the individualist restriction. Critics might not distinguish these, seeing all as forms of aggregation. For example, in risk cases, spreading tiny risks versus concentrated risks involves unequal burdens, but critics might frame it as summing small harms. Contractualists like Kumar or Reibetanz offer ex ante perspectives, but critics like Otsuka see this as covert aggregation.

  On the separateness of persons, contractualists view it as a constraint on moral reasoning's content—complaints must be individual. Critics might see it as a justificatory constraint, allowing aggregation if justifiable to each person. This aligns with the user's point about deliberation vs. presentability. Scanlon focuses on mutual justifiability, but critics like Parfit or Kamm argue that aggregation can be part of what we owe to each other.

  The divergent questions angle is also valid. Contractualists aim to define interpersonal duties ("what we owe"), while critics might be addressing overall reasons for action ("what there's most reason to do"). In rescue cases, saving more lives seems the most reasonable act, but contractualists might reject it if it violates individual complaints. This fundamental difference might underlie the stalemate.

  The stall indicates the question might be ill-posed. Both sides aren't just disagreeing on answers but on the framework itself. The accumulating distinctions aren't noise but attempts to reconcile the core tension. However, without shared premises, progress is limited. Genuine movement would require addressing the deeper divides: clarifying if "aggregation" is unitary, agreeing on the separateness of persons' role, or explicitly acknowledging the different questions being asked. A new case might not help if it's reinterpreted through existing frameworks. Instead, meta-ethical discussions or formal constraints on complaints could be avenues, but both sides need to engage beyond the current cycle.
answer: |-
  Your diagnosis of the ritualisation is astute, and your working hypothesis hits upon a core tension. Based on the actual dialectic within the literature (Scanlon, Parfit, Kumar, Otsuka, Reibetanz, Frick, Voorhoeve, et al.), the stall stems from **a fundamental and unresolved ambiguity about the nature and scope of the "individualist restriction" itself, coupled with divergent underlying commitments that the participants haven't adequately disentangled.** While your tripartite distinction of aggregation is insightful and part of the puzzle, it's not the sole culprit. Here's a diagnosis grounded in the debate's dynamics:

  1.  **The Core Ambiguity: What Does the Individualist Restriction *Actually* Forbid?**
      *   **Contractualist Stance (Scanlon, Kumar, Reibetanz):** The restriction forbids *justifying* the imposition of a burden on one individual *simply* by appealing to the *summed* smaller benefits (or avoided burdens) distributed across *many others*. The complaint must be *individualised* – the burden imposed on *me* must be justified *to me* in a way that doesn't merely point to the diffuse gains of others. Crucially, they *allow* "aggregation" in your first two senses:
          *   **Within a life:** Summing benefits/burdens for a single individual's complaint strength is essential (e.g., saving one person from death vs. a stubbed toe).
          *   **Counting Identical Complaints:** When individuals face *identical* harms (or risks thereof), and saving one prevents that harm, saving more rather than fewer is permissible *because each rescued person has an equally strong complaint against non-rescue*. Choosing the larger group isn't summing *smaller* benefits; it's responding equally to *identical* strong complaints. The Numbers Case is resolved this way.
      *   **Critics' Stance (Parfit, Otsuka, Norcross, Frick in critique):** The restriction, as interpreted through its consequences in problematic cases (Transplant, Risk), appears to forbid *any* comparative weighing where the *number* of affected individuals carrying a *lesser* (but still significant) complaint influences the permissibility of imposing a greater burden on a *fewer* number. They argue that rejecting this *third* type of "aggregation" (weighing unequal complaints across lives) leads to intuitively unacceptable results in Risk Cases (e.g., exposing few to high cancer risk vs. exposing many to a tiny risk summing to the same expected harm) or variations of Transplant. They see the Contractualists' acceptance of "counting identical complaints" as implicitly relying on a weighing mechanism that should logically extend to unequal cases.

  2.  **The Ritual Cycle Explained by the Ambiguity:**
      *   **Critic's Move:** Presents a case (e.g., Risk Case A) where intuitive verdict requires weighing lesser-but-numerous complaints against a concentrated greater complaint. Claims this shows the restriction is flawed.
      *   **Contractualist's Move:** Proposes a distinction (e.g., ex ante vs. ex post perspectives, different "types" of complaint like harm vs. unfairness, tie-breaking rules for equally strong claims) designed to show how the *individualist* complaint structure *can* yield the intuitive verdict *without* violating the restriction as they understand it. They argue they are *not* summing lesser complaints; they are identifying a *new kind of individual complaint* (e.g., the complaint against *unfair risk imposition* ex ante) or applying the rule for identical claims in a consistent way.
      *   **Critic's Riposte:** Designs a new case (Risk Case B) engineered to circumvent the new distinction. Argues the distinction is ad hoc ("gerrymandering") precisely *because* it seems tailored *only* to avoid the forbidden aggregation while capturing the desired verdict, rather than flowing from a principled understanding of individual complaints *independent* of the desired outcomes. The critic insists the underlying operation *is* still aggregation (your type 3), just obscured by the new terminology. The ambiguity of what constitutes an "individual complaint" and what constitutes "weighing" vs. "counting" is exploited in both directions.

  3.  **Your Hypotheses Evaluated:**
      *   **Distinct Aggregations (Partially Correct, But Insufficient):** Your tripartite distinction accurately reflects the contractualist *position* and clarifies why they see Numbers as solvable while Transplant is forbidden. **However, the stall occurs because critics *reject* the legitimacy of isolating the third type.** They argue:
          *   The justification for "counting identical complaints" *depends* on a latent commitment to the *moral significance of the number of lives saved* when harms are equivalent. If number matters there, why shouldn't it matter when harms are *different but commensurable* (e.g., death vs. lesser injuries whose *summed disvalue* might outweigh a death)?
          *   Risk cases expose this: Contractualist solutions (like Kumar's ex ante comparable burdens) appear to critics as *covertly* performing the forbidden aggregation by redefining the complaint at the point of risk imposition, where burdens *are* arguably comparable and summable. The critic sees this as gerrymandering *because* it seems motivated solely by salvaging the restriction in the face of counterexamples, not by an independent account of complaint individuation.
      *   **Separateness of Persons: Constraint on Content vs. Form (Crucially Correct):** **This is central to the deadlock.** Contractualists (Scanlon emphatically) see the separateness of persons as imposing a *substantive constraint on the content of moral reasoning*: What we owe to each other is fundamentally determined by what can be justified *to each individual* considered singly, ruling out interpersonal summing *as a justificatory basis*. The individual complaint is primary. Critics often operate with a view where the separateness of persons imposes a *constraint on the form of justification*: Principles must be justifiable *to each person*, but the *content* of what is justifiable *could* include outcomes reached by considering aggregate effects, *provided* no individual is treated as a mere means and the overall outcome can be presented as acceptable *to each*. For them, aggregation might *be part of* what we owe to each other if it leads to outcomes everyone could reasonably accept *given the stakes*. This difference is profound and often unspoken.
      *   **Divergent Questions: What We Owe vs. Most Reason (Also Correct & Intertwined):** **This divergence amplifies the stall.** Contractualists are explicitly offering a theory of *interpersonal duties* ("what we owe to each other"). Critics, especially when invoking intuitions about overall outcomes in Risk Cases or catastrophic scenarios, often seem to be assessing *what there is most (all-things-considered) reason to do*. They fault contractualism for failing to capture the latter, while contractualists retort that this conflates two distinct questions. The cases *do* mask this divergence: Critics present cases where the "most reason" verdict seems overwhelmingly clear and argue a theory of what we owe *must* align with it. Contractualists argue their theory captures a distinct, crucial dimension of morality (mutual justifiability) that might *constrain* the pursuit of the "most reason" outcome, especially when it involves sacrificing one for the aggregate gain of others.

  **Diagnosis of the Stall:**

  *   **Is the question ill-posed?** Not entirely ill-posed, but **multiply ambiguous and exceptionally hard.** The core question – "Can Scanlonian contractualism adequately handle cases requiring aggregation?" – masks three unresolved sub-questions:
      1.  What *precisely* constitutes forbidden "aggregation" under the individualist restriction? (Ambiguity exploited in the cycle).
      2.  Does the separateness of persons constrain the *content* or merely the *form* of justification? (Deep, often unacknowledged divergence).
      3.  Is contractualism solely a theory of "what we owe," or must it also track "most reason"? (Divergent expectations).
  *   **Are the distinctions noise or progress?** They are **genuine attempts at progress within the contractualist framework**, refining the understanding of complaints and their comparability. However, **they appear as noise (or gerrymanders) to critics** because they don't address the deeper divergences (points 2 & 3 above) and seem designed to preserve the restriction against counterexamples rather than derived from independent principles of complaint individuation acceptable to both sides.
  *   **What would count as movement?** Genuine progress requires breaking the ritual cycle by addressing the underlying divergences:
      *   **Clarifying the Ambiguity:** Explicitly agreeing on definitions of "aggregation" and the precise scope of the individualist restriction *before* applying it to cases. Canvassing the implications of accepting/rejecting each of your three types.
      *   **Confronting the Separateness Constraint:** A meta-discussion: Is Scanlon's substantive constraint (no interpersonal summing *as justificatory basis*) the *only* way to respect separateness? Or could a justificatory constraint (principles must be acceptable to each, where acceptability *might* factor in aggregate consequences under certain descriptions) also respect it? Canvassing intuitions *about this meta-question* directly.
      *   **Acknowledging Divergent Projects:** Explicitly stating whether the debate is about refining a theory of mutual duties ("what we owe") or about whether such a theory *must* align with judgments about overall reasons for action. Admitting that contractualism *might* be correct about "what we owe" even if it sometimes diverges from "most reason."
      *   **New Kind of Case?** Unlikely alone. Current cases already probe the boundaries effectively. New cases will be slotted into the existing ritual.
      *   **Formal Constraint?** Highly desirable but elusive. A constraint accepted by both sides on what counts as a legitimate "individual complaint" or on the structure of justifications (e.g., no "token-complaint" can be overridden *only* by the *sum* of lesser complaints). Scanlon's "generic reasons" was an attempt, but critics find it insufficiently constraining.
      *   **Admission of Stalemate?** This might be the most honest outcome. The debate could reach a point where it's acknowledged that contractualists and critics hold fundamentally different, rationally defensible but incompatible, views about the nature of moral reasoning concerning individuals and groups, the role of separateness, and the purpose of moral theory. The distinction pile reflects the effort to bridge an unbridgeable gap given these deeper differences. The ritual continues because neither side can convince the other on these foundational points using the case method alone. Progress would then involve mapping the *reasons* for this fundamental disagreement rather than expecting convergence on the cases.

  **Conclusion:**

  The stall arises because the debate conflates three levels: (1) the surface-level argument over cases and distinctions, (2) the unresolved ambiguity about the restriction's meaning and its relationship to different aggregation types, and (3) the profound, underlying divergence about whether the separateness of persons forbids certain *forms of reasoning* (content constraint) or merely requires certain *modes of justification* (form constraint), coupled with differing views on the scope of "what we owe." Your hypotheses accurately identify elements at levels 2 and 3. The accumulating distinctions represent progress *within* the contractualist project at level 1, but appear as noise or evasion to critics because they don't resolve levels 2 and 3. Movement requires shifting focus to those deeper disagreements explicitly. Until then, the ritual persists, not due to the question's inherent absurdity, but due to its exceptional difficulty and the entrenched, divergent premises held by the participants.
