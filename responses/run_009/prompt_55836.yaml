  We are going to design a quiz that helps readers discover which update rule they implicitly follow when updating on conditional information. The quiz will have 8-10 questions, each presenting a concrete scenario with 2-3 answer choices. The scenarios are designed such that different update rules lead to different answers, and the reader's intuitive choice will place them in the logical space of update rules.

  The update rules we aim to cover (as per the request) are:

  1. Material Conditional Update (MC): Treat the conditional as the material conditional (¬p ∨ q).
  2. Minimum (Relative) Entropy Update (ME): Update by minimizing the relative entropy (Kullback-Leibler divergence) from the prior, subject to the constraints.
  3. Van Fraassen's Nearest-Prior Approach (VF): Find the posterior that is closest to the prior (in some sense) and satisfies the conditional constraint.
  4. Explanation-Based Updating (EB): Consider why the speaker said what they said and update accordingly, which might involve changing the credence in the antecedent.
  5. Antecedent Unmoved (AU): The view that a conditional probability report leaves the credence in the antecedent untouched.
  6. Deflationary View (DV): Conditionals aren't propositions with truth values; the update is ill-posed.

  Note: We must avoid requiring computation and ensure scenarios are intuitive.

  We'll design questions that split the logical space:

  - Does the conditional assertion carry information about the antecedent?
  - When constraints underdetermine the posterior, how is the gap filled? (minimal change, maximal entropy, explanation, or nothing)
  - Does it matter whether the information is a bare conditional probability vs. a speaker's utterance?

  We need to include:

  - The Judy Benjamin problem (symmetric case: prior 50/50 on territories, and for each territory, the odds of being near HQ are 3:1 in one and 3:1 against in the other).
