  ### Which Update Rule Do You Actually Follow? Quiz

  **Instructions:** Answer each scenario based on your intuitive judgment. No computation needed—go with your gut. Choose the option that best reflects how you would update your beliefs. All scenarios are independent.

  ---

  1. **Deflationary Trigger**  
     You’re about to flip a fair coin. A colleague says, "If it lands heads, I’m 90% sure tomorrow will be sunny." After this, your credence in heads is:  
     A. 50%  
     B. More than 50%  
     C. Less than 50%  
     D. Ill-posed—conditionals aren’t truth-apt.  

  2. **Judy Benjamin (Asymmetric Prior)**  
     You’re dropped in a swamp with two territories: Red (twice as likely as Blue). Initially, P(Red) = 2/3, P(Blue) = 1/3. A radio operator says: "If in Red, odds are 3:1 you’re near Red HQ. If in Blue, odds are 3:1 against near Blue HQ." Your updated P(Red) is:  
     A. 2/3  
     B. More than 2/3  
     C. Less than 2/3  
     D. Ill-posed.  

  3. **Trusted Colleague**  
     Dean approval for your budget is 50-50. A trusted, well-informed colleague says: "If approved, I’m 90% confident we get the seminar room." Your P(approval) is now:  
     A. 50%  
     B. More than 50%  
     C. Less than 50%  
     D. Ill-posed.  

  4. **Sycophant Colleague**  
     Same as above, but the colleague is a dean-sycophant (eager to please). They say the same thing. Your P(approval) is now:  
     A. 50%  
     B. More than 50%  
     C. Less than 50%  
     D. Ill-posed.  

  5. **Material Conditional Test**  
     A coin is fair or biased (90% heads). After one heads flip, your P(fair) ≈ 35%. A friend says: "If the next flip is heads, then it’s fair." Your updated P(fair) is:  
     A. ≈35% (unchanged)  
     B. More than 35%  
     C. Less than 35%  
     D. Ill-posed.  

  6. **Whistleblower Colleague**  
     Dean approval is 50-50. A whistleblower (only speaks on bad news) says: "If approved, I’m 90% confident we get the seminar room." Your P(approval) is now:  
     A. 50%  
     B. More than 50%  
     C. Less than 50%  
     D. Ill-posed.  

  7. **Bare Conditional Report**  
     Dean approval is 50-50. A statistician (no inside info) gives a report: "P(seminar room | approval) = 90%." Your P(approval) is:  
     A. 50%  
     B. More than 50%  
     C. Less than 50%  
     D. Ill-posed.  

  8. **Judy Benjamin (Symmetric Prior)**  
     Same as Q2, but territories are equally likely (P(Red) = P(Blue) = 50%). The operator gives the same odds. Your P(Red) is now:  
     A. 50%  
     B. More than 50%  
     C. Less than 50%  
     D. Ill-posed.  

  ---

  ### Scoring Key  
  Follow these steps to identify your update rule. Rules are defined by their stance on:  
  - **Truth-aptness**: Are conditionals propositions (with truth values)?  
  - **Antecedent impact**: Can a conditional update credence in its antecedent?  
  - **Underdetermination**: How to handle ambiguity? (Minimal change, explanation, or no update?)  
  - **Source sensitivity**: Does the speaker’s motive/act matter?  

  #### Step 1: Truth-Aptness  
  - If you chose **D (ill-posed) in 5+ questions**, you lean **Deflationary (DV)**: Conditionals lack truth values; updates are ill-posed.  
  - *Else*, proceed.  

  #### Step 2: Material Conditional (MC) Check  
  - If you chose **B in Q5**, you lean **Material Conditional (MC)**: Treat "if P then Q" as ¬P ∨ Q.  
  - *Else*, proceed.  

  #### Step 3: Antecedent Impact in Judy Benjamin  
  - **Q2: A** and **Q8: A** → *Antecedent Unmoved (AU)*: Conditionals don’t update the antecedent.  
  - **Q2: C** and **Q8: A** → Proceed to Step 4.  
  - *Other patterns*: Uncommon; see notes.  

  #### Step 4: Source Sensitivity  
  - **Q3: A**, **Q4: A**, **Q6: A**, **Q7: A** → *Minimum (Relative) Entropy or Van Fraassen (ME/VF)*: Update by minimal change to prior; speaker’s act/motive irrelevant.  
  - **Q3: B**, **Q4: B**, **Q6: C**, **Q7: A** → *Explanation-Based (EB)*: Speaker’s motive affects updates (e.g., sycophants speak only if approval likely).  
  - *Q7 context*: A = no speaker motive → all rules agree.  

  #### Final Mapping  
  1. **Deflationary (DV)**: Truth-aptness rejected (D-heavy).  
  2. **Material Conditional (MC)**: Q5 = B.  
  3. **Antecedent Unmoved (AU)**: Q2 = A, Q8 = A, and consistent A in Q3–Q7.  
  4. **Minimum Entropy / Van Fraassen (ME/VF)**: Q2 = C, Q8 = A, and A in Q3/Q4/Q6 (source-insensitive).  
  5. **Explanation-Based (EB)**: Q2 = C, Q8 = A, and B in Q3/Q4, C in Q6 (source-sensitive).  

  #### Notes & Caveats  
  - **ME/VF vs. EB**: Asymmetric cases (Q2) split AU from ME/VF/EB; speaker scenarios (Q3, Q4, Q6) split ME/VF (source-insensitive) from EB (source-sensitive).  
  - **ME vs. VF**: Not distinguished—both use minimal change and agree in these cases.  
  - **AU vs. Others**: AU never updates antecedents; ME/VF/EB do in asymmetric Judy Benjamin (Q2).  
  - **Combinations avoided**:  
    - AU + source sensitivity: Rare—AU treats conditionals as non-informative for antecedents, so motives are irrelevant.  
    - DV + non-DV: Incoherent—truth-aptness is binary.  
  - **Unseparated pairs**:  
    - ME and VF: Only diverge in complex constraints; quiz can’t distinguish.  
    - EB and general utterance-updating: Quiz lumps speaker-sensitive updates under EB.  
  - **Confused premise?**  
    The quiz tests *intuitive reactions* to cases, not objective correctness. Judy Benjamin *is* contested—rules reflect genuine philosophical divides.  

  **British English Check**: Prioritised (e.g., "prioritised", "favouring", "whilst" avoided for brevity, but "credence", "territories", "maths" used).  

