  First, unpacking their key points: Sympathy isn't pity but an imaginative reconstruction (like an observer model). The impartial spectator is an internalized reference (setpoint). The agent regulates behavior against it. They flagged two big worries: 1) The setpoint isn't external but bootstrapped from noisy social data (like adaptive control). 2) Control theory assumes fixed performance criteria, but Smith questions if the setpoint is "true" or just consensus. 

