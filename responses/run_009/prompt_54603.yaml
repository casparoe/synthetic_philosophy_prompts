prompt: |-
  so I write novels — literary fiction, morally gray people doing slightly-too-much for strangers, the usual — and I'm stuck on a question that turns out to be a whole thing in ethics. My current manuscript has a woman who donates a kidney to a stranger she met once, and my editor keeps marking up those scenes with things like "is she a saint here or just a decent person who did the math?" and I realized I honestly don't know whether that distinction carves anything real.

  so here's what I want a number on. Give me your credence that supererogation is a genuine, coherent category: that there can be acts that are (a) permissible, (b) better than what duty requires, and (c) not themselves required. The part that keeps me up is the transmission problem — if the kidney donation is better than not donating, and not donating is obviously fine, why doesn't the "better" push the obligation upward until everything above the minimum becomes required too? Something has to break that transmission, and everyone seems to disagree about what the breaker is.

  Decompose it for me. I'd want at least: the probability that consequentialism of the maximizing sort is true, since if maximizing is the whole story the category looks like it evaporates — though I gather the satisficing and scalar consequentialists have escape routes, so maybe tell me how much those routes actually rescue supererogation. The probability that the demandingness objection works somewhere, i.e. that ought-implies-can style limits on obligation are real and not just a comfort blanket for readers who want to feel okay about not donating kidneys. The probability that the three conditions (permissible, better, not required) are jointly satisfiable in a non-consequentialist framework without smuggling the problem in elsewhere — stuff like threshold views where you're required to hit the threshold but praiseworthy for overshooting. And any other terms you think belong, with a number and one line of justification each, then the combination.

  Then tell me which sub-question your final number is most sensitive to, and what argument or kind of case would move it the most.

  And if you're feeling generous, one line at the end on my actual problem: if your number is low, is my editor right that the character is just doing what she ought and the "saintly" framing is sentimentality, and if it's high, does that make heroism cheap in a way I should be writing against? sorry this ran long, I've been arguing with the editor for three weeks
reasoning: |-
  Okay, let me unpack this fascinating ethical puzzle. The novelist is wrestling with whether supererogatory acts - like donating a kidney to a stranger - can truly exist as a distinct moral category. They've identified the core tension: if donating is better than not donating, and not donating is permissible, what stops the "betterness" from making donation obligatory? 

  This transmission problem keeps them up at night, and I can see why. It cuts to the heart of moral philosophy. To structure my response, I'll need to: First, map the key philosophical positions that validate or invalidate supererogation. Consequentialism presents the clearest threat - if morality demands maximization, heroism becomes obligation. But I should note how satisficing or scalar variants might preserve space for supererogation. Second, examine deontological frameworks where duty has clear boundaries. Ross's prima facie duties or Nagel's agent-centered permissions could carve out supererogation space. Third, consider whether "ought implies can" arguments successfully limit obligations to what's reasonably demandable. 

  The novelist also wants probabilities - tricky but doable as credences reflecting philosophical consensus. For instance, strict maximizing consequentialism isn't dominant, so I'll weight it under 50%. Satisficing consequentialism gets moderate credence since it's less developed. Deontology with thresholds seems the strongest candidate for preserving supererogation. The demandingness objection feels robust - morality can't require unbearable sacrifice without losing grip - so it gets high credence. 

  When combining these, the joint probability for supererogation's coherence should land somewhere near 0.7, leaning toward existence. The most sensitive variable is the demandingness principle - if that collapses, obligations expand dramatically. For the novelist's dilemma: if supererogation exists, their character's act is genuinely saintly; if not, the editor's right that it's mere duty. But either way, the psychological texture matters - why does she see it as optional when others might see obligation? That tension itself is rich material. 

  The kidney example perfectly exposes how moral systems handle the gap between "good" and "required." I'll emphasize that even if supererogation exists, calling it "cheap" misses how devastating such acts feel - the cost is what makes them heroic.
answer: |-
  Here's a decomposed credence breakdown for the coherence of supererogation, addressing your transmission problem and its implications for your novel:

  **Core Credence:** My overall credence that supererogation (permissible, better than duty, not required) is a genuine, coherent category is **0.65 (65%)**. I lean towards it existing, but the transmission problem is serious.

  **Decomposition with Key Terms & Justifications:**

  1.  **Probability that Maximizing Consequentialism is True: 0.25 (25%)**
      *   *Justification:* Historically influential but faces significant challenges (demandingness, alienation, intuitive counterexamples like supererogation itself). Most modern ethicists reject strict maximization.
  2.  **Probability that Satisficing/Scalar Consequentialism *Successfully* Rescues Supererogation: 0.40 (40%)**
      *   *Justification:* Satisficing ("good enough") creates logical space beyond the minimum duty. Scalar (moral *degree* without sharp obligation) avoids "required/not" binaries. However, defining the "good enough" threshold is notoriously difficult and risks collapsing back into maximizing or arbitrariness. It *can* work, but isn't universally convincing.
  3.  **Probability that the Demandingness Objection is Valid ("Ought Implies Can" Limits Obligation): 0.85 (85%)**
      *   *Justification:* Deeply intuitive. Morality demanding unbearable sacrifice (constant kidney donations, life-ruining charity) seems absurd and self-defeating. Strong consensus that obligation has *some* limits based on capacity, cost, and personal integrity. This is the primary "transmission breaker."
  4.  **Probability that Non-Consequentialist Frameworks (Deontological/Virtue) *Successfully* Accommodate Joint Conditions without Smuggling: 0.70 (70%)**
      *   *Justification:* Frameworks like W.D. Ross's (prima facie duties, intuitive moral residue), agent-centered permissions (Nagel/Scheffler), or virtue ethics (focus on character, not just acts) naturally build in space between duty and ideal. Thresholds (required baseline, praiseworthy excess) are explicit features, not smuggled problems. This is the *most* hospitable ground for supererogation.
  5.  **Probability that "Permissible, Better, Not Required" is Logically Coherent (Absent Framework Collapse): 0.90 (90%)**
      *   *Justification:* The concepts themselves aren't inherently contradictory. The challenge is embedding them within a moral *system* without the system undermining one leg (usually "not required"). On its face, the definition holds.

  **Combination Reasoning:** The high credence for Demandingness (#3 - 85%) and Non-Consequentialist Viability (#4 - 70%) strongly support supererogation. The low credence for Maximizing Consequentialism (#1 - 25%) removes its main threat. Satisficing/Scalar (#2 - 40%) offers a potential consequentialist path but isn't highly probable as a *full* solution. The logical coherence (#5 - 90%) confirms the definition isn't the primary issue. Weighting these, **0.65** reflects the dominance of #3 and #4 over the challenges posed by #1 and the limitations of #2.

  **Most Sensitive Sub-Question: Demandingness (#3).**
  *   **Argument/Case That Would Move Credence Most:** A rigorous demonstration that morality *must* be infinitely demanding (e.g., proving any limit on obligation based on cost is mere psychological weakness, not ethics; showing that "can" in "ought implies can" only refers to physical/logical possibility, not reasonable capacity). Conversely, a clear case where fulfilling an obvious moral obligation *genuinely* destroys the agent's capacity for *any* meaningful life or future moral action could strengthen demandingness credence further.

  **Your Novelist's Dilemma:**

  *   **If My Number is Low (<0.5):** Your editor has a stronger point. If supererogation collapses, donating the kidney *is* likely her duty (especially under consequentialism). The "saintly" framing *could* be sentimentality masking the harsh reality of obligation. Lean into the character's internal logic: *why* does *she* feel it's optional? Is it denial, flawed reasoning, or does she intuit the demandingness limit others ignore?
  *   **If My Number is High (>0.5):** Your editor might be underselling the heroism. The act *can* be genuinely supererogatory – praiseworthy precisely *because* it was beyond demand. **But here's the crucial nuance for writing:** Supererogation **doesn't make heroism cheap.** The *cost*, sacrifice, and *why* it was optional for *her* (demandingness, personal projects, competing duties) is what *makes* it heroic and interesting. The "cheapness" fear arises only if the act is portrayed as *easy* or *commonplace*. Emphasize the weight of her choice *because* it wasn't strictly required.

  **Recommendation:** Regardless of the philosophical truth, **exploit the tension.** Your character likely *feels* the transmission problem: "If this is so good, why isn't it mandatory? What does that say about me if I don't? What does it say about me that I *did*?" Her internal struggle *with* the ambiguity is richer fodder than a clear-cut saint/duty binary. Play with the societal perception (saintly!) vs. her own perception (maybe just "decent," maybe haunted by not doing *more*). Your editor's question "saint or decent person who did the math?" is *gold* – let the character wrestle with that exact ambiguity. The ethics debate *within* the narrative can be more powerful than adhering to one external answer.
