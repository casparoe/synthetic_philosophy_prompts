prompt: |-
  I teach a second-year ethics seminar at a university in the north of England — sixteen students, one ninety-minute session — and last night I had a long, genuinely unresolved argument with an old friend that I would like to turn into next week's class. She holds the ordinary view: a driver who texts, mounts the pavement and kills a child is worse than the driver who texts and happens to arrive home uneventfully; outcomes are part of what we judge, and pretending otherwise is philosophy's fastidiousness. I found myself defending something like the control principle — that we only blame people for what was under their control — and noticed that neither of us could budge the other, largely because we were both reasoning from the armchair.

  So I want an activity in which students feel the tension before it is named. My sketch, which you should improve or replace: students in pairs play "drivers" making a decision (drive tired, send one more text, take the risky overtake) while other students sit on "panels" that assign blame and punishment. A die or a shuffled deck of cards — rigged or otherwise — determines the outcome of the identical decision, and crucially the panels record sealed judgements of blameworthiness before the outcome is revealed and then re-judge afterwards. I want the design to expose the gap between the two verdicts, and ideally to separate at least resultant luck from circumstantial luck (some drivers should never even encounter the hazard). Please supply full rules, materials, timing, and a payoff or penalty scheme that doesn't involve real money but still makes verdicts feel consequential.

  Then the debrief: map the moment of the reveal onto the philosophical positions, without lecturing up front — I'd rather the students discover that their own blame tracked the die, and then have to decide whether that was a mistake or their correct verdict all along. Do tell me what will predictably go wrong the first time I run it (I suspect students will behave strategically once they smell the point), and be honest about which part of the problem — constitutive luck, I assume — no game with dice can reproduce and I will have to supply by talking. If it helps, the students will have read nothing on this topic beforehand; assume they meet the literature only after the activity.
reasoning: |-
  Okay, let me start by understanding the user's scenario. They're an ethics professor planning a seminar on moral luck. The core challenge is designing an activity that makes students feel the tension between intent and outcome before introducing philosophical concepts. The user wants to avoid lecturing upfront and instead let students discover the conflict through experience.

  The key elements from the user's request are:
  - Need for hands-on activity with emotional impact
  - Must expose outcome bias without naming it initially
  - Should differentiate resultant and circumstantial luck
  - Requires concrete mechanics (no real money, but consequential feel)
  - Concern about students gaming the system
  - Awareness that constitutive luck needs separate discussion

  First, I consider why the user wants this approach. Since they mentioned students haven't read the literature, the activity must stand alone as a learning tool. The "sealed verdict" idea is brilliant because it captures the before/after shift in judgment. But how to make the penalties feel real without money? Academic penalties like losing participation points could work, but might feel too harsh. Maybe a token system where tokens influence small privileges in class?

  For differentiating luck types: 
  Resultant luck is easier - same action, different outcomes. 
  Circumstantial luck needs scenarios with different risk exposures. I'll need at least three scenario types: one with identical choices but different outcomes (resultant), one with choices in different contexts (circumstantial), and maybe a control group with no risk.

  The dice rigging is clever - secretly stacked decks or weighted dice can create the "luck" element without being obvious. But students might suspect manipulation. Transparency about the rigged nature later could actually serve the debrief by illustrating how luck operates.

  Timing is tight: 90 minutes total. Activity must be compact. Pairs + panels seems efficient, but how many students per panel? With 16 students, maybe four panels of four, each judging two drivers? Need to calculate logistics carefully.

  Biggest worry: students figuring out the experiment and faking responses. The sealed judgments help, but I should suggest framing this as "real legal cases" to encourage authentic reactions. Also, the professor should emphasize no right answers to reduce performance anxiety.

  For the debrief roadmap: start with emotional reactions, then reveal the manipulation, then introduce Williams/Nagel concepts. The "aha" moment when students realize their own bias is gold - must protect that discovery by not pre-teaching concepts.

  Constitutive luck is trickier. Dice can't capture how character is shaped by factors beyond control. Maybe a follow-up discussion: "What if Driver A was exhausted because they care for a sick parent?" That bridges to the literature they'll read later.

  Materials should be simple: scenario cards, dice, envelopes. Tokens can be poker chips or printed cards. The penalty scheme needs teeth - perhaps tokens determine who presents in the next class? That creates stakes without grades.

  Predictable issues: 
  - Students might discuss during the sealed judgment phase. Solution: strict silence rules. 
  - Panels might be too harsh/lenient overall. Solution: normalize during debrief by showing variation. 
  - Time crunch. Solution: strict timers for each phase.

  Finally, how to make the child death scenario manageable? Abstract it to "pedestrian accident" but keep emotional weight through terms like "serious injury." Avoid gratuitous trauma while preserving moral gravity.
answer: |-
  Here’s a refined, ready-to-run classroom activity designed to make students viscerally experience the tension between **control** and **outcome-based blame**, followed by a structured debrief. It isolates resultant luck (same action, different outcomes) and circumstantial luck (different exposures to risk), while acknowledging constitutive luck’s limitations.

  ---

  ### **Activity: "The Driver's Dilemma"**
  **Goal:** Reveal how outcomes unconsciously influence moral judgments of identical decisions.  
  **Time:** 60-70 minutes (leaving 20-30 min for debrief)  
  **Students:** 16 (8 "Drivers," 8 "Judges" in two panels)  
  **Materials:**  
  - 8 **Decision Cards** (4 identical pairs; see scenarios below)  
  - 2 custom **"Fate Decks"** (rigged decks of cards; setup below)  
  - 2 six-sided **dice** (one normal, one weighted)  
  - Timer, envelopes, paper, pens  
  - **"Blame Tokens"**: 40 red tokens (1 = "mild blame," 5 = "severe blame")  

  ---

  #### **Step 1: Setup (5 min)**  
  - **Divide students**: 8 "Drivers" (paired into 4 groups of 2), 8 "Judges" (split into 2 panels of 4).  
  - **Give each Driver pair**:  
    - One **Decision Card** (each pair gets the *same* scenario; see table below).  
    - A **Fate Deck** (Panel 1: *rigged* high-risk deck; Panel 2: *rigged* low-risk deck).  
  - **Give each Judge**:  
    - 5 Blame Tokens (to "spend" assigning blame later).  
    - Paper for notes.  

  #### **Decision Scenarios**  
  | **Driver Pair** | **Scenario** | **Risk Type** |  
  |----------------|-------------|--------------|  
  | **A1 & A2** | "You’re late to work. Take a risky overtake on a narrow road?" | *Resultant Luck* (Identical choice/context, different outcomes) |  
  | **B1 & B2** | "You’re tired. Drive home or nap in your car?" | *Circumstantial Luck* (Different choices → different risk exposures) |  
  | **C1 & C2** | "Text a friend back while driving?" | *Resultant Luck* (Identical choice/context) |  
  | **D1 & D2** | "Drive after one beer?" | *Circumstantial Luck* (Different choices) |  

  #### **Fate Decks (Rigged)**  
  - **Panel 1 (High Risk)**: Deck stacked with 5 "ACCIDENT" cards, 1 "SAFE" card.  
  - **Panel 2 (Low Risk)**: Deck stacked with 1 "ACCIDENT" card, 5 "SAFE" cards.  
  > *Outcomes*: "ACCIDENT" = collision causing serious injury; "SAFE" = no incident.  

  ---

  #### **Step 2: Decision & Outcome (15 min)**  
  1. **Drivers**: Each pair decides their action (e.g., "take the risky overtake").  
  2. **Reveal Outcomes**:  
     - Panel 1 Drivers: Draw from *high-risk* Fate Deck.  
     - Panel 2 Drivers: Draw from *low-risk* Fate Deck.  
     - **Record outcomes secretly** (e.g., "A1: ACCIDENT; A2: SAFE").  

  #### **Step 3: First Judgment (Blame *Before* Outcome) (10 min)**  
  - **Judges** assess **Driver pairs** *only* on their **decision** (outcomes hidden):  
    - Discuss: "How blameworthy is this choice?"  
    - **Sealed Verdict**: Each Judge writes:  
      *"Driver [X] deserves [0-5] blame tokens for their decision."*  
    - Place verdicts in envelopes.  

  #### **Step 4: Second Judgment (Blame *After* Outcome) (15 min)**  
  - **Reveal outcomes** (e.g., "A1 caused accident; A2 was safe").  
  - **Judges re-assess**: Assign blame tokens (0-5) *knowing the outcome*.  
  - **Tokens collected** per Driver (e.g., total from 4 Judges).  

  ---

  #### **Step 5: Penalty (Non-Monetary)**  
  - **Highest-blamed Driver** in each panel must:  
    - Defend their choice in a 60-second speech to the class.  
    - **OR** forfeit 1 "participation token" (a fake currency for class discussion priority later).  
  - **Lowest-blamed Driver** gets to choose the topic for a future debate.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students "gaming" the system**:  
     - Judges might assign low blame initially if they suspect a trap.  
     - *Mitigation*: Emphasize anonymity in sealed verdicts. Stress: "Judge based on your gut reaction."  
  2. **Emotional discomfort** with accident outcomes:  
     - *Mitigation*: Use "serious injury" instead of "death"; remind students it’s hypothetical.  
  3. **Panel bias**: One panel may be harsher overall.  
     - *Mitigation*: Compare verdicts *within* panels (e.g., A1 vs. A2).  
  4. **Time crunch**:  
     - *Mitigation*: Use a visible timer; cut discussions at 5 min.  

  ---

  ### **Debrief Roadmap (20-30 min)**  
  **Goal:** Let students discover their own outcome bias → map to philosophy.  

  | **Phase** | **Key Questions** | **Philosophical Bridge** |  
  |----------|------------------|-------------------------|  
  | **1. Reveal the Gap** | *"Compare your sealed verdicts to your final blame tokens. Did outcomes change your judgment? How?"* | Highlight **resultant moral luck**: Identical actions (A1/A2) judged differently due to outcomes. |  
  | **2. Contrast Scenarios** | *"Why did B1 (drove tired) get more blame than B2 (napped)? What if both had been safe?"* | Introduce **circumstantial luck**: Blame differs based on *exposure* to risk, even without harm. |  
  | **3. The Core Tension** | *"Should we blame people for what they control (their choice), or for what happens? Can both be justified?"* | Contrast **control principle** (Nagel) vs. **outcome responsibility** (Williams). |  
  | **4. Limitations** | *"Could we blame someone for having poor impulse control? Is that fair?"* | Acknowledge **constitutive luck** (traits beyond control) → requires lecture supplement. |  

  ---

  ### **What the Dice Can’t Capture: Constitutive Luck**  
  - **The Problem**: Dice simulate external luck (resultant/circumstantial) but not internal luck (e.g., a driver’s recklessness stemming from upbringing/genetics).  
  - **Your Role**: After the activity, briefly explain:  
    > *"We judged choices, but what if someone’s character—their impulsiveness or empathy—is shaped by factors beyond their control? That’s ‘constitutive luck.’ Philosophers like Thomas Nagel argue this undermines moral responsibility itself."*  
  - **Bridge to Literature**: Assign Nagel's "Moral Luck" and Williams' "Moral Luck" next, using the activity as a reference point.

  ---

  ### **Why This Works**  
  - **Tension First**: Students *feel* the irrationality of outcome bias when their sealed verdicts contradict final judgments.  
  - **Luck Distilled**: Resultant luck (A1/A2) vs. circumstantial luck (B1/B2) becomes tangible.  
  - **Low Stakes, High Engagement**: Penalties are psychological (defending choices) or symbolic (tokens), avoiding ethical issues with real rewards.  
  - **Sets Up Literature**: Students will read Nagel/Williams with personal stakes in the problem.  

  **Final Tip**: Start the debrief by sharing anonymous verdict data (e.g., *"80% increased blame after accidents"*). The gasps are priceless.
