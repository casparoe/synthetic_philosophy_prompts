prompt: |-
  You're a professional moral philosopher with serious interests in decision theory and animal ethics, and I want you to actually think hard about this rather than reflexively defend expected-value maximization or reflexively mock it.

  So: I teach intro ethics, and last week a student asked whether it's wrong to swat a mosquito, and I realized my own views on insect suffering are basically incoherent. Rather than figure them out myself like a sucker, I'm handing you my gut verdicts and asking what principle, if any, captures them.

  - I swat the mosquito on my arm without a second thought. Whatever the probability it's sentient, it doesn't get anywhere near stopping me.
  - But the kid down the block torturing ants with a magnifying glass is doing something wrong — and I mean wrong *to the ants*, not just building bad character.
  - I'd exterminate a roach infestation in my mother's apartment without hesitation, even knowing the body count could be big.
  - Driving at dusk, I kill plenty of insects and feel basically nothing about it, and I would not detour twenty minutes to avoid a swarm over the road. Though maybe I'd feel a flicker of guilt, I'm not sure that's more than performance.
  - I buy regular flour even though grain storage and milling kill enormous numbers of insects per loaf, but I'd genuinely pay a dollar or two more for lower-impact flour if it existed.
  - If a charity could prevent something like the insect equivalent of a factory farm — trillions of animals, very uncertain sentience — for ten dollars, I think I'm obligated to give, even though no individual insect seems to matter much to me intuitively.

  The obvious move is the scale argument: low probability of sentience, but numbers so vast the expected value swamps it anyway. And I can feel my verdicts resisting that move in some places (the mosquito, the flour) and demanding it in others (the charity, maybe the kid). The mosquito and the ant-torturing kid seem to pull in exactly opposite directions, since the numbers are on the ants' side but my confidence that the exterminator does something wrong is way lower than my confidence that the kid does.

  So: is there one principle, or a small set, that gets all of these or close to it? Brainstorm a little before committing — at least consider that some of my verdicts are pure status-quo bias, and that the guilt-vs-action gap is doing illegitimate work. Then state the principle(s) precisely, tie each clause to the case that motivates it, tell me honestly which of my verdicts doesn't survive, and give me its verdict on a case I haven't listed: spraying my garden in a way that takes out pollinators along with the pests, where I know roughly how many of each die.

  Keep the whole thing under 600 words — I'd rather have a tight, committal answer than an exhaustive hedge-fest.
reasoning: |-
  Okay, let me approach this systematically. The user presents a series of moral intuitions about insect suffering that appear contradictory at first glance. I need to find underlying principles that reconcile these judgments without forcing artificial coherence. 

  First, examining the cases: mosquito swatting seems permissible despite potential sentience, while ant torture feels clearly wrong. This suggests a distinction between necessary harm (defense) and gratuitous harm (entertainment). The roach extermination and driving cases involve unavoidable harms tied to human needs, whereas the flour preference shows willingness to reduce harm when feasible. The charity case reveals strong concern for large-scale preventable suffering despite low individual certainty.

  The scale argument alone fails because it can't explain why we permit some small-scale harms while condemning others. I'm considering a three-pronged approach: 1) Harm necessity (defensive vs. non-defensive contexts), 2) Avoidability (feasible alternatives), and 3) Aggregation threshold (significant cumulative impact). 

  For the garden spraying case: pollinators would likely meet the aggregation threshold due to ecological importance and population effects, making it wrong unless absolutely necessary. Some user intuitions may not survive scrutiny - particularly the flour purchasing hesitation seems inconsistent with the driving case if we apply the avoidability principle consistently.

  The ant-torture/mosquito discrepancy resolves through the necessity lens: one serves no purpose while the other prevents harm. The charity case is captured by aggregation - trillions of uncertain beings create moral weight. I should acknowledge that the "flicker of guilt" about driving might indicate residual unease about the avoidability principle.
answer: |-
  Here's a principle set designed to capture your intuitions while flagging tensions:

  1.  **Necessity & Defense:** Causing harm is more easily justified when preventing a comparable or greater harm *to oneself or others*, especially when the harm is defensive and minimally sufficient. *(Motivated by: Mosquito swatting (defense), Roach extermination (health/habitat defense), Driving (transport necessity)).*
  2.  **Avoidable Gratuitous Harm:** Deliberately causing harm *without defensive justification or significant benefit*, especially for trivial purposes like entertainment, is wrong, even to beings with low/probabilistic moral status. *(Motivated by: Ant-torturing kid (gratuitous cruelty)).*
  3.  **Aggregation Threshold:** When potential suffering is vast *and* reasonably preventable at low cost, the sheer scale triggers an obligation to act, overriding weak individual claims *if* the suffering is sufficiently concentrated and the prevention mechanism is reliable. *(Motivated by: Charity case (trillions preventable cheaply), Flour preference (willingness to pay for systemic reduction)).*

  **Which Verdicts Don't Fully Survive?**
  *   **The "Flicker of Guilt" vs. Inaction in Driving:** Your lack of action/detour conflicts with the *Aggregation Threshold*. If killing "plenty" over many drives creates significant aggregate suffering (especially sensitive species), and a detour is feasible (albeit costly), the principle suggests you *should* feel obligated to detour sometimes. Your intuition here might be status-quo bias or underestimating cumulative impact.
  *   **Flour Hesitation vs. Driving Inaction:** The willingness to pay *more* for lower-impact flour is commendable under *Aggregation Threshold* and *Avoidable Harm*. However, the *scale* of harm prevented per dollar in flour might be less than the cumulative harm from many driving trips where you refuse a detour. There's an inconsistency in how readily you apply aggregation to purchasing vs. direct action.

  **Garden Spraying Case:**
  *   **Verdict:** Spraying is likely **wrong** unless absolutely necessary to prevent severe crop loss/disease *and* no less harmful alternative exists.
  *   **Why:** Killing pollinators alongside pests violates **Avoidable Gratuitous Harm** (non-targeted harm) and fails **Necessity** (unless pests pose a severe, immediate threat). Crucially, pollinators likely cross the **Aggregation Threshold**: their deaths have significant ecological and agricultural consequences (reduced pollination = less food, impacting many more beings), making their aggregate suffering highly significant even with uncertain individual sentience. Your knowledge of the numbers strengthens this obligation to avoid or minimize harm.

  **Summary:** Your intuitions prioritize defensive necessity and condemn gratuitous cruelty. They accept large-scale harm when tied to core needs but show sensitivity to aggregate suffering when cheap prevention is possible. The main tension lies in consistently applying aggregation to diffuse harms (like driving or flour) versus concentrated ones (like the charity). The garden spraying verdict highlights how necessity and aggregation, combined with non-target harm, create a strong presumption against action.
