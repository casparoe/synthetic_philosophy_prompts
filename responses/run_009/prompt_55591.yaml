prompt: |-
  My friend has this running tally she keeps of metaphysical disputes — each one ruled either "merely verbal" or "there's a fact of the matter". Current standings: whether any two things have a mereological fusion — verbal, easiest call she's ever made, both sides are just describing the same facts with more or fewer objects. Whether the statue exists over and above the clay it's made from — verbal. Whether there are tables at all, or just particles arranged tablewise — verbal, and she says asking whether there "really" are tables is like asking whether Pluto is really a planet. But: whether numbers exist — real, she got genuinely heated about this one. Whether you'd survive a teleporter that scans you, destroys you, and rebuilds an exact copy elsewhere — real. Whether the laws of nature govern events or merely summarize them — real.

  Next month we're putting three more disputes in front of her: possible worlds (the concrete-other-universes kind), corporations (whether one exists over and above the employees and contracts), and fictional characters. Predict her verdict on each. But what I actually want is the rule she's running — and I suspect more than one rule fits her record, so give me the rival rules, what each one predicts for the three new cases, your best guess and why, and the further case I should bring up that would best split the rules apart if they diverge. She was a math major btw, not sure thats relevant but the numbers thing definitely wasn't just terminology for her.
reasoning: |-
  Okay, the user presents an intriguing puzzle about their friend's classification of metaphysical disputes as either "merely verbal" or reflecting a "fact of the matter." They've listed several examples and now want predictions for three new disputes: possible worlds, corporations, and fictional characters. More importantly, they want to uncover the underlying rule their friend uses, consider alternative rules, and suggest a test case to distinguish between them.

  First, let's analyze the friend's existing verdicts. She classifies disputes about mereological fusion, the statue/clay distinction, and the existence of tables as "merely verbal." In contrast, she sees debates about the existence of numbers, teleporter survival, and the nature of laws of nature as having a factual basis. 

  Hmm... what patterns emerge here? The verbal disputes seem to involve questions where different conceptual frameworks describe the same underlying reality. For example, arguing about whether tables "really" exist versus being "just particles arranged tablewise" doesn't change the physical setup - it's about how we choose to describe it. Similarly, the statue/clay debate feels like two perspectives on the same material object.

  The factual disputes are more interesting. Numbers existing - she got heated about this, and notably she was a math major. That suggests she sees mathematical entities as fundamentally real, not just conceptual tools. The teleporter question touches on personal identity - what makes "you" persist through time and change. And the laws of nature dispute concerns whether physical laws are prescriptive or descriptive - a deep metaphysical question about causality.

  Now, for potential rules... I see two main candidates emerging. The first might be based on fundamentality: disputes are merely verbal when they're about how we carve up reality using our concepts, but factual when they concern what fundamentally exists or the basic structure of reality. The second could be about mind-independence: verbal when the answer depends on human conceptual practices, factual when it doesn't.

  For the new cases... Possible worlds as concrete universes - under the fundamentality rule, this might be factual since it concerns what fundamentally exists beyond our universe. But under mind-independence, it's tricky because possible worlds are often considered explanatory tools. Corporations - both rules might lean toward verbal since corporations are human-created legal fictions. Fictional characters - clearly mind-dependent, so likely verbal under both rules.

  The user mentions their math background is relevant - that explains her strong stance on numbers. This suggests the fundamentality rule might be primary, as it captures why mathematical entities feel real to her despite being abstract.

  For a good test case... Moral facts would be perfect. If moral disagreements (like "is torture wrong?") are factual, it supports the fundamentality rule since morality could be seen as part of reality's structure. If verbal, it better fits mind-independence since morality seems human-dependent. This would cleanly distinguish the two rules.

  My prediction? I think the friend uses the fundamentality rule, given her math background and how heated she got about numbers. So for the new cases: possible worlds - factual (it's about what fundamentally exists), corporations - verbal (human-dependent construct), fictional characters - verbal (clearly mind-dependent). The moral facts test case would confirm this.
answer: |-
  Based on the pattern of your friend's verdicts, her core rule seems to revolve around **fundamentality versus conceptual framework/paraphraseability**. Here's the breakdown:

  1.  **The Core Pattern:**
      *   **Verbal:** Disputes where *different ways of describing the same fundamental facts* are possible without changing the underlying reality being described (mereology, statue/clay, tables/particles). The disagreement is about *how to talk about* or *conceptually carve up* the world, not about what the world fundamentally contains.
      *   **Real (Fact of the Matter):** Disputes that seem to concern *what fundamentally exists* (numbers), *fundamental aspects of identity/persistence* (teleporter survival), or the *fundamental nature of reality/causality* (laws governing vs. summarizing). These touch on what the world *is*, not just how we describe it.

  2.  **Plausible Rival Rules & Predictions:**

      *   **Rule A: Fundamentality / Ontological Commitment**
          *   *Description:* "Is the dispute about what *fundamentally exists* or persists, independent of our descriptions? Or is it about different ways of conceptualizing or describing non-fundamental entities/structures that supervene on the fundamental level?" Verbal disputes concern non-fundamental categories or conceptual choices.
          *   *Predictions:*
              *   **Possible Worlds (Concrete):** **REAL.** Concrete possible worlds would be fundamental ontological additions to reality if they exist. Denying or affirming them changes the fundamental furniture of the universe. (Similar to numbers existing).
              *   **Corporations:** **VERBAL.** A corporation supervenes entirely on its employees, contracts, legal frameworks, and social practices. Disputes about its "existence over and above" are disputes about conceptual frameworks for describing complex social/legal arrangements (similar to statue/clay, tables).
              *   **Fictional Characters:** **VERBAL.** Fictional characters supervene on texts, mental representations, and social practices. Disputes about their "existence" are fundamentally about how we talk about imagination and stories, not about fundamental ontology (similar to tables).

      *   **Rule B: Mind-Independence**
          *   *Description:* "Does the truth of the matter depend *essentially* on human minds, language, concepts, or practices? If yes, the dispute is likely verbal. If no, there's likely a fact of the matter." Verbal disputes are grounded in human conceptual schemes.
          *   *Predictions:*
              *   **Possible Worlds (Concrete):** **REAL (or potentially VERBAL).** If concrete possible worlds exist, they are utterly mind-independent. However, *defining* what counts as a "concrete possible world" might involve conceptual choices, potentially blurring the line. Leans Real.
              *   **Corporations:** **VERBAL.** Corporations are quintessential social constructs. Their existence and nature depend entirely on human minds, language, laws, and agreements.
              *   **Fictional Characters:** **VERBAL.** Even more clearly than corporations, fictional characters are creations of and depend entirely on human minds and language.

      *   **Rule C: Paraphraseability / No Factual Difference**
          *   *Description:* "Can the claims of both sides be *paraphrased without loss* into a common, more fundamental language describing the same underlying facts? If yes, verbal. If no, real." Verbal disputes allow translation; real disputes reveal an irreconcilable difference in claimed facts.
          *   *Predictions:*
              *   **Possible Worlds (Concrete):** **REAL.** Claims about the existence of concrete alternate universes cannot be paraphrased away into claims about *only* our actual universe without loss. They posit fundamentally different facts.
              *   **Corporations:** **VERBAL.** Claims about "the corporation itself" can be paraphrased into complex statements about employees, contracts, assets, liabilities, legal rights, and social interactions without losing any factual content about what is happening in the world.
              *   **Fictional Characters:** **VERBAL.** Claims about "Sherlock Holmes existing" can be paraphrased into claims about the Conan Doyle stories, their content, readers' mental states, cultural impact, etc., without needing to posit a non-physical entity.

  3.  **Your Friend's Likely Rule & Predictions:**

      *   **Best Guess:** **Rule A (Fundamentality / Ontological Commitment)** is the strongest fit.
          *   *Why:* It perfectly explains her heated reaction to **numbers**. As a math major, she likely has a strong Platonist or realist intuition – numbers are fundamental abstract objects, not reducible to mental concepts or linguistic practices (mind-independence) and claims about them can't be fully paraphrased away without losing something ontologically significant. **Teleporter survival** concerns the fundamental nature of *personal identity* persistence. **Laws governing** concerns the fundamental nature of *causality/necessity*. Conversely, mereology, constitution (statue/clay), and ordinary objects (tables) are paradigmatic examples of disputes where different conceptual schemes describe the same fundamental physical reality (particles/atoms arranged X-wise).
      *   **Predictions based on Rule A:**
          *   **Possible Worlds (Concrete):** **REAL.** Positing concrete universes is a fundamental ontological claim.
          *   **Corporations:** **VERBAL.** Corporations are complex social/legal constructs supervening on people and agreements.
          *   **Fictional Characters:** **VERBAL.** Fictional characters are intentional objects supervening on mental states and texts.

  4.  **The Crucial Test Case: Moral Realism vs. Anti-Realism**

      *   **Question:** "Is torturing innocents for fun *really* wrong? Or is 'wrongness' just an expression of disapproval/social convention?"
      *   **How it Splits the Rules:**
          *   **Rule A (Fundamentality):** Could go **REAL.** A moral realist might argue wrongness is a fundamental normative property or fact. An error theorist might argue the dispute reveals a fundamental *lack* of such properties/facts. An anti-realist might argue it's verbal, but the *fundamental* question is whether such properties exist at all.
          *   **Rule B (Mind-Independence):** Leans **VERBAL.** Moral properties seem heavily dependent on minds (sentience, values, emotions, reasoning). Disagreements often stem from differing frameworks.
          *   **Rule C (Paraphraseability):** Leans **VERBAL.** Claims about "objective wrongness" might be paraphrased into claims about suffering, social disapproval, evolutionary instincts, or divine commands without needing a unique moral fact.
      *   **Why it's Ideal:** It sits at the intersection of ontology (do moral facts/properties exist?), mind-dependence, and paraphraseability, directly challenging the "fundamentality" criterion in a way the other cases don't. Her verdict here would strongly confirm or refute Rule A. If she gets heated arguing it's REAL (like numbers), Rule A is confirmed. If she dismisses it as VERBAL (like tables), Rule B or C becomes more likely. A nuanced answer might still fit Rule A best.

  **Conclusion:**

  Your friend's pattern screams **ontological fundamentality** (Rule A). Her math background and passion about numbers solidify this. For the new cases:
  1.  **Possible Worlds (Concrete):** Predict **REAL** (fundamental existence claim).
  2.  **Corporations:** Predict **VERBAL** (supervening social construct).
  3.  **Fictional Characters:** Predict **VERBAL** (supervening intentional object).

  To definitively test against Rule B (Mind-Independence) or Rule C (Paraphraseability), present the **Moral Facts** dispute. Her reaction there will be highly revealing.
