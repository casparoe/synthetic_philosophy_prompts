prompt: |-
  I edit a small blog that sits between philosophy of law and criminal-defense practice, and I want to run an interactive feature called "Which position on moral luck do you actually hold?" The point is to sort readers by what they say about cases, not by which label they like, so the questions must be answerable entirely on intuition, with no philosophical jargon and no reference to any author, position, or paper. A reader who has never heard of the luck debate should be able to complete it, and a reader who has should not be able to tell which answer is supposed to be the sophisticated one.

  Please design the quiz as follows:

  1. Ten questions, each a concrete case with two or three answer options. The cases must include at least the following, though you should add others as needed: (a) two equally drunk drivers, one of whom kills a child who runs into the road while the other arrives home uneventfully; (b) a contrast between a sniper whose bullet is deflected by a bird flying past and one whose rifle jams because of a one-in-a-million mechanical fault, so that the reader is forced to say whether it matters how close the nearest world is in which the intended harm occurs, and not merely whether it occurred; (c) the praise parallel, which most discussions ignore: a rescuer who saves a life partly through luck, testing whether readers treat resultant luck symmetrically between credit and blame or asymmet-rically; (d) constitutive luck: someone recruited into a brutal movement at age eight and indoctrinated, contrasted with someone who despises that movement but, had they been born forty miles away, would have been recruited themselves; (e) discovery luck: two identical acts of embezzlement, one of which comes to light through an unrelated audit and one of which never does, forcing readers to say whether being caught changes anything beyond the practical consequences.

  2. At least two of the ten questions must present a shared scenario whose options split two different axes: what the agent is guilty of (the content of the offense, its severity) versus what it is now fair for others to do in response (punishment, blame, exclusion, demands for apology). These axes are routinely run together in conversation, and my readers argue about them constantly, so the quiz should be able to catch someone whose view is that outcome luck affects the second but not the first.

  3. One further case should involve aftermath rather than act: two people cause the same harm, but for one of them the harm leaves ongoing traces — an injured party they must face, memories, a debt to repair — while for the other it does not (the victim dies instantly with no family, say, versus surviving). This is meant to catch readers whose real view is that outcome luck matters only through the traces it leaves in the agent's subsequent life, not through the bare fact of the outcome.

  4. Build the scoring key from the logical space rather than from a list of names: first set out the combinations of answers the ten questions permit, then locate positions in that space. The key should at minimum be able to identify: the strict view that luck in outcomes never affects blameworthiness; views that accept such luck for how serious the offense is but not for how bad the person is; views that accept luck about circumstances and constitution while denying it for outcomes; the wholesale revisionist conclusion that if luck penetrates this far, blame itself should be abandoned or radically restricted; and views that relocate the whole difference to forward-looking matters — what the agent now owes, or what it is fitting to feel toward them, rather than how much they are to blame. Where a standard label exists for a leaf, use it; where one does not, say so.

  5. Flag explicitly any pair of positions your questions cannot separate, rather than pretending the scoring is finer than it is. And note any answer combinations that are coherent but that no one, to your knowledge, defends — with a sentence each on why: is the combination incoherent, merely unattractive, or just unexplored?

  Do not include a reading list, citations, or references to particular books or articles; the quiz and key should be usable by someone with no way to look anything up.
reasoning: |-
  Okay, the user runs a blog at the intersection of legal philosophy and criminal defense, aiming to create an interactive quiz on moral luck. They want to sort readers based on intuitive case judgments rather than labels, so the quiz must be jargon-free and accessible to all. The requirements are detailed: ten case-based questions covering specific scenarios like drunk drivers, sniper luck asymmetry, rescue praise, indoctrination, and discovery luck.  

  First, I need to ensure all requested elements are covered. The drunk driver case (a) tests outcome luck—same action, different results. For the sniper (b), the key is proximity of harm—mechanical failure vs. bird deflection—to see if near-misses affect blame. The rescuer (c) checks symmetry: does luck in success reduce praise like luck in failure increases blame? Constitutive luck (d) involves upbringing: indoctrinated villain vs. someone who avoided it by chance. Discovery luck (e) asks if getting caught changes moral status.  

  The user also wants two questions splitting guilt from response fairness. For example, a vandalism case could separate offense severity (both equally guilty) from punishment (should the one who damaged more pay more?). Another case—say, workplace negligence—could contrast responsibility for harm (same fault) with demands for repair (only the caught one faces consequences). This targets readers who think outcome luck affects practical responses but not culpability.  

  For aftermath traces (point 3), I consider a car accident where one victim dies instantly (no ongoing burden) and another survives with needs. Does the driver owe more if the victim lives? This probes if moral difference stems from lingering effects, not just the outcome.  

  Now, designing ten cases. Beyond the required five, I add:  
  - A negligence case with divergent outcomes (fire/no fire) to mirror drunk drivers.  
  - A reckless hiker causing a fatal fall vs. a near-miss—testing resultant luck.  
  - A shared scenario for guilt vs. response: two vandals, one hitting a priceless artifact.  
  - Another split: workplace negligence, caught vs. unnoticed.  
  - The aftermath case with death vs. survival.  
  - A praise case: two identical rescue attempts, one successful by luck.  
  - Constitutive luck: cult recruit vs. near-miss twin.  
  - Discovery luck: embezzlers, one audited.  
  - Sniper case with bird vs. jam.  
  - Final split: two identical lies, one with huge consequences.  

  Scoring must map the logical space. Key axes:  
  1. Does resultant luck affect blame? (e.g., drunk drivers, snipers)  
  2. Does it symmetrically affect praise? (rescuer)  
  3. Does constitutive luck affect responsibility? (cult recruit)  
  4. Does discovery change moral status? (embezzlers)  
  5. Do aftermath traces matter beyond outcome? (accident case)  
  6. Can guilt and response diverge? (vandalism, negligence splits)  

  Positions to identify:  
  - Strict: no outcome luck ever affects blameworthiness.  
  - Severity-only: luck affects offense seriousness but not character blame.  
  - Circumstantial/constitutive only: accepts upbringing/context luck but not outcomes.  
  - Revisionist: luck’s pervasiveness undermines blame entirely.  
  - Forward-looking: differences only in obligations/feelings, not backward blame.  

  I’ll flag unresolvable pairs, like distinguishing “severity-only” from “forward-looking” if both answer the guilt/response splits similarly. Also, note coherent but undefended combinations—e.g., accepting constitutive luck but not resultant might be rare but not illogical.  

  Finally, the language must stay intuitive: no “moral luck,” “resultant,” etc. Cases should feel like real dilemmas. For scoring, group answers into profiles (e.g., Profile A: strict on blame, symmetric praise, etc.) and map to positions, acknowledging overlaps.  

  This structure ensures the quiz meets the user’s goal: revealing readers’ true intuitions, sparking debate on the blog without privileging academic labels.
answer: |-
  Here’s a 10-question quiz designed to map intuitive moral luck positions without jargon, followed by a scoring key grounded in logical space:

  ---

  ### **Quiz: Which Moral Luck Position Do You Hold?**
  *Answer based on your gut feeling. No prior knowledge needed.*

  1. **Drunk Drivers**  
     Alex and Taylor both drive home drunk. Alex hits a child who runs into the road; Taylor arrives safely.  
     Should Alex be judged more harshly *as a person* than Taylor?  
     (a) Yes  
     (b) No  

  2. **The Snipers**  
     Two snipers independently plan to kill a target. Sniper A’s bullet is deflected by a rare bird. Sniper B’s rifle jams due to a freak malfunction. Neither harms anyone.  
     Is Sniper A *closer to being a murderer* than Sniper B?  
     (a) Yes, the bird was pure luck  
     (b) No, both equally failed  

  3. **The Lifeguards**  
     Jay and Morgan both spot a drowning swimmer. Both dive in recklessly (ignoring safety rules). Jay reaches the swimmer just in time; Morgan is slowed by a wave. The swimmer Morgan tried to save dies.  
     Is Jay *more praiseworthy* than Morgan?  
     (a) Yes  
     (b) No, they did the same thing  

  4. **The Recruits**  
     Kai was taken by a violent group at age 8 and raised to hate. River grew up 40 miles away, despising that group. Had River been born where Kai was, they’d have joined too.  
     Is Kai *more responsible* for their actions than River?  
     (a) Yes  
     (b) No  

  5. **Embezzlement Discovery**  
     Two employees steal identical amounts from their companies. Lee’s theft is found during an unrelated audit. Sam’s theft is never discovered.  
     Is Lee *more blameworthy* than Sam?  
     (a) Yes  
     (b) No  

  6. **Vandalism Outcome**  
     Casey and Jordan both throw rocks at buildings late at night. Casey breaks a window. Jordan’s rock misses.  
     **Part 1:** Was Casey’s *action* worse than Jordan’s?  
     (a) Yes  
     (b) No  
     **Part 2:** Should Casey owe *more compensation* than Jordan?  
     (a) Yes  
     (b) No  

  7. **Negligence & Consequences**  
     Taylor and Morgan both forget to turn off a gas stove. Taylor’s home burns down; Morgan’s doesn’t.  
     **Part 1:** Is Taylor *more at fault*?  
     (a) Yes  
     (b) No  
     **Part 2:** Should coworkers *treat Taylor worse*?  
     (a) Yes  
     (b) No  

  8. **The Car Accident Aftermath**  
     Two drivers cause identical crashes. Driver A’s victim dies instantly, alone. Driver B’s victim survives with severe injuries and no family support.  
     Does Driver B *owe more to the victim* than Driver A?  
     (a) Yes  
     (b) No  

  9. **Reckless Hikers**  
     Avery and Blake both ignore "Danger" signs on a cliff path. Avery’s friend slips and dies. Blake’s friend doesn’t slip.  
     Should Avery feel *more guilt* than Blake?  
     (a) Yes  
     (b) No  

  10. **The Liars**  
      Riley and Quinn both lie to their partners. Riley’s lie causes a breakup; Quinn’s lie is brushed off.  
      Is Riley *a worse partner* than Quinn?  
      (a) Yes  
      (b) No  

  ---

  ### **Scoring Key: Mapping Your Position**
  *(No labels—just your pattern of answers)*  
  **Axis Breakdown**:  
  - **Resultant Luck**: Affects blame/praise *due to outcomes* (Q1, Q3, Q5, Q6a, Q7a, Q9, Q10).  
  - **Constitutive/Circumstantial Luck**: Affects blame *due to upbringing or context* (Q4).  
  - **Near-Miss Luck**: Blame differs based on *how close harm came* (Q2).  
  - **Aftermath Traces**: Outcome matters only if it *creates ongoing burdens* (Q8).  
  - **Guilt vs. Response Split**: Distinguishes *blameworthiness* from *practical consequences* (Q6a/b, Q7a/b).  

  #### **Core Positions Identified**:  
  1. **Strict Control View** (No outcome luck):  
     - **Answers**: All (b) on Q1, Q2, Q3, Q5, Q6a, Q7a, Q9, Q10; Split on Q4/8.  
     - *Meaning*: Outcomes never affect blameworthiness—only intentions/actions matter.  

  2. **Severity-Only View** (Luck affects offense gravity, not character):  
     - **Answers**: (a) on Q6a, Q7a (actions worse with bad outcomes) but (b) on Q1, Q10 (person not worse). Splits on response questions (e.g., Q6b=a, Q7b=a).  
     - *Meaning*: Luck changes *what you did* (e.g., "caused a death"), not *who you are*.  

  3. **Constitutive/Circumstantial Acceptance** (Luck in upbringing matters):  
     - **Answers**: (a) on Q4. **Plus**:  
       - If (b) on Q1/Q5/Q10: Rejects *resultant* luck.  
       - If (a) on Q1/Q5/Q10: Accepts *all* luck.  

  4. **Forward-Looking View** (Luck affects obligations/feelings, not blame):  
     - **Answers**: (b) on Q1, Q6a, Q7a, Q10 (no blame difference) BUT (a) on Q6b, Q7b, Q8 (different compensation/guilt owed).  
     - *Meaning*: Outcomes change what you *owe* or what others *should feel*, not backward blame.  

  5. **Full Revisionist** (Luck undermines blame entirely):  
     - **Answers**: (a) on Q4 *and* (b) on Q1/Q3/Q5 (symmetry) *and* (a) on Q2/Q8.  
     - *Meaning*: If luck permeates actions/constitution, blame is incoherent.  

  #### **Unresolved Pairs & Notes**:  
  - **Severity vs. Forward-Looking**: Answers to Q6/Q7 may overlap. *Flag*: These positions are separated only if you split guilt/response (e.g., Q6a=b *but* Q6b=a).  
  - **Coherent but Rare**:  
    - "Praise Asymmetry": (a) on Q3 (praise affected by luck) but (b) on Q1 (blame unaffected). *Why rare?* Intuitively, credit/blame feel symmetrical.  
    - "Discovery Matters": (a) on Q5 (discovery increases blame) but (b) on Q1 (outcome doesn’t). *Why rare?* Being caught seems irrelevant to moral worth.  
  - **Incoherent Combo**: (b) on Q4 (constitutive luck doesn’t matter) *and* (a) on Q2 (near-miss matters). *Why?* Both are "non-resultant" luck—accepting one but not the other is arbitrary.  

  #### **How to Use**:  
  Group your answers. Example:  
  - If you answered (b) on all blame questions (Q1, Q2, Q4, Q5, Q6a, Q7a, Q9, Q10) *except* (a) on Q3 and Q8: You hold a **strict control view with aftermath sensitivity**.  

  This isolates intuitions without theory—letting cases drive the taxonomy.
