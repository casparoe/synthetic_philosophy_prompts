prompt: |-
  For a term paper in a political philosophy seminar on Ulysses contracts and constitutional self-binding, I've been asked to write a conceptual chapter, and my supervisor's recurring complaint about the literature is that people argue about isolated cases without ever stating what a theory of legitimate precommitment is supposed to deliver. So, before I touch the cases, I want the specification written out. Please take the role of a political philosopher who has worked on both the rational-choice treatment of self-binding (the Elster tradition, from Ulysses and the Sirens onward) and on constitutional theory, and begin with some quiet brainstorming about the logical space before committing to any list. Then write the desiderata: what an adequate theory of legitimate precommitment has to get right, where the purpose to keep in view is classifying cases — given a concrete episode in which a person or a polity arranges things so that a later self cannot do what it would then choose to do, the theory should tell us whether that binding is legitimate, and if not, whether it is voidable or void.

  I have some candidate requirements I'd like you to consider, prune, or add to. The theory must get the paradigm cases right: Ulysses asking to be tied to the mast and ordering the crew to ignore whatever he later shouts — noting the awkward feature that the binding is at its strongest exactly when the bound party protests; the recovering alcoholic who hands her stash to a friend with instructions not to return it, and who shows up at midnight; Germany's Basic Law making certain principles unamendable via Article 79(3); and the ugly cases, like a constitution entrenching slavery or an incumbent majority entrenching its own incumbency, which had better come out illegitimate and not merely resemble Ulysses with different content. It must also respect distinctions people are prone to collapse: binding oneself versus binding others who never consented (the dead-hand problem — why may one generation of a demos govern the decisions of its successors?); binding against foreseen akratic relapse versus binding against the future's considered judgment, the second looking more like domination the longer it lasts; precommitment versus mere prediction; and reversible versus irreversible self-binding, including the bootstrapping problem of a clause that can be repealed only through the very procedure it forbids. I'd also like you to decide which requirements are genuinely non-negotiable and which are prejudices of one camp — for instance, whether a consent requirement is a genuine desideratum or a liberal reflex that the eternity-clause case makes look fatal — and to flag any pair of desiderata you suspect cannot be jointly satisfied (I half-expect that strong protection against temporary passions and responsiveness to genuinely changed circumstances will conflict, and that saying so explicitly is itself a result, so don't paper over it). Finally, tell me which single requirement does the most to exclude candidate theories.

  Close with a brief scorecard — Elster's account of constitutional precommitment, a Buchanan-style constitutional contractarian view, and Waldron's well-known critique of precommitment in Law and Disagreement — but keep it short, a paragraph at most, since the interesting work is in the criteria and not in the scoring, and I'll be doing the real comparison myself later. A table for the desiderata is fine, as long as each entry carries the motivating case or consideration rather than just a label.
reasoning: |-
  Hmm, the user is working on a political philosophy term paper about Ulysses contracts and constitutional self-binding. They need help developing a clear set of desiderata for what makes precommitment legitimate. Their supervisor has criticized existing literature for focusing on isolated cases without establishing what a theory should actually deliver. 

  The user has provided several key elements they want addressed: paradigm cases (both legitimate like Ulysses and illegitimate like entrenched slavery), important distinctions (self-binding vs binding others, akrasia vs changed judgment), and potential conflicts between requirements. They specifically want me to act as a political philosopher familiar with both rational-choice approaches (Elster) and constitutional theory.

  I notice several layers to this request. On the surface, they need structured criteria for evaluating precommitment legitimacy. But deeper down, they seem to be wrestling with how to reconcile competing philosophical tensions: temporary protection vs permanent entrenchment, individual autonomy vs collective continuity, procedural legitimacy vs substantive justice. The mention of their supervisor suggests they're seeking academic validation while developing original thinking.

  The challenge here is balancing comprehensiveness with coherence. The desiderata must cover all key dimensions without becoming self-contradictory. I should particularly highlight where tensions exist - like between protecting against passions and allowing for changed circumstances - rather than pretending they can be fully resolved. The user seems sophisticated enough to appreciate that exposing contradictions is valuable in itself.

  For the paradigm cases, I'll consider both the classic examples they provided and the underlying principles they represent. Ulysses represents protection against temporary irrationality, while Germany's eternity clause represents durable constitutional principles. The illegitimate cases test limits of substantive injustice and self-dealing.

  The distinctions they mentioned are crucial. Binding future others (dead hand problem) needs different treatment than binding oneself. And we must separate true precommitment (deliberate self-binding) from mere prediction or external constraint. The reversibility issue is especially tricky with constitutional bootstrapping problems.

  The scorecard at the end should be brief but illuminating - showing how major theories succeed and fail against these criteria. Elster captures akrasia but misses democratic legitimacy; Buchanan addresses consent but struggles with intergenerational issues; Waldron's critique exposes problems but offers limited alternatives.

  Most importantly, I need to identify which single requirement does the heaviest lifting in excluding theories. For me that's the "non-domination over time" criterion - it immediately disqualifies any permanent binding against future considered judgment, which eliminates most strong eternity clauses and addresses Waldron's core concern.
answer: |-
  ## Desiderata for a Theory of Legitimate Precommitment: A Conceptual Map

  **Brainstorming the Logical Space:**

  Before listing requirements, let's sketch the landscape. The core puzzle: When is it legitimate for Agent A (individual or polity) at Time T1 to constrain Agent B (a future version of A, or a future generation) at Time T2, preventing B from doing X, *even if* B at T2 rationally wills X? This involves navigating:

  1.  **Agential Identity:** Is B the *same* agent as A (temporal self) or a *different* agent (successor generation)? This fundamentally alters the moral calculus.
  2.  **Motivation for Binding:** Protection against:
      *   *Akrasia* (weakness of will, passion, temporary irrationality - Ulysses paradigm).
      *   *Shifting Preferences/Values* (genuine, considered change over time).
      *   *External Threats* (preventing capture or overthrow).
      *   *Self-Dealing/Entrenchment* (securing power or privilege - the ugly cases).
  3.  **Object of Constraint:** What is being bound? Specific actions (drinking), types of decisions (amending constitution), fundamental principles (human dignity)?
  4.  **Mechanism of Binding:** Formal (constitutional entrenchment, contract) vs. Informal (social norms, personal vows). Reversible vs. Irreversible. Who enforces?
  5.  **Temporal Scope:** Duration of the bind (temporary, indefinite, "eternal").
  6.  **Normative Grounds:** Source of legitimacy (consent, rationality, substantive justice, democratic authorization, procedural fairness).

  **Desiderata for an Adequate Theory:**

  An adequate theory must provide clear, non-arbitrary criteria to classify concrete cases. It must satisfy the following core requirements, balancing them where necessary:

  | **Desideratum** | **Paradigm Case/Consideration** | **Non-Negotiable?** | **Potential Tension With** |
  |-----------------|--------------------------------|--------------------|----------------------------|
  | **1. Akrasia Mitigation** | Ulysses tied to the mast; recovering alcoholic reclaiming stash. Legitimate binding protects against *demonstrably temporary irrationality/passions* the bound self would later regret. | ★ Core Justification | Changed Circumstances; Reversibility |
  | **2. Non-Domination Over Time** | Germany's Basic Law Art. 79(3) vs. entrenching slavery or incumbency. Binding against a future self's/polity's *considered, rational judgment* constitutes domination. Must distinguish protection from tyranny. | ★ Essential | Akrasia Mitigation (duration); Consent |
  | **3. Agent-Specificity Distinction** | Dead-hand problem: Founding generation binding future citizens vs. Ulysses binding future Ulysses. Binding *others* requires stronger justification (e.g., ongoing consent, trusteeship) than binding one's *future self*. Cannot collapse "self" and "other". | ★ Foundational | Consent; Democratic Authorization |
  | **4. Consent/Democratic Authorization (Conditional)** | Founding constitutional contract (Buchanan); Ulysses' initial request. Binding *others* (future generations) requires initial consent or robust democratic authorization. Binding *self* may rely on prior authorization. | Contextual ★ | Dead-hand problem; Non-Domination; Effectiveness |
  | **5. Reversibility Constraint** | Bootstrapping problem (e.g., amendment rule requiring supermajority that itself cannot be amended by lesser majority). Irreversible binding is suspect; mechanisms must exist to escape the bind *if* the future self/polity demonstrates changed circumstances or the bind causes injustice. Reversibility ≠ easy repeal. | ★ Critical | Akrasia Mitigation (effectiveness); Non-Domination |
  | **6. Substance/Justice Constraint** | Entrenching slavery vs. entrenching human dignity. A precommitment violating fundamental principles of justice (even if procedurally "valid") is illegitimate. Substance matters, not just form. | ★ Essential | Democratic Authorization; Consent (tyranny of majority) |
  | **7. Precommitment vs. Prediction Distinction** | Ulysses *ordering* crew vs. merely *predicting* he'll beg. Theory must identify *intentional acts designed to constrain future choice*, not just foresight of constraint. | ★ Definitional | N/A (Conceptual clarity) |
  | **8. Effectiveness (Conditional)** | Ulysses' crew must obey despite pleas. The mechanism must be capable of reliably constraining the future self/polity when the triggering condition (akrasia) arises. | Instrumental | Consent (coercion); Non-Domination (if overused) |
  | **9. Changed Circumstances Sensitivity** | Polity facing unforeseen crisis needing flexibility vs. alcoholic years sober wanting stash for paint thinner. Binding must not prevent rational adaptation to genuinely new, unforeseen, or fundamentally altered contexts. | ★ Important | Akrasia Mitigation (risk of relapse); Reversibility |

  **Crucial Tensions & Excluding Requirements:**

  *   **Core Tension:** **Akrasia Mitigation vs. Changed Circumstances Sensitivity & Non-Domination Over Time.** Protecting against temporary irrationality requires strong, potentially hard-to-overcome binds *exactly when the irrationality strikes*. But this strength inherently risks dominating the future self/polity if circumstances change *or* if the "irrationality" was actually a considered new judgment. **Acknowledging this tension is vital.** A theory must specify *how* it navigates this (e.g., via robust reversibility mechanisms, high bar for "eternity" clauses, clear criteria for identifying akrasia vs. judgment shift).
  *   **Most Excluding Requirement:** **Non-Domination Over Time.** This requirement fundamentally challenges theories built *solely* on initial consent (ignoring future autonomy) or pure rationality-at-T1 (ignoring the moral status of the bound agent at T2). It immediately disqualifies theories that justify permanent entrenchment against future considered judgment (e.g., extreme dead-hand justifications, purely procedural contractarianism ignoring substantive outcomes). It forces the theory to confront the core moral problem: the potential tyranny of the past over the future.

  **Brief Scorecard on Major Theories:**

  *   **Elster (Rational Choice):** Excels at **Akrasia Mitigation** and **Precommitment Definition**. Strong on Ulysses/individual cases. Weak on **Agent-Specificity** (blurs individual/polity), **Non-Domination** (underplays future autonomy), **Substance Constraint** (focuses on procedure/irrationality), and **Democratic Authorization** (skeptical of "collective will"). Struggles with eternity clauses and dead-hand problems.
  *   **Buchanan (Constitutional Contractarianism):** Strong on **Consent/Democratic Authorization** (as hypothetical agreement) and **Precommitment Definition**. Provides a framework for **Agent-Specificity** (contracting agents). Weak on **Non-Domination** (future generations not parties), **Substance Constraint** (potentially justifies unjust entrenchment via procedure), **Changed Circumstances** (contract rigid), and **Reversibility** (bootstrapping problems loom large). The dead-hand problem is acute.
  *   **Waldron (Critique):** Powerful on highlighting the **Non-Domination** problem ("Why should past majorities bind present ones?"), **Democratic Authorization** tensions, and the **Changed Circumstances** argument. Exposes weaknesses in Elster/Buchanan regarding collective agency and disagreement. However, struggles to provide a positive account of legitimate precommitment that handles genuine **Akrasia Mitigation** effectively, risks undervaluing constitutional stability, and offers less on **Substance Constraint** beyond majoritarian process. His focus is largely on exposing problems, not solving them within the precommitment framework.

  This framework provides the conceptual tools and necessary tensions to rigorously analyze your cases. The key is to use these desiderata not as a checklist but as interacting principles whose weight and application must be argued for in specific contexts, always keeping the core tension between protection and domination in view. Good luck with the chapter!
