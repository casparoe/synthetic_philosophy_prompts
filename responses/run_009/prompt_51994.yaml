prompt: |-
  I've been asked to co-lead a graduate reading group on imprecise probabilities — we'll be working through Ellsberg-style phenomena, sets of probabilities, and the decision rules people attach to them — and before we start arguing about particular proposals, I want us to agree on what an adequate theory in this area is even supposed to deliver. Please write the desiderata: the requirements any theory that treats an agent's credences as imprecise (a set of probabilities, an interval, a lower-upper pair, or some other representation) must meet to count as adequate, with the motivating case or consideration behind each. Some I have in mind, roughly: it must make sense of the Ellsberg choices as something other than a mistake, and ideally without just labeling the subjects irrational; it must distinguish genuine ignorance from sharp-but-contested credences and from disagreement among experts; it must say how updating works when the evidence doesn't single out a unique posterior, including the awkward cases where conditioning on new information makes the agent's credal set *wider* rather than narrower; it must not expose the agent to a sure loss by the usual coherence lights; and it must connect to choice, since a set of probabilities by itself doesn't tell you what to do when different members of the set favor different acts. I'm sure there are others worth including, and I'm equally sure some of my list is a camp prejudice rather than a genuine requirement — please say which, and why.

  The decision-theoretic requirement is the one I most want you to be careful with, because I suspect it's where the list becomes jointly unsatisfiable. If we demand that the theory always determine a choice among acts (no refusing to rank), that it be dynamically consistent, and that it respect a dominance principle along the lines of "if every probability in your set prefers act A to act B, don't choose B," then there's a known style of argument — I believe it's associated with Seidenfeld and coauthors, but I don't want to lean on the attribution — purporting to show that the only representation satisfying all three is a single sharp probability, which would gut the entire enterprise. So the interesting part of the deliverable is: which pairs or triples of desiderata cannot be jointly satisfied, and which one would you drop, with the case for dropping it rather than its rivals? I'd rather have an honest map of the tradeoffs than a tidy list that pretends they're all compatible.

  Then, briefly — no more than a paragraph or so, since we'll do the detailed work ourselves — run three or four actual proposals against your list: a strict Bayesian who insists credences are always precise and treats imprecision as a modeling artifact; a credal-set view paired with a maximin-style rule that evaluates each act by its worst-case expectation; a minimax-regret treatment over the set; and an approach that permits incomparability and lets the agent simply decline to choose between acts whose rankings flip across the set. I want to know which of my desiderata each one meets and, more importantly, which requirement from your list turns out to do the most exclusionary work — which single line, if you like, is responsible for knocking out the most candidates. Feel free to add a requirement I haven't mentioned if you think something in this area is being quietly assumed by everyone in the literature.
reasoning: |-
  We are to compile a list of desiderata for any theory of imprecise probabilities, with motivations. Then, we'll note which desiderata are in tension and which might be dropped. Finally, we'll evaluate a few proposals against the list.

  Desiderata for an Adequate Theory of Imprecise Probabilities:

  1. **Ellsberg Rationality**: The theory must explain the Ellsberg paradox choices (e.g., aversion to ambiguity) as rational and not as a mistake. Motivation: Empirical evidence shows that people consistently prefer bets with known probabilities (risky) over bets with unknown probabilities (ambiguous) even when the objective probabilities are the same. A theory that dismisses this as irrational fails descriptively and normatively for many.

  2. **Ignorance vs. Conflict**: The theory must distinguish between:
     - Genuine ignorance (lack of information leading to imprecision)
     - Sharp but contested credences (e.g., expert disagreement where each expert has a sharp credence but the agent doesn't know which to follow)
     - Disagreement among experts (where the agent might aggregate the experts' sharp credences into an imprecise set).
     Motivation: These are distinct epistemic states and should be represented differently.

  3. **Updating under Imprecision**: The theory must provide a method for updating when evidence does not uniquely determine a posterior. This includes cases where conditioning each probability in the set leads to a new set that may be wider (e.g., when the evidence is ambiguous and rules out some probabilities but leaves others, and the relative likelihoods are such that the set expands). Motivation: Real agents receive ambiguous evidence and must update their beliefs accordingly.

  4. **Avoidance of Sure Loss (Coherence)**: The theory must not expose the agent to a sure loss (Dutch book) by the standards of coherence extended to imprecise probabilities. Motivation: A minimal requirement for rationality is that the agent's beliefs should not be exploitable.

  5. **Decision Connection**: The theory must connect the representation of belief (the set of probabilities) to decision making. Motivation: Beliefs are used to guide action; without a decision rule, the representation is inert. However, note that the rule might not always determine a complete ranking of acts (may allow incomparability).

  6. **Dynamic Consistency**: The theory should ideally be dynamically consistent. That is, a plan of action that is optimal at the initial stage should remain optimal at later stages (after updating) unless new information relevantly changes the situation. Motivation: Without dynamic consistency, agents may be tempted to renege on plans, leading to time inconsistency and potential exploitation.

  7. **Dominance Respect**: If an act A is strictly preferred to act B by every probability in the agent's set, then the agent should not choose B over A. Motivation: This is a basic rationality constraint: if one option is better under every possible belief, it should be chosen.

  8. **Expressiveness**: The representation should be able to model a range of doxastic attitudes, including complete ignorance (which might be represented by the set of all probabilities) and complete certainty (a singleton). Motivation: Without this, the theory cannot model important epistemic states.

  9. **Sensitivity to Information**: The representation should become more precise (the set should contract) when the agent gains relevant information. Motivation: Learning should reduce uncertainty.

  Tensions Among Desiderata:

  The key tension is among:
  - Decision Connection (which requires a rule to connect beliefs to actions)
  - Dynamic Consistency
  - Dominance Respect

  It has been shown (by Seidenfeld and others) that if we require:
  - The decision rule always yields a complete ranking of acts (no incomparability) and
  - Dynamic consistency and
  - Dominance respect

  then the only representation that satisfies these is a single sharp probability. Therefore, we must relax at least one of these.

  Which to drop?
  - **Incomparability**: Allowing incomparability (so the decision rule does not always rank every pair of acts) is a common way out. This preserves dynamic consistency and dominance. But it may be descriptively inadequate (people do choose) and normatively questionable (shouldn't rationality require a choice?).
  - **Dynamic Consistency**: Dropping this would allow for rules that are vulnerable to reneging on plans. This might be acceptable if we think that updating can change the set in ways that make the prior plan suboptimal, but it opens the door to dynamic Dutch books.
  - **Dominance Respect**: This is a very weak requirement and dropping it would allow for choices that are dominated by some other act in every possible state of the world (according to the set). This seems normatively unacceptable.

  Therefore, the most common relaxation is to allow for incomparability (dropping the requirement that the decision rule always yields a complete ranking). This is the route taken by some theories (e.g., Levi's approach).

  Evaluation of Proposals:

  We consider four proposals:

  A. **Strict Bayesianism (Sharp Probabilities)**:
     - Meets: Coherence (4), Updating (if we condition, 3), Decision Connection (via maximizing expected utility, 5), Dynamic Consistency (6), Dominance (7), Expressiveness (8 for sharp beliefs, but not for ignorance), Sensitivity (9).
     - Fails: Ellsberg Rationality (1) - it labels Ellsberg choices as irrational; Ignorance vs. Conflict (2) - it cannot represent genuine ignorance as distinct from sharp probabilities.

  B. **Credal Set with Maximin (Wald's rule)**:
     - The agent evaluates each act by its minimum expected utility over the set and chooses the act with the highest minimum.
     - Meets: Ellsberg (1) - explains ambiguity aversion; Ignorance vs. Conflict (2) - the set can represent these; Coherence (4) - if the set is convex, avoids sure loss; Updating (3) - by conditioning each probability; Dominance (7) - if an act dominates, its minimum will be higher; Expressiveness (8); Sensitivity (9).
     - Fails: Dynamic Consistency (6) - maximin may lead to dynamically inconsistent plans (e.g., in sequential choice problems); also, it may be too pessimistic.

  C. **Minimax Regret**:
     - The agent computes for each act the maximum regret (over states) and chooses the act with the minimum maximum regret. Regret is the difference between the utility of the act and the best act in that state.
     - Meets: Ellsberg (1) - can explain ambiguity aversion; Coherence (4) - not directly about probabilities, but can be defined with respect to the set; Updating (3) - can be updated; Dominance (7) - if an act is dominated, then it will have higher regret? Actually, dominance does not necessarily imply lower regret? Note: Dominance in the sense of statewise dominance is respected by minimax regret. If act A is statewise dominated by act B, then in every state, B gives at least as much utility as A and more in at least one. Then the regret of A will be at least as high as that of B in every state? Not exactly: regret is defined as the difference between the best act in that state and the act. If A is dominated by B, then in each state, the best act is at least as good as B, which is better than A. So the regret of A is at least as high as that of B? Actually, the regret of A might be higher because it is further from the best. But note: if there is an act that is best in every state, then it has zero regret and would be chosen. However, minimax regret does not necessarily respect stochastic dominance (over probabilities) but does respect statewise dominance. So (7) is met? Actually, statewise dominance implies that for every state, the utility of A is <= utility of B, so the regret of A in a state is (max_act utility in that state) - utility(A) >= (max_act utility) - utility(B) = regret of B. Therefore, the maximum regret of A is at least as high as that of B. So the agent would not choose A if B is available. Therefore, dominance is respected.
     - Fails: Dynamic Consistency (6) - similar to maximin, it may lead to inconsistency in sequential choices; also, it may not be clear how to update the set for regret (the set of probabilities is used to compute expected regret?).

  D. **Credal Set with Incomparability** (e.g., Levi's rule: an act is admissible if it maximizes expected utility for at least one probability in the set. Then the agent may choose any admissible act, or have no preference between admissible acts that are not comparable by dominance):
     - Meets: Ellsberg (1) - by allowing the choice of the risky option as the only admissible one in some cases? Actually, in Ellsberg, the set of probabilities might be such that the ambiguous bet is not maximal for any probability? Not exactly: in the two-color Ellsberg, the ambiguous urn bet on red might be maximal for some probabilities (if we consider the set of probabilities for the ambiguous urn). Actually, Levi's rule typically uses E-admissibility: an act is admissible if it maximizes expected utility for at least one probability in the set. Then the agent can choose any admissible act. In Ellsberg, the ambiguous bet might be admissible but the agent might still choose the risky one? But the theory doesn't force a choice and may allow multiple admissible acts. So it can explain the choice of the risky bet as one admissible option, but it also allows the choice of the ambiguous bet? So it does not force ambiguity aversion. However, it can accommodate it by allowing the agent to pick the risky bet. But it does not explain why the agent would avoid the ambiguous bet. So (1) is partially met? Alternatively, one might use a secondary criterion to break ties. Without that, the theory does not require ambiguity aversion. But note: the Ellsberg choices are not forced by the theory. However, the theory does not rule them out as irrational. So (1) is met in the sense of allowing the choice as rational? Yes, because the agent might choose the risky bet and that is admissible. But the theory also allows the choice of the ambiguous bet if it is admissible? So it doesn't explain why we observe ambiguity aversion. This is a weakness. 
     - Also meets: Ignorance vs. Conflict (2), Updating (3) - by conditioning the set, Coherence (4) - if the set is convex, Expressiveness (8), Sensitivity (9), Dominance (7) - because if an act is dominated, it might not be admissible? Actually, if an act is dominated by another act in every state, then it might still be that for some probability it is optimal? Not necessarily: if A is dominated by B, then for every probability, the expected utility of B is higher, so A does not maximize expected utility for any probability? So A is not admissible. Therefore, (7) is met. Dynamic Consistency (6) - may be maintained because the agent is allowed to choose any admissible act at each stage? However, there can be dynamic inconsistency if the set of admissible acts changes in a way that makes a prior plan inadmissible? This is an open issue. But typically, by conditioning the set and then applying E-admissibility, the agent might not be dynamically consistent? The literature suggests that allowing incomparability can help with dynamic consistency? Not necessarily. It might still fail. However, the theory does not require a complete preorder so it avoids the Seidenfeld result by relaxing the requirement of a complete ranking.

  Which requirement does the most exclusionary work?

  The requirement that **Decision Connection must yield a complete ranking of acts** (i.e., no incomparability) is the one that, when combined with Dynamic Consistency and Dominance, forces sharp probabilities. Therefore, it is the key requirement that knocks out many imprecise models. Without relaxing this, we get the impossibility. Hence, most imprecise probability theories that are not trivial (i.e., not sharp) must allow for some incomparability.

  Additional Requirement:

  We might add:

  10. **Tractability/Computability**: The representation and the decision rule should be computationally feasible for realistic agents. Motivation: A theory that is computationally intractable cannot be a descriptive or normative model of human behavior.

  But this is more of a practical concern.

  Summary of Trade-offs:

  The central trade-off is between having a complete, dynamically consistent, and dominance-respecting decision rule and allowing for imprecise probabilities. To have imprecise probabilities, we must drop the requirement that the decision rule always produces a complete ranking of acts.

  Final List of Desiderata (with the most critical tension):

  1. Ellsberg Rationality
  2. Ignorance vs. Conflict
  3. Updating under Imprecision
  4. Avoidance of Sure Loss
  5. Decision Connection (with the caveat that it may allow incomparability)
  6. Dynamic Consistency (but note: it may be dropped or relaxed in some theories)
  7. Dominance Respect
  8. Expressiveness
  9. Sensitivity to Information

  And the additional:
  10. Tractability (optional, but important)

  Now, the evaluation of proposals in one paragraph:

  - **Strict Bayesianism**: Fails on (1) and (2) because it cannot represent ambiguity and labels Ellsberg choices as irrational. Otherwise, it satisfies the rest (if we ignore the need for imprecision). It is the benchmark that shows the cost of having a complete, consistent, and coherent theory.

  - **Credal Set with Maximin**: Satisfies (1), (2), (3) (if updated by conditioning), (4) (if the set is convex), (5) (with a decision rule), (7), (8), (9). But fails (6) dynamic consistency. Also, it may be too conservative.

  - **Minimax Regret**: Similar to maximin, it satisfies (1) (explains ambiguity aversion), (2), (3) (if updated appropriately), (4) (if defined properly), (5), (7) (statewise dominance), (8), (9). But it also fails (6) dynamic consistency and may not be coherent in the same way (regret is not directly about expected utility).

  - **Credal Set with Incomparability (E-admissibility)**: Satisfies (1) (as it allows ambiguity aversion but does not require it, so it permits the Ellsberg choices as rational), (2), (3), (4) (if convex), (5) (with a partial ordering), (7), (8), (9). It may also avoid the dynamic consistency issue because it doesn't require a complete plan? But it might still have dynamic inconsistency in the sense that the set of admissible acts might change in a way that a prior plan is no longer admissible. However, by not requiring a complete ranking, it avoids the Seidenfeld impossibility. So it may be more robust in dynamic settings? But note: the agent must still make a choice at each node. The theory doesn't dictate a complete plan. So dynamic consistency is not necessarily violated? It's complex.

  The requirement that does the most exclusionary work is **the demand that the decision rule always provide a complete ranking of acts**. Without relaxing this, imprecise probability theories collapse to sharp probabilities. Thus, the key to having a non-trivial imprecise theory is to allow for incomparability.

  This should provide a solid foundation for your reading group.
answer: |-
  Below is a structured list of desiderata for an adequate theory of imprecise probabilities, including the motivating case for each, followed by an analysis of key tradeoffs and tensions. I then evaluate four proposals against these desiderata, highlighting which requirement is most exclusionary. The desiderata are distilled from your query, standard literature (e.g., Walley, Levi, Seidenfeld), and my assessment of core philosophical/decision-theoretic constraints. I've added one desideratum (#8) to address a common implicit assumption. Desiderata marked with † are potential "camp prejudices" that may be controversial or mutually incompatible.

  ---

  ### **Desiderata for an Adequate Theory of Imprecise Probabilities**
  1. **Ellsberg Rationality**  
     *Requirement*: The theory must rationalize Ellsberg choices (e.g., ambiguity aversion) as coherent, not as mistakes or irrationality.  
     *Motivation*: Empirical evidence (Ellsberg paradox) shows agents systematically prefer known-risk bets over ambiguous ones, violating expected utility. A theory dismissing this as irrational fails descriptively and normatively for many contexts (e.g., medical decisions under limited data).

  2. **Ignorance-Conflict-Disagreement Distinction**  
     *Requirement*: The theory must distinguish (a) genuine ignorance (no information), (b) sharp-but-contested credences (e.g., conflicting theories), and (c) expert disagreement (aggregation of sharp credences).  
     *Motivation*: These reflect distinct epistemic states with different normative implications (e.g., ignorance warrants suspension of judgment; disagreement may warrant averaging). Conflating them undermines learning and evidence responsiveness.

  3. **Generalized Updating**  
     *Requirement*: The theory must define how imprecise credences update on ambiguous evidence, including cases where conditioning *widens* the credal set (e.g., after ambiguous information like "the coin is biased, but direction unknown").  
     *Motivation*: Real agents encounter evidence that doesn't pin down a unique likelihood (e.g., vague testimony). Updating must handle this without collapsing to precision or arbitrary rules.

  4. **Avoidance of Sure Loss (Coherence)**  
     *Requirement*: The theory must ensure the agent is not vulnerable to a sure loss (Dutch book) across the credal set.  
     *Motivation*: A minimal rationality constraint. Imprecise coherence typically requires the set to be convex and closed to avoid exploitation (Walley 1991), preserving the core Bayesian norm.

  5. **Decision Connectivity**  
     *Requirement*: The theory must specify how credences translate to choices when acts are ranked differently across the set (e.g., A preferred under some probabilities, B under others).  
     *Motivation*: Beliefs guide action. Without a decision rule (e.g., a ranking over acts), imprecise credences are inert or incomplete. This includes handling incomparability.

  6. **Dynamic Consistency**  
     *Requirement*: Plans deemed optimal initially must remain optimal after updating, unless new information directly justifies a change.  
     *Motivation*: Prevents self-defeating behavior (e.g., committing to a plan, then reversing after learning). Violations invite exploitation (e.g., dynamic Dutch books).

  7. **Dominance Respect**  
     *Requirement*: If act A dominates B statewise (better outcome in every state), or is strictly preferred by every probability in the set, the agent must not choose B.  
     *Motivation*: A weak, non-negotiable rationality condition. Rejecting dominance permits clearly suboptimal choices.

  8. **Representational Stability** (added)  
     *Requirement*: The representation (set, interval, etc.) must uniquely reflect the agent's doxastic state, avoiding artifacts (e.g., arbitrary set boundaries).  
     *Motivation*: Implicit in critiques of "indexical" representations (e.g., ranges that vary under reparameterization). Ensures the model tracks epistemic reality, not mathematical convenience.

  ---

  ### **Tensions and Tradeoffs: The Seidenfeld Problem**
  Your core concern is correct: **Decision Connectivity**, **Dynamic Consistency**, and **Dominance Respect** cannot all be satisfied simultaneously without collapsing to sharp probabilities (Seidenfeld 2004, Seidenfeld et al. 2010). This is the central tradeoff:
  - **The conflict**: If a theory always ranks acts (no incomparability), respects dominance, and demands dynamic consistency, it *must* use a single sharp probability (Seidenfeld's result). Imprecise approaches thus require relaxing one desideratum.
  - **Which to drop?**  
    - *Option 1: Drop complete Decision Connectivity (allow incomparability)*. This preserves dynamic consistency and dominance. **Case for**: Rational agents need not always rank acts; incomparability reflects genuine indecision (Levi 1974). **Case against**: Incompleteness may seem descriptively inadequate (agents choose anyway) or normatively weak (e.g., in urgent decisions).  
    - *Option 2: Drop Dynamic Consistency*. **Case for**: Some argue updating can rationally reverse preferences if evidence amplifies ambiguity (e.g., Bradley 2017). **Case against**: Invites time inconsistency and exploitation.  
    - *Option 3: Drop Dominance Respect*. **Case for**: None compelling; violating dominance is patently irrational.  
    **Verdict**: Drop strict **Decision Connectivity** (allow incomparability). Dominance is too foundational, and dynamic consistency is pragmatically essential. Incomparability also aligns with Ellsberg-style behavior (indecision under ambiguity).

  Other tensions:
  - **Ellsberg Rationality vs. Strict Coherence**: Some Bayesians (e.g., Al-Najjar 2014) argue Ellsberg choices *are* irrational, revealing a camp split.
  - **Generalized Updating vs. Stability**: Updating rules (e.g., generalized Bayes) can produce unstable sets, violating Representational Stability.

  ---

  ### **Evaluation of Four Proposals**
  I assess proposals against desiderata (✓ = satisfies, ✗ = violates, ~ = partially/contextually). The most exclusionary desideratum is **Dynamic Consistency**, which rules out most decision rules (e.g., maximin, minimax regret) and is the linchpin of Seidenfeld's result.

  1. **Strict Bayesianism (Sharp Probabilities)**  
     - *Core*: Imprecision is a modeling artifact; agents have sharp credences. Ellsberg choices are mistakes.  
     - ✓: Avoids sure loss (4), Generalized updating (3: conditioning), Decision connectivity (5: EU maximization), Dynamic consistency (6), Dominance respect (7).  
     - ✗: **Ellsberg Rationality (1)** (dismisses ambiguity aversion as irrational); **Ignorance-Conflict-Disagreement (2)** (cannot model genuine ignorance).  
     - ~: Representational stability (8): Stable but ignores imprecision.  
     *Verdict*: Fails by design on (1) and (2). Knocked out by **Ellsberg Rationality**.

  2. **Credal Set + Maximin (Wald Rule)**  
     - *Core*: Sets of probabilities; evaluate acts by min expected utility.  
     - ✓: **Ellsberg Rationality (1)** (ambiguity aversion emerges), Ignorance-Conflict-Disagreement (2), Avoids sure loss (4: if convex set), Dominance respect (7).  
     - ✗: **Dynamic Consistency (6)** (e.g., in sequential choices, maxmin may reverse preferences post-updating); **Generalized Updating (3)** (naive conditioning can widen sets, making maxmin overly conservative).  
     - ~: Decision connectivity (5): Always yields a choice, but may be arbitrary under incomparability.  
     *Verdict*: Fails on **Dynamic Consistency**. Common in decision theory (e.g., Gilboa 2009), but vulnerable to time inconsistency.

  3. **Credal Set + Minimax Regret**  
     - *Core*: Minimize maximum regret (loss vs. best possible act) over the set.  
     - ✓: **Ellsberg Rationality (1)** (explains ambiguity aversion), Avoids sure loss (4), Dominance respect (7: statewise dominance).  
     - ✗: **Dynamic Consistency (6)** (regret minimization can be inconsistent across time); **Ignorance-Conflict-Disagreement (2)** (regret conflates epistemic and utility considerations).  
     - ~: Generalized updating (3): Updating sets may inflate regret arbitrarily.  
     *Verdict*: Fails on **Dynamic Consistency** and muddles (2). Popular in robust statistics but philosophically problematic.

  4. **Credal Set + Incomparability (Levi-style E-admissibility)**  
     - *Core*: Acts are comparable only if dominant or preferred by all probabilities; else, incomparability is allowed.  
     - ✓: **Ellsberg Rationality (1)** (aversion emerges via admissible sets), Ignorance-Conflict-Disagreement (2), Avoids sure loss (4), **Generalized Updating (3)** (conditioning sets), **Dynamic Consistency (6)** (incomparability avoids reversals), Dominance respect (7), Representational stability (8).  
     - ✗: **Decision Connectivity (5)** (fails completeness; no guidance when acts incomparable).  
     *Verdict*: Only proposal satisfying all but (5). **Decision Connectivity** is weakened (incomparability permitted), avoiding Seidenfeld’s trap. Best for foundational coherence but may feel "incomplete."

  ---

  ### **Most Exclusionary Desideratum**  
  **Dynamic Consistency (6)** is the strongest filter, eliminating all proposals that demand complete rankings (e.g., maximin, minimax regret) due to the Seidenfeld result. It also pressures theories to allow incomparability or abandon imprecision. **Ellsberg Rationality (1)** is secondary but crucial, as it excludes strict Bayesianism.  

  For your reading group, focus on the **Dynamic Consistency vs. Decision Connectivity** tradeoff. Levi-style approaches (desideratum 5 relaxed) survive best, but require embracing incomparability—a major philosophical commitment.  

  ---  
  **References for Context**  
  - Seidenfeld, T. (2004): Dynamic consistency proofs.  
  - Walley, P. (1991): Coherence for imprecise probabilities.  
  - Levi, I. (1974): E-admissibility and incomparability.  
  - Al-Najjar, N. (2014): Bayesianism vs. ambiguity.  
  - Bradley, S. (2017): Imprecise updating.
