              - Then, we select 4 individuals from the parent group with replacement, where the probability of selecting an individual is proportional to the individual's tokens (within that group). Each selected individual produces one offspring with the same strategy.

          This way, we have two levels of selection: group selection (by selecting groups with probability proportional to group fitness) and within-group selection (by selecting individuals within a group with probability proportional to individual fitness).

