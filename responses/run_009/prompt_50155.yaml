  We are going to design an in-class game to simulate the units of selection debate. The goal is to have students experience the tension between individual and group selection in a multi-level scenario. The core idea: within a group, defectors do better than cooperators, but groups with more cooperators are more productive and thus contribute more to the next generation.

  Game Design:

  1. **Setup**:
     - The class is divided into small groups (e.g., 4 groups of 3-4 students each). Each group is a "tribe".
     - Each student is an individual in the tribe and will make a decision: cooperate (C) or defect (D).
     - We will use tokens to represent resources (or fitness). Each token can be thought of as a unit that can be converted into offspring.

  2. **Game Rounds**:
     - The game will run for several generations (maybe 3-4 to fit in the time).
     - Each generation has two phases:
       a. **Within-group phase (resource collection)**:
          - Each cooperator in a group contributes 2 tokens to a group pot but at a cost of 1 token to themselves (so net gain of 1 token for the group per cooperator, but the cooperator pays a cost).
          - Each defector contributes nothing to the group pot but pays no cost. Defectors can free-ride.
          - However, the group pot is divided equally among all members of the group (including defectors). This creates a public goods game.

          So, for a group with `c` cooperators and `d` defectors (total `n = c+d`):
            - Total group pot = 2 * c
            - Each member (whether C or D) gets an equal share: `2c / n`
            - Additionally, each cooperator pays a cost of 1 token. Therefore:
              - A cooperator's total tokens = (2c / n) - 1
              - A defector's total tokens = (2c / n)

          It's clear that within a group, defectors always do better than cooperators because they get the same share without paying the cost.

       b. **Between-group phase (reproduction)**:
          - The total tokens of the group are summed. This is the group's total productivity.
          - The next generation of groups is formed by selecting groups with probability proportional to the group's total tokens (i.e., group fitness). 
          - However, we cannot have groups growing without bound, so we fix the total number of groups. We'll have the same number of groups in the next generation (say 4 groups). We do this by having each group produce a number of offspring groups proportional to its total tokens, and then we sample 4 groups from the offspring pool.

