            - The actual change: p1_actual - p0

          And we see that p1_actual is not p_A + (p_B - p0) because the within-group selection in the actual run is happening on the groups that were selected by group selection. So we can compute:

            After group selection, we have a new set of groups (with composition as the parent groups) and the frequency p_A. Then we apply within-group selection to these new groups to get p1_actual.

            So the within-group effect in the actual run is p1_actual - p_A.

            Therefore, total change = (p_A - p0) + (p1_actual - p_A) = p1_actual - p0.

          This decomposition shows the two components.

     - Step 8: We do this for one generation to illustrate.

     - Step 9: Debrief.

  10. **Time Management**:

      - The game might take the whole 80 minutes if we do 3 generations and the accounting. We might only do 2 generations and then the accounting for one generation.

      - Alternatively, we can run one generation as a class and then have the students do the next generation in their groups with guidance.

      - We can use a spreadsheet to do the calculations quickly.

  11. **Conclusion of the Game**:

      - The key moment: when they see that the same change can be partitioned into a group component and a within-group component, and that both are real and measurable. This breaks the folk story that group selection is always wrong.

      - The remaining dispute: what is the causal story? And what is the primary unit of selection? But the accounting is equivalent.

      - The cost of insisting on one level: if we only look at the individual level, we might miss the group-level causes that are essential to understanding the dynamics.

  Given the complexity, we might have to adjust on the fly. But this design should create the experience we want.
answer: |-
  Below is a complete in-class game design to disrupt the folk history of the units of selection debate. The game forces students to experience the tension between individual and group selection, demonstrates that multi-level accounting yields identical evolutionary outcomes, and highlights that the debate hinges on interpretation—not mathematical correctness. The session runs in 80 minutes with no prep needed.

  ---

  ### **Game Title: Tribe Survival**
  **Core Tension**: Within each group, defectors outcompete cooperators, but groups with more cooperators produce more offspring. Students must balance short-term self-interest against long-term group survival.

  #### **Learning Goals**:
  1. Feel the conflict between within-group and between-group selection pressures.
  2. Discover that individual- and group-level accounting predict identical population trajectories.
  3. Recognize that the "real" unit of selection is a philosophical dispute, not an empirical one.

  ---

  ### **Game Setup** (15 mins)
  - **Students**: 14 (split into 7 groups of 2 students each).  
  - **Roles**: Each student is a "cell" in a "tribe" (group). Each chooses a strategy:  
    - **Cooperators (C)**: Pay a cost to boost group reproduction.  
    - **Defectors (D)**: Free-ride; no cost, no contribution.  
  - **Tokens**:  
    - **Energy Chips** (e.g., poker chips): Represent fitness.  
    - **Tribe Tokens**: Colored paper (one color per tribe) to track group offspring.  
  - **Reproduction Scheme** (Whiteboard Table for Easy Calculation):

  | Tribe Composition | C's Fitness | D's Fitness | Tribe Fitness |
  |-------------------|-------------|-------------|---------------|
  | 2C, 0D            | 1           | —           | 4             |
  | 1C, 1D            | 0           | 2           | 2             |
  | 0C, 2D            | —           | 1           | 1             |

  - **Rules**:  
    - **Within-group payoffs**:  
      - C pays 1 energy to add 2 to the **tribe fitness**.  
      - D pays nothing and steals from C's contribution: D's fitness = (Total energy from C's)/number of D's.  
    - **Between-group competition**:  
      - Tribes reproduce based on **tribe fitness** (e.g., Tribe Fitness 4 = 4 offspring tribes).  
      - Offspring tribes inherit parent strategies (e.g., a 2C tribe produces four 2C tribes).  
    - **Mutation**: When tribes reproduce, 10% of offspring "mutate" (flip a coin: C↔D).  

  ---

  ### **Game Procedure** (45 mins)
  **Round 1: Initial Population**  
  - Assign tribes: 3 tribes of 2C, 3 of 1C+1D, 1 of 2D (mirrors high cooperation early in evolution).  
  - **Calculate Payoffs**:  
    - Students compute fitness using the table (e.g., 1C+1D tribe: C gets 0, D gets 2 energy).  
    - **Record** on the board: Individual energy (fitness) and tribe fitness.  

  **Round 2: Reproduction**  
  - **Tribe Reproduction**: Each tribe produces offspring equal to its tribe fitness.  
    - *Example*: A 2C tribe (fitness 4) makes 4 offspring tribes (all 2C, but 10% mutation may flip one cell).  
  - **Form New Generation**:  
    - Total offspring tribes = Sum of all tribe fitness.  
    - **Cap Population**: Only 7 tribes survive (randomly cull excess to maintain 14 students).  
  - **Update Board**: New tribe compositions (e.g., 2C tribes increase, 2D tribes decrease).  

  **Round 3: Repeat**  
  - Recalculate payoffs and reproduce again.  
  - Track global frequency of C vs. D alleles.  

  ---

  ### **The Accounting Moment** (15 mins)
  After 2-3 generations, project the board and compute:  
  1. **Individual-Level Accounting**:  
     - Calculate allele frequency change: %C in Gen 1 vs. Gen 3.  
     - Use **individual fitness** (energy chips): Avg. fitness of C vs. D alleles.  
  2. **Group-Level Accounting**:  
     - Track **group fitness**: Tribes with more C’s produced more offspring.  
     - Use **tribe composition**: % of tribes with 2C increased/decreased.  
  3. **Reveal**: Both methods show identical allele frequency change.  
     - *Example*: If C’s increased from 50% to 60%, both accountings confirm it.  

  > **Key Script**: "Look: whether we count selfish alleles or altruistic groups, we get the same outcome. Williams and Dawkins didn’t ‘disprove’ group selection—they just booked the math differently. The fight isn’t about who’s *correct*; it’s about what *causes* the change."

  ---

  ### **Debrief** (15 mins)
  Use the board to map the game onto theory:  
  1. **Price Equation Breakdown**:  
     - Δp = (Between-group selection) + (Within-group selection)  
     - **Between-group**: Tribes with more C’s had higher fitness (drove Δp up).  
     - **Within-group**: In mixed tribes, D’s always outcompeted C’s (drove Δp down).  
  2. **The Real Debate**:  
     - **Causation**: Does group fitness *cause* change, or is it a byproduct of individual selfishness?  
     - **Selection *for* vs. Selection *of***: Are groups selected *for* (adaptation) or just selected (artifact)?  
  3. **Cost of Insisting ‘Real’ Units**:  
     - Ignoring groups obscures why cooperation persists despite selfishness.  
     - Dawkins’ gene-eye view works mathematically but misses emergent dynamics.  

  > **Punchline**: "The math is agnostic. Whether you see ‘selfish genes’ or ‘altruistic groups’ depends on your lens. The folk history simplifies this into a war—but it’s a bookkeeping truce."

  ---

  ### **Predictable Problems & Fixes**
  - **Problem 1: Cross-tribe collusion** (e.g., "Let’s all be C!").  
    - **Fix**: Assign tribes secretly (write strategies on cards). Enforce no inter-tribe talk.  
  - **Problem 2: Arithmetic bogs down**.  
    - **Fix**: Pre-calculate payoffs on handouts. Use apps (e.g., random selector) for reproduction.  
  - **Problem 3: Oversimplified selection**.  
    - **Fix**: Add "environmental shocks" (e.g., roll a die: on 1, a random tribe dies) to intensify group competition.  

  ---

  ### **What the Game Can’t Do**
  1. **Continuous Traits**: The game uses binary strategies (C/D), not quantitative traits (e.g., investment levels).  
     - *Supplement*: Whiteboard a continuous model (e.g., cooperativeness from 0–100) to show the same accounting holds.  
  2. **Causal Depth**: Students may not grasp why equivalence matters.  
     - *Bridge*: Contrast "selection of groups" (descriptive) vs. "selection for groupiness" (causal) with a real example (e.g., apoptosis in cancer).  

  ---

  ### **Why This Works**
  - **Tangible Tension**: Students feel the push-pull of cheating vs. group survival.  
  - **Aha! Moment**: Dual accounting forces them to see the folk history is a false dichotomy.  
  - **No Reading**: The game generates insights from lived experience, not lecture.  

  Run this, and your students will leave with the folk story in pieces—and a craving to argue about what *really* matters.
