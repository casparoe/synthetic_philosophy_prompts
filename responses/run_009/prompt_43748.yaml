  Finally, I'll rank objections by damage potential: projection > compositionality > phenomenology > Donnellan, since the first two threaten the core framework, while the latter are more localized. The user's semantics/pragmatics split *is* defensible but requires careful boundary-drawing—I'll note where it might wobble under pressure. 

