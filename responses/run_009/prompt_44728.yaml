            Pre-coin: willing to bet (so they are not too risk averse to bet at even odds when the probability is 0.5).
            Post-coin: refusing both sides (so they are not acting as if they have a precise p>0.5 or <0.5).

          This is inconsistent with a single precise prior.

          Therefore, the activity does distinguish.

  Potential failure modes:

  1. The two or three students who will cheerfully bet on anything and never display any ambiguity aversion.

     - They might bet in the post-coin flip stage. How to handle? 
          We note that in the debrief: not everyone is ambiguity averse. Some people are ambiguity neutral. We can point out that the dilation occurs regardless of behavior: the set of priors dilates. And for those who are ambiguity neutral, they might have a decision rule that leads them to bet. But we can still see that the set of priors has dilated.

     - We also have the forced-choice: these students will choose to bet. Then we can show that their decision rule might be, say, choosing the action that is best in the average prior? Or they might be using a single prior that they pick arbitrarily? 

     - We can use their behavior to illustrate that different people have different attitudes.

  2. The sharper ones who will work out the dilated structure in advance.

     - They might not display the change in behavior? Because they know that after the coin flip, E becomes ambiguous? 

     - How to keep them useful? 
          Ask them to help run the activity? Or in the debrief, ask them to explain the formal model? 
          Or during the forced-choice, ask them to explain their choice and how it relates to the decision rules.

     - We can also challenge them: "How would you explain the behavior of the other students?"

  3. The risk that the token payoffs are too small to move anyone.

     - Solution: use bigger incentives? Or use course credit? Or use a participation grade? But we said small amount.

     - We can also appeal to their intellectual curiosity: "Even though the tokens are small, please try to behave as if it were real money." 

     - Alternatively, we can use a hypothetical: "Imagine that these tokens represent real money. How would you choose?"

  What the activity cannot reproduce and must be supplied:

     - The activity uses a discrete set of priors (three points) to represent the interval. The dilation is to a set of three points. We must explain that in general, it can be a continuous interval.

     - We must also explain that the set of priors is updated by conditioning each prior on the evidence (the coin flip). And that the dilation happens regardless of the outcome of the coin.

     - We must emphasize that the coin flip is uninformative about the urn, so it's surprising that conditioning on it causes a loss of precision.

     - We must clarify that the dilation is a property of the representation: the set of posteriors is the entire set of priors for A (or 1-A) and hence the interval [1/4,3/4] for E.

     - We must also note that the forced-choice decision shows that the interval doesn't dictate a unique action. We have to choose a decision rule.

     - Finally, we must be explicit about the interpretation: the change in betting behavior (willing to bet pre-coin, refusing both sides post-coin) is evidence for a set of priors and against a single precise prior (with linear utility). We must state that we are assuming linear utility in tokens.

  Revised timeline with more detail:

    - 0:00-0:10: Introduction 
          - Explain the urn: 4 balls, 1,2, or 3 red. Fixed but unknown.
          - Explain the coin: fair, independent.
          - Define E: if heads, E = red; if tails, E = blue.
          - Explain the token system: starting with 10 tokens. Each token is worth a small amount of credit (or candy).
          - Explain the bets: 
               FOR bet: if you take it, you get +1 token if E occurs, -1 if not.
               AGAINST bet: +1 if not-E, -1 if E.

          - Note: we are going to do two rounds of betting: one now (before the coin flip) and one after the coin flip.

    - 0:10-0:20: Pre-coin flip betting
          - Ask: "We are offering the FOR bet on E: who wants to take it?" (record number)
          - Ask: "Who wants to take the AGAINST bet?" (record number)
          - Ask: "Who wants to take neither?" (record)
          - Note: they can only take one of the bets or none.

    - 0:20-0:25: Coin flip
          - Flip the coin and record the outcome.

    - 0:25-0:35: Post-coin flip betting
          - Remind them: now we know the coin outcome. 
          - Offer the same two bets again.
          - Record: 
               Who takes FOR? 
               Who takes AGAINST?
               Who takes neither?

    - 0:35-0:45: Forced-choice
          - Explain: now we force a choice between:
               Option1: Take the FOR bet on E (at even money: +1 if E, -1 if not)
               Option2: Pay 0.5 tokens to avoid the bet.
          - They must choose one.
          - Collect choices.

    - 0:45-0:50: Resolution
          - Draw a ball from the urn (shake well and draw randomly).
          - Determine E (based on the coin and the ball).
          - Resolve all bets: 
               Pre-coin bets and forced-choice bets.
          - Reveal the urn composition.

    - 0:50-1:30: Debrief
          - Ask for reactions: why did they change their minds?
          - Formal model: 
               Set of priors: three point masses.
               Update by conditioning: after coin flip, E becomes A (if heads) or not-A (if tails).
               Dilation: the interval for E becomes [1/4,3/4].
          - Forced-choice: 
               Expected utilities for each prior.
               Decision rules: maximin, E-admissibility, minimax regret.
          - Why this supports the set of priors: 
               The change from willingness to bet (pre) to refusing both (post) is inconsistent with a single precise prior and linear utility.

  Additional materials to prepare:

    - Urn: a bag with 4 balls (say, 2 red and 2 blue? but we don't reveal until the end). We can have three bags prepared? But we only use one. We choose one in advance (say, the 2 red and 2 blue) and put it aside.

    - Coin.

    - Tokens: 10 per student.

    - Recording sheets for the instructor to record the numbers in each stage.

    - Optional: slides for the debrief.

  This should work.
answer: |-
  Below is a comprehensive session plan for your 90-minute seminar on dilation in imprecise probabilities. The activity is designed to make dilation concrete and emotionally salient, while addressing your pedagogical goals and potential pitfalls. I'll break it down into rules, materials, timeline, debrief, failure modes, and limitations.

  ---

  ### **Rules & Physical Setup**
  **Materials**:
  - **Urn (for event A)**: Opaque bag with 20 balls (5 red, 15 blue) to represent \(P(\text{red}) = 1/4\) (adjust proportions if needed, but ensure \(P(A) \in [1/4, 3/4]\)). *Seal the bag*—students never see inside until the end.
  - **Coin (for event C)**: Fair coin (heads/tails).
  - **Event E**: Define \(E = A\) if heads, \(\neg A\) if tails. Use a whiteboard to display:  
    \[
    E = \begin{cases} 
    \text{"Red ball drawn"} & \text{if heads} \\
    \text{"Blue ball drawn"} & \text{if tails}
    \end{cases}
    \]
  - **Betting tokens**: Poker chips or slips of paper (1 token = 0.1% course credit or a small prize). Each student starts with 10 tokens.
  - **Betting options**: All bets are even-money (bet 1 token to win 1 net gain if correct, lose 1 if wrong).  
    - **FOR bet**: Gain if \(E\) occurs.  
    - **AGAINST bet**: Gain if \(\neg E\) occurs.  
    - **Avoidance fee**: Pay 0.5 tokens (forced-choice stage only).

  **Setup**:
  - Students sit in a circle with urn, coin, and whiteboard visible.
  - Urn composition is fixed but unknown to students (only that \(P(\text{red}) \in [1/4, 3/4]\)). Emphasize independence: "Coin flip tells you nothing about the urn; urn tells you nothing about the coin."

  ---

  ### **Timeline (90 Minutes Total)**

  | **Phase**          | **Time** | **Key Activities**                                                                                                                                 |
  |---------------------|----------|---------------------------------------------------------------------------------------------------------------------------------------------------|
  | **1. Introduction** | 10 min   | - Recap Ellsberg (no re-dramatization). <br>- Explain the setup: urn \(A\) (\(P(A) \in [1/4, 3/4]\)), fair coin \(C\), derived event \(E\). <br>- Clarify betting rules and token payoffs. |
  | **2. Pre-Coin Betting** | 15 min   | - **Offer even-money bets on \(E\)**: Students choose FOR, AGAINST, or NO BET. <br>- Record votes on whiteboard. <br>- *Emotional arc*: Comfort taking either side (expected: ~50% FOR, ~50% AGAINST). |
  | **3. Coin Flip**    | 5 min    | - Flip coin publicly; record outcome (e.g., heads). <br>- Remind students: "Coin is fair and independent—this told you nothing new about the urn." |
  | **4. Post-Coin Betting** | 15 min   | - **Re-offer identical bets on \(E\)** (now tied to observed coin outcome). <br>- Record votes. <br>- *Emotional arc*: Reluctance to bet (expected: majority NO BET). |
  | **5. Forced Choice** | 10 min   | - **Compulsory decision**: <br> a. Accept even-money bet on \(E\) (FOR or AGAINST). <br> b. Pay 0.5 tokens to avoid betting. <br>- Students write choices privately; collect and tally. |
  | **6. Resolution**   | 5 min    | - Draw a ball from urn; resolve all bets based on \(E\). <br>- Reveal urn composition (5 red, 15 blue). Payout tokens. |
  | **7. Debrief**      | 30 min   | - Map activity to formalism (see below). <br>- Discuss decision rules and emotional response. |

  ---

  ### **Debrief: Mapping Activity to Formalism**
  1. **Pre-coin state (Precision)**:
     - **Formal**: Set of priors \(\mathcal{P}\) for \(A\): \(P(A) \in [1/4, 3/4]\). For \(E\), \(P(E) = P(A)P(C) + P(\neg A)(1 - P(C)) = 0.5\) for all \(P \in \mathcal{P}\) → precise probability.
     - **Activity link**: Pre-coin betting shows willingness to accept even odds. "You acted as if \(P(E) = 0.5\)—because every prior agreed."

  2. **Post-coin update (Dilation)**:
     - **Formal**: Condition on \(C =\) heads → \(E = A\). Updated set: \(P(E \mid C) = P(A) \in [1/4, 3/4]\). Interval widens regardless of \(C\).
     - **Activity link**: Post-coin reluctance to bet. "You knew in advance that learning \(C\) would make you less precise. Dilation is foreseeable yet unsettling."

  3. **Forced choice (Decision rules diverge)**:
     - **Formal**:  
       - **Maximin**: \(\min EU(\text{bet}) = \min\{-0.5, 0, 0.5\} = -0.5\) (same as avoidance fee). Indifferent.  
       - **E-admissibility**: Betting is optimal for some priors (e.g., \(P(A)=3/4\)), avoidance for others (e.g., \(P(A)=1/4\)). Both admissible.  
       - **Minimax regret**: Betting has max regret 0; avoidance has max regret 1 → prefers betting.
     - **Activity link**: Tally forced choices. Some bet (minimax regret); others pay (E-admissibility/maximin). "Your interval didn’t tell you what to do—your decision rule did."

  4. **Emotional arc**:  
     - "Before the flip, you were comfortable betting. After, the same bet felt toxic—even though the coin was uninformative. Dilation forces ambiguity back into your worldview."

  ---

  ### **Predictable Failure Modes & Solutions**
  1. **"Ambiguity lovers" who always bet**:  
     - **Why**: 2–3 students may see tokens as "play money" or enjoy risk.  
     - **Solution**:  
       - In debrief, contrast their behavior with the majority. "Who here *wanted* to bet post-coin? What rule might you be using?" (E.g., they might default to a single prior like \(P(A) = 0.5\)).  
       - Use their choices to highlight divergence in decision rules.

  2. **Sharp students who deduce dilation early**:  
     - **Why**: They may see that \(E\) inherits \(A\)’s imprecision post-coin.  
     - **Solution**:  
       - Assign them roles: "Help me record bets" or "Lead a subgroup discussion during forced choice."  
       - Challenge them: "How would you explain dilation to someone who thinks conditioning *always* sharpens beliefs?"

  3. **Token payoffs too weak to motivate**:  
     - **Why**: Small stakes may not trigger ambiguity aversion.  
     - **Solution**:  
       - Pre-commit to consequences: "Tokens determine bonus points; top 3 get prizes."  
       - Frame hypothetically: "Imagine each token = $10. Would you still take this bet?"  
       - If engagement lags, escalate: "Avoidance fee now 1 token!" (adjust in real-time).

  ---

  ### **Limitations & What You Must Assert**
  **Where Behavior Alone Fails**:  
  - **Single prior + non-linear utility**: A student refusing bets post-coin *could* have a precise \(P(E \mid C) = 0.5\) but convex loss aversion (e.g., they hate symmetric losses more than gains).  
  - **What the activity cannot distinguish**:  
    - Genuine imprecise credence vs. precise credence + "funny" utility.  
    - The set of priors vs. other ambiguity models (e.g., multiple selves).  

  **What You Must Supply in Debrief**:  
  1. **Assume linear utility in tokens**: Assert that tokens map linearly to utility. If students treat gains/losses symmetrically (per pre-coin betting), non-linear utility is unlikely to explain post-coin reluctance.  
  2. **Interpret the shift**: "Pre-coin, you acted as if \(P(E)\) was sharp. Post-coin, you acted as if no single probability captured your beliefs. The simplest explanation is dilation in a set of priors."  
  3. **Acknowledge underdetermination**: "Behavior alone can’t *prove* imprecise probabilities—but it’s consistent with them and inconsistent with precise priors plus standard utility. The formalism explains *why* you felt stuck."  

  **Critical Assertion**:  
  > "Dilation isn’t about learning evidence that changes your beliefs—it’s about learning evidence that *should be irrelevant* but *reopens* ambiguity. The coin flip didn’t tell you anything about the urn, yet it shattered your confidence."

  ---

  This plan balances experiential learning with formalism, leverages physical props for intuition, and confronts dilation’s paradox head-on. By forcing a decision under dilated beliefs, it also sets up your next topic: decision rules for imprecise probabilities. Run it as-is, and you’ll give students a visceral memory of why imprecise probabilities matter.
