prompt: |-
  A debate I've followed for years seems completely stuck: the procreation asymmetry in population ethics. The claim is that while it is wrong to create a person whose life would foreseeably contain far more suffering than happiness, there is no corresponding duty to create a person whose life would be very good — and this asymmetry strikes nearly everyone as obvious on first encounter. Yet the moment it is built into an axiology, trouble follows: preserving it alongside otherwise plausible commitments about the value of adding worthwhile lives appears to force either indifference between imposing a small burden on existing people and creating a thoroughly miserable new person (Arrhenius's so-called sadistic conclusion) or abandonment of the idea that adding good lives can make an outcome better. My reading group splits cleanly between those who hold onto the asymmetry at almost any theoretical price and those who, once they see the costs, conclude that their attachment to it was an artifact of conflating two claims: that creating miserable people is wrong, and that creating happy people is merely permissible. My working hypothesis is that the impasse is not substantive at all but methodological — a disagreement about how much weight to give case intuitions relative to structural axioms such as transitivity, and about which cases even count as data. Is that right? Diagnose the disagreement using what the two sides actually say, indicate how confident you are in your diagnosis, and identify the point at which you are least sure; then say what, if anything, would count as progress — a distinction, a formal result, a change of question — or argue that no progress should be expected and why.
