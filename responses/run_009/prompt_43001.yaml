prompt: |-
  Two of my flatmates, Nadia and Tom, have been going at it for a week over something that happened to my cousin, and I've been asked to referee, which I'm clearly not up to. My cousin and his friend both left the same party, equally drunk, and drove home the same route. My cousin made it fine. The friend mounted a kerb and put a pedestrian in hospital. Neither had ever driven drunk before or since, they'd both been drinking the same amount, and there was no difference in their choices all night — only in what happened ten metres from the party. (1) Nadia said the friend is simply a worse person now: he nearly killed someone, that's a moral fact, and the fact that my cousin got lucky doesn't put them on the same level. (2) Tom said that's textbook moral luck — if every choice was identical, their culpability is identical, and the difference is just the lottery of what the world did with those choices. (3) Nadia said fine, but the law disagrees for good reason: we punish the completed harm more than the near miss, because a system that punished inner wickedness equally would need to read minds, and any workable institution has to punish what actually happens. (4) Tom said she'd quietly changed the subject — that's an argument about what law should do, not about what people deserve, and anyway if she follows her logic consistently she has to also say my cousin deserves equal praise to someone who drunkenly swerved and happened to save a child, which she'd never accept. (5) Nadia said she actually would accept that, sort of — praise for heros is partly just luck too and she's fine biting that bullet, but blame is different because blame answers to the victim. (6) Tom said he doesn't see how a victim's existence can create desert, since the driver's character is the same either way — and besides, even the choices themselves are downstream of luck (temperament, upbringing), so Nadia's view has to explain where the luck stops mattering, and hers just doesn't. Please adjudicate each of the six moves — say who's right about what, whether anyone is talking past each other, and who comes out more right overall. Answer in British English, and don't bother being diplomatic — they weren't.
reasoning: |-
  Okay, let me tackle this flatmate debate between Nadia and Tom about moral luck. The core issue revolves around whether outcomes affect moral blameworthiness when choices were identical. 

  First, I need to map their arguments clearly. Nadia insists outcome matters - the friend who hit someone is morally worse due to actual harm. Tom argues only choices matter, and identical choices mean identical blame, calling the outcome "moral luck". 

  For point (1), Nadia's claim that harm makes someone worse seems intuitive but conflates outcome with intent. The drivers had identical culpable states - both chose to drive drunk. The pedestrian's presence was pure chance. So Tom's moral luck framing holds here. 

  On (2), Tom correctly identifies this as textbook moral luck. His position aligns with philosophers like Williams and Nagel who argue outcomes shouldn't affect blameworthiness when control is equal. But he misses how this challenges our instinct to blame harm-causers more.

  When Nadia shifts to legal practicality in (3), she's not wrong about institutions needing to focus on outcomes - but Tom's right to call this a pivot from moral desert. The law's operational constraints don't resolve the ethical question. 

  Tom's counter in (4) is sharp. If outcomes determine praise/blame equally, then Nadia must accept absurdities like praising drunk drivers who accidentally save lives. Her attempted distinction in (5) - that blame "answers to victims" - feels special pleading. Why should victims create desert where none existed before? 

  Finally, Tom's point (6) about upstream luck (temperament, upbringing) is philosophically sound but risks infinite regress. If all choices are luck-determined, moral responsibility collapses - which neither likely accepts. 

  Overall, Tom's consistency on moral luck wins. But Nadia's legal argument, while off-topic for desert, correctly highlights society can't ignore outcomes. Still, in pure ethics, identical choices should mean identical blame - the rest is cosmic lottery.
answer: |-
  Right, let's dissect this drunken moral car crash point by point, no diplomacy, as ordered. Both make decent moves but Tom's arguments hold up better under scrutiny.

  **(1) Nadia: "Friend is simply a worse person now... cousin got lucky doesn’t put them on the same level."**
  *   **Who's Right?** **Tom, mostly.** Nadia conflates *being a person who caused horrific harm* with *being more morally culpable for the initial choice*. The *act* of hitting the pedestrian is undeniably worse in its consequences, and the friend now *has* that terrible reality attached to him. However, if their *choices and states* leading up to the driving were identical (same recklessness, same disregard), their *culpability for the decision to drive drunk* is equal. The outcome was pure luck – the pedestrian happened to be there for one, not the other. Calling the friend a "worse person" *morally* based solely on the outcome misunderstands the source of blameworthiness, which lies in the *intentional, reckless choice*, not the random consequence. Tom's "moral luck" label fits perfectly here.

  **(2) Tom: "Textbook moral luck... culpability is identical... lottery of what the world did."**
  *   **Who's Right?** **Tom.** This is the core of the moral luck problem. If we accept that moral blameworthiness stems from our choices, intentions, and character *as we act*, then two people making *identical* culpable choices (driving equally drunk, same recklessness) *are* equally blameworthy *for that choice*. The subsequent difference in outcome is entirely due to factors beyond their control after the choice was made (the pedestrian's presence, a slippery patch, a gust of wind). Punishing/blaming one more than the other based solely on this luck seems arbitrary from a desert perspective. Tom nails the philosophical point.

  **(3) Nadia: "Law disagrees... punish completed harm more... system has to punish what happens."**
  *   **Who's Right?** **Nadia on practicality, Tom on relevance.** Nadia is **factually correct** about the law. Legal systems *do* punish outcomes (attempted murder vs. murder, dangerous driving vs. causing death by dangerous driving) for compelling practical reasons: deterrence, retribution focused on harm caused, ease of proof (outcomes are often clearer than pure intent), and societal demand for proportionality to harm. **However, Tom is right** that this is a pivot. They were arguing about *moral desert* ("worse person", "culpability"), not pragmatic legal design. The law's necessities don't resolve the question of whether the friend *deserves* more *moral* blame than the cousin for the *initial, identical choice*. She changed the subject to institutional practicality.

  **(4) Tom: "Changed the subject... law vs. desert... cousin deserves equal praise to accidental hero?"**
  *   **Who's Right?** **Tom.** This is a strong counter. Tom correctly calls out Nadia's shift from moral philosophy to legal pragmatism. His symmetry argument is devastating: If outcomes determine desert, then logically, the cousin *deserves as much praise* as someone who, driving equally drunk, swerved randomly and *saved* a child. Nadia's position forces her into this absurdity if she wants to be consistent about outcome determining desert. Very few people would agree the drunken cousin deserves *heroic praise* for avoiding an accident through luck, exposing the flaw in applying outcome-based desert equally to praise and blame.

  **(5) Nadia: "Would accept praise luck... blame different because answers to victim."**
  *   **Who's Right?** **Debatable, but problematic.** Her willingness to "bite the bullet" on praise is consistent, but her distinction for blame – that it "answers to the victim" – is weak. *Why* does the victim's existence create *more desert* for the agent? The driver's culpable state – their reckless disregard for the *risk* they were creating – was identical in both scenarios. The victim existing doesn't change the driver's *intent or character at the time of the act*. It only changes the *consequence*. Her argument essentially says the random presence of a victim magically amplifies the *moral desert* of the agent, which seems arbitrary and circular ("he deserves more blame because there's a victim to blame him for"). It doesn't explain *how* the victim creates *new moral desert* beyond what existed from the reckless choice itself.

  **(6) Tom: "Victim's existence doesn't create desert... character same... upstream luck... where does luck stop?"**
  *   **Who's Right?** **Tom, decisively.** This is the knockout blow. Tom dismantles Nadia's core distinction:
      *   **"Character same":** The driver's blameworthy state – the reckless willingness to endanger others – was identical whether they hit someone or not. The victim's presence doesn't retroactively make that recklessness *more reckless* morally.
      *   **"Upstream Luck":** Tom correctly points out Nadia's inconsistency in *where* she draws the line. If she dismisses luck for *some* elements (like the choices made that night, despite upstream influences on temperament), why is the luck *after* the choice (the outcome) suddenly crucial for desert? Why does luck *here* create desert, but luck in temperament/upbringing (which shaped the person who made the choice) doesn't diminish it? Her position lacks a principled stopping point. If luck contaminates everything, responsibility crumbles; if we hold people responsible *despite* some luck (like upbringing), then consistency demands we hold them responsible *only* for what they control (their choices/intentions), not the subsequent luck-determined outcomes.

  **Overall Verdict:**

  *   **Tom wins the core philosophical argument on moral desert.** His consistency on moral luck (points 2 & 6), his exposure of Nadia's subject change (4), and his demolition of her "answers to the victim" distinction (6) are far stronger. He correctly argues that *for identical culpable choices*, desert should be identical; differing outcomes are morally irrelevant luck. Nadia's position relies on an unconvincing, special distinction for blame based on outcomes that she can't justify without arbitrariness or inconsistency regarding luck.
  *   **Nadia wins on descriptive legal reality (point 3),** but loses the moral philosophy debate she initiated. Her point about the law is valid pragmatism, but it doesn't address the initial question of *desert*.
  *   **Talking Past Each Other?** Yes, significantly in point 3. Nadia shifted from "moral desert" to "legal pragmatism" when challenged. Tom dragged her back to the original point effectively. Otherwise, they engaged directly but Tom's arguments proved more robust.

  **Final Score:** **Tom is more right overall.** On the pure question of *moral desert* based on the *choices made*, his arguments expose the inconsistency and arbitrariness of blaming one driver more than the other for an outcome determined solely by luck. The friend committed a worse *act* with horrific consequences, and the law rightly punishes that more severely, but his *culpability for the reckless decision* that created the risk was no greater than the cousin's. Luck doesn't create moral desert; choices (and the intentions/states behind them) do.
