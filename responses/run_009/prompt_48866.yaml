prompt: |-
  I'm giving a colloquium in three weeks defending what I suspect is a minority report in my department: that Gödel's ontological argument is a genuinely interesting piece of philosophy, not just a curiosity that a great logician tinkered with late in life and everyone politely ignores. My actual thesis is a bit more specific than "it's interesting" — I want to argue that the real philosophical action is in the positivity axioms, i.e. what it takes for a property to count as positive and whether Gödel's closure conditions on positivity (essentially, that the positive properties are closed under entailment and conjunction, plus that necessary existence is positive) do any coherent work, and that once you see that, the standard ways of dismissing the argument all miss the point. The conclusion "necessarily there exists a God-like being" is, on my view, the least interesting part.

  The audience, though, is a problem, and this is where I need your help. My department is mostly analytics with no philosophers of religion, plus one visitor from the computer science department who works on automated theorem proving and knows the Gödel formalization literature inside out (he's the type to casually mention that the theorem provers found Gödel's original axioms inconsistent while Scott's emended version verifies). So the room will have: two modal logicians who will treat any use of S5 as either trivial or suspect depending on mood; this CS visitor; one senior colleague who is religious in a Plantinga-ish way and thinks ontological arguments are a strategic disaster for theism, so he'll attack me from the other side; and a couple of Wittgensteinian holdovers who think the whole enterprise is language gone on holiday and that formalizing "positive property" proves the point rather than rebutting it.

  Draft me a Q&A prep sheet. I want the objections I'll actually get from this specific room, in the order they're likely to come and ordered by how much damage they could do, phrased the way these people would phrase them. For each one: a two-minute reply I can give, and an honest note on where the reply is soft. I especially want you to deal with (a) modal collapse — the objection that the axioms are so strong they imply every truth is necessary, which my CS visitor will definitely raise and will probably have the formal details of — and (b) the thought, which I expect from the Plantinga-ish colleague, that even a valid ontological argument is worthless because it can't engender worship and only invites parody. And tell me what I should concede up front rather than fight about, plus the one question I'm hoping nobody asks, and what to say if someone asks it anyway. Don't write my talk for me, just the prep sheet. Also assume the audience has never read Gödel's notes and only vaguely remembers Anselm from undergrad, so flag which objections depend on technicalia I'd have to unpack before I could even respond.
