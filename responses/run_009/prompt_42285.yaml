prompt: |-
  I'm taking a philosophy of science course this semester and we just spent two weeks on anthropic reasoning and Bayes, so I thought I'd finally go back to this pop-science book on probability I read over the summer. There's a chapter on the doomsday argument and now that I know a bit more, some of it feels kind of off, but I can't put my finger on exactly where. Here's roughly what it says (from my notes, so paraphrase-ish but I think I've got the claims right):

  The book says Brandon Carter (the physicist) proved using Bayes' theorem that humanity will probably go extinct soon. The reasoning is that you should treat yourself as a random sample from all the humans who will ever live. Since only about 100 billion humans came before you, and you're apparently not super early in the sequence, the total number of humans is probably not enormously larger than the number who've already lived. Run Bayes on that and you get something like a 95% chance humanity ends within the next few thousand years — maybe even sooner once you factor in nukes and engineered pandemics and all that. A physicist named Richard Gott apparently got the same answer independently with his Copernican principle, so two independent routes to the same conclusion. The book stresses that the argument needs no assumptions about biology, technology, or anything empirical — it's pure probability, which is why it spooked people. But then it reassures the reader: the whole thing was eventually refuted by something called the self-indication assumption, the idea that you should think it more likely you exist at all in worlds with more observers, and this consideration exactly cancels out the doomsday shift. Most philosophers now accept this, per the book, so the argument is considered a neat historical dead end.

  Is this fair? Go claim by claim and tell me what a careful defender of the argument would accept, what's a simplification, and what's just wrong. I'm especially suspicious of the last part — "refuted" is doing a lot of work there, and the fact that two arguments reach the same number doesn't mean much if one of them is just bad (our prof hammered that point with the bible-code stuff). Also, does the "no empirical assumptions" claim actually hold? It seems like priors about how long civilizations last have to sneak in somewhere.

  Since this is going in my notes for the final, give it to me as a JSON object so I can actually parse it later, with this schema:

