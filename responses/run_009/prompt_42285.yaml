  I recall the core controversy revolves around the self-sampling assumption (SSA) vs. self-indication assumption (SIA). The book presents SIA as settling the debate, but in reality philosophers are still divided - Bostrom's work shows it's more nuanced. The "no empirical assumptions" claim is particularly problematic since the choice of reference class (e.g. humans vs. conscious observers) is itself an empirical/philosophical choice that affects the outcome.

  For the Bayesian calculation, while the math itself may be sound given SSA, the 95% figure depends entirely on the chosen prior. The book presents this as fixed when it's actually highly sensitive to assumptions. Gott's version using temporal Copernican principle has different issues - his confidence intervals require uniform distribution across time which seems unjustified for civilizations.

  On the refutation claim: SIA does counter SSA-based Doomsday, but introduces its own problems like the presumptuous philosopher thought experiment. Current literature treats this as unresolved, not settled. The "two independent routes" point is weak because both share similar sampling assumptions.

  I should flag the 95% claim as especially misleading - it's not a universal probability but conditional on specific premises. The empirical assumptions point is outright wrong since reference class selection is empirical. My confidence is highest on the philosophical consensus being oversimplified (Bostrom's survey is clear) and lowest on whether Carter's original proof included birth rank vs total observers - that's a technical historical detail I'd need primary sources to verify.

