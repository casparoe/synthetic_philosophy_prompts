  Looking at their cases, I notice several tension points: Case 3 (permanent ban for medical disinformation) violates their proposed "bounded" principle but feels right, while Case 2 (permanent ban for old joke) violates the same principle but feels wrong. Case 7 (quiet friend exclusion) is both illegible and unbounded yet defensible. The user wants a principle that can navigate these contradictions.

  The key insight might be distinguishing between different types of sanctions: some are corrective/punitive (like legal systems), while others are protective/curatorial (like friend groups or platforms). Their proposed "legibility/proportionality/boundedness" framework only fits the former. For example:
  - Platforms banning disinformation (Case 3) is protective curation, not punishment
  - Friend exclusion (Case 7) is relationship preservation
  - University speaker declines (Case 4) are institutional autonomy

  For their unlisted case about professional license revocation, this would clearly be in the punitive category since it involves formal credentials. A coordinated campaign might be justified only with due process, unlike job firing (Case 5).

  The toughest conflicts are:
