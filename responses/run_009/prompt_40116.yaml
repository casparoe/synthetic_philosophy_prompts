  Key elements to illustrate:
  1. Without a mechanism, parties may engage in a costly conflict (e.g., a lawsuit, price war) even when there is a better outcome for both.
  2. A randomized mechanism (like a coin flip) can avoid the conflict and leave both parties at least as well off as they would have been in the conflict, and strictly better in expectation.
  3. The mechanism must be "safe": it should work regardless of the private valuations and without requiring trust or revealing private information. It must not distort incentives in cases where the parties would have settled without conflict.

  Challenges to expose:
  - Mechanisms that leak information about private valuations might lead to exploitation.
  - Mechanisms that help one type of player at the expense of another might not be acceptable to both.
  - Mechanisms that change behavior in scenarios where conflict wouldn't have occurred (i.e., they might cause conflict when it wasn't going to happen).

  Game Design Brainstorm:

  Candidate 1: "The Lawsuit Game"
  - Players: Two parties (Plaintiff and Defendant) in a legal dispute.
  - Stakes: The disputed amount is $10 (in candy or coffee fund money). Going to trial costs each side $3. The plaintiff wins with some probability if they go to trial (say 50% if we want symmetry, but we can vary it by private information?).
  - Private information: Each side has a private cost of going to trial (which might be different from $3) and a private valuation of the $10 (but typically, the plaintiff values the award at $10 and the defendant values not paying at $10). Instead, we can have private beliefs about the probability of winning? Or private costs? Let's avoid private probabilities because that complicates the safe mechanism. Instead, we can have the private cost of litigation (which is known to each but not the other).

  Candidate 2: "The Territory Dispute"
  - Two countries dispute an island. The island is worth V1 to country A and V2 to country B (private values). War destroys a portion of the value and costs each side resources. They can negotiate or go to war. A mediator might propose a coin flip.

  Candidate 3: "The Startup Acquisition"
  - Two startups are competing for a market. They can merge (with one acquiring the other) or fight a price war. The price war is costly. Each startup has a private valuation of being the acquirer and of being acquired (or of the market share).

