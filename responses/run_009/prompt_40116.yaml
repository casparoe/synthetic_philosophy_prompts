     - Mechanism 1: Biased coin (70% A wins, 30% B wins) -> then A gets $1 if win, else 0; similarly for B.
     - Mechanism 2: Fair coin (50-50) 
     They can also choose not to use any mechanism and play the demand game as before.
     (15 minutes)
  5. Debrief (20 minutes)

  During the debrief, we collect data on when they went to war and when they used a mechanism, and what payoffs they got.

  We predict:
  - In the base game, war will sometimes happen (e.g., when both demand 0.6).
  - For the mechanisms, they might agree to the fair coin more often than the biased coin.
  - Some players (B with low cost) will prefer war over the biased coin mechanism.

  The unsafe part of the biased coin: it does not guarantee that every type is at least as well off as war. Specifically, B with low cost (0.1) gets 0.3 from the biased coin, but 0.4 from war -> so they are worse off.

  This is something the players will experience: if they are a B with low cost, they would rather go to war than use the biased coin.

  But note: in the mechanism stage, they have to agree to use the mechanism. So a B with low cost will not agree to the biased coin. They might agree to the fair coin.

  The fair coin: both types of both players are better off than war.

  Therefore, the fair coin is safe, the biased coin is not.

  Materials:
  - Index cards for roles (A or B) and for costs (e.g., one deck for cost: red=0.4, black=0.1; and another deck for role: A or B). Or we can pre-assign.
  - Payoff record sheets.
  - Coins for flipping.

  Timeline:

  - 0-5 min: Explain the game. Everyone is paired. Each pair is bargaining over $1 (100 pennies). Each player has a private cost of war (0.1 or 0.4). War outcome: both get 0.5 minus their cost. In the demand phase, if the sum of demands <=1, they get what they demand; else, war. They will play several rounds. In each round, they are randomly reassigned costs and roles? Or keep the same role but redraw costs? Let's keep the same pair and same role (A or B) for all rounds, but redraw costs each round.

  - 5-20 min: Round 1 to 3 of base game. For each round:
       - Draw costs (each player draws a cost card, looks at it, keeps it private).
       - Write demands (on a slip, in decimals: 0.0 to 1.0, in 0.1 increments).
       - Reveal to each other in the pair and to the moderator (for recording).
       - If sum<=1, payoffs as demanded.
       - If sum>1, war: each gets 0.5 minus their cost.
       - Record payoffs.

  - 20-25 min: Introduce mechanisms. Now, before writing demands, the pair can agree to use a mechanism. They have two options:
       Mechanism 1: Biased coin (70-30 in favor of A). If they agree, we flip a coin (or use a random number) with P(A wins)=0.7. If A wins, A gets 1, B gets 0. If B wins, A gets 0, B gets 1.
       Mechanism 2: Fair coin (50-50).
       They can also choose no mechanism and play the demand game as before.
       They must both agree on the mechanism (or no mechanism) by mutual consent.

  - 25-40 min: Rounds 4 to 6: Play with mechanism option. In each round, after drawing costs, they discuss (within the pair) for 1 minute to decide: which mechanism to use, if any. They must agree. If they agree on a mechanism, we use it. If not, they play the demand game.

  - 40-60 min: Debrief.

  Debrief Questions:
  1. In the first three rounds, how many pairs had war? What were the demands that led to war?
  2. When war happened, what were the payoffs? How do they compare to what they could have gotten peacefully?
  3. In the last three rounds, how many times did pairs choose a mechanism? Which one? Why?
  4. Did any pair choose the biased coin? What happened? (Expect: if they chose it, then B with low cost would have been unhappy because they got 0.3, but war would have given 0.4. But note: in the mechanism, they only use it if both agree. So if B has low cost, they would veto the biased coin. So we might not see it chosen in that case.)
  5. Why is the fair coin safe? (Because for any cost, 0.5 > 0.5 - cost.)

  What might go wrong?
  - Players might not understand the war option. We must explain that war happens only if demands exceed 1.
  - In the demand game, they might always demand 0.5 and avoid war. Then we don't see war. To encourage war, we might suggest that they can try to get more. Or we can run more rounds.
    - Mitigation: Tell them to try different strategies. Or use a different framing: they are tough negotiators.
  - In the mechanism phase, they might always choose the fair coin and never go to war, so we don't see the unsafe mechanism in action.
    - Mitigation: We can have some pairs assigned to try the biased coin (as a condition) in one round? Or we can have a round where we force them to consider the biased coin.

  The part I'm least sure about: whether we will observe war in the base game. To increase the chance, we can:
    - Use incentives: the pair with the highest total payoff gets a prize.
    - Or we can set the value higher (but we are using real pennies, so $1 is fine).
    - Or we can make the cost distribution such that war is more attractive for some types. But we already have low cost types who get 0.4 in war, so they might be more willing to risk war by demanding 0.6.

  Alternatively, we can change the war outcome to be (0,0) minus costs? That might not work.

  I think we can adjust on the fly: if after two rounds no war, we can say: "I see many of you are avoiding war. That's great, but let's see what happens if you try to be more aggressive. Remember, the highest total payoff wins a prize."

  Confidence: 70% that we will see at least one war in the first three rounds across the pairs.

  The feature that we cannot reproduce: in real life, the war outcome might be very bad, and the coin flip might be a huge improvement. But with pennies, the stakes are low. Also, the concept of "every possible valuation" is abstract; we only have two types. But it should be enough to illustrate.

  Full Writeup:

  **Title:** The Dollar Demand Game

  **Objective:** To experience bargaining with private information and the role of randomized mechanisms in avoiding inefficient conflicts.

  **Materials:**
  - Index cards for roles: "A" and "B" (each pair gets one A and one B).
  - Cost cards: for each player, a deck of cards that say "0.1" (black) and "0.4" (red) - two per player per round (or one deck for the whole group to draw from).
  - Demand sheets: small pieces of paper for writing demands.
  - A coin for flipping (or a random number generator).
  - Payoff record sheets for each player.
  - Prizes (candy or coffee fund money) for highest overall score.

  **Setup:**
  - Form pairs (if odd number, one group of three with two B's and one A? but then war if demands exceed 1 might be complex. Better to have even number). Each pair sits together.
  - Assign roles: one player in each pair is A, the other is B. Roles are fixed for all rounds.
  - The game has 6 rounds. Rounds 1-3: base game. Rounds 4-6: with mechanism option.

  **Rules for Base Game (Rounds 1-3):**
  1. At the start of each round, each player draws a cost card (without showing to anyone) and records their cost (0.1 or 0.4).
  2. Players write their demand (a number between 0 and 1 in increments of 0.1) on a demand sheet.
  3. On the count of three, both players reveal their demand to each other.
  4. If the sum of demands (d_A + d_B) <= 1, then player A gets d_A and player B gets d_B.
  5. If the sum > 1, then war occurs:
     - Player A receives 0.5 - c_A
     - Player B receives 0.5 - c_B
  6. Record the payoff.

  **Rules for Mechanism Rounds (Rounds 4-6):**
  1. Draw costs as before.
  2. Players have 1 minute to discuss and agree on one of the following:
     a. **Biased Coin Mechanism**: A wins with 70% probability, B wins with 30%. The winner gets 1, the loser gets 0.
     b. **Fair Coin Mechanism**: A wins with 50% probability, B wins with 50%. The winner gets 1, the loser gets 0.
     c. **No mechanism**: Play the base game.
  3. If they agree on a mechanism, the moderator flips a coin (or uses a random number) to implement it and payoffs are set accordingly.
  4. If they do not agree, they play the base game (write demands).
  5. Record the payoff.

  **Scoring:**
  - Payoffs are in dollars (or pennies: $1 = 100 pennies). They should record their payoff for each round.
  - After 6 rounds, sum the payoffs. The player with the highest total in the room wins a prize (or we can do pair totals).

  **Debrief Guide:**

  1. **Base Game Experience:**
     - "In the first three rounds, how many of you experienced war? What demands led to war?"
     - "When war happened, what were your payoffs? How did they compare to what you might have gotten if you had avoided war?"
     - Highlight: War is inefficient because it destroys value (the costs are sunk, and sometimes the demands that led to war were not even that high).

  2. **Mechanism Experience:**
     - "In rounds 4-6, how many pairs chose a mechanism? Which one? Why?"
     - "Did any pair choose the biased coin? What was the outcome? Were there any pairs that considered the biased coin but then didn't agree? Why?"
     - "For the fair coin, were there any types of players (high cost or low cost) who didn't want to use it? Why or why not?"

  3. **Concept Mapping:**
     - Safe Pareto Improvement: The fair coin guarantees that no matter what your cost is, you are better off (in expectation) than going to war. Specifically, fair coin gives 0.5, war gives 0.5 - c_i, and since c_i>0, 0.5 > 0.5 - c_i.
     - The biased coin is not safe: for a B player with low cost (0.1), war gives 0.4, but the biased coin only gives 0.3 in expectation -> worse.
     - In the base game, even if there is a settlement range (like they could have settled at (0.6,0.4) instead of going to war), they might not coordinate on it. The mechanism avoids the coordination problem by replacing war with a lottery.

  4. **Challenges:**
     - "What if we tried to use a fixed split (like 0.5,0.5) instead of a coin flip? Would that be safe? (Yes in this setting, because 0.5 is always better than war.) But note: a fixed split doesn't use randomization and might not be as good as the coin flip in some cases? Actually, the coin flip has the same expected value as 0.5, but it's more risky. However, in this setting, because war is also risky (it's a 50-50 of getting 0.5 minus cost, which is fixed), the coin flip is also a 50-50 but without cost. So it's better.
     - "What if one player has a cost of 0? Then war gives 0.5, and the fair coin gives 0.5 -> they are indifferent. But we didn't have zero costs. Safe improvement requires strictly better when there is a cost."

  **Adjustments and Pilot Test:**
  - Test with two argumentative coworkers: Do they go to war? How do they react to the biased coin? Does a B with low cost veto the biased coin?
  - The part I'm least sure about: whether we will observe war in the base game. In the pilot, if they avoid war, encourage more aggressive demands by offering a prize for the highest individual score (not pair).

  **What the Game Cannot Reproduce:**
  - In real life, the set of possible valuations is continuous and unbounded, and the safe mechanism must work for every possible valuation. We only had two discrete types.
  - The concept of incentive compatibility in mechanism design (truthful reporting) is not deeply explored here, because our mechanisms did not rely on reported costs.

  Overall, this game should illustrate the core idea: randomization can safely replace conflict, but only if it is designed properly to guarantee that every type is better off.
