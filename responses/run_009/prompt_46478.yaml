prompt: |-
  So I run a small cognitive-science reading group (bright undergrads, no prior reading required) and next term we're doing Dennett's tower of generate-and-test — the Darwinian / Skinnerian / Popperian / Gregorian ladder, from blind selection through trial-and-error learning, to previewing moves in an internal model before your body pays for them, to all that plus mind-tools like labels and concepts handed to you by your culture. I want a diagnostic quiz, and the point is to sort candidate systems by what they actually *do*, not by which rung the textbooks file them under.

  Ten questions, each a concrete behavioural test on a specific system, with 3-4 answer options describing what the system does (not what it "is"). The systems should span the ladder hard: a thermostat, E. coli doing chemotaxis, Physarum slime mould rerouting through a maze, a Sphex wasp checking its burrow (the classic sphexishness trap — looks smart, is hardcoded), a rat in a Skinner box, a scrub-jay or crow caching food with re-caching behaviour when it knows it was observed, a chess engine running lookahead, a toddler who asks a question they've never been asked before, and a large language model doing whatever it is LLMs do.

  Two things the quiz must handle properly. First, the mimicry problem: Dennett's own caveat is that each rung can be faked from below — a population of Darwinian creatures can look like one learning Skinnerian, and a creature with a bogus hardcoded internal model can look Popperian until the world punishes its model. So at least two questions need to be designed so the wrong-run mimic fails them. Second, my own suspicion, which I'd like the quiz to test rather than assert: that LLMs might be Gregorian without being properly Popperian — absolutely soaked in mind-tools, but with no cheap internal preview step you can catch them skipping or doing. If a question can't separate that from a genuine Popperian-plus-mind-tools agent, say so honestly.

  Finish with a scoring key mapping answer patterns onto leaves (all four rungs, plus the "not even Darwinian" basement and a "sphexish" leaf for hardcoded mimicry), and a short section flagging any pairs of leaves the quiz genuinely cannot separate from behaviour alone — I'd rather know where my instrument is blind than pretend it isn't.

  Answer in British English please (behaviour, mould, etc.). And don't just rehash the four definitions at me at the start — assume the quiz-taker hasn't read Dennett, but the quiz-writer has.
reasoning: |-
  Okay, the user runs a cognitive science reading group for undergrads and wants a diagnostic quiz based on Dennett's tower of generate-and-test. They need ten questions that test systems' behaviours rather than categorising them by textbook labels. 

  First, I need to understand the core challenge: designing behavioural tests that distinguish between genuine rungs and mimics. Dennett's ladder has four rungs—Darwinian, Skinnerian, Popperian, Gregorian—plus basement (non-Darwinian) and sphexish (hardcoded mimic). The quiz must expose mimics, especially for Popperian and Gregorian levels.

  The user's special request: test their suspicion that LLMs are Gregorian (using mind-tools) but not truly Popperian (lacking reliable internal preview). This is subtle—it means a question where Popperian systems preview consequences internally, while LLMs might skip this by leveraging cultural tools without genuine simulation.

  Key constraints:
  - Systems must span the ladder (thermostat to LLM)
  - Each question: concrete test, 3-4 behavioural options
  - At least two mimic-busting questions
  - Scoring key with honest limitations

  Brainstorming mimic-busting traps:
  1. For Popperian: Test if preview is adaptable. A hardcoded model (sphexish) fails when the environment changes unexpectedly. Example: alter a maze after "preview" to see if behaviour updates.
  2. For Gregorian: Check if mind-tools enable novel problem-solving beyond stored patterns. A pure associative system might fail.

  LLM challenge: They use cultural tools (Gregorian) but if asked to predict outcomes of hypothetical actions, they might pattern-match rather than simulate consequences (missing Popperian core). Need a question where:
  - Correct answer requires internal simulation (e.g., "if I move this chess piece, what happens?")
  - LLM could answer from training data, not live simulation. Trap: pose a novel, low-stakes scenario it couldn't have memorised.

  Outline:
  Q1 Thermostat (baseline: no generate-test)
  Q2 E. coli (Darwinian: population-level selection)
  Q3 Physarum (Skinnerian? But test individual adaptation)
  Q4 Sphex wasp (sphexish mimic of Popperian)
  Q5 Skinner box rat (Skinnerian reinforcement)
  Q6 Scrub-jay (Popperian? Re-caching implies theft simulation)
  Q7 Chess engine (Popperian lookahead)
  Q8 Toddler question (Gregorian: novel tool use)
  Q9 LLM novel puzzle (test Gregorian vs Popperian gap)
  Q10 Universal test: model falsification (mimic-buster)

  For Q9 (LLM): Pose a unique, simple physics puzzle (e.g., "If I place a banana in a sealed box, then shake it, what happens to the banana?"). Options:
  - Pattern-match: "Bananas get bruised" (associative)
  - Simulate: "Unchanged if box protects it" (internal model)
  LLMs often default to association, skipping simulation if stakes are imaginary. A true Popperian would engage the model.

  Scoring: Map answer patterns to rungs. Flag undetectable mimics:
  - A perfect hardcoded mimic might pass all tests (rare)
  - Gregorian without Popperian might be indistinguishable from true Gregorian if tools cover gaps

  Final structure:
  - Quiz intro: Clear, no jargon
  - Questions: System→behavioural test→options
  - Scoring: Points per Q, rung assignments
  - Limitations: e.g., "Cannot distinguish perfect hardcoded mimics from true Popperian in all cases"
answer: |-
  ### Dennett's Tower Diagnostic Quiz: Behavioural Sorting  
  *10 concrete tests to sort systems by what they **do** — not what we call them.  
  Focus: How they generate and test behaviours to solve problems.*  

  ---

  #### **Question 1: Thermostat**  
  *You move a room’s thermostat sensor to a colder spot. How does it respond?*  
  A) Does nothing; output remains fixed unless its own sensor changes.  
  B) Compares new sensor input to target, then adjusts heating until *its sensor* matches the target.  
  C) Learns from past heating cycles to adjust future responses.  

  #### **Question 2: E. coli (bacteria)**  
  *You place E. coli in a gradient with food (glucose) on the left and toxin on the right. Over 10 generations, how do they distribute?*  
  A) Remain randomly scattered; no change.  
  B) Gradually shift left via mutation/selection: toxic-side lineages die, food-side thrive.  
  C) Individual bacteria swim toward glucose within minutes, avoiding toxin.  

  #### **Question 3: Physarum slime mould**  
  *A slime mould occupies a maze. Food is placed at both ends. After it forms a path, you block its route. What happens?*  
  A) Starves; cannot alter path.  
  B) Retracts, explores new branches randomly, reinforces any path reaching food.  
  C) Consults a stored "map" to calculate a new optimal path before moving.  

  #### **Question 4: Sphex wasp**  
  *A Sphex wasp drags prey to its burrow. While it inspects the burrow entrance, you move the prey 30cm away. What does it do next?*  
  A) Abandons the prey; inspection failure disrupts the sequence.  
  B) Finds prey, drags it back, then *repeats the full inspection ritual* despite burrow being unchanged.  
  C) Notices displacement, adapts: skips inspection after repositioning prey.  

  #### **Question 5: Rat in a Skinner box**  
  *A rat presses a lever for food. You change the rules: lever-pressing now delivers an electric shock. How does it respond?*  
  A) Presses lever once, gets shocked, then stops pressing permanently.  
  B) Presses lever less often over time; avoids actions paired with shock.  
  C) Pauses, "imagines" pressing the lever, then avoids it without ever touching it again.  

  #### **Question 6: Scrub-jay (bird)**  
  *A scrub-jay caches food while another bird watches. Later, it returns alone to the cache site. What does it do?*  
  A) Ignores the cache; no memory of theft risk.  
  B) Recaches the food *only if it observed the watcher stealing food in the past*.  
  C) Recaches food immediately, simulating theft risk from the watcher’s perspective.  

  #### **Question 7: Chess engine**  
  *You set a chess engine to "low depth" (minimal lookahead). It blunders a piece. You restart, set to "high depth." What changes?*  
  A) Plays identically; lookahead depth doesn’t alter moves.  
  B) Avoids the blunder by simulating future board states before moving.  
  C) Learns from the blunder and adjusts future strategies.  

  #### **Question 8: Toddler (human child)**  
  *A toddler sees rain for the first time, points outside, and asks: "Will the flowers grow taller now?" How did this question arise?*  
  A) Random vocalisation; no link to context.  
  B) Uses the word "grow" associatively (e.g., heard "rain makes plants grow").  
  C) Combines labels ("rain," "grow," "flowers") to form a novel hypothesis about causation.  

  #### **Question 9: Large Language Model (LLM)**  
  *You ask an LLM: "If I tie helium balloons to a rock, will it float?" It answers correctly. Now you ask: "How would you test this safely if you lacked physics knowledge?" What happens?*  
  A) Refuses; cannot generate methods outside trained data.  
  B) Suggests a real-world test (e.g., "tie balloons to rock, observe result").  
  C) Proposes *only* abstract reasoning (e.g., "compare densities"), skipping physical tests.  

  #### **Question 10: Mimic Test (applies to any system)**  
  *You create a novel problem where the system’s hardcoded rules are useless (e.g., a maze with 4D geometry). What occurs?*  
  A) Fails completely; no capacity to innovate.  
  B) Generates random attempts, retains any that work.  
  C) Uses an internal model to simulate solutions before acting.  

  ---

  ### **Scoring Key**  
  *Map your answers to a "rung" on Dennett’s tower:*  
  - **Basement (0):** No generate-test. *Typical profile:* Mostly **A** in Q1, Q2, Q10.  
  - **Darwinian (1):** Variation/selection over generations. *Profile:* **B** in Q2, **A/B** in Q10.  
  - **Skinnerian (2):** Trial-and-error learning in real-time. *Profile:* **B** in Q3, Q5; **A/B** in Q4.  
  - **Popperian (3):** Internal preview via models. *Profile:* **C** in Q6, Q7, Q10; **B** in Q9.  
  - **Gregorian (4):** Uses cultural mind-tools (labels, concepts). *Profile:* **C** in Q8, Q9; **C** in Q6/Q7.  
  - **Sphexish (Mimic):** Hardcoded sequences that *look* intelligent. *Profile:* **B** in Q4; **C** in Q7 (if low depth fails but high depth passes).  

  ### **Limitations: Where the Quiz Is Blind**  
  1. **Popperian vs. Perfect Sphexish Mimic:** A system with exhaustive hardcoded rules (e.g., chess engine at low depth) may pass Q7 but fail Q10. If Q10 isn’t tested, mimicry is undetectable.  
  2. **Gregorian-Without-Popperian (e.g., LLMs):** Q9 flags this. If the LLM picks **C** (skips physical tests), it uses mind-tools *without* simulating consequences. But if it picks **B**, the quiz *cannot* confirm if it "previewed" the test internally or regurgitated training data.  
  3. **Skinnerian vs. Darwinian Individuals:** Q3 (Physarum) tests individual learning, but if a system fails, it may still be Darwinian (Q2). The quiz assumes population-level vs. individual adaptation is distinguishable via observation periods.  

  ---

  ### **How to Use**  
  - Tally answers, match to the nearest profile.  
  - **Critical checks:**  
    - Sphexish mimic: Q4 **B** + Q10 **A** = hardcoded, not Popperian.  
    - LLM ambiguity: Q9 **B** could be Popperian *or* associative mimic; Q10 **A/B** reveals limits.  
  - **Design notes:**  
    - Q4 and Q10 are mimic-busters (Sphexish/Popperian fakes fail them).  
    - Q9 explicitly tests the Popperian/Gregorian split in LLMs.  

  This quiz isolates behaviours, but as Dennett warns: the world is "saturated with design" — not all mimics get caught. Focus on *how* systems fail, not just labels. 

  *British English note:* "Behaviour," "mould," "labour" used throughout.
