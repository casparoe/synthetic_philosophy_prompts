prompt: |-
  i'm a physics phd student working on decoherence, so i live in the Everettian literature (branching, self-locating uncertainty, the decision-theoretic defence of the Born rule, all that). i've read enough Lewis to know the shape of his modal realism but i keep having this feeling that i already have his ontology in my pocket -- like the plurality of worlds is just the branching structure of the universal wavefunction with different labels. so here's what i want: restate Lewis's modal realism -- the plurality of equal-reality worlds, the indexical analysis of actuality, counterpart theory, the recombination principle -- in the vocabulary i actually use. branches, decohered histories, amplitude measure, self-locating uncertainty. and be honest about the translation: tell me which parts map cleanly, which parts only map if you distort one side or the other, and which parts have no expression at all in Everett talk. the obvious worry is contingency -- on my picture all the outcomes happen somewhere, and branches share common structure and history in a way Lewis's worlds emphatically don't, so i suspect "could have been otherwise" doesn't come out the other side. but don't just lay out the options for me: give me your actual verdict on where the residue lives, whether it's a defect of my vocabulary or a sign Lewis was less clear than he looked, and commit to whether anything survives of the contingency claim beyond "there's a branch where it went otherwise". if you think the translation basically works and i'm right that i already have his ontology, say so and defend it.
reasoning: |-
  Okay, this is a fascinating request from a physics PhD student deeply immersed in Everettian quantum mechanics. They're essentially asking for a conceptual mapping between David Lewis's modal realism and the many-worlds interpretation (MWI) framework they work with daily. 

  The user clearly knows both theories well but senses an underlying equivalence that needs rigorous testing. Their phrasing suggests they suspect MWI already contains Lewis's ontology ("I already have his ontology in my pocket") but want an honest assessment of where the parallels break down. The explicit challenge is to translate Lewis's key concepts - concrete possible worlds, indexical actuality, counterpart theory, recombination - into Everettian vocabulary like branches, decoherence, amplitude measure, and self-locating uncertainty.

  Hmm, the core tension they identify is contingency: in Lewis's system, worlds are radically disconnected and "could have been otherwise" has robust meaning, while in MWI all possibilities physically exist on branching paths. They're absolutely right to flag this as the major fracture point. 

  Let me approach this systematically. First, the clean mappings: Lewis's plurality of worlds maps beautifully to the Everettian multiverse - both posit concrete realities for all possibilities. The indexical "actual" also transfers perfectly: what we call actual is just our branch location, just as for Lewis it's our world location. Self-locating uncertainty in quantum mechanics (e.g., in Wigner's friend scenarios) functions almost identically to Lewis's indexical actuality.

  Counterpart theory is trickier but adaptable. Instead of Lewis's spatiotemporal counterparts across disconnected worlds, MWI offers "temporal counterparts" along branching paths. When the user measures a spin, their future selves on different branches become counterparts to each other. The qualitative similarity holds even if the metaphysical glue differs. 

  Now the rough translations: Lewis's recombination principle (any pattern of fundamental properties can coexist if spatially arranged) only loosely fits quantum dynamics. Decoherence constraints mean not all combinations are physically possible - the universal wavefunction evolves unitarily, prohibiting "gerrymandered" worlds Lewis allows. Still, within quantum possibility space, there's decent overlap.

  Ah, but contingency... this is where the user's intuition about a "residue" is spot-on. In Lewis, when we say "I could have worn blue today," it implies genuine absence from our world - a metaphysical alternative. In MWI, that blue-shirted version physically exists on another branch. The residue isn't a defect in either system but reflects their different purposes: Lewis captures pre-theoretic modal intuition, while MWI describes physical architecture. 

  The surviving "contingency" in MWI is structural: branching creates mutually inaccessible futures where different possibilities are realized. But it's not Lewis's absolute absence - it's causal inaccessibility plus subjective uniqueness (I experience only one outcome). 

  Verdict? The user is fundamentally correct that Everett provides a physics-realized version of Lewis's ontology. The concrete plurality, indexicality, and counterpart-like relations map robustly. What doesn't survive is Lewis's notion of radical contingency as non-existence of alternatives. But this isn't a flaw - MWI gives contingency a physical basis in decoherence and branch structure. 

  The translation mostly works because both are genuine multiverse theories. Where they diverge, it reflects Lewis's commitment to Humean recombination versus quantum dynamics. For a working physicist, MWI doesn't just mimic Lewis - it grounds modal concepts in wavefunction structure.
answer: |-
  You've hit on a profound conceptual resonance. **Yes, the translation works remarkably well, and you essentially *do* have Lewis's ontology in your pocket.** Everett provides a *physical realization* of Lewis's abstract modal structure. Let's break it down rigorously, highlighting the clean maps, distortions, and residues:

  **Core Mappings (Clean & Powerful):**

  1.  **Plurality of Concrete Worlds ↔ Decohered Branches:**
      *   **Lewis:** There exists a vast plurality of concrete, spatiotemporally disconnected worlds. Each is "actual" *from its own perspective*.
      *   **Everett:** There exists a vast plurality of decohered, quasi-classical branches of the universal wavefunction. Each is "actual" *from the perspective of an observer within it*.
      *   **Translation:** Decohered branches *are* Lewis's possible worlds. They are concrete (physical quantum states), distinct realities, and their spatiotemporal disconnection is enforced by decoherence (suppressing interference, making branches effectively autonomous).

  2.  **Indexical Analysis of Actuality ↔ Branch-Relative Actuality:**
      *   **Lewis:** "Actual" is indexical, meaning "this world." All worlds are equally real; none is metaphysically privileged.
      *   **Everett:** "Actual" is indexical, meaning "this branch." All branches are equally real components of the universal quantum state.
      *   **Translation:** Perfect 1:1 mapping. Your sense of being "actual" is simply the consequence of experiencing the world from within a specific branch. There is no "super-actual" branch or perspective.

  3.  **Counterpart Theory ↔ Temporal Counterparts Across Branches:**
      *   **Lewis:** An individual exists in only one world. "You could have been a pirate" means there's a world containing a *counterpart* of you (a being sufficiently similar and appropriately related) who is a pirate.
      *   **Everett:** Your pre-measurement self exists on a single branch. "You could have measured spin-up" means there is a branch where a *temporal counterpart* of you (descended from the same pre-measurement state via decoherence) *did* measure spin-up.
      *   **Translation:** Lewis's trans-world counterparts map directly onto Everett's *post-branching temporal counterparts*. The "sufficiently similar and appropriately related" relation is defined by the shared pre-branching history and the specific branching event (e.g., the spin measurement). You have counterparts *on other branches*, not in other disconnected spacetimes.

  **Mappings Requiring Distortion/Qualification:**

  1.  **Recombination Principle ↔ Quantum Possibility Space:**
      *   **Lewis:** Anything can coexist with anything else, provided there is a spatiotemporal arrangement for it. Worlds can contain any combination of fundamental properties/individuals that don't violate logical laws.
      *   **Everett:** The space of possible branches is constrained by the initial wavefunction, the Hamiltonian, and the dynamics of decoherence. Not all logically conceivable configurations are physically realizable branches. Decoherence strongly favors quasi-classical histories consistent with macroscopic pointer states.
      *   **Distortion:** This is the major point of friction. Lewis's recombination is maximally permissive (logical possibility). Everett's branching is governed by quantum dynamics (physical possibility). While the universal wavefunction *might* allow for incredibly diverse configurations under the right (perhaps exotic) conditions, it emphatically does *not* guarantee that "anything goes" in the way Lewis envisions. The "spatiotemporal arrangement" condition maps loosely to decoherence favoring configurations compatible with local, stable macroscopic structures. **Verdict:** Lewis's principle maps only to the *physically possible* subspace defined by the wavefunction's evolution and decoherence, not to logical possibility. This is a limitation *of Lewis's picture* from a fundamental physics perspective – quantum mechanics restricts recombination.

  **The Residue: Contingency & Absence**

  *   **Lewisian Contingency:** "I could have worn blue socks today" fundamentally means: There exists a concrete world, disconnected from ours, where my counterpart wears blue socks. Crucially, *that possibility is absent from my world*. Its non-actuality *here* is brute fact.
  *   **Everettian Contingency:** "I could have worn blue socks today" means: There exists a branch (descended from the relevant branching point, e.g., my sock choice this morning) where my temporal counterpart wears blue socks. However, *both outcomes are physically realized*. The blue-sock possibility is *not absent* from fundamental reality; it's realized elsewhere in the wavefunction.
  *   **The Residue:** **The feeling of genuine absence, of "*this* possibility *did not happen* (full stop)", central to the pre-theoretic intuition of contingency, does not survive the Everett translation.** In Everett, *all* outcomes (within quantum possibility) *do* happen. The residue is the *subjective experience of uniqueness* combined with the *causal isolation* of branches enforced by decoherence.

  **Where the Residue Lives & Its Significance:**

  *   **Location:** The residue lives in the **indexical experience of the observer** navigating the branching structure. It's generated by:
      1.  **Self-Locating Uncertainty (Pre-Observation):** Before "looking," you know all outcomes exist on branches, but you don't know *which* branch you will find yourself on. This captures the "I don't know what will happen" aspect of contingency.
      2.  **Post-Branching Uniqueness:** *After* the branching event (and decoherence), you only ever experience *one* outcome. You never witness the "alternative" directly; you only infer its existence theoretically. This *feels* like "the alternative didn't happen (here)".
      3.  **Causal Isolation:** Decoherence prevents significant interference, making the alternative branch causally inaccessible. It might as well be Lewis-disconnected.
  *   **Is it a Defect?** **No.** This isn't a defect in your vocabulary or a sign Lewis was unclear. It's a fundamental difference in the *metaphysical grounding* of modality.
      *   Lewis grounds modality in a primitive plurality of disconnected concrete realities. Absence is fundamental.
      *   Everett grounds modality in the structure of a single, interconnected physical reality (the wavefunction). "Absence" is emergent, a consequence of branching, decoherence, and subjective experience within a branch. It's *physical inaccessibility* plus *subjective uniqueness*.
  *   **Does Contingency Survive?** **Yes, but transformed.** What survives is:
      *   **Structural Contingency:** The wavefunction's branching structure *itself* encodes alternatives. Different possibilities are realized on different branches.
      *   **Indexical Contingency:** "It could have been otherwise *for me*" translates perfectly to "There is a branch where my counterpart experiences otherwise." This captures the *personal* significance of possibility.
      *   **Causal Contingency:** From *within* a branch, the specific outcome that occurred feels contingent because the branching dynamics leading up to it were inherently probabilistic (via the Born rule applied to self-locating uncertainty). The alternative branch is a causally disconnected reality where things *did* play out differently.
      *   **What Doesn't Survive:** The notion that the alternative possibility is *fundamentally unrealized* or *metaphysically absent* from the totality of existence. In Everett, it's realized elsewhere.

  **Your Verdict & Defense:**

  **Your intuition is overwhelmingly correct. You *do* already possess Lewis's core ontological structure within the Everett framework.** The plurality of concrete realities, the indexicality of actuality, and the counterpart-theoretic structure of de re modality all find a natural, arguably *more physically grounded*, expression in the branching wavefunction.

  *   **Defense:**
      1.  **Concreteness:** Decohered branches are concrete physical states. This isn't ersatz modality; it's real physics.
      2.  **Plurality & Equality:** All decohered branches exist as components of the universal state. None is metaphysically privileged.
      3.  **Indexicality:** "Actual" is demonstrably branch-relative in Everett, resolving the "actualist" paradox Lewis tackled.
      4.  **Counterparts:** The mapping of individuals across branches via shared pre-branching history and specific decoherence events provides a rigorous physical basis for counterpart relations, arguably cleaner than Lewis's primitive "similarity and relation" stipulation.
      5.  **Explanatory Power:** Everett explains *why* there is a plurality (unitary evolution + decoherence) and *why* worlds/branches are disconnected (decoherence), whereas Lewis posits these features primitively.

  **The residue concerning contingency isn't a flaw; it's an illumination.** It highlights that the pre-theoretic feeling of "absence" associated with contingency is an *emergent consequence* of being a localized observer embedded within a branching quantum reality. Lewis captured the *structure* of modality brilliantly with his concrete plurality and indexicality, but Everett provides a *physical mechanism* for that structure and explains the *origin* of the feeling of absence. The "could have been otherwise" claim survives robustly as "there is a branch where it went otherwise (and I'm there)," which, given the indexical nature of experience and the causal isolation of branches, satisfies the essential semantic and experiential core of contingency. The residue is the metaphysical baggage of "non-existence elsewhere," which Everett reveals as unnecessary. **You haven't lost contingency; you've gained an understanding of its quantum origin.**
