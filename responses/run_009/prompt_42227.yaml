  **Repository:** epistemicommunity/episteme  
  **Issue #4271:** Justification chain never terminates  
  **Severity:** Blocker  
  **Opened by:** @sceptic_dev  
  **Labels:** regression, philosophy, core  

  ---

  ### sceptic_dev  
  **Created:** 23 September 2023  
  Episteme v2.3.1  
  Whenever I run `justify --package "ethical-norms"`, the dependency resolver enters an infinite loop. Traced it to `justification-chain` demanding transitive deps for every imported module. This violates PEP 8 (Principle of Epistemic Parsimony). Blocking all CI/CD pipelines until resolved.  

  **Log Snippet:**  
  ```
  INFO: Resolving justification for ethical-norms@1.2.0  
  DEBUG: Fetching meta-justification for deontology-base@0.9.3  
  DEBUG: Fetching meta-justification for util-maximiser@3.1.4  
  ... (repeats for 14,592 lines)  
  ERROR: JustificationChainTerminationException: No atomic ground found.  
  ```

  ---

  ### foundationalist_maintainer  
  **Posted:** 23 September 2023  
  Marking as `priority: critical`.  
  Solution: Tag certain packages as `self-justifying` (zero deps). They’re "the given" — no further resolution needed. Added PR #4272 to whitelist:  
  - `sense-data@core`  
  - `logical-atoms@core`  
  - `cogito-core@stable`  

  Once merged, resolver will treat these as termination points.  

  👍 **3 reactions** (including @positivist_user)  

  ---

  ### @coherentist_contributor  
  **Posted:** 24 September 2023  
  @foundationalist_maintainer This is arbitrary. Why is `cogito-core` "given"? Opened #4273 because `cogito-core` depends on `linguistic-rules` which depends on `social-practices`. Your "ground" has transitive dependencies. Self-justification flag is a hack.  

  ---

  ### @infinitist_dev  
  **Posted:** 24 September 2023  
  Why terminate at all? The resolver’s insistence on "atomic grounds" is the bug. My PR #4274 makes `justify` fetch *only the next dependency* on demand. Justification isn’t about downloading the whole tree — it’s about having *access* to the next link. Like lazy loading!  

  **CI Log (from PR test):**  
  ```
  INFO: Justifying ethical-norms@1.2.0 → fetched util-maximiser@3.1.4  
  INFO: Justifying util-maximiser@3.1.4 → fetched pleasure-calculus@2.5.0  
  INFO: Justifying pleasure-calculus@2.5.0 → fetched neurobiology-base@4.7.1  
  ... (continues, no error)  
  ```  
  *Build passes*. Non-termination ≠ failure.  

  ---

  ### foundationalist_maintainer  
  **Posted:** 24 September 2023  
  @infinitist_dev CI "passed" because you capped the test at 500 deps! Production chains are *infinite*. Users need closure. Also, your lazy loader crashed when querying `meta-justification-chain` — it recursed until stack overflow.  

  @coherentist_contributor Fine, show us your solution then.  

  ---

  ### coherentist_contributor  
  **Posted:** 25 September 2023  
  PR #4275: Allow circular imports with `--coherence-check` flag.  
  Example:  
  ```yaml  
  dependencies:  
    - package: truth-semantics  
      imports: [belief-web]  
    - package: belief-web  
      imports: [truth-semantics]  # Circular!  
  ```  
  Then run:  
  ```bash  
  justify --coherence-check --package belief-web  
  ```  
  Output:  
  ```  
  SUCCESS: Global consistency score 0.89 (>0.85 threshold).  
  ```  
  Justification emerges from system-wide stability, not chains. The linter flagging circular imports assumes foundationalism — that’s the real issue.  

  ---

  ### @linter_bot  
  **Posted:** 25 September 2023  
  ⚠️ PR #4275 failed: CircularImportError in `truth-semantics↔belief-web`.  
  *[episteme.yml:12]: "belief-web" imports "truth-semantics" which imports "belief-web".*

  ---

  ### coherentist_contributor  
  **Posted:** 25 September 2023  
  @linter_bot Disable circular import checks when `--coherence-check` active! This isn’t a *linear* chain. It’s about the network’s eigenvector centrality.  

  ---

  ### @sceptic_dev  
  **Posted:** 25 September 2023  
  @coherentist_contributor But why does `belief-web` justify `truth-semantics` if `truth-semantics` justifies `belief-web`? Feels like a circular `npm install`. Also, your "coherence score" of 0.89 — how is *that* justified?  

  ---

  ### infinitist_dev  
  **Posted:** 26 September 2023  
  @sceptic_dev Exactly! Coherentism just hides the regress in a global property. My lazy loader is honest: infinite deps, finite resources. We only resolve what’s needed *now*.  

  **Repro for coherentist’s circular stack:**  
  ```  
  justify --package belief-web → imports truth-semantics → imports belief-web → imports truth-semantics → ...  
  ```  
  You still need termination!  

  ---

  ### foundationalist_maintainer  
  **Posted:** 26 September 2023  
  Agreed. Self-justifying packages remain the answer. I’ve added `divine-revelation@1.0.0` to the whitelist. Zero dependencies, God-given.  

  **Bug Report #4276:** Opened by @atheist_user — "`divine-revelation` depends on `faith-adapter`, which isn’t self-justifying."  

  ---

  ### @episteme_maintainer  
  **Posted:** 27 September 2023  
  *[Locking thread]*  
  This is a philosophical limitation of Episteme, not a resolvable bug.  
  - Foundationalism: Fails to name universally accepted zero-deps packages  
  - Coherentism: Circular imports crash the resolver when traversed linearly  
  - Infinitism: CI times out, users complain of "endless loading"  

  Adding to `KNOWN_ISSUES.md`:  
  ```  
  # Issue 14: Justification Regress  
  Status: wontfix  
  Description: Termination condition cannot be universally satisfied.  
  Workaround: Use `--pragmatic-mode` (resolves deps until user patience threshold).  
  ```  

  We’ll focus on optimising the lazy loader (PR #4274) for *longer* chains. Not ideal, but neither is epistemology.  

  ---

