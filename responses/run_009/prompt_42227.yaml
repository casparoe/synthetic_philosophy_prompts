  ### Issue 14: Justification Regress (wontfix)  
  **Severity:** Cosmic  
  **Description:**  
  The resolver cannot guarantee termination of justification chains.  
  Root cause: Disagreement over whether knowledge requires foundations (foundationalism), systemic consistency (coherentism), or indefinite deferral (infinitism).  

  **Workarounds:**  
  1. `justify --pragmatic-mode` (kills process after 5s, returns current stack)  
  2. `justify --foundation "cogito-core"` (manually assert a ground; may cause circular reports)  
  3. `justify --coherence-check` (experimental; may approve inconsistent systems if threshold misconfigured)  

