answer: |-
  ## Eulogy for a Philosopher

  Good morning. Thank you all for coming. It means a great deal to see so many faces who knew my mother – her family, her friends, her colleagues, her students. We’re here to remember her, and to celebrate the remarkable life she lived. For thirty-some years, she shared her passion for philosophy, for untangling the knots of how we think about ourselves and the world.

  And if you knew her, you knew she had a favourite knot. A favourite argument. One she’d bring out at department meetings, family dinners, or yes, even corner you about at Thanksgiving if you gave her half an opening: Galen Strawson’s Basic Argument. For those unfamiliar, it’s an idea she believed was utterly unshakable. It says, essentially, that for us to be *ultimately* responsible for our actions – truly deserving of deep, backward-looking praise or blame – we’d have to be responsible for the very person we are: our character, our motives, the things that make us *us*. But how could we be responsible for that? We didn’t create ourselves. Who we are is shaped by genetics, by upbringing, by chance encounters, by countless factors stretching back long before we existed. To be responsible for *that*, we’d have to have created ourselves from nothing – *causa sui*. And since no one is self-created… well, ultimate moral responsibility, in that deepest desert sense, is impossible. She didn’t see this as a scientific claim about neurons, but as a logical truth about what it means to be a finite, caused being. She believed no one had ever truly refuted it, and she was fiercely proud of that.

  Now, you might be wondering, standing here, about to deliver a eulogy – a speech that traditionally heaps praise, that attributes virtues and accomplishments – how do I square that circle? How do I stand here and say “She was brilliant, she was passionate, she was deeply caring, she was wonderfully stubborn” knowing she’d give me that familiar, patient blink? Knowing she’d gently point out that her brilliance, her passion, her capacity for care, even her stubbornness… these weren’t achievements she *authored* from scratch. They were, in the final analysis, part of the incredible, complex, but ultimately contingent configuration that was *her*? That they were, as she might put it, “luck all the way down”?

  She asked me, near the end, not to “undo her at the finish line.” Not to suddenly pretend the argument she staked her professional life on didn’t matter, or to slip in the kind of ultimate desert she spent decades arguing was incoherent. So I won’t.

  Instead, I want to talk about what she *did* believe mattered. Deeply.

  She believed in the immense *value* of how we are, even if we aren’t ultimately responsible for it. She didn’t think praise or blame were meaningless. Far from it. She thought they were powerful tools. Tools that shape us, that encourage, that deter. Praising generosity encourages more of it – in the person praised and in those who witness it. Blaming cruelty discourages it. These practices look *forward*, shaping the world we want to live in. They acknowledge the profound importance of certain qualities, not because the possessor manufactured them from nothing, but because those qualities *matter*.

  And my mother embodied qualities that mattered immensely. Her intellectual fire – that relentless drive to understand, to argue, to get it *right* – wasn't something she claimed credit for inventing. But it *was* real. It animated her. It inspired her students. It challenged her colleagues (sometimes over turkey!). It filled her life with purpose. Her fierce care for her family and friends, her sometimes overwhelming protectiveness – she wouldn’t call it her sovereign creation. But it *was* the bedrock of countless moments of support, laughter, and shared understanding. Her stubbornness? Well, that made her a formidable advocate and a loyal friend, even if it sometimes meant Thanksgiving debates got… lively.

  She lived her philosophy. She understood the argument didn’t absolve anyone. Instead, it fostered in her a powerful sense of perspective and a deep curiosity. It made her intensely interested in the ‘why’ – why people are the way they are, why they act as they do. It wasn't an excuse; it was a call for understanding the complex web of causes that shape us. It fueled her empathy, even when she disagreed passionately. She looked at the world, and the people in it, with a profound sense of how astonishingly intricate and conditional it all is.

  So, why stand here and praise her? Why do we praise anyone? Not because they authored themselves *ex nihilo*. But because certain configurations of being are rare and precious gifts. They create light, warmth, challenge, and connection in the world. My mother’s configuration – her brilliant mind, her passionate heart, her stubborn spirit – was one such gift. It was a gift to her students, who encountered a teacher who genuinely wrestled with the deepest questions. It was a gift to her colleagues, who found a rigorous and formidable intellect. It was a gift to her friends, who found loyalty and sharp wit. And it was an immense, complex, and undeniable gift to her family.

  We praise her not because she manufactured her virtues from nothing, but because those virtues, embodied in *her*, touched us profoundly. We honour the incredible fact of her presence, the unique constellation of qualities she *was*. Her argument taught us that ultimate responsibility might be a myth. But her life taught us something else, something just as vital: that the absence of that mythical authorship doesn’t diminish the wonder, the value, or the sheer impact of a remarkable human being. We celebrate the gift she was, and we are immeasurably grateful for the luck, in all its complex forms, that brought her into our world. Thank you, Mom, for everything you were. We will miss you deeply.
