     Then: "Therefore, persistent disagreement in the real world does not necessarily imply irrationality or dishonesty." But the strict Bayesians might not accept that because they think that if the conditions are approximately satisfied, then disagreement is approximately a scandal. So we need to find common ground.

     Alternatively: Both can agree that if two agents have common priors and common knowledge of posteriors, then they must agree. And both can agree that in practice, we don't have common knowledge of posteriors and priors might not be common. So:

