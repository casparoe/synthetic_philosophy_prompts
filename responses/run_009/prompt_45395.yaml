prompt: |-
  I'm taking an upper-level epistemology course, and for our seminar blog I'd like to build a "which solution to the lottery paradox do you actually hold?" quiz. Please write eight questions, each presenting a concrete case rather than asking for labels or definitions, with two or three answer options apiece, followed by a scoring key that maps answer patterns onto the main positions: the skeptical solution (give up the lottery belief and accept that much everyday knowledge goes with it), the probabilistic or Kyburg-style rule (accept each individual high-probability proposition but refuse to conjoin them), the anti-luck or safety diagnosis (lottery beliefs are doomed to fail because they would be held even if false), the contextualist or standards-based view (what you can properly assert or believe shifts with the conversational stakes), and the degree-of-belief deflationary view (there is simply no flat-out belief there to attribute). The cases should include at least: a standard one-in-a-million fair lottery; the preface paradox, where an author believes each individual claim in her own book while also believing the book contains at least one error; a case where the odds are similarly long but the evidence is specific and testimonial rather than purely statistical; a case testing whether the beliefs compose under conjunction; a case where being wrong would be catastrophic; and a case involving a long single-premise deduction rather than the aggregation of many premises. Phrase every question so that someone with no epistemology background could answer it, and explicitly flag any pair of positions the quiz cannot reliably separate, rather than pretending the questions are sharper than they are. Please write the quiz and key in American English.
