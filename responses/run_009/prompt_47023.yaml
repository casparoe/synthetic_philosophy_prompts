  Next, why existing positions leave this open. Telic egalitarians openly accept that levelling down is better in one respect (equality) but worse overall. Utilitarians deny any respect in which it's better. Prioritarians claim a middle ground, but the user suspects they either default to utilitarianism on this point or, if they modify the view, end up with egalitarian-like commitments. The ambiguity lies in how prioritarianism's "weighting" function is interpreted—does it allow for any pro tanto goodness in equality?

