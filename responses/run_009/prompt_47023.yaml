  Possible conclusions: the strongest is that prioritarianism lacks a distinctive stance, defaulting to utilitarianism. Moderate might be that it can be distinctive but only by adopting egalitarian elements. Weakest is that the difference is verbal. Deciding factors include whether weighted benefits can imply pro tanto betterness in equality without individual gains, and if prioritarianism's structure inherently avoids egalitarian commitments.

