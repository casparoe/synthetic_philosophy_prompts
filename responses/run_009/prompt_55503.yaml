  my con law professor keeps leaning on the umpire thing for judicial review — the comparison Roberts made at his confirmation hearing (2005, i think): judges don't make the rules, they just apply them, call balls and strikes. the conclusion she wants out of it is that judicial review isn't really counter-majoritarian, i.e. that when unelected judges strike down a law they're not imposing their own will on the elected branches, they're just enforcing a rulebook everyone has to play under anyway — an umpire who calls a strike isn't "overruling" the pitcher. I'm skeptical of this but can't quite pin down why. can you audit the analogy properly? I want a real correspondence table — who's the pitcher, who's the batter, what plays the role of the strike zone, where instant replay fits, what the "season" is — and then the places the mapping breaks. then sort the disanalogies into the ones that actually matter for the counter-majoritarian question versus the cosmetic ones (yes, judges wear robes and umpires don't, I don't care about that). for instance: in baseball the strike zone is defined in the rulebook and (roughly) the same for both teams, and umpire error looks random around it — wether constitutional clauses like due process or cruel and unusual give you a "zone" like that is kind of the whole fight, no? also pitch-framing research suggests umpires aren't even neutral arbiters within their own sport, so maybe the analogy fails even on its own terms. so: does her conclusion survive once the breaks are on the table, and if not, is there a nearby analogy that would do the work better — like a referee in a sport with vaguer, judgment-based rules — or does defending judicial review by sports-official analogy fail at the root? lead with your bottom line in your very first sentence, then the reasoning. no preamble and don't restate my question back at me.
