answer: |-
  You've hit on a fascinating and deeply conflicted nexus of law, morality, economics, and philosophy. There is no single coherent "theory of posthumous interests" underlying this arrangement; it's a patchwork reflecting pragmatic compromises, unresolved philosophical tensions, and historical accidents. Here’s a reconstruction of the implicit logic, its contradictions, and what it might presuppose:

  ### The Current Arrangement: Three Conflicting Logics
  1.  **Defamation Law (No Posthumous Reputational Harm):**
      *   **Presupposition:** Strongly Epicurean/Lockean. Legal personhood and the capacity to suffer harm (including reputational harm) end at death. Only the living can be wronged by false statements that damage their social standing and opportunities. The dead lack subjectivity, so no harm *to them* exists.
      *   **Practical Rationale:** Prevents endless litigation by descendants, avoids chilling historical/scholarly discourse, and acknowledges the practical impossibility of defending the dead. Focuses legal protection on the living.
      *   **Implied Theory:** Death extinguishes personal dignity interests; only tangible property survives.

  2.  **Right of Publicity (Posthumous Property in Persona):**
      *   **Presupposition:** A quasi-Lockean labor theory or utilitarian incentive theory. The celebrity's lifetime effort created a valuable commercial asset ("persona"). This asset can be treated like intellectual property (copyright, trademark), inheritable and exploitable by heirs/estates to incentivize creation and reward labor (or luck).
      *   **Practical Rationale:** Prevents "free riding" on the deceased's fame, provides economic incentive for creative/public figures, and allows estates to manage and benefit from the commercial value generated *in life*. It's about *control* and *profit*, not dignity per se.
      *   **Implied Theory:** Persona is a separable, economic asset decoupled from the living person's subjectivity. Harm is economic loss to the estate, not dignitary harm to the deceased.

  3.  **Moral Norms & Audience Reactions (Posthumous Dignitary Harm):**
      *   **Presupposition:** A persistent intuition of **surviving interests** or **symbolic harm**. We feel a person's reputation, legacy, and "good name" retain meaning *for them* after death. Misrepresenting core character or inventing heinous acts feels like a betrayal or desecration, distinct from misleading the audience.
      *   **Practical Rationale:** Upholds societal values of respect for the dead, historical fidelity (even if aspirational), and a sense of narrative justice. It reflects a belief that a person's story *belongs* to them in a moral sense.
      *   **Implied Theory:** Identity and narrative survive biological death in a socially meaningful way. Wronging the dead is possible because their *story* persists in the public sphere and shapes their enduring significance. Harm is to their memory or symbolic presence.

  ### Can These Be Held Coherently?
  *   **Superficially? Yes, as separate domains:** Defamation protects living interests from immediate social harm. Publicity rights protect economic interests derived from past labor. Moral norms govern social respect and historical narrative. They answer "Can we sue?", "Who owns the commercial value?", and "Is this disrespectful?" respectively.
  *   **Philosophically? Only with significant tension and compartmentalization:** The core conflict is between the Epicurean legal denial of *any* posthumous harm (defamation) and the strong moral intuition (and, arguably, the *economic* logic of publicity rights, which implicitly recognizes the *ongoing value* of the persona linked to the *person*) that the dead retain *some* form of interest. Publicity rights sit awkwardly in the middle – economically pragmatic but philosophically muddy, treating the *symbolic identity* as property while denying its dignitary protection.

  ### The "Harm to the Living" Reconstruction
  This is the most common *legal realist* and *rationalist* explanation, and it captures much of the practice:
  *   **Defamation:** Protects living relatives from distress or associated stigma.
  *   **Publicity Rights:** Protect the economic interests of heirs/estates and incentivize creators.
  *   **Moral Outrage ("Wronging the Dead"):**
      *   Harms living descendants (distress, damaged family legacy).
      *   Harms fans/admirers (betrayal of their emotional investment).
      *   Harms society (corruption of the historical record, erosion of trust in narratives, violation of norms of respect).
      *   **Proxy Function:** "Wronging the dead" is a powerful *heuristic* or *social emotion* evolved to protect the interests of the living (kin, group cohesion, historical accuracy) and the stability of social narratives. We anthropomorphize the dead because it effectively motivates behavior beneficial to the living community.

  **Why "Dead Don't Have Experiences" Feels Too Quick:**
  Precisely because the practice *isn't* consistent. The moral outrage isn't *just* about misleading the living or harming descendants; it's specifically framed as a wrong *to the deceased*. Publicity rights, while economic, trade on the *unique identity and story* of the deceased person. The system intuitively treats the dead person's *narrative identity* as an entity requiring some form of protection (economic control) or respect (moral norms), even while the law explicitly denies their capacity for harm (defamation). This points to a deep-seated cultural belief in a "surviving narrative self."

  ### If We Took Posthumous Harm Seriously: Potential Changes & Challenges
  Acknowledging genuine posthumous dignitary harm would necessitate significant shifts, fraught with difficulties:

  1.  **Expanded Legal Standing for Estates:** Estates could potentially sue for defamation-like torts ("false light," intentional infliction of emotional distress *to the deceased's memory*, violation of a new "right to accurate portrayal"). This is the biggest change.
      *   **Problem:** Defining the standard. "Accuracy" is often subjective. Does it cover omissions? Interpretations? Composite characters? How much fictionalization is permissible? This creates massive chilling effects on art, biography, and history.
  2.  **Mandatory Disclosure:** Not just end-credit disclaimers ("dramatization"), but potentially specific notations for *invented negative acts* or significant deviations from documented character. (e.g., "The scene depicting [Name] committing [Act] is fictional").
      *   **Problem:** Clumsy, disrupts narrative flow, may not satisfy moral outrage if the act is egregious.
  3.  **Balancing Tests in Law/Codes:** Instead of a veto, courts or regulatory bodies could weigh the artistic/historical value against the severity of the misrepresentation and the potential harm to the deceased's legacy.
      *   **Problem:** Highly subjective, legally uncertain, expensive to litigate.
  4.  **Why Not Estate Veto?** Giving heirs control is problematic:
      *   **Bias:** Heirs have strong incentives to whitewash history and create hagiographies. They are not neutral custodians of "truth."
      *   **Privatizing History:** Important historical figures belong to the public sphere. Granting descendants control over narratives risks distorting history for private gain or reputation management.
      *   **Free Speech:** Creates significant prior restraint on artistic and historical expression.

  ### Reconstruction of the Implicit Theory & Underdetermination
  *   **The Implicit Hybrid Theory:** Society operates with a *pragmatic pluralism*:
      *   **Legally Pragmatic (Epicurean/Property):** The law denies posthumous harm for defamation to avoid chaos but recognizes the economic reality of the persona-as-property to facilitate commerce and reward effort. This is seen as administrable.
      *   **Morally Symbolic (Surviving Narrative Self):** Culturally, we act *as if* the deceased retain a dignitary interest in their story and reputation. Moral norms enforce this through social sanction, not law, balancing the need for narrative freedom with a deep-seated aversion to desecration.
      *   **Underlying Driver:** Protection of the interests of the living (relatives, society, historical record) *mediated through* the symbolic figure of the deceased.
  *   **Where It's Underdetermined (Multiple Views Fit):**
      1.  **Publicity Rights:** Could be justified purely economically (incentive/labor theory) *or* as a weak proxy for dignitary control (the estate acts as guardian of the legacy), *or* as preventing consumer confusion (trademark-like). The practice doesn't require choosing one philosophical base.
      2.  **Moral Outrage at Invented Cruelty:** Could stem from:
          *   Harm to living descendants.
          *   Harm to society (corrupted history).
          *   A symbolic harm *to the dead person's memory* as a social entity.
          *   Violation of a duty of respect owed *by the living* to the dead, regardless of the dead's subjective experience. The *feeling* of "wronging the dead" is consistent with several underlying justifications.
      3.  **Acceptance of Composites/Compression:** Reflects a pragmatic understanding of narrative necessity *and* a sense that these don't attack the *core character* or *essential truth* of the person in the same way as inventing a specific heinous act. This line is fuzzy and culturally contingent.
  *   **Where It Genuinely Commits:**
      1.  **Legally:** It commits to the Epicurean view *for defamation purposes* (no legal personhood after death). It commits to the property view *for publicity rights* (persona is an alienable asset).
      2.  **Morally/Practically:** It commits to the idea that *how we represent the dead matters*, that there *is* such a thing as disrespecting their memory, and that this disrespect *can* cause real harm *somewhere* (even if primarily to the living community or the integrity of history). It rejects the view that death makes all representations morally neutral. The practice of paying estates, while often driven by access to material/likeness, also tacitly acknowledges a *claim* of the estate (derived from the deceased) over the narrative, blurring the line between property and dignity.

  **Conclusion:** The system isn't built on a single, coherent theory of posthumous interests. It's a messy, functional compromise. Legally, it leans heavily Epicurean for defamation and Lockean/property-based for publicity. Morally and culturally, it operates with a strong, persistent intuition of a surviving narrative identity deserving respect, acting as a powerful social force that the law deliberately avoids codifying for practical reasons. The rationalist view explains much of the legal structure but fails to capture the depth and persistence of the moral intuition that drives audience reactions and the very economic value exploited by publicity rights. The tension between "no subject, no harm" and "their story still matters" is likely inherent and unresolved in human societies.
