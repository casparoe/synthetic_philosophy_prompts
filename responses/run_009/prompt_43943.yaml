answer: |-
  Here's a distilled specification for theories of idealized preferences, based on core philosophical, decision-theoretic, and alignment challenges. The **Fidelity-Improvement-Determinacy Trilemma** is central.

  ### Core Desiderata (Non-Negotiable)

  1.  **Fidelity to Actual Agency:** The idealization process must meaningfully track the *actual values, concerns, and identity* of the agents whose preferences are being idealized. It cannot output preferences that are alien or unrecognizable to the original agents without justification rooted in *their own* perspective. *(Case: Avoids value hijacking; ensures the idealized agent is still "us" in a morally relevant sense. Violated by arbitrary idealizers.)*
  2.  **Avoidance of Designer Value Laundering ("Ghost in the Machine"):** The theory must not allow the preferences, biases, or normative commitments of the *designer* (or the formalization process) to illegitimately masquerade as the idealized output of the target agents' preferences. *(Case: Core alignment problem; if the designer's values are baked into the idealizer, the output is not genuinely the agents'. Violated by many naive formalizations.)*
  3.  **Convergence/Determinacy (Practical):** The idealization process must yield a *sufficiently definite output* for practical purposes (e.g., guiding AI behavior). It cannot be infinitely regressive, path-dependent in unacceptable ways, or yield radically divergent answers under minor perturbations. *(Case: An undefined or wildly unstable output is useless for alignment. An AI cannot act on "keep reflecting forever.")*
  4.  **Handling Preference Resistance/Instability:** The theory must specify what happens when core preferences are *fragile* under idealization (e.g., contradictory upon reflection, deeply context-dependent, reliant on false beliefs, or actively resist coherence pressures). It cannot silently discard or fundamentally alter them without a principled reason rooted in the agent's own perspective. *(Case: Real preferences are often messy; a theory that breaks on paradoxes or deep inconsistencies fails descriptively and normatively.)*

  ### Important Desiderata (Often Camp-Dependent, But Critical for Adequacy)

  5.  **Improvement/Robustness:** The idealized preferences should be *better* than the agents' current preferences in some relevant sense (e.g., more informed, more coherent, more robustly justified, leading to better outcomes *by the agents' own lights* under reflection). *(Case: The *point* of idealization; non-improving idealization is pointless. "Better" is contested - epistemic? prudential? moral?)*
  6.  **Handling Reflection Non-Termination (Theoretically):** While the *output* must be definite (Desideratum 3), the theory must acknowledge that full "reflective equilibrium" or "complete knowledge" is a limit concept, not a state achievable in finite steps. It must define a *stopping point* or *output condition* that is justifiable even if reflection *could* continue. *(Case: Pure limit concepts are unimplementable; we need a finite process yielding a stable-enough output.)*
  7.  **Composability/Group Handling:** The theory must scale beyond single agents to groups (humanity) in a principled way, addressing aggregation, interpersonal comparisons, conflicting idealized preferences, and possible emergence of collective values. *(Case: CEV explicitly targets "humanity"; single-agent theories don't suffice for alignment.)*
  8.  **Meta-Preference Capture:** The theory should be sensitive to agents' preferences *about the idealization process itself* (e.g., "I don't want my preferences idealized in *that* way," "I value authenticity over perfection"). *(Case: Respects agency at a higher level; avoids forcing agents into a specific mold of rationality.)*

  ### The Trilemma & Tensions

  *   **Your Hunch is Correct:** **Fidelity, Improvement, and Determinacy form a core tension. It's exceptionally hard to maximize all three simultaneously.**
      *   **High Fidelity + High Improvement:** Risks non-convergence or instability (e.g., deep reflection reveals unresolvable conflicts, making a single "idealized" output elusive).
      *   **High Fidelity + High Determinacy:** Risks minimal improvement (e.g., outputting naive aggregation of current preferences, or stopping reflection too early to avoid instability).
      *   **High Improvement + High Determinacy:** Risks low fidelity (e.g., imposing an external idealization standard - like strong coherence axioms or a specific epistemic state - that overrides or distorts actual agents' values to force convergence).
  *   **Other Key Tensions:**
      *   **Avoiding Laundering vs. Improvement:** Truly avoiding designer influence constrains the *methods* used for improvement.
      *   **Handling Resistance vs. Convergence/Determinacy:** Fragile preferences inherently threaten definite outputs.
      *   **Meta-Preferences vs. Improvement/Convergence:** Agents might meta-prefer processes that resist convergence or specific types of improvement.

  ### Quick Scorecard

  1.  **CEV (Original Sketch):**
      *   **Fidelity:** Ambiguous (aims high, but "coherent extrapolated volition" underspecified).
      *   **Avoid Laundering:** *High Intent*, but mechanism risk is severe.
      *   **Determinacy (Practical):** *Very Low* (Highly underspecified; massive convergence problems).
      *   **Resistance:** Not addressed.
      *   **Improvement:** *High Goal* (knowledge, reflection).
      *   **Non-Termination:** Not adequately handled.
      *   **Composability:** Central, but method undefined.
      *   **Meta-Prefs:** Not addressed.
      *   **Trilemma:** Sacrifices **Determinacy** for **Fidelity+Improvement** (in theory), but **Fidelity** is shaky in practice.

  2.  **Economic Rationality (Idealizer):**
      *   **Fidelity:** *Low* (Imposes axioms; ignores non-instrumental values, context).
      *   **Avoid Laundering:** *Low* (Designer chooses axioms/model; strong normative assumptions).
      *   **Determinacy (Practical):** *High* (Well-defined math).
      *   **Resistance:** *Low* (Fragile prefs often deemed "irrational" and discarded).
      *   **Improvement:** *Medium* (Coherence only, no epistemic/moral improvement).
      *   **Non-Termination:** *Handled* (by fiat - axioms define "rational").
      *   **Composability:** Difficult (aggregation problems).
      *   **Meta-Prefs:** Ignored.
      *   **Trilemma:** Sacrifices **Fidelity** for **Improvement (coherence) + Determinacy**.

  3.  **Reflective Equilibrium (Rawlsian/Daniels-style):**
      *   **Fidelity:** *High* (Starts from considered judgments).
      *   **Avoid Laundering:** *Medium* (Process aims at agent's coherence, but designer sets scope/constraints).
      *   **Determinacy (Practical):** *Low* (Iterative, potentially path-dependent; no clear stopping rule).
      *   **Resistance:** *Medium* (Designed to handle conflicts via adjustment, but stability not guaranteed).
      *   **Improvement:** *High Goal* (Coherence + justification).
      *   **Non-Termination:** *Explicitly Not Handled* (Ongoing process).
      *   **Composability:** Difficult (Primarily individual focus).
      *   **Meta-Prefs:** Implicitly included as "considered judgments".
      *   **Trilemma:** Sacrifices **Determinacy** for **Fidelity + Improvement**.

  **Conclusion:** You've identified the core tension. No current theory cleanly satisfies all non-negotiables. The Trilemma (**Fidelity vs. Improvement vs. Determinacy**) is robust. Building an adequate theory requires explicitly navigating these trade-offs, rigorously defining "improvement," handling fragility without laundering, and finding a principled, finite stopping point for reflection that preserves fidelity. CEV's sketch points towards important goals but lacks the operational rigor needed to resolve the core tensions. Your focus on the *spec* before arguing goodness/badness is exactly right.
