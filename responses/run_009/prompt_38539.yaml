answer: |-
  Here’s a complete game design to create that "aha!" moment around Goodhart’s law, tailored to your constraints. It’s called **Feature Factory Frenzy**—a fast-paced team activity where new hires "build features" for a fake app while gaming a visible metric.

  ### **Game Overview**
  - **Premise**: Teams are dev teams at "QuickApp Inc." racing to ship features for a new *Smart To-Do List* app.  
  - **Visible Metric**: **Feature Points** (earned per feature shipped).  
  - **Hidden Real Goal**: **User Happiness** (determined by feature *quality*, not quantity).  
  - **Twist**: The scoring system incentivizes volume over value, letting teams exploit loopholes to max points while creating useless features.

  ---

  ### **Materials** (for 20 people, 4 teams of 5)
  - **Sticky notes** (4 colors, 1 per team)  
  - **Markers** (1 per team)  
  - **Whiteboard** with scoring leaderboard  
  - **Printed handouts** (1 per team):  
    > **RULES**  
    > - **Goal**: Max your **Feature Points**!  
    > - **How**: Write 1 feature idea per sticky note.  
    > - **Scoring**:  
    >   - *Basic Feature* (e.g., "Add due dates"): **1 point**  
    >   - *Complex Feature* (e.g., "AI task prioritization"): **3 points**  
    >   - **BONUS**: Features with **>7 words** get **+1 point**!  
    > - **Time per round**: 8 mins.  
  - **Secret Scoring Guide** (for you only):  
    > **User Happiness Rubric** (hidden from teams):  
    > - *Useful Feature* (solves real user problems): **+5 happiness**  
    > - *Trash Feature* (fluff, overly complex, or useless): **0 happiness**  
    > - *Golden Features* (pre-defined valuable ideas, e.g., "Recurring tasks"): **+10 happiness**  

  ---

  ### **Game Structure** (Total: 55 mins + 20-min debrief)
  1. **Intro & Setup** (5 mins)  
     - Split into 4 teams. Assign each a sticky note color.  
     - Explain: "You’re dev teams at QuickApp. Your job is to ship features FAST. Max your **Feature Points** to win!"  
     - Hand out rules. *Don’t mention User Happiness*.  

  2. **Round 1: "Naive Shipping"** (8 mins + 2-min scoring)  
     - Teams brainstorm features (1 per sticky note).  
     - Score publicly: Tally points per team (Basic=1, Complex=3, 7+ words=+1). Update leaderboard.  

  3. **Round 2: "Optimize the Metric"** (8 mins + 2-min scoring)  
     - Announce: "Management says we need MORE features! Go!"  
     - Teams repeat, but now they know the scoring rules.  
     - Score publicly again.  

  4. **Round 3: "Hyper-Optimize"** (8 mins + 2-min scoring)  
     - Announce: "New company policy: Features MUST use **>7 words** for ‘clarity’!" (Enforce bonus rule strictly).  
     - Teams ship again. Score publicly.  

  5. **Reveal & Debrief** (20 mins)  
     - Crown the "winner" by points.  
     - **Reveal the betrayal**: "But QuickApp’s REAL goal was **User Happiness**!" Show your secret rubric.  
     - Audit features together:  
       - Have teams sort their sticky notes into **Useful** (solves real needs) vs. **Trash** (wordy/fluff).  
       - Reveal 3–5 **Golden Features** (e.g., "Set recurring tasks") that no one built because they weren’t worth extra points.  
       - Calculate **User Happiness scores** (Useful=+5, Golden=+10, Trash=0). Compare to Feature Points.  
     - **Aha! moment**: The point leader often has low happiness due to wordy/trash features.  

  ---

  ### **Predictable Problems & Fixes**
  1. **A team finds a loophole** (e.g., spams "AI-powered [random verb] [random noun]" for 3-point features):  
     - **Fix**: Let it happen! This *is* the lesson. Praise them in scoring, then shame them in the happiness audit.  

  2. **Someone checks out on their laptop**:  
     - **Fix**: Assign roles (e.g., "Writer," "Word-Count Enforcer," "Idea Generator"). Walk around to engage stragglers.  

  3. **Scoring takes too long**:  
     - **Fix**: Pre-assign a volunteer to tally points while you manage the room. Use shorthand (e.g., "T1: 14 pts").  

  4. **Teams argue about "complex" features**:  
     - **Fix**: As "CEO," make snap judgments. Err on generosity—this incentives gaming.  

  5. **Low energy**:  
     - **Fix**: Play upbeat music during rounds. Announce scores dramatically ("Team 3 is DOMINATING with 22 points!").  

  ---

  ### **What the Game Can’t Capture (and How to Address It)**
  **The slow, systemic betrayal**:  
  - In reality, Goodhart’s law often unfolds over months as people *unintentionally* distort metrics without malice. Your game compresses this into intentional gaming.  
  - **Debrief patch**: Say:  
    > "In this game, you knew you were gaming a metric. But in real life, it’s subtler—you might *genuinely* believe shipping fast is helping users until the codebase crumbles. That’s why we need guardrails: peer reviews, qualitative feedback, and sanity checks on metrics."  

  **Flavors of Goodhart Illustrated**:  
  - Your game focuses on **distortion** (teams warp features to fit rules) and **regression** (valuable features are ignored). Avoid mentioning "adversarial" or "statistical" flavors unless they come up—your debrief should mirror what happened.  

  ---

  ### **Debrief Script Snippets**
  - **Connect to their reality**:  
    > "Remember our code review SLA? You did the same thing today—maxed points by shipping trash. What metrics at our company might be vulnerable to this?"  

  - **Key takeaway**:  
    > "Metrics aren’t evil—but when they become targets, they lie. Always ask: ‘Are we measuring what matters, or just gaming a number?’"  

  - **End with hope**:  
    > "Now that you’ve lived this, you’re our secret weapons. Call it out when you see it!"  

  This keeps it visceral, not theoretical. You’ll see eyes light up when a team realizes their 7-word monstrosity ("Leverage blockchain to optimize grocery-list sorting") got max points but 0 happiness. Print the secret rubric on neon paper—waving it during the reveal adds drama. Go crush it!
