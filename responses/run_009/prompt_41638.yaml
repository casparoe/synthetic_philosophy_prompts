prompt: |-
  Been thinking about who should actually get a vote and my gut verdicts feel embarrassingly inconsistent, so help me figure out if there's any principle behind them. Here's where I land on cases: kids, no. Tourists passing through for a week, obviously no. Someone who's lived here 20 years on a work permit, pays taxes, kids in the local school: yes, I genuinely think it's wrong that they can't vote. My cousin who emigrated 25 years ago, never visits, barely reads the news from here but kept her citizenship: technically gets a vote and I guess that's fine, though it feels a bit off. Prisoners: I'm actually fine with them voting. Future generations who will live with the climate consequences of what we decide now: they should somehow count, even though they obviously can't cast ballots. People in the neighboring country whose economy gets hammered by our trade policy: no, they don't get a vote here, that's not even close. And it bugs me that 70-year-olds vote on 50-year infrastructure bonds that will barely touch them while 16-year-olds, who will live with the result, get nothing.

  I toyed with "everyone subject to the laws gets a say," but tourists are subject to the laws while they're here and that clearly doesn't get them a vote, so that's dead on arrival. Is there one principle that captures all or nearly all of my verdicts — some theory about affected interests, or being subject to coercion, or having a stake in the ongoing project, or something I haven't thought of — and if not, which of my verdicts do I have to give up? I suspect the permanent resident and the affected foreigner are the pair that can't both survive. And tell me what the winning principle says about the case I keep flip-flopping on: should 16 and 17 year olds get to vote in a local referendum on something that'll reshape the town for the next 40 years?
reasoning: |-
  Okay, the user is struggling with inconsistencies in their views on voting rights. They've listed several scenarios: denying votes to kids and tourists, supporting long-term residents without citizenship, being unsure about expats, supporting prisoners and future generations, and opposing votes for affected foreigners. They also mention discomfort with elderly voting on long-term issues while young people can't. 

  Hmm, the core issue seems to be finding a unifying principle that explains their intuitive judgments. They've already considered and rejected the "subject to laws" argument because it includes tourists. Their examples suggest they value a deeper connection than just legal subjection—like enduring ties to the community.

  Let me break down their positions. They support voting for the 20-year resident (deep ties), prisoners (permanent impact), and future generations (long-term stakes). They reject tourists (temporary), kids (capacity?), and affected foreigners (external). The expat cousin is a borderline case—citizenship without current ties. 

  The tension they mention between the resident and affected foreigner is key. Why is one a yes and the other a no? Both are impacted, but the resident is *embedded* in the community while the foreigner isn't. That points to "membership" as the hidden criterion—not just affectedness, but being part of the collective project. 

  For the 16-year-old referendum question: under the membership principle, if they're members of the polity (even if young), and the decision directly shapes their future, consistency suggests they should vote. Their discomfort with elderly voting on long-term bonds while youth can't also supports this—it's about whose life-project is at stake. 

  The user might also be wrestling with democratic legitimacy beyond pure logic. Their gut accepts citizenship (like the expat) even when it feels off, because it's a formalized membership token. That's why the resident without citizenship *feels* wrong to exclude—they're de facto members. 

  So the winning principle is "membership in the ongoing political community," with "stake" and "enduring ties" as proxies. They'd need to either accept including deeply affected foreigners (which clashes with their "no") or accept that membership boundaries are somewhat arbitrary—but their instincts mostly align here. For the 16-year-olds, the principle says yes: they're members, and the referendum directly implicates their stake.
answer: |-
  Your intuitions reveal a coherent principle struggling against formal citizenship boundaries: **voting rights should belong to those whose *life-project is durably tied to the political community's future*.** This emphasizes *enduring stake* and *membership*, not just momentary impact or legal status.

  Here's how your cases align with this principle:

  | **Case** | **Your Verdict** | **Life-Project Principle** | **Analysis** |
  |----------|------------------|----------------------------|--------------|
  | **Long-term resident (20 yrs, taxes, kids in school)** | Yes ✓ | **Yes** | Deeply embedded in community; life actively shaped by policies. |
  | **Prisoners** | Yes ✓ | **Yes** | Remain part of society; laws directly govern their present/future. |
  | **Future generations** | Should count ✓ | **Yes** (in principle) | Ultimate stakeholders in long-term outcomes; proxy representation needed. |
  | **16/17-year-olds in 40-year referendum** | Flip-flops ⚠️ | **Yes** | Directly impacted by multi-decade decisions; life-project anchored here. |
  | **Tourists (1 week)** | No ✗ | **No** | Transient presence; no durable life investment here. |
  | **Kids** | No ✗ | **No** | Still developing autonomy/stake; guardianship suffices for now. |
  | **Affected foreigners (trade policy)** | No ✗ | **No** | Impacted but not *members*; life-project tied to their own polity. |
  | **Expat cousin (citizen abroad 25 yrs)** | "Feels off" ⚠️ | **Marginal case** | Formal citizenship without active stake; principle suggests *revocability* if ties lapse. |
  | **70-year-olds voting on 50-year bonds** | Unfair ✗ | **Permitted but ethically flawed** | Technically members, but highlights *intergenerational justice gap* in current systems. |

  ### The Tension Points & Resolutions:
  1. **Permanent Resident vs. Affected Foreigner**:  
     - **Resolution**: They *can* coexist. The foreigner is impacted but not a *member* of your polity. Your resident, despite lacking citizenship, has woven their life into your community's fabric. The principle accepts that polities have boundaries; impact alone doesn't grant voting rights, but membership + enduring stake should.

  2. **The Expat Cousin**:  
     - **Resolution**: Citizenship without ongoing life-ties becomes hollow. Your unease exposes a flaw in *indelible* citizenship. A consistent principle would support revoking voting rights after prolonged absence/detachment (e.g., 10+ years abroad without ties), treating citizenship as a *living bond*, not a static legal fact.

  3. **70-Year-Olds vs. 16-Year-Olds**:  
     - **Resolution**: Under this principle, 16-year-olds *should* vote on the 40-year referendum. Their life-project is irrevocably tied to the outcome, unlike the elderly with limited stakes. Denying them a vote prioritizes arbitrary age lines over democratic legitimacy.

  ### Why This Principle Works:
  - **Subject to Laws Isn't Enough**: Tourists follow laws temporarily, but their life-project isn't anchored here.  
  - **Coercion Isn't Sufficient**: Prisoners are coerced, but their inclusion stems from enduring membership, not coercion alone.  
  - **Stake > Impact**: Neighboring countries feel impact, but stake requires integration into the collective future.  

  ### Where It Demands Revision:
  Your verdict on the **affected foreigner** holds, but you must either:  
  a) Accept that formal citizenship is an imperfect proxy for "life-project membership," and support pathways to voting rights for embedded non-citizens (as you do), OR  
  b) Reject voting rights for long-term residents (which you find unjust).  

  **On 16/17-year-olds**: The principle demands a **"Yes"** for the referendum. If their future is bound to a 40-year decision, excluding them violates the core idea of enfranchising those whose life-projects are at stake. Age-based exclusions become harder to justify when specific, long-impact decisions arise.  

  **Conclusion**: Your instincts reflect a **"stakeholder membership" theory** of democracy. It’s more nuanced than "all affected interests," emphasizing *durable belonging* and *investment in the collective future*. To fully embrace it, advocate for:  
  - Voting rights for residents meeting a "durable tie" threshold (e.g., 5+ years).  
  - Revocable citizenship for long-absent expats.  
  - Lower voting ages for long-term policy decisions.  
  - Institutional proxies for future generations (e.g., climate guardians).  

  This doesn’t eliminate all gray areas, but it names the core value driving your judgments: democracy belongs to those building a shared future.
