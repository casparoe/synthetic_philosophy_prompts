  We are going to design a decision procedure that helps facilitators determine what to put in the "root cause" field during incident retrospectives. The procedure must be practical, fit within 90 minutes, and be usable by non-philosophers.

   The core idea: 
     - Counterfactual camp: "The incident wouldn't have happened without X." 
     - Interventionist camp: "We can fix Y to prevent recurrence, and Y is the most actionable point."

   We'll structure the procedure as a series of questions. The goal is to either:
     a) Identify a single root cause that satisfies both camps (if possible).
     b) Acknowledge two valid entries (one counterfactual, one interventionist) and record both.
     c) If we get stuck, we escalate to engineering leadership for prioritization.

   Steps:

   1. **Describe the failure chain** (timeline of events and conditions). 
      - Use a whiteboard or shared doc. Include every known contributing factor. 
      - Stop when we have a chain that leads from a starting point to the outage.

   2. **Counterfactual analysis:**
      - For each event/condition in the chain, ask: "If we remove this, would the incident still have occurred?"
      - Mark every factor that, if removed, would have prevented the incident. These are the counterfactual causes.

   3. **Interventionist analysis:**
      - For each counterfactual cause identified in step 2, ask: "Is this something we can change? And if we change it, would it prevent similar incidents without requiring us to fix everything else in the chain?"
      - We are looking for the most actionable and effective intervention point(s). If multiple, note them.

   4. **Synthesis:**
      - If there is a factor that is both a necessary condition (counterfactual) and an actionable intervention point, then that is the root cause. Record it.
      - If the counterfactual causes are not actionable (e.g., the intern's action) but there is an actionable intervention (e.g., the approval step), then we have two candidates. We record both? Or do we prioritize?
      - If there are multiple intervention points, we note them and then move to step 5.

   5. **Escalation for prioritization:**
      - If we have multiple intervention points and the team cannot agree on which one is the most effective or feasible, OR if we have a conflict between counterfactual and interventionist candidates and the team is stuck, then we escalate to engineering leadership. We say: "We have identified several contributing factors and potential fixes. We need to prioritize which one to label as the root cause for the record and which ones to act on. Here are the options: ..."

   6. **Recording:**
      - We allow for two entries in the root cause field if both the counterfactual and interventionist perspectives are strongly held and valid. We can format as: 
            "Counterfactual: [X]; Intervention: [Y]"
