answer: |-
  Here's a practical decision procedure for your facilitators, designed to resolve the "root cause" debate in 90 minutes. The key is separating **trigger events** from **preventable system failures** and forcing explicit prioritization when needed.

  ---

  ### **Root Cause Decision Procedure**  
  *(For facilitators with minimal philosophy background)*  

  **Core Principle**:  
  - **Counterfactual Cause**: "The outage wouldn't have happened without X" (usually the *trigger*).  
  - **Intervention Cause**: "We can fix Y to prevent recurrence" (usually a *preventable system gap*).  
  **Goal**: Capture BOTH if they meaningfully differ. Otherwise, prioritize interventions.  

  ---

  #### **Step 1: Map the Failure Chain** (20 min)  
  - **Ask**: "What conditions/events *had to be true* for this outage to occur? List them in order."  
  - **Sufficient Answer**: A flowchart showing:  
    - Triggering event (e.g., "intern pushed config")  
    - Safeguards that failed (e.g., "approval step skipped")  
    - Underlying flaws (e.g., "caching misconfigured")  
  - **Stop If**: The group agrees on ≥3 critical links in the chain.  

  #### **Step 2: Counterfactual Test** (15 min)  
  - **Ask**: "Remove ONE item. Would the outage *still* have occurred?"  
  - **Sufficient Answer**: "Yes" → discard. "No" → it's a **counterfactual cause**.  
  - **Output**: List of 1–3 items (e.g., "intern push," "caching layer").  

  #### **Step 3: Intervention Test** (15 min)  
  - **Ask for each counterfactual cause**:  
    1. "Can we *realistically change* this?"  
    2. "Would fixing it prevent *future* incidents *without* needing to fix everything else?"  
  - **Sufficient Answer**:  
    - **Yes to both** → **Intervention cause** (e.g., "approval step design").  
    - **No to #1** → Escalate to engineering leadership (Step 4).  
    - **No to #2** → Not a root cause (e.g., "intern" fails #2).  

  #### **Step 4: Escalation/Synthesis** (25 min)  
  - **Ask**: "Do we have BOTH a trigger (counterfactual) AND a system gap (intervention)?"  
    - **Yes** → Record **TWO root causes**:  
      - `Trigger: [counterfactual]`  
      - `System Gap: [intervention]`  
    - **No** → Use the intervention cause *if available*, else the counterfactual.  
  - **Escalate to Leadership If**:  
    - An intervention cause is *not fixable* by the team (e.g., vendor dependency).  
    - Disagreement on which intervention is *highest leverage*.  
  - **Final Output**: 1–2 root cause entries max.  

  #### **Step 5: Action Ownership** (15 min)  
  - Assign owners for fixes *only* to intervention causes. Triggers get training/monitoring.  

  ---

  ### **Applied to Your Incidents**  
  #### **Incident 1: Intern's Config Push**  
  - **Step 1**:  
    - Trigger: Intern pushed config.  
    - Failed Safeguards: Approval step (skipped if OOO), caching layer (misconfigured).  
  - **Step 2** (Counterfactual):  
    - Without intern push? → Outage avoided. **Trigger cause: Intern push**.  
    - Without approval skip? → Outage avoided. **Counterfactual cause: Approval step**.  
    - Without caching flaw? → Outage avoided. **Counterfactual cause: Caching layer**.  
  - **Step 3** (Intervention):  
    - Intern push: Can’t realistically prevent all mistakes (❌ fails #2).  
    - Approval step: Fixable (e.g., require backup reviewer) → **Intervention cause**.  
    - Caching layer: Fixable → **Intervention cause**.  
  - **Step 4**:  
    - Trigger + multiple interventions → Record **TWO**:  
      - `Trigger: High-risk config push by intern`  
      - `System Gaps: Approval step silent skip on OOO; Caching misconfiguration`  
  - **Why you won’t like this**: It buries the human action under system gaps. But the trigger is explicitly called out, and interventions are prioritized for fixes.  

  #### **Incident 2: DNS Provider Failure**  
  - **Step 1**:  
    - Trigger: DNS provider bad rollout.  
    - System Gap: Single vendor, no backup.  
  - **Step 2** (Counterfactual):  
    - Without DNS rollout? → Outage avoided. **Trigger cause: Vendor rollout**.  
    - Without single vendor? → Outage avoided. **Counterfactual cause: No backup**.  
  - **Step 3** (Intervention):  
    - Vendor rollout: Can’t change externally (❌ fails #1) → **ESCALATE**.  
    - No backup: Fixable → **Intervention cause**.  
  - **Step 4**:  
    - Leadership decides: "No backup" is root cause (only actionable fix).  
  - **Output**: `System Gap: Single-vendor DNS dependency`  

  #### **Incident 3: Memory Leak Crash**  
  - **Step 1**:  
    - Trigger: Traffic spike.  
    - System Gaps: Known unfixed memory leak; Prioritization process.  
  - **Step 2** (Counterfactual):  
    - Without traffic spike? → Outage avoided. **Trigger cause: Traffic spike**.  
    - Without memory leak? → Outage avoided. **Counterfactual cause: Memory leak**.  
    - Without prioritization flaw? → Outage avoided. **Counterfactual cause: Process gap**.  
  - **Step 3** (Intervention):  
    - Traffic spike: Can’t prevent (❌ fails #1).  
    - Memory leak: Fixable → **Intervention cause**.  
    - Prioritization process: Fixable → **Intervention cause**.  
  - **Step 4**:  
    - Trigger + multiple interventions → Record **TWO**:  
      - `Trigger: Traffic spike exceeding capacity`  
      - `System Gaps: Unfixed known memory leak; "Fix eventually" prioritization process`  

  ---

  ### **Where the Procedure Won't Solve Arguments**  
  1. **When "intervention" feels like blame-shifting**:  
     - E.g., Team argues "intern push" *should* be the root cause.  
     - **Facilitator action**: Record both (trigger + gap) per Step 4. Reiterate: "Triggers get training; gaps get engineering fixes."  

  2. **When multiple interventions compete**:  
     - E.g., In Incident 1, is "approval step" or "caching" higher priority?  
     - **Facilitator action**: Escalate to leadership with options.  

  3. **When counterfactuals are oversimplified**:  
     - E.g., "Without gravity, the server wouldn’t have fallen!"  
     - **Facilitator action**: Rule out non-actionable/non-unique factors in Step 2.  

  ### **Why This Works**  
  - **Forces granularity**: Separates *what happened* from *what we fix*.  
  - **Deprioritizes blame**: Humans are triggers; systems take the "root cause" slot only if fixable.  
  - **Handles escalations cleanly**: Leadership decides political/strategic trade-offs.  
  - **Fits 90 min**: Strict timeboxing per step.
