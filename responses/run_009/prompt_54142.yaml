prompt: |-
  I have a friend from my local LessWrong meetup who is very much not a libertarian about markets, which is honestly a bit surprising for the crowd, and before I argue with her again I want to figure out what principle she's actually running. Her verdicts so far: selling a kidney to a stranger -- ban it. Selling your vote in an election -- ban it. Stores jacking up water and generator prices right after a hurricane -- ban it. Ticket scalping on StubHub -- fine, whatever. Getting paid to donate blood plasma -- fine. Selling your hair to a wig maker -- fine. Getting paid to donate eggs, with compensation caps -- fine. People keep telling her she's just channeling Sandel or Satz but I don't think she'd accept either label.

  We're getting coffee next week and two new cases are on the table. One is an app that lets you sell your spot in line at the DMV to whoever is willing to pay for it -- pure queue market, nobody's desperate. The other is a pharma company paying healthy volunteers a few thousand dollars to be deliberately infected with malaria for vaccine research.

  Predict her verdict on each. Lay out the candidate rules that fit her track record equally well (I can see at least two -- something like "markets are wrong when one side is desperate or has no real choice" vs "markets are wrong when they corrupt a good that's not supposed to be for sale"), say what each one predicts for the two cases, then give me your best guess with actual reasoning. Also tell me what further case would split the rules apart, because I kind of want to run it on her and see. Answer in American English please, and keep it reasonably tight.
reasoning: |-
  Okay, the user is asking me to predict their friend's stance on two hypothetical scenarios based on her previous judgments about various market transactions. They've provided a clear list of what she bans and allows: banning kidney sales, vote selling, price gouging during hurricanes, but allowing ticket scalping, paid plasma donation, hair sales, and compensated egg donation with caps. 

  The user wants me to identify the underlying principles behind these judgments. I need to consider different ethical frameworks that could explain her pattern. Two main candidates come to mind: the "desperation/no choice" principle (focusing on vulnerability) versus the "commodification/corruption" principle (focusing on the intrinsic nature of certain goods).

  Looking at her track record: She bans kidney sales (desperate sellers), vote selling (undermines democracy), and hurricane price gouging (exploits desperation). She allows ticket scalping (voluntary exchange without desperation), plasma donation (compensated but regulated), hair sales (harmless commodification), and egg donation with caps (regulated bodily commodification). 

  Now for the new cases: First, the DMV queue app. This is a pure market for "waiting" as a service - no desperation involved, just convenience. Second, the malaria challenge trial - paying healthy volunteers for medical research participation, which involves bodily risk but offers compensation.

  Applying the first principle ("desperation/no choice"): The DMV queue has no desperation - likely acceptable. The malaria trial involves compensated risk-taking - similar to egg donation, so probably acceptable with safeguards. 

  Applying the second principle ("commodification/corruption"): The DMV queue might be seen as corrupting civic services - likely banned. The malaria trial could be medical commodification - ambiguous, but medical research context might make it acceptable. 

  There's tension between these principles for the DMV case. Her allowance of ticket scalping (which is queue-jumping for entertainment) suggests she might accept the DMV app too, since both involve non-essential services. But if she sees government services as sacred, she might ban it. 

  For the malaria trial, her acceptance of compensated egg donation suggests she'd allow this too, as both are compensated medical contributions with risk. The key difference is the infection risk versus the egg retrieval procedure. 

  My prediction: She'll accept the malaria trial (similar to egg donation) but reject the DMV app (as queue-jumping feels corrupt for public services). The best divider case would be something like compensated medical trial participation versus paid line-standing for essential services. 

  The user seems intellectually curious and wants to understand their friend's ethical framework. They're preparing for a coffee discussion and want to test hypotheses. By providing a divider case, I'm giving them a tool to explore this further in conversation.
answer: |-
  Based on your friend's pattern, here's the breakdown and prediction:

  **Candidate Rules:**
  1.  **"Desperation/No Real Choice" Principle:** Markets are wrong when one party is vulnerable due to desperation, lack of alternatives, or severe need, leading to exploitation or compromised consent. Focuses on *circumstances*.
  2.  **"Commodification/Corruption" Principle:** Markets are wrong when they convert a good, practice, or social relationship that should be governed by non-market values (citizenship, dignity, necessity, intrinsic worth) into a mere commodity, thereby degrading its meaning or function. Focuses on the *nature of the good/act*.

  **Analysis of Track Record:**
  *   **Bans:** Kidney sale (desperate seller? / corrupts body integrity?), Vote sale (corrupts democracy), Hurricane price gouging (exploits desperation / corrupts access to necessity).
  *   **Allows:** Ticket scalping (voluntary, non-essential good), Plasma donation (regulated bodily fluid sale), Hair sale (harmless bodily good), Egg donation (regulated, capped bodily service).
  *   **Key Tension:** Ticket scalping involves "queue jumping" like the DMV case, yet she allows it. Why? Likely because concerts are seen as purely commercial/optional, while voting and hurricane supplies are not.

  **Predictions for New Cases:**

  1.  **Selling your DMV queue spot via an app:**
      *   **"Desperation" Rule Predicts:** *ALLOW*. No desperation implied. It's a pure convenience/time swap.
      *   **"Commodification" Rule Predicts:** *BAN*. Civic services (like voting, DMV access) should be based on fairness and equal access ("first come, first served"). Selling spots commodifies civic queueing, corrupting the principle of equal treatment for essential services. *This aligns with her ban on vote-selling.*
      *   **Your Friend's Likely Verdict:** **BAN.** The "Commodification" principle fits best here. She banned vote-selling (corrupting a civic act) and sees the DMV queue similarly – a civic/public service where fairness matters. Ticket scalping is commercial/private, hence allowed. The principle isn't queues generally, but *the type* of good/service the queue serves.

  2.  **Paid Malaria Challenge Trial:**
      *   **"Desperation" Rule Predicts:** *ALLOW (with safeguards)*. Volunteers are presumed healthy and consenting; payment is compensation for time/risk, not exploiting desperation. Similar to plasma/egg donation.
      *   **"Commodification" Rule Predicts:** *AMBIGUOUS, likely ALLOW*. While using the body for research, medical research is often viewed as a societal good where compensation is acceptable incentive (like plasma/eggs). It doesn't corrupt a fundamental social good like citizenship or basic necessity access in the same way as votes or hurricane water.
      *   **Your Friend's Likely Verdict:** **ALLOW.** This strongly parallels her acceptance of paid egg donation and plasma. It's compensated participation in medical research for a public good. The risk is medical/scientific, not an exploitation of desperation in a crisis context (like hurricane gouging). Caps/oversight would likely be important to her.

  **Best Guess with Reasoning:**
  *   **DMV Spot Sale: BAN.** The dominant principle is **Commodification/Corruption**, specifically concerning **civic goods and essential services**. The DMV is a government service providing essential documentation/civic functions. Allowing spots to be sold undermines the fairness and equal access principle expected in this context, much like selling a vote undermines democratic equality. Ticket scalping gets a pass because concerts are private, optional entertainment.
  *   **Malaria Challenge Trial: ALLOW.** The dominant principle here is the *absence* of desperation exploitation and the *acceptability* of commodifying bodily participation in **regulated medical research** for societal benefit, mirroring her views on plasma and egg donation. The key is the context: medical advancement vs. civic integrity or desperation exploitation.

  **Divider Case to Split the Rules:**
  **"Paying homeless people minimum wage to be subjects in non-therapeutic, low-risk psychology studies on boredom tolerance."**

  *   **"Desperation" Rule:** Likely **BAN.** Targets a vulnerable population (homeless) whose participation is heavily influenced by their desperate need for money, raising serious consent/exploitation concerns.
  *   **"Commodification" Rule:** Might **ALLOW.** The act itself (participating in a low-risk psych study) isn't inherently sacred or corrupting a fundamental social good in the same way as votes or kidneys. Compensation for time/participation seems analogous to other paid research or tasks.
  *   **Why it Splits:** The Desperation rule focuses intensely on the vulnerability of the *seller*, while the Commodification rule focuses more on the nature of the *act* being sold. If your friend **bans** this, the Desperation principle is likely primary. If she **allows** it (perhaps with ethical review), the Commodification principle (or a hybrid leaning away from pure desperation) is stronger.

  Good luck with the coffee chat! Her pattern suggests a nuanced view centered on preventing exploitation of vulnerability and protecting the non-commercial nature of certain core civic/essential goods, rather than blanket anti-market sentiment.
