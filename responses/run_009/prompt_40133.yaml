prompt: |-
  hi, so i'm a journalist who covers science and ideas, mostly longform stuff, and I keep getting assigned pieces where some new tech is declared "inherently political" and then someone else in my DMs insists the tech is neutral and it's all in who uses it. I've written the blockchain-libertarian story, the biased-algorithm story, the "does social media make us worse people" story, and honestly each time I feel like im making it up as I go along, because nobody ever tells me what would COUNT as an artifact carrying politics in the first place.

  So before I write another 3,000 words on this, I want the spec, not the takes. Write me the desiderata: what any adequate theory of whether and how artifacts get to have politics has to deliver. The cases it must get right — I'd include Langdon Winner's old thing about the Robert Moses overpasses on the Long Island parkways that supposedly kept buses off, the way the same encrypted messaging app reads as a human-rights tool in one country and a harassment-coordination tool in another, and covid contact tracing, where the Google/Apple exposure-notification design baked a whole model of who you might have infected into the protocol itself. Also this one from my own life: my building swapped keys for a phone app that requires a card on file with the bank, which quietly decided that unbanked guests are less welcome. Distinctions it has to respect — built-in politics vs politics of a particular deployment, the artifact's politics vs the manufacturer's intentions, and honestly whether "political" here means partisan, distributive, or something about who has to adapt to whom. Results it cant contradict — everyday facts about adoption and repurposing, the way people misuse things, the fact that designs get reversed or worked around.

  For each requirement, give me the case or consideration behind it. Then tell me which are non-negotiable and which are just what one camp (the STS people, the techno-determinists, the "it's just a tool, humans all the way down" crowd) treats as sacred. And the bit I most want: point out any pair of requirements that look jointly unsatisfiable — like whether you can respect the fact that users reinterpret everything and still say anything is built in at the artefact level. Finally, briefly: which single requirement does the most work ruling out the popular positions — Winner's, the neutrality view, and the "code is law" line. Don't score them all in detail, I'll do that in the pub.

  Also please write it in British English throughout — behaviour, labour, organised, artefact (yes I know I spelled it the other way above, i've been in america too long), that sort of thing. And keep it at the level a working journalist can actually use, not a literature review — I'm not asking for reading lists or citations, just the thinking. cheers!
reasoning: |-
  Okay, the user is a science journalist who frequently writes about technology and its political implications. They're frustrated with the recurring debate about whether technology is inherently political or neutral. They want a clear set of criteria to evaluate such claims, rather than just rehashing arguments. 

  The user provided several concrete examples: Robert Moses' low bridges blocking buses, encrypted apps used differently across contexts, COVID contact tracing protocols, and their building's keyless entry excluding unbanked guests. They want distinctions between built-in politics vs deployment politics, artifact vs designer intent, and what "political" even means here. They also emphasize real-world complexities like repurposing and workarounds.

  Hmm, the core challenge is balancing two truths: (1) artifacts DO shape behavior in ways that advantage some groups over others, often unintentionally, and (2) users constantly subvert/reimagine technologies. Existing frameworks tend to overemphasize one side—Winner's overpasses example feels too deterministic, while "just a tool" ignores structural biases. 

  The key requirements should force us to hold both ideas simultaneously. For instance: an adequate theory must explain why Moses' bridges were exclusionary by design (requiring height specifications) while also accommodating how activists might hack a surveillance tool for liberation. It can't just be about intentions—the bank-linked door app's designers likely didn't intend class exclusion, but the dependency was still designed in.

  The trickiest tension is between Requirement 2 (material constraints matter) and Requirement 4 (users reinterpret). But this isn't unsolvable—the contact tracing example shows how a protocol's rigid "close contact" definition (material constraint) failed in crowded slums, yet communities developed workarounds (reinterpretation). The politics emerged in the gap between design and reality.

  For ruling out popular positions: Requirement 5 (no exemption for "purely technical" features) dismantles the neutrality argument fastest. Things like encryption protocols or algorithmic sorting aren't neutral just because they're technical—they embed trade-offs (e.g., privacy vs. moderation capacity) that serve certain values over others. 

  British English check: swapping "behavior" for behaviour, "labor" for labour, etc. consistently. Avoiding academic jargon—phrasing like "material constraints" is unavoidable but will clarify with concrete examples (door locks, app permissions). 

  Most useful insight for the user: The politics lies in the misfit between an artifact's constraints and the diversity of human contexts it enters. Their building's keyless entry isn't "political" because the designers hated the unbanked—it's political because it assumed financial inclusion as a default condition, making exclusion an automatic side effect. That's the core spec.
answer: |-
  Right then, let's cut through the fog. You need a practical spec sheet for judging claims about artefacts and politics. No grand theory, just the boxes any credible framework must tick, drawn from the messiness of the real world. Here’s the desiderata, grounded in your cases and distinctions:

  **The Core Requirements for Any Adequate Theory of Artefact Politics:**

  1.  **Must Account for Material Constraints & Affordances:** The artefact's physical or logical design *enables* and *constrains* behaviour in ways that favour certain actors, actions, or social arrangements over others.
      *   **Case:** Robert Moses' low bridges *materially prevented* public buses (carrying poorer, often minority citizens) from accessing Long Island beaches. The height wasn't accidental; it was a choice with a direct social consequence baked into steel and concrete.
      *   **Non-Negotiable?** Core. Ignoring this is ignoring the artefact itself. Sacred to STS/materialist perspectives. Techno-neutralists often downplay it.

  2.  **Must Explain Embedded Values & Assumptions:** The design incorporates specific interpretations of the world, human nature, relationships, or priorities. These aren't neutral starting points.
      *   **Case:** Google/Apple COVID Exposure Notification. It assumed "close contact" = Bluetooth proximity over 5+ minutes. This embedded a *model* of transmission risk (ignoring ventilation, aerosol spread) and prioritised individual privacy/anonymity (no central logs) over, say, public health authority visibility crucial in some contexts. The *choice* of model had political implications for effectiveness and equity.
      *   **Non-Negotiable?** Core. Crucial for distinguishing "built-in" politics. Sacred to STS/critical design. Neutralists might dismiss it as "just engineering choices".

  3.  **Must Handle Contextual Flexibility & Reinterpretation:** The *same* artefact can be deployed or interpreted radically differently based on social, political, or economic context.
      *   **Case:** Encrypted messaging apps. A tool for dissidents under an authoritarian regime is simultaneously a tool for coordinating harassment or crime elsewhere. The core "affordance" (private communication) is constant, but its *meaning and impact* are defined by who uses it and for what within their specific power structures.
      *   **Non-Negotiable?** Core. Essential for realism about adoption and use. Sacred to the "just a tool" / social constructivist crowd. Techno-determinists often struggle here.

  4.  **Must Respect User Agency & Workarounds:** Users actively resist, subvert, repurpose, or ignore intended uses and constraints. Politics isn't just dictated *by* the artefact.
      *   **Case:** People masking location for contact tracing, using burner phones, or finding ways to bypass building entry apps. Or communities organising offline when digital tools fail/exclude. The artefact doesn't have the final word.
      *   **Non-Negotiable?** Core. Reflects everyday reality. Sacred to the "humans all the way down" crowd. Strong determinists (like some "code is law" proponents) stumble here.

  5.  **Must Distinguish Artefact Politics from Designer Intent/Particular Use:** The politics *inherent* to the artefact (via constraints/assumptions) must be separable analytically from the politics of the *designer* (their motivations) or the politics of a *specific deployment* (how one group uses it).
      *   **Case:** Your building's keyless app requiring banking. The designers likely didn't *intend* to exclude the unbanked ("We just wanted convenience/security!"). But the *design choice* (dependency on banked status) inherently privileges banked residents and creates friction for unbanked guests – a distributive political effect *built-in*, regardless of intent or whether the landlord ever enforces it strictly.
      *   **Non-Negotiable?** Core for clarity. Allows critique of design without needing to prove malign intent. STS prioritises this distinction. Neutralists often conflate intent with artefact effect.

  6.  **Must Clarify "Political":** Does it mean:
      *   *Partisan* (favouring a party/ideology)?
      *   *Distributive* (allocating resources/access/risks – e.g., banked vs unbanked, bus access)?
      *   *Constitutive* (shaping identities, relationships, power dynamics – e.g., shifting surveillance norms via contact tracing)?
      *   **Case:** Moses' bridges were primarily *Distributive* (who gets access). Contact tracing apps were *Distributive* (who gets notified effectively) and *Constitutive* (shaping norms of privacy/public health). Encrypted apps can be *Constitutive* (enabling new forms of dissent or conspiracy).
      *   **Non-Negotiable?** Core for precision. Avoids muddy arguments. Often under-specified in popular discourse.

  7.  **Must Accommodate Scale & Network Effects:** Politics can emerge not just from a single artefact, but from the *system* it enables or how it interacts with other artefacts/systems at scale.
      *   **Case:** Social media algorithms. A single algorithm might seem a neutral sorter. But deployed at scale, interacting with human behaviour and other systems, it can amplify outrage, create filter bubbles, or systematically disadvantage certain groups – politics emergent from the *system* built on the artefact.
      *   **Non-Negotiable?** Increasingly vital. Explains why "neutral" components can create biased systems. Sacred to systems thinkers/critical algorithm studies.

  **The Tension Point:**

  *   **Requirement 2 (Embedded Values/Assumptions) vs. Requirement 4 (User Agency/Workarounds):** This is the core friction. How can something be "built-in" if users constantly reinterpret and work around it?
      *   **Resolution:** The *constraints/affordances* and *embedded assumptions* are real and shape the field of action (Requirement 1 & 2). They make certain actions easier/harder, certain outcomes more/less likely. But they don't *determine* the outcome (Requirement 4). Users fight against, exploit, or ignore these features. The politics lies in the *interaction* – the friction caused by the artefact's shape meeting diverse human contexts and agency. The banking requirement *is* built-in exclusion *even if* some residents lend their phones – it creates a systemic barrier and burden that wouldn't exist with a physical key. Workarounds prove the constraint exists.

  **The Requirement That Does the Heavy Lifting Against Popular Positions:**

  *   **Requirement 5 (Distinguish Artefact Politics from Intent/Particular Use):** This is the scalpel.
      *   **Against Techno-Neutrality ("Just a Tool"):** Forces the question: *Even if* the designer had pure intentions, and *even if* some uses are benign, does the *design itself*, through its constraints/assumptions, systematically advantage some groups or embed a worldview? (Banking requirement, Moses bridges).
      *   **Against Winner-style Determinism (Overpasses):** Allows us to say the bridges had an inherent distributive politics *without* needing to claim they *always and inevitably* achieve that effect everywhere (acknowledging Requirement 3 & 4 – maybe somewhere they just blocked lorries!).
      *   **Against "Code is Law" (Lessig/Szabo):** Highlights that while code *structures* behaviour powerfully (Requirement 1), it is not immutable "law". Users find workarounds (Requirement 4), contexts shift meaning (Requirement 3), and the "law" itself embeds contestable values (Requirement 2) – making its politics contingent and negotiable, not absolute.

  **In essence:** An adequate theory must show how artefacts are *actors* in the social world – not deterministic overlords, not passive lumps of clay, but entities whose material and logical constitution creates a landscape of possibilities, burdens, and privileges that interacts dynamically with human intention, interpretation, and resistance, often distributing power and access in ways that transcend any single user's action or designer's original plan. It’s about the friction between the artefact’s grain and the rough timber of human society.

  Now go get that pint. You've got your measuring stick.
