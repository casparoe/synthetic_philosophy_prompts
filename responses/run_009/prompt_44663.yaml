answer: |-
  Here are ten tightly-focused questions pressing key challenges to the Knowledge Norm of Assertion (KNA), designed to spark discussion beyond the basics and keep her on her toes. Each question is under 60 words, numbered, and includes your specific requests:

  1.  **Lottery vs. Gettier Asymmetry:** "Your ticket lost" (post-drawing, unclaimed) feels improper without knowledge, while many Gettiered assertions (e.g., stopped clock) seem fine despite lacking knowledge. KNA forbids both equally. What feature in your framework *explains* this intuitive asymmetry in propriety? (Follow-up likely target: Safety/Explanatory Connection)
  2.  **Follow-up to Lottery (Safety/Explanatory):** If you appeal to safety or explanatory connection to explain the lottery impropriety, doesn't that suggest *safety* or *explanatory justification* is doing the core normative work, potentially *replacing* knowledge as the fundamental norm? Is KNA then merely derivative?
  3.  **Moorean Assertions & Graded Weirdness:** "P but I don't believe p" sounds absurd. "P but I don't know p" sounds merely odd/inconsistent. KNA predicts both violate the norm equally. How does your framework capture this *graded* difference in felt impropriety without smuggling in a separate belief norm?
  4.  **Constitutive Norm & Community Practice:** Imagine a community happily asserts based on justified true belief, never appealing to knowledge. If KNA is constitutive like chess rules, are they playing a *different game* (not assertion), systematically *violating* the norm, or does this show constitutive norms *can* vary?
  5.  **Blameless Violation (Demon/Gettier):** If a speaker, deceived by a demon or Gettiered, asserts P falsely (lacking knowledge), KNA says it's improper. Yet we don't *blame* them - their evidence was impeccable. What practical role does a norm play if its violation can be wholly blameless and unavoidable for the speaker?
  6.  **Epistemic Authority:** In expert testimony, we often demand *more* than knowledge (e.g., understanding, justification). If KNA is sufficient, why this demand? Does KNA underestimate the norm governing assertions in contexts requiring epistemic authority?
  7.  **Retraction Obligation:** If I assert P based on knowledge I later lose, must I retract? KNA seems to say yes (the original act was proper, but its current standing is undermined). Does this create implausible retraction obligations for assertions later undermined by misleading defeaters?
  8.  **Practical Context Shifts:** In urgent, high-stakes contexts (e.g., "Is that bridge safe?"), we *demand* knowledge for assertion. In low-stakes chat ("It'll rain tomorrow"), mere justified belief often seems acceptable. Doesn't this variability challenge KNA as the *unique, invariant* norm of assertion?
  9.  **Knowledge vs. Actionability:** If assertion's core function is guiding action, why demand *knowledge* rather than simply justification sufficient for reasonable action in the context? Isn't actionability sometimes *less* demanding than knowledge (lottery ticket) and sometimes *more* (high-stakes bridge)?
  10. **Internalist Challenge:** If a speaker has overwhelming internal justification but is unknowingly in a skeptical scenario (BIV), asserting P seems reasonable *from their perspective*, even if KNA deems it improper. Doesn't this clash with the intuition that assertion norms should be reasonably followable by the asserter?

  **Why these work:**

  *   **Presses Literature Pain Points:** Targets well-known, persistent objections (Lottery/Gettier asymmetry, Moorean paradoxes, constitutive worries, blameless violation, contextualism, retraction).
  *   **Forces Nuance:** Questions 3 (graded weirdness), 6 (authority), 7 (retraction), and 9 (actionability) push beyond simple "knowledge yes/no" to specific implications and comparisons.
  *   **Predicts & Counters:** Question 2 anticipates the standard KNA reply to lottery cases and challenges its implications directly.
  *   **Requires On-Feet Thinking:** Questions 4 (community practice), 5 (blamelessness), 8 (context), and 10 (internalism) don't have universally agreed-upon KNA answers and require situating the norm within broader epistemological/deontic considerations.
  *   **No Filler, Precise:** All questions are direct, jargon-appropriate for grads, and under 60 words.
  *   **Follows Your Specs:** Includes your 4 specific requests (numbered 1-4 & 5 above) and adds 6 more robust challenges.

  **Delivery Tip:** Phrase them conversationally! Instead of just reading Q4 verbatim, lead-in: "Let's talk about the constitutive claim. Imagine a community where..." Good luck with the interview!
