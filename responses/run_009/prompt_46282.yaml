answer: |-
  Your hypothesis is perceptive and largely correct, but misses one crucial layer. The impasse *is* fundamentally about explanatory standards, *and* it's about the metaphysical weight given to parsimony, *but* it also rests on a deeper divergence about the nature of modality and the demand for a certain kind of "grounding." Here's the diagnosis:

  1.  **The Explanation Standard Divide:** You're exactly right. The anti-Humean *demands* that a law *explains the regularity* by being its *ontological ground* or *ontological cause*. For them, explanation requires identifying the *why* of the pattern in terms of something ontologically prior or more fundamental that *makes* the pattern hold. The mosaic itself, being just the pattern, cannot explain *why* the pattern exists or persists. Lewis's "Best System" (BSA) systematizes the pattern, but (to the anti-Humean) it doesn't *ground* it; it merely describes it elegantly. The anti-Humean sees the Humean as confusing *description* (even exceptionally good description) with *explanation* in the robust, grounding sense. Conversely, the Humean sees systematization *as* the pinnacle of scientific explanation. Unifying diverse phenomena under simple, powerful principles *is* explaining them. Adding a mysterious "governing" relation or "necessitation" is ontologically profligate and doesn't add any *explanatory* value beyond the systematization itself. They see the anti-Humean as demanding a spooky, unnecessary metaphysical layer.

  2.  **The Parsimony/Truth-Tracking Divide:** This is also crucial. The Humean treats ontological parsimony (avoiding commitment to fundamental governing entities/relations beyond the mosaic) as a *primary virtue* for a true theory of the world. Simplicity, in the BSA sense, is directly linked to truth-conduciveness. The anti-Humean, however, sees the Humean's parsimony as *false economy*. They argue that the demand for a ground/explanation for the regularity *trumps* parsimony. Denying the governing relation leaves the regularity metaphysically "dangling" or brute, which they see as a greater cost than adding a fundamental modal entity. For them, parsimony is secondary to the need for a complete ontological grounding of the phenomena (the regularity).

  3.  **The Modal Grounding Demand:** This is the layer your hypothesis underemphasizes. The core anti-Humean intuition is that *regularities require grounding in modality*. The fact that events *must* happen a certain way, not just *do* happen that way consistently, needs an ontological basis. This is why Armstrong needs "necessitation" relations, Maudlin needs primitive "pushers," etc. They see the Humean mosaic as capturing only the *actual* (what *is* the case), leaving the *modal* (what *must* or *can* be the case) ungrounded and inexplicable. The Humean counters that modality itself supervenes on the mosaic – "must" just *means* that it holds throughout the actual pattern described by the best system. For the Humean, there's no deeper modal fact to ground; the pattern *is* the modal fact. The anti-Humean finds this reduction of modality to actuality deeply unsatisfying and incomplete.

  **The Nature of the Disagreement:** This is a **substantive metaphysical disagreement**. It's not merely verbal (both sides understand the terms, they just disagree on what satisfies them). It's not *just* different questions (though aspects of it are, see below). It's a deep clash about:
      *   **The nature of explanation:** Grounding-production vs. systematization-unification.
      *   **The status of modality:** Is fundamental modality irreducible, or does it supervene on the actual?
      *   **The weight of theoretical virtues:** How heavily should ontological parsimony weigh against the perceived demand for modal grounding/explanation?
      *   **The scope of the "mosaic":** What counts as "local matters of particular fact"? (This touches on the physics concerns – e.g., quantum entanglement or non-separability *prima facie* challenges the Humean's localist mosaic).

  **Where Your Hypothesis is Right/Wrong/Too Tidy:**
  *   **Right:** The explanatory standards clash is absolutely central and often unstated, driving the feeling of talking past each other. The parsimony clash is also key.
  *   **Too Tidy / Incomplete:** It underplays the **modal grounding demand** as the *source* of the anti-Humean's explanatory requirement. The demand for a "producer/constrainer" stems from the belief that the regularity's *necessity* needs an ontological anchor. It also doesn't fully capture the *strength* of the Humean's conviction that modality *just is* a feature of the best description of the actual.

  **What Would Count as Real Progress:**
  1.  **Clarifying Explanation Standards Rigorously:** A formal framework analyzing different types of explanation (grounding, unification, causal-mechanical, etc.) and demonstrating precisely where and why they satisfy or fail to satisfy the intuitions of each camp. Showing *why* systematization feels like "mere description" to one side and "true explanation" to the other, or *why* grounding feels "mysterious" or "essential." Progress requires making these implicit standards explicit and critically evaluating their assumptions (e.g., is grounding always non-circular?).
  2.  **Formal Results on Supervenience, Modality, and Explanation:** Results showing the limitations or possibilities within different frameworks. For example:
      *   Can a Humean framework *formally* avoid circularity in explaining its own mosaic's regularities using the BSA? Or is the charge of circularity misplaced within their framework?
      *   Can a compelling formal account be given showing how (or if) supervenient laws can genuinely explain their subvenient base without vicious circularity?
      *   Formal analyses exploring whether anti-Humean governing relations can be specified without being vacuous or collapsing into patterns.
  3.  **Decisive Physics Findings (Less Likely Directly Decisive):** While physics (like QM non-locality or quantum gravity) can challenge the *feasibility* of the Humean mosaic (requiring them to stretch "local particular fact"), it's unlikely to *directly* settle the metaphysical debate. Even a "governing equation" in physics could be interpreted Humeanly (as the core axiom of the BSA) or anti-Humeanly (as representing a fundamental constraint). Physics constrains metaphysics but rarely dictates a single metaphysical interpretation.

  **The Bedrock Intuition:** Yes, there is a significant element of bedrock intuition here. The anti-Humean has a powerful intuition that *regularities cry out for explanation in terms of something that makes them necessary*. The Humean has an equally powerful intuition that *the world just is a vast arrangement of local qualities, and anything else is superfluous*. Arguments often appeal to these intuitions rather than decisively overturning them. The disagreement over the nature of modality (reducible vs. fundamental) is particularly resistant.

