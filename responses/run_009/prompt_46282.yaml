  For my diagnosis, I'll argue this is primarily a substantive metaphysical disagreement, not just verbal or different questions. The crux is whether explanation requires grounding in productive constraints or just systematization. Progress might come from clarifying explanation standards, formal results, or physics findings, but I'm skeptical about decisive resolution given the bedrock intuitions involved.

