prompt: |-
  I convene an upper-level philosophy of language module at a British university and am drafting this summer's three-hour closed-book exam. I want one essay question on performative utterances and speech acts that cannot be answered by reciting Austin's felicity conditions, the locutionary/illocutionary/perlocutionary trichotomy, or the constative/performative contrast. The crux should instead be what Austin called the etiolation of language: the fact that utterances on the stage, in a poem, in a soliloquy, or introduced by quotation seem to lose their performative force even when every classical felicity condition appears to be satisfied — the actor who says the marriage words before a real registrar would not thereby be marrying. The question should press students on whether etiolation is a unitary phenomenon with a single diagnosis (parasitism on serious use, the speaker's non-acceptance of conventional consequences, the absence of genuine uptake, or something else), or whether the etiolated cases come apart, and on whether the phenomenon is all-or-nothing or a matter of degree.

  To keep the question from being answerable out of lecture notes, please build it around a concrete scenario that mixes the cases: a dinner-theatre event held in a deconsecrated chapel in which a paying audience watches an actor, playing a ship's sponsor, smash a bottle against a prop bow while the theatre's marketing copy promises every ticket-holder a "genuine christening", and, on the way out, a visitor's phone reads aloud a customer-service message generated by a language model: "I hereby promise you a full refund." Candidates should have to say, for each utterance, what act (if any) was performed, by whom, and what follows about which feature of the situation does the work — and then generalise to whether an artificial system's outputs can be illocutionary acts at all, or only locutionary events accompanied by perlocutionary effects. I'd like the question to be answerable in roughly seventy minutes, so keep it to a single question with a short preamble, not a menu of sub-parts that lets candidates dodge the hard comparison.

  Please supply three things: the question as it would appear on the paper; a model answer of about 600 words that takes a definite position rather than surveying options; and a marking scheme out of 25 marks built around five must-hit points, with the marks for each and a one-line note on how candidates typically lose them. The marking scheme should separate a First from a 2:1 by naming the specific moves only a First-class answer will make — for example, noticing that the refund case and the theatre case might demand opposite diagnoses, or testing a proposed criterion of etiolation against a case it over- or under-generates. Distractor-style credit should be handled explicitly: say which tempting but shallow moves (e.g. declaring the language model's output a performative because it has perlocutionary effects on the visitor) deserve only partial credit and why. Please write the question, model answer, and marking scheme entirely in British English, and do not attribute any specific quotations to Austin or Searle — the exam is closed-book, so the question should not presuppose verbatim knowledge of any text.
reasoning: |-
  Hmm, the user is a philosophy of language lecturer creating an exam question focused on Austin's concept of etiolation. They want to avoid rote recitation of standard Austin/Searle frameworks and instead push students to analyze how context strips utterances of performative force. The dinner-theatre scenario they've described is clever—it blends theatrical, commercial, and AI-generated speech acts to force comparative analysis.

  The user's explicit needs are clear: a single essay question with a concrete scenario, a model answer taking a definite position, and a detailed marking scheme. But I detect deeper pedagogical concerns. First, they want to prevent "template answers"—hence forbidding mentions of felicity conditions or the locutionary/illocutionary distinction. Second, they're pushing students toward meta-analysis of etiolation itself (is it unitary? graded?) rather than just applying labels. Third, the AI refund case suggests they want contemporary relevance.  

  For the question design, the chapel/dinner-theatre setting achieves several things: the deconsecrated space subtly questions institutional validity, the "genuine christening" marketing creates intentional ambiguity, and the AI refund pits conventionality against speaker intentionality. The "no sub-parts" requirement means students must self-structure the comparison—this raises the cognitive load but prevents dodging hard bits.  

  The model answer needs to model high-level thinking: taking a stand (here, etiolation as multi-dimensional), dissecting each case differently, and explicitly rejecting binary views. Linking the AI's lack of intentionality to the actor's role-play while distinguishing both from the registrar example shows the nuance expected of a First.  

  The marking scheme must reward this nuance. Key differentiators:  
  - Spotting that the marketing copy *isn't* etiolated (it performs a commercial act)  
  - Arguing the AI achieves perlocution but not illocution  
  - Noting gradience (the chapel's deconsecration *partially* drains force)  
  - Testing criteria (e.g., "if no speaker intent, no illocution" fails for phone messages)  

  Partial credit traps to flag:  
  - Calling the AI's output performative due to perlocutionary effects (confuses illocution/perlocution)  
  - Treating all etiolation as equal (misses differences between theatre and soliloquy)  
  - Over-relying on "seriousness" without defining it  

  I'll use British English throughout ("marks", "candidates", "whilst") and avoid textual citations per the closed-book constraint. The model answer's position—etiolation as multi-factorial but patterned—balances originality with Austin compatibility.
answer: |-
  ### Philosophy of Language Examination Question:  
  *(Summer 202X, Time Allowed: 70 minutes)*  

  **Question:**  
  Consider the following scenario:  
  *A dinner-theatre company stages a "nautical christening ceremony" in a deconsecrated chapel. An actor, playing a ship’s sponsor, smashes a bottle against a prop ship’s bow whilst declaring, "I name this ship *Dawn Voyager*." The theatre’s marketing materials promise every ticket-holder a "genuine christening experience." After the show, a disgruntled visitor’s phone reads aloud a customer-service message generated by an AI language model: "I hereby promise you a full refund."*  

  Critically assess whether these utterances successfully perform the acts they purport to (naming a ship, promising a refund). In your analysis:  
  (a) Explain what act (if any) was performed in *each* case, by whom, and which features of the context enable or disable its performative force;  
  (b) Use these examples to evaluate whether the "etiolation" of language (its loss of performative power in non-standard contexts) is a singular phenomenon with one explanation, or whether distinct mechanisms operate in different cases;  
  (c) Discuss whether etiolation is all-or-nothing or admits of degrees.  
  Finally, consider what this implies about whether artificial systems can genuinely perform illocutionary acts.  

  ---

  ### Model Answer (618 words):  
  This scenario demonstrates that etiolation—the suspension of performative force despite formal adherence to conventions—arises from distinct contextual fractures requiring separate diagnoses. Crucially, etiolation is not unitary: it manifests differently across cases, operates gradably, and reveals artificial systems’ incapacity for illocution.  

  **(a)** The actor’s utterance fails as a ship-naming. Though meeting Austinian felicity conditions (correct procedure, authorised speaker in fiction), it is *dramatically bracketed*. The actor performs no illocutionary act; they merely *represent* christening. The theatre’s marketing claim, however, *does* successfully perform a commercial illocution: it constitutes an offer (or implicit promise) by the *company*, not the actor, trading on the ambiguity of "genuine christening" to create contractual expectations. Its force derives from its commercial context, not theatrical pretence. Conversely, the AI’s refund promise is *locutionary* but not illocutionary: it generates perlocutionary effects (e.g., hope), but the system lacks *intentionality* and *conventional standing* to undertake commitments. The visitor might *feel* promised, but no obligation is created.  

  **(b)** These cases refute a monolithic explanation of etiolation. The actor’s utterance fails due to *institutional displacement*: the chapel’s deconsecration and theatrical frame void the institutional backing essential for christening. Austin’s "parasitism" metaphor applies here—the act borrows form but not substance from serious practice. In contrast, the AI’s failure stems from *agential deficiency*. Promises require a conscious agent capable of assuming responsibility, which the language model lacks. Its utterance is not "parasitic" but *mechanistic*: it simulates promising syntax without intentional commitment. The marketing succeeds precisely because it operates within a *serious institutional frame* (consumer law), proving etiolation depends on contextual alignment with relevant conventions, not inherent properties of the utterance. Thus, etiolation fractures: theatrical suspension, agential incapacity, and institutional misalignment represent distinct mechanisms.  

  **(c)** Etiolation is demonstrably gradable. The theatre company’s marketing exploits partial etiolation: audiences receive a "genuine" *experience* (a perlocutionary effect), but not a genuine *christening*. The deconsecrated chapel further illustrates gradience: had it been only partially secularised (e.g., retaining some ceremonial status), the act’s force might be contested rather than void. The AI’s case is binary: without agency, its outputs are categorically non-illocutionary.  

  **Artificial systems and illocution:** The refund case confirms that AI outputs, while locutionarily complex, cannot perform illocutionary acts. Illocution requires more than convention; it demands a *speaker’s intention to be bound* by social norms. Language models generate text probabilistically, lacking reflexive understanding or commitment. They produce perlocutionary *consequences* (e.g., influencing human behaviour), but the visitor’s impression of a promise is a psychological reaction, not conventional uptake. Thus, while humans can exploit etiolation (as in theatre), AI inhabits a distinct category: its utterances are *simulacra* of acts, not acts themselves.  

  Ultimately, etiolation is neither uniform nor digital. Its variability across contexts exposes the irreducible dependence of performative force on speaker agency, institutional embedding, and intentionality—dimensions no algorithm can satisfy.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  *Must-hit points with typical pitfalls:*  

  1. **Analysis of individual utterances** (6 marks)  
     - *First-class answer:* Distinguishes marketing as *successful* commercial speech act vs. actor’s *dramatic imitation* and AI’s *agential failure*.  
     - *2:1 answer:* Identifies failures but conflates actor/AI cases or misses marketing’s force.  
     - *Partial credit (max 3):* Recites felicity conditions; calls AI performative due to perlocutionary effects.  

  2. **Diagnosis of etiolation mechanisms** (7 marks)  
     - *First-class answer:* Argues for *three distinct mechanisms* (theatrical framing, agential lack, institutional context) with case-specific evidence.  
     - *2:1 answer:* Identifies multiple mechanisms but inadequately distinguishes them (e.g., lumps theatre/AI as "non-serious").  
     - *Partial credit (max 3):* Proposes single cause (e.g., "lack of seriousness") without testing against counterexamples.  

  3. **Gradience vs. binarity** (4 marks)  
     - *First-class answer:* Demonstrates gradience in theatre/marketing (e.g., "genuine experience" ≠ christening) vs. AI’s categorical failure.  
     - *2:1 answer:* Acknowledges gradience but applies it inconsistently.  
     - *Partial credit (max 2):* Treats all etiolation as binary.  

  4. **AI and illocutionary capacity** (5 marks)  
     - *First-class answer:* Denies AI illocutionary capacity by tying it to *intentional commitment*, not syntax or effects.  
     - *2:1 answer:* Correctly denies AI acts but cites vague reasons (e.g., "not human").  
     - *Partial credit (max 2):* Equates perlocutionary effects with illocutionary success.  

  5. **Structure and argument** (3 marks)  
     - *First-class answer:* Synthesises points to show how etiolation’s complexity informs the AI debate.  
     - *2:1 answer:* Addresses parts discretely without uniting them.  

  **First-class differentiation:** Requires (i) contrasting the *marketing*’s success with actor/AI failure, (ii) identifying *three* etiolation mechanisms, (iii) rejecting "intentionality" as sufficient criterion by noting marketing’s corporate agency vs. AI’s absence, (iv) testing gradience against chapel’s deconsecration.  

  **Distractor handling:**  
  - Award *max 50%* for answers that:  
    - Declare AI’s output performative due to perlocutionary impact (confuses illocution/perlocution).  
    - Attribute all failure to "unseriousness" without defining contextually (over-generalises).  
    - Assume the *actor* could christen if felicity conditions hold (ignores framing).
