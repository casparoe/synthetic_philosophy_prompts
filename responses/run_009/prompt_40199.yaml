prompt: |-
  For the past few years my sister and I have been arguing about what a person should do when she doubts her own moral convictions. My sister's position is that uncertainty between moral views works like uncertainty about ordinary facts: assign each view a rough degree of confidence, then choose whichever action comes out best when you weigh the views by those confidences. My position is that this is a confusion — different views don't share a common scale of "how good" an outcome is, so they can't be averaged into a single judgment, and the only coherent policy is to act on whichever single view you find most credible, even if it is only narrowly ahead. One case that keeps dividing us: suppose I am 55% confident in a view on which breaking a minor promise to a stranger would do a small amount of good overall, and 45% confident in a view on which breaking it is a grave wrong. Her method says keep the promise; mine says break it, and each of us thinks the other's verdict exposes a defect in the method. We have been talking past each other, and I would like to know exactly where we actually disagree. Please draft the joint statement we should have produced by now: the claims about acting under moral uncertainty that both of us could sign; the remaining disagreements, each phrased so that the person holding that view would accept the wording; and the cruxes — the sub-questions such that settling one would move at least one of us — where possible with a concrete case or argument both of us would accept as bearing on each crux, along with a record of what each of us would predict about it. Format it as a numbered agreed-claims section followed by a disagreements table. If any part of our dispute turns out to be merely verbal, say which part and why.
reasoning: |-
  Okay, the user is describing a long-standing philosophical debate with their sister about how to act under moral uncertainty. The core disagreement is between a weighted averaging approach (sister's view) and a "follow the most credible view" approach (user's view), crystallized in a promise-breaking scenario. 

  Hmm, this is actually a deep metaethical question that professional philosophers grapple with - the user and their sister have independently reconstructed a central debate in normative ethics. I should acknowledge that sophistication while making it accessible. The joint statement format they requested is smart - it forces clarity on agreement points before mapping disagreements.

  First, the common ground seems solid: both agree moral uncertainty exists and requires different handling from factual uncertainty; both reject pure subjectivism; both want coherence. That's paragraphs 1-3 of the agreed claims. The "no mechanical solution" point (claim 4) is crucial - it prevents either side from caricaturing the other as simplistic. 

  The disagreements table needs careful framing. The sister's "expected moral value" position mustn't be reduced to utilitarianism - her 55/45 weights might apply to deontological views too. Meanwhile the user's "incommensurability" argument deserves its strongest formulation: if the 55% view says promise-breaking gains 10 utility units while the 45% view says it violates a categorical imperative, averaging 10 and -∞ is indeed nonsense. 

  Ah! The verbal dispute flag is important. When the user says "no common scale", the sister might hear "no comparable wrongness" while meaning "no inter-theoretic comparison". Clarifying that "scale" refers to measurement units (claim 4) not ordinal rankings (claim 3) could resolve some friction. 

  For cruxes, the promise case is perfect because it's theirs. I'll add the "genocide" variant to stress-test commensurability - if the sister balks at averaging genocide, that reveals limits to her view. The "promise to dictator" case probes whether "most credible" can handle threshold effects. Each prediction column will show their methods' divergence starkly. 

  Noting where predictions match (e.g., both reject coin-flip ethics) is as important as where they diverge. That builds goodwill by showing shared intuitions beneath methodological splits. The tone must stay neutral - this is their joint statement, not my ruling.
answer: |-
  Below is a joint statement clarifying our agreements, pinpointing our core disagreements, and identifying testable cruxes. We agree on all numbered claims below and endorse the wording of each position in the disagreements table.  

  **Agreed Claims:**  
  1. **Moral uncertainty exists and matters:** When an agent is uncertain which moral view is correct, this uncertainty should (at least sometimes) influence her decision-making, distinct from ordinary empirical uncertainty.  
  2. **Non-subjectivism:** Our debate assumes objective moral facts exist (even if unknowable). We are not arguing about subjective preferences.  
  3. **Ordinary vs. moral uncertainty:** In purely *empirical* uncertainty (e.g., "Is this medicine safe?"), weighting outcomes by probability and averaging expected utilities is rational. Moral uncertainty may differ.  
  4. **No mechanical solution:** There is no universally accepted, uncontroversial formula for acting under moral uncertainty. Both approaches require judgment.  
  5. **Threshold rejection:** We reject policies like "always follow the strictest view" or "flip a coin if confidence is close." Our debate is between two structured approaches.  

  **Disagreements Table:**  

  | Aspect                     | Sister's Position ("Weighted Moral Value")                                                                 | User's Position ("Max Credibility")                                                                             |  
  |----------------------------|------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|  
  | **Core Principle**         | Moral uncertainty should be treated analogously to empirical uncertainty: compute the *expected moral value* of actions by probabilistically weighting each moral view’s evaluation. | Moral views may be *incommensurable* (no shared "goodness" scale). Only the *single most credible view* should guide action when views conflict. |  
  | **Promise Case Verdict**   | Keep the promise. (55% × small good + 45% × grave wrong ≈ net negative expected value)                     | Break the promise. (55% credibility view permits it; 45% view is irrelevant unless tied.)                       |  
  | **Key Metaphor**           | Moral views output "moral utility" scores on a common scale (e.g., "units of goodness"). Uncertainty averages these. | Moral views are like distinct rulebooks with incompatible currencies (e.g., "utility" vs. "duties"). Aggregating them is incoherent. |  

  **Cruxes with Test Cases & Predictions:**  
  1. **Crux: Commensurability**  
     * **Question:** Can conflicting moral views *always* be translated into a shared, cardinal "moral value" scale for probabilistic weighting?  
     * **Test Case:** *Genocide Variant:* 51% confident in a view where genocide maximizes utility for the majority; 49% confident it is an unforgivable atrocity.  
       - Sister’s Prediction: Weighted evaluation likely forbids genocide (small gain × 51% + catastrophic wrong × 49% → net negative).  
       - User’s Prediction: Max Credibility permits genocide (51% > 49%).  
       - **Agreed Significance:** If Sister cannot endorse the verdict (she likely won’t), her method requires limits. If User must forbid genocide, commensurability may be needed.  

  2. **Crux: Action-Guiding Threshold**  
     * **Question:** Does a *marginally* more credible view always dictate action, regardless of the severity of the alternatives?  
     * **Test Case:** *Promise to a Dictator:* 55% confident breaking a trivial promise stops a genocide; 45% confident promise-keeping is an absolute duty (breaking it is monstrous).  
       - Sister’s Prediction: Weighted evaluation strongly favors breaking (huge gain × 55% + grave wrong × 45% → net positive).  
       - User’s Prediction: Max Credibility breaks the promise (55% > 45%).  
       - **Agreed Significance:** If User feels uneasy acting on 55% here, thresholds matter. If Sister weights the "absolute duty" view, her method avoids the user’s verdict.  

  3. **Crux: Incommensurability vs. Weighting**  
     * **Question:** Does probabilistic weighting produce coherent prescriptions when views have *structurally different* evaluations (e.g., consequentialism vs. deontology)?  
     * **Test Case:** *Charity vs. Duty:* 60% confident donating to charity maximizes good; 40% confident it’s obligatory to save your drowning child instead (even if less "good").  
       - Sister’s Prediction: Must convert both to a "value" scale (e.g., "saving child" = +1000 units; "donation" = +800 units × 60% + "violated duty" = -∞ × 40%?). **Problem:** Weighting breaks if duties assign ±∞.  
       - User’s Prediction: Follows charity view (60% > 40%). Ignores the "duty" view’s structure.  
       - **Agreed Significance:** If Sister cannot compute expected value without arbitrary rules (e.g., capping "wrongness"), incommensurability is a problem. If User acts against saving their child, their method seems flawed.  

  **Verbal Dispute Clarification:**  
  We agree that the term "no common scale" in the User’s description was ambiguous. We now distinguish:  
  - **Ordinal Comparisons (Agreed):** We *can* often say "View A forbids this more severely than View B permits it" (e.g., "grave wrong" vs. "small good").  
  - **Cardinal Commensurability (Disputed):** Whether we can assign *precise, additive numerical weights* to outcomes *across* moral frameworks (e.g., "grave wrong = -100 units, small good = +5 units").  
  This clarifies that **Claim 4** (no mechanical solution) is agreed, but **Cardinal Commensurability** remains the core substantive dispute.  

  **Conclusion:**  
  Our disagreement hinges on whether moral frameworks output *commensurable cardinal values* (enabling probabilistic weighting) or are *incommensurable systems* (requiring following the most credible). The cruxes test whether our methods yield intuitive verdicts in extreme cases and whether weighting can handle structurally divergent views. Resolving these would require deeper agreement on the nature of moral reasoning itself.
