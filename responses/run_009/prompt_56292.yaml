  First, I need to parse her past rulings. Phlogiston and caloric were outright refuted—no surviving insights. Fresnel's equations carried over, so structure mattered. Lorentz and Einstein were the same theory with different interpretations. The user is puzzled by her dismissal of caloric despite Carnot's contributions. Maybe she values theoretical entities over practical success? Or perhaps she distinguishes between mathematical structure and ontological commitments.

  For Newton vs Einstein, several possibilities: refutation (like phlogiston), truncation (like Fresnel), or redundancy (like Lorentz). Given that Newtonian gravity is a limit of GR, and the math reduces to inverse-square in weak fields, truncation seems plausible. But Lorentz's theory was mathematically equivalent to special relativity, just with extra baggage (ether). Newton has a geometric reformulation that fits into GR as a limit, similar to how Lorentz fits into SR. So maybe she'll say truncation or even redundancy? 

  The key might be empirical equivalence and ontological economy. Lorentz's ether didn't add predictive power, so it was redundant. But Newton's gravity differs empirically from GR (e.g., Mercury's orbit). So she might see it as truncated—Newton's equations work approximately but the force concept is replaced by spacetime curvature. The geometric reformulation might make her lean towards the costume analogy, but empirical differences could prevent that. 

  The user also wants a theory pair to test her rule. If it's about mathematical continuity, then something like Bohr's model vs quantum mechanics might work—Bohr's model has some correct equations but wrong foundations. If it's about reference, maybe vitalism vs biochemistry—vital force vs molecular mechanisms. 

  Her dismissal of caloric is tricky. Carnot used it correctly but she still rejected it. Maybe she thinks the entity (caloric fluid) was refuted, even if the math worked. So ontological commitment matters more than predictive success. That could mean for Newton, gravitational force as an entity is discarded, but the math survives. 

  Putting it together: Newton vs Einstein will likely be truncated (like Fresnel) because the math carries over in limits, but the ontology changes. The geometric reformulation might make it feel like Lorentz, but empirical differences matter. Caloric dismissal shows she cares about the existence of theoretical entities. 

  A clean test case could be Dalton's atomic theory vs modern quantum atoms. Dalton's atoms were indivisible, which was refuted, but the idea of atoms referring to something real survived. This tests continuity of reference vs mathematical structure. 

  Least confident claim is whether she'll see Newton as truncated or redundant. The geometric view might sway her, but the empirical discrepancies might make truncation more likely. Need to highlight that uncertainty.
