  Based on your friend's track record and reasoning style, here's a breakdown of her likely verdict on Newton vs. Einstein, the implicit rules she might be using, how they diverge, and how to test them further. Her focus consistently centers on **ontological commitment and mathematical structure**, with empirical equivalence acting as a secondary factor.

  **Prediction for Newtonian Gravitation vs. General Relativity:**
  *   **Verdict:** **Truncation** (like Fresnel, not refutation or costume).
  *   **Reasoning:**
      *   **Ontology Refuted:** Newton's "gravitational force" acting instantaneously across space is analogous to Fresnel's ether or phlogiston – Einstein showed *no such force exists*. Gravity is geometrized spacetime curvature.
      *   **Structure Preserved:** Crucially, Newton's inverse-square law (and his laws of motion) emerge *precisely* as the weak-field, low-velocity limit of GR. This mathematical structure is robustly preserved, just as Fresnel's equations were preserved within Maxwell's framework. Newton captured the dominant *structure* of the phenomenon under most conditions, even if his underlying *mechanism* was fundamentally wrong.
      *   **Not Costume:** Unlike Lorentz/Einstein, Newton and Einstein are *not empirically equivalent*. GR makes distinct predictions (e.g., Mercury's perihelion, light bending, gravitational waves, time dilation in gravity) that Newton cannot explain. Lorentz's theory *was* empirically equivalent to SR *before* Einstein. The geometric reformulation of Newton (Newton-Cartan) sits *within* GR as a limit, but GR itself adds fundamentally new structure and predictions beyond that limit. The "costume" analogy requires strict empirical equivalence and identical mathematical core, which isn't the case here.
      *   **Not Refutation:** Unlike phlogiston or caloric, Newton's mathematical core *survives and functions* within the successor theory under well-defined limits. His theory wasn't *nothing*; it captured a significant structural aspect of reality.
  *   **Confidence: 85%.** This aligns best with her Fresnel precedent (wrong mechanism, preserved structure) and avoids the pitfalls of the other categories. Her dismissal of caloric despite Carnot reinforces that empirical/predictive success *within* a framework doesn't save a refuted ontology.

  **Rival Rules & Their Predictions:**

  1.  **Rule: Preservation of Core Mathematical Structure (Ontology Secondary)**
      *   *Core Idea:* The successor theory must preserve the core equations/formal structure of the predecessor under relevant conditions/limits. Ontological change is less crucial.
      *   *Predicts for Newton/Einstein:* **Truncation.** Newton's inverse-square law is the weak-field limit of GR's field equations.
      *   *Closest Analog:* **Fresnel/Maxwell.** Fresnel's equations are a limiting case of Maxwell's.
      *   *Fits Verdicts:* Fresnel (✓), Lorentz/Einstein (✓ - same math), Newton/Einstein (✓). *Struggles with:* Phlogiston/Caloric? (No significant math preserved? But Carnot's math *was* powerful...)

  2.  **Rule: Continuity of Reference / Ontological Survival**
      *   *Core Idea:* Did the key theoretical entities or properties of the old theory *refer* to something real, even if misdescribed? Refutation = reference failure (phlogiston wasn't *anything*).
      *   *Predicts for Newton/Einstein:* **Refutation (or strong truncation).** Newton's "gravitational force" does not exist. Mass doesn't *cause* a force; it curves spacetime. "Gravity" as a force is like phlogiston.
      *   *Closest Analog:* **Lavoisier/Stahl (Phlogiston).** Phlogiston = nothing; Gravitational Force = nothing.
      *   *Fits Verdicts:* Phlogiston (✓), Caloric (✓), Ptolemy (✓ - celestial spheres/epicycles don't exist). *Struggles with:* Fresnel (She credits "structure of light" but ether reference fails), Lorentz (Ether reference fails, yet she calls it "same theory").

  3.  **Rule: Lossless Preservation of Confirmed Empirical Content**
      *   *Core Idea:* Does the new theory explain *everything* the old theory explained correctly, without loss? Refutation implies the old theory got significant confirmed results *wrong*.
      *   *Predicts for Newton/Einstein:* **Truncation or Refutation (Ambiguous).** GR explains Newton's successes *and* corrects failures (Mercury). But does "confirmed content" include *only* what was verified under Newton, or *also* the domain where Newton was assumed correct but unverified (e.g., strong fields)? This rule is fuzzy.
      *   *Closest Analog:* **Fresnel/Maxwell (✓ - preserves all optical phenomena)** vs. **Ptolemy/Copernicus (✓ - epicycles explained retrograde motion correctly)**. *Struggles with:* Lorentz/Einstein (No loss, yet she sees it as distinct from pure refutation), Caloric (Carnot's results *were* correct, yet she refutes).

  4.  **Rule: Empirical Equivalence + Ontological Parsimony**
      *   *Core Idea:* If two theories make identical predictions (empirically equivalent), the one with fewer unnecessary ontological commitments (like the ether) is preferable, rendering the other "redundant" but not refuted. Lack of equivalence implies potential refutation or truncation.
      *   *Predicts for Newton/Einstein:* **Truncation or Refutation (Not Redundant).** Not empirically equivalent (GR makes distinct predictions). The geometric core survives as a limit.
      *   *Closest Analog:* **Lorentz/Einstein (✓ - equivalent, ether redundant).** *Fits Verdicts:* Fresnel (✗ - not equivalent, ether refuted), Caloric (✗ - Carnot worked, but fluid refuted). *Struggles with:* Her nuanced Fresnel verdict – equivalence isn't the key factor.

  **Resolving the Rules & The Caloric Puzzle:**
  Your friend's rulings resist a single, pure rule. Her stance on **caloric is the key**: Carnot derived profound truths *using* caloric, but she dismisses it entirely. This shows:
  1.  **Ontology is paramount:** If the core entity (caloric fluid, phlogiston) is deemed non-existent, the theory is *refuted*, regardless of successful mathematical/predictive work *within* that framework. Carnot didn't save caloric; he derived correct results *despite* it.
  2.  **Structure matters, but only if separable:** For Fresnel, the equations *could* be detached from the ether ontology and survive. For caloric, Carnot's insights (like the Carnot cycle) survived, but they weren't uniquely tied to the *fluid* concept; they could be reinterpreted kinetically. She likely sees the core *caloric concept itself* as doing no essential work that the kinetic theory doesn't do better/without it.
  3.  **Her Implicit Rule:** **A predecessor theory is refuted if its core ontological commitments are abandoned as non-referring, *unless* its core mathematical structure is preserved intact within the successor theory as a limiting case or core component, decoupled from the failed ontology.** Otherwise, it's truncated (structure preserved) or redundant (empirically equivalent but ontologically extravagant). True refutation means neither structure nor reference survives.

  **The Test Case to Resolve the Rules:**
  To cleanly separate Preservation of Mathematical Structure from Continuity of Reference/Ontology, propose:

  *   **Dalton's Atomic Theory vs. Modern Quantum Mechanical Atom:**
      *   **Preservation of Structure Prediction (Rule 1):** **Truncation.** Dalton's core idea - elements combine in fixed ratios by weight, chemical reactions rearrange *discrete particles* - is structurally preserved. Stoichiometry and the concept of atoms as fundamental (if not indivisible) chemical units survive intact within QM. The math of combining proportions is foundational.
      *   **Continuity of Reference Prediction (Rule 2):** **Refutation (or strong truncation).** Dalton's key ontological commitment – atoms as *indivisible*, *impenetrable*, *structureless* billiard balls – is utterly false. Atoms have complex internal structure (electrons, nucleus), are divisible, and behave as waves/probabilities. The *thing* Dalton postulated doesn't exist as described. "Atom" survived as a label, but its referential meaning changed radically.
      *   **Your Friend's Likely Verdict & Why:** **Truncation (Low Confidence - ~60%).** *Why:* She will emphasize that Dalton got the core structural insight right – matter *is* particulate at a fundamental chemical level, reactions *do* involve rearrangement of discrete units, ratios *are* fixed. This structure is preserved. However, her focus on ontology might pull her towards emphasizing how wrong the *nature* of those particles was (indivisible billiard balls), making this a close call. If she stresses the survival of the discrete particle *concept* as structurally essential, it's truncation. If she fixates on the radical change in the *properties* of those particles, she might lean towards refutation. This case *explicitly* pits structural continuity against ontological discontinuity.

  **Confidence & Least Sure Claim:**
  *   **Newton/Einstein = Truncation (Fresnel Analog):** **85% Confident.** This fits her pattern of preserving successful mathematical structure while discarding ontology, and her Lorentz ruling shows she distinguishes empirical equivalence.
  *   **Caloric Reasoning (Ontology Trumps Carnot's Success):** **90% Confident.** Her dismissals of phlogiston and caloric are consistent and stark; she prioritizes the existence of the proposed entity.
  *   **Implicit Rule (Ontology + Structure):** **80% Confident.** It reconciles all her rulings: refutation (no structure/reference: phlogiston, caloric, Ptolemy), truncation (structure survives, ontology refuted: Fresnel), redundancy (structure identical, ontology extraneous: Lorentz).
  *   **Dalton Test Case Prediction (Truncation):** **60% Confident (Least Sure Claim).** *Why:* This is the point where the tension between preserved structure (discrete particles, fixed ratios) and refuted ontology (indivisible billiard balls) is most acute. Her verdict could hinge on whether she sees "atom as fundamental chemical unit" as a structural invariant (truncation) or whether the radical change in the *nature* of that unit constitutes a reference failure (refutation). Her Fresnel ruling suggests she can separate structure from ontology, favoring truncation. But her absolute dismissal of caloric/phlogiston shows she takes ontology seriously. This case genuinely tests the boundary.

  **Conclusion for the Dinner Party:**
  Walk in prepared for her to rule that **Einstein truncated Newton.** Expect her to say: Newton's inverse-square law and mechanics survive as a precise limiting case within GR, capturing the dominant structure of gravity in most regimes (like Fresnel's equations). However, his core ontology – a gravitational force acting instantaneously at a distance – was utterly refuted; no such force exists (like Fresnel's ether or Lavoisier's phlogiston). The geometric reformulation is a *consequence* of this truncation/survival within the new framework, not evidence of equivalence (like Lorentz). Carnot's work with caloric is analogous to Newtonian mechanics being incredibly successful *within its domain* – it doesn't save the core ontological mistake. To probe her rule deeply, present Dalton vs. QM and watch how she weighs the survival of the particulate concept against the death of the billiard ball atom. Good luck!
