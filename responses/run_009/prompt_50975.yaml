prompt: |-
  So last spring my cousin and I each put a chunk of savings into a friend's coffeeshop startup and it collasped by fall. Since then my dad's girlfriend has made it her personal mission to explain at every family dinner that it was obviously doomed — bad location, no restaurant experience, "the writing was on the wall." I started reading about hindsight bias and the narrative fallacy partly to defend myself, and I've accidentally argued myself into something way worse than the thing I was defending. Here's the argument:

  1. Once you know an outcome, you can't help feeling it was predictable — that's hindsight bias; your memory of what the evidence actually was gets rewritten by the result.
  2. For any outcome whatsoever, you can build a story afterwards that makes it look inevitable — the narrative fallacy. If the coffeeshop had taken off, my dad's girlfriend would have had a story about the "obvious" untapped market in that neighborhood.
  3. So the availability of a causal story tells you nothing about what was knowable in advance.
  4. Since a story would have been told either way, judging my decision by its outcome tells you nothing about the decision — only the process can be judged.
  5. But judging the process is contaminated too: "you should have looked harder at the lease" just means "looking would have revealed what we now know," and we only know to say "look at the lease" because we know how things ended.
  6. So there's no neutral standpoint from which to say what anyone should have foreseen, because every such judgment is made from the far side of the outcome.
  7. Therefore nobody is ever responsible for a foreseeable bad outcome, and nobody ever really learns from history — every "lesson" is just the story the survivors tell.

  That can't be right — it would give a free pass to the engineer who skipped the inspection, the surgeon who ignored the scan, everyone who ever ignored a warning that really was there. But I've stared at this for a week and every step still looks fine to me, and honestly step (7) would get everyone off my back at dinner, which makes me suspicous of how much I want it to be true. Which step is the weak one? And if I want to keep (4) — judge the decision, not the outcome — what do I have to give up to stop the slide from there to (7)?
reasoning: |-
  Okay, let me unravel this user's philosophical dilemma. They've constructed a logical chain arguing that outcome-based judgment is impossible due to hindsight bias, and they're rightly suspicious of where it leads - absolving all responsibility. 

  The core tension here is between their intellectual honesty (each step seems valid) and moral intuition (step 7 can't be right). I notice they're emotionally invested too - the family dinner dynamic adds personal stakes. 

  Breaking down their argument: Steps 1-3 are solid psychology (hindsight bias/narrative fallacy). Step 4 is where we hit the pivot - judging process over outcome is sensible, but then step 5 overreaches by claiming process judgment is equally contaminated. That's the crack in the logic. 

  Ah, here's the key insight: The user conflates two things in step 5. Just because we know which warning signs mattered post-collapse doesn't mean those signs weren't objectively present beforehand. The lease terms existed regardless of outcome - the question is whether a reasonable person should have scrutinized them. 

  For step 4 to work without sliding to step 7, we need to distinguish between: 
  - Outcome-dependent judgments ("you should have known it would fail")
  - Process standards that exist independently ("startup investors should examine leases")

  The latter anchors us. Yes, we use outcome to identify which standards to apply, but the standards themselves aren't defined by that single outcome. Professional norms exist precisely to avoid this trap - surgeons follow protocols whether the patient lives or dies. 

  Their engineer/surgeon examples actually disprove step 7: We judge them against industry standards, not outcomes. A surgeon who ignored a clear scan is negligent even if the patient survived by miracle. 

  So to answer their final question: Keep step 4 by embracing objective decision-making standards. Give up the idea that process judgments are as contaminated as outcome judgments - they're not, because we have cross-outcome reference points. 

  The dinner table solution? Shift from "you should have known" to "here are standard due diligence practices for coffee shop investments." Makes the criticism less personal while preserving accountability.
answer: |-
  Your reasoning is impressively sharp—you've hit on genuine epistemic problems in outcome-based judgment. The flaw lies in step 5, and addressing it breaks the chain to step 7. Here's the breakdown:

  ### The Weak Step: Step 5
  - **The error:** You conflate *knowing which specific factor caused failure* with *the general duty to investigate key risk factors*.  
  - **Why it’s flawed:**  
    Yes, *after* failure we know to say "you should have checked the lease." But **before investing, competent due diligence objectively requires examining leases, market data, and experience gaps**—regardless of outcome. The criticism isn’t *only* valid because we know the lease was fatal; it’s valid because leases are universally high-risk in retail. Ignoring them is poor process *even if the shop succeeded*.  

  ### How to Keep Step 4 Without Sliding to Step 7
  To judge the decision fairly (step 4), you need **decision-invariant standards**. This means:  
  1. **Define "good process" by pre-outcome norms:**  
     - Were industry-standard checks performed? (e.g., foot traffic analysis, break-even projections, competitor mapping)  
     - Did you assess your friend’s experience against typical startup requirements?  
     - These standards exist independently of outcome. A surgeon *always* should check scans; an engineer *always* should inspect structures.  

  2. **Accept that some warnings are objectively knowable:**  
     - Hindsight bias distorts *which* risks we emphasize post-failure, but not *whether* certain risks were visible.  
     - Example: If the lease had 200% above-market rent, that’s an objective red flag *before* failure. If you overlooked it, that’s a process flaw. If no such flags existed, failure isn’t on you.  

  3. **Distinguish "foreseeable" from "predicted":**  
     - "Foreseeable" = risks a reasonable person *could* have identified with due diligence.  
     - "Predicted" = claiming certainty about outcomes (which *is* distorted by hindsight).  
     - Responsibility attaches to ignoring *foreseeable* risks, not failing to *predict* outcomes.  

  ### Where Your Argument Succeeds (and Where It Doesn’t)
  - **Valid insights:**  
    - Steps 1–3: Correct—narratives of inevitability are post-hoc reconstructions.  
    - Step 4: Correct—outcomes shouldn’t judge decisions; process should.  
    - Step 6: Partially correct—we *are* biased by knowing the outcome.  

  - **Why Step 7 fails:**  
    Responsibility isn’t erased because judgment is hard. We use **objective benchmarks** (e.g., "a reasonable investor would check X") to anchor "should have known." The engineer who skips inspections is negligent *because inspections are standard practice*—not just because a bridge collapsed.  

  ### Practical Defense for Family Dinners
  1. **Shift to process:**  
     *"You’re right—if we’d known then what we know now, we wouldn’t have invested. But based on the info we had and the diligence we did, it was a reasonable risk. Hindsight makes every failure look obvious."*  

  2. **Challenge their certainty:**  
     *"If the shop had succeeded, would you be calling it ‘obviously’ a good bet? Or would you say we got lucky?"*  

  3. **Disarm with humility (if applicable):**  
     *"Maybe we missed something—but if we did, it wasn’t obvious at the time. Investing in friends is always a risk-reward call."*  

  ### Bottom Line
  You can keep step 4 (judge decisions by process) by demanding **evidence-based, outcome-neutral standards** for what constitutes "good process." This stops the slide to step 7 because:  
  - **Negligence** = violating known standards (e.g., not checking lease terms).  
  - **Bad luck** = following standards but failing anyway.  

  Your dad’s girlfriend isn’t wrong that failure *had causes*; she’s wrong that those causes were "obvious" without 20/20 hindsight. The real lesson? All decisions carry hidden risks—but we mitigate them through rigorous process, not prophecy.
