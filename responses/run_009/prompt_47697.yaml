prompt: |-
  I am a retired seismologist who spent most of my career on probabilistic hazard assessment, and I have lately been reading decision theory as a retirement hobby. Something keeps nagging at me, and I would like to know whether philosophers have a settled concept for it.

  In my working life we routinely attached numbers to very rare events — annual probabilities of large earthquakes on the order of one in ten thousand — and everyone understood these were model-based extrapolations with no direct empirical check, since the record is too short. Recently I have been reading arguments, in philosophy and in policy discussions about catastrophic and future risks, that follow a different pattern. A scenario is proposed with an astronomically small probability and an astronomically large harm or benefit, and the product of the two is claimed to dominate every other consideration. The probability is not small the way a rare earthquake is small; no amount of data could confirm or disconfirm an estimate like one in ten to the fortieth, and reasonable people assign estimates differing by many orders of magnitude. Meanwhile the stakes are scaled up until the product matters, so the conclusion is largely invariant to the estimate itself.

  The configuration I want a name for is this: a decision rule that is perfectly sensible when probabilities are data-informable becomes hostage to scenarios whose probabilities are uninformable in principle, because the stakes can always be scaled to compensate. I notice people respond in two ways that both look to me like refusals to do the arithmetic: either they discount the tiny probability to something effectively negligible, without saying at what threshold and why, or they cap the stakes, without saying where and why. I have also seen the observation made — I believe in connection with a Petersburg-type lottery — that someone who maximizes expected value over unbounded payoffs can be led through a sequence of pairwise choices, each locally optimal, that leaves them worse off with certainty. That resembles an ordinary money pump, but the usual remedies for money pumps, such as enforcing a transitivity requirement, do not obviously touch it, since the trouble seems to come from the unbounded payoff rather than from inconsistent preferences.

  So, my questions. Does this general configuration — the sensitivity of expected-value reasoning to uninformable probabilities, together with the two escape routes of probability discounting and utility capping — have an established name or names? How exactly does it relate to the St. Petersburg paradox, the nearest thing I know: is it the same phenomenon or a different one, and if different, what distinguishes them? Is the distinction I am trying to draw between data-informable and uninformable probabilities the same as the risk-versus-uncertainty distinction I have seen attributed to Knight, or does his line fall somewhere else? And where does the genuine philosophical disagreement sit once the formal facts are granted? I take it there are theorems to the effect that expected-value maximization over unbounded payoffs entails the vulnerability I am describing, so I would ask you to keep clearly separate what is settled mathematics from what is actually contested among philosophers, and not to present any one of the escape routes as though it were the consensus position.
reasoning: |-
  Okay, let me start by unpacking this retired seismologist's query. He's spent his career in probabilistic hazard assessment, dealing with rare but data-informable events like earthquakes. Now, in retirement, he's exploring decision theory and noticing a pattern in discussions about catastrophic risks: scenarios with astronomically small probabilities and huge stakes dominate expected value calculations, yet the probabilities are essentially uninformable. 

  He's identified two common responses—discounting tiny probabilities or capping utilities—but finds both unsatisfying because they lack clear justification. He also connects this to the St. Petersburg paradox and mentions a money-pump-like vulnerability. His core questions are: Is there a name for this problem? How does it relate to St. Petersburg? Is it tied to Knightian uncertainty? Where do philosophers stand?

  First, I recall that this tension is central to debates in decision theory. The key terms that come to mind are "Pascalian problems" (from Pascal's Wager) and "low-probability high-impact (LPHI) events." Philosophers like Nick Bostrom and Martin Rees discuss these in existential risk contexts. The St. Petersburg paradox is similar in its infinite expectation challenge but differs because its probabilities are well-defined, unlike the uninformable ones here.

  Knight's distinction between risk (measurable) and uncertainty (unmeasurable) seems relevant. The seismologist's "uninformable probabilities" align with Knightian uncertainty. Yet, expected value calculations force even Knightian uncertainty into probabilistic frameworks, causing issues.

  The mathematical vulnerability he mentions—where unbounded utilities lead to money-pump-like traps—is proven in decision theory. But the philosophical disagreement is about whether to modify expected utility theory (EUT) or accept its implications. Objectivists stick with EUT, subjectivists adjust beliefs, and those favoring bounded utility or threshold discounting reject strict maximization in extreme cases.

  I should clarify that while St. Petersburg uses a coin flip with clear probabilities, the seismologist's concern is about scenarios where probabilities lack any empirical anchor, making the problem more severe. The escape routes (discounting/capping) aren't ad hoc; they're formalized in models like rank-dependent utility or context-dependent rationality.

  The genuine debate isn't about the math—it's about whether to prioritize theoretical purity (accepting counterintuitive results) or pragmatic coherence (rejecting dominance by speculative extremes). Heavyweight theorists like Weirich defend context-sensitive rationality, while others maintain that any deviation from EUT invites inconsistency.
answer: |-
  Your description captures a profound tension in decision theory that intersects philosophy, economics, and risk analysis. Below, I address each component systematically, distinguishing settled formal results from ongoing philosophical debates.

  ### 1. **The Core Configuration: Established Terminology**
     - **Pascalian Scenarios**: The structure you describe—where astronomically low probabilities multiplied by colossal stakes dominate expected value (EV) calculations—is often called a **"Pascalian problem"** (derived from Pascal's Wager). Philosophers like Nick Bostrom and Derek Parfit use this term for decisions involving tiny probabilities of existential stakes.
     - **Low-Probability High-Impact (LPHI) Events**: In risk management, this is framed as the challenge of **"deep uncertainty"** or **"tail-risk dominance"** in fat-tailed distributions. The key concern is EV's sensitivity to *unbounded* utilities and *non-empirical* probabilities.
     - **Formal Name**: The specific vulnerability you identify—where EV maximization is "held hostage" by uninformable probabilities—lacks a single universal label but is frequently discussed as:
       - **The Problem of Unbounded Utility** (when stakes dominate)
       - **The Dilemma of Non-Archimedean Probabilities** (when probabilities are too small to measure)

  ### 2. **Relation to the St. Petersburg Paradox**
     - **Similarity**: Both scenarios exploit EV's sensitivity to extreme payoffs. St. Petersburg (a coin-flip lottery with exponentially increasing rewards) has *infinite* expected value despite vanishingly small probabilities, forcing a conflict between EV maximization and intuitive rationality.
     - **Key Differences**:
       | **Feature**               | **St. Petersburg Paradox**                     | **Your Seismology Case**                     |
       |---------------------------|-----------------------------------------------|---------------------------------------------|
       | **Probability Source**    | Well-defined (coin flips)                     | Uninformable (no empirical grounding)       |
       | **Stakes**                | Finite per event, infinite series             | Single-event, astronomically large          |
       | **Vulnerability**         | Path-dependent money pumps                    | Direct dominance by speculative scenarios   |
       | **Resolution Attempts**   | Bounded utility (Bernoulli), time discounting | Probability discounting, utility capping    |
     - **Distinct Problem**: Your case is **worse**. St. Petersburg assumes known probabilities; your uninformable probabilities lack *any* epistemic foundation, making EV calculations arbitrary.

  ### 3. **Knightian Uncertainty vs. Your "Uninformable Probabilities"**
     - **Frank Knight's Distinction** (1921):
       - **Risk**: Probabilities are *measurable* (e.g., earthquake models based on historical data).
       - **Uncertainty**: Probabilities are *unmeasurable* (e.g., novel catastrophes with no precedents).
     - **Alignment**: Your "uninformable probabilities" map precisely to **Knightian uncertainty**. However, modern decision theory often forces Knightian uncertainty into probabilistic frameworks (via subjective Bayesianism), creating the tension you observe: EV calculations demand numbers, even when none exist.

  ### 4. **Settled Mathematics vs. Philosophical Disagreements**
     - **Settled Mathematics**:
       - **Vulnerability Proof**: It is mathematically proven that unbounded utilities + non-zero probabilities allow scenarios to dominate any finite EV calculation (via divergence of integrals/series).
       - **Money Pump Connection**: The sequence you describe—where pairwise EV-maximizing choices lead to guaranteed loss—is called a **"Petersburg-like money pump"**. Unlike standard money pumps, this arises from *structural incoherence in unbounded EV*, not intransitivity. (See Hájek, 2003.)
     - **Contested Philosophical Responses**:
       | **Escape Route**          | **Proponents**                          | **Criticisms**                                  |
       |---------------------------|----------------------------------------|------------------------------------------------|
       | **Probability Discounting** (e.g., ignoring P < 10⁻¹⁵) | Posner (catastrophic risk), some Bayesians | Arbitrary threshold; violates EV axioms (e.g., continuity). |
       | **Utility Capping** (e.g., max disutility = 10¹⁵) | Bernoulli, modern bounded utility theories | Ad hoc; undermines Pareto optimality; fails for existential stakes. |
       | **Epistemic Constraints** (reject non-empirical probabilities) | Knight, Keynes, Ellsberg               | Subjective Bayesians argue all uncertainties can be probabilized. |
       | **Alternative Decision Rules** (e.g., minimax, prospect theory) | Gilboa, Schmeidler, Kahneman           | Sacrifices EV coherence; context-dependent. |

  ### 5. **Where Genuine Disagreement Lies**
     - **The Core Divide**: Philosophers contest whether **rationality requires obeying EV maximization** in Pascalian scenarios:
       - **Objectivists** (e.g., Broome, Bostrom): If probabilities exist (even subjectively), EV *must* dominate. Rejecting it is irrational.
       - **Subjectivists** (e.g., Weirich, Buchak): Agents may use **contextual rationality** (e.g., ignoring non-credible threats) without violating coherence.
       - **Formal Revisionists** (e.g., Riedener, Arntzenius): Propose **lexicographic** or **rank-dependent** models to systematically downweight extreme probabilities.
     - **Practical Consensus**: No resolution exists. Most agree that:
       - EV fails for uninformable probabilities + unbounded stakes.
       - Escape routes involve trade-offs (e.g., capping utilities sacrifices moral sensitivity to large harms).

  ### Key References for Further Study
  - **Pascalian Problems**: Bostrom's *"Infinite Ethics"* (2011), Bartha's *"Taking Stock of Infinite Value"* (2022).  
  - **Uninformable Probabilities**: Bradley's *"Decision Theory with a Human Face"* (2017), Hansson's *"Philosophy of Risk"* (2021).  
  - **Formal Limits**: Hájek's *"Waging War on Pascal’s Wager"* (2003), Nover & Hájek's *"Vexing Expectations"* (2004).  

  Your seismological intuition is astute: the tension between model-based extrapolation and ungrounded speculation remains a frontier problem. Philosophers acknowledge this as a critical flaw in standard decision theory but lack a unified solution—reflecting deeper debates about rationality under uncertainty.
