  First, why social kinds? They're trickier because they depend on human conventions, not just science. Terms like 'harassment' are defined by social norms and laws, which can be ambiguous. That's perfect for making externalism less straightforward. 

  Let me pick 'harassment'. It's a legal/social term with real-world implications. On Earth, it might require a power imbalance. On Twin-Earth, maybe not. The experts could be HR professionals or legal scholars. But here's the catch: unlike 'water', where chemists are clear authorities, HR experts might disagree among themselves. That weakens the division of linguistic labor. 

