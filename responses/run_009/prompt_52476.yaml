prompt: |-
  Teaching semantic externalism next week and I'm sick of the water case — everyone just recites it back at me. Give me an example of a Twin-Earth-style case where the term at issue is a social kind rather than a natural kind (think 'harassment', 'landlord', maybe 'teammate'), and where the externalist verdict — same word on both planets, different extension, so different meaning — is less secure then in Putnam's original. Make the case concrete enough that you can say who counts as the relevant experts there and whether the division of linguistic labor works for it the way it does for 'elm' vs 'beech'. Also be upfront about where the example is most likely to fail: which step a narrow-content defender would deny first, and what would have to hold for the case to actually support externalism — I'd rather walk into class knowing where it breaks.
