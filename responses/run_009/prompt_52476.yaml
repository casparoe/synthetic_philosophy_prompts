  Classroom angle: The user wants to walk in knowing the cracks. I should highlight where students might push back—probably on whether "power imbalance" is part of the meaning or just a contingent fact. 

  Final structure: Lay out the Twin-Earth case clearly, then dissect the expert role, labor division, and failure points. Keep it concrete: specific examples of behavior that counts/doesn't count as harassment on each planet. And emphasize that this isn't as clean as water—that's the whole point!
answer: |-
  Here's a concrete Twin-Earth case using the social kind term **"bully"**, designed to make semantic externalism less secure than with "water," complete with experts, division of linguistic labor, and failure points:

  ---

  ### The Twin-Earth Case: "Bully" on Earth vs. Twin-Earth
  - **Earth:** "Bully" is defined by psychological and educational experts (e.g., APA, UNESCO) as requiring a **pattern of intentional aggression** + a **power imbalance** (physical, social, or institutional). A one-off fight between equals isn't bullying.  
    *Example:* Alex repeatedly trips smaller classmates. Alex is a bully.  
  - **Twin-Earth:** Identical physical/psychological facts, but their experts (via cultural norms) define "bully" as **any repeated aggressive act**, *regardless of power imbalance*. A pattern of fights between equals *is* bullying.  
    *Example:* Twin-Alex and Twin-Chris (same size/status) fight daily. On Twin-Earth, both are bullies; on Earth, neither is.  

  **Externalist Claim:**  
  The extension of "bully" differs (Earth excludes equal-power conflicts; Twin-Earth includes them). Thus, "bully" has different meanings (intensions) on each planet, despite identical internal states in speakers.  

  ---

  ### Key Mechanisms & Why They're Weaker Than in Putnam's Case
  1. **The "Experts" (Who Defines the Kind?)**  
     - *Putnam's Case (Water):* Clear experts (chemists), stable facts (H₂O vs. XYZ).  
     - *"Bully" Case:* Experts are psychologists, educators, or policymakers. Their authority is **socially negotiated, contested, and evolving**. There's no "detector" for bullying like a mass spectrometer for water.  
     - *Problem:* An objector can argue experts merely *describe* social practices, not *fix* the meaning. If ordinary speakers ignore experts (e.g., calling any aggressor a "bully"), does deference still hold?  

  2. **Division of Linguistic Labor (Does it Apply?)**  
     - *Putnam's Case:* Laypeople defer to botanists for "elm" vs. "beech"; the distinction is invisible without expertise.  
     - *"Bully" Case:* Ordinary speakers *might* defer to experts (e.g., in school policies), but often rely on **folk understanding** ("they're mean repeatedly"). The power-imbalance criterion isn't "hidden" like molecular structure—it's part of public discourse.  
     - *Problem:* If speakers don't *actually* defer to experts (e.g., parents label kids "bullies" without checking power dynamics), the division of labor collapses. Meaning might be driven by communal use, not expert stipulation.  

  ---

  ### Where a Narrow-Content Defender Will Attack  
  1. **First Target: "Deference to Experts is Meaning-Constitutive"**  
     - *Objection:* "Speakers aren't *really* deferring. They have their own internal prototype for 'bully' (e.g., 'repeated mean behavior'), and expert definitions are just *beliefs* about the world. Twin-Earthers have the same prototype but different beliefs about what counts as bullying."  
     - *Rebuttal Needed:* For externalism to hold, deference must be **semantic** (meaning relies on experts) not just **epistemic** (experts know more facts). Evidence: laypeople appeal to experts to resolve disputes ("Is this *really* bullying? Ask the counselor").  

  2. **Second Target: "Social Kinds Lack Rigid Essences"**  
     - *Objection:* "Power imbalance isn't a 'hidden essence' like H₂O—it's a **normative stipulation**. Changes in social attitudes (e.g., redefining bullying) are meaning shifts, not discoveries. On Twin-Earth, they just have a different *concept*, not the same word with a different extension."  
     - *Rebuttal Needed:* Externalism must show that social kind terms *are* grounded in objective (if conventional) facts maintained by institutions. Example: Legal definitions of "harassment" *do* fix extensions (e.g., EEOC guidelines).  

  3. **Third Target: "Shared Stereotype Overrides Extension"**  
     - *Objection:* "Earth and Twin-Earth speakers associate 'bully' with identical stereotypes ('big kid stealing lunch money'). Their internal states *are* the meaning; differences in extension are irrelevant."  
     - *Rebuttal Needed:* Externalism requires that extension trumps stereotype when they diverge (per Putnam). But for social kinds, stereotypes may be *more* central to communication than expert boundaries.  

  ---

  ### What Must Hold for the Case to Support Externalism  
  1. **Robust Deference:** Ordinary speakers must treat expert definitions as **authoritative for application** (e.g., retract "bully" claims when experts say power imbalance is absent).  
  2. **Experts as "Reference-Fixers":** Institutions (schools, courts) must enforce definitions that are **binding on linguistic practice**, not just advisory.  
  3. **Stability Over Time:** The expert definition must be treated as **discovering social reality** (e.g., "We *found out* bullying requires power imbalance"), not inventing it.  

  ---

  ### Why This Works for Classroom Discussion  
  - **Concrete Tension:** Students grasp bullying debates (e.g., "Is cyberbullying *real* bullying?"). The case forces them to interrogate where meaning "lives."  
  - **Failure is Pedagogical:** When students say, "But *we* decide what 'bully' means!", that’s the narrow-content objection. Use it to test externalism's limits.  
  - **Alternative Terms:**  
    - *"Landlord"*: Twin-Earth has no property rights; "landlords" are temporary custodians. But this may feel like a different *concept*.  
    - *"Teammate"*: Twin-Earth requires formal contracts; Earth includes pickup games. Weak if "team" is ambiguous.  
    **"Bully"** strikes the best balance between familiarity and contested boundaries.  

  **Bottom Line:** This case makes externalism *arguable but defeasible*. It succeeds if students see that **meaning isn't just in the head**—but only if social norms function like natural laws. Where it breaks reveals externalism's vulnerability to convention.
