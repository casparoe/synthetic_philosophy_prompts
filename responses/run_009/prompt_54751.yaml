  We are designing a classroom activity for the absent-minded driver problem. The key elements:
   - Students will play the role of the driver.
   - The driver cannot know which exit they are at (first or second).
   - They must commit to a policy that applies at both exits.
   - Payoffs: Exit at first exit -> 1, Exit at second exit -> 4, Drive past both -> 0.

   We want to lead students through three stages:
   1. Non-randomized policies: They realize that without randomization, the best they can do is 1 (by always exiting at the first) or 0 (by always continuing) or 4 (by always exiting at the second, but then they exit at the first too and get only 1). Actually, if they always exit, they get 1 at the first and then the game ends, so they don't reach the second. But if they always continue, they get 0. So the only deterministic policies are:
        - Always exit: then at the first exit they get 1 and the game ends -> payoff 1.
        - Always continue: then they pass both and get 0.
        - But they cannot do "exit at the second only" because they don't know when they are at the second.

   2. Randomized policies: Let p be the probability of exiting at any exit (the same at both because of indistinguishability). Then the expected payoff is:
        - With probability 1/2 they are at the first exit (if we assume they start at the first exit and then with 1-p they continue to the second) but note: the actual calculation is:
            * At the first exit: they exit with prob p (get 1) or continue with prob 1-p.
            * If they continue, they reach the second exit. At the second exit, they exit with prob p (get 4) or continue with prob 1-p (get 0).
          So the expected payoff is: p * 1 + (1-p) * [ p * 4 + (1-p) * 0 ]
                                   = p + (1-p) * 4p
                                   = p + 4p - 4p^2
                                   = 5p - 4p^2.

          This is maximized when p = 5/8, and the expected payoff is 5*(5/8) - 4*(25/64) = 25/8 - 100/64 = 50/16 - 25/16 = 25/16 = 1.5625.

   3. The temptation to deviate at an exit: When at an exit, the driver might think: "If this is the second exit, then exiting gives 4, but if this is the first, exiting gives 1. But if I continue, then if this is the first I will get a chance at 4, but if this is the second, continuing gives 0. However, I don't know which one it is. But note: from the planning perspective, I committed to a p for a reason. However, at an exit, the driver might be tempted to deviate to a different action. We want to show that if they do that, they might undermine the plan.

   Staging challenges:
   - Students can count exits? We must prevent that by having the facilitator run the game in a way that the driver does not know which exit they are at and does not get feedback until the end.

   Proposed staging:

   Materials:
    - A deck of cards or a random number generator for the driver's randomization (if they choose to randomize at the wheel).
    - Alternatively, if they commit to a plan in advance, they might just state a policy (a fixed action or a probability).
    - A way for the facilitator to simulate the driver's journey without revealing the exit number. We can use a coin or a die to simulate the driver's random choice (if they choose to randomize) and the facilitator will know the state (first or second exit) but the driver won't.

   We'll have multiple rounds. Each round, a student (the driver) will commit to a policy. The policy can be:
     - Deterministic: "always exit" or "always continue"
     - Randomized: a probability p of exiting at an exit (to be implemented by the driver at each exit, but without knowing which exit they are at)

