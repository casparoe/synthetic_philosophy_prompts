prompt: |-
  I run pre-departure orientation for a university study-abroad program — a few dozen students a semester, headed everywhere from Tokyo to Cairo to Berlin. I have maybe fifteen minutes with each of them and no philosophy training, and they constantly ask stuff like: do I have to tip there, is jaywalking rude, do I queue like at home. I need an actual decision procedure I can run in one advising session, not a lecture. A colleague of mine sorts every local convention into three buckets: ones that coordinate (which side to pass on, how you queue), ones that compensate (tipping), and ones that signal membership (dress, greetings). She says visitors are bound by the first kind absolutely, by the second only where skipping it stiffs a specific person, and by the third barely at all. I'm honestly not sure that carve-up holds up. Build me the procedure: the questions in order, what counts as a good enough answer to each, where it terminates in a "follow it" or a "don't," and where it has to hand the call back to me because it's about values, not facts. Use my colleague's three buckets if they work, fix them if they don't. Then run it on three cases I actually get: an American student who insists on tipping in Japan because not tipping at home feels like stiffing the waiter; a student headed somewhere where boarding a bus is basically a contact sport, who want to know if elbowing past people is stealing from whoever was there first; and a student who'll be in a city where everyone crosses against the light and thinks waiting at the corner makes her look like a rube. Include at least one case where the procedure's answer goes against what I'd want to tell the student, and be upfront about what the procedure can't settle. Answer in American English.
reasoning: |-
  Okay, let's tackle this user's problem. They run pre-departure orientations for study-abroad students and need a quick decision procedure for handling cultural norms. Their colleague's three buckets (coordinate, compensate, signal) are a starting point, but the user isn't sure if they hold up. 

  First, I need to validate if these categories work. Coordination norms prevent chaos - like which side to walk on. Compensation norms involve direct payment like tipping. Signaling is about social belonging through gestures or dress. But real-life examples might blur these lines. For instance, queueing could be both coordination and signaling respect. 

  The user needs a step-by-step method that fits into 15-minute sessions. It should help students decide whether to follow a norm or not. The key is making it actionable, not theoretical. I should design a flowchart-like Q&A that ends with clear "follow" or "don't follow" outcomes, or flags when it's a values call.

  For the cases:
  1. American wanting to tip in Japan: Tipping there might insult the staff. Using the buckets, tipping is compensation, but skipping it doesn't stiff anyone in Japan since service workers are paid differently. The procedure should guide the student to withhold tips despite their discomfort.

  2. Bus boarding as a contact sport: This seems like coordination - a local system to avoid chaos. The student should participate to prevent disruption, even if it feels aggressive. 

  3. Jaywalking norms: Waiting at a red light as a tourist might mark you as an outsider. But since it's a coordination norm (traffic flow) with low personal risk, the student might follow local practice. 

  One case should contradict the user's instinct. Probably the jaywalking example - the user might want to say "always obey traffic laws," but the procedure could allow adapting to local flow where safe.

  The procedure must also identify unanswerable questions - like when local practices conflict with personal ethics (e.g., gender segregation). Those get kicked back to the advisor.

  Need to refine the buckets: Compensation only applies if there's direct harm to an individual. Signaling is generally optional unless it prevents offense (e.g., basic greetings). Coordination is nearly mandatory. 

  Finally, structure the procedure as key questions:
  - Is this about preventing chaos? (follow)
  - Would skipping directly harm someone? (follow)
  - Is it about belonging? (usually skip, unless it causes offense)
  - Does it violate core values? (advisor decision)

  This should cover most situations quickly while flagging ethical dilemmas.
answer: |-
  Here's a streamlined decision procedure based on refining your colleague's buckets. It uses 4 key questions in sequence, designed for a 5-7 minute conversation, terminating in clear guidance or a values-based referral. The fixes: **1)** "Compensate" only matters if skipping *directly* harms a vulnerable worker. **2)** "Signal" is split: harmless signals are optional, but signals that actively offend become quasi-coordination. **3)** Added a "core values" filter upfront.

  ### The Decision Procedure (Flowchart Style)
  Ask these questions **in order** – stop when you hit a terminal answer ("Follow" or "Don't Follow") or a referral ("Your Call").

  1.  **"Would breaking this norm *physically endanger* people or create *chaotic disruption* (e.g., traffic, crowds)?"**
      *   **YES** → **FOLLOW IT.** (e.g., which side of the sidewalk to walk on, boarding a crowded train safely). *This covers vital "Coordination".*
      *   *NO? → Go to Q2.*

  2.  **"Does skipping this norm *directly withhold expected compensation* from a *specific, non-powerful* worker (e.g., waiter, driver, porter) who relies on it?"**
      *   **YES** → **FOLLOW IT.** (e.g., tipping where it's a core wage component). *This covers true "Compensate".*
      *   *NO? → Go to Q3.*

  3.  **"Would breaking this norm be seen as *deliberately offensive or disrespectful* in that culture (beyond just marking you as an outsider)?"**
      *   **YES** → **FOLLOW IT.** (e.g., removing shoes indoors in Japan, basic polite greetings, avoiding blasphemy). *This covers high-stakes "Signal" (now "Respect").*
      *   *NO? → Go to Q4.*

  4.  **"Does following this norm seriously violate your *core personal ethics* (e.g., safety, equality, integrity)?"**
      *   **YES** → **DON'T FOLLOW IT, but strategize mitigation** (e.g., avoid the situation, explain politely if safe). → **REFER TO ADVISOR:** *"Let's discuss how to handle this conflict safely."*
      *   *NO? →* **DON'T FOLLOW IT.** (e.g., minor local fashion, slang, harmless "rubishness"). *This covers low-stakes "Signal".*

  ---

  ### Running the Cases

  **Case 1: American wanting to tip in Japan (where it's often seen as rude)**
  *   **Q1 (Endanger/Disrupt?):** No. Skipping tipping doesn't cause chaos. → *Next.*
  *   **Q2 (Compensate?):** **Critical Test.** In Japan, service staff are paid salaries; tips aren't part of their wage structure. Skipping *doesn't* stiff a specific worker. → *Answer = NO. → Next.*
  *   **Q3 (Offensive?):** **YES.** Tipping can imply the worker needs charity or that their employer doesn't pay fairly. It can cause embarrassment or offense. → **TERMINAL ANSWER: FOLLOW IT (i.e., DO NOT TIP).** *The student's discomfort stems from misapplying US compensation logic (Q2) to a context where tipping is actually a negative signal (Q3). The procedure says: Suppress your instinct, don't tip.*
      *   **Against Instinct? YES.** You might *want* to say "Follow your conscience," but the procedure overrules: skipping doesn't stiff anyone (Q2 NO), but *doing* it risks offense (Q3 YES).

  **Case 2: Student worried "elbowing" onto a busy bus is "stealing a spot"**
  *   **Q1 (Endanger/Disrupt?):** **YES.** In contexts where aggressive boarding is the norm (e.g., some parts of India, China, Russia), *not* participating as locals do can disrupt the efficient flow, cause confusion, and potentially create dangerous crowding or delays. The local chaos-avoidance system *requires* assertive participation. → **TERMINAL ANSWER: FOLLOW IT.** *It's fundamental Coordination (Q1). The "stealing" worry reflects a different cultural framing of queue fairness; here, the *system* is the coordination norm.*

  **Case 3: Student feels like a "rube" waiting at a red light where everyone jaywalks**
  *   **Q1 (Endanger/Disrupt?):** *Usually NO.* If *everyone* is safely crossing against the light (e.g., Rome, Hanoi), and traffic expects it, waiting often doesn't cause danger or major disruption (though be cautious!). → *Next.*
  *   **Q2 (Compensate?):** No. Not a payment issue. → *Next.*
  *   **Q3 (Offensive?):** **NO.** Waiting might make you look overly cautious or touristy, but it's rarely seen as *disrespectful* or offensive. It's just marking you as an outsider. → *Next.*
  *   **Q4 (Core Values?):** *Probably NO.* Safety concerns might exist, but "looking like a rube" isn't usually a core ethical violation. → **TERMINAL ANSWER: DON'T FOLLOW IT (i.e., it's fine to wait).** *This is low-stakes Signaling (Q3 NO → Q4 NO → Don't Follow). The student can choose to jaywalk to blend in, but the procedure absolves them of obligation.*

  ---

  ### What the Procedure *Can't* Settle (Requires Your Input)
  The procedure hands the call back to you (**REFER TO ADVISOR**) when:
  1.  **Q4 (Core Values Violation):** If the student identifies a conflict (e.g., gender-segregated seating they find discriminatory, pressure to participate in religious rituals, being asked to lie for a host family). *You* need to help them weigh risks, cultural sensitivity, personal boundaries, and program rules.
  2.  **Ambiguous Q1/Q3 Calls:** Is a chaotic boarding practice *truly* safe? Is a particular greeting omission *really* offensive or just quirky? If research is unclear or context is highly specific, you need to make a judgment call.
  3.  **"It Depends" Nuance:** The procedure gives binary answers. You might add nuance (e.g., "Don't *initiate* tipping in Japan, but if someone physically chases you to return cash you dropped, accept it graciously").

  **Key Improvements over Original Buckets:**
  *   **Clarified "Compensate":** Focuses on *direct financial harm to vulnerable workers*. Tipping in Japan fails this test.
  *   **Upgraded High-Stakes "Signal" to "Respect":** Avoids trivializing norms that cause genuine offense (e.g., dress codes in sacred spaces).
  *   **Added Core Values Filter:** Explicitly flags ethical dilemmas for advisor intervention.
  *   **Prioritized Safety/Chaos:** Puts physical safety and order first (Q1).

  This gives students a clear, defensible logic chain for most common questions within your time limit, while flagging the genuinely tough calls for your expertise.
