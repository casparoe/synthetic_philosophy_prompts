prompt: |-
  I teach bioethics, and every fall the death unit goes the same way: the brain-death people and the circulatory-death people talk past each other for a week and nobody notices they were never arguing about the same thing. So before we do definitions again I want the spec first. What would an adequate definition of death actually have to deliver? Give me the desiderata: the cases it has to handle without flinching (DCD donors where the heart could plausibly restart, anencephalic infants, locked-in patients, patients with minimal but real integrative activity left), the distinctions it can't collapse (organism vs person, whole-brain vs higher-brain, irreversible vs merely permanent loss of function), and the practical constraints it has to respect — transplant logistics, the need for a determinate call at the bedside, not outrunning what ICU physiology supports. For each requirement, say why it's a requirement and not just one camp's prejudice smuggled in. Then flag any pair of desiderata you suspect can't be jointly satisfied, since if that's right the list itself is basically the result. I'd also like to know which single requirement knocks out the most popular contending definitions — that's the part I most want to bring into class. No scorecard of the existing definitions needed, we'll do that fight ourselves.
reasoning: |-
  Okay, the user teaches bioethics and is frustrated with how discussions on defining death often lead to people talking past each other. They want to establish a clear set of criteria for what a definition of death must accomplish before diving into the usual debates. 

  First, I need to unpack their request. They're asking for desiderata—essential requirements that any adequate definition of death must meet. These should cover specific cases like DCD donors, anencephalic infants, locked-in patients, and those with minimal integrative activity. The definition must also handle key distinctions like organism vs. person, whole-brain vs. higher-brain, irreversible vs. permanent loss, and practical constraints like transplant logistics and bedside determinacy.

  The user wants each requirement justified as objectively necessary, not just reflecting one camp's bias. They also want conflicts between desiderata highlighted and to know which single requirement disqualifies most existing definitions. 

  Hmm, this is a meta-approach—stepping back from the definitions to first establish what they need to achieve. Smart. The frustration about students talking past each other suggests they want a framework that forces engagement with core tensions. The "cases it must handle without flinching" implies real-world messiness, not just theory. And the request to expose conflicts shows they want students to see why consensus is elusive.

  For the desiderata, I'll start with ontological grounding—what death actually *is*. Then epistemic constraints (how we know it), practical necessities (bedside applications), and boundary conditions (what it can't ignore). Each needs a "why not bias" explanation. For example, the DCD donor case tests irreversibility—but that's not pro-transplant bias; it's about avoiding false positives where spontaneous recovery could occur. 

  The big conflict will likely be between "ontological precision" (e.g., requiring irreversible loss of organismal integration) and "bedside determinacy" (needing a call within minutes/hours). ICU tech can sustain bodies despite brain death, blurring organismal unity, while DCD protocols declare death based on permanence, not irreversibility. That tension torpedoes many definitions. 

  The "irreversible vs. permanent" distinction is probably the killer requirement. Whole-brain definitions struggle with DCD (where function is permanent but not irreversible due to interventions), while circulatory definitions get wobbly on brain death cases. That one flaw alone disqualifies most textbook definitions. 

  ...I should also flag that "personhood" is a trap door. If a definition requires personhood loss, it collapses distinctions—but if it ignores consciousness entirely, locked-in patients become edge cases. That's another landmine. 

  Practical constraints like transplant logistics need careful framing. It's not about privileging organ procurement, but acknowledging that death declarations enable life-saving acts—so a definition that paralyzes transplants has real-world consequences. But this mustn't sound like we're defining death to harvest organs. 

  The anencephalic infant case will test "integrative activity" thresholds. Is a brainstem-only baby dead? Some definitions flinch here. Locked-in patients expose whether consciousness is conflated with integration. 

  Finally, I'll emphasize that the desiderata list *is* the teaching tool—the conflicts show why the debate persists. And I’ll note that irreversibility is the biggest stumbling block, since permanence suffices clinically but not philosophically for many. That’s the hammer for most definitions.
answer: |-
  Here’s a rigorous breakdown of the desiderata for a definition of death, designed to force clarity by exposing foundational tensions. Each requirement is justified by ethical, practical, or ontological necessity—**not** partisan preference.

  ---

  ### **I. Non-Negotiable Cases & Why They Matter**  
  *(Tests for false positives/negatives)*  
  1. **DCD Donors (Controlled Cardiac Death):**  
     - **Must handle:** Declaration after cessation of circulation, despite *technical possibility* of auto-resuscitation or artificial restart (e.g., via ECMO).  
     - **Why requirement?** Avoids conflating *permanent* (no intent to revive) with *irreversible* loss (physically impossible to revive). Not transplant bias—**fundamental to avoiding premature declaration.**  

  2. **Anencephalic Infants:**  
     - **Must handle:** Born with only brainstem function (minimal integration), lacking cortex.  
     - **Why requirement?** Tests if "integrative unity" requires neurocognitive capacity. **Avoids smuggling "personhood" into organismal death.**  

  3. **Locked-In Syndrome:**  
     - **Must handle:** Fully conscious, integrated organisms with no motor output.  
     - **Why requirement?** Protects against misdiagnosis by decoupling consciousness from integration. **Patient safety imperative, not higher-brain bias.**  

  4. **Minimal Integrative Activity (e.g., hypothalamic function post-GCS 3):**  
     - **Must handle:** Isolated hormonal/thermoregulatory activity without consciousness or environmental interaction.  
     - **Why requirement?** Challenges whether *any* cellular integration equals "alive." **Prevents biological trivialization of life.**  

  ---

  ### **II. Critical Distinctions That Must Be Preserved**  
  1. **Organism vs. Person:**  
     - **Why?** Death must apply to human *organisms* (biological entities), not persons (psychological entities). Collapsing these justifies killing PVS patients or anencephalic infants. **Safeguards against non-consensual euthanasia.**  

  2. **Whole-Brain vs. Higher-Brain:**  
     - **Why?** Higher-brain definitions declare death in PVS/locked-in cases; whole-brain requires total necrosis. Distinction ensures **neurological criteria aren’t covert quality-of-life judgments.**  

  3. **Irreversible vs. Permanent Loss:**  
     - **Irreversible:** Cannot be reversed *by any means* (e.g., decapitation).  
     - **Permanent:** Will not reverse *given current intent/tools* (e.g., DCD).  
     - **Why?** Permanent loss suffices for clinical death; irreversibility is metaphysical (unprovable). **Prevents conflating practicality with ontology.**  

  ---

  ### **III. Practical Constraints & Their Ethical Weight**  
  1. **Bedside Determinacy:**  
     - Declaration must be unambiguous within minutes/hours using available tools (EEG, clinical exam, circulatory monitoring).  
     - **Why?** Families, organ procurement, and resource allocation demand timely certainty. **Not logistics over ethics—avoids moral paralysis in ICUs.**  

  2. **Physiological Plausibility in ICU Context:**  
     - Must align with ICU capabilities (e.g., ventilators can maintain circulation despite brain death).  
     - **Why?** A definition contradicted by ICU physiology (e.g., "death = circulatory arrest") fails **real-world validity**.  

  3. **Transplant Viability Compatibility (Not Prioritization):**  
     - Must permit organ procurement *without* defining death to facilitate it.  
     - **Why?** If a definition makes transplant ethics impossible (e.g., by declaring DCD donors alive), it **lacks societal sustainability**—but must not *depend* on transplants.  

  ---

  ### **IV. Conflicts Between Desiderata: The Unresolvable Tensions**  
  - **Ontological Precision vs. Bedside Determinacy:**  
    A definition requiring *irreversible* loss (ontological gold standard) is **unprovable** at the bedside (only *permanence* is observable). *Example:* DCD donors’ circulation could *theoretically* restart with future tech, but we declare death anyway.  
    - **Result:** All definitions trade precision for practicality.  

  - **Organismal Integration vs. Consciousness:**  
    If death requires loss of integrative unity (e.g., neuroendocrine control), anencephalic infants may be "alive"—but if it requires consciousness, locked-in patients are "dead." *No definition satisfies both without moral hazard*.  

  ---

  ### **The Single Requirement That Eliminates Most Contenders**  
  **"Irreversible vs. Permanent Distinction"**  
  - **Why it’s fatal:**  
    - **Whole-Brain Standard:** Fails DCD cases—declares death based on *permanent* (not irreversible) circulatory loss.  
    - **Circulatory Standard:** Fails brain death cases—ventilators maintain circulation indefinitely, making loss *reversible* via artificial means.  
    - **Higher-Brain Standard:** Declares death in PVS/minimally conscious states, where organismal integration persists. Ignores *irreversibility* of consciousness loss vs. biological life.  

  **This requirement exposes that all mainstream definitions implicitly accept *permanence* at the bedside while invoking *irreversibility* philosophically—an inconsistency students rarely spot.**  

  ---

  ### **Conclusion: The List as the Lesson**  
  The desiderata reveal that death is a **cluster concept** with no monistic definition satisfying all requirements. Conflicts arise because:  
  - Biology (organismal integration) vs. Phenomenology (consciousness)  
  - Epistemology (what we can know) vs. Ontology (what is)  
  - Clinical urgency vs. Philosophical rigor  

  **Bring this into class:** Have students draft definitions that meet *all* desiderata. They’ll hit the walls you’ve outlined—proving that the debate isn’t about definitions, but about **which trade-offs society accepts**. The desiderata *are* the result.
