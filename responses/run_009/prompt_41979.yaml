prompt: |-
  You are a professional philosopher specializing in applied ethics and political philosophy, advising me, a member of my city's commemoration review board. Please think carefully about the record below before recommending a decision: start by reconstructing the candidate principles that fit our precedents, then apply them, rather than deciding first and rationalizing after.

  Our board's precedents, in brief:

  (1) We removed the 1915 courthouse statue of a Confederate officer, erected by a revisionist veterans' group; the local Black community had petitioned for its removal for decades.
  (2) We kept, with an added interpretive plaque, the centennial statue of our city's founder, a slave trader, reasoning that the evil, though real, is not what the statue honors, and that no one harmed by him is alive.
  (3) We renamed a boulevard that had honored a mid-century mayor in recognition of the very urban-renewal program that razed a Black business district; descendants of the displaced families, still concentrated nearby, had petitioned us.
  (4) We declined to rename a street named for a sixteenth-century explorer infamous for the enslavement and massacre of indigenous peoples, on the grounds that after four centuries the name has become a mere place-label and no affected community is local.

  The new case: a bronze statue, erected in 1970 outside the hospital he founded, honors Dr. Corwin, a physician celebrated for pioneering the county's rural vaccination programs and for building the hospital itself. But Corwin also directed the state institution's mid-century sterilization program, which sterilized several hundred institutionalized patients, and he regarded that work as part of the same public-health career. The last surviving patients died only a decade ago; their descendants are numerous in town, and a few have written to the board informally, though there is no organized campaign and the local paper's editorial board opposes removal.

  What should we decide if we want to be consistent with ourselves? Identify the closest analog among our precedents, spell out the two or three principles that fit our record at least equally well, say what each predicts here, and be honest about which principle we would be adopting with each available choice. Finally, describe the hypothetical future case that would best tell those principles apart.
reasoning: |-
  Okay, let me approach this as a professional ethicist would. The user presents a complex commemoration case requiring careful principle extraction from precedents rather than intuitive judgment. 

  First, I need to reconstruct the board's implicit ethical framework from four past decisions. The Confederate statue removal (Case 1) suggests harm to a living community trumps historical context. Keeping the slave trader statue with added context (Case 2) implies temporal distance and abstract symbolism matter. Renaming the boulevard (Case 3) shows direct harm to identifiable descendants warrants action. Not renaming the explorer's street (Case 4) confirms that extreme temporal distance neutralizes commemorative harm.

  The Corwin case presents a hybrid challenge: a recent harm (sterilizations ending just a generation ago) with living descendants, versus significant positive contributions. The physician's dual legacy - personally directing eugenics programs while founding vital medical infrastructure - forces us to weigh principles against each other. 

  Closest precedent seems to be Case 3 (urban renewal boulevard) due to the recency of harm and presence of affected descendants. But Case 2 (slave trader) also resonates regarding dual legacies. The tension lies between two principles: "Commemorative Harm Recency" (prioritizing redress for recent injustices affecting living communities) versus "Dual Legacy Accommodation" (retaining monuments to complex figures when harm is distant).

  If we remove Corwin's statue, we implicitly endorse the Harm Recency principle, making future actions on mid-20th century injustices more likely. Retaining it with a plaque leans toward Dual Legacy Accommodation, potentially applicable to figures like architects of harmful but historically significant policies. 

  The litmus test would be a hypothetical 2040 case: a university building named for a 1980s geneticist who pioneered disease screening but also authored racist eugenics papers. If Harm Recency dominates, we'd rename; if Dual Legacy prevails, we'd add contextualization. This reveals whether temporal proximity or multifaceted contribution weighs heavier in our calculus.

  Throughout, I must resist rationalizing a desired outcome. The board's consistency requires either extending the boulevard precedent (remove) or creating a new hybrid position (contextualize), each carrying distinct implications for how we define public memory ethics.
answer: |-
  Based on a careful reconstruction of your precedents, I identify **three core principles** governing commemoration decisions:

  1.  **Principle of Direct Harm & Living Connection:** Removal/renaming is warranted when the commemorated harm *directly and recently affected a specific community* whose members (or immediate descendants) *are still present and advocating* for change, and when the monument *primarily honors the harmful act or its context*. (Strongest in Precedent 1 & 3; absent in 2 & 4).
  2.  **Principle of Temporal Distance & Symbolic Detachment:** Retention is warranted when the harm occurred in the *distant past* (beyond living memory/connection), the commemorated aspect is *distinct from the harm*, and the name/monument has become primarily a *place-label or symbol of something else*. (Strongest in Precedent 2 & 4; absent in 1 & 3).
  3.  **Principle of Dual Legacy & Contextualization:** When a figure has a *significant positive legacy* intertwined with harm, but the harm is either *distant* or *not the primary reason for commemoration*, retention *with added contextualization* (e.g., plaque) is preferred over removal, provided no strong, current community of the harmed exists. (Strongest in Precedent 2; implied in 4).

  **Application to the Corwin Case:**

  *   **Principle 1 (Harm & Living Connection):** Predicts **REMOVAL**.
      *   *Reasoning:* The harm (sterilizations) is recent (last survivors died only 10 years ago), directly affected identifiable individuals, and their descendants are numerous locally and have expressed concern (even if informally). Corwin personally directed the program and saw it as part of his public health work, linking it directly to the career being honored. While the statue's primary focus (hospital founding, vaccination programs) isn't *explicitly* the sterilization, Corwin himself did not separate them. The harm is not centuries old (like Precedent 4) or disconnected from the commemorated individual's core actions (unlike Precedent 2, where the *founding* was commemorated, not slave trading).
      *   *Adopting this Principle:* Choosing removal affirms that harms within living memory, affecting a local community with ongoing presence, and directly tied to the commemorated figure's work, outweigh other contributions when the affected group seeks redress.

  *   **Principle 2 (Temporal Distance & Symbolic Detachment):** Predicts **RETENTION** (potentially with a plaque, but precedent suggests it might not be deemed necessary based on Case 4).
      *   *Reasoning:* While recent, 50-70 years ago might be argued as moving towards "historical distance" compared to Precedents 1 & 3 (harm within living memory of petitioners). The statue primarily honors medical contributions (hospital, vaccines), not the sterilization program itself. Over 50 years, the statue's meaning for the community may have detached from the harm and become symbolic of the hospital or public health generally.
      *   *Adopting this Principle:* Choosing retention affirms that sufficient time has passed to sever the direct link between the monument and the harm in the public consciousness, and that the monument's *current* primary symbolic meaning (as a marker for the hospital/medical progress) should prevail absent a strong, organized campaign.

  *   **Principle 3 (Dual Legacy & Contextualization):** Predicts **RETENTION WITH A CONTEXTUALIZING PLAQUE**.
      *   *Reasoning:* Corwin has a clear dual legacy – significant positive contributions (hospital, vaccines) alongside significant harm (sterilizations). The harm, while recent, is not the *reason* the statue was erected (focused on medical infrastructure). However, the harm *is* directly part of his career and known. Adding a plaque acknowledges the full complexity without removal, following the logic of Precedent 2 (slave trader founder). The lack of an *organized* campaign might be seen as lessening the imperative for removal compared to Precedents 1 & 3.
      *   *Adopting this Principle:* Choosing retention with a plaque affirms that figures with complex legacies can be commemorated for their positive contributions *if* the harm is explicitly acknowledged and contextualized at the site, especially when the commemorated aspect is distinct (though related) and no highly mobilized, directly affected community demands removal.

  **Closest Analog:** Precedent 3 (Boulevard Renaming) is arguably the *closest* due to **recency of harm** (urban renewal vs. sterilizations both mid-20th C.) and the **presence of affected descendants locally**. However, Precedent 2 (Slave Trader Founder) is also relevant due to the **dual legacy** aspect and the decision to contextualize rather than remove, though the *temporal distance* in Precedent 2 was much greater.

  **Hypothetical Future Case to Distinguish Principles:**

  *   **Scenario:** A university science building named in 1990 after Dr. Alice Vance, a renowned biologist (d. 2005) who made breakthrough discoveries there in the 1980s. Recently unearthed archives reveal that in the 1970s, at a different institution, Vance was a key member of a committee that systematically denied tenure to women, significantly damaging careers. Several women affected are still alive and/or their academic descendants (former students mentored by those denied tenure) are current faculty/students. They petition for renaming.
  *   **Distinguishing the Principles:**
      *   **Principle 1 (Harm & Living Connection):** Favors **RENAMING**. Harm is recent (1970s), directly affected identifiable individuals (some still alive), victims/descendants are present locally (campus community) and petitioning. The harm (sexism in academia) is part of her professional actions, though not the *reason* for the naming (specific scientific work).
      *   **Principle 2 (Temporal Distance & Symbolic Detachment):** Favors **RETENTION**. The harm occurred 40-50 years ago at another institution. The building name is now primarily associated with her scientific legacy at *this* university. Sufficient time has passed, and the name functions as a label for the building/science, detached from the earlier harm.
      *   **Principle 3 (Dual Legacy & Contextualization):** Favors **CONTEXTUALIZATION** (e.g., a prominent plaque in the building lobby detailing both her scientific achievements *and* the harm caused by her committee work). She has a dual legacy (significant science, significant harm). The naming honored the science, not the committee work. Contextualization addresses the harm without erasing the scientific contribution recognized by the naming.

  This hypothetical forces a clear choice between the principles based on the *recency* vs. *distance* of the harm, the *local presence and advocacy* of the harmed community, and whether the *commemoration's focus* can be separated from the harmful acts. The Corwin case sits closer to the "recency/presence" end of this spectrum than Precedent 2, but less so than Precedent 3 due to the lack of an organized campaign. Principle 3 offers a middle path explicitly endorsed in Precedent 2.
