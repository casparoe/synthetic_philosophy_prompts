answer: |-
  Your professor's dismissal reflects a common but oversimplified tradition in philosophy. The slogan "existence is not a predicate" is indeed Kant's, but its meaning, plausibility, and effectiveness against ontological arguments are nuanced. Let's break down the distinct claims, assess them, and see how they fare against Anselm and Gödel.

  **The Core Claim & Its Interpretations:**

  1.  **The Trivially True (Grammatical) Claim:**
      *   **Claim:** "Existence" is not a *grammatical* predicate like "is hairy" or "weighs 200 pounds." It doesn't describe a specific feature *within* the concept of a thing.
      *   **Plausibility:** Undeniably true. "Exists" functions differently grammatically and logically.
      *   **Effectiveness:** Kills **neither** argument. Anselm and Gödel aren't making a grammatical mistake. They are making claims *about* concepts and properties at a deeper logical or metaphysical level.

  2.  **The Substantive Conceptual Claim (Kant's Core Point):**
      *   **Claim:** Existence is not a *real predicate* or a *determining predicate*. That is, it adds *nothing* to the *concept* or *essence* of an object. Saying "X exists" doesn't provide any new information *about what X is* beyond the concept of X itself. It only posits that an object corresponding to that concept is instantiated in reality.
      *   **Rationale:** Consider 100 thalers. The *concept* of 100 thalers (their properties: made of silver, specific weight, monetary value) is identical whether they exist only in my mind or in my pocket. Adding "exist" to the concept doesn't change the concept itself; it only asserts that thalers matching this concept are found in reality. "Existence" doesn't enlarge or enrich the *content* of the concept.
      *   **Plausibility:** Highly plausible for *contingent* objects like thalers. The concept defines the thing; existence (or non-existence) is a separate matter of instantiation.
      *   **Effectiveness Against Anselm:** **Lethal.** Anselm's argument hinges on existence being a "great-making" property inherent *within* the concept ("that than which nothing greater can be conceived"). Kant argues existence *cannot* be such a property because adding "exists" to the concept doesn't change the concept's intrinsic content or make it "greater" *as a concept*. The greatness Anselm perceives comes from confusing the *concept* with its *instantiation*. Anselm thinks "God existing in reality" has a different *concept* (and is therefore greater) than "God existing only in the mind," but Kant says the concept is identical; only the instantiation differs. Gaunilo's island hints at this: defining a perfect island doesn't mean it exists, and adding "exists" doesn't change the definition.
      *   **Effectiveness Against Gödel:** **Ineffective.** Gödel explicitly avoids treating bare existence as a predicate. Instead, he treats **Necessary Existence (NE)** as a property: `NE(x) ≡ □∃y (x = y)` (x has necessary existence iff it's necessarily true that x exists). This is *not* saying existence *simpliciter* is a predicate like "is wise." It's saying that *necessary instantiation* is a special kind of modal property that can be attributed to an essence. Kant's objection targets the idea that existence *adds to the concept*, but Gödel's `NE` is defined *in terms of* existence across possible worlds – it's a second-order property *about* the thing's mode of being, not a first-order descriptive property *within* the concept. Gödel's argument operates on the level of essences and their necessary properties within a modal framework, largely sidestepping Kant's conceptual point.

  3.  **The Substantive Logical Claim (Frege/Russell Refinement):**
      *   **Claim:** Existence is not a *first-order predicate* applicable to individual objects. It is a *second-order predicate* or a *quantifier*. "Lions exist" doesn't predicate "existence" of individual lions (like "lions roar" does); it means "there is at least one thing that is a lion." Existence is expressed by the existential quantifier `∃`.
      *   **Rationale:** Logically, "exists" doesn't function like properties (e.g., "is red"). Saying "X exists" (where X is a definite description like "the present King of France") is analyzed as "There is exactly one thing that is King of France, and that thing exists," which is either false or tautological/meaningless when applied to an object already assumed to be referred to.
      *   **Plausibility:** Extremely plausible and foundational in modern logic. It clarifies the logical structure of existence claims.
      *   **Effectiveness Against Anselm:** **Damaging, but not necessarily fatal on its own.** Anselm's argument ("God exists in the understanding... but exists in reality") can be interpreted as illicitly treating "exists" as a first-order predicate applicable to the concept "God." The logical claim shows this is a category mistake. However, Anselm might be interpreted as making a claim *about* the concept itself (e.g., "the concept 'God' has the property that its object must exist"), which pushes towards the second-order. Kant's conceptual point is usually seen as the deeper objection here.
      *   **Effectiveness Against Gödel:** **Largely Ineffective.** Gödel's formalization uses higher-order modal logic. `NE` is defined using the quantifier `∃` within the scope of the necessity operator `□`. This aligns *with* the logical claim: `NE` *uses* the quantifier `∃` properly; it doesn't treat bare existence as a first-order predicate of individuals. `NE` *is* a property (in Gödel's system), but it's a complex, defined modal property *about* an object's relation to existence across worlds, consistent with existence being a quantifier.

  **Your Professor's Likely Meaning & Its Effectiveness:**

  *   **Meaning:** Almost certainly the **Substantive Conceptual Claim (2)** – Kant's core point that existence adds nothing to the concept, so it can't be a "great-making" property *within* the definition. This is the classic, historically dominant objection to Anselm.
  *   **Effectiveness Against Anselm:** **Strong and Legitimate.** This objection fundamentally undermines Anselm's core move from "conceived as greatest" to "must exist," revealing a confusion between conceptual content and instantiation. Calling it a "parlor trick" is harsh but reflects how many philosophers view Anselm's version *after* Kant – as trading on a logical/conceptual sleight of hand.
  *   **Effectiveness Against Gödel:** **Weak.** Gödel's argument is explicitly designed to circumvent *this specific objection*. By focusing on *necessary existence* (`NE`) as a defined *modal property* rather than bare existence as a descriptive predicate, Gödel shifts the debate. Kant's conceptual point about existence not adding to the concept doesn't directly engage with Gödel's claim that `NE` is a positive property an essence can possess. The objections to Gödel lie elsewhere: the controversial axioms (e.g., that necessary existence *is* a positive property, that all positive properties are compatible), the consistency of the system, or whether modal properties like `NE` can be coherently defined without presupposing what they aim to prove. Your professor's dismissal likely didn't account for this modal shift.

  **Is the Slogan Shadier Than It Looks?**

  **Yes, frequently.** The slogan "existence is not a predicate" is often deployed as a conversation-stopper, implying the ontological argument is obviously dead and buried. This is problematic because:

  1.  **Oversimplification:** It collapses distinct claims (conceptual vs. logical) and ignores the nuances of different formulations (especially modal ones like Gödel's).
  2.  **Ignores Modal Developments:** Kant's objection targets pre-modal, definitional arguments like Anselm's. It doesn't effectively engage with modern modal logic versions that define properties *involving* existence (like `NE`).
  3.  **Misleading Confidence:** It creates the false impression that there's one simple, universally accepted refutation, discouraging deeper engagement. Philosophers *still* debate ontological arguments seriously, including Gödel's.
  4.  **Distracts from Other Issues:** Even for Anselm, other potent criticisms exist (e.g., Gaunilo's reductio, the ambiguity of "greatness," presupposing existence is comparable). For Gödel, the real debate is over his axioms. The slogan can mask these complexities.

  **Commitment:**

  *   Your professor almost certainly meant Kant's **Substantive Conceptual Claim**: existence adds nothing to a concept, so it can't be a "great-making" property inherent in a definition.
  *   This objection **effectively refutes Anselm's Proslogion II argument** by exposing a fundamental category error regarding concepts and instantiation.
  *   This objection **does not refute Gödel's modal argument**. Gödel avoids treating bare existence as a predicate and instead defines "necessary existence" (`NE`) as a complex modal property. Critiquing Gödel requires engaging with his specific axioms and modal framework.
  *   The slogan **is often deployed shadily** – as an oversimplified weapon to dismiss *all* ontological arguments without engaging their specific structures, particularly sophisticated modal versions. Ten minutes was insufficient; Gödel's version deserves serious consideration beyond Kant's 18th-century critique.

  **What Now?** Your intuition is correct. Kant's slogan, powerful against Anselm, doesn't touch Gödel. To engage Gödel, you need to examine his premises: Is `NE` genuinely a "positive property"? Are all positive properties compatible? Is the system consistent? Does the argument subtly presuppose what it aims to prove? *That's* where the real philosophical debate about Gödel's ontological argument lies, not with the Kantian slogan about predicates. Your professor dismissed the parlor trick; Gödel offered a different game entirely.
