  First, I need to understand the core of each camp's argument. The moral-difference camp focuses on the normative structure of assertion—how lying breaches a specific trust tied to the act of asserting. The no-difference camp emphasizes identical intentions and outcomes, downplaying the significance of the linguistic mechanism. The user feels these arguments aren't engaging because each side presupposes different semantic foundations.

  The user mentions three alternative diagnoses: differing definitions of "morally different," a deeper disagreement about trust, or irreconcilable intuitions. I should evaluate each. For the first, if one camp is talking pro tanto wrongs and the other about all-things-considered judgments, that could explain the stalemate. But looking at the literature cited, like Saul and Shiffrin, they seem to argue for an additional wrong in lying, which is pro tanto. The no-difference camp might be conflating that with overall wrongness. That's a possibility.

  Next, the trust angle. The moral-difference camp ties assertion to a specific kind of trust necessary for communication. If trust is viewed as monolithic, then lying and misleading are equivalent. But if there are layers of trust, the violation in lying is deeper. This might be a substantive but unacknowledged disagreement.

  Finally, bedrock intuitions. Cases like the murderer at the door evoke strong but divergent reactions. If each side's starting point is these intuitions, arguments might not persuade because they're circular. The user might need to explore whether these intuitions can be reconciled or if they're fundamental.

  The user's hypothesis about semantics being parasitic seems strong. Assertion's norms aren't settled in philosophy—knowledge vs. sincerity norms, etc. If each camp assumes a different norm, their moral conclusions follow. So resolving the moral debate might require first settling the semantic question. But is that necessary? Maybe not. Some philosophers might derive moral differences without committing to specific norms, but in this case, the arguments seem tightly linked.

  Alternative explanations could be at play. For instance, differing conceptions of "trust" or the role of intentions. The no-difference camp might prioritize outcomes and intentions, seeing language as a tool, while the other sees assertion as a normative practice. That's a deeper philosophical divide about communication ethics.

  What would progress look like? If semantics is key, then a robust account of assertion and implicature is needed. Distinguishing pro tanto from all-things-considered could clarify. Test cases where lying and misleading have different consequences might help. Or exploring the nature of trust in communication.

  The user might also need to consider if the debate is terminological. Ensuring both sides agree on terms like "moral difference" could help. But given the described stalemate, it's likely more fundamental. The user's insight that arguments don't engage suggests they're operating on different premises. Unpacking those premises is crucial.

  In conclusion, the parasitic semantics hypothesis holds weight, but the trust aspect is intertwined. The disagreement is multifaceted, involving semantics, moral ontology, and conceptions of trust. Progress might require interdisciplinary work—semantics and ethics—or targeted thought experiments to isolate variables. The user's approach to diagnose rather than solve is apt, and highlighting the interconnected issues would provide clarity.
answer: |-
  Your diagnosis is perceptive and touches on genuine philosophical fault lines. The impasse likely stems from **multiple overlapping disagreements**—semantic, normative-ontological, and conceptual—but your "parasitic semantic question" hypothesis captures a core structural issue. Let's dissect the debate using your framework and alternatives, then outline paths to progress.

  ### 1. **Your Hypothesis: The Semantic Parasite (Strongly Supported)**  
     - **How it manifests**:  
       - The **moral-difference camp** (e.g., Saul, Shiffrin) presupposes a *robust normativity of assertion*. For them, assertion is governed by constitutive norms (e.g., the **knowledge norm** [Williamson] or **sincerity norm** [Searle]), making it a unique speech act with high-stakes epistemic duties. Lying directly violates these norms, corrupting a foundational practice of trust. Implicature, by contrast, operates under weaker norms (e.g., Grice’s Cooperative Principle), where hearers bear partial responsibility for inference.  
       - The **no-difference camp** assumes a *reductive or functionalist view* of assertion. For them, assertion is just one tool for transferring information, governed by generic moral norms (e.g., "Don't cause harmful false beliefs"). The distinction between saying and implicating is pragmatically useful but morally irrelevant—like choosing a pen or keyboard to deliver a threat.  
     - **Why they talk past each other**:  
       The moral-difference side argues *from* the metaphysics of assertion ("Lying is intrinsically wrong because it breaches assertion's constitutive norm"), while the no-difference side argues *from* moral outcomes ("Both acts cause identical harm: a false belief"). Without agreeing on what assertion *is*, they can't agree on what lying *does* that misleading doesn’t.  

  ### 2. **Alternative Diagnoses: Also Valid, But Intertwined**  
     - **(a) Ambiguity in "Moral Difference"**:  
       - **Pro tanto vs. all-things-considered**: Shiffrin (e.g., in *Speech Matters*) explicitly argues lying has an *additional* pro tanto wrong (violating assertion’s duty), even if overall wrongness depends on context. The no-difference camp often conflates this with all-things-considered judgments (e.g., "Both are equally wrong in the murderer-at-the-door case").  
       - **Why it matters**: If both sides don’t clarify whether they’re discussing *wrong-making features* or *final wrongness*, they’ll equivocate. Test cases where lying/misleading have identical outcomes (e.g., your wartime example) won’t resolve this—they only show that the pro tanto wrong *can* be outweighed.  
     - **(b) Disagreement About Trust**:  
       - **Moral-difference view**: Assertion-based trust is *sui generis*—a precondition for linguistic cooperation. Lying exploits this "core trust"; misleading exploits peripheral, inferential trust.  
       - **No-difference view**: Trust is unitary—reliance on the speaker’s intent. If both acts require the hearer to trust the speaker’s cooperative intent, they violate the *same* trust.  
       - **Proxy status**: Yes, "assertion norms" are a proxy here. But trust theories (e.g., Baier, Faulkner) often depend on prior commitments about communication, so semantics and trust are entangled.  
     - **(c) Bedrock Intuitions**:  
       - **The murderer-at-the-door case** (Kant/Constant) is pivotal. Moral-difference advocates intuit that lying *feels* like a deeper betrayal; no-difference advocates intuit that saving a life *justifies* either deception equally.  
       - **Circularity risk**: These intuitions may reflect prior semantic/normative commitments (e.g., Kantian deontology vs. consequentialism). Yet they aren’t *merely* semantic—they tap into visceral notions of honesty.  

  ### 3. **Synthesis: Why the Impasse Persists**  
  The disagreement is **three-layered**:  
  1. **Semantic/linguistic**: What *is* assertion, and does it carry unique norms?  
  2. **Normative-ontological**: Are there distinct *kinds* of moral wrongs (e.g., violating constitutive rules vs. causing harm)?  
  3. **Conceptual**: What *is* "trust" in communication?  

  The camps aren’t just "talking past each other"—they’re **occupying different levels of analysis**. The moral-difference camp focuses on **act-type morality** (what lying *is*), while the no-difference camp focuses on **act-token consequences** (what deception *does*).  

  ---

  ### **Paths to Progress**  
  Given this diagnosis, resolution requires **disentangling the layers**. Here’s what could help:  

  #### A. **Clarify the Semantic Question**  
     - **Goal**: Settle whether assertion has *constitutive norms* distinct from implicature.  
     - **Steps**:  
       - Debate specific accounts of assertion (e.g., Is it bound by a knowledge norm? A sincerity norm? Or just Gricean cooperation?).  
       - Analyze cases where assertion and implicature *diverge structurally*:  
         > *Test Case*: You say, "Alice is in Paris" (true) to imply she isn’t hiding in your attic (false). Later, you say, "Alice isn’t in this house" (false).  
         Does the latter feel like a different *kind* of betrayal, even if the hearer’s false belief is identical?  
     - **Progress metric**: Agreement on whether linguistic structure can *generate* moral distinctions, independent of outcomes.  

  #### B. **Isolate Pro Tanto Wrongs**  
     - **Goal**: Separate "Is lying *prima facie* worse?" from "Is lying *all-things-considered* worse?"  
     - **Steps**:  
       - Construct cases where lying and misleading have **identical outcomes**, but **differ in execution**:  
         > *Test Case*: Two doctors deceive a hypochondriac patient to avoid unnecessary surgery. One lies: "Your tests are normal." One misleads: "Your tests show no tumors" (true, but implies no illness, omitting a benign condition).  
         Is the liar blameworthy for an *extra* wrong?  
       - If both sides agree the liar commits an additional pro tanto violation (even if justified), the debate shifts from existence to weight.  

  #### C. **Theorize Trust Explicitly**  
     - **Goal**: Define whether trust in assertion is qualitatively distinct.  
     - **Steps**:  
       - Compare theories: Is trust in assertion based on **entitlement** (Hinchman, Moran) or mere **reliance** (Holton)?  
       - Use cases probing **trust repair**:  
         > *Test Case*: After deceiving someone, can trust in your *assertions* be repaired separately from trust in your *implicatures*?  

  #### D. **Concede Some Ground**  
     - **Moral-difference camp** could grant that in high-stakes cases (e.g., murderer at the door), the pro tanto wrong of lying *is* overridden—but insist it exists.  
     - **No-difference camp** could grant that lying has *more ways to go wrong* (e.g., it directly attacks shared linguistic infrastructure) but deny this affects blameworthiness in most cases.  

  ---

  ### **Conclusion**  
  Your parasitic-semantics hypothesis is **largely correct** but incomplete; the dispute also involves divergent moral ontologies (pro tanto features vs. outcomes) and conceptions of trust. Progress is possible if:  
  1. The semantic question is addressed head-on (e.g., "Does assertion have norms that implicature lacks?").  
  2. Pro tanto differences are tested separately from all-things-considered judgments.  
  3. "Trust" is explicitly defined.  

  If these fail, the debate may rest on **irreducible intuitions**—but even then, mapping the fault lines (as you’ve done) is valuable. This isn’t just a seminar stalemate; it mirrors live disputes in philosophy of language and ethics. Your instinct to diagnose rather than pick sides is philosophically astute.
