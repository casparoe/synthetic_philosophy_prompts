prompt: |-
  Quick help untangling something. I've been reading about the species problem and it finally clicked that half the disagrements I run into are people talking past each other because of a distinction that nobody ever makes explicit: whether the fight is about what species taxa are, or about what the species category is. Like, when someone says a species is an individual (Ghiselin/Hull style, with organisms as parts rather than members), that's a claim about particular taxa — it doesn't by itself tell me whether the rank "species" carves anything special out of the tree of life as opposed to being an arbitrary slice. I want an explaination that keeps those two questions separated the whole way through instead of quietly sliding between them.

  Give me exactly five numbered points, each one or two sentences, no intro or conclusion. They should cover, in whatever order you think is best:

  1. the taxon/category distinction itself, stated crisply enough that I could use it to classify other arguments in the literature;
  2. why ring species and asexual lineages show up in every single paper on this — are they genuine counterexamples to particular definitions, or edge cases that every definition handles by construction, and how would someone even go about telling those apart;
  3. how a monist about the species category could still survive all the counterexamples — maybe by saying some lineages just don't form species at all? I want the strongest version of that move, not a strawman;
  4. the difference between pluralism and eliminativism about species — they get lumped together but I suspect they're not the same thing, since pluralism says something like "several equally legitimate definitions for different purposes" while eliminativism says something much stronger;
  5. where a lineage known only from environmental DNA would fall — say a fungal lineage that turns up as a divergent barcode cluster in a soil metabarcoding study, no specimen, no morphology, nobody even knows what it looks like. Does that case put pressure on the taxon question, the category question, or both, and why.

  If you think one of my framings is off — e.g. if the individual-vs-class debate is secretly a category debate in disguise — flag it inside whichever numbered point it belongs to rather than adding a sixth point.
reasoning: |-
  Okay, let me tackle this user's request step by step. They want five crisp points about species concepts, clearly separating taxon vs. category debates. 

  First, I need to nail the taxon/category distinction (Point 1). Taxa are concrete lineages like Panthera leo, while the category is the abstract rank "species" itself. This framing should help classify arguments in the literature.

  For ring species and asexuals (Point 2), they're genuine paradoxes - not edge cases - because they expose contradictions between definitions. Ring species force incompatible classifications under interbreeding vs. lineage frameworks.

  Monism (Point 3) could survive by denying species status to problematic cases. The strongest version: lineages must meet strict criteria (e.g., obligate sex) to count as species. Missing the cutoff? Not a species.

  Point 4 needs to untangle pluralism from eliminativism. Pluralism accepts multiple valid definitions; eliminativism rejects "species" as a unified category entirely. The latter is far more radical.

  The eDNA case (Point 5) pressures both levels: taxon existence depends on operational criteria, while its species status challenges category definitions requiring phenotypic/ecological data.

  I notice the user suspects the individual-vs-class debate is really about taxa. I'll confirm that in Point 1 - Hull/Ghiselin target taxa, not category ontology. 

  User seems frustrated by conflated arguments. My response must maintain razor-sharp separation while addressing their precise sub-questions. No fluff - just numbered points as requested.
answer: |-
  Here are your five numbered points:

  1.  **Taxon vs. Category:** A **species taxon** is a concrete, particular lineage (e.g., *Homo sapiens*, *Canis familiaris*). The **species category** is the abstract rank or class ("species") to which specific taxa are assigned based on a chosen definition or concept.
  2.  **Ring Species & Asexuals:** They are genuine counterexamples *to specific species concepts*, not merely edge cases. Ring species challenge interbreeding concepts (BSC) by showing continuous gene flow between endpoints that don't interbreed; asexuals challenge concepts requiring interbreeding or monophyly. They expose inherent contradictions *between* different definitions of the category.
  3.  **Monism's Defense:** A strong monist argues the chosen species concept defines *necessary and sufficient* conditions for being a species taxon. Lineages failing to meet these criteria (e.g., obligately asexual lineages under the BSC) are *not* species at all—they represent different, distinct, and theoretically acknowledged forms of biological diversity outside the species category.
  4.  **Pluralism vs. Eliminativism:** Pluralism accepts multiple, equally valid species *concepts* (definitions) for assigning taxa to the species category depending on context. Eliminativism rejects the species *category* itself as a biologically meaningful or unified rank in the tree of life, arguing it doesn't carve nature at a joint distinct from other ranks like genus.
  5.  **eDNA Lineage Pressure:** It primarily pressures the *taxon* question: Can we recognize/define a specific lineage *as a distinct entity* solely from sequence divergence? Its status *within the species category* is secondary and depends on the chosen concept (e.g., a Phylogenetic Species Concept might accept it, others requiring ecology/morphology cannot).
