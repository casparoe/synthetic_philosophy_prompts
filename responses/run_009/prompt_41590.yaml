prompt: |-
  I've been going back and forth on absolute space and can't get my verdicts to line up, so tell me what I actually believe. Case one: two globes alone in an otherwise empty universe, tied together by a cord. If there's tension in the cord, Newton says they're really rotating, and I agree — that seems like a genuine physical difference, not just two ways of describing the same thing. Case two: Leibniz's shifted universe, where God creates everything five feet to the east of where it actually is in absolute space — no, that's not even a different possible situation, it's the same world wearing a different description. Case three: the bucket, water climbing the sides — obviously that's real rotation, something is really happening to the water. Case four: the entire contents of the universe uniformly translating through absolute space — I want to say that's not detectable and not a real difference, same as the shift. But case one and case four feel like they pull in opposite directions, and I can't articulate why lone-globe rotation is a fact while whole-universe translation isn't. And the one I keep flip-flopping on: bucket rotating in an otherwise empty universe vs. the bucket at rest with all the distant matter rotating around it the other way — same relative motion, and I half think they're physically different and half think that's crazy, and my verdict on the shift makes me suspect the crazy half is right. Is there a principle here — maybe something about which quantities get to be real and which are just bookkeeping — that fits all of this? If so, does it force me to give up the tension-in-the-cord verdict, or the shift verdict, or neither, and what does it say about a lone sphere in a completely empty universe spinning all by itself?
