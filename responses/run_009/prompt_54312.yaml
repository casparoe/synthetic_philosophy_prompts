prompt: |-
  here's my epistemic profile I'm supposed to share at a rationality meetup, can you check whether it actually hangs together before I send it out: (1) I'm big on the outside view — when I estimate how long my project will take, I should look at how long similar projects actually took, not at my detailed bottom-up plan. (2) I'm an epistemic modest: when I disagree with the aggregate of informed people, I should shift most of the way toward them, since track records favor informed aggregates over lone reasoners. (3) I think the famous cases of someone being right against the consensus — continental drift, ulcers and bacteria — don't show that sticking to your guns is a good policy, they're just the visible survivors of a huge graveyard of people who stuck to their guns and were wrong. (4) But I also think that when a reference class is populated by people with a known systematic bias — say, long-term technological forecasts by experts — the outside view can tell me to trust my own model of this particular case over the aggregate forecast. And (5) I think picking which reference class to use in the first place is an inside-view operation that you can't outsource. It feels like 2 and 4 are on a collision course, but I can't tell wether that's real or whether 5 somehow dissolves it. Flag anything else that doesn't cohere too (I have a nagging feeling about 2 and 5), rank the tensions by severity, and tell me what the cheapest revision would be — I genuinely don't know which one I'd give up.
reasoning: |-
  Okay, the user has shared their epistemic profile for a rationality meetup and wants me to check if it's coherent. Let me start by understanding each point they've listed. 

  First, they emphasize the outside view (1), which means relying on base rates and historical data rather than getting lost in the specifics of a single case. That makes sense. Then there's epistemic modesty (2), which suggests deferring to the consensus of informed people when in disagreement. 

  The third point (3) addresses survivorship bias in historical cases where individuals were right against the consensus. They argue that such cases are exceptions, not the norm. Point (4) introduces an exception to relying on aggregates: when there's a known systematic bias in the reference class. Here, they suggest trusting their own model instead. 

  Finally, point (5) states that choosing the reference class itself is an inside-view operation and can't be outsourced. The user is worried that points 2 and 4 might conflict and that points 2 and 5 could also be problematic. 

  Hmm, the main tension is between epistemic modesty (deferring to the aggregate) and the exception for biased aggregates (trusting your own model). How do they decide when an aggregate is biased? That decision seems subjective and relies on the inside view, which might contradict modesty. 

  Also, point 5 says choosing the reference class can't be outsourced, but that's an inside-view judgment. If they're being epistemically modest, shouldn't they defer to others on which reference class to use? That's another conflict. 

  The user might be concerned about appearing inconsistent at the meetup. They need their profile to be logically sound. Their deeper need is to present a coherent philosophy without self-contradiction, which is crucial in a rationality-focused group. 

  The cheapest revision? Maybe clarify that recognizing systematic bias requires strong evidence and should still involve consulting others. Emphasize that the inside view in point 5 needs to be tempered with modesty. That way, they maintain modesty while allowing exceptions, making the profile more cohesive without major changes. 

  Also, point 3 supports point 2 well by addressing survivorship bias. No issues there. But the user's nagging feeling about 2 and 5 is valid—choosing reference classes internally conflicts with modesty. They should acknowledge that this step is vulnerable to bias and suggest seeking diverse perspectives to mitigate it. 

  Overall, refining the exceptions in point 4 and clarifying the process in point 5 would resolve the tensions without overhauling their entire framework. That should make their profile hang together better for the meetup.
answer: |-
  Your epistemic profile is well-articulated and fundamentally coherent, but there are important tensions to address—primarily between points 2 and 4, with point 5 acting as both a bridge and a source of friction. Here's a breakdown:

  ### Key Tensions (Ranked by Severity)
  1.  **Tension between 2 (Epistemic Modesty) and 4 (Overriding Biased Aggregates):** (🟡 **High Severity**)
      *   **The Conflict:** Point 2 says "shift most of the way" to the informed aggregate when you disagree. Point 4 says sometimes you *shouldn't* shift – you should trust your own model over the aggregate if you believe the reference class has a known systematic bias.
      *   **The Heart of the Issue:** *How do you know the aggregate is systematically biased?* This judgment ("this group is biased about *this* type of question") is itself:
          *   An **inside-view judgment** about the aggregate's reliability.
          *   Likely made *while disagreeing* with that aggregate.
          *   Prone to the very biases you're attributing to the aggregate (e.g., overconfidence in your own assessment of their bias).
      *   **The Risk:** Point 4 can become a large, easily triggered escape hatch from epistemic modesty. Anyone who disagrees with the consensus can potentially justify ignoring it by claiming the consensus suffers from "known systematic bias." This directly undermines the core discipline of point 2.

  2.  **Tension between 2 (Epistemic Modesty) and 5 (Inside-View Reference Class Selection):** (🟠 **Medium Severity**)
      *   **The Conflict:** Point 2 urges deference to the aggregate. Point 5 states that the crucial step of *choosing the relevant reference class* (which fundamentally shapes the outside view) is inherently an inside-view operation that *cannot* be outsourced.
      *   **The Heart of the Issue:** Epistemic modesty suggests you should seek guidance on *how to frame the problem itself*. If choosing the reference class is the most critical, bias-prone step and you *can't* defer to others for it, then modesty is significantly constrained at the very foundation of applying the outside view.
      *   **The Risk:** The "inside-view" nature of reference class selection injects a significant dose of subjective judgment right at the start, which modesty (point 2) can't easily correct later. You can't be modest about the *aggregate's answer* if your modesty doesn't extend to the *aggregate's framing* of what counts as similar.

  3.  **Implicit Tension between 4 (Overriding Biased Aggregates) and 5 (Inside-View Reference Class Selection):** (🟢 **Low Severity**)
      *   **The Conflict:** Point 4 relies on identifying a "reference class... populated by people with a known systematic bias." Point 5 says picking the reference class is an inside-view operation.
      *   **The Heart of the Issue:** Diagnosing the *bias* of a specific reference class is an even more complex inside-view judgment than simply selecting a reference class. If selecting the class is hard and subjective, assessing its *systematic bias* is harder and even more subjective.
      *   **The Risk:** The justification for overriding the aggregate (point 4) rests on one of the most challenging and potentially biased inside-view operations (point 5).

  ### Coherence of Other Points
  *   **1 (Outside View) and 2 (Modesty):** Highly coherent. The outside view is a key *tool* for implementing epistemic modesty.
  *   **1 (Outside View) and 3 (Survivorship Bias):** Coherent. Point 3 reinforces why the outside view/aggregate (point 1) is generally superior to the inside view/"sticking to guns."
  *   **1 (Outside View) and 5 (Reference Class Selection):** Coherent. Point 5 correctly identifies the fundamental challenge *in* applying point 1.
  *   **3 (Survivorship Bias) and 2 (Modesty):** Coherent. Point 3 provides strong historical/rational justification for point 2.

  ### The Role of Point 5
  Point 5 is crucial and insightful. It correctly identifies that **you cannot escape the inside view entirely.** The initial framing, problem decomposition, and crucially, *the choice of which past experiences or groups are deemed relevant (reference class)*, require judgment. This judgment is vulnerable to your own biases.

  *   **Does it dissolve the tension between 2 & 4?** **No, it intensifies it.** Point 5 highlights that *both* the decision to follow the aggregate (point 2) *and* the decision to override it due to perceived bias (point 4) rely fundamentally on an initial, non-deferrable inside-view judgment (selecting the reference class). This makes the escape hatch in point 4 even more concerning, as it rests on this shaky foundation.

  ### Cheapest & Most Coherent Revision
  **Don't abandon any core principle. Refine Point 4 to make the exception much stricter and more modest, and explicitly acknowledge the vulnerability introduced by Point 5.**

  **Revised Point 4 Suggestion:**
  "(4) However, I recognize that aggregates *can* be systematically biased. If I have **strong, independently verifiable evidence** of a *specific, documented bias* affecting *this precise type* of judgment by *this specific group* (e.g., decades of data showing experts *consistently* over-optimism in long-term tech forecasts), *and* I have a well-developed, testable model of the specific case grounded in fundamental principles, **then** epistemic modesty might *sometimes* warrant weighting my own model more heavily than the aggregate forecast. **This remains a high-risk maneuver requiring extreme caution, as I am likely biased in assessing both their bias and the strength of my model.**"

  ### Why this is the "Cheapest" Revision
  1.  **Preserves Core Ideas:** You keep the outside view (1), core modesty (2), the survivorship argument (3), the *possibility* of overriding biased aggregates (4), and the critical insight about reference class selection (5).
  2.  **Reduces the Tension:** By making the exception in (4) much harder to invoke (requiring strong evidence of *specific, documented* bias, not just a feeling), you drastically reduce its ability to undermine (2). The bolded warning explicitly acknowledges the risk.
  3.  **Acknowledges Point 5's Challenge:** The revision implicitly highlights that *assessing* the "strong, independently verifiable evidence" of bias is itself subject to the inside-view judgment problem of point 5. This honesty strengthens your profile.
  4.  **Adds Nuance & Honesty:** This revision presents you as thoughtful, aware of the complexities and pitfalls, and genuinely committed to modesty even while acknowledging its limits. It's more sophisticated and less vulnerable to criticism.

  ### Addressing Your Nagging Feeling (2 & 5)
  Your feeling is spot on. Point 5 correctly states that the foundation (reference class selection) is an inside-view operation. This *does* create tension with point 2 (modesty) because you *cannot* outsource or be modest about this foundational step. **The cheapest revision here is explicit acknowledgment:** Add a sentence to point 5 or your overall conclusion: "I recognize that this necessary reliance on the inside view for framing and reference class selection is a fundamental vulnerability in my epistemic process, requiring constant vigilance against my own biases. Where possible, I seek diverse perspectives to challenge my framing *before* applying the outside view."

  ### Final Recommendation Before Sending
  1.  **Implement the Revision to Point 4** as suggested above.
  2.  **Add a brief acknowledgment** to Point 5 or your conclusion about the vulnerability of the inside-view framing step.
  3.  **Consider adding a meta-point about calibration:** "I strive to track the accuracy of my judgments, especially when I choose to override an aggregate, to learn when my inside-view assessments of bias or reference classes are justified or mistaken."

  Your profile is strong and shows deep thinking. Tightening point 4 and acknowledging the tension introduced by point 5 will make it significantly more robust and coherent for your meetup. Good luck!
