answer: |-
  Here's a decision-tree handout designed for clarity, pedagogical flow, and fidelity to the logical space of SCQ. It prioritizes case-based questions and minimizes jargon until the end.

  ---

  **The Special Composition Question: What Makes a Bunch of Things "One Thing"?**

  *Start here:* You believe there is at least one composite object in this room right now. (Probably *you* – a living person. We'll start there.)

  **NODE 1: THE LIVING PERSON**
  You exist as a single object made of parts (atoms, cells, organs). Does anything *else* composite exist?
  *   **(A) No, only living things like me are composite objects.** → **GO TO NODE 4**
  *   **(B) Yes, at least *some* non-living composite objects exist too.** → **GO TO NODE 2**

  **NODE 2: THE SCATTERED PEBBLES**
  Imagine 100 pebbles randomly scattered across a hillside (not glued, not arranged, just lying there). Is there one single composite object – "the heap" – made of *all* those pebbles?
  *   **(A) No, that's just 100 pebbles; there's no *one thing* there.** → **GO TO NODE 3**
  *   **(B) Yes, there is a heap-object made of all those pebbles.** → **GO TO NODE 5**

  **NODE 3: THE STATUE AND THE LUMP**
  Consider a statue (say, "David") made from a single lump of clay. Yesterday, it was just a lump. Today, it's a statue *and* a lump. Are there...
  *   **(A) ...Two distinct objects here right now (the statue and the lump), even though they are made of the same atoms in the same place?** → **GO TO NODE 6**
  *   **(B) ...Only one object here. Calling it a "statue" or a "lump" is just describing the same thing differently.** → **GO TO NODE 7**

  **NODE 4: THE TROUT-TURKEY**
  Imagine a bizarre biological entity: the front half of a trout seamlessly fused to the back half of a turkey (alive and functioning). Is this a single composite object (one organism)?
  *   **(A) No, it's just two half-organisms stuck together. Not a genuine organism/object.** → **GO TO NODE 7**
  *   **(B) Yes, if it's alive and functioning as a whole, it's one composite object.** → **You are close to: ORGANICISM (van Inwagen Style)** (Holds: Composition occurs *only* when the activities of the parts constitute a life.)

  **NODE 5: THE RANDOM ATOM CLUSTER**
  Imagine a cloud of atoms floating in deep space, arranged in a *completely random* pattern (not a gas cloud, not a rock, just... random). Is there a single composite object made of all those atoms?
  *   **(A) No. That's just a bunch of atoms near each other. No real unity.** → **You are close to: MODERATE RESTRICTIVISM** (Holds: Composition requires some specific relation like spatial closeness, bonding, or functional unity – but not necessarily life. *Includes views accepting artifacts (statues) but not arbitrary collections like heaps or random clouds.*)
  *   **(B) Yes. Any collection of things whatsoever composes something.** → **You are close to: UNIVERSALISM (Mereological Universalism)** (Holds: *Any* collection of things, no matter how scattered or unrelated, composes a further object.)

  **NODE 6: THE WRITTEN SENTENCE**
  Look at a sentence token written on the board (e.g., "CAT"). It's made of specific marks (chalk dust, pixels). Is this sentence *itself* a composite object?
  *   **(A) No. There are just marks on the board. The "sentence" is just us interpreting those marks.** → **You are close to: NIHILISM (or near-nihilism)** (Holds: Either no composite objects exist (only atoms) OR *only* living things exist (if you kept your answer from Node 4).)
  *   **(B) Yes. The marks are arranged meaningfully into a functional unit, so it's a composite object.** → **GO TO NODE 8**

  **NODE 7: IS THERE A GENERAL RULE?**
  We've seen specific cases (heaps, statues, trout-turkey, sentences). Is there a *single, fundamental principle* (like contact, life, function) that tells us *exactly* when composition happens in *all* cases?
  *   **(A) Yes, there *must* be a general principle, even if it's hard to find.** → **You haven't landed on a *specific* named view yet.** This suggests you lean towards a **RESTRICTIVISM** but need to specify the unifying relation (e.g., contact, function). Check Moderate Restrictivism (Node 5A) or Organicism (Node 4B).
  *   **(B) No. There is no general principle. Whether composition occurs is just a brute fact about the world in each specific case.** → **You are close to: BRUTAL COMPOSITION** (Holds: There are no informative necessary and sufficient conditions for composition; it's a fundamental, non-analyzable fact.)

  **NODE 8: IS THE DEBATE REAL?**
  When we disagree about whether the heap, the trout-turkey, or the sentence is a single object, are we disagreeing about...
  *   **(A) ...the objective structure of reality itself?** → **You are a REALIST.** You hold one of the substantive views above (Universalism, Organicism, Restrictivism, Brutalism, Nihilism). Pinpoint it based on your earlier answers.
  *   **(B) ...just the meanings of our words or concepts ("object", "part of")? There is no single, language-independent fact about how many objects are in the room.** → **You are close to: DEFLATIONISM / VERBALISM** (Holds: The SCQ isn't about deep metaphysics; it's about how we choose to use language/concepts to "carve up" the world. Different carvings are equally valid.)

  ---

  **Where the Tree Fails (The Interesting Bits!)**

  1.  **Indistinguishable Paths:**
      *   **Universalism + Composition-as-Identity vs. Plain Universalism:** The tree can't distinguish these. Both answer "Yes" to the Random Atom Cluster (Node 5B). CAI adds the claim that the whole *is* nothing "over and above" the parts, but this doesn't change the *when* of composition. (Distinction: Metaphysical, not compositional).
      *   **Some Moderate Restrictivisms vs. Brutalism:** A Brutalist *could* agree with a Restrictivist on all test cases (e.g., accept statues, reject heaps and trout-turkeys). The tree only flags Brutalism if the student explicitly denies a general principle (Node 7B).

  2.  **Empty Branches (Unexplored or Unattractive):**
      *   **Accept Trout-Turkey (Node 4B) BUT Reject Sentences (Node 6A):** Why accept a non-standard living thing but reject organized non-living artifacts? This combination seems unmotivated and isn't found in the literature. (Reason: Probably unexplored/unattractive).
      *   **Accept Scattered Heap (Node 2B) BUT Reject Random Atom Cluster (Node 5A):** This requires a principle that includes arbitrarily scattered pebbles but excludes arbitrarily arranged atoms. Hard to formulate non-arbitrarily. (Reason: Ugly/Incoherent?).
      *   **Reject the Living Person (Start):** While logically possible (leading to Nihilism), this starting point assumes students accept *at least* themselves. Pure nihilism from the start is rare and pedagogically tricky to handle first.
      *   **Brutalism + Specific Answers:** A Brutalist *could* accept any pattern of "yes/no" on the cases (Nodes 2, 3, 4, 6). The tree only identifies them if they *also* deny a general principle (Node 7B). Many combinations a Brutalist *could* hold are likely unexplored.

  ---

  **Design Notes for You**

  *   **Why this order?** Starts with the universal commitment (You exist). Tests the most extreme restrictivism (only life) early (Node 1). Uses the scattered pebbles (Node 2) as the clearest test for universalism vs. restrictivism *before* getting into trickier cases like the statue/lump (co-location) or trout-turkey (biological identity). Deflationism (Node 8) is placed *after* substantive questions so students engage the cases first, but *before* forcing them into a substantive box if their core intuition is verbalist. Brutalism (Node 7) is queried late as it's a meta-view about principles.
  *   **Cases Used:** Living Person (Entry), Scattered Pebbles (Universalism test), Statue/Lump (Co-location/Identity), Trout-Turkey (Organicism test), Written Sentence (Functional Artifact test). The Random Atom Cluster is a stronger universality test than the pebbles.
  *   **Missing Case?** The trout-turkey is crucial for Organicism. The sentence tests functional non-living composites beyond artifacts like statues. A "debris field" (slightly bonded junk) could be added to Node 3 or 5, but might overload. The current set covers key intuitions.
  *   **Undergraduate Focus:** Uses "pile of rocks," "alive," "stuck together," "marks on the board," "meanings of words." Avoids terms like "mereological sum," "parthood," "co-location" until the position labels.
  *   **Ten Leaves:** Nihilism, Universalism, Organicism, Moderate Restrictivism, Brutalism, Deflationism. (Node 7A loops back to help specify Restrictivism).

  Print this single-page flowchart (using clear indentation/bolding like above) for students to follow their intuitions down to a family of positions. The "Failures" section highlights the map-territory distinction and encourages deeper discussion.
