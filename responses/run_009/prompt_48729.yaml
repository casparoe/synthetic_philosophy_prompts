prompt: |-
  Is there an established name for the following? I keep running into people who don't so much lie to themselves as arrange to never receive the truth in the first place. My mother refused to open her biopsy results until after my sister's wedding. A guy I know asked all of us to tell him if his girlfriend was obviously seeing someone else, then blew up at the friend who actually did it. And I've been putting the scale in the closet from thanksgiving to new years. What gets me is the planning involved: to dodge a piece of information you have to have a pretty good idea of what it is. Some part of you already knows the answer, you're just refusing to let it get promoted to something you officially believe. So is this even self-deception in the sense philosophers worry about? You're not believing something you know to be false, you're managing to never form the belief at all — which maybe sidesteps the whole paradox of being both the con and the mark. I know lawyers talk about turning a blind eye, but that's about liability, not the mental structure. I want to know whether this thing has a real name, how it's supposed to relate to plain old self-deception, and if there is no name, coin one and tell me exactly where its edges are — for instance, does it still count when the information is sitting right there and you just don't look, versus when you actively arrange your life so it never reaches you?
reasoning: |-
  Okay, the user is asking about a specific behavior where people avoid receiving information to prevent forming a belief they suspect is true. They provided examples like their mother delaying biopsy results, a friend getting angry when told about his girlfriend's infidelity, and themselves hiding the scale during holidays. 

  First, I need to figure out if there's an established term for this. The user mentioned self-deception but points out it's different because they're not believing something false but avoiding forming the belief altogether. They also brought up "willful blindness" from law but note it's about liability, not the mental process. 

  I recall that in psychology and philosophy, there are concepts related to this. Terms like "strategic ignorance," "willful ignorance," or "avoidance coping" come to mind. The user wants to know how this relates to traditional self-deception and if there's a name. If not, they want a coined term with clear boundaries.

  Breaking it down: the key elements here are preemptive avoidance. The person suspects the truth but takes steps to not encounter the evidence. This prevents the belief from forming. Traditional self-deception involves holding a false belief while knowing it's false, which creates a paradox. This avoidance tactic sidesteps that paradox.

  The user also asks about the edges of the concept. For example, does it count if the info is available but ignored versus actively avoiding it? This distinction is important. Cases like not opening an email versus structuring your life to never receive the info both fit, but the latter involves more planning.

  Looking into related terms:
  - Willful Ignorance: Common in philosophy and social sciences. It involves a deliberate choice to avoid knowledge. The user's examples fit here, especially with the planning aspect.
  - Strategic Ignorance: Used in economics and sociology, focusing on the benefits of not knowing. This emphasizes the practical reasons behind avoidance.
  - Avoidance Coping: From psychology, dealing with stress by evading issues. This relates to emotional protection.
  - Information Aversion: Specifically in behavioral economics, where people avoid info due to anticipated discomfort.

  The user's deeper need might be understanding the mechanics of this behavior to make sense of their experiences. They might also seek validation that this is a recognized phenomenon, not just personal observation. Coining a term like "Preemptive Belief Avoidance" could help, but existing terms are sufficient if explained well.

  They also need clarity on how this differs from self-deception. Highlighting that no contradictory belief is formed is key. The paradox is avoided because the person never acknowledges the truth, so there's no conflict.

  Regarding boundaries: both passive avoidance (not looking at available info) and active measures (hiding the scale) qualify. The core is the intent to prevent belief formation by controlling information exposure.

  In summary, "willful ignorance" is the most established term. Explaining its nuances compared to self-deception and outlining the subtypes (passive vs. active) should address the user's query. They might also appreciate knowing the practical and emotional reasons behind such behavior, which ties into coping mechanisms.
answer: |-
  You've hit on a fascinating and well-observed psychological mechanism. What you're describing **does have established names and is a recognized phenomenon**, particularly distinct from classical "lying to oneself."

  Here's the breakdown:

  1.  **The Primary Terms:**
      *   **Willful Ignorance:** This is the most widely recognized and philosophically relevant term for the phenomenon you describe. It signifies a *deliberate choice* to avoid acquiring knowledge one suspects would be unpleasant or disruptive. The key is the *intentionality* and the *avoidance of information acquisition* itself.
      *   **Strategic Ignorance:** Often used synonymously with willful ignorance, but it can emphasize the *instrumental* aspect – the person avoids information *because* not knowing serves some purpose (e.g., maintaining peace, avoiding responsibility, preserving a desired self-image, enjoying short-term pleasures). Your examples perfectly illustrate this: preserving wedding joy, maintaining the relationship fantasy, enjoying holiday eating.
      *   **Plausible Deniability (Mental Version):** While commonly used in legal/ethical contexts, it also applies psychologically. By arranging *not to know*, the person creates a state where they can genuinely say "I didn't know," avoiding the internal cognitive dissonance or external consequences of *knowing*. Your biopsy example is classic plausible deniability generation.

  2.  **How it Relates to Classical Self-Deception:**
      You've pinpointed the crucial distinction brilliantly:
      *   **Classical Self-Deception (the "paradox"):** Involves simultaneously believing `P` and knowing `not-P` (or strongly suspecting `not-P`). This creates the logical tension philosophers wrestle with – how can you be both the deceiver and the deceived? Examples: A smoker believing "It won't happen to me" despite knowing the risks; an alcoholic believing "I can quit anytime" despite past failures.
      *   **Willful/Strategic Ignorance:** Avoids the paradox entirely. The person suspects `P` might be true (they have strong evidence or a strong intuition), but they **actively prevent `P` from becoming a fully formed, conscious belief** by blocking the confirming evidence. They don't affirm `not-P`; they simply refuse to affirm `P` by dodging the information that would force the issue. They manage the *input* stage of belief formation.
      *   **Relationship:** Willful ignorance is often seen as a *precursor* or *strategy* to *avoid* full-blown self-deception. It's a way to sidestep the painful cognitive dissonance that would arise if one held both the belief and its contradiction simultaneously. By never letting the unwanted belief form, they maintain a state of "not-knowing" that feels psychologically safer.

  3.  **Coining a Term (If Existing Ones Feel Insufficient):**
      While "willful/strategic ignorance" are well-established, your description emphasizes the *proactive planning and belief-prevention* aspect. A very precise term capturing this could be:
      *   **Preemptive Belief Avoidance (PBA):**
          *   **Definition:** The deliberate, anticipatory act of structuring one's environment, attention, or information flow to prevent the acquisition of specific knowledge that one strongly suspects would lead to an undesirable belief, thereby preventing that belief from forming consciously and officially.
          *   **Edges & Nuances (Defining the "How"):**
              *   **Suspicion Level:** PBA requires a *strong suspicion* or *high probability assessment* of the unwanted truth. It's not mere laziness or accidental oversight. (Your point about "having to have a pretty good idea" is spot on).
              *   **Proactive Action:** It involves *doing something* to block the information. This ranges from:
                  *   **Passive Avoidance:** Not opening the email/letter (Biopsy), refusing to listen when the topic comes up (Girlfriend), avoiding the scale in the closet (You).
                  *   **Active Avoidance:** Telling people not to tell you (Girlfriend), physically hiding/disabling the information source (Scale), structuring your schedule/environment to avoid potential encounters with the truth.
                  *   **Information Filtering:** Consciously ignoring cues, dismissing ambiguous evidence, or only seeking sources that confirm the desired (lack of) belief.
              *   **Goal:** Prevention of conscious belief formation, not persuasion into a false belief.
              *   **Does it still count if the info is sitting there?** **YES.** This is a core case. *Not looking* at readily available information (the unopened biopsy results, the hidden scale) because you suspect what's inside *is* PBA. The key is the deliberate choice *not to access* it despite its availability, driven by the suspicion of its content. Actively arranging life so the information never reaches you (e.g., moving to avoid gossip, quitting a job to avoid bad news) is simply a more extreme form of the same proactive strategy.
              *   **What it's NOT:**
                  *   **Simple Denial:** Saying "No, that's not true" after receiving the information.
                  *   **Classical Self-Deception:** Believing the opposite (`not-P`) while knowing/suspecting `P`.
                  *   **Lack of Curiosity:** Not caring about the information in the first place.
                  *   **Inadvertent Ignorance:** Simply not knowing because the information never came your way.

  **Conclusion:**

  Your observation is astute. **Willful Ignorance** or **Strategic Ignorance** are the established terms for the behavior you describe – the deliberate avoidance of information acquisition to prevent forming an unwanted belief, precisely because one strongly suspects that belief would be true. This mechanism successfully sidesteps the logical paradox of classical self-deception by managing the *input* of belief formation rather than trying to hold contradictory beliefs. **Preemptive Belief Avoidance (PBA)** could be a useful, more specific term to emphasize the anticipatory, belief-prevention nature of the strategy, encompassing both passive non-access (not opening the letter) and active life-rearrangement. The core defining feature across all these terms is the **deliberate action to avoid knowledge, driven by a strong suspicion of what that knowledge would reveal.** It's a sophisticated, if often maladaptive, form of psychological self-protection.
