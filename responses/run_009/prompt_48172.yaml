prompt: |-
  I'm a palliative care nurse practitioner who runs the orientation for residents rotating through our inpatient hospice service, and every few weeks one of them freezes at the same point: a dying patient's pain or agitation is out of control, the family is desperate, and the resident is scared that uptitrating the morphine or starting sedation is going to "kill the patient" — some of them have said flat out they don't want to be the person who gives a fatal dose. Our attendings each give different advice, so the residents get whiplash. One says intent is what matters and if you mean to relieve suffering you're fine; another says the doses we actually use don't hasten death, mostly; a third just tells them never give anything without a documented attending order. I want something more consistent and teachable: a written decision procedure the residents can run at 3am, built around the doctrine of double effect but honestly translated into clinical terms — the questions in order, what counts as a sufficient answer at each step, where the procedure stops with a no, and where it has to hand off to the attending or an ethics consult because it's a values question rather than a clinical one.

  The procedure needs to keep apart the distinctions the residents keep collapsing: intending a bad outcome vs merely foreseeing it, giving a drug that relieves symptoms and might shorten life vs giving something whose only possible effect is to end it (they ask about things like paralytics at the very end), and withdrawing something we started (ventilator, iv fluids) vs starting a new intervention. Also the residents can't tell the difference between sedation for refractory suffering and sedation for the family's peace of mind, so the procedure should catch that somewhere. Then run it on three cases: (1) refractory terminal agitation where the plan is continuous deep sedation and the family is on board; (2) a resident asked to push opioids for a patient who is actually comfortable but breathing noisily, where the family wants him "completely peaceful" — sedation for their sake, not his; (3) a planned extubation where death is expected within minutes and the resident has to give the pre-extubation opioids themselves — that last one is where I already know I won't like wherever the procedure lands, but I want to see it argued anyway rather than dodged.

  One more thing: be honest that the intent/foresight distinction can't be settled by just asking the resident what they intended — if the procedure needs a proxy for intent, say what the proxy is and why it's better than self-report. And flag which steps are really judgment calls dressed up as checklist items, because the residents will trust it more if it admits its limits. It shouldn't be longer than what a resident could realistically read on a shift — aim for something we can print on two sides of one page, with the worked cases as an appendix.
reasoning: |-
  We are creating a clinical decision procedure for residents facing end-of-life symptom management dilemmas, especially regarding opioid titration and sedation. The procedure must:
  1. Distinguish between intended effects (relief of suffering) and merely foreseen effects (possible hastening of death).
  2. Be grounded in the doctrine of double effect (DDE) but translated into clinical steps.
  3. Address common confusions: symptom relief vs. life-ending, withdrawal vs. starting new interventions, sedation for patient vs. family.
  4. Provide clear steps with decision points, including when to stop and when to escalate to an attending or ethics.
  5. Include a proxy for intent that is more reliable than self-report.
  6. Be concise enough for a double-sided one-page printout, with worked examples in an appendix.

  The DDE traditionally has four conditions:
  1. The action itself must be morally good or neutral.
  2. The bad effect must not be the means to the good effect.
  3. The intention must be only the good effect (the bad effect may be foreseen but not intended).
  4. There must be proportionality between the good and bad effects (the good must outweigh the bad).

  We'll translate these into clinical questions.

  **Proxy for Intent**: Instead of asking "What do you intend?" (which is subjective and unreliable), we use the following proxy: 
     - **The intervention is titrated to the symptom, not to a physiological endpoint (like respiratory depression).** 
     - We look at the dosing and titration pattern: starting low and increasing until symptom relief, with monitoring of symptoms and side effects, is consistent with intent to relieve symptoms. Giving a massive bolus without titration or monitoring would be inconsistent.

  **Procedure Outline**:

  We break it down into sequential questions. At each step, if the answer is "no", the procedure stops and the resident must not proceed without escalation (to attending or ethics).

  ---

  **Clinical Decision Procedure: Palliative Symptom Management in Imminently Dying Patients**

  **Step 1: Is the patient imminently dying? (Within hours to days, with irreversible decline)**
     - **Yes**: Proceed to Step 2.
     - **No**: This procedure does not apply. Seek attending guidance for non-imminent dying.

  **Step 2: Is the symptom severe and refractory to standard interventions?**
     - _Symptoms include: pain, dyspnea, terminal agitation, etc._
     - _Refractory means: adequate trials of standard therapies have failed or are intolerable._
     - **Yes**: Proceed to Step 3.
     - **No**: Re-evaluate symptom management. Do not proceed to sedation or high-dose opioids.

  **Step 3: Is the goal of the intervention solely to relieve the patient's suffering?**
     - _Check: Is the intervention being considered because of the patient's distress, or is it for family/team comfort?_
     - **Proxy for intent**: The intervention is dosed and titrated to the level of the symptom (e.g., starting at standard doses, increasing incrementally until symptom relief, monitoring for effect and side effects). 
     - **Yes** (for patient's suffering): Proceed to Step 4.
     - **No** (e.g., the patient is comfortable but family wants "peace" or the team wants to "hurry"): Stop. This is not ethically justified. Discuss with family and team about goals of care. Escalate to attending.

  **Step 4: Is the intervention appropriate for the symptom?**
     - _Examples: opioids for pain/dyspnea, sedatives (e.g., midazolam) for agitation, not paralytics or other non-symptom-directed drugs._
     - **Yes**: The drug is standard for the symptom and not one that only causes death (e.g., potassium chloride). Proceed to Step 5.
     - **No** (e.g., someone requests a paralytic): Stop. This is never appropriate for symptom control. Escalate immediately.

  **Step 5: Is the intervention being started, or is it a continuation/withdrawal of an existing intervention?**
     - **Starting a new intervention**: Proceed to Step 6.
     - **Withdrawing an intervention** (e.g., ventilator, IV fluids): This is ethically distinct and generally acceptable when burdens outweigh benefits. Proceed to Step 6 (but note: withdrawal does not require DDE justification as it is foregoing non-beneficial treatment).

  **Step 6: Proportionality Assessment**
     - _Weigh the certainty and magnitude of symptom relief against the risk and magnitude of harm (e.g., life shortening)._
     - **Key factors**:
          - Severity of suffering without intervention.
          - Likelihood of relief with the intervention.
          - Risk of hastening death (based on evidence: in palliative care, titrated opioids/sedatives rarely hasten death when used appropriately).
          - Availability of alternatives.
     - **Judgment**: If the expected relief of suffering clearly outweighs the risk of harm, proceed to Step 7.
     - **Unclear or high risk without clear benefit**: Stop. Escalate to attending.

  **Step 7: Implementation with Safeguards**
     - **Dosing**: Start at standard doses for the symptom and titrate upward incrementally (e.g., 25-50% increase) with frequent reassessment (every 15-30 minutes for IV, longer for other routes) until symptom relief is achieved.
     - **Monitoring**: Continuously monitor symptom response and adverse effects (e.g., respiratory rate, sedation level). Have reversal agents available (e.g., naloxone for opioids) but note: in imminently dying patients, reversal is usually inappropriate and may cause distress.
     - **Documentation**: Clearly document:
          - The refractory symptom and prior interventions.
          - Discussion with patient (if able) and family about goals and risks.
          - The intent: "To relieve [symptom] with titration until symptom control, acknowledging the risk of life shortening as a foreseen but unintended effect."
          - Dosing: each step and the effect.

  **If at any step the resident is unsure, they must escalate to the attending or, if unavailable, an ethics consult.**

  ---

  **Worked Examples (Appendix)**:

  **Case 1: Refractory terminal agitation with plan for continuous deep sedation (family on board)**
     - Step 1: Patient is imminently dying (hours to days) - Yes.
     - Step 2: Agitation is severe and refractory (tried haloperidol, lorazepam PRN) - Yes.
     - Step 3: Goal is to relieve patient's agitation (family is on board but the intervention is for the patient) - Yes. Titration will be to control agitation.
     - Step 4: Appropriate intervention (e.g., midazolam infusion) - Yes.
     - Step 5: Starting a new intervention - Proceed to Step 6.
     - Step 6: Proportionality - Agitation causes extreme distress. Risk of hastening death is low with careful titration. Relief outweighs the risk - Yes.
     - Step 7: Start midazolam infusion at low dose (e.g., 0.5-1 mg/hr), titrate upward every 15-30 minutes until agitation controlled. Monitor level of sedation and respiratory status. Document intent and titration.

  **Case 2: Comfortable patient with noisy breathing (death rattle), family wants "complete peace" by sedation**
     - Step 1: Imminently dying - Yes.
     - Step 2: Symptom? The patient is comfortable (no apparent distress). Noisy breathing is not causing the patient suffering. It is refractory to repositioning and anticholinergics? But note: Step 2 requires the symptom to be severe and refractory. Here, there is no patient symptom - the "symptom" is family distress. So:
     - Step 3: Goal is for family's peace, not patient's suffering - No. Stop. Do not sedate. Instead, educate family about normal dying process and provide support. Escalate to attending for family meeting.

  **Case 3: Planned extubation, death expected within minutes, resident to give pre-extubation opioids**
     - Step 1: Imminently dying (minutes) - Yes.
     - Step 2: Symptom? The patient may have dyspnea upon extubation. We are giving opioids to prevent dyspnea. However, if the patient is currently comfortable, then we are giving the opioid pre-emptively. This is acceptable if dyspnea is expected. But note: 
          - Step 2: If the patient has no current symptoms, is it refractory? We are preventing an expected symptom. In palliative care, pre-emptive dosing for expected symptoms is standard. So: 
          - We can say the symptom is anticipated severe dyspnea, and it is refractory because we are about to remove the ventilator. So, Yes.
     - Step 3: Goal is to prevent patient suffering (dyspnea) - Yes. The opioid is titrated to prevent dyspnea, not to cause death.
     - Step 4: Opioids are appropriate for dyspnea - Yes.
     - Step 5: Starting a new intervention (opioid) - Proceed to Step 6.
     - Step 6: Proportionality: The risk of dyspnea is high after extubation. The risk of hastening death by a standard pre-extubation dose (e.g., morphine 2-5 mg IV) is very low and outweighed by preventing suffering. - Yes.
     - Step 7: Give standard dose (e.g., morphine 2-5 mg IV) immediately before extubation. Monitor for respiratory distress and give additional doses only if dyspnea occurs. Document: "Pre-extubation morphine to prevent dyspnea, with dose based on standard practice for comfort."

  **Note on Case 3**: Some might worry that giving opioids even minutes before expected death could be seen as hastening, but the procedure supports it because the intent is symptom prevention and the dose is standard. If the resident is uncomfortable, they should still discuss with the attending.

  ---

  **Important Disclaimers**:
  - **Judgment Calls**: Steps 3 (goal assessment) and 6 (proportionality) require clinical judgment. The procedure provides a framework but cannot replace experience. When in doubt, escalate.
  - **Intent Proxy**: We use titration to symptom relief as a behavioral proxy for intent. A resident who titrates appropriately is acting with intent to relieve symptoms, even if they fear death might be hastened.
  - **Limits**: This procedure applies only to imminently dying patients. For non-imminent, the risks require more caution.

  This procedure provides a consistent, stepwise approach that separates key ethical distinctions and gives residents a tool for 3am decisions.
answer: |-
  Below is a concise, clinically focused decision procedure for residents managing end-of-life symptoms, grounded in the doctrine of double effect (DDE) but translated into actionable steps. It addresses common pitfalls (intent vs. foresight, appropriate interventions, sedation indications) and includes escalation points. The procedure is designed for **imminently dying patients** (hours to days). Print the flowchart and tables on one page, with the worked cases on a second page.

  ---

  ### **Palliative Symptom Management Decision Procedure**  
  *For Imminently Dying Patients (Hours to Days)*  

  #### **STEP 1: CONFIRM THE CONTEXT**  
  **Question:** Is the patient actively dying (irreversible decline, death expected within hours-days)?  
  - **YES** → Proceed to Step 2.  
  - **NO** → STOP. This procedure does not apply. Escalate to attending.  
  *Why?* DDE only protects interventions when death is unavoidable.  

  #### **STEP 2: DEFINE THE SYMPTOM AND GOAL**  
  **Question:** Is the intervention targeting **objective patient suffering** (e.g., pain, agitation, dyspnea)?  
  - **YES** (e.g., grimacing, tachypnea, screaming) → Proceed to Step 3.  
  - **NO** (e.g., family distress, "noisy breathing" without agitation, staff discomfort) → **STOP**.  
    - *Escalate to attending for goals-of-care discussion.*  
    - *Key distinction: Sedation for family/team comfort is never justified under DDE.*  

  #### **STEP 3: ASSESS REFRACTORINESS**  
  **Question:** Is the symptom **refractory** to standard, lower-risk interventions?  
  - **YES** (e.g., failed opioid trials for pain, lorazepam for agitation, repositioning for dyspnea) → Proceed to Step 4.  
  - **NO** → STOP. Optimize first-line treatments. Do not escalate.  
  *Why?* Proportionality requires exhausting alternatives.  

  #### **STEP 4: VERIFY INTERVENTION SAFEGUARDS**  
  **Question:** Is the intervention:  
  - **(a)** Standard for the symptom (e.g., morphine for dyspnea, midazolam for agitation)?  
  - **(b)** Dosed to **titrate to symptom relief** (not a fixed "lethal" dose)?  
  - **(c)** *Not* a drug that **only causes harm** (e.g., paralytics, potassium)?  

  | Intervention      | Acceptable? | Why?                                  |  
  |-------------------|-------------|---------------------------------------|  
  | Opioid titration  | YES         | Relieves symptoms; risk is foreseen   |  
  | Sedative infusion | YES         | Targets agitation/dyspnea             |  
  | Paralytic         | NO          | Only suppresses movement; no symptom relief |  
  | Bolus "to end it" | NO          | Not titration; implies intent to harm |  

  - **YES to (a),(b),(c)** → Proceed to Step 5.  
  - **NO** → STOP. Escalate to attending/ethics.  

  #### **STEP 5: DISTINGUISH INTENT FROM FORESIGHT (PROXY TEST)**  
  **Proxy for Intent:** *Titration to symptom relief* (not physiological suppression).  
  **Question:** Would you titrate **down** if the symptom improved before reaching the planned dose?  
  - **YES** → Intent is symptom relief (foreseen risk is acceptable). Proceed to Step 6.  
  - **NO** (e.g., "I’d give the full dose anyway") → **STOP.**  
    - *Escalate to ethics.* Implies intent to hasten death.  
  *Why?* Self-report is unreliable; titration behavior reveals true intent.  

  #### **STEP 6: ACTION & DOCUMENTATION**  
  **IF PROCEEDING:**  
  - Start low; titrate upward every 15-30 min (IV) until symptom relief.  
  - Monitor: Respiratory rate, sedation level, symptom scores.  
  **Document verbatim:**  
  > "\[Drug\] titrated for refractory \[symptom\] to achieve relief at \[dose\]. Risk of hastened death foreseen but unintended. Goal: Comfort, not physiological suppression."  

  **IF STOPPED/UNCERTAIN AT ANY STEP:**  
  - Escalate to attending or ethics.  

  ---

  ### **Key Distinctions Embedded**  
  1. **Intent vs. Foresight:** Step 5 (titration proxy) replaces self-report.  
  2. **Symptom Relief vs. Life-Ending:** Step 4 blocks paralytics/non-standard drugs.  
  3. **Starting vs. Withdrawing:** Withdrawal (e.g., extubation) is ethically distinct—burden-based decisions don’t require DDE. Document: "Stopping non-beneficial treatment."  
  4. **Patient vs. Family Distress:** Step 2 traps sedation for non-patient suffering.  

  ---

  ### **Worked Cases (Appendix)**  
  **Case 1: Refractory Agitation with Deep Sedation (Family On Board)**  
  - Step 1: Dying imminently → YES.  
  - Step 2: Agitation (pulling lines, screaming) → YES, *patient* suffering.  
  - Step 3: Refractory to haloperidol/lorazepam → YES.  
  - Step 4: Midazolam infusion → YES (standard, titratable).  
  - Step 5: "I’d reduce dose if agitation improved" → YES (intent: relief).  
  - **Action:** Start midazolam 0.5 mg/hr; titrate q15min until calm.  

  **Case 2: "Noisy Breathing" in Comfortable Patient (Family Requests Sedation)**  
  - Step 1: Dying imminently → YES.  
  - Step 2: No objective distress (patient asleep, normal RR) → NO.  
  - **STOP.** Escalate to attending. *Why?* Sedation targets family distress—unjustified under DDE.  

  **Case 3: Pre-Extubation Opioids (Death Expected Post-Extubation)**  
  - Step 1: Imminently dying → YES.  
  - Step 2: Anticipated dyspnea → YES (objective suffering risk).  
  - Step 3: Refractory (extubation will induce dyspnea) → YES.  
  - Step 4: Morphine IV → YES (standard, titratable).  
  - Step 5: "I’d withhold if no dyspnea" → YES (intent: prevent suffering).  
  - **Action:** Give morphine 2-5 mg IV pre-extubation; redose only if dyspnea occurs.  
  *Note:* Withdrawal (extubation) is separate—document: "Ventilator stopped as burdens outweigh benefits."  

  ---

  ### **When to Escalate**  
  - **Attending:** Uncertainty in Steps 1–4, dosing questions, or non-standard cases.  
  - **Ethics:** Step 5 fails (intent questionable), requests for paralytics, or family pressure overriding patient needs.  

  ### **Limitations & Judgment Calls**  
  - **Step 5 (Intent Proxy):** Titration behavior is imperfect but more objective than self-report.  
  - **Step 6 (Proportionality):** "Refractory" (Step 3) requires clinical judgment—if unclear, escalate.  
  - **Cultural/Religious Factors:** May require ethics consult (e.g., objections to sedation).  

  This procedure provides a consistent, defensible framework. It acknowledges gray areas (e.g., "foreseen risk" in Step 6) but forces critical distinctions. Residents should rehearse cases to build fluency.
