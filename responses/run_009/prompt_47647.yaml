  2) The critical feature is the hard institutional deadline. Remove that, and you're back to standard cluelessness where both near/far futures are murky.
  3) A cluelessness defender would counter that unknown near-term harms (like access inequities during high-price phases) still distort value comparisons - but the institutional inevitability creates a rare upper-bound certainty.

  Hmm... maybe add that even if competitors delay entry, the 20-year cliff remains absolute. That strengthens the inevitability argument. Should also emphasize how this differs from typical chaotic systems - legal frameworks create predictable basins of attraction.

