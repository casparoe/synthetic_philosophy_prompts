prompt: |-
  Take the case of Han van Meegeren's forged Vermeers — in particular the Supper at Emmaus, which a leading Dutch connoisseur pronounced genuine in the late 1930s and which was exhibited to public acclaim as revealing an unexpected religious side of Vermeer's oeuvre — and analyze it through the philosophy of originals and forgeries. Two positions to bring to bear: the view that a forgery's unmasking cannot change the work's intrinsic visual properties, and so cannot change its aesthetic value, only our non-aesthetic, art-historical judgments about it; and the rival view that a painting's aesthetic properties are partly relational — that a picture is a communicative act by a particular artist, so a forgery literally presents different content from the original it pretends to be. Map the case onto both carefully: who was deceived, about what exactly, and whether the painting's admirers were admiring a Vermeer, a van Meegeren, or neither. Then say what the episode adds that armchair examples of perfect duplicates cannot: these forgeries were not visually identical to any real Vermeer, were praised partly because they seemed to enlarge our sense of what Vermeer was capable of, and were exposed only when the forger confessed to save himself from a worse charge. Does this asymmetry — that the works' reception depended on a false attribution that was bound to be revised — support the intrinsic-property view or undermine it? Where is each position silent about a case in which the fake is not a copy of anything?
reasoning: |-
  Okay, the user wants an analysis of Han van Meegeren's forgeries through the lens of philosophy about originals and forgeries. Specifically, they mention two philosophical positions: one that says aesthetic value is intrinsic and doesn't change with attribution, and the other that says aesthetic properties are relational to the artist's intent. They also want the case mapped onto both views, explaining who was deceived and what the admirers were actually admiring.

  First, I need to recall the key points of the Supper at Emmaus case. Van Meegeren created a fake Vermeer that was accepted as genuine by experts. It was praised for showing a religious side of Vermeer that wasn't previously known. The deception was uncovered when van Meegeren confessed to avoid treason charges. The forgery wasn't a copy of an existing Vermeer but an original work in Vermeer's style.

  Now, looking at the two philosophical positions. The intrinsic view argues that the physical properties don't change, so aesthetic value remains the same regardless of attribution. The relational view says the artist's identity and intent are part of the artwork's content, so a forgery presents different content even if it looks similar.

  Applying the case to both views. For the intrinsic view, the admirers were appreciating the visual properties, which remained constant after the forgery was revealed. Their judgment was based on non-aesthetic factors like the historical context. For the relational view, the audience thought they were engaging with Vermeer's communicative act, so when it was revealed as a forgery, the content changed entirely. They were deceived about the artist's identity and intent.

  The user asks what this case adds that hypothetical perfect duplicates don't. Here, the forgery wasn't a copy but an original pastiche, praised for expanding Vermeer's oeuvre. The asymmetry is that the reception depended entirely on the false attribution, which was later corrected. The confession revealed the deception, but the work itself didn't change.

  Does this asymmetry support or undermine the intrinsic view? The fact that the work was praised for its supposed expansion of Vermeer's capabilities shows that the initial admiration was tied to Vermeer's identity. Once the true creator was known, the aesthetic perception shifted, which might support the relational view. However, the intrinsic view could argue that the visual experience is unchanged, but the case highlights how non-aesthetic factors influence reception.

  Where are the positions silent? Both views might not fully address forgeries that aren't copies. The intrinsic view focuses on physical properties, but here the forgery's value was in its perceived place in art history. The relational view emphasizes artist identity, which explains the shift in perception when the true creator is known.

  The user also wants to know what admirers were admiring. Were they admiring Vermeer, van Meegeren, or neither? This ties into the relational view—they thought they were admiring Vermeer, but after the reveal, the object of admiration changed. Some might still find aesthetic value, but the context alters the experience.

  The key takeaway is that this case shows how attribution affects aesthetic judgment in ways that perfect duplicates can't. The forgery's reception was built on a false narrative that was integral to its appreciation, supporting the relational view. Yet, the intrinsic view holds that the sensory experience remains, even if contextual factors change.
answer: |-
  The Han van Meegeren case is a profound philosophical crucible for examining the nature of originality, forgery, and aesthetic value. Applying the two core positions to the *Supper at Emmaus* reveals deep tensions in how we understand art.

  **Mapping the Case onto the Two Positions:**

  1.  **The Intrinsic Property View (Aesthetic Value is Non-Relational):**
      *   **Who was deceived & about what?** Experts (like Abraham Bredius) and the public were deceived about the *provenance* and *authorship* of the painting. They falsely believed it was created by Johannes Vermeer in the 17th century, not by Han van Meegeren in the 1930s.
      *   **What were admirers admiring?** According to this view, the admirers were directly responding to the painting's *intrinsic visual properties* – its composition, color, light, brushwork (as they perceived it), subject matter, and emotional impact. The physical object and its sensory qualities haven't changed since the unveiling. Therefore, they were admiring *those specific visual qualities* presented on the canvas. The revelation that it was by van Meegeren doesn't change those qualities; it only changes the *historical narrative* surrounding them. The painting might now evoke different *associations* (cunning, deception, modern technique), but its core aesthetic merit, based purely on looking, remains constant. The admirers were aesthetically appreciating a set of visual properties, *mistakenly* attributing them to Vermeer's genius, but the appreciation itself was directed at the object's perceptible features.
      *   **Admiring Vermeer, van Meegeren, or Neither?** They were admiring the visual object before them, which happens to be a van Meegeren. Their *thoughts* were *about* Vermeer, but their *aesthetic experience* was generated by the canvas's intrinsic properties.

  2.  **The Relational/Communicative View (Aesthetic Properties are Partly Relational):**
      *   **Who was deceived & about what?** Beyond provenance and authorship, the audience was deceived about the *fundamental nature of the communicative act*. They believed they were engaging with Vermeer's artistic vision, his choices within the context of 17th-century Dutch art, his personal exploration of religious themes, and his unique artistic development. They were deceived about the *artist's intention and historical situatedness*.
      *   **What were admirers admiring?** Admirers were not just appreciating visual qualities; they were interpreting a *message* they believed came from Vermeer. The painting's meaning was constituted *relationally*: Vermeer (the artist) communicating (the act) a specific religious sensibility (the content) using his characteristic style within his historical context (the relationship). The significance of the "unexpected religious side" was entirely dependent on it being *Vermeer's*. A van Meegeren painting the same image carries utterly different meaning: it becomes a pastiche, a deception, a commentary on art history (intentionally or not), or perhaps a cynical act by a mediocre artist. The *content* changed because the *agent* and *context* of the communication changed. The admirers were aesthetically appreciating what they believed was *Vermeer's genius expanding in a new direction*.
      *   **Admiring Vermeer, van Meegeren, or Neither?** They *intended* to admire Vermeer and genuinely believed they *were* admiring Vermeer's work. However, since the communication was fundamentally fraudulent, they were actually admiring *a fiction*, a simulacrum of Vermeer conjured by van Meegeren. They weren't truly admiring the *actual* van Meegeren (whose artistic identity was hidden and whose genuine style was different), nor were they admiring Vermeer (who had no connection to the work). They were admiring a phantom.

  **What the van Meegeren Case Adds Beyond Armchair Duplicates:**

  Armchair examples often involve *perfect* duplicates indistinguishable even to experts. Van Meegeren's forgeries were *not*:

  1.  **Not Visually Identical:** They weren't copies of existing Vermeers but *original pastiches*. They incorporated stylistic elements from Vermeer's *known* works but applied to new subjects and infused with anachronistic techniques (e.g., Bakelite resin, 20th-century stylistic borrowings). Modern eyes often find them clumsy or inauthentic.
  2.  **Praised for Expanding Vermeer's Oeuvre:** Crucially, their value *depended* on the false attribution. They were praised *because* they seemed to fill a gap, showing a "religious phase" or connection to Italian masters that *changed the understanding of Vermeer himself*. The aesthetic judgment was inextricably linked to the relational context – *this* is what Vermeer could do.
  3.  **Exposed by Confession, Not Visual Analysis:** The deception wasn't uncovered by suddenly noticing a flaw in the painting itself (though cracks appeared later); it was exposed when the forger confessed to avoid a treason charge. This highlights that the *belief* in the attribution was the scaffold holding up the entire aesthetic edifice.

  **The Asymmetry and its Philosophical Implications:**

  The key asymmetry is that the work's *initial positive reception was entirely contingent on the false attribution*, which was *inherently unstable* and *ultimately corrected*. This asymmetry:

  *   **Strongly Undermines the Intrinsic Property View:** The case demonstrates that the *specific* aesthetic qualities admired – the "unexpected religious side," the "new depth," the "expansion of Vermeer's genius" – were *not* intrinsic properties of the canvas. They were *emergent properties* arising *only* from the relational context of believing it was by Vermeer. Once the true authorship was known, those specific admired qualities vanished. The painting didn't just lose historical value; its perceived *meaning* and *aesthetic significance* collapsed. Its visual properties remained, but the *interpretation* and *value derived* from them shifted dramatically (e.g., from "profound religious exploration" to "clever but flawed imitation"). The intrinsic view struggles to explain why the *same* visual properties suddenly ceased to convey the same aesthetic content.
  *   **Supports the Relational View:** This view readily explains the collapse. The aesthetic properties *were* relational. Changing the artist (from Vermeer to van Meegeren) and the context (from 17th-century innovation to 20th-century forgery) fundamentally changed the nature of the communicative act and thus the aesthetic content. The admiration was always for a *relationship* (Vermeer-expressing-X), and when the relationship was proven false, the object of that admiration disappeared. The painting now communicates van Meegeren's deception, not Vermeer's spirituality.

  **Where the Positions are Silent (Non-Copy Forgeries):**

  Both views primarily grapple with forgeries in relation to originals. Van Meegeren's *Supper at Emmaus* wasn't a copy; it was an *original fake* – a new composition in the style of Vermeer.

  *   **Intrinsic Property View:** This view remains largely unchanged. It focuses solely on the object's visual properties, regardless of whether it copies an existing work or invents a new one. Its silence is consistent: only the physical properties matter for aesthetic value.
  *   **Relational/Communicative View:** This view provides a *more* compelling explanation for non-copy forgeries like van Meegeren's. Precisely because it wasn't a copy, its *entire* meaning and value were constructed *relationally* through the false attribution. The painting's significance relied entirely on its perceived place within Vermeer's *oeuvre* and artistic development. Without the attribution, it loses its specific raison d'être. The relational view highlights that a forgery like this isn't just misattributed; it's an *inherently parasitic* object whose aesthetic content is *defined* by the deception. Its "originality" as a new composition is negated by its dependence on the false identity.

  **Conclusion:**

  The van Meegeren episode powerfully demonstrates that aesthetic experience is not merely a response to sensory input but is deeply contextual and relational. The dramatic shift in the *Supper at Emmaus*'s perceived meaning and value upon the revelation of its true origin – from a revelatory masterpiece expanding Vermeer's legacy to an ingenious but ultimately fraudulent artifact – strongly favors the Relational/Communicative view. The intrinsic properties of the canvas remained constant, but the *aesthetic properties* – understood as emergent from the artist's communicative act within a specific historical context – underwent a radical transformation. The case shows that for non-copy forgeries, the false attribution is not merely an external fact about the work; it is constitutive of the specific aesthetic content that is initially admired. When the scaffolding of false belief is removed, that particular content collapses.
