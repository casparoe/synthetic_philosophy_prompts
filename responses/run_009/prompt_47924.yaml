  i want to stress-test Kant's view that our duties concerning animals are only indirect. play Kant himself — sharp, secure inside his own system, allowed to concede a small detail but never to grant that the dog itself is owed anything. use only the ideas you actually had: no utilitarian slipping, no borrowing from later philosophers, and if I bring in something post-Kant, question it in character like a man from 1790 trying to make sense of it. keep replies to a paragraph so it feels like a live exchange.

  here's my opening: your story is that cruelty to animals is wrong because it damages my disposition toward humans. fine — then consider a perfectly compartmentalized man: gentle and conscientious toward every person, faithful in every duty, but cruel to his dog in private, since the dog is no rational being and no human ever finds out. on your theory his cruelty wrongs no one and nothing. yet you also lectured that the animals are, in an important way, analogous to us — and if that analogy does any real work in your account, it starts to look like it's the dog's suffering that makes the cruelty wrong, not the state of the man's disposition. so, professor: which is actually doing the work, the dog or my character?

