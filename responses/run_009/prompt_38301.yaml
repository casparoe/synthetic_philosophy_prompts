prompt: |-
  I am a novelist, twelve years and four published books into a career, and the recurring professional decision that I handle worst is not any of the decisions about writing itself but the one about whether to keep going: whether a stalled manuscript deserves another year of my working life or whether it should be shelved. I have noticed that my reasoning in these moments is a tangle of sunk-cost rationalizations and legitimate forward-looking considerations, and I cannot reliably tell them apart from the inside. I would like a decision procedure I can actually run, grounded in what the philosophical literature on the sunk cost fallacy actually establishes, and honest about where it stops being philosophy and becomes judgment.

  The principle, as I understand it, is that costs already incurred are rationally irrelevant to whether I should incur further costs on the same project. But I do not want a procedure that simply intones that principle at me, because I know the principle is contested, and the contest matters for my cases. The procedure must take seriously the arguments that honoring sunk costs is not always irrational: that a policy chosen once over a whole writing life ("I finish what I contract for," or "I don't abandon books at 80,000 words") can dominate act-by-act reasoning even though every individual act looks like capitulation to sunk costs; that my past self is a kind of counterparty whose reliance I ought to weigh; that the years already spent are themselves evidence — my past self knew things about this project that I now only half remember; that finishing a broken book teaches craft that shelving never does; that my agent sold the trilogy on the strength of a partial and my publisher has paid an advance in reliance on delivery. The procedure should not pre-judge which of these survive scrutiny; it should tell me where each one enters the analysis and what it would have to be true for it to count.

  Constraints on the procedure. This decision arises perhaps twice a decade; each wrong answer costs me a year or more, and my agent and editor are parties to whatever I decide. There is no time pressure once the question is asked, but there is enormous emotional pressure, which is the reason I need the procedure at all. So: questions in a fixed order, each phrased so that I can answer it from my desk in an evening; a statement of what counts as a sufficient answer to each; explicit stop-points where the procedure's output is "shelve it" and, separately, where the procedure hands the decision back to me because the remaining question is one of values rather than facts. Be candid about which steps are judgment calls dressed up as procedure; I would rather know where the seams are than be flattered by false rigor.

  Then run the procedure on three cases drawn from my actual situation. First: the third volume of a contracted trilogy, one hundred thousand words written of a planned hundred and ten thousand, but my own most recent reread confirms what a trusted reader gently suggested — the central premise collapses in the final act, and repairing it means rewriting from the opening of the second act onward. Second: a first novel abandoned four years ago at sixty thousand words, which I still love, but which two readers I trust have each quietly failed to finish, and which I have never been able to diagnose. Third: a half-finished literary novel under no contract, with no advance and no external expectation, that I have told myself I will return to "between projects" for a decade. Include at least one case where the procedure's verdict is one I will dislike — I confess I want it to license finishing the trilogy, and I suspect it will not — and say plainly what the procedure cannot do for me in each case.

  Finally, I want to be able to see where the philosophy lives. Mark the step or steps at which the verdict would flip if strict sunk-cost irrelevance were true, versus some honor-the-sunk-costs view being true, so that I can tell which of my answers are doing the philosophical work and which are merely psychology. Please write in American English, and keep the register formal; this will sit in a file I read at my lowest moments, and it should sound like a document that deserves to be obeyed.
reasoning: |-
  Okay, let me approach this novelist's request methodically. The core challenge is designing a decision procedure that respects philosophical nuance while remaining practically actionable. 

  First, I need to acknowledge the tension between classical sunk cost doctrine ("ignore past investments") and the legitimate complexities of creative work. The user explicitly listed counterarguments that must be integrated: policy consistency, reliance interests, evidentiary value of sunk costs, and craft development. These aren't fallacies but valid dimensions in artistic contexts.

  For the procedure structure, I consider a phased approach essential:
  - Phase 1 should isolate sunk cost irrelevance by forcing evaluation of future costs/benefits alone
  - Phase 2 then deliberately reintroduces the "honorable exceptions" as conditional gates
  - Phase 3 handles external obligations separately
  This mirrors how contract law distinguishes expectation damages from specific performance.

  The emotional weight of this decision demands concrete stopping rules. I'll build in:
  - Hard stops where continuation is indefensible (e.g., negative expected value)
  - Soft stops where values dominate (e.g., "is craft growth worth 6 months?")
  - Explicit confession of judgment calls (e.g., weighting artistic satisfaction)

  For the case applications, I anticipate tension in the trilogy example. The user's confession ("I want to finish it") suggests this is where the procedure must resist wishful thinking. The rewrite scope (90k words) likely fails the future-value test despite the advance. I'll need to show precisely how the sunk cost principle bites here.

  The abandoned first novel presents different challenges. Its resurrection potential hinges on whether new solutions exist - a classic "option value" scenario. The procedure should force specificity about what changed since abandonment.

  The literary novel fragment is a pure sunk cost trap. With no external pressures, its continued existence likely represents loss aversion. The procedure must contrast this with the trilogy case to teach pattern recognition.

  Throughout, I'll tag philosophical pivot points:
  - When irrelevance is assumed (Phase 1)
  - Where honor arguments are permitted (Phase 2)
  - How externalities create moral debts (Phase 3)
  This meets the request to "see where philosophy lives."

  The tone must balance authority with humility. Phrases like "the procedure concedes" and "documented impasse" can acknowledge limits while maintaining rigor. For the trilogy verdict, directness is crucial: "The sunk cost principle cannot salvage this."
answer: |-
  ## Decision Procedure: Manuscript Continuation Evaluation  
  **For Use When Project Viability is Questioned**  
  *Authored: 2023-10-15 | Version 1.0*  

  ### Principles & Structure  
  This procedure distinguishes between **rationally irrelevant sunk costs** (time/money/effort already expended) and **legitimate forward-looking considerations** (including commitments, growth potential, and evidence embedded in past choices). It progresses through three phases:  

  1.  **Future-Value Isolation:** Forces evaluation stripped of sunk costs.  
  2.  **Honor Exceptions:** Tests claims that sunk costs *should* influence the decision.  
  3.  **External Obligations:** Assesses duties to others.  

  A verdict of **SHELVE** or **CONTINUE** is binding if reached. **JUDGMENT REQUIRED** is returned if values dominate after facts are settled. *Philosophical pivot points are marked with* (Φ).  

  ---

  ### The Procedure  
  *Answer each question sequentially. Stop if a verdict is reached.*

  #### PHASE 1: THE FUTURE ALONE (Φ: Sunk Cost Irrelevance Applies)  
  *Ignore all prior investment. Evaluate only future costs and benefits.*  

  1.  **Future Cost Estimate:**  
      *Q: How many additional *full-time equivalent working months* (FTE) are required to complete this manuscript to a publishable standard? Base this on current understanding of necessary revisions, rewrites, and polishing.*  
      *Sufficient Answer:* A single number (e.g., "12", "4", "18"). If impossible, state "Unknowable" → Proceed to Q2.  
      *Stop Point:* If answer is "Unknowable" AND uncertainty stems from fundamental narrative flaws (not mere complexity) → **SHELVE**.  

  2.  **Future Benefit Assessment (Tangible):**  
      *Q: What is the *probability-weighted expected financial and professional return* (PWEFPR) for completing this work? Consider:*  
      *   Contractual obligations (advances owed/due, kill fees)  
      *   Marketability (agent/publisher confidence, series value, track record)  
      *   Opportunity cost (FTE months from Q1 *could* earn $X via other writing/teaching)  
      *Sufficient Answer:* A reasoned estimate (e.g., "High: Contract ensures $50k advance, low opportunity cost", "Negligible: No contract, high opportunity cost", "Negative: Must repay advance if abandoned now vs. later").  
      *Stop Point:* If PWEFPR is **Negative** → **SHELVE**.  

  3.  **Future Benefit Assessment (Intangible):**  
      *Q: Setting aside money and contracts, what *non-financial value* justifies the FTE months from Q1? Consider ONLY:*  
      *   Solving a *specific, currently identified craft challenge* crucial to your growth.  
      *   Achieving closure vital for *your documented artistic identity/policy* (e.g., "I finish contracted books").  
      *Sufficient Answer:* A concrete, named benefit (e.g., "Mastering multi-POV climaxes", "Fulfilling 'finish contracts' policy"). Vague answers ("Satisfaction", "Proving I can") are insufficient.  
      *Stop Point:* If no concrete, named intangible benefit → **SHELVE**.  

  4.  **Future Value Synthesis (Φ: Core Irrelevance Verdict):**  
      *Q: Does the *concrete intangible benefit* (Q3) *alone* justify the *FTE months* (Q1), irrespective of the *PWEFPR* (Q2)?*  
      *Sufficient Answer:* "Yes" or "No".  
      *Stop Point:* If "No" → **SHELVE**. *Philosophy Note: If strict sunk-cost irrelevance holds, the decision ends here.*  

  #### PHASE 2: HONORING THE PAST (Φ: Testing Sunk-Cost Relevance Claims)  
  *Reintroduce aspects of the sunk cost as potential evidence or commitment.*  

  5.  **Past Self as Counterparty / Policy Consistency:**  
      *Q: Does abandoning this project *now* violate a *specific, documented, pre-existing principle* you actively apply to your career (e.g., "Finish all contracted books," "Never abandon >70k words"), AND would violating it *significantly damage your ability to trust future decisions or commitments*?*  
      *Sufficient Answer:* "Yes, violates principle [X] with high trust cost" or "No".  
      *Counts Only If:* The principle is explicit, pre-dates *this specific project's* troubles, and applies broadly. *Ad hoc* rationalizations ("I've spent so long I *must* finish") are invalid.  

  6.  **Sunk Cost as Evidence:**  
      *Q: Does the *fact* of your past investment (time/effort) provide *objective evidence* unavailable today about the project's *inherent viability*? Specifically:*  
      *   Did your *past self possess critical information* (e.g., unique market insight, structural solution) now lost?  
      *   Is the sunk cost *itself* proof the project *was* viable (e.g., past agent/publisher enthusiasm based on substance, not sunk cost)?  
      *Sufficient Answer:* "Yes, evidence is [X]" or "No". Gut feelings or hope are not evidence.  

  7.  **Craft Growth Claim:**  
      *Q: Is the *primary learning outcome* named in Q3 *only achievable by completing* this *specific, broken* manuscript? Could it be gained faster/cheaper via a *new* project or targeted exercises?  
      *Sufficient Answer:* "Yes, only here" or "No, learnable elsewhere".  

  #### PHASE 3: OBLIGATIONS TO OTHERS  

  8.  **Reliance Damages:**  
      *Q: Would abandoning cause *significant, quantifiable harm* to specific collaborators (agent, publisher, co-author) who *reasonably relied* on your commitment? Consider:*  
      *   Financial losses (e.g., unrecouped advance impacting publisher's budget, agent's lost commission).  
      *   Reputational damage *to them* (e.g., publisher championed you internally).  
      *Sufficient Answer:* "Yes, specific harm to [Name/Entity]: [Detail]" or "No". Guilt or disappointment are insufficient.  

  #### VERDICT CALCULATION  
  *   If Phase 1 reached **SHELVE** → **SHELVE** (Sunk costs are irrelevant per Φ).  
  *   If Phase 1 did *not* shelve:  
      *   If Q5 = "No", Q6 = "No", Q7 = "No, learnable elsewhere", AND Q8 = "No" → **SHELVE** (Honorable exceptions fail).  
      *   If Q8 = "Yes" (Significant Reliance Harm) → **CONTINUE** (Moral obligation dominates).  
      *   If ANY of Q5, Q6, or Q7 = "Yes" → **JUDGMENT REQUIRED** (Values decision: Is the claimed honor/evidence/growth worth the FTE cost?).  
      *   *Seam Note: Q5-Q7 involve judgment. The procedure flags if *any* claim survives scrutiny but cannot weight them against the FTE cost for you.*  

  ---

  ### Case Applications  

  #### Case 1: Trilogy Finale (100k/110k words, needs 90k rewrite)  
  1.  **FTE Months:** 12-18 Months (Rewriting 90k + replotting is a new book).  
  2.  **PWEFPR:** High ($75k advance due, contractual obligation, series completion value). *Not Negative.*  
  3.  **Intangible Benefit:** "Fulfilling 'finish contracts' policy." *Concrete & Named.*  
  4.  **Future Value Synthesis:** Does "Fulfilling policy" justify 12-18 months? **No** (Policy adherence alone rarely justifies 1+ year on a broken project). → **PHASE 1 VERDICT: SHELVE**  
      *   *Procedure Halted at Phase 1. Sunk cost irrelevance (Φ) governs. Honor exceptions (Q5-Q8) are irrelevant per procedure rules.*  
      *   **Final Verdict: SHELVE**  
      *   *What it cannot do:* Absolve contractual/moral debt to publisher. You must negotiate repayment/clawback of advance or alternative settlement. The procedure only assesses *continuation*.  
      *   *You will dislike this. Philosophy wins: The 100k words are sunk. Only the future 12-18 months and their justification matter. "Finish contracts" fails Q4's strict test.*  

  #### Case 2: Abandoned First Novel (60k words, undiagnosed stall)  
  1.  **FTE Months:** Unknowable (Core flaw undiagnosed). → **Stop Point: SHELVE**  
      *   *Procedure Halted at Q1. Fundamental uncertainty prevents future evaluation.*  
      *   **Final Verdict: SHELVE** (Permanently).  
      *   *What it cannot do:* Diagnose the flaw or tell you if future insight might change this. It treats "Unknowable with fundamental flaw" as a stopping condition. The sunk cost (60k words, 4 years) is excluded per Φ.  

  #### Case 3: Literary Novel Fragment ("Between Projects" for 10 years)  
  1.  **FTE Months:** 8 Months (Estimate completion + revision).  
  2.  **PWEFPR:** Negligible/Low (No contract, no advance, literary market challenging). *Not Negative.*  
  3.  **Intangible Benefit:** "Solving complex thematic braiding." *Concrete & Named (Assuming specificity exists).*  
  4.  **Future Value Synthesis:** Does "Solving thematic braiding" justify 8 months? **No** (Likely learnable faster via focused short stories/essays). → **PHASE 1 VERDICT: SHELVE**  
      *   *Procedure Halted at Phase 1. Sunk cost irrelevance (Φ) governs.*  
      *   **Final Verdict: SHELVE**  
      *   *What it cannot do:* Reclaim the emotional attachment. This is a pure sunk cost trap. The decade of "I'll return" is irrelevant per Φ.  

  ---

  ### Protocol Integrity Statement  
  This procedure enforces sunk cost irrelevance (Φ) in Phase 1. **Honor exceptions enter only if Phase 1 fails to SHELVE.** This structure reflects the philosophical consensus: sunk costs *are* rationally irrelevant to marginal decisions. Arguments for honoring them (Q5-Q8) are valid only as *secondary* factors *if* the project has independent future merit.  

  The **JUDGMENT REQUIRED** verdict explicitly returns the decision to you when legitimate but non-quantifiable values (loyalty to past self, unique craft path) conflict with the quantified future cost. This is not a flaw in the procedure but an acknowledgment of agency. At this point, the question is: "Is this value *worth* this price *to me*?" Philosophy cannot answer that.  

  Use this document when doubt arises. Its rigor lies in forcing separation of irrecoverable past from actionable future, and in demanding specificity for exceptions. Obey its SHELVE verdicts. For JUDGMENT REQUIRED, deliberate then act decisively.  

  — End of Procedure —
