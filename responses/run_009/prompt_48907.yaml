  We are designing an in-class prediction market activity for a 90-minute session with 15 students. The goal is to illustrate logical uncertainty and computationally bounded rationality.

  Key elements:
  1. Contracts: A slate of 12-15 statements, including:
     - Some that are cheap to verify with pencil and paper (e.g., 2^40 > 10^12).
     - Some that require computation we run at the end or overnight (e.g., parity of the number of primes below 100,000; frequency of digit 7 vs. 3 in the first 10,000 digits of π).
     - Some empirical events (dice rolls, card draws) as controls.
     - At least one set of contracts that form a logical identity (e.g., A, B, and A∧B) so that if prices don't satisfy the probability axioms (like P(A∧B) = P(A)*P(B) for independent events, or for logical relations, such as if A and B are mutually exclusive and exhaustive, then P(A)+P(B)=1) then arbitrage is possible.

  2. Market structure:
     - We want continuous double auction or a market maker. Given the time and to ensure liquidity, we might use a market maker (the facilitator) who stands ready to buy and sell at posted prices. However, the initial prices set by the market maker might deliberately violate a logical identity to allow for arbitrage.

  3. Rules of trade:
     - Students are given play money (say, $1000 each).
     - They can buy and sell contracts. Each contract pays $1 if true, $0 if false.
     - Market maker posts bid and ask prices for each contract (initially set by the facilitator, but then updated based on trades? or we can have a simple mechanism).

  4. Timeline (90 minutes = 1 hour 30 minutes):
     - Introduction (10 min): Explain the rules, the concept of prediction markets, and the types of contracts. Emphasize that some are logical and some are empirical.
     - Trading phase (60 min): Students trade. The market maker (facilitator) is available to trade at the posted prices (but we might allow the market maker to adjust prices periodically?).
     - Resolution (15 min): For the easy-to-verify contracts, have students verify them on the spot. For the hard ones, we run the computation (or announce we will do so overnight). For empirical, we conduct the draws.
     - Debrief (15 min): Discuss what happened, connect to formal epistemology.

  5. Debrief topics:
     - Classical Bayesianism assumes logical omniscience: the agent knows all logical consequences. But here, students had to assign probabilities to statements they couldn't immediately verify.
     - Credences between 0 and 1 on a priori settled questions: under one reading, it violates the probability axioms because the truth value is already determined. But under bounded rationality, it's a reflection of limited computational resources.
     - The market illustrates that consistency (no arbitrage) is the achievable standard for a bounded reasoner. If a trader spots a logical inconsistency in prices (like the three contracts that form an arbitrage opportunity), they can lock in a profit without knowing the truth.

  6. Predictable problems and solutions:
     - Problem: Students race to compute the easy statements and then stop trading.
       Solution: Make sure there are enough hard ones that cannot be computed in class. Also, include the empirical ones which are not computable. Encourage trading by having the market maker update prices (so that if no one trades, the market maker might change prices to induce trading).

     - Problem: Liquidity dries up.
       Solution: The market maker provides continuous liquidity by being willing to trade at the posted bid and ask. We can also have periodic price adjustments by the market maker to reflect trading activity.

     - Problem: Anchoring on the first price.
       Solution: Start with a wide bid-ask spread and adjust based on trades. Also, have the market maker change prices if there are no trades for a while.

     - Problem: Students might not spot the arbitrage opportunity.
       Solution: Make the arbitrage opportunity fairly obvious (e.g., three contracts: A, B, and A∨B, and set prices so that P(A∨B) > P(A) + P(B) for mutually exclusive A and B). Alternatively, after some trading, if no one has exploited it, the facilitator can hint.

