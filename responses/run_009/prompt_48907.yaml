  - Minute 70-75: Stop trading. For the easy contracts (1,2,3) and the combinatorial ones (7,8) that we can compute quickly, we do so now. For the hard ones (4,5,6,11,12) we say we will compute overnight and post the results on the class website. For empirical (9,10) we conduct the dice roll and card draw.

    For contract 7: We say: straight flush count is 40? (True)
    For contract 8: We compute the arrangement: we have 7 consonants and 5 vowels. We do the math: 7! * [C(8,5) * (5!/(2!2!))] = 5040 * [56 * (120/4)] = 5040 * [56*30] = 5040 * 1680 = 8,467,200 < 10,000,000 -> False.

    For contract 9: Roll two dice. If sum=7, then true.
    For contract 10: Shuffle a deck and draw the top card. If heart, true.

    We record the outcomes.

  - Minute 75-85: Settlement. For the contracts that are resolved, we pay out. For the unresolved, we tell students we will update them via email.

  - Minute 85-90: Debrief.

  Debrief Topics:

  - Start by asking: "What was the most challenging part of pricing the contracts?" Then connect to logical uncertainty.

  - Point out the arbitrage opportunity in contracts 11 and 12: if someone bought both, they paid $0.80 and will get $1 back. Why is that? Because the prices did not reflect the logical fact that one of them must be true. In a perfectly rational market, the prices would have to satisfy P(X)+P(Y)=1. But because we are bounded, we might not immediately notice.

  - Classical Bayesianism requires that an agent assigns probability 1 to all tautologies and 0 to contradictions, and that the probabilities are coherent (no Dutch book). But here, we had to assign probabilities to statements we didn't know the truth value of, and we might have been incoherent.

  - How do we avoid being Dutch booked? We must adjust our prices to be coherent. The market did that over time? Or did it? (Note: we adjusted based on demand, but not necessarily to remove arbitrage.)

  - The lesson for bounded reasoners: we cannot require that our probabilities are coherent over all logically possible contracts (because we cannot compute all the logical relationships) but we can require that they are coherent with respect to the contracts actually traded. And if someone finds an arbitrage, they profit and that forces the prices to become coherent.

  - Also, note that for the hard contracts, we had to assign probabilities between 0 and 1 even though the truth is already determined (a priori). This reflects our lack of computational resources.

  What will go wrong:

  - Students might not trade at first, being shy. Solution: the market maker can announce: "I'm willing to trade! Come on up!" and encourage them. Also, having the arbitrage opportunity might get them started.

  - Students might spend the whole time trying to compute the hard ones. Solution: emphasize that they don't have to know the truth to trade, they can use their best guess. Also, the empirical ones are not computable.

  - Liquidity: if the market maker is the only counterparty, then there is always liquidity. But if we allow student-to-student trading, then liquidity might dry up. We are not allowing that, so the market maker provides liquidity.

  - Anchoring: the initial prices might anchor. Solution: the market maker adjusts prices periodically to reflect trades. Also, the arbitrage opportunity is deliberately mispriced to break the anchor for those contracts.

  - Not everyone might notice the arbitrage. Solution: if after 30 minutes no one has bought both X and Y, the market maker can make a general announcement: "Remember, sometimes contracts might be logically related." Or after the activity, point it out.

  - Time: 60 minutes trading might be long? We can shorten if needed.

  Limitations:

  - The activity has a fixed set of contracts. In reality, an agent must assign probabilities to an infinite set of logical statements.

  - The activity ends after 90 minutes, so there's no long-term updating. In reality, a bounded reasoner might update over time as they compute more.

  - The computations we do at the end are feasible. In reality, some problems are intractable.

  - The arbitrage opportunity is only for one logical relationship. In reality, there are many.

  - The market maker adjusts prices based on trades, which might not reflect logical discoveries. In reality, a reasoner might internally adjust their probabilities as they think.

  We hope the activity will give a visceral feel for the problem, and then the lecture can fill in the unbounded and long-term aspects.

  Implementation details:

  - We need a way to track each student's cash and holdings. We can use a spreadsheet or a ledger.

  - We need to compute the hard contracts: we can precompute the answers and keep them secret.

    For contract 4: primes below 100,000: 9592 -> even -> true.
    For contract 5: in π, we know 7:968, 3:964 -> true.
    For contract 6: 1000th prime: 7919 -> odd -> false.
    For contract 11: same as 4 -> true.
    For contract 12: false.

  - For the letter arrangement: we did the math above: 8,467,200 -> false.

  Let's run the activity accordingly.
answer: |-
  ### Prediction Market Activity: Logical Uncertainty in Practice  
  **Objective:** Make students experience the challenge of assigning probabilities to statements with unknown truth values, especially logical/mathematical ones, and understand how bounded rationality affects rational pricing.

  ---

  ### **Contract Slate (12 Statements)**  
  Choose contracts where computational cost to verify ≠ difficulty of initial pricing. Mix:  
  1. **Easy Arithmetic (Pencil & Paper Verifiable):**  
     - A1: \(2^{40} > 10^{12}\) (True: \(1,099,511,627,776 > 1,000,000,000,000\))  
     - A2: \(3^{15} > 14,000,000\) (True: \(14,348,907\))  
     - A3: \(1 + 2 + \dots + 100 = 5050\) (True)  

  2. **Hard Arithmetic (Overnight Verification):**  
     - B1: The number of primes below 100,000 is even. (True: 9,592)  
     - B2: In the first 10,000 digits of π, digit 7 appears more often than digit 3. (True: 968 vs. 964)  
     - B3: The 1,000th prime number is even. (False: 7,919)  

  3. **Combinatorial (Overnight Verification):**  
     - C1: The number of straight flushes in poker (excluding royal flushes) is 36. (False: 40 total, so 36 non-royal)  
     - C2: The number of ways to arrange "EPISTEMOLOGY" with no adjacent vowels is > 10,000,000. (False: 8,467,200)  

  4. **Empirical Control (Resolved Live):**  
     - D1: The sum of two rolled dice is 7. (Chance: \(\frac{1}{6}\))  
     - D2: A drawn card from a shuffled deck is a heart. (Chance: \(\frac{1}{4}\))  

  5. **Arbitrage Set (Deliberate Mispricing):**  
     - E1: The digit sum of \(2^{30}\) is even. (True: \(1,073,741,824 → 1+0+7+3+7+4+1+8+2+4 = 37\), odd)  
     - E2: \(2^{30} < 1.1 \times 10^9\) (False: \(1.073 \times 10^9\))  
     - E3: E1 ∨ E2 (Always True: One must hold)  
       - *Initial Mispricing:* Market maker sets E1 at $0.40, E2 at $0.40, E3 at $0.90. This violates \(P(\text{E1} \lor \text{E2}) \leq P(\text{E1}) + P(\text{E2})\) (should be $1.00 but sums to $0.80), allowing arbitrage.  

  ---

  ### **Rules of Trade**  
  - **Play Money:** Each student starts with $1,000.  
  - **Market Structure:** Facilitator acts as a **market maker** posting bid (buy) and ask (sell) prices for all contracts. Initial prices:  
    - Easy/empirical: Bid $0.45, Ask $0.55 (narrow spread).  
    - Hard/arbitrage: Bid $0.35, Ask $0.45 (wider spread).  
  - **Trading:**  
    - Students buy at ask prices, sell at bid prices (to/from market maker).  
    - No short selling; students can only sell contracts they own.  
    - Contracts pay $1 if true, $0 if false at settlement.  
  - **Price Adjustments:** Every 10 minutes, market maker:  
    - Raises ask/lowers bid for contracts with net buys.  
    - Lowers ask/raises bid for contracts with net sells.  
    - Adjusts by $0.05 per 5 trades to simulate market pressure.  
  - **Settlement:**  
    - **Live:** Easy arithmetic (A1–A3), empirical (D1–D2) resolved last 15 mins.  
    - **Overnight:** Hard arithmetic (B1–B3), combinatorial (C1–C2), arbitrage (E1–E3) resolved via email/next class.  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Introduction (0–10 min):**  
     - Explain prediction markets, contracts, and rules.  
     - Emphasize: "Some truths are knowable now, some require computation, and some are probabilistic. Price what you *can* compute, hedge what you can’t."  
     - Distribute play money.  

  2. **Trading Phase (10–70 min):**  
     - **10–20 min:** Initial trading. Students explore contracts; market maker adjusts prices if trades occur.  
     - **20–60 min:** Active trading. Announce price updates every 10 mins. Encourage arbitrage: "Look for contracts that might be logically related!"  
     - **60–70 min:** Final trades. Market maker narrows spreads to encourage closing positions.  

  3. **Settlement (70–80 min):**  
     - Resolve A1–A3 with student volunteers (pencil/paper).  
     - Roll dice for D1, draw card for D2.  
     - Record overnight outcomes for B1–B3, C1–C2, E1–E3 (pre-computed answers hidden).  

  4. **Debrief (80–90 min):**  
     - **Key Moments → Concepts:**  
       - *Pricing hard contracts:* "Why did you assign 0.6 to B1? You couldn’t compute it! This is **logical uncertainty**—truth exists, but you lack resources."  
       - *Arbitrage opportunity:* "If you bought E1 and E2 ($0.80) and sold E3 ($0.90), you locked in $0.10 profit. Classical probability requires \(P(\text{E1} \lor \text{E2}) = P(\text{E1}) + P(\text{E2})\) for disjoint events. But **bounded agents miss logical links**, creating arbitrage."  
       - *Empirical vs. logical:* "D1 and D2 had 'correct' probabilities (1/6, 1/4). B1–B3 have fixed but unknown truths—**epistemic humility** (0 < credence < 1) isn’t a probability axiom violation; it’s necessary for bounded agents."  
     - **Formal Takeaways:**  
       - Classical Bayesianism assumes logical omniscience; here, students couldn’t know all consequences.  
       - Achievable standard: **No efficient arbitrage** (prices coherent for tradable contracts), not omniscience.  
       - Real-world lesson: Bounded agents use markets to aggregate knowledge but remain vulnerable to overlooked dependencies.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Students race to compute easy statements, ignore trading:**  
     - **Solution:** Introduce hard contracts early. Say: "You can’t compute B1 now—trade based on intuition or hedge risks." Limit pencil/paper use to 5 minutes mid-session.  

  2. **Liquidity dries up:**  
     - **Solution:** Market maker provides liquidity via bid/ask spreads. If trading stalls, announce: "I’ll buy B1 for $0.30! Sell if you’re unsure."  

  3. **First price anchors all trades:**  
     - **Solution:** Start with wide spreads (e.g., $0.30–$0.70) and adjust aggressively. Announce: "Prices updated! B1 now $0.40–$0.50."  

  4. **Arbitrage unnoticed:**  
     - **Solution:** After 30 minutes, hint: "Check if E1, E2, E3 relate logically." If still missed, debrief explains it as a teaching moment.  

  5. **Time pressure:**  
     - **Solution:** Use countdown timers for trading intervals. Prioritize live settlement for A/D contracts to ensure closure.  

  ---

  ### **Limitations of the Activity**  
  - **Finite Slate vs. Unbounded Deduction:** Students face 12 contracts, but real reasoners confront infinite possible statements. The activity can’t show how agents handle *new* logical queries over time.  
  - **Fixed Time vs. Indefinite Future:** Prices adjust in 90 minutes, but bounded agents continually update beliefs over years. The game misses long-term belief revision.  
  - **Tractable Computation vs. Intractability:** Hard contracts are resolvable overnight; real agents face undecidable problems (e.g., Goldbach’s conjecture).  
  - **Centralized Market vs. Distributed Cognition:** Students rely on a market maker; real agents may lack this coordination mechanism.  

  **Supplement with Lecture:** Explain post-activity how unbounded deduction, open-ended time, and computational limits make logical uncertainty a deep problem in formal epistemology. Discuss frameworks like **Logical Induction** (Garrabrant et al.) that achieve coherence via market mechanisms without omniscience.  

  ---

  This design balances visceral experience with conceptual rigor, forcing students to confront the gap between ideal rationality and bounded computation. By the end, they’ll see why a Dutch book isn’t a failure—it’s a feature of learning under constraints.
