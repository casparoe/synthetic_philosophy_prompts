answer: |-
  Here’s the structured comparison you requested:

  ---

  **The two views in one paragraph each**  
  *Classical Deserving/Undeserving Poor Framework*: This view holds that state support should be conditional on individual effort and circumstance. Those "deserving" of aid are unable to work due to factors beyond their control (disability, age, temporary misfortune), while the "undeserving" *could* work but choose not to. "Less eligibility" is a core principle: benefits must never exceed the lowest independent wage to preserve work incentives and prevent moral hazard. Desert is assessed at the point of labour-market interaction – your choices *now* determine your entitlement. The state’s role is limited, intervening only when personal responsibility fails, to avoid subsidizing idleness or undermining self-reliance.

  *Upstream Desert Framework*: Desert is determined *before* individuals enter the labour market, based on unchosen starting conditions (inheritance, family wealth, health, education, birthplace). Those born into significant advantage (e.g., inheriting wealth) are exempt from desert assessments regarding work choices; their resources are seen as legitimately theirs regardless of effort. Conversely, those born into disadvantage face intense scrutiny of their subsequent choices. Conditionality applies almost exclusively to state support for the disadvantaged, as it's seen as redistributing "public" resources requiring justification. Private wealth, even if unearned, isn’t subject to the same desert criteria, creating a fundamental asymmetry.

  **What they share**  
  Both frameworks:  
  1.  **Acknowledge Scarcity & Incentives:** They recognize resources (state or societal) are limited, and systems must avoid creating perverse incentives that discourage work or responsible behaviour.  
  2.  **Value Self-Reliance:** They prize individual effort and contribution through work as virtuous and socially beneficial. Dependence, especially when avoidable, is seen negatively.  
  3.  **Employ "Desert" Logic:** Both use the concept of "deservingness" – that support should correlate with some notion of merit or justification based on circumstance and choice.  
  4.  **Focus on Labour Market Participation:** A person's relationship to paid work is central to assessing their status and entitlement in both systems.  
  5.  **Distinguish Between Public & Private Resources:** Both implicitly or explicitly treat state-provided benefits differently from privately held wealth, though they draw the boundaries and implications differently.

  **The three real disagreements**  
  1.  **The Locus of Desert Assessment:**  
      *   **Classical:** Desert is assessed *at the point of claiming state support*, based on *current* capacity and choices regarding work. Your starting point is background context, but the crucial moral test is "Can you work *now*? Do you *choose* to?"  
      *   **Upstream:** Desert is assessed *at birth* (or the point of inheritance). Advantages gained unchosen (wealth, health, social capital) grant a permanent exemption from labour-based desert assessments for those resources. The moral test applies overwhelmingly to the disadvantaged when seeking state aid ("Why aren't *you* working despite your disadvantages?"). This creates a fundamental asymmetry in who is subject to desert scrutiny and when.

  2.  **The Moral Status of Unearned Private Wealth vs. State Support:**  
      *   **Classical:** While private wealth isn't directly addressed by "less eligibility," the framework's logic implies that *living off unearned wealth without working* could be seen as morally analogous to the "undeserving poor" – both avoid work they are capable of. The state's role is separate, focusing only on preventing its *own* support from enabling idleness.  
      *   **Upstream:** Unearned private wealth is morally and practically distinct. Its origin "upstream" (inheritance, gift) grants it legitimacy regardless of the recipient's effort. The state owes nothing to the wealthy idler because it's not *its* money. State support, however, drawn from collective resources, inherently requires stringent justification based on desert assessed *downstream* of disadvantage. This treats private capital as inherently "deserved" by the recipient due to its origin, while state support is inherently "suspect."

  3.  **The Purpose and Scope of "Less Eligibility":**  
      *   **Classical:** "Less eligibility" is a *universal principle* applied to state relief to maintain the work incentive *for all potential claimants*, ensuring paid work is always the most rational choice. It's a functional necessity of any conditional relief system.  
      *   **Upstream:** "Less eligibility" loses its universal necessity. For those exempt by upstream advantage (like the trust-fund brother), no work incentive is needed or applied by the state – their wealth already provides an alternative. "Less eligibility" becomes a tool applied *only to the disadvantaged* receiving state aid, ensuring *their* labour remains cheap and available. It ceases to be a neutral market safeguard and becomes a mechanism enforcing class-based labour discipline specifically on the poor.

  **Verdict**  
  Your flatmate cannot coherently hold the classical framework while fully excusing her brother. The classical logic of assessing desert based on "choosing not to work when able" *should* apply to the idle wealthy – their unearned wealth simply replaces state benefits as the source of their support, but the core question of desert based on *choice and capacity* remains. Her appeal to "it's not the state's money" is the crux: it reveals her adherence to **upstream desert**. The state/money distinction *is* the mechanism by which upstream advantage exempts individuals from classical desert assessments. To be consistent with the classical view's core principle (desert based on work choice/capacity), she must either concede her brother *is* "undeserving" (by that standard) or abandon the universality of that principle. She owes her brother's position more than she gives; her framework actively shields him from the scrutiny she applies to others.

  **Where I've rigged it**  
  You've rigged two aspects slightly:  
  1.  **"Blind spot for capital":** While upstream desert *does* shield capital, framing it as a mere "blind spot" understates her *active moral justification* for it ("it wasn't the state's money"). She sees this distinction as principled, not an oversight.  
  2.  **"Worse than she is":** You imply her view is *necessarily* hypocritical or cruel. It *can* cohere if one fundamentally values strong private property rights and sees state redistribution as the *only* domain requiring desert assessments. Her position is internally consistent *if* one accepts that upstream advantages create morally legitimate exemptions. The rigging is in presenting upstream desert *only* as an inconsistency within the classical view, rather than acknowledging it as a distinct (if contestable) moral stance prioritizing property origins over labour participation for the advantaged.

  --- 

  This structure highlights the core philosophical divergence, exposes the inconsistency regarding her brother within the *classical* framework she claims to hold, and offers a fair critique of your own framing. Good luck!
