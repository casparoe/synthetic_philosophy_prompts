prompt: |-
  My flatmate and I keep having the same argument about benefits and I've finally worked out what it's actually about, so help me out.

  She's drawn to the old deserving/undeserving poor distinction — not the Victorian cruelty of it, she insists, just the thought that conditionality tracks something real: if you could work and choose not to, the state owes you less than it owes someone who can't. She even likes the Poor Law principle of less eligibility, the idea that relief should never leave you better off than the lowest-earning independent labourer, because she thinks it's just an honest statement of the incentive problem.

  But then something happens that I can't square with that. Her brother is a trust-fund type who has never worked a day in his life and is loudly rude about benefit claimants, and she doesn't think he's undeserving of anything, even though by her own criterion (choosing not to work when able) he's the clearest case going. When I press her she says it's different because his money "wasn't the state's", which is doing a lot of unexamined work.

  I've started calling her actual position "upstream desert" and she hates the name but can't deny it: desert should be judged at the point *before* the labour market ever gets a look at you — health, upbringing, inherited wealth, the postcode you were born into — so people whose advantages arrived upstream of any choice they made aren't assessed for desert at all, while people born into disadvantage have every downstream choice scrutinised. On this view the classical undeserving-poor idea isn't wrong so much as aimed at the wrong stretch of the river.

  So here's what I want: compare the classical deserving/undeserving poor framework (including less eligibility) with upstream desert as I've sketched it. Are they genuinely rival theories about what conditionality is for, or is upstream desert just the classical idea with a blind spot for capital politely labelled? Does less eligibility survive the move — if desert is judged upstream, is there still any principled reason to keep benefits below the worst wage? And tell me honestly whether I've rigged the framing in a way that makes her look worse than she is.

  Structure it as follows, in this order, and keep to roughly the lengths given:

  - "The two views in one paragraph each" (~150 words) — steelman both, no snark
  - "What they share" (~200 words)
  - "The three real disagreements" (~350 words) — name them, don't just list differences
  - "Verdict" (~150 words) — can my flatmate keep the classical framework, or does she owe her brother's argument more than she's giving it
  - "Where I've rigged it" (~100 words) — be brutal, she'll want to quote this part back at me
