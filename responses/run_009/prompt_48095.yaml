answer: |-
  This is a brilliantly sharp observation that cuts to the heart of the tension between our stated ideals of equality and the legal realities of dynastic wealth. Let's dissect the implicit theories, rival views, and the luck-egalitarian challenge:

  **The Dominant Implicit Theories in Current Practice:**

  1.  **The Family as the Primary Unit of Equality and Opportunity:**
      *   **Core Idea:** Society primarily guarantees *families* the chance to pursue prosperity and pass on their achievements. "Equal opportunity" means families start relatively equal *as families*, not that individuals are stripped of their familial context. The family unit is seen as the fundamental building block of society, deserving autonomy in shaping its own future, including across generations.
      *   **Justification:** This view sees parental investment (including wealth transfers) as a core expression of family love, responsibility, and continuity. Severely taxing inheritance is seen as an unjust intrusion into this fundamental unit and a disincentive to accumulation, which benefits the economy.
      *   **Consistency:** It explains why breaking up *public* advantages (like offices) is essential (meritocracy for the *common good*) but breaking up *private* family wealth is generally resisted.

  2.  **Strong Deference to Property Rights and Earned Control (Quasi-Desert + Autonomy):**
      *   **Core Idea:** The individual who earned the wealth has a near-absolute right to dispose of it as they see fit, even after death. This right stems from:
          *   **Desert:** They earned it through effort/skill (even acknowledging luck, the *primary* moral claim is theirs).
          *   **Autonomy:** Control over one's property is a fundamental liberty, extending to posthumous wishes.
          *   **"Fruits of Labor":** Wealth is seen as deeply personal, an extension of the self and its efforts.
      *   **Justification:** Taxing inheritance heavily is viewed as a "double tax" (though logically flawed, as the heir hasn't been taxed) and a violation of the earner's autonomy. The earner's claim *does* extend beyond death regarding disposition.
      *   **Consistency:** This explains the visceral unpopularity of inheritance taxes compared to income or consumption taxes – it feels like confiscating a personal gift/legacy.

  3.  **Pragmatic Anti-Perpetuity vs. Acceptable Lump-Sum Transfer:**
      *   **Core Idea:** Society tolerates (or even encourages) a *single* transfer of wealth at death to the next generation. However, it actively combats attempts to control wealth *indefinitely* from the grave through legal structures like the Rule Against Perpetuities (RAP), restrictions on dynastic trusts, and generation-skipping transfer taxes.
      *   **Justification:**
          *   **Economic Dynamism:** Perpetual control locks up capital, hinders market efficiency, and ossifies class structures. A lump sum allows heirs to use (or squander) it, returning capital to circulation.
          *   **Moral/Political Rot:** Concentrated wealth held indefinitely by trustees for distant descendants is seen as creating an unaccountable, potentially corrupting aristocracy detached from productive effort. A single transfer feels more like a "legacy" than "entrenched power."
          *   **Administrative Feasibility:** Lump sums are easier to track and potentially tax (though often avoided) than complex, long-term trusts.
      *   **Tension:** This clashes somewhat with the "Family Unit" view. Why is a single transfer "family," but a structured transfer ensuring *great*-grandchildren are wealthy "perpetuity"?

  **Rival Views of Equality Consistent with the Practice (Where it's Underdetermined):**

  1.  **Sufficientarianism (Focusing on a Floor, not Equality):** The practice is consistent if the goal isn't strict equality of opportunity, but ensuring everyone has *enough* to avoid destitution and have a basic chance. As long as inheritance taxes don't push heirs below a sufficiency threshold, they aren't necessary. The system focuses on poverty relief elsewhere (welfare, public education) rather than aggressively leveling dynastic wealth.
  2.  **Formal Equality of Opportunity:** The system might only require the *absence of legal barriers* based on birth (e.g., no feudal titles, no legal caste system). The *de facto* advantages of wealth are seen as an inevitable consequence of free families and strong property rights, not a violation of formal equality. Equal opportunity means *legal* access to positions, not *equal resources* to compete for them.
  3.  **Meritocracy within Generations:** The focus is on ensuring *current* processes (education, hiring) are meritocratic. Previous generations' accumulation is largely irrelevant to judging the fairness of *current* distribution mechanisms, as long as those mechanisms aren't formally rigged. Inherited wealth might give a head start, but the *system* still rewards the individual's own merit *within their lifetime*.

  **The Luck-Egalitarian Challenge: Taking Inheritance Seriously**

  Luck egalitarians argue that inequalities stemming from "brute luck" (circumstances one is not responsible for) are unjust, while inequalities from "option luck" (choices one makes) can be fair. Inherited wealth is the quintessential brute luck advantage – the heir did nothing to earn it.

  **If a luck-egalitarian took inheritance seriously, the system would need radical changes:**

  1.  **Significantly Higher Taxation:** Inheritance would be a primary target for redistribution. Tax rates would likely be high, potentially progressive based on the size of the estate *and* the existing wealth of the heir. The goal would be to neutralize the unearned advantage.
  2.  **Lifetime Capital Receipts (LCR) or Similar:** Instead of taxing estates at death, the focus might shift to taxing *receipts* of gifts and inheritances *over the heir's lifetime*. This recognizes that multiple transfers compound advantage. A progressive tax on total lifetime gifts/inherits received would be more luck-egalitarian than a one-time estate tax.
  3.  **Closing Looles Aggressively:** Trusts, GRATs, FLPs, and other wealth transfer avoidance mechanisms would face severe restrictions or elimination. The distinction between lump sums and perpetual trusts would blur – *any* significant dynastic transfer would be suspect.
  4.  **Shifting Justification:** The "family unit" justification weakens. While family bonds matter, the brute luck advantage bestowed on the *individual* heir becomes the primary moral concern. The "earner's absolute control" justification is directly challenged – the earner's desert claim doesn't automatically extend to creating unearned privilege for others.
  5.  **Focus on Equal Starting Points:** Policy would emphasize ensuring truly equal starting points for *individuals*, funded significantly by inheritance taxes. This could mean massive public investment in early childhood education, universal basic capital (seed money for young adults), or other mechanisms to offset unequal parental wealth.
  6.  **Reevaluating Perpetuity Rules:** While perpetual control might still be problematic, the luck-egalitarian focus would be primarily on the *initial transfer* of unearned advantage. Rules like the RAP might become less central if the *receipt* of wealth, whenever it happens, is heavily taxed to neutralize its brute luck origin.

  **Conclusion:**

  Our current leniency towards inheritance tax rests on a complex, often unarticulated, blend of **familial autonomy, strong individual property rights extending beyond death, and a pragmatic tolerance for single-generation transfers combined with hostility towards perpetual control.** It implicitly prioritizes the family as the unit of opportunity and the earner's autonomy over strict individual equality of starting points.

  This practice is compatible with **sufficientarianism, formal equality of opportunity, or meritocracy focused on current processes**, but fundamentally clashes with **luck egalitarianism.** For a luck egalitarian, the massive unearned advantage bestowed by inheritance is a core injustice requiring aggressive taxation and redistribution to achieve anything resembling genuine equal opportunity for individuals. The political unpopularity of inheritance tax highlights the enduring power of the family/property-rights view over the luck-egalitarian critique in most contemporary societies.
