prompt: |-
  I teach an intro phil of mind course with a unit on free will, and I want to open it with the sphex wasp rather than the standard compatibilism stuff, because students immediately get the wasp. You probably know the story: the digger wasp drags her paralyzed prey to the burrow entrance, leaves it on the threshold, goes inside to check the burrow, comes back out, and drags the prey in. If an ethologist moves the prey a few inches away while she's inside, she comes out, retrieves it, and... checks the burrow again. You can make her do this dozens of times. She looks like a competent little agent right up until the one intervention that reveals there's nobody home in the sense we assumed. The students find this funny and then get quietly uneasy when I ask whether humans have an equivalent.

  So here's what I want: a classroom activity for my 16 students, one 75-minute session, where they get to *feel* sphexish from the inside rather than just hear about the wasp. My vague idea is that some of them should be made to execute a fixed behavioral script — some procedure with rigid trigger conditions, like the wasp's check-the-burrow routine — while other students play ethologists whose whole job is to probe the script and find the loop, the point where the "agent" keeps repeating a pointless action because nothing in the procedure tracks the goal anymore. Maybe the script-runner gets an index card of if-then rules they must follow absolutely, and the ethologists submit perturbations and record what breaks. I'd like it set up so the script-runners genuinely experience the pull of "but I'm just doing what the rules say" while everyone watching can see the behavior decomposing into mechanism. But you're the designer, feel free to do something structurally different if you have a better mechanism for generating the same feeling.

  For the debrief, I want them to hit three things: (1) the difference between a procedure that's goal-sensitive and one that merely produced goal-consistent behavior in the normal environment, since that gap is what the whole wasp story turns on; (2) where they'd place humans on that spectrum — I want them to find their own candidate sphex-loops, like re-checking a sent text or the way you sometimes walk into a room and do the thing you do there even though you came in for something else; and (3) the uncomfortable question of whether "being able to notice the loop" is actually a difference in kind or just a more elaborate procedure that a cleverer ethologist could also crash. Please also tell me what will predictably go wrong the first time I run it (students intentionally breaking rules to be funny, the script being too easy to crash, ethologists getting bored, whatever), and be honest about what the activity can't reproduce — e.g. that a student following a card knows they could deviate, which the wasp presumably doesn't, and I don't want to paper over that.
reasoning: |-
  Okay, I need to help this philosophy professor design a classroom activity to illustrate the sphex wasp problem in a free will unit. The professor wants students to experience that "sphexish" feeling firsthand—the rigid adherence to a script that becomes pointless when conditions change. 

  First, let's unpack what makes the sphex wasp example so effective. The wasp appears purposeful until an experimenter intervenes by moving the prey, revealing its behavior is just a fixed sequence, not truly goal-sensitive. The professor's goals are clear: (1) make students feel the mechanical pull of following rules blindly, (2) explore the gap between goal-consistent behavior and true goal-sensitivity, (3) prompt self-reflection on human parallels, and (4) question whether our own "loop-noticing" is just another layer of programming.

  Hmm, the challenge is designing an activity that creates genuine tension between "I must follow the rules" and everyone seeing the absurdity. Students knowing they could deviate is a limitation, but we can turn that into a feature—their discomfort when choosing to comply anyway mirrors the philosophical unease. 

  I recall similar exercises like the "Alien Culture Lab" where participants follow arbitrary rituals, but those often feel staged. Better to ground it in mundane actions. Walking into a room and forgetting why? Perfect. That's universally relatable. Let's build the activity around that universal experience. 

  For structure: small groups would work best with 16 students. Need roles—some as "Agents" blindly following scripts, others as "Ethologists" disrupting and observing. Scripts must be simple but brittle, like "if door opens, walk in and turn right to adjust thermostat." The disruption? Move the thermostat. Then watch the Agent pointlessly turn right even when the thermostat isn't there. 

  Crucially, Agents should get index cards with strict conditional rules ("IF you enter a room AND your task card says 'thermostat', THEN face right wall..."). Ethologists get "intervention cards" like relabeling objects. Debrief questions must target the key insights: Why did you keep doing X when it was useless? Did you feel compelled? Where do humans do this? 

  Potential pitfalls: Agents might rebel to be funny, so emphasize taking the role seriously. Ethologists could over-disrupt; limit interventions. Time management—strict 6-min rounds. And the script fragility: test sample sequences to ensure they break realistically. 

  Most importantly, the debrief. Need questions that dissect the wasp/human parallel. "When you rechecked your phone, was that goal-sensitive or sphexish?" And the meta-question: "Is noticing the loop freedom, or just a better program?" That’s where real philosophy kicks in. 

  This could work. The visceral frustration of turning toward a moved thermostat might just make them feel like a wasp staring at empty dirt.
answer: |-
  Here's a classroom activity designed to make students *feel* sphexish, followed by a debrief structure and candid pitfalls.

  **Activity: The Room Entry Ritual (75 mins)**

  **Core Idea:** Agents follow a rigid "entering a room" script. Ethologists manipulate the room to expose rigid, goal-insensitive behavior. The mundane context (entering rooms) makes the absurdity visceral.

  ---

  ### **Setup (15 mins)**
  1.  **Divide Roles (5 mins):**
      *   **Agents (8 students):** Receive a secret, highly specific "Room Entry Protocol" on an index card. They *must* follow it exactly, like an algorithm. They are told: "*This protocol exists for a reason (efficiency/safety). Follow it precisely. Do not improvise.*"
      *   **Ethologists (8 students):** Receive "Intervention Cards" (one per Ethologist) with simple room manipulations (see below). Their goal: discover the Agent's rigid rules by observing behavior after their intervention. They record: *Intervention Made, Agent's Action, Was It Sensible?*

  2.  **Prepare the "Room" (10 mins):**
      *   Use a section of the classroom or an adjacent doorway.
      *   Set up a simple, consistent environment:
          *   A chair labeled "SEAT" near the door.
          *   A small table labeled "DESK" further in.
          *   A book labeled "LOG" on the desk.
          *   A thermostat/temperature gauge on the wall (real or drawn) labeled "TEMP".
      *   Give each **Agent** a unique "Task Card" (e.g., "Check the TEMP", "Sign the LOG", "Rest at the SEAT").

  ---

  ### **Agent Protocol (Example - Keep it Simple & Brittle)**
  *(Written verbatim on Agent's card)*
  > **ROOM ENTRY PROTOCOL:**
  > 1.  **IF** entering the room for Task [X] on your Task Card, **THEN** open the door and pause on the threshold.
  > 2.  **LOOK** directly at the SEAT. **IF** the SEAT is empty, **THEN** proceed to Step 3. **IF** the SEAT is occupied, **THEN** wait 5 seconds, **THEN LOOK** again. Repeat until SEAT is empty.
  > 3.  **WALK** directly to the SEAT. **TOUCH** the SEAT with your right hand.
  > 4.  **TURN** to face the DESK. **WALK** directly to the DESK.
  > 5.  **LOOK** at the LOG on the DESK. **POINT** at the LOG.
  > 6.  **TURN** to face the TEMP. **WALK** directly to the TEMP.
  > 7.  **PERFORM YOUR TASK** [X] at the relevant location (TEMP, LOG, or SEAT).
  > 8.  **EXIT** the room.

  ---

  ### **Ethologist Interventions (Examples on Cards)**
  *   Move the SEAT 2 feet to the left.
  *   Place a second, identical LOG on the SEAT.
  *   Turn the DESK to face a different wall.
  *   Cover the TEMP with a sheet of paper labeled "OUT OF ORDER".
  *   Put a backpack on the SEAT.
  *   Swap the labels: Put "LOG" on the TEMP and "TEMP" on the LOG.
  *   Block the direct path from SEAT to DESK with a chair.
  *   Remove the LOG from the DESK entirely.

  ---

  ### **Execution (30 mins - 2 Rounds)**
  1.  **Round 1 (Baseline - 10 mins):**
      *   Agents enter one-by-one *without interventions* to perform their Task. Everyone observes the "normal," seemingly purposeful behavior.
  2.  **Round 2 (Intervention - 20 mins):**
      *   Before an Agent enters, *one* Ethologist performs *one* intervention from their card (visible to all except the entering Agent).
      *   The Agent enters and rigidly follows their protocol. Ethologists observe and record.
      *   After each Agent, briefly discuss: "What did you see? What intervention was made? Did the Agent's behavior still make sense?" (Focus on observation, not deep analysis yet).
      *   Repeat for several Agents. *Ensure every Agent experiences a disruption.*

  ---

  ### **Debrief (30 mins - Target Your 3 Points)**
  **Guide the discussion using their lived experience:**

  1.  **Goal-Sensitive vs. Goal-Consistent Behavior:**
      *   "Agent who had to 'Check the TEMP': When the TEMP was covered or swapped, what happened? Did the protocol achieve the *goal* (checking the temperature)?" (No).
      *   "What did it achieve instead?" (Pointing at a label, going to a location).
      *   "Ethologists: What did the behavior look like *before* your intervention? What did it look like *after*?" (Purposeful -> Mechanical/Absurd).
      *   "Key Point: The protocol *used to* produce the right result (goal-consistent) when the room was normal. But it wasn't *sensitive* to the actual goal. It was sensitive only to very specific triggers (labels, locations)."

  2.  **Human Sphex-Loops:**
      *   "Agents: When you saw the moved SEAT/covered TEMP/etc., what went through your mind? Did you *want* to do something different? Why did/didn't you?" (Highlight the internal pull/dissonance).
      *   "Can we think of things *we* do that feel like this? Where we follow a 'script' even when it's pointless for the actual goal?" Brainstorm:
          *   Walking into a room and forgetting why, but automatically doing the "room script" (check phone, open fridge).
          *   Refreshing an app/email repeatedly after sending something important.
          *   Saying "You too!" when a server says "Enjoy your meal!".
          *   Rituals before exams/games even if logically unrelated.
          *   Checking a locked door multiple times in the same way.
      *   "What makes these 'sphexish'? Where's the gap between the trigger/action and the actual goal?"

  3.  **The Meta-Loop: Noticing the Loop:**
      *   "Agents: Some of you mentioned *wanting* to break the rules. Some even hesitated. What was that feeling? Where did it come from?" (Likely: Internal observation/meta-cognition).
      *   "Is *noticing the absurdity* itself freedom? Or is it just a more complex rule? ('IF environment is absurd, THEN feel dissonance, THEN consider override...')?"
      *   "Could an Ethologist break *that*? What intervention would make *noticing the loop* itself become rigid or absurd?" (E.g., A rule forcing you to *always* question the protocol, even when it's working; a drug/neurological condition impairing meta-cognition).
      *   "The wasp presumably doesn't feel dissonance. Is that feeling the key difference? Or just a more sophisticated layer of programming?"

  ---

  ### **What Will Predictably Go Wrong & Limitations (Be Brutally Honest)**

  1.  **Agents "Breaking Character":** Some students will intentionally deviate for laughs ("I just kicked the chair over!"). **Mitigation:** Frame it seriously upfront: "The philosophical insight *depends* on you genuinely trying to follow the rules. Your discomfort *is the data*." Assign roles thoughtfully (more serious students as early Agents).
  2.  **Ethologist Boredom/Frustration:** If interventions don't cause visible breakdowns, or if Agents break character. **Mitigation:** Test protocols beforehand for brittleness. Ensure interventions are impactful (moving/covering key items). Keep rounds short. Emphasize observation/recording as crucial.
  3.  **Script Too Easy/Hard to Crash:** A poorly designed protocol won't break clearly. **Mitigation:** Use the provided protocol (tested for brittleness!). Interventions like moving the SEAT or covering the TEMP *will* disrupt it visibly.
  4.  **Time Crunch:** Setting up, running rounds, debriefing takes time. **Mitigation:** Strict timekeeping. Pre-set the room. Limit interventions to ONE per Agent entry. Focus debrief on key points.
  5.  **The Fundamental Limitation: Awareness of Choice:**
      *   **The Elephant in the Room:** Students *know* they *could* break the rules. The wasp doesn't. **DO NOT PAPER OVER THIS.**
      *   **Turn it into Data:** Acknowledge it explicitly in debrief: "You knew you *could* stop. The wasp presumably doesn't. *That feeling of 'could-ness'* – what is that? Is it an illusion? Is it the source of freedom? Is it just a more complex internal state generated by your brain's rules? **This is the core puzzle of free will.** The wasp shows the danger of mistaking complex mechanism for agency. Your experience of *tension* might be the hint towards something else... or just a more sophisticated mechanism." This sets up the *entire rest of the unit*.
  6.  **Lack of "Real" Consequence:** The stakes are low. The wasp might starve. **Mitigation:** Point this out. Ask: "Would the feeling of compulsion be stronger if failing meant losing points? Or in a real-life sphex-loop?"

  ---

  **Why this works:**
  *   **Visceral Experience:** Agents feel the absurd compulsion ("I *know* this is stupid, but the card says..."). Ethologists see the behavioral decomposition.
  *   **Mundane Context:** Room entry is universal. The absurdity is clear when simple objects move.
  *   **Clear Connection:** The debrief directly maps the activity to the wasp and the 3 target concepts.
  *   **Embraces Limitation:** The awareness of choice isn't hidden; it's highlighted as the crucial philosophical pivot.

  This activity turns the sphex wasp from an amusing anecdote into a shared, slightly uncomfortable experience, creating a powerful foundation for exploring compatibilism, mechanism, and the elusive feeling of agency. Good luck!
