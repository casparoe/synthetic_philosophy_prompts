prompt: |-
  my roommate and I have been going in circles for months about the boundary problem in democratic theory -- you know, the problem of constituting the demos: for any given collective decision, who counts as a member of the group entitled to make it? I'm basically team "all-affected interests": anyone who's interests are significantly affected by a decision should get a say in it. She's team "all-subjected": the demos is whoever is actually subject to the authority/coercive power of the decision-making body, not just whoever happens to be affected by the outcome. Over time we've accumulated a running list of test cases we fight about: a coastal county voting on whether to build a sea wall that inland taxpayers partially fund, seasonal migrant workers who can't vote where they live and work 9 months a year, foreign investors hit by a new tariff, future generations and climate policy, tourists passing through during election season, and whether any of this changes when a referendum is binding versus merely advisory.

  Write us the document we should've produced instead of yelling across the kitchen: a numbered list of claims we could both genuinely sign off on (not mushy compromise fluff -- real points of agreement, including about what makes the boundary problem hard in the first place), then a table of our disagreements, where each side's position is stated in wording that that side would itself accept -- she should read the description of the all-subjected view and nod, and vice versa for me. Then lay out the cruxes: the sub-questions such that settling them would actually move at least one of us. I suspect some candidates are: whether affectedness is ever measurable/stable enough to ground inclusion rights, whether being subject to coercion is just one species of being affected or something categorically different, and whether the demos can legitimately vary decision-by-decision or has to be fixed at some higher level (and if so, who fixes THAT, which feels like it just regresses the whole problem). For each crux, give a concrete case, argumnet, or thought experiment that both of us would agree bears on it, and record what each of us would predict about it in advance -- especially on our test cases like the sea wall and the migrant workers. And if part of our fight turns out to be just verbal -- like maybe we mean different things by "governed" vs "affected" -- please say which part and why, because honestly I've started to suspect a decent chunk of it is.
reasoning: |-
  Okay, the user and their roommate have been debating the boundary problem in democratic theory for months. They're stuck between the "all-affected interests" principle and the "all-subjected" principle. The user wants a structured document that clarifies their agreements, disagreements, and the key cruxes that could resolve their debate. They also suspect some of their disagreement might be verbal.

  First, I need to outline their points of agreement. Both likely agree that democracy requires boundaries, that boundaries are necessary for legitimacy, and that both principles aim to solve the same problem. They probably also agree that current institutions don't perfectly satisfy either principle and that the boundary problem is recursive. Including these in a numbered list makes sense.

  Next, their disagreements. The all-affected view focuses on outcomes affecting interests, while all-subjected emphasizes subjection to authority. These differences lead to distinct inclusions/exclusions. I should present each position neutrally, using language each side would accept. For example, the affected view might highlight indirect effects and future generations, while the subjected view stresses legal bindingness and territorial presence.

  The cruxes are where they might find resolution. Key questions include measurability of affectedness, whether coercion is categorically different, and if the demos should be decision-specific or fixed. For each crux, concrete cases like the sea wall or migrant workers can test their principles. For instance, in the sea wall case, the affected view includes inland taxpayers, while subjected might exclude them if not under the same authority.

  I should also check for verbal disputes. Terms like "governed" and "affected" might be interpreted differently. Clarifying that "subjected" implies direct legal authority, while "affected" is broader, could help. Highlighting these differences might reduce unnecessary conflict.

  The user mentioned test cases: sea wall, migrant workers, tariffs, future generations, tourists. Each crux should reference these to keep it relevant. For future generations, the affected view includes them, but subjected excludes as they aren't presently governed. This shows a fundamental divide.

  Predictions for each test case based on their principles will show where they agree or disagree. For example, on tourists during a binding referendum, subjected might include them if present, affected might not if impact is minor. This helps pinpoint exact differences.

  Finally, the document structure: agreements, disagreements table, cruxes with cases and predictions. Ensuring clarity and avoiding compromise fluff is crucial. The goal is to map their debate, not resolve it, so presenting each side's view accurately is key.
answer: |-
  Here’s the structured document you requested—a clear map of agreements, principled disagreements, and testable cruxes—designed to replace kitchen yelling with productive debate. 

  ---

  ### **1. Points of Agreement**  
  *(Statements both "All-Affected" and "All-Subjected" proponents can endorse)*  
  1. **Legitimacy Requires Boundaries**: Democracies require a bounded group ("demos") for collective decisions to avoid incoherence (e.g., infinite regress).  
  2. **Moral Stakes**: Exclusion/inclusion errors are *morally significant*. Excluding rightful members is disenfranchisement; over-including dilutes agency.  
  3. **Problem Recursiveness**: Fixing boundaries at *any* level (e.g., nation-state) doesn’t solve the problem—it just kicks it up a level ("Who decides the deciders?").  
  4. **Real-World Messiness**: Existing institutions (e.g., citizenship-based voting) fail both principles in known ways (e.g., disenfranchising long-term residents).  
  5. **Coercion Matters**: All binding collective decisions involve coercion (e.g., enforced laws, taxes, penalties).  
  6. **"Affectedness" is Real**: Outcomes *do* impact people beyond formal subjects (e.g., tariffs harm foreign workers).  
  7. **No Perfect Solution**: Both principles face hard cases; neither is universally intuitive.  

  ---

  ### **2. Positions: Stated Neutrally and Fairly**  
  | **Issue** | **All-Affected Interests (Your View)** | **All-Subjected (Roommate’s View)** |
  |-----------|----------------------------------------|-------------------------------------|
  | **Core Principle** | The demos should include all whose significant interests are shaped by a decision’s outcome. | The demos should include all who are bound by the enforceable rules produced by the decision. |
  | **Why?** | Moral claim: Impact creates a stake; ignoring it treats people as mere objects. | Institutional claim: Authority requires reciprocity; imposing rules creates a duty of inclusion. |
  | **Key Inclusions** | Future generations, foreigners facing spillover effects (e.g., pollution, tariffs), indirectly burdened groups (e.g., inland taxpayers). | Territorial residents during enforcement, legal persons under jurisdiction (e.g., long-term visa holders), those facing direct legal coercion. |
  | **Key Exclusions** | Those minimally/accidentally affected (e.g., passing tourists). | Those outside enforcement reach (e.g., foreign investors facing market effects, future generations). |
  | **View of "The State"** | A tool to manage consequences affecting humans, regardless of borders. | A bounded authority system defined by territorial/legal coercion. |

  ---

  ### **3. Cruxes: Sub-Questions That Resolve Disagreements**  
  *(With test cases, arguments, and your predicted positions)*  

  #### **Crux 1: Is "Significantly Affected" Measurable & Stable?**  
  - **Test Case**: *Sea Wall Referendum*  
    - Coastal county votes on a wall, funded by county-wide taxes. Inland taxpayers pay but gain no direct protection.  
  - **Argument**: If affectedness is too fluid/vague (e.g., "inlanders lose money"), it destabilizes demos boundaries. If quantifiable (e.g., tax burden ≥X%), it’s actionable.  
  - **Predictions**:  
    - You (Affected): Inlanders **IN**—financial burden is significant.  
    - Roommate (Subjected): Inlanders **OUT**—they’re already subject to county taxes; this is just one policy.  

  #### **Crux 2: Is Subjection to Coercion Categorically Distinct?**  
  - **Test Case**: *Seasonal Migrant Workers*  
    - Work/live 9 months/year under local laws (e.g., labor regulations, policing) but cannot vote.  
  - **Argument**: Are they "subjected" (daily coercion) or just "affected" (wages, residency)? Does formal citizenship override lived subjugation?  
  - **Predictions**:  
    - You (Affected): Workers **IN**—laws profoundly shape their welfare.  
    - Roommate (Subjected): Workers **IN**—they are directly ruled by local authority. *(Note: This may reveal partial agreement!)*  

  #### **Crux 3: Can the Demos Vary Decision-by-Decision?**  
  - **Test Case**: *Climate Policy vs. Local Zoning*  
    - Should a national climate referendum include future generations? Should a town zoning vote include tourists?  
  - **Argument**: Fluid demoi risk chaos but solve boundary recursion. Fixed demoi are stable but arbitrarily exclude.  
  - **Predictions**:  
    - You (Affected): Climate: Future gens **IN**; Tourists: **OUT** (unless trapped by policy).  
    - Roommate (Subjected): Future gens **OUT** (no present coercion); Tourists **OUT** (temporary presence ≠ subjection).  

  #### **Crux 4: Binding vs. Advisory Decisions**  
  - **Test Case**: *Non-binding EU referendum affecting foreign markets*  
    - Should Greek voters alone decide a symbolic vote that crashes Turkish banks?  
  - **Argument**: If coercion defines inclusion, non-binding votes might require a different demos.  
  - **Predictions**:  
    - You (Affected): Turks **SHOULD HAVE VOICE**—outcomes harm them.  
    - Roommate (Subjected): Turks **OUT**—no enforceable rules are imposed on them.  

  ---

  ### **4. Verbal Disagreements: Cutting Through the Noise**  
  You suspect some disputes are semantic. You’re likely right:  
  - **"Governed" vs. "Affected"**:  
    - *Subjected* uses "governed" to mean **formal subordination to enforceable authority**.  
    - *Affected* uses "governed" to mean **de facto impact on life prospects**.  
  - **"Coercion"**:  
    - *Subjected*: Only state-enforced rules (fines, jail).  
    - *Affected*: Economic/cultural pressures count if systematic (e.g., tariffs destroying livelihoods).  
  - **"Stake"**:  
    - *Subjected*: A stake arises from reciprocal obligation to obey.  
    - *Affected*: A stake arises from experiencing consequences.  

  **Why it matters**: If your debate uses "governed" ambiguously, you’re arguing past each other. Clarify terms *before* revisiting test cases.  

  ---

  ### **Conclusion: Where to Aim Your Arguments**  
  To persuade each other, focus on:  
  1. **The Sea Wall Case**: If your roommate concedes inlanders *should* vote, it weakens subjectedness. If you concede they *shouldn’t*, it weakens affectedness.  
  2. **Migrant Workers**: If you both agree they deserve inclusion, the gap may be smaller than you think.  
  3. **The Institutional Question**: Can affectedness be implemented without chaos? If yes, your view gains; if no, hers holds.  

  This document doesn’t solve the boundary problem—but it ensures you’re fighting the *real* fight, not semantic ghosts. Print it, sign it, and keep it on the fridge.
