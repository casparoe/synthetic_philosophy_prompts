  The proposal would cap the retributive component of sentences for certain offenses at one-third of the current guideline range. The remaining two-thirds would depend on forward-looking factors like rehabilitation that offenders could "earn down" over time. There are three main philosophical positions within the commission:
  - One faction believes punishment is deserved based on culpable choice and opposes capping this "desert" component
  - Another faction rejects desert entirely, viewing all punishment as only justified by forward-looking concerns
  - A middle "compatibilist" position sees desert as tied to capacity to respond to reasons, which this cap could accommodate

  The memo must specifically address two issues: the "reopener" clause and what happens when offenders complete all earn-down conditions. The reopener allows recalculating the retributive portion based on new backward-looking information but not reducing the forward-looking portion. The endpoint question concerns how to handle any remaining sentence after full compliance.

  The user needs a structured memo with a clear recommendation, reasoning that engages all philosophical positions honestly, concrete analysis of the two specific issues, and practical implementation considerations. I'll aim for 900-1200 words in formal memo format.

  For the recommendation, I'm considering suggesting adoption as a pilot with modifications. Outright rejection seems unwise given the legislative referral, while unmodified adoption ignores valid concerns. A pilot allows testing while limiting scope.

  On the reopener asymmetry, I'll acknowledge the rationale but point out complications, especially when new information affects risk assessment. I'll suggest a modification to allow risk reassessment in such cases. For the endpoint, I'll recommend treating the unreduced portion as a presumption rather than a floor or ceiling, which maintains flexibility while respecting the desert concept.

  I'll structure the memo with sections covering: background, analysis of philosophical positions, specific issue discussions, recommendations with modifications, and implementation logistics. The tone should be balanced and accessible to both commission members and legislators.
answer: |-
  **MEMORANDUM**  
  **TO:** Members, State Sentencing Guidelines Commission  
  **FROM:** [Your Name], Citizen Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Legislative Pilot Proposal - "Desert Cap" for Defined Offense Classes  

  ## 1. EXECUTIVE SUMMARY
  This memo analyzes the legislative proposal for a "desert cap" pilot program, recommending **adoption with specified modifications** and a 3-year pilot phase. The proposal offers a pragmatic framework to bridge deep philosophical divides on retribution by capping the "desert" component of sentences at one-third of the current guideline range for defined offenses, with the remainder contingent on forward-looking, earnable reductions. Key modifications address operational ambiguities regarding the "reopener" clause and the sentence endpoint after full compliance. Adoption allows empirical testing of this novel structure while respecting core concerns from all commission factions. Implementation should commence within 6 months of adoption.

  ## 2. PROPOSAL OVERVIEW
  The pilot would, for a defined class of offenses (TBD by the Commission):
  *   Cap the "retributive desert" component of the guideline sentence at **one-third (1/3)** of the current minimum and maximum range.
  *   Allocate the remaining **two-thirds (2/3)** as a "forward-looking" component, imposable only based on risk assessment, rehabilitation needs, or restitution obligations.
  *   Allow offenders to "earn down" this forward-looking portion through documented completion of programs, restitution payments, and sustained conduct demonstrating reduced risk.
  *   Include a "reopener" clause permitting post-sentencing adjustment of the retributive third based on newly discovered backward-looking information (e.g., coercion, undiagnosed condition), while explicitly prohibiting reduction of the forward-looking portion based on such information.
  *   Remain silent on the status of any unreduced forward-looking portion after an offender fully satisfies all earn-down conditions.

  ## 3. ANALYSIS OF PHILOSOPHICAL DIVIDE AND PROPOSAL'S APPROACH
  The Commission's impasse stems from fundamentally incompatible views of desert:
  *   **Retributivist Faction:** Holds that punishment is intrinsically deserved based on culpable choice at the time of the offense. This desert is non-negotiable; capping it treats a claim of justice as a discretionary variable, effectively negating retribution's core rationale. The proposal risks legitimizing sentences fundamentally *undeserved* in their retributive core.
  *   **Abolitionist Faction:** Argues that the conditions for "basic desert" (ultimate authorship of character/choices) are metaphysically impossible, rendering all purely backward-looking punishment unjustified. The cap merely codifies this reality. Only the forward-looking component, tied to prevention and restoration, can ever be justified. The proposal is a step toward moral honesty.
  *   **Compatibilist Faction:** Contends desert persists meaningfully in a weaker, practical sense – tied to the capacity for reason-responsiveness demonstrated by the offender at the time of the act. The cap can be interpreted as *defining* desert within the system as this reason-responsive culpability, setting its maximum expression at one-third, while the earnable portion addresses future-oriented societal goals.

  **The Proposal as Compromise:** The "desert cap" does not resolve this philosophical dispute but provides a workable operational structure that acknowledges each view:
  *   It explicitly *preserves* a distinct retributive component (satisfying Retributivists that desert is recognized, even if capped).
  *   It makes the majority of potential confinement contingent on future conduct and demonstrable change (aligning with Abolitionist priorities for forward-looking justification).
  *   It implicitly adopts a *pragmatic definition* of desert compatible with the Compatibilist view – the capped third represents the system's quantification of the offender's blameworthiness based on the known facts of the offense and their reason-responsive capacity at that time.

  **Strongest Unresolved Tension:** The Retributivist concern remains potent: if desert is a fundamental claim of justice based on the act itself, *any* statutory cap set below what is deemed intrinsically deserved constitutes an injustice, regardless of operational benefits. The proposal cannot fully answer this moral objection; it requires accepting that the system must define desert *operationally* within practical and philosophical constraints.

  ## 4. ANALYSIS OF SPECIFIC FEATURES REQUIRING ATTENTION

  *   **A. The Reopener Clause Asymmetry:**
      *   **Rationale:** Sponsors argue backward-looking information (coercion, disability) directly impacts culpability (desert), hence justifies recalculating the retributive third. Forward-looking components (risk, rehab needs) are inherently prospective; new facts about the past offense shouldn't retroactively alter assessments of *future* risk or current program needs based on *current* circumstances.
      *   **Concerns & Modification Needed:** This logic holds generally but founders in a critical case: **when the new backward-looking information reveals that the *original* risk assessment was fundamentally flawed or contaminated by misinformation directly related to the offense circumstances.** For example, new evidence proving the offender acted under extreme duress might also reveal that the original "high risk" designation stemmed from a false assumption of voluntary, aggressive conduct. Maintaining the asymmetry here could perpetuate an injustice based on a now-debunked risk profile.
      *   **Recommended Modification:** Amend the reopener clause to state: *"Recalculation of the retributive portion shall not automatically necessitate recalculation of the forward-looking portion. However, if the new information demonstrates that the factual basis underpinning the original forward-looking assessment (particularly risk) was materially inaccurate and directly related to the offender's circumstances at the time of the offense, the sentencing court may, upon motion, reconsider the necessity or duration of the forward-looking component."* This preserves the core asymmetry but provides a safety valve for demonstrable, material error in the original forward-looking assessment rooted in the past offense facts.

  *   **B. The Earn-Down Endpoint:**
      *   **The Issue:** The proposal is silent on the status of any unreduced forward-looking portion after an offender successfully completes all programs, pays restitution, and demonstrates sustained low risk. Should this remainder be a binding ceiling (cannot be imposed), a binding floor (must be imposed), or a rebuttable presumption?
      *   **Implications & Recommendation:** Treating the remainder as a **binding ceiling** risks undermining the retributive cap's purpose; if the entire forward-looking portion *must* be waived upon compliance, it functionally nullifies the retributive third as the only fixed "deserved" punishment, aligning more with the Abolitionist view. Treating it as a **binding floor** ignores progress and potentially imposes confinement solely based on the original risk assessment, contravening the "earn down" principle and Compatibilist/Retributivist concerns about proportionality.
      *   **Recommended Approach:** Establish the unreduced remainder as the **presumptive maximum sentence** upon full compliance. The court retains discretion to impose less than this maximum (even zero) based on a finding that the purposes of the forward-looking component (public safety, rehabilitation) have been fully satisfied, but it *cannot* impose *more*. This approach:
          *   Honors the offender's successful efforts ("earn down").
          *   Respects the original assessment by setting a presumptive cap.
          *   Allows judicial flexibility based on current circumstances.
          *   Preserves the conceptual distinction: the retributive third was always "deserved" and served; the forward-looking portion was contingent and can be mitigated based on meeting its conditions.

  ## 5. RECOMMENDATION & IMPLEMENTATION
  *   **Recommendation:** Adopt the "desert cap" framework as a **3-year pilot program** for a defined class of mid-level felonies (to be specified by the Commission), **incorporating the modifications outlined above:**
      1.  Amend the reopener clause to allow reconsideration of the forward-looking component *only* if new backward-looking information demonstrates material factual error in the *original* forward-looking assessment (especially risk) directly tied to the offense circumstances.
      2.  Explicitly state that upon full satisfaction of all earn-down conditions, the unreduced forward-looking portion serves as the **presumptive maximum sentence** the court may impose, which it may reduce (including to zero) based on current findings regarding risk and rehabilitation.
  *   **Rationale for Adoption:** This proposal offers a concrete mechanism to move beyond the current philosophical stalemate. It acknowledges the retributive impulse without requiring metaphysical agreement on "basic desert," operationalizes rehabilitation and risk reduction in a tangible way through earn-downs, and provides a structure Compatibilists can endorse. A pilot allows empirical evaluation of its fairness, efficacy in reducing recidivism, administrative feasibility, and impact on sentencing disparities, informing future commission action. The modifications address critical operational ambiguities identified in our deliberations.
  *   **Strongest Counter-Consideration (Acknowledged):** The Retributivist critique that capping desert *by statute* fundamentally violates justice if the capped amount is less than what is intrinsically deserved remains a serious philosophical objection that the pilot structure cannot resolve. Proponents must accept that this is a pragmatic compromise accepting an operational definition of desert, not a vindication of pure retributive theory.
  *   **Implementation Timeline:**
      *   **0-3 Months:** Commission defines pilot offense classes, develops detailed earn-down criteria/metrics, drafts necessary guideline amendments and judicial training materials incorporating modifications.
      *   **3-6 Months:** Finalize amendments, secure necessary administrative approvals, conduct training for judges, prosecutors, defense counsel, and probation.
      *   **Month 6:** Pilot program commences for sentences imposed on or after this date.
      *   **Month 42 (3.5 Years):** Commission initiates formal evaluation based on 3 years of pilot data, including recidivism rates, sentence lengths, compliance rates, costs, and stakeholder feedback.
      *   **Month 48:** Commission votes on whether to terminate, modify, or make permanent the desert cap framework based on evaluation findings.

  ## 6. CONCLUSION
  The "desert cap" proposal, as modified, presents a viable path forward for the Commission. It respects the legislature's referral, offers a structured compromise acknowledging all philosophical perspectives, and provides a mechanism for testing a significant innovation in sentencing practice. By addressing the reopener asymmetry and earn-down endpoint concretely, the modified framework enhances operational clarity and fairness. I urge the Commission to adopt the pilot program as outlined to gather essential data and move this critical debate from theory to practice.
