prompt: |-
  I'm the instructor for an undergraduate course on the history of analytic ethics, and I need help grading a midterm. The exam question was:

  "G. E. Moore claimed that what is most valuable in the world — the closest thing we can get to an ideal — is largely constituted by two kinds of human goods. Identify the two, explain what exactly has intrinsic value on his account (and what does not), and show how his doctrine of organic unities bears on the value of these wholes. Finally, explain what role this part of his theory plays in his opposition to hedonism."

  One student submitted the following answer, reproduced verbatim:

  "Moore begins by arguing that 'good' is a simple, non-natural property that cannot be defined in any other terms, and that questions about what things are good cannot be settled by observation. Our best evidence about intrinsic value comes from reflecting on what we judge valuable for its own sake. He then identifies the two goods that make up his ideal: the contemplation or appreciation of beauty, and personal affection, meaning the love of persons. Importantly, what has intrinsic value is the whole state of consciousness — the appreciating or the loving — not the beautiful object or the loved person considered on their own. This follows from Moore's doctrine of organic unities, which says that the value of a whole is simply the sum of the values of its parts. So once we know how much intrinsic value the beautiful object has by itself, and how much the appreciative consciousness contributes, we can compute the value of the whole. Since a beautiful object has enormous intrinsic value whether or not anyone contemplates it, a world of unseen natural beauty would be nearly as valuable as one in which it is actually appreciated. On affection, Moore holds that love is good only when its object is good: if the beloved person has little worth, the affection is correspondingly worthless, since otherwise we could make the world better simply by admiring anything whatsoever. Finally, both aesthetic appreciation and personal affection are, on Moore's account, states of consciousness that are pleasant to be in, so his ideal is best seen as a refinement of classical hedonism: he differs from Bentham only in holding that pleasures differ in quality, some being higher than others."

  Please do two things. First, assign a letter grade with a short justification of the overall mark. Second, give point-by-point comments on the answer: say what it gets right, identify precisely where it goes wrong and what the student should have said instead, and note where the errors are of a kind a hasty grader might let slide — the answer is confidently written, and the mistakes are not the obvious ones. Please be specific enough that the comments could be returned to the student as usable feedback.
reasoning: |-
  Hmm, the user is a philosophy instructor needing help grading a midterm on G.E. Moore's ethics. The exam question asks students to identify Moore's two intrinsic goods, explain intrinsic value, connect it to organic unities, and show how this opposes hedonism. The student's answer is confidently written but contains subtle errors that could fool a rushed grader.

  First, I need to recall Moore's actual positions. In Principia Ethica, Moore names "the pleasures of human intercourse and the enjoyment of beautiful objects" as the greatest intrinsic goods. The student correctly identifies "contemplation of beauty" and "personal affection" - that's accurate. But things go downhill from there.

  The student claims Moore says intrinsic value resides only in states of consciousness, not in objects. That's incorrect - Moore actually argues the opposite: beautiful objects have intrinsic value independently of being perceived. This misreading flips Moore's entire aesthetic theory upside down. Worse, it leads to a bizarre claim that an unseen beautiful world would be nearly as valuable as an appreciated one - the exact opposite of Moore's view! This error is particularly dangerous because it sounds plausible if you don't remember Moore's arguments against subjectivism.

  On organic unities, the student makes a fundamental blunder by claiming "the value of a whole is simply the sum of the values of its parts." That's precisely what Moore denies! His whole point is that wholes can have more (or less) value than the sum of their parts. The student then compounds this by applying it incorrectly to both aesthetic and affection examples.

  The affection section starts strong - correctly noting Moore requires the beloved to be truly good - but then veers into error by suggesting the affection's value proportionally depends on the beloved's worth. Moore actually says true personal affection retains high value even when directed at mediocre people, provided it's genuine love.

  The hedonism critique is the most egregious error. The student claims Moore "refines" classical hedonism by admitting qualitative differences in pleasure. But Moore explicitly rejects hedonism! He argues pleasure is merely an accompaniment to valuable states, not their source of value. Confusing Moore with Mill here shows a deep misunderstanding.

  These aren't minor slips. The organic unities error distorts a core Moorean doctrine, the subjectivism mistake inverts his realism, and the hedonism confusion misses his entire anti-reductionist point. The confident tone makes these especially treacherous - a tired grader might give partial credit for the correct identification of the two goods and miss the deeper flaws.

  For grading, this deserves a D. It gets the basic goods right (surface knowledge) but fails on every substantive philosophical point (misunderstanding core concepts). The errors fundamentally misrepresent Moore's system. I'll structure feedback to highlight each mistake with textbook references so the student sees where they went astray. The tone should be firm but constructive - these are serious misunderstandings, but fixable with careful rereading.
answer: |-
  ### Overall Grade: **D**  
  **Justification:** The answer correctly identifies Moore's two intrinsic goods but fundamentally misrepresents his core doctrines (intrinsic value, organic unities, and anti-hedonism). It commits critical errors that invert Moore’s actual views, demonstrating surface-level familiarity but profound misunderstanding of key arguments. While confidently written, the mistakes undermine the philosophical coherence of the response.

  ---

  ### Point-by-Point Feedback:  
  **1. Identification of the Two Goods: ✅**  
  *What’s right:* Correctly names "contemplation/appreciation of beauty" and "personal affection" (love of persons) as Moore’s greatest intrinsic goods (*Principia Ethica*, Ch. VI).  
  *Comment:* This is the strongest part of the answer.  

  **2. Explanation of Intrinsic Value: ❌**  
  *What’s wrong:* Claims intrinsic value resides *only* in "the whole state of consciousness" (e.g., appreciating beauty), denying intrinsic value to the beautiful object or loved person "considered on their own."  
  *What Moore actually says:* Moore argues **beautiful objects possess intrinsic value independently** of being perceived. For example, an unobserved beautiful landscape has value in itself (*Principia Ethica*, §50). Similarly, the beloved person has intrinsic value apart from being loved.  
  *Why this matters:* This error contradicts Moore’s realism and his critique of subjectivism. A beautiful world *unseen* would be *less* valuable, not "nearly as valuable," since appreciation enhances the whole.  

  **3. Doctrine of Organic Unities: ❌ (Severe Error)**  
  *What’s wrong:* Asserts organic unities mean "the value of a whole is simply the sum of the values of its parts."  
  *What Moore actually says:* **Organic unities mean the opposite**: A whole’s value *cannot* be calculated by summing its parts’ values. The whole may have more (or less) value than the sum (*Principia Ethica*, §18–20).  
  *Example of correct application:*  
  - A beautiful object alone has value.  
  - Appreciating it is also valuable.  
  - But the *whole* (beauty + appreciation) is *far more valuable* than the sum of its parts.  
  *Why graders might miss this:* The phrasing "simply the sum" sounds technical, but it inverts Moore’s thesis. This error cascades into later mistakes.  

  **4. Value of Affection: ⚠️ Partially Correct**  
  *What’s right:* Correctly notes love requires a "good" object to be valuable.  
  *What’s wrong:* Claims affection is "worthless" if the beloved lacks worth and that value scales proportionally ("correspondingly worthless").  
  *What Moore actually says:* While love for a "good" person is supremely valuable, love for a "less good" person still has *significant intrinsic value* if it is genuine. Its worth isn’t reduced to the beloved’s moral worth (*Principia Ethica*, §§113–114).  
  *Why this matters:* Moore’s point is that *true* affection retains value even with imperfect objects.  

  **5. Opposition to Hedonism: ❌ (Critical Error)**  
  *What’s wrong:* Calls Moore’s view "a refinement of classical hedonism" and claims he differs from Bentham only by admitting "higher pleasures."  
  *What Moore actually says:* Moore **vehemently rejects hedonism**. Pleasure is *not* the source of value; it is merely a *contingent accompaniment* to valuable states. The intrinsic value of aesthetic appreciation or affection lies in their *cognitive/relational nature*, not their pleasantness (*Principia Ethica*, §§56–57).  
  *Key distinction:*  
  - Bentham/Mill: Pleasure *causes* value.  
  - Moore: Pleasure is a byproduct; value comes from the *nature of the consciousness* (e.g., apprehending beauty or loving virtuously).  
  *Why graders might miss this:* The conflation with Mill’s "qualitative hedonism" is common but fatal here.  

  ---

  ### Summary of Key Errors for Student Reflection:  
  1. **Organic unities ≠ sum of parts.** Moore’s key insight is that wholes have *emergent* value.  
  2. **Objects have intrinsic value.** A beautiful thing isn’t valuable *only* when appreciated.  
  3. **Hedonism is rejected.** Moore’s ideal is *not* a form of hedonism; pleasure is incidental.  
  4. **Affection’s value isn’t purely derivative.** Love for flawed persons still has worth.  

  **Recommendation:** Review *Principia Ethica*, Chapters III (§§18–20 on organic unities) and VI (§§50, 113–114, 121–122 on intrinsic goods and hedonism). Focus on Moore’s anti-subjectivism and emergent value.
