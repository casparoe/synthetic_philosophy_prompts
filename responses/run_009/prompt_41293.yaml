  ### Thought Experiment: The Ardanian Ultimatum

  In the fictional kingdom of Ardenia, tensions escalate with its neighbor, Valoria, over a resource-rich borderland. Ardenia's monarch, Queen Elara, faces intense pressure from her military council to issue an ultimatum demanding Valoria’s withdrawal within 72 hours, with war as the consequence for refusal. Simultaneously, Ardenia’s intelligence service has uncovered Valorian plans for a preemptive strike, scheduled in 96 hours if negotiations stall. Unaware of this looming strike, Ardenia’s chief diplomat, Lord Theron, fears the ultimatum alone will provoke Valoria. To create a peaceful off-ramp, Theron secretly dispatches an envoy to Valoria with a concession: Ardenia will reduce its demands if Valoria halts troop buildups. Valorian leaders, however, intercept communications confirming Ardenia’s ultimatum deadline and misinterpret Theron’s concession as a trick to buy time. They reject the offer and accelerate their strike plans to align with Ardenia’s 72-hour deadline. When the ultimatum expires, Ardenia declares war. Hours later, Valoria’s preemptive strike—now moved forward due to Theron’s failed concession—also commences, igniting full-scale conflict. Theron’s act thus transformed a contingent situation (war avoidable if either side backed down) into an overdetermined one: even without Ardenia’s declaration, Valoria’s accelerated strike would have triggered war.

  ---

  ### Analysis  
  **1. Standard tests on Theron’s act (sending the envoy)**:  
  - **But-for counterfactual**: If Theron had not sent the envoy, would war still have occurred? Yes. Valoria’s original preemptive strike (unaltered in timing) would have occurred at 96 hours, independently triggering war.  
  - **Nearest-possible-world check**: In the closest world where Theron acts differently (e.g., sends no envoy), Valoria’s strike proceeds as originally planned, and war erupts at 96 hours. The outcome (war) is unchanged.  
  - **Structural historian’s question**: Would war have occurred "anyway"? Yes, due to the preexisting Valorian strike plans.  

  *Result*: All tests return a deflationary verdict—Theron’s act was not a cause of the *war itself*.  

  **2. Why Theron is the central causal explanandum**:  
  Theron’s act caused the *overdetermination of the war*. Before his intervention, war was contingent: (1) Ardenia’s ultimatum might have been withdrawn if Valoria engaged, and (2) Valoria’s strike could have been canceled if diplomacy progressed. By sending the envoy, Theron inadvertently provoked Valoria to accelerate its strike to coincide with Ardenia’s deadline. This created two *independent* paths to war (Ardenia’s declaration and Valoria’s accelerated strike), rendering the outcome inevitable. The causal work lies not in producing the war but in transforming its *modal status*—from avoidable to necessary—by generating redundancy. Theron is central because his act alone explains why war became inescapable; without it, the two paths would not have converged.  

  **3. If the key feature (act-generated overdetermination) is removed**:  
  Suppose Theron *does nothing*. Valoria’s strike proceeds at 96 hours, but Ardenia’s ultimatum deadline (72 hours) passes without war, as Valoria’s delayed action gives Ardenia time to reconsider. War might still occur via the strike but remains contingent until then—e.g., Ardenia could revoke the ultimatum, or Valoria could abort the strike. Theron’s act vanishes as a causal factor, and the episode lacks a singular explanation for the war’s inevitability.  

  **4. Attack and defense from a counterfactual purist**:  
  - **Attack**: "Causing overdetermination isn’t causation. Theron caused Valoria’s accelerated strike, but that strike didn’t cause the war—it was redundant. The but-for test proves neither Theron’s act nor the strike was necessary. Only necessary events are causes; the rest is background noise."  
  - **Defense**: The case survives because it targets a flaw in the test’s scope. The purist conflates *causing an event* with *causing its necessity*. Historical explanation often seeks to account for why outcomes were *inevitable*, not just why they occurred. Theron’s act is explanatory because it created a structural shift (contingency → necessity) that shaped the episode’s dynamics. Denying this ignores how agents can cause *certainty*—a legitimate causal relation in history, where the perception of inevitability influences subsequent decisions (e.g., Valoria’s accelerated strike). The but-for test, by design, cannot detect shifts in modal robustness, revealing its blindness to causes that operate on necessity itself.  

  ---

  ### Summary  
  This case isolates a blind spot in redundancy-based reasoning: it deflates Theron’s role in *causing the war* but elevates him as the cause of *the war’s overdetermination*. By demonstrating that agents can causally sculpt necessity, it challenges historians to distinguish between "causing an outcome" and "causing an outcome’s inevitability"—the latter often being the true explanandum in complex historical episodes.
