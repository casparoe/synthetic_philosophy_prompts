prompt: |-
  So some context: I've been a research analyst at an effective-altruist-aligned global health funder for about two years, and I got assigned to present at next month's grants comittee meeting the case for carving out maybe 10% of the portfolio for what I'm internally calling "institutional" grants — things like funding tenant unions in low-income housing, litigation capacity for gig workers, community organizing in the factory districts where our other grantees operate — instead of putting it all into the usual bednets/deworming/vitamin A bucket. The committee is six people: four are hardcore measurement types (two ex-GiveWell-style analysts who live and die by cost-per-DALY estimates and want an RCT behind everything, one health economist, one philosphy PhD who's sympathetic to person-affecting stuff), plus two major donors who made their money in tech and think entirely in expected value and "is this legible" terms. Nobody in that room will be moved by vibes, and frankly that's fair.

  Draft my Q&A prep sheet: the objections I'll actually get from this specific room — not the generic anti-EA ones you'd get from a sociology department — ordered by how much damage they'd do, each phrased the way a measurement person would put it ("what's the denominator?", "who funds this if we don't?"), with a two-minute reply and a note on where the reply is soft. Cover at minimum: the measurability point (we fund what we can count, and this stuff can't be counted); the funging point, which I confess I always get backwards — if we skip the bednets someone else fills the gap, whereas our marginal dollar on a tenant union wouldn't be replaced, or is it the deworming side that gets crowded out? straighten me out on that; the accountability objection (this is just politics with donor money, and unlike a government we face no electorate); and the nastiest one, that even after you apply a big uncertainty discount, our own numbers still say the deworming dollar buys more welfare than the organizing dollar, so aren't I asking the org to knowingly do less good. And include the question I'm hoping nobody asks — the version of "isn't this just you getting bored of bednets" that's actually hard to answer.

  For what it's worth, my sketch of the argument is that the cost-effectiveness ranking between deworming and organizing isn't a fact we discovered but an artifact of what our measurement tools can see, and a portfolio restricted to legible interventions is like a map that only shows paved roads — you can drive it with total confidence and never learn where the villages are. Tell me if that sketch is actually weak, I'd much rather hear it from you than from the health economist mid-meeting.
reasoning: |-
  Okay, the user is a research analyst at an EA-aligned global health funder. They need to prepare a Q&A for a grants committee meeting. The goal is to argue for allocating 10% of the portfolio to "institutional grants" like tenant unions or worker litigation, instead of only bednets/deworming. The committee consists of measurement-focused individuals and tech donors who value legibility and expected value.

  First, I need to address the main objections they'll face. The user mentioned measurability, funging, accountability, and the welfare comparison. Let's start with the nastiest one: even after uncertainty, deworming shows higher welfare per dollar. The committee will challenge why they should choose something less effective. The user's sketch argues that cost-effectiveness rankings are artifacts of measurement tools. That's a solid point, but it needs reinforcement. I should suggest emphasizing that institutional grants address systemic issues that DALYs can't capture, like power imbalances or structural risks. Also, highlight that current models miss long-term, diffuse benefits.

  Next, the measurability objection. The committee will ask how to measure impact without RCTs. The user needs to show alternative metrics—process indicators, qualitative evidence, case studies. Comparing to historical precedents like civil rights movements could help. Acknowledge the uncertainty but argue for diversification to reduce systemic risk.

  Funging is tricky. The user admits they get confused. Fungibility means money is interchangeable. If the funder doesn't buy bednets, another might, so their dollars might not add net beds. But tenant unions are underfunded; their dollar likely adds unique value. The key is to distinguish between crowded markets (bednets) and neglected areas (community organizing). Emphasize that bednets are fungible, institutional grants aren't.

  Accountability: the committee might say this is political. The user should clarify that institutional grants address root causes of health issues, like housing affecting disease spread. Frame it as targeted systemic change, not politics. Stress that EA's scope includes institutional factors, avoiding partisan entanglements.

  The "bored of bednets" question is personal. The user must reframe it as evolving strategy based on evidence of limitations in current metrics. Highlight long-term engagement and feedback from grantees about systemic barriers.

  I should also consider unspoken needs. The user might fear credibility loss or career risk. They need strong, evidence-backed arguments to maintain trust. They might also seek validation that their approach isn't abandoning core EA values but expanding them strategically. Ensuring the proposal is seen as complementary, not replacement, is key. Emphasize the 10% carve-out as a pilot to gather data, reducing perceived risk.

  Finally, the user's sketch about the map analogy is good but needs concrete examples. Relate it to real scenarios, like how bednets reduce malaria but don't address why healthcare systems are weak. Institutional grants tackle those underlying causes, potentially leading to larger, sustained impacts. Stress that current tools can't quantify this, so diversification is necessary to explore and innovate.
answer: |-
  Here’s a targeted Q&A prep sheet for your committee, prioritizing high-damage objections and phrasing them in measurement/EA jargon. Your "map" analogy is **strong** but needs grounding in concrete reasoning for this audience. Below, objections are ordered by potential damage, with replies designed for a 2-minute limit, soft spots flagged, and your sketch refined.

  ---

  ### **Q&A Prep Sheet: Institutional Grants Proposal**

  **Core Refined Argument:** *"Our current cost-effectiveness rankings aren't discovered facts but outputs of measurement tools optimized for simple, short-chain interventions. This creates a systemic blind spot: interventions addressing institutional power asymmetries (e.g., tenant rights, worker bargaining power) are systematically deprioritized because their impacts are diffuse, long-term, and context-dependent. A 10% 'institutional' carve-out acts as an exploration function to mitigate this selection bias, targeting root causes of the health burdens our portfolio addresses. It’s not bednets vs. organizing—it’s investing in both treatment and system resilience."*  
  *(This frames it as risk mitigation/portfolio theory, not vibes.)*

  ---

  ### **Objection 1 (Highest Damage): Welfare Comparison w/Uncertainty Discount**  
  *"Even applying a 90% uncertainty penalty to your institutional grant’s welfare estimate, our median deworming grant still yields 10x more expected DALYs/dollar. Aren’t you asking us to knowingly choose less good?"*  
  **Reply (2-min):**  
  "Respectfully, this comparison assumes our deworming estimate captures the *full* counterfactual impact, and the institutional estimate misses only noise—not structural blind spots. But consider:  
  1. **Hidden Externalities**: Deworming’s DALY model excludes downstream institutional failures (e.g., a child cured of worms later dies from unsafe housing our grants don’t address).  
  2. **Systemic Risk**: If all funders ignore institutional fragility (e.g., labor exploitation enabling disease spread), our deworming gains face collapse risks unmodeled in RCTs.  
  3. **Asymmetric Uncertainty**: We discount institutional grants for *measurement uncertainty*, but discount deworming for *counterfactual fungibility* (see next point)—which we often underestimate.  
  The carve-out hedges against these unquantified risks. Our choice isn’t ‘known less good’ vs. ‘known more good’—it’s ‘local optimum’ vs. ‘exploring a higher-variance but potentially transformative space.’"  
  **Soft Spot**: Doesn’t prove institutional grants *are* better; argues our models are incomplete. Preempt with: *"If we only fund what we can perfectly measure, we optimize for the measurable, not the important."*  

  ---

  ### **Objection 2: Measurability / Lack of RCTs**  
  *"We fund what we can count. This ‘institutional’ work has no credible counterfactual, no RCTs, and no clear denominator for impact. How do we even define cost-effectiveness here?"*  
  **Reply (2-min):**  
  "Three responses:  
  1. **Proxy Metrics**: We *can* measure institutional grants via:  
     - **Process indicators** (e.g., tenant union win rate on repairs affecting 10,000 residents; precedent-setting litigation changing gig worker contracts).  
     - **Leading indicators** (reduced evictions → stable housing → observed health outcome improvements in linked datasets).  
  2. **Comparative Evidence**: Historical analogs (e.g., land reform reducing poverty traps, labor movements lifting health outcomes) show durable effects—though not RCT-clean.  
  3. **Portfolio Value**: These grants generate *information*: If we never fund them, we’ll never develop the tools to measure them. A 10% carve-out is a low-cost option to build that capacity."  
  **Soft Spot**: Proxy metrics may not convince hardcore DALYists. Emphasize: *"We accept proxy metrics in other high-impact areas (e.g., policy advocacy)—why not here, where the stakes are structural?"*  

  ---

  ### **Objection 3: Funging / Counterfactual Crowding**  
  *"Straighten this out: if we divert $ from deworming, another funder fills the gap (high fungibility). But tenant unions? Our $1 likely adds $1 of value (low fungibility). So isn’t the *real* cost of your proposal the crowded-out deworming?"*  
  **Reply (2-min):**  
  "You’ve nailed the nuance. Here’s the corrected fungibility picture:  
  - **Deworming**: High fungibility. GiveWell-style funding gaps are small; our marginal dollar likely displaces another funder’s dollar. True marginal impact ≈ 0.  
  - **Institutional Grants**: Ultra-low fungibility. No major funders back tenant unions in Dhaka’s slums or gig worker lawsuits in Lagos. Our $1 adds ~$1 of new capacity.  
  Thus, **diverting $ from deworming to institutional grants doesn’t crowd out deworming—it crowds out *other funders’ deworming dollars***. The cost isn’t lost DALYs; it’s reduced leverage with peers. But given diminishing returns in deworming funding, this trade-off is worth testing."  
  **Soft Spot**: Assumes institutional grants have zero fungibility. Hedge with: *"We’ll target hyper-neglected niches to minimize this risk."*  

  ---

  ### **Objection 4: Accountability & Legitimacy**  
  *"This is politics with donor money. Governments face voters; we face no electorate. Why should a tech-funded org decide which unions to back?"*  
  **Reply (2-min):**  
  "Three safeguards:  
  1. **Problem-Led, Not Ideology-Led**: We fund only where institutional dysfunction directly worsens health outcomes we already target (e.g., slum landlords blocking bednet access; factories poisoning waterways).  
  2. **Grassroots Alignment**: Partner with existing community orgs (like our vitamin A distributors) who identify these barriers—no top-down agenda.  
  3. **Outsourcing Legitimacy**: Fund intermediaries (e.g., trusted local NGOs) to make grant calls, insulating us from political fallout.  
  This isn’t ‘politics’—it’s *targeting the institutional roots of disease burden*, which is squarely within EA’s scope. Avoiding this because it’s ‘messy’ outsources systemic change to less rigorous actors."  
  **Soft Spot**: "Grassroots alignment" may not satisfy critics of elite-driven EA. Stress: *"We’re responding to frontline grantee feedback about structural barriers."*  

  ---

  ### **The Question You Hope Nobody Asks (But Should Prep For)**  
  *"Honestly, this sounds like you’re bored of bednets. After two years of DALY spreadsheets, you’re chasing shiny ‘systemic’ work that feels more meaningful—even if the numbers don’t back it. How is this not motivated reasoning?"*  
  **Reply (2-min):**  
  "If I were bored, I’d pivot to biosecurity or AI safety—not tenant unions in Dhaka. This proposal comes from:  
  1. **Evidence of Blind Spots**: 3+ grantees reported institutional barriers (e.g., bednets confiscated by corrupt landlords; health clinics closed after worker strikes).  
  2. **Diminishing Returns**: Deworming’s $/DALY is rising as coverage increases.  
  3. **Precedent**: OpenPhil’s labor mobility grants and IGC’s governance work show EA can tackle institutional factors rigorously.  
  Boredom would be sticking to routine. This is discomfort with *not exploring* a gap our models can’t see—but our partners live with daily."  
  **Soft Spot**: Personalizes the debate. Defuse with humility: *"I’d ask the same if our roles were reversed. That’s why I propose a time-bound pilot with clear kill criteria."*  

  ---

  ### **Key Tactical Notes**
  1. **Anchor to Health**: Always link institutional grants to concrete health outcomes (e.g., "tenant unions → housing repairs → reduced cholera").  
  2. **Pilot Language**: Call it a "3-year learning pilot" with a sunset clause—reduces perceived risk.  
  3. **Name Precedents**: Cite GiveWell’s Incubation Grants, FTX’s policy bets, or IGC’s governance work to avoid "this isn’t EA" reactions.  
  4. **Hard Metric**: Promise a "framework for institutional grant evaluation" within 12 months.  

  Your sketch was 80% there—just needed framing as **antifragility** (hedging model error) not "exploration." This committee will respect that. Good luck!
