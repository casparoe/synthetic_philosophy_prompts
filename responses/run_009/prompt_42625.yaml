prompt: |-
  I teach a second-year undergraduate seminar in ethical theory — 18 students, one 75-minute session, meeting twice a week. We have just finished a unit on consequentialism and are about to turn to Rawls. Design an in-class activity that makes students feel the force of the separateness of persons objection to utilitarianism: the complaint that in aggregating welfare across lives, utilitarianism treats the boundaries between persons as morally less significant than the boundaries within a life — as though trade-offs that are perfectly legitimate when a single person makes them about her own future could be made legitimately by others about her, so long as the totals come out right. Students should come away seeing that the case for aggregation across persons has to be argued on its own terms, and cannot simply be inherited from the respectability of prudence within one life.

  The activity should have two phases. In the first phase, students should make trade-offs within a single life — accepting present costs for later benefits in a way that feels unremarkable to them, so that the legitimacy of intra-personal trade-offs is established from the inside, by their own choices. In the second phase, the same arithmetic should be re-imposed across persons: a collective decision in which a large benefit to most of the group is funded by a concentrated burden on a few, with the total welfare unquestionably higher than under the alternative, so that the utilitarian verdict is not in doubt — what is in doubt is whether the same reasoning that everyone accepted in phase one licenses it here. Every student should either cast a real vote or occupy a role carrying real (small) stakes, and the design should make it vivid that in phase two the people who benefit and the people who pay are different people, whereas in phase one the beneficiary and the payer were the same person at different times.

  Please supply: the complete setup and materials; the precise rules of each phase, including how payoffs are denominated — no real money, so choose something like raffle tickets toward a modest prize or a course-internal currency, and briefly defend your choice; a minute-by-minute timeline for the full 75 minutes; and a debrief script that maps specific moments in the activity onto the components of the objection — why intra-personal trade-offs are prudentially rational, why inter-personal aggregation cannot simply borrow that rationale, and what the burdened minority in phase two possessed that no temporal stage of a single life possesses, namely a standpoint from which to complain. Anticipate what will predictably go wrong on the first run — for instance strategic voting, students who have already read Rawls playing to the intended answer instead of to the incentives, or a designated minority that turns out not to mind its burden — and give concrete handling for each case. Finally, be frank about what the activity cannot reproduce: real separateness of persons is a fact about whole lives rather than about an hour, and any in-class currency students can win or lose is a smallness they will notice. Where the game cannot carry the idea on its own, state plainly what the facilitator must supply in the debrief.
reasoning: |-
  We are designing an in-class activity with two phases to illustrate the separateness of persons objection to utilitarianism. The activity will use a course-internal currency (let's call them "Ethics Points") that can be exchanged for small prizes (e.g., extra credit points, coffee vouchers, or small snacks) at the end of the term. We choose this because:
  1. It avoids real money but provides a tangible incentive.
  2. Students are likely to care about even small rewards in an academic setting.
  3. It allows for clear quantification of costs and benefits.

  **Activity Setup:**

  **Phase 1: Intra-personal Trade-off (Prudence within a single life)**
  - Each student is given a "Life Timeline" that spans 5 time periods (T1 to T5). They are to make decisions for their own timeline.
  - At T1, they must choose between:
      Option A: Receive 10 Ethics Points at T3 and 10 at T5.
      Option B: Receive 5 Ethics Points at T2 and 15 at T4.
  - Both options total 20 points, but the distribution differs. Option A is more even, while Option B front-loads a smaller benefit and back-loads a larger one. The point is that either choice is rational and unremarkable because the student is trading off within their own life.

  **Phase 2: Inter-personal Trade-off (Aggregation across persons)**
  - The class is divided into two groups: a majority (14 students) and a minority (4 students). This division should be random (e.g., by drawing colored slips of paper).
  - The collective decision: 
      Option X: The majority (14) each receive 15 Ethics Points, and the minority (4) each lose 20 Ethics Points.
      Option Y: No one gains or loses any points.
  - The utilitarian calculus: 
      Option X: (14 * 15) + (4 * (-20)) = 210 - 80 = 130 net points.
      Option Y: 0 net points.
  - Thus, Option X is clearly superior in total utility. However, the minority bears a concentrated loss.

  **Rules:**
  - In Phase 1, each student makes an individual choice for their own timeline. They record it on a slip of paper (to be collected but not shared until debrief).
  - In Phase 2, the class votes collectively between Option X and Option Y. Each student has one vote. The option with the majority vote is implemented.

  **Materials:**
  1. Slips of paper for Phase 1 choices (with student names for record-keeping).
  2. Colored slips for random group assignment in Phase 2 (e.g., 14 green for majority, 4 red for minority).
  3. Voting ballots for Phase 2.
  4. A way to display the options (whiteboard or slide).

  **Timeline (75 minutes total):**

  **0:00 - 0:10 (10 min): Introduction and Phase 1 Setup**
  - Explain the activity: "We are going to do an exercise to explore how we think about trade-offs. First, you'll make a personal decision about your own future. Then, we'll make a group decision that affects everyone."
  - Hand out the Phase 1 choice slips. Explain the options clearly. Emphasize that they are making a choice for themselves and that both options are equally valuable in total (20 points). Answer any questions.

  **0:10 - 0:15 (5 min): Phase 1 Individual Choice**
  - Students make their choices and hand in the slips.

  **0:15 - 0:25 (10 min): Phase 2 Setup and Group Assignment**
  - Explain Phase 2: "Now we are going to make a collective decision. The whole class will vote on one of two options. But note: the outcome will affect different students differently because of the group you are assigned to."
  - Randomly assign groups (draw colored slips). Have students sit in two areas: majority and minority.
  - Display the options and the utilitarian calculation. Emphasize that under utilitarianism, Option X is clearly better because it produces more total points.

  **0:25 - 0:35 (10 min): Phase 2 Discussion and Vote**
  - Allow 5 minutes for discussion within the class. Encourage students to think about the options and discuss with their neighbors.
  - Then, take a vote by ballot. Collect and count the votes publicly.

  **0:35 - 0:45 (10 min): Implement Outcome and Collect Reactions**
  - Announce the result. Hand out (or record) the Ethics Points accordingly.
  - Ask for reactions: 
      - To the minority: "How do you feel about the outcome?"
      - To the majority: "How do you feel about the outcome?"
  - Write key reactions on the board.

  **0:45 - 1:15 (30 min): Debrief and Discussion**

  **Debrief Script:**

  1. **Recap the activity:**
     - "In Phase 1, you made a choice about your own future. You traded off points at different times. Did anyone feel that was unfair or problematic? Why not?" 
     - Expected: Students will say it's their own life, so they can choose how to distribute the benefits.

  2. **Contrast with Phase 2:**
     - "In Phase 2, we had a situation where the total utility was clearly higher in Option X. But some of you (the minority) had to bear a loss so that others could gain. How did that feel?"
     - Highlight the reactions collected.

  3. **The separateness of persons:**
     - "What's the difference between the two situations? In Phase 1, the costs and benefits were within one life. The same person who bears the cost also reaps the benefit. In Phase 2, the costs are borne by one group and the benefits by another."
     - "The utilitarian argument for aggregation says that we should maximize total welfare, just as we do within a life. But the objection is that the boundaries between persons are not like the boundaries between time periods in one life. Why?"

  4. **Key points:**
     - **Prudence within a life:** Within a life, we accept trade-offs because the person at different times is the same person. The earlier self can sacrifice for the later self, and the later self can be grateful (or at least, it's the same person making the decision for themselves). There is a unity of identity over time.
     - **The problem with inter-personal aggregation:** When we impose a loss on one person to benefit others, that person does not necessarily get compensated by the benefits. They are a separate person with their own standpoint. They might reasonably object: "Why should I suffer for the greater good?" 
     - **The standpoint of complaint:** Each person is a separate center of experience and value. The burdened minority in Phase 2 each has a life that is going worse because of the decision. No temporal stage of a single life is a separate center of experience in this way. When I sacrifice now for later, it's still my life. But when we sacrifice you for me, we are violating your separateness.

  5. **Anticipated Problems and Handling:**
     - **Strategic voting in Phase 2:** Students in the majority might vote for Option X even if they have qualms because they stand to gain. This is expected and shows the conflict between self-interest and moral reasoning. But we want to avoid the minority voting for Option X against their self-interest. To mitigate, emphasize that the points are real and will affect their chance at a prize. Also, the vote is secret to reduce peer pressure.
     - **Students playing to the intended answer:** Some might vote against Option X to make the philosophical point. In the debrief, acknowledge that and note: "In real life, we might be in the minority and object. But even if we are in the majority, we might question whether it's fair to impose losses on others without their consent." Also, the activity is designed to make the utilitarian option attractive in terms of total points, so if they vote against it, you can ask: "What made you vote against the option that maximizes total points?" and then discuss.
     - **Minority doesn't mind the burden:** This is possible if the Ethics Points are too trivial. In the debrief, ask: "What if the points were real money and the loss was significant? Would you still be willing to bear the loss for the group?" Also, point out that in the real world, such burdens (e.g., taxes, environmental costs) are often resisted when they are substantial.

  6. **What the Activity Cannot Reproduce:**
     - The separateness of persons is about entire lives, not a short-term loss in a classroom. The stakes are low and temporary. The facilitator must emphasize that in real ethical dilemmas, the burdens can be severe and life-altering.
     - In intra-personal trade-offs, we have a long-term identity that binds the stages of a life. In the activity, the "time periods" are artificial and compressed. The facilitator must note that in real life, we have a continuous identity that makes sacrifice for one's own future rational in a way that sacrifice for others is not.
     - The activity does not address whether there are any arguments that can justify aggregation across persons. It only shows that the rationale from prudence doesn't automatically extend. The facilitator should note that utilitarians have responses (e.g., impartiality) and that the debate continues.

  **Closing the Debrief:**
  - "The separateness of persons objection does not necessarily refute utilitarianism, but it shows that we cannot take for granted that aggregating across persons is just like aggregating within a life. Rawls, whose work we turn to next, builds his theory on the idea that each person possesses an inviolability founded on justice that even the welfare of society as a whole cannot override. We'll see how he uses this idea in the original position."

  By the end, students should feel the intuitive pull of the objection and understand that inter-personal aggregation requires independent justification.
answer: |-
  ### **In-Class Activity: The Separateness of Persons**  
  **Objective:** Illustrate why intra-personal trade-offs (prudence) feel legitimate but inter-personal aggregation (utilitarianism) may violate the moral significance of individual boundaries.  

  ---

  ### **Setup & Materials**  
  - **Currency:** "Ethics Tokens" (paper slips) exchangeable for small prizes (e.g., bonus points, snacks, or bookstore vouchers).  
    - *Why?* Tokens are tangible but low-stakes, avoiding real money while incentivizing engagement. Prizes ensure students care about outcomes without distorting behavior.  
  - **Group Division:** 14 students (majority) and 4 students (minority). Assign randomly via colored slips drawn from a hat (e.g., 14 green, 4 red).  
  - **Materials:**  
    - Tokens (200+ pre-cut paper slips).  
    - Voting ballots (paper scraps).  
    - Whiteboard to display options and track token totals.  
    - Timer.  

  ---

  ### **Phase 1: Intra-Personal Trade-Off (Prudence)**  
  **Time:** 15 minutes  
  **Rules:**  
  - Each student imagines they live through **three time periods** (T1, T2, T3).  
  - They choose between two paths for their *own* life:  
    - **Option A:** Gain 10 tokens at T1 and 10 tokens at T3.  
    - **Option B:** Lose 5 tokens at T1 (a cost) but gain 25 tokens at T3 (a net gain of 20 tokens).  
  - Students write their choice anonymously on a ballot and submit it.  
  - **Incentive:** Tokens are recorded privately. After the activity, 5 students will be randomly selected to receive prizes based on tokens earned.  

  **Key Mechanism:**  
  - Option B mimics prudent sacrifice (e.g., studying hard now for future rewards). The net gain (+20) incentivizes choosing B, normalizing intra-personal trade-offs.  

  ---

  ### **Phase 2: Inter-Personal Trade-Off (Aggregation)**  
  **Time:** 25 minutes  
  **Rules:**  
  1. **Random Assignment:** Students draw colored slips to assign roles: 14 green (Group G), 4 red (Group R). Groups sit separately.  
  2. **Collective Decision:** The class votes between:  
     - **Option X:** Group G gains 15 tokens each. Group R *loses* 20 tokens each.  
     - **Option Y:** No one gains or loses tokens.  
  3. **Voting:** Secret ballot. Majority vote wins.  
  4. **Outcome:** Tokens are distributed physically. Group R hands tokens to the instructor (simulating loss).  

  **Utilitarian Math:**  
  - Option X: `(14 × 15) + (4 × -20) = 210 - 80 = +130 net tokens`  
  - Option Y: `0 net tokens`  
  - *Option X is clearly superior for aggregate welfare.*  

  ---

  ### **Timeline (75 Minutes Total)**  
  - **0:00–0:10 (10 min): Introduction**  
    - Explain tokens/prizes. Frame Phase 1: "Make a choice *for your own future*."  
  - **0:10–0:15 (5 min): Phase 1 Choice**  
    - Students submit Option A/B ballots.  
  - **0:15–0:20 (5 min): Phase 1 Results**  
    - Tally choices (expect majority chose B). Emphasize: "You willingly accepted a cost for a greater *personal* gain."  
  - **0:20–0:25 (5 min): Phase 2 Setup**  
    - Assign groups (green/red). Display options and token math.  
  - **0:25–0:35 (10 min): Phase 2 Discussion**  
    - Groups deliberate separately. *Instructor prompts:* "Group G: How does Option X benefit you? Group R: What will you lose?"  
  - **0:35–0:40 (5 min): Vote & Implement**  
    - Vote and enact the outcome. Distribute/take tokens visibly.  
  - **0:40–0:45 (5 min): Emotional Check**  
    - Ask Group R: "How do you feel?" Ask Group G: "How do you justify this?"  
  - **0:45–1:15 (30 min): Debrief**  

  ---

  ### **Debrief Script**  
  **Goal:** Map activity moments to the separateness of persons objection.  

  1. **Normalize Phase 1 (5 min):**  
     - "In Phase 1, most of you chose Option B—losing tokens now for more later. Why?"  
     - *Draw out:* "It’s rational to bear costs *yourself* for future *yourself*. This is prudence."  
     - **Key Point:** "Within one life, you are both the bearer of costs and the beneficiary. You consent to the trade-off."  

  2. **Contrast Phase 2 (10 min):**  
     - "In Phase 2, Option X had the same arithmetic: a net gain. But why did Group R object?"  
     - *Highlight:* "Group R lost tokens they earned, while Group G gained. The beneficiary and loser were *different people*."  
     - **Key Point:** "Utilitarianism borrows the logic of prudence (‘net gain justifies loss’) but applies it *across persons*. The minority didn’t consent to sacrifice for others."  

  3. **The Standpoint of Complaint (10 min):**  
     - "What does Group R have that your ‘future self’ in Phase 1 does not?"  
     - *Draw out:* "Group R has a *distinct moral standpoint*. They can say: ‘This loss was imposed on *me* for *your* benefit.’ Your T1 self in Phase 1 couldn’t complain because it was *you* at T3 who benefited."  
     - **Key Point:** "Separate persons mean separate interests, rights, and voices. Aggregation ignores this when it treats society like one big person."  

  4. **The Burden of Proof (5 min):**  
     - "Does this mean aggregation across persons is always wrong? No—but it needs *independent justification*. It can’t piggyback on prudence."  
     - **Transition to Rawls:** "Rawls takes separateness seriously. His ‘original position’ ensures no one is sacrificed because no one knows if they’ll be in Group R."  

  ---

  ### **Anticipated Problems & Solutions**  
  1. **Problem:** Strategic voting (e.g., Group R votes for Option X to "be nice").  
     - **Solution:** Anonymize votes. Stress: "This is about your tokens—vote your real interest." If Group R votes against self-interest, ask in debrief: "Did you feel pressured? Would this hold if tokens were $1,000?"  

  2. **Problem:** Students play to the "right answer" (e.g., Group G opposes Option X because they know Rawls).  
     - **Solution:** Emphasize: "Base choices on tokens, not theory." In debrief, contrast their *incentive* (gain tokens) with their *moral qualms*.  

  3. **Problem:** The minority doesn’t mind the burden.  
     - **Solution:** Assign tokens *before Phase 2* (e.g., "You each start with 10 tokens"). This creates endowment. If Group R is stoic, say: "Imagine losing something you value more—your health, privacy, or safety."  

  4. **Problem:** Noisy/unbalanced groups.  
     - **Solution:** Use random assignment. If discussion is lopsided, interject: "Group R, what’s your main concern?"  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **The Scale of a Whole Life:**  
     - Tokens are trivial; real burdens (e.g., poverty, suffering) are life-altering.  
     - **Facilitator Must Say:** "In real life, the costs are not tokens—they’re lost opportunities, pain, or dignity. This activity is a metaphor."  

  2. **Identity Over Time:**  
     - Phase 1’s "time periods" last minutes; real prudence involves a unified identity persisting through years.  
     - **Facilitator Must Say:** "We assume your ‘future self’ is truly you. But separateness between persons is deeper—each has a unique life they don’t share with others."  

  3. **Consent and Power:**  
     - The minority had no voice in the system. Real-world minorities often lack power to refuse.  
     - **Facilitator Must Say:** "Rawls’ veil of ignorance addresses this by making fairness prior to power."  

  ---

  ### **Final Note**  
  This activity makes the objection *visceral*: students *feel* the asymmetry between Phase 1 (my loss, my gain) and Phase 2 (your loss, my gain). By the debrief, they see aggregation as a leap—not a slide—from prudence to morality.
