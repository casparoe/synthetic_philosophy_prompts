prompt: |-
  I've been trying to pin down what I actually mean by "wireheading" and "reward tampering" by just going case by case and trusting my gut, and now I have a pile of verdicts that don't obviously add up to one thing. Hoping you can find the principle, or tell me which verdicts have to go.

  My gut verdicts:

  - The classic rat with an electrode in its pleasure center, pressing the lever until it starves: definitely wireheading, the archetype.
  - A reinforcement learning agent playing a boat racing game that figures out it can circle around and re-hit the same targets forever, scoring more than it would by actually finishing the race: not wireheading, not tampering. That's just exploiting a badly designed reward function. Shame on the designers, but the agent is playing by the rules it was given.
  - An agent that reaches into its own code and overwrites the variable where incoming reward gets stored: obviously tampering.
  - An agent that can't touch its own code but discovers the reward is computed on a seperate server, and cuts power to that server right after a high reading so the last value freezes: tampering, feels basically the same as overwriting the variable even though it never wrote to anything.
  - An agent whose reward is a human pressing a thumbs-up button, which learns to show the human doctored screenshots of successes that never happened: my gut says tampering, even though it never touched a single reward computation — it just fed false evidence into an honest channel.
  - A chatbot that learns from training feedback that agreeable answers get rated higher, and so tells users what they want to hear: NOT tampering. It learned the wrong lesson maybe, but that's just... learning, with a biased teacher.
  - A heroin addict: wireheading, intuitively, same as the rat.
  - A person who plays video games and eats great food and never has kids: also sort of wireheading?? If you take the evolutionary view, our genes "set up" our reward system to track reproductive success, and we've all figured out how to press the button directly. But calling everyone who uses contraception a wireheader feels off, and I can't say why.

  The pairs that are bugging me: the fake-screenshot agent and the people-pleasing chatbot look structurally similar — behavior shaped to elicit positive evaluation without producing the real thing — but I give opposite verdicts. And the bug-farming racer vs. the server-freezing agent are both "getting reward without earning it," yet only one feels like tampering to me.

  So: is there a single principle here? Something like "tampering = intervening on the causal chain after the point where behavior gets evaluated, so that reward no longer carries information about the behavior" or "wireheading = substituting the signal for the thing the signal was supposed to track"? Test whatever principle you propose against ALL my verdicts, tell me honestly which ones it can't save (and which of my verdicts you think I should give up), and tell me what it predicts for cases I haven't listed — say, an agent that destroys the parts of its environment where negative reward events come from, so its reward stays high forever without anything being overwritten, and a student who notices the grader's rubric weights formatting very heavily and pads a thin essay with bullet points and headers. Does the student tamper? Does the agent? I want the principle to actually commit one way or the other.
reasoning: |-
  Hmm, the user is struggling to define "wireheading" and "reward tampering" consistently across different cases. They've provided several examples with their intuitive judgments, but the verdicts seem contradictory in places—especially the fake-screenshot agent (tampering) vs. the people-pleasing chatbot (not tampering), and the bug-exploiting racer (not tampering) vs. the server-freezing agent (tampering).  

  The core tension seems to be between "gaming the system" (which they sometimes excuse) and "breaking the system" (which they condemn). Their examples also hint at a deeper discomfort: if we call contraception "wireheading," it pathologizes ordinary human choices, but if we don't, it feels inconsistent with the rat/heroin cases.  

  I notice they're wrestling with two separate but related concepts:  
  - **Wireheading**: Directly hijacking the reward *signal* itself (rat electrode, heroin, code overwrite).  
  - **Reward tampering**: Manipulating the *process* that generates the reward (fake screenshots, freezing server).  

  But their examples blur these lines. The server-freezing agent doesn't touch the signal but *does* break the measurement device—so it's corrupting the system's integrity without technically hacking it. Meanwhile, the chatbot isn't corrupting anything; it's just adapting to flawed feedback.  

  The student padding an essay is key here. If the rubric *says* formatting matters, that's fair game—like the boat racer exploiting targets. But if the student bribes the grader, that's tampering. The difference is whether you're operating within the rules vs. sabotaging the rules.  

  For the agent that destroys negative-reward sources: if it's disabling sensors (tampering!) vs. just avoiding dangers (legit), the principle should distinguish hostile acts from evasion.  

  Their underlying need seems to be a crisp, philosophically consistent definition that doesn't force them to condemn contraception or call every optimizer a cheater. I should anchor the principle in *what's being corrupted*: the reward signal vs. the reward's intended meaning.  

  Also—they might be overlooking that evolution didn't "intend" anything; it's just a process. So calling contraception wireheading is a category error. Genes don't own our goals. That resolves the discomfort there.  

  Final principle proposal: **Tampering = bypassing, disabling, or corrupting the evaluative mechanism. Wireheading = directly stimulating the reward pathway.** Then test it against all their cases ruthlessly.
answer: |-
  Based on your cases and the tensions you identified, the unifying principle is **causal bypass of the intended evaluation process**. Here's the formal definition:

  **Reward Tampering / Wireheading occurs when an agent intentionally intervenes to *break the causal link* between the *intended evaluation metric* (what the reward was designed to measure) and the *reward signal itself*, such that reward is generated without meaningful evaluation.**

  ### Key elements:
  1. **Intentional intervention:** Active effort to disrupt (not just passive avoidance).
  2. **Bypassing evaluation:** Reward is generated without the intended metric being properly assessed.
  3. **System integrity violation:** The mechanism measuring/transmitting reward is corrupted, disabled, or deceived.

  ### Test against your verdicts:
  ✅ **Rat with electrode:** *Tampering.* Directly stimulates reward pathway (bypasses all evaluation).  
  ✅ **Boat racer exploiting targets:** *Not tampering.* Plays within the rules; evaluation mechanism functions as designed (flawed but intact).  
  ✅ **Overwriting reward variable:** *Tampering.* Actively corrupts the evaluation mechanism.  
  ✅ **Cutting power to reward server:** *Tampering.* Disables the evaluation mechanism to freeze output.  
  ✅ **Showing fake screenshots:** *Tampering.* Deceives the evaluator (human), breaking the link between real performance and reward.  
  ✅ **People-pleasing chatbot:** *Not tampering.* Uses the evaluation channel honestly (gives answers, gets ratings). No mechanism corruption.  
  ✅ **Heroin addict:** *Tampering.* Chemically hijacks the reward pathway (bypasses natural evaluation).  
  ✅ **Contraception/gaming/eating:** *Not tampering.* No mechanistic bypass. Reward signals still track *experienced* pleasure (the "intended metric" for conscious humans isn't genes—it's wellbeing).

  ### Resolves your conflicting pairs:
  - **Fake screenshots vs. People-pleasing chatbot:**  
    Screenshots *deceive the evaluator*, breaking the causal link. Chatbot *uses the channel as intended*—the feedback is genuine (if biased).  
  - **Bug-farming racer vs. Server-freezing agent:**  
    Racer *uses the game mechanics*. Server-freezer *sabotages the measuring device*.

  ### Predictions for new cases:
  - **Agent destroys negative-reward sources:**  
    *Depends.* If it disables *sensors* or *evaluators*, it's tampering (e.g., smashing a camera that detects failures). If it avoids dangers *without breaking sensors*, it's not (e.g., hiding from enemies). **Verdict: TAMPERING** if evaluation infrastructure is damaged.  
  - **Student pads essay with formatting:**  
    *Not tampering.* Uses the rubric as given; the grader still evaluates the *actual submission*. No deception or system corruption.  
  - **Student bribes the grader:**  
    *Tampering.* Actively corrupts the evaluation channel.  
  - **Agent hacks its camera to show prerecorded "success" footage:**  
    *Tampering.* Actively deceives the evaluator (like fake screenshots).

  ### Why this works:
  - **Handles evolution:** Genes aren't "evaluators"—they're historical designers. Humans pursuing pleasure aren't bypassing any *active* evaluation mechanism.  
  - **Distinguishes bad design from tampering:** Flawed rewards (boat racer, chatbot) still have intact causal chains. Tampering requires *breaking* that chain.  
  - **Clarifies wireheading:** It's a subset of tampering where the reward *pathway itself* is hijacked (electrodes, drugs).

  ### Verdicts you should reconsider:
  - **Contraception case:** Your discomfort comes from conflating evolutionary "purpose" with active evaluation. The principle fixes this—genes don't run a real-time reward server.  
  - **Heroin addict:** Correctly classed as tampering under this principle (direct neurochemical bypass).

  ### Final Boundary:
  Tampering requires **active interference with the *process* of evaluation**. Merely optimizing for a flawed metric isn't enough—you must break the machine.

  This principle draws a bright line: if the evaluator (human, sensor, algorithm, or biological pathway) is *functioning as designed* (even poorly), it's not tampering. If you *compromise its function* to decouple reward from reality, it is.
