prompt: |-
  A friend of mine — I'll call her Dana — is someone I met over a decade ago in the comments of a rationalist-adjacent blog, back when we were both arguing about whether definitions are supposed to point at clusters in thingspace or at clusters in argument-space, i.e., at whatever lets you win a fight. She went off to do a PhD in comparative genocide studies and now works for an organization that documents mass atrocities for use by courts and tribunals, so the word "genocide" is for her simultaneously a legal term of art, a moral category, and a diplomatic grenade. We have kept up a running seminar-by-email on which atrocities deserve the name, and I've accumulated enough of her verdicts that I now want to make some predictions before we meet next month, when three new cases are guaranteed to come up.

  Her track record so far: Rwanda in 1994, unambiguously genocide in her book. The Ottoman Armenians in 1915, likewise, and she gets visibly impatient with the recognition politics around it. Srebrenica in July 1995, genocide — but only Srebrenica: the wider Bosnian program of camps, expulsions, and ethnic cleansing outside that enclave she insists was crimes against humanity, not genocide, and she has been scathing about commentators who use the G-word as a synonym for atrocity. The Holodomor, on the other hand, she does call genocide. The Indonesian massacres of 1965–66, in which somewhere between half a million and a million alleged communists were killed, she rules out emphatically: a genocidal-scale atrocity aimed at the wrong category of victims. The Khmer Rouge period splits her verdicts the way the Cambodia tribunal's did — the destruction of the Cham and of the Vietnamese minority in Cambodia was genocide, while the million-odd Khmer victims of the regime were not genocide, because class enemies and political factions aren't among the kinds of groups the Convention was built to protect.

  Next month's cases: first, the campaign against the Uyghurs in Xinjiang — mass internment, mosque demolition, forced labor, and documented birth-prevention measures, with the destruction aimed ostensibly at culture and demographic growth rather than at bodies. Second, Canada's residential-school system and the Sixties Scoop — forcible transfer of Indigenous children into state and church institutions, with the perpetrators self-describing as benevolent assimilators rather than destroyers. Third, Franco's suppression of the Catalans — executions of Catalanist elites, bans on the language in schools, courts, and publishing, forced name changes — a case where the state's target was clearly a national group but the aim was the replacement of a culture rather than the elimination of a people. Predict her verdicts on all three. I'd like you to work out the rule or rules she is implicitly running — a strict Conventionism with special intent and the four protected groups, Lemkin's broader conception in which destroying a people's cultural foundations already begins the crime, some hybrid with a doctrine about when intent can be inferred from pattern (note the tension between her Holodomor verdict and her refusal to generalize from Srebrenica to the rest of Bosnia) — and to say which cases from her track record each candidate handles well or badly. Then give your best guess at her three verdicts with reasons, identify which of the three new cases is the sharpest discriminator between the surviving candidate rules, and propose a further hypothetical — a case I could pose to her over dinner — that would definitively split the rules you think are still tied. And since Dana would be the first to point it out: say whether you think any of your predictions would change if the recognition politics were flipped, i.e., if the politically convenient answer for her field happened to run the other way.
reasoning: |-
  Hmm, this user wants me to analyze Dana's pattern of genocide determinations based on her past verdicts and predict her stance on three new cases. Dana seems to apply a very specific, legally rigorous interpretation of genocide as someone who works with atrocity documentation for tribunals.

  Looking at her track record: Rwanda, Armenians, Srebrenica, and Holodomor are genocides in her view. But she excludes Indonesia 1965-66 and the Khmer Rouge's killings of Khmer people. The key distinctions appear to be: 1) protected groups under the UN Convention (national, ethnic, racial, religious), 2) specific intent to destroy the group, and 3) physical-biological destruction rather than cultural destruction alone. Her rejection of "genocide" for wider Bosnia despite mass atrocities shows she draws strict boundaries around the term.

  For the new cases: 
  - Uyghurs: China's actions target cultural/demographic destruction but avoid explicit physical extermination. Dana would likely reject genocide label due to lack of physical destruction intent. 
  - Canada's residential schools: Forcible transfer of children falls under UN Genocide Convention Article 2(e). Dana should call this genocide despite "benevolent" framing. 
  - Franco's Catalans suppression: Cultural destruction without physical elimination intent. She'd likely reject genocide label, consistent with her Bosnia distinction.

  The sharpest discriminator is probably the Uyghur case - it tests whether cultural destruction plus indirect physical measures (birth prevention) meets her threshold. To split between possible interpretations, I'd propose a hypothetical about forced sterilization of a religious minority without killings. 

  Interestingly, her Holodomor verdict (genocide despite Soviet denials) suggests she prioritizes evidence over political narratives. Only the Uyghur case might shift if political pressures reversed, given current geopolitical tensions around China.
answer: |-
  Based on Dana's track record and professional context, her approach appears to be a **strict legal-intentionalist interpretation of the UN Genocide Convention (1948) with four non-negotiable pillars**:

  1.  **Protected Groups Only:** National, ethnic, racial, or religious groups (per Convention Article II). Political, social, or economic groups are excluded.
  2.  **Specific Intent (Dolus Specialis):** The perpetrator must *intend* to destroy the group "in whole or in part." Intent is paramount and distinct from motive or consequence.
  3.  **Physical/Biological Destruction:** The acts listed in the Convention (killing, causing serious harm, inflicting conditions to destroy, preventing births, forcibly transferring children) must target the *physical existence* of the group. *Cultural destruction alone is insufficient.*
  4.  **Pattern of Acts:** A sustained pattern of Convention-listed acts directed at the protected group, from which intent can be inferred, is required. Scale alone doesn't define genocide.

  **Candidate Rules Tested Against Track Record:**

  1.  **Strict Conventionism (as above):**
      *   **Handles Well:** Rwanda (clear intent, protected group, physical destruction), Armenians (ditto), Srebrenica (specific intent focused on Bosnian Muslims), *Rejects* Indonesia 1965-66 (political group), *Rejects* Khmer Rouge killings of Khmers (political/class group), *Rejects* wider Bosnian atrocities (lacks specific genocidal intent beyond Srebrenica, often crimes against humanity).
      *   **Handles Poorly:** Holodomor (Ukrainians as a national group? Intent to *destroy* them vs. reckless disregard/callousness during forced collectivization? This is the biggest tension).

  2.  **Lemkin's Broader Cultural Destruction Concept:**
      *   **Handles Well:** Holodomor (could encompass destruction of national identity/peasantry), *Potentially* Catalonia or Canada.
      *   **Handles Poorly:** *Rejects* Indonesia 1965-66 (Lemkin included political groups, Dana rejects this), *Rejects* Khmer Rouge killings of Khmers (Lemkin would likely include, Dana rejects), *Accepts* Srebrenica but *rejects* wider Bosnia (Lemkin's concept is broader, less focused on specific intent for physical destruction in one event).

  3.  **Hybrid (Convention + Strong Inference Doctrine):**
      *   **Handles Well:** Holodomor (intent inferred from scale, methods, and specific targeting of Ukrainian peasants/national identity), Rwanda, Armenians, Srebrenica.
      *   **Handles Poorly:** *Rejects* Indonesia 1965-66 (scale is there, but wrong group), *Rejects* wider Bosnia (pattern exists, but intent inference insufficient for Dana; she insists on the specific intent proven at Srebrenica).

  **Resolution of Tension (Holodomor vs. Wider Bosnia):** Dana likely resolves this by:
      *   Viewing Ukrainians (specifically the peasantry/nationalists resisting collectivization) as a *national group* protected under the Convention.
      *   Inferring *specific intent to destroy that group physically* from the scale, methods (confiscation of *all* food, blockade, targeting of Ukrainian cultural/religious leaders), and documented statements/actions showing the famine was used as a weapon against Ukrainian nationhood. This contrasts with Bosnia outside Srebrenica, where the pattern (while horrific) showed intent for expulsion/ethnic cleansing (crimes against humanity) rather than systematic physical destruction of the group *as such*.

  **Dana's Implicit Rule:** **Strict Conventionism + Doctrine of Strong Inference of Specific Intent from Pattern & Methods for Protected Groups.** She requires compelling evidence that the perpetrator aimed at the physical destruction of a national, ethnic, racial, or religious group, evidenced by a pattern of Convention-listed acts.

  **Predictions for New Cases:**

  1.  **Uyghurs (China/Xinjiang):** **NOT Genocide (Crimes Against Humanity/Persecution).**
      *   *Reasoning:* Protected group exists (ethnic/religious). Acts include serious harm, conditions of life, *arguably* prevention of births. **Crucially:** Dana will likely argue the *intent* is primarily cultural erasure, assimilation, and suppression of separatist sentiment, *not* physical/biological destruction. The methods (re-education camps, forced labor, birth control) aim at *eliminating identity and political resistance*, not bodies. The "destruction" claimed is cultural/demographic, not physical extermination. While horrific, it lacks the specific *dolus specialis* for genocide under her strict interpretation.

  2.  **Canada's Residential Schools & Sixties Scoop:** **GENOCIDE.**
      *   *Reasoning:* Indigenous Peoples are a protected group (racial/ethnic/national). The acts constitute **forcible transfer of children** with the *intent* (inferred from perpetrator statements like "kill the Indian in the child") to destroy the group by preventing births *within* the group (cultural destruction via assimilation was the mechanism to achieve this biological end). The sustained, state-sponsored pattern directly matches Convention Article II(e). Dana would dismiss the "benevolent" framing as irrelevant to the genocidal intent and impact.

  3.  **Franco's Suppression of Catalans:** **NOT Genocide (Cultural Repression/Persecution).**
      *   *Reasoning:* Protected group exists (national). Repressive acts occurred (killings of elites, linguistic/cultural suppression). **However:** The *intent* was clearly to crush separatism and forcibly assimilate Catalans into a unitary Spanish identity, *not* to physically destroy them. The methods targeted cultural expression and political leadership, not the biological base of the group. There's no pattern of mass killings, serious bodily/mental harm, or prevention of births *aimed at eliminating the group physically*. It was repression aimed at cultural erasure, not genocide.

  **Sharpest Discriminator:** The **Uyghur case** is the sharpest discriminator. It pushes hardest on the boundary between cultural destruction/assimilation (which Dana excludes, per Bosnia) and physical destruction (which she requires). The documented birth-prevention measures make it a close call, but Dana's rejection of cultural destruction as sufficient and her likely reading of China's *intent* as primarily political/cultural control strongly points to "not genocide" under her rule.

  **Definitive Hypothetical to Split Rules:**

  Assume two candidate rules remain plausible: **Strict Conventionism (SC)** and **Hybrid with Strong Inference (HSI)**.

  *   **Proposed Hypothetical:** A state systematically *sterilizes all members* of a distinct religious minority within its borders. The state explicitly states its goal is to eliminate the minority's "undesirable" religious beliefs and practices by ensuring no future generations are born *into that religion*. There are no mass killings, torture, or camps; only compulsory sterilization. The minority group continues to exist physically, but faces demographic extinction within a generation. The state claims this is "humane assimilation."

  *   **How it Splits the Rules:**
      *   **Strict Conventionism (SC):** Likely **NOT Genocide**. While preventing births (Art II(d)) occurs on a group, the *intent* is framed as cultural/religious eradication, not physical destruction *per se*. The group isn't killed; they are prevented from reproducing *as that group*. Physical existence continues until demographic death. The *dolus specialis* is arguably cultural, not biological annihilation (though the biological outcome is identical).
      *   **Hybrid with Strong Inference (HSI):** Likely **GENOCIDE**. The pattern is clear and Convention-listed (preventing births). The intent to destroy the group "in part" (its future generations) is explicit and undeniable. The method *is* biological destruction via preventing births, even if framed culturally. The strong inference doctrine treats the intent to destroy the group via this method as meeting the *dolus specialis* for genocide. The cultural framing is irrelevant to the genocidal outcome.

  **Recognition Politics:** Dana's Holodomor verdict (where recognition is politically contested) and her impatience with Armenian recognition politics suggest **she prioritizes evidence and legal interpretation over diplomatic convenience**. Therefore:
  *   **Uyghurs:** Might be *more* likely to call genocide *if* it were politically convenient for her field (as it would pressure China), but her strict rule likely overrides this. Prediction stands (Not Genocide).
  *   **Canada:** Might be *less* likely to call genocide if it were politically inconvenient (as it implicates a Western ally), but the evidence is so clear-cut under Art II(e) that her rule likely compels the verdict. Prediction stands (Genocide).
  *   **Catalans:** Minimal change. Recognition politics are less intense here; her rule clearly excludes it regardless.

  **Conclusion:** Dana operates with rigorous fidelity to the Genocide Convention's core elements, emphasizing specific intent for physical/biological destruction of the four protected groups. Her verdicts reflect this demanding standard, distinguishing genocide from other atrocity crimes even when the scale is immense.
