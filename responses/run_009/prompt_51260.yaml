  First, I'll break down each argument:
  Maya's initial point about diagnosis changing self-perception is psychologically valid - diagnostic labels do create framing effects. But Dan correctly counters that traits existed first, and self-knowledge is beneficial. The "pathologizing" accusation feels overstated though.

  For Maya's second move about category drift - she's right that diagnostic categories evolve socially, but Dan's fever analogy holds because autism also has biological underpinnings. His money example is strong too - socially constructed things can be real. 

  Maya's loop argument about no fixed criteria seems weakest - autism assessment does use objective measures alongside self-report. Dan's pragmatic close feels most compelling: what matters is utility, not perfect correspondence to nature.

  They're both missing how diagnosis can be simultaneously descriptive and formative - it's not either/or. Dan edges it by focusing on real-world benefits over philosophical purity. I'll structure the JSON to reflect these nuances, ensuring each verdict ties to their actual arguments.
