  I should note where the translation takes sides. Treating disagreement as evidence about reliability is a conciliationist move. If I started from steadfastness, I might frame it as a conflict between models where you need to check calibration first. Also, the idea of "private evidence" in philosophy doesn't have a direct analog in stats, since all evidence should be shareable.

  Settled math includes Bayes' theorem, model averaging, calibration. Contested areas are whether priors can be empirical or how to assign weights in pooling. I need to flag that using Bayesian updating for peer disagreement assumes that reliability is a learnable parameter, which not all philosophers accept.

