  Steadfastness argues for sticking to your initial judgment. That could relate to hierarchical modeling where you have meta-priors about your own reliability. Or maybe it's about not updating away from your prior without strong evidence. The right reasons view might be like trusting your model selection process, so even if others disagree, you stick with your model.

