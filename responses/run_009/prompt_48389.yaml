prompt: |-
  Just spent like three hours arguing with my friend Marco and I want to know whether the thing we were arguing about has an actual name, because neither of us could pin one down and it's driving me crazy.

  The pattern I noticed: some cooperative arrangement works fine as long as it's open-ended, and the moment a fixed end point becomes known to everyone, it collapses -- and the collapse starts way before the actual end. Concretely: at my old job everyone covered each other's shifts for years, nobody kept score. Then it was announced in spring that the office would close in December. By October nobody would cover anything, then September, and it kept crawling backwards -- and the frustrating part is that each individual refusal was sort of reasonable? If you're sure nobody will cover you in November, it's dumb to cover someone in October, and if they're sure you won't in October... Marco kept saying it's just "trust breaking down," but that doesn't feel right at all: everyone still liked each other, nobody was angry, it was more like a clean mathematical unraveling from the end backwards. And once I saw it there I noticed it elsewhere: nobody starts any joint project with the person who's moving abroad in June, even back in February, apparantly something similar happens with leases and end-of-season stuff too.

  But here's the part that really bugs me. Marco's sister took one game theory course and says the conclusion "everyone bails at the first opportunity" follows from reasoning backwards from the end, assuming everyone is rational. Except empirically that's not what people do -- in lab games with a fixed number of rounds, people cooperate for a while and only quit near the end, and they end up making more money than the theory says they should. And there's a genuinely weird puzzle about what you should infer when somebody cooperates past the point where bailing was supposedly the rational move: it seems to prove they're not the "rational type" the whole backwards argument assumed, which maybe means the argument collapses once you see it happen? I keep going in circles on this. So my question: does this configuration -- the unraveling from a known end, plus the puzzle of the irrational cooperator -- have an established name or names, how do the pieces fit together, and how is it different from an ordinary prisoner's-dilemma-style breakdown? If there isn't one neat name for the whole thing, carve it up for me and tell me what each piece is called, because I will not accept just "game theory" or "loss of trust" as an answer.
reasoning: |-
  Okay, the user is describing a situation where a cooperative system collapses once a fixed endpoint is known, unraveling backwards from that endpoint. They argued with their friend Marco about it and want to know if this phenomenon has a name. The user isn't satisfied with vague terms like "trust breaking down" or just "game theory." They're looking for specific terminology and how the pieces fit together.

  First, I recall that the backward unraveling from a known endpoint sounds exactly like the Centipede Game in game theory. In the Centipede Game, players take turns cooperating or defecting over multiple rounds. Rational players, using backward induction, would defect immediately. But in reality, people cooperate until near the end. This matches the user's office shift example where cooperation collapsed once the closure date was announced.

  The user is also puzzled by why people cooperate past the point where defection is rational. That ties into the Centipede Game Paradox. The paradox is that rational play predicts immediate defection, but experiments show sustained cooperation. This discrepancy is because real people aren't purely rational; they have social preferences, fairness concerns, and reciprocity instincts. 

  Another term that comes to mind is the Endgame Problem or Endgame Effect. This refers to the breakdown of cooperation as the endpoint approaches. It's a common issue in repeated games where the end is foreseeable. The user mentioned leases and end-of-season scenarios, which fits here.

  The user also contrasts this with the Prisoner's Dilemma. While both involve cooperation vs. defection, the key difference is the fixed endpoint. In PD, without a known end, cooperation can be sustained through strategies like Tit-for-Tat. But with a fixed endpoint, backward induction forces defection. The user wants clarity on this distinction.

  Marco's sister mentioned that rational players should bail early. But empirical evidence from lab experiments, like those by Robert Aumann or McKelvey/Palfrey, shows people cooperate until late stages. This is due to factors like bounded rationality, learning, and social norms. The user's frustration with the "rational type" assumption is spot on. If someone cooperates beyond the predicted defection point, it challenges the backward induction model, suggesting other factors at play.

  The user's deeper need seems to be understanding the tension between theoretical predictions and real-world behavior. They want to articulate why their office's cooperation collapsed mathematically, not just due to broken trust. They also seek validation that their observation has recognized terms, helping them communicate this concept better in future discussions.

  So, the main components are:
  1. **Centipede Game**: The backward unraveling structure.
  2. **Centipede Game Paradox**: The conflict between theory and observed cooperation.
  3. **Endgame Problem**: The breakdown near the endpoint.
  4. **Bounded Rationality & Social Preferences**: Explaining why people cooperate despite theoretical defection.

  Differentiating from Prisoner's Dilemma: PD without a known end can sustain cooperation via strategies like Grim Trigger. But the known endpoint changes the game, making backward induction applicable.

  The user might also appreciate terms like "Backward Induction Failure" or "Reputation Building" (where early cooperation signals trustworthiness). The key takeaway is that while backward induction predicts unraveling, real-world factors delay it until the endgame, and the "irrational" cooperators actually make everyone better off.
answer: |-
  Your observation is razor-sharp, and you're absolutely right that "trust breaking down" is inadequate. This phenomenon has **specific, established names in game theory and behavioral economics**, and the pieces fit together beautifully. Here's the breakdown:

  ### 1. **The Backward Unraveling from a Known Endpoint:**
     * **Name: The Centipede Game Paradox (or simply the Centipede Game)**.
     * **What it is:** This is the core model for your shift-coverage collapse. Imagine a sequential game with two players taking turns. Each turn, a player can "Take" a small pot (defect) immediately, or "Pass" (cooperate), letting the pot grow larger for the *other* player to potentially take on their next turn. The game has a known, fixed end round.
     * **Rational Prediction (via Backward Induction):** Players reason backwards from the known final round. The last player will always Take (as there's no future cooperation to incentivize Passing). Knowing this, the second-last player Takes (since if they Pass, the last player will Take anyway, leaving them with less). This logic cascades backwards all the way to the *very first move* – pure self-interest dictates that Player 1 should Take immediately, resulting in the *worst possible collective outcome*.
     * **Your Office Example:** This is a perfect fit. The "pot" is the mutual benefit of shift coverage. The "known end" was December. Backward induction predicts: "In the last week, nobody will cover (Take). Knowing that, why cover in the second-last week? (Take). And so on..." leading to the collapse starting in September/October and accelerating backwards.

  ### 2. **The Puzzle of the "Irrational" Cooperator:**
     * **Name: The Centipede Game Paradox (Part 2) / Failure of Backward Induction / Behavioral Game Theory Findings.**
     * **The Paradox:** The rational prediction (immediate defection) is almost *never* observed in experiments with real humans. People consistently Pass (cooperate) for many rounds, only defecting near the very end. This leads to significantly *higher payoffs* for everyone than the rational prediction. This is the paradox: the "irrational" behavior yields better results.
     * **Why it Happens (Why Marco's Sister is Wrong Empirically):**
       * **Bounded Rationality:** Humans aren't perfect backward inducters, especially over long sequences. We use simpler heuristics.
       * **Social Preferences:** People care about fairness, reciprocity, and not being seen as the jerk who ruined it. They intrinsically value cooperation.
       * **Conditional Cooperation & Reputation:** People cooperate initially *expecting* others to reciprocate. They build a reputation as a cooperator to encourage future cooperation. Defecting early destroys this reputation.
       * **Learning & Uncertainty:** Players aren't 100% sure others are purely self-interested "rational types." When someone cooperates past the theoretical defection point, it signals they *might* be a "conditional cooperator" or care about fairness. This makes others *more* likely to cooperate in subsequent rounds, delaying the collapse until much later. Your insight is spot on: seeing cooperation *disrupts* the assumption of universal rationality needed for the backward induction argument to hold perfectly.
       * **Focus on the Present:** Humans are more influenced by immediate gains/losses and social pressures than complex future contingencies.

  ### 3. **The General Phenomenon of End-Game Collapse:**
     * **Name: The Endgame Problem (or Endgame Effect) in Repeated Games.**
     * **What it is:** This is the broader category encompassing the Centipede logic. In *any* repeated interaction (like shift coverage, joint projects, seasonal work, leases) with a known, definite endpoint, the logic of backward induction implies that cooperation must unravel as the end approaches. Knowing there's no future punishment for defection removes the incentive to cooperate in the final interactions. This logic then infects the interactions just before the end, and so on.
     * **Distinguishing Feature:** The *known, fixed endpoint* is crucial. This is what differentiates it dramatically from an indefinitely repeated game.

  ### How This Differs from a Standard Prisoner's Dilemma Breakdown

  *   **Prisoner's Dilemma (PD):** A *single* interaction or the *stage game* within a repeated interaction. The dominant strategy is always to defect, regardless of what the other player does. Cooperation is unstable without external mechanisms.
  *   **Repeated Prisoner's Dilemma (Indefinite End):** Cooperation *can* be sustained (e.g., using Tit-for-Tat, Grim Trigger) because the threat of future punishment deters defection. The "shadow of the future" is long and dark. Trust (built on the expectation of reciprocity) is the key mechanism.
  *   **Repeated Prisoner's Dilemma with Known Fixed End (The Endgame Problem):** This is where your scenario lives. The moment the end is known and finite, the logic of the Centipede Game kicks in. The "shadow of the future" shrinks dramatically as the end approaches. Backward induction predicts defection will start earlier and earlier. **The crucial difference is the fixed endpoint enabling backward induction.** Trust, in the sense of expecting *long-term* reciprocity, specifically *collapses due to the mathematical logic imposed by the endpoint*, not necessarily due to interpersonal animosity (as your office example showed).

  ### Putting the Pieces Together: Your Scenario Named

  1.  **The Overall Structure:** A **Repeated Prisoner's Dilemma with a Known Fixed Endpoint**.
  2.  **The Unraveling Mechanism:** **Backward Induction** as modeled in the **Centipede Game**.
  3.  **The Predicted (but rarely observed) Outcome:** Immediate or very early collapse of cooperation due to backward induction.
  4.  **The Observed Outcome:** Sustained cooperation until near the end, followed by collapse – explained by the **Centipede Game Paradox** and findings from **Behavioral Game Theory** (bounded rationality, social preferences, reputation building, conditional cooperation).
  5.  **The Core Puzzle:** Why cooperate past the "rational" point? This is the heart of the **Centipede Game Paradox**. It works because:
      *   Players aren't purely rational backward inducters.
      *   Cooperation signals non-selfish types or builds valuable reputation.
      *   The assumption of universal rationality is violated, undermining the backward induction prediction.
      *   It empirically leads to better outcomes for everyone.

  ### In Summary

  *   **The phenomenon:** **Endgame Problem** in a **Repeated Prisoner's Dilemma**.
  *   **The specific unraveling pattern:** **Backward Induction** as per the **Centipede Game**.
  *   **The clash between theory and reality:** The **Centipede Game Paradox**.
  *   **Why reality differs:** **Behavioral Game Theory** (social preferences, bounded rationality, reputation).

  You were intuitively grappling with one of the most fascinating and well-documented clashes between classical rational actor models and actual human behavior. Marco's sister was technically correct about the *rational prediction* based on backward induction, but the *empirical reality* you observed (and described perfectly with your office) is the dominant finding in experiments. The "irrational" cooperators are the glue that holds society together longer than pure logic predicts, and they often make everyone better off in the process. Your frustration about the "clean mathematical unraveling" is precisely the insight captured by the Centipede Game model.
