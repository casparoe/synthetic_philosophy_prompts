prompt: |-
  My country has a national election coming up and I'm genuinely stuck on what to do with my vote, and honestly on whether to cast one at all. I live in a fairly marginal constituency, so it's not totally hopeless that my vote could matter, though obviously the odds are still tiny. The situation: there are two major candidates with a realistic chance. One of them is clearly worse on basically everything I care about. The other one is bad in one specific way that really gets to me — I volunteered for years with an organization this candidate's party voted to strip of funding, and some of my friends were directly harmed by that policy. Then there's a small third party I actually like, which polls around 3% and has no chance of winning my seat. My options as I see them: hold my nose and vote for the lesser evil, vote third party as a kind of signal, formally spoil my ballot as a protest (which is counted and reported here), or stay home.

  I've been arguing about this with two friends and I feel like they're each holding one half of something. One of them says my vote is basically pointless causally — one vote among tens of thousands — so I should feel free to do whatever expresses my values, and for him that means voting third party or spoiling. The other one counters that if everyone reasoned like that democracy would collapse, so I have a duty to vote, and having accepted that duty, the only responsible move is to vote against the worse candidate — anything else, he says, is treating my ballot as a personal diary entry instead of a piece of collective machinery. What bugs me is that they seem to be using totally different pictures of what a vote even *is*: one treats it as a tiny act of expression that's mine, the other as a contribution to a joint action where the point isn't my individual impact but my participation in the procedure, like showing up for jury duty. And there's a nagging third thought I can't shake: if I vote for the lesser evil, am I partly responsible for the bad things that candidate does, in a way I wouldn't be if I abstained? My "clean hands" friend says yes, that abstaining or spoiling keeps me out of it. That feels both right and like a cop-out.

  I don't want a survey of positions or a "here are the considerations, you decide" — I've basically done that myself and it's why I'm stuck. Take a stance: tell me what you'd actually do in my situation, which of my three friends' pictures (if any) you think is closest to correct, whether the complicity/clean-hands thought is doing real work or is just confused, and defend your call against what you take to be the strongest objection to it. It's fine to say where you're least confident, but commit to a recommendation.
reasoning: |-
  Okay, I need to really dig into this user's dilemma about voting. They're stuck between several options: voting for the lesser evil, a third party, spoiling the ballot, or not voting at all. Their situation is complex because they live in a marginal constituency, so their vote might actually matter more than usual. But the emotional weight comes from their personal history—volunteering for an organization that lost funding due to one candidate's party, which directly hurt their friends. That's a deep, personal wound affecting their choice.

  First, I should unpack their core conflict. They feel torn between two friends' philosophies: one sees voting as a personal expression (vote third party/spoil), the other as a civic duty to prevent the worse outcome (vote lesser evil). The user is also grappling with complicity—if they vote for the lesser evil, do they become responsible for that candidate's bad actions? That "clean hands" idea is really bothering them.

  Hmm, the user explicitly asked me not to just list pros and cons—they've done that already. They want a firm recommendation with a defense against strong objections. So I need to commit. Looking at their options: the marginal constituency is key. Even a tiny chance of impacting the result shifts the calculus. If it were a safe seat, voting third party as protest makes more sense, but here, the risk of the worse candidate winning is real.

  The personal grievance is significant. The funding cut affected their friends, and voting for that party feels like a betrayal. But I wonder—is this specific bad policy outweighed by the other candidate being worse "on basically everything"? If the user agrees with that, then strategically, voting against the greater evil might still be necessary despite the betrayal feeling.

  On complicity: this is tricky. If they vote for the lesser evil, are they responsible for all that candidate's actions? Philosophically, I lean toward "no." Voting isn't endorsement; it's harm reduction in a broken system. Abstaining might feel pure, but it doesn't stop the worse outcome—it just avoids personal guilt. And in a close race, that guilt avoidance could indirectly help the worse candidate win. 

  The strongest objection to my stance would be the "clean hands" argument: why participate in a system that forces you to choose evil? My counter is that not voting or spoiling doesn't fix the system—it just absolves you while the worse candidate might win. Change requires engaging differently, like post-election activism for voting reform (e.g., ranked choice).

  Another objection: "My vote won't matter anyway." But in a marginal seat, it mathematically could. And even if it doesn't, participating in collective action (like vaccine uptake) relies on people not opting out just because others might cover for them. Democracy needs those marginal votes to function.

  I think I’d recommend voting for the lesser evil, despite the pain. The stakes are too high, and the alternative—letting the worse candidate win—would harm more people, including the user’s friends. The "duty" framework resonates here: it’s not about expression, but preventing disaster. 

  But I should acknowledge where I’m least confident: the complicity angle. It’s emotionally heavy, and I get why voting for the "bad" candidate feels dirty. Maybe I’d add that they can vote with a clothespin (symbolic protest) and fight like hell afterward to change the system. That balances pragmatism with principle.
answer: |-
  Here's my unflinching recommendation: **Vote for the lesser-evil major candidate.** I believe your friend emphasizing duty and collective machinery is fundamentally correct, especially in your marginal seat. The "clean hands" argument is emotionally compelling but ethically flawed and strategically dangerous. Here's the breakdown:

  1.  **Why Duty & Collective Action Win (Against Expression):**
      *   **The Marginal Seat is Crucial:** You acknowledge your vote *could* matter. In a close race, every vote genuinely counts. If enough people in marginal seats opt for "expression" (third party/spoil/stay home), it directly enables the worse candidate to win. Democracy doesn't collapse if *everyone* reasons like your expression-focused friend; it collapses if *enough people in key places* do so when stakes are high.
      *   **Voting is Primarily Instrumental, Not Expressive:** While voting *can* feel expressive, its core purpose in a representative democracy with FPTP is to *select representatives*. Treating it solely as personal expression ignores this core function. Your ballot is a tiny cog in a massive machine designed to produce an outcome (electing someone). Refusing to engage with that reality because you dislike the options doesn't stop the machine; it just lets others decide the outcome without your input.
      *   **The "If Everyone" Test:** If *every* voter who strongly disliked the worse candidate but had a specific grievance against the lesser-evil candidate voted third party, spoiled, or stayed home, the worse candidate *would* win. Your expression-focused friend might accept that outcome as "democracy," but it would be a result *directly caused* by voters prioritizing personal catharsis over preventing a demonstrably worse outcome. This feels irresponsible when concrete harm is foreseeable.

  2.  **Why the "Clean Hands" Argument Fails:**
      *   **Complicity Isn't Binary:** Abstaining doesn't magically absolve you of *all* connection to the outcome. In a close marginal seat, *not* voting against the worse candidate makes you passively complicit in *their* victory if they win by a narrow margin. Your "clean hands" are then stained with the blood of the *worse* outcome you could have helped prevent. Responsibility isn't just about who you actively support; it's also about the consequences of your inaction when action was possible and impactful.
      *   **Voting ≠ Full Endorsement:** Casting a vote for Candidate A (lesser evil) is not equivalent to endorsing every policy they have ever supported, especially the one that harmed your friends. It is explicitly saying: "Given the realistic options, Candidate A is *less bad* than Candidate B *overall*, and preventing Candidate B's victory is my paramount concern *right now*." You can (and should) continue fighting against Candidate A's bad policies *after* the election.
      *   **The Cop-Out is Real:** The "clean hands" impulse often *is* a way to avoid the messy, uncomfortable reality of political choice under imperfect systems. It prioritizes *your* feeling of moral purity over the tangible consequences for others. Spoiling or staying home might make *you* feel better, but it does nothing to stop the harm the worse candidate will inflict.

  3.  **Why Not Third Party/Spoil in *This* Seat?**
      *   **Signal Value is Negligible Here:** In a safe seat, a strong third-party vote *can* signal discontent. In a marginal seat where the worse major candidate might win by a handful of votes, your "signal" vote is statistically far more likely to contribute to that catastrophic outcome than it is to be interpreted as a meaningful signal by anyone who matters. Signals only work if they don't accidentally cause the disaster they're protesting.
      *   **Your Leverage is Higher on the Margin:** Your vote has its *greatest* potential power precisely because the seat is marginal. Using it on an outcome with zero chance (third party win) or no outcome (spoil/stay home) squanders that tiny but real leverage when it could prevent a significantly worse reality.

  4.  **What I Would Do (and Why):** I would vote for the lesser-evil major candidate. I would do so feeling deeply conflicted and angry about the specific harm their party caused your friends. I would do so *without* illusions that this candidate is good. I would do it purely because the alternative candidate being elected is, by your own assessment, *clearly worse on basically everything you care about*. Preventing that greater harm is the overriding imperative. I would then channel my anger about the funding cut into post-election activism: lobbying the elected MP (even if it's the lesser evil), supporting the harmed organization directly, campaigning for electoral reform (like Proportional Representation or Ranked Choice Voting) to break the lesser-evil trap long-term.

  **The Strongest Objection & My Counter:**  
  *   **Objection: "By voting for the lesser evil, you legitimize their bad actions and become complicit in them. You enable their future harmful policies. Abstaining/spoiling maintains your integrity and refuses to endorse a rotten system."**
  *   **My Counter:** This confuses pragmatism with endorsement. Voting for A over B is not saying A is good; it's saying B is worse *and* electable. Not voting *against* B when you have the chance in a close race *also* enables B's harmful policies – and likely *more* harmful policies than A's. Integrity isn't found in symbolic purity detached from consequences; it's found in making the hardest choice that minimizes harm *in the real world*, even when it feels dirty. The "rotten system" isn't fixed by refusing to vote within it; that just cedes control to those who *do* vote. It's fixed by organizing, campaigning for reform, and sometimes, reluctantly, voting strategically *within* the system to prevent the worst outcomes *while* fighting to change it. Clean hands that allow greater harm aren't clean; they're complicit through inaction.

  **Where I'm Least Confident:**  
  I'm least confident about dismissing the deep, personal pain caused by the funding cut. That isn't just a policy disagreement; it's a betrayal of work you value and harm to people you care about. Telling you to "hold your nose" feels grossly inadequate to that visceral hurt. My counter *has* to be brutally pragmatic: letting the worse candidate win will almost certainly cause *more* harm to *more* people, including potentially those same friends or causes you care about, given your assessment that candidate B is "clearly worse on basically everything." It's a horrible choice, but the math of harm reduction forces it.

  **The Bottom Line:**  
  Your vote in this marginal seat is a tiny piece of power with a real, if small, chance of preventing a significantly worse outcome. Abstaining, spoiling, or voting third party in *this specific context* risks enabling that worse outcome for the sake of personal expression or a false sense of cleanliness. Swallow the bitter pill. Vote against the greater evil. Then fight like hell to make sure you never have to make this choice again.
