    - From Rule 3: CEU treats gains and losses symmetrically (e.g., mirror mugging rejected due to low credibility, not asymmetry), while Rule 3 is loss-averse for catastrophes.

  #### Rule 3: **Precautionary Asymmetry (PA)**
  - **Description**: Dana is extremely loss-averse for catastrophic outcomes but only when she might *cause* them. For *preventing* ruin (e.g., insurance, asteroid donation), she accepts credible low-probability costs. For *causing* ruin, she rejects any non-zero credible probability, regardless of expected utility. This explains her rejection of the collider-like mugging (causing loss) and mirror mugging (causing gain, but still an active risk), while accepting asteroid donation (preventing loss). Insurance is preventing personal ruin.
