  We are facing a classic problem in probability: how to assign probabilities in continuous or infinite spaces when we want "uniform" randomness. The principle of indifference (or insufficient reason) states that if we have no reason to favor one outcome over another, we assign them equal probability. However, as seen in the examples, this leads to paradoxes when there are multiple ways to describe the same set of outcomes.

  The key is to recognize that the principle of indifference must be applied with respect to a particular symmetry or a natural measure on the space of outcomes. The verdicts you provided can be explained by the concept of invariance under the natural symmetries of the problem.

  Let me address each case:

  1. **Random point in a disk**: 
     - The wrong method: uniform angle and uniform distance from center. This leads to a density of points proportional to the distance (because the area element is `r dr dθ`). Thus, it piles points near the center.
     - The right method: uniform over the area. This uses the Lebesgue measure (area) as the natural measure. The symmetry of the disk is rotational and translational (within the disk). The area measure is invariant under rotations and translations (if we consider the disk as a subset of the plane). Therefore, the uniform area measure is the natural one.

  2. **Random chord of a circle (Bertrand paradox)**:
     - This is a famous paradox that shows the principle of indifference can lead to different probabilities depending on how we parametrize the chord. The three methods you mention are:
       (a) Two uniform points on the circumference: P(chord length > side of equilateral triangle) = 1/3.
       (b) Uniform midpoint over the disk's interior: P = 1/4.
       (c) Uniform point along a random radius (with uniform direction) and then uniform distance from center: P = 1/2.
     - The problem is that the space of chords has no canonical measure. The natural symmetry group to consider is the group of rigid motions (rotations and translations) that act on the circle. However, the circle is symmetric under rotations and reflections (the orthogonal group). The group of rigid motions that preserve the circle is the orthogonal group. The only measure on the set of chords that is invariant under the group of rotations and reflections (i.e., the orthogonal group) is the one obtained by (a) [two uniform points on the circumference] or equivalently by the measure that uses the arc length between the two points. This measure gives 1/3. 
     - However, note that the problem is underdetermined. The principle of indifference by itself does not specify which parametrization to use. Therefore, the lack of a firm verdict is justified. The problem requires specifying the method of random choice.

  3. **Unknown coin**:
     - Here, the principle of indifference is applied to the bias `p` in [0,1]. The natural symmetry is not obvious. However, if we consider the group of transformations that preserve the structure of the problem, we note that the problem is invariant under the transformation `p -> 1-p` (which swaps heads and tails). This symmetry suggests a uniform prior on `p` (since it is the only prior invariant under this swap). Therefore, assigning a flat prior is natural. Moreover, for any finite number of flips, we can compute the probability by integrating with the prior.

  4. **Uniformly random positive integer**:
     - There is no uniform probability measure on the positive integers that assigns equal probability to each integer and sums to 1. Any such measure would have to assign probability 0 to every integer, but then the total measure would be 0, not 1. However, if we take a limit of uniform measures on {1,2,...,N} as N->∞, then for any fixed finite set, the probability of being in that set goes to 0. But for events that are periodic (like parity), we can define the natural density: the limit of the proportion as N->∞. For parity, the natural density is 1/2. This is what you are doing when you take uniform on 1..N (with N even) and then mod 2. The natural density is a finitely additive measure that is invariant under shifts? Actually, the natural density is shift-invariant for sets that have a density. However, it is not countably additive. So the "correctness" in this case is of a different kind: it is a limiting frequency.

