  **Scenario:** On Monday, Sam faces two options for a store gift card: pay $100 for Card A, redeemable for $100 of goods on Tuesday only, or pay $100 for Card B, redeemable for $110 of goods on Wednesday only. Sam strongly prefers immediate rewards and discounts delayed rewards hyperbolically, but consistently with expected utility: on Monday, the utility of Tuesday’s $100 (discounted by one day) exceeds that of Wednesday’s $110 (discounted by two days), so Sam chooses Card A. On Tuesday, holding Card A, the store offers to convert it to a Wednesday-redeemable card with $110 credit for a $1 fee. Now, Sam discounts Wednesday (one day away) only slightly and values $110 minus the $1 fee more than Tuesday’s $100, so Sam pays $1 and converts. Sam ends up with $110 credit on Wednesday, having paid $101 total. Had Sam chosen Card B initially, they would have paid $100 for $110 on Wednesday. Net loss: $1.

  **Proof that the scenario meets the spec:**

  1.  **Transitivity and static rationality:** At each choice point, Sam’s preferences are complete, transitive, and consistent with expected utility. On Monday, options are Card A (utility: \( U_A = \delta_1 \times 100 \)) and Card B (utility: \( U_B = \delta_2 \times 110 \)), where \(\delta_1 > \delta_2\) due to hyperbolic discounting (e.g., \(\delta_1 = 0.95\), \(\delta_2 = 0.8\), so \(U_A = 95 > U_B = 88\)). Transitivity holds as only two options exist. On Tuesday, options are using Card A now (utility: \(U_{\text{use}} = 100\)) or converting to Wednesday’s $110 minus the $1 fee (utility: \(U_{\text{convert}} = \delta_1 \times (110 - 1) = 0.95 \times 109 = 103.55 > 100\)). Again, transitivity holds. No framing effects, risk attitudes, or intransitive preferences are present; choices maximize expected utility given current holdings and stable beliefs.

  2.  **No criticizable individual choice:** Each choice is utility-maximizing given Sam’s state at the time. On Monday, Sam prefers Card A over Card B and chooses rationally. On Tuesday, holding Card A, Sam prefers conversion over using it immediately and chooses rationally. The counterpart (the store) has no special knowledge or power; offers are ordinary, finite, and involve only one interaction per choice point. The loss arises solely from how Sam’s time-sensitive preferences interact across choice points, not from any myopic error.

  3.  **Diachronic responses:**
      -   **Naive choice:** Sam myopically optimizes at each step: chooses Card A on Monday, converts on Tuesday. Result: Pays $101 for $110 on Wednesday, a net loss of $1 compared to Card B.
      -   **Sophisticated choice:** Sam anticipates Tuesday’s conversion on Monday. Recognizing that choosing Card A leads to paying $101 for Wednesday’s $110 (utility: \(\delta_2 \times 110 - \text{cost}\)), while Card B costs $100 for the same outcome (utility: \(\delta_2 \times 110 - 100\)), Sam chooses Card B initially to avoid the loss.
      -   **Resolute choice:** Sam commits on Monday to a plan ignoring future preference shifts. If Sam resolves to choose Card A and use it Tuesday, they get $100, avoiding the pump but forgoing Wednesday’s higher value. If Sam resolves to choose Card B, they get $110 on Wednesday for $100. Resolute choice avoids the pump but requires costly precommitment against Tuesday’s preference reversal.

  4.  **Critical feature and its removal:** The pump relies on **time-inconsistent hyperbolic discounting**, where Sam’s discount rate declines with proximity. If replaced with exponential discounting (constant discount rate), no reversal occurs: on Monday, Sam would prefer Card B if \(\delta^2 \times 110 > \delta \times 100\) (e.g., \(\delta = 0.95\), \(0.95^2 \times 110 \approx 99.275 > 0.95 \times 100 = 95\)), choosing Card B initially and avoiding the pump. The vulnerability is purely diachronic, stemming from changing temporal perspectives, not static intransitivity.

  5.  **Opponent’s attack:** A proponent of "time-slice rationality" would argue that each choice is locally rational, so the net loss is irrelevant: Sam’s Tuesday self legitimately values the conversion, and overriding it (via sophistication or resolution) sacrifices utility for coherence. They might contend that diachronic unity is not normative—rationality only requires optimizing from the current standpoint, even if earlier or later choices undermine global outcomes. This challenges your claim that the pump reveals a diachronic flaw, instead viewing it as a neutral byproduct of preference shifts over time.
