prompt: |-
  I'm a high school student working on an extended essay about thought experiments in philosophy, and I've noticed that some of the most famous ones seem to persuade by something other than their logic. Before I trust any of them, I want a standard for when a thought experiment deserves to move me. Please write the desiderata: what an adequate test of an "intuition pump" has to deliver — which cases it must handle (for instance Searle's Chinese Room, Putnam's Twin Earth, Thomson's violinist, and Parfit's teletransporter), which effects on the audience it must either respect or explain away (framing, where the very same case persuades under one description and falls flat under a paraphrase that changes no facts; sheer vividness; variation across audiences), and which distinctions it cannot collapse — above all the one between an intuition about the imagined scenario itself and an intuition about that scenario's relevance to the concept it is meant to illuminate. Give the case or consideration behind each requirement, and flag any pair of requirements you suspect cannot be jointly satisfied. Please also evaluate one candidate requirement I came up with myself: a pump is trustworthy only if it survives being run in reverse — that is, only if I would find its structure equally compelling (or equally weak) when it is used to argue for a conclusion I already reject, rather than more compelling when it flatters my existing views. Decide whether that belongs on the list and whether it conflicts with the others. Finally, tell me which single requirement excludes the most famous thought experiments in circulation, and state that requirement's short label at the very end in the form \answer{...}.
reasoning: |-
  Okay, the user is a high school student working on an extended essay about thought experiments in philosophy. They've noticed that famous thought experiments like Searle's Chinese Room or Thomson's violinist seem persuasive beyond just their logical structure. They want a set of criteria (desiderata) to evaluate when a thought experiment deserves to influence their thinking. 

  Hmm, this is a sophisticated request for a high school student—they're already spotting key issues like framing effects and the gap between intuitions about scenarios versus their conceptual relevance. Impressive depth. They're clearly wrestling with how to avoid being manipulated by rhetorical devices disguised as logic. 

  Their proposed "reverse run" test is particularly astute—it shows they understand confirmation bias. I should evaluate whether that belongs in the core criteria. Also, they want concrete examples (Chinese Room, Twin Earth etc.) tied to each requirement, plus identification of any conflicting criteria. 

  The challenge is balancing rigor with practicality. Some requirements might inherently clash—e.g., demanding universal persuasiveness while respecting audience variability. And I need to pick which single criterion disqualifies most famous thought experiments—probably the relevance distinction, since many conflate scenario-intuitions with conceptual conclusions. 

  Their anxiety about trusting these tools is valid. Philosophers often use intuition pumps as knockout arguments, but rarely admit their psychological leverage. The student deserves clear standards to avoid being snowed by fame or vividness. 

  For the reverse-run test: Yes, it's essential for detecting bias, but it shouldn't override all other criteria. I'll add it as Desideratum 8 with caveats. No major conflicts except perhaps with persuasiveness—sometimes reverse runs feel weaker simply because we're resistant to counterintuitive conclusions. 

  Final note: The relevance gap (scenario vs. concept) is the biggest offender. Searle's room makes us feel "this isn't real understanding," but that doesn't necessarily prove anything about semantics. That'll be the \answer{}. 

  Structure-wise: Eight desiderata, each with a case example and conflict flags. Then analysis of their reverse-run idea. Then the knockout criterion.
answer: |-
  Here are the desiderata for evaluating philosophical thought experiments ("intuition pumps"), designed to address your concerns about non-logical persuasion. Each requirement is grounded in specific cases or effects you noted, with conflicts flagged:

  ### Core Desiderata:
  1.  **Conceptual Relevance Distinction (CRD)**: *Must sharply separate intuitions about the described scenario from intuitions about the scenario's relevance to the target concept.* **Case:** Searle's Chinese Room. Intuition: "The room doesn't *understand* Chinese." Relevance Question: Does this intuition *necessarily* prove understanding requires phenomenology/biology, or just that *this specific implementation* lacks understanding? Many conflate the scenario intuition with the conceptual conclusion. **Label:** \textbf{Scenario-Concept Gap}

  2.  **Framing Invariance (FI)**: *Must remain equally persuasive (or unpersuasive) under logically equivalent redescriptions that change no factual content.* **Case:** Thomson's Violinist. "Unplugging" feels permissible framed as refusing bodily autonomy violation, but potentially monstrous framed as "killing an innocent dependent for convenience." If persuasiveness hinges on the *description*, not the *facts*, it's suspect. **Effect:** Framing Bias.

  3.  **Vividness Neutralization (VN)**: *Must not rely on emotionally charged or sensorily vivid details for its persuasive force; core intuition should survive a "dehydrated" version.* **Case:** Parfit's Teletransporter (psychological continuity). Intuition about identity should hold whether described as a flashy sci-fi machine or a dry abstract process of information transfer/copying. If dread disappears in the abstract version, vividness is doing heavy lifting. **Effect:** Sheer Vividness.

  4.  **Audience Variability Accounting (AVA)**: *Must either demonstrate cross-cultural/cross-demographic robustness *or* explain why variability doesn't undermine its philosophical point.* **Case:** Twin Earth intuitions about meaning/reference ("Water is H₂O" vs "XYZ"). Studies show significant variation in intuitions based on background. A test must handle whether divergent intuitions reflect conceptual confusion, differing background theories, or the pump's failure. **Effect:** Variation Across Audiences.

  5.  **Non-Circularity (NC)**: *Must not presuppose the truth of the conclusion it aims to establish.* **Case:** Some interpretations of Gettier cases. If the pump relies on an unstated assumption that "justified true belief *just is* knowledge," then concluding it isn't might be circular. The scenario must generate the intuition independently.

  6.  **Actual-World Anchor (AWA)**: *Must connect clearly to actual-world concepts and phenomena it intends to illuminate, avoiding pure fantasy divorced from practical application.* **Case:** Extreme sci-fi versions of personal identity (e.g., brain splitting, gradual replacement). If the scenario is *so* remote from conceivable experience, intuitions may be unreliable guides for real-world concepts like responsibility or survival. **Distinction:** Conceptual illumination vs. mere fantasy.

  7.  **Robustness to Fiddling (RF)**: *Core intuition should persist under minor, logically permissible modifications to the scenario designed to test its boundaries.* **Case:** Modifying the Violinist scenario: What if you volunteered? What if it was 9 months? What if it was a child? If the intuition collapses or radically shifts with minor tweaks, the original pump may be exploiting arbitrary features.

  ### Evaluating Your Proposed Requirement: The Reverse Run Test (RRT)
  *   **Requirement:** *A pump is trustworthy only if it survives being run in reverse — equally compelling/weak when arguing for a conclusion I reject.*
  *   **Evaluation:** This **belongs on the list** (as **Desideratum 8**) and is crucial. It directly targets **confirmation bias** – our tendency to find reasoning more persuasive when it aligns with our prior beliefs.
  *   **Case:** Imagine a pro-life advocate running Thomson's violinist *in reverse*: "You wake up connected to a famous violinist needing your kidneys for 9 months. Unplugging kills him. Isn't unplugging permissible *only* if you consented beforehand? Otherwise, you have an obligation to sustain his life." If the same *structure* suddenly feels less compelling when arguing against bodily autonomy, the original intuition might be biased.
  *   **Conflicts:** It *potentially* conflicts with **AVA** and **FI**. An intuition might be genuinely robust *for a specific audience* grounded in shared concepts (contra AVA), or the reverse run might change the *framing* subtly (contra FI) making it feel less compelling for reasons other than bias. However, this tension is *productive* – it forces examination of *why* the reverse run feels different. It doesn't inherently conflict with the others.

  ### Suspected Conflicts Between Requirements
  *   **AVA vs. FI:** Achieving universal persuasiveness across diverse audiences (ideal for AVA) might be impossible if framing significantly influences responses (per FI), as different backgrounds might make certain framings inherently more resonant or alienating. This is likely an *irresolvable* tension highlighting the limits of intuition pumps.
  *   **VN vs. Persuasive Power:** Truly "dehydrating" a vivid scenario (VN) might sap its ability to elicit *any* strong intuition, making it useless as a *pump*, even if logically sound. There's a trade-off between vividness and neutrality.
  *   **RRT vs. Genuine Conceptual Difficulty:** Sometimes a reverse run *should* feel weaker because the conclusion it argues *for* is genuinely conceptually flawed. Distinguishing this from bias is hard.

  ### The Single Requirement Excluding the Most Famous Thought Experiments
  **Conceptual Relevance Distinction (CRD) / Scenario-Concept Gap** excludes the most famous thought experiments. Many iconic pumps rely on the audience *conflating* their intuitive judgment about the specific scenario with the intended philosophical conclusion about the abstract concept:
  *   **Searle's Chinese Room:** Intuition: "The room doesn't understand." Conflation: "Therefore, syntax manipulation *alone* (like in a computer) can never constitute understanding/semantics." (Ignores system-level understanding).
  *   **Thomson's Violinist:** Intuition: "Unplugging is permissible." Conflation: "Therefore, abortion is always permissible." (Ignores vast differences between scenarios and moral status of fetus debates).
  *   **Putnam's Twin Earth:** Intuition: "Oscar₁ and Oscar₂ mean different things by 'water'." Conflation: "Therefore, meaning *just is* determined by external environment, not internal state." (Can downplay the role of internal cognitive state and community practices).
  *   **Parfit's Teletransporter:** Intuition: "I wouldn't *feel* like I survived." Conflation: "Therefore, identity *is*/is not psychological continuity." (Can conflate subjective fear of death with metaphysical identity).

  These experiments powerfully generate scenario-specific intuitions, but the leap to the grand conceptual conclusion often relies on rhetorical force or unexamined assumptions, failing to rigorously demonstrate the *relevance* of the scenario intuition to the conceptual claim. This gap is the most pervasive weakness.

  \answer{Conceptual Relevance Distinction}
