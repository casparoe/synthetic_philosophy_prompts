answer: |-
  Here are two thought experiments designed to test the divergence between Thomson's bodily autonomy argument and Marquis's future-like-ours argument, adhering strictly to your constraints.

  ### Scenario 1: Thomson Permits, Marquis Forbids
  **Case:** A woman undergoes IVF using her own eggs and her partner's sperm. Due to a clinic error, an embryo created from a different couple's genetic material is implanted instead. The woman discovers the error at 10 weeks gestation. She did not consent to gestate or bear a child genetically unrelated to her or her partner. She seeks an abortion.

  *   **Thomson's Analysis:** Permits abortion. The core of Thomson's argument is that the right to bodily integrity outweighs the fetus's right to life *when the pregnancy results from a violation of the woman's consent or when she did not voluntarily assume the burden*. Here, the woman consented to carry *her own* embryo. The implantation of a stranger's embryo is a profound violation of her bodily autonomy, akin to the violinist being attached without consent. She took reasonable steps (choosing IVF with her own gametes) to avoid gestating a stranger's child. Therefore, she has no obligation to continue the pregnancy.
      *   **Key Feature:** Non-consensual imposition of pregnancy burden (specifically, gestating a genetically unrelated embryo she explicitly did not choose).
      *   **Strongest Attack (Marquis Defender):** Marquis might argue that the *origin* of the fetus is irrelevant to *its* moral status. What matters is the intrinsic value of the future life that fetus possesses. That future life – filled with experiences, projects, and relationships – is lost if aborted. The clinic's error is tragic, but it doesn't negate the fetus's own valuable future. Punishing the fetus for the clinic's mistake is unjust. The woman's distress, while understandable, doesn't override the fetus's fundamental right to its future.

  *   **Marquis's Analysis:** Forbids abortion. The fetus, having been successfully implanted and developing, presumptively has a "future-like-ours" (FLO) – a valuable, personal future filled with experiences, projects, and relationships that it will be deprived of if killed. The error in genetic origin doesn't alter the nature of the fetus's potential future experiences; it still has a full human life ahead of it. Killing it deprives it of that future of value.
      *   **Key Feature:** The fetus possesses a future of value (FLO) regardless of origin or consent to implantation.
      *   **Strongest Attack (Thomson Defender):** Thomson's defender would argue that Marquis fundamentally misunderstands the grounding of the prohibition. The wrongness of killing isn't solely about the victim's loss, but also about the violator's rights. Here, compelling the woman to use her body against her will for 9 months to sustain this life constitutes a severe, ongoing violation of her most basic rights, regardless of the fetus's *potential* future. The consent violation is paramount.

  **Divergence Generated:** Thomson focuses on the *manner of imposition* (non-consensual due to clinic error) and lack of assumption of responsibility. Marquis focuses solely on the *future possessed by the fetus* (which exists independently of how it got there).

  ### Scenario 2: Marquis Permits (Raises No Objection), Thomson Condemns (or Requires Added Premise)
  **Case:** A healthy woman freely enters into a gestational surrogacy agreement, carrying an embryo created from the intended parents' gametes. She explicitly consents in the legally binding contract to carry the pregnancy to term under all foreseeable circumstances barring direct threats to her own life or health. At the 20-week anatomy scan, the fetus is diagnosed with anencephaly, a uniformly fatal condition where major parts of the brain and skull are absent. The fetus will never gain consciousness and will die shortly after birth. The intended parents, devastated, request termination. The surrogate, citing her commitment in the contract and a personal belief in fulfilling agreements, wishes to carry to term despite the prognosis. However, she faces significant physical burdens (ongoing nausea, fatigue, back pain, risk of pre-eclampsia) and psychological distress knowing the outcome.

  *   **Marquis's Analysis:** Raises no moral objection to abortion. The core of Marquis's argument is that killing is wrong because it deprives the victim of a "future-like-ours" – a future containing valuable experiences, projects, and activities. An anencephalic fetus lacks the biological substrate for consciousness or any future experiences whatsoever. It has no future of value to be deprived of. Therefore, abortion does not inflict the primary harm (deprivation of FLO) that makes killing wrong in Marquis's view.
      *   **Key Feature:** The fetus has *no future of value* due to anencephaly (foreclosing any possibility of conscious experience or personal future).
      *   **Strongest Attack (Thomson Defender):** A Marquis defender might refine the FLO criterion, arguing that the *potential* for a future of value existed at conception, and the tragic diagnosis doesn't negate the inherent wrongness of intentionally ending a developing human life earlier. They might also argue about defining the threshold for "sufficiently like ours," suggesting that even a brief, impaired life possesses *some* value. However, Marquis's core logic strongly suggests no FLO exists here.

  *   **Thomson's Analysis (with Added Premise):** *Condemns* abortion *if* we add the premise that freely undertaken, specific responsibilities can create obligations to sustain life with one's body, *even if* the initial consent condition changes significantly (as long as the burden remains within the realm of pregnancy). Thomson's core argument grants *permissions*; it doesn't typically impose *duties* to sustain life. However, her framework allows for duties arising from special relationships or voluntary undertakings ("Good Samaritanism"). Here, the surrogate *freely consented* via a specific contract to gestate *this* fetus to term, accepting the burdens of pregnancy for that purpose. One could argue that by freely assuming responsibility for the fetus's dependence upon her body in this specific way, she has incurred an obligation to see it through, analogous to inviting the violinist. The changed prognosis (no viable future for the child) doesn't necessarily negate the obligation she undertook concerning the *gestation process itself*, especially as the physical burdens, while significant, are those inherent to pregnancy (which she consented to bear).
      *   **Key Feature:** Freely undertaken, specific responsibility for gestating *this fetus* to term via contract.
      *   **Required Added Premise:** Freely consenting to make one's body available as life-support for a specific dependent entity for a defined period creates a moral obligation to fulfill that commitment, even if the dependent entity's ultimate outcome changes, provided the physical burden remains within the scope of what was consented to. *(Note: This premise moves beyond Thomson's original, purely permission-granting structure; it's a plausible extension based on her discussion of responsibilities, but it's not explicitly argued for as a duty in "A Defense of Abortion".)*
      *   **Strongest Attack (Marquis Defender / Thomson Purist):** A Thomson purist would argue this misapplies her framework. Her argument is fundamentally about the *right to refuse*, not a *duty to provide*. The violinist analogy permits unplugging; it never suggests you have a duty to *stay* plugged in if you initially agreed. Consent can be withdrawn. The surrogate consented to gestate a viable child. The diagnosis fundamentally alters the nature of the burden – she now knows she endures months of hardship solely for a stillbirth, causing immense psychological distress. This new information means the specific burden she *actually* bears (gestating a non-viable fetus to inevitable death) is not the one she consented to. Her bodily autonomy right allows her to withdraw consent. The contract may be legally complex, but morally, compelling her to continue violates her bodily integrity under these tragic, unforeseen circumstances.

  **Divergence Generated:** Marquis focuses on the *fetus's intrinsic properties* (absence of any possible future of value). Thomson (with the added responsibility premise) focuses on the *woman's prior voluntary act* (freely undertaking a specific gestational responsibility via contract), creating an obligation despite the fetus's condition. Without the added premise, Thomson's argument likely *permits* the surrogate to choose abortion (withdrawing consent due to changed circumstances/ongoing burden), failing the "condemn" requirement. The added premise is necessary to achieve condemnation within a Thomson-*inspired* framework.

  **Verdict on Orthogonality and Conflict Point:**
  Yes, the arguments are genuinely orthogonal. They track fundamentally different moral concerns:
  1.  **Thomson:** Tracks the **manner of imposition of dependency** and **consent/assumption of responsibility** by the gestator. The moral weight lies on the pregnant person's rights and choices concerning *their own body*.
  2.  **Marquis:** Tracks the **intrinsic property of the fetus** – whether it possesses a **future of value (FLO)**. The moral weight lies on the harm done *to the fetus*.

  The points of conflict are clear:
  *   In **Scenario 1 (IVF Mix-up)**, conflict arises over whether the **non-consensual origin of the dependency** (Thomson's focus) overrides the **fetus's possession of a FLO** (Marquis's focus).
  *   In **Scenario 2 (Anencephalic Surrogate)**, conflict arises (with Thomson augmented) over whether a **freely undertaken specific responsibility to gestate** (Thomson-inspired focus) overrides the **absence of a FLO in the fetus** (Marquis's focus).

  The arguments conflict precisely where the conditions for permissibility based on bodily autonomy/consent (Thomson) are met, but the fetus possesses a FLO (Marquis forbids), *or* where the fetus lacks a FLO (Marquis permits), but the gestator has undertaken a specific responsibility to sustain it (Thomson-inspired condemnation). They operate on distinct axes: one concerning the *gestator's rights and responsibilities*, the other concerning the *fetus's potential*.
