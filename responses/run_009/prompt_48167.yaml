prompt: |-
  I'm a journalist who mostly covers science and ideas, but at our small magazine I've somehow also inherited the style complaints, and lately we get a couple a week about wording that supposedly bakes in some default assumption -- "sanity check" in a piece about software, generic "he" in a quote from an old philosopher, "peanut gallery" in a headline, that kind of thing. Nobody on the desk has linguistics training, we don't have time for corpus research, and our style guide just says "avoid needlessly exclusive language," which settles nothing when a writer pushes back.

  The only thing I've ever read that actually changed how I think about these fights is Hofstadter's mid-80s satire "A Person Paper on Purity in Language" (he published it under a pseudonym, William Satire, as a parody of a language-pundit column). The device: he took the stock defenses of gendered defaults -- "chairman includes women, it just means person, the etymology is innocent, everyone knows what it means" -- and rewrote the whole column with racial terms swapped in, so you get defenses of "chairwhite," the poetry of "All whites are created equal," and Neil Armstrong recast as Captain Nellie Strongarm saying "One small step for a white, a giant step for whitekind." Reading it, you watch the standard excuses curdle into open special pleading. The deep point, I think, is that a lot of defenses of a default-assuming usage are pretextual, and a substitution test can reveal that.

  So here's what I want: turn that insight into a procedure our desk can actually run on a complaint in about ten minutes. Something like a checklist -- what to establish first (is the term even defaulting on a group, or is it a dead metaphor?), then the substitution step (swap in a different group and see if our defense of keeping the phrase survives or collapses), with clear criteria for when the test is probative and when it misfires, since an analogy between two groups isn't automatically a good analogy, and some swaps just don't map (a term about sight vs. a term about race aren't the same kind of default). Tell me where the procedure outputs "change it," where it outputs "keep it and explain why," and where it has to hand the decision to a human because the question is a values question dressed up as a usage question.

  Then run it on three real complaints from our inbox: (1) "sanity check" in engineering copy, where the writer swears it's a fixed technical term; (2) "fell on deaf ears" in a headline, where a reader says it's an idiom about ignoring, not about deaf people; and (3) generic "he" inside a direct quotation from a mid-century philosopher, where someone wants us to silently change it to "they" in the quote.

  Two more things. First, at least one of the three should come out a way I won't like -- I'm honestly attached to "sanity check" -- and I want you to be honest about that rather than rigging the procedure. Second, tell me plainly what the procedure can't do: where substitution is too crude, where it would misfire on cases like old etymologies or genuine ambiguity, and how to stop it from turning into a reflex where every complaint gets "resolved" by a swap that was never really parallel. Keep it usable -- one page of checklist a tired editor can follow at 5pm, not a treatise. Also dont be precious about it, if parts of it are just judgement calls say so.
reasoning: |-
  We are creating a practical procedure for handling style complaints about potentially exclusive language. The procedure is based on Hofstadter's substitution test, where we swap the group that the term defaults to with another group (like race) and see if the defenses still hold. The goal is to reveal whether defenses are pretextual.

  The procedure has the following steps:

  1. **Identify if there is a default group**: 
     - Is the term implying a default group (e.g., male, non-disabled, white, etc.)? 
     - If not (e.g., dead metaphor, no group implicated), then the term may be safe. But note: some dead metaphors might still be problematic if they are recent enough or if the group is marginalized.
     - If yes, proceed.

  2. **Perform substitution**:
     - Swap the default group with another group (we'll use race as the substitute, following Hofstadter, because it's a clear and sensitive category that can reveal pretext). 
     - Example: "sanity check" -> "whiteness check" (implying that sanity is the default and non-sane is bad, so swapping to race: whiteness as the default and non-white as bad).
     - Rewrite the sentence or phrase with the substitution and see how it sounds.

  3. **Evaluate the defense**:
     - Listen to the defense (e.g., "it's a fixed term", "it's an idiom", "it's historical") and apply it to the substituted version.
     - Does the defense still sound reasonable? Or does it become clearly offensive or absurd?
     - If the defense collapses (i.e., it becomes clear that the defense is special pleading for the original group), then the term is likely problematic and should be changed.
     - If the defense still holds (rare), then the term might be safe.

  4. **Consider context and alternatives**:
     - Even if the substitution test suggests the term is problematic, consider:
       - Is there a clear, concise alternative? (If yes, change it.)
       - Is the term in a direct quote? (Changing quotes is a separate issue.)
       - How entrenched is the term? (But be cautious: "it's always been used" is often part of the problem.)

  5. **Make a decision**:
     - **Change it**: If the substitution test shows the defense is weak and there is a reasonable alternative.
     - **Keep it and explain why**: If the substitution test does not reveal a problem (defense holds) OR if there are compelling reasons beyond the test (e.g., direct quote, no good alternative, and the term is not causing harm in this context) but note that the explanation must be solid.
     - **Hand to human judgment**: If the substitution is not parallel (the groups are not analogous in the context) OR if the test is inconclusive OR if it's a values question (e.g., "we must preserve the original quote exactly" vs. "we must update language for inclusivity") then it requires human judgment. Also, if the complaint is about a group that is not the one being defaulted in the term, the test might misfire.

  Limitations of the procedure:
  - **Overly crude**: Not every term maps cleanly. For example, swapping race for disability might not be parallel if the historical contexts are different. The test is a heuristic, not a rule.
  - **Dead metaphors**: Some terms might have lost their original meaning (e.g., "dumb" meaning mute, now means stupid). But if the metaphor is still alive to some (especially the affected group), it can be harmful. The test might not catch this if the metaphor is dead to the tester.
  - **Etymology**: The test might misfire if the term's origin is unrelated to the group (e.g., "basket case" originally meant a soldier who lost all limbs, not a mental health term). But note: even if the etymology is innocent, current usage might be harmful.
  - **Ambiguity**: If the term has multiple meanings and the default group is not the primary one, the test might be over-sensitive.
  - **Reflexive use**: Avoid applying the test without thought. Not every complaint requires a substitution. Sometimes it's clear without (e.g., racial slurs). Also, the test might not work for every group (e.g., swapping in a privileged group might not reveal the problem).

  Now, let's run the three complaints through the procedure:

  ### Complaint 1: "sanity check" in engineering copy

  **Step 1: Default group?**
  - "Sanity" implies a default of mental health (or sanity) and contrasts with insanity. It assumes that sanity is the norm and desirable, and by extension, equates mental illness with something negative (in this context, a flawed state that needs checking). So, yes, it defaults on people with mental illnesses.

  **Step 2: Substitution**:
  - Swap with race: change "sanity check" to "whiteness check". 
    - Original: "Run a sanity check on the code."
    - Substituted: "Run a whiteness check on the code."
  - Now, the phrase implies that the code should be "white" (i.e., good) and non-white is bad. This is clearly offensive.

  **Step 3: Evaluate the defense**:
  - Defense: "It's a fixed technical term."
    - Apply to substituted: "Whiteness check is a fixed technical term." 
    - This defense collapses because even if it were fixed, the racial term is unacceptable. Therefore, the original defense is pretextual: the term is avoidable and the harm is real.

  **Step 4: Context and alternatives**:
  - Alternatives: "quick check", "confidence check", "coherence check", "validity check", "sense check", "reality check" (though that has its own issues), "plausibility check". There are many alternatives that are clear and established in tech contexts.

  **Step 5: Decision**:
  - **Change it**: The substitution test shows the defense doesn't hold, and there are easy alternatives. The term should be replaced.

  ### Complaint 2: "fell on deaf ears" in a headline

  **Step 1: Default group?**
  - The idiom "fell on deaf ears" uses deafness (a disability) as a metaphor for ignoring or not listening. It equates deafness with unwillingness to listen, which is a negative stereotype. So, yes, it defaults on deaf people.

  **Step 2: Substitution**:
  - Swap with race: change "fell on deaf ears" to "fell on Black ears" (or "fell on brown ears", but we'll use race broadly). 
    - Original: "The protest fell on deaf ears."
    - Substituted: "The protest fell on Black ears."
  - This is clearly offensive because it implies that Black people are inherently incapable of listening or understanding.

  **Step 3: Evaluate the defense**:
  - Defense: "It's an idiom about ignoring, not about deaf people."
    - Apply to substituted: "It's an idiom about ignoring, not about Black people." 
    - This defense collapses because the racial substitution is overtly racist. Thus, the original defense is weak: even if the speaker didn't intend to reference deaf people, the metaphor still uses their condition negatively.

  **Step 4: Context and alternatives**:
  - Alternatives: "was ignored", "was disregarded", "was unheeded", "met with indifference", "was dismissed".

  **Step 5: Decision**:
  - **Change it**: The substitution test reveals the problem, and alternatives are straightforward. Change the headline.

  ### Complaint 3: Generic "he" in a direct quote from a mid-century philosopher

  **Step 1: Default group?**
  - The generic "he" uses the male pronoun as a default for any person. It excludes women and non-binary people. So, yes, it defaults to male.

  **Step 2: Substitution**:
  - Swap with race: change the generic "he" to a generic "white" (but note: English doesn't have a racial pronoun, so we have to adapt). We can change the quote to use "white" as a generic term for a person. For example, if the quote is: "When a scientist makes a discovery, he should publish it immediately."
    - Substituted: "When a scientist makes a discovery, the white should publish it immediately."
  - This substitution is awkward because we don't use race as a pronoun, but the effect is clear: it implies that scientists are assumed to be white, and non-white scientists are exceptions.

  **Step 3: Evaluate the defense**:
  - Defense: It's a direct quote, and we must preserve accuracy. Also, the philosopher wrote it that way.
    - For the substituted version: If we changed the quote to use "white", we would be altering the quote and introducing a racial element that wasn't there. But note: the substitution test is not about changing the quote but about testing the defense of the original. The defense for keeping the original might be: "It's historical, and we shouldn't alter quotes." 
    - However, the complaint is about changing the quote to "they". The defense of not changing the quote is about historical accuracy, not about the generic "he" itself. So we have to separate the issue.

  But note: the substitution test is for the term itself, not the quote alteration. Let's refocus:

  - The generic "he" in the quote is exclusive. If we were writing today, we would use "they". But the quote is from the past.
  - The complaint asks to change the quote to "they". The defense for not changing is: "We must quote exactly."

  The substitution test might not directly apply to the quote alteration issue because it's about the term in isolation. However, we can apply the test to the generic "he" to see if it's problematic, which it is (as shown by the substitution). But the decision about altering a quote is a separate ethical and journalistic question.

  **Step 4: Context and alternatives**:
  - Alternatives: 
    - Keep the quote as is and add an editorial note: "[Editor's note: This quote uses the generic 'he', which was common at the time but is now considered exclusionary.]"
    - Change the quote to "they" (silently or with brackets, e.g., [they]) but note: changing quotes is generally frowned upon in journalism unless it's for clarity (like updating spelling) and even then, it's debated.

  **Step 5: Decision**:
  - The substitution test shows that the generic "he" is problematic (the defense of it as inclusive collapses when we substitute race). However, the issue here is about altering a direct quote, which is a separate policy. 
    - **Hand to human judgment**: Because this is a values question about journalistic integrity (preserving the original) vs. inclusivity (updating language). The substitution test doesn't resolve that conflict. The desk must decide on a policy for handling historical quotes. 

    - Suggestion: Most style guides (like APA) now recommend changing quotes only in very limited circumstances. The inclusive approach without altering the quote is to add a note or, if the magazine's policy allows, using [they] but that might be seen as altering the source. This requires a policy decision.

  Summary of decisions:
  1. "sanity check" -> Change it.
  2. "fell on deaf ears" -> Change it.
  3. generic "he" in quote -> Hand to human judgment (values question).

  Note: The procedure didn't rig the outcomes. You (the journalist) are attached to "sanity check", but the procedure showed it should be changed. This is consistent with the insight from Hofstadter: if the defense collapses under substitution, it's likely a problem.

  Final Procedure Checklist (one page):

  ---

  **Quick Procedure for Inclusive Language Complaints**

  **Step 1: Identify Default Group (2 min)**
  - Ask: Does the term imply a default group (e.g., male, non-disabled, white, etc.)? 
    - If no (e.g., dead metaphor with no current group association), then likely keep, but be cautious if the complaint comes from an affected group.
    - If yes, proceed.

  **Step 2: Substitution Test (3 min)**
  - Swap the default group with a different group (use race as the standard substitute). 
    - Example: "sanity" -> "whiteness"; "deaf" -> "Black"; "he" (generic) -> "white" (as a generic).
    - Rewrite the phrase with the substitution.

  **Step 3: Evaluate Defense (2 min)**
  - Take the defense offered (e.g., "it's fixed", "it's an idiom") and apply it to the substituted phrase.
    - If the defense now sounds absurd or offensive, then the original term is likely problematic.
    - If the defense still holds (rare), then the term might be safe.

  **Step 4: Consider Context and Alternatives (2 min)**
  - Are there easy, clear alternatives? (If yes, change.)
  - Is the term in a quote? (If yes, see Step 5.)
  - How entrenched is the term? (But avoid "we've always done it".)

  **Step 5: Make Decision (1 min)**
  - **Change it**: If substitution test shows problem and there's an alternative.
  - **Keep it and explain**: If substitution test doesn't show a problem OR if there's a strong reason (e.g., no alternative, and the term is not harmful in context) — but explain in the response.
  - **Hand to human judgment**: If the substitution doesn't map (e.g., groups not analogous), or if it's a values conflict (e.g., altering quotes), or if the test is inconclusive.

  **Limitations**:
  - The test is a heuristic, not perfect. It might be too crude for some cases (e.g., groups with very different histories).
  - Dead metaphors: If the metaphor is truly dead, the test might not apply, but be cautious — if the affected group says it's harmful, listen.
  - Don't apply reflexively. Some complaints might be resolved without substitution (e.g., obvious slurs).
  - When in doubt, err on the side of inclusivity.

  **When the test misfires**:
  - If the term is about a group that isn't marginalized, the substitution might not reveal the problem (e.g., swapping "geek" for a racial term might not work because "geek" isn't about an inherent characteristic). Use common sense.
  - If the complaint is about a group that isn't the one being defaulted, the test might not apply.

  **Remember**: The goal is to avoid needlessly exclusive language. If the test reveals that the defense is weak, change the term. If it doesn't, but you feel uneasy, trust your judgment.

