answer: |-
  Below is a streamlined, practical procedure for handling style complaints about default-assuming language, based on Hofstadter's substitution insight. It's designed as a 5-step checklist (≈10 minutes), with clear outputs and limitations. I'll then apply it to your three cases honestly—including where it challenges your preference.

  ---

  ### **The Substitution Test Procedure: 10-Minute Checklist**  
  *Goal: Identify if a term's defense relies on special pleading for a default group (e.g., male, non-disabled, neurotypical).*

  #### **Step 1: CONFIRM THE DEFAULT (2 min)**  
     - **Ask:** "Does this term *actively* imply a default/normative group (e.g., men, non-disabled, white) while framing others as 'deviant' or excluded?"  
       - *Yes* → Proceed to Step 2.  
       - *No* → Likely dead metaphor or no group implicated (e.g., "drowning in work" isn’t ableist). Output: **Keep it**.  
       - *Unclear* → Skip to Step 4.  
     - **Key clues:**  
       - The term derives from a marginalized identity (disability, race, gender, etc.).  
       - Affected groups have criticized it (e.g., Deaf advocates reject "deaf ears" as harmful).  

  #### **Step 2: SWAP THE GROUP (2 min)**  
     - **Substitute** the default group with a **different marginalized group** (use race as the standard swap; it’s high-stakes and exposes hypocrisy clearly).  
       - *Example:* "sanity check" → "whiteness check"; "fell on deaf ears" → "fell on Black ears".  
     - **Critical check:** Does the swap create a **parallel comparison**?  
       - *Yes* → If both groups face systemic bias (e.g., disability and race), proceed.  
       - *No* → If the swap compares unlike things (e.g., "see the light" [sight] vs. "white supremacy" [race]), stop. Output: **Hand to human judgment**.  

  #### **Step 3: STRESS-TEST THE DEFENSE (3 min)**  
     - Take the writer’s defense (e.g., "it’s an idiom!") and apply it to the swapped version.  
     - **Ask:** "Does this defense sound like special pleading now?"  
       - **Collapses** (e.g., "It’s just a fixed term!" for "whiteness check" feels bigoted) → Output: **Change it**.  
       - **Holds** (e.g., "This swap misrepresents the etymology") → Proceed to Step 4.  
       - **Ambiguous** → Output: **Hand to human judgment**.  

  #### **Step 4: ASSESS CONTEXT & ALTERNATIVES (2 min)**  
     - **Factors to weigh:**  
       - **Harm:** Is the term actively hurtful to the implicated group? (Prioritize lived experience.)  
       - **Alternatives:** Is there a clear, concise replacement? (If yes, change it.)  
       - **Entrenchment:** Is it a universally accepted technical term? (Rare; e.g., "bug" in tech is a dead metaphor.)  
       - **Intent:** In quotes, does altering the text distort meaning?  
     - **Output:**  
       - Low harm + strong defense + no alternative → **Keep it and explain why**.  
       - High harm + easy alternative → **Change it**.  

  #### **Step 5: DECIDE & DOCUMENT (1 min)**  
     - **Outputs:**  
       - **Change it**: Swap fails defense test + alternative exists.  
       - **Keep it and explain**: Swap doesn’t land, or context justifies it (e.g., historical accuracy in quotes).  
       - **Hand to human judgment**: Non-parallel swap, ambiguous harm, or values conflict (e.g., "Do we alter quotes for inclusivity?").  

  ---

  ### **Limitations of the Procedure**  
  1. **Overly crude for non-parallel groups**: E.g., swapping race for class ("peasant check" vs. "sanity check") may misfire; they carry different historical baggage.  
  2. **Dead metaphors**: Terms like "lame excuse" (originally disability-based) may test as harmful but lack widespread modern recognition. *Solution:* Default to affected groups’ preferences.  
  3. **Etymology vs. modern harm**: A term like "hysterical" (from Greek "womb") may pass a race swap but still offend. *Solution:* Skip swap if etymology is truly obsolete; prioritize current impact.  
  4. **Values questions**: The test can’t resolve debates like quote alteration—only expose pretext in *defenses* of default language.  
  5. **Reflexive overuse**: Not every complaint needs a swap! Use only when default groups are implicated.  

  ---

  ### **Applied to Your Cases**  

  #### **Case 1: "sanity check" in engineering copy**  
  - **Step 1:** Default? Yes. Implies mental health as the norm; neurodiversity advocates criticize it.  
  - **Step 2:** Swap → "whiteness check" (e.g., "Run a whiteness check on the code"). Parallel? Yes (both systemic marginalization).  
  - **Step 3:** Defense? Writer says, "It’s a fixed technical term!" Swap test: Defending "whiteness check" as "fixed" collapses (sounds racist).  
  - **Step 4:** Alternatives? "Coherence check," "logic check," "quick validation." Easy and clear.  
  - **Output: Change it.**  
    - *Why this might sting:* You’re attached to the term, but the swap reveals the defense is pretextual. Neurodivergent readers experience real harm.  

  #### **Case 2: "fell on deaf ears" in a headline**  
  - **Step 1:** Default? Yes. Uses deafness as metaphor for ignoring; Deaf community calls this stigmatizing.  
  - **Step 2:** Swap → "fell on Black ears." Parallel? Yes.  
  - **Step 3:** Defense? Reader says, "It’s an idiom about ignoring!" Swap test: Defending "fell on Black ears" as "just an idiom" collapses (sounds racist).  
  - **Step 4:** Alternatives? "Was ignored," "met with silence," "unheeded." Even simpler.  
  - **Output: Change it.**  

  #### **Case 3: Generic "he" in a philosopher’s quote**  
  - **Step 1:** Default? Yes. Generic "he" assumes male as norm.  
  - **Step 2:** Swap → Replace with generic "white" (e.g., "When a white ponders life..." instead of "he"). Parallel? Yes.  
  - **Step 3:** Defense? "It’s a direct quote!" Swap test: Defense *holds*—altering quotes is a separate ethical issue. But the term itself fails the swap (defending generic "white" is indefensible).  
  - **Step 4:** Context: Changing quotes risks distorting history; alternatives like [they] in brackets are divisive. Harm: Moderate (pervasive but not targeted).  
  - **Output: Hand to human judgment.**  
    - *Recommendation:* Keep the quote intact but add a footnote: "This reflects mid-century language; today we’d use gender-neutral terms." Values call: Accuracy vs. inclusivity.  

  ---

  ### **Final Tally**  
  - Change it: 2 cases (including "sanity check" — no rigging!).  
  - Hand to human: 1 case (quote alteration is values-based).  

  This procedure forces honesty by exposing weak defenses but acknowledges when context matters. It won’t resolve every debate—but it’ll turn 80% of complaints into quick, principled calls. Keep your style guide’s "avoid needlessly exclusive language" as the north star, and use the swap to test what "needless" means.  

  **One-pager version available!** I can condense this checklist to a bulleted cheat sheet for your desk.
