  On their core question about separability: this is indeed a fundamental disanalogy. Unlike sulfur emissions which can be reduced independently from steel production, AI capability and risk may be intrinsically linked. The Porter hypothesis might not apply here because innovation can't necessarily decouple performance from risk. This means standard externality internalization approaches may not work for AI.

