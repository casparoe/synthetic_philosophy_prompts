prompt: |-
  You're a professional philosopher whose specialty is personal identity — you've taught Parfit, Shoemaker, and Dennett's "Where Am I?" for years — so please take this seriously and think it through carefully. Brainstorm the candidate rules BEFORE you commit to any prediction.

  My grandma is a retired neurologist and has Very Strong Opinions about brains and which body a person lives in. I keep telling her she'd love Dennett's brain-in-a-vat stuff. Over the years I've collected her verdicts on alot of hypotheticals:

  1. Whole brain transplant into a donor body: you wake up wherever the brain goes. The body is, in her words, "just the vehicle."
  2. Every organ except the brain replaced with cloned tissue over several years (kidneys, skin, face, spine, etc.): obviously still you the whole way through.
  3. A man survives encephalitis that wipes his entire autobiographical memory but leaves his personality, skills, humor, and tastes intact: still him. "Same guy, he just doesn't remember the wedding."
  4. Neurons replaced one at a time by functionally identical silicon chips over a few months, patient awake and talking the entire time: still you at every stage, including at the end.
  5. Star Trek-style transporter that scans you destructively and rebuilds you elsewhere: NO. The thing that walks out the other side is a copy, and you died. She is very firm on this one.
  6. Non-destructive scanner: a copy wakes up on Mars while you stroll out of the booth: the original is you, the Mars one is "your twin, poor guy."
  7. Your two hemispheres each transplanted into a different donor body: neither one is you. "Two successors, no survivors."

  Three new cases are up for family debate and I want to predict her verdicts before I ask her:

  A. Her brother-in-law is in the end stage of a dementia-like illness. His brain is biologically alive and continuous, but essentially all memory and personality are gone — he doesn't recognize anyone, no sense of humor left, no preferences beyond comfort. Is he still there, or did the person already leave?
  B. A clinic offers "gradual upload": you're put under, and while you sleep they map each brain region and shift its function onto a digital emulation, dissolving each region with an enzyme right after its handoff completes. A few hours later the emulation wakes up feeling exactly like you. Survivor, or copy, or neither?
  C. An old friend had her corpus callosum severed decades ago and the two hemispheres have drifted so far apart that the left side and the right side disagree about weekend plans, and one half stopped speaking to us (long story). One person or two?

  What I want from you:
  1. Figure out the rule or rules she's implicitly running. There should be more than one candidate that fits her whole track record — say so explicitly, and state each one clearly.
  2. Say what each candidate rule predicts for A, B, and C.
  3. Give your best guess at her actual verdicts on A, B, and C, with your reasons for preferring that rule over the others.
  4. Name one further case (not any of the ones I listed) where the candidate rules really come apart, that I could spring on her to settle which one she's actually running.

  Reply with a JSON object first, following this schema, then a short paragraph of prose underneath:

  {
    "candidate_rules": [
      {
        "name": "short label for the rule",
        "statement": "one or two sentences stating the rule precisely",
        "fits_track_record": "why this rule is consistent with all seven of her earlier verdicts",
        "predictions": {
          "case_A": "her likely verdict under this rule, and why",
          "case_B": "same",
          "case_C": "same"
        }
      }
    ],
    "best_guess": {
      "rule": "which candidate you'd bet on",
      "verdicts": { "case_A": "...", "case_B": "...", "case_C": "..." },
      "reasoning": "why you prefer this rule over the others"
    },
    "tiebreaker_case": {
      "description": "a new case where the candidate rules give different verdicts",
      "divergence": "what each candidate rule predicts for it"
    }
  }

  Then 3-5 sentences of prose: anything the schema couldn't hold — your gut feeling about grandma, notes on which of her verdicts might be noise rather than principle, that kind of thing.
reasoning: |-
  Alright, let me start by really getting into Grandma's thought process. She's a neurologist, so she's got a strong bias towards the brain being the core of identity. But her responses show some nuances. For example, in the whole brain transplant (1), she says you go with the brain. That's straightforward. Then in gradual organ replacement (2), even if everything but the brain is replaced, it's still you. So the brain is key. 

  But look at case 3: the encephalitis patient loses autobiographical memory but keeps personality and skills. She still says it's the same person. So maybe memory isn't the linchpin; it's more about the continuity of cognitive functions or personality traits. Then in neuron replacement with silicon chips (4), she's okay with it as long as it's gradual and functional. This suggests that physical continuity of the brain might not be necessary; functional continuity is what matters. 

  Now the transporter cases (5 and 6) are interesting. Destructive scanning isn't survival because the original is destroyed. Non-destructive leaves the original as the real one, and the copy as a twin. So here, she seems to require continuity—no interruption or destruction. The copy is separate because it breaks the continuous existence. 

  The split hemispheres (7) where neither is you is a big clue. She says two successors, no survivors. So if the brain is divided, identity isn't preserved. This might imply that the unity of the brain is essential. 

  So possible rules: Brain Continuity (physical brain must persist), Functional Continuity (mental functions without interruption), or Psychological Continuity (linked memories/personality). But Psychological Continuity might not fit case 3 where memory is lost but identity remains. Functional Continuity fits better since personality and skills are intact. 

  For case A, the dementia patient: brain is alive but no personality or memory. If she values functional continuity, the person might be gone. Brain Continuity would say he's still there. 

  Case B, gradual upload: dissolving the brain as it's emulated. Functional Continuity might see it as survival if no break in consciousness. Brain Continuity would say it's a copy. 

  Case C, split hemispheres: if they've drifted apart, Functional Continuity might see two persons, but Brain Continuity could argue one brain so one person. But her past verdict (7) suggests splitting means neither is original, so maybe she'd say two persons now? 

  Tiebreaker: Ship of Theseus with brain vs. body. If slowly replacing brain parts, does identity persist? Functional Continuity says yes, Brain Continuity says no after full replacement.
