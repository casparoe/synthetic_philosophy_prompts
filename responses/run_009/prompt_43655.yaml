  Below is the diagnostic quiz titled "Which Theory of Lying Do You Actually Hold?", designed to sort readers based on their reactions to concrete cases rather than self-identified labels. The quiz uses vivid scenarios drawn from classic debates about lying, with answer options phrased as intuitive reactions. Each question has 2–3 options to avoid overwhelming respondents while capturing key distinctions. The scoring key maps answer patterns onto six theoretical "leaves" (including Augustine's absolutism) and flags unoccupied combinations or indistinguishable leaves. A self-critical note follows the key.

  ---

  ### **Quiz: Which Theory of Lying Do You Actually Hold?**  
  *Instructions: For each scenario, select the reaction that best matches your gut feeling. There are no right or wrong answers—be honest!*

  1. **The Murderer at the Door**  
     A known murderer is at your door, demanding to know where your friend is. Your friend is hiding inside. You say, "They left for the train station," knowing this is false, to send the murderer away.  
     - A) This feels wrong—I shouldn’t say false things to mislead, even to save a life.  
     - B) This feels okay—saving a life justifies it.  
     - C) This feels okay—the murderer doesn’t deserve the truth.  

  2. **The Placebo Pill**  
     A doctor prescribes sugar pills to a patient with chronic pain, claiming they are a powerful new drug. The patient’s pain improves due to the placebo effect, and no harm occurs.  
     - A) This feels wrong—the doctor lied about what the pills are.  
     - B) This feels okay—it helped the patient and did no harm.  
     - C) This feels okay only if there were no other treatments.  

  3. **Santa Claus for a Child**  
     A parent tells their 5-year-old that Santa Claus delivers presents on Christmas Eve, knowing Santa isn’t real, to preserve the child’s excitement.  
     - A) This feels wrong—it’s a lie that manipulates the child’s trust.  
     - B) This feels okay—it brings joy and is a harmless tradition.  
     - C) This feels okay—the child will learn the truth eventually, and no real harm is done.  

  4. **The Coerced Promise**  
     Under threat of violence, you promise a criminal you’ll lie to police about their whereabouts. When police ask, you lie as promised.  
     - A) This feels wrong—I still lied to the police.  
     - B) This feels okay—I had no real choice because of the threat.  
     - C) This feels wrong—I should have broken the promise since it was forced.  

  5. **The Trivial White Lie**  
     You dislike your friend’s new haircut but say, "It looks great!" to avoid hurting their feelings.  
     - A) This feels wrong—it’s a lie, even if small.  
     - B) This feels okay—it was kind and prevented worse hurt.  
     - C) This feels okay—it’s a normal social habit, and no one is really fooled.  

  6. **The Misleading Truth**  
     During a witch hunt, a persecutor asks if you’re sheltering a target. The target is hiding in your cellar. You say, "They are not in this room right now" (which is technically true, as the cellar isn’t "this room"), intending to mislead.  
     - A) This feels wrong—I meant to trick them.  
     - B) This feels okay—I told the truth, and the persecutor has no right to the truth.  
     - C) This feels just as bad as lying—I deceived them.  

  7. **Silence Over a Cookie**  
     Your partner asks if you ate the last cookie (you did). You avoid answering by changing the subject.  
     - A) This feels wrong—I hid the truth to deceive them.  
     - B) This feels okay—I didn’t say anything false.  
     - C) This feels worse than lying—I dodged responsibility.  

  8. **Undercover Officer**  
     A police officer lies about their name and job to infiltrate a gang, gaining trust to prevent violent crimes.  
     - A) This feels wrong—lying is wrong, even for a good cause.  
     - B) This feels okay—it prevents greater harm.  
     - C) This feels okay—criminals have no right to the truth here.  

  9. **The Obvious Joke**  
     You tell friends, "I was so scared, I jumped 10 feet in the air!" as an exaggerated joke during a funny story. Everyone laughs and knows it’s not literal.  
     - A) This feels wrong—I said something false.  
     - B) This feels okay—it’s a joke, and no one was fooled.  
     - C) This feels okay—it’s harmless fun.  

  10. **Lie for Trivial Convenience**  
      You’re late to a meeting because you overslept but blame "traffic" to avoid embarrassment. The delay causes no real harm.  
      - A) This feels wrong—it’s a lie for a tiny benefit.  
      - B) This feels okay—no harm done, and it smoothed things over.  
      - C) This feels okay—it’s not a big deal.  

  ---

  ### **Scoring Key and Interpretation**  
  **How it works**: Tally your answers (e.g., 4 As, 3 Bs, etc.). The key maps patterns to six "leaves" (theories) based on logical splits in the cases. First, we identify the core questions the quiz turns on:  
  - **Wrongmaking feature**: Is lying wrong due to false assertion, intent to deceive, or rule-breaking?  
  - **Deception vs. lying**: Is deceiving without lying (e.g., misleading truths) better, worse, or the same?  
  - **Stakes and rights**: Can harm prevention justify lying? Does the questioner’s "right to truth" matter?  

  The leaves are:  
  1. **Augustinian Absolutism**: Every intentional false assertion (lie) is wrong, regardless of stakes. Deception without lying is also wrong. Lies are graded (e.g., trivial lies are less heinous than malicious ones), but impermissible.  
  2. **Deception-Focused View**: The core wrong is *intending to deceive*. Lying and non-lying deception (e.g., misleading truths) are equally wrong.  
  3. **Assertion-Norm View**: Lying is wrong because it violates the rule of assertion ("say what is true"). Deception via true statements is a lesser wrong.  
  4. **Equivocationist View**: Misleading truths or silence are permissible when the questioner has no right to the truth; outright lying is still wrong.  
  5. **Threshold View**: Lying is wrong but permissible if stakes (e.g., saving a life) are high enough. Low-stakes lies are impermissible.  
  6. **Deflationary View**: No unified rule—reactions depend on context, not a single principle.  

  **Mapping Answers to Leaves**:  
  - **Augustinian Absolutism (Leaf 1)**: Mostly **A** on lying cases (Q1–5, Q8, Q10), **A** or **C** on deception cases (Q6–7), and **A** on the joke (Q9) *if* you see it as deceptive. But for Q9, if you chose **B/C**, you may still fit if you deny intent to deceive.  
    - *Key pattern*: A for Q1, Q2, Q3, Q4, Q5, Q8, Q10; A or C for Q6 and Q7; A for Q9 (or B/C if no deception intended).  
    - *Grading preserved*: You may still rate lies as "less bad" in trivial cases (e.g., Q5) but always wrong.  

  - **Deception-Focused View (Leaf 2)**: **A** or **C** on *all* deception cases, including lies (Q1–5, Q8, Q10) and non-lying deception (Q6–7). For Q9, **A** if you see intent to deceive, or **B/C** if not.  
    - *Key pattern*: A or C for Q1–8, Q10; consistent focus on deception.  

  - **Assertion-Norm View (Leaf 3)**: **A** on lying cases (Q1–5, Q8, Q10), but **B** on non-lying deception (Q6, Q7). **B/C** on Q9 (no false assertion intended).  
    - *Key pattern*: A for Q1–5, Q8, Q10; B for Q6 and Q7; B/C for Q9.  

  - **Equivocationist View (Leaf 4)**: **A** on outright lies (Q1–5, Q8, Q10) but **B** or **C** when deception uses truth/silence *and* the questioner lacks a right to truth (Q6, Q7 with persecutor/gang; Q8 **C**). Mixed on other cases.  
    - *Key pattern*: A for Q1–5, Q10; B for Q6; B or C for Q7 and Q8.  

  - **Threshold View (Leaf 5)**: **B** or **C** on high-stakes lies (Q1, Q2, Q4, Q8), **A** on low-stakes lies (Q5, Q10), and variable on deception (Q6–7).  
    - *Key pattern*: B or C for Q1, Q2, Q4, Q8; A for Q5 and Q10; mixed elsewhere.  

  - **Deflationary View (Leaf 6)**: No consistent pattern. Mixed answers across stakes, e.g., **B** on Q1 (high-stakes lie okay) but **A** on Q10 (trivial lie wrong), **B** on Q6 (misleading truth okay) but **A** on Q7 (silence wrong).  

  **Unoccupied Combinations and Indistinguishable Leaves**:  
  - **Unoccupied combinations**:  
    - *All B/C on high-stakes lies but A on low-stakes deception* (e.g., Q1 B, Q6 A). This implies stakes matter for lying but not deception—an unstable view. Likely unattractive (why prioritize truth in deception but not lies?) and unexplored.  
    - *A on all lying cases but B on all non-lying deception*. This fits Assertion-Norm (Leaf 3), but if combined with B on high-stakes lies (e.g., Q1 B), it’s incoherent—no leaf holds this.  
    - *C on all deception cases (Q6, Q7)*. If paired with B on lies, it suggests non-lying deception is *worse*—unexplored and unintuitive.  

  - **Indistinguishable leaves**:  
    - *Augustinian Absolutism (Leaf 1) vs. Assertion-Norm View (Leaf 3)*: They agree on all lying cases (Q1–5, Q8, Q10: A) and the joke (Q9: B/C if no deception). They *only* split on non-lying deception (Q6, Q7): Augustinian says A/C (wrong), Assertion-Norm says B (okay). **Q6 and Q7 are the critical splitters.** If you chose A for Q6/Q7, you lean Augustinian; if B, Assertion-Norm.  
    - *Deception-Focused (Leaf 2) vs. Augustinian (Leaf 1)*: They overlap on deception cases (both A/C for Q6–7) but may differ on lies. Augustinian grades lies; Deception-Focused doesn’t. Hard to split—**Q5 (trivial lie) is a weak discriminator** (both may say A).  
    - *Threshold (Leaf 5) vs. Deflationary (Leaf 6)*: Threshold is consistent (high-stakes=okay, low=wrong); Deflationary is not. If inconsistent (e.g., Q1 B but Q5 A), you fit Deflationary.  

  **If you don’t fit a leaf**: Your pattern might be unexplored (e.g., you think silence is worse than lying—Q7 C—but no leaf holds this). See the self-critical note.  

  ---

  ### **Self-Critical Note**  
  As the quiz designer, I acknowledge limitations:  

  1. **Weakest Discriminator**: **Q5 (Trivial White Lie)** is the weakest. It fails to cleanly separate Threshold (where it should be A) from Deflationary (mixed) or Augustinian (A). Many may choose B/C due to social norms, even if their theory forbids trivial lies. This flattens distinctions between absolutist and threshold views.  

  2. **Misunderstood Question Pattern**: If a reader chooses **A for Q6 (Misleading Truth)** but **B for Q7 (Silence)**, they may misunderstand Q6. Q6’s answer B explicitly ties permissibility to "no right to the truth," while Q7 lacks that context. A user might think Q7’s partner *has* a right to the truth, leading them to B for silence but A for misleading truth—inconsistent for deception-focused theories. This signals confusion about "right to truth" framing, not an unstable view.  

  3. **Restructuring Trigger**: If confronted with a **case where a true statement deceives more harmfully than a lie** (e.g., a doctor truthfully says, "This won’t hurt," knowing the patient will misinterpret it as painless, causing panic), Threshold and Assertion-Norm leaves might merge. Threshold could extend to deception, and Assertion-Norm might need a "harm threshold" for non-lying deception. To split them, I’d add a question like:  
     *A teacher says, "Your grade is fine" (true, as "fine" means passing), knowing the student will think it means "good," so they don’t study and fail the final. Is this worse, better, or the same as lying?*  
     - Assertion-Norm would say "better" (true assertion), while Threshold might say "worse" (harmful deception).  

  **Guesses in Scoring**:  
  - The quiz guesses intent (e.g., Q9’s joke). If a respondent chooses A, it assumes intent to deceive, but they may see it as non-deceptive storytelling.  
  - For Equivocationist, it guesses when a questioner "has no right to the truth" (Q6, Q8). Users may disagree (e.g., does a criminal in Q8 "deserve" truth?), leading to false positives.  
  - Augustinian grading is inferred from calling lies "wrong" but not equally bad—this is soft, not strict.  

  This quiz is a starting point. Use it to spark debate, not as a final taxonomy.
