  ### Anthropic Reasoning Diagnostic Decision Tree  
  **Starting Point:** You accept ordinary Bayesian conditioning on non-indexical evidence. You are uncertain between rival cosmological hypotheses and know you exist as one observer among those entailed by the true hypothesis.  

  ---

  #### **Question 1: Doomsday Argument**  
  *Suppose two hypotheses about humanity's future:*  
  - *H₁: Total humans = 100 billion (early extinction).*  
  - *H₂: Total humans = 100 trillion (long future).*  
  *You learn you are among the first 100 billion humans. Should this increase your credence in H₁?*  
  - **Yes** → Go to Question 2.  
  - **No** → Go to Question 3.  

  ---

  #### **Question 2: Dungeon Prisoner**  
  *You are randomly placed in one of two dungeon cells by a fair coin flip:*  
  - *Cell A: 1 prisoner (all will be executed).*  
  - *Cell B: 2 prisoners (1 executed, 1 freed).*  
  *You are in a cell and know the setup. What is P(you are in Cell B)?*  
  - **1/3** → Go to Leaf 1.  
  - **1/2** → Go to Leaf 2.  

  ---

  #### **Question 3: Presumptuous Philosopher**  
  *Two cosmological hypotheses with no non-indexical evidence:*  
  - *H₁: Universe has 10¹⁰ observers (small).*  
  - *H₂: Universe has 10²² observers (large).*  
  *Should your prior credence in H₁ vs. H₂ be proportional to the number of observers?*  
  - **Yes** → Go to Leaf 3.  
  - **No** → Go to Question 4.  

  ---

  #### **Question 4: Sleeping Beauty**  
  *Beauty knows: a fair coin lands Heads (H) or Tails (T). If H, she is woken once (Monday). If T, she is woken twice (Monday/Tuesday; memory erased). Upon waking, what should be her credence in Heads?*  
  - **1/3** → Go to Leaf 4.  
  - **1/2** → Go to Question 5.  

  ---

  #### **Question 5: Dungeon Prisoner (Revisited)**  
  *Same as Question 2. What is P(you are in Cell B)?*  
  - **1/3** → Go to Leaf 5.  
  - **1/2** → Go to Leaf 6.  

  ---

  ### Leaves (Positions)  
  1. **SSA with Universal Reference Class**  
     - *Commitment:* Must include all observers (even non-human) in reference class. Awkward in cases with ambiguous observer boundaries (e.g., AI consciousness).  
     - *Path:* Q1=Yes, Q2=1/3.  
     - *Diagnosis:* Updates in Doomsday (broad class) and Dungeon (all prisoners).  

  2. **SSA with Narrow Reference Class**  
     - *Commitment:* Reference class is arbitrary (e.g., "humans alive now"). Vulnerable to gerrymandering (e.g., excluding future/alien observers).  
     - *Path:* Q1=Yes, Q2=1/2.  
     - *Diagnosis:* Updates in Doomsday (narrow class) but not Dungeon (ignores prisoner count).  

  3. **SIA (Self-Indication Assumption)**  
     - *Commitment:* Presumptuous philosopher problem: extreme confidence in a large universe without evidence.  
     - *Path:* Q1=No, Q3=Yes.  
     - *Diagnosis:* No Doomsday update (prior cancels evidence); weights hypotheses by observer count.  

  4. **SSA with Fixed Contextual Reference Class**  
     - *Commitment:* Reference class is fixed by problem context, not observers. Awkward if context is underspecified (e.g., cosmology without clear "experiment").  
     - *Path:* Q1=No, Q3=No, Q4=1/3.  
     - *Diagnosis:* No Doomsday update (fixed class same under H₁/H₂), but updates in Beauty (all wakings).  

  5. **Unnamed Position**  
     - *Commitment:* Inconsistent updating: ignores self-location in Doomsday/Beauty but updates in Dungeon. Likely incoherent or unattractive.  
     - *Path:* Q1=No, Q3=No, Q4=1/2, Q5=1/3.  

  6. **Deflationary View**  
     - *Commitment:* Never updates on self-locating evidence. Awkward in Dungeon: ignores prisoner count despite clear relevance.  
     - *Path:* Q1=No, Q3=No, Q4=1/2, Q5=1/2.  

  ---

  ### Notes  
  1. **Failed Separation:**  
     - **SSA Universal (Leaf 1) vs. SIA (Leaf 3):** Separated by Doomsday (Leaf 1 updates, Leaf 3 does not).  
     - **SSA Contextual (Leaf 4) vs. Deflationary (Leaf 6):** Separated by Sleeping Beauty (Leaf 4 updates, Leaf 6 does not).  
     - *Exception:* SSA Universal and SIA mimic each other in *non-observational* cases (e.g., Presumptuous Philosopher if reference class is "all possible observers"), but the tree separates them via Doomsday (observational evidence).  

  2. **Unoccupied Branches:**  
     - *All branches lead to a leaf.* No unoccupied paths.  

  3. **Key Thought Experiments:**  
     - **Doomsday Argument:** Tests whether "being early" updates credence (Q1).  
     - **Sleeping Beauty:** Tests whether self-location in time (waking) updates credence (Q4).  
     - *Distinguishes Halfers (Leaf 6) from Thirders (Leaves 1,4):* Halfers reject updating in Beauty; thirders accept it.  

  ---

  ### Instructions for Use  
  - Answer questions **without** researching positions.  
  - Disagreements are expected—branches are designed for debate.  
  - After class, map your leaf to readings (SSA: Bostrom; SIA: Neal; Deflationary: Lewis).  
  - Critique your leaf’s "awkward commitment" in discussion.
