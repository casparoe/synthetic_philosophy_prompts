  Hmm... the user's phrasing suggests they've already spotted key nuances (e.g., "Stern's model contains *zero* pure time preference") but want validation and systematization. They're also hinting at meta-concerns: is the philosophical PTP debate even relevant to real policy fights? And does Nordhaus's position secretly dodge ethics? 

  Time to dissect layer by layer. First, Stern: his near-zero δ (0.1%) is explicitly *not* PTP—it's extinction risk. Ethically, he rejects PTP entirely (symmetry argument). But practically, his η does heavy lifting (assuming future wealth → lower marginal utility). Then Nordhaus: his δ starts at 3% not because he *endorses* PTP ethically, but because market data shows people act *as if* they discount. His critique is about democratic legitimacy, not ethics. 

  Biggest revelation: the philosophers' symmetry argument doesn't touch Nordhaus's actual position! He's not defending PTP; he's saying policy can't ignore revealed preferences. Meanwhile, the η disagreement (Stern's 1 vs. Nordhaus's 2-3) is where growth assumptions create massive divergence—and PTP debates are silent here. 

  User's instinct is dead-on: the "grandchildren" framing is wrong. Both "discount" future consumption (via η), but Stern weights future *utility* equally while Nordhaus weights present *preferences* higher. And yes, granting philosophers their PTP win changes little—Nordhaus would still demand policy respect actual behavior. 

  Final twist: the episode exposes PTP as almost a red herring in policy. The real battles are over η (how much richer we expect the future to be) and democratic legitimacy (should policy override citizens' time preferences?). Philosophy’s symmetry argument is ethically airtight but politically inert here. 

  User gets full marks—their suspicion that "the concept can't do the work in a real policy fight" is painfully correct. The PTP framework is genuinely silent on growth projections and institutional legitimacy. Nordhaus didn't dodge ethics; he relocated the debate to where it matters for policy: whose values count?
answer: |-
  Here's a precise dissection of the Stern-Nordhaus clash through the lens of pure time preference (PTP), separating conceptual disagreements from conflated factors:

  ### 1. **Where PTP Actually Appears (Spoiler: Barely)**
     - **Stern’s Position**: His δ ≈ 0.1% is **not PTP**—it’s *catastrophe risk*. Ethically, Stern rejects PTP entirely (calling it "indefensible"), adopting philosopher Derek Parfit's symmetry argument: temporal location is morally irrelevant. His near-zero δ is a concession to *empirical uncertainty* (extinction risk), not ethical discounting.
     - **Nordhaus’ Position**: His δ ≈ 3% **is not primarily PTP either**. It’s *revealed preference*: a descriptive observation that people *behave as if* they discount the future. He doesn’t ethically justify PTP; he argues policy must reflect societal preferences to avoid "prescriptive" ethics divorced from reality.

  ### 2. **The Core Disagreement: Ethics vs. Positive Economics**
     - **Stern’s Ethical Stance**: Future utility deserves equal weight (PTP=0). Policy should correct market failures (including myopic behavior), not mimic them.
     - **Nordhaus’ Positive Stance**: Discount rates must align with observed behavior (market interest rates, savings) for policy legitimacy. He **dodges the ethical question**, treating discounting as a technical parameter derived from data, not moral philosophy. His critique is institutional: policies imposing non-paternalistic ethics lack democratic consent.

  ### 3. **The Hidden Heavyweight: Consumption Growth (η)**
     - Both models use the Ramsey formula: **r = δ + η·g**  
       (δ = "pure" rate, η = elasticity of marginal utility, g = consumption growth).
     - **Divergence Driver**: η was equally critical. Stern used η=1 (moderate inequality aversion), Nordhaus η=2-3 (strong aversion). Higher η means future wealth reduces the *marginal value* of consumption more sharply.  
       → *Even with δ=0*, Nordhaus’ higher η + positive g generates substantial discounting.  
       → The "care about grandchildren" narrative collapses: **both "discount" future consumption**, but Stern weights future *utility* equally (δ≈0), while Nordhaus weights present *preferences* higher.

  ### 4. **What Philosophers’ Symmetry Argument Engages (and Ignores)**
     - **Engages**: Stern’s rejection of PTP. If temporal position is arbitrary like geography, discounting is unethical.
     - **Ignores**: Nordhaus’ entire argument. Symmetry says nothing about:  
       - Whether policy must respect inconsistent/impatient preferences.  
       - How to set η or g (non-PTP parameters with ethical dimensions).  
       - Democratic legitimacy vs. ethical truth.

  ### 5. **What the Episode Reveals About the Philosophical Debate**
     - **PTP is a Sideshow in Policy**: The fight wasn’t about PTP—both effectively set δ near zero (Stern ethically, Nordhaus empirically). **>90% of their discount rate gap came from η and g assumptions**.
     - **Philosophy’s Blind Spots**:  
       - **Growth Ethics**: Philosophers focus on PTP, but η/g raise their own questions: How should we value utility at different wealth levels? Is declining marginal utility an ethical axiom or empirical guess?  
       - **Legitimacy vs. Morality**: Nordhaus forces a meta-question: Can "correct" ethics override citizen preferences? Philosophy debates ideal ethics; policy lives in non-ideal reality.  
       - **Risk vs. Time**: Stern’s δ blends risk (extinction) and ethics. But risk is probabilistic, not temporal—philosophy often treats them separately.
     - **The Unresolved Fight**: Granting philosophers their δ=0 victory **changes almost nothing**:  
       - Nordhaus would still demand market-consistent rates (via η·g).  
       - Stern’s aggressive climate policy relies on low η + high climate damages—not δ.

  ### Key Takeaways:
  - **PTP Wasn’t the Battlefield**: Stern used δ≈0 on ethical grounds; Nordhaus attacked its lack of descriptive realism, not ethics. The real conflict was **prescriptive ethics vs. democratic paternalism**.
  - **Growth Assumptions Dominated**: η and g did the heavy lifting. Disputes over future wealth and inequality aversion are where philosophy is needed—but largely absent.
  - **Philosophy’s Limits**: The symmetry argument is powerless against Nordhaus’ institutional critique. Policy requires wrestling with revealed preferences, even if irrational.
  - **The Grandchildren Myth**: Both discount consumption growth; Stern values future *utility* equally, Nordhaus values future *consumption* less. The fight was never about "caring."

  **In short**: The episode exposes PTP as a philosophical ideal too pristine for policy trenches. The real divides were about the authority of ethics, the valuation of future wealth, and the weight of everyday hypocrisy—questions where pure time preference is remarkably silent.
