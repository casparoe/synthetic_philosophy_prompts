  Breaking down Moore's argument proof-theoretically: the premises are perceptual judgments. For example, "I have a hand" and "This hand is external." The inference rule is existential generalization, leading to the existence of external objects. Formally, the derivation is valid if the premises are accepted. But soundness depends on whether the premises are true, which is where skeptics object.

  The user's analogy to proving consistency with stronger assumptions makes sense. Moore's proof relies on common-sense premises, which skeptics reject. So, the disagreement is about the axiom set. Philosophical objections like question-begging map to rejecting premises as circular. Semantic failures might relate to how "external" is interpreted. However, some objections, like dialectical ineffectiveness, don't have a direct proof-theoretic counterpart since proof theory doesn't address persuasion.

  The user's insight about axioms being the core issue seems correct. The derivation is valid, but premises are contested. The stratification analogy holds: Moore's proof is relative to common-sense axioms. Skeptics operate under different assumptions. The breakdown occurs because premises like perception being reliable aren't purely syntactic; they're about the world, which proof theory doesn't handle.

  I should also note where the analogy fails. Proof-theoretic soundness is about truth in all models, but here, models are the actual world versus skeptical scenarios. Moore assumes the actual model, while skeptics consider alternative models. This ties into the user's soundness concern—conclusions about the external world rely on the interpretation of premises.

  The user's question about whether premises like "raised hand" can be axioms touches on the nature of evidence. In proof theory, axioms are foundational but abstract. Moore treats perceptual judgments as axiomatic, but their justification is empirical, not formal. This might be where the fudging happens in translation.

  In summary, the key points are: valid derivation, disputed premises, stratification of axiom sets, and soundness tied to the model. Philosophical objections translate to premise rejection and interpretation issues, but rhetorical aspects don't fit. The user's suspicion about axioms being central is spot on. The analogy breaks when empirical premises and their justification come into play, which formal systems don't capture.
answer: |-
  Here's a proof-theoretic dissection of Moore's "Proof of an External World," tailored to your expertise, followed by the residue report addressing your core questions and analogies.

  **Proof-Theoretic Formalization of Moore's Argument:**

  1.  **Premises (Γ):**
      *   `P1: hand₁ exists` (Produced by ostension: "Here is one hand")
      *   `P2: hand₂ exists` (Produced by ostension: "Here is another")
      *   `P3: ∀x (Hand(x) → ExternalObject(x))` (Definitional Premise: Hands are paradigmatic external objects)
      *   `P4: hand₁ ≠ hand₂` (Distinctness Premise: Ostension of two distinct objects)
      *   `P5: ∃x Hand(x) → ∃y ExternalObject(y)` (Existential Quantifier Introduction Schema - applied to ExternalObject)

      *Γ = {P1, P2, P3, P4, P5}*

  2.  **Derivation (D):**
      1.  `P1` (Premise: hand₁ exists)
      2.  `P2` (Premise: hand₂ exists)
      3.  `P4` (Premise: hand₁ ≠ hand₂)
      4.  `P3` (Premise: ∀x (Hand(x) → ExternalObject(x)))
      5.  `Hand(hand₁) → ExternalObject(hand₁)` (∀-Elimination on P3, applied to hand₁)
      6.  `ExternalObject(hand₁)` (→-Elimination on 1 and 5) *[Using P1 as `Hand(hand₁)`]*
      7.  `∃y ExternalObject(y)` (∃-Introduction on 6) *[Using P5 implicitly as the rule]*
      *Alternatively, via hand₂:*
      8.  `Hand(hand₂) → ExternalObject(hand₂)` (∀-Elimination on P3, applied to hand₂)
      9.  `ExternalObject(hand₂)` (→-Elimination on 2 and 8)
      10. `∃y ExternalObject(y)` (∃-Introduction on 9)

      *Conclusion (C): `∃y ExternalObject(y)`*

  3.  **Formal Validity:** The derivation `D` is **formally valid** relative to standard first-order classical logic rules (∀-Elim, →-Elim, ∃-Intro) and the premise set Γ. If you accept Γ, `C` follows deductively.

  4.  **Soundness:** This is the central friction point. Proof-theoretic soundness usually means: If `Γ ⊢ C` is derivable and the rules are sound, then `C` is true in every model where all sentences in `Γ` are true.
      *   **The Problem:** The conclusion `C` ("External objects exist") is *about* the intended model – the actual external world. Soundness here requires:
          1.  The *sentences* `P1`, `P2`, `P3`, `P4` are **true** in the intended model (the actual world).
          2.  The intended model *is* a model where the interpretation of predicates like `Hand(·)` and `ExternalObject(·)` matches our understanding.
      *   **The Skeptical Challenge:** The skeptic denies we have non-question-begging access to the truth of `P1` and `P2` in the intended model. They argue that `P1` and `P2` presuppose the existence of the external world (`C`) to be justified. From *within* the skeptic's preferred "model" (e.g., a brain-in-a-vat simulation), `Hand(hand₁)` might be "true" as a perceptual experience, but `ExternalObject(hand₁)` would be false. Soundness fails *for the skeptic* because they reject the truth of `P1`/`P2` *under the intended external interpretation*.

  **Residue Report: Philosophical Objections ↔ Proof Theory**

  1.  **Question-Begging (Stroud, others):**
      *   **Proof-Theoretic Counterpart:** Directly maps to the **status of Premises `P1` and `P2`**. The skeptic argues that asserting `Hand(hand₁)` *as a premise known to be true* already assumes the existence of an external world (`C`). In proof-theoretic terms, they claim `P1` is not a legitimate *axiom* or *basic proof-theoretic primitive* for this conclusion because its justification semantically depends on `C`. It's like adding `C` itself as a premise disguised as `P1`. **This objection survives the translation intact.** It targets the admissibility of Γ.

  2.  **Semantic/Interpretation Failure:**
      *   **Proof-Theoretic Counterpart:** Maps to the **soundness condition and model-relativity**. The skeptic argues that Moore's derivation, while perhaps valid relative to Γ, isn't *sound* for the intended model because `P1` and `P2` don't have the necessary connection to external reality to guarantee `C`'s truth. They might argue the derivation only proves `∃y ExternalObject(y)` relative to an *internal* model of experience, not the *external* model. This is analogous to proving a statement holds in a Henkin model but not necessarily in the standard model. **This objection also survives translation.**

  3.  **Dialectical Ineffectiveness (Against Skepticism):**
      *   **Proof-Theoretic Counterpart: Weak/None.** Proof theory deals with validity and derivability *relative to a given system/Γ*. It doesn't inherently address rhetorical force or persuasiveness. A skeptic who simply rejects `P1` as a legitimate starting point is under no proof-theoretic obligation to accept `C`, just as someone rejecting the Axiom of Infinity isn't obliged to accept theorems depending on it. The "fuss" about Moore not *refuting* skepticism is a meta-level concern about argumentative context, not the internal derivation. **This doesn't map cleanly and is a distortion/fudge.** Proof theory shows the *conditional*: *If* you accept Γ, *then* `C` follows. It doesn't force acceptance of Γ.

  4.  **The Status of `P3` (Definitional Link):**
      *   **Proof-Theoretic Counterpart:** Minimal fuss here. `P3` acts like a **definitional axiom** or meaning postulate linking `Hand` and `ExternalObject`. Skeptics might challenge the *application* (e.g., "How do you know it's a *real* hand?"), but this circles back to challenging `P1`/`P2`, not `P3` itself. **Translated faithfully.**

  5.  **Ostension as Premise Introduction:**
      *   **Proof-Theoretic Distortion/Fudge:** This is the major point of friction. In standard proof theory, premises are syntactic strings assumed true. Moore introduces `P1`/`P2` via *perceptual acts* (holding up hands). **Translating an empirical, perceptual event (`raising hand`) into a syntactic premise (`Hand(hand₁)`) is the core fudge.** Proof theory abstracts away the *epistemology of premise justification*. Moore treats the perceptual judgment as *immediately justified* and thus suitable as a premise. The skeptic denies this immediacy for conclusions about externality. Proof theory *assumes* premises are given; it doesn't justify *how* they are given.

  **Addressing Your Core Insight & Analogy:**

  *   **Your Suspicion is Largely Correct:** You hit the nail on the head. Moore's derivation *is* formally valid relative to Γ (common-sense premises). The action *is* entirely in the choice of axioms/premises. Philosophers denying the conclusion aren't finding a flaw in the derivation (`D`); they are rejecting Γ (specifically `P1`/`P2`) as illegitimate starting points for proving `C`. Moore's point is: *Within our ordinary common-sense proof system (with perceptual judgments as basic premises), the existence of the external world is trivially derivable.* The skeptic operates with a different, more restrictive proof system where perceptual judgments about physical objects are *not* basic axioms but require further derivation from more secure premises (like sense-data), which Moore thinks is impossible or unnecessary.
  *   **Stratification Analogy (Consistency Proofs):** This analogy **holds remarkably well** and clarifies Moore.
      *   **Moore's Proof:** Proves `∃y ExternalObject(y)` (C) *relative to* the common-sense axiom system `CS`, where `P1`, `P2`, `P3`, `P4`, `P5` are basic.
      *   **Skeptic's Position:** Demands a proof of `C` *relative to* a more foundational system `F` (e.g., based solely on indubitable mental states or logical truths). They claim `CS` itself needs justification from `F`.
      *   **Moore's Response (Implicit):** `F` is either impossible (we can't reason *to* the external world from pure introspection/solipsism) or unnecessary (the axioms of `CS` are properly basic). Proving `C` relative to `CS` is perfectly legitimate and sufficient for knowledge *within* `CS`. Demanding a proof relative to `F` is an unreasonable shifting of the goalposts. Just as proving `Con(PA)` in `ZFC` is valuable *if you accept `ZFC`*, proving the external world exists relative to `CS` is valuable *if you accept `CS`*.
  *   **Where the Analogy Breaks Down:**
      1.  **Nature of Premises:** In math, axioms (`ZFC`) are abstract and stipulated. Moore's premises (`P1`, `P2`) are *empirical observations*. Their justification isn't pure stipulation but involves perception and its reliability, which is inherently external and contested. The "raised hand" premise carries an implicit claim about perceptual access to the external world that a mathematical axiom doesn't.
      2.  **"Soundness" Target:** Proving `Con(PA)` in `ZFC` is about the properties of formal systems. Moore's conclusion is about concrete reality. The "soundness" of `CS` isn't just consistency, but *correspondence to mind-independent reality*. This adds an extra, non-formal layer of concern ("How do we know `CS` accurately describes *that* world?").
      3.  **Universal Scope (Aspirationally):** While proof theorists are happy with relative consistency, Moore (and common sense) arguably holds that `CS` isn't just *one* system among many; it's *the* system describing fundamental reality. The conclusion `C` derived in `CS` is meant to be *absolutely* true, not just true-in-`CS`. The skeptic denies `CS` has this privileged status.

  **Conclusion:**

  You've grasped the essence. Moore's proof is valid relative to common-sense premises (`CS`). The philosophical debate centers entirely on whether those premises are legitimate axioms for knowledge about external reality. The skeptic demands derivation from a more foundational system (`F`), which Moore rejects as impossible or unnecessary. Proof theory illuminates this as a clash of axiom systems (`CS` vs `F`). The main translation fudges occur when representing perceptual acts (`raising hand`) as syntactic premises (`Hand(hand₁)`) and when trying to capture the dialectical/rhetorical context within pure derivability. The stratification analogy is powerful but breaks slightly on the rock of empirical justification and the intended model being concrete reality. Moore's point stands proof-theoretically: denying a valid derivation's conclusion while accepting its premises is irrational; the skeptic's only coherent move is to reject the premises.
