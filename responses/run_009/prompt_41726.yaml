  I'm a proof theorist by trade -- cut elimination, ordinal analysis, that kind of thing, it's what I do all day. Philosophy of knowledge I only know from osmosis. Take Moore's famous proof of an external world (the one where he holds up his hand and gives a second hand to go with it) and restate it in my vocabulary as faithfully as you can: what are the premises, what inference rules are actually being invoked, is the derivation formally valid, and what would soundness even mean here when the conclusion is about things outside my proof system rather than inside it. Then give me the residue report: which parts of what philosophers found objectionable to Moore's move actually show up in proof-theoretic terms (e.g. as question-begging axioms, or as some kind of semantic/interpretation failure), which parts you had to fudge or distort to squeeze into my vocabulary, and whether anything in the philosophical fuss has no counterpart at all in how I think about proofs. I've always half-suspected Moore's real point was something like: here is a perfectly valid, formally impeccable derivation whose conclusion people deny anyway -- so the action isn't in the derivation but in what we're each willing to take as axioms when we can't agree on a common proof system. Is that reading right, or am I smuggling in an assumption (maybe about what a "premise" even is when it's a raised hand instead of a formula)? And a related question I keep chewing on: in my world, proving consistency of a system from stronger assumptions is routine and we don't think it's worthless, we just label which system is doing the proving. Does anything like that stratification apply to Moore? Like, is he proving external things exist *relative to* some assumption set, and the skeptics are just refusing to fix one? Tell me where that analogy breaks down too.
