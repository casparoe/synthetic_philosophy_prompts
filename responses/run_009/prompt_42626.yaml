prompt: |-
  I've been in an emotions reading group for two years now and the fight between judgment theories (emotions are evaluative judgments, roughly the old Solomon/Nussbaum line), perceptual theories (they're perceptions of value -- fear is something like seeing the snake as dangerous), and pure feeling theories (they're just felt bodily changes) has gotten completely predictable. Judgmentism dies by phobia cases and recalcitrant emotions, the judgment people retreat to "as-construed" judgments or hybrids, the perception people get asked why fear then feels like a racing heart and not like seeing red, and the feeling people get told they've made emotion too dumb to explain why fear fits the snake rather than fitting the racing heart. Everyone knows every argument and nobody has moved an inch. My working hypothesis is that the dispute isn't really about what emotions are but about which explanandum gets priority -- rational role, phenomenology, or causal profile -- and that each theory is decent at one and terrible at the other two, so each side reads the others' failures as fatal and its own as mere qualifications. Is that right, or is there a genuine substantive ontological question hiding in here that's just hard? Diagnose what kind of disagreement this actually is, using what each side actually says, and tell me whether anything -- a conceptual distinction, affective neuroscience, an agreed set of test cases -- would count as progress given your diagnosis, or whether it's just ill-posed and always will be. Lead with the bottom line in your first sentence, then the reasoning, no preamble and no restating my question.
reasoning: |-
  Okay, the user is deeply involved in an emotions reading group and has been stuck in a theoretical loop for two years, debating judgment, perceptual, and feeling theories of emotion. They're frustrated by the predictable arguments and lack of progress. Their hypothesis is that the dispute isn't ontological but about prioritizing different explananda: rational role, phenomenology, or causal profile. They want to know if this is correct or if there's a genuine hard ontological question, and what could count as progress.

  First, I need to address their hypothesis. The user suggests each theory prioritizes one aspect and neglects the others. That makes sense. Judgment theories focus on rationality and intentionality (why fear targets a snake), but fail with cases like phobias where the judgment doesn't align. Perceptual theories handle the intentionality (seeing the snake as dangerous) but struggle with phenomenology—why the bodily feelings are central. Feeling theories capture the bodily experience but miss the intentional object (why fear is about the snake, not the heartbeat).

  The user asks if the debate is about explananda priority rather than ontology. I think they're onto something. Each theory emphasizes one facet: judgment on rational role, perception on phenomenology of experience, feeling on causal/physiological aspects. But they also have ontological commitments. Judgment theories see emotions as cognitive evaluations, perception as value perceptions, feeling as bodily states. So it's both methodological and ontological. The core issue might be defining what emotions fundamentally are, which ties into which aspect is essential.

  Is there a substantive ontological question here? Yes, because each theory makes a claim about the nature of emotions. But the lack of progress suggests the question might be ill-posed. Maybe emotions aren't a unified category, or different aspects are irreducible. Affective neuroscience could help by showing neural correlates, but might not resolve philosophical debates about essence. For example, if neuroscience shows simultaneous appraisal and bodily response, it could support hybrid theories, but philosophers might still argue over which part is essential.

  Possible progress points: Conceptual distinctions could clarify terms like "judgment" or "perception." Agreed test cases might highlight strengths/weaknesses. Neuroscience might reveal overlaps, pushing for hybrid models. But if the theories are prioritizing different aspects, agreeing on what counts as emotion's core might be necessary. The user might need a framework that integrates all three aspects without reducing one to another. The challenge is whether such a framework satisfies all sides or if compromises dilute the theories.

  Underlying needs: The user seeks a way out of the stalemate. They might want validation of their hypothesis, or a new angle to present to the group. They could be looking for practical approaches to move discussions forward, or understanding if the debate is futile. Their deeper need might be for a meta-framework that acknowledges the multifaceted nature of emotions, helping the group shift focus from winning arguments to integrative models.
answer: |-
  **The dispute is both a substantive ontological conflict about emotion's core nature *and* a methodological clash over explanatory priority, and progress is possible through integrative frameworks validated by neuroscience and refined conceptual distinctions.** Judgment theories (Solomon, Nussbaum) ontologically define emotions as evaluative propositions (e.g., "I judge this snake as dangerous"), prioritizing their rational role in fitting objects and justifying actions. Their retreat to "as-if" judgments or hybrids concedes failure on the explanandum of phenomenology (phobias feel automatic, not reasoned) and causal profile (bodily arousal often precedes judgment). Perceptual theories (e.g., Roberts, Tappolet) ontologically define emotions as value perceptions (fear *is* seeing-as-dangerous), prioritizing phenomenology's intentionality ("aboutness"). They struggle with the causal explanandum: why the distinct *felt bodily character* (racing heart) is essential if emotion is perception-like, and why "perceiving danger" doesn't feel like seeing color. Pure feeling theories (Jamesian, Prinz) ontologically reduce emotions to somatic feedback (fear *is* feeling the racing heart), prioritizing the causal-physiological explanandum. They falter on the rational explanandum: why fear fits snakes, not hearts, and how emotions justify actions or admit reasons.

  Your diagnosis is correct that each theory's proponents see their prioritized explanandum as defining emotion's essence, treating failures on others as secondary ("fatal" for rivals, "qualifications" for themselves). **However, there is a genuine ontological question:** Is emotion fundamentally a *cognitive evaluation*, a *perceptual experience of value*, or a *physiological state*? Each theory makes a mutually exclusive claim about what constitutes the emotion itself. The stalemate arises because emotion *simultaneously* manifests rational, phenomenal, and causal properties that resist reduction.

  **Progress is possible and would look like this:**
  1.  **Conceptual Distinction:** Clarifying core terms (e.g., "judgment" as propositional vs. "perception" as non-conceptual; "feeling" as interoceptive awareness vs. raw sensation) could reframe debates and expose false dichotomies.
  2.  **Affective Neuroscience:** Evidence that specific neural processes *integrate* appraisal, bodily arousal, and action readiness (e.g., core affect + conceptualization models, predictive processing frameworks) could shift the debate. Demonstrating that "evaluative judgments," "value perceptions," and "bodily feelings" are *co-emergent processes* within a unified system (e.g., involving amygdala, insula, vmPFC) undermines reductive ontological claims and supports multi-component ontologies. Cases like acquired blindsight (impaired "perception" but intact fear response) or specific lesions dissociating feeling from evaluation provide critical test cases.
  3.  **Agreed Test Cases:** Focusing on specific, agreed phenomena where the explananda *conflict* (e.g., recalcitrant emotions, emotional contagion without object, aesthetic emotions) forces engagement beyond prioritized domains. Success would be measured by theories explaining *all three* aspects coherently, even if complexly.
  4.  **Integrative Frameworks:** Hybrid theories (e.g., Helm's "felt evaluations," Deonna & Teroni's "attitudinal theory") that explicitly model the *relations* between evaluation, experience, and bodily state without reducing one to another offer a path forward. Progress occurs if such frameworks explain the *interdependence* of the explananda better than reductive accounts (e.g., why a bodily feeling *feels* like fear *of the snake* and *motivates* running).

  **The dispute won't resolve into a single reductive ontology**, but it can move beyond stalemate by accepting emotion's multifaceted nature and developing ontologies that systematically account for the integration of reason, experience, and body, validated by converging empirical and conceptual work. The core ontological question remains substantive, but its answer likely lies in complex relational structures, not simple essences.
