prompt: |-
  Write a parody of a rapid-response memo template issued by a fictional DC foreign policy think tank — call it the Institute for Applied Historical Perspective or something similarly bland — whose whole product line is telling policymakers which historical analogy governs the current crisis. The deliverable should look like an actual fill-in-the-blank crisis document: fields, checkboxes, a routing flowchart, maybe a footnote or two, roughly 650 words. The escalation ladder should start at Munich and only go up from there ("Munich," "Munich, but this time we're serious," etc.).

  The target isn't any particular politician or party, it's the genre of lessons-of-history reasoning. The jokes have to come from real features of how these analogies actually get used, so a person who reads foreign policy commentary should keep nodding: the way "Munich 1938" gets deployed for everything from annexations to a tariff dispute, and the way it's structurally impossible to argue *against* because that just proves you're Chamberlain; the way both hawks and doves claim the lessons of Vietnam and come away with opposite conclusions (never get in vs. never fight with one hand tied) while each insists the other side learned nothing; the way "the Thucydides trap" has become a fixed property of US-China relations rather than an argument that might be wrong; the fallback to 1914 when nothing else fits. Include a section where the memo performs its own analogy-vetting — does the causal structure of the analogy actually match the case? — in a way that always passes, like a checkbox pre-marked yes, since that's honestly how it works: the analogy is usually picked after the policy, to dress it. And a closing recommendations box that somehow reccomends the same policy no matter which analogy was selected.

  Deadpan throughout — it's a serious document from serious people, no winking. Don't invent dumbities for the think tank; every absurd move should be an exaggeration of something real that practitioners actually do, so the satire reads as fair rather than cheap. Bonus if there's one small moment where the template's logic breaks and the memo has to awkwardly patch itself (e.g., a crisis where both sides are invoking Munich at each other and the form only has one field for Chamberlain).
reasoning: |-
  Okay, let me break down this user request. They want a satirical memo template from a fictional DC think tank that parodies how historical analogies are misused in foreign policy. The key is to mirror real-world absurdities without inventing new dumbness - every joke must be rooted in actual practice.

  Hmm, the user clearly knows their stuff - they referenced specific tropes like Munich/Vietnam flip-flopping and the immutable Thucydides Trap. This isn't just about mocking think tanks; it's a critique of lazy historical reasoning as a whole. The challenge is keeping it deadpan while exposing how these analogies are reverse-engineered to justify predetermined policies.

  I'm imagining the structure: First, the header with pompous institutional branding. Then crisis intake fields where any event can be retrofitted into historical boxes - that's where we'll put the "Munich but serious" escalation ladder. Must include that beautiful contradiction where both sides accuse each other of being Chamberlain. 

  For the analogy vetting section, I'll use that pre-checked "causal alignment" box - perfect representation of confirmation bias. And the recommendations? Obviously they all point to the same hawkish outcome regardless of selected analogy. That's the punchline: history as decoration, not teacher.

  Wait, the user asked for one logic-breaking moment... Ah! When both actors claim Munich simultaneously. The form will short-circuit with bureaucratic nonsense about "recursive appeasement." Classic DC move - when reality contradicts your model, invent jargon.

  Footnotes should wink at academic pretension. Maybe one citing Thucydides in Greek (badly transliterated), another calling Kennan "St. George" for that saintly gravitas. The tone must stay utterly serious - the more solemn the delivery, the sharper the satire.

  Final touch: the disclaimer about how 1914 is always the default analogy. Because when your only tool is a world war hammer...
answer: |-
  **INSTITUTE FOR APPLIED HISTORICAL PERSPECTIVE**  
  **MEMORANDUM: RAPID ANALOGICAL RESPONSE TEMPLATE (RART)**  
  **CLASSIFICATION: HISTORICALLY SENSITIVE // POLICY URGENT**  

  **TO:** Senior Policy Coordinator  
  **FROM:** Analogical Assessment Desk (AAD)  
  **DATE:** [DATE]  
  **SUBJECT:** Application of Validated Historical Precedent to Current Crisis: [CRISIS NAME - e.g., "Dispute over Mineral Rights in the Sea of Tranquility"]  

  ---

  **I. CRISIS INTAKE & PRELIMINARY CHARACTERIZATION**  
  *(Complete all fields. Use precise historical terminology.)*

  *   **Primary Aggressor State(s):** _________________________  
  *   **Primary Appeaser/Defender State(s):** _________________________  
  *   **Object of Contention:** [ ] Territory [ ] Sphere of Influence [ ] Trade Privileges [ ] Ideological Primacy [ ] Other: _______________  
  *   **Perceived Violation:** [ ] Sovereignty [ ] Treaty Obligation [ ] "Rules-Based Order" [ ] Credibility [ ] Other: _______________  
  *   **Current Rhetorical Temperature:** [ ] Tepid [ ] Simmering [ ] Boiling [ ] Thermonuclear Metaphor Detected  

  **II. PRIMARY HISTORICAL ANALOGY SELECTION**  
  *(Check ONE dominant paradigm. Escalation is inherent.)*

  *   **[ ] Munich (1938 Baseline):** Standard appeasement scenario. Aggressor makes maximalist demands; concessions indicate weakness, guaranteeing wider war. *Caution: Do not confuse with "Diplomacy."*
  *   **[ ] Munich (Enhanced Gravity - "This Time We're Serious"):** Standard Munich parameters apply, *plus* one (1) or more of: cyber intrusions, economic coercion, social media manipulation, or leader photographed wearing non-democratic headgear. Failure to act = irreversible cascade.
  *   **[ ] Vietnam (Counter-Insurgency Variant):** Application of force in complex political/cultural terrain against asymmetric opponent. Primary Lesson: [ ] "Never Fight With One Hand Tied" (Requires Escalation) / [ ] "Quagmire Avoidance" (Requires Withdrawal) *\*See Note 1*
  *   **[ ] Thucydides Trap (Peloponnesian Precedent):** Rising power ([RISING POWER]) challenges established hegemon ([HEGEMON]). Structural inevitability of conflict obviates need for detailed causal analysis. *Default settings: Rising Power = [AUTOFILL: China], Hegemon = [AUTOFILL: USA].*
  *   **[ ] Sarajevo 1914 (Complex Systems Failure):** Applicable when crisis involves multiple powers, tangled alliances, miscommunication, and mobilization timetables. Outcome: Inadvertent catastrophic war. *Default selection when no other analogy fits cleanly or crisis occurs in Balkans.*
  *   **[ ] Other (Specify & Justify - Requires Level 5 Clearance):** _________________________ (e.g., "The Anabasis, but in Space"; "Brexit as Habsburg Succession Crisis"). *Strongly discouraged. Munich usually suffices.*

  **III. ANALOGY VETTING & VALIDATION**  
  *(Ensuring Causal Fidelity - Mandatory Step)*

  *   **Does the selected historical analogy share *at least one (1)* superficial similarity with the current crisis?**  
      [X] YES (e.g., "Both involve maps"; "Leaders spoke forcefully"; "A treaty existed somewhere").
  *   **Are key actors plausibly mapped to historical roles?**  
      [X] YES (Aggressor = Hitler/Tojo/Philip II; Defender = Chamberlain/Daladier/League of Nations; Rising Power = Athens; Hegemon = Sparta).
  *   **Are divergent contextual factors (technology, culture, economics, etc.) deemed non-essential to the core lesson?**  
      [X] YES (Historical lessons transcend ephemeral context. Core dynamics are eternal).
  *   **Is the analogy's predictive failure in past applications attributed to flawed *implementation*, not flawed *analogy*?**  
      [X] YES (e.g., "Iraq wasn't Vietnam *enough*"; "We didn't appease *sufficiently* in Crimea").
  *   **Conclusion:** Selected Analogy [ ] IS VALID / [X] REMAINS OPERATIVE DESPITE CONTEXTUAL NOISE. Proceed to Recommendations.

  **IV. RECOMMENDED POLICY POSTURE**  
  *(Derived solely from immutable historical lesson)*

  *   **Based on Selected Analogy:**  
      *   **Munich (Any Variant):** Demonstrate Resolve. Immediate, tangible escalation of commitment/sanctions/military posture required. Concessions = Catastrophe. *Any alternative path objectively constitutes appeasement.*
      *   **Vietnam ("Hand Tied"):** Remove Constraints. Apply overwhelming, unrestricted force to achieve decisive victory. Gradualism = Defeat.
      *   **Vietnam ("Quagmire"):** Disengage Immediately. Cut losses. Further investment = Sunk Cost Fallacy Manifest. *Paradox Resolution: See Routing Flowchart Below.*
      *   **Thucydides Trap:** Managed Competition/Containment. Acknowledge inevitability of conflict; focus on shaping conditions and building coalitions. Engagement fosters dangerous illusions. *Appeasement is structurally impossible but must still be guarded against.*
      *   **Sarajevo 1914:** Extreme Caution & De-escalation. Prioritize off-ramps, communication channels, and symbolic restraint. Mobilization = Inadvertent War. *BUT: Ensure de-escalation does not inadvertently signal weakness (see Munich).*
  *   **Core Recommendation Synthesis:** **Maintain/Increase Coercive Pressure & Demonstrate Unwavering Resolve.**  
      *(Rationale: All validated historical analogies converge on the imperative to project strength and avoid perceptions of weakness. Withdrawal/De-escalation options carry inherent Munich/Appeasement risk. Vigilance against Thucydidean dynamics necessitates robust posture. Even Sarajevo management requires credible deterrents. Therefore, regardless of selected analogy, the essential policy direction remains strategically aligned.)*

  **V. SPECIAL CIRCUMSTANCES ROUTING FLOWCHART**  
  *(For non-standard analogy application)*

  *   **Are both primary actors accusing each other of being "the new Hitler"?**  
      *   YES --> Proceed to "Recursive Appeasement Protocol" (RAP): Designate *one* actor as Aggressor based on: [ ] Alignment with current strategic priorities / [ ] More theatrically convincing uniforms / [ ] Coin flip. Apply Munich analogy to designated Aggressor. **Recommendation:** Escalate against designated Aggressor.
      *   NO --> Proceed normally.
  *   **Does the Vietnam analogy generate conflicting recommendations ("Hand Tied" vs. "Quagmire")?**  
      *   YES --> **Default:** Apply "Hand Tied" protocol. Rationale: Potential for victory remains theoretically possible; withdrawal guarantees defeat and harms credibility (see Munich). **Recommendation:** Escalate.
  *   **Is the crisis occurring in a region/context with no clear 20th-century precedent?**  
      *   YES --> **Default:** Apply Sarajevo 1914 ("It's the Archduke Franz Ferdinand of regions!"). **Recommendation:** Cautious but visible force posture to deter mobilization while seeking off-ramps (ensuring off-ramps do not imply weakness - see Munich).

  **VI. DISCLAIMERS & FOOTNOTES**

  *   *Note 1:* The Vietnam analogy possesses unique quantum properties, allowing simultaneous validity for mutually exclusive policy recommendations ("Never Again" vs. "Win Next Time"). Selection bias based on pre-existing policy preference is inherent and operationally necessary. Contradiction is managed via routing flowchart.
  *   *Note 2:* The Thucydides Trap is not a hypothesis subject to falsification; it is an ontological condition of the US-China relationship. Attempts to disprove it merely demonstrate a lack of historical perspective.
  *   *Historical Fidelity Assurance:* This memo utilizes only Institute-precleared analogies from the Master Historical Lexicon (MHL v.7.2). Unauthorized analogies (e.g., War of 1812, Thirty Years' War Phase IV, The Cod Wars) are unreliable and strictly prohibited. 1914 remains the universal fallback.
  *   **WARNING:** Arguments asserting "this time is different" constitute dangerous historical illiteracy and may indicate latent appeasement tendencies. Report such deviations to AAD Security.

  **APPROVED BY:**  
  Director, Analogical Assessment Desk  
  *Per Historiam, Pax (Through History, Peace - or Victory, as Context Dictates)*

