  ### Lakatosian Research Programme Simulation Game  
  **Objective:** Students experience core tenets of Lakatos' philosophy (hard core, protective belt, progressive/degenerating programmes) by running a research programme to predict a hidden sequence rule.  

  ---

  ### **Game Mechanics**  
  #### **Setup (15 minutes)**  
  1. **Teams:** Divide 18 students into 4 teams (4-5 students each).  
  2. **Core Claims:** Each team writes a **non-negotiable core claim** on a card (e.g., "The sequence is quadratic," "Numbers alternate parity," "Each term is divisible by its position"). Collect cards and display them publicly.  
  3. **Sequence Rule (Hidden):**  
     - **Rule:** \( a(n) = \begin{cases} 
        n^2 + n & \text{if } n \mod 3 = 1 \\
        n^2 - n & \text{if } n \mod 3 = 2 \\
        n^2 - 1 & \text{if } n \mod 3 = 0 
      \end{cases} \)  
     - **Sequence:** 2, 2, 8, 20, 20, 35, 56, 56, 80, 110, ...  
     *(Example: \(n=1\) → \(1 \mod 3 = 1\) → \(1^2 + 1 = 2\); \(n=3\) → \(3 \mod 3 = 0\) → \(3^2 - 1 = 8\))*  
  4. **Materials:** Whiteboard (to reveal terms), prediction slips, team worksheets (for auxiliary assumptions), scoreboard.  

  #### **Gameplay (50 minutes)**  
  - **Rounds:** 8 rounds (terms 2–9 revealed one-by-one). **Time per round:** 5 minutes.  
    | **Step** | **Action** | **Time** |  
    |----------|------------|----------|  
    | **1. Reveal** | Display \(a(n)\) for current \(n\) (start with \(n=1: 2\)). | 1 min |  
    | **2. Predict** | Teams predict \(a(n+1)\) *before* reveal. Must justify using core + auxiliaries. | 3 min |  
    | **3. Score** | Reveal \(a(n+1)\). Teams with correct predictions get **+1 point**. | 1 min |  
    | **4. Adjust** | Teams revise auxiliary assumptions (e.g., "Add +1 when \(n\) is prime") to explain new data. **Core claim cannot change.** | Embedded |  

  - **Defection Mechanic:**  
    - A team may defect **between rounds** by joining another team.  
    - **Cost:** Defectors lose **all points** and adopt the new team’s core claim.  
    - **Benefit:** Host team gains **+1 point** per defector (simulates influx of resources).  

  - **Scoring Scheme:**  
    - **+1 point** per correct *prediction* (not explanation).  
    - **0 points** for post-hoc accommodation.  
    - **Final bonus:** **+3 points** for any team predicting ≥5 terms correctly.  

  #### **Endgame (5 minutes)**  
  - Reveal term 10 (\(a(10) = 110\)) and declare winner.  
  - Teams share core claims, auxiliary assumptions, and prediction success.  

  ---

  ### **Ensuring a Degenerating Programme**  
  - **Scoring Design:**  
    - Teams with **inflexible cores** (e.g., "Sequence is always even") will fail at \(a(3)=8\) (even), \(a(6)=35\) (odd).  
    - **Auxiliary spiral:** To survive, they add assumptions (e.g., "Except when \(n\) is divisible by 3, then subtract 1").  
    - **Low prediction points:** These teams score ≤2 points, triggering defection.  
  - **Why It Works:**  
    - 2/4 teams likely choose cores incompatible with the rule (e.g., linearity).  
    - The modulus rule ensures early terms (2, 2) mislead, while later terms (35, 110) punish oversimplified cores.  

  ---

  ### **Debrief Mapping (20 minutes)**  
  | **Game Experience** | **Lakatosian Concept** |  
  |---------------------|------------------------|  
  | Fixed core claim | **Hard core** (irrefutable by convention) |  
  | Auxiliary assumptions (e.g., "Add 5 if prime") | **Protective belt** (adjusts to anomalies) |  
  | Points for correct predictions | **Progressive problemshift** (novel predictions) |  
  | Explaining past data with no new predictions | **Degenerating problemshift** (post-hoc epicycles) |  
  | Teams joining successful programmes | **Defection to a rival programme** |  
  | One team with 0 points and tangled assumptions | **Degenerating programme** (e.g., clinging to falsified core) |  
  | High-scoring team with simple assumptions | **Progressive programme** (e.g., core close to hidden rule) |  

  **Key Reflection Points:**  
  - "Why did Team A stick to their core despite failures?"  
  - "How did Team B’s auxiliary assumptions shift from predictive to defensive?"  
  - "What prompted defections? Was there a 'better' rival?"  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Teams cheat on core claims:**  
     - **Prevention:** Collect core cards upfront and display them. Randomly audit team worksheets.  
     - **Response:** "Your core is immutable. If auxiliaries contradict it, your programme is inconsistent."  

  2. **One team guesses the rule early:**  
     - **Prevention:** Use a complex rule (modulo operations). Start with misleading terms (2, 2).  
     - **Response:** If a team dominates, praise their "progressive programme" and ask others: "Why stick with your core despite a clear rival?"  

  3. **No defections occur:**  
     - **Prevention:** Announce penalty/bonus loudly. After round 4, warn low-scoring teams: "You may defect now."  
     - **Response:** Highlight in debrief: "Why did no one defect? Loyalty? No viable rival?"  

  4. **Time management:**  
     - **Prevention:** Use a timer. Cap auxiliary discussions at 2 minutes after round 3.  
     - **Adjust:** Skip term 9 if behind; terms 6–8 suffice to show degeneration.  

  ---

  ### **Where the Game Misleads (Clarify in Debrief)**  
  - 🎯 **Fixed rule:** Real science has no facilitator with a "true" rule—theories face open-ended nature.  
  - 🏆 **Competition:** Scientists don’t "win points"; they seek truth, funded by institutions (not rivals).  
  - 🔄 **Defection cost:** In reality, switching programmes involves retraining, stigma, and resource loss—not just a point reset.  
  - ⚖️ **Ambiguity of degeneration:** Real programmes aren’t "clearly" degenerating until hindsight; Lakatos’ criteria are contested.  

  ---

  **Why This Works:**  
  - Teams **live** the tension between core loyalty and predictive success.  
  - The scoring/defection mechanics **force** auxiliary epicycles or strategic shifts.  
  - Debrief uses **their experience** to define Lakatos’ terms—no lecture needed.  

  **First Run Tip:** Run a mock round (e.g., \(n=1 → n=2\)) to demonstrate prediction vs. adjustment.
