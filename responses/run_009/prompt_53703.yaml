answer: |-
  Here's the translation, residue report, and breakdown as requested:

  **Expressivism → Programming Analogy:**  
  Moral utterances ("lying is wrong") are **effectful expressions**. Their primary function isn't to return a truth-value (`Bool`), but to perform an **attitudinal effect**: `boo(lying)` (disapproval) or `cheer(lying)` (approval). Evaluation produces an *attitude* (a mental state), not a fact. The utterance's *meaning* is tied to this effect. Pure declarative statements ("snow is white") are pure expressions returning `Bool`.

  **Frege-Geach Problem → Embedding Issue:**  
  Consider the conditional: `if (lying is wrong) then (gettingBrotherToLie is wrong)`.  
  *   **Standalone:** `"lying is wrong"` → Effect: `boo(lying)` (attitude expressed).  
  *   **Embedded:** Inside the `if`-clause, `"lying is wrong"` is **not evaluated** – no `boo` effect occurs. Its *meaning* must be preserved solely as a **value** (like an unevaluated thunk or a description of the effect) to allow logical composition (modus ponens). Expressivism struggles because its core semantics equates meaning *only* with the immediate effect (`boo`), which vanishes under embedding. It's like trying to use `print("Hello")` (type `IO ()`) directly in a pure `if` condition (expects `Bool`). The types clash: `Effect` ≠ `Bool`.

  **Quasi-Realist "Solution" → Monadic Effect Tracking:**  
  Quasi-realism aims to make moral discourse *behave as if* it's truth-apt, even though its foundation is attitudinal. This parallels **monads/effect systems**:  
  1.  **Lift Attitudes to Propositions:** Introduce a type `MoralProp` (like `IO Bool`). `"lying is wrong"` isn't just `boo(lying)`, but has type `MoralProp` – a *description* of the attitude/proposition *plus* its potential effect.  
  2.  **Track in Types:** Logical operators (`if`, `and`, `or`) become **effect-polymorphic functions**. They handle `MoralProp` values *without* immediately evaluating the effect, preserving meaning under embedding.  
      *   `ifThen : MoralProp -> MoralProp -> MoralProp`  
      *   The conditional `if (P) then (Q)` constructs a *new* `MoralProp` combining `P` and `Q`.  
  3.  **Deferred Evaluation/Assertion:** Asserting a standalone moral claim (`assertMoral P : MoralProp -> IO ()`) finally "runs" the effect (`boo`/`cheer`). Embedding keeps it as an unevaluated `MoralProp`.  
  4.  **Recover Truth-Aptness (Quasi-Realism):** Define "truth" for `MoralProp` relative to the speaker's attitude system (e.g., `P` is "true" iff accepting `P` coheres with one's attitudes). Modus ponens is "truth"-preserving under this constructed notion.

  **Residue Report:**

  1.  **What Translates Cleanly:**
      *   Core expressivist semantics = Effectful evaluation.
      *   Embedding problem = Effect/Value type mismatch in pure contexts.
      *   Quasi-realist project = Introducing an effect-tracking type (`MoralProp`) and defining composition/deferred execution.
      *   Need for compositionality = Requirement for higher-order functions over `MoralProp`.

  2.  **What's Distorted/Strained:**
      *   **Contradiction (Your Bug #1):** Two people saying `"Lying is wrong"`/`"~Lying is wrong"` feels like a genuine contradiction. In the effect model, it's `boo(lying)` vs. `cheer(lying)` or `assertMoral(P)` vs. `assertMoral(not P)`. While opposing *effects*, the *feeling* of genuine disagreement about "how things are" is underplayed. Quasi-realism *aims* to recover this via constructed truth, but it's synthetic, not fundamental like pure `Bool` disagreement. This *is* residue: the effect model struggles to fully capture the *objectivity* felt in moral disagreement. (Distortion: Modeling disagreement as opposing effects, not clashing truth-claims).
      *   **Modus Ponens & Validity (Your Bug #2):** Modus ponens *feels* truth-preserving. Expressivism rejects fundamental truth-aptness. Quasi-realism/monad analogy *constructs* a notion of validity (`if P is 'true' and (if P then Q) is 'true', then Q must be 'true'`) based on attitudinal coherence. It works technically within the system, but the "truth" preserved is *defined by* the system of attitudes, not correspondence to external facts. Residue: Validity requires building a surrogate for truth-preservation.

  3.  **What Has No Direct Counterpart:**
      *   **The Nature of Attitudes:** The specific *phenomenology* of moral disapproval (`boo`) vs. other sentiments (disgust, fear) isn't mirrored in `IO` effects. Programming effects are behavioral (print, mutate); moral attitudes are complex mental states.
      *   **The Motivational "Oomph":** Expressivism often links moral judgment to motivation ("If I think lying is wrong, I'm motivated not to lie"). While an effect *could* model this (e.g., `boo` triggers an action), it's not inherent in the type `MoralProp` itself like it is in expressivist theory.

  **Breakdown Point & Conclusion:**

  The analogy **holds remarkably well** for the *compositionality problem* itself (Frege-Geach). Quasi-realism *is* functionally similar to introducing a monadic type to track and defer attitudinal effects, enabling logical embedding.

  **Where it fundamentally breaks down** is if pressed on the *metaphysical status* of the constructed "truth" and "propositions":
  1.  **Expressivist Denial:** Expressivists deny moral properties exist independently of attitudes. The monad analogy *starts* from this (effects are fundamental). However, quasi-realism's project is to show how *discourse about* such properties emerges. The analogy accepts this emergence (`MoralProp` simulates truth-aptness) but doesn't *justify* it philosophically – it just models the discourse mechanics.
  2.  **The Core Tension:** The feeling of genuine contradiction and objective truth-preservation points to something the effect model *accommodates* technically but doesn't *naturally explain*. A dualist (moral facts exist) would say the analogy smuggles in realism via the backdoor of `MoralProp`. The expressivist insists `MoralProp` is *only* a useful fiction built on attitudes.

  **Verdict:** Your instinct is **largely correct** for the *formal semantics of embedding* and the *structure of the solution*. Quasi-realism *is* analogous to effect tracking via a monad-like type (`MoralProp`). The residue centers on the *philosophical interpretation* of that type and the nature of disagreement/validity – which is precisely where the expressivist battle is fought. The analogy works as a model *of* expressivism's solution, not as a refutation or independent justification.
