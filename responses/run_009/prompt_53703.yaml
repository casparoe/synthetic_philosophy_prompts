prompt: |-
  I'm a self-taught programmer (mostly functional stuff, Haskell at work, some Rust on the side) with zero philosophy background. I fell down a rabbit hole a few weeks ago after an argument with a friend about whether moral claims can be true or false, and she brought up this position called expressivism -- the idea that when I say "lying is wrong," I'm not stating a fact, I'm expressing an attitude, basically boo lying. Then there's apparently this famous problem for it called the Frege-Geach problem (pretty sure I'm pronouncing Geach right, no idea), which as far as I can tell is about embedding: "if lying is wrong, then getting your little brother to lie is wrong" -- the phrase "lying is wrong" has to keep the same meaning inside the conditional as it has when you say it outright, but when its buried in an if-statement you're not expressing disapproval of lying at all, so where did the meaning go.

  Here's why I'm writing you. This sounds almost exactly like a problem we have in programming all the time. Expressions with side effects -- printing, throwing exceptions, mutating state -- dont compose into pure code. You can't just drop a print into the middle of a pure function and expect the types to work out. And the standard fix is monads and effect systems: you track the effects in the types, so the same expression carries the same meaning in pure and effectful contexts, composition still works, and you never had to pretend the effects dont exist. So my instinct is: expressivism = "moral talk is effectful, not pure," Frege-Geach = "effects don't compose into pure contexts," and whatever the philosophers' solution is (someone mentioned quasi-realism?) = basically monads. I want to know if that instinct is right or missing something.

  Run the translation properly, dont just wave at it. Restate expressivism and the Frege-Geach problem in my vocabulary -- expressions, values, evaluation, contexts, effects, monads, whatever actually fits -- as faithfully as you can, including the conditional/embedding part. Then the residue report: what translates cleanly, what you had to distort to make it fit, and what has no counterpart in my vocabulary at all. Two things already bug me: (1) a person who says "lying is wrong" and a person who says "lying isn't wrong" seem to be genuinely contradicting each other, and I cant see how two print statements contradict -- is that part of the residue? (2) modus ponens on those conditionals feels valid, but validity is about truth-preservation -- can an effect-based semantics even have validity, or is truth-aptitude something the monad story has to recover rather than assume? Then tell me whether the residue points at something the expressivists are missing or at something my vocabulary cant say -- and be explicit about where you'd expect this whole translation to break down if someone fluent in both fields read it closely, since I'd genuinely change my mind about the monad analogy if shown where it quietly assumes something expressivists deny. Keep it under 700 words total; Id rather have the honest short version than a padded long one.
