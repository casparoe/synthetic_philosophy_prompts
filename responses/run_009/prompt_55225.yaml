prompt: |-
  I write about science and ideas for a newspaper — mostly physics stories, the odd book review — and something I keep bumping into has started to bug me, so I'm hoping a philosopher can untangle it.

  Whenever a big result drops, say a new measurement that disagrees slightly with the standard model of particle physics, the physicists I ring up all say some version of the same thing: this doesn't mean the old theory is wrong, it means we're converging, the old theory was always known to be incomplete, this is what progress looks like. Then in the next breath they'll describe some rival framework somebody proposed in the nineties as just wrong — not incomplete, wrong. And the whole machinery of the field runs on the same assumption: exam boards teach teenagers Newtonian mechanics as if it were simply true, then reveal at A-level or uni that it's an approximaton that breaks down at high speeds and small scales; a new theory counts as promising partly because it reduces to the old one in familiar regimes; a small anomaly is business as usual while a big one is a crisis.

  Here's what I want to understand. What view of truth — or of what a theory even is — does all of that presuppose? The practice seems to need some notion of distance from the truth: Newton was false but nearly right, the luminiferous aether was just false, and physicists act as though you can rank these things even while every theory in the pile is strictly speaking untrue. But I once interviewed a historian of science who flatly denied that successive theories get closer to anything at all — he said the change from one to the next just isn't that kind of thing, and he talked as though everyone in his field had settled this decades ago. So the way physics talks about itself looks like it quietly commits to something that at least some people who study science for a living think is incoherent.

  So please reconstruct the implicit picture: what does "teach the false one first, mark the anomalies by size, treat reducing to the old theory as a virtue" actually require? Does it strictly presuppose that theories are true-or-false descriptions of one fixed reality that we gradually approach, or could an anti-realist — someone who thinks theories are instruments, useful or not useful — run the very same practice just as comfortably? Where is the practice genuinely forcing one metaphysics over a rival, and where is it underdetermined, such that several pictures of what theories are would licence it equally well? And does the actual comparison (Newton nearer the mark than Descartes's vortices, say) do any real work, or is it decoration?

  Since a version of this might end up in print, don't give me a confident essay. Tell me where your reconstruction is most likely to go wrong, and what consideration or argument would genuinely change your mind about it — I'd rather print a hedged thing that survives an expert reading it crossly than a tidy thing that falls apart. And if philosophers do have a name for the "false but nearly right" idea I'd like to hear it, but don't just hand me the label and stop; I want to know whether it's survived the objections.
reasoning: |-
  Okay, this journalist is grappling with a tension they've observed in physics. The physicists they interview treat theories like Newtonian mechanics as "false but approximately correct," while dismissing other theories as outright wrong. But they also encountered a historian of science who rejects the idea that theories get successively closer to truth. The journalist wants to understand what view of truth underlies physics practice, whether it requires realism, and how robust this "nearly true" notion really is.

  Hmm, the core puzzle is how scientists can simultaneously hold three positions: (1) Current theories are incomplete/approximate, (2) Some past theories are "close" to current ones (like Newton to relativity), and (3) Other past theories are completely wrong (like aether). The historian seems to challenge position (2) entirely.

  Let me break this down. First, the practice itself: Physics education teaches simplified models first (Newton), then reveals limitations later. New theories must reduce to old ones in limiting cases (relativity → Newton at low speeds). Anomalies are sized—small ones expected, large ones revolutionary. This suggests a graded notion of accuracy.

  But what philosophical view enables this? Scientific realism would naturally support it—theories describe reality with increasing accuracy. But could instrumentalism work too? An instrumentalist might say Newton is useful in certain domains, relativity in broader ones. However, the "closeness" language seems to imply more than just utility—it suggests structural similarity to how reality works.

  Ah, the key might be in how theories relate to each other. When relativity "reduces to" Newton at low speeds, it's not just that both are useful in that regime—it's that relativity's equations mathematically transform into Newton's. This continuity suggests the old theory captured something real, just incompletely. Whereas discarded theories like aether don't have this mathematical continuity.

  But the historian's objection looms large. Kuhn and others argue that paradigm shifts change meanings—"mass" in Newton vs. relativity are incommensurable. If so, how can we say one is "closer" to truth? This is a serious challenge. Maybe the reduction isn't about truth but about mathematical correspondence in limiting cases, which survives meaning changes.

  I recall that some philosophers (like Popper with verisimilitude) tried to formalize "truthlikeness," but technical problems arose. Others (Kitcher, structural realists) focus on preserving successful components. Perhaps the physics practice relies on this: Newton got forces and motion mostly right, just not at high speeds; aether got nothing right.

  For the journalist's purpose, I should emphasize that this is philosophically contested. The practice doesn't strictly require realism—an instrumentalist could reframe "closeness" as domain-specific utility and continuity as pragmatic. But realism makes more direct sense of why reduction is a virtue and why some theories are dead ends.

  The strongest argument for realism here is the "no miracles" intuition: it'd be miraculous if false theories kept yielding accurate predictions unless they latched onto something real. But the historian might counter that "accuracy" is paradigm-dependent.

  Perhaps the fairest conclusion is that physics operates with a working notion of approximate truth that's internally consistent for their purposes, even if philosophers debate its foundations. The comparison between Newton and Descartes does real work—it explains why Newtonian mechanics was retained in engineering while vortex theories were abandoned entirely.

  I should also mention that terms like "verisimilitude" exist but are problematic. Structural realism might be the best modern defense of "nearly true." But I'll note all the caveats—meaning variance, underdetermination—so the journalist doesn't oversimplify.

  Most importantly, I'll structure this to show where my reconstruction could fail: if meaning incommensurability is fatal to continuity claims, or if the reduction requirement actually impedes progress (as Kuhn thought). The journalist wanted hedging, so I'll highlight those vulnerabilities.
answer: |-
  You've zeroed in on a profound tension at the heart of scientific practice and its interpretation. The physicists' operational stance—Newton "nearly right," aether "just wrong," anomalies sized by magnitude, reduction as a virtue—does imply a specific, albeit often implicit, metaphysics. But its coherence and philosophical grounding are contested. I'll reconstruct the implicit picture, flag where it's shakiest, identify philosophical labels (with caveats), and clarify where practice constrains metaphysics versus where it's flexible. Crucially, I'll note where my reconstruction is most vulnerable.

  ### 1. **The Implicit Picture in Physics Practice**
     - **"Distance from Truth" as Predictive Accuracy in Domains**: Physicists treat theories not as binary true/false, but as *models* with *domains of applicability*. Newtonian mechanics isn't "false" simpliciter; it's *highly accurate* for velocities ≪ *c* and scales ≫ quantum lengths. The "size" of an anomaly measures how severely a theory *fails within its expected domain*. A minor deviation (e.g., muon *g*-2) might be noise or new physics; a major one (e.g., pre-Maxwell electromagnetism failing to unify with mechanics) demands revolution.
     - **Reduction as Continuity**: A new theory (e.g., relativity) "reducing to" the old (Newton) in some limit (v/c → 0) isn't just pedagogical convenience. It signals *structural continuity*: the old theory captured *something objectively correct* about relationships (e.g., F = ma approximates relativistic dynamics at low v). Theories that don't reduce (e.g., Cartesian vortices vs. Newtonian gravity) lack this continuity—they didn't "get anything right" in a recoverable way.
     - **"Wrong" vs. "Incomplete"**: A theory is "just wrong" (like luminiferous aether) if its *core postulates* (e.g., a mechanical medium for light) are *fundamentally misguided*—no part survives in successor theories. It's "incomplete" (like Newtonian gravity or the Standard Model) if it *accurately describes phenomena within a domain* but fails elsewhere, and its mathematical core can be *embedded* or *generalized* in a broader framework.

  ### 2. **What This Practice Presupposes (and What It Doesn't)**
     - **Requires a "Fixed Reality" (But Not Naive Realism)**: The practice assumes there's a *mind-independent reality* whose behavior theories approximate. Without this, "convergence" and "reduction" make little sense. However, it does **not** require that theories are "literally true" descriptions of reality (naive realism). It *is* compatible with **structural realism**: the idea that science captures the *structure* of reality (mathematical relationships, symmetries) while possibly misdescribing its underlying nature.
     - **Requires "Approximate Truth" (But Not Perfect Access)**. The ranking of theories (Newton > Descartes) implies a notion of **verisimilitude** (truthlikeness)—a theory is "closer" if it makes more accurate predictions across broader domains and preserves more successful elements of predecessors. This doesn't require that we ever reach "final truth," only that progress is directional.
     - **Does *Not* Strictly Require Realism**: A sophisticated **instrumentalist** or **pragmatist** could mimic this practice by reframing "closer to truth" as "increasingly predictive/useful across expanding domains." They'd say reduction ensures continuity of *practice* (engineers still use Newton) and mathematical tools. However, they'd avoid claims like "Newton latched onto deep structures of reality." The *language* physicists use ("discovering," "converging") leans realist, but the *procedures* could be instrumentalistically reinterpreted—albeit awkwardly.
     - **Where Practice Forces Metaphysics**: 
       - **Reduction as a Virtue**: This strongly suggests structural continuity in reality. If theories were arbitrary tools, there'd be no reason to demand that Special Relativity reduces to Newton at low *v*—it could be a wholly disconnected formalism. The insistence on reduction points to an underlying structure being probed.
       - **Anomaly Sizing**: Treating small deviations as "business as usual" and large ones as "crisis" implies a background assumption that current theories are *approximately correct* and only need refinement—not that they're fundamentally flawed constructs. This assumes a stable reality where "small cause ≈ small effect" holds.

  ### 3. **The Challenges & Where My Reconstruction Could Fail**
     - **The Historian's Objection (Kuhnian Incommensurability)**: Thomas Kuhn argued that paradigm shifts (e.g., Newton → Einstein) change the *meaning* of terms (e.g., "mass," "space," "time"). If Newton's "mass" ≠ Einstein's "mass," how can we say one is "closer to truth"? This is the biggest threat. **My defense**: Physicists bypass this via *mathematical correspondence in limiting cases*. Even if "mass" means something different, the *equations* of relativity yield Newtonian predictions in the low-*v* limit. This suggests preservation of *structural relationships*, not necessarily concepts. **If Kuhn is right about radical meaning variance, the "nearly right" narrative collapses.** This could change my mind.
     - **Verisimilitude's Problems**: Philosophers (Popper, Miller, Tichý) showed formal definitions of "truthlikeness" are tricky—a theory can have more true consequences but also more false ones than a rival. Physicists avoid this by focusing on *empirical adequacy within domains* and *preservation of equations in limits*. They care less about "truth" than *predictive success and domain coverage*. **This might save the practice but weakens "truth" talk.**
     - **Underdetermination**: Infinitely many theories can fit existing data. Why think we're "converging"? Physicists use *explanatory coherence* and *unification* (e.g., the Standard Model explains diverse phenomena with few parameters). But if a rival framework explains anomalies without reducing to old theories, is it still "progress"? History suggests not—reduction is non-negotiable.

  ### 4. **Labels & Their Survival**
     - **Verisimilitude**: Popper's term for "truthlikeness." It faced technical objections (e.g., it's language-dependent) and is now seen as problematic. **Status**: Wounded, not dead. Refined versions (e.g., focusing on *accurate representation of structure*) persist in **structural realism**.
     - **Structural Realism (SR)**: Championed by Worrall, Ladyman. Argues science preserves *mathematical structure* (e.g., Maxwell's equations survived relativity/quantum shifts) while ditching "ontology" (e.g., aether). **This best explains reduction and "nearly right" talk**. It survives Kuhn by sidestepping meaning variance: structures, not concepts, are continuous. **Objections**: Can structure exist without ontology? Does SR explain *why* structures succeed? Still, it's the leading realist contender for your physicists' stance.
     - **Pessimistic Meta-Induction**: Laudan's argument: most past theories are false, so current ones likely are too. **Response from practice**: Past theories that were *structurally continuous* with successors (Newton, Maxwell) are "nearly right"; those that weren't (aether, phlogiston) are discarded. The practice *preselects* for theories with redeemable elements.

  ### 5. **Does "Distance from Truth" Do Real Work?**
     - **Yes, Pragmatically**: It guides research. Treating Newton as "approximately correct" justifies using it for spacecraft trajectories (saving resources) and focusing new physics on domains where it fails (e.g., black holes). Dismissing aether outright prevents dead-end research. Ranking theories by "closeness" helps allocate effort.
     - **Yes, Theoretically**: Reduction constrains viable new theories. Any quantum gravity candidate *must* reduce to General Relativity at large scales and quantum field theory in flat space—otherwise it violates established empirical success. This isn't mere decoration; it's a filter for plausibility.
     - **But...** It might be a *post-hoc* narrative. We label past theories "nearly right" only *after* successors embed them. Was Newton "closer than Descartes" *at the time*? Arguably, yes—Newton made vastly more accurate predictions. But the *meaning* of "close" is retrofitted with modern knowledge.

  ### In Summary
  - **Core Commitment**: Physics practice assumes a stable reality whose structure is progressively captured by theories exhibiting *mathematical and empirical continuity*. Structural realism best captures this.
  - **Underdetermined**: Instrumentalism *could* replicate the practice by swapping "truth" for "utility," but it strains to explain reduction and convergence naturally.
  - **Most Vulnerable Points**: 
    1. **Kuhnian incommensurability**: If meaning change is radical, continuity claims unravel. 
    2. **Lack of formal verisimilitude**: The "nearly right" intuition resists precise definition.
    3. **Pessimistic Induction**: The track record of discarded theories *might* undermine optimism, but physicists counter that structurally continuous theories form a privileged subset.
  - **What Would Change My Mind**: A convincing case showing that (a) reduction is merely sociological (not reflecting reality), or (b) a theory without reductionist links to predecessors achieved equal/better empirical success. Neither has happened yet.

  For your article: Emphasize that physicists' "nearly right" is a robust *working philosophy* grounded in mathematical continuity and domain-specific accuracy, but its translation into "truth" is philosophically fraught. Structural realism offers the most defensible bridge, but the historian's challenge (from meaning variance) remains a live wire. The practice survives not because philosophers resolved it, but because it *works* for guiding research—even if its metaphysical foundations are debated.
