prompt: |-
  I have just taken a seat on the ethics committee of a hospital trust, and one of our standing jobs is to maintain the guidance notes that clinicians are supposed to consult when a case gets difficult — end-of-life decisions, disagreements with families, allocation of scarce theatre time. Almost immediately the committee split in a way I have since recognised as a rerun of the particularism/generalism war in academic ethics. One faction wants the guidance to state principles, with exceptions written in wherever experience has shown the principles to misfire. Another faction, led by a quietly formidable old physician, holds that this whole approach is misconceived: any code of principles will need exceptions, and eventually the exceptions will be recognised as the wrong ones in new cases, and the only real skill is judgement in the particulars — trained experience, not rule application. When I went looking in the literature to settle this for our committee, I found the same stall: Dancy and McDowell on the particularist side, Hooker and the Rossian moderates on the generalist side, decades of papers, and as far as I can tell nobody has been moved an inch since the 1990s.

  I do not want you to adjudicate for my committee. I want a diagnosis of the philosophical dispute itself, because I suspect the shape of the disagreement determines what our guidance documents can sensibly aspire to.

  You are to write as a senior moral philosopher with expertise in metaethics and normative theory, and I would like you to think carefully and structure your answer. Begin with a brief brainstorm of possible diagnoses before committing to any — sketch at least four candidate structures for the disagreement and then argue for the best one. The candidates I have in mind, though you should feel free to add or reject them, are these:

  1. A verbal dispute about the word "principle": particularists deny only invariant, exceptionless principles, while the generalists who matter (the Rossians, the rule consequentialists) never claimed their principles were exceptionless, so the two camps may be talking past one another — one refuting a thesis the other side never held.
  2. A substantive dispute about the nature of reasons: Dancy's holism of reasons — the claim that a feature that counts in favour of an action in one case may count against it, or make no difference, in another — against the atomist picture in which each feature carries a fixed valence. If holism is true, principled moral reasoning of the codifying sort may be impossible in principle, which would matter for us.
  3. A hidden disagreement about moral epistemology rather than moral ontology: perhaps the two camps agree about how actions are justified but disagree about how finite, fallible agents — especially novices, or a committee drafting guidance for strangers — ought to deliberate, in which case the debate is about the psychology and training of moral agents, not the structure of morality itself.
  4. A difference in bedrock intuitions that neither side can argue for without circularity — something like whether moral thought is more like perception (seeing what matters in this case) or more like subsumption under a rule — with each camp's arguments presupposing its own starting picture.

  There is also a fifth possibility I find intriguing and would like your view on: that the dispute is partly formal, and could in principle be sharpened or even dissolved by work on non-monotonic and default logics — formal systems in which a rule licenses a conclusion only ceteris paribus, with exceptions that need not themselves be capturable by further rules. If the generalist's "principles with principled exceptions" can be given a coherent formal semantics, does the particularist's claim that morality is not codifiable become precise enough to be true or false? Or does the formal machinery merely relocate the disagreement into a dispute about whether the exception structure has a moral shape or an open-ended, case-driven one?

  Finally, tell me honestly what would count as progress, given your diagnosis — a distinction, a class of cases, a formal result, findings from moral psychology about how experienced clinicians actually reason — and, if your diagnosis implies that no progress should be expected, say so plainly and explain why, rather than offering a diplomatic synthesis. And do relate the diagnosis back to my practical situation: I would like to know whether the guidance documents my committee drafts should be written as attempted codifications, as training tools whose principles are honestly presented as defeasible, or as something the particularist could sign without crossing the street.
reasoning: |-
  Hmm, this is a fascinating and deeply practical ethical dilemma. The user sits on a hospital ethics committee grappling with the classic particularist/generalist divide in drafting clinical guidance. They're clearly philosophically sophisticated - citing Dancy, McDowell, Hooker, and Ross - but pragmatically focused on what kind of document will actually help clinicians. 

  The core tension they describe feels very real: the principled faction wants safety nets of rules, while the particularist physician champions clinical judgment. What's striking is how the user frames this - they're not asking me to solve the committee's dispute, but to diagnose why the underlying philosophical debate remains intractable after decades. That's a refreshingly meta request.

  Looking at their proposed diagnostic frameworks: the verbal dispute angle (1) has merit but feels too convenient - Dancy certainly attacks Rossian prima facie duties as still overly rigid. The reasons holism debate (2) seems more fundamental - if moral reasons are truly context-dependent, codification might be impossible. The epistemological reading (3) is appealing for its practicality - maybe both sides agree on what's right but disagree on how to teach it. And the bedrock intuition split (4) resonates with how entrenched these positions feel.

  But their fifth point about non-monotonic logic is particularly intriguing. As someone who's worked on default reasoning, I see potential here: we could model "do not lie" as a default rule with undercutters (e.g., unless protecting life). The question is whether such systems merely create Russian nesting dolls of rules or genuinely capture particularist judgment. I recall Sunstein's work on heuristics - perhaps guidance as "incompletely theorized agreements" could bridge both worlds.

  For the hospital context, three implications stand out: First, no guidance can replace judgment - even the best rules need interpretation. Second, we should distinguish between rules for novices (who need structure) and experts (who see particulars). Third, the documents should probably be framed as "default positions" with explicit discussion of recurring exceptions, while training clinicians in perceiving morally salient features. 

  The progress question is thorny. This isn't like proving a mathematical theorem - moral philosophy moves through conceptual refinement and new paradigms. But in their committee's practical terms, progress might mean documenting recurring "defeaters" while training perceptual skills through case studies. The particularist physician might accept guidance that presents principles as starting points rather than algorithmic solutions.

  What this user needs most is permission to avoid false binaries. Their documents can be both principled and particularist if framed as: "Here are our default commitments; here's when they typically bend; but ultimately you must see this patient's situation." That honesty about the limits of codification might be the most ethical approach of all.
answer: |-
  ## Diagnosis of the Particularism/Generalism Dispute: Structure, Stalemate, and Practical Implications

  As a philosopher who has wrestled with this divide for decades, I share your frustration with its resilience. The impasse isn't accidental; it taps into deep structures of moral thought. Let me dissect the possible diagnoses you've outlined, evaluate them, and then offer my considered view on the core disagreement, its implications for progress, and what this means for your committee's task.

  ### Candidate Diagnoses: Brainstorm & Evaluation

  1.  **Verbal Dispute about "Principle":**
      *   **Sketch:** Particularists define "principle" as strict, invariant, exceptionless rules (like Kantian maxims). Generalists (Rossians, Rule-Consequentialists) define principles as *prima facie* duties or defeasible rules. Particularists attack the former; generalists defend the latter, leading to cross-talk. Ross's "duty of fidelity" *is* meant to be overridden by stronger duties.
      *   **Strength:** Captures a genuine source of initial confusion and wasted effort. Early debates often suffered from this.
      *   **Weakness:** Sophisticated particularists (Dancy) explicitly target Rossian *prima facie* duties. They argue that the *valence* and *weight* of a feature (like promise-keeping) are *radically* context-dependent, not merely overridden in predictable ways by other *prima facie* duties. They reject the very idea that the moral landscape is carved into stable, generalizable "duty-types" with predictable interaction rules. This goes beyond mere defeasibility.

  2.  **Substantive Dispute about the Nature of Reasons (Holism vs. Atomism):**
      *   **Sketch:** This is Dancy's core contention. Holism: The moral relevance (valence, weight) of any feature (e.g., causing pain, telling a truth) is entirely dependent on the entire context. A feature can be a reason *for*, *against*, or *neutral* in different situations. Atomism: Features carry an invariant default valence (e.g., pain is always *pro tanto* bad; truth-telling always *pro tanto* good), though their *overall* effect can be overridden.
      *   **Strength:** Targets the metaphysical/epistemological heart of the debate. If holism is true, stable, codifiable principles (beyond trivial tautologies) are impossible. This is the most fundamental challenge.
      *   **Weakness:** Generalists argue holism is overstated or misdescribed. They claim atomism can accommodate context-sensitivity through complex interaction rules for *prima facie* duties and recognition of defeaters. They see holism leading to an unacceptable form of moral particularism where *no* general guidance is possible.

  3.  **Hidden Disagreement about Moral Epistemology:**
      *   **Sketch:** Both sides agree morally right actions exist. The dispute is about *how we know them*. Particularists: Moral knowledge is fundamentally perceptual/case-based (McDowell's "perceptual capacity"). Rules are post-hoc summaries or training wheels for the novice. Generalists: Moral knowledge requires subsumption under general rules/principles; perception is unreliable without a principled framework. Guidance documents are essential epistemic tools, especially for non-experts or under pressure.
      *   **Strength:** Highly relevant to your practical task! It explains why the debate persists despite shared goals – they disagree profoundly on *how* moral agents (especially non-sages) reliably reach good judgments. It shifts focus from "what is morality?" to "how do we best *access* it in practice?"
      *   **Weakness:** While crucial, it doesn't fully escape the ontological debate. The epistemological stance often presupposes a view about the underlying structure. If morality *is* fundamentally holistic (ontology), then a rule-application epistemology *will* misfire. If it *is* structured by stable *prima facie* reasons (ontology), then a purely perceptual epistemology risks arbitrariness.

  4.  **Bedrock Intuitions / Foundational Pictures:**
      *   **Sketch:** The disagreement rests on incompatible basic metaphors or paradigms. Particularists see morality as akin to *perception*: discerning the unique "shape" of the moral demand in *this* situation (like seeing the unique aesthetic qualities of *this* painting). Generalists see it as akin to *law* or *logic*: applying general norms derived from reason or consequences to specific instances. Arguments become circular because each side's "data" (intuitions about cases) is interpreted through their foundational lens.
      *   **Strength:** Explains the deep intractability and feeling of talking past each other. Appeals to cases often fail because each side describes/perceives the salient features differently based on their paradigm. It highlights the non-rational, quasi-aesthetic element in foundational moral commitment.
      *   **Weakness:** Risks making the dispute irrational or merely aesthetic. It underplays the sophisticated arguments made within each paradigm to address counterexamples and internal coherence.

  ### The Core Diagnosis: A Tangle of Levels

  **The dispute is fundamentally irreducible to a single level. It is a complex entanglement of Ontology (Holism vs. Atomism/Stable *Prima Facie* Reasons), Epistemology (Perception vs. Rule-Subsumption), and Psychology/Practice (How agents *actually* reason best, especially under constraints).** These levels are mutually reinforcing within each camp and mutually undermining across the divide.

  1.  **The Ontological Core:** Dancy's holism of reasons is the radical engine driving strong particularism. If a feature's moral valence is *radically* context-dependent, then capturing it in stable principles (even defeasible ones with interaction rules) becomes deeply problematic. The generalist commitment to stable *prima facie* reasons/duties is the ontological anchor for codifiability.
  2.  **The Epistemological Manifestation:** The ontological commitments shape the preferred epistemology. Holism naturally suggests a perceptual model (seeing the holistic reason in the case). Atomism/stability naturally suggests a rule-based model (applying the known valences).
  3.  **The Practical/Psychological Imperative:** This is where the debate gains its heat and persistence. Generalists fear the "moral vertigo" of particularism – the lack of public standards, the risk of bias and arbitrariness, the impossibility of guidance for learners or committees. Particularists fear the "moral blindness" of generalism – the misapplication of rules to complex cases, the stifling of sensitivity, the false comfort of codification. *This practical anxiety fuels the defense of the respective ontological/epistemological positions.* Your committee's split perfectly mirrors this practical anxiety.

  **Why the Stalemate?** Progress requires movement on one level to force reconsideration on others. But:
  *   Holism is hard to refute definitively – counterexamples can often be explained by adding context.
  *   Stable *prima facie* reasons are resilient – apparent holism can often be redescribed as complex defeasibility.
  *   Epistemological arguments (perception vs. rules) depend on contested views of psychology and expertise.
  *   Practical anxieties are rooted in deep concerns about fallibility and societal need, resistant to purely theoretical argument.

  ### The Fifth Element: Non-Monotonic Logic – Hope or Relocation?

  Non-monotonic logics (default logic, defeasible deontic logic) offer a powerful formal framework for modeling *prima facie* duties with exceptions. They provide semantics for "ceteris paribus" rules and defeaters.

  *   **Potential Sharpening:** It forces precision. It shows that "principles with exceptions" *can* be formally coherent. This counters the particularist claim that generalism *must* collapse into crude, exceptionless rules. It makes the generalist position formally respectable.
  *   **The Relocation:** However, it **does not resolve the core dispute**; it **relocates** it:
      *   **To the Structure of Defeaters:** Particularists argue that defeaters cannot be exhaustively listed or captured by *further general rules* ("defeater-defeaters"). The space of morally relevant context is open-ended. Non-monotonic systems often rely on *prioritized* rules or *specific exception clauses*. Particularists see this as either an infinite regress or an artificial closure of the open-ended context. Is the exception structure rule-governed (generalist) or inherently particularistic?
      *   **To the Nature of the Default:** Is the "default" valence (e.g., "truth-telling is *pro tanto* good") a robust, stable feature of moral reality (atomism), or merely a useful heuristic based on statistical frequency within a culture, lacking deep ontological grounding (holism)?
  *   **Verdict:** Formalization clarifies the *logic* of defeasible reasoning but doesn't settle the *metaphysical* or *epistemological* questions about the *source* and *scope* of defeasibility. It makes the generalist picture *formally tractable* but doesn't prove it *morally correct* against the particularist challenge of radical context-dependence.

  ### What Counts as Progress? (Given the Diagnosis)

  Given the entanglement and the practical origins of the anxieties, expect **no decisive philosophical victory**. Progress will be:

  1.  **Conceptual Refinement:** Sharper distinctions (e.g., between *radical* holism vs. *moderate* context-sensitivity; between *training heuristics* vs. *ontological commitments*; between *codification for public justification* vs. *codification for decision-making*).
  2.  **Case-Driven Nuance:** Identifying specific *classes* of cases where one approach demonstrably fails or succeeds *in practice* (e.g., does rule-based guidance reduce errors in novice clinicians but hinder experts? Are there specific types of end-of-life conflicts where principle-checklists reliably misfire?).
  3.  **Moral Psychology & Expertise Studies:** Empirical research on how *expert clinicians actually reason* in complex ethical dilemmas. Do they consciously apply rules? Subconsciously match patterns? Engage in holistic perception? How does this differ from novices? This directly addresses the epistemological/practical level of the debate. (e.g., Patricia Benner's nursing expertise studies suggest experts move beyond rule application to holistic situational understanding).
  4.  **Pragmatic Hybrid Frameworks:** Developing guidance structures that *acknowledge* the tension explicitly. Principles presented *as* heuristics or default starting points, *with* built-in mechanisms for recognizing their limits and fostering judgment (see below). Progress is recognizing the *complementarity* of both stances in practice, even if their philosophical foundations remain in tension.

  **Honest Implication:** The stalemate suggests that morality likely involves *both* stable general features *and* irreducible contextual sensitivity. Insisting on purity (only rules, only perception) is probably a mistake. The challenge is navigating this hybrid reality.

  ### Implications for Your Guidance Documents

  Given the diagnosis and the unlikelihood of resolving the core philosophical dispute, your guidance documents **cannot and should not be pure codifications claiming algorithmic completeness.** Nor should they abdicate all structure. Aim for a **pragmatic, hybrid approach the particularist physician could *tolerate* (if not enthusiastically endorse) and the generalist could *use**:*

  1.  **Frame Principles as Defeasible Defaults:** Explicitly state principles not as inviolable laws, but as strong starting points, presumptions, or default positions. Use language like "generally," "presumptively," "in the absence of countervailing factors," "as a starting point for deliberation."
  2.  **Illustrate, Don't Just List Exceptions:** Instead of exhaustive lists (impossible), provide *paradigm examples* of recurring situations where the default might be overridden. Use brief, anonymized case vignettes. This shows *how* judgment works in context.
  3.  **Emphasize Process over Algorithm:** Structure the document around *questions to consider* and *processes for deliberation* (e.g., "Have you fully explored the patient's values and goals?", "Have you identified *all* relevant stakeholders and their perspectives?", "What are the potential harms/benefits of adhering strictly to X principle *here*?", "Is there a conflict between principles? How are you weighing them *in this specific context*?") rather than a flowchart to "the answer."
  4.  **Acknowledge the Role of Judgment:** Include a section explicitly stating that these are guides, not substitutes for experienced, context-sensitive judgment. Quote your formidable physician: "The only real skill is judgement in the particulars." Frame the guidance as a *scaffold* for reasoning, not the reasoning itself.
  5.  **Incorporate Reflective Practice:** Suggest mechanisms for clinicians to document *why* they deviated from a default principle in a specific case (not for punishment, but for reflective learning and pattern recognition over time). This builds institutional "trained experience."
  6.  **Target the Audience:** Consider if different guidance is needed for novices (who may need clearer, simpler defaults initially) versus experienced clinicians (who may benefit more from complex case discussions and process guidance).

  **Conclusion:** The particularist/generalist war persists because it reflects a deep and likely irresolvable tension within morality itself and our access to it. Your committee's split is a microcosm of this. Don't seek philosophical resolution for your documents. Instead, craft them as **tools for responsible deliberation**, consciously built on defeasible defaults, illustrated with context, focused on process, and openly acknowledging the indispensable, uncodifiable role of experienced judgment. This is the guidance the particularist can sign *as an honest recognition of reality*, and the generalist can use *as a structured aid to perception*. It bridges the practical divide by accepting the philosophical one.
