prompt: |-
  I've just joined the investment committee of a mid-sized private foundation whose charter requires it to operate in perpetuity, and I'm trying to understand what our governing rule actually commits us to philosophically. The practice, concretely: each year we distribute about 4.5% of a three-year trailing average of the portfolio's market value, smoothed precisely so that grantees receive a stable, inflation-adjusted stream and the corpus is preserved in real terms forever. The investment office behind that rule allocates roughly 60% of the portfolio to risky assets, rebalances annually, and is evaluated almost entirely on Sharpe ratios and drawdown behavior; borrowing is effectively prohibited, and a year in which the portfolio falls more than about 20% triggers serious board consternation even when long-run expected returns are unchanged. One of my colleagues, who has been reading about the Kelly criterion, insists the whole apparatus is just fractional Kelly betting dressed up in committee language — that a perpetual owner with no heirs should size bets to maximize the geometric growth rate of the corpus, that our 60% allocation is simply Kelly with a fudge factor set by collective loss aversion, and that the spending rule is the institutional embodiment of log utility. Another colleague finds this recklessly quantitative and says our real commitment is a moral one: no generation of grantees may consume resources that impair any later generation's capacity to do the same work.

  What strikes me is that these two rationales seem to pull in different directions, and I can't tell whether our practice is coherent under either. The spending rule treats the future as nearly deterministic — it calibrates the payout to an assumed long-run real return of about 5% and behaves as though the corpus must never decline in expectation — while the portfolio it draws from is aggressively risky and its evaluation is path-sensitive in a way pure expected-return maximization wouldn't be: given two portfolios with identical arithmetic expected returns but different volatility, we reliably prefer the smoother one, and over an infinite horizon that preference looks exactly like preferring the higher geometric mean. So here is my question: what theory of rationality, or of intergenerational obligation, does this practice presuppose? Is it, as my colleague claims, effectively log-utility maximization across generations with the spending rate as the consumption policy that maximizes long-run geometric growth? Or a quasi-Rawlsian constraint that the worst-off future generation must be no worse endowed than the present one? Or is it just institutionalized loss aversion that happens to mimic one of these? I'd like you to reconstruct the implicit theory as precisely as you can, then tell me where the practice is underdetermined — which genuinely different views of what the endowment is for would license the very same spending rule and allocation policy — and whether the spending rule and the asset-allocation policy are even consistent with each other in what they presuppose, since one seems to assume stability and the other embraces variance. Finally, tell me concretely what would have to change in the rule if the presupposed view were replaced by one of two rivals: a spend-down view on which the foundation should deliberately exhaust itself over a fixed horizon, or a discounted-utilitarian view on which the expected present value of all future grants is maximized with a modest exponential discount rate. Please lead with your bottom-line diagnosis in the first sentence, then give the reasoning, and be explicit about which parts of the practice are strictly entailed by the view you attribute to it and which merely sit comfortably alongside it.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're on the investment committee of a private foundation that operates in perpetuity. The foundation uses a spending rule of 4.5% based on a three-year trailing average of the portfolio value. The portfolio is allocated 60% to risky assets, rebalanced annually, and evaluated on Sharpe ratios and drawdowns. The user is trying to understand the philosophical underpinnings of these rules.

  First, I need to address the two perspectives mentioned: the Kelly criterion approach and the moral obligation view. The Kelly criterion suggests maximizing geometric growth, which ties into log utility. The moral argument is about intergenerational equity, not impairing future generations. The user feels these might conflict, but I think they actually align under a specific framework.

  The spending rule assumes a deterministic long-term return of 5%, but the portfolio is volatile. This seems contradictory. However, using a trailing average smooths payouts, which protects against short-term volatility. The 60% risky allocation might be a fractional Kelly strategy, balancing growth and risk aversion. 

  The evaluation metrics like Sharpe ratios and drawdown concerns indicate a preference for lower volatility. This aligns with maximizing geometric mean returns over time, which is crucial for perpetual portfolios. So the implicit theory here is geometric mean maximization with a spending rate that doesn't exceed the expected geometric return.

  Next, consistency between spending and allocation. The 4.5% payout is below the expected arithmetic mean but might be close to the geometric mean after volatility drag. If the expected arithmetic return is around 7%, with 12% volatility, the geometric mean would be about 5.5%. Spending 4.5% preserves capital in real terms. The smoothing mechanism helps maintain stable payouts without selling low during downturns.

  Underdetermination: The same rules could fit a Rawlsian view where the worst-off generation is protected, or a long-term growth focus. Both justify capital preservation and risk control. However, loss aversion in the board's reactions might stem from behavioral biases rather than a coherent philosophy.

  For rival views: A spend-down approach would increase spending rates and possibly reduce risk as the horizon shortens. Discounted utilitarianism would use discount rates, possibly leading to higher initial spending but risking future capital. Both alternatives contradict the current perpetual setup.

  The user's deeper need is to ensure the foundation's policies are philosophically coherent and operationally consistent. They might also want to communicate this to the committee, reconciling differing opinions. Highlighting how current practices align with geometric growth and intergenerational equity can bridge the Kelly and moral arguments. Pointing out where behavioral elements like drawdown aversion fit in helps clarify potential inconsistencies without undermining the overall framework.
answer: |-
  ### Bottom-line diagnosis
  Your foundation's practice implicitly assumes **a perpetuity-focused objective of maximizing the long-run geometric growth rate of the endowment's real value**, constrained by a **loss-aversion-adjusted spending rule** that stabilizes payouts and ensures intergenerational equity—effectively implementing fractional Kelly optimization under log utility, but with behavioral adjustments for path-dependence and institutional risk tolerance.

  ---

  ### Reconstructing the Implicit Theory
  1. **Core Philosophical Commitment**:  
     - **Geometric Mean Maximization**: The portfolio construction (60% risky assets, rebalancing, Sharpe/drawdown focus) aims to maximize the portfolio's *geometric growth rate* over infinite horizons—consistent with Kelly criterion logic.  
     - **Intergenerational Fairness**: The spending rule (4.5% of smoothed value, inflation-adjusted) enforces a Rawlsian-like constraint: no generation of grantees may impair future generations' capabilities. This is achieved by:  
       - Spending only the *expected geometric return* (not arithmetic), preserving real corpus.  
       - Smoothing payouts via a 3-year average to avoid volatility-induced grant disruptions.  

  2. **Behavioral Adjustments**:  
     - **Fractional Kelly**: The 60% allocation is likely a de-risked version of a full-Kelly portfolio (which might be >80% equities), reflecting institutional loss aversion.  
     - **Path-Dependent Risk Control**: Drawdown limits (<20%) and Sharpe ratio targets are Bayesian updates to Kelly’s assumptions, acknowledging that severe losses could jeopardize the foundation’s mission or trigger behavioral errors.  

  3. **Consistency of Spending and Allocation**:  
     - **Spending Rule** assumes long-term stability (5% real return) but **allocation embraces variance** because:  
       - The *smoothing mechanism* decouples payouts from short-term volatility.  
       - The 4.5% payout rate is calibrated *below* the expected arithmetic mean return (~7-8%) but near the *geometric mean* after volatility drag (~4.5-5.5%).  
     - **This is coherent**: Volatility is tolerated in the portfolio *because* smoothing insulates grantees, while the allocation ensures the corpus grows geometrically to support perpetual payouts.  

  ---

  ### Where the Practice is Underdetermined
  The same spending/allocation rules could arise from:  
  - **Rawlsian Maximin**: Prioritizing the worst-off generation (e.g., future grantees during a depression) justifies both low spending and low drawdowns.  
  - **Log-Utility Maximization**: Maximizing the expected log of future grants yields identical portfolio math but lacks Rawls’ ethical framing.  
  - **Behavioral Loss Aversion**: The rules could simply be institutionalizing a fear of losses, with "geometric growth" as post-hoc justification.  

  **Key divergence**: Rawlsianism is *ethically* prescriptive ("we must not harm the future"), while Kelly/log-utility is *instrumentally* rational ("this maximizes long-run grants"). Your practice blends both.  

  ---

  ### Rival Views: Required Changes  
  1. **Spend-Down (Fixed Horizon, e.g., 50 Years)**:  
     - **Allocation**: Shift from 60% risky assets to liability-driven investing (LDI). As horizon shortens, increase bonds/inflation hedges.  
     - **Spending Rule**: Raise payout rate (e.g., 6-8%), abandon smoothing, and allow real corpus decline.  
     - **Risk Metrics**: Drop Sharpe/drawdown focus; prioritize matching grant liabilities year-by-year.  

  2. **Discounted Utilitarianism (e.g., 2% Discount Rate)**:  
     - **Spending Rule**: Front-load grants (e.g., initial 6-7% payout), reducing future real payouts. Smoothing would be weakened or eliminated.  
     - **Allocation**: Higher risk tolerance initially (70-80% equities) to boost near-term expected value, shifting conservative later.  
     - **Evaluation**: Focus on expected NPV of grants, not corpus preservation or volatility.  

  ---

  ### Diagnostic Summary  
  | **Element**            | **Entailed by Geometric Growth** | **Compatible but Not Entailed** |  
  |-------------------------|----------------------------------|---------------------------------|  
  | 60% Risky Allocation    | ✓ (Fractional Kelly)            | ✗                               |  
  | 4.5% Payout + Smoothing | ✓ (Spending ≤ Geometric Return) | ✗                               |  
  | Rebalancing             | ✓                               | ✗                               |  
  | Drawdown Limits (<20%)  | ✗                               | ✓ (Behavioral Adjustment)       |  
  | Sharpe Ratio Focus      | ✗                               | ✓ (Proxy for Geometric Growth) |  

  **Inconsistencies**:  
  - **Drawdown aversion** contradicts pure geometric growth (Kelly accepts large drawdowns if EV-positive). This is where behavioral loss aversion intrudes.  
  - **Smoothing assumes predictability** the risky portfolio denies, but the mechanism bridges this gap by absorbing volatility internally.  

  **Recommendation**: Your practice is philosophically coherent *if* framed as **geometric growth optimization with intergenerational fairness constraints**. To align fully:  
  1. Explicitly set the spending rate at/below the *ex ante* geometric mean return (validate 4.5% against current capital market assumptions).  
  2. Replace drawdown triggers with a tolerance defined by long-term EV (e.g., allow larger drawdowns if Sharpe improves).  
  3. Acknowledge smoothing as a tool for grantee stability—not corpus protection (the portfolio handles the latter).  

  This clarifies that the foundation is neither purely utilitarian nor Rawlsian, but a *perpetual growth engine* with insurance against path-dependent ruin.
