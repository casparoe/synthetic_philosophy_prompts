prompt: |-
  I'm on the steering committee of a research institute that has committed funding for five visiting fellows and a series of workshops over the next two years, all of it earmarked for conceptual work on the epistemic quality of collective decision-making — formal theory and philosophy, not empirical political science. The anchor point for the program is the Condorcet jury theorem and its neighborhood: the result that if voters independently judge better than chance between two alternatives, majority rule becomes almost certainly correct as the electorate grows, along with its better-known descendants (heterogeneous competence, correlated votes, qualified majorities, weighted voting).

  I've sketched five candidate questions the program could concentrate on. What I want from you is not a survey of them but a defended agenda: which deserve the fellowships, in what order, and why.

  1. Endogenous competence. The theorem takes each voter's competence as a fixed input, but in practice competence is partly produced by the very institutions being evaluated — deliberative processes, party primaries, the media environment, arguably even the existence of majority rule itself, which changes what it pays to learn. Is there a principled framework in which competence is endogenous, and if competence and the aggregation rule co-determine each other, does the theorem lose its normative force, gain it, or just change shape?

  2. Correlated error. Everyone grants that independence fails in the wild — voters share media, priors, and informational ancestors. Which replacements for the independence assumption are tractable, and does any of them preserve a readable version of the "larger groups do better" conclusion, or does it flip sign?

  3. Domain transfer. Whether the same aggregation logic does any work in institutional designs outside electoral politics: citizens' assemblies selected by lot, expert panels, forecast aggregation, even majority voting among the outputs of different models. What exactly breaks when the voters are unequal in standing, competence, or independence from one another?

  4. Threshold rules across issue types. When one electorate votes on many issues on which its competence differs, does the theorem's machinery say anything about which issues should face simple majorities, which supermajorities, and which shouldn't be put to a vote at all?

  5. The "so what" question. Whether the theorem's role in democratic theory is evidential or merely illustrative — whether actual practice depends on the premises being approximately true, or whether it should be understood as an idealization on the model of frictionless planes in mechanics: false, but indispensable for seeing what the real forces are.

  For each question, tell me whether it sits upstream of the others, whether it's tractable with the tools of philosophers and formal theorists rather than requiring empirical social science, and what developments over the next couple of years — new formal results, better data on how errors correlate, institutional experiments — would move it up or down your ranking. If you think a question I haven't listed is more important than all five, say so, but justify it against the same criteria rather than by novelty alone.

  Finally, a request about the epistemics of your answer: state how confident you are in each part of the ranking, and single out the one judgment in your reply that you are least sure of — I'd rather know where the ranking is load-bearing guesswork than receive it as settled.
reasoning: |-
  Okay, the user is on a steering committee for a research institute focusing on the epistemic quality of collective decision-making. They've outlined five candidate questions for their program and want a defended agenda prioritizing them. Let me start by understanding each question thoroughly.

  First, Endogenous Competence: This is about how institutions affect voter competence. It challenges the fixed competence assumption in the Condorcet theorem. The user is likely concerned about the real-world applicability if competence isn't static. They might be looking for frameworks where competence and rules co-evolve.

  Next, Correlated Error: Independence of voter errors is a known weak point. The user probably wants to know if there are tractable models that handle correlation while preserving the theorem's benefits. They might need solutions that don't require empirical data but still offer theoretical insights.

  Domain Transfer: Applying collective decision-making to non-electoral contexts like expert panels. The user might be interested in how varying competences and dependencies affect outcomes. This could expand the theorem's relevance beyond traditional voting.

  Threshold Rules: Adjusting majority thresholds based on issue types. The committee might be looking for guidelines on institutional design—when to use supermajorities or exclude certain issues. This has direct policy implications.

  The "So What" Question: This questions the theorem's practical relevance. The user might be grappling with whether it's a useful idealization or if real systems depend on its premises. They need clarity on its normative role in democratic theory.

  Now, prioritizing. Endogenous Competence seems foundational. If competence isn't fixed, it affects all other areas. Tackling this first could reshape the entire framework. Plus, it's tractable with formal methods, which aligns with their non-empirical focus.

  Correlated Error comes next because it's a critical flaw in the theorem's assumptions. Recent work on correlation structures and Bayesian networks offers paths forward. Solving this could make other questions more robust.

  Domain Transfer is third. It builds on the first two by applying insights to diverse settings. While it depends on prior answers, it's crucial for broadening applicability. Philosophical tools can handle this without empirical data.

  Threshold Rules is fourth. It's more applied and relies on understanding competence and correlation. The formal work here is emerging but needs foundations from earlier questions. It's important for institutional design but not as foundational.

  The "So What" question is last. While philosophically deep, it's meta-theoretical. Addressing it becomes more meaningful after progress on the others. It's tractable via formal epistemology but less urgent.

  Confidence-wise, Endogenous Competence as top priority feels solid. But placing Correlated Error second over Domain Transfer is a tougher call. Recent work on correlation might make it more feasible than Domain Transfer, which needs more groundwork. That's where my confidence wavers a bit. The user's emphasis on tractability and existing tools makes Correlated Error a better bet for near-term results.

  Also, the user might have unspoken needs. They want the program to produce impactful, publishable research within two years. Prioritizing tractable questions ensures tangible outcomes. They might also seek to establish their institute as a leader in formal theory, so foundational work could enhance their reputation. Avoiding empirical angles aligns with their resources and expertise. 

  Need to ensure each priority is justified in terms of upstream influence, tool compatibility, and potential developments. Highlighting how new results in one area could influence others strengthens the ranking. For example, progress in endogenous models directly aids threshold rules. 

  Lastly, the "so what" question, while important, might be premature. Engaging with it after concrete advances in the first three areas would provide more substance. The user likely wants practical insights for institutional design, making applied questions like threshold rules relevant but dependent on prior theoretical work.
answer: |-
  Here is a defensible agenda prioritizing your five questions, grounded in their foundational significance, tractability for formal/philosophical methods, and potential for conceptual breakthroughs. I assess each against three criteria: **Upstream Influence** (does it enable progress on others?), **Tractability** (can it be advanced with non-empirical tools?), and **Leverage** (will near-term developments catalyze progress?). Confidence assessments follow the ranking.

  ---

  ### **Ranking & Justification**
  1.  **#1: Endogenous Competence**  
      **Why Top Priority?**  
      - **Upstream Influence:** Utterly foundational. If competence is shaped by institutions/rules (e.g., deliberation incentives, voting systems), it undermines *all* CJT-derived results. Addressing this reorients the entire field.  
      - **Tractability:** Highly amenable to formal theory (game theory, Bayesian learning models) and philosophical analysis (normative feedback loops). No empirical data *required* for core models.  
      - **Leverage:** Recent work in epistemic game theory (e.g., strategic voting with endogenous info acquisition) provides tools. New results here could reshape #2–#4.  
      **Risk if Ignored:** CJT risks becoming a detached curiosity if competence isn’t responsive to institutional design.  

  2.  **#2: Correlated Error**  
      **Why Second?**  
      - **Upstream Influence:** Critical for real-world applicability. Correlation invalidates independence—the CJT’s most fragile assumption—affecting all aggregative claims.  
      - **Tractability:** Formal theorists can model correlation structures (e.g., network-based, common cause). Philosophical work can clarify "tolerable" vs. "fatal" correlation.  
      - **Leverage:** Emerging math on dependence (e.g., copulas, graph-theoretic error propagation) makes this ripe. Progress here informs #3 (domain transfer) and #4 (thresholds).  
      **Caveat:** Must avoid becoming *only* a technical exercise—tie to normative implications.  

  3.  **#3: Domain Transfer**  
      **Why Third?**  
      - **Upstream Influence:** Tests the robustness of CJT logic. Success/failure here reveals whether epistemic aggregation is a *general* principle or election-specific.  
      - **Tractability:** Ideal for formal comparison (e.g., model differences between jurors, experts, algorithms). Philosophy can tackle legitimacy of unequal standing.  
      - **Leverage:** Experiments in citizens’ assemblies and AI councils provide test cases *without needing original data*. Insights from #1–#2 directly apply here.  
      **Synergy:** Answers "Where does CJT-style reasoning *actually* work?"—feeding into #5 ("so what?").  

  4.  **#4: Threshold Rules Across Issues**  
      **Why Fourth?**  
      - **Upstream Influence:** Builds on #1–#3. If competence varies by issue type (e.g., technical vs. moral), thresholds *should* adapt—but this requires prior work.  
      - **Tractability:** Formal (optimal voting rules under uncertainty) + philosophical (issue-typing frameworks). Less standalone than #1–#3.  
      - **Leverage:** Growing interest in "portfolio approaches" to governance (e.g., differential delegation). Needs #1 (endogenous competence) to avoid static assumptions.  
      **Downside:** Risk of premature optimization if foundational issues (#1–#2) aren’t settled.  

  5.  **#5: The "So What" Question**  
      **Why Last?**  
      - **Upstream Influence:** Meta-theoretical; benefits from progress on #1–#4. Answering it preemptively risks circularity.  
      - **Tractability:** Primarily philosophical (role of idealizations, demarcating evidential/illustrative uses). Limited formal content.  
      - **Leverage:** Gains urgency *after* addressing #1–#4. New institutional experiments (e.g., sortition bodies) could later test CJT’s real-world role.  
      **Strength:** Forces reflection on whether the entire program matters—best saved for synthesis.  

  ---

  ### **Confidence Assessments**
  - **Highest Confidence:** Ranking **#1 (Endogenous Competence)** as top priority (95% confidence). It’s the linchpin for modern relevance.  
  - **High Confidence:** Distinction between **#2 (Correlated Error)** and **#3 (Domain Transfer)** (80% confidence). Correlation is more urgent for CJT’s validity.  
  - **Moderate Confidence:** Placing **#4 (Threshold Rules)** above **#5 (So What?)** (75% confidence). Applied theory > meta-theory at this stage.  
  - **Least Confident Judgment:** Ranking **#3 (Domain Transfer)** above **#4 (Threshold Rules)** (65% confidence).  
    - *Why?* Threshold rules have immediate policy appeal, and Domain Transfer’s "what breaks" question could become nebulous without sharp constraints. However, Domain Transfer’s potential to *generalize* epistemic aggregation makes it marginally more transformative. This is the most load-bearing guesswork—swap them if the committee prioritizes institutional design over conceptual expansion.

  ---

  ### **Missing Question? A Candidate for Inclusion**  
  **"Epistemic Trade-offs in Hybrid Systems"**  
  *Should collective bodies delegate to experts? When does voting complement prediction markets? How do we model cascades of epistemic dependence (e.g., voters → representatives → committees)?*  
  - **Justification:** More integrative than your list. Builds on #1–#3 but forces synthesis. Tackles real-world complexity (e.g., IPCC reports, central banks).  
  - **Priority vs. Your Five:** Would compete with #3/#4. If added, place it at #3, pushing Threshold Rules to #4 and Domain Transfer to #5.  
  - **Why Not Higher?** Less "pure" than your questions; may require mapping existing institutions.  

  ---

  ### **What Could Change the Ranking?**  
  - **↑ Endogenous Competence:** New game-theoretic models of deliberation (e.g., learning with heterogeneous costs).  
  - **↑ Correlated Error:** Breakthroughs in measuring correlation in existing datasets (e.g., via natural language processing of voter justifications).  
  - **↑ Domain Transfer:** High-profile failures/successes of citizens’ assemblies (e.g., climate policies).  
  - **↓ Threshold Rules:** If #1/#2 reveal that "competence" is too context-dependent to type issues robustly.  
  - **↑ So What?:** If a major democratic institution explicitly invokes CJT in reforms (e.g., electoral system changes).  

  This agenda prioritizes rebuilding CJT on realist foundations (#1–#2), then stress-testing its scope (#3–#4), leaving its philosophical status (#5) to crystallize last. The goal is to turn the theorem from a static paradox into a dynamic toolkit for institutional design.
