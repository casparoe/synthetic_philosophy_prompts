  For the tension question, I'll frame it to force a distinction between act/agent "oughts" and ask how integrity counts as an objection if it's only about character. The follow-up will press what work "objection" does then. 

  For the sophisticated consequentialism reply, I'll question if directing agents not to calculate resolves alienation. The follow-up will ask why external justification undermines integrity even without calculation.

  For the unity of life, I'll ask if integrity is a psychological fact and what evidence supports it. The follow-up will demand how to test if consequentialist agents lack such unity.

  The fourth question will challenge why integrity is morally significant. The follow-up will ask if consequentialism can accommodate it as a value.

  The fifth will ask if the objection confuses justification and motivation. The follow-up will probe if the alienation charge holds even if they're separated.

  Each follow-up prevents restatement. The sequence builds from conceptual tensions to psychological premises.
answer: |-
  Here are five interview questions addressing the specified tensions:

  1.  When you argue that consequentialism alienates agents from their commitments, are you primarily claiming the theory prescribes wrong *actions*, or that it fosters a defective *agent standpoint*? If the latter, how does this remain an "objection" to consequentialism as a theory of right action rather than just a critique of consequentialist character?
  2.  Sophisticated consequentialism grants Williams's point about calculation and directs agents to *not* consciously maximize, instead internalizing rules or dispositions. What, precisely, remains alienating about an agent who unreflectively lives her deepest commitments, yet whose *ultimate justification* for them remains external (that they pass the maximizing test)? Doesn't this preserve integrity psychologically?
  3.  The integrity objection seems to presuppose a certain unity of a life—that "integrity" names a real psychological condition where projects are genuinely *the agent's own*. What empirical evidence or philosophical argument demonstrates this unity is a necessary feature of agency that any theory *must* accommodate, and cannot be undermined by consequentialism without loss?
  4.  Why should we see the potential psychological alienation described by the integrity objection as a *moral* failing of consequentialism, rather than just a regrettable psychological cost? Couldn't a consequentialist simply argue that integrity, while valuable, is sometimes rightly sacrificed for greater overall good?
  5.  Doesn't the one-thought-too-many point conflate the *justification* of an act (whether it was right) with the *motivation* for performing it (the agent's reasons)? If we separate these, can the alienation charge survive against a theory that justifies acts consequentially but allows (or demands) agents are motivated directly by their commitments?
