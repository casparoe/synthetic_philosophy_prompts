  Okay, let me tackle this user's query about the voting rationality debate. The user witnessed a heated discussion between two PhD students—Maya (formal theorist) and Jonah (philosopher)—and wants a thorough adjudication of their arguments. 

  First, I need to map out the entire exchange step by step. The user specifically asked for analysis of four moves: Maya's initial abstention argument, Jonah's impartial-voter response, Maya's "dominated actions" rejoinder, and the expressive voting vs duty term debate. 

  Hmm, interesting how this mirrors classic literature on the paradox of voting. Maya represents the Downs-Riker-Tullock instrumentalist view, while Jonah channels the ethical voter and expressive voting models. The user seems well-versed in poli sci theory but wants fresh perspective beyond predictable disciplinary silos.

  For Maya's opening argument: She's technically correct about vanishingly small pivot probabilities in large elections. Her dismissal of "duty" as a fudge factor is valid - introducing unobservable utility terms does risk making the theory tautological. But she overlooks that rational choice models routinely incorporate non-instrumental preferences.

  When Jonah invokes impartial social utility, his math holds... but Maya's counter about neglected high-leverage actions is devastating. If we take expected social value maximization seriously, voting becomes irrational compared to more efficient political actions. Jonah's position implicitly assumes voting is uniquely expressive, which needs justification.

  Ah, the expressive voting point! Jonah's football analogy is clever but Maya nails the core problem: without measurable parameters, expressive utility becomes just another "duty" in disguise. Still, Jonah's right that dismissing non-instrumental value reflects model bias - behavioral economics shows people derive real utility from symbolic acts.

  What both miss: institutional factors like compulsory voting laws, and social norms around voting as duty. Also the "minimal effect" literature showing small groups (not individuals) can be pivotal. And crucially, they're talking past each other on rationality - Jonah means reasonable while Maya means instrumentally optimal.

  The user wants adjudication, not just summary. I should declare partial wins: Maya wins on instrumental grounds but Jonah on expressive, with both overlooking synthesis possibilities. The real gap is recognizing voting as a social practice where multiple rationalities operate simultaneously. 

  For the response structure: I'll analyze each exchange move with "who's more right," then unpack their blind spots regarding the literature's usual framing. The conclusion should emphasize that the "paradox" persists precisely because voting serves dual purposes - individual calculus can't capture its collective meaning.
answer: |-
  Let's dissect this rigorous debate move-by-move, drawing on the literature while acknowledging the genuine force in both positions. The paradox of voting (Downs, 1957; Riker & Ordeshook, 1968) remains unresolved precisely because it exposes tensions between different conceptions of rationality and motivation.

  **1. Maya's Initial Abstention Argument (Instrumental Rationality & Pivot Probability)**
  *   **Her Case:** Maya is fundamentally correct *within a strict framework of instrumental, self-interested rationality focused solely on affecting the outcome.*
      *   **Pivot Probability:** In large elections, the probability (P) that one vote is decisive is indeed astronomically small (often estimated at 10^-7 or less). This is mathematically sound (e.g., Gelman et al., 2010, 2012).
      *   **Expected Utility (Selfish):** If the voter's payoff (B) is *only* their personal benefit *if their preferred candidate wins*, then Expected Utility (EU) = P * B - C (Cost). For large electorates, P*B ≈ 0, making EU ≈ -C < 0. Abstention is instrumentally rational.
      *   **"Duty" Critique:** She is also largely correct that simply adding an unmeasured "D" (duty) term (EU = P*B + D - C) risks making the model tautological. If D is defined *post hoc* as "whatever utility makes people vote," it explains *everything* and predicts *nothing*. It lacks falsifiability without independent measurement or theoretical grounding for D.
  *   **Who is More Right Here? Maya.** Her logic is airtight *within the narrow confines of purely instrumental, self-interested rationality focused solely on causing the outcome*. Her critique of an ungrounded "D" term is valid.

  **2. Jonah's Impartial-Voter Response (Social Utility)**
  *   **His Case:** Jonah correctly identifies the implicit egoism in Maya's setup and offers a compelling alternative.
      *   **Scope of Benefit:** If the voter is impartially motivated (cares about the total social welfare impact of the election), the relevant benefit (B_social) is the *aggregate* gain for all beneficiaries if their preferred side wins (e.g., millions of people gaining utility).
      *   **Expected Social Utility:** EU_social = P * B_social - C. While P is tiny, B_social is enormous. P * B_social *can* be significant (e.g., 10^-7 * $10^10 = $1,000). If C < P*B_social, voting is rational for an impartial utility maximizer.
      *   **Reframing the Paradox:** Jonah is right that Maya's "airtight case" implicitly assumes voters only care about their *personal* slice of the outcome, ignoring the collective stakes. This impartial perspective is a standard and powerful counterargument (e.g., Goodin & Roberts, 1975; Parfit, 1984).
  *   **Who is More Right Here? Jonah.** He successfully breaks the paradox *for an impartially motivated voter* by correctly expanding the scope of the benefit considered. Maya's case only looks airtight if we assume narrow self-interest.

  **3. Maya's "Then Do the Dominated Actions Too" Rejoinder (Leverage & Consistency)**
  *   **Her Case:** Maya lands a powerful blow against the practical coherence of Jonah's impartial calculus as a *complete* explanation for voting behavior.
      *   **Comparative Leverage:** Many political actions (donating $50 to a campaign, canvassing for an hour) have a vastly higher *expected impact per unit cost* than voting. A campaign donation might have a P(impact) orders of magnitude higher than P(pivot) for an individual vote (e.g., influencing dozens or hundreds of votes through effective campaigning). The expected social utility per dollar or per hour spent on these actions likely dwarfs that of voting.
      *   **Inconsistency:** If citizens were truly impartial expected social utility maximizers, they *should* prioritize these high-leverage actions constantly. Yet, most people (including theorists) don't behave this way. They vote but often neglect more impactful avenues. This suggests voting is driven by factors *other* than, or in addition to, impartial expected utility maximization of outcomes.
      *   **Revealed Preference:** The observed behavior (voting common, intense high-leverage activism rare) contradicts the prediction of pure impartial EU maximization. Jonah's model struggles to explain *why* voting specifically is the common focal point if other actions offer better "bang for the buck" in social impact.
  *   **Who is More Right Here? Maya.** Her critique highlights a major weakness in relying *solely* on impartial expected social utility to explain voting. It fails to account for the specific prevalence of voting over more impactful actions and reveals an inconsistency in behavior if that were the primary motive.

  **4. Final Exchange: Expressive Voting vs. Duty Term**
  *   **Jonah's Expressive Voting:** Jonah introduces a crucial non-instrumental dimension.
      *   **The Argument:** Voting can be an expressive act – affirming identity, solidarity, allegiance, or civic participation – akin to cheering at a game. The value lies in the act itself, not its causal efficacy. This is a well-established concept (Brennan & Lomasky, 1993; Schuessler, 2000).
      *   **Beyond Tautology:** Jonah is right that this isn't *necessarily* just a "duty term in disguise." Expressive value *can* have independent theoretical grounding and empirical content. We observe when people vote (close vs. landslide elections, high-salience vs. low-salience), what they say motivates them (surveys showing importance of civic duty, expressing voice), and how voting correlates with group identity. This provides constraints and testable hypotheses.
  *   **Maya's Critique:** Maya correctly identifies the *risk*.
      *   **Measurement & Falsifiability:** Quantifying expressive utility (E) is inherently difficult. If E is simply defined as the residual utility that explains any voting not accounted for by P*B (selfish or social), it *can* degenerate into the same tautology as the ungrounded "D" term (EU = P*B + E - C). Without clear constraints or independent measures for E, the model risks being unfalsifiable.
      *   **Distinction Blurring:** The line between "expressive value" and "duty" is often thin. Is cheering because you enjoy it (expressive) or because you feel it's your role as a fan (duty)? Both can motivate the same act.
  *   **Who is More Right Here? It's a Draw with Nuance.**
      *   **Jonah** is right that expressive voting is a conceptually distinct and empirically plausible motivation that avoids the *strict* instrumental paradox. Refusing to consider non-instrumental value *is* a limitation of purely instrumental models.
      *   **Maya** is right that *without careful theoretical development and empirical grounding*, expressive utility can easily become a "get out of jail free card" that makes the rational choice model vacuous for voting, replicating the problems of the ungrounded duty term. The burden is on proponents to specify when and why expressive utility arises and how it can be measured or bounded.

  **What Both Are Missing About the Classic Paradox Framing:**

  1.  **Group-Level Effects & Minimally Effective Coalitions:** The literature often considers not just the *individual* pivot, but the potential for a *group* (e.g., your demographic, your precinct) to be pivotal if it turns out in sufficient numbers (e.g., Edlin et al., 2007). This can raise the perceived P for individuals who identify with such groups.
  2.  **Social Norms and Sanctions:** Voting is often framed as a social duty enforced by norms (approval for voting, disapproval/shaming for abstention). The "cost" (C) isn't just time/effort; abstention can carry social/psychological costs, and voting can yield social/psychological benefits (Riker & Ordeshook, 1968's "D" often included this). They touched on this via duty/expression, but didn't fully integrate the *social enforcement* aspect.
  3.  **Misperception of P:** There's evidence that people systematically overestimate their pivot probability (P), especially in close elections (Quattrone & Tversky, 1984). What's "irrational" by strict calculation might be driven by cognitive biases.
  4.  **The "Minimal Effect" of High-Leverage Actions:** Maya assumes donating/canvassing have demonstrably higher leverage. While often true, estimating *their* true P(impact) is also fraught with difficulty and uncertainty. The perceived efficacy of these actions might also be low or ambiguous for many people.
  5.  **Institutional Context:** Factors like compulsory voting, ease of registration/voting (vote-by-mail), and election closeness dramatically affect turnout, suggesting rational (or quasi-rational) responses to changing P and C.

  **Adjudication Summary:**

  *   **Maya Wins Round 1:** Her instrumental, self-interest-based case for abstention is logically sound within its narrow assumptions. Her critique of a free-floating "duty" term is valid.
  *   **Jonah Wins Round 2:** He successfully breaks the paradox for impartially motivated voters by incorporating total social utility.
  *   **Maya Wins Round 3:** Her "dominated actions" critique exposes a major flaw in relying *solely* on impartial social utility; it fails to explain the specific prevalence of voting over potentially more impactful acts and reveals behavioral inconsistency.
  *   **Round 4 is a Draw:** Jonah's expressive voting is a vital non-instrumental concept with empirical support, moving beyond mere duty. However, Maya correctly warns that without careful handling, expressive utility can become just as unfalsifiable and tautological as the duty term it sought to replace. Jonah wins on conceptual grounds; Maya wins on methodological caution.

  **The Core Insight:** The "paradox" persists because voting is a complex act driven by *multiple, overlapping motivations* – instrumental (selfish and social), expressive, and normative/dutiful. No single model (pure self-interest, pure social utility, pure expression) fully captures why people vote. Rationality depends entirely on which motivations and which conception of "benefit" or "value" you prioritize. Jonah broadens the scope of value (social, expressive), making voting rational under those definitions. Maya insists on stricter definitions of instrumental efficacy and model falsifiability, revealing the limitations of those broader rationales when examined for consistency. The truth lies in recognizing this motivational pluralism.
