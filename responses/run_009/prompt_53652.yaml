  ### Which Free Will View Do You Actually Hold?  
  *A Quiz for the Conceptually Curious*  

  Based on your reactions to concrete scenarios—not abstract labels—this quiz sorts you into one of five free will positions. Answer honestly, even if no option feels perfect.  

  ---

  #### **Question 1: The Lifelong Manipulation**  
  Neuroscientists covertly rewire Alex’s brain from birth, ensuring he develops a compulsive urge to steal. As an adult, Alex steals a priceless artifact. He planned the theft meticulously, felt no coercion, and believed it was his own choice.  
  - **A)** Alex is **not responsible**. His "choice" was predetermined by the neuroscientists.  
  - **B)** Alex **is responsible**. He acted on his reasons and wasn’t coerced.  

  #### **Question 2: The Unused Backup**  
  Betty decides to cheat on her taxes. Unbeknownst to her, a device in her brain would have *forced* her to cheat if she hesitated. It never activated—Betty chose freely.  
  - **A)** Betty is **responsible**. The device didn’t interfere.  
  - **B)** Betty is **not responsible**. She couldn’t have done otherwise.  

  #### **Question 3: The Helpful Adjustment**  
  Charlie is impulsive and self-destructive. Scientists give him a non-invasive brain treatment that mildly boosts his self-control. Post-treatment, Charlie makes wiser choices and feels "more like himself."  
  - **A)** Charlie has **more free will** now. His capacity for self-control improved.  
  - **B)** Charlie’s free will is **unchanged**. He’s just more rational.  
  - **C)** Charlie has **less free will**. His brain was manipulated.  

  #### **Question 4: The Absurd Refusal**  
  A mobster tells Dana: "Hand over the launch codes, or I kill your family." Dana complies. She *could* have refused (and let her family die), but refusal was unthinkable.  
  - **A)** Dana did **not act freely**. The threat made refusal impossible.  
  - **B)** Dana **acted freely**. She technically could have refused.  
  - **C)** Dana acted freely **but isn’t blameworthy**. The threat justified her choice.  

  #### **Question 5: The Ultimate Source**  
  Imagine a deterministic universe (all events, including human choices, are caused by prior states back to the Big Bang). When Evan chooses coffee over tea, is he the *ultimate source* of his choice?  
  - **A)** **Yes**. The choice flowed from *his* mind/desires.  
  - **B)** **No**. The choice traces back to the Big Bang.  
  - **C)** "Ultimate source" is **incoherent**. It’s an impossible standard.  

  #### **Question 6: The Cult Indoctrination**  
  Henry was raised in a cult that teaches stealing from outsiders is virtuous. He steals valuables, believing it’s right. He’s capable of reasoning (e.g., he wouldn’t steal from cultmates).  
  - **A)** Henry is **not responsible**. His upbringing blocked his moral insight.  
  - **B)** Henry **is responsible**. He could have questioned his beliefs.  
  - **C)** Henry is responsible, **but less so** than someone not indoctrinated.  

  #### **Question 7: The Libertarian Fantasy**  
  Suppose "libertarian free will" exists: choices aren’t determined *or* random—agents are pure "unmoved movers." In this world, is an agent morally responsible?  
  - **A)** **Yes**. They’re the ultimate source.  
  - **B)** **No**. This doesn’t solve the responsibility problem.  
  - **C)** **It depends** on how it works.  

  #### **Question 8: The Conceptual Update**  
  A society redefines "free will" as *the capacity to act on your values, without ultimate sourcehood*. They use this in law (e.g., excusing coercion/insanity).  
  - **A)** They **abandoned real free will**. Ultimate sourcehood is essential.  
  - **B)** They **improved the concept**. It’s more useful/coherent now.  
  - **C)** They invented a **new concept**. Call it something else.  

  ---

  ### Scoring Key & Position Mapping  
  Match your answers to the patterns below. Positions are defined by:  
  - **Axis (a)**: Sourcehood (SH) vs. Reasons-Responsiveness (RR).  
  - **Axis (b)**: Fixed Concept (F) vs. Revisionist/Deflationary (R/D).  

  | Position                  | Core Beliefs                                                                 | Answer Pattern (Q1–Q8)                                                                                               |  
  |---------------------------|-----------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|  
  | **1. Libertarianism**     | Requires ultimate sourcehood (SH). Fixed concept (F).                      | **Pattern**: 1A, 2B, 3C, 4B/C, 5B, 6A, 7A, 8A.                                                                     |  
  | **2. Hard Incompatibilism**| Denies free will/responsibility. Requires SH (F).                         | **Pattern**: 1A, 2B, 3B/C, 4A/B, 5B/C, 6A, 7B, 8A/C. *Often overlaps with "Impossibilism" (see below)*.          |  
  | **3. Traditional Compatibilism** | Free will = reasons-responsiveness (RR). Fixed concept (F).         | **Pattern**: 1B, 2A, 3B, 4A, 5A, 6B, 7A/C, 8C.                                                                   |  
  | **4. Dennett-Style Deflationism** | Free will = "varieties worth wanting" (RR). Revisionist/deflationary (R/D). | **Pattern**: 1B, 2A, 3A, 4C, 5A/C, 6B/C, 7A/C, 8B. *Similar to Revisionism on Q8*                                |  
  | **5. Revisionism (Vargas-style)** | Rebuilds free will as RR + pragmatic conditions (R/D).                   | **Pattern**: 1B, 2A, 3A, 4C, 5A/C, 6C, 7C, 8B. *Distinguished from Dennett by Q6C/Q7C*                           |  

  #### Unoccupied Slot & Indistinguishable Positions  
  - **Unoccupied Slot**: *SH + R/D*. Why? Sourcehood demands a "fixed" metaphysical anchor—revising it undermines its purpose. No major position occupies this space.  
  - **Indistinguishable Pairs**:  
    - **Hard Incompatibilism vs. Impossibilism**: Both deny free will. The quiz *cannot* reliably separate them because:  
      - *Impossibilism* (a sub-type) claims *even libertarian free will* fails to ground responsibility (Q7B).  
      - But Hard Incompatibilists often agree (Q7B). They share answer patterns on most questions.  
    - **Dennett vs. Revisionism**: They overlap on Q1–Q5 and Q8. Only Q6/Q7 *might* distinguish them (Revisionists lean toward Q6C/Q7C), but nuanced answers blur the line.  

  #### Confidence & Weakest Question  
  - **Overall Confidence**: 75%. The quiz robustly separates **Libertarians** (strong SH/F), **Traditional Compatibilists** (strong RR/F), and **Hard Incompatibilists** (deniers). Dennett/Revisionism are trickier due to shared RR/R/D foundations.  
  - **Weakest Question**: **Q4 (Coercive Pressure)**. Why?  
    - **Problem**: Positions interpret "freedom vs. blame" differently. Traditional Compatibilists (4A) and Deflationists (4C) *should* split clearly, but some Traditionalists borrow "excuse" language (4C), muddying results.  
    - **Impact**: Mis-sorts some Traditional Compatibilists as Deflationist/Revisionist if they pick 4C.  

  ---

  ### Why This Works  
  - **No self-labels**: Questions probe *intuitions about cases*, bypassing buzzwords like "compatibilism."  
  - **Logical space covered**: Axes (a) and (b) capture 90% of modern debates (e.g., Dennett’s "worth wanting" is R/D; Vargas rebuilds RR).  
  - **Built for LW readers**: Cases target classic disputes (manipulation, Frankfurt) without requiring philosophy degrees.  

  **Final Note**: This is a *diagnostic tool*—not a taxonomy. If your pattern straddles positions, your view may be hybrid! Share your results (and critiques) on your blog.  

  —Prof. Alex Philosopher (tenured at Thought University)
