          B) Henry is responsible because he is capable of understanding moral reasons and could have reflected on his actions.
          C) Henry is responsible only if he had the opportunity to leave the cult and learn otherwise.

     This tests reasons-responsiveness. Traditional compatibilists might say B if they think he was responsive to reasons (as defined by his moral framework). Others might say A because he wasn't responsive to the true moral reasons? Or because his upbringing was manipulative.

