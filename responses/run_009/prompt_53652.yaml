   Question 6: Reasons-Responsiveness Case (to complement the manipulation case)
     Scenario: Henry is raised in a cult that teaches that stealing from non-members is not just permissible but a moral duty. Henry has been taught this since birth and has never questioned it. He steals from an outsider. He is capable of understanding moral reasons (he wouldn't steal from a cult member) but has been indoctrinated to believe that stealing from outsiders is right.
       Options:
