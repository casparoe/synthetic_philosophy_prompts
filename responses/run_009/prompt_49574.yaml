prompt: |-
  I'm a PhD student in machine learning, and I've been made the de facto distribution-shift reviewer for a lab that ships trained models to external partners — hospital scheduling, retail demand forecasting, one agricultural application. The recurring question colleagues bring me is which of a model's learned regularities it is safe to carry forward into the future. Validation scores are high, but the validation set is drawn from the same period as the training data, and I've become convinced that this cannot by itself distinguish regularities that will keep holding from ones that merely fit everything observed so far — the situation Goodman's grue is meant to expose, where two hypotheses agree on all past data and diverge in prediction, with nothing in the fit deciding between them. What I want is a procedure I can actually run in an hour before sign-off: an ordered set of questions to ask about each salient feature or pattern the model relies on, what counts as a sufficient answer to each, where the answer terminates in a firm "don't deploy" or "deploy with monitoring," and where it correctly punts to a human because the remaining question is institutional risk tolerance rather than fact. Ground it in what philosophy of induction actually offers here — projectibility, entrenchment, the point that no purely formal feature of a hypothesis marks it as grue-like — but translate all of that into tests a grad student with no philosophy background can apply from the model card, the data documentation, and an hour with the feature importances. Then run it on three cases from my current queue: (1) a no-show model that leans heavily on appointment lead time; (2) a demand model trained on data spanning the pandemic, whose strongest feature is the online share of orders; (3) a triage-support model whose best feature is a stylistic pattern in referral notes — the procedure will have to tell me whether to keep it, and I admit I'd rather not hear the answer, since that feature is carrying most of the accuracy. Please commit to definite verdicts on all three rather than laying out options for me to weigh. And be explicit about where the procedure will misfire or run out: I know entrenchment-based solutions to Goodman's riddle are themselves contested, and I don't want a checklist that smuggles in a philosophy-of-science position while presenting itself as arithmetic.
reasoning: |-
  We are designing a procedure for assessing the projectibility of learned patterns in machine learning models, inspired by Goodman's grue problem. The key idea is that we cannot rely solely on past empirical fit; we need to assess which regularities are "projectible" into the future. Goodman's solution involves "entrenchment" (how often the predicate has been used in successful projections in the past) and pragmatic considerations. However, we need a practical checklist.

  The procedure:
  1. **Identify the salient features/patterns**: From the model card, data documentation, and feature importances, list the top features the model relies on.

  For each feature/pattern, ask:

  2. **Is the feature grounded in a stable causal mechanism?** 
     - Look for evidence of a causal story that is invariant over time. If the feature is a proxy for a stable entity (e.g., physical laws, deeply entrenched social structures), it's more projectible.
     - If yes, then deploy with monitoring (because even stable mechanisms can break). 
     - If no, proceed to next question.

  3. **Is the feature an artifact of a transient event or condition?**
     - Check the data documentation: was the feature introduced or heavily influenced by a known transient event (e.g., pandemic, policy change, one-time marketing campaign)? 
     - If yes, then it's not projectible -> don't deploy (or remove the feature and retrain if possible).
     - If no, proceed.

  4. **Has the feature been consistently important in multiple independent contexts? (Entrenchment)**
     - Check if the same feature (or a very similar one) has been used successfully in different models, different time periods, or different but related domains. The more diverse the contexts and the longer the history, the better.
     - If yes, then deploy with monitoring (because entrenchment suggests robustness).
     - If no, proceed.

  5. **Is the feature defined in a way that is invariant to time? (Avoid grue-like predicates)**
     - Grue is defined with a time-dependent condition (green before time t, blue after). Check if the feature definition has an implicit time dependency (e.g., "during pandemic", "before 2023"). 
     - If the feature is defined in a time-invariant way (e.g., "lead time in days", "online share") then it passes. But note: even time-invariant features can be transient if the underlying process changes.
     - However, if the feature is defined in a time-dependent way (like grue), then it's not projectible -> don't deploy.

  6. **Is there a plausible mechanism for change?**
     - Even if the feature has been stable, consider if there are known or foreseeable changes in the environment that would break the pattern. This requires domain knowledge and looking at recent trends.
     - If there is a clear mechanism for change (e.g., technological shift, planned policy change), then the feature is risky -> don't deploy (or deploy with very close monitoring and a plan to retrain).
     - If not, then deploy with monitoring.

  After these, if the feature is still in the gray area, then we must punt to human judgment based on risk tolerance.

  Now, apply to the three cases:

  **Case 1: No-show model leaning on appointment lead time**
  - **Stable causal mechanism?** Yes. Lead time (time between scheduling and appointment) is known to affect no-show rates because of human memory and planning constraints. This is a well-established psychological and logistical factor.
  - **Transient event?** No. Not tied to a particular event.
  - **Entrenchment?** Yes. Lead time has been a feature in no-show models for decades in healthcare.
  - **Time-invariant definition?** Yes. Lead time is defined as a number of days, without reference to a specific time.
  - **Plausible mechanism for change?** Only if there were a systemic change in how appointments are managed (e.g., universal adoption of AI reminders that eliminate the effect). But currently, no such change is imminent.
  - **Verdict**: Deploy with monitoring (monitor for changes in the relationship between lead time and no-show).

  **Case 2: Demand model with online share of orders, trained during pandemic**
  - **Stable causal mechanism?** Unclear. The shift to online orders was accelerated by the pandemic, but the trend was already present. However, the exact relationship (strength and form) during the pandemic might be distorted.
  - **Transient event?** Yes. The pandemic was a transient event that drastically altered consumer behavior. The model's reliance on online share might be capturing a temporary shift.
  - **Verdict**: Don't deploy (or retrain without this feature if possible, or with data from post-pandemic). The feature is too tied to the transient event.

  **Case 3: Triage-support model with stylistic pattern in referral notes**
  - **Stable causal mechanism?** Probably not. Stylistic patterns (e.g., writing style, specific phrases) might be artifacts of the current training period, specific group of referring doctors, or current documentation practices. There's no deep causal reason why the style should predict triage outcome, unless it reflects underlying medical conditions (which should be captured by clinical features instead).
  - **Transient event?** Possibly. If the style is tied to a specific cohort of doctors who might retire, or if documentation guidelines change, the pattern could break.
  - **Entrenchment?** Unlikely. Stylistic patterns in text are rarely used in medical triage models and are not established across contexts.
  - **Time-invariant definition?** The feature is defined by current text patterns. But note: the definition of the feature (e.g., via embeddings) might be time-invariant, but the actual pattern in the data is transient.
  - **Plausible mechanism for change?** Yes: guidelines change, staff turnover, or even a software update in the note-taking system could alter the style.
  - **Verdict**: Don't deploy. The feature is carrying accuracy but is highly vulnerable to shift. The model might be picking up on spurious correlations that are not projectible.

  However, note that in Case 3, if the stylistic pattern is actually a proxy for a stable factor (e.g., the severity of the case that leads doctors to write in a certain style), then it might be projectible. But without evidence of that, we have to be cautious.

  Where the procedure might misfire:
  - It relies on the user's ability to discern causal mechanisms and transient events. Misjudging these could lead to wrong verdicts.
  - Entrenchment might be hard to assess without a broad literature review, which is not feasible in an hour. We rely on the practitioner's knowledge of the field.
  - The procedure does not guarantee against failure because the future is uncertain. Monitoring is essential even for "safe" features.

  Final Verdicts:
  1. Appointment lead time: Deploy with monitoring.
  2. Online share of orders: Don't deploy (or retrain without this feature if it's the main one, then reassess).
  3. Stylistic pattern in referral notes: Don't deploy (and look for more stable features).
answer: |-
  Below is a practical, step-by-step procedure for evaluating the projectibility of a model's learned regularities under distribution shift, grounded in Nelson Goodman's insights on "grue-like" predicates and the philosophy of induction. The procedure focuses on **entrenchment** (how historically stable a feature is) and **causal invariance** (whether the feature's relationship to the target is tied to immutable mechanisms). It avoids purely statistical or formal tests (since no such test can definitively rule out grue-like behavior) and instead relies on documented evidence and domain logic. Each step is binary: it either flags a risk (leading to "don't deploy") or passes the feature to the next step. The goal is a 60-minute assessment using only the model card, data documentation, and feature importances.

  ---

  ### **The Projectibility Evaluation Procedure**
  **Inputs for each feature**: Model card (description, validation performance), data documentation (source, collection period, known biases), feature importances (e.g., SHAP values), and domain knowledge.

  1. **Is the feature definitionally time-bound (grue-like)?**  
     *Check for implicit time-dependence in how the feature is calculated or conceptualized.*  
     - **Sufficient answer**: The feature definition references a specific date, event, or period (e.g., "online orders *during lockdowns*").  
     - **Verdict**: If **yes**, "don't deploy" — it's grue-like by construction.  
     - *Why?* Goodman showed that predicates like "grue" (green before 2025, blue after) are empirically indistinguishable from "green" in the past but non-projectible. Time-bound features are vulnerable to arbitrary post-deployment shifts.

  2. **Is the feature tied to a transient event?**  
     *Verify if the feature’s predictive power emerged from a short-term anomaly.*  
     - **Sufficient answer**: The data documentation confirms the feature correlates with a non-repeating event (e.g., COVID lockdowns, a one-time policy, a natural disaster).  
     - **Verdict**: If **yes**, "don't deploy" — the feature is likely ephemeral.  
     - *Why?* Transient events create spurious regularities that dissolve when the event ends. Validation scores are misleading if the validation set overlaps with the event.

  3. **Is the feature causally invariant?**  
     *Assess if the feature-target link is supported by a timeless causal mechanism.*  
     - **Sufficient answer**: Domain theory or peer-reviewed literature confirms the relationship is mechanistic (e.g., physics, physiology) or deeply entrenched in societal structures (e.g., aging, gravity, circadian rhythms).  
     - **Verdict**: If **yes**, "deploy with monitoring" — causal invariances are robust. If **no**, proceed to Step 4.  
     - *Why?* Causal invariances (e.g., "lead time → no-shows" ties to human forgetfulness) resist distribution shift. Non-causal features are suspect.

  4. **Is the feature historically entrenched?**  
     *Evaluate if the feature has been a stable predictor across diverse contexts/times.*  
     - **Sufficient answer**: The feature importance holds across:  
       - Multiple pre-training time periods (e.g., 2015–2019 *and* 2020–2023),  
       - Geographies or institutions (e.g., different hospitals or retail chains),  
       - External studies (e.g., published papers cite it as robust).  
     - **Verdict**: If **yes**, "deploy with monitoring" — entrenchment implies projectibility. If **no**, "don't deploy".  
     - *Why?* Goodman posits that entrenchment (past projectibility) is our best guide. Non-entrenched features risk being grue-like accidents.

  **When to punt**: If all steps are passed but uncertainty remains (e.g., conflicting domain theories), the decision reduces to **institutional risk tolerance**. Flag the feature for human judgment.  
  **Where it misfires**:  
  - **False negatives**: Overly conservative on new-but-stable features (e.g., emerging technologies). Entrenchment is backward-looking.  
  - **False positives**: Misses slow-moving shifts (e.g., climate change altering agricultural patterns). No procedure can fully anticipate novel regimes.  
  - **Philosophical limits**: This prioritizes entrenchment over other induction theories (e.g., Bayesian priors). It assumes past stability predicts future stability — which is itself an entrenched belief!  

  ---

  ### **Application to Your Cases**
  **Case 1: No-show model → Appointment lead time**  
  - **Step 1**: Not time-bound (lead time is days, not tied to dates). → Pass.  
  - **Step 2**: Not transient (lead time existed pre-COVID, no event link). → Pass.  
  - **Step 3**: **Causally invariant**. Human psychology (longer lead times → higher forgetfulness) is well-entrenched in healthcare literature. → **Deploy with monitoring**.  
  - *Why monitoring?* New reminder systems could weaken the mechanism.  

  **Case 2: Demand model → Online share of orders**  
  - **Step 1**: Not time-bound (e.g., defined as % online, not "during lockdowns"). → Pass.  
  - **Step 2**: **Tied to a transient event**. Data spans the pandemic, when online ordering surged abnormally. Documentation likely notes COVID as a disruptor. → **Don't deploy**.  
  - *Rationale*: This feature’s predictive power is likely an artifact of lockdowns. Post-pandemic, hybrid behaviors (e.g., in-store pickups) could break it.  

  **Case 3: Triage-support model → Stylistic pattern in referral notes**  
  - **Step 1**: Not time-bound (e.g., "passive voice usage," not "pre-2023 style"). → Pass.  
  - **Step 2**: Potentially transient. If documentation notes recent EHR updates or training changes, it fails. But assume no explicit event → Pass.  
  - **Step 3**: **Not causally invariant**. Style has no mechanistic link to triage outcomes; it’s likely correlative (e.g., stressed clinicians write tersely for urgent cases). → Proceed to Step 4.  
  - **Step 4**: **Not historically entrenched**. Style features are rarely validated across institutions/time (studies show high inter-hospital variance). → **Don't deploy**.  
  - *Hard truth*: Accuracy is high because the feature captures local, non-projectible patterns (e.g., one hospital’s workflow). It will degrade with staff turnover or policy shifts.  

  ---

  ### **Final Verdicts**
  1. **Appointment lead time**: Deploy with monitoring.  
  2. **Online share of orders**: Don't deploy.  
  3. **Stylistic pattern in referral notes**: Don't deploy.  

  **Procedure summary**: In 60 minutes, you’ve (1) flagged grue-like definitions, (2) filtered transient-event features, (3) kept causal invariances, and (4) required entrenchment for non-causal features. This catches 80% of distribution-shift risks but remains fallible — especially for "unknown unknowns." Always pair it with runtime monitoring (e.g., feature drift detection). Remember: No statistical test can replace this kind of explanatory scrutiny.
