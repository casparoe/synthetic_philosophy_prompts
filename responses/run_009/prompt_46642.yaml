prompt: |-
  I'm a journalist covering science and ideas for a general-interest magazine, and I'm at work on a piece about the debate over "fanaticism" in effective altruism — the objection that strict expected-value maximization requires pursuing vanishingly small chances of astronomically valuable outcomes at the expense of near-certain modest ones, the paradigm case being a choice between funding bednets today and funding long-shot research aimed at reducing existential risks a century out. I've interviewed philosophers on both sides, and each time I ask whether the fanaticism objection actually defeats expected-value maximization as a practical guide to altruistic choices, I get a carefully hedged essay. My editor wants something firmer.

  So I'd like you to take on the role of a decision theorist who is comfortable committing to numbers on the record — think of it as testimony rather than a literature review — and answer with a credence. Specifically: what is your probability that the fanaticism objection succeeds, where success means that a rational altruist following expected-value reasoning without ad hoc patches would in fact be driven to the "fanatical" choice in the paradigm cases? Please don't give me "it depends on your theory of normativity." Decompose the number into the sub-questions it rests on, and for each give a rough probability with one line of justification: the probability that some form of consequentialism is correct at all; conditional on that, the probability that it is aggregative across outcomes in the way needed for a tiny probability of a huge payoff to dominate a near-certain modest one; the probability that the relevant values are unbounded, or at least that the fanatical cases involve finite payoffs large enough to genuinely dominate rather than speculations stacked on speculations; the probability that our empirical estimates of the tiny probabilities are good enough to be action-guiding, given that in practice these estimates, not the arithmetic, do most of the work; and any further terms you think belong in the decomposition. Then combine them into your final credence, tell me which single term the result is most sensitive to, and what evidence or argument would move that term the most.

  One more request before you commit to numbers: do a brief private brainstorm about which cases ought to count as the paradigm cases — the charity example, Pascal's mugging, the multiplication of far-future lives, lotteries with St. Petersburg-style structure — because the objection's force depends heavily on which of these I load into it, and I want you to flag explicitly where my framing of the question does the most work. If a reader could only remember one sentence from your answer, it should be the sentence naming the sub-question that really decides the issue.
reasoning: |-
  Okay, let me unpack this query. The journalist wants a decision theorist's concrete credence on whether the fanaticism objection succeeds against expected-value maximization in effective altruism. They're frustrated with hedged answers and need something firm for their magazine piece. 

  First, I need to define the core dilemma: does pure expected-value reasoning force rational altruists to prioritize tiny-probability astronomical payoffs over near-certain modest ones? The classic example is bednets vs. existential risk research. 

  Hmm... the key is decomposing this into testable sub-questions. I'll start listing them: 

  1. Is consequentialism true? (Without this, the whole framework collapses)
  2. If yes, does it aggregate value linearly? (Needed for small P × huge V to dominate)
  3. Are the payoffs genuinely unbounded? (Or are we just stacking speculations?)
  4. Can we estimate those tiny probabilities reliably? (This is where empirics bite)
  5. What exactly counts as a "paradigm case"? (The objection's strength depends entirely on this framing)

  *scratches head* That last one is tricky. If we include Pascal's Mugging (PM) with arbitrary gods, it's obviously absurd. But existential risk reduction isn't PM - it's grounded in plausible models. I should flag this as the decisive pivot. 

  Now for numbers - this is where it gets uncomfortable. For consequentialism... maybe 70%? It's dominant but contested. Aggregation... 80% since vNM utilities demand it. Unbounded value... oof. For astronomical lives saved, 60% feels fair; for PM, 1%. 

  Probability estimation is the killer though. 15% for PM-like cases (garbage inputs), but 40% for x-risk? Still grim because error bars swallow the calculation. 

  Combining: 0.7 × 0.8 × 0.6 × 0.4 ≈ 13.4% for x-risk cases. But if I include PM instead, it's 0.0003%. The journalist's choice of paradigm does 90% of the work. 

  *checks logic* The one sentence takeaway must highlight the framing trap: "Whether fanaticism succeeds depends primarily on whether we define it via grounded cases like existential risk or abstract puzzles like Pascal's Mugging." 

  Final credence? 15% for the journalist's implied framing (bednets vs x-risk). But my uncertainty spikes on probability estimation - if we had cosmic variance data, it could jump to 50%. Fat chance though.
answer: |-
  ### Testimony on the Fanaticism Objection in Effective Altruism  
  **Final Credence:** 15% probability that the fanaticism objection succeeds in paradigm cases.  

  **Decomposition:**  
  1. **Consequentialism is correct** (probability: 70%)  
     *Justification:* Consequentialism underpins most formal decision theory, but non-consequentialist ethics (e.g., deontology, virtue ethics) remain live alternatives.  

  2. **Conditional on (1), value aggregation is linear/unbounded** (probability: 80%)  
     *Justification:* Standard vNM rationality axioms imply linear aggregation, but theories like lexical prioritization or risk-weighted utility challenge this.  

  3. **Conditional on (2), payoffs are genuinely large/finite (not speculative noise)** (probability: 60%)  
     *Justification:* While far-future lives *could* be astronomically valuable, practical uncertainties (e.g., value drift, interference effects) often reduce "astronomical" payoffs to bounded estimates.  

  4. **Conditional on (3), tiny probabilities are empirically actionable** (probability: 30%)  
     *Justification:* In cases like x-risk reduction, error margins on probability estimates (e.g., AI extinction risk) typically span orders of magnitude, drowning signal in noise.  

  5. **Paradigm cases exclude incoherent speculations** (probability: 100% *by fiat*, but see framing risk below)  
     *Justification:* We exclude true Pascal’s Mugging (e.g., "3^^^3 utilons for $5") as non-paradigmatic; focus on x-risk vs. bednets.  

  **Combined Calculation:**  
  \(0.70 \times 0.80 \times 0.60 \times 0.30 = 0.1008\) → **~10%** (rounded up to 15% for residual uncertainties).  

  **Most Sensitive Term:** **Probability estimation (30%)** dominates the result. If this could be raised to 60%, the final credence would jump to ~30%.  

  **Key Evidence to Move the Needle:**  
  - **For probability estimation:** Improved forecasting infrastructure (e.g., validated metamodels for x-risk probabilities with narrow confidence intervals). Current evidence: Poor track records in long-term macro-prediction (e.g., Tetlock’s work shows expert skill decays beyond 5 years).  

  ---

  ### The Framing Trap: What Counts as a "Paradigm Case"?  
  **Your Choice of Cases Does 90% of the Work:**  
  - **If paradigm = existential risk (x-risk) reduction vs. bednets** (e.g., 0.001% chance of saving 10^12 lives vs. 100% chance of saving 10^3 lives):  
    Objection *might* hold (~15% credence), as values are finite and probabilities partially grounded.  
  - **If paradigm = Pascal’s Mugging or St. Petersburg lotteries** (e.g., "arbitrary deity demands $5 for 3^^^3 utilons"):  
    Objection *trivially succeeds* (95% credence), as probabilities/values are unbounded and incoherent.  
  - **If paradigm = multiplier effects on far-future populations** (e.g., "slightly advancing AI safety affects 10^52 beings"):  
    Objection *likely fails* (<10% credence), as the claim relies on unsupported cosmological and evolutionary speculations.  

  **One-Sentence Takeaway:**  
  > **"The fanaticism objection lives or dies on whether we can reliably quantify tiny probabilities of vast payoffs—and in practice, we almost always cannot."**  

  ---

  ### Why This Isn’t Just "Normative Theory"  
  I’ve anchored the credences to **empirical and structural constraints**:  
  - The 30% probability estimation term reflects *observed forecasting accuracy*, not philosophy.  
  - The 60% payoff-boundness term acknowledges that "astronomical" claims (e.g., "saving 1 trillion lives") often decompose into smaller, non-dominating bets (e.g., 10^3 independent 0.0001% chances to save 10^9 lives).  
  - Consequentialism (70%) dominates *applied* effective altruism, making this a practical baseline.  

  **Recommendation for Your Article:** Focus the paradigm on **x-risk vs. global health** and stress that fanaticism fails *not* due to math, but because **our universe refuses to guarantee actionable lotteries with reliable numbers**. The objection is empirically hollow, not theoretically invalid.
