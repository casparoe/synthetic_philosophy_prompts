prompt: |-
  My friends and I have been going around about who gets to blame whom, and I've realized my gut verdicts on cases don't obviously add up to anything, so I want to see if there's a principle hiding in them or if I just have to bite some bullets. The cases, with my honest reactions: my friend who lies to his girlfriend constantly has zero business calling out another friend for lying to his girlfriend — that one's easy, textbook hypocrisy. But a guy I know who lied habitually years ago, owned it, completely changed, and now talks openly about it? I think he actually does have standing to blame liars, maybe even more standing than someone who's never struggled with it. Then there's someone who is a terrible person on a totally different axis — say a guy who's cruel but scrupulously honest — blaming someone for lying. My gut says he has standing, that his cruelty doesn't disqualify him, which is weird because his hands are plenty unclean, just not for this. And then a casual acquaintance who's morally fine, blameless even, calling out someone they barely know for cheating: I feel like saying "this isn't really your business," even though the meddler is less of a hypocrite than anyone else on my list. So it can't just be about moral purity.

  There are two more that I keep going back and forth on, which is why I want a principle rather than vibes. One: a woman who was tempted to cheat on her husband, came very close, but stopped herself — does she have standing to blame a friend who actually went through with it? Part of me says of course, she resisted precisely because she takes the thing seriously. Another part says she's one weak moment away from being the person she's blaming, and if my reformed liar has standing, she should too, but it feels different and I can't say why. Two: someone whose own past cheating came out years later, after they'd already blamed their brother for cheating in the interim — I want to say their past blame was fine at the time, they weren't a hypocrite then, but boy does it look bad now. Which makes me wonder if standing is fixed at the moment of blaming or gets retroactively poisoned.

  So: what's the actual principle, or set of principles, behind these verdicts? I've half-notice there seem to be two different things going on — something about being guilty of the same thing, and something separate about whose business it is — but I can't tell if they're really two conditions or one, and my verdicts pull in opposite directions (the blameless meddler fails one but passes the other; the honest-but-cruel guy seems to pass both or neither depending on how you cut it). Please give me a principle stated precisely enough that it settles cases, tell me which of my verdicts it can't save and which of those I should actually give up, and then run it on one more case I haven't mentioned: a whole group of people who all quietly cheated on the same exam years ago, where one of them publicly blames another one for cheating on a different exam now. Does having the group's shared dirty secret change anything compared to one individual with the same past? I genuinely don't know what I think and want to know what the principle says before I decide whether I believe it.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're struggling with when someone has the moral standing to blame others. Their examples show conflicting intuitions, and they want a consistent principle. 

  First, I notice their cases reveal two main tensions: hypocrisy vs. relevance of past actions, and the role of personal connection. The reformed liar example suggests redemption matters, while the tempted-but-didn't-cheat case creates uncertainty about near-misses. 

  Hmm, the blameless meddler is particularly interesting - why does their lack of personal failings make their blame feel illegitimate? That points to relationship mattering more than moral purity. Meanwhile, the cruel-but-honest person's standing implies blame doesn't require overall goodness, just specific relevance to the issue.

  The time aspect bothers them too - whether standing is moment-specific or retrospectively tainted. And the group cheating scenario adds collective dimension to the hypocrisy problem.

  What's really at stake here? Beyond theoretical consistency, they seem to want practical guidance for real conflicts among friends. There's emotional weight to this - phrases like "going around about who gets to blame whom" suggest tension in their social circle.

  The core needs I see:
  1) A hypocrisy principle that accounts for redemption (unlike simple "clean hands" arguments)
  2) A relational component determining when blame is appropriate vs. meddling
  3) Resolution of temporal questions (does later exposure invalidate past blame?)
  4) Clarification on whether group secrets create shared culpability

  The two-track framework (hypocrisy + relational standing) seems promising. It explains why the cruel person can blame liars (relevant competence + hypocrite-free) while the blameless acquaintance can't (lacks relational right). 

  For the tough cases:
  - The tempted non-cheater likely has standing (competent via struggle, not hypocritical) unless she's currently wrestling with temptation
  - Past blame isn't retroactively poisoned - it was valid when given, though exposure damages current credibility
  - Group cheating creates mutual hypocrisy - they're all compromised regarding cheating accusations

  User should probably bite the bullet on the meddler case - their intuition there is correct despite the person's moral purity. Standing requires more than just being right.

  The unresolved tension is whether resisting temptation confers more or less standing than full redemption. I lean toward both having standing, but the user's discomfort might indicate a nuance about current vulnerability vs. past growth.
answer: |-
  Based on your intuitions and the tensions you've identified, the principle governing **moral standing to blame** ("hypocrisy" plus "meddling" concerns) isn't singular. It involves **two distinct, necessary conditions** that must *both* be met:

  1.  **The Competence Condition (Hypocrisy Avoidance):** *The blamer must not be currently guilty of the specific wrong they are condemning, in a way that undermines their credibility on that issue.* This isn't about overall purity but *relevant* culpability.
      *   **Focus:** The *specific act* being blamed (lying, cheating, cruelty, etc.).
      *   **Timing:** *Current* or *ongoing* guilt disqualifies. *Past* guilt, if genuinely repented and reformed, *does not* disqualify (and may even enhance competence via lived understanding).
      *   **Scope:** Guilt on a *different axis* (e.g., cruel person blaming a liar) *does not* violate this condition for the act of lying. Their hands are "unclean" generally, but not "for *this*".
      *   **"Currently Guilty" Nuance:** Includes active commission *or* being in a state of unresolved temptation/conflict where their own actions belie their condemnation (e.g., struggling with the urge to cheat while blaming a cheater *might* violate this).

  2.  **The Relational Condition (Right to Speak):** *The blamer must have a sufficiently close or relevant relationship to the wrongdoer or the wrong committed, such that the blamer is meaningfully affected or has a legitimate stake in upholding the norm in this context.*
      *   **Focus:** The *relationship* between blamer, wrongdoer, and the norm/context.
      *   **Basis:** Friendship, family ties, shared community, direct victimhood, or a specific role/responsibility (e.g., teacher, supervisor). A shared commitment to a norm *within* that relationship matters.
      *   **Excludes:** Strangers, casual acquaintances, or those whose connection is purely voyeuristic or meddlesome. Even if blameless and competent, they lack the *right* to intervene in that specific context.

  **Applying the Two Conditions to Your Cases:**

  1.  **Friend lying constantly blames another friend for lying:**
      *   *Competence:* **FAIL.** Currently guilty of the *exact same wrong*. Hypocrite.
      *   *Relational:* **PASS.** Friends have standing to call each other out.
      *   **Verdict:** No Standing. Matches your intuition.

  2.  **Reformed liar (past, owned it, changed) blames a liar:**
      *   *Competence:* **PASS.** Past guilt, but genuinely reformed. Not currently undermining their message; may enhance competence through understanding.
      *   *Relational:* **PASS.** Assumed relevant relationship (e.g., friend, someone they mentor).
      *   **Verdict:** Has Standing. Matches your intuition.

  3.  **Cruel but honest person blames a liar:**
      *   *Competence:* **PASS.** Guilt is on a *different axis* (cruelty). Their honesty gives them competence regarding the specific norm of truth-telling.
      *   *Relational:* **PASS.** Assumed relevant relationship.
      *   **Verdict:** Has Standing. Matches your intuition. Their general "unclean hands" don't negate competence *on this specific issue* or a relational right.

  4.  **Blameless acquaintance blames someone they barely know for cheating:**
      *   *Competence:* **PASS.** Blameless regarding cheating.
      *   *Relational:* **FAIL.** Casual acquaintance, barely knows the person. No close tie, meaningful effect, or specific role granting them the right to intervene here. It's meddlesome.
      *   **Verdict:** No Standing. Matches your intuition. Demonstrates competence alone isn't enough.

  5.  **Woman tempted to cheat (came close, stopped) blames friend who cheated:**
      *   *Competence:* **DEPENDS.** *If* her temptation is fully resolved and her commitment is demonstrably firm, she **PASSES** (similar to reformed person - understands the struggle, chose rightly). *However*, if she is *currently struggling* with unresolved temptation, actively wrestling with the desire, or her resistance feels fragile, she **FAILS**. Her near-miss makes her credibility precarious *if* the struggle is ongoing.
      *   *Relational:* **PASS.** Assumed friendship.
      *   **Verdict:** Has Standing *if* her struggle is resolved/past. Lacks Standing *if* she is currently vulnerable. Your intuition split reflects this ambiguity. The reformed liar's guilt was *actual* but *past and resolved*. Her guilt is *potential* and *might be current*.

  6.  **Person blames brother for cheating, then their own past cheating is exposed:**
      *   *Competence at Time of Blaming:* **PASS.** If their past cheating was unknown *even to themselves* in a repressed way, or known but truly past/reformed, they met the competence condition *at the moment they blamed*. Their hands were "clean" *for the purpose of that blame act* regarding cheating.
      *   *Relational at Time of Blaming:* **PASS.** Brother has strong relational standing.
      *   **Verdict (at the time):** Had Standing. Your intuition ("fine at the time") is correct per the principle.
      *   **Retroactive Poisoning?** Standing *at the time* isn't retroactively lost. However, the *revelation* destroys their *current* credibility and standing *for future* blame regarding cheating (they now fail the competence condition). It makes their *past* blame *look* hypocritical in hindsight, even if it wasn't technically hypocritical *at the time*. The *appearance* is poisoned, not the standing *at the moment it was exercised*.

  **The Group Cheating Case:**
  *   **Scenario:** Group all quietly cheated on Exam A years ago. One member (Blamer) *publicly* blames another member (Target) for cheating on Exam B now.
  *   **Analysis:**
      *   *Competence (Blamer):* **FAIL** (if known/remembered). Blamer is currently guilty of *cheating* (the specific wrong), even if on a different exam. Their public stance condemns cheating while they themselves cheated (Exam A) and concealed it. This is hypocrisy *on the specific norm of academic honesty*. The shared secret makes their *current* condemnation insincere *unless* they publicly own their own past cheating first. The group context amplifies the hypocrisy – Blamer benefits from the *same* concealment they now deny Target.
      *   *Relational:* **PASS.** Group membership creates a strong relational tie.
  *   **Principle Verdict:** No Standing. Blamer fails the Competence Condition due to unreformed guilt on the *specific wrong* (cheating). The group secret makes their hypocrisy collective and ongoing. Their standing hinges on first publicly confessing their own past cheating and demonstrating reform regarding academic honesty.
  *   **Compared to Individual:** An *individual* reformed cheater who confessed *can* have standing. The *group secret* creates a state of *ongoing concealment* and mutual complicity. Blamer, by staying silent about Exam A while blaming Target for Exam B, is *actively participating* in the hypocrisy.

  **Bullets to Bite & Verdicts Saved:**

  *   **Bite This Bullet:** Your intuition that the **blameless meddler lacks standing** is correct per the principle (Relational Condition), even though it feels counterintuitive because they pass Competence. Their intervention is illegitimate due to lack of relationship, not lack of moral purity.
  *   **Bite This Bullet (Conditionally):** Your unease about the **tempted non-cheater** is justified. If her temptation is *current and unresolved*, she lacks standing (fails Competence). Only if she's firmly past the struggle does she have standing.
  *   **Saved Verdicts:** The principle strongly supports your intuitions on the constant liar (hypocrite), the reformed liar (has standing), the cruel honest person (has standing), and the retroactive appearance problem (standing existed at the time, poisoned later).

  **The Core Principle Restated:** **A person has the moral standing to blame another for a specific wrong only if (1) they are not currently guilty of that same specific wrong in a way that undermines their credibility, *and* (2) they have a sufficiently close or relevant relationship to the wrongdoer or the context of the wrong that grants them a legitimate right to speak.** This framework resolves the tensions in your intuitions by separating the issue of *credibility on the specific norm* from the issue of *who has the right to intervene in a specific relationship or context*.
