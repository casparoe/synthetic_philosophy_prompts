prompt: |-
  I'm a portfolio manager -- long/short equity, about fifteen years in, CFA, the usual -- and a college friend of mine has gotten deep into effective altruism and keeps telling me they decide where to donate using a framework called importance, tractability, neglectedness. As best I understand it: pick problems that are big, solvable, and that not many people are already working on. He claims this is why he thinks AI risk beats funding mosquito nets in poor countries even though the nets have decades of actual evidence behind them, and that the framework is basically the same reasoning I use every day, just about doing good instead of making money.

  Maybe he's right, but I want it done properly. Restate the ITN framework in the vocabulary I actually use, as faithfully as you can -- importatance relative to market cap vs. addressable market vs. magnitude of the mispricing, tractability as something like capacity to deploy capital and implementation risk, neglectedness as undiscoved alpha or as crowding/alpha decay, and whatever else maps. Then give me the residue report, because that's the part I actually care about: which of their claims translate cleanly, which only translate if you distort them, and which have no expression in my vocabulary at all -- and for each piece of residue, whether that's because finance is missing something or because their claim is fuzzier than it sounds. The thing I keep snagging on is the crowding mechanism. When a trade gets crowded, the price moves and the edge is gone -- that's *why* we care about crowding, it's priced in automatically. When a cause gets "crowded," what exactly happens? Does anything move? If there's no price, is neglectedness tracking marginal impact at all, or just virtue-signalling about being early to something? And the nets-vs-AI comparison looks to me like the nets are the trade with a real backtest and AI risk is the narrative stock with the huge TAM, which in my business is a classic way to lose money.

  So: translate it honestly, tell me what doesn't carry, and if the whole comparison just breaks down at some point, say so plainly instead of forcing it into a nice story. Same goes for my own framing -- if my "narrative stock" jab is doing work it shouldn't, or if I'm smuggling in assumptions from markets (like that opportunities get priced efficiently) that don't apply to philanthropy, flag that too. I'd rather find out the analogy is bad than feel clever about it.
reasoning: |-
  Okay, let me unpack this portfolio manager's request. They're deeply embedded in finance with fifteen years of experience and a CFA, and their EA-focused friend is pushing the ITN framework. The core ask is clear: translate ITN into finance vocabulary honestly, then dissect what doesn't carry over.

  First, I need to map ITN components precisely:
  - Importance = Market sizing analog (TAM, mispricing magnitude)
  - Tractability = Implementation risk/capital deployment capacity
  - Neglectedness = Crowding/alpha decay dynamics

  But the real meat is in the residue - where the analogy breaks. Their mosquito nets vs AI risk example is telling: nets are like a proven strategy with backtested data, while AI risk resembles speculative growth stocks. That's where their skepticism about "narrative stocks" kicks in.

  The crowding mechanism is the critical friction point. In markets, crowding self-corrects via price. But in philanthropy? No pricing mechanism exists. More donations might actually increase an organization's efficiency (economies of scale) rather than eroding impact. That's fundamentally different from alpha decay.

  I should also flag their embedded market assumptions:
  - The efficient market hypothesis doesn't apply to philanthropy
  - Philanthropy lacks a profit motive to correct misallocations
  - Impact isn't fungible like capital

  Their "narrative stock" concern is valid but incomplete. In philanthropy, early bets on neglected areas can catalyze entire fields - unlike markets where being early often just burns capital. And tractability includes weird factors like political will that have no finance equivalent.

  The translation holds best for importance/tractability but fractures at neglectedness. For the residue, I'll need to show exactly where finance thinking oversimplifies (e.g., assuming crowding always reduces impact) and where EA might be underspecified (e.g., defining "sufficiently neglected"). 

  Most importantly, I must resist forcing a perfect analogy. The comparison is useful but leaks at the joints - especially around dynamic allocation and measurement. That's not a flaw, just a boundary to acknowledge.
answer: |-
  Here’s the translation of the ITN framework into finance vocabulary, followed by a clear-eyed residue report on where the analogy holds, distorts, or breaks—and why. I’ll flag your embedded assumptions and the "narrative stock" concern explicitly.

  ---

  ### **Core Translation of ITN Framework**
  | **ITN Component** | **Finance Equivalent** | **Mapping Logic** |
  |-------------------|------------------------|------------------|
  | **Importance** | **Magnitude of Mispricing (ΔV)** | *Scale of opportunity*. Not just total addressable market (TAM), but the *gap* between current valuation and fair value. In EA: not just "big problem" but *disutility gap* (e.g., DALYs unaddressed). |
  | **Tractability** | **Capacity to Deploy Capital + Execution Alpha** | *Ability to capture the edge*. Combines "solvability" (technical/political feasibility) with scalability and implementation risk. Like assessing management quality or operational leverage in a trade. |
  | **Neglectedness** | **Undiscovered Alpha / Low Crowding** | *Asymmetric information or attention*. Where capital (donations/talent) hasn’t yet arbitraged away the edge. Measures marginal impact per dollar. |

  ---

  ### **Residue Report: What Doesn’t Carry Over**
  #### **1. Neglectedness ≠ Crowding in Markets (The Critical Fracture)**  
  - **Finance Reality:** Crowding erodes alpha *automatically* via price movement. When capital floods a trade, the mispricing corrects, killing the edge. Crowding is a *self-correcting mechanism*.  
  - **Philanthropy Reality:** No pricing mechanism exists. More donations **don’t inherently reduce impact per dollar**—they might even *increase* it (e.g., economies of scale in bednet distribution). "Crowding" here tracks:  
    - **Diminishing returns** (e.g., vaccinating the first 80% of a population is cheaper than the last 5%).  
    - **Coordination failures** (e.g., 10 NGOs duplicating work in the same village).  
  - **Residue:** Your friend’s "neglectedness" is closer to **marginal ROI at the current funding frontier**. *No finance equivalent exists* because there’s no market to dynamically price impact. **Verdict:** Finance lacks this concept—and EA underspecifies how to measure "sufficiently neglected."  

  #### **2. Tractability ≠ Implementation Risk (Hidden Friction)**  
  - **Finance:** Execution risk is bounded (e.g., slippage, management fraud). You hedge or exit.  
  - **Philanthropy:** "Solvability" includes **exogenous variables** with no analogues:  
    - Political volatility (e.g., aid banned in a regime).  
    - Behavioural/cultural adoption barriers (e.g., vaccine hesitancy).  
    - Scientific uncertainty (e.g., unknown AI alignment solutions).  
  - **Residue:** EA tractability often assumes *linear progress* (e.g., "X dollars buy Y nets"). But real-world tractability has **binary outcomes** (e.g., "AI alignment either works or it doesn’t"). *Distorts when mapped*.  

  #### **3. Importance ≠ Mispricing (Apples/Oranges)**  
  - **Finance:** Mispricing is **relative and fungible**. $1B edge in small-cap ≠ $1B edge in megacap.  
  - **Philanthropy:** Importance is **absolute and non-fungible**. A child saved from malaria = a life saved, full stop. But comparing lives saved vs. AI extinction risk? **No common denominator**.  
  - **Residue:** EA’s "importance" smuggles in **moral weights** (e.g., future lives > current lives). *No finance equivalent* for this ethical loading.  

  ---

  ### **Your "Narrative Stock" Jab: Fair but Misapplied**  
  - **Valid Parallel:** AI risk *is* like a pre-revenue biotech stock: high TAM, zero proven traction, narrative-driven. Mosquito nets are "value stocks": proven, cash-flowing (lives saved), but low growth.  
  - **Where It Distorts:**  
    - **Profit Motive Absence:** A narrative stock collapses if it fails to monetize. Philanthropy has no such forcing function—donors don’t demand ROI, so "narrative" causes can persist for decades.  
    - **Evidence Thresholds:** "Decades of data" for nets is like a backtest. But in existential risk (AI/pandemics), *waiting for data = failure*. EA argues for **Pascal’s Wager logic** (infinite downside → act even with low probability).  
  - **Verdict:** Your analogy highlights **evidence quality** differences but ignores **asymmetric stakes**. (Finance has no equivalent of "if this fails, humanity dies.")  

  ---

  ### **The Crowding Mechanism: Why You’re Snagging**  
  EA’s "neglectedness" **does not dynamically adjust** like prices.  
  - **What "Moves"?**  
    - **Talent/attention saturation:** Top researchers flock to funded fields, leaving gaps elsewhere.  
    - **Policy/coordination inertia:** Funded areas become institutionalized (e.g., global health), crowding out new models.  
    - **Diminishing returns:** The 1,000th AI safety researcher has less impact than the 10th.  
  - **But:** No "price" signals when impact/ROI decays. EA relies on **static heuristics** (e.g., "Fewer than 300 people work on AI governance"). *This is closer to "undiscovered alpha" pre-trade than live crowding data*.  

  ---

  ### **Where the Analogy Breaks Irreparably**  
  1. **No Efficient Market Hypothesis:** Philanthropy has no arbitrageurs to correct misallocation. "Overfunded" causes don’t automatically bleed capital to "undervalued" ones.  
  2. **Impact Non-Fungibility:** You can’t short malaria to go long AI risk. Causes are isolated silos.  
  3. **Time Horizons:** Finance optimizes for risk-adjusted returns *now*. EA optimizes for **expected value over 10⁴⁰ future lives**—a scale incomparable to any investment horizon.  

  ---

  ### **Bottom Line**  
  **The analogy works for prioritization logic** (scarcity → allocate to highest marginal utility) but **fails on execution mechanics**. Your friend is right that ITN mirrors capital allocation—but *only if you ignore dynamic pricing, fungibility, and risk settlement*.  

  **What EA smuggles in:**  
  - Moral weights (future > present lives) as non-negotiable axioms.  
  - "Neglectedness" as a static snapshot, not a live market.  
  - Belief that tractability can be modeled without data (e.g., AI).  

  **What finance smuggles in:**  
  - That all opportunities are priced *somewhere* (not true in philanthropy).  
  - That evidence = backtests (not applicable to first-of-a-kind risks).  

  **Candid take:** The nets-vs-AI debate is less like "value vs. growth" and more like **"actuarial certainty vs. venture-scale optionality."** If you demand proven ROI, nets win. If you’re betting on convexity, AI *might* win—but with no terminal to cash out.  

  If this were a trade, I’d say: *Go long on the ITN framework’s logic, short its measurement assumptions, and hedge with a 5% allocation to meta-giving (e.g., charity evaluators).* But in philanthropy, the only real hedge is intellectual humility.
