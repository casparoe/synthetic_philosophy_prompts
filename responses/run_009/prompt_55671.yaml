answer: |-
  Below is a complete in-class game design to illustrate Lewis's convention theory, tailored for your 75-minute seminar with 13 students. The game emphasizes coordination without communication, arbitrariness, convention transmission via rotation, and the "lock-in" of a suboptimal convention. I'll outline the setup, rules, timings, debrief, and potential pitfalls.

  ---

  ### **Game Name**: Silent Signal Convention  
  **Objective**: Students coordinate on a signaling convention (using arbitrary gestures) to earn points. The game forces them to experience:  
  - Emergence of a shared convention without communication.  
  - Transmission of the convention to newcomers via observation.  
  - Inertia of a suboptimal convention due to coordination failure.  

  **Core Lewis Concepts Illustrated**:  
  - **Arbitrariness**: Multiple equally good signals exist; the convention's content is arbitrary.  
  - **Common knowledge of concordant expectations**: Players conform because they expect others to conform.  
  - **Preference for conformity**: No individual benefit to deviating unless others do.  
  - **Persistence of suboptimal conventions**: A better signal exists, but switching requires near-universal coordination.  

  **Materials**:  
  - Whiteboard (to track signals/points).  
  - Index cards (one per student) for private voting in the crucial stage.  
  - Timer.  

  ---

  ### **Game Setup & Rules**  
  **Duration**: 35–40 minutes (including transitions).  
  **Participants**: 10 "players" (active signalers) and 3 "observers" per round. Rotate roles to simulate newcomers.  
  **Signals**: Three hand gestures (deliberately arbitrary):  
  - ✋ **Signal A**: Hand raised flat (palm forward).  
  - ✌️ **Signal B**: Peace sign (two fingers).  
  - 👏 **Signal C**: Two claps (introduced later as the "better" signal).  
  **Payoffs**: Points for coordination (no real money). Announce:  
  - Matching signals: **1 point** (for A or B), **2 points** (for C).  
  - Mismatched signals: **0 points**.  

  **Game Flow**:  
  #### **Stage 1: Emergence of Convention (10 minutes)**  
  - **Players**: 10 students (3 observers watch).  
  - **Rules**:  
    - Only ✋ (A) and ✌️ (B) are allowed. No talking or eye contact.  
    - Each "interaction": Players are randomly paired (by you) into 5 pairs.  
    - On your count, pairs simultaneously show their signals.  
    - Pairs score **1 point** if signals match; **0** otherwise.  
    - **Repeat for 3 interactions** (new random pairs each time).  
  - **Teacher Actions**:  
    - After each interaction, tally/publicize the dominant signal on the board (e.g., "A: 7 pairs, B: 3 pairs").  
    - **Goal**: A convention (A or B) emerges via common knowledge of prevalence.  

  #### **Stage 2: Transmission via Rotation (10 minutes)**  
  - **Rotation**: Swap 3 players out (become observers) and 3 observers in (become players). New players have watched Stage 1.  
  - **Rules**:  
    - Same as Stage 1 (only A/B allowed).  
    - **Repeat for 2 interactions**.  
  - **Teacher Actions**:  
    - Highlight if newcomers adopt the established convention (e.g., "New players, did you use A because others did?").  

  #### **Stage 3: Introducing a "Better" Signal (5 minutes)**  
  - **Players**: Same 10 as Stage 2.  
  - **Rules**:  
    - Introduce 👏 **Signal C** (two claps). Announce: **C gives 2 points for a match** (vs. 1 for A/B).  
    - All signals (A, B, C) are now allowed.  
    - **Run 2 interactions** (random pairs).  
  - **Teacher Actions**:  
    - Note if C is adopted (rarely happens).  

  #### **Stage 4: Crucial Stage—Lock-In Effect (5–10 minutes)**  
  - **Rules**:  
    1. **Private Vote**: Distribute index cards. Players privately write:  
       - Their chosen signal for the next interaction (A, B, or C).  
       - Their prediction: "% of players I think will choose C."  
    2. **Interaction**: Run **one final interaction** with random pairs.  
    3. **Reveal Results**: Tally signals and predictions publicly.  
  - **Outcome**: Most will stick to A/B despite C's payoff. Predictions show low confidence in others switching.  

  ---

  ### **Debrief (30 minutes)**  
  **Map the Game to Lewis** (use whiteboard to sketch concepts):  
  1. **Arbitrariness**:  
     - "Why did A (or B) win? Was it inherently better?" → No; initial randomness made one focal.  
     - Lewis: Conventions are arbitrary solutions to coordination problems (A or B could have won).  

  2. **Common Knowledge & Concordant Expectations**:  
     - "How did you know what signal to use?" → Public tallies created common knowledge of prevalence.  
     - "Why did newcomers follow the convention?" → Observation built expectations of conformity.  
     - Lewis: Conventions rely on *common knowledge* of mutual expectations (I signal A because I expect you to).  

  3. **Preference for Conformity**:  
     - "Why not switch to C earlier?" → Individual risk: If only you switch, you get 0 points.  
     - Lewis: Agents prefer to conform *if others do* → No one is irrational.  

  4. **Persistence of Suboptimal Conventions**:  
     - "C gave more points—why couldn’t we switch?" → Voting reveals: Everyone knew C was better, but no one trusted others to switch simultaneously.  
     - Lewis: Conventions are "Nash equilibria"—deviating alone is harmful. Switching requires *coordinated belief shifts* (rare without communication).  

  5. **Transmission & Culture**:  
     - "How did the convention survive rotation?" → Newcomers conformed to preexisting expectations.  
     - Lewis: Conventions transmit via learning and shared history.  

  **Discussion Prompts**:  
  - "Did anyone feel ‘stuck’? How did that frustration map to real-world conventions (e.g., QWERTY keyboards)?"  
  - "Could we have switched to C? What would it take?" (e.g., public agreement—which Lewis notes breaks without preexisting conventions).  

  ---

  ### **Predictable Problems & Limitations**  
  **What Will Go Wrong (First Time)**:  
  1. **Slow Convergence in Stage 1**:  
     - Students may split signals evenly (A/B), delaying convention emergence.  
     - **Fix**: Use public tallies after each interaction to accelerate common knowledge.  

  2. **Over-Adoption of C in Stage 3**:  
     - Enthusiastic students may spam C, causing chaos (low scores).  
     - **Fix**: Emphasize payoff risks ("If you choose C alone, you get 0").  

  3. **Newcomer Resistance in Stage 2**:  
     - Observers might ignore the convention and signal randomly.  
     - **Fix**: Ask observers during rotation: "What signal do you expect to see?" to prime conformity.  

  4. **Crucial Stage Missteps**:  
     - Students may loudly advocate for C, breaking silence.  
     - **Fix**: Enforce strict no-talking; use index cards for accountability.  

  **What the Game Can’t Replicate (Lewis Nuances)**:  
  - **Deep Common Knowledge**: Lewis’s "recursive" expectations (I know that you know that I know...) are simplified by public tallies. Real conventions rely on subtle social cues.  
  - **Long-Term Evolution**: Conventions like money or language evolve over generations; a 40-minute game can’t capture historical depth.  
  - **Non-Arbitrary Conventions**: Lewis acknowledges some conventions (e.g., driving on the right) have practical roots. The game’s signals are purely arbitrary.  
  - **Payoff Structures**: Real conventions involve complex incentives (social approval, trust). Game points are crude proxies.  

  ---

  ### **Timeline for 75-Minute Session**  
  1. **Intro (5 min)**: Explain rules, signals, and payoffs.  
  2. **Stage 1 (10 min)**: Convention emergence (A/B only).  
  3. **Stage 2 (10 min)**: Rotation + transmission.  
  4. **Stage 3 (5 min)**: Introduce C.  
  5. **Stage 4 (10 min)**: Crucial stage (voting + interaction).  
  6. **Debrief (30 min)**: Lewis concepts, student reflections, limitations.  
  7. **Buffer (5 min)**: For transitions or overruns.  

  This game creates an experiential foundation for Lewis—students *feel* the inertia of conventions before you name the machinery. By embracing the predictable chaos, you’ll turn pitfalls into teachable moments ("Remember when C failed? That’s lock-in!").
