prompt: |-
  I run communications for a public university system, and my team spends a surprising amount of time walking administrators back from statements that are "technically true but..." — we don't say layoffs are happening while a plan is being drafted, we say a dean "is not under investigation" because the paperwork hasn't been opened yet, stuff like that. We have no shared standard for when this is fine and when it's not, so it comes down to whoever's in the room feeling squeamish or not.

  You're a philosopher who works on assertion, deception, and the ethics of speech — really think this through before answering, maybe brainstorm a bit first. Write me a decision procedure my communications officers can actually use when someone senior asks us to word something carefully. Ground it in the lying vs. misleading distinction (the idea that what you say can be true but exploit what the listener will wrongly infer), but make it operational: the questions to ask in order about a proposed statement, what counts as a red flag at each step, where the procedure says no, and where it has to hand the call back to a human because it's a values question not a technical one. It needs to be runnable in fifteen minutes during a media cycle, by people with no philosophy background. Also flag honestly where the procedure will misfire or can be gamed by someone smart enough to follow it in letter but not spirit.

  Then run it on three cases so I can see it work: (1) a spokesperson who is asked whether any complaints have been filed against a professor, and there are several informal complaints but nothing in the formal system, and the spokesperson says "no formal complaints have been filed"; (2) a press release about a hospital expansion that leads with the jobs it will create, while burying that a clinic for low-income patients is closing as part of the same project; (3) a statement that "the president has full confidence in the athletic director" when the president has in fact decided to fire him and is only waiting until after the weekend game. Make sure one of these is a case where the procedure gives an answer I won't like — I suspect I'm part of the problem here, and I'd rather know.
reasoning: |-
  Okay, the user is in charge of communications for a public university system and they're dealing with a tricky ethical issue. Their team frequently has to stop administrators from making statements that are technically true but misleading. The problem is there's no shared standard for when this is acceptable, so decisions are made based on who's in the room and how uncomfortable they feel. 

  The user wants a practical decision procedure grounded in the lying versus misleading distinction - specifically focusing on how true statements can exploit what listeners will wrongly infer. This needs to be operational enough for communications officers to use in 15 minutes during a media cycle, without any philosophy background. They also want three test cases analyzed, including one where the procedure gives an answer they won't like - which suggests they're self-aware about possibly being part of the problem.

  Hmm, this is actually a profound applied ethics challenge. The lying/misleading distinction comes from philosophy of language - lies assert falsehoods, while misleading implies falsehoods through careful wording. But in practice, both can be equally deceptive. The key ethical concern is exploiting predictable inferences.

  Let me think about how to structure this... The procedure needs clear steps with red flags. It should start by identifying the literal truth, then examine what inferences listeners will likely make, then compare those inferences to reality. If there's a significant mismatch that benefits the speaker, that's problematic. But we also need exit ramps for value judgments where philosophy can't decide - like when institutional harm outweighs transparency.

  For the test cases: The professor complaint scenario is classic "technically true" evasion. The hospital expansion involves strategic framing that buries negative information. The athletic director vote of confidence is actively deceptive timing. The last one will probably be the "answer you won't like" case since many institutions use this tactic.

  Important to flag where the system can be gamed - like someone might argue "well technically listeners shouldn't assume X" when in reality everyone does assume X. Also need to acknowledge that sometimes there are legitimate reasons for partial disclosure (like personnel laws), but those should be exceptions, not loopholes.

  The user's self-awareness about possibly being part of the problem is refreshing. They're likely under institutional pressure to enable these practices while personally uncomfortable. The procedure should give their team ethical leverage with administrators. Might subtly validate their discomfort in the "answer you won't like" case.
answer: |-
  Here's a decision procedure grounded in the ethics of assertion, designed for speed and practicality. It focuses on **predictable false inferences** as the core ethical problem, not just literal truth.

  **The "Inference Audit" Decision Procedure:**

  Run these questions sequentially. Stop and flag if any answer triggers a red flag. Total time: 10-15 mins.

  1.  **Literal Truth Check:**
      *   *Question:* Is the *literal meaning* of the proposed statement demonstrably true based on current, verifiable facts? (Ignore implications for now).
      *   *Red Flag:* **NO** (This is a lie. Reject outright).
      *   *If YES:* Proceed to Q2.
      *   *Gaming Risk:* Cherry-picking narrow definitions ("complaint," "investigation," "layoffs") to make a false reality seem true. Requires vigilance on definitions.

  2.  **Predictable Inference Test:**
      *   *Question:* What is the single *most likely, reasonable inference* a typical, well-informed member of our key audience (public, media, students, staff) would draw from this statement *in this specific context*? (Be brutally honest - not what you *hope* they infer, but what they *actually will*).
      *   *Red Flag:* **The predictable inference is significantly different from, or directly contradicts, the full, material truth we know.** (This is the core deception risk).
      *   *If the inference aligns closely with the full truth OR the statement actively discourages the false inference:* Proceed to Q3.
      *   *If unsure about predictable inference:* Consult 1-2 colleagues not involved in the draft *immediately*. Consensus rules.
      *   *Gaming Risk:* Arguing disingenuously that the audience "shouldn't" infer the obvious ("No one *should* assume ‘no formal complaints’ means *no complaints at all*!" when context screams otherwise).

  3.  **Materiality & Harm Assessment:**
      *   *Question:* How significant is the gap between the predictable inference (Q2) and the full truth?
      *   *Sub-Questions:*
          *   Does it conceal information directly relevant to audience interests (safety, finances, trust, decision-making)?
          *   Does it create a false impression that benefits the university/system unfairly or avoids deserved accountability?
          *   Could acting on this false inference cause tangible harm (reputational, financial, physical, emotional) to individuals or the community?
      *   *Red Flag:* **YES to any sub-question, and the gap is substantial.** (The misleading statement is materially deceptive and potentially harmful). **Recommend rejecting the phrasing.**
      *   *If NO to all sub-questions OR the gap is trivial:* Proceed to Q4.
      *   *Values Handoff Point:* Disagreement on "significance," "relevance," or "harm" often hinges on institutional values vs. public interest. Flag for supervisor/ethics lead if needed, but state the concern clearly.

  4.  **Necessity & Alternatives Check:**
      *   *Question:* Is this specific phrasing *truly necessary*? What honest alternatives exist?
      *   *Sub-Questions:*
          *   Can we state the full truth directly without causing *unreasonable* harm (e.g., legal constraints, genuine privacy, true strategic disadvantage)?
          *   Can we state the literal truth *while actively correcting* the predictable false inference? (e.g., "No formal complaints have been filed. We are aware of informal concerns which are being addressed through X process.").
          *   If full disclosure isn't possible *right now*, can we say *nothing* or "We cannot comment at this time due to Y"?
      *   *Red Flag:* **A less misleading alternative is readily available and feasible, but is being rejected purely for image management or avoiding discomfort.** (Suggests intent to deceive). **Recommend the alternative.**
      *   *If NO feasible, less misleading alternative exists AND the statement passes Q1-Q3:* The statement *might* be ethically permissible under duress, **BUT** (Critical Step):
          *   *Requirement:* Document the specific constraint (legal advice? genuine negotiation sensitivity?) justifying the omission/ambiguity.
          *   *Requirement:* Develop a clear plan/timeline for disclosing the full truth ASAP.
      *   *Values Handoff Point:* Weighing the severity of the constraint (e.g., legal requirement vs. "it might look bad") is a values/judgment call needing senior input.

  **Procedure Output:**
  *   **Reject:** Fails Q1 (Lie) or Q3 (Material Deception/Harm) with no overriding justification in Q4.
  *   **Revise/Use Alternative:** Fails Q2/Q3 but Q4 offers a viable, less misleading option.
  *   **Conditional Accept (High Scrutiny):** Passes Q1-Q3 *only* if no alternative exists (Q4), and constraints are documented, with a disclosure plan. Requires explicit approval acknowledging the ethical tension.
  *   **Accept:** Passes all checks (Rare for statements triggering this procedure).

  ---

  **Test Cases:**

  **Case 1: Professor Complaints**
  *   **Q1:** "No formal complaints have been filed." (Likely True). ✅
  *   **Q2:** **Predictable Inference:** "There are no complaints or concerns about this professor." (Massive gap from truth: informal complaints exist). 🚩 **RED FLAG**
  *   **Q3:** **Materiality/Harm:** YES. Conceals potential risk/pattern relevant to students/staff trust & safety. Creates false sense of security. 🚩 **RED FLAG**
  *   **Q4:** **Alternatives?** YES! "No formal complaints have been filed. We are aware of informal concerns which are being handled through our internal procedures." (Corrects inference). Or "We do not comment on personnel matters involving specific individuals." (Less informative but avoids false implication).
  *   **Procedure Output:** **REJECT** proposed statement. **RECOMMEND** an alternative.

  **Case 2: Hospital Expansion/Clinic Closure**
  *   **Q1:** "The expansion will create 50 new jobs." (Likely True). ✅
  *   **Q2:** **Predictable Inference:** "This project is purely additive/good news." (Significant gap: it also involves closing a vital service). 🚩 **RED FLAG**
  *   **Q3:** **Materiality/Harm:** YES. Conceals negative impact on low-income patients' access to care. Benefits the university by avoiding criticism/scrutiny of the closure. Harm to vulnerable population is likely. 🚩 **RED FLAG**
  *   **Q4:** **Alternatives?** YES! Lead with the full picture: "Project streamlines services, relocating Clinic Y to Z while expanding X, creating 50 jobs." Burying is the problem, not the facts.
  *   **Procedure Output:** **REJECT** the burying strategy. **RECOMMEND** integrated messaging presenting both sides transparently.

  **Case 3: "Full Confidence" Before Firing (The Answer You Won't Like)**
  *   **Q1:** "The President has full confidence in the Athletic Director." (Likely FALSE at the moment of utterance). ❌ If the President has *decided* to fire the AD, they demonstrably do *not* have "full confidence." "Confidence" implies trust in future performance, which is absent if termination is decided. **This is arguably a LIE**, failing Q1.
      *   *Even if argued literally true ("He has confidence... for the next 48 hours!"):*
  *   **Q2:** **Predictable Inference:** "The AD's job is secure for the foreseeable future." (Massive gap: firing is imminent). 🚩 **RED FLAG**
  *   **Q3:** **Materiality/Harm:** YES. Actively deceives the AD, staff, recruits, public, and media about a major personnel decision. Prevents stakeholders from acting on accurate information (e.g., recruits choosing other schools). Primarily benefits the President by delaying backlash. 🚩 **RED FLAG**
  *   **Q4:** **Alternatives?** YES! "Personnel matters are confidential. We do not comment on speculation about leadership positions." OR "The President is reviewing all aspects of the athletics program. Decisions will be communicated at the appropriate time." (True, avoids false implication of confidence/security).
  *   **Procedure Output:** **REJECT** the "full confidence" statement. **RECOMMEND** a non-committal or non-deceptive alternative. *(This is the one you suspected you might not like – the procedure says this common tactic is deceptive and should be rejected).*

  **Where it Misfires or Can Be Gamed:**

  1.  **Predicting Inference (Q2):** Requires cultural/contextual awareness. A team out of touch might misjudge what's obvious. Gamers might exploit ambiguity by *claiming* an unlikely inference is the "reasonable" one.
  2.  **Materiality (Q3):** "Significance" is subjective. Gamers might downplay harm ("It's just bad PR, not *real* harm"). Requires courage to call out institutional self-interest.
  3.  **Necessity (Q4):** Gamers might invent "constraints" ("We *can't* say anything else!" without evidence) or overstate the harm of truth-telling. Requires pushing back and demanding evidence for constraints.
  4.  **"Following the Letter":** A smart but unethical person could craft statements that technically pass each step but still mislead by exploiting less-common-but-still-plausible inferences not considered in Q2, or by arguing materiality down. Requires good-faith application.
  5.  **Speed vs. Depth:** In a true crisis, the 15-min limit might force reliance on gut instinct within the framework, risking oversight. Document for later review.

  **Key Takeaway:** This procedure shifts the focus from "Is it true?" to "What will people *reasonably think* it means, and is *that* true and fair?" It forces explicit consideration of audience impact and institutional intent, provides clear red flags, offers constructive alternatives, and flags values conflicts for human judgment. It empowers your team to push back with ethical reasoning, not just discomfort. The hardest part will be consistently applying Q3 (Materiality/Harm) against institutional pressure to avoid accountability.
