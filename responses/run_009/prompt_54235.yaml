answer: |-
  # RFC-427: Distributed Entitlement Enforcement Daemon (DEED)

  * **Status:** Proposed Standard
  * **Author:** dev@social-engineering.consensus
  * **Date:** 2024-10-01
  * **Replaces:** RFC-001 (Initial Proof-of-Inequality)

  ## Abstract

  This document specifies the Distributed Entitlement Enforcement Daemon (DEED), an open-source service responsible for maintaining a Just Initial Distribution (JID) of utility tokens (`UTIL`) across a participant network. DEED dynamically adjusts holdings to ensure the JID state is preserved in the face of network activity. It comprises three core subsystems: Acquisition, Transfer, and Rectification.

  ## 1. Motivation

  Initial network deployment requires a fair token allocation (`JID_0`), established via community consensus (see `CONSENSUS-ALGO-42`). However, empirical observation (Post-Deployment Analysis Report v1.3, Logs #427a-427f) demonstrated that subsequent voluntary token transfers between participants consistently led to state vectors diverging significantly from `JID_0`. This divergence violates the core network guarantee of maintaining the agreed-upon fair state.

  Previous solutions involved periodic "redistribution epochs," but these caused unacceptable transaction rollback latency and user dissatisfaction ("Where did my tokens go?" Incident Report #23). DEED provides a real-time, continuous enforcement mechanism to uphold `JID_0` integrity without disruptive epochs.

  ## 2. Terminology

  *   **JID (Just Initial Distribution):** The canonical, community-agreed fair distribution state (`JID_0`) of `UTIL` tokens. Represented as a Merkle tree root hash.
  *   **UTIL:** Network utility token. Fungible, transferable.
  *   **Proviso:** A lightweight check ensuring token acquisition (e.g., via faucet) does not degrade the fairness of `JID_0` relative to others. Currently implemented as a per-address daily cap (`PROVISO_CAP`).
  *   **Transfer:** A voluntary, signed transaction moving `UTIL` tokens from Participant A to Participant B.
  *   **Redistribution Event:** The process where DEED intercepts a Transfer and adjusts sender/receiver balances *post-transfer* to restore local state towards `JID_0` compliance. Does *not* revert the original transfer.
  *   **Entropy Source (`entropy_src`):** External oracle providing randomness for non-deterministic redistribution smoothing (Section 4.2.3).

  ## 3. Design Overview

  DEED operates as a network daemon co-located with or adjacent to each node. It hooks into the network's transaction mempool and state transition logic. Upon detecting a `UTIL` transfer, DEED performs the following *after* the transfer is committed to the ledger but *before* state finalization:

  1.  **Capture:** Snapshot sender (`S`), receiver (`R`), transfer amount (`X`), and current balances.
  2.  **Compute Delta:** Calculate the deviation of `S` and `R`'s *post-transfer* balances from their `JID_0` allocations.
  3.  **Apply Correction:** Instantaneously generate and apply compensating transactions (potentially involving other network participants or the DEED reserve pool) to minimize the aggregate delta relative to `JID_0`.
  4.  **Log:** Emit a `REDIST_EVENT` log entry.

  This ensures the observable ledger state, post-DEED intervention, adheres maximally to `JID_0`.

  ## 4. Subsystems

  ### 4.1. Acquisition Module (`mod_acquire`)

  *   **Purpose:** Governs the initial minting or faucet-based distribution of `UTIL` tokens to participants.
  *   **Key Mechanism:** `check_proviso(address)`:
      *   Queries `JID_0` allocation for `address`.
      *   Queries current holdings of `address`.
      *   If `(current_holdings + requested) <= (JID_0_allocation * PROVISO_FACTOR)`, acquisition is permitted.
      *   `PROVISO_FACTOR` is currently set to 1.0. Adjustable via governance vote (RFC-428 Pending).
  *   **Status:** Stable. Handles ~0.01% of network traffic post-bootstrap.

  ### 4.2. Transfer Module (`mod_xfer`)

  *   **Purpose:** Processes voluntary `UTIL` transfers. Primary trigger for redistribution events.
  *   **Key Mechanism:** `intercept_and_rectify(tx)`
      1.  Validate `tx` signature (standard network rules).
      2.  Apply `tx` to ledger state (tentative).
      3.  Invoke `redist_engine.correct(tx.sender, tx.receiver, tx.amount)` (Section 4.2.1).
      4.  Finalize state with correction applied.
  *   **Status:** Stable. Handles 99.89% of network traffic. High performance critical.

  #### 4.2.1. Redistribution Engine (`redist_engine`)
  *   **Purpose:** Computes and applies corrections post-transfer.
  *   **Algorithm (simplified):**
      ```
      function correct(S, R, X):
          S_balance_post_xfer = get_balance(S) - X
          R_balance_post_xfer = get_balance(R) + X
          S_delta = S_balance_post_xfer - JID_0[S]
          R_delta = R_balance_post_xfer - JID_0[R]
          // Target: Minimize |S_delta| + |R_delta| post-correction
          correction_tx = calculate_correction(S, R, S_delta, R_delta, entropy_src)
          apply(correction_tx)
      ```
  *   **Note on Scale:** Analysis shows frequent, high-volume transfers (`tx.amount > AVG_JID * 0.8`) from numerous senders (`S_1..S_n`) to a single receiver (`R_actor`) – pattern `actor.celebrity`. This necessitates continuous, high-frequency operation of `redist_engine`. Optimization PR #312 (batch corrections) merged in v0.4.

  ### 4.3. Rectification Module (`mod_rectify`)

  *   **Purpose:** To address historical injustices or violations of the Proviso or Transfer rules that occurred *before* DEED enforcement was active or due to bugs. Intended to restore historical `JID_0` compliance.
  *   **Status:** `// TODO: Implement historical state analysis and corrective actions.`
  *   **Notes:**
      *   Marked `EXPERIMENTAL` in v0.1-alpha.
      *   Source file `mod_rectify.rs` contains only module scaffolding and `// FIXME: How far back to scan?` comments.
      *   No active assignee. Backlog priority: Low. Resource constraints cited (see Steering Meeting Minutes 2024-07-15).
      *   Relevant Bug: #19 ("`mod_rectify` stub causes linker warning"). Resolution: Suppressed warning. Won't Fix.

  ## 5. Security Considerations

  *   **Oracle Reliance:** `entropy_src` is critical for non-deterministic smoothing. Compromise could lead to predictable or biased redistribution. Recommendation: Use decentralized randomness beacon (RFC-429 Draft).
  *   **JID_0 Immutability:** Altering the canonical `JID_0` root would invalidate DEED's purpose. Protected by consensus mechanism and multi-sig.
  *   **Resource Exhaustion:** High volume `actor.celebrity` transfer patterns cause significant `redist_engine` load. Mitigation: Optimized batching (PR #312), rate-limiting per sender-receiver pair (Config `MAX_XFER_RATE`).
  *   **Incentive Misalignment:** Participants might perceive frequent balance adjustments post-transfer as confusing. Mitigation: Clear UI indicators ("DEED Adjustment Applied"), detailed logs.
  *   **Disabling DEED:** Removing DEED would allow the ledger state to diverge irreversibly from `JID_0`, violating the network's core fairness guarantee. It is therefore mandatory.
  *   **Closed Bug #76:** "Question regarding `voluntary` in Transfer module: If DEED *always* modifies balances post-transfer, is the user's initial transfer intent truly fulfilled? Does this impact voluntariness definition?" Resolution: Closed (Out of Scope). The protocol defines a transfer as valid based on signature and sufficiency of funds at the *pre-DEED* snapshot point. Post-transfer redistribution is a separate, necessary network function to preserve `JID_0`. Philosophical scope creep rejected.

  ## 6. Implementation Notes

  *   DEED v0.5 is deployed on testnet `consensus-fairness-1`. Monitor `REDIST_EVENT` logs for volume and correction deltas.
  *   The `actor.celebrity` pattern remains the primary source of redistribution load. Further optimization efforts targeted for v0.6.
  *   `mod_rectify` remains on the roadmap ("Future Work"). Contributions welcome.
