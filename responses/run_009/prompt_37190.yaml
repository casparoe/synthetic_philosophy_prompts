prompt: |-
  Before my city council takes up another fight over a contested Confederate-era monument, I want the terms of evaluation settled in advance, not improvised hearing by hearing. So: write the desiderata a theory of commemoration ethics must meet before I'll take it seriously -- the cases it has to get right, the distinctions it can't collapse, and the facts about how statues, street names, and holidays actually work that it can't contradict -- with the motivating consideration behind each requirement, and an indication of which requirements you take to be non-negotiable and which are camp prejudices dressed up as constraints.

  The purpose the theory must be good enough for: giving a principled decision procedure to a municipal body that must render verdicts on contested commemorations -- keep, remove, relocate, recontextualize, or replace -- under real political constraints, not adjudicating a seminar dispute. So the requirements should be ones that a mayor could actually act on, and a requirement that can't be operationalized at all deserves a flag saying so.

  At minimum, I want the theory to confront the following, though you should add, subtract, or sharpen as the list itself demands. First, the distinction between honoring a person and merely recording that they existed: a statue in a public square plausibly performs a commendatory speech act on behalf of the current community, while a plaque or a museum exhibit records without commending -- and the theory must say whether this distinction can do the work it is usually asked to do, given that defenders of contested monuments routinely claim the commemorative function is really documentary. Second, the temporal problem: what a monument says is indexed to the values of whoever currently maintains it, so a statue erected under one moral regime makes an assertion under another -- the theory must say whether the original intention of the honorees' contemporaries has any standing at all, and if not, what becomes of the charge that we are "rewriting history." Third, the no-clean-hands threshold: if no historical figure clears modern scrutiny, the theory needs a principled cutoff between the Lincoln-with-flaws case and the dedicated-white-supremacist case, not just an intuition. Fourth, the heterogeneity of commemorative media: a street name is embedded in wayfinding infrastructure, contracts, and people's home addresses; a statue in a park is not -- removal costs and side effects differ in kind, and a theory that treats all commemoration alike should explain why we tolerate it. Fifth, the countermonument possibility: Hamburg's disappearing column against fascism and similar works suggest commemoration can be performative and self-undermining rather than laudatory -- the theory must accommodate or rule out honoring through negation. Sixth, the standing question: whose objection counts, and does it matter whether the wronged group's descendants are the ones being asked to live under the honorific? And seventh, the act of removal itself: dismantling is also a public act with meanings, including the meanings it will be given by bad actors -- should a theory of adequate commemoration ethics weigh a monument's afterlife as a rallying point, or is that a prudential consideration that has no place in the theory proper?

  Where I most want your judgment is on joint satisfiability. I suspect, for instance, that a requirement the theory not honor the dishonorable, a requirement that it preserve public historical memory in situ, and a requirement that it not distort the monument's original meaning through recontextualizing plaques may not be satisfiable together -- and if so, that is a result about the list, not a failure of it. Say which pairs you think are in tension, and which single requirement, if enforced, does the most to decide the familiar debates before any scoring happens. Then, briefly, hold the standard up against the three positions that dominate public argument -- keep-and-contextualize, remove-and-relocate-to-museum, and remove-and-replace-with a countercommemoration -- and tell me which of them survives your own list, and where it survives only by quietly downgrading a requirement you marked non-negotiable.
reasoning: |-
  Okay, the user is asking for a framework to evaluate contested Confederate monuments. They want a set of principles that a city council can use to make decisions, not just academic debate. Let me start by understanding their main concerns.

  First, they mentioned the distinction between honoring and documenting. Defenders often claim monuments are just historical records. I need to address how a theory differentiates between a statue in a public square versus a museum exhibit. The key point here is public endorsement versus neutral documentation.

  Next, the temporal problem. Monuments from the past carry different meanings today. How does the theory handle the original intent versus current interpretation? The "rewriting history" charge needs a response. This ties into whether the community's current values should override past intentions.

  The no-clean-hands threshold is tricky. Every historical figure has flaws. The theory must distinguish between minor flaws and egregious actions. Maybe a cutoff based on core legacy versus peripheral actions. Slavery and white supremacy as central to identity versus other outdated views.

  Heterogeneity of media: street names are functional, statues are symbolic. Removal costs differ. The theory should recognize these practical differences. Ignoring this could lead to unworkable policies.

  Countermonuments challenge traditional honor. Can a monument that undermines itself be valid? The theory needs to accommodate self-critical commemoration or reject it clearly.

  Standing: whose objections matter? Descendants of wronged groups have a stronger claim. But how to operationalize that without excluding others? Maybe prioritizing affected communities.

  Removal as a public act: its impact, including how bad actors might co-opt it. Should the theory consider this, or is it outside ethics? Probably include it as part of the decision's consequences.

  Now, joint satisfiability. The user suspects conflicts between not honoring dishonorable, preserving memory in situ, and not distorting original meaning. These three can't all be satisfied. For example, keeping a statue with added context might distort the original intent but tries to preserve memory. Removing it loses the in-situ aspect. The non-negotiable is not honoring the dishonorable. That alone can decide many debates.

  Evaluating the three positions: Keep-and-contextualize might fail if the original honorific intent can't be negated by a plaque. Remove-and-relocate turns it into documentation, which is acceptable. Remove-and-replace with countermonuments honors victims but must be clear to avoid confusion. Each has trade-offs, especially around preserving in-situ memory and not distorting meaning.

  I need to ensure the requirements are actionable for a city council. Non-negotiable ones like not honoring dishonorable must be clear. Practical constraints like removal costs should be acknowledged but not override ethics. The user wants a practical tool, so balancing principles with feasibility is key.
answer: |-
  Here is a set of desiderata for a theory of commemoration ethics, designed for municipal decision-making under political constraints. Requirements are categorized as **Non-Negotiable (NN)** (essential for legitimacy), **Operational Priority (OP)** (critical for feasibility), or **Contested but Relevant (CR)** (common intuitions needing rigorous defense). Tensions and joint satisfiability issues are flagged.

  ---

  ### **Desiderata for a Commemoration Ethics Theory**

  1.  **Honor vs. Documentation Distinction (NN):**  
      *The theory must differentiate between* **commendation** *(a statue in a public square performing a speech act of communal endorsement) and* **documentation** *(a museum plaque neutrally recording facts).*  
      **Motivation:** Defenders often disingenuously claim contested monuments are "just history." Public space inherently implies communal sanction; museums are spaces for critical reflection. A theory that collapses this distinction licenses deception.  
      **Operationalization:** Define criteria for "commendatory intent" (e.g., location, iconography, historical erection context). If the primary *effect* in current context is perceived endorsement, it qualifies as honorific.

  2.  **Temporal Meaning Shift (NN):**  
      *The theory must acknowledge that a monument’s meaning is* **co-created by the maintaining community** *in its present moral/political context, not fixed at erection.*  
      **Motivation:** The "rewriting history" charge is a category error. Monuments aren't history books; they are assertions of *current* communal values. Original intent is context, not binding authority.  
      **Operationalization:** Assess the monument’s *contemporary* perceived message and communal impact. Original intent is evidence, not a veto.

  3.  **The No-Clean-Hands Threshold (OP):**  
      *The theory must provide a* **principled cutoff** *between flawed figures whose core legacy warrants contextualized commemoration and figures whose* **central historical identity or actions are irredeemably antithetical to fundamental modern values** *(e.g., foundational commitment to slavery, genocide, or systemic oppression).*  
      **Motivation:** Without this, all commemoration collapses into nihilism ("everyone was problematic") or hypocrisy ("only our heroes get passes").  
      **Operationalization:** Focus on **core legacy vs. peripheral flaws** and **contemporary irreconcilability**. Ask: Was the dishonorable act/commitment (a) central to their historical significance, and (b) fundamentally incompatible with core modern constitutional/ethical commitments (e.g., equality under law)? If yes, commemoration as honor is impermissible. *Example:* Lincoln (flaws on race peripheral to core legacy of union/preserving democracy) vs. Confederate General (core legacy *is* armed defense of slavery).

  4.  **Heterogeneity of Commemorative Media (OP):**  
      *The theory must recognize* **differential impacts and costs** *across commemoration types (statues, street names, holidays).*  
      **Motivation:** Ignoring practical realities leads to unworkable policies. Street names are embedded in infrastructure/identity; removal is logistically complex. Statues are symbolic focal points; removal is primarily political/cultural. Holidays are temporal, not spatial.  
      **Operationalization:** Require impact assessments: logistical burden, disruption, functional vs. symbolic role, cost. A theory demanding identical treatment for all media is impractical and deserves skepticism.

  5.  **Countermonument Validity (CR):**  
      *The theory must* **explicitly accommodate or reject** *the legitimacy of performative, self-negating, or critical commemorations ("countermonuments") as valid forms of public honor.*  
      **Motivation:** Works like Hamburg's disappearing pillar challenge the assumption that commemoration must be laudatory. Are they honoring victims *through* critique?  
      **Operationalization:** Define "honor" broadly enough to include critical remembrance *if* it clearly centers the victims/values *affirmatively*. Must avoid ambiguity that could be co-opted. Requires clear communicative intent.

  6.  **Standing of the Wronged (NN):**  
      *The theory must grant* **primary standing to objections from descendant communities of groups directly targeted or oppressed by the honoree or the system they represent**, *especially when the commemoration occurs within spaces they inhabit.*  
      **Motivation:** Ethical commemoration cannot demand that those whose ancestors were enslaved or subjugated endure daily honorifics to their oppressors. Their experience is uniquely constitutive of the harm.  
      **Operationalization:** Prioritize consultation and impact assessments focused on these communities. Their sustained objection creates a strong presumption for removal/change. General public opinion is secondary.

  7.  **Removal as Meaningful Act & Monument Afterlife (OP):**  
      *The theory must* **account for the practical consequences and symbolic meanings of removal/alteration**, *including how the act and the monument’s remnants might be weaponized.*  
      **Motivation:** Ignoring real-world effects is irresponsible for a municipal body. Removal is never neutral; it sends a message and can fuel backlash narratives.  
      **Operationalization:** Weigh the *net reduction in harm*. Consider destination (museum vs. landfill), potential for co-option, and public safety. This is **prudential but essential** for feasible ethics under constraint. A theory demanding removal regardless of consequence is naive.

  ---

  ### **Joint Satisfiability & Key Tensions**

  *   **Major Unsatisfiable Triad:**
      *   **Requirement A (NN):** Do not honor the dishonorable (per Threshold #3).
      *   **Requirement B (CR/OP):** Preserve public historical memory *in situ* (often demanded by "contextualize" advocates).
      *   **Requirement C (NN/CR):** Do not distort the monument's original meaning through recontextualization.
      **Tension:** If a figure is deemed "dishonorable" (A), keeping them *in situ* (B) inherently maintains a site of perceived honor (violating A). Adding a plaque (attempting B) either:
      *   Minimizes the dishonor (distorting original intent - violating C), or
      *   So thoroughly condemns it that the site becomes a monument *to shame* rather than honor (potentially satisfying A & C, but arguably violating B's intent to preserve the *original object's* historical presence neutrally). **Result:** You cannot simultaneously satisfy A, B, and C. A (Non-Honor) is non-negotiable; B (In-Situ Preservation) is the weakest link and often a disguised preference.

  *   **Most Decisive Single Requirement:** **The No-Clean-Hands Threshold (#3)**. Rigorously defining the cutoff between flawed and irredeemable figures pre-resolves the status of most Confederate figures *and* dictates the permissibility of honoring them *in public space*. If the core legacy is fundamentally antithetical (e.g., armed treason for slavery), honorific commemoration is ethically impermissible regardless of other arguments. This alone decides the core debate for many contested figures.

  *   **Other Key Tensions:**
      *   **Standing (#6) vs. Removal Consequences (#7):** Prioritizing the wronged group's demand for removal may conflict with the prudential need to avoid violent backlash or political gridlock. **Resolution:** Standing creates a *presumption*; prudent implementation manages consequences, but doesn't negate the ethical imperative.
      *   **Countermonuments (#5) vs. Clarity of Meaning (implied by #1 & #2):** Can a complex, self-critical monument reliably communicate affirmative honor to victims without ambiguity or co-option? **Resolution:** High bar for clarity required; ambiguity risks failure as commemoration.

  ---

  ### **Evaluation of Dominant Positions Against Desiderata**

  1.  **Keep-and-Contextualize:**
      *   **Fails Core Test:** Struggles catastrophically with the **Honor vs. Documentation Distinction (#1)** and **Temporal Meaning Shift (#2)**. A plaque cannot reliably negate the inherent honorific speech act of a towering equestrian statue in a public square. Original intent (#2 context) overwhelms the add-on. It often violates the **No-Clean-Hands Threshold (#3)** by keeping the dishonorable honored *in situ*. Meets **Heterogeneity (#4)** only by avoiding removal costs.
      *   **Survival Strategy:** Quietly downgrades **#1 (Honor/Doc Distinction)** to irrelevance and ignores **#6 (Standing of Wronged)** by prioritizing abstract "history" over lived experience. Relies heavily on the contested (and often unsatisfiable) desire for **In-Situ Preservation (B above)**.

  2.  **Remove-and-Relocate-to-Museum:**
      *   **Best Fit:** Directly addresses **Honor vs. Documentation (#1)** by changing the context to documentary/non-commendatory. Satisfies **No-Clean-Hands (#3)** by removing public honor. Respects **Standing (#6)** by removing the affront. Pragmatically handles **Heterogeneity (#4)** (statues are movable, unlike streets). Acknowledges **Temporal Meaning (#2)** by changing the maintaining context.
      *   **Challenges:** Must carefully manage **Removal Consequences (#7)**. May struggle with **Countermonuments (#5)** if seen as insufficiently affirmative. Does not inherently provide new affirmative commemoration.

  3.  **Remove-and-Replace-with-Countercommemoration:**
      *   **Potential Fit:** Can satisfy **No-Clean-Hands (#3)** (remove dishonorable), **Standing (#6)** (affirm wronged), and **Temporal Meaning (#2)** (assert current values). Embraces **Countermonument Possibility (#5)**.
      *   **Major Risks:** High potential for **failure in operationalization**. Can violate **Clarity of Meaning** (implied by #1 & #2) if the "counter" aspect is ambiguous or fails to communicate affirmative honor effectively. May be seen as distorting the original site's history (tension with C). Logistical costs (**#4**) can be high. **Removal Consequences (#7)** are still present, plus risks of the new monument being divisive or misunderstood.

  **Survivor:** **Remove-and-Relocate-to-Museum** most consistently satisfies the core non-negotiable requirements (#1, #2, #3, #6) with the fewest operational contradictions. It directly resolves the honor/documentation problem and the dishonorability threshold. **Remove-and-Replace** *can* survive but only if the replacement is unambiguous, effective, and affirmatively honors victims/values without significant new harms – a high bar often unmet in practice. **Keep-and-Contextualize** survives only by systematically downgrading non-negotiable requirements, making it ethically inadequate under this framework.

  This framework provides a principled yet actionable path. It forces confrontation with the core ethical impossibility of publicly honoring figures whose central legacy is fundamentally dishonorable under modern values, while acknowledging practical constraints and the necessity of centering the voices of the wronged. The decision procedure becomes: 1) Apply Threshold (#3) rigorously. 2) If dishonorable, removal from public honorific space is presumptive. 3) Choose destination (museum, countermonument) based on feasibility, cost, communication clarity, and net harm reduction.
