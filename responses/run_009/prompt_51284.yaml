prompt: |-
  A friend and I spent most of last evening arguing about what actually makes something alive, and rather than keep trading slogans I want to work out what my own verdicts commit me to. Going by gut: viruses are alive. A frozen embryo and a desiccated tardigrade in its dormant state are both alive, even though neither has any ongoing metabolism. Mules and sterile worker ants are obviously alive even though they cannot reproduce themselves. A self-reproducing computer program of the sort von Neumann described is not alive, and neither is a crystal growing in a supersaturated solution, even though both copy themselves in some sense. Prions are not alive. The case I keep going back and forth on is a laboratory protocell: a lipid vesicle enclosing RNA that replicates and mutates under its own catalysis, feeding on free nucleotides from the surroundings. Is there a single principle here — metabolic, evolutionary, autopoietic, or something else — that captures all or nearly all of these verdicts? If the best principle forces me to abandon one of them, tell me which one should go and why, and then say what the repaired principle predicts about a further case I haven't listed, such as a synthetic cell with a minimal genome that can replicate and evolve but does almost nothing metabolically beyond copying its DNA. My friend, for what it's worth, thinks my virus verdict and my frozen-embryo verdict are already in tension, since I seem to be demanding neither metabolism nor reproduction; I'd like to know whether he's right. Please answer in British English.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a debate with a friend about what defines life, and they want a consistent principle that aligns with their intuitions. Their gut feelings are that viruses, frozen embryos, and dormant tardigrades are alive, while self-replicating programs and crystals aren't. They also mention sterile mules and worker ants as alive despite not reproducing. The tricky case is the lab protocell with replicating RNA. 

  First, I need to identify their core intuitions. They accept entities without metabolism (frozen embryos) and without reproduction (mules) as alive. But they draw the line at computer programs and crystals. That suggests they value something beyond just replication—maybe evolution or information processing? 

  The friend points out a tension between viruses and frozen embryos: both lack metabolism, but the user considers both alive. The user wants to know if that's inconsistent. Not necessarily. Viruses and embryos both carry genetic information essential for life processes when active. The frozen state is a pause, not cessation. 

  For a unifying principle, evolutionary potential seems promising. Life involves systems capable of Darwinian evolution. That covers viruses (mutate and evolve), embryos (can develop), tardigrades (resume metabolism), and sterile organisms (part of a reproducing lineage). It excludes programs and crystals—they replicate but don't evolve adaptively without external programming. 

  The protocell is borderline. If its RNA mutates and evolves autonomously, it might qualify. But if it just replicates without heritable variation, it’s more like a crystal. The user’s minimal synthetic cell with a minimal genome likely fits if it evolves. 

  The tension the friend sees isn’t real. Viruses and embryos both have evolutionary trajectories, just interrupted. Metabolism isn’t essential if the system retains evolutionary potential. 

  So the refined principle: Life requires a self-sustaining chemical system capable of Darwinian evolution. This keeps most verdicts but might challenge the protocell if it doesn’t evolve. The synthetic cell would be alive if it evolves, even with minimal metabolism. 

  The user’s underlying need is a robust definition that feels intuitive yet scientifically sound. They might also want to win that argument with their friend!
answer: |-
  Right, let's break this down properly. Your gut verdicts reveal a fascinating pattern, and your friend's challenge is worth addressing head-on. The core tension you've identified—accepting both viruses and frozen embryos as "alive" while rejecting self-replicating crystals and computer programs—points towards **evolutionary potential** as the unifying principle that best captures your intuitions, with one slight casualty.

  Here's the principle refined from your commitments:

  **A system is alive if it is a bounded, self-sustaining chemical system possessing an inherited molecular code (e.g., nucleic acids) capable of undergoing Darwinian evolution (variation, inheritance, selection) within its environmental context, even if that potential is temporarily suspended.**

  Now, let's test it against your cases and see where it fits and where it forces a concession:

  1.  **Viruses:** **Alive** by your principle. They possess nucleic acid genomes encoding their structure/function. They mutate, are subject to natural selection, and evolve demonstrably (e.g., flu strains, COVID variants). Their "boundedness" is the capsid/envelope, and their "self-sustaining" aspect is hijacking host metabolism to replicate their molecular code. *Captures your verdict.*
  2.  **Frozen Embryo:** **Alive** by your principle. It's a bounded (cell membrane), chemical system (cells) possessing an inherited molecular code (DNA). Its potential for Darwinian evolution (development, reproduction, passing on genes) is intact but *suspended* by freezing. Metabolism is halted, but the essential code and potential remain. *Captures your verdict.*
  3.  **Desiccated Tardigrade:** **Alive** by your principle. Same rationale as the embryo: bounded chemical system (cells) with DNA. Its potential for metabolism, reproduction, and evolution is cryptobiotically suspended. *Captures your verdict.*
  4.  **Mules / Sterile Worker Ants:** **Alive** by your principle. They are bounded chemical systems (multicellular organisms) with inherited molecular code (DNA). While *they* cannot reproduce, they are *products* of Darwinian evolution and integral parts of evolving lineages (horses/donkeys, ant colonies). Their cells function metabolically and carry evolutionary information. *Captures your verdict.*
  5.  **Self-Reproducing Computer Program:** **Not alive** by your principle. While it replicates and may even have variation (mutations), it lacks:
      *   **Chemical Basis:** It's abstract information, not a chemical system.
      *   **True Darwinian Evolution (in a biological sense):** Its "evolution" is driven by external programming and selection criteria. It doesn't autonomously adapt based on inherent chemical properties interacting with a natural environment.
      *   **Inherited Molecular Code:** It uses digital code, not a replicable chemical polymer like DNA/RNA. *Captures your verdict.*
  6.  **Growing Crystal:** **Not alive** by your principle. It replicates structure but lacks:
      *   **Inherited Molecular Code:** No information storage beyond the immediate crystal lattice. Defects aren't inherited information.
      *   **Darwinian Evolution:** Replication is passive, driven purely by physics/chemistry. No variation subject to selection leading to adaptation. *Captures your verdict.*
  7.  **Prions:** **Not alive** by your principle. They are misfolded proteins that catalyze conformational change in other proteins. They lack:
      *   **Inherited Molecular Code:** No nucleic acid genome. Information transfer is purely structural templating, not coded instructions.
      *   **Capacity for Darwinian Evolution:** While different prion strains exist and can be "selected" experimentally, they lack mechanisms for generating heritable *informational* variation beyond the conformational state itself. They are more akin to pathogenic catalysts than evolving entities. *Captures your verdict.*
  8.  **Laboratory Protocell (RNA vesicle):** **Alive** by your principle *if* the RNA truly replicates and mutates *under its own catalysis* and feeds autonomously. It's a bounded chemical system (lipid vesicle) possessing an inherited molecular code (RNA) demonstrably capable of Darwinian evolution (variation via mutation, inheritance via replication, selection for faster/better replicators). *Captures your likely verdict.* If the replication relies heavily on external catalysts not part of the system, it becomes borderline.

  **Addressing Your Friend's Point:**

  Your friend sees tension between viruses (alive, no metabolism) and frozen embryos (alive, no metabolism). They argue: if neither needs metabolism, what's the difference? **They're right that metabolism isn't the key differentiator for you.** The principle above resolves the apparent tension:

  *   Both viruses and frozen embryos **possess an inherited molecular code** (DNA/RNA).
  *   Both **have the inherent potential for Darwinian evolution**. The embryo's potential is suspended; the virus's potential is realised only inside a host cell. Neither is *currently* metabolising, but both *require* metabolic processes (their own or a host's) to *realise* their evolutionary potential. The *capacity* is chemically encoded within them.

  **The Casuality: The Minimal Synthetic Cell**

  The principle forces a slight concession regarding your "further case":

  *   **Synthetic Cell with Minimal Genome (Replicates, Evolves, Minimal Metabolism):** **Alive** by the principle above. It meets all criteria: bounded chemical system (artificial membrane/cell), inherited molecular code (minimal DNA), demonstrably capable of Darwinian evolution (it replicates, mutations occur, selection can act). Its minimal metabolism, focused only on DNA copying, is *sufficient* to sustain the system and enable evolution. This aligns with your acceptance of viruses that also rely on minimal/hijacked metabolism.

  **Why Evolutionary Potential Works Best for You:**

  1.  **Resolves Metabolism Absence:** Accepts dormant states and viruses where metabolism is absent/suspended/hijacked, focusing on the *potential* encoded chemically.
  2.  **Resolves Reproduction Absence:** Accepts sterile organisms as part of evolving lineages and dormant states where reproduction is paused.
  3.  **Excludes Non-Chemical Replicators:** Draws a line at crystals and computer programs by demanding a *chemical* basis and *biological* Darwinian evolution driven by inherent molecular properties.
  4.  **Handles Information:** Explicitly requires an "inherited molecular code," excluding prions and simple crystals.
  5.  **Captures the "Spark":** It focuses on the dynamic, adaptive potential that defines life for you – the ability to change and adapt over generations, even if currently paused. This is likely why a replicating crystal feels inert, while a frozen embryo feels merely paused.

  **In short:** Your gut verdicts commit you most strongly to **Darwinian evolutionary potential based on an inherited chemical code within a bounded system** as the hallmark of life. This principle captures nearly all your intuitions, only requiring you to accept that the minimal synthetic cell *is* alive (which seems consistent). Your friend correctly identified that metabolism isn't your key criterion, but the evolutionary principle resolves the tension they perceived between viruses and embryos. Cheers for a cracking philosophical puzzle!
