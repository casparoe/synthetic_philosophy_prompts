prompt: |-
  I need your help turning some philosophy into something I can actually use at work. Three weeks ago I got voluntold into chairing the clinical ethics committee at our NHS trust (the old chair retired mid-term and apparently I wasn't quick enough to say no). We meet weekly, mostly getting referrals from ward staff about end-of-life stuff, confidentiality, and relatives demanding things. The decisions are often time-pressured -- sometimes a referral comes in at 4pm and someone has to act by evening, other times we get the full hour.

  Here's the thing I've realised after my first few sessions: half our job isn't deciding "what should be done," it's deciding what KIND of situation we're in. Sometimes what looks like an agonising choice dissolves once someone spots a third option or notices that one of the two "obligations" is actually just family pressure or an institutional habit dressed up as a duty. But sometimes I genuinely can't see how any option avoids leaving something morally behind. And apparently philosophers have been fighting about this forever -- whether genuine moral dilemmas are even possible, or whether the idea of two real obligations you can't both satisfy is somehow incoherent (the "ought implies can" line, and Kant apparently thought duties conflicting was as absurd as a square circle, though someone else said the guilt you feel either way is exactly what marks a real dilemma). I've got this from one podcast and a W.D. Ross-shaped hole in my education, so my understanding is ropey, but the underlying question is now my actual day job.

  So: please write me a triage procedure the committee can run in 20-30 minutes, before we've decided anything, to sort a referral into (at minimum) "apparent dilemma -- there's a hidden third option, or one duty clearly outranks the other" versus "genuine dilemma -- every option leaves a moral remainder, and the most we can do is pick the one we can live with." I want an ordered set of tests: what to check first, what counts as passing or failing each, where a "stop, this isn't a dilemma" answer comes from, and crucially where the procedure has to hand it back to human judgement because the question is one of values rather than facts. Whatever the actual philosophy says (prima facie duties, moral remainder, epistemic vs genuine dilemmas, whatever's useful), keep what matters from it and drop what we can't use in a hurry -- but be explicit about what got dropped and where that will make the procedure misfire. Also please be honest that "the nurse feels awful either way" is doing a lot of work in my thinking and may not be reliable evidence of anything.

  Then run the procedure on two cases so I can see it work:

  1. One ICU bed, two candidates -- a 68-year-old post-surgery with a decent prognosis if ventilated, and a 34-year-old whose prognosis is worse but who is much younger. No formal triage policy covers peacetime, both families are pushing hard, and the referring consultant says her gut says one thing and "first come first served" says another.

  2. A GP who promised a patient he wouldn't tell his adult daughter about his new Huntington's diagnosis. The daughter is currently trying for a baby and could access predictive testing if she knew it ran in the family. The GP is asking us whether the confidentiality promise can be broken.

  And if the procedure would hand me an answer I'm not going to like on either of those, tell me straight -- I'd rather find out now than in the meeting. Also flag anything you think the committee will inevitably misuse, e.g. treating a clean "apparent dilemma" verdict as moral permission, or using "it's a genuine dilemma" as a way to avoid taking responsibility for the choice.
reasoning: |-
  Okay, let me start by understanding the user's situation. They were voluntold to chair a clinical ethics committee in an NHS trust. Their main challenge is distinguishing between apparent and genuine moral dilemmas quickly. They need a practical triage procedure that can be applied in 20-30 minutes. 

  First, I need to recall the philosophical concepts they mentioned. W.D. Ross's prima facie duties and moral remainders are relevant here. But the user wants to strip down the philosophy to actionable steps. The key is to identify if there's a hidden third option or if one duty overrides another. If not, it's a genuine dilemma where any choice leaves a moral remainder.

  The user provided two cases: an ICU bed allocation and a confidentiality issue with Huntington's diagnosis. I need to apply the procedure to these examples to demonstrate its use. Also, they mentioned potential pitfalls like misusing the "apparent dilemma" verdict as an easy out or avoiding responsibility with "genuine dilemma."

  For the triage procedure, it should be step-by-step with clear pass/fail conditions. Steps should include checking for factual errors, hidden options, duty conflicts, precedence, and moral residue. Each step must be practical under time constraints. 

  In the ICU case, Step 1 might reveal that both patients meet criteria, so no error. Step 2 could look for alternatives like transferring a patient or using a different ventilator. If none, move to Step 3: duties to save lives conflict. Step 4 checks for precedence—maybe the trust has a policy favoring prognosis over age. If not, Step 5: whichever choice leaves guilt, so it's a genuine dilemma. 

  For the Huntington's case, Step 1 confirms the diagnosis and promise. Step 2: any alternatives? Maybe the patient could be persuaded to disclose. If not, Step 3: confidentiality vs. preventing harm. Step 4: legal precedence favors confidentiality unless imminent harm. Step 5: breaking confidentiality causes moral residue, so genuine dilemma. 

  I should warn the user about relying on the nurse's guilt as evidence. It's subjective. Also, committees might misuse the verdicts to avoid tough decisions. Emphasize that "genuine dilemma" still requires owning the choice. 

  Need to ensure the procedure is flexible. Some steps might need skipping under time pressure. Highlight where philosophy is simplified, like reducing Ross's duties to common clinical conflicts. 

  Finally, test both cases with the procedure. For ICU, if no policy exists, it's genuine. For Huntington's, unless harm is imminent, confidentiality holds. The user might not like that, but it's honest. Flag that committees might resist accepting genuine dilemmas and push for more options prematurely.
answer: |-
  Here's a practical triage procedure rooted in ethical philosophy (primarily W.D. Ross's *prima facie duties* and the concept of *moral residue*), streamlined for clinical urgency. It focuses on **distinguishing resolvable conflicts ("apparent dilemmas") from genuine tragic choices ("genuine dilemmas")**.

  **Core Philosophy Used & What's Dropped:**
  *   **Used:** Ross's *prima facie duties* (e.g., fidelity, justice, beneficence, non-maleficence, autonomy), the idea of *moral residue* (lingering distress signalling a genuine conflict), and the distinction between *epistemic* (lack of knowledge) and *ontic* (true conflict) dilemmas.
  *   **Dropped:** Deep meta-ethical debates about whether "genuine" dilemmas *exist* (Kant vs. others). We assume they *can* exist in practice. We also drop exhaustive duty hierarchies – focus shifts to **conflict identification and resolvability**. The "nurse feels awful" is treated as a *potential symptom* of residue, not proof.

  **The Triage Procedure: "DILEMMA" Framework (20-30 mins)**

  Run these steps sequentially. Stop early if a clear "Apparent Dilemma" resolution emerges. If you reach Step 5 without resolution, it's likely "Genuine Dilemma".

  1.  **D: Define Duties & Facts Precisely (5 mins)**
      *   **Test:** List *all* claimed moral obligations/duties (e.g., "beneficence to Patient A", "justice (fair allocation)", "fidelity to promise", "non-maleficence to Patient B", "autonomy of Patient X"). Simultaneously, ruthlessly verify *factual accuracy*: Are assumptions correct? Is prognosis data sound? Was consent properly given? Is the legal/policy framework clear?
      *   **Pass:** All duties clearly articulated, key facts verified. Move to Step 2.
      *   **Fail (Apparent Dilemma):** A claimed "duty" is based on a *factual error* (e.g., prognosis was wrong, consent process flawed) or is *not a genuine moral duty* (e.g., purely institutional habit, undue family pressure misperceived as obligation). **Stop: Not a true dilemma.** Correct facts/duty list and re-assess.
      *   **Judgement Call:** Distinguishing genuine duty from pressure/habit. Requires committee discussion.

  2.  **I: Investigate Hidden Options (5-7 mins)**
      *   **Test:** Brainstorm *creatively and exhaustively* for alternatives beyond the presented choices. Ask: "Is there *any* way to satisfy *all* core duties, even partially?" Consider: time delays (brief), resource re-allocation (small scale), compromise, partial disclosure, external support (palliative care, mediation), different framing of choices to the family/patient.
      *   **Pass:** No plausible alternative action satisfies all core duties identified in Step 1. Move to Step 3.
      *   **Fail (Apparent Dilemma):** A viable "third way" or compromise emerges that honours *all* core duties adequately. **Stop: Not a true dilemma.** Pursue the alternative.
      *   **Judgement Call:** Assessing viability/adequacy of alternatives under time/resource constraints.

  3.  **L: Level of Conflict (3 mins)**
      *   **Test:** Is this a conflict between **two core duties of comparable weight** (e.g., beneficence to A vs. beneficence to B; fidelity vs. preventing serious harm), or is one duty **clearly lexically prior** (overriding) in this context? (e.g., non-maleficence usually trumps autonomy in imminent life-threatening harm *to others*; established legal duty might trump institutional preference).
      *   **Pass:** Duties appear genuinely comparable in weight/priority *within this specific context*. Move to Step 4.
      *   **Fail (Apparent Dilemma):** One duty is demonstrably overriding based on precedent, policy, law, or widely accepted ethical principle *in this specific situation*. **Stop: Not a true dilemma.** The overriding duty dictates action.
      *   **Judgement Call:** Determining comparability vs. lexical priority in the *specific clinical context*. Precedent/policy is key here.

  4.  **E: Examine Precedent & Policy (5 mins)**
      *   **Test:** Does existing Trust policy, national guidance (GMC, NICE), or relevant case law *directly resolve* this conflict type? Is there a clear, justifiable precedent *within our own committee*? Does applying the policy/precedent feel ethically defensible here?
      *   **Pass:** No clear, applicable, and ethically defensible policy/precedent forces a resolution. Conflict remains between comparable duties. Move to Step 5.
      *   **Fail (Apparent Dilemma):** A clear, applicable, and ethically sound policy/precedent exists and resolves the conflict. **Stop: Not a true dilemma.** Follow policy/precedent (document if defensibility feels borderline).
      *   **Judgement Call:** Assessing the *ethical defensibility* of the policy/precedent *in this specific case*. Does it feel like a reasonable balance?

  5.  **M: Moral Residue Check (2 mins)**
      *   **Test:** If we choose *any* of the remaining options, will there likely be **significant, justifiable moral residue** (distress, guilt, sense of moral compromise) for the clinicians/staff/committee? Is this residue *because* a core duty was truly violated, not just because the outcome is sad or difficult?
      *   **Pass (Genuine Dilemma):** Significant, justified moral residue is anticipated *regardless of the choice* because core, comparable duties conflict unavoidably. **Stop: Genuine Dilemma.** Proceed to weighing options, accepting residue.
      *   **Fail (Apparent Dilemma):** The anticipated distress seems disproportionate or stems primarily from outcome sadness, fear of blame, or misunderstanding, not from violating a core duty. Revisit Steps 1-4 (especially 1 & 2). **CAUTION:** This step is highly subjective. Use cautiously; committee discussion vital. Don't dismiss genuine distress lightly.
      *   **Judgement Call:** Distinguishing justified moral residue (signalling true conflict) from other sources of distress.

  **Crucial Usage Warnings:**
  1.  **"Apparent Dilemma" is NOT Absolution:** Finding a hidden option or overriding duty doesn't make the action *easy* or consequence-free. It just means the conflict wasn't fundamental.
  2.  **"Genuine Dilemma" is NOT Passivity:** Acknowledging a genuine dilemma *intensifies* the responsibility. You *must* still choose, justify *why* you chose that option, mitigate harm, support staff, and document thoroughly. The residue is real, but inaction is usually worse.
  3.  **"Moral Residue" is Subjective:** Nurse/Clinician distress is a *signal*, not proof. It needs interpretation (Steps 1-4). Don't let strong emotions prematurely force a "Genuine Dilemma" verdict.
  4.  **Speed vs. Rigor:** Under extreme time pressure (e.g., 4pm referral), Steps 2 & 4 might be truncated. Document this limitation. A "Genuine Dilemma" verdict under time pressure may need later review.

  **Applying the Procedure to Your Cases:**

  **Case 1: The ICU Bed (68M vs. 34F)**
  1.  **D:** Duties: *Beneficence* (Save life/health of both), *Justice* (Fair allocation). Facts: Prognoses verified? ("Decent" vs. "Worse" needs quantification if possible). Age confirmed. No policy. Families pushing ≠ moral duty. "First come" is a possible *tie-breaker*, not a core duty. Gut feeling ≠ duty. **Pass.** Duties defined: Save Life A, Save Life B, Allocate Justly.
  2.  **I:** Hidden Options? Transfer another ICU patient out? Expedite discharge elsewhere? Short-term stabilization for one while bed found? Borrow resource temporarily? *Likely Pass* (No viable options under pressure).
  3.  **L:** Level: *Beneficence* to Patient A vs. *Beneficence* to Patient B vs. *Justice*. Are any lexically prior? Generally, no. Saving one life doesn't inherently "override" saving another unless policy dictates. **Pass.** Conflict comparable.
  4.  **E:** Precedent/Policy? No formal peacetime policy. Precedent? Maybe "clinical need/urgency" or "prognosis" focus? "First come"? Gut? None are *clear* or *definitive* here. Age is contentious. **Pass.** No resolution.
  5.  **M:** Moral Residue? Whichever patient doesn't get the bed dies. Clinicians *will* feel profound guilt/grief/responsibility. This residue stems *directly* from violating the duty to save that life. **VERDICT: GENUINE DILEMMA.**

      *   **What you won't like:** The procedure forces you to confront that there is *no clean ethical solution*. You must choose based on the *best available justification* (e.g., strongest short-term prognosis, maximizing life-years saved if prognosis difference is slight, a random lottery if truly equal) and accept the moral residue. "First come first served" *can* be a justifiable tie-breaker *because* it's impartial, not because it's inherently best.

  **Case 2: GP Confidentiality & Huntington's Daughter**
  1.  **D:** Duties: *Fidelity* (Promise/Confidentiality to Father), *Beneficence/Non-Maleficence* (Prevent harm to Daughter/grandchild - psychological, reproductive harm). Facts: Diagnosis confirmed? Promise explicit? Daughter's pregnancy status confirmed? Father's capacity to decide confidentiality? Absence of coercion? **Pass.** Core Duties: Confidentiality (Fidelity) vs. Preventing Harm (Beneficence/Non-maleficence).
  2.  **I:** Hidden Options? Can GP *urgently* re-contact Father? Explain potential harm to granddaughter? Offer support for *him* to tell her? Offer to facilitate disclosure *with* him? Mediation? **Fail (Apparent Dilemma) UNLESS:** All alternatives genuinely exhausted *and* Father *explicitly*, capacitously, and steadfastly refuses disclosure *despite understanding granddaughter's risk*. If alternatives exist, pursue them. **ASSUME FOR TEST: Father refuses absolutely, alternatives exhausted. Pass.**
  3.  **L:** Level: Confidentiality vs. Preventing Harm. Which overrides? *Preventing serious, imminent physical harm to an identifiable 3rd party* usually overrides confidentiality (e.g., Tarasoff rule for violence). *Is this harm "imminent" and "serious physical harm"?* Huntington's is serious, but the *harm to the daughter* is primarily psychological/reproductive planning, and not *imminent* physical harm. The *grandchild* is future/conceptual. **Pass?/Judgement Call:** Not clear-cut lexical priority. Conflict comparable? (UK GMC guidance strongly favours confidentiality unless *immediate* serious harm prevention).
  4.  **E:** Precedent/Policy? GMC Confidentiality Guidance (Para 25-33): Very strict. Disclosure without consent only if *"necessary to protect the patient or someone else from risk of death or serious harm"* AND *"the risk is real, imminent and serious"* AND *"you've sought consent"* AND *"anonymised if possible"*. Huntington's risk to daughter/grandchild is serious, but likely not deemed *imminent* enough by GMC standards. Legal precedent also favours confidentiality. **Pass?/Judgement Call:** Policy *strongly* favours confidentiality here. Is it *definitive*? Yes, unless extreme harm interpretation.
  5.  **M:** Moral Residue? GP (and committee) would feel awful if daughter has child then finds out. But breaking confidentiality would violate core duty and trust. Residue exists *either way*. **VERDICT: LIKELY APPARENT DILEMMA (Due to Policy Precedent - Step 4)**

      *   **What you won't like:** The procedure, based on strict UK policy interpretation, likely says **do not break confidentiality**. The "harm" doesn't meet the high bar for overriding confidentiality. The *genuine* moral distress arises from the *tragic situation*, not a resolvable *dilemma* between equal duties – policy dictates fidelity wins here. The committee must support the GP in managing the distress of *not* disclosing.

  **Key Committee Pitfalls to Guard Against:**
  *   **Misusing "Apparent":** Treating it as "easy" or "no big deal". The uncovered option/policy might still be very hard to implement.
  *   **Misusing "Genuine":** Using it as an excuse for arbitrary decisions or avoiding the hard work of justification and mitigation. "It's a genuine dilemma, so we'll flip a coin" is ethically lazy.
  *   **Skipping Steps Under Pressure:** Document rigorously when time forces shortcuts. Revisit if possible.
  *   **Over-Reliance on Distress:** Letting strong emotions (nurse's or committee's) short-circuit the analysis (Steps 1-4).
  *   **Ignoring Residue in "Apparent":** Even resolvable dilemmas can leave sadness or regret. Acknowledge it.
  *   **Policy Fetishism:** Blindly following policy in Step 4 without assessing its *ethical defensibility in this specific case*.

  This framework provides structure to navigate the chaos. It won't eliminate the pain of genuine dilemmas, but it ensures you've rigorously tested for escape routes and clarifies the *nature* of the ethical challenge before you act. Good luck!
