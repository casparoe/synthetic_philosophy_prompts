prompt: |-
  I am preparing a seminar on the definition of art — institutional theories, historical definitions, formalism, expression theories — and I want to open the semester not with the theories but with a practice, so that the students have something concrete to push against. The practice I have in mind is the art world's treatment of authorship, attribution, and forgery, and I would be grateful for a careful philosophical reconstruction of it.

  The case is familiar in outline: a canvas hangs in a museum for years, is admired, studied, written about; its perceptible properties are everything the viewer could want. Then laboratory analysis or archival work establishes that it was painted by Han van Meegeren in the 1940s rather than by Vermeer in the 1660s — and nothing about the canvas changes, yet almost everything else does. The market value collapses, the wall label is rewritten, insurers are notified, and viewers who once stood before it in rapture now report feeling deceived. Curiously, though, the same institutions that treat forgery as a scandal happily display Roman marble copies of lost Greek bronzes, catalogue paintings as "workshop of Rembrandt," and acquire ancient works whose attributions are frankly uncertain — cases in which the work's historical relation to the revered name is also mediated, indirect, or unknown, but where no one feels betrayed. So the practice is not simply "we only show originals." It seems to draw a line, but I cannot see exactly where it is drawn or why.

  What I would like is an analysis of what this cluster of practices presupposes about art's definition. Must the collapse of the forgery's status be explained by a theory on which art is essentially historical or intentional — so that a perceptually identical object made under different causal circumstances is simply not the same artwork, or not an artwork at all? Or is the practice compatible with a purely formalist or aesthetic definition plus some independent account of markets, trust, and provenance, so that the betrayal we feel is a betrayal about testimony rather than about art? I would also like you to address whether the practice is internally consistent: can the market's treatment of forgery be reconciled with the museum's comfortable display of copies and workshop products, or does the practice presuppose views that cannot all be held at once? And finally, suppose we adopted a strictly aesthetic definition of art — what in the actual institutions would have to change, if anything? Please respond in exactly five numbered points, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Okay, the user is preparing a seminar on the definition of art and wants to open with a practical case about authorship, attribution, and forgery rather than starting with theories. They're particularly interested in the paradox where forgeries are condemned while copies or workshop pieces are accepted. Their main request is a philosophical reconstruction of this practice in five numbered points.

  Hmm, this is a fascinating problem in art philosophy. The user seems well-versed in art theory (mentioning institutional theories, formalism etc.) but wants concrete material for students to engage with. The core tension they've identified is really compelling: why does a Van Meegeren "Vermeer" become worthless when revealed as fake, while museum-goers happily admire Roman copies of Greek statues?

  Let me break this down. The user actually poses several layered questions: (1) What does this practice presuppose about art's definition? (2) Is this consistent with intentional/historical theories vs formalist theories? (3) Is the practice internally consistent given how museums treat copies? (4) What would change if we adopted pure aesthetic formalism?

  First, the forgery reaction suggests art isn't just about perceptible qualities. The outrage implies something essential about origin - likely intentionality (the maker's purpose) and authenticity (correct causal history). When a "Vermeer" becomes a Van Meegeren, its entire artistic identity changes because the creative act was deceptive.

  But then why are Roman copies acceptable? Probably because they're transparent about being copies - they don't falsely claim to be the original Greek work. Their value comes from different artistic intentions (homage, preservation) and they exist in a clear historical tradition. Workshop attributions similarly acknowledge mediated creation without deception.

  The apparent inconsistency dissolves when we consider the role of institutional honesty. Museums frame copies and workshops accurately, so there's no betrayal of trust. Forgeries, however, violate the authenticity contract that undergirds art valuation - hence the market collapse isn't just about aesthetics but about broken cultural testimony.

  If we adopted pure formalism, institutions would need radical changes: eliminate provenance research, display forgeries as equally valid, and fundamentally rethink art history's narrative structure. But this would ignore how artistic meaning is entangled with cultural context and intention.

  The practice is ultimately consistent because it treats all artworks as historical artifacts, but varies in tolerance based on transparency. Copies are honest participants in artistic traditions; forgeries are counterfeit claimants. The line is drawn at deception about origins, not at mediation per se.
answer: |-
  Here are five numbered points addressing the philosophical implications of authorship, forgery, and institutional practice:

  1.  **Essential Historical/Intentional Premise:** The forgery's collapse presupposes that an artwork's identity and status depend crucially on its authentic historical origin and the artist's intentional act; a forgery, despite perceptual identity, is a distinct artifact made with deceptive intent, failing to participate in the original artistic achievement or historical context that grants the work significance.
  2.  **Transparency vs. Deception as Key Distinction:** The practice is consistent when distinguishing deceptive forgeries from accepted copies/workshop pieces because the latter involve transparent institutional framing: Roman copies are presented *as copies*, "workshop of" labels acknowledge mediated production without fraud, preserving trust by honestly situating the object within an understood historical-artistic continuum.
  3.  **Betrayal of Testimony vs. Artwork Identity:** While markets, provenance, and trust are involved, the core betrayal concerns the artwork's identity itself; viewers feel deceived about *what the object fundamentally is* (a Van Meegeren deception, not a Vermeer creation), not merely about factual testimony, meaning the practice inherently rejects a *purely* formalist/aesthetic definition isolating the object from its origin.
  4.  **Internal Consistency via Framing and Function:** The practice is internally consistent because it differentiates based on institutional framing and the artifact's *function* within art history: copies function as homages/records, workshop pieces function as products of a master's milieu, while forgeries function solely to deceive, exploiting the institutional reliance on authentic historical connection for meaning and value.
  5.  **Institutional Change under Strict Formalism:** Adopting a strictly aesthetic definition (art defined solely by perceptible properties/form) would necessitate abolishing provenance research, attributions, and forgery concepts; museums would display objects based *only* on aesthetic impact, market value would reflect perceived beauty alone, and feelings of betrayal over origin would be deemed irrational, fundamentally altering art's social and historical role.
