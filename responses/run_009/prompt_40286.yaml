  For the governing question, I recall how Maudlin frames it as primitive enforcement - it's not reducible to other functions. The epistemology issue seems trickier; while Armstrong demands it, Humeans might see it as downstream. I should note that tension.

  I'm mentally scanning the literature for subtle criteria: synchronic grounding (can laws change?), meta-laws (do laws have laws?), intrinsicness (are laws spatiotemporally bound?). The symmetry constraint from physics feels particularly underdiscussed in philosophy circles.

  Ah, and the uranium spheres example! Must include that as a concrete test case. For probabilistic laws, the independence criterion is crucial - they can't just be frequentism in disguise.

  Now for the colleague's objection about governing: I think they're missing how "governing" captures the directedness of laws - why this regularity rather than that. But I'll acknowledge it's the most metaphysically loaded item.

  On epistemology, I'm leaning toward it being necessary but secondary - any theory that makes laws completely unknowable seems defective, but detailed mechanisms might belong to philosophy of science.

  The real kicker is identifying conflicting desiderata. Synchronic grounding vs diachronic change creates tension, and intrinsicness clashes with symmetry considerations in modern physics. Primitivism handles governing well but struggles with epistemology; best systems ace epistemology but feel shallow on explanation.

  I should flag how some criteria are covertly linked - like how counterfactual support and explanation often get conflated but come apart in edge cases. And determinable vs determinate might be two sides of the same coin.

  For the scorecard, I'll keep it telegraphic: best systems strong on epistemology/accident distinction but weak on governing; necessitation reverses that; primitivism extreme on governing but pays epistemological costs. The conflicts will spark great seminar debates.
answer: |-
  Here’s a comprehensive spec sheet of desiderata for a theory of laws of nature, designed for graduate rigor. Criteria are split into **Core Functions** (minimal adequacy) and **Theoretical Virtues** (resolving persistent debates), with notes on rationale, necessity, and tensions. I’ll address your two questions explicitly at the end.

  ---

  ### **Core Functions: What Laws MUST Do**  
  *(Non-negotiable; failure here disqualifies the theory)*  

  1. **Distinguish Laws from Accidents**  
     - *Requirement:* Must explain why "All uranium spheres are <1km diameter" is accidental, while "All fermions obey Pauli exclusion" is lawful—even if both are universally true.  
     - *Why necessary:* Without this, laws collapse into mere summaries. Humean "best systems" handle this via systematization; non-Humeans via modal force.  

  2. **Support Counterfactuals**  
     - *Requirement:* Must ground why "If this match were struck, it would light" holds *because* of a law (e.g., combustion chemistry), not just accidental regularities.  
     - *Why necessary:* Laws define what *would* happen in non-actual scenarios. Primitivism takes this as bedrock; best systems derive it from system robustness.  

  3. **Underwrite Explanatory Asymmetry**  
     - *Requirement:* Must ensure laws *explain* regularities (e.g., Newton’s laws explain planetary orbits), not vice versa.  
     - *Why necessary:* Reversing this (e.g., "regularities explain laws") confuses epistemology with metaphysics. Non-Humeans demand priority; Humeans deny it.  

  4. **Accommodate Probabilistic Laws**  
     - *Requirement:* Must treat probabilistic laws (e.g., quantum decay) as *irreducibly* chancy—not disguised frequentism (e.g., "90% decay in time T" ≠ "90% *do* decay in T").  
     - *Why necessary:* Physics requires objective chances. Best systems use "fit"; primitivism accepts indeterminism; necessitation may struggle (see *Tensions*).  

  ---

  ### **Theoretical Virtues: What Laws SHOULD Explain**  
  *(Resolves philosophical disputes; absence weakens but doesn’t invalidate)*  

  5. **Governance / Modal Force**  
     - *Requirement:* Must account for the intuition that laws *constrain* or *direct* events ("Why *must* particles obey F=ma?").  
     - *Rationale:* Your colleague is half-right: "governing" is metaphorical, but its *explanatory target* is real—**why nature exhibits reliable patterns rather than chaos**.  
     - *Whose preference?* Non-Humean (Armstrong, Maudlin). Humeans (BSA) reject it as illusory.  
     - *Judgment:* **Necessary if** you think laws should answer "Why this regularity *rather than another*?"—e.g., why symmetry principles *limit* possible universes.  

  6. **Epistemological Accessibility**  
     - *Requirement:* Must provide a *viable path* to knowing laws (e.g., via evidence, inference, or science).  
     - *Rationale:* Laws we can’t *in principle* know are functionally inert.  
     - *Whose preference?* Humeans (BSA) demand it; primitivists (Maudlin) may treat it as secondary.  
     - *Judgment:* **Necessary but not primary.** A theory shouldn’t make laws *unknowable*, but detailed epistemology belongs to philosophy of science.  

  7. **Synchronically Ground Regularities**  
     - *Requirement:* Must ensure laws fix regularities *at a time* (e.g., why current particle interactions obey the Standard Model *now*).  
     - *Why subtle?* Humeans supervene on the mosaic; non-Humeans may use timeless necessitation.  

  8. **Handle Meta-Laws**  
     - *Requirement:* Must explain laws *of* laws (e.g., gauge symmetry "governing" the Standard Model).  
     - *Why crucial?* Physics posits law-like constraints *on* laws (e.g., renormalizability). Primitivism handles this cleanly; BSA struggles.  

  9. **Intrinsicness**  
     - *Requirement:* Laws should depend *only* on local/fundamental properties (e.g., not on future events or global patterns).  
     - *Whose preference?* Armstrong (non-Humean); BSA violates this (laws supervene on the whole universe).  

  ---

  ### **Tensions and No-Go Insights**  
  - **Conflict 1: Governance vs. Epistemology**  
    Non-Humeans (Armstrong, Maudlin) secure governance but face skepticism: How do we *know* necessitation relations? Humeans (BSA) avoid this but lack "oomph."  
  - **Conflict 2: Probabilistic Laws vs. Intrinsicness**  
    Objective chances (e.g., radioactive decay) resist reduction to non-probabilistic facts. BSA’s "fit" may covertly rely on frequencies; necessitation may require dubious "probabilistic universals."  
  - **Conflict 3: Meta-Laws vs. System Simplicity**  
    BSA prioritizes simplicity, but meta-laws (e.g., Lorentz invariance) may complicate the system. Primitivism avoids this but is ontologically costly.  

  **Suspect Twins**:  
  - "Governance" and "Counterfactual Support" are often conflated but distinct: Governance asks *why* laws hold; counterfactuals ask *what follows* if they do.  
  - "Explanation" and "Prediction" are two sides of the same coin—**asymmetry** is the real test.  

  ---

  ### **Scorecard (Concise)**  
  | **Desideratum**       | **Best-System (Humean)** | **Necessitation (Armstrong)** | **Primitivism (Maudlin)** |  
  |------------------------|--------------------------|-------------------------------|---------------------------|  
  | **Laws vs. Accidents** | ★★★ (systematization)    | ★★ (contingent nomic relations) | ★★★ (primitive lawhood) |  
  | **Counterfactuals**    | ★★ (derived from system) | ★★ (entailed by necessity)    | ★★★ (built-in)          |  
  | **Explanatory Asymmetry** | ✘ (laws summarize)    | ★★ (laws cause regularities) | ★★★ (laws fundamental) |  
  | **Probabilistic Laws** | ★★ (via fit)            | ★ (problematic)               | ★★★ (primitive chances) |  
  | **Governance**         | ✘                       | ★★ (moderate)                 | ★★★ (maximal)          |  
  | **Epistemology**       | ★★★ (straightforward)   | ★ (inference to universals?)  | ★ (mysterious)         |  
  | **Meta-Laws**          | ✘                       | ★ (possible)                  | ★★★ (natural fit)      |  

  **No-Go Result**: No theory satisfies *all* desiderata without trade-offs. BSA sacrifices governance for epistemology; necessitation sacrifices epistemology for modal force; primitivism sacrifices accessibility for purity. The "governing" debate is irreconcilable—Humeans see it as a pseudo-problem; non-Humeans as the crux.  

  ---

  ### **On Your Two Questions**  
  1. **Governing**: It *is* a genuine desideratum capturing why laws feel "non-arbitrary." If laws merely describe, we can’t explain why *these* regularities hold in all possible scenarios (e.g., why not a universe with different symmetries?). **Verdict**: Governance does unique work—answering "Why *these* constraints?"—but only if you accept the question.  
  2. **Epistemology**: A theory must *allow* for knowable laws (or explain their unknowability), but needn’t provide a full epistemology. **Verdict**: Theories that make laws *in principle* unknowable (e.g., some primitivist views) fail; others meet the bar by being compatible with scientific practice.  

  This spec sheet exposes fault lines: What you demand of laws depends on whether you prioritize science’s descriptions (Humean) or metaphysics’ explanations (non-Humean). Hand this to your students on day one—watch week three’s stock objections transform into targeted arguments.
