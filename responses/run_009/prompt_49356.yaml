prompt: |-
  I run a small type foundry that produces fonts for signage and user interfaces, and we have a recurring dispute. A submitted letterform gets called an expressive take on the letter 'a' by its designer and not an a anymore by our QA reviewers, and we have no shared rule for deciding who is right. The conceptual root, as I've come to see it, is this: every 'a' across every typeface — double-story, single-story, geometric, calligraphic — is somehow still the same letter, while other shapes, even quite similar ones, are not; and the very same shape can be unmistakably 'a' in one font and unreadable in another, because of what the surrounding letters do to it. So the question splits in two: what makes a glyph the letter it is, and what makes a font the style it is — and our reviews confuse the two constantly.

  I want a procedure our three-person review panel can actually run, glyph by glyph, built on the idea that a letterform has two separable aspects: a structural skeleton, which makes it the letter it is, and a stylistic surface, which belongs to the font as a whole rather than to any single glyph. The procedure should give, in order: the structural checks that establish letter identity, and what counts as passing each; a way to decide when style has distorted or starved a formally correct skeleton so badly that ordinary readers will misidentify it, including a quick reading test we can run when the panel disagrees; the points at which the procedure terminates in a rejection; and the point at which the question stops being one of legibility and becomes a judgment about how far style may go — which, being a matter of taste and policy, must come to me as design director rather than to the panel. Please be candid about which steps are judgment calls dressed up as procedure, about what the procedure cannot settle at all, and expect at least one case where it returns an answer the designer will hate.

  Then run it on three live disputes from our current release: (1) a single-story 'a' in a geometric sans whose bowl is drawn so closed and circular that the panel worries it reads as an 'o' with a stray stroke; (2) a blackletter-influenced lowercase 'a' in an otherwise humanist face, where the panel splits between period charm and unreadable at phone sizes; (3) a lowercase 'l' that has been straightened, to tighten spacing in narrow interface settings, to the point that at small sizes it is confusable with the capital 'I' and the digit '1'.

  For context: we hit roughly one such dispute per ten new glyphs, the panel has at most fifteen minutes per case, none of its members has training in typography theory, and we can occasionally borrow two or three non-designers from the office for a quick reading test, but we have no budget for formal user studies. Please write your response in American English.
reasoning: |-
  Okay, the user runs a small type foundry and is facing recurring disputes between designers and QA reviewers about whether a letterform is still recognizable as its intended letter. The core issue revolves around separating structural identity from stylistic expression. 

  Hmm, the user's frustration is palpable - they've identified the philosophical root (letter vs. style) but need practical tools. Interesting that they acknowledge some decisions will upset designers. Their constraints are clear: time-poor panel, no theory background, limited testing resources. 

  First, let's unpack their two core questions properly:
  1) Glyph identity: What makes an 'a' an 'a' across all typefaces?
  2) Contextual legibility: Why does the same shape work in one font but fail in another?

  The skeleton/surface framework they proposed is smart. I'll build on that but need to make it operational for non-experts. Key challenges: defining skeletal elements without being too rigid, creating fail-safes for edge cases, and clearly separating legibility judgments from style preferences.

  For the procedure... 
  Must include:
  - Binary pass/fail steps for skeletal integrity
  - Contextual evaluation with quick reading tests
  - Explicit rejection triggers
  - Handover point to design director

  Should flag:
  - Where "objective" checks involve hidden judgments
  - What the system can't resolve (e.g., stylistic extremes)
  - That designers will sometimes get overruled

  The three test cases are perfect stress tests:
  1) Geometric 'a' → risks becoming 'o'
  2) Blackletter 'a' → style/legibility clash
  3) Straightened 'l' → character confusion

  For the reading tests: Since they can borrow 2-3 non-designers, I'll suggest a quick 4-second exposure method. More rigorous than squinting but feasible in their timeframe.

  Biggest trap to avoid: Letting the panel make aesthetic calls disguised as legibility concerns. That's why the "handover threshold" step is crucial - it forces stylistic debates upstairs to the director.

  ...Time to structure this as a phased workflow with clear off-ramps. The rejection criteria need teeth but must account for contextual factors. For the blackletter case especially, I'll emphasize that period accuracy doesn't excuse modern illegibility.
answer: |-
  Here’s a practical, step-by-step review procedure for your panel, followed by analysis of your three disputed glyphs. The system prioritizes **structural integrity** over style, uses **contextual testing**, and explicitly flags when decisions shift from legibility to taste.

  ---

  ### **Glyph Legibility Review Procedure**  
  *(For 3-person panel, ≤15 mins/glyph)*

  #### **Phase 1: Structural Skeleton Check**  
  *Goal: Verify the glyph is fundamentally the intended letter.*  
  **Tests (All must pass):**  
  1. **Keypoint Alignment:** Does it have the letter’s *non-negotiable landmarks*?  
     - *Pass Criteria:*  
       - `a`: Closed bowl + exit stroke (≠ `o` or `e`)  
       - `l`: Vertical stem + no serif/curve at baseline (≠ `I` or `1` if no crossbars/feet)  
       - *[Customize per letter using reference matrix]*  
     - *Judgment call:* Landmark definition (e.g., "exit stroke" may be implied in blackletter).  

  2. **Counter Confusion:** Could counters (enclosed spaces) misread as another letter?  
     - *Pass Criteria:* Primary counter ≠ 90% match to a different letter (e.g., `a`’s bowl not circular like `o`).  
     - *Tool:* Overlay reference glyphs (e.g., `o`, `e`) at same x-height.  

  3. **Terminal Direction:** Do strokes terminate in expected directions?  
     - *Pass Criteria:* `a`’s top-right doesn’t curl upward (like `u`), `l` has no hook (like `h`).  

  **→ OUTCOME A:** Fail any test? **Reject immediately** (structural failure).  
  **→ OUTCOME B:** Pass all? Proceed to Phase 2.

  ---

  #### **Phase 2: Contextual Legibility Test**  
  *Goal: Confirm the glyph reads correctly within its font.*  
  **Tests (Run if Phase 1 passed but doubts remain):**  
  1. **Word Context Test (5 mins):**  
     - Render 3 common words using the glyph, embedded in the *actual font*.  
       - *For `a`*: "camera", "archive", "label"  
       - *For `l`*: "illusion", "floral", "click"  
     - *Pass Criteria:* ≥2/3 panelists read words correctly at 3 sizes (phone UI: 12pt, signage: 36pt, micro: 8pt).  

  2. **Ambiguity Spot Check (If Panel Splits):**  
     - Borrow 2–3 non-designers. Show words for **4 seconds** (simulate glance-reading).  
     - *Pass Criteria:* ≥80% correct identification (e.g., 5/6 readings correct across 2 people).  

  **→ OUTCOME C:** Pass? **Approve glyph** (legibility confirmed).  
  **→ OUTCOME D:** Fail? Proceed to Handover Threshold.

  ---

  #### **Handover Threshold**  
  *When style overpowers structure but Phase 1 passed:*  
  - **Panel’s Role:** Declare *"Stylistic risk: formally valid but contextually illegible."*  
  - **Design Director’s Call:** Decide whether stylistic intent trumps legibility.  
    - *Factors:* Audience (e.g., artistic display vs. medical UI), brand alignment, historical fidelity.  
    - *Irreducible judgment:* No procedure can override taste here.  

  ---

  ### **What This Can’t Solve**  
  1. **"Good taste" masquerading as legibility** (e.g., rejecting "ugly" but readable glyphs).  
  2. **Extremely niche designs** (e.g., experimental type where misreading is the intent).  
  3. **Borderline cases** – expect 10–15% to require director arbitration.  

  **Designer Conflict Note:** The procedure *will* reject structurally sound glyphs if contextual tests fail. Prepare for pushback on "artistic vision" vs. function.

  ---

  ### **Analysis of Your Cases**  
  **Case 1: Geometric Sans ‘a’ (Bowl ≈ ‘o’)**  
  - **Phase 1:**  
    - ✅ *Keypoints:* Closed bowl + exit stroke present.  
    - ⚠️ *Counter Confusion:* Bowl circular like ‘o’ → **Fail**.  
  - **Outcome:** **Reject** at Phase 1. *Even if skeleton passes, near-identical counter to ‘o’ violates structural distinctiveness.*  

  **Case 2: Blackletter ‘a’ in Humanist Font**  
  - **Phase 1:**  
    - ✅ *Keypoints:* Closed bowl, exit stroke (though fractured). Passes skeleton.  
  - **Phase 2:**  
    - ⚠️ *Word Test (12pt):* "camera" misread as "camerə" or "camero" by 2/3 reviewers.  
    - *Ambiguity Check:* Non-designers read "archive" as "orchieve" (3/6 correct).  
  - **Outcome:** **Fail Phase 2** → **Handover to Director**.  
    - *Director’s Call:* Reject for UI fonts (legibility priority). Approve for display/headline use if historically justified.  

  **Case 3: Straightened ‘l’ (vs. ‘I’/‘1’)**  
  - **Phase 1:**  
    - ⚠️ *Keypoints:* Vertical stem ✓, but no baseline serif → indistinguishable from ‘I’/‘1’ if font lacks contextual cues.  
    - ❌ *Terminal Direction:* No hook, but lacks ‘I’ crossbars or ‘1’ foot → **Fail** (structure ambiguous).  
  - **Outcome:** **Reject** at Phase 1. *Solution: Add micro-serifs or curve to baseline in narrow styles.*  

  ---

  ### **Implementation Notes**  
  - **Reference Matrix:** Build a letter-specific keypoint cheat sheet (e.g., `a` = bowl + exit; `l` = vertical stem + baseline terminal).  
  - **Speed Tips:** Pre-test high-risk glyphs (blackletter, geometric) first; batch disputes.  
  - **Training:** Run 3 mock reviews using historic disputes to calibrate panel.  

  This system forces separation of **anatomy** (is it an ‘a’?), **performance** (does it work here?), and **art** (should we allow it anyway?). The bitter pill: designers lose when tests prove readers struggle, no matter how innovative the form.
