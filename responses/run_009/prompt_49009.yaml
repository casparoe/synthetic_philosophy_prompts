prompt: |-
  I've been going down a rabbit hole on whether the quantum wavefunction is a real physical thing or just a bookkeeping device for our knowledge, and I want your actual credence that psi-ontic views are right (i.e. that the wavefunction, or at least the pure quantum state, corresponds to something in the world rather than only to an observer's information). Not a survey of the options -- a number, and then the decomposition that gets you there.

  Some sub-questions you might carve it into, though feel free to carve differently: the probability that the PBR theorem's assumptions hold up (preparation independence especially -- no conspiratorial correlations between how different systems were prepared); the probability that quantum mechanics is complete in the relevant sense versus needing hidden structure underneath it; the probability that the classical analogy the psi-epistemic camp leans on (where quantum states are supposed to be like probability distributions over phase space, the way statistical mechanics handles our ignorance) can survive once you notice interference seems to need the amplitudes themselves, not just the probabilities; and maybe a term for whether "the wavefunction is real but derivable from something deeper" should count as psi-ontic for this purposes or counts as a third option. Assign each a rough probability with a line of justification, tell me how they combine to your final number, and then say which single term the answer is most sensitive to -- like, if preparation independence turned out to fail in a principled way, how far would that actually move you?

  Also, if it matters for your number: I personally find Wigner's friend type setups and these newer no-go results about observer-independent facts kind of compelling in a direction I can't fully articulate, so tell me if you think I'm weighting that stuff too much. And be honest if you think the whole psi-ontic/psi-epistemic carve-up is confused at some level and the real disagreement lives somewhere else (ontology of what exactly? the universal vs. effective state? whether 'knowledge' without a knower even makes sense here) -- I'd rather hear that than a fake-clean decomposition. thx
