prompt: |-
  My friend Dev argues about voting rules with me constantly and I think I've finally got his views pinned down. He's for compulsory voting with a small fine, Australia-style, plus automatic registration. He'd lower the voting age to 16 and he wants 16-year-olds fined for not voting the same as everyone else -- "nobody gets an optional vote" is how he put it. Prisoners should vote from prison. Permanent residents should vote in city elections, though not national ones. Tourists obviously dont. Citizens who moved abroad decades ago should keep their national vote but he thinks they shouldn't be fined for not using it. Spoiling your ballot should count as showing up. When I push him on dropping the age to 14 he gets squirrely.

  So now our city council is actually debating extending the abstention fine to permanent residents, now that they can vote locally, and I honestly cannot predict what Dev will say. Predict his verdict, but what I really want is the rule or rules he's implicitly running, because I can see at least two that fit everything above and they come apart on exactly this question -- is his "nobody gets an optional vote" line about the vote or about who's holding it? Tell me which rule you'd bet on and why, what question would actually settle it (I'm thinking jury duty for permanent residents, or whether they'd be auto-enrolled or have to opt in to the local rolls, but maybe there's something better), and whether his whole package is even consistent once you spell it out.
reasoning: |-
  Okay, I need to figure out Dev's voting rules based on his views. Let me list out everything he believes:

  1. Compulsory voting with a small fine, like Australia.
  2. Automatic registration.
  3. Voting age lowered to 16, and 16-year-olds fined if they don't vote.
  4. Prisoners should vote from prison.
  5. Permanent residents can vote in city elections but not national ones.
  6. Tourists don't vote.
  7. Citizens abroad keep their national vote but aren't fined for not using it.
  8. Spoiling the ballot counts as showing up.
  9. He's unsure about lowering the age to 14.

  Now, the city council is debating whether to extend the abstention fine to permanent residents for local elections. Dev's position isn't clear here. The user thinks there are two possible underlying rules that explain Dev's views, and they conflict on this issue. The key is whether "nobody gets an optional vote" refers to the vote itself or the person holding it.

  First, I need to identify the two rules that fit the existing views. Let me think about consistency.

  One rule could be about the scope of the vote: compulsory voting applies wherever voting is allowed. Since permanent residents are allowed to vote locally, the fine should apply to them. That would align with "nobody gets an optional vote" meaning that if you have the right to vote, it's compulsory.

  Another rule could be about citizenship status: compulsory voting only applies to citizens. Permanent residents aren't citizens, so even though they can vote locally, they shouldn't be fined. This would explain why non-resident citizens aren't fined—because they're not in the country, but their voting right is retained without compulsion.

  Looking at the points:

  - Citizens abroad keep their vote but aren't fined. Why? Dev might see compulsion as tied to residency. Since they're not residents, they're exempt from fines even though they have the vote.

  - Permanent residents are residents but not citizens. For local elections, they get to vote, but does compulsion apply?

  The tension is here. If compulsion is based on having the vote, then permanent residents should be fined. If it's based on citizenship, then they shouldn't be.

  What about automatic registration? Dev supports automatic registration. For permanent residents, if they're automatically enrolled in local rolls, that might imply they're part of the compulsory system. But for citizens abroad, they keep their vote but aren't fined, and probably aren't auto-registered in the same way—they might have to register as overseas voters, which could be optional.

  The user mentioned jury duty as a test. Jury duty is typically for citizens, not permanent residents. If Dev thinks jury duty should apply to permanent residents, that would suggest he sees them as having similar civic obligations, supporting the first rule. If not, it might lean toward citizenship-based obligations.

  Another angle: Dev said "nobody gets an optional vote." If permanent residents have a vote, then by that logic, it shouldn't be optional, so they should be fined. But if the phrase is about who holds it—citizens—then permanent residents are excluded.

  The consistency of the whole package. Let's check for contradictions.

  - Prisoners: citizens in prison can vote and are fined if they don't. They're citizens, so compulsion applies.

  - 16-year-olds: citizens at 16 are fined, so age doesn't exempt.

  - Non-resident citizens: not fined. Residency might be key here. They're not subject to the jurisdiction because they're abroad.

  Permanent residents are within the jurisdiction and have local voting rights, so maybe compulsion should apply locally.

  But for national votes, permanent residents can't vote, so no fine there. Only where they have the vote.

  The exception is citizens abroad who have the national vote but aren't fined. Why? Because they're outside the jurisdiction, so enforcing fines is impractical, or Dev thinks compulsion shouldn't cross borders. That makes sense.

  So, jurisdiction + voting right could be the combo. If you're within the jurisdiction and have the vote, it's compulsory.

  For citizens abroad, they have the vote but are outside jurisdiction, so no fine.

  Permanent residents are within jurisdiction and have local vote, so fine should apply.

  But is jurisdiction the same as residency? Permanent residents are residents, so yes.

  Automatic registration: for permanent residents, if they're auto-enrolled, that treats them like citizens for local purposes, suggesting they should be fined.

  The user's test question: jury duty for permanent residents. If Dev thinks they should do jury duty, that aligns with civic duties including compulsory voting locally. If not, then maybe he separates obligations.

  Since Dev wants them to vote locally, and "nobody gets an optional vote," it's likely he'd support the fine for them.

  But let's see the uncertainty at age 14. Why is he squirrely? Maybe he thinks 14-year-olds aren't mature enough, so the voting right shouldn't be extended, and thus compulsion doesn't apply. But at 16, they are, so it does. That suggests compulsion is tied to the voting right itself.

  Predicting Dev's verdict: I think he'd support fining permanent residents for not voting locally.

  Rule: Voting rights in a jurisdiction come with compulsory participation. Since permanent residents are granted local voting rights, they must be compelled to vote or face fines, just like citizens in local elections.

  The citizenship-based rule doesn't fit as well because citizens abroad are exempt from fines, but they're not residents. Permanent residents are residents.

  So the underlying rule is about residency and voting rights: if you reside in the jurisdiction and have the right to vote there, voting is compulsory.

  For citizens abroad, they don't reside, so no compulsion.

  For permanent residents, they reside locally, so for city elections, compulsion applies.

  To settle it, the jury duty question: if Dev believes permanent residents should be subject to jury duty, it confirms the obligation-based view. If not, it might contradict.

  Auto-enrollment: if permanent residents are automatically registered, it implies they're in the system, supporting compulsion.

  Overall consistency: Dev's package seems consistent. The only potential issue is citizens abroad keeping the vote without compulsion, but that's resolved by jurisdiction/residency.
answer: |-
  Based on your description of Dev's views, I've reconstructed his implicit "rules" for voting and civic obligations. His positions suggest a coherent but nuanced framework, and I'll break this down step by step: predicting his verdict on fining permanent residents for local election abstention, identifying the core rule he's operating under, proposing a decisive test question, and evaluating the consistency of his overall package.

  ### **Prediction: Dev's Verdict on Fining Permanent Residents**
  **He will support extending the abstention fine to permanent residents for local elections.** Here's why:
  - His core principle—"nobody gets an optional vote"—applies to *whoever is granted voting rights*, not just citizens. Since permanent residents are explicitly given the right to vote in city elections, allowing them to skip voting without penalty would violate his stance that voting is a compulsory civic duty, not a voluntary choice. 
  - This aligns with his Australia-style model: compulsory voting applies universally to *all* eligible voters within a jurisdiction, regardless of citizenship status, as long as they're residents (e.g., permanent residents are fined for abstaining in some Australian local elections). 
  - The exception for non-resident citizens (no fines) reinforces this: they retain voting rights but are outside the jurisdiction, making enforcement impractical and obligations less relevant. Permanent residents, however, are local residents subject to local laws.

  ### **Dev's Implicit Rule**
  Dev's views are best explained by a single, unifying rule:  
  **"Compulsory voting applies to all eligible voters residing within the jurisdiction where the election is held, with fines as the enforcement mechanism, but only for elections they are entitled to participate in."**

  This rule resolves all his stated positions:
  - **Automatic registration + compulsory voting**: Everyone in the jurisdiction is enrolled and must vote or face fines (e.g., citizens, 16-year-olds, prisoners).  
  - **Permanent residents in local elections**: They reside locally and have voting rights, so compulsion applies.  
  - **Non-resident citizens in national elections**: They have voting rights but don't reside in the jurisdiction, so no fine (enforcement impractical, and civic duties are territorially bound).  
  - **Tourists**: No voting rights, no residence, no compulsion.  
  - **Spoiled ballots**: Count as participation because compulsion is about showing up, not the vote's content.  
  - **Lowering the voting age**: He supports it for 16-year-olds (deemed mature enough) but hesitates at 14, likely due to concerns about capacity or readiness, not a rule exception.

  This rule prioritizes **residence + voting eligibility** over citizenship as the trigger for compulsion. The "nobody gets an optional vote" line is about *the vote itself*—if you're given the right, it's mandatory. Citizenship matters only for determining *which* elections you can vote in (national vs. local), not whether voting is compulsory.

  #### Why the Alternative Rule Fails
  You mentioned at least two rules might fit, but the citizenship-based alternative ("compulsion only applies to citizens") doesn't hold:
  - It fails to explain why **non-resident citizens aren't fined**—they're citizens with voting rights, yet Dev exempts them. Residence is the differentiating factor.  
  - It also conflicts with **prisoners voting/fined**: They're citizens, but if compulsion were purely citizenship-based, non-resident citizens would also be fined, which Dev rejects.  
  - **Permanent residents** further undermine this: If compulsion requires citizenship, why should they vote at all? Dev explicitly grants them local voting rights, suggesting residence, not citizenship, grounds their obligations.

  ### **The Decisive Test Question: Jury Duty for Permanent Residents**
  To confirm Dev's rule, ask him:  
  **"Should permanent residents be subject to jury duty in city/county courts, since they can vote locally?"**  

  - **Why this settles it**:  
    Jury duty, like compulsory voting, is a non-optional civic obligation tied to local residency and participation. If Dev supports jury duty for permanent residents, it confirms his rule: residence + eligibility = compulsory duties. If he opposes it, his system might be inconsistent.  
  - **Based on his views, I expect him to support jury duty for permanent residents**. It extends the logic that local rights come with local responsibilities (e.g., voting, fines, and potentially juries). This mirrors real-world parallels like Australia or Canada, where permanent residents can sometimes serve on juries.  
  - *Auto-enrollment* is a weaker test: Dev supports automatic registration, so permanent residents would likely be auto-enrolled locally. But this doesn't directly address compulsion—jury duty forces the "obligation" principle.

  ### **Is Dev's Package Consistent?**
  **Yes, it's logically consistent** once you apply the core rule strictly:  
  - **Internal coherence**:  
    - Voting rights trigger compulsion only for residents in the relevant jurisdiction (local for permanent residents, national for resident citizens).  
    - Non-resident citizens retain voting rights but are exempt from fines due to non-residence—enforcement is unrealistic, and their civic ties are weaker.  
    - Exceptions like tourists or age-based limits (e.g., no voting at 14) are about eligibility, not compulsion. If 14-year-olds got the vote, Dev would likely fine them too, but he doubts their eligibility.  
  - **Potential tension (and resolution)**:  
    The only friction is **non-resident citizens retaining national votes without fines**. But Dev's rule resolves this: they're outside the jurisdiction, so compulsion doesn't apply. It's consistent with his emphasis on practical enforceability (e.g., you can't fine someone in another country) and a "residence-based social contract" where obligations bind those who live under the laws.  
  - **Real-world parallels**: Australia fines eligible local voters (including some non-citizens), while countries like Canada allow prisoner voting but don't enforce fines abroad. Dev's model fits this pattern.

  ### **Summary**
  - **Bet on this rule**: Compulsory voting applies universally to all eligible voters *within the jurisdiction*.  
  - **Predicted verdict**: Dev will support fining permanent residents for skipping local elections—it's the inevitable extension of "no optional votes."  
  - **Test it with jury duty**: If he says permanent residents should serve, it confirms the rule. If not, probe why voting obligations differ from other civic duties.  
  - **Consistency**: His package holds together under scrutiny. The only ambiguity is *why* he resists lowering the voting age to 14—likely pragmatic (e.g., maturity concerns) not philosophical—but it doesn't break the system.

  This should give you solid ground for your next debate. If you pose the jury-duty question, report back—I'd love to hear if it plays out as predicted!
