prompt: |-
  A friend and I spent most of Sunday arguing about Strawson's appeal to the reactive attitudes, and I came away with a position I now have to defend in public. My view is that the reactive attitudes — resentment, gratitude, indignation, and the rest — can be justified even if hard determinism turns out to be true, but not, as Strawson implied, by placing them beyond the reach of rational justification altogether. My friend pressed me until I admitted the stronger claim I actually wanted to make: that a justification is available, but a forward-looking one. On my account the reactive attitudes are defensible insofar as they operate as a calibration system for shared expectations of conduct — resentment is less a verdict on a past deed than a signal that recalibrates what the community can expect of one another going forward — so their proper target is character formation rather than backward-looking desert.

  In three weeks I present this at a workshop on criminal responsibility at an institute of criminology. The room will be roughly a dozen retributivist criminal law theorists who take desert to be basic and non-derivable; one legal psychologist who studies how juries actually assign blame; and two graduate students sympathetic to the view that neuroscience has already dissolved desert. My friend will be in the audience and argues like a prosecutor. His core objection, which I expect others to echo, is that the whole thing quietly collapses into consequentialism: if the attitudes are justified by what they do for future behaviour, then sentencing policy should simply be set by outcomes, and the reactive attitudes become at best a sentimental instrument for achieving them. I half suspect he is right in at least one place, and I would much rather know where before I stand up.

  Please draft my Q&A prep sheet: the eight or so objections this particular audience is likely to raise, ordered by how much damage each would do, each phrased the way that audience would phrase it — the retributivists in the vocabulary of desert and commensurate punishment, the psychologist in terms of empirics, the students in terms of mechanism and the readiness-potential literature — with a reply I can deliver in about two minutes, a note on where each reply is soft, what I should concede up front rather than contest, and the one question I am hoping nobody asks. Begin with the bottom line in your first sentence: a single sentence identifying which objection is most likely to sink the paper if I handle it badly. Then give the reasoning, with no preamble and no restating of my question. Please answer in American English.
reasoning: |-
  Okay, the user is preparing to defend a position on Strawson's reactive attitudes against hard determinism, focusing on forward-looking justification. They need a Q&A prep sheet for a workshop with a specific audience: retributivists, a legal psychologist, and neuroscience-oriented grad students. The main concern is an objection that their view collapses into consequentialism, which could undermine their entire argument.

  First, I need to identify the most damaging objection. The collapse-into-consequentialism point seems critical because it challenges the core of their forward-looking approach. If not handled well, it could alienate retributivists who value desert as fundamental and make others dismiss the theory as merely instrumental.

  Next, organizing the objections by damage potential. The consequentialism objection tops the list. Then, addressing retributivists' concerns about desert's irreducibility is key since they form the majority. The psychologist might question empirical support, which needs data-based replies. The grad students' neuroscience arguments require engaging with Libet's experiments but emphasizing that intentions still matter for social practices.

  For each objection, phrasing matters. Retributivists will use desert-focused language, the psychologist will cite jury studies, and students will mention readiness potentials. Replies should be concise, acknowledging weaknesses where necessary. For example, conceding that desert isn't basic but arguing its functional role in social regulation.

  The user also wants to know the one question they hope isn't asked. Probably something about neuroscience precluding responsibility entirely, which would force them into a defensive position against hard determinism, risking alienation. Preparing a bridge to moral responsibility without contra-causal freedom is crucial here.

  I should ensure each reply fits a two-minute timeframe, is in American English, and directly addresses the objection without preamble. Highlighting where replies are soft helps the user anticipate pushback. For instance, admitting that desert is repurposed might not satisfy retributivists but is necessary for honesty.

  Finally, structuring the prep sheet with the highest damage objection first, followed by others in descending order. Including notes on concessions and soft spots ensures the user is prepared for tough follow-ups. The goal is to present the user as thoughtful and responsive, even when facing challenging critiques.
answer: |-
  Here is your Q&A prep sheet, prioritizing objections by potential damage:

  **Bottom Line:** The objection that your view collapses into consequentialism, thereby eliminating desert as a fundamental concept and reducing reactive attitudes to mere tools for behavior modification, is most likely to sink your paper if handled poorly, as it directly challenges the core distinction you're trying to maintain and alienates the retributivist majority.

  **Objection 1 (Retributivist): "This is just consequentialism in disguise. If resentment is merely a 'signal' for future calibration and punishment aims at 'character formation,' you've stripped desert of its intrinsic moral significance as the *justifying reason* for blame and punishment. Sentencing based purely on future outcomes, not desert, is the logical endpoint, making attitudes sentimental tools."**
  *   **Reply (1.5 min):** "You're right that consequentialist *effects* are central to my justification, but wrong that desert vanishes. Desert isn't the metaphysical *basis* but the essential *form* and *content* of the practice. The feeling of resentment *itself* inherently involves the *judgment* of undeserved injury ('You *shouldn't* have done that to me'), which *is* the desert claim. My argument is that this entire practice of holding agents responsible via desert-claims is justified *because* it effectively regulates expectations and shapes character within a community. Desert remains the internal logic; instrumental value is the external justification."
  *   **Soft Spot:** Conceding desert isn't fundamental/metaphysically basic. Retributivists see this as conceding the game. Emphasize that the *experience* and *practice* of desert remains real and necessary within the system.
  *   **Concede:** "I agree desert isn't a non-derivable, metaphysically basic fact in the way you propose. Its justification lies in its social function."

  **Objection 2 (Retributivist): "You've misunderstood desert. It *requires* ultimate responsibility – the agent *could have done otherwise* in a robust, contra-causal sense. Your 'forward-looking' justification sidesteps this requirement entirely, making it irrelevant whether the agent *truly deserved* blame in the past, only whether blaming now shapes future behavior."**
  *   **Reply (1.5 min):** "My point is precisely that Strawson showed we don't *need* that robust contra-causal freedom to sustain the practice. The reactive attitudes *are* our natural responses to perceived quality of will, regardless of ultimate responsibility. My justification accepts hard determinism and asks: 'Given that we *will* feel resentment etc., and that these attitudes exist, what *function* do they serve that makes continuing this practice rational?' The answer is the calibration of expectations. The 'desert' we experience is tied to the quality of will *as we perceive it*, not to ultimate origination."
  *   **Soft Spot:** Doesn't satisfy retributivists who insist ultimate responsibility is non-negotiable for *true* desert. It redefines desert functionally.
  *   **Concede:** "You're correct that on hard determinism, the agent lacked ultimate, contra-causal freedom. My argument is that the *practice* of holding responsible, with its inherent desert-feelings, remains justified and necessary."

  **Objection 3 (Retributivist): "This makes punishment inherently manipulative and disrespectful. Punishing someone *for* their future character or the community's future expectations treats them as a means to an end, not as someone who *deserved* that specific punishment *for their past deed*."**
  *   **Reply (1.5 min):** "Respect is central. The practice respects individuals as *agents capable of understanding and responding to reasons and expectations*. The reactive attitude itself expresses the demand: 'See yourself as someone answerable to us for your will's expression.' The *justification* for sustaining this practice is forward-looking, but the *encounter* within the practice is about holding you responsible *now* for what you *did then*, based on your will. Calibration happens *through* the backward-looking address, respecting your agency by treating your past act as truly *yours* and demanding accountability."
  *   **Soft Spot:** Risk of conflating justification and experience. The "respect" argument needs careful handling to avoid sounding hollow without ultimate responsibility.
  *   **Concede:** "The *ultimate justification* is indeed instrumental. But the *mode* of engagement within the practice is one of interpersonal address demanding accountability, which *is* a form of respect for agency."

  **Objection 4 (Legal Psychologist): "Empirical data shows juries and individuals *do* make backward-looking desert judgments intuitively (e.g., considering intent, harm, mitigating factors). Your 'calibration' model seems descriptively inaccurate. How does it account for the observed phenomenology of blame assignment?"**
  *   **Reply (1.5 min):** "It fully accounts for it! My model doesn't deny the phenomenology; it explains *why* that phenomenology exists and persists. The feeling of desert *is* the psychological mechanism *through which* the calibration signal is sent and received. The intense focus on intent, harm, and excuses *is* how we assess the quality of will needing calibration. Juries meticulously examining the past deed *is* the process of determining the precise nature of the expectation violation and the strength of signal needed. The backward-looking *form* is essential to the forward-looking *function*."
  *   **Soft Spot:** Strong. Leverage this – it's where your view aligns well with observation.
  *   **Concede:** Nothing major. Emphasize compatibility: "Exactly! My theory explains *why* we have those strong backward-looking intuitions – they are the engine of the calibration system."

  **Objection 5 (Graduate Student): "Neuroscience (e.g., Libet, readiness potential) suggests conscious intention follows unconscious neural preparation. Doesn't this mechanistic view of decision-making directly undermine the 'quality of will' you rely on, making reactive attitudes responses to neural noise, not meaningful agency?"**
  *   **Reply (1.5 min):** "The Libet debate is complex, but even if we grant unconscious initiation, the *content* of the conscious intention, the *endorsement* or *veto* of impulses, and the *expression* of the will in action remain critical. The reactive attitudes respond to that *expression* – the action manifesting a disregard for others. Neuroscience describes the mechanism; it doesn't erase the interpersonal significance of the *act* judged by its impact and the apparent attitude it reveals. We respond to the *person* as manifested, not the sub-personal machinery. The calibration is about that manifest agency."
  *   **Soft Spot:** Hard determinists/eliminativists will push harder on whether "manifest agency" is sufficient or just an illusion. Requires careful distinction between levels of description.
  *   **Concede:** "Neuroscience certainly challenges simple views of free will. But it doesn't change the fact that we experience ourselves and others as agents whose actions express intentions, and our social practices operate at that level."

  **Objection 6 (Retributivist): "If the goal is future calibration, doesn't this justify disproportionate punishment? If shocking severity best 'calibrates' community expectations for minor offenses, is that acceptable? Your model lacks the intrinsic limiting principle of commensurate desert."**
  *   **Reply (1.5 min):** "Not at all. Effective calibration requires proportionality. Excessive resentment or punishment for a minor violation sends a distorted signal about the *actual* expectations and the seriousness of breaches. It damages trust and cooperation, undermining the system's goal. The internal logic of the reactive attitude itself carries an implicit demand for proportionality – resentment feels fitting or excessive relative to the perceived slight. The 'commensurate' element is built into the expressive function of the attitude for effective communication and stability within the practice."
  *   **Soft Spot:** Requires faith that "effective calibration" inherently demands proportionality. Critics might argue effectiveness could sometimes demand severity beyond desert (e.g., deterrence). Need to tie proportionality tightly to the *expressive* function of the attitude itself.
  *   **Concede:** "The justification doesn't *directly* invoke a metaphysical 'eye for an eye' principle. Proportionality emerges from the functional requirements of the practice."

  **Objection 7 (Graduate Student/Retributivist Hybrid): "If character is the target, and character is largely shaped by factors beyond one's ultimate control (genes, environment), how can resentment aimed at 'character formation' be fair? Isn't this just blaming people for their bad luck?"**
  *   **Reply (1.5 min):** "The focus isn't on blaming the *existence* of a character flaw metaphysically, but on responding to its *expression* in harmful action. The aim of formation is to engage the agent's *current* capacity for reason-responsiveness. We hold people responsible *because* they *can* (in a compatibilist sense) understand and respond to expectations, even if their starting point wasn't chosen. The resentment says, 'You, *as you are now capable of understanding*, disregarded a fundamental norm.' Calibration works *with* the capacities the agent possesses."
  *   **Soft Spot:** Doesn't fully escape the "luck" problem; it mitigates it by focusing on present capacities. Still vulnerable to the hard determinist critique.
  *   **Concede:** "Absolute, ultimate fairness is impossible if hard determinism is true. My claim is that *this practice* is the fairest and most functional way to regulate a society of non-ultimately-free agents."

  **Objection 8 (Retributivist): "This reduces morality to social engineering. What about the victim's right to see the perpetrator suffer *for what they did*, not just for future effect? Doesn't your model ignore this fundamental retributive intuition?"**
  *   **Reply (1.5 min):** "The victim's resentment is central! It *is* the primary calibration signal from the most directly wronged party. The victim's demand for recognition and accountability *is* the backward-looking desert claim. My justification explains why *honoring that feeling and demand* through the practice is crucial: it validates the victim, affirms the violated norm, and *thereby* effectively recalibrates expectations. The victim's need isn't ignored; it's the very engine driving the calibration. The 'suffering' of the perpetrator is the experiential correlate of being held accountable within this necessary practice."
  *   **Soft Spot:** May not satisfy those who see the victim's desire for retribution as intrinsically valuable beyond its functional role. The "honoring" might feel secondary.
  *   **Concede:** "The intrinsic satisfaction of retribution *for the victim* is a powerful psychological reality. My justification locates its societal value in its functional role within the broader practice."

  **The Question You Hope Nobody Asks:** "If hard determinism is true and reactive attitudes are *merely* a biological/social calibration mechanism with no connection to ultimate desert, why *should* we maintain the *illusion* of desert? Couldn't we achieve better calibration more efficiently and humanely through direct behavioral engineering (e.g., neurointervention, sophisticated nudges) without the painful, potentially excessive baggage of resentment and blame?"
  *   **Why it's Dangerous:** It forces you to either 1) Defend the intrinsic, non-instrumental value of the reactive attitudes/desert experience (contradicting your forward-looking justification), 2) Advocate for potentially dystopian alternatives, or 3) Appear to concede that maintaining the "illusion" is merely pragmatic tradition, undermining the normative force of your justification.
  *   **Potential Bridge Reply (Very Difficult):** "The 'illusion' *is* our lived moral reality. Abandoning the participant stance and the language of desert wouldn't just change tools; it would fundamentally dehumanize us, dissolving the relationships of mutual accountability that constitute our identity as persons. The reactive attitudes, for all their pain, *are* the expression of taking each other seriously as moral agents. Even if grounded in mechanism, that experience is constitutive of meaning and respect as we understand it. Direct engineering bypasses agency; the participant stance engages it, which is essential for true character *formation* (not just behavioral control) and respecting our self-conception as reason-responsive beings." (This leans heavily on Strawson's participant stance argument, which you differentiated from, but might be a necessary fallback).
