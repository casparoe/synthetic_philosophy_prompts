prompt: |-
  Two camps in my research group have been arguing past each other for a year about the moral emotions: the guilt camp, holding that guilt — private, act-focused, tied to conscience and repair — is the superior moral emotion, and that cultures do well to minimize shame, which they see as pathological, identity-scorning, and prone to hiding rather than amends; and the shame camp, holding that shame is the community-rooted emotion that makes moral formation possible at all, and that modern psychology has pathologized it only because it is embedded in cultures that have already lost the practices that once made shame constructive. We have finally gotten both sides to sit down for a proper adversarial collaboration, and I need the joint statement they should walk out with. Produce a numbered agreed-claims section — claims both sides could sign, covering at minimum what each emotion does, what makes an emotion a *moral* emotion, and what any plausible reading of the cross-cultural record establishes at least this much — followed by a disagreements table stating, in wording each side would accept for its own view, precisely where they part ways (candidate rows: whether shame's proper object is the whole person or the person-as-seen-by-others; whether an emotion's tendency to produce avoidance and concealment disqualifies it as a moral emotion or is simply a cost that well-designed practices can manage; whether guilt is really act-focused or secretly borrows shame's self-evaluation machinery; and whether a culture can genuinely *choose* its emotion profile, or only drift into one and rationalize it afterward). Then list the cruxes — sub-questions such that settling them would move at least one side — and for each crux, one concrete case, argument, or line of evidence both camps would agree bears on it, with each camp's prediction about that case written down in advance. If you conclude that part of the dispute is merely verbal — for instance, if 'shame' is being used both for the crushing exposure of dishonor and for the constructive felt evaluation of oneself against an internalized ideal — identify exactly which part, and why splitting the terminology would dissolve it without dissolving the real disagreement underneath.
