  We are constructing a thought experiment to test David Lewis's representation-based defense of penal substitution. The scenario must be secular and realistic, involving a military flogging regime or similar. We need three features: (1) the substitute volunteers with full understanding, (2) the offender accepts the substitute as representative, and (3) the punishment achieves the justifying aim (e.g., deterrence). The challenge is that a retributivist should still object (punishing the innocent is wrong even with consent and good effects), while the Lewisian view says it's fine (because the punishment event counts as the offender's via representation), and a consequentialist is indifferent (if the good effects are the same).

  **Scenario:**

  In a military unit with a strict disciplinary code, Private Miller commits a severe offense: striking an officer during a dispute. The prescribed punishment is a public flogging of 50 lashes. Miller's father, a retired Colonel with a spotless record, volunteers to take the flogging in his son's place. He fully understands the pain and potential long-term effects. Miller, deeply ashamed and remorseful, accepts his father as his representative, acknowledging that the flogging his father endures is his own punishment. The unit commander agrees to the substitution. The flogging is carried out publicly on the father. The spectacle serves as a powerful deterrent: unit cohesion is restored, respect for the chain of command is reaffirmed, and the expression of societal condemnation is undiminished. Moreover, Miller is rehabilitated by the experience, vowing never to repeat such behavior.

  **Analysis:**

  1. **Retributivist Verdict:** The retributivist holds that punishment is justified only if it is deserved by the offender for the wrong committed. Here, the father is innocent (he did not strike the officer) and thus does not deserve the punishment. Punishing him is intrinsically wrong, regardless of consent, representation, or good consequences. The retributivist objects: justice requires that the guilty suffer, not the innocent. The flogging of the father is a miscarriage of justice.

  2. **Lewisian View:** Lewis argues that if there is a suitable representation relation (like the offender accepting the substitute as their representative), then the punishment event can be counted as the offender's punishment. Here, Miller accepts his father as his representative, and the father volunteers. Thus, the flogging event is not a stand-in for Miller's punishment; it literally is Miller's punishment. The representation relation transfers the desert: the punishment is inflicted on Miller (via the representative) and thus satisfies retributive justice. The Lewisian view approves: the punishment is just because it is Miller's, not because of the good effects.

  3. **Consequentialist Verdict:** The consequentialist (e.g., utilitarian) cares only about the outcomes. Here, the flogging achieves the same deterrent effect, expressive function, and rehabilitation as if Miller had been flogged. Since the consequences are identical (or even better, given the father's high status making the spectacle more impactful), the substitution is permissible and even commendable. The consequentialist is indifferent to who is punished as long as the good effects are achieved.

  **Which Feature Drives the Retributivist's Verdict?**

  The retributivist's objection is driven by the fact that an *innocent* person is being punished. The key feature is that the substitute (the father) is innocent of the offense. The retributivist believes that desert is non-transferable: the offender must bear the punishment because they are the one who deserves it. The volunteering (1) and the representation (2) do not override this; they are irrelevant to desert. The good effects (3) are also irrelevant because retributivism is not consequentialist.

  **Removing One Feature:**

  Suppose we remove the representativeness feature (2): Miller does not accept his father as his representative. The father still volunteers (1) and the punishment achieves its effects (3). Now, the retributivist still objects (punishing an innocent) and the consequentialist still approves (good effects). But the Lewisian view would now object: without representation, the flogging is not Miller's punishment; it's just the punishment of an innocent volunteer. So the Lewisian now joins the retributivist in objecting, but for different reasons (lack of representation, not innocence per se). The retributivist's objection remains unchanged because the father is innocent.

  Alternatively, if we remove the volunteering (1): the father is forced to take the punishment. Then everyone objects: retributivist (punishing innocent), Lewisian (no representation? or at least no consent, which might be part of the representation relation), consequentialist (if forced, it might cause more harm than good, e.g., public outrage). But if we keep representativeness and good effects but remove volunteering, the Lewisian might still object because representation requires consent? Lewis's view typically requires the substitute to be a willing representative.

  If we remove the good effects (3): the punishment doesn't achieve deterrence, etc. Then the consequentialist objects (no good effects), the retributivist still objects (punishing innocent), and the Lewisian might approve if representation is intact (since for Lewis, the representation makes it the offender's punishment, so it's deserved and thus just, even without good effects? But Lewis is not a pure retributivist; his move is about making penal substitution consistent with retributivism. In this case, the Lewisian might say the punishment is just (because it is Miller's) but perhaps not required if no good comes of it? But that's a separate issue. The point is: the Lewisian view can still say the substitution is permissible in principle even if no good effects occur, because the representation makes it the offender's punishment.)

  **The Retributivist's Strongest Move:**

  The retributivist's strongest move is to deny that representation can transfer desert. They argue that desert is inherently personal: only the offender can deserve punishment for their own wrongdoing. No social convention or act of consent can change that. The flogging of the father is not Miller's punishment; it is the father's, and the father is innocent. Thus, it is unjust.

  **Cost of this Move:**

  This move is not cheap; it comes at a cost. It requires the retributivist to reject any form of vicarious punishment or representation in punishment, even in cases where it seems intuitively acceptable (e.g., a corporation paying a fine for an employee's wrongdoing, where the fine is seen as the corporation's punishment). The retributivist must bite the bullet and say that such practices are unjust because they punish the innocent (e.g., shareholders who didn't commit the offense). This might conflict with common legal practices and moral intuitions about collective responsibility. Moreover, it makes retributivism inflexible and perhaps unable to account for why we allow fines on corporations or even parental responsibility for children's torts in some cases. The retributivist must either reject these practices or offer a different account (e.g., that the corporation is morally responsible as a collective). This move thus isolates retributivism and may make it less plausible as a comprehensive theory of punishment.

  **Conclusion for the Paper:**

  The scenario successfully distinguishes the views: the retributivist objects on grounds of punishing the innocent, the Lewisian approves due to representation, and the consequentialist approves due to outcomes. The retributivist's objection is driven by the innocence of the substitute, not the lack of volunteering or good effects. Denying representation's power to transfer desert is a strong retributivist move but comes at the cost of rejecting common practices and intuitions about representation in punishment. This suggests Lewis's move is a real defense (if one accepts representation) and not mere sleight of hand, because it forces the retributivist into a costly position.
