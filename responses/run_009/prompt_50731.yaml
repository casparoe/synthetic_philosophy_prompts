  ### Thought Experiment: The Military Tribunal  
  In a tightly-knit naval unit operating under a strict disciplinary code, Ensign Kara commits a grave offense: sabotaging critical equipment during a mission, endangering the crew. The mandatory punishment is a public flogging (40 lashes), designed to uphold discipline and deter future breaches. Kara’s twin sibling, Lieutenant Alex—identical in appearance and stature, but innocent of the crime—volunteers to take the punishment after extensive deliberation, fully grasping the physical and psychological toll. Kara, overwhelmed by guilt and recognizing the sacrifice, explicitly accepts Alex as their representative, declaring before the unit: "This flogging is *my* punishment, borne by Alex for me." The commodore, prioritizing unit cohesion, approves the swap. The flogging proceeds: Alex is whipped publicly while Kara watches. The spectacle deters potential offenders, expresses the unit’s condemnation of sabotage, and catalyzes Kara’s genuine rehabilitation—they return to duty with renewed commitment. All effects of punishment (deterrence, moral expression, rehabilitation) are identically achieved as if Kara had been punished.  

  ### Analysis of the Three Views  
  1. **Retributivist Verdict**: The retributivist condemns the swap as impermissible. Retributivism holds that punishment must be inflicted *on the guilty* because they *deserve* suffering for their wrongdoing, irrespective of consequences or consent. Here, Alex is innocent—they did not commit sabotage—so punishing them violates the core retributivist principle that only the deserving may be punished. The voluntariness and representativeness are irrelevant; desert is non-transferable. The good effects (deterrence, etc.) do not justify punishing an innocent, making the act intrinsically unjust.  
  2. **Lewisian View**: The Lewisian approves. David Lewis’s representation relation (where the offender accepts the substitute as their representative) re-describes the event: the flogging of Alex *is* Kara’s punishment, not a stand-in. Since Kara accepts Alex as their representative, the punishment-event literally constitutes the offender’s deserved suffering. Voluntariness and representativeness together satisfy retributive justice by binding the punishment to the offender via representation, rendering it permissible.  
  3. **Consequentialist Verdict**: The consequentialist is indifferent or approves. If punishment’s justification lies in its effects (e.g., deterrence, moral expression), and those effects are fully achieved—even enhanced by the dramatic substitution—then who suffers is irrelevant. The swap maximizes good outcomes, so it is permissible. Consent and representativeness may facilitate these effects but are not morally necessary.  

  ### Identifying the Key Driver of the Retributivist’s Verdict  
  The retributivist’s objection is driven **entirely by the substitute’s innocence** (i.e., the absence of desert in Alex), not by the lack of voluntariness or representativeness. To isolate this, remove **voluntariness (Feature 1)** while keeping representativeness (Feature 2) and good effects (Feature 3): Suppose Alex is *coerced* into substitution (e.g., the commodore threatens Alex’s career if they refuse), but Kara still accepts Alex as their representative, and the punishment achieves all benefits. The retributivist *still objects*—punishing an innocent remains wrong. The Lewisian now objects too, as representation requires voluntariness (Lewis’s model demands the substitute’s free agency). The consequentialist may object if coercion reduces net utility (e.g., via crew resentment) but could approve if effects are preserved. Crucially, the retributivist’s core objection persists because Alex’s undeserved suffering is unchanged. By contrast, removing representativeness (Feature 2) or good effects (Feature 3) does not alter the retributivist’s verdict: without representation, the Lewisian joins the objection, but the retributivist still objects to punishing Alex; without good effects, the consequentialist objects, but the retributivist’s objection remains. Thus, the retributivist’s stance hinges solely on the substitute’s innocence.  

  ### The Retributivist’s Strongest Countermove and Its Cost  
  The strongest retributivist move is to **deny that representation can transfer desert**. They argue desert is an objective, non-relational property tied to the offender’s personal moral guilt: no social act (consent, representation) can “move” desert from Kara to Alex, as desert arises from Kara’s own wrongdoing. Punishing Alex is thus inherently unjust, as it inflicts suffering on someone who lacks the requisite desert.  
  **Is this move cheap or costly?** It is **costly**, not cheap. It forces the retributivist to reject intuitive cases where representation *seems* morally acceptable, undermining their theory’s plausibility. For example:  
  - In corporate law, shareholders (innocent of misconduct) bear fines for a company’s wrongdoing via legal representation.  
  - In family law, parents pay damages for a child’s torts as their representatives.  
  The retributivist must condemn these practices as unjust, requiring them to either advocate for abolishing such norms (a socially revisionist stance) or introduce ad hoc exceptions (weakening retributivism’s consistency). This move also exposes retributivism to charges of inflexibility—it cannot accommodate deeply held intuitions about voluntary sacrifice (e.g., a soldier taking a bullet for a comrade), where representation feels morally coherent. Thus, the cost is theoretical and practical: retributivism becomes less adaptable to real-world moral and legal practices.  

  ### Conclusion for the Paper  
  This scenario cleanly discriminates between Lewis’s defense and sleight of hand: if representation genuinely transfers desert (as Lewis claims), the swap *satisfies* retributive justice, making it a robust defense. If representation cannot transfer desert (as the retributivist insists), Lewis’s move collapses into semantic trickery. The experiment reveals that Lewis’s view is a real defense—it leverages a credible metaphysics of representation to resolve the paradox—but its success hinges on whether desert can be relationally constituted. The retributivist’s costly countermove highlights that rejecting Lewis requires abandoning everyday notions of vicarious responsibility, suggesting penal substitution’s coherence depends on deeper commitments about moral ontology.
