prompt: |-
  Two of my teammates got into a proper argument after standup the other day about whether one of them "broke a promise," and honestly I couldn't follow who was winning. Context: we're mid-migration, and three weeks ago Dev posted in our team channel "I promise the search migration will be done before the Friday freeze." It wasn't. When our PM brought it up at retro, Dev said he never actually promised anything, and that kicked off a whole thing with Mara, our tech lead. I'll try to reproduce the rounds roughly as they happened.

  (1) Dev: typing "I promise" in a Slack message isn't a real promise. Words that actually DO things — like saying "I do" at a wedding, or "I resign" in a letter — need the right setting for them, and a casual work chat isn't that setting. So his message was just a statement of intent, i.e. him saying he'd try.

  (2) Mara: that's nonsense — people resign by email all the time and it clearly counts, so written performatives are still performatives. Plus the whole channel saw the message, so if anything it's more binding than a quiet verbal promise made to one person in a hallway, which nobody would deny counts.

  (3) Dev: ok but a promise isn't a contract, there's nothing to enforce, so the words don't magically create an obligation. All he did was make a prediction about his own future behaviour that turned out wrong — and nobody thinks you owe the world an apology for a bad weather forecast.

  (4) Mara: by that reasoning nothing anyone ever says commits them to anything unless it's legally binding, which obviously can't be right — "I'll pick you up from the airport" creates a genuine obligation without any contract. And she said the fact that Dev is now litigating the technical definition of "promise" instead of just owning the miss is kind of the whole point: he's using the form of words as a technicality to hide behind, like a guy who says "I never SAID the car had no accidents, I just didn't mention it."

  Dev's last word was that Mara's airport example cuts against her, because the reason you feel obliged to pick someone up is that they'll be stranded if you don't — it's the consequence that obliges you, not the utterance — and if the migration had been done by Friday nobody would care what words he used.

  Can you go through their exchange move by move and say who's right at each step, not just who wins overall? I'd especially like to know if theres a principled way to distinguish a promise from a plain prediction about your own future behaviour (Dev kept acting like they're the same thing and I couldn't articulate why that felt off). And is there something both of them are missing? Please answer in British English — spellings and all.
reasoning: |-
  Okay, let me try to figure out this situation. The user described a disagreement between two teammates, Dev and Mara, about whether Dev broke a promise regarding a migration task. 

  First, I need to unpack the core issue: what constitutes a promise in a work context. Dev claims his Slack message wasn't a real promise because it lacked formal setting, while Mara argues it was binding due to public declaration and team reliance. 

  Looking at their exchange:
  Dev's first point about "casual setting" seems weak - people make commitments via email/Slack daily. Mara effectively counters this with the resignation example. 

  Dev's second argument equating promises to weather forecasts feels disingenuous. Promises involve personal agency in a way forecasts don't. Mara's airport analogy is stronger here - social obligations exist beyond legal contracts.

  The user's deeper concerns seem to be about team accountability and communication norms. They need help distinguishing between predictions and commitments, and establishing when words create obligations. 

  I should address the linguistic philosophy aspect (performative utterances) but ground it in workplace pragmatics. The key distinction lies in intention to commit versus mere forecasting, especially when others rely on it. 

  Both parties miss the team dynamics angle - how public commitments affect trust regardless of semantic debates. The retro should focus on preventing future misses rather than litigating definitions.

  For the British English request, I'll ensure spellings like "litigating" and phrases like "whilst" are used consistently throughout.
answer: |-
  Right then, let's break down this philosophical punch-up in the office, move by move, with a spot of British English analysis. The crux is whether Dev's Slack message constituted a *promise* or merely a *prediction*, and what obligations arise from each.

  **The Exchange Analysed:**

  1.  **Dev's Move 1 (Setting Argument):** "typing 'I promise' in a Slack message isn't a real promise... it was just a statement of intent."
      *   **Analysis:** Dev leans heavily on the **formal setting theory** of performative language (like Austin's ideas). He argues Slack lacks the requisite formality for words like "I promise" to *do* something (create an obligation).
      *   **Who's Right?** **Mostly Wrong.** While grand performatives (wedding vows) need specific contexts, everyday promises absolutely *do* work in informal written settings like emails, texts, and Slack. Promising your boss you'll finish a report via email *is* a promise. Mara's counter about resignations via email is spot-on and undermines this. The *intention* conveyed by the words matters hugely.

  2.  **Mara's Move 1 (Written & Public Binding):** "that's nonsense... written performatives are still performatives... [it's] more binding than a quiet verbal promise..."
      *   **Analysis:** Mara correctly dismantles Dev's formality argument. She emphasises two key points: (1) Written words *can* perform actions (resignation, promises), (2) A *public* declaration often *strengthens* the perceived obligation because it invites reliance from a wider audience.
      *   **Who's Right?** **Largely Right.** She accurately identifies the flaw in Dev's setting argument. The publicity *does* matter – making a commitment publicly to the team increases the expectation and reliance, making it *feel* (and often *be*) more binding socially than a private whisper.

  3.  **Dev's Move 2 (No Obligation / Prediction Argument):** "a promise isn't a contract... the words don't magically create an obligation... just a bad prediction... like a weather forecast."
      *   **Analysis:** Dev shifts ground. Having lost the 'setting' argument, he now argues that *even if* it was a promise, promises aren't legally enforceable contracts, so no *real* obligation exists. He equates it to a prediction about external events (weather).
      *   **Who's Right?** **Wrong, and potentially disingenuous.** This is the core confusion. **Distinction: Prediction vs. Promise:**
          *   **Prediction:** A statement about a future event *outside your direct, sole control* ("It will rain tomorrow", "The project *might* be done Friday"). No personal commitment is implied. Being wrong might require an explanation, but not an apology for *breaking a commitment*.
          *   **Promise:** A commitment to *make a future event happen* through *your own actions* ("I *will* have the report done by Friday", "I promise the migration *will* be done"). It implies personal agency, commitment, and creates an expectation of reliance in others. Breaking it *does* typically require an acknowledgment/apology for failing *your commitment*, not just being wrong.
      *   Dev conflates predicting his *own* actions (which he *can* control) with predicting the weather (which he cannot). His message explicitly used "I promise" about an outcome *directly dependent on his work*. That signals commitment, not just forecasting.

  4.  **Mara's Move 2 (Social Obligation & Bad Faith):** "by that reasoning nothing commits anyone... 'I'll pick you up' creates obligation... Dev is litigating definitions to hide... like omitting car history."
      *   **Analysis:** Mara correctly identifies that obligations exist beyond legal contracts (social, moral, professional). Her airport example is strong – it creates a reliance and obligation through the *social contract*. She also astutely points to Dev's behaviour: arguing semantics instead of acknowledging the miss *is* the problem, suggesting he's hiding behind the word "promise" after the fact.
      *   **Who's Right?** **Largely Right.** She accurately describes the social reality of promises and obligations. Her point about Dev's defensive semantics being revealing is perceptive. The "omission" analogy, while not perfect, highlights the perceived bad faith in trying to redefine the commitment *after* failure.

  5.  **Dev's Last Move (Consequence Creates Obligation):** "The airport obligation is due to consequences (stranding), not the words... If migration was done, words wouldn't matter."
      *   **Analysis:** Dev makes a partial but misleading point. Consequences *do* heighten the *seriousness* of a broken promise and the *feeling* of obligation. However, he's wrong to say the *utterance itself* doesn't create the *initial* obligation. The act of promising *is* what triggers the expectation and reliance that *lead* to the potential negative consequences. If you casually say "I *might* pick you up" and don't, the obligation/apology is weaker than if you said "I *promise* I *will* pick you up". The words frame the commitment.
      *   **Who's Right?** **Partially Right, Mostly Wrong.** Consequences amplify the *impact* of breaking a promise, but they don't negate the fact that the *promise itself* created the expectation and reliance that make those consequences matter. If the migration was done, the *words* wouldn't be *contested*, but they still would have *done their job* by signalling commitment and setting expectations during the waiting period.

  **The Principled Distinction: Promise vs. Prediction**

  *   **Prediction:** Primarily describes a future state of the world. Focus is on *accuracy*. Agency may or may not be involved. If it involves your own actions, it's often a weak or implicit commitment ("I *think* I'll finish Friday").
  *   **Promise:** Primarily commits the speaker to *causing* a future state of the world through their actions. Focus is on *commitment* and *reliability*. It explicitly invites others to *rely* on that outcome. Using "I promise," "I will [do X]," or "I commit to [Y]" are strong signals.

  **What Both Might Be Missing:**

  1.  **Reliance is Key:** Both slightly underplay the core element Mara touched on: **reasonable reliance**. Did the team (PM, others) *rely* on Dev's message to plan their own work, make decisions, or manage expectations upwards? If they did (e.g., didn't assign backup, told stakeholders it was safe), that reliance makes the utterance function as a promise *regardless* of the exact words, though "I promise" massively strengthens it. The *effect* on others matters.
  2.  **Professional Context:** In a *work* setting, especially during a critical migration, public declarations like "I promise the search migration will be done before the Friday freeze" are universally understood as strong commitments, not weather forecasts. The professional norm is to treat them as such. Arguing otherwise post-failure damages trust more than the initial miss.
  3.  **Focus on Retrospective Blame vs. Future Solution:** The whole argument became about *whether* it was a broken promise (assigning blame) rather than *why* it was missed and *how* to prevent recurrence. That's the real purpose of retro. Dev's defensiveness and Mara's focus on "winning" the argument derailed this.

  **Overall Verdict:**

  *   **Mara wins the argument decisively on points.** Her reasoning about performative language in context, the distinction between prediction and commitment, and the existence of social/professional obligations is far stronger and more aligned with how language functions in a team setting.
  *   **Dev's arguments** rely on overly narrow definitions, false equivalences (weather forecast), and appear to be a post-hoc justification to avoid accountability. His "consequences" point has a grain of truth but misses the core function of promising.

  **In short:** By typing "I promise [outcome dependent on my actions]" publicly in the team channel, Dev made a promise. It wasn't a weather forecast. It created a legitimate expectation and obligation within the team. Breaking it warranted an acknowledgment of the *commitment* missed, not just an "oops, my prediction was wrong." The semantic argument is a smokescreen; the real issue is accountability and the reasonable reliance of the team. Next retro, perhaps suggest focusing less on "was it technically a promise?" and more on "how do we ensure commitments are realistic and met, or communicated early if they're at risk?" That's the British way – solve the problem, don't just litigate the definition.
