  Okay, the user is a PhD student in moral philosophy working on a dissertation chapter about the ethics of truthfulness. They came across a summary of Augustine's view on lying in an applied ethics book and suspect it's oversimplified. Their main concerns are whether Augustine really thought all lies are equally wrong, if his argument was solely based on Scripture, how he handled the murderer-at-the-door case, and whether his position is irrelevant to secular ethics.

  First, I need to recall Augustine's actual writings on lying. He wrote several texts: *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying). The book's summary claims Augustine said every lie is a sin and all sins are equal. But Augustine did distinguish between different sins in his other works, like in *City of God*, where he talks about sins having different severities. So the "equal sins" part is probably a misrepresentation.

  Next, the book says Augustine's reasoning is solely scriptural. But Augustine actually provides philosophical arguments. He considers lying intrinsically wrong because it corrupts the soul, misuses the faculty of speech, and harms social trust. While he references Scripture, like Psalm 5:7, he integrates it with his philosophical framework. So the claim that it's just an article of faith isn't accurate.

  The murderer-at-the-door example is a classic objection. Augustine addressed this in *Contra Mendacium*. He argued that lying to save a life is still sinful, but he also discussed alternatives like refusing to answer. He admitted such lies are less severe than others but maintained they're still wrong. This nuance is important. The book's claim that his position "collapses" here ignores Augustine's careful reasoning.

  The user also wants to know if Augustine's view is irrelevant to secular ethics. Modern philosophers like Christine Korsgaard and Bernard Williams engage with Augustine's ideas on truthfulness. His intrinsic evil argument connects to Kantian deontology, and his emphasis on truthfulness as a virtue aligns with virtue ethics. So dismissing him entirely misses these philosophical contributions.

  I should check if Augustine explicitly stated all lies are equally wrong. In *De Mendacio*, he categorizes lies into eight types, from most to least severe. While he thought all lies are sins, he acknowledged gradations in culpability. So the "equally wrong" claim is a conflation.

