          - How to handle when the reliability is unknown? (We assumed it was known.)
          - How to update when the evidence is continuous? (We had discrete.)
          - How to update when the state is not binary? (We had binary.)

     We can mention these as extensions.

     Now, what if a kid refuses to update? They always say 50. Then they get 75 every round. Over 10 rounds: 750. 
          The correct updater: expected 79 per round -> 790. 
          The naive: 700.

     So the 50% kid does better than the naive but worse than the correct.

     That's a lesson too: if you ignore the evidence, you do better than being overconfident in noisy evidence? But worse than using it properly.

     But note: the 50% kid is ignoring the evidence. The correct kid is using it appropriately.

     We can discuss that.

     Also, what if a kid reports 70 every time? Then when the report is black, they are not updating appropriately. They should report 30 when the report is black. So that kid would do worse.

     So they have to update differently for "red" and "black".

     We hope they see that.

     We'll run it and see.

     This should be effective.

