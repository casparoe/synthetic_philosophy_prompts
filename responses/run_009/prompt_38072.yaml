answer: |-
  Here’s a structured in-class betting game designed to confront students with the pitfalls of updating on uncertain evidence as if it were certain. The game uses tangible materials, fits within 80 minutes, and forces students to grapple with the reliability of evidence, rigidity assumptions, and the Jeffrey conditioning formalism.

  ---

  ### **Game: The Unreliable Witness Betting Challenge**  
  **Objective**: Students bet on the color of a hidden card using testimony from a "witness" with known reliability (70%). The goal is to maximize points by correctly weighting evidence reliability.  

  ---

  ### **Materials** (Prep in <1 hour)  
  1. **Card deck**: Use only **10 red** and **10 black** cards (simplified to binary outcomes).  
  2. **Reliability die**: A 10-sided die (or app):  
     - 1–7: Witness tells truth.  
     - 8–10: Witness lies.  
  3. **Betting tokens**: Poker chips or paper slips (50 per student).  
  4. **Scoreboard**: Whiteboard or poster to track points.  
  5. **Worksheets**: For students to record bets, outcomes, and scores (include scoring rules).  

  ---

  ### **Rules & Timeline** (Total: 55–60 min)  
  #### **Phase 1: Setup (5 min)**  
  - **Explain rules**:  
    - A card is drawn (hidden). True color = **T** (red/black).  
    - "Witness" (instructor) reports color **R** (red/black) with 70% reliability (die roll).  
    - Students bet on **T** using tokens.  
  - **Scoring**:  
    - Quadratic scoring rule: For a bet of probability *p* on red:  
      - If **T** = red: Points = `100 × [1 − (1 − p)^2]`  
      - If **T** = black: Points = `100 × [1 − p^2]`  
    - **Example**: Bet *p* = 0.7 on red → If red: `100 × [1 − (0.3)^2] = 91`; If black: `100 × [1 − (0.7)^2] = 51`.  
  - **Start**: Give each student 50 tokens (1 token = 1 point).  

  #### **Phase 2: Game Rounds (30 min, 6–8 rounds)**  
  Per round (4 min/round):  
  1. **Draw & Testimony**:  
     - Draw a card (hide it). Roll the die to determine witness reliability.  
     - Announce **R** (e.g., "Witness says RED").  
  2. **Betting**:  
     - Students bet tokens on **T** = red by choosing *p* (0–100%).  
       - *Example*: Bet 30 tokens at *p* = 0.7 → If win, gain `30 × [points/100]`.  
     - **Key constraint**: Bets are final once **R** is announced.  
  3. **Reveal & Score**:  
     - Reveal **T**. Students calculate scores using the formula.  
     - Update tokens. Record outcomes on worksheets.  

  #### **Phase 3: Final Scoring (5 min)**  
  - Sum tokens. Rank students on the scoreboard. Top 3 get "bragging rights" (or small prizes like candy).  

  ---

  ### **Debrief Framework** (20–25 min)  
  Use game results to map to Jeffrey conditioning concepts:  

  1. **The Mistake & Evidence Reliability**:  
     - *Game moment*: When students bet *p* ≈ 1.0 after hearing **R** (e.g., bet 100% on red after **R**=red).  
     - *Formalism*:  
       - Mistake: Treating **R** as certain evidence → `P(T|R) = 1`.  
       - Correct: `P(T=red | R=red) = [P(R=red | T=red) × P(T=red)] / P(R=red) = (0.7 × 0.5) / 0.5 = 0.7`.  
     - *Why it stings*: Naive updaters lose >30% of the time. Show a round where **R** was wrong → Their *p*=1.0 bet scored 0, while Jeffrey updaters scored 51.  

  2. **Rigidity and Its Violations**:  
     - *Game moment*: Ask: "Did your belief in the witness’s reliability (*P(R|T)*) change during the game?"  
     - *Formalism*:  
       - Rigidity: `P(R|T)` must stay fixed (70% reliability is static).  
       - Violation: If students adjusted reliability mid-game (e.g., after errors), they broke rigidity.  
     - *Lesson*: Jeffrey assumes rigidity. If reliability drifts (e.g., witness fatigue), you need meta-updates.  

  3. **Uncertainty About Reliability**:  
     - *Game moment*: "What if you doubted the 70% figure?" (e.g., after 2 errors in a row).  
     - *Formalism*: Jeffrey can’t handle this—it requires known `P(R|T)`. Real agents must model hyper-priors (briefly mention Bayesian model averaging).  

  4. **What the Game Can’t Teach**:  
     - Non-binary states (e.g., dice rolls) → Generalize to partitions.  
     - Continuous evidence (e.g., blurry images) → Use probability densities.  
     - Endogenous reliability (e.g., lying witnesses) → Requires game theory.  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Risk-averse kid (bets 0 tokens)**:  
     - **Fix**: Force a minimum bet (e.g., 5 tokens). Explain: "No bet = no learning."  

  2. **Gamer kid (exploits noise)**:  
     - **Fix**: After the game, ask: "Did betting against the witness ever work?" Show math: Betting *against* **R** (e.g., *p*=0.3 when **R**=red) has expected score 79—same as Jeffrey! Why? Noise is symmetric.  

  3. **Confusion about scoring**:  
     - **Fix**: Run a practice round. Use a score calculator (Google Sheet on projector).  

  4. **Time crunch**:  
     - **Fix**: Reduce to 5 rounds. Skip individual scoring (use group averages).  

  ---

  ### **Why This Works**  
  - **Sting factor**: Points = social currency. Leaderboard humiliation incentivizes rigor.  
  - **Concreteness**: Dice/cards make noise tangible. Scoring rules penalize overconfidence.  
  - **Debrief links**: Every game mechanic maps to Jeffrey’s axioms (reliability → likelihoods, rigidity → fixed conditionals).  

  This game won’t teach hyperpriors or non-rigid updates—but it will make students *feel* why "just condition on it" blows up with unreliable evidence. Run it, and watch the lightbulbs ignite.
