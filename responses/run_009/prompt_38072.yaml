              When report="red" (50%): then 70% chance of 100, 30% chance of 0 -> 70
              When report="black" (50%): then 70% chance of 100 (if they set p=0 for red, then if black they get 100) and 30% chance of 0 (if it was red and they set p=0, then they get 0) -> 70
              So overall: 70.

          - For the correct: 
              When report="red": 70% of the time (given report="red") the true color is red -> score 91; 30% black -> score 51 -> average 79 for the "red" reports.
              When report="black": 30% of the time (given report="black") the true color is red -> score 51; 70% black -> score 91 -> average 79.
              So overall: 79.

          - The difference is 9 points per round. Over 10 rounds: 90 points. That should be visible.

     But note: we did 10 rounds, so the expected difference is 90 points? But variance might make it less? We can hope.

     Also, we can ask the students to share their updating strategies:

          - Who updated by setting p=100 or 0? 
          - Who used p=70 or 30?
          - Who did something else?

     Then we can explain why the 70/30 is better.

     Also, what if a student started to doubt the reliability? For example, if they see several errors, they might think the reliability is less than 70%? But in our game, we told them it was 70% and we fixed it. So they should trust the model? 

     We can note: in reality, we might not know the reliability exactly. Then we have to estimate it. But in this game, we assumed we knew it.

     What the game cannot reproduce:

          - The game assumes the noise model is known and fixed. In reality, we might have to learn it.
          - The game uses a simple binary state and binary evidence. Real situations might be more complex.
          - The game uses a fixed prior (50%). In reality, the prior might be different.
          - The rigidity assumption: in the game, we assume that the noise (the die roll) is independent of the state and that the conditional probabilities are fixed. But in reality, if the state changes, the noise might change? For example, if the card is red, maybe the blurriness affects it differently? We assume rigidity holds.

     What might go wrong:

          - One kid refuses to bet anything? Then they might not participate. We can require that they write a number. If they write 50 every time, they get 75 per round -> 750 total. That's better than the naive? So they might do okay. But they are not learning. We can encourage them to try a strategy.

          - A kid tries to game the noise channel: for example, they might try to predict when the die roll will be wrong? But the die roll is independent. They can't. So they might try to use a different updating rule? That's okay, but we hope they see that 70/30 is best.

          - Another issue: the scoring rule might be confusing. We can have a practice round.

     We can do a practice round before the 10 rounds.

     So:

          Total time:

            Intro and practice round: 10 min
            10 rounds: 25 min
            Total scoring and board: 5 min
            Debrief: 30 min

            Total: 70 min.

     We have 10 min buffer.

     We can adjust the number of rounds if we run out of time.

     Materials to prep:

          - Bag with 10 red and 10 black tokens (or more, but we put back). We can use colored paper cut into circles.
          - A 10-sided die.
          - Worksheet for students (with 11 rounds: practice and 10 real) or 10 rounds? We can skip the practice if time is short.

          We'll do the practice round as round 0? And we don't count it.

          Worksheet:

              Round | Report (color) | My posterior for red (0-100) | True color | Score | Running total

          And a line for the practice.

          We also need to explain the scoring formula on the worksheet.

     We can also provide a calculator? But they can use their phones.

     But to avoid phones, we can precompute a table? For p from 0 to 100, the score for red and for black? But that's a lot. We can give the formula and let them compute.

     Alternatively, we can write:

          If red: Score = 100 * [1 - (1 - p/100)^2]
          If black: Score = 100 * [1 - (p/100)^2]

     And then they can compute.

     We'll do that.

     Let's write the plan:

          Time: 80 min

          [0-5 min] Introduction: 
              - We are playing a game to understand updating on uncertain evidence.
              - We have tokens in a bag: half red, half black. So prior for red is 50%.
              - We draw a token, but we don't see it. Instead, we get a report that is 70% reliable: 
                    * If the token is red, the report will say red with 70% chance and black with 30%.
                    * If black, the report will say black with 70% chance and red with 30%.
              - We will do 10 rounds. In each round, you will report your posterior probability that the token is red (as a percentage) after hearing the report.
              - We will then reveal the true color and you will compute your score for that round using the quadratic scoring rule.

              Scoring rule:
                  If you report p (for red, between 0 and 100):
                    - If the token is red: Score = 100 * [1 - (1 - p/100)^2]
                    - If black: Score = 100 * [1 - (p/100)^2]

              Example: 
                  If you report 100 and it is red: 100 * [1 - (1-1)^2] = 100 * [1-0] = 100.
                  If you report 100 and it is black: 100 * [1 - (1)^2] = 100 * [1-1] = 0.
                  If you report 70 and it is red: 100 * [1 - (1-0.7)^2] = 100 * [1-0.09] = 91.
                  If you report 70 and it is black: 100 * [1 - (0.7)^2] = 100 * [1-0.49] = 51.

          [5-10 min] Practice round:
              - Draw a token (say, red) -> but don't show.
              - Roll the die: say 8 -> then report black.
              - Students write their posterior for red (they can try any number).
              - Reveal the true color: red.
              - They compute their score and see.

          [10-35 min] 10 rounds: 
              Each round: 
                  - "Round 1: Drawing a token..." (draw one, note the color)
                  - Roll the die: "I rolled a 3, so the report is correct." -> then if the token is red, report red; if black, report black.
                  - Announce: "The report says: [color]"
                  - Students write the report and their posterior in the worksheet.
                  - Reveal the token: "The true color is [color]"
                  - Students compute their score and update the running total.

          [35-40 min] Collect the running totals. Write them on the board.

          [40-70 min] Debrief.

     Debrief points:

          - Show the expected scores for different strategies.
          - Ask the students: what strategy did you use? Why?
          - Ask: did anyone change their strategy during the game? Why?
          - Show the correct update: 
                P(red | report="red") = 0.7
                P(red | report="black") = 0.3

          - Why is this called Jeffrey conditioning? Because we are updating on uncertain evidence. We don't condition on the evidence (which would set P(evidence)=1) but we use the probability of the evidence given the state.

          - Rigidity: we assumed that the noise model (the 70% reliability) didn't change. But what if we had reason to doubt it? For example, if we saw many errors, we might think the reliability is lower? Then we would have to update on that too. But in this game, we took it as given.

          - What if the prior wasn't 50%? Then the posterior would be different.

          - The mistake: if you condition on the report as if it were certain, you are effectively setting the probability of the token to 100% for the reported color. But that ignores the 30% chance of error.

          - In the game: 
                When the report was "red", the naive updater set p=100. Then if the token was black (which happens 30% of the time when the report is red), they got 0. 
