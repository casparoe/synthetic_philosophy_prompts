  ### Key Design Notes  
  - **Escalation**: Begins with technical axioms (Q1–3), moves to probability/caring gap (Q4–5), then circularity (Q6–7), and ends with metaphysics/epistemic cost (Q8–10).  
  - **Self-locating vs. DT**: Q2 and Q6 explicitly probe whether these are distinct; the follow-ups force clarification on whether amplitude is presupposed in branch individuation.  
  - **Sleeping Beauty**: Q3 links fission indifference to contested 1/3 vs. 1/2 debates, exposing hidden assumptions.  
  - **British English**: "Individuated", "smuggled", "credences", "pragmatic" used throughout.  
  - **Audience**: Assumes graduate familiarity with Everett basics and decision theory, but no specialised literature beyond cited approaches (Deutsch-Wallace, Sebens-Carroll, Greaves).  

  These questions compel the speaker to defend the *derivativeness* of the Born rule at each step—especially where axioms might encode its conclusion or where probability remains ungrounded. Use Q6 to decisively test the independence of the self-locating route.
