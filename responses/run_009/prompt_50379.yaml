  In edge cases, like negligent building codes leading to hurricane damage, the legal system attributes partial liability to humans, while theologically, the hurricane remains a natural evil. Here, the interpretations come apart. The practice relies on human causality, not divine will, so the theological reading isn't necessary for the legal framework.

