prompt: |-
  i'm a phd student in computational neuroscience and lately i've been going back to von Neumann's little book from the unfinished lectures published right after he died, the one contrasting the brain with the computers of his day. as i read him, his picture is roughly: neurons are slow and noisy, they fire at maybe a few spikes' worth of precision per operation, the brain must somehow extract reliable computation from unreliable parts, and whatever "language" the brain speaks is shallow and statistical rather than the deep, precise arithmetic notation we use — plus a remark that the brain's math is not the math we write on paper, and we don't actually know its alphabet.

  my problem is i keep reading him through my own vocabulary and i can't tell anymore what he actually said vs what i've translated him into. so do the translation explicitly for me: restate his central claims in the terms i use daily — spiking networks, rate codes vs temporal codes, population coding, single-precision floating point, energy per synaptic operation, error-correcting redundancy, layer depth — and be honest about each one. which of his claims map cleanly onto things we now think we understand (e.g. does "shallow depth" just become "the brain isn't doing long chains of high-precision operations"?), which ones had to be distorted to fit, and which have no expression at all in how we currently talk?

  then the part i actually care about: is the residue informative or not? two directions specifically — (a) does his point about reliability from unreliable components have a real counterpart in our vocabulary (redundancy, population averaging) or did he mean something we've quietly dropped, and (b) when he says the brain's notation is fundamentally non-mathematical, is that a claim we've refuted, absorbed, or just stopped asking? i want the residue report to say whether our modern vocab is missing something he saw or whether his claims were just less clear than they looked. if it helps, flag where you're paraphrasing him loosely vs. where you're confident about the text.
