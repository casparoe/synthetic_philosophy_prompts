  Here is a villanelle crafted for your closing, designed to embody the heterogeneity debate through its structure and examples:

  **The Thin Account**

  The fever breaks, the glass is lifted up—
  Cool water hits the parched and grateful tongue.
  *But each one feels good, and that's the whole of it.*

  The symbols shift, align within the cup
  Of reason, and the final hinge is sprung—
  The fever breaks, the glass is lifted up.

  That rival stumbles, spills their precious cup,
  A bitter joy, unclean, within you wrung.
  *But each one feels good, and that's the whole of it?*

  The storm of weeping leaves its salted cup,
  A hollow calm where shattered nerves restrung—
  The fever breaks, the glass is lifted up.

  Hot asphalt yields the perfume lightning struck,
  That cool grey scent before the rain has sung.
  *But each one feels good, and that's the whole of it—*

  The proof clicks shut (QED, the final lock),
  The spiteful grin, the silence after lung,
  The fever breaks, the glass is lifted up,
  The cool grey scent before the rain has sung...

  *But each one feels good, and that's the whole of it—*
  *A thing so thin might not be called a thing at all.*

  ---

  **How it meets your specifications:**

  1.  **The Two Refrains:**
      *   **Hedonist's Flat Reply:** "But each one feels good, and that's the whole of it." (Identifiable as the hedonist's core claim: the common property is simply the positive feeling tone).
      *   **Objector's Retort:** "A thing so thin might not be called a thing at all." (Identifiable as the Butler-inspired objection: such a minimal property is vacuous).

  2.  **Concrete Pleasures (Far Apart in Texture):**
      *   **Stanza 1:** The first sip of water during a fever (physical relief, intense need met).
      *   **Stanza 2:** The click at the end of a long proof (intellectual triumph, abstract satisfaction).
      *   **Stanza 3:** Schadenfreude at a rival's stumble (morally dubious, complex social-emotional pleasure).
      *   **Stanza 4:** The calm after weeping (emotional release, aftermath of catharsis, quietude).
      *   **Stanza 5:** The smell of rain on hot pavement (petrichor; pure sensory, aesthetic, atmospheric pleasure). Each is distinct, resisting easy categorization together.

  3.  **Form Doing the Arguing:**
      *   **Varying Burden on Refrains:** The hedonist's refrain ("feels good") sounds:
          *   **Vindicated:** In Stanza 1 (water during fever - undeniable, visceral "good").
          *   **Stretched but plausible:** In Stanza 2 (proof click - abstract, but the satisfaction is palpable).
          *   **Embarrassed/Morally Questionable:** In Stanza 3 (schadenfreude - "feels good" is true but feels inadequate or tainted; the added question mark emphasizes the strain).
          *   **Quietly Reinterpreted:** In Stanza 4 (calm after weeping - the "good" is defined by the *absence* of prior pain, a relief, subtly different from the active good of water).
          *   **Sensory/Pure:** In Stanza 5 (petrichor - a "good" feeling seemingly intrinsic to the sensation itself).
      *   **Objector's Retort:** Returns with increasing weight, especially after the schadenfreude stanza, highlighting the potential emptiness of the hedonist's "thin" property. Its final placement in the couplet gives it significant closing force.
      *   **Recurring Line as Question:** The repetition forces the reader to constantly reevaluate: *Is* "feels good" a genuine common thread holding these vastly different experiences together, or is it just a word we apply out of habit, masking profound differences? The poem enacts the doubt.

  4.  **Closing Couplet (Ambiguity):**
      *   The final two lines place the hedonist's claim ("But each one feels good...") directly beside the objector's dismissal ("A thing so thin...").
      *   No resolution is imposed. Does the sheer repetition and the diverse examples it *has* been applied to (from water to schadenfreude to petrichor) show a resilient, if thin, "family resemblance" (allowing the thread to hold)? Or does the juxtaposition, especially after the unsettling schadenfreude and the complex calm/relief, make the hedonist's claim seem impossibly stretched and the objector's point devastating (the thread snaps)? The poem ends precisely at this unresolved tension, mirroring your discussion's endpoint.

  5.  **Allusions:** The poem assumes familiarity with "hedonism" and the concept of a "thin" property. The final ambiguity implicitly evokes the possibility of "family resemblance" (Wittgenstein) as a way the hedonist *might* salvage their position, without naming it directly.

  This villanelle uses its inherent repetitiveness not just as a formal constraint, but as the central philosophical device, forcing the core claim and its objection into repeated contact with disparate realities of pleasure, leaving the audience exactly where your seminar ended: suspended on the horns of the heterogeneity problem.
