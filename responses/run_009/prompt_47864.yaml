  ## Joint Statement on Conceptualizing Democratic Change: Areas of Agreement, Disagreement, and Testable Propositions

  **Preamble:** This document reflects a collaborative effort between [Comparativist Name] and [Theorist Name], facilitated by [Your Name], to articulate points of convergence and divergence regarding the concept of "democratic backsliding" and its application, particularly to cases like Hungary, Poland, Turkey, and the United States. Our goal is to clarify shared understandings, precisely define core disagreements, identify key cruxes, and propose concrete tests to adjudicate between our perspectives over time. This is not a synthesis but a map of the contested terrain.

  **I. Points of Shared Factual and Methodological Agreement (Signable by Both)**

  1.  **Hungary (Post-2010):** The Fidesz government, following its 2010 electoral victory, undertook a series of significant legal and institutional changes. These included: restructuring the Constitutional Court and expanding its size; enacting a new constitution (Fundamental Law) via procedures criticized for limited opposition input; implementing media laws seen as concentrating ownership and editorial influence in pro-government hands; and modifying electoral laws affecting district boundaries, campaign finance, and ballot access in ways independent analysts argued systematically advantaged the incumbent party. Similar patterns of legislative action concerning courts, media, and electoral rules occurred in Poland post-2015 and Turkey (with significant acceleration post-2016 attempted coup), though the specific mechanisms and degrees of change varied.
  2.  **Bending Rules vs. Abolishing Them:** There exists a distinction between political actors operating *within* established constitutional and legal frameworks (even while pushing their boundaries through adversarial tactics like constitutional hardball) and political actors fundamentally *altering* those frameworks through legislative or executive action in ways that significantly reduce constraints on executive power, limit pluralism, or curtail accountability mechanisms *without* resorting to explicit, unilateral abolition of democratic institutions (e.g., suspending constitutions, banning opposition parties via decree).
  3.  **The United States (Recent Dynamics):** The United States has experienced intense political polarization and institutional conflict, characterized by escalating tactics including: norm-breaking behavior around judicial appointments (e.g., changing Senate rules for Supreme Court confirmations, rapid confirmation near an election); intense partisan conflict over election administration rules and oversight mechanisms; and unprecedented challenges to the peaceful transfer of power following the 2020 election. These dynamics represent a significant intensification of adversarial politics compared to previous decades in the US context. *However*, these events transpired within the *existing* constitutional framework, with ultimate resolution (however contested) occurring through established legal and political channels. Significant institutional veto points remain actively contested and utilized by different political actors.
  4.  **Methodology of Democracy Indices:** Standard quantitative indices of democracy (e.g., V-Dem, Freedom House, Polity) rely heavily on the aggregated expert judgments of country specialists regarding the state of political institutions and practices. These indices are valuable tools for identifying *patterns* and *trends* over time and across countries, and for measuring the *degree of consensus* among a specific community of informed observers about the state of democracy. However, these indices **cannot**, by themselves, definitively establish the *objective existence* of a singular phenomenon like "democratic backsliding" as distinct from intense polarization or political conflict, nor can they adjudicate the *intent* or *long-term systemic consequences* of specific actions in isolation. They measure perceived outcomes and practices, not unobservable syndromes. Their thresholds for labeling decline are interpretive.

  **II. Precise Formulations of Core Disagreements**

  1.  **The Conceptual Status of "Democratic Backsliding":**
      *   *Comparativist View:* Democratic backsliding describes an empirically identifiable *syndrome* or *process*. It involves a patterned sequence of actions, typically undertaken by elected incumbents, that cumulatively degrade core democratic institutions (especially referees like courts, the media environment, and electoral fairness) through legalistic means, leading to a measurable decline in democratic quality without an immediate, overt regime break. Hungary (2010-present) is a paradigmatic case demonstrating this syndrome in action.
      *   *Theorist Skeptic View:* While specific institutional changes (as noted in Section I) are observable, the concept of "democratic backsliding" is inherently *elastic* and *observer-dependent* in its application. It risks smuggling in a contested teleology (an assumed "correct" democratic trajectory) and is frequently applied selectively, functioning as a rhetorical tool for the side perceiving itself to be losing within ordinary, albeit intense, adversarial democratic politics. What is labeled "backsliding" by one set of observers (or partisans) is often perceived as legitimate democratic contestation or correction by another. The concept itself lacks a stable, objective definition independent of these contestations.

  2.  **The Nature of the Observed Changes:**
      *   *Comparativist View:* The cumulative effect of the observed changes in cases like Hungary, Poland, and Turkey represents a qualitative shift beyond intense polarization. It constitutes a *systemic decay* of democratic resilience, creating a new, less democratic equilibrium characterized by diminished pluralism, weakened constraints on the executive, and tilted playing fields.
      *   *Theorist Skeptic View:* The observed changes represent instances of intense *adversarial politics* and constitutional hardball occurring *within* a still-functioning democratic system. These are conflicts *over* the rules and their interpretation, inherent to democracy, rather than evidence of systemic decay *of* democracy itself. The US cases are prominent examples of this intense conflict within a persistent democratic framework.

  **III. Key Cruxes and Proposed Empirical Tests**

  1.  **Crux: Existence of a Stable "Mid-Point" (Intense Polarization vs. Regime Change)**
      *   *Question:* Is there a stable, enduring political configuration distinct from both ordinary (even intense) polarization and unambiguous authoritarianism? Or are periods labeled "backsliding" inherently transitional, necessarily moving towards either democratic resilience (recovery) or authoritarian consolidation?
      *   **Test Case & Evidence:** **Turkey (Current State & Next 5 Years).** Turkey exhibits significant erosion of pluralism and executive constraints but retains formal elections and some opposition activity.
      *   *Comparativist Prediction:* Turkey will exhibit further measurable decline on key democratic indices (e.g., V-Dem Liberal Democracy Index dropping by at least 0.05 points) and experience at least one of the following within 5 years: a significant further reduction in meaningful electoral competition (e.g., main opposition party barred or severely crippled); a major constitutional amendment further concentrating power; or the effective elimination of judicial independence on politically salient cases.
      *   *Skeptic Prediction:* Turkey's political system will remain in a state of intense adversarial politics within its current institutional framework. While conflict will persist, there will be no fundamental, systemic change in the nature of the regime (e.g., no banning of major opposition parties, no elimination of national multi-party elections). V-Dem scores may fluctuate slightly but will not show a significant, sustained further decline (change < |0.03| points).

  2.  **Crux: Significance of Sequence vs. Final Equilibrium**
      *   *Question:* Does the *order* and *manner* in which institutional changes are enacted matter crucially for diagnosing backsliding as a distinct syndrome? Or is only the final institutional configuration relevant for classifying a regime?
      *   **Test Case & Evidence:** **Comparative Analysis of Institutional Changes.** Examine a future instance (or re-examine a past instance like Bolivia 2019) where similar institutional outcomes (e.g., court restructuring, electoral rule changes favoring incumbents) are achieved via different sequences/contexts: (a) Rapid, comprehensive changes following a single election victory by a cohesive party, bypassing consensus. (b) Incremental changes over multiple electoral cycles through prolonged adversarial politics and negotiation.
      *   *Comparativist Prediction:* Instances fitting pattern (a) will be significantly more likely to lead to a measurable, sustained decline in democratic indices over the subsequent 5 years compared to instances fitting pattern (b), even if the immediate institutional outcomes appear similar. The sequence signals intent and creates path dependency.
      *   *Skeptic Prediction:* The long-term democratic trajectory (as measured by indices 5 years later) will depend more on the *final institutional configuration*, the presence of countervailing powers, and broader socio-political factors, than on the specific sequence or speed of the changes. Instances with similar outcomes via different sequences will show no systematic difference in their democratic trajectories.

  3.  **Crux: Interpretation of Democracy Indices**
      *   *Question:* When democracy indices show decline, does this primarily reflect (a) an objective deterioration in democratic practices (the phenomenon itself), or (b) a shift in the consensus perception among expert observers (the measurement tool), potentially influenced by the *labeling* of events as "backsliding"?
      *   **Test Case & Evidence:** **Divergence in Index Scores vs. Grounded Events.** Identify a country currently showing moderate decline on indices (e.g., V-Dem Liberal Democracy Index decline of 0.03-0.07 over last 5 years) but without clear, major institutional ruptures (e.g., no court packing, no major media takeovers, no significant electoral law changes disadvantaging opposition). Monitor this country over the next 5 years.
      *   *Comparativist Prediction:* The initial measured decline is likely a leading indicator. This country will experience at least one significant institutional change fitting the "backsliding syndrome" (e.g., major court reform reducing independence, significant new media regulation concentrating control, major electoral reform disadvantaining opposition) within the next 5 years, causing a further index drop.
      *   *Skeptic Prediction:* The initial measured decline primarily reflects heightened expert concern/perception based on intense adversarial politics and norm erosion, *not* a signal of impending institutional rupture. No major institutional changes fitting the comparativist's "syndrome" will occur in this country within the next 5 years. Index scores may stabilize or fluctuate slightly but will not show a significant further sustained decline solely attributable to new institutional changes. The initial decline captured perceived conflict intensity, not an underlying syndrome leading inexorably to institutional demolition.

  **IV. Residual Disagreements: Potential Verbal Components**

  We acknowledge that some persistent disagreement may stem from differing connotations of key terms rather than fundamental substantive differences about observable phenomena:

  1.  **"Backsliding" and Telos:** The Skeptic argues the *term itself* inherently implies an undesirable deviation from a presumed correct path (telos). The Comparativist intends it as a *descriptive label* for a specific, observable pattern of institutional degradation, agnostic on whether that path is "correct" historically, but acknowledging that degradation *from a prior democratic state* is measurable. **Is this primarily a disagreement about the baggage of the *word* "backsliding" vs. the observable pattern?**
  2.  **"Adversarial Politics" vs. "Systemic Decay":** The Skeptic's use of "adversarial politics" encompasses intense conflict, including constitutional hardball and norm-breaking, occurring within the system. The Comparativist reserves "systemic decay" for when such actions cumulatively degrade the system's core functions. **Is the disagreement partly about the threshold at which intense conflict *within* the system tips into degrading the system *itself*?** This threshold may be inherently contestable and contextual rather than absolute.
  3.  **"Ordinary" Politics:** The Skeptic's reference to "ordinary adversarial politics" is relative to historical democratic experience (acknowledging current intensity is high). The Comparativist argues the *specific combination and sequence* of actions in cases like Hungary constitute a *new pattern* distinct in kind, not just degree, from historical democratic conflict in established democracies. **Is the disagreement about whether the pattern is genuinely *new* or just a more intense *version* of the old?**

  **Conclusion:** This statement clarifies the factual terrain we agree upon, precisely locates our core conceptual disagreements regarding "democratic backsliding," and establishes concrete, falsifiable tests centered on specific future political developments. By recording our contrasting predictions now, we commit to revisiting these cruxes empirically. Our collaboration hinges on maintaining the integrity of both research programs: the Comparativist's focus on identifying and analyzing patterned institutional degradation, and the Theorist's focus on the conceptual contestation and observer-dependence inherent in labeling political conflict. The validity of our respective positions will be judged, in part, by the outcomes of the tests proposed herein over the coming years.

  ---
  **Signed:**

  [Comparativist Name]
  [Theorist Name]

  **Facilitated by:**
  [Your Name]
  [Date]

  ---
  **For Your Consideration (Re: Verbal Disagreements):** The disagreement most likely to have a significant verbal component is **#1: "Backsliding" and Telos.** The Skeptic's core objection is deeply tied to the perceived normative and teleological baggage of the *term itself*. The Comparativist is focused on describing a pattern they see as empirically real, regardless of the label. Using a more neutral term like "institutional degradation" or "democratic erosion" *might* reduce this friction, but the Skeptic might still object if they perceive the *concept* underlying the new term still smuggles in assumptions about a "correct" democratic state. Clarifying this specific point in discussion *before* signing is highly recommended. Disagreements #2 and #3 seem more substantive, relating to interpretations of thresholds and patterns.
