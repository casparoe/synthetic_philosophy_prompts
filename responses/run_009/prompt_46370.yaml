  First, I need to break down the regulatory pattern. The laws protect all vertebrates, plus cephalopods and decapods, citing evidence of pain and distress. Insects are left out. The user mentioned that the line is binary—full protection or none—which suggests a threshold. But they're unsure if it's truly about sentience or neuroanatomy. 

  The user's main questions are: What theory makes this coherent? Which parts of the practice require that theory? Could a sentience-only view justify the same line? And if status were gradational, how would regulations change?

