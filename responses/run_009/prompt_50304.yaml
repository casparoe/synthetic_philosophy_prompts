answer: |-
  ### Workshop Plan: "Disassembling Intuition Pumps"

  #### Core Objective  
  Participants learn to **critique the structure** of thought experiments (not just recall famous ones), focusing on how details manipulate intuition. Key insight: Intuitions are psychological data, not objective evidence.  

  #### Carrying Example: **The Chinese Room**  
  **Why chosen over alternatives**:  
  - **Trolley problem**: Too emotionally charged; ethics debates overshadow structural critique.  
  - **Mary’s room**: Too abstract ("knowledge" vs. "experience" is hard to vary live).  
  - **Chinese Room** wins because:  
    - Non-emotional (avoids moral distraction).  
    - Highly adjustable (room size, rules, executor).  
    - Intuition flips cleanly with detail changes.  

  ---

  ### Sequence (90 Minutes Total)  
  1. **Intro: What’s an "Intuition Pump"?** (5 min)  
     - **Content**: Define thought experiments as "stories that make a point feel obvious." Show examples (trolley, Chinese Room) *without details*. Emphasize: "Today, we dissect how these stories work—not whether they’re 'right.'"  
     - **Why here**: Establishes scope; avoids philosophy jargon.  

  2. **Intuitions Are Data About *You*** (15 min)  
     - **Content**:  
       - Pose: "When you hear a thought experiment and think ‘Obviously X!’, what is that reaction?"  
       - Contrast: "It’s evidence about *your* mind, not the world. Like a Rorschach test."  
       - Simple analogy: "If I say ‘Imagine a purple cow,’ your reaction tells me about your imagination, not cows."  
     - **Why here**: Essential foundation. Prevents misconception: *"My gut reaction = proof."*  

  3. **Walkthrough: Chinese Room (Original Version)** (10 min)  
     - **Content**:  
       - Whiteboard the setup: Person in room, rulebook, Chinese symbols, English speaker.  
       - Poll: "Does the room *understand* Chinese? (Show of hands: Yes/No/Unsure)."  
       - Reveal Searle’s point: "This ‘proves’ computers can’t truly understand."  
     - **Why here**: Concrete example to anchor discussion; polling makes intuitions visible.  

  4. **Break Down the Machinery** (15 min)  
     - **Content**:  
       - Identify "loaded details": Rulebook (feels mechanical), "room" (feels small/simple), "person" (feels human-but-clueless).  
       - Ask: "Which details make you say ‘no understanding’? What if we change them?"  
     - **Why here**: Prevents misconception: *"Thought experiments = bad arguments."* Shows they’re tools with adjustable parts.  

  5. **Exercise: Flip the Intuition Live** (25 min)  
     - **Content**:  
       - **Vary one detail**: "What if the ‘room’ is a *city-sized network* of people/robots passing symbols?"  
       - Re-poll: "Now, does it ‘understand’?" (Most will say "maybe/yes").  
       - **Vary a second detail**: "What if the rulebook *learns* from conversations?"  
       - Discuss: "Why did your intuition shift? Which detail ‘pumped’ it?"  
     - **Why here**: Live demo proves intuitions are malleable. Core skill: **Detail-swapping exposes manipulation**.  

  6. **Generalize the Toolkit** (15 min)  
     - **Content**:  
       - Steps to dissect *any* thought experiment:  
         1. "What intuition is this pumping?"  
         2. "Which details feel ‘loaded’?" (Highlight words with emotional/associative weight.)  
         3. "Swap one detail—does the intuition flip or weaken?"  
       - Example: Trolley problem’s "lever vs. pushing someone" swaps emotional framing.  
     - **Why here**: Transfers skill beyond the example.  

  7. **Misconception Triage & Omissions** (5 min)  
     - **Content**:  
       - **Refuse to cover**:  
         - Philosophical debates (e.g., "Does AI *really* understand?").  
         - Every famous thought experiment (focus on method, not catalog).  
         - Formal logic (e.g., identifying syllogisms).  
       - **Final reminder**: "Your intuition is data—not a trump card or garbage."  
     - **Why here**: Manages scope; reinforces key takeaway.  

  ---

  ### Closing Check Question  
  **"What's one detail you'd tweak in *any* intuition pump to test if it's rigged?"**  
  - **Why**: Assesses if they internalized the *skill* (detail-swapping), not just the example.  

  ---

