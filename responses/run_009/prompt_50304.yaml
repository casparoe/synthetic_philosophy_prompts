prompt: |-
  I teach a Saturday morning "clear thinking" workshop at my local library — a drop-in crowd of maybe fifteen adults, mixed ages, from a retired engineer who argues about trolleys on Facebook to a couple of college sophomores. Nobody has any philosophy background. This month I want to do a session on thought experiments: what I'm loosely calling intuition pumps — cases like the Chinese Room, Mary the color scientist, the trolley problem, Plato's cave, zombieworld — where a little story is doing the persuading, and how to tell when the story is doing real work versus when it's smuggling in the conclusion through loaded details. The session is ninety minutes, whiteboard but no slides, and the crowd actually shows up because they want to get better at spotting manipulation, so I want them to leave able to take apart a thought experiment they meet in a podcast or an op-ed, not just recite critiques of famous ones.

  Don't write the session for me — plan it. What has to be established first before anything about "misleading" even makes sense (I suspect they need to see that the intuition being reported is data about *them*, not evidence about the world, and that this cuts both ways)? Which single example should carry the whole ninety minutes — I'm leaning toward the Chinese Room because I could have them vary its details live on the whiteboard, but talk me out of it or in: what must the carrying example have, and what must it not have (too famous so everyone has cached opinions? too simple so nothing to disassemble?). Give me the misconceptions they'll walk in with or form on the way, in the order they'll surface — my guesses are "thought experiments are just bad arguments, throw them out" and "my gut reaction to the case is the proof" — and exactly where in the sequence each one should be headed off, not at the end. Include somewhere an exercise where the audience changes one detail of a pump and watches the intuition flip, since I think that live moment is where the whole thing lands, but tell me where in the order it belongs. Also tell me what to openly refuse to cover in ninety minutes with this crowd. And end with one question I can ask the room to check whether they got the real skill rather than just enjoying the show.

  After the plan, give me a structured summary as a JSON object with these fields: "sequence" (an ordered array of steps, each with "step", "content", and "why_here"), "carrying_example" (the chosen example plus a one-line note on why it beat the alternatives), "misconceptions" (array of objects with "misconception", "when_it_arises", and "antidote"), "exercise" (where the flip-the-detail exercise goes and what detail it varies), "omissions" (what I refuse to cover, as a list), and "check_question" (the single closing question, as a string). Keep the JSON compact — it's for me to glance at while I'm running the room, not to publish.
reasoning: |-
  We are planning a 90-minute workshop on thought experiments (intuition pumps) for adults without philosophy background. The goal is to equip them to analyze and critique thought experiments they encounter in real life (podcasts, op-eds), not just to discuss famous examples.

  Key objectives:
  - Understand that the intuition reported in a thought experiment is data about the reader/listener (their own intuitions) and not direct evidence about the world.
  - Recognize that this intuition can be manipulated by the framing and details of the story.
  - Develop skills to disassemble a thought experiment by varying details and observing how the intuition changes.

  Carrying Example:
  The Chinese Room is a strong candidate because:
  - It's rich enough to allow variation of details (e.g., the size of the room, the nature of the instructions, the language).
  - It's not too simple (there are multiple layers to unpack).
  - It's famous, but not as overexposed as the trolley problem (which might have cached opinions). However, we note that the trolley problem is very accessible and the intuitions are strong. But the Chinese Room allows more technical variation and is less emotionally charged.

  However, the trolley problem might be more immediately engaging and easier for non-philosophers to grasp. But the request is leaning toward the Chinese Room and we want to be able to vary details live. The Chinese Room also avoids the emotional weight of the trolley problem (which can distract from the mechanics of the intuition pump).

  But note: the Chinese Room is about semantics and understanding, which might be abstract. The trolley problem is about ethics and has immediate emotional pull. We must choose one that best serves the goal of showing how details can manipulate intuition.

  The Chinese Room is chosen because:
  - It allows for multiple detail changes that can flip the intuition (e.g., what if the room is the size of a city? what if the instructions are in English? what if the person in the room is a computer?).
  - It is less emotionally charged, so we can focus on the structure of the argument without getting sidetracked by emotional responses.

  But we must be cautious: without a philosophy background, the Chinese Room might be harder to explain. We'll need a very clear, simple set-up.

  Alternatively, we could use a simpler thought experiment to start and then move to the Chinese Room? But the session is only 90 minutes and we want one carrying example.

  We'll go with the Chinese Room as the main example, but we must set it up very carefully.

  Plan Sequence:

  1. (5 min) Introduction: What are thought experiments? 
     - Briefly define: stories designed to trigger an intuition about a philosophical question.
     - Examples: mention a few (trolley, cave, Chinese Room) without details.
     - Goal of the session: to learn how to take apart these stories and see if they are doing real work or just manipulating us.

  2. (10 min) Establish the core idea: Intuitions are data about us.
     - Ask: "When you hear a thought experiment and have a gut reaction, what is that reaction telling you? Is it telling you about the world, or about how your mind works?"
     - Explain: The intuition is a fact about our own psychology. It's not direct evidence about the world, but it can be used as a starting point for reasoning. However, it can be manipulated by how the story is told.

  3. (15 min) Present the Chinese Room as a story, without the philosophy.
     - Tell the story simply: A person in a room who doesn't know Chinese follows instructions (in English) to manipulate Chinese symbols. To an outside observer, it looks like the room understands Chinese. But does it?
     - Ask the audience: What's your intuition? Does the room understand Chinese? (Get a show of hands: yes, no, unsure.)
     - Note: This is the classic setup: the intuition is that the room does not understand Chinese. Then we explain that this is used to argue against the idea that a computer (which is just following rules) can truly understand.

  4. (20 min) Break down the structure of the thought experiment.
     - What are the key elements? (The room, the person, the instructions, the symbols, the outside observer.)
     - What is the argument? (Premise: The room doesn't understand Chinese. Conclusion: Therefore, a computer that just manipulates symbols doesn't understand.)
     - Highlight that the story is designed to make us feel that the room doesn't understand.

  5. (25 min) Exercise: Vary the details and see how intuition changes.
     - We'll change one detail at a time and ask the audience to vote again (or note their intuition).
     - Variations (we'll do 2 or 3, depending on time):
          a. What if the room is not a small room but a whole city, with millions of people passing instructions? Does the city understand Chinese?
          b. What if the instructions are not in a book but in the person's memory (like a computer program in ROM)? Does that change anything?
          c. What if the person in the room is replaced by a computer? (Now it's a computer simulating the person. Does that computer understand?)
          d. What if the person in the room is a Chinese speaker? (But still following the instructions exactly without using their knowledge.) Does that change?
     - For each variation, ask: Does your intuition change? Why?
     - Point: By changing the details, we can see that our intuition is sensitive to the framing. The original thought experiment is trading on a specific setup to get the desired intuition.

  6. (10 min) Generalize: How to disassemble any thought experiment.
     - Steps:
          a. Identify the key elements of the story (characters, setting, rules).
          b. Identify the intuition it's trying to evoke.
          c. Try changing one detail at a time (especially ones that seem arbitrary) and see if the intuition flips or weakens.
          d. Ask: What is the conclusion the author is trying to draw? Is the story doing the work, or is the conclusion loaded in the setup?

  7. (5 min) Address common misconceptions (as they arise, but also recap at the end):
     - Misconception 1: "Thought experiments are just bad arguments, throw them out." 
          - Antidote: They are tools. They can be useful to clarify concepts, but we must be aware of their limitations and how they can be manipulated.
     - Misconception 2: "My gut reaction to the case is the proof." 
          - Antidote: The gut reaction is a starting point, but it's not proof. It's data about our own psychology and can be influenced by irrelevant details.

  8. (5 min) Omissions and Wrap-up:
     - Clearly state what we are not covering: We are not going into the philosophical debates about each example (e.g., we aren't solving the Chinese Room debate). We are not covering every famous thought experiment. We are not providing a complete list of fallacies.

  9. (5 min) Check Question:
     - Ask: "If you hear a thought experiment in an op-ed next week, what is one thing you can do to test whether the story is doing real work or just manipulating you?"
     - Desired answer: Vary a detail and see if the intuition changes.

  Now, let's structure the plan with the misconceptions as they might arise in the sequence:

  Misconceptions and when they might arise:
  1. "My gut reaction is the proof" - This may come up when we first ask for their intuition on the Chinese Room (step 3). We must immediately note that the intuition is data about them, not about the room. We can say: "Notice that your intuition is a fact about how you think. It's not a fact about the room. The room is imaginary."

  2. "Thought experiments are just bad arguments, throw them out" - This might come up in the breakdown (step 4) or during the exercise (step 5) when they see how fragile the intuition is. We can say: "They are not necessarily bad. They can help us explore concepts, but we must be critical of how they are built."

  We'll address them as they come up and then recap in step 7.

  Exercise: It goes in step 5. We vary the details of the Chinese Room and watch the intuition flip. We'll vary at least two details: one might be the scale (city-sized) and another might be the nature of the executor (computer or human). We'll do it live on the whiteboard.

  Omissions: We refuse to cover:
     - The entire philosophical debate about any one thought experiment (e.g., we won't solve the Chinese Room).
     - Every famous thought experiment (we use one as a model).
     - The history of thought experiments.
     - Formal logic.

  Check Question: As above.

