  The options seem to be: abandon (4) and redefine knowledge (cost: losing intuitive causal requirement), or keep (4) and reject epiphenomenalism (cost: physicalism about qualia). Or maybe find a third way where psychophysical laws aren't "lucky" but necessary? 

