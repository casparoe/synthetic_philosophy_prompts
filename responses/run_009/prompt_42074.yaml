prompt: |-
  I'm a clinical ethicist at a mid-sized teaching hospital, and in three weeks I'm presenting to our ethics committee a position paper I've been circling for two years. The thesis: advance directives concerning life-sustaining treatment have what I call conditional authority — stronger than mere evidence of what a patient once wanted, weaker than the binding force we give a contemporaneous competent refusal — because a directive functions as testimony about values rather than as a command issued by an owner to her future body. On my view, a directive to withhold, say, antibiotics from a patient with advanced dementia binds only insofar as the values it expresses (a lifelong horror of dependence, say) are values the patient can still be understood as bearing, in however vestigial a form; where the demented self has plainly and stably become someone with different, contented interests, the directive's authority lapses rather than being overridden by anyone. I arrived at this the hard way: my own mother, four years into Alzheimer's, wrote a directive in her early fifties refusing nearly everything short of comfort care, and last spring she was humming happily through her antibiotic course while I, of all people, recused myself from the committee's deliberation over whether to honor the paper. So the view is not academic to me, which is part of the problem.

  The committee is a genuinely mixed audience, and I want to be ready for what they specifically will throw at me, not for the generic objections I'd get at a philosophy conference. The chair is a palliative care physician who privately thinks directives mostly serve as instruments of family closure and treats them as revisable by default. The most philosophically serious member is an internist with broadly Kantian instincts who holds that the directive is an exercise of autonomy that later incapacity cannot cancel — roughly Dworkin's line about precedent autonomy, which he knows well and defends fluently. There's hospital counsel, who worries about liability and the federal framework requiring us to honor documented wishes; a chaplain whose concern is that we never treat the patient in the bed as if she has already left; a patient advocate who has watched families weaponize the phrase "she's not herself anymore" to justify indefinite treatment; and a rotating family member seat currently held by a widower who twice tearfully asked us to keep treating a wife whose directive said to let her go. The chair and the internist have both read the standard literature — the autonomy defense and the critics in the tradition of Dresser and Buchanan who argue that the actually existing patient's interests should count for more than the remembered ones — so I cannot present my middle position as unmapped territory.

  Please draft my Q&A prep sheet: the objections this specific committee will actually raise, in roughly the order they're likely to arrive and phrased in each member's own vocabulary, ordered by how much damage each could do to my position, each with a two-minute reply and an honest note on where the reply is soft. To help you target them, here is my sketch. (1) Contemporaneous competent refusals bind because they express the values of the person whose life it is. (2) The demented patient is not a different person, but neither is she a blank: there can be thin but real evaluative continuity between the author of the directive and the patient in the bed. (3) The proper function of a directive is to testify to the values held at the time of writing, not to command a future self. (4) Testimony has authority only where the witness remains competent to testify about that subject matter, and the competence that matters here is not cognitive but evaluative: does the patient, in behavior and partial utterance, still recognize the good she was pursuing when she wrote it? (5) Therefore directives lapse not when the patient forgets them but when the patient has demonstrably ceased to bear the relevant values. I already know the soft spots I'm aware of — humming through antibiotics is not a value, and my evidentiary standard for "vestigial values" in a nonverbal patient is embarrassingly thin — so please be candid about those and anything else I'm missing. Include the question I'm hoping nobody asks, and tell me why it's the dangerous one.
reasoning: |-
  Hmm, the user is a clinical ethicist preparing for a presentation on advance directives. They've developed a nuanced position that advance directives have "conditional authority" - stronger than mere evidence but weaker than binding commands. This stems from their personal experience with their mother's Alzheimer's and directive, making this deeply personal. They need a Q&A prep sheet tailored to their specific ethics committee members.

  The committee composition is fascinatingly diverse: a pragmatic palliative care chair, a Kantian internist, risk-averse counsel, a chaplain concerned about present personhood, a patient advocate wary of families overriding directives, and a grieving widower. Each will attack the position from different angles. The core tension is between respecting past autonomy (Dworkin) and present interests (Dresser/Buchanan).

  Key elements of their argument: (1) contemporaneous refusals bind because they express current values, (2) dementia patients maintain thin evaluative continuity, (3) directives testify to past values rather than command future selves, (4) this testimony requires ongoing evaluative competence, (5) directives lapse when values fundamentally shift.

  For the Q&A prep, I'll need to craft objections in each member's voice, prioritize by damage potential, and provide concise replies that acknowledge soft spots. The palliative chair will challenge practical implementation, the Kantian will attack the autonomy compromise, counsel will fear liability, the chaplain will resist "value abandonment," the advocate will see slippery slopes, and the widower brings emotional weight.

  The most dangerous question might be about evidentiary standards for nonverbal patients - their "vestigial values" concept is vulnerable when observable behaviors like humming don't clearly map to values. Another landmine is whether their view inadvertently encourages families to override directives by overinterpreting minor behavioral changes.

  Replies should be clinically grounded and time-boxed, admitting where the argument is thin (like defining "evaluative competence" operationally). Personal experience is both strength and vulnerability - it shows real-world stakes but risks perceived bias. The widower's perspective requires particular sensitivity since his lived experience mirrors the theory's hardest cases.
answer: |-
  Here's your Q&A prep sheet, structured by committee member in descending order of potential damage to your position, with objections phrased in their likely language, your concise reply strategy, and candid vulnerability notes. The "Dangerous Question" is at the end.

  **Priority Order & Objections:**

  1.  **The Kantian Internist (Highest Damage - Undercuts Core Premise):**
      *   **Objection (Kantian/Dworkin):** "You're fundamentally disrespecting autonomy. The directive *is* an act of self-legislation by the rational agent she was – the person whose life narrative *this still is*. Incapacity doesn't revoke her moral authorship. By saying her later contentment overrides her prior clear directive, you're treating her like two different people and privileging the interests of the diminished 'stranger' over the competent author's right to dictate the ending of her own story according to her considered values. This violates the very principle of precedent autonomy we rely on."
      *   **Reply (2 mins):** "I agree autonomy is paramount. But autonomy requires a *subject* capable of authorship. The directive reflects her values *then*. My point is that authority resides in *her ongoing values*, not just the document. If the values expressed in the directive demonstrably no longer define *who she is now* – if she has stably, demonstrably become someone whose core well-being *contradicts* those values (e.g., finds contentment in dependence she once feared) – then imposing those past values isn't respecting *her present autonomy*, it's imposing the *ghost* of her autonomy on a person who no longer inhabits those values. It treats the document, not the living patient, as the locus of authority. Respecting persons requires attending to the person *here*, even diminished, not overriding her present existence based solely on the past."
      *   **Soft Spot:** This *is* a deep philosophical split. You concede the past self's act isn't categorically binding, prioritizing the continuity of *values* over the *act* of directive-writing itself. The Kantian sees the *act* as sacrosanct. Your reply risks sounding like you *are* privileging the interests of the "stranger" if they can't articulate values. The "who she is now" argument is vulnerable to the charge of circularity.

  2.  **Hospital Counsel (High Damage - Practical/Legal Risk):**
      *   **Objection (Legal/Risk):** "This 'conditional authority' sounds like a legal minefield. Federal law (PSDA) and state statutes require us to honor 'effectuated' advance directives. You're proposing a subjective standard – 'vestigial values' – that's inherently fuzzy. How do we document this 'evaluative discontinuity' defensibly? What if the family disputes it? Providers will be terrified of liability if we withhold treatment based on a reinterpretation of the directive's applicability, especially if the patient dies. It seems simpler and safer to follow the clear directive unless there's clear evidence it *wasn't* what the patient wanted (e.g., recanted but didn't rewrite)."
      *   **Reply (2 mins):** "The law requires honoring *valid* directives reflecting the patient's *wishes*. My argument is that the directive's authority *as a command* depends on the continuity of the underlying values it expresses. Where that continuity is demonstrably broken, honoring the *letter* of the directive may violate the *spirit* of respecting the patient's actual wishes *now*. We already assess capacity and interpret directives contextually. This framework provides a *more* rigorous, values-focused standard than simply ignoring observable changes in the patient. We develop clear, multi-disciplinary protocols (clinical ethics consult, palliative, neuro, family input) to document observable behaviors indicative of values shift, focusing on stability and consistency. This isn't whim; it's a structured assessment of whether the directive still speaks *for this patient*."
      *   **Soft Spot:** Counsel is right about the legal ambiguity and risk. Your "structured assessment" doesn't exist yet and will be complex to implement. "Values shift" is harder to document objectively than cognitive decline. The reply relies heavily on developing robust (and potentially resource-intensive) processes.

  3.  **Palliative Care Chair (Moderate-High Damage - Undermines Practicality/Trust):**
      *   **Objection (Pragmatic/Relational):** "I see the theory, but in practice, directives are primarily tools for *families* to navigate impossible choices and find closure, knowing they followed Mom's 'wishes'. Your conditional approach injects huge uncertainty right when families need clarity most. How many families will accept 'she's content now, so we're ignoring her directive' without feeling we've betrayed her memory or are making our own convenience judgment? This seems likely to *increase* conflict and distress at the bedside when what we need is to support families in letting go based on a clear prior instruction."
      *   **Reply (2 mins):** "I share your focus on supporting families. But true support means grappling with the reality *at* the bedside, not just the document in the chart. A directive ignored because the patient is clearly *not* the person who wrote it – and is manifestly *not* suffering the fate they feared – can also cause profound family distress and guilt later. My approach requires *transparent conversation*: 'We see Mom wrote she feared dependence, but look at her now – she seems peaceful, engaged in small ways. Honoring her directive *now* might actually contradict *who she is now* and cause suffering she wouldn't want.' This isn't discarding directives; it's using them as the starting point for a deeper, more honest conversation about what respect for *this patient* requires *today*, potentially leading to *more authentic* closure based on present reality."
      *   **Soft Spot:** The Chair has a point about potentially increasing short-term conflict. The success hinges entirely on exceptionally skilled, sensitive communication, which is variable. The reply assumes clinicians *can* reliably identify "contentment" and families will accept this nuanced view, which isn't always true. It risks appearing to clinicians like unnecessary complication.

  4.  **Patient Advocate (Moderate Damage - Slippery Slope):**
      *   **Objection (Advocacy/Safeguards):** "I've seen families insist 'she's not herself' to demand treatment *against* a directive because *they* can't let go. Your framework feels ripe for abuse. How do you prevent 'conditional authority' from becoming a backdoor for families or providers to override clear directives whenever the patient *seems* content, especially nonverbal patients? What's the bright line between 'vestigial values' and just being passive? This seems to weaken the protection directives offer against unwanted treatment."
      *   **Reply (2 mins):** "This framework is designed to *protect the patient in the bed* from having past values imposed if they no longer fit. The burden of proof is *high*: not just 'she's not suffering,' but demonstrable, *stable* evidence that her *core values* reflected in the directive *are absent or contradicted* by her current expressions of well-being. It requires rigorous assessment, not family assertion. Crucially, it *only* applies to *withholding* care per a directive. It *never* justifies *imposing* treatment the directive *refused*. The default remains honoring the directive. This only kicks in where following it would arguably violate the *present* patient's demonstrable interests/values, providing a safeguard *against* being trapped by the past."
      *   **Soft Spot:** The slippery slope concern is valid. Your "high burden of proof" and "stable evidence" standards are abstract and hard to define/apply consistently, especially for nonverbal patients. The distinction between "can't express values" and "values have changed" is perilously thin.

  5.  **The Chaplain (Moderate Damage - Moral/Spiritual Concern):**
      *   **Objection (Personhood/Presence):** "You speak of the patient 'bearing' values vestigially. But doesn't this risk treating the person *here* as less than fully present, as merely a vessel for judging continuity with the past? Every person, however diminished, has sacred worth *now*. We must attend to who she *is* in this moment, not just who she *was*. Does your focus on 'evaluative continuity' risk diminishing our reverence for the person before us by making her value contingent on measurable links to her past self?"
      *   **Reply (2 mins):** "I agree completely. My *entire point* is to center the person *in the bed now*. The directive only has authority *insofar as it still speaks for her*. If her observable being – her expressions of contentment, her engagement with simple pleasures – demonstrates she no longer embodies the values underlying the directive (like a fear of dependence), then rigidly adhering to it *fails* to respect her sacred worth *as she exists today*. It imposes an external will. True reverence requires seeing *her*, not the directive. The 'evaluative continuity' lens is precisely the tool to ask: 'Does this document still reflect *this* person's values?' If not, honoring it disrespects *her*."
      *   **Soft Spot:** The Chaplain might feel the language of "vestigial values" or "evaluative competence" is still too clinical and reductionist, potentially objectifying the patient. The reply hinges on whether observing contentment *is* truly seeing the "sacred worth" or just a neurological state.

  6.  **Rotating Family Member (Widower) (Lower Damage - Emotional Resonance):**
      *   **Objection (Emotional/Lived Experience):** "I begged them to keep treating my Sarah, even though her paper said stop. They followed the paper. But... what if she *was* still in there? What if she *had* changed? How do you *know*? Your story about your mom haunts me. Did I let them kill Sarah because of words on paper when maybe... maybe she still wanted to be here? How can you be *sure* enough to stop treatment?"
      *   **Reply (2 mins):** "Your pain is why this is so hard. There are no easy answers or guarantees. My proposal doesn't make it easier; it acknowledges the agonizing uncertainty. In Sarah's case, the committee followed her clear directive, honoring *her* voice as it was known. My view doesn't say that was wrong. It just says that *sometimes*, when the person in the bed shows us *over time* and *consistently* that the core reasons they wrote that directive no longer seem to define them – like showing peace where they feared torment – then we have a duty to *reconsider* if that directive still speaks for *them*. It doesn't mean families get to demand treatment against a directive. It means we have to look *very, very closely* at the actual person, not just the document, with immense humility, to see who they are *now*. We can never be absolutely sure, but we must try to see *her*."
      *   **Soft Spot:** This is emotionally devastating. Your reply offers no comfort, only shared uncertainty. It might inadvertently validate his guilt or raise doubts about his wife's case where none existed before. It highlights the profound anguish inherent in any approach.

  **The Dangerous Question You Hope Nobody Asks (But Someone Might):**

  *   **Question:** "Okay, you talk about 'vestigial values' and observable behavior indicating the patient still 'bears' the values underlying the directive. Take your mother humming during antibiotics. You say that shows contentment, implying the value of 'avoiding dependence' no longer applies. But how is humming *any* evidence of her *values*? Isn't it just a reflex, a neurological artifact, or simple present-moment sensory pleasure? How do you get from observing primitive behavioral responses (humming, smiling at a touch, eating) to making a profound judgment that core *values* expressed in a carefully considered directive have fundamentally *changed*? Isn't this just projecting our interpretation onto emptiness? And crucially, **what specific, operationalizable criteria – especially for a nonverbal advanced dementia patient – could *possibly* meet your burden of proof for 'demonstrably ceased to bear the relevant values' that isn't hopelessly subjective or circular?**"

  *   **Why It's Dangerous:** This strikes directly at the weakest point in your otherwise carefully reasoned framework: **the operationalization gap**. It exposes the profound difficulty, perhaps impossibility, of reliably assessing *values* (as opposed to mere affect or reflexes) in someone with advanced dementia who cannot communicate conceptually. Your concepts ("evaluative competence," "bearing values") are philosophically coherent but clinically nebulous. The "humming" example perfectly illustrates the leap from observable behavior to inferred value shift, a leap vulnerable to charges of subjectivity, wishful thinking, or neurological reductionism ("it's just the disease talking, not *her*"). This question forces you to admit the evidentiary standard is unavoidably interpretive, contextual, and fallible, potentially undermining the perceived rigor and practicality of your entire position. It risks making your "conditional authority" seem like an unworkable philosophical abstraction when applied to the hardest cases.

  **Your Best Reply Attempt (Acknowledge the Vulnerability):**
  "Your skepticism is warranted; this is the hardest part. We *cannot* directly access values in advanced dementia. We infer from behavior *over time* and *in context*. Humming alone isn't enough. We look for patterns: consistent signs of distress *vs.* contentment in situations related to the value (e.g., accepting care calmly vs. resisting), engagement with stimuli suggesting positive affect, absence of signs suggesting the feared state (e.g., terror, withdrawal). We involve families who knew them deeply to interpret behaviors. We require *stability* – not a fleeting smile, but a sustained observable state contradicting the directive's premise. It's interpretive, yes. But *not* interpreting risks greater harm: imposing a death based on values the patient may no longer hold, potentially causing suffering to a being who now finds simple existence good. We use the best evidence we have – behavior observed by multiple caregivers/family, documented over time – with humility, recognizing the limits, but believing it's more respectful than ignoring the living person before us. There's no perfect algorithm, only careful, multidisciplinary judgment focused on the patient's *demonstrable* well-being *now*."

  **Key Soft Spots Highlighted Throughout:**
  1.  **Defining/Measuring "Evaluative Continuity" & "Vestigial Values":** Thin evidence, risk of subjectivity, circularity ("she's content so her values changed").
  2.  **Operationalization Gap:** Lack of clear, objective criteria for determining when the "burden of proof" for value shift is met, especially for nonverbal patients.
  3.  **Practical Implementation & Risk:** Legal ambiguity, potential for increased conflict, need for complex new protocols.
  4.  **Slippery Slope:** Risk of misuse to override directives based on family pressure or provider discomfort.
  5.  **Philosophical Tension:** Inherent conflict with strong Kantian/Dworkinian views of precedent autonomy as categorical.
  6.  **Emotional Landmines:** Potential to exacerbate family guilt or doubt in past decisions.

  **Preparation Tip:** Anticipate the Dangerous Question and practice the "humming" example relentlessly. Frame it not as proof, but as *part* of a pattern requiring rigorous, documented assessment. Emphasize the *high burden of proof* and *default to the directive* unless this burden is met. Acknowledge the uncertainty openly. Your personal story is powerful – use it to show why grappling with this ambiguity is ethically necessary, not to prove your view is definitively right. Good luck. This is brave and important work.
