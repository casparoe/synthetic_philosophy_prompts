prompt: |-
  So I've been reading up on the St Petersburg paradox, and while going down that rabbit hole I stumbled on the Pasadena game (Nover and Hájek's thing I believe?). From what I understand the setup is: flip a fair coin until it lands heads, and if heads comes up on the nth flip you win (-1)^(n-1) · 2^n / n dollars or something like that, so the payoffs alternate between huge positive and huge negative, and the "expected value" series is conditionally convergent, meaning if you sum it in a different order you can literally get any number you want.

  Here's what's bugging me though. If the ordering of the sum is arbitrary, doesn't that basically make the game free money? Like, couldn't I just declare I'm summing the series in the order that gives a massive positive expectation, rationally pay a fortune to play, and then a casino could sum it in a different order and set whatever price they want? Someone has to be wrong there — where's the arbitrage actually get exploited, or does the fact that the sum depends on bookkeeping just mean no price is coherent at all?

  And second, if the takeaway is that expected utility just quietly stops applying to heavy-tailed games, what should I actually use instead for decisions like this? I've seen people say use the median instead of the mean but that feels like it'd throw away real information about tail outcomes. Btw why do people even call this a "paradox"? It seems like its just a fact about conditionally convergent series, mathematicians have known that rearranging them changes the sum since forever. Doesn't seem to contradict anything the way a real paradox should?
