prompt: |-
  I have a set of verdicts about what can and cannot be passed along by testimony in the aesthetic domain, and I would like to know whether any single principle captures them. Here are my gut reactions, honestly reported even where I suspect they are inconsistent.

  A friend whose taste has tracked mine for years tells me the new film by a director we both love is a masterpiece. I believe her before seeing it, and I act on the belief — I buy tickets, I recommend the film to others. Yet I feel I have not acquired whatever it is one acquires from seeing it, and I would not say I have experienced its being a masterpiece.

  A respected architecture critic writes that a building I have never visited is a forbidding and alienating piece of design. I believe this, cite it in conversation, and feel no unease at all about doing so.

  I taste nothing wrong with a wine, but a sommelier I trust tells me it is corked. I believe the wine is flawed. This feels entirely fine — in fact it feels like a paradigm of learning from an expert.

  A friend describes a sunset to me, and though I believe her that it was beautiful, I balk at saying I know the sunset was beautiful, in a way I do not balk at saying I know the exhibit was controversial when she tells me that. The asymmetry feels real to me even though both claims reached me by the same route.

  Someone tells me a joke is funny. I hear the joke and do not find it funny at all. I nonetheless believe it is funny — funny to its intended audience, funny in the teller's mouth. This feels like ordinary belief from testimony, not a degraded or secondhand version of anything.

  Here is the tension I keep circling. The corked wine and the beautiful sunset both seem to be claims whose truth depends on how things strike someone. Yet I accept the wine verdict from the expert without reservation while withholding something — knowledge, entitlement, I am not sure what — in the sunset case. And my tentative principle makes it worse: I want to say testimony transmits whatever is available to common observation but not claims whose truth depends on the subject's own response. The wine seems to fall on the wrong side of that line, and the forbidding building, which I happily accept on the critic's word, may fall on the wrong side too, since whether it alienates seems to depend on the observer as much as whether a sunset is beautiful does.

  So: is there a principle that captures these verdicts, or must some go? Candidates I can half-see involve a distinction between claims about how things are for an expert observer, claims about how things are for me, and purely descriptive aesthetic claims — but I cannot make that tripartite division do the work without the joke case collapsing into the wrong category. Please state the principle, or a small set of candidates, as precisely as you can, say which verdict motivates each clause, tell me what it predicts about two further cases I have not mentioned — someone telling me a poem is a sonnet versus telling me it is haunting, and someone telling me a meal was delicious versus that it was over-salted — and be explicit about which of my verdicts your preferred principle cannot save, since I suspect at least one of them deserves to be sacrificed.
reasoning: |-
  Okay, the user presents a fascinating puzzle about testimony in aesthetics. They've carefully described six scenarios where their intuitive reactions to accepting aesthetic claims through testimony seem inconsistent. The core tension revolves around when testimony feels "full" versus when it feels deficient - especially striking in the wine/sunset asymmetry where both involve subjective responses yet trigger different reactions. 

  Hmm, what's really gnawing at them? Beyond seeking a principle, they're wrestling with epistemic anxiety - that uncomfortable sense their intuitions might betray deeper contradictions. The sunset case clearly haunts them most, where they accept the beauty claim but resist calling it knowledge. And that joke example is sneaky clever - it forces any principle to confront cases where we defer to collective subjectivity.

  Their proposed "common observation vs personal response" distinction fails because the wine expert's judgment also depends on subjective perception. So we need something more nuanced. The key might be distinguishing between different types of aesthetic properties: some are inter-subjectively verifiable (corked wine) while others require personal encounter (beauty). But the critic's building assessment complicates this - they happily accept "forbidding" without visiting, which feels equally experiential.

  Ah! Perhaps the solution lies in the nature of the claim's authority. For corked wine, we accept the sommelier as detecting an objective flaw; for the building critic, we trust their professional assessment of typical human responses. But sunset beauty demands first-person experience. Yet the joke case undermines this - we believe it's funny without experiencing amusement. Unless... we treat humor as belonging to the category of public properties?

  Let me test this. Proposed principle: Testimony transmits aesthetic properties when they're either (1) inter-subjective capacities (like wine flaws detectable by trained senses) or (2) attributions about general human responses (like the building's alienating effect). But it cannot transmit properties requiring direct phenomenal experience (beauty of sunsets) - though we can still believe such claims without experiential knowledge.

  Now for their new cases: 
  - "This poem is a sonnet" - easily transmitted (formal property).
  - "This poem is haunting" - transmissible if we mean it generally affects people this way; not if meaning "you will feel haunted."
  - "The meal was delicious" - not fully transmissible (requires taste).
  - "It was over-salted" - transmissible as technical assessment.

  The sacrifice? The joke case must partially collapse: we can believe it's funny, but this belief lacks the qualitative dimension of finding it funny ourselves. And in the film masterpiece case, we can believe it's excellent but not experience its excellence without seeing it. That honors their intuition that testimony gives belief but not experiential knowledge for certain aesthetic properties.

  This preserves most intuitions while acknowledging two layers of aesthetic judgment: factual beliefs about aesthetic properties versus the lived experience of them. The user might need to accept that "knowing" an aesthetic property sometimes means holding a justified belief rather than possessing phenomenal knowledge. That feels true to life - I can know a joke is funny without laughing, but something is missing.
answer: |-
  Here's a principle that captures most of your verdicts while sacrificing the least intuitive one, motivated by the distinctions and tensions you identified:

  **The Principle of Phenomenal Presence versus Objective Disposition:**

  > Testimony can transmit belief in aesthetic claims that describe an *objective disposition* of the object to produce certain responses in qualified observers under standard conditions. It cannot transmit the *phenomenal presence* of the aesthetic quality itself – the "what it is like" to experience it – nor can it grant *experiential knowledge* of that phenomenal presence.

  **How it explains your verdicts:**

  1.  **Film Masterpiece (Belief/Action Yes, Experiential Knowledge/Feeling No):** The claim "it's a masterpiece" asserts an objective disposition (it reliably produces profound appreciation in qualified viewers under proper viewing conditions). Testimony transmits *belief* in this disposition. However, seeing it provides the phenomenal presence of its mastery – the direct experience of *why* it merits that label. (Motivated by: Feeling you haven't acquired "whatever it is one acquires from seeing it").
  2.  **Forbidding Building (Belief/Action Yes):** "Forbidding and alienating" describes an objective disposition of the building (it reliably produces feelings of intimidation/distance in typical observers under normal conditions). The critic is the qualified observer. Testimony transmits belief in this disposition. (Motivated by: Feeling "no unease at all" about citing it).
  3.  **Corked Wine (Belief Yes):** "Corked" describes an objective flaw (TCA contamination) detectable by qualified observers (sommeliers) that reliably produces a specific negative sensory response (musty, damp cardboard) under standard tasting conditions. Testimony transmits belief in this objective disposition/flaw. (Motivated by: Feeling like a "paradigm of learning from an expert").
  4.  **Beautiful Sunset (Belief Yes, Knowledge No):** You *believe* the claim "it was beautiful" asserts an objective disposition (it reliably produces feelings of beauty in typical observers under standard viewing conditions). However, *knowing* it was beautiful – in the strong, experiential sense – requires having the phenomenal presence of that beauty yourself. Testimony transmits the belief in the disposition but cannot grant the phenomenal knowledge. (Motivated by: Asymmetry in willingness to say "I know" vs. the controversial exhibit).
  5.  **Funny Joke (Belief Yes):** The claim "it is funny" (especially interpreted as "funny to its intended audience, funny in the teller's mouth") asserts an objective disposition (it reliably produces amusement in its intended audience when competently delivered). Testimony transmits belief in this disposition. It does *not* transmit the phenomenal experience of finding it funny yourself. (Motivated by: Feeling like "ordinary belief from testimony").

  **Resolving the Tension:**

  *   **Wine vs. Sunset:** Both depend on "how things strike someone," but the principle distinguishes the *dispositional property* (transmissible by testimony) from the *phenomenal experience* (not transmissible). You accept the *disposition* ("this wine is flawed/corked", "that sunset was beautiful") from testimony in both cases. The asymmetry lies in *knowledge*: For the sunset, you intuitively feel you lack the phenomenal knowledge *of* that beauty, even while believing the dispositional fact *that* it was beautiful. The wine flaw feels different because "corked" is treated more as an objective, detectable *state* (like being broken) causing the negative experience, rather than the experience itself being the primary object of the claim.
  *   **Building:** "Forbidding and alienating" is treated as an objective dispositional property of the building (how it reliably affects observers), hence transmissible. It avoids the "wrong side" because the claim focuses on the building's effect, not mandating your personal feeling *now*.

  **Predictions for New Cases:**

  1.  **"This poem is a sonnet" vs. "This poem is haunting":**
      *   **Sonnet:** Easily transmitted by testimony. This is a formal, structural property verifiable by common observation/analysis (counting lines, rhyme scheme, meter). It's not inherently aesthetic/dispositional in the relevant sense. *(Prediction: You'd happily accept this and say you know it.)*
      *   **Haunting:** Testimony transmits *belief* that the poem has the objective disposition to reliably evoke feelings of haunting (e.g., unease, lingering resonance, melancholy) in qualified readers under standard conditions. It does *not* transmit the phenomenal experience of *being* haunted by it. *(Prediction: You'd believe it's haunting if told by a trusted critic/reader, but you wouldn't feel you had *experienced* its haunting quality or necessarily say "I know it is haunting" in the full experiential sense until you read it yourself.)*

  2.  **"The meal was delicious" vs. "The meal was over-salted":**
      *   **Delicious:** Testimony transmits *belief* that the meal has the objective disposition to reliably produce pleasurable taste experiences in qualified observers (people with similar tastes, not ill, etc.) under standard conditions. It does *not* transmit the phenomenal experience of tasting its deliciousness. *(Prediction: You'd believe your friend that it was delicious, but you wouldn't say you *know* its deliciousness or have experienced it without eating it. This mirrors the sunset.)*
      *   **Over-salted:** Testimony transmits belief. This describes an objective, detectable flaw (excess sodium chloride) identifiable by qualified tasters (e.g., chefs, experienced eaters) that reliably produces a specific negative sensory response (excessive saltiness overwhelming other flavors). It's analogous to "corked" wine. *(Prediction: You'd readily accept this from a trusted source and feel you know it was over-salted, acting accordingly (e.g., avoiding it or asking for less salt next time).)*

  **The Sacrifice:**

  This principle requires sacrificing the **intuition of full parity in the Joke Case**.

  *   **What the Principle Says:** You believe testimony that the joke *has the disposition* to amuse its audience. This is "ordinary belief" in the dispositional property.
  *   **What Must Go:** The feeling that this is "not a degraded or secondhand version of anything" *if* "anything" includes the phenomenal experience of finding it funny. According to the principle, the belief transmitted *is* degraded/secondhand *with respect to the phenomenal experience itself*. You believe *that* it is funny (dispositionally), but you haven't *felt* its funniness. Your description ("I do not find it funny at all") highlights this gap. The principle explains *why* you believe it's funny dispositionally (testimony) while acknowledging you lack the phenomenal experience (you didn't find it funny).

  **Why Sacrifice This?**

  1.  **Consistency:** Holding onto the feeling that the joke belief is experientially "undegraded" creates the starkest inconsistency with the Sunset and Film cases, where you clearly feel a lack in experiential knowledge/presence.
  2.  **Phenomenal Core:** Aesthetic properties like being funny, beautiful, or haunting seem intrinsically tied to a *felt experience*. Testimony about dispositions doesn't replicate that feeling.
  3.  **Your Own Reaction:** Your statement "I hear the joke and do not find it funny at all" directly undermines the idea that testimony delivered the phenomenal experience. You have the dispositional belief *without* the phenomenal presence.

  **Conclusion:**

  The Principle of Phenomenal Presence vs. Objective Disposition best captures your core intuitions across the cases. It distinguishes between believing *that* an object has an aesthetic disposition (transmissible by testimony) and *experiencing* the phenomenal quality or having experiential knowledge *of* it (not transmissible by testimony). This resolves the wine/sunset tension, accommodates the building critic and wine expert, explains the film/masterpiece case, and predicts the new cases coherently. The cost is acknowledging that your belief in the joke's funniness, while justified by testimony as a belief in a disposition, *is* "degraded" or "secondhand" relative to the phenomenal experience of finding it funny – a cost justified by the need for consistency and the inherent nature of phenomenal experience.
