prompt: |-
  I'm putting together a syllabus module on philosophy of medicine, and before I have the students read the naturalists and the normativists I want them to write the spec first — I don't want them grading theories against criteria they never articulated. So help me with the spec. The purpose matters here: the account doesn't have to settle metaphysics once and for all, it has to be good enough to do real work for deciding what a public health system should treat and pay for, and what counts as illness for things like sick leave or legal excuses.

  Give me the desiderata for an adequate account of health and disease — what it has to deliver and why, case by case. At minimum I'd want coverage of the classics: whether a condition being statistically abnormal in a reference class makes it a disease (and what to do about athlete's slow resting hearts or the fact that basically everyone's back is a mess by evolutionary-design standards), whether dysfunction in the biological-function sense is necessary, whether the account can explain why infertility counts but choosing to be childless doesn't, and whether it can handle disagreement over things like ADHD or whether grief became a disorder when the DSM folks loosened their criteria. But add whatever I'm missing.

  Then two things I really want from you: first, flag which desiderata are camp prejudices in disguise — i.e., things only a naturalist or only a normativist would demand — versus which are genuinely load-bearing for the practical purpose, and mark each one negotiable or not. Second, tell me if any subset of the requirements is jointly unsatisfiable, because if it is, that's the actual lesson of the module, and which single requirement does the most to knock out the main contenders. My sister is a GP and keeps insisting the whole debate is academic since "disease is just what we treat," so also tell me whether that lazy view satisfies the spec or fails it. Table format is fine. Keep citations out of it, I'll add those myself.
reasoning: |-
  Okay, the user is putting together a philosophy of medicine syllabus module and wants help creating a "spec" for health/disease concepts before students dive into naturalist vs. normativist debates. They're clearly frustrated with theoretical debates that ignore real-world applications—this spec needs to anchor abstract theories to concrete policy decisions like healthcare coverage and sick leave eligibility.  

  Hmm, their examples reveal core tensions: statistical normality fails for athlete heart rates, biological dysfunction struggles with universal back pain, and value judgments bleed into cases like infertility vs. voluntary childlessness. They also want to expose hidden biases in desiderata—smart, since students often miss how camp loyalties shape "neutral" criteria.  

  The GP sister’s "disease is what we treat" quip is provocatively reductive. It’d fail the spec catastrophically by making coverage arbitrary (desideratum 4) and ignoring dysfunction anchors (desideratum 2). But it’s a useful foil—shows why we need philosophy when policies affect lives.  

  Biggest landmine: desideratum 5 (value transparency) clashes with naturalists’ insistence on objectivity. If we demand explicit values for decisions like ADHD coverage, hardcore naturalists scream "relativism!" Yet without it, we get covert normativity—like pathologizing grief. That tension might be the module’s core lesson.  

  Also noting the infertility case (desideratum 3) is a stealth killer for pure naturalism. Biological dysfunction exists, but we only call it disease if undesired. A naturalist must awkwardly bolt on values, while normativists at least admit it upfront.  

  Practical takeaway: the spec forces students to see that *any* usable account hybridizes facts and values. The sister’s view fails because it’s all practice, no theory; academic debates fail by ignoring practice. The sweet spot? Acknowledge dysfunction where it exists, but own the value judgments when deciding what to treat.
answer: |-
  Here's a spec for an account of health/disease designed for practical decision-making in public health systems, sick leave, and legal contexts. I've flagged biases, negotiability, conflicts, and assessed the "disease is what we treat" view.

  ### Desiderata for a Practical Account of Health & Disease

  | # | Desideratum                                      | Why It's Load-Bearing (Practical Purpose)                                          | Camp Bias?                                         | Negotiable? | Conflicts With |
  |---|--------------------------------------------------|------------------------------------------------------------------------------------|----------------------------------------------------|-------------|----------------|
  | **1** | **Distinguish treatable conditions from normal variation/identity** | Prevents medicalization of benign traits (e.g., homosexuality) or resource waste on non-harmful "abnormalities" (e.g., athlete's bradycardia). | Naturalist (if "normal" = statistical/functional), Normativist (if "normal" = socially valued) | **NO** | #4 (if values dominate) |
  | **2** | **Anchor in biological dysfunction (when applicable)** | Provides objective basis for conditions like infection, cancer, or genetic disorders. Limits arbitrariness in coverage decisions. | **Naturalist Prejudice** (if demanded universally) | YES (Scope) | #3, #5, #6 (for conditions like infertility or grief) |
  | **3** | **Incorbrate harm/disadvantage**                | Explains why we treat infertility (harmful dysfunction) but not voluntary childlessness (no harm), or why severe back pain is pathological but universal mild degeneration isn't necessarily. | **Normativist Prejudice** (if *sole* basis) | **NO** | Pure #2 (if dysfunction without harm is sufficient) |
  | **4** | **Enable consistent application**                | Essential for fair resource allocation (public health), sick leave, and legal standards. Avoids arbitrary or discriminatory decisions. | **Neutral** | **NO** | #5 (if values are explicit/subjective) |
  | **5** | **Acknowledge & manage value pluralism**         | Allows transparent debate on contested conditions (ADHD, grief duration). Prevents imposing one group's values (e.g., pathologizing dissent). | **Normativist Prejudice** (if overemphasized to exclusion of biology) | **NO** | Pure #2 (if biology is considered value-free) |
  | **6** | **Handle "universal dysfunctions"**              | Addresses conditions common by evolutionary "design" (e.g., back pain, vulnerability to decay). Prevents labeling universal traits as diseases. | **Neutral** | YES (Threshold) | Strict #2 (if dysfunction alone defines disease) |
  | **7** | **Avoid circularity ("disease is what we treat")** | Prevents self-justifying expansion of medicine and shields decisions from critical scrutiny. | **Anti-Lazy View** | **NO** | GP Sister's View |
  | **8** | **Guide intervention priorities**                | Helps distinguish urgent pathology (severe infection) from minor deviation (mild myopia) for resource allocation. | **Neutral** | YES (Precision) | - |

  ### Key Conflicts & Lessons

  1.  **The Core Tension:** **#2 (Biological Dysfunction) vs. #3 (Harm/Disadvantage) vs. #5 (Value Pluralism)**. This is the central, likely **unsatisfiable trio** under pure naturalism or normativism:
      *   **Naturalism** (#2) struggles with #3 (infertility is dysfunctional but only a disease if *unwanted*) and #5 (ADHD's pathology depends on societal demands).
      *   **Normativism** (#3/#5) struggles with #2 (without *some* dysfunction anchor, "harm" becomes too broad, e.g., poverty as disease).
      *   **Practical Resolution Requires Hybridity:** Any workable account *must* combine biological dysfunction with harm assessment framed by societal values. The lesson is that neither pure camp suffices for policy.

  2.  **The Biggest Contender-Knocker:** **#5 (Acknowledge & Manage Value Pluralism)**. This requirement:
      *   **Devastates Pure Naturalism:** Shows biology alone cannot resolve debates like ADHD or grief timelines; values *must* be explicit.
      *   **Challenges Simplistic Normativism:** Highlights that values aren't arbitrary; they interact with biological evidence (dysfunction/harm) to avoid absurdity (e.g., pathologizing political opposition).
      *   **Exposes the GP Sister's View:** Reveals it as circular and incapable of handling value conflicts transparently.

  ### Assessment: "Disease is just what we treat" (GP Sister's View)

  *   **Fails Spectacularly:**
      *   **Violates #7 (Circularity):** Provides no independent justification *for* treatment, leading to arbitrariness or industry-driven expansion.
      *   **Fails #1:** Cannot distinguish treatable conditions from normal variation (e.g., why *not* treat short stature or menopause universally?).
      *   **Fails #3:** Cannot explain why we treat infertility but not voluntary childlessness (both are "not treated" in one case).
      *   **Fails #4:** Leads to inconsistency (e.g., coverage varies wildly based on provider whim or local resources, not need).
      *   **Fails #5:** Evades the necessary debate about *why* we *should* treat something, hiding value judgments.
      *   **Fails #8:** Offers no guidance for prioritization beyond current practice.
  *   **Why it's Tempting (but Lazy):** It reflects clinical pragmatism but ignores the foundational reasoning needed for fair, sustainable, and ethical policy decisions at a systemic level. It collapses under scrutiny for public health purposes.

  ### Summary for Your Module

  *   **The Spec Reveals:** No pure theory satisfies all core practical needs (#1, #3, #4, #5, #7). The necessity of combining biological dysfunction with harm assessment and explicit value negotiation is the key takeaway.
  *   **The Central Conflict:** Reconciling objective biological anchors (#2) with the unavoidable role of values in defining harm (#3) and managing pluralism (#5) is the fundamental challenge.
  *   **Naturalist Blind Spot:** Underestimating the necessity of #3 and #5 for practical decisions (especially contested conditions).
  *   **Normativist Blind Spot:** Underestimating the constraining and justifying power of #2 (dysfunction) to prevent over-medicalization or arbitrariness.
  *   **The "Lazy View" Failure:** Demonstrates *why* philosophy is essential – practice without critical conceptual foundations is unjustifiable and unstable for policy.
