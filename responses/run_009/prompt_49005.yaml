answer: |-
  Here’s a decision-tree handout designed to sort readers by their *practical beliefs* about Stoic control, using concrete cases instead of labels. It has 7 branch questions and 4 end points.

  ---

  ### **The "Up to Us" Decision Tree**
  *Start here:* Some things are "up to us" (we control them), others aren’t. Answer based on your gut reaction to these situations:

  1.  **The Archer:** An expert archer perfectly aims, but accepts that wind or luck might make her miss her target. Is this…
      -   **A)** Wise (her control was only over the aiming, not the hit)? → Go to Q2
      -   **B)** Pointless or depressing (why aim well if you don’t control the outcome)? → Go to Q3
      -   **C)** Confused (she *does* control the outcome by controlling her skill/luck)? → Go to Q5

  2.  **Job Interview:** You prepare perfectly for an interview. Should you "try to influence" the outcome (getting hired), which you ultimately don’t control?
      -   **A)** Yes, "influence" is real and distinct from total control. → Go to Q4
      -   **B)** No, "influence" is an illusion; focus only on your prep (what you *truly* control). → Go to Q3
      -   **C)** "Influence" is just effort; the outcome is still not "up to you." → Go to Q6

  3.  **Practicing Courage:** Building courage is more like…
      -   **A)** Practicing free throws (focus on your form/effort, the "score" isn’t the point). → **LEAF: Strict Dichotomy**
      -   **B)** Playing a game (you practice *to win* the "courage test" when it matters). → **LEAF: Deflationary View** OR **Trichotomy?** (*See note below*)
      -   **C)** Something else? → *Flag: Unexplored View (Go to Q7)*

  4.  **The Gambler:** A gambler bets on dice. They control…
      -   **A)** Nothing at all (it’s pure chance). → Go to Q6
      -   **B)** Their choice to bet/not bet, but not the dice roll. → **LEAF: Trichotomy (Influence)**
      -   **C)** Their focus/luck somehow? → Go to Q5

  5.  **Addict's Craving:** An addict feels a powerful craving. Is managing this craving "up to them"?
      -   **A)** Yes, they control their *response* to the craving (e.g., not acting on it). → Go to Q6
      -   **B)** No, the craving itself overwhelms their control. → Go to Q7
      -   **C)** Partially, but it’s incredibly hard and requires help. → **LEAF: Trichotomy (Influence)**

  6.  **Determinism Needed?** Does the "up to us" distinction *only* make sense if our choices/actions are predetermined?
      -   **A)** Yes, "control" means acting according to our nature/causes without external force. → **LEAF: Compatibilism**
      -   **B)** No, it works regardless (or even requires some free will). → Go to Q7

  7.  **"Just Psychology"?** Is the "up to us" idea primarily…
      -   **A)** A profound truth about the nature of agency? → **LEAF: Strict Dichotomy**
      -   **B)** A useful psychological trick to reduce anxiety? → **LEAF: Deflationary View**
      -   **C)** A confusing mix of both? → *Flag: Unclear View (Revisit Q1-6)*

  ---

  **Leaf Rationales (1-2 sentences):**

  *   **Strict Dichotomy:** You believe *only* our judgments, assents, and impulses (our inner "choice") are truly "up to us." Everything else (body, property, reputation, outcomes) is indifferent externals. The archer controls only aiming, the addict controls only their response, courage is about inner resolve, not outcomes. *(Classical Stoic Core)*
  *   **Trichotomy (Influence):** You believe there's a middle category: things we *influence* but don't absolutely control (effort, preparation, skill, relationships, some outcomes). "Trying to influence" the job makes sense. The gambler controls betting, the addict influences their cravings with effort. *(Modern Self-Help Adaptation)*
  *   **Compatibilism:** You believe "up to us" means acting *freely according to our determined nature*, without coercion. It requires determinism to define "control" as unforced internal causation. The distinction makes sense only within this framework. *(Philosophical Reconciliation)*
  *   **Deflationary View:** You see the "up to us" split as either trivially true (obviously we control our *thoughts* more than the weather) or a psychological tool to manage expectations, divorced from deeper philosophy or providence. It's "just psychology," not profound metaphysics. *(Skeptical/Pragmatic Take)*

  ---

  **Notes on Paths & Dead Ends:**

  *   **Q3B (Courage = Playing to Win) & Trichotomy:** Someone landing here *might* hold a Trichotomy view where outcomes matter significantly, but it's ambiguous. If they also answered earlier questions emphasizing influence (Q2A, Q4B, Q5C), they likely belong in **Trichotomy**. If not, **Deflationary** is more likely (seeing focus on effort as just a trick to win).
  *   **"Just Psychology" Separation:** Q7 explicitly separates **Strict** (A - Profound Truth) from **Deflationary** (B - Useful Trick), even though both might call it "psychology." Their *valence* (profound vs. trivial/tool) differs.
  *   **Potential Dead Ends:**
      *   **Q3C + Later Inconsistency:** Landing on Q3C ("Something else" for courage) and then giving inconsistent answers later might indicate an incoherent or highly personalized view not captured here.
      *   **Rejecting Both Q6 Options:** If someone strongly rejects *both* the need for determinism (Q6A) *and* the idea that control works without it (Q6B), their view is unexplored in this tree (perhaps libertarian free will clashes with the dichotomy).
      *   **Q7C (Confusing Mix):** This flags the reader needs to reflect more consistently on the concrete cases; their answers don't clearly map to a coherent position in this framework.

  This tree forces readers to confront the practical implications of "control what you can control" through relatable scenarios, revealing their underlying beliefs without Stoic jargon.
