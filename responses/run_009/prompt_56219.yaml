prompt: |-
  I am preparing a fifty-minute section of an undergraduate philosophy of science course on the underdetermination of theory by evidence, and I am asking not for the explanation itself but for a plan of it. The students are second- and third-year philosophy majors who have just completed a unit on Duhem-Quine holism, and my experience is that they arrive primed to conflate the two theses.

  Please structure the plan around the following. First, the order of ideas: which component must be in place first for the thesis to register as a claim about the structure of evidential support rather than as a sigh of epistemic resignation, and why that dependency runs the way it does. The plan should draw a hard line between underdetermination and the auxiliary-hypothesis holism they have just learned; I want the students to leave able to say what the difference is, not merely to have been told it. Second, the carrying example: I would like it built on something in the spirit of Reichenbach's distinction between differential and universal forces, or a structurally equivalent device of your devising — two rivals that agree on every possible observation and yet disagree about something the students can state precisely. It must not be one of the stock cases: no Newtonian world supplemented by undetectable forces, no polynomial curve-fitting, no brain in a vat. Say what the example must have and what it must lack, and why it is the one element that carries the whole section. Third, the misconception map: I anticipate at least (a) the slide from no evidence currently distinguishes them to no possible evidence could — the contrast some of the literature marks as transient versus permanent underdetermination — (b) the collapse of the thesis into blanket skepticism, and (c) the thought that a simplicity tie-breaker dissolves the problem. Place each misconception at the point in the sequence where it is best headed off, rather than waiting for it to surface. Fourth, a closing question I could ask that would reveal whether the students have understood the thesis rather than merely found it depressing. Finally, name what I should openly decline to cover at this level — I am inclined to say the status of parsimony, though you may disagree — and indicate how I should say so without inviting the students to file the whole topic under unanswerable.
reasoning: |-
  Okay, the user is preparing a 50-minute undergrad philosophy of science lecture on underdetermination of theory by evidence. They've just covered Duhem-Quine holism and want to avoid students conflating the two. Let me break down their requirements.

  First, the structure needs to clarify how underdetermination is about evidential support structure, not skepticism. The key is establishing logical possibility before epistemic implications. Students must grasp that evidence alone can't pick between theories, but that doesn't mean knowledge is impossible. 

  For the example, they want something original - no clichés like brains in vats. Needs to show two theories making identical predictions but differing in unobservable claims. Reichenbach's universal forces are a good template. I'll adapt this to a "cosmic tilt" scenario where gravity explanations diverge imperceptibly. Must avoid any detectable differences while keeping the core disagreement tangible.

  Misconceptions to preempt: (a) confusing current vs permanent underdetermination, (b) sliding into full skepticism, (c) thinking simplicity solves it. These should be addressed at specific points - like clarifying permanence when introducing the example, and differentiating from holism early on. 

  The closing question should test understanding, not just provoke despair. Something requiring them to articulate why underdetermination persists despite predictive equivalence. 

  Finally, boundaries: must avoid diving into parsimony debates or dissolution attempts. Acknowledge but postpone these complexities to keep focus on the core thesis. The "not a dead end" framing is crucial to prevent dismissiveness.

  The cosmic tilt example carries the whole section - if students get why the theories are observationally indistinguishable yet incompatible, everything else follows. Need to construct it carefully: same local physics, different cosmic interpretation, zero measurement difference.
answer: |-
  Here’s a structured 50-minute plan focusing on clarity, differentiation from Duhem-Quine, and preemptive misconception management, centered on a novel example:

  **Core Goal:** Students articulate underdetermination (UD) as a **logical claim about evidence-theory gaps**, distinct from holism and skepticism.

  ---

  ### **Plan Structure** (Total: 50 min)
  **I. Framing & Distinction from Duhem-Quine** (10 min)  
  - *Hook:* "Duhem-Quine showed evidence *alone* can’t falsify a hypothesis. Today: evidence *alone* can’t uniquely *confirm* one."  
  - *Key Contrast:*  
    - **Duhem-Quine Holism:** Evidence is ambiguous *until* we choose auxiliaries (blames incompleteness of tests).  
    - **Underdetermination:** Even *all possible evidence* is compatible with rival theories (blames structure of support).  
  - *Visual:* Venn diagram showing evidence set fully contained within overlapping theory sets T1 and T2.  

  **II. The UD Thesis: Structure, Not Resignation** (15 min)  
  - *Core Logic Sequence:*  
    1. **Evidence Constrains but Doesn’t Determine:** Theories must *fit* evidence (eliminate rivals that conflict).  
    2. **But Fitting ≠ Uniqueness:** Multiple theories can fit *all possible* evidence → logical gap.  
  - *Why Order Matters:* Start with evidence-theory fit to show UD isn’t skepticism about evidence, but about its *sufficiency*.  
  - *Misconception Preemption (a):* Clarify **permanent UD** upfront: "This isn’t about lacking data *now*—it’s about no *conceivable* data breaking the tie."  

  **III. The Carrying Example: "Cosmic Tilt"** (15 min)  
  *(Inspired by Reichenbach, but novel & tangible)*  
  - *Setup:* Imagine measuring gravity’s direction. Everywhere on Earth, plumb bobs point "down" (toward Earth’s center).  
  - **Theory T1 (Standard):** Gravity is an attractive force emanating from massive bodies.  
  - **Theory T2 (Tilted Universe):** Gravity is an attractive force *plus* a perfectly uniform, undetectable "cosmic tilt" force pulling everything at 0.0001° to Earth’s axis. Local physics is identical, but the *cosmos* is subtly skewed.  
  - *Why It Works:*  
    - **Must Have:** Identical predictions for *all* observations (tilt force affects everything equally → no local measurement reveals it).  
    - **Must Lack:** Any "cheat" (e.g., invisible entities, arbitrary curves). The difference is global symmetry.  
    - **Students State Precisely:** "T1 and T2 agree on all observable motions but disagree on whether the universe has a directional bias."  
  - *Carries the Section:* Makes UD vivid, non-skeptical, and shows why "all possible evidence" is key.  

  **IV. Defusing Misconceptions** (5 min)  
  - *(b) Skepticism Collapse:* "UD says *some* theories are underdetermined, not *all* knowledge is hopeless. We accept T1 for reasons *beyond* evidence (e.g., parsimony)—but those are extra-evidential."  
  - *(c) Simplicity Dissolves?* "Simplicity is a *tie-breaker*, but it doesn’t eliminate the tie. T2 is *less simple* but *just as empirically adequate*."  

  **V. Closing Question** (3 min)  
  - "**If T1 and T2 predict all possible observations identically, why can’t we say they’re just two descriptions of the same reality?**"  
    - *Tests Understanding:* Correct answer requires seeing they *conflict* (T1 claims no cosmic tilt; T2 asserts it) → they make incompatible claims about unobservable structure.  

  **VI. Explicit Omissions** (2 min)  
  - "**We won’t resolve whether parsimony/simplicity is objectively justified or merely pragmatic.** That’s a deeper meta-philosophical debate. For now, note: UD shows why we *need* such principles, but their status is separate."  
  - *Why & Framing:* Prevents dismissal by flagging UD as a *problem* requiring tools (not an unsolvable mystery).  

  ---

  ### **Why This Works**
  1. **Order Prevents Conflation:** Isolates UD’s logical structure *before* addressing implications, separating it from Duhem-Quine’s web-of-belief image.  
  2. **Example Achieves:**  
     - *No clichés:* Original, non-skeptical, intuitively graspable asymmetry (global vs. local).  
     - *Forces Precision:* Students see exactly where theories diverge (cosmic orientation).  
  3. **Misconceptions Preempted:**  
     - (a) Addressed during evidence-set framing.  
     - (b)/(c) Neutralized when discussing extra-evidential principles.  
  4. **Closing Question:** Reveals if students grasp UD as *incompatibility* + *empirical equivalence*.  
  5. **Omissions:** Safeguards focus; parsimony’s status is a natural *next topic* (e.g., "Next week: Can simplicity save us?").

  **Example Refinement Tip:** Pre-draw plumb bobs on a globe showing identical "downward" pull. Have students articulate why no experiment (pendulums, free-fall, etc.) could detect the tilt. This cements "all possible evidence."
