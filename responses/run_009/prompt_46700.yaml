prompt: |-
  i'm on my city's commemorative review board — small city, so it's mostly statues, plaques and street names, and it's all volunteer work. we've got a case coming up next month that has us genuinely split, and i want to make sure whatever we recommend is consistent with what we've already done. here's our track record:

  1. bronze statue of a civil war general, put up in the 1920s by a heritage group, honoring him specifically for his defense of slavery. we removed it.
  2. campus building named for an early-1900s university president who's commemorated for basically building the institution — quadrupled the endowment, half the campus is his doing. turned out he held pretty vile racial views and said them out loud, but for his time and class this was unremarkable, nobody back then raised an eyebrow. we kept the name and added a plaque.
  3. street named for a 19th-century industrialist honored for donating the land our hospital sits on — except his fortune came from brutal company-town labor, and there were strikes and newspaper campaigns about it while he was alive. we renamed it.
  4. a wpa-era mural downtown depicting the city's founding, including some really ugly imagery of indigenous people. we kept it up with an interpretive panel, on the reasoning that the mural is a historical display, not an honor.
  5. a park named after a still-living donor after a story broke about decades of workplace abuse at his company. we renamed it fast.

  ok, the new case. there's a statue of an early 20th-century doctor on the courthouse lawn, honored for pioneering the serum that ended a regional epidemic and still saves lives here. newly digitized archives show the key trials were run on children from the local orphanage with no consent from anyone — and this was before research ethics as a thing even existed, so nobody at the time objected or even thought to. the breakthrough and the wrong are literally the same events; you can't carve them apart the way you maybe can with a founder whose personal views were bad but whose accomplishment was its own thing. there are still descendants of the orphanage kids in town, though no petition or anything yet.

  so: what should we recommend if we want to be consistent with ourselves? i can see at least two different rules that fit everything we've done so far — something like "it matters whether the thing being honored is itself the product of the wrongdoing" (that would explain 2 vs 3) versus something like "it matters whether the wrong was contested at the time, with era-typical stuff getting a pass" (that would also explain 2 vs 3, differently) — plus some rider for living honorees to explain 5, and the honor-vs-historical-display thing from 4. walk me through which rules actually fit our record, what each one predicts here, which of our five decisions is the closest precedent, and what we'd be implicitly committing to whichever way we go. also, if you wanted to design one more hypothetical case that would split the plausible rules cleanly, what would it look like?
reasoning: |-
  Okay, the user is on a commemorative review board for their small city and needs help with a tricky case about a statue of a doctor. They've provided five past decisions and want to be consistent. Let me start by understanding each case.

  First, they removed a statue of a Civil War general honored for defending slavery. That makes sense because the honor was directly tied to the wrongdoing. 

  Second, they kept a building named after a university president with racist views but added a plaque. His accomplishments were separate from his personal views, which were typical for his time. 

  Third, they renamed a street named for an industrialist whose donation came from exploiting workers. The honor (the street name) was directly linked to the tainted donation. 

  Fourth, they kept a problematic mural but added context, treating it as a historical artifact, not an honor. 

  Fifth, they renamed a park for a living donor due to workplace abuse. Since he's alive, current standards apply. 

  Now the new case: a statue honoring a doctor for developing a serum that saved lives, but the trials involved non-consenting orphans. The key issue is that the achievement and the wrongdoing are inseparable. 

  To find consistency, I should look for patterns. Cases 1 and 3 involved removal because the honor was directly tied to the wrong. Case 2 kept the name because the wrongdoing (personal views) was separate from the accomplishment. Case 4 is different as it's a historical display, not an honor. Case 5 is about a living person. 

  The doctor's case is tricky because the serum's success came from unethical trials. If they follow the separability rule (like case 2), they might keep it with a plaque. But if they focus on the honor being the product of wrongdoing (like cases 1 and 3), removal makes sense. 

  The user might also be concerned about community impact, especially with descendants of the orphans. They need a rule that's defensible and consistent. The closest precedent is case 3—renaming the street because the donation was tainted. Similarly, the doctor's achievement is tainted by the unethical trials. 

  A hypothetical to test the rules: a statue of a suffragist who used racist tactics. If the honor is for suffrage, but the methods were wrong, separability might save it. If the honor includes the methods, it might be removed. That could split the two rules clearly.
answer: |-
  Based on your track record and the need for consistency, here's how your principles align, how they apply to the doctor's statue, and a clarifying hypothetical:

  ### Core Principles from Your Precedents
  1.  **Separability of Honor from Wrongdoing:** If the *reason for commemoration* is distinct from the documented wrong (e.g., building a university vs. holding racist views), contextualization (plaque) suffices. If the honor *is* the wrongdoing (defending slavery) or *directly stems* from it (donation from exploited labor), removal/renaming occurs. (Explains 1 vs. 2 vs. 3).
  2.  **Contemporary Contestation:** Wrongs *known and protested* in their time are treated more severely than attitudes or practices considered "normal" then, even if abhorrent now. (Explains 2 vs. 3).
  3.  **Living vs. Deceased:** Living honorees are held to current societal standards; historical figures are judged with greater contextual nuance (Explains 5).
  4.  **Honor vs. Historical Display:** Commemorative honors (statues, names) are distinct from historical artifacts (murals), which are preserved with context (Explains 4).

  ### The Doctor's Case Analysis
  *   **The Conflict:** The serum breakthrough (the reason for the honor) and the unethical trials (the wrong) are fundamentally inseparable – they *are* the same event. This violates the **Separability Principle**.
  *   **Contemporary Context:** While unethical by modern standards, the lack of consent protocols was tragically common practice then and *not* contested locally at the time. This leans towards contextualization under the **Contestation Principle**.
  *   **Honor vs. Display:** It's a statue explicitly *honoring* the achievement, not a historical artifact depicting the era's practices neutrally. This leans towards action.
  *   **Closest Precedent:** **Case #3 (Industrialist's Street)**.
      *   *Similarity:* The *specific act being honored* (donating land / discovering the serum) was *directly enabled by* the wrongdoing (exploited labor / unethical trials). The honor is inseparable from the immoral foundation.
      *   *Difference:* The industrialist's wrongs *were* contested in his time, while the doctor's method was not. However, your board deemed the *inseparability* the overriding factor in Case #3, suggesting it's the stronger precedent than the contestation nuance in Case #2.

  ### Recommendations & Implications
  1.  **Recommend Removal (Aligns with Case #1 & #3 Logic):**
      *   **Why:** The *achievement being honored* was *produced* through the unethical act. Honoring the achievement inherently honors the method, violating the separability principle. Like the industrialist's donation, the serum is the tainted fruit.
      *   **Implicit Commitment:** You prioritize the inseparability of the honor from the wrongdoing over the lack of contemporary contestation. The *nature* of the act (non-consensual human experimentation on vulnerable children) is seen as sufficiently egregious *inherently*, regardless of era norms. Future cases involving achievements built on exploitation (e.g., a lab named for a researcher using stolen indigenous knowledge) would likely face removal.
      *   **Consistency Strength:** Strongest link to Case #3. Addresses core complaint: descendants see a monument celebrating the exploitation of their ancestors.

  2.  **Recommend Contextualization w/ Plaque (Aligns with Case #2 & #4 Logic):**
      *   **Why:** The honor is for the scientific breakthrough that saved lives, not *specifically* for the unethical method. The method, while horrific now, reflected era norms and wasn't contested, fitting the contextualization precedent (Case #2). The plaque treats the statue more like a historical artifact (Case #4).
      *   **Implicit Commitment:** You prioritize the lack of contemporary contestation and the separation of the *result* (life-saving serum) from the *method* (even if inseparable in fact). You accept that honoring complex historical figures requires acknowledging both good and bad. Future cases involving morally compromised methods for arguably "greater goods" might be contextualized.
      *   **Consistency Challenge:** Weakens the logic of Case #3. Why separate the industrialist's *donation* (result) from its *source* (exploitation) but not separate the doctor's *serum* (result) from its *source* (exploitation)? The orphans' lack of consent parallels the workers' lack of fair treatment.

  ### The Closest Precedent & Recommendation
  **Case #3 (Industrialist's Street)** is the strongest precedent. You removed the honor because it was directly funded by and represented exploitative labor, despite the eventual "good" (the hospital). Similarly, the doctor's statue honors an achievement *directly produced* by the exploitation of vulnerable children. **For strict consistency, removal is the most defensible recommendation.** Adding only a plaque (like Case #2) risks appearing inconsistent by treating financial exploitation of workers as more worthy of action than medical exploitation of children.

  ### Splitting-Hypothetical Case
  **The Case:** A prominent public library named after a 19th-century philanthropist (deceased) who donated the seed collection. She is solely honored for this donation. New research reveals she acquired her wealth partly through forceful, deceptive land deals that dispossessed numerous small landowners, documented in court cases *she initiated and won* using her influence. The dispossession wasn't about slavery or race, but pure economic coercion against poorer neighbors, and was controversial locally at the time (small newspaper outcries, but no organized protests).

  *   **How it Splits the Rules:**
      *   **Separability Principle:** The *honor* is for donating the books, *not* for the land deals. The donation is a distinct act later in life, arguably separable. Suggests **Contextualization (Plaque)**.
      *   **Contestation Principle:** The wrongdoing (coercive land grabs) *was* known and locally contested during her lifetime, even if she prevailed legally. Suggests **Removal/Renaming** (like the Industrialist).
      *   **Living/Dead & Honor/Display:** Clearly a commemorative honor for a deceased person.

  *   **Purpose:** This tests whether *contestation* alone is enough for removal even if the *specific act honored* (the donation) is technically separable from the *source* of the wealth used for it, contrasting with the Doctor (inseparable act/method) and the Industrialist (honor *was* the tainted fruit itself). It forces a choice between the core principles when they point in different directions.
