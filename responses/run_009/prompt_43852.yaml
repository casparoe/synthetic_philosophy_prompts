  On aggregation, if above-threshold sufferings can outweigh each other, doesn't that reintroduce compensated trade-offs through the back door? Must anticipate her distinguishing intra-threshold aggregation from cross-threshold blocking.

  For extinction risk, does the threshold actually prevent the "painless extinction" conclusion or just obscure it? Need to test whether preventing threshold-exceeding suffering could still lexically dominate continued existence with any nonzero risk.

  Interpersonal variation poses problems for phenomenological evidence - if trauma victims give conflicting testimony about exchange rates, how can we locate an objective threshold? Her probable "vague but real" response needs probing on adjudication mechanisms.

