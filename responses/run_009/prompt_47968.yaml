  Okay, the user is a third-year PhD student in philosophy preparing for a departmental colloquium. They're presenting a paper on a local evolutionary debunking argument targeting specific moral intuitions like kin partiality and reciprocity, rather than a global one. They want a Q&A prep sheet with eight objections from their specific audience members, responses, and notes on weaknesses.

  First, I need to understand their paper's core idea. They're arguing that evolution explains certain intuitions (kin, reciprocity, punishment) as fitness-trackers, not truth-trackers, so those intuitions are undermined. But other intuitions (impartial benevolence, honesty) aren't affected. The upshot is reflective equilibrium should downweight the targeted intuitions.

  The audience includes metaethicists with different views: Cornell-style naturalists, Parfitian non-naturalists, a constructivist, a Kantian, and grad students. I should anticipate objections tailored to each group's typical arguments.

  For the Cornell-style naturalists, they'll likely argue that evolution does track moral facts if those facts are about stable cooperation. The user needs a response that highlights the contingency of evolutionary explanations versus the necessity of moral facts. But this is a soft spot because it depends on rejecting their naturalism.

  The Parfitian non-naturalists will demand proof that the dependence is specifically off-track. The user can argue that the selection pressures are fitness-based, not truth-based, but admitting they can't prove non-naturalism is false is a concession point.

  The constructivist might say the debunking aligns with their view. The user should agree but differentiate by emphasizing the epistemic force against realism. However, this risks collapsing into their framework.

  The Kantian will push on normativity in general. The user should clarify their focus is on moral beliefs, not all normative ones, but this might feel like dodging.

  Grad students might bring regress worries about reflective equilibrium. The user can note that the argument shifts the burden but admit reflective equilibrium is iterative and messy.

  The secret question is probably about the boundary between debunked and safe intuitions. The user needs to explain why impartial benevolence isn't similarly debunked. This is a major vulnerability because the distinction might seem ad hoc.

  I'll structure the prep sheet with objections ordered by damage level, responses, concessions, and the secret question. Also, include notes for the constructivist, emphasizing epistemic consequences without endorsing constructivism. Make sure responses are in casual American English as requested.
answer: |-
  Here's your Q&A prep sheet – ordered by potential damage level, with responses designed for *your* specific audience quirks. Keep it conversational, own the soft spots, and remember: surviving a colloquium is about showing you've thought hard, not proving you're 100% right.

  **Prep Sheet: Local EDA Colloquium Q&A**

  **Core Claim Recap:** My argument targets *only* intuitions tied to kin preference, direct reciprocity, and free-rider punishment. The EDA works here because we have strong, specific selection stories showing these intuitions track fitness/cooperation stability, *not* necessarily moral truth. Intuitions about impartial benevolence or honesty *as intrinsic goods* lack such detailed, fitness-centric explanations and remain epistemically viable. Upshot: Reflective equilibrium should downweight the targeted intuitions.

  ---

  **Objections & Replies (Ordered by Potential Damage):**

  1.  **The Non-Naturalist Dependence Question (Parfitian):**
      *   **Likely Phrasing:** "Look, you've shown a causal dependence on evolutionary pressures, fine. But for this to *debunk*, you need to show the dependence is specifically *off-track* from the moral facts. Mere causal dependence is epistemically inert. How do you rule out the possibility that evolution selected *for* sensitivity to the non-natural moral truth precisely in these domains? You seem to be sneaking in a naturalistic premise."
      *   **Reply (2 min):** "You're right that mere causal dependence isn't sufficient for debunking *on non-naturalism*. My argument here is *internal*: given the *specific nature* of the selection pressures we can reconstruct – pressures selecting *for behaviors that solved coordination problems and boosted inclusive fitness in small groups* – the best explanation for why we have *these specific intuitions* is purely adaptive. There's no need to posit sensitivity to non-natural properties to explain the *content* or *reliability* of *these particular intuitions*. The selection story fully explains their presence and shape without the truth-tracking hypothesis. For impartial benevolence, no such detailed, purely adaptive story exists."
      *   **Soft Spot:** My argument gains its force *against non-naturalism* specifically from the plausibility that the adaptive story *exhausts* the explanation for these intuitions' content. I can't *prove* non-natural facts played no role; I argue positing them is explanatorily superfluous *for these cases*. It's a burden-shift.
      *   **Concede?** Partly. Acknowledge: "I grant that strictly speaking, I haven't proven non-natural facts *couldn't* be involved. But I argue the adaptive story is *sufficient* and *more parsimonious* for explaining the origin and content of *these specific intuitions*, making the truth-tracking hypothesis unmotivated for them."

  2.  **The Cornellian Co-Optation (Naturalist Realist):**
      *   **Likely Phrasing:** "This is fascinating, but you've actually *proven my point*! On my view, moral facts *just are* facts about the stable equilibria of human social cooperation under plausible conditions. Evolution selected for intuitions that track *exactly those cooperative solutions* – kin altruism, reciprocity norms, punishment – because they *are* the moral facts in those contexts! Your 'debunking' just shows the mechanism of tracking. Why isn't this *vindication*, not debunking?"
      *   **Reply (2 min):** "Your view *is* a powerful counter! My response hinges on the *contingency* and *local optimality* of the evolutionary solutions. Evolution settled on kin preference *not* because it uniquely tracks some abstract cooperative truth, but because it was computationally feasible and worked in ancestral environments. We can easily imagine stable cooperative equilibria built on *different* partialities (e.g., favoring non-kin coalitions). The intuition tracks *a* path to stability, not *the* moral fact. Further, the intuition persists even when its fitness rationale vanishes (e.g., extreme kin preference in modern societies), suggesting it's 'sticky code', not ongoing truth-tracking. Your view predicts ongoing sensitivity; the stickiness suggests otherwise for *these* intuitions."
      *   **Soft Spot:** This is the hardest counter. My reply relies on emphasizing contingency and maladaptation in modern contexts. It works best if I can convince them the intuition *overgeneralizes* or *misfires* due to its evolutionary origin, undermining its claim to track *current* moral facts (even on their view).
      *   **Concede?** Strategically acknowledge strength: "Your view is the most serious challenge, and if one accepts your metaethics wholesale, my 'debunking' force is significantly weakened to just pointing out potential maladaptation or overgeneralization." Fight the *scope*: argue that even on their view, the intuition's *authority* in reflective equilibrium is reduced because its origin reveals its contingency and potential for misfire.

  3.  **The Boundary Problem / Secret Weapon Question:**
      *   **Likely Phrasing:** "Okay, you carve out 'impartial benevolence' and 'honesty as such' as safe. But *why*? How do you know a similarly detailed selection story *isn't* lurking? Isn't impartiality/generalized trust crucial for large-scale cooperation? Isn't honesty vital for reputation? Doesn't this just reflect *your* favored intuitions? What's the principled distinction beyond 'I couldn't find a paper on it yet'?"
      *   **Reply (2 min):** "This is the million-dollar question, and I admit the line isn't razor-sharp. My distinction rests on two pillars: (1) **Specificity of Mechanism:** We have *detailed models* (kin selection, reciprocal altruism, costly signaling) explaining the *precise content* of kin/recip/punish intuitions *as direct fitness-maximizers*. The link is tight and well-established. For impartial benevolence/honesty-as-such, proposed evolutionary stories (e.g., group selection, indirect reciprocity) are far more contested, less directly tied to *specific intuitive content*, and often explain *behavior* more than the *intuition's moral character*. (2) **Phenomenology:** The targeted intuitions feel 'instinctive', 'tribal', or tied to specific relationships. Impartial benevolence feels more like a *deliberative extension* or *abstract principle*. The burden is *on me* to show the strong selection story exists for a domain, not vice versa."
      *   **Soft Spot:** **THIS IS YOUR WEAKEST POINT.** It's inherently somewhat defeasible and relies on the current state of evolutionary psychology (which is messy). The distinction *can* feel motivated by desired conclusions.
      *   **Concede?** **Heavily.** "You're absolutely right that this is the most vulnerable part. The distinction is provisional and based on the *current strength and specificity* of the evolutionary accounts. If equally robust selection stories emerge for impartial benevolence, my argument would extend there. My claim is *not* that impartiality *can't* be explained evolutionarily, but that *right now*, the explanatory stories are weaker and less directly tied to the *intuitive moral force* than for kin/recip/punish. This makes downweighting the latter uniquely justified *for now*."

  4.  **The Kantian Normativity Expansion:**
      *   **Likely Phrasing:** "Interesting, but aren't you confusing motivation with justification? Even if these *motivational* inclinations have an evolutionary source, that tells us nothing about the *normative validity* of the principles themselves (e.g., 'One ought to care for kin'). Can your argument even touch that? Doesn't this just show the *psychological origin of some motives*, not debunk *moral beliefs* about obligations?"
      *   **Reply (2 min):** "I'm targeting the *epistemic grounds* for the *beliefs* justified by these intuitions in reflective equilibrium. The argument is: when we discover the intuition supporting belief B (e.g., 'Strong partiality to kin is morally required') arose because it tracked fitness, not truth, that undermines B's justification *if B is taken as a fundamental input*. It shows the intuition isn't a reliable guide to moral truth *in this domain*. I'm not claiming to debunk the *concept* of normativity or the possibility of justifying kin duties *on other grounds* (e.g., Kantian universalization applied to special relationships). I'm saying the *intuitive pull* towards strong partiality *as a basic moral datum* is suspect."
      *   **Soft Spot:** Requires strict focus on the *epistemic role of the intuition* within moral methodology, not the truth of the normative proposition independently. Can feel like dodging to a Kantian.
      *   **Concede?** Clarify scope: "I concede my argument doesn't touch the *possibility* of justifying these norms on other, non-intuition-based grounds. It solely targets the justificatory weight we should give to *these specific intuitions themselves* within intuition-driven methodologies like reflective equilibrium."

  5.  **The Constructivist Handshake (Constructivist):**
      *   **Likely Phrasing:** "This is great! But isn't your 'debunking' just describing the process? You're showing how these intuitions *were constructed* by evolutionary pressures to solve coordination problems. That's exactly what I think morality *is* – the output of rational (or in this case, evolutionary-rational) pressures under conditions of agency. So, thanks for the support?"
      *   **Reply (2 min):** "I'm glad you find it congenial! The key difference is *epistemic*. On your view, this genealogy *is* the metaethics – it tells us what moral facts *are*. My argument *presumes* (for the sake of the EDA) a *realist* framework where moral facts are independent. I argue that *if* such facts exist, the evolutionary origin of *these* intuitions undermines our epistemic access to them *via these intuitions*. So while the *descriptive history* overlaps, my *epistemic conclusion* ('these intuitions are unreliable guides to independent truth') only has bite if realism is on the table. It's a threat *to the realist*, not a direct endorsement of constructivism, though it certainly removes an intuition often used *against* constructivism."
      *   **Soft Spot:** Risk of her absorbing the argument entirely. Need to firmly separate the descriptive genealogy from the epistemic *consequence for realism*.
      *   **Concede?** Acknowledge overlap but insist on the distinct epistemic target: "You're right that the genealogical story fits neatly with your view. My point is that *even if realism is true*, this story undermines the authority of *these specific* realist inputs. Your view doesn't *need* them as truth-trackers in the first place."

  6.  **The Regress Worry (Grad Students):**
      *   **Likely Phrasing:** "If you downweight these intuitions in reflective equilibrium (RE), what do you rebalance RE *with*? Aren't your 'safe' intuitions (impartiality, honesty) also potentially suspect? How do you avoid a regress where *all* intuitions need external validation, and RE collapses? Doesn't RE *require* some bedrock intuitions?"
      *   **Reply (2 min):** "Good point, but no regress. RE is iterative and holistic. I'm not rejecting *all* intuitions or demanding external validation for *every* one. I'm providing a specific, positive reason (the strong evolutionary explanation) to be *especially skeptical* of *these particular* intuitions as fundamental inputs. We then run RE *without giving them presumptive weight*. The 'safe' intuitions aren't assumed infallible; they just lack the *specific defeater* I've applied to the others. They enter RE on a more equal footing with considered judgments and principles. The process continues dialectically. My argument shifts the burden of proof onto *these specific* intuitions within RE."
      *   **Soft Spot:** Requires confidence in RE as a method even after localized debunking. Doesn't *prove* the safe intuitions are reliable, just removes a *specific* defeater.
      *   **Concede?** Briefly: "RE is messy, and no intuition is sacred. But we have to start *somewhere*. I'm arguing we should start by being *less* trusting of *these*."

  7.  **The "Isn't This Just Global Lite?" Objection:**
      *   **Likely Phrasing:** "This feels like a distinction without a difference. If evolution shaped *any* core moral intuitions for fitness, doesn't that cast doubt on the whole faculty? How can you be sure the mechanisms generating the 'safe' intuitions are fundamentally different? Aren't you just arbitrarily stopping the debunking where it's convenient?"
      *   **Reply (2 min):** "The global argument claims evolution impugns *all* moral belief-forming faculties. My argument is *modular*. I target specific *intuitions with specific content* based on *specific evidence* of their adaptive origins. It's not about the faculty being globally unreliable, but about *particular outputs* being explained by non-truth-tracking causes. I don't need to prove the *whole faculty* is reliable; I only need to show that *for these specific outputs*, we have strong reason to doubt their reliability, while lacking such reasons (currently) for others. It's a surgical strike, not a blanket condemnation."
      *   **Soft Spot:** Relies on the modularity of intuition-generation being plausible. Links back to the Boundary Problem (#3).
      *   **Concede?** Link to #3: "As I admitted earlier, the boundary relies on the current state of evidence. But the *modular* approach is principled: we assess the genealogy of specific intuitions/content, not the faculty monolithically."

  8.  **The "What About Moral Progress?" Objection:**
      *   **Likely Phrasing:** "If these intuitions are evolutionarily 'sticky', how do you explain moral progress *away* from them? Think of expanding circles of concern beyond kin/tribe, or critiques of excessive punishment. Doesn't progress rely on deploying the *same* intuitive faculty to revise its own outputs? Doesn't that suggest the faculty *isn't* hopelessly corrupted in these domains?"
      *   **Reply (2 min):** "Progress is crucial! But it often comes precisely from *overcoming* or *rationally scrutinizing* these deeply ingrained intuitions using *other* capacities – empathy, reason, impartial principles. Think of arguments against nepotism or cruel punishments appealing to fairness or universal human dignity. This progress often leverages the *non-targeted* intuitions (like impartiality) or reasoned principles. The persistence of the 'sticky' intuitions *despite* progress (e.g., enduring nepotism, vindictiveness) actually *supports* my claim about their tenacious, non-truth-tracking origin. Progress shows our ability to *transcend* these intuitions, not that they were reliable guides."
      *   **Soft Spot:** Requires attributing progress to non-targeted capacities. Could be seen as downplaying the role of revised intuitions.
      *   **Concede?** Acknowledge complexity: "Progress is multifaceted. Sometimes it involves extending core intuitions (like empathy), sometimes rejecting others (like strong partiality). My point is that overcoming the *targeted* intuitions is often hard work precisely because they are 'sticky', and that work often relies on resources *outside* those intuitions."

  ---

  **Key Strategy Notes:**

  *   **Own the Boundary (#3):** This is the grenade. Acknowledge its vulnerability upfront. Frame it as the *best current distinction based on evidence*, open to revision. Don't dig in too hard.
  *   **Cornellians (#2) are Your Main Metaethical Foe:** Your reply needs maximum polish. Emphasize **contingency** ("It could have been otherwise") and **maladaptation/stickiness** ("It persists even when harmful now").
  *   **Parfitians (#1):** Stick to the "explanatory sufficiency" line. Don't get dragged into proving non-naturalism false. Focus on the *lack of need* for truth-tracking in the explanation.
  *   **Constructivist (#5):** Be gracious ("I'm glad it fits!") but **insist on the distinct epistemic consequence for realism.** Say: "My argument gives *you* a weapon against the realist who relies on these intuitions, but its *logical target* is the realist's justification."
  *   **Kantian (#4):** Keep bringing it back to **epistemic justification of beliefs based on intuitions**, not normativity itself.
  *   **General Tone:** Be confident in the *core insight* (strong selection story -> localized defeater) but humble about the boundaries and philosophical implications. Use phrases like "My contention is...", "The evidence suggests...", "This is where I see the argument pushing us...", "That's a fair challenge, here's how I'd respond...". Good luck! You've got a sharp argument.
