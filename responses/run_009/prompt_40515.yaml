  **What the procedure cannot settle:**
  - When the counterparty's motivation is unclear (e.g., are they forced or not?).
  - When we cannot assess the quality of our model relative to others (e.g., in a crowded strategy with many similar models).
  - When there is a mixture of informational and non-informational reasons for trading.
  - When the common prior assumption is violated in a way that is hard to verify (e.g., we have different models but we don't know which is better).

  In these cases, we must rely on judgment and experience. The checklist is a tool to avoid obvious mistakes, not a perfect oracle.

  Final Checklist Summary (for quick reference):

  1. **Counterparty Motivation:**
     - Forced (liquidity, rebalancing): Go to 4.
