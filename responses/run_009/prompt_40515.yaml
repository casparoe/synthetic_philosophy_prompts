  We are building a practical decision procedure based on the no-trade theorem and related ideas. The theorem states that if all agents are rational, share common priors, and have common knowledge of rationality, then no trade will occur because the mere offer to trade would reveal information that makes the trade undesirable to one party.

  Key assumptions of the theorem:
  1. Common priors: Everyone starts with the same prior beliefs about the world.
  2. Rationality: All agents update their beliefs using Bayes' rule and act to maximize expected utility.
  3. Common knowledge of rationality: Everyone knows that everyone else is rational, and so on ad infinitum.
  4. No transaction costs: Trading is costless.

  In real markets, these assumptions are violated. Therefore, our checklist will focus on identifying when these assumptions are violated in a way that allows for beneficial trade. The goal is to avoid trades where the only reason for the trade is that one party is irrational or mistaken (which we cannot count on) and instead focus on trades that exist due to violations of the theorem's assumptions (like forced trading, different risk tolerances, or genuinely private information).

  We will design a checklist with questions. Each question must be answered to move to the next. The outcome can be:
  - "Don't trade": The conditions of the no-trade theorem hold sufficiently that the trade is likely to be adverse.
  - "Trade but size it down": There might be an edge but with significant risk that the theorem's conditions are partially met, so trade small.
  - "Trade with normal size": The trade is justified by a clear violation of the theorem's assumptions that we can exploit.
  - "Escalate to PM": The situation is complex and requires human judgment.

  Checklist Structure:

  1. **Why is the counterparty trading?**
     - If the counterparty is forced to trade (e.g., for liquidity, rebalancing, regulatory reasons, or risk management), then they are trading for non-informational reasons. This is a valid reason to trade. 
     - If the counterparty is trading because they have information, we must be cautious. We need to assess whether we have superior information or if they might be better informed.
     - How to answer: Look for external evidence (e.g., known index rebalancing, margin calls, large fund redemptions). If forced, mark as non-informational. If not, move to next question.

  2. **What is the source of our edge?**
     - If our edge comes from genuinely private information (e.g., proprietary research that isn't public, or data we collected that others don't have), then we have an informational edge and the theorem's common prior assumption is violated in our favor.
     - If our edge is from a novel interpretation of public data, we must consider that others might have the same or better models. We need to assess the uniqueness of our model and the likelihood that the counterparty has a better model.
     - How to answer: Assess the uniqueness and sophistication of our model. If we have truly private information, we can trade. If our model is based on public data and is not unique, we must be cautious.

  3. **Could we be the one who is wrong?**
     - We must consider the possibility that our model is flawed or that the counterparty has better information. We should update our belief based on the fact that the counterparty is willing to trade. The no-trade theorem suggests that if both parties are rational and share priors, the trade shouldn't happen. Therefore, if we are trading, it must be that we have different information or one of us is irrational.
     - How to answer: If we can't rule out that the counterparty might be better informed (e.g., they are a known expert, or they are trading a large size that suggests confidence), then we should be cautious. If we have strong reasons to believe we have superior information, then proceed.

  4. **Are there transaction costs or other frictions?**
     - The theorem assumes no transaction costs. In reality, transaction costs (like bid-ask spreads, commissions, impact) can justify trades even without informational differences. Also, differences in risk aversion or investment horizons can lead to trade.
     - How to answer: If the trade is motivated by capturing a spread due to liquidity provision or by hedging needs, then it's valid.

  5. **Assessing the overall situation:**
     - After the above, we combine the answers. For example:
       - If the counterparty is forced and we are providing liquidity (non-informational), then trade (with size adjusted for risk).
       - If we have genuinely private information and the counterparty is not forced but we are confident in our edge, then trade.
       - If our edge is from a public data model and the counterparty is trading voluntarily, then we must consider that they might have a better model or more information. This is the most dangerous scenario and might lead to "don't trade" or "size it down".

  The checklist:

  **Step 1: Counterparty's Motivation**
     - If the counterparty is forced to trade (liquidity, rebalancing, etc.): Proceed to Step 4.
     - If the counterparty is trading voluntarily (presumably based on information): Proceed to Step 2.

  **Step 2: Source of Our Edge**
     - If we have genuinely private information (e.g., proprietary data collection, non-public research): Proceed to Step 3.
     - If our edge is from a model processing public data: Proceed to Step 3 with caution (this is a yellow flag).

  **Step 3: Could We Be Wrong?**
     - We must update our belief based on the counterparty's willingness to trade. Ask:
       - Is the counterparty likely to have superior information? (e.g., they are a well-known expert, they have more resources, or they are trading a large size that suggests conviction)
       - How unique is our model? (if many firms have similar models, then the edge might be competed away)
       - Have we backtested this model on out-of-sample data and controlled for overfitting?
     - If we cannot rule out that the counterparty has superior information or that our model might be flawed: This is a red flag. Consider "Don't trade" or "Trade but size it down".
     - If we are confident in our edge (e.g., the model is unique and robust, and the counterparty is not particularly sophisticated): Proceed to Step 4.

  **Step 4: Frictions and Costs**
     - Consider transaction costs and whether the trade is motivated by non-informational reasons (like risk transfer or liquidity provision). Even if there is no informational edge, these frictions can justify the trade.

  **Decision:**
     - If the counterparty is forced (Step 1) OR if we have genuinely private information (Step 2) and we are confident we aren't wrong (Step 3): Trade with normal size.
     - If the counterparty is forced but the trade has high risk (e.g., the forced selling might be due to negative private information), then trade but size it down.
     - If our edge is from public data (Step 2) and the counterparty is trading voluntarily (Step 1) and we cannot rule out that they are better informed (Step 3): Don't trade or trade very small (size it down to 10-20% of normal).
     - If the trade is motivated by capturing a spread in a high transaction cost environment (Step 4) and we are providing liquidity: Trade with normal size (but adjust for liquidity risk).

  **When to Escalate:**
     - If the situation is ambiguous (e.g., we are not sure about the counterparty's motivation, or we have mixed signals about the uniqueness of our model), then escalate to the PM.

  Now, we test the procedure on three cases:

  **Case 1: Our model says a midcap is ~2% mispriced based purely on public order-flow data we've repackaged, no genuinely private info.**
     - Step 1: Why is the counterparty trading? We don't know, but if we are taking liquidity (hitting a bid or lifting an offer), then the counterparty is the one who posted the quote. They might be a market maker or a liquidity provider. They are trading voluntarily (they posted the quote) but they are in the business of providing liquidity and might be forced to trade at their quoted prices. However, they are sophisticated and may have their own models. This is ambiguous. We proceed to Step 2.
     - Step 2: Our edge is from repackaged public order-flow data. No private info. Yellow flag.
     - Step 3: Could we be wrong? The counterparty (liquidity provider) is likely sophisticated and has their own model. They are willing to trade at this price, which might mean they have a different view or they are covering their costs with the spread. We must update: the fact that they are offering to trade at this price should make us question our edge. Without a clear reason why our model is better and unique, we should be cautious. Red flag.
     - Step 4: There are transaction costs (the spread we are crossing). The trade is for informational reasons (we think the price is wrong) but the counterparty is also trading for non-informational reasons (they are making the spread). However, if they are adjusting their quotes based on information, then it's informational.
     - Decision: This is a typical scenario where the no-trade theorem warns us. The counterparty is sophisticated and trading voluntarily (they chose to post the quote) and we have no private info. We should not trade OR trade with a very small size (10-20% of normal). This might be the answer you don't like: even though the expected value looks positive, the theorem suggests that the trade should not occur between rational parties with common priors. We must consider that our model might be overfitted or that the counterparty has a better model.

  **Case 2: A crypto fund is dumping a big position fast and we could provide liquidity at a fat spread, clearly non-informational forced selling.**
     - Step 1: The counterparty is forced to sell (liquidation or redemption). Non-informational. Proceed to Step 4.
     - Step 4: We are providing liquidity and capturing a spread. The trade is motivated by non-informational reasons (the fund's forced selling) and we are compensated by the spread. There might be transaction costs (slippage) but the fat spread is meant to cover that.
     - Decision: Trade with normal size (but adjust for the risk of further price moves against us). Note: We must still be cautious that the forced selling isn't due to negative private information. But the problem states it's "clearly non-informational forced selling". So we trade.

  **Case 3: A coworker wants to bet me $500 on an election outcome and I'm pretty sure I've read more polling analysis than him.**
     - Step 1: Why is the counterparty trading? The coworker is trading voluntarily. They must believe they have an edge or they are irrational. Proceed to Step 2.
     - Step 2: Our edge is from having read more polling analysis. But this is public information. We don't have private information. Yellow flag.
     - Step 3: Could we be wrong? The coworker might have different analysis or information. They are a colleague (presumably intelligent) and they are willing to bet. We must update: their willingness to bet suggests they have a different view. Without knowing their reasoning, we cannot be sure. However, the bet is small and we have done more research. But note: the no-trade theorem applies here because we are both rational and share priors? Actually, we might have different priors or different interpretations. In practice, this is a small bet and we are confident. But the theorem would say: if we share common priors and update with all public information, we should agree. So the fact that we are betting means one of us is irrational or we have different priors. Since the amount is small, it might be due to entertainment value (non-informational). 
     - Step 4: There is no transaction cost but the bet is small. The non-informational reason might be that the coworker enjoys betting.
     - Decision: This is a judgment call. The theorem suggests we shouldn't bet because we share public information. But in reality, people have different models and might overestimate their knowledge. However, since we are confident and the amount is small, we might trade. But note: the coworker might have inside information? Unlikely for an election. We could escalate to PM? But it's $500. Alternatively, we might do a small trade. However, the procedure would flag that this trade is in the danger zone. Given the small size, we might allow it, but the procedure would say: without a clear non-informational reason (like entertainment) and without private information, we shouldn't trade. But the problem says we are pretty sure we have more information. This is an example of overconfidence? The procedure might say "don't trade" because we are both rational and should agree? But in practice, we might trade. However, to be consistent with the theorem, we should avoid. But note: the theorem assumes common priors and common knowledge of rationality. Here, we might have different priors (e.g., we weight polls differently). So the violation of common priors allows trade. But the checklist would have a hard time. We might design Step 3 to ask: "Do we have reason to believe that the counterparty has a different prior or is irrational?" In this case, we might think the coworker is less informed or overconfident. Then we trade. But the procedure should be cautious. We'll say: if the counterparty is trading voluntarily and we don't have private information, and we cannot rule out that they have superior information (or a different model that might be better) then don't trade. However, in this case, we are confident that we are better informed. We might trade but note: the theorem says that if we are both rational and share priors, we should not trade. Since we are not sharing the same model (we have different interpretations), we are violating the common prior assumption? So we t