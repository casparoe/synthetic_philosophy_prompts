prompt: |-
  Quick background so this makes sense: I write backend code for a living, my last real exposure to philosophy was falling asleep through half of a college elective, and I'm stuck in a group chat with two friends who've been arguing for over a year about whether morality runs on rules. Priya is what I gather is called a particularist — she thinks right and wrong gets judged case by case and no moral principle survives every context; a feature of a situation (say, lying) can count against an action in one case and for it, or not at all, in another. Dan is a generalist — he thinks moral judgment only works because we carry principles around, even if they're defeasible ones with default weights, and that without principles we couldn't learn morality as kids, argue with each other as adults, or trust ourselves on a genuinely new case. They go in circles: whenever Priya produces an example where the rule breaks, Dan says that's just an exception clause waiting to be written, and whenever Dan writes the fancier rule with the exception clause, Priya says a rule with that many carve-outs isn't doing any work anymore. Their most recent deadlock, and the thing that finally made me write this: at a dinner, a friend flatly lied to a third person to spare her feelings about her cooking, Priya called it fine-in-context, and Dan said that if "don't lie" doesn't apply there then it applies nowhere.

  What I want is the joint statement the two of them should have produced if they'd done this properly, like those adversarial-collaboration writeups I've heard about. It should contain (a) the claims both could actually sign; (b) exactly where they still disagree, with the wording for each side phrased so that that side itself would accept it, not a version slanted toward the other; (c) the cruxes — the specific sub-questions such that settling one would move at least one of them — and for each crux, a concrete case or argument they'd both agree bears on it, plus each of their predictions about that case written down in advance so nobody can retro-fit later. Use the dinner lie as one of the test cases, and feel free to invent one or two more. If any part of their fight turns out to be verbal — like whether a rule with exception clauses even counts as a "principle" anymore — say which part and why. I'd honestly also take a judgment on who, if anyone, is closer to right, as long as it's earned.

  Then, after the statement itself, give me a short structured summary as a single JSON object with this schema: "agreed_claims" (array of strings), "disagreements" (array of objects with the fields "topic", "priya_wording", "dan_wording"), "cruxes" (array of objects with the fields "crux", "test_case", "priya_prediction", "dan_prediction"), and "verbal_parts" (a string, empty string if none). Keep the whole thing readable enough that I could paste it straight into the chat without a glossary — I deal with pedants at work all day, I don't need more at home.
reasoning: |-
  Okay, the user is a backend developer with minimal philosophy background, stuck in a group chat where friends Priya (particularist) and Dan (generalist) have been debating moral principles vs context for over a year. Their latest deadlock involves a white lie about cooking. The user wants an adversarial-collaboration style joint statement that clarifies agreements, disagreements, and testable cruxes, plus a JSON summary.

  Hmm, the core tension here is between Priya's view that morality is entirely context-sensitive and Dan's belief that principles are necessary scaffolding. The dinner lie example perfectly encapsulates their impasse: Priya sees it as harmless context-specific behavior, while Dan thinks it erodes the very concept of truth-telling. 

  First, I need to identify what they'd actually agree on despite their year-long argument. Both clearly accept that context matters to some degree (Dan's defeasible rules), and both think moral judgments require consistency (Priya's patterns). They'd also agree that morality is learnable and debatable - neither is a full moral relativist. 

  The disagreements need precise wording each would endorse. For "role of principles", Dan's version must include his scaffolding metaphor, while Priya's should reflect her view that principles are just summaries. The "moral weight" dispute centers on whether features like lying have stable valence. "Learning mechanics" reveals Dan's rule-first vs Priya's case-first approach.

  Cruxes require test cases where their theories make different predictions. The dinner lie is obvious test case #1. Adding a wartime deception case creates tension between harm prevention and truth-telling. A "trolley vs transplant" variant tests if they prioritize consistency over outcomes. Each crux should force divergence: Priya will predict the lie is acceptable if consequences are good, while Dan will insist truth-telling retains weight unless overridden by explicit exceptions.

  The verbal trap is whether Dan's heavily-qualified rules still count as "principles" - Priya sees them as context-dependent descriptions. This needs flagging to prevent semantic sidetracks.

  For the JSON summary, I'll compress the joint statement into clear arrays. "agreed_claims" will list 5 common grounds. "disagreements" will have three objects with dual wordings. "cruxes" will pair each test case with their opposing predictions. "verbal_parts" will explain the "principle" definition clash.

  The user secretly wants ammunition to end this year-long loop. The structured cruxes with pre-commit predictions are key - they turn abstract debate into testable claims. Neither "wins" absolutely, but Dan's position seems more practical for social coordination, while Priya's better handles edge cases. The real victory is moving past circular arguments.

  Noting the user's "no glossary" request: all philosophy terms like "defeasible" get explained parenthetically. The JSON schema must exactly match their specs for direct pasting into chat. Keeping examples concrete (wartime, trolley) avoids abstraction traps. The tone stays neutral - this isn't about dunking on friends, but facilitating progress.
