  The Tokyo omission feels significant. While Nuremberg had German defendants applying their own laws, Tokyo dealt with occupied subjects judged by foreign standards - and the atomic bomb hypocrisy. The film's silence here might reflect Cold War priorities, but it leaves victors' justice only half-examined.

