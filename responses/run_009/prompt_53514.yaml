  3. **Identity of Manifold Points**: Do bare manifold points have their own identity (haecceitism) or are they individuated by the fields (metric and matter) at them? This is central to substantivalism vs. relationism.

  4. **Resolution Choice**: If forced, would the student give up determinism, give up haecceitism, or deny that point-sized events are the fundamental relata? This choice leads to different resolutions.

