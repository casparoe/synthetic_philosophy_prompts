  # Decision Tree: Spacetime Ontology and the Hole Argument

  ## Starting Point
  You accept that general relativity is deterministic (the initial-value formulation is well-posed) and you have an intuition that the points of the spacetime manifold are "genuinely there" (haecceitism). The hole argument presents a tension: if points have primitive identity, then an active diffeomorphism that rearranges fields inside a hole (while leaving the outside unchanged) seems to produce a different physical situation from the same initial conditions, threatening determinism. How do you resolve this?

  ## The Tree

  1. **Q1: Do two models of general relativity related by an active diffeomorphism (that acts non-trivially only in a hole) represent the same physical history?**
     - **Yes** (they are physically equivalent) → Go to Q2.
     - **No** (they represent distinct physical possibilities) → Go to Q3.

