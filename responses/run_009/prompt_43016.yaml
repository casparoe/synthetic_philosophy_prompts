answer: |-
  Here’s a defense of the asymmetric resolution to the lottery and preface paradoxes, grounded in a principled distinction between types of probabilistic support and evidence defeaters. The core idea is that **justification depends not only on probability but on the *source* of residual risk**, and whether that risk generates a *defeater* for belief.

  ### The Asymmetric Resolution Recap:
  - **Lottery cases**: Deny justification for believing *any individual ticket will lose*, despite each having high probability.  
  - **Preface cases**: Grant justification for believing *each substantive claim* and also for the preface belief ("at least one claim is false"), rejecting closure under conjunction.  

  ---

  ### (a) Principled Criterion for Distinguishing Cases  
  The dividing line turns on **whether the residual risk of error is *internal* or *external* to the evidence supporting the proposition**:  
  - **Internal risk (lottery-type)**:  
    Residual risk arises *solely from bare statistics about a reference class* (e.g., "1/n probability of winning"). There is **no first-order evidence** addressing whether *this particular ticket* will win or lose. The risk is "built into" the proposition’s justification, acting as an **undercutting defeater**.  
    → *Result*: High probability alone cannot justify belief; the statistical nature of the evidence precludes knowledge-grade certainty.  
  - **External risk (preface-type)**:  
    Residual risk stems from *meta-level considerations about the collective* (e.g., "human fallibility in long projects"), **not** from the first-order evidence for *any individual claim*. Each claim is supported by its own *substantive, non-statistical evidence* (e.g., archival research, experiments), which remains undefeated. The risk attaches only to the *aggregate* (the conjunction).  
    → *Result*: Justification for individual claims holds, but the preface belief provides a **rebutting defeater for the conjunction**.  

  **Why this is principled**:  
  This aligns with core epistemological tenets:  
  1. **Defeasibility theory**: Justification requires the absence of undefeated defeaters. Internal risk (lottery) generates a defeater for each proposition; external risk (preface) does not.  
  2. **Evidential specificity**: Beliefs must be grounded in evidence directly relevant to their content. Lottery beliefs lack this; preface claims have it.  

  ---

  ### (b) Confronting the "Ad Hoc" Objection  
  **Objection**: *Preface beliefs rely on statistics about author fallibility—so why isn’t this "bare statistics" like the lottery?*  

  **Reply**: The statistical nature of the preface belief **does not infect the justification for individual claims** because:  
  1. **Different epistemic levels**:  
     - The statistics about fallibility target the *collection* of beliefs ("books by humans contain errors"), not any *specific claim*.  
     - Each individual claim is justified by *local evidence* (e.g., "based on dataset X, theory Y is correct"). The statistical risk is global, not local.  
  2. **No undercutting for individuals**:  
     - The fallibility statistic does not undermine the *reliability of the evidence* for Claim 1, Claim 2, etc. It merely notes that *among many claims, some are likely wrong*.  
     - Contrast with the lottery: The statistic *directly constitutes the only evidence* for "this ticket will lose," making it inherently fragile.  
  3. **Analogy to testimony**:  
     - Knowing that eyewitnesses are fallible doesn’t defeat justification for each eyewitness report *if each is independently verified*. Similarly, an author’s fallibility doesn’t defeat each claim if each has independent support.  

  **In short**: The preface’s statistical risk operates at a *higher-order level*, leaving first-order justification intact. The lottery’s statistical risk *is* the first-order evidence.  

  ---

  ### (c) Aggregate-Level Beliefs  
  - **Lottery player**:  
    - **Can believe**: "Some ticket will win" (deductively certain given the rules).  
    - **Cannot believe**: "Ticket #1 will lose," "Ticket #2 will lose," etc. (individual defeaters apply).  
    → *No closure failure*: Conjoining beliefs isn’t at issue since no individual belief is justified.  
  - **Author**:  
    - **Can believe**: Each substantive claim (e.g., "Claim 1," "Claim 2," ... "Claim N").  
    - **Can believe**: "At least one claim is false" (preface belief).  
    - **Cannot believe**: The conjunction of all claims (defeated by the preface belief).  
    → *Closure fails* for the conjunction, but this is acceptable because the defeater applies only at the aggregate level.  

  ---

  ### Boundary Cases: Applying the Criterion  
  1. **Author with known 1-in-5 error rate**:  
     - **Verdict**: *Preface-type*.  
     - **Why**: Each claim still rests on first-order evidence (e.g., research). The 20% error rate is a meta-statistic about her *books as wholes*, not a direct defeater for any claim. She remains justified in each belief but must believe her book contains an error.  

  2. **Three-ticket lottery**:  
     - **Verdict**: *Lottery-type*.  
     - **Why**: Despite high individual probability (≈66.7% per ticket losing), the risk remains purely statistical and internal. There is no evidence addressing *which* ticket might win—just the uniform probability distribution. Justification for individual "this ticket loses" beliefs is still denied.  

  3. **Monograph with purely statistical preface**:  
     - **Setup**: Author has *no first-order doubt* about any claim but asserts the preface solely based on "humans are fallible" statistics.  
     - **Verdict**: *Shifts to lottery-type*.  
     - **Why**: If *no claim* has residual risk grounded in its own evidence, and the only support for each is "this is very likely true because humans are usually right," then the justification mirrors a lottery. The statistical preface becomes an internal defeater for each claim, invalidating individual justification.  

  ---

  ### Why This Isn’t a Patch: A Unified Epistemology  
  This asymmetry flows from a **general theory of defeaters and evidential grounding**:  
  - **Probability isn’t monolithic**: High probability justifies belief only if it arises from *evidence specific to the proposition*, not generic statistics.  
  - **Defeaters respect evidence hierarchies**: Meta-risks (preface) don’t cascade to undermine local evidence; internal risks (lottery) do.  
  - **Closure is context-sensitive**: It fails only when a defeater targets the aggregate *without* targeting the parts—a natural consequence of how defeaters operate.  

  This resolves the paradoxes without special pleading: the lottery shows statistics alone can’t justify belief; the preface shows that locally justified beliefs can be globally fallible. The criterion draws a line any epistemology must draw—between *grounds for belief* and *acknowledged limits of cognition*.
