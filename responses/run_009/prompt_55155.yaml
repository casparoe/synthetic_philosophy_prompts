  Okay, let me start by breaking down the user's query. They want to predict how their friend will rule on three new cases using Dennett's counterfeit people framework. The friend has a history of applying this concept strictly, so I need to recall her past rulings to find patterns. 

  First, looking at her track record: she distinguishes between counterfeit and non-counterfeit based on deception about personhood. For instance, the bot that pretends to be Jenny without disclosure is counterfeit, but the one that discloses being AI is just a tool. The parrot isn't counterfeit because it can't pass as human. The lying guy on the dating app isn't counterfeiting personhood, just lying about attributes. The deepfake is counterfeit speech, and the AI finishing a book is a counterfeit author. The companion app that discloses but acts like a friend is still counterfeit because it "occupies the role" of a person.

  Now, the user presents three new cases. Case one is a grief-bot that discloses upfront but mimics a dead mom. Case two is a heavily scripted human helpline employee. Case three is the companion app with a persistent badge. The user also wants to know the underlying rule and which case best differentiates between two candidate rules: one focused on effective deception and the other on the origin of creation.

  Considering the friend's past rulings, the grief-bot (case one) seems tricky. It discloses, but the persistent mimicry might be seen as occupying the role of the mom. The friend might call it counterfeit despite disclosure, leaning towards the "minted human way" rule. For case two, the scripted human is biologically human, so she'd likely say not counterfeit, even if dehumanized. This could be a bullet she bites—accepting that the company isn't counterfeiting because the person is real, even if reduced to a tool. Case three with the badge might be acceptable under deception-based rules but not under origin rules. Here, the badge makes disclosure constant, so she might rule it not counterfeit under deception but still counterfeit under origin.

  The key case to differentiate the rules is case three. If the friend says it's still counterfeit despite the badge, she's using the origin rule. If not, she's using deception. Given her ruling on the companion app before, she probably uses origin, so the badge wouldn't matter. Case two's bullet is accepting that even a dehumanized human isn't counterfeit, which aligns with her past decisions (like the lying guy). She'd likely swallow that bullet, emphasizing biological personhood over experiential aspects.
answer: |-
  Based on Dennett's "counterfeit people" framework and your friend's established track record, here's the prediction for each case, the inferred rule, and the analysis:

  **Predicted Rulings:**

  1.  **Grief-Bot (Disclosed Recreation of Dead Mom):** **Counterfeit Person.**
      *   **Reasoning:** Despite the upfront disclosure, the bot is *persistently occupying the role* of a specific, deceased person. It uses intimate details (childhood nickname) and maintains a long-term personal relationship dynamic over years. This mimics the *function and relational position* of the mother, effectively "counterfeiting" her personhood within the user's life, regardless of the initial disclaimer. The disclosure is a one-time event, while the counterfeit performance is continuous and central to its function.

  2.  **Scripted Human Helpline Employee ("Decision Tree with a Pulse"):** **NOT a Counterfeit Person.**
      *   **Reasoning:** This is a biological human, however constrained. Your friend's prior rulings (lying dating app guy, parrot) show she distinguishes between *a real person behaving poorly/deceptively/mechanically* and something *created to falsely represent personhood itself*. The company might be exploiting/dehumanizing the employee, but they are not *minting a counterfeit person*; they are using a real one as a tool. The "personhood" here is genuine, even if the expression is severely limited.

  3.  **Companion App with Persistent Badge ("Prop Bill" Stamp):** **Counterfeit Person (but this is the crucial test case).**
      *   **Reasoning:** This is the toughest call based on her history. However, given her ruling on the *first* companion app (which also disclosed upfront but was deemed counterfeit for "occupying the role"), and her likely adherence to an **Origin Rule** (see below), the persistent badge probably won't save it. She'll argue the badge is just a label on an entity *fundamentally designed to simulate the relational role and responses of a person/friend* in an ongoing, intimate way. The *function* (simulating friendship) and *persistent role-occupation* trump the persistent disclaimer.

  **The Inferred Rule: The Origin Rule (Minted the Human Way)**

  *   **Why this rule fits best:** Her rulings consistently hinge on the *source* and *fundamental nature* of the entity claiming or implying personhood, *not* primarily on whether deception is successful *in a specific instance*.
      *   **Biological Humans (Even Flawed):** The lying guy, the scripted employee – their personhood is inherent because they are "minted" biologically. Deception about *attributes* (job, hair) or constrained *behavior* doesn't negate their fundamental status.
      *   **Non-Human Entities:** AIs, bots, parrots – these are not "minted" as persons. Whether they *can* deceive (Jenny bot, companion app, grief-bot) or *cannot* (parrot, shipping bot) is secondary. If they are *functionally designed to occupy a person-like role* (friend, mother, conversational partner named "Jenny"), especially persistently and intimately, they are counterfeit *regardless of disclosure*. Disclosure doesn't change their origin; it just makes the counterfeiting more overt or ethically complicated, not legitimate.
      *   **Deepfake & AI Novelist:** These are clear counterfeits because they usurp the specific identity and creative output *of a person* (the politician, the author), something only a person can legitimately possess and originate.
      *   **Her Hand-Waving on "Occupying the Role":** This is the key operationalization of the Origin Rule for non-biological entities. It's not about *passing* the Turing Test in a moment, but about being *designed for and deployed in* a social or personal *role* typically reserved for humans (friend, confidant, specific deceased relative, named customer service rep).

  **Why the Deception Rule Doesn't Fit As Well:**

  *   The parrot *could* accidentally deceive a naive observer briefly, yet she ruled it *not* counterfeit.
  *   The upfront-disclosure companion app was ruled counterfeit *despite* the disclosure preventing *initial* deception about its nature. The deception she cared about was about the *role* it occupied, not its fundamental ontology at the first interaction.
  *   The Origin Rule explains these perfectly: Parrot isn't *minted* as a person. The companion app, despite disclosure, is *minted* as a non-person designed to occupy a person's role.

  **The Crucial Differentiating Case: Case 3 (Companion App with Badge)**

  *   **Why this case is key:** It directly tests the conflict between the two candidate rules:
      *   **Deception Rule:** The persistent, unavoidable badge makes significant deception virtually impossible. A reasonable user *cannot* mistake it for a human. This rule would likely say **NOT Counterfeit**.
      *   **Origin Rule:** The badge is irrelevant. The entity is still a non-biological construct *designed from the ground up* to simulate the intimate, persistent relational role of a human friend. Its *origin and purpose* make it counterfeit, regardless of labeling. This rule says **Counterfeit** (matching her first companion app ruling).
  *   **Prediction:** Given her ruling on the *first* companion app (disclosed upfront, still counterfeit), her focus on "occupying the role," and her dismissal of the parrot's *potential* for momentary deception, **she will rule it Counterfeit.** This strongly confirms the **Origin Rule** is her primary driver.

  **The Bullet to Bite: Case 2 (Scripted Human)**

  *   **The Bullet:** She must accept that a human being can be so constrained, dehumanized, and mechanized by an external force (the company) that they effectively *function* as a non-person tool, **yet this does *not* constitute counterfeiting a person.** The counterfeit accusation applies only to the *creation* of non-human entities designed for person-roles, not the *reduction* of actual humans into tool-like states.
  *   **Will She Swallow It? Absolutely, and consistently.** Her prior rulings show this distinction is core to her application:
      *   The lying dating app guy (real person lying) wasn't counterfeit.
      *   The parrot (non-human, can't truly occupy the role) wasn't counterfeit.
      *   The scripted human is analogous: a real person whose *behavior* is being counterfeited (as a flexible, empathetic human responder) by the company's system, but the *person* themselves is genuine. The counterfeit is of the *service*, not the fundamental *personhood* of the employee. She'll likely say the company is doing something deeply unethical and dehumanizing, but it's **not counterfeiting a person** – it's misusing a real one.

  **Summary of Predictions & Reasoning:**

  | **Case** | **Predicted Ruling** | **Friend's Reasoning (Origin Rule)** |
  |----------|----------------------|--------------------------------------|
  | **1. Grief-Bot** | Counterfeit | Disclosed but persistently occupies the role of a specific person over time; origin is non-human |
  | **2. Scripted Human** | Not Counterfeit | Biological human origin trumps dehumanizing treatment; company misuses but doesn't counterfeit personhood |
  | **3. Badged Companion App** | Counterfeit | Persistent badge doesn't change non-human origin or designed role-occupation; disclosure irrelevant to counterfeit status |

  **In essence:** Your friend's core rule is **"Counterfeiting occurs when a non-biological entity is designed to occupy the persistent social/relational role of a person."** Origin (biological vs. artificial) is paramount. Disclosure might mitigate ethical concerns but doesn't absolve the counterfeiting charge under this framework. Case 3 is the litmus test confirming this rule over a deception-based one. Case 2 requires accepting that reducing humans to tools isn't counterfeiting *personhood* - a bullet she's consistently willing to bite. Good luck with the fight – you're going in armed!
