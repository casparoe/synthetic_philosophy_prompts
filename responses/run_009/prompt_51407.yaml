prompt: |-
  I'm a postdoc in cognitive ethology, and I need to write a coding manual that our team of eight undergraduate observers will use to annotate hundreds of hours of animal-behavior video each semester — scrub jays re-caching food when watched, apes gesturing at keepers, a corvid pulling a string, a dog alternating its gaze between a locked door and its owner. Right now our coders are all over the place: some annotate "the jay knows the rival saw where it hid the seed," others annotate the same clip as "re-caching response to visual stimulus," and our inter-rater reliability is bad enough that reviewers have started asking hard questions. The theoretical tension I want the manual to resolve is this: I was trained on Davidson's radical interpretation and his principle of charity, which says that attributing beliefs to a subject is only intelligible against a background of mostly-true beliefs and mostly-rational connections among them — but Davidson himself drew the conclusion that creatures without language can't properly be said to have beliefs at all, and my more behaviorist-leaning colleagues would prefer we never annotate mental states at all. I don't want to settle that war; I want a procedure that lets observers make the call clip by clip, in under two minutes, without needing to have read a word of philosophy.

  Please turn the machinery of radical interpretation — charity, the rationality constraint, the idea that interpretation proceeds by asking what a creature with mostly true beliefs would do in this situation, and the requirement that interpretation be anchored to a shared world of observable causes — into a step-by-step coding procedure my observers can actually follow. It should say what questions to ask about a clip in what order, what counts as passing each question, and where the procedure stops with "code as stimulus-response, not as a belief attribution" — while being honest about which steps are disguised judgment calls rather than real tests. Then run it on three worked examples: a scrub jay that re-caches food only when it was observed caching it, a dog that fetches its leash and gazes at its owner after hearing the word "walk" in an ordinary sentence, and a language-trained ape that signs "food" in what its trainers describe as a request. Please include at least one case where the procedure yields an answer I won't like — I confess I'd be sad if the ape case failed, since the trainers have built their careers on those reports — and explain what the procedure fundamentally cannot decide, so we know which clips have to be escalated to the senior researchers rather than resolved by the manual.
reasoning: |-
  We are going to design a step-by-step coding procedure based on the principles of radical interpretation, especially the principle of charity and the rationality constraint. The goal is to have observers decide, for each clip, whether the behavior can be coded as a belief attribution (implying mental states) or should be coded as a stimulus-response. The procedure must be practical and quick.

  Key principles from Davidson we are incorporating:
  1. Principle of Charity: We attribute beliefs to a subject only against a background of mostly true beliefs and mostly rational connections among them.
  2. Rationality Constraint: The subject's behavior must be interpretable as rational given the beliefs and desires we attribute.
  3. Anchoring to Observable Causes: Belief attributions must be grounded in the shared world of observable causes.

  However, note Davidson's conclusion that without language, belief attributions are not appropriate. Our procedure will not require that the subject has language, but will use the above principles to set a high bar for belief attribution.

  The procedure will consist of a series of questions. If at any step the answer is "no", we default to stimulus-response coding. Only if all steps are passed can we code as a belief attribution.

  **Step-by-Step Coding Procedure:**

  **Step 1: Identify Observable Cause and Effect**
     - **Question:** What observable stimulus (S) immediately preceded the behavior, and what observable effect (E) did the behavior produce?
     - **Required:** Both S and E must be clearly observable in the video clip (e.g., a rival jay present -> re-caching; word "walk" -> fetching leash; presence of trainer -> signing "food").
     - **Pass:** The observer can clearly identify S and E without needing to attribute any internal state.
     - **Fail:** If S or E is ambiguous or not observable, the clip is too ambiguous and should be escalated to a senior researcher.

  **Step 2: Check for Flexibility and Context-Sensitivity**
     - **Question:** Does the behavior change in a way that is sensitive to the context, beyond a simple one-to-one S->R mapping? (i.e., is the same stimulus producing different responses in different contexts, or the same response being produced by different stimuli in a way that suggests an underlying goal?)
     - **Pass:** The behavior is not rigid; it is adjusted to the specific context in a way that cannot be explained by a fixed set of rules (like if the dog only fetches the leash when it hears "walk" and also when the owner puts on shoes, but not when the TV says "walk", then it's sensitive to context). OR the behavior is absent in a context that would disrupt the goal (e.g., the scrub jay does not re-cache when alone).
     - **Fail:** The behavior is always the same for the same stimulus, regardless of context (like a reflex). Then code as stimulus-response.

  **Step 3: Check for Rational Connection to a Plausible Goal**
     - **Question:** Assuming the subject has a goal (which we infer from the effect E, e.g., avoiding theft, getting fed, going for a walk), is the behavior a rational means to that goal given the situation?
     - **Pass:** The behavior makes sense as a way to achieve the goal in the specific context. For example, re-caching when observed by a rival is rational if the goal is to avoid theft. But note: we are not attributing the goal yet, we are just checking if the behavior is rational for a hypothetical goal that we can observe (e.g., the effect: the food is now in a new location, which could prevent theft).
     - **Fail:** The behavior does not seem to serve any obvious goal, or it is counterproductive. Then code as stimulus-response.

  **Step 4: Check for Consistency with Mostly True Beliefs**
     - **Question:** If we attribute a belief (e.g., the rival saw the cache, the leash leads to a walk, the trainer will provide food), is this belief consistent with what we (the observers) know about the world? And are there other aspects of the behavior that suggest the subject has mostly true beliefs about the situation? (Note: We are not requiring complex language, but the belief must be grounded in observable reality.)
     - **Pass:** The belief we would have to attribute is one that is true (or at least, not obviously false) and the subject's behavior does not show evidence of grossly irrational or false beliefs in this clip. For example, the scrub jay re-caching only when observed is consistent with the true belief that the rival saw the cache. The dog fetching the leash when hearing "walk" in a relevant context (and not when it's irrelevant) is consistent with a true belief about the word meaning.
     - **Fail:** The belief we would attribute is clearly false (e.g., the subject acts as if it believes something that the video shows is not true) OR the behavior is inconsistent with the subject having a true belief about the situation. Then code as stimulus-response.

  **Step 5: Check for Alternative Stimulus-Response Explanations**
     - **Question:** Can the behavior be explained by a simpler, non-mentalistic mechanism? (e.g., classical conditioning, operant conditioning, innate releasing mechanism, etc.)
     - **Pass:** There is no obvious simple conditioning story that explains the flexibility and context-sensitivity we observed in Step 2. For example, if the behavior occurs in a novel context that the subject hasn't been conditioned for, that would pass. But note: if a simple conditioning story can explain the behavior, we don't need to attribute beliefs.
     - **Fail:** A simple stimulus-response explanation (even if it requires some prior learning) can fully account for the behavior without needing to invoke beliefs. Then code as stimulus-response.

  **Final Coding:**
  - If all steps 1-5 are passed, then code the behavior as involving a belief attribution (and note the attributed belief and goal in the annotation).
  - If any step fails, code as stimulus-response (and note the stimulus and response).

  **Important Notes:**
  - Steps 2, 3, 4, and 5 involve judgment calls. The manual must train observers with clear examples and non-examples.
  - Step 4 (mostly true beliefs) is particularly tricky because it requires the observer to judge what the subject "believes". We try to keep it grounded: the belief must be one that we (from our observation) can see is true or reasonable.
  - Step 5 is critical: we must always prefer the simplest explanation that fits the data. Only when a simple conditioning story fails do we move to belief attribution.

  **Worked Examples:**

  **Example 1: Scrub jay re-caching food only when observed.**
     - Step 1: Observable cause (S): presence of a rival during initial caching. Observable effect (E): food is moved to a new location. Pass.
     - Step 2: Flexibility? The jay does not re-cache when alone. It is sensitive to the context (presence/absence of rival). Pass.
     - Step 3: Rational connection? If the goal is to prevent theft, re-caching when observed is rational (because the rival might steal). Pass.
     - Step 4: Belief: does the jay believe the rival saw the cache? This belief is true (we see the rival was present and looking). Also, the jay's behavior doesn't show false beliefs in this clip. Pass.
     - Step 5: Alternative? Could this be a fixed response to the presence of a rival? But note: the jay doesn't re-cache immediately upon seeing a rival, but only after having cached in the rival's presence. This might require memory and inference, which isn't easily explained by simple conditioning. However, it could be argued that the jay was conditioned to re-cache when it had cached in the presence of a rival. This is a close call. We might say that the conditioning story is plausible, but the flexibility (e.g., if the jay can adjust to new rivals or new contexts) might push us to pass. But let's be conservative: if there is a plausible non-mentalistic explanation, we should use it. So, we might fail Step 5 and code as stimulus-response? But wait, the procedure says: if a simple conditioning story can fully account for the behavior, then we fail Step 5. However, the conditioning story might not account for the fact that the jay only re-caches the specific caches that were observed. That requires memory of which caches were observed. This might be beyond simple conditioning. Thus, we pass Step 5? 

     However, note: we are trying to be conservative. The procedure should err on the side of stimulus-response. Therefore, if there is any doubt, we fail Step 5. But let's be clear: the manual must provide guidance. We can say that if the behavior requires the integration of multiple past events (like remembering that this particular cache was observed) and cannot be explained by a simple association (e.g., the sight of the rival triggers re-caching of any nearby cache) then we pass Step 5. In this case, the jay is re-caching the specific cache that was made in the rival's presence, so it passes. Therefore, we code as belief attribution: the jay believes that the rival saw the cache and might steal it, and it desires to protect its food.

  **Example 2: Dog fetches leash and gazes at owner after hearing "walk" in an ordinary sentence.**
     - Step 1: S: hearing the word "walk". E: leash is fetched and dog looks at owner. Pass.
     - Step 2: Flexibility? Does the dog do this only in contexts that are relevant (e.g., when the owner is present and it's walk time) and not when the word "walk" is on TV? If the video shows the dog only responding when the owner says it (and not when the TV says it) then that's context-sensitive. But if the dog always does it regardless of context, then it's inflexible. We assume the clip shows context-sensitivity (e.g., the dog doesn't fetch the leash when the TV says "walk"). Pass.
     - Step 3: Rational connection? The goal seems to be to go for a walk. Fetching the leash is a rational step to achieve that. Pass.
     - Step 4: Belief: does the dog believe that the word "walk" means a walk is about to happen? This belief is true (because the owner did say it and then they went for a walk). Also, the dog's behavior doesn't show false beliefs. Pass.
     - Step 5: Alternative? This could easily be explained by classical conditioning: the word "walk" has been paired with walks in the past, and fetching the leash has been reinforced. The context-sensitivity might be explained by discriminative stimuli (e.g., the owner's presence). So, we do have a simple conditioning story. Therefore, we fail Step 5 and code as stimulus-response.

     This might be disappointing to some, but the procedure is conservative. Note: even though the dog might have a belief, we don't need to attribute one because a simpler explanation exists.

  **Example 3: Language-trained ape signs "food" in what trainers describe as a request.**
     - Step 1: S: presence of trainer and/or food. E: the sign "food" is produced. Pass.
     - Step 2: Flexibility? Does the ape sign "food" only when it wants food and a trainer is present? And not when food is present but it's not hungry? We assume the clip shows context-sensitivity (e.g., the ape signs when it hasn't eaten and the trainer is present, but not after eating). Pass.
     - Step 3: Rational connection? If the goal is to get food, then signing "food" to a trainer is rational. Pass.
     - Step 4: Belief: does the ape believe that signing "food" will result in getting food? This belief is true (because the trainer then provides food). Also, the behavior doesn't show false beliefs. Pass.
     - Step 5: Alternative? This is the crux. The ape has been trained: signing "food" has been reinforced with food. This is operant conditioning. The behavior could be a conditioned response to the presence of the trainer and/or food. Therefore, we fail Step 5 and code as stimulus-response.

     This is the case you won't like. But note: the procedure is designed to be conservative. The fact that the ape has been explicitly trained means that a conditioning explanation is readily available. We don't need to attribute a belief to explain the behavior.

  **What the Procedure Cannot Decide:**
  - If there is ambiguity in Step 1 (unclear stimulus or effect), the clip must be escalated.
  - If the behavior is novel and complex (e.g., the subject does something we've never seen before and it's hard to see a conditioning history) then Step 5 might be passed, but such cases are rare and might require escalation anyway.
  - If the behavior is flexible in a way that suggests beliefs, but we cannot rule out a more complex non-mentalistic explanation (e.g., complex learned rules without beliefs), then the procedure might pass Step 5 but we are not sure. We should note that the procedure is not a proof, but a practical guide. In such cases, we might code as belief attribution, but we should also flag the clip for review by a senior researcher.

  **Conclusion:**
  The procedure will lead to fewer belief attributions than you might like, but it will improve inter-rater reliability because it provides clear steps and errs on the side of caution. The manual should include training materials with many examples and practice clips. Remember: the goal is not to settle the philosophical debate, but to provide a consistent operational definition for coding.
answer: |-
  ### Radical Interpretation Coding Manual for Behavioral Annotation  
  **Philosophical Foundation**: Grounded in Davidson's principle of charity and rationality constraint, this procedure determines whether a behavior warrants belief attribution (implying mental states like knowledge or intention) or should be coded as a stimulus-response chain. Belief attribution requires that the subject's behavior is *only intelligible* if we assume it has mostly true beliefs and rational goals. Crucially, the bar is high: if a simpler explanation exists, default to stimulus-response.  

  **Key Rules**:  
  1. **No philosophy degree needed**: Use observable cues, not theory.  
  2. **Under 2 minutes per clip**: Strict time limit; if stuck, escalate.  
  3. **Belief attribution is rare**: Err toward stimulus-response.  
  4. **Anchor to the observable**: Never assume hidden mental states without passing all steps.  

  ---

  ### Step-by-Step Coding Procedure  
  **Ask these questions in order. Stop and code as "stimulus-response" if any step fails.**  

  #### **Step 1: Identify Observable Cause and Effect**  
  - **Question**: What is the *immediate observable trigger* (e.g., rival jay present, word "walk" spoken) and *immediate observable outcome* (e.g., seed moved, leash fetched)?  
  - **Pass**: Trigger and outcome are clear, direct, and visible in the clip (e.g., "rival jay watches caching → jay moves seed").  
  - **Fail**: Trigger or outcome is ambiguous, indirect, or inferred (e.g., "jay *thinks* rival saw cache" → fail).  
  - **Judgment call**: Observers must agree on what is visually unambiguous.  

  #### **Step 2: Check for Context Flexibility**  
  - **Question**: Does the behavior change based on context *in a way that isn’t rigidly tied to the trigger*?  
  - **Pass**: Behavior adapts to novel/dynamic contexts (e.g., jay re-caches *only* when a specific rival is present, ignores others).  
  - **Fail**: Behavior is fixed, automatic, or identical across contexts (e.g., jay *always* re-caches after any bird appears).  
  - **Judgment call**: "Flexibility" means variation beyond simple conditioning (e.g., ignoring triggers in irrelevant situations).  

  #### **Step 3: Apply Rationality Constraint**  
  - **Question**: Assuming the subject has a *goal* (inferred from Step 1’s outcome), is the behavior rational for achieving that goal?  
  - **Pass**: Action efficiently achieves the outcome given the context (e.g., re-caching when observed rationally prevents theft).  
  - **Fail**: Action is counterproductive, inefficient, or misaligned with the outcome (e.g., re-caching *while being watched again*, exposing the new location).  
  - **Judgment call**: "Rational" = what a human would do to achieve that goal (e.g., hiding food covertly).  

  #### **Step 4: Test Principle of Charity (Mostly True Beliefs)**  
  - **Question**: Would attributing a belief require assuming the subject has *mostly accurate knowledge* of the situation?  
  - **Pass**: Belief aligns with observable reality (e.g., jay acts as if rival *can see it* → rival is visibly present).  
  - **Fail**: Belief conflicts with observable facts (e.g., jay acts as if rival is present → but rival left the scene).  
  - **Judgment call**: "Mostly true" = ≥80% consistent with video evidence.  

  #### **Step 5: Rule Out Simpler Explanations**  
  - **Question**: Can the behavior be explained by associative learning (conditioning), instinct, or trial-and-error?  
  - **Pass**: No plausible stimulus-response explanation (e.g., behavior is novel, not trained, or defies conditioning).  
  - **Fail**: Simple explanation exists (e.g., behavior matches prior training, or is a species-typical reflex).  
  - **Judgment call**: Default to stimulus-response if *any* non-mentalistic explanation fits.  

  #### **Final Coding**  
  - **Belief Attribution**: Only if all 5 steps pass. Annotate as: "[Subject] acts on belief that [belief] to achieve [goal]."  
  - **Stimulus-Response**: If any step fails. Annotate as: "[Trigger] → [Response]."  
  - **Escalate**: If Step 1 is ambiguous, or Steps 2–5 are too close to call.  

  ---

  ### Worked Examples  
  #### **Example 1: Scrub Jay Re-caches After Being Observed**  
  - **Clip**: Jay caches seed while rival watches. Later, jay moves seed to new location.  
  - **Step 1**: Trigger = rival present during caching. Outcome = seed relocated. **Pass**.  
  - **Step 2**: Flexible? Yes; jay doesn’t re-cache if alone. **Pass**.  
  - **Step 3**: Rational? Re-caching when observed prevents theft. **Pass**.  
  - **Step 4**: True belief? Jay acts as if rival *saw* the cache → rival was visibly watching. **Pass**.  
  - **Step 5**: Simpler explanation? No—re-caching only when *specifically observed* isn’t just conditioning (requires memory/inference). **Pass**.  
  - **Coding**: **Belief attribution**. "Jay acts on belief that rival saw cache to protect food."  

  #### **Example 2: Dog Fetches Leash After Hearing "Walk"**  
  - **Clip**: Owner says, "Maybe we’ll walk later." Dog fetches leash, gazes at owner.  
  - **Step 1**: Trigger = word "walk." Outcome = leash fetched. **Pass**.  
  - **Step 2**: Flexible? Possibly; but if dog fetches leash to any "walk"-like sound (e.g., TV), fails. **Assume FAIL** (often trained/conditioned).  
  - **Step 3**: (If passed Step 2) Rational? Yes; fetching leash facilitates walk.  
  - **Step 4**: (If passed) True belief? Dog acts as if "walk" predicts walk → usually true.  
  - **Step 5**: Simpler explanation? **YES**—classical conditioning (word "walk" paired with walks). **FAIL**.  
  - **Coding**: **Stimulus-response**. ""Walk" → fetch leash + gaze."  

  #### **Example 3: Language-Trained Ape Signs "Food" as Request**  
  - **Clip**: Ape sees trainer, signs "food." Trainer gives apple.  
  - **Step 1**: Trigger = trainer presence. Outcome = food given. **Pass**.  
  - **Step 2**: Flexible? Yes; if ape signs only when hungry (not when full), passes. **Pass**.  
  - **Step 3**: Rational? Signing "food" to get food is goal-directed. **Pass**.  
  - **Step 4**: True belief? Ape acts as if signing causes food delivery → trainer usually complies. **Pass**.  
  - **Step 5**: Simpler explanation? **YES**—operant conditioning (signing was trained/rewarded). **FAIL**.  
  - **Coding**: **Stimulus-response**. "Trainer present → sign 'food'."  
  - **Why you won’t like this**: The ape’s behavior is indistinguishable from conditioned responding. The procedure cannot confirm "request" without evidence the ape *understands the trainer’s mind* (e.g., signing only when trainer is unaware of food).  

  ---

  ### What the Procedure Cannot Decide (Escalate These!)  
  1. **Ambiguous triggers/outcomes** (e.g., "Is that gaze intentional or accidental?").  
  2. **Behaviors where conditioning is possible but uncertain** (e.g., novel actions with no training history).  
  3. **Cases failing Step 4 ("mostly true beliefs") by slim margins** (e.g., subject acts on a belief that is *sometimes* false).  
  4. **Behaviors requiring inference about unobservable states** (e.g., "Does the ape *understand* that the trainer has knowledge?").  

  **Final Advice**:  
  - Train observers with practice clips highlighting edge cases.  
  - Track inter-rater reliability for Steps 2 and 5 (common disagreement points).  
  - Philosophically, this manual leans *against* belief attribution for non-linguistic creatures—but it standardizes coding while respecting Davidson’s framework. Escalate hard cases; don’t force consensus.  

  ---  
  *Manual version 1.0 | Grounded in Davidson (1973, 1974) | For academic use only*
