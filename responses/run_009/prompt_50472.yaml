  Okay, let me start by unpacking the user's query. They've been part of the LessWrong community since 2012 and are questioning a core norm: stating a numerical credence implies willingness to bet at those odds. They mention two main issues—Kelly betting conflicting with expected value maximization, and assumptions about linear utility and other factors affecting betting willingness.

  First, I need to recall the Dutch book argument. It's about avoiding sure losses by having coherent probabilities. But the user points out that Kelly bettors sometimes refuse positive EV bets if stakes are too high relative to their bankroll. That's a valid conflict. How do these two concepts coexist? 

  The user's deeper concern seems to be about the underlying assumptions of the norm. They mention nonlinear utility, counterparty risk, and other practical factors. The norm assumes money is linear and that betting refusal always indicates insincere credence. But in reality, people have different risk tolerances and external considerations.

  I should break this down into parts. First, address the Kelly vs. Dutch book tension. Explain that Dutch book is about probability coherence, while Kelly is about risk management. They operate at different levels: coherence vs. decision-making under constraints. 

  Next, tackle the assumptions. The norm implicitly assumes linear utility and no external factors. But in practice, those matter. The corrected norm would involve small-stakes bets to approximate linearity, and it should account for other reasons to avoid betting, like signaling costs.

  The user wants a coherent reconstruction of the rationality theory behind this norm. They're open to the folk norm being wrong. So I need to clarify where the community's practice oversimplifies and offer a more nuanced version. Emphasize that credences are about hypothetical small bets, and refusal in large stakes doesn't invalidate the credence if justified by risk aversion or other factors.

  Also, consider the user's identity. They're a long-time reader but questioning a foundational norm. They might be looking for validation of their skepticism or a deeper understanding to reconcile their doubts. Their unspoken need could be to resolve cognitive dissonance between theory and practice in rationalist communities, seeking a more robust framework that accommodates real-world complexities.
answer: |-
  You've nailed a deep tension in the rationalist community's "bet your credences" norm. The folk version *is* oversimplified, and resolving the Kelly contradiction requires making the implicit theory explicit and correcting it. Here's the reconstruction, the coherence check, and the corrected norm:

  **The Implicit Theory (Folk Rationality):**

  1.  **Credence = Betting Price:** A numerical credence *means* the price at which you are indifferent to buying or selling a contract paying $1 if the event occurs. Stating "70%" *is* saying "I value this contract at $0.70" (implying indifference at 7:3 odds for a $1 payout).
  2.  **Money as Linear Utility:** Utility is linear in money (or stakes are small enough that nonlinearity is negligible). This makes the mapping from credence to betting odds straightforward and stakes-independent.
  3.  **Dutch Book Coherence as Rationality Core:** The primary goal is avoiding probabilistic incoherence (being Dutch-bookable). Willingness to bet at your stated odds is the *operational test* for coherence and sincerity. Refusal is strong evidence of either incoherence or insincerity ("shyness").
  4.  **Expected Value Maximization (Naive):** Rational agents *should* accept any bet with positive expected value (EV) calculated using their true credences. Refusing a +EV bet at your stated odds is irrational or dishonest.
  5.  **Neglect of Constraints:** Bankroll size, risk aversion, counterparty risk, and non-monetary costs (like effort, signaling, or reputational damage from betting) are typically ignored or assumed negligible in the core test.

  **The Kelly Contradiction and Why the Folk Theory Isn't Coherent:**

  This is where the folk theory breaks down spectacularly:

  *   **Kelly is Fundamentally About Risk Aversion (via Bankroll Growth):** Kelly betting explicitly rejects naive EV maximization for finite bankrolls. It maximizes the *expected logarithm of wealth*, which encodes risk aversion – the disutility of losing a large fraction of your bankroll is much worse than the utility of gaining the same fraction.
  *   **The Refusal:** A strict Kelly bettor *will* refuse a bet that is +EV at their true credence if the bet size is too large relative to their bankroll. For example, with a true P=70% (EV+ at odds better than 7:3), they might refuse a bet at exactly 7:3 if the stake is large enough to risk a significant portion of their bankroll.
  *   **The Folk Theory's Incoherent Conclusion:** According to the folk theory, this refusal implies either:
      *   The agent's *true* credence is less than 70% (they were insincere/wrong), or
      *   The agent is irrational for refusing a +EV bet.
  *   **The Reality:** The agent can be perfectly sincere (P=70% is their true best estimate), perfectly rational (following optimal bankroll growth strategy), *and* refuse the bet. **The refusal is driven by risk aversion/nonlinear utility of bankroll outcomes, not by insincerity or incoherent probabilities.**

  **The Coherent, Explicit Theory (Corrected Norm):**

  1.  **Credence as *Hypothetical* Small-Stakes Betting Price:** A numerical credence P represents the price at which you would be indifferent to buying or selling a contract paying $1 if the event occurs, **under the following idealized conditions:**
      *   **Infinitesimal Stakes:** The stake size is small enough that the marginal utility of money is effectively constant (linear utility approximation holds).
      *   **No Counterparty Concerns:** You assume the counterparty has no relevant private information and isn't trying to manipulate you.
      *   **No Transaction Costs/Signaling:** Placing or refusing the bet has no other costs (time, reputation, strategic signaling).
      *   **Pure Belief:** The bet isolates your probabilistic belief about the event itself.
  2.  **Dutch Book Coherence Applies to *Probabilities*, Not Bets:** The core rationality requirement is that your *assigned probabilities* are coherent (sum to 1, obey Bayes, avoid sure loss guarantees). Your *betting behavior* in the real world is a *function* of these probabilities **plus** your utility function (risk aversion), your bankroll constraints, counterparty assessment, and other costs.
  3.  **Risk Aversion is Legitimate (Kelly is Rational):** Refusing a bet that is +EV at your true credence is **not** evidence of insincere credence if the refusal is justified by:
      *   **Significant Stake Size:** The bet is large relative to your bankroll, making Kelly or other risk-averse strategies optimal.
      *   **Counterparty Risk:** You suspect the other party knows more than you.
      *   **Non-Monetary Costs:** Betting would signal weakness, cost time/effort, damage relationships, etc.
  4.  **The Corrected Test for "Actually Believing It":** "Would you accept either side of this bet *at your stated odds* **if the stake were small enough that the monetary risk is negligible to you, and assuming no problematic counterparty or signaling issues?**"
      *   A "No" to *this small-stakes, frictionless* test *is* strong evidence of insincerity or incoherence.
      *   Refusal of a *large-stakes* bet at those odds is **not** evidence against the sincerity of the credence; it's evidence of risk aversion or other real-world constraints.

  **What the Norm Would Have to Look Like (The Corrected Practice):**

  1.  **Calibration/Prediction Ledgers:** These remain valid *measures of probabilistic accuracy* under the small-stakes/frictionless idealization. They track how well your *numbers* map to frequencies.
  2.  **The "Bet Your Credence" Challenge:**
      *   Must explicitly specify **small stakes** ("Would you bet $0.70 to win $1.00 or $1.00 to win $2.33?" rather than "Bet your life savings?").
      *   Must acknowledge that refusal of small-stakes bets *is* damning for the stated credence.
      *   Must explicitly **accept** that refusal of large-stakes bets at the same odds **does not** invalidate the credence – it only reveals risk aversion or other constraints. The response to a large-stakes refusal challenge should be: "My credence is 70%. I'd take that small-stakes bet instantly. For a large bet, I'd need better odds because I'm risk-averse / use Kelly. Want to discuss what fair odds would be *given my risk aversion*?"
  3.  **Kelly Integration:** The norm must explicitly incorporate that rational betting strategy (Kelly or fractional Kelly) involves *scaling* your bet size based on your credence (edge) and bankroll (risk tolerance), not just taking any +EV bet. Refusing a full-Kelly-sized bet at your stated odds *would* be problematic. Refusing a bet *larger* than your Kelly fraction is rational risk management.
  4.  **Acknowledge Non-Monetary Factors:** The norm needs caveats: "Assuming this is purely about the probability and money, and stakes are small..."

  **Which Parts of the Folk Norm are Load-Bearing vs. Flawed:**

  *   **Load-Bearing (Core):**
      *   Probabilistic coherence is fundamental (Dutch Book vulnerability is bad).
      *   Credences *should* imply *some* disposition to bet *under specific idealizations*.
      *   Systematic refusal of small-stakes bets at stated odds *is* evidence of insincerity or incoherence.
      *   Calibration is good.
  *   **Flawed/Needs Correction:**
      *   The conflation of stated credence with willingness to bet at *any* stake size.
      *   Ignoring legitimate risk aversion (especially bankroll constraints) as a reason to refuse bets that are +EV at true credence.
      *   Treating refusal of any bet at stated odds as *primarily* evidence of insincere credence, rather than first considering risk, counterparty, or costs.
      *   The naive implicit assumption of linear utility and infinite bankrolls.
      *   The oversimplified "EV maximization is always rational" stance.

  **In Summary:** The rationalist community's "bet your credences" norm is built on a sound core idea – probabilistic coherence is crucial, and credences should manifest in betting dispositions *under idealized conditions*. However, the *folk implementation* often ignores the critical role of risk aversion (especially via Kelly), counterparty concerns, and non-monetary costs. The coherent, corrected norm centers on **small-stakes, frictionless bets** as the test for sincerity/coherence of the *credence itself*. Refusal of **large-stakes** bets at stated odds is understood as rational risk management, not hypocrisy. The tension with Kelly is resolved by recognizing that Kelly dictates *how much* to bet given your credence and bankroll, not whether your credence is sincere. The corrected norm is more nuanced but avoids the contradiction you identified.
