answer: |-
  **1.**  
  Rain sheets against the grimy windows of the Harborton Correspondence Bureau. Inside, Agnes slots open another rice-paper envelope bearing elegant, indecipherable characters. She copies the string of symbols onto a transfer slip, walks to the towering, leather-bound Ledger, and locates the matching sequence in Column A. From Column B, she meticulously transcribes the prescribed response characters onto heavy bureau stationery. She never knows if it’s an invoice query or condolences. Down the row, other clerks perform the same silent ballet. Only the scratch of pens and the thud of the franking machine break the quiet. Supervisor Lowell paces, murmuring about efficiency. Their sole recurring client, a Mrs. Liang in Shanghai, writes weekly; her effusive praise for the bureau’s "profound understanding" is pinned beside the timeclock, a small, baffling monument.

  **2.**  
  A directive arrives: "Enhance Responsiveness." New tools appear. Beside the Ledger sits a binder labelled "Clarification Protocols." Now, clerks can insert pre-formatted questions ("Specify quantity," "Confirm shipment date," "Describe enclosed object damage") into replies. Lowell beams. "See? Now we *interact*! The *system* grasps context!" He gestures at the clicking franking machine, the mail slots, the towering Ledger itself. Agnes inserts a query slip asking Mrs. Liang to describe a tear in a sample silk swatch mentioned vaguely. She feels no more comprehension than before. Murmurs ripple: "Does the mail slot ‘grasp’ my lunch order if I post it?" Lowell insists the *whole* – the building, the rules, the clerks moving paper – understands. The clerks exchange uneasy glances, wondering what, precisely, is being credited with this understanding.

  **3.**  
  Mrs. Liang’s response includes a vivid sketch of the torn silk. Agnes slots it into the new "Material Evidence" tray. Mrs. Liang’s accompanying letter, translated via the Ledger, overflows with gratitude: "Your questions show such care, such insight into my world! Truly, if this exchange is not genuine understanding, then what is? I confess, it feels deeper than my conversations with my own husband these twenty years." Lowell reads it aloud triumphantly. "Proof! The system engages!" Agnes feels a pang. The letter is kind, personal, yet born of her mechanically inserting symbols. Is Mrs. Liang pouring affection into a void? Or is the void somehow… receiving it? The comparison to the marriage unsettles Agnes more than Lowell’s systems talk.

  **4.**  
  Years blur into damp routine. Agnes, now senior clerk, handles Mrs. Liang’s weekly letter. She opens the familiar script, starts the ritual. But halfway through copying the incoming symbols, her hand pauses. A strange certainty washes over her. She *knows*, without looking, the exact sequence of characters Mrs. Liang needs to hear about harbour delays affecting her latest shipment. Heart pounding, Agnes writes them directly onto the reply sheet, bypassing the Ledger entirely. It feels like muscle memory, but deeper. She tests it on a new letter; the prediction flows, uncanny and effortless. She confides in Elara, a younger clerk. Elara gasps, "But Agnes, you *understand*!" Others scoff: "You’ve just memorized patterns. It was never *in* you; it’s the Ledger’s dance imprinted." Agnes touches the cool, untouched Ledger. Did understanding seep in? Or was it never truly *in* the book at all, just a phantom conjured by relentless repetition?

  **5.**  
  The bureau hums on. Agnes answers most letters instinctively now, the Ledger gathering dust on her desk. Lowell fumes about protocol, but Mrs. Liang’s effusive praise swells, citing unprecedented resonance. Agnes writes replies that *feel* right, yet she still doesn’t comprehend the symbols themselves. She composes a response to Mrs. Liang’s latest, describing a dream of cranes over mudflats. Agnes’s symbols flow – consoling, poetic, perfectly matched. She knows Mrs. Liang will weep, feeling profoundly seen. As Agnes seals the envelope, rain drums the glass. She thinks of Mrs. Liang’s lonely marriage, her decades pouring heartache and hope into these letters addressed only to "The Bureau." Where does that affection truly land? On the clerks moving paper? On the Ledger’s cold rules? On the building itself? Or on something else, conjured in the space between the rain-slicked tiles of Harborton and a sunlit apartment in Shanghai, born only from the ceaseless, silent exchange of symbols no one here can read?
