prompt: |-
  I work in software engineering, and something about my field's foundations has started to bother me philosophically. Nearly all deployed cryptography is justified by conditional proofs: a scheme is shown to be secure if some unproven mathematical statement holds — factoring is hard, certain lattice problems have no short solutions, a hash function behaves like a random one. Those conditions are open problems in mathematics; no experiment could settle them, and a proof either exists or it doesn't. Yet the whole industry, and the standards bodies, and the auditors, all treat these conditions as effectively settled — we run the world's commerce on them. The confidence behaves in every practical respect like ordinary empirical confidence, except that there is nothing empirical it could be confidence about. And the same community seems to hold the opposite norm elsewhere: a mathematician would refuse to attach a probability to an unproven conjecture on the grounds that its truth value is already fixed and simply unknown, and a journal would never let a proof cite a conjecture as a premise.

  What epistemology does this practice presuppose? Does building global infrastructure on unproven mathematical assumptions only make sense if mathematical statements can rationally be held with intermediate confidence — some notion of probabilities over theorems that update over time, where a failed proof attempt or a decades-long absence of a crack in a primitive counts as weak evidence? Or is the practice compatible with the austere view that a mathematical truth is simply not the kind of thing one can be less than certain about until it is proven, with the industry merely making a decision-theoretic bet whose expected value happens to be dominated by the consequences of being wrong? I'd also like to know whether the practice is philosophically underdetermined — whether several quite different views of mathematical knowledge would license the same behaviour — and what would actually change in cryptographic practice if we made the implicit view explicit and took probabilities over open problems seriously, e.g. by letting them vary with evidence rather than treating each assumption as a fixed article of faith.

  Please structure your answer in British English with the following sections, in this order: "Summary of the implicit epistemology" (about 150 words); "What the practice strictly presupposes" (about 250 words), where you distinguish what is genuinely required from what merely sits comfortably with the practice; "Rival views and where they break" (about 250 words), covering the austere proof-only view and any others; and "Consequences of making it explicit" (about 150 words), on what would change if we treated open problems as genuinely probabilistic.
reasoning: |-
  Okay, let me unpack this fascinating query from a software engineer troubled by cryptographic foundations. The core tension is between mathematics' absolute truth-values and engineering's probabilistic confidence - a philosophical chasm masked by daily practice. 

  First, I need to map the epistemology actually embedded in crypto standards. The RFCs and NIST docs never say "we're 97% sure factoring is hard," yet risk assessments behave as if probabilities exist. This isn't naive frequentism - no one calculates collision probabilities for SHA-256. It's closer to a Bayesian stance where absence of counterevidence updates belief, though practitioners would rarely admit it. 

  The austere view that math truths are binary and unknowable until proved would make all crypto irrational. But that's not what happens - instead, we see practical convergence toward treating certain conjectures as "empirically true." The key is distinguishing what's strictly required (conditional security proofs + absence of breaks) from what's culturally added (quasi-religious faith in AES). 

  When examining rival views, the proof-only position collapses under its own weight: we'd have no cryptography at all. Formalist or social-constructivist accounts fare better but still jar with how cryptanalysts actually work - they don't treat hardness assumptions as arbitrary conventions. 

  If we made probabilities explicit, interesting shifts might occur: adaptive security levels based on conjecture-updating, or acknowledging that "256-bit security" encodes a probability distribution over possible mathematical futures. But the real gain would be philosophical hygiene - admitting we're not in the business of mathematical truth but catastrophic risk management.
answer: |-
  ### Summary of the implicit epistemology
  The practice in applied cryptography implicitly adopts a form of **fallibilistic empiricism** towards mathematical conjectures. While acknowledging that mathematical truths are ontologically fixed, the field treats the *practical security* of cryptographic primitives as subject to Bayesian-style updating based on empirical and social evidence. Confidence emerges not from proof but from sustained, failed efforts to break schemes, peer consensus, and the absence of counterexamples despite adversarial incentives. This functions as a pragmatic, evidence-based probability assigned to the *persistent intractability* of underlying problems (e.g., "factoring remains hard for real-world adversaries"), not to their absolute truth. The epistemology blends mathematical contingency with engineering risk management, treating assumptions as "empirically stable" until falsified.

  ### What the practice strictly presupposes
  The practice minimally presupposes two non-negotiable elements:  
  1. **Conditional security proofs**: Cryptographic schemes must be reducible to well-defined mathematical problems (e.g., factoring, discrete log). Security is *conditional* on these problems being intractable for relevant adversaries (polynomial-time, bounded quantum resources, etc.).  
  2. **Absence of practical breaks**: Despite incentives (financial, reputational, state-level), no efficient attack on the scheme or its underlying problem has been found and verified by the community.  

  What it *does not* strictly require, but aligns comfortably with, is:  
  - **Probabilistic belief in conjectures**: While practitioners often speak of "confidence levels," this is shorthand for accumulated negative evidence (failed attacks) and consensus, not a literal probability over mathematical truth.  
  - **Formal probabilism**: No explicit numerical probabilities over conjectures are calculated or mandated.  
  - **Epistemological commitment**: The practice is compatible with viewing intractability as a *physical* or *computational* constraint (e.g., "factoring is hard for existing computers"), sidestepping pure mathematical ontology.  

  Critically, the industry relies on **adversarial scrutiny** as an empirical probe: sustained cryptographic failure to break a scheme *functions as* evidence for its security, even if inconclusive for the underlying mathematics. Standards bodies implicitly treat this as sufficient for deployment.

  ### Rival views and where they break  
  * **The austere proof-only view**: Mathematical propositions are eternally true/false; belief must be binary (proven or not). Rational actors cannot assign intermediate probabilities.  
    * **Where it breaks**: This view renders all practical cryptography irrational. If no probability can attach to "factoring is hard," deploying RSA is epistemically unjustifiable. Yet the industry (and society) accepts this risk daily. The austere view cannot explain why some conjectures (e.g., P≠NP) command higher practical confidence than others (e.g., novel isogeny problems).  

  * **Social constructivism**: Confidence reflects only community consensus, not objective mathematical reality.  
    * **Where it breaks**: While consensus matters, breaks *do* occur (e.g., SHA-1 collisions), demonstrating that mathematical reality constrains practice. Consensus follows evidence (e.g., post-quantum migration after Shor’s algorithm), not vice versa.  

  * **Radical empiricism**: Only experimental breaks matter; mathematical proofs are irrelevant.  
    * **Where it breaks**: Security proofs *do* guide practice. Schemes without reductions (e.g., AES pre-standardisation) face scepticism. Proofs ensure attacks must solve the underlying hard problem, justifying focus on foundational assumptions.  

  Only a **pragmatic Bayesianism** survives: assigning credences to *practical intractability* (not abstract truth) based on evidence (failed attacks, proof efforts, heuristic analysis). This avoids claiming probabilities over mathematical facts while permitting rational action under uncertainty.

  ### Consequences of making it explicit  
  Explicitly quantifying credences (e.g., "we assign 95% probability that lattice problem *x* remains hard against quantum adversaries") would revolutionise practice:  
  1. **Dynamic security parameters**: Key sizes or primitives could adjust as credences shift with new evidence (e.g., improved attacks or proof techniques), rather than fixed "128-bit security" dogmas.  
  2. **Cost-benefit risk modelling**: Deployment decisions could weigh potential losses from breaks against implementation costs, using credences for expected-value calculations (e.g., accepting higher risk for low-value transactions).  
  3. **Research prioritisation**: Credence updates could guide funding—lowering confidence in a problem might spur research into alternatives or backup primitives.  
  4. **Philosophical clarity**: It would force confrontation with crypto’s true nature: not absolute security, but **risk management under mathematical uncertainty**. However, it risks false precision; credences would remain subjective and vulnerable to groupthink without rigorous evidence-weighting frameworks. Standards bodies might resist due to added complexity and liability concerns.
