prompt: |-
  Analyze the era of atmospheric nuclear testing, and its 1963 ending, as a case study in multipolar traps and races to the bottom. By way of fixing the salient facts so that the analysis does not turn on contested details: between 1945 and 1963, the United States and the Soviet Union — joined late by Britain — conducted hundreds of nuclear tests in the atmosphere and underwater. The fallout was a global commons burden rather than a bilateral one: strontium-90 turned up in milk and in children's teeth, became a public controversy, and gave everyone, including the superpowers' own publics, a shared interest in ending the contamination. In August 1963, shortly after the Cuban missile crisis, the three powers signed the Moscow Treaty banning tests in the atmosphere, outer space, and underwater, with underground testing permitted to continue. I know the standard arms-race framing and the textbook prisoner's-dilemma treatment; what I want is the multipolar-trap analysis specifically — the one on which competing agents are individually pushed toward actions that are jointly worse, because unilaterally abstaining cedes an advantage to rivals — run in both directions, theory illuminating the episode and the episode testing the theory.

  Please structure your response in the following sections, in this order:

  1. **The mapping** (about 150 words): who the players were, what the options were (keep testing atmospherically, abstain unilaterally, shift underground, negotiate), what the payoffs were, and what exactly counts as the "bottom" being raced toward. Note where this differs from a two-player prisoner's dilemma — in particular, the harm fell largely on parties with no seat at the table, which is characteristic of multipolar traps but not of standard two-agent models.

  2. **Where the trap model fits** (about 250 words): which features of the episode the model genuinely explains. Consider the condition under which a race to the bottom binds at all — roughly, when defecting is privately profitable under competitive pressure and the costs can be externalized — and say whether the pre-1963 period satisfies it.

  3. **Where the model breaks** (about 250 words): be honest about what the frame misdescribes or stays silent on. Here I especially want you to address the timing: underground testing had by 1963 made atmospheric tests largely substitutable, so abstention may have been approaching costlessness for both sides when the escape happened. That raises a live interpretive question — does the treaty support the story "coordination defeated the trap," or rather "the trap had already dissolved"? Take a position on which reading the evidence favors, and say what it implies for how readily races to the bottom can actually be exited by agreement rather than by the trap simply ceasing to bind.

  4. **What the episode shows about the theory** (about 200 words): is this a confirmation, an anomaly, or a case the theory never anticipated? Address whether exits from multipolar traps typically require something exogenous — a technology shift, a shared external shock like the fallout controversy or the near-miss of the missile crisis — and whether the commons-contamination side of the story is better captured by externalized-cost models than by strictly competitive ones.

  5. **Verdict** (about 100 words): a bottom line on whether this is a clean instance of a multipolar trap defeated by coordination, together with the single caveat you would most want a reader to retain.

  Use plain prose throughout. No bibliography, citations, or reading list — I want the reasoning, not the sourcing.
