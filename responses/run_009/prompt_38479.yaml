answer: |-
  Your discomfort is astute—the pairing *is* revealing but requires careful differentiation. While both Kant and More embody an absolutist refusal to lie (or swear falsely), their foundations, motivations, and the nature of the "lie" differ significantly. The play illuminates Kant by offering a concrete, costly dramatization of principle, but ultimately complicates and extends his arguments, particularly concerning conscience, law, and the social consequences of integrity.

  **Analysis & Argument:**

  1.  **The Nature of the Prohibited Act & Motivations:**
      *   **Kant (Murderer at Door):** Prohibits an *active deception* (a false statement) *directed at another person*. His primary argument is that lying violates the categorical imperative (universalizability & treating humanity as an end). The "duty to oneself" argument (found in *The Metaphysics of Morals*) is secondary here, framing lying as self-degradation, relinquishing one's dignity and moral worth.
      *   **More (Oath of Supremacy):** Refuses to perform an *act of public affirmation* (swearing an oath) he believes is *objectively false*. His stated motivation is overwhelmingly theological and self-regarding: "I will not give in because I oppose it—*I do*—not my pride, not my spleen, nor any other of my appetites but *I* do—*I*!" and his ultimate concern is for his immortal soul ("What matters is not that it's true, but that I believe it to be true... I will not give my soul."). While deceiving the state *might* be a consequence, it is not his primary objection. He seeks to avoid *complicity* and *false witness* before God.

  2.  **The "Casuistry" Question:**
      *   **Kant:** Explicitly rejects any form of casuistry or "mental reservation" in the murderer case. The duty is absolute: do not utter a falsehood. Silence might be permissible (though he doesn't explicitly endorse it here), but deception is not.
      *   **More:** Employs elaborate legal reasoning and *silence* precisely to *avoid* uttering a falsehood. He doesn't lie; he refuses to affirm the truth of what he believes false. His argument that silence implies consent is a *legal* argument within the existing system, attempting to use the law's own rules to protect his conscience without perjuring himself. **This is key:** More isn't *lying* through silence; he's strategically *not speaking* while hoping the law interprets his non-resistance favorably. This is fundamentally different from Kant's prohibition on *actively uttering a false statement*. Bolt presents More's silence as the absolute limit of what his conscience permits, whereas Kant demands uttering the truth regardless of consequences.

  3.  **Illuminating Kantian Themes:**
      *   **The Roper Exchange:** More's rebuke of Roper ("Oh? And when the last law was down, and the Devil turned round on you—where would you hide, Roper, the laws all being flat?") powerfully dramatizes the Kantian idea that moral law (and its embodiment in just positive law) is the essential framework protecting human dignity and order. Destroying laws for expediency (Roper's devil-hunting) leads to chaos and tyranny, mirroring Kant's fear of universalizing exceptions.
      *   **Absolute Principle vs. Expediency:** The entire play pits More's unwavering adherence to his truth against the political expediency of Henry, Cromwell, and ultimately Rich and Norfolk. This starkly parallels Kant's rejection of consequences as justification for violating duty.
      *   **Duty to Self (Secondary Resonance):** While More's primary concern is theological, the *effect* aligns partially with Kant's "duty to oneself" argument. More sees swearing falsely as a fundamental self-betrayal, a destruction of his own moral integrity ("A man should go where he won't be tempted... What would you do? Cut a great road through the law to get after the Devil?... And when the last law was down... do you really think you could stand upright in the winds that would blow then?"). His refusal is an assertion of self-respect against degradation, albeit framed in terms of soul rather than rational dignity.

  4.  **Where the Play Complicates/Resists a Kantian Reading:**
      *   **Theological Foundation:** More's absolutism is rooted in Catholic doctrine regarding conscience, sin, salvation, and the nature of an oath before God. Kant's is grounded in pure practical reason. This is a fundamental difference in motivation and justification.
      *   **The Object of the Act:** Kant forbids *lying to another person*. More refuses to *swear a false oath*, an act with profound religious and legal significance beyond simple interpersonal deception. The oath is a public, performative act binding him to the state and God.
      *   **Silence vs. False Utterance:** More's weapon is silence, meticulously maintained until cornered by perjury. Kant's prohibition is on uttering falsehood. More's strategy *is* a form of casuistry (finding a legal loophole) that Kant would likely condemn as evading the spirit of the duty (to tell the truth), even if not technically lying. The play hinges on the legal and moral weight of *silence* in a way Kant's essay does not address.
      *   **Political & Legal Context:** The play is deeply embedded in the politics of the Reformation, the conflict between Church and State (Papal vs. Royal Supremacy), and the weaponization of law (treason statutes, perjury). Kant's abstract example lacks this specific political machinery and the complex interplay of law, power, and conscience under tyranny.

  5.  **What the Play Adds: The Social Cost and Witness of Integrity:**
      *   **Impact on Onlookers:** This is crucial. The play shows the *visible cost* of More's integrity and its corrosive effect on others forced to choose.
          *   **Rich:** Witnesses More's refusal to compromise but ultimately *chooses* the lie (perjury) for personal gain. More's integrity becomes the stark backdrop against which Rich's betrayal is measured and made more despicable. More's death sentence, delivered after Rich's lie, is the ultimate price paid for holding the line Rich abandoned.
          *   **Norfolk:** Embodies the decent man compromised by fear and loyalty to the King. More's unwavering stance forces Norfolk into painful confrontation with his own weakness ("Thomas, why can't you do as I did and come with us, for fellowship!"). More's integrity becomes an unbearable reproach to Norfolk's capitulation.
      *   **The Cost of Principle:** Bolt vividly shows the human cost – family separation, poverty, imprisonment, death – grounding the abstract principle in visceral suffering. Kant states the consequence (the murderer finding the victim) but doesn't dwell on the personal toll on the truth-teller.
      *   **Law as Shield and Weapon:** The play explores how law, intended to protect (More's view), can be twisted into a tool of oppression (Cromwell's view). More's attempt to use the law's silence against itself is a complex legal-political maneuver absent from Kant's example.

  **Conclusion:**

  The play powerfully dramatizes a *form* of moral absolutism that resonates with Kant's rejection of consequentialism and his emphasis on the inviolability of principle. It brilliantly illustrates the societal consequences and the personal cost of such a stance, particularly the impact on those who witness it. However, More's absolutism is fundamentally distinct: it is rooted in **religious conscience and the sanctity of an oath before God**, not Kant's categorical imperative derived from reason. His primary concern is **self-preservation (of his soul) and non-complicity**, not primarily the violation of a duty owed *to the deceiver* or the universal law against false statements. His use of **strategic silence and legal interpretation** operates in a realm Kant explicitly rejects as casuistry.

  **Verdict: The play complicates Kant's case** by presenting a rival, theologically-grounded absolutism centered on oath-taking and conscience, demonstrating the complex interplay of law and integrity under political tyranny, and showcasing the profound social and personal costs and witnesses of holding such a line.
