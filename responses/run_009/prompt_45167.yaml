prompt: |-
  A friend who is an economist and I spent an entire evening arguing about how governments should weigh costs and benefits that fall in the distant future, and I came away puzzled by something more specific than our argument. She insisted that discounting future benefits is nothing more than opportunity cost of capital: money not spent now can be invested and made to yield more welfare later, so a benefit in 2100 genuinely is worth less today, and no value judgement about future people is involved. I suspected that some view about the moral status of the later-born has to be hiding inside the arithmetic. What puzzles me most is that the official practice seems to split the difference in a way that may not be coherent under any single theory.

  Take the way a national treasury appraises long-lived projects — flood defences, nuclear decommissioning, infrastructure. It discounts future costs and benefits back to the present at a standard annual rate, but the rate declines in steps with distance: a lower rate beyond thirty years, a lower rate again beyond seventy-five, so that far-future effects are not shrunk to the near-nothing that a constant rate would produce. So far, so equivocal. But the same guidance also caps the calculation at a horizon of about 125 years: whatever a project does to people after that — however catastrophic — counts for nothing whatsoever. So the far future is protected by a gentler rate, and then abolished by a cut-off.

  What theory of intergenerational value, if any, does this tiered practice presuppose? Does the declining schedule presuppose a pure time preference that simply weakens with distance, or can it be reconstructed by a view on which every generation's welfare counts equally — say, through diminishing marginal returns to consumption if the future is richer, or uncertainty about whether anyone will be there? Can the 125-year horizon be licensed by any of these theories, or does it quietly rule them all out and reveal something else entirely — a tractability convention masquerading as a moral position? And tell me what would have to change in the practice, step by step, if the implicit theory were replaced by a principle of equal concern for all generations: would consistency demand a flat rate out to infinity, a zero rate, or no discounting of welfare at all? I would also like to know which parts of the practice are genuinely underdetermined — points at which several quite different theories of the future would all license the same numbers.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate with their economist friend about discounting future benefits. The friend argued it's purely about opportunity cost of capital, not a moral judgment on future generations. The user suspects there's an implicit value judgment. They're puzzled by the government's tiered discounting approach: declining rates over time but a hard cutoff at 125 years. 

  First, I need to address the core tension: is discounting just an economic mechanism or does it embed ethical choices? The user’s friend represents the standard financial view—money now can grow, so future benefits are worth less today. But the user is right to question this. Even opportunity cost relies on assumptions about future returns, which involve predictions about technology, stability, and growth—all of which have normative underpinnings. 

  Next, the tiered system. Declining rates could stem from a few theories. Uncertainty about the distant future might justify lowering rates—maybe we’re less sure about far-off risks or returns. Diminishing marginal utility plays a role too; if we assume the future will be richer, each dollar matters less, so we discount slower. Pure time preference weakening over time? Possible, but ethically shaky. The user wants to know which theory the practice presupposes. The answer is likely a mix, pragmatically masking the underlying conflicts.

  Then there's the 125-year cutoff. This is the real kicker. No major ethical theory—utilitarian, deontological, sustainability-focused—would endorse ignoring post-125-year impacts. It’s clearly a tractability move: beyond that horizon, models get too fuzzy. But by framing it as policy, it implicitly treats future generations beyond that point as valueless, which is a massive, unstated moral stance. 

  The user asks what consistent practice would look like under equal concern for all generations. If every generation counts equally, discounting would only reflect predicted changes in wealth (via diminishing marginal utility) and uncertainty—not pure time preference. This could mean near-zero discount rates for welfare itself, though converting to monetary values might still use positive but low rates. The cutoff would vanish. 

  Underdetermined areas: the exact rate decline could be justified by multiple theories (uncertainty vs. declining marginal utility). But the cutoff? Only tractability, not ethics. The user’s deeper need here is clarity on where policy is evading ethical scrutiny. They sense incoherence and want tools to dissect it. Their frustration is palpable—they’re asking, "Does any of this actually make sense?" The answer is: economically, maybe; ethically, no. 

  Finally, the user might be seeking ammunition for their next debate. They need to show that the cutoff exposes the moral void in "neutral" economic framing. Highlighting the underdetermined parts helps them argue that choices are being masked as technical necessities. Their real target isn’t just understanding—it’s equipping themselves to challenge the economist’s veneer of objectivity.
answer: |-
  Your puzzlement cuts to the heart of a profound tension in intergenerational ethics and policy economics. The tiered discounting practice you describe (declining rates + a hard horizon) reflects an uneasy compromise between competing imperatives, not a coherent single theory. Here's a breakdown:

  **Deconstructing the Tiered Practice:**

  1.  **Declining Discount Rates (e.g., lower beyond 30/75 years):**
      *   **What it Might Presuppose (Theories):**
          *   **Uncertainty about the Far Future:** The further ahead we look, the less certain we are about technology, preferences, survival risks (e.g., pandemics, asteroids), or even the existence of beneficiaries. A *declining* rate can be modeled as incorporating an increasing "hazard rate" of catastrophe or radical societal change. This isn't a moral judgment on future people, but epistemic humility.
          *   **Diminishing Marginal Utility of Consumption (If Future is Richer):** Assuming long-run economic growth, future generations will likely be richer. An extra unit of consumption provides less welfare (utility) to a richer person. A *declining* discount rate *can* emerge if we assume:
              *   A constant *utility* discount rate (potentially zero for pure equal concern).
              *   Projected long-run economic growth (g).
              *   Diminishing marginal utility (η, the elasticity of marginal utility).
              *   The *consumption* discount rate (r) is then approximated by `r ≈ δ + η * g`.
              *   If we are *uncertain* about long-run growth (g) or even think it might slow significantly over centuries, a *declining* `r` over time can result. This *could* be consistent with equal concern for welfare.
          *   **Weakly Declining Pure Time Preference (Arguably Ad Hoc):** Some models postulate a pure time preference rate (δ) that itself declines over very long horizons. This is harder to justify ethically under equal concern but might reflect psychological distance or a pragmatic recognition of political myopia.

      *   **What It Rejects:** A constant discount rate based *solely* on the current opportunity cost of capital (SOC) projected indefinitely. The SOC reflects current market returns, not necessarily the appropriate ethical trade-off for centuries or existential risks. Constant high rates effectively erase the far future.

  2.  **The 125-Year Horizon (Cut-off):**
      *   **What It Presupposes:** This is almost entirely a **tractability convention masquerading as a moral position.** It implicitly declares: "Beyond this date, the welfare of people counts for precisely zero." No major ethical theory licenses this:
          *   **Utilitarianism (Total/ Average):** Counts all sentient beings, present and future.
          *   **Deontology/Rights-Based:** Future people have rights that shouldn't be extinguished arbitrarily at year 126.
          *   **Sustainability Theories:** Emphasize preserving options or critical capital for future generations indefinitely.
          *   **Contractualism:** Hypothetical agreements might consider very distant generations, especially for existential risks.
      *   **Practical Justifications (Weak on Ethics):**
          *   **Predictive Impossibility:** Forecasting costs/benefits beyond ~125 years is highly speculative.
          *   **Model Complexity:** Infinite horizons create mathematical and computational challenges.
          *   **Political Reality:** Current governments struggle to plan beyond electoral cycles; 125 years seems impossibly distant.
      *   **The Moral Problem:** The cut-off is fundamentally incoherent with the *reason* for declining rates. Declining rates acknowledge that the *far* future matters (just less certain or potentially richer). The cut-off abruptly declares it doesn't matter *at all*. It transforms epistemic caution into moral dismissal.

  **A Coherent Practice Under Equal Concern:**

  If governments genuinely adopted a principle of **equal concern for all generations' welfare**, the practice would need radical change:

  1.  **No Pure Time Preference:** The utility discount rate (δ) would be set to **zero**. The welfare of a person in 2500 counts equally to an identical person alive today. This is the core ethical commitment.
  2.  **Discounting Only Due to Growth & Uncertainty:** The *consumption* discount rate (r) would be positive *only* if:
      *   We expect future generations to be richer (`g > 0`).
      *   We accept diminishing marginal utility of consumption (`η > 0`).
      *   `r ≈ η * g` (since δ=0).
  3.  **Declining Rates Possible (But Not Guaranteed):** Rates would decline *only* if long-term growth projections (`g`) or our uncertainty about them justifies it. If we project robust growth far into the future, `r` could remain positive. If we project stagnation or are highly uncertain about very long-run growth, `r` would decline towards zero over centuries. **The driver is uncertainty about future *wealth*, not time itself.**
  4.  **No Arbitrary Horizon:** The calculation horizon would extend **indefinitely**. There would be no year beyond which impacts vanish.
  5.  **Focus on Welfare, Not Just Money:** Analysis would prioritize projecting and comparing *welfare impacts* (adjusted for diminishing marginal utility if necessary) rather than just monetary flows discounted at a rate. Monetary valuation would be a tool, not the core metric.
  6.  **Explicit Treatment of Catastrophic/Existential Risks:** Projects impacting existential risks (e.g., nuclear waste containment, climate tipping points) would require special frameworks recognizing the immense value of preventing potential future extinction or civilizational collapse, even if probabilities are low.

  **Underdetermined Aspects of the Practice:**

  1.  **The Exact Shape of the Declining Rate Schedule:** A specific declining rate curve (e.g., 3.5% for 0-30y, 3.0% for 31-75y, 2.5% after 75y) could be rationalized by several different combinations of:
      *   Assumptions about long-run growth uncertainty.
      *   Different hazard rates for catastrophe.
      *   Different values for η (elasticity).
      *   A weakly declining pure time preference schedule. Diverse theories can converge on similar numerical schedules.
  2.  **The Specific Horizon Length (e.g., 125 vs 100 vs 150 years):** This is almost purely arbitrary from an ethical or rigorous economic perspective. It's chosen based on perceived model feasibility and political palatability. Different theories wouldn't dictate a *specific* number; they would either reject a cut-off entirely or justify vastly different numbers based on specific assumptions about predictability decay.

  **In Conclusion:**

  Your intuition is correct. The standard practice is an unstable hybrid:
  *   The **declining rates** represent a (flawed) attempt to acknowledge the ethical weight of the far future and the limits of prediction/constant SOC, drawing loosely on uncertainty and growth arguments.
  *   The **125-year cut-off** is a brutal, ethically indefensible admission of practical and political limitations, fundamentally contradicting the gesture made by declining rates. It *is* a hidden value judgment: "Generations beyond this arbitrary line do not count."

  Moving towards a practice consistent with equal concern requires:
  1.  **Abolishing the cut-off.**
  2.  **Setting the pure time preference rate (δ) to zero.**
  3.  **Using a discount rate (r ≈ η * g) that explicitly reflects diminishing marginal utility and projections/uncertainty about long-run economic growth.**
  4.  **Accepting that truly long-term projects (especially involving existential risk) require indefinite horizons and specialized welfare analysis.**

  The current practice reveals less about a coherent theory of intergenerational value and more about the immense difficulty of translating ethical obligations to distant, unknown people into the constrained, near-term decision-making frameworks of modern governments. The declining rate is a nod to ethics; the cut-off is a surrender to expediency.
