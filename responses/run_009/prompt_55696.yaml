  Below is the quiz designed to meet your specifications. It includes 10 concrete cases with three answer options each (A: Life, B: Not Life, C: Genuinely Unsure / It Depends). The scoring key maps answer patterns onto the four core positions (Darwinian-lineage, autopoiesis/metabolic, thermodynamic, deflationary) and flags where the cases struggle to separate views. The quiz is diagnostic, forcing participants to reveal intuitions through cases rather than labels. Ambiguities are noted transparently, and "unsure" answers are treated as meaningful data (often signaling deflationary leanings or caution).

  ---

  ### **Quiz: What Counts as Life?**
  **Instructions**: For each scenario below, circle your answer:  
  - **A** if you consider it "alive"  
  - **B** if you consider it "not alive"  
  - **C** if you are genuinely unsure or think the answer depends on context  
  *(There are no right or wrong answers—go with your instinct!)*  

  1. **A virus** (e.g., influenza) floating in the air, outside of any host cell.  
     - A: Life | B: Not Life | C: Unsure/Depends  

  2. **A prion** (e.g., the misfolded protein causing mad cow disease) in a test tube, capable of converting normal proteins into misfolded versions.  
     - A: Life | B: Not Life | C: Unsure/Depends  

  3. **A cryogenically frozen cell**: A vial stored at liquid nitrogen temperature contains the last living cell of an extinct species. All metabolic activity is completely halted.  
     - A: Life | B: Not Life | C: Unsure/Depends  

  4. **The same cell, thawed and revived**: The vial is warmed, and the cell is placed in nutrients. It resumes metabolism and cell division.  
     - A: Life | B: Not Life | C: Unsure/Depends  

  5. **A self-replicating RNA strand** in a flow reactor: An RNA molecule copies itself using nucleotides flowing into the tube. Errors in copying lead to variations, and some variants outcompete others.  
     - A: Life | B: Not Life | C: Unsure/Depends  

  6. **A sterile worker bee**: It has a metabolism, responds to stimuli, and maintains hive functions, but it cannot reproduce or found a lineage.  
     - A: Life | B: Not Life | C: Unsure/Depends  

  7. **A candle flame**: It consumes wax and oxygen, produces heat/light, grows when fuel is added, and "dies" when fuel runs out.  
     - A: Life | B: Not Life | C: Unsure/Depends  

  8. **A digital organism**: Self-replicating code (e.g., in Avida) that mutates, evolves complexity, and adapts to simulated environments over generations.  
     - A: Life | B: Not Life | C: Unsure/Depends  

  9. **A synthetic minimal cell**: A bacterial cell with a genome fully designed on a computer. It metabolizes, grows, and divides like a natural cell.  
     - A: Life | B: Not Life | C: Unsure/Depends  

  10. **An autocatalytic reaction network**: A chemical system (e.g., the formose reaction) where products catalyze their own formation, increasing in complexity without replication. Energy is consumed to maintain the network.  
      - A: Life | B: Not Life | C: Unsure/Depends  

  ---

  ### **Scoring Key for the Instructor**
  **How to Use**:  
  - Tally each participant’s answers.  
  - Map patterns to positions using the tables below.  
  - "Unsure" (C) answers are informative: Frequent Cs suggest deflationary sympathy or caution (see "Interpreting Unsure Answers").  
  - **Flags for Ambiguity**: Cases that *cannot* cleanly separate positions are noted. Admit this in discussion—it reveals philosophical tensions.  

  #### **Core Positions and Expected Answers**
  *(A = Life, B = Not Life, C = Unsure/Depends)*  

  | Case                                | Darwinian-Lineage                 | Autopoiesis/Metabolic            | Thermodynamic                    | Deflationary Clue               |
  |-------------------------------------|-----------------------------------|----------------------------------|----------------------------------|---------------------------------|
  | **1. Virus (isolated)**             | B (No replication without host)   | B (No metabolism/boundary)       | B (No energy dissipation)        | C (Context-dependent)           |
  | **2. Prion**                        | B (No evolution)                  | B (No self-maintenance)          | B (No energy flow)               | C (Gray area)                   |
  | **3. Frozen cell (inactive)**       | B (No evolution)                  | B (No metabolism)                | B (At equilibrium)               | C (Dormancy blurs lines)        |
  | **4. Thawed cell (revived)**        | A (Capable of evolution)          | A (Metabolism/boundary restored) | A (Energy dissipation)           | A or C (Clearer case)           |
  | **5. Self-replicating RNA**         | A (Evolves via selection)         | B (No boundary/metabolism)       | A or C (Dissipative structure?)  | C (Borderline case)             |
  | **6. Sterile worker bee**           | A (Part of evolutionary lineage)  | A (Self-maintaining)             | A (Far-from-equilibrium)         | A or C (Prototype life?)        |
  | **7. Fire**                         | B (No information/evolution)      | B (No boundary/self-production)  | A (Dissipative structure)        | C (Analogy debate)              |
  | **8. Digital organism**             | A (Evolves digitally)             | B (Not chemical)                 | B or C (Not physical dissipation)| C (Digital-physical divide)     |
  | **9. Synthetic cell**               | A (Evolves if mutated)            | A (Metabolism/boundary)          | A (Dissipative)                  | A (Close to prototype)          |
  | **10. Autocatalytic network**       | B (No replication/evolution)      | A or C (Self-maintaining?)       | A (Dissipative structure)        | C (Fuzzy boundaries)            |

  #### **Mapping Answer Patterns to Positions**  
  - **Darwinian-Lineage View** (NASA-style):  
    - Key Answers: 5A, 6A, 8A, 10B, 4A, 3B  
    - Profile: Strong A on evolving systems (RNA, digital, thawed cell), B on non-evolvers (prion, fire, autocatalytic network). Frozen cell is B, thawed is A.  
    - **Flag**: Struggles with sterile bee (6A) and autocatalytic network (10B)—may overlap with autopoiesis on bee.  

  - **Autopoiesis/Metabolic View**:  
    - Key Answers: 4A, 6A, 9A, 1B, 5B, 8B, 3B  
    - Profile: A on systems with boundaries/metabolism (thawed cell, bee, synthetic cell), B on "incomplete" systems (virus, RNA, digital). Fire is B. Autocatalytic network (10) is often B/C (lacks clear boundary).  
    - **Flag**: Autocatalytic network (10) is ambiguous—some autopoiesis advocates accept it (if self-maintaining), others reject it (no boundary).  

  - **Thermodynamic View**:  
    - Key Answers: 4A, 6A, 7A, 10A, 3B, 1B, 2B  
    - Profile: A on dissipative structures (fire, thawed cell, autocatalytic network), B on static systems (frozen cell, prion). RNA (5) and digital (8) often B/C.  
    - **Flag**: Fire (7A) is the litmus test. Separates from all others.  

  - **Deflationary View** (Cluster Concept):  
    - Key Signals: High frequency of C answers (e.g., ≥5 Cs), or mixed A/B patterns that don’t fit other views.  
    - Profile: Cs on borderline cases (virus, prion, digital, autocatalytic network). May concede A/B on clear cases (thawed cell, fire).  
    - **Why "Unsure" Matters**: Frequent Cs reflect skepticism about essences. Caution alone may cause Cs on newer cases (e.g., digital, synthetic cell).  

  #### **Ambiguities and Limitations**  
  - **Cases that don’t separate views well**:  
    - Frozen/thawed cell (3B/4A): All views agree. Not diagnostic.  
    - Sterile bee (6A): Darwinian, autopoiesis, and thermodynamic views all call it alive. Only deflationists might hesitate (C).  
    - Prion (2B) and synthetic cell (9A): Near-universal consensus.  
  - **Cases with partial overlap**:  
    - Autocatalytic network (10): Splits Darwinian (B) from thermodynamic (A), but autopoiesis is split (A/B/C).  
    - Self-replicating RNA (5): Splits autopoiesis (B) from Darwinian (A), but thermodynamic may waver (A/C).  
    - Digital organism (8): Splits Darwinian (A) from autopoiesis (B) and thermodynamic (B/C).  
  - **Fire (7) is the best separator**: Thermodynamic (A) vs. others (B).  

  #### **Discussion Agenda from Disagreements**  
  1. **Start with high-disagreement cases**:  
     - Virus (1), Fire (7), Autocatalytic network (10), Digital organism (8).  
     - Ask: "Why did Darwinian folks say A for digital but B for fire? Why did thermodynamic say A for fire but B for prion?"  
  2. **Use "unsure" answers**:  
     - Poll: "Who put C for virus? What would it take to make it alive/not alive?" Links to deflationary view.  
  3. **Spot inconsistencies**:  
     - "If you said A for thawed cell but B for frozen, does ‘life’ pause? If RNA evolves, why isn’t it alive to autopoiesis folks?"  
  4. **End with philosophy**:  
     - "Which view feels most useful for astrobiology? What’s lost if we ditch definitions?"  

  The quiz forces confrontations: Darwinian vs. autopoiesis (RNA, digital), thermodynamic vs. all (fire), and deflationary vs. essentialism (via "unsure" patterns). It’s messy by design—let them fight!  

  ---  
  **Final Notes**:  
  - **Time**: Budget 10 mins for quiz + 5 mins scoring reveal, leaving 1h45m for debate.  
  - **Flexibility**: If the class title shifts, the quiz still works—it’s about concepts, not labels.  
  - **Your Role**: Stay neutral! Ask probing questions: "What does ‘evolution’ mean to you?" or "Why is fire different from a cell?"  
  - **Source Tips**: Cite Cleland (deflationary), Maturana/Varela (autopoiesis), NASA (Darwinian), Prigogine (thermodynamic) when introducing positions.  

  This should spark lively debate while diagnosing intuitions. Let me know if you need a printable version or slides!
