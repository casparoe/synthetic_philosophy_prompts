  1. **Virus**: A typical virus (e.g., influenza) outside a host cell. 
     - It has genetic material but cannot replicate or metabolize on its own.

  2. **Prion**: A misfolded protein that causes other proteins to misfold (e.g., the agent of mad cow disease). 
     - No genetic material, just a protein that catalyzes a conformational change.

  3. **Frozen cells (inactive)**: A vial containing the last living cells of an extinct species, stored at liquid nitrogen temperature. All metabolic activity is stopped. 
     - This is the "before thawing" state.

  4. **Frozen cells (thawed and revived)**: The same vial of cells, after being thawed and placed in a suitable environment, where the cells resume metabolism and replication. 
     - This is the "after thawing" state.

  5. **Self-replicating RNA**: An RNA strand in a test tube that can make copies of itself when supplied with nucleotides and energy (like the Spiegelman monster). 
     - It replicates and evolves but lacks a boundary and metabolism.

  6. **Sterile animal**: A worker bee (which is sterile and cannot reproduce) but is otherwise alive and functioning. 
