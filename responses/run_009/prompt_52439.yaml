prompt: |-
  I'm an undergraduate taking a seminar on moral uncertainty, and we've just finished the unit on how to act when you're torn between moral theories. A coursemate of mine, Dara, has been unusually consistent about her own case across our discussion sections, and I want help predicting her verdicts on some new cases — and, more than that, working out the decision rule she is implicitly running. Please respond as an expert in decision theory and normative ethics: think carefully, start with some brainstorming of the candidate rules before committing to any prediction, and be explicit about your reasoning and your confidence at each step.

  Here is Dara's setup and track record. She assigns about 60% credence to a fairly demanding act-consequentialism (maximize welfare) and about 40% to a Kantian view on which lying, promise-breaking, and theft are hard constraints, while beneficence is an imperfect duty: some serious concern for others is required, but the level is left to reasonable discretion, and going beyond it is admirable rather than obligatory.

  Her verdicts so far, all cases where the two theories disagreed:
  - She would not tell a white lie to spare a host's feelings about a disastrous dish; she deflected with something true instead.
  - She kept a promise to help a friend move on a day she could instead have volunteered somewhere she grants the time would have done slightly more good.
  - She gives a few percent of her income and helps friends in need, but refuses to raise her giving toward the level consequentialism demands, calling the extra admirable but not required.
  - She would not quietly take money from a wealthy friend who would never notice it missing, even though the money, donated, would do far more good than it does sitting in his account.
  - She declined to register as a bone-marrow donor, though the risk to her is small and the expected benefit to a stranger is large.

  Now the new cases, which I'd like you to predict:
  (1) An abusive ex-partner asks Dara where her friend is staying, in circumstances that make it clear he intends to find her and do her serious harm, and the friend's safety depends on Dara's lying. Will Dara lie?
  (2) Dara turns out to be a compatible kidney donor for a stranger; the surgical risk to her is small and the benefit to the recipient is large. Will she donate — and will she regard donating as required, or merely as allowed?

  In answering, please do four things. First, lay out the decision rules that fit her track record — I'd expect at least a constraint-supremacy rule (the Kantian side's constraints win regardless of stakes), an asymmetric-permission rule (never do what either theory forbids; failing to do extra good is never wrong), and versions of expected-choiceworthiness maximization with adjustable intertheoretic weights — but tell me if I'm missing better candidates, or if some of these collapse into each other, and be honest about the fact that expected-choiceworthiness rules can be tuned to fit almost any track record if the weights are free. Second, say where the rules that fit her record diverge on the two new cases, noting which of the rules speak only to what is permitted rather than to what she will choose, and give your best guess for each case with reasons. Third, say which of her existing verdicts is the closest analog for each new case. And fourth, name the single further case whose verdict would best discriminate among the surviving rules — and explain why that one, rather than a case that merely raises the stakes again.
reasoning: |-
  Hmm, the user is an undergraduate in a moral uncertainty seminar and wants help analyzing Dara's decision rule based on her track record of verdicts. They've provided several cases where Dara consistently prioritized Kantian constraints over consequentialist demands, even when the stakes were high. Now they want predictions for two new cases involving lying to prevent harm and kidney donation, along with a deeper analysis of the decision rules Dara might be using.

  Looking at Dara's profile, she assigns 60% to demanding act-consequentialism but 40% to a Kantian view with hard constraints against lying, promise-breaking, and theft. Her past choices show remarkable consistency: she refuses to tell white lies, breaks promises for slightly more good, gives only modestly to charity, won't steal from a wealthy friend for greater good, and declines bone-marrow donation despite favorable risk-benefit ratio. This pattern suggests she treats Kantian constraints as non-negotiable.

  For candidate decision rules, several possibilities come to mind:
  - Constraint Supremacy: Kantian constraints always override consequentialist considerations. This fits all her past choices perfectly.
  - Asymmetric Permission: Never violate what either theory forbids, but extra beneficence is optional. This also fits well, though it's less specific about why she stops at modest giving.
  - ECM with Extreme Thresholding: Expected choiceworthiness with a penalty so high for constraint violations that it makes them effectively forbidden. This could technically fit but feels like overcomplication.
  - ECM with Fixed Weights: Simple 60-40 weighting doesn't explain her choices - it would have favored volunteering over moving help when consequentialism saw slightly more good.

  The constraint supremacy rule is the cleanest fit. It explains why she refuses all constraint violations regardless of stakes (lying, promise-breaking, theft) while allowing discretion on beneficence intensity (giving level, bone-marrow refusal).

  For the new cases:
  (1) The lying-to-protect scenario: All rules except pure ECM would forbid lying. The closest analog is her refusal to tell a white lie - same constraint violation. Prediction: She won't lie, but might deflect truthfully.
  (2) Kidney donation: No constraint violation, just beneficence. Analogous to bone-marrow case. Prediction: She'll refuse and see it as optional, though perhaps with more internal conflict.

  The most discriminating test case would be one where consequentialism forbids an action (e.g., harming one to save many) while Kantianism permits it. Her response to such a "consequentialist constraint" scenario would reveal if her rule is truly constraint-supremacy or asymmetric-permission.

  Confidence is high in constraint-supremacy as the operative rule given how consistently she treats Kantian prohibitions as absolute. The beneficence cases show she doesn't feel obligated to maximize, just to meet some minimum threshold.
answer: |-
  Based on Dara's track record and the structure of her moral uncertainty, I'll analyze this systematically as requested. My expertise in decision theory and normative ethics suggests her behavior exhibits a highly consistent pattern favoring Kantian constraints over consequentialist demands, even when stakes are high.

  ### Step 1: Candidate Decision Rules Fitting Her Track Record
  Here are the viable rules compatible with her existing verdicts, ranked by fit:

  1. **Constraint Supremacy with Beneficence Discretion (CSBD)**  
     - **Rule:** Never violate Kantian constraints (lying, promise-breaking, theft), regardless of consequentialist stakes. Beneficence (helping others) is subject to a threshold of "reasonable discretion" where exceeding it is supererogatory.  
     - **Fit:** Perfectly matches all 5 cases. Kantian constraints are absolute, while acts of pure beneficence (giving, bone-marrow donation) are optional beyond a minimal level.  
     - **Strength:** Directly reflects her stated credence split and explicit language ("admirable but not required").

  2. **Asymmetric Permission Rule (APR)**  
     - **Rule:** An act is forbidden if *either* theory forbids it. An act is merely permitted (not obligatory) if only one theory *requires* it (e.g., consequentialism demanding extreme giving).  
     - **Fit:** Explains all cases except *might* struggle with the promise-keeping case if consequentialism viewed skipping volunteering as forbidden. However, since she called extra giving "not required," APR fits if we interpret consequentialism's demands as creating positive duties that aren't jointly obligatory.  
     - **Strength:** Simpler than ECM but less nuanced on beneficence discretion.

  3. **Expected Choiceworthiness Maximization with Constraint Penalty (ECM-CP)**  
     - **Rule:** Maximizes Σ [P(T) × Choiceworthiness(T,A)], but Kantian constraints assign catastrophic negative choiceworthiness (e.g., -1000 utils) if violated, making them dominate. Beneficence has moderate choiceworthiness weights.  
     - **Fit:** Can technically fit all cases with tuned weights, but requires ad hoc penalty terms.  
     - **Weakness:** Overfits without predictive discipline; contradicts Dara's language ("not required" vs. "forbidden").

  4. **Simple ECM with Fixed Weights**  
     - **Rule:** Maximizes 0.6 × (Consequentialist Value) + 0.4 × (Kantian Value).  
     - **Fit:** **Fails** the moving-help promise case (consequentialism slightly favored volunteering, but she kept promise) and the theft case (large welfare gain ignored).  
     - **Status:** Ruled out.

  **Collapse Note:** CSBD and APR are functionally identical for cases involving constraints (both forbid lying/promise-breaking/theft). They diverge only if an act is *required* by one theory but *forbidden* by neither—which her beneficence cases suggest APR handles well.

  **Best Candidate:** **CSBD** is the most parsimonious and directly reflects Dara's descriptions. APR is a close second but slightly vaguer on beneficence discretion.

  ---

  ### Step 2: New Case Predictions & Rule Divergence
  #### Case (1): Lie to protect friend from abusive ex?
  - **Kantian View:** Lying is strictly forbidden (hard constraint).  
  - **Consequentialist View:** Lying is required (prevents grave harm).  
  - **Rule Divergence:**  
    - CSBD & APR: **Forbid lying** (Kantian constraint violation).  
    - ECM-CP: *Could* permit lying if penalty is low, but her track record suggests penalties are extreme → likely forbids.  
  - **Prediction:** **She will NOT lie.**  
    - **Why?** Direct analog to "white lie" case: even high stakes don't override constraints. She may deflect ("I won't tell you") or refuse to answer, as she did with the host. Her Kantian credence (40%) dominates constraints.  
    - **Confidence:** 95% (fits all prior constraint cases).  
  - **Permission vs. Choice:** Rules forbid lying; her choice follows obligation.

  #### Case (2): Donate kidney to stranger?
  - **Kantian View:** No constraint against donation. Beneficence is an imperfect duty → donation is supererogatory (admirable but not required).  
  - **Consequentialist View:** Donation is obligatory (high benefit, low risk).  
  - **Rule Divergence:**  
    - CSBD: **Permits but does not require** donation (beneficence discretion).  
    - APR: **Permits but does not require** donation (only consequentialism demands it).  
    - ECM-CP: Likely requires donation (no penalty, 60% weight on large net gain).  
  - **Prediction:** **She will NOT donate, and will regard it as MERELY ALLOWED (not required).**  
    - **Why?** Direct analog to bone-marrow case: identical structure (small risk, large benefit to stranger). Her refusal there, plus "admirable but not required" language, confirms beneficence discretion.  
    - **Confidence:** 90% (consistent with prior beneficence cases; ECM-CP is disfavored by track record).  
  - **Permission vs. Choice:** Rules permit non-donation; her choice reflects discretion.

  ---

  ### Step 3: Closest Analogs for New Cases
  - **Case (1):** White lie to spare host's feelings → **Both involve lying to prevent harm.** Stakes are higher here, but her consistency suggests stakes don't override constraints.  
  - **Case (2):** Bone-marrow donation refusal → **Both involve significant, risky beneficence to strangers with high expected utility.** Parallels her "reasonable discretion" threshold.

  ---

  ### Step 4: Best Discriminating Case to Test Rules
  **Proposed Case:** *Dara can prevent a genocide (consequentialism: obligatory) by breaking a trivial promise (e.g., canceling a coffee date with no serious harm; Kantianism: forbidden).*  

  **Why this discriminates:**  
  - **CSBD & APR:** Forbid promise-breaking → *she would not act*.  
  - **ECM-CP:** If the Kantian penalty is finite, high-stakes consequentialism could dominate → *she might act*.  
  - **Why not "raise stakes"?** Existing cases already show constraints trump high stakes (theft for great good). This tests if *any* constraint violation is tolerable, exposing whether her rule is truly absolutist (CSBD/APR) or scalar (ECM-CP). It also avoids redundancy with prior cases.  

  **Confidence in this test:** 100% — her response would conclusively rule out ECM-CP if she refuses, or rule out CSBD/APR if she acts.

  ---

  ### Final Summary
  - **Dara's Likely Rule:** **Constraint Supremacy with Beneficence Discretion (CSBD)**. Kantian constraints are absolute; beneficence has flexible demands.  
  - **Predictions:**  
    - (1) Will **NOT lie** to protect friend (constraint supremacy).  
    - (2) Will **NOT donate kidney** and sees it as **optional** (beneficence discretion).  
  - **Key Insight:** Her 40% Kantian credence acts as a veto on constraints, while her 60% consequentialist credence doesn't compel maximal beneficence. This asymmetry is the core of her decision rule.  

  If your seminar explores other rules (e.g., MEC-E or Borda counts), note they struggle with her absolutism on constraints. The discriminating case above would clarify further.
