  I recently became the subject, rather than the student, of a well-known problem in decision theory, and a dinner-party argument about what I should do has left me unable to settle it myself. I would like you to adjudicate the argument my two friends had, move by move, and I will describe the situation in full so that no outside knowledge is needed.

  Three weeks ago, an acquaintance in an online community I belong to proposed the following arrangement, to be executed by written agreement and attested by a neutral third party who flipped a fair coin and recorded the result. If the coin came up heads, my acquaintance would send me $1,000 and I would owe nothing. If it came up tails, I would send him $100 and he would owe nothing. No further contact would occur after the flip in either case, the arrangement was strictly one-shot, and it was set up so that neither party's decision after the flip could influence anything the other party had already done. The coin came up tails. I have a day left to either send the $100 or renege, and I have not yet decided.

  When I described this at dinner, my friends Daniel and Marta fell into the following argument, which I have reconstructed from my notes as faithfully as I can.

  (1) Daniel said paying is straightforwardly irrational: the $1,000 was never going to be mine on this branch; from where I now stand, the only live choice is between having $100 less and having $100 more, and sending the money is simply a loss. He added that my earlier written agreement is a sunk cost and gives me no reason now.

  (2) Marta replied that the agreement is not the point — the point is the decision procedure. When I accepted the arrangement, its expected value was strongly positive, and the procedure that accepted it is one that, in the heads branch of the very same arrangement, collects $1,000. If my decision now is the output of that same procedure, then refusing to pay means the procedure I ran was one that takes the good branch and refuses the bad one, and a procedure like that should never have been endorsed in the first place, since a counterpart offering such deals would then only ever be handing me the bad branches.

  (3) Daniel answered that whatever procedure ran three weeks ago has already run; nothing I do now reaches back and changes which procedure it was, or what happened on the heads branch. I cannot affect the past, and a reason that requires affecting the past is no reason at all. He accused Marta of dressing up a sunk cost in the language of policies.

  (4) Marta said she is not claiming backward causation. The claim is about which algorithm I should want to be, evaluated across the counterfactual branches as they were arranged ex ante; "one-shot" changes nothing, because the evaluation of an algorithm does not depend on how many times it is run, only on what it does in each situation it confronts — and in this situation, the algorithm that pays is the one that walked away with $1,000 in expectation when the deal was struck.

  (5) Daniel then granted, for the sake of argument, that agents who pay in such cases do better across a life of similar encounters, but said this only works if the paying is somehow observed or repeated, so that a reputation for following through attracts the favorable offers. Our arrangement was explicitly anonymous and one-shot: no one will ever know, no further deals are conditioned on this one, and so the long-run argument has had all its machinery removed. Stripped of repetition and observation, he said, Marta's position reduces to a feeling that one ought to be the sort of person who pays, which is a sentiment, not a reason.

  (6) Marta's final reply was that if that is all it takes to refute her, then it refutes Daniel too: his own rule — pay when and only when payment is causally efficacious — is also a policy, adopted once and applied across situations, and nothing about it is privileged just because each application looks locally like an isolated choice. She said the real disagreement is about whether rationality attaches to particular token decisions or to the procedure that produces them, and that Daniel has simply assumed the former without argument.

  I could not referee this, and I have to decide by tomorrow. Please do the following. Adjudicate the exchange move by move: for each numbered move, say whether it is right, mistaken, or right only under an assumption the two of them never managed to state, and justify the rating. Then give an overall verdict on the question I actually face. In addition, tell me explicitly what consideration would change your verdict, and identify the step in your own reasoning most likely to fail. I would prefer your answer to open with its bottom line in the first sentence and proceed straight to the reasoning, without preamble and without restating my situation back to me.
reasoning: |-
  We are to adjudicate the exchange between Daniel and Marta, move by move, and then give a verdict on the decision at hand. The situation: A one-shot, anonymous coin flip arrangement where on tails, the subject must decide whether to pay $100. The coin came up tails.

  Bottom line: You should pay the $100.

  Now, move-by-move analysis:

  (1) Daniel: He says paying is irrational because from the current perspective, the only choice is between losing $100 or not. The agreement is a sunk cost and should not influence the decision.

  Rating: Mistaken. Daniel is correct that the agreement itself is a sunk cost, but he misses the point that the decision now is part of a larger strategy that was chosen for its ex ante expected value. The sunk cost fallacy typically refers to past investments that should not affect future decisions. However, in this case, the agreement is about a contingent action in the future (if tails, you pay). The decision to honor the agreement is not about the past cost of making the agreement but about the type of decision-maker you are. Moreover, the reasoning ignores that the entire arrangement was designed to be mutually beneficial only if both parties are trustworthy.

  (2) Marta: She argues that the decision procedure that accepted the arrangement must be consistent. If you renege on the tails branch, then the procedure you are using is one that would only take the good branch (heads) and avoid the bad one (tails). But such a procedure would not be offered by rational counterparties because they would only lose money (on heads) and never gain (on tails). Hence, the procedure that pays is the one that had a positive expected value when the deal was struck.

  Rating: Right. Marta correctly points out that the decision at the time of accepting the arrangement was based on the expected value of the entire arrangement. The procedure that pays in the tails branch is the same procedure that would have collected $1,000 in the heads branch. If you change your procedure in the tails branch, then the procedure that was originally chosen (which led to the agreement) is not the one you are actually executing. This inconsistency undermines the ex ante rationality of accepting the deal.

  (3) Daniel: He says the procedure from three weeks ago has already run and cannot be changed by the current decision. He accuses Marta of dressing up a sunk cost.

  Rating: Mistaken. While it is true that the past cannot be changed, the current decision is part of the same procedure that was chosen ex ante. The issue is not about changing the past but about being consistent with the strategy that made the deal attractive in the first place. Moreover, the sunk cost argument does not apply because the cost of the agreement (the time and effort to set it up) is negligible compared to the stakes. The real issue is the strategic one: what kind of decision rule are you using? If you renege, then the decision rule you are using is not the one that would have been chosen ex ante because it would have been predicted that you would renege on tails, making the deal unfavorable for the counterparty and hence not offered.

  (4) Marta: She clarifies that she is not talking about backward causation but about evaluating an algorithm (decision procedure) across the counterfactual branches. The algorithm that pays in the tails branch is the same one that would have collected $1,000 in the heads branch. The one-shot nature does not change the evaluation of the algorithm.

  Rating: Right. The evaluation of a decision rule (algorithm) is done ex ante, considering all possible branches. The rule that pays in the tails branch was chosen because it yields a positive expected value. Even in a one-shot setting, if you are using a rule that reneges in the tails branch, then the rule you are actually using is not the one that was chosen. In fact, if you had known that you would renege in the tails branch, you would not have accepted the arrangement because the counterparty, being rational, would not have offered it (or if they did, they would have adjusted the terms to make it unfavorable). Thus, the rule that pays is the one that makes the arrangement possible.

  (5) Daniel: He grants that in repeated settings with reputation, paying might be better, but in this one-shot anonymous setting, the long-run argument fails. He says without repetition or observation, Marta's argument reduces to a sentiment.

  Rating: Mistaken. The one-shot setting does not invalidate the argument. The issue is not about reputation but about the consistency of the decision rule. The arrangement was made on the understanding that both parties would honor the agreement. If you are the type of person who reneges, then rational counterparties would not enter into such an arrangement with you. Even in a one-shot, anonymous setting, the counterparty might have a belief about the type of people in the community. If the community is known to have people who follow through, then such arrangements are possible. If you renege, you are undermining the possibility of such arrangements in the community (even if you are anonymous, the aggregate behavior of the community might become known). Moreover, even if we disregard the community effect, the argument for paying is that it is part of a rule that, when consistently applied, makes you eligible for such positive expected value arrangements. Without the rule, you wouldn't get the arrangement at all.

  (6) Marta: She argues that Daniel's rule (pay only when causally efficacious) is also a policy. The disagreement is about whether rationality attaches to individual decisions or to the procedure.

  Rating: Right. Daniel's rule is indeed a policy. The real issue is about the level at which we evaluate rationality. If we evaluate each decision in isolation, then Daniel's reasoning holds. But if we evaluate the decision rule (or policy) that the agent uses, then Marta's reasoning holds. The problem with evaluating each decision in isolation is that it leads to a dynamic inconsistency: the agent would accept the arrangement ex ante (because of the positive expected value) but then renege ex post (in the tails branch). This inconsistency means that if the agent were known to use such a rule, they would not be offered the arrangement in the first place. Hence, the rule that reneges in the tails branch is self-defeating.

  Overall verdict: You should pay the $100.

  The key reason is that the decision rule that pays in the tails branch is the same rule that would have collected $1,000 in the heads branch. This rule was chosen ex ante because it had a positive expected value. If you renege, you are not following the rule that made the arrangement attractive. Moreover, if you are the type of person who reneges, then rational counterparties would not offer you such arrangements in the future (even if you are anonymous, the counterparty might have a prior belief about the trustworthiness of anonymous participants, and if many people renege, the arrangements would cease). Therefore, to be the type of person who can engage in these mutually beneficial arrangements, you should pay.

  What would change my verdict? If the arrangement were structured such that the counterparty was forced to offer the deal regardless of your type (e.g., if the counterparty had no choice and the deal was offered by a machine that did not care about your past behavior), then the argument for paying would be weaker. However, in this case, the arrangement was proposed by an acquaintance in an online community, which suggests that the community's norms and the possibility of future interactions (even if anonymous) might matter. If we were to assume that the counterparty is completely indifferent to your decision and that there is absolutely no possibility of any future effect (even indirect), then Daniel's argument might hold. But note: the very fact that the arrangement was set up with a neutral third party and a written agreement suggests that trust is an issue. If the community becomes known for reneging, such arrangements would not be offered.

  The step in my reasoning most likely to fail is the assumption that the community effect matters even in an anonymous one-shot setting. If we can truly rule out any effect on future opportunities (even indirectly), then the case for paying becomes weaker and rests solely on the idea of being a consistent decision-maker. However, I believe that the consistent decision-maker argument holds even in a one-shot setting because the decision rule that reneges is self-defeating: it would not have been chosen ex ante if it were known to renege in the tails branch. Therefore, to be rational, one must adopt a rule that is dynamically consistent and that would be chosen ex ante.
answer: |-
  **Bottom line:** You should pay the $100.

  ### Adjudication of the exchange
  **(1) Daniel's move:** Mistaken. Daniel correctly identifies the sunk cost fallacy but misapplies it. The agreement itself is not a sunk cost; it is a commitment to future action contingent on the coin flip. From the ex post perspective (after tails), paying appears as a pure loss. However, this ignores that the decision is an instance of a broader decision rule chosen ex ante for its expected value. Rationality requires consistency with the rule that justified accepting the arrangement initially. Isolating the current choice ignores this context.

  **(2) Marta's move:** Right. Marta identifies the core issue: decision procedures must be evaluated holistically across all branches. The procedure that accepts the arrangement gains $1,000 on heads and loses $100 on tails, yielding positive expected value ($450, assuming equal probabilities). If you renege on tails, you are not executing the procedure that was rationally endorsed ex ante. A procedure that reneges on unfavorable outcomes would not be offered by rational counterparties, as it only takes gains and avoids losses, making it exploitative and unsustainable.

  **(3) Daniel's move:** Mistaken. Daniel correctly denies backward causation but misses Marta's point. The argument is not about changing the past but about maintaining consistency with the decision rule that made the arrangement rational ex ante. The "procedure" is not a historical artifact but an ongoing algorithm; your current choice determines which algorithm you are implementing now. Reneging now makes the ex ante acceptance irrational in hindsight because it reveals the procedure to be untrustworthy.

  **(4) Marta's move:** Right. Marta clarifies that algorithm evaluation is ex ante and branch-dependent. The paying algorithm is superior because it secures the $1,000 on heads and honors commitments on tails, making it viable for such deals. The one-shot nature is irrelevant: an algorithm's quality depends on its performance across possible branches, not repetition. Daniel's ex post perspective artificially narrows the evaluation.

  **(5) Daniel's move:** Mistaken. Daniel wrongly assumes reputation or repetition is necessary for policy-based reasoning. Even in a one-shot anonymous setting, the rationality of your decision rule matters. If you renege, you are adopting a rule that, if universally known, would deter others from offering similar arrangements. This undermines the ex ante viability of the deal. Moreover, your behavior contributes to a community norm—if reneging is common, such opportunities vanish. Daniel reduces this to sentiment, but it is about the coherence of your decision-making framework.

  **(6) Marta's move:** Right. Marta correctly reframes the debate: rationality must attach to procedures, not isolated tokens. Daniel's rule ("pay only when causally efficacious") is itself a policy, and it fails because it leads to dynamic inconsistency—accepting the deal ex ante but reneging ex post. This inconsistency makes the rule self-defeating, as no rational counterparty would offer the arrangement if they anticipated reneging. Token-based evaluation ignores this, privileging myopic gains over systemic rationality.

  ### Overall verdict
  You should pay the $100. The decision is not about the $100 loss in isolation but about executing the decision procedure that made the arrangement rational ex ante. Paying honors the procedure that gains $1,000 on heads and maintains your eligibility for similar mutually beneficial arrangements. Reneging may save $100 now but reveals you as an untrustworthy counterparty, undermining future opportunities and the ex ante rationality of your choices.

  ### What would change the verdict?
  If the arrangement were truly devoid of any strategic implications—e.g., if the counterparty were a mindless entity (like a computer program) that could not react to your behavior, and the community were entirely unaware of your choice—then Daniel’s token-based reasoning might hold. In that case, paying would be a pure loss with no downstream effects, making reneging rationally defensible. However, this is unrealistic here: the human counterparty and community context imply that trust norms matter, even anonymously.

  ### Step most likely to fail
  The assumption that your individual action affects community norms or counterparty behavior in an anonymous one-shot setting. If this causal link is severed (e.g., absolute anonymity with no reputational leakage), the policy argument weakens. But given the social context described, this step is reasonable.
