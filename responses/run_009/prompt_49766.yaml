prompt: |-
  I should declare some background before putting my question, as it will explain the odd angle of approach. I spent thirty-five years as an entomologist, specialising in the social biology of honeybees, and since retiring I have been working steadily through the metaphysics literature. Recently I encountered Peter van Inwagen's special composition question — roughly, the question of when some things compose a further thing — and I have begun to suspect that my own former profession has been quietly taking a position on it for over a century without ever announcing the fact. In my working life my colleagues and I moved without embarrassment between two ways of counting. When explaining division of labour, colony-level thermoregulation, or the fact that it is the colony, not the worker, that reproduces (a swarm founds a new colony), we spoke of the superorganism as a single living thing; when applying inclusive fitness theory, we counted the individual worker and asked how her behaviour propagated her genes. The same ambivalence runs through the rest of biology: mycologists happily treat a slime mould such as Physarum, a single cell with thousands of nuclei, as one organism, and botanists describe the aspen grove in Utah known as Pando as a single tree while ecologists count its stems; taxonomists give a lichen a species name even though it is a composite of a fungus and a photosynthetic partner, thus naming the partnership rather than either party. What I want to know is what these practices presuppose about composition, if anything.

  Please take the role of a professional metaphysician with a sound working knowledge of biology, and begin by brainstorming the main candidate answers to the special composition question — eliminativism or nihilism, van Inwagen's own criterion (roughly that some things compose a further thing when their joint activity constitutes a life), and the deflationary view that there is no further fact of the matter and our counting is bookkeeping — before committing to an answer. Then address the following. First, reconstruct the implicit theory of composition in the practices I have described: do they presuppose that composition is fixed by functional integration, by shared ancestry, by the level at which selection acts, or nothing at all? Second, tell me whether the two counting practices within a single discipline are consistent, or whether the superorganism talk and the gene's-eye talk quietly presuppose incompatible answers. Third, a question that particularly exercises me: van Inwagen's life-criterion was presumably meant to tell us when composition occurs, but in a superorganism the parts are themselves living things, so it seems the criterion must either license nested lives (a life made of lives) or deny that a colony is an organism; does his criterion actually adjudicate these cases, or does it leave them indeterminate? Finally, distinguish what the practices strictly presuppose from what they merely sit comfortably with — I suspect much of this is underdetermined — and say what would have to change in ordinary biological practice, in field guides or taxonomy say, if we adopted the deflationary view seriously. Please be precise and, where the literature leaves things open, say so rather than manufacturing certainty.
reasoning: |-
  Okay, let me approach this query methodically. The user is a retired entomologist with deep expertise in honeybee social biology who's now exploring metaphysics, specifically van Inwagen's Special Composition Question (SCQ). They've observed that biological practice seems to implicitly take positions on SCQ through its dual counting methods - sometimes treating superorganisms as single entities, sometimes focusing on individual components. Their core question is what this reveals about composition metaphysics.

  First, I need to map the main SCQ positions clearly: Nihilism (composition never happens), Universalism (always happens), Van Inwagen's Life Criterion (only for living things), and Deflationism (no objective fact). The biological examples - honeybee colonies, slime molds, Pando aspen, lichens - each test these differently. 

  The user's four sub-questions require layered analysis:
  1) On implicit theory: Biological practice seems most aligned with functional integration (vital activities) rather than strict shared ancestry or selection level, but it's opportunistic. Superorganism talk requires emergent functions like thermoregulation that aren't reducible to parts.

  2) On consistency: The dual counting isn't contradictory but perspectival. Gene-centric and superorganism views are complementary models for different explanatory goals. This avoids metaphysical conflict by being purpose-relative.

  3) On van Inwagen's criterion: His "life" definition explicitly excludes composites of living things (like bee colonies), calling them "non-living" aggregates. But biology treats them as functional wholes. So his criterion clashes with biological practice by being overly restrictive.

  4) On presuppositions vs comfort: Crucially, biology doesn't strictly presuppose any SCQ answer - it's operationally deflationist. Adopting deflationism wouldn't change field guides or taxonomy because these already use pragmatic, context-dependent classifications. 

  The tension points emerge clearly: Van Inwagen's theory can't accommodate superorganisms without modification, while biological flexibility suggests deflationism is the most compatible meta-position. I should emphasize where philosophy and biology diverge (van Inwagen vs superorganisms) and where they align (pragmatic pluralism resembling deflationism). The user's expertise allows technical depth, so precision on "life" as activity vs substance is key.
answer: |-
  Your background offers a profound lens through which to examine the Special Composition Question (SCQ). Let's break this down systematically, respecting both metaphysical rigor and biological practice.

  ### Core Candidate Answers to the SCQ
  1.  **Nihilism (Eliminativism):** No things ever compose a further thing. There are only fundamental particles (or simples). "Tables," "organisms," and "colonies" are just useful fictions for describing arrangements of simples.
  2.  **Universalism (Maximalism):** Any arbitrary collection of things composes a further thing. There exists a fusion for every set of objects (e.g., the object composed of your left shoe and the Eiffel Tower).
  3.  **Van Inwagen's Life Criterion (Moderate Restrictionism):** Some things compose a further thing *if and only if* their joint activity constitutes a *life*. For van Inwagen, only living organisms are composite objects. Artefacts, rocks, and colonies are mere "loose heaps" of simples.
  4.  **Deflationism / Pragmatism / Contextualism:** There is no single, mind-independent fact about when composition occurs. Our talk of "wholes" is a pragmatic, context-dependent way of speaking, reflecting our interests (explanatory goals, causal unity, etc.), not an objective metaphysical joint in reality.

  ### Reconstructing Biology's Implicit Theory of Composition
  Biology's practices reveal a **strongly functional-integrationist tendency**, heavily influenced by **explanatory context and causal dynamics**, sitting most comfortably within a **Deflationist/Pragmatist framework**, but often *talking as if* a robust functional criterion holds.

  *   **Functional Integration is Paramount:** The shift to "superorganism" or "single organism" talk consistently tracks *emergent, integrated, self-sustaining functions* crucial to persistence and reproduction at a specific level:
      *   **Honeybee Colony:** Colony-level thermoregulation, reproduction (swarming), nutrient flow (trophallaxis), defense.
      *   **Slime Mould (Physarum):** Coordinated movement, foraging, problem-solving (network optimization) despite being multinucleate.
      *   **Pando:** Shared root system enabling resource distribution and clonal regeneration.
      *   **Lichen:** Obligate mutualism creating a stable, persistent, functionally integrated unit capable of photosynthesis and survival in harsh environments that neither partner could manage alone.
  *   **Shared Ancestry is Often Correlated but Not Sufficient:** Pando's stems share a genome, bee workers are sisters, but shared ancestry alone doesn't trigger "one organism" talk. Function matters more (e.g., genetically identical coral polyps are typically counted individually unless tightly integrated). Lichens explicitly defy shared ancestry.
  *   **Level of Selection is a Consequence, Not a Criterion:** Biologists invoke the "superorganism" *because* selection acts powerfully at the colony level (e.g., colony fitness determining survival/reproduction). They don't define the unit *based on* selection acting; they identify selection acting *on* a functionally integrated unit. Inclusive fitness theory focuses on a *different functional unit* (the individual worker) for explaining *different phenomena* (the evolution of altruism).
  *   **Presupposing Nothing Metaphysically Deep:** Crucially, biology doesn't *presuppose* composition is objectively fixed. It *employs* counting conventions based on **operational utility for specific explanatory tasks**. The "further thing" is treated as real *relative to the model being used*. This is inherently deflationist/pragmatic.

  ### Consistency of Dual Counting Practices
  The practices **are consistent** *because they are perspectival and purpose-driven, not metaphysically committed*. They do *not* presuppose incompatible answers to SCQ; they demonstrate the *context-dependence* of "counting as one."

  *   **Superorganism Perspective:** Adopted when explaining colony-level physiology, reproduction, resilience, and evolution. The functional integration justifies treating the colony as a unit *for these purposes*. It tacitly says: "For explaining thermoregulation, counting the colony as one unit is the most efficient and accurate model."
  *   **Gene/Individual Worker Perspective:** Adopted when explaining the evolution of social behavior (kin selection, worker policing) or individual physiology/behavior. Here, the functional unit relevant to gene propagation (the individual worker, or the gene itself) is primary. It says: "For explaining why workers sacrifice reproduction, counting individual workers and their relatedness is the most efficient and accurate model."
  *   **No Metaphysical Conflict:** Biologists seamlessly switch because they are not claiming the colony *absolutely is* one simple object vs. many. They are applying different **conceptual lenses** to different **causal processes**. This is a strength, not a contradiction, reflecting the multi-level nature of biological reality. It aligns perfectly with deflationism: composition talk is "bookkeeping" relative to the explanatory task.

  ### Van Inwagen's Criterion and Nested Lives
  This is where van Inwagen's criterion **clearly clashes with biological practice** and struggles to adjudicate your cases.

  1.  **Van Inwagen's Explicit Stance (Material Being):** He defines a "life" as the activity of a *single*, highly self-contained, self-maintaining system. Crucially, he **explicitly denies** that composite entities made *of* living things (like colonies or ships) are themselves living organisms. They are mere aggregates. His "life" criterion applies only to paradigmatic multicellular organisms (like cats or trees), where the parts (cells) are not themselves living things *in the relevant sense* – they are dependent, non-autonomous parts of the larger life. A worker bee, for van Inwagen, *is* a living thing (composed of cells). A colony, being composed *of living things*, cannot itself be a living thing on his account.
  2.  **The Problem of Nested Lives:** Van Inwagen's criterion **cannot license nested lives** in the way biology requires for superorganisms. His life is monolithic. He would likely categorize:
      *   **Physarum:** *One* life (despite nuclei) – the nuclei are not autonomous living things.
      *   **Worker Bee:** *One* life.
      *   **Bee Colony:** *Not* one life/one organism. An aggregate of organisms. Swarming is not "reproduction" of an organism, just propagation of an aggregate.
      *   **Pando:** *One* life (if seen as one genetic individual with a connected root system).
      *   **Lichen:** *Not* one life/one organism. An aggregate of two distinct organisms in symbiosis.
  3.  **Indeterminacy?** His criterion *does* adjudicate: it **denies** colony/organism status to superorganisms and lichens. However, this adjudication **contradicts** the functional unity recognized by biologists. This highlights a limitation of his criterion from the biological perspective – it fails to capture the robust functional integration that justifies "one organism" talk in those cases. It leaves no room for multi-level functional integration involving autonomous parts.

  ### Presuppositions vs. Comfort & Impact of Deflationism

  *   **Strict Presuppositions:** Biology *presupposes* **causal complexity** and the **explanatory utility of identifying functional units at multiple scales**. It does *not* strictly presuppose any specific, objective, mind-independent criterion for composition (like functional integration *simpliciter*). The "further thing" talk is a powerful modeling tool.
  *   **Sits Comfortably With:**
      *   **Functional Integration:** As the primary *operational* trigger for counting-as-one.
      *   **Deflationism/Pragmatism:** As the best *metaphysical* interpretation of the practice. Biology is fundamentally about modeling causal processes, not carving reality at objective joints defined by composition.
      *   **Emergence:** The recognition that novel causal powers arise at higher levels of organization.
  *   **What Changes Under Serious Deflationism? Surprisingly Little in Practice.**
      *   **Field Guides/Taxonomy:** Would continue largely unchanged. Classifications (species, genera, colonies, clonal groves) are already pragmatic, based on morphology, genetics, ecology, and functional roles. Deflationism simply acknowledges that these groupings reflect our best models for understanding interactions and evolutionary history, not necessarily an absolute ontological category. "Pando: A clonal colony of *Populus tremuloides*, often referred to as a single organism due to its genetically identical stems and interconnected root system." This wording already hints at the pragmatic nature.
      *   **Key Shift:** A heightened awareness of the **explanatory context**. Biologists would be more explicit *why* they are counting a certain way in a given paper or discussion: "To understand nutrient cycling in this forest, we treat Pando as a single functional unit." vs. "To study stem mortality rates, we count individual stems." The focus shifts entirely to the causal model and its predictive/explanatory power, dropping any pretense that one count captures the "true" ontological status.
      *   **No Collapse into Nihilism:** Deflationism doesn't mean "nothing exists." Particles, cells, bees, colonies *all* exist as patterns or structures within the fundamental stuff. We count them based on their causal significance *to us* and *to each other* within specific processes. Biology already does this effectively.

  **Conclusion:** Biological practice, exemplified by your entomological experience, is a powerful case study for a **deflationist or pragmatic answer** to the SCQ. Composition talk is contextual, driven by functional integration and explanatory goals. Van Inwagen's life criterion is too restrictive to capture biology's recognition of functional wholes composed of autonomous living parts (superorganisms, lichens). The dual counting practices are consistent because they reflect different, complementary models for different causal questions, not a deep metaphysical inconsistency. Adopting deflationism seriously wouldn't overturn biological practice but would foster greater clarity about the pragmatic nature of "counting as one" and solidify biology's existing focus on causal models over absolute ontological categories. The literature (e.g., work by Helen Steward, Thomas Pradeu on immunology and boundaries, or Kim Sterelny on levels) increasingly supports this pragmatic, process-oriented view of biological individuality and composition, acknowledging its context-dependence.
