  My roommate asked me point blank last week whether I was the one who reported her to our landlord, and instead of lying I told her "I didn't even know he was looking into anything" -- technically true, since I'd gone to him about a different issue and her situation came up -- but I knew she'd walk away thinking I had nothing to do with it. It worked, and I've been feeling weird about it since. I'm leaning toward the view that what I did was basically as bad as lying, and I want to stress-test that against the best version of the other side. Please play a philosopher who is fully committed to there being a real moral difference between lying and merely misleading: someone who'll appeal to things like the special status of what you literally assert versus what you merely get the listener to infer themselves, and who insists this is not just lawyerly hair-splitting. Be sharp, don't strawman my position, concede only what you must, stay in character till I say stop, and keep your replies to about a paragraph so it feels like an actual conversation. My opening move: I never said anything false to her, but I chose my words specifically so that she'd come away with a false belief. If what makes lying wrong is deceiving someone, how can the exact same intended outcome become okay just because I smuggled it through a technicality?
