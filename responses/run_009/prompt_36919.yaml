prompt: |-
  I've assembled my views in decision theory case by case over the years, and I'd like an audit of whether they can all be held together. Here is the package: (1) Expected-utility maximization is the correct theory of ideal rationality, applying wherever an act's expectation is well-defined. (2) The St. Petersburg game — a fair coin is flipped until it lands heads, and if the first heads comes on flip n you are paid 2^n, so the expected value is infinite — should be played at any finite price. (3) The Pasadena game of Nover and Hájek — same coin flips, but the payoff for a first heads on flip n is (-2)^n/n, so the expectation series is the alternating harmonic series, which is only conditionally convergent — has no expected value; and more generally, whenever a gamble's expectation series fails to converge absolutely, the rational response is to decline to play at any price, including a price of zero or of being paid to play. (4) Rational choice must be invariant under how a gamble is described: permuting or relabeling the possible outcomes cannot change what it is rational to do. (5) What ultimately justifies the whole expected-value apparatus is the long run — across enough repetitions, the average payoff converges to the expectation, so maximizing expectation is just maximizing what you will actually end up with. Please go through these commitments and tell me which pairs are genuinely inconsistent, which only appear to be, and what the cheapest repair would be for each. Rank the tensions by severity rather than treating them uniformly, and say whether there is a single revision that would clean up the most.
reasoning: |-
  Okay, I need to analyze this user's decision theory package for consistency. The user presents five commitments: expected utility maximization as ideal rationality (1), accepting the St. Petersburg game at any finite price (2), rejecting the Pasadena game at any price due to non-absolute convergence (3), description invariance (4), and long-run justification via convergence (5). 

  First, I notice the most glaring conflict between (2) and (3). The user wants to accept St. Petersburg despite infinite expectation but reject Pasadena due to conditional convergence. Yet description invariance (4) suggests these should be treated similarly if structurally identical. That's a red flag - these positions seem incompatible at their core.

  The long-run justification (5) also creates problems. St. Petersburg's average payoff doesn't actually converge to infinity in repeated play, undermining (2). Meanwhile, Pasadena's averages do converge to ln2 in repeated play, contradicting the rejection in (3). So (5) conflicts with both (2) and (3) empirically.

  For repair options, I consider several paths. The user could abandon (5)'s naive long-run view and embrace more sophisticated convergence concepts like Cesàro summability. Or they could modify (3) to allow evaluation of conditionally convergent games using specified summation methods. The most radical fix would be rejecting expected utility altogether for unbounded utilities, but that might be too costly given their commitment to (1).

  Secondary tensions exist too. (1)'s claim that EU applies "wherever well-defined" clashes with (3)'s rejection of conditionally convergent games - since the expectation does exist mathematically in such cases. And (4) threatens to collapse the distinction between (2) and (3) entirely if we consider isomorphic descriptions.

  The severity ranking seems clear: the (2)-(3)-(4) triangle is the fundamental inconsistency, with (5) creating additional empirical problems. The cheapest repair might be refining how we define "well-defined expectation" in (1) to require absolute convergence, while adjusting (5) to accommodate different convergence modes. This preserves most of the original framework while resolving the core contradictions.
answer: |-
  Here's a systematic audit of your decision theory package, ranking the tensions by severity and outlining repair options:

  **Severity Ranking (High to Low):**

  1.  **Core Inconsistency: (2) + (3) vs. (4) + (The Principle Behind (5))**
      *   **Conflict:** (2) demands playing the St. Petersburg (SP) at any finite price due to its infinite expectation. (3) demands refusing the Pasadena (PG) at *any* price, including zero or negative (being paid), due to its non-absolute convergence. (4) insists that relabeling outcomes shouldn't change rationality. However, the PG and SP are **structurally isomorphic** under a simple relabeling of outcomes.
          *   Define outcome `n`: "First heads on flip `n`".
          *   SP Payoff: `2^n`
          *   PG Payoff: `(-2)^n / n`
          *   Now, relabel the outcomes: Swap the labels for outcome `k` and outcome `m` for some specific `k` and `m` (e.g., swap the label "first heads on flip 2" with "first heads on flip 3"). This is just a permutation of the outcome *labels*, not changing the physical events or probabilities.
          *   According to (4), this relabeling shouldn't change the rational choice.
          *   However, *after* relabeling, the payoff schedule looks completely different! The infinite series defining the expectation is now a *different permutation* of the original alternating harmonic series terms. The conditional convergence problem remains, but the specific payoffs attached to specific flip outcomes have changed.
          *   Crucially, (3) says you should refuse the *relabeled* game at any price just like the original PG. But (2) says you should play the *original* SP at any finite price. Yet, the only difference between the original PG and the relabeled PG is the arbitrary labeling of outcomes – the underlying physical process and probability distribution are identical. (4) forbids this difference in treatment based solely on labeling. Therefore, (2) and (3) prescribe incompatible actions for two games that (4) declares must be treated the same. This is a direct contradiction.
      *   **Severity:** **Highest**. This strikes at the heart of description invariance and the treatment of games with infinite or ill-defined expectations. It directly pits core commitments against each other.
      *   **Cheapest Repair:** **Revise (3).** Instead of "decline to play at any price", adopt a stance that conditionally convergent games *can* be evaluated, but require a specific, contextually justified *summation method* or *principal value* to define the expectation. The most common proposal is the **`n`-Expected Utility (`n`-EU)** principle: truncate the game after `n` flips, calculate the finite expectation `E_n`, and define the value as the limit of `E_n` as `n->∞`. For the PG, this limit exists (it's `ln(2)`). Commit to using this specific summation method for such games. This resolves the conflict with (4): relabeling outcomes doesn't change the limit of the partial sums `E_n`. It also partially addresses the conflict with (2) (see below) and makes (3) compatible with playing the PG for a sufficiently low price (e.g., paying less than `ln(2)`). *Cost:* Abandons the strict "no expected value / refuse at any price" stance for conditionally convergent games.

  2.  **Empirical Justification Conflict: (2) + (3) vs. (5)**
      *   **Conflict:** (5) justifies Expected Utility (EU) via the long-run convergence of average payoff to expectation. However:
          *   **St. Petersburg (2):** The average payoff of repeated SP games *does not converge* to infinity (or any finite value) with probability 1. It grows extremely slowly, logarithmically. A rational agent maximizing long-run average payoff would *not* pay arbitrarily high finite prices for a single SP game. This directly contradicts (2). The long-run justification fails for SP.
          *   **Pasadena (3):** The average payoff of repeated PG games *does converge* (with probability 1) to the limit of the partial expectations (`ln(2)`) via the `n`-EU method or the law of large numbers for dependent but converging-mean trials. According to (5), an agent should be willing to pay slightly less than `ln(2)` to play once, or accept being paid slightly more than `-ln(2)` to play, contradicting (3)'s "refuse at any price" including being paid.
      *   **Severity:** **High.** (5) is presented as the *fundamental justification* for (1), yet it demonstrably fails for the very examples used in (2) and (3). It undermines the core rationale.
      *   **Cheapest Repair:** **Revise (5).** Acknowledge that the "long-run convergence to expectation" justification is only reliable for gambles with *finite* expectations. For gambles with infinite or ill-defined expectations, other principles (like dominance, `n`-EU, or axioms justifying EU maximization directly) must take precedence. Embrace EU maximization based on axiomatic foundations (e.g., Savage) as primary, with the long run being a useful consequence for finite-expectation cases. *Cost:* Weakens the intuitive, empirical justification for EU, especially concerning (2). (2) must then be justified axiomatically, not by (5).

  3.  **Scope Conflict: (1) vs. (3)**
      *   **Conflict:** (1) states EU maximization applies "wherever an act's expectation is well-defined." The expectation of the Pasadena game *is* mathematically well-defined in the sense that the series `Σ [p_n * u(x_n)]` converges (conditionally) to `ln(2)`. (3) argues that rationality demands refusing it *because* the series isn't absolutely convergent, implying the expectation isn't "well-defined" *for decision purposes*. This creates tension in the definition of "well-defined."
      *   **Severity:** **Medium.** It's primarily a definitional issue within (1). (3) implies a stricter criterion for "well-defined" than simple convergence.
      *   **Cheapest Repair:** **Clarify/Revise (1).** Explicitly define "well-defined expectation" within (1) to require *absolute convergence* of the expectation series. "Expected-utility maximization is the correct theory of ideal rationality, applying wherever an act's expectation series converges absolutely." This directly incorporates the concern behind (3) into the scope of (1). (3) then becomes a corollary of the revised (1). *Cost:* Narrows the scope of (1), potentially excluding other convergence scenarios (though absolute convergence is the standard safe criterion).

  4.  **Secondary Tension: (2) vs. (Revised (1)/Repaired (3))**
      *   **Conflict:** If (1) is revised to require absolute convergence (Repair 3), then the SP game (with its *divergent* positive-term series) also lacks a "well-defined" expectation. This contradicts (2). Even if using the `n`-EU repair for (3), the SP's `n`-EU (`Σ_{k=1}^n (1/2^k)*2^k = Σ_{k=1}^n 1 = n`) diverges to infinity as `n->∞`, while the PG's converges to `ln(2)`. Why treat divergence to infinity differently than convergence to a finite number? Paying *any* finite price for SP guarantees a net loss if heads appears late enough (probability > 0), violating dominance arguments used elsewhere.
      *   **Severity:** **Medium/Low** (after repairing the higher conflicts). This highlights that the SP game is itself deeply problematic.
      *   **Cheapest Repair:** **Revise (2).** Retreat from "play at *any* finite price." Argue that while the expectation is infinite, no real agent *can* or *should* pay an arbitrarily high price. Propose a bounded utility function as the real solution (though this often contradicts the spirit of SP as a paradox of unbounded utility). Alternatively, embrace the `n`-EU framework: the SP's value is `∞`, but acknowledge that dominance arguments or pragmatic considerations (finite resources) limit what price is rational. *Cost:* Weakens the strong claim in (2).

  **The Single Most Effective Revision:**

  The **`n`-Expected Utility (`n`-EU) revision to (3)** is the single most effective repair. It directly resolves the most severe conflict (vs. (4)) by making the evaluation invariant under relabeling (as the limit of partial sums is invariant under rearrangement). It significantly alleviates the conflict with (5) by providing a well-defined value (`ln(2)`) to which the long-run average *does* converge. It clarifies the scope conflict with (1) by providing a principled way to define "expectation" for these games, suggesting a revision to (1)'s "well-defined" clause. While it creates tension with (2), that tension already exists implicitly and forces a more nuanced view of SP, potentially leading to a revision of (2).

  **Conclusion:**

  Your package contains significant tensions, primarily driven by the treatment of the St. Petersburg and Pasadena games and the principle of description invariance. The most severe inconsistency is between accepting SP, rejecting PG, and insisting description invariance holds. The `n`-EU approach offers the most targeted and effective repair, resolving the core contradiction while preserving the spirit of expected utility maximization and providing a path to reconcile the other tensions. Adopting it would require revising (3) and likely clarifying (1) and (2), and accepting that (5) is only a partial justification. Without this revision, the conflict between (2), (3), and (4) is insurmountable.
