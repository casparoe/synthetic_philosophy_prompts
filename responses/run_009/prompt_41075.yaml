prompt: |-
  My roommate and I have been arguing for weeks about when saying something actually *does* something, and I've basically been going case by case on gut feel, so I want to lay out my verdicts and see if there's an actual principle hiding in there. The wedding officiant who turns out to never have been licensed: I say the couple was never married, even though everything looked right and they lived as married for years. The celebrity "apology" drafted entirely by a PR team, posted while the celebrity feels zero remorse: I say that's still an apology -- it did the apologizing even if it didn't do the being-sorry. But a flat, sarcastic "well, sorrry" said to someone whose foot you just stepped on: not an apology at all, it's the opposite of one somehow. A promise extracted at knifepoint: doesn't bind, obviously. But a promise you only gave because the person badgered and cried and wore you down for an hour until you finally said "FINE, I promise": that one does bind, I feel like you'd be a jerk to break it. And a boss who slurs "you're firrred" drunk at the office party: not fired, no way. Yet an employee who drunk-texts their boss "I quit, effective immediately": I feel like that one kind of counts?? Which is embarassing because I can't say why the direction should matter.

  Also: I bet a friend twenty bucks the bus would be on time, he just rolled his eyes and said nothing, the bus was on time, and my verdict is no debt exists -- no bet happened without him taking it up. And someone smashing a bottle against a ship while saying "I name this ship the" whatever, but they're standing at the dock next to the wrong ship entirely: I genuinely can't decide if nothing happened, or if the wrong ship got named, or if the right ship got named by mistake. There's also the case where an actor performing in a play says "I do" -- not married, clearly, no one would think that. But here's the one that bugs me most: a couple who got legally married as a prank for a youtube video, full ceremony, both fully sober, giggling the whole time, and my verdict is that they really are married and would have to actually get divorced, even though everything about their intentions looks as hollow as the actors'.

  So that's the pile. Is there one principle -- maybe something about conditions for the act to come off, maybe about uptake from the other party, maybe about the role or authority of the speaker, maybe about sincerity -- that gets all or nearly all of these verdicts? Because the thing I keep noticing is that sincerity seems required in the sarcastic apology case, irrelevant in the PR apology case, and the drunken firing/quitting asymmetry seems like it can't be about sincerity at all. I'd want the principle stated carefully enough to tell me (a) which of my verdicts, if any, it just can't accommodate and why I should give those up rather than bolt on extra clauses, (b) what it predicts for the ship-naming mess, since that's the one I flip on constantly, and (c) whether the youtube-prank marriage comes out married on its own terms or only because of the legal paperwork -- i.e., whether the principle treats the ceremony and the license as doing the same job or different jobs. Also happy to hear if you think my verdicts sort into two different kinds of case that need two different principles, as long as you say where the split is and why that split isn't just me being inconsistent.
reasoning: |-
  Hmm, the user presents a fascinating set of linguistic and philosophical puzzles about performative utterances. They've described various scenarios where words purport to perform actions (marrying, apologizing, promising, firing, etc.), but with complications regarding sincerity, context, authority, or consent. Their core question is whether there's a unified principle that explains all their intuitive judgments about these cases.

  The user seems intellectually engaged and frustrated by their own inconsistencies - particularly bothered by the drunk-firing/drunk-quitting asymmetry and the ship-naming ambiguity. They're clearly looking for conceptual clarity, not just quick answers. The depth of their examples suggests they've thought about Austin's speech act theory before, though they haven't named it explicitly.

  Key observations from their cases:
  - Authority matters (unlicensed officiant invalidates marriage)
  - Sincerity matters variably (sarcastic vs PR apology differ)
  - Consent matters (knifepoint promise void, coerced promise binding)
  - Context overrides form (play-acting "I do" doesn't marry)
  - But they're conflicted about intention vs form (YouTube marriage prank)

  Their drunk-text-quitting case reveals an unstated bias toward speaker responsibility - they intuitively hold the employee accountable for quitting words but not the boss for firing words. That asymmetry needs addressing.

  The ship-naming case is genuinely tricky because it involves both referential failure (wrong object) and ceremonial context. Most theories would say nothing happened, but the user's hesitation suggests they sense the utterance had some illocutionary force that misfired directionally.

  For the YouTube marriage, they're torn between legal formalism (ceremony + license = marriage) and intentionalism (prank intention should void it). This exposes the core tension in speech act theory between conventional procedures and psychological states.

  I think Austin's framework actually resolves most of these quite neatly if we apply all three dimensions (felicity conditions, locutionary force, uptake) consistently. The major exception is their drunk-quitting intuition, which seems culturally influenced - many employment laws actually don't consider drunk resignations valid, contrary to their feeling.

  The ship case should clearly be "nothing named" on Austin's terms - the locution failed because the demonstrative act ("this ship") didn't connect to any object successfully. But I should acknowledge why this feels different than the officiant case: in ship-naming, the words technically succeeded as a naming act, but to the wrong entity due to speaker error.

  For the YouTube marriage, the law and speech act theory align perfectly - the conventional procedure was followed, so it's valid regardless of intention. Their discomfort comes from conflating illocutionary force (marriage performed) with perlocutionary effect (they didn't intend marital commitment). This distinction might be the key insight they're missing.
answer: |-
  Your intuitions are remarkably consistent! They map almost perfectly onto **J.L. Austin's theory of speech acts**, specifically the **"felicity conditions"** required for a performative utterance (saying *is* doing) to be successful ("felicitous"). Austin identified three main types of conditions that must be met:

  1.  **(A1) Conventional Procedure:** There must exist an accepted conventional procedure having a certain conventional effect, including the uttering of certain words by certain persons in certain circumstances.
  2.  **(A2) Correct Execution:** The particular persons and circumstances must be appropriate for the invocation of the particular procedure.
  3.  **(B) Complete Execution:** The procedure must be executed (a) correctly and (b) completely by all participants.
  4.  **(Γ1) Intention:** The persons participating must have the requisite thoughts, feelings, and intentions.
  5.  **(Γ2) Consequent Conduct:** The participants must actually conduct themselves subsequently in accordance with the procedure.

  Austin grouped A1, A2, and B as essential for the act to even *occur* (misfires if violated). Γ1 and Γ2 relate to sincerity and follow-through (abuses if violated; the act *happens* but is hollow or defective).

  **Your Verdicts Explained by Austin's Felicity Conditions:**

  1.  **Unlicensed Officiant:** **Verdict Correct (Not Married).** Violates **A1 & A2**. A conventional procedure (legal marriage) requires specific authorized persons (A2). An unlicensed person lacks the authority, so the procedure itself fails (A1/A2 misfire).
  2.  **PR Apology:** **Verdict Correct (Apology Happened).** Meets A1 (social procedure of apologizing), A2 (right person/situation), B (words uttered). Violates **Γ1 (Insincerity)**. It *is* an apology (the act occurred), but it's an *abuse* – hollow and defective due to lack of remorse. The *act of apologizing* is done, even if the *feeling* isn't there.
  3.  **Sarcastic "Well, Sorry":** **Verdict Correct (Not an Apology).** Violates **A1 & Intention (Γ1 fundamentally intertwined here).** The words *could* be part of a procedure, but the sarcastic tone and context signal the utterer is *not* invoking the sincere apology procedure. It's a different act entirely (mockery, dismissal). This is a misfire because the speaker doesn't *intend* to perform the conventional act (violating the spirit of A1/A2/Γ1).
  4.  **Promise at Knifepoint:** **Verdict Correct (Not Binding).** Violates **Γ1 & likely A2.** Promising requires a degree of voluntary commitment (Γ1). Coercion negates the necessary intention to undertake the obligation. The circumstances (knifepoint) are also inappropriate for the voluntary procedure (A2 misfire).
  5.  **Coerced Promise (Badgering):** **Verdict Correct (Binds).** Meets A1, A2, B. Violates **Γ1 (sincerity/wholeheartedness)**. You *did* promise (act performed), even if reluctantly. It's an *abuse* – you shouldn't have promised, and breaking it might be understandable, but the act itself *happened* and creates an obligation (though perhaps a weaker one morally). The key difference from knifepoint is the *degree* of coercion – badgering pressures but doesn't completely negate agency/intention like a knife does.
  6.  **Drunk Boss Firing:** **Verdict Correct (Not Fired).** Violates **A2 & Γ1.** The boss likely lacks the *capacity* (due to intoxication) to form the necessary intention (Γ1) or to execute the serious procedure appropriately (A2 – circumstances inappropriate). It's a misfire.
  7.  **Drunk Employee Quitting:** **Verdict Mostly Correct (Counts, but...)**. This is the *trickiest* for your intuition/Austin. It likely meets A1, A2, B. Violates Γ1 (capacity for intention). Why the asymmetry? **Responsibility & Risk:** Uttering "I quit" is an act *initiated by the speaker* that primarily affects *them*. We tend to hold individuals responsible for utterances they make, even impaired, especially when initiating self-affecting actions. The *procedure* (resigning) is simpler than firing (less authority check). However, legally/ethically, severe intoxication *could* invalidate it (Γ1 violation making it an abuse or potentially a misfire if capacity is utterly gone). Your intuition leans towards it counting because the *speaker* uttered the words initiating their own departure. Austin might see it as an abuse due to impaired Γ1.
  8.  **Silent Bus Bet:** **Verdict Correct (No Bet).** Violates **B.** The procedure (making a bet) requires *uptake* – mutual agreement. Rolling eyes/silence isn't acceptance (B misfire - incomplete execution). The other party didn't participate.
  9.  **Ship-Naming (Wrong Ship):** **Verdict: Nothing Named / Misfire.** Violates **A2.** The procedure requires naming *this specific ship* (demonstrated by the act of smashing the bottle against it). The circumstances (standing by the wrong ship) are inappropriate. The words "I name this ship..." refer to the ship the bottle is smashed against. Smashing it against Ship B while intending Ship A means the *conventional link* between the act (smashing) and the intended object (Ship A) is broken. It's a **misfire (A2)**. Ship B wasn't intended and the ceremony wasn't *for* it. Ship A didn't have the ceremony performed *on* it.
  10. **Actor Saying "I Do":** **Verdict Correct (Not Married).** Violates **A1 & A2.** There is no conventional procedure where saying "I do" in a fictional play constitutes marriage. The context (stage, script, audience) defines it as non-serious, non-binding performance. Clear A1/A2 misfire.
  11. **YouTube Prank Marriage:** **Verdict Correct (Legally Married).** Meets **A1, A2, B.** Violates **Γ1 (Intention)**. The conventional legal procedure (licensed officiant, correct paperwork, ceremony) was followed correctly (A1, A2, B). Their lack of sincere intention to be married is a **Γ1 abuse**. The *act* of marrying was performed felicitously at the conventional level. The hollowness is an abuse, not a misfire. They *are* married and need a divorce. The legal paperwork *is part of* the conventional procedure (A1).

  **The Unified Principle:**

  **An utterance successfully performs an action (e.g., marrying, apologizing, promising, firing, naming) only if:**
  1.  **Convention Exists:** There's a recognized social/legal procedure for doing that act via words.
  2.  **Authority & Context:** The speaker has the right status/authority, and the words are spoken in the correct context to invoke that procedure.
  3.  **Correct & Complete Form:** The conventional words/actions are uttered/performed correctly and completely, including any required uptake/agreement from others.
  4.  **Minimal Intent:** The speaker must minimally intend *to be performing that conventional act* (even if insincerely). This distinguishes sincere apologies from sarcasm, or genuine promises from play-acting.

  **Sincerity** (Γ1) determines if the act is *defective* (an abuse), not if it *happened*. **Capacity/Consent** impacts both authority/context (A2) and intention (Γ1). **Uptake** is part of the procedure's completeness (B).

  **Addressing Your Specific Queries:**

  1.  **Verdicts the Principle Can't Accommodate / Bolting On:**
      *   **Drunk Employee Quitting:** Your intuition ("kind of counts") is the outlier. The principle (emphasizing Γ1 - capacity for intention) suggests it *shouldn't* fully count, or is at least a severe abuse. You might need to slightly adjust this verdict or accept that the *speaker's initiation* creates a stronger presumption of responsibility, making it an abuse rather than a complete misfire. The principle doesn't need "bolting on," but highlights why this case feels ambiguous – it sits on the line between misfire (utter lack of capacity) and abuse (insincere/bad intention).
      *   **Coerced Promise (Badgering):** The principle clearly classifies it as an abuse (Γ1 violation), not a misfire. Your feeling that it "binds" aligns with the act *happening* (despite the abuse), creating an obligation. The principle accommodates this.

  2.  **Ship-Naming Prediction:** The principle **clearly predicts a misfire: nothing is named.** The procedure requires the physical act (bottle smash) to be performed *on the specific ship being named*. Doing it on the wrong ship violates the contextual requirement (A2) for correctly executing the procedure. The speaker's intention doesn't magically transfer the name; the conventional link is broken.

  3.  **YouTube Marriage Principle:** The principle treats **the ceremony (including the officiant's authority and the exchange of vows) *as* the core conventional procedure (A1, A2, B). The legal paperwork is an *integral part* of that conventional procedure in modern societies (A1).** The marriage happens *because* the conventional procedure (which includes the legal formalities) was correctly performed. The lack of intention (Γ1) makes it a defective (abused) marriage, but still a marriage. The principle doesn't separate "ceremony" and "license" as doing different *jobs*; the license is part of what makes the *ceremony* the conventional procedure for creating a legal marriage.

  **Why the Split Feels Inconsistent (But Isn't):**

  The apparent inconsistency you feel (e.g., sincerity mattering for sarcasm but not PR, drunk asymmetry) arises from conflating **whether the act *occurred*** (felicity conditions A1, A2, B) with **the *quality* or *defectiveness* of the act** (Γ1, Γ2). Austin's split between *misfires* (act didn't happen) and *abuses* (act happened but is hollow/bad) is crucial.

  *   **Misfires (Act Failed):** Unlicensed officiant, Sarcastic "sorry", Knifepoint promise, Silent bet, Wrong ship, Actor "I do", *maybe* Drunk boss firing. The core procedure wasn't properly invoked or executed.
  *   **Abuses (Act Happened, but Defective):** PR apology (insincere), Coerced promise (badgering - insincere/reluctant), *maybe* Drunk quitting (impaired intention), YouTube marriage (insincere). The act was performed conventionally, but the participants lacked the right thoughts/intentions or won't follow through.

  The "drunken asymmetry" feels odd because firing requires authority *and* intention, while quitting primarily requires intention *from the speaker*. We hold speakers responsible for utterances affecting themselves even with impaired intention (treating it as an abuse), while we don't hold authorities responsible for acts requiring judgment made while impaired (treating it as a misfire). This isn't inconsistency in the *principle*, but a reflection of different social expectations and risks inherent in the different acts.

  **Conclusion:**

  Your gut feelings brilliantly track Austin's distinction between **successfully invoking a conventional procedure** (which requires correct authority, context, and form, plus minimal intent *to perform the act*) versus **the sincerity and fulfillment** of that act. The core principle is **conventionality anchored by minimal intent**. Your verdicts hold up remarkably well under this framework, with only the drunk quitting case presenting a slight tension that highlights the nuanced role of speaker responsibility and capacity. The ship-naming is a clear misfire, and the YouTube marriage is a clear (though insincere) performance of the conventional act.
