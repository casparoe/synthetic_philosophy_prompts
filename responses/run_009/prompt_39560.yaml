answer: |-
  Here's a straight answer, grounded in principles of governance, fairness, and practicality:

  **The Core Principle:** **Voting rights are tied to membership in the governing body.** In a condominium association, that membership is defined by **ownership of the unit.** This is analogous to shareholders in a corporation. Owners bear the financial risk (property value, assessments, liability), have long-term interest in the building, and are legally bound by the bylaws they agreed to upon purchase. Renters, while significantly affected by day-to-day operations, are transient occupants whose contractual relationship is with their landlord, not the association. The super, while resident, is an employee whose compensation includes housing – his primary relationship is also employment, not membership.

  **Why "Affected = Vote" Doesn't Work as the Primary Principle:**
  1.  **Indefinable Scope:** "Significantly affected" is subjective and slippery. Renters are affected, but are *visitors* affected by noise rules? Is the *pizza delivery guy* affected by lobby access policies? Where do you draw the line?
  2.  **Lack of Skin in the Game:** Renters generally lack the long-term financial stake and legal liability owners carry. Their interests (e.g., low rent, flexibility) may conflict with owners' interests (e.g., property value, long-term maintenance). Owners ultimately pay for everything.
  3.  **Accountability Issues:** Renters aren't bound by the association's governing documents in the same way owners are. They can leave at lease-end; owners cannot easily escape the consequences of decisions.
  4.  **Precedent & Chaos:** Suspending bylaws for one vote sets a dangerous precedent. If "affected" parties get a vote on STRs, why not on pet policies, quiet hours, or major assessments that impact rent? It undermines the entire governance structure agreed upon by the owners.

  **Where Both Sides Are Half Right:**
  *   **"Taxation Without Representation" Owner:** **Half Right (Spirit):** Renters *are* profoundly impacted and deserve to have their concerns *heard and considered* by the decision-makers (owners). Their lived experience is invaluable data. **Half Wrong (Mechanism):** "Taxation" implies they pay association fees directly – they don't. Their rent *may* cover these costs, but the *legal obligation* resides with the owner. Voting rights aren't solely about impact; they're about legal membership and accountability.
  *   **"Owners Only" Owner:** **Half Right (Principle):** Voting rights *are* fundamentally tied to ownership membership and long-term liability. The structure exists for a reason. **Half Wrong (Dismissiveness):** Dismissing renter impact as irrelevant ("you can leave") ignores the practical reality that resident well-being *is* crucial to the building's health and owners' long-term interests (value, desirability). Happy, stable renters benefit owners.

  **The Super & Absentee Owner:**
  *   **Super:** Should **NOT** vote. He is an employee whose residence is part of his compensation package. His primary relationship to the association is as staff. While affected, his interests and obligations are tied to his employment, not ownership. His input as a resident and employee is valuable, but not through a vote.
  *   **Absentee Owner:** **SHOULD** vote. He *is* a member (owner) bearing financial liability and long-term consequences of association decisions (even while selling). His vote carries the same weight as any owner. Encouraging *all* owners to vote is key.

  **Practical Recommendation: DO NOT Suspend the Bylaws for Renters to Vote.**

  **Instead, Do This:**

  1.  **Stick to the Bylaws:** Hold the vote for owners only. This respects the agreed-upon governance structure and avoids setting a chaotic precedent.
  2.  **Aggressively Solicit Renter Input:**
      *   Hold a dedicated **open forum for renters** before the owner vote. Make it clear this is *their* platform to voice concerns, share experiences, and ask questions. Record it.
      *   Distribute an **anonymous survey** to all residents (owners *and* renters) specifically about STR impacts. Compile the data and share it with *all owners* before the vote.
      *   **Mandate Owner-Landlord Communication:** Encourage (or require via notice) owners who rent out their units to *actively solicit their tenant's views* and consider them when casting their vote. The owner is the tenant's representative in the association.
  3.  **Maximize Owner Participation:** Actively chase down *all* owners, especially the absentee one. Use email, phone, mail, proxy forms. Frame it as a critical decision impacting property value and community.
  4.  **Frame the Vote for Owners:** When presenting the issue to owners, **emphasize the real-world impacts documented from renters and long-term residents.** Argue that stable, happy residents (whether owners or long-term renters) contribute to property value and community desirability. Make the consequences of STRs (good or bad) tangible *to the owners' interests* (safety, noise, wear-and-tear, reputation, potential liability, impact on their ability to rent long-term, property value).

  **Why this is better than suspending bylaws:**
  *   **Upholds Governance:** Maintains the integrity of the association's rules.
  *   **Practical & Achievable:** Doesn't require a controversial bylaw suspension vote.
  *   **Gives Renters Voice:** Provides clear, structured channels for their crucial input.
  *   **Informs Owners:** Ensures owners make the final decision *with full knowledge* of the impacts on the community they govern and their investment.
  *   **Avoids Slippery Slope:** Prevents endless debates about who is "affected enough" for future votes.

  **The Work Analogy Solved:**
  The principle holds. Core team processes (like defining sprint rules, major architectural decisions) are voted on by **core, permanent team members** who are accountable for the long-term outcome and bound by the process. Contractors (like renters) are temporary, lack long-term accountability, and their contractual relationship is different. However, *good management* (like a good condo board) **actively seeks input** from contractors and new members because their perspective is valuable and impacts the team's effectiveness. They get a voice, not necessarily a binding vote on core governance.

  **Straight Answer:** Voting rights belong to owners. Renters deserve a strong, structured voice, but not a vote. Changing the rules mid-stream sets a bad precedent. Focus on forcing owners to make an *informed* decision by rigorously capturing and presenting the impacts on *all* residents. Push for renter input channels, not voting rights.
