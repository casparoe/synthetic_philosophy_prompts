  Next, the deflationary move. Calling satisficing constrained optimization doesn't resolve the dispute because it doesn't address who sets the constraints. The ecological camp views constraints as part of the environment, while coherence sees them as limitations to overcome. So it’s a superficial agreement masking deeper disagreement.

  Resource rationality (e.g., Lieder, Griffiths) formalizes heuristics as optimal under constraints, staying within the coherence framework. That's why Gigerenzer’s camp rejects it—it still treats unbounded rationality as the gold standard. 

