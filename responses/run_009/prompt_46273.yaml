  **Stone Bridge Mutual Assurance**  
  4th Market Street, Linzi, Qi Principality  
  Administrator of Contracts: Zi Lu  

  <date>  

  Master Bian He  
  The Jade Carver's Guild  
  West Mountain Road, Chu  

  **Subject: Denial of Claim # 玄鳥-78 (Policy # 鞍鞯-4512 – Equine Transit Coverage)**  

  Dear Master Bian,  

  We acknowledge receipt of your claim submission dated <date> concerning injuries sustained by your white horse ("Snow Jade") during transport from Zhao to Chu via hired cart. While we sympathize with any distress caused, after thorough review by our Contract Rectification Bureau, we must formally deny coverage under Policy # 鞍鞯-4512 ("Basic Equine Transit Assurance").  

  Our denial rests upon the precise ontological definitions enshrined within the policy and affirmed by established principles of logical rectification (正名 *zheng ming*). The policy explicitly indemnifies against loss or injury to "horses" (馬 *ma*) during covered transit. Crucially, your claim pertains specifically to a *white* horse (白馬 *bai ma*). As clarified through the venerable dialectics of the School of Names (名家 *Ming Jia*), "horse" denotes the essential form or shape (形 *xing*), while "white" denotes the specific color (色 *se*). What names the color is categorically not what names the form. Therefore, a "white horse" is not subsumed under the term "horse" for the purpose of contractual indemnification, as the latter refers only to the universal category of equine form, devoid of particular accidents like color.  

  Furthermore, the principle of disjunction (離 *li*) supports this determination. Had you contracted solely for the transport of a "horse," any horse – be it yellow, black, or bay – would have satisfied the contractual obligation. However, your specific request and associated premium schedule explicitly stipulated a *white* horse. The policy thus indemnifies the category "horse," not the specific instance "white horse" presented. The injury, while regrettable, affects the "white" designation inseparable from the particular instance you engaged, falling outside the universal covered under "horse."  

  Our adjudication finds precedent in established case law respecting categorical distinctions. Consider the precedent *Market Regulator v. Wheelwright Hui* (Case # 輪地-01), where the court affirmed Master Hui Shi’s dictum that "the wheel never touches the ground" (輪不蹍地 *lun bu nian di*), recognizing the categorical separation of the wheel's form and its momentary contact-points. Similarly, the principle that "fire is not hot" (火不熱 *huo bu re*) (*Hui Shi*, Case # 火熱-07) affirms the separation of the substance "fire" and the sensory quality "heat" experienced by an observer. Applying this principle of the separation of attributes (離堅白 *li jian bai*), we must distinguish the essential covered entity ("horse" as form) from its contingent qualities (color, whiteness). The injury pertains to the qualified particular ("white horse"), not the universal category ("horse") covered by the policy.  

  Consequently, the expenses incurred for Snow Jade's veterinary care are not recoverable under Policy # 鞍鞯-4512. We trust this clarification of our ontological and contractual framework is understood. Stone Bridge Mutual Assurance remains committed to providing robust coverage for clearly defined existents. Should you require future transit assurance, we invite you to consider our "Pointable Particulars Comprehensive Policy" (指物全保 *zhi wu quan bao*), designed to cover any discrete, nameable object you can definitively point to (指 *zhi*) at the inception of coverage, regardless of categorical complexities.  

  We appreciate your understanding and continued consideration of Stone Bridge Mutual Assurance for your risk mitigation needs.  

  Respectfully submitted,  

  **Zi Lu**  
  Administrator of Contracts  
  Stone Bridge Mutual Assurance  

  *Seal of Rectification & Indemnity*  

  ---

  **Word Count:** 448  
  **Key Elements Included:**  
  1.  **"White Horse is Not a Horse":** Core argument applied pedantically to deny coverage based on categorical distinction (form vs. color).  
  2.  **Disjunction Move:** Explicitly states any color horse would satisfy a request for "horse," but a *white* horse is a separate, uncovered request.  
  3.  **Separation of Hard and White (離堅白 *li jian bai*):** Invoked directly as a principle justifying the separation of the essential "horse" form from the contingent quality "whiteness."  
  4.  **Hui Shi Precedents:** "Fire is not hot" (火不熱 *huo bu re*) and "The wheel never touches the ground" (輪不蹍地 *lun bu nian di*) cited as analogous case law supporting categorical separation.  
  5.  **"Point At" Offer:** Closing invitation to future coverage for "Pointable Particulars" (指物 *zhi wu*), referencing Gongsun Long's epistemology.  
  6.  **Deadpan Corporate Tone:** Maintains a formal, bureaucratic customer relations register throughout, treating the sophistry as standard policy application.
