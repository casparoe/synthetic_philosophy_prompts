prompt: |-
  I'm on the steering committee of a mid-sized AI evaluation org. Right now we put out a per-model "safety report": a dozen proxy benchmarks (refusal rates on harmful queries, sycophancy probes, jailbreak robustness, etc.), each with its own threshold. Our biggest funder wants us to collapse all of that into a single pass/fail "safety index" that downstream companies can gate deployment on, and a vendor has pitched exactly that — a weighted composite calibrated on our historical data, which they'd keep updating as new model scores come in. Half the committee loves it (one number, decisions actually get made), half thinks any single index is doomed to get Goodharted the moment companies start optimizing against it. Draft the memo I'll circulate before Friday: recommend adopt, reject, or adopt with conditions.

  Two things I want the memo to actually do. First, engage with the fact that not all Goodhart-ing is the same thing — selecting on a noisy composite, a proxy breaking when you push to the extreme of the distribution, and strategic gaming are different failure modes that need different fixes (and some fixes, like keeping component weights secret or rotating the benchmark suite, have real costs of their own). Second, deal honestly with the strongest point on the single-index side: our current per-benchmark thresholds already get gamed piecemeal, so "no composite" isn't a no-Goodhart option either.

  After the memo, give me a JSON summary with this schema:

  {
    "recommendation": "adopt" | "reject" | "adopt_with_conditions",
    "dominant_failure_modes": [strings naming which variants of Goodhart's law drove the decision],
    "conditions": [strings, empty if none],
    "strongest_loosing_side_point": string,
    "review_trigger": string describing an observable that would force us to revisit this decision
  }
reasoning: |-
  We are recommending "adopt_with_conditions". The memo will argue that while a single index has clear advantages for decision-making, it also carries risks of Goodharting. However, the current system is already being gamed on a per-benchmark basis, so the status quo is not a safe alternative. We propose adopting the composite index but with conditions to mitigate specific Goodhart failure modes.

  The memo will break down Goodharting into:
  1. Noise in the composite (when the composite is a noisy measure of the true objective, leading to overfitting to noise).
  2. Proxy breakdown under extreme optimization (when pushing the composite to extremes causes the proxy to diverge from the intended goal).
  3. Strategic gaming (when actors exploit the specific construction of the composite).

  We'll propose conditions that address each:
  - To combat noise: Require regular re-calibration and validation against real-world outcomes.
  - To combat proxy breakdown: Build in periodic stress-testing at the extremes and have a mechanism to adjust the index.
  - To combat strategic gaming: Rotate a subset of the underlying benchmarks periodically and keep the weighting scheme confidential (but with the cost of reduced transparency).

  We acknowledge the strongest point from the single-index side: that the current system is already being gamed piecemeal, so a composite doesn't introduce a new problem but may centralize it.

  The review trigger will be if we observe a significant divergence between the index and real-world safety incidents (e.g., a model passes the index but causes a safety incident in deployment, or vice versa) beyond a threshold we set.

  Now, the memo draft:

  ---

  **MEMORANDUM**

  **To:** Steering Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Single Safety Index Proposal  

  ### Introduction
  This memo addresses our funder's request to collapse our current multi-benchmark safety report into a single pass/fail "safety index" and the vendor proposal to develop such an index. The vendor offers a weighted composite of our existing benchmarks, calibrated on historical data, with ongoing updates. The committee is split: half see the index as a way to drive clear decisions, while half fear it will fall prey to Goodhart's Law (where a measure becomes a target, it ceases to be a good measure). This memo recommends adopting the index with specific conditions to mitigate risks.

  ### The Goodhart Challenge: Nuanced View
  Goodharting is not monolithic. We identify three distinct failure modes:

  1. **Noisy Composite**: The index is a statistical construct subject to sampling error. Optimizing for it may overfit to noise in the training data, reducing out-of-sample validity.  
  2. **Proxy Breakdown**: As models are pushed to extreme scores on the composite, the relationship between the index and real-world safety may break down (e.g., models that "overfit" to the test).  
  3. **Strategic Gaming**: Developers may reverse-engineer and exploit the index's construction (e.g., focusing on known benchmarks while ignoring correlated safety aspects).  

  Our current approach is not immune to Goodharting either. Developers already game individual benchmarks (e.g., tuning refusal rates on known harmful queries), leading to fragmented optimization. A composite index centralizes this risk but does not create it anew.

  ### Why a Single Index Has Merit
  The strongest argument for the index is pragmatic: our current system of a dozen thresholds is already being optimized piecemeal, and the lack of a clear pass/fail signal hampers deployment decisions. A composite index could:
  - Simplify decision-making for downstream adopters.
  - Encourage holistic safety improvements (if weights reflect true priorities).
  - Be dynamically updated to incorporate new data, making it adaptive.

  ### Recommendation: Adopt with Conditions
  We recommend moving forward with the vendor's proposal, but under the following conditions to address each failure mode:

  1. **Mitigate Noise**: 
     - The index must be re-calibrated quarterly using the latest model evaluations and real-world incident data (if available). 
     - Validation against external safety metrics (e.g., red teaming results, user feedback) will be mandatory.

  2. **Prevent Proxy Breakdown**: 
     - The vendor must implement "stress tests" by evaluating models at the extremes of the index (e.g., top 5% of scores) to detect divergence from true safety. 
     - An annual review of the index's correlation with real-world outcomes will be conducted. If correlation drops below 0.8, we trigger a re-design.

  3. **Combat Strategic Gaming**: 
     - A subset (e.g., 20%) of the underlying benchmarks will be rotated every six months. The vendor will develop a pool of benchmarks to draw from. 
     - The weighting scheme will be kept confidential (except to the committee and auditor) to slow reverse-engineering. We acknowledge this reduces transparency but is a necessary trade-off.

  Additionally, we require:
  - **Transparency to the Committee**: Full disclosure of the methodology and weights to the steering committee and an independent auditor.
  - **Fallback Mechanism**: If the index fails (e.g., widespread gaming is detected), we revert to publishing full benchmark results until the index is fixed.

  ### Addressing the Counterarguments
  We acknowledge the concern that a composite index might oversimplify safety. However, the status quo is already oversimplified into a dozen binary gates, each of which is gameable. The index, with the above safeguards, offers a more holistic and updatable measure. The strongest point from the opposition — that any index will be gamed — is valid, but we believe our conditions turn this into a manageable risk.

  ### Conclusion
  The single index is a step toward practical safety governance. By adopting it with conditions, we balance clarity against robustness. We must remain vigilant, but the alternative — sticking with a system we know is being gamed — is not tenable.

  ---

