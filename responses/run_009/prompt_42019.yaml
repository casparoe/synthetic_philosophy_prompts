prompt: |-
  Been reading the rationality-sphere since the old Overcoming Bias days, and one slogan from the sequences has always bugged me without me being able to say exactly why: rationalists should win. People around here wheel it out for everything. Latest was a thread on Parfit's hitchhiker where someone argued the best move is to genuinely self-modify into someone who can't make himself pay the driver back, because that's the agent who gets a ride out of the desert, so per the slogan that disposition is what rationality IS. Someone else shot back that by this logic you should gouge out your own eyes to win bets about whether you can see, and that the slogan just means something like "rationality is systematically achieving your values" and cuts no ice in this dispute either way.

  So help me precisify. What are the distinct precise claims packed into that one line -- is it a definition of rationality, a claim about winning in the actual world vs winning in expectation, a claim about acts vs agents vs dispositions, one-shot vs policy-level evaluation? For each reading, say whether its plausible, whether its trivially true, and whether it actually settles the hitchhiker argument or the eye-gouging counterargument. Basically I want to know if the slogan is doing real work in these debates or if its just a vibes-statement we all nod along to. Lay it out as a list with verdicts.
