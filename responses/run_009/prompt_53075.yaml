answer: |-
  ### The Mapping
  The "situation" encompasses: (1) **Role assignment** (ground infantry vs. aircrew observer); (2) **Proximity to authority** (ground troops under direct command of Calley/officers, aircrew physically separated but monitored by radio); (3) **Group size/face-to-face contact** (ground troops in cohesive platoons fostering conformity, aircrew isolated in a small 3-man team); (4) **Physical vantage** (aircrew’s aerial view providing detachment and visibility of atrocities, ground troops immersed in chaotic close-quarters).  
  **Comparison class (a):** The ground company (~100 soldiers) under near-identical situational pressures—same orders, chain of command, immersion in violence. Responses ranged from active killing (Calley et al.) to passive refusal (e.g., soldiers declining direct orders to shoot, but not intervening).  
  **Comparison class (b):** Thompson’s aircrew, in a distinct situation (aerial, mobile, observer role with radio access to superiors). Escorting gunships initially uninvolved but later cooperated under Thompson’s persuasion, highlighting situational malleability. This commits analysis to explaining variance *within* and *across* these groups using situational factors and character traits.  

  ---

  ### What Situationism Explains  
  Situationism effectively explains the **prevalence of compliance** in the ground company. Milgram’s obedience paradigm elucidates why many soldiers fired: proximity to authority (Calley directing killings), institutional role (following "search and destroy" orders), and gradual escalation (starting with "routine" clearing). Darley-Batson’s bystander effect accounts for inaction among non-killers; diffusion of responsibility in a large group, ambiguity (chaos masking individual agency), and task focus (mission objective overrode moral cues). The gunships’ initial non-intervention aligns with this—they were assigned a *different role* (close air support, not observation) until Thompson redefined the situation. Situationism also explains why Thompson’s crew *could* act: their aerial role granted **physical and psychological distance** from the group, reducing conformity pressures and deindividuation. The observer role made them witnesses, not perpetrators, triggering moral awareness.  

  ---

  ### What Virtue Ethics Explains  
  Virtue ethics best explains **Thompson’s exceptional intervention** and its persistence. His actions reflect cultivated virtues: *courage* (confronting Calley, shielding villagers), *justice* (demanding accountability), and *compassion* (marking wounded, rescuing civilians). Crucially, virtue ethics accounts for his **consistency across time and pressure**: he protested via radio, landed twice to intervene, secured evacuation, reported up the chain, testified in 1970, and endured decades of ostracism—suggesting deep-seated character. It also explains variance *within* the ground company: soldiers who refused orders (but didn’t intervene) possessed virtues like *integrity* (resisting evil), though lacking Thompson’s *practical wisdom* to navigate systemic failure. The crew’s coordination supports virtue ethics: Thompson’s explicit demand for loyalty ("fire on Americans if needed") scaffolded *collective courage*, transforming individual virtue into shared action. Andreotta’s independent rescue of the child further reflects character.  

  ---

  ### What Neither Explains  
  **1. Unit of Analysis:** Neither theory adequately addresses the **crew-as-moral-agent**. Thompson’s order bound Colburn/Andreotta into a joint commitment ("scaffolding" action), making character less individualistic than virtue ethics assumes. Situationism ignores how roles *within* a situation (pilot vs. crew chief) enable collective agency.  
  **2. Within-Situation Variance:** The ground company’s spectrum (killers/refusers/passive) challenges situationism, which predicts uniform pressure toward conformity. Virtue ethics struggles to explain why *only* Thompson physically intervened when others shared virtues (e.g., refusal soldiers).  
  **3. Temporal Arc:** Thompson’s 30-year testimony under threat defies situationism’s focus on momentary pressures. Virtue ethics recognizes constancy but cannot model how *ostracism* interacts with character—why some persevere (Thompson) and others recant (unmentioned witnesses).  
  **Silences:** Neither explains why the gunships cooperated *only after persuasion* (situationism ignores moral dialogue; virtue ethics over-predicts intervention). Neither accounts for the cover-up’s success (organizational vice? systemic blindness?).  

  ---

  ### Verdict  
  The episode **anomalizes situationism** while **pressuring virtue ethics**. Situationism explains broad compliance but fails to predict variance *within* the ground situation (killers vs. refusers) and over-predicts conformity in the aircrew. Thompson’s actions—enabled by situational factors (aerial view, role)—transcend situational pressure, exposing the critique’s limits in accounting for *resistance*. Virtue ethics better explains Thompson’s consistency but struggles with the crew’s collective agency and the refusers’ inaction. Crucially, the episode lies **outside** situationism’s experimental paradigm: real-world "situations" are fluid (roles redefine, e.g., gunships) and morally heterogeneous. The vignette’s "pre-sorted" heroism weakens empirical rigor—situationists would note we rarely study "virtuous" outliers systematically—but it forces confrontation with *counterfactuals* (e.g., "Would Thompson have acted as infantry?").  

  ---

  ### Fragility  
  The **weakest point** is explaining within-situation variance among ground troops. If evidence showed refusal correlated with *pre-existing traits* (e.g., upbringing, prior moral commitments), virtue ethics gains; if refusal stemmed from *minor situational differences* (e.g., less direct orders, subgroup dynamics), situationism recovers. Similarly, if Thompson’s intervention was **impulsive** (not characterological), or if other aircrews in identical roles **failed to act**, situationism strengthens. The analysis hinges on accepting Thompson’s consistency as "character" despite no access to his psychology—if new evidence revealed external pressures (e.g., radio orders to intervene), the verdict reverses.  

  ---  
