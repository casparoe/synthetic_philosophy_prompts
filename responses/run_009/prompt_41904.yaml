prompt: |-
  i write longform features for a science & ideas magazine, and a decent chunk of my beat is history of science — profiles of dead figures, anniversary pieces, "what we got wrong back then" stuff. i keep getting it from both sides: either i'm judging people in 1910 by 2025 standards (readers call this presentism, loudly) or i'm so busy contextualsing that the piece reads as an apologia. i gather the philosophy of history actually has things to say here — something about the difference between explaining a belief and excusing it, whether moral judgements across centuries can be true or false at all versus just expressing my attitude, and the historian's trick of judging people by the standards already available in their own time, which apparently lets you condemn without anachronism when it works. please turn whatever is solid in all that into a procedure i can run on my own drafts before filing: the questions to ask in order, what counts as a sufficient answer to each, where it comes back "fine, publish" versus "rewrite this paragraph", and where it has to admit the question is a values call no checklist can settle. then run it on two drafts: a piece on the well-respected biologists who lent credibility to the early 20th-century eugenics movement, and one on a victorian naturalist whose racial views were ugly even by victorian standards — which i suspect matters, but my editor keeps saying just leave it out. also tell me where the procedure will misfire, i'd rather hear it from you than the letters page. answer in british english, and keep it usable by someone who studied molecular biology, not wittgenstein
reasoning: |-
  Okay, the user is a science journalist who writes long-form features on the history of science. They're struggling with balancing presentism and contextualization. Readers accuse them of either judging historical figures by modern standards or excusing bad behavior by over-contextualizing. They want a practical procedure to apply to their drafts before submission.

  First, I need to recall the philosophical concepts they mentioned. Presentism is judging the past by today's values. The user wants to avoid that but also doesn't want to sound like they're making excuses. The key is distinguishing between explaining and excusing. Also, using contemporaneous standards to judge historical figures allows criticism without anachronism.

  The user mentioned two specific pieces: one on early 20th-century biologists supporting eugenics and another on a Victorian naturalist with extreme racial views. They need the procedure applied to these cases. Also, their editor wants to omit the Victorian's views, but the user thinks it's important. The procedure should help decide when to include such details.

  They studied molecular biology, so the explanation should avoid heavy philosophy jargon. Use clear, practical steps. British English is requested, so adjust spelling and terms accordingly.

  The procedure needs to be a checklist with questions in order. Each question should have clear pass/fail criteria leading to "publish," "rewrite," or "values call." Also, point out where the procedure might misfire.

  Start structuring the questions. First, establish the historical context. What were the prevailing standards? Then, assess the individual's actions against those standards. Differentiate between explaining beliefs (context) and excusing them (justification). Then, check if the piece implies moral judgments and if they're based on contemporaneous standards.

  For the eugenics piece: Eugenicists were mainstream then. But even within their time, some contemporaries criticized them. Pointing that out avoids presentism. The procedure should highlight if the biologist ignored available criticism.

  For the Victorian naturalist: Even by Victorian standards, his views were extreme. The procedure should flag if the piece omits this, as per the editor's suggestion. Including contemporaneous criticisms shows it's not presentism to condemn him.

  Misfires: When contemporaneous standards are unclear, or when there's no consensus. Also, if the historical figure's actions had long-term consequences, the procedure might not address how to discuss that without presentism. Need to mention that some moral issues might transcend time, like basic harms, but that's a values call.

  Ensure the steps are sequential. After context and individual assessment, check moral judgments. Then verify if distinctions between explanation and excuse are clear. Finally, review for anachronistic language.

  For the Victorian case, if the editor says leave it out, but the procedure shows his views were extreme even then, including it is valid. The checklist should help push back against editorial pressure when justified.

  Practical outputs: A numbered checklist with questions, what to look for, and outcomes. Then apply to both examples. Finally, list potential misfires.
answer: |-
  Right, let's ditch the seminar room and build you a workshop tool. This procedure tackles the core tension: **explaining historical beliefs/actions ≠ excusing them, while allowing for legitimate criticism grounded *in their own time*.** It's based on the historian's maxim: *Judge them by the standards available to them, not by ours.*

  **The "Presentism Patrol" Procedure (For Your Drafts)**

  Run this *after* your main edit, paragraph by paragraph where historical actors, their views, or actions are discussed, *especially* when touching on morally/socially problematic content.

  1.  **"What Was On The Shelf?" (Contemporaneous Standards Check)**
      *   **Question:** What were the *actual, available* scientific, ethical, social, and political norms/standards relevant to this person's views/actions *at that specific time and place*? What credible alternatives existed?
      *   **What Counts:** Evidence from period sources (scientific papers, letters, popular media, laws, sermons, critiques from contemporaries). Not just the *dominant* view, but the *range* of respectable (or at least articulated) opinion.
      *   **Sufficient Answer:** A clear, concise statement of the relevant landscape. E.g., "While biological determinism was widely accepted, critiques of its harshest social applications were already being published in journals X and Y by figures like Z," or "Public discourse on race was overwhelmingly hierarchical, though abolitionist movements had established critiques of biological racism decades prior."
      *   **Outcome:**
          *   **Fine:** Landscape is accurately sketched using period evidence.
          *   **Rewrite:** Landscape is vague, relies on modern assumptions, or ignores significant contemporary counter-arguments/criticisms. *Action: Add specific period references.*
          *   **Values Call:** If the "available standards" themselves are horrifying (e.g., widespread acceptance of chattel slavery). The procedure flags this – proceed, but handle with extreme care in step 4.

  2.  **"Where Did They Shop?" (Individual Positioning Check)**
      *   **Question:** Where did *this specific individual* position themselves within that landscape of available standards and alternatives? Were they mainstream, avant-garde, reactionary, or an outlier? Did they actively ignore, engage with, or reject credible counter-arguments *available to them*?
      *   **What Counts:** Evidence specific to the individual: their writings, actions, affiliations, responses to criticism, intellectual influences they acknowledged/rejected.
      *   **Sufficient Answer:** A specific placement relative to Step 1's landscape. E.g., "While determinism was common, Smith actively promoted the most extreme polygenetic theories, dismissing mounting anatomical evidence against them," or "Jones adopted mainstream eugenic views but privately expressed unease about forced sterilisation laws gaining traction."
      *   **Outcome:**
          *   **Fine:** Clear placement based on evidence. Shows if they were conforming, pushing boundaries, or regressing *relative to their time*.
          *   **Rewrite:** Vague ("held common views") or implies they had no choice/alternative without evidence. *Action: Specify their stance using evidence.*
          *   **Values Call:** Assessing *why* they held a view (psychology, personal gain) is often speculative. Stick to observable positioning and engagement with ideas.

  3.  **"Am I Explaining or Buffing?" (Explanation/Excuse Distinction Check)**
      *   **Question:** Does my language *explain* the belief/action within its context, or does it subtly (or overtly) *justify*, *minimise*, or *absolve* it? Am I using context to make their choices seem inevitable or reasonable *to the modern reader*?
      *   **What Counts:** Watch for language like "understandable given...", "of course they thought...", "it made sense at the time...", passive voice ("mistakes were made"), or failing to note harmful consequences *even by contemporary standards* (if established in Step 1/2).
      *   **Sufficient Answer:** Clear explanatory language ("Influenced by X and Y theories dominant in Z circles, Smith advocated...") coupled with acknowledgment of impact/harm if relevant (see Step 4). Avoids implying moral acceptability *to us*.
      *   **Outcome:**
          *   **Fine:** Explanation is clear, context is provided, no minimising language.
          *   **Rewrite:** Language leans towards justification/apologia, or implies inevitability. *Action: Recast sentences to focus on causation over justification. Replace minimising words.*
          *   **Values Call:** None. This is craft. If it reads like an excuse, rewrite it.

  4.  **"Does the Condemnation Fit the (Historical) Crime?" (Contemporaneous Moral Judgment Check - *If Making Judgment*)**
      *   **Question:** *If* I am making a critical moral judgment about this person's view/action, is it primarily based on standards *they could have reasonably been expected to know or engage with*? Am I highlighting how they failed *by their own society's lights* or violated *wider, enduring ethical principles* (e.g., causing unnecessary harm, hypocrisy) in a way demonstrable with historical evidence?
      *   **What Counts:** Evidence that their actions/views were considered harmful, unethical, unscientific, or extreme *by credible contemporaries*, or evidence they caused clear, foreseeable harm violating basic ethical principles *recognisable then* (e.g., deceit, cruelty, ignoring evidence they knew). Avoids terms solely defined by modern frameworks ("racist" can be tricky – be specific about *what they said/did* and *why it was objectionable then*).
      *   **Sufficient Answer:** Criticism is anchored in specific contemporaneous critiques, evidence of harm acknowledged at the time, or demonstration of hypocrisy/ignoring *known* evidence. E.g., "Smith's advocacy for Policy X ignored the critiques of disability groups *already being published*, and his own data showed Y, which he dismissed without evidence," or "Jones's actions towards Group Z were condemned as cruel even by contemporary colonial administrators like A."
      *   **Outcome:**
          *   **Fine:** Criticism is historically grounded and evidenced.
          *   **Rewrite:** Criticism relies solely on modern sensibilities without historical anchor ("We now see this as abhorrent..."). *Action: Either root the criticism in contemporaneous standards/evidence or remove the explicit judgment and let the facts + context speak.*
          *   **Values Call:** Whether *to make* an explicit judgment at all (vs. implicit via facts). Also, defining "basic ethical principles recognisable then" (e.g., prohibitions against murder, deceit) – but focus on *demonstrable harm/contradiction* they could foresee. **This is often the core tension.**

  5.  **"Is the Ghost of 2025 in the Room?" (Anachronism & Framing Final Check)**
      *   **Question:** Does my language or framing subtly impose modern concepts, priorities, or values onto the past? Have I used terms with modern baggage without qualification? Does the *overall* piece imply a simplistic narrative of progress ("we know better now")?
      *   **What Counts:** Using modern terms (e.g., "genocide," "sexual harassment," "IQ test" without context) as if they meant the same then. Framing everything as a stepping stone to modern truth. Implying historical actors *should* have had modern insights.
      *   **Sufficient Answer:** Modern terms are carefully introduced and contextualised ("concepts we might now term..."). The piece acknowledges past complexity without implying inevitable progress. Focuses on understanding the past *on its own terms* as the primary goal.
      *   **Outcome:**
          *   **Fine:** Language is precise to the period; framing is about understanding, not retroactive grading.
          *   **Rewrite:** Anachronistic terms or framing detected. *Action: Replace terms with period language or add context; reframe narrative.*
          *   **Values Call:** None. This is avoiding sloppy language/framing.

  **"Fine, Publish" Outcome:** You sail through Steps 1-3 with "Fine", and for Step 4, either your criticism is historically grounded ("Fine") OR you've chosen not to make explicit moral judgments and let context/facts speak. Step 5 is clean.

  **"Rewrite" Outcome:** Any step flags "Rewrite" – address the specific issue identified.

  **"Values Call" Outcome:** Primarily arises in Step 4 (whether/how to judge) and when defining the edges of "available standards" (Step 1) or "enduring principles" (Step 4). Here, the procedure *flags* the decision point but doesn't dictate the answer. You must make a conscious, defensible choice based on your evidence and narrative purpose.

  ---

  **Running the Procedure on Your Drafts**

  1.  **The Eugenicist Biologists (Early 20th C):**
      *   **Step 1:** What was on the shelf? *Pass.* Mainstream acceptance of hereditarianism, belief in improving populations, but also growing critiques (scientific: Boas' anthropology, statistical critiques; ethical: civil liberties objections, disability advocates). Alternatives existed.
      *   **Step 2:** Where did they shop? *Needs Check.* Were they *mainstream* eugenicists (common) or *extremists* pushing compulsory measures against existing critiques? Did they ignore counter-evidence? **Rewrite Trigger:** If portrayed as mere "men of their time" without specifying their position relative to *available critiques* they dismissed. *Action: Add sentence(s) on their engagement (or lack thereof) with contemporary counter-arguments.*
      *   **Step 3:** Explaining or Buffing? *Vulnerable.* Easy to slip into "it was mainstream science" as justification. *Action: Ensure language explains influence ("motivated by widely-held fears of degeneration...") without implying justification.*
      *   **Step 4:** Contemporaneous Judgment? *Strong Opportunity.* *Pass (if done right).* You *can* legitimately condemn (if evidence shows) them for ignoring scientific critiques they knew about, misusing statistics, or supporting policies deemed unethical *by credible contemporaries* (e.g., linking them to specific policies opposed by civil liberties groups of the era). Avoid just saying "eugenics is bad (now)".
      *   **Step 5:** Anachronism? *Risk:* Calling it "pseudo-science" outright (some methods were standard then, even if conclusions were wrong/fraught). *Action: Use "flawed science," "scientifically questionable," or explain *why* conclusions were wrong *by their own standards* (bad stats, poor controls).*
      *   **Overall:** Focus Step 2 & 4. Highlighting their dismissal of *contemporary* critiques is your strongest tool for legitimate criticism without presentism.

  2.  **The Victorian Naturalist (Extreme Racial Views):**
      *   **Step 1:** What was on the shelf? *Pass.* Pervasive racial hierarchies, scientific racism common (polygenism, phrenology), imperial ideology. *But also:* Strong abolitionist movement, critiques of biological determinism (e.g., from some religious perspectives, early anthropologists like James Cowles Prichard), concepts of universal human brotherhood.
      *   **Step 2:** Where did they shop? *Crucial!* *Pass (if you include it!)*. You say their views were "ugly even by Victorian standards." **This is KEY.** Was he seen as an extremist by peers? Did his work get criticised *at the time* for its racism? Did he use discredited sources or ignore contrary evidence?
      *   **Step 3:** Explaining or Buffing? *Risk if omitted.* Leaving it out *entirely* because it's unpleasant risks whitewashing. Including it *with context* is explanation, not excusing. *Action: Frame it as part of his intellectual profile, positioned relative to norms.*
      *   **Step 4:** Contemporaneous Judgment? *Your Best Justification for Inclusion.* *Pass (if done right).* If his views *were* extreme *for his time*, you can *legitimately* highlight this using evidence: "While racial hierarchies were commonplace, Naturalist X's assertions about Group Y's 'innate savagery' were criticised even by contemporary reviewers in Journal Z as 'lacking evidence' and 'excessively harsh'." This is *historical* criticism. **Your editor is wrong to say "just leave it out" IF it meets this step.** Omitting it is bad history and avoids understanding the *full* person and the *range* of Victorian thought. It matters precisely *because* he was an outlier in his ugliness.
      *   **Step 5:** Anachronism? *Risk:* Calling him a "white supremacist" (modern term). *Action: Quote his specific views or use period descriptors ("virulent racist," "proponent of extreme polygenism") and show how contemporaries reacted.*
      *   **Overall:** **Step 2 & 4 are critical.** Including his extreme views *and demonstrating they were extreme even then* is the *antidote* to presentism and apologia. It shows nuance in Victorian thought and allows you to portray him accurately. Tell your editor the procedure demands it for historical accuracy and avoiding the apologia trap.

  **Where the Procedure Misfires (Heads Up):**

  1.  **The "Available Standards" Fog:** Sometimes the historical landscape is genuinely murky. Was a critique truly "available" to *this* person? Was a standard "emerging" or "marginal"? The procedure flags this (Values Call), but you have to make a reasoned judgment based on evidence. Be transparent if it's ambiguous.
  2.  **The "Worthy Opponent" Problem:** What if the *only* credible contemporary critics were people your modern readers would *also* find objectionable (e.g., a religious bigot critiquing a racist scientist on biblical grounds, not humanitarian ones)? Anchoring criticism there feels icky. The procedure (Step 4) allows appeal to "wider enduring ethical principles" (like causing unnecessary harm) *if demonstrable*, but tread carefully. Sometimes silence is better than dubious allies.
  3.  **The "But They *Did* Know Better!" Dilemma:** Occasionally, someone truly was a moral beacon *ahead* of their time. The procedure (Step 2) helps show this (they were outliers adopting minority views). But judging the *majority* for *not* being that beacon is often presentism. The procedure helps you avoid condemning the mainstream for not being radicals, but it can make highlighting the radical seem like an exception that proves the rule of general backwardness – nuance is key.
  4.  **Long Shadows & Modern Relevance:** Your readers *care* because this history impacts the present. The procedure helps avoid *anachronistic judgment*, but it doesn't forbid discussing *legacy* or *modern relevance* – you just need a clear transition: "While we must understand Smith within his context, the legacy of his work on Policy X continues to shape debates about Y today." Don't let the procedure stifle making those vital connections, just keep the historical analysis clean.
  5.  **The Truly Monstrous (Within Their Own Time):** When someone was condemned *even by the horrific standards of their day* (e.g., a scientist conducting exceptionally cruel experiments deemed unethical *by contemporary medical codes*), Step 4 works perfectly. But when the *available standards themselves were monstrous* (e.g., chattel slavery's legality), Step 1 flags a Values Call. Condemning the *system* using modern morals is somewhat inevitable and readers might accept it, but condemning an *individual* actor within it solely on modern grounds is trickier. Focus on their agency *within* the system (Step 2 – were they unusually cruel/exploitative *even for that system*?) or stick to explaining the system's horrors.

  **Final Thought:** This procedure forces you to do the hard work of *historical empathy* (understanding their world) without requiring *moral sympathy* (agreeing with them). It turns the philosophical distinction between explanation and excuse into concrete journalistic checks. Keep your period sources close, quote contemporaries liberally, and let the historical actors damn or redeem themselves against their own backdrop whenever possible. Good luck – the letters page awaits, but now you're armoured!
