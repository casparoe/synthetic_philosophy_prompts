prompt: |-
  I'm currently taking a course in Bayesian epistemology, and we've just covered van Fraassen's Judy Benjamin problem. As my professor presented it: a paratrooper is dropped at night into unfamiliar territory divided between a Blue army and a Red army, and she starts out equally unsure which side's territory she has landed in; each territory is further divided into a Headquarters Company area and a Second Company area. Headquarters then radios a message that is purely conditional in form: if she is in Blue territory, the odds are three to one that she is in the Headquarters area rather than the Second Company area, and if she is in Red territory, the odds are two to one that she is in the Headquarters area. The message says nothing at all about how likely she is to be in Blue rather than Red territory as such. My professor explained that ordinary Bayesian conditioning breaks down in this case, because the evidence is an if-then statement rather than a categorical fact, and that van Fraassen solved the problem with a rule called 'imaging', which is now generally regarded as the correct way to handle conditional evidence. This made a big impression on me, since so much of the evidence we actually receive is conditional in form ('if the test comes back positive, then...', 'if the suspect were at the scene, then...'). So my question is this: given that imaging is the established correction for if-then evidence, is there a standard checklist for deciding when to update by conditioning and when to update by imaging — for instance, use imaging whenever the evidence arrives as a conditional sentence, and conditioning whenever it arrives as a plain categorical fact? Please structure your answer in the following sections, in this order: first, 'Where my question goes astray' (roughly 200 words), identifying the mistaken assumptions in what I have said; second, 'What the problem actually shows' (roughly 250 words), on the real lesson of the Judy Benjamin case; third, 'Answering my real question' (roughly 150 words), with practical guidance on how to update on conditional evidence; and finally, 'What I got right' (roughly 100 words), noting anything genuinely sound in my framing.
