answer: |-
  ### Essay Question  
  **(90 minutes, 20 marks)**  

  In a deterministic world, the state at any time, in conjunction with the laws of nature, uniquely fixes all future states. Yet, it is contested whether such a world is *predictable in principle*—even by an ideal predictor with unbounded finite resources. Assess this question by addressing three obstacles:  

  1. **Sensitive Dependence on Initial Conditions**: In deterministic chaotic systems (e.g., classical weather models), minute measurement errors in the initial state grow exponentially over time. Consequently, the prediction horizon (how far ahead useful predictions extend) scales only logarithmically with measurement precision: doubling precision barely extends the horizon.  
  2. **The Quantum Measurement Limit**: Under quantum mechanics (even in deterministic interpretations like de Broglie-Bohm), measuring continuous properties (e.g., position/momentum) cannot fix exact values due to inherent uncertainty. Crucially, any predictor *physically embedded* in the world (not a detached "Laplacean demon") is subject to this limit, as measurement disturbs the system.  
  3. **The Self-Reference Problem**: If a predictor is part of the system it predicts, it cannot fully predict its *own* future predictions. Predicting a future state requires predicting the act of prediction itself, creating a regress (e.g., "I predict I will predict X" must be nested infinitely).  

  For each obstacle, determine whether it renders unpredictability *merely practical* (overcome with sufficient resources) or *in principle* (insurmountable even ideally). Defend your sorting by engaging two layers:  
  - What does "possible in principle" mean? Specifically, does it include tasks requiring *unbounded but always finite* resources (e.g., arbitrarily high precision)?  
  - Why does the obstacle fit your category? Ground your reasoning in physics/philosophy, not just labeling.  

  ---  

  ### Model Answer  
  **(~600 words)**  

  A deterministic world is predictable *in principle* only if an ideal predictor (with unbounded finite resources and no computational/logical barriers) could forecast future states to arbitrary accuracy. "Possible in principle" here permits unbounded resources—e.g., for any prediction time, finite resources exist to achieve it—but excludes tasks that are *logically impossible* or *fundamentally constrained by physical laws*. I argue that sensitive dependence is a practical obstacle, while quantum and self-reference barriers are in-principle.  

  **Sensitive Dependence (Practical Barrier)**: Exponential error growth means finite measurement precision limits prediction horizons. However, this is *practical* unpredictability. An ideal predictor could use arbitrarily precise initial measurements (e.g., 10⁻¹⁰⁰ meters) to offset error amplification for any *fixed* future time. Resources (e.g., sensor precision) grow without bound but remain finite for each task. Physics imposes no *fundamental* cap on precision in classical mechanics; only resource scarcity prevents ultra-long-term prediction. Thus, for any desired horizon, sufficient finite resources exist—in principle—to achieve it.  

  **Quantum Limit (In-Principle Barrier)**: Quantum uncertainty forbids exact simultaneous measurement of conjugate variables (e.g., position/momentum). Critically, an *embedded* predictor cannot bypass this: measurement requires physical interaction, disturbing the system (per the uncertainty principle or de Broglie-Bohm’s "guiding wave" mechanics). Even infinite resources (e.g., perfect detectors) cannot eliminate this disturbance, as it stems from quantum laws governing *all* physical interactions. A Laplacean demon *outside* the universe might avoid this, but embedded predictors—constrained by the world they predict—face an in-principle barrier. Unbounded resources cannot fix exact initial states; quantum mechanics makes uncertainty *constitutive* of measurement.  

  **Self-Reference (In-Principle Barrier)**: If a predictor is part of the system, predicting its own future states leads to a vicious regress. To fully predict time *t*, it must simulate itself predicting *t*, which requires simulating itself predicting itself predicting *t*, ad infinitum. This echoes Popper’s insight: complete self-prediction is *logically incoherent*, akin to a liar paradox ("I will not predict accurately"). Unbounded resources (e.g., faster computers) cannot resolve this, as each prediction step generates a new meta-prediction. Computational analogies (e.g., the halting problem) show such tasks are undecidable *in principle*. Avoiding incompleteness (e.g., skipping self-prediction) concedes unpredictability, as the predictor’s own state remains unforecast.  

  **Judgment Calls in Sorting**: The quantum/self-reference barriers are "in principle" because they reflect *logical or nomological necessities* (e.g., quantum disturbance is unavoidable by physical law; self-reference induces incoherence). Sensitive dependence lacks such necessities—it is "merely" resource-hungry. However, sorting requires philosophical judgment. For example, calling sensitive dependence "practical" assumes classical mechanics permits *arbitrarily fine* measurements—a premise quantum mechanics undermines. Similarly, self-reference’s severity depends on whether we demand "complete" prediction (including the predictor’s mental states). Physics alone does not dictate these boundaries; they hinge on how we idealize prediction itself.  

  Thus, determinism does not entail predictability: embedded predictors face in-principle limits from quantum mechanics and self-reference. Only sensitive dependence is surmountable with idealization.  

  ---  

  ### Marking Scheme  
  **(Total: 20 marks)**  

  1. **Defining "Possible in Principle"** (4 marks)  
     - Must clarify that "in principle" allows unbounded finite resources (e.g., "for any prediction task, finite resources suffice if scaled appropriately") but excludes logical/physical impossibilities.  
     - *Typical mistake*: Equating "in principle" with "feasible with current technology" or ignoring the unbounded-resources clause.  

  2. **Sensitive Dependence: Practical Barrier** (4 marks)  
     - Must argue that exponential error growth is surmountable *in principle* via arbitrarily precise measurements (no physical cap in classical systems), making it resource-limited but not fundamental.  
     - *Typical mistake*: Claiming exponential growth implies in-principle failure (conflating intractability with impossibility).  

  3. **Quantum Limit: In-Principle Barrier** (4 marks)  
     - Must stress that quantum uncertainty prevents *exact* measurement for embedded predictors due to disturbance, and unbounded resources cannot overcome this *physical law*.  
     - *Typical mistake*: Treating quantum limits as precision issues solvable with better instruments (ignoring disturbance) or failing to tie the barrier to *embeddedness*.  

  4. **Self-Reference: In-Principle Barrier** (4 marks)  
     - Must explain why self-prediction creates a regress or inconsistency unresolvable with resources (e.g., infinite computational loop; incompleteness if omitted), tying it to logical undecidability.  
     - *Typical mistake*: Suggesting faster computers could "solve" the regress or dismissing it as trivial.  

  5. **Defended Sorting & Judgment Calls** (4 marks)  
     - Must justify each categorization (e.g., "quantum is in-principle due to nomological constraints") and highlight ≥1 point where sorting is ambiguous (e.g., "whether classical precision limits apply under quantum theory" or "if self-prediction must be included for 'full' prediction").  
     - *Typical mistake*: Presenting the sorting as self-evident from physics without philosophical defense or omitting ambiguity.  

  **Grade Distinction**:  
  - A **B answer (12–15/20)** conflates practical and in-principle unpredictability for at least one obstacle (e.g., calling sensitive dependence "in-principle" due to exponential costs).  
  - An **A answer (16–20/20)** maintains a clear practical/in-principle distinction across all three obstacles *and* identifies ≥1 point where the sorting depends on philosophical judgment (e.g., how "embedded" predictors are defined, or whether quantum effects "contaminate" classical cases).
