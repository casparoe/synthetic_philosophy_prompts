prompt: |-
  I teach an upper-level philosophy of science seminar and am writing the final exam. Please draft one essay question, with a model answer and a marking scheme, on whether a deterministic world is predictable in principle. The question must be unanswerable by reciting the slogan that determinism concerns the laws while predictability concerns us; it should instead force candidates to sort the obstacles to prediction into those that are merely practical and those that bite even for an ideal predictor, and to defend that sorting. Since I don't want the question to depend on outside reading, present the three obstacles inside the question itself, a couple of sentences each: (i) sensitive dependence on initial conditions, under which measurement error grows exponentially, so the prediction horizon grows only logarithmically with the precision of the initial measurement; (ii) the quantum limit, under which no measurement of a continuous state fixes it exactly — and note that any predictor physically embedded in the world, rather than standing outside it, is itself subject to that limit; and (iii) a self-reference argument in the spirit of Popper, that a predictor belonging to the system it predicts cannot fully predict its own future predictions, since a complete prediction would have to contain a prediction of itself, which raises a regress that the candidate should assess rather than merely report. For each obstacle, candidates must say whether it yields unpredictability in principle or only in practice, and must address what "possible in principle" should mean here — in particular whether a task may count as possible in principle when it requires unbounded, though at every stage finite, resources. Set the question at ninety minutes, out of 20 marks. The model answer should run about 600 words. The marking scheme should consist of five must-hit points with the marks for each, a one-line note on how candidates typically get each wrong, and a closing statement of what separates an A from a B: a B answer somewhere conflates practical with in-principle unpredictability, while an A answer keeps them apart across all three obstacles and flags at least one point where the sorting itself is a judgment call rather than something the physics settles.
reasoning: |-
  We are drafting an essay question for an upper-level philosophy of science seminar final exam. The question is about whether a deterministic world is predictable in principle, and it must include three obstacles: sensitive dependence on initial conditions, the quantum limit, and a self-reference argument. The question should force students to sort the obstacles into those that are merely practical and those that are in principle, and to defend that sorting. Additionally, the model answer should be about 600 words, and the marking scheme should have five must-hit points with marks, typical mistakes, and a note on the A/B distinction.

  Let me first draft the essay question:

  ---

  **Essay Question (90 minutes, 20 marks):**

  In a deterministic world, the state at any time uniquely determines the state at all future times. However, the question of whether such a world is predictable in principle — even by an ideal predictor with unbounded finite resources — is contested. Consider the following three obstacles to prediction:

  (i) **Sensitive Dependence on Initial Conditions**: In some deterministic systems, such as classical chaotic systems, small errors in the measurement of the initial state grow exponentially over time. This implies that the prediction horizon (how far into the future one can predict with a given accuracy) grows only logarithmically with the precision of the initial measurement. For instance, doubling the precision only extends the prediction horizon by a fixed constant.

  (ii) **The Quantum Measurement Limit**: Even in a deterministic interpretation of quantum mechanics (e.g., de Broglie-Bohm), the act of measurement is constrained by quantum uncertainty. Specifically, for any continuous state variable, no measurement can fix its exact value. Moreover, any predictor physically embedded in the world (rather than an 'outside' Laplacean demon) is itself subject to this limitation, because it must interact with the system to measure it, thereby disturbing it.

  (iii) **The Self-Reference Problem**: Suppose a predictor is part of the deterministic system it is trying to predict. Then, to fully predict the future state of the system, it would have to predict its own future predictions. But if it predicts that it will predict X at time t, then at time t it must predict X, but then it might also predict that it will predict something else at a later time, leading to a regress. This problem, inspired by Popper, raises the question of whether a predictor that is part of the system can avoid inconsistency or incompleteness.

  **Your task**: For each obstacle, explain whether it presents a barrier to prediction that is merely *practical* (i.e., one that could be overcome with sufficient resources, even if those resources are beyond our current means) or *in principle* (i.e., one that would remain even for an ideal predictor with unbounded finite resources). In your analysis, explicitly address what you take "possible in principle" to mean, and in particular, whether a task that requires unbounded (though always finite) resources counts as possible in principle. Defend your sorting by arguing why each obstacle falls into the category you assign.

  ---

  Now, let me draft the model answer (about 600 words):

  ---

  **Model Answer**:

  The question of whether a deterministic world is predictable in principle requires clarifying what "in principle" means. I take it to mean that a task is achievable by an ideal predictor with unbounded finite resources, provided that there is no logical, mathematical, or metaphysical barrier that makes the task impossible even with such resources. Crucially, if a task requires unbounded resources (meaning that for any finite resources, there is a prediction task that exceeds them), but at every stage the resources are finite and the task is well-defined, then it may still count as possible in principle. However, if there is an inherent contradiction or a fundamental limit that no amount of resources can overcome, then unpredictability is in principle.

  **Sensitive Dependence on Initial Conditions**: This obstacle yields only *practical* unpredictability. The exponential amplification of errors means that to predict further into the future, we need exponentially more precise initial measurements. But with unbounded resources, we can achieve arbitrarily high precision in the initial measurement (at least in classical mechanics). Thus, for any fixed prediction time, we can in principle set the initial precision high enough to achieve the desired accuracy. The catch is that the resources required grow without bound as the prediction time increases. But since the predictor has unbounded resources, this is a practical, not an in-principle, barrier. We are only limited by the fact that we cannot have infinite precision at one go, but we can approach it arbitrarily closely with finite resources.

  **The Quantum Measurement Limit**: This obstacle presents an *in-principle* barrier to prediction for any predictor embedded in the world. In quantum mechanics, even in deterministic interpretations, the uncertainty principle (or its operational consequences) implies that there is a fundamental limit to how precisely we can measure conjugate variables (like position and momentum). Moreover, the predictor, being part of the physical world, must interact with the system to measure it. This interaction inevitably disturbs the system (as in the Heisenberg microscope). Thus, no matter how much resources we have, we cannot simultaneously measure the exact state of a system because the very act of measurement changes it. This is not just a matter of resource constraints; it is a fundamental feature of quantum mechanics. Hence, unpredictability here is in principle for embedded predictors. Note that a Laplacean demon standing outside the universe might avoid this, but the question specifies predictors physically embedded in the world.

  **The Self-Reference Problem**: This obstacle also presents an *in-principle* barrier. Consider a predictor P that is part of the system. Suppose P attempts to predict the entire future state of the system, including its own future predictions. If P predicts that at time t it will predict X, then at time t it must predict X. But if the prediction at time t is about a later time, then the prediction at time t must also include P's prediction at that later time. This leads to a regress. Moreover, if P is to predict its own future state, it might need to simulate itself, which could lead to an infinite regress (like a computer program that must simulate itself simulating itself, ad infinitum). This is reminiscent of the halting problem in computation: there are tasks that are undecidable in principle. Thus, even with unbounded resources, the predictor might be unable to complete the prediction without encountering a logical inconsistency or an infinite loop. Hence, unpredictability is in principle when the predictor is part of the system.

  In conclusion, sensitive dependence is a practical obstacle, while quantum limits and self-reference are in-principle barriers for embedded predictors. However, the sorting is not entirely settled by physics. For instance, the self-reference barrier might be avoided if the predictor does not attempt to predict its own predictions beyond a certain level, but then the prediction would be incomplete. This is a judgment call: we must decide what counts as a "full" prediction. Similarly, the quantum barrier might be circumvented in a non-standard interpretation, but if we accept the standard operational constraints, it is in principle. Thus, the sorting requires philosophical engagement with the nature of prediction and the idealizations we allow.

  ---

  **Marking Scheme (Total: 20 marks)**:

  1. **Clarity on "possible in principle" (4 marks)**: The candidate must explicitly define what they mean by "possible in principle", particularly addressing whether unbounded finite resources are allowed. They should also note that in principle does not require infinite resources at once but may require arbitrarily large finite ones.  
     *Typical mistake*: Failing to define "in principle" or assuming it requires only finite resources without addressing unbounded growth.

  2. **Analysis of sensitive dependence (4 marks)**: The candidate must argue that this is a practical obstacle because with unbounded resources (arbitrarily precise measurements) we can predict any fixed future time arbitrarily well, even though the resources required grow exponentially.  
     *Typical mistake*: Conflating this with in-principle unpredictability because of the exponential growth, without recognizing that unbounded resources can overcome it for any fixed prediction horizon.

  3. **Analysis of quantum limit (4 marks)**: The candidate must argue that this is an in-principle barrier for any embedded predictor because of the fundamental disturbance in measurement. They should note that even with unlimited resources, the predictor cannot measure without disturbing, hence cannot get the exact initial state.  
     *Typical mistake*: Treating this as a practical limit (e.g., due to current technology) or failing to connect the disturbance to the embeddedness of the predictor.

  4. **Analysis of self-reference (4 marks)**: The candidate must argue that this is an in-principle barrier because of a logical or computational regress that cannot be resolved even with unbounded resources. They should draw an analogy to undecidability or incompleteness.  
     *Typical mistake*: Merely describing the regress without explaining why it is in principle, or suggesting that more computing power could solve it.

  5. **Defending the sorting and acknowledging judgment calls (4 marks)**: The candidate must defend why each obstacle falls into the assigned category and must flag at least one point where the sorting is a judgment call (e.g., in self-reference, what counts as a full prediction? Or in quantum, whether we allow non-embedded predictors).  
     *Typical mistake*: Presenting the sorting as straightforwardly determined by physics without noting any philosophical ambiguity.

  **Grade Distinction**:  
  - A **B** answer (typically scoring 12-15) will have some conflation of practical and in-principle unpredictability, especially in at least one of the three obstacles.  
  - An **A** answer (typically scoring 16-20) will keep practical and in-principle barriers distinct across all three obstacles and will acknowledge at least one point where the sorting requires philosophical judgment (e.g., the interpretation of quantum mechanics, the scope of self-reference, or the definition of "full prediction") and is not settled solely by physics.

