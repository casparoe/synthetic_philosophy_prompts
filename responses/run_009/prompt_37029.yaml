prompt: |-
  You're a professional philosopher who works on both late ancient ethics and philosophy of language, so please think carefully about this one before answering, maybe even sketch some ideas first -- I want real engagement, not a book report.

  I'm in a course on Augustine (we just did De Mendacio, plus some of the background on lying and concealment) and I'm also a huge fan of Robert Bolt's A Man for All Seasons. I've noticed More basically tries to live Augustine's actual rule from On Lying: never assert what you believe false, but you may conceal the truth or stay silent, especially from people with no right to it. So More resigns the chancellorship rather than endorse the king's supremacy, then goes to the Tower rather than swear the oath, and at trial his whole defense is that silence is neither denial nor lie.

  But heres what's bugging me. In the play, everyone treats More's silence as dissent -- Norfolk, Cromwell, the court, even his own family half the time -- and More obviously knows that's how they'll read it. If silence predictably communicates something false in that context (people assume he's opposed, when maybe he's only refusing to swear), is his silence really different in kind from a lie, or is it just lying by implicature instead of by assertion? Does Augustine's definition (signifying something to someone with the intention of deceiving) even cover that case, and would Augustine count More as compliant or not?

  So here's what I want: a reading of the play through On Lying. Where does More successfully walk Augustine's line, where does Bolt show the line can't survive real politics (the Common Man's casual lies are the obvious foil, and Rich's perjury at the trial is like the mirror image), and does the play ultimately vindicate Augustine's distinction or quietly come down against it? If the reading strains somewhere, say so honestly. And since we're graded partly on making an original point, I'd love a paragraph on whether Bolt gives Augustine something the treatise lacks -- a dramatization of how audiences take meaning, not just how speakers give it. Don't quote from either text, I can look passages up myself. Around 1,200-1,500 words is plenty.
