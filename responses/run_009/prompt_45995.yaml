prompt: |-
  So I'm in a fraternity, and lately our nationals have been cracking down hard on hazing — like, we can't even make pledges do chores anymore, while at the same time my roommate is at OCS (officer training) getting yelled at and doing log drills at 4am, and everyone acts like that's noble. And my cousin in med residency is basically destroyed for two years and nobody calls it hazing, they call it "training culture." It got me thinking about this stuff I read for an econ elective: there's this idea from biology about peacock tails (I think it's called the handicap principle?), where a signal is credible *because* it's wasteful — only a genuinely fit animal can afford to carry a useless huge tail around. And then there's the economics version where costly signals (degrees, unpaid internships) screen out people who aren't really committed. I can't figure out which of these hazing actually is, or whether it's neither.

  Here's what I want from you, and please write in American English. Treat hazing/initiation rites as a practice and tell me what theory of it the practice presupposes. Like: does the practice only make sense if the cost is the *point* — i.e., the suffering has to be pointless, because a useful task would be a cheaper signal anyone could fake enthusiasm for? Or is it a screening story (only people who really want in will pay the price, so it filters out free riders before they join)? Or is it the third thing people always say, that shared suffering causally produces bonding, so the cost is just an unfortunate side effect of building group identity? For each option, say what it predicts and what it would rule out — e.g., would a bonding theory predict that cheap collective rituals work just as well, and if it would, why do groups keep converging on the costly version? Also I'm curious about the inconsistency I started with: what exactly separates "hazing" (bad, banned) from boot camp and residency (fine, even glorified)? Is it just consent and purpose, or is there some presupposed view of when costs to a person are acceptable for producing a quality signal? And where is the whole thing philosophically underdetermined — could several of these theories all license the same practice, such that we can't really tell from the outside which one a given fraternity or hospital is running on? Take a position at the end: given all that, do you think blanket hazing bans are coherent, or do they only make sense if the practice presupposes something the bans themselves quietly reject?
