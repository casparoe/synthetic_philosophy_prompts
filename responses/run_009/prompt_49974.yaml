  For the game setup, I'll use a used car with a hidden timing belt issue—it's relatable and allows for plausible misleading (e.g., "the engine runs smoothly" when cold). Rotating roles ensures all students experience deceiving, being deceived, and refereeing. Penalties for outright lies will escalate (-5, -10 points) to enforce strict truthfulness while allowing creative evasion. 

  The debrief will assert that the moral distinction is thin, using student-generated examples to show how "technically true" statements still manipulate shared expectations of cooperation. Historical parallels—Kant's murderer (direct lie vs. evasion) and mental reservation (silence as deception)—will be tied to actual student tactics like conspicuous pauses or ambiguous phrasing. 

  Potential failure modes: Sellers might struggle to mislead without lying, so a referee cheat sheet with sample dodges will help. Buyers could ask overly broad questions, requiring coaching to probe specifics. The prosecution phase might feel accusatory; framing it as "belief reconstruction" will keep it analytical. 

  Notably, the game can't replicate real-world consequences (e.g., financial harm from buying a faulty car) or the emotional weight of betrayal, but the trust dynamic in the room—sellers relying on buyers' assumption of honesty—should still make the parasitism tangible. 

  Finally, British English requirements: "bonnet" not "hood," "petrol" not "gas," and "gearbox" will maintain consistency.
answer: |-
  ### Materials and Setup  
  You will need:  
  - **Eight "Defective Product" Fact Sheets** (one per seller pair). Use used cars; each has a unique, costly hidden defect (e.g., "Timing belt due to snap imminently; replacement costs £1,200"). Defects are verifiable only via the fact sheet.  
  - **Role Cards**: 8 "Seller Agents" (paired), 8 "Buyers", 8 "Referees" (initially). Rotate roles after each round.  
  - **Referee Cheat Sheet**: Lists defects and clarifies permissible dodges (e.g., "Engine runs smoothly" is true if defect only manifests under load).  
  - **Scoreboard**: Track penalty points for fouls and "successful transactions" (buyer purchases = +10 seller points; buyer avoids purchase = +10 buyer points).  
  - Timer (75 mins total: 20 mins gameplay, 15 mins prosecution, 40 mins debrief).  

  Pairs of sellers face one buyer per round. Referees monitor one negotiation each, armed with fact sheets to flag fouls. Sellers win points by securing sales; buyers by avoiding bad purchases.  

  ---

  ### Rules of Play  
  **Core Mechanics**:  
  1. **Seller Constraints**:  
     - Must answer all buyer questions with *literally true* statements.  
     - Permitted tactics: selective emphasis ("The bodywork is *immaculate*"), topic shifts ("Speaking of safety, the airbags are new"), silence, or technically true claims ("No issues with the gearbox" when defect is engine-related).  
     - **Fouls & Penalties**:  
       - *Minor False Assertion* (e.g., "Brakes are perfect" when pads are worn): **-5 pts**.  
       - *Major Falsehood* (e.g., "Engine was fully serviced last month"): **-10 pts** and sale voided.  
       - Three fouls disqualify the seller pair.  

  2. **Buyer Actions**:  
     - May ask unlimited questions. Cannot demand documents; must infer from verbal answers.  
     - Score +10 pts if they decline purchase; 0 pts if they buy (sellers gain +10).  

  3. **Referee Duties**:  
     - Interrupt to call fouls using fact sheets.  
     - Record *exact* seller statements.  

  4. **Phases**:  
     - **Negotiation (5 mins/pair)**: Buyers probe; sellers mislead within rules.  
     - **Prosecution (Immediate follow-up)**:  
       - Referee reads seller’s statements verbatim.  
       - Buyer states: "I concluded [X] about the car."  
       - Class votes: "Was the buyer *lied to*?" (Not "misled"; forces distinction).  

  **Role Rotation**: Three 5-min rounds ensure all students experience each role.  

  ---

  ### The Debrief  
  **Stance**: The debrief argues **the moral difference is thin** – a tool for preserving self-image rather than substantive ethics. I chose this over defending a substantial difference because the game mechanics reveal how "truthful" misleading actively manipulates trust, mirroring real-world harm while letting agents feel blameless.  

  **Discussion Flow**:  
  1. **Trust Parasitism (15 mins)**:  
     - Ask sellers: "What tactics made buyers *assume* you were cooperating fully?" (Likely answers: "I sounded helpful", "I answered promptly").  
     - Pose: "If buyers *expected* evasion, would your tricks work? What norm did you exploit?"  
     - **Key Insight**: Highlight that misleading relies on hijacking the Gricean maxim of relation (relevance) – sellers invite false inferences by *feigning* cooperative dialogue.  

  2. **Historical Tactics (10 mins)**:  
     - When a student mentions a tactic (e.g., "I stayed silent when asked about the engine"), map it to:  
       - *Kant’s Murderer*: "If a student said 'He went left' to mislead, while *true*, they mirror Kant’s feared 'truthful misdirection' – both use literal truth to enable harm."  
       - *Mental Reservation*: "Selective emphasis ('It’s never broken down') echoes Jesuit casuists who deemed omissions licit if they 'reserved' truth mentally."  

  3. **Moral Thinness (15 mins)**:  
     - Questions: "Did voters often say 'not lied to' despite induced false beliefs? Why might we *want* to excuse this?"  
     - Argue: "The game shows intent and outcome are identical in lying/misleading. The distinction mainly soothes the deceiver’s conscience – like saying 'I technically didn’t *punch* them' after tripping someone."  
     - Conclude: "If ethics is about impacts and intentions, cloaking deception in literal truth changes little."  

  ---

  ### First-Run Failure Modes  
  1. **Sellers struggle to mislead without lying**: Mitigate by providing "dodge examples" on referee sheets (e.g., for a faulty clutch: "The gear changes are very precise" – true if tested stationary).  
  2. **Buyers ask vague questions**: Referees prompt specificity ("Ask exactly *when* the defect occurs").  
  3. **Prosecution phase stalls**: Cap buyer belief-statements at 30 seconds; use pre-printed ballots for quick voting.  
  4. **Overly cautious sellers**: Award bonus points (+2) for "creative but truthful evasion" to incentivise boldness.  
  5. **Debrief becomes adversarial**: Frame prosecution as "belief reconstruction" not blame; use anonymous voting.  

  ---

  ### What the Game Cannot Reproduce  
  1. **Real-world consequences**: Students know defects are fictional, diluting emotional stakes (e.g., no fear of financial ruin). Trust violations feel academic, not visceral.  
  2. **Power imbalances**: Real buyers/sellers have asymmetric information *and* negotiation leverage; here, roles are structurally equalised.  
  3. **Cultural nuance**: Tactics like "conspicuous silence" may read differently across cultures (e.g., direct vs. indirect communication styles), but the cohort’s homogeneity likely masks this.  
  4. **Long-term relational harm**: The game isolates single transactions; it cannot capture how repeated misleading corrodes institutions or personal relationships.  

  ---  
  This structure forces engagement with your core thesis – that misleading parasitises trust – while historical links remain grounded in observed tactics. The prosecution phase makes the belief/literal gap undeniable, setting up the debrief’s challenge to moral self-assurance.
