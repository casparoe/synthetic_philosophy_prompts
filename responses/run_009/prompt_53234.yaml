  Now, the crucial part: Cantor's theorem and the hierarchy of infinities.

  - **Cantor's theorem**: The diagonal argument can be expressed in lazy evaluation. Suppose we have a lazy list of all infinite binary sequences (each sequence is itself a lazy list of bits). But note: in the computable world, we can only enumerate the _computable_ sequences. The diagonal argument in this setting would show that the set of computable sequences is countable, but then we can build a new computable sequence that is not in the list by diagonalizing. However, this new sequence is computable (by the diagonal construction) so we can add it to the list? But then we get a new enumeration? The key is that the diagonal argument in the computable setting shows that there is no computable enumeration of all computable sequences? Actually, the set of computable sequences is countable (because there are countably many programs) but not computably enumerable in a way that allows the diagonalization to be effective? 

  Wait, let me clarify: 
  - In classical set theory, Cantor's theorem says that for any set S, the power set of S has a strictly greater cardinality. For the natural numbers, the power set is uncountable. The diagonal argument constructs, for any function f: N -> P(N), a set D that is not in the image of f.

  - In the computable setting, we can only consider computable functions f. But the set of computable functions is countable. Therefore, the classical diagonalization over all functions doesn't have a direct computable analogue. 

  However, we can do the following in the lazy setting:

    Let `enum` be a lazy list of computable sequences (each sequence is a function from natural numbers to {0,1}). We assume `enum` is an enumeration of _some_ set of sequences (for example, all sequences computed by Turing machines). But note: there is no computable enumeration that includes all computable sequences (because of the halting problem). 

    Now, we can define a new sequence `d` by:
        d n = 1 - (enum n n)

    But this `d` is computable (if `enum` is computable) and hence must be in the list? But if `enum` is an enumeration of all computable sequences, then `d` should be in the list, say at index `k`. Then we have:
        d k = 1 - (enum k k) = 1 - d k
    which is a contradiction.

    Therefore, there is no computable enumeration of all computable sequences. But note: the set of computable sequences is countable (because there are countably many Turing machines) but not _effectively_ enumerable (i.e., there is no computable bijection between the natural numbers and the set of all computable sequences that lists each one exactly once). 

  So in the computable setting, we have a countable set that cannot be computably enumerated. This is a well-known result.

  But what about the power set? In set theory, the power set of the natural numbers is uncountable. In the computable setting, we can only talk about the computable subsets (which are countable) and the non-computable ones (which exist by the diagonal argument above). But the computable subsets are countable, while the classical power set is uncountable. 

  So the hierarchy of infinities in the classical sense does not survive in the computable setting. Specifically:

  - Everything we can compute with is countable: the set of all finite strings, the set of all computable functions, etc. 
  - The classical power set of the natural numbers is not computably accessible. We can define it mathematically, but we cannot write down a program that lists all its elements or even represents every element (because there are uncountably many, and we only have countably many programs).

  Therefore, in your vocabulary (lazy evaluation and computability), the cardinality hierarchy beyond the countable does not have a direct representation. We can talk about the classical result as a mathematical fact about formal set theory, but we cannot construct an actual example of an uncountable set in the computable world. 

  **Conclusion on the residue**:

  Your framework (lazy evaluation and computability) can express potential infinity (via lazy lists) and the diagonal argument (as a technique to show that a set is not computably enumerable). However, it cannot express actual infinity as a completed totality because the entire infinite set is never present. The cardinality hierarchy (beyond countable) is a concept that exists in the formal system of set theory but does not have a direct analogue in the computable world. 

