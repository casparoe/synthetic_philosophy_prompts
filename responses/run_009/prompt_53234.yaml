  But in your framework, you are constrained to what is computable, and the actual infinity (as an uncountable set) is not computable. So the hierarchy of infinities beyond the countable is a real claim that your vocabulary cannot express. 

  However, the diagonal argument itself survives as a technique to show that certain sets are not computably enumerable. And that is a powerful idea in computability theory.

  In summary:

