  We are going to translate the concepts of infinity into the vocabulary of lazy evaluation and computability. The key idea is that in lazy evaluation, we deal with infinite data structures (like streams) by using thunks (delayed computations) that generate the next element on demand. This is similar to the idea of potential infinity, where we can always get the next element but never have the entire infinite set at once.

  Let's break down each of the four points:

  1. **Aristotle's potential infinity**: 
     - **Translation**: This maps directly to a lazy infinite list (e.g., in Haskell: `[1..]`). The list is not stored in memory as a complete array but is generated by a rule (a thunk) that produces the next element when needed. The entire list is never completed; it's always "not yet" fully realized.
     - **What maps cleanly**: The idea of a rule that can produce arbitrarily many elements, but without ever having the entire set in memory at once. The process of generating the next element is the essence of potential infinity.
     - **Distortion**: In Aristotle's view, there is no completed totality. In lazy evaluation, we do have a _description_ of the entire list (the thunk and the rule) that exists at a moment, but the list itself is not expanded. This description might be seen as a completed totality of the rule, but not of the list elements. However, the key point is that the elements are not all present at once. So it's a close match.
     - **No expression?**: The philosophical idea of infinity as a never-ending process is captured. However, the lazy infinite list is still an object in the program (a first-class value) that can be passed around, which might be seen as reifying the potential infinity. But the way it is used (on-demand evaluation) aligns with potential infinity.

  2. **Cantor's completed infinities (actual infinities)**:
     - **Translation**: This would be like having the entire infinite list fully evaluated and stored in memory (like an infinite array). But in a computer with finite memory, this is impossible. However, in a formal system (like set theory), we can reason about the entire set as a completed object. In lazy evaluation, we don't have this. The closest we might get is if we consider the mathematical object (the set) as being defined by a finite description (like a set-builder notation) and then we reason about it as a whole without generating every element.
     - **What maps cleanly?**: Not much. The idea of a completed totality doesn't have a direct analogue in lazy evaluation because we never have all the elements at once. However, we can _reason_ about the entire set by its finite description. For example, we can write a function that takes an infinite list and returns a property of the entire set (like its cardinality) without evaluating every element. But in practice, for infinite sets, we can only compute properties that are determined by the rule (like the generator function) and not by the entire set.
     - **Distortion**: In set theory, the set of natural numbers is a completed object. In lazy evaluation, we have a process that can generate any natural number, but we don't have the entire set. Even if we could reason about the entire set via the rule, the rule is finite and the set is infinite. So the actual infinity is somewhat distorted by being represented by a finite rule.
     - **No expression?**: The idea of a completed totality (all elements existing simultaneously) has no direct expression because the lazy list is always partial. We can simulate reasoning about the whole by using the generator, but the generator is finite and the infinity is still potential.

  3. **Hilbert's hotel**:
     - **Translation**: The hotel has infinitely many rooms (an infinite list). The "move every guest to the next room" operation is like shifting the entire list. In lazy terms, we can define a new infinite list that is the tail of the original list (for the guests moving to the next room) and then assign a new guest to the first room. 
       - Original: `[g0, g1, g2, ...]`
       - After shift: `[new_guest, g0, g1, ...]`
       - We can do this without having the entire list by defining a new generator: the first element is the new guest, and then the rest is the original list. This is efficient because the original list is lazy and we just prepend one element.
     - **What maps cleanly?**: The operation of shifting and adding a new guest is straightforward in lazy evaluation. We don't actually move every element; we just create a new list that shares the tail of the old one. This matches the idea that we don't need to do an infinite amount of work to add a new element.
     - **Distortion**: In the actual Hilbert hotel, the rooms are fixed and the guests are moved. In the lazy list, we are creating a new list. But because of sharing and lazy evaluation, the original list is not copied, so it's efficient. However, the original list still exists? In the story, the hotel is one and the same. In the lazy version, we have a new list. But in a pure functional setting, we can think of it as the same hotel being updated? Actually, in a pure setting we don't mutate, so we have a new hotel. But the analogy holds because we don't physically move every guest; we just change the way we access the guests (by starting at the new head).
     - **No expression?**: The idea of the same hotel with the same rooms but guests moved might be slightly different, but the computational effect (constant time operation to add a new guest at the front) is analogous.

  4. **Finitism / strict finitism**:
     - **Translation**: This is the position that only finite objects exist. In programming, this would mean rejecting lazy infinite lists and only using finite lists. Any attempt to use an infinite list would be seen as an illusion: what we have is a finite process that can generate as many elements as we want, but we never have an actual infinite list. The finitist would say that the lazy list is just a finite program (the generator) and that the "infinite list" is a manner of speaking.
     - **What maps cleanly?**: The finitist view is that we only have finite representations (like the generator function) and finite outputs. The lazy list is just a finite description. So the finitist would say that we are always dealing with finite strings (the program) and that the infinite set is never actually constructed.
     - **Distortion**: The finitist might go further and say that we cannot even talk about generating arbitrarily large numbers because of physical limitations (e.g., the universe is finite). In programming, we can run a generator until we run out of memory, but the finitist would say that we can only generate up to a certain bound. However, in theory, we can abstract away from physical limits. The strict finitist might not even accept the theoretical abstraction of unbounded generation.
     - **No expression?**: The finitist rejection of infinity is clear: they don't accept the lazy infinite list as an actual infinity. In their view, the lazy list is just a potential infinity (which they might accept as a process) but they would deny that it forms a completed set. So the lazy list is acceptable as a process that never completes, but not as a completed object.

