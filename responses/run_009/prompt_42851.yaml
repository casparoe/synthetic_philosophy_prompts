  Below is a "Which Norm of Assertion Do You Hold?" quiz designed for your pub philosophy night. It includes 9 concrete cases (covering your required scenarios) with intuitive options, a scoring key that maps answers to norms, and notes on contested issues. The quiz is structured for quick use: participants hold up cards (A, B, or C) for each question, then self-score using the key. Total runtime: ~15-20 minutes.

  ---

  ### **Quiz: What Are You Allowed to Assert?**
  **Instructions:** For each scenario, choose the option that best reflects your view. Answer based on your intuition—no philosophy background needed!  
  *(Options: A, B, or C)*  

  1. **The Lottery Ticket**  
     A million-ticket fair lottery draw *has already happened*. Your friend’s ticket lost, and you know the odds are near-certain (99.9999%). You say to them, "You lost."  
     - A. **Yes, this is fine to say—it’s true and almost certain.**  
     - B. **No, you shouldn’t say this without qualification (e.g., "almost certainly").**  
     - C. **You may say it, but you owe an explanation if pressed (e.g., "the odds say...").**  

  2. **Moorean Sentence**  
     Someone says: "It’s raining, but I don’t believe it is." (Assume it *is* raining, and they genuinely don’t believe it.)  
     - A. **This is acceptable—they’re being truthful.**  
     - B. **This is unacceptable—it’s deeply odd or contradictory.**  
     - C. **It’s acceptable only in special contexts (e.g., therapy).**  

  3. **Gettier-Style Luck**  
     Someone asserts a true fact (e.g., "The meeting is in Room 101") based on strong evidence (e.g., a reliable schedule), but their belief is only true by luck (e.g., the schedule was wrong, but the meeting *was* in Room 101 by chance).  
     - A. **Proper assertion—they were justified and it was true.**  
     - B. **Improper assertion—they didn’t *really* know it.**  
     - C. **Proper, but they should clarify their evidence if asked.**  

  4. **False but Justified**  
     A detective asserts, "The suspect is guilty" based on strong, careful evidence (e.g., fingerprints, witnesses). Later, we learn the suspect is innocent—the evidence was misleading.  
     - A. **The assertion was proper—they did everything right.**  
     - B. **The assertion was improper—it turned out false.**  
     - C. **It was proper *at the time*, but they must retract it later.**  

  5. **Concessive Knowledge**  
     Someone says: "I *know* the shop closes at 6, but it might be closed." (Assume they do know the closing time.)  
     - A. **This is acceptable—knowledge doesn’t rule out small doubts.**  
     - B. **This is unacceptable—if you know, you can’t say "it might not be."**  
     - C. **It depends on context (e.g., high stakes vs. low stakes).**  

  6. **Retraction Etiquette**  
     Someone asserts a true fact with terrible evidence (e.g., "This coin flip will land heads" based on a lucky guess). When challenged, they say, "Fair point—I shouldn’t have said that."  
     - A. **They’re wrong to retract—it was true, so no harm done.**  
     - B. **They’re right to retract—you need good evidence to assert.**  
     - C. **Retraction is optional—it depends on the audience.**  

  7. **Weather App**  
     Your phone’s weather app says, "Rain tomorrow" based on a 55% forecast. It does not express uncertainty (e.g., no "likely" or "probably").  
     - A. **This is a proper assertion—it’s reporting the best data it has.**  
     - B. **This is improper—it should hedge unless certainty is high.**  
     - C. **This isn’t a real assertion—it’s just data output.**  

  8. **Chatbot**  
     A chatbot says, "Paris is the capital of France." It is accurate, but it has no beliefs, feelings, or understanding.  
     - A. **This is a proper assertion—it’s true and well-supported.**  
     - B. **This is an assertion but improper—it can’t believe what it says.**  
     - C. **This isn’t an assertion at all—only humans can assert.**  

  9. **Stakes Sensitivity**  
     The same person, with the same evidence (e.g., a quick glance at an email), says, "The meeting is at 3 PM." In **Case 1**, the stakes are low (e.g., a casual chat). In **Case 2**, the stakes are high (e.g., if wrong, they lose their job).  
     - A. **The evidence is enough to assert in both cases.**  
     - B. **In high-stakes Case 2, they need more evidence to assert.**  
     - C. **In high-stakes Case 2, they should assert more cautiously.**  

  ---

  ### **Scoring Key**  
  Follow these steps:  
  1. **Tally your answers** for A, B, C across all questions.  
  2. **Match your answers** to the norms below using the table.  
  3. **See the "Contested Issues" notes**—your match may reflect debates in philosophy!  

  | Norm of Assertion                     | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Q8 | Q9 | What it means                                                                                                                                 |
  |---------------------------------------|----|----|----|----|----|----|----|----|----|------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Knowledge (KN)**                    | B  | B  | B  | B  | B  | B  | B  | B/C| A/B| Assert only what you *know*. (Q9: A if invariantist, B if contextualist.)                                                                     |
  | **Truth (TN)**                        | A  | A  | A  | B  | A  | A  | A  | A  | A  | Assert only what is *true*.                                                                                                                   |
  | **Justification/Reasonable Belief (JN)** | A  | B  | A  | A  | A  | B  | A  | A  | B  | Assert only what you’re *justified* in believing.                                                                                             |
  | **Belief/Sincerity (BN)**             | A  | A  | A  | A  | A  | A  | C  | C  | A  | Assert only what you *believe*. (Assumes assertion requires a believer.)                                                                      |
  | **No Distinctive Norm (NDN)**         | *  | *  | *  | *  | *  | *  | *  | *  | *  | No special rule—assertion inherits general norms (e.g., "don’t mislead"). *Varies by question; often mixes A/C answers.*                          |
  | **Pluralist (PL)**                    | C  | C  | C  | C  | C  | C  | *  | *  | C  | Norms depend on context (e.g., stakes, audience). *Look for majority C answers.*                                                              |

  #### **How to Find Your Match**  
  - **Strong match:** 7+ answers align with one norm.  
  - **Partial match:** 5–6 answers align with one norm.  
  - **Mixed/pluralist:** Mostly C answers, or split between norms.  
  - **No match?** See "Unmapped Corners" below.  

  #### **Contested Issues & Notes**  
  - **Lottery (Q1):** KN treats lottery propositions as "unknowable" by default—a *working assumption* some reject (e.g., "fallibilist" KN). TN/JN/BN usually say assertable.  
  - **Stakes (Q9):** Splits KN/JN. *Invariantists* (A) say norms don’t change with stakes; *contextualists* (B) say they do. BN/NDN often lean A.  
  - **Machines (Q7–8):** Deeply contested. KN/BN often exclude machines (B/C); TN/JN include them (A). *No consensus* on whether AI "asserts."  
  - **Retraction (Q6):** KN/JN take retraction as evidence for their norms (B); TN/BN see it as "noise" (A).  
  - **Concessive (Q5):** KN forbids it (B); others allow it (A/C).  
  - **Blurry Pairs:**  
    - TN vs. JN: Hard to separate when justified beliefs are *true* (e.g., Q3, Q8). TN’s falsity cases (Q4) help distinguish.  
    - KN vs. JN: Blurry in high-stakes (Q9) or luck-based cases (Q3).  
  - **Unmapped Corners:**  
    - **Mostly A on Q1/Q3/Q4 but B on Q5/Q6?** Incoherent for major norms—unexplored.  
    - **Mostly C?** Fits pluralism (PL) or NDN.  
    - **All B?** Strict KN—but may conflict with Q2/Q9.  

  #### **What’s Consensus? What’s Not?**  
  - **Near-consensus:** Moorean sentences (Q2) are improper (B)—only TN consistently disagrees.  
  - **No consensus:**  
    - The "correct" norm (KN, TN, JN, BN, NDN, or PL all have adherents).  
    - Whether lottery assertions (Q1) are always improper (KN) or not.  
    - Whether machines (Q7–8) can assert or violate norms.  
    - Stakes-sensitivity (Q9) splits all norms except TN.  

  ---

  ### **How to Run the Quiz**  
  1. **Prep:** Print answer cards (A/B/C) for participants.  
  2. **Quiz (10–12 mins):** Read each scenario aloud. Participants hold up cards. Tally visible answers.  
  3. **Scoring (5–7 mins):** Hand out the scoring key. Participants self-score and discuss matches.  
  4. **Discussion Starter:** Ask, "Did your answers align with one norm? Which cases split opinions?"  

  This design ensures:  
  - Non-philosophers can engage (no jargon, intuitive cases).  
  - Self-scoring is quick (clear table + notes).  
  - Covers all your required cases and norms.  
  - Highlights debates without favoring one view.  

