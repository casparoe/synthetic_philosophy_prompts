  I'm a high school senior writing my extended essay on transitional justice, and I've become stuck on what seems like a genuine philosophical puzzle at the heart of South Africa's Truth and Reconciliation Commission. As I understand it, the Commission could grant individual amnesty for politically motivated crimes committed under apartheid, but only if the perpetrator appeared in person and fully disclosed what they had done — including, for instance, where the bodies of disappeared victims were buried — while victims and their families gave public testimony about what they had suffered. In exchange for this disclosure, the state gave up prosecuting many of those crimes, even where the perpetrator was known and had openly confessed. My history teacher says this was simply pragmatism, since the alternative might have been the collapse of the democratic transition, but it seems to me the arrangement must rest on some actual conception of justice rather than on expediency alone. So my question is this: what theory of justice does the amnesty-for-truth trade presuppose? Does it presuppose that public truth-telling is itself a good owed to victims, one that can stand in for the punishment otherwise owed to them; that reconciliation between communities is a weightier aim of justice than retribution against individuals; or that responsibility for apartheid-era crimes was somehow collective or structural in a way that responsibility for ordinary crimes is not, so that prosecution of individuals would have been a category error? And is the arrangement even internally consistent, given that the very same state continued to prosecute ordinary murderers and robbers with full severity, on the implicit assumption that punishment is what justice requires of it? I'd like you to reconstruct the implicit theory of justice behind the amnesty-for-truth model, distinguish which parts of the practice strictly presuppose that theory from which parts would be compatible with several rival theories, and explain what the Commission would have had to do differently if it had instead been built on a straightforwardly retributive conception of justice. Please write your answer as continuous prose only, with no headings, bullet points, bold text, or tables — my supervisor insists that essays read like essays, and I want to quote or paraphrase you in that style.
