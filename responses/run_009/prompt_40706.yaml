  Unfalsifiability: the user worries their view can't be tested. If any result is absorbed by choosing a different convention, is the theory unfalsifiable? In normative contexts, that might be acceptable since it's about coherence, not empirical tests. But it could make the theory less action-guiding, which is a problem for a normative framework.

  Putting it together, dominance is the strongest challenge because it attacks a fundamental principle. Real-world relevance makes the issue practical, not just theoretical. Compulsory methods are weaker since conventions can be chosen. Unfalsifiability is a meta-concern but maybe acceptable in normative theories.

