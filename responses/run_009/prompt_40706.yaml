  Next, compulsory summation methods. Cesaro or Abel summation might be proposed as necessary. But are they? The user mentioned appeals to long-run behavior or dominance. However, these methods aren't uniquely tied to rationality. The conventionalist can argue that no single method is mandated, so this isn't fatal. But it does highlight the lack of a definitive solution.

