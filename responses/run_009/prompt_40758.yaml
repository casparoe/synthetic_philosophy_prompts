  Okay, the user is a philosophy professor specializing in ethics and decision theory, preparing a graduate seminar on infinite ethics. They need a list of requirements for any adequate theory of infinite ethics, not just a survey of existing positions. The key is to provide criteria that students can use to evaluate theories, with each requirement tied to a motivating case.

  First, I need to consider the context. The theory must rank outcomes with infinitely many welfare subjects and align with finite axiology when only finitely many lives are involved. The professor mentioned specific cases: Parfit's Egypt adapted to infinity, the Corridor, and the Stutter. These are crucial for testing requirements.

  Starting with brainstorming candidate requirements. The basics include Finite Agreement (non-negotiable) to ensure consistency with finite cases. Then Cardinal Comparability—should the theory handle different cardinalities? The Egypt case suggests that adding lives to an infinite set shouldn't change the ranking, pointing to Permutation Invariance. The Corridor requires handling cases where additive sums fail, so maybe Strong Pareto or something similar. The Stutter problem highlights avoiding contradictions in dominance and cancellation, needing Consistency.

  Stress-testing each requirement. Finite Agreement must hold, but does it conflict with others? For Cardinal Comparability, if a theory can't compare different cardinalities, it might be paralyzed in cosmological contexts. But is that necessary? The professor wants to avoid conflating cardinality with intensity, so maybe this is camp-specific. Permutation Invariance seems solid from Egypt, but could there be cases where order matters? Probably not for axiology, so non-negotiable.

  The Corridor case: two infinite populations, one with an extra person at slightly lower welfare. Additive sums undefined, so the theory must decide if they're comparable. Strong Pareto would say the extra person makes it worse if welfare is lower, but what if the extra life is positive? This might require a nuanced Pareto principle. Also, incomparability vs. equal goodness—important not to collapse these.

  Stutter case: dominance and cancellation leading to a contradiction. Any theory must avoid this, so Consistency is non-negotiable. But how? Perhaps by restricting cancellation or dominance in infinite sets. This might conflict with other requirements. For example, if the theory allows reordering (Permutation Invariance) but also applies dominance, could that create Stutter-like issues? Yes, so the requirements must be chosen carefully.

  Now, the suspected conflict: Finite Agreement, Cardinal Comparability (for same cardinality), and Partition Invariance (invariance under redescription). If a theory must rank all same-cardinality outcomes and agree with finite cases while being partition-invariant, that might be impossible. For example, in Stutter, different partitions could lead to contradictions. So Partition Invariance might need to be relaxed. The professor mentioned this, so it's key to flag.

  Marking requirements: Finite Agreement, Consistency, Permutation Invariance as non-negotiable. Cardinal Comparability and Strong Pareto might be camp preferences. The most excluding requirement is likely Partition Invariance because many theories (like hyperreal) fail here.

  Assessing the three families: Hyperreal aggregation might satisfy Finite Agreement and some Pareto but fail Partition Invariance. Discounting approaches violate Finite Agreement by discounting finite parts. Lexicographic methods might handle some cases but struggle with incomparability and Stutter.

  Synthesizing, the list should include requirements with cases, note conflicts, and suggest dropping Partition Invariance if necessary. Highlight that Consistency with Finite Agreement and handling Stutter are critical, while comparability across cardinalities might be optional.
answer: |-
  Here is a specification of requirements for an adequate theory of infinite ethics, designed for critical evaluation of proposals. Requirements are derived from core philosophical/mathematical desiderata and stress-tested against your cases. **Bolded** requirements are non-negotiable for any theory aiming to fulfill your seminar's purpose. Others reflect significant but potentially contestable commitments. Conflicts are identified.

  ---

  ### Requirements for an Adequate Theory of Infinite Ethics

  1.  **Finite Agreement (FA)** [Non-negotiable]  
      *   **Motivation:** Core project context. A theory must replicate standard finite-population axiology (e.g., Pareto, Anonymity, separability) when comparing outcomes differing only in the welfare states of finitely many individuals.  
      *   **Case Test:** Adding a single happy life to a finite world must be strictly better (ceteris paribus); making one life worse must be strictly worse (ceteris paribus). Any deviation invalidates the theory for policy evaluation under uncertainty about infinity.

  2.  **Consistency (CONS)** [Non-negotiable]  
      *   **Motivation:** Avoid Stutter Paradox. The theory must not permit a world to be strictly better than itself via any sequence of dominance/cancellation steps applied over matched subpopulations. It must specify which standard reasoning step fails in infinite contexts.  
      *   **Case Test:** *The Stutter*. The theory must either declare the outcome unchanged throughout the sequence, declare key subpopulations incomparable, or identify the specific invalid inference (e.g., unrestricted cancellation over infinite sets) and prohibit it *on principled grounds*, not ad hoc fixes.

  3.  **Permutation Invariance (PI)** [Non-negotiable]  
      *   **Motivation:** Anonymity / Basic Axiological Intuition. The value of a world depends only on the *multiset* of welfare levels realized, not on the identities, locations, or orderings of individuals. Permuting welfare assignments across individuals leaves the world equally good.  
      *   **Case Test:** *Parfit's Egypt (Infinite)*. Adding an infinite number of lives at welfare level `w` to an *already infinite* population all at `w` results in a world containing the same multiset of welfare levels (infinitely many at `w`). Therefore, it must be judged *equally good*. A theory claiming it's better/worse violates PI. A theory declaring it incomparable must explain why PI fails for cardinality changes.

  4.  **Weak Pareto (WP)** [Non-negotiable]  
      *   **Motivation:** Basic Dominance. If every individual in a population is at least as well off in World A as in World B, and at least one individual is strictly better off, then World A is strictly better than World B.  
      *   **Case Test:** Any finite subpopulation comparison covered by FA. Also constrains infinite cases: if two worlds share the exact same infinite population and A is better for some and worse for none, A is strictly better.

  5.  **Distinguish Equal/Incomparable (DEI)** [Camp Preference, but highly recommended]  
      *   **Motivation:** Prevent conceptual collapse. The theory must clearly distinguish between outcomes being *equally good* (a positive verdict of equivalence) and being *incomparable* (a failure to rank them). Conflating them obscures genuine normative uncertainty or theoretical limitation.  
      *   **Case Test:** *The Corridor*. A verdict on whether Future A (∞ excellent lives) and Future B (∞ excellent lives + 1 slightly less excellent life) are equally good, incomparable, or one better than the other must be explicit. Silence or treating "incomparable" as "equally good" violates DEI.

  6.  **Cardinality Agnosticism vs Comparability (CAC)** [Camp Preference]  
      *   **Motivation:** Practicality vs. Prudence. *Option 1 (Agnostic):* The theory must explain why comparisons involving different infinite cardinalities (e.g., countable vs. continuum) are impossible or meaningless *without* paralyzing policy evaluation in cosmologically realistic scenarios (which may involve fixed, known cardinalities). *Option 2 (Comparable):* The theory must provide a principled way to compare outcomes with different infinite cardinalities.  
      *   **Case Test:** Comparing a world with countably infinite happy lives vs. continuum-many identical happy lives. Agnosticism requires explaining why this doesn't block needed comparisons (e.g., if cosmologies imply fixed cardinality). Comparability requires a non-arbitrary method.

  7.  **Partition Invariance (ParI)** [Camp Preference]  
      *   **Motivation:** Robustness / Non-arbitrariness. The relative goodness of two worlds should not depend on how the populations are partitioned into "individuals" or described, provided the underlying pattern of welfare is identical. Value supervenes on the distribution of welfare, not its ontological packaging.  
      *   **Case Test:** Consider a world described as infinitely many individuals each at welfare `w`. Redescribe it as pairs of individuals fused into single entities at welfare `2w` (assuming appropriate inter-theoretic welfare aggregation). Is the fused world equally good? ParI demands it must be. *Stutter often exploits violations of ParI.*

  8.  **Strong Pareto or Extended Dominance (SP/ED)** [Camp Preference]  
      *   **Motivation:** Strengthening dominance reasoning. *SP:* If World A is at least as good as World B for every individual and strictly better for some, then A is strictly better. *ED:* If World A can be obtained from World B by a finite sequence of changes, each of which is weakly Pareto improving and at least one strictly Pareto improving, then A is strictly better.  
      *   **Case Test:** *The Corridor*. SP would typically demand that Future B is *strictly worse* than Future A (due to the single worse-off life, all others equal). ED might reach the same conclusion via adding that life being a Pareto worsening step. Theories rejecting SP/ED for this case (e.g., declaring incomparability) must justify why the single life's welfare difference is decisive/indecisive.

  ---

  ### The Inherent Conflict: The Impossibility Trilemma

  The requirements **Finite Agreement (FA)**, **Permutation Invariance (PI)**, and **Partition Invariance (ParI)** are **jointly incompatible** with the demand for a **complete ordering** over all infinite outcomes of the same cardinality, as demonstrated by variations of *The Stutter* and *Egypt* cases.

  *   **The Core Issue:** FA and PI (driven by *Egypt*) force the addition of infinite "copies" of a welfare state not to change value. ParI demands that repackaging welfare (e.g., splitting or fusing lives) doesn't change value. These principles, applied to carefully constructed infinite sets using bijections and repartitioning, can generate sequences where dominance reasoning (WP/SP) combined with FA, PI, and ParI forces `A > B > ... > A`, violating **Consistency (CONS)**. Blocking this contradiction requires rejecting one principle or limiting comparability (denying completeness).
  *   **Resolution Choice:** **Partition Invariance (ParI) is the most defensible requirement to relax.** While intuitive, its strict application is highly sensitive to the metaphysics of individuation, which is arguably not what axiology should fundamentally depend on. Relaxing ParI allows theories to anchor value in a *specific* individuation scheme (e.g., fundamental particles or conscious moments) without collapsing into contradiction. FA and PI are more fundamental to the coherence of the project and agreement with core intuitions in finite ethics and infinite extensions like *Egypt*.
  *   **Consequence:** Requiring FA, PI, *and* ParI *forces* either incomparability in many cases (violating completeness demands) or inconsistency. **Dropping strict ParI is the necessary price for consistency and comparability.** A theory must then specify its fundamental individuation scheme.

  **Most Excluding Requirement:** **Permutation Invariance (PI)** is the single requirement that most aggressively excludes popular candidates. Theories relying on:
  *   **Location/Order-Dependence:** (e.g., some discounting or averaging schemes) fail PI immediately (*Egypt*).
  *   **Hyperreal Aggregation:** Often struggle with PI unless specifically constructed to satisfy it (many aren't, treating different orderings of the same welfare multiset as different hyperreals).
  *   **Density-Based Approaches:** May violate PI if value depends on the ordering or arrangement of welfare states.

  ---

  ### Brief Evaluation of Theoretical Families Against Key Requirements

  1.  **Hyperreal/Nonstandard Aggregation:**
      *   *FA:* Can satisfy if finite sums are standard reals.
      * *PI:* Often fails unless carefully designed; order/arrangement can affect the "sum".
      * *CONS/Stutter:* Vulnerable without restrictions; can permit `A > B > ... > A` via differing summations under rearrangement/partitioning. *Requires rejecting ParI.*
      * *DEI/Corridor:* Typically declares comparable, often ranking B worse than A via SP.
      * *CAC:* Struggles fundamentally with different cardinalities; hyperreals model countable sequences.
  2.  **Discounting (e.g., Discounted Actualist Value):**
      *   *FA:* Fundamentally violates. Discounting future finite populations makes their value less than undiscounted value, contradicting standard finite axiology where time shouldn't matter absent special assumptions.
      * *PI:* Violates (*Egypt*); adding discounted distant lives changes value.
      * *CONS/Stutter:* May avoid via discounting making changes negligible, but often inconsistent in other ways.
      * *DEI/Corridor:* Usually comparable, ranks B worse if the extra life is later/discounted.
      * *CAC:* Typically only defined for countable sequences.
  3.  **Lexicographic/Pareto (e.g., with Representative Sequences):**
      *   *FA:* Can satisfy.
      * *PI:* Can satisfy if sequences are order-insensitive (e.g., focus on welfare multiset properties).
      * *CONS/Stutter:* Can avoid by restricting cancellation or focusing on asymptotic/limiting behavior.
      * *DEI/Corridor:* Often declares incomparable (if sequences are identical except finite differences) *or* invokes SP to rank B worse (if the extra life is included in the comparison). DEI demands clarity.
      * *CAC:* Often limited to countable sets; struggles with higher cardinalities.
      * *ParI:* Often violated; repartitioning can change "representative" sequences drastically.

  ---

  This specification provides the critical framework for your seminar. The identified conflict (FA, PI, ParI) and the necessity of choosing to relax ParI highlight the foundational choices theorists must make, moving students beyond surveying positions to evaluating their core commitments and costs.
