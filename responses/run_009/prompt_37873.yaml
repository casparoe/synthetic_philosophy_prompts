answer: |-
  ## Joint Statement on Historical Judgment and Moral Distance  
  **Agreed by Professor Eleanor Vance (Presentist) and Dr. Rupert Thorne (Anti-Presentist)**  
  *For the Departmental Seminar, October 2024*

  **Section 1: Shared Foundations of Historical Practice**

  We, the undersigned, affirm the following points of agreement regarding the historian’s task and the pitfalls inherent in our respective approaches:

  1.  **Contextual Understanding is Fundamental:** Both approaches require rigorous contextual reconstruction as the bedrock of historical explanation. Understanding the material conditions, prevailing beliefs, institutional structures, and available conceptual resources of a past society is indispensable for making past actions and decisions intelligible.
  2.  **Historical Explanation Aims at Intelligibility:** The primary goal of historical inquiry is to render past actions, events, and mentalities comprehensible within their specific historical setting. This involves explaining *why* agents acted as they did, given their circumstances, beliefs, and options as they perceived them.
  3.  **Both Approaches Risk Intellectual Vice:** We acknowledge the dangers inherent in each other’s positions:
      *   **Presentism risks "Smug Condescension":** Applying contemporary moral judgments anachronistically can manifest as self-congratulatory hindsight, obscuring historical contingency and the genuine constraints faced by past actors. This can lead to a simplistic "triumph of progress" narrative where the historian implicitly celebrates their own good fortune in being born later.
      *   **Anti-Presentism risks "Complicit Condescension":** An exclusive focus on contextual intelligibility, without acknowledging the suffering caused by past actions judged abhorrent today, can appear as excessive sympathy for perpetrators or systems of oppression. This risks minimising historical injustice and can be perceived as exculpatory, fostering a detached relativism that evades necessary moral reckoning.
  4.  **Bad History Exists in Both Modes:** We reject triumphalist, teleological narratives that portray history as a simplistic march towards present values ("Whiggish" history). Similarly, we reject histories that use contextual understanding solely to apologise for or rehabilitate systems now widely condemned. Good history, regardless of approach, avoids caricature and seeks nuanced understanding.
  5.  **The Past Matters for the Present:** History is not merely antiquarian. Understanding the past is vital for comprehending the origins and persistence of present structures, inequalities, and moral frameworks. It informs contemporary ethical and political discourse.

  **Section 2: Precise Points of Disagreement**

  We continue to disagree fundamentally on the following points, each stated in terms acceptable to the proponent of the view:

  2.1.  **Dr. Thorne (Anti-Presentist):** Historical understanding, properly conceived, requires the suspension of contemporary moral *blame* as a primary analytical tool when engaging with sufficiently distant pasts. The historian's core task is explanatory reconstruction within the agents' own conceptual and ethical horizons; imposing alien moral categories for the purpose of condemnation distorts understanding and replaces historical explanation with present-day moralising. *(Presentist accepts this phrasing as accurate for Anti-Presentist view)*
  2.2.  **Prof. Vance (Presentist):** Moral appraisal, informed by our best contemporary ethical understanding, is a constitutive, indispensable element of fully understanding historical actions, especially those involving significant harm or injustice. To withhold such judgment in the name of context is, in effect, to engage in a form of quiet exculpation and to fail history's engagement with the present. *(Anti-Presentist accepts this phrasing as accurate for Presentist view)*
  2.3.  **Dr. Thorne (Anti-Presentist):** Bernard Williams's concept of the "relativism of distance" strengthens the case against presentist moral *blame* by arguing that for societies significantly remote from our own ethical life, such judgments lose their practical *point* and motivational force (becoming "notions in the air"), even if they retain a theoretical truth-value. This underscores that demanding intelligibility in their own terms is distinct from, and prior to, the optional act of retrospective condemnation. *(Presentist accepts this phrasing)*
  2.4.  **Prof. Vance (Presentist):** While acknowledging that crude, triumphalist, or self-congratulatory presentism is bad history, the necessary corrective is *better* presentism – historically rigorous and self-aware, but unapologetic in its use of evolved moral understanding to identify and condemn past injustice. Abandoning moral judgment altogether is an unacceptable surrender to relativism. *(Anti-Presentist accepts this phrasing)*

  **Section 3: Cruxes and Test Cases**

  Our core disagreements hinge on the following conceptual issues, which can be explored through concrete historiographical examples:

  3.1.  **Crux: Is moral appraisal a constitutive part of historical understanding or merely an optional add-on?**
      *   **Case Study:** The Historiography of Slavery (particularly Atlantic chattel slavery, 16th-19th centuries).
      *   **Prof. Vance (Presentist) Prediction:** A rigorous study incorporating explicit moral condemnation based on the inherent violation of human dignity and autonomy (core values deeply informing our present understanding of justice) will yield a *fuller* and *more truthful* historical account. It will illuminate the *profound moral catastrophe* in a way pure contextual description of economic logic or contemporary racial ideologies cannot, forcing confrontation with the lived reality of suffering and resistance, and clarifying its enduring legacy.
      *   **Dr. Thorne (Anti-Presentist) Prediction:** A rigorous study focused on reconstructing the complex ideological, economic, religious, and legal frameworks that made slavery appear legitimate, necessary, or even divinely ordained to historical actors (including many abolitionists who held racist views) will yield a *deeper* and *more accurate* understanding of *how* such a system persisted and functioned. Explicit presentist condemnation, while understandable emotionally, risks flattening this complexity, obscuring the genuine challenge faced by nascent moral critiques within that context, and hindering our grasp of the system's internal logic and resistance to change. Moral judgment is a *response* to this understanding, not its foundation.

  3.2.  **Crux: Is blame of past agents coherent unless we can say they had some access to the standards they violated?**
      *   **Case Study:** The historiography of pre-Enlightenment persecution (e.g., witch trials, religious persecution in Reformation Europe).
      *   **Prof. Vance (Presentist) Position:** Coherence of blame does not strictly depend on the agent having access to *our specific* articulated standards. Blame is coherent if the action caused profound suffering, violated fundamental human interests (e.g., freedom from torture, right to life), and especially if *contemporaneous critiques or alternative viewpoints existed* (even if marginalised), demonstrating that the moral failing was not utterly inconceivable within that world. The *nature* of the harm grounds the blame.
      *   **Dr. Thorne (Anti-Presentist) Position:** Coherent blame requires the agent could reasonably have been expected to recognise the wrongness of their actions *within their own epistemic and ethical context*. Where the prevailing worldview offered no conceptual space for an alternative (e.g., the reality of witchcraft and demonic pacts being near-universally accepted dogma), or where dissent was systematically suppressed to the point of invisibility, applying blame becomes anachronistic and incoherent as a historical explanation. Explanation focuses on *why* those beliefs held such power, not blaming individuals for holding them.

  **Addressing Complications:**

  *   **Williams's Relativism of Distance (Point 2.3):** We agree Williams strengthens Dr. Thorne's core argument against presentist *blame* for remote pasts by shifting the critique from truth-value to *practical pointlessness*. It reinforces the anti-presentist insistence that the historian's primary task is explanatory intelligibility, not retroactive moral sanction for distant eras. However, Prof. Vance argues it does not negate the value of moral *characterisation* (distinguishing harmful from benign practices) for understanding historical trajectories and legacies.
  *   **Concession on Bad Presentism (Point 2.4):** Prof. Vance's concession that some presentism is bad clarifies that the disagreement is *not* about whether crude moralising is acceptable (both reject it), but about whether *any* form of presentist moral judgment is intrinsic to good historical practice concerning significant past harms. Dr. Thorne argues that even "better" presentism inevitably distorts by prioritising contemporary judgment over contextual reconstruction. The crux remains whether presentist moral appraisal is *constitutive* (Vance) or *extraneous/potentially distorting* (Thorne) to core historical understanding.

  **Potential Talking-Past-Each-Other:**

  We acknowledge a risk of miscommunication on two points:
  1.  **The Meaning of "Understanding":** Prof. Vance includes moral characterisation as *part* of full understanding ("We cannot *truly* understand slavery without recognising it as a profound evil"). Dr. Thorne sees moral characterisation as a *separate act* performed *after* achieving historical understanding through contextual reconstruction ("We must first understand *how* it functioned and was perceived before we can *then* characterise it morally from our vantage point").
  2.  **The Target of "Blame":** Prof. Vance often focuses blame on *systems*, *institutions*, and the *actions* of powerful actors perpetuating harm, seeing individual culpability as part of that. Dr. Thorne interprets "blame" as primarily directed at *individual moral agents*, arguing that systemic analysis is crucial but distinct from assigning personal culpability across vast temporal distances.

  **Signed:**

  Professor Eleanor Vance  
  Dr. Rupert Thorne  
  Date: 26 October 2024
