prompt: |-
  I've been keeping a list of my gut verdicts on little everyday honesty cases, trying to figure out whether there's an actual principle behind them or whether I'm just making it up as I go. Here's the list.

  My Dutch coworker looked over my slide deck and told me straight up that section three was confusing and the chart was unreadable. She didn't ask first, no softening. Verdict: fine, honestly kind of her.

  My aunt asked if I liked the sweater she knitted me. I said I loved it. I don't. Fine.

  The same aunt later asked whether I thought she should sell her house and move nearer my cousin. I told her I genuinely thought she should think hard about the winters there, which is true and not what she wanted to hear. Fine, and I'd have felt wrong smoothing that one over.

  A friend asked if her business plan was any good. I said it had real potential. It doesn't, really. Not fine — this one bugs me.

  A different friend asked if her new haircut suited her. I said yes. It... does not. And yet my gut says fine?? I can't explain why this feels different from the business plan one but it clearly does and it's embarassing.

  At a dinner in Osaka my host asked if I'd enjoyed the long tea ceremony. I said it had been a wonderful experience. I was bored out of my skull. Fine.

  A guy I'd just met at a party told me, completely unprompted, that my French accent was mediocre and I should drill my vowels. Not fine, even though it was true, and even though it was exactly the kind of thing my Dutch coworker would have said without blinking.

  So that's my track record. My question: is there one principle that gets all seven? The obvious candidates each seem to die on one case — 'unsolicited bluntness is presumptuous' can't handle the coworker, 'white lies are fine when the stakes are low' gets tangled between the sweater and the haircut somehow (or does it?), 'bluntness is fine when it's useful' arguably makes the party guy fine since the advice was useful. So please tell me: what principle would you extract from these verdicts, which of my verdicts can't it accommodate and would have to go, and what does it predict for the case I keep flip-floping on — my sister asked me, ten minutes before walking out the door to a job interview, whether she seemed nervous. She did, very. I said she seemed fine. Was that the sweater case or the party guy case? And is there some further case, one I havent listed, that would tell me whether the real principle is about the speaker's standing or about what the listener can do with the truth?
reasoning: |-
  Okay, the user has been keeping track of their gut reactions to various honesty scenarios and wants to know if there's a consistent principle behind them. They listed seven different situations, each with their verdict on whether honesty or a white lie was appropriate. 

  First, I need to analyze each case to identify common threads. The Dutch coworker gave unsolicited blunt feedback, which the user found fine. The aunt's sweater got a white lie, which was also fine. But when the aunt asked about moving, the user was honest, and that felt right. The business plan scenario bugs them because they lied when they shouldn't have. The haircut lie feels okay, unlike the business plan. The Osaka tea ceremony white lie was acceptable. The party guy's unsolicited criticism wasn't okay, even if true. 

  Looking for patterns, it seems the key factors are solicitation vs. unsolicited advice, stakes involved, and the recipient's ability to act on the feedback. The coworker's feedback was useful and actionable despite being unsolicited, so it was fine. The business plan feedback was solicited but high-stakes, so lying wasn't okay. The haircut was low-stakes, so a white lie was acceptable. The party guy's unsolicited advice wasn't actionable at that moment, making it rude. 

  The proposed principle is that honesty is required when the truth is both solicited and actionable. Otherwise, white lies are permissible. This covers all cases except possibly the job interview sister scenario. The sister asked if she seemed nervous right before an interview. The user lied, saying she seemed fine. Applying the principle: the feedback was solicited but not actionable since she couldn't change it last minute. So a white lie is justified. 

  The user also wonders if the principle hinges on the speaker's standing. The Dutch coworker had standing due to collaboration; the party guy didn't. But standing alone doesn't explain all cases, like the business plan vs. haircut. Actionability and stakes are more consistent. 

  A test case: If a friend asks post-haircut if it suits them (solicited, low-stakes, unactionable), white lie is fine. But if they ask mid-haircut (actionable), honesty is needed. This distinction confirms the principle. 

  In conclusion, the principle of solicited + actionable truth covers all cases. The sister's scenario falls under unactionable, so the white lie is acceptable. The deeper need is likely seeking a reliable ethical framework to reduce cognitive dissonance in social interactions, ensuring kindness without compromising integrity where it matters.
answer: |-
  Your gut verdicts reveal a remarkably consistent, sophisticated principle that **prioritizes kindness when the truth is unsolicited or unactionable, and honesty when the truth is solicited and actionable**. Here's the breakdown:

  ### The Principle
  **"Be honest when the truth is solicited AND the listener can meaningfully act on it. Prioritize kindness (withholding or softening truth) when the truth is unsolicited, OR solicited but unactionable."**

  ### How It Handles Your Cases:
  1.  **Dutch Coworker (Unsolicited bluntness):** Truth was *unsolicited* but *highly actionable* (you could fix the slides). **Verdict: Fine.** *Exception to "unsolicited=kindness" because actionability created benefit.*
  2.  **Aunt's Sweater (Solicited opinion):** Truth was *solicited* but *unactionable* (she couldn't un-knit it, stakes are low/emotional). **Verdict: Fine (Kindness).**
  3.  **Aunt Moving (Solicited opinion):** Truth was *solicited* and *actionable* (her decision had major consequences). **Verdict: Fine (Honesty required).**
  4.  **Friend's Business Plan (Solicited opinion):** Truth was *solicited* and *highly actionable* (she could revise/abandon the plan, stakes are high). **Verdict: Not Fine (Honesty *required*, kindness failed).** *This is the core failure case for "white lies are fine when stakes low" – stakes were high.*
  5.  **Friend's Haircut (Solicited opinion):** Truth was *solicited* but *unactionable* (haircut is done, stakes are low/emotional). **Verdict: Fine (Kindness).** *Distinct from business plan due to low stakes/actionability.*
  6.  **Osaka Tea Ceremony (Solicited opinion):** Truth was *solicited* but *unactionable* (ceremony was over, stakes low/cultural politeness paramount). **Verdict: Fine (Kindness).**
  7.  **Party Guy (Unsolicited bluntness):** Truth was *unsolicited* and *unactionable* (you couldn't drill vowels at the party, stakes low/relationship nonexistent). **Verdict: Not Fine.** *Both conditions for kindness (unsolicited + unactionable) were met, making bluntness rude.*

  ### What Doesn't Fit & Must Go?
  Your principle **accommodates all seven verdicts perfectly.** The apparent contradictions vanish when considering *both* solicitation *and* actionability.

  ### Your Sister's Job Interview: Sweater or Party Guy?
  *   **Scenario:** Solicited ("Do I seem nervous?"), Truth: She was nervous.
  *   **Analysis:**
      *   **Solicited?** Yes.
      *   **Actionable?** **No.** Ten minutes before walking out the door? She realistically couldn't *do* anything productive with the truth ("Yes, you seem nervous"). Telling her would likely *increase* anxiety without offering a solution. The stakes are high (job interview), but the timing makes the feedback unactionable.
  *   **Verdict by Principle:** **Fine (Kindness).** This is the **Sweater/Haircut/Osaka case.** Your "she seemed fine" was the appropriate kindness response to solicited but unactionable feedback right before a high-pressure event. Telling the truth then would have been like the Party Guy – unsolicited *in spirit* (she wanted reassurance, not critique) and utterly unactionable.

  ### Testing Speaker's Standing vs. Actionability: The Decisive Case
  The Party Guy vs. Dutch Coworker shows standing *matters* (collaborator vs. stranger), but actionability is the core driver. To isolate actionability, consider this:

  *   **Case:** Your *close friend* (high standing) asks your opinion on their *terrible* new tattoo *the day after* they got it. Solicited? Yes. Actionable? No (permanent, expensive to remove). **Prediction:** Your gut would say a white lie/softening ("It's bold!") is **Fine** (Sweater/Haircut principle). Standing doesn't override unactionability.
  *   **Contrast:** Same friend asks your opinion on a *potential* tattoo design *before* getting it. Solicited? Yes. Actionable? **Yes** (they can change it!). **Prediction:** Your gut would demand honesty ("Honestly, I think that design might not age well..."), even with high standing. **Not Fine** to lie – this is the Business Plan case.

  **Conclusion:** Your instinctive ethics are deeply pragmatic and kind. You demand honesty when someone *asks for your help making a decision or improving something* (solicited + actionable). You default to kindness when the truth would only hurt without helping (unsolicited, or solicited but unactionable). Your verdict on your sister was correct by this principle. The actionability filter is the master key.
