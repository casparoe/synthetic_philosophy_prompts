prompt: |-
  I'm in a historical sociology course and we just spent two weeks on the Protestant ethic thesis -- the Weber idea that ascetic Protestantism, with its anxiety over election and its sanctification of disciplined labor, helped produce the "spirit" of capitalism and with it the actual practice of accumulation. My flatmate, who's an econ student, thinks the whole thing is unfalsifiable hand-waving: rich areas become Protestant, or Protestants just happened to live where commerce was already taking off, and the doctrine is decoration. My professor keeps gesturing at "elective affinity" and "adequate causality" as if those phrases settle something, but honestly neither side ever stops to say what would even COUNT as a culture-first explanation succeeding. So before I go back into the literature, I want the spec first.

  Write me the desiderata: what any explanation of a large-scale economic or social outcome that appeals to cultural values -- religious doctrine, ethical ideals, informal norms -- has to deliver to count as genuinely causal rather than a just-so story. I'd want you to think about things like: how it distinguishes values causing behavior from values rationalizing behavior that economic incentives already explain; whether it owes us a mechanism at the level of individual psychology (how does a doctrine about the afterlife become a habitual disposition toward profit?) or whether aggregate-level evidence of correlation plus timing is enough; what it has to say about the counterfactual (no Reformation, or a Lutheranism without predestination-anxiety -- what happens to capitalism, and how could we ever check); how it handles the fact that capitalism eventually thrived everywhere, including places with completely different religious traditions, which cuts both ways for the thesis; and whether it needs to explain the timing and geography of the outcome, not just its existence. Give the case behind each requirement, mark which are non-negotiable and which are just what one camp (economists, Weberians, the institutional people) happens to care about, and tell me if you think some subset of the desiderata is jointly unsatisfiable -- like whether demanding a fine-grained psychological mechanism is even compatible with a claim about slow, diffuse, century-scale outcomes, since that tension seems to be doing a lot of unacknowledged work in these debates.

  Then, briefly, score the three obvious contenders against your own list: Weber's actual thesis (as distinct from the pop version where Protestantism single-handedly caused capitalism), a materialist/incentive explanation where doctrine is downstream, and an institutional one where both culture and commerce ride on things like contract enforcement and city autonomy. Keep that part short though -- it's the requirements I actually need, since my essay is supposed to argue about the standard of evaluation itself, not do another audit of Weber. A table is fine for the scorecard if that's easier.
