prompt: |-
  I want you to take on the role of a philosopher of mind who has also genuinely coached athletes at a high level for years -- someone who knows the literature cold but thinks in training-log vocabulary day to day. Before you answer, do a bit of brainstorming and show me you've thought about it, because I keep getting replies that are just summaries of the books, and I can read.

  Here's my situation. I've coached competitive swimming for about fifteen years, and my degree was in philosophy, a long time ago now. Recently I got pulled back into this old debate: Gilbert Ryle, mid-twentieth century, claiming that knowing how to do something isn't a species of propositional knowledge -- treating abilities as knowledge of facts was, he thought, a kind of category mistake. Then around 2001 Stanley and Williamson argued pretty much the opposite: knowing how to F is knowing a proposition -- that some way w is a way in which one could F -- just grasped in some practical manner rather than a theoretical one. And apparently Stanley himself later half-changed his mind in a book, which doesn't help me. The honest truth is I can't map any of this onto what I actually do at the pool, and I want to know whether that's my failure or theirs.

  So: restate the whole debate in my vocabulary. The stuff I actually work with, roughly:

  - internal vs external focus of attention (telling a swimmer to reach long and loose over the water vs telling them their elbow should be at such-and-such an angle at hand entry)
  - chunking and automaticity, and the way elite swimmers lose access to the components of their own technique -- ask them what their catch does and they genuinely don't know
  - explicit vs implicit learning, and what happens when you make novices follow verbal rules
  - choking under pressure, paralysis by analysis, the yips
  - the gap between a swimmer who can perform a skill and one who can produce it in a race when it matters
  - the fact that I can see a fault in someone's stroke I can't articulate, and fix it with a drill I couldn't justify on paper
  - kids who can do it but can't coach it, and ex-swimmers who can coach it but could never do it

  Then the residue report, which is the part I actually care about, and I'd like it kept seperate from the translation itself:

  1. What translates cleanly -- which philosophical moves have obvious counterparts. (I suspect Ryle's regress, the one about applying a rule needing a further rule for applying it, is just paralysis by analysis under another name -- but check that, don't take my word for it.)
  2. What translates only with distortion -- where the philosophical claim has to be bent to fit, and say exactly what is bending.
  3. What has no expression at all in coaching vocabulary. My hunch is the normative bit is the candidate here -- whatever makes an ability count as knowledge rather than mere knack -- since nothing in my world distinguishes a reliable swimmer from one who knows how to swim. But think it through properly.
  4. Your verdict, and don't sit on the fence: does the residue show my vocabulary is missing something, or that the philosophical debate was less substantive than it looked? I'll respect you more either way.

  Two honesty requirements whilst you're at it. First, don't smuggle my assumptions in as if they were translation -- if a coaching concept already assumes knowing-how is non-propositional, flag it rather than quietly using it to settle the arguement. Second, if you think the intellectualist position would make some concrete prediction about my job (say, that a sufficiently good verbal instruction could stand in for a drill), spell it out, because that's the sort of thing I can actually test at the pool.
