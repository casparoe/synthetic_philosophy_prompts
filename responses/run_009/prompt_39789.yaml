  Alright, let me tackle this problem. The user is in a graduate seminar on ethics and philosophy of language, focusing on lying versus misleading. Their friend presents an argument that misleading isn't wrong in the same way lying is, and the user finds this suspicious but can't pinpoint why.

  First, I need to understand each step of the friend's argument. Premise (1) defines lying as asserting something believed false. Premise (2) ties the wrongness of lying to violating the norm of assertion—asserting only what you believe. Premise (3) says misleaders only assert true things but engineer false inferences. Premise (4) states an act can't be wrong by violating a norm it doesn't violate. From there, (5) concludes misleading lacks the distinctive wrongness of lying, and (6) claims a moral asymmetry where misleading is permissible when lying isn't. Step (7) adds that misleaders are no more criticizable than those who stay silent.

  The user's unease centers on steps (4) to (6). They worry this logic absolves anyone causing false beliefs without false assertions—like tampering with evidence or strategic deception. Also, the move from (5) (misleading lacks one wrongness) to (6) (it's permissible) seems too quick. Plus, the argument can't address the "cowardice" critique where misleaders avoid accountability.

  Key issues: Premise (4) seems solid but might be misapplied. The norm of assertion isn't the only relevant norm; deceiving could violate other ethical norms, like respect or avoiding harm. So (4) is true, but it doesn't preclude other wrongs. The inference from (5) to (6) is problematic. Just because misleading lacks the wrongness of violating assertion norms doesn't mean it's permissible overall. There might be other ethical violations at play.

  Rejecting the inference from (5) to (6) makes sense. It commits a fallacy by assuming that lacking one specific wrongness implies no wrongness at all. This preserves the core idea that lying has a unique wrongness from norm violation but allows that misleading can still be wrong for other reasons. The cost is we lose a clean moral asymmetry where misleading is always permissible when lying isn't. But we keep a nuanced asymmetry: lying is pro tanto worse due to the extra violation, but misleading might still be impermissible based on context, intentions, or consequences.

  Alternative rejections: Challenging (2) would require a different account of lying's wrongness, which complicates the asymmetry. Denying (4) is implausible. Rejecting (3) would be too narrow. So blocking the inference from (5) to (6) is the best path, maintaining the distinctive wrongness of lying while acknowledging misleading can be wrong in other ways.
answer: |-
  Your unease is well-founded: the argument relies on a subtle but crucial overreach in its inference from (5) to (6). Here's the breakdown, step by step:

  1.  **Steps (1)-(3) and (4)-(5) are largely defensible within the framework:** The definition of lying (1), the claim about the norm of assertion and its role in lying's distinctive wrongness (2), the characterization of misleading (3), and the platitude that an act can't be wrong *by violating a norm it doesn't violate* (4) are all plausible starting points. The conclusion that misleading lacks the *distinctive wrong of lying* (the wrong of breaking the assertion guarantee) (5) follows logically from these premises. This core asymmetry – that lying uniquely violates the norm of assertion and thus carries a specific kind of normative defect – is coherent and shared by many philosophers (e.g., adherents of a strong "knowledge norm" or "warranted belief norm" of assertion).

  2.  **The Fatal Flaw: The Inference from (5) to (6)**
      *   **What (5) Says:** Misleading lacks the *distinctive wrongness of lying*, namely, the wrongness *derived from violating the norm of assertion*.
      *   **What (6) Says:** Misleading acts are "permissible" *simpliciter* whenever lying would be wrong and misleading is available. This claims misleading lacks *any* wrongness *relevant to the deception* in those contexts.
      *   **The Overreach:** The inference tacitly assumes that violating the norm of assertion is the *only possible source of wrongness* relevant to deceptive communication. Premise (5) establishes that misleading lacks *one specific wrong-making feature* (violating the assertion norm). Premise (6) illicitly concludes that misleading therefore lacks *any wrong-making features whatsoever* in the relevant contexts. This ignores the possibility that misleading could be wrong for *other reasons*, even if it doesn't carry the distinctive wrong of breaking an assertion guarantee.
      *   **Why it Looks Fine (Initially):** The argument focuses intensely on the norm of assertion as the source of the *distinctive* wrong in lying. It's easy, within that narrow focus, to slide from "lacks *this* wrong" to "lacks *a* wrong (in this domain)". The structure suggests that if the distinctive wrong of lying is off the table, and misleading achieves the same end (deception), it must be permissible. But this ignores the *means* used to achieve that end.

  3.  **The Cost of Rejecting the Inference (5) to (6):**
      *   **Cost to Your Friend's Argument:** It collapses her strong conclusion (6). She cannot claim that misleading is *always* permissible whenever lying would be wrong. She must concede that misleading *might* still be wrong, albeit for different reasons than lying.
      *   **Cost to Maintaining a (Modified) Asymmetry:** It doesn't destroy the *core* asymmetry identified in (1)-(5). We can still hold:
          *   Lying involves a *unique* normative defect: violating the norm of assertion and breaking the guarantee inherent in asserting. This is a *pro tanto* wrong (a wrong-making feature that must be overcome by justification).
          *   Misleading lacks *this specific* wrong-making feature.
          *   However, misleading might still be *pro tanto* wrong for *other* reasons, such as:
              *   **Intent to Deceive:** Deliberately causing a false belief in another person might be inherently objectionable, violating norms of respect, honesty (in a broader sense), or beneficence, independent of how it's done (asserting falsehoods vs. manipulating context). This addresses the "cowardice" intuition – the misleader avoids the explicit commitment and accountability of assertion while still achieving the deceptive goal.
              *   **Exploitation:** Misleading often exploits the audience's reasonable expectations about communication, cooperation, or context. The speaker relies on shared conversational norms (Gricean maxims, especially Relevance and Quantity) to *ensure* the false inference is drawn, manipulating the cooperative framework of communication for deceptive ends.
              *   **Consequences:** The harmful consequences of deception might be identical whether achieved by lying or misleading, and consequences are often morally relevant.
      *   **The Preserved Asymmetry:** Lying has an *extra* wrong-making feature (the norm of assertion violation) that misleading lacks. Therefore, *all else being equal* (same intent, same consequences), lying is *worse* than misleading. But misleading isn't thereby *permissible*; it might still be wrong, just *less* wrong than lying in virtue of lacking that specific defect. The "clean conscience" in the murderer case isn't guaranteed; it depends on whether the *intentional deception itself* is justified in that extreme situation, irrespective of the assertion norm violation.

  4.  **Why Rejecting Other Premises is Less Appealing (or More Costly):**
      *   **Rejecting (2):** Denying that the norm of assertion violation is the *distinctive* source of lying's wrongness requires offering an alternative account (e.g., pure Kantian universalization, pure consequentialism, a different norm like sincerity). This fundamentally alters the structure of the asymmetry argument and potentially makes it harder to explain *why* lying feels different from other deceptions. It's a bigger theoretical shift.
      *   **Rejecting (3):** Insisting that misleaders *do* assert something false (perhaps via implicature) is a contentious view in philosophy of language ("what is said" vs. "what is implicated"). It collapses the lying/misleading distinction entirely, which is highly counterintuitive and undermines the whole debate. The distinction *feels* real and linguistically demonstrable.
      *   **Rejecting (4):** This platitude is extremely hard to deny. An act can't be wrong *because* it violates a norm that it doesn't actually violate.
      *   **Rejecting (1):** Modifying the definition of lying (e.g., to include some misleading) faces similar problems to rejecting (3) and blurs the core distinction the argument seeks to explain.

  5.  **Addressing Your Worries:**
      *   **"Proves Too Much" (Evidence Tamperer, Witness, Poker Player):** This worry is spot-on and directly results from the overreach in (5)->(6). If the *only* wrong in deception comes from violating the assertion norm, then *any* non-assertoric deception (planting false evidence, strategic silence in poker, exploiting semantic ambiguity) would be permissible. Blocking the inference to (6) allows us to say these acts *might still be wrong* (e.g., the evidence tamperer violates norms of fairness or property; the poker player violates game-specific norms of disclosure; the witness exploits a shared context unfairly), even if they don't involve the *specific* wrong of breaking an assertion.
      *   **"Cowardice" Thought:** The argument, by focusing solely on the assertion norm violation and then leaping to permissibility, *is* structurally blind to this thought. Blocking the inference allows us to capture it: the misleader might be wrong precisely because they *avoid* the explicit commitment and accountability of assertion while deliberately causing deception – a form of bad faith or lack of courage.
      *   **The Move from (5) to (6):** Your suspicion is correct. This is where the argument smuggles in the assumption that the assertion norm violation is the *only* relevant wrong-making feature for deceptive speech acts. (5) removes one possible wrong; (6) incorrectly concludes no wrong remains.

  **Verdict: the inference from (5) to (6)**
