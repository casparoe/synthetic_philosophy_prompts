answer: |-
  You are quite right to identify the peril of shirking as the gravest practical objection to cooperative workshops. I concede unreservedly that where each worker's material gain is but a fractional share of his marginal product, the temptation to exert less than his full effort is real and potent. This is indeed a formidable obstacle in the early stages of such associations. However, you err in assuming this is an insurmountable, inherent flaw.

  The remedy lies not primarily in intensified surveillance, though some mutual oversight is inevitable in any collective enterprise, but in cultivating a transformed psychology through ownership and responsibility. The wage labourer, alienated from the fruits of his toil, sees no connection between extra exertion and his own benefit; his natural inclination is to minimize effort. But in a cooperative, where the *entire* surplus belongs to the workers collectively, and where each member comprehends that the association's survival and prosperity depend upon the diligent contribution of all, a powerful new motive emerges: self-interest fused with common interest. Associationist psychology teaches that habits of exertion for the collective good can be cultivated, becoming ingrained over time. This is not the oppressive scrutiny of a master or an alienated peer group, but the voluntary self-discipline of partners invested in a shared venture – a discipline sustained by the tangible rewards of success and the tangible penalties of failure borne by all, fostering a genuine esprit de corps. The "slave of his neighbours' opinion" caricature ignores this crucial motivational shift; the judgment feared is not arbitrary social censure, but the rational consequence of undermining one's own livelihood and that of one's fellow-owners. Individuality flourishes not in idleness, but in the responsible exercise of agency within a framework of mutual dependence freely chosen, a stark contrast to the despotism of the capitalist workshop.
