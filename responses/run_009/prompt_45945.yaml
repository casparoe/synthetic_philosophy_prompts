answer: |-
  Here is a specification of desiderata for coherence arguments for expected utility maximization (EUM), including your listed items with expansions, plus one critical addition. Each includes its rationale and negotiability status, followed by an analysis of tensions and assessments of key arguments.

  ---

  ### **Desiderata for Coherence Arguments**
  1.  **Binding Actual Choices**  
      *Case:* An agent who avoids all bets or limits stakes escapes Dutch books/money pumps. If rationality only demands avoiding bets, not governing all choices (e.g., medical decisions), the norm is trivial.  
      *Negotiability:* **Non-negotiable.** The argument must show that incoherent preferences/credences are defective *even if* the agent never engages in explicit betting.  
      *Rationale:* Rationality norms should apply to decision-making generally, not contingent on entering specific transactions.

  2.  **Non-Circularity**  
      *Case:* A Dutch book argument assuming probabilism in defining "fair odds," or a representation theorem building utility into the option space (e.g., assuming continuity in vNM), presupposes the conclusion.  
      *Negotiability:* **Non-negotiable.** Question-begging arguments fail dialectically.  
      *Rationale:* The argument must derive EUM from more basic, less committal premises about rationality.

  3.  **One-Shot Viability**  
      *Case:* An argument relying on repeated interactions (e.g., "you’ll lose money in the long run") fails for decisions made once (e.g., nuclear launch). Rationality shouldn’t depend on exploiters having multiple chances.  
      *Negotiability:* **Non-negotiable.** The defect must manifest in a single instance.  
      *Rationale:* Rationality is a synchronic requirement; diachronic arguments conflate rationality with statistical properties.

  4.  **Genuine Rational Failing**  
      *Case:* Losing $0.01 in a Dutch book isn’t inherently irrational if stakes are trivial and no further implications follow. Money pumps fail if the agent can halt the cycle (e.g., refusing Trade 3).  
      *Negotiability:* **Partially negotiable.** Some camps accept "pragmatic" defects (e.g., Hájek), others demand "principled" irrationality (e.g., dominance).  
      *Rationale:* The defect must be a *rational* flaw, not merely undesirable pragmatically (e.g., losing money). Vulnerability must imply structural irrationality.

  5.  **Response to Normative Counterexamples**  
      *Case:* Allais or Ellsberg paradoxes violate independence without Dutch books/money pumps. Why is this incoherent rather than a rational risk preference?  
      *Negotiability:* **Negotiable.** Proponents may argue intuition is mistaken, but must explain why violations *entail* incoherence.  
      *Rationale:* To avoid reducing coherence to dogmatism, the argument must engage challenges where rationality/intuition conflict.

  6.  **Idealization Transparency**  
      *Case:* A proof for logically omnisicent agents doesn’t show that human violations (e.g., intransitive indifferences due to graininess) are irrational.  
      *Negotiability:* **Negotiable.** Arguments may target ideal rationality but must explicitly address implications for non-ideal agents.  
      *Rationale:* Over-idealization risks making norms irrelevant to real agents.

  7.  **Non-Exploitability Requirement** (*Added*)  
      *Case:* An agent with cyclic preferences might avoid pumps by being stubborn (e.g., rejecting all trades). Vulnerability must be unavoidable.  
      *Negotiability:* **Non-negotiable** for strict coherence arguments.  
      *Rationale:* If defects are escapable via willpower, they don’t reveal inherent irrationality.

  ---

  ### **Tensions Between Desiderata**
  The most destabilizing tension is between **1 (Binding Actual Choices)**, **4 (Genuine Rational Failing)**, and **7 (Non-Exploitability)**:
  - To bind actual choices (1), the defect must be non-hypothetical – but "actual" defects (e.g., losing $0.01) struggle to qualify as *rational failings* (4).  
  - To ensure non-exploitability (7), arguments often rely on hypothetical scenarios (e.g., "if offered these bets..."), violating 1.  
  - Conversely, making defects "genuine" (4) may require abstract dominance (e.g., state-wise dominance), which doesn’t compel action in non-betting contexts (1).  

  **Result:** No argument satisfies all seven simultaneously. Pragmatic arguments (Dutch books) fail 1 and 4; principled arguments (dominance) fail 1 or 7; axiomatic arguments (vNM) fail 2 and 5. Coherence arguments either overreach (demanding irrationality in trivial losses) or underreach (applying only to bettors).

  ---

  ### **Assessments of Key Arguments**
  **De Finetti’s Dutch Book for Probabilism**  
  - *Fails:* **1** (only binds betting behavior), **4** (trivial losses aren’t clearly irrational), **7** (avoidable by refusing bets).  
  - *Meets:* **3** (one-shot loss), **6** (minimal idealization).  
  - *Analysis:* Its reliance on hypothetical bets undermines normative force for general decisions. The "loss" is pragmatic, not clearly rational.

  **von Neumann-Morgenstern (vNM) Theorem**  
  - *Fails:* **2** (continuity axiom builds in utility structure), **5** (dismisses Allais as "irrational" without explaining incoherence), **6** (idealized preference revelation).  
  - *Meets:* **3** (not diachronic), **4** (preference reversals under mixtures reveal structural flaws).  
  - *Analysis:* Circularity in axioms and insensitivity to paradoxes limit its justificatory power. It assumes EUM-like constraints to derive EUM.

  **Savage’s Representation Theorem**  
  - *Fails:* **1** (acts as "bets" on states), **5** (Allais violates Savage’s axioms without incoherence), **6** (demands extreme cognitive sophistication).  
  - *Meets:* **2** (non-circular: derives EUM from preference axioms), **3** (one-shot acts), **7** (dominance-based incoherence).  
  - *Analysis:* Though rigorous, its state-dependent acts are idealized constructs. It struggles with descriptive paradoxes, suggesting axioms encode substantive norms.

  ---

  **Conclusion**: Coherence arguments collectively expose vulnerabilities in non-EUM agents but individually fail to meet all desiderata. The core tension—between practical vulnerability and principled irrationality—remains unresolved. While they clarify the structure of rational preference, they cannot *establish* EUM without compromising on non-circularity, generality, or normative force. For a robust defense of EUM, coherence arguments may need supplementation (e.g., accuracy-dominance for credences) or concession to pluralism.
