  Reliability theories... ah, this is juicy. The user's instinct is right: swapping "causal" for "reliable" keeps the core problem intact. Any naturalistic epistemology demands an answer to "Why wouldn't math be false but useful?" That's why I'll argue reliability reformulations are the strongest version—they sidestep dead causal theories but preserve Benacerraf's insight.

  Generalization to morality etc.—the professor worries this makes math just another case, but actually it helps! If the dilemma applies to all non-empirical domains, it reveals a deeper puzzle about human cognition. That's not trivialization; it's elevation. Though I should flag the disanalogies they mention (history/morality having concrete ties math lacks).

  Biggest vulnerability: the dilemma might be an artifact of demanding mathematical objects do explanatory work. If we accept that math is about structures instantiated in physical systems (Shapiro-style), the epistemic access route opens up. That's the revolution they're asking about—structuralism with naturalized epistemology could dissolve it entirely.

