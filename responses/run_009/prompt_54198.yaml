          However, we want to focus on existential. So let's stick to the original plan but with numbers that are easy to factor.

     - Time: 3 minutes might be too short for some statements. We can extend? But we have 5 rounds. We might run over. So we'll be flexible.

     - Team dynamics: one team might dominate. We can assign roles within teams: each team must appoint a presenter.

     - Scoring: they might get discouraged by negative points. We can adjust: no negative, but then they might gamble. We want them to feel the pinch of not knowing. So negative points are important.

  7. **Debrief** (20 minutes):

     - Start by asking: How did it feel when you encountered the open problem? What could you do? (Nothing: you couldn't assert or refute.)

     - Map to the concepts:

          - **Witness condition**: In the game, to assert an existential statement, you needed a witness. In constructive mathematics, to assert an existential statement, you must have a witness or a method to find one.

          - **Disjunction and existence**: In constructive mathematics, a proof of a disjunction (A∨B) requires that you can decide which one holds and prove it. Similarly, in the game, you had to choose between assert or refute? But note: refute is not a disjunct. However, the open problem showed that we couldn't decide between the statement and its negation.

          - **Failure of double-negation elimination**: In classical logic, ¬¬P is equivalent to P. But in constructive, it is not. In the game, consider the open problem P: "There is a run of 100 consecutive 7s in π." We cannot assert P (so we don't have P). We also cannot assert ¬P (because that would require a constructive refutation, which we don't have). But note: what about ¬¬P? In classical, ¬¬P is equivalent to P. In constructive, we can have ¬¬P without P? How?

              Actually, in the game, can we assert ¬P? No. But also, can we assert ¬¬P? What is ¬¬P? ¬¬P is the statement: "It is not the case that there is no run of 100 consecutive 7s." How would we prove that? We would have to show that assuming ¬P (that there is no such run) leads to a contradiction. But we don't have a contradiction? So we cannot assert ¬¬P either. Therefore, in this case, we have neither P nor ¬P nor ¬¬P? 

              But note: in constructive logic, we can sometimes prove ¬¬P without proving P. For example, if P is a decidable statement, then we have ¬¬P → P. But for an undecided P, we cannot.

              We can try to prove ¬¬P for the open problem? We don't have any evidence. So we don't have ¬¬P either.

              Therefore, the open problem is a statement for which we have no proof of P, no proof of ¬P, and also no proof of ¬¬P? Actually, we do have ¬¬P classically because P is either true or false. But constructively, we don't. However, note that in constructive mathematics, we do not accept the law of excluded middle, so we cannot assert P∨¬P. Therefore, we cannot derive ¬¬P from P∨¬P and the fact that ¬¬P follows from P? But we don't have P. And we don't have ¬P? So we are stuck.

          However, this might be too advanced. We can say:

            In the game, we couldn't assert P (the open problem) and we couldn't assert ¬P. But note: in classical logic, we could assert P∨¬P without a witness? But in our game, we required that to assert a disjunction, you must be able to assert one of the disjuncts. So you cannot assert P∨¬P for the open problem because you cannot assert P and you cannot assert ¬P.

          This leads to the failure of excluded middle.

     - Name intuitionism at the end: "This approach to mathematics, where we require explicit constructions for existence and reject the law of excluded middle for undecided statements, is called intuitionism or constructive mathematics."

  8. **What the activity cannot reproduce**:

     - In real constructive mathematics, the mathematician has a whole toolbox of constructive methods and can sometimes prove statements that are classically equivalent but constructively stronger. In this activity, we only see the failure of excluded middle for one example. We don't see the positive power of constructive mathematics: how constructive proofs can have computational content. We also don't see how some classical theorems are not provable constructively and how constructive mathematicians might find alternative, constructively valid formulations.

     - The activity is limited to simple existential statements. In real mathematics, statements are more complex, and the constructive interpretation of implication and disjunction is more subtle.

     - The activity cannot reproduce the historical and philosophical context that led to intuitionism (Brouwer, etc.). We are focusing on the logical aspect.

     - The activity might give the impression that constructive mathematics is about what we don't know. But it's about what we can construct. We should emphasize that constructive mathematics is a positive program.

     We'll have to supply in the debrief: constructive mathematics is not just about restrictions, but about building mathematics on a foundation of explicit constructions. It has its own methods and results.

  ## Final Game Setup

  ### Materials
  - Statement cards for the following (one per card):

    Card1: "15 is a prime number." (False)
    Card2: "13 is a prime number." (True)
    Card3: "There is a prime number between 10 and 15." (True: 11,13)
    Card4: "The decimal expansion of π contains at least one '7'." (True: at position 13)
    Card5: "The decimal expansion of π contains four consecutive '7's." (True: at position 1589)
    Card6: "The decimal expansion of π contains one hundred consecutive '7's." (Open)
    Card7: "1001 is a prime number." (False)

    But note: we changed to smaller numbers? We'll use:

    Card1: "15 is prime." -> False
    Card2: "13 is prime." -> True
    Card3: "There is a prime number between 24 and 28." -> False (because 24,25,26,27,28 are composite)
    Card4: PI1 (True)
    Card5: PI2 (True)
    Card6: PI3 (Open)
    Card7: "1001 is prime." -> False

    We have 7 cards. We'll use 5 rounds.

  - Oracle: The teacher has the answers, including known π witnesses.

  ### Rules Recap
  - To assert an existential: provide a witness.
  - To refute an existential:
      - If bounded (like Card3: between 24 and 28), they can check every candidate and show none works.
      - For an atomic statement (like "15 is prime"): refute by providing a factorization.
  - For open problem (Card6): no witness and no refutation is known. Trying to assert or refute leads to penalty.

  ### Timeline (75 min)
  - 0-5 min: Introduction and rules.
  - 5-10 min: Practice round with "There is a prime between 10 and 15" (True) and then "There is a prime between 24 and 28" (False).
  - 10-55 min: 5 rounds (each: 3 min discussion, 5 min for action and verification). 
    - Round1: Card1 (15 prime) -> refute
    - Round2: Card2 (13 prime) -> assert (check divisors: 2,3 -> 13 mod2=1, 13 mod3=1)
    - Round3: Card4 (π has a 7) -> assert (position 13)
    - Round4: Card7 (1001 prime) -> refute (factorization: 1001=7*11*13)
    - Round5: Card6 (open) -> pass
  - 55-75 min: Debrief.

  ### Adjustments for First Run
  - Be ready to help with computation: provide calculators or multiplication tables.
  - Have the first 100 digits of π printed for reference for Card4? But for Card4, they might not know where the 7 is. So the teacher can be the oracle: if they say "We know there is a 7 somewhere, but we don't know the exact position", that's not enough. They must have the witness. So the teacher can provide the position: "It's at position 13." But then they can use that. We want them to experience that without the witness, they cannot assert. So we don't give it in advance. They must either know or guess? But guessing is not constructive. 

    We can allow them to look up in a provided π expansion (first 100 digits) during the game. Then for Card4, they can scan and find a 7.

    Printout: digits of π (first 100) for each team.

  - For Card5 (four consecutive 7s), they won't find it in the first 100. So they must rely on the teacher: they can ask "Is there a known occurrence?" and the teacher says "Yes, at position 1589." Then they can assert. But note: they are using the teacher as a witness? That's okay: in mathematics, we cite references. But the point is that there is a witness, even if they didn't compute it themselves.

    However, for the open problem, the teacher will say: no witness is known.

  - For Card3: "There is a prime between 24 and 28." They must check 25,26,27. None is prime. They can factor: 25=5*5, 26=2*13, 27=3^3.

  This should work.

  Good luck!
answer: |-
  Below is a detailed design for your 75-minute discussion section activity. The goal is to create an experiential understanding of mathematical constructivism by having students operate under BHK-style constraints (assertions require explicit constructions/witnesses). The activity centers on the decimal expansion of π, leveraging its open problems to create tangible frustration with non-constructive proofs.

  ---

  ### **Activity Title**: The Constructive Challenge  
  **Duration**: 75 minutes  
  **Participants**: 18 students (divided into two teams of 9)  
  **Core Idea**: Students play a game where they can only assert mathematical statements if they can produce a witness or method. This forces them to confront the limitations of proof by contradiction and the failure of excluded middle for undecidable problems like the occurrence of 100 consecutive 7s in π.

  ---

  ### **Materials**  
  1. **Statement Cards**: 10 cards with mathematical statements (mix of decidable and open problems). Print these:  
     - "There is a 7 in the first 10 digits of π." (Decidable true: Position 13)  
     - "There is a 7 in the first 1,000 digits of π." (Decidable true: Witness exists)  
     - "There are four consecutive 7s in π." (Decidable true: Known position)  
     - "There are no 7s in the first 10 digits of π." (Decidable false)  
     - "1729 is prime." (Decidable false: 7 × 13 × 19)  
     - "1729 is the sum of two cubes in two ways." (Decidable true: 10³+9³, 12³+1³)  
     - "There is a prime between 1700 and 1710." (Decidable true: 1709)  
     - **Open Problem**: "There are one hundred consecutive 7s in π." (Open)  
     - **Open Problem**: "There are no one hundred consecutive 7s in π." (Open)  
     - "The digit sequence '123456789' appears in π." (Open, but less famous)  

  2. **Witness Tools**:  
     - Printed list of the first 1,000 digits of π (for bounded checks).  
     - Calculators (for number theory statements).  
     - Timer (for game rounds).  

  3. **Scoreboard**: Whiteboard to track team scores.  

  ---

  ### **Rules of the Game**  
  1. **Constructive Discipline**:  
     - To **assert a statement (P)**, a team must:  
       - **Exhibit a witness**: e.g., "Position 13 of π is 7."  
       - **Provide a method**: e.g., "Check positions 1–10 of π; position 13 is 7."  
     - To **refute a statement (¬P)**, a team must:  
       - For existentials: **Exhibit a counter-witness** or **exhaustively check all cases** (if bounded).  
       - Example: "1729 is not prime because 7 × 247 = 1729."  
     - **No excluded middle**: Teams cannot invoke "P must be true or false" without evidence.  
     - **No proof by contradiction**: A proof of "¬¬P" (e.g., "It’s impossible that no counterexample exists") is invalid. It does not license asserting P.  

  2. **Gameplay**:  
     - **Teams**: Team A and Team B (9 students each).  
     - **Rounds**: 5 rounds (8 minutes each). Each round focuses on one statement card.  
     - **Turn Structure**:  
       1. **Card Draw**: Moderator (you) reveals a statement.  
       2. **Discussion (3 mins)**: Teams discuss whether they can assert/refute constructively.  
       3. **Challenge Phase (4 mins)**:  
          - Either team can attempt to **assert** or **refute**.  
          - If both teams pass, no points.  
          - If one team acts, they present evidence. If correct, they score.  
          - If both teams act:  
            - Same claim (e.g., both assert): Present independently. If both correct, half points.  
            - Opposite claims (e.g., A asserts, B refutes): Only the correct claim scores.  
       4. **Scoring**:  
          - Correct assert/refute: **+2 points**  
          - Incorrect: **–1 point** (penalty for non-constructive reasoning)  
          - Pass: **0 points**  

  3. **Oracle Role**:  
     - You act as the "oracle" for π facts:  
       - Confirm known witnesses (e.g., "Position 13 is 7").  
       - Declare open problems (e.g., "No witness for 100 consecutive 7s is known").  
     - **No hints**: Only verify submitted constructions.  

  ---

  ### **Timeline**  
  | **Time** | **Phase** | **Description** |  
  |----------|----------|----------------|  
  | 0–10 min | **Setup** | Divide teams. Explain rules. Emphasize: "You can only claim something if you can *show* it." Practice with a toy example (e.g., "There is a 5 in the first 5 digits of π" – decidable true). |  
  | 10–50 min | **Game Rounds (5 × 8 min)** | Run rounds with selected cards:  
    - **Round 1**: Decidable true (e.g., "7 in first 10 digits of π"). *Goal: Warm-up with witness production.*  
    - **Round 2**: Decidable false (e.g., "1729 is prime"). *Goal: Practice refutation with counter-witness.*  
    - **Round 3**: Decidable true (e.g., "1729 is sum of two cubes"). *Goal: Method demonstration.*  
    - **Round 4**: Open problem (e.g., "100 consecutive 7s in π"). *Goal: Force frustration.*  
    - **Round 5**: Open problem negation (e.g., "No 100 consecutive 7s in π"). *Goal: Reinforce impotence of ¬¬P.* |  
  | 50–65 min | **Debrief** | Guide discussion:  
    1. **Frustration Reflection**: "What happened with the 100 consecutive 7s statement? Why couldn’t you act?"  
    2. **Map to Constructivism**:  
       - *Witness Condition*: "Asserting P required a construction. You had proof that ¬(∀x¬P(x)) (it’s not true that no example exists), but that wasn’t enough to assert ∃x P(x)."  
       - *Disjunction/Existence*: "∃x P(x) is a promise of an example. ∨ requires knowing which side holds."  
       - *Double-Negation Failure*: "Proof that ¬¬P (e.g., contradiction) did not give you P. You had no witness."  
    3. **Name Intuitionism**: Finally, reveal: "This is the intuitionist view: Truth requires verification." |  
  | 65–75 min | **Conclusion** | Discuss implications: "How would math change if we always demanded witnesses? When is non-constructive proof useful?" |  

  ---

  ### **Predicted Challenges**  
  1. **Initial Confusion**: Students may try to use classical reasoning (e.g., "P must be true or false!").  
     - **Mitigation**: Enforce rules strictly. Penalize non-constructive arguments.  
  2. **Time Pressure**: Some decidable statements (e.g., prime checks) may take too long.  
     - **Mitigation**: Use calculators; skip to the next round if needed.  
  3. **Frustration with Open Problems**: Teams may demand "partial credit" for ¬¬P arguments.  
     - **Mitigation**: Hold firm: "¬¬P is not P. What can you *show*?"  

  ---

  ### **Limitations of the Activity**  
  One critical aspect **cannot be reproduced experientially** and must be explained in the debrief:  
  - **The Positivity of Constructivism**: Students experience constructivism as a *limitation* (e.g., inability to assert open problems). However, you must clarify that constructivism is *not just restrictive*—it is a positive program emphasizing that proofs *are* constructions. For example:  
    > "Constructive proofs compute witnesses. A constructive proof of '∀x∃y P(x,y)' gives an algorithm for y. This is why intuitionists reject excluded middle: It lets you 'prove' existence without building anything. Today, you felt the absence of construction; real constructivism is about building."  

  This bridges the experiential "pinch" to the philosophical motivation.

  ---

  ### **Why This Works**  
  - Students directly confront the difference between classical truth ("P holds") and constructive verification ("Here’s why P holds").  
  - The open π problem creates shared frustration, making constructivism feel "live."  
  - Scoring incentivizes constructive discipline while penalizing empty classical arguments.  
  - Naming intuitionism only at the end avoids preconceptions and lets experience drive insight.  

  Run this as written, and your students will leave with a visceral understanding of why intuitionists demand witnesses—and why math isn’t "done" when you have a contradiction.
