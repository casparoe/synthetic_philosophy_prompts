  - Bounded rationality: Online learning handles this explicitly (e.g., per-step regret vanishing even with mistakes). Coherence arguments ignore computational limits and small-stakes exploitation.
  - Repeatability: Dutch books often assume one-shot exploitability, while regret frameworks naturally handle repeated interaction. This is a gap in coherence arguments.
  - Independence axiom: In regret terms, violating independence creates arbitrage opportunities across menu contexts. The debate about its plausibility has no direct analog in online learning - it's about whether this particular exploitability matters.

