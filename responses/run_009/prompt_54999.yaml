  For Dutch books: The adversary is offering bets that exploit incoherent probabilities or utilities. It's static exploitability - finding a single portfolio that dominates the agent's choices. This is similar to finding a strategy that forces positive regret immediately, not asymptotic.

  For representation theorems (vNM/Savage): These show that satisfying certain axioms makes behavior indistinguishable from EU maximization to an observer who can offer choice tests (like menus of lotteries or acts). It's a behavioral characterization, not a claim about internal cognition.

  Now for the residue report:
