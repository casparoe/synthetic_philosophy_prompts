answer: |-
  Here's the translation into online learning theory terms, plus the residue report:

  **Core Translation:**
  - **Dutch Book Adversary:** A *stochastic adversary* offering state-contingent contracts (bets). It probes your probability assessments or utility comparisons. Inconsistency (e.g., violating probability axioms) lets the adversary construct a portfolio of bets guaranteeing *positive regret* (loss) in *every possible state/world*. This is **static exploitability**: a single constructed portfolio dominates your choices.
  - **Guarantee Type:** **Static dominance** (one-shot exploitability), **not** a regret bound over time. It shows immediate vulnerability if axioms are violated.
  - **vNM/Savage Representation:** If your choice behavior over lotteries (vNM) or acts (Savage) satisfies specific consistency axioms (completeness, transitivity, independence, continuity, etc.), then you are **behaviorally indistinguishable** from an EU maximizer to an observer who can test you with *any finite menu of options* (lotteries/acts). The "test class" is all possible pairwise choices or small menu selections. It's a **representation result**, not a performance guarantee over time.

  **Residue Report (Philosophical Debates vs. Regret Framework):**

  1.  **Norms vs. Predictions:**
      *   **Debate:** Are axioms normative (you *should* obey) or descriptive (real agents *do* obey)?
      *   **Regret Counterpart:** Nonexistent. Regret/exploitability inherently focuses on **performance consequences** of behavior against an adversary. Violation *enables* exploitation; the "why" (normative intent or predictive failure) is irrelevant to the exploitability proof.
      *   **Who's Missing What?** The regret framework *sidesteps* this debate. It shows violation *has a cost* (exploitability), regardless of whether the agent intended to be normative or not. Coherence arguments gain normative force *from* this exploitability consequence.

  2.  **Bounded Agents & Small Stakes:**
      *   **Debate:** Can an agent rationally violate axioms if exploitation costs are negligible (e.g., tiny money pump)?
      *   **Regret Counterpart:** Central. Regret frameworks explicitly handle **bounded computation/resources** and **scaling**. We care about *asymptotic* or *average* regret (e.g., regret sublinear in T). A one-off, fixed-cost exploitability point (like a tiny Dutch book) becomes irrelevant if the cost is O(1) while total utility is Ω(T). Significant regret requires exploitability that scales or repeats.
      *   **Who's Missing What?** Classic coherence arguments **ignore scaling/computation**. They show *potential* exploitability, not its *significance* for bounded agents. The regret framework inherently incorporates significance via scaling (e.g., per-step regret).

  3.  **Repeatability of the Pump:**
      *   **Debate:** Does a single possible Dutch book suffice to condemn incoherence, or must the pump be actively repeated?
      *   **Regret Counterpart:** Addressed. Static Dutch books = **one-shot exploitability**. A *repeatable* pump implies the adversary can force **linear regret** (constant loss per round). The coherence argument only guarantees **some exploitability exists** (static dominance), not necessarily linear regret. If the pump isn't forced repeatedly, regret could be sublinear.
      *   **Who's Missing What?** Coherence arguments **stop at proving existence** of (static) vulnerability. Regret analysis asks *how bad* the vulnerability is over time (linear vs. sublinear regret).

  4.  **The Fight over Independence (vNM):**
      *   **Debate:** Is the Independence Axiom rationally compelling? (Violations like Allais Paradox).
      *   **Regret Counterpart:** Violating independence enables **menu-dependent exploitability**. The adversary constructs different dominant portfolios depending on which options you are presented with *together*. Your choice between A and B changes based on the presence of irrelevant C, letting the adversary exploit across different "menu contexts." It's a form of **contextual exploitability**.
      *   **Who's Missing What?** The *rational plausibility* debate has **no direct analog** in regret. The regret framework *only* shows exploitability exists if independence is violated. Whether this *specific* exploitability is acceptable to a bounded agent facing specific menus is outside the theorem's scope. Coherence arguments claim this exploitability is universally bad; regret analysis quantifies its potential impact but doesn't settle the normative debate about the axiom itself.

  **Summary:** Coherence theorems show that violating probability/EU axioms makes you **statically exploitable** by an adversary constructing state-contingent contracts. This maps to **immediate positive regret in all states** (Dutch Book) or **behavioral indistinguishability under menu tests** (vNM/Savage). The key residue is that coherence arguments ignore **scaling, computation, and asymptotic significance**, focusing only on the *existence* of vulnerability. The regret framework inherently handles these via **asymptotic/average regret bounds** and is agnostic on the normative/predictive split. Coherence arguments prove vulnerability; regret analysis quantifies its severity over time for bounded agents.
