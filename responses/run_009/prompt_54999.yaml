  I'm a PhD student in online learning theory, so my native vocabulary is regret bounds, no-regret dynamics, exploitability against an adversary, calibration, swap regret, that kind of thing. Rationalist-adjacent people keep telling me coherance theorems "prove" rational agents must be expected utility maximizers -- Dutch books, de Finetti, vNM, Savage, the whole literature. Restate these arguments in the vocabulary I actually use: what exactly plays the role of the adversary in a Dutch book, what sort of guarantee do the theorems really give (is it a regret bound? a static dominance argument? a limit property?), and how should I read the vNM/Savage representation theorem if I want to think of it as saying the agent is behaviorally indistinguishable from an EU maximizer to some class of observers or tests. Then the residue report: which parts of the philosophical debate have no counterpart in regret/exploitability talk -- e.g. whether the premises are meant as norms or as predictions, what happens with bounded agents that can shrug off a one-off money pump because the stakes are too small, whether the pump needs to be repeatable to bite, and the fight over the independence axiom -- and for each bit of residue, tell me whether my vocabulary is missing something or whether the coherance argument is just doing less work than its fans claim. Please keep the whole thing under 700 words.
