prompt: |-
  I teach a graduate seminar on collective action and rational choice, and we have just finished Scott Alexander's essay "Meditations on Moloch" (2014). My students have absorbed the canonical picture of the multipolar trap: no actor can profitably deviate, no contract can be enforced, and the race to the bottom leaves every participant worse off than some coordinated alternative they can all see plainly. They have also absorbed the complacency that comes with it — the assumption that the logic always points the same direction, toward waste.

  For next week I want a thought experiment that cuts against the grain. Construct a scenario in which a genuine multipolar trap is, ex ante, better for the very actors caught in it than the coordinated alternative would be — a race to the bottom that beats the escape hatch.

  The scenario must satisfy the following constraints:

  1. Realistic setting: firms, labs, sports leagues, city governments — no science fiction, no exotic enforcement technology, and no actors with unusual altruism or foresight. The racers should be ordinary self-interested parties who can read a balance sheet.

  2. It must be a genuine trap on its face: given that the others race, racing is strictly dominant for each participant; no binding contract, cartel, or regulator is available; and in the one-shot static version of the game the race equilibrium is Pareto-inferior to a feasible coordinated alternative. That alternative must be honestly described — a working consortium or standards arrangement that credibly shares the gains — not a strawman utopia.

  3. The twist: measured ex ante, from a point before anyone could commit, the total expected welfare of the participants themselves must be strictly higher under the trap than under the coordinated alternative. Third parties may not carry the argument; the racers themselves must be the beneficiaries.

  4. The metric being raced on must be locally valid: each individual step down must look, at the time and to the actor taking it, like a genuine improvement in her own position — the trap must not depend on anyone being mistaken about her incentives or sacrificing knowingly.

  Keep the scenario itself to one paragraph. Then demonstrate that each constraint is met: exhibit the dominance reasoning, explain why enforcement fails, and explain why the trap wins on expected welfare despite losing the static Pareto comparison. Next, identify the single feature of the case that does the work — the thing whose removal would collapse it back into an ordinary wasteful race — and describe what happens when you remove it. Finally, give the strongest objection available to someone committed to the standard Moloch picture; I anticipate the charge that the case merely shows the raced metric was mis-specified from the start, and I want to know whether that reply is substantive or merely begs the question against the possibility the case is meant to establish. Assess whether the objection succeeds.

  End your answer with a line beginning "Verdict:" followed only by a short phrase naming the feature that does the work.
reasoning: |-
  Hmm, the user is teaching a graduate seminar on collective action and rational choice, and they've just covered Scott Alexander's "Meditations on Moloch." The students understand the multipolar trap concept well—where self-interested actors race to the bottom, ending up worse off than if they'd coordinated—but they've developed a complacent view that this always leads to waste. The user wants a counterintuitive thought experiment showing that sometimes the trap is actually better ex ante than coordination.

  The thought experiment needs to meet several constraints: it must be realistic (firms, labs, etc.), be a genuine trap with Pareto-inferior outcomes in static terms, show that participants' expected welfare is higher ex ante under the trap, and involve locally valid metrics where each step down seems rational at the time. No sci-fi, altruism, or exotic tech allowed.

  I'll construct a scenario involving pharmaceutical companies competing to develop a new drug. Setting: multiple firms racing to patent a novel drug for a common disease. The coordinated alternative would be a research consortium sharing costs and findings to avoid duplication. But in the trap, each firm independently pursues its own research path.

  In the static game, racing is dominant: if others race, you must too or get nothing. Coordination would save costs, but no binding contract exists because firms fear defection or IP theft. The trap is Pareto-inferior since all spend more on R&D than necessary.

  The twist comes from ex ante uncertainty. The disease might have multiple viable treatment pathways. If firms coordinate on one approach, they risk betting on the wrong one—if it fails, everyone loses. But in the trap, multiple parallel efforts explore different paths. So ex ante, the probability of at least one success is higher with racing, even though it's costlier. Expected welfare could be higher because the chance of total failure is lower.

  The key feature enabling this is "technological uncertainty" – not knowing which approach will work. Remove that, and it collapses to a wasteful race: if the best path is known, coordination dominates.

  A likely objection is that the metric is misspecified—firms should care about expected net profit, not just success probability. But in this case, with high stakes (e.g., blockbuster drug), the higher expected value from multiple trials might offset the costs, especially if failures provide valuable information. The objection doesn't fully succeed because it assumes away the uncertainty that makes parallel exploration valuable.

  Verdict: Technological uncertainty.
answer: |-
  ### Scenario: Pharmaceutical Patent Race  
  Several pharmaceutical firms compete to develop the first effective drug for a novel disease. The coordinated alternative is a pre-commitment consortium: firms pool R&D resources, share findings, and split profits equally if any drug succeeds. In the trap, each firm independently races for the patent, duplicating efforts. The disease has two viable but mutually exclusive biochemical pathways (A and B), each requiring massive investment to prove efficacy/safety. Success via either pathway yields a $10B market; failure yields $0. Each firm’s R&D cost is $1B. Firms are identical and risk-neutral.  

  ### Constraints Demonstrated  
  1. **Realistic setting**: Ordinary pharma firms (e.g., Pfizer, Roche analogs) with standard profit motives and patent incentives. No altruism; R&D decisions hinge on expected NPV.  
  2. **Genuine trap**:  
     - *Dominance*: If rivals race, your choice: race (cost $1B, chance to win $10B alone) or abstain (cost $0, but rivals may win, leaving you $0). Racing dominates (e.g., with 2 firms, abstaining gives $0; racing gives ≥5% chance at $10B minus cost, positive expected value).  
     - *Enforcement failure*: A consortium requires full transparency to prevent freeloading/defection, but firms cannot credibly share proprietary data without risking leaks or IP theft. No court can verify effort or enforce sharing ex post.  
     - *Pareto-inferior*: In the static trap (e.g., 2 firms), total cost = $2B, success probability ≈100% (since A and B both viable). Expected total welfare: $10B - $2B = $8B. Consortium: total cost = $1B (one pathway pursued), success probability 50% (if wrong pathway chosen), expected welfare = (0.5 × $10B) - $1B = $4B. Trap wastes $1B in duplicative costs but dominates coordination’s welfare ($8B > $4B) due to higher success likelihood.  
  3. **Ex ante welfare**: Pre-commitment, firms face uncertainty: no one knows which pathway (A or B) works. Trap’s parallel exploration ensures success if either pathway is viable (prob ≈100%). Consortium must bet on one pathway (50% failure risk). For each firm, trap expected profit: in a 2-firm race, probability of being first ≈50% (assuming symmetry), expected value = (0.5 × $10B) - $1B = $4B. Consortium: equal profit share if successful, expected value = (0.5 × $5B) - $0 (no cost if not selected for R&D) = $2.5B. Trap yields higher ex ante expected profit ($4B > $2.5B).  
  4. **Locally valid metric**: Each firm’s decision to invest $1B is based on its private NPV calculation: if rivals race, expected return positive; if rivals abstain, even higher returns. No sacrifice or myopia—each step is profit-driven.  

  ### Key Feature  
  **Technological uncertainty**: The critical unknown—which pathway succeeds—makes parallel exploration essential. Firms cannot know ex ante which bet is correct, so racing hedges against collective failure.  

  ### Removal of Key Feature  
  If the viable pathway is known ex ante (e.g., Pathway A is proven feasible), the consortium dominates: firms coordinate on A at lower cost ($1B total), success guaranteed, each gets $5B (minus no cost). Racing becomes pure waste ($2B cost for same outcome).  

  ### Strongest Objection  
  **Objection**: The raced metric (being first) is mis-specified. Firms should optimize expected net profit, not raw success probability. The trap’s higher costs ($2B vs. $1B) and lower per-firm returns ($4B vs. $5B if successful alone) make it inefficient. The consortium’s lower expected welfare ($4B total vs. $8B) stems from its suboptimal design—e.g., it could pursue both pathways at $2B cost, matching the trap’s success probability with equal welfare.  

  **Assessment**: The objection has merit but does not fully succeed.  
  - **Substantive?** Yes: It correctly notes that a better-designed consortium (pursuing both pathways) would replicate the trap’s success probability at equal cost, achieving Pareto-superior $8B welfare.  
  - **Begs the question?** Partially: It assumes such a consortium is feasible, violating Constraint 2 (no exotic enforcement). In reality, coordinating parallel efforts requires enforceable task allocation and data sharing, which fails due to IP risks (e.g., Firm 1 working on A might steal Firm 2’s B research). The trap emerges *because* robust coordination is infeasible under uncertainty.  
  - **Conclusion**: The objection succeeds only if enforcement is assumed costless—but under the constraints, the trap’s inefficiency is the price of hedging against uncertainty when contracts fail.  

  ---

  Verdict: Technological uncertainty
