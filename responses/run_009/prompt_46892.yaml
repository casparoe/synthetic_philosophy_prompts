answer: |-
  Your diagnosis is remarkably incisive, cutting to the core of the metaontological stalemate. The "embarrassment" you identify is indeed the crux, and the regress/relocation worry perfectly captures the dynamic. Let's ground this in the participants' views and diagnose the nature of the meta-dispute:

  **1. The Core Diagnosis: Normative Disguised as Verbal/Substantive**

  The meta-dispute is **primarily a normative disagreement about the goals and standards of inquiry**, masquerading as either a verbal dispute about 'substantive' or a first-order metaphysical dispute about structure/reality. Neither the purely verbal nor the purely substantive characterization fully captures it, though elements of both are present.

  *   **Why not purely verbal?** While 'substantive' is contested, the participants aren't *simply* talking past each other about the word. They share a rough target: they want to know if there's a "deep" fact of the matter in ontological disputes that survives linguistic reinterpretation. Their disagreement is about *what constitutes depth or fundamentality in this context*. Deflationists (Hirsch, Thomasson) tie depth tightly to conceptual frameworks and practical/linguistic utility. Substantivists (Sider, Fine) seek depth *beyond* or *underlying* those frameworks, in objective structure (Sider) or a primitive notion of reality (Fine). Chalmers carves a middle path, locating depth in structure while accepting existence is framework-relative. This disagreement about the *source* and *nature* of depth is not merely semantic; it reflects divergent philosophical commitments about what matters in ontology.
  *   **Why not purely first-order substantive?** Attempts to resolve it *as* a first-order metaphysical dispute immediately trigger the regress/relocation you identify. Sider's appeal to "joint-carving" is precisely his attempt to ground the meta-level norm ("use the joint-carving quantifier!") in a first-order feature of the world (structure). However, as Hirsch (and arguably Chalmers on his deflationist days) would counter: "Is the property *joint-carving* itself joint-carving? Is *your* concept of structure the objectively privileged one?" This pushes the question back to the meta-meta level: "Which concept of structure (or reality) *should* we use?" Similarly, Fine's appeal to the "real" versus the "existent" invites the question: "Is *your* notion of 'real' the genuinely real one, or just another conceptual choice?" This regress seems ineliminable *if* one insists on a purely descriptive, non-normative resolution.
  *   **The Normative Core:** Underneath the verbal and substantive layers lies a **normative disagreement about the aims of ontology**:
      *   **Deflationists (Hirsch/Thomasson):** The primary aim is conceptual clarity, linguistic understanding, resolving practical confusions, or understanding the commitments of our best frameworks *as we use them*. Ontology, when properly understood, serves these ends and shouldn't pretend to uncover a "deeper" reality inaccessible through conceptual/linguistic analysis. The norm is *interpretive charity* or *conceptual competence*.
      *   **Substantivists (Sider/Fine):** The primary aim is to discover the *fundamental structure of reality itself*, independent of our conceptual schemes or linguistic practices. Ontology seeks objective answers to "what is really there?" at the most basic level. The norm is *representational fidelity to the objective joints of nature* (Sider) or *correctness according to the primitive notion of reality* (Fine).
      *   **Chalmers:** Aims for a hybrid: existence is easy and framework-relative (deflationary), but discovering the *structure* of the world (perhaps framework-invariant or framework-convergent) is a substantive, non-verbal project. The norm is *structural discovery*.

  **2. Addressing the Embarrassment and Regress (Grounded in Participants):**

  *   **The Deflationist's Embarrassment:** You're right. If the meta-dispute is verbal in Hirsch's sense (hinging on 'substantive'), then his own charge against first-order ontology *also* relies on a term ('verbal dispute') whose application might be framework-relative. How do deflationists handle this?
      *   **Hirsch:** He might bite the bullet and say the meta-dispute *is* verbal *about the word 'substantive'*, but then immediately relocate the issue to the normative plane you identified: "Regardless of the word, the *practical question* is which conceptual framework (including its quantifier meaning) we *should* adopt for inquiry. And here, interpretive charity and practical utility are the only relevant norms." He denies there's a fact about which framework "carves at the joints" because he rejects Sider's robust realism about structure. For Hirsch, the relocation *dissolves* the demand for a further "substantive" fact; it shows the only genuine question left is pragmatic/normative.
      *   **Thomasson:** She explicitly addresses meta-level issues. She argues metaontology *itself* can be easy or trivial once we recognize ontological questions are settled analytically or by conceptual truths. However, she concedes a residual *normative* question remains: "Which concepts (and associated application conditions) *should* we employ?" (*Ontology Made Easy*, Ch. 12). She argues this is a *pragmatic* question about which concepts are useful for our purposes, not a metaphysical one about "joints." Her embarrassment is mitigated by explicitly acknowledging this normative layer. She sees the charge of "verbal dispute" at the first-order as *correctly* diagnosing a confusion (mistaking conceptual/linguistic issues for deep metaphysical ones), based on her analysis of how existence claims *work*.
  *   **The Substantivist Response to Relocation:** Sider and Fine embrace the relocation but argue it *doesn't* dissolve into mere pragmatics.
      *   **Sider:** He directly confronts the regress (*Writing the Book of the World*, Ch. 3.10-3.11). He argues we must accept "structure" as a fundamental, objective feature of the world. Yes, we use our concept of structure to say this, but that doesn't mean it's merely our concept doing the work. He posits that the *property* of structuralness (or joint-carving) *is itself* structural – it's part of the fundamental furniture. To deny this leads to a debilitating global deflationism he rejects. The norm ("use the joint-carving quantifier") is grounded in the objective, structural fact that *there are joints* and our quantifier *can* latch onto them. The "should" is derived from the "is" of structure.
      *   **Fine:** His framework bypasses the quantifier variance issue entirely. The question "What is real?" is primitive and not analyzable in terms of existence or quantification. The norm ("describe reality") is inherent in the very notion of reality he employs. Disagreements about what is real aren't primarily verbal (though they might involve confusions), they are substantive disagreements about the application of this primitive notion. The regress is stopped by taking "real" as bedrock.

  **3. What Would Count as Progress? (Beyond Restatement)**

  Given the diagnosis, genuine progress is difficult but might look like this:

  1.  **Acknowledging the Normative Core & Shifting Focus:** The most realistic progress might involve both sides explicitly recognizing the normative dimension you've identified and shifting the debate accordingly. Instead of endlessly arguing whether disagreement *is* substantive (which triggers the regress), debate *which norms should govern ontological inquiry* and *why*. Can Thomasson/Hirsch show that pragmatic/conceptual norms suffice for all legitimate ontological purposes? Can Sider/Fine provide compelling reasons (beyond intuition) to believe an objective norm of structural fidelity is necessary or attainable? This moves the debate onto potentially more fertile ground about the aims of philosophy and science.
  2.  **A Genuine First-Order Divergence (Unlikely but Possible):** Finding a case where interpretive charity *genuinely conflicts* with the verdict dictated by the "best theory's fundamental vocabulary" *in a way that doesn't allow reinterpretation*. This is incredibly hard because deflationists are masters of charitable reinterpretation, and substantivists often build their fundamental vocabularies from successful sciences where charity largely agrees. Sider might point to his "Nomic" example or debates about the fundamentality of spacetime points vs. fields, arguing charity *here* is insufficient to pick a winner, but joint-carving can. Hirsch would likely counter that even here, competent speakers can adopt either framework charitably; the normativity of choice remains.
  3.  **Precisifying "Joint-Carving" to Deflationist Standards (Hard):** Could Sider (or someone) define "joint-carving" or "fundamental structure" in terms acceptable to a deflationist – e.g., solely in terms of pragmatic utility, predictive power, simplicity within a *given* framework, or conceptual role? This seems unlikely, as it would gut the concept of its intended objective, language-independent status. Sider's appeals to physics or "naturalness" in Lewis's sense presuppose the objectivity he's arguing for. Deflationists see these as just more features *within* our best theories, open to reinterpretation.
  4.  **Retiring the Question/Dispute (Plausible Conclusion):** Your final suggestion is potent. Given the decade-long stalemate, the regress problem, and the normative relocation, one could argue that *the question "Is this ontological disagreement substantive?" as traditionally framed in the Quinean/metametaphysical terms is ill-posed and unproductive*. It conflates descriptive, semantic, and normative elements in a way that breeds irresolvable disagreement. Progress might involve:
      *   **Adopting Fine's Framework:** Accepting his distinction and abandoning the Quinean "exists" as the sole ground for substantive ontology. This dissolves the quantifier variance issue for the "real" question.
      *   **Embracing Neo-Carnapianism:** Following Thomasson (or Huw Price) more radically, concluding that *all* ontological questions are internal to frameworks, and the only external questions are pragmatic/normative ones about framework choice. The debate about "substantiveness" simply vanishes, replaced by questions about usefulness, clarity, etc.
      *   **Focusing on Specifics:** Abandoning the global meta-debate and focusing on whether *particular* ontological claims (e.g., about composite objects, mathematical entities, consciousness) can be resolved through conceptual analysis, empirical discovery, or other specific means within localized domains, without needing a global answer to "Is ontology substantive?"

  **Conclusion:**

  The metaontological dispute is not *merely* verbal, nor is it resolvable as a straightforward first-order substantive disagreement. It is fundamentally a **normative disagreement about the primary goal of ontological inquiry** (conceptual clarity/pragmatic utility vs. representing fundamental objective structure/reality), which manifests as a dispute over the meaning and applicability of 'substantive' and triggers a regress when either side tries to ground their norm in purely descriptive terms. Progress is unlikely to come from another round within the existing framework. It requires either a shift to explicitly debating the normative foundations of ontology, a radical change in framework (like Fine's), or a decision to retire the global question as ill-posed and focus on more tractable, localized metaphysical problems. The standoff persists because both sides' core normative commitments are deeply held and resist reduction to the other's terms.
