  Looking at the participants: Hirsch's quantifier variance and interpretive charity imply that resolving disputes requires semantic ascent, but he treats metaontology differently. Thomasson's easy ontology sees existence questions as trivial, but her meta-level stance isn't similarly dissolved. Sider explicitly argues that metaontology isn't verbal because it's about structure, not just quantifier meaning. Fine's reality-based ontology bypasses quantifiers altogether. Chalmers separates existence from structural questions, making the latter non-verbal.

  The core issue is that deflationists apply their methods inconsistently at the meta-level. Thomasson might say metaontology is normative, but she doesn't fully embrace that. Sider's joint-carving is his solution to the regress, but it's contentious. Fine's reality might avoid verbalness, but it's a radical shift.

  For progress, the user wants either a first-order divergence, a precisification of joint-carving, or an argument to retire the dispute. Genuine first-order divergence seems unlikely—both sides adapt to avoid it. Precisifying joint-carving is tough; Sider's appeals to physics or fundamentality don't meet deflationist standards. Retiring the dispute might be the best option, as the debate has stagnated. 

