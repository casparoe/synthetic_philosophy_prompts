        "diagnosis": "Incoherent: Believes current systems have literal goals (N4→a) but that value learning (N6→a) resolves future alignment risks."
      },
      {
        "answer_path": "N1→b, N2→d, N3→a",
        "diagnosis": "Unattractive: Sees alignment as purely normative (N2→d) but also solvable by technical specification (N3→a) without coordination."
      }
    ],
    "unseparable_pairs": [
      {
        "leaves": ["L3", "L4"],
        "why": "Both require believing in goal-directed optimization (N4→a) and prioritizing technical solutions (N5→a/b); the tree separates via N6 (corrigibility vs learning vs architecture).",
        "split_that_would_help": "Added N6 distinguishes them based on preferred solution class."
      }
    ],
    "audience_warnings": [
      "Engineers may interpret 'goals' literally (N4) due to RL training, missing deflationary options.",
      "Philosophers might over-attribute normative weight to technical failures (N2→d for cases engineers see as bugs).",
      "Q1's 'simultaneous problems' option (d) may be under-chosen by those seeing alignment as purely technical."
    ]
  }
  ```

  ### Key Features:
  1. **Non-Jargon Branching**: Questions use concrete cases (ambulance routing, content moderation) without position labels. 
  2. **Pluralism as Leaf (L1)**: Captured via path N1→d or combinations like N2→c → N3→c.
  3. **10-15 Leaf Compliance**: 9 leaves cover requested positions while staying focused.
  4. **Axis Coverage**:
     - (1) Current vs. future: Q1
     - (2) Specification vs. execution: Q2
     - (3) Technical vs. political: Q3 and Q5
     - (4) Goal literalism: Q4
  5. **Distinct Leaves**: Inner/outer (L3) and value-learning (L4) separated via N6 priorities.
  6. **Unoccupied Paths**: Diagnosed as incoherent (mixing current-goal literalism with future-value-learning) or unattractive (technical fixes for political problems).
  7. **Audience Warnings**: Flags where engineers/philosophers may misinterpret questions.

  ### How to Use:
  - Participants start at N1 and follow answers to a leaf (L1-L9).
  - Leaves describe positions via core claims and awkward commitments.
  - Unseparable pairs show where positions might overlap (e.g., L3/L4 separated by N6).
  - Warnings help facilitators anticipate interpretation gaps.
