answer: |-
  ### **Dynasty Cycle Game: "Asabiyyah Rising"**  
  A 90-minute experiential game where students embody a dynasty across generations, facing Ibn Khaldun’s cycle of rise and decay. Designed so that attempts to "break the cycle" often backfire, reinforcing the theory.

  ---

  ### **Game Setup**  
  **Players:**  
  - Divide 14 students into **3 dynasties** (e.g., 5 + 5 + 4).  
  - Each dynasty has **3 generations** (teams of 1–2 students per generation).  
  - **Round 1:** Founders (all dynasties start identical).  
  - **Rounds 2–3:** New teams inherit the previous state. Rotate players so no one repeats generations.  

  **Materials (Printable):**  
  1. **Dynasty Sheet** (per dynasty): Tracks resources.  
  2. **Action Cards** (tax, expand, patronize arts, etc.).  
  3. **Map** (hex grid with core cities, frontiers, and rival camps).  
  4. **Resource Tokens** (Wealth, Cohesion, Military chips).  
  5. **GM Screen** (hidden rival strength tracker).  

  ---

  ### **Core Mechanics**  
  #### **1. State Attributes (Inherited Each Generation)**  
  - **Cohesion (C):** 0–10. *Internal solidarity*. Falls with luxury/inequality.  
  - **Wealth (W):** *Treasury*. Funds actions.  
  - **Military (M):** 0–10. *Army strength*. Costs Wealth to maintain.  
  - **Luxury (L):** 0–10. *Palaces, arts*. Rises with "soft" choices.  
  - **Territory:** Cities controlled (core + frontiers). More cities = more Wealth but higher revolt risk.  
  - **Rivals:** Nomadic groups on frontiers (strength hidden until they attack).  

  **Starting State (Founders):**  
  - Cohesion: 8 | Wealth: 5 | Military: 6 | Luxury: 0 | Territory: 3 core cities.  
  - Rivals: 1 frontier camp (strength: 3).  

  #### **2. Actions (Each Team Chooses 2 Per Round)**  
  | Action          | Cost          | Effect                                                                 | Cycle Trap Mechanism                                                                 |  
  |-----------------|---------------|-----------------------------------------------------------------------|--------------------------------------------------------------------------------------|  
  | **Tax**         | None          | +2 Wealth per city.                                                   | **-1 Cohesion per city taxed.** Elites resent high taxes → fuels rival recruitment. |  
  | **Expand**      | 3 Wealth      | Conquer a rival camp (roll M vs. GM’s rival strength).                | **Win**: New city (+2 Wealth). **Lose**: -2 Military. *Success creates new rivals on the frontier*. |  
  | **Patronize Arts** | 2 Wealth    | +2 Luxury. "Short-term gain": +1 Cohesion.                           | **If Luxury ≥5, Cohesion erodes by 1/round.** *Luxury feels necessary to boost cohesion but accelerates decay*. |  
  | **Buy Off Generals** | 4 Wealth  | +2 Military. Prevents coups.                                          | **-1 Cohesion.** Signals corruption → undermines trust in the dynasty.              |  
  | **Settle Tribes** | 1 Wealth   | Reduce rival strength by 2 (if Cohesion > rival strength).            | **Fails if Cohesion ≤ rival strength** → rivals grow stronger (+2 strength). *Irony: Weak dynasties empower rivals*. |  
  | **Fortify**     | 3 Wealth      | +2 Military permanently.                                             | Costs Wealth needed for cohesion → forces future taxation → cycle continues.        |  

  #### **3. Automatic Triggers (After Actions)**  
  - **Luxury Decay:** If Luxury ≥5, Cohesion -1/round. *Wealth softens the dynasty*.  
  - **Rival Growth:** If Cohesion ≤4, +2 strength to all rivals. *Low cohesion attracts marginalized groups*.  
  - **Collapse:** Cohesion ≤0 OR Military ≤0 → dynasty falls. Rivals take over.  

  #### **4. Winning**  
  - **Legacy Points:** (Territory × 2) + Wealth + (Cohesion × 3).  
  - **No cycle bonus:** Points reward *short-term survival*, not following the historical script.  

  ---

  ### **Game Flow (90 Minutes)**  
  1. **Intro (5 min):** Explain rules. Emphasize: *"Your goal is to maximize your dynasty’s legacy."*  
  2. **Round 1 (20 min):** Founders play. They start strong but must expand to survive.  
  3. **Round 2 (20 min):** Next generation inherits. Luxury/cohesion traps emerge.  
  4. **Round 3 (20 min):** Final generation. Most dynasties decay; 1–2 may survive.  
  5. **Scoring (5 min):** Calculate legacy points.  
  6. **Debrief (30 min):** Key questions below.  

  ---

  ### **Sabotaging "Escape Attempts"**  
  Students will try to avoid luxury or hoard cohesion. **Mechanics make this backfire:**  
  - **Avoiding Luxury?** You lack the Cohesion boost from Patronize Arts → forced to Tax/Buy Off Generals → Cohesion falls faster.  
  - **Hoarding Cohesion?** You skip Military actions → rivals grow → force you into costly wars.  
  - **"Modest Living" Action?** Added in Round 3: Spend 3 Wealth to reduce Luxury by 2. *But it’s too late*: Wealth is depleted, and rivals attack.  
  - **Irony:** Knowledge of the cycle makes players risk-averse → they underinvest → collapse faster.  

  ---

  ### **Debrief Framework (30 Minutes)**  
  **Goal:** Connect game events to theory and provoke meta-reflection.  

  #### **Part 1: Mapping the Cycle**  
  Ask each dynasty:  
  - *"When did your cohesion start fraying? What action caused it?"*  
    → Link to Ibn Khaldun’s "luxury phase."  
  - *"How did your rivals grow stronger? Was it your choices?"*  
    → Highlight "Settle Tribes" fails or taxation creating resentful margins.  
  - *"Did anyone try to break the cycle? Why did it work/fail?"*  
    → Cite game mechanics (e.g., "You avoided arts but taxed heavily → created rivals").  

  #### **Part 2: The Meta-Question**  
  Pose: *"If the cycle is real, does knowing about it change anything?"*  
  - **Hope for self-realization:** Players who tried to "escape" will admit their tactics accelerated decline.  
  - **Nudge:** *"Was your knowledge of the cycle just another tool that got co-opted by the game’s logic?"*  
  - **Key insight:** The attempt to "outsmart" history mirrors Ibn Khaldun’s point: *Cycles persist because rulers rationalize their decay as progress*.  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  1. **Scoring Exploits:**  
     - *Risk:* Players ignore rivals to max Wealth/Cohesion.  
     - *Fix:* Rivals auto-attack if Military ≤3 (GM: roll dice; lose 1 Territory on fail). Force engagement.  

  2. **"Sandbagging" the Next Generation:**  
     - *Risk:* Team 1 spends all Wealth, leaving Team 2 bankrupt.  
     - *Fix:* Legacy Points include **all generations’ final scores**. Sabotage hurts their own dynasty.  

  3. **Role Confusion (Nation vs. Family):**  
     - *Risk:* Students debate if they’re "rulers" or "the state."  
     - *Fix:* Start with: *"You are the royal council. Your bloodline rules the state."*  

  4. **Coup Attempts:**  
     - *Risk:* A student betrays teammates (e.g., "I defect to rivals!").  
     - *Fix:* Allow it! **Rule:** A player can stage a coup if Cohesion ≤3. Roll dice:  
       - Success: Dynasty loses 3 Cohesion.  
       - Failure: Executed (player sits out). *This mirrors Khaldun’s internal strife*.  

  5. **Time Crunch:**  
     - *Risk:* Round 1 overruns.  
     - *Fix:* Use a timer. GM moves slow groups along.  

  ---

  ### **What the Game Can’t Capture (Debrief Supplement)**  
  - **Religion/Charisma:** Ibn Khaldun saw religion as a cohesion booster. The game reduces this to "Patronize Arts." *Discuss:* "Could faith have changed your dynasty’s fate?"  
  - **Historical Specificity:** Cycles aren’t identical everywhere. *Note:* "Khaldun based this on Berber dynasties. Is it universal?"  
  - **Non-Linear Outcomes:** *Emphasize:* "In history, external shocks (famine, invasion) disrupt cycles. Your game had no earthquakes!"  

  ---

  ### **Why This Works**  
  - **Cycle Emerges Naturally:** Players tax → lose cohesion → rivals grow → repeat. No forced scripting.  
  - **Escape Attempts Backfire:** Mechanics turn "smart" strategies into self-sabotage.  
  - **Debrief Lights the Spark:** Students will argue whether their choices or the cycle’s "inevitability" doomed them.  

  Run it, embrace the chaos, and let Khaldun’s ghost smile.
