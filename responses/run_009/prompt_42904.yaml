  We are designing an in-class activity to illustrate Sen's liberal paradox. The goal is to have the students set up a mini-society with two constitutional clauses (minimal liberalism and unanimity) and then experience the paradox through a constructed preference profile.

  Structure:
  1. The class will draft and ratify a mini constitution with two clauses: 
     a. Sovereignty Clause (minimal liberalism): Each member is the final authority over one assigned personal matter (their "sovereign domain").
     b. Unanimity Clause (Pareto condition): If every member prefers outcome A to outcome B, then the society must choose A over B.

  2. We assign each student a sovereign domain (a trivial personal choice) and give them preference cards that include their preferences over their own domain and their neighbor's domain. The preferences are engineered so that the sovereignty clause forces an outcome that the unanimity clause would reject.

  3. The class will be set up in pairs (or small groups) with one pair per issue. We need 7 pairs (14 students) but if we have fewer, we can adjust. We'll have 6 pairs that are set up to create the paradox and 1 or 2 pairs that are harmless (to avoid immediate suspicion).

  4. We'll use tokens or chocolate for payoffs to make the preferences feel real.

  5. We'll have a constitutional court (2-3 students) to rule when the clauses collide.

  6. After the activity, we debrief and connect to the formal theorem.

  Materials:
  - Preference cards (one per student)
  - Token system (e.g., colored paper chips) or chocolate (e.g., M&Ms)
  - Whiteboard or flip chart for the constitution and recording outcomes
  - Timer

  Timeline (90 minutes total):
  - (0-15 min) Constitution drafting and ratification: Introduce the activity. Guide the class to draft and ratify the two clauses. Write them on the board.
  - (15-25 min) Assign roles and explain the game: Assign each student a sovereign domain (e.g., "what you wear to class", "what you read in public", "whether you play loud music in your dorm"). Hand out sealed preference cards. Explain that they must act according to their card and that there are payoffs (tokens/chocolate) for getting their preferred outcomes.
  - (25-50 min) Run the scenario: Each student exercises their sovereignty to decide their own domain. Then, the class observes the outcome and checks if there is a unanimity violation. The constitutional court may be called to resolve the conflict. Let the class discuss and try to resolve the dilemma.
  - (50-70 min) Group discussion: Open the floor for the class to discuss what went wrong and propose solutions. The constitutional court can issue a ruling.
  - (70-90 min) Debrief: Connect the experience to Sen's theorem. Discuss the implications and the objection about meddlesome preferences.

