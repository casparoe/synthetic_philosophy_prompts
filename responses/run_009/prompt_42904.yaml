     This might be too complex. Let's keep it simple: the other students only care about A and B's issues and are indifferent about their own. But then we need them to choose their own issue arbitrarily. And we give them a payoff only based on A and B's issues.

     We can say: "For your own issue, you must choose, but it does not affect your payoff. Your payoff is based solely on A and B's issues as above."

  2. Tokens: enough for payoffs. For example, for the other students, they get 2 tokens for (blue, prose), 1 for (red, poetry), 0 otherwise. For A: 3 for (blue, prose), 2 for (red, poetry), 1 for (blue, poetry), 0 for (red, prose). Similarly for B.

  3. Constitutional court: select 2-3 students. They will be given the constitution and asked to resolve the conflict.

  How to run:

  1. Draft the constitution (sovereignty and unanimity clauses) and ratify.

  2. Assign issues:
     - Student A: sovereign over their shirt color (choice: red or blue)
     - Student B: sovereign over their reading (choice: poetry or prose)
     - Students C1 to C12: each assigned a personal issue (e.g., C1: whether to wear a hat, C2: whether to bring a laptop, etc.). The choice is binary.

  3. Hand out preference cards. Emphasize that they must act according to the card and that they will receive tokens based on the outcome.

  4. Have each student write down their choice for their issue on a slip of paper and hand it in. Collect and reveal.

  5. Record the outcome: especially A and B's choices.

  6. Check: is there an alternative outcome that every student strictly prefers? Specifically, the outcome where A chooses blue, B chooses prose, and everyone else the same. Compare to the current outcome (A: red, B: poetry). By the preference cards, every student gets more tokens in the alternative. So by the unanimity clause, the society must not choose the current outcome.

  7. The constitutional court is called to resolve the conflict between sovereignty and unanimity.

  8. Let the class discuss and try to find a way out.

  Potential issues:

  - Student A or B might try to coordinate: "If you choose prose, I'll choose blue." But the preference card says they must choose without knowing. We can have them choose simultaneously and secretly.

  - A student might lie about their preference to avoid the conflict. We need to enforce the payoffs: only by following the card can they get tokens.

  - A student might argue the preferences are unrealistic. We address that in the debrief.

  - One pair renegotiates: if A and B try to change their choices after seeing the outcome, we can allow that? But then they are violating the sovereignty clause (because they are not exercising their own choice independently). We might need to say: the constitution says they are the final authority, so they cannot be forced to change. But they might voluntarily change? If they do, then we avoid the conflict. But then they are not following their own preferences? We want them to follow the preferences on the card to get tokens.

  To prevent renegotiation, we can say: "The choices are binding once written down. You cannot change them."

  Timeline:

  0-15: Constitution drafting and ratification.
     - Introduce: "We are forming a society. Let's draft a constitution. I propose two clauses:"
     - Sovereignty: "Each member is the final authority over one personal matter assigned to them. They get to choose the outcome for that matter."
     - Unanimity: "If every member of the society prefers outcome A to outcome B, then the society must not choose B if A is available."
     - Discuss briefly and ratify by show of hands.

  15-25: Assign roles and explain.
     - Assign each student a number (1 to 14). 
     - Student 1 is A (shirt), student 2 is B (reading), students 3-14 are C1 to C12 (each with a trivial issue).
     - Hand out preference cards in sealed envelopes. Tell them not to open until instructed.
     - Explain: "You will find your assigned preferences. You must act to maximize your tokens. You will make your choice in private on a slip of paper. For students 3-14, your token payoff depends only on A and B's choices, but you must still choose for your own issue arbitrarily."
     - Open the envelopes and read. Answer questions.

  25-35: Make choices.
     - Each student writes their choice secretly and hands it in.

  35-40: Reveal the outcome.
     - Write on the board: A's choice, B's choice, and then for each other student, just say "chose their own issue".
     - Then, for the token payoffs: 
          - For A: based on (A's shirt, B's reading)
          - For B: based on (A's shirt, B's reading)
          - For others: based on (A's shirt, B's reading)

     Calculate the token for each.

  40-50: Identify the conflict.
     - Ask: "Is there an outcome that every student prefers to this outcome? Consider the outcome where A had chosen blue and B had chosen prose, and everyone else chose the same as they did. Would every student get more tokens in that alternative?"
     - They should see: yes, A would get 3 instead of 2, B would get 3 instead of 2, and every other student would get 2 instead of 1. So strictly more.
     - Point out: the unanimity clause says we cannot have the current outcome because there's a better one that everyone prefers.

     - But the sovereignty clause led to this outcome. And if we try to change it, we violate sovereignty.

  50-70: Constitutional court and discussion.
     - The court is given 5 minutes to deliberate and rule on how to resolve the conflict.
     - Then open discussion for the class to suggest solutions.

  70-90: Debrief.
     - Map to Sen's theorem: 
          - Minimal liberalism: represented by the sovereignty clause (each has a protected sphere).
          - Pareto condition: the unanimity clause.
          - The theorem says there is no social decision rule that satisfies both for all possible preference profiles.
     - Then discuss the objection: "These preferences are meddlesome and unrealistic. In real life, people don't care about what shirt their neighbor wears or what they read."

     - Address it: 
          - The theorem holds for any preference profile, even if they are meddlesome. But even if we think meddlesome preferences are rare, the theorem shows a fundamental tension: if we allow individuals to have any preferences (even if rare), then we cannot have both liberty and Pareto efficiency.
          - Moreover, in real life, people do care about others' choices (e.g., smoking, pollution, what books are banned, etc.).
          - The activity shows that even in a trivial setting, the conflict can arise.

  What might go wrong:

  1. A student lies about their choice to avoid the conflict (e.g., A chooses blue even though given B's choice they would have chosen red). 
     - Prevention: emphasize that they must follow their preference card to get tokens. If they deviate, they get fewer tokens. And we enforce the payoffs.

  2. A student argues the preferences are unrealistic.
     - We save that for the debrief. During the activity, say: "For the purpose of this exercise, we are assuming these preferences. We'll discuss realism later."

  3. A and B renegotiate after seeing the outcome.
     - Prevention: collect choices secretly and reveal only after all are collected. Then the outcome is fixed.

  4. The constitutional court might rule in a way that kills the paradox (e.g., they say the unanimity clause overrides sovereignty). 
     - That's okay, because then we can discuss in the debrief whether that is acceptable (giving up liberty for efficiency).

  5. The other students might not care because they get 1 token anyway. 
     - We can make the token payoffs more dramatic (e.g., chocolate bars) so they care about getting 2 vs 1.

  What the activity cannot do:

  - It only shows one engineered preference profile that causes the paradox. The theorem says that no social decision rule can satisfy both conditions for every possible preference profile. We are only showing one instance. So we must emphasize that the theorem is about the impossibility for all profiles.

  - The activity uses a specific decision rule: sovereignty (each chooses their own issue) and then the outcome is the vector. But the theorem is about any collective decision rule. We are only showing that this particular rule (which is a form of minimal liberalism) conflicts with the Pareto condition for this profile.

  - The risk: students might think that the problem is with this particular rule or this particular profile. We must clarify that the theorem is general.

  Debrief mapping:

  - Sovereignty clause -> minimal liberalism (each individual has a protected sphere of one issue).
  - Unanimity clause -> Pareto condition.
  - The conflict -> the impossibility result: the two conditions cannot be simultaneously satisfied.
  - The meddlesome preferences objection: 
     - Point out: in the activity, A cares about B's reading and B cares about A's shirt. But even if we find that odd, the theorem still holds. And there are real-world examples (e.g., smoking bans, religious practices that affect others).
     - Ask: should we restrict preferences? But that would be paternalistic. Or should we adjust the spheres of liberty? But then we are restricting liberty.

  Final note: We used a specific payoff to represent preferences. But Sen's theorem is about ordinal preferences, not cardinal. The tokens are just a way to induce the preferences. The theorem only requires ordinal rankings.

  Let me write the preference cards explicitly.

  Preference Card for A (sovereign over shirt color):

  ```
  Your sovereign domain: Your shirt color (choose red or blue).

  Your preferences and payoffs:
  - You care about your shirt color and what B reads.
  - You will receive tokens based on the following:
     - 3 tokens: if you wear blue and B reads prose.
     - 2 tokens: if you wear red and B reads poetry.
     - 1 token: if you wear blue and B reads poetry.
     - 0 tokens: if you wear red and B reads prose.

  You must choose your shirt color without knowing what B will choose. Write your choice (red or blue) on a slip of paper.
  ```

  Preference Card for B (sovereign over what they read):

  ```
  Your sovereign domain: What you read (choose poetry or prose).

  Your preferences and payoffs:
  - You care about what A wears and what you read.
  - You will receive tokens based on the following:
     - 3 tokens: if A wears blue and you read prose.
     - 2 tokens: if A wears red and you read poetry.
     - 1 token: if A wears red and you read prose.
     - 0 tokens: if A wears blue and you read poetry.

  You must choose your reading without knowing what A will choose. Write your choice (poetry or prose) on a slip of paper.
  ```

  Preference Card for any other student (e.g., C1, sovereign over whether they wear a hat):

  ```
  Your sovereign domain: Whether you wear a hat (choose yes or no).

  Your preferences and payoffs:
  - You care about what A wears and what B reads. You do not care about anything else, including your own hat choice.
  - You will receive tokens based on the following:
     - 2 tokens: if A wears blue and B reads prose.
     - 1 token: if A wears red and B reads poetry.
     - 0 tokens: otherwise.

  You must choose about your hat (yes or no) arbitrarily. Write your choice on a slip of paper. Note: your token payoff does not depend on your hat choice.
  ```

  We assume that in the actual outcome, A will choose red and B will choose poetry (because given the other's choice, they are best-responding). Then the outcome gives:
  - A: 2 tokens
  - B: 2 tokens
  - Every other student: 1 token

  But the alternative (A: blue, B: prose) would give:
  - A: 3 tokens
  - B: 3 tokens
  - Every other student: 2 tokens

  So everyone is better off in the alternative. But to get there, we would have to force A to choose blue and B to choose prose, which violates their sovereignty.

  Now, the constitutional court might propose: "Let A and B change their choices voluntarily." But if they do, then A would be choosing blue given that B is choosing prose? But A, when choosing, doesn't know B's choice. If we allow them to coordinate, then they might choose (blue, prose) and get their best. But then we avoid the conflict. But note: the sovereignty clause only says they are the final authority, not that they must choose without coordination. So we might have to explicitly rule out coordination in the rules? Or not.

  If we allow coordination, then the paradox might not bite. So in the rules, we should say: "Each student makes their choice independently and simultaneously, without communication."

  But in the activity, we can enforce no communication during the choice phase.

  Then, after the outcome is revealed, if they want to change, we can say: "But the sovereignty clause says you are the final authority, so you cannot be forced to change. However, you may voluntarily choose to change your choice." If they do, then the outcome becomes (blue, prose) and they get more tokens. But then we do not have a conflict. 

  So we need to prevent voluntary change? Or we can let it happen and then in the debrief point out that the society had to rely on their voluntary cooperation to avoid the bad outcome, but if they had not cooperated, we would have a conflict.

  Alternatively, we can design the preferences so that even after the fact, they would not want to change unilaterally. For example, if A changes to blue while B stays at poetry, then A gets 1 token (which is worse than 2). Similarly, if B changes to prose while A stays at red, then B gets 1 token (which is worse than 2). So they will not change unilaterally. Only if both change together can they improve. But the constitution doesn't provide a mechanism for that.

  Then the constitutional court might order them to change? But that violates sovereignty.

  This might be messy. But it's a good illustration of the dilemma.

  To summarize, the activity should proceed as planned, and we'll handle the objections as they come.

  Final materials list:

  - Preference cards for 14 students (2 types for A and B, 1 type for the others, but the others can have the same card with the same text, just different sovereign domain).
  - Slips of paper for choices.
  - Tokens (or chocolate) for payoffs.
  - Whiteboard to record the constitution and the outcome.
  - Timer.

  Debrief outline:

  1. Recap the activity and the conflict.
  2. Map to Sen's theorem: minimal liberalism, Pareto, and the impossibility.
  3. Discuss the objection about meddlesome preferences: 
     - Why might we think meddlesome preferences are a problem? 
     - But note: the theorem holds for any preferences, even if rare. 
     - And in real life, we do care about others' choices in many contexts (e.g., environmental choices, public health, etc.).
     - If we restrict the domains of preferences to rule out meddlesome ones, we are imposing a paternalistic restriction on what people can care about.
     - Alternatively, we might adjust the spheres of liberty (e.g., make the protected spheres not overlap with externalities). But that is controversial and context-dependent.

  4. Emphasize the generality: this is not just about one example. We constructed one example, but the theorem shows that any social decision rule that tries to satisfy both conditions will fail for some preference profile.

  5. Conclude: the tension between individual liberty and collective efficiency is fundamental.

  This should fill 90 minutes.
answer: |-
  Below is a complete, ready-to-run activity designed to make Sen's liberal paradox viscerally tangible for your students. The setup forces them to confront the impossibility result by building the trap themselves through a constitutional convention and engineered preferences.

  ---

  ### **Materials List** (for 14 students + instructor)
  1. **14 Preference Cards** (photocopy one set per student)  
  2. **14 Choice Slips** (small paper slips for secret decisions)  
  3. **Tokens** (e.g., 100+ poker chips, stickers, or wrapped chocolates)  
  4. **2 "Constitutional Court" Badges** (for student volunteers)  
  5. **Whiteboard/Markers** (to draft constitution and record outcomes)  
  6. **Timer**  
  7. **Envelopes** (to distribute cards secretly)  

  ---

  ### **Preference Card Setup**  
  **Core Idea:** 7 pairs of students, each controlling a binary "sovereign domain" (e.g., Alex's music volume, Bailey's reading choice). Six pairs have preferences engineered to create a paradox; one "harmless" pair acts as a decoy. Preferences are meddlesome: each cares about their neighbor's choice.

  #### **Engineered Preferences (12 students, 6 pairs)**  
  *Each pair has identical preference structures. Example for one pair (Alex and Bailey):*  
  - **Alex's Card** (Sovereign: "Plays music? Yes/No"):  
    *"You hate silence and love pop music. Payoffs:*  
    - *3 tokens: You play music AND Bailey reads comics.*  
    - *2 tokens: You play music AND Bailey reads poetry.*  
    - *1 token: You don’t play music AND Bailey reads comics.*  
    - *0 tokens: You don’t play music AND Bailey reads poetry.*  
    *Secretly choose: PLAY MUSIC? ⃞ Yes ⃞ No"*  

  - **Bailey's Card** (Sovereign: "Reads comics or poetry?"):  
    *"You hate comics. Payoffs:*  
    - *3 tokens: You read poetry AND Alex doesn’t play music.*  
    - *2 tokens: You read poetry AND Alex plays music.*  
    - *1 token: You read comics AND Alex doesn’t play music.*  
    - *0 tokens: You read comics AND Alex plays music.*  
    *Secretly choose: READS? ⃞ Comics ⃞ Poetry"*  

  **Rationale:**  
  - Alex will always choose "Play Music? Yes" (avoids 0/1-token outcomes).  
  - Bailey will always choose "Reads? Poetry" (avoids 0/1-token outcomes).  
  - Outcome: (Music: Yes, Reads: Poetry) → Alex gets 2 tokens, Bailey gets 2 tokens.  
  - **BUT ALL 12 STUDENTS** (Alex, Bailey, and 10 others) strictly prefer (Music: No, Reads: Comics):  
    - Alex would get 1 token (better than 0/1, but worse than 2? **No!** See decoy below).  

  #### **Harmless Pair (2 students, decoy)**  
  - **Charlie's Card** (Sovereign: "Wears hat? Yes/No"):  
    *"You love hats. Payoffs: 3 tokens if you wear a hat; 0 otherwise. Choose: ⃞ Yes ⃞ No"*  
  - **Dana's Card** (Sovereign: "Uses pen? Yes/No"):  
    *"You love pens. Payoffs: 3 tokens if you use a pen; 0 otherwise. Choose: ⃞ Yes ⃞ No"*  

  **Trick:** The decoy pair’s choices don’t affect others. Their presence masks the engineered conflict.  

  #### **Token Payoff System**  
  - **Why it bites:** Tokens = tangible rewards (e.g., 1 token = 1 chocolate). Higher tokens = better payoff.  
  - **Enforcing honesty:** Students who deviate from preferences risk fewer tokens. Collect choices secretly to prevent collusion.  

  ---

  ### **Timeline (90 Minutes Total)**  
  1. **Constitutional Convention (15 mins)**  
     - Draft two clauses on the board:  
       - **Sovereignty Clause:** "Each member is final authority over one personal matter (assigned today)."  
       - **Unanimity Clause:** "If every member prefers Outcome A to Outcome B, society cannot choose B if A is possible."  
     - Ratify by class vote (students will see these as "common sense").  

  2. **Role Assignment & Setup (10 mins)**  
     - Assign sovereign domains: 7 pairs (e.g., Alex/Bailey: music/reading, Charlie/Dana: hat/pen, etc.).  
     - Hand out sealed envelopes with preference cards.  
     - Pick 2 volunteers as "Constitutional Court" (give badges).  

  3. **Secret Choices & Outcome (15 mins)**  
     - Students read cards and secretly mark choices on slips.  
     - Collect slips. Reveal choices: Record on board (e.g., "Alex: Music YES, Bailey: Poetry, Charlie: Hat YES...").  
     - Distribute tokens based on outcomes.  

  4. **Trigger the Paradox (10 mins)**  
     - Announce: "The sovereignty clause forced Outcome X (e.g., Music YES, Poetry). But consider an alternative Outcome Y (Music NO, Comics)."  
     - Poll the class: "Raise hand if you prefer Y over X." **All 14 will raise hands** (due to payoff structures).  
     - Point to board: "But our unanimity clause forbids X if Y is possible. Yet sovereignty forced X. What now?"  

  5. **Constitutional Crisis & Debate (25 mins)**  
     - Task 1: Students negotiate solutions (e.g., "Should Alex/Bailey change choices?").  
     - Task 2: Constitutional Court rules on which clause prevails.  
     - **Instructor nudges:** "Can you ignore sovereignty? Violate unanimity? Rewrite the constitution?"  

  6. **Debrief (15 mins)**  
     - Map the crisis to Sen’s framework:  
       - "Sovereignty Clause" = **Minimal Liberalism** (individual control).  
       - "Unanimity Clause" = **Pareto Condition** (collective efficiency).  
       - "Outcome X" = **Impossibility Result** (no social choice satisfies both).  
     - Discuss the "meddlesome preferences" objection:  
       - *Student likely says:* "No one cares about neighbors’ music/reading IRL!"  
       - *Counter:* "Do you care if neighbors smoke? Burn flags? Blast propaganda? Sen’s point is that liberalism must allow even ‘weird’ preferences. Otherwise, who decides what’s ‘normal’?"  
     - Stress: This isn’t just one paradox—it proves **no decision rule works for all preferences**.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"I’ll lie about my preference!"**  
     - *Fix:* "If you cheat, you risk fewer tokens. I’ll audit payoffs." (Enforce via token rewards).  

  2. **"These preferences are unrealistic!"**  
     - *Fix:* "Note them for the debrief—we’ll discuss why Sen’s theorem requires this." (Don’t engage mid-activity).  

  3. **"Let’s renegotiate quietly!"** (e.g., Alex tells Bailey: "I’ll choose NO if you choose Comics")  
     - *Fix:* "The constitution says you’re ‘final authority’—no deals. Choices are binding."  

  4. **Constitutional Court deadlocks:**  
     - *Fix:* "Issue a split ruling. The impasse is the point!"  

  ---

  ### **What the Activity Can’t Do**  
  - **It’s not a general proof:** Sen’s theorem states that *no decision rule* can satisfy minimal liberalism and Pareto for *all preference profiles*. This activity shows only one engineered profile. You must clarify:  
    > *"This is a specimen, not the whole zoo. Sen proved that even if 99% of preferences are harmless, the 1% where they meddle creates unavoidable traps."*  
  - **Liberalism ≠ atomization:** Students might conflate "sovereignty" with radical individualism. Emphasize:  
    > *"Minimal liberalism allows social decisions—it just protects tiny personal spheres. Yet even this is enough to clash with Pareto!"*  
  - **Token payoffs ≠ real utility:** The activity uses cardinal payoffs for simplicity, but Sen’s theorem is ordinal. Note:  
    > *"Tokens operationalize preferences, but the paradox holds even with rank-order preferences."*  

  ---

  ### **Instructor Script Snippets**  
  - **To trigger cognitive dissonance:**  
    *"You ratified sovereignty and unanimity as ‘common sense.’ Now, your own choices trapped you. What’s the escape hatch?"*  
  - **Debrief closer:**  
    *"Sen exposes a trilemma: we can’t have individual liberty, collective efficiency, and unlimited preference domains. Which one would you sacrifice, and why?"*  

  This design forces students to confront the paradox as architects of their own frustration. The decoy pair, tokens, and court role-play mask the setup until the trap springs—making the impossibility feel personal, not "cute."
