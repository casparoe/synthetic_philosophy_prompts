prompt: |-
  I spent thirty-five years in a physiology lab and I've been retired for a while now, but the journal I reviewed for over the years broadened its scope a few years back, and they keep sending me evolutionary psychology manuscripts — four or five a year — apparently on the theory that an old physiologist who knows his statistics is close enough. Since retiring I've gotten deep into philosophy of science, and I keep running into the complaint that a lot of this work is "just-so stories" — the Kipling reference, after the giraffe one. Meanwhile my evolutionary biology friends tell me that's a lazy slur, that there are real tests you can run on adaptationist hypotheses, and that the people making the complaint don't hold papers in other fields to anything like that standard. I don't want to be the referree who either waves everything through because it sounds Darwinian, or rejects everything because the hypotheses are about the past and you can't rerun evolution.

  So here's what I'm asking for: a decision procedure I can actually run when one of these manuscripts lands in my queue. Something I can work through in an afternoon before writing a review that an editor and the authors will actually read. I want the questions in order, what a paper has to show at each step to pass, where the procedure outputs "reject" or "major revisions," and — importantly — where it has to stop and admit the remaining question is a plausibility judgment that no checklist can make for me. The distinction I care most about is whether a trait is an adaptation for the function the authors claim, versus a byproduct of something else, versus an old adaptation co-opted for a new use. If the procedure can't handle that three-way distinction it's useless to me. I'd also like it to say where it will misfire — the kinds of papers it will pass that it shouldn't, or kill unfairly.

  Then run it on three manuscripts so I can see it work:

  (1) A hypothesis paper arguing that morning sickness is an adaptation protecting the embryo from plant toxins during organogenesis. The timing fits, the toxin data is assembled from other literatures, there's no experiment, but there is a testable prediction about miscarraige rates differing across traditional diets.

  (2) An empirical paper with decent sample sizes finding that women's preference for the color pink is somewhat stronger in the luteal phase, and the authors interpret this as a leftover adaptation for tracking ripe fruit. Clean-ish data, wild interpretation. What does the procedure do with a case where the data and the story are doing different amounts of work?

  (3) One where I suspect the procedure will hand me an answer I won't like: an experiment on fear learning showing that people, and lab-raised monkeys, acquire snake and spider aversions from a single pairing with a photo, while flowers and mushrooms need many trials, and the authors read this as evidence of evolved prepared learning. My gut is to be annoyed by anything with "evolved" in the interpretation section, but the design looks clean.

  One request I want respected throughout: separate what's actually settled — among philosophers of biology and evolutionary biologists who know this stuff — from what's genuinely contested. I've been burned by philosophy books that present one side of an argument as if it were the consensus, and at my age I'd rather know when I'm standing on a plank somebody's sawing at from the other end. So wherever the procedure encodes a standard that people in the field actually fight about, flag it rather than baking it in silently.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired physiologist reviewing evolutionary psychology papers and wants a practical decision tool to evaluate adaptationist claims. They're frustrated with the "just-so story" criticism but also wary of overcredulous Darwinian explanations. 

  First, I need to recognize their expertise constraints: deep in physiology/philosophy of science but not evolutionary biology specifically. Their core request is for a step-by-step filter that distinguishes adaptations from byproducts/exaptations, with clear rejection points and transparency about where subjective judgment begins.

  The three manuscript examples are cleverly chosen to test different weak points: 
  (1) Classic adaptationist hypothesis without new data
  (2) Solid data with questionable interpretation 
  (3) Clean experiment with controversial evolutionary framing

  Key challenges I must address:
  - Balancing philosophy of science concerns (Gould/Lewontin critiques) with modern evolutionary biology methods (like Tinbergen's levels)
  - Providing concrete thresholds while flagging contested standards
  - Distinguishing testable predictions from plausibility arguments

  For the decision procedure, I'll adapt Brandon's criteria for adaptation claims but modify it for practicality in peer review. Need to include: 
  1. Current utility demonstration (non-trivial)
  2. Exclusion of alternatives (byproduct/exaptation)
  3. Evidence hierarchy (comparative > correlational > predictive)
  4. Clear "reject/major revisions" thresholds at each step

  Crucially, I must annotate where professional disagreement exists - e.g., whether frequency-dependent selection needs direct evidence, or if phylogenetic inertia arguments are considered sufficient for rejection. The "plausibility judgment" flag points should align with ongoing debates in Evolution/EHB journals.

  For the test cases:
  - Morning sickness paper fails at step 4 (no direct toxin protection test) but gets conditional pass due to predictive novelty
  - Pink preference study highlights how good data can't rescue weak evolutionary framing (fails at step 3)
  - Fear learning paper reveals where the procedure might be too strict - the evo psych framing is shaky but the biological preparedness evidence is solid

  Throughout, I'll maintain their requested separation between settled science (e.g., adaptation requires current utility) and contested ground (e.g., whether exaptation claims need phylogenetic evidence). The "misfire warnings" will acknowledge where the tool could reject innovative work or pass circular arguments.
answer: |-
  Here's a decision procedure distilled from key principles in evolutionary biology (Brandon, 1990; Williams, 1966; Andrews et al., 2002) and philosophy of science (Sober, 2000; Godfrey-Smith, 2001), designed for practical manuscript evaluation. It prioritizes **testability** and **alternative elimination**, with explicit flags for contested steps.

  ---

  ### **The Adaptation Evaluation Procedure (AEP)**
  **Core Distinction:** Adaptation (trait evolved *for* function X) vs. Byproduct (non-selected consequence of another trait) vs. Exaptation (trait evolved for Y, later co-opted for X).

  #### **Step 1: Is the Claim an Adaptationist Hypothesis?**
  *   **Question:** Does the paper claim trait T is an *adaptation* for specific function X?
  *   **Pass:** Explicitly states T is an adaptation for X.
  *   **Reject/Major Revisions:** Vague "evolutionary" claims without specifying adaptation.  
  *   **Output:** If not adaptationist, exit AEP (review on other grounds).

  #### **Step 2: Is Function X Currently Demonstrated?**
  *   **Question:** Does the paper provide evidence that T *currently performs* X effectively?
  *   **Pass:** Empirical data showing T achieves X in contemporary humans (e.g., toxin avoidance, predator detection). Physiological/behavioral evidence is key.
  *   **Fail:** Only assertion or indirect evidence (e.g., "T exists, therefore it must do X").  
  *   **Reject/Major Revisions:** No evidence of current utility for X.  
  *   **Settled:** Adaptation requires *current* utility (Williams, 1966). If T doesn't *do* X now, it can't be an adaptation *for* X.

  #### **Step 3: Is X the *Only* Plausible Function? (Eliminate Alternatives)**
  *   **Question:** Does the paper rule out other functions Y or Z that T could serve?  
  *   **Pass:** Explicitly tests/comparatively analyzes multiple functions (e.g., "Is morning sickness *better* at toxin avoidance than at preventing pathogen ingestion?"). Uses phylogenetic comparison or functional trade-off analysis.  
  *   **Fail:** Only argues *for* X without addressing alternatives (e.g., pink preference as fertility signal vs. fruit detection).  
  *   **Major Revisions:** Requires testing key alternatives or rigorous comparative argument.  
  *   **Contested:** How strongly must alternatives be ruled out? Some (Gould & Lewontin) demand near-exhaustion; others (adaptationists) accept "best current explanation." **Flag:** This is a major battleground.

  #### **Step 4: Is There Evidence Against T Being a Byproduct?**
  *   **Question:** Could T be a non-selected consequence of another adaptation?  
  *   **Pass:** Evidence that T is *not* inextricably linked to a known byproduct generator (e.g., showing morning sickness isn't just a side effect of progesterone surges).  
  *   **Fail:** No discussion of byproduct potential (e.g., pink preference as sensory bias from general color vision).  
  *   **Major Revisions:** Must address plausible byproduct hypotheses.  
  *   **Settled:** Failure to consider byproducts is a fatal flaw (Gould & Vrba, 1982).

  #### **Step 5: Is There Evidence Against T Being an Exaptation?**  
  *   **Question:** Could T have evolved for function Y, and only later been used for X?  
  *   **Pass:** Phylogenetic evidence (T exists in ancestors without X), or developmental evidence (T emerges before X is relevant).  
  *   **Fail:** Ignores exaptation possibility (common in evo psych).  
  *   **Major Revisions:** Must address exaptation (e.g., "Why is snake fear not an exaptation of general fear learning?").  
  *   **Contested:** How much evidence is needed? Some require ancestral state reconstruction; others accept parsimony arguments. **Flag:** Contentious.

  #### **Step 6: Is the Selective Pathway Plausible? (The "Just-So" Check)**  
  *   **Question:** Is there evidence for *selection* *specifically* for X?  
  *   **Pass:**  
      *   a) **Population Variation:** Shows variation in T correlates with fitness differences via X (e.g., women with stronger nausea have fewer toxin-related miscarriages).  
      *   b) **Comparative:** Shows T co-occurs with selective pressure X across species/ecologies.  
      *   c) **Design Evidence:** Trait T shows non-trivial complexity *specifically suited* to X (e.g., nausea timing matches organogenesis vulnerability).  
  *   **Fail:** Relies solely on "X would be beneficial" logic.  
  *   **Reject/Major Revisions:** No pathway evidence.  
  *   **Contested:** What counts as "plausible"? Some accept design evidence alone (e.g., Cosmides & Tooby); others demand population/genetic evidence (e.g., Piantadosi et al.). **Flag:** Core debate.

  #### **Step 7: Are Predictions Testable and Tested?**  
  *   **Question:** Does the paper generate *novel*, *risky* predictions beyond the data explained?  
  *   **Pass:** Predictions are specific, falsifiable, and ideally tested (e.g., "Groups with low-toxin diets should have lower nausea rates").  
  *   **Fail:** Only post-hoc explanations or untestable predictions.  
  *   **Major Revisions:** Requires stronger predictions or preliminary tests.  
  *   **Settled:** Testable predictions are essential for scientific hypotheses (Popper).

  #### **Step 8: Plausibility Judgment (Where Checklists End)**
  *   **Question:** After Steps 1-7, does the adaptation claim *feel* like the best explanation?  
  *   **Output:** Human judgment required. Consider:  
      *   Parsimony vs. complexity of the story.  
      *   Consistency with established biology.  
      *   Strength of alternatives.  
  *   **Settled:** All science involves judgment calls at the frontier.  
  *   **Contested:** How much weight to give "plausibility"? Philosophers debate this endlessly.

  ---

  ### **Where the AEP Misfires**
  *   **False Passes:**  
      *   "Clever" hypotheses with strong design evidence but no selective pathway data (e.g., highly speculative cognitive modules).  
      *   Papers misusing comparative data (e.g., ignoring phylogeny).  
  *   **False Rejects:**  
      *   Novel adaptations with weak current utility data but strong pathway evidence.  
      *   Exaptations misclassified if ancestral function evidence is lost.  

  ---

  ### **Applying the AEP to Your Manuscripts**

  #### **(1) Morning Sickness as Toxin Avoidance Adaptation**
  *   Step 1: **Pass** (Clear adaptation claim).  
  *   Step 2: **Pass?** Timing/data suggest *correlation* with protection, but no direct evidence embryos *are* protected. **Major Revisions:** Need toxin absorption/miscarriage data.  
  *   Step 3: **Fail.** Doesn't address alternatives (e.g., pathogen avoidance, resource conservation). **Major Revisions.**  
  *   Step 4: **Fail.** Doesn't rule out byproduct (e.g., of hormone changes). **Major Revisions.**  
  *   Step 5: **N/A** (Not claiming exaptation).  
  *   Step 6: **Partial Pass.** Design evidence (timing) is strong. Lacks variation/fitness data. **Major Revisions:** Suggest testing prediction across diets.  
  *   Step 7: **Pass.** Prediction about diets is testable.  
  *   Step 8: Plausible but **not compelling** without Steps 3-4 addressed.  
  *   **Verdict:** **Major Revisions.** Strong core idea but must address alternatives/byproducts and strengthen utility evidence.

  #### **(2) Pink Preference as Ripe Fruit Tracker**
  *   Step 1: **Pass** (Adaptation claim).  
  *   Step 2: **Fail.** No evidence pink preference *currently* aids fruit detection. Data shows cycle fluctuation, not function. **Reject/Major Revisions.**  
  *   Step 3: **Fail.** Ignores alternatives (e.g., social signaling, sensory bias). **Reject.**  
  *   Step 4: **Fail.** Doesn't address byproduct (e.g., of general color perception). **Reject.**  
  *   **Verdict:** **Reject.** Clean data ≠ evolutionary function. Interpretation is untethered to adaptation criteria. Falls at Step 2.

  #### **(3) Prepared Fear Learning for Snakes/Spiders**
  *   Step 1: **Pass** ("Evolved prepared learning" implies adaptation).  
  *   Step 2: **Pass.** Current utility: faster aversion acquisition *is* a protective function.  
  *   Step 3: **Partial Pass.** Notes flowers/mushrooms differ. Could address more alternatives (e.g., is it general "threat" detection?). **Minor Revisions.**  
  *   Step 4: **Pass.** Actively rules out byproduct (uses lab-raised monkeys, showing not cultural).  
  *   Step 5: **Pass?** Not claiming exaptation, but could note if fear system is general. **Adequate.**  
  *   Step 6: **Pass.** Strong design evidence (specificity, efficiency). Pathway plausible (snakes/spiders were ancient threats).  
  *   Step 7: **Pass.** Predictions testable (e.g., with other threats like big cats).  
  *   Step 8: **Plausible.** Consistent with fear biology, strong design evidence.  
  *   **Verdict:** **Accept/Minor Revisions.** Your "gut annoyance" is valid (overstated "evolved" claims are grating), but the *evidence* meets adaptation criteria well. This is how good evo psych looks.

  ---

  ### **Key Contested Points (Where Planks Are Being Sawed)**
  1.  **Step 6 (Selective Pathway):** Adaptationists vs. "Straw Man" Critics: How much evidence is enough? Some argue strong design + comparative evidence suffices; others demand population-genetic data rarely possible for humans.  
  2.  **Step 3 (Alternatives):** How exhaustive must alternative elimination be? Critics demand near-impossible standards; adaptationists argue this paralyzes science.  
  3.  **Step 8 (Plausibility):** Role of intuition/background knowledge vs. strict falsification. Philosophers (e.g., Fodor vs. Pinker) clash violently here.  

  **Your Role:** Judge if the paper meets *reasonable* standards for its evidence type. Hold evo psych to the *same* standard you'd hold physiology: testable hypotheses, controlled data, alternative explanations considered. Use the AEP to force explicit reasoning, not as a mechanical rejector. When in doubt, demand **stronger predictions** – the hallmark of science that moves forward.
